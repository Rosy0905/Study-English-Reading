const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A historical model built on a shared interest</strong></p><p><strong>B. Music as a route for communicating climate science</strong></p><p><strong>C. The appeal of working across art and science</strong></p><p><strong>D. A partnership in which neither side is merely an assistant</strong></p><p><strong>E. A permanent end to criticism between disciplines</strong></p><p><strong>F. Commitment and openness beyond communication alone</strong></p><p><strong>G. Artists as objects to be studied and nothing more</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future. Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#x27;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#x27;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#x27;s United Nations Climate Change Conference in Glasgow, UK.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#x27;s work. Such an approach can both prompt new research as well as result in powerful art.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Nature&#x27;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Partnerships between artists and researchers attract many people who describe them as stimulating and challenging. A survey of readers found substantial experience of such projects and widespread interest in future participation. Their enthusiasm invites a closer look at what makes collaboration valuable.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises. Participants must resist fixed ideas about what the other group does. Researchers and artists share commitments to discovery and invention, even when their methods and forms of expression differ.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>One recognised value is communication. Artists can help scientific work reach audiences that might otherwise overlook it, and emotional connections can strengthen learning. This contribution explains why researchers increasingly seek visual and performing artists as partners.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>A historical example of this relationship is the centre established at MIT to explore technology’s role in culture. Its projects focused on light because both artists and scientists found it interesting. A common subject provided a basis for crossing boundaries without making one side subordinate.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>Valuable as communication is, a genuine partnership cannot reduce artists to assistants serving scientific needs. Their work should not be treated only as an object of study either. Both sides need a stake in the project and a voice in its design.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>A musical performance incorporating climate predictions illustrates that contribution. Data for the seasons were used to reshape a familiar score, giving listeners a different way to encounter scientific information. The performance connected communication with a call for public action.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Shared design also allows participants to question and critique one another’s work. Such exchanges can generate new research as well as powerful art. The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Recognising these shared commitments can extend collaboration beyond the transmission of finished research. Communication remains useful, but it is one purpose among several. A productive alliance gives both sides opportunities to discover, create and revise their understanding.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>enlightening</td>\n<td>adj.启发性的</td>\n<td>challenging</td>\n<td>adj.有挑战性的</td>\n<td>stimulating</td>\n<td>adj.激励人的</td>\n</tr>\n<tr>\n<td>collaborations</td>\n<td>n.合作</td>\n<td>partnerships</td>\n<td>n.伙伴关系</td>\n<td>accompanying</td>\n<td>adj.伴随的</td>\n</tr>\n<tr>\n<td>poll</td>\n<td>n.调查</td>\n<td>responded</td>\n<td>v.回应</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>encouraging</td>\n<td>adj.令人鼓舞的</td>\n<td>visual artists</td>\n<td>视觉艺术家</td>\n<td>communicate</td>\n<td>v.传播；交流</td>\n</tr>\n<tr>\n<td>audiences</td>\n<td>n.受众</td>\n<td>broader</td>\n<td>adj.更广泛的</td>\n<td>emotional connections</td>\n<td>情感联系</td>\n</tr>\n<tr>\n<td>enhance</td>\n<td>v.增强</td>\n<td>respondent</td>\n<td>n.受访者</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>orchestra</td>\n<td>n.管弦乐团</td>\n<td>performed</td>\n<td>v.演奏</td>\n<td>reworked</td>\n<td>adj.改编的</td>\n</tr>\n<tr>\n<td>score</td>\n<td>n.乐谱</td>\n<td>injecting</td>\n<td>v.融入</td>\n<td>prediction</td>\n<td>n.预测</td>\n</tr>\n<tr>\n<td>creative</td>\n<td>adj.有创造性的</td>\n<td>call to action</td>\n<td>行动呼吁</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第4段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>genuine</td>\n<td>adj.真正的</td>\n<td>two-way street</td>\n<td>双向关系</td>\n<td>assist</td>\n<td>v.协助</td>\n</tr>\n<tr>\n<td>requirements</td>\n<td>n.需求</td>\n<td>alliances</td>\n<td>n.合作联盟</td>\n<td>shared stake</td>\n<td>共同利益</td>\n</tr>\n<tr>\n<td>jointly</td>\n<td>adv.共同地</td>\n<td>critique</td>\n<td>v.评论；批评</td>\n<td>prompt</td>\n<td>v.促成</td>\n</tr>\n</tbody></table></div>\n<h2>第5段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>explore</td>\n<td>v.探索</td>\n<td>founders</td>\n<td>n.创立者</td>\n<td>deliberately</td>\n<td>adv.有意地</td>\n</tr>\n<tr>\n<td>basis</td>\n<td>n.基础</td>\n<td>progressed</td>\n<td>v.发展</td>\n<td>sub-disciplines</td>\n<td>n.分支学科</td>\n</tr>\n<tr>\n<td>simultaneously</td>\n<td>adv.同时</td>\n<td>vice versa</td>\n<td>反之亦然</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第6段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>trend</td>\n<td>n.趋势</td>\n<td>invest time</td>\n<td>投入时间</td>\n<td>embrace</td>\n<td>v.欣然接受</td>\n</tr>\n<tr>\n<td>tie-ups</td>\n<td>n.合作</td>\n<td>stereotyping</td>\n<td>n.刻板化看待</td>\n<td>immersed</td>\n<td>adj.沉浸的</td>\n</tr>\n<tr>\n<td>discovery</td>\n<td>n.发现</td>\n<td>invention</td>\n<td>n.发明</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Enlightening, / challenging, / stimulating, / fun.</p>\n<p>These were some of the words / that Nature readers used / to describe their experience / of art-science collaborations / in a series of articles / on partnerships / between artists and researchers.</p>\n<p>Nearly 40% / of the roughly 350 people / who responded to an accompanying poll / said, / they had collaborated with artists; / and almost all said / they would consider doing so / in future.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>启发性的，/ 富有挑战性的，/ 激励人心的，/ 有趣的。</p>\n<p>这些是一些词汇 / 《自然》杂志的读者使用的 / 来描述他们的体验 / 关于艺术-科学合作的 / 在一系列文章中 / 关于伙伴关系的 / 在艺术家和研究人员之间。</p>\n<p>将近40% / 大约350人中的 / 回应了相关调查的人 / 说，/ 他们曾与艺术家合作过；/ 几乎所有人都说 / 他们会考虑这样做 / 在未来。</p>\n<h3>标准译文 · 第1段</h3>\n<p>启发性的、富有挑战性的、激励人心的、有趣的——这些是《自然》杂志读者用来描述他们在艺术-科学合作体验的词汇，这些体验来自一系列关于艺术家和研究人员伙伴关系的文章。在回应相关调查的大约350人中，将近40%的人说他们曾与艺术家合作过；几乎所有人都说他们未来会考虑这样做。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Such an encouraging results / is not surprising.</p>\n<p>Scientists are increasingly seeking out / visual artists / to help them communicate their work / to new audiences.</p>\n<p>&quot;Artists help scientists / reach a broader audience / and make emotional connections / that enhance learning.&quot; / One respondent said.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>如此令人鼓舞的结果 / 并不令人惊讶。</p>\n<p>科学家们越来越多地寻求 / 视觉艺术家 / 帮助他们传达他们的工作 / 给新的受众。</p>\n<p>&quot;艺术家帮助科学家 / 接触更广泛的受众 / 并建立情感联系 / 从而增强学习效果。&quot; / 一位受访者说。</p>\n<h3>标准译文 · 第2段</h3>\n<p>如此令人鼓舞的结果并不令人惊讶。科学家们越来越多地寻求视觉艺术家帮助他们向新的受众传达他们的工作。&quot;艺术家帮助科学家接触更广泛的受众并建立情感联系，从而增强学习效果。&quot;一位受访者说。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<h3>意群划分 · 第3段</h3>\n<p>One example / of how artists and scientists / have together rocked the scenes / came last month / when the Sydney Symphony Orchestra / performed a reworked version / of Antonio Vivaldi&#39;s The Four Seasons.</p>\n<p>They reimagined / the 300-year-old score / by injecting / the latest climate prediction data / for each season- / provided by Monash University&#39;s / Climate Change Communication Research Hub.</p>\n<p>The performance was / a creative call to action / ahead of November&#39;s / United Nations Climate Change Conference / in Glasgow, UK.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>一个例子 / 关于艺术家和科学家如何 / 一起震撼了舞台 / 发生在上个月 / 当悉尼交响乐团 / 演奏了一个改编版本 / 安东尼奥·维瓦尔第的《四季》。</p>\n<p>他们重新构想了 / 这部300年历史的乐谱 / 通过注入 / 最新的气候预测数据 / 为每个季节- / 由莫纳什大学提供的 / 气候变化传播研究中心。</p>\n<p>这场演出是 / 一个创造性的行动号召 / 在11月之前的 / 联合国气候变化大会 / 在英国格拉斯哥。</p>\n<h3>标准译文 · 第3段</h3>\n<p>一个展示艺术家和科学家如何一起震撼舞台的例子发生在上个月，当时悉尼交响乐团演奏了安东尼奥·维瓦尔第《四季》的改编版本。他们通过注入莫纳什大学气候变化传播研究中心提供的每个季节的最新气候预测数据，重新构想了这部300年历史的乐谱。这场演出是在英国格拉斯哥举行的11月联合国气候变化大会之前的一个创造性行动号召。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<h3>意群划分 · 第4段</h3>\n<p>But a genuine partnership / must be a two-way street.</p>\n<p>Fewer artist than scientists / responded to the Nature poll, / however, / several respondents noted / that artists do not simply assist scientists / with their communication requirements.</p>\n<p>Nor should their work / be considered only / as an object of study.</p>\n<p>The alliances are most valuable / when scientists and artists / have a shared stake in a project, / are able to jointly design it / and can critique each other&#39;s work.</p>\n<p>Such an approach / can both prompt new research / as well as result in powerful art.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>但真正的伙伴关系 / 必须是双向的。</p>\n<p>比科学家更少的艺术家 / 回应了《自然》的调查，/ 然而，/ 几位受访者指出 / 艺术家不仅仅是协助科学家 / 满足他们的传播需求。</p>\n<p>他们的工作也不应该 / 仅被视为 / 研究对象。</p>\n<p>这种联盟最有价值 / 当科学家和艺术家 / 在项目中有共同利益，/ 能够共同设计它 / 并且能够批评彼此的工作。</p>\n<p>这样的方法 / 既能激发新的研究 / 也能产生有力的艺术作品。</p>\n<h3>标准译文 · 第4段</h3>\n<p>但真正的伙伴关系必须是双向的。回应《自然》调查的艺术家比科学家少，然而，几位受访者指出，艺术家不仅仅是协助科学家满足他们的传播需求。他们的工作也不应该仅被视为研究对象。当科学家和艺术家在项目中有共同利益、能够共同设计并能够批评彼此的工作时，这种联盟最有价值。这样的方法既能激发新的研究，也能产生有力的艺术作品。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<h3>意群划分 · 第5段</h3>\n<p>More than half a century ago, / the Massachusetts Institute of Technology / opened its Center for Advanced Visual Studies (CAVS) / to explore the role of technology / in culture.</p>\n<p>The founders deliberately focused / their projects around light- / hance the &quot;visual studies&quot; / in the name.</p>\n<p>Light was a something / that both artists and scientists / had an interest in, / and therefore could form / the basis of collaboration.</p>\n<p>As science and technology progressed, / and divided into more sub-disciplines, / the centre was simultaneously looking to a time / when leading researchers / could also be artists, / writers and poets, / and vice versa.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>半个多世纪前，/ 麻省理工学院 / 开设了高级视觉研究中心（CAVS）/ 探索技术的作用 / 在文化中。</p>\n<p>创始人特意聚焦 / 他们的项目围绕光- / 因此有&quot;视觉研究&quot; / 在名称中。</p>\n<p>光是一种东西 / 艺术家和科学家都 / 对此有兴趣，/ 因此可以形成 / 合作的基础。</p>\n<p>随着科学技术的进步，/ 并分化成更多子学科，/ 该中心同时期待着一个时代 / 当顶尖研究人员 / 也可以是艺术家，/ 作家和诗人，/ 反之亦然。</p>\n<h3>标准译文 · 第5段</h3>\n<p>半个多世纪前，麻省理工学院开设了高级视觉研究中心（CAVS）来探索技术在文化中的作用。创始人特意将项目聚焦于光——因此名称中有&quot;视觉研究&quot;。光是艺术家和科学家都感兴趣的东西，因此可以形成合作的基础。随着科学技术的进步并分化成更多子学科，该中心同时期待着一个顶尖研究人员也可以是艺术家、作家和诗人的时代，反之亦然。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Nature&#39;s poll findings suggest / that this trend / is as strong as ever, / but, / to make a collaboration work, / both sides need to invest time, / and embrace surprise and challenge.</p>\n<p>The reach of art-science tie-ups / needs to go beyond / the necessary purpose / of research communication, / and participants must not fall / into the trap of stereotyping each other.</p>\n<p>Artists and scientists alike / are immersed in / discovery and invention, / and challenge and critique / are core to both, / too.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>《自然》的调查结果表明 / 这种趋势 / 和以往一样强劲，/ 但是，/ 要让合作成功，/ 双方都需要投入时间，/ 并接受惊喜和挑战。</p>\n<p>艺术-科学合作的影响范围 / 需要超越 / 必要的目的 / 研究传播的，/ 参与者必须不要陷入 / 相互刻板印象的陷阱。</p>\n<p>艺术家和科学家一样 / 都沉浸在 / 发现和发明中，/ 挑战和批判 / 对两者都是核心，/ 也是。</p>\n<h3>标准译文 · 第6段</h3>\n<p>《自然》的调查结果表明这种趋势和以往一样强劲，但是，要让合作成功，双方都需要投入时间，并接受惊喜和挑战。艺术-科学合作的影响范围需要超越研究传播这一必要目的，参与者必须不要陷入相互刻板印象的陷阱。艺术家和科学家一样都沉浸在发现和发明中，挑战和批判对两者都是核心。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Enlightening + challenging + stimulating + fun.</p>\n<p>These were some of the words：(that Nature readers used → to describe their experience：(of art-science collaborations))：(in a series of articles：(on partnerships：(between artists and researchers))).</p>\n<p>Nearly 40%：(of the roughly 350 people：(who responded to an accompanying poll)) → said：(they had collaborated with artists); + almost all said：(they would consider doing so：(in future)).</p>\n<p><strong>第2段</strong></p>\n<p>Such an encouraging results → is not surprising.</p>\n<p>Scientists are increasingly seeking out：(visual artists)：(to help them communicate their work：(to new audiences)).</p>\n<p>&quot;Artists help scientists → reach a broader audience + make emotional connections：(that enhance learning).&quot; → One respondent said.</p>\n<p><strong>第3段</strong></p>\n<p>One example：(of how artists and scientists → have together rocked the scenes) → came last month：(when the Sydney Symphony Orchestra → performed a reworked version：(of Antonio Vivaldi&#39;s The Four Seasons)).</p>\n<p>They reimagined → the 300-year-old score：(by injecting → the latest climate prediction data：(for each season))：(provided by Monash University&#39;s Climate Change Communication Research Hub).</p>\n<p>The performance was → a creative call to action：(ahead of November&#39;s United Nations Climate Change Conference：(in Glasgow, UK)).</p>\n<p><strong>第4段</strong></p>\n<p>But a genuine partnership → must be a two-way street.</p>\n<p>Fewer artist than scientists → responded to the Nature poll // however → several respondents noted：(that artists do not simply assist scientists：(with their communication requirements)).</p>\n<p>Nor should their work → be considered only：(as an object of study).</p>\n<p>The alliances are most valuable：(when scientists and artists → have a shared stake in a project + are able to jointly design it + can critique each other&#39;s work).</p>\n<p>Such an approach → can both prompt new research + result in powerful art.</p>\n<p><strong>第5段</strong></p>\n<p>More than half a century ago → the Massachusetts Institute of Technology → opened its Center for Advanced Visual Studies (CAVS)：(to explore the role of technology：(in culture)).</p>\n<p>The founders deliberately focused → their projects around light → hance the &quot;visual studies&quot;：(in the name).</p>\n<p>Light was a something：(that both artists and scientists → had an interest in) + therefore could form → the basis of collaboration.</p>\n<p>As science and technology progressed + divided into more sub-disciplines → the centre was simultaneously looking to a time：(when leading researchers → could also be artists + writers and poets + vice versa).</p>\n<p><strong>第6段</strong></p>\n<p>Nature&#39;s poll findings suggest：(that this trend → is as strong as ever) // but → to make a collaboration work → both sides need to invest time + embrace surprise and challenge.</p>\n<p>The reach of art-science tie-ups → needs to go beyond：(the necessary purpose：(of research communication)) + participants must not fall：(into the trap of stereotyping each other).</p>\n<p>Artists and scientists alike → are immersed in：(discovery and invention) + challenge and critique → are core to both → too.</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>启发性的 + 富有挑战性的 + 激励人心的 + 有趣的。</p>\n<p>这些是一些词汇：(《自然》杂志的读者使用的 → 来描述他们的体验：(关于艺术-科学合作的))：(在一系列文章中：(关于伙伴关系的：(在艺术家和研究人员之间)))。</p>\n<p>将近40%：(大约350人中的：(回应了相关调查的人)) → 说：(他们曾与艺术家合作过)；+ 几乎所有人都说：(他们会考虑这样做：(在未来))。</p>\n<p><strong>第2段</strong></p>\n<p>如此令人鼓舞的结果 → 并不令人惊讶。</p>\n<p>科学家们越来越多地寻求：(视觉艺术家)：(帮助他们传达他们的工作：(给新的受众))。</p>\n<p>&quot;艺术家帮助科学家 → 接触更广泛的受众 + 建立情感联系：(从而增强学习效果)。&quot; → 一位受访者说。</p>\n<p><strong>第3段</strong></p>\n<p>一个例子：(关于艺术家和科学家如何 → 一起震撼了舞台) → 发生在上个月：(当悉尼交响乐团 → 演奏了一个改编版本：(安东尼奥·维瓦尔第的《四季》))。</p>\n<p>他们重新构想了 → 这部300年历史的乐谱：(通过注入 → 最新的气候预测数据：(为每个季节))：(由莫纳什大学气候变化传播研究中心提供的)。</p>\n<p>这场演出是 → 一个创造性的行动号召：(在11月联合国气候变化大会之前：(在英国格拉斯哥))。</p>\n<p><strong>第4段</strong></p>\n<p>但真正的伙伴关系 → 必须是双向的。</p>\n<p>比科学家更少的艺术家 → 回应了《自然》的调查 // 然而 → 几位受访者指出：(艺术家不仅仅是协助科学家：(满足他们的传播需求))。</p>\n<p>他们的工作也不应该 → 仅被视为：(研究对象)。</p>\n<p>这种联盟最有价值：(当科学家和艺术家 → 在项目中有共同利益 + 能够共同设计它 + 能够批评彼此的工作)。</p>\n<p>这样的方法 → 既能激发新的研究 + 产生有力的艺术作品。</p>\n<p><strong>第5段</strong></p>\n<p>半个多世纪前 → 麻省理工学院 → 开设了高级视觉研究中心（CAVS）：(探索技术的作用：(在文化中))。</p>\n<p>创始人特意聚焦 → 他们的项目围绕光 → 因此有&quot;视觉研究&quot;：(在名称中)。</p>\n<p>光是一种东西：(艺术家和科学家都 → 对此有兴趣) + 因此可以形成 → 合作的基础。</p>\n<p>随着科学技术的进步 + 分化成更多子学科 → 该中心同时期待着一个时代：(当顶尖研究人员 → 也可以是艺术家 + 作家和诗人 + 反之亦然)。</p>\n<p><strong>第6段</strong></p>\n<p>《自然》的调查结果表明：(这种趋势 → 和以往一样强劲) // 但 → 要让合作成功 → 双方都需要投入时间 + 接受惊喜和挑战。</p>\n<p>艺术-科学合作的影响范围 → 需要超越：(必要的目的：(研究传播的)) + 参与者必须不要陷入：(相互刻板印象的陷阱)。</p>\n<p>艺术家和科学家一样 → 都沉浸在：(发现和发明中) + 挑战和批判 → 对两者都是核心 → 也是。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Nearly 40% / of the roughly 350 people / who responded to an accompanying poll / said, / they had collaborated with artists; / and almost all said / they would consider doing so / in future.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>将近40% / 大约350人中的 / 回应了相关调查的人 / 说，/ 他们曾与艺术家合作过；/ 几乎所有人都说 / 他们会考虑这样做 / 在未来。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先处理nearly 40%与roughly 350的分母关系，再把分号后future意愿与前面的既往经验分开。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>将近40%  大约350人中的  回应了相关调查的人  说， 他们曾与艺术家合作过； 几乎所有人都说  他们会考虑这样做  在未来。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>调查受访者中近四成有合作经历，几乎都愿考虑未来合作。</p>\n</blockquote>\n<p>先交代受访人数与已合作比例，再说未来考虑合作的态度。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>在回应相关调查的大约350人中，将近40%的人说他们曾与艺术家合作过；几乎所有人都说他们未来会考虑这样做。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>would consider不是已经决定合作，almost all也不是无一例外。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>在回应相关调查的大约350人中，将近40%的人说他们曾与艺术家合作过；几乎所有人都说他们未来会考虑这样做。</p>\n</blockquote>\n<h2>2. 第4段第4句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The alliances are most valuable / when scientists and artists / have a shared stake in a project, / are able to jointly design it / and can critique each other&#39;s work.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>这种联盟最有价值 / 当科学家和艺术家 / 在项目中有共同利益，/ 能够共同设计它 / 并且能够批评彼此的工作。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>when统领三个并列条件：共同利益、共同设计、能够互评。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>这种联盟最有价值  当科学家和艺术家  在项目中有共同利益， 能够共同设计它  并且能够批评彼此的工作。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>双方共同参与设计并互评时，合作最有价值。</p>\n</blockquote>\n<p>先说合作价值，再依次给出实现条件。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>当科学家和艺术家在项目中有共同利益、能够共同设计并能够批评彼此的工作时，这种联盟最有价值。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>critique不是排斥合作，而是双方共同建设项目的一部分。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>当科学家和艺术家在项目中有共同利益、能够共同设计并能够批评彼此的工作时，这种联盟最有价值。</p>\n</blockquote>\n<h2>3. 第5段第4句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>As science and technology progressed, / and divided into more sub-disciplines, / the centre was simultaneously looking to a time / when leading researchers / could also be artists, / writers and poets, / and vice versa.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>随着科学技术的进步，/ 并分化成更多子学科，/ 该中心同时期待着一个时代 / 当顶尖研究人员 / 也可以是艺术家，/ 作家和诗人，/ 反之亦然。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>As说明学科发展并细分的背景；when补充中心所期待的时代状况。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>随着科学技术的进步， 并分化成更多子学科， 该中心同时期待着一个时代  当顶尖研究人员  也可以是艺术家， 作家和诗人， 反之亦然。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>中心期待研究者也可兼具艺术、写作与诗歌身份。</p>\n</blockquote>\n<p>先说科学技术细分，再转向中心期待身份相通的未来。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>随着科学技术的进步并分化成更多子学科，该中心同时期待着一个顶尖研究人员也可以是艺术家、作家和诗人的时代，反之亦然。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>vice versa表示艺术家也可成为研究者，不是领导职位轮流由两类人担任。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>随着科学技术的进步并分化成更多子学科，该中心同时期待着一个顶尖研究人员也可以是艺术家、作家和诗人的时代，反之亦然。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>31题</h2>\n<blockquote>\n<p>According to Paragraph 1, art-science collaborations have ______.</p>\n<p>根据第一段，艺术与科学的合作已经怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>回应概括题：合看读者体验用词与调查意愿，分清过去参与和未来考虑。</p>\n<p>题干明确给出Paragraph 1，先把第1段从头读到尾，查看读者怎样描述艺术与科学合作的经历，以及调查中的人曾做过什么、今后愿意做什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</blockquote>\n<h3>A. caught the attention of critics</h3>\n<blockquote>\n<p>艺术与科学合作已经引起评论家关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>评价者被写为Nature读者和调查受访者，未被确定为评论家。A把分享自身经历改成引起另一类人的关注。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>艺术与科学合作已经引起评论家关注。</p>\n</blockquote>\n<p><code>caught the attention of critics</code>说的是评论家的反应，第一段实际介绍的是<code>Nature readers</code>描述自己的合作经历，因此回看第二句怎样交代这些评价者的身份。</p>\n<p>原文的<code>Nature readers</code>用一些词描述<code>their experiences</code>，即自己的合作经历。选项的<code>caught the attention of critics</code>却把这件事写成合作引起评论家关注：经历的讲述者被换成了评论家，讲述自身经历也变成了被吸引来关注合作。原句没有建立评论家因这些合作而关注它们的过程。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n<p>有启发、有挑战、令人振奋、有趣。这些是《自然》读者在关于艺术家和研究者伙伴关系的一系列文章中描述艺术科学合作体验所用的词。约350名配套调查受访者中，近40%说曾与艺术家合作；几乎所有人都说会考虑未来合作。</p>\n</blockquote>\n<p>首句四个词由下一句说明是读者对合作体验的描述，随后调查补充参与比例与未来意愿。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations have caught the attention of critics.</p>\n<p>艺术与科学合作已经引起评论家关注。</p>\n</blockquote>\n<p>A需要critics关注合作的证据。读者在作评价不等于其身份就是评论家，不能用评价动作替换原文明确的参与者身份。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. received favourable responses</h3>\n<blockquote>\n<p>艺术与科学合作已经获得积极回应。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>启发性、挑战性、激励性和趣味性是积极体验，几乎全部受访者又愿考虑未来合作，favourable responses概括这种回应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>艺术与科学合作已经获得积极回应。</p>\n</blockquote>\n<p>启发性、挑战性、激励性和趣味性是积极体验，几乎全部受访者又愿考虑未来合作，favourable responses概括这种回应。</p>\n<p>经历评价先呈现合作感受，已有近40%合作过的事实与几乎全体未来意愿再补充调查证据。</p>\n<p>B没有说每人都已经合作。愿考虑未来参与也是正面开放态度，与积极体验合在一起足以支持总体概括。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n<p>有启发、有挑战、令人振奋、有趣。这些是《自然》读者在关于艺术家和研究者伙伴关系的一系列文章中描述艺术科学合作体验所用的词。约350名配套调查受访者中，近40%说曾与艺术家合作；几乎所有人都说会考虑未来合作。</p>\n</blockquote>\n<p>经历评价先呈现合作感受，已有近40%合作过的事实与几乎全体未来意愿再补充调查证据。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations have received favourable responses.</p>\n<p>艺术与科学合作已经获得积极回应。</p>\n</blockquote>\n<p>B没有说每人都已经合作。愿考虑未来参与也是正面开放态度，与积极体验合在一起足以支持总体概括。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. promoted academic publishing</h3>\n<blockquote>\n<p>艺术与科学合作已经促进学术出版。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>一系列文章是介绍合作经历的载体，未被写成合作促进学术出版发展的成果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>艺术与科学合作已经促进学术出版。</p>\n</blockquote>\n<p><code>academic publishing</code>容易让人想到第二句的<code>a series of articles</code>，但这些文章在句中究竟承担什么作用，需要回看第二句的完整连接。</p>\n<p>原文把<code>a series of articles</code>作为读者描述合作经历的载体：人们在这些文章里讲自己的经历。选项的<code>promoted academic publishing</code>则说合作推动了学术出版的发展。两者不同在于，文章承载有关合作的描述，并不等于合作促成了出版事业的发展；句中没有把这两件事连成促进关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n<p>有启发、有挑战、令人振奋、有趣。这些是《自然》读者在关于艺术家和研究者伙伴关系的一系列文章中描述艺术科学合作体验所用的词。约350名配套调查受访者中，近40%说曾与艺术家合作；几乎所有人都说会考虑未来合作。</p>\n</blockquote>\n<p>作者通过文章与配套调查了解读者怎样评价合作，重点是体验和未来意愿。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations have promoted academic publishing.</p>\n<p>艺术与科学合作已经促进学术出版。</p>\n</blockquote>\n<p>C需要出版规模、质量或发展因合作得到推动的关系。某活动被写进文章，不等于它推动整个学术出版。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. sparked heated public disputes</h3>\n<blockquote>\n<p>艺术与科学合作已经引发激烈公众争论。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>challenging描述体验有挑战，enlightening和stimulating说有启发与激励；这些词未表示公众之间争执激烈。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>艺术与科学合作已经引发激烈公众争论。</p>\n</blockquote>\n<p>challenging描述体验有挑战，enlightening和stimulating说有启发与激励；这些词未表示公众之间争执激烈。</p>\n<p>开头评价统一落在各人的合作经历，末句又写愿考虑未来参与，未引出 opposing groups 或争议事件。</p>\n<p>D需要不同公众立场相冲突并争论的过程。合作有挑战不等于存在heated disputes，不能只凭challenging联想冲突。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n<p>有启发、有挑战、令人振奋、有趣。这些是《自然》读者在关于艺术家和研究者伙伴关系的一系列文章中描述艺术科学合作体验所用的词。约350名配套调查受访者中，近40%说曾与艺术家合作；几乎所有人都说会考虑未来合作。</p>\n</blockquote>\n<p>开头评价统一落在各人的合作经历，末句又写愿考虑未来参与，未引出 opposing groups 或争议事件。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations have sparked heated public disputes.</p>\n<p>艺术与科学合作已经引发激烈公众争论。</p>\n</blockquote>\n<p>D需要不同公众立场相冲突并争论的过程。合作有挑战不等于存在heated disputes，不能只凭challenging联想冲突。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>31题结论</h3>\n<blockquote>\n<p><strong>31. B</strong></p>\n</blockquote>\n<ul>\n<li>A：评价者被写为Nature读者和调查受访者，未被确定为评论家。A把分享自身经历改成引起另一类人的关注。</li>\n<li>B：启发性、挑战性、激励性和趣味性是积极体验，几乎全部受访者又愿考虑未来合作，favourable responses概括这种回应。</li>\n<li>C：一系列文章是介绍合作经历的载体，未被写成合作促进学术出版发展的成果。</li>\n<li>D：challenging描述体验有挑战，enlightening和stimulating说有启发与激励；这些词未表示公众之间争执激烈。</li>\n</ul>\n<h2>32题</h2>\n<blockquote>\n<p>The reworked version of The Four Seasons is mentioned to show that ______.</p>\n<p>文中提到《四季》的改编版本，是为了说明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>The Four Seasons直接定位到第3段。先完整读第3段，了解改编加入了什么、演出在什么场合发出什么呼吁。题干问is mentioned to show，即举例的用意；第3段开头写One example，因此还要完整读相邻的第2段，找到这个例子承接的说法。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Artists help scientists reach a broader audience and make emotional connections that enhance learning,</p>\n<p>by injecting the latest climate prediction data for each season</p>\n<p>The performance was a creative call to action</p>\n</blockquote>\n<h3>A. art can offer audiences easy access to science</h3>\n<blockquote>\n<p>作者用《四季》改编说明艺术可使受众更容易接触科学。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>艺术帮助科学接触更多受众、建立促进学习的情感联系，气候数据融入音乐就是这种接触途径的实例。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用《四季》改编说明艺术可使受众更容易接触科学。</p>\n</blockquote>\n<p><code>easy access to science</code>谈艺术帮助受众接触科学，与第2段的<code>reach a broader audience</code>相接；第3段又把<code>climate prediction data</code>放进音乐，因此把这两处合起来核对。</p>\n<p>第2段说艺术帮助科学家<code>reach a broader audience</code>，并建立促进学习的情感联系；第3段的演出把气候预测数据融进音乐。选项用<code>easy access to science</code>概括受众借艺术接触科学。</p>\n<p>若把<code>easy access</code>理解为提供一种容易接近的接触途径，这个说法能接上艺术扩大接触面、帮助学习的作用。</p>\n<p>不过原句并没有直接比较科学内容本身的难易，所以这里能成立的是接触途径的便利，不能扩成全部科学知识都被简化了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<p>这样令人鼓舞的结果并不意外。科学家越来越主动寻找视觉艺术家，帮助向新受众传播工作。一名受访者说，艺术家帮助科学家接触更广的受众，并建立增强学习效果的情感联系。</p>\n<p>上个月悉尼交响乐团演出维瓦尔第《四季》的改编版，提供了艺术家和科学家共同引起轰动的一个例子。他们将莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据，注入已有三百年的乐谱重新创作。这场演出是在11月英国格拉斯哥联合国气候变化大会之前发出的富有创意的行动呼吁。</p>\n</blockquote>\n<p>第二段先给传播与学习作用，第三段以One example承接，将已有气候预测数据改编成音乐和行动呼吁。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art can offer audiences easy access to science.</p>\n<p>作者用《四季》改编说明艺术可使受众更容易接触科学。</p>\n</blockquote>\n<p>easy access在此指更容易接近科学的途径，并非所有知识都被简化或所有人都能轻易掌握，A保留举例的直接作用。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. science can help with the expression of emotions</h3>\n<blockquote>\n<p>作者用《四季》改编说明科学能帮助表达情感。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文是艺术帮助科学传播并建立情感联系，B却说科学帮助表达情感，方向和目的都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用《四季》改编说明科学能帮助表达情感。</p>\n</blockquote>\n<p><code>expression of emotions</code>与第2段的<code>make emotional connections</code>都谈到情感，但要核对是谁帮助谁、情感用来做什么，所以回看第2段末句，并核对第3段对演出目的的说明。</p>\n<p>原文里是艺术家帮助科学家<code>make emotional connections</code>，情感联系的作用是<code>enhance learning</code>；演出本身又被称为行动呼吁。选项却以<code>science</code>为帮助者，把<code>expression of emotions</code>当成要实现的目的。建立人与科学内容之间、能够促进学习的情感联系，不等于科学帮助人表达自己的情绪；选项同时调换了帮助的方向和情感所承担的作用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<p>这样令人鼓舞的结果并不意外。科学家越来越主动寻找视觉艺术家，帮助向新受众传播工作。一名受访者说，艺术家帮助科学家接触更广的受众，并建立增强学习效果的情感联系。</p>\n<p>上个月悉尼交响乐团演出维瓦尔第《四季》的改编版，提供了艺术家和科学家共同引起轰动的一个例子。他们将莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据，注入已有三百年的乐谱重新创作。这场演出是在11月英国格拉斯哥联合国气候变化大会之前发出的富有创意的行动呼吁。</p>\n</blockquote>\n<p>受众与科学之间的情感联系服务于enhance learning，音乐演出进一步服务气候行动呼吁。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Science can help with the expression of emotions.</p>\n<p>作者用《四季》改编说明科学能帮助表达情感。</p>\n</blockquote>\n<p>B需要科学知识被用于表达人自身情绪的说明。情感参与可以帮助学习，但不能直接等同于表达情绪。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. public participation in science has a promising future</h3>\n<blockquote>\n<p>作者用《四季》改编说明公众参与科学前景光明。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>演出让公众接触科学并呼吁行动，C还增加公众参与科学未来光明的趋势判断，超出此例说明范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用《四季》改编说明公众参与科学前景光明。</p>\n</blockquote>\n<p><code>public participation in science</code>需要找到公众怎样参与科学；第2段的<code>new audiences</code>是科学传播要接触的人，第3段的<code>call to action</code>则写演出的呼吁，因此核对两者是否组成选项所说的前景判断。</p>\n<p>原文说科学家把工作传播给<code>new audiences</code>，演出在气候大会之前发出<code>call to action</code>。选项说<code>public participation in science</code>有光明的未来，已经从受众接收传播、演出呼吁行动，转到公众参与科学的未来发展。即使把接触科学信息和响应呼吁宽泛地算作公众参与，原文也没有把这一次活动与公众参与科学将会怎样发展相连。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<p>这样令人鼓舞的结果并不意外。科学家越来越主动寻找视觉艺术家，帮助向新受众传播工作。一名受访者说，艺术家帮助科学家接触更广的受众，并建立增强学习效果的情感联系。</p>\n<p>上个月悉尼交响乐团演出维瓦尔第《四季》的改编版，提供了艺术家和科学家共同引起轰动的一个例子。他们将莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据，注入已有三百年的乐谱重新创作。这场演出是在11月英国格拉斯哥联合国气候变化大会之前发出的富有创意的行动呼吁。</p>\n</blockquote>\n<p>一个具体演出承接艺术扩大受众的观点，段落没有再调查未来参与规模或持续发展。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public participation in science has a promising future.</p>\n<p>作者用《四季》改编说明公众参与科学前景光明。</p>\n</blockquote>\n<p>即使将接触信息、响应呼吁广义视为参与，也不能由这次活动推出promising future。A概括已展示的传播作用更直接。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. art is effective in facilitating scientific innovations</h3>\n<blockquote>\n<p>作者用《四季》改编说明艺术能有效促进科学创新。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>气候预测数据是研究中心已提供的输入，音乐改编是传播形式创新，未说演出促成新的科学发现或技术。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用《四季》改编说明艺术能有效促进科学创新。</p>\n</blockquote>\n<p><code>scientific innovations</code>要求演出促成科学上的新成果；第3段说改编使用<code>latest climate prediction data</code>，因此回看第二句数据怎样进入作品，再看末句交代的演出作用。</p>\n<p>原文中的<code>latest climate prediction data</code>由研究中心提供，艺术家把已有的这些数据融入改编，演出成为行动呼吁。选项的<code>facilitating scientific innovations</code>却把方向改成艺术促进新的科学成果。数据最新，说的是所采用数据的状况；演出富有创意，说的是传播形式，都不是演出促成了新的科学发现或发明。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<p>这样令人鼓舞的结果并不意外。科学家越来越主动寻找视觉艺术家，帮助向新受众传播工作。一名受访者说，艺术家帮助科学家接触更广的受众，并建立增强学习效果的情感联系。</p>\n<p>上个月悉尼交响乐团演出维瓦尔第《四季》的改编版，提供了艺术家和科学家共同引起轰动的一个例子。他们将莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据，注入已有三百年的乐谱重新创作。这场演出是在11月英国格拉斯哥联合国气候变化大会之前发出的富有创意的行动呼吁。</p>\n</blockquote>\n<p>数据先进入已有三百年乐谱，再由演出成为气候会议前的行动呼吁，推进方向从科学材料到公众传播。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art is effective in facilitating scientific innovations.</p>\n<p>作者用《四季》改编说明艺术能有效促进科学创新。</p>\n</blockquote>\n<p>D需要艺术推动科学新成果的反向作用。本例中latest只修饰已有数据，creative修饰呼吁形式，都不能替代科研创新结果。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>32题结论</h3>\n<blockquote>\n<p><strong>32. A</strong></p>\n</blockquote>\n<ul>\n<li>A：艺术帮助科学接触更多受众、建立促进学习的情感联系，气候数据融入音乐就是这种接触途径的实例。</li>\n<li>B：原文是艺术帮助科学传播并建立情感联系，B却说科学帮助表达情感，方向和目的都变了。</li>\n<li>C：演出让公众接触科学并呼吁行动，C还增加公众参与科学未来光明的趋势判断，超出此例说明范围。</li>\n<li>D：气候预测数据是研究中心已提供的输入，音乐改编是传播形式创新，未说演出促成新的科学发现或技术。</li>\n</ul>\n<h2>33题</h2>\n<blockquote>\n<p>Some artists seem to worry that in the art-science partnership ______.</p>\n<p>一些艺术家似乎担心，在艺术与科学的合作中会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>担忧推断题：由simply、only限定的单向角色，理解为何要求双向参与。</p>\n<p>题干的Some artists与worry指向艺术家对合作关系的顾虑。粗读第4段时见到a two-way street和their communication requirements，现在把第4段完整读完，查看作者为什么强调双向合作，以及受访者反对怎样看待艺术家和他们的作品。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>artists do not simply assist scientists with their communication requirements.</p>\n<p>Nor should their work be considered only as an object of study.</p>\n<p>only as an object of study</p>\n</blockquote>\n<h3>A. their role may be underestimated</h3>\n<blockquote>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p><code>role may be underestimated</code>涉及如何看待艺术家的作用，第4段的<code>do not simply assist scientists</code>正是在纠正对这种作用的理解，因此回看第二句、第三句。</p>\n<p>原文说艺术家<code>do not simply assist scientists</code>，他们的工作也不应只被看作研究对象。这两处否定都在反对把艺术家的作用缩小：只替科学家传播，或者只提供被研究的作品。</p>\n<p>选项的<code>role may be underestimated</code>把这种顾虑概括为作用可能被低估。</p>\n<p>它没有说艺术家完全没有作用，而是说他们能参与的部分可能没有得到充分看待，与原文的限制性看法相接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<p>但真正的伙伴关系必须双向。回应《自然》调查的艺术家少于科学家，不过一些受访者指出，艺术家并不只是协助科学家满足传播要求；其作品也不应只被看作研究对象。双方在项目中有共同关切、能够共同设计、互相批评时，联盟最有价值。这样的方式既可推动新研究，也可产生有力量的艺术。</p>\n</blockquote>\n<p>two-way street先定双向关系，再以两项否定纠正片面定位，之后要求共享利益、共同设计、互相批评。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Artists worry that their role may be underestimated.</p>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p>A保留角色范围被看窄这一中心，没有说艺术家完全没有作用，也不另加声誉或创作能力已受损的后果。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. their reputation may be impaired</h3>\n<blockquote>\n<p>一些艺术家担心合作中其声誉可能受损。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>角色被局限于辅助或被研究，与外界声誉下降不同；段落没有从合作分工推到艺术家名声受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些艺术家担心合作中其声誉可能受损。</p>\n</blockquote>\n<p><code>reputation may be impaired</code>关心外界如何评价艺术家；第4段的<code>only as an object of study</code>说的是合作中如何看待其工作，因此回看第三句，连同前句对协助科学家传播这一角色的限制一起核对。</p>\n<p>原文反对把艺术家的工作<code>only as an object of study</code>，也反对只把他们当成传播助手，讨论的是合作中给艺术家安排什么角色、怎样使用他们的作品。选项的<code>reputation may be impaired</code>讨论的却是艺术家的名声受到损害。角色被看得过窄，不能直接改成声誉下降；本段没有将这种角色安排连接到外界对艺术家的名誉评价。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<p>但真正的伙伴关系必须双向。回应《自然》调查的艺术家少于科学家，不过一些受访者指出，艺术家并不只是协助科学家满足传播要求；其作品也不应只被看作研究对象。双方在项目中有共同关切、能够共同设计、互相批评时，联盟最有价值。这样的方式既可推动新研究，也可产生有力量的艺术。</p>\n</blockquote>\n<p>艺术家要求共同参与设计和评价，作者讨论双方在项目内应有的地位与任务。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Artists worry that their reputation may be impaired.</p>\n<p>一些艺术家担心合作中其声誉可能受损。</p>\n</blockquote>\n<p>B需要社会评价或名誉受到损害的说明。合作角色不充分可能令人不满，但不能直接写成reputation impaired。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. their creativity may be inhibited</h3>\n<blockquote>\n<p>一些艺术家担心合作中其创造力可能受抑制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时C尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>缺少共同设计可能限制创作发挥，C有这种间接联系；但原文直接纠正的是艺术家角色过窄，A比创造力受抑制更贴切。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些艺术家担心合作中其创造力可能受抑制。</p>\n</blockquote>\n<p>缺少共同设计可能限制创作发挥，C有这种间接联系；但原文直接纠正的是艺术家角色过窄，A比创造力受抑制更贴切。</p>\n<p>作者先反对单向助手或研究对象定位，再提出双方共享设计和批评权，而非分析艺术家创造力下降的机制。</p>\n<p>may本来就允许可能性，不能因未发生就排C。问题是文章未明确把顾虑落到创造力受抑制；A能直接覆盖两项角色限制，C只解释其中可能的后果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondent
