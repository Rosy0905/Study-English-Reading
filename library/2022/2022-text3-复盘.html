ovations</code>要求演出促成科学上的新成果；第3段说改编使用<code>latest climate prediction data</code>，因此回看第二句数据怎样进入作品，再看末句交代的演出作用。</p>\n<p>原文中的<code>latest climate prediction data</code>由研究中心提供，艺术家把已有的这些数据融入改编，演出成为行动呼吁。选项的<code>facilitating scientific innovations</code>却把方向改成艺术促进新的科学成果。数据最新，说的是所采用数据的状况；演出富有创意，说的是传播形式，都不是演出促成了新的科学发现或发明。</p>\n</section>"},{"title":"D. art is effective in facilitating scientific innovations","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. \"Artists help scientists reach a broader audience and make emotional connections that enhance learning.\" One respondent said.\n> One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi's The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University's Climate Change Communication Research Hub. The performance was a creative call to action ahead of November's United Nations Climate Change Conference in Glasgow, UK.\n>\n> 这样令人鼓舞的结果并不意外。科学家越来越主动寻找视觉艺术家，帮助向新受众传播工作。一名受访者说，艺术家帮助科学家接触更广的受众，并建立增强学习效果的情感联系。\n>\n> 上个月悉尼交响乐团演出维瓦尔第《四季》的改编版，提供了艺术家和科学家共同引起轰动的一个例子。他们将莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据，注入已有三百年的乐谱重新创作。这场演出是在11月英国格拉斯哥联合国气候变化大会之前发出的富有创意的行动呼吁。\n\n数据先进入已有三百年乐谱，再由演出成为气候会议前的行动呼吁，推进方向从科学材料到公众传播。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Art is effective in facilitating scientific innovations.\n>\n> 作者用《四季》改编说明艺术能有效促进科学创新。\n\nD需要艺术推动科学新成果的反向作用。本例中latest只修饰已有数据，creative修饰呼吁形式，都不能替代科研创新结果。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,785,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-32-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-D-0\"><blockquote>\n<p>作者用《四季》改编说明艺术能有效促进科学创新。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>气候预测数据是研究中心已提供的输入，音乐改编是传播形式创新，未说演出促成新的科学发现或技术。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用《四季》改编说明艺术能有效促进科学创新。</p>\n</blockquote>\n<p><code>scientific innovations</code>要求演出促成科学上的新成果；第3段说改编使用<code>latest climate prediction data</code>，因此回看第二句数据怎样进入作品，再看末句交代的演出作用。</p>\n<p>原文中的<code>latest climate prediction data</code>由研究中心提供，艺术家把已有的这些数据融入改编，演出成为行动呼吁。选项的<code>facilitating scientific innovations</code>却把方向改成艺术促进新的科学成果。数据最新，说的是所采用数据的状况；演出富有创意，说的是传播形式，都不是演出促成了新的科学发现或发明。</p>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.\nOne example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<p>这样令人鼓舞的结果并不意外。科学家越来越主动寻找视觉艺术家，帮助向新受众传播工作。一名受访者说，艺术家帮助科学家接触更广的受众，并建立增强学习效果的情感联系。</p>\n<p>上个月悉尼交响乐团演出维瓦尔第《四季》的改编版，提供了艺术家和科学家共同引起轰动的一个例子。他们将莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据，注入已有三百年的乐谱重新创作。这场演出是在11月英国格拉斯哥联合国气候变化大会之前发出的富有创意的行动呼吁。</p>\n</blockquote>\n<p>数据先进入已有三百年乐谱，再由演出成为气候会议前的行动呼吁，推进方向从科学材料到公众传播。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art is effective in facilitating scientific innovations.</p>\n<p>作者用《四季》改编说明艺术能有效促进科学创新。</p>\n</blockquote>\n<p>D需要艺术推动科学新成果的反向作用。本例中latest只修饰已有数据，creative修饰呼吁形式，都不能替代科研创新结果。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. A**\n\n- A：艺术帮助科学接触更多受众、建立促进学习的情感联系，气候数据融入音乐就是这种接触途径的实例。\n- B：原文是艺术帮助科学传播并建立情感联系，B却说科学帮助表达情感，方向和目的都变了。\n- C：演出让公众接触科学并呼吁行动，C还增加公众参与科学未来光明的趋势判断，超出此例说明范围。\n- D：气候预测数据是研究中心已提供的输入，音乐改编是传播形式创新，未说演出促成新的科学发现或技术。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,785,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"32","questionConclusion":true},"html":"<blockquote>\n<p><strong>32. A</strong></p>\n</blockquote>\n<ul>\n<li>A：艺术帮助科学接触更多受众、建立促进学习的情感联系，气候数据融入音乐就是这种接触途径的实例。</li>\n<li>B：原文是艺术帮助科学传播并建立情感联系，B却说科学帮助表达情感，方向和目的都变了。</li>\n<li>C：演出让公众接触科学并呼吁行动，C还增加公众参与科学未来光明的趋势判断，超出此例说明范围。</li>\n<li>D：气候预测数据是研究中心已提供的输入，音乐改编是传播形式创新，未说演出促成新的科学发现或技术。</li>\n</ul>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> Some artists seem to worry that in the art-science partnership ______.\n>\n> 一些艺术家似乎担心，在艺术与科学的合作中会怎样？\n\n### 题型\n\n担忧推断题：由simply、only限定的单向角色，理解为何要求双向参与。\n\n题干的Some artists与worry指向艺术家对合作关系的顾虑。粗读第4段时见到a two-way street和their communication requirements，现在把第4段完整读完，查看作者为什么强调双向合作，以及受访者反对怎样看待艺术家和他们的作品。\n\n### 核心出处\n\n> artists do not simply assist scientists with their communication requirements.\n>\n> Nor should their work be considered only as an object of study.\n>\n> only as an object of study","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"33","questionIntro":true},"html":"<blockquote>\n<p>Some artists seem to worry that in the art-science partnership ______.</p>\n<p>一些艺术家似乎担心，在艺术与科学的合作中会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>担忧推断题：由simply、only限定的单向角色，理解为何要求双向参与。</p>\n<p>题干的Some artists与worry指向艺术家对合作关系的顾虑。粗读第4段时见到a two-way street和their communication requirements，现在把第4段完整读完，查看作者为什么强调双向合作，以及受访者反对怎样看待艺术家和他们的作品。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>artists do not simply assist scientists with their communication requirements.</p>\n<p>Nor should their work be considered only as an object of study.</p>\n<p>only as an object of study</p>\n</blockquote>\n"},{"title":"A. their role may be underestimated","raw":"### A. their role may be underestimated\n\n> 一些艺术家担心合作中其作用可能被低估。\n\n**做题模式中的状态：** 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。\n\n**出处：**\n\n> But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other's work. Such an approach can both prompt new research as well as result in powerful art.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n</section>"},{"title":"A. their role may be underestimated","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 一些艺术家担心合作中其作用可能被低估。\n\n`role may be underestimated`涉及如何看待艺术家的作用，第4段的`do not simply assist scientists`正是在纠正对这种作用的理解，因此回看第二句、第三句。\n\n原文说艺术家`do not simply assist scientists`，他们的工作也不应只被看作研究对象。这两处否定都在反对把艺术家的作用缩小：只替科学家传播，或者只提供被研究的作品。\n\n选项的`role may be underestimated`把这种顾虑概括为作用可能被低估。\n\n它没有说艺术家完全没有作用，而是说他们能参与的部分可能没有得到充分看待，与原文的限制性看法相接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p><code>role may be underestimated</code>涉及如何看待艺术家的作用，第4段的<code>do not simply assist scientists</code>正是在纠正对这种作用的理解，因此回看第二句、第三句。</p>\n<p>原文说艺术家<code>do not simply assist scientists</code>，他们的工作也不应只被看作研究对象。这两处否定都在反对把艺术家的作用缩小：只替科学家传播，或者只提供被研究的作品。</p>\n<p>选项的<code>role may be underestimated</code>把这种顾虑概括为作用可能被低估。</p>\n<p>它没有说艺术家完全没有作用，而是说他们能参与的部分可能没有得到充分看待，与原文的限制性看法相接。</p>\n</section>"},{"title":"A. their role may be underestimated","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other's work. Such an approach can both prompt new research as well as result in powerful art.\n>\n> 但真正的伙伴关系必须双向。回应《自然》调查的艺术家少于科学家，不过一些受访者指出，艺术家并不只是协助科学家满足传播要求；其作品也不应只被看作研究对象。双方在项目中有共同关切、能够共同设计、互相批评时，联盟最有价值。这样的方式既可推动新研究，也可产生有力量的艺术。\n\ntwo-way street先定双向关系，再以两项否定纠正片面定位，之后要求共享利益、共同设计、互相批评。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Artists worry that their role may be underestimated.\n>\n> 一些艺术家担心合作中其作用可能被低估。\n\nA保留角色范围被看窄这一中心，没有说艺术家完全没有作用，也不另加声誉或创作能力已受损的后果。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>一些艺术家担心合作中其作用可能被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n</section><section class=\"revealPar d their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other's work. Such an approach can both prompt new research as well as result in powerful art.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>一些艺术家担心合作中其工作可能被引入歧途。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n</section>"},{"title":"D. their work may be misguided","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 一些艺术家担心合作中其工作可能被引入歧途。\n\n艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。\n\n理想合作允许共同设计、彼此批评，最终可以产生新研究与有力量的艺术，两方都能获益。\n\nD需要工作方向受到错误引导的证据。限制角色与误导方向并不相同，互相批评也不是让艺术走入歧途。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup": 术家并不只是协助科学家满足传播要求；其作品也不应只被看作研究对象。双方在项目中有共同关切、能够共同设计、互相批评时，联盟最有价值。这样的方式既可推动新研究，也可产生有力量的艺术。\n\n理想合作允许共同设计、彼此批评，最终可以产生新研究与有力量的艺术，两方都能获益。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Artists worry that their work may be misguided.\n>\n> 一些艺术家担心合作中其工作可能被引入歧途。\n\nD需要工作方向受到错误引导的证据。限制角色与误导方向并不相同，互相批评也不是让艺术走入歧途。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>一些艺术家担心合作中其工作可能被引入歧途。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些艺术家担心合作中其工作可能被引入歧途。</p>\n</blockquote>\n<p>艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。</p>\n<p>理想合作允许共同设计、彼此批评，最终可以产生新研究与有力量的艺术，两方都能获益。</p>\n<p>D需要工作方向受到错误引导的证据。限制角色与误导方向并不相同，互相批评也不是让艺术走入歧途。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<p>但真正的伙伴关系必须双向。回应《自然》调查的艺术家少于科学家，不过一些受访者指出，艺术家并不只是协助科学家满足传播要求；其作品也不应只被看作研究对象。双方在项目中有共同关切、能够共同设计、互相批评时，联盟最有价值。这样的方式既可推动新研究，也可产生有力量的艺术。</p>\n</blockquote>\n<p>理想合作允许共同设计、彼此批评，最终可以产生新研究与有力量的艺术，两方都能获益。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Artists worry that their work may be misguided.</p>\n<p>一些艺术家担心合作中其工作可能被引入歧途。</p>\n</blockquote>\n<p>D需要工作方向受到错误引导的证据。限制角色与误导方向并不相同，互相批评也不是让艺术走入歧途。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. A**\n\n- A：不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。\n- B：角色被局限于辅助或被研究，与外界声誉下降不同；段落没有从合作分工推到艺术家名声受损。\n- C：缺少共同设计可能限制创作发挥，C有这种间接联系；但原文直接纠正的是艺术家角色过窄，A比创造力受抑制更贴切。\n- D：艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1098,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"33","questionConclusion":true},"html":"<blockquote>\n<p><strong>33. A</strong></p>\n</blockquote>\n<ul>\n<li>A：不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。</li>\n<li>B：角色被局限于辅助或被研究，与外界声誉下降不同；段落没有从合作分工推到艺术家名声受损。</li>\n<li>C：缺少共同设计可能限制创作发挥，C有这种间接联系；但原文直接纠正的是艺术家角色过窄，A比创造力受抑制更贴切。</li>\n<li>D：艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。</li>\n</ul>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> What does the author say about CAVS?\n>\n> 关于高级视觉研究中心，作者说了什么？\n\n### 题型\n\n机构细节与作用题：区分中心目的、名称来源、共同兴趣和身份互通。\n\n题干给出CAVS，可以直接找到第5段的Center for Advanced Visual Studies (CAVS)。把这一整段读完，查看中心的设立目的、围绕光的项目，以及后来对研究人员与艺术家关系的展望。\n\n### 核心出处\n\n> when leading researchers could also be artists, writers and poets, and vice versa.\n>\n> to explore the role of technology in culture.\n>\n> both artists and scientists had an interest in, and therefore could form the basis of collaboration.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"34","questionIntro":true},"html":"<blockquote>\n<p>What does the author say about CAVS?</p>\n<p>关于高级视觉研究中心，作者说了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>机构细节与作用题：区分中心目的、名称来源、共同兴趣和身份互通。</p>\n<p>题干给出CAVS，可以直接找到第5段的Center for Advanced Visual Studies (CAVS)。把这一整段读完，查看中心的设立目的、围绕光的项目，以及后来对研究人员与艺术家关系的展望。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>to explore the role of technology in culture.</p>\n<p>both artists and scientists had an interest in, and therefore could form the basis of collaboration.</p>\n</blockquote>\n"},{"title":"A. It was headed alternately by artists and scientists.","raw":"### A. It was headed alternately by artists and scientists.\n\n> 作者说CAVS曾由艺术家与科学家轮流领导。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nleading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。\n\n**出处：**\n\n> More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the \"visual studies\" in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n</section>"},{"title":"A. It was headed alternately by artists and scientists.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者说CAVS曾由艺术家与科学家轮流领导。\n\n`headed alternately`说的是中心领导人的轮换，第5段同时提到这两种身份的地方是`leading researchers could also be artists`，因此回看末句的主语和`could also be`连接的内容。\n\n原文说`leading researchers could also be artists`，即杰出的研究人员也能成为艺术家、作家和诗人，反过来也一样。选项的`headed alternately`则说艺术家和科学家轮流担任中心负责人。`leading`在这里修饰`researchers`，表示研究人员杰出，并不是中心领导职位；`could also be`表达身份可相兼，不是不同人在时间上轮换领导。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p><code>headed alternately</code>说的是中心领导人的轮换，第5段同时提到这两种身份的地方是<code>leading researchers could also be artists</code>，因此回看末句的主语和<code>could also be</code>连接的内容。</p>\n<p>原文说<code>leading researchers could also be artists</code>，即杰出的研究人员也能成为艺术家、作家和诗人，反过来也一样。选项的<code>headed alternately</code>则说艺术家和科学家轮流担任中心负责人。<code>leading</code>在这里修饰<code>researchers</code>，表示研究人员杰出，并不是中心领导职位；<code>could also be</code>表达身份可相兼，不是不同人在时间上轮换领导。</p>\n</section>"},{"title":"A. It was headed alternately by artists and scientists.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the \"visual studies\" in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.\n>\n> 半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。\n\nCAVS先以共同兴趣开展项目，再展望研究者与艺术家身份互通，而非叙述历任负责人。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> It was headed alternately by artists and scientists.\n>\n> 作者说CAVS曾由艺术家与科学家轮流领导。\n\nA需要headed及alternately的任职轮换。leading修饰研究者水平，vice versa表示身份关系可反过来，不表示时间上的接班。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more su n</section>"},{"title":"B. It exemplified valuable art-science alliances.","raw":"### B. It exemplified valuable art-science alliances.\n\n> 作者说CAVS体现了有价值的艺术科学联盟。\n\n**做题模式中的状态：** 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n光是双方共同兴趣，成为合作基础；中心又期待研究和艺术身份相通，正体现前段要求的双向合作价值。\n\n**出处：**\n\n> More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the \"visual studies\" in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-B-0\"><blockquote>\n<p>作者说CAVS体现了有价值的艺术科学联盟。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>光是双方共同兴趣，成为合作基础；中心又期待研究和艺术身份相通，正体现前段要求的双向合作价值。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an int al Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the \"visual studies\" in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.\n>\n> 半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。\n\n共同兴趣先连起两方，末句vice versa使艺术与研究身份相通，关系是互相进入而非一方地位向上提升。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Its founders sought to raise the status of artists.\n>\n> 作者说CAVS创办者试图提高艺术家地位。\n\nD需要艺术家原先地位较低及创办者要提升它的意图。前段反对低估角色，也不能自动移为CAVS创办者的特定目标。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>作者说CAVS创办者试图提高艺术家地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>创办者选择光为项目中心，旨在探索技术与文化的联系，未提出提高艺术家社会地位的目标。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者说CAVS创办者试图提高艺术家地位。</p>\n</blockquote>\n<p><code>raise the status of artists</code>谈创办者要改变艺术家的地位，第5段<code>The founders</code>后实际写的是<code>focused their projects around light</code>，因此先核对第二句，再看末句有关艺术家和研究人员身份的展望。</p>\n<p>原文中创办者<code>focused their projects around light</code>，说明他们把项目放在什么主题上；末句展望研究人员也能成为艺术家，反之亦然。选项的<code>raise the status of artists</code>则把创办者的目标写成提升艺术家的地位。跨越研究与艺术身份是在拉通两类工作，并没有说其中一类地位较低、更没有说创办者要让这一类向上提升。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。</p>\n</blockquote>\n<p>共同兴趣先连起两方，末句vice versa使艺术与研究身份相通，关系是互相进入而非一方地位向上提升。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its founders sought to raise the status of artists.</p>\n<p>作者说CAVS创办者试图提高艺术家地位。</p>\n</blockquote>\n<p>D需要艺术家原先地位较低及创办者要提升它的意图。前段反对低估角色，也不能自动移为CAVS创办者的特定目标。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. B**\n\n- A：leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。\n- B：光是双方共同兴趣，成为合作基础；中心又期待研究和艺术身份相通，正体现前段要求的双向合作价值。\n- C：项目确实围绕光，推进视觉研究与其内容有关；但名称解释不等于已给出选项所称项目目的，B更完整概括共同兴趣与跨界联盟。\n- D：创办者选择光为项目中心，旨在探索技术与文化的联系，未提出提高艺术家社会地位的目标。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1411,1344,313],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"34","questionConclusion":true},"html":"<blockquote>\n<p><strong>34. B</strong></p>\n</blockquote>\n<ul>\n<li>A：leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。</li>\n<li>B：光是双方共同兴趣，成为合作基础；中心又期待研究和艺术身份相通，正体现前段要求的双向合作价值。</li>\n<li>C：项目确实围绕光，推进视觉研究与其内容有关；但名称解释不等于已给出选项所称项目目的，B更完整概括共同兴趣与跨界联盟。</li>\n<li>D：创办者选择光为项目中心，旨在探索技术与文化的联系，未提出提高艺术家社会地位的目标。</li>\n</ul>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n> In the last paragraph, the author holds that art-science collaborations ______.\n>\n> 在最后一段中，作者认为艺术与科学的合作应当怎样？\n\n### 题型\n\n段落观点题：按needs to、must not找合作要求，保留as strong as ever的比较关系。\n\n题干明确给出In the last paragraph，直接把第6段完整读完。注意作者从调查趋势转到to make a collaboration work，随后用needs to和must not提出要求，最后说明双方共同具有的特点。\n\n### 核心出处\n\n> The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication\n>\n> and challenge and critique are core to both, too.\n>\n> Nature’s poll findings suggest that this trend is as strong as ever","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"35","questionIntro":true},"html":"<blockquote>\n<p>In the last paragraph, the author holds that art-science collaborations ______.</p>\n<p>在最后一段中，作者认为艺术与科学的合作应当怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落观点题：按needs to、must not找合作要求，保留as strong as ever的比较关系。</p>\n<p>题干明确给出In the last paragraph，直接把第6段完整读完。注意作者从调查趋势转到to make a collaboration work，随后用needs to和must not提出要求，最后说明双方共同具有的特点。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication</p>\n<p>and challenge and critique are core to both, too.</p>\n<p>Nature’s poll findings suggest that this trend is as strong as ever</p>\n</blockquote>\n"},{"title":"A. are likely to go beyond public expectations","raw":"### A. are likely to go beyond public expectations\n\n> 末段认为艺术与科学合作很可能超出公众预期。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\ngo beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。\n\n**出处：**\n\n> Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-35-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n</section>"},{"title":"A. are likely to go beyond public expectations","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 末段认为艺术与科学合作很可能超出公众预期。\n\n`public expectations`是选项说要超出的对象，原文第二句`go beyond`后接的是`the necessary purpose of research communication`，因此回看这句，比较两边究竟要超出什么。\n\n原文说合作的范围`needs to go beyond the necessary purpose of research communication`，要求它超出研究传播这一必要目的。选项则说很可能超出`public expectations`，把应当拓展合作目标改成了将来成果会胜过公众预期。原句的`go beyond`所接的是合作目的，既不是公众的预测，也不是对未来是否超预期作概率判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p><code>public expectations</code>是选项说要超出的对象，原文第二句<code>go beyond</code>后接的是<code>the necessary purpose of research communication</code>，因此回看这句，比较两边究竟要超出什么。</p>\n<p>原文说合作的范围<code>needs to go beyond the necessary purpose of research communication</code>，要求它超出研究传播这一必要目的。选项则说很可能超出<code>public expectations</code>，把应当拓展合作目标改成了将来成果会胜过公众预期。原句的<code>go beyond</code>所接的是合作目的，既不是公众的预测，也不是对未来是否超预期作概率判断。</p>\n</section>"},{"title":"A. are likely to go beyond public expectations","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.\n>\n> 《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。\n\n作者从合作趋势转到要使合作有效的要求，needs to和must not都在规定怎样合作。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Art-science collaborations are likely to go beyond public expectations.\n>\n> 末段认为艺术与科学合作很可能超出公众预期。\n\nA需要公众期待及未来成果胜过期待的依据。合作目标更广，不等于公众预期较低或结果将使他们惊喜。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend 的依据。合作目标更广，不等于公众预期较低或结果将使他们惊喜。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. will intensify interdisciplinary competition","raw":"### B. will intensify interdisciplinary competition\n\n> 末段认为艺术与科学合作将加剧学科间竞争。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\nchallenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。\n\n**出处：**\n\n> Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-35-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-B-0\"><blockquote>\n<p>末段认为艺术与科学合作将加剧学科间竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>challenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n</section>"},{"title":"B. will intensify interdisciplinary competition","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 末段认为艺术与科学合作将加剧学科间竞争。\n\n`interdisciplinary competition`说两类学科彼此竞争，末句中可能让人想到这种关系的是`challenge and critique`，但原句要看的是它们与`both`怎样连接，因此回看最后一句。\n\n原文说`challenge and critique`对双方都居于核心位置，说明艺术与科学有这样的共同特点。选项把它改成合作`will intensify interdisciplinary competition`，即两类学科之间竞争会加强。挑战与批评作为两边都重视的活动，并不等于两类学科互相争胜；原文也没有从这种共同特点推出竞争程度将上升。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-B-0\"><blockquote>\n<p>末段认为艺术与科学合作将加剧学科间竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>challenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作将加剧学科间竞争。</p>\n</blockquote>\n<p><code>interdisciplinary competition</code>说两类学科彼此竞争，末句中可能让人想到这种关系的是<code>challenge and critique</code>，但原句要看的是它们与<code>both</code>怎样连接，因此回看最后一句。</p>\n<p>原文说<code>challenge and critique</code>对双方都居于核心位置，说明艺术与科学有这样的共同特点。选项把它改成合作<code>will intensify interdisciplinary competition</code>，即两类学科之间竞争 ch other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.\n>\n> 《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。\n\n作者先肯定趋势延续，but随即转向如何做好合作，并未再列受欢迎程度上升的数据。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Art-science collaborations are becoming more popular than before.\n>\n> 末段认为艺术与科学合作正比以前更受欢迎。\n\nD需要现在高于过去的比较。过去已经强劲、如今仍强劲不自动意味着更强，首段未来意愿也不是历年增长数据。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>末段认为艺术与科学合作正比以前更受欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>as strong as ever说仍然强劲，more popular than before说比过去更受欢迎，二者比较方向不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作正比以前更受欢迎。</p>\n</blockquote>\n<p><code>more popular than before</code>比较现在和过去，第一句的<code>as strong as ever</code>也谈趋势的延续强度，因此回看该句的比较方式。</p>\n<p>原文说趋势<code>as strong as ever</code>，即一如既往地强劲，说明它仍然保持很强的势头。选项的<code>more popular than before</code>则明确断言受欢迎程度高于从前。持续强劲与比过去进一步增强不是同一种时间比较；原句用<code>as</code>…<code>as</code>表达延续的强度，选项改成<code>more</code>…<code>than</code>所表达的上升。</p>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<p>《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。</p>\n</blockquote>\n<p>作者先肯定趋势延续，but随即转向如何做好合作，并未再列受欢迎程度上升的数据。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations are becoming more popular than before.</p>\n<p>末段认为艺术与科学合作正比以前更受欢迎。</p>\n</blockquote>\n<p>D需要现在高于过去的比较。过去已经强劲、如今仍强劲不自动意味着更强，首段未来意愿也不是历年增长数据。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"35题结论","raw":"### 35题结论\n\n> **35. C**\n\n- A：go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。\n- B：challenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。\n- C：needs to go beyond research communication直接要求合作超出科研传播，C保留这项范围扩展。\n- D：as strong as ever说仍然强劲，more popular than before说比过去更受欢迎，二者比较方向不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"35","questionConclusion":true},"html":"<blockquote>\n<p><strong>35. C</strong></p>\n</blockquote>\n<ul>\n<li>A：go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。</li>\n<li>B：challenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。</li>\n<li>C：needs to go beyond research communication直接要求合作超出科研传播，C保留这项范围扩展。</li>\n<li>D：as strong as ever说仍然强劲，more popular than before说比过去更受欢迎，二者比较方向不同。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：艺术-科学合作的积极反响**（段落1调查结果） 读者反馈：（启发性的 + 富有挑战性的 + 激励人心的 + 有趣的）→ 调查数据：【40%曾合作 + 几乎所有人愿意未来合作】\n\n↓（原因解释）\n\n**逻辑层次2：科学家寻求艺术家的原因**（段落2需求分析） 趋势：科学家越来越多寻求视觉艺术家 → 目的：帮助传达工作给新受众 → 价值：（接触更广泛受众 + 建立情感联系 → 增强学习效果）\n\n↓（具体案例）\n\n**逻辑层次3：成功合作的实例**（段落3案例展示） 悉尼交响乐团案例：改编维瓦尔第《四季》→ 方法：注入最新气候预测数据 → 意义：在联合国气候大会前的创造性行动号召\n\n//（转折：深层问题）\n\n**逻辑层次4：真正伙伴关系的要求**（段落4合作本质） 问题：艺术家参与度低 + 担忧：【不应仅是协助传播 + 不应仅是研究对象】→ 理想模式：（共同利益 + 共同设计 + 相互批评）→ 效果：（激发新研究 + 产生有力艺术）\n\n↓（历史案例）\n\n**逻辑层次5：CAVS的启示**（段落5历史经验） MIT的CAVS：以光为合作基础（双方都感兴趣）→ 愿景：顶尖研究人员也可以是艺术家/作家/诗人，反之亦然\n\n↓（当代建议）\n\n**逻辑层次6：成功合作的要素**（段落6总结建议） 现状：趋势依然强劲 → 成功要素：【投入时间 + 接受惊喜和挑战】→ 超越传播目的 + 避免刻板印象 → 共同点：（都沉浸在发现和发明中 + 挑战和批判是核心）\n\n↑（全文主旨）\n\n全文核心观点：艺术-科学合作获得积极反响，但要实现真正有价值的伙伴关系，需要超越单纯的科学传播目的，建立平等的双向合作，让双方在共同的发现和创造过程中相互激发。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：艺术-科学合作的积极反响</strong>（段落1调查结果） 读者反馈：（启发性的 + 富有挑战性的 + 激励人心的 + 有趣的）→ 调查数据：【40%曾合作 + 几乎所有人愿意未来合作】</p>\n<p>↓（原因解释）</p>\n<p><strong>逻辑层次2：科学家寻求艺术家的原因</strong>（段落2需求分析） 趋势：科学家越来越多寻求视觉艺术家 → 目的：帮助传达工作给新受众 → 价值：（接触更广泛受众 + 建立情感联系 → 增强学习效果）</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次3：成功合作的实例</strong>（段落3案例展示） 悉尼交响乐团案例：改编维瓦尔第《四季》→ 方法：注入最新气候预测数据 → 意义：在联合国气候大会前的创造性行动号召</p>\n<p>//（转折：深层问题）</p>\n<p><strong>逻辑层次4：真正伙伴关系的要求</strong>（段落4合作本质） 问题：艺术家参与度低 + 担忧：【不应仅是协助传播 + 不应仅是研究对象】→ 理想模式：（共同利益 + 共同设计 + 相互批评）→ 效果：（激发新研究 + 产生有力艺术）</p>\n<p>↓（历史案例）</p>\n<p><strong>逻辑层次5：CAVS的启示</strong>（段落5历史经验） MIT的CAVS：以光为合作基础（双方都感兴趣）→ 愿景：顶尖研究人员也可以是艺术家/作家/诗人，反之亦然</p>\n<p>↓（当代建议）</p>\n<p><strong>逻辑层次6：成功合作的要素</strong>（段落6总结建议） 现状：趋势依然强劲 → 成功要素：【投入时间 + 接受惊喜和挑战】→ 超越传播目的 + 避免刻板印象 → 共同点：（都沉浸在发现和发明中 + 挑战和批判是核心）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：艺术-科学合作获得积极反响，但要实现真正有价值的伙伴关系，需要超越单纯的科学传播目的，建立平等的双向合作，让双方在共同的发现和创造过程中相互激发。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. The appeal of working across art and science\n\n> 跨艺术与科学合作的吸引力\n\n读者积极评价合作经历并表达未来意愿，接着说明科学家借助艺术接触新受众和增强学习。\n\n> Enlightening, challenging, stimulating, fun.\n\n开头四个评价词呈现合作的启发、挑战、激励和趣味，随后未来合作意愿进一步支持积极回应。\n\n> Such an encouraging results is not surprising.\n\nSuch an encouraging result回指调查反馈，下一步解释为何这种正面结果不令人意外。\n\n> \"Artists help scientists reach a broader audience and make emotional connections that enhance learning.\" One respondent said.\n\n艺术帮助接触更广受众并建立情感联系，说明合作吸引力的一项实际来源，标题要覆盖体验与传播收益。\n\n这一部分的推进关系是：\n\n> 读者积极体验和合作意愿 → 科学家寻求艺术伙伴 → 更广受众与学习联系\n\nappeal对应积极评价与合作意愿，working across覆盖双方关系。\n\n再看最强干扰项E：A permanent end to criticism between disciplines。\n\n积极评价不表示没有挑战或批评，末段反而强调二者重要。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. The appeal of working across art and science</p>\n<blockquote>\n<p>跨艺术与科学合作的吸引力</p>\n</blockquote>\n<p>读者积极评价合作经历并表达未来意愿，接着说明科学家借助艺术接触新受众和增强学习。</p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun.</p>\n</blockquote>\n<p>开头四个评价词呈现合作的启发、挑战、激励和趣味，随后未来合作意愿进一步支持积极回应。</p>\n<blockquote>\n<p>Such an encouraging results is not surprising.</p>\n</blockquote>\n<p>Such an encouraging result回指调查反馈，下一步解释为何这种正面结果不令人意外。</p>\n<blockquote>\n<p>&quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.</p>\n</blockquote>\n<p>艺术帮助接触更广受众并建立情感联系，说明合作吸引力的一项实际来源，标题要覆盖体验与传播收益。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>读者积极体验和合作意愿 → 科学家寻求艺术伙伴 → 更广受众与学习联系</p>\n</blockquote>\n<p>appeal对应积极评价与合作意愿，working across覆盖双方关系。</p>\n<p>再看最强干扰项E：A permanent end to criticism between disciplines。</p>\n<p>积极评价不表示没有挑战或批评，末段反而强调二者重要。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】B. Music as a route for communicating climate science\n\n> 以音乐传播气候科学\n\n音乐家将气候预测数据融入《四季》重编，使作品成为气候会议前的行动呼吁。\n\n> One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi's The Four Seasons.\n\nOne example标明该演出是前段传播作用的实例，而不是新开一项科研成果。\n\n> They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University's Climate Change Communication Research Hub.\n\n最新气候预测数据被注入乐谱，说明科学信息如何通过熟悉艺术形式让听众接近。\n\n> The performance was a creative call to action ahead of November's United Nations Climate Change Conference in Glasgow, UK.\n\ncreative call to action说明传播落点是气候行动呼吁，标题需同时包含音乐形式与科学内容。\n\n这一部分的推进关系是：\n\n> 已有气候数据 → 音乐改编呈现 → 向公众传达信息并呼吁行动\n\nmusic as a route指艺术提供接触科学的方式，不是音乐直接产生新的科学发现。\n\n再看最强干扰项G：Artists as objects to be studied and nothing more。\n\n这是共同制作传播作品，未把艺术家缩成研究对象。\n\n**42题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】B. Music as a route for communicating climate science</p>\n<blockquote>\n<p>以音乐传播气候科学</p>\n</blockquote>\n<p>音乐家将气候预测数据融入《四季》重编，使作品成为气候会议前的行动呼吁。</p>\n<blockquote>\n<p>One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons.</p>\n</blockquote>\n<p>One example标明该演出是前段传播作用的实例，而不是新开一项科研成果。</p>\n<blockquote>\n<p>They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub.</p>\n</blockquote>\n<p>最新气候预测数据被注入乐谱，说明科学信息如何通过熟悉艺术形式让听众接近。</p>\n<blockquote>\n<p>The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n<p>creative call to action说明传播落点是气候行动呼吁，标题需同时包含音乐形式与科学内容。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>已有气候数据 → 音乐改编呈现 → 向公众传达信息并呼吁行动</p>\n</blockquote>\n<p>music as a route指艺术提供接触科学的方式，不是音乐直接产生新的科学发现。</p>\n<p>再看最强干扰项G：Artists as objects to be studied and nothing more。</p>\n<p>这是共同制作传播作品，未把艺术家缩成研究对象。</p>\n<p><strong>42题选B。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】D. A partnership in which neither side is merely an assistant\n\n> 双方都不只是助手的伙伴关系\n\nBut转向双向伙伴要求，反对只把艺术家当传播助手或作品当研究物，要求共同设计与互评。\n\n> But a genuine partnership must be a two-way street.\n\nBut将讨论从艺术协助传播推进到伙伴关系必须双向，反对一方仅为另一方服务。\n\n> Nor should their work be considered only as an object of study.\n\nNor...only继续限制片面定位：艺术作品也不应只当研究对象，双方应共同设计并互评。\n\n> Such an approach can both prompt new research as well as result in powerful art.\n\nboth...as well as并列科研和艺术两端成果，证明真正合作应让双方都有创造空间。\n\n这一部分的推进关系是：\n\n> 反对单向辅助角色 → 共享利益、共同设计互评 → 科研与艺术双重成果\n\nneither ... merely an assistant概括角色平等与共同参与；不是拒绝传播本身。\n\n再看最强干扰项G：Artists as objects to be studied and nothing more。\n\n原文明确Nor ... only as an object of study，干扰项与之相反。\n\n**43题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】D. A partnership in which neither side is merely an assistant</p>\n<blockquote>\n<p>双方都不只是助手的伙伴关系</p>\n</blockquote>\n<p>But转向双向伙伴要求，反对只把艺术家当传播助手或作品当研究物，要求共同设计与互评。</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street.</p>\n</blockquote>\n<p>But将讨论从艺术协助传播推进到伙伴关系必须双向，反对一方仅为另一方服务。</p>\n<blockquote>\n<p>Nor should their work be considered only as an object of study.</p>\n</blockquote>\n<p>Nor...only继续限制片面定位：艺术作品也不应只当研究对象，双方应共同设计并互评。</p>\n<blockquote>\n<p>Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n<p>both...as well as并列科研和艺术两端成果，证明真正合作应让双方都有创造空间。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>反对单向辅助角色 → 共享利益、共同设计互评 → 科研与艺术双重成果</p>\n</blockquote>\n<p>neither ... merely an assistant概括角色平等与共同参与；不是拒绝传播本身。</p>\n<p>再看最强干扰项G：Artists as objects to be studied and nothing more。</p>\n<p>原文明确Nor ... only as an object of study，干扰项与之相反。</p>\n<p><strong>43题选D。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】A. A historical model built on a shared interest\n\n> 建立在共同兴趣上的历史合作模式\n\nCAVS以双方都感兴趣的光为基础，并期待研究者和艺术家身份相通。\n\n> More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture.\n\nCAVS设立目的为探索技术在文化中的作用，提供前段双向合作的历史实例。\n\n> Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration.\n\n双方共同兴趣在光，therefore明确将这一共同主题接成合作基础。\n\n> As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.\n\n研究与艺术身份互通的展望继续扩展双向关系，标题应概括共同兴趣上的跨界模式，而非只取中心名称。\n\n这一部分的推进关系是：\n\n> 技术与文化的探索 → 光作为共同兴趣 → 跨越研究与艺术身份\n\nhistorical model对应半世纪前的中心，共同兴趣是合作基础。\n\n再看最强干扰项B：Music as a route for communicating climate science。\n\n本段不是继续音乐例子，而是在介绍技术与文化合作的制度实践。\n\n**44题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】A. A historical model built on a shared interest</p>\n<blockquote>\n<p>建立在共同兴趣上的历史合作模式</p>\n</blockquote>\n<p>CAVS以双方都感兴趣的光为基础，并期待研究者和艺术家身份相通。</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture.</p>\n</blockquote>\n<p>CAVS设立目的为探索技术在文化中的作用，提供前段双向合作的历史实例。</p>\n<blockquote>\n<p>Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration.</p>\n</blockquote>\n<p>双方共同兴趣在光，therefore明确将这一共同主题接成合作基础。</p>\n<blockquote>\n<p>As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<p>研究与艺术身份互通的展望继续扩展双向关系，标题应概括共同兴趣上的跨界模式，而非只取中心名称。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>技术与文化的探索 → 光作为共同兴趣 → 跨越研究与艺术身份</p>\n</blockquote>\n<p>historical model对应半世纪前的中心，共同兴趣是合作基础。</p>\n<p>再看最强干扰项B：Music as a route for communicating climate science。</p>\n<p>本段不是继续音乐例子，而是在介绍技术与文化合作的制度实践。</p>\n<p><strong>44题选A。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】F. Commitment and openness beyond communication alone\n\n> 超越单纯传播的投入与开放\n\n双方要投入时间、接受惊喜和挑战，超越传播目的，避免刻板印象，并承认发现、创造和批评是共有活动。\n\n> Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge.\n\n调查趋势仍强，but转向怎样合作才有效，投入时间与接受挑战是条件。\n\n> The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other.\n\n超越传播、避免刻板印象进一步要求平等开放，而不是只把对方当单一用途的工具。\n\n> Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.\n\nalike和both总结双方共同的发现、发明、挑战、批评，给开放伙伴关系提供理由。\n\n这一部分的推进关系是：\n\n> 合作热度延续 → 投入时间并超越传播 → 以共同创造活动建立开放关系\n\ncommitment对应invest time，openness对应embrace与反对stereotyping。\n\n再看最强干扰项E：A permanent end to criticism between disciplines。\n\n挑战和批评被称为双方的核心，不能写成彻底终结批评。\n\n**45题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】F. Commitment and openness beyond communication alone</p>\n<blockquote>\n<p>超越单纯传播的投入与开放</p>\n</blockquote>\n<p>双方要投入时间、接受惊喜和挑战，超越传播目的，避免刻板印象，并承认发现、创造和批评是共有活动。</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge.</p>\n</blockquote>\n<p>调查趋势仍强，but转向怎样合作才有效，投入时间与接受挑战是条件。</p>\n<blockquote>\n<p>The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other.</p>\n</blockquote>\n<p>超越传播、避免刻板印象进一步要求平等开放，而不是只把对方当单一用途的工具。</p>\n<blockquote>\n<p>Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n<p>alike和both总结双方共同的发现、发明、挑战、批评，给开放伙伴关系提供理由。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>合作热度延续 → 投入时间并超越传播 → 以共同创造活动建立开放关系</p>\n</blockquote>\n<p>commitment对应invest time，openness对应embrace与反对stereotyping。</p>\n<p>再看最强干扰项E：A permanent end to criticism between disciplines。</p>\n<p>挑战和批评被称为双方的核心，不能写成彻底终结批评。</p>\n<p><strong>45题选F。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从积极调查回应提出合作价值问题 |\n| B | 提出跨界合作所需投入和开放 |\n| C | 说明艺术帮助科学接触更多受众 |\n| D | 用CAVS及共同光主题说明合作基础 |\n| E | 转折提出真正合作需要双向参与 |\n| F | 用气候数据音乐改编展示传播作用 |\n| G | 展开共同设计互评的双重收益 |\n| H | 总结超越单向传播的伙伴价值 |\n\n全文推进：\n\n> 从积极调查回应提出合作价值问题 → 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用 → 转折提出真正合作需要双向参与 → 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放 → 总结超越单向传播的伙伴价值\n\n完整顺序：\n\n**A → C → F → E → G → D → B → H**\n\n41—45：C、F、G、D、B。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从积极调查回应提出合作价值问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>提出跨界合作所需投入和开放</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明艺术帮助科学接触更多受众</td>\n</tr>\n<tr>\n<td>D</td>\n<td>用CAVS及共同光主题说明合作基础</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转折提出真正合作需要双向参与</td>\n</tr>\n<tr>\n<td>F</td>\n<td>用气候数据音乐改编展示传播作用</td>\n</tr>\n<tr>\n<td>G</td>\n<td>展开共同设计互评的双重收益</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结超越单向传播的伙伴价值</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从积极调查回应提出合作价值问题 → 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用 → 转折提出真正合作需要双向参与 → 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放 → 总结超越单向传播的伙伴价值</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → C → F → E → G → D → B → H</strong></p>\n<p>41—45：C、F、G、D、B。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → C → F。\n\n先看前段A的结尾：\n\n> Their enthusiasm invites a closer look at what makes collaboration valuable.\n\n再看C段开头：\n\n> One recognised value is communication.\n\n前段的what makes collaboration valuable提出价值问题，One recognised value直接以传播给出第一项回答。\n\n本段内部继续写道：\n\n> Artists can help scientific work reach audiences that might otherwise overlook it, and emotional connections can strengthen learning. This contribution explains why researchers increasingly seek visual and performing artists as partners.\n\n艺术接触原本可能忽视科学的受众，情感联系又增强学习；This contribution概括两项作用并解释科学家寻求合作。\n\n后段F开头是：\n\n> A musical performance incorporating climate predictions illustrates that contribution.\n\nthat contribution回指当前传播与学习作用，音乐演出在后段作具体例子。\n\n这三段的推进关系：\n\n> 从积极调查回应提出合作价值问题 → 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用\n\n再检验候选G：\n\n> Shared design also allows participants to question and critique one another’s work.\n\nShared design属于双方共同设计的阶段，而此处先介绍传播价值，否则后段that contribution没有传播内容可回指。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>41题是全文第2段，局部关系为A → C → F。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their enthusiasm invites a closer look at what makes collaboration valuable.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>One recognised value is communication.</p>\n</blockquote>\n<p>前段的what makes collaboration valuable提出价值问题，One recognised value直接以传播给出第一项回答。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Artists can help scientific work reach audiences that might otherwise overlook it, and emotional connections can strengthen learning. This contribution explains why researchers increasingly seek visual and performing artists as partners.</p>\n</blockquote>\n<p>艺术接触原本可能忽视科学的受众，情感联系又增强学习；This contribution概括两项作用并解释科学家寻求合作。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>A musical performance incorporating climate predictions illustrates that contribution.</p>\n</blockquote>\n<p>that contribution回指当前传播与学习作用，音乐演出在后段作具体例子。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从积极调查回应提出合作价值问题 → 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Shared design also allows participants to question and critique one another’s work.</p>\n</blockquote>\n<p>Shared design属于双方共同设计的阶段，而此处先介绍传播价值，否则后段that contribution没有传播内容可回指。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为C → F → E。\n\n先看前段C的结尾：\n\n> This contribution explains why researchers increasingly seek visual and performing artists as partners.\n\n再看F段开头：\n\n> A musical performance incorporating climate predictions illustrates that contribution.\n\n前段以艺术的传播贡献解释合作需求，that contribution精准承接，音乐演出成为该作用的实例。\n\n本段内部继续写道：\n\n> Data for the seasons were used to reshape a familiar score, giving listeners a different way to encounter scientific information. The performance connected communication with a call for public action.\n\n季节数据改编熟悉乐谱，给受众另一种接触科学信息的方式，结尾再接公共行动呼吁。\n\n后段E开头是：\n\n> Valuable as communication is, a genuine partnership cannot reduce artists to assistants serving scientific needs.\n\nValuable as communication is让步肯定前例价值，却转出不能把艺术家限为助手，形成从传播到双向合作的推进。\n\n这三段的推进关系：\n\n> 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用 → 转折提出真正合作需要双向参与\n\n再检验候选G：\n\n> Shared design also allows participants to question and critique one another’s work.\n\n共同设计和互评需要先提出双向关系，此处应完成传播实例，后面的让步才有具体对象。\n\n**42题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>42题是全文第3段，局部关系为C → F → E。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>This contribution explains why researchers increasingly seek visual and performing artists as partners.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>A musical performance incorporating climate predictions illustrates that contribution.</p>\n</blockquote>\n<p>前段以艺术的传播贡献解释合作需求，that contribution精准承接，音乐演出成为该作用的实例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Data for the seasons were used to reshape a familiar score, giving listeners a different way to encounter scientific information. The performance connected communication with a call for public action.</p>\n</blockquote>\n<p>季节数据改编熟悉乐谱，给受众另一种接触科学信息的方式，结尾再接公共行动呼吁。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Valuable as communication is, a genuine partnership cannot reduce artists to assistants serving scientific needs.</p>\n</blockquote>\n<p>Valuable as communication is让步肯定前例价值，却转出不能把艺术家限为助手，形成从传播到双向合作的推进。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用 → 转折提出真正合作需要双向参与</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Shared design also allows participants to question and critique one another’s work.</p>\n</blockquote>\n<p>共同设计和互评需要先提出双向关系，此处应完成传播实例，后面的让步才有具体对象。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → D。\n\n先看前段E的结尾：\n\n> Both sides need a stake in the project and a voice in its design.\n\n再看G段开头：\n\n> Shared design also allows participants to question and critique one another’s work.\n\n前段要求双方在项目中有利益和设计发言权，Shared design接voice in its design并追加互评作用。\n\n本段内部继续写道：\n\n> Such exchanges can generate new research as well as powerful art. The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.\n\nSuch exchanges回指质疑与批评，科学新研究和艺术成果并列，解释挑战能促进双方发展。\n\n后段D开头是：\n\n> A historical example of this relationship is the centre established at MIT to explore technology’s role in culture.\n\nthis relationship回指彼此挑战共同发展的关系，CAVS在下一段将它实例化。\n\n这三段的推进关系：\n\n> 转折提出真正合作需要双向参与 → 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础\n\n再检验候选B：\n\n> Crossing those boundaries requires an investment of time and a willingness to encounter surprises.\n\nCrossing those boundaries需要先有具体跨界基础，此处先说共享设计的双重收益，才能让后段历史实例明确在证明什么。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Both sides need a stake in the project and a voice in its design.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Shared design also allows participants to question and critique one another’s work.</p>\n</blockquote>\n<p>前段要求双方在项目中有利益和设计发言权，Shared design接voice in its design并追加互评作用。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Such exchanges can generate new research as well as powerful art. The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.</p>\n</blockquote>\n<p>Such exchanges回指质疑与批评，科学新研究和艺术成果并列，解释挑战能促进双方发展。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>A historical example of this relationship is the centre established at MIT to explore technology’s role in culture.</p>\n</blockquote>\n<p>this relationship回指彼此挑战共同发展的关系，CAVS在下一段将它实例化。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转折提出真正合作需要双向参与 → 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises.</p>\n</blockquote>\n<p>Crossing those boundaries需要先有具体跨界基础，此处先说共享设计的双重收益，才能让后段历史实例明确在证明什么。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → D → B。\n\n先看前段G的结尾：\n\n> The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.\n\n再看D段开头：\n\n> A historical example of this relationship is the centre established at MIT to explore technology’s role in culture.\n\n前段明确双方借挑战发展的relationship，A historical example of this relationship把CAVS接成实例。\n\n本段内部继续写道：\n\n> Its projects focused on light because both artists and scientists found it interesting. A common subject provided a basis for crossing boundaries without making one side subordinate.\n\n光是两方都感兴趣的对象，共同主题于是提供平等跨界基础，不将一方降为从属。\n\n后段B开头是：\n\n> Crossing those boundaries requires an investment of time and a willingness to encounter surprises.\n\nthose boundaries直接承接crossing boundaries，下一段再说明跨界需付出的投入。\n\n这三段的推进关系：\n\n> 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放\n\n再检验候选C：\n\n> One recognised value is communication.\n\n单说传播价值会退回讨论开端，不能具体说明当前这种双向关系，也使those boundaries缺少刚建立的跨界所指。\n\n**44题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>44题是全文第6段，局部关系为G → D → B。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>A historical example of this relationship is the centre established at MIT to explore technology’s role in culture.</p>\n</blockquote>\n<p>前段明确双方借挑战发展的relationship，A historical example of this relationship把CAVS接成实例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Its projects focused on light because both artists and scientists found it interesting. A common subject provided a basis for crossing boundaries without making one side subordinate.</p>\n</blockquote>\n<p>光是两方都感兴趣的对象，共同主题于是提供平等跨界基础，不将一方降为从属。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises.</p>\n</blockquote>\n<p>those boundaries直接承接crossing boundaries，下一段再说明跨界需付出的投入。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>One recognised value is communication.</p>\n</blockquote>\n<p>单说传播价值会退回讨论开端，不能具体说明当前这种双向关系，也使those boundaries缺少刚建立的跨界所指。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为D → B → H。\n\n先看前段D的结尾：\n\n> A common subject provided a basis for crossing boundaries without making one side subordinate.\n\n再看B段开头：\n\n> Crossing those boundaries requires an investment of time and a willingness to encounter surprises.\n\n前段共同主题使双方能跨越边界，Crossing those boundaries复现该动作并转向需要时间和开放态度。\n\n本段内部继续写道：\n\n> Participants must resist fixed ideas about what the other group does. Researchers and artists share commitments to discovery and invention, even when their methods and forms of expression differ.\n\nresist fixed ideas要求克服刻板印象，随后发现与发明的共同追求说明彼此并非截然不同的单一角色。\n\n后段H开头是：\n\n> Recognising these shared commitments can extend collaboration beyond the transmission of finished research.\n\nthese shared commitments指共同发现创造，结尾据此要求合作超越传递现成研究成果。\n\n这三段的推进关系：\n\n> 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放 → 总结超越单向传播的伙伴价值\n\n再检验候选C：\n\n> One recognised value is communication.\n\n传播价值在前面已肯定，这里要总结更广伙伴关系；放回One recognised value会中断跨界条件，也不能提供shared commitments的先行内容。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>45题是全文第7段，局部关系为D → B → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>A common subject provided a basis for crossing boundaries without making one side subordinate.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises.</p>\n</blockquote>\n<p>前段共同主题使双方能跨越边界，Crossing those boundaries复现该动作并转向需要时间和开放态度。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Participants must resist fixed ideas about what the other group does. Researchers and artists share commitments to discovery and invention, even when their methods and forms of expression differ.</p>\n</blockquote>\n<p>resist fixed ideas要求克服刻板印象，随后发现与发明的共同追求说明彼此并非截然不同的单一角色。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Recognising these shared commitments can extend collaboration beyond the transmission of finished research.</p>\n</blockquote>\n<p>these shared commitments指共同发现创造，结尾据此要求合作超越传递现成研究成果。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放 → 总结超越单向传播的伙伴价值</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>One recognised value is communication.</p>\n</blockquote>\n<p>传播价值在前面已肯定，这里要总结更广伙伴关系；放回One recognised value会中断跨界条件，也不能提供shared commitments的先行内容。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **interdisciplinary cooperation** | **跨学科合作** | **社会现象｜文化教育｜跨学科学习** | **宏观主题** |\n| shared interests | 共同兴趣 | 人生哲理｜合作 | 个人主题 |\n| creative discovery | 创造性发现 | 人生哲理｜创新 | 个人主题 |\n| **mutual understanding** | **相互理解** | **人生哲理｜理解与包容** | **个人主题** |\n| open-mindedness | 开放心态 | 人生哲理｜理解与包容 | 个人主题 |\n| constructive criticism | 建设性批评 | 人生哲理｜批判性思维 | 个人主题 |\n| science communication | 科学传播 | 社会现象｜文化教育 | 宏观主题 |\n| equal participation | 平等参与 | 人生哲理｜合作 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>interdisciplinary cooperation</strong></td>\n<td><strong>跨学科合作</strong></td>\n<td><strong>社会现象｜文化教育｜跨学科学习</strong h>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The two groups are jointly designing a project around a shared interest.</strong></td>\n<td><strong>两个群体围绕共同兴趣共同设计项目。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture shows a partnership in which both sides contribute ideas.</td>\n<td>图画展示了双方都贡献想法的伙伴关系。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene suggests that collaboration should be a two-way street.</td>\n<td>场景表明合作应当是双向的。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>Nearly forty percent of respondents had taken part in similar projects.</strong></td>\n<td><strong>近四成受访者参加过类似项目。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Almost all respondents would consider collaborating in future.</td>\n<td>几乎所有受访者都愿考虑未来合作。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The findings suggest that interest in cooperation remains strong.</td>\n<td>调查结果表明合作兴趣依然强劲。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement calls on both sides to embrace surprise and challenge.</td>\n<td>这句话呼吁双方接受惊喜与挑战。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage stresses that a productive alliance should go beyond one limited purpose.</td>\n<td>这段文字强调有效合作应超越单一的有限目的。</td>\n</tr>\n</tbody></table></div>\n"}];
