是这样写的：</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<p>但真正的伙伴关系必须双向。回应《自然》调查的艺术家少于科学家，不过一些受访者指出，艺术家并不只是协助科学家满足传播要求；其作品也不应只被看作研究对象。双方在项目中有共同关切、能够共同设计、互相批评时，联盟最有价值。这样的方式既可推动新研究，也可产生有力量的艺术。</p>\n</blockquote>\n<p>理想合作允许共同设计、彼此批评，最终可以产生新研究与有力量的艺术，两方都能获益。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Artists worry that their work may be misguided.</p>\n<p>一些艺术家担心合作中其工作可能被引入歧途。</p>\n</blockquote>\n<p>D需要工作方向受到错误引导的证据。限制角色与误导方向并不相同，互相批评也不是让艺术走入歧途。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>33题结论</h3>\n<blockquote>\n<p><strong>33. A</strong></p>\n</blockquote>\n<ul>\n<li>A：不应只把艺术家当传播助手或把作品当研究对象，直接反对缩小他们的合作角色，A概括作用被低估的担忧。</li>\n<li>B：角色被局限于辅助或被研究，与外界声誉下降不同；段落没有从合作分工推到艺术家名声受损。</li>\n<li>C：缺少共同设计可能限制创作发挥，C有这种间接联系；但原文直接纠正的是艺术家角色过窄，A比创造力受抑制更贴切。</li>\n<li>D：艺术作品不应只成为研究对象，讨论其在合作中被怎样使用，并未说艺术创作被科学引向错误道路。</li>\n</ul>\n<h2>34题</h2>\n<blockquote>\n<p>What does the author say about CAVS?</p>\n<p>关于高级视觉研究中心，作者说了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>机构细节与作用题：区分中心目的、名称来源、共同兴趣和身份互通。</p>\n<p>题干给出CAVS，可以直接找到第5段的Center for Advanced Visual Studies (CAVS)。把这一整段读完，查看中心的设立目的、围绕光的项目，以及后来对研究人员与艺术家关系的展望。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>to explore the role of technology in culture.</p>\n<p>both artists and scientists had an interest in, and therefore could form the basis of collaboration.</p>\n</blockquote>\n<h3>A. It was headed alternately by artists and scientists.</h3>\n<blockquote>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p><code>headed alternately</code>说的是中心领导人的轮换，第5段同时提到这两种身份的地方是<code>leading researchers could also be artists</code>，因此回看末句的主语和<code>could also be</code>连接的内容。</p>\n<p>原文说<code>leading researchers could also be artists</code>，即杰出的研究人员也能成为艺术家、作家和诗人，反过来也一样。选项的<code>headed alternately</code>则说艺术家和科学家轮流担任中心负责人。<code>leading</code>在这里修饰<code>researchers</code>，表示研究人员杰出，并不是中心领导职位；<code>could also be</code>表达身份可相兼，不是不同人在时间上轮换领导。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。</p>\n</blockquote>\n<p>CAVS先以共同兴趣开展项目，再展望研究者与艺术家身份互通，而非叙述历任负责人。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It was headed alternately by artists and scientists.</p>\n<p>作者说CAVS曾由艺术家与科学家轮流领导。</p>\n</blockquote>\n<p>A需要headed及alternately的任职轮换。leading修饰研究者水平，vice versa表示身份关系可反过来，不表示时间上的接班。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. It exemplified valuable art-science alliances.</h3>\n<blockquote>\n<p>作者说CAVS体现了有价值的艺术科学联盟。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>光是双方共同兴趣，成为合作基础；中心又期待研究和艺术身份相通，正体现前段要求的双向合作价值。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者说CAVS体现了有价值的艺术科学联盟。</p>\n</blockquote>\n<p><code>art-science alliances</code>对应第5段的<code>basis of collaboration</code>，因为原文明确说明光怎样把艺术家和科学家联系起来，因此回看第三句，并结合首句的设立目的。</p>\n<p>原文说中心探索技术在文化中的作用，并围绕双方都有兴趣的光开展项目；共同兴趣因此成为<code>basis of collaboration</code>。选项的<code>valuable art-science alliances</code>把这个中心概括为有价值的艺术与科学联盟实例。两边都不是单方借另一方完成任务，而是由双方共同关注的对象形成合作，这能说明中心为何可以作为这种联盟的实例。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。</p>\n</blockquote>\n<p>作者先定义真正伙伴关系，再以CAVS探索技术在文化中的作用，展示共同主题及跨身份发展。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It exemplified valuable art-science alliances.</p>\n<p>作者说CAVS体现了有价值的艺术科学联盟。</p>\n</blockquote>\n<p>B概括这一实例在文中的完整关系，不止名称含视觉，也不将艺术方降为单纯传播助手。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. Its projects aimed at advancing visual studies.</h3>\n<blockquote>\n<p>作者说CAVS项目旨在推进视觉研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时C尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>项目确实围绕光，推进视觉研究与其内容有关；但名称解释不等于已给出选项所称项目目的，B更完整概括共同兴趣与跨界联盟。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者说CAVS项目旨在推进视觉研究。</p>\n</blockquote>\n<p>项目确实围绕光，推进视觉研究与其内容有关；但名称解释不等于已给出选项所称项目目的，B更完整概括共同兴趣与跨界联盟。</p>\n<p>首句明确目的为探索技术在文化中的作用，光解释visual studies之名，后文再解释共同兴趣如何成为合作基础。</p>\n<p>C没有写唯一目的，不能以它排除了其他目的为由否定。区别在于原文重点不是视觉研究本身的推进，而是为何围绕光能使双方合作，B有更直接完整的依据。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。</p>\n</blockquote>\n<p>首句明确目的为探索技术在文化中的作用，光解释visual studies之名，后文再解释共同兴趣如何成为合作基础。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its projects aimed at advancing visual studies.</p>\n<p>作者说CAVS项目旨在推进视觉研究。</p>\n</blockquote>\n<p>C没有写唯一目的，不能以它排除了其他目的为由否定。区别在于原文重点不是视觉研究本身的推进，而是为何围绕光能使双方合作，B有更直接完整的依据。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Its founders sought to raise the status of artists.</h3>\n<blockquote>\n<p>作者说CAVS创办者试图提高艺术家地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>创办者选择光为项目中心，旨在探索技术与文化的联系，未提出提高艺术家社会地位的目标。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者说CAVS创办者试图提高艺术家地位。</p>\n</blockquote>\n<p><code>raise the status of artists</code>谈创办者要改变艺术家的地位，第5段<code>The founders</code>后实际写的是<code>focused their projects around light</code>，因此先核对第二句，再看末句有关艺术家和研究人员身份的展望。</p>\n<p>原文中创办者<code>focused their projects around light</code>，说明他们把项目放在什么主题上；末句展望研究人员也能成为艺术家，反之亦然。选项的<code>raise the status of artists</code>则把创办者的目标写成提升艺术家的地位。跨越研究与艺术身份是在拉通两类工作，并没有说其中一类地位较低、更没有说创办者要让这一类向上提升。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>半个多世纪前，麻省理工开设高级视觉研究中心CAVS，探索技术在文化中的作用。创办者有意让项目围绕光展开，因此名称中有视觉研究。光是艺术家和科学家都感兴趣的东西，所以能成为合作基础。科技不断进步并分成更多分支时，中心同时展望杰出研究者也能是艺术家、作家、诗人，反过来也一样。</p>\n</blockquote>\n<p>共同兴趣先连起两方，末句vice versa使艺术与研究身份相通，关系是互相进入而非一方地位向上提升。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its founders sought to raise the status of artists.</p>\n<p>作者说CAVS创办者试图提高艺术家地位。</p>\n</blockquote>\n<p>D需要艺术家原先地位较低及创办者要提升它的意图。前段反对低估角色，也不能自动移为CAVS创办者的特定目标。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>34题结论</h3>\n<blockquote>\n<p><strong>34. B</strong></p>\n</blockquote>\n<ul>\n<li>A：leading researchers是杰出研究者，could also be说同一人可兼有艺术身份；A却变成不同人轮流领导中心。</li>\n<li>B：光是双方共同兴趣，成为合作基础；中心又期待研究和艺术身份相通，正体现前段要求的双向合作价值。</li>\n<li>C：项目确实围绕光，推进视觉研究与其内容有关；但名称解释不等于已给出选项所称项目目的，B更完整概括共同兴趣与跨界联盟。</li>\n<li>D：创办者选择光为项目中心，旨在探索技术与文化的联系，未提出提高艺术家社会地位的目标。</li>\n</ul>\n<h2>35题</h2>\n<blockquote>\n<p>In the last paragraph, the author holds that art-science collaborations ______.</p>\n<p>在最后一段中，作者认为艺术与科学的合作应当怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落观点题：按needs to、must not找合作要求，保留as strong as ever的比较关系。</p>\n<p>题干明确给出In the last paragraph，直接把第6段完整读完。注意作者从调查趋势转到to make a collaboration work，随后用needs to和must not提出要求，最后说明双方共同具有的特点。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication</p>\n<p>and challenge and critique are core to both, too.</p>\n<p>Nature’s poll findings suggest that this trend is as strong as ever</p>\n</blockquote>\n<h3>A. are likely to go beyond public expectations</h3>\n<blockquote>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p><code>public expectations</code>是选项说要超出的对象，原文第二句<code>go beyond</code>后接的是<code>the necessary purpose of research communication</code>，因此回看这句，比较两边究竟要超出什么。</p>\n<p>原文说合作的范围<code>needs to go beyond the necessary purpose of research communication</code>，要求它超出研究传播这一必要目的。选项则说很可能超出<code>public expectations</code>，把应当拓展合作目标改成了将来成果会胜过公众预期。原句的<code>go beyond</code>所接的是合作目的，既不是公众的预测，也不是对未来是否超预期作概率判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<p>《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。</p>\n</blockquote>\n<p>作者从合作趋势转到要使合作有效的要求，needs to和must not都在规定怎样合作。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations are likely to go beyond public expectations.</p>\n<p>末段认为艺术与科学合作很可能超出公众预期。</p>\n</blockquote>\n<p>A需要公众期待及未来成果胜过期待的依据。合作目标更广，不等于公众预期较低或结果将使他们惊喜。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. will intensify interdisciplinary competition</h3>\n<blockquote>\n<p>末段认为艺术与科学合作将加剧学科间竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>challenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作将加剧学科间竞争。</p>\n</blockquote>\n<p><code>interdisciplinary competition</code>说两类学科彼此竞争，末句中可能让人想到这种关系的是<code>challenge and critique</code>，但原句要看的是它们与<code>both</code>怎样连接，因此回看最后一句。</p>\n<p>原文说<code>challenge and critique</code>对双方都居于核心位置，说明艺术与科学有这样的共同特点。选项把它改成合作<code>will intensify interdisciplinary competition</code>，即两类学科之间竞争会加强。挑战与批评作为两边都重视的活动，并不等于两类学科互相争胜；原文也没有从这种共同特点推出竞争程度将上升。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<p>《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。</p>\n</blockquote>\n<p>作者要求避免刻板印象，并以双方都重发现、发明和批评说明可以平等共同探索。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations will intensify interdisciplinary competition.</p>\n<p>末段认为艺术与科学合作将加剧学科间竞争。</p>\n</blockquote>\n<p>B需要学科间争胜及强度上升的关系。相互批评可以推动共同工作，不能将其自动写成竞争。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. should do more than communicating science</h3>\n<blockquote>\n<p>末段认为艺术与科学合作应超出单纯科学传播。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>needs to go beyond research communication直接要求合作超出科研传播，C保留这项范围扩展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作应超出单纯科学传播。</p>\n</blockquote>\n<p><code>do more than communicating science</code>与第二句的<code>go beyond the necessary purpose of research communication</code>说的是同一种超越，因此回看第二句对合作范围的要求。</p>\n<p>原文要求合作的范围<code>go beyond the necessary purpose of research communication</code>，即超出研究传播这一必要目的。选项的<code>do more than communicating science</code>同样要求合作不能止于科学传播。它没有否认传播的必要性，只是在已有传播作用之外要求更多，这与<code>needs to go beyond</code>的关系一致。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<p>《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。</p>\n</blockquote>\n<p>双方要投入时间、接受惊喜挑战并避免刻板印象，因为二者都能发现、创造和批评。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations should do more than communicating science.</p>\n<p>末段认为艺术与科学合作应超出单纯科学传播。</p>\n</blockquote>\n<p>do more than并不否定传播必要，原文也称其necessary；它要求在已有传播作用之外有真正共同的研究与创作。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. are becoming more popular than before</h3>\n<blockquote>\n<p>末段认为艺术与科学合作正比以前更受欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>as strong as ever说仍然强劲，more popular than before说比过去更受欢迎，二者比较方向不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段认为艺术与科学合作正比以前更受欢迎。</p>\n</blockquote>\n<p><code>more popular than before</code>比较现在和过去，第一句的<code>as strong as ever</code>也谈趋势的延续强度，因此回看该句的比较方式。</p>\n<p>原文说趋势<code>as strong as ever</code>，即一如既往地强劲，说明它仍然保持很强的势头。选项的<code>more popular than before</code>则明确断言受欢迎程度高于从前。持续强劲与比过去进一步增强不是同一种时间比较；原句用<code>as</code>…<code>as</code>表达延续的强度，选项改成<code>more</code>…<code>than</code>所表达的上升。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<p>《自然》的调查说明这种趋势一如既往强劲，但要让合作有效，双方需投入时间并接受惊喜与挑战。艺术科学合作的范围要超越科研传播这一必要目的，参与者也不能陷入对彼此的刻板印象。艺术家与科学家都投入发现和发明，挑战与批评对双方也同样核心。</p>\n</blockquote>\n<p>作者先肯定趋势延续，but随即转向如何做好合作，并未再列受欢迎程度上升的数据。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Art-science collaborations are becoming more popular than before.</p>\n<p>末段认为艺术与科学合作正比以前更受欢迎。</p>\n</blockquote>\n<p>D需要现在高于过去的比较。过去已经强劲、如今仍强劲不自动意味着更强，首段未来意愿也不是历年增长数据。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>35题结论</h3>\n<blockquote>\n<p><strong>35. C</strong></p>\n</blockquote>\n<ul>\n<li>A：go beyond后接研究传播这一目的，A却换成公众预期，还把应当扩展变成很可能超预期的预测。</li>\n<li>B：challenge和critique是双方共有的发现创造活动，不等于两类学科彼此竞争加剧。</li>\n<li>C：needs to go beyond research communication直接要求合作超出科研传播，C保留这项范围扩展。</li>\n<li>D：as strong as ever说仍然强劲，more popular than before说比过去更受欢迎，二者比较方向不同。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：艺术-科学合作的积极反响</strong>（段落1调查结果） 读者反馈：（启发性的 + 富有挑战性的 + 激励人心的 + 有趣的）→ 调查数据：【40%曾合作 + 几乎所有人愿意未来合作】</p>\n<p>↓（原因解释）</p>\n<p><strong>逻辑层次2：科学家寻求艺术家的原因</strong>（段落2需求分析） 趋势：科学家越来越多寻求视觉艺术家 → 目的：帮助传达工作给新受众 → 价值：（接触更广泛受众 + 建立情感联系 → 增强学习效果）</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次3：成功合作的实例</strong>（段落3案例展示） 悉尼交响乐团案例：改编维瓦尔第《四季》→ 方法：注入最新气候预测数据 → 意义：在联合国气候大会前的创造性行动号召</p>\n<p>//（转折：深层问题）</p>\n<p><strong>逻辑层次4：真正伙伴关系的要求</strong>（段落4合作本质） 问题：艺术家参与度低 + 担忧：【不应仅是协助传播 + 不应仅是研究对象】→ 理想模式：（共同利益 + 共同设计 + 相互批评）→ 效果：（激发新研究 + 产生有力艺术）</p>\n<p>↓（历史案例）</p>\n<p><strong>逻辑层次5：CAVS的启示</strong>（段落5历史经验） MIT的CAVS：以光为合作基础（双方都感兴趣）→ 愿景：顶尖研究人员也可以是艺术家/作家/诗人，反之亦然</p>\n<p>↓（当代建议）</p>\n<p><strong>逻辑层次6：成功合作的要素</strong>（段落6总结建议） 现状：趋势依然强劲 → 成功要素：【投入时间 + 接受惊喜和挑战】→ 超越传播目的 + 避免刻板印象 → 共同点：（都沉浸在发现和发明中 + 挑战和批判是核心）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：艺术-科学合作获得积极反响，但要实现真正有价值的伙伴关系，需要超越单纯的科学传播目的，建立平等的双向合作，让双方在共同的发现和创造过程中相互激发。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A historical model built on a shared interest</p>\n<p>B. Music as a route for communicating climate science</p>\n<p>C. The appeal of working across art and science</p>\n<p>D. A partnership in which neither side is merely an assistant</p>\n<p>E. A permanent end to criticism between disciplines</p>\n<p>F. Commitment and openness beyond communication alone</p>\n<p>G. Artists as objects to be studied and nothing more</p>\n<p><strong>41.</strong></p>\n<p>Enlightening, challenging, stimulating, fun. These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an accompanying poll said, they had collaborated with artists; and almost all said they would consider doing so in future. Such an encouraging results is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. &quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.</p>\n<p><strong>42.</strong></p>\n<p>One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons. They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n<p><strong>43.</strong></p>\n<p>But a genuine partnership must be a two-way street. Fewer artist than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#39;s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<p><strong>44.</strong></p>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders deliberately focused their projects around light-hance the &quot;visual studies&quot; in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p><strong>45.</strong></p>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other. Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. The appeal of working across art and science</p>\n<blockquote>\n<p>跨艺术与科学合作的吸引力</p>\n</blockquote>\n<p>读者积极评价合作经历并表达未来意愿，接着说明科学家借助艺术接触新受众和增强学习。</p>\n<blockquote>\n<p>Enlightening, challenging, stimulating, fun.</p>\n</blockquote>\n<p>开头四个评价词呈现合作的启发、挑战、激励和趣味，随后未来合作意愿进一步支持积极回应。</p>\n<blockquote>\n<p>Such an encouraging results is not surprising.</p>\n</blockquote>\n<p>Such an encouraging result回指调查反馈，下一步解释为何这种正面结果不令人意外。</p>\n<blockquote>\n<p>&quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning.&quot; One respondent said.</p>\n</blockquote>\n<p>艺术帮助接触更广受众并建立情感联系，说明合作吸引力的一项实际来源，标题要覆盖体验与传播收益。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>读者积极体验和合作意愿 → 科学家寻求艺术伙伴 → 更广受众与学习联系</p>\n</blockquote>\n<p>appeal对应积极评价与合作意愿，working across覆盖双方关系。</p>\n<p>再看最强干扰项E：A permanent end to criticism between disciplines。</p>\n<p>积极评价不表示没有挑战或批评，末段反而强调二者重要。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】B. Music as a route for communicating climate science</p>\n<blockquote>\n<p>以音乐传播气候科学</p>\n</blockquote>\n<p>音乐家将气候预测数据融入《四季》重编，使作品成为气候会议前的行动呼吁。</p>\n<blockquote>\n<p>One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#39;s The Four Seasons.</p>\n</blockquote>\n<p>One example标明该演出是前段传播作用的实例，而不是新开一项科研成果。</p>\n<blockquote>\n<p>They reimagined the 300-year-old score by injecting the latest climate prediction data for each season-provided by Monash University&#39;s Climate Change Communication Research Hub.</p>\n</blockquote>\n<p>最新气候预测数据被注入乐谱，说明科学信息如何通过熟悉艺术形式让听众接近。</p>\n<blockquote>\n<p>The performance was a creative call to action ahead of November&#39;s United Nations Climate Change Conference in Glasgow, UK.</p>\n</blockquote>\n<p>creative call to action说明传播落点是气候行动呼吁，标题需同时包含音乐形式与科学内容。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>已有气候数据 → 音乐改编呈现 → 向公众传达信息并呼吁行动</p>\n</blockquote>\n<p>music as a route指艺术提供接触科学的方式，不是音乐直接产生新的科学发现。</p>\n<p>再看最强干扰项G：Artists as objects to be studied and nothing more。</p>\n<p>这是共同制作传播作品，未把艺术家缩成研究对象。</p>\n<p><strong>42题选B。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】D. A partnership in which neither side is merely an assistant</p>\n<blockquote>\n<p>双方都不只是助手的伙伴关系</p>\n</blockquote>\n<p>But转向双向伙伴要求，反对只把艺术家当传播助手或作品当研究物，要求共同设计与互评。</p>\n<blockquote>\n<p>But a genuine partnership must be a two-way street.</p>\n</blockquote>\n<p>But将讨论从艺术协助传播推进到伙伴关系必须双向，反对一方仅为另一方服务。</p>\n<blockquote>\n<p>Nor should their work be considered only as an object of study.</p>\n</blockquote>\n<p>Nor...only继续限制片面定位：艺术作品也不应只当研究对象，双方应共同设计并互评。</p>\n<blockquote>\n<p>Such an approach can both prompt new research as well as result in powerful art.</p>\n</blockquote>\n<p>both...as well as并列科研和艺术两端成果，证明真正合作应让双方都有创造空间。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>反对单向辅助角色 → 共享利益、共同设计互评 → 科研与艺术双重成果</p>\n</blockquote>\n<p>neither ... merely an assistant概括角色平等与共同参与；不是拒绝传播本身。</p>\n<p>再看最强干扰项G：Artists as objects to be studied and nothing more。</p>\n<p>原文明确Nor ... only as an object of study，干扰项与之相反。</p>\n<p><strong>43题选D。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】A. A historical model built on a shared interest</p>\n<blockquote>\n<p>建立在共同兴趣上的历史合作模式</p>\n</blockquote>\n<p>CAVS以双方都感兴趣的光为基础，并期待研究者和艺术家身份相通。</p>\n<blockquote>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture.</p>\n</blockquote>\n<p>CAVS设立目的为探索技术在文化中的作用，提供前段双向合作的历史实例。</p>\n<blockquote>\n<p>Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration.</p>\n</blockquote>\n<p>双方共同兴趣在光，therefore明确将这一共同主题接成合作基础。</p>\n<blockquote>\n<p>As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<p>研究与艺术身份互通的展望继续扩展双向关系，标题应概括共同兴趣上的跨界模式，而非只取中心名称。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>技术与文化的探索 → 光作为共同兴趣 → 跨越研究与艺术身份</p>\n</blockquote>\n<p>historical model对应半世纪前的中心，共同兴趣是合作基础。</p>\n<p>再看最强干扰项B：Music as a route for communicating climate science。</p>\n<p>本段不是继续音乐例子，而是在介绍技术与文化合作的制度实践。</p>\n<p><strong>44题选A。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】F. Commitment and openness beyond communication alone</p>\n<blockquote>\n<p>超越单纯传播的投入与开放</p>\n</blockquote>\n<p>双方要投入时间、接受惊喜和挑战，超越传播目的，避免刻板印象，并承认发现、创造和批评是共有活动。</p>\n<blockquote>\n<p>Nature&#39;s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge.</p>\n</blockquote>\n<p>调查趋势仍强，but转向怎样合作才有效，投入时间与接受挑战是条件。</p>\n<blockquote>\n<p>The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other.</p>\n</blockquote>\n<p>超越传播、避免刻板印象进一步要求平等开放，而不是只把对方当单一用途的工具。</p>\n<blockquote>\n<p>Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.</p>\n</blockquote>\n<p>alike和both总结双方共同的发现、发明、挑战、批评，给开放伙伴关系提供理由。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>合作热度延续 → 投入时间并超越传播 → 以共同创造活动建立开放关系</p>\n</blockquote>\n<p>commitment对应invest time，openness对应embrace与反对stereotyping。</p>\n<p>再看最强干扰项E：A permanent end to criticism between disciplines。</p>\n<p>挑战和批评被称为双方的核心，不能写成彻底终结批评。</p>\n<p><strong>45题选F。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Partnerships between artists and researchers attract many people who describe them as stimulating and challenging. A survey of readers found substantial experience of such projects and widespread interest in future participation. Their enthusiasm invites a closer look at what makes collaboration valuable.</p>\n<p><strong>B.</strong></p>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises. Participants must resist fixed ideas about what the other group does. Researchers and artists share commitments to discovery and invention, even when their methods and forms of expression differ.</p>\n<p><strong>C.</strong></p>\n<p>One recognised value is communication. Artists can help scientific work reach audiences that might otherwise overlook it, and emotional connections can strengthen learning. This contribution explains why researchers increasingly seek visual and performing artists as partners.</p>\n<p><strong>D.</strong></p>\n<p>A historical example of this relationship is the centre established at MIT to explore technology’s role in culture. Its projects focused on light because both artists and scientists found it interesting. A common subject provided a basis for crossing boundaries without making one side subordinate.</p>\n<p><strong>E.</strong></p>\n<p>Valuable as communication is, a genuine partnership cannot reduce artists to assistants serving scientific needs. Their work should not be treated only as an object of study either. Both sides need a stake in the project and a voice in its design.</p>\n<p><strong>F.</strong></p>\n<p>A musical performance incorporating climate predictions illustrates that contribution. Data for the seasons were used to reshape a familiar score, giving listeners a different way to encounter scientific information. The performance connected communication with a call for public action.</p>\n<p><strong>G.</strong></p>\n<p>Shared design also allows participants to question and critique one another’s work. Such exchanges can generate new research as well as powerful art. The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.</p>\n<p><strong>H.</strong></p>\n<p>Recognising these shared commitments can extend collaboration beyond the transmission of finished research. Communication remains useful, but it is one purpose among several. A productive alliance gives both sides opportunities to discover, create and revise their understanding.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从积极调查回应提出合作价值问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>提出跨界合作所需投入和开放</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明艺术帮助科学接触更多受众</td>\n</tr>\n<tr>\n<td>D</td>\n<td>用CAVS及共同光主题说明合作基础</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转折提出真正合作需要双向参与</td>\n</tr>\n<tr>\n<td>F</td>\n<td>用气候数据音乐改编展示传播作用</td>\n</tr>\n<tr>\n<td>G</td>\n<td>展开共同设计互评的双重收益</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结超越单向传播的伙伴价值</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从积极调查回应提出合作价值问题 → 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用 → 转折提出真正合作需要双向参与 → 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放 → 总结超越单向传播的伙伴价值</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → C → F → E → G → D → B → H</strong></p>\n<p>41—45：C、F、G、D、B。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → C → F。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their enthusiasm invites a closer look at what makes collaboration valuable.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>One recognised value is communication.</p>\n</blockquote>\n<p>前段的what makes collaboration valuable提出价值问题，One recognised value直接以传播给出第一项回答。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Artists can help scientific work reach audiences that might otherwise overlook it, and emotional connections can strengthen learning. This contribution explains why researchers increasingly seek visual and performing artists as partners.</p>\n</blockquote>\n<p>艺术接触原本可能忽视科学的受众，情感联系又增强学习；This contribution概括两项作用并解释科学家寻求合作。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>A musical performance incorporating climate predictions illustrates that contribution.</p>\n</blockquote>\n<p>that contribution回指当前传播与学习作用，音乐演出在后段作具体例子。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从积极调查回应提出合作价值问题 → 说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Shared design also allows participants to question and critique one another’s work.</p>\n</blockquote>\n<p>Shared design属于双方共同设计的阶段，而此处先介绍传播价值，否则后段that contribution没有传播内容可回指。</p>\n<p><strong>41题选C。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为C → F → E。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>This contribution explains why researchers increasingly seek visual and performing artists as partners.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>A musical performance incorporating climate predictions illustrates that contribution.</p>\n</blockquote>\n<p>前段以艺术的传播贡献解释合作需求，that contribution精准承接，音乐演出成为该作用的实例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Data for the seasons were used to reshape a familiar score, giving listeners a different way to encounter scientific information. The performance connected communication with a call for public action.</p>\n</blockquote>\n<p>季节数据改编熟悉乐谱，给受众另一种接触科学信息的方式，结尾再接公共行动呼吁。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Valuable as communication is, a genuine partnership cannot reduce artists to assistants serving scientific needs.</p>\n</blockquote>\n<p>Valuable as communication is让步肯定前例价值，却转出不能把艺术家限为助手，形成从传播到双向合作的推进。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明艺术帮助科学接触更多受众 → 用气候数据音乐改编展示传播作用 → 转折提出真正合作需要双向参与</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Shared design also allows participants to question and critique one another’s work.</p>\n</blockquote>\n<p>共同设计和互评需要先提出双向关系，此处应完成传播实例，后面的让步才有具体对象。</p>\n<p><strong>42题选F。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Both sides need a stake in the project and a voice in its design.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Shared design also allows participants to question and critique one another’s work.</p>\n</blockquote>\n<p>前段要求双方在项目中有利益和设计发言权，Shared design接voice in its design并追加互评作用。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Such exchanges can generate new research as well as powerful art. The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.</p>\n</blockquote>\n<p>Such exchanges回指质疑与批评，科学新研究和艺术成果并列，解释挑战能促进双方发展。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>A historical example of this relationship is the centre established at MIT to explore technology’s role in culture.</p>\n</blockquote>\n<p>this relationship回指彼此挑战共同发展的关系，CAVS在下一段将它实例化。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转折提出真正合作需要双向参与 → 展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises.</p>\n</blockquote>\n<p>Crossing those boundaries需要先有具体跨界基础，此处先说共享设计的双重收益，才能让后段历史实例明确在证明什么。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → D → B。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The aim is not to protect each discipline from challenge, but to create a relationship in which challenge helps both develop.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>A historical example of this relationship is the centre established at MIT to explore technology’s role in culture.</p>\n</blockquote>\n<p>前段明确双方借挑战发展的relationship，A historical example of this relationship把CAVS接成实例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Its projects focused on light because both artists and scientists found it interesting. A common subject provided a basis for crossing boundaries without making one side subordinate.</p>\n</blockquote>\n<p>光是两方都感兴趣的对象，共同主题于是提供平等跨界基础，不将一方降为从属。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises.</p>\n</blockquote>\n<p>those boundaries直接承接crossing boundaries，下一段再说明跨界需付出的投入。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>展开共同设计互评的双重收益 → 用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>One recognised value is communication.</p>\n</blockquote>\n<p>单说传播价值会退回讨论开端，不能具体说明当前这种双向关系，也使those boundaries缺少刚建立的跨界所指。</p>\n<p><strong>44题选D。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为D → B → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>A common subject provided a basis for crossing boundaries without making one side subordinate.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Crossing those boundaries requires an investment of time and a willingness to encounter surprises.</p>\n</blockquote>\n<p>前段共同主题使双方能跨越边界，Crossing those boundaries复现该动作并转向需要时间和开放态度。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Participants must resist fixed ideas about what the other group does. Researchers and artists share commitments to discovery and invention, even when their methods and forms of expression differ.</p>\n</blockquote>\n<p>resist fixed ideas要求克服刻板印象，随后发现与发明的共同追求说明彼此并非截然不同的单一角色。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Recognising these shared commitments can extend collaboration beyond the transmission of finished research.</p>\n</blockquote>\n<p>these shared commitments指共同发现创造，结尾据此要求合作超越传递现成研究成果。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用CAVS及共同光主题说明合作基础 → 提出跨界合作所需投入和开放 → 总结超越单向传播的伙伴价值</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>One recognised value is communication.</p>\n</blockquote>\n<p>传播价值在前面已肯定，这里要总结更广伙伴关系；放回One recognised value会中断跨界条件，也不能提供shared commitments的先行内容。</p>\n<p><strong>45题选B。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>interdisciplinary cooperation</strong></td>\n<td><strong>跨学科合作</strong></td>\n<td><strong>社会现象｜文化教育｜跨学科学习</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>shared interests</td>\n<td>共同兴趣</td>\n<td>人生哲理｜合作</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>creative discovery</td>\n<td>创造性发现</td>\n<td>人生哲理｜创新</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td><strong>mutual understanding</strong></td>\n<td><strong>相互理解</strong></td>\n<td><strong>人生哲理｜理解与包容</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>open-mindedness</td>\n<td>开放心态</td>\n<td>人生哲理｜理解与包容</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>constructive criticism</td>\n<td>建设性批评</td>\n<td>人生哲理｜批判性思维</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>science communication</td>\n<td>科学传播</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>equal participation</td>\n<td>平等参与</td>\n<td>人生哲理｜合作</td>\n<td>个人主题</td>\n</tr>\n</tbody></table></div>\n<h2>2. 大作文第一段描述题目信息时可积累的表达</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The two groups are jointly designing a project around a shared interest.</strong></td>\n<td><strong>两个群体围绕共同兴趣共同设计项目。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture shows a partnership in which both sides contribute ideas.</td>\n<td>图画展示了双方都贡献想法的伙伴关系。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene suggests that collaboration should be a two-way street.</td>\n<td>场景表明合作应当是双向的。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>Nearly forty percent of respondents had taken part in similar projects.</strong></td>\n<td><strong>近四成受访者参加过类似项目。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Almost all respondents would consider collaborating in future.</td>\n<td>几乎所有受访者都愿考虑未来合作。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The findings suggest that interest in cooperation remains strong.</td>\n<td>调查结果表明合作兴趣依然强劲。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement calls on both sides to embrace surprise and challenge.</td>\n<td>这句话呼吁双方接受惊喜与挑战。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage stresses that a productive alliance should go beyond one limited purpose.</td>\n<td>这段文字强调有效合作应超越单一的有限目的。</td>\n</tr>\n</tbody></table></div>\n";
