d>arrangement</td>\n<td>n.安排</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>excessive</td>\n<td>adj.过度的</td>\n<td>protections</td>\n<td>n.保护</td>\n<td>stringent</td>\n<td>adj.严格的</td>\n</tr>\n<tr>\n<td>regulations</td>\n<td>n.规章</td>\n<td>adversely</td>\n<td>adv.不利地</td>\n<td>hamper</td>\n<td>v.妨碍</td>\n</tr>\n<tr>\n<td>prosperity</td>\n<td>n.繁荣</td>\n<td>well-being</td>\n<td>n.福祉</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第8段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>excluding</td>\n<td>v.排除</td>\n<td>specified</td>\n<td>adj.指定的</td>\n<td>threshold</td>\n<td>n.门槛</td>\n</tr>\n<tr>\n<td>permit</td>\n<td>v.允许</td>\n<td>contract out of</td>\n<td>以合同约定退出</td>\n<td>regime</td>\n<td>n.制度</td>\n</tr>\n<tr>\n<td>unwieldy</td>\n<td>adj.难操作的</td>\n<td>voted down</td>\n<td>投票否决</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.</p>\n<h3>意群划分 · 第1段</h3>\n<p>The personal grievance provisions / of New Zealand&#39;s Employment Relations Act 2000 (ERA) / prevent an employer / from firing an employee / without good cause.</p>\n<p>Instead, / dismissals must be justified.</p>\n<p>Employers must both / show cause / and act / in a procedurally fair way.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>个人申诉条款 / 新西兰2000年雇佣关系法的 / 阻止雇主 / 解雇员工 / 没有正当理由的情况下。</p>\n<p>相反，/ 解雇必须是合理的。</p>\n<p>雇主必须既 / 说明理由 / 又要行动 / 以程序公正的方式。</p>\n<h3>标准译文 · 第1段</h3>\n<p>新西兰2000年《雇佣关系法》中的个人申诉条款阻止雇主在没有正当理由的情况下解雇员工。相反，解雇必须是合理的。雇主必须既说明理由，又要以程序公正的方式行事。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Personal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Personal grievance procedures / were designed / to guard the jobs / of ordinary workers / from &quot;unjustified dismissals&quot;.</p>\n<p>The premise was / that the common law of contract / lacked sufficient safeguards / for workers / against arbitrary conduct / by management.</p>\n<p>Long gone are the days / when a boss / could simply give / an employee / contractual notice.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>个人申诉程序 / 被设计 / 来保护工作 / 普通工人的 / 免于&quot;不正当解雇&quot;。</p>\n<p>前提是 / 合同的普通法 / 缺乏足够的保障 / 对工人 / 对抗任意行为 / 来自管理层的。</p>\n<p>早已过去的是那些日子 / 当老板 / 可以简单地给予 / 员工 / 合同通知。</p>\n<h3>标准译文 · 第2段</h3>\n<p>个人申诉程序的设计初衷是保护普通工人的工作免受&quot;不正当解雇&quot;。其前提是合同普通法缺乏足够的保障来保护工人免受管理层的任意行为。老板可以简单地给员工发合同通知的日子早已一去不复返。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.</p>\n<h3>意群划分 · 第3段</h3>\n<p>But these provisions / create difficulties / for businesses / when applied to / highly paid managers and executives.</p>\n<p>As countless boards and business owners / will attest, / constraining firms / from firing poorly performing, high-earning managers / is a handbrake / on boosting productivity / and overall performance.</p>\n<p>The difference / between C-grade and A-grade managers / may very well be / the difference / between business success or failure.</p>\n<p>Between preserving the jobs / of ordinary workers / or losing them.</p>\n<p>Yet mediocrity / is no longer enough / to justify a dismissal.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>但这些条款 / 造成困难 / 对企业 / 当应用于 / 高薪经理和高管时。</p>\n<p>正如无数董事会和企业主 / 会证明的，/ 限制公司 / 解雇表现不佳的高薪经理 / 是一个手刹 / 对提升生产力 / 和整体表现。</p>\n<p>差别 / 在C级和A级经理之间 / 很可能就是 / 差别 / 在企业成功或失败之间。</p>\n<p>在保护工作之间 / 普通工人的 / 或失去它们。</p>\n<p>然而平庸 / 不再足够 / 来证明解雇的合理性。</p>\n<h3>标准译文 · 第3段</h3>\n<p>但这些条款在应用于高薪经理和高管时给企业造成了困难。正如无数董事会和企业主所证明的，限制公司解雇表现不佳的高薪经理就像给提升生产力和整体表现踩了手刹。C级和A级经理之间的差别很可能就是企业成功或失败的差别，是保护还是失去普通工人工作的差别。然而，平庸已不再足以成为解雇的理由。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Consequently – and paradoxically – / laws introduced / to protect the jobs / of ordinary workers / may be placing / those jobs / at risk.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>因此——且矛盾的是—— / 法律被引入 / 来保护工作 / 普通工人的 / 可能正在使 / 这些工作 / 处于风险中。</p>\n<h3>标准译文 · 第4段</h3>\n<p>因此——且矛盾的是——为保护普通工人工作而引入的法律可能正在使这些工作处于风险之中。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<h3>意群划分 · 第5段</h3>\n<p>If not placing jobs at risk, / to the extent / employment protection laws / constrain business owners / from dismissing under-performing managers, / those laws act as a constraint / on firm productivity / and therefore / on workers&#39; wages.</p>\n<p>Indeed, / in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), / the Productivity Commission / singled out / the low quality of managerial capabilities / as a cause / of the country&#39;s poor productivity growth record.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>如果不是使工作处于风险中，/ 在某种程度上 / 就业保护法 / 限制企业主 / 解雇表现不佳的经理，/ 这些法律充当限制 / 对公司生产力 / 因此 / 对工人工资。</p>\n<p>确实，/ 在《新西兰生产力悖论的国际视角》（2014年）中，/ 生产力委员会 / 特别指出 / 管理能力的低质量 / 作为原因 / 该国糟糕的生产力增长记录的。</p>\n<h3>标准译文 · 第5段</h3>\n<p>如果不是使工作处于风险中，那么就业保护法在限制企业主解雇表现不佳的经理方面，充当了对公司生产力的限制，进而限制了工人的工资。确实，在2014年的《新西兰生产力悖论的国际视角》中，生产力委员会特别指出，管理能力的低质量是该国生产力增长记录糟糕的一个原因。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Nor are highly paid managers themselves / immune from the harm / caused by the ERA&#39;s unjustified dismissal procedures.</p>\n<p>Because employment protection laws / make it costlier / to fire an employee, / employers are more cautious / about hiring new staff.</p>\n<p>This makes it harder / for the marginal manager / to gain employment.</p>\n<p>And firms pay staff less / because firms carry the burden / of the employment arrangement / going wrong.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>高薪经理们自己也不 / 免受伤害 / 由ERA不正当解雇程序造成的。</p>\n<p>因为就业保护法 / 使其成本更高 / 解雇员工，/ 雇主更加谨慎 / 关于雇用新员工。</p>\n<p>这使得更困难 / 对边缘经理 / 获得就业。</p>\n<p>而且公司支付员工更少 / 因为公司承担负担 / 就业安排的 / 出错的。</p>\n<h3>标准译文 · 第6段</h3>\n<p>高薪经理们自己也不能免受ERA不正当解雇程序造成的伤害。因为就业保护法使解雇员工的成本更高，雇主在雇用新员工时更加谨慎。这使得边缘经理更难获得就业。而且公司支付给员工的薪酬更少，因为公司要承担就业安排出错的负担。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>Society also suffers from excessive employment protections. Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p>\n<h3>意群划分 · 第7段</h3>\n<p>Society also suffers / from excessive employment protections.</p>\n<p>Stringent job dismissal regulations / adversely affect / productivity growth / and hamper / both prosperity and overall well-being.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>社会也遭受 / 来自过度的就业保护。</p>\n<p>严格的工作解雇法规 / 不利地影响 / 生产力增长 / 并阻碍 / 繁荣和整体福祉。</p>\n<h3>标准译文 · 第7段</h3>\n<p>社会也因过度的就业保护而遭受损失。严格的工作解雇法规不利地影响生产力增长，并阻碍繁荣和整体福祉。</p>\n<h2>第8段</h2>\n<h3>完整原文 · 第8段</h3>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n<h3>意群划分 · 第8段</h3>\n<p>Across the Tasman Sea, / Australia deals with / the unjustified dismissal paradox / by excluding employees / earning above a specified &quot;high-income threshold&quot; / from the protection / of its unfair dismissal laws.</p>\n<p>In New Zealand, / a 2016 private members&#39; Bill / tried to permit / firms and high-income employees / to contract out of / the unjustified dismissal regime.</p>\n<p>However, / the mechanisms proposed / were unwieldy / and the Bill was voted down / following the change in government / later that year.</p>\n<h3>意群翻译 · 第8段</h3>\n<p>在塔斯曼海对岸，/ 澳大利亚处理 / 不正当解雇悖论 / 通过排除员工 / 收入超过特定&quot;高收入门槛&quot;的 / 从保护中 / 其不公平解雇法的。</p>\n<p>在新西兰，/ 2016年一项私人议员法案 / 试图允许 / 公司和高收入员工 / 退出 / 不正当解雇制度。</p>\n<p>然而，/ 提议的机制 / 过于笨重 / 且该法案被否决 / 在政府更迭后 / 那年晚些时候。</p>\n<h3>标准译文 · 第8段</h3>\n<p>在塔斯曼海对岸，澳大利亚通过将收入超过特定&quot;高收入门槛&quot;的员工排除在不公平解雇法的保护之外来处理不正当解雇悖论。在新西兰，2016年一项私人议员法案试图允许公司和高收入员工退出不正当解雇制度。然而，提议的机制过于笨重，该法案在那年晚些时候的政府更迭后被否决。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>The personal grievance provisions：(of New Zealand&#39;s Employment Relations Act 2000 (ERA)) → prevent an employer：(from firing an employee：(without good cause)).</p>\n<p>Instead → dismissals must be justified.</p>\n<p>Employers must both → show cause + act：(in a procedurally fair way).</p>\n<p><strong>第2段</strong></p>\n<p>Personal grievance procedures → were designed → to guard the jobs：(of ordinary workers)：(from &quot;unjustified dismissals&quot;).</p>\n<p>The premise was：(that the common law of contract → lacked sufficient safeguards：(for workers)：(against arbitrary conduct：(by management))).</p>\n<p>Long gone are the days：(when a boss → could simply give → an employee → contractual notice).</p>\n<p><strong>第3段</strong></p>\n<p>But these provisions → create difficulties：(for businesses)：(when applied to：(highly paid managers and executives)).</p>\n<p>As countless boards and business owners → will attest → constraining firms：(from firing poorly performing, high-earning managers) → is a handbrake：(on boosting productivity + overall performance).</p>\n<p>The difference：(between C-grade and A-grade managers) → may very well be → the difference：(between business success or failure).</p>\n<p>Between preserving the jobs：(of ordinary workers) // or losing them.</p>\n<p>Yet mediocrity → is no longer enough → to justify a dismissal.</p>\n<p><strong>第4段</strong></p>\n<p>Consequently – and paradoxically – → laws：(introduced → to protect the jobs：(of ordinary workers)) → may be placing → those jobs → at risk.</p>\n<p><strong>第5段</strong></p>\n<p>If not placing jobs at risk → to the extent：(employment protection laws → constrain business owners：(from dismissing under-performing managers)) → those laws act as a constraint：(on firm productivity) + therefore：(on workers&#39; wages).</p>\n<p>Indeed → in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014) → the Productivity Commission → singled out → the low quality of managerial capabilities：(as a cause：(of the country&#39;s poor productivity growth record)).</p>\n<p><strong>第6段</strong></p>\n<p>Nor are highly paid managers themselves → immune from the harm：(caused by the ERA&#39;s unjustified dismissal procedures).</p>\n<p>Because employment protection laws → make it costlier：(to fire an employee) → employers are more cautious：(about hiring new staff).</p>\n<p>This makes it harder：(for the marginal manager)：(to gain employment).</p>\n<p>And firms pay staff less → because firms carry the burden：(of the employment arrangement：(going wrong)).</p>\n<p><strong>第7段</strong></p>\n<p>Society also suffers：(from excessive employment protections).</p>\n<p>Stringent job dismissal regulations → adversely affect → productivity growth + hamper → both prosperity and overall well-being.</p>\n<p><strong>第8段</strong></p>\n<p>Across the Tasman Sea → Australia deals with → the unjustified dismissal paradox：(by excluding employees：(earning above a specified &quot;high-income threshold&quot;)：(from the protection：(of its unfair dismissal laws))).</p>\n<p>In New Zealand → a 2016 private members&#39; Bill → tried to permit → firms and high-income employees → to contract out of → the unjustified dismissal regime.</p>\n<p>However → the mechanisms proposed → were unwieldy + the Bill was voted down：(following the change in government：(later that year)).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>个人申诉条款：(新西兰2000年雇佣关系法的) → 阻止雇主：(解雇员工：(没有正当理由的情况下))。</p>\n<p>相反 → 解雇必须是合理的。</p>\n<p>雇主必须既 → 说明理由 + 行动：(以程序公正的方式)。</p>\n<p><strong>第2段</strong></p>\n<p>个人申诉程序 → 被设计 → 来保护工作：(普通工人的)：(免于&quot;不正当解雇&quot;)。</p>\n<p>前提是：(合同的普通法 → 缺乏足够的保障：(对工人)：(对抗任意行为：(来自管理层的)))。</p>\n<p>早已过去的是那些日子：(当老板 → 可以简单地给予 → 员工 → 合同通知)。</p>\n<p><strong>第3段</strong></p>\n<p>但这些条款 → 造成困难：(对企业)：(当应用于：(高薪经理和高管时))。</p>\n<p>正如无数董事会和企业主 → 会证明的 → 限制公司：(解雇表现不佳的高薪经理) → 是一个手刹：(对提升生产力 + 整体表现)。</p>\n<p>差别：(在C级和A级经理之间) → 很可能就是 → 差别：(在企业成功或失败之间)。</p>\n<p>在保护工作：(普通工人的) // 或失去它们之间。</p>\n<p>然而平庸 → 不再足够 → 来证明解雇的合理性。</p>\n<p><strong>第4段</strong></p>\n<p>因此——且矛盾的是—— → 法律：(被引入 → 来保护工作：(普通工人的)) → 可能正在使 → 这些工作 → 处于风险中。</p>\n<p><strong>第5段</strong></p>\n<p>如果不是使工作处于风险中 → 在某种程度上：(就业保护法 → 限制企业主：(解雇表现不佳的经理)) → 这些法律充当限制：(对公司生产力) + 因此：(对工人工资)。</p>\n<p>确实 → 在《新西兰生产力悖论的国际视角》（2014年）中 → 生产力委员会 → 特别指出 → 管理能力的低质量：(作为原因：(该国糟糕的生产力增长记录的))。</p>\n<p><strong>第6段</strong></p>\n<p>高薪经理们自己也不 → 免受伤害：(由ERA不正当解雇程序造成的)。</p>\n<p>因为就业保护法 → 使其成本更高：(解雇员工) → 雇主更加谨慎：(关于雇用新员工)。</p>\n<p>这使得更困难：(对边缘经理)：(获得就业)。</p>\n<p>而且公司支付员工更少 → 因为公司承担负担：(就业安排的：(出错的))。</p>\n<p><strong>第7段</strong></p>\n<p>社会也遭受：(来自过度的就业保护)。</p>\n<p>严格的工作解雇法规 → 不利地影响 → 生产力增长 + 阻碍 → 繁荣和整体福祉。</p>\n<p><strong>第8段</strong></p>\n<p>在塔斯曼海对岸 → 澳大利亚处理 → 不正当解雇悖论：(通过排除员工：(收入超过特定&quot;高收入门槛&quot;的)：(从保护中：(其不公平解雇法的)))。</p>\n<p>在新西兰 → 2016年一项私人议员法案 → 试图允许 → 公司和高收入员工 → 退出 → 不正当解雇制度。</p>\n<p>然而 → 提议的机制 → 过于笨重 + 该法案被否决：(在政府更迭后：(那年晚些时候))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第3段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>As countless boards and business owners / will attest, / constraining firms / from firing poorly performing, high-earning managers / is a handbrake / on boosting productivity / and overall performance.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>正如无数董事会和企业主 / 会证明的，/ 限制公司 / 解雇表现不佳的高薪经理 / 是一个手刹 / 对提升生产力 / 和整体表现。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>As引出企业主可以证明的背景，constraining ... from ...整体作为主语。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>正如无数董事会和企业主  会证明的， 限制公司  解雇表现不佳的高薪经理  是一个手刹  对提升生产力  和整体表现。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>难以解雇表现不佳的高薪经理会阻碍生产率与经营表现。</p>\n</blockquote>\n<p>先交代观察来源，再说限制什么行为，最后说明它像手刹一样造成阻力。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>正如无数董事会和企业主所证明的，限制公司解雇表现不佳的高薪经理就像给提升生产力和整体表现踩了手刹。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>被限制的是企业解雇经理，不是经理的管理权威。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>正如无数董事会和企业主所证明的，限制公司解雇表现不佳的高薪经理就像给提升生产力和整体表现踩了手刹。</p>\n</blockquote>\n<h2>2. 第5段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>If not placing jobs at risk, / to the extent / employment protection laws / constrain business owners / from dismissing under-performing managers, / those laws act as a constraint / on firm productivity / and therefore / on workers&#39; wages.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>如果不是使工作处于风险中，/ 在某种程度上 / 就业保护法 / 限制企业主 / 解雇表现不佳的经理，/ 这些法律充当限制 / 对公司生产力 / 因此 / 对工人工资。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>If not先让步即使未危及岗位，to the extent说明法律发生约束作用的范围。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>如果不是使工作处于风险中， 在某种程度上  就业保护法  限制企业主  解雇表现不佳的经理， 这些法律充当限制  对公司生产力  因此  对工人工资。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>限制解雇低绩效经理会约束生产率和工人工资。</p>\n</blockquote>\n<p>先说即使岗位未失去，再按解雇约束、生产率、工资三层推进。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>如果不是使工作处于风险中，那么就业保护法在限制企业主解雇表现不佳的经理方面，充当了对公司生产力的限制，进而限制了工人的工资。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>therefore把工资连接为生产率受限的后果，不能反写成委员会主张限制工资。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>如果不是使工作处于风险中，那么就业保护法在限制企业主解雇表现不佳的经理方面，充当了对公司生产力的限制，进而限制了工人的工资。</p>\n</blockquote>\n<h2>3. 第8段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Across the Tasman Sea, / Australia deals with / the unjustified dismissal paradox / by excluding employees / earning above a specified &quot;high-income threshold&quot; / from the protection / of its unfair dismissal laws.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在塔斯曼海对岸，/ 澳大利亚处理 / 不正当解雇悖论 / 通过排除员工 / 收入超过特定&quot;高收入门槛&quot;的 / 从保护中 / 其不公平解雇法的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>by excluding说明应对悖论的方式，earning above修饰被排除的员工。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>在塔斯曼海对岸， 澳大利亚处理  不正当解雇悖论  通过排除员工  收入超过特定&quot;高收入门槛&quot;的  从保护中  其不公平解雇法的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>澳大利亚把超过规定高收入门槛的员工排除在特定保护之外。</p>\n</blockquote>\n<p>先说澳大利亚的处理办法，再明确收入门槛及被排除的法律保护。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>在塔斯曼海对岸，澳大利亚通过将收入超过特定&quot;高收入门槛&quot;的员工排除在不公平解雇法的保护之外来处理不正当解雇悖论。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>门槛用于划分适用人群，不是在保证这一群体的收入。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>在塔斯曼海对岸，澳大利亚通过将收入超过特定&quot;高收入门槛&quot;的员工排除在不公平解雇法的保护之外来处理不正当解雇悖论。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>The personal grievance provisions of the ERA are intended to ______.</p>\n<p>ERA中的个人申诉条款旨在做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>目的细节题：将designed to与guard the jobs相接，区别原始保护目的与后文副作用。</p>\n<p>题干直接点出personal grievance provisions of the ERA。第1段以这组条款开篇，第2段的Personal grievance procedures接着交代设计目的，因此把这两段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>prevent an employer from firing an employee without good cause</p>\n<p>to guard the jobs of ordinary workers from “unjustified dismissals”</p>\n<p>dismissals must be justified</p>\n</blockquote>\n<h3>A. punish dubious corporate practices</h3>\n<blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><code>punish dubious corporate practices</code>把重点放在处罚企业，因而回看第1段的<code>prevent an employer from firing an employee</code>和第2段的<code>guard the jobs</code>，核对条款具体要制止什么、保护什么。</p>\n<p>原文的<code>prevent an employer from firing an employee</code>把限制对象说得很具体：不让雇主无正当理由地解雇员工；<code>guard the jobs</code>进一步说明目的是保住普通工人的工作岗位。<code>punish dubious corporate practices</code>则把保护员工免遭某种解雇，改成处罚企业的可疑行为；既把动作换成了惩罚，也把对象扩大到企业行为。条款约束雇主，并不等于这里已经写出了处罚企业这一目的。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>第一段列解雇必须有理由和程序公平，第二段明确设计初衷是保护员工免遭管理层任意行为。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to punish dubious corporate practices.</p>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p>A需要处罚企业的目的及相关处罚安排。约束解雇可以保护权利，但不能因此概括为处罚任何dubious corporate practices。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. improve traditional hiring procedures</h3>\n<blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><code>hiring procedures</code>说的是招人程序，回到第2段的<code>Personal grievance procedures were designed</code>和第1段的<code>dismissals must be justified</code>，看看这里所规定的程序针对入职还是离职。</p>\n<p>原文的<code>dismissals must be justified</code>要求解雇有正当理由，第2段也把申诉程序的目的落在防止普通工人被无正当理由解雇上。<code>hiring procedures</code>却是员工被录用时的程序。<code>B</code>把已经在职的员工如何免遭不当解雇，换成企业如何招聘员工，所处的雇佣环节不同。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>作者先说不得无故解雇，再以普通合同保障不足解释为何设个人申诉程序。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to improve traditional hiring procedures.</p>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p>B需要招聘流程如何改进的内容。后文法律可能使招聘谨慎是副作用，也不能挪成条款原始设计目的。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. exempt employers from certain duties</h3>\n<blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p>条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。</p>\n<p>C需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to exempt employers from certain duties.</p>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p>C需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. protect the rights of ordinary workers</h3>\n<blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><code>protect the rights</code>指向条款所保障的利益，第2段的<code>guard the jobs of ordinary workers</code>恰好说明被保护的人及其岗位，因此回看该段第一句。</p>\n<p>原文的<code>guard the jobs of ordinary workers</code>是保护普通工人的工作，具体防范的是无正当理由的解雇。<code>D</code>用<code>protect the rights</code>概括这一保障：工人不能被随意剥夺岗位。它没有改变被保护的人，也没有把保护换成别的动作，而是将就业方面的这项保障概括为权利保护。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>原有合同规则不足以抵挡管理层任意行为，申诉程序由此提供理由和程序上的保障。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to protect the rights of ordinary workers.</p>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p>D没有泛指保证所有员工永不失业；语境中的rights是免遭任意解雇的保障，与条款对象和目的对应。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. D</strong></p>\n</blockquote>\n<ul>\n<li>A：条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。</li>\n<li>B：dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。</li>\n<li>C：must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</li>\n<li>D：guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>It can be learned from Paragraph 3 that the provisions may ______.</p>\n<p>从第3段可以得知，这些条款可能会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>结果推断题：沿解雇经理受限到生产率、企业成败及员工岗位，确认经营影响。</p>\n<p>题干明确给出Paragraph 3，直接完整精读第3段。段首的these provisions承接前文的就业保护条款，本段讨论把条款用于高薪经理和高管时的情况。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>these provisions create difficulties for businesses when applied to highly paid managers and executives</p>\n<p>The difference between C-grade and A-grade managers may very well be the difference between business success or failure.</p>\n<p>constraining firms from firing poorly performing, high-earning managers</p>\n</blockquote>\n<h3>A. hinder business development</h3>\n<blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><code>hinder business development</code>说条款给企业带来不利影响，第3段开头的<code>create difficulties for businesses</code>与此相连；后面又把经理水平与<code>business success or failure</code>连在一起，因此合看第一句和经理水平的比较。</p>\n<p>原文明确说条款用于高薪经理和高管时会<code>create difficulties for businesses</code>，又说不同水平的经理可能决定企业成败，甚至关系到普通工人的岗位能否保住。<code>hinder business development</code>把这种影响概括为妨碍企业发展。这里的“可能”与原文保留余地的<code>may very well</code>一致，也没有把经理水平对企业的重要性改接给别的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>But把适用对象从普通员工转到高薪经理，handbrake具体说明同样保护怎样成为经营障碍。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may hinder business development.</p>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p>may保留后果的可能性，不声称每家公司都失败；它由经理质量影响经营的关系概括发展受阻。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. undermine managers’ authority</h3>\n<blockquote>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p><code>managers’ authority</code>把经理当成权力受损的一方，第3段的<code>constraining firms from firing</code>却具体写了谁受限制、谁被解雇，因此回看这一句中企业与经理的关系。</p>\n<p>原文的<code>constraining firms from firing</code>说受限制的是企业的解雇行为，表现不佳而收入高的经理是被解雇的对象。<code>B</code>说受影响的是<code>managers’ authority</code>，即经理本人的权威。经理在这句中是企业难以解雇的人，并不是其管理权力受到削弱的人。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>作者先确定解雇困难，再解释差经理与好经理会带来不同经营结果。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may undermine managers’ authority.</p>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p>B需要经理发号施令或获得认可的能力被削弱。岗位难解除与管理权威不强不是同一关系，不能调换受限制主体。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. affect the public image of the firms</h3>\n<blockquote>\n<p>这些条款可能影响企业公众形象。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>生产率、经营表现、成败是企业实际运作结果，public image则是公众眼中的形象，原文未建立外部评价这一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能影响企业公众形象。</p>\n</blockquote>\n<p><code>public image</code>指外界如何看待企业，而第3段写企业后果时用了<code>boosting productivity and overall performance</code>及<code>business success or failure</code>，因此回看这两处，核对所说的企业影响具体是什么。</p>\n<p>原文把限制解雇经理的影响接到<code>boosting productivity and overall performance</code>上，又把经理水平接到企业成败上；谈的是企业内部经营的表现。<code>C</code>的<code>public image</code>则把后果接到企业在公众眼中的形象上。由经营表现进一步影响公众看法，需要另外建立公众评价与企业表现之间的联系，本段没有作出这一连接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>经理不能被有效替换先约束效率，再可能影响企业存续及员工岗位，讨论的是经营链条。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may affect the public image of the firms.</p>\n<p>这些条款可能影响企业公众形象。</p>\n</blockquote>\n<p>C需要公众如何评价企业的内容。经营问题可能间接影响声誉，但不能把这种可能延伸当作本段已经说明的结果。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. worsen labor-management relations</h3>\n<blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><code>labor-management relations</code>涉及工人与管理方之间的关系，第3段同时提到<code>managers</code>和<code>ordinary workers</code>，但两者是通过企业成败和工作岗位相连，因此回看经理水平的比较及紧接着的岗位一句。</p>\n<p>原文先说经理水平可能决定企业成败，再用<code>preserving the jobs of ordinary workers or losing them</code>解释这种差别还涉及普通工人的岗位存失。<code>D</code>的<code>labor-management relations</code>却说工人与管理方之间的相处关系恶化。工作能否保住与双方关系是否紧张是两件事；原文没有把岗位存失接成劳资冲突或关系恶化。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>作者从经理等级差别推到企业成败，再以岗位保住还是失去说明普通员工也会受影响。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may worsen labor-management relations.</p>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p>D需要两方关系恶化的依据。岗位有风险可以影响生活，却不能直接推出劳动者和管理者已经或将发生对立。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>37题结论</h3>\n<blockquote>\n<p><strong>37. A</strong></p>\n</blockquote>\n<ul>\n<li>A：难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。</li>\n<li>B：被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。</li>\n<li>C：生产率、经营表现、成败是企业实际运作结果，public image则是公众眼中的形象，原文未建立外部评价这一后果。</li>\n<li>D：普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。</li>\n</ul>\n<h2>38题</h2>\n<blockquote>\n<p>Which of the following measures would the Productivity Commission support?</p>\n<p>生产力委员会会支持下列哪项措施？</p>\n</blockquote>\n<h3>题型</h3>\n<p>措施推断题：以委员会指出的低管理能力为原因，再结合前句约束解释可支持的措施。</p>\n<p>题干点名the Productivity Commission，第5段同名机构的判断可以直接定位。完整读这一段，先看作者所说的法律、经理和生产率之间的关系，再看委员会报告指出的原因。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>those laws act as a constraint on firm productivity and therefore on workers’ wages</p>\n<p>singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record</p>\n<p>employment protection laws constrain business owners from dismissing underperforming managers</p>\n</blockquote>\n<h3>A. Imposing reasonable wage restraints.</h3>\n<blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><code>wage restraints</code>与第5段的<code>constraint</code>及<code>workers’ wages</code>相接，因此先核对工资限制在段中属于问题还是建议，再看委员会用<code>low quality of managerial capabilities</code>解释了什么。</p>\n<p>原文先说法律限制解雇表现不佳的经理，会压制企业生产率，进而限制<code>workers’ wages</code>。接着委员会指出管理能力低下是生产率增长不佳的一个原因。</p>\n<p><code>A</code>的<code>wage restraints</code>却把这条不利影响链末端的工资限制，改成委员会赞成主动施加的措施。</p>\n<p><code>reasonable</code>只评价限制是否合理，并没有把工资限制与改善管理能力建立联系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>第五段先给法律约束、管理不佳、生产率和工资的链条，再用委员会报告确认管理质量这一原因。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support imposing reasonable wage restraints.</p>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p>reasonable只修饰工资限制是否合理，并未补上它能改善管理质量的关系，不能将问题链末端改成治理手段。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Enforcing employment protection laws.</h3>\n<blockquote>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p><code>Enforcing employment protection laws</code>指落实这类法律，第5段正用<code>employment protection laws constrain business owners</code>说明它们在解雇经理时的作用，因此回看首句，再接委员会对管理能力的判断。</p>\n<p>原文说<code>employment protection laws constrain business owners</code>，使企业主难以解雇表现不佳的经理，因而限制生产率；委员会随后把管理能力低下认作生产率增长不佳的一个原因。<code>B</code>的<code>Enforcing employment protection laws</code>则把落实这种限制作为委员会可能支持的措施。在本段的连接中，法律对解雇的约束正在妨碍企业处理低水平管理问题，把它当成改善措施会与本段所说明的作用方向相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>法律使企业难以替换经理，委员会又认定低管理能力是低生产率增长的一项原因。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support enforcing employment protection laws.</p>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p>B需要执行这些限制有助改善管理的依据。按本文因果，它延续的恰是难以处理低绩效经理的约束，方向与D相反。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Limiting the powers of business owners.</h3>\n<blockquote>\n<p>生产力委员会可能支持限制企业主权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>constrain business owners指限制解雇低绩效经理，并被作者视为生产率障碍；C将该障碍改成应支持的权力限制。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持限制企业主权力。</p>\n</blockquote>\n<p><code>Limiting the powers</code>与第5段的<code>constrain business owners</code>都有约束企业主的意思，因此回看这个动作后面接的<code>from dismissing underperforming managers</code>，再读委员会关于管理能力的结论。</p>\n<p>原文的<code>constrain business owners</code>具体指限制企业主解雇表现不佳的经理，这种限制被说成生产率的障碍；委员会又把管理能力低下视为增长不佳的原因。<code>C</code>用<code>Limiting the powers</code>把限制企业主的权力列为应支持的措施。它既把解雇特定经理这一具体权限扩展为企业主的权力，又把本段造成生产率问题的限制改成了值得支持的办法。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>委员会报告出现在这项限制影响生产率之后，重点确认低管理能力的负面作用。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support limiting the powers of business owners.</p>\n<p>生产力委员会可能支持限制企业主权力。</p>\n</blockquote>\n<p>C既泛化为企业主权力，又没有说明限制能提高管理质量。在本段语境中，它维持问题原因，而非针对原因处理。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Dismissing poorly performing managers.</h3>\n<blockquote>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>委员会指出管理能力低是生产率增长不佳的原因，解除低绩效经理职务能够针对该问题，D符合相邻因果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p><code>poorly performing managers</code>与第5段的<code>underperforming managers</code>指同类经理，<code>Dismissing</code>也对应该句的<code>dismissing</code>，因此回看法律如何影响这项行动，再与委员会说的<code>low quality of managerial capabilities</code>合起来判断。</p>\n<p>原文说难以解雇<code>underperforming managers</code>会约束生产率，紧接着委员会把管理能力低下列为增长不佳的一个原因。<code>D</code>提出<code>Dismissing poorly performing managers</code>，也就是让企业能够解除这类低水平经理的职务。这不是报告中直接写出的建议，但它针对报告指出的管理问题，而且与前句“不能解雇会限制生产率”的因果方向吻合。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>前句写不能解雇这类经理会限制生产率，报告随后提供对管理质量重要性的支持。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support dismissing poorly performing managers.</p>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p>这是由报告原因与上下文推得的措施，并非报告逐字提出的建议，也不能扩大为应任意解雇普通员工。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>38题结论</h3>\n<blockquote>\n<p><strong>38. D</strong></p>\n</blockquote>\n<ul>\n<li>A：工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。</li>\n<li>B：本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。</li>\n<li>C：constrain business owners指限制解雇低绩效经理，并被作者视为生产率障碍；C将该障碍改成应支持的权力限制。</li>\n<li>D：委员会指出管理能力低是生产率增长不佳的原因，解除低绩效经理职务能够针对该问题，D符合相邻因果。</li>\n</ul>\n<h2>39题</h2>\n<blockquote>\n<p>What might be an effect of ERA’s unjustified dismissal procedures?</p>\n<p>ERA中无正当理由解雇的相关程序可能会产生什么影响？</p>\n</blockquote>\n<h3>题型</h3>\n<p>因果细节题：区分招聘谨慎、获聘困难、薪酬压低与社会影响，不把就业入口与现有岗位混同。</p>\n<p>题干中的ERA’s unjustified dismissal procedures在第6段第一句直接出现，该段接着说明这些程序怎样影响企业与经理，完整读第6段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm</p>\n<p>employment protection laws make it costlier to fire an employee</p>\n<p>This makes it harder for the marginal manager to gain employment</p>\n</blockquote>\n<h3>A. Highly paid managers lose their jobs.</h3>\n<blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><code>Highly paid managers</code>在第6段开头出现，而<code>lose their jobs</code>涉及经理的工作状态，因此接着看本段的<code>costlier to fire</code>和<code>harder for the marginal manager to gain employment</code>，分清文中是哪一步变难。</p>\n<p>原文先说高薪经理也会受损，随后具体解释：解雇成本更高，使雇主招聘更谨慎，经理<code>gain employment</code>变得更难。<code>A</code>的<code>lose their jobs</code>却指原本有工作的人失去现有岗位。原文讲的是更难获得工作，并且写明解雇成本上升；<code>A</code>把招聘入口的困难换成现有岗位的丧失。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<p>高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。</p>\n</blockquote>\n<p>解雇成本提高使雇主更慎于招聘，处在录用边缘的经理因此更难找到工作。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Highly paid managers lose their jobs.</p>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p>A需要现有经理被裁掉的后果。文中反而强调解雇更困难，受损并不只能通过失业这一种形式发生。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Employees suffer from salary cuts.</h3>\n<blockquote>\n<p>相关不当解雇程序可能导致员工薪酬被压低。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>firms pay staff less说企业为承担雇佣风险而少付薪酬，B从员工一侧概括收入被压低的损失。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致员工薪酬被压低。</p>\n</blockquote>\n<p>firms pay staff less说企业为承担雇佣风险而少付薪酬，B从员工一侧概括收入被压低的损失。</p>\n<p>除了谨慎招聘，企业还将雇佣安排出错的负担反映到支付报酬上，because直接给出少付原因。</p>\n<p>这里按salary cuts概括薪酬受到压低，不能进一步声称企业已经发布减薪通知或把每位老员工原工资调低；原文只确立pay less。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<p>高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。</p>\n</blockquote>\n<p>除了谨慎招聘，企业还将雇佣安排出错的负担反映到支付报酬上，because直接给出少付原因。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Employees suffer from salary cuts.</p>\n<p>相关不当解雇程序可能导致员工薪酬被压低。</p>\n</blockquote>\n<p>这里按salary cuts概括薪酬受到压低，不能进一步声称企业已经发布减薪通知或把每位老员工原工资调低；原文只确立pay less。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. Society sees a rise in overall well-being.</h3>\n<blockquote>\n<p>相关不当解雇程序可能导致社会整体福祉提升。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>hamper prosperity and overall well-being说明社会繁荣与福祉受到阻碍，a rise却写成提升，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Society also suffers from excessive employment protections. Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致社会整体福祉提升。</p>\n</blockquote>\n<p><code>overall well-being</code>在第7段出现，题目因而需要从经理和员工扩展到社会影响；先把第7段完整读完，再核对<code>a rise</code>与其中的<code>hamper</code>表示的方向。</p>\n<p>原文把<code>overall well-being</code>放在<code>hamper</code>的宾语中，明确说解雇规定会妨碍整体福祉。<code>C</code>的<code>a rise</code>则说整体福祉有所提升，方向相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Society also suffers from excessive employment protections. Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p>\n<p>社会也受过度就业保护之害。严格解雇规定不利于生产率增长，并阻碍繁荣与整体福祉。</p>\n</blockquote>\n<p>第七段用also将损害从企业、经理和员工扩展到社会，解雇限制仍被描述为生产率增长障碍。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Society sees a rise in overall well-being.</p>\n<p>相关不当解雇程序可能导致社会整体福祉提升。</p>\n</blockquote>\n<p>C需要福祉因这些程序提高的证据。保护工作的原始意图不能抵消作者此处对过度保护后果的明确批评。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Employers need to hire new staff.</h3>\n<blockquote>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>more cautious about hiring改变的是雇主招聘态度，need to hire却说产生了新招聘需求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p><code>hire new staff</code>对应第6段的<code>hiring new staff</code>，回看同一句中的<code>more cautious about</code>，核对程序究竟改变了招聘需求还是招聘态度。</p>\n<p>原文说解雇成本更高，因此雇主对<code>hiring new staff</code>更加谨慎。<code>D</code>的<code>need to hire new staff</code>则说这些程序产生了招聘新员工的需要。原文的招聘是雇主要谨慎对待的行动，程序影响的是对这项行动的态度；<code>D</code>却把招聘本身说成程序造成的需求。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<p>高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。</p>\n</blockquote>\n<p>because把解雇成本更高接到谨慎招聘，随后经理更难获聘说明入口变严。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Employers need to hire new staff.</p>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p>D需要新增岗位或补员需要的原因。企业对可能招聘更慎重，不等于法律迫使或促使它必须招聘新员工。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>39题结论</h3>\n<blockquote>\n<p><strong>39. B</strong></p>\n</blockquote>\n<ul>\n<li>A：经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。</li>\n<li>B：firms pay staff less说企业为承担雇佣风险而少付薪酬，B从员工一侧概括收入被压低的损失。</li>\n<li>C：hamper prosperity and overall well-being说明社会繁荣与福祉受到阻碍，a rise却写成提升，方向相反。</li>\n<li>D：more cautious about hiring改变的是雇主招聘态度，need to hire却说产生了新招聘需求。</li>\n</ul>\n<h2>40题</h2>\n<blockquote>\n<p>It can be inferred that the “high-income threshold” in Australia ______.</p>\n<p>可以推断，澳大利亚的“高收入门槛”会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>制度影响推断题：分开澳洲现行收入门槛与新西兰合同退出提案，并接回高薪经理保护的副作用。</p>\n<p>题干同时给出Australia和“high-income threshold”，两者都出现在第8段第一句。完整读最后一段，弄清这一门槛把哪些员工与哪种法律保护区分开，并看后面的新西兰尝试。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws</p>\n<p>Australia deals with the unjustified dismissal paradox by excluding employees</p>\n<p>In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees</p>\n</blockquote>\n<h3>A. has secured managers’ earnings</h3>\n<blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><code>secured managers’ earnings</code>把收入作为被保障的对象，第8段的<code>employees earning above</code>却是用收入辨认哪些员工要被排除，因此回看第一句中<code>excluding</code>与<code>from the protection</code>的连接。</p>\n<p>原文的<code>employees earning above</code>说明收入超过门槛是被排除的条件，排除的是不公平解雇法给予的保护。<code>A</code>的<code>secured managers’ earnings</code>却把收入改成这项制度要保障并已保障的结果。门槛规定谁不在某项解雇保护之内，并没有规定其收入水平必须得到维持或保证；这两种作用不同。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjust
