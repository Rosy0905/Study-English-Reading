quote>\n<p>C需要公众如何评价企业的内容。经营问题可能间接影响声誉，但不能把这种可能延伸当作本段已经说明的结果。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. worsen labor-management relations","raw":"### D. worsen labor-management relations\n\n> 这些条款可能恶化劳资关系。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\n普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。\n\n**出处：**\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section>"},{"title":"D. worsen labor-management relations","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 这些条款可能恶化劳资关系。\n\n`labor-management relations`涉及工人与管理方之间的关系，第3段同时提到`managers`和`ordinary workers`，但两者是通过企业成败和工作岗位相连，因此回看经理水平的比较及紧接着的岗位一句。\n\n原文先说经理水平可能决定企业成败，再用`preserving the jobs of ordinary workers or losing them`解释这种差别还涉及普通工人的岗位存失。`D`的`labor-management relations`却说工人与管理方之间的相处关系恶化。工作能否保住与双方关系是否紧张是两件事；原文没有把岗位存失接成劳资冲突或关系恶化。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><code>labor-management relations</code>涉及工人与管理方之间的关系，第3段同时提到<code>managers</code>和<code>ordinary workers</code>，但两者是通过企业成败和工作岗位相连，因此回看经理水平的比较及紧接着的岗位一句。</p>\n<p>原文先说经理水平可能决定企业成败，再用<code>preserving the jobs of ordinary workers or losing them</code>解释这种差别还涉及普通工人的岗位存失。<code>D</code>的<code>labor-management relations</code>却说工人与管理方之间的相处关系恶化。工作能否保住与双方关系是否紧张是两件事；原文没有把岗位存失接成劳资冲突或关系恶化。</p>\n</section>"},{"title":"D. worsen labor-management relations","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.\n>\n> 但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。\n>\n> 因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。\n\n作者从经理等级差别推到企业成败，再以岗位保住还是失去说明普通员工也会受影响。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The provisions may worsen labor-management relations.\n>\n> 这些条款可能恶化劳资关系。\n\nD需要两方关系恶化的依据。岗位有风险可以影响生活，却不能直接推出劳动者和管理者已经或将发生对立。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p><code>labor-management relations</code>涉及工人与管理方之间的关系，第3段同时提到<code>managers</code>和<code>ordinary workers</code>，但两者是通过企业成败和工作岗位相连，因此回看经理水平的比较及紧接着的岗位一句。</p>\n<p>原文先说经理水平可能决定企业成败，再用<code>preserving the jobs of ordinary workers or losing them</code>解释这种差别还涉及普通工人的岗位存失。<code>D</code>的<code>labor-management relations</code>却说工人与管理方之间的相处关系恶化。工作能否保住与双方关系是否紧张是两件事；原文没有把岗位存失接成劳资冲突或关系恶化。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>作者从经理等级差别推到企业成败，再以岗位保住还是失去说明普通员工也会受影响。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may worsen labor-management relations.</p>\n<p>这些条款可能恶化劳资关系。</p>\n</blockquote>\n<p>D需要两方关系恶化的依据。岗位有风险可以影响生活，却不能直接推出劳动者和管理者已经或将发生对立。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. A**\n\n- A：难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。\n- B：被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。\n- C：生产率、经营表现、成败是企业实际运作结果，public image则是公众眼中的形象，原文未建立外部评价这一后果。\n- D：普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"kind":"conclusion","question":"37","questionConclusion":true},"html":"<blockquote>\n<p><strong>37. A</strong></p>\n</blockquote>\n<ul>\n<li>A：难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。</li>\n<li>B：被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。</li>\n<li>C：生产率、经营表现、成败是企业实际运作结果，public image则是公众眼中的形象，原文未建立外部评价这一后果。</li>\n<li>D：普通工人岗位可能因企业经营受损而消失，未说工人与管理方发生冲突。D把岗位保障后果换成劳资相处关系。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> Which of the following measures would the Productivity Commission support?\n>\n> 生产力委员会会支持下列哪项措施？\n\n### 题型\n\n措施推断题：以委员会指出的低管理能力为原因，再结合前句约束解释可支持的措施。\n\n题干点名the Productivity Commission，第5段同名机构的判断可以直接定位。完整读这一段，先看作者所说的法律、经理和生产率之间的关系，再看委员会报告指出的原因。\n\n### 核心出处\n\n> those laws act as a constraint on firm productivity and therefore on workers’ wages\n>\n> singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record\n>\n> employment protection laws constrain business owners from dismissing underperforming managers","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":2,"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>Which of the following measures would the Productivity Commission support?</p>\n<p>生产力委员会会支持下列哪项措施？</p>\n</blockquote>\n<h3>题型</h3>\n<p>措施推断题：以委员会指出的低管理能力为原因，再结合前句约束解释可支持的措施。</p>\n<p>题干点名the Productivity Commission，第5段同名机构的判断可以直接定位。完整读这一段，先看作者所说的法律、经理和生产率之间的关系，再看委员会报告指出的原因。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>those laws act as a constraint on firm productivity and therefore on workers’ wages</p>\n<p>singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record</p>\n<p>employment protection laws constrain business owners from dismissing underperforming managers</p>\n</blockquote>\n"},{"title":"A. Imposing reasonable wage restraints.","raw":"### A. Imposing reasonable wage restraints.\n\n> 生产力委员会可能支持施加合理工资限制。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。\n\n**出处：**\n\n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages. Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section>"},{"title":"A. Imposing reasonable wage restraints.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 生产力委员会可能支持施加合理工资限制。\n\n`wage restraints`与第5段的`constraint`及`workers’ wages`相接，因此先核对工资限制在段中属于问题还是建议，再看委员会用`low quality of managerial capabilities`解释了什么。\n\n原文先说法律限制解雇表现不佳的经理，会压制企业生产率，进而限制`workers’ wages`。接着委员会指出管理能力低下是生产率增长不佳的一个原因。\n\n`A`的`wage restraints`却把这条不利影响链末端的工资限制，改成委员会赞成主动施加的措施。\n\n`reasonable`只评价限制是否合理，并没有把工资限制与改善管理能力建立联系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><code>wage restraints</code>与第5段的<code>constraint</code>及<code>workers’ wages</code>相接，因此先核对工资限制在段中属于问题还是建议，再看委员会用<code>low quality of managerial capabilities</code>解释了什么。</p>\n<p>原文先说法律限制解雇表现不佳的经理，会压制企业生产率，进而限制<code>workers’ wages</code>。接着委员会指出管理能力低下是生产率增长不佳的一个原因。</p>\n<p><code>A</code>的<code>wage restraints</code>却把这条不利影响链末端的工资限制，改成委员会赞成主动施加的措施。</p>\n<p><code>reasonable</code>只评价限制是否合理，并没有把工资限制与改善管理能力建立联系。</p>\n</section>"},{"title":"A. Imposing reasonable wage restraints.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages. Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.\n>\n> 即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。\n\n第五段先给法律约束、管理不佳、生产率和工资的链条，再用委员会报告确认管理质量这一原因。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The Commission would support imposing reasonable wage restraints.\n>\n> 生产力委员会可能支持施加合理工资限制。\n\nreasonable只修饰工资限制是否合理，并未补上它能改善管理质量的关系，不能将问题链末端改成治理手段。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p><code>wage restraints</code>与第5段的<code>constraint</code>及<code>workers’ wages</code>相接，因此先核对工资限制在段中属于问题还是建议，再看委员会用<code>low quality of managerial capabilities</code>解释了什么。</p>\n<p>原文先说法律限制解雇表现不佳的经理，会压制企业生产率，进而限制<code>workers’ wages</code>。接着委员会指出管理能力低下是生产率增长不佳的一个原因。</p>\n<p><code>A</code>的<code>wage restraints</code>却把这条不利影响链末端的工资限制，改成委员会赞成主动施加的措施。</p>\n<p><code>reasonable</code>只评价限制是否合理，并没有把工资限制与改善管理能力建立联系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>第五段先给法律约束、管理不佳、生产率和工资的链条，再用委员会报告确认管理质量这一原因。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support imposing reasonable wage restraints.</p>\n<p>生产力委员会可能支持施加合理工资限制。</p>\n</blockquote>\n<p>reasonable只修饰工资限制是否合理，并未补上它能改善管理质量的关系，不能将问题链末端改成治理手段。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Enforcing employment protection laws.","raw":"### B. Enforcing employment protection laws.\n\n> 生产力委员会可能支持执行就业保护法。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。\n\n**出处：**\n\n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages. Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section>"},{"title":"B. Enforcing employment protection laws.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 生产力委员会可能支持执行就业保护法。\n\n`Enforcing employment protection laws`指落实这类法律，第5段正用`employment protection laws constrain business owners`说明它们在解雇经理时的作用，因此回看首句，再接委员会对管理能力的判断。\n\n原文说`employment protection laws constrain business owners`，使企业主难以解雇表现不佳的经理，因而限制生产率；委员会随后把管理能力低下认作生产率增长不佳的一个原因。`B`的`Enforcing employment protection laws`则把落实这种限制作为委员会可能支持的措施。在本段的连接中，法律对解雇的约束正在妨碍企业处理低水平管理问题，把它当成改善措施会与本段所说明的作用方向相反。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong 思，这里至少应该写成：\n\n> The Commission would support enforcing employment protection laws.\n>\n> 生产力委员会可能支持执行就业保护法。\n\nB需要执行这些限制有助改善管理的依据。按本文因果，它延续的恰是难以处理低绩效经理的约束，方向与D相反。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p><code>Enforcing employment protection laws</code>指落实这类法律，第5段正用<code>employment protection laws constrain business owners</code>说明它们在解雇经理时的作用，因此回看首句，再接委员会对管理能力的判断。</p>\n<p>原文说<code>employment protection laws constrain business owners</code>，使企业主难以解雇表现不佳的经理，因而限制生产率；委员会随后把管理能力低下认作生产率增长不佳的一个原因。<code>B</code>的<code>Enforcing employment protection laws</code>则把落实这种限制作为委员会可能支持的措施。在本段的连接中，法律对解雇的约束正在妨碍企业处理低水平管理问题，把它当成改善措施会与本段所说明的作用方向相反。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>法律使企业难以替换经理，委员会又认定低管理能力是低生产率增长的一项原因。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support enforcing employment protection laws.</p>\n<p>生产力委员会可能支持执行就业保护法。</p>\n</blockquote>\n<p>B需要执行这些限制有助改善管理的依据。按本文因果，它延续的恰是难以处理低绩效经理的约束，方向与D相反。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. Limiting the powers of business owners.","raw":"### C. Limiting the powers of business owners.\n\n> 生产力委员会可能支持限制企业主权力。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nconstrain business owners指限制解雇低绩效经理，并被作者视为生产率障碍；C将该障碍改成应支持的权力限制。\n\n**出处：**\n\n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages. Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":fa  firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p><code>poorly performing managers</code>与第5段的<code>underperforming managers</code>指同类经理，<code>Dismissing</code>也对应该句的<code>dismissing</code>，因此回看法律如何影响这项行动，再与委员会说的<code>low quality of managerial capabilities</code>合起来判断。</p>\n<p>原文说难以解雇<code>underperforming managers</code>会约束生产率，紧接着委员会把管理能力低下列为增长不佳的一个原因。<code>D</code>提出<code>Dismissing poorly performing managers</code>，也就是让企业能够解除这类低水平经理的职务。这不是报告中直接写出的建议，但它针对报告指出的管理问题，而且与前句“不能解雇会限制生产率”的因果方向吻合。</p>\n</section>"},{"title":"D. Dismissing poorly performing managers.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages. Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.\n>\n> 即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。\n\n前句写不能解雇这类经理会限制生产率，报告随后提供对管理质量重要性的支持。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The Commission would support dismissing poorly performing managers.\n>\n> 生产力委员会可能支持解雇低绩效经理。\n\n这是由报告原因与上下文推得的措施，并非报告逐字提出的建议，也不能扩大为应任意解雇普通员工。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>委员会指出管理能力低是生产率增长不佳的原因，解除低绩效经理职务能够针对该问题，D符合相邻因果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p><code>poorly performing managers</code>与第5段的<code>underperforming managers</code>指同类经理，<code>Dismissing</code>也对应该句的<code>dismissing</code>，因此回看法律如何影响这项行动，再与委员会说的<code>low quality of managerial capabilities</code>合起来判断。</p>\n<p>原文说难以解雇<code>underperforming managers</code>会约束生产率，紧接着委员会把管理能力低下列为增长不佳的一个原因。<code>D</code>提出<code>Dismissing poorly performing managers</code>，也就是让企业能够解除这类低水平经理的职务。这不是报告中直接写出的建议，但它针对报告指出的管理问题，而且与前句“不能解雇会限制生产率”的因果方向吻合。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p>即使不直接危及岗位，只要就业保护法限制企业主解雇低绩效经理，也会约束企业生产率，进而约束员工工资。生产力委员会在2014年一份关于新西兰生产率悖论的国际视角报告中，特别将管理能力质量低下列为国家生产率增长不佳的一项原因。</p>\n</blockquote>\n<p>前句写不能解雇这类经理会限制生产率，报告随后提供对管理质量重要性的支持。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Commission would support dismissing poorly performing managers.</p>\n<p>生产力委员会可能支持解雇低绩效经理。</p>\n</blockquote>\n<p>这是由报告原因与上下文推得的措施，并非报告逐字提出的建议，也不能扩大为应任意解雇普通员工。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. D**\n\n- A：工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。\n- B：本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。\n- C：constrain business owners指限制解雇低绩效经理，并被作者视为生产率障碍；C将该障碍改成应支持的权力限制。\n- D：委员会指出管理能力低是生产率增长不佳的原因，解除低绩效经理职务能够针对该问题，D符合相邻因果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1203,1344,365],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. D</strong></p>\n</blockquote>\n<ul>\n<li>A：工资受约束是管理能力低、生产率受限带来的不利后果，A却把工资限制当成委员会支持的解决措施。</li>\n<li>B：本段将就业保护对解雇低绩效经理的限制写成生产率障碍，强化同一限制并不针对报告指出的管理质量问题。</li>\n<li>C：constrain business owners指限制解雇低绩效经理，并被作者视为生产率障碍；C将该障碍改成应支持的权力限制。</li>\n<li>D：委员会指出管理能力低是生产率增长不佳的原因，解除低绩效经理职务能够针对该问题，D符合相邻因果。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> What might be an effect of ERA’s unjustified dismissal procedures?\n>\n> ERA中无正当理由解雇的相关程序可能会产生什么影响？\n\n### 题型\n\n因果细节题：区分招聘谨慎、获聘困难、薪酬压低与社会影响，不把就业入口与现有岗位混同。\n\n题干中的ERA’s unjustified dismissal procedures在第6段第一句直接出现，该段接着说明这些程序怎样影响企业与经理，完整读第6段。\n\n### 核心出处\n\n> Nor are highly paid managers themselves immune from the harm\n>\n> employment protection laws make it costlier to fire an employee\n>\n> This makes it harder for the marginal manager to gain employment","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>What might be an effect of ERA’s unjustified dismissal procedures?</p>\n<p>ERA中无正当理由解雇的相关程序可能会产生什么影响？</p>\n</blockquote>\n<h3>题型</h3>\n<p>因果细节题：区分招聘谨慎、获聘困难、薪酬压低与社会影响，不把就业入口与现有岗位混同。</p>\n<p>题干中的ERA’s unjustified dismissal procedures在第6段第一句直接出现，该段接着说明这些程序怎样影响企业与经理，完整读第6段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm</p>\n<p>employment protection laws make it costlier to fire an employee</p>\n<p>This makes it harder for the marginal manager to gain employment</p>\n</blockquote>\n"},{"title":"A. Highly paid managers lose their jobs.","raw":"### A. Highly paid managers lose their jobs.\n\n> 相关不当解雇程序可能导致高薪经理失去工作。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。\n\n**出处：**\n\n> Nor are highly paid managers themselves immune from the harm caused by the ERA's unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n</section>"},{"title":"A. Highly paid managers lose their jobs.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 相关不当解雇程序可能导致高薪经理失去工作。\n\n`Highly paid managers`在第6段开头出现，而`lose their jobs`涉及经理的工作状态，因此接着看本段的`costlier to fire`和`harder for the marginal manager to gain employment`，分清文中是哪一步变难。\n\n原文先说高薪经理也会受损，随后具体解释：解雇成本更高，使雇主招聘更谨慎，经理`gain employment`变得更难。`A`的`lose their jobs`却指原本有工作的人失去现有岗位。原文讲的是更难获得工作，并且写明解雇成本上升；`A`把招聘入口的困难换成现有岗位的丧失。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><code>Highly paid managers</code>在第6段开头出现，而<code>lose their jobs</code>涉及经理的工作状态，因此接着看本段的<code>costlier to fire</code>和<code>harder for the marginal manager to gain employment</code>，分清文中是哪一步变难。</p>\n<p>原文先说高薪经理也会受损，随后具体解释：解雇成本更高，使雇主招聘更谨慎，经理<code>gain employment</code>变得更难。<code>A</code>的<code>lose their jobs</code>却指原本有工作的人失去现有岗位。原文讲的是更难获得工作，并且写明解雇成本上升；<code>A</code>把招聘入口的困难换成现有岗位的丧失。</p>\n</section>"},{"title":"A. Highly paid managers lose their jobs.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Nor are highly paid managers themselves immune from the harm caused by the ERA's unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.\n>\n> 高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。\n\n解雇成本提高使雇主更慎于招聘，处在录用边缘的经理因此更难找到工作。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Highly paid managers lose their jobs.\n>\n> 相关不当解雇程序可能导致高薪经理失去工作。\n\nA需要现有经理被裁掉的后果。文中反而强调解雇更困难，受损并不只能通过失业这一种形式发生。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p><code>Highly paid managers</code>在第6段开头出现，而<code>lose their jobs</code>涉及经理的工作状态，因此接着看本段的<code>costlier to fire</code>和<code>harder for the marginal manager to gain employment</code>，分清文中是哪一步变难。</p>\n<p>原文先说高薪经理也会受损，随后具体解释：解雇成本更高，使雇主招聘更谨慎，经理<code>gain employment</code>变得更难。<code>A</code>的<code>lose their jobs</code>却指原本有工作的人失去现有岗位。原文讲的是更难获得工作，并且写明解雇成本上升；<code>A</code>把招聘入口的困难换成现有岗位的丧失。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<p>高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。</p>\n</blockquote>\n<p>解雇成本提高使雇主更慎于招聘，处在录用边缘的经理因此更难找到工作。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Highly paid managers lose their jobs.</p>\n<p>相关不当解雇程序可能导致高薪经理失去工作。</p>\n</blockquote>\n<p>A需要现有经理被裁掉的后果。文中反而强调解雇更困难，受损 w staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n</section>"},{"title":"D. Employers need to hire new staff.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 相关不当解雇程序可能导致雇主产生招聘新员工的需要。\n\n`hire new staff`对应第6段的`hiring new staff`，回看同一句中的`more cautious about`，核对程序究竟改变了招聘需求还是招聘态度。\n\n原文说解雇成本更高，因此雇主对`hiring new staff`更加谨慎。`D`的`need to hire new staff`则说这些程序产生了招聘新员工的需要。原文的招聘是雇主要谨慎对待的行动，程序影响的是对这项行动的态度；`D`却把招聘本身说成程序造成的需求。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>more cautious about hiring改变的是雇主招聘态度，need to hire却说产生了新招聘需求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p><code>hire new staff</code>对应第6段的<code>hiring new staff</code>，回看同一句中的<code>more cautious about</code>，核对程序究竟改变了招聘需求还是招聘态度。</p>\n<p>原文说解雇成本更高，因此雇主对<code>hiring new staff</code>更加谨慎。<code>D</code>的<code>need to hire new staff</code>则说这些程序产生了招聘新员工的需要。原文的招聘是雇主要谨慎对待的行动，程序影响的是对这项行动的态度；<code>D</code>却把招聘本身说成程序造成的需求。</p>\n</section>"},{"title":"D. Employers need to hire new staff.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Nor are highly paid managers themselves immune from the harm caused by the ERA's unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.\n>\n> 高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。\n\nbecause把解雇成本更高接到谨慎招聘，随后经理更难获聘说明入口变严。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Employers need to hire new staff.\n>\n> 相关不当解雇程序可能导致雇主产生招聘新员工的需要。\n\nD需要新增岗位或补员需要的原因。企业对可能招聘更慎重，不等于法律迫使或促使它必须招聘新员工。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>more cautious about hiring改变的是雇主招聘态度，need to hire却说产生了新招聘需求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p><code>hire new staff</code>对应第6段的<code>hiring new staff</code>，回看同一句中的<code>more cautious about</code>，核对程序究竟改变了招聘需求还是招聘态度。</p>\n<p>原文说解雇成本更高，因此雇主对<code>hiring new staff</code>更加谨慎。<code>D</code>的<code>need to hire new staff</code>则说这些程序产生了招聘新员工的需要。原文的招聘是雇主要谨慎对待的行动，程序影响的是对这项行动的态度；<code>D</code>却把招聘本身说成程序造成的需求。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<p>高薪经理自身也不能免受ERA不当解雇程序带来的损害。就业保护使解雇成本更高，雇主因而更慎重招聘新员工，这让处于录用边缘的经理更难获得工作。企业还会少付员工薪酬，因为企业要承担雇佣安排出错的负担。</p>\n</blockquote>\n<p>because把解雇成本更高接到谨慎招聘，随后经理更难获聘说明入口变严。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Employers need to hire new staff.</p>\n<p>相关不当解雇程序可能导致雇主产生招聘新员工的需要。</p>\n</blockquote>\n<p>D需要新增岗位或补员需要的原因。企业对可能招聘更慎重，不等于法律迫使或促使它必须招聘新员工。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. B**\n\n- A：经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。\n- B：firms pay staff less说企业为承担雇佣风险而少付薪酬，B从员工一侧概括收入被压低的损失。\n- C：hamper prosperity and overall well-being说明社会繁荣与福祉受到阻碍，a rise却写成提升，方向相反。\n- D：more cautious about hiring改变的是雇主招聘态度，need to hire却说产生了新招聘需求。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1568,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"kind":"conclusion","question":"39","questionConclusion":true},"html":"<blockquote>\n<p><strong>39. B</strong></p>\n</blockquote>\n<ul>\n<li>A：经理也受损随后具体解释为求职更难，A却变成已任职经理丢工作，把招聘入口的困难换成岗位丧失。</li>\n<li>B：firms pay staff less说企业为承担雇佣风险而少付薪酬，B从员工一侧概括收入被压低的损失。</li>\n<li>C：hamper prosperity and overall well-being说明社会繁荣与福祉受到阻碍，a rise却写成提升，方向相反。</li>\n<li>D：more cautious about hiring改变的是雇主招聘态度，need to hire却说产生了新招聘需求。</li>\n</ul>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n> It can be inferred that the “high-income threshold” in Australia ______.\n>\n> 可以推断，澳大利亚的“高收入门槛”会怎样？\n\n### 题型\n\n制度影响推断题：分开澳洲现行收入门槛与新西兰合同退出提案，并接回高薪经理保护的副作用。\n\n题干同时给出Australia和“high-income threshold”，两者都出现在第8段第一句。完整读最后一段，弄清这一门槛把哪些员工与哪种法律保护区分开，并看后面的新西兰尝试。\n\n### 核心出处\n\n> by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws\n>\n> Australia deals with the unjustified dismissal paradox by excluding employees\n>\n> In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":2,"meta":{"kind":"question","question":"40","questionIntro":true},"html":"<blockquote>\n<p>It can be inferred that the “high-income threshold” in Australia ______.</p>\n<p>可以推断，澳大利亚的“高收入门槛”会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>制度影响推断题：分开澳洲现行收入门槛与新西兰合同退出提案，并接回高薪经理保护的副作用。</p>\n<p>题干同时给出Australia和“high-income threshold”，两者都出现在第8段第一句。完整读最后一段，弄清这一门槛把哪些员工与哪种法律保护区分开，并看后面的新西兰尝试。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws</p>\n<p>Australia deals with the unjustified dismissal paradox by excluding employees</p>\n<p>In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees</p>\n</blockquote>\n"},{"title":"A. has secured managers’ earnings","raw":"### A. has secured managers’ earnings\n\n> 澳大利亚高收入门槛已经保障经理收入。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。\n\n**出处：**\n\n> Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section>"},{"title":"A. has secured managers’ earnings","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 澳大利亚高收入门槛已经保障经理收入。\n\n`secured managers’ earnings`把收入作为被保障的对象，第8段的`employees earning above`却是用收入辨认哪些员工要被排除，因此回看第一句中`excluding`与`from the protection`的连接。\n\n原文的`employees earning above`说明收入超过门槛是被排除的条件，排除的是不公平解雇法给予的保护。`A`的`secured managers’ earnings`却把收入改成这项制度要保障并已保障的结果。门槛规定谁不在某项解雇保护之内，并没有规定其收入水平必须得到维持或保证；这两种作用不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><code>secured managers’ earnings</code>把收入作为被保障的对象，第8段的<code>employees earning above</code>却是用收入辨认哪些员工要被排除，因此回看第一句中<code>excluding</code>与<code>from the protection</code>的连接。</p>\n<p>原文的<code>employees earning above</code>说明收入超过门槛是被排除的条件，排除的是不公平解雇法给予的保护。<code>A</code>的<code>secured managers’ earnings</code>却把收入改成这项制度要保障并已保障的结果。门槛规定谁不在某项解雇保护之内，并没有规定其收入水平必须得到维持或保证；这两种作用不同。</p>\n</section>"},{"title":"A. has secured managers’ earnings","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.\n>\n> 在塔斯曼海另一侧，澳大利亚将收入超过特定高收入门槛者排除在不公平解雇法保护之外，以处理不当解雇悖论。新西兰2016年一项议员法案则尝试允许企业与高收入员工通过合同约定退出该制度。然而拟议机制笨重难操作，法案在那年稍后政府更替之后被投票否决。\n\n澳大利亚按薪资划定不公平解雇法适用范围，作者用它应对高薪经理难以解除的问题。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The threshold has secured managers’ earnings.\n>\n> 澳大利亚高收入门槛已经保障经理收入。\n\nA需要维持或保证经理收入的机制。门槛本身不规定收入不得下降，也不说明高收入者的收入已获保障。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p><code>secured managers’ earnings</code>把收入作为被保障的对象，第8段的<code>employees earning above</code>却是用收入辨认哪些员工要被排除，因此回看第一句中<code>excluding</code>与<code>from the protection</code>的连接。</p>\n<p>原文的<code>employees earning above</code>说明收入超过门槛是被排除的条件，排除的是不公平解雇法给予的保护。<code>A</code>的<code>secured managers’ earnings</code>却把收入改成这项制度要保障并已保障的结果。门槛规定谁不在某项解雇保护之内，并没有规定其收入水平必须得到维持或保证；这两种作用不同。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n<p>在塔斯曼海另一侧，澳大利亚将收入超过特定高收入门槛者排除在不公平解雇法保护之外，以处理不当解雇悖论。新西兰2016年一项议员法案则尝试允许企业与高收入员工通过合同约定退出该制度。然而拟议机制笨重难操作，法案在那年稍后政府更替之后被投票否决。</p>\n</blockquote>\n<p>澳大利亚按薪资划定不公平解雇法适用范围，作者用它应对高薪经理难以解除的问题。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The threshold has secured managers’ earnings.</p>\n<p>澳大利亚高收入门槛已经保障经理收入。</p>\n</blockquote>\n<p>A需要维持或保证经理收入的机制。门槛本身不规定收入不得下降，也不说明高收入者的收入已获保障。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. has produced undesired results","raw":"### B. has produced undesired results\n\n> 澳大利亚高收入门槛已产生不良结果。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\ndeals with说澳大利亚门槛用于处理前文悖论，原文未列其实施后产生不良结果；新西兰法案被否决也不属于澳洲后果。\n\n**出处：**\n\n> Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income thresho  were unwieldy and the Bill was voted down following the change in government later that year.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>高收入者不再享有这项解雇保护，可缓解企业难以处理低绩效高薪经理的约束，C由全文经营问题作出有利推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nAcross the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section>"},{"title":"C. is beneficial to business owners","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 澳大利亚高收入门槛有利于企业主。\n\n`beneficial to business owners`需要把门槛的做法与企业主受到的影响接起来：第8段的`excluding employees`说明高收入员工不再受到这类解雇法保护，而前面第5段的`constrain business owners`已说明同类保护怎样限制企业主，因此回看这两处。\n\n第8段的`excluding employees`将收入超过门槛的员工排除在相关解雇法保护之外。第5段已经说明`constrain business owners`的具体含义：这类保护妨碍企业主解雇表现不佳的经理，并限制生产率。`C`的`beneficial to business owners`据此作推断：减少高收入员工在解雇方面的这项保护，会给企业主处理不胜任经理留下更多空间，从而缓解前文指出的企业困难。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>高收入者不再享有这项解雇保护，可缓解企业难以处理低绩效高薪经理的约束，C由全文经营问题作出有利推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nAcross the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p><code>beneficial to business owners</code>需要把门槛的做法与企业主受到的影响接起来：第8段的<code>excluding employees</code>说明高收入员工不再受到这类解雇法保护，而前面第5段的<code>constrain business owners</code>已说明同类保护怎样限制企业主，因此回看这两处。</p>\n<p>第8段的<code>excluding employees</code>将收入超过门槛的员工排除在相关解雇法保护之外。第5段已经说明<code>constrain business owners</code>的具体含义：这类保护妨碍企业主解雇表现不佳的经理，并限制生产率。<code>C</code>的<code>beneficial to business owners</code>据此作推断：减少高收入员工在解雇方面的这项保护，会给企业主处理不胜任经理留下更多空间，从而缓解前文指出的企业困难。</p>\n</section>"},{"title":"C. is beneficial to business owners","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.\n>\n> 但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。\n>\n> 在塔斯曼海另一侧，澳大利亚将收入超过特定高收入门槛者排除在不公平解雇法保护之外，以处理不当解雇悖论。新西兰2016年一项议员法案则尝试允许企业与高收入员工通过合同约定退出该制度。然而拟议机制笨重难操作，法案在那年稍后政府更替之后被投票否决。\n\n前文说明同样保护用于高薪经理的副作用，末段以澳大利亚门槛展示怎样缩小适用范围。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The threshold is beneficial to business owners.\n>\n> 澳大利亚高收入门槛有利于企业主。\n\nbeneficial在这里指更灵活地处理相应雇佣关系，不是保证企业必然成功，也不是取消普通工人的全部保障。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>高收入者不再享有这项解雇保护，可缓解企业难以处理低绩效高薪经理的约束，C由全文经营问题作出有利推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nAcross the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\ /p>\n</blockquote>\n<p>前文说明同样保护用于高薪经理的副作用，末段以澳大利亚门槛展示怎样缩小适用范围。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The threshold is beneficial to business owners.</p>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p>beneficial在这里指更灵活地处理相应雇佣关系，不是保证企业必然成功，也不是取消普通工人的全部保障。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. is difficult to put into practice","raw":"### D. is difficult to put into practice\n\n> 澳大利亚高收入门槛难以付诸实践。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\nunwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。\n\n**出处：**\n\n> Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section>"},{"title":"D. is difficult to put into practice","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 澳大利亚高收入门槛难以付诸实践。\n\nunwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。\n\nAustralia deals with先陈述澳洲安排，In New Zealand随后明确切换国家和提案，However承接的是这个新提案。\n\nD需要澳洲门槛实施困难的证据。两国机制与状态不同，不能将新西兰提案的复杂性及失败挪给澳洲做法。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p>unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</p>\n<p>Australia deals with先陈述澳洲安排，In New Zealand随后明确切换国家和提案，However承接的是这个新提案。</p>\n<p>
