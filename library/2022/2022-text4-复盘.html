之外。</p>\n</blockquote>\n<p>先说澳大利亚的处理办法，再明确收入门槛及被排除的法律保护。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>在塔斯曼海对岸，澳大利亚通过将收入超过特定&quot;高收入门槛&quot;的员工排除在不公平解雇法的保护之外来处理不正当解雇悖论。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>门槛用于划分适用人群，不是在保证这一群体的收入。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>在塔斯曼海对岸，澳大利亚通过将收入超过特定&quot;高收入门槛&quot;的员工排除在不公平解雇法的保护之外来处理不正当解雇悖论。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2420},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"36题 · 题干、题型与核心出处","raw":"## 36题\n\n> The personal grievance provisions of the ERA are intended to ______.\n>\n> ERA中的个人申诉条款旨在做什么？\n\n### 题型\n\n目的细节题：将designed to与guard the jobs相接，区别原始保护目的与后文副作用。\n\n题干直接点出personal grievance provisions of the ERA。第1段以这组条款开篇，第2段的Personal grievance procedures接着交代设计目的，因此把这两段完整读完。\n\n### 核心出处\n\n> prevent an employer from firing an employee without good cause\n>\n> to guard the jobs of ordinary workers from “unjustified dismissals”\n>\n> dismissals must be justified","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":2,"meta":{"kind":"question","question":"36","questionIntro":true},"html":"<blockquote>\n<p>The personal grievance provisions of the ERA are intended to ______.</p>\n<p>ERA中的个人申诉条款旨在做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>目的细节题：将designed to与guard the jobs相接，区别原始保护目的与后文副作用。</p>\n<p>题干直接点出personal grievance provisions of the ERA。第1段以这组条款开篇，第2段的Personal grievance procedures接着交代设计目的，因此把这两段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>prevent an employer from firing an employee without good cause</p>\n<p>to guard the jobs of ordinary workers from “unjustified dismissals”</p>\n<p>dismissals must be justified</p>\n</blockquote>\n"},{"title":"A. punish dubious corporate practices","raw":"### A. punish dubious corporate practices\n\n> ERA个人申诉条款旨在惩罚可疑企业行为。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。\n\n**出处：**\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-A-0\"><blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section>"},{"title":"A. punish dubious corporate practices","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> ERA个人申诉条款旨在惩罚可疑企业行为。\n\n`punish dubious corporate practices`把重点放在处罚企业，因而回看第1段的`prevent an employer from firing an employee`和第2段的`guard the jobs`，核对条款具体要制止什么、保护什么。\n\n原文的`prevent an employer from firing an employee`把限制对象说得很具体：不让雇主无正当理由地解雇员工；`guard the jobs`进一步说明目的是保住普通工人的工作岗位。`punish dubious corporate practices`则把保护员工免遭某种解雇，改成处罚企业的可疑行为；既把动作换成了惩罚，也把对象扩大到企业行为。条款约束雇主，并不等于这里已经写出了处罚企业这一目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-A-0\"><blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><code>punish dubious corporate practices</code>把重点放在处罚企业，因而回看第1段的<code>prevent an employer from firing an employee</code>和第2段的<code>guard the jobs</code>，核对条款具体要制止什么、保护什么。</p>\n<p>原文的<code>prevent an employer from firing an employee</code>把限制对象说得很具体：不让雇主无正当理由地解雇员工；<code>guard the jobs</code>进一步说明目的是保住普通工人的工作岗位。<code>punish dubious corporate practices</code>则把保护员工免遭某种解雇，改成处罚企业的可疑行为；既把动作换成了惩罚，也把对象扩大到企业行为。条款约束雇主，并不等于这里已经写出了处罚企业这一目的。</p>\n</section>"},{"title":"A. punish dubious corporate practices","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.\n>\n> 新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。\n>\n> 个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。\n\n第一段列解雇必须有理由和程序公平，第二段明确设计初衷是保护员工免遭管理层任意行为。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The provisions are intended to punish dubious corporate practices.\n>\n> ERA个人申诉条款旨在惩罚可疑企业行为。\n\nA需要处罚企业的目的及相关处罚安排。约束解雇可以保护权利，但不能因此概括为处罚任何dubious corporate practices。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-A-0\"><blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p><code>punish dubious corporate practices</code>把重点放在处罚企业，因而回看第1段的<code>prevent an employer from firing an employee</code>和第2段的<code>guard the jobs</code>，核对条款具体要制止什么、保护什么。</p>\n<p>原文的<code>prevent an employer from firing an employee</code>把限制对象说得很具体：不让雇主无正当理由地解雇员工；<code>guard the jobs</code>进一步说明目的是保住普通工人的工作岗位。<code>punish dubious corporate practices</code>则把保护员工免遭某种解雇，改成处罚企业的可疑行为；既把动作换成了惩罚，也把对象扩大到企业行为。条款约束雇主，并不等于这里已经写出了处罚企业这一目的。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>第一段列解雇必须有理由和程序公平，第二段明确设计初衷是保护员工免遭管理层任意行为。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to punish dubious corporate practices.</p>\n<p>ERA个人申诉条款旨在惩罚可疑企业行为。</p>\n</blockquote>\n<p>A需要处罚企业的目的及相关处罚安排。约束解雇可以保护权利，但不能因此概括为处罚任何dubious corporate practices。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. improve traditional hiring procedures","raw":"### B. improve traditional hiring procedures\n\n> ERA个人申诉条款旨在改善传统招聘程序。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\ndismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。\n\n**出处：**\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-B-0\"><blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section>"},{"title":"B. improve traditional hiring procedures","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> ERA个人申诉条款旨在改善传统招聘程序。\n\n`hiring procedures`说的是招人程序，回到第2段的`Personal grievance procedures were designed`和第1段的`dismissals must be justified`，看看这里所规定的程序针对入职还是离职。\n\n原文的`dismissals must be justified`要求解雇有正当理由，第2段也把申诉程序的目的落在防止普通工人被无正当理由解雇上。`hiring procedures`却是员工被录用时的程序。`B`把已经在职的员工如何免遭不当解雇，换成企业如何招聘员工，所处的雇佣环节不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-B-0\"><blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><code>hiring procedures</code>说的是招人程序，回到第2段的<code>Personal grievance procedures were designed</code>和第1段的<code>dismissals must be justified</code>，看看这里所规定的程序针对入职还是离职。</p>\n<p>原文的<code>dismissals must be justified</code>要求解雇有正当理由，第2段也把申诉程序的目的落在防止普通工人被无正当理由解雇上。<code>hiring procedures</code>却是员工被录用时的程序。<code>B</code>把已经在职的员工如何免遭不当解雇，换成企业如何招聘员工，所处的雇佣环节不同。</p>\n</section>"},{"title":"B. improve traditional hiring procedures","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.\n>\n> 新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。\n>\n> 个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。\n\n作者先说不得无故解雇，再以普通合同保障不足解释为何设个人申诉程序。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The provisions are intended to improve traditional hiring procedures.\n>\n> ERA个人申诉条款旨在改善传统招聘程序。\n\nB需要招聘流程如何改进的内容。后文法律可能使招聘谨慎是副作用，也不能挪成条款原始设计目的。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-B-0\"><blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p><code>hiring procedures</code>说的是招人程序，回到第2段的<code>Personal grievance procedures were designed</code>和第1段的<code>dismissals must be justified</code>，看看这里所规定的程序针对入职还是离职。</p>\n<p>原文的<code>dismissals must be justified</code>要求解雇有正当理由，第2段也把申诉程序的目的落在防止普通工人被无正当理由解雇上。<code>hiring procedures</code>却是员工被录用时的程序。<code>B</code>把已经在职的员工如何免遭不当解雇，换成企业如何招聘员工，所处的雇佣环节不同。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>作者先说不得无故解雇，再以普通合同保障不足解释为何设个人申诉程序。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to improve traditional hiring procedures.</p>\n<p>ERA个人申诉条款旨在改善传统招聘程序。</p>\n</blockquote>\n<p>B需要招聘流程如何改进的内容。后文法律可能使招聘谨慎是副作用，也不能挪成条款原始设计目的。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. exempt employers from certain duties","raw":"### C. exempt employers from certain duties\n\n> ERA个人申诉条款旨在免除雇主某些义务。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nmust show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。\n\n**出处：**\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-C-0\"><blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section>"},{"title":"C. exempt employers from certain duties","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> ERA个人申诉条款旨在免除雇主某些义务。\n\nmust show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。\n\n条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。\n\nC需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-C-0\"><blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p>条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。</p>\n<p>C需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。</p>\n</section>"},{"title":"C. exempt employers from certain duties","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.\n>\n> 新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。\n>\n> 个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。\n\n条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The provisions are intended to exempt employers from certain duties.\n>\n> ERA个人申诉条款旨在免除雇主某些义务。\n\nC需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-C-0\"><blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p>must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</p>\n<p>条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。</p>\n<p>C需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>条款限制雇主不能只发合同通知便解雇，强调已有通知义务之外还需要正当理由与程序。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to exempt employers from certain duties.</p>\n<p>ERA个人申诉条款旨在免除雇主某些义务。</p>\n</blockquote>\n<p>C需要条款撤掉雇主某项职责。原文连用must和both...and强化要求，未写义务得到豁免。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. protect the rights of ordinary workers","raw":"### D. protect the rights of ordinary workers\n\n> ERA个人申诉条款旨在保护普通工人权利。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nguard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。\n\n**出处：**\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-D-0\"><blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section>"},{"title":"D. protect the rights of ordinary workers","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> ERA个人申诉条款旨在保护普通工人权利。\n\n`protect the rights`指向条款所保障的利益，第2段的`guard the jobs of ordinary workers`恰好说明被保护的人及其岗位，因此回看该段第一句。\n\n原文的`guard the jobs of ordinary workers`是保护普通工人的工作，具体防范的是无正当理由的解雇。`D`用`protect the rights`概括这一保障：工人不能被随意剥夺岗位。它没有改变被保护的人，也没有把保护换成别的动作，而是将就业方面的这项保障概括为权利保护。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-D-0\"><blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><code>protect the rights</code>指向条款所保障的利益，第2段的<code>guard the jobs of ordinary workers</code>恰好说明被保护的人及其岗位，因此回看该段第一句。</p>\n<p>原文的<code>guard the jobs of ordinary workers</code>是保护普通工人的工作，具体防范的是无正当理由的解雇。<code>D</code>用<code>protect the rights</code>概括这一保障：工人不能被随意剥夺岗位。它没有改变被保护的人，也没有把保护换成别的动作，而是将就业方面的这项保障概括为权利保护。</p>\n</section>"},{"title":"D. protect the rights of ordinary workers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\". The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.\n>\n> 新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。\n>\n> 个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。\n\n原有合同规则不足以抵挡管理层任意行为，申诉程序由此提供理由和程序上的保障。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The provisions are intended to protect the rights of ordinary workers.\n>\n> ERA个人申诉条款旨在保护普通工人权利。\n\nD没有泛指保证所有员工永不失业；语境中的rights是免遭任意解雇的保障，与条款对象和目的对应。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-D-0\"><blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p><code>protect the rights</code>指向条款所保障的利益，第2段的<code>guard the jobs of ordinary workers</code>恰好说明被保护的人及其岗位，因此回看该段第一句。</p>\n<p>原文的<code>guard the jobs of ordinary workers</code>是保护普通工人的工作，具体防范的是无正当理由的解雇。<code>D</code>用<code>protect the rights</code>概括这一保障：工人不能被随意剥夺岗位。它没有改变被保护的人，也没有把保护换成别的动作，而是将就业方面的这项保障概括为权利保护。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way.\nPersonal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p>新西兰2000年《雇佣关系法》的个人申诉条款防止雇主无正当理由解雇员工。解雇必须有依据，雇主既须说明理由，也须按公平程序行事。</p>\n<p>个人申诉程序旨在保护普通员工岗位免受无正当理由解雇。其前提是普通合同法不足以防范管理层任意行为，保障工人。老板只要给出合同规定通知就能解雇的日子早已过去。</p>\n</blockquote>\n<p>原有合同规则不足以抵挡管理层任意行为，申诉程序由此提供理由和程序上的保障。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions are intended to protect the rights of ordinary workers.</p>\n<p>ERA个人申诉条款旨在保护普通工人权利。</p>\n</blockquote>\n<p>D没有泛指保证所有员工永不失业；语境中的rights是免遭任意解雇的保障，与条款对象和目的对应。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"36题结论","raw":"### 36题结论\n\n> **36. D**\n\n- A：条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。\n- B：dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。\n- C：must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。\n- D：guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,576,1344,313],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"kind":"conclusion","question":"36","questionConclusion":true},"html":"<blockquote>\n<p><strong>36. D</strong></p>\n</blockquote>\n<ul>\n<li>A：条款要制止无正当理由解雇、保障普通工人岗位，A改成惩罚可疑企业行为，动作和涉及范围均改变。</li>\n<li>B：dismissal是解雇已在职员工，hiring是招聘入职。程序公平要求针对前者，B换了雇佣阶段。</li>\n<li>C：must show cause and act fairly给雇主增加说明理由与公平程序要求，exempt却说免除义务，方向相反。</li>\n<li>D：guard the jobs of ordinary workers明确保护普通员工免遭无正当理由解雇，D将这种就业保障概括为权利保护。</li>\n</ul>\n"},{"title":"37题 · 题干、题型与核心出处","raw":"## 37题\n\n> It can be learned from Paragraph 3 that the provisions may ______.\n>\n> 从第3段可以得知，这些条款可能会怎样？\n\n### 题型\n\n结果推断题：沿解雇经理受限到生产率、企业成败及员工岗位，确认经营影响。\n\n题干明确给出Paragraph 3，直接完整精读第3段。段首的these provisions承接前文的就业保护条款，本段讨论把条款用于高薪经理和高管时的情况。\n\n### 核心出处\n\n> these provisions create difficulties for businesses when applied to highly paid managers and executives\n>\n> The difference between C-grade and A-grade managers may very well be the difference between business success or failure.\n>\n> constraining firms from firing poorly performing, high-earning managers","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":2,"meta":{"kind":"question","question":"37","questionIntro":true},"html":"<blockquote>\n<p>It can be learned from Paragraph 3 that the provisions may ______.</p>\n<p>从第3段可以得知，这些条款可能会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>结果推断题：沿解雇经理受限到生产率、企业成败及员工岗位，确认经营影响。</p>\n<p>题干明确给出Paragraph 3，直接完整精读第3段。段首的these provisions承接前文的就业保护条款，本段讨论把条款用于高薪经理和高管时的情况。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>these provisions create difficulties for businesses when applied to highly paid managers and executives</p>\n<p>The difference between C-grade and A-grade managers may very well be the difference between business success or failure.</p>\n<p>constraining firms from firing poorly performing, high-earning managers</p>\n</blockquote>\n"},{"title":"A. hinder business development","raw":"### A. hinder business development\n\n> 这些条款可能妨碍企业发展。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。\n\n**出处：**\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section>"},{"title":"A. hinder business development","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 这些条款可能妨碍企业发展。\n\n`hinder business development`说条款给企业带来不利影响，第3段开头的`create difficulties for businesses`与此相连；后面又把经理水平与`business success or failure`连在一起，因此合看第一句和经理水平的比较。\n\n原文明确说条款用于高薪经理和高管时会`create difficulties for businesses`，又说不同水平的经理可能决定企业成败，甚至关系到普通工人的岗位能否保住。`hinder business development`把这种影响概括为妨碍企业发展。这里的“可能”与原文保留余地的`may very well`一致，也没有把经理水平对企业的重要性改接给别的对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><code>hinder business development</code>说条款给企业带来不利影响，第3段开头的<code>create difficulties for businesses</code>与此相连；后面又把经理水平与<code>business success or failure</code>连在一起，因此合看第一句和经理水平的比较。</p>\n<p>原文明确说条款用于高薪经理和高管时会<code>create difficulties for businesses</code>，又说不同水平的经理可能决定企业成败，甚至关系到普通工人的岗位能否保住。<code>hinder business development</code>把这种影响概括为妨碍企业发展。这里的“可能”与原文保留余地的<code>may very well</code>一致，也没有把经理水平对企业的重要性改接给别的对象。</p>\n</section>"},{"title":"A. hinder business development","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.\n>\n> 但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。\n>\n> 因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。\n\nBut把适用对象从普通员工转到高薪经理，handbrake具体说明同样保护怎样成为经营障碍。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The provisions may hinder business development.\n>\n> 这些条款可能妨碍企业发展。\n\nmay保留后果的可能性，不声称每家公司都失败；它由经理质量影响经营的关系概括发展受阻。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>难以解雇低绩效高薪经理，限制生产率与整体表现，并可能关系企业成败，A概括阻碍企业发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p><code>hinder business development</code>说条款给企业带来不利影响，第3段开头的<code>create difficulties for businesses</code>与此相连；后面又把经理水平与<code>business success or failure</code>连在一起，因此合看第一句和经理水平的比较。</p>\n<p>原文明确说条款用于高薪经理和高管时会<code>create difficulties for businesses</code>，又说不同水平的经理可能决定企业成败，甚至关系到普通工人的岗位能否保住。<code>hinder business development</code>把这种影响概括为妨碍企业发展。这里的“可能”与原文保留余地的<code>may very well</code>一致，也没有把经理水平对企业的重要性改接给别的对象。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>But把适用对象从普通员工转到高薪经理，handbrake具体说明同样保护怎样成为经营障碍。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may hinder business development.</p>\n<p>这些条款可能妨碍企业发展。</p>\n</blockquote>\n<p>may保留后果的可能性，不声称每家公司都失败；它由经理质量影响经营的关系概括发展受阻。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. undermine managers’ authority","raw":"### B. undermine managers’ authority\n\n> 这些条款可能削弱经理权威。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。\n\n**出处：**\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create ade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p><code>managers’ authority</code>把经理当成权力受损的一方，第3段的<code>constraining firms from firing</code>却具体写了谁受限制、谁被解雇，因此回看这一句中企业与经理的关系。</p>\n<p>原文的<code>constraining firms from firing</code>说受限制的是企业的解雇行为，表现不佳而收入高的经理是被解雇的对象。<code>B</code>说受影响的是<code>managers’ authority</code>，即经理本人的权威。经理在这句中是企业难以解雇的人，并不是其管理权力受到削弱的人。</p>\n</section>"},{"title":"B. undermine managers’ authority","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.\n>\n> 但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。\n>\n> 因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。\n\n作者先确定解雇困难，再解释差经理与好经理会带来不同经营结果。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The provisions may undermine managers’ authority.\n>\n> 这些条款可能削弱经理权威。\n\nB需要经理发号施令或获得认可的能力被削弱。岗位难解除与管理权威不强不是同一关系，不能调换受限制主体。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>被限制的是企业解雇经理的权限，经理是受到岗位保护的一方，原文没有说经理自己的管理权威减弱。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p><code>managers’ authority</code>把经理当成权力受损的一方，第3段的<code>constraining firms from firing</code>却具体写了谁受限制、谁被解雇，因此回看这一句中企业与经理的关系。</p>\n<p>原文的<code>constraining firms from firing</code>说受限制的是企业的解雇行为，表现不佳而收入高的经理是被解雇的对象。<code>B</code>说受影响的是<code>managers’ authority</code>，即经理本人的权威。经理在这句中是企业难以解雇的人，并不是其管理权力受到削弱的人。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>因此，具有悖论意味的是，原为保护普通员工岗位引入的法律，反可能使这些岗位面临风险。</p>\n</blockquote>\n<p>作者先确定解雇困难，再解释差经理与好经理会带来不同经营结果。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The provisions may undermine managers’ authority.</p>\n<p>这些条款可能削弱经理权威。</p>\n</blockquote>\n<p>B需要经理发号施令或获得认可的能力被削弱。岗位难解除与管理权威不强不是同一关系，不能调换受限制主体。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. affect the public image of the firms","raw":"### C. affect the public image of the firms\n\n> 这些条款可能影响企业公众形象。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n生产率、经营表现、成败是企业实际运作结果，public image则是公众眼中的形象，原文未建立外部评价这一后果。\n\n**出处：**\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-C-0\"><blockquote>\n<p>这些条款可能影响企业公众形象。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>生产率、经营表现、成败是企业实际运作结果，public image则是公众眼中的形象，原文未建立外部评价这一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nConsequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n</section>"},{"title":"C. affect the public image of the firms","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 这些条款可能影响企业公众形象。\n\n`public image`指外界如何看待企业，而第3段写企业后果时用了`boosting productivity and overall performance`及`business success or failure`，因此回看这两处，核对所说的企业影响具体是什么。\n\n原文把限制解雇经理的影响接到`boosting productivity and overall performance`上，又把经理水平接到企业成败上；谈的是企业内部经营的表现。`C`的`public image`则把后果接到企业在公众眼中的形象上。由经营表现进一步影响公众看法，需要另外建立公众评价与企业表现之间的联系，本段没有作出这一连接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,889,1344,314],"sourceW":1624,"sourceH":2420},"level":4,"meta":{"question":"37","option":"C","c
