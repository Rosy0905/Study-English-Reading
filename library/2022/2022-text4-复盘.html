ified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p>unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</p>\n<p>Australia deals with先陈述澳洲安排，In New Zealand随后明确切换国家和提案，However承接的是这个新提案。</p>\n<p>D需要澳洲门槛实施困难的证据。两国机制与状态不同，不能将新西兰提案的复杂性及失败挪给澳洲做法。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n<p>在塔斯曼海另一侧，澳大利亚将收入超过特定高收入门槛者排除在不公平解雇法保护之外，以处理不当解雇悖论。新西兰2016年一项议员法案则尝试允许企业与高收入员工通过合同约定退出该制度。然而拟议机制笨重难操作，法案在那年稍后政府更替之后被投票否决。</p>\n</blockquote>\n<p>Australia deals with先陈述澳洲安排，In New Zealand随后明确切换国家和提案，However承接的是这个新提案。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The threshold is difficult to put into practice.</p>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p>D需要澳洲门槛实施困难的证据。两国机制与状态不同，不能将新西兰提案的复杂性及失败挪给澳洲做法。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. C**\n\n- A：收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。\n- B：deals with说澳大利亚门槛用于处理前文悖论，原文未列其实施后产生不良结果；新西兰法案被否决也不属于澳洲后果。\n- C：高收入者不再享有这项解雇保护，可缓解企业难以处理低绩效高薪经理的约束，C由全文经营问题作出有利推断。\n- D：unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1882,1344,353],"sourceW":1624,"sourceH":2420},"level":3,"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. C</strong></p>\n</blockquote>\n<ul>\n<li>A：收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。</li>\n<li>B：deals with说澳大利亚门槛用于处理前文悖论，原文未列其实施后产生不良结果；新西兰法案被否决也不属于澳洲后果。</li>\n<li>C：高收入者不再享有这项解雇保护，可缓解企业难以处理低绩效高薪经理的约束，C由全文经营问题作出有利推断。</li>\n<li>D：unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：ERA法律的基本内容与初衷**（段落1-2法律介绍） 法律内容：【ERA个人申诉条款：阻止无正当理由解雇 → 要求程序公正】→ 设计初衷：保护普通工人免受不正当解雇（因合同法保护不足）\n\n↓（问题出现）\n\n**逻辑层次2：法律应用于高管的困境**（段落3具体问题） 应用困难：【限制解雇表现不佳的高薪经理 → 成为提升生产力的\"手刹\"】→ 管理质量的重要性：（C级vs A级经理 = 企业成败）→ 矛盾：平庸不足以成为解雇理由\n\n↓（悖论显现）\n\n**逻辑层次3：保护法的悖论效应**（段落4-5负面影响） 核心悖论：保护普通工人的法律反而使其工作处于风险 → 具体影响：【限制解雇低效经理 → 限制公司生产力 → 限制工人工资】→ 权威支持：生产力委员会指出管理能力低下是生产力增长差的原因\n\n↓（影响扩大）\n\n**逻辑层次4：多方受害的连锁反应**（段落6-7广泛影响） 对高薪经理的伤害：（解雇成本高 → 雇主谨慎雇用 → 边缘经理难就业 + 薪酬降低）→ 对社会的伤害：（过度保护 → 阻碍生产力增长 + 损害繁荣和福祉）\n\n↓（解决方案）\n\n**逻辑层次5：国际经验与本地尝试**（段落8解决尝试） 澳大利亚方案：高收入门槛以上员工不受保护 // 新西兰尝试：2016年法案允许高收入者退出（但机制笨重+被否决）\n\n↑（全文主旨）\n\n全文核心观点：原本为保护普通工人而设计的ERA不正当解雇条款，在应用于高薪管理层时产生了悖论效应——不仅阻碍了企业发展和生产力提升，反而可能危及其原本要保护的普通工人的工作。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：ERA法律的基本内容与初衷</strong>（段落1-2法律介绍） 法律内容：【ERA个人申诉条款：阻止无正当理由解雇 → 要求程序公正】→ 设计初衷：保护普通工人免受不正当解雇（因合同法保护不足）</p>\n<p>↓（问题出现）</p>\n<p><strong>逻辑层次2：法律应用于高管的困境</strong>（段落3具体问题） 应用困难：【限制解雇表现不佳的高薪经理 → 成为提升生产力的&quot;手刹&quot;】→ 管理质量的重要性：（C级vs A级经理 = 企业成败）→ 矛盾：平庸不足以成为解雇理由</p>\n<p>↓（悖论显现）</p>\n<p><strong>逻辑层次3：保护法的悖论效应</strong>（段落4-5负面影响） 核心悖论：保护普通工人的法律反而使其工作处于风险 → 具体影响：【限制解雇低效经理 → 限制公司生产力 → 限制工人工资】→ 权威支持：生产力委员会指出管理能力低下是生产力增长差的原因</p>\n<p>↓（影响扩大）</p>\n<p><strong>逻辑层次4：多方受害的连锁反应</strong>（段落6-7广泛影响） 对高薪经理的伤害：（解雇成本高 → 雇主谨慎雇用 → 边缘经理难就业 + 薪酬降低）→ 对社会的伤害：（过度保护 → 阻碍生产力增长 + 损害繁荣和福祉）</p>\n<p>↓（解决方案）</p>\n<p><strong>逻辑层次5：国际经验与本地尝试</strong>（段落8解决尝试） 澳大利亚方案：高收入门槛以上员工不受保护 // 新西兰尝试：2016年法案允许高收入者退出（但机制笨重+被否决）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：原本为保护普通工人而设计的ERA不正当解雇条款，在应用于高薪管理层时产生了悖论效应——不仅阻碍了企业发展和生产力提升，反而可能危及其原本要保护的普通工人的工作。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】A. The original protection against unjustified dismissal\n\n> 最初防止无正当理由解雇的保护\n\n条款要求解雇有正当原因并遵守公平程序，原始目的在保护普通工人免于管理层任意行为。\n\n> The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.\n\nprevent...without good cause明确限制无理由解雇，公平程序是雇主同时必须遵守的要求。\n\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\".\n\ndesigned to直接给出初衷：普通合同保障不足，故要保护普通工人岗位。\n\n> Long gone are the days when a boss could simply give an employee contractual notice.\n\n只给合同通知即可解雇的时代结束，说明保障增加；标题需落在原始保护目的，不提前混入后文副作用。\n\n这一部分的推进关系是：\n\n> 普通合同保障不足 → 解雇须有正当理由及公平程序 → 保护普通员工岗位\n\noriginal protection对应designed to guard，unjustified dismissal是针对的具体风险。\n\n再看最强干扰项G：A proposal to remove all protections from all workers。\n\n这里只讲为何建立保护，不是要求取消所有保护。\n\n**41题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】A. The original protection against unjustified dismissal</p>\n<blockquote>\n<p>最初防止无正当理由解雇的保护</p>\n</blockquote>\n<p>条款要求解雇有正当原因并遵守公平程序，原始目的在保护普通工人免于管理层任意行为。</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.</p>\n</blockquote>\n<p>prevent...without good cause明确限制无理由解雇，公平程序是雇主同时必须遵守的要求。</p>\n<blockquote>\n<p>Personal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;.</p>\n</blockquote>\n<p>designed to直接给出初衷：普通合同保障不足，故要保护普通工人岗位。</p>\n<blockquote>\n<p>Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n<p>只给合同通知即可解雇的时代结束，说明保障增加；标题需落在原始保护目的，不提前混入后文副作用。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>普通合同保障不足 → 解雇须有正当理由及公平程序 → 保护普通员工岗位</p>\n</blockquote>\n<p>original protection对应designed to guard，unjustified dismissal是针对的具体风险。</p>\n<p>再看最强干扰项G：A proposal to remove all protections from all workers。</p>\n<p>这里只讲为何建立保护，不是要求取消所有保护。</p>\n<p><strong>41题选A。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】D. When protection can put the protected jobs at risk\n\n> 保护反而可能危及被保护岗位\n\n应用到高薪经理时，难解雇表现不佳者会影响企业成败，进而反使普通岗位面临风险。\n\n> But these provisions create difficulties for businesses when applied to highly paid managers and executives.\n\nBut切换适用对象为高薪经理，原本保护条款在此可能成为企业难题。\n\n> Between preserving the jobs of ordinary workers or losing them.\n\n普通岗位保住或失去是经理质量影响企业成败的进一步后果，说明经理任职并非只关系本人。\n\n> Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.\n\nConsequently与paradoxically将保护初衷和反向风险相接，标题要突出保护反而可能危及原受益者。\n\n这一部分的推进关系是：\n\n> 低绩效经理难解雇 → 企业表现与成败受影响 → 普通工人岗位反受威胁\n\nwhen protection ... at risk概括第三段的经营链条与第四段的悖论总结。\n\n再看最强干扰项F：Guaranteed higher earnings for every manager。\n\n讨论经理差异怎样影响企业，不是保证经理收入增加。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】D. When protection can put the protected jobs at risk</p>\n<blockquote>\n<p>保护反而可能危及被保护岗位</p>\n</blockquote>\n<p>应用到高薪经理时，难解雇表现不佳者会影响企业成败，进而反使普通岗位面临风险。</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives.</p>\n</blockquote>\n<p>But切换适用对象为高薪经理，原本保护条款在此可能成为企业难题。</p>\n<blockquote>\n<p>Between preserving the jobs of ordinary workers or losing them.</p>\n</blockquote>\n<p>普通岗位保住或失去是经理质量影响企业成败的进一步后果，说明经理任职并非只关系本人。</p>\n<blockquote>\n<p>Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n<p>Consequently与paradoxically将保护初衷和反向风险相接，标题要突出保护反而可能危及原受益者。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>低绩效经理难解雇 → 企业表现与成败受影响 → 普通工人岗位反受威胁</p>\n</blockquote>\n<p>when protection ... at risk概括第三段的经营链条与第四段的悖论总结。</p>\n<p>再看最强干扰项F：Guaranteed higher earnings for every manager。</p>\n<p>讨论经理差异怎样影响企业，不是保证经理收入增加。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】E. Low managerial quality as a productivity constraint\n\n> 管理质量低下作为生产率约束\n\n就算不直接危及岗位，经理难以替换也约束生产率和工资；委员会报告把管理能力低下列为原因。\n\n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages.\n\nIf not placing jobs at risk让步后仍强调工资与生产率代价，限制解雇经理是起点。\n\n> Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.\n\nIndeed引委员会报告作支持，管理能力低被认作生产率增长不佳的一项原因。\n\n这一部分的推进关系是：\n\n> 替换低绩效经理受限 → 生产率受约束 → 工资受影响，报告支持管理质量重要\n\nmanagerial quality直接对应low quality of managerial capabilities，constraint保留其负面作用。\n\n再看最强干扰项B：Effects on hiring, pay and wider prosperity。\n\nB是更广的招聘和社会影响，本段集中于管理能力和生产率。\n\n**43题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】E. Low managerial quality as a productivity constraint</p>\n<blockquote>\n<p>管理质量低下作为生产率约束</p>\n</blockquote>\n<p>就算不直接危及岗位，经理难以替换也约束生产率和工资；委员会报告把管理能力低下列为原因。</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages.</p>\n</blockquote>\n<p>If not placing jobs at risk让步后仍强调工资与生产率代价，限制解雇经理是起点。</p>\n<blockquote>\n<p>Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n<p>Indeed引委员会报告作支持，管理能力低被认作生产率增长不佳的一项原因。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>替换低绩效经理受限 → 生产率受约束 → 工资受影响，报告支持管理质量重要</p>\n</blockquote>\n<p>managerial quality直接对应low quality of managerial capabilities，constraint保留其负面作用。</p>\n<p>再看最强干扰项B：Effects on hiring, pay and wider prosperity。</p>\n<p>B是更广的招聘和社会影响，本段集中于管理能力和生产率。</p>\n<p><strong>43题选E。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】B. Effects on hiring, pay and wider prosperity\n\n> 对招聘、工资和社会繁荣的影响\n\n解雇成本高使雇主招聘谨慎、边缘经理求职更难，风险也反映到薪酬；社会繁荣与福祉同样受影响。\n\n> Nor are highly paid managers themselves immune from the harm caused by the ERA's unjustified dismissal procedures.\n\nNor...immune把影响扩大到高薪经理自身，随后通过解雇成本和谨慎招聘说明求职入口受限。\n\n> And firms pay staff less because firms carry the burden of the employment arrangement going wrong.\n\n企业少付薪酬是风险负担的另一反应，不能自行补成已发布针对全部在职员工的降薪通知。\n\n> Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.\n\n社会生产率、繁荣与福祉进一步扩展影响层级，标题应覆盖招聘、薪酬及社会后果。\n\n这一部分的推进关系是：\n\n> 解雇成本高 → 招聘谨慎及薪酬压低 → 社会繁荣福祉受阻\n\neffects覆盖雇员、经理和社会三层后果，未把保护写成只让某一方受害。\n\n再看最强干扰项F：Guaranteed higher earnings for every manager。\n\nfirms pay staff less与保证更高收入相反。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】B. Effects on hiring, pay and wider prosperity</p>\n<blockquote>\n<p>对招聘、工资和社会繁荣的影响</p>\n</blockquote>\n<p>解雇成本高使雇主招聘谨慎、边缘经理求职更难，风险也反映到薪酬；社会繁荣与福祉同样受影响。</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures.</p>\n</blockquote>\n<p>Nor...immune把影响扩大到高薪经理自身，随后通过解雇成本和谨慎招聘说明求职入口受限。</p>\n<blockquote>\n<p>And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n<p>企业少付薪酬是风险负担的另一反应，不能自行补成已发布针对全部在职员工的降薪通知。</p>\n<blockquote>\n<p>Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p>\n</blockquote>\n<p>社会生产率、繁荣与福祉进一步扩展影响层级，标题应覆盖招聘、薪酬及社会后果。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>解雇成本高 → 招聘谨慎及薪酬压低 → 社会繁荣福祉受阻</p>\n</blockquote>\n<p>effects覆盖雇员、经理和社会三层后果，未把保护写成只让某一方受害。</p>\n<p>再看最强干扰项F：Guaranteed higher earnings for every manager。</p>\n<p>firms pay staff less与保证更高收入相反。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】C. A distinction based on income and a failed reform attempt\n\n> 按收入区分保护与未成功的改革尝试\n\n澳大利亚以高收入门槛排除部分保护，新西兰尝试合同退出却因机制复杂等因素未获通过。\n\n> Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection of its unfair dismissal laws.\n\nAustralia以收入门槛排除部分保护，是处理悖论的一种已述做法。\n\n> In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.\n\nIn New Zealand切换到另一国和另一机制：允许高收入员工与企业以合同退出。\n\n> However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.\n\nHowever承接新西兰提案，说明机制难操作且政府更替后被否决，不能把这个结局移到澳洲。\n\n这一部分的推进关系是：\n\n> 澳洲按收入界定保护范围 → 新西兰拟采用合同退出 → 后者机制难操作且法案被否决\n\ndistinction based on income与failed attempt对应两国不同安排，不能互换成败。\n\n再看最强干扰项G：A proposal to remove all protections from all workers。\n\n都是针对高收入群体的区别安排，并非取消普通工人的全部保护。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】C. A distinction based on income and a failed reform attempt</p>\n<blockquote>\n<p>按收入区分保护与未成功的改革尝试</p>\n</blockquote>\n<p>澳大利亚以高收入门槛排除部分保护，新西兰尝试合同退出却因机制复杂等因素未获通过。</p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws.</p>\n</blockquote>\n<p>Australia以收入门槛排除部分保护，是处理悖论的一种已述做法。</p>\n<blockquote>\n<p>In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.</p>\n</blockquote>\n<p>In New Zealand切换到另一国和另一机制：允许高收入员工与企业以合同退出。</p>\n<blockquote>\n<p>However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n<p>However承接新西兰提案，说明机制难操作且政府更替后被否决，不能把这个结局移到澳洲。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>澳洲按收入界定保护范围 → 新西兰拟采用合同退出 → 后者机制难操作且法案被否决</p>\n</blockquote>\n<p>distinction based on income与failed attempt对应两国不同安排，不能互换成败。</p>\n<p>再看最强干扰项G：A proposal to remove all protections from all workers。</p>\n<p>都是针对高收入群体的区别安排，并非取消普通工人的全部保护。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 交代解雇保护的初衷与要求 |\n| B | 说明解雇成本提高带来的招聘谨慎 |\n| C | 介绍澳大利亚按高收入门槛划分保护 |\n| D | 转出高薪经理受到保护时的经营难题 |\n| E | 把管理问题接到生产率及工资 |\n| F | 拓展到薪酬与社会福祉后果 |\n| G | 说明保护可能反使普通岗位受损 |\n| H | 区分新西兰合同退出提案的失败 |\n\n全文推进：\n\n> 交代解雇保护的初衷与要求 → 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损 → 把管理问题接到生产率及工资 → 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护 → 区分新西兰合同退出提案的失败\n\n完整顺序：\n\n**A → D → G → E → B → F → C → H**\n\n41—45：D、G、B、F、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>交代解雇保护的初衷与要求</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明解雇成本提高带来的招聘谨慎</td>\n</tr>\n<tr>\n<td>C</td>\n<td>介绍澳大利亚按高收入门槛划分保护</td>\n</tr>\n<tr>\n<td>D</td>\n<td>转出高薪经理受到保护时的经营难题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>把管理问题接到生产率及工资</td>\n</tr>\n<tr>\n<td>F</td>\n<td>拓展到薪酬与社会福祉后果</td>\n</tr>\n<tr>\n<td>G</td>\n<td>说明保护可能反使普通岗位受损</td>\n</tr>\n<tr>\n<td>H</td>\n<td>区分新西兰合同退出提案的失败</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>交代解雇保护的初衷与要求 → 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损 → 把管理问题接到生产率及工资 → 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护 → 区分新西兰合同退出提案的失败</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → G → E → B → F → C → H</strong></p>\n<p>41—45：D、G、B、F、C。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → D → G。\n\n先看前段A的结尾：\n\n> The original purpose was to correct an imbalance in which contractual notice alone offered too little protection against arbitrary management.\n\n再看D段开头：\n\n> Applying the same protection to highly paid managers can create a different problem.\n\n前段解释原始保护纠正合同通知保障不足，Applying the same protection承接同一保障并换成高薪经理。\n\n本段内部继续写道：\n\n> A firm may struggle to remove an executive whose performance is inadequate. Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.\n\n经理难以解除与其水平关系企业成败相连，far more than说明后果超过单个经理位置。\n\n后段G开头是：\n\n> The wider effect can reach the ordinary workers whom the rules were designed to protect.\n\nThe wider effect复现影响扩大，下一段将其具体落实到原本受保护的普通员工。\n\n这三段的推进关系：\n\n> 交代解雇保护的初衷与要求 → 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损\n\n再检验候选B：\n\n> Managers themselves are not necessarily spared these effects.\n\nManagers themselves是之后再谈经理自身也受损，这里先说明企业经营为何受约束，不能跳过更广影响的起点。\n\n**41题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>41题是全文第2段，局部关系为A → D → G。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The original purpose was to correct an imbalance in which contractual notice alone offered too little protection against arbitrary management.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Applying the same protection to highly paid managers can create a different problem.</p>\n</blockquote>\n<p>前段解释原始保护纠正合同通知保障不足，Applying the same protection承接同一保障并换成高薪经理。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A firm may struggle to remove an executive whose performance is inadequate. Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.</p>\n</blockquote>\n<p>经理难以解除与其水平关系企业成败相连，far more than说明后果超过单个经理位置。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The wider effect can reach the ordinary workers whom the rules were designed to protect.</p>\n</blockquote>\n<p>The wider effect复现影响扩大，下一段将其具体落实到原本受保护的普通员工。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>交代解雇保护的初衷与要求 → 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Managers themselves are not necessarily spared these effects.</p>\n</blockquote>\n<p>Managers themselves是之后再谈经理自身也受损，这里先说明企业经营为何受约束，不能跳过更广影响的起点。</p>\n<p><strong>41题选D。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为D → G → E。\n\n先看前段D的结尾：\n\n> Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.\n\n再看G段开头：\n\n> The wider effect can reach the ordinary workers whom the rules were designed to protect.\n\n前段far more than the manager已提出外溢影响，The wider effect承接并将对象确定为普通员工。\n\n本段内部继续写道：\n\n> If poor management weakens the business, their jobs may become less secure. A measure intended as a safeguard can thus produce a paradoxical risk for its original beneficiaries.\n\n管理不佳削弱企业，岗位随之不稳；thus把保护目的与风险结果总结为悖论。\n\n后段E开头是：\n\n> Even where jobs do not disappear, weak managerial performance can hold back productivity and wages.\n\nEven where jobs do not disappear让步接当前岗位风险，再引出即使不失业仍可能生产率和工资受限。\n\n这三段的推进关系：\n\n> 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损 → 把管理问题接到生产率及工资\n\n再检验候选B：\n\n> Managers themselves are not necessarily spared these effects.\n\n直接转Managers themselves会提前跳开普通员工的影响，后句关于jobs不消失的让步也缺少岗位风险这一紧邻前提。\n\n**42题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>42题是全文第3段，局部关系为D → G → E。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The wider effect can reach the ordinary workers whom the rules were designed to protect.</p>\n</blockquote>\n<p>前段far more than the manager已提出外溢影响，The wider effect承接并将对象确定为普通员工。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>If poor management weakens the business, their jobs may become less secure. A measure intended as a safeguard can thus produce a paradoxical risk for its original beneficiaries.</p>\n</blockquote>\n<p>管理不佳削弱企业，岗位随之不稳；thus把保护目的与风险结果总结为悖论。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Even where jobs do not disappear, weak managerial performance can hold back productivity and wages.</p>\n</blockquote>\n<p>Even where jobs do not disappear让步接当前岗位风险，再引出即使不失业仍可能生产率和工资受限。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损 → 把管理问题接到生产率及工资</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Managers themselves are not necessarily spared these effects.</p>\n</blockquote>\n<p>直接转Managers themselves会提前跳开普通员工的影响，后句关于jobs不消失的让步也缺少岗位风险这一紧邻前提。</p>\n<p><strong>42题选G。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → B → F。\n\n先看前段E的结尾：\n\n> Restrictions on replacing underperforming managers therefore also matter for the rewards available to employees.\n\n再看B段开头：\n\n> Managers themselves are not necessarily spared these effects.\n\n前段讨论低绩效经理难替换影响员工回报，Managers themselves把受影响范围再扩至经理本身。\n\n本段内部继续写道：\n\n> When dismissal is costly, employers become more cautious about hiring. Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.\n\n解雇贵使招聘谨慎，then接经理获聘更难；在职保护与进入岗位机会减少可以并存，解释反向作用。\n\n后段F开头是：\n\n> The risks of a failed employment arrangement may also be reflected in lower pay.\n\nlower pay前的also表明在招聘困难之外再加一种风险转移方式，与当前雇佣成本相接。\n\n这三段的推进关系：\n\n> 把管理问题接到生产率及工资 → 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果\n\n再检验候选C：\n\n> One way to adjust that scope is to distinguish employees by income.\n\n按收入调整范围是最后应对方案，此处须先把招聘谨慎说明清楚，才能承接后段薪酬和社会影响。\n\n**43题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>43题是全文第5段，局部关系为E → B → F。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Restrictions on replacing underperforming managers therefore also matter for the rewards available to employees.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Managers themselves are not necessarily spared these effects.</p>\n</blockquote>\n<p>前段讨论低绩效经理难替换影响员工回报，Managers themselves把受影响范围再扩至经理本身。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>When dismissal is costly, employers become more cautious about hiring. Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.</p>\n</blockquote>\n<p>解雇贵使招聘谨慎，then接经理获聘更难；在职保护与进入岗位机会减少可以并存，解释反向作用。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>The risks of a failed employment arrangement may also be reflected in lower pay.</p>\n</blockquote>\n<p>lower pay前的also表明在招聘困难之外再加一种风险转移方式，与当前雇佣成本相接。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把管理问题接到生产率及工资 → 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>One way to adjust that scope is to distinguish employees by income.</p>\n</blockquote>\n<p>按收入调整范围是最后应对方案，此处须先把招聘谨慎说明清楚，才能承接后段薪酬和社会影响。</p>\n<p><strong>43题选B。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为B → F → C。\n\n先看前段B的结尾：\n\n> Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.\n\n再看F段开头：\n\n> The risks of a failed employment arrangement may also be reflected in lower pay.\n\n前段刚说明进入岗位机会受限，lower pay用also再补员工在收入上的不利影响。\n\n本段内部继续写道：\n\n> Beyond individual firms, restrictive rules can hinder productivity growth and prosperity. These consequences suggest that the scope of protection should be examined alongside its intended benefit.\n\nBeyond individual firms从个人企业扩展到社会繁荣；These consequences总结后果，提出应审查保护范围。\n\n后段C开头是：\n\n> One way to adjust that scope is to distinguish employees by income.\n\nthat scope精确回指scope of protection，下一段开始按收入划界的方案。\n\n这三段的推进关系：\n\n> 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护\n\n再检验候选D：\n\n> Applying the same protection to highly paid managers can create a different problem.\n\n把同样保护用于高薪经理的难题是论证开端，此处已由多种后果推进到范围改革，退回开端会让that scope没有近处所指。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>44题是全文第6段，局部关系为B → F → C。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The risks of a failed employment arrangement 不能作为此处已进入的制度方案，也无法与下一段different mechanism形成明确对比。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为F → C → H。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>These consequences suggest that the scope of protection should be examined alongside its intended benefit.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>One way to adjust that scope is to distinguish employees by income.</p>\n</blockquote>\n<p>前段提出审查scope of protection，adjust that scope直接承接，以收入区别员工是具体方向。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Australia excludes those above a specified high-income threshold from its unfair-dismissal protection. This approach gives employers greater room to deal with highly paid staff while retaining a different position for other workers.</p>\n</blockquote>\n<p>澳大利亚门槛界定哪些高薪者不适用相关保护，并说明企业因此有更大处理空间，其他员工保持不同地位。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>New Zealand considered a different mechanism that would allow firms and high-income employees to agree to leave the regime.</p>\n</blockquote>\n<p>New Zealand...different mechanism将国家与机制同时切换，后文合同退出的失败属于新方案。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护 → 区分新西兰合同退出提案的失败</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Applying the same protection to highly paid managers can create a different problem.</p>\n</blockquote>\n<p>泛谈高薪经理造成不同问题会重复前文，不能作为此处已进入的制度方案，也无法与下一段different mechanism形成明确对比。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **fair procedures** | **公平程序** | **社会现象｜社会生活** | **宏观主题** |\n| balanced employment protection | 适度平衡的就业保护 | 社会现象｜社会生活 | 宏观主题 |\n| managerial competence | 管理能力 | 社会现象｜社会生活｜提升竞争力 | 个人主题 |\n| **productive work** | **富有成效的工作** | **人生哲理｜敬业** | **个人主题** |\n| institutional flexibility | 制度灵活性 | 社会现象｜社会生活 | 宏观主题 |\n| shared prosperity | const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. The original protection against unjustified dismissal</strong></p><p><strong>B. Effects on hiring, pay and wider prosperity</strong></p><p><strong>C. A distinction based on income and a failed reform attempt</strong></p><p><strong>D. When protection can put the protected jobs at risk</strong></p><p><strong>E. Low managerial quality as a productivity constraint</strong></p><p><strong>F. Guaranteed higher earnings for every manager</strong></p><p><strong>G. A proposal to remove all protections from all workers</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>The personal grievance provisions of New Zealand&#x27;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way. Personal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal. Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#x27; wages. Indeed, in &quot;An International Perspective on New Zealand&#x27;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#x27;s poor productivity growth record.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#x27;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong. Society also suffers from excessive employment protections. Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#x27; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Employment protection rules were introduced to prevent ordinary workers from being dismissed without good cause. Employers had to justify their decisions and follow fair procedures. The original purpose was to correct an imbalance in which contractual notice alone offered too little protection against arbitrary management.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Managers themselves are not necessarily spared these effects. When dismissal is costly, employers become more cautious about hiring. Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>One way to adjust that scope is to distinguish employees by income. Australia excludes those above a specified high-income threshold from its unfair-dismissal protection. This approach gives employers greater room to deal with highly paid staff while retaining a different position for other workers.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Applying the same protection to highly paid managers can create a different problem. A firm may struggle to remove an executive whose performance is inadequate. Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>Even where jobs do not disappear, weak managerial performance can hold back productivity and wages. A productivity report identified low management capabilities as one cause of poor growth. Restrictions on replacing underperforming managers therefore also matter for the rewards available to employees.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>The risks of a failed employment arrangement may also be reflected in lower pay. Beyond individual firms, restrictive rules can hinder productivity growth and prosperity. These consequences suggest that the scope of protection should be examined alongside its intended benefit.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>The wider effect can reach the ordinary workers whom the rules were designed to protect. If poor management weakens the business, their jobs may become less secure. A measure intended as a safeguard can thus produce a paradoxical risk for its original beneficiaries.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>New Zealand considered a different mechanism that would allow firms and high-income employees to agree to leave the regime. The proposal proved unwieldy and was voted down. Its failure should not be transferred to the Australian threshold, which is a separate approach to the same underlying paradox.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>grievance</td>\n<td>n.申诉</td>\n<td>provisions</td>\n<td>n.条款</td>\n<td>employer</td>\n<td>n.雇主</td>\n</tr>\n<tr>\n<td>employee</td>\n<td>n.雇员</td>\n<td>good cause</td>\n<td>正当理由</td>\n<td>dismissals</td>\n<td>n.解雇</td>\n</tr>\n<tr>\n<td>justified</td>\n<td>adj.有正当理由的</td>\n<td>procedurally fair</td>\n<td>程序公平的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>procedures</td>\n<td>n.程序</td>\n<td>guard</td>\n<td>v.保护</td>\n<td>unjustified</td>\n<td>adj.无正当理由的</td>\n</tr>\n<tr>\n<td>premise</td>\n<td>n.前提</td>\n<td>common law</td>\n<td>普通法</td>\n<td>safeguards</td>\n<td>n.保障</td>\n</tr>\n<tr>\n<td>arbitrary</td>\n<td>adj.任意的</td>\n<td>contractual notice</td>\n<td>合同规定的通知</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋
