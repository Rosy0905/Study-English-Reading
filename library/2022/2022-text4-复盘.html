 members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p><code>beneficial to business owners</code>需要把门槛的做法与企业主受到的影响接起来：第8段的<code>excluding employees</code>说明高收入员工不再受到这类解雇法保护，而前面第5段的<code>constrain business owners</code>已说明同类保护怎样限制企业主，因此回看这两处。</p>\n<p>第8段的<code>excluding employees</code>将收入超过门槛的员工排除在相关解雇法保护之外。第5段已经说明<code>constrain business owners</code>的具体含义：这类保护妨碍企业主解雇表现不佳的经理，并限制生产率。<code>C</code>的<code>beneficial to business owners</code>据此作推断：减少高收入员工在解雇方面的这项保护，会给企业主处理不胜任经理留下更多空间，从而缓解前文指出的企业困难。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal.\nAcross the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n<p>但这些条款用于高薪经理和高管时，会给企业制造困难。无数董事会和企业主可以证明，限制解雇低绩效高收入经理，会拖住生产率与整体表现的提升。差经理与优秀经理的差别，很可能就是企业成败、普通员工岗位保留或失去的差别。但平庸已不足以构成正当解雇理由。</p>\n<p>在塔斯曼海另一侧，澳大利亚将收入超过特定高收入门槛者排除在不公平解雇法保护之外，以处理不当解雇悖论。新西兰2016年一项议员法案则尝试允许企业与高收入员工通过合同约定退出该制度。然而拟议机制笨重难操作，法案在那年稍后政府更替之后被投票否决。</p>\n</blockquote>\n<p>前文说明同样保护用于高薪经理的副作用，末段以澳大利亚门槛展示怎样缩小适用范围。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The threshold is beneficial to business owners.</p>\n<p>澳大利亚高收入门槛有利于企业主。</p>\n</blockquote>\n<p>beneficial在这里指更灵活地处理相应雇佣关系，不是保证企业必然成功，也不是取消普通工人的全部保障。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. is difficult to put into practice</h3>\n<blockquote>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p>unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</p>\n<p>Australia deals with先陈述澳洲安排，In New Zealand随后明确切换国家和提案，However承接的是这个新提案。</p>\n<p>D需要澳洲门槛实施困难的证据。两国机制与状态不同，不能将新西兰提案的复杂性及失败挪给澳洲做法。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n<p>在塔斯曼海另一侧，澳大利亚将收入超过特定高收入门槛者排除在不公平解雇法保护之外，以处理不当解雇悖论。新西兰2016年一项议员法案则尝试允许企业与高收入员工通过合同约定退出该制度。然而拟议机制笨重难操作，法案在那年稍后政府更替之后被投票否决。</p>\n</blockquote>\n<p>Australia deals with先陈述澳洲安排，In New Zealand随后明确切换国家和提案，However承接的是这个新提案。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The threshold is difficult to put into practice.</p>\n<p>澳大利亚高收入门槛难以付诸实践。</p>\n</blockquote>\n<p>D需要澳洲门槛实施困难的证据。两国机制与状态不同，不能将新西兰提案的复杂性及失败挪给澳洲做法。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>40题结论</h3>\n<blockquote>\n<p><strong>40. C</strong></p>\n</blockquote>\n<ul>\n<li>A：收入超过门槛是被排除解雇保护的条件，不是法律承诺保障的结果。A把分类依据变成收入保证。</li>\n<li>B：deals with说澳大利亚门槛用于处理前文悖论，原文未列其实施后产生不良结果；新西兰法案被否决也不属于澳洲后果。</li>\n<li>C：高收入者不再享有这项解雇保护，可缓解企业难以处理低绩效高薪经理的约束，C由全文经营问题作出有利推断。</li>\n<li>D：unwieldy说的是新西兰合同退出机制笨重难操作，且该提案被否决；澳洲收入门槛是已经用来处理问题的另一机制。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：ERA法律的基本内容与初衷</strong>（段落1-2法律介绍） 法律内容：【ERA个人申诉条款：阻止无正当理由解雇 → 要求程序公正】→ 设计初衷：保护普通工人免受不正当解雇（因合同法保护不足）</p>\n<p>↓（问题出现）</p>\n<p><strong>逻辑层次2：法律应用于高管的困境</strong>（段落3具体问题） 应用困难：【限制解雇表现不佳的高薪经理 → 成为提升生产力的&quot;手刹&quot;】→ 管理质量的重要性：（C级vs A级经理 = 企业成败）→ 矛盾：平庸不足以成为解雇理由</p>\n<p>↓（悖论显现）</p>\n<p><strong>逻辑层次3：保护法的悖论效应</strong>（段落4-5负面影响） 核心悖论：保护普通工人的法律反而使其工作处于风险 → 具体影响：【限制解雇低效经理 → 限制公司生产力 → 限制工人工资】→ 权威支持：生产力委员会指出管理能力低下是生产力增长差的原因</p>\n<p>↓（影响扩大）</p>\n<p><strong>逻辑层次4：多方受害的连锁反应</strong>（段落6-7广泛影响） 对高薪经理的伤害：（解雇成本高 → 雇主谨慎雇用 → 边缘经理难就业 + 薪酬降低）→ 对社会的伤害：（过度保护 → 阻碍生产力增长 + 损害繁荣和福祉）</p>\n<p>↓（解决方案）</p>\n<p><strong>逻辑层次5：国际经验与本地尝试</strong>（段落8解决尝试） 澳大利亚方案：高收入门槛以上员工不受保护 // 新西兰尝试：2016年法案允许高收入者退出（但机制笨重+被否决）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：原本为保护普通工人而设计的ERA不正当解雇条款，在应用于高薪管理层时产生了悖论效应——不仅阻碍了企业发展和生产力提升，反而可能危及其原本要保护的普通工人的工作。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. The original protection against unjustified dismissal</p>\n<p>B. Effects on hiring, pay and wider prosperity</p>\n<p>C. A distinction based on income and a failed reform attempt</p>\n<p>D. When protection can put the protected jobs at risk</p>\n<p>E. Low managerial quality as a productivity constraint</p>\n<p>F. Guaranteed higher earnings for every manager</p>\n<p>G. A proposal to remove all protections from all workers</p>\n<p><strong>41.</strong></p>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a procedurally fair way. Personal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;. The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management. Long gone are the days when a boss could simply give an employee contractual notice.</p>\n<p><strong>42.</strong></p>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet mediocrity is no longer enough to justify a dismissal. Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p><strong>43.</strong></p>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages. Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n<p><strong>44.</strong></p>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the marginal manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong. Society also suffers from excessive employment protections. Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p>\n<p><strong>45.</strong></p>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime. However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】A. The original protection against unjustified dismissal</p>\n<blockquote>\n<p>最初防止无正当理由解雇的保护</p>\n</blockquote>\n<p>条款要求解雇有正当原因并遵守公平程序，原始目的在保护普通工人免于管理层任意行为。</p>\n<blockquote>\n<p>The personal grievance provisions of New Zealand&#39;s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.</p>\n</blockquote>\n<p>prevent...without good cause明确限制无理由解雇，公平程序是雇主同时必须遵守的要求。</p>\n<blockquote>\n<p>Personal grievance procedures were designed to guard the jobs of ordinary workers from &quot;unjustified dismissals&quot;.</p>\n</blockquote>\n<p>designed to直接给出初衷：普通合同保障不足，故要保护普通工人岗位。</p>\n<blockquote>\n<p>Long gone are the days when a boss could simply give an employee contractual notice.</p>\n</blockquote>\n<p>只给合同通知即可解雇的时代结束，说明保障增加；标题需落在原始保护目的，不提前混入后文副作用。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>普通合同保障不足 → 解雇须有正当理由及公平程序 → 保护普通员工岗位</p>\n</blockquote>\n<p>original protection对应designed to guard，unjustified dismissal是针对的具体风险。</p>\n<p>再看最强干扰项G：A proposal to remove all protections from all workers。</p>\n<p>这里只讲为何建立保护，不是要求取消所有保护。</p>\n<p><strong>41题选A。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. When protection can put the protected jobs at risk</p>\n<blockquote>\n<p>保护反而可能危及被保护岗位</p>\n</blockquote>\n<p>应用到高薪经理时，难解雇表现不佳者会影响企业成败，进而反使普通岗位面临风险。</p>\n<blockquote>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives.</p>\n</blockquote>\n<p>But切换适用对象为高薪经理，原本保护条款在此可能成为企业难题。</p>\n<blockquote>\n<p>Between preserving the jobs of ordinary workers or losing them.</p>\n</blockquote>\n<p>普通岗位保住或失去是经理质量影响企业成败的进一步后果，说明经理任职并非只关系本人。</p>\n<blockquote>\n<p>Consequently – and paradoxically – laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n</blockquote>\n<p>Consequently与paradoxically将保护初衷和反向风险相接，标题要突出保护反而可能危及原受益者。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>低绩效经理难解雇 → 企业表现与成败受影响 → 普通工人岗位反受威胁</p>\n</blockquote>\n<p>when protection ... at risk概括第三段的经营链条与第四段的悖论总结。</p>\n<p>再看最强干扰项F：Guaranteed higher earnings for every manager。</p>\n<p>讨论经理差异怎样影响企业，不是保证经理收入增加。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】E. Low managerial quality as a productivity constraint</p>\n<blockquote>\n<p>管理质量低下作为生产率约束</p>\n</blockquote>\n<p>就算不直接危及岗位，经理难以替换也约束生产率和工资；委员会报告把管理能力低下列为原因。</p>\n<blockquote>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#39; wages.</p>\n</blockquote>\n<p>If not placing jobs at risk让步后仍强调工资与生产率代价，限制解雇经理是起点。</p>\n<blockquote>\n<p>Indeed, in &quot;An International Perspective on New Zealand&#39;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country&#39;s poor productivity growth record.</p>\n</blockquote>\n<p>Indeed引委员会报告作支持，管理能力低被认作生产率增长不佳的一项原因。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>替换低绩效经理受限 → 生产率受约束 → 工资受影响，报告支持管理质量重要</p>\n</blockquote>\n<p>managerial quality直接对应low quality of managerial capabilities，constraint保留其负面作用。</p>\n<p>再看最强干扰项B：Effects on hiring, pay and wider prosperity。</p>\n<p>B是更广的招聘和社会影响，本段集中于管理能力和生产率。</p>\n<p><strong>43题选E。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】B. Effects on hiring, pay and wider prosperity</p>\n<blockquote>\n<p>对招聘、工资和社会繁荣的影响</p>\n</blockquote>\n<p>解雇成本高使雇主招聘谨慎、边缘经理求职更难，风险也反映到薪酬；社会繁荣与福祉同样受影响。</p>\n<blockquote>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA&#39;s unjustified dismissal procedures.</p>\n</blockquote>\n<p>Nor...immune把影响扩大到高薪经理自身，随后通过解雇成本和谨慎招聘说明求职入口受限。</p>\n<blockquote>\n<p>And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n</blockquote>\n<p>企业少付薪酬是风险负担的另一反应，不能自行补成已发布针对全部在职员工的降薪通知。</p>\n<blockquote>\n<p>Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.</p>\n</blockquote>\n<p>社会生产率、繁荣与福祉进一步扩展影响层级，标题应覆盖招聘、薪酬及社会后果。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>解雇成本高 → 招聘谨慎及薪酬压低 → 社会繁荣福祉受阻</p>\n</blockquote>\n<p>effects覆盖雇员、经理和社会三层后果，未把保护写成只让某一方受害。</p>\n<p>再看最强干扰项F：Guaranteed higher earnings for every manager。</p>\n<p>firms pay staff less与保证更高收入相反。</p>\n<p><strong>44题选B。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】C. A distinction based on income and a failed reform attempt</p>\n<blockquote>\n<p>按收入区分保护与未成功的改革尝试</p>\n</blockquote>\n<p>澳大利亚以高收入门槛排除部分保护，新西兰尝试合同退出却因机制复杂等因素未获通过。</p>\n<blockquote>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its unfair dismissal laws.</p>\n</blockquote>\n<p>Australia以收入门槛排除部分保护，是处理悖论的一种已述做法。</p>\n<blockquote>\n<p>In New Zealand, a 2016 private members&#39; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.</p>\n</blockquote>\n<p>In New Zealand切换到另一国和另一机制：允许高收入员工与企业以合同退出。</p>\n<blockquote>\n<p>However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.</p>\n</blockquote>\n<p>However承接新西兰提案，说明机制难操作且政府更替后被否决，不能把这个结局移到澳洲。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>澳洲按收入界定保护范围 → 新西兰拟采用合同退出 → 后者机制难操作且法案被否决</p>\n</blockquote>\n<p>distinction based on income与failed attempt对应两国不同安排，不能互换成败。</p>\n<p>再看最强干扰项G：A proposal to remove all protections from all workers。</p>\n<p>都是针对高收入群体的区别安排，并非取消普通工人的全部保护。</p>\n<p><strong>45题选C。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Employment protection rules were introduced to prevent ordinary workers from being dismissed without good cause. Employers had to justify their decisions and follow fair procedures. The original purpose was to correct an imbalance in which contractual notice alone offered too little protection against arbitrary management.</p>\n<p><strong>B.</strong></p>\n<p>Managers themselves are not necessarily spared these effects. When dismissal is costly, employers become more cautious about hiring. Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.</p>\n<p><strong>C.</strong></p>\n<p>One way to adjust that scope is to distinguish employees by income. Australia excludes those above a specified high-income threshold from its unfair-dismissal protection. This approach gives employers greater room to deal with highly paid staff while retaining a different position for other workers.</p>\n<p><strong>D.</strong></p>\n<p>Applying the same protection to highly paid managers can create a different problem. A firm may struggle to remove an executive whose performance is inadequate. Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.</p>\n<p><strong>E.</strong></p>\n<p>Even where jobs do not disappear, weak managerial performance can hold back productivity and wages. A productivity report identified low management capabilities as one cause of poor growth. Restrictions on replacing underperforming managers therefore also matter for the rewards available to employees.</p>\n<p><strong>F.</strong></p>\n<p>The risks of a failed employment arrangement may also be reflected in lower pay. Beyond individual firms, restrictive rules can hinder productivity growth and prosperity. These consequences suggest that the scope of protection should be examined alongside its intended benefit.</p>\n<p><strong>G.</strong></p>\n<p>The wider effect can reach the ordinary workers whom the rules were designed to protect. If poor management weakens the business, their jobs may become less secure. A measure intended as a safeguard can thus produce a paradoxical risk for its original beneficiaries.</p>\n<p><strong>H.</strong></p>\n<p>New Zealand considered a different mechanism that would allow firms and high-income employees to agree to leave the regime. The proposal proved unwieldy and was voted down. Its failure should not be transferred to the Australian threshold, which is a separate approach to the same underlying paradox.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>交代解雇保护的初衷与要求</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明解雇成本提高带来的招聘谨慎</td>\n</tr>\n<tr>\n<td>C</td>\n<td>介绍澳大利亚按高收入门槛划分保护</td>\n</tr>\n<tr>\n<td>D</td>\n<td>转出高薪经理受到保护时的经营难题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>把管理问题接到生产率及工资</td>\n</tr>\n<tr>\n<td>F</td>\n<td>拓展到薪酬与社会福祉后果</td>\n</tr>\n<tr>\n<td>G</td>\n<td>说明保护可能反使普通岗位受损</td>\n</tr>\n<tr>\n<td>H</td>\n<td>区分新西兰合同退出提案的失败</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>交代解雇保护的初衷与要求 → 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损 → 把管理问题接到生产率及工资 → 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护 → 区分新西兰合同退出提案的失败</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → G → E → B → F → C → H</strong></p>\n<p>41—45：D、G、B、F、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → D → G。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The original purpose was to correct an imbalance in which contractual notice alone offered too little protection against arbitrary management.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Applying the same protection to highly paid managers can create a different problem.</p>\n</blockquote>\n<p>前段解释原始保护纠正合同通知保障不足，Applying the same protection承接同一保障并换成高薪经理。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A firm may struggle to remove an executive whose performance is inadequate. Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.</p>\n</blockquote>\n<p>经理难以解除与其水平关系企业成败相连，far more than说明后果超过单个经理位置。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The wider effect can reach the ordinary workers whom the rules were designed to protect.</p>\n</blockquote>\n<p>The wider effect复现影响扩大，下一段将其具体落实到原本受保护的普通员工。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>交代解雇保护的初衷与要求 → 转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Managers themselves are not necessarily spared these effects.</p>\n</blockquote>\n<p>Managers themselves是之后再谈经理自身也受损，这里先说明企业经营为何受约束，不能跳过更广影响的起点。</p>\n<p><strong>41题选D。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为D → G → E。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>Because management quality can determine business success, this restriction can affect far more than the position of the manager concerned.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The wider effect can reach the ordinary workers whom the rules were designed to protect.</p>\n</blockquote>\n<p>前段far more than the manager已提出外溢影响，The wider effect承接并将对象确定为普通员工。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>If poor management weakens the business, their jobs may become less secure. A measure intended as a safeguard can thus produce a paradoxical risk for its original beneficiaries.</p>\n</blockquote>\n<p>管理不佳削弱企业，岗位随之不稳；thus把保护目的与风险结果总结为悖论。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Even where jobs do not disappear, weak managerial performance can hold back productivity and wages.</p>\n</blockquote>\n<p>Even where jobs do not disappear让步接当前岗位风险，再引出即使不失业仍可能生产率和工资受限。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转出高薪经理受到保护时的经营难题 → 说明保护可能反使普通岗位受损 → 把管理问题接到生产率及工资</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Managers themselves are not necessarily spared these effects.</p>\n</blockquote>\n<p>直接转Managers themselves会提前跳开普通员工的影响，后句关于jobs不消失的让步也缺少岗位风险这一紧邻前提。</p>\n<p><strong>42题选G。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → B → F。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Restrictions on replacing underperforming managers therefore also matter for the rewards available to employees.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Managers themselves are not necessarily spared these effects.</p>\n</blockquote>\n<p>前段讨论低绩效经理难替换影响员工回报，Managers themselves把受影响范围再扩至经理本身。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>When dismissal is costly, employers become more cautious about hiring. Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.</p>\n</blockquote>\n<p>解雇贵使招聘谨慎，then接经理获聘更难；在职保护与进入岗位机会减少可以并存，解释反向作用。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>The risks of a failed employment arrangement may also be reflected in lower pay.</p>\n</blockquote>\n<p>lower pay前的also表明在招聘困难之外再加一种风险转移方式，与当前雇佣成本相接。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把管理问题接到生产率及工资 → 说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>One way to adjust that scope is to distinguish employees by income.</p>\n</blockquote>\n<p>按收入调整范围是最后应对方案，此处须先把招聘谨慎说明清楚，才能承接后段薪酬和社会影响。</p>\n<p><strong>43题选B。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为B → F → C。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Applicants at the margin then find it harder to obtain a position, so stronger protection for an existing job can coexist with fewer opportunities to enter one.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The risks of a failed employment arrangement may also be reflected in lower pay.</p>\n</blockquote>\n<p>前段刚说明进入岗位机会受限，lower pay用also再补员工在收入上的不利影响。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Beyond individual firms, restrictive rules can hinder productivity growth and prosperity. These consequences suggest that the scope of protection should be examined alongside its intended benefit.</p>\n</blockquote>\n<p>Beyond individual firms从个人企业扩展到社会繁荣；These consequences总结后果，提出应审查保护范围。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>One way to adjust that scope is to distinguish employees by income.</p>\n</blockquote>\n<p>that scope精确回指scope of protection，下一段开始按收入划界的方案。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明解雇成本提高带来的招聘谨慎 → 拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Applying the same protection to highly paid managers can create a different problem.</p>\n</blockquote>\n<p>把同样保护用于高薪经理的难题是论证开端，此处已由多种后果推进到范围改革，退回开端会让that scope没有近处所指。</p>\n<p><strong>44题选F。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为F → C → H。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>These consequences suggest that the scope of protection should be examined alongside its intended benefit.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>One way to adjust that scope is to distinguish employees by income.</p>\n</blockquote>\n<p>前段提出审查scope of protection，adjust that scope直接承接，以收入区别员工是具体方向。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Australia excludes those above a specified high-income threshold from its unfair-dismissal protection. This approach gives employers greater room to deal with highly paid staff while retaining a different position for other workers.</p>\n</blockquote>\n<p>澳大利亚门槛界定哪些高薪者不适用相关保护，并说明企业因此有更大处理空间，其他员工保持不同地位。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>New Zealand considered a different mechanism that would allow firms and high-income employees to agree to leave the regime.</p>\n</blockquote>\n<p>New Zealand...different mechanism将国家与机制同时切换，后文合同退出的失败属于新方案。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>拓展到薪酬与社会福祉后果 → 介绍澳大利亚按高收入门槛划分保护 → 区分新西兰合同退出提案的失败</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Applying the same protection to highly paid managers can create a different problem.</p>\n</blockquote>\n<p>泛谈高薪经理造成不同问题会重复前文，不能作为此处已进入的制度方案，也无法与下一段different mechanism形成明确对比。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n
