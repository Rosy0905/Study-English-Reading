物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。\n\n材料变化先产生保存问题，随后多种实例扩展问题范围，没有另起分类任务。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Museums face difficulties in classifying their plastic collections.\n>\n> 博物馆面临的困难在于给塑料藏品分类。\n\nD需要归类标准或类别辨认上的困难。列出多种藏品只能说明问题广泛，不能把列举形式改成分类障碍。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,463,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>博物馆面临的困难在于给塑料藏品分类。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>variety说明面临风险的物品种类多，headaches却直接连到preserve，未说博物馆不知道怎样给藏品分类。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆面临的困难在于给塑料藏品分类。</p>\n</blockquote>\n<p><code>classifying</code>指分类，第1段末尾的<code>The variety of plastic objects</code>确实引出不同种类的物品；要判断是否在说分类困难，还要回看前一句把<code>huge headaches</code>接到<code>preserve</code>上的表述。</p>\n<p>原文的<code>The variety of plastic objects</code>引出面临风险的物品种类，列举的作用是说明保存问题涉及哪些物品；前一句已经把困扰连到<code>preserve</code>这项保存工作。本项的<code>classifying</code>则说博物馆分不清这些藏品应归到哪一类。物品涉及不同类别，并不等于分类本身出现困难；它把物品清单与博物馆困难接成了原文没有建立的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n</blockquote>\n<p>材料变化先产生保存问题，随后多种实例扩展问题范围，没有另起分类任务。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums face difficulties in classifying their plastic collections.</p>\n<p>博物馆面临的困难在于给塑料藏品分类。</p>\n</blockquote>\n<p>D需要归类标准或类别辨认上的困难。列出多种藏品只能说明问题广泛，不能把列举形式改成分类障碍。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. A**\n\n- A：塑料开裂、渗出添加剂或化成黏浆，都使保存文化物品困难。maintaining their plastic items对应博物馆的preserve工作。\n- B：原文说已经需要保存的物品会变坏，B却说难以取得耐用艺术品，把保存阶段换成获取阶段。\n- C：outdated指过时，change over time指材料变化。年代早的收音机仍有文化意义，不能因此当作落伍展品来处理。\n- D：variety说明面临风险的物品种类多，headaches却直接连到preserve，未说博物馆不知道怎样给藏品分类。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,463,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"21","questionConclusion":true},"html":"<blockquote>\n<p><strong>21. A</strong></p>\n</blockquote>\n<ul>\n<li>A：塑料开裂、渗出添加剂或化成黏浆，都使保存文化物品困难。maintaining their plastic items对应博物馆的preserve工作。</li>\n<li>B：原文说已经需要保存的物品会变坏，B却说难以取得耐用艺术品，把保存阶段换成获取阶段。</li>\n<li>C：outdated指过时，change over time指材料变化。年代早的收音机仍有文化意义，不能因此当作落伍展品来处理。</li>\n<li>D：variety说明面临风险的物品种类多，headaches却直接连到preserve，未说博物馆不知道怎样给藏品分类。</li>\n</ul>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> Van Oosten believes that certain plastic objects are ______.\n>\n> 范·奥斯滕认为，某些塑料物品是______。\n\n### 题型\n\n人物观点题：用配料说明及定时炸弹比喻判断某些成品已有的隐患。\n\n题干点名Van Oosten，并问certain plastic objects。第2段以Certain artifacts开头，随后给出她对这些物品及制作过程的说明，因此整段读第2段。\n\n### 核心出处\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly\n>\n> The object you make is already a time bomb.\n>\n> some pioneers in plastic art didn’t always know how to mix ingredients properly","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"22","questionIntro":true},"html":"<blockquote>\n<p>Van Oosten believes that certain plastic objects are ______.</p>\n<p>范·奥斯滕认为，某些塑料物品是______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点题：用配料说明及定时炸弹比喻判断某些成品已有的隐患。</p>\n<p>题干点名Van Oosten，并问certain plastic objects。第2段以Certain artifacts开头，随后给出她对这些物品及制作过程的说明，因此整段读第2段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n<p>The object you make is already a time bomb.</p>\n<p>some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n</blockquote>\n"},{"title":"A. immune to decay","raw":"### A. immune to decay\n\n> Van Oosten认为某些塑料物品不会腐坏。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nespecially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。\n\n**出处：**\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>especially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. immune to decay","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Van Oosten认为某些塑料物品不会腐坏。\n\n`immune to decay`表示不受腐坏影响，而第2段用`especially vulnerable`评价`certain artifacts`，因此回看这句及其关于配料的解释。\n\n原文先把这些艺术品说成`especially vulnerable`，说明它们尤其容易受损，再以配料不当解释其原因，并把做出的物品比作定时炸弹。本项的`immune to decay`却说这类物品能免受腐坏。一个是作品成形时就埋下损坏隐患，一个是不会受到腐坏影响，评价方向相反。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>especially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><code>immune to decay</code>表示不受腐坏影响，而第2段用<code>especially vulnerable</code>评价<code>certain artifacts</code>，因此回看这句及其关于配料的解释。</p>\n<p>原文先把这些艺术品说成<code>especially vulnerable</code>，说明它们尤其容易受损，再以配料不当解释其原因，并把做出的物品比作定时炸弹。本项的<code>immune to decay</code>却说这类物品能免受腐坏。一个是作品成形时就埋下损坏隐患，一个是不会受到腐坏影响，评价方向相反。</p>\n</section>"},{"title":"A. immune to decay","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"\n>\n> 聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。\n\n配料方法不当先解释脆弱，再借蛋糕用量类比说明制作时就可能埋下失败因素。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Certain plastic objects are immune to decay.\n>\n> Van Oosten认为某些塑料物品不会腐坏。\n\nA需要作品不受劣化影响的保证。原文反而强调随作品一起形成的风险，并不是称赞这些物品耐久。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>especially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><code>immune to decay</code>表示不受腐坏影响，而第2段用<code>especially vulnerable</code>评价<code>certain artifacts</code>，因此回看这句及其关于配料的解释。</p>\n<p>原文先把这些艺术品说成<code>especially vulnerable</code>，说明它们尤其容易受损，再以配料不当解释其原因，并把做出的物品比作定时炸弹。本项的<code>immune to decay</code>却说这类物品能免受腐坏。一个是作品成形时就埋下损坏隐患，一个是不会受到腐坏影响，评价方向相反。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n</blockquote>\n<p>配料方法不当先解释脆弱，再借蛋糕用量类比说明制作时就可能埋下失败因素。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Certain plastic objects are immune to decay.</p>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p>A需要作品不受劣化影响的保证。原文反而强调随作品一起形成的风险，并不是称赞这些物品耐久。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. improperly shaped","raw":"### B. improperly shaped\n\n> Van Oosten认为某些塑料物品形状制作不当。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\nimproperly shaped说外形制作不当，原文mix ingredients和exact amounts谈原料混合与用量，问题所在环节不同。\n\n**出处：**\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-B-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品形状制作不当。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>improperly shaped说外形制作不当，原文mix ingredients和exact amounts谈原料混合与用量，问题所在环节不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section>"},{"title":"B. improperly shaped","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Van Oosten认为某些塑料物品形状制作不当。\n\n`improperly shaped`谈的是物品成形后的形状，第2段的`mix ingredients properly`则谈制作中的原料混合；两者都涉及制作，因此回到她解释脆弱原因的第一句核对具体步骤。\n\n原文把问题放在`mix ingredients properly`，即如何恰当混合原料；烤蛋糕的类比进一步强调`exact amounts`，用量需要准确。本项的`improperly shaped`把问题移到了物品的形状上。配料方法和用量不当导致物品脆弱，并不能改写成物品的外形制作有误。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-B-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品形状制作不当。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>improperly shaped说外形制作不当，原文mix ingredients和exact amounts谈原料混合与用量，问题所在环节不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品形状制作不当。</p>\n</blockquote>\n<p><code>improperly shaped</code>谈的是物品成形后的形状，第2段的<code>mix ingredients properly</code>则谈制作中的原料混合；两者都涉及制作，因此回到她解释脆弱原因的第一句核对具体步骤。</p>\n<p>原文把问题放在<code>mix ingredients properly</code>，即如何恰当混合原料；烤蛋糕的类比进一步强调<code>exact amounts</code>，用量需要准确。本项的<code>improperly shaped</code>把问题移到了物品的形状上。配料方法和用量不当导致物品脆弱，并不能改写成物品的外形制作有误。</p>\n</section>"},{"title":"B. improperly shaped","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"\n>\n> 聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。\n\n化学家以烘焙作类比，关键不是蛋糕造型，而是比例不准会使制作结果出问题。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Certain plastic objects are improperly shaped.\n>\n> Van Oosten认为某些塑料物品形状制作不当。\n\nB需要形状不合要求的说明。配料比例影响材料稳定性，不能仅因都在制作中发生就改成外形错误。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-B-2","html":"<section class=\"revea mounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section>"},{"title":"C. inherently flawed","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> Van Oosten认为某些塑料物品本身已有缺陷。\n\n`inherently flawed`强调物品自身已经带有问题，第2段的`already a time bomb`把隐患放在物品刚做出来的时候，因此回看她关于配料的说明和最后这句比喻。\n\n原文先说明有些创作者不会恰当配料，随后说做出的物品`already a time bomb`，意味着隐患已经随制作结果留在物品之中。本项的`inherently flawed`说的是这些物品自身带有缺陷，可以概括这种在作品成形时就形成的脆弱性；它没有把缺陷扩大成所有塑料物品都必然具有。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-C-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品本身已有缺陷。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>物品做出来时already a time bomb，说明脆弱隐患已在成品内部。inherently flawed概括这些特定物品自带缺陷。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品本身已有缺陷。</p>\n</blockquote>\n<p><code>inherently flawed</code>强调物品自身已经带有问题，第2段的<code>already a time bomb</code>把隐患放在物品刚做出来的时候，因此回看她关于配料的说明和最后这句比喻。</p>\n<p>原文先说明有些创作者不会恰当配料，随后说做出的物品<code>already a time bomb</code>，意味着隐患已经 a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>配料需要准确不等于成品结构复杂。作者解释的是原料比例失当导致脆弱，未评价内部结构的复杂程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section>"},{"title":"D. complex in structure","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Van Oosten认为某些塑料物品结构复杂。\n\n`complex in structure`是在评价成品结构，第2段提到`mix ingredients properly`和`exact amounts`，涉及原料与用量，因此回看这两处，看她是否把制作问题归于结构复杂。\n\n原文说创作者不总是懂得恰当配料，并以`exact amounts`说明用量不准确会出问题。它建立的是配料方法不当与物品脆弱的关系。本项的`complex in structure`却把物品概括成结构复杂；需要精确用量说明制作有要求，不能据此把成品内部的结构评价为复杂。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D" 合方法推进到用量不准，最后说明制成物有隐患，整条因果都围绕配制质量。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Certain plastic objects are complex in structure.\n>\n> Van Oosten认为某些塑料物品结构复杂。\n\nD需要构造层级或结构复杂性的证据。制造需要精确与结构复杂可以相关，但原文没有建立此项关系。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>配料需要准确不等于成品结构复杂。作者解释的是原料比例失当导致脆弱，未评价内部结构的复杂程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p><code>complex in structure</code>是在评价成品结构，第2段提到<code>mix ingredients properly</code>和<code>exact amounts</code>，涉及原料与用量，因此回看这两处，看她是否把制作问题归于结构复杂。</p>\n<p>原文说创作者不总是懂得恰当配料，并以<code>exact amounts</code>说明用量不准确会出问题。它建立的是配料方法不当与物品脆弱的关系。本项的<code>complex in structure</code>却把物品概括成结构复杂；需要精确用量说明制作有要求，不能据此把成品内部的结构评价为复杂。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n</blockquote>\n<p>类比从混合方法推进到用量不准，最后说明制成物有隐患，整条因果都围绕配制质量。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Certain plastic objects are complex in structure.</p>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p>D需要构造层级或结构复杂性的证据。制造需要精确与结构复杂可以相关，但原文没有建立此项关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. C**\n\n- A：especially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。\n- B：improperly shaped说外形制作不当，原文mix ingredients和exact amounts谈原料混合与用量，问题所在环节不同。\n- C：物品做出来时already a time bomb，说明脆弱隐患已在成品内部。inherently flawed概括这些特定物品自带缺陷。\n- D：配料需要准确不等于成品结构复杂。作者解释的是原料比例失当导致脆弱，未评价内部结构的复杂程度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,778,1344,316],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"22","questionConclusion":true},"html":"<blockquote>\n<p><strong>22. C</strong></p>\n</blockquote>\n<ul>\n<li>A：especially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。</li>\n<li>B：improperly shaped说外形制作不当，原文mix ingredients和exact amounts谈原料混合与用量，问题所在环节不同。</li>\n<li>C：物品做出来时already a time bomb，说明脆弱隐患已在成品内部。inherently flawed概括这些特定物品自带缺陷。</li>\n<li>D：配料需要准确不等于成品结构复杂。作者解释的是原料比例失当导致脆弱，未评价内部结构的复杂程度。</li>\n</ul>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> Museums stopped exhibiting some of Gilardi’s artworks to ______.\n>\n> 博物馆停止展出吉拉尔迪的部分艺术品，是为了______。\n\n### 题型\n\n行动目的题：沿光照损伤到暗处存放，核对谁受损、采取什么保护。\n\n题干点名Gilardi’s artworks，并问Museums stopped exhibiting的目的。第3段介绍吉拉尔迪及其作品，第4段接着写Museums locked some of them away in the dark。把这两个相邻自然段完整读完，看作品原先的用途和后来被收起的缘由。\n\n### 核心出处\n\n> He wanted viewers to walk around on the carpets—which meant they had to be durable.\n>\n> It’s especially vulnerable to light damage\n>\n> Museums locked some of them away in the dark.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"23","questionIntro":true},"html":"<blockquote>\n<p>Museums stopped exhibiting some of Gilardi’s artworks to ______.</p>\n<p>博物馆停止展出吉拉尔迪的部分艺术品，是为了______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>行动目的题：沿光照损伤到暗处存放，核对谁受损、采取什么保护。</p>\n<p>题干点名Gilardi’s artworks，并问Museums stopped exhibiting的目的。第3段介绍吉拉尔迪及其作品，第4段接着写Museums locked some of them away in the dark。把这两个相邻自然段完整读完，看作品原先的用途和后来被收起的缘由。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n<p>It’s especially vulnerable to light damage</p>\n<p>Museums locked some of them away in the dark.</p>\n</blockquote>\n"},{"title":"A. keep them from hurting visitors","raw":"### A. keep them from hurting visitors\n\n> 博物馆撤下部分Gilardi作品是为了防止作品伤害观众。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。\n\n**出处：**\n\n> And sometimes, it's not the artist's fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\" —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> Unfortunately, the polyurethane foam he used is inherently unstable. It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section>"},{"title":"A. keep them from hurting visitors","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 博物馆撤下部分Gilardi作品是为了防止作品伤害观众。\n\n`hurting visitors`中的参观者能接到第3段的`viewers`，但伤害说法还需要核对谁受到损伤；因此连着看观众走上地毯的设想，以及第4段`vulnerable to light damage`之后的收起作品动作。\n\n第3段说艺术家希望`viewers`在地毯上走动，所以作品必须耐用。第4段的`vulnerable to light damage`则把受损对象放在泡沫材料上，之后博物馆将作品收在暗处。\n\n本项的`hurting visitors`把受损对象换成观众，并把作品变成伤害人的来源。\n\n原文从光照损伤接到避光存放，说明的是作品自身的处境，不是观众受到伤害。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p><code>hurting visitors</code>中的参观者能接到第3段的<code>viewers</code>，但伤害说法还需要核对谁受到损伤；因此连着看观众走上地毯的设想，以及第4段<code>vulnerable to light damage</code>之后的收起作品动作。</p>\n<p>第3段说艺术家希望<code>viewers</code>在地毯上走动，所以作品必须耐用。第4段的<code>vulnerable to light damage</code>则把受损对象放在泡沫材料上，之后博物馆将作品收在暗处。</p>\n<p>本项的<code>hurting visitors</code>把受损对象换成观众，并把作品变成伤害人的来源。</p>\n<p>原文从光照损伤接到避光存放，说明的是作品自身的处境，不是观众受到伤害。</p>\n</section>"},{"title":"A. keep them from hurting visitors","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> And sometimes, it's not the artist's fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\" —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> Unfortunately, the polyurethane foam he used is inherently unstable. It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.\n>\n> 有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。\n>\n> 遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。\n\n艺术家希望作品耐用，实际材料对光脆弱并已碎坏，博物馆于是将部分作品收在暗处。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Museums stopped displaying the artworks to keep them from hurting visitors.\n>\n> 博物馆撤下部分Gilardi作品是为了防止作品伤害观众。\n\nA需要作品伤人风险来解释撤展。原文的dark直接回应light damage，目的在保护作品，而非保护人免遭作品伤害。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p><code>hurting visitors</code>中的参观者能接到第3段的<code>viewers</code>，但伤害说法还需要核对谁受到损伤；因此连着看观众走上地毯的设想，以及第4段<code>vulnerable to light damage</code>之后的收起作品动作。</p>\n<p>第3段说艺术家希望<code>viewers</code>在地毯上走动，所以作品必须耐用。第4段的<code>vulnerable to light damage</code>则把受损对象放在泡沫材料上，之后博物馆将作品收在暗处。</p>\n<p>本项的<code>hurting visitors</code>把受损对象换成观众，并把作品变成伤害人的来源。</p>\n<p>原文从光照损伤接到避光存放，说明的是作品自身的处境，不是观众受到伤害。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p>有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。</p>\n<p>遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。</p>\n</blockquote>\n<p>艺术家希望作品耐用，实际材料对光脆弱并已碎坏，博物馆于是将部分作品收在暗处。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums stopped displaying the artworks to keep them from hurting visitors.</p>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p>A需要作品伤人风险来解释撤展。原文的dark直接回应light damage，目的在保护作品，而非保护人免遭作品伤害。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. duplicate them for future display","raw":"### B. duplicate them for future display\n\n> 博物馆撤下部分Gilardi作品是为了复制作品供日后展出。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。\n\n**出处：**\n\n> And sometimes, it's not the artist's fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\" —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> Unfortunately, the polyurethane foam he used is inherently unstable. It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section>"},{"title":"B. duplicate them for future display","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 博物馆撤下部分Gilardi作品是为了复制作品供日后展出。\n\n`duplicate`指制作复制品，需要核对第4段`Museums locked some of them away in the dark`所写的博物馆行动，看其中是否包含复制安排。\n\n原文先说材料容易受到光照损伤，随后说博物馆把部分作品`locked some of them away in the dark`，行动是收起原作并置于暗处。本项的`duplicate them for future display`则增加了制作复制品、安排未来展出的连续计划。把原作收在暗处针对的是光照问题，不能改接成制作另一些作品的工序。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><code>duplicate</code>指制作复制品，需要核对第4段<code>Museums locked some of them away in the dark</code>所写的博物馆行动，看其中是否包含复制安排。</p>\n<p>原文先说材料容易受到光照损伤，随后说博物馆把部分作品<code>locked some of them away in the dark</code>，行动是收起原作并置于暗处。本项的<code>duplicate them for future display</code>则增加了制作复制品、安排未来展出的连续计划。把原作收在暗处针对的是光照问题，不能改接成制作另一些作品的工序。</p>\n</section>"},{"title":"B. duplicate them for future display","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> And sometimes, it's not the artist's fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\" —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> Unfortunately, the polyurethane foam he used is inherently unstable. It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.\n>\n> 有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。\n>\n> 遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。\n\n材料不稳定、对光敏感先说明受损原因，随后博物馆采取减少光照的措施。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Museums stopped displaying the artworks to duplicate them for future display.\n>\n> 博物馆撤下部分Gilardi作品是为了复制作品供日后展出。\n\nB需要复制原作的行动或意图。后来修复后重新展出仍是保存原作的成果，也不能倒推最初撤展为了复制。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><code>duplicate</code>指制作复制品，需要核对第4段<code>Museums locked some of them away in the dark</code>所写的博物馆行动，看其中是否包含复制安排。</p>\n<p>原文先说材料容易受到光照损伤，随后说博物馆把部分作品<code>locked some of them away in the dark</code>，行动是收起原作并置于暗处。本项的<code>duplicate them for future display</code>则增加了制作复制品、安排未来展出的连续计划。把原作收在暗处针对的是光照问题，不能改接成制作另一些作品的工序。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p>有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。</p>\n<p>遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。</p>\n</blockquote>\n<p>材料不稳定、对光敏感先说明受损原因，随后博物馆采取减少光照的措施。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums stopped displaying the artworks to duplicate them for future display.</p>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p>B需要复制原作的行动或意图。后来修复后重新展出仍是保存原作的成果，也不能倒推最初撤展为了复制。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. have their ingredients analyzed","raw":"### C. have their ingredients analyzed\n\n> 博物馆撤下部分Gilardi作品是为了分析作品的成分。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。\n\n**出处：**\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"\n> And sometimes, it's not the artist's fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\" —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> Unfortunately, the polyurethane foam he used is inherently unstable. It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了分析作品的成分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;\nAnd sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section>"},{"title":"C. have their ingredients analyzed","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 博物馆撤下部分Gilardi作品是为了分析作品的成分。\n\n`ingredients analyzed`说的是分析原料，第2段的`mix ingredients properly`也涉及原料，但谈的是配料；题干的博物馆行动却在第4段，所以把那段已读的配料说明与`locked some of them away in the dark`对照。\n\n第2段的`mix ingredients properly`说一些创作者不懂得恰当混合原料，用来解释部分物品为何脆弱。第4段则从光照损伤写到博物馆把吉拉尔迪的部分作品置于暗处。\n\n本项的`ingredients analyzed`把前面的原料话题接成博物馆后来要做的成分分析。\n\n原文没有把配料知识不足与这次收起作品建立这种目的关系；暗处存放直接回应的是光照损伤。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>博物馆撤下部分Gilardi作品是为了分析作品的成分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;\nAnd sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了分析作品的成分。</p>\n</blockquote>\n<p><code>ingredients analyzed</code>说的是分析原料，第2段的<code>mix ingredients properly</code>也涉及原料，但谈的是配料；题干的博物馆行动却在第4段，所以把那段已读的配料说明与<code>locked some of them away in the dark</code>对照。</p>\n<p>第2段的<code>mix ingredients properly</code>说一些创作者不懂得恰当混合原料，用来解释部分物品为何脆弱。第4段则从光照损伤写到博物馆把吉拉尔迪的部分作品置于暗处。</p>\n<p>本项的<code>ingredients analyzed</code>把前面的原料话题接成博物馆后来要做的成分分析。</p>\n<p>原文没有把配料知识不足与这次收起作品建立这种目的关系；暗处存放直接回应的是光照损伤。</p>\n</section>"},{"title":"C. have their ingredients analyzed","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says. \"The object you make is already a time bomb.\"\n> And sometimes, it's not the artist's fault. In the 1960s, the Italian artist Picro d displaying the artworks to prevent them from further damage.</p>\n<p>博物馆撤下部分Gilardi作品是为了防止作品受到进一步损伤。</p>\n</blockquote>\n<p>D没有说避光能使既有损伤自动消失，而是防止further damage，准确保留保护行动所针对的后续风险。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. D**\n\n- A：希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。\n- B：收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。\n- C：前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。\n- D：作品尤其易受光损，且已出现碎坏，存入暗处可以减少继续光照，D对应防止进一步损伤的目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1094,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"23","questionConclusion":true},"html":"<blockquote>\n<p><strong>23. D</strong></p>\n</blockquote>\n<ul>\n<li>A：希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。</li>\n<li>B：收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。</li>\n<li>C：前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。</li>\n<li>D：作品尤其易受光损，且已出现碎坏，存入暗处可以减少继续光照，D对应防止进一步损伤的目的。</li>\n</ul>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> The author thinks that preservation of plastics is ______.\n>\n> 作者认为，塑料的保存是______的。\n\n### 题型\n\n评价推断题：区分难度、成本、价值和受欢迎程度，按harder及后文原因判断。\n\n题干问作者怎样看待preservation of plastics。粗读时第6段留下preservation of plastics与will likely get harder，直接谈保存工作的前景。第6段开头提到van Oosten的成功故事，需要连着读前面的第5段，明确作者怎样从这一实例转到总体判断。\n\n### 核心出处\n\n> with stabilizing and consolidating chemicals\n>\n> their goal was to prevent further light damage and rebuild worn polymer fibers\n>\n> preservation of plastics will likely get harder","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"24","questionIntro":true},"html":"<blockquote>\n<p>The author thinks that preservation of plastics is ______.</p>\n<p>作者认为，塑料的保存是______的。</p>\n</blockquote>\n<h3>题型</h3>\n<p>评价推断题：区分难度、成本、价值和受欢迎程度，按harder及后文原因判断。</p>\n<p>题干问作者怎样看待preservation of plastics。粗读时第6段留下preservation of plastics与will likely get harder，直接谈保存工作的前景。第6段开头提到van Oosten的成功故事，需要连着读前面的第5段，明确作者怎样从这一实例转到总体判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>with stabilizing and consolidating chemicals</p>\n<p>their goal was to prevent further light damage and rebuild worn polymer fibers</p>\n<p>preservation of plastics will likely get harder</p>\n</blockquote>\n"},{"title":"A. costly","raw":"### A. costly\n\n> 作者认为塑料保存工作费用高昂。\n\n**做题模式中的状态：** 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第三类——无中生有。**\n\n稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。\n\n**出处：**\n\n> So van Oosten and her colleagues worked to preserve Gilardi's sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals \"sunscreens\" because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\n> Despite success stories like van Oosten's, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>作者认为塑料保存工作费用高昂。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n</section>"},{"title":"A. costly","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为塑料保存工作费用高昂。\n\n稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。\n\n作者先写注入化学品以防光损、重建纤维，再以Despite指出旧物继续劣化、可降解塑料增多。\n\nA需要材料价格、人工费用或总体支出的说明。stabilizing与consolidating都是作用，不能将未知词补成昂贵属性，D才对应harder。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>作者认为塑料保存工作费用高昂。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作费用高昂。</p>\n</blockquote>\n<p>稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</p>\n<p>作者先写注入化学品以防光损、重建纤维，再以Despite指出旧物继续劣化、可降解塑料增多。</p>\n<p>A需要材料价格、人工费用或总体支出的说明。stabilizing与consolidating都是作用，不能将未知词补成昂贵属性，D才对应harder。</p>\n</section>"},{"title":"A. costly","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> So van Oosten and her colleagues worked to preserve Gilardi's sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals \"sunscreens\" because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\n> Despite success stories like van Oosten's, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.\n>\n> 因此Van Oosten和同事着手保存Gilardi的雕塑。他们给部分作品注入稳定、加固化学品。她称其为防晒霜，因为目的是防止进一步光损并重建受损的聚合物纤维。她为几件雕塑甚至已能重新展出感到自豪，尽管有时仍须放在保护罩下。\n>\n> 尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。\n\n作者先写注入化学品以防光损、重建纤维，再以Despite指出旧物继续劣化、可降解塑料增多。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Preserving plastics is costly.\n>\n> 作者认为塑料保存工作费用高昂。\n\nA需要材料价格、人工费用或总体支出的说明。stabilizing与consolidating都是作用，不能将未知词补成昂贵属性，D才对应harder。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q stics is unworthy.\n>\n> 作者认为塑料保存工作不值得进行。\n\nB需要作者否定保存价值。实际难度与意义并存，Despite保留成功后再谈困难，并不撤回文化价值。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>作者认为塑料保存工作不值得进行。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者肯定文化物品重要、修复成功及历史价值，困难增加没有被写成不值得保存。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.\nAnd more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回 石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>尽管修复使部分作品重展，保存挑战仍会扩大；最后又强调保存选择影响后人理解时代。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is unworthy.</p>\n<p>作者认为塑料保存工作不值得进行。</p>\n</blockquote>\n<p>B需要作者否定保存价值。实际难度与意义并存，Despite保留成功后再谈困难，并不撤回文化价值。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. unpopular","raw":"### C. unpopular\n\n> 作者认为塑料保存工作不受欢迎。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。\n\n**出处：**\n\n> People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don't break down easily. But some plastic materials change over time. They crack and frizzle. They \"weep\" out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\n> Despite success stories like van Oosten's, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-C-0\"><blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n</section>"},{"title":"C. unpopular","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为塑料保存工作不受欢迎。\n\n`unpopular`评价人们是否欢迎这项工作，第1段`People often complain`确实出现人们的抱怨；要看清抱怨的对象，并与第6段`preservation of plastics will likely get harder`对照。\n\n第1段`People often complain`后面接的是`plastics are too durable`，人们抱怨塑料过于耐用，随后谈的是塑料垃圾遍布各处。第6段则评价保存塑料的工作会更难。\n\n本项的`unpopular`把人们对塑料耐久性及垃圾问题的不满，改接成对塑料保存工作的不欢迎。\n\n抱怨的对象换了，工作难度也并不表示公众赞成或反对这项工作。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-C-0\"><blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><code>unpopular</code>评价人们是否欢迎这项工作，第1段<code>People often complain</code>确实出现人们的抱怨；要看清抱怨的对象，并与第6段<code>preservation of plastics will likely get harder</code>对照。</p>\n<p>第1段<code>People often complain</code>后面接的是<code>plastics are too durable</code>，人们抱怨塑料过于耐用，随后谈的是塑料垃圾遍布各处。第6段则评价保存塑料的工作会更难。</p>\n<p>本项的<code>unpopular</code>把人们对塑料耐久性及垃圾问题的不满，改接成对塑料保存工作的不欢迎。</p>\n<p>抱怨的对象换了，工作难度也并不表示公众赞成或反对这项工作。</p>\n</section>"},{"title":"C. unpopular","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don't break down easily. But some plastic materials change over time. They crack and frizzle. They \"weep\" out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\n> Despite success stories like van Oosten's, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.\n>\n> 人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。\n>\n> 尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。\n\n首段先写污染背景，再用But转到馆藏易损，后文始终讨论保护难度与意义。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Preserving plastics is unpopular.\n>\n> 作者认为塑料保存工作不受欢迎。\n\nC需要公众反对保存工作的态度。材料带来环境问题，不意味着人们不欢迎博物馆保护具有文化价值的物品。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-C-0\"><blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><code>unpopular</code>评价人们是否欢迎这项工作，第1段<code>People often complain</code>确实出现人们的抱怨；要看清抱怨的对象，并与第6段<code>preservation of plastics will likely get harder</code>对照。</p>\n<p>第1段<code>People often complain</code>后面接的是<code>plastics are too durable</code>，人们抱怨塑料过于耐用，随后谈的是塑料垃圾遍布各处。第6段则评价保存塑料的工作会更难。</p>\n<p>本项的<code>unpopular</code>把人们对塑料耐久性及垃圾问题的不满，改接成对塑料保存工作的不欢迎。</p>\n<p>抱怨的对象换了，工作难度也并不表示公众赞成或反对这项工作。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n<p>尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。</p>\n</blockquote>\n<p>首段先写污染背景，再用But转到馆藏易损，后文始终讨论保护难度与意义。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is unpopular.</p>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p>C需要公众反对保存工作的态度。材料带来环境问题，不意味着人们不欢迎博物馆保护具有文化价值的物品。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. challenging","raw":"### D. challenging\n\n> 作者认为塑料保存工作具有挑战性。\n\n**做题模式中的状态：** 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。\n\n**出处：**\n\n> So van Oosten and her colleagues worked to preserve Gilardi's sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals \"sunscreens\" because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\n> Despite success stories like van Oosten's, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>作者认为塑料保存工作具有挑战性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n</section>"},{"title":"D. challenging","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者认为塑料保存工作具有挑战性。\n\n`challenging`是在说工作难做，第6段的`will likely get harder`直接评价保存难度，因此回看这个转折句，并结合第5段的实际修复目标。\n\n第5段显示保存需要防止进一步损伤、重建已经受损的纤维；第6段即使承认成功实例，仍判断`will likely get harder`。原文把塑料保存看成难度还可能上升的工作。本项的`challenging`正是对这种工作困难的概括，没有把困难另外限定成某一种具体原因。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>作者认为塑料保存工作具有挑战性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit
