fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<p>因此Van Oosten和同事着手保存Gilardi的雕塑。他们给部分作品注入稳定、加固化学品。她称其为防晒霜，因为目的是防止进一步光损并重建受损的聚合物纤维。她为几件雕塑甚至已能重新展出感到自豪，尽管有时仍须放在保护罩下。</p>\n<p>尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。</p>\n</blockquote>\n<p>成功修复不是终点，Despite和Worse引出仍在扩大、甚至更难控制的材料问题。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is challenging.</p>\n<p>作者认为塑料保存工作具有挑战性。</p>\n</blockquote>\n<p>D并不否认已有成功，也没说所有保护都会失败；它保留面对复杂损坏和材料变化的工作难度。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. D**\n\n- A：稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。\n- B：作者肯定文化物品重要、修复成功及历史价值，困难增加没有被写成不值得保存。\n- C：人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。\n- D：旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1409,1344,315],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"24","questionConclusion":true},"html":"<blockquote>\n<p><strong>24. D</strong></p>\n</blockquote>\n<ul>\n<li>A：稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</li>\n<li>B：作者肯定文化物品重要、修复成功及历史价值，困难增加没有被写成不值得保存。</li>\n<li>C：人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。</li>\n<li>D：旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> In Ferreira’s opinion, preservation of plastic artifacts ______.\n>\n> 在费雷拉看来，保存塑料人造物品______。\n\n### 题型\n\n人物观点推断题：将过去遗物的作用与未来认识塑料时代连起来，区分行动与影响发生的时间。\n\n题干点名Ferreira，第7段出现Joana Lia Ferreira并引用她的话，因此整段读第7段。\n\n### 核心出处\n\n> after examining artifacts in museums\n>\n> will have a strong impact on how in the future we'll be seen\n>\n> the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>In Ferreira’s opinion, preservation of plastic artifacts ______.</p>\n<p>在费雷拉看来，保存塑料人造物品______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点推断题：将过去遗物的作用与未来认识塑料时代连起来，区分行动与影响发生的时间。</p>\n<p>题干点名Ferreira，第7段出现Joana Lia Ferreira并引用她的话，因此整段读第7段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>after examining artifacts in museums</p>\n<p>will have a strong impact on how in the future we&#39;ll be seen</p>\n<p>the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums</p>\n</blockquote>\n"},{"title":"A. will inspire future scientific research","raw":"### A. will inspire future scientific research\n\n> Ferreira认为保存塑料物品将激发未来科学研究。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。\n\n**出处：**\n\n> And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. will inspire future scientific research","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Ferreira认为保存塑料物品将激发未来科学研究。\n\n`future`与第7段的`how in the future we'll be seen`相接，但`inspire scientific research`还要核对未来发生的具体事情，因此回看她说保存决定将产生什么影响的最后一句。\n\n原文先用过去考察博物馆物品后划分材料时代的事情作说明，再说今天的保存决定会影响`how in the future we'll be seen`，即未来的人怎样看待我们。本项的`inspire future scientific research`则把这种影响具体改成激发未来科学研究。未来形成的时代印象与科学研究受到启发不是同一个结果；原文写清的是保存的物品怎样影响对我们这个时代的认识，没有把保存活动接成开启科研的动力。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><code>future</code>与第7段的<code>how in the future we&#39;ll be seen</code>相接，但<code>inspire scientific research</code>还要核对未来发生的具体事情，因此回看她说保存决定将产生什么影响的最后一句。</p>\n<p>原文先用过去考察博物馆物品后划分材料时代的事情作说明，再说今天的保存决定会影响<code>how in the future we&#39;ll be seen</code>，即未来的人怎样看待我们。本项的<code>inspire future scientific research</code>则把这种影响具体改成激发未来科学研究。未来形成的时代印象与科学研究受到启发不是同一个结果；原文写清的是保存的物品怎样影响对我们这个时代的认识，没有把保存活动接成开启科研的动力。</p>\n</section>"},{"title":"A. will inspire future scientific research","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"\n>\n> 这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。\n\nFerreira先用考古学家根据遗物认识材料时代作类比，再把今天保存塑料接到未来对当代的理解。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Preservation of plastic artifacts will inspire future scientific research.\n>\n> Ferreira认为保存塑料物品将激发未来科学研究。\n\nA需要保存物品启发新科研的说明。考察遗物可以属于研究过程，但不能因此把这里明确的历史认识影响改成激发科研。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><code>future</code>与第7段的<code>how in the future we&#39;ll be seen</code>相接，但<code>inspire scientific research</code>还要核对未来发生的具体事情，因此回看她说保存决定将产生什么影响的最后一句。</p>\n<p>原文先用过去考察博物馆物品后划分材料时代的事情作说明，再说今天的保存决定会影响<code>how in the future we&#39;ll be seen</code>，即未来的人怎样看待我们。本项的<code>inspire future scientific research</code>则把这种影响具体改成激发未来科学研究。未来形成的时代印象与科学研究受到启发不是同一个结果；原文写清的是保存的物品怎样影响对我们这个时代的认识，没有把保存活动接成开启科研的动力。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>Ferreira先用考古学家根据遗物认识材料时代作类比，再把今天保存塑料接到未来对当代的理解。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preservation of plastic artifacts will inspire future scientific research.</p>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p>A需要保存物品启发新科研的说明。考察遗物可以属于研究过程，但不能因此把这里明确的历史认识影响改成激发科研。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. has profound historical significance","raw":"### B. has profound historical significance\n\n> Ferreira认为保存塑料物品具有深远历史意义。\n\n**做题模式中的状态：** 第一轮保留B，此时B尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n过去遗物帮助认识材料时代，今天塑料藏品又将影响后人理解我们的时代，B概括超越单件物品的深远历史意义。\n\n**出处：**\n\n> And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"B","cumulative" llect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"\n>\n> 这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。\n\n先交代过去怎样认识历史，再说明我们身处塑料时代以及今天选择留下什么证据。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Preservation of plastic artifacts will help us separate the material ages.\n>\n> Ferreira认为保存塑料物品将帮助我们区分各个材料时代。\n\nC需要说我们借保存塑料去区分各个时代。实际未来认识的对象是当代塑料时代，过去划分时代只用于说明遗物的重要性。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-C-0\"><blockquote>\n<p>Ferreira认为保存塑料物品将帮助我们区分各个材料时代。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>划分材料时代是过去考古学家借物品完成的事例，当前保存塑料的重点是未来如何理解我们。C把事例挪成今后的直接任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品将帮助我们区分各个材料时代。</p>\n</blockquote>\n<p><code>separate the material ages</code>能接到第7段<code>first defined the great material ages</code>，但选项说的是将帮助我们做 xamining artifacts in museums. We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>today修饰收藏保存的选择，in the future限定人们看待我们的时间。D把今天从行动时间改成影响发生时间。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section>"},{"title":"D. has an impact on today’s cultural life","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Ferreira认为保存塑料物品影响今天的文化生活。\n\n`has an impact`与第7段`have a strong impact`直接相接，但`today’s cultural life`限定了影响的时间和对象，因此回看`today`所在的收藏动作与`impact`后面的`how in the future we'll be seen`这一未来结果。\n\n原文的`today`修饰我们今天决定收藏什么，`have a strong impact`之后却明确接`how in the future we'll be seen`，受影响的是未来的人如何看待我们。本项的`today’s cultural life`把今天从做决定的时间移到了影响发生的时间，同时把未来对我们这个时代的认识换成当下文化生活。它保留了影响这个动作，却改变了影响落到哪里。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150, on at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"\n>\n> 这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。\n\n今天留下哪些物品，将塑造未来可用于理解当代的材料，作者强调跨越时间的历史后果。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Preservation of plastic artifacts has an impact on today’s cultural life.\n>\n> Ferreira认为保存塑料物品影响今天的文化生活。\n\nD需要当下文化生活如何改变的说明。原文确实有文化价值，却未将这项强烈影响落在今天的文化生活上。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>today修饰收藏保存的选择，in the future限定人们看待我们的时间。D把今天从行动时间改成影响发生时间。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p><code>has an impact</code>与第7段<code>have a strong impact</code>直接相接，但<code>today’s cultural life</code>限定了影响的时间和对象，因此回看<code>today</code>所在的收藏动作与<code>impact</code>后面的<code>how in the future we&#39;ll be seen</code>这一未来结果。</p>\n<p>原文的<code>today</code>修饰我们今天决定收藏什么，<code>have a strong impact</code>之后却明确接<code>how in the future we&#39;ll be seen</code>，受影响的是未来的人如何看待我们。本项的<code>today’s cultural life</code>把今天从做决定的时间移到了影响发生的时间，同时把未来对我们这个时代的认识换成当下文化生活。它保留了影响这个动作，却改变了影响落到哪里。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>今天留下哪些物品，将塑造未来可用于理解当代的材料，作者强调跨越时间的历史后果。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preservation of plastic artifacts has an impact on today’s cultural life.</p>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p>D需要当下文化生活如何改变的说明。原文确实有文化价值，却未将这项强烈影响落在今天的文化生活上。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. B**\n\n- A：未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。\n- B：过去遗物帮助认识材料时代，今天塑料藏品又将影响后人理解我们的时代，B概括超越单件物品的深远历史意义。\n- C：划分材料时代是过去考古学家借物品完成的事例，当前保存塑料的重点是未来如何理解我们。C把事例挪成今后的直接任务。\n- D：today修饰收藏保存的选择，in the future限定人们看待我们的时间。D把今天从行动时间改成影响发生时间。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1724,1344,353],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. B</strong></p>\n</blockquote>\n<ul>\n<li>A：未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。</li>\n<li>B：过去遗物帮助认识材料时代，今天塑料藏品又将影响后人理解我们的时代，B概括超越单件物品的深远历史意义。</li>\n<li>C：划分材料时代是过去考古学家借物品完成的事例，当前保存塑料的重点是未来如何理解我们。C把事例挪成今后的直接任务。</li>\n<li>D：today修饰收藏保存的选择，in the future限定人们看待我们的时间。D把今天从行动时间改成影响发生时间。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：塑料保护的悖论**（段落1核心问题） 塑料的矛盾特性：【通常太耐用（污染环境）// 但文化物品中的塑料会劣化：（开裂、渗出添加剂、融化）】→ 给博物馆带来巨大困扰 → 风险物品种类繁多：（早期收音机、前卫雕塑、迪士尼动画胶片、人工心脏）\n\n↓（原因分析）\n\n**逻辑层次2：塑料文物脆弱的根源**（段落2-4具体案例） 内在原因：早期艺术家不懂正确混合成分 → 比喻：\"像烤蛋糕\"→ 结果：\"定时炸弹\" + 外在案例：【吉拉尔迪的泡沫艺术品：（1960年代创作\"自然地毯\"供人行走）→ 材料问题：（聚氨酯泡沫本质不稳定 + 易受光损）→ 后果：（1990年代作品崩解）→ 博物馆被迫将其锁在黑暗中】\n\n↓（保护努力）\n\n**逻辑层次3：保护工作的成果与方法**（段落5保护技术） 范·奥斯滕团队的努力：注入稳定和加固化学品（称为\"防晒霜\"）→ 目标：（防止光损 + 重建聚合物纤维）→ 成果：部分雕塑重新展出（虽然需要保护罩）\n\n//（未来挑战）\n\n**逻辑层次4：保护工作面临的挑战**（段落6未来困境） 尽管有成功案例 // 但保护会更困难：【旧物品继续恶化 + 可生物降解塑料（设计用来分解）越来越普遍】\n\n↑（历史意义）\n\n**逻辑层次5：塑料保护的历史重要性**（段落7深层意义） 超越个别物品的意义：费雷拉的观点：【考古学家通过博物馆文物定义材料时代（石器、铁器等）→ 我们生活在塑料时代 → 今天的收集和保存决定将影响未来如何看待我们这个时代】\n\n全文核心观点：塑料文物保护面临独特挑战——塑料既因太耐用而污染环境，又会在文化物品中劣化。尽管有技术进步，但保护工作将更加困难。这项工作具有深远的历史意义，因为它将决定未来如何理解我们的\"塑料时代\"。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：塑料保护的悖论</strong>（段落1核心问题） 塑料的矛盾特性：【通常太耐用（污染环境）// 但文化物品中的塑料会劣化：（开裂、渗出添加剂、融化）】→ 给博物馆带来巨大困扰 → 风险物品种类繁多：（早期收音机、前卫雕塑、迪士尼动画胶片、人工心脏）</p>\n<p>↓（原因分析）</p>\n<p><strong>逻辑层次2：塑料文物脆弱的根源</strong>（段落2-4具体案例） 内在原因：早期艺术家不懂正确混合成分 → 比喻：&quot;像烤蛋糕&quot;→ 结果：&quot;定时炸弹&quot; + 外在案例：【吉拉尔迪的泡沫艺术品：（1960年代创作&quot;自然地毯&quot;供人行走）→ 材料问题：（聚氨酯泡沫本质不稳定 + 易受光损）→ 后果：（1990年代作品崩解）→ 博物馆被迫将其锁在黑暗中】</p>\n<p>↓（保护努力）</p>\n<p><strong>逻辑层次3：保护工作的成果与方法</strong>（段落5保护技术） 范·奥斯滕团队的努力：注入稳定和加固化学品（称为&quot;防晒霜&quot;）→ 目标：（防止光损 + 重建聚合物纤维）→ 成果：部分雕塑重新展出（虽然需要保护罩）</p>\n<p>//（未来挑战）</p>\n<p><strong>逻辑层次4：保护工作面临的挑战</strong>（段落6未来困境） 尽管有成功案例 // 但保护会更困难：【旧物品继续恶化 + 可生物降解塑料（设计用来分解）越来越普遍】</p>\n<p>↑（历史意义）</p>\n<p><strong>逻辑层次5：塑料保护的历史重要性</strong>（段落7深层意义） 超越个别物品的意义：费雷拉的观点：【考古学家通过博物馆文物定义材料时代（石器、铁器等）→ 我们生活在塑料时代 → 今天的收集和保存决定将影响未来如何看待我们这个时代】</p>\n<p>全文核心观点：塑料文物保护面临独特挑战——塑料既因太耐用而污染环境，又会在文化物品中劣化。尽管有技术进步，但保护工作将更加困难。这项工作具有深远的历史意义，因为它将决定未来如何理解我们的&quot;塑料时代&quot;。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. A contrast between environmental persistence and museum fragility\n\n> 环境中的难降解与博物馆中的易损形成反差\n\n开头用人们抱怨塑料耐久与某些塑料会劣化作转折，列举博物馆需要保存的文化物品。\n\n> People often complain that plastics are too durable.\n\n开头too durable从环境垃圾不易降解说起，But转到一些塑料反而会随时间变坏。\n\n> They \"weep\" out additives.\n\nweep out additives是材料劣化的一种具体表现，和开裂、融化一起解释博物馆为何头痛。\n\n> The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\n\n列举跨越技术、艺术和医学的藏品，扩大保护风险涉及范围，标题需保留环境耐久与馆藏脆弱的反差。\n\n这一部分的推进关系是：\n\n> 环境中难降解 → 部分塑料会劣化 → 文化藏品面临保存风险\n\ncontrast对应But，museum fragility对应开裂、析出与保存困扰。\n\n再看最强干扰项G：Why all plastic objects should be discarded immediately。\n\n文中强调文化保存价值，未建议全部丢弃。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. A contrast between environmental persistence and museum fragility</p>\n<blockquote>\n<p>环境中的难降解与博物馆中的易损形成反差</p>\n</blockquote>\n<p>开头用人们抱怨塑料耐久与某些塑料会劣化作转折，列举博物馆需要保存的文化物品。</p>\n<blockquote>\n<p>People often complain that plastics are too durable.</p>\n</blockquote>\n<p>开头too durable从环境垃圾不易降解说起，But转到一些塑料反而会随时间变坏。</p>\n<blockquote>\n<p>They &quot;weep&quot; out additives.</p>\n</blockquote>\n<p>weep out additives是材料劣化的一种具体表现，和开裂、融化一起解释博物馆为何头痛。</p>\n<blockquote>\n<p>The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n<p>列举跨越技术、艺术和医学的藏品，扩大保护风险涉及范围，标题需保留环境耐久与馆藏脆弱的反差。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>环境中难降解 → 部分塑料会劣化 → 文化藏品面临保存风险</p>\n</blockquote>\n<p>contrast对应But，museum fragility对应开裂、析出与保存困扰。</p>\n<p>再看最强干扰项G：Why all plastic objects should be discarded immediately。</p>\n<p>文中强调文化保存价值，未建议全部丢弃。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】A. Why some objects carry problems from the start\n\n> 为何部分物品从制作之初就有隐患\n\n化学家把配料比例不当比作烘焙失误，定时炸弹说明隐患已在制作时进入成品。\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands.\n\nbecause直接将某些艺术品的脆弱接到原料混合不当，说明一种损坏来源。\n\n> \"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says.\n\n烘焙类比的关键是exact amounts，配料比例不准会影响制作结果，而不是外形不好看。\n\n> \"The object you make is already a time bomb.\"\n\nalready把定时炸弹隐患放在制成之初，标题要概括初始制作缺陷。\n\n这一部分的推进关系是：\n\n> 配料知识不足 → 用量失准 → 成品从开始就有隐患\n\nfrom the start对应object ... already a time bomb，限定certain objects。\n\n再看最强干扰项D：A complete cure that ends every preservation challenge。\n\n这里说明隐患原因，未提供彻底治愈方案。\n\n**42题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】A. Why some objects carry problems from the start</p>\n<blockquote>\n<p>为何部分物品从制作之初就有隐患</p>\n</blockquote>\n<p>化学家把配料比例不当比作烘焙失误，定时炸弹说明隐患已在制作时进入成品。</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands.</p>\n</blockquote>\n<p>because直接将某些艺术品的脆弱接到原料混合不当，说明一种损坏来源。</p>\n<blockquote>\n<p>&quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says.</p>\n</blockquote>\n<p>烘焙类比的关键是exact amounts，配料比例不准会影响制作结果，而不是外形不好看。</p>\n<blockquote>\n<p>&quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n<p>already把定时炸弹隐患放在制成之初，标题要概括初始制作缺陷。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>配料知识不足 → 用量失准 → 成品从开始就有隐患</p>\n</blockquote>\n<p>from the start对应object ... already a time bomb，限定certain objects。</p>\n<p>再看最强干扰项D：A complete cure that ends every preservation challenge。</p>\n<p>这里说明隐患原因，未提供彻底治愈方案。</p>\n<p><strong>42题选A。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】E. Artistic intentions frustrated by an unstable material\n\n> 不稳定材料使艺术创作意图受挫\n\n艺术家希望观众行走其上，需要耐用材料；但所用泡沫不稳定并易受光损，作品最终被避光保存。\n\n> And sometimes, it's not the artist's fault.\n\nnot the artist's fault承接前段制作失误，却转出材料本身也可能有问题。\n\n> He wanted viewers to walk around on the carpets—which meant they had to be durable.\n\n观众行走的用途要求作品耐用，先建立艺术家的合理创作意图。\n\n> Museums locked some of them away in the dark.\n\n暗处存放回应泡沫对光敏感和碎坏，显示材料不稳定使原本互动展示的意图受挫。\n\n这一部分的推进关系是：\n\n> 希望观众走上耐用作品 → 泡沫本身易受光损 → 撤展避光保护\n\nintentions对应walk around和durable，frustrated对应Unfortunately后的劣化。\n\n再看最强干扰项A：Why some objects carry problems from the start。\n\n此处特别先说并非总是艺术家的错，重点是材料固有不稳定，不可全归配料失误。\n\n**43题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】E. Artistic intentions frustrated by an unstable material</p>\n<blockquote>\n<p>不稳定材料使艺术创作意图受挫</p>\n</blockquote>\n<p>艺术家希望观众行走其上，需要耐用材料；但所用泡沫不稳定并易受光损，作品最终被避光保存。</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault.</p>\n</blockquote>\n<p>not the artist&#39;s fault承接前段制作失误，却转出材料本身也可能有问题。</p>\n<blockquote>\n<p>He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n</blockquote>\n<p>观众行走的用途要求作品耐用，先建立艺术家的合理创作意图。</p>\n<blockquote>\n<p>Museums locked some of them away in the dark.</p>\n</blockquote>\n<p>暗处存放回应泡沫对光敏感和碎坏，显示材料不稳定使原本互动展示的意图受挫。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>希望观众走上耐用作品 → 泡沫本身易受光损 → 撤展避光保护</p>\n</blockquote>\n<p>intentions对应walk around和durable，frustrated对应Unfortunately后的劣化。</p>\n<p>再看最强干扰项A：Why some objects carry problems from the start。</p>\n<p>此处特别先说并非总是艺术家的错，重点是材料固有不稳定，不可全归配料失误。</p>\n<p><strong>43题选E。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Successful treatment alongside increasing difficulties\n\n> 修复成功与困难增加同时存在\n\n团队注入稳定加固化学品使部分作品重展，Despite转出旧物继续劣化与可降解材料增加。\n\n> So van Oosten and her colleagues worked to preserve Gilardi's sculptures.\n\nSo将修复行动接到前面的受损和避光存放，化学处理目标是防损及重建纤维。\n\n> She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\n\n重新展出证明部分修复成功，albeit又保留仍需保护罩的条件。\n\n> Worse, biodegradable plastics designed to disintegrate, are increasingly common.\n\nWorse进一步增加困难：新材料本身被设计成可分解；标题需同时保留成功和挑战增大，不能只概括修复胜利。\n\n这一部分的推进关系是：\n\n> 化学稳定加固 → 部分作品重新展出 → 旧物劣化与新材料分解使困难增加\n\nalongside保留成功不等于问题结束的对照，increasing difficulties对应harder与Worse。\n\n再看最强干扰项D：A complete cure that ends every preservation challenge。\n\n第六段明确说更难，不存在终结所有挑战的疗法。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Successful treatment alongside increasing difficulties</p>\n<blockquote>\n<p>修复成功与困难增加同时存在</p>\n</blockquote>\n<p>团队注入稳定加固化学品使部分作品重展，Despite转出旧物继续劣化与可降解材料增加。</p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures.</p>\n</blockquote>\n<p>So将修复行动接到前面的受损和避光存放，化学处理目标是防损及重建纤维。</p>\n<blockquote>\n<p>She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.</p>\n</blockquote>\n<p>重新展出证明部分修复成功，albeit又保留仍需保护罩的条件。</p>\n<blockquote>\n<p>Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n<p>Worse进一步增加困难：新材料本身被设计成可分解；标题需同时保留成功和挑战增大，不能只概括修复胜利。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>化学稳定加固 → 部分作品重新展出 → 旧物劣化与新材料分解使困难增加</p>\n</blockquote>\n<p>alongside保留成功不等于问题结束的对照，increasing difficulties对应harder与Worse。</p>\n<p>再看最强干扰项D：A complete cure that ends every preservation challenge。</p>\n<p>第六段明确说更难，不存在终结所有挑战的疗法。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Preserving the evidence through which an age will be understood\n\n> 保存后人理解一个时代所依据的证据\n\n从单件物品转向历史时代认识：过去由遗物划分时代，今天的收藏将影响后人如何认识塑料时代。\n\n> And more is at stake here than individual objects.\n\nmore...than individual objects明确把讨论提升到超越单件藏品的意义。\n\n> Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums.\n\n考古学家根据遗物划分材料时代，说明保留物品如何影响历史认识。\n\n> We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"\n\n今天保存什么影响未来如何看待塑料时代，标题应抓住给后人留下理解时代的证据。\n\n这一部分的推进关系是：\n\n> 遗物帮助认识过去材料时代 → 今天选择保存塑料 → 塑造后人对当代的理解\n\nevidence对应artifacts，an age对应对今天塑料时代的未来认识。\n\n再看最强干扰项G：Why all plastic objects should be discarded immediately。\n\n保存有深远历史意义，与立即全丢弃相反。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Preserving the evidence through which an age will be understood</p>\n<blockquote>\n<p>保存后人理解一个时代所依据的证据</p>\n</blockquote>\n<p>从单件物品转向历史时代认识：过去由遗物划分时代，今天的收藏将影响后人如何认识塑料时代。</p>\n<blockquote>\n<p>And more is at stake here than individual objects.</p>\n</blockquote>\n<p>more...than individual objects明确把讨论提升到超越单件藏品的意义。</p>\n<blockquote>\n<p>Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums.</p>\n</blockquote>\n<p>考古学家根据遗物划分材料时代，说明保留物品如何影响历史认识。</p>\n<blockquote>\n<p>We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<p>今天保存什么影响未来如何看待塑料时代，标题应抓住给后人留下理解时代的证据。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>遗物帮助认识过去材料时代 → 今天选择保存塑料 → 塑造后人对当代的理解</p>\n</blockquote>\n<p>evidence对应artifacts，an age对应对今天塑料时代的未来认识。</p>\n<p>再看最强干扰项G：Why all plastic objects should be discarded immediately。</p>\n<p>保存有深远历史意义，与立即全丢弃相反。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出环境耐久与馆藏易损的反差 |\n| B | 解释配料不当造成初始隐患 |\n| C | 承认成功同时说明挑战仍扩大 |\n| D | 把保存单件物品拓展到历史认识证据 |\n| E | 说明泡沫光损及避光保护 |\n| F | 转出并非全是艺术家过错并介绍创作意图 |\n| G | 介绍加固处理及有限重展成功 |\n| H | 总结收藏保存选择塑造未来历史叙述 |\n\n全文推进：\n\n> 提出环境耐久与馆藏易损的反差 → 解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图 → 说明泡沫光损及避光保护 → 介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据 → 总结收藏保存选择塑造未来历史叙述\n\n完整顺序：\n\n**A → B → F → E → G → C → D → H**\n\n41—45：B、F、G、C、D。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"le "kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>41题是全文第2段，局部关系为A → B → F。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their instability threatens collections ranging from early technologies to modern art, making preservation a complicated task.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>One source of that instability lies in how an object was made.</p>\n</blockquote>\n<p>前段Their instability已提出馆藏不稳定，One source of that instability准确承接并开始解释一个原因。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Early users of plastic did not always understand the proportions needed when mixing ingredients. A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.</p>\n</blockquote>\n<p>不懂原料比例导致制作结果含有隐患，therefore建立因果，蛋糕类比将配比问题具体化。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>Not every failure, however, is the artist’s fault.</p>\n</blockquote>\n<p>Not every failure...artist&#39;s fault中的every构成限制，承接当前制作失误后转向另一种原因。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出环境耐久与馆藏易损的反差 → 解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Protection was also attempted through chemical treatment.</p>\n</blockquote>\n<p>化学处理是损坏之后的保护行动，这里先解释为什么会不稳定，直接放修复会使后面的not every failure缺少关于艺术家制作过错的背景。</p>\n<p><strong>41题选B。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为B → F → E。\n\n先看前段B的结尾：\n\n> A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.\n\n再看F段开头：\n\n> Not every failure, however, is the artist’s fault.\n\n前段把失败隐患归于配制失当，Not every failure用however转出不能都归责艺术家。\n\n本段内部继续写道：\n\n> An artist may deliberately seek a durable material because viewers are expected to interact with the work. Gilardi’s colourful foam installations illustrate this intention: some were designed so that people could walk around on them.\n\n艺术家为观众互动而追求耐用，Gilardi作品供人行走具体说明这种意图。\n\n后段E开头是：\n\n> The foam used for those installations proved inherently unstable and vulnerable to light.\n\nThe foam used for those installations回指刚介绍的泡沫装置，再揭示其材料不稳定。\n\n这三段的推进关系：\n\n> 解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图 → 说明泡沫光损及避光保护\n\n再检验候选G：\n\n> Protection was also attempted through chemical treatment.\n\nchemical treatment应接在光损和保护需求之后，此处还需建立创作意图及装置，后面those installations才有明确所指。\n\n**42题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>42题是全文第3段，局部关系为B → F → E。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Not every failure, however, is the artist’s fault.</p>\n</blockquote>\n<p>前段把失败隐患归于配制失当，Not every failure用however转出不能都归责艺术家。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>An artist may deliberately seek a durable material because viewers are expected to interact with the work. Gilardi’s colourful foam installations illustrate this intention: some were designed so that people could walk around on them.</p>\n</blockquote>\n<p>艺术家为观众互动而追求耐用，Gilardi作品供人行走具体说明这种意图。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The foam used for those installations proved inherently unstable and vulnerable to light.</p>\n</blockquote>\n<p>The foam used for those installations回指刚介绍的泡沫装置，再揭示其材料不稳定。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图 → 说明泡沫光损及避光保护</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Protection was also attempted through chemical treatment.</p>\n</blockquote>\n<p>chemical treatment应接在光损和保护需求之后，此处还需建立创作意图及装置，后面those installations才有明确所指。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → C。\n\n先看前段E的结尾：\n\n> Withholding them from view was a protective response to deterioration, not a decision that the works had lost cultural value.\n\n再看G段开头：\n\n> Protection was also attempted through chemical treatment.\n\n前段说撤展是protective response，Protection was also attempted承接同一保护目标并增加另一种手段。\n\n本段内部继续写道：\n\n> Conservators introduced substances intended to stabilise the material and rebuild weakened fibres. Some sculptures could later be displayed again, although protective cases were still needed in certain instances.\n\n注入化学品为稳定材料、重建纤维，随后部分作品重展说明效果，although保留需保护罩的限制。\n\n后段C开头是：\n\n> These successes do not mean that preservation will become easier.\n\nThese successes直接指刚写的重展成果，下一段才用这些成果转向困难未必减少。\n\n这三段的推进关系：\n\n> 说明泡沫光损及避光保护 → 介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大\n\n再检验候选D：\n\n> The value of meeting those challenges extends beyond saving individual works.\n\n保存价值的讨论在挑战之后才上升到历史层面，这里先补修复成功，否则These successes没有可以回指的结果。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Withholding them from view was a protective response to deterioration, not a decision that the works had lost cultural value.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Protection was also attempted through chemical treatment.</p>\n</blockquote>\n<p>前段说撤展是protective response，Protection was also attempted承接同一保护目标并增加另一种手段。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Conservators introduced substances intended to stabilise the material and rebuild weakened fibres. Some sculptures could later be displayed again, although protective cases were still needed in certain instances.</p>\n</blockquote>\n<p>注入化学品为稳定材料、重建纤维，随后部分作品重展说明效果，although保留需保护罩的限制。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>These successes do not mean that preservation will become easier.</p>\n</blockquote>\n<p>These successes直接指刚写的重展成果，下一段才用这些成果转向困难未必减少。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明泡沫光损及避光保护 → 介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>The value of meeting those challenges extends beyond saving individual works.</p>\n</blockquote>\n<p>保存价值的讨论在挑战之后才上升到历史层面，这里先补修复成功，否则These successes没有可以回指的结果。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → C → D。\n\n先看前段G的结尾：\n\n> Some sculptures could later be displayed again, although protective cases were still needed in certain instances.\n\n再看C段开头：\n\n> These successes do not mean that preservation will become easier.\n\n前段部分作品重展，These successes回指成果并用do not mean限制能由此推出的结论。\n\n本段内部继续写道：\n\n> Older objects continue to decline, and newer biodegradable plastics are designed to break apart. A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.\n\n旧物继续衰退，新塑料又可分解，后句据此说一种处理技术不能消除藏品范围内不断扩大的挑战。\n\n后段D开头是：\n\n> The value of meeting those challenges extends beyond saving individual works.\n\nthose challenges回指本段widening range of challenges，再转向应对这些困难的价值。\n\n这三段的推进关系：\n\n> 介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据\n\n再检验候选B：\n\n> One source of that instability lies in how an object was made.\n\n配制不当是前面已介绍的损坏原因，此处要说明成功之后仍有何困难，不能退回起因而丢失对成功的转折。\n\n**44题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>44题是全文第6段，局部关系为G → C → D。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Some sculptures could later be displayed again, although protective cases were still needed in certain instances.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>These successes do not mean that preservation will become easier.</p>\n</blockquote>\n<p>前段部分作品重展，These successes回指成果并用do not mean限制能由此推出的结论。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Older objects continue to decline, and newer biodegradable plastics are designed to break apart. A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.</p>\n</blockquote>\n<p>旧物继续衰退，新塑料又可分解，后句据此说一种处理技术不能消除藏品范围内不断扩大的挑战。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The value of meeting those challenges extends beyond saving individual works.</p>\n</blockquote>\n<p>those challenges回指本段widening range of challenges，再转向应对这些困难的价值。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>One source of that instability lies in how an object was made.</p>\n</blockquote>\n<p>配制不当是前面已介绍的损坏原因，此处要说明成功之后仍有何困难，不能退回起因而丢失对成功的转折。</p>\n<p><strong>44题选C。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为C → D → H。\n\n先看前段C的结尾：\n\n> A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.\n\n再看D段开头：\n\n> The value of meeting those challenges extends beyond saving individual works.\n\n前段以挑战不断扩大结束，meeting those challenges承接，再用extends beyond把意义从单件作品拓展。\n\n本段内部继续写道：\n\n> Archaeologists have used surviving objects to understand earlier material ages. The plastics selected for preservation today will similarly influence the evidence available to people trying to understand our own period.\n\n过去遗物帮助理解材料时代，similarly将这项历史作用类比到今天塑料藏品给未来提供证据。\n\n后段H开头是：\n\n> Preservation choices therefore help shape a future account of the present.\n\ntherefore将证据选择收束为未来如何叙述当代，因果建立在保存物与历史认识的关系上。\n\n这三段的推进关系：\n\n> 承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据 → 总结收藏保存选择塑造未来历史叙述\n\n再检验候选B：\n\n> One source of that instability lies in how an object was made.\n\n如何制作只解释一个损坏原因，不能承接这里的挑战价值，更不能为结尾future account提供历史认识的依据。\n\n**45题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>45题是全文第7段，局部关系为C → D → H。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The value of meeting those challenges extends beyond saving individual works.</p>\n</blockquote>\n<p>前段以挑战不断扩大结束，meeting those challenges承接，再用extends beyond把意义从单件作品拓展。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Archaeologists have used surviving objects to understand earlier material ages. The plastics selected for preservation today will similarly influence the evidence available to people trying to understand our own period.</p>\n</blockquote>\n<p>过去遗物帮助理解材料时代，similarly将这项历史作用类比到今天塑料藏品给未来提供证据。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Preservation choices therefore help shape a future account of the present.</p>\n</blockquote>\n<p>therefore将证据选择收束为未来如何叙述当代，因果建立在保存物与历史认识的关系上。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据 → 总结收藏保存选择塑造未来历史叙述</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>One source of that instability lies in how an object was made.</p>\n</blockquote>\n<p>如何制作只解释一个损坏原因，不能承接这里的挑战价值，更不能为结尾future account提供历史认识的依据。</p>\n<p><strong>45题选D。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **cultural preservation** | **文化保护** | **社会现象｜文化教育｜传统文化保护** | **宏观主题** |\n| historical understanding | 历史理解 | 社会现象｜文化教育 | 个人主题 |\n| material innovation | 材料创新 | 社会现象｜科技经济 | 宏观主题 |\n| **scientific conservation** | **科学保护** | **社会现象｜文化教育** | **宏观主题** |\n| shared cultural memory | 共同的文化记忆 | 社会现象｜文化教育 | 宏观主题 |\n| responsible collecting | 负责任的收藏 | 人生哲理｜责任与奉献 | 个人主题 |\n| long-term thinking | 长远思考 | 人生哲理｜远见 | 个人主题 |\n| responsibility to future generations | 对后代的责任 | 人生哲理｜责任与奉献 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>cultural preservation</strong></td>\n<td><strong>文化保护</strong></td>\n<td><strong>社会现象｜文化教育｜传统文化保护</strong>< eta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The object is kept under a protective cover to prevent further damage.</strong></td>\n<td><strong>物品被放在保护罩下以防进一步损伤。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene shows specialists working to preserve something of cultural importance.</td>\n<td>场景展示专家努力保存具有文化重要性的物品。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture contrasts an object’s original purpose with its present condition.</td>\n<td>图画对比物品最初的用途与当前状况。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The condition of the older items continues to deteriorate over time.</strong></td>\n<td><strong>较旧物品的状况随时间继续恶化。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Successful treatment has allowed some items to be displayed again.</td>\n<td>成功处理使部分物品能够重新展出。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The variety of materials creates an increasing range of preservation challenges.</td>\n<td>材料种类的增加带来更多保存挑战。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement links present choices with how future generations will understand us.</td>\n<td>这句话将当下选择与后代如何理解我们联系起来。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage suggests that more is at stake than the survival of individual objects.</td>\n<td>这段文字表明，相关意义不止是单件物品能否保存下来。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Why some objects carry problems from the start</strong></p><p><strong>B. Preserving the evidence through which an age will be understood</strong></p><p><strong>C. A contrast between environmental persistence and museum fragility</strong></p><p><strong>D. A complete cure that ends every preservation challenge</strong></p><p><strong>E. Artistic intentions frustrated by an unstable material</strong></p><p><strong>F. Successful treatment alongside increasing difficulties</strong></p><p><strong>G. Why all plastic objects should be discarded immediately</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#x27;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#x27;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#x27;s like baking a cake: If you don&#x27;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>And sometimes, it&#x27;s not the artist&#x27;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable. Unfortunately, the polyurethane foam he used is inherently unstable. It&#x27;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#x27;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>So van Oosten and her colleagues worked to preserve Gilardi&#x27;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases. Despite success stories like van Oosten&#x27;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#x27;ll be seen.&quot;</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Plastic creates two apparently opposite problems. Waste can remain in the environment for a long time, yet some culturally important plastic objects deteriorate inside museums. Their instability threatens collections ranging from early technologies to modern art, making preservation a complicated task.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>One source of that instability lies in how an object was made. Early users of plastic did not always understand the proportions needed when mixing ingredients. A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>These successes do not mean that preservation will become easier. Older objects continue to decline, and newer biodegradable plastics are designed to break apart. A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>The value of meeting those challenges extends beyond saving individual works. Archaeologists have used surviving objects to understand earlier material ages. The plastics selected for preservation today will similarly influence the evidence available to people trying to understand our own period.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The foam used for those installations proved inherently unstable and vulnerable to light. As the figures cracked and crumbled, museums moved some works into darkness. Withholding them from view was a protective response to deterioration, not a decision that the works had lost cultural value.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Not every failure, however, is the artist’s fault. An artist may deliberately seek a durable material because viewers are expected to interact with the work. Gilardi’s colourful foam installations illustrate this intention: some were designed so that people could walk around on them.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Protection was also attempted through chemical treatment. Conservators introduced substances intended to stabilise the material and rebuild weakened fibres. Some sculptures could later be displayed again, although protective cases were still needed in certain instances.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Preservation choices therefore help shape a future account of the present. They determine not only which objects remain intact but which aspects of a plastic-dependent society can be studied. Difficulty is a reason for careful conservation decisions, rather than proof that the effort lacks significance.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>durable</td>\n<td>adj.耐久的</td>\n<td>litter</td>\n<td>v.使散布垃圾</td>\n<td>break down</td>\n<td>分解</td>\n</tr>\n<tr>\n<td>crack</td>\n<td>v.开裂</td>\n<td>additives</td>\n<td>n.添加剂</td>\n<td>sludge</td>\n<td>n.烂泥状物</td>\n</tr>\n<tr>\n<td>preserve</td>\n<td>v.保存</td>\n<td>culturally important</td>\n<td>具有文化重要性的</td>\n<td>avant-garde</td>\n<td>adj.先锋的</td>\n</tr>\n<tr>\n<td>celluloid</td>\n<td>n.赛璐珞</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>artifacts</td>\n<td>n.人工制品</td>\n<td>vulnerable</td>\n<td>adj.易受损的</td>\n<td>pioneers</td>\n<td>n.先驱</td>\n</tr>\n<tr>\n<td>ingredients</td>\n<td>n.原料</td>\n<td>polymer</td>\n<td>n.聚合物</td>\n<td>chemist</td>\n<td>n.化学家</td>\n</tr>\n<tr>\n<td>exact amounts</td>\n<td>准确用量</td>\n<td>time bomb</td>\n<td>定时炸弹</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table
