easingly</td>\n<td>adv.越来越</td>\n</tr>\n<tr>\n<td>common</td>\n<td>adj.常见的</td>\n<td>success stories</td>\n<td>成功案例</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>at stake</td>\n<td>处于风险中</td>\n<td>conservation</td>\n<td>n.保护</td>\n<td>restoration</td>\n<td>n.修复</td>\n</tr>\n<tr>\n<td>archaeologists</td>\n<td>n.考古学家</td>\n<td>material ages</td>\n<td>材料时代</td>\n<td>examining</td>\n<td>v.检查</td>\n</tr>\n<tr>\n<td>collect</td>\n<td>v.收藏</td>\n<td>impact</td>\n<td>n.影响</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<h3>意群划分 · 第1段</h3>\n<p>People often complain / that plastics are too durable.</p>\n<p>Water bottles, / shopping bags, / and other trash / litter the planet, / from Mount Everest / to the Mariana Trench, / because plastics are everywhere / and don&#39;t break down easily.</p>\n<p>But some plastic materials / change over time.</p>\n<p>They crack and frizzle.</p>\n<p>They &quot;weep&quot; out additives.</p>\n<p>They melt into sludge.</p>\n<p>All of which / creates huge headaches / for institutions, / such as museums, / trying to preserve / culturally important objects.</p>\n<p>The variety / of plastic objects at risk / is dizzying: / early radios, / avant-garde sculptures, / celluloid animation stills / from Disney films, / the first artificial heart.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>人们经常抱怨 / 塑料太耐用了。</p>\n<p>水瓶、/ 购物袋、/ 和其他垃圾 / 遍布地球，/ 从珠穆朗玛峰 / 到马里亚纳海沟，/ 因为塑料无处不在 / 且不容易分解。</p>\n<p>但一些塑料材料 / 会随时间变化。</p>\n<p>它们会开裂和卷曲。</p>\n<p>它们会&quot;渗出&quot;添加剂。</p>\n<p>它们会融化成污泥。</p>\n<p>所有这些 / 给机构带来巨大困扰 / 对于机构来说，/ 比如博物馆，/ 试图保存 / 具有文化重要性的物品。</p>\n<p>种类 / 处于风险中的塑料物品的 / 令人眼花缭乱：/ 早期收音机、/ 前卫雕塑、/ 赛璐珞动画胶片 / 来自迪士尼电影的、/ 第一颗人工心脏。</p>\n<h3>标准译文 · 第1段</h3>\n<p>人们经常抱怨塑料太耐用了。水瓶、购物袋和其他垃圾遍布地球，从珠穆朗玛峰到马里亚纳海沟，因为塑料无处不在且不容易分解。但一些塑料材料会随时间变化。它们会开裂卷曲，&quot;渗出&quot;添加剂，融化成污泥。所有这些都给试图保存具有文化重要性物品的机构（如博物馆）带来巨大困扰。处于风险中的塑料物品种类令人眼花缭乱：早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画胶片、第一颗人工心脏。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<h3>意群划分 · 第2段</h3>\n<p>Certain artifacts / are especially vulnerable / because some pioneers / in plastic art / didn&#39;t always know / how to mix ingredients properly, / says Thea van Oosten, / a polymer chemist / who, until retiring / a few years ago, / worked for decades / at the Cultural Heritage Agency / of the Netherlands.</p>\n<p>&quot;It&#39;s like baking a cake: / If you don&#39;t have / exact amounts, / it goes wrong,&quot; / she says.</p>\n<p>&quot;The object you make / is already a time bomb.&quot;</p>\n<h3>意群翻译 · 第2段</h3>\n<p>某些文物 / 特别脆弱 / 因为一些先驱 / 在塑料艺术方面 / 并不总是知道 / 如何正确混合成分，/ 西娅·范·奥斯滕说，/ 一位聚合物化学家 / 她，直到退休 / 几年前，/ 工作了几十年 / 在文化遗产局 / 荷兰的。</p>\n<p>&quot;这就像烤蛋糕：/ 如果你没有 / 精确的分量，/ 就会出错，&quot;/ 她说。</p>\n<p>&quot;你制作的物品 / 已经是一个定时炸弹。&quot;</p>\n<h3>标准译文 · 第2段</h3>\n<p>荷兰文化遗产局工作了几十年、几年前刚退休的聚合物化学家西娅·范·奥斯滕说，某些文物特别脆弱，因为塑料艺术的一些先驱并不总是知道如何正确混合成分。&quot;这就像烤蛋糕：如果你没有精确的分量，就会出错，&quot;她说。&quot;你制作的物品已经是一个定时炸弹。&quot;</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n<h3>意群划分 · 第3段</h3>\n<p>And sometimes, / it&#39;s not the artist&#39;s fault.</p>\n<p>In the 1960s, / the Italian artist / Picro Gilardi / began to create / hundreds of bright, colorful / foam pieces.</p>\n<p>Those pieces included / small beds of roses / and other items / as well as / a few dozen &quot;nature carpets&quot; / —large rectangles / decorated with foam pumpkins, / cabbages, / and watermelons.</p>\n<p>He wanted viewers / to walk around / on the carpets— / which meant / they had to be durable.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>有时候，/ 这不是艺术家的错。</p>\n<p>在1960年代，/ 意大利艺术家 / 皮克罗·吉拉尔迪 / 开始创作 / 数百件明亮、多彩的 / 泡沫作品。</p>\n<p>这些作品包括 / 小型玫瑰花床 / 和其他物品 / 以及 / 几十块&quot;自然地毯&quot; / ——大型长方形 / 装饰着泡沫南瓜、/ 卷心菜 / 和西瓜。</p>\n<p>他希望观众 / 在上面走动 / 在地毯上—— / 这意味着 / 它们必须耐用。</p>\n<h3>标准译文 · 第3段</h3>\n<p>有时候，这不是艺术家的错。在1960年代，意大利艺术家皮克罗·吉拉尔迪开始创作数百件明亮、多彩的泡沫作品。这些作品包括小型玫瑰花床和其他物品，以及几十块&quot;自然地毯&quot;——装饰着泡沫南瓜、卷心菜和西瓜的大型长方形作品。他希望观众能在地毯上走动——这意味着它们必须耐用。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>Unfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Unfortunately, / the polyurethane foam / he used / is inherently unstable.</p>\n<p>It&#39;s especially vulnerable / to light damage, / and by the mid-1990s, / Gilardi&#39;s pumpkins, / roses, / and other figures / were spitting and crumbling.</p>\n<p>Museums locked / some of them away / in the dark.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>不幸的是，/ 聚氨酯泡沫 / 他使用的 / 本质上不稳定。</p>\n<p>它特别容易受到 / 光损伤，/ 到1990年代中期，/ 吉拉尔迪的南瓜、/ 玫瑰 / 和其他造型 / 正在崩解和粉碎。</p>\n<p>博物馆锁起了 / 其中一些 / 在黑暗中。</p>\n<h3>标准译文 · 第4段</h3>\n<p>不幸的是，他使用的聚氨酯泡沫本质上不稳定。它特别容易受到光损伤，到1990年代中期，吉拉尔迪的南瓜、玫瑰和其他造型正在崩解和粉碎。博物馆把其中一些锁在黑暗中保存。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.</p>\n<h3>意群划分 · 第5段</h3>\n<p>So van Oosten / and her colleagues / worked to preserve / Gilardi&#39;s sculptures.</p>\n<p>They infused some / with stabilizing / and consolidating chemicals.</p>\n<p>Van Oosten calls / those chemicals / &quot;sunscreens&quot; / because their goal / was to prevent / further light damage / and rebuild / worn polymer fibers.</p>\n<p>She is proud / that several sculptures / have even gone on display again, / albeit sometimes / beneath protective cases.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>所以范·奥斯滕 / 和她的同事们 / 努力保护 / 吉拉尔迪的雕塑。</p>\n<p>他们给一些作品注入 / 稳定 / 和加固化学品。</p>\n<p>范·奥斯滕称呼 / 这些化学品 / &quot;防晒霜&quot; / 因为它们的目标 / 是防止 / 进一步的光损伤 / 并重建 / 磨损的聚合物纤维。</p>\n<p>她感到自豪 / 几件雕塑 / 甚至再次展出了，/ 尽管有时 / 在保护罩下面。</p>\n<h3>标准译文 · 第5段</h3>\n<p>所以范·奥斯滕和她的同事们努力保护吉拉尔迪的雕塑。他们给一些作品注入稳定和加固化学品。范·奥斯滕称这些化学品为&quot;防晒霜&quot;，因为它们的目标是防止进一步的光损伤并重建磨损的聚合物纤维。她感到自豪的是，几件雕塑甚至再次展出了，尽管有时需要放在保护罩下面。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Despite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Despite success stories / like van Oosten&#39;s, / preservation of plastics / will likely get harder.</p>\n<p>Old objects / continue to deteriorate.</p>\n<p>Worse, / biodegradable plastics / designed to disintegrate, / are increasingly common.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>尽管有成功案例 / 像范·奥斯滕的，/ 塑料保护 / 可能会变得更困难。</p>\n<p>旧物品 / 继续恶化。</p>\n<p>更糟的是，/ 可生物降解塑料 / 设计用来分解的，/ 越来越普遍。</p>\n<h3>标准译文 · 第6段</h3>\n<p>尽管有像范·奥斯滕这样的成功案例，塑料保护可能会变得更困难。旧物品继续恶化。更糟的是，设计用来分解的可生物降解塑料越来越普遍。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<h3>意群划分 · 第7段</h3>\n<p>And more is at stake here / than individual objects.</p>\n<p>Joana Lia Ferreira, / an assistant professor / of conservation and restoration / at the NOVA School / of Science and Technology, / notes that / archaeologists first defined / the great material ages / of human history— / Stone Age, / Iron Age, / and so on— / after examining artifacts / in museums.</p>\n<p>We now live / in an age of plastic, / she says, / &quot;and what we decide / to collect today, / what we decide / to preserve... / will have a strong impact / on how in the future / we&#39;ll be seen.&quot;</p>\n<h3>意群翻译 · 第7段</h3>\n<p>而且这里涉及的更多 / 不仅仅是个别物品。</p>\n<p>乔安娜·利亚·费雷拉，/ 一位助理教授 / 保护和修复专业的 / 在NOVA学院 / 科学与技术的，/ 指出 / 考古学家首先定义了 / 伟大的材料时代 / 人类历史的—— / 石器时代、/ 铁器时代 / 等等—— / 在检查文物之后 / 在博物馆中。</p>\n<p>我们现在生活 / 在塑料时代，/ 她说，/ &quot;我们决定 / 今天收集什么，/ 我们决定 / 保存什么…… / 将产生重大影响 / 对于未来如何 / 我们会被看待。&quot;</p>\n<h3>标准译文 · 第7段</h3>\n<p>而且这里涉及的不仅仅是个别物品。NOVA科学与技术学院保护和修复专业的助理教授乔安娜·利亚·费雷拉指出，考古学家是在检查博物馆中的文物之后，才首先定义了人类历史的伟大材料时代——石器时代、铁器时代等等。她说，我们现在生活在塑料时代，&quot;我们今天决定收集什么，决定保存什么……将对未来我们如何被看待产生重大影响。&quot;</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>People often complain：(that plastics are too durable).</p>\n<p>Water bottles + shopping bags + other trash → litter the planet：(from Mount Everest to the Mariana Trench)：(because plastics are everywhere + don&#39;t break down easily).</p>\n<p>But some plastic materials → change over time.</p>\n<p>They crack and frizzle.</p>\n<p>They &quot;weep&quot; out additives.</p>\n<p>They melt into sludge.</p>\n<p>All of which → creates huge headaches：(for institutions：(such as museums)：(trying to preserve culturally important objects)).</p>\n<p>The variety：(of plastic objects at risk) → is dizzying：early radios + avant-garde sculptures + celluloid animation stills：(from Disney films) + the first artificial heart.</p>\n<p><strong>第2段</strong></p>\n<p>Certain artifacts → are especially vulnerable：(because some pioneers：(in plastic art) → didn&#39;t always know：(how to mix ingredients properly))，says Thea van Oosten：(a polymer chemist：(who, until retiring a few years ago → worked for decades：(at the Cultural Heritage Agency：(of the Netherlands)))).</p>\n<p>&quot;It&#39;s like baking a cake：If you don&#39;t have → exact amounts → it goes wrong，&quot; → she says.</p>\n<p>&quot;The object you make → is already a time bomb.&quot;</p>\n<p><strong>第3段</strong></p>\n<p>And sometimes → it&#39;s not the artist&#39;s fault.</p>\n<p>In the 1960s → the Italian artist Picro Gilardi → began to create → hundreds of bright, colorful foam pieces.</p>\n<p>Those pieces included → small beds of roses + other items + a few dozen &quot;nature carpets&quot;：(large rectangles：(decorated with foam pumpkins + cabbages + watermelons)).</p>\n<p>He wanted viewers → to walk around：(on the carpets) — which meant → they had to be durable.</p>\n<p><strong>第4段</strong></p>\n<p>Unfortunately → the polyurethane foam：(he used) → is inherently unstable.</p>\n<p>It&#39;s especially vulnerable：(to light damage) + by the mid-1990s → Gilardi&#39;s pumpkins + roses + other figures → were spitting and crumbling.</p>\n<p>Museums locked → some of them away：(in the dark).</p>\n<p><strong>第5段</strong></p>\n<p>So van Oosten + her colleagues → worked to preserve：(Gilardi&#39;s sculptures).</p>\n<p>They infused some：(with stabilizing + consolidating chemicals).</p>\n<p>Van Oosten calls → those chemicals → &quot;sunscreens&quot;：(because their goal → was to prevent：(further light damage) + rebuild：(worn polymer fibers)).</p>\n<p>She is proud：(that several sculptures → have even gone on display again)，albeit sometimes：(beneath protective cases).</p>\n<p><strong>第6段</strong></p>\n<p>Despite success stories：(like van Oosten&#39;s) // preservation of plastics → will likely get harder.</p>\n<p>Old objects → continue to deteriorate.</p>\n<p>Worse → biodegradable plastics：(designed to disintegrate) → are increasingly common.</p>\n<p><strong>第7段</strong></p>\n<p>And more is at stake here → than individual objects.</p>\n<p>Joana Lia Ferreira：(an assistant professor：(of conservation and restoration)：(at the NOVA School：(of Science and Technology))) → notes：(that archaeologists first defined → the great material ages：(of human history) — Stone Age + Iron Age + so on — after examining artifacts：(in museums)).</p>\n<p>We now live：(in an age of plastic) → she says → &quot;and what we decide：(to collect today) + what we decide：(to preserve) → will have a strong impact：(on how in the future → we&#39;ll be seen).&quot;</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>人们经常抱怨：(塑料太耐用了)。</p>\n<p>水瓶 + 购物袋 + 其他垃圾 → 遍布地球：(从珠穆朗玛峰到马里亚纳海沟)：(因为塑料无处不在 + 不容易分解)。</p>\n<p>但一些塑料材料 → 会随时间变化。</p>\n<p>它们会开裂和卷曲。</p>\n<p>它们会&quot;渗出&quot;添加剂。</p>\n<p>它们会融化成污泥。</p>\n<p>所有这些 → 给机构带来巨大困扰：(对于机构来说：(比如博物馆)：(试图保存具有文化重要性的物品))。</p>\n<p>种类：(处于风险中的塑料物品的) → 令人眼花缭乱：早期收音机 + 前卫雕塑 + 赛璐珞动画胶片：(来自迪士尼电影的) + 第一颗人工心脏。</p>\n<p><strong>第2段</strong></p>\n<p>某些文物 → 特别脆弱：(因为一些先驱：(在塑料艺术方面) → 并不总是知道：(如何正确混合成分))，西娅·范·奥斯滕说：(一位聚合物化学家：(她，直到几年前退休 → 工作了几十年：(在文化遗产局：(荷兰的))))。</p>\n<p>&quot;这就像烤蛋糕：如果你没有 → 精确的分量 → 就会出错，&quot; → 她说。</p>\n<p>&quot;你制作的物品 → 已经是一个定时炸弹。&quot;</p>\n<p><strong>第3段</strong></p>\n<p>有时候 → 这不是艺术家的错。</p>\n<p>在1960年代 → 意大利艺术家皮克罗·吉拉尔迪 → 开始创作 → 数百件明亮、多彩的泡沫作品。</p>\n<p>这些作品包括 → 小型玫瑰花床 + 其他物品 + 几十块&quot;自然地毯&quot;：(大型长方形：(装饰着泡沫南瓜 + 卷心菜 + 西瓜))。</p>\n<p>他希望观众 → 在上面走动：(在地毯上) —— 这意味着 → 它们必须耐用。</p>\n<p><strong>第4段</strong></p>\n<p>不幸的是 → 聚氨酯泡沫：(他使用的) → 本质上不稳定。</p>\n<p>它特别容易受到：(光损伤) + 到1990年代中期 → 吉拉尔迪的南瓜 + 玫瑰 + 其他造型 → 正在崩解和粉碎。</p>\n<p>博物馆锁起了 → 其中一些：(在黑暗中)。</p>\n<p><strong>第5段</strong></p>\n<p>所以范·奥斯滕 + 她的同事们 → 努力保护：(吉拉尔迪的雕塑)。</p>\n<p>他们给一些作品注入：(稳定 + 加固化学品)。</p>\n<p>范·奥斯滕称呼 → 这些化学品 → &quot;防晒霜&quot;：(因为它们的目标 → 是防止：(进一步的光损伤) + 重建：(磨损的聚合物纤维))。</p>\n<p>她感到自豪：(几件雕塑 → 甚至再次展出了)，尽管有时：(在保护罩下面)。</p>\n<p><strong>第6段</strong></p>\n<p>尽管有成功案例：(像范·奥斯滕的) // 塑料保护 → 可能会变得更困难。</p>\n<p>旧物品 → 继续恶化。</p>\n<p>更糟的是 → 可生物降解塑料：(设计用来分解的) → 越来越普遍。</p>\n<p><strong>第7段</strong></p>\n<p>而且这里涉及的更多 → 不仅仅是个别物品。</p>\n<p>乔安娜·利亚·费雷拉：(一位助理教授：(保护和修复专业的)：(在NOVA学院：(科学与技术的))) → 指出：(考古学家首先定义了 → 伟大的材料时代：(人类历史的) —— 石器时代 + 铁器时代 + 等等 —— 在检查文物之后：(在博物馆中))。</p>\n<p>我们现在生活：(在塑料时代) → 她说 → &quot;我们决定：(今天收集什么) + 我们决定：(保存什么) → 将产生重大影响：(对于未来如何 → 我们会被看待)。&quot;</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第2段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Certain artifacts / are especially vulnerable / because some pioneers / in plastic art / didn&#39;t always know / how to mix ingredients properly, / says Thea van Oosten, / a polymer chemist / who, until retiring / a few years ago, / worked for decades / at the Cultural Heritage Agency / of the Netherlands.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>某些文物 / 特别脆弱 / 因为一些先驱 / 在塑料艺术方面 / 并不总是知道 / 如何正确混合成分，/ 西娅·范·奥斯滕说，/ 一位聚合物化学家 / 她，直到退休 / 几年前，/ 工作了几十年 / 在文化遗产局 / 荷兰的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>because说明易损原因，says后的化学家身份和工作经历是信息来源背景。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>某些文物  特别脆弱  因为一些先驱  在塑料艺术方面  并不总是知道  如何正确混合成分， 西娅·范·奥斯滕说， 一位聚合物化学家  她，直到退休  几年前， 工作了几十年  在文化遗产局  荷兰的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>某些制品特别易损，因为早期制作者不总懂得准确配料。</p>\n</blockquote>\n<p>先说判断与原因，再交代专家身份，避免长修饰语冲淡因果。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>荷兰文化遗产局工作了几十年、几年前刚退休的聚合物化学家西娅·范·奥斯滕说，某些文物特别脆弱，因为塑料艺术的一些先驱并不总是知道如何正确混合成分。&quot;</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>didn’t always不是从来不懂；certain限定部分制品，不能扩大到所有塑料艺术。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>荷兰文化遗产局工作了几十年、几年前刚退休的聚合物化学家西娅·范·奥斯滕说，某些文物特别脆弱，因为塑料艺术的一些先驱并不总是知道如何正确混合成分。&quot;</p>\n</blockquote>\n<h2>2. 第5段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Van Oosten calls / those chemicals / &quot;sunscreens&quot; / because their goal / was to prevent / further light damage / and rebuild / worn polymer fibers.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>范·奥斯滕称呼 / 这些化学品 / &quot;防晒霜&quot; / 因为它们的目标 / 是防止 / 进一步的光损伤 / 并重建 / 磨损的聚合物纤维。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>because解释称作防晒剂的理由，prevent与rebuild是并列目的。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>范·奥斯滕称呼  这些化学品  &quot;防晒霜&quot;  因为它们的目标  是防止  进一步的光损伤  并重建  磨损的聚合物纤维。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这些化学品旨在阻止进一步光损并修复受损纤维。</p>\n</blockquote>\n<p>先说比喻称呼，再把防损与修复两种作用说明白。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>范·奥斯滕称这些化学品为&quot;防晒霜&quot;，因为它们的目标是防止进一步的光损伤并重建磨损的聚合物纤维。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>goal是处理目标，不代表所有作品已经完全恢复。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>范·奥斯滕称这些化学品为&quot;防晒霜&quot;，因为它们的目标是防止进一步的光损伤并重建磨损的聚合物纤维。</p>\n</blockquote>\n<h2>3. 第7段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history— Stone Age, Iron Age, and so on— after examining artifacts in museums.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Joana Lia Ferreira, / an assistant professor / of conservation and restoration / at the NOVA School / of Science and Technology, / notes that / archaeologists first defined / the great material ages / of human history— / Stone Age, / Iron Age, / and so on— / after examining artifacts / in museums.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>乔安娜·利亚·费雷拉，/ 一位助理教授 / 保护和修复专业的 / 在NOVA学院 / 科学与技术的，/ 指出 / 考古学家首先定义了 / 伟大的材料时代 / 人类历史的—— / 石器时代、/ 铁器时代 / 等等—— / 在检查文物之后 / 在博物馆中。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把身份插入语与notes主句分开，after examining说明判断时代的证据来源。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>乔安娜·利亚·费雷拉， 一位助理教授  保护和修复专业的  在NOVA学院  科学与技术的， 指出  考古学家首先定义了  伟大的材料时代  人类历史的——  石器时代、 铁器时代  等等——  在检查文物之后  在博物馆中。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>考古学家通过博物馆遗物来界定人类的材料时代。</p>\n</blockquote>\n<p>先说明Ferreira的观点，再说考古学家如何由遗物认识历史。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>NOVA科学与技术学院保护和修复专业的助理教授乔安娜·利亚·费雷拉指出，考古学家是在检查博物馆中的文物之后，才首先定义了人类历史的伟大材料时代——石器时代、铁器时代等等。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>Stone Age与Iron Age是既往例子，为后文今天的保存影响未来认识铺垫。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>NOVA科学与技术学院保护和修复专业的助理教授乔安娜·利亚·费雷拉指出，考古学家是在检查博物馆中的文物之后，才首先定义了人类历史的伟大材料时代——石器时代、铁器时代等等。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>21题</h2>\n<blockquote>\n<p>According to Paragraph 1, museums are faced with difficulties in ______.</p>\n<p>根据第1段，博物馆在______方面面临困难。</p>\n</blockquote>\n<h3>题型</h3>\n<p>困难内容细节题：把材料变化接回preserve，分清保存、取得、分类三种动作。</p>\n<p>题干明确写出Paragraph 1，直接读第1段。museums出现在preserve culturally important objects这句话中，前面连续描述塑料随时间发生的变化。先把整段读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But some plastic materials change over time.</p>\n<p>All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects.</p>\n<p>People often complain that plastics are too durable.</p>\n</blockquote>\n<h3>A. maintaining their plastic items</h3>\n<blockquote>\n<p>博物馆面临的困难在于维护塑料藏品。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>塑料开裂、渗出添加剂或化成黏浆，都使保存文化物品困难。maintaining their plastic items对应博物馆的preserve工作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆面临的困难在于维护塑料藏品。</p>\n</blockquote>\n<p><code>maintaining</code>指物品的维护，能接上第1段<code>preserve culturally important objects</code>所说的保存工作，因此回看塑料发生变化后给博物馆带来困扰的那句话。</p>\n<p>原文先说有些塑料随时间变化，随后把这些变化与博物馆保存文化物品时遇到的<code>huge headaches</code>连起来。<code>preserve culturally important objects</code>是博物馆正在做的事；本项的<code>maintaining their plastic items</code>也把困难放在维护塑料物品上。两边的对象和困难所在的工作能够对应，变化的每一种具体形式并不影响这个连接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n</blockquote>\n<p>开头用环境中难降解的塑料引入反差，But转到部分塑料会变坏，All of which把这些变化接到保存困扰。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums face difficulties in maintaining their plastic items.</p>\n<p>博物馆面临的困难在于维护塑料藏品。</p>\n</blockquote>\n<p>A保留物品、保存动作及困难的关系；不必将每种损坏都逐字写进选项，也没有把问题扩大为所有藏品无法保存。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. obtaining durable plastic artifacts</h3>\n<blockquote>\n<p>博物馆面临的困难在于获得耐用塑料艺术品。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文说已经需要保存的物品会变坏，B却说难以取得耐用艺术品，把保存阶段换成获取阶段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆面临的困难在于获得耐用塑料艺术品。</p>\n</blockquote>\n<p><code>durable</code>在第1段开头出现，而<code>obtaining</code>说的是取得物品；要把它接到博物馆身上，还得回看写<code>museums</code>正在做什么的<code>preserve culturally important objects</code>一句。</p>\n<p>原文开头是人们抱怨塑料过于耐用，转折后才说有些塑料会变化，并给博物馆<code>preserve culturally important objects</code>这项保存工作带来困难。本项却把博物馆的工作改成<code>obtaining</code>，声称困难在于取得耐用艺术品。物品保存过程中会变坏，不等于取得这些物品的过程有困难；原文给出的博物馆动作是保存，并没有建立采购或获取与困难的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n</blockquote>\n<p>too durable先属于人们对环境垃圾的抱怨，转折后博物馆遇到的是某些塑料发生变化造成的保存困难。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums face difficulties in obtaining durable plastic artifacts.</p>\n<p>博物馆面临的困难在于获得耐用塑料艺术品。</p>\n</blockquote>\n<p>B需要采购、收集或取得物品受阻的证据。物品难保存不等于难获得，开头的durable也不是博物馆采购标准的说明。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. handling outdated plastic exhibits</h3>\n<blockquote>\n<p>博物馆面临的困难在于处理过时塑料展品。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>outdated指过时，change over time指材料变化。年代早的收音机仍有文化意义，不能因此当作落伍展品来处理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆面临的困难在于处理过时塑料展品。</p>\n</blockquote>\n<p><code>handling</code>可以包括馆藏处理工作，但<code>outdated</code>说的是物品已经过时。第1段用<code>change over time</code>说明塑料随时间变化，又列出<code>early radios</code>等物品，因此回看变化与保存困难相连的句子，并核对物品清单。</p>\n<p>原文的<code>change over time</code>描述塑料材料自身发生变化，博物馆因此难以保存具有文化意义的物品。列出的<code>early radios</code>说明有些物品年代较早。</p>\n<p>本项的<code>outdated</code>却把展品说成已经过时，把困难理解为处理这类展品。</p>\n<p>年代较早和材料随时间变化，都没有说明这些文化物品因落后于时代而需要处理；本段明确连接的是材料变化与保存困难。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n</blockquote>\n<p>作者列举早期技术与前卫艺术等多类物品，是为展示哪些文化藏品面临劣化风险。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums face difficulties in handling outdated plastic exhibits.</p>\n<p>博物馆面临的困难在于处理过时塑料展品。</p>\n</blockquote>\n<p>C需要把过时作为处理难题的原因。实际困难来自材料开裂、渗出等变化，历史年代与保存价值没有被作者对立起来。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. classifying their plastic collections</h3>\n<blockquote>\n<p>博物馆面临的困难在于给塑料藏品分类。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>variety说明面临风险的物品种类多，headaches却直接连到preserve，未说博物馆不知道怎样给藏品分类。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆面临的困难在于给塑料藏品分类。</p>\n</blockquote>\n<p><code>classifying</code>指分类，第1段末尾的<code>The variety of plastic objects</code>确实引出不同种类的物品；要判断是否在说分类困难，还要回看前一句把<code>huge headaches</code>接到<code>preserve</code>上的表述。</p>\n<p>原文的<code>The variety of plastic objects</code>引出面临风险的物品种类，列举的作用是说明保存问题涉及哪些物品；前一句已经把困扰连到<code>preserve</code>这项保存工作。本项的<code>classifying</code>则说博物馆分不清这些藏品应归到哪一类。物品涉及不同类别，并不等于分类本身出现困难；它把物品清单与博物馆困难接成了原文没有建立的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n</blockquote>\n<p>材料变化先产生保存问题，随后多种实例扩展问题范围，没有另起分类任务。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums face difficulties in classifying their plastic collections.</p>\n<p>博物馆面临的困难在于给塑料藏品分类。</p>\n</blockquote>\n<p>D需要归类标准或类别辨认上的困难。列出多种藏品只能说明问题广泛，不能把列举形式改成分类障碍。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. A</strong></p>\n</blockquote>\n<ul>\n<li>A：塑料开裂、渗出添加剂或化成黏浆，都使保存文化物品困难。maintaining their plastic items对应博物馆的preserve工作。</li>\n<li>B：原文说已经需要保存的物品会变坏，B却说难以取得耐用艺术品，把保存阶段换成获取阶段。</li>\n<li>C：outdated指过时，change over time指材料变化。年代早的收音机仍有文化意义，不能因此当作落伍展品来处理。</li>\n<li>D：variety说明面临风险的物品种类多，headaches却直接连到preserve，未说博物馆不知道怎样给藏品分类。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>Van Oosten believes that certain plastic objects are ______.</p>\n<p>范·奥斯滕认为，某些塑料物品是______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点题：用配料说明及定时炸弹比喻判断某些成品已有的隐患。</p>\n<p>题干点名Van Oosten，并问certain plastic objects。第2段以Certain artifacts开头，随后给出她对这些物品及制作过程的说明，因此整段读第2段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n<p>The object you make is already a time bomb.</p>\n<p>some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n</blockquote>\n<h3>A. immune to decay</h3>\n<blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>especially vulnerable是尤其脆弱，time bomb表示成形时已有隐患，immune to decay却说不会腐坏，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p><code>immune to decay</code>表示不受腐坏影响，而第2段用<code>especially vulnerable</code>评价<code>certain artifacts</code>，因此回看这句及其关于配料的解释。</p>\n<p>原文先把这些艺术品说成<code>especially vulnerable</code>，说明它们尤其容易受损，再以配料不当解释其原因，并把做出的物品比作定时炸弹。本项的<code>immune to decay</code>却说这类物品能免受腐坏。一个是作品成形时就埋下损坏隐患，一个是不会受到腐坏影响，评价方向相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n</blockquote>\n<p>配料方法不当先解释脆弱，再借蛋糕用量类比说明制作时就可能埋下失败因素。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Certain plastic objects are immune to decay.</p>\n<p>Van Oosten认为某些塑料物品不会腐坏。</p>\n</blockquote>\n<p>A需要作品不受劣化影响的保证。原文反而强调随作品一起形成的风险，并不是称赞这些物品耐久。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. improperly shaped</h3>\n<blockquote>\n<p>Van Oosten认为某些塑料物品形状制作不当。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>improperly shaped说外形制作不当，原文mix ingredients和exact amounts谈原料混合与用量，问题所在环节不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品形状制作不当。</p>\n</blockquote>\n<p><code>improperly shaped</code>谈的是物品成形后的形状，第2段的<code>mix ingredients properly</code>则谈制作中的原料混合；两者都涉及制作，因此回到她解释脆弱原因的第一句核对具体步骤。</p>\n<p>原文把问题放在<code>mix ingredients properly</code>，即如何恰当混合原料；烤蛋糕的类比进一步强调<code>exact amounts</code>，用量需要准确。本项的<code>improperly shaped</code>把问题移到了物品的形状上。配料方法和用量不当导致物品脆弱，并不能改写成物品的外形制作有误。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n</blockquote>\n<p>化学家以烘焙作类比，关键不是蛋糕造型，而是比例不准会使制作结果出问题。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Certain plastic objects are improperly shaped.</p>\n<p>Van Oosten认为某些塑料物品形状制作不当。</p>\n</blockquote>\n<p>B需要形状不合要求的说明。配料比例影响材料稳定性，不能仅因都在制作中发生就改成外形错误。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. inherently flawed</h3>\n<blockquote>\n<p>Van Oosten认为某些塑料物品本身已有缺陷。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>物品做出来时already a time bomb，说明脆弱隐患已在成品内部。inherently flawed概括这些特定物品自带缺陷。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品本身已有缺陷。</p>\n</blockquote>\n<p><code>inherently flawed</code>强调物品自身已经带有问题，第2段的<code>already a time bomb</code>把隐患放在物品刚做出来的时候，因此回看她关于配料的说明和最后这句比喻。</p>\n<p>原文先说明有些创作者不会恰当配料，随后说做出的物品<code>already a time bomb</code>，意味着隐患已经随制作结果留在物品之中。本项的<code>inherently flawed</code>说的是这些物品自身带有缺陷，可以概括这种在作品成形时就形成的脆弱性；它没有把缺陷扩大成所有塑料物品都必然具有。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n</blockquote>\n<p>原料搭配失当形成风险，最后的定时炸弹比喻将风险时间明确放在制成之初。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Certain plastic objects are inherently flawed.</p>\n<p>Van Oosten认为某些塑料物品本身已有缺陷。</p>\n</blockquote>\n<p>C的对象是certain plastic objects，并非所有塑料；inherently在这里说成品本身已有缺陷，不是说缺陷一定与制作方法无关。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. complex in structure</h3>\n<blockquote>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>配料需要准确不等于成品结构复杂。作者解释的是原料比例失当导致脆弱，未评价内部结构的复杂程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p><code>complex in structure</code>是在评价成品结构，第2段提到<code>mix ingredients properly</code>和<code>exact amounts</code>，涉及原料与用量，因此回看这两处，看她是否把制作问题归于结构复杂。</p>\n<p>原文说创作者不总是懂得恰当配料，并以<code>exact amounts</code>说明用量不准确会出问题。它建立的是配料方法不当与物品脆弱的关系。本项的<code>complex in structure</code>却把物品概括成结构复杂；需要精确用量说明制作有要求，不能据此把成品内部的结构评价为复杂。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n</blockquote>\n<p>类比从混合方法推进到用量不准，最后说明制成物有隐患，整条因果都围绕配制质量。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Certain plastic objects are complex in structure.</p>\n<p>Van Oosten认为某些塑料物品结构复杂。</p>\n</blockquote>\n<p>D需要构造层级或结构复杂性的证据。制造需要精确与结构复杂可以相关
