ms locked some of them away in the dark.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p><code>hurting visitors</code>中的参观者能接到第3段的<code>viewers</code>，但伤害说法还需要核对谁受到损伤；因此连着看观众走上地毯的设想，以及第4段<code>vulnerable to light damage</code>之后的收起作品动作。</p>\n<p>第3段说艺术家希望<code>viewers</code>在地毯上走动，所以作品必须耐用。第4段的<code>vulnerable to light damage</code>则把受损对象放在泡沫材料上，之后博物馆将作品收在暗处。</p>\n<p>本项的<code>hurting visitors</code>把受损对象换成观众，并把作品变成伤害人的来源。</p>\n<p>原文从光照损伤接到避光存放，说明的是作品自身的处境，不是观众受到伤害。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p>有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。</p>\n<p>遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。</p>\n</blockquote>\n<p>艺术家希望作品耐用，实际材料对光脆弱并已碎坏，博物馆于是将部分作品收在暗处。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums stopped displaying the artworks to keep them from hurting visitors.</p>\n<p>博物馆撤下部分Gilardi作品是为了防止作品伤害观众。</p>\n</blockquote>\n<p>A需要作品伤人风险来解释撤展。原文的dark直接回应light damage，目的在保护作品，而非保护人免遭作品伤害。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. duplicate them for future display</h3>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p><code>duplicate</code>指制作复制品，需要核对第4段<code>Museums locked some of them away in the dark</code>所写的博物馆行动，看其中是否包含复制安排。</p>\n<p>原文先说材料容易受到光照损伤，随后说博物馆把部分作品<code>locked some of them away in the dark</code>，行动是收起原作并置于暗处。本项的<code>duplicate them for future display</code>则增加了制作复制品、安排未来展出的连续计划。把原作收在暗处针对的是光照问题，不能改接成制作另一些作品的工序。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p>有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。</p>\n<p>遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。</p>\n</blockquote>\n<p>材料不稳定、对光敏感先说明受损原因，随后博物馆采取减少光照的措施。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums stopped displaying the artworks to duplicate them for future display.</p>\n<p>博物馆撤下部分Gilardi作品是为了复制作品供日后展出。</p>\n</blockquote>\n<p>B需要复制原作的行动或意图。后来修复后重新展出仍是保存原作的成果，也不能倒推最初撤展为了复制。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. have their ingredients analyzed</h3>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了分析作品的成分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;\nAnd sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了分析作品的成分。</p>\n</blockquote>\n<p><code>ingredients analyzed</code>说的是分析原料，第2段的<code>mix ingredients properly</code>也涉及原料，但谈的是配料；题干的博物馆行动却在第4段，所以把那段已读的配料说明与<code>locked some of them away in the dark</code>对照。</p>\n<p>第2段的<code>mix ingredients properly</code>说一些创作者不懂得恰当混合原料，用来解释部分物品为何脆弱。第4段则从光照损伤写到博物馆把吉拉尔迪的部分作品置于暗处。</p>\n<p>本项的<code>ingredients analyzed</code>把前面的原料话题接成博物馆后来要做的成分分析。</p>\n<p>原文没有把配料知识不足与这次收起作品建立这种目的关系；暗处存放直接回应的是光照损伤。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;\nAnd sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p>聚合物化学家Thea van Oosten说，某些艺术品尤其脆弱，因为一些塑料艺术先驱并不总懂得恰当混合原料。她退休前曾在荷兰文化遗产机构工作数十年。她将其比作烤蛋糕：用量不精确就会出问题，做出的物品已经是一颗定时炸弹。</p>\n<p>有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。</p>\n<p>遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。</p>\n</blockquote>\n<p>第三段介绍创作意图，第四段转到材料本身不稳定及光照损伤，再写存入暗处。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums stopped displaying the artworks to have their ingredients analyzed.</p>\n<p>博物馆撤下部分Gilardi作品是为了分析作品的成分。</p>\n</blockquote>\n<p>C需要从撤展到成分检测的目的关系。知道材料有问题，不等于这次避光存放就是为了分析原料。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. prevent them from further damage</h3>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品受到进一步损伤。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>作品尤其易受光损，且已出现碎坏，存入暗处可以减少继续光照，D对应防止进一步损伤的目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>博物馆撤下部分Gilardi作品是为了防止作品受到进一步损伤。</p>\n</blockquote>\n<p>作品尤其易受光损，且已出现碎坏，存入暗处可以减少继续光照，D对应防止进一步损伤的目的。</p>\n<p>作品原本须经得住观众走动，实际材料却不稳定；受损之后的dark与前面的light damage形成直接对应。</p>\n<p>D没有说避光能使既有损伤自动消失，而是防止further damage，准确保留保护行动所针对的后续风险。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\nUnfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p>有时这并非艺术家的过错。20世纪60年代，意大利艺术家Gilardi开始制作数百件色彩鲜艳的泡沫作品，包括小片玫瑰花床和其他物件，以及几十件自然地毯：在大长方形上装饰泡沫南瓜、卷心菜和西瓜。他希望观众在地毯上走动，这意味着作品必须耐用。</p>\n<p>遗憾的是，他使用的聚氨酯泡沫本身不稳定，尤其容易受光照损伤。到20世纪90年代中期，他的南瓜、玫瑰等造型已在破损、碎裂。博物馆将其中一些锁在暗处。</p>\n</blockquote>\n<p>作品原本须经得住观众走动，实际材料却不稳定；受损之后的dark与前面的light damage形成直接对应。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Museums stopped displaying the artworks to prevent them from further damage.</p>\n<p>博物馆撤下部分Gilardi作品是为了防止作品受到进一步损伤。</p>\n</blockquote>\n<p>D没有说避光能使既有损伤自动消失，而是防止further damage，准确保留保护行动所针对的后续风险。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. D</strong></p>\n</blockquote>\n<ul>\n<li>A：希望观众在作品上行走说明原本用途，受光损伤的却是泡沫作品。A将受损者换成观众。</li>\n<li>B：收起并放在暗处是对原作的避光保护，B另加制作复制品和今后展出的计划。</li>\n<li>C：前段配料不当解释某些作品脆弱，Gilardi实例却以并非艺术家过错开头；撤展直接回应光损，未说要分析成分。</li>\n<li>D：作品尤其易受光损，且已出现碎坏，存入暗处可以减少继续光照，D对应防止进一步损伤的目的。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>The author thinks that preservation of plastics is ______.</p>\n<p>作者认为，塑料的保存是______的。</p>\n</blockquote>\n<h3>题型</h3>\n<p>评价推断题：区分难度、成本、价值和受欢迎程度，按harder及后文原因判断。</p>\n<p>题干问作者怎样看待preservation of plastics。粗读时第6段留下preservation of plastics与will likely get harder，直接谈保存工作的前景。第6段开头提到van Oosten的成功故事，需要连着读前面的第5段，明确作者怎样从这一实例转到总体判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>with stabilizing and consolidating chemicals</p>\n<p>their goal was to prevent further light damage and rebuild worn polymer fibers</p>\n<p>preservation of plastics will likely get harder</p>\n</blockquote>\n<h3>A. costly</h3>\n<blockquote>\n<p>作者认为塑料保存工作费用高昂。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作费用高昂。</p>\n</blockquote>\n<p>稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</p>\n<p>作者先写注入化学品以防光损、重建纤维，再以Despite指出旧物继续劣化、可降解塑料增多。</p>\n<p>A需要材料价格、人工费用或总体支出的说明。stabilizing与consolidating都是作用，不能将未知词补成昂贵属性，D才对应harder。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<p>因此Van Oosten和同事着手保存Gilardi的雕塑。他们给部分作品注入稳定、加固化学品。她称其为防晒霜，因为目的是防止进一步光损并重建受损的聚合物纤维。她为几件雕塑甚至已能重新展出感到自豪，尽管有时仍须放在保护罩下。</p>\n<p>尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。</p>\n</blockquote>\n<p>作者先写注入化学品以防光损、重建纤维，再以Despite指出旧物继续劣化、可降解塑料增多。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is costly.</p>\n<p>作者认为塑料保存工作费用高昂。</p>\n</blockquote>\n<p>A需要材料价格、人工费用或总体支出的说明。stabilizing与consolidating都是作用，不能将未知词补成昂贵属性，D才对应harder。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. unworthy</h3>\n<blockquote>\n<p>作者认为塑料保存工作不值得进行。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者肯定文化物品重要、修复成功及历史价值，困难增加没有被写成不值得保存。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.\nAnd more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作不值得进行。</p>\n</blockquote>\n<p><code>unworthy</code>评价保存有没有价值，需把第6段的<code>success stories</code>与前面第1段的<code>culturally important objects</code>合看：前者评价保存实例，后者说明被保存物品的意义。</p>\n<p>第1段把保存对象称为<code>culturally important objects</code>，第5段写一些雕塑重新展出，第6段又把这类实践称为<code>success stories</code>，然后才提醒保存会更难。作者承认物品的文化意义和保存成功。</p>\n<p>本项的<code>unworthy</code>却说这件事不值得做，把对难度的担忧改成对保存价值的否定。</p>\n<p>保存困难与保存没有价值是不同判断，原文的转折并没有撤回前面的文化价值和成功评价。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.\nAnd more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>因此Van Oosten和同事着手保存Gilardi的雕塑。他们给部分作品注入稳定、加固化学品。她称其为防晒霜，因为目的是防止进一步光损并重建受损的聚合物纤维。她为几件雕塑甚至已能重新展出感到自豪，尽管有时仍须放在保护罩下。</p>\n<p>尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>尽管修复使部分作品重展，保存挑战仍会扩大；最后又强调保存选择影响后人理解时代。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is unworthy.</p>\n<p>作者认为塑料保存工作不值得进行。</p>\n</blockquote>\n<p>B需要作者否定保存价值。实际难度与意义并存，Despite保留成功后再谈困难，并不撤回文化价值。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. unpopular</h3>\n<blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p><code>unpopular</code>评价人们是否欢迎这项工作，第1段<code>People often complain</code>确实出现人们的抱怨；要看清抱怨的对象，并与第6段<code>preservation of plastics will likely get harder</code>对照。</p>\n<p>第1段<code>People often complain</code>后面接的是<code>plastics are too durable</code>，人们抱怨塑料过于耐用，随后谈的是塑料垃圾遍布各处。第6段则评价保存塑料的工作会更难。</p>\n<p>本项的<code>unpopular</code>把人们对塑料耐久性及垃圾问题的不满，改接成对塑料保存工作的不欢迎。</p>\n<p>抱怨的对象换了，工作难度也并不表示公众赞成或反对这项工作。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<p>人们常抱怨塑料太耐久。水瓶、购物袋和其他垃圾遍布地球，从珠峰到马里亚纳海沟，因为塑料到处都是且不易分解。但有些塑料随时间改变：开裂、卷缩、渗出添加剂，或融成黏浆。这使博物馆等努力保存重要文化物品的机构十分头痛。面临风险的塑料物品种类繁多，包括早期收音机、前卫雕塑、迪士尼电影的赛璐珞动画画片及首个人工心脏。</p>\n<p>尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。</p>\n</blockquote>\n<p>首段先写污染背景，再用But转到馆藏易损，后文始终讨论保护难度与意义。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is unpopular.</p>\n<p>作者认为塑料保存工作不受欢迎。</p>\n</blockquote>\n<p>C需要公众反对保存工作的态度。材料带来环境问题，不意味着人们不欢迎博物馆保护具有文化价值的物品。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. challenging</h3>\n<blockquote>\n<p>作者认为塑料保存工作具有挑战性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为塑料保存工作具有挑战性。</p>\n</blockquote>\n<p><code>challenging</code>是在说工作难做，第6段的<code>will likely get harder</code>直接评价保存难度，因此回看这个转折句，并结合第5段的实际修复目标。</p>\n<p>第5段显示保存需要防止进一步损伤、重建已经受损的纤维；第6段即使承认成功实例，仍判断<code>will likely get harder</code>。原文把塑料保存看成难度还可能上升的工作。本项的<code>challenging</code>正是对这种工作困难的概括，没有把困难另外限定成某一种具体原因。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\nDespite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<p>因此Van Oosten和同事着手保存Gilardi的雕塑。他们给部分作品注入稳定、加固化学品。她称其为防晒霜，因为目的是防止进一步光损并重建受损的聚合物纤维。她为几件雕塑甚至已能重新展出感到自豪，尽管有时仍须放在保护罩下。</p>\n<p>尽管有Van Oosten这样的成功案例，塑料保存很可能会更难。旧物继续劣化；更糟的是，被设计成会分解的可生物降解塑料越来越常见。</p>\n</blockquote>\n<p>成功修复不是终点，Despite和Worse引出仍在扩大、甚至更难控制的材料问题。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preserving plastics is challenging.</p>\n<p>作者认为塑料保存工作具有挑战性。</p>\n</blockquote>\n<p>D并不否认已有成功，也没说所有保护都会失败；它保留面对复杂损坏和材料变化的工作难度。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. D</strong></p>\n</blockquote>\n<ul>\n<li>A：稳定、加固化学品说明处理功能，并未说明价格昂贵。保存更难也不自动等于费用高，A缺少具体成本证据。</li>\n<li>B：作者肯定文化物品重要、修复成功及历史价值，困难增加没有被写成不值得保存。</li>\n<li>C：人们抱怨的是环境中塑料太耐久，未说保存文化藏品不受欢迎。C把抱怨对象从垃圾耐久移到保存工作。</li>\n<li>D：旧物继续劣化，易分解的新塑料增多，will likely get harder明确评价保存挑战。challenging概括这组困难。</li>\n</ul>\n<h2>25题</h2>\n<blockquote>\n<p>In Ferreira’s opinion, preservation of plastic artifacts ______.</p>\n<p>在费雷拉看来，保存塑料人造物品______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点推断题：将过去遗物的作用与未来认识塑料时代连起来，区分行动与影响发生的时间。</p>\n<p>题干点名Ferreira，第7段出现Joana Lia Ferreira并引用她的话，因此整段读第7段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>after examining artifacts in museums</p>\n<p>will have a strong impact on how in the future we&#39;ll be seen</p>\n<p>the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums</p>\n</blockquote>\n<h3>A. will inspire future scientific research</h3>\n<blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p><code>future</code>与第7段的<code>how in the future we&#39;ll be seen</code>相接，但<code>inspire scientific research</code>还要核对未来发生的具体事情，因此回看她说保存决定将产生什么影响的最后一句。</p>\n<p>原文先用过去考察博物馆物品后划分材料时代的事情作说明，再说今天的保存决定会影响<code>how in the future we&#39;ll be seen</code>，即未来的人怎样看待我们。本项的<code>inspire future scientific research</code>则把这种影响具体改成激发未来科学研究。未来形成的时代印象与科学研究受到启发不是同一个结果；原文写清的是保存的物品怎样影响对我们这个时代的认识，没有把保存活动接成开启科研的动力。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>Ferreira先用考古学家根据遗物认识材料时代作类比，再把今天保存塑料接到未来对当代的理解。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preservation of plastic artifacts will inspire future scientific research.</p>\n<p>Ferreira认为保存塑料物品将激发未来科学研究。</p>\n</blockquote>\n<p>A需要保存物品启发新科研的说明。考察遗物可以属于研究过程，但不能因此把这里明确的历史认识影响改成激发科研。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. has profound historical significance</h3>\n<blockquote>\n<p>Ferreira认为保存塑料物品具有深远历史意义。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>过去遗物帮助认识材料时代，今天塑料藏品又将影响后人理解我们的时代，B概括超越单件物品的深远历史意义。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品具有深远历史意义。</p>\n</blockquote>\n<p><code>historical significance</code>对应第7段<code>human history</code>中的材料时代，<code>profound</code>又需与最后一句<code>strong impact</code>连着看，因此回看她怎样从过去的博物馆物品谈到未来对塑料时代的认识。</p>\n<p>原文用<code>human history</code>中的材料时代说明：博物馆物品能够帮助后人认识并划分一个时代；我们现在又生活在塑料时代，今天保留哪些物品，将对未来怎样看待我们产生<code>strong impact</code>。本项的<code>profound historical significance</code>把这条跨越过去、现在与未来的关系概括成深远的历史意义。这里的重要性超过单个物品，因为留下的材料关系到一个时代的历史形象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>more...than individual objects先扩大意义，过去的石器、铁器时代与当下塑料时代再形成类比。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preservation of plastic artifacts has profound historical significance.</p>\n<p>Ferreira认为保存塑料物品具有深远历史意义。</p>\n</blockquote>\n<p>B将strong impact和human history连成历史意义，没有说今天重新划分全部时代，也没有将影响时间改成现在。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. will help us separate the material ages</h3>\n<blockquote>\n<p>Ferreira认为保存塑料物品将帮助我们区分各个材料时代。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>划分材料时代是过去考古学家借物品完成的事例，当前保存塑料的重点是未来如何理解我们。C把事例挪成今后的直接任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品将帮助我们区分各个材料时代。</p>\n</blockquote>\n<p><code>separate the material ages</code>能接到第7段<code>first defined the great material ages</code>，但选项说的是将帮助我们做什么，所以还要看她随后怎样说明今天保存物品的影响。</p>\n<p>原文的<code>first defined the great material ages</code>说的是过去通过考察物品划分材料时代，用来说明物品如何影响历史认识。接着她明确说现在是塑料时代，今天的保存选择会影响未来的人如何看待我们。</p>\n<p>本项的<code>will help us separate the material ages</code>却把过去的例子移成我们今后的任务，仿佛保存塑料是为了让我们再区分各个材料时代。</p>\n<p>原文当前讨论的是塑料时代将留下怎样的历史形象，不是我们如何重新完成时代划分。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>先交代过去怎样认识历史，再说明我们身处塑料时代以及今天选择留下什么证据。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preservation of plastic artifacts will help us separate the material ages.</p>\n<p>Ferreira认为保存塑料物品将帮助我们区分各个材料时代。</p>\n</blockquote>\n<p>C需要说我们借保存塑料去区分各个时代。实际未来认识的对象是当代塑料时代，过去划分时代只用于说明遗物的重要性。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. has an impact on today’s cultural life</h3>\n<blockquote>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>today修饰收藏保存的选择，in the future限定人们看待我们的时间。D把今天从行动时间改成影响发生时间。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p><code>has an impact</code>与第7段<code>have a strong impact</code>直接相接，但<code>today’s cultural life</code>限定了影响的时间和对象，因此回看<code>today</code>所在的收藏动作与<code>impact</code>后面的<code>how in the future we&#39;ll be seen</code>这一未来结果。</p>\n<p>原文的<code>today</code>修饰我们今天决定收藏什么，<code>have a strong impact</code>之后却明确接<code>how in the future we&#39;ll be seen</code>，受影响的是未来的人如何看待我们。本项的<code>today’s cultural life</code>把今天从做决定的时间移到了影响发生的时间，同时把未来对我们这个时代的认识换成当下文化生活。它保留了影响这个动作，却改变了影响落到哪里。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<p>这里涉及的不只是单件物品。NOVA科技学院保护与修复助理教授Joana Lia Ferreira指出，考古学家先是考察博物馆遗物，才界定人类历史的石器、铁器等重要材料时代。她说，我们现在生活在塑料时代；今天决定收藏、保存什么，会强烈影响未来人们怎样看待我们。</p>\n</blockquote>\n<p>今天留下哪些物品，将塑造未来可用于理解当代的材料，作者强调跨越时间的历史后果。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Preservation of plastic artifacts has an impact on today’s cultural life.</p>\n<p>Ferreira认为保存塑料物品影响今天的文化生活。</p>\n</blockquote>\n<p>D需要当下文化生活如何改变的说明。原文确实有文化价值，却未将这项强烈影响落在今天的文化生活上。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>25题结论</h3>\n<blockquote>\n<p><strong>25. B</strong></p>\n</blockquote>\n<ul>\n<li>A：未来的人怎样看待我们，是对时代的历史认识；激发科学研究则是新的活动与动力，原文未建立这一结果。</li>\n<li>B：过去遗物帮助认识材料时代，今天塑料藏品又将影响后人理解我们的时代，B概括超越单件物品的深远历史意义。</li>\n<li>C：划分材料时代是过去考古学家借物品完成的事例，当前保存塑料的重点是未来如何理解我们。C把事例挪成今后的直接任务。</li>\n<li>D：today修饰收藏保存的选择，in the future限定人们看待我们的时间。D把今天从行动时间改成影响发生时间。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：塑料保护的悖论</strong>（段落1核心问题） 塑料的矛盾特性：【通常太耐用（污染环境）// 但文化物品中的塑料会劣化：（开裂、渗出添加剂、融化）】→ 给博物馆带来巨大困扰 → 风险物品种类繁多：（早期收音机、前卫雕塑、迪士尼动画胶片、人工心脏）</p>\n<p>↓（原因分析）</p>\n<p><strong>逻辑层次2：塑料文物脆弱的根源</strong>（段落2-4具体案例） 内在原因：早期艺术家不懂正确混合成分 → 比喻：&quot;像烤蛋糕&quot;→ 结果：&quot;定时炸弹&quot; + 外在案例：【吉拉尔迪的泡沫艺术品：（1960年代创作&quot;自然地毯&quot;供人行走）→ 材料问题：（聚氨酯泡沫本质不稳定 + 易受光损）→ 后果：（1990年代作品崩解）→ 博物馆被迫将其锁在黑暗中】</p>\n<p>↓（保护努力）</p>\n<p><strong>逻辑层次3：保护工作的成果与方法</strong>（段落5保护技术） 范·奥斯滕团队的努力：注入稳定和加固化学品（称为&quot;防晒霜&quot;）→ 目标：（防止光损 + 重建聚合物纤维）→ 成果：部分雕塑重新展出（虽然需要保护罩）</p>\n<p>//（未来挑战）</p>\n<p><strong>逻辑层次4：保护工作面临的挑战</strong>（段落6未来困境） 尽管有成功案例 // 但保护会更困难：【旧物品继续恶化 + 可生物降解塑料（设计用来分解）越来越普遍】</p>\n<p>↑（历史意义）</p>\n<p><strong>逻辑层次5：塑料保护的历史重要性</strong>（段落7深层意义） 超越个别物品的意义：费雷拉的观点：【考古学家通过博物馆文物定义材料时代（石器、铁器等）→ 我们生活在塑料时代 → 今天的收集和保存决定将影响未来如何看待我们这个时代】</p>\n<p>全文核心观点：塑料文物保护面临独特挑战——塑料既因太耐用而污染环境，又会在文化物品中劣化。尽管有技术进步，但保护工作将更加困难。这项工作具有深远的历史意义，因为它将决定未来如何理解我们的&quot;塑料时代&quot;。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Why some objects carry problems from the start</p>\n<p>B. Preserving the evidence through which an age will be understood</p>\n<p>C. A contrast between environmental persistence and museum fragility</p>\n<p>D. A complete cure that ends every preservation challenge</p>\n<p>E. Artistic intentions frustrated by an unstable material</p>\n<p>F. Successful treatment alongside increasing difficulties</p>\n<p>G. Why all plastic objects should be discarded immediately</p>\n<p><strong>41.</strong></p>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don&#39;t break down easily. But some plastic materials change over time. They crack and frizzle. They &quot;weep&quot; out additives. They melt into sludge. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n<p><strong>42.</strong></p>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. &quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says. &quot;The object you make is already a time bomb.&quot;</p>\n<p><strong>43.</strong></p>\n<p>And sometimes, it&#39;s not the artist&#39;s fault. In the 1960s, the Italian artist Picro Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen &quot;nature carpets&quot; —large rectangles decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable. Unfortunately, the polyurethane foam he used is inherently unstable. It&#39;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#39;s pumpkins, roses, and other figures were spitting and crumbling. Museums locked some of them away in the dark.</p>\n<p><strong>44.</strong></p>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures. They infused some with stabilizing and consolidating chemicals. Van Oosten calls those chemicals &quot;sunscreens&quot; because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases. Despite success stories like van Oosten&#39;s, preservation of plastics will likely get harder. Old objects continue to deteriorate. Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n<p><strong>45.</strong></p>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. A contrast between environmental persistence and museum fragility</p>\n<blockquote>\n<p>环境中的难降解与博物馆中的易损形成反差</p>\n</blockquote>\n<p>开头用人们抱怨塑料耐久与某些塑料会劣化作转折，列举博物馆需要保存的文化物品。</p>\n<blockquote>\n<p>People often complain that plastics are too durable.</p>\n</blockquote>\n<p>开头too durable从环境垃圾不易降解说起，But转到一些塑料反而会随时间变坏。</p>\n<blockquote>\n<p>They &quot;weep&quot; out additives.</p>\n</blockquote>\n<p>weep out additives是材料劣化的一种具体表现，和开裂、融化一起解释博物馆为何头痛。</p>\n<blockquote>\n<p>The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.</p>\n</blockquote>\n<p>列举跨越技术、艺术和医学的藏品，扩大保护风险涉及范围，标题需保留环境耐久与馆藏脆弱的反差。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>环境中难降解 → 部分塑料会劣化 → 文化藏品面临保存风险</p>\n</blockquote>\n<p>contrast对应But，museum fragility对应开裂、析出与保存困扰。</p>\n<p>再看最强干扰项G：Why all plastic objects should be discarded immediately。</p>\n<p>文中强调文化保存价值，未建议全部丢弃。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】A. Why some objects carry problems from the start</p>\n<blockquote>\n<p>为何部分物品从制作之初就有隐患</p>\n</blockquote>\n<p>化学家把配料比例不当比作烘焙失误，定时炸弹说明隐患已在制作时进入成品。</p>\n<blockquote>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#39;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands.</p>\n</blockquote>\n<p>because直接将某些艺术品的脆弱接到原料混合不当，说明一种损坏来源。</p>\n<blockquote>\n<p>&quot;It&#39;s like baking a cake: If you don&#39;t have exact amounts, it goes wrong,&quot; she says.</p>\n</blockquote>\n<p>烘焙类比的关键是exact amounts，配料比例不准会影响制作结果，而不是外形不好看。</p>\n<blockquote>\n<p>&quot;The object you make is already a time bomb.&quot;</p>\n</blockquote>\n<p>already把定时炸弹隐患放在制成之初，标题要概括初始制作缺陷。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>配料知识不足 → 用量失准 → 成品从开始就有隐患</p>\n</blockquote>\n<p>from the start对应object ... already a time bomb，限定certain objects。</p>\n<p>再看最强干扰项D：A complete cure that ends every preservation challenge。</p>\n<p>这里说明隐患原因，未提供彻底治愈方案。</p>\n<p><strong>42题选A。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】E. Artistic intentions frustrated by an unstable material</p>\n<blockquote>\n<p>不稳定材料使艺术创作意图受挫</p>\n</blockquote>\n<p>艺术家希望观众行走其上，需要耐用材料；但所用泡沫不稳定并易受光损，作品最终被避光保存。</p>\n<blockquote>\n<p>And sometimes, it&#39;s not the artist&#39;s fault.</p>\n</blockquote>\n<p>not the artist&#39;s fault承接前段制作失误，却转出材料本身也可能有问题。</p>\n<blockquote>\n<p>He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n</blockquote>\n<p>观众行走的用途要求作品耐用，先建立艺术家的合理创作意图。</p>\n<blockquote>\n<p>Museums locked some of them away in the dark.</p>\n</blockquote>\n<p>暗处存放回应泡沫对光敏感和碎坏，显示材料不稳定使原本互动展示的意图受挫。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>希望观众走上耐用作品 → 泡沫本身易受光损 → 撤展避光保护</p>\n</blockquote>\n<p>intentions对应walk around和durable，frustrated对应Unfortunately后的劣化。</p>\n<p>再看最强干扰项A：Why some objects carry problems from the start。</p>\n<p>此处特别先说并非总是艺术家的错，重点是材料固有不稳定，不可全归配料失误。</p>\n<p><strong>43题选E。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Successful treatment alongside increasing difficulties</p>\n<blockquote>\n<p>修复成功与困难增加同时存在</p>\n</blockquote>\n<p>团队注入稳定加固化学品使部分作品重展，Despite转出旧物继续劣化与可降解材料增加。</p>\n<blockquote>\n<p>So van Oosten and her colleagues worked to preserve Gilardi&#39;s sculptures.</p>\n</blockquote>\n<p>So将修复行动接到前面的受损和避光存放，化学处理目标是防损及重建纤维。</p>\n<blockquote>\n<p>She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.</p>\n</blockquote>\n<p>重新展出证明部分修复成功，albeit又保留仍需保护罩的条件。</p>\n<blockquote>\n<p>Worse, biodegradable plastics designed to disintegrate, are increasingly common.</p>\n</blockquote>\n<p>Worse进一步增加困难：新材料本身被设计成可分解；标题需同时保留成功和挑战增大，不能只概括修复胜利。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>化学稳定加固 → 部分作品重新展出 → 旧物劣化与新材料分解使困难增加</p>\n</blockquote>\n<p>alongside保留成功不等于问题结束的对照，increasing difficulties对应harder与Worse。</p>\n<p>再看最强干扰项D：A complete cure that ends every preservation challenge。</p>\n<p>第六段明确说更难，不存在终结所有挑战的疗法。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Preserving the evidence through which an age will be understood</p>\n<blockquote>\n<p>保存后人理解一个时代所依据的证据</p>\n</blockquote>\n<p>从单件物品转向历史时代认识：过去由遗物划分时代，今天的收藏将影响后人如何认识塑料时代。</p>\n<blockquote>\n<p>And more is at stake here than individual objects.</p>\n</blockquote>\n<p>more...than individual objects明确把讨论提升到超越单件藏品的意义。</p>\n<blockquote>\n<p>Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums.</p>\n</blockquote>\n<p>考古学家根据遗物划分材料时代，说明保留物品如何影响历史认识。</p>\n<blockquote>\n<p>We now live in an age of plastic, she says, &quot;and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we&#39;ll be seen.&quot;</p>\n</blockquote>\n<p>今天保存什么影响未来如何看待塑料时代，标题应抓住给后人留下理解时代的证据。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>遗物帮助认识过去材料时代 → 今天选择保存塑料 → 塑造后人对当代的理解</p>\n</blockquote>\n<p>evidence对应artifacts，an age对应对今天塑料时代的未来认识。</p>\n<p>再看最强干扰项G：Why all plastic objects should be discarded immediately。</p>\n<p>保存有深远历史意义，与立即全丢弃相反。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Plastic creates two apparently opposite problems. Waste can remain in the environment for a long time, yet some culturally important plastic objects deteriorate inside museums. Their instability threatens collections ranging from early technologies to modern art, making preservation a complicated task.</p>\n<p><strong>B.</strong></p>\n<p>One source of that instability lies in how an object was made. Early users of plastic did not always understand the proportions needed when mixing ingredients. A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.</p>\n<p><strong>C.</strong></p>\n<p>These successes do not mean that preservation will become easier. Older objects continue to decline, and newer biodegradable plastics are designed to break apart. A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.</p>\n<p><strong>D.</strong></p>\n<p>The value of meeting those challenges extends beyond saving individual works. Archaeologists have used surviving objects to understand earlier material ages. The plastics selected for preservation today will similarly influence the evidence available to people trying to understand our own period.</p>\n<p><strong>E.</strong></p>\n<p>The foam used for those installations proved inherently unstable and vulnerable to light. As the figures cracked and crumbled, museums moved some works into darkness. Withholding them from view was a protective response to deterioration, not a decision that the works had lost cultural value.</p>\n<p><strong>F.</strong></p>\n<p>Not every failure, however, is the artist’s fault. An artist may deliberately seek a durable material because viewers are expected to interact with the work. Gilardi’s colourful foam installations illustrate this intention: some were designed so that people could walk around on them.</p>\n<p><strong>G.</strong></p>\n<p>Protection was also attempted through chemical treatment. Conservators introduced substances intended to stabilise the material and rebuild weakened fibres. Some sculptures could later be displayed again, although protective cases were still needed in certain instances.</p>\n<p><strong>H.</strong></p>\n<p>Preservation choices therefore help shape a future account of the present. They determine not only which objects remain intact but which aspects of a plastic-dependent society can be studied. Difficulty is a reason for careful conservation decisions, rather than proof that the effort lacks significance.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出环境耐久与馆藏易损的反差</td>\n</tr>\n<tr>\n<td>B</td>\n<td>解释配料不当造成初始隐患</td>\n</tr>\n<tr>\n<td>C</td>\n<td>承认成功同时说明挑战仍扩大</td>\n</tr>\n<tr>\n<td>D</td>\n<td>把保存单件物品拓展到历史认识证据</td>\n</tr>\n<tr>\n<td>E</td>\n<td>说明泡沫光损及避光保护</td>\n</tr>\n<tr>\n<td>F</td>\n<td>转出并非全是艺术家过错并介绍创作意图</td>\n</tr>\n<tr>\n<td>G</td>\n<td>介绍加固处理及有限重展成功</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结收藏保存选择塑造未来历史叙述</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出环境耐久与馆藏易损的反差 → 解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图 → 说明泡沫光损及避光保护 → 介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据 → 总结收藏保存选择塑造未来历史叙述</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → B → F → E → G → C → D → H</strong></p>\n<p>41—45：B、F、G、C、D。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → B → F。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their instability threatens collections ranging from early technologies to modern art, making preservation a complicated task.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>One source of that instability lies in how an object was made.</p>\n</blockquote>\n<p>前段Their instability已提出馆藏不稳定，One source of that instability准确承接并开始解释一个原因。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Early users of plastic did not always understand the proportions needed when mixing ingredients. A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.</p>\n</blockquote>\n<p>不懂原料比例导致制作结果含有隐患，therefore建立因果，蛋糕类比将配比问题具体化。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>Not every failure, however, is the artist’s fault.</p>\n</blockquote>\n<p>Not every failure...artist&#39;s fault中的every构成限制，承接当前制作失误后转向另一种原因。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出环境耐久与馆藏易损的反差 → 解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Protection was also attempted through chemical treatment.</p>\n</blockquote>\n<p>化学处理是损坏之后的保护行动，这里先解释为什么会不稳定，直接放修复会使后面的not every failure缺少关于艺术家制作过错的背景。</p>\n<p><strong>41题选B。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为B → F → E。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>A badly prepared material can therefore contain the seeds of failure from the beginning, rather like a cake made with the wrong quantities.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Not every failure, however, is the artist’s fault.</p>\n</blockquote>\n<p>前段把失败隐患归于配制失当，Not every failure用however转出不能都归责艺术家。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>An artist may deliberately seek a durable material because viewers are expected to interact with the work. Gilardi’s colourful foam installations illustrate this intention: some were designed so that people could walk around on them.</p>\n</blockquote>\n<p>艺术家为观众互动而追求耐用，Gilardi作品供人行走具体说明这种意图。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The foam used for those installations proved inherently unstable and vulnerable to light.</p>\n</blockquote>\n<p>The foam used for those installations回指刚介绍的泡沫装置，再揭示其材料不稳定。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释配料不当造成初始隐患 → 转出并非全是艺术家过错并介绍创作意图 → 说明泡沫光损及避光保护</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Protection was also attempted through chemical treatment.</p>\n</blockquote>\n<p>chemical treatment应接在光损和保护需求之后，此处还需建立创作意图及装置，后面those installations才有明确所指。</p>\n<p><strong>42题选F。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Withholding them from view was a protective response to deterioration, not a decision that the works had lost cultural value.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Protection was also attempted through chemical treatment.</p>\n</blockquote>\n<p>前段说撤展是protective response，Protection was also attempted承接同一保护目标并增加另一种手段。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Conservators introduced substances intended to stabilise the material and rebuild weakened fibres. Some sculptures could later be displayed again, although protective cases were still needed in certain instances.</p>\n</blockquote>\n<p>注入化学品为稳定材料、重建纤维，随后部分作品重展说明效果，although保留需保护罩的限制。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>These successes do not mean that preservation will become easier.</p>\n</blockquote>\n<p>These successes直接指刚写的重展成果，下一段才用这些成果转向困难未必减少。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明泡沫光损及避光保护 → 介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>The value of meeting those challenges extends beyond saving individual works.</p>\n</blockquote>\n<p>保存价值的讨论在挑战之后才上升到历史层面，这里先补修复成功，否则These successes没有可以回指的结果。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → C → D。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Some sculptures could later be displayed again, although protective cases were still needed in certain instances.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>These successes do not mean that preservation will become easier.</p>\n</blockquote>\n<p>前段部分作品重展，These successes回指成果并用do not mean限制能由此推出的结论。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Older objects continue to decline, and newer biodegradable plastics are designed to break apart. A technique effective for one material cannot simply cancel the widening range of challenges faced by a collection.</p>\n</blockquote>\n<p>旧物继续衰退，新塑料又可分解，后句据此说一种处理技术不能消除藏品范围内不断扩大的挑战。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The value of meeting those challenges extends beyond saving individual works.</p>\n</blockquote>\n<p>those challenges回指本段widening range of challenges，再转向应对这些困难的价值。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍加固处理及有限重展成功 → 承认成功同时说明挑战仍扩大 → 把保存单件物品拓展到历史认识证据</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>One source of that instability lies in how an object was made.</p>\n</blockquote>\n<p>配制不当是前面已介绍的损坏原因，此处要说明成功之后仍有何困难，不能退回起因而丢失对成功的转折。</p>\n<p><strong>44题选C。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为C → D → H。</p>\n<p>先看前段C的结尾：</p>\n<bloc
