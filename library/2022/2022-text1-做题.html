<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 21题题干\n\n**According to Paragraph 1, museums are faced with difficulties in ______.**\n\n> 根据第1段，博物馆在______方面面临困难。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,495,1031,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"},"html":"<h2>21题题干</h2>\n<p><strong>According to Paragraph 1, museums are faced with difficulties in ______.</strong></p>\n<blockquote><p>根据第1段，博物馆在______方面面临困难。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 22题题干\n\n**Van Oosten believes that certain plastic objects are ______.**\n\n> 范·奥斯滕认为，某些塑料物品是______。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,810,816,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"},"html":"<h2>22题题干</h2>\n<p><strong>Van Oosten believes that certain plastic objects are ______.</strong></p>\n<blockquote><p>范·奥斯滕认为，某些塑料物品是______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 23题题干\n\n**Museums stopped exhibiting some of Gilardi’s artworks to ______.**\n\n> 博物馆停止展出吉拉尔迪的部分艺术品，是为了______。\n\n题型：**原因目的题**。","articleRects":[],"questionRects":[[226,1126,1035,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"},"html":"<h2>23题题干</h2>\n<p><strong>Museums stopped exhibiting some of Gilardi’s artworks to ______.</strong></p>\n<blockquote><p>博物馆停止展出吉拉尔迪的部分艺术品，是为了______。</p>\n</blockquote>\n<p>题型：<strong>原因目的题</strong>。</p>\n"},{"section":"先读题干","raw":"## 24题题干\n\n**The author thinks that preservation of plastics is ______.**\n\n> 作者认为，塑料的保存是______的。\n\n题型：**观点推断题**。","articleRects":[],"questionRects":[[226,1441,774,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"},"html":"<h2>24题题干</h2>\n<p><strong>The author thinks that preservation of plastics is ______.</strong></p>\n<blockquote><p>作者认为，塑料的保存是______的。</p>\n</blockquote>\n<p>题型：<strong>观点推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 25题题干\n\n**In Ferreira’s opinion, preservation of plastic artifacts ______.**\n\n> 在费雷拉看来，保存塑料人造物品______。\n\n题型：**观点推断题**。","articleRects":[],"questionRects":[[226,1756,846,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"},"html":"<h2>25题题干</h2>\n<p><strong>In Ferreira’s opinion, preservation of plastic artifacts ______.</strong></p>\n<blockquote><p>在费雷拉看来，保存塑料人造物品______。</p>\n</blockquote>\n<p>题型：<strong>观点推断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, Unfortunately, Despite |\n| 态度词／评价词 | 先抓个大概好坏 | vulnerable, unstable, harder |\n| 动作词 | 先看谁做了什么 | preserve, prevent, rebuild |\n| 结果词 | 看最后出了什么事 | damage, risk, impact |\n| 重复主题词 | 大概知道老在说什么 | plastics, museums, objects |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, Unfortunately, Despite</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>vulnerable, unstable, harder</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>preserve, prevent, rebuild</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>damage, risk, impact</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>plastics, museums, objects</td></tr></tbody></table>\n"},{"section":"读文章","raw":"People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don’t break down easily. But some plastic materials change over time. They crack and **[xxx]**. They “weep” out **[xxx]**. They melt into **[xxx]**. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is **[xxx]**: early radios, **[xxx]** sculptures, **[xxx]** animation **[xxx]** from Disney films, the first artificial heart.","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don’t break down easily. But some plastic materials change over time. They crack and <strong>[xxx]</strong>. They “weep” out <strong>[xxx]</strong>. They melt into <strong>[xxx]</strong>. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is <strong>[xxx]</strong>: early radios, <strong>[xxx]</strong> sculptures, <strong>[xxx]</strong> animation <strong>[xxx]</strong> from Disney films, the first artificial heart.</p>\n</div></div>"},{"section":"读文章","raw":"People o 望观众、在地毯上四处走动；尤其易受光照损伤、博物馆锁起其中一些、尤其易受光照损伤、博物馆锁起其中一些；致力于保存吉拉尔迪的雕塑、防止进一步的光照损伤、防止进一步的光照损伤、重建受损的聚合物纤维；塑料的保存、很可能变得更难、塑料的保存、很可能变得更难；结尾还有这里牵涉更多、超过单个物品、我们今天决定收藏什么、将产生强烈影响。</p>\n<p>到这里还不能自然地说清楚：塑料的材料变化与博物馆保存工作怎样联系，几个例子各在说明什么，结尾为什么谈到历史时代。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"21题","raw":"## 21题\n\n> According to Paragraph 1, museums are faced with difficulties in ______.  \n> 根据第1段，博物馆在______方面面临困难。\n\n题干明确写出Paragraph 1，直接读第1段。museums出现在preserve culturally important objects这句话中，前面连续描述塑料随时间发生的变化。先把整段读完。\n\n> 原文参考：\n> \n> People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don’t break down easily. But some plastic materials change over time. They crack and **[xxx]**. They “weep” out **[xxx]**. They melt into **[xxx]**. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is **[xxx]**: early radios, **[xxx]** sculptures, **[xxx]** animation **[xxx]** from Disney films, the first artificial heart.\n> \n> 开始精读：\n> \n> People often complain / that plastics are too durable. / Water bottles, shopping bags, and other trash / litter the planet, / from Mount Everest to the Mariana Trench, / because plastics are everywhere / and don’t break down easily. / But some plastic materials change over time. / They crack and **[xxx]**. / They “weep” out **[xxx]**. / They melt into **[xxx]**. / All of which creates huge headaches for institutions, / such as museums, / trying to preserve culturally important objects. / The variety of plastic objects at risk is **[xxx]**: / early radios, / **[xxx]** sculptures, / **[xxx]** animation **[xxx]** from Disney films, / the first artificial heart.\n> \n> 人们常常抱怨 / 塑料太耐用了。 / 水瓶、购物袋以及其他垃圾 / 散落在地球各处， / 从珠穆朗玛峰到马里亚纳海沟， / 因为塑料无处不在 / 而且不易分解。 / 但有些塑料材料会随着时间变化。 / 它们开裂并**[xxx]**。 / 它们“渗出”**[xxx]**。 / 它们融化成**[xxx]**。 / 所有这些都给一些机构造成极大困扰， / 比如博物馆， / 这些机构试图保存具有文化意义的重要物品。 / 面临风险的塑料物品种类**[xxx]**： / 早期收音机， / **[xxx]**雕塑， / 迪士尼电影中的**[xxx]**动画**[xxx]**， / 第一颗人工心脏。\n\ndifficulties要接出博物馆做哪件事时遇到困难。第1段用All of which把塑料的变化与博物馆的huge headaches连起来，需要看它怎样说明保存文化物品的难处。\n\n接下来按A—D逐项看。","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38]],"questionRects":[[226,495,1031,38],[292,548,491,37],[292,600,532,38],[292,653,535,38],[292,705,551,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"21","initialReadingPids":[0]},"html":"<h2>21题</h2>\n<blockquote><p>According to Paragraph 1, museums are faced with difficulties in ______.<br />\n根据第1段，博物馆在______方面面临困难。</p>\n</blockquote>\n<p>题干明确写出Paragraph 1，直接读第1段。museums出现在preserve culturally important objects这句话中，前面连续描述塑料随时间发生的变化。先把整段读完。</p>\n<blockquote><p>原文参考：</p>\n<p>People often complain that plastics are too durable. Water bottles, shopping bags, and other trash litter the planet, from Mount Everest to the Mariana Trench, because plastics are everywhere and don’t break down easily. But some plastic materials change over time. They crack and <strong>[xxx]</strong>. They “weep” out <strong>[xxx]</strong>. They melt into <strong>[xxx]</strong>. All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects. The variety of plastic objects at risk is <strong>[xxx]</strong>: early radios, <strong>[xxx]</strong> sculptures, <strong>[xxx]</strong> animation <strong>[xxx]</strong> from Disney films, the first artificial heart.</p>\n<p>开始精读：</p>\n<p>People often complain / that plastics are too durable. / Water bottles, shopping bags, and other trash / litter the planet, / from Mount Everest to the Mariana Trench, / because plastics are everywhere / and don’t break down easily. / But some plastic materials change over time. / They crack and <strong>[xxx]</strong>. / They “weep” out <strong>[xxx]</strong>. / They melt into <strong>[xxx]</strong>. / All of which creates huge headaches for institutions, / such as museums, / trying to preserve culturally important objects. / The variety of plastic objects at risk is <strong>[xxx]</strong>: / early radios, / <strong>[xxx]</strong> sculptures, / <strong>[xxx]</strong> animation <strong>[xxx]</strong> from Disney films, / the first artificial heart.</p>\n<p>人们常常抱怨 / 塑料太耐用了。 / 水瓶、购物袋以及其他垃圾 / 散落在地球各处， / 从珠穆朗玛峰到马里亚纳海沟， / 因为塑料无处不在 / 而且不易分解。 / 但有些塑料材料会随着时间变化。 / 它们开裂并<strong>[xxx]</strong>。 / 它们“渗出”<strong>[xxx]</strong>。 / 它们融化成<strong>[xxx]</strong>。 / 所有这些都给一些机构造成极大困扰， / 比如博物馆， / 这些机构试图保存具有文化意义的重要物品。 / 面临风险的塑料物品种类<strong>[xxx]</strong>： / 早期收音机， / <strong>[xxx]</strong>雕塑， / 迪士尼电影中的<strong>[xxx]</strong>动画<strong>[xxx]</strong>， / 第一颗人工心脏。</p>\n</blockquote>\n<p>difficulties要接出博物馆做哪件事时遇到困难。第1段用All of which把塑料的变化与博物馆的huge headaches连起来，需要看它怎样说明保存文化物品的难处。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"21题","raw":"### A. maintaining their plastic items\n\n> 维护馆内的塑料物品\n\n把A接回题干，它说的是：博物馆在维护馆内的塑料物品方面面临困难。\n\nA说维护塑料物品。第1段`huge headaches`后紧跟博物馆`trying to preserve`，我们先读前面的物品出了什么问题。\n\n> But some plastic materials change over time.\n\n> All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects.\n\n有些塑料会随时间变化，开裂、渗出物质，甚至融化。作者把这些变化一起用`All of which`接到机构的头痛上。\n\n机构正在努力保存有文化意义的物品，所以难题是如何让已经收藏的东西保持下来，而不是怎样把它们买到手。\n\nA的`maintaining`正对应保存、维护。早期收音机、雕塑等例子也都是需要留存、却正在有损伤风险的东西。\n\n**塑料物品不断发生材料变化，使努力保存它们的博物馆头痛，困难是不是在维护保存上？**\n\n是。A同时对应物品的变化和博物馆正在做的保存工作。\n\n**第一轮判断：A保留。**","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38]],"questionRects":[[292,548,491,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"21","paragraphPids":[0]},"html":"<h3>A. maintaining their plastic items</h3>\n<blockquote><p>维护馆内的塑料物品</p>\n</blockquote>\n<p>把A接回题干，它说的是：博物馆在维护馆内的塑料物品方面面临困难。</p>\n<p>A说维护塑料物品。第1段<code>huge headaches</code>后紧跟博物馆<code>trying to preserve</code>，我们先读前面的物品出了什么问题。</p>\n<blockquote><p>But some plastic materials change over time.</p>\n</blockquote>\n<blockquote><p>All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects.</p>\n</blockquote>\n<p>有些塑料会随时间变化，开裂、渗出物质，甚至融化。作者把这些变化一起用<code>All of which</code>接到机构的头痛上。</p>\n<p>机构正在努力保存有文化意义的物品，所以难题是如何让已经收藏的东西保持下来，而不是怎样把它们买到手。</p>\n<p>A的<code>maintaining</code>正对应保存、维护。早期收音机、雕塑等例子也都是需要留存、却正在有损伤风险的东西。</p>\n<p><strong>塑料物品不断发生材料变化，使努力保存它们的博物馆头痛，困难是不是在维护保存上？</strong></p>\n<p>是。A同时对应物品的变化和博物馆正在做的保存工作。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"21题","raw":"### B. obtaining durable plastic artifacts\n\n> 获得耐用的塑料艺术品\n\n把B接回题干，它说的是：博物馆在获得耐用的塑料艺术品方面面临困难。\n\nB说难以获得耐用塑料艺术品。第1段既有`durable`，又有博物馆，我们看这两个内容怎样接起来。\n\n> People often complain that plastics are too durable.\n\n> But some plastic materials change over time.\n\n> trying to preserve culturally important objects\n\n开头说人们常抱怨塑料过于耐久，是在说废物难降解。`But`之后转到另一些材料会开裂、融化，给保存工作添麻烦。\n\n原文没有说博物馆因买不到耐用品而困难。它说的是一些已有文化价值的物品会逐渐改变，难以维持原状。\n\nB把保存中的困难换成取得藏品的困难，也把开头普通人的耐久抱怨接错了位置。\n\n**博物馆正努力保存会变坏的物品，等于它们找不到可以买到的耐用品吗？**\n\n不等于。原文的困难在保存过程中，B换成了获取物品。\n\n**第一轮判断：B排除。**","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38]],"questionRects":[[292,600,532,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>B. obtaining durable plastic artifacts</h3>\n<blockquote><p>获得耐用的塑料艺术品</p>\n</blockquote>\n<p>把B接回题干，它说的是：博物馆在获得耐用的塑料艺术品方面面临困难。</p>\n<p>B说难以获得耐用塑料艺术品。第1段既有<code>durable</code>，又有博物馆，我们看这两个内容怎样接起来。</p>\n<blockquote><p>People often complain that plastics are too durable.</p>\n</blockquote>\n<blockquote><p>But some plastic materials change over time.</p>\n</blockquote>\n<blockquote><p>trying to preserve culturally important objects</p>\n</blockquote>\n<p>开头说人们常抱怨塑料过于耐久，是在说废物难降解。<code>But</code>之后转到另一些材料会开裂、融化，给保存工作添麻烦。</p>\n<p>原文没有说博物馆因买不到耐用品而困难。它说的是一些已有文化价值的物品会逐渐改变，难以维持原状。</p>\n<p>B把保存中的困难换成取得藏品的困难，也把开头普通人的耐久抱怨接错了位置。</p>\n<p><strong>博物馆正努力保存会变坏的物品，等于它们找不到可以买到的耐用品吗？</strong></p>\n<p>不等于。原文的困难在保存过程中，B换成了获取物品。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"21题","raw":"### C. handling outdated plastic exhibits\n\n> 处理过时的塑料展品\n\n把C接回题干，它说的是：博物馆在处理过时的塑料展品方面面临困难。\n\nC说处理过时展品。原文列出早期收音机等旧物，我们看旧是否被说成不再有价值。\n\n> But some plastic materials change over time.\n\n> trying to preserve culturally important objects\n\n> early radios\n\n作者称这些是`culturally important objects`，具有文化重要性的物品，因此博物馆才要保存。年代早并不是要处理掉它们的理由。\n\n段中的麻烦来自开裂、渗出和融化等材料变化，不是展品过了流行期、需要淘汰。\n\nC用`outdated`把年代久的物品写成过时展品，错开了原文明确强调的文化价值与材料问题。\n\n**早期物品有文化意义却难保存，是因为它们过时了需要处理吗？**\n\n不是。问题是材料改变，原文并没有否定这些旧物的价值。\n\n**第一轮判断：C排除。**","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38]],"questionRects":[[292,653,535,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>C. handling outdated plastic exhibits</h3>\n<blockquote><p>处理过时的塑料展品</p>\n</blockquote>\n<p>把C接回题干，它说的是：博物馆在处理过时的塑料展品方面面临困难。</p>\n<p>C说处理过时展品。原文列出早期收音机等旧物，我们看旧是否被说成不再有价值。</p>\n<blockquote><p>But some plastic materials change over time.</p>\n</blockquote>\n<blockquote><p>trying to preserve culturally important objects</p>\n</blockquote>\n<blockquote><p>early radios</p>\n</blockquote>\n<p>作者称这些是<code>culturally important objects</code>，具有文化重要性的物品，因此博物馆才要保存。年代早并不是要处理掉它们的理由。</p>\n<p>段中的麻烦来自开裂、渗出和融化等材料变化，不是展品过了流行期、需要淘汰。</p>\n<p>C用<code>outdated</code>把年代久的物品写成过时展品，错开了原文明确强调的文化价值与材料问题。</p>\n<p><strong>早期物品有文化意义却难保存，是因为它们过时了需要处理吗？</strong></p>\n<p>不是。问题是材料改变，原文并没有否定这些旧物的价值。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"21题","raw":"### D. classifying their plastic collections\n\n> 给馆内的塑料藏品分类\n\n把D接回题干，它说的是：博物馆在给馆内的塑料藏品分类方面面临困难。\n\nD说分类困难。段末确实列出许多种物品，我们看`variety ... at risk`是在展示种类多，还是说不知道怎么归类。\n\n> creates huge headaches for institutions, such as museums, trying to preserve culturally important objects\n\n> The variety of plastic objects at risk is **[xxx]**\n\n作者列收音机、雕塑、动画道具和人工心脏，是说明面临保存风险的物品范围很广。\n\n它没有比较类别边界，也没有说某件物品无法被放进某个分类。所有例子都接着前面的材料损坏与保存头痛。\n\nD把种类繁多自动当成分类困难。原文让我们看到的是这么多类别都可能变坏，不是博物馆分不清它们。\n\n**列出多类有风险的藏品，就说明博物馆不知道怎样给它们分类吗？**\n\n不说明。D把风险涉及范围改成了分类难题。\n\n**第一轮判断：D排除。**","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38]],"questionRects":[[292,705,551,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>D. classifying their plastic collections</h3>\n<blockquote><p>给馆内的塑料藏品分类</p>\n</blockquote>\n<p>把D接回题干，它说的是：博物馆在给馆内的塑料藏品分类方面面临困难。</p>\n<p>D说分类困难。段末确实列出许多种物品，我们看<code>variety ... at risk</code>是在展示种类多，还是说不知道怎么归类。</p>\n<blockquote><p>creates huge headaches for institutions, such as museums, trying to preserve culturally important objects</p>\n</blockquote>\n<blockquote><p>The variety of plastic objects at risk is <strong>[xxx]</strong></p>\n</blockquote>\n<p>作者列收音机、雕塑、动画道具和人工心脏，是说明面临保存风险的物品范围很广。</p>\n<p>它没有比较类别边界，也没有说某件物品无法被放进某个分类。所有例子都接着前面的材料损坏与保存头痛。</p>\n<p>D把种类繁多自动当成分类困难。原文让我们看到的是这么多类别都可能变坏，不是博物馆分不清它们。</p>\n<p><strong>列出多类有风险的藏品，就说明博物馆不知道怎样给它们分类吗？</strong></p>\n<p>不说明。D把风险涉及范围改成了分类难题。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"21题","raw":"### 21题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。第1段把塑料的变化与博物馆保存文化物品时遇到的困难直接相连，A所说的维护塑料物品能够接上。","articleRects":[],"questionRects":[[226,495,1031,38],[292,548,491,37],[292,600,532,38],[292,653,535,38],[292,705,551,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"21"},"html":"<h3>21题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。第1段把塑料的变化与博物馆保存文化物品时遇到的困难直接相连，A所说的维护塑料物品能够接上。</p>\n"},{"section":"22题","raw":"## 22题\n\n> Van Oosten believes that certain plastic objects are ______.  \n> 范·奥斯滕认为，某些塑料物品是______。\n\n题干点名Van Oosten，并问certain plastic objects。第2段以Certain artifacts开头，随后给出她对这些物品及制作过程的说明，因此整段读第2段。\n\n> 原文参考：\n> \n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. “It’s like baking a cake; If you don’t have exact amounts, it goes wrong,” she says. “The object you make is already a time bomb. ”\n> \n> 开始精读：\n> \n> Certain artifacts are especially vulnerable / because some pioneers in plastic art / didn’t always know how to mix ingredients properly, / says Thea van Oosten, / a polymer chemist who, / until retiring a few years ago, / worked for decades at the Cultural Heritage Agency of the Netherlands. / “It’s like baking a cake; / If you don’t have exact amounts, / it goes wrong,” she says. / “The object you make is already a time bomb. ”\n> \n> 某些艺术品尤其脆弱 / 因为一些塑料艺术的先驱 / 并不总是知道如何恰当地混合原料， / 西娅·范·奥斯滕说， / 她是一位聚合物化学家， / 直到几年前退休， / 她已在荷兰文化遗产局工作数十年。 / “这就像烤蛋糕； / 如果用量不精确， / 就会出问题，”她说。 / “你制作的物品已经是一颗定时炸弹。”\n\n空格要补范·奥斯滕怎样评价某些塑料物品。她把这些物品的状况与混合原料的方式相连，又用烤蛋糕和time bomb作解释，需要看评价与原因怎样接起来。\n\n接下来按A—D逐项看。","articleRects":[[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39]],"questionRects":[[226,810,816,38],[292,863,302,37],[292,915,316,38],[292,968,303,38],[292,1021,349,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"22","initialReadingPids":[1]},"html":"<h2>22题</h2>\n<blockquote><p>Van Oosten believes that certain plastic objects are ______.<br />\n范·奥斯滕认为，某些塑料物品是______。</p>\n</blockquote>\n<p>题干点名Van Oosten，并问certain plastic objects。第2段以Certain artifacts开头，随后给出她对这些物品及制作过程的说明，因此整段读第2段。</p>\n<blockquote><p>原文参考：</p>\n<p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands. “It’s like baking a cake; If you don’t have exact amounts, it goes wrong,” she says. “The object you make is already a time bomb. ”</p>\n<p>开始精读：</p>\n<p>Certain artifacts are especially vulnerable / because some pioneers in plastic art / didn’t always know how to mix ingredients properly, / says Thea van Oosten, / a polymer chemist who, / until retiring a few years ago, / worked for decades at the Cultural Heritage Agency of the Netherlands. / “It’s like baking a cake; / If you don’t have exact amounts, / it goes wrong,” she says. / “The object you make is already a time bomb. ”</p>\n<p>某些艺术品尤其脆弱 / 因为一些塑料艺术的先驱 / 并不总是知道如何恰当地混合原料， / 西娅·范·奥斯滕说， / 她是一位聚合物化学家， / 直到几年前退休， / 她已在荷兰文化遗产局工作数十年。 / “这就像烤蛋糕； / 如果用量不精确， / 就会出问题，”她说。 / “你制作的物品已经是一颗定时炸弹。”</p>\n</blockquote>\n<p>空格要补范·奥斯滕怎样评价某些塑料物品。她把这些物品的状况与混合原料的方式相连，又用烤蛋糕和time bomb作解释，需要看评价与原因怎样接起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"22题","raw":"### A. immune to decay\n\n> 不会腐坏的\n\n把A接回题干，它说的是：范·奥斯滕认为某些塑料物品不会腐坏。\n\nA说不会腐坏。第2段一开始却说`especially vulnerable`，后面又把物品比作`time bomb`，我们把原因读出来。\n\n> Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly\n\n> The object you make is already a time bomb.\n\n有些早期塑料艺术家不知道怎样正确混合成分，比例不准，就像烤蛋糕时用量不准会出错。\n\n这种物品从做出来就有隐患，范·奥斯滕才说它已经是定时炸弹。这里是在强调将来容易出问题。\n\nA的`immune`是不受腐坏影响，不能接上特别脆弱和潜在失效的比喻。\n\n**配料不准、成品已是定时炸弹，能说它不会腐坏吗？**\n\n不能。原文强调易出问题，A说成了不会受影响。\n\n**第一轮判断：A排除。**","articleRects":[[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39]],"questionRects":[[292,863,302,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"22","paragraphPids":[1]},"html":"<h3>A. immune to decay</h3>\n<blockquote><p>不会腐坏的</p>\n</blockquote>\n<p>把A接回题干，它说的是：范·奥斯滕认为某些塑料物品不会腐坏。</p>\n<p>A说不会腐坏。第2段一开始却说<code>especially vulnerable</code>，后面又把物品比作<code>time bomb</code>，我们把原因读出来。</p>\n<blockquote><p>Certain artifacts are especially vulnerable because some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n</blockquote>\n<blockquote><p>The object you make is already a time bomb.</p>\n</blockquote>\n<p>有些早期塑料艺术家不知道怎样正确混合成分，比例不准，就像烤蛋糕时用量不准会出错。</p>\n<p>这种物品从做出来就有隐患，范·奥斯滕才说它已经是定时炸弹。这里是在强调将来容易出问题。</p>\n<p>A的<code>immune</code>是不受腐坏影响，不能接上特别脆弱和潜在失效的比喻。</p>\n<p><strong>配料不准、成品已是定时炸弹，能说它不会腐坏吗？</strong></p>\n<p>不能。原文强调易出问题，A说成了不会受影响。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"22题","raw":"### B. improperly shaped\n\n> 形状制作不当的\n\n把B接回题干，它说的是：范·奥斯滕认为某些塑料物品的形状制作不当。\n\nB说形状做错。第2段谈制作问题时用`mix ingredients`和`exact amounts`，我们看错在外形还是配料。\n\n> some pioneers in plastic art didn’t always know how to mix ingredients properly\n\n> If you don’t have exact amounts, it goes wrong\n\n混合的是成分，要求准确的是用量。烤蛋糕的比喻也在说明配比不对，东西本身就容易出问题。\n\nB的`shaped`谈的是外形塑造，例如轮廓和形状做得对不对。原段没有批评作品外观。\n\n不能把任何制作过程的错误都译成形状不当。这里明确说出的制作隐患是成分混合比例。\n\n**没有准确配料用量，和把物品的形状做错，是同一个问题吗？**\n\n不是。原文说成分比例，B换成了外形。\n\n**第一轮判断：B排除。**","articleRects":[[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39]],"questionRects":[[292,915,316,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"22","paragraphPids":[1]},"html":"<h3>B. improperly shaped</h3>\n<blockquote><p>形状制作不当的</p>\n</blockquote>\n<p>把B接回题干，它说的是：范·奥斯滕认为某些塑料物品的形状制作不当。</p>\n<p>B说形状做错。第2段谈制作问题时用<code>mix ingredients</code>和<code>exact amounts</code>，我们看错在外形还是配料。</p>\n<blockquote><p>some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n</blockquote>\n<blockquote><p>If you don’t have exact amounts, it goes wrong</p>\n</blockquote>\n<p>混合的是成分，要求准确的是用量。烤蛋糕的比喻也在说明配比不对，东西本身就容易出问题。</p>\n<p>B的<code>shaped</code>谈的是外形塑造，例如轮廓和形状做得对不对。原段没有批评作品外观。</p>\n<p>不能把任何制作过程的错误都译成形状不当。这里明确说出的制作隐患是成分混合比例。</p>\n<p><strong>没有准确配料用量，和把物品的形状做错，是同一个问题吗？</strong></p>\n<p>不是。原文说成分比例，B换成了外形。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"22题","raw":"### C. inherently flawed\n\n> 本身就有缺陷的\n\n把C接回题干，它说的是：范·奥斯滕认为某些塑料物品本身就有缺陷。\n\nC说本身有缺陷。范·奥斯滕最后用`already a time bomb`形容成品，我们看隐患是什么时候带进去的。\n\n> didn’t always know how to mix ingredients properly\n\n> The object you make is already a time bomb.\n\n配料比例在制作时就没混合正确，做出的物品虽然当时可能成形，内部却已经留下不稳定的因素。\n\n`already`强调不是后来某次保存失误才突然变坏，而是成品从一开始就像定时炸弹一样带着隐患。\n\nC的`inherently flawed`在这里正指这种制作后物品自身已有的缺陷，不是在说一切塑料必然都有同样问题。\n\n**配比不当使成品从制成时就带着隐患，能否概括为这些物品本身有缺陷？**\n\n能。C接住了`already`和定时炸弹所强调的内在问题。\n\n**第一轮判断：C保留。**","articleRects":[[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39]],"questionRects":[[292,968,303,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"22","paragraphPids":[1]},"html":"<h3>C. inherently flawed</h3>\n<blockquote><p>本身就有缺陷的</p>\n</blockquote>\n<p>把C接回题干，它说的是：范·奥斯滕认为某些塑料物品本身就有缺陷。</p>\n<p>C说本身有缺陷。范·奥斯滕最后用<code>already a time bomb</code>形容成品，我们看隐患是什么时候带进去的。</p>\n<blockquote><p>didn’t always know how to mix ingredients properly</p>\n</blockquote>\n<blockquote><p>The object you make is already a time bomb.</p>\n</blockquote>\n<p>配料比例在制作时就没混合正确，做出的物品虽然当时可能成形，内部却已经留下不稳定的因素。</p>\n<p><code>already</code>强调不是后来某次保存失误才突然变坏，而是成品从一开始就像定时炸弹一样带着隐患。</p>\n<p>C的<code>inherently flawed</code>在这里正指这种制作后物品自身已有的缺陷，不是在说一切塑料必然都有同样问题。</p>\n<p><strong>配比不当使成品从制成时就带着隐患，能否概括为这些物品本身有缺陷？</strong></p>\n<p>能。C接住了<code>already</code>和定时炸弹所强调的内在问题。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"22题","raw":"### D. complex in structure\n\n> 结构复杂的\n\n把D接回题干，它说的是：范·奥斯滕认为某些塑料物品结构复杂。\n\nD说结构复杂。原文用做蛋糕说明配料，我们看她是强调成品有多少复杂层次，还是用量必须准确。\n\n> some pioneers in plastic art didn’t always know how to mix ingredients properly\n\n> If you don’t have exact amounts, it goes wrong\n\n她说如果没有准确的用量就会出错，随后把做出的物品叫定时炸弹。关键是配比出错会留下隐患。\n\nD却说成品结构复杂，原段既没有介绍结构层次，也没有把复杂当作脆弱的原因。\n\n即使某件塑料艺术品可能很复杂，也不能由“成分必须混合正确”直接推出它的结构复杂。\n\n**要求配料准确，是否就说明这些物品的结构复杂？**\n\n不能。原文讨论配比错误和隐患，D另加了结构特点。\n\n**第一轮判断：D排除。**","articleRects":[[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39]],"questionRects":[[292,1021,349,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"22","paragraphPids":[1]},"html":"<h3>D. complex in structure</h3>\n<blockquote><p>结构复杂的</p>\n</blockquote>\n<p>把D接回题干，它说的是：范·奥斯滕认为某些塑料物品结构复杂。</p>\n<p>D说结构复杂。原文用做蛋糕说明配料，我们看她是强调成品有多少复杂层次，还是用量必须准确。</p>\n<blockquote><p>some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n</blockquote>\n<blockquote><p>If you don’t have exact amounts, it goes wrong</p>\n</blockquote>\n<p>她说如果没有准确的用量就会出错，随后把做出的物品叫定时炸弹。关键是配比出错会留下隐患。</p>\n<p>D却说成品结构复杂，原段既没有介绍结构层次，也没有把复杂当作脆弱的原因。</p>\n<p>即使某件塑料艺术品可能很复杂，也不能由“成分必须混合正确”直接推出它的结构复杂。</p>\n<p><strong>要求配料准确，是否就说明这些物品的结构复杂？</strong></p>\n<p>不能。原文讨论配比错误和隐患，D另加了结构特点。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"22题","raw":"### 22题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。范·奥斯滕把不恰当配料做出的物品比作已经存在的定时炸弹，C能够表达这些物品自身带着隐患。","articleRects":[],"questionRects":[[226,810,816,38],[292,863,302,37],[292,915,316,38],[292,968,303,38],[292,1021,349,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"22"},"html":"<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。范·奥斯滕把不恰当配料做出的物品比作已经存在的定时炸弹，C能够表达这些物品自身带着隐患。</p>\n"},{"section":"23题","raw":"## 23题\n\n> Museums stopped exhibiting some of Gilardi’s artworks to ______.  \n> 博物馆停止展出吉拉尔迪的部分艺术品，是为了______。\n\n题干点名Gilardi’s artworks，并问Museums stopped exhibiting的目的。第3段介绍吉拉尔迪及其作品，第4段接着写Museums locked some of them away in the dark。把这两个相邻自然段完整读完，看作品原先的用途和后来被收起的缘由。\n\n> 原文参考：\n> \n> And sometimes, it’s not the artist’s fault. In the 1960s, the Italian artist Piero Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen “nature carpets” —large **[xxx]** decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> \n> 开始精读：\n> \n> And sometimes, / it’s not the artist’s fault. / In the 1960s, / the Italian artist Piero Gilardi / began to create hundreds of bright, colorful foam pieces. / Those pieces included small beds of roses and other items / as well as a few dozen “nature carpets” / —large **[xxx]** decorated with foam pumpkins, cabbages, and watermelons. / He wanted viewers to walk around on the carpets—which meant they had to be durable.\n> \n> 而且有时候， / 这并不是艺术家的错。 / 在1960年代， / 意大利艺术家皮耶罗·吉拉尔迪 / 开始创作数百件鲜艳多彩的泡沫作品。 / 这些作品包括小型玫瑰花坛和其他物件 / 以及几十张“自然地毯” / ——饰有泡沫南瓜、卷心菜和西瓜的大型**[xxx]**。 / 他希望观众在地毯上四处走动——这意味着地毯必须耐用。\n\n> 原文参考：\n> \n> Unfortunately, the polyurethane foam he used is **[xxx]** unstable. It’s especially vulnerable to light damage, and by the mid-1990s, Gilardi’s pumpkins, roses, and other figures were splitting and **[xxx]**. Museums locked some of them away in the dark.\n> \n> 开始精读：\n> \n> Unfortunately, / the polyurethane foam he used is **[xxx]** unstable. / It’s especially vulnerable to light damage, / and by the mid-1990s, / Gilardi’s pumpkins, roses, and other figures / were splitting and **[xxx]**. / Museums locked some of them away in the dark.\n> \n> 遗憾的是， / 他使用的聚氨酯泡沫**[xxx]**不稳定。 / 它尤其容易受到光照损伤， / 到1990年代中期， / 吉拉尔迪的南瓜、玫瑰以及其他造型 / 正出现裂开和**[xxx]**的情况。 / 博物馆把其中一些锁在黑暗中。\n\nstopped exhibiting对应博物馆把部分作品收在暗处的动作。空格要补这一做法的目的，需要把它与前面所写的材料特性、已经出现的损伤连起来。\n\n接下来按A—D逐项看。","articleRects":[[274,1002,1122,37],[202,1053,1194,38],[202,1104,1194,37],[204,1153,1187,39],[202,1205,1194,38],[202,1256,440,37],[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37]],"questionRects":[[226,1126,1035,39],[292,1178,512,38],[292,1230,526,38],[292,1283,501,38],[292,1336,552,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2,3],"qid":"23","initialReadingPids":[2,3]},"html":"<h2>23题</h2>\n<blockquote><p>Museums stopped exhibiting some of Gilardi’s artworks to ______.<br />\n博物馆停止展出吉拉尔迪的部分艺术品，是为了______。</p>\n</blockquote>\n<p>题干点名Gilardi’s artworks，并问Museums stopped exhibiting的目的。第3段介绍吉拉尔迪及其作品，第4段接着写Museums locked some of them away in the dark。把这两个相邻自然段完整读完，看作品原先的用途和后来被收起的缘由。</p>\n<blockquote><p>原文参考：</p>\n<p>And sometimes, it’s not the artist’s fault. In the 1960s, the Italian artist Piero Gilardi began to create hundreds of bright, colorful foam pieces. Those pieces included small beds of roses and other items as well as a few dozen “nature carpets” —large <strong>[xxx]</strong> decorated with foam pumpkins, cabbages, and watermelons. He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n<p>开始精读：</p>\n<p>And sometimes, / it’s not the artist’s fault. / In the 1960s, / the Italian artist Piero Gilardi / began to create hundreds of bright, colorful foam pieces. / Those pieces included small beds of roses and other items / as well as a few dozen “nature carpets” / —large <strong>[xxx]</strong> decorated with foam pumpkins, cabbages, and watermelons. / He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n<p>而且有时候， / 这并不是艺术家的错。 / 在1960年代， / 意大利艺术家皮耶罗·吉拉尔迪 / 开始创作数百件鲜艳多彩的泡沫作品。 / 这些作品包括小型玫瑰花坛和其他物件 / 以及几十张“自然地毯” / ——饰有泡沫南瓜、卷心菜和西瓜的大型<strong>[xxx]</strong>。 / 他希望观众在地毯上四处走动——这意味着地毯必须耐用。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Unfortunately, the polyurethane foam he used is <strong>[xxx]</strong> unstable. It’s especially vulnerable to light damage, and by the mid-1990s, Gilardi’s pumpkins, roses, and other figures were splitting and <strong>[xxx]</strong>. Museums locked some of them away in the dark.</p>\n<p>开始精读：</p>\n<p>Unfortunately, / the polyurethane foam he used is <strong>[xxx]</strong> unstable. / It’s especially vulnerable to light damage, / and by the mid-1990s, / Gilardi’s pumpkins, roses, and other figures / were splitting and <strong>[xxx]</strong>. / Museums locked some of them away in the dark.</p>\n<p>遗憾的是， / 他使用的聚氨酯泡沫<strong>[xxx]</strong>不稳定。 / 它尤其容易受到光照损伤， / 到1990年代中期， / 吉拉尔迪的南瓜、玫瑰以及其他造型 / 正出现裂开和<strong>[xxx]</strong>的情况。 / 博物馆把其中一些锁在黑暗中。</p>\n</blockquote>\n<p>stopped exhibiting对应博物馆把部分作品收在暗处的动作。空格要补这一做法的目的，需要把它与前面所写的材料特性、已经出现的损伤连起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"23题","raw":"### A. keep them from hurting visitors\n\n> 防止它们伤害参观者\n\n把A接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了防止这些作品伤害参观者。\n\nA说撤展是防止伤害观众。第3段确实说观众可以走上作品，我们接着看第4段发生的损伤落在谁身上。\n\n> He wanted viewers to walk around on the carpets—which meant they had to be durable.\n\n> It’s especially vulnerable to light damage\n\n> Museums locked some of them away in the dark.\n\n作者说聚氨酯泡沫容易受光损伤，南瓜、玫瑰等造型已经裂开。受害的是作品本身。\n\n博物馆随后把部分作品锁进暗处，黑暗直接减少的是光照，不是把某种会伤人的危险源与观众隔开。\n\n原段没有写观众被割伤或作品对人造成伤害。A把需要保护的作品换成了参观者。\n\n**原文已出现的是作品受光开裂，还是作品伤害了观众？**\n\n是作品受损。撤到暗处是在保护它们，A换了保护对象。\n\n**第一轮判断：A排除。**","articleRects":[[274,1002,1122,37],[202,1053,1194,38],[202,1104,1194,37],[204,1153,1187,39],[202,1205,1194,38],[202,1256,440,37],[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37]],"questionRects":[[292,1178,512,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"23","paragraphPids":[2,3]},"html":"<h3>A. keep them from hurting visitors</h3>\n<blockquote><p>防止它们伤害参观者</p>\n</blockquote>\n<p>把A接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了防止这些作品伤害参观者。</p>\n<p>A说撤展是防止伤害观众。第3段确实说观众可以走上作品，我们接着看第4段发生的损伤落在谁身上。</p>\n<blockquote><p>He wanted viewers to walk around on the carpets—which meant they had to be durable.</p>\n</blockquote>\n<blockquote><p>It’s especially vulnerable to light damage</p>\n</blockquote>\n<blockquote><p>Museums locked some of them away in the dark.</p>\n</blockquote>\n<p>作者说聚氨酯泡沫容易受光损伤，南瓜、玫瑰等造型已经裂开。受害的是作品本身。</p>\n<p>博物馆随后把部分作品锁进暗处，黑暗直接减少的是光照，不是把某种会伤人的危险源与观众隔开。</p>\n<p>原段没有写观众被割伤或作品对人造成伤害。A把需要保护的作品换成了参观者。</p>\n<p><strong>原文已出现的是作品受光开裂，还是作品伤害了观众？</strong></p>\n<p>是作品受损。撤到暗处是在保护它们，A换了保护对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"23题","raw":"### B. duplicate them for future display\n\n> 复制它们，以供日后展出\n\n把B接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了复制它们以供日后展出。\n\nB说为了复制后再展出。第4段的实际做法是`locked ... away in the dark`，我们看它与前面的光损伤怎样相接。\n\n> It’s especially vulnerable to light damage\n\n> Museums locked some of them away in the dark.\n\n材料怕光、作品已经开裂，所以放入暗处能避开继续照射。这就解释了为什么不继续公开展出。\n\nB要把撤展接到复制工作，需要看到制作副本、翻模或让复制品代替原件的安排。原段没有这些活动。\n\n把原件收起来保存，并不等于正在复制它。不能把可能想到的博物馆工作当成这里写出的撤展目的。\n\n**撤到暗处紧接怕光和开裂，是在说避光保护，还是在说准备复制？**\n\n是在说避光保护。B的复制安排没有出现。\n\n**第一轮判断：B排除。**","articleRects":[[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37]],"questionRects":[[292,1230,526,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>B. duplicate them for future display</h3>\n<blockquote><p>复制它们，以供日后展出</p>\n</blockquote>\n<p>把B接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了复制它们以供日后展出。</p>\n<p>B说为了复制后再展出。第4段的实际做法是<code>locked ... away in the dark</code>，我们看它与前面的光损伤怎样相接。</p>\n<blockquote><p>It’s especially vulnerable to light damage</p>\n</blockquote>\n<blockquote><p>Museums locked some of them away in the dark.</p>\n</blockquote>\n<p>材料怕光、作品已经开裂，所以放入暗处能避开继续照射。这就解释了为什么不继续公开展出。</p>\n<p>B要把撤展接到复制工作，需要看到制作副本、翻模或让复制品代替原件的安排。原段没有这些活动。</p>\n<p>把原件收起来保存，并不等于正在复制它。不能把可能想到的博物馆工作当成这里写出的撤展目的。</p>\n<p><strong>撤到暗处紧接怕光和开裂，是在说避光保护，还是在说准备复制？</strong></p>\n<p>是在说避光保护。B的复制安排没有出现。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"23题","raw":"### C. have their ingredients analyzed\n\n> 让人分析它们的成分\n\n把C接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了让人分析这些作品的成分。\n\nC说撤展为了分析成分。前面范·奥斯滕谈配料，吉拉尔迪这一段却以`not the artist’s fault`转开，我们分清两种原因。\n\n> some pioneers in plastic art didn’t always know how to mix ingredients properly\n\n> It’s especially vulnerable to light damage\n\n> Museums locked some of them away in the dark.\n\n第2段有些作品因艺术家配料不当而脆弱；第3段开始提醒，有时并非艺术家的错，随后讲吉拉尔迪使用的泡沫本身怕光。\n\n第4段已经指出这件材料的弱点，撤入暗处则直接应对光损伤，没有把撤展说成为了查清未知成分。\n\nC把前一部分的配料话题挪到这个例子里，并添加了成分分析的工作。原文没有这样连接。\n\n**前面谈过配料问题，就能说明吉拉尔迪作品被撤到暗处是为了分析成分吗？**\n\n不能。这个例子已经说明怕光，收进暗处直接服务于避光保存。\n\n**第一轮判断：C排除。**","articleRects":[[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39],[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37]],"questionRects":[[292,1283,501,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"23","paragraphPids":[1,3]},"html":"<h3>C. have their ingredients analyzed</h3>\n<blockquote><p>让人分析它们的成分</p>\n</blockquote>\n<p>把C接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了让人分析这些作品的成分。</p>\n<p>C说撤展为了分析成分。前面范·奥斯滕谈配料，吉拉尔迪这一段却以<code>not the artist’s fault</code>转开，我们分清两种原因。</p>\n<blockquote><p>some pioneers in plastic art didn’t always know how to mix ingredients properly</p>\n</blockquote>\n<blockquote><p>It’s especially vulnerable to light damage</p>\n</blockquote>\n<blockquote><p>Museums locked some of them away in the dark.</p>\n</blockquote>\n<p>第2段有些作品因艺术家配料不当而脆弱；第3段开始提醒，有时并非艺术家的错，随后讲吉拉尔迪使用的泡沫本身怕光。</p>\n<p>第4段已经指出这件材料的弱点，撤入暗处则直接应对光损伤，没有把撤展说成为了查清未知成分。</p>\n<p>C把前一部分的配料话题挪到这个例子里，并添加了成分分析的工作。原文没有这样连接。</p>\n<p><strong>前面谈过配料问题，就能说明吉拉尔迪作品被撤到暗处是为了分析成分吗？</strong></p>\n<p>不能。这个例子已经说明怕光，收进暗处直接服务于避光保存。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"23题","raw":"### D. prevent them from further damage\n\n> 防止它们受到进一步损伤\n\n把D接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了防止它们受到进一步损伤。\n\nD说防止进一步损伤。第4段先写`vulnerable to light damage`，后写`in the dark`，这两处正好相对。\n\n> It’s especially vulnerable to light damage\n\n> Gilardi’s pumpkins, roses, and other figures were splitting and **[xxx]**.\n\n> Museums locked some of them away in the dark.\n\n泡沫材料特别容易受光损伤，作品已经出现裂开等变化。如果继续暴露在光下，同样的损伤还可能持续。\n\n把部分作品收进暗处，切掉的就是这种光照。这个动作不是让既有裂缝自动消失，而是先减少后续损伤。\n\nD的`further`正适合这里：已经有伤，现在避免它继续加重。\n\n**材料怕光且已开裂，把作品放到暗处，是否为了防止再受光照损伤？**\n\n是。D把原因和保存动作直接接起来。\n\n**第一轮判断：D保留。**","articleRects":[[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37]],"questionRects":[[292,1336,552,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"23","paragraphPids":[3]},"html":"<h3>D. prevent them from further damage</h3>\n<blockquote><p>防止它们受到进一步损伤</p>\n</blockquote>\n<p>把D接回题干，它说的是：博物馆停止展出吉拉尔迪的部分艺术品，是为了防止它们受到进一步损伤。</p>\n<p>D说防止进一步损伤。第4段先写<code>vulnerable to light damage</code>，后写<code>in the dark</code>，这两处正好相对。</p>\n<blockquote><p>It’s especially vulnerable to light damage</p>\n</blockquote>\n<blockquote><p>Gilardi’s pumpkins, roses, and other figures were splitting and <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>Museums locked some of them away in the dark.</p>\n</blockquote>\n<p>泡沫材料特别容易受光损伤，作品已经出现裂开等变化。如果继续暴露在光下，同样的损伤还可能持续。</p>\n<p>把部分作品收进暗处，切掉的就是这种光照。这个动作不是让既有裂缝自动消失，而是先减少后续损伤。</p>\n<p>D的<code>further</code>正适合这里：已经有伤，现在避免它继续加重。</p>\n<p><strong>材料怕光且已开裂，把作品放到暗处，是否为了防止再受光照损伤？</strong></p>\n<p>是。D把原因和保存动作直接接起来。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"23题","raw":"### 23题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。作品易受光照损伤且已经开裂，博物馆随即将部分作品存放在暗处，防止继续受损能够解释这一做法。","articleRects":[],"questionRects":[[226,1126,1035,39],[292,1178,512,38],[292,1230,526,38],[292,1283,501,38],[292,1336,552,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"23"},"html":"<h3>23题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。作品易受光照损伤且已经开裂，博物馆随即将部分作品存放在暗处，防止继续受损能够解释这一做法。</p>\n"},{"section":"24题","raw":"## 24题\n\n> The author thinks that preservation of plastics is ______.  \n> 作者认为，塑料的保存是______的。\n\n题干问作者怎样看待preservation of plastics。粗读时第6段留下preservation of plastics与will likely get harder，直接谈保存工作的前景。第6段开头提到van Oosten的成功故事，需要连着读前面的第5段，明确作者怎样从这一实例转到总体判断。\n\n> 原文参考：\n> \n> So van Oosten and her colleagues worked to preserve Gilardi’s sculptures. They **[xxx]** some with stabilizing and **[xxx]** chemicals. Van Oosten calls those chemicals “**[xxx]**” because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.\n> \n> 开始精读：\n> \n> So van Oosten and her colleagues / worked to preserve Gilardi’s sculptures. / They **[xxx]** some / with stabilizing and **[xxx]** chemicals. / Van Oosten calls those chemicals “**[xxx]**” / because their goal was to prevent further light damage / and rebuild worn polymer fibers. / She is proud / that several sculptures have even gone on display again, / albeit sometimes beneath protective cases.\n> \n> 于是范·奥斯滕和她的同事 / 致力于保存吉拉尔迪的雕塑。 / 他们对其中一些**[xxx]** / 使用具有稳定作用和**[xxx]**的化学品。 / 范·奥斯滕称那些化学品为“**[xxx]**” / 因为他们的目标是防止进一步的光照损伤 / 并重建受损的聚合物纤维。 / 她感到自豪 / 因为几件雕塑甚至已经重新展出， / 尽管有时要放在保护罩下。\n\n> 原文参考：\n> \n> Despite success stories like van Oosten’s, preservation of plastics will likely get harder. Old objects continue to **[xxx]**. Worse, biodegradable plastics, designed to **[xxx]**, are increasingly common.\n> \n> 开始精读：\n> \n> Despite success stories like van Oosten’s, / preservation of plastics will likely get harder. / Old objects continue to **[xxx]**. / Worse, / biodegradable plastics, / designed to **[xxx]**, / are increasingly common.\n> \n> 尽管有范·奥斯滕这样的成功案例， / 保存塑料很可能会变得更困难。 / 旧物品继续**[xxx]**。 / 更糟的是， / 可生物降解的塑料， / 被设计来**[xxx]**， / 正变得越来越普遍。\n\n空格要补作者对塑料保存工作的评价。第5段写范·奥斯滕团队的做法及结果，第6段以Despite转向保存工作的前景，需要看实例与作者判断之间是什么关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1510,1112,37],[202,1560,1194,38],[202,1609,1194,40],[202,1661,1194,38],[202,1712,1125,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38]],"questionRects":[[226,1441,774,37],[293,1493,134,38],[292,1546,184,37],[292,1598,193,38],[292,1651,216,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4,5],"qid":"24","initialReadingPids":[4,5]},"html":"<h2>24题</h2>\n<blockquote><p>The author thinks that preservation of plastics is ______.<br />\n作者认为，塑料的保存是______的。</p>\n</blockquote>\n<p>题干问作者怎样看待preservation of plastics。粗读时第6段留下preservation of plastics与will likely get harder，直接谈保存工作的前景。第6段开头提到van Oosten的成功故事，需要连着读前面的第5段，明确作者怎样从这一实例转到总体判断。</p>\n<blockquote><p>原文参考：</p>\n<p>So van Oosten and her colleagues worked to preserve Gilardi’s sculptures. They <strong>[xxx]</strong> some with stabilizing and <strong>[xxx]</strong> chemicals. Van Oosten calls those chemicals “<strong>[xxx]</strong>” because their goal was to prevent further light damage and rebuild worn polymer fibers. She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.</p>\n<p>开始精读：</p>\n<p>So van Oosten and her colleagues / worked to preserve Gilardi’s sculptures. / They <strong>[xxx]</strong> some / with stabilizing and <strong>[xxx]</strong> chemicals. / Van Oosten calls those chemicals “<strong>[xxx]</strong>” / because their goal was to prevent further light damage / and rebuild worn polymer fibers. / She is proud / that several sculptures have even gone on display again, / albeit sometimes beneath protective cases.</p>\n<p>于是范·奥斯滕和她的同事 / 致力于保存吉拉尔迪的雕塑。 / 他们对其中一些<strong>[xxx]</strong> / 使用具有稳定作用和<strong>[xxx]</strong>的化学品。 / 范·奥斯滕称那些化学品为“<strong>[xxx]</strong>” / 因为他们的目标是防止进一步的光照损伤 / 并重建受损的聚合物纤维。 / 她感到自豪 / 因为几件雕塑甚至已经重新展出， / 尽管有时要放在保护罩下。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Despite success stories like van Oosten’s, preservation of plastics will likely get harder. Old objects continue to <strong>[xxx]</strong>. Worse, biodegradable plastics, designed to <strong>[xxx]</strong>, are increasingly common.</p>\n<p>开始精读：</p>\n<p>Despite success stories like van Oosten’s, / preservation of plastics will likely get harder. / Old objects continue to <strong>[xxx]</strong>. / Worse, / biodegradable plastics, / designed to <strong>[xxx]</strong>, / are increasingly common.</p>\n<p>尽管有范·奥斯滕这样的成功案例， / 保存塑料很可能会变得更困难。 / 旧物品继续<strong>[xxx]</strong>。 / 更糟的是， / 可生物降解的塑料， / 被设计来<strong>[xxx]</strong>， / 正变得越来越普遍。</p>\n</blockquote>\n<p>空格要补作者对塑料保存工作的评价。第5段写范·奥斯滕团队的做法及结果，第6段以Despite转向保存工作的前景，需要看实例与作者判断之间是什么关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"24题","raw":"### A. costly\n\n> 费用高昂的\n\n把A接回题干，它说的是：作者认为塑料的保存费用高昂。\n\nA说保存费用高。第5段需要专门化学处理并加保护罩，我们先看作者有没有交代这些工作成本。\n\n> with stabilizing and **[xxx]** chemicals\n\n> their goal was to prevent further light damage and rebuild worn polymer fibers\n\n> preservation of plastics will likely get harder\n\n修复者要防止光损伤、重建磨损纤维，还可能在展出时加保护罩。看到这些专门处理，确实会让人想继续问花费是否很大。\n\n不过，原文目前只写处理方式，化学品的一个性质又被挡住，不能直接说这些材料一定昂贵。也没有给出开支数字。\n\nA暂时留下等待回查，但它还是一个没有确认的费用判断；D的困难则已在`get harder`中明说，二者依据并不相同。\n\n**专门处理已经写出，但它们究竟花费多少、作者是否在评价费用高，现在能确定吗？**\n\n还不能。A先留作待核对的理解，不把复杂处理直接当作高费用证明。\n\n**第一轮判断：A保留。**","articleRects":[[274,1510,1112,37],[202,1560,1194,38],[202,1609,1194,40],[202,1661,1194,38],[202,1712,1125,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38]],"questionRects":[[293,1493,134,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"24","paragraphPids":[4,5]},"html":"<h3>A. costly</h3>\n<blockquote><p>费用高昂的</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为塑料的保存费用高昂。</p>\n<p>A说保存费用高。第5段需要专门化学处理并加保护罩，我们先看作者有没有交代这些工作成本。</p>\n<blockquote><p>with stabilizing and <strong>[xxx]</strong> chemicals</p>\n</blockquote>\n<blockquote><p>their goal was to prevent further light damage and rebuild worn polymer fibers</p>\n</blockquote>\n<blockquote><p>preservation of plastics will likely get harder</p>\n</blockquote>\n<p>修复者要防止光损伤、重建磨损纤维，还可能在展出时加保护罩。看到这些专门处理，确实会让人想继续问花费是否很大。</p>\n<p>不过，原文目前只写处理方式，化学品的一个性质又被挡住，不能直接说这些材料一定昂贵。也没有给出开支数字。</p>\n<p>A暂时留下等待回查，但它还是一个没有确认的费用判断；D的困难则已在<code>get harder</code>中明说，二者依据并不相同。</p>\n<p><strong>专门处理已经写出，但它们究竟花费多少、作者是否在评价费用高，现在能确定吗？</strong></p>\n<p>还不能。A先留作待核对的理解，不把复杂处理直接当作高费用证明。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"24题","raw":"### B. unworthy\n\n> 不值得做的\n\n把B接回题干，它说的是：作者认为保存塑料不值得做。\n\nB说不值得保存。第1段称物品有文化意义，第5段又介绍修复成功，我们看困难是否被当成放弃的理由。\n\n> trying to preserve culturally important objects\n\n> several sculptures have even gone on display again\n\n> Despite success stories like van Oosten’s, preservation of plastics will likely get harder.\n\n这些物品被称为有重要文化价值，范·奥斯滕也为一些作品能够重新展出感到自豪。\n\n第6段承认保存可能更难，是说任务难度增加，没有因此说不应该再做。作者仍把成功保护的经历当作成功故事。\n\nB把难做改成不值得做。成本或难度与价值需要分开，原文明说的文化重要性并未被否定。\n\n**作者称它们有文化意义，并把重新展出写作成功，是否认为保存不值得？**\n\n不是。B把保存困难误成了价值否定。\n\n**第一轮判断：B排除。**","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38],[274,1510,1112,37],[202,1560,1194,38],[202,1609,1194,40],[202,1661,1194,38],[202,1712,1125,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38]],"questionRects":[[292,1546,184,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"24","paragraphPids":[0,4,5]},"html":"<h3>B. unworthy</h3>\n<blockquote><p>不值得做的</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为保存塑料不值得做。</p>\n<p>B说不值得保存。第1段称物品有文化意义，第5段又介绍修复成功，我们看困难是否被当成放弃的理由。</p>\n<blockquote><p>trying to preserve culturally important objects</p>\n</blockquote>\n<blockquote><p>several sculptures have even gone on display again</p>\n</blockquote>\n<blockquote><p>Despite success stories like van Oosten’s, preservation of plastics will likely get harder.</p>\n</blockquote>\n<p>这些物品被称为有重要文化价值，范·奥斯滕也为一些作品能够重新展出感到自豪。</p>\n<p>第6段承认保存可能更难，是说任务难度增加，没有因此说不应该再做。作者仍把成功保护的经历当作成功故事。</p>\n<p>B把难做改成不值得做。成本或难度与价值需要分开，原文明说的文化重要性并未被否定。</p>\n<p><strong>作者称它们有文化意义，并把重新展出写作成功，是否认为保存不值得？</strong></p>\n<p>不是。B把保存困难误成了价值否定。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"24题","raw":"### C. unpopular\n\n> 不受欢迎的\n\n把C接回题干，它说的是：作者认为保存塑料不受欢迎。\n\nC说保存不受欢迎。第1段有人抱怨塑料，后面又谈保护，我们先分清抱怨的是什么。\n\n> People often complain that plastics are too durable.\n\n> preservation of plastics will likely get harder\n\n人们抱怨的是水瓶、购物袋等垃圾太耐久、不易降解，散布各处。这不是在抱怨博物馆保护有文化意义的塑料藏品。\n\n文章随后说另一些塑料会变坏，让保存者头痛；头痛来自技术难题，也不是公众反对保存。\n\nC把对塑料垃圾的厌烦或保存者的困难，接成对保存工作的不欢迎。原段没有给出这种态度。\n\n**人们嫌塑料垃圾难降解，是否就表示他们反对保存有文化意义的塑料藏品？**\n\n不表示。C混淆了垃圾问题与文物保存。\n\n**第一轮判断：C排除。**","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38]],"questionRects":[[292,1598,193,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"24","paragraphPids":[0,5]},"html":"<h3>C. unpopular</h3>\n<blockquote><p>不受欢迎的</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为保存塑料不受欢迎。</p>\n<p>C说保存不受欢迎。第1段有人抱怨塑料，后面又谈保护，我们先分清抱怨的是什么。</p>\n<blockquote><p>People often complain that plastics are too durable.</p>\n</blockquote>\n<blockquote><p>preservation of plastics will likely get harder</p>\n</blockquote>\n<p>人们抱怨的是水瓶、购物袋等垃圾太耐久、不易降解，散布各处。这不是在抱怨博物馆保护有文化意义的塑料藏品。</p>\n<p>文章随后说另一些塑料会变坏，让保存者头痛；头痛来自技术难题，也不是公众反对保存。</p>\n<p>C把对塑料垃圾的厌烦或保存者的困难，接成对保存工作的不欢迎。原段没有给出这种态度。</p>\n<p><strong>人们嫌塑料垃圾难降解，是否就表示他们反对保存有文化意义的塑料藏品？</strong></p>\n<p>不表示。C混淆了垃圾问题与文物保存。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"24题","raw":"### D. challenging\n\n> 具有挑战性的\n\n把D接回题干，它说的是：作者认为塑料的保存具有挑战性。\n\nD说具有挑战性。第6段直接说`preservation ... will likely get harder`，我们再接上前面的成功修复。\n\n> their goal was to prevent further light damage and rebuild worn polymer fibers\n\n> Despite success stories like van Oosten’s, preservation of plastics will likely get harder.\n\n虽然已有作品经处理重新展出，作者用`Despite success stories`提醒这还没有消除保存困难。\n\n旧物继续变化，又出现更多设计为可降解的新塑料。对希望长久留存的机构来说，材料本来会改变或分解，就使保存更难。\n\nD不是说保护完全做不到，而是说要持续解决难题。既有成功也仍会更难，两者都能放进“具有挑战性”。\n\n**作者明确说尽管已有成功，保存还可能更难，是否就是D所说的具有挑战性？**\n\n是。D直接对应作者的整体判断。\n\n**第一轮判断：D保留。**","articleRects":[[274,1510,1112,37],[202,1560,1194,38],[202,1609,1194,40],[202,1661,1194,38],[202,1712,1125,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38]],"questionRects":[[292,1651,216,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"24","paragraphPids":[4,5]},"html":"<h3>D. challenging</h3>\n<blockquote><p>具有挑战性的</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为塑料的保存具有挑战性。</p>\n<p>D说具有挑战性。第6段直接说<code>preservation ... will likely get harder</code>，我们再接上前面的成功修复。</p>\n<blockquote><p>their goal was to prevent further light damage and rebuild worn polymer fibers</p>\n</blockquote>\n<blockquote><p>Despite success stories like van Oosten’s, preservation of plastics will likely get harder.</p>\n</blockquote>\n<p>虽然已有作品经处理重新展出，作者用<code>Despite success stories</code>提醒这还没有消除保存困难。</p>\n<p>旧物继续变化，又出现更多设计为可降解的新塑料。对希望长久留存的机构来说，材料本来会改变或分解，就使保存更难。</p>\n<p>D不是说保护完全做不到，而是说要持续解决难题。既有成功也仍会更难，两者都能放进“具有挑战性”。</p>\n<p><strong>作者明确说尽管已有成功，保存还可能更难，是否就是D所说的具有挑战性？</strong></p>\n<p>是。D直接对应作者的整体判断。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"24题","raw":"### 24题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n暂时保留：A、D。\n\n第一遍留下A、D。D直接对应保存工作将更难；A的费用判断不能从harder推出，但所用化学品的一项性质还未读清，暂不能确定它是否涉及高昂费用。","articleRects":[],"questionRects":[[226,1441,774,37],[293,1493,134,38],[292,1546,184,37],[292,1598,193,38],[292,1651,216,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"24"},"html":"<h3>24题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：A、D。</p>\n<p>第一遍留下A、D。D直接对应保存工作将更难；A的费用判断不能从harder推出，但所用化学品的一项性质还未读清，暂不能确定它是否涉及高昂费用。</p>\n"},{"section":"25题","raw":"## 25题\n\n> In Ferreira’s opinion, preservation of plastic artifacts ______.  \n> 在费雷拉看来，保存塑料人造物品______。\n\n题干点名Ferreira，第7段出现Joana Lia Ferreira并引用她的话，因此整段读第7段。\n\n> 原文参考：\n> \n> And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and **[xxx]** at the NOVA School of Science and Technology, notes that **[xxx]** first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, “and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen. ”\n> \n> 开始精读：\n> \n> And more is at stake here than individual objects. / Joana Lia Ferreira, / an assistant professor of conservation and **[xxx]** / at the NOVA School of Science and Technology, / notes that **[xxx]** first defined / the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. / We now live in an age of plastic, / she says, / “and what we decide to collect today, / what we decide to preserve...will have a strong impact on how in the future we'll be seen. ”\n> \n> 而这里关系到的不只是单个物品。 / 乔安娜·利亚·费雷拉， / 一位保护与**[xxx]**专业的助理教授， / 任职于新里斯本大学科学与技术学院， / 指出**[xxx]**最初划定了 / 人类历史上重要的材料时代——石器时代、铁器时代等等——是在考察博物馆中的人造物品之后。 / 我们现在生活在一个塑料时代， / 她说， / “而我们今天决定收藏什么， / 决定保存什么……将强烈影响未来的人如何看待我们。”\n\n空格要补她怎样理解保存塑料物品这件事。她先谈博物馆物品与人类历史材料时代的划分，再谈今天收藏和保存的决定会怎样影响未来的人看待我们，要看这两个时间方向怎样相连。\n\n接下来按A—D逐项看。","articleRects":[[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[[226,1756,846,38],[292,1808,583,38],[292,1861,564,38],[292,1913,609,38],[292,1966,597,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[6],"qid":"25","initialReadingPids":[6]},"html":"<h2>25题</h2>\n<blockquote><p>In Ferreira’s opinion, preservation of plastic artifacts ______.<br />\n在费雷拉看来，保存塑料人造物品______。</p>\n</blockquote>\n<p>题干点名Ferreira，第7段出现Joana Lia Ferreira并引用她的话，因此整段读第7段。</p>\n<blockquote><p>原文参考：</p>\n<p>And more is at stake here than individual objects. Joana Lia Ferreira, an assistant professor of conservation and <strong>[xxx]</strong> at the NOVA School of Science and Technology, notes that <strong>[xxx]</strong> first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. We now live in an age of plastic, she says, “and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen. ”</p>\n<p>开始精读：</p>\n<p>And more is at stake here than individual objects. / Joana Lia Ferreira, / an assistant professor of conservation and <strong>[xxx]</strong> / at the NOVA School of Science and Technology, / notes that <strong>[xxx]</strong> first defined / the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums. / We now live in an age of plastic, / she says, / “and what we decide to collect today, / what we decide to preserve...will have a strong impact on how in the future we'll be seen. ”</p>\n<p>而这里关系到的不只是单个物品。 / 乔安娜·利亚·费雷拉， / 一位保护与<strong>[xxx]</strong>专业的助理教授， / 任职于新里斯本大学科学与技术学院， / 指出<strong>[xxx]</strong>最初划定了 / 人类历史上重要的材料时代——石器时代、铁器时代等等——是在考察博物馆中的人造物品之后。 / 我们现在生活在一个塑料时代， / 她说， / “而我们今天决定收藏什么， / 决定保存什么……将强烈影响未来的人如何看待我们。”</p>\n</blockquote>\n<p>空格要补她怎样理解保存塑料物品这件事。她先谈博物馆物品与人类历史材料时代的划分，再谈今天收藏和保存的决定会怎样影响未来的人看待我们，要看这两个时间方向怎样相连。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"25题","raw":"### A. will inspire future scientific research\n\n> 将激发未来的科学研究\n\n把A接回题干，它说的是：费雷拉认为保存塑料人造物品将激发未来的科学研究。\n\nA说保存将激发未来科学研究。最后一段谈从馆藏辨认历史时代，我们看未来受到影响的是研究热情，还是人们怎样认识今天。\n\n> after examining artifacts in museums\n\n> will have a strong impact on how in the future we'll be seen\n\n费雷拉说，过去人们通过博物馆物品定义石器时代、铁器时代。如今保存什么，也会影响未来的人怎样看待我们。\n\n这是讲留下的材料如何成为认识时代的依据，没有说它将使更多人想做科学研究，或激发某项新研究方向。\n\nA把提供历史认识的材料，进一步换成激发未来科研，原段没有说明这一步。\n\n**保存物品影响后人怎样认识我们，等于它会激起未来的科学研究吗？**\n\n不等于。A加了研究动机和活动，原句说的是对时代的认识。\n\n**第一轮判断：A排除。**","articleRects":[[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[[292,1808,583,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"25","paragraphPids":[6]},"html":"<h3>A. will inspire future scientific research</h3>\n<blockquote><p>将激发未来的科学研究</p>\n</blockquote>\n<p>把A接回题干，它说的是：费雷拉认为保存塑料人造物品将激发未来的科学研究。</p>\n<p>A说保存将激发未来科学研究。最后一段谈从馆藏辨认历史时代，我们看未来受到影响的是研究热情，还是人们怎样认识今天。</p>\n<blockquote><p>after examining artifacts in museums</p>\n</blockquote>\n<blockquote><p>will have a strong impact on how in the future we'll be seen</p>\n</blockquote>\n<p>费雷拉说，过去人们通过博物馆物品定义石器时代、铁器时代。如今保存什么，也会影响未来的人怎样看待我们。</p>\n<p>这是讲留下的材料如何成为认识时代的依据，没有说它将使更多人想做科学研究，或激发某项新研究方向。</p>\n<p>A把提供历史认识的材料，进一步换成激发未来科研，原段没有说明这一步。</p>\n<p><strong>保存物品影响后人怎样认识我们，等于它会激起未来的科学研究吗？</strong></p>\n<p>不等于。A加了研究动机和活动，原句说的是对时代的认识。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"25题","raw":"### B. has profound historical significance\n\n> 具有深远的历史意义\n\n把B接回题干，它说的是：费雷拉认为保存塑料人造物品具有深远的历史意义。\n\nB说有深远历史意义。费雷拉先举石器、铁器时代，再说今天是塑料时代，我们看这两个时间段怎样接在一起。\n\n> the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums\n\n> We now live in an age of plastic\n\n> will have a strong impact on how in the future we'll be seen\n\n过去的人凭留下的器物认识不同历史阶段。今天我们留下哪些塑料物品，也将决定后人能看到今天什么样的生活和文化。\n\n因此保存不只为了某件作品还能展出，也是在给未来留下理解这个时代的证据。\n\nB用历史意义概括这种影响，既接上材料时代的例子，也接上`how in the future we’ll be seen`的未来回望。\n\n**今天保存的物品会影响后人怎样理解我们这个时代，能否说明保存具有深远历史意义？**\n\n能。B把从过去器物到未来认识的联系说了出来。\n\n**第一轮判断：B保留。**","articleRects":[[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[[292,1861,564,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"25","paragraphPids":[6]},"html":"<h3>B. has profound historical significance</h3>\n<blockquote><p>具有深远的历史意义</p>\n</blockquote>\n<p>把B接回题干，它说的是：费雷拉认为保存塑料人造物品具有深远的历史意义。</p>\n<p>B说有深远历史意义。费雷拉先举石器、铁器时代，再说今天是塑料时代，我们看这两个时间段怎样接在一起。</p>\n<blockquote><p>the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums</p>\n</blockquote>\n<blockquote><p>We now live in an age of plastic</p>\n</blockquote>\n<blockquote><p>will have a strong impact on how in the future we'll be seen</p>\n</blockquote>\n<p>过去的人凭留下的器物认识不同历史阶段。今天我们留下哪些塑料物品，也将决定后人能看到今天什么样的生活和文化。</p>\n<p>因此保存不只为了某件作品还能展出，也是在给未来留下理解这个时代的证据。</p>\n<p>B用历史意义概括这种影响，既接上材料时代的例子，也接上<code>how in the future we’ll be seen</code>的未来回望。</p>\n<p><strong>今天保存的物品会影响后人怎样理解我们这个时代，能否说明保存具有深远历史意义？</strong></p>\n<p>能。B把从过去器物到未来认识的联系说了出来。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"25题","raw":"### C. will help us separate the material ages\n\n> 将帮助我们区分各个材料时代\n\n把C接回题干，它说的是：费雷拉认为保存塑料人造物品将帮助我们区分各个材料时代。\n\nC说帮助我们区分材料时代。前面确实举石器时代、铁器时代，但费雷拉随后已经说`We now live in an age of plastic`，我们看未知的是什么。\n\n> first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums\n\n> We now live in an age of plastic\n\n> how in the future we'll be seen\n\n石器、铁器等时代已经通过馆藏器物被辨认。作者也已经把当下称为塑料时代，并不是还要靠保存工作来分清我们在哪个材料时代。\n\n未来的问题是后人会怎样看待我们，而不只是给时代分一个类别。\n\nC把前面的历史例子当成了现在保存的主要任务，漏掉了费雷拉最后特别强调的对未来认识的影响。\n\n**费雷拉已经认定今天是塑料时代，保存的重点还只是帮我们区分时代名称吗？**\n\n不是。她进一步关心后人会从留下的东西怎样认识今天。\n\n**第一轮判断：C排除。**","articleRects":[[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[[292,1913,609,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"25","paragraphPids":[6]},"html":"<h3>C. will help us separate the material ages</h3>\n<blockquote><p>将帮助我们区分各个材料时代</p>\n</blockquote>\n<p>把C接回题干，它说的是：费雷拉认为保存塑料人造物品将帮助我们区分各个材料时代。</p>\n<p>C说帮助我们区分材料时代。前面确实举石器时代、铁器时代，但费雷拉随后已经说<code>We now live in an age of plastic</code>，我们看未知的是什么。</p>\n<blockquote><p>first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums</p>\n</blockquote>\n<blockquote><p>We now live in an age of plastic</p>\n</blockquote>\n<blockquote><p>how in the future we'll be seen</p>\n</blockquote>\n<p>石器、铁器等时代已经通过馆藏器物被辨认。作者也已经把当下称为塑料时代，并不是还要靠保存工作来分清我们在哪个材料时代。</p>\n<p>未来的问题是后人会怎样看待我们，而不只是给时代分一个类别。</p>\n<p>C把前面的历史例子当成了现在保存的主要任务，漏掉了费雷拉最后特别强调的对未来认识的影响。</p>\n<p><strong>费雷拉已经认定今天是塑料时代，保存的重点还只是帮我们区分时代名称吗？</strong></p>\n<p>不是。她进一步关心后人会从留下的东西怎样认识今天。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"25题","raw":"### D. has an impact on today’s cultural life\n\n> 对今天的文化生活有影响\n\n把D接回题干，它说的是：费雷拉认为保存塑料人造物品对今天的文化生活有影响。\n\nD说影响今天的文化生活。原句`how in the future we’ll be seen`有明确的时间，我们把看的人和被看的人分清。\n\n> what we decide to collect today\n\n> will have a strong impact on how in the future we'll be seen\n\n被认识的是我们这一代或这个塑料时代，看我们的是未来的人。今天的保存选择会影响他们能得到什么印象。\n\nD把结果放回今天，变成影响当下文化生活。即使博物馆活动可能对今天有作用，这也不是费雷拉这句实际强调的时间和内容。\n\n不能因为保存行为发生在今天，就让它的主要影响也自动落在今天。\n\n**保存决定在今天作出，费雷拉强调的影响是今天文化生活，还是未来怎样认识我们？**\n\n是后者。D把未来认识改成了当前文化影响。\n\n**第一轮判断：D排除。**","articleRects":[[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[[292,1966,597,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"25","paragraphPids":[6]},"html":"<h3>D. has an impact on today’s cultural life</h3>\n<blockquote><p>对今天的文化生活有影响</p>\n</blockquote>\n<p>把D接回题干，它说的是：费雷拉认为保存塑料人造物品对今天的文化生活有影响。</p>\n<p>D说影响今天的文化生活。原句<code>how in the future we’ll be seen</code>有明确的时间，我们把看的人和被看的人分清。</p>\n<blockquote><p>what we decide to collect today</p>\n</blockquote>\n<blockquote><p>will have a strong impact on how in the future we'll be seen</p>\n</blockquote>\n<p>被认识的是我们这一代或这个塑料时代，看我们的是未来的人。今天的保存选择会影响他们能得到什么印象。</p>\n<p>D把结果放回今天，变成影响当下文化生活。即使博物馆活动可能对今天有作用，这也不是费雷拉这句实际强调的时间和内容。</p>\n<p>不能因为保存行为发生在今天，就让它的主要影响也自动落在今天。</p>\n<p><strong>保存决定在今天作出，费雷拉强调的影响是今天文化生活，还是未来怎样认识我们？</strong></p>\n<p>是后者。D把未来认识改成了当前文化影响。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"25题","raw":"### 25题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一遍留下B。费雷拉把今天的保存选择与未来对我们这个时代的认识相连，并以过去材料时代的划分作说明，能够推出深远的历史意义。","articleRects":[],"questionRects":[[226,1756,846,38],[292,1808,583,38],[292,1861,564,38],[292,1913,609,38],[292,1966,597,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"25"},"html":"<h3>25题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。费雷拉把今天的保存选择与未来对我们这个时代的认识相连，并以过去材料时代的划分作说明，能够推出深远的历史意义。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | But some plastic materials change over time；culturally important objects | But some plastic materials change over time把话题从塑料太耐用、造成垃圾问题，转向有些塑料会随时间变化；这些变化给博物馆保存culturally important objects造成困难，并引出多种面临风险的物品。 | 从耐用带来的垃圾问题转向材料变化带来的保存困难，提出文章讨论的问题。 |\n| 第2段 | mix ingredients properly；already a time bomb | mix ingredients properly说明部分艺术品的脆弱与作品成形时未能恰当配料有关；already a time bomb进一步强调，隐患在成品做出来时就已经存在。这一段解释前段保存困难的一种成因。 | 解释保存困难的一种成因：制作时的配料问题会留下隐患。 |\n| 第3段 | it’s not the artist’s fault；walk around on the carpets | it’s not the artist’s fault补充说，有时不能把问题归于艺术家。吉拉尔迪希望观众walk around on the carpets，因此作品原本就需要耐用；这一设计意图引出下一段材料的实际状况。 | 补充并非都能归责于艺术家，引入需要耐用的地毯作品。 |\n| 第4段 | especially vulnerable to light damage；splitting | especially vulnerable to light damage指出所用泡沫容易受光照损伤，作品已经出现splitting；博物馆因而把其中一些作品收在暗处。这里把第3段的耐用需求与材料实际受损连起来，呈现保存时遇到的具体困难。 | 将作品的耐用需求与材料实际受损对照，为修复工作交代原因。 |\n| 第5段 | prevent further light damage；gone on display again | prevent further light damage和rebuild worn polymer fibers说明范·奥斯滕团队试图阻止继续受损并修复纤维；several sculptures have even gone on display again表明保护工作取得成效。这一段承接前段损伤，给出处理目标及结果。 | 承接材料损伤，展示保护与修复的目标及成效。 |\n| 第6段 | Despite success stories；will likely get harder | Despite success stories承认前段的成功，will likely get harder却将判断转回整体保存前景。旧物品继续发生什么变化、新型塑料被设计来做什么，这两处仍是**[xxx]**；作者用Worse评价后一种情况，并指出这类塑料越来越普遍，因而并未把个别成功写成困难已经解决。 | 从个别成功转回整体前景，说明保存困难还可能增加。 |\n| 第7段 | more is at stake here than individual objects；how in the future we’ll be seen | more is at stake here than individual objects把意义从单件物品扩大到时代认识。过去通过博物馆物品划分材料时代，我们现在又处于an age of plastic；今天收藏、保存哪些物品，将影响how in the future we'll be seen。这一段解释保存工作为什么关系到后人对塑料时代的理解。 | 把单件物品的保存扩大到后人如何认识这个时代，说明工作的意义。 |\n\n全文观点：塑料物品的材料变化给文化物品的保存带来困难，制作与材料条件都可能牵涉其中。保护技术已有成功实例，但作者判断保存工作仍可能更难；今天留下哪些塑料物品，还关系到后人怎样认识我们这个时代。","articleRects":[[274,292,1122,38],[202,343,1194,38],[202,393,1194,38],[202,443,1194,39],[202,495,1195,38],[202,546,1184,37],[202,596,1194,38],[203,647,1177,38],[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39],[274,1002,1122,37],[202,1053,1194,38],[202,1104,1194,37],[204,1153,1187,39],[202,1205,1194,38],[202,1256,440,37],[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37],[274,1510,1112,37],[202,1560,1194,38],[202,1609,1194,40],[202,1661,1194,38],[202,1712,1125,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38],[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td "进阶回查","raw":"## 回查24题：A还是D？\n\nA. costly\n\nD. challenging\n\nA说费用高，D说有挑战。第一遍看到化学处理与保护罩，A让人想到可能有开支，但原文并未给出费用；D已有`will likely get harder`直接对应。\n\n现在把这项工作的困难接完整。第2段有制作时的配比问题：\n\n> If you don’t have exact amounts, it goes wrong.\n>\n> The object you make is already a time bomb.\n\n物品可能从做出来就有隐患。吉拉尔迪的例子又说明，不一定是配料错误，材料本身也可能：\n\n> especially vulnerable to light damage\n\n因此要避光、阻止继续损伤、重建纤维，重新展出时还要保护。这里写的是为什么难保存，以及怎样尝试解决。\n\n第6段的总体判断是：\n\n> Despite success stories like van Oosten’s, preservation of plastics will likely get harder.\n\n已有成功并不表示任务变容易，旧物仍变化，更多可降解材料又给长期保存带来难题。末段还说明不能轻易放弃，因为今天留什么会影响后人怎样看我们。\n\n**作者把配料隐患、怕光和可降解材料接起来，是在比较保存开支，还是在说明保存需要克服越来越多困难？**\n\n是在说明困难。A仍可能符合某项实际修复的花费，但文中没有把“保存费用高”作出总体判断。化学品的遮挡词也不能代替费用证据。D有直接评价和前后原因共同支持。\n\n> **24题选D。**","articleRects":[[274,1510,1112,37],[202,1560,1194,38],[202,1609,1194,40],[202,1661,1194,38],[202,1712,1125,38],[274,1763,1122,38],[202,1814,1189,37],[202,1864,748,38],[274,698,1122,38],[202,749,1194,37],[202,799,1194,38],[202,849,1194,39],[202,899,1194,40],[202,950,339,39],[273,1307,1123,37],[202,1357,1194,38],[202,1408,1194,38],[202,1459,576,37],[274,1915,1122,38],[202,1966,1194,38],[228,2269,1196,38],[228,2320,1193,38],[228,2370,1193,39],[228,2422,1194,38],[227,2471,385,32]],"questionRects":[[226,1441,774,37],[293,1493,134,38],[292,1546,184,37],[292,1598,193,38],[292,1651,216,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","D"],"newEvidencePids":[2,4,7],"finalChoice":"D","qid":"24","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查24题：A还是D？</h2>\n<p>A. costly</p>\n<p>D. challenging</p>\n<p>A说费用高，D说有挑战。第一遍看到化学处理与保护罩，A让人想到可能有开支，但原文并未给出费用；D已有<code>will likely get harder</code>直接对应。</p>\n<p>现在把这项工作的困难接完整。第2段有制作时的配比问题：</p>\n<blockquote><p>If you don’t have exact amounts, it goes wrong.</p>\n<p>The object you make is already a time bomb.</p>\n</blockquote>\n<p>物品可能从做出来就有隐患。吉拉尔迪的例子又说明，不一定是配料错误，材料本身也可能：</p>\n<blockquote><p>especially vulnerable to light damage</p>\n</blockquote>\n<p>因此要避光、阻止继续损伤、重建纤维，重新展出时还
