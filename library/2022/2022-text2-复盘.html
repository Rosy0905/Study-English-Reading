mited choice of jobs.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 最后两段表明，Z世代只有有限工作选择。\n\n`limited choice of jobs`谈可供选择的工作范围，第6段的17 `different employers`和`five different careers`则预计一生实际经历多少雇主、多少职业，回看这组数字的用途。\n\n原文预计他们会为17 `different employers`工作并经历`five different careers`，说明职业经历会不断变化，因此需要持续提升技能。`limited choice of jobs`则对可选择的职位范围作出“有限”的判断。\n\n一个人预计实际经历多少雇主和职业，不等于一共只有多少机会可供选择；这组数字没有统计选择范围，更没有说多次转换职业是由于可选工作太少。\n\n技术压力被列为变化原因之一，也不能直接改写为工作选择有限。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1712,1344,365],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-30-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>最后两段表明，Z世代只有有限工作选择。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>17个雇主、5种职业是预计经历的变化次数，未统计全部可选择机会，更未说机会有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.\nOlder generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\ el":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>最后两段表明，Z世代只有有限工作选择。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>17个雇主、5种职业是预计经历的变化次数，未统计全部可选择机会，更未说机会有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.\nOlder generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段表明，Z世代只有有限工作选择。</p>\n</blockquote>\n<p><code>limited choice of jobs</code>谈可供选择的工作范围，第6段的17 <code>different employers</code>和<code>five different careers</code>则预计一生实际经历多少雇主、多少职业，回看这组数字的用途。</p>\n<p>原文预计他们会为17 <code>different employers</code>工作并经历<code>five different careers</code>，说明职业经历会不断变化，因此需要持续提升技能。<code>limited choice of jobs</code>则对可选择的职位范围作出“有限”的判断。</p>\n<p>一个人预计实际经历多少雇主和职业，不等于一共只有多少机会可供选择；这组数字没有统计选择范围，更没有说多次转换职业是由于可选工作太少。</p>\n<p>技术压力被列为变化原因之一，也不能直接改写为工作选择有限。</p>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.\nOlder generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n<p>Z世代不大可能在18岁或21岁便完成全部教育；他们需在整个职业生涯不断提升技能，以保持就业能力。据估计，由于技术压力、自我实现和多样性追求，这一代一生会为17个不同雇主工作并经历5种职业。教育，包括校园之外的学习，将成为他们职业轨迹的核心部分。</p>\n<p>上一代常以现在时和个人身份谈自己的学位，例如我是地理学者或古典学者。他们的子女不会如此说，仿佛早已知道学位不会以同样方式定义自己。</p>\n</blockquote>\n<p>多次变化被用来解释为何需持续提升技能，原因还包括个人实现和追求多样性，而非只写被迫缺少选择。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>They will have a limited choice of jobs.</p>\n<p>最后两段表明，Z世代只有有限工作选择。</p>\n</blockquote>\n<p>D需要就业选择范围受限的证据。实际经历多少工作不等于总共只能选多少，技术压力也不能单独推出机会有限。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"30题结论","raw":"### 30题结论\n\n> **30. A**\n\n- A：整个职业生涯不断提升技能，且教育不限校园，说明持续学习比某个早期学位更能代表Z世代，A概括这一长期特点。\n- B：他们是不断接受教育、提升技能的学习者，不是被预测将成为教育工作者。B把参与学习改成从事教育职业。\n- C：学位不会同样界定自我身份，不等于学位不再吸引他们。一个人仍可选择深造而不以一次学历定义终身。\n- D：17个雇主、5种职业是预计经历的变化次数，未统计全部可选择机会，更未说机会有限。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1712,1344,365],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"30","questionConclusion":true},"html":"<blockquote>\n<p><strong>30. A</strong></p>\n</blockquote>\n<ul>\n<li>A：整个职业生涯不断提升技能，且教育不限校园，说明持续学习比某个早期学位更能代表Z世代，A概括这一长期特点。</li>\n<li>B：他们是不断接受教育、提升技能的学习者，不是被预测将成为教育工作者。B把参与学习改成从事教育职业。</li>\n<li>C：学位不会同样界定自我身份，不等于学位不再吸引他们。一个人仍可选择深造而不以一次学历定义终身。</li>\n<li>D：17个雇主、5种职业是预计经历的变化次数，未统计全部可选择机会，更未说机会有限。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：学位价值的转变与Z世代的选择**（段落1引入主题） 当前形势：Z世代面临大学申请 → 需要思考：【学位的意义、目的和价值如何改变 + Z世代在教育第三阶段需要考虑什么】\n\n↓（历史对比）\n\n**逻辑层次2：千禧一代的教训**（段落2问题呈现） 过去承诺：（学校表现好 + 获得体面学位 = 人生有保障）→ 现实：【学位普遍化 → 学位贬值 → 教育不再是社会流动的可靠途径】→ 数据支撑：英国28%毕业生从事非毕业生工作（是OECD平均的两倍）\n\n↓（观点澄清）\n\n**逻辑层次3：重新定位学位的意义**（段落3态度阐明） 并非否定学位价值 // 而是强调：【学位不适合所有人 + 从中学到大学不是必然 + 存在其他选择】\n\n↓（积极变化）\n\n**逻辑层次4：观念转变的迹象**（段落4现状改善） Z世代：从千禧一代吸取教训 // 父母和老师：仍固守学位思维 → 雇主态度：【早已认识到离校生优势（更忠诚投入）+ 开始取消某些职位的学位要求】\n\n→（对选择学位者的建议）\n\n**逻辑层次5：学位的新策略**（段落5深造建议） 对选择学位者：【第一个学位可能只是开始 → 通才时代需要专门技能 → 研究生比本科生多赚40% → 当人人有一个学位时，拥有两个才合理】\n\n↓（更深层的变化）\n\n**逻辑层次6：终身学习的必然性**（段落6-7未来展望） Z世代的职业特征：【不会在18或21岁结束教育 → 需要持续提升技能 → 预计为17个雇主工作、从事5种职业】→ 教育成为职业轨迹核心 → 身份认同变化：【老一辈：\"我是某某学家\" // Z世代：学位不再定义身份】\n\n↑（全文主旨）\n\n全文核心观点：面对学位贬值的现实，Z世代需要重新评估大学教育的必要性，认识到学位不是唯一选择，同时要为终身学习做好准备，因为在快速变化的时代，持续的教育和技能提升将比单一学位更能定义他们的职业生涯。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：学位价值的转变与Z世代的选择</strong>（段落1引入主题） 当前形势：Z世代面临大学申请 → 需要思考：【学位的意义、目的和价值如何改变 + Z世代在教育第三阶段需要考虑什么】</p>\n<p>↓（历史对比）</p>\n<p><strong>逻辑层次2：千禧一代的教训</strong>（段落2问题呈现） 过去承诺：（学校表现好 + 获得体面学位 = 人生有保障）→ 现实：【学位普遍化 → 学位贬值 → 教育不再是社会流动的可靠途径】→ 数据支撑：英国28%毕业生从事非毕业生工作（是OECD平均的两倍）</p>\n<p>↓（观点澄清）</p>\n<p><strong>逻辑层次3：重新定位学位的意义</strong>（段落3态度阐明） 并非否定学位价值 // 而是强调：【学位不适合所有人 + 从中学到大学不是必然 + 存在其他选择】</p>\n<p>↓（积极变化）</p>\n<p><strong>逻辑层次4：观念转变的迹象</strong>（段落4现状改善） Z世代：从千禧一代吸取教训 // 父母和老师：仍固守学位思维 → 雇主态度：【早已认识到离校生优势（更忠诚投入）+ 开始取消某些职位的学位要求】</p>\n<p>→（对选择学位者的建议）</p>\n<p><strong>逻辑层次5：学位的新策略</strong>（段落5深造建议） 对选择学位者：【第一个学位可能只是开始 → 通才时代需要专门技能 → 研究生比本科生多赚40% → 当人人有一个学位时，拥有两个才合理】</p>\n<p>↓（更深层的变化）</p>\n<p><strong>逻辑层次6：终身学习的必然性</strong>（段落6-7未来展望） Z世代的职业特征：【不会在18或21岁结束教育 → 需要持续提升技能 → 预计为17个雇主工作、从事5种职业】→ 教育成为职业轨迹核心 → 身份认同变化：【老一辈：&quot;我是某某学家&quot; // Z世代：学位不再定义身份】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：面对学位贬值的现实，Z世代需要重新评估大学教育的必要性，认识到学位不是唯一选择，同时要为终身学习做好准备，因为在快速变化的时代，持续的教育和技能提升将比单一学位更能定义他们的职业生涯。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Reconsidering what a university degree is for\n\n> 重新考虑大学学位的意义\n\n以学生填写申请和权衡选择为背景，提出学位的目的与价值已变，需要重新考虑。\n\n> As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\n\n申请表和权衡选择建立情境，worth considering之后真正提出学位意义、目的、价值已经变化，需要重新判断大学路线。\n\n这一部分的推进关系是：\n\n> 本科选择情境 → 学位价值发生变化 → 重新评估教育路线\n\nwhat ... is for对应point、purpose、value，讨论对象是教育路径而非仅挑哪所大学。\n\n再看最强干扰项D：A requirement that every young person avoid university。\n\n重新判断必要性不是命令所有人不读大学。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Reconsidering what a university degree is for</p>\n<blockquote>\n<p>重新考虑大学学位的意义</p>\n</blockquote>\n<p>以学生填写申请和权衡选择为背景，提出学位的目的与价值已变，需要重新考虑。</p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.</p>\n</blockquote>\n<p>申请表和权衡选择建立情境，worth considering之后真正提出学位意义、目的、价值已经变化，需要重新判断大学路线。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>本科选择情境 → 学位价值发生变化 → 重新评估教育路线</p>\n</blockquote>\n<p>what ... is for对应point、purpose、value，讨论对象是教育路径而非仅挑哪所大学。</p>\n<p>再看最强干扰项D：A requirement that every young person avoid university。</p>\n<p>重新判断必要性不是命令所有人不读大学。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】F. Why a degree is no longer a guaranteed route upward\n\n> 为何学位不再保证向上流动\n\n先对比过去学位保一生的承诺与如今贬值、就业错配，再说明大学并非人人唯一必经路。\n\n> Millennials were told that if you did well in school, got a decent degree, you would be set up for life.\n\n过去好学位保障一生的承诺先被摆出，But转折指出承诺未能兑现。\n\n> Education was no longer a secure route of social mobility.\n\n不再是可靠社会流动途径概括学位普及后的回报变化，非学历岗位比例是这一变化的证据。\n\n> This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.\n\nnot to say...but rather限制结论：不是全盘否定学位，而是大学不适合所有人并存在替代路线。\n\n这一部分的推进关系是：\n\n> 学位保障承诺不足 → 贬值与就业错配 → 大学不再是人人必经路\n\nno longer guaranteed对应no longer a secure route，不是否定所有学位价值。\n\n再看最强干扰项G：A complete loss of interest in learning。\n\n考虑其他路径不等于不再学习。\n\n**42题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】F. Why a degree is no longer a guaranteed route upward</p>\n<blockquote>\n<p>为何学位不再保证向上流动</p>\n</blockquote>\n<p>先对比过去学位保一生的承诺与如今贬值、就业错配，再说明大学并非人人唯一必经路。</p>\n<blockquote>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life.</p>\n</blockquote>\n<p>过去好学位保障一生的承诺先被摆出，But转折指出承诺未能兑现。</p>\n<blockquote>\n<p>Education was no longer a secure route of social mobility.</p>\n</blockquote>\n<p>不再是可靠社会流动途径概括学位普及后的回报变化，非学历岗位比例是这一变化的证据。</p>\n<blockquote>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</blockquote>\n<p>not to say...but rather限制结论：不是全盘否定学位，而是大学不适合所有人并存在替代路线。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>学位保障承诺不足 → 贬值与就业错配 → 大学不再是人人必经路</p>\n</blockquote>\n<p>no longer guaranteed对应no longer a secure route，不是否定所有学位价值。</p>\n<p>再看最强干扰项G：A complete loss of interest in learning。</p>\n<p>考虑其他路径不等于不再学习。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. A realistic response to changing degree requirements\n\n> 对学位要求变化作出现实回应\n\nZ世代开始向前辈经验学习，雇主认识到聘用中学毕业生和取消部分岗位学位门槛的优势。\n\n> Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset.\n\nThankfully肯定年轻人开始借鉴前辈，even if说明父母教师仍守旧，并非所有群体同时改变。\n\n> Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates.\n\n雇主看重中学毕业生的投入与忠诚，提供超越唯学历判断的具体理由。\n\n> Many too are seeing the advantages of scrapping a degree requirement for certain roles.\n\n取消某些岗位学历门槛将态度落实为做法，certain限制范围，标题应概括务实回应而不是全面取消学历。\n\n这一部分的推进关系是：\n\n> 年轻人重新选择 → 雇主认可实际表现 → 部分岗位取消学位门槛\n\nrealistic response对应按实际表现而非只看学位，changing requirements对应scrapping。\n\n再看最强干扰项D：A requirement that every young person avoid university。\n\n取消某些岗位门槛并不要求人人避开大学。\n\n**43题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. A realistic response to changing degree requirements</p>\n<blockquote>\n<p>对学位要求变化作出现实回应</p>\n</blockquote>\n<p>Z世代开始向前辈经验学习，雇主认识到聘用中学毕业生和取消部分岗位学位门槛的优势。</p>\n<blockquote>\n<p>Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset.</p>\n</blockquote>\n<p>Thankfully肯定年轻人开始借鉴前辈，even if说明父母教师仍守旧，并非所有群体同时改变。</p>\n<blockquote>\n<p>Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates.</p>\n</blockquote>\n<p>雇主看重中学毕业生的投入与忠诚，提供超越唯学历判断的具体理由。</p>\n<blockquote>\n<p>Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n</blockquote>\n<p>取消某些岗位学历门槛将态度落实为做法，certain限制范围，标题应概括务实回应而不是全面取消学历。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>年轻人重新选择 → 雇主认可实际表现 → 部分岗位取消学位门槛</p>\n</blockquote>\n<p>realistic response对应按实际表现而非只看学位，changing requirements对应scrapping。</p>\n<p>再看最强干扰项D：A requirement that every young person avoid university。</p>\n<p>取消某些岗位门槛并不要求人人避开大学。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】E. The case for further study in a specific field\n\n> 继续深造某个专门领域的理由\n\n对仍选择学位路径的人，作者指出专门技能和知识有价值，研究生收入比较支持继续深造。\n\n> For those for whom a degree is the desired route, consider that this may well be the first of many.\n\nFor those限定仍选择学位路线者，first of many提示初次学位未必是学习终点。\n\n> Postgraduates now earn 40 percent more than graduates.\n\n研究生收入高40%给出专门化深造的回报依据，并非建议与高收入者合作。\n\n> When more and more of us have a degree, it makes sense to have two.\n\nhave two将讨论落实到进一步学位教育，标题需包含专门领域继续学习的理由。\n\n这一部分的推进关系是：\n\n> 仍选学位路线 → 专门知识技能有回报 → 考虑进一步深造\n\nspecific field概括specific knowledge or skills，further study对应first of many和have two。\n\n再看最强干扰项A：A realistic response to changing degree requirements。\n\nA讨论雇主取消门槛，本段转向已选学位者的后续提升。\n\n**44题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】E. The case for further study in a specific field</p>\n<blockquote>\n<p>继续深造某个专门领域的理由</p>\n</blockquote>\n<p>对仍选择学位路径的人，作者指出专门技能和知识有价值，研究生收入比较支持继续深造。</p>\n<blockquote>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many.</p>\n</blockquote>\n<p>For those限定仍选择学位路线者，first of many提示初次学位未必是学习终点。</p>\n<blockquote>\n<p>Postgraduates now earn 40 percent more than graduates.</p>\n</blockquote>\n<p>研究生收入高40%给出专门化深造的回报依据，并非建议与高收入者合作。</p>\n<blockquote>\n<p>When more and more of us have a degree, it makes sense to have two.</p>\n</blockquote>\n<p>have two将讨论落实到进一步学位教育，标题需包含专门领域继续学习的理由。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>仍选学位路线 → 专门知识技能有回报 → 考虑进一步深造</p>\n</blockquote>\n<p>specific field概括specific knowledge or skills，further study对应first of many和have two。</p>\n<p>再看最强干扰项A：A realistic response to changing degree requirements。</p>\n<p>A讨论雇主取消门槛，本段转向已选学位者的后续提升。</p>\n<p><strong>44题选E。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Education that continues beyond a single qualification\n\n> 超越单一学历并持续进行的教育\n\n职业一生持续提升技能、可能多次转换工作，教育不限校园；后一代也不再用一个学位固定自我身份。\n\n> It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable.\n\n18或21岁不意味着教育结束，throughout their career明确学习贯穿职业全程。\n\n> Education, and not just knowledge gained on campus, will be a core part of Generation Z's career trajectory.\n\nnot just...on campus把教育范围拓展到校园之外，多次工作转换是不断更新技能的背景。\n\n> Older generations often talk about their degree in the present and personal tense: \"I am a geographer\" or \"I am a classist.\" Their sons or daughters would never say such a thing; it's as if they already know that their degree won't define them in the same way.\n\n两代人自我称谓的比较说明一个早期学位不再固定身份，标题需同时覆盖持续教育与超越单一学历。\n\n这一部分的推进关系是：\n\n> 职业反复变化 → 持续且不限校园的学习 → 单个学位不再定义一生\n\ncontinues beyond对应throughout career与not just ... campus，single qualification对应末段身份对比。\n\n再看最强干扰项G：A complete loss of interest in learning。\n\n本段强调持续学习，与完全失去兴趣相反。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Education that continues beyond a single qualification</p>\n<blockquote>\n<p>超越单一学历并持续进行的教育</p>\n</blockquote>\n<p>职业一生持续提升技能、可能多次转换工作，教育不限校园；后一代也不再用一个学位固定自我身份。</p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable.</p>\n</blockquote>\n<p>18或21岁不意味着教育结束，throughout their career明确学习贯穿职业全程。</p>\n<blockquote>\n<p>Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.</p>\n</blockquote>\n<p>not just...on campus把教育范围拓展到校园之外，多次工作转换是不断更新技能的背景。</p>\n<blockquote>\n<p>Older generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n</blockquote>\n<p>两代人自我称谓的比较说明一个早期学位不再固定身份，标题需同时覆盖持续教育与超越单一学历。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>职业反复变化 → 持续且不限校园的学习 → 单个学位不再定义一生</p>\n</blockquote>\n<p>continues beyond对应throughout career与not just ... campus，single qualification对应末段身份对比。</p>\n<p>再看最强干扰项G：A complete loss of interest in learning。</p>\n<p>本段强调持续学习，与完全失去兴趣相反。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出重新判断学位价值的需要 |\n| B | 由继续学位学习拓展到职业全程提升 |\n| C | 提出其他路径并介绍雇主的现实回应 |\n| D | 用代际自我描述解释学位定义作用减弱 |\n| E | 对学位路径提出专门化继续深造 |\n| F | 以就业错配说明学位不再保证回报 |\n| G | 说明学习范围不限校园与早期学历 |\n| H | 总结教育路径多样但持续学习重要 |\n\n全文推进：\n\n> 提出重新判断学位价值的需要 → 以就业错配说明学位不再保证回报 → 提出其他路径并介绍雇主的现实回应 → 对学位路径提出专门化继续深造 → 由继续学位学习拓展到职业全程提升 → 说明学习范围不限校园与早期学历 → 用代际自我描述解释学位定义作用减弱 → 总结教育路径多样但持续学习重要\n\n完整顺序：\n\n**A → F → C → E → B → G → D → H**\n\n41—45：F、C、B、G、D。","sect  second qualification.\n\n第二学位后的持续学习属于后面的选择展开，这里还需先说明为何旧承诺不可靠，不能跳过就业证据。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → C。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Changes in the value of qualifications make that promise less reliable for those applying today.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Its declining reliability becomes visible when graduates take jobs that do not require a university qualification.</p>\n</blockquote>\n<p>前段说学位价值变化使旧承诺less reliable，Its declining reliability承接并引入毕业生就业事实。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>As degrees have spread, they have become a less secure route to upward social movement. This observation challenges the guarantee attached to a degree without proving that all higher education lacks value.</p>\n</blockquote>\n<p>学位普及后不再稳定带来上升，This observation接住这种作用变化，同时限制为不能据此否定全部高等教育。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Rejecting the guarantee leaves room for educational routes other than automatic progression to university.</p>\n</blockquote>\n<p>Rejecting the guarantee回指不再保证回报，由此才打开大学之外路线的讨论。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出重新判断学位价值的需要 → 以就业错配说明学位不再保证回报 → 提出其他路径并介绍雇主的现实回应</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>The need to keep learning extends beyond the decision to obtain a second qualification.</p>\n</blockquote>\n<p>第二学位后的持续学习属于后面的选择展开，这里还需先说明为何旧承诺不可靠，不能跳过就业证据。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → C → E。\n\n先看前段F的结尾：\n\n> This observation challenges the guarantee attached to a degree without proving that all higher education lacks value.\n\n再看C段开头：\n\n> Rejecting the guarantee leaves room for educational routes other than automatic progression to university.\n\n前段区分承诺失效与教育无价值，Rejecting the guarantee承接前者，再引出大学不必自动成为下一站。\n\n本段内部继续写道：\n\n> Some young people are already learning from the experience of their predecessors. Employers also recognise that school leavers can become committed staff and that certain roles need not require a degree.\n\n年轻人吸收前辈经验、雇主认可中学毕业生和某些岗位不需学历，共同说明替代路线已有现实基础。\n\n后段E开头是：\n\n> For students who still choose university, the first qualification may be only a beginning.\n\nFor students who still choose university以still转向另一类人：其他选择存在，但仍可选择大学。\n\n这三段的推进关系：\n\n> 以就业错配说明学位不再保证回报 → 提出其他路径并介绍雇主的现实回应 → 对学位路径提出专门化继续深造\n\n再检验候选B：\n\n> The need to keep learning extends beyond the decision to obtain a second qualification.\n\n超越第二学位的持续学习需要先交代第二学位，此处尚在介绍不同路线，不能提前跳到后续学习层次。\n\n**42题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>42题是全文第3段，局部关系为F → C → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>This observation challenges the guarantee attached to a degree without proving that all higher education lacks value.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Rejecting the guarantee leaves room for educational routes other than automatic progression to university.</p>\n</blockquote>\n<p>前段区分承诺失效与教育无价值，Rejecting the guarantee承接前者，再引出大学不必自动成为下一站。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Some young people are already learning from the experience of their predecessors. Employers also recognise that school leavers can become committed staff and that certain roles need not require a degree.</p>\n</blockquote>\n<p>年轻人吸收前辈经验、雇主认可中学毕业生和某些岗位不需学历，共同说明替代路线已有现实基础。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>For students who still choose university, the first qualification may be only a beginning.</p>\n</blockquote>\n<p>For students who still choose university以still转向另一类人：其他选择存在，但仍可选择大学。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以就业错配说明学位不再保证回报 → 提出其他路径并介绍雇主的现实回应 → 对学位路径提出专门化继续深造</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>The need to keep learning extends beyond the decision to obtain a second qualification.</p>\n</blockquote>\n<p>超越第二学位的持续学习需要先交代第二学位，此处尚在介绍不同路线，不能提前跳到后续学习层次。</p>\n<p><strong>42题选C。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → B → G。\n\n先看前段E的结尾：\n\n> Further study in a particular field may therefore offer advantages, as differences in graduate and postgraduate earnings suggest.\n\n再看B段开头：\n\n> The need to keep learning extends beyond the decision to obtain a second qualification.\n\n前段以专门领域深造与收入差异说明第二学历，extends beyond准确接住并扩大继续学习范围。\n\n本段内部继续写道：\n\n> Technological change and personal aspirations can lead people through several employers and careers. Staying employable under these conditions requires skills to be updated repeatedly rather than completed at one fixed age.\n\n技术与个人追求带来多个雇主和职业，under these conditions把保持就业能力接到反复技能更新。\n\n后段G开头是：\n\n> Repeated updating also means that education cannot be confined to a campus.\n\nRepeated updating复现updated repeatedly，下一段继续说明学习不能只限校园。\n\n这三段的推进关系：\n\n> 对学位路径提出专门化继续深造 → 由继续学位学习拓展到职业全程提升 → 说明学习范围不限校园与早期学历\n\n再检验候选D：\n\n> That difference helps explain how younger people describe themselves.\n\n自我称谓的代际区别要等持续教育与早期资格的关系说清后再解释，此处先补为何要不断学习。\n\n**43题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>43题是全文第5段，局部关系为E → B → G。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Further study in a particular field may therefore offer advantages, as differences in graduate and postgraduate earnings suggest.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>The need to keep learning extends beyond the decision to obtain a second qualification.</p>\n</blockquote>\n<p>前段以专门领域深造与收入差异说明第二学历，extends beyond准确接住并扩大继续学习范围。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Technological change and personal aspirations can lead people through several employers and careers. Staying employable under these conditions requires skills to be updated repeatedly rather than completed at one fixed age.</p>\n</blockquote>\n<p>技术与个人追求带来多个雇主和职业，under these conditions把保持就业能力接到反复技能更新。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>Repeated updating also means that education cannot be confined to a campus.</p>\n</blockquote>\n<p>Repeated updating复现updated repeatedly，下一段继续说明学习不能只限校园。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>对学位路径提出专门化继续深造 → 由继续学位学习拓展到职业全程提升 → 说明学习范围不限校园与早期学历</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>That difference helps explain how younger people describe themselves.</p>\n</blockquote>\n<p>自我称谓的代际区别要等持续教育与早期资格的关系说清后再解释，此处先补为何要不断学习。</p>\n<p><strong>43题选B。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为B → G → D。\n\n先看前段B的结尾：\n\n> Staying employable under these conditions requires skills to be updated repeatedly rather than completed at one fixed age.\n\n再看G段开头：\n\n> Repeated updating also means that education cannot be confined to a campus.\n\n前段要求技能反复更新，Repeated updating直接承接，并引出不限校园的后果。\n\n本段内部继续写道：\n\n> Workplace experience, later training and other forms of learning will shape a person’s career. A qualification earned early in life is one resource in this process, not a permanent substitute for it.\n\n工作经历、后续训练和其他学习塑造职业，早期学历只是其中资源，不能永久替代持续发展。\n\n后段D开头是：\n\n> That difference helps explain how younger people describe themselves.\n\nThat difference接早期资格与持续学习的区别，后面用年轻人如何自我描述作具体展示。\n\n这三段的推进关系：\n\n> 由继续学位学习拓展到职业全程提升 → 说明学习范围不限校园与早期学历 → 用代际自我描述解释学位定义作用减弱\n\n再检验候选F：\n\n> Its declining reliability becomes visible when graduates take jobs that do not require a university qualification.\n\n学位回报下降属于前文旧承诺检验，此处讨论学习发生在哪里及学历角色，回到就业错配会打断这项关系。\n\n**44题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>44题是全文第6段，局部关系为B → G → D。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Staying employable under these conditions requires skills to be updated repeatedly rather than completed at one fixed age.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Repeated updating also means that education cannot be confined to a campus.</p>\n</blockquote>\n<p>前段要求技能反复更新，Repeated updating直接承接，并引出不限校园的后果。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Workplace experience, later training and other forms of learning will shape a person’s career. A qualification earned early in life is one resource in this process, not a permanent substitute for it.</p>\n</blockquote>\n<p>工作经历、后续训练和其他学习塑造职业，早期学历只是其中资源，不能永久替代持续发展。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>That difference helps explain how younger people describe themselves.</p>\n</blockquote>\n<p>That difference接早期资格与持续学习的区别，后面用年轻人如何自我描述作具体展示。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由继续学位学习拓展到职业全程提升 → 说明学习范围不限校园与早期学历 → 用代际自我描述解释学位定义作用减弱</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Its declining reliability becomes visible when graduates take jobs that do not require a university qualification.</p>\n</blockquote>\n<p>学位回报下降属于前文旧承诺检验，此处讨论学习发生在哪里及学历角色，回到就业错配会打断这项关系。</p>\n<p><strong>44题选G。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为G → D → H。\n\n先看前段G的结尾：\n\n> A qualification earned early in life is one resource in this process, not a permanent substitute for it.\n\n再看D段开头：\n\n> That difference helps explain how younger people describe themselves.\n\n前段强调早期资格不是持续学习的永久替代，That difference回指这一差别，转向身份表达。\n\n本段内部继续写道：\n\n> Older generations may identify directly with the subject of their degree, whereas their children are less likely to treat it as a complete personal definition. They appear to expect an identity that changes as their knowledge and work develop.\n\nwhereas对比上一代用学科定义自己与子女较少如此，后句把身份变化接到知识和工作的发展。\n\n后段H开头是：\n\n> A useful educational choice must therefore allow for continuing development.\n\ntherefore将身份与学习持续发展的关系收束为教育选择应为后续发展留空间。\n\n这三段的推进关系：\n\n> 说明学习范围不限校园与早期学历 → 用代际自我描述解释学位定义作用减弱 → 总结教育路径多样但持续学习重要\n\n再检验候选F：\n\n> Its declining reliability becomes visible when graduates take jobs that do not require a university qualification.\n\nIts declining reliability需要前文的保障承诺作先行词，此处讨论身份变化，放回就业统计既无恰当所指，也不能接结尾的发展建议。\n\n**45题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>45题是全文第7段，局部关系为G → D → H。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>A qualification earned early in life is one resource in this process, not a permanent substitute for it.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>That difference helps explain how younger people describe themselves.</p>\n</blockquote>\n<p>前段强调早期资格不是持续学习的永久替代，That difference回指这一差别，转向身份表达。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Older generations may identify directly with the subject of their degree, whereas their children are less likely to treat it as a complete personal definition. They appear to expect an identity that changes as their knowledge and work develop.</p>\n</blockquote>\n<p>whereas对比上一代用学科定义自己与子女较少如此，后句把身份变化接到知识和工作的发展。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>A useful educational choice must therefore allow for continuing development.</p>\n</blockquote>\n<p>therefore将身份与学习持续发展的关系收束为教育选择应为后续发展留空间。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明学习范围不限校园与早期学历 → 用代际自我描述解释学位定义作用减弱 → 总结教育路径多样但持续学习重要</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Its declining reliability becomes visible when graduates take jobs that do not require a university qualification.</p>\n</blockquote>\n<p>Its declining reliability需要前文的保障承诺作先行词，此处讨论身份变化，放回就业统计既无恰当所指，也不能接结尾的发展建议。</p>\n<p><strong>45题选D。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **lifelong learning** | **终身学习** | **社会现象｜文化教育｜终身学习** | **个人主题** |\n| informed educational choices | 充分了解后的教育选择 | 人生哲理｜理性选择 | 个人主题 |\n| specialist knowledge | 专门知识 | 社会现象｜文化教育 | 个人主题 |\n| **professional development** | **职业发展** | **社会现象｜社会生活｜提升竞争力** | **个人主题** |\n| practical skills | 实用技能 | 社会现象｜社会生活｜提升竞争力 | 个人主题 |\n| personal fulfilment | 自我实现 | 人生哲理｜理想与抱负 | 个人主题 |\n| career adaptability | 职业适应能力 | 社会现象｜社会生活｜提升竞争力 | 个人主题 const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A realistic response to changing degree requirements</strong></p><p><strong>B. Education that continues beyond a single qualification</strong></p><p><strong>C. Reconsidering what a university degree is for</strong></p><p><strong>D. A requirement that every young person avoid university</strong></p><p><strong>E. The case for further study in a specific field</strong></p><p><strong>F. Why a degree is no longer a guaranteed route upward</strong></p><p><strong>G. A complete loss of interest in learning</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries. This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#x27;s career trajectory. Older generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#x27;s as if they already know that their degree won&#x27;t define them in the same way.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Students choosing an educational path need to reconsider what a degree is expected to provide. Earlier generations were often told that success at school followed by a good degree would secure their future. Changes in the value of qualifications make that promise less reliable for those applying today.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>The need to keep learning extends beyond the decision to obtain a second qualification. Technological change and personal aspirations can lead people through several employers and careers. Staying employable under these conditions requires skills to be updated repeatedly rather than completed at one fixed age.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>Rejecting the guarantee leaves room for educational routes other than automatic progression to university. Some young people are already learning from the experience of their predecessors. Employers also recognise that school leavers can become committed staff and that certain roles need not require a degree.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>That difference helps explain how younger people describe themselves. Older generations may identify directly with the subject of their degree, whereas their children are less likely to treat it as a complete personal definition. They appear to expect an identity that changes as their knowledge and work develop.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>For students who still choose university, the first qualification may be only a beginning. Specific expertise can remain valuable in a world where general degrees are common. Further study in a particular field may therefore offer advantages, as differences in graduate and postgraduate earnings suggest.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Its declining reliability becomes visible when graduates take jobs that do not require a university qualification. As degrees have spread, they have become a less secure route to upward social movement. This observation challenges the guarantee attached to a degree without proving that all higher education lacks value.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Repeated updating also means that education cannot be confined to a campus. Workplace experience, later training and other forms of learning will shape a person’s career. A qualification earned early in life is one resource in this process, not a permanent substitute for it.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>A useful educational choice must therefore allow for continuing development. The question is not whether degrees are always good or always useless, but which path supplies appropriate opportunities at a particular stage. Lifelong learning is the more durable requirement across these different choices.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>crop</td>\n<td>n.一批</td>\n<td>pen</td>\n<td>v.填写</td>\n<td>undergraduate</td>\n<td>adj.本科的</td>\n</tr>\n<tr>\n<td>application</td>\n<td>n.申请</td>\n<td>weigh up</td>\n<td>权衡</td>\n<td>purpose</td>\n<td>n.目的</td>\n</tr>\n<tr>\n<td>value</td>\n<td>n.价值</td>\n<td>Generation Z</td>\n<td>Z世代</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Millennials</td>\n<td>n.千禧一代</td>\n<td>decent</td>\n<td>adj.不错的</td>\n<td>set up for life</td>\n<td>为一生打好基础</td>\n</tr>\n<tr>\n<td>found wanting</td>\n<td>被发现不尽如人意</td>\n<td>universal</td>\n<td>adj.普及的</td>\n<td>devalued</td>\n<td>adj.贬值的</td>\n</tr>\n<tr>\n<td>social mobility</td>\n<td>社会流动</td>\n<td>non-graduate roles</td>\n<td>不要求大学学历的岗位</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th> </td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>generations</td>\n<td>n.世代</td>\n<td>present tense</td>\n<td>现在时</td>\n<td>personal</td>\n<td>adj.个人的</td>\n</tr>\n<tr>\n<td>geographer</td>\n<td>n.地理学者</td>\n<td>degree</td>\n<td>n.学位</td>\n<td>define</td>\n<td>v.定义；界定</td>\n</tr>\n<tr>\n<td>in the same way</td>\n<td>以同样方式</td>\n<td>as if</td>\n<td>仿佛</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.</p>\n<h3>意群划分 · 第1段</h3>\n<p>As the latest crop of students / pen their undergraduate application form / and weigh up their options, / it may be worth considering / just how the point, purpose and value / of a degree / has changed / and what Generation Z need to consider / as they start / the third stage / of their educational journey.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>当最新一批学生 / 填写他们的本科申请表 / 并权衡他们的选择时，/ 可能值得考虑 / 究竟意义、目的和价值 / 学位的 / 已经如何改变 / 以及Z世代需要考虑什么 / 当他们开始 / 第三阶段 / 他们教育旅程的。</p>\n<h3>标准译文 · 第1段</h3>\n<p>当最新一批学生填写本科申请表并权衡选择时，值得思考的是：学位的意义、目的和价值究竟发生了怎样的变化，以及Z世代在开始其教育旅程的第三阶段时需要考虑什么。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Millennials were told / that if you did well in school, / got a decent degree, / you would be set up for life.</p>\n<p>But that promise / has been found wanting.</p>\n<p>As degrees became universal, / they became devalued.</p>\n<p>Education was no longer / a secure route / of social mobility.</p>\n<p>Today, / 28 percent of graduates / in the UK / are in non-graduate roles, / a percentage / which is double the average / among OECD countries.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>千禧一代被告知 / 如果你在学校表现良好，/ 获得一个体面的学位，/ 你的人生就会有保障。</p>\n<p>但那个承诺 / 已被发现是有缺陷的。</p>\n<p>当学位变得普遍时，/ 它们就贬值了。</p>\n<p>教育不再是 / 一条可靠的途径 / 社会流动的。</p>\n<p>今天，/ 28%的毕业生 / 在英国 / 从事非毕业生工作，/ 这个百分比 / 是平均数的两倍 / 在经合组织国家中。</p>\n<h3>标准译文 · 第2段</h3>\n<p>千禧一代曾被告知：只要在学校表现良好，获得体面的学位，人生就会有保障。但这个承诺已被证明是空洞的。随着学位变得普遍，它们也随之贬值。教育不再是社会流动的可靠途径。如今，英国28%的毕业生从事着非毕业生工作，这一比例是经合组织国家平均水平的两倍。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n<h3>意群划分 · 第3段</h3>\n<p>This is not to say / that there is no point / in getting a degree, / but rather stress / that a degree is not for everyone, / that the switch / from classroom to lecture hall / is not an inevitable one / and that other options / are available.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>这并不是说 / 没有意义 / 获得学位，/ 而是强调 / 学位并不适合每个人，/ 这种转换 / 从教室到讲堂 / 不是必然的 / 而且其他选择 / 是可行的。</p>\n<h3>标准译文 · 第3段</h3>\n<p>这并不是说获得学位毫无意义，而是要强调：学位并不适合每个人，从中学教室到大学讲堂的转变并非必然，还有其他选择可供考虑。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Thankfully, / there are signs / that this is already happening, / with Generation Z / seeking to learn / from their millennial predecessors, / even if parents and teachers / tend to be still set / in the degree mindset.</p>\n<p>Employers have long seen / the advantages / of hiring school leavers / who often prove themselves / to be more committed and loyal employees / than graduates.</p>\n<p>Many too / are seeing the advantages / of scrapping a degree requirement / for certain roles.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>值得庆幸的是，/ 有迹象表明 / 这已经在发生，/ Z世代 / 寻求学习 / 从他们千禧一代的前辈，/ 即使父母和老师 / 倾向于仍然固守 / 在学位思维定式中。</p>\n<p>雇主们早就看到了 / 优势 / 雇用离校生的 / 他们经常证明自己 / 是更忠诚和投入的员工 / 比毕业生。</p>\n<p>许多人也 / 正在看到优势 / 取消学位要求的 / 对某些职位。</p>\n<h3>标准译文 · 第4段</h3>\n<p>值得庆幸的是，有迹象表明这种改变已经在发生：Z世代正在从千禧一代前辈那里吸取教训，尽管父母和老师仍然固守着学位至上的思维定式。雇主们早就认识到雇用离校生的优势——他们往往比毕业生更加忠诚和投入。许多雇主也开始意识到，对某些职位取消学位要求是有好处的。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n<h3>意群划分 · 第5段</h3>\n<p>For those / for whom a degree / is the desired route, / consider / that this may well be / the first of many.</p>\n<p>In this age of generalists, / it pays / to have specific knowledge or skills.</p>\n<p>Postgraduates now earn / 40 percent more / than graduates.</p>\n<p>When more and more of us / have a degree, / it makes sense / to have two.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>对于那些人 / 对他们来说学位 / 是理想的路径，/ 要考虑 / 这很可能是 / 许多学位中的第一个。</p>\n<p>在这个通才的时代，/ 是值得的 / 拥有特定的知识或技能。</p>\n<p>研究生现在赚 / 多40% / 比本科生。</p>\n<p>当我们越来越多的人 / 拥有一个学位，/ 就有道理 / 拥有两个。</p>\n<h3>标准译文 · 第5段</h3>\n<p>对于那些将学位视为理想路径的人来说，要考虑到这可能只是众多学位中的第一个。在这个通才泛滥的时代，拥有特定的知识或技能才更有价值。如今研究生的收入比本科生高40%。当越来越多的人拥有一个学位时，拥有两个学位就变得合理了。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.</p>\n<h3>意群划分 · 第6段</h3>\n<p>It is unlikely / that Generation Z / will be done with education / at 18 or 21; / they will need / to be constantly up-skilling / throughout their career / to stay employable.</p>\n<p>It has been estimated / that this generation, / due to the pressures of technology, / the wish for personal fulfilment / and desire for diversity, / will work for 17 different employers / over the course of their working life / and have five different careers.</p>\n<p>Education, / and not just knowledge / gained on campus, / will be a core part / of Generation Z&#39;s career trajectory.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>不太可能 / Z世代 / 会完成教育 / 在18或21岁；/ 他们将需要 / 不断提升技能 / 在整个职业生涯中 / 以保持就业能力。</p>\n<p>据估计 / 这一代人，/ 由于技术的压力，/ 对个人成就的渴望 / 和对多样性的追求，/ 将为17个不同的雇主工作 / 在他们的工作生涯中 / 并有五种不同的职业。</p>\n<p>教育，/ 而不仅仅是知识 / 在校园获得的，/ 将是核心部分 / Z世代职业轨迹的。</p>\n<h3>标准译文 · 第6段</h3>\n<p>Z世代不太可能在18岁或21岁就结束教育；为了保持就业能力，他们需要在整个职业生涯中不断提升技能。据估计，由于技术压力、对个人成就的渴望和对多样性的追求，这一代人在工作生涯中将为17个不同的雇主工作，从事五种不同的职业。教育——不仅仅是校园里获得的知识——将成为Z世代职业轨迹的核心部分。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>Older generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n<h3>意群划分 · 第7段</h3>\n<p>Older generations / often talk about their degree / in the present and personal tense: / &quot;I am a geographer&quot; / or &quot;I am a classist.&quot;</p>\n<p>Their sons or daughters / would never say such a thing; / it&#39;s as if / they already know / that their degree / won&#39;t define them / in the same way.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>老一辈人 / 经常谈论他们的学位 / 用现在时和个人化的语气：/ &quot;我是地理学家&quot; / 或&quot;我是古典学家&quot;。</p>\n<p>他们的儿子或女儿 / 永远不会这样说；/ 就好像 / 他们已经知道 / 他们的学位 / 不会定义他们 / 以同样的方式。</p>\n<h3>标准译文 · 第7段</h3>\n<p>老一辈人经常用现在时和个人化的语气谈论他们的学位：&quot;我是地理学家&quot;或&quot;我是古典学家&quot;。他们的儿女永远不会这样说；就好像他们已经知道，学位不会像定义父辈那样定义他们。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>As the latest crop of students → pen their undergraduate application form + weigh up their options → it may be worth considering：(just how the point, purpose and value：(of a degree) → has changed) + (what Generation Z need to consider：(as they start → the third stage：(of their educational journey))).</p>\n<p><strong>第2段</strong></p>\n<p>Millennials were told：(that if you did well in school + got a decent degree → you would be set up for life).</p>\n<p>But that promise → has been found wanting.</p>\n<p>As degrees became universal → they became devalued.</p>\n<p>Education was no longer → a secure route：(of social mobility).</p>\n<p>Today → 28 percent of graduates：(in the UK) → are in non-graduate roles → a percentage：(which is double the average：(among OECD countries)).</p>\n<p><strong>第3段</strong></p>\n<p>This is not to say：(that there is no point：(in getting a degree)) // but rather stress：(that a degree is not for everyone) + (that the switch：(from classroom to lecture hall) → is not an inevitable one) + (that other options → are available).</p>\n<p><strong>第4段</strong></p>\n<p>Thankfully → there are signs：(that this is already happening)：(with Generation Z → seeking to learn：(from their millennial predecessors)) // even if parents and teachers → tend to be still set：(in the degree mindset).</p>\n<p>Employers have long seen → the advantages：(of hiring school leavers：(who often prove themselves → to be more committed and loyal employees：(than graduates))).</p>\n<p>Many too → are seeing the advantages：(of scrapping a degree requirement：(for certain roles)).</p>\n<p><strong>第5段</strong></p>\n<p>For those：(for whom a degree → is the desired route) → consider：(that this may well be → the first of many).</p>\n<p>In this age of generalists → it pays：(to have specific knowledge or skills).</p>\n<p>Postgraduates now earn → 40 percent more：(than graduates).</p>\n<p>When more and more of us → have a degree → it makes sense：(to have two).</p>\n<p><strong>第6段</strong></p>\n<p>It is unlikely：(that Generation Z → will be done with education：(at 18 or 21)); they will need → to be constantly up-skilling：(throughout their career)：(to stay employable).</p>\n<p>It has been estimated：(that this generation → due to the pressures of technology + the wish for personal fulfilment + desire for diversity → will work for 17 different employers：(over the course of their working life) + have five different careers).</p>\n<p>Education + not just knowledge：(gained on campus) → will be a core part：(of Generation Z&#39;s career trajectory).</p>\n<p><strong>第7段</strong></p>\n<p>Older generations → often talk about their degree：(in the present and personal tense)：(&quot;I am a geographer&quot; or &quot;I am a classist&quot;).</p>\n<p>Their sons or daughters → would never say such a thing; it&#39;s as if → they already know：(that their degree → won&#39;t define them：(in the same way)).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>当最新一批学生 → 填写他们的本科申请表 + 权衡他们的选择时 → 可能值得考虑：(究竟意义、目的和价值：(学位的) → 已经如何改变) + (Z世代需要考虑什么：(当他们开始 → 第三阶段：(他们教育旅程的)))。</p>\n<p><strong>第2段</strong></p>\n<p>千禧一代被告知：(如果你在学校表现良好 + 获得一个体面的学位 → 你的人生就会有保障)。</p>\n<p>但那个承诺 → 已被发现是有缺陷的。</p>\n<p>当学位变得普遍时 → 它们就贬值了。</p>\n<p>教育不再是 → 一条可靠的途径：(社会流动的)。</p>\n<p>今天 → 28%的毕业生：(在英国) → 从事非毕业生工作 → 这个百分比：(是平均数的两倍：(在经合组织国家中))。</p>\n<p><strong>第3段</strong></p>\n<p>这并不是说：(没有意义：(获得学位)) // 而是强调：(学位并不适合每个人) + (这种转换：(从教室到讲堂) → 不是必然的) + (其他选择 → 是可行的)。</p>\n<p><strong>第4段</strong></p>\n<p>值得庆幸的是 → 有迹象表明：(这已经在发生)：(Z世代 → 寻求学习：(从他们千禧一代的前辈)) // 即使父母和老师 → 倾向于仍然固守：(在学位思维定式中)。</p>\n<p>雇主们早就看到了 → 优势：(雇用离校生的：(他们经常证明自己 → 是更忠诚和投入的员工：(比毕业生)))。</p>\n<p>许多人也 → 正在看到优势：(取消学位要求的：(对某些职位))。</p>\n<p><strong>第5段</strong></p>\n<p>对于那些人：(对他们来说学位 → 是理想的路径) → 要考虑：(这很可能是 → 许多学位中的第一个)。</p>\n<p>在这个通才的时代 → 是值得的：(拥有特定的知识或技能)。</p>\n<p>研究生现在赚 → 多40%：(比本科生)。</p>\n<p>当我们越来越多的人 → 拥有一个学位 → 就有道理：(拥有两个)。</p>\n<p><strong>第6段</strong></p>\n<p>不太可能：(Z世代 → 会完成教育：(在18或21岁))；他们将需要 → 不断提升技能：(在整个职业生涯中)：(以保持就业能力)。</p>\n<p>据估计：(这一代人 → 由于技术的压力 + 对个人成就的渴望 + 对多样性的追求 → 将为17个不同的雇主工作：(在他们的工作生涯中) + 有五种不同的职业)。</p>\n<p>教育 + 不仅仅是知识：(在校园获得的) → 将是核心部分：(Z世代职业轨迹的)。</p>\n<p><strong>第7段</strong></p>\n<p>老一辈人 → 经常谈论他们的学位：(用现在时和个人化的语气)：(&quot;我是地理学家&quot;或&quot;我是古典学家&quot;)。</p>\n<p>他们的儿子或女儿 → 永远不会这样说；就好像 → 他们已经知道：(他们的学位 → 不会定义他们：(以同样的方式))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>As the latest crop of students / pen their undergraduate application form / and weigh up their options, / it may be worth considering / just how the point, purpose and value / of a degree / has changed / and what Generation Z need to consider / as they start / the third stage / of their educational journey.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>当最新一批学生 / 填写他们的本科申请表 / 并权衡他们的选择时，/ 可能值得考虑 / 究竟意义、目的和价值 / 学位的 / 已经如何改变 / 以及Z世代需要考虑什么 / 当他们开始 / 第三阶段 / 他们教育旅程的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>As引出当前申请背景；it may be worth considering后并列how与what两个思考对象。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>当最新一批学生  填写他们的本科申请表  并权衡他们的选择时， 可能值得考虑  究竟意义、目的和价值  学位的  已经如何改变  以及Z世代需要考虑什么  当他们开始  第三阶段  他们教育旅程的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>新一批学生权衡申请时，应重新考虑学位的目的和价值。</p>\n</blockquote>\n<p>先交代学生正在申请，再说值得思考学位怎样变化以及新世代要考虑什么。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>当最新一批学生填写本科申请表并权衡选择时，值得思考的是：学位的意义、目的和价值究竟发生了怎样的变化，以及Z世代在开始其教育旅程的第三阶段时需要考虑什么。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>may be worth是建议重新考虑，并非要求延期申请。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>当最新一批学生填写本科申请表并权衡选择时，值得思考的是：学位的意义、目的和价值究竟发生了怎样的变化，以及Z世代在开始其教育旅程的第三阶段时需要考虑什么。</p>\n</blockquote>\n<h2>2. 第4段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Thankfully, / there are signs / that this is already happening, / with Generation Z / seeking to learn / from their millennial predecessors, / even if parents and teachers / tend to be still set / in the degree mindset.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>值得庆幸的是，/ 有迹象表明 / 这已经在发生，/ Z世代 / 寻求学习 / 从他们千禧一代的前辈，/ 即使父母和老师 / 倾向于仍然固守 / 在学位思维定式中。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>with说明变化的表现，even if让步交代父母教师的不同状态。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>值得庆幸的是， 有迹象表明  这已经在发生， Z世代  寻求学习  从他们千禧一代的前辈， 即使父母和老师  倾向于仍然固守  在学位思维定式中。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>Z世代开始借鉴前辈经验，但父母教师常仍固守学位观念。</p>\n</blockquote>\n<p>先说可喜迹象，再说年轻人的行动，最后补出长辈仍未同步改变。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>值得庆幸的是，有迹象表明这种改变已经在发生：Z世代正在从千禧一代前辈那里吸取教训，尽管父母和老师仍然固守着学位至上的思维定式。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>tend to be still set不可译成父母正在改变看法。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>值得庆幸的是，有迹象表明这种改变已经在发生：Z世代正在从千禧一代前辈那里吸取教训，尽管父母和老师仍然固守着学位至上的思维定式。</p>\n</blockquote>\n<h2>3. 第6段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>It has been estimated / that this generation, / due to the pressures of technology, / the wish for personal fulfilment / and desire for diversity, / will work for 17 different employers / over the course of their working life / and have five different careers.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>据估计 / 这一代人，/ 由于技术的压力，/ 对个人成就的渴望 / 和对多样性的追求，/ 将为17个不同的雇主工作 / 在他们的工作生涯中 / 并有五种不同的职业。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>due to后列技术压力、个人满足和多样性追求三种原因，will work和have并列。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>据估计  这一代人， 由于技术的压力， 对个人成就的渴望  和对多样性的追求， 将为17个不同的雇主工作  在他们的工作生涯中  并有五种不同的职业。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>估计这一代会经历多个雇主和多种职业。</p>\n</blockquote>\n<p>先列原因，再呈现一生中雇主与职业变动数量。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>据估计，由于技术压力、对个人成就的渴望和对多样性的追求，这一代人在工作生涯中将为17个不同的雇主工作，从事五种不同的职业。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>17对应雇主数量，5对应职业数量；估计不等于每个人必然如此。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>据估计，由于技术压力、对个人成就的渴望和对多样性的追求，这一代人在工作生涯中将为17个不同的雇主工作，从事五种不同的职业。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>26题</h2>\n<blockquote>\n<p>The author suggests that Generation Z should ______.</p>\n<p>作者建议Ｚ世代应该怎样做？</p>\n</blockquote>\n<h3>题型</h3>\n<p>建议推断题：分清是否选择大学路线与选择哪所大学，依据学位价值变化作判断。</p>\n<p>题干问作者对Generation Z的建议。第1段直接提到what Generation Z need to consider，并把它放在本科申请和权衡选择的场景中，先把这一段从头读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it may be worth considering just how the point, purpose and value of a degree has changed</p>\n<p>what Generation Z need to consider as they start the third stage of their educational journey.</p>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options</p>\n</blockquote>\n<h3>A. be careful in choosing a college</h3>\n<blockquote>\n<p>作者建议Z世代谨慎选择大学。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者让学生重新考虑学位的意义、目的和价值，A却问选择哪所大学，把教育路线本身换成路线内的学校选择。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者建议Z世代谨慎选择大学。</p>\n</blockquote>\n<p><code>choosing a college</code>说的是挑选哪所大学；第1段的<code>purpose and value of a degree</code>说的是学位的目的和价值，两处都涉及升学选择，需要回看本段提出的具体考虑对象。</p>\n<p>原文让学生考虑一个学位的<code>purpose and value of a degree</code>发生了怎样的变化，审视的是取得学位这件事本身。<code>choosing a college</code>则把建议变成在不同大学之间谨慎挑选，把“学位是否以及为何值得取得”换成了“去哪所大学”。本段提到申请表，并没有因此把作者要求重新考虑的对象变成学校。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n<p>新一批学生填写本科申请表、权衡选择时，或许值得想一想学位的意义、目的与价值已怎样变化，以及Z世代在开启教育旅程第三阶段时需要考虑什么。</p>\n<p>这不是说取得学位没有意义，而是强调学位并非适合所有人，从中学课堂进入大学讲堂并非必然，还有其他选择。</p>\n</blockquote>\n<p>填写申请、权衡选项是场景，worth considering后面才给出需要思考的具体对象：学位价值怎样变化。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Generation Z should be careful in choosing a college.</p>\n<p>作者建议Z世代谨慎选择大学。</p>\n</blockquote>\n<p>A需要不同学校之间如何谨慎挑选的建议。提到申请表不能代替这种建议，后文大学并非人人必经之路也支持重新判断路线。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. be diligent at each educational stage</h3>\n<blockquote>\n<p>作者建议Z世代在每个教育阶段勤奋努力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>third stage限定开始本科教育这一时点，B变成每个阶段都要勤奋，既扩大阶段范围，也更换建议的动作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者建议Z世代在每个教育阶段勤奋努力。</p>\n</blockquote>\n<p><code>each educational stage</code>与第1段的<code>third stage of their educational journey</code>都谈教育阶段，所以回看段末怎样把这一阶段与前面的建议相连。</p>\n<p>原文用<code>as they start</code>说明：开始<code>third stage of their educational journey</code>时，学生需要考虑学位价值的变化。它以这一阶段的开始作为作出考虑的时点。</p>\n<p><code>each educational stage</code>却把范围扩展为每个教育阶段，并把“考虑什么”改为“应当勤奋努力”。</p>\n<p>原文的阶段说明没有建立勤奋这一行动要求。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n<p>新一批学生填写本科申请表、权衡选择时，或许值得想一想学位的意义、目的与价值已怎样变化，以及Z世代在开启教育旅程第三阶段时需要考虑什么。</p>\n<p>这不是说取得学位没有意义，而是强调学位并非适合所有人，从中学课堂进入大学讲堂并非必然，还有其他选择。</p>\n</blockquote>\n<p>as they start说明何时考虑学位变化，作者没有从教育阶段推进到学习努力程度。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Generation Z should be diligent at each educational stage.</p>\n<p>作者建议Z世代在每个教育阶段勤奋努力。</p>\n</blockquote>\n<p>B需要diligent的行为要求。原文是重新审视价值，即使勤奋通常可取，也不能将它替换成本文建议。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. reassess the necessity of college education</h3>\n<blockquote>\n<p>作者建议Z世代重新评估大学教育的必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>学位的意义和价值已变，学生应重新判断这条路线是否适合自己。C的reassess the necessity概括这一重新评估。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者建议Z世代重新评估大学教育的必要性。</p>\n</blockquote>\n<p><code>reassess the necessity</code>要求重新评估是否有必要；第1段说<code>the point</code>, <code>purpose and value of a degree has changed</code>，学位价值的变化正是需要再作判断的原因，回看这一建议。</p>\n<p>原文认为学位的意义以及<code>purpose and value of a degree</code>发生了变化，因此正在权衡选择的Ｚ世代应重新思考。<code>reassess the necessity</code>把这种思考落在自己是否需要大学教育上。第1段没有直接用<code>necessity</code>这个词，但对于正在决定本科教育路线的人，重新审视学位的意义、目的和价值，可以包含重新评估这条路线对自己是否必要。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in heir undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n<p>新一批学生填写本科申请表、权衡选择时，或许值得想一想学位的意义、目的与价值已怎样变化，以及Z世代在开启教育旅程第三阶段时需要考虑什么。</p>\n<p>这不是说取得学位没有意义，而是强调学位并非适合所有人，从中学课堂进入大学讲堂并非必然，还有其他选择。</p>\n</blockquote>\n<p>申请表与权衡选择先建立当前情境，后半句从这项选择引出价值判断，而非手续延期。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Generation Z should postpone their undergraduate application.</p>\n<p>作者建议Z世代推迟本科申请。</p>\n</blockquote>\n<p>D需要推迟申请的明确意图。重新考虑可以发生在现有申请过程中，不能自动推成先暂停或延后。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>26题结论</h3>\n<blockquote>\n<p><strong>26. C</strong></p>\n</blockquote>\n<ul>\n<li>A：作者让学生重新考虑学位的意义、目的和价值，A却问选择哪所大学，把教育路线本身换成路线内的学校选择。</li>\n<li>B：third stage限定开始本科教育这一时点，B变成每个阶段都要勤奋，既扩大阶段范围，也更换建议的动作。</li>\n<li>C：学位的意义和价值已变，学生应重新判断这条路线是否适合自己。C的reassess the necessity概括这一重新评估。</li>\n<li>D：作者建议在申请时思考学位价值，没有要求延后申请。postpone增加了原文未给的时间安排。</li>\n</ul>\n<h2>27题</h2>\n<blockquote>\n<p>The percentage of UK graduates in non-graduate roles reflects ______.</p>\n<p>英国大学毕业生从事不要求大学学历工作的比例反映了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>数据作用题：把岗位比例接到前面的学位贬值与社会流动保障减弱。</p>\n<p>题干给出的UK graduates和non-graduate roles直接出现在第2段末句。要判断这个比例反映什么，先读完第2段，看数字前面提出了怎样的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Education was no longer a secure route of social mobility.</p>\n<p>28 per cent of graduates in the UK are in non-graduate roles</p>\n<p>As degrees became universal, they became devalued</p>\n</blockquote>\n<h3>A. Millennials’ opinions about work</h3>\n<blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong>
