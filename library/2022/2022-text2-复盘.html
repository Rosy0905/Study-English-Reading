<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| crop | n.一批 | pen | v.填写 | undergraduate | adj.本科的 |\n| application | n.申请 | weigh up | 权衡 | purpose | n.目的 |\n| value | n.价值 | Generation Z | Z世代 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,139,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>crop</td>\n<td>n.一批</td>\n<td>pen</td>\n<td>v.填写</td>\n<td>undergraduate</td>\n<td>adj.本科的</td>\n</tr>\n<tr>\n<td>application</td>\n<td>n.申请</td>\n<td>weigh up</td>\n<td>权衡</td>\n<td>purpose</td>\n<td>n.目的</td>\n</tr>\n<tr>\n<td>value</td>\n<td>n.价值</td>\n<td>Generation Z</td>\n<td>Z世代</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| Millennials | n.千禧一代 | decent | adj.不错的 | set up for life | 为一生打好基础 |\n| found wanting | 被发现不尽如人意 | universal | adj.普及的 | devalued | adj.贬值的 |\n| social mobility | 社会流动 | non-graduate roles | 不要求大学学历的岗位 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,565,900,411],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Millennials</td>\n<td>n.千禧一代</td>\n<td>decent</td>\n<td>adj.不错的</td>\n<td>set up for life</td>\n<td>为一生打好基础</td>\n</tr>\n<tr>\n<td>found wanting</td>\n<td>被发现不尽如人意</td>\n<td>un s=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</section>"},{"title":"第2段","raw":"### 意群划分 · 第2段\n\nMillennials were told / that if you did well in school, / got a decent degree, / you would be set up for life.\n\nBut that promise / has been found wanting.\n\nAs degrees became universal, / they became devalued.\n\nEducation was no longer / a secure route / of social mobility.\n\nToday, / 28 percent of graduates / in the UK / are in non-graduate roles, / a percentage / which is double the average / among OECD countries.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,411],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Millennials were told / that if you did well in school, / got a decent degree, / you would be set up for life.</p>\n<p>But that promise / has been found wanting.</p>\n<p>As degrees became universal, / they became devalued.</p>\n<p>Education was no longer / a secure route / of social mobility.</p>\n<p>Today, / 28 percent of graduates / in the UK / are in non-graduate roles, / a percentage / which is double the average / among OECD countries.</p>\n</section>"},{"title":"第2段","raw":"### 意群翻译 · 第2段\n\n千禧一代被告知 / 如果你在学校表现良好，/ 获得一个体面的学位，/ 你的人生就会有保障。\n\n但那个承诺 / 已被发现是有缺陷的。\n\n当学位变得普遍时，/ 它们就贬值了。\n\n教育不再是 / 一条可靠的途径 / 社会流动的。\n\n今天，/ 28%的毕业生 / 在英国 / 从事非毕业生工作，/ 这个百分比 / 是平均数的两倍 / 在经合组织国家中。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,411],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Millennials were told / that if you did well in school, / got a decent degree, / you would be set up for life.</p>\n<p>But that promise / has been found wanting.</p>\n<p>As degrees became universal, / they became devalued.</p>\n<p>Education was no longer / a secure route / of social mobility.</p>\n<p>Today, / 28 percent of graduates / in the UK / are in non-graduate roles, / a percentage / which is double the average / among OECD countries.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>千禧一代被告知 / 如果你在学校表现良好，/ 获得一个体面的学位，/ 你的人生就会有保障。</p>\n<p>但那个承诺 / 已被发现是有缺陷的。</p>\n<p>当学位变得普遍时，/ 它们就贬值了。</p>\n<p>教育不再是 / 一条可靠的途径 / 社会流动的。</p>\n<p>今天，/ 28%的毕业生 / 在英国 / 从事非毕业生工作，/ 这个百分比 / 是平均数的两倍 / 在经合组织国家中。</p>\n</section>"},{"title":"第2段","raw":"### 标准译文 · 第2段\n\n千禧一代曾被告知：只要在学校表现良好，获得体面的学位，人生就会有保障。但这个承诺已被证明是空洞的。随着学位变得普遍，它们也随之贬值。教育不再是社会流动的可靠途径。如今，英国28%的毕业生从事着非毕业生工作，这一比例是经合组织国家平均水平的两倍。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,411],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true},"focusId":"focus-paragraph-2-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Millennials were told / that if you did well in school, / got a decent degree, / you would be set up for life.</p>\n<p>But that promise / has been found wanting.</p>\n<p>As degrees became universal, / they became devalued.</p>\n<p>Education was no longer / a secure route / of social mobility.</p>\n<p>Today, / 28 percent of graduates / in the UK / are in non-graduate roles, / a percentage / which is double the average / among OECD countries.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>千禧一代被告知 / 如果你在学校表现良好，/ 获得一个体面的学位，/ 你的人生就会有保障。</p>\n<p>但那个承诺 / 已被发现是有缺陷的。</p>\n<p>当学位变得普遍时，/ 它们就贬值了。</p>\n<p>教育不再是 / 一条可靠的途径 / 社会流动的。</p>\n<p>今天，/ 28%的毕业生 / 在英国 / 从事非毕业生工作，/ 这个百分比 / 是平均数的两倍 / 在经合组织国家中。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-3\"><h3>标准译文 · 第2段</h3>\n<p>千禧一代曾被告知：只要在学校表现良好，获得体面的学位，人生就会有保障。但这个承诺已被证明是空洞的。随着学位变得普遍，它们也随之贬值。教育不再是社会流动的可靠途径。如今，英国28%的毕业生从事着非毕业生工作，这一比例是经合组织国家平均水平的两倍。</p>\n</section>"},{"title":"第3段","raw":"### 完整原文 · 第3段\n\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1188,900,220],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</section>"},{"title":"第3段","raw":"### 意群划分 · 第3段\n\nThis is not to say / that there is no point / in getting a degree, / but rather stress / that a degree is not for everyone, / that the switch / from classroom to lecture hall / is not an inevitable one / and that other options / are available.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1188,900,220],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall 为17个不同的雇主工作，从事五种不同的职业。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段 ng just how the point, purpose and value of a degree has changed\n>\n> what Generation Z need to consider as they start the third stage of their educational journey.\n>\n> As the latest crop of students pen their undergraduate application form and weigh up their options","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,380,1344,333],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"26","questionIntro":true},"html":"<blockquote>\n<p>The author suggests that Generation Z should ______.</p>\n<p>作者建议Ｚ世代应该怎样做？</p>\n</blockquote>\n<h3>题型</h3>\n<p>建议推断题：分清是否选择大学路线与选择哪所大学，依据学位价值变化作判断。</p>\n<p>题干问作者对Generation Z的建议。第1段直接提到what Generation Z need to consider，并把它放在本科申请和权衡选择的场景中，先把这一段从头读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it may be worth considering just how the point, purpose and value of a degree has changed</p>\n<p>what Generation Z need to consider as they start the third stage of their educational journey.</p>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options</p>\n</blockquote>\n"},{"title":"A. be careful in choosing a college","raw":"### A. be careful in choosing a college\n\n> 作者建议Z世代谨慎选择大学。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n作者让学生重新考虑学位的意义、目的和价值，A却问选择哪所大学，把教育路线本身换成路线内的学校选择。\n\n**出处：**\n\n> As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\n> This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,380,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>作者建议Z世代谨慎选择大学。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者让学生重新考虑学位的意义、目的和价值，A却问选择哪所大学，把教育路线本身换成路线内的学校选择。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</blockquote>\n</section>"},{"title":"A. be careful in choosing a college","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者建议Z世代谨慎选择大学。\n\n`choosing a college`说的是挑选哪所大学；第1段的`purpose and value of a degree`说的是学位的目的和价值，两处都涉及升学选择，需要回看本段提出的具体考虑对象。\n\n原文让学生考虑一个学位的`purpose and value of a degree`发生了怎样的变化，审视的是取得学位这件事本身。`choosing a college`则把建议变成在不同大学之间谨慎挑选，把“学位是否以及为何值得取得”换成了“去哪所大学”。本段提到申请表，并没有因此把作者要求重新考虑的对象变成学校。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,380,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>作者建议Z世代谨慎选择大学。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\ 议Z世代推迟本科申请。\n\nD需要推迟申请的明确意图。重新考虑可以发生在现有申请过程中，不能自动推成先暂停或延后。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,380,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>作者建议Z世代推迟本科申请。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>作者建议在申请时思考学位价值，没有要求延后申请。postpone增加了原文未给的时间安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者建议Z世代推迟本科申请。</p>\n</blockquote>\n<p><code>postpone their undergraduate application</code>与第1段的<code>undergraduate application form</code>涉及同一申请过程，需要看作者是否把申请的时间变化作为建议。</p>\n<p>原文先描写学生面对<code>undergraduate application form</code>、权衡选择的情境，接着用<code>it may be worth considering</code>提出思考学位价值的建议。<code>postpone their undergraduate application</code>把建议改成推迟申请，给申请另加了时间上的延后。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\nThis is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.</p>\n<p>新一批学生填写本科申请表、权衡选择时，或许值得想一想学位的意义、目的与价值已怎样变化，以及Z世代在开启教育旅程第三阶段时需要考虑什么。</p>\n<p>这不是说取得学位没有意义，而是强调学位并非适合所有人，从中学课堂进入大学讲堂并非必然，还有其他选择。</p>\n</blockquote>\n<p>申请表与权衡选择先建立当前情境，后半句从这项选择引出价值判断，而非手续延期。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Generation Z should postpone their undergraduate application.</p>\n<p>作者建议Z世代推迟本科申请。</p>\n</blockquote>\n<p>D需要推迟申请的明确意图。重新考虑可以发生在现有申请过程中，不能自动推成先暂停或延后。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. C**\n\n- A：作者让学生重新考虑学位的意义、目的和价值，A却问选择哪所大学，把教育路线本身换成路线内的学校选择。\n- B：third stage限定开始本科教育这一时点，B变成每个阶段都要勤奋，既扩大阶段范围，也更换建议的动作。\n- C：学位的意义和价值已变，学生应重新判断这条路线是否适合自己。C的reassess the necessity概括这一重新评估。\n- D：作者建议在申请时思考学位价值，没有要求延后申请。postpone增加了原文未给的时间安排。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,380,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"26","questionConclusion":true},"html":"<blockquote>\n<p><strong>26. C</strong></p>\n</blockquote>\n<ul>\n<li>A：作者让学生重新考虑学位的意义、目的和价值，A却问选择哪所大学，把教育路线本身换成路线内的学校选择。</li>\n<li>B：third stage限定开始本科教育这一时点，B变成每个阶段都要勤奋，既扩大阶段范围，也更换建议的动作。</li>\n<li>C：学位的意义和价值已变，学生应重新判断这条路线是否适合自己。C的reassess the necessity概括这一重新评估。</li>\n<li>D：作者建议在申请时思考学位价值，没有要求延后申请。postpone增加了原文未给的时间安排。</li>\n</ul>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> The percentage of UK graduates in non-graduate roles reflects ______.\n>\n> 英国大学毕业生从事不要求大学学历工作的比例反映了什么？\n\n### 题型\n\n数据作用题：把岗位比例接到前面的学位贬值与社会流动保障减弱。\n\n题干给出的UK graduates和non-graduate roles直接出现在第2段末句。要判断这个比例反映什么，先读完第2段，看数字前面提出了怎样的判断。\n\n### 核心出处\n\n> Education was no longer a secure route of social mobility.\n>\n> 28 per cent of graduates in the UK are in non-graduate roles\n>\n> As degrees became universal, they became devalued","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"27","questionIntro":true},"html":"<blockquote>\n<p>The percentage of UK graduates in non-graduate roles reflects ______.</p>\n<p>英国大学毕业生从事不要求大学学历工作的比例反映了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>数据作用题：把岗位比例接到前面的学位贬值与社会流动保障减弱。</p>\n<p>题干给出的UK graduates和non-graduate roles直接出现在第2段末句。要判断这个比例反映什么，先读完第2段，看数字前面提出了怎样的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Education was no longer a secure route of social mobility.</p>\n<p>28 per cent of graduates in the UK are in non-graduate roles</p>\n<p>As degrees became universal, they became devalued</p>\n</blockquote>\n"},{"title":"A. Millennials’ opinions about work","raw":"### A. Millennials’ opinions about work\n\n> 英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n28%统计毕业生实际从事何种岗位，未调查他们对工作的看法。A把就业结果换成主观观念。\n\n**出处：**\n\n> Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>28%统计毕业生实际从事何种岗位，未调查他们对工作的看法。A把就业结果换成主观观念。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</blockquote>\n</section>"},{"title":"A. Millennials’ opinions about work","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。\n\n`opinions about work`说的是人对工作的主观看法，而第2段用`are in non-graduate roles`统计实际就业岗位；回看统计句及它前面的教育作用判断。\n\n原文先指出教育不再是社会流动的可靠途径，再用毕业生`are in non-graduate roles`这一实际就业状况来说明。`opinions about work`则把岗位统计当成千禧一代工作观念的表现。处于某类岗位是就业结果，并不等于他们怎么看工作或主动偏好这类岗位，原文也没有把这一比例与他们的想法相连。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>28%统计毕业生实际从事何种岗位，未调查他们对工作的看法。A把就业结果换成主观观念。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。</p>\n</blockquote>\n<p><code>opinions about work</code>说的是人对工作的主观看法，而第2段用<code>are in non-graduate roles</code>统计实际就业岗位；回看统计句及它前面的教育作用判断。</p>\n<p>原文先指出教育不再是社会流动的可靠途径，再用毕业生<code>are in non-graduate roles</code>这一实际就业状况来说明。<code>opinions about work</code>则把岗位统计当成千禧一代工作观念的表现。处于某类岗位是就业结果，并不等于他们怎么看工作或主动偏好这类岗位，原文也没有把这一比例与他们的想法相连。</p>\n</section>"},{"title":"A. Millennials’ opinions about work","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.\n>\n> 千禧一代曾被告知：在学校表现好、取得不错的学位，就能为一生打好保障。但这一承诺已显不足。学位普及，也随之贬值；教育不再是可靠的社会流动途径。如今英国28%的大学毕业生从事不要求大学学历的工作，是OECD国家平均比例的两倍。\n\n学位普及后贬值、教育不再稳保社会流动是前面的判断，岗位比例作为事实支持。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The percentage reflects Millennials’ opinions about work.\n>\n> 英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。\n\nA需要就业态度或个人偏好的资料。进入不要求学位的岗位不必出于主动偏爱，也不能据此概括整个千禧一代怎么看工作。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映千禧一代对工作的看法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型： te of social mobility","raw":"### D. the desired route of social mobility\n\n> 英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\nsecure评价社会流动途径是否可靠，desired评价人们想不想选它。原文数字用来说明可靠性减弱，并非展示愿望。\n\n**出处：**\n\n> Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>secure评价社会流动途径是否可靠，desired评价人们想不想选它。原文数字用来说明可靠性减弱，并非展示愿望。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</blockquote>\n</section>"},{"title":"D. the desired route of social mobility","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。\n\n`desired route of social mobility`与第2段的`secure route of social mobility`谈到同一类途径，但修饰语分别是“期望的”和“可靠的”，需要回看原句究竟评价什么。\n\n原文的`secure route of social old that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.\n>\n> 千禧一代曾被告知：在学校表现好、取得不错的学位，就能为一生打好保障。但这一承诺已显不足。学位普及，也随之贬值；教育不再是可靠的社会流动途径。如今英国28%的大学毕业生从事不要求大学学历的工作，是OECD国家平均比例的两倍。\n\nno longer否定过去的保障，28%的非学历岗位比例随后解释为什么不能再把学位视作稳定上升通道。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The percentage reflects the desired route of social mobility.\n>\n> 英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。\n\nD需要人们期望的路线调查。一个人最终就业在哪类岗位，不等于那就是他所希望的社会流动方式。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>secure评价社会流动途径是否可靠，desired评价人们想不想选它。原文数字用来说明可靠性减弱，并非展示愿望。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。</p>\n</blockquote>\n<p><code>desired route of social mobility</code>与第2段的<code>secure route of social mobility</code>谈到同一类途径，但修饰语分别是“期望的”和“可靠的”，需要回看原句究竟评价什么。</p>\n<p>原文的<code>secure route of social mobility</code>评价教育能否可靠地带来社会流动，并以<code>no longer</code>明确指出这种保障减弱。<code>desired route of social mobility</code>说的却是人们希望选择哪一条途径。</p>\n<p>毕业生的岗位比例说明学历与就业结果之间的落差，没有把这种实际结果写成人们想要的路线。</p>\n<p>这里的差别不是人们还能不能希望读大学，而是该比例在文中说明的是作用减弱，而非愿望。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Millennials were told that if you did well in school, got a decent degree, you would be set up for life. But that promise has been found wanting. As degrees became universal, they became devalued. Education was no longer a secure route of social mobility. Today, 28 percent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n<p>千禧一代曾被告知：在学校表现好、取得不错的学位，就能为一生打好保障。但这一承诺已显不足。学位普及，也随之贬值；教育不再是可靠的社会流动途径。如今英国28%的大学毕业生从事不要求大学学历的工作，是OECD国家平均比例的两倍。</p>\n</blockquote>\n<p>no longer否定过去的保障，28%的非学历岗位比例随后解释为什么不能再把学位视作稳定上升通道。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The percentage reflects the desired route of social mobility.</p>\n<p>英国毕业生从事不要求大学学历岗位的比例反映人们期望的社会流动途径。</p>\n</blockquote>\n<p>D需要人们期望的路线调查。一个人最终就业在哪类岗位，不等于那就是他所希望的社会流动方式。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. B**\n\n- A：28%统计毕业生实际从事何种岗位，未调查他们对工作的看法。A把就业结果换成主观观念。\n- B：became devalued直接说学位贬值，毕业生进入不要求学位的岗位显示学历未可靠换来预期机会，B归纳价值缩水。\n- C：岗位统计说明教育回报出现落差，未测量公众满意与否。C将实际作用减弱换成公众情绪。\n- D：secure评价社会流动途径是否可靠，desired评价人们想不想选它。原文数字用来说明可靠性减弱，并非展示愿望。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,713,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"27","questionConclusion":true},"html":"<blockquote>\n<p><strong>27. B</strong></p>\n</blockquote>\n<ul>\n<li>A：28%统计毕业生实际从事何种岗位，未调查他们对工作的看法。A把就业结果换成主观观念。</li>\n<li>B：became devalued直接说学位贬值，毕业生进入不要求学位的岗位显示学历未可靠换来预期机会，B归纳价值缩水。</li>\n<li>C：岗位统计说明教育回报出现落差，未测量公众满意与否。C将实际作用减弱换成公众情绪。</li>\n<li>D：secure评价社会流动途径是否可靠，desired评价人们想不想选它。原文数字用来说明可靠性减弱，并非展示愿望。</li>\n</ul>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> The author considers it a good sign that ______.\n>\n> 作者认为哪一种情况是一个好迹象？\n\n### 题型\n\n评价细节题：找Thankfully所肯定的变化，并分清年轻人、父母教师和雇主的态度。\n\n题干的a good sign让人想到第4段开头的Thankfully和there are signs。先读第4段；其中this is already happening需要接上前文，因此也完整读第3段，确认作者在称许什么变化。\n\n### 核心出处\n\n> a degree is not for everyone\n>\n> other options are available.\n>\n> with Generation Z seeking to learn from their millennial predecessors","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,1046,1344,333],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"28","questionIntro":true},"html":"<blockquote>\n<p>The author considers it a good sign that ______.</p>\n<p>作者认为哪一种情况是一个好迹象？</p>\n</blockquote>\n<h3>题型</h3>\n<p>评价细节题：找Thankfully所肯定的变化，并分清年轻人、父母教师和雇主的态度。</p>\n<p>题干的a good sign让人想到第4段开头的Thankfully和there are signs。先读第4段；其中this is already happening需要接上前文，因此也完整读第3段，确认作者在称许什么变化。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>a degree is not for everyone</p>\n<p>other options are available.</p>\n<p>with Generation Z seeking to learn from their millennial predecessors</p>\n</blockquote>\n"},{"title":"A. Generation Z are seeking to earn a decent degree","raw":"### A. Generation Z are seeking to earn a decent degree\n\n> 作者认为一个好迹象是Z世代正谋求好学位。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nseeking to learn from是借鉴前辈经验，A却改成seeking to earn a degree，抹去重新选择教育路线的变化。\n\n**出处：**\n\n> This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.\n> Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,1046,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>作者认为一个好迹象是Z世代正谋求好学位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>seeking to learn from是借鉴前辈经验，A却改成seeking to earn a degree，抹去重新选择教育路线的变化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.\nThankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n</blockquote>\n</section>"},{"title":"A. Generation Z are seeking to earn a decent degree","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为一个好迹象是Z世代正谋求好学位。\n\nseeking to learn from是借鉴前辈经验，A却改成seeking to earn a degree，抹去重新选择教育路线的变化。\n\n第三段提出大学并非人人适合，Thankfully称许这种认识正在出现，并把Z quirement for certain roles.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为一个好迹象是父母正改变教育看法。</p>\n</blockquote>\n<p><code>parents are changing their minds</code>的主体是父母，第4段恰好写<code>parents and teachers tend to be still set in the degree mindset</code>，回看这一让步部分怎样描述父母的态度。</p>\n<p>原文用<code>still set in the degree mindset</code>表示父母和教师往往仍固守学位观念，并以<code>even if</code>把这一情况放在Ｚ世代开始变化的对照面。<code>parents are changing their minds</code>却把父母描述成正在改变看法的人。原文不是借父母的变化来说明好迹象，而是说即使父母往往还没有改变，变化也已经出现。</p>\n</section>"},{"title":"D. parents are changing their minds about education","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.\n> Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.\n>\n> 这不是说取得学位没有意义，而是强调学位并非适合所有人，从中学课堂进入大学讲堂并非必然，还有其他选择。\n>\n> 可喜的是，这种变化已有迹象：Z世代努力借鉴千禧一代前辈的经验，即使父母教师往往仍固守学位观念。雇主早已看出聘用中学毕业生的优势，他们常比大学毕业生表现得更投入、更忠诚。许多雇主也看到了取消某些岗位学位要求的益处。\n\nZ世代借鉴前辈是主句的积极迹象，父母教师未改变属于让步条件，之后补雇主的务实做法。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Parents are changing their minds about education.\n>\n> 作者认为一个好迹象是父母正改变教育看法。\n\nD需要父母改变的证据。即使年轻人已转向，也不能把新态度移给仍被明确写为固守旧观念的群体。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,1046,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>作者认为一个好迹象是父母正改变教育看法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>still set in the degree mindset说父母和教师仍固守学位观，even if将他们放在变化的对照面，D却说他们正在改变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.\nThankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为一个好迹象是父母正改变教育看法。</p>\n</blockquote>\n<p><code>parents are changing their minds</code>的主体是父母，第4段恰好写<code>parents and teachers tend to be still set in the degree mindset</code>，回看这一让步部分怎样描述父母的态度。</p>\n<p>原文用<code>still set in the degree mindset</code>表示父母和教师往往仍固守学位观念，并以<code>even if</code>把这一情况放在Ｚ世代开始变化的对照面。<code>parents are changing their minds</code>却把父母描述成正在改变看法的人。原文不是借父母的变化来说明好迹象，而是说即使父母往往还没有改变，变化也已经出现。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.\nThankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n<p>这不是说取得学位没有意义，而是强调学位并非适合所有人，从中学课堂进入大学讲堂并非必然，还有其他选择。</p>\n<p>可喜的是，这种变化已有迹象：Z世代努力借鉴千禧一代前辈的经验，即使父母教师往往仍固守学位观念。雇主早已看出聘用中学毕业生的优势，他们常比大学毕业生表现得更投入、更忠诚。许多雇主也看到了取消某些岗位学位要求的益处。</p>\n</blockquote>\n<p>Z世代借鉴前辈是主句的积极迹象，父母教师未改变属于让步条件，之后补雇主的务实做法。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Parents are changing their minds about education.</p>\n<p>作者认为一个好迹象是父母正改变教育看法。</p>\n</blockquote>\n<p>D需要父母改变的证据。即使年轻人已转向，也不能把新态度移给仍被明确写为固守旧观念的群体。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. C**\n\n- A：seeking to learn from是借鉴前辈经验，A却改成seeking to earn a degree，抹去重新选择教育路线的变化。\n- B：雇主认可中学毕业生的忠诚投入，是雇主评价；B却说求职者愿意成为熟练工人，换了主体态度和职业类别。\n- C：雇主看到中学毕业生的实际表现，也愿取消某些岗位的学位要求，是按岗位与能力而非唯学历判断，C概括这种务实态度。\n- D：still set in the degree mindset说父母和教师仍固守学位观，even if将他们放在变化的对照面，D却说他们正在改变。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,1046,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"28","questionConclusion":true},"html":"<blockquote>\n<p><strong>28. C</strong></p>\n</blockquote>\n<ul>\n<li>A：seeking to learn from是借鉴前辈经验，A却改成seeking to earn a degree，抹去重新选择教育路线的变化。</li>\n<li>B：雇主认可中学毕业生的忠诚投入，是雇主评价；B却说求职者愿意成为熟练工人，换了主体态度和职业类别。</li>\n<li>C：雇主看到中学毕业生的实际表现，也愿取消某些岗位的学位要求，是按岗位与能力而非唯学历判断，C概括这种务实态度。</li>\n<li>D：still set in the degree mindset说父母和教师仍固守学位观，even if将他们放在变化的对照面，D却说他们正在改变。</li>\n</ul>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> It is advised in Paragraph 5 that those with one degree should ______.\n>\n> 第5段建议已经拥有一个学位的人怎样做？\n\n### 题型\n\n段落建议题：把专门知识、研究生收入和第二学位连成继续深造的理由。\n\n题干直接给出Paragraph 5和those with one degree，完整读第5段，重点理解作者怎样从第一个学位谈到此后的选择。\n\n### 核心出处\n\n> consider that this may well be the first of many.\n>\n> it makes sense to have two.\n>\n> it pays to have specific knowledge or skills.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1379,1344,333],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"29","questionIntro":true},"html":"<blockquote>\n<p>It is advised in Paragraph 5 that those with one degree should ______.</p>\n<p>第5段建议已经拥有一个学位的人怎样做？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落建议题：把专门知识、研究生收入和第二学位连成继续深造的理由。</p>\n<p>题干直接给出Paragraph 5和those with one degree，完整读第5段，重点理解作者怎样从第一个学位谈到此后的选择。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>consider that this may well be the first of many.</p>\n<p>it makes sense to have two.</p>\n<p>it pays to have specific knowledge or skills.</p>\n</blockquote>\n"},{"title":"A. make an early decision on their career","raw":"### A. make an early decision on their career\n\n> 第5段建议已有一个学位的人及早决定职业。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nfirst of many说第一个学位之后可能还有学位，A却用early说要尽早决定职业，改了first所建立的关系。\n\n**出处：**\n\n> For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1379,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>第5段建议已有一个学位的人及早决定职业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>first of many说第一个学位之后可能还有学位，A却用early说要尽早决定职业，改了first所建立的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n</blockquote>\n</section>"},{"title":"A. make an early decision on their career","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第5段建议已有一个学位的人及早决定职业。\n\n`an early decision on their career`谈职业选择的时间；第5段的`the first of many`谈第一个学位与以后学位的关系，回看作者给出的后续建议。\n\n原文提醒选择学位路线的人，第一个学位可能是`the first of many`，最后还建议有两个学位。这一顺序是在说接受学位教育可能不止一次。\n\n`an early decision on their career`则把`first`理解成应及早决定职业的时间要求，并把建议对象从继续取得学位换成职业选择。\n\n段落没有把第一个学位与必须早作职业决定连起来。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1379,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>第5段建议已有一个学位的人及早决定职业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>first of many说第一个学位之后可能还有学位，A却用early说要尽早决定职业，改了first所建立的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n</blockquote>\n</section><section class=\"revealPar text":{"mode":"image","asset":"questions","label":"29题","focus":[150,1379,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>第5段建议已有一个学位的人参加在职培训项目。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>专门知识技能有回报，但本段明确用研究生与第二个学位说明继续学习；B指定在职培训这一未给出的方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第5段建议已有一个学位的人参加在职培训项目。</p>\n</blockquote>\n<p><code>on-the-job training programs</code>可能让人联系到本段的<code>specific knowledge or skills</code>，因为培训也涉及知识技能；需要连同段末<code>have two</code>一起看，确认作者在这里建议用什么方式继续学习。</p>\n<p>原文先说<code>specific knowledge or skills</code>有价值，再以研究生收入高于大学毕业生为说明，最终落在<code>have two</code>，即拥有两个学位。<code>on-the-job training programs</code>则把这一建议具体化为在职培训项目。培训可能提供知识技能，但“知识技能有价值”不能把原文明确指向的后续学位教育改成指定的在职培训方式；本段既没有给出在职这一条件，也没有将培训项目与这里的第二个学位相连。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n<p>对仍希望走学位路线的人，应想到这个学位很可能只 graduates","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第5段建议已有一个学位的人与高收入研究生合作。\n\n`high-paid postgraduates`对应本段`Postgraduates now earn 40 per cent more`这一收入比较，需要看研究生在此是合作对象，还是继续取得学位有回报的例证。\n\n原文以`Postgraduates now earn 40 per cent more`说明研究生教育的收入回报，再据此建议有一个学位的人考虑拥有两个。`high-paid postgraduates`抓住了研究生收入较高这个事实，但`team up with`把这些人改成读者应该合作的对象。原句是在比较不同学历者的收入，并未从研究生收入高推出应与他们合作。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1379,1344,333],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-C-0\"><blockquote>\n<p>第5段建议已有一个学位的人与高收入研究生合作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>研究生收入较高是深造有回报的例证，team up with却把研究生变成应合作的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of generalists, it pays to have specific knowledge or skills. Postgraduates now earn 40 percent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第5段建议已有一个学位的人与高收入研究生合作。</p>\n</blockquote>\n<p><code>high-paid postgraduates</code>对应本段<code>Postgraduates now earn 40 per cent more</code>这一收入比较，需要看研究生在此是合作对象，还是继续取得学位有回报的例证。</p>\n<p>原文以<code>Postgraduates now earn 40 per cent more</code>说明研究生教育的收入回报，再据此建议有一个学位的人考虑拥有两个。<code>high-paid postgraduates</code>抓住了研究生收入较高这个事实，但<code>team up with</code>把这些人改成读者应该合作的对象。原句是在比较不同学历者的收入，并未从研究生收入高推出应与他们合作。</p>\n</section>"},{"title":"C. team up with high-paid postgraduates","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> For those for fic knowledge or skills提供专门领域方向，研究生收入和have two提供继续深造方向，D将两者完整连接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1379,1344,333],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"29","questionConclusion":true},"html":"<blockquote>\n<p><strong>29. D</strong></p>\n</blockquote>\n<ul>\n<li>A：first of many说第一个学位之后可能还有学位，A却用early说要尽早决定职业，改了first所建立的关系。</li>\n<li>B：专门知识技能有回报，但本段明确用研究生与第二个学位说明继续学习；B指定在职培训这一未给出的方式。</li>\n<li>C：研究生收入较高是深造有回报的例证，team up with却把研究生变成应合作的对象。</li>\n<li>D：specific knowledge or skills提供专门领域方向，研究生收入和have two提供继续深造方向，D将两者完整连接。</li>\n</ul>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n> What can be concluded about Generation Z from the last two paragraphs?\n>\n> 根据最后两段，可以对Ｚ世代得出什么结论？\n\n### 题型\n\n跨段概括题：将职业全程学习与单个学位不再定义身份结合，避免扩大为学位完全无用。\n\n题干明确限定the last two paragraphs，即第6、7段。两段分别谈整个职业生涯中的教育，以及学位与个人身份的关系，需要把两段完整读完再作推断。\n\n### 核心出处\n\n> they will need to be constantly up-skilling throughout their career\n>\n> Education, and not just knowledge gained on campus, will be a core part of Generation Z's career trajectory\n>\n> their degree won’t define them in the same way.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1712,1344,365],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"30","questionIntro":true},"html":"<blockquote>\n<p>What can be concluded about Generation Z from the last two paragraphs?</p>\n<p>根据最后两段，可以对Ｚ世代得出什么结论？</p>\n</blockquote>\n<h3>题型</h3>\n<p>跨段概括题：将职业全程学习与单个学位不再定义身份结合，避免扩大为学位完全无用。</p>\n<p>题干明确限定the last two paragraphs，即第6、7段。两段分别谈整个职业生涯中的教育，以及学位与个人身份的关系，需要把两段完整读完再作推断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>they will need to be constantly up-skilling throughout their career</p>\n<p>Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory</p>\n<p>their degree won’t define them in the same way.</p>\n</blockquote>\n"},{"title":"A. Lifelong learning will define them.","raw":"### A. Lifelong learning will define them.\n\n> 最后两段表明，终身学习将成为Z世代的重要特点。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n整个职业生涯不断提升技能，且教育不限校园，说明持续学习比某个早期学位更能代表Z世代，A概括这一长期特点。\n\n**出处：**\n\n> It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z's career trajectory.\n> Older generations often talk about their degree in the present and personal tense: \"I am a geographer\" or \"I am a classist.\" Their sons or daughters would never say such a thing; it's as if they already know that their degree won't define them in the same way.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1712,1344,365],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-30-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>最后两段表明，终身学习将成为Z世代的重要特点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>整个职业生涯不断提升技能，且教育不限校园，说明持续学习比某个早期学位更能代表Z世代，A概括这一长期特点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.\nOlder generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n</blockquote>\n</section>"},{"title":"A. Lifelong learning will define them.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 最后两段表明，终身学习将成为Z世代的重要特点。\n\n`Lifelong learning`与第6段`constantly up-skilling throughout their career`相连，因为后者把提升技能延伸到整个职业生涯；`define them`又与第7段`degree won’t define them`形成呼应，需要把持续学习与单个学位分开看。\n\n第6段说Ｚ世代需要`constantly up-skilling throughout their career`，并把教育扩展到校园之外。第7段又说明他们的学位不会像上一代那样界定他们。`Lifelong learning`把不断学习概括为一项长期特点，`define them`可理解为这一特点将比单个学位更能说明他们。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1712,1344,365],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-30-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>最后两段表明，终身学习将成为Z世代的重要特点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>整个职业生涯不断提升技能，且教育不限校园，说明持续学习比某个早期学位更能代表Z世代，A概括这一长期特点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.\nOlder generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段表明，终身学习将成为Z世代的重要特点。</p>\n</blockquote>\n<p><code>Lifelong learning</code>与第6段<code>constantly up-skilling throughout their career</code>相连，因为后者把提升技能延伸到整个职业生涯；<code>define them</code>又与第7段<code>degree won’t define them</code>形成呼应，需要把持续学习与单个学位分开看。</p>\n<p>第6段说Ｚ世代需要<code>constantly up-skilling throughout their career</code>，并把教育扩展到校园之外。第7段又说明他们的学位不会像上一代那样界定他们。<code>Lifelong learning</code>把不断学习概括为一项长期特点，<code>define them</code>可理解为这一特点将比单个学位更能说明他们。</p>\n</section>"},{"title":"A. Lifelong learning will define them.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z's career trajectory.\n> Older generations often talk about their degree in the present and personal tense: \"I am a geographer\" or \"I am a classist.\" Their sons or daughters would never say such a thing; it's as if they already know that their degree won't define them in the same way.\n>\n> Z世代不大可能在18岁或21岁便完成全部教育；他们需在整个职业生涯不断提升技能，以保持就业能力。据估计，由于技术压力、自我实现和多样性追求，这一代一生会为17个不同雇主工作并经历5种职业。教育，包括校园之外的学习，将成为他们职业轨迹的核心部分。\n>\n> 上一代常以现在时和个人身份谈自己的学位，例如我是地理学者或古典学者。他们的子女不会如此说，仿佛早已知道学位不会以同样方式定义自己。\n\n技术、个人追求和多样经历带来多次职业转换，需要不断学习；末段再比较两代人用学位定义自己的不同方式。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Lifelong learning will define them.\n>\n> 最后两段表明，终身学习将成为Z世代的重要特点。\n\nA不是说只有学习一个特征，也不是要求终身只待学校。lifelong learning概括在职业变化中持续更新知识技能的广义教育。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1712,1344,365],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>最后两段表明，终身学习将成为Z世代的重要特点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>整个职业生涯不断提升技能，且教育不限校园，说明持续学习比某个早期学位更能代表Z世代，A概括这一长期特点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay employable. It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z&#39;s career trajectory.\nOlder generations often talk about their degree in the present and personal tense: &quot;I am a geographer&quot; or &quot;I am a classist.&quot; Their sons or daughters would never say such a thing; it&#39;s as if they already know that their degree won&#39;t define them in the same way.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option
