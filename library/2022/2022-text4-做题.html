<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**The personal grievance provisions of the ERA are intended to ______.**\n\n> ERA中的个人申诉条款旨在做什么？\n\n题型：**目的细节题**。","articleRects":[],"questionRects":[[226,608,1085,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>The personal grievance provisions of the ERA are intended to ______.</strong></p>\n<blockquote><p>ERA中的个人申诉条款旨在做什么？</p>\n</blockquote>\n<p>题型：<strong>目的细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**It can be learned from Paragraph 3 that the provisions may ______.**\n\n> 从第3段可以得知，这些条款可能会怎样？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,921,934,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>It can be learned from Paragraph 3 that the provisions may ______.</strong></p>\n<blockquote><p>从第3段可以得知，这些条款可能会怎样？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**Which of the following measures would the Productivity Commission support?**\n\n> 生产力委员会会支持下列哪项措施？\n\n题型：**推断态度题**。","articleRects":[],"questionRects":[[226,1235,1196,38],[303,1290,125,35]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>Which of the following measures would the Productivity Commission support?</strong></p>\n<blockquote><p>生产力委员会会支持下列哪项措施？</p>\n</blockquote>\n<p>题型：<strong>推断态度题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**What might be an effect of ERA’s unjustified dismissal procedures?**\n\n> ERA中无正当理由解雇的相关程序可能会产生什么影响？\n\n题型：**因果细节题**。","articleRects":[],"questionRects":[[226,1600,1066,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>What might be an effect of ERA’s unjustified dismissal procedures?</strong></p>\n<blockquote><p>ERA中无正当理由解雇的相关程序可能会产生什么影响？</p>\n</blockquote>\n<p>题型：<strong>因果细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**It can be inferred that the “high-income threshold” in Australia ______.**\n\n> 可以推断，澳大利亚的“高收入门槛”会怎样？\n\n题型：**制度效果推断题**。","articleRects":[],"questionRects":[[225,1912,1006,40]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>It can be inferred that the “high-income threshold” in Australia ______.</strong></p>\n<blockquote><p>可以推断，澳大利亚的“高收入门槛”会怎样？</p>\n</blockquote>\n<p>题型：<strong>制度效果推断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Instead, But, Consequently |\n| 态度词／评价词 | 先抓个大概好坏 | fair, justified, cautious |\n| 动作词 | 先看谁做了什么 | protect, constrain, excluding |\n| 结果词 | 看最后出了什么事 | risk, harm, growth |\n| 重复主题词 | 大概知道老在说什么 | managers, workers, dismissal |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>Instead, But, Consequently</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>fair, justified, cautious</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>protect, constrain, excluding</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>risk, harm, growth</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>managers, workers, dismissal</td></tr></tbody></table>\n"},{"section":"读文章","raw":"The personal grievance provisions of New Zealand’s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a **[xxx]** fair way.","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The personal grievance provisions of New Zealand’s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a <strong>[xxx]</strong> fair way.</p>\n</div></div>"},{"section":"读文章","raw":"The personal grievance provisions of New Zealand’s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, / dismissals must be justified. / Employers must both show cause and act in a **[xxx]** fair way.","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The personal grievance provisions of New Zealand’s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, / dismissals must be justified. / Employers must both show cause and act in a <strong>[xxx]</strong> fa 章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到阻止雇主、解雇员工、解雇须有正当理由、说明理由；中间又出现保护工作岗位、普通工人的、普通工人的、合同普通法；给企业制造困难、高薪经理和高管、差异、企业的成功或失败；所引入的法律、那些工作岗位、所引入的法律、那些工作岗位；就业保护法、解雇表现不佳的经理、水平低下、管理能力；高薪经理本身、更谨慎地招聘新员工、更谨慎地招聘新员工、少付员工工资；不利于生产率增长、整体福祉、不利于生产率增长、整体福祉；结尾还有在塔斯曼海的另一边、通过排除员工、一项2016年议员法案、该法案被投票否决。</p>\n<p>到这里还不能自然地说清楚：保护员工的规定怎样影响企业、管理者和普通员工，后面的国家做法与前面的影响怎样联系。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"36题","raw":"## 36题\n\n> The personal grievance provisions of the ERA are intended to ______.  \n> ERA中的个人申诉条款旨在做什么？\n\n题干直接点出personal grievance provisions of the ERA。第1段以这组条款开篇，第2段的Personal grievance procedures接着交代设计目的，因此把这两段完整读完。\n\n> 原文参考：\n> \n> The personal grievance provisions of New Zealand’s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a **[xxx]** fair way.\n> \n> 开始精读：\n> \n> The personal grievance provisions / of New Zealand’s Employment Relations Act 2000 (ERA) / prevent an employer from firing an employee / without good cause. / Instead, dismissals must be justified. / Employers must both show cause / and act in a **[xxx]** fair way.\n> \n> 个人申诉条款 / 新西兰《2000年雇佣关系法》（ERA）中的 / 阻止雇主解雇员工 / 在没有正当理由的情况下。 / 相反，解雇必须有正当理由。 / 雇主必须既说明理由 / 又以一种**[xxx]**公平的方式行事。\n\n> 原文参考：\n> \n> Personal grievance procedures were designed to guard the jobs of ordinary workers from “unjustified dismissals”. The **[xxx]** was that the common law of contract lacked sufficient safeguards for workers against **[xxx]** conduct by management. Long gone are the days when a boss could simply give an employee **[xxx]** notice.\n> \n> 开始精读：\n> \n> Personal grievance procedures were designed / to guard the jobs of ordinary workers / from “unjustified dismissals”. / The **[xxx]** was that / the common law of contract lacked sufficient safeguards for workers / against **[xxx]** conduct by management. / Long gone are the days / when a boss could simply give an employee **[xxx]** notice.\n> \n> 个人申诉程序被设计出来 / 是为了保护普通工人的工作岗位 / 使其免遭“无正当理由的解雇”。 / 其**[xxx]**在于 / 合同普通法对工人缺乏充分保护 / 以抵御管理层的**[xxx]**行为。 / 那些日子早已一去不复返了 / 即老板可以简单地给员工一份**[xxx]**通知的日子。\n\n题干的are intended to问设立条款所要达到的目的。第1段说明雇主解雇员工要满足的条件，第2段用were designed to说明程序保护谁、免于什么；空格要概括这项保护的具体内容。\n\n接下来按A—D逐项看。","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38],[274,504,1122,38],[202,555,1197,39],[202,609,1194,37],[202,657,1194,45],[202,713,268,30]],"questionRects":[[226,608,1085,39],[292,660,552,38],[292,713,588,37],[292,765,599,38],[292,817,596,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0,1],"qid":"36","initialReadingPids":[0,1]},"html":"<h2>36题</h2>\n<blockquote><p>The personal grievance provisions of the ERA are intended to ______.<br />\nERA中的个人申诉条款旨在做什么？</p>\n</blockquote>\n<p>题干直接点出personal grievance provisions of the ERA。第1段以这组条款开篇，第2段的Personal grievance procedures接着交代设计目的，因此把这两段完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>The personal grievance provisions of New Zealand’s Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause. Instead, dismissals must be justified. Employers must both show cause and act in a <strong>[xxx]</strong> fair way.</p>\n<p>开始精读：</p>\n<p>The personal grievance provisions / of New Zealand’s Employment Relations Act 2000 (ERA) / prevent an employer from firing an employee / without good cause. / Instead, dismissals must be justified. / Employers must both show cause / and act in a <strong>[xxx]</strong> fair way.</p>\n<p>个人申诉条款 / 新西兰《2000年雇佣关系法》（ERA）中的 / 阻止雇主解雇员工 / 在没有正当理由的情况下。 / 相反，解雇必须有正当理由。 / 雇主必须既说明理由 / 又以一种<strong>[xxx]</strong>公平的方式行事。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Personal grievance procedures were designed to guard the jobs of ordinary workers from “unjustified dismissals”. The <strong>[xxx]</strong> was that the common law of contract lacked sufficient safeguards for workers against <strong>[xxx]</strong> conduct by management. Long gone are the days when a boss could simply give an employee <strong>[xxx]</strong> notice.</p>\n<p>开始精读：</p>\n<p>Personal grievance procedures were designed / to guard the jobs of ordinary workers / from “unjustified dismissals”. / The <strong>[xxx]</strong> was that / the common law of contract lacked sufficient safeguards for workers / against <strong>[xxx]</strong> conduct by management. / Long gone are the days / when a boss could simply give an employee <strong>[xxx]</strong> notice.</p>\n<p>个人申诉程序被设计出来 / 是为了保护普通工人的工作岗位 / 使其免遭“无正当理由的解雇”。 / 其<strong>[xxx]</strong>在于 / 合同普通法对工人缺乏充分保护 / 以抵御管理层的<strong>[xxx]</strong>行为。 / 那些日子早已一去不复返了 / 即老板可以简单地给员工一份<strong>[xxx]</strong>通知的日子。</p>\n</blockquote>\n<p>题干的are intended to问设立条款所要达到的目的。第1段说明雇主解雇员工要满足的条件，第2段用were designed to说明程序保护谁、免于什么；空格要概括这项保护的具体内容。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. punish dubious corporate practices\n\n> 惩罚可疑的企业行为\n\n把A接回题干，它说的是：ERA中的个人申诉条款旨在惩罚可疑的企业行为。\n\nA说惩罚企业行为，回前两段看were designed to后面的目的。\n\n> prevent an employer from firing an employee without good cause\n\n> to guard the jobs of ordinary workers from “unjustified dismissals”\n\n条款要求解雇有充分理由，并明确说要保护普通工人的工作，防止不合理解雇。对企业行为加以约束，是保护员工的做法。\n\n这里没有具体写处罚什么企业行为，更没有把范围扩展到所有可疑经营行为。\n\n**要求企业合理解雇，是否就能把条款目的概括为惩罚可疑企业行为？**\n\n不能。A把保护员工的目的改成了惩罚企业，范围也超出了这里的解雇问题。\n\n**第一轮判断：A排除。**","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38],[274,504,1122,38],[202,555,1197,39],[202,609,1194,37],[202,657,1194,45],[202,713,268,30]],"questionRects":[[292,660,552,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"36","paragraphPids":[0,1]},"html":"<h3>A. punish dubious corporate practices</h3>\n<blockquote><p>惩罚可疑的企业行为</p>\n</blockquote>\n<p>把A接回题干，它说的是：ERA中的个人申诉条款旨在惩罚可疑的企业行为。</p>\n<p>A说惩罚企业行为，回前两段看were designed to后面的目的。</p>\n<blockquote><p>prevent an employer from firing an employee without good cause</p>\n</blockquote>\n<blockquote><p>to guard the jobs of ordinary workers from “unjustified dismissals”</p>\n</blockquote>\n<p>条款要求解雇有充分理由，并明确说要保护普通工人的工作，防止不合理解雇。对企业行为加以约束，是保护员工的做法。</p>\n<p>这里没有具体写处罚什么企业行为，更没有把范围扩展到所有可疑经营行为。</p>\n<p><strong>要求企业合理解雇，是否就能把条款目的概括为惩罚可疑企业行为？</strong></p>\n<p>不能。A把保护员工的目的改成了惩罚企业，范围也超出了这里的解雇问题。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"36题","raw":"### B. improve traditional hiring procedures\n\n> 改善传统的招聘程序\n\n把B接回题干，它说的是：ERA中的个人申诉条款旨在改善传统的招聘程序。\n\nB说招聘程序，回第1段找firing和dismissals。\n\n> dismissals must be justified\n\n> Personal grievance procedures were designed to guard the jobs of ordinary workers from “unjustified dismissals”.\n\n这两个词都在说已经雇用的人怎样被解雇，第2段继续讲保护他们现有的工作。条款要求雇主说明解雇原因，并公平地行事。\n\nhiring是把人招进来，不是把人解雇。两者都与雇用有关，也不能互换。\n\n**文章这里改进的是招人程序吗？**\n\n不是。这里限制不合理解雇，B换成了招聘。\n\n**第一轮判断：B排除。**","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38],[274,504,1122,38],[202,555,1197,39],[202,609,1194,37],[202,657,1194,45],[202,713,268,30]],"questionRects":[[292,713,588,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[0,1]},"html":"<h3>B. improve traditional hiring procedures</h3>\n<blockquote><p>改善传统的招聘程序</p>\n</blockquote>\n<p>把B接回题干，它说的是：ERA中的个人申诉条款旨在改善传统的招聘程序。</p>\n<p>B说招聘程序，回第1段找firing和dismissals。</p>\n<blockquote><p>dismissals must be justified</p>\n</blockquote>\n<blockquote><p>Personal grievance procedures were designed to guard the jobs of ordinary workers from “unjustified dismissals”.</p>\n</blockquote>\n<p>这两个词都在说已经雇用的人怎样被解雇，第2段继续讲保护他们现有的工作。条款要求雇主说明解雇原因，并公平地行事。</p>\n<p>hiring是把人招进来，不是把人解雇。两者都与雇用有关，也不能互换。</p>\n<p><strong>文章这里改进的是招人程序吗？</strong></p>\n<p>不是。这里限制不合理解雇，B换成了招聘。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. exempt employers from certain duties\n\n> 免除雇主的某些义务\n\n把C接回题干，它说的是：ERA中的个人申诉条款旨在免除雇主的某些义务。\n\nC说免除雇主义务，回第1段看Employers must。\n\n> dismissals must be justified\n\n> Employers must both show cause and act in a **[xxx]** fair way.\n\n雇主must既要说明理由，也要公平行事。条款是在为解雇增加必须履行的要求，让老板不能随意让员工离开。\n\nC的exempt from恰好是把某些义务免掉，与must后面添加要求的说法相反。\n\n**条款是在要求雇主承担责任，还是使雇主免除责任？**\n\n是在提出要求。C把约束雇主说成了免除其义务。\n\n**第一轮判断：C排除。**","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38]],"questionRects":[[292,765,599,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>C. exempt employers from certain duties</h3>\n<blockquote><p>免除雇主的某些义务</p>\n</blockquote>\n<p>把C接回题干，它说的是：ERA中的个人申诉条款旨在免除雇主的某些义务。</p>\n<p>C说免除雇主义务，回第1段看Employers must。</p>\n<blockquote><p>dismissals must be justified</p>\n</blockquote>\n<blockquote><p>Employers must both show cause and act in a <strong>[xxx]</strong> fair way.</p>\n</blockquote>\n<p>雇主must既要说明理由，也要公平行事。条款是在为解雇增加必须履行的要求，让老板不能随意让员工离开。</p>\n<p>C的exempt from恰好是把某些义务免掉，与must后面添加要求的说法相反。</p>\n<p><strong>条款是在要求雇主承担责任，还是使雇主免除责任？</strong></p>\n<p>是在提出要求。C把约束雇主说成了免除其义务。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"36题","raw":"### D. protect the rights of ordinary workers\n\n> 保护普通工人的权利\n\n把D接回题干，它说的是：ERA中的个人申诉条款旨在保护普通工人的权利。\n\nD说保护普通工人权利，回第2段找guard the jobs of ordinary workers。\n\n> to guard the jobs of ordinary workers from “unjustified dismissals”\n\n目的直接写在were designed to后面：保障普通工人的工作，使他们免受不合理解雇。第1段要求雇主拿出充分理由，也是为这一保障服务。\n\nD没有另加处罚或招聘内容，而是把工作不被随意剥夺概括为工人的权利受到保护。\n\n**guard their jobs from unjustified dismissals是否属于保护普通工人的权利？**\n\n属于。D与条款明写的目的对应，可以保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,504,1122,38],[202,555,1197,39],[202,609,1194,37],[202,657,1194,45],[202,713,268,30]],"questionRects":[[292,817,596,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"36","paragraphPids":[1]},"html":"<h3>D. protect the rights of ordinary workers</h3>\n<blockquote><p>保护普通工人的权利</p>\n</blockquote>\n<p>把D接回题干，它说的是：ERA中的个人申诉条款旨在保护普通工人的权利。</p>\n<p>D说保护普通工人权利，回第2段找guard the jobs of ordinary workers。</p>\n<blockquote><p>to guard the jobs of ordinary workers from “unjustified dismissals”</p>\n</blockquote>\n<p>目的直接写在were designed to后面：保障普通工人的工作，使他们免受不合理解雇。第1段要求雇主拿出充分理由，也是为这一保障服务。</p>\n<p>D没有另加处罚或招聘内容，而是把工作不被随意剥夺概括为工人的权利受到保护。</p>\n<p><strong>guard their jobs from unjustified dismissals是否属于保护普通工人的权利？</strong></p>\n<p>属于。D与条款明写的目的对应，可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第36题第一次留下D。A改成惩罚企业行为，B换成招聘程序，C把施加义务说成免除义务；D保留了保护普通工人的目的。","articleRects":[],"questionRects":[[226,608,1085,39],[292,660,552,38],[292,713,588,37],[292,765,599,38],[292,817,596,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第36题第一次留下D。A改成惩罚企业行为，B换成招聘程序，C把施加义务说成免除义务；D保留了保护普通工人的目的。</p>\n"},{"section":"37题","raw":"## 37题\n\n> It can be learned from Paragraph 3 that the provisions may ______.  \n> 从第3段可以得知，这些条款可能会怎样？\n\n题干明确给出Paragraph 3，直接完整精读第3段。段首的these provisions承接前文的就业保护条款，本段讨论把条款用于高薪经理和高管时的情况。\n\n> 原文参考：\n> \n> But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will **[xxx]**, constraining firms from firing poorly performing, high-earning managers is a **[xxx]** on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet **[xxx]** is no longer enough to justify a dismissal.\n> \n> 开始精读：\n> \n> But these provisions create difficulties for businesses / when applied to highly paid managers and executives. / As countless boards and business owners will **[xxx]**, / constraining firms from firing poorly performing, high-earning managers / is a **[xxx]** on boosting productivity and overall performance. / The difference between C-grade and A-grade managers / may very well be the difference between business success or failure. / Between preserving the jobs of ordinary workers or losing them. / Yet **[xxx]** is no longer enough to justify a dismissal.\n> \n> 但是这些条款会给企业制造困难 / 当它们被用于高薪经理和高管时。 / 正如无数董事会和企业主会**[xxx]**的那样， / 限制企业解雇表现不佳、收入高的经理 / 是对提高生产率和整体业绩的一种**[xxx]**。 / 丙级经理与甲级经理之间的差别 / 很可能就是企业成功与失败之间的差别。 / 是保住普通工人的工作岗位与失去这些岗位之间的差别。 / 然而，**[xxx]**已不足以成为解雇的正当理由。\n\nthe provisions may要补的是这些条款可能带来的后果。需要把第3段中的企业、经理和普通工人之间的关系接起来，判断条款限制解雇时会产生什么影响。\n\n接下来按A—D逐项看。","articleRects":[[274,765,1122,38],[202,817,1192,38],[202,865,1194,47],[202,922,1194,38],[202,974,1194,38],[202,1026,1195,38],[202,1078,1044,38]],"questionRects":[[226,921,934,38],[292,974,467,37],[292,1026,499,38],[292,1078,570,38],[292,1131,564,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"37","initialReadingPids":[2]},"html":"<h2>37题</h2>\n<blockquote><p>It can be learned from Paragraph 3 that the provisions may ______.<br />\n从第3段可以得知，这些条款可能会怎样？</p>\n</blockquote>\n<p>题干明确给出Paragraph 3，直接完整精读第3段。段首的these provisions承接前文的就业保护条款，本段讨论把条款用于高薪经理和高管时的情况。</p>\n<blockquote><p>原文参考：</p>\n<p>But these provisions create difficulties for businesses when applied to highly paid managers and executives. As countless boards and business owners will <strong>[xxx]</strong>, constraining firms from firing poorly performing, high-earning managers is a <strong>[xxx]</strong> on boosting productivity and overall performance. The difference between C-grade and A-grade managers may very well be the difference between business success or failure. Between preserving the jobs of ordinary workers or losing them. Yet <strong>[xxx]</strong> is no longer enough to justify a dismissal.</p>\n<p>开始精读：</p>\n<p>But these provisions create difficulties for businesses / when applied to highly paid managers and executives. / As countless boards and business owners will <strong>[xxx]</strong>, / constraining firms from firing poorly performing, high-earning managers / is a <strong>[xxx]</strong> on boosting productivity and overall performance. / The difference between C-grade and A-grade managers / may very well be the difference between business success or failure. / Between preserving the jobs of ordinary workers or losing them. / Yet <strong>[xxx]</strong> is no longer enough to justify a dismissal.</p>\n<p>但是这些条款会给企业制造困难 / 当它们被用于高薪经理和高管时。 / 正如无数董事会和企业主会<strong>[xxx]</strong>的那样， / 限制企业解雇表现不佳、收入高的经理 / 是对提高生产率和整体业绩的一种<strong>[xxx]</strong>。 / 丙级经理与甲级经理之间的差别 / 很可能就是企业成功与失败之间的差别。 / 是保住普通工人的工作岗位与失去这些岗位之间的差别。 / 然而，<strong>[xxx]</strong>已不足以成为解雇的正当理由。</p>\n</blockquote>\n<p>the provisions may要补的是这些条款可能带来的后果。需要把第3段中的企业、经理和普通工人之间的关系接起来，判断条款限制解雇时会产生什么影响。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"37题","raw":"### A. hinder business development\n\n> 阻碍企业发展\n\n把A接回题干，它说的是：从第3段可以得知，这些条款可能阻碍企业发展。\n\nA说阻碍企业发展，回第3段看限制解雇哪一类经理，以及后面的success or failure。\n\n> these provisions create difficulties for businesses when applied to highly paid managers and executives\n\n> The difference between C-grade and A-grade managers may very well be the difference between business success or failure.\n\n条款也用于高薪管理者，企业便难以解雇表现差的人。接着作者说C级与A级经理的差别，可能就是企业失败与成功的差别。\n\n有个词不认识，也不妨碍把这两句接起来：经理能力会影响经营，表现不好却难以更换，会给企业造成困难。\n\n**难以换掉可能使企业失败的经理，会不会阻碍企业发展？**\n\n会。A能接上管理表现与经营成败的联系，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,765,1122,38],[202,817,1192,38],[202,865,1194,47],[202,922,1194,38],[202,974,1194,38],[202,1026,1195,38],[202,1078,1044,38]],"questionRects":[[292,974,467,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"37","paragraphPids":[2]},"html":"<h3>A. hinder business development</h3>\n<blockquote><p>阻碍企业发展</p>\n</blockquote>\n<p>把A接回题干，它说的是：从第3段可以得知，这些条款可能阻碍企业发展。</p>\n<p>A说阻碍企业发展，回第3段看限制解雇哪一类经理，以及后面的success or failure。</p>\n<blockquote><p>these provisions create difficulties for businesses when applied to highly paid managers and executives</p>\n</blockquote>\n<blockquote><p>The difference between C-grade and A-grade managers may very well be the difference between business success or failure.</p>\n</blockquote>\n<p>条款也用于高薪管理者，企业便难以解雇表现差的人。接着作者说C级与A级经理的差别，可能就是企业失败与成功的差别。</p>\n<p>有个词不认识，也不妨碍把这两句接起来：经理能力会影响经营，表现不好却难以更换，会给企业造成困难。</p>\n<p><strong>难以换掉可能使企业失败的经理，会不会阻碍企业发展？</strong></p>\n<p>会。A能接上管理表现与经营成败的联系，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"37题","raw":"### B. undermine managers’ authority\n\n> 削弱经理的权威\n\n把B接回题干，它说的是：从第3段可以得知，这些条款可能削弱经理的权威。\n\nB说削弱经理权威，回第3段看经理受到的是哪一种限制。\n\n> constraining firms from firing poorly performing, high-earning managers\n\n原文受限制的是企业：企业不能轻易开除表现差的高薪经理。经理因此更容易保住职位，并不是文中说他对下属的指挥权变小。\n\n作者比较经理能力对经营的作用，没有比较条款实施前后经理的权威。\n\n**难以解雇经理，是否直接说明经理的权威被削弱？**\n\n不是。B把企业解雇受到约束换成了经理权威受损。\n\n**第一轮判断：B排除。**","articleRects":[[274,765,1122,38],[202,817,1192,38],[202,865,1194,47],[202,922,1194,38],[202,974,1194,38],[202,1026,1195,38],[202,1078,1044,38]],"questionRects":[[292,1026,499,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"37","paragraphPids":[2]},"html":"<h3>B. undermine managers’ authority</h3>\n<blockquote><p>削弱经理的权威</p>\n</blockquote>\n<p>把B接回题干，它说的是：从第3段可以得知，这些条款可能削弱经理的权威。</p>\n<p>B说削弱经理权威，回第3段看经理受到的是哪一种限制。</p>\n<blockquote><p>constraining firms from firing poorly performing, high-earning managers</p>\n</blockquote>\n<p>原文受限制的是企业：企业不能轻易开除表现差的高薪经理。经理因此更容易保住职位，并不是文中说他对下属的指挥权变小。</p>\n<p>作者比较经理能力对经营的作用，没有比较条款实施前后经理的权威。</p>\n<p><strong>难以解雇经理，是否直接说明经理的权威被削弱？</strong></p>\n<p>不是。B把企业解雇受到约束换成了经理权威受损。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"37题","raw":"### C. affect the public image of the firms\n\n> 影响企业的公众形象\n\n把C接回题干，它说的是：从第3段可以得知，这些条款可能影响企业的公众形象。\n\nC说公众形象，回第3段看企业success or failure具体连着什么。\n\n> is a **[xxx]** on boosting productivity and overall performance\n\n> may very well be the difference between business success or failure\n\n这里先说经理表现，再说生产率和整体经营表现，最后说普通工人的工作能否保住。这些都是企业经营及就业后果。\n\n公众是否信任这家企业、怎样评价它，原文并没有展开。企业可能失败也不能自动写成公众形象受损。\n\n**本段直接谈的是经营成败，还是公众如何看待企业？**\n\n是经营成败。C需要公众评价的依据，这一段没有给出。\n\n**第一轮判断：C排除。**","articleRects":[[274,765,1122,38],[202,817,1192,38],[202,865,1194,47],[202,922,1194,38],[202,974,1194,38],[202,1026,1195,38],[202,1078,1044,38]],"questionRects":[[292,1078,570,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"37","paragraphPids":[2]},"html":"<h3>C. affect the public image of the firms</h3>\n<blockquote><p>影响企业的公众形象</p>\n</blockquote>\n<p>把C接回题干，它说的是：从第3段可以得知，这些条款可能影响企业的公众形象。</p>\n<p>C说公众形象，回第3段看企业success or failure具体连着什么。</p>\n<blockquote><p>is a <strong>[xxx]</strong> on boosting productivity and overall performance</p>\n</blockquote>\n<blockquote><p>may very well be the difference between business success or failure</p>\n</blockquote>\n<p>这里先说经理表现，再说生产率和整体经营表现，最后说普通工人的工作能否保住。这些都是企业经营及就业后果。</p>\n<p>公众是否信任这家企业、怎样评价它，原文并没有展开。企业可能失败也不能自动写成公众形象受损。</p>\n<p><strong>本段直接谈的是经营成败，还是公众如何看待企业？</strong></p>\n<p>是经营成败。C需要公众评价的依据，这一段没有给出。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"37题","raw":"### D. worsen labor-management relations\n\n> 使劳资关系恶化\n\n把D接回题干，它说的是：从第3段可以得知，这些条款可能使劳资关系恶化。\n\nD说劳资关系恶化，回第3段看普通工人出现在哪一句。\n\n> The difference between C-grade and A-grade managers may very well be the difference between business success or failure.\n\n> Between preserving the jobs of ordinary workers or losing them.\n\n作者说好坏经理可能关系到普通工人保住还是失去工作。这里用工人的岗位说明企业经营成败的后果。\n\n没有接着写工人与管理层争执，也没有说双方关系比过去差。担心工作丢失和劳资冲突不能直接画等号。\n\n**普通工人的工作可能受影响，就能确定劳资关系恶化吗？**\n\n不能。D把就业风险改成了双方关系变化。\n\n**第一轮判断：D排除。**","articleRects":[[274,765,1122,38],[202,817,1192,38],[202,865,1194,47],[202,922,1194,38],[202,974,1194,38],[202,1026,1195,38],[202,1078,1044,38]],"questionRects":[[292,1131,564,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"37","paragraphPids":[2]},"html":"<h3>D. worsen labor-management relations</h3>\n<blockquote><p>使劳资关系恶化</p>\n</blockquote>\n<p>把D接回题干，它说的是：从第3段可以得知，这些条款可能使劳资关系恶化。</p>\n<p>D说劳资关系恶化，回第3段看普通工人出现在哪一句。</p>\n<blockquote><p>The difference between C-grade and A-grade managers may very well be the difference between business success or failure.</p>\n</blockquote>\n<blockquote><p>Between preserving the jobs of ordinary workers or losing them.</p>\n</blockquote>\n<p>作者说好坏经理可能关系到普通工人保住还是失去工作。这里用工人的岗位说明企业经营成败的后果。</p>\n<p>没有接着写工人与管理层争执，也没有说双方关系比过去差。担心工作丢失和劳资冲突不能直接画等号。</p>\n<p><strong>普通工人的工作可能受影响，就能确定劳资关系恶化吗？</strong></p>\n<p>不能。D把就业风险改成了双方关系变化。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"37题","raw":"### 37题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第37题第一次留下A。段落直接写条款给企业制造困难，并说明经理水平关系到企业成败；经理权威、公众形象和劳资关系都改变了文中所说的受影响对象。","articleRects":[],"questionRects":[[226,921,934,38],[292,974,467,37],[292,1026,499,38],[292,1078,570,38],[292,1131,564,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"37"},"html":"<h3>37题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第37题第一次留下A。段落直接写条款给企业制造困难，并说明经理水平关系到企业成败；经理权威、公众形象和劳资关系都改变了文中所说的受影响对象。</p>\n"},{"section":"38题","raw":"## 38题\n\n> Which of the following measures would the Productivity Commission support?  \n> 生产力委员会会支持下列哪项措施？\n\n题干点名the Productivity Commission，第5段同名机构的判断可以直接定位。完整读这一段，先看作者所说的法律、经理和生产率之间的关系，再看委员会报告指出的原因。\n\n> 原文参考：\n> \n> If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing underperforming managers, those laws act as a constraint on firm productivity and therefore on workers’ wages. Indeed, in “An International Perspective on New Zealand’s Productivity Paradox” (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record.\n> \n> 开始精读：\n> \n> If not placing jobs at risk, / to the extent employment protection laws constrain business owners / from dismissing underperforming managers, / those laws act as a constraint on firm productivity / and therefore on workers’ wages. / Indeed, in “An International Perspective on New Zealand’s Productivity Paradox” (2014), / the Productivity Commission singled out the low quality of managerial capabilities / as a cause of the country’s poor productivity growth record.\n> \n> 即使没有让工作岗位面临风险， / 在就业保护法限制企业主的情况下， / 使其不能解雇表现不佳的经理， / 这些法律也会限制企业生产率 / 进而限制工人的工资。 / 事实上，在《从国际视角看新西兰的生产率悖论》（2014）中， / 生产力委员会特别指出管理能力水平低下 / 是该国生产率增长表现不佳的一个原因。\n\nwould the Productivity Commission support问委员会会赞成哪种做法。要根据它对生产率增长不佳原因的判断，检验选项的措施是否针对该原因、是否沿着同一方向改善情况。\n\n接下来按A—D逐项看。","articleRects":[[274,1235,1122,38],[202,1287,1194,38],[202,1339,1189,38],[202,1390,1189,39],[205,1442,1191,39],[320,1465,11,15],[202,1496,1053,38]],"questionRects":[[226,1235,1196,38],[303,1290,125,35],[302,1339,583,38],[302,1392,619,37],[302,1444,637,38],[302,1496,639,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"38","initialReadingPids":[4]},"html":"<h2>38题</h2>\n<blockquote><p>Which of the following measures would the Productivity Commission support?<br />\n生产力委员会会支持下列哪项措施？</p>\n</blockquote>\n<p>题干点名the Productivity Commission，第5段同名机构的判断可以直接定位。完整读这一段，先看作者所说的法律、经理和生产率之间的关系，再看委员会报告指出的原因。</p>\n<blockquote><p>原文参考：</p>\n<p>If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing underperforming managers, those laws act as a constraint on firm productivity and therefore on workers’ wages. Indeed, in “An International Perspective on New Zealand’s Productivity Paradox” (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record.</p>\n<p>开始精读：</p>\n<p>If not placing jobs at risk, / to the extent employment protection laws constrain business owners / from dismissing underperforming managers, / those laws act as a constraint on firm productivity / and therefore on workers’ wages. / Indeed, in “An International Perspective on New Zealand’s Productivity Paradox” (2014), / the Productivity Commission singled out the low quality of managerial capabilities / as a cause of the country’s poor productivity growth record.</p>\n<p>即使没有让工作岗位面临风险， / 在就业保护法限制企业主的情况下， / 使其不能解雇表现不佳的经理， / 这些法律也会限制企业生产率 / 进而限制工人的工资。 / 事实上，在《从国际视角看新西兰的生产率悖论》（2014）中， / 生产力委员会特别指出管理能力水平低下 / 是该国生产率增长表现不佳的一个原因。</p>\n</blockquote>\n<p>would the Productivity Commission support问委员会会赞成哪种做法。要根据它对生产率增长不佳原因的判断，检验选项的措施是否针对该原因、是否沿着同一方向改善情况。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"38题","raw":"### A. Imposing reasonable wage restraints.\n\n> 施加合理的工资限制\n\n把A接回题干，它说的是：生产力委员会会支持施加合理的工资限制。\n\nA说限制工资，回第5段看wages前面的因果关系。\n\n> those laws act as a constraint on firm productivity and therefore on workers’ wages\n\n> singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record\n\n法律限制企业解雇差经理，进而限制生产率，因此也限制工人工资。这是作者正在指出的坏处。\n\n委员会被引用，是因为它把管理能力低下列为生产率增长差的原因。不是因为它认为工人工资太高、应加以压低。\n\n**工资受到限制在这里是要解决的问题，还是委员会推荐的办法？**\n\n是问题带来的后果。A把负面后果改成了建议采取的措施。\n\n**第一轮判断：A排除。**","articleRects":[[274,1235,1122,38],[202,1287,1194,38],[202,1339,1189,38],[202,1390,1189,39],[205,1442,1191,39],[320,1465,11,15],[202,1496,1053,38]],"questionRects":[[302,1339,583,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"38","paragraphPids":[4]},"html":"<h3>A. Imposing reasonable wage restraints.</h3>\n<blockquote><p>施加合理的工资限制</p>\n</blockquote>\n<p>把A接回题干，它说的是：生产力委员会会支持施加合理的工资限制。</p>\n<p>A说限制工资，回第5段看wages前面的因果关系。</p>\n<blockquote><p>those laws act as a constraint on firm productivity and therefore on workers’ wages</p>\n</blockquote>\n<blockquote><p>singled out the low quality of managerial capabilities as a cause of the country’s poor productivity growth record</p>\n</blockquote>\n<p>法律限制企业解雇差经理，进而限制生产率，因此也限制工人工资。这是作者正在指出的坏处。</p>\n<p>委员会被引用，是因为它把管理能力低下列为生产率增长差的原因。不是因为它认为工人工资太高、应加以压低。</p>\n<p><strong>工资受到限制在这里是要解决的问题，还是委员会推荐的办法？</strong></p>\n<p>是问题带来的后果。A把负面后果改成了建议采取的措施。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"38题","raw":"### B. Enforcing employment protection laws.\n\n> 执行就业保护法\n\n把B接回题干，它说的是：生产力委员会会支持执行就业保护法。\n\nB说执行就业保护法，回第5段看作者怎样引出委员会报告。\n\n> employment protection laws constrain business owners from dismissing underperforming managers\n\n> those laws act as a constraint on firm productivity\n\n> the low quality of managerial capabilities as a cause of the country’s poor productivity growth record\n\n这一段说保护法让表现差的经理难以被解雇，从而压低企业生产率；紧接着委员会也指出管理能力低下是原因。\n\n委员会的这项判断能支持改善管理，不能支持继续用同一限制保住表现差的经理。\n\n**就本段指出的原因而言，继续执行这种限制能解决管理能力低下吗？**\n\n不能。B没有对应委员会指出的问题，反而延续了本段批评的约束。\n\n**第一轮判断：B排除。**","articleRects":[[274,1235,1122,38],[202,1287,1194,38],[202,1339,1189,38],[202,1390,1189,39],[205,1442,1191,39],[320,1465,11,15],[202,1496,1053,38]],"questionRects":[[302,1392,619,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"38","paragraphPids":[4]},"html":"<h3>B. Enforcing employment protection laws.</h3>\n<blockquote><p>执行就业保护法</p>\n</blockquote>\n<p>把B接回题干，它说的是：生产力委员会会支持执行就业保护法。</p>\n<p>B说执行就业保护法，回第5段看作者怎样引出委员会报告。</p>\n<blockquote><p>employment protection laws constrain business owners from dismissing underperforming managers</p>\n</blockquote>\n<blockquote><p>those laws act as a constraint on firm productivity</p>\n</blockquote>\n<blockquote><p>the low quality of managerial capabilities as a cause of the country’s poor productivity growth record</p>\n</blockquote>\n<p>这一段说保护法让表现差的经理难以被解雇，从而压低企业生产率；紧接着委员会也指出管理能力低下是原因。</p>\n<p>委员会的这项判断能支持改善管理，不能支持继续用同一限制保住表现差的经理。</p>\n<p><strong>就本段指出的原因而言，继续执行这种限制能解决管理能力低下吗？</strong></p>\n<p>不能。B没有对应委员会指出的问题，反而延续了本段批评的约束。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"38题","raw":"### C. Limiting the powers of business owners.\n\n> 限制企业主的权力\n\n把C接回题干，它说的是：生产力委员会会支持限制企业主的权力。\n\nC说限制企业主权力，回第5段看constrain business owners后面是什么。\n\n> constrain business owners from dismissing underperforming managers\n\n> those laws act as a constraint on firm productivity\n\n> the low quality of managerial capabilities as a cause of the country’s poor productivity growth record\n\n企业主被限制的是解雇表现不佳经理的权力。作者把这一限制接到生产率受限，委员会又指出低管理能力拖累生产率。\n\n如果仍限制企业主处理这些经理，文中指出的低管理能力就更难改掉。\n\n**委员会的判断支持继续限制企业主处理差经理，还是支持解决差经理的问题？**\n\n支持后者。C把文中导致困难的限制当成了应采取的措施。\n\n**第一轮判断：C排除。**","articleRects":[[274,1235,1122,38],[202,1287,1194,38],[202,1339,1189,38],[202,1390,1189,39],[205,1442,1191,39],[320,1465,11,15],[202,1496,1053,38]],"questionRects":[[302,1444,637,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"38","paragraphPids":[4]},"html":"<h3>C. Limiting the powers of business owners.</h3>\n<blockquote><p>限制企业主的权力</p>\n</blockquote>\n<p>把C接回题干，它说的是：生产力委员会会支持限制企业主的权力。</p>\n<p>C说限制企业主权力，回第5段看constrain business owners后面是什么。</p>\n<blockquote><p>constrain business owners from dismissing underperforming managers</p>\n</blockquote>\n<blockquote><p>those laws act as a constraint on firm productivity</p>\n</blockquote>\n<blockquote><p>the low quality of managerial capabilities as a cause of the country’s poor productivity growth record</p>\n</blockquote>\n<p>企业主被限制的是解雇表现不佳经理的权力。作者把这一限制接到生产率受限，委员会又指出低管理能力拖累生产率。</p>\n<p>如果仍限制企业主处理这些经理，文中指出的低管理能力就更难改掉。</p>\n<p><strong>委员会的判断支持继续限制企业主处理差经理，还是支持解决差经理的问题？</strong></p>\n<p>支持后者。C把文中导致困难的限制当成了应采取的措施。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"38题","raw":"### D. Dismissing poorly performing managers.\n\n> 解雇表现不佳的经理\n\n把D接回题干，它说的是：生产力委员会会支持解雇表现不佳的经理。\n\nD说解雇表现差的经理，回第5段把underperforming managers与low quality of managerial capabilities接起来。\n\n> employment protection laws constrain business owners from dismissing underperforming managers\n\n> those laws act as a constraint on firm productivity\n\n> the low quality of managerial capabilities as a cause of the country’s poor productivity growth record\n\n前一句指出企业难以解雇表现差的经理，后一句委员会报告指出管理能力低下拖累生产率。两句说的是同一个管理问题。\n\n让企业能够换掉表现不佳的人，才可能改善这一问题。D不是说不问表现就解雇，而是明确限定poorly performing。\n\n**处理表现不佳的经理，是否正对着委员会指出的低管理能力问题？**\n\n是。D最能从委员会的判断推出，可以保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,1235,1122,38],[202,1287,1194,38],[202,1339,1189,38],[202,1390,1189,39],[205,1442,1191,39],[320,1465,11,15],[202,1496,1053,38]],"questionRects":[[302,1496,639,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"38","paragraphPids":[4]},"html":"<h3>D. Dismissing poorly performing managers.</h3>\n<blockquote><p>解雇表现不佳的经理</p>\n</blockquote>\n<p>把D接回题干，它说的是：生产力委员会会支持解雇表现不佳的经理。</p>\n<p>D说解雇表现差的经理，回第5段把underperforming managers与low quality of managerial capabilities接起来。</p>\n<blockquote><p>employment protection laws constrain business owners from dismissing underperforming managers</p>\n</blockquote>\n<blockquote><p>those laws act as a constraint on firm productivity</p>\n</blockquote>\n<blockquote><p>the low quality of managerial capabilities as a cause of the country’s poor productivity growth record</p>\n</blockquote>\n<p>前一句指出企业难以解雇表现差的经理，后一句委员会报告指出管理能力低下拖累生产率。两句说的是同一个管理问题。</p>\n<p>让企业能够换掉表现不佳的人，才可能改善这一问题。D不是说不问表现就解雇，而是明确限定poorly performing。</p>\n<p><strong>处理表现不佳的经理，是否正对着委员会指出的低管理能力问题？</strong></p>\n<p>是。D最能从委员会的判断推出，可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第38题第一次留下D。委员会把低水平管理视为生产率增长不佳的原因，解雇表现不佳的经理针对了这一原因；其他措施把本段讨论的限制或不利后果变成了支持对象。","articleRects":[],"questionRects":[[226,1235,1196,38],[303,1290,125,35],[302,1339,583,38],[302,1392,619,37],[302,1444,637,38],[302,1496,639,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第38题第一次留下D。委员会把低水平管理视为生产率增长不佳的原因，解雇表现不佳的经理针对了这一原因；其他措施把本段讨论的限制或不利后果变成了支持对象。</p>\n"},{"section":"39题","raw":"## 39题\n\n> What might be an effect of ERA’s unjustified dismissal procedures?  \n> ERA中无正当理由解雇的相关程序可能会产生什么影响？\n\n题干中的ERA’s unjustified dismissal procedures在第6段第一句直接出现，该段接着说明这些程序怎样影响企业与经理，完整读第6段。\n\n> 原文参考：\n> \n> Nor are highly paid managers themselves immune from the harm caused by the ERA’s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the **[xxx]** manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.\n> \n> 开始精读：\n> \n> Nor are highly paid managers themselves immune from the harm / caused by the ERA’s unjustified dismissal procedures. / Because employment protection laws make it costlier to fire an employee, / employers are more cautious about hiring new staff. / This makes it harder for the **[xxx]** manager to gain employment. / And firms pay staff less / because firms carry the burden of the employment arrangement going wrong.\n> \n> 高薪经理本身也无法免于损害 / 这种损害由《雇佣关系法》中无正当理由解雇的相关程序造成。 / 由于就业保护法使解雇一名员工的成本更高， / 雇主在招聘新员工时就更为谨慎。 / 这使得**[xxx]**经理更难获得工作。 / 而且企业付给员工的工资更少 / 因为企业承担着雇佣安排出问题的负担。\n\nan effect问程序造成的后果。这一段给出了“解雇成本—招聘态度—求职难度”以及“企业承担负担—员工工资”的连接，要按实际的因果方向判断选项。\n\n接下来按A—D逐项看。","articleRects":[[273,1548,1123,38],[202,1600,1194,38],[202,1653,1194,37],[202,1705,1184,38],[202,1757,1194,38],[202,1809,383,38]],"questionRects":[[226,1600,1066,38],[292,1653,595,38],[292,1705,555,38],[292,1757,641,38],[292,1809,545,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"39","initialReadingPids":[5]},"html":"<h2>39题</h2>\n<blockquote><p>What might be an effect of ERA’s unjustified dismissal procedures?<br />\nERA中无正当理由解雇的相关程序可能会产生什么影响？</p>\n</blockquote>\n<p>题干中的ERA’s unjustified dismissal procedures在第6段第一句直接出现，该段接着说明这些程序怎样影响企业与经理，完整读第6段。</p>\n<blockquote><p>原文参考：</p>\n<p>Nor are highly paid managers themselves immune from the harm caused by the ERA’s unjustified dismissal procedures. Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff. This makes it harder for the <strong>[xxx]</strong> manager to gain employment. And firms pay staff less because firms carry the burden of the employment arrangement going wrong.</p>\n<p>开始精读：</p>\n<p>Nor are highly paid managers themselves immune from the harm / caused by the ERA’s unjustified dismissal procedures. / Because employment protection laws make it costlier to fire an employee, / employers are more cautious about hiring new staff. / This makes it harder for the <strong>[xxx]</strong> manager to gain employment. / And firms pay staff less / because firms carry the burden of the employment arrangement going wrong.</p>\n<p>高薪经理本身也无法免于损害 / 这种损害由《雇佣关系法》中无正当理由解雇的相关程序造成。 / 由于就业保护法使解雇一名员工的成本更高， / 雇主在招聘新员工时就更为谨慎。 / 这使得<strong>[xxx]</strong>经理更难获得工作。 / 而且企业付给员工的工资更少 / 因为企业承担着雇佣安排出问题的负担。</p>\n</blockquote>\n<p>an effect问程序造成的后果。这一段给出了“解雇成本—招聘态度—求职难度”以及“企业承担负担—员工工资”的连接，要按实际的因果方向判断选项。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"39题","raw":"### A. Highly paid managers lose their jobs.\n\n> 高薪经理失去工作\n\n把A接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使高薪经理失去工作。\n\nA说高薪经理丢工作，回第6段看harder to gain employment。\n\n> Nor are highly paid managers themselves immune from the harm\n\n> employment protection laws make it costlier to fire an employee\n\n> This makes it harder for the **[xxx]** manager to gain employment.\n\n这一段说解雇成本高，所以雇主招聘更谨慎，使求职经理更难获得工作。gain employment说的是找进一份工作，不是失去手头的工作。\n\n条款本身还让解雇更困难。不能把招聘入口收紧写成在职经理被解雇。\n\n**更难找到工作，与已经有工作的人失去工作是一回事吗？**\n\n不是。A把就业困难换成了失业结果。\n\n**第一轮判断：A排除。**","articleRects":[[273,1548,1123,38],[202,1600,1194,38],[202,1653,1194,37],[202,1705,1184,38],[202,1757,1194,38],[202,1809,383,38]],"questionRects":[[292,1653,595,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>A. Highly paid managers lose their jobs.</h3>\n<blockquote><p>高薪经理失去工作</p>\n</blockquote>\n<p>把A接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使高薪经理失去工作。</p>\n<p>A说高薪经理丢工作，回第6段看harder to gain employment。</p>\n<blockquote><p>Nor are highly paid managers themselves immune from the harm</p>\n</blockquote>\n<blockquote><p>employment protection laws make it costlier to fire an employee</p>\n</blockquote>\n<blockquote><p>This makes it harder for the <strong>[xxx]</strong> manager to gain employment.</p>\n</blockquote>\n<p>这一段说解雇成本高，所以雇主招聘更谨慎，使求职经理更难获得工作。gain employment说的是找进一份工作，不是失去手头的工作。</p>\n<p>条款本身还让解雇更困难。不能把招聘入口收紧写成在职经理被解雇。</p>\n<p><strong>更难找到工作，与已经有工作的人失去工作是一回事吗？</strong></p>\n<p>不是。A把就业困难换成了失业结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"39题","raw":"### B. Employees suffer from salary cuts.\n\n> 员工遭受减薪\n\n把B接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使员工遭受减薪。\n\nB说员工工资减少，回第6段找firms pay staff less及because。\n\n> firms pay staff less because firms carry the burden of the employment arrangement going wrong\n\n公司要承担雇用关系出问题的负担，因此付给员工的钱更少。原文把这种成本与员工报酬直接连了起来。\n\nB中的salary cuts在这里对应员工承受较低报酬，不需要另加“所有在职员工已收到降薪通知”这样的细节。\n\n**制度增加的雇用负担，会不会通过较低工资落到员工身上？**\n\n会。pay staff less直接支持B所说的薪酬损失，可以保留。\n\n**第一轮判断：B保留。**","articleRects":[[273,1548,1123,38],[202,1600,1194,38],[202,1653,1194,37],[202,1705,1184,38],[202,1757,1194,38],[202,1809,383,38]],"questionRects":[[292,1705,555,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"39","paragraphPids":[5]},"html":"<h3>B. Employees suffer from salary cuts.</h3>\n<blockquote><p>员工遭受减薪</p>\n</blockquote>\n<p>把B接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使员工遭受减薪。</p>\n<p>B说员工工资减少，回第6段找firms pay staff less及because。</p>\n<blockquote><p>firms pay staff less because firms carry the burden of the employment arrangement going wrong</p>\n</blockquote>\n<p>公司要承担雇用关系出问题的负担，因此付给员工的钱更少。原文把这种成本与员工报酬直接连了起来。</p>\n<p>B中的salary cuts在这里对应员工承受较低报酬，不需要另加“所有在职员工已收到降薪通知”这样的细节。</p>\n<p><strong>制度增加的雇用负担，会不会通过较低工资落到员工身上？</strong></p>\n<p>会。pay staff less直接支持B所说的薪酬损失，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"39题","raw":"### C. Society sees a rise in overall well-being.\n\n> 社会整体福祉有所提升\n\n把C接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使社会整体福祉提升。\n\nC说整体福祉上升，回第7段看overall well-being与前面的suffers、adversely。\n\n> 原文参考：\n> \n> Society also suffers from **[xxx]** employment protections. **[xxx]** job dismissal regulations adversely affect productivity growth and hamper both **[xxx]** and overall well-being.\n> \n> 开始精读：\n> \n> Society also suffers from **[xxx]** employment protections. / **[xxx]** job dismissal regulations adversely affect productivity growth / and hamper both **[xxx]** and overall well-being.\n> \n> 社会也受到**[xxx]**就业保护的损害。 / **[xxx]**解雇规定会对生产率增长产生不利影响 / 并妨碍**[xxx]**和整体福祉。\n\n> adversely affect productivity growth and hamper both **[xxx]** and overall well-being\n\n这一段先说社会也受损，随后说解雇规定不利于生产率增长，并妨碍整体福祉。即使中间有词不认识，suffers和adversely也把坏处写出来了。\n\nC的a rise却把方向改成了提升。\n\n**作者把整体福祉放在制度的好处一侧，还是损害一侧？**\n\n在损害一侧。C与这一段的方向相反。\n\n**第一轮判断：C排除。**","articleRects":[[274,1861,1122,38],[202,1914,1194,38],[202,1966,493,38]],"questionRects":[[292,1757,641,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"39","initialReadingPids":[6],"paragraphPids":[6]},"html":"<h3>C. Society sees a rise in overall well-being.</h3>\n<blockquote><p>社会整体福祉有所提升</p>\n</blockquote>\n<p>把C接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使社会整体福祉提升。</p>\n<p>C说整体福祉上升，回第7段看overall well-being与前面的suffers、adversely。</p>\n<blockquote><p>原文参考：</p>\n<p>Society also suffers from <strong>[xxx]</strong> employment protections. <strong>[xxx]</strong> job dismissal regulations adversely affect productivity growth and hamper both <strong>[xxx]</strong> and overall well-being.</p>\n<p>开始精读：</p>\n<p>Society also suffers from <strong>[xxx]</strong> employment protections. / <strong>[xxx]</strong> job dismissal regulations adversely affect productivity growth / and hamper both <strong>[xxx]</strong> and overall well-being.</p>\n<p>社会也受到<strong>[xxx]</strong>就业保护的损害。 / <strong>[xxx]</strong>解雇规定会对生产率增长产生不利影响 / 并妨碍<strong>[xxx]</strong>和整体福祉。</p>\n</blockquote>\n<blockquote><p>adversely affect productivity growth and hamper both <strong>[xxx]</strong> and overall well-being</p>\n</blockquote>\n<p>这一段先说社会也受损，随后说解雇规定不利于生产率增长，并妨碍整体福祉。即使中间有词不认识，suffers和adversely也把坏处写出来了。</p>\n<p>C的a rise却把方向改成了提升。</p>\n<p><strong>作者把整体福祉放在制度的好处一侧，还是损害一侧？</strong></p>\n<p>在损害一侧。C与这一段的方向相反。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"39题","raw":"### D. Employers need to hire new staff.\n\n> 雇主需要招聘新员工\n\n把D接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使雇主需要招聘新员工。\n\nD说雇主需要招新员工，回第6段看more cautious about hiring。\n\n> Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff.\n\n解雇成本高，使雇主对招聘更谨慎。句子说的是企业招人时更担心风险，不是现有员工离开后必须补充人手。\n\n雇主可能因此减少或放慢招聘，不能把“谨慎招聘”改成“需要招聘”。\n\n**原文写出的是新增用人需求，还是招聘意愿受到约束？**\n\n是后者。D没有接上解雇成本造成的谨慎。\n\n**第一轮判断：D排除。**","articleRects":[[273,1548,1123,38],[202,1600,1194,38],[202,1653,1194,37],[202,1705,1184,38],[202,1757,1194,38],[202,1809,383,38]],"questionRects":[[292,1809,545,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>D. Employers need to hire new staff.</h3>\n<blockquote><p>雇主需要招聘新员工</p>\n</blockquote>\n<p>把D接回题干，它说的是：ERA中无正当理由解雇的相关程序可能使雇主需要招聘新员工。</p>\n<p>D说雇主需要招新员工，回第6段看more cautious about hiring。</p>\n<blockquote><p>Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff.</p>\n</blockquote>\n<p>解雇成本高，使雇主对招聘更谨慎。句子说的是企业招人时更担心风险，不是现有员工离开后必须补充人手。</p>\n<p>雇主可能因此减少或放慢招聘，不能把“谨慎招聘”改成“需要招聘”。</p>\n<p><strong>原文写出的是新增用人需求，还是招聘意愿受到约束？</strong></p>\n<p>是后者。D没有接上解雇成本造成的谨慎。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第39题第一次留下B。企业付给员工的工资更少直接支持收入受压低这一后果；求职更难不能改成失去已有岗位，福祉受妨碍不能改成上升，招聘更谨慎也不等于出现招聘需求。","articleRects":[],"questionRects":[[226,1600,1066,38],[292,1653,595,38],[292,1705,555,38],[292,1757,641,38],[292,1809,545,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第39题第一次留下B。企业付给员工的工资更少直接支持收入受压低这一后果；求职更难不能改成失去已有岗位，福祉受妨碍不能改成上升，招聘更谨慎也不等于出现招聘需求。</p>\n"},{"section":"40题","raw":"## 40题\n\n> It can be inferred that the “high-income threshold” in Australia ______.  \n> 可以推断，澳大利亚的“高收入门槛”会怎样？\n\n题干同时给出Australia和“high-income threshold”，两者都出现在第8段第一句。完整读最后一段，弄清这一门槛把哪些员工与哪种法律保护区分开，并看后面的新西兰尝试。\n\n> 原文参考：\n> \n> Across the Tasman Sea, Australia deals with the unjustified dismissal **[xxx]** by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal **[xxx]**. However, the mechanisms proposed were **[xxx]** and the Bill was voted down following the change in government later that year.\n> \n> 开始精读：\n> \n> Across the Tasman Sea, / Australia deals with the unjustified dismissal **[xxx]** / by excluding employees earning above a specified “high-income threshold” / from the protection of its unfair dismissal laws. / In New Zealand, / a 2016 private members’ Bill tried to permit firms and high-income employees / to contract out of the unjustified dismissal **[xxx]**. / However, the mechanisms proposed were **[xxx]** / and the Bill was voted down / following the change in government later that year.\n> \n> 在塔斯曼海的另一边， / 澳大利亚处理无正当理由解雇的**[xxx]**， / 其办法是将收入超过某一特定“高收入门槛”的员工排除出去， / 使其不受不公平解雇法的保护。 / 在新西兰， / 2016年的一项议员法案试图允许企业和高收入员工 / 通过订立合同退出无正当理由解雇的**[xxx]**。 / 然而，所提出的机制是**[xxx]**的， / 而且该法案被投票否决了， / 在那年晚些时候政府更替之后。\n\n题干要求由“高收入门槛”的具体做法作推断。先确认门槛作用于员工收入和不公平解雇法的保护范围，再判断选项有没有准确表达由此带来的作用。\n\n接下来按A—D逐项看。","articleRects":[[300,2269,1120,38],[227,2320,1194,39],[228,2372,1194,39],[226,2426,1195,38],[228,2478,1193,38],[227,2530,1193,38],[228,2583,395,38]],"questionRects":[[225,1912,1006,40],[292,1966,509,38],[581,2092,484,35],[267,2269,492,38],[267,2322,509,30],[267,2374,491,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[7],"qid":"40","initialReadingPids":[7]},"html":"<h2>40题</h2>\n<blockquote><p>It can be inferred that the “high-income threshold” in Australia ______.<br />\n可以推断，澳大利亚的“高收入门槛”会怎样？</p>\n</blockquote>\n<p>题干同时给出Australia和“high-income threshold”，两者都出现在第8段第一句。完整读最后一段，弄清这一门槛把哪些员工与哪种法律保护区分开，并看后面的新西兰尝试。</p>\n<blockquote><p>原文参考：</p>\n<p>Across the Tasman Sea, Australia deals with the unjustified dismissal <strong>[xxx]</strong> by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws. In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal <strong>[xxx]</strong>. However, the mechanisms proposed were <strong>[xxx]</strong> and the Bill was voted down following the change in government later that year.</p>\n<p>开始精读：</p>\n<p>Across the Tasman Sea, / Australia deals with the unjustified dismissal <strong>[xxx]</strong> / by excluding employees earning above a specified “high-income threshold” / from the protection of its unfair dismissal laws. / In New Zealand, / a 2016 private members’ Bill tried to permit firms and high-income employees / to contract out of the unjustified dismissal <strong>[xxx]</strong>. / However, the mechanisms proposed were <strong>[xxx]</strong> / and the Bill was voted down / following the change in government later that year.</p>\n<p>在塔斯曼海的另一边， / 澳大利亚处理无正当理由解雇的<strong>[xxx]</strong>， / 其办法是将收入超过某一特定“高收入门槛”的员工排除出去， / 使其不受不公平解雇法的保护。 / 在新西兰， / 2016年的一项议员法案试图允许企业和高收入员工 / 通过订立合同退出无正当理由解雇的<strong>[xxx]</strong>。 / 然而，所提出的机制是<strong>[xxx]</strong>的， / 而且该法案被投票否决了， / 在那年晚些时候政府更替之后。</p>\n</blockquote>\n<p>题干要求由“高收入门槛”的具体做法作推断。先确认门槛作用于员工收入和不公平解雇法的保护范围，再判断选项有没有准确表达由此带来的作用。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. has secured managers’ earnings\n\n> 已经保障了经理的收入\n\n把A接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”已经保障了经理的收入。\n\nA说保障经理收入，回末段看高收入门槛用来划分什么。\n\n> by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws\n\n超过门槛的雇员会被排除在不公平解雇法的保护之外。收入在这里是判断法律是否适用的条件。\n\n门槛并不规定公司至少支付多少，也不保证经理以后继续获得这份工资。高收入是适用条件，不是这项制度给予的保障。\n\n**按收入划定保护范围，就等于保障收入本身吗？**\n\n不等于。A把收入条件换成了收入保障。\n\n**第一轮判断：A排除。**","articleRects":[[300,2269,1120,38],[227,2320,1194,39],[228,2372,1194,39],[226,2426,1195,38],[228,2478,1193,38],[227,2530,1193,38],[228,2583,395,38]],"questionRects":[[292,1966,509,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"40","paragraphPids":[7]},"html":"<h3>A. has secured managers’ earnings</h3>\n<blockquote><p>已经保障了经理的收入</p>\n</blockquote>\n<p>把A接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”已经保障了经理的收入。</p>\n<p>A说保障经理收入，回末段看高收入门槛用来划分什么。</p>\n<blockquote><p>by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws</p>\n</blockquote>\n<p>超过门槛的雇员会被排除在不公平解雇法的保护之外。收入在这里是判断法律是否适用的条件。</p>\n<p>门槛并不规定公司至少支付多少，也不保证经理以后继续获得这份工资。高收入是适用条件，不是这项制度给予的保障。</p>\n<p><strong>按收入划定保护范围，就等于保障收入本身吗？</strong></p>\n<p>不等于。A把收入条件换成了收入保障。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"40题","raw":"### B. has produced undesired results\n\n> 已经产生了不希望出现的结果\n\n把B接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”已经产生了不希望出现的结果。\n\nB说澳大利亚制度产生坏结果，回末段分清两个国家各写了什么。\n\n> Australia deals with the unjustified dismissal **[xxx]** by excluding employees\n\n> In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees\n\n> the Bill was voted down following the change in government later that year\n\n澳大利亚通过把高收入者排除在保护外来处理问题。后面转到新西兰，说一个法案提出过类似安排，最后被否决。\n\n法案被否决发生在新西兰，不能挪成澳大利亚制度实施后的坏结果。文中也没列出澳大利亚实行门槛后的损失。\n\n**新西兰法案没通过，能不能证明澳大利亚门槛制度产生了坏结果？**\n\n不能。B把两国的不同情况接错了。\n\n**第一轮判断：B排除。**","articleRects":[[300,2269,1120,38],[227,2320,1194,39],[228,2372,1194,39],[226,2426,1195,38],[228,2478,1193,38],[227,2530,1193,38],[228,2583,395,38]],"questionRects":[[267,2269,492,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"40","paragraphPids":[7]},"html":"<h3>B. has produced undesired results</h3>\n<blockquote><p>已经产生了不希望出现的结果</p>\n</blockquote>\n<p>把B接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”已经产生了不希望出现的结果。</p>\n<p>B说澳大利亚制度产生坏结果，回末段分清两个国家各写了什么。</p>\n<blockquote><p>Australia deals with the unjustified dismissal <strong>[xxx]</strong> by excluding employees</p>\n</blockquote>\n<blockquote><p>In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees</p>\n</blockquote>\n<blockquote><p>the Bill was voted down following the change in government later that year</p>\n</blockquote>\n<p>澳大利亚通过把高收入者排除在保护外来处理问题。后面转到新西兰，说一个法案提出过类似安排，最后被否决。</p>\n<p>法案被否决发生在新西兰，不能挪成澳大利亚制度实施后的坏结果。文中也没列出澳大利亚实行门槛后的损失。</p>\n<p><strong>新西兰法案没通过，能不能证明澳大利亚门槛制度产生了坏结果？</strong></p>\n<p>不能。B把两国的不同情况接错了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"40题","raw":"### C. is beneficial to business owners\n\n> 有利于企业主\n\n把C接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”有利于企业主。\n\nC说有利于企业主，把末段的excluding接回前面企业难以解雇差经理的问题。\n\n> by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws\n\n> employment protection laws constrain business owners from dismissing underperforming managers\n\n> those laws act as a constraint on firm productivity\n\n前文的困难是高薪经理也受保护，企业即使面对表现不佳的人，也受到解雇限制。澳大利亚把收入超过门槛的人排除在这类保护之外。\n\n这就减少了企业在处理这部分雇员时受到的相应约束。C不需要说企业今后能随便开除任何人，只需这项调整有助于解决前述困难。\n\n**把高收入者排除在相应保护之外，会不会减轻企业主面对的这项限制？**\n\n会。因此C可以从前后制度安排中推出。\n\n**第一轮判断：C保留。**","articleRects":[[274,1235,1122,38],[202,1287,1194,38],[202,1339,1189,38],[202,1390,1189,39],[205,1442,1191,39],[320,1465,11,15],[202,1496,1053,38],[300,2269,1120,38],[227,2320,1194,39],[228,2372,1194,39],[226,2426,1195,38],[228,2478,1193,38],[227,2530,1193,38],[228,2583,395,38]],"questionRects":[[267,2322,509,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"40","paragraphPids":[4,7]},"html":"<h3>C. is beneficial to business owners</h3>\n<blockquote><p>有利于企业主</p>\n</blockquote>\n<p>把C接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”有利于企业主。</p>\n<p>C说有利于企业主，把末段的excluding接回前面企业难以解雇差经理的问题。</p>\n<blockquote><p>by excluding employees earning above a specified “high-income threshold” from the protection of its unfair dismissal laws</p>\n</blockquote>\n<blockquote><p>employment protection laws constrain business owners from dismissing underperforming managers</p>\n</blockquote>\n<blockquote><p>those laws act as a constraint on firm productivity</p>\n</blockquote>\n<p>前文的困难是高薪经理也受保护，企业即使面对表现不佳的人，也受到解雇限制。澳大利亚把收入超过门槛的人排除在这类保护之外。</p>\n<p>这就减少了企业在处理这部分雇员时受到的相应约束。C不需要说企业今后能随便开除任何人，只需这项调整有助于解决前述困难。</p>\n<p><strong>把高收入者排除在相应保护之外，会不会减轻企业主面对的这项限制？</strong></p>\n<p>会。因此C可以从前后制度安排中推出。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"40题","raw":"### D. is difficult to put into practice\n\n> 难以付诸实践\n\n把D接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”难以付诸实践。\n\nD说难以实行，回末段看Australia deals与后面的Bill分别指什么。\n\n> Australia deals with the unjustified dismissal **[xxx]** by excluding employees earning above a specified “high-income threshold”\n\n> In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal **[xxx]**.\n\n> the mechanisms proposed were **[xxx]** and the Bill was voted down\n\n澳大利亚已经采用门槛办法来处理问题。提议机制有问题、法案被否决，说的是后来介绍的新西兰2016年法案。\n\n即使有些描述机制的词不认识，我们也能认清In New Zealand这个换国家的标记。不能把后面的实施障碍搬到澳大利亚。\n\n**被否决的法案就是澳大利亚的高收入门槛吗？**\n\n不是。D把新西兰提案的情况错放到了澳大利亚制度上。\n\n**第一轮判断：D排除。**","articleRects":[[300,2269,1120,38],[227,2320,1194,39],[228,2372,1194,39],[226,2426,1195,38],[228,2478,1193,38],[227,2530,1193,38],[228,2583,395,38]],"questionRects":[[267,2374,491,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"40","paragraphPids":[7]},"html":"<h3>D. is difficult to put into practice</h3>\n<blockquote><p>难以付诸实践</p>\n</blockquote>\n<p>把D接回题干，它说的是：可以推断，澳大利亚的“高收入门槛”难以付诸实践。</p>\n<p>D说难以实行，回末段看Australia deals与后面的Bill分别指什么。</p>\n<blockquote><p>Australia deals with the unjustified dismissal <strong>[xxx]</strong> by excluding employees earning above a specified “high-income threshold”</p>\n</blockquote>\n<blockquote><p>In New Zealand, a 2016 private members’ Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>the mechanisms proposed were <strong>[xxx]</strong> and the Bill was voted down</p>\n</blockquote>\n<p>澳大利亚已经采用门槛办法来处理问题。提议机制有问题、法案被否决，说的是后来介绍的新西兰2016年法案。</p>\n<p>即使有些描述机制的词不认识，我们也能认清In New Zealand这个换国家的标记。不能把后面的实施障碍搬到澳大利亚。</p>\n<p><strong>被否决的法案就是澳大利亚的高收入门槛吗？</strong></p>\n<p>不是。D把新西兰提案的情况错放到了澳大利亚制度上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第40题第一次留下C。高收入员工不再受这类解雇法保护，可以缓解企业主解雇表现不佳经理的限制；收入门槛不是收入保障，澳大利亚的措施也不能承接新西兰法案被否决的结果。","articleRects":[],"questionRects":[[225,1912,1006,40],[292,1966,509,38],[581,2092,484,35],[267,2269,492,38],[267,2322,509,30],[267,2374,491,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第40题第一次留下C。高收入员工不再受这类解雇法保护，可以缓解企业主解雇表现不佳经理的限制；收入门槛不是收入保障，澳大利亚的措施也不能承接新西兰法案被否决的结果。</p>\n"},{"section":"全文梳理","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> Consequently—and **[xxx]**—laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.\n> \n> 开始精读：\n> \n> Consequently—and **[xxx]**—laws introduced to protect the jobs of ordinary workers / may be placing those jobs at risk.\n> \n> 因此——而且**[xxx]**——为保护普通工人的工作岗位而引入的法律 / 可能正在让这些岗位面临风险。","articleRects":[[274,1126,1125,46],[202,1183,754,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[4],"role":"whole_text_precision","paragraphPids":[3]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>Consequently—and <strong>[xxx]</strong>—laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.</p>\n<p>开始精读：</p>\n<p>Consequently—and <strong>[xxx]</strong>—laws introduced to protect the jobs of ordinary workers / may be placing those jobs at risk.</p>\n<p>因此——而且<strong>[xxx]</strong>——为保护普通工人的工作岗位而引入的法律 / 可能正在让这些岗位面临风险。</p>\n</blockquote>\n"},{"section":"全文梳理","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | prevent an employer from firing an employee without good cause | 用“prevent an employer from firing an employee without good cause”说明ERA个人申诉条款的基本要求：雇主不能无正当理由地解雇员工，还须说明理由并以公平方式行事。它先交代后文讨论的法律保护。 | 先交代个人申诉条款及雇主应遵守的要求。 |\n| 第2段 | guard the jobs of ordinary workers；lacked sufficient safeguards for workers | 用“guard the jobs of ordinary workers”说明这些程序最初要保护普通工人的岗位，免遭无正当理由的解雇；“lacked sufficient safeguards for workers”又交代合同普通法对工人的保护不足。这为后面检验条款的实际作用提供了原本目的。 | 说明法律原本保护普通工人的目的，为评价实际后果提供依据。 |\n| 第3段 | create difficulties for businesses；business success or failure | 以“create difficulties for businesses”转入问题：把这些条款用于高薪经理和高管会给企业制造困难。“business success or failure”把经理水平与企业成败相连，接着又联系普通工人的岗位能否保住；保护经理的条款因而可能影响原本要保护的工人。 | 转入保护高薪经理可能造成的困难，并接到企业和工人岗位。 |\n| 第4段 | may be placing those jobs at risk | 用“may be placing those jobs at risk”承接上一段的企业与岗位关系：为保护普通工人岗位而引入的法律，可能反而使这些岗位面临风险，直接点出目的与结果之间的冲突。 | 直接点明保护目的与实际后果之间的冲突。 |\n| 第5段 | a constraint on firm productivity and therefore on workers’ wages | 用“a constraint on firm productivity and therefore on workers’ wages”补充另一种损害：即使岗位没有丧失，限制解雇表现不佳的经理仍可能压制生产率，进而压低工人工资。委员会指出的“low quality of managerial capabilities”是生产率增长不佳的一个原因，为管理水平与生产率之间的联系提供了具体根据。 | 补充生产率与工资受损的后果，说明损害不只限于失去岗位。 |\n| 第6段 | employers are more cautious about hiring new staff；firms pay staff less | 用“employers are more cautious about hiring new staff”把影响推进到经理及员工自身：解雇成本更高使雇主招聘更谨慎，进而使某类经理更难获得工作；“firms pay staff less”则说明企业承担雇佣安排出问题的负担，也会让员工拿到更少工资。 | 从招聘与薪酬继续展开高解雇成本的影响。 |\n| 第7段 | Society also suffers；overall well-being | 以“Society also suffers”把损害扩大到社会，并用“adversely affect productivity growth”及“overall well-being”说明解雇规定还会妨碍生产率增长和整体福祉。这接续了企业、工人和经理三个层面的后果。 | 将前面的个体和企业后果扩大到社会层面。 |\n| 第8段 | excluding employees earning above；to contract out；the Bill was voted down | 用“excluding employees earning above”介绍澳大利亚按高收入门槛把部分员工排除在不公平解雇法保护之外的做法，回应前文高薪经理受到同样保护所带来的问题。随后“to contract out”写新西兰曾尝试允许企业和高收入员工通过合同退出相关安排，但“the Bill was voted down”说明这项提案最终被否决。 | 介绍按收入限定保护范围及合同退出的尝试，回应前面的制度问题。 |\n\n全文观点：就业保护条款原本是为了保护普通工人的岗位，但把这种保护同样用于高薪经理和高管，可能使企业难以解雇表现不佳的经理，继而损害生产率、工资、岗位和整体福祉。文章由保护目的转向实际后果，最后介绍按收入划定保护范围及允许合同退出的尝试，讨论如何处理这种保护带来的问题。","articleRects":[[273,296,1123,37],[200,346,1196,39],[202,400,1194,37],[203,452,508,38],[274,504,1122,38],[202,555,1197,39],[202,609,1194,37],[202,657,1194,45],[202,713,268,30],[274,765,1122,38],[202,817,1192,38],[202,865,1194,47],[202,922,1194,38],[202,974,1194,38],[202,1026,1195,38],[202,1078,1044,38],[274,1126,1125,46],[202,1183,754,38],[274,1235,1122,38], 个原因，为管理水平与生产率之间的联系提供了具体根据。</td><td>补充生产率与工资受损的后果，说明损害不只限于失去岗位。</td></tr><tr><td>第6段</td><td>employers are more cautious about hiring new staff；firms pay staff less</td><td>用“employers are more cautious about hiring new staff”把影响推进到经理及员工自身：解雇成本更高使雇主招聘更谨慎，进而使某类经理更难获得工作；“firms pay staff less”则说明企业承担雇佣安排出问题的负担，也会让员工拿到更少工资。</td><td>从招聘与薪酬继续展开高解雇成本的影响。</td></tr><tr><td>第7段</td><td>Society also suffers；overall well-being</td><td>以“Society also suffers”把损害扩大到社会，并用“adversely affect productivity growth”及“overall well-being”说明解雇规定还会妨碍生产率增长和整体福祉。这接续了企业、工人和经理三个层面的后果。</td><td>将前面的个体和企业后果扩大到社会层面。</td></tr><tr><td>第8段</td><td>excluding employees earning above；to contract out；the Bill was voted down</td><td>用“excluding employees earning above”介绍澳大利亚按高收入门槛把部分员工排除在不公平解雇法保护之外的做法，回应前文高薪经理受到同样保护所带来的问题。随后“to contract out”写新西兰曾尝试允许企业和高收入员工通过合同退出相关安排，但“the Bill was voted down”说明这项提案最终被否决。</td><td>介绍按收入限定保护范围及合同退出的尝试，回应前面的制度问题。</td></tr></tbody></table>\n<p>全文观点：就业保护条款原本是为了保护普通工人的岗位，但把这种保护同样用于高薪经理和高管，可能使企业难以解雇表现不佳的经理，继而损害生产率、工资、岗位和整体福祉。文章由保护目的转向实际后果，最后介绍按收入划定保护范围及允许合同退出的尝试，讨论如何处理这种保护带来的问题。</p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**36. D**\n\n**37. A**\n\n**38. D**\n\n**39. B**\n\n**40. C**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>36. D</strong></p>\n<p><strong>37. A</strong></p>\n<p><strong>38. D</strong></p>\n<p><strong>39. B</strong></p>\n<p><strong>40. C</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRrzWBQBXRUJQVlA4TK/WBQAvVwaSAs3QjSRJkiSJ6w1mcfwTXL1Tc/+BEf2fgP1/fLk/Xbs/35/zOsi373B37qNXW/tl+3a753Z3L7q7q2lppe+aU3pxdExQchaH88sXa1WqpNLHE5L0AsIdlx9/8bnVbrNt39pPlWp1VpRKKaTuBSfP8vHqrvEJ503ro6ak6jrSR+5VaklaD6Xojoc3H7/yMZXn7lQHe1sq6TOKSWnVO+5gf+qutT97aZGr0mfTU+UNM2M6Ryk+rLF60a+t9lCkj2je3OVZvnkhhYg3dbdvt7U/WPd7iYqQXSW7Vnm36g4VwnFcSsmLXNvRdnWXTtY3rRc0xtVKTBURxJsNO+4UtfmAzccXqVLddVSrqFPrJ7aj3JXuko9B9CNfV3WrHldqLbXa9dULhYqoMGp/aIffjFm5h68v94XfMO9KipOp9VSlyhvfzsckH4N3z7bdtrZV29ras/0kkj6Lnpaiqbw6Okd+fQehO
