<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| trade unionist | n.工会成员 | civil servants | 公务员 | represent | v.代表 |\n| in their prime | 处于鼎盛时期 | belong to | 属于 | public sector | 公共部门 |\n| private sector | 私营部门 | unionized | adj.加入工会的 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,123,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>trade unionist</td>\n<td>n.工会成员</td>\n<td>civil servants</td>\n<td>公务员</td>\n<td>represent</td>\n<td>v.代表</td>\n</tr>\n<tr>\n<td>in their prime</td>\n<td>处于鼎盛时期</td>\n<td>belong to</td>\n<td>属于</td>\n<td>public sector</td>\n<td>公共部门</td>\n</tr>\n<tr>\n<td>private sector</td>\n<td>私营部门</td>\n<td>unionized</td>\n<td>adj.加入工会的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| thrive | v.兴盛 | consequences | n.后果 | bright | adj.聪明的 |\n| well-educated | adj.受过良好教育的 | dominate | v.主导 | ties | n.联系 |\n| imply | v.暗示 | be associated with | 与……相关 | owe ... to | 把……归因于 |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,746,900,541],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>thrive</td>\n<td>v.兴盛</td>\n<td>consequences</td>\n<td>n.后果</td>\n<td>bright</td>\n<td>adj.聪明的</td>\n</tr>\n<tr>\n<td> hat of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[95,123,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n</section>"},{"title":"第1段","raw":"### 意群划分 · 第1段\n\nIf the trade unionist Jimmy Hoffa / were alive today, / he would probably represent / civil servants.\n\nWhen Hoffa's Teamsters / were in their prime / in 1960, / only one in ten / American government workers / belonged to a union; / now 36% do.\n\nIn 2009 / the number of unionists / in America's public sector / passed that / of their fellow members / in the private sector.\n\nIn Britain, / more than half / of public-sector workers / but only about 15% / of private-sector ones / are unionized.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[95,123,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>If ns.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,746,900,541],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>There are three reasons for the public-sector unions’ thriving. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now dominate left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n</section>"},{"title":"第2段","raw":"### 意群划分 · 第2段\n\nThere are three reasons / for the public-sector unions' thriving.\n\nFirst, / they can shut things down / without suffering much / in the way of consequences.\n\nSecond, / they are mostly bright / and well-educated.\n\nA quarter / of America's public-sector workers / have a university degree.\n\nThird, / they now dominate / left-of-centre politics.\n\nSome of their ties / go back a long way.\n\nBritain's Labor Party, / as its name implies, / has long been associated / with trade unionism.\n\nIts current leader, / Ed Miliband, / owes his position / to votes / from public-sector unions.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,746,900,541],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>There are three reasons for the public-sector unions’ thriving. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now dominate left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>There are three reasons / for the public-sector unions&#39; thriving.</p>\n<p>First, / they can shut things down / without suffering much / in the way of consequences.</p>\n<p>Second, / they are mostly bright / and well-educated.</p>\n<p>A quarter / of America&#39;s public-sector workers / have a university degree.</p>\n<p>Third, / they now dominate / left-of-centre politics.</p>\n<p>Some of their ties / go back a long way.</p>\n<p>Britain&#39;s Labor Party, / as its name implies, / has long been associated / with trade unionism.</p>\n<p>Its current leader, / Ed Miliband, / owes his position / to votes / from public-sector unions.</p>\n</section>"},{"title":"第2段","raw":"### 意群翻译 · 第2段\n\n有三个原因 / 对于公共部门工会的繁荣。\n\n第一，/ 他们可以让事情停摆 / 而不会遭受太多 / 在后果方面。\n\n第二，/ 他们大多聪明 / 且受过良好教育。\n\n四分之一 / 美国公共部门工作者的 / 拥有大学学位。\n\n第三，/ 他们现在主导 / 中左翼政治。\n\n他们的一些联系 / 可以追溯很久。\n\n英国工党，/ 正如其名称所暗示的，/ 长期以来一直与 / 工会主义相关联。\n\n其现任领导人，/ 埃德·米利班德，/ 归功于他的职位 / 于选票 / 来自公共部门工会。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,746,900,541],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</ sm).\n\nIts current leader：(Ed Miliband) → owes his position：(to votes：(from public-sector unions)).\n\n**第3段**\n\nAt the state level → their influence → can be even more fearsome.\n\nMark Baldassare：(of the Public Policy Institute of California) → points out：(that much of the state's budget → is patrolled by unions).\n\nThe teachers' unions → keep an eye on schools + the CCPOA → on prisons + a variety of labor groups → on health care.\n\n**第4段**\n\nIn many rich countries → average wages：(in the state sector) → are higher than：(in the private one).\n\nBut the real gains → come in benefits + work practices.\n\nPoliticians have repeatedly → \"backloaded\"：(public-sector pay deals) → keeping the pay increases modest // but adding to holidays + especially pensions：(that are already generous).\n\n**第5段**\n\nReform has been vigorously opposed → perhaps most notoriously：(in education)：(where charter schools + academies + merit pay → all faced drawn-out battles).\n\nEven though：(there is plenty of evidence：(that the quality of the teachers → is the most important variable)) → teachers' unions have fought：(against getting rid of bad ones + promoting good ones).\n\n**第6段**\n\nAs the cost：(to everyone else) → has become clearer → politicians have begun → to clamp down.\n\nIn Wisconsin → the unions have rallied：(thousands of supporters)：(against Scott Walker：(the hardline Republican governor)).\n\nBut many：(within the public sector) → suffer：(under the current system) → too.\n\n**第7段**\n\nJohn Donahue：(at Harvard's Kennedy School) → points out：(that the norms of culture：(in Western civil services) → suit those：(who want to stay put) // but is bad：(for high achievers)).\n\nThe only American public-sector workers：(who earn well above $250,000 a year) → are university sports coaches + the president of the United States.\n\nBankers' fat pay packets → have attracted much criticism // but a public-sector system：(that does not reward high achievers) → may be a much bigger problem：(for America).","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>If the trade unionist Jimmy Hoffa → were alive today → he would probably represent → civil servants.</p>\n<p>When Hoffa&#39;s Teamsters → were in their prime：(in 1960) → only one in ten：(American government workers) → belonged to a union; // now 36% do.</p>\n<p>In 2009 → the number of unionists：(in America&#39;s public sector) → passed that：(of their fellow members：(in the private sector)).</p>\n<p>In Britain → more than half：(of public-sector workers) // but only about 15%：(of private-sector ones) → are unionized.</p>\n<p><strong>第2段</strong></p>\n<p>There are three reasons：(for the public-sector unions&#39; thriving).</p>\n<p>First → they can shut things down：(without suffering much：(in the way of consequences)).</p>\n<p>Second → they are mostly bright + well-educated.</p>\n<p>A quarter：(of America&#39;s public-sector workers) → have a university degree.</p>\n<p>Third → they now dominate：(left-of-centre politics).</p>\n<p>Some of their ties → go back a long way.</p>\n<p>Britain&#39;s Labor Party：(as its name implies) → has long been associated：(with trade unionism).</p>\n<p>Its current leader：(Ed Miliband) → owes his position：(to votes：(from public-sector unions)).</p>\n<p><strong>第3段</strong></p>\n<p>At the state level → their influence → can be even more fearsome.</p>\n<p>Mark Baldassare：(of the Public Policy Institute of California) → points out：(that much of the state&#39;s budget → is patrolled by unions).</p>\n<p>The teachers&#39; unions → keep an eye on schools + the CCPOA → on prisons + a variety of labor groups → on health care.</p>\n<p><strong>第4段</strong></p>\n<p>In many rich countries → average wages：(in the state sector) → are higher than：(in the private one).</p>\n<p>But the real gains → come in benefits + work practices.</p>\n<p>Politicians /blockquote>\n<p>保留先让步后重点的顺序，用“但”把公共部门问题放在后面。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>银行家的丰厚薪酬已经引起了很多批评，但一个不奖励高成就者的公共部门体系可能是美国面临的更大问题。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>may保留可能性；much bigger是更大，而非唯一问题。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>银行家的丰厚薪酬已经引起了很多批评，但一个不奖励高成就者的公共部门体系可能是美国面临的更大问题。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockq 与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"36题 · 题干、题型与核心出处","raw":"## 36题\n\n> It can be learned from the first paragraph that ______.\n>\n> 从第一段可以知道什么？\n\n### 题型\n\n细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。\n\n题干指定第一段，看1960、now、2009三处数量怎样变化。\n\n### 核心出处\n\n> When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do\n>\n> If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.\n>\n> In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"36","questionIntro":true},"html":"<blockquote>\n<p>It can be learned from the first paragraph that ______.</p>\n<p>从第一段可以知道什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。</p>\n<p>题干指定第一段，看1960、now、2009三处数量怎样变化。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n"},{"title":"A. Teamsters still have a large body of members","raw":"### A. Teamsters still have a large body of members\n\n> Teamsters工会现在仍拥有庞大的会员群体。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。\n\n**出处：**\n\n> When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-A-0\"><blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n</blockquote>\n</section>"},{"title":"A. Teamsters still have a large body of members","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> Teamsters工会现在仍拥有庞大的会员群体。\n\n`still`指现在，但`Teamsters`旁边的时间是`in 1960`，后面的`now`统计的是`government workers`。\n\n先把句子里的两组人分开：`When`引出的背景是`Hoffa`的`Teamsters`，时间在1960年；`only one in ten`与`now 36%`的主语则是`American government workers`，统计政府雇员有多少加入了工会。这个`a union`也没有限定为`Teamsters`。\n\n`A`却要说明同一个具体组织“现在仍然有很多会员”，`still`还把它的过去和现在连成了持续状态。原段的时间确实前后变化了，统计对象却不是`Teamsters`的会员总量。\n\n把36%移到`Teamsters`名下，会同时换掉统计对象和比例的分母；也不能因为`Hoffa`曾领导该组织，就把后面的所有政府雇员工会都归到他名下。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-A-0\"><blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><code>still</code>指现在，但<code>Teamsters</code>旁边的时间是<code>in 1960</code>，后面的<code>now</code>统计的是<code>government workers</code>。</p>\n<p>先把句子里的两组人分开：<code>When</code>引出的背景是<code>Hoffa</code>的<code>Teamsters</code>，时间在1960年；<code>only one in ten</code>与<code>now 36%</code>的主语则是<code>American government workers</code>，统计政府雇员有多少加入了工会。这个<code>a union</code>也没有限定为<code>Teamsters</code>。</p>\n<p><code>A</code>却要说明同一个具体组织“现在仍然有很多会员”，<code>still</code>还把它的过去和现在连成了持续状态。原段的时间确实前后变化了，统计对象却不是<code>Teamsters</code>的会员总量。</p>\n<p>把36%移到<code>Teamsters</code>名下，会同时换掉统计对象和比例的分母；也不能因为<code>Hoffa</code>曾领导该组织，就把后面的所有政府雇员工会都归到他名下。</p>\n</section>"},{"title":"A. Teamsters still have a large body of members","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do\n>\n> 1960年Hoffa领导的Teamsters处于鼎盛时期，当时美国政府雇员只有十分之一加入工会；如今这一比例是36%。\n\n作者借Hoffa的假设与Teamsters的过去盛况起笔，随即把统计对象转到政府雇员，再比较公共、私营部门会员数量。文章没有继续追踪Teamsters自身今日的规模。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The Teamsters had many members in 1960 and still retain a large membership today.\n>\n> Teamsters在1960年有很多会员，今天也仍保持庞大的会员规模。\n\nA需要同一组织过去与现在的规模对照。实际是Teamsters的过去与公共部门入会情况的变化相接；时间有今昔，对象却不能随意沿用。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-A-0\"><blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><code>still</code>指现在，但<code>Teamsters</code>旁边的时间是<code>in 1960</code>，后面的<code>now</code>统计的是<code>government workers</code>。</p>\n<p>先把句子里的两组人分开：<code>When</code>引出的背景是<code>Hoffa</code>的<code>Teamsters</code>，时间在1960年；<code>only one in ten</code>与<code>now 36%</code>的主语则是<code>American government workers</code>，统计政府雇员有多少加入了工会。这个<code>a union</code>也没有限定为<code>Teamsters</code>。</p>\n<p><code>A</code>却要说明同一个具体组织“现在仍然有很多会员”，<code>still</code>还把它的过去和现在连成了持续状态。原段的时间确实前后变化了，统计对象却不是<code>Teamsters</code>的会员总量。</p>\n<p>把36%移到<code>Teamsters</code>名下，会同时换掉统计对象和比例的分母；也不能因为<code>Hoffa</code>曾领导该组织，就把后面的所有政府雇员工会都归到他名下。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>1960年Hoffa领导的Teamsters处于鼎盛时期，当时美国政府雇员只有十分之一加入工会；如今这一比例是36%。</p>\n</blockquote>\n<p>作者借Hoffa的假设与Teamsters的过去盛况起笔，随即把统计对象转到政府雇员，再比较公共、私营部门会员数量。文章没有继续追踪Teamsters自身今日的规模。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Teamsters had many members in 1960 and still retain a large membership today.</p>\n<p>Teamsters在1960年有很多会员，今天也仍保持庞大的会员规模。</p>\n</blockquote>\n<p>A需要同一组织过去与现在的规模对照。实际是Teamsters的过去与公共部门入会情况的变化相接；时间有今昔，对象却不能随意沿用。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Jimmy Hoffa used to work as a civil servant","raw":"### B. Jimmy Hoffa used to work as a civil servant\n\n> Jimmy Hoffa过去当过公务员。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。\n\n**出处：**\n\n> If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-B-0\"><blockquote>\n<p>Jimmy Hoffa过去当过公务员。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n</blockquote>\n</section>"},{"title":"B. Jimmy Hoffa used to work as a civil servant","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> Jimmy Hoffa过去当过公务员。\n\n`used to`与`If`...`were alive`...`would represent`比较，后者是假设今天他会代表谁。\n\n开头先设想`Hoffa`“如果今天还活着”，然后说他“可能会代表公务员”。`were alive`与`would probably`把这件事放在假设的今天，`represent`说明他作为工会人物替哪一群人说话。\n\n`B`的`used to`却要求把`Hoffa`过去的职业确定为公务员：时间从假设的现在变成已经发生的过去，动作又从代表他人变成自己任职。一个工会人士代表公务员，并不要求他本人先当过公务员，开头的`trade unionist`也正是在说明他的工会身份。\n\n句子的作用是借`Hoffa`会代表谁来引出会员重心的变化，不能把这种设想当成`Hoffa`的个人履历。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-B-0\"><blockquote>\n<p>Jimmy Hoffa过去当过公务员。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-B-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Jimmy Hoffa过去当过公务员。</p>\n</blockquote>\n<p><code>used to</code>与<code>If</code>...<code>were alive</code>...<code>would represent</code>比较，后者是假设今天他会代表谁。</p>\n<p>开头先设想<code>Hoffa</code>“如果今天还活着”，然后说他“可能会代表公务员”。<code>were alive</code>与<code>would probably</code>把这件事放在假设的今天，<code>represent</code>说明他作为工会人物替哪一群人说话。</p>\n<p><code>B</code>的<code>used to</code>却要求把<code>Hoffa</code>过去的职业确定为公务员：时间从假设的现在变成已经发生的过去，动作又从代表他人变成自己任职。一个工会人士代表公务员，并不要求他本人先当过公务员，开头的<code>trade unionist</code>也正是在说明他的工会身份。</p>\n<p>句子的作用是借<code>Hoffa</code>会代表谁来引出会员重心的变化，不能把这种设想当成<code>Hoffa</code>的个人履历。</p>\n</section>"},{"title":"B. Jimmy Hoffa used to work as a civil servant","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.\n>\n> 如果工会人士Jimmy Hoffa今天仍然在世，他很可能会代表公务员。\n\n开头的反事实设想用来引出工会重心转向公共部门：若昔日工会人物活到今天，他可能替另一群劳动者发声。它没有在介绍他的从业履历。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Jimmy Hoffa once held a job in the civil service.\n>\n> Jimmy Hoffa曾在政府公务部门任职。\n\nB需要过去任职的事实。原文`If ... were alive today`是假设的今天，`represent`是代表他人；两处都不能改成过去自己任职。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-opt 两种比较共同突出工会会员重心向公共部门扩大。\n\n**出处：**\n\n> When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do\n>\n> In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-C-0\"><blockquote>\n<p>工会扩大了公共部门的会员规模。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>政府雇员入会比例从十分之一升至36%，公共部门会员数又超过私营部门。作者用两种比较共同突出工会会员重心向公共部门扩大。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n</section>"},{"title":"C. unions have enlarged their public-sector membership","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 工会扩大了公共部门的会员规模。\n\n`enlarged`对应`one in ten`到`now 36%`，2009年的数量比较继续写公共部门。\n\n`C`把对象限定在工会的`public-sector membership`，正好接上本段反复比较的公共部门会员力量。1960年，十个政府雇员中只有一个入会；`now 36%` `do`中的`do`承接`belonged to a union`，说明今天政府雇员加入工会的比例明显提高。\n\n下一句继续用2009年公共部门会员数超过私营部门会员数，说明公共部门在工会中的分量已经变大。两句采用的统计方式不同：一句比较同类工作人员前后的入会比例，一句比较公共、私营部门的会员数量；不能把它们算成同一组增长率，但它们都围绕公共部门这一块展开。\n\n`C`概括的就是这种扩张，没有说所有工会总人数都增长，也没有把范围缩成`Teamsters`一家。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-op nion movement as union membership has expanded in that sector.\n>\n> 随着公共部门工会会员的发展，公共部门工作人员在工会运动中占有了更大分量。\n\nC能接住两组数据共同呈现的扩张方向。入会比例与部门间人数不能算成同一增长率，但二者都围绕公共部门会员力量展开，没有转成某一家工会或政府态度的变化。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-C-0\"><blockquote>\n<p>工会扩大了公共部门的会员规模。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>政府雇员入会比例从十分之一升至36%，公共部门会员数又超过私营部门。作者用两种比较共同突出工会会员重心向公共部门扩大。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-C-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会扩大了公共部门的会员规模。</p>\n</blockquote>\n<p><code>enlarged</code>对应<code>one in ten</code>到<code>now 36%</code>，2009年的数量比较继续写公共部门。</p>\n<p><code>C</code>把对象限定在工会的<code>public-sector membership</code>，正好接上本段反复比较的公共部门会员力量。1960年，十个政府雇员中只有一个入会；<code>now 36%</code> <code>do</code>中的<code>do</code>承接<code>belonged to a union</code>，说明今天政府雇员加入工会的比例明显提高。</p>\n<p>下一句继续用2009年公共部门会员数超过私营部门会员数，说明公共部门在工会中的分量已经变大。两句采用的统计方式不同：一句比较同类工作人员前后的入会比例，一句比较公共、私营部门的会员数量；不能把它们算成同一组增长率，但它们都围绕公共部门这一块展开。</p>\n<p><code>C</code>概括的就是这种扩张，没有说所有工会总人数都增长，也没有把范围缩成<code>Teamsters</code>一家。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n<p>1960年美国政府雇员只有十分之一入会，如今为36%。2009年，美国公共部门的工会会员数量超过了私营部门。</p>\n</blockquote>\n<p>第一段从假设Hoffa今天代表谁，走到政府雇员入会比例的今昔变化，再落到2009年公共部门会员数量超过私营部门。这些材料都在说明公共部门在工会中的分量增加。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector workers have become a larger part of the union movement as union membership has expanded in that sector.</p>\n<p>随着公共部门工会会员的发展，公共部门工作人员在工会运动中占有了更大分量。</p>\n</blockquote>\n<p>C能接住两组数据共同呈现的扩张方向。入会比例与部门间人数不能算成同一增长率，但二者都围绕公共部门会员力量展开，没有转成某一家工会或政府态度的变化。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. the government has improved its relationship with unionists","raw":"### D. the government has improved its relationship with unionists\n\n> 政府改善了与工会成员的关系。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\n政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。\n\n**出处：**\n\n> When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do\n>\n> In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-36-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-D-0\"><blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n</section>"},{"title":"D. the government has improved its relationship with unionists","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 政府改善了与工会成员的关系。\n\n`relationship`需要双方怎样相处的内容，而第一段给的是`membership`数量。\n\n`D`的主语是`the government`，动作是`has improved its relationship`，要求有政府与工会成员如何相处的前后比较。第一段的`government workers`则是一群人的职业归属，后面的`belonged to a union`说明他们是否入会；政府本身没有在这些数字里采取改善关系的行动。\n\n即使政府雇员入会比例从10%升到36%，这个变化仍只回答“多少人加入工会”，不能回答双方是更合作还是更对立。若把入会人数增加直接写成政府关系改善，就把工作人员的组织选择当成了政府的态度和行为。\n\n`D`的`improved`还多出“比以前更好”的评价，段中的`now`只让会员比例作前后比较，并没有让关系好坏作同样比较。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-36-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-D-0\"><blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><code>relationship</code>需要双方怎样相处的内容，而第一段给的是<code>membership</code>数量。</p>\n<p><code>D</code>的主语是<code>the government</code>，动作是<code>has improved its relationship</code>，要求有政府与工会成员如何相处的前后比较。第一段的<code>government workers</code>则是一群人的职业归属，后面的<code>belonged to a union</code>说明他们是否入会；政府本身没有在这些数字里采取改善关系的行动。</p>\n<p>即使政府雇员入会比例从10%升到36%，这个变化仍只回答“多少人加入工会”，不能回答双方是更合作还是更对立。若把入会人数增加直接写成政府关系改善，就把工作人员的组织选择当成了政府的态度和行为。</p>\n<p><code>D</code>的<code>improved</code>还多出“比以前更好”的评价，段中的<code>now</code>只让会员比例作前后比较，并没有让关系好坏作同样比较。</p>\n</section>"},{"title":"D. the government has improved its relationship with unionists","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do\n>\n> In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.\n>\n> 1960年美国政府雇员只有十分之一入会，如今为36%。2009年，美国公共部门的工会会员数量超过了私营部门。\n\n作者连续给出会员比例和人数，未转向政府是否更愿意合作、谈判或支持工会。政府在段中主要用于限定雇员所属部门。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The government has become more cooperative with unions, improving its relationship with their members.\n>\n> 政府与工会更加合作，改善了同工会成员的关系。\n\nD需要政府与工会相处方式的前后对照。实际的前后对照只给入会比例，雇员加入工会不能自动当作雇主改善关系的行动。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-36-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-36-option-D-0\"><blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><code>relationship</code>需要双方怎样相处的内容，而第一段给的是<code>membership</code>数量。</p>\n<p><code>D</code>的主语是<code>the government</code>，动作是<code>has improved its relationship</code>，要求有政府与工会成员如何相处的前后比较。第一段的<code>government workers</code>则是一群人的职业归属，后面的<code>belonged to a union</code>说明他们是否入会；政府本身没有在这些数字里采取改善关系的行动。</p>\n<p>即使政府雇员入会比例从10%升到36%，这个变化仍只回答“多少人加入工会”，不能回答双方是更合作还是更对立。若把入会人数增加直接写成政府关系改善，就把工作人员的组织选择当成了政府的态度和行为。</p>\n<p><code>D</code>的<code>improved</code>还多出“比以前更好”的评价，段中的<code>now</code>只让会员比例作前后比较，并没有让关系好坏作同样比较。</p>\n</section><section class=\"revealPart\" id=\"focus-question-36-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n<p>1960年美国政府雇员只有十分之一入会，如今为36%。2009年，美国公共部门的工会会员数量超过了私营部门。</p>\n</blockquote>\n<p>作者连续给出会员比例和人数，未转向政府是否更愿意合作、谈判或支持工会。政府在段中主要用于限定雇员所属部门。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The government has become more cooperative with unions, improving its relationship with their members.</p>\n<p>政府与工会更加合作，改善了同工会成员的关系。</p>\n</blockquote>\n<p>D需要政府与工会相处方式的前后对照。实际的前后对照只给入会比例，雇员加入工会不能自动当作雇主改善关系的行动。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"36题结论","raw":"### 36题结论\n\n> **36. C**\n\n- A：1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。\n- B：原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。\n- C：政府雇员入会比例从十分之一升至36%，公共部门会员数又超过私营部门。作者用两种比较共同突出工会会员重心向公共部门扩大。\n- D：政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"36","questionConclusion":true},"html":"<blockquote>\n<p><strong>36. C</strong></p>\n</blockquote>\n<ul>\n<li>A：1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。</li>\n<li>B：原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。</li>\n<li>C：政府雇员入会比例从十分之一升至36%，公共部门会员数又超过私营部门。作者用两种比较共同突出工会会员重心向公共部门扩大。</li>\n<li>D：政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。</li>\n</ul>\n"},{"title":"37题 · 题干、题型与核心出处","raw":"## 37题\n\n> Which of the following is true of Paragraph 2?\n>\n> 第二段哪一项说法正确？\n\n### 题型\n\n细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。\n\n题干指定第二段，分别看三个原因，不把成员特点当作入会条件。\n\n### 核心出处\n\n> First, they can shut things down without suffering much in the way of consequences.\n>\n> Second, they are mostly bright and well-educated.\n>\n> A quarter of America’s public-sector workers have a university degree.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"37","questionIntro":true},"html":"<blockquote>\n<p>Which of the following is true of Paragraph 2?</p>\n<p>第二段哪一项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。</p>\n<p>题干指定第二段，分别看三个原因，不把成员特点当作入会条件。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n"},{"title":"A. Public-sector unions are prudent in taking actions.","raw":"### A. Public-sector unions are prudent in taking actions.\n\n> 公共部门工会行动谨慎。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。\n\n**出处：**\n\n> First, they can shut things down without suffering much in the way of consequences.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n</section>"},{"title":"A. Public-sector unions are prudent in taking actions.","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 公共部门工会行动谨慎。\n\n`prudent`要看它们行动前是否小心；第一条实际写的是行动后不太承担`consequences`。\n\n第一条原因是公共部门工会`can shut things down`，而且`without suffering much in the way of consequences`。前半句写它们能让工作停下来，后半句写这样做所承担的后果不大。\n\n`A`的`prudent in taking actions`则评价它们采取行动时小心、克制，是行动前的判断和行为方式。后果小可能来自它们所处的地位或承担责任的安排，并不能反过来证明它们每次都谨慎选择行动。这里尤其不能把`without suffering much`理解成“因为谨慎，所以没有出事”：原句没有这个`because`关系，也没有说它们避免了停摆，反而把能停摆列为自身的优势。\n\n`A`把低代价当成慎重行事的结果，加入了原句并未建立的解释。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><code>prudent</code>要看它们行动前是否小心；第一条实际写的是行动后不太承担<code>consequences</code>。</p>\n<p>第一条原因是公共部门工会<code>can shut things down</code>，而且<code>without suffering much in the way of consequences</code>。前半句写它们能让工作停下来，后半句写这样做所承担的后果不大。</p>\n<p><code>A</code>的<code>prudent in taking actions</code>则评价它们采取行动时小心、克制，是行动前的判断和行为方式。后果小可能来自它们所处的地位或承担责任的安排，并不能反过来证明它们每次都谨慎选择行动。这里尤其不能把<code>without suffering much</code>理解成“因为谨慎，所以没有出事”：原句没有这个<code>because</code>关系，也没有说它们避免了停摆，反而把能停摆列为自身的优势。</p>\n<p><code>A</code>把低代价当成慎重行事的结果，加入了原句并未建立的解释。</p>\n</section>"},{"title":"A. Public-sector unions are prudent in taking actions.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> First, they can shut things down without suffering much in the way of consequences.\n>\n> 首先，它们可以让工作停下来，却不太因此承担不利后果。\n\n作者列出公共部门工会的有利条件，第一条就是可以使工作停下来而较少受损。这一条解释它们的处境，不是在追踪行动前的决策过程。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Public-sector unions carefully weigh the risks before deciding whether to take action.\n>\n> 公共部门工会在决定行动前，会仔细权衡风险。\n\nA需要谨慎选择行动的过程。原文只说行动之后承担的后果少，不能从结果代价小反推行动前必然小心，更不能替句子加上这个因果。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><code>prudent</code>要看它们行动前是否小心；第一条实际写的是行动后不太承担<code>consequences</code>。</p>\n<p>第一条原因是公共部门工会<code>can shut things down</code>，而且<code>without suffering much in the way of consequences</code>。前半句写它们能让工作停下来，后半句写这样做所承担的后果不大。</p>\n<p><code>A</code>的<code>prudent in taking actions</code>则评价它们采取行动时小心、克制，是行动前的判断和行为方式。后果小可能来自它们所处的地位或承担责任的安排，并不能反过来证明它们每次都谨慎选择行动。这里尤其不能把<code>without suffering much</code>理解成“因为谨慎，所以没有出事”：原句没有这个<code>because</code>关系，也没有说它们避免了停摆，反而把能停摆列为自身的优势。</p>\n<p><code>A</code>把低代价当成慎重行事的结果，加入了原句并未建立的解释。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n<p>首先，它们可以让工作停下来，却不太因此承担不利后果。</p>\n</blockquote>\n<p>作者列出公共部门工会的有利条件，第一条就是可以使工作停下来而较少受损。这一条解释它们的处境，不是在追踪行动前的决策过程。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector unions carefully weigh the risks before deciding whether to take action.</p>\n<p>公共部门工会在决定行动前，会仔细权衡风险。</p>\n</blockquote>\n<p>A需要谨慎选择行动的过程。原文只说行动之后承担的后果少，不能从结果代价小反推行动前必然小心，更不能替句子加上这个因果。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Education is required for public-sector union membership.","raw":"### B. Education is required for public-sector union membership.\n\n> 受教育是取得公共部门工会会员资格的必要条件。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n`mostly well-educated`描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。\n\n**出处：**\n\n> Second, they are mostly bright and well-educated.\n>\n> A quarter of America’s public-sector workers have a university degree.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>mostly well-educated</code>描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n</section>"},{"title":"B. Education is required for public-sector union membership.","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 受教育是取得公共部门工会会员资格的必要条件。\n\n`required`把`well-educated`读成门槛，原文却是`they are mostly`和`a quarter have`。\n\n原文第二条先说`they are mostly bright and well-educated`，再用四分之一公共部门工作人员有大学学位说明教育状况。`mostly`描述的是这群人通常具有什么特点，`a quarter`则是在数已有工作人员中有多少取得某种学历。\n\n`B`的`Education is required for`...换成“教育是某件事的必要条件”，必须先有一个准入要求，才能推出没有这种教育便不能取得相应资格。\n\n这里不能把`well-educated`直接当作`required`，也不能把大学学位的比例当作工会公布的条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>mostly well-educated</code>描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><code>required</code>把<code>well-educated</code>读成门槛，原文却是<code>they are mostly</code>和<code>a quarter have</code>。</p>\n<p>原文第二条先说<code>they are mostly bright and well-educated</code>，再用四分之一公共部门工作人员有大学学位说明教育状况。<code>mostly</code>描述的是这群人通常具有什么特点，<code>a quarter</code>则是在数已有工作人员中有多少取得某种学历。</p>\n<p><code>B</code>的<code>Education is required for</code>...换成“教育是某件事的必要条件”，必须先有一个准入要求，才能推出没有这种教育便不能取得相应资格。</p>\n<p>这里不能把<code>well-educated</code>直接当作<code>required</code>，也不能把大学学位的比例当作工会公布的条件。</p>\n</section>"},{"title":"B. Education is required for public-sector union membership.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Second, they are mostly bright and well-educated.\n>\n> A quarter of America’s public-sector workers have a university degree.\n>\n> 其次，他们大多聪明且受过良好教育。美国公共部门工作人员中有四分之一拥有大学学位。\n\n第二条原因先概括群体受教育程度，再给大学学位比例。这是在说明工会成员为什么有优势，没有接出招收会员的规定。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> A specified level of education is a condition for joining a public-sector union.\n>\n> 达到规定的受教育程度，是加入公共部门工会的条件。\n\nB需要明文或明确的准入条件，实际只有已在群体中的人具有什么学历。成员常见特点不能直接改成每个申请者都必须满足的门槛。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>mostly well-educated</code>描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><code>required</code>把<code>well-educated</code>读成门槛，原文却是<code>they are mostly</code>和<code>a quarter have</code>。</p>\n<p>原文第二条先说<code>they are mostly bright and well-educated</code>，再用四分之一公共部门工作人员有大学学位说明教育状况。<code>mostly</code>描述的是这群人通常具有什么特点，<code>a quarter</code>则是在数已有工作人员中有多少取得某种学历。</p>\n<p><code>B</code>的<code>Education is required for</code>...换成“教育是某件事的必要条件”，必须先有一个准入要求，才能推出没有这种教育便不能取得相应资格。</p>\n<p>这里不能把<code>well-educated</code>直接当作<code>required</code>，也不能把大学学位的比例当作工会公布的条件。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n<p>其次，他们大多聪明且受过良好教育。美国公共部门工作人员中有四分之一拥有大学学位。</p>\n</blockquote>\n<p>第二条原因先概括群体受教育程度，再给大学学位比例。这是在说明工会成员为什么有优势，没有接出招收会员的规定。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A specified level of education is a condition for joining a public-sector union.</p>\n<p>达到规定的受教育程度，是加入公共部门工会的条件。</p>\n</blockquote>\n<p>B需要明文或明确的准入条件，实际只有已在群体中的人具有什么学历。成员常见特点不能直接改成每个申请者都必须满足的门槛。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. Labor Party has long been fighting against public-sector unions.","raw":"### C. Labor Party has long been fighting against public-sector unions.\n\n> 工党长期反对公共部门工会。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。\n\n**出处：**\n\n> Britain’s Labor Party, as its name implies, has long been associated with trade unionism.\n>\n> Its current leader, Ed Miliband, owes his position to votes from public-sector unions.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-C-0\"><blockquote>\n<p>工党长期反对公共部门工会。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Britain’s Labor Party, as its name implies, has long been associated with trade unionism.</p>\n<p>Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n</blockquote>\n</section>"},{"title":"C. Labor Party has long been fighting against public-sector unions.","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 工党长期反对公共部门工会。\n\n`fighting against`与`has long been associated`及`owes his position`方向相反。\n\n`C`的`has long been`确实与原文`has long been`在时间上相接，但接下来要看长期保持的究竟是什么关系。原句是`Labor Party`长期与`trade unionism`有联系，紧跟着又说现任领袖`Miliband`的职位要归功于公共部门工会的选票。\n\n前一句给出长期联系，后一句给出这份联系如何具体帮助工党领袖取得职位。`C`却把长期关系写成`fighting against public-sector unions`，表示工党持续与公共部门工会对抗。这里不能因为都是政治关系就把`associated with`和`fighting against`当作同一方向；更不能越过选票支持这一句，把它读成反对。\n\n原段这一组句子的联系方向是工会支持并帮助工党政治人物，`C`说的却是长期对抗。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-C-0\"><blockquote>\n<p>工党长期反对公共部门工会。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Britain’s Labor Party, as its name implies, has long been associated with trade unionism.</p>\n<p>Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-C-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工党长期反对公共部门工会。</p>\n</blockquote>\n<p><code>fighting against</code>与<code>has long been associated</code>及<code>owes his position</code>方向相反。</p>\n<p><code>C</code>的<code>has long been</code>确实与原文<code>has long been</code>在时间上相接，但接下来要看长期保持的究竟是什么关系。原句是<code>Labor Party</code>长期与<code>trade unionism</code>有联系，紧跟着又说现任领袖<code>Miliband</code>的职位要归功于公共部门工会的选票。</p>\n<p>前一句给出长期联系，后一句给出这份联系如何具体帮助工党领袖取得职位。<code>C</code>却把长期关系写成<code>fighting against public-sector unions</code>，表示工党持续与公共部门工会对抗。这里不能因为都是政治关系就把<code>associated with</code>和<code>fighting against</code>当作同一方向；更不能越过选票支持这一句，把它读成反对。</p>\n<p>原段这一组句子的联系方向是工会支持并帮助工党政治人物，<code>C</code>说的却是长期对抗。</p>\n</section>"},{"title":"C. Labor Party has long been fighting against public-sector unions.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Britain’s Labor Party, as its name implies, has long been associated with trade unionism.\n>\n> Its current leader, Ed Miliband, owes his position to votes from public-sector unions.\n>\n> 英国工党长期与工会运动有联系。其现任领袖Ed Miliband的职位要归功于公共部门工会的选票。\n\n作者先给长期关联，再用Miliband依靠工会选票获得职位作例子。后句具体说明这种政治联系怎样发挥支持作用。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The Labour Party has long opposed public-sector unions and fought their demands.\n>\n> 工党长期反对公共部门工会，并与其诉求对抗。\n\nC需要后文把长期关系展开成反对。实际举的是工会选票帮助领袖获得职位，不能只保留`has long been`，把与它相连的关系方向倒过来。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-op
