>"},{"title":"D. Public-sector unions seldom get in trouble for their actions.","raw":"### D. Public-sector unions seldom get in trouble for their actions.\n\n> 公共部门工会很少因自己的行动陷入麻烦。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n`without suffering much ... consequences`说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。\n\n**出处：**\n\n> First, they can shut things down without suffering much in the way of consequences.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>without suffering much ... consequences</code>说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n</section>"},{"title":"D. Public-sector unions seldom get in trouble for their actions.","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 公共部门工会很少因自己的行动陷入麻烦。\n\n`seldom get in trouble`接上`without suffering much`...`consequences`，都是行动后果较轻。\n\n`D`说工会很少因自己的行动陷入麻烦，要对照第一条中行动与后果的连接来看。原文把`can shut things down`与`without suffering much`直接接在一起：它们能够让工作停摆，却不太因此承受不利后果。\n\n因此，`D`的`for their actions`正好承接“做了停摆这样的事仍不太受损”，`get in trouble`则把这些不利后果概括成麻烦。原文的`much`主要说所受后果不大，`seldom`用“很少”表达通常不容易惹上麻烦，两者并非逐字同义，但都保留了工会行动代价较低这一层。\n\n`D`也没有把它夸张成任何行为都合法、永远不会受处罚；它保留了可能有例外的余地。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>without suffering much ... consequences</code>说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><code>seldom get in trouble</code>接上<code>without suffering much</code>...<code>consequences</code>，都是行动后果较轻。</p>\n<p><code>D</code>说工会很少因自己的行动陷入麻烦，要对照第一条中行动与后果的连接来看。原文把<code>can shut things down</code>与<code>without suffering much</code>直接接在一起：它们能够让工作停摆，却不太因此承受不利后果。</p>\n<p>因此，<code>D</code>的<code>for their actions</code>正好承接“做了停摆这样的事仍不太受损”，<code>get in trouble</code>则把这些不利后果概括成麻烦。原文的<code>much</code>主要说所受后果不大，<code>seldom</code>用“很少”表达通常不容易惹上麻烦，两者并非逐字同义，但都保留了工会行动代价较低这一层。</p>\n<p><code>D</code>也没有把它夸张成任何行为都合法、永远不会受处罚；它保留了可能有例外的余地。</p>\n</section>"},{"title":"D. Public-sector unions seldom get in trouble for their actions.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> First, they can shut things down without suffering much in the way of consequences.\n>\n> 首先，它们可以让工作停下来，却不太因此承担不利后果。\n\n作者在解释公共部门工会为何有力量，先写它们能够让工作停摆，再指出这种行动不太使自身受损。行动能力与所付代价在同一句中对照。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Public-sector unions can take disruptive action while facing relatively few adverse consequences.\n>\n> 公共部门工会可以采取造成停摆的行动，却较少面对不利后果。\n\nD接住的是行动后果较轻，原句不需要另行证明工会格外谨慎。`seldom`也没有扩大成永远不受处罚，因此保留了这项概括的余地。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>without suffering much ... consequences</code>说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><code>seldom get in trouble</code>接上<code>without suffering much</code>...<code>consequences</code>，都是行动后果较轻。</p>\n<p><code>D</code>说工会很少因自己的行动陷入麻烦，要对照第一条中行动与后果的连接来看。原文把<code>can shut things down</code>与<code>without suffering much</code>直接接在一起：它们能够让工作停摆，却不太因此承受不利后果。</p>\n<p>因此，<code>D</code>的<code>for their actions</code>正好承接“做了停摆这样的事仍不太受损”，<code>get in trouble</code>则把这些不利后果概括成麻烦。原文的<code>much</code>主要说所受后果不大，<code>seldom</code>用“很少”表达通常不容易惹上麻烦，两者并非逐字同义，但都保留了工会行动代价较低这一层。</p>\n<p><code>D</code>也没有把它夸张成任何行为都合法、永远不会受处罚；它保留了可能有例外的余地。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n<p>首先，它们可以让工作停下来，却不太因此承担不利后果。</p>\n</blockquote>\n<p>作者在解释公共部门工会为何有力量，先写它们能够让工作停摆，再指出这种行动不太使自身受损。行动能力与所付代价在同一句中对照。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector unions can take disruptive action while facing relatively few adverse consequences.</p>\n<p>公共部门工会可以采取造成停摆的行动，却较少面对不利后果。</p>\n</blockquote>\n<p>D接住的是行动后果较轻，原句不需要另行证明工会格外谨慎。<code>seldom</code>也没有扩大成永远不受处罚，因此保留了这项概括的余地。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. D**\n\n- A：原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。\n- B：mostly well-educated描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。\n- C：工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。\n- D：without suffering much ... consequences说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,525,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"37","questionConclusion":true},"html":"<blockquote>\n<p><strong>37. D</strong></p>\n</blockquote>\n<ul>\n<li>A：原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。</li>\n<li>B：mostly well-educated描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。</li>\n<li>C：工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。</li>\n<li>D：without suffering much ... consequences说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> It can be learned from Paragraph 4 that the income in the state sector is ______.\n>\n> 第四段说明公共部门收入有何特点？\n\n### 题型\n\n细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。\n\n题干指定第四段，先读平均工资的比较，再看But以后福利与薪酬安排怎样展开。\n\n### 核心出处\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n>\n> But the real gains come in benefits and work practices.\n>\n> In many rich countries average wages in the state sector are higher than in the private one.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>It can be learned from Paragraph 4 that the income in the state sector is ______.</p>\n<p>第四段说明公共部门收入有何特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。</p>\n<p>题干指定第四段，先读平均工资的比较，再看But以后福利与薪酬安排怎样展开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>But the real gains come in benefits and work practices.</p>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n</blockquote>\n"},{"title":"A. illegally secured","raw":"### A. illegally secured\n\n> 公共部门收入通过非法方式获得。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。\n\n**出处：**\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section>"},{"title":"A. illegally secured","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 公共部门收入通过非法方式获得。\n\n`A`的`illegally`要求核对收入取得是否合法；回看第三句`backloaded pay deals`及其`keeping`...`but adding`...的解释，确认这个动作具体写的是薪酬怎样安排。\n\n`A`的`illegally`把收入处理的方式判为违法，要找到的应是某种取得收入的行为违反规定。原句却在解释`backloaded pay deals`怎样运作：工资涨幅保持不大，更多利益放进假期，尤其放进未来支付的养老金。\n\n这是报酬支付形式和时间的安排，不是把合法收入与非法收入相比较。引号中的`backloaded`也不是“非法”的替代说法；后面的`keeping`...`but adding`...已经用具体安排解释它，不能因一个词带引号就推成违法。养老金`already generous`说明原本待遇丰厚，评价的仍是待遇的高低，不是其法律性质。\n\n`A`把原句的工资与福利安排改写为违法取得收入，判断对象和依据均发生了变化。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><code>A</code>的<code>illegally</code>要求核对收入取得是否合法；回看第三句<code>backloaded pay deals</code>及其<code>keeping</code>...<code>but adding</code>...的解释，确认这个动作具体写的是薪酬怎样安排。</p>\n<p><code>A</code>的<code>illegally</code>把收入处理的方式判为违法，要找到的应是某种取得收入的行为违反规定。原句却在解释<code>backloaded pay deals</code>怎样运作：工资涨幅保持不大，更多利益放进假期，尤其放进未来支付的养老金。</p>\n<p>这是报酬支付形式和时间的安排，不是把合法收入与非法收入相比较。引号中的<code>backloaded</code>也不是“非法”的替代说法；后面的<code>keeping</code>...<code>but adding</code>...已经用具体安排解释它，不能因一个词带引号就推成违法。养老金<code>already generous</code>说明原本待遇丰厚，评价的仍是待遇的高低，不是其法律性质。</p>\n<p><code>A</code>把原句的工资与福利安排改写为违法取得收入，判断对象和依据均发生了变化。</p>\n</section>"},{"title":"A. illegally secured","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n>\n> 政治人物多次把公共部门薪酬协议的收益安排在后面，保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。\n\n作者从平均工资转向福利，再解释政治人物怎样把报酬增加放到假期和未来养老金中。后续展开的是支付形式与时间，并不是法律责任。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Public-sector workers obtain part of their income through practices that violate the law.\n>\n> 公共部门工作人员通过违法做法取得部分收入。\n\nA需要原文把具体做法与违法联系起来。`backloaded`后已有工资与福利的说明，它描述收益向后安排，不是非法的同义词。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><code>A</code>的<code>illegally</code>要求核对收入取得是否合法；回看第三句<code>backloaded pay deals</code>及其<code>keeping</code>...<code>but adding</code>...的解释，确认这个动作具体写的是薪酬怎样安排。</p>\n<p><code>A</code>的<code>illegally</code>把收入处理的方式判为违法，要找到的应是某种取得收入的行为违反规定。原句却在解释<code>backloaded pay deals</code>怎样运作：工资涨幅保持不大，更多利益放进假期，尤其放进未来支付的养老金。</p>\n<p>这是报酬支付形式和时间的安排，不是把合法收入与非法收入相比较。引号中的<code>backloaded</code>也不是“非法”的替代说法；后面的<code>keeping</code>...<code>but adding</code>...已经用具体安排解释它，不能因一个词带引号就推成违法。养老金<code>already generous</code>说明原本待遇丰厚，评价的仍是待遇的高低，不是其法律性质。</p>\n<p><code>A</code>把原句的工资与福利安排改写为违法取得收入，判断对象和依据均发生了变化。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>政治人物多次把公共部门薪酬协议的收益安排在后面，保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>作者从平均工资转向福利，再解释政治人物怎样把报酬增加放到假期和未来养老金中。后续展开的是支付形式与时间，并不是法律责任。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector workers obtain part of their income through practices that violate the law.</p>\n<p>公共部门工作人员通过违法做法取得部分收入。</p>\n</blockquote>\n<p>A需要原文把具体做法与违法联系起来。<code>backloaded</code>后已有工资与福利的说明，它描述收益向后安排，不是非法的同义词。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. indirectly augmented","raw":"### B. indirectly augmented\n\n> 公共部门收入间接增加。\n\n**做题模式中的状态：** 第一轮保留B，此时B尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n工资增幅不大，收益却通过假期和养老金增加。B的`indirectly`概括这种不完全体现在当期工资上的增加方式。\n\n**出处：**\n\n> But the real gains come in benefits and work practices.\n>\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>工资增幅不大，收益却通过假期和养老金增加。B的<code>indirectly</code>概括这种不完全体现在当期工资上的增加方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section>"},{"title":"B. indirectly augmented","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 公共部门收入间接增加。\n\n`indirectly`对应`pay increases modest but adding to holidays and pensions`，增量不只体现在工资。\n\n第一句的`average wages`只谈公共、私营部门平均工资谁高；第二句`But the real gains come in benefits and work practices`则转向真正的收益由哪里取得。第三句把这一转向展开：`keeping the pay increases modest`让当期工资涨幅维持在不大的程度，`but adding to holidays and especially pensions`却让雇员在假期、退休待遇方面得到更多。\n\n`backloaded`进一步说明薪酬协议把利益放在后面，尤其不是全部直接加到眼前的工资数字中。`B`的`indirectly`正概括这种增加路径：当期加薪不大，总待遇仍可通过福利提高。\n\n题干使用`income`而非单独的`cash wages`，需要把这些收益合起来理解；`B`既保留了增加，也保留了增加通过另一种报酬形式实现这一关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>工资增幅不大，收益却通过假期和养老金增加。B的<code>indirectly</code>概括这种不完全体现在当期工资上的增加方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><code>indirectly</code>对应<code>pay increases modest but adding to holidays and pensions</code>，增量不只体现在工资。</p>\n<p>第一句的<code>average wages</code>只谈公共、私营部门平均工资谁高；第二句<code>But the real gains come in benefits and work practices</code>则转向真正的收益由哪里取得。第三句把这一转向展开：<code>keeping the pay increases modest</code>让当期工资涨幅维持在不大的程度，<code>but adding to holidays and especially pensions</code>却让雇员在假期、退休待遇方面得到更多。</p>\n<p><code>backloaded</code>进一步说明薪酬协议把利益放在后面，尤其不是全部直接加到眼前的工资数字中。<code>B</code>的<code>indirectly</code>正概括这种增加路径：当期加薪不大，总待遇仍可通过福利提高。</p>\n<p>题干使用<code>income</code>而非单独的<code>cash wages</code>，需要把这些收益合起来理解；<code>B</code>既保留了增加，也保留了增加通过另一种报酬形式实现这一关系。</p>\n</section>"},{"title":"B. indirectly augmented","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But the real gains come in benefits and work practices.\n>\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n>\n> 真正的收益来自福利与工作安排。政治人物保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。\n\n段落先比较工资水平，随即用`But`说真正收益在福利和工作安排，再以小幅工资增长与更多假期、养老金作说明。后面的例子解释前面的收益来源。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Public-sector compensation rises through improved benefits and pensions even when immediate pay increases remain modest.\n>\n> 即使眼前加薪不多，公共部门总体待遇仍通过福利和养老金的改善而提高。\n\nB要求的是间接增加的路径，这条路径已由`keeping ... modest but adding ...`给出。它没有把假期都说成当期现金收入，而是在概括工资之外的待遇收益。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>工资增幅不大，收益却通过假期和养老金增加。B的<code>indirectly</code>概括这种不完全体现在当期工资上的增加方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><code>indirectly</code>对应<code>pay increases modest but adding to holidays and pensions</code>，增量不只体现在工资。</p>\n<p>第一句的<code>average wages</code>只谈公共、私营部门平均工资谁高；第二句<code>But the real gains come in benefits and work practices</code>则转向真正的收益由哪里取得。第三句把这一转向展开：<code>keeping the pay increases modest</code>让当期工资涨幅维持在不大的程度，<code>but adding to holidays and especially pensions</code>却让雇员在假期、退休待遇方面得到更多。</p>\n<p><code>backloaded</code>进一步说明薪酬协议把利益放在后面，尤其不是全部直接加到眼前的工资数字中。<code>B</code>的<code>indirectly</code>正概括这种增加路径：当期加薪不大，总待遇仍可通过福利提高。</p>\n<p>题干使用<code>income</code>而非单独的<code>cash wages</code>，需要把这些收益合起来理解；<code>B</code>既保留了增加，也保留了增加通过另一种报酬形式实现这一关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>真正的收益来自福利与工作安排。政治人物保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>段落先比较工资水平，随即用<code>But</code>说真正收益在福利和工作安排，再以小幅工资增长与更多假期、养老金作说明。后面的例子解释前面的收益来源。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector compensation rises through improved benefits and pensions even when immediate pay increases remain modest.</p>\n<p>即使眼前加薪不多，公共部门总体待遇仍通过福利和养老金的改善而提高。</p>\n</blockquote>\n<p>B要求的是间接增加的路径，这条路径已由<code>keeping ... modest but adding ...</code>给出。它没有把假期都说成当期现金收入，而是在概括工资之外的待遇收益。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. excessively increased","raw":"### C. excessively increased\n\n> 公共部门收入过度增长。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。\n\n**出处：**\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section>"},{"title":"C. excessively increased","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 公共部门收入过度增长。\n\n`excessively increased`要和`keeping the pay increases modest`比较；也要看`but adding`究竟在解释增幅，还是待遇的组成。\n\n`C`在“收入增加”之外又加上`excessively`，把增长幅度判为过度。这里要分清三个位置：平均工资`higher`说的是公共、私营部门之间的现有水平；`pay increases modest`说当期工资涨得不多；`pensions already generous`说养老金原本已经丰厚。\n\n前后两个高水平的描述都不能直接当成收入增长幅度的测量。尤其`already generous`强调原来的待遇，`C`却要评价此次或一段时期内总收入增加得是否过多，这是把现有水平换成增长幅度。段落后半确实有`adding`，但它与`keeping`...`modest`组成的是工资和福利两种收益路径的对照。\n\n因而不能简单说`C`在现实中绝不可能发生；问题在于`C`没有保留这一对照，反而把本段未作整体衡量的幅度判断当成了段落结论。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-C-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><code>excessively increased</code>要和<code>keeping the pay increases modest</code>比较；也要看<code>but adding</code>究竟在解释增幅，还是待遇的组成。</p>\n<p><code>C</code>在“收入增加”之外又加上<code>excessively</code>，把增长幅度判为过度。这里要分清三个位置：平均工资<code>higher</code>说的是公共、私营部门之间的现有水平；<code>pay increases modest</code>说当期工资涨得不多；<code>pensions already generous</code>说养老金原本已经丰厚。</p>\n<p>前后两个高水平的描述都不能直接当成收入增长幅度的测量。尤其<code>already generous</code>强调原来的待遇，<code>C</code>却要评价此次或一段时期内总收入增加得是否过多，这是把现有水平换成增长幅度。段落后半确实有<code>adding</code>，但它与<code>keeping</code>...<code>modest</code>组成的是工资和福利两种收益路径的对照。</p>\n<p>因而不能简单说<code>C</code>在现实中绝不可能发生；问题在于<code>C</code>没有保留这一对照，反而把本段未作整体衡量的幅度判断当成了段落结论。</p>\n</section>"},{"title":"C. excessively increased","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n>\n> 政治人物多次把公共部门薪酬协议的收益安排在后面，保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。\n\n作者没有列总收入增长率并据此判定过度，而是依次对照工资水平、当期增幅与福利增加。`modest`和`adding`被放在一起说明不同报酬组成。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Overall public-sector income has risen by an excessive amount.\n>\n> 公共部门的总体收入增长过多。\n\nC需要评价总体增幅过大。实际`modest`限定当期工资，`already generous`描述养老金原有水平，不能把不同指标拼成一个未经整体比较的增长幅度结论。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-C-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><code>excessively increased</code>要和<code>keeping the pay increases modest</code>比较；也要看<code>but adding</code>究竟在解释增幅，还是待遇的组成。</p>\n<p><code>C</code>在“收入增加”之外又加上<code>excessively</code>，把增长幅度判为过度。这里要分清三个位置：平均工资<code>higher</code>说的是公共、私营部门之间的现有水平；<code>pay increases modest</code>说当期工资涨得不多；<code>pensions already generous</code>说养老金原本已经丰厚。</p>\n<p>前后两个高水平的描述都不能直接当成收入增长幅度的测量。尤其<code>already generous</code>强调原来的待遇，<code>C</code>却要评价此次或一段时期内总收入增加得是否过多，这是把现有水平换成增长幅度。段落后半确实有<code>adding</code>，但它与<code>keeping</code>...<code>modest</code>组成的是工资和福利两种收益路径的对照。</p>\n<p>因而不能简单说<code>C</code>在现实中绝不可能发生；问题在于<code>C</code>没有保留这一对照，反而把本段未作整体衡量的幅度判断当成了段落结论。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>政治人物多次把公共部门薪酬协议的收益安排在后面，保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>作者没有列总收入增长率并据此判定过度，而是依次对照工资水平、当期增幅与福利增加。<code>modest</code>和<code>adding</code>被放在一起说明不同报酬组成。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Overall public-sector income has risen by an excessive amount.</p>\n<p>公共部门的总体收入增长过多。</p>\n</blockquote>\n<p>C需要评价总体增幅过大。实际<code>modest</code>限定当期工资，<code>already generous</code>描述养老金原有水平，不能把不同指标拼成一个未经整体比较的增长幅度结论。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. fairly adjusted","raw":"### D. fairly adjusted\n\n> 公共部门收入得到公平调整。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\n原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。\n\n**出处：**\n\n> In many rich countries average wages in the state sector are higher than in the private one.\n>\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section>"},{"title":"D. fairly adjusted","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 公共部门收入得到公平调整。\n\n`D`的`fairly adjusted`要求检验调整是否公平；回看平均工资比较及第三句`keeping`...`but adding`...，分清这些句子是在描述调整方式还是论证分配标准。\n\n`D`同时作了两层判断：收入经过调整，而且这种调整公平。原段确实写政治人物安排薪酬协议，分别控制工资涨幅、增加假期和养老金，因而“有调整”可以找到对应。\n\n但`fairly`要比较谁应得到多少、按什么条件分配，不能只看调整存在就给出这个评价。第一句说公共部门平均工资高于私营部门，最后又说养老金已经丰厚，段落是把工资表面增长不大与福利上继续得益放在一起说明。`D`却把这个分配方式直接评价为公平，略去了原句强调的两种报酬之间的反差。\n\n这里既不能用工资较高证明一切安排不公平，也不能用加薪幅度`modest`证明所有待遇调整公平；这两种价值结论都不是这组工资、福利对照本身的意思。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><code>D</code>的<code>fairly adjusted</code>要求检验调整是否公平；回看平均工资比较及第三句<code>keeping</code>...<code>but adding</code>...，分清这些句子是在描述调整方式还是论证分配标准。</p>\n<p><code>D</code>同时作了两层判断：收入经过调整，而且这种调整公平。原段确实写政治人物安排薪酬协议，分别控制工资涨幅、增加假期和养老金，因而“有调整”可以找到对应。</p>\n<p>但<code>fairly</code>要比较谁应得到多少、按什么条件分配，不能只看调整存在就给出这个评价。第一句说公共部门平均工资高于私营部门，最后又说养老金已经丰厚，段落是把工资表面增长不大与福利上继续得益放在一起说明。<code>D</code>却把这个分配方式直接评价为公平，略去了原句强调的两种报酬之间的反差。</p>\n<p>这里既不能用工资较高证明一切安排不公平，也不能用加薪幅度<code>modest</code>证明所有待遇调整公平；这两种价值结论都不是这组工资、福利对照本身的意思。</p>\n</section>"},{"title":"D. fairly adjusted","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In many rich countries average wages in the state sector are higher than in the private one.\n>\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n>\n> 在许多富裕国家，公共部门平均工资高于私营部门。政治人物保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。\n\n作者将公共部门工资较高与福利继续增加并列，揭示待遇收益的实际构成。没有接着论证不同群体各得其所，或这种安排按何种原则合理。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The changes in public-sector compensation distribute rewards fairly among the people concerned.\n>\n> 公共部门薪酬的调整，在相关人群之间公平分配了报酬。\n\nD需要公平分配的判断依据。实际小幅加薪并不能单独证明公平，工资较高也不能自动证明一切不公平；本段真正解释的是报酬增加的方式。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><code>D</code>的<code>fairly adjusted</code>要求检验调整是否公平；回看平均工资比较及第三句<code>keeping</code>...<code>but adding</code>...，分清这些句子是在描述调整方式还是论证分配标准。</p>\n<p><code>D</code>同时作了两层判断：收入经过调整，而且这种调整公平。原段确实写政治人物安排薪酬协议，分别控制工资涨幅、增加假期和养老金，因而“有调整”可以找到对应。</p>\n<p>但<code>fairly</code>要比较谁应得到多少、按什么条件分配，不能只看调整存在就给出这个评价。第一句说公共部门平均工资高于私营部门，最后又说养老金已经丰厚，段落是把工资表面增长不大与福利上继续得益放在一起说明。<code>D</code>却把这个分配方式直接评价为公平，略去了原句强调的两种报酬之间的反差。</p>\n<p>这里既不能用工资较高证明一切安排不公平，也不能用加薪幅度<code>modest</code>证明所有待遇调整公平；这两种价值结论都不是这组工资、福利对照本身的意思。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>在许多富裕国家，公共部门平均工资高于私营部门。政治人物保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>作者将公共部门工资较高与福利继续增加并列，揭示待遇收益的实际构成。没有接着论证不同群体各得其所，或这种安排按何种原则合理。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The changes in public-sector compensation distribute rewards fairly among the people concerned.</p>\n<p>公共部门薪酬的调整，在相关人群之间公平分配了报酬。</p>\n</blockquote>\n<p>D需要公平分配的判断依据。实际小幅加薪并不能单独证明公平，工资较高也不能自动证明一切不公平；本段真正解释的是报酬增加的方式。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. B**\n\n- A：工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。\n- B：工资增幅不大，收益却通过假期和养老金增加。B的indirectly概括这种不完全体现在当期工资上的增加方式。\n- C：公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。\n- D：原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,1215,1344,104],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. B</strong></p>\n</blockquote>\n<ul>\n<li>A：工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。</li>\n<li>B：工资增幅不大，收益却通过假期和养老金增加。B的indirectly概括这种不完全体现在当期工资上的增加方式。</li>\n<li>C：公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。</li>\n<li>D：原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> The example of the unions in Wisconsin shows that unions ______.\n>\n> Wisconsin工会的例子说明工会怎么样？\n\n### 题型\n\n例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。\n\n题干点出Wisconsin，定位第六段。段首谈政治人物开始行动，要连同上一段明确写出的改革争议一起读，才知道例子在接着说明什么。\n\n### 核心出处\n\n> Reform has been vigorously opposed\n>\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor\n>\n> Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>The example of the unions in Wisconsin shows that unions ______.</p>\n<p>Wisconsin工会的例子说明工会怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干点出Wisconsin，定位第六段。段首谈政治人物开始行动，要连同上一段明确写出的改革争议一起读，才知道例子在接着说明什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n</blockquote>\n"},{"title":"A. often run against the current political system","raw":"### A. often run against the current political system\n\n> 工会经常反对现行政治制度。\n\n**做题模式中的状态：** 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第一类——歪曲原意。**\n\n工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。\n\n**出处：**\n\n> Reform has been vigorously opposed\n>\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section>"},{"title":"A. often run against the current political system","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 工会经常反对现行政治制度。\n\n先把反对对象找准。第五段的`Reform has been vigorously opposed`明确说改革遭到抵制，第六段再写工会动员支持者`against Scott Walker`。这两处支持的是对具体改革和州长的反对。\n\nA的`current political system`却要求把对象扩大到整个现行政治制度。工会反对一位州长推行的改变，也可能正是为了维护它在既有制度中的利益，不能由反对个人或措施直接推出反对整个制度。\n\n`often`还提出经常如此的概括，本例只给一次具体动员。C不用跨出改革争议的范围，就能解释例子为何跟在改革受阻之后；A扩大的对象与频率均没有相应证据。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p>先把反对对象找准。第五段的<code>Reform has been vigorously opposed</code>明确说改革遭到抵制，第六段再写工会动员支持者<code>against Scott Walker</code>。这两处支持的是对具体改革和州长的反对。</p>\n<p>A的<code>current political system</code>却要求把对象扩大到整个现行政治制度。工会反对一位州长推行的改变，也可能正是为了维护它在既有制度中的利益，不能由反对个人或措施直接推出反对整个制度。</p>\n<p><code>often</code>还提出经常如此的概括，本例只给一次具体动员。C不用跨出改革争议的范围，就能解释例子为何跟在改革受阻之后；A扩大的对象与频率均没有相应证据。</p>\n</section>"},{"title":"A. often run against the current political system","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Reform has been vigorously opposed\n>\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor\n>\n> 改革受到强烈反对。在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。\n\n前段先说改革受到抵制，本段再写政治家开始行动、Wisconsin工会动员反对州长。这个先后是在展示改革如何遇到阻力，并未把一次对抗提升为对政治制度的普遍反对。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Unions repeatedly challenge the existing political system itself.\n>\n> 工会反复挑战现行政治制度本身。\n\nA需要把反对对象明确扩大到制度本身。实际工会也可能在维护既有待遇而反对改革，反对州长并不直接说明它反对整个政治制度；C对改革阻力的概括更贴合例子的上下文。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p>先把反对对象找准。第五段的<code>Reform has been vigorously opposed</code>明确说改革遭到抵制，第六段再写工会动员支持者<code>against Scott Walker</code>。这两处支持的是对具体改革和州长的反对。</p>\n<p>A的<code>current political system</code>却要求把对象扩大到整个现行政治制度。工会反对一位州长推行的改变，也可能正是为了维护它在既有制度中的利益，不能由反对个人或措施直接推出反对整个制度。</p>\n<p><code>often</code>还提出经常如此的概括，本例只给一次具体动员。C不用跨出改革争议的范围，就能解释例子为何跟在改革受阻之后；A扩大的对象与频率均没有相应证据。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>改革受到强烈反对。在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。</p>\n</blockquote>\n<p>前段先说改革受到抵制，本段再写政治家开始行动、Wisconsin工会动员反对州长。这个先后是在展示改革如何遇到阻力，并未把一次对抗提升为对政治制度的普遍反对。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Unions repeatedly challenge the existing political system itself.</p>\n<p>工会反复挑战现行政治制度本身。</p>\n</blockquote>\n<p>A需要把反对对象明确扩大到制度本身。实际工会也可能在维护既有待遇而反对改革，反对州长并不直接说明它反对整个政治制度；C对改革阻力的概括更贴合例子的上下文。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. can change people’s political attitudes","raw":"### B. can change people’s political attitudes\n\n> 工会能改变人们的政治态度。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n`rallied supporters`写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。\n\n**出处：**\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>工会能改变人们的政治态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>rallied supporters</code>写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section>"},{"title":"B. can change people’s political attitudes","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 工会能改变人们的政治态度。\n\n`B`的`change political attitudes`要核对人们是否改变立场；回看`rallied thousands of supporters against Scott Walker`，分清动员支持者采取行动与改变他们先前的政治观念。\n\n`B`要说明工会能改变人们的政治态度，重点在“改变”：这些人原来站在哪一边，受工会作用后又转到哪一边。原句的`rallied thousands of supporters`写工会召集、动员数千名支持者，`against Scott Walker`写这场动员所针对的人。\n\n`supporters`与`against`能够交代队伍和对抗方向，却不是支持者态度改变前后的两次记录；`rallied`强调让支持者集合采取行动，也不能直接翻成把原来反对工会的人说服了。前段先交代改革遭到反对，这个例子延续的是反对怎样表现为现实行动，而不是解释人们怎样改变政治信念。\n\n`B`把动员已经称作`supporters`的人，改成了改变他们的政治态度；行动规模和观念变化不是这句话交代的同一件事。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>工会能改变人们的政治态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>rallied supporters</code>写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-B-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会能改变人们的政治态度。</p>\n</blockquote>\n<p><code>B</code>的<code>change political attitudes</code>要核对人们是否改变立场；回看<code>rallied thousands of supporters against Scott Walker</code>，分清动员支持者采取行动与改变他们先前的政治观念。</p>\n<p><code>B</code>要说明工会能改变人们的政治态度，重点在“改变”：这些人原来站在哪一边，受工会作用后又转到哪一边。原句的<code>rallied thousands of supporters</code>写工会召集、动员数千名支持者，<code>against Scott Walker</code>写这场动员所针对的人。</p>\n<p><code>supporters</code>与<code>against</code>能够交代队伍和对抗方向，却不是支持者态度改变前后的两次记录；<code>rallied</code>强调让支持者集合采取行动，也不能直接翻成把原来反对工会的人说服了。前段先交代改革遭到反对，这个例子延续的是反对怎样表现为现实行动，而不是解释人们怎样改变政治信念。</p>\n<p><code>B</code>把动员已经称作<code>supporters</code>的人，改成了改变他们的政治态度；行动规模和观念变化不是这句话交代的同一件事。</p>\n</section>"},{"title":"B. can change people’s political attitudes","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor\n>\n> 在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。\n\n政治人物开始整顿之后，工会召集支持者对抗，例子的作用是把阻力写成具体行动。支持者的数量说明动员规模，不记录他们原来持什么观点。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The unions persuaded people to change their political views.\n>\n> 工会说服人们改变了政治观点。\n\nB需要一次态度转变。实际这些人已被称为`supporters`，句子只说他们被动员起来；集合采取行动不能自动当作原有观点被改变。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>工会能改变人们的政治态度。</p>\n</bl 最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。\n\n**出处：**\n\n> Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles\n>\n> As the cost to everyone else has become clearer, politicians have begun to clamp down\n>\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section>"},{"title":"C. may be a barrier to public-sector reforms","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 工会可能阻碍公共部门改革。\n\n`barrier to public-sector reforms`要核对两部分：这里有没有公共部门改革，工会有没有形成阻力。第五段先明确说`Reform has been vigorously opposed`，并举教育改革长期争斗的情况。\n\n第六段接着写代价越来越清楚，政治家`have begun to clamp down`；Wisconsin的工会随即动员支持者反对强硬州长。这就把改革措施与阻碍它推进的组织行动接在了一起。\n\nC说`may be a barrier`，没有宣称所有改革都会失败，也没有说工会掌握了政府控制权。它用与上下文相同的改革范围概括例子，既说明了行动内容，也回答了举例要支持什么。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><code>barrier to public-sector reforms</code>要核对两部分：这里有没有公共部门改革，工会有没有形成阻力。第五段先明确说<code>Reform has been vigorously opposed</code>，并举教育改革长期争斗的情况。</p>\n<p>第六段接着写代价越来越清楚，政治家<code>have begun to clamp down</code>；Wisconsin的工会随即动员支持者反对强硬州长。这就把改革措施与阻碍它推进的组织行动接在了一起。</p>\n<p>C说<code>may be a barrier</code>，没有宣称所有改革都会失败，也没有说工会掌握了政府控制权。它用与上下文相同的改革范围概括例子，既说明了行动内容，也回答了举例要支持什么。</p>\n</section>"},{"title":"C. may be a barrier to public-sector reforms","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles\n>\n> As the cost to everyone else has become clearer, politicians have begun to clamp down\n>\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor\n>\n> 改革受到强烈反对，尤其在教育领域，特许学校、学院和绩效工资都经历长期争斗。其他人承担的代价渐趋明显后，政治人物开始整顿。在Wisconsin，工会动员了数千名支持者反对州长Scott Walker。\n\n作者从教育改革经历长期争斗，写到代价渐明、政治人物开始整顿，再用Wisconsin的抗议表现工会的回应。例子在具体展示改革推进时会碰到什么阻力。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> When politicians try to reform the public sector, union mobilisation can create obstacles to those changes.\n>\n> 政治人物试图改革公共部门时，工会的动员可能为这些改变设置障碍。\n\nC所需的改革背景与阻碍行动分别由前段和这个例子提供。`may be a barrier`只说明可能形成阻力，没有说工会控制政府或所有改革必然失败，因此范围合适。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><code>barrier to public-sector reforms</code>要核对两部分：这里有没有公共部门改革，工会有没有形成阻力。第五段先明确说<code>Reform has been vigorously opposed</code>，并举教育改革长期争斗的情况。</p>\n<p>第六段接着写代价越来越清楚，政治家<code>have begun to clamp down</code>；Wisconsin的工会随即动员支持者反对强硬州长。这就把改革措施与阻碍它推进的组织行动接在了一起。</p>\n<p>C说<code>may be a barrier</code>，没有宣称所有改革都会失败，也没有说工会掌握了政府控制权。它用与上下文相同的改革范围概括例子，既说明了行动内容，也回答了举例要支持什么。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>改革受到强烈反对，尤其在教育领域，特许学校、学院和绩效工资都经历长期争斗。其他人承担的代价渐趋明显后，政治人物开始整顿。在Wisconsin，工会动员了数千名支持者反对州长Scott Walker。</p>\n</blockquote>\n<p>作者从教育改革经历长期争斗，写到代价渐明、政治人物开始整顿，再用Wisconsin的抗议表现工会的回应。例子在具体展示改革推进时会碰到什么阻力。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>When politicians try to reform the public sector, union mobilisation can create obstacles to those changes.</p>\n<p>政治人物试图改革公共部门时，工会的动员可能为这些改变设置障碍。</p>\n</blockquote>\n<p>C所需的改革背景与阻碍行动分别由前段和这个例子提供。<code>may be a barrier</code>只说明可能形成阻力，没有说工会控制政府或所有改革必然失败，因此范围合适。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. are dominant in the government","raw":"### D. are dominant in the government\n\n> 工会在政府中占统治地位。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。\n\n**出处：**\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section>"},{"title":"D. are dominant in the government","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> 工会在政府中占统治地位。\n\n`D`要证明工会在政府中具有支配地位；第六段实际写的是工会方面的支持者与州长发生对抗。\n\n`D`把工会的地位定为`dominant in the government`，要求它们在政府内部处于支配位置，能够主导政府方向。`Wisconsin`一句中的政府人物是州长`Scott Walker`，工会和数千名支持者则站在`against`他的这一边；这幅关系是双方正在对抗，不能直接读成工会已经占据政府主导地位。\n\n支持者很多可以说明工会能够施加压力，但“能对州长施压”与“在政府中有支配地位”之间还差着谁掌握决策这一层。前句还写政治人物因其他人承担的代价开始采取行动，例子呈现的是这些行动遇到的反对，而不是政府已按工会意愿作出决定。\n\n把反对声势直接当成政府控制权，会把政府外部或对面的施压换成政府内部的统治地位。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><code>D</code>要证明工会在政府中具有支配地位；第六段实际写的是工会方面的支持者与州长发生对抗。</p>\n<p><code>D</code>把工会的地位定为<code>dominant in the government</code>，要求它们在政府内部处于支配位置，能够主导政府方向。<code>Wisconsin</code>一句中的政府人物是州长<code>Scott Walker</code>，工会和数千名支持者则站在<code>against</code>他的这一边；这幅关系是双方正在对抗，不能直接读成工会已经占据政府主导地位。</p>\n<p>支持者很多可以说明工会能够施加压力，但“能对州长施压”与“在政府中有支配地位”之间还差着谁掌握决策这一层。前句还写政治人物因其他人承担的代价开始采取行动，例子呈现的是这些行动遇到的反对，而不是政府已按工会意愿作出决定。</p>\n<p>把反对声势直接当成政府控制权，会把政府外部或对面的施压换成政府内部的统治地位。</p>\n</section>"},{"title":"D. are dominant in the government","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor\n>\n> 在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。\n\n政治人物开始采取行动，工会则组织反对。作者写双方冲突，没有接出州长服从工会或政府政策由工会决定的结果。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The unions control the government’s decisions and set its policy direction.\n>\n> 工会控制政府决策，决定其政策方向。\n\nD需要政府中的支配地位，仅有支持者数量与反对行动还不够。能向决策者施压，与已经代替决策者控制政府，是不同关系。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><code>D</code>要证明工会在政府中具有支配地位；第六段实际写的是工会方面的支持者与州长发生对抗。</p>\n<p><code>D</code>把工会的地位定为<code>dominant in the government</code>，要求它们在政府内部处于支配位置，能够主导政府方向。<code>Wisconsin</code>一句中的政府人物是州长<code>Scott Walker</code>，工会和数千名支持者则站在<code>against</code>他的这一边；这幅关系是双方正在对抗，不能直接读成工会已经占据政府主导地位。</p>\n<p>支持者很多可以说明工会能够施加压力，但“能对州长施压”与“在政府中有支配地位”之间还差着谁掌握决策这一层。前句还写政治人物因其他人承担的代价开始采取行动，例子呈现的是这些行动遇到的反对，而不是政府已按工会意愿作出决定。</p>\n<p>把反对声势直接当成政府控制权，会把政府外部或对面的施压换成政府内部的统治地位。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。</p>\n</blockquote>\n<p>政治人物开始采取行动，工会则组织反对。作者写双方冲突，没有接出州长服从工会或政府政策由工会决定的结果。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The unions control the government’s decisions and set its policy direction.</p>\n<p>工会控制政府决策，决定其政策方向。</p>\n</blockquote>\n<p>D需要政府中的支配地位，仅有支持者数量与反对行动还不够。能向决策者施压，与已经代替决策者控制政府，是不同关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. C**\n\n- A：工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。\n- B：rallied supporters写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。\n- C：前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。\n- D：组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1319,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"39","questionConclusion":true},"html":"<blockquote>\n<p><strong>39. C</strong></p>\n</blockquote>\n<ul>\n<li>A：工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。</li>\n<li>B：rallied supporters写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。</li>\n<li>C：前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。</li>\n<li>D：组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。</li>\n</ul>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n> John Donahue’s attitude towards the public-sector system is one of ______.\n>\n> John Donahue对公共部门制度是什么态度？\n\n### 题型\n\n态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。\n\n题干点名John Donahue，直接看末段他指出制度适合谁、对谁不利。\n\n### 核心出处\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"40","questionIntro":true},"html":"<blockquote>\n<p>John Donahue’s attitude towards the public-sector system is one of ______.</p>\n<p>John Donahue对公共部门制度是什么态度？</p>\n</blockquote>\n<h3>题型</h3>\n<p>态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。</p>\n<p>题干点名John Donahue，直接看末段他指出制度适合谁、对谁不利。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n"},{"title":"A. disapproval","raw":"### A. disapproval\n\n> Donahue不赞同这种制度。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nDonahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。\n\n**出处：**\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section>"},{"title":"A. disapproval","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> Donahue不赞同这种制度。\n\n`disapproval`对应`bad for high achievers`，评价落在优秀人才得不到合适回报。\n\n题干问的是`Donahue`对公共部门制度的态度，不能把末段每一句都算成他本人说的话。直接属于`points out`的内容先说，这种公务员文化适合想`stay put`的人；`but`随即转向它对`high achievers`有害。\n\n这里的对照并非平列两个同样值得认可的优点，而是把安于现状者能够适应与表现突出者反而吃亏放在一起，指出激励上的倒置。`A`的`disapproval`只要求看出他不认可这项制度安排，不要求他把公共部门的一切都全盘否定。\n\n`bad for`已经给出了负面的评价，`but`又说明“适合想原地不动的人”不是最后的赞扬结论。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><code>disapproval</code>对应<code>bad for high achievers</code>，评价落在优秀人才得不到合适回报。</p>\n<p>题干问的是<code>Donahue</code>对公共部门制度的态度，不能把末段每一句都算成他本人说的话。直接属于<code>points out</code>的内容先说，这种公务员文化适合想<code>stay put</code>的人；<code>but</code>随即转向它对<code>high achievers</code>有害。</p>\n<p>这里的对照并非平列两个同样值得认可的优点，而是把安于现状者能够适应与表现突出者反而吃亏放在一起，指出激励上的倒置。<code>A</code>的<code>disapproval</code>只要求看出他不认可这项制度安排，不要求他把公共部门的一切都全盘否定。</p>\n<p><code>bad for</code>已经给出了负面的评价，<code>but</code>又说明“适合想原地不动的人”不是最后的赞扬结论。</p>\n</section>"},{"title":"A. disapproval","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.\n>\n> Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。\n\nDonahue先说明哪类人适应这种文化，再用`but`落到高成就者吃亏。对照揭示制度怎样对待不同表现的人，负面评价是这一句的收束。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The system is unsatisfactory because it accommodates those who stay put while disadvantaging high achievers.\n>\n> 这套制度令人不满，因为它适合安于现状者，却使高成就者处于不利地位。\n\nA只要求不认可当前安排，不需要Donahue谴责全部公共部门。`bad for high achievers`已经提供具体批评，前半句的`suit`也没有将这份批评变成赞美。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><code>disapproval</code>对应<code>bad for high achievers</code>，评价落在优秀人才得不到合适回报。</p>\n<p>题干问的是<code>Donahue</code>对公共部门制度的态度，不能把末段每一句都算成他本人说的话。直接属于<code>points out</code>的内容先说，这种公务员文化适合想<code>stay put</code>的人；<code>but</code>随即转向它对<code>high achievers</code>有害。</p>\n<p>这里的对照并非平列两个同样值得认可的优点，而是把安于现状者能够适应与表现突出者反而吃亏放在一起，指出激励上的倒置。<code>A</code>的<code>disapproval</code>只要求看出他不认可这项制度安排，不要求他把公共部门的一切都全盘否定。</p>\n<p><code>bad for</code>已经给出了负面的评价，<code>but</code>又说明“适合想原地不动的人”不是最后的赞扬结论。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>Donahue先说明哪类人适应这种文化，再用<code>but</code>落到高成就者吃亏。对照揭示制度怎样对待不同表现的人，负面评价是这一句的收束。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The system is unsatisfactory because it accommodates those who stay put while disadvantaging high achievers.</p>\n<p>这套制度令人不满，因为它适合安于现状者，却使高成就者处于不利地位。</p>\n</blockquote>\n<p>A只要求不认可当前安排，不需要Donahue谴责全部公共部门。<code>bad for high achievers</code>已经提供具体批评，前半句的<code>suit</code>也没有将这份批评变成赞美。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. appreciation","raw":"### B. appreciation\n\n> Donahue欣赏这种制度。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n`suit`只说制度适合某类人，不等于Donahue欣赏制度。后面的`but ... bad for high achievers`给出了相反的整体评价方向。\n\n**出处：**\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>Donahue欣赏这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</st
