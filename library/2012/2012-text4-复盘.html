hievers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue容忍这种制度。</p>\n</blockquote>\n<p><code>tolerance</code>需要“虽有问题仍接受”的意思；原句只有明确指出<code>suit</code>与<code>bad</code>的分配问题。</p>\n<p><code>tolerance</code>不是“语气没有很激烈”，而是在面对不理想的事物时仍表示接受或容许。<code>Donahue</code>这句话没有在<code>bad for high achievers</code>之后转向“尽管如此仍可以接受”，而是用<code>but</code>从“适合安于现状者”推进到“对高成就者有害”。</p>\n<p>因此，他实际呈现出来的态度动作是指出制度的缺陷，<code>C</code>却要求把这份批评继续推进成他愿意接受这种安排。不能因为他没有使用愤怒的词，就把明确的不利评价降成容忍；态度的判断要看他评价什么，而不是看语气是否激烈。</p>\n<p>这里的<code>suit</code>也不是他向制度作出的让步，它只交代哪类人适应这种制度，后半句仍在指出它不合理的结果。</p>\n</section>"},{"title":"C. tolerance","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.\n>\n> Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。\n\n句子由适合安于现状者转到对高成就者不利，结束在制度缺陷上，并未再转向保留制度的理由或对缺点的接纳。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Although the system disadvantages high achievers, Donahue is willing to accept it.\n>\n> 尽管这套制度使高成就者吃亏，Donahue仍愿意接受它。\n\nC需要后半层“仍可接受”的态度。原文只有负面评价，语气不激烈也不等于容忍，不能替说话人添上尚未表达的接受。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>Donahue容忍这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>容忍需要在承认问题后仍表示接受。Donahue的句子直接指出对高成就者不利，没有给出仍愿意接受这种安排的态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue容忍这种制度。</p>\n</blockquote>\n<p><code>tolerance</code>需要“虽有问题仍接受”的意思；原句只有明确指出<code>suit</code>与<code>bad</code>的分配问题。</p>\n<p><code>tolerance</code>不是“语气没有很激烈”，而是在面对不理想的事物时仍表示接受或容许。<code>Donahue</code>这句话没有在<code>bad for high achievers</code>之后转向“尽管如此仍可以接受”，而是用<code>but</code>从“适合安于现状者”推进到“对高成就者有害”。</p>\n<p>因此，他实际呈现出来的态度动作是指出制度的缺陷，<code>C</code>却要求把这份批评继续推进成他愿意接受这种安排。不能因为他没有使用愤怒的词，就把明确的不利评价降成容忍；态度的判断要看他评价什么，而不是看语气是否激烈。</p>\n<p>这里的<code>suit</code>也不是他向制度作出的让步，它只交代哪类人适应这种制度，后半句仍在指出它不合理的结果。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>句子由适合安于现状者转到对高成就者不利，结束在制度缺陷上，并未再转向保留制度的理由或对缺点的接纳。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Although the system disadvantages high achievers, Donahue is willing to accept it.</p>\n<p>尽管这套制度使高成就者吃亏，Donahue仍愿意接受它。</p>\n</blockquote>\n<p>C需要后半层“仍可接受”的态度。原文只有负面评价，语气不激烈也不等于容忍，不能替说话人添上尚未表达的接受。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. indifference","raw":"### D. indifference\n\n> Donahue对这种制度漠不关心。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\nDonahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。\n\n**出处：**\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section>"},{"title":"D. indifference","raw":"#### 定位比对法\n\n把选项接回题干，完整命题是：\n\n> Donahue对这种制度漠不关心。\n\n`indifference`与`points out`后面具体评价`bad for high achievers`冲突。\n\n`D`的`indifference`表示对这套制度漠不关心，不在意它造成怎样的影响。`Donahue`却专门把制度对两类人的作用拆开说：一类人想`stay put`，另一类是`high achievers`，而且他用`bad`判断后一类人受到的不利影响。\n\n这不只是中性地报告“人各有不同”，而是在对制度的激励效果作出明确评价。`points out`本身可以只是指出一个事实，所以不能单靠“他开口说了话”就断定他关心；真正让`D`不合适的是他接着指出哪类人吃亏，并把这种影响判为`bad`。\n\n评价已有对象和方向，`D`却把这份明确的负面判断抹成不关心好坏。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><code>indifference</code>与<code>points out</code>后面具体评价<code>bad for high achievers</code>冲突。</p>\n<p><code>D</code>的<code>indifference</code>表示对这套制度漠不关心，不在意它造成怎样的影响。<code>Donahue</code>却专门把制度对两类人的作用拆开说：一类人想<code>stay put</code>，另一类是<code>high achievers</code>，而且他用<code>bad</code>判断后一类人受到的不利影响。</p>\n<p>这不只是中性地报告“人各有不同”，而是在对制度的激励效果作出明确评价。<code>points out</code>本身可以只是指出一个事实，所以不能单靠“他开口说了话”就断定他关心；真正让<code>D</code>不合适的是他接着指出哪类人吃亏，并把这种影响判为<code>bad</code>。</p>\n<p>评价已有对象和方向，<code>D</code>却把这份明确的负面判断抹成不关心好坏。</p>\n</section>"},{"title":"D. indifference","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.\n>\n> Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。\n\n他比较两类人在制度中的处境，并用`bad`评价高成就者受到的待遇。重点是制度产生的不利影响，而非不带倾向地列出群体差别。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Donahue shows no concern about how the system treats different kinds of employees.\n>\n> Donahue并不关心这套制度怎样对待不同类型的雇员。\n\nD需要不在意这些后果的态度。不能只因为他说了话就断定关心，但这里真正的依据是他把对优秀者的影响明确判为不利，这与漠不关心不相符。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><code>indifference</code>与<code>points out</code>后面具体评价<code>bad for high achievers</code>冲突。</p>\n<p><code>D</code>的<code>indifference</code>表示对这套制度漠不关心，不在意它造成怎样的影响。<code>Donahue</code>却专门把制度对两类人的作用拆开说：一类人想<code>stay put</code>，另一类是<code>high achievers</code>，而且他用<code>bad</code>判断后一类人受到的不利影响。</p>\n<p>这不只是中性地报告“人各有不同”，而是在对制度的激励效果作出明确评价。<code>points out</code>本身可以只是指出一个事实，所以不能单靠“他开口说了话”就断定他关心；真正让<code>D</code>不合适的是他接着指出哪类人吃亏，并把这种影响判为<code>bad</code>。</p>\n<p>评价已有对象和方向，<code>D</code>却把这份明确的负面判断抹成不关心好坏。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>他比较两类人在制度中的处境，并用<code>bad</code>评价高成就者受到的待遇。重点是制度产生的不利影响，而非不带倾向地列出群体差别。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Donahue shows no concern about how the system treats different kinds of employees.</p>\n<p>Donahue并不关心这套制度怎样对待不同类型的雇员。</p>\n</blockquote>\n<p>D需要不在意这些后果的态度。不能只因为他说了话就断定关心，但这里真正的依据是他把对优秀者的影响明确判为不利，这与漠不关心不相符。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. A**\n\n- A：Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。\n- B：suit只说制度适合某类人，不等于Donahue欣赏制度。后面的but ... bad for high achievers给出了相反的整体评价方向。\n- C：容忍需要在承认问题后仍表示接受。Donahue的句子直接指出对高成就者不利，没有给出仍愿意接受这种安排的态度。\n- D：Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1686,1344,391],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. A</strong></p>\n</blockquote>\n<ul>\n<li>A：Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。</li>\n<li>B：suit只说制度适合某类人，不等于Donahue欣赏制度。后面的but ... bad for high achievers给出了相反的整体评价方向。</li>\n<li>C：容忍需要在承认问题后仍表示接受。Donahue的句子直接指出对高成就者不利，没有给出仍愿意接受这种安排的态度。</li>\n<li>D：Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：公共部门工会的兴起**（段落1背景介绍） 历史对比：【1960年霍法时代：只有10%政府工作者属于工会 // 现在：36%属于工会】→ 2009年转折点：公共部门工会成员超过私营部门 → 英国情况：（公共部门50%+ // 私营部门15%）\n\n↓（原因分析）\n\n**逻辑层次2：公共部门工会繁荣的三大原因**（段落2-3原因剖析） 三大原因：【1.可以让事情停摆而不受惩罚 + 2.成员聪明且受过良好教育（25%有大学学位）+ 3.主导中左翼政治（如英国工党）】→ 州层面影响力更大：（控制州预算的各个领域：教育、监狱、医疗）\n\n↓（具体表现）\n\n**逻辑层次3：公共部门的薪酬优势**（段落4薪酬分析） 表面现象：公共部门平均工资高于私营部门 → 真正优势：【福利和工作实践：政客\"后置加载\"薪酬协议（工资增长适度 // 但假期和养老金大幅增加）】\n\n↓（负面影响）\n\n**逻辑层次4：工会对改革的阻碍**（段落5-6改革困境） 改革阻力：【教育领域最严重：（特许学校、学院、绩效工资都遭反对）→ 教师工会反对优胜劣汰】→ 政治反击：（成本明确后政客开始限制）→ 威斯康星州案例：（工会集结反对共和党州长）// 但公共部门内部也有受害者\n\n↓（深层问题）\n\n**逻辑层次5：体系的根本缺陷**（段落7问题本质） 文化问题：西方公务员体系适合安于现状者 // 不利于高成就者 → 薪酬上限：只有大学体育教练和总统年薪超25万 → 核心观点：【银行家高薪受批评 // 但不奖励高成就者的公共部门体系是更大问题】\n\n↑（全文主旨）\n\n全文核心观点：公共部门工会虽然发展迅速并获得诸多优势，但其对改革的阻碍和不利于高成就者的体系文化，可能对国家发展构成更大的问题。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：公共部门工会的兴起</strong>（段落1背景介绍） 历史对比：【1960年霍法时代：只有10%政府工作者属于工会 // 现在：36%属于工会】→ 2009年转折点：公共部门工会成员超过私营部门 → 英国情况：（公共部门50%+ // 私营部门15%）</p>\n<p>↓（原因分析）</p>\n<p><strong>逻辑层次2：公共部门工会繁荣的三大原因</strong>（段落2-3原因剖析） 三大原因：【1.可以让事情停摆而不受惩罚 + 2.成员聪明且受过良好教育（25%有大学学位）+ 3.主导中左翼政治（如英国工党）】→ 州层面影响力更大：（控制州预算的各个领域：教育、监狱、医疗）</p>\n<p>↓（具体表现）</p>\n<p><strong>逻辑层次3：公共部门的薪酬优势</strong>（段落4薪酬分析） 表面现象：公共部门平均工资高于私营部门 → 真正优势：【福利和工作实践：政客&quot;后置加载&quot;薪酬协议（工资增长适度 // 但假期和养老金大幅增加）】</p>\n<p>↓（负面影响）</p>\n<p><strong>逻辑层次4：工会对改革的阻碍</strong>（段落5-6改革困境） 改革阻力：【教育领域最严重：（特许学校、学院、绩效工资都遭反对）→ 教师工会反对优胜劣汰】→ 政治反击：（成本明确后政客开始限制）→ 威斯康星州案例：（工会集结反对共和党州长）// 但公共部门内部也有受害者</p>\n<p>↓（深层问题）</p>\n<p><strong>逻辑层次5：体系的根本缺陷</strong>（段落7问题本质） 文化问题：西方公务员体系适合安于现状者 // 不利于高成就者 → 薪酬上限：只有大学体育教练和总统年薪超25万 → 核心观点：【银行家高薪受批评 // 但不奖励高成就者的公共部门体系是更大问题】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：公共部门工会虽然发展迅速并获得诸多优势，但其对改革的阻碍和不利于高成就者的体系文化，可能对国家发展构成更大的问题。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】A. The rising share of public-sector union members\n\n> 公共部门工会成员比例上升\n\n先比较1960年与现在的公共部门入会比例，再比较公私部门人数与英国状况。\n\n> If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.\n\nHoffa当年代表私营部门卡车司机，假设他今天代表公务员，是用同一个工会人物衬出会员重心的变化，并不是写他的真实新工作。\n\n> In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector.\n\n`passed`把这种变化落实为人数上的超过：公共部门会员已多于私营部门会员。它继续说明会员构成，而没有转到政治联系。\n\n> In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.\n\n英国的`more than half`与`only about 15%`把同一公私部门差异放到另一国家中检验。因此标题要覆盖公共部门工会扩大的地位。\n\n这一部分的推进关系是：\n\n> 历史人物的假设对照 → 美国公共部门会员比例增长且人数反超 → 英国公私部门比例对比\n\nrising share概括由十分之一到36%的增长，public-sector明确增长属于哪一部门。\n\n再看最强干扰项G：The disappearance of political connections。\n\n首段呈现会员构成变化，并没有政治联系消失的信息。\n\n**41题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】A. The rising share of public-sector union members</p>\n<blockquote>\n<p>公共部门工会成员比例上升</p>\n</blockquote>\n<p>先比较1960年与现在的公共部门入会比例，再比较公私部门人数与英国状况。</p>\n<blockquote>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n</blockquote>\n<p>Hoffa当年代表私营部门卡车司机，假设他今天代表公务员，是用同一个工会人物衬出会员重心的变化，并不是写他的真实新工作。</p>\n<blockquote>\n<p>In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<p><code>passed</code>把这种变化落实为人数上的超过：公共部门会员已多于私营部门会员。它继续说明会员构成，而没有转到政治联系。</p>\n<blockquote>\n<p>In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n</blockquote>\n<p>英国的<code>more than half</code>与<code>only about 15%</code>把同一公私部门差异放到另一国家中检验。因此标题要覆盖公共部门工会扩大的地位。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>历史人物的假设对照 → 美国公共部门会员比例增长且人数反超 → 英国公私部门比例对比</p>\n</blockquote>\n<p>rising share概括由十分之一到36%的增长，public-sector明确增长属于哪一部门。</p>\n<p>再看最强干扰项G：The disappearance of political connections。</p>\n<p>首段呈现会员构成变化，并没有政治联系消失的信息。</p>\n<p><strong>41题选A。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】D. The sources and reach of union power\n\n> 工会力量的来源及影响范围\n\n先列停工后果轻、教育程度和政治联系三种原因，再具体写工会如何影响州预算。\n\n> There are three reasons for the public-sector unions’ thriving.\n\n`three reasons`表明下面要解释工会为何繁荣，标题中的sources正对应这层原因。\n\n> Some of their ties go back a long way.\n\n`ties`接政治联系，说明工会的力量不仅来自停工行动和会员素质，还来自与政党的长期关系。\n\n> The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.\n\n学校、监狱、医疗分别对应不同工会盯住的预算领域，把政治联系进一步落实为对公共支出的影响范围。\n\n这一部分的推进关系是：\n\n> 繁荣的三项原因 → 长期政治联系 → 对学校、监狱、医疗预算的影响\n\nsources对应three reasons，reach对应从政党到学校、监狱、医疗的影响。\n\n再看最强干扰项E：A guaranteed improvement in every public service。\n\n有力量不等于改善服务；随后恰恰讨论这种力量可能抵制改革。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】D. The sources and reach of union power</p>\n<blockquote>\n<p>工会力量的来源及影响范围</p>\n</blockquote>\n<p>先列停工后果轻、教育程度和政治联系三种原因，再具体写工会如何影响州预算。</p>\n<blockquote>\n<p>There are three reasons for the public-sector unions’ thriving.</p>\n</blockquote>\n<p><code>three reasons</code>表明下面要解释工会为何繁荣，标题中的sources正对应这层原因。</p>\n<blockquote>\n<p>Some of their ties go back a long way.</p>\n</blockquote>\n<p><code>ties</code>接政治联系，说明工会的力量不仅来自停工行动和会员素质，还来自与政党的长期关系。</p>\n<blockquote>\n<p>The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p>\n</blockquote>\n<p>学校、监狱、医疗分别对应不同工会盯住的预算领域，把政治联系进一步落实为对公共支出的影响范围。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>繁荣的三项原因 → 长期政治联系 → 对学校、监狱、医疗预算的影响</p>\n</blockquote>\n<p>sources对应three reasons，reach对应从政党到学校、监狱、医疗的影响。</p>\n<p>再看最强干扰项E：A guaranteed improvement in every public service。</p>\n<p>有力量不等于改善服务；随后恰恰讨论这种力量可能抵制改革。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】B. Benefits that enlarge income beyond current pay\n\n> 在当期工资之外增加收入的福利\n\n先比较平均工资，再用But转入真正收益所在：福利和工作安排。\n\n> In many rich countries average wages in the state sector are higher than in the private one.\n\n平均工资比较先交代显性的工资优势，但这并非段落最终停留的收入形式。\n\n> But the real gains come in benefits and work practices.\n\n`But`与`real gains`把重心转到福利和工作安排，说明只比较当前工资会遗漏重要收益。\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n\n`modest`与增加的假期、养老金构成对照：现金工资涨幅不大，待遇却通过别的项目增长。B能把这种间接增长保留下来。\n\n这一部分的推进关系是：\n\n> 平均工资较高 → 真正收益在福利与安排 → 工资增幅适度而假期、养老金增加\n\nbeyond current pay对应工资增幅适度而假期、养老金增加，保留收入增长的间接方式。\n\n再看最强干扰项A：The rising share of public-sector union members。\n\nA谈会员比例，不能回答本段收入怎样增加。\n\n**43题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】B. Benefits that enlarge income beyond current pay</p>\n<blockquote>\n<p>在当期工资之外增加收入的福利</p>\n</blockquote>\n<p>先比较平均工资，再用But转入真正收益所在：福利和工作安排。</p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n</blockquote>\n<p>平均工资比较先交代显性的工资优势，但这并非段落最终停留的收入形式。</p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n</blockquote>\n<p><code>But</code>与<code>real gains</code>把重心转到福利和工作安排，说明只比较当前工资会遗漏重要收益。</p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<p><code>modest</code>与增加的假期、养老金构成对照：现金工资涨幅不大，待遇却通过别的项目增长。B能把这种间接增长保留下来。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>平均工资较高 → 真正收益在福利与安排 → 工资增幅适度而假期、养老金增加</p>\n</blockquote>\n<p>beyond current pay对应工资增幅适度而假期、养老金增加，保留收入增长的间接方式。</p>\n<p>再看最强干扰项A：The rising share of public-sector union members。</p>\n<p>A谈会员比例，不能回答本段收入怎样增加。</p>\n<p><strong>43题选B。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Union resistance to changes in public services\n\n> 工会对公共服务改革的抵制\n\n第五段先写教育改革受阻，第六段接政治家整顿和工会集结反对。\n\n> Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles.\n\n`opposed`和`drawn-out battles`先把教育改革面对的阻力摆出来，改革与工会抵制是一组明确的对立关系。\n\n> As the cost to everyone else has become clearer, politicians have begun to clamp down.\n\n成本逐渐清楚促使政治家着手整顿，随后工会动员反对州长；后一个例子继续展示改革为什么难以推进。\n\n> But many within the public sector suffer under the current system, too.\n\n末句说公共部门内部也有人受损，纠正工会维护现状必然使全体雇员受益的想法，并给末段优秀者受损留下接口。\n\n这一部分的推进关系是：\n\n> 教育改革遭抵制 → 政治家整顿引发工会动员 → 现状也损害部分公共部门雇员\n\nresistance同时覆盖fought against和rallied ... against；changes对应改革与整顿。\n\n再看最强干扰项E：A guaranteed improvement in every public service。\n\n遭抵制的改革并未保证成功，更没有所有公共服务必然改善的结论。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Union resistance to changes in public services</p>\n<blockquote>\n<p>工会对公共服务改革的抵制</p>\n</blockquote>\n<p>第五段先写教育改革受阻，第六段接政治家整顿和工会集结反对。</p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles.</p>\n</blockquote>\n<p><code>opposed</code>和<code>drawn-out battles</code>先把教育改革面对的阻力摆出来，改革与工会抵制是一组明确的对立关系。</p>\n<blockquote>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down.</p>\n</blockquote>\n<p>成本逐渐清楚促使政治家着手整顿，随后工会动员反对州长；后一个例子继续展示改革为什么难以推进。</p>\n<blockquote>\n<p>But many within the public sector suffer under the current system, too.</p>\n</blockquote>\n<p>末句说公共部门内部也有人受损，纠正工会维护现状必然使全体雇员受益的想法，并给末段优秀者受损留下接口。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>教育改革遭抵制 → 政治家整顿引发工会动员 → 现状也损害部分公共部门雇员</p>\n</blockquote>\n<p>resistance同时覆盖fought against和rallied ... against；changes对应改革与整顿。</p>\n<p>再看最强干扰项E：A guaranteed improvement in every public service。</p>\n<p>遭抵制的改革并未保证成功，更没有所有公共服务必然改善的结论。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】C. An incentive system that fails high achievers\n\n> 未能奖励高成就者的激励制度\n\n引述Donahue指出制度适合守成者而不利成就突出者，末句将激励失效提升为更大问题。\n\n> John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.\n\n`suit`与`bad for`比较制度对两类人的不同影响，焦点在成就突出者不能得到合适待遇。\n\n> The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States.\n\n高收入者只限于少数特殊职位，具体说明一般公共雇员即便表现出色也缺少相应奖励空间。\n\n> Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.\n\n末句直接出现`does not reward high achievers`，把前面的待遇差别收束到激励失效；银行家的高薪只是用于比较问题轻重。\n\n这一部分的推进关系是：\n\n> 守成者适应制度而优秀者受损 → 高薪只见于少数特殊职位 → 奖励卓越不足构成制度问题\n\nincentive system对应reward，fails high achievers对应bad for high achievers和does not reward。\n\n再看最强干扰项B：Benefits that enlarge income beyond current pay。\n\n养老金福利只是前文收益形式，不能概括末段对奖励卓越不足的批评。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】C. An incentive system that fails high achievers</p>\n<blockquote>\n<p>未能奖励高成就者的激励制度</p>\n</blockquote>\n<p>引述Donahue指出制度适合守成者而不利成就突出者，末句将激励失效提升为更大问题。</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<p><code>suit</code>与<code>bad for</code>比较制度对两类人的不同影响，焦点在成就突出者不能得到合适待遇。</p>\n<blockquote>\n<p>The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States.</p>\n</blockquote>\n<p>高收入者只限于少数特殊职位，具体说明一般公共雇员即便表现出色也缺少相应奖励空间。</p>\n<blockquote>\n<p>Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n</blockquote>\n<p>末句直接出现<code>does not reward high achievers</code>，把前面的待遇差别收束到激励失效；银行家的高薪只是用于比较问题轻重。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>守成者适应制度而优秀者受损 → 高薪只见于少数特殊职位 → 奖励卓越不足构成制度问题</p>\n</blockquote>\n<p>incentive system对应reward，fails high achievers对应bad for high achievers和does not reward。</p>\n<p>再看最强干扰项B：Benefits that enlarge income beyond current pay。</p>\n<p>养老金福利只是前文收益形式，不能概括末段对奖励卓越不足的批评。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从会员增长提出力量来源问题 |\n| B | 用州内抵制说明改革阻力 |\n| C | 说明公共部门内部优秀者也受损 |\n| D | 把政治联系接到预算与后期成本 |\n| E | 解释工资之外的福利增长 |\n| F | 列举行动后果及教育政治优势 |\n| G | 由利益保护转入教育改革受阻 |\n| H | 落到奖励优秀的制度问题 |\n\n全文推进：\n\n> 从会员增长提出力量来源问题 → 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本 → 解释工资之外的福利增长 → 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损 → 落到奖励优秀的制度问题\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从会员增长提出力量来源问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>用州内抵制说明改革阻力</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明公共部门内部优秀者也受损</td>\n</tr>\n<tr>\n<td>D</td>\n<td>把政治联系接到预算与后期成本</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释工资之外的福利增长</td>\n</tr>\n<tr>\n<td>F</td>\n<td>列举行动后果及教育政治优势</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由利益保护转入教育改革受阻</td>\n</tr>\n<tr>\n<td>H</td>\n<td>落到奖励优秀的制度问题</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从会员增长提出力量来源问题 → 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本 → 解释工资之外的福利增长 → 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损 → 落到奖励优秀的制度问题</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → D。\n\n先看前段A的结尾：\n\n> The contrast suggests a question about why collective organisation has become so powerful in government employment.\n\n再看F段开头：\n\n> One answer to that question concerns the consequences of stopping work.\n\nA末句明确问工会为什么在政府雇佣中如此强大。F的`One answer to that question`承接这个why问题，给出停工后果不同这一原因。\n\n本段内部继续写道：\n\n> Public-sector unions can interrupt services without suffering the same penalties that might follow in private business. Their members also tend to be educated, and their organisations have developed close connections with political parties.\n\n停工惩罚较轻、会员教育程度较高、组织同政党关系密切，连续补出力量的来源；最后出现的political parties使政治联系成为下一段可展开的对象。\n\n后段D开头是：\n\n> Those political connections give union influence a reach beyond the workplace.\n\nD的`Those political connections`指回F末句的close connections，接着才能讨论这些联系如何超出工作场所、影响预算。\n\n这三段的推进关系：\n\n> 从会员增长提出力量来源问题 → 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本\n\n再检验候选G：\n\n> The bargain becomes harder to defend when protecting existing benefits also means resisting reform.\n\nG的`The bargain`要求前面已经交代待遇交易，`existing benefits`也要求先有福利内容。A只提出力量来源问题，尚未提供这些承接对象；放G还会让D的Those political connections失去出处。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The contrast suggests a question about why collective organisation has become so powerful in government employment.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>One answer to that question concerns the consequences of stopping work.</p>\n</blockquote>\n<p>A末句明确问工会为什么在政府雇佣中如此强大。F的<code>One answer to that question</code>承接这个why问题，给出停工后果不同这一原因。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Public-sector unions can interrupt services without suffering the same penalties that might follow in private business. Their members also tend to be educated, and their organisations have developed close connections with political parties.</p>\n</blockquote>\n<p>停工惩罚较轻、会员教育程度较高、组织同政党关系密切，连续补出力量的来源；最后出现的political parties使政治联系成为下一段可展开的对象。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Those political connections give union influence a reach beyond the workplace.</p>\n</blockquote>\n<p>D的<code>Those political connections</code>指回F末句的close connections，接着才能讨论这些联系如何超出工作场所、影响预算。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从会员增长提出力量来源问题 → 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform.</p>\n</blockquote>\n<p>G的<code>The bargain</code>要求前面已经交代待遇交易，<code>existing benefits</code>也要求先有福利内容。A只提出力量来源问题，尚未提供这些承接对象；放G还会让D的Those political connections失去出处。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> Their members also tend to be educated, and their organisations have developed close connections with political parties.\n\n再看D段开头：\n\n> Those political connections give union influence a reach beyond the workplace.\n\nF末句写组织与政党形成close connections，D开头用`Those political connections`原样承接，继续解释联系带来的影响。\n\n本段内部继续写道：\n\n> At state level, organised groups watch spending on schools, prisons and health care. Control over budgets matters because employment agreements determine not only immediate wages but also costs that will be paid much later.\n\n学校、监狱、医疗说明工会如何介入预算；雇佣协议随后把预算支出分成即期工资和以后支付的成本，末句明确留下`costs ... much later`。\n\n后段E开头是：\n\n> These later costs often take the form of benefits.\n\nE的`These later costs`正指这些未来成本，再说明它们通常体现为福利。只有先交代成本时间差，E的these才有明确对象。\n\n这三段的推进关系：\n\n> 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本 → 解释工资之外的福利增长\n\n再检验候选G：\n\n> The bargain becomes harder to defend when protecting existing benefits also means resisting reform.\n\nG谈保护existing benefits却抵制改革，但F只说政治联系，尚未解释福利收益。先接G既跳过政治联系如何影响支出，也使E的later costs没有前文依据。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Their members also tend to be educated, and their organisations have developed close connections with political parties.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Those political connections give union influence a reach beyond the workplace.</p>\n</blockquote>\n<p>F末句写组织与政党形成close connections，D开头用<code>Those political connections</code>原样承接，继续解释联系带来的影响。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>At state level, organised groups watch spending on schools, prisons and health care. Control over budgets matters because employment agreements determine not only immediate wages but also costs that will be paid much later.</p>\n</blockquote>\n<p>学校、监狱、医疗说明工会如何介入预算；雇佣协议随后把预算支出分成即期工资和以后支付的成本，末句明确留下<code>costs ... much later</code>。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>These later costs often take the form of benefits.</p>\n</blockquote>\n<p>E的<code>These later costs</code>正指这些未来成本，再说明它们通常体现为福利。只有先交代成本时间差，E的these才有明确对象。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本 → 解释工资之外的福利增长</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform.</p>\n</blockquote>\n<p>G谈保护existing benefits却抵制改革，但F只说政治联系，尚未解释福利收益。先接G既跳过政治联系如何影响支出，也使E的later costs没有前文依据。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> The resulting income gain is indirect, which helps explain why looking only at the current pay rise misses part of the bargain.\n\n再看G段开头：\n\n> The bargain becomes harder to defend when protecting existing benefits also means resisting reform.\n\nE以`part of the bargain`结尾，G用`The bargain`承接同一待遇安排；`harder to defend`开始追问这种安排带来的代价。\n\n本段内部继续写道：\n\n> Education provides a clear example: efforts to reward effective teachers or remove ineffective ones encounter organised opposition. The issue is therefore not simply how much employees receive, but how services are improved.\n\n教育中的例子说明，保护现有利益会使奖励优秀教师、淘汰不称职者的改革遇阻。末句因此由收入多少转向`how services are improved`。\n\n后段B开头是：\n\n> Improving those services has consequently become a political struggle.\n\nB开头的`Improving those services`接G刚提出的服务改善，把改革为何困难具体展开为政治争斗。\n\n这三段的推进关系：\n\n> 解释工资之外的福利增长 → 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力\n\n再检验候选C：\n\n> Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.\n\nC的Indeed要补充已有论证，而它补充的是现状还使优秀雇员受损。E刚解释间接收入增长，尚未展开改革阻力；接C无法给B的those services提供紧邻的服务改善话题。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The resulting income gain is indirect, which helps explain why looking only at the current pay rise misses part of the bargain.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform.</p>\n</blockquote>\n<p>E以<code>part of the bargain</code>结尾，G用<code>The bargain</code>承接同一待遇安排；<code>harder to defend</code>开始追问这种安排带来的代价。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Education provides a clear example: efforts to reward effective teachers or remove ineffective ones encounter organised opposition. The issue is therefore not simply how much employees receive, but how services are improved.</p>\n</blockquote>\n<p>教育中的例子说明，保护现有利益会使奖励优秀教师、淘汰不称职者的改革遇阻。末句因此由收入多少转向<code>how services are improved</code>。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Improving those services has consequently become a political struggle.</p>\n</blockquote>\n<p>B开头的<code>Improving those services</code>接G刚提出的服务改善，把改革为何困难具体展开为政治争斗。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释工资之外的福利增长 → 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.</p>\n</blockquote>\n<p>C的Indeed要补充已有论证，而它补充的是现状还使优秀雇员受损。E刚解释间接收入增长，尚未展开改革阻力；接C无法给B的those services提供紧邻的服务改善话题。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> The issue is therefore not simply how much employees receive, but how services are improved.\n\n再看B段开头：\n\n> Improving those services has consequently become a political struggle.\n\nG末句提出公共服务怎样改善，B用`Improving those services`承接；`political struggle`说明服务改革推进时遭遇的现实阻力。\n\n本段内部继续写道：\n\n> In Wisconsin, unions gathered supporters against a governor determined to impose change. Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.\n\nWisconsin工会反对强硬州长，是政治争斗的具体事例。末句又提醒：这种抵制不能证明维持现状使每个会员受益。\n\n后段C开头是：\n\n> Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.\n\nC的`Indeed`顺着这个提醒补充内部反例：维持同样安排会损害有抱负的公共雇员，`those arrangements`也回指B末句。\n\n这三段的推进关系：\n\n> 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损\n\n再检验候选F：\n\n> One answer to that question concerns the consequences of stopping work.\n\nF的`that question`需要一个明确的前文疑问；G末句已给出议题转向而非会员力量来源的why问题。F重讲工会优势，也不能承接B原应引出的“并非每个会员受益”。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The issue is therefore not simply how much employees receive, but how services are improved.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Improving those services has consequently become a political struggle.</p>\n</blockquote>\n<p>G末句提出公共服务怎样改善，B用<code>Improving those services</code>承接；<code>political struggle</code>说明服务改革推进时遭遇的现实阻力。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In Wisconsin, unions gathered supporters against a governor determined to impose change. Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.</p>\n</blockquote>\n<p>Wisconsin工会反对强硬州长，是政治争斗的具体事例。末句又提醒：这种抵制不能证明维持现状使每个会员受益。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.</p>\n</blockquote>\n<p>C的<code>Indeed</code>顺着这个提醒补充内部反例：维持同样安排会损害有抱负的公共雇员，<code>those arrangements</code>也回指B末句。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One answer to that question concerns the consequences of stopping work.</p>\n</blockquote>\n<p>F的<code>that question</code>需要一个明确的前文疑问；G末句已给出议题转向而非会员力量来源的why问题。F重讲工会优势，也不能承接B原应引出的“并非每个会员受益”。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.\n\n再看C段开头：\n\n> Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.\n\nB结尾否定每个会员都受益，C的`Indeed`给出进一步理由：有抱负的雇员本身就可能因维持现状而吃亏。\n\n本段内部继续写道：\n\n> A system suited to people who wish to remain where they are may give too little recognition to outstanding performance. The unfairness is visible from inside the public sector as well as from the perspective of taxpayers.\n\n守成者适应制度与突出表现缺少认可形成对照，随后从纳税人视角补到公共部门内部视角，具体说明内部受损体现在哪里。\n\n后段H开头是：\n\n> That failure to recognise performance points to a broader problem of incentives.\n\nH的`That failure to recognise performance`概括C中的`too little recognition to outstanding performance`，由这一缺陷自然引出激励制度的问题。\n\n这三段的推进关系：\n\n> 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损 → 落到奖励优秀的制度问题\n\n再检验候选F：\n\n> One answer to that question concerns the consequences of stopping work.\n\nF重新回答工会力量来源，无法为H的That failure提供“优秀表现不被认可”的前提，也不能接住B刚提出的部分会员未必受益。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.</p>\n</blockquote>\n<p>B结尾否定每个会员都受益，C的<code>Indeed</code>给出进一步理由：有抱负的雇员本身就可能因维持现状而吃亏。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A system suited to people who wish to remain where they are may give too little recognition to outstanding performance. The unfairness is visible from inside the public sector as well as from the perspective of taxpayers.</p>\n</blockquote>\n<p>守成者适应制度与突出表现缺少认可形成对照，随后从纳税人视角补到公共部门内部视角，具体说明内部受损体现在哪里。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>That failure to recognise performance points to a broader problem of incentives.</p>\n</blockquote>\n<p>H的<code>That failure to recognise performance</code>概括C中的<code>too little recognition to outstanding performance</code>，由这一缺陷自然引出激励制度的问题。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损 → 落到奖励优秀的制度问题</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One answer to that question concerns the consequences of stopping work.</p>\n</blockquote>\n<p>F重新回答工会力量来源，无法为H的That failure提供“优秀表现不被认可”的前提，也不能接住B刚提出的部分会员未必受益。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **public services** | **公共服务** | **社会现象类｜社会生活** | **宏观主题** |\n| institutional reform | 制度改革 | 社会现象类｜社会生活 | 宏观主题 |\n| fair rewards | 公平奖励 | 社会现象类｜社会生活 | 宏观主题 |\n| **educational quality** | **教育质量** | **社会现象类｜文化教育** | **宏观主题** |\n| the pursuit of excellence | 追求卓越 | 人生哲理类｜进取 | 个人主题 |\n| social responsibility | 社会责任 | 人生哲理类｜责任与奉献 | 个人主题 |\n| effective incentives | 有效激励 | 社会现象类｜社会生活 | 宏观主题 |\n| public welfare | 公共福祉 | 社会现象类｜社会生活 | 宏观主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>public services</strong></td>\n<td><strong>公共服务</strong></td>\n<td><strong>社会现象类｜社会生活</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>institutional reform</td>\n<td>制度改革</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>fair rewards</td>\n<td>公平奖励</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>educational quality</strong></td>\n<td><strong>教育质量</strong></td>\n<td><strong>社会现象类｜文化教育</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<t >\n<td>The image draws attention to a system that does not reward high achievement.</td>\n<td>图画引导人们关注一个未能奖励突出成就的制度。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The share of participants has risen from one in ten to more than one in three.</strong></td>\n<td><strong>参与者比例从十分之一上升到超过三分之一。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The number in one sector has passed that in the other.</td>\n<td>一个部门的人数已经超过另一个部门。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The visible increase is modest, but the gains in benefits are larger.</td>\n<td>显性的增幅适度，但福利方面的增长更大。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement stresses the importance of rewarding high achievers.</td>\n<td>这句话强调奖励成就突出者的重要性。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage asks how institutional arrangements affect the quality of public services.</td>\n<td>这段文字讨论制度安排如何影响公共服务质量。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. The rising share of public-sector union members</strong></p><p><strong>B. Benefits that enlarge income beyond current pay</strong></p><p><strong>C. An incentive system that fails high achievers</strong></p><p><strong>D. The sources and reach of union power</strong></p><p><strong>E. A guaranteed improvement in every public service</strong></p><p><strong>F. Union resistance to changes in public services</strong></p><p><strong>G. The disappearance of political connections</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>There are three reasons for the public-sector unions’ thriving. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now dominate left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions. At the state level their influence can be even more fearsome. Mark Baldassare of the Public Policy Institute of California points out that much of the state’s budget is patrolled by unions. The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>In many rich countries average wages in the state sector are higher than in the private one. But the real gains come in benefits and work practices. Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles. Even though there is plenty of evidence that the quality of the teachers is the most  important variable, teachers’ unions have fought against getting rid of bad ones and promoting good ones. As the cost to everyone else has become clearer, politicians have begun to clamp down. In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor. But many within the public sector suffer under the current system, too.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers. The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Public-sector unions have become a growing presence in modern labour relations. In the United States their membership has expanded beyond that of unions in the private sector. The contrast suggests a question about why collective organisation has become so powerful in government employment.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Improving those services has consequently become a political struggle. In Wisconsin, unions gathered supporters against a governor determined to impose change. Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves. A system suited to people who wish to remain where they are may give too little recognition to outstanding performance. The unfairness is visible from inside the public sector as well as from the perspective of taxpayers.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Those political connections give union influence a reach beyond the workplace. At state level, organised groups watch spending on schools, prisons and health care. Control over budgets matters because employment agreements determine not only immediate wages but also costs that will be paid much later.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>These later costs often take the form of benefits. Politicians may keep visible wage increases modest while adding holidays and generous pensions. The resulting income gain is indirect, which helps explain why looking only at the current pay rise misses part of the bargain.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>One answer to that question concerns the consequences of stopping work. Public-sector unions can interrupt services without suffering the same penalties that might follow in private business. Their members also tend to be educated, and their organisations have developed close connections with political parties.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform. Education provides a clear example: efforts to reward effective teachers or remove ineffective ones encounter organised opposition. The issue is therefore not simply how much employees receive, but how services are improved.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>That failure to recognise performance points to a broader problem of incentives. Criticising high private-sector pay is easier than designing a public system that rewards achievement, but the second task remains essential. Union strength and the quality of public service should therefore be assessed as separate questions.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>trade unionist</td>\n<td>n.工会成员</td>\n<td>civil servants</td>\n<td>公务员</td>\n<td>represent</td>\n<td>v.代表</td>\n</tr>\n<tr>\n<td>in their prime</td>\n<td>处于鼎盛时期</td>\n<td>belong to</td>\n<td>属于</td>\n<td>public sector</td>\n<td>公共部门</td>\n</tr>\n<tr>\n<td>private sector</td>\n<td>私营部门</td>\n<td>unionized</td>\n<td>adj.加入工会的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>thrive</td>\n<td>v.兴盛</td>\n<td>consequences</td>\n<td>n.后果</td>\n<td>bright</td>\n<td>adj.聪明的</td>\n</tr>\n<tr>\n<td>well-educated</td>\n<td>adj.受过良好教育的</td>\n<td>dominate</td>\n<td>v.主导</td>\n<td>ties</td>\n<td>n.联系</td>\n</tr>\n<tr>\n<td>imply</td>\n<td>v.暗示</td>\n<td>be associated with</td>\n<td>与……相关</td>\n<td>owe ... to</td>\n<td>把……归因于</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th> td>\n<td>current</td>\n<td>adj.现行的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>norms</td>\n<td>n.规范</td>\n<td>civil services</td>\n<td>公务员体系</td>\n<td>stay put</td>\n<td>保持原位</td>\n</tr>\n<tr>\n<td>high achievers</td>\n<td>成就突出者</td>\n<td>coaches</td>\n<td>n.教练</td>\n<td>fat pay packets</td>\n<td>丰厚薪酬</td>\n</tr>\n<tr>\n<td>criticism</td>\n<td>n.批评</td>\n<td>reward</td>\n<td>v.奖励</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n<h3>意群划分 · 第1段</h3>\n<p>If the trade unionist Jimmy Hoffa / were alive today, / he would probably represent / civil servants.</p>\n<p>When Hoffa&#39;s Teamsters / were in their prime / in 1960, / only one in ten / American government workers / belonged to a union; / now 36% do.</p>\n<p>In 2009 / the number of unionists / in America&#39;s public sector / passed that / of their fellow members / in the private sector.</p>\n<p>In Britain, / more than half / of public-sector workers / but only about 15% / of private-sector ones / are unionized.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>如果工会领袖吉米·霍法 / 今天还活着，/ 他可能会代表 / 公务员。</p>\n<p>当霍法的卡车司机工会 / 处于鼎盛时期 / 在1960年，/ 只有十分之一 / 美国政府工作人员 / 属于工会；/ 现在36%属于。</p>\n<p>在2009年 / 工会成员的数量 / 在美国公共部门 / 超过了 / 他们的同行成员 / 在私营部门。</p>\n<p>在英国，/ 超过一半 / 公共部门工作者的 / 但只有大约15% / 私营部门工作者的 / 加入了工会。</p>\n<h3>标准译文 · 第1段</h3>\n<p>如果工会领袖吉米·霍法今天还活着，他可能会代表公务员。1960年霍法的卡车司机工会处于鼎盛时期时，只有十分之一的美国政府工作人员属于工会；而现在这一比例达到36%。2009年，美国公共部门的工会成员数量超过了私营部门。在英国，超过一半的公共部门工作者加入了工会，而私营部门只有约15%。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>There are three reasons for the public-sector unions’ thriving. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now dominate left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n<h3>意群划分 · 第2段</h3>\n<p>There are three reasons / for the public-sector unions&#39; thriving.</p>\n<p>First, / they can shut things down / without suffering much / in the way of consequences.</p>\n<p>Second, / they are mostly bright / and well-educated.</p>\n<p>A quarter / of America&#39;s public-sector workers / have a university degree.</p>\n<p>Third, / they now dominate / left-of-centre politics.</p>\n<p>Some of their ties / go back a long way.</p>\n<p>Britain&#39;s Labor Party, / as its name implies, / has long been associated / with trade unionism.</p>\n<p>Its current leader, / Ed Miliband, / owes his position / to votes / from public-sector unions.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>有三个原因 / 对于公共部门工会的繁荣。</p>\n<p>第一，/ 他们可以让事情停摆 / 而不会遭受太多 / 在后果方面。</p>\n<p>第二，/ 他们大多聪明 / 且受过良好教育。</p>\n<p>四分之一 / 美国公共部门工作者的 / 拥有大学学位。</p>\n<p>第三，/ 他们现在主导 / 中左翼政治。</p>\n<p>他们的一些联系 / 可以追溯很久。</p>\n<p>英国工党，/ 正如其名称所暗示的，/ 长期以来一直与 / 工会主义相关联。</p>\n<p>其现任领导人，/ 埃德·米利班德，/ 归功于他的职位 / 于选票 / 来自公共部门工会。</p>\n<h3>标准译文 · 第2段</h3>\n<p>公共部门工会繁荣有三个原因。第一，他们可以让事情停摆而不会承受太多后果。第二，他们大多聪明且受过良好教育。美国公共部门工作者中有四分之一拥有大学学位。第三，他们现在主导着中左翼政治。他们的一些联系可以追溯很久。英国工党，正如其名称所暗示的，长期以来一直与工会主义相关联。其现任领导人埃德·米利班德的职位归功于来自公共部门工会的选票。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>At the state level their influence can be even more fearsome. Mark Baldassare of the Public Policy Institute of California points out that much of the state’s budget is patrolled by unions. The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p>\n<h3>意群划分 · 第3段</h3>\n<p>At the state level / their influence / can be even more fearsome.</p>\n<p>Mark Baldassare / of the Public Policy Institute of California / points out / that much of the state&#39;s budget / is patrolled by unions.</p>\n<p>The teachers&#39; unions / keep an eye on schools, / the CCPOA / on prisons / and a variety of labor groups / on health care.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>在州层面 / 他们的影响力 / 可能更加可怕。</p>\n<p>马克·巴尔达萨雷 / 加州公共政策研究所的 / 指出 / 该州预算的很大一部分 / 被工会巡视着。</p>\n<p>教师工会 / 密切关注学校，/ 加州惩教和平官员协会 / 关注监狱 / 以及各种劳工团体 / 关注医疗保健。</p>\n<h3>标准译文 · 第3段</h3>\n<p>在州层面，他们的影响力可能更加可怕。加州公共政策研究所的马克·巴尔达萨雷指出，该州预算的很大一部分都在工会的掌控之下。教师工会密切关注学校，加州惩教和平官员协会关注监狱，各种劳工团体关注医疗保健。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>In many rich countries average wages in the state sector are higher than in the private one. But the real gains come in benefits and work practices. Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<h3>意群划分 · 第4段</h3>\n<p>In many rich countries / average wages / in the state sector / are higher than / in the private one.</p>\n<p>But the real gains / come in benefits / and work practices.</p>\n<p>Politicians have repeatedly / &quot;backloaded&quot; / public-sector pay deals, / keeping the pay increases modest / but adding to holidays / and especially pensions / that are already generous.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>在许多富裕国家 / 平均工资 / 在国家部门 / 高于 / 在私营部门。</p>\n<p>但真正的收益 / 来自福利 / 和工作实践。</p>\n<p>政客们反复地 / &quot;后置加载&quot; / 公共部门薪酬协议，/ 保持薪资增长适度 / 但增加假期 / 特别是养老金 / 这些已经很慷慨了。</p>\n<h3>标准译文 · 第4段</h3>\n<p>在许多富裕国家，国家部门的平均工资高于私营部门。但真正的收益来自福利和工作实践。政客们反复&quot;后置加载&quot;公共部门薪酬协议，保持薪资增长适度，但增加假期，特别是本已慷慨的养老金。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles. Even though there is plenty of evidence that the quality of the teachers is the most  important variable, teachers’ unions have fought against getting rid of bad ones and promoting good ones.</p>\n<h3>意群划分 · 第5段</h3>\n<p>Reform has been vigorously opposed, / perhaps most notoriously / in education, / where charter schools, / academies / and merit pay / all faced drawn-out battles.</p>\n<p>Even though / there is plenty of evidence / that the quality of the teachers / is the most important variable, / teachers&#39; unions have fought / against getting rid of bad ones / and promoting good ones.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>改革遭到了强烈反对，/ 也许最臭名昭著的是 / 在教育领域，/ 在那里特许学校、/ 学院 / 和绩效工资 / 都面临旷日持久的战斗。</p>\n<p>即使 / 有大量证据表明 / 教师的质量 / 是最重要的变量，/ 教师工会一直在斗争 / 反对淘汰差的教师 / 和提拔好的教师。</p>\n<h3>标准译文 · 第5段</h3>\n<p>改革遭到了强烈反对，也许最臭名昭著的是在教育领域，特许学校、学院和绩效工资都面临旷日持久的战斗。即使有大量证据表明教师质量是最重要的变量，教师工会仍在反对淘汰差教师和提拔好教师。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down. In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor. But many within the public sector suffer under the current system, too.</p>\n<h3>意群划分 · 第6段</h3>\n<p>As the cost / to everyone else / has become clearer, / politicians have begun / to clamp down.</p>\n<p>In Wisconsin / the unions have rallied / thousands of supporters / against Scott Walker, / the hardline Republican governor.</p>\n<p>But many / within the public sector / suffer / under the current system, / too.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>随着成本 / 对其他所有人的 / 变得更加清晰，/ 政客们已经开始 / 采取严厉措施。</p>\n<p>在威斯康星州 / 工会已经集结了 / 成千上万的支持者 / 反对斯科特·沃克，/ 强硬派共和党州长。</p>\n<p>但许多人 / 在公共部门内 / 遭受痛苦 / 在当前体系下，/ 同样。</p>\n<h3>标准译文 · 第6段</h3>\n<p>随着对其他所有人的成本变得更加清晰，政客们已经开始采取严厉措施。在威斯康星州，工会已经集结了成千上万的支持者反对强硬派共和党州长斯科特·沃克。但公共部门内的许多人在当前体系下同样遭受痛苦。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers. The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n<h3>意群划分 · 第7段</h3>\n<p>John Donahue / at Harvard&#39;s Kennedy School / points out / that the norms of culture / in Western civil services / suit those / who want to stay put / but is bad / for high achievers.</p>\n<p>The only American public-sector workers / who earn well above $250,000 a year / are university sports coaches / and the president of the United States.</p>\n<p>Bankers&#39; fat pay packets / have attracted much criticism, / but a public-sector system / that does not reward high achievers / may be a much bigger problem / for America.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>约翰·多纳休 / 在哈佛肯尼迪学院 / 指出 / 文化规范 / 在西方公务员体系中 / 适合那些人 / 想要安于现状的 / 但是不利于 / 高成就者。</p>\n<p>唯一的美国公共部门工作者 / 年收入远超25万美元的 / 是大学体育教练 / 和美国总统。</p>\n<p>银行家的丰厚薪酬 / 已经引起了很多批评，/ 但一个公共部门体系 / 不奖励高成就者的 / 可能是一个更大的问题 / 对美国来说。</p>\n<h3>标准译文 · 第7段</h3>\n<p>哈佛肯尼迪学院的约翰·多纳休指出，西方公务员体系中的文化规范适合那些想要安于现状的人，但不利于高成就者。唯一年收入远超25万美元的美国公共部门工作者是大学体育教练和美国总统。银行家的丰厚薪酬已经引起了很多批评，但一个不奖励高成就者的公共部门体系可能是美国面临的更大问题。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>If the trade unionist Jimmy Hoffa → were alive today → he would probably represent → civil servants.</p>\n<p>When Hoffa&#39;s Teamsters → were in their prime：(in 1960) → only one in ten：(American government workers) → belonged to a union; // now 36% do.</p>\n<p>In 2009 → the number of unionists：(in America&#39;s public sector) → passed that：(of their fellow members：(in the private sector)).</p>\n<p>In Britain → more than half：(of public-sector workers) // but only about 15%：(of private-sector ones) → are unionized.</p>\n<p><strong>第2段</strong></p>\n<p>There are three reasons：(for the public-sector unions&#39; thriving).</p>\n<p>First → they can shut things down：(without suffering much：(in the way of consequences)).</p>\n<p>Second → they are mostly bright + well-educated.</p>\n<p>A quarter：(of America&#39;s public-sector workers) → have a university degree.</p>\n<p>Third → they now dominate：(left-of-centre politics).</p>\n<p>Some of their ties → go back a long way.</p>\n<p>Britain&#39;s Labor Party：(as its name implies) → has long been associated：(with trade unionism).</p>\n<p>Its current leader：(Ed Miliband) → owes his position：(to votes：(from public-sector unions)).</p>\n<p><strong>第3段</strong></p>\n<p>At the state level → their influence → can be even more fearsome.</p>\n<p>Mark Baldassare：(of the Public Policy Institute of California) → points out：(that much of the state&#39;s budget → is patrolled by unions).</p>\n<p>The teachers&#39; unions → keep an eye on schools + the CCPOA → on prisons + a variety of labor groups → on health care.</p>\n<p><strong>第4段</strong></p>\n<p>In many rich countries → average wages：(in the state sector) → are higher than：(in the private one).</p>\n<p>But the real gains → come in benefits + work practices.</p>\n<p>Politicians have repeatedly → &quot;backloaded&quot;：(public-sector pay deals) → keeping the pay increases modest // but adding to holidays + especially pensions：(that are already generous).</p>\n<p><strong>第5段</strong></p>\n<p>Reform has been vigorously opposed → perhaps most notoriously：(in education)：(where charter schools + academies + merit pay → all faced drawn-out battles).</p>\n<p>Even though：(there is plenty of evidence：(that the quality of the teachers → is the most important variable)) → teachers&#39; unions have fought：(against getting rid of bad ones + promoting good ones).</p>\n<p><strong>第6段</strong></p>\n<p>As the cost：(to everyone else) → has become clearer → politicians have begun → to clamp down.</p>\n<p>In Wisconsin → the unions have rallied：(thousands of supporters)：(against Scott Walker：(the hardline Republican governor)).</p>\n<p>But many：(within the public sector) → suffer：(under the current system) → too.</p>\n<p><strong>第7段</strong></p>\n<p>John Donahue：(at Harvard&#39;s Kennedy School) → points out：(that the norms of culture：(in Western civil services) → suit those：(who want to stay put) // but is bad：(for high achievers)).</p>\n<p>The only American public-sector workers：(who earn well above $250,000 a year) → are university sports coaches + the president of the United States.</p>\n<p>Bankers&#39; fat pay packets → have attracted much criticism // but a public-sector system：(that does not reward high achievers) → may be a much bigger problem：(for America).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>如果工会领袖吉米·霍法 → 今天还活着 → 他可能会代表 → 公务员。</p>\n<p>当霍法的卡车司机工会 → 处于鼎盛时期：(在1960年) → 只有十分之一：(美国政府工作人员) → 属于工会；// 现在36%属于。</p>\n<p>在2009年 → 工会成员的数量：(在美国公共部门) → 超过了：(他们的同行成员：(在私营部门))。</p>\n<p>在英国 → 超过一半：(公共部门工作者的) // 但只有大约15%：(私营部门工作者的) → 加入了工会。</p>\n<p><strong>第2段</strong></p>\n<p>有三个原因：(对于公共部门工会的繁荣)。</p>\n<p>第一 → 他们可以让事情停摆：(而不会遭受太多：(在后果方面))。</p>\n<p>第二 → 他们大多聪明 + 受过良好教育。</p>\n<p>四分之一：(美国公共部门工作者的) → 拥有大学学位。</p>\n<p>第三 → 他们现在主导：(中左翼政治)。</p>\n<p>他们的一些联系 → 可以追溯很久。</p>\n<p>英国工党：(正如其名称所暗示的) → 长期以来一直与：(工会主义相关联)。</p>\n<p>其现任领导人：(埃德·米利班德) → 归功于他的职位：(于选票：(来自公共部门工会))。</p>\n<p><strong>第3段</strong></p>\n<p>在州层面 → 他们的影响力 → 可能更加可怕。</p>\n<p>马克·巴尔达萨雷：(加州公共政策研究所的) → 指出：(该州预算的很大一部分 → 被工会巡视着)。</p>\n<p>教师工会 → 密切关注学校 + 加州惩教和平官员协会 → 关注监狱 + 各种劳工团体 → 关注医疗保健。</p>\n<p><strong>第4段</strong></p>\n<p>在许多富裕国家 → 平均工资：(在国家部门) → 高于：(在私营部门)。</p>\n<p>但真正的收益 → 来自福利 + 工作实践。</p>\n<p>政客们反复地 → &quot;后置加载&quot;：(公共部门薪酬协议) → 保持薪资增长适度 // 但增加假期 + 特别是养老金：(这些已经很慷慨了)。</p>\n<p><strong>第5段</strong></p>\n<p>改革遭到了强烈反对 → 也许最臭名昭著的是：(在教育领域)：(在那里特许学校 + 学院 + 绩效工资 → 都面临旷日持久的战斗)。</p>\n<p>即使：(有大量证据表明：(教师的质量 → 是最重要的变量)) → 教师工会一直在斗争：(反对淘汰差的教师 + 提拔好的教师)。</p>\n<p><strong>第6段</strong></p>\n<p>随着成本：(对其他所有人的) → 变得更加清晰 → 政客们已经开始 → 采取严厉措施。</p>\n<p>在威斯康星州 → 工会已经集结了：(成千上万的支持者)：(反对斯科特·沃克：(强硬派共和党州长))。</p>\n<p>但许多人：(在公共部门内) → 遭受痛苦：(在当前体系下) → 同样。</p>\n<p><strong>第7段</strong></p>\n<p>约翰·多纳休：(在哈佛肯尼迪学院) → 指出：(文化规范：(在西方公务员体系中) → 适合那些人：(想要安于现状的) // 但是不利于：(高成就者))。</p>\n<p>唯一的美国公共部门工作者：(年收入远超25万美元的) → 是大学体育教练 + 美国总统。</p>\n<p>银行家的丰厚薪酬 → 已经引起了很多批评 // 但一个公共部门体系：(不奖励高成就者的) → 可能是一个更大的问题：(对美国来说)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>When Hoffa&#39;s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>When Hoffa&#39;s Teamsters / were in their prime / in 1960, / only one in ten / American government workers / belonged to a union; / now 36% do.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>当霍法的卡车司机工会 / 处于鼎盛时期 / 在1960年，/ 只有十分之一 / 美国政府工作人员 / 属于工会；/ 现在36%属于。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先合并Hoffa所属工会与1960年的鼎盛时期，再把两个时间的比例放在一起。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>当霍法的卡车司机工会  处于鼎盛时期  在1960年， 只有十分之一  美国政府工作人员  属于工会； 现在36%属于。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>1960年只有十分之一的政府雇员入会，如今比例是36%。</p>\n</blockquote>\n<p>用“当……时”作背景；先旧后今比较。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>1960年霍法的卡车司机工会处于鼎盛时期时，只有十分之一的美国政府工作人员属于工会；而现在这一比例达到36%。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>now 36% do里的do替代belonged to a union，不是代表工作。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>1960年霍法的卡车司机工会处于鼎盛时期时，只有十分之一的美国政府工作人员属于工会；而现在这一比例达到36%。</p>\n</blockquote>\n<h2>2. 第4段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Politicians have repeatedly &quot;backloaded&quot; public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Politicians have repeatedly / &quot;backloaded&quot; / public-sector pay deals, / keeping the pay increases modest / but adding to holidays / and especially pensions / that are already generous.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>政客们反复地 / &quot;后置加载&quot; / 公共部门薪酬协议，/ 保持薪资增长适度 / 但增加假期 / 特别是养老金 / 这些已经很慷慨了。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>将keeping和adding理解为backloaded的两种具体操作。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>政客们反复地  &quot;后置加载&quot;  公共部门薪酬协议， 保持薪资增长适度  但增加假期  特别是养老金  这些已经很慷慨了。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>政治家保持适度加薪，却增加假期和养老金。</p>\n</blockquote>\n<p>先解释利益后置，再用一方面、另一方面呈现两项安排。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>政客们反复&quot;后置加载&quot;公共部门薪酬协议，保持薪资增长适度，但增加假期，特别是本已慷慨的养老金。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>especially突出养老金；already generous说明养老金原已优厚。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>政客们反复&quot;后置加载&quot;公共部门薪酬协议，保持薪资增长适度，但增加假期，特别是本已慷慨的养老金。</p>\n</blockquote>\n<h2>3. 第7段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Bankers&#39; fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Bankers&#39; fat pay packets / have attracted much criticism, / but a public-sector system / that does not reward high achievers / may be a much bigger problem / for America.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>银行家的丰厚薪酬 / 已经引起了很多批评，/ 但一个公共部门体系 / 不奖励高成就者的 / 可能是一个更大的问题 / 对美国来说。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先译对银行家高薪的批评，再通过but接出作者重点。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>银行家的丰厚薪酬  已经引起了很多批评， 但一个公共部门体系  不奖励高成就者的  可能是一个更大的问题  对美国来说。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>不奖励优秀者的公共部门制度可能是更大的问题。</p>\n</blockquote>\n<p>保留先让步后重点的顺序，用“但”把公共部门问题放在后面。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>银行家的丰厚薪酬已经引起了很多批评，但一个不奖励高成就者的公共部门体系可能是美国面临的更大问题。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>may保留可能性；much bigger是更大，而非唯一问题。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>银行家的丰厚薪酬已经引起了很多批评，但一个不奖励高成就者的公共部门体系可能是美国面临的更大问题。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全
