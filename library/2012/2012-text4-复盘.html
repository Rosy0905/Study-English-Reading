正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>It can be learned from the first paragraph that ______.</p>\n<p>从第一段可以知道什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。</p>\n<p>题干指定第一段，看1960、now、2009三处数量怎样变化。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<h3>A. Teamsters still have a large body of members</h3>\n<blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Teamsters工会现在仍拥有庞大的会员群体。</p>\n</blockquote>\n<p><code>still</code>指现在，但<code>Teamsters</code>旁边的时间是<code>in 1960</code>，后面的<code>now</code>统计的是<code>government workers</code>。</p>\n<p>先把句子里的两组人分开：<code>When</code>引出的背景是<code>Hoffa</code>的<code>Teamsters</code>，时间在1960年；<code>only one in ten</code>与<code>now 36%</code>的主语则是<code>American government workers</code>，统计政府雇员有多少加入了工会。这个<code>a union</code>也没有限定为<code>Teamsters</code>。</p>\n<p><code>A</code>却要说明同一个具体组织“现在仍然有很多会员”，<code>still</code>还把它的过去和现在连成了持续状态。原段的时间确实前后变化了，统计对象却不是<code>Teamsters</code>的会员总量。</p>\n<p>把36%移到<code>Teamsters</code>名下，会同时换掉统计对象和比例的分母；也不能因为<code>Hoffa</code>曾领导该组织，就把后面的所有政府雇员工会都归到他名下。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>1960年Hoffa领导的Teamsters处于鼎盛时期，当时美国政府雇员只有十分之一加入工会；如今这一比例是36%。</p>\n</blockquote>\n<p>作者借Hoffa的假设与Teamsters的过去盛况起笔，随即把统计对象转到政府雇员，再比较公共、私营部门会员数量。文章没有继续追踪Teamsters自身今日的规模。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Teamsters had many members in 1960 and still retain a large membership today.</p>\n<p>Teamsters在1960年有很多会员，今天也仍保持庞大的会员规模。</p>\n</blockquote>\n<p>A需要同一组织过去与现在的规模对照。实际是Teamsters的过去与公共部门入会情况的变化相接；时间有今昔，对象却不能随意沿用。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Jimmy Hoffa used to work as a civil servant</h3>\n<blockquote>\n<p>Jimmy Hoffa过去当过公务员。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Jimmy Hoffa过去当过公务员。</p>\n</blockquote>\n<p><code>used to</code>与<code>If</code>...<code>were alive</code>...<code>would represent</code>比较，后者是假设今天他会代表谁。</p>\n<p>开头先设想<code>Hoffa</code>“如果今天还活着”，然后说他“可能会代表公务员”。<code>were alive</code>与<code>would probably</code>把这件事放在假设的今天，<code>represent</code>说明他作为工会人物替哪一群人说话。</p>\n<p><code>B</code>的<code>used to</code>却要求把<code>Hoffa</code>过去的职业确定为公务员：时间从假设的现在变成已经发生的过去，动作又从代表他人变成自己任职。一个工会人士代表公务员，并不要求他本人先当过公务员，开头的<code>trade unionist</code>也正是在说明他的工会身份。</p>\n<p>句子的作用是借<code>Hoffa</code>会代表谁来引出会员重心的变化，不能把这种设想当成<code>Hoffa</code>的个人履历。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n<p>如果工会人士Jimmy Hoffa今天仍然在世，他很可能会代表公务员。</p>\n</blockquote>\n<p>开头的反事实设想用来引出工会重心转向公共部门：若昔日工会人物活到今天，他可能替另一群劳动者发声。它没有在介绍他的从业履历。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Jimmy Hoffa once held a job in the civil service.</p>\n<p>Jimmy Hoffa曾在政府公务部门任职。</p>\n</blockquote>\n<p>B需要过去任职的事实。原文<code>If ... were alive today</code>是假设的今天，<code>represent</code>是代表他人；两处都不能改成过去自己任职。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. unions have enlarged their public-sector membership</h3>\n<blockquote>\n<p>工会扩大了公共部门的会员规模。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>政府雇员入会比例从十分之一升至36%，公共部门会员数又超过私营部门。作者用两种比较共同突出工会会员重心向公共部门扩大。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会扩大了公共部门的会员规模。</p>\n</blockquote>\n<p><code>enlarged</code>对应<code>one in ten</code>到<code>now 36%</code>，2009年的数量比较继续写公共部门。</p>\n<p><code>C</code>把对象限定在工会的<code>public-sector membership</code>，正好接上本段反复比较的公共部门会员力量。1960年，十个政府雇员中只有一个入会；<code>now 36%</code> <code>do</code>中的<code>do</code>承接<code>belonged to a union</code>，说明今天政府雇员加入工会的比例明显提高。</p>\n<p>下一句继续用2009年公共部门会员数超过私营部门会员数，说明公共部门在工会中的分量已经变大。两句采用的统计方式不同：一句比较同类工作人员前后的入会比例，一句比较公共、私营部门的会员数量；不能把它们算成同一组增长率，但它们都围绕公共部门这一块展开。</p>\n<p><code>C</code>概括的就是这种扩张，没有说所有工会总人数都增长，也没有把范围缩成<code>Teamsters</code>一家。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n<p>1960年美国政府雇员只有十分之一入会，如今为36%。2009年，美国公共部门的工会会员数量超过了私营部门。</p>\n</blockquote>\n<p>第一段从假设Hoffa今天代表谁，走到政府雇员入会比例的今昔变化，再落到2009年公共部门会员数量超过私营部门。这些材料都在说明公共部门在工会中的分量增加。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector workers have become a larger part of the union movement as union membership has expanded in that sector.</p>\n<p>随着公共部门工会会员的发展，公共部门工作人员在工会运动中占有了更大分量。</p>\n</blockquote>\n<p>C能接住两组数据共同呈现的扩张方向。入会比例与部门间人数不能算成同一增长率，但二者都围绕公共部门会员力量展开，没有转成某一家工会或政府态度的变化。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. the government has improved its relationship with unionists</h3>\n<blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p><code>relationship</code>需要双方怎样相处的内容，而第一段给的是<code>membership</code>数量。</p>\n<p><code>D</code>的主语是<code>the government</code>，动作是<code>has improved its relationship</code>，要求有政府与工会成员如何相处的前后比较。第一段的<code>government workers</code>则是一群人的职业归属，后面的<code>belonged to a union</code>说明他们是否入会；政府本身没有在这些数字里采取改善关系的行动。</p>\n<p>即使政府雇员入会比例从10%升到36%，这个变化仍只回答“多少人加入工会”，不能回答双方是更合作还是更对立。若把入会人数增加直接写成政府关系改善，就把工作人员的组织选择当成了政府的态度和行为。</p>\n<p><code>D</code>的<code>improved</code>还多出“比以前更好”的评价，段中的<code>now</code>只让会员比例作前后比较，并没有让关系好坏作同样比较。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do</p>\n<p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n<p>1960年美国政府雇员只有十分之一入会，如今为36%。2009年，美国公共部门的工会会员数量超过了私营部门。</p>\n</blockquote>\n<p>作者连续给出会员比例和人数，未转向政府是否更愿意合作、谈判或支持工会。政府在段中主要用于限定雇员所属部门。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The government has become more cooperative with unions, improving its relationship with their members.</p>\n<p>政府与工会更加合作，改善了同工会成员的关系。</p>\n</blockquote>\n<p>D需要政府与工会相处方式的前后对照。实际的前后对照只给入会比例，雇员加入工会不能自动当作雇主改善关系的行动。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. C</strong></p>\n</blockquote>\n<ul>\n<li>A：1960年的Teamsters只是时间背景，后面的10%与36%统计政府雇员加入工会的比例。A把这些数字安到Teamsters一家，并要求证明它现在仍有很多会员。</li>\n<li>B：原句是假设Hoffa今天仍在世，可能代表公务员。B却把这件事写成他过去确实担任过公务员，时间与身份关系都变了。</li>\n<li>C：政府雇员入会比例从十分之一升至36%，公共部门会员数又超过私营部门。作者用两种比较共同突出工会会员重心向公共部门扩大。</li>\n<li>D：政府雇员入会更多，描述的是工作人员的组织选择；D把它变成政府与工会关系变好，原段没有比较这段关系的好坏。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>Which of the following is true of Paragraph 2?</p>\n<p>第二段哪一项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。</p>\n<p>题干指定第二段，分别看三个原因，不把成员特点当作入会条件。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n<h3>A. Public-sector unions are prudent in taking actions.</h3>\n<blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p><code>prudent</code>要看它们行动前是否小心；第一条实际写的是行动后不太承担<code>consequences</code>。</p>\n<p>第一条原因是公共部门工会<code>can shut things down</code>，而且<code>without suffering much in the way of consequences</code>。前半句写它们能让工作停下来，后半句写这样做所承担的后果不大。</p>\n<p><code>A</code>的<code>prudent in taking actions</code>则评价它们采取行动时小心、克制，是行动前的判断和行为方式。后果小可能来自它们所处的地位或承担责任的安排，并不能反过来证明它们每次都谨慎选择行动。这里尤其不能把<code>without suffering much</code>理解成“因为谨慎，所以没有出事”：原句没有这个<code>because</code>关系，也没有说它们避免了停摆，反而把能停摆列为自身的优势。</p>\n<p><code>A</code>把低代价当成慎重行事的结果，加入了原句并未建立的解释。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n<p>首先，它们可以让工作停下来，却不太因此承担不利后果。</p>\n</blockquote>\n<p>作者列出公共部门工会的有利条件，第一条就是可以使工作停下来而较少受损。这一条解释它们的处境，不是在追踪行动前的决策过程。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector unions carefully weigh the risks before deciding whether to take action.</p>\n<p>公共部门工会在决定行动前，会仔细权衡风险。</p>\n</blockquote>\n<p>A需要谨慎选择行动的过程。原文只说行动之后承担的后果少，不能从结果代价小反推行动前必然小心，更不能替句子加上这个因果。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Education is required for public-sector union membership.</h3>\n<blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>mostly well-educated</code>描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>受教育是取得公共部门工会会员资格的必要条件。</p>\n</blockquote>\n<p><code>required</code>把<code>well-educated</code>读成门槛，原文却是<code>they are mostly</code>和<code>a quarter have</code>。</p>\n<p>原文第二条先说<code>they are mostly bright and well-educated</code>，再用四分之一公共部门工作人员有大学学位说明教育状况。<code>mostly</code>描述的是这群人通常具有什么特点，<code>a quarter</code>则是在数已有工作人员中有多少取得某种学历。</p>\n<p><code>B</code>的<code>Education is required for</code>...换成“教育是某件事的必要条件”，必须先有一个准入要求，才能推出没有这种教育便不能取得相应资格。</p>\n<p>这里不能把<code>well-educated</code>直接当作<code>required</code>，也不能把大学学位的比例当作工会公布的条件。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Second, they are mostly bright and well-educated.</p>\n<p>A quarter of America’s public-sector workers have a university degree.</p>\n<p>其次，他们大多聪明且受过良好教育。美国公共部门工作人员中有四分之一拥有大学学位。</p>\n</blockquote>\n<p>第二条原因先概括群体受教育程度，再给大学学位比例。这是在说明工会成员为什么有优势，没有接出招收会员的规定。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A specified level of education is a condition for joining a public-sector union.</p>\n<p>达到规定的受教育程度，是加入公共部门工会的条件。</p>\n</blockquote>\n<p>B需要明文或明确的准入条件，实际只有已在群体中的人具有什么学历。成员常见特点不能直接改成每个申请者都必须满足的门槛。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Labor Party has long been fighting against public-sector unions.</h3>\n<blockquote>\n<p>工党长期反对公共部门工会。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Britain’s Labor Party, as its name implies, has long been associated with trade unionism.</p>\n<p>Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工党长期反对公共部门工会。</p>\n</blockquote>\n<p><code>fighting against</code>与<code>has long been associated</code>及<code>owes his position</code>方向相反。</p>\n<p><code>C</code>的<code>has long been</code>确实与原文<code>has long been</code>在时间上相接，但接下来要看长期保持的究竟是什么关系。原句是<code>Labor Party</code>长期与<code>trade unionism</code>有联系，紧跟着又说现任领袖<code>Miliband</code>的职位要归功于公共部门工会的选票。</p>\n<p>前一句给出长期联系，后一句给出这份联系如何具体帮助工党领袖取得职位。<code>C</code>却把长期关系写成<code>fighting against public-sector unions</code>，表示工党持续与公共部门工会对抗。这里不能因为都是政治关系就把<code>associated with</code>和<code>fighting against</code>当作同一方向；更不能越过选票支持这一句，把它读成反对。</p>\n<p>原段这一组句子的联系方向是工会支持并帮助工党政治人物，<code>C</code>说的却是长期对抗。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Britain’s Labor Party, as its name implies, has long been associated with trade unionism.</p>\n<p>Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n<p>英国工党长期与工会运动有联系。其现任领袖Ed Miliband的职位要归功于公共部门工会的选票。</p>\n</blockquote>\n<p>作者先给长期关联，再用Miliband依靠工会选票获得职位作例子。后句具体说明这种政治联系怎样发挥支持作用。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Labour Party has long opposed public-sector unions and fought their demands.</p>\n<p>工党长期反对公共部门工会，并与其诉求对抗。</p>\n</blockquote>\n<p>C需要后文把长期关系展开成反对。实际举的是工会选票帮助领袖获得职位，不能只保留<code>has long been</code>，把与它相连的关系方向倒过来。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Public-sector unions seldom get in trouble for their actions.</h3>\n<blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>without suffering much ... consequences</code>说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p><code>seldom get in trouble</code>接上<code>without suffering much</code>...<code>consequences</code>，都是行动后果较轻。</p>\n<p><code>D</code>说工会很少因自己的行动陷入麻烦，要对照第一条中行动与后果的连接来看。原文把<code>can shut things down</code>与<code>without suffering much</code>直接接在一起：它们能够让工作停摆，却不太因此承受不利后果。</p>\n<p>因此，<code>D</code>的<code>for their actions</code>正好承接“做了停摆这样的事仍不太受损”，<code>get in trouble</code>则把这些不利后果概括成麻烦。原文的<code>much</code>主要说所受后果不大，<code>seldom</code>用“很少”表达通常不容易惹上麻烦，两者并非逐字同义，但都保留了工会行动代价较低这一层。</p>\n<p><code>D</code>也没有把它夸张成任何行为都合法、永远不会受处罚；它保留了可能有例外的余地。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>First, they can shut things down without suffering much in the way of consequences.</p>\n<p>首先，它们可以让工作停下来，却不太因此承担不利后果。</p>\n</blockquote>\n<p>作者在解释公共部门工会为何有力量，先写它们能够让工作停摆，再指出这种行动不太使自身受损。行动能力与所付代价在同一句中对照。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector unions can take disruptive action while facing relatively few adverse consequences.</p>\n<p>公共部门工会可以采取造成停摆的行动，却较少面对不利后果。</p>\n</blockquote>\n<p>D接住的是行动后果较轻，原句不需要另行证明工会格外谨慎。<code>seldom</code>也没有扩大成永远不受处罚，因此保留了这项概括的余地。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>37题结论</h3>\n<blockquote>\n<p><strong>37. D</strong></p>\n</blockquote>\n<ul>\n<li>A：原文说工会即使让工作停摆，也不太承担后果。A把行动代价小改成行动前很谨慎，并没有保留所描述的优势。</li>\n<li>B：mostly well-educated描述现有群体特点，大学学历比例也只是统计。B把这些描述改成入会必须满足的资格要求。</li>\n<li>C：工党长期与工会运动有联系，领袖还得到公共部门工会的选票支持。C把这种联系和支持改成长期对抗。</li>\n<li>D：without suffering much ... consequences说明工会行动后承担的代价较小，D用很少因此惹上麻烦概括这一有利处境。</li>\n</ul>\n<h2>38题</h2>\n<blockquote>\n<p>It can be learned from Paragraph 4 that the income in the state sector is ______.</p>\n<p>第四段说明公共部门收入有何特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解与推断题：保留题干限定，用原文的主语、对象、关系及程度逐项核对。</p>\n<p>题干指定第四段，先读平均工资的比较，再看But以后福利与薪酬安排怎样展开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>But the real gains come in benefits and work practices.</p>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n</blockquote>\n<h3>A. illegally secured</h3>\n<blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入通过非法方式获得。</p>\n</blockquote>\n<p><code>A</code>的<code>illegally</code>要求核对收入取得是否合法；回看第三句<code>backloaded pay deals</code>及其<code>keeping</code>...<code>but adding</code>...的解释，确认这个动作具体写的是薪酬怎样安排。</p>\n<p><code>A</code>的<code>illegally</code>把收入处理的方式判为违法，要找到的应是某种取得收入的行为违反规定。原句却在解释<code>backloaded pay deals</code>怎样运作：工资涨幅保持不大，更多利益放进假期，尤其放进未来支付的养老金。</p>\n<p>这是报酬支付形式和时间的安排，不是把合法收入与非法收入相比较。引号中的<code>backloaded</code>也不是“非法”的替代说法；后面的<code>keeping</code>...<code>but adding</code>...已经用具体安排解释它，不能因一个词带引号就推成违法。养老金<code>already generous</code>说明原本待遇丰厚，评价的仍是待遇的高低，不是其法律性质。</p>\n<p><code>A</code>把原句的工资与福利安排改写为违法取得收入，判断对象和依据均发生了变化。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>政治人物多次把公共部门薪酬协议的收益安排在后面，保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>作者从平均工资转向福利，再解释政治人物怎样把报酬增加放到假期和未来养老金中。后续展开的是支付形式与时间，并不是法律责任。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector workers obtain part of their income through practices that violate the law.</p>\n<p>公共部门工作人员通过违法做法取得部分收入。</p>\n</blockquote>\n<p>A需要原文把具体做法与违法联系起来。<code>backloaded</code>后已有工资与福利的说明，它描述收益向后安排，不是非法的同义词。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. indirectly augmented</h3>\n<blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>工资增幅不大，收益却通过假期和养老金增加。B的<code>indirectly</code>概括这种不完全体现在当期工资上的增加方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入间接增加。</p>\n</blockquote>\n<p><code>indirectly</code>对应<code>pay increases modest but adding to holidays and pensions</code>，增量不只体现在工资。</p>\n<p>第一句的<code>average wages</code>只谈公共、私营部门平均工资谁高；第二句<code>But the real gains come in benefits and work practices</code>则转向真正的收益由哪里取得。第三句把这一转向展开：<code>keeping the pay increases modest</code>让当期工资涨幅维持在不大的程度，<code>but adding to holidays and especially pensions</code>却让雇员在假期、退休待遇方面得到更多。</p>\n<p><code>backloaded</code>进一步说明薪酬协议把利益放在后面，尤其不是全部直接加到眼前的工资数字中。<code>B</code>的<code>indirectly</code>正概括这种增加路径：当期加薪不大，总待遇仍可通过福利提高。</p>\n<p>题干使用<code>income</code>而非单独的<code>cash wages</code>，需要把这些收益合起来理解；<code>B</code>既保留了增加，也保留了增加通过另一种报酬形式实现这一关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>真正的收益来自福利与工作安排。政治人物保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>段落先比较工资水平，随即用<code>But</code>说真正收益在福利和工作安排，再以小幅工资增长与更多假期、养老金作说明。后面的例子解释前面的收益来源。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-sector compensation rises through improved benefits and pensions even when immediate pay increases remain modest.</p>\n<p>即使眼前加薪不多，公共部门总体待遇仍通过福利和养老金的改善而提高。</p>\n</blockquote>\n<p>B要求的是间接增加的路径，这条路径已由<code>keeping ... modest but adding ...</code>给出。它没有把假期都说成当期现金收入，而是在概括工资之外的待遇收益。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. excessively increased</h3>\n<blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入过度增长。</p>\n</blockquote>\n<p><code>excessively increased</code>要和<code>keeping the pay increases modest</code>比较；也要看<code>but adding</code>究竟在解释增幅，还是待遇的组成。</p>\n<p><code>C</code>在“收入增加”之外又加上<code>excessively</code>，把增长幅度判为过度。这里要分清三个位置：平均工资<code>higher</code>说的是公共、私营部门之间的现有水平；<code>pay increases modest</code>说当期工资涨得不多；<code>pensions already generous</code>说养老金原本已经丰厚。</p>\n<p>前后两个高水平的描述都不能直接当成收入增长幅度的测量。尤其<code>already generous</code>强调原来的待遇，<code>C</code>却要评价此次或一段时期内总收入增加得是否过多，这是把现有水平换成增长幅度。段落后半确实有<code>adding</code>，但它与<code>keeping</code>...<code>modest</code>组成的是工资和福利两种收益路径的对照。</p>\n<p>因而不能简单说<code>C</code>在现实中绝不可能发生；问题在于<code>C</code>没有保留这一对照，反而把本段未作整体衡量的幅度判断当成了段落结论。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>政治人物多次把公共部门薪酬协议的收益安排在后面，保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>作者没有列总收入增长率并据此判定过度，而是依次对照工资水平、当期增幅与福利增加。<code>modest</code>和<code>adding</code>被放在一起说明不同报酬组成。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Overall public-sector income has risen by an excessive amount.</p>\n<p>公共部门的总体收入增长过多。</p>\n</blockquote>\n<p>C需要评价总体增幅过大。实际<code>modest</code>限定当期工资，<code>already generous</code>描述养老金原有水平，不能把不同指标拼成一个未经整体比较的增长幅度结论。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. fairly adjusted</h3>\n<blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p><code>D</code>的<code>fairly adjusted</code>要求检验调整是否公平；回看平均工资比较及第三句<code>keeping</code>...<code>but adding</code>...，分清这些句子是在描述调整方式还是论证分配标准。</p>\n<p><code>D</code>同时作了两层判断：收入经过调整，而且这种调整公平。原段确实写政治人物安排薪酬协议，分别控制工资涨幅、增加假期和养老金，因而“有调整”可以找到对应。</p>\n<p>但<code>fairly</code>要比较谁应得到多少、按什么条件分配，不能只看调整存在就给出这个评价。第一句说公共部门平均工资高于私营部门，最后又说养老金已经丰厚，段落是把工资表面增长不大与福利上继续得益放在一起说明。<code>D</code>却把这个分配方式直接评价为公平，略去了原句强调的两种报酬之间的反差。</p>\n<p>这里既不能用工资较高证明一切安排不公平，也不能用加薪幅度<code>modest</code>证明所有待遇调整公平；这两种价值结论都不是这组工资、福利对照本身的意思。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>在许多富裕国家，公共部门平均工资高于私营部门。政治人物保持不大的工资涨幅，却增加假期，尤其增加本已丰厚的养老金。</p>\n</blockquote>\n<p>作者将公共部门工资较高与福利继续增加并列，揭示待遇收益的实际构成。没有接着论证不同群体各得其所，或这种安排按何种原则合理。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The changes in public-sector compensation distribute rewards fairly among the people concerned.</p>\n<p>公共部门薪酬的调整，在相关人群之间公平分配了报酬。</p>\n</blockquote>\n<p>D需要公平分配的判断依据。实际小幅加薪并不能单独证明公平，工资较高也不能自动证明一切不公平；本段真正解释的是报酬增加的方式。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>38题结论</h3>\n<blockquote>\n<p><strong>38. B</strong></p>\n</blockquote>\n<ul>\n<li>A：工资涨幅、假期和养老金解释薪酬怎样安排，没有说明这种收入违反哪项法律。A把待遇安排直接判为非法取得。</li>\n<li>B：工资增幅不大，收益却通过假期和养老金增加。B的indirectly概括这种不完全体现在当期工资上的增加方式。</li>\n<li>C：公共部门工资水平较高、养老金原本丰厚，不等于总收入增长幅度已被判为过度。原段重点是收益从工资转到福利的增加路径。</li>\n<li>D：原段说明薪酬有所调整以及怎样调整，却没有给出证明这种分配公平的标准。D在调整事实之外增加了公平评价。</li>\n</ul>\n<h2>39题</h2>\n<blockquote>\n<p>The example of the unions in Wisconsin shows that unions ______.</p>\n<p>Wisconsin工会的例子说明工会怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干点出Wisconsin，定位第六段。段首谈政治人物开始行动，要连同上一段明确写出的改革争议一起读，才知道例子在接着说明什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n</blockquote>\n<h3>A. often run against the current political system</h3>\n<blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p>先把反对对象找准。第五段的<code>Reform has been vigorously opposed</code>明确说改革遭到抵制，第六段再写工会动员支持者<code>against Scott Walker</code>。这两处支持的是对具体改革和州长的反对。</p>\n<p>A的<code>current political system</code>却要求把对象扩大到整个现行政治制度。工会反对一位州长推行的改变，也可能正是为了维护它在既有制度中的利益，不能由反对个人或措施直接推出反对整个制度。</p>\n<p><code>often</code>还提出经常如此的概括，本例只给一次具体动员。C不用跨出改革争议的范围，就能解释例子为何跟在改革受阻之后；A扩大的对象与频率均没有相应证据。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Reform has been vigorously opposed</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>改革受到强烈反对。在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。</p>\n</blockquote>\n<p>前段先说改革受到抵制，本段再写政治家开始行动、Wisconsin工会动员反对州长。这个先后是在展示改革如何遇到阻力，并未把一次对抗提升为对政治制度的普遍反对。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Unions repeatedly challenge the existing political system itself.</p>\n<p>工会反复挑战现行政治制度本身。</p>\n</blockquote>\n<p>A需要把反对对象明确扩大到制度本身。实际工会也可能在维护既有待遇而反对改革，反对州长并不直接说明它反对整个政治制度；C对改革阻力的概括更贴合例子的上下文。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. can change people’s political attitudes</h3>\n<blockquote>\n<p>工会能改变人们的政治态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>rallied supporters</code>写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会能改变人们的政治态度。</p>\n</blockquote>\n<p><code>B</code>的<code>change political attitudes</code>要核对人们是否改变立场；回看<code>rallied thousands of supporters against Scott Walker</code>，分清动员支持者采取行动与改变他们先前的政治观念。</p>\n<p><code>B</code>要说明工会能改变人们的政治态度，重点在“改变”：这些人原来站在哪一边，受工会作用后又转到哪一边。原句的<code>rallied thousands of supporters</code>写工会召集、动员数千名支持者，<code>against Scott Walker</code>写这场动员所针对的人。</p>\n<p><code>supporters</code>与<code>against</code>能够交代队伍和对抗方向，却不是支持者态度改变前后的两次记录；<code>rallied</code>强调让支持者集合采取行动，也不能直接翻成把原来反对工会的人说服了。前段先交代改革遭到反对，这个例子延续的是反对怎样表现为现实行动，而不是解释人们怎样改变政治信念。</p>\n<p><code>B</code>把动员已经称作<code>supporters</code>的人，改成了改变他们的政治态度；行动规模和观念变化不是这句话交代的同一件事。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。</p>\n</blockquote>\n<p>政治人物开始整顿之后，工会召集支持者对抗，例子的作用是把阻力写成具体行动。支持者的数量说明动员规模，不记录他们原来持什么观点。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The unions persuaded people to change their political views.</p>\n<p>工会说服人们改变了政治观点。</p>\n</blockquote>\n<p>B需要一次态度转变。实际这些人已被称为<code>supporters</code>，句子只说他们被动员起来；集合采取行动不能自动当作原有观点被改变。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. may be a barrier to public-sector reforms</h3>\n<blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p><code>barrier to public-sector reforms</code>要核对两部分：这里有没有公共部门改革，工会有没有形成阻力。第五段先明确说<code>Reform has been vigorously opposed</code>，并举教育改革长期争斗的情况。</p>\n<p>第六段接着写代价越来越清楚，政治家<code>have begun to clamp down</code>；Wisconsin的工会随即动员支持者反对强硬州长。这就把改革措施与阻碍它推进的组织行动接在了一起。</p>\n<p>C说<code>may be a barrier</code>，没有宣称所有改革都会失败，也没有说工会掌握了政府控制权。它用与上下文相同的改革范围概括例子，既说明了行动内容，也回答了举例要支持什么。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down</p>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>改革受到强烈反对，尤其在教育领域，特许学校、学院和绩效工资都经历长期争斗。其他人承担的代价渐趋明显后，政治人物开始整顿。在Wisconsin，工会动员了数千名支持者反对州长Scott Walker。</p>\n</blockquote>\n<p>作者从教育改革经历长期争斗，写到代价渐明、政治人物开始整顿，再用Wisconsin的抗议表现工会的回应。例子在具体展示改革推进时会碰到什么阻力。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>When politicians try to reform the public sector, union mobilisation can create obstacles to those changes.</p>\n<p>政治人物试图改革公共部门时，工会的动员可能为这些改变设置障碍。</p>\n</blockquote>\n<p>C所需的改革背景与阻碍行动分别由前段和这个例子提供。<code>may be a barrier</code>只说明可能形成阻力，没有说工会控制政府或所有改革必然失败，因此范围合适。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. are dominant in the government</h3>\n<blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>工会在政府中占统治地位。</p>\n</blockquote>\n<p><code>D</code>要证明工会在政府中具有支配地位；第六段实际写的是工会方面的支持者与州长发生对抗。</p>\n<p><code>D</code>把工会的地位定为<code>dominant in the government</code>，要求它们在政府内部处于支配位置，能够主导政府方向。<code>Wisconsin</code>一句中的政府人物是州长<code>Scott Walker</code>，工会和数千名支持者则站在<code>against</code>他的这一边；这幅关系是双方正在对抗，不能直接读成工会已经占据政府主导地位。</p>\n<p>支持者很多可以说明工会能够施加压力，但“能对州长施压”与“在政府中有支配地位”之间还差着谁掌握决策这一层。前句还写政治人物因其他人承担的代价开始采取行动，例子呈现的是这些行动遇到的反对，而不是政府已按工会意愿作出决定。</p>\n<p>把反对声势直接当成政府控制权，会把政府外部或对面的施压换成政府内部的统治地位。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor</p>\n<p>在Wisconsin，工会动员了数千名支持者反对强硬的共和党州长Scott Walker。</p>\n</blockquote>\n<p>政治人物开始采取行动，工会则组织反对。作者写双方冲突，没有接出州长服从工会或政府政策由工会决定的结果。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The unions control the government’s decisions and set its policy direction.</p>\n<p>工会控制政府决策，决定其政策方向。</p>\n</blockquote>\n<p>D需要政府中的支配地位，仅有支持者数量与反对行动还不够。能向决策者施压，与已经代替决策者控制政府，是不同关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>39题结论</h3>\n<blockquote>\n<p><strong>39. C</strong></p>\n</blockquote>\n<ul>\n<li>A：工会反对的是具体改革和推行改革的州长，A把对象扩大为整个现行政治制度，还加上经常发生的概括，超出了这个例子的范围。</li>\n<li>B：rallied supporters写动员支持者参加反对行动。B却要求证明人们的政治态度发生变化，原句没有交代其立场改变前后的情况。</li>\n<li>C：前段明确说改革遭到抵制，后段举工会动员支持者反对采取行动的州长，C把这项动员接回了它所支持的改革阻力。</li>\n<li>D：组织数千人向州长施压能够说明反对力量，但不能证明工会已在政府内部掌握主导权。原句呈现的是对抗，而非控制政府的结果。</li>\n</ul>\n<h2>40题</h2>\n<blockquote>\n<p>John Donahue’s attitude towards the public-sector system is one of ______.</p>\n<p>John Donahue对公共部门制度是什么态度？</p>\n</blockquote>\n<h3>题型</h3>\n<p>态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。</p>\n<p>题干点名John Donahue，直接看末段他指出制度适合谁、对谁不利。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<h3>A. disapproval</h3>\n<blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p><code>disapproval</code>对应<code>bad for high achievers</code>，评价落在优秀人才得不到合适回报。</p>\n<p>题干问的是<code>Donahue</code>对公共部门制度的态度，不能把末段每一句都算成他本人说的话。直接属于<code>points out</code>的内容先说，这种公务员文化适合想<code>stay put</code>的人；<code>but</code>随即转向它对<code>high achievers</code>有害。</p>\n<p>这里的对照并非平列两个同样值得认可的优点，而是把安于现状者能够适应与表现突出者反而吃亏放在一起，指出激励上的倒置。<code>A</code>的<code>disapproval</code>只要求看出他不认可这项制度安排，不要求他把公共部门的一切都全盘否定。</p>\n<p><code>bad for</code>已经给出了负面的评价，<code>but</code>又说明“适合想原地不动的人”不是最后的赞扬结论。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>Donahue先说明哪类人适应这种文化，再用<code>but</code>落到高成就者吃亏。对照揭示制度怎样对待不同表现的人，负面评价是这一句的收束。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The system is unsatisfactory because it accommodates those who stay put while disadvantaging high achievers.</p>\n<p>这套制度令人不满，因为它适合安于现状者，却使高成就者处于不利地位。</p>\n</blockquote>\n<p>A只要求不认可当前安排，不需要Donahue谴责全部公共部门。<code>bad for high achievers</code>已经提供具体批评，前半句的<code>suit</code>也没有将这份批评变成赞美。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. appreciation</h3>\n<blockquote>\n<p>Donahue欣赏这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>suit</code>只说制度适合某类人，不等于Donahue欣赏制度。后面的<code>but ... bad for high achievers</code>给出了相反的整体评价方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue欣赏这种制度。</p>\n</blockquote>\n<p><code>appreciation</code>只能抓到<code>suit those who want to stay put</code>，却必须连着<code>but are bad for</code>读。</p>\n<p><code>B</code>的<code>appreciation</code>要求<code>Donahue</code>在肯定、欣赏这种制度。最容易让人停在这里的是<code>suit those who want to stay put</code>，因为<code>suit</code>看上去像“适合”这一正面词。</p>\n<p>但这半句评价的是制度适合哪类人，尚没有说明<code>Donahue</code>本人赞成制度；后面<code>but are bad for high achievers</code>才把另一群人受到的不利影响明确摆出来。尤其<code>stay put</code>与<code>high achievers</code>相对照，制度给安于现状的人留下舒服位置，却使高成就者受损，这一对照是在揭示制度问题。</p>\n<p>若选<code>B</code>，就把局部“适合某些人”替换成说话人对整体安排的赞赏，并且把<code>but</code>后的负面判断删掉了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>Donahue没有在制度适合部分人处停下，而是继续指出对优秀者的不利。这个转折使两类人受到的不同待遇成为被批评的问题。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Donahue welcomes the system and regards its treatment of employees as beneficial.</p>\n<p>Donahue欣赏这套制度，认为它对待雇员的方式有益。</p>\n</blockquote>\n<p>B需要说话人对这种安排表示肯定。实际前半句只是说明谁能适应，后半句明确指出谁受到损害；删掉转折后的判断，才可能把原句误读成欣赏。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. tolerance</h3>\n<blockquote>\n<p>Donahue容忍这种制度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>容忍需要在承认问题后仍表示接受。Donahue的句子直接指出对高成就者不利，没有给出仍愿意接受这种安排的态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue容忍这种制度。</p>\n</blockquote>\n<p><code>tolerance</code>需要“虽有问题仍接受”的意思；原句只有明确指出<code>suit</code>与<code>bad</code>的分配问题。</p>\n<p><code>tolerance</code>不是“语气没有很激烈”，而是在面对不理想的事物时仍表示接受或容许。<code>Donahue</code>这句话没有在<code>bad for high achievers</code>之后转向“尽管如此仍可以接受”，而是用<code>but</code>从“适合安于现状者”推进到“对高成就者有害”。</p>\n<p>因此，他实际呈现出来的态度动作是指出制度的缺陷，<code>C</code>却要求把这份批评继续推进成他愿意接受这种安排。不能因为他没有使用愤怒的词，就把明确的不利评价降成容忍；态度的判断要看他评价什么，而不是看语气是否激烈。</p>\n<p>这里的<code>suit</code>也不是他向制度作出的让步，它只交代哪类人适应这种制度，后半句仍在指出它不合理的结果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>句子由适合安于现状者转到对高成就者不利，结束在制度缺陷上，并未再转向保留制度的理由或对缺点的接纳。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Although the system disadvantages high achievers, Donahue is willing to accept it.</p>\n<p>尽管这套制度使高成就者吃亏，Donahue仍愿意接受它。</p>\n</blockquote>\n<p>C需要后半层“仍可接受”的态度。原文只有负面评价，语气不激烈也不等于容忍，不能替说话人添上尚未表达的接受。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. indifference</h3>\n<blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>把选项接回题干，完整命题是：</p>\n<blockquote>\n<p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p><code>indifference</code>与<code>points out</code>后面具体评价<code>bad for high achievers</code>冲突。</p>\n<p><code>D</code>的<code>indifference</code>表示对这套制度漠不关心，不在意它造成怎样的影响。<code>Donahue</code>却专门把制度对两类人的作用拆开说：一类人想<code>stay put</code>，另一类是<code>high achievers</code>，而且他用<code>bad</code>判断后一类人受到的不利影响。</p>\n<p>这不只是中性地报告“人各有不同”，而是在对制度的激励效果作出明确评价。<code>points out</code>本身可以只是指出一个事实，所以不能单靠“他开口说了话”就断定他关心；真正让<code>D</code>不合适的是他接着指出哪类人吃亏，并把这种影响判为<code>bad</code>。</p>\n<p>评价已有对象和方向，<code>D</code>却把这份明确的负面判断抹成不关心好坏。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n<p>Donahue指出，西方公务部门的文化规范适合那些想原地不动的人，却不利于高成就者。</p>\n</blockquote>\n<p>他比较两类人在制度中的处境，并用<code>bad</code>评价高成就者受到的待遇。重点是制度产生的不利影响，而非不带倾向地列出群体差别。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Donahue shows no concern about how the system treats different kinds of employees.</p>\n<p>Donahue并不关心这套制度怎样对待不同类型的雇员。</p>\n</blockquote>\n<p>D需要不在意这些后果的态度。不能只因为他说了话就断定关心，但这里真正的依据是他把对优秀者的影响明确判为不利，这与漠不关心不相符。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>40题结论</h3>\n<blockquote>\n<p><strong>40. A</strong></p>\n</blockquote>\n<ul>\n<li>A：Donahue把适合安于现状者与不利于高成就者作对照，落点是制度的负面激励，足以支持不赞同这种安排。</li>\n<li>B：suit只说制度适合某类人，不等于Donahue欣赏制度。后面的but ... bad for high achievers给出了相反的整体评价方向。</li>\n<li>C：容忍需要在承认问题后仍表示接受。Donahue的句子直接指出对高成就者不利，没有给出仍愿意接受这种安排的态度。</li>\n<li>D：Donahue明确指出制度对高成就者不利，评价有具体对象和负面方向。D把这份评价改成对制度影响不关心。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：公共部门工会的兴起</strong>（段落1背景介绍） 历史对比：【1960年霍法时代：只有10%政府工作者属于工会 // 现在：36%属于工会】→ 2009年转折点：公共部门工会成员超过私营部门 → 英国情况：（公共部门50%+ // 私营部门15%）</p>\n<p>↓（原因分析）</p>\n<p><strong>逻辑层次2：公共部门工会繁荣的三大原因</strong>（段落2-3原因剖析） 三大原因：【1.可以让事情停摆而不受惩罚 + 2.成员聪明且受过良好教育（25%有大学学位）+ 3.主导中左翼政治（如英国工党）】→ 州层面影响力更大：（控制州预算的各个领域：教育、监狱、医疗）</p>\n<p>↓（具体表现）</p>\n<p><strong>逻辑层次3：公共部门的薪酬优势</strong>（段落4薪酬分析） 表面现象：公共部门平均工资高于私营部门 → 真正优势：【福利和工作实践：政客&quot;后置加载&quot;薪酬协议（工资增长适度 // 但假期和养老金大幅增加）】</p>\n<p>↓（负面影响）</p>\n<p><strong>逻辑层次4：工会对改革的阻碍</strong>（段落5-6改革困境） 改革阻力：【教育领域最严重：（特许学校、学院、绩效工资都遭反对）→ 教师工会反对优胜劣汰】→ 政治反击：（成本明确后政客开始限制）→ 威斯康星州案例：（工会集结反对共和党州长）// 但公共部门内部也有受害者</p>\n<p>↓（深层问题）</p>\n<p><strong>逻辑层次5：体系的根本缺陷</strong>（段落7问题本质） 文化问题：西方公务员体系适合安于现状者 // 不利于高成就者 → 薪酬上限：只有大学体育教练和总统年薪超25万 → 核心观点：【银行家高薪受批评 // 但不奖励高成就者的公共部门体系是更大问题】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：公共部门工会虽然发展迅速并获得诸多优势，但其对改革的阻碍和不利于高成就者的体系文化，可能对国家发展构成更大的问题。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. The rising share of public-sector union members</p>\n<p>B. Benefits that enlarge income beyond current pay</p>\n<p>C. An incentive system that fails high achievers</p>\n<p>D. The sources and reach of union power</p>\n<p>E. A guaranteed improvement in every public service</p>\n<p>F. Union resistance to changes in public services</p>\n<p>G. The disappearance of political connections</p>\n<p><strong>41.</strong></p>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their prime in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n<p><strong>42.</strong></p>\n<p>There are three reasons for the public-sector unions’ thriving. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now dominate left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions. At the state level their influence can be even more fearsome. Mark Baldassare of the Public Policy Institute of California points out that much of the state’s budget is patrolled by unions. The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p>\n<p><strong>43.</strong></p>\n<p>In many rich countries average wages in the state sector are higher than in the private one. But the real gains come in benefits and work practices. Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p><strong>44.</strong></p>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles. Even though there is plenty of evidence that the quality of the teachers is the most  important variable, teachers’ unions have fought against getting rid of bad ones and promoting good ones. As the cost to everyone else has become clearer, politicians have begun to clamp down. In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline Republican governor. But many within the public sector suffer under the current system, too.</p>\n<p><strong>45.</strong></p>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers. The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】A. The rising share of public-sector union members</p>\n<blockquote>\n<p>公共部门工会成员比例上升</p>\n</blockquote>\n<p>先比较1960年与现在的公共部门入会比例，再比较公私部门人数与英国状况。</p>\n<blockquote>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n</blockquote>\n<p>Hoffa当年代表私营部门卡车司机，假设他今天代表公务员，是用同一个工会人物衬出会员重心的变化，并不是写他的真实新工作。</p>\n<blockquote>\n<p>In 2009 the  number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<p><code>passed</code>把这种变化落实为人数上的超过：公共部门会员已多于私营部门会员。它继续说明会员构成，而没有转到政治联系。</p>\n<blockquote>\n<p>In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n</blockquote>\n<p>英国的<code>more than half</code>与<code>only about 15%</code>把同一公私部门差异放到另一国家中检验。因此标题要覆盖公共部门工会扩大的地位。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>历史人物的假设对照 → 美国公共部门会员比例增长且人数反超 → 英国公私部门比例对比</p>\n</blockquote>\n<p>rising share概括由十分之一到36%的增长，public-sector明确增长属于哪一部门。</p>\n<p>再看最强干扰项G：The disappearance of political connections。</p>\n<p>首段呈现会员构成变化，并没有政治联系消失的信息。</p>\n<p><strong>41题选A。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. The sources and reach of union power</p>\n<blockquote>\n<p>工会力量的来源及影响范围</p>\n</blockquote>\n<p>先列停工后果轻、教育程度和政治联系三种原因，再具体写工会如何影响州预算。</p>\n<blockquote>\n<p>There are three reasons for the public-sector unions’ thriving.</p>\n</blockquote>\n<p><code>three reasons</code>表明下面要解释工会为何繁荣，标题中的sources正对应这层原因。</p>\n<blockquote>\n<p>Some of their ties go back a long way.</p>\n</blockquote>\n<p><code>ties</code>接政治联系，说明工会的力量不仅来自停工行动和会员素质，还来自与政党的长期关系。</p>\n<blockquote>\n<p>The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p>\n</blockquote>\n<p>学校、监狱、医疗分别对应不同工会盯住的预算领域，把政治联系进一步落实为对公共支出的影响范围。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>繁荣的三项原因 → 长期政治联系 → 对学校、监狱、医疗预算的影响</p>\n</blockquote>\n<p>sources对应three reasons，reach对应从政党到学校、监狱、医疗的影响。</p>\n<p>再看最强干扰项E：A guaranteed improvement in every public service。</p>\n<p>有力量不等于改善服务；随后恰恰讨论这种力量可能抵制改革。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】B. Benefits that enlarge income beyond current pay</p>\n<blockquote>\n<p>在当期工资之外增加收入的福利</p>\n</blockquote>\n<p>先比较平均工资，再用But转入真正收益所在：福利和工作安排。</p>\n<blockquote>\n<p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n</blockquote>\n<p>平均工资比较先交代显性的工资优势，但这并非段落最终停留的收入形式。</p>\n<blockquote>\n<p>But the real gains come in benefits and work practices.</p>\n</blockquote>\n<p><code>But</code>与<code>real gains</code>把重心转到福利和工作安排，说明只比较当前工资会遗漏重要收益。</p>\n<blockquote>\n<p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<p><code>modest</code>与增加的假期、养老金构成对照：现金工资涨幅不大，待遇却通过别的项目增长。B能把这种间接增长保留下来。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>平均工资较高 → 真正收益在福利与安排 → 工资增幅适度而假期、养老金增加</p>\n</blockquote>\n<p>beyond current pay对应工资增幅适度而假期、养老金增加，保留收入增长的间接方式。</p>\n<p>再看最强干扰项A：The rising share of public-sector union members。</p>\n<p>A谈会员比例，不能回答本段收入怎样增加。</p>\n<p><strong>43题选B。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Union resistance to changes in public services</p>\n<blockquote>\n<p>工会对公共服务改革的抵制</p>\n</blockquote>\n<p>第五段先写教育改革受阻，第六段接政治家整顿和工会集结反对。</p>\n<blockquote>\n<p>Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced drawn-out battles.</p>\n</blockquote>\n<p><code>opposed</code>和<code>drawn-out battles</code>先把教育改革面对的阻力摆出来，改革与工会抵制是一组明确的对立关系。</p>\n<blockquote>\n<p>As the cost to everyone else has become clearer, politicians have begun to clamp down.</p>\n</blockquote>\n<p>成本逐渐清楚促使政治家着手整顿，随后工会动员反对州长；后一个例子继续展示改革为什么难以推进。</p>\n<blockquote>\n<p>But many within the public sector suffer under the current system, too.</p>\n</blockquote>\n<p>末句说公共部门内部也有人受损，纠正工会维护现状必然使全体雇员受益的想法，并给末段优秀者受损留下接口。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>教育改革遭抵制 → 政治家整顿引发工会动员 → 现状也损害部分公共部门雇员</p>\n</blockquote>\n<p>resistance同时覆盖fought against和rallied ... against；changes对应改革与整顿。</p>\n<p>再看最强干扰项E：A guaranteed improvement in every public service。</p>\n<p>遭抵制的改革并未保证成功，更没有所有公共服务必然改善的结论。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】C. An incentive system that fails high achievers</p>\n<blockquote>\n<p>未能奖励高成就者的激励制度</p>\n</blockquote>\n<p>引述Donahue指出制度适合守成者而不利成就突出者，末句将激励失效提升为更大问题。</p>\n<blockquote>\n<p>John Donahue at Harvard’s Kennedy School points out that the norms of culture in Western civil services suit those who want to stay put but is bad for high achievers.</p>\n</blockquote>\n<p><code>suit</code>与<code>bad for</code>比较制度对两类人的不同影响，焦点在成就突出者不能得到合适待遇。</p>\n<blockquote>\n<p>The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States.</p>\n</blockquote>\n<p>高收入者只限于少数特殊职位，具体说明一般公共雇员即便表现出色也缺少相应奖励空间。</p>\n<blockquote>\n<p>Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n</blockquote>\n<p>末句直接出现<code>does not reward high achievers</code>，把前面的待遇差别收束到激励失效；银行家的高薪只是用于比较问题轻重。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>守成者适应制度而优秀者受损 → 高薪只见于少数特殊职位 → 奖励卓越不足构成制度问题</p>\n</blockquote>\n<p>incentive system对应reward，fails high achievers对应bad for high achievers和does not reward。</p>\n<p>再看最强干扰项B：Benefits that enlarge income beyond current pay。</p>\n<p>养老金福利只是前文收益形式，不能概括末段对奖励卓越不足的批评。</p>\n<p><strong>45题选C。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Public-sector unions have become a growing presence in modern labour relations. In the United States their membership has expanded beyond that of unions in the private sector. The contrast suggests a question about why collective organisation has become so powerful in government employment.</p>\n<p><strong>B.</strong></p>\n<p>Improving those services has consequently become a political struggle. In Wisconsin, unions gathered supporters against a governor determined to impose change. Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.</p>\n<p><strong>C.</strong></p>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves. A system suited to people who wish to remain where they are may give too little recognition to outstanding performance. The unfairness is visible from inside the public sector as well as from the perspective of taxpayers.</p>\n<p><strong>D.</strong></p>\n<p>Those political connections give union influence a reach beyond the workplace. At state level, organised groups watch spending on schools, prisons and health care. Control over budgets matters because employment agreements determine not only immediate wages but also costs that will be paid much later.</p>\n<p><strong>E.</strong></p>\n<p>These later costs often take the form of benefits. Politicians may keep visible wage increases modest while adding holidays and generous pensions. The resulting income gain is indirect, which helps explain why looking only at the current pay rise misses part of the bargain.</p>\n<p><strong>F.</strong></p>\n<p>One answer to that question concerns the consequences of stopping work. Public-sector unions can interrupt services without suffering the same penalties that might follow in private business. Their members also tend to be educated, and their organisations have developed close connections with political parties.</p>\n<p><strong>G.</strong></p>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform. Education provides a clear example: efforts to reward effective teachers or remove ineffective ones encounter organised opposition. The issue is therefore not simply how much employees receive, but how services are improved.</p>\n<p><strong>H.</strong></p>\n<p>That failure to recognise performance points to a broader problem of incentives. Criticising high private-sector pay is easier than designing a public system that rewards achievement, but the second task remains essential. Union strength and the quality of public service should therefore be assessed as separate questions.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从会员增长提出力量来源问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>用州内抵制说明改革阻力</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明公共部门内部优秀者也受损</td>\n</tr>\n<tr>\n<td>D</td>\n<td>把政治联系接到预算与后期成本</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释工资之外的福利增长</td>\n</tr>\n<tr>\n<td>F</td>\n<td>列举行动后果及教育政治优势</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由利益保护转入教育改革受阻</td>\n</tr>\n<tr>\n<td>H</td>\n<td>落到奖励优秀的制度问题</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从会员增长提出力量来源问题 → 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本 → 解释工资之外的福利增长 → 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损 → 落到奖励优秀的制度问题</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The contrast suggests a question about why collective organisation has become so powerful in government employment.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>One answer to that question concerns the consequences of stopping work.</p>\n</blockquote>\n<p>A末句明确问工会为什么在政府雇佣中如此强大。F的<code>One answer to that question</code>承接这个why问题，给出停工后果不同这一原因。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Public-sector unions can interrupt services without suffering the same penalties that might follow in private business. Their members also tend to be educated, and their organisations have developed close connections with political parties.</p>\n</blockquote>\n<p>停工惩罚较轻、会员教育程度较高、组织同政党关系密切，连续补出力量的来源；最后出现的political parties使政治联系成为下一段可展开的对象。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Those political connections give union influence a reach beyond the workplace.</p>\n</blockquote>\n<p>D的<code>Those political connections</code>指回F末句的close connections，接着才能讨论这些联系如何超出工作场所、影响预算。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从会员增长提出力量来源问题 → 列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform.</p>\n</blockquote>\n<p>G的<code>The bargain</code>要求前面已经交代待遇交易，<code>existing benefits</code>也要求先有福利内容。A只提出力量来源问题，尚未提供这些承接对象；放G还会让D的Those political connections失去出处。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Their members also tend to be educated, and their organisations have developed close connections with political parties.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Those political connections give union influence a reach beyond the workplace.</p>\n</blockquote>\n<p>F末句写组织与政党形成close connections，D开头用<code>Those political connections</code>原样承接，继续解释联系带来的影响。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>At state level, organised groups watch spending on schools, prisons and health care. Control over budgets matters because employment agreements determine not only immediate wages but also costs that will be paid much later.</p>\n</blockquote>\n<p>学校、监狱、医疗说明工会如何介入预算；雇佣协议随后把预算支出分成即期工资和以后支付的成本，末句明确留下<code>costs ... much later</code>。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>These later costs often take the form of benefits.</p>\n</blockquote>\n<p>E的<code>These later costs</code>正指这些未来成本，再说明它们通常体现为福利。只有先交代成本时间差，E的these才有明确对象。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列举行动后果及教育政治优势 → 把政治联系接到预算与后期成本 → 解释工资之外的福利增长</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform.</p>\n</blockquote>\n<p>G谈保护existing benefits却抵制改革，但F只说政治联系，尚未解释福利收益。先接G既跳过政治联系如何影响支出，也使E的later costs没有前文依据。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The resulting income gain is indirect, which helps explain why looking only at the current pay rise misses part of the bargain.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The bargain becomes harder to defend when protecting existing benefits also means resisting reform.</p>\n</blockquote>\n<p>E以<code>part of the bargain</code>结尾，G用<code>The bargain</code>承接同一待遇安排；<code>harder to defend</code>开始追问这种安排带来的代价。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Education provides a clear example: efforts to reward effective teachers or remove ineffective ones encounter organised opposition. The issue is therefore not simply how much employees receive, but how services are improved.</p>\n</blockquote>\n<p>教育中的例子说明，保护现有利益会使奖励优秀教师、淘汰不称职者的改革遇阻。末句因此由收入多少转向<code>how services are improved</code>。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Improving those services has consequently become a political struggle.</p>\n</blockquote>\n<p>B开头的<code>Improving those services</code>接G刚提出的服务改善，把改革为何困难具体展开为政治争斗。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释工资之外的福利增长 → 由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.</p>\n</blockquote>\n<p>C的Indeed要补充已有论证，而它补充的是现状还使优秀雇员受损。E刚解释间接收入增长，尚未展开改革阻力；接C无法给B的those services提供紧邻的服务改善话题。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The issue is therefore not simply how much employees receive, but how services are improved.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Improving those services has consequently become a political struggle.</p>\n</blockquote>\n<p>G末句提出公共服务怎样改善，B用<code>Improving those services</code>承接；<code>political struggle</code>说明服务改革推进时遭遇的现实阻力。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In Wisconsin, unions gathered supporters against a governor determined to impose change. Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.</p>\n</blockquote>\n<p>Wisconsin工会反对强硬州长，是政治争斗的具体事例。末句又提醒：这种抵制不能证明维持现状使每个会员受益。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.</p>\n</blockquote>\n<p>C的<code>Indeed</code>顺着这个提醒补充内部反例：维持同样安排会损害有抱负的公共雇员，<code>those arrangements</code>也回指B末句。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由利益保护转入教育改革受阻 → 用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One answer to that question concerns the consequences of stopping work.</p>\n</blockquote>\n<p>F的<code>that question</code>需要一个明确的前文疑问；G末句已给出议题转向而非会员力量来源的why问题。F重讲工会优势，也不能承接B原应引出的“并非每个会员受益”。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Such resistance illustrates the obstacles facing reformers, rather than proving that every union member benefits from keeping the current arrangements.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Indeed, keeping those arrangements can disadvantage ambitious public employees themselves.</p>\n</blockquote>\n<p>B结尾否定每个会员都受益，C的<code>Indeed</code>给出进一步理由：有抱负的雇员本身就可能因维持现状而吃亏。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A system suited to people who wish to remain where they are may give too little recognition to outstanding performance. The unfairness is visible from inside the public sector as well as from the perspective of taxpayers.</p>\n</blockquote>\n<p>守成者适应制度与突出表现缺少认可形成对照，随后从纳税人视角补到公共部门内部视角，具体说明内部受损体现在哪里。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>That failure to recognise performance points to a broader problem of incentives.</p>\n</blockquote>\n<p>H的<code>That failure to recognise performance</code>概括C中的<code>too little recognition to outstanding performance</code>，由这一缺陷自然引出激励制度的问题。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用州内抵制说明改革阻力 → 说明公共部门内部优秀者也受损 → 落到奖励优秀的制度问题</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One answer to that question concerns the consequences of stopping work.</p>\n</blockquote>\n<p>F重新回答工会力量来源，无法为H的That failure提供“优秀表现不被认可”的前提，也不能接住B刚提出的部分会员未必受益。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>public services</strong></td>\n<td><strong>公共服务</strong></td>\n<td><strong>社会现象类｜社会生活</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>institutional reform</td>\n<td>制度改革</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>fair rewards</td>\n<td>公平奖励</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>educational quality</strong></td>\n<td><strong>教育质量</strong></td>\n<td><strong>社会现象类｜文化教育</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>the pursuit of excellence</td>\n<td>追求卓越</td>\n<td>人生哲理类｜进取</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>social responsibility</td>\n<td>社会责任</td>\n<td>人生哲理类｜责任与奉献</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>effective incentives</td>\n<td>有效激励</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>public welfare</td>\n<td>公共福祉</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n</tbody></table></div>\n<h2>2. 大作文第一段描述题目信息时可积累的表达</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The picture shows a group resisting a proposed change.</strong></td>\n<td><strong>图画展示了一群人抵制一项拟议改革。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene contrasts those who want to stay put with those who seek improvement.</td>\n<td>场景对比了希望维持原状的人和寻求进步的人。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The image draws attention to a system that does not reward high achievement.</td>\n<td>图画引导人们关注一个未能奖励突出成就的制度。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The share of participants has risen from one in ten to more than one in three.</strong></td>\n<td><strong>参与者比例从十分之一上升到超过三分之一。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The number in one sector has passed that in the other.</td>\n<td>一个部门的人数已经超过另一个部门。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The visible increase is modest, but the gains in benefits are larger.</td>\n<td>显性的增幅适度，但福利方面的增长更大。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement stresses the importance of rewarding high achievers.</td>\n<td>这句话强调奖励成就突出者的重要性。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage asks how institutional arrangements affect the quality of public services.</td>\n<td>这段文字讨论制度安排如何影响公共服务质量。</td>\n</tr>\n</tbody></table></div>\n";
