<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**It can be learned from the first paragraph that ______.**\n\n> 从第一段可以知道什么？\n\n题型：**具体细节题**。","articleRects":[],"questionRects":[[226,190,730,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>It can be learned from the first paragraph that ______.</strong></p>\n<blockquote><p>从第一段可以知道什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**Which of the following is true of Paragraph 2?**\n\n> 第二段哪一项说法正确？\n\n题型：**具体细节题**。","articleRects":[],"questionRects":[[226,557,746,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>Which of the following is true of Paragraph 2?</strong></p>\n<blockquote><p>第二段哪一项说法正确？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**It can be learned from Paragraph 4 that the income in the state sector is ______.**\n\n> 第四段说明公共部门收入有何特点？\n\n题型：**具体细节题**。","articleRects":[],"questionRects":[[225,924,1005,42],[264,928,1158,26],[285,985,27,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>It can be learned from Paragraph 4 that the income in the state sector is ______.</strong></p>\n<blockquote><p>第四段说明公共部门收入有何特点？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**The example of the unions in Wisconsin shows that unions ______.**\n\n> Wisconsin工会的例子说明工会怎么样？\n\n题型：**例子作用题**。","articleRects":[],"questionRects":[[226,1351,921,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>The example of the unions in Wisconsin shows that unions ______.</strong></p>\n<blockquote><p>Wisconsin工会的例子说明工会怎么样？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**John Donahue’s attitude towards the public-sector system is one of ______.**\n\n> John Donahue对公共部门制度是什么态度？\n\n题型：**人物态度题**。","articleRects":[],"questionRects":[[225,1718,1039,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>John Donahue’s attitude towards the public-sector system is one of ______.</strong></p>\n<blockquote><p>John Donahue对公共部门制度是什么态度？</p>\n</blockquote>\n<p>题型：<strong>人物态度题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | First, Second, Third, But |\n| 态度词／评价词 | 先抓个大概好坏 | higher, modest, bad |\n| 动作词 | 先看谁做了什么 | represent, opposed, reward |\n| 结果词 | 看最后出了什么事 | gains, benefits, problems |\n| 重复主题词 | 大概知道老在说什么 | unions, public-sector, workers |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>First, Second, Third, But</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>higher, modest, bad</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>represent, opposed, reward</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>gains, benefits, problems</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>unions, public-sector, workers</td></tr></tbody></table>\n"},{"section":"读文章","raw":"If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their **[xxx]** in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their <strong>[xxx]</strong> in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n</div></div>"},{"section":"读文章","raw":"If the trade unionist Jimmy Hoffa were alive today, / he would probably represent civil servants. / When Hoffa’s Teamsters were in their **[xxx]** in 1960, / only one in ten American government workers belonged to a union; / now 36% do. / In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, / more than half of public-sector workers but only about 15% of private-sector ones are unionized.","articleRects":[[274, 事情停摆、大学学位、选票；在州一级、州预算、学校、医疗；平均工资、更高、工资涨幅保持不大、假期；改革、教育、教师质量、提拔好的；代价、数千支持者、数千支持者、现行制度；结尾还有指出、西方公务员系统、大得多的问题、对美国。</p>\n<p>到这里还不能自然地说清楚：各项统计是否在说同一群人，工会行动与福利怎样联系，结尾所说的问题具体出在哪里。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题 e trade unionist Jimmy Hoffa were alive today, / he would probably represent civil servants. / When Hoffa’s Teamsters were in their **[xxx]** in 1960, / only one in ten American government workers belonged to a union; now 36% do. / In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector. / In Britain, more than half of public-sector workers / but only about 15% of private-sector ones are unionized.\n> \n> 如果工会人士Jimmy Hoffa今天还活着，/ 他可能代表公务员。/ 1960年他的Teamsters工会处于**[xxx]**时，/ 美国政府雇员只有十分之一属于工会；现在是36%。/ 2009年美国公共部门工会成员数量超过了私营部门。/ 英国公共部门员工一半以上加入工会，/ 私营部门却只有约15%。\n\n虚拟的Hoffa开场引出的是公共部门工会扩张，后面有具体比例和数量比较。\n\n接下来按A—D逐项看。","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38]],"questionRects":[[226,190,730,38],[280,251,717,38],[280,312,700,38],[280,373,816,38],[280,435,919,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"36","initialReadingPids":[0]},"html":"<h2>36题</h2>\n<blockquote><p>It can be learned from the first paragraph that ______.<br />\n从第一段可以知道什么？</p>\n</blockquote>\n<p>题干指定第一段，看1960、now、2009三处数量怎样变化。</p>\n<blockquote><p>原文参考：</p>\n<p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants. When Hoffa’s Teamsters were in their <strong>[xxx]</strong> in 1960, only one in ten American government workers belonged to a union; now 36% do. In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector. In Britain, more than half of public-sector workers but only about 15% of private-sector ones are unionized.</p>\n<p>开始精读：</p>\n<p>If the trade unionist Jimmy Hoffa were alive today, / he would probably represent civil servants. / When Hoffa’s Teamsters were in their <strong>[xxx]</strong> in 1960, / only one in ten American government workers belonged to a union; now 36% do. / In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector. / In Britain, more than half of public-sector workers / but only about 15% of private-sector ones are unionized.</p>\n<p>如果工会人士Jimmy Hoffa今天还活着，/ 他可能代表公务员。/ 1960年他的Teamsters工会处于<strong>[xxx]</strong>时，/ 美国政府雇员只有十分之一属于工会；现在是36%。/ 2009年美国公共部门工会成员数量超过了私营部门。/ 英国公共部门员工一半以上加入工会，/ 私营部门却只有约15%。</p>\n</blockquote>\n<p>虚拟的Hoffa开场引出的是公共部门工会扩张，后面有具体比例和数量比较。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. Teamsters still have a large **[xxx]** of members\n\n> Teamsters工会现在仍拥有庞大的成员**[xxx]**。\n\n把A接回题干，它说的是：Teamsters工会现在仍拥有庞大的成员**[xxx]**。\n\nA说Teamsters现在`still`有很多成员。首段提Teamsters时写的是`in 1960`，后面才有`now 36%`，我们看这36%数的是谁。\n\n> When Hoffa’s Teamsters were in their **[xxx]** in 1960, only one in ten American government workers belonged to a union; now 36% do.\n\n`only one in ten American government workers belonged to a union`说，1960年十个政府雇员中只有一个入会。后面的`now 36% do`仍接政府雇员入会，`do`代替前面的`belonged to a union`。\n\n这里的`a union`没有指定Teamsters。A却要用这些数字证明Teamsters这个组织现在仍有大量会员，把所有政府雇员的入会比例挪到了一个工会名下。\n\nA中的生词还不认识，但主语Teamsters和现在仍拥有成员的意思清楚，这不是36%所统计的东西。\n\n**36%统计的是政府雇员加入工会的比例，就能证明Teamsters现在的会员总量吗？**\n\n不能。原句没有说这些人都加入Teamsters，也没有统计这个工会现在有多少会员。\n\n**第一轮判断：A排除。**","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38]],"questionRects":[[280,251,717,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>A. Teamsters still have a large <strong>[xxx]</strong> of members</h3>\n<blockquote><p>Teamsters工会现在仍拥有庞大的成员<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Teamsters工会现在仍拥有庞大的成员<strong>[xxx]</strong>。</p>\n<p>A说Teamsters现在<code>still</code>有很多成员。首段提Teamsters时写的是<code>in 1960</code>，后面才有<code>now 36%</code>，我们看这36%数的是谁。</p>\n<blockquote><p>When Hoffa’s Teamsters were in their <strong>[xxx]</strong> in 1960, only one in ten American government workers belonged to a union; now 36% do.</p>\n</blockquote>\n<p><code>only one in ten American government workers belonged to a union</code>说，1960年十个政府雇员中只有一个入会。后面的<code>now 36% do</code>仍接政府雇员入会，<code>do</code>代替前面的<code>belonged to a union</code>。</p>\n<p>这里的<code>a union</code>没有指定Teamsters。A却要用这些数字证明Teamsters这个组织现在仍有大量会员，把所有政府雇员的入会比例挪到了一个工会名下。</p>\n<p>A中的生词还不认识，但主语Teamsters和现在仍拥有成员的意思清楚，这不是36%所统计的东西。</p>\n<p><strong>36%统计的是政府雇员加入工会的比例，就能证明Teamsters现在的会员总量吗？</strong></p>\n<p>不能。原句没有说这些人都加入Teamsters，也没有统计这个工会现在有多少会员。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"36题","raw":"### B. Jimmy Hoffa used to work as a civil servant\n\n> Jimmy Hoffa过去当过公务员。\n\n把B接回题干，它说的是：Jimmy Hoffa过去当过公务员。\n\nB的`used to work as`说过去当过公务员。原文却用`If ... were alive today`和`would probably represent`，我们看它描述过去经历，还是假设今天的情况。\n\n> If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.\n\n开头是假设Hoffa今天还活着，他可能会代表公务员。`today`明确是现在，`would probably`又说明这是设想。\n\n`represent civil servants`表示替公务员说话，也不等于他自己就是公务员。B既把假设今天改成了过去发生的事，又把代表这群人改成了自己曾在其中任职。\n\n**假如今天还活着、可能代表公务员，能读成过去自己当过公务员吗？**\n\n不能。原句没有提供他的这段职业经历，代表他人也不等于自己任职。\n\n**第一轮判断：B排除。**","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38]],"questionRects":[[280,312,700,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>B. Jimmy Hoffa used to work as a civil servant</h3>\n<blockquote><p>Jimmy Hoffa过去当过公务员。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Jimmy Hoffa过去当过公务员。</p>\n<p>B的<code>used to work as</code>说过去当过公务员。原文却用<code>If ... were alive today</code>和<code>would probably represent</code>，我们看它描述过去经历，还是假设今天的情况。</p>\n<blockquote><p>If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil servants.</p>\n</blockquote>\n<p>开头是假设Hoffa今天还活着，他可能会代表公务员。<code>today</code>明确是现在，<code>would probably</code>又说明这是设想。</p>\n<p><code>represent civil servants</code>表示替公务员说话，也不等于他自己就是公务员。B既把假设今天改成了过去发生的事，又把代表这群人改成了自己曾在其中任职。</p>\n<p><strong>假如今天还活着、可能代表公务员，能读成过去自己当过公务员吗？</strong></p>\n<p>不能。原句没有提供他的这段职业经历，代表他人也不等于自己任职。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. unions have enlarged their public-sector membership\n\n> 工会扩大了公共部门的会员规模。\n\n把C接回题干，它说的是：工会扩大了公共部门的会员规模。\n\nC说工会在公共部门的会员扩大了。我们看政府雇员从`one in ten`变成`now 36%`，再接上下一句公共部门会员数超过私营部门。\n\n> When Hoffa’s Teamsters were in their **[xxx]** in 1960, only one in ten American government workers belonged to a union; now 36% do.\n\n> In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.\n\n1960年，政府雇员加入工会的比例只有十分之一；现在36%入会，明显提高了。随后又说，到2009年，美国公共部门的工会会员数量超过了私营部门。\n\n前一句看政府雇员自己入会的比例，后一句比较两部门的会员人数。它们不能直接合算成同一个增长率，但都把公共部门在工会中的分量写大了。\n\nC的`public-sector membership`把范围留在公共部门，没有缩成某一家工会，也没有把所有工会总人数都说成增加。\n\n**政府雇员入会比例提高、公共部门会员数又超过私营部门，能否支持公共部门这部分会员力量扩大？**\n\n能。两组数字都在说明公共部门在工会中所占的分量上升，C保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38]],"questionRects":[[280,373,816,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"36","paragraphPids":[0]},"html":"<h3>C. unions have enlarged their public-sector membership</h3>\n<blockquote><p>工会扩大了公共部门的会员规模。</p>\n</blockquote>\n<p>把C接回题干，它说的是：工会扩大了公共部门的会员规模。</p>\n<p>C说工会在公共部门的会员扩大了。我们看政府雇员从<code>one in ten</code>变成<code>now 36%</code>，再接上下一句公共部门会员数超过私营部门。</p>\n<blockquote><p>When Hoffa’s Teamsters were in their <strong>[xxx]</strong> in 1960, only one in ten American government workers belonged to a union; now 36% do.</p>\n</blockquote>\n<blockquote><p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<p>1960年，政府雇员加入工会的比例只有十分之一；现在36%入会，明显提高了。随后又说，到2009年，美国公共部门的工会会员数量超过了私营部门。</p>\n<p>前一句看政府雇员自己入会的比例，后一句比较两部门的会员人数。它们不能直接合算成同一个增长率，但都把公共部门在工会中的分量写大了。</p>\n<p>C的<code>public-sector membership</code>把范围留在公共部门，没有缩成某一家工会，也没有把所有工会总人数都说成增加。</p>\n<p><strong>政府雇员入会比例提高、公共部门会员数又超过私营部门，能否支持公共部门这部分会员力量扩大？</strong></p>\n<p>能。两组数字都在说明公共部门在工会中所占的分量上升，C保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"36题","raw":"### D. the government has improved its relationship with unionists\n\n> 政府改善了与工会成员的关系。\n\n把D接回题干，它说的是：政府改善了与工会成员的关系。\n\nD说政府改善了与工会成员的关系。原文确实有`government`，但它跟在`workers`前面，先看这里数的是工作人员入会，还是政府对工会采取了行动。\n\n> When Hoffa’s Teamsters were in their **[xxx]** in 1960, only one in ten American government workers belonged to a union; now 36% do.\n\n> In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.\n\n`government workers`是政府雇员，比例变动说明这群人有多少加入工会。下一句仍在比较公共、私营部门的会员数量。\n\n这两个数字没有说政府与工会以前相处怎样、现在又怎样。雇员加入工会更多，不能单凭这点判断政府与工会更合作或关系更好。\n\nD把政府雇员的入会变化，换成政府本身改善关系的行为。\n\n**政府雇员入会更多，就能说明政府与工会的关系比以前更好吗？**\n\n不能。原文统计入会，没有比较双方相处得好坏。\n\n**第一轮判断：D排除。**","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38]],"questionRects":[[280,435,919,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>D. the government has improved its relationship with unionists</h3>\n<blockquote><p>政府改善了与工会成员的关系。</p>\n</blockquote>\n<p>把D接回题干，它说的是：政府改善了与工会成员的关系。</p>\n<p>D说政府改善了与工会成员的关系。原文确实有<code>government</code>，但它跟在<code>workers</code>前面，先看这里数的是工作人员入会，还是政府对工会采取了行动。</p>\n<blockquote><p>When Hoffa’s Teamsters were in their <strong>[xxx]</strong> in 1960, only one in ten American government workers belonged to a union; now 36% do.</p>\n</blockquote>\n<blockquote><p>In 2009 the number of unionists in America’s public sector passed that of their fellow members in the private sector.</p>\n</blockquote>\n<p><code>government workers</code>是政府雇员，比例变动说明这群人有多少加入工会。下一句仍在比较公共、私营部门的会员数量。</p>\n<p>这两个数字没有说政府与工会以前相处怎样、现在又怎样。雇员加入工会更多，不能单凭这点判断政府与工会更合作或关系更好。</p>\n<p>D把政府雇员的入会变化，换成政府本身改善关系的行为。</p>\n<p><strong>政府雇员入会更多，就能说明政府与工会的关系比以前更好吗？</strong></p>\n<p>不能。原文统计入会，没有比较双方相处得好坏。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\nC与第一段公共部门会员力量的扩大对应。A换成Teamsters一家，B换成Hoffa过去的职业，D换成政府与工会关系，都改变了原段事实所能推出的对象。","articleRects":[],"questionRects":[[226,190,730,38],[280,251,717,38],[280,312,700,38],[280,373,816,38],[280,435,919,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>C与第一段公共部门会员力量的扩大对应。A换成Teamsters一家，B换成Hoffa过去的职业，D换成政府与工会关系，都改变了原段事实所能推出的对象。</p>\n"},{"section":"37题","raw":"## 37题\n\n> Which of the following is true of Paragraph 2?  \n> 第二段哪一项说法正确？\n\n题干指定第二段，分别看三个原因，不把成员特点当作入会条件。\n\n> 原文参考：\n> \n> There are three reasons for the public-sector unions’ **[xxx]**. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now **[xxx]** left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions.\n> \n> 开始精读：\n> \n> There are three reasons for the public-sector unions’ **[xxx]**. / First, they can shut things down without suffering much in the way of consequences. / Second, they are mostly bright and well-educated. / A quarter of America’s public-sector workers have a university degree. / Third, they now **[xxx]** left-of-centre politics. / Some of their ties go back a long way. / Britain’s Labor Party, as its name implies, has long been associated with trade unionism. / Its current leader, Ed Miliband, owes his position to votes from public-sector unions.\n> \n> 公共部门工会**[xxx]**有三个原因。/ 第一，它们可以让工作停摆，却不怎么承担后果。/ 第二，它们的人多半聪明，受过良好教育。/ 美国四分之一公共部门工作人员有大学学位。/ 第三，它们如今**[xxx]**中间偏左的政治。/ 有些联系可以追溯很久。/ 英国工党如其名称所示，一直与工会运动有关。/ 现任领袖Ed Miliband的职位要归功于公共部门工会的选票。\n\n第一条谈行动后果，第二条谈教育情况，第三条谈政治联系。\n\n接下来按A—D逐项看。","articleRects":[[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38]],"questionRects":[[226,557,746,38],[280,618,780,38],[280,679,895,38],[280,740,980,38],[280,801,916,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"37","initialReadingPids":[1]},"html":"<h2>37题</h2>\n<blockquote><p>Which of the following is true of Paragraph 2?<br />\n第二段哪一项说法正确？</p>\n</blockquote>\n<p>题干指定第二段，分别看三个原因，不把成员特点当作入会条件。</p>\n<blockquote><p>原文参考：</p>\n<p>There are three reasons for the public-sector unions’ <strong>[xxx]</strong>. First, they can shut things down without suffering much in the way of consequences. Second, they are mostly bright and well-educated. A quarter of America’s public-sector workers have a university degree. Third, they now <strong>[xxx]</strong> left-of-centre politics. Some of their ties go back a long way. Britain’s Labor Party, as its name implies, has long been associated with trade unionism. Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n<p>开始精读：</p>\n<p>There are three reasons for the public-sector unions’ <strong>[xxx]</strong>. / First, they can shut things down without suffering much in the way of consequences. / Second, they are mostly bright and well-educated. / A quarter of America’s public-sector workers have a university degree. / Third, they now <strong>[xxx]</strong> left-of-centre politics. / Some of their ties go back a long way. / Britain’s Labor Party, as its name implies, has long been associated with trade unionism. / Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n<p>公共部门工会<strong>[xxx]</strong>有三个原因。/ 第一，它们可以让工作停摆，却不怎么承担后果。/ 第二，它们的人多半聪明，受过良好教育。/ 美国四分之一公共部门工作人员有大学学位。/ 第三，它们如今<strong>[xxx]</strong>中间偏左的政治。/ 有些联系可以追溯很久。/ 英国工党如其名称所示，一直与工会运动有关。/ 现任领袖Ed Miliband的职位要归功于公共部门工会的选票。</p>\n</blockquote>\n<p>第一条谈行动后果，第二条谈教育情况，第三条谈政治联系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"37题","raw":"### A. Public-sector unions are prudent in taking actions.\n\n> 公共部门工会行动谨慎。\n\n把A接回题干，它说的是：公共部门工会行动谨慎。\n\nA说采取行动时`prudent`，很谨慎。第二段第一条却说`shut things down`以后不太承受`consequences`，我们看这句话有没有解释它们行动前很小心。\n\n> First, they can shut things down without suffering much in the way of consequences.\n\n原文先说工会能让工作停下来，再说这样做不会让它们承受太多不利后果。这里说的是采取行动的代价不大。\n\nA说的是行动之前或过程中谨慎选择。原文没有把代价小解释成谨慎行事的结果，也没有说工会因此避免让工作停摆。\n\n所以，不能从“不太受损”倒推出“做事很小心”。\n\n**让工作停摆却不太承担后果，这句话能证明工会采取行动很谨慎吗？**\n\n不能。它说明行动代价低，没有说明行动方式谨慎。\n\n**第一轮判断：A排除。**","articleRects":[[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38]],"questionRects":[[280,618,780,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>A. Public-sector unions are prudent in taking actions.</h3>\n<blockquote><p>公共部门工会行动谨慎。</p>\n</blockquote>\n<p>把A接回题干，它说的是：公共部门工会行动谨慎。</p>\n<p>A说采取行动时<code>prudent</code>，很谨慎。第二段第一条却说<code>shut things down</code>以后不太承受<code>consequences</code>，我们看这句话有没有解释它们行动前很小心。</p>\n<blockquote><p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n<p>原文先说工会能让工作停下来，再说这样做不会让它们承受太多不利后果。这里说的是采取行动的代价不大。</p>\n<p>A说的是行动之前或过程中谨慎选择。原文没有把代价小解释成谨慎行事的结果，也没有说工会因此避免让工作停摆。</p>\n<p>所以，不能从“不太受损”倒推出“做事很小心”。</p>\n<p><strong>让工作停摆却不太承担后果，这句话能证明工会采取行动很谨慎吗？</strong></p>\n<p>不能。它说明行动代价低，没有说明行动方式谨慎。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"37题","raw":"### B. Education is required for public-sector union **[xxx]**.\n\n> 教育是公共部门工会**[xxx]**的必要条件。\n\n把B接回题干，它说的是：教育是公共部门工会**[xxx]**的必要条件。\n\nB的`is required`说教育是必要条件。原文的`mostly ... well-educated`和`a quarter ... have a university degree`也谈教育，我们看是在统计已有情况，还是规定必须怎样。\n\n> Second, they are mostly bright and well-educated.\n\n> A quarter of America’s public-sector workers have a university degree.\n\n第一句描述多数人聪明、受过良好教育，下一句再说美国公共部门工作人员中四分之一有大学学位。\n\n这些句子是在介绍已经在这群人身上的特点。它们没有说入会或担任某个职位前必须接受怎样的教育。\n\nB后面的工会生词还未读懂，但`is required`已经把描述换成了必要条件。一个群体中不少人有学历，并不能自动成为这个群体的准入要求。\n\n**多数人受过良好教育、四分之一有大学学位，就能推出一条必须受教育的资格规定吗？**\n\n不能。原文描述已有情况，没有提出这样的规定。\n\n**第一轮判断：B排除。**","articleRects":[[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38]],"questionRects":[[280,679,895,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>B. Education is required for public-sector union <strong>[xxx]</strong>.</h3>\n<blockquote><p>教育是公共部门工会<strong>[xxx]</strong>的必要条件。</p>\n</blockquote>\n<p>把B接回题干，它说的是：教育是公共部门工会<strong>[xxx]</strong>的必要条件。</p>\n<p>B的<code>is required</code>说教育是必要条件。原文的<code>mostly ... well-educated</code>和<code>a quarter ... have a university degree</code>也谈教育，我们看是在统计已有情况，还是规定必须怎样。</p>\n<blockquote><p>Second, they are mostly bright and well-educated.</p>\n</blockquote>\n<blockquote><p>A quarter of America’s public-sector workers have a university degree.</p>\n</blockquote>\n<p>第一句描述多数人聪明、受过良好教育，下一句再说美国公共部门工作人员中四分之一有大学学位。</p>\n<p>这些句子是在介绍已经在这群人身上的特点。它们没有说入会或担任某个职位前必须接受怎样的教育。</p>\n<p>B后面的工会生词还未读懂，但<code>is required</code>已经把描述换成了必要条件。一个群体中不少人有学历，并不能自动成为这个群体的准入要求。</p>\n<p><strong>多数人受过良好教育、四分之一有大学学位，就能推出一条必须受教育的资格规定吗？</strong></p>\n<p>不能。原文描述已有情况，没有提出这样的规定。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"37题","raw":"### C. Labor Party has long been fighting against public-sector unions.\n\n> 工党长期反对公共部门工会。\n\n把C接回题干，它说的是：工党长期反对公共部门工会。\n\nC的`has long been`与原文相同，但后面说的是`fighting against`。我们把`associated with`和工会选票帮助Miliband上任这两句接起来。\n\n> Britain’s Labor Party, as its name implies, has long been associated with trade unionism.\n\n> Its current leader, Ed Miliband, owes his position to votes from public-sector unions.\n\n第一句说工党长期与工会运动有关联，下一句给了具体例子：现任领袖的职位要归功于公共部门工会投来的票。\n\n这两句把关系写成长期联系和选票支持。C虽然也说长期，却把关系改成工党一直反对公共部门工会。\n\n不能只看到两边都有`long`就停下，真正跟在后面的联系和对抗方向已经相反。\n\n**公共部门工会的选票帮工党领袖上任，能用来说明工党长期反对它们吗？**\n\n不能。例子接着说明支持与关联，C把它写成了长期对抗。\n\n**第一轮判断：C排除。**","articleRects":[[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38]],"questionRects":[[280,740,980,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>C. Labor Party has long been fighting against public-sector unions.</h3>\n<blockquote><p>工党长期反对公共部门工会。</p>\n</blockquote>\n<p>把C接回题干，它说的是：工党长期反对公共部门工会。</p>\n<p>C的<code>has long been</code>与原文相同，但后面说的是<code>fighting against</code>。我们把<code>associated with</code>和工会选票帮助Miliband上任这两句接起来。</p>\n<blockquote><p>Britain’s Labor Party, as its name implies, has long been associated with trade unionism.</p>\n</blockquote>\n<blockquote><p>Its current leader, Ed Miliband, owes his position to votes from public-sector unions.</p>\n</blockquote>\n<p>第一句说工党长期与工会运动有关联，下一句给了具体例子：现任领袖的职位要归功于公共部门工会投来的票。</p>\n<p>这两句把关系写成长期联系和选票支持。C虽然也说长期，却把关系改成工党一直反对公共部门工会。</p>\n<p>不能只看到两边都有<code>long</code>就停下，真正跟在后面的联系和对抗方向已经相反。</p>\n<p><strong>公共部门工会的选票帮工党领袖上任，能用来说明工党长期反对它们吗？</strong></p>\n<p>不能。例子接着说明支持与关联，C把它写成了长期对抗。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"37题","raw":"### D. Public-sector unions seldom get in trouble for their actions.\n\n> 公共部门工会很少因自己的行动陷入麻烦。\n\n把D接回题干，它说的是：公共部门工会很少因自己的行动陷入麻烦。\n\nD说行动后很少惹上麻烦。原句的`without suffering much ... consequences`正写后果，我们看它和前面的`shut things down`怎样连接。\n\n> First, they can shut things down without suffering much in the way of consequences.\n\n工会可以使工作停摆，而且不太因此承担不利后果。这里停摆是做出的行动，承受的后果小是紧跟它写出的情况。\n\nD的`for their actions`接上因行动而来的后果，`get in trouble`则概括陷入麻烦。原句更着重后果不大，D用很少惹麻烦表达同一种通常不太受损的处境。\n\nD没有写永远不会有任何后果，仍然给可能的例外留着余地。\n\n**原文说能让工作停摆却不太受损，能否接上D的很少因行动陷入麻烦？**\n\n能。两边都把行动与通常较小的不利后果接在一起，D保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38]],"questionRects":[[280,801,916,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"37","paragraphPids":[1]},"html":"<h3>D. Public-sector unions seldom get in trouble for their actions.</h3>\n<blockquote><p>公共部门工会很少因自己的行动陷入麻烦。</p>\n</blockquote>\n<p>把D接回题干，它说的是：公共部门工会很少因自己的行动陷入麻烦。</p>\n<p>D说行动后很少惹上麻烦。原句的<code>without suffering much ... consequences</code>正写后果，我们看它和前面的<code>shut things down</code>怎样连接。</p>\n<blockquote><p>First, they can shut things down without suffering much in the way of consequences.</p>\n</blockquote>\n<p>工会可以使工作停摆，而且不太因此承担不利后果。这里停摆是做出的行动，承受的后果小是紧跟它写出的情况。</p>\n<p>D的<code>for their actions</code>接上因行动而来的后果，<code>get in trouble</code>则概括陷入麻烦。原句更着重后果不大，D用很少惹麻烦表达同一种通常不太受损的处境。</p>\n<p>D没有写永远不会有任何后果，仍然给可能的例外留着余地。</p>\n<p><strong>原文说能让工作停摆却不太受损，能否接上D的很少因行动陷入麻烦？</strong></p>\n<p>能。两边都把行动与通常较小的不利后果接在一起，D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"37题","raw":"### 37题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\nD保留了行动与后果相连的意思。A把后果小解释为行事谨慎，B把教育状况改成资格条件，C把联系与选票支持改成长期对抗。","articleRects":[],"questionRects":[[226,557,746,38],[280,618,780,38],[280,679,895,38],[280,740,980,38],[280,801,916,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"37"},"html":"<h3>37题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>D保留了行动与后果相连的意思。A把后果小解释为行事谨慎，B把教育状况改成资格条件，C把联系与选票支持改成长期对抗。</p>\n"},{"section":"38题","raw":"## 38题\n\n> It can be learned from Paragraph 4 that the income in the state sector is ______.  \n> 第四段说明公共部门收入有何特点？\n\n题干指定第四段，先读平均工资的比较，再看But以后福利与薪酬安排怎样展开。\n\n> 原文参考：\n> \n> In many rich countries average wages in the state sector are higher than in the private one. But the real gains come in benefits and work practices. Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n> \n> 开始精读：\n> \n> In many rich countries average wages in the state sector are higher than in the private one. / But the real gains come in benefits and work practices. / Politicians have repeatedly “backloaded” public-sector pay deals, / keeping the pay increases modest / but adding to holidays and especially pensions that are already generous.\n> \n> 在许多富裕国家，公共部门平均工资高于私营部门。/ 但真正的收益来自福利和工作安排。/ 政治人物反复把公共部门薪酬协议的收益安排到后期，/ 工资增加保持不大，/ 假期却增加，尤其本来已经丰厚的养老金也增加。\n\nincome既包括当期工资，也涉及假期和养老金等收益；要把平均工资水平、工资增幅以及福利增加这三件事分开。\n\n接下来按A—D逐项看。","articleRects":[[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38]],"questionRects":[[225,924,1005,42],[264,928,1158,26],[285,985,27,30],[285,1046,285,38],[285,1107,350,38],[285,1168,356,38],[285,1229,256,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"38","initialReadingPids":[3]},"html":"<h2>38题</h2>\n<blockquote><p>It can be learned from Paragraph 4 that the income in the state sector is ______.<br />\n第四段说明公共部门收入有何特点？</p>\n</blockquote>\n<p>题干指定第四段，先读平均工资的比较，再看But以后福利与薪酬安排怎样展开。</p>\n<blockquote><p>原文参考：</p>\n<p>In many rich countries average wages in the state sector are higher than in the private one. But the real gains come in benefits and work practices. Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n<p>开始精读：</p>\n<p>In many rich countries average wages in the state sector are higher than in the private one. / But the real gains come in benefits and work practices. / Politicians have repeatedly “backloaded” public-sector pay deals, / keeping the pay increases modest / but adding to holidays and especially pensions that are already generous.</p>\n<p>在许多富裕国家，公共部门平均工资高于私营部门。/ 但真正的收益来自福利和工作安排。/ 政治人物反复把公共部门薪酬协议的收益安排到后期，/ 工资增加保持不大，/ 假期却增加，尤其本来已经丰厚的养老金也增加。</p>\n</blockquote>\n<p>income既包括当期工资，也涉及假期和养老金等收益；要把平均工资水平、工资增幅以及福利增加这三件事分开。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"38题","raw":"### A. illegally **[xxx]**\n\n> 公共部门收入通过非法方式**[xxx]**。\n\n把A接回题干，它说的是：公共部门收入通过非法方式**[xxx]**。\n\nA里能读懂的`illegally`是非法。第4段的`backloaded`带引号，但后面的`keeping ... but adding ...`马上作了解释，我们看实际安排是什么。\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n\n政治人物让工资只小幅上涨，同时增加假期，尤其增加本来已经丰厚的养老金。利益更多放进福利和以后的退休待遇里，这就是后半句解释的安排。\n\n原文没有说哪一项违反法律，也没有说钱通过非法途径取得。一个词用了引号，还不能替代违法的说明。\n\nA的另一个词虽然没有读清，`illegally`已经把收入安排定为非法，这点在原句中找不到。\n\n**小幅加工资、多增加假期和养老金，这些安排本身就说明收入是非法取得的吗？**\n\n不能。原文解释怎么增加待遇，没有认定违法。\n\n**第一轮判断：A排除。**","articleRects":[[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38]],"questionRects":[[285,1046,285,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"38","paragraphPids":[3]},"html":"<h3>A. illegally <strong>[xxx]</strong></h3>\n<blockquote><p>公共部门收入通过非法方式<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把A接回题干，它说的是：公共部门收入通过非法方式<strong>[xxx]</strong>。</p>\n<p>A里能读懂的<code>illegally</code>是非法。第4段的<code>backloaded</code>带引号，但后面的<code>keeping ... but adding ...</code>马上作了解释，我们看实际安排是什么。</p>\n<blockquote><p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<p>政治人物让工资只小幅上涨，同时增加假期，尤其增加本来已经丰厚的养老金。利益更多放进福利和以后的退休待遇里，这就是后半句解释的安排。</p>\n<p>原文没有说哪一项违反法律，也没有说钱通过非法途径取得。一个词用了引号，还不能替代违法的说明。</p>\n<p>A的另一个词虽然没有读清，<code>illegally</code>已经把收入安排定为非法，这点在原句中找不到。</p>\n<p><strong>小幅加工资、多增加假期和养老金，这些安排本身就说明收入是非法取得的吗？</strong></p>\n<p>不能。原文解释怎么增加待遇，没有认定违法。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"38题","raw":"### B. indirectly augmented\n\n> 公共部门收入间接增加。\n\n把B接回题干，它说的是：公共部门收入间接增加。\n\nB的`indirectly`说间接增加。原文一边是`pay increases modest`，一边又是`adding to holidays and especially pensions`，我们看新增的好处落在哪里。\n\n> But the real gains come in benefits and work practices.\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n\n眼前工资涨得不多，但假期和养老金继续增加。第二句已经说，真正的收益在福利和工作安排上，第三句再把它们具体写成假期与退休待遇。\n\n因此，不能只看工资条上的小幅增加，就认为总待遇没有提高。雇员还通过福利、未来养老金得到更多。\n\nB说间接增加，既保留待遇增加，也说明增加并非全部直接放在当期工资里。\n\n**工资只小幅增加，但假期和养老金增加，是否就是通过其他报酬形式间接提高待遇？**\n\n是。更多好处从福利和后期待遇获得，B保留。\n\n**第一轮判断：B保留。**","articleRects":[[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38]],"questionRects":[[285,1107,350,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"38","paragraphPids":[3]},"html":"<h3>B. indirectly augmented</h3>\n<blockquote><p>公共部门收入间接增加。</p>\n</blockquote>\n<p>把B接回题干，它说的是：公共部门收入间接增加。</p>\n<p>B的<code>indirectly</code>说间接增加。原文一边是<code>pay increases modest</code>，一边又是<code>adding to holidays and especially pensions</code>，我们看新增的好处落在哪里。</p>\n<blockquote><p>But the real gains come in benefits and work practices.</p>\n</blockquote>\n<blockquote><p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<p>眼前工资涨得不多，但假期和养老金继续增加。第二句已经说，真正的收益在福利和工作安排上，第三句再把它们具体写成假期与退休待遇。</p>\n<p>因此，不能只看工资条上的小幅增加，就认为总待遇没有提高。雇员还通过福利、未来养老金得到更多。</p>\n<p>B说间接增加，既保留待遇增加，也说明增加并非全部直接放在当期工资里。</p>\n<p><strong>工资只小幅增加，但假期和养老金增加，是否就是通过其他报酬形式间接提高待遇？</strong></p>\n<p>是。更多好处从福利和后期待遇获得，B保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"38题","raw":"### C. excessively increased\n\n> 公共部门收入过度增长。\n\n把C接回题干，它说的是：公共部门收入过度增长。\n\nC说`excessively increased`，增长过度。我们把原文工资较高、养老金已经丰厚和工资涨幅不大这三处分别看清，哪一处真的在说增长幅度。\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n\n`higher`比较的是公共与私营部门现有平均工资；`already generous`说养老金原本已经丰厚。只有`pay increases modest`直接形容加薪幅度，而且说的是不大。\n\n后面的增加假期和养老金，解释的是更多收益从哪儿来。原句没有算出各部分合起来增长了多少，再认定增长过度。\n\nC把原有待遇丰厚读成了增长幅度过大。水平高和涨得多，还不是同一个比较。\n\n**工资本来较高、养老金原本丰厚，就能直接说明这一轮总收入增长过度吗？**\n\n不能。原有水平不能当成增长幅度；明确写出的当期加薪幅度反而是`modest`。\n\n**第一轮判断：C排除。**","articleRects":[[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38]],"questionRects":[[285,1168,356,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"38","paragraphPids":[3]},"html":"<h3>C. excessively increased</h3>\n<blockquote><p>公共部门收入过度增长。</p>\n</blockquote>\n<p>把C接回题干，它说的是：公共部门收入过度增长。</p>\n<p>C说<code>excessively increased</code>，增长过度。我们把原文工资较高、养老金已经丰厚和工资涨幅不大这三处分别看清，哪一处真的在说增长幅度。</p>\n<blockquote><p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<p><code>higher</code>比较的是公共与私营部门现有平均工资；<code>already generous</code>说养老金原本已经丰厚。只有<code>pay increases modest</code>直接形容加薪幅度，而且说的是不大。</p>\n<p>后面的增加假期和养老金，解释的是更多收益从哪儿来。原句没有算出各部分合起来增长了多少，再认定增长过度。</p>\n<p>C把原有待遇丰厚读成了增长幅度过大。水平高和涨得多，还不是同一个比较。</p>\n<p><strong>工资本来较高、养老金原本丰厚，就能直接说明这一轮总收入增长过度吗？</strong></p>\n<p>不能。原有水平不能当成增长幅度；明确写出的当期加薪幅度反而是<code>modest</code>。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"38题","raw":"### D. fairly adjusted\n\n> 公共部门收入得到公平调整。\n\n把D接回题干，它说的是：公共部门收入得到公平调整。\n\nD说`fairly adjusted`，调整公平。原文写了政治人物如何安排工资和福利，我们看这种安排有没有接着说明谁该得多少、为什么公平。\n\n> In many rich countries average wages in the state sector are higher than in the private one.\n\n> Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.\n\n工资只小幅增加，福利却继续增加，说明报酬被怎样安排。第一句还比较了公共和私营部门的平均工资。\n\n但有安排、有比较，还不等于已经证明分配公平。原文没有说这样的安排符合什么分配标准，也没有把小幅加薪当作所有待遇都公平的理由。\n\nD在“调整了”之外又加上“公平”。段落讲清了收益增加的方式，没有作出这一评价。\n\n**说明工资和福利如何调整，就等于说明这种分配是公平的吗？**\n\n不等于。D的公平评价，没有从原句的安排方式中得到证明。\n\n**第一轮判断：D排除。**","articleRects":[[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38]],"questionRects":[[285,1229,256,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"38","paragraphPids":[3]},"html":"<h3>D. fairly adjusted</h3>\n<blockquote><p>公共部门收入得到公平调整。</p>\n</blockquote>\n<p>把D接回题干，它说的是：公共部门收入得到公平调整。</p>\n<p>D说<code>fairly adjusted</code>，调整公平。原文写了政治人物如何安排工资和福利，我们看这种安排有没有接着说明谁该得多少、为什么公平。</p>\n<blockquote><p>In many rich countries average wages in the state sector are higher than in the private one.</p>\n</blockquote>\n<blockquote><p>Politicians have repeatedly “backloaded” public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already generous.</p>\n</blockquote>\n<p>工资只小幅增加，福利却继续增加，说明报酬被怎样安排。第一句还比较了公共和私营部门的平均工资。</p>\n<p>但有安排、有比较，还不等于已经证明分配公平。原文没有说这样的安排符合什么分配标准，也没有把小幅加薪当作所有待遇都公平的理由。</p>\n<p>D在“调整了”之外又加上“公平”。段落讲清了收益增加的方式，没有作出这一评价。</p>\n<p><strong>说明工资和福利如何调整，就等于说明这种分配是公平的吗？</strong></p>\n<p>不等于。D的公平评价，没有从原句的安排方式中得到证明。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\nB对应工资增幅不大、福利继续增加这一具体方式。A改成法律判断，C把现有待遇水平换成总体增幅评价，D又把调整方式换成公平性评价。","articleRects":[],"questionRects":[[225,924,1005,42],[264,928,1158,26],[285,985,27,30],[285,1046,285,38],[285,1107,350,38],[285,1168,356,38],[285,1229,256,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>B对应工资增幅不大、福利继续增加这一具体方式。A改成法律判断，C把现有待遇水平换成总体增幅评价，D又把调整方式换成公平性评价。</p>\n"},{"section":"39题","raw":"## 39题\n\n> The example of the unions in Wisconsin shows that unions ______.  \n> Wisconsin工会的例子说明工会怎么样？\n\n题干点出Wisconsin，定位第六段。段首谈政治人物开始行动，要连同上一段明确写出的改革争议一起读，才知道例子在接着说明什么。\n\n> 原文参考：\n> \n> Reform has been vigorously opposed, perhaps most **[xxx]** in education, where **[xxx]** schools, academies and **[xxx]** pay all faced **[xxx]** battles. Even though there is plenty of evidence that the quality of the teachers is the most important variable, teachers’ unions have fought against getting rid of bad ones and promoting good ones.\n> \n> 开始精读：\n> \n> Reform has been vigorously opposed, / perhaps most **[xxx]** in education, / where **[xxx]** schools, academies and **[xxx]** pay all faced **[xxx]** battles. / Even though there is plenty of evidence that the quality of the teachers is the most important variable, / teachers’ unions have fought against getting rid of bad ones and promoting good ones.\n> \n> 改革遭到强烈反对，/ 在教育领域可能最**[xxx]**，/ **[xxx]**学校、学院和**[xxx]**薪酬都面临**[xxx]**的斗争。/ 尽管大量证据表明教师质量是最重要的变量，/ 教师工会仍反对淘汰差教师、提拔好教师。\n\n> 原文参考：\n> \n> As the cost to everyone else has become clearer, politicians have begun to **[xxx]** down. In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the **[xxx]** Republican governor. But many within the public sector suffer under the current system, too.\n> \n> 开始精读：\n> \n> As the cost to everyone else has become clearer, / politicians have begun to **[xxx]** down. / In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the **[xxx]** Republican governor. / But many within the public sector suffer under the current system, too.\n> \n> 随着其他所有人承担的代价越来越清楚，/ 政治人物开始**[xxx]**。/ Wisconsin的工会召集数千名支持者，反对**[xxx]**的共和党州长Scott Walker。/ 但公共部门内部许多人也受现行制度之苦。\n\n第五段先写改革遭反对，第六段的Wisconsin例子用工会支持者反对州长，具体展示推进改革时遇到的组织性阻力。\n\n接下来按A—D逐项看。","articleRects":[[274,1292,1122,37],[202,1336,1194,38],[202,1381,1194,37],[202,1425,1197,38],[202,1470,522,38],[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38]],"questionRects":[[226,1351,921,38],[280,1413,701,37],[280,1474,602,37],[280,1531,649,46],[280,1596,516,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4,5],"qid":"39","initialReadingPids":[4,5]},"html":"<h2>39题</h2>\n<blockquote><p>The example of the unions in Wisconsin shows that unions ______.<br />\nWisconsin工会的例子说明工会怎么样？</p>\n</blockquote>\n<p>题干点出Wisconsin，定位第六段。段首谈政治人物开始行动，要连同上一段明确写出的改革争议一起读，才知道例子在接着说明什么。</p>\n<blockquote><p>原文参考：</p>\n<p>Reform has been vigorously opposed, perhaps most <strong>[xxx]</strong> in education, where <strong>[xxx]</strong> schools, academies and <strong>[xxx]</strong> pay all faced <strong>[xxx]</strong> battles. Even though there is plenty of evidence that the quality of the teachers is the most important variable, teachers’ unions have fought against getting rid of bad ones and promoting good ones.</p>\n<p>开始精读：</p>\n<p>Reform has been vigorously opposed, / perhaps most <strong>[xxx]</strong> in education, / where <strong>[xxx]</strong> schools, academies and <strong>[xxx]</strong> pay all faced <strong>[xxx]</strong> battles. / Even though there is plenty of evidence that the quality of the teachers is the most important variable, / teachers’ unions have fought against getting rid of bad ones and promoting good ones.</p>\n<p>改革遭到强烈反对，/ 在教育领域可能最<strong>[xxx]</strong>，/ <strong>[xxx]</strong>学校、学院和<strong>[xxx]</strong>薪酬都面临<strong>[xxx]</strong>的斗争。/ 尽管大量证据表明教师质量是最重要的变量，/ 教师工会仍反对淘汰差教师、提拔好教师。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>As the cost to everyone else has become clearer, politicians have begun to <strong>[xxx]</strong> down. In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the <strong>[xxx]</strong> Republican governor. But many within the public sector suffer under the current system, too.</p>\n<p>开始精读：</p>\n<p>As the cost to everyone else has become clearer, / politicians have begun to <strong>[xxx]</strong> down. / In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the <strong>[xxx]</strong> Republican governor. / But many within the public sector suffer under the current system, too.</p>\n<p>随着其他所有人承担的代价越来越清楚，/ 政治人物开始<strong>[xxx]</strong>。/ Wisconsin的工会召集数千名支持者，反对<strong>[xxx]</strong>的共和党州长Scott Walker。/ 但公共部门内部许多人也受现行制度之苦。</p>\n</blockquote>\n<p>第五段先写改革遭反对，第六段的Wisconsin例子用工会支持者反对州长，具体展示推进改革时遇到的组织性阻力。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"39题","raw":"### A. often run against the current political system\n\n> 工会经常反对现行政治制度。\n\n把A接回题干，它说的是：工会经常反对现行政治制度。\n\nA的`run against`能接上前段改革遭到反对，以及Wisconsin工会反对州长的行动。它还把反对对象说成`current political system`，我们把前后两段放在一起看这个范围。\n\n> Reform has been vigorously opposed\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the **[xxx]** Republican governor.\n\n前一段明确写改革受到反对，后一段写工会召集数千支持者反对州长。因此，具体的改革和政治人物遭到抵制，已经读清了。\n\nA却把这些行动概括成经常反对现行政治制度。反对这位州长正在推动的改革，究竟是在反对整套制度，还是想保住现有安排里的利益，还得把工会前面的政治地位接进来。\n\n先保留A和C。这里留下的是对这场对抗怎样概括的疑问，还不能说局部这两句已经证明了工会反对整个制度。\n\n**看到工会反对改革和州长，就已经能确定它反对的是整套政治制度吗？**\n\n还不能确定。具体行动清楚了，但A把它概括得更大，先留着和C继续比较。\n\n**第一轮判断：A保留。**","articleRects":[[274,1292,1122,37],[202,1336,1194,38],[202,1381,1194,37],[202,1425,1197,38],[202,1470,522,38],[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38]],"questionRects":[[280,1413,701,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"39","paragraphPids":[4,5]},"html":"<h3>A. often run against the current political system</h3>\n<blockquote><p>工会经常反对现行政治制度。</p>\n</blockquote>\n<p>把A接回题干，它说的是：工会经常反对现行政治制度。</p>\n<p>A的<code>run against</code>能接上前段改革遭到反对，以及Wisconsin工会反对州长的行动。它还把反对对象说成<code>current political system</code>，我们把前后两段放在一起看这个范围。</p>\n<blockquote><p>Reform has been vigorously opposed</p>\n</blockquote>\n<blockquote><p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the <strong>[xxx]</strong> Republican governor.</p>\n</blockquote>\n<p>前一段明确写改革受到反对，后一段写工会召集数千支持者反对州长。因此，具体的改革和政治人物遭到抵制，已经读清了。</p>\n<p>A却把这些行动概括成经常反对现行政治制度。反对这位州长正在推动的改革，究竟是在反对整套制度，还是想保住现有安排里的利益，还得把工会前面的政治地位接进来。</p>\n<p>先保留A和C。这里留下的是对这场对抗怎样概括的疑问，还不能说局部这两句已经证明了工会反对整个制度。</p>\n<p><strong>看到工会反对改革和州长，就已经能确定它反对的是整套政治制度吗？</strong></p>\n<p>还不能确定。具体行动清楚了，但A把它概括得更大，先留着和C继续比较。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"39题","raw":"### B. can change people’s political attitudes\n\n> 工会能改变人们的政治态度。\n\n把B接回题干，它说的是：工会能改变人们的政治态度。\n\nB的`change ... attitudes`要求人的态度发生变化。原句写`rallied thousands of supporters`，我们看它说这些人被集合起来，还是说他们原先的政治立场改变了。\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the **[xxx]** Republican governor.\n\n`supporters`先把这些人叫作支持者，`rallied`说工会把他们动员、集合起来，`against Scott Walker`说行动针对州长。\n\n句子没有交代这些人以前赞成什么、后来改成赞成什么。召集已有支持者参加反对行动，并不等于把原来另一种态度的人说服过来。\n\n所以，人数多能看出动员规模，仍不能看出B说的政治态度变化。\n\n**动员数千支持者反对州长，就证明这些人原来的政治态度改变了吗？**\n\n没有。原文写他们采取了行动，没有写态度改变前后的两种立场。\n\n**第一轮判断：B排除。**","articleRects":[[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38]],"questionRects":[[280,1474,602,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>B. can change people’s political attitudes</h3>\n<blockquote><p>工会能改变人们的政治态度。</p>\n</blockquote>\n<p>把B接回题干，它说的是：工会能改变人们的政治态度。</p>\n<p>B的<code>change ... attitudes</code>要求人的态度发生变化。原句写<code>rallied thousands of supporters</code>，我们看它说这些人被集合起来，还是说他们原先的政治立场改变了。</p>\n<blockquote><p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the <strong>[xxx]</strong> Republican governor.</p>\n</blockquote>\n<p><code>supporters</code>先把这些人叫作支持者，<code>rallied</code>说工会把他们动员、集合起来，<code>against Scott Walker</code>说行动针对州长。</p>\n<p>句子没有交代这些人以前赞成什么、后来改成赞成什么。召集已有支持者参加反对行动，并不等于把原来另一种态度的人说服过来。</p>\n<p>所以，人数多能看出动员规模，仍不能看出B说的政治态度变化。</p>\n<p><strong>动员数千支持者反对州长，就证明这些人原来的政治态度改变了吗？</strong></p>\n<p>没有。原文写他们采取了行动，没有写态度改变前后的两种立场。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"39题","raw":"### C. may be a barrier to public-sector reforms\n\n> 工会可能阻碍公共部门改革。\n\n把C接回题干，它说的是：工会可能阻碍公共部门改革。\n\nC说阻碍公共部门改革。前一段开头就是`Reform has been vigorously opposed`，随后Wisconsin例子又写工会反对州长，我们把这个例子接回改革的讨论。\n\n> Reform has been vigorously opposed, perhaps most **[xxx]** in education, where **[xxx]** schools, academies and **[xxx]** pay all faced **[xxx]** battles.\n\n> As the cost to everyone else has become clearer, politicians have begun to **[xxx]** down.\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the **[xxx]** Republican governor.\n\n第5段先说改革遭到强烈反对，还具体写教师工会不愿淘汰差教师、提拔好教师。第6段接着说，其他人承担的代价越来越清楚，政治人物开始行动。\n\n随后工会在Wisconsin召集数千人反对州长，这就把改革面临的抵制写成了实际对抗。C的`barrier to ... reforms`能够接上这条前后关系。\n\n它只说工会可能成为改革的障碍，没有把一次反对说成所有改革都会失败。先把C与A一起保留，再看哪一个概括与全文里工会的地位更合适。\n\n**前面先写改革受抵制，接着举工会动员反对州长的例子，能否说明改革会遇到工会阻力？**\n\n能。C把例子放回了前面已经说清的改革争议里，先保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,1292,1122,37],[202,1336,1194,38],[202,1381,1194,37],[202,1425,1197,38],[202,1470,522,38],[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38]],"questionRects":[[280,1531,649,46]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"39","paragraphPids":[4,5]},"html":"<h3>C. may be a barrier to public-sector reforms</h3>\n<blockquote><p>工会可能阻碍公共部门改革。</p>\n</blockquote>\n<p>把C接回题干，它说的是：工会可能阻碍公共部门改革。</p>\n<p>C说阻碍公共部门改革。前一段开头就是<code>Reform has been vigorously opposed</code>，随后Wisconsin例子又写工会反对州长，我们把这个例子接回改革的讨论。</p>\n<blockquote><p>Reform has been vigorously opposed, perhaps most <strong>[xxx]</strong> in education, where <strong>[xxx]</strong> schools, academies and <strong>[xxx]</strong> pay all faced <strong>[xxx]</strong> battles.</p>\n</blockquote>\n<blockquote><p>As the cost to everyone else has become clearer, politicians have begun to <strong>[xxx]</strong> down.</p>\n</blockquote>\n<blockquote><p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the <strong>[xxx]</strong> Republican governor.</p>\n</blockquote>\n<p>第5段先说改革遭到强烈反对，还具体写教师工会不愿淘汰差教师、提拔好教师。第6段接着说，其他人承担的代价越来越清楚，政治人物开始行动。</p>\n<p>随后工会在Wisconsin召集数千人反对州长，这就把改革面临的抵制写成了实际对抗。C的<code>barrier to ... reforms</code>能够接上这条前后关系。</p>\n<p>它只说工会可能成为改革的障碍，没有把一次反对说成所有改革都会失败。先把C与A一起保留，再看哪一个概括与全文里工会的地位更合适。</p>\n<p><strong>前面先写改革受抵制，接着举工会动员反对州长的例子，能否说明改革会遇到工会阻力？</strong></p>\n<p>能。C把例子放回了前面已经说清的改革争议里，先保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"39题","raw":"### D. are dominant in the government\n\n> 工会在政府中占统治地位。\n\n把D接回题干，它说的是：工会在政府中占统治地位。\n\nD要说工会`dominant in the government`，在政府中占支配地位。Wisconsin一句却把工会支持者和州长放在对抗的两边，我们看有没有写谁已经掌握决定权。\n\n> In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the **[xxx]** Republican governor.\n\n原句只写工会召集很多支持者反对州长。它能说明工会有动员力量、能给州长施压，却没有说州长已经按工会意愿作决定。\n\nD把施压换成了在政府中支配别人。数千名支持者说明人数，仍不能替我们判断政府里的决定权已经落在工会手中。\n\n这段呈现的还是双方正在对抗，不能直接把工会写成已经控制政府的一方。\n\n**有很多支持者反对州长，就能证明工会已经主导政府决策吗？**\n\n不能。反对规模和掌握政府决定权是两回事，原句只写前者。\n\n**第一轮判断：D排除。**","articleRects":[[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38]],"questionRects":[[280,1596,516,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>D. are dominant in the government</h3>\n<blockquote><p>工会在政府中占统治地位。</p>\n</blockquote>\n<p>把D接回题干，它说的是：工会在政府中占统治地位。</p>\n<p>D要说工会<code>dominant in the government</code>，在政府中占支配地位。Wisconsin一句却把工会支持者和州长放在对抗的两边，我们看有没有写谁已经掌握决定权。</p>\n<blockquote><p>In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the <strong>[xxx]</strong> Republican governor.</p>\n</blockquote>\n<p>原句只写工会召集很多支持者反对州长。它能说明工会有动员力量、能给州长施压，却没有说州长已经按工会意愿作决定。</p>\n<p>D把施压换成了在政府中支配别人。数千名支持者说明人数，仍不能替我们判断政府里的决定权已经落在工会手中。</p>\n<p>这段呈现的还是双方正在对抗，不能直接把工会写成已经控制政府的一方。</p>\n<p><strong>有很多支持者反对州长，就能证明工会已经主导政府决策吗？</strong></p>\n<p>不能。反对规模和掌握政府决定权是两回事，原句只写前者。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\n暂时保留：A、C。\n\n第一遍留下A、C。C把Wisconsin接回第五段明确的改革抵制；A则把反对改革和共和党州长概括成工会与现行政治制度的对立。具体反对已经读清，尚未拉开的是这场冲突能否代表后一种整体关系。要把工会在政治、预算和待遇安排中的位置连起来，才能核对A的范围。B把动员支持者改成改变其政治态度，D把施压与对抗写成支配政府，先排除。","articleRects":[],"questionRects":[[226,1351,921,38],[280,1413,701,37],[280,1474,602,37],[280,1531,649,46],[280,1596,516,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：A、C。</p>\n<p>第一遍留下A、C。C把Wisconsin接回第五段明确的改革抵制；A则把反对改革和共和党州长概括成工会与现行政治制度的对立。具体反对已经读清，尚未拉开的是这场冲突能否代表后一种整体关系。要把工会在政治、预算和待遇安排中的位置连起来，才能核对A的范围。B把动员支持者改成改变其政治态度，D把施压与对抗写成支配政府，先排除。</p>\n"},{"section":"40题","raw":"## 40题\n\n> John Donahue’s attitude towards the public-sector system is one of ______.  \n> John Donahue对公共部门制度是什么态度？\n\n题干点名John Donahue，直接看末段他指出制度适合谁、对谁不利。\n\n> 原文参考：\n> \n> John Donahue at Harvard’s Kennedy School points out that the **[xxx]** of culture in Western civil services suit those who want to stay put but are bad for high achievers. The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.\n> \n> 开始精读：\n> \n> John Donahue at Harvard’s Kennedy School points out / that the **[xxx]** of culture in Western civil services suit those who want to stay put but are bad for high achievers. / The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. / Bankers’ fat pay packets have attracted much criticism, / but a public-sector system that does not reward high achievers may be a much bigger problem for America.\n> \n> 哈佛肯尼迪学院的John Donahue指出，/ 西方公务员系统的文化**[xxx]**适合想原地不动的人，却不利于成就高的人。/ 美国公共部门年收入远超过250,000美元的，只有大学运动教练和总统。/ 银行家丰厚的薪水引来大量批评，/ 但一个不奖励出色人才的公共部门制度，可能是美国更大的问题。\n\nDonahue把安于现状者与高成就者放在两边比较；bad所评价的正是制度对后一群人的影响。\n\n接下来按A—D逐项看。","articleRects":[[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[[225,1718,1039,38],[281,1779,211,38],[280,1841,223,37],[280,1902,177,30],[280,1963,220,30],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[6],"qid":"40","initialReadingPids":[6]},"html":"<h2>40题</h2>\n<blockquote><p>John Donahue’s attitude towards the public-sector system is one of ______.<br />\nJohn Donahue对公共部门制度是什么态度？</p>\n</blockquote>\n<p>题干点名John Donahue，直接看末段他指出制度适合谁、对谁不利。</p>\n<blockquote><p>原文参考：</p>\n<p>John Donahue at Harvard’s Kennedy School points out that the <strong>[xxx]</strong> of culture in Western civil services suit those who want to stay put but are bad for high achievers. The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. Bankers’ fat pay packets have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n<p>开始精读：</p>\n<p>John Donahue at Harvard’s Kennedy School points out / that the <strong>[xxx]</strong> of culture in Western civil services suit those who want to stay put but are bad for high achievers. / The only American public-sector workers who earn well above $250,000 a year are university sports coaches and the president of the United States. / Bankers’ fat pay packets have attracted much criticism, / but a public-sector system that does not reward high achievers may be a much bigger problem for America.</p>\n<p>哈佛肯尼迪学院的John Donahue指出，/ 西方公务员系统的文化<strong>[xxx]</strong>适合想原地不动的人，却不利于成就高的人。/ 美国公共部门年收入远超过250,000美元的，只有大学运动教练和总统。/ 银行家丰厚的薪水引来大量批评，/ 但一个不奖励出色人才的公共部门制度，可能是美国更大的问题。</p>\n</blockquote>\n<p>Donahue把安于现状者与高成就者放在两边比较；bad所评价的正是制度对后一群人的影响。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. disapproval\n\n> Donahue不赞同这种制度。\n\n把A接回题干，它说的是：Donahue不赞同这种制度。\n\nA的`disapproval`是不赞同。题干点名Donahue，我们只看`points out that`接出的那句话，尤其是`but are bad for high achievers`。\n\n> John Donahue at Harvard’s Kennedy School points out that the **[xxx]** of culture in Western civil services suit those who want to stay put but are bad for high achievers.\n\n前半句说这种公务员文化适合想待在原地不变的人，后半句用`but`说，它却不利于表现突出的人。\n\n对一套制度，指出它让安于现状者适应、却让高成就者吃亏，是在说这套安排的问题。`bad for`已经明确表达负面评价。\n\nA只要求不赞同这种制度，不需要我们把话扩大成他反对公共部门里所有事情。\n\n**Donahue说这种安排对高成就者不利，是在认可还是不认可它？**\n\n是在指出它的问题，不认可这套安排，A保留。\n\n**第一轮判断：A保留。**","articleRects":[[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[[281,1779,211,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"40","paragraphPids":[6]},"html":"<h3>A. disapproval</h3>\n<blockquote><p>Donahue不赞同这种制度。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Donahue不赞同这种制度。</p>\n<p>A的<code>disapproval</code>是不赞同。题干点名Donahue，我们只看<code>points out that</code>接出的那句话，尤其是<code>but are bad for high achievers</code>。</p>\n<blockquote><p>John Donahue at Harvard’s Kennedy School points out that the <strong>[xxx]</strong> of culture in Western civil services suit those who want to stay put but are bad for high achievers.</p>\n</blockquote>\n<p>前半句说这种公务员文化适合想待在原地不变的人，后半句用<code>but</code>说，它却不利于表现突出的人。</p>\n<p>对一套制度，指出它让安于现状者适应、却让高成就者吃亏，是在说这套安排的问题。<code>bad for</code>已经明确表达负面评价。</p>\n<p>A只要求不赞同这种制度，不需要我们把话扩大成他反对公共部门里所有事情。</p>\n<p><strong>Donahue说这种安排对高成就者不利，是在认可还是不认可它？</strong></p>\n<p>是在指出它的问题，不认可这套安排，A保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"40题","raw":"### B. appreciation\n\n> Donahue欣赏这种制度。\n\n把B接回题干，它说的是：Donahue欣赏这种制度。\n\nB的`appreciation`说欣赏。前半句的`suit`看起来像好话，但它后面跟的是`those who want to stay put`，还要连上`but`后的另一类人。\n\n> John Donahue at Harvard’s Kennedy School points out that the **[xxx]** of culture in Western civil services suit those who want to stay put but are bad for high achievers.\n\n前半句只说这套文化适合想安于现状的人，还没有说Donahue自己认为这样很好。后半句随即指出，它对高成就者却有害。\n\n这样把两类人放在一起，是在问制度为何让不求变化的人舒服，却让表现出色的人吃亏。B若说欣赏，就留下了一个`suit`，把后面的`bad`丢掉了。\n\n**只看到制度适合某些人，能越过后面高成就者受损的评价，说Donahue在欣赏它吗？**\n\n不能。完整句子指出了对高成就者不利的问题，B没有接上这个评价。\n\n**第一轮判断：B排除。**","articleRects":[[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[[280,1841,223,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"40","paragraphPids":[6]},"html":"<h3>B. appreciation</h3>\n<blockquote><p>Donahue欣赏这种制度。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Donahue欣赏这种制度。</p>\n<p>B的<code>appreciation</code>说欣赏。前半句的<code>suit</code>看起来像好话，但它后面跟的是<code>those who want to stay put</code>，还要连上<code>but</code>后的另一类人。</p>\n<blockquote><p>John Donahue at Harvard’s Kennedy School points out that the <strong>[xxx]</strong> of culture in Western civil services suit those who want to stay put but are bad for high achievers.</p>\n</blockquote>\n<p>前半句只说这套文化适合想安于现状的人，还没有说Donahue自己认为这样很好。后半句随即指出，它对高成就者却有害。</p>\n<p>这样把两类人放在一起，是在问制度为何让不求变化的人舒服，却让表现出色的人吃亏。B若说欣赏，就留下了一个<code>suit</code>，把后面的<code>bad</code>丢掉了。</p>\n<p><strong>只看到制度适合某些人，能越过后面高成就者受损的评价，说Donahue在欣赏它吗？</strong></p>\n<p>不能。完整句子指出了对高成就者不利的问题，B没有接上这个评价。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"40题","raw":"### C. tolerance\n\n> Donahue容忍这种制度。\n\n把C接回题干，它说的是：Donahue容忍这种制度。\n\nC的`tolerance`说能够容忍。我们在Donahue的话里找的应是，指出问题以后仍愿意接受它；而这句从`suit`接到`bad for`后就结束了。\n\n> John Donahue at Harvard’s Kennedy School points out that the **[xxx]** of culture in Western civil services suit those who want to stay put but are bad for high achievers.\n\nDonahue先说这套文化适合哪一类人，再指出对高成就者不利。他没有接着说这种缺点可以接受，也没有说有了某种好处就可以容忍这种安排。\n\n因此，我们读到的是批评高成就者受损。没有激烈措辞，也不能把批评改成容忍；要选C，还得有仍接受这套制度的意思。\n\n**明确指出高成就者受损以后，这句话又表示仍然接受这种安排了吗？**\n\n没有。原句停在指出问题，C所说的容忍还没有出现。\n\n**第一轮判断：C排除。**","articleRects":[[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[[280,1902,177,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"40","paragraphPids":[6]},"html":"<h3>C. tolerance</h3>\n<blockquote><p>Donahue容忍这种制度。</p>\n</blockquote>\n<p>把C接回题干，它说的是：Donahue容忍这种制度。</p>\n<p>C的<code>tolerance</code>说能够容忍。我们在Donahue的话里找的应是，指出问题以后仍愿意接受它；而这句从<code>suit</code>接到<code>bad for</code>后就结束了。</p>\n<blockquote><p>John Donahue at Harvard’s Kennedy School points out that the <strong>[xxx]</strong> of culture in Western civil services suit those who want to stay put but are bad for high achievers.</p>\n</blockquote>\n<p>Donahue先说这套文化适合哪一类人，再指出对高成就者不利。他没有接着说这种缺点可以接受，也没有说有了某种好处就可以容忍这种安排。</p>\n<p>因此，我们读到的是批评高成就者受损。没有激烈措辞，也不能把批评改成容忍；要选C，还得有仍接受这套制度的意思。</p>\n<p><strong>明确指出高成就者受损以后，这句话又表示仍然接受这种安排了吗？</strong></p>\n<p>没有。原句停在指出问题，C所说的容忍还没有出现。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"40题","raw":"### D. indifference\n\n> Donahue对这种制度漠不关心。\n\n把D接回题干，它说的是：Donahue对这种制度漠不关心。\n\nD的`indifference`是漠不关心。我们看Donahue是否只是列举两类人，还是已经用`bad for`评价制度对人的影响。\n\n> John Donahue at Harvard’s Kennedy School points out that the **[xxx]** of culture in Western civil services suit those who want to stay put but are bad for high achievers.\n\n他没有只说制度对两类人的作用不同，而是明确说它对高成就者不利。被批评的事情很具体：表现突出的人在这套安排下反而吃亏。\n\n所以，决定态度的不是他有没有开口提到制度，而是他把这种影响判为坏。D的漠不关心会把这个已经说出的负面评价抹掉。\n\n**把制度对高成就者的影响明确说成`bad`，还能概括为漠不关心吗？**\n\n不能。他已经指出并批评了这项影响，D对不上。\n\n**第一轮判断：D排除。**","articleRects":[[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[[280,1963,220,30],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"40","paragraphPids":[6]},"html":"<h3>D. indifference</h3>\n<blockquote><p>Donahue对这种制度漠不关心。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Donahue对这种制度漠不关心。</p>\n<p>D的<code>indifference</code>是漠不关心。我们看Donahue是否只是列举两类人，还是已经用<code>bad for</code>评价制度对人的影响。</p>\n<blockquote><p>John Donahue at Harvard’s Kennedy School points out that the <strong>[xxx]</strong> of culture in Western civil services suit those who want to stay put but are bad for high achievers.</p>\n</blockquote>\n<p>他没有只说制度对两类人的作用不同，而是明确说它对高成就者不利。被批评的事情很具体：表现突出的人在这套安排下反而吃亏。</p>\n<p>所以，决定态度的不是他有没有开口提到制度，而是他把这种影响判为坏。D的漠不关心会把这个已经说出的负面评价抹掉。</p>\n<p><strong>把制度对高成就者的影响明确说成<code>bad</code>，还能概括为漠不关心吗？</strong></p>\n<p>不能。他已经指出并批评了这项影响，D对不上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\nA对应Donahue所说的bad for high achievers。B漏掉but后的批评，C把指出缺陷扩成接受缺陷，D抹去了明确的负面评价。","articleRects":[],"questionRects":[[225,1718,1039,38],[281,1779,211,38],[280,1841,223,37],[280,1902,177,30],[280,1963,220,30],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>A对应Donahue所说的bad for high achievers。B漏掉but后的批评，C把指出缺陷扩成接受缺陷，D抹去了明确的负面评价。</p>\n"},{"section":"进阶方法","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> At the state level their influence can be even more **[xxx]**. Mark Baldassare of the Public Policy Institute of California points out that much of the state’s budget is **[xxx]** by unions. The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.\n> \n> 开始精读：\n> \n> At the state level their influence can be even more **[xxx]**. / Mark Baldassare of the Public Policy Institute of California points out / that much of the state’s budget is **[xxx]** by unions. / The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.\n> \n> 在州一级，它们的影响甚至更**[xxx]**。/ 加州公共政策研究所的Mark Baldassare指出，/ 州预算很大一部分受工会**[xxx]**。/ 教师工会盯着学校，CCPOA盯着监狱，各种劳动组织盯着医疗。","articleRects":[[273,891,1124,30],[202,935,1194,38],[203,980,1193,38],[203,1025,1135,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[3],"role":"whole_text_precision","paragraphPids":[2]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>At the state level their influence can be even more <strong>[xxx]</strong>. Mark Baldassare of the Public Policy Institute of California points out that much of the state’s budget is <strong>[xxx]</strong> by unions. The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p>\n<p>开始精读：</p>\n<p>At the state level their influence can be even more <strong>[xxx]</strong>. / Mark Baldassare of the Public Policy Institute of California points out / that much of the state’s budget is <strong>[xxx]</strong> by unions. / The teachers’ unions keep an eye on schools, the CCPOA on prisons and a variety of labor groups on health care.</p>\n<p>在州一级，它们的影响甚至更<strong>[xxx]</strong>。/ 加州公共政策研究所的Mark Baldassare指出，/ 州预算很大一部分受工会<strong>[xxx]</strong>。/ 教师工会盯着学校，CCPOA盯着监狱，各种劳动组织盯着医疗。</p>\n</blockquote>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | now 36% do；the number of unionists in America’s public sector passed that of their fellow members in the private sector | 政府雇员的入会比例提高，公共部门会员数量超过私营部门。 | 先呈现公共部门工会壮大的现象，提出后面要解释的对象。 |\n| 第2段 | has long been associated with trade unionism；owes his position to votes from public-sector unions | 工会行动代价较低，成员教育程度较高，还同政治组织保持长期联系。 | 工党领袖靠工会选票取得职位，使政治联系具体化：工会参与既有政治运作，并能影响谁取得位置。 |\n| 第3段 | much of the state’s budget is **[xxx]** by unions；keep an eye on schools | 讨论转到州预算以及学校、监狱、医疗等公共领域。 | 工会影响不止表现在人数和选票，还延伸到公共资源及具体事务。 |\n| 第4段 | keeping the pay increases modest but adding to holidays and especially pensions that are already generous | 工资加幅不大，假期和本已丰厚的养老金却继续增加。 | 工会的既有影响与公共部门待遇相接，工资数字以外还有其他收益。 |\n| 第5段 | Reform has been vigorously opposed；fought against getting rid of bad ones and promoting good ones | 改革受到强烈抵制，教师工会反对淘汰差教师、提拔好教师。 | 从待遇优势转到改革困难，工会力量也体现为对改变既有用人安排的阻力。 |\n| 第6段 | rallied thousands of supporters against Scott Walker；many within the public sector suffer under the current system, too | Wisconsin例子展示改革推进中的实际对抗；随后转到公共部门内部也有人受损。 | 不能把公共部门工作人员都看成同样受益的一群人。 |\n| 第7段 | suit those who want to stay put but are bad for high achievers；does not reward high achievers | 制度适合安于现状者，却不利于高成就者。 | 结尾落在既有安排如何对待不同表现的人，尤其指出优秀人才没有得到相称奖励的问题。 |\n\n七段连起来，文章先说明公共部门工会的壮大及其力量来源，再追踪这种力量带来的待遇优势和改革阻力，最后指出现行制度对高成就者不利。工会同既有政治组织、公共资源和待遇安排相连；改革触及这些安排时，它们又形成反对力量。这不是孤立的一场州长与支持者的冲突，而是前面所写的力量和利益在改革中的具体表现。\n\n作者批评的重点是公共部门既有安排的代价：一方面，工会影响大，待遇和用人安排难以改变；另一方面，这套安排未必奖励表现突出的人，公共部门内外都有人因此受损。工资与福利增加的方式、改革的阻力、对高成就者的不利，最后都接到这套制度如何运作和分配利益上。","articleRects":[[274,312,1122,38],[202,357,1189,37],[202,401,1187,38],[202,446,1195,37],[202,490,1195,38],[202,535,964,38],[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38],[273,891,1124,30],[202,935,1194,38],[203,980,1193,38],[203,1025,1135,37],[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38],[274,1292,1122,37],[202,1336,1194,38],[202,1381,1194,37],[202,1425,1197,38],[202,1470,522,38],[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38],[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>now 36% do；the number of unionists in America’s public sector passed that of their fellow members in the private sector</td><td>政府雇员的入会比例提高，公共部门会员数量超过私营部门。</td><td>先呈现公共部门工会壮大的现象，提出后面要解释的对象。</td></tr><tr><td>第2段</td><td>has long been associated with trade unionism；owes his position to votes from public-sector unions</td><td>工会行动代价较低，成员教育程度较高，还同政治组织保持长期联系。</td><td>工党领袖靠工会选票取得职位，使政治联系具体化：工会参与既有政治运作，并能影响谁取得位置。</td></tr><tr><td>第3段</td><td>much of the state’s budget is <strong>[xxx]</strong> by unions；keep an eye on schools</td><td>讨论转到州预算以及学校、监狱、医疗等公共领域。</td><td>工会影响不止表现在人数和选票，还延伸到公共资源及具体事务。</td></tr><tr><td>第4段</td><td>keeping the pay increases modest but adding to holidays and especially pensions that are already generous</td><td>工资加幅不大，假期和本已丰厚的养老金却继续增加。</td><td>工会的既有影响与公共部门待遇相接，工资数字以外还有其他收益。</td></tr><tr><td>第5段</td><td>Reform has been vigorously opposed；fought against getting rid of bad ones and promoting good ones</td><td>改革受到强烈抵制，教师工会反对淘汰差教师、提拔好教师。</td><td>从待遇优势转到改革困难，工会力量也体现为对改变既有用人安排的阻力。</td></tr><tr><td>第6段</td><td>rallied thousands of supporters against Scott Walker；many within the public sector suffer under the current system, too</td><td>Wisconsin例子展示改革推进中的实际对抗；随后转到公共部门内部也有人受损。</td><td>不能把公共部门工作人员都看成同样受益的一群人。</td></tr><tr><td>第7段</td><td>suit those who want to stay put but are bad for high achievers；does not reward high achievers</td><td>制度适合安于现状者，却不利于高成就者。</td><td>结尾落在既有安排如何对待不同表现的人，尤其指出优秀人才没有得到相称奖励的问题。</td></tr></tbody></table>\n<p>七段连起来，文章先说明公共部门工会的壮大及其力量来源，再追踪这种力量带来的待遇优势和改革阻力，最后指出现行制度对高成就者不利。工会同既有政治组织、公共资源和待遇安排相连；改革触及这些安排时，它们又形成反对力量。这不是孤立的一场州长与支持者的冲突，而是前面所写的力量和利益在改革中的具体表现。</p>\n<p>作者批评的重点是公共部门既有安排的代价：一方面，工会影响大，待遇和用人安排难以改变；另一方面，这套安排未必奖励表现突出的人，公共部门内外都有人因此受损。工资与福利增加的方式、改革的阻力、对高成就者的不利，最后都接到这套制度如何运作和分配利益上。</p>\n"},{"section":"进阶回查","raw":"## 回查39题：A还是C？\n\n第一遍留下：\n\n- A. often run against the current political system\n- C. may be a barrier to public-sector reforms\n\nA接回题干：Wisconsin的例子说明工会经常反对现行政治制度。\n\nC接回题干：这个例子说明工会可能阻碍公共部门改革。\n\n前面看到工会反对州长，A、C都留下了。但反对一项改革，可能是想推翻现有安排，也可能是想把现有安排保住。现在把工会在前几段里的位置接进来。\n\n第2段说：\n\n> Britain’s Labor Party ... has long been associated with trade unionism.\n>\n> Ed Miliband, owes his position to votes from public-sector unions.\n\n工会长期与现有政党有联系，工党领袖取得职位还得到它们选票的帮助。工会并非只在现有政治安排的外面表示反对，也在里面发挥影响。\n\n第4段又说明公共部门怎样得到更多待遇：\n\n> keeping the pay increases modest but adding to holidays and especially pensions that are already generous\n\n随后第5段才转到改革遭到反对，还具体举了教师工会不愿淘汰差教师、提拔好教师。这样读，工会反对的就是改变现有待遇和用人安排的措施。\n\nWisconsin的数千名支持者反对州长，是接着这个改革背景写出的实际行动。它能说明改革受到工会阻力；却不能仅凭反对一位州长，就说工会反对它们原本也参与、并能从中获益的整套政治制度。\n\n最后一段又指出现行文化适合安于现状的人，却不利于高成就者，这也解释了前面为何要谈改变这些安排。\n\n**工会在现有安排中有政治影响，又反对改变待遇和用人的改革，这更接近反对整个政治制度，还是阻挡具体改革？**\n\n更接近阻挡具体改革。C能接住前段的`Reform has been vigorously opposed`，也能接住Wisconsin的行动；A把一次反对州长扩大成与整套政治制度对立，不能这样概括。\n\n> **39题选C。**\n","articleRects":[[274,1292,1122,37],[202,1336,1194,38],[202,1381,1194,37],[202,1425,1197,38],[202,1470,522,38],[274,1514,1122,38],[202,1559,1194,38],[203,1603,1192,38],[203,1648,636,38],[274,579,1121,38],[203,624,1188,38],[202,668,1195,38],[202,713,1194,38],[202,757,1194,38],[202,802,1189,38],[202,846,986,38],[273,891,1124,30],[202,935,1194,38],[203,980,1193,38],[203,1025,1135,37],[274,1069,1122,38],[202,1114,1184,37],[202,1157,1194,39],[202,1203,1194,37],[202,1247,255,38],[273,1692,1126,38],[202,1737,1195,38],[202,1781,1194,38],[211,1824,1186,40],[203,1870,1194,38],[203,1915,1194,38],[202,1960,134,30]],"questionRects":[[226,1351,921,38],[280,1413,701,37],[280,1474,602,37],[280,1531,649,46],[280,1596,516,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","C"],"newEvidencePids":[2,3,4,7],"finalChoice":"C","qid":"39","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查39题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul><li>A. often run against the current political system</li><li>C. may be a barrier to public-sector reforms</li></ul>\n<p>A接回题干：Wisconsin的例子说明工会经常反对现行政治制度。</p>\n<p>C接回题干：这个例子说明工会可能阻碍公共部门改革。</p>\n<p>前面看到工会反对州长，A、C都留下了。但反对一项改革，可能是想推翻现有安排，也可能是想把现有安排保住。现在把工会在前几段里的位置接进来。</p>\n<p>第2段说：</p>\n<blockquote><p>Britain’s Labor Party ... has long been associated with trade unionism.</p>\n<p>Ed Miliband, owes his position to votes from public-sector unions.</p>\n</blockquote>\n<p>工会长期与现有政党有联系，工党领袖取得职位还得到它们选票的帮助。工会并非只在现有政治安排的外面表示反对，也在里面发挥影响。</p>\n<p>第4段又说明公共部门怎样得到更多待遇：</p>\n<blockquote><p>keeping the pay increases modest but adding to holidays and especially pensions that are already generous</p>\n</blockquote>\n<p>随后第5段才转到改革遭到反对，还具体举了教师工会不愿淘汰差教师、提拔好教师。这样读，工会反对的就是改变现有待遇和用人安排的措施。</p>\n<p>Wisconsin的数千名支持者反对州长，是接着这个改革背景写出的实际行动。它能说明改革受到工会阻力；却不能仅凭反对一位州长，就说工会反对它们原本也参与、并能从中获益的整套政治制度。</p>\n<p>最后一段又指出现行文化适合安于现状的人，却不利于高成就者，这也解释了前面为何要谈改变这些安排。</p>\n<p><strong>工会在现有安排中有政治影响，又反对改变待遇和用人的改革，这更接近反对整个政治制度，还是阻挡具体改革？</strong></p>\n<p>更接近阻挡具体改革。C能接住前段的<code>Reform has been vigorously opposed</code>，也能接住Wisconsin的行动；A把一次反对州长扩大成与整套政治制度对立，不能这样概括。</p>\n<blockquote><p><strong>39题选C。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**36. C**\n\n**37. D**\n\n**38. B**\n\n**39. C**\n\n**40. A**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>36. C</strong></p>\n<p><strong>37. D</strong></p>\n<p><strong>38. B</strong></p>\n<p><strong>39. C</strong></p>\n<p><strong>40. A</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRiZwBABXRUJQVlA4TBlwBAAvV0Y1AlWT4rZtI8n7j93LLfqPiAngqwqIIojoyN1Eua7O8IwmyakHGe+l8G6GZ4oZH5lSuJzxZXqO8REbaoFCFdBQdZoUeJuK9f/rL2UGd3d3d3d3d3d3d3d3d3d3d3d3d/fB9Zz/9/e33/WZ/2/eaTYwCdc2jTSd5s4G7C6CPo1+D52laCPOGtB2Exuwd6N5nCWQZgWsgeQJksMWmA1gK5iEJpr7GhySQ2KsTcPaxOksgOhrYB0W2QlN13AXQfssY9aAJqaTbqORWAyN5GkO3Z1OpHmfwxL+h+SNzmEDuoKI/sNhJEmRFOUd1jHfPbbhhf3/+1P/zck23W6ybbdtute26R7ba7fndLtNu03TXu3u9rzb07Xd5NBr0+35fD5sm+1p002ubbtX26vHdLfbNsfd9Go3vbLbdre9ttnubtptuz3tbrNb0e5mt6fN9rjbbc45zef1fL3f788MfL/D7/ffHwaFISgMGTEoDEFhUKAw5CNAYQhigkGBwqAIBsWICQYFCoMiGBQjJhgUwaAwBINiBMGgCOKBwhAMinySCQpDEIPCEAwKBQpDRgwKQ1AYFCgMGTHBoEBhUKAwZATBoEB8gkERDIqPIBgUIyYYFMGgMASDIpNMUBiCQWEIBkUmmaAwBIPCEBSGjACFIYgPCkNQGPIUoDBkxASDAoVBgcKQERMMChQGRTAoRhAMChQGRTAoRhAMipBMUBiCQWEIBkUmmaAwBIPCEBSGjBgUhkT03wNt23kbSbY2kRVdjs6IAkEQ4K8swBRF4Z3+f50kN8r0ByhyWaxjxr2dhZmdZYZhnpvl3ZsdWJrd2ZlZnJ7p7pme7h7qnu4e2JlFMWPm/8J/gv+M7d/3t91ds1OlrV6xIpYis2A2V21kuugcsQ8jM00Zo7vIGLEvWsGWMbqLLldkRScwO9pSbhIrOjNGV4L3Riaxoqup2rrIdCUYRWaOLpIi05ZgLzJtbWSMdJFp60C8kTYyXaSLzGKMcMwR29FNYL7IJN5IxZGZI9VhZLoSRqYtMwsjM0dsR2zRRibhOMKri8xfw0ZmxovuItNFusjMwuguv8jMzI50kTFitsUYmaYuN19kEiu8qq2LzBzh1kVmwV60GQUBAJvUrlCO0Mp4CoqShBnITlgZoH930LZtu2ks8f8f1j0K2ygLCeWAEgbsuh1e+y8Btq24bc5P0r1FCG0YyUaSZzqzGFYC/8F/8B/8B//Bf/Af/Af/wX/wH/wH/8F/8B/8B//Bf/Af/Af/wX/wH/wH/8F/8B/8B//Bf/Af/Af/wX/wH/wH/8F/8B/8B//Bf/Af/Af/wX/wH/wH/8F/8B/
