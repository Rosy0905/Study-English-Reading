<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset:method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset:method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset:method_newtype_overview)\n\n![新题型考纲表格](asset:method_newtype_table)\n\n![七选五题型说明](asset:method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset:method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset:method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset:method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| idealized version | 名词短语：理想化的版本 | science | n. 科学 | done | v. 进行；完成 |\n| facts | n. 事实 | world | n. 世界 | waiting to be | 动词短语：正等待被…… |\n| observed | v. 观察 | collected | v. 收集 | objective researchers | 名词短语：客观的研究者 |\n| use | v. 使用 | scientific method | 名词短语：科学方法 | carry out | 动词短语：开展；执行 |\n| work | n. 工作；研究工作 | everyday practice | 名词短语：日常实践 | discovery | n. 发现 |\n| frequently | adv. 经常 | follows | v. 沿着；遵循 | ambiguous | adj. 不明确的；模糊的 |\n| complicated route | 名词短语：复杂的路径 | aim to | 动词短语：力求；旨在 | objective | adj. 客观的 |\n| escape | v. 摆脱 | context | n. 背景 | unique life experiences | 名词短语：独特的人生经历 |\n| prior knowledge | 名词短语：先前的知识 | interests | n. 兴趣 | influence | v. 影响 |\n| experience | v. 经历 | think | v. 认为 | experiences | n. 经历 |\n| mean | v. 意味着 | subsequent actions | 名词短语：随后采取的行动 | take | v. 采取 |\n| opportunities | n. 机会；发生的可能 | misinterpretation | n. 误解；错误解读 | self-deception | n. 自我欺骗 |\n| abound | v. 大量存在 |  |  |  |  |","level":1,"section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[86,117,914,780],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>idealized version<\/td>\n<td>名词短语：理想化的版本<\/td>\n<td>science<\/td>\n<td>n. 科学<\/td>\n<td>done<\/td>\n<td>v. 进行；完成<\/td>\n<\/tr>\n<tr>\n<td>facts<\/td>\n<td>n. 事实<\/td>\n<td>world<\/td>\n<td>n. 世界<\/td>\n<td>waiting to be<\/td>\n<td>动词短语：正等待被……<\/td>\n<\/tr>\n<tr>\n<td>observed<\/td>\n<td>v. 观察<\/td>\n<td>collected<\/td>\n<td>v. 收集<\/td>\n<td>objective researchers<\/td>\n<td y, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[86,1676,914,945],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit. But, unlike with mining claims, the community takes control of what happens next. Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology. As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/section>"},{"title":"第3段","raw":"### 意群划分 · 第3段\n\nOnce a discovery claim becomes public, / the discoverer receives / intellectual credit.\n\nBut, unlike with mining claims, / the community takes control / of what happens next.\n\nWithin the complex social structure / of the scientific community, / researchers make discoveries; / editors and reviewers act as gatekeepers / by controlling the publication process; / other scientists use the new finding / to suit their own purposes; / and finally, / the public (including other scientists) / receives the new discovery / and possibly ac ew finding / to suit their own purposes; / and finally, / the public (including other scientists) / receives the new discovery / and possibly accompanying technology.<\/p>\n<p>As a discovery claim / works its way through the community, / the interaction and confrontation / between shared and competing beliefs / about the science and the technology involved / transforms an individual&#39;s discovery claim / into the community&#39;s credible discovery.<\/p>\n<\/section>"},{"title":"第3段","raw":"### 意群翻译 · 第3段\n\n一旦发现声明变成公开的，/ 发现者获得 / 智力信用。\n\n但是，不同于采矿权，/ 社区掌控 / 接下来发生的事情。\n\n在复杂的社会结构中 / 科学共同体的，/ 研究者做出发现；/ 编辑和审稿人充当守门人 / 通过控制出版过程；/ 其他科学家使用新发现 / 来适应他们自己的目的；/ 最后，/ 公众（包括其他科学家）/ 接收新发现 / 以及可能伴随的技术。\n\n当一个发现声明 / 在社区中传播时，/ 互动和对抗 / 在共享和竞争的信念之间 / 关于涉及的科学和技术 / 转变个人的发现声明 / 成为社区的可信发现。","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[86,1676,914,945],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit. But, unlike with mining claims, the community takes control of what happens next. Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology. As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, / the discoverer receives / intellectual credit.<\/p>\n<p>But, unlike with mining claims, / the community takes control / of what happens next.<\/p>\n<p>Within the complex social structure / of the scientific community, / researchers make discoveries; / editors and reviewers act as gatekeepers / by controlling the publication process; / other scientists use the new finding / to suit their own purposes; / and finally, / the public (including other scientists) / receives the new discovery / and possibly accompanying technology.<\/p>\n<p>As a discovery claim / works its way through the community, / the interaction and confrontation / between shared and competing beliefs / about the science and the technology involved / transforms an individual&#39;s discovery claim / into the community&#39;s credible discovery.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段<\/h3>\n<p>一旦发现声明变成公开的，/ 发现者获得 / 智力信用。<\/p>\n<p>但是，不同于采矿权，/ 社区掌控 / 接下来发生的事情。<\/p>\n<p>在复杂的社会结构中 / 科学共同体的，/ 研究者做出发现；/ 编辑和审稿人充当守门人 / 通过控制出版过程；/ 其他科学家使用新发现 / 来适应他们自己的目的；/ 最后，/ 公众（包括其他科学家）/ 接收新发现 / 以及可能伴随的技术。<\/p>\n<p>当一个发现声明 / 在社区中传播时，/ 互动和对抗 / 在共享和竞争的信念之间 / 关于涉及的科学和技术 / 转变个人的发现声明 / 成为社区的可信发现。<\/p>\n<\/section>"},{"title":"第3段","raw":"### 标准译文 · 第3段\n\n一旦发现声明公开，发现者就会获得智力上的认可。但与采矿权不同，科学共同体掌控着接下来的进程。在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家利用新发现来服务自己的目的；最后，公众（包括其他科学家）接受新发现及可能伴随的技术。当发现声明在共同体中传播时，关于所涉及科学和技术的共享信念与竞争信念之间的互动和对抗，将个人的发现声明转变为共同体的可信发现。","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[86,1676,914,945],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true},"focusId":"focus-paragraph-3-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit. But, unlike with mining claims, the community takes control of what happens next. Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology. As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, / the discoverer receives / intellectual credit.<\/p>\n<p>But, unlike with mining claims, / the community takes control / of what happens next.<\/p>\n<p>Within the complex social structure / of the scientific community, / researchers make discoveries; / editors and reviewers act as gatekeepers / by controlling the publication process; / other scientists use the new finding / to suit their own purposes; / and finally, / the public (including other scientists) / receives the new discovery / and possibly accompanying technology.<\/p>\n<p>As a discovery claim / works its way through the community, / the interaction and confrontation / between shared and competing beliefs / about the science and the technology involved / transforms an individual&#39;s discovery claim / into the community&#39;s credible discovery.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段<\/h3>\n<p>一旦发现声明变成公开的，/ 发现者获得 / 智力信用。<\/p>\n<p>但是，不同于采矿权，/ 社区掌控 / 接下来发生的事情。<\/p>\n<p>在复杂的社会结构中 / 科学共同体的，/ 研究者做出发现；/ 编辑和审稿人充当守门人 / 通过控制出版过程；/ 其他科学家使用新发现 / 来适应他们自己的目的；/ 最后，/ 公众（包括其他科学家）/ 接收新发现 / 以及可能伴随的技术。<\/p>\n<p>当一个发现声明 / 在社区中传播时，/ 互动和对抗 / 在共享和竞争的信念之间 / 关于涉及的科学和技术 / 转变个人的发现声明 / 成为社区的可信发现。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-3-3\"><h3>标准译文 · 第3段<\/h3>\n<p>一旦发现声明公开，发现者就会获得智力上的认可。但与采矿权不同，科学共同体掌控着接下来的进程。在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家利用新发现来服务自己的目的；最后，公众（包括其他科学家）接受新发现及可能伴随的技术。当发现声明在共同体中传播时，关于所涉及科学和技术的共享信念与竞争信念之间的互动和对抗，将个人的发现声明转变为共同体的可信发现。<\/p>\n<\/section>"},{"title":"第4段","raw":"### 完整原文 · 第4段\n\nTwo paradoxes exist throughout this credibility process. First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete  or incorrect. Little reward accompanies duplication and confirmation of what is already known and believed. The goal is _new-search_, not _re-search_. Not surprisingly, newly published discovery claims and credible discoveries that appear to be  important and convincing will always be open to challenge and potential modification or refutation by future researchers. Second, novelty itself frequently provokes disbelief. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they  have missed may not change their views. Sometimes years are required for  truly novel discovery claims to be accepted and appreciated.","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[86,2634,914,1281],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>Two paradoxes exist throughout this credibility process. First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete  or incorrect. Little reward accompanies duplication and confirmation of what is already known and believed. The goal is <em>new-search<\/em>, not <em>re-search<\/em>. Not surprisingly, newly published discovery claims and credible discoveries that appear to be  important and convincing will always be open to challenge and potential modification or refutation by future researchers. Second, novelty itself frequently provokes disbelief. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they  have missed may not change their views. Sometimes years are required for  truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/section>"},{"title":"第4段","raw":"### 意群划分 · 第4段\n\nTwo paradoxes exist / throughout this credibility process.\n\nFirst, / scientific work tends to focus on / some aspect of prevailing knowledge / that is viewed as / incomplete or incorrect.\n\nLittle reward accompanies / duplication and confirmation / of what is already known and believed.\n\nThe goal is _new-search_, / not _re-search_.\n\nNot surprisingly, / newly published discovery claims / and credible discoveries / that appear to be important and convincing / will always be open to / challenge and potential modification or refutation / by future researchers.\n\nSecond, / novelty itself / frequently provokes disbelief.\n\nNobel Laureate and physiologist / Albert Szent-Györgyi / once described discovery as / \"seeing what everybody has seen / and thinking what nobody has thought.\"\n\nBut thinking what nobody else has thought / and telling others / what they have missed / may not change their views.\n\nSometimes years are required / for truly novel discovery claims / to be accepted and appreciated.","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[86,2634,914, ently provokes disbelief.<\/p>\n<p>Nobel Laureate and physiologist / Albert Szent-Györgyi / once described discovery as / &quot;seeing what everybody has seen / and thinking what nobody has thought.&quot;<\/p>\n<p>But thinking what nobody else has thought / and telling others / what they have missed / may not change their views.<\/p>\n<p>Sometimes years are required / for truly novel discovery claims / to be accepted and appreciated.<\/p>\n<\/section>"},{"title":"第4段","raw":"### 意群翻译 · 第4段\n\n两个悖论存在 / 贯穿这个可信度过程。\n\n首先，/ 科学工作倾向于关注 / 主流知识的某些方面 / 被视为 / 不完整或不正确的。\n\n很少的奖励伴随着 / 复制和确认 / 已知和已信的东西。\n\n目标是\"新搜索\"，/ 而非\"重新搜索\"。\n\n不出所料，/ 新发表的发现声明 / 和可信的发现 / 看起来重要且令人信服的 / 将始终开放于 / 挑战和潜在的修改或反驳 / 由未来的研究者。\n\n第二，/ 新颖性本身 / 经常引发怀疑。\n\n诺贝尔奖获得者和生理学家 / 阿尔伯特·圣捷尔吉 / 曾经描述发现为 / \"看到每个人都看到的 / 并思考没有人想过的。\"\n\n但思考别人没有想过的 / 并告诉他人 / 他们错过了什么 / 可能不会改变他们的观点。\n\n有时需要数年 / 对于真正新颖的发现声明 / 被接受和欣赏。","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[86,2634,914,1281],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>Two paradoxes exist throughout this credibility process. First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete  or incorrect. Little reward accompanies duplication and confirmation of what is already known and believed. The goal is <em>new-search<\/em>, not <em>re-search<\/em>. Not surprisingly, newly published discovery claims and credible discoveries that appear to be  important and convincing will always be open to challenge and potential modification or refutation by future researchers. Second, novelty itself frequently provokes disbelief. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they  have missed may not change their views. Sometimes years are required for  truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>Two paradoxes exist / throughout this credibility process.<\/p>\n<p>First, / scientific work tends to focus on / some aspect of prevailing knowledge / that is viewed as / incomplete or incorrect.<\/p>\n<p>Little reward accompanies / duplication and confirmation / of what is already known and believed.<\/p>\n<p>The goal is <em>new-search<\/em>, / not <em>re-search<\/em>.<\/p>\n<p>Not surprisingly, / newly published discovery claims / and credible discoveries / that appear to be important and convincing / will always be open to / challenge and potential modification or refutation / by future researchers.<\/p>\n<p>Second, / novelty itself / frequently provokes disbelief.<\/p>\n<p>Nobel Laureate and physiologist / Albert Szent-Györgyi / once described discovery as / &quot;seeing what everybody has seen / and thinking what nobody has thought.&quot;<\/p>\n<p>But thinking what nobody else has thought / and telling others / what they have missed / may not change their views.<\/p>\n<p>Sometimes years are required / for truly novel discovery claims / to be accepted and appreciated.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段<\/h3>\n<p>两个悖论存在 / 贯穿这个可信度过程。<\/p>\n<p>首先，/ 科学工作倾向于关注 / 主流知识的某些方面 / 被视为 / 不完整或不正确的。<\/p>\n<p>很少的奖励伴随着 / 复制和确认 / 已知和已信的东西。<\/p>\n<p>目标是&quot;新搜索&quot;，/ 而非&quot;重新搜索&quot;。<\/p>\n<p>不出所料，/ 新发表的发现声明 / 和可信的发现 / 看起来重要且令人信服的 / 将始终开放于 / 挑战和潜在的修改或反驳 / 由未来的研究者。<\/p>\n<p>第二，/ 新颖性本身 / 经常引发怀疑。<\/p>\n<p>诺贝尔奖获得者和生理学家 / 阿尔伯特·圣捷尔吉 / 曾经描述发现为 / &quot;看到每个人都看到的 / 并思考没有人想过的。&quot;<\/p>\n<p>但思考别人没有想过的 / 并告诉他人 / 他们错过了什么 / 可能不会改变他们的观点。<\/p>\n<p>有时需要数年 / 对于真正新颖的发现声明 / 被接受和欣赏。<\/p>\n<\/section>"},{"title":"第4段","raw":"### 标准译文 · 第4段\n\n在整个可信度过程中存在两个悖论。首先，科学工作倾向于关注被视为不完整或不正确的主流知识的某些方面。复制和确认已知已信的内容很少得到奖励。目标是\"新搜索\"，而非\"重新搜索\"。不出所料，新发表的发现声明和看起来重要且令人信服的可信发现，总是会面临未来研究者的挑战、潜在修改或反驳。第二，新颖性本身经常引发怀疑。诺贝尔奖获得者、生理学家阿尔伯特·圣捷尔吉曾将发现描述为\"看到每个人都看到的，思考没有人想过的\"。但思考别人没想过的，并告诉他人他们错过了什么，可能不会改变他们的观点。真正新颖的发现声明有时需要数年才能被接受和欣赏。","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[86,2634,914,1281],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true},"focusId":"focus-paragraph-4-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>Two paradoxes exist throughout this credibility process. First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete  or incorrect. Little reward accompanies duplication and confirmation of what is already known and believed. The goal is <em>new-search<\/em>, not <em>re-search<\/em>. Not surprisingly, newly published discovery claims and credible discoveries that appear to be  important and convincing will always be open to challenge and potential modification or refutation by future researchers. Second, novelty itself frequently provokes disbelief. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they  have missed may not change their views. Sometimes years are required for  truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>Two paradoxes exist / throughout this credibility process.<\/p>\n<p>First, / scientific work tends to focus on / some aspect of prevailing knowledge / that is viewed as / incomplete or incorrect.<\/p>\n<p>Litt t":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n"},{"title":"句子逻辑梳理（选修，按照自身语法基础而定)","raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n**第1段**\n\nIn the idealized version：(of how science is done) → facts about the world → are waiting to be observed and collected：(by objective researchers：(who use the scientific method：(to carry out their work))).\n\nBut in the everyday practice of science // discovery frequently follows → an ambiguous and complicated route.\n\nWe aim to be objective // but we cannot escape → the context：(of our unique life experiences).\n\nPrior knowledge and interests → influence：(what we experience) + (what we think our experiences mean) + (the subsequent actions we take).\n\nOpportunities：(for misinterpretation + error + self-deception) → abound.\n\n**第2段**\n\nConsequently → discovery claims should be thought of → as protoscience.\n\nSimilar to newly staked mining claims → they are full of potential.\n\nBut it takes → collective scrutiny and acceptance → to transform a discovery claim → into a mature discovery.\n\nThis is the credibility process：(through which → the individual researcher's _me_, _here_, _now_ → becomes → the community's _anyone_, _anywhere_, _anytime_).\n\nObjective knowledge is the goal // not the starting point.\n\n**第3段**\n\nOnce a discovery claim becomes public → the discoverer receives → intellectual credit.\n\nBut, unlike with mining claims // the community takes control → of what happens next.\n\nWithin the complex social structure：(of the scientific community) → researchers make discoveries + editors and reviewers act as gatekeepers：(by controlling the publication process) + other scientists use the new finding：(to suit their own purposes) + finally → the public (including other scientists) → receives the new discovery + possibly accompanying technology.\n\nAs a discovery claim → works its way through the community → the interaction and confrontation：(between shared and competing beliefs：(about the science and the technology involved)) → transforms an individual's discovery claim → into the community's credible discovery.\n\n**第4段**\n\nTwo paradoxes exist → throughout this credibility process.\n\nFirst → scientific work tends to focus on → some aspect of prevailing knowledge：(that is viewed as → incomplete or incorrect).\n\nLittle reward accompanies → duplication and confirmation：(of what is already known and believed).\n\nThe goal is _new-search_ // not _re-search_.\n\nNot surprisingly → newly published discovery claims + credible discoveries：(that appear to be important and convincing) → will always be open to → challenge and potential modification or refutation：(by future researchers).\n\nSecond → novelty itself → frequently provokes disbelief.\n\nNobel Laureate and physiologist Albert Szent-Györgyi → once described discovery as：(\"seeing what everybody has seen + thinking what nobody has thought\").\n\nBut thinking what nobody else has thought + telling others：(what they have missed) → may not change their views.\n\nSometimes years are required → for truly novel discovery claims → to be accepted and appreciated.\n\n**第5段**\n\nIn the end → credibility \"happens\" to → a discovery claim -- a process：(that corresponds to → what philosopher Annette Baier → has described as → the _commons of the mind_).\n\n\"We reason together + challenge + revise + complete → each other's reasoning + each other's conceptions of reason.\"","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>In the idealized version：(of how science is done) → facts about the world → are waiting to be observed and collected：(by objective researchers：(who use the scientific method：(to carry out their work))).<\/p>\n<p>But in the everyday practice of science // discovery frequently follows → an ambiguous and complicated route.<\/p>\n<p>We aim to be objective // but we cannot escape → the context：(of our unique life experiences).<\/p>\n<p>Prior knowledge and interests → influence：(what we experience) + (what we think our experiences mean) + (the subsequent actions we take).<\/p>\n<p>Opportunities：(for misinterpretation + error + self-deception) → abound.<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>Consequently → discovery claims should be thought of → as protoscience.<\/p>\n<p>Similar to newly staked mining claims → they are full of potential.<\/p>\n<p>But it takes → collective scrutiny and acceptance → to transform a discovery claim → into a mature discovery.<\/p>\n<p>This is the credibility process：(through which → the individual researcher&#39;s <em>me<\/em>, <em>here<\/em>, <em>now<\/em> → becomes → the community&#39;s <em>anyone<\/em>, <em>anywhere<\/em>, <em>anytime<\/em>).<\/p>\n<p>Objective knowledge is the goal // not the starting point.<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>Once a discovery claim becomes public → the discoverer receives → intellectual credit.<\/p>\n<p>But, unlike with mining claims // the community takes control → of what happens next.<\/p>\n<p>Within the complex social structure：(of the scientific community) → researchers make discoveries + editors and reviewers act as gatekeepers：(by controlling the publication process) + other scientists use the new finding：(to suit their own purposes) + finally → the public (including other scientists) → receives the new discovery + possibly accompanying technology.<\/p>\n<p>As a discovery claim → works its way through the community → the interaction and confrontation：(between shared and competing beliefs：(about the science and the technology involved)) → transforms an individual&#39;s discovery claim → into the community&#39;s credible discovery.<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>Two paradoxes exist → throughout this credibility process.<\/p>\n<p>First → scientific work tends to focus on → some aspect of prevailing knowledge：(that is viewed as → incomplete or incorrect).<\/p>\n<p>Little reward accompanies → duplication and confirmation：(of what is already known and believed).<\/p>\n<p>The goal is <em>new-search<\/em> // not <em>re-search<\/em>.<\/p>\n<p>Not surprisingly → newly published discovery claims + credible discoveries：(that appear to be important and convincing) → will always be open to → challenge and potential modification or refutation：(by future researchers).<\/p>\n<p>Second → novelty itself → frequently provokes disbelief.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi → once described discovery as：(&quot;seeing what everybody has seen + thinking what nobody has thought&quot;).<\/p>\n<p>But thinking what nobody else has thought + telling others：(what they have missed) → may not change their views.<\/p>\n<p>Sometimes years are required → for truly novel discovery claims → to be accepted and appreciated.<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>In the end → credibility &quot;happens&quot; to → a discovery claim -- a process：(that corresponds to → what philosopher Annette Baier → has described as → the <em>commons of the mind<\/em>).<\/p>\n<p>&quot;We reason together + challenge + revise + complete → each other&#39;s reasoning + each other&#39;s conceptions of reason.&quot;<\/p>\n"},{"title":"中文版句子逻辑（选修)","raw":"## 中文版句子逻辑（选修)\n\n**第1段**\n\n在理想化的版本中：(关于科学如何进行的) → 关于世界的事实 → 正等待被观察和收集：(由客观的研究者：(使用科学方法的人：(来执行他们的工作)))。\n\n但在科学的日常实践中 // 发现经常遵循 → 一条模糊而复杂的路线。\n\n我们旨在保持客观 // 但我们无法逃脱 → 背景：(我们独特生活经历的)。\n\n先前的知识和兴趣 → 影响：(我们所经历的) + (我们认为我们的经历意味着什么) + (我们采取的后续行动)。\n\n机会：(误解的 + 错误的 + 自欺的) → 大量存在。\n\n**第2段**\n\n因此 → 发现声明应该被认为是 → 原始科学。\n\n类似于新设立的采矿权 → 它们充满潜力。\n\n但需要 → 集体审查和接受 → 来转变一个发现声明 → 成为一个成熟的发现。\n\n这就是可信度过程：(通过它 → 个体研究者的\"我\"、\"这里\"、\"现在\" → 变成了 → 社区的\"任何人\"、\"任何地方\"、\"任何时间\")。\n\n客观知识是目标 // 而非起点。\n\n**第3段**\n\n一旦发现声明变成公开的 → 发现者获得 → 智力信用。\n\n但是，不同于采矿权 // 社区掌控 → 接下来发生的事情。\n\n在复杂的社会结构中：(科学共同体的) → 研究者做出发现 + 编辑和审稿人充当守门人：(通过控制出版过程) + 其他科学家使用新发现：(来适应他们自己的目的) + 最后 → 公众（包括其他科学家）→ 接收新发现 + 可能伴随的技术。\n\n当一个发现声明 → 在社区中传播时 → 互动和对抗：(在共享和竞争的信念之间：(关于涉及的科学和技术)) → 转变个人的发现声明 → 成为社区的可信发现。\n\n**第4段**\n\n两个悖论存在 → 贯穿这个可信度过程。\n\n首先 → 科学工作倾向于关注 → 主流知识的某些方面：(被视为 → 不完整或不正确的)。\n\n很少的奖励伴随着 → 复制和确认：(已知和已信的东西)。\n\n目标是\"新搜索\" // 而非\"重新搜索\"。\n\n不出所料 → 新发表的发现声明 + 可信的发现：(看起来重要且令人信服的) → 将始终开放于 → 挑战和潜在的修改或反驳：(由未来的研究者)。\n\n第二 → 新颖性本身 → 经常引发怀疑。\n\n诺贝尔奖获得者和生理学家阿尔伯特·圣捷尔吉 → 曾经描述发现为：(\"看到每个人都看到的 + 思考没有人想过的\")。\n\n但思考别人没有想过的 + 告诉他人：(他们错过了什么) → 可能不会改变他们的观点。\n\n有时需要数年 → 对于真正新颖的发现声明 → 被接受和欣赏。\n\n**第5段**\n\n最终 → 可信度\"发生在\" → 一个发现声明上 -- 一个过程：(对应于 → 哲学家安妮特·拜尔 → 所描述的 → \"思想的公地\")。\n\n\"我们一起推理 + 挑战 + 修正 + 完善 → 彼此的推理 + 彼此的理性概念。\"","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>在理想化的版本中：(关于科学如何进行的) → 关于世界的事实 → 正等待被观察和收集：(由客观的研究者：(使用科学方法的人：(来执行他们的工作)))。<\/p>\n<p>但在科学的日常实践中 // 发现经常遵循 → 一条模糊而复杂的路线。<\/p>\n<p>我们旨在保持客观 // 但我们无法逃脱 → 背景：(我们独特生活经历的)。<\/p>\n<p>先前的知识和兴趣 → 影响：(我们所经历的) + (我们认为我们的经历意味着什么) + (我们采取的后续行动)。<\/p>\n<p>机会：(误解的 + 错误的 + 自欺的) → 大量存在。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>因此 → 发现声明应该被认为是 → 原始科学。<\/p>\n<p>类似于新设立的采矿权 → 它们充满潜力。<\/p>\n<p>但需要 → 集体审查和接受 → 来转变一个发现声明 → 成为一个成熟的发现。<\/p>\n<p>这就是可信度过程：(通过它 → 个体研究者的&quot;我&quot;、&quot;这里&quot;、&quot;现在&quot; → 变成了 → 社区的&quot;任何人&quot;、&quot;任何地方&quot;、&quot;任何时间&quot;)。<\/p>\n<p>客观知识是目标 // 而非起点。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>一旦发现声明变成公开的 → 发现者获得 → 智力信用。<\/p>\n<p>但是，不同于采矿权 // 社区掌控 → 接下来发生的事情。<\/p>\n<p>在复杂的社会结构中：(科学共同体的) → 研究者做出发现 + 编辑和审稿人充当守门人：(通过控制出版过程) + 其他科学家使用新发现：(来适应他们自己的目的) + 最后 → 公众（包括其他科学家）→ 接收新发现 + 可能伴随的技术。<\/p>\n<p>当一个发现声明 → 在社区中传播时 → 互动和对抗：(在共享和竞争的信念之间：(关于涉及的科学和技术)) → 转变个人的发现声明 ion class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把“科学共同体的”放在“复杂社会结构”前，说明整串活动发生在什么范围内：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中<\/p>\n<\/blockquote>\n<p>编辑和审稿人的做法要接到他们的角色前：<\/p>\n<blockquote>\n<p>编辑和审稿人通过控制出版过程充当守门人<\/p>\n<\/blockquote>\n<p>再分别合并其他科学家和公众所做的事，不能把两类人混成一个主体：<\/p>\n<blockquote>\n<p>其他科学家使用新发现来适应自己的目的\n公众（包括其他科学家）接收新发现以及可能伴随的技术<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中，研究者做出发现\n编辑和审稿人通过控制出版过程充当守门人\n其他科学家使用新发现来适应自己的目的\n最后，公众（包括其他科学家）接收新发现及可能伴随的技术<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>研究者做出发现，各方随后审查、使用或接受发现。<\/p>\n<\/blockquote>\n<p>把共同的范围“在科学共同体的复杂社会结构中”放在最前面，再依次摆出四组“谁做什么”，每组之间用分号分开。控制出版过程是编辑和审稿人的做法；服务自己的目的属于其他科学家；最后接受发现和技术的是公众。“包括其他科学家”紧跟“公众”，“可能伴随的”紧贴“技术”，不要把技术写成必然同时出现。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家使用新发现来适应自己的目的；最后，公众（包括其他科学家）接收新发现以及可能伴随的技术。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“使用新发现来适应自己的目的”搭配生硬，整理为“利用新发现来服务自己的目的”，说明他们怎样把发现用于自身研究。<\/li>\n<li>“接收新发现”改为“接受新发现”，“以及”收为“及”；仍保留“可能伴随的技术”，不把有可能出现的技术改成确定结果。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家利用新发现来服务自己的目的；最后，公众（包括其他科学家）接受新发现及可能伴随的技术。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"4. 第3段第4句","raw":"#### 原文\n\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.","level":4,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段第4句","focus":[104,2087,880,261],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"lo 发现声明上 -- / 一个过程对应于 / 哲学家安妮特·拜尔 / 所描述的 / &quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把“发生在”和它针对的对象连起来，保留原文特意加上的引号：<\/p>\n<blockquote>\n<p>可信度“发生在”一个发现声明上<\/p>\n<\/blockquote>\n<p>再把人物、说法和这个说法的名称合并起来：<\/p>\n<blockquote>\n<p>哲学家安妮特·拜尔所描述的“思想的公地”<\/p>\n<\/blockquote>\n<p>破折号后的“一个过程”是在接着解释前面的事情，先把它指回去：<\/p>\n<blockquote>\n<p>这个过程对应于“思想的公地”<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>最终，可信度“发生在”一个发现声明上\n这个过程对应于哲学家安妮特·拜尔所描述的“思想的公地”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"6. 第5段第1句","raw":"#### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 可信度的形成过程对应于“思想的公地”。\n\n先放时间收束语“最终”，再交代可信度发生在发现声明上。破折号后用“这个过程”接回前半句的形成过程，随后放“对应于”。把哲学家的姓名和“所描述的”一起放在“思想的公地”前，说明这一名称来自谁，不把哲学家本人写成过程对应的对象。\n\n按照中文语序调整后是：\n\n> 最终，可信度\"发生在\"一个发现声明上——这个过程对应于哲学家安妮特·拜尔所描述的\"思想的公地\"。","level":4,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段第1句","focus":[104,3939,880,198],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-4","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>In the end, credibility “happens” to a discovery claim – a process that corresponds to what philosopher Annette Baier has described as the <em>commons of the mind<\/em>.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>In the end, / credibility &quot;happens&quot; to / a discovery claim -- / a process that corresponds to / what philosopher Annette Baier / has described as / the <em>commons of the mind<\/em>.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>最终，/ 可信度&quot;发生在&quot; / 一个发现声明上 -- / 一个过程对应于 / 哲学家安妮特·拜尔 / 所描述的 / &quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<\/section><section class=\"reve
