shes the credibility of a discovery claim.<\/p>\n<p>编辑和审稿人的认可确立了一项发现主张的可信度。<\/p>\n<\/blockquote>\n<p>这段假设只把确立可信度的作用放到编辑审稿认可上，不需要否认后面还会有人使用发现。实际文章却将这个作用明确交给主张在共同体流转时不同看法的互动与交锋；两种写法的区别，是究竟哪个环节完成题干所问的转化。<\/p>\n<\/section>"},{"title":"C. has received recognition from editors and reviewers","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入33题题干：\n\n> 第3段需要说明科学主张获得可信度的形成过程；全文主旨本身不能判定编辑审稿认可的具体地位，仍须区分本段的发表入口与共同体后续检验。\n\n但C实际说的是：\n\n> has received recognition from editors and reviewers  \n> 获得了编辑和审稿人的认可。\n\nC所说的认可与可信度主题有关，却只落在一组参与者和一个发表环节上。相关不等于足以回答全过程：题干需要的是主张怎样成为共同体的可信发现，不能仅凭“有人认可”就把不同阶段合并。\n\n本项最终仍要根据“controlling the publication process”和“interaction and confrontation”这两处局部原文判断。前者限定编辑审稿人的职责，后者解释可信度转化；C用前者范围内的认可替代了后者。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1376,1128,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q33-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>获得了编辑和审稿人的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C中的<code>recognition<\/code>显示为<code>[xxx]<\/code>，原文的<code>gatekeepers<\/code>也有遮挡。第一轮仍已读出编辑和审稿人控制发表过程，后面还有其他科学家的使用和共同体互动；因此没有把“从编辑和审稿人那里获得某物”当成全部可信度形成过程，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>C抓住了编辑与审稿人把关发表这一实际环节，编辑审稿认可可以对应这一入口，但题干询问的是发现主张怎样获得共同体的可信地位。原文在发表把关之后仍继续写其他科学家的使用、公众接收及不同看法的互动。C把其中一组参与者在发表环节的认可，拿来回答涵盖共同体后续检验的转化过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在获得编辑和审稿人的认可之后会变得可信。<\/p>\n<\/blockquote>\n<p>C的<code>editors and reviewers<\/code>对应本段长句中控制发表过程的人，<code>recognition<\/code>要放在他们的<code>gatekeepers<\/code>角色中理解；题干的<code>becomes credible<\/code>却落在后一句的共同体转化结果上。两处对应的是不同范围的处理。<\/p>\n<p>长句给编辑和审稿人的任务是<code>controlling the publication process<\/code>，即把住发表入口。之后分号仍接着其他科学家怎样使用发现、公众怎样接收发现，说明发表把关不是本段过程的终点。<\/p>\n<p>末句再把这些社会活动提升到认识层面：不同科学与技术看法相互作用、交锋，个人主张由此成为共同体的可信发现。题目要找的是主张经过这一审视过程，而不是只找它获得了哪两类人的认可。<\/p>\n<p>C中的编辑和审稿人确实属于科学共同体，他们的工作也有检验作用；问题不在于认可毫无用处，而在于这一环节的范围不足以概括本段所写的可信度转化。接受发表与共同体形成可信发现不是同一个结果。<\/p>\n<p>C拿发表入口中的认可回答整个转化条件，省去了原文随后专门展开的其他科学家使用与不同看法交锋，因此没有完整接上<code>becomes credible<\/code>所要求的关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-2\"><h3>写作视角法<\/h3>\n<p>原文在编辑与审稿人之后继续写道：<\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>发表把关之后，主张仍会被其他科学家使用、被公众接收，并在共同体不同看法的交锋中成为可信发现。<\/p>\n<\/blockquote>\n<p>作者不断把参与范围向编辑审稿之外展开，直到段末才交代可信度转化。这样的顺序让发表成为共同体过程中的一环，而非决定可信地位的最终认可。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Recognition from editors and reviewers establishes the credibility of a discovery claim.<\/p>\n<p>编辑和审稿人的认可确立了一项发现主张的可信度。<\/p>\n<\/blockquote>\n<p>这段假设只把确立可信度的作用放到编辑审稿认可上，不需要否认后面还会有人使用发现。实际文章却将这个作用明确交给主张在共同体流转时不同看法的互动与交锋；两种写法的区别，是究竟哪个环节完成题干所问的转化。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>第3段需要说明科学主张获得可信度的形成过程；全文主旨本身不能判定编辑审稿认可的具体地位，仍须区分本段的发表入口与共同体后续检验。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>has received recognition from editors and reviewers<br>获得了编辑和审稿人的认可。<\/p>\n<\/blockquote>\n<p>C所说的认可与可信度主题有关，却只落在一组参与者和一个发表环节上。相关不等于足以回答全过程：题干需要的是主张怎样成为共同体的可信发现，不能仅凭“有人认可”就把不同阶段合并。<\/p>\n<p>本项最终仍要根据“controlling the publication process”和“interaction and confrontation”这两处局部原文判断。前者限定编辑审稿人的职责，后者解释可信度转化；C用前者范围内的认可替代了后者。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. has been frequently quoted by peer scientists","raw":"### D. has been frequently quoted by peer scientists\n\n> 被同行科学家频繁引用。\n\n**做题模式中的状态：** 当时D的英文没有遮挡。第一轮把`frequently quoted`与原文其他科学家`use the new finding`比较，发现使用新发现没有交代引用动作和引用频率；再看共同体互动完成转化，排除把频繁引用当作可信度条件的D，后续没有改变。\n\n**错误类型：第三类——无中生有。**\n\nD借用了其他科学家会使用新发现这一事实，补出同行频繁引用的具体方式和数量特征，又让它承担主张变可信的条件。原文没有统计引用，也没有建立引用频率与可信程度的关系；科学家使用一个结果还可能为了检验或质疑它，不能把使用自动读成反复引用并认可。\n\n**出处：**\n\n> Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.\n>\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1461,993,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q33-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>被同行科学家频繁引用。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把<code>frequently quoted<\/code>与原文其他科学家<code>use the new finding<\/code>比较，发现使用新发现没有交代引用动作和引用频率；再看共同体互动完成转化，排除把频繁引用当作可信度条件的D，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了其他科学家会使用新发现这一事实，补出同行频繁引用的具体方式和数量特征，又让它承担主张变可信的条件。原文没有统计引用，也没有建立引用频率与可信程度的关系；科学家使用一个结果还可能为了检验或质疑它，不能把使用自动读成反复引用并认可。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. has been frequently quoted by peer scientists","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第3段表明，一项发现主张在被同行科学家频繁引用之后会变得可信。\n\nD的`peer scientists`对应本段的`other scientists`，其动作要与`use the new finding to suit their own purposes`比较；`becomes credible`继续定位到段末的转化句。人物相近，还不能保证他们做了D所说的事。\n\n原文只写其他科学家使用新发现，以服务各自的目的。`use`可以涵盖多种使用方式，句子没有把它缩小为`quoted`，更没有用次数或频率说明这些科学家反复引用。\n\n接下来的转化句强调不同看法之间的互动与交锋。共同体成员可以赞同，也可以竞争或质疑；这里讨论的是认识如何受到审视，不是用被提及的次数衡量它是否可靠。\n\nD至少加入两个原文没有给出的限制：一是具体动作必须为引用，二是引用必须频繁。将D接回题干后，它还需要频繁引用与获得可信度相连，原文同样没有建立这一关系。\n\nD从“他人使用发现”补成“同行频繁引用后可信”，既没有保留原句的动作范围，也没有找到引用频率承担转化作用的依据。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1461,993,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>被同行科学家频繁引用。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把<code>frequently quoted<\/code>与原文其他科学家<code>use the new finding<\/code>比较，发现使用新发现没有交代引用动作和引用频率；再看共同体互动完成转化，排除把频繁引用当作可信度条件的D，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了其他科学家会使用新发现这一事实，补出同行频繁引用的具体方式和数量特征，又让它承担主张变可信的条件。原文没有统计引用，也没有建立引用频率与可信程度的关系；科学家使用一个结果还可能为了检验或质疑它，不能把使用自动读成反复引用并认可。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在被同行科学家频繁引用之后会变得可信。<\/p>\n<\/blockquote>\n<p>D的<code>peer scientists<\/code>对应本段的<code>other scientists<\/code>，其动作要与<code>use the new finding to suit their own purposes<\/code>比较；<code>becomes credible<\/code>继续定位到段末的转化句。人物相近，还不能保证他们做了D所说的事。<\/p>\n<p>原文只写其他科学家使用新发现，以服务各自的目的。<code>use<\/code>可以涵盖多种使用方式，句子没有把它缩小为<code>quoted<\/code>，更没有用次数或频率说明这些科学家反复引用。<\/p>\n<p>接下来的转化句强调不同看法之间的互动与交锋。共同体成员可以赞同，也可以竞争或质疑；这里讨论的是认识如何受到审视，不是用被提及的次数衡量它是否可靠。<\/p>\n<p>D至少加入两个原文没有给出的限制：一是具体动作必须为引用，二是引用必须频繁。将D接回题干后，它还需要频繁引用与获得可信度相连，原文同样没有建立这一关系。<\/p>\n<p>D从“他人使用发现”补成“同行频繁引用后可信”，既没有保留原句的动作范围，也没有找到引用频率承担转化作用的依据。<\/p>\n<\/section>"},{"title":"D. has been frequently quoted by peer scientists","raw":"#### 写作视角法\n\n原文描述使用之后，接着写道：\n\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n>\n> 发现主张在共同体中的推进伴随不同看法的互动与交锋，这个过程把个人主张变成可信发现。\n\n作者沿着“主张怎样被不同认识检验”往下写，没有沿着“主张被提到了多少次”展开。末句解释的是形成可信度的作用关系，而非传播数量。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Frequent quotation by fellow scientists helps establish a discovery claim as credible.\n>\n> 同行科学家的频繁引用有助于确立一项发现主张的可信地位。\n\n假设写法不需要宣称引用多就绝无错误，只需明确让频繁引用参与确立可信度，才有D的依据。实际原文没有写引用或频率，更未赋予它这种作用；它交代的是不同看法之间的相互审视。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1461,993,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>被同行科学家频繁引用。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把<code>frequently quoted<\/code>与原文其他科学家<code>use the new finding<\/code>比较，发现使用新发现没有交代引用动作和引用频率；再看共同体互动完成转化，排除把频繁引用当作可信度条件的D，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了其他科学家会使用新发现这一事实，补出同行频繁引用的具体方式和数量特征，又让它承担主张变可信的条件。原文没有统计引用，也没有建立引用频率与可信程度的关系；科学家使用一个结果还可能为了检验或质疑它，不能把使用自动读成反复引用并认可。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockq covery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在被同行科学家频繁引用之后会变得可信。<\/p>\n<\/blockquote>\n<p>D的<code>peer scientists<\/code>对应本段的<code>other scientists<\/code>，其动作要与<code>use the new finding to suit their own purposes<\/code>比较；<code>becomes credible<\/code>继续定位到段末的转化句。人物相近，还不能保证他们做了D所说的事。<\/p>\n<p>原文只写其他科学家使用新发现，以服务各自的目的。<code>use<\/code>可以涵盖多种使用方式，句子没有把它缩小为<code>quoted<\/code>，更没有用次数或频率说明这些科学家反复引用。<\/p>\n<p>接下来的转化句强调不同看法之间的互动与交锋。共同体成员可以赞同，也可以竞争或质疑；这里讨论的是认识如何受到审视，不是用被提及的次数衡量它是否可靠。<\/p>\n<p>D至少加入两个原文没有给出的限制：一是具体动作必须为引用，二是引用必须频繁。将D接回题干后，它还需要频繁引用与获得可信度相连，原文同样没有建立这一关系。<\/p>\n<p>D从“他人使用发现”补成“同行频繁引用后可信”，既没有保留原句的动作范围，也没有找到引用频率承担转化作用的依据。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-2\"><h3>写作视角法<\/h3>\n<p>原文描述使用之后，接着写道：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>发现主张在共同体中的推进伴随不同看法的互动与交锋，这个过程把个人主张变成可信发现。<\/p>\n<\/blockquote>\n<p>作者沿着“主张怎样被不同认识检验”往下写，没有沿着“主张被提到了多少次”展开。末句解释的是形成可信度的作用关系，而非传播数量。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Frequent quotation by fellow scientists helps establish a discovery claim as credible.<\/p>\n<p>同行科学家的频繁引用有助于确立一项发现主张的可信地位。<\/p>\n<\/blockquote>\n<p>假设写法不需要宣称引用多就绝无错误，只需明确让频繁引用参与确立可信度，才有D的依据。实际原文没有写引用或频率，更未赋予它这种作用；它交代的是不同看法之间的相互审视。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第3段在解释科学主张怎样获得可信度，不能判断同行是否频繁引用该主张，也不能单凭主题推出引用次数具有确立可信度的作用。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>has been frequently quoted by peer scientists<br>被同行科学家频繁引用。<\/p>\n<\/blockquote>\n<p>D让同行这一真实参与者和引用次数连在一起，表面上仍在谈科学活动，实质却新增了主旨没有提供的衡量方式。可信度形成需要看共同体怎样处理主张，不能用“同行提到它很多次”替代这一步说明。<\/p>\n<p>本项最终仍要根据“use the new finding to suit their own purposes”和“interaction and confrontation”这两处局部原文判断。前者没有提供引用频率，后者交代的是真实转化过程，D未得到支持。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. B. has been examined by the scientific community**\n\nA借公众接收发现的环节，把吸引公众注意改成主张变可信的条件。\n\nB概括共同体分工与不同看法的互动交锋，准确回答主张经历了什么检验。\n\nC用编辑和审稿人在发表环节的认可，回答了范围更广的共同体可信度转化。\n\nD由其他科学家使用发现，补出频繁引用及其确立可信度的作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[18,1122,1456,408],"sourceW":1732,"sourceH":2566},"meta":{"kind":"conclusion","question":33},"level":3,"html":"<blockquote>\n<p><strong>33. B. has been examined by the scientific community<\/strong><\/p>\n<\/blockquote>\n<p>A借公众接收发现的环节，把吸引公众注意改成主张变可信的条件。<\/p>\n<p>B概括共同体分工与不同看法的互动交锋，准确回答主张经历了什么检验。<\/p>\n<p>C用编辑和审稿人在发表环节的认可，回答了范围更广的共同体可信度转化。<\/p>\n<p>D由其他科学家使用发现，补出频繁引用及其确立可信度的作用。<\/p>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> Albert Szent-Györgyi would most likely agree that ______.  \n> 阿尔伯特·圣捷尔吉最可能同意以下哪种说法？\n\n### 题型\n\n局部推断题。题干以`Albert Szent-Györgyi`锁定第4段的引语，要求判断他最可能赞同什么。先列出名言明确说的思考方式，再结合本段重新审视已有知识的语境作最小推断；不能把作者提到的任何科学现象都当成这位人物的意见，也不能替引语增加关于未来影响或研究价值的判断。\n\n### 核心出处\n\n> First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.\n>\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.\n>\n> Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”\n>\n> But thinking what nobody else has thought and telling others what they have missed may not change their views.\n\n前两句说明科学工作会重新审视已有认识，已被认为可信的发现也仍接受质疑、修改或反驳；名言则直接说明，在人人看见的事物面前，发现者要能提出别人没有想到的认识。后一句补充，新想法未必能改变他人的观点，没有保证它的影响结果。\n\n据此可作的最小推断是：科学工作需要独立审视、质疑既有解释的思维。`critical mind`在这里指这种批判性思维，不是凡事否定，也不是保证自己的新想法必定正确。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[18,1631,1124,398],"sourceW":1732,"sourceH":2566},"meta":{"kind":"question","question":34},"level":2,"html":"<blockquote>\n<p>Albert Szent-Györgyi would most likely agree that ______.<br>阿尔伯特·圣捷尔吉最可能同意以下哪种说法？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>局部推断题。题干以<code>Albert Szent-Györgyi<\/code>锁定第4段的引语，要求判断他最可能赞同什么。先列出名言明确说的思考方式，再结合本段重新审视已有知识的语境作最小推断；不能把作者提到的任何科学现象都当成这位人物的意见，也不能替引语增加关于未来影响或研究价值的判断。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.<\/p>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<\/blockquote>\n<p>前两句说明科学工作会重新审视已有认识，已被认为可信的发现也仍接受质疑、修改或反驳；名言则直接说明，在人人看见的事物面前，发现者要能提出别人没有想到的认识。后一句补充，新想法未必能改变他人的观点，没有保证它的影响结果。<\/p>\n<p>据此可作的最小推断是：科学工作需要独立审视、质疑既有解释的思维。<code>critical mind<\/code>在这里指这种批判性思维，不是凡事否定，也不是保证自己的新想法必定正确。<\/p>\n"},{"title":"A. scientific claims will survive challenges","raw":"### A. scientific claims will survive challenges\n\n> 科学主张会经受住挑战。\n\n**做题模式中的状态：** 当时A的英文没有遮挡，原文的`refutation`显示为`[xxx]`。第一轮已读到主张`open to challenge`并有`potential modification`，将接受挑战、可能修改与A的经受住挑战比较，认为前者没有给出后者的成功结果，因此排除A，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用了原文真实出现的挑战，把科学主张持续接受质疑的状态改成它们能在挑战后保留下来的结果。原文不仅没有保证成功经受挑战，还明确保留修改或反驳的可能；科学主张需要被审视，与审视后依旧成立是两回事。\n\n**出处：**\n\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.\n>\n> Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1716,889,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q34-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，原文的<code>refutation<\/code>显示为<code>[xxx]<\/code>。第一轮已读到主张<code>open to challenge<\/code>并有<code>potential modification<\/code>，将接受挑战、可能修改与A的经受住挑战比较，认为前者没有给出后者的成功结果，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文真实出现的挑战，把科学主张持续接受质疑的状态改成它们能在挑战后保留下来的结果。原文不仅没有保证成功经受挑战，还明确保留修改或反驳的可能；科学主张需要被审视，与审视后依旧成立是两回事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. scientific claims will survive challenges","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 阿尔伯特·圣捷尔吉最可能同意，科学主张会经受住挑战。\n\n题干的人名定位第4段引语，A的`challenges`对应引语前面的`open to challenge`。需要核对的是接受挑战这一过程，能否推出挑战结束后主张仍然成立的结果。\n\n原文说，看起来重要且有说服力的新发现主张和可信发现仍向挑战开放，也可能被未来研究者修改或反驳。句中的`always`限制的是保持开放这一状态，并不保证被挑战的主张都会保留下来。\n\nA的`survive`要求主张经受挑战后依然成立，写出了一个肯定的后续结果；原文的`potential modification or refutation`却把修改、反驳作为仍然存在的可能。二者的差别落在结果，不能因为都出现挑战就合并。\n\n人物的名言鼓励面对同样的观察提出不同认识，也没有说既有主张终会证明自己正确。新的审视可能支持原来的说法，也可能使它改变；引语并未替这些不同结果作出统一保证。\n\nA将“科学主张持续接受检验”改为“科学主张会成功经受检验”，超出了原文保留的开放结果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1716,889,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q34-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，原文的<code>refutation<\/code>显示为<code>[xxx]<\/code>。第一轮已读到主张<code>open to challenge<\/code>并有<code>potential modification<\/code>，将接受挑战、可能修改与A的经受住挑战比较，认为前者没有给出后者的成功结果，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文真实出现的挑战，把科学主张持续接受质疑的状态改成它们能在挑战后保留下来的结果。原文不仅没有保证成功经受挑战，还明确保留修改或反驳的可能；科学主张需要被审视，与审视后依旧成立是两回事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p>题干的人名定位第4段引语，A的<code>challenges<\/code>对应引语前面的<code>open to challenge<\/code>。需要核对的是接受挑战这一过程，能否推出挑战结束后主张仍然成立的结果。<\/p>\n<p>原文说，看起来重要且有说服力的新发现主张和可信发现仍向挑战开放，也可能被未来研究者修改或反驳。句中的<code>always<\/code>限制的是保持开放这一状态，并不保证被挑战的主张都会保留下来。<\/p>\n<p>A的<code>survive<\/code>要求主张经受挑战后依然成立，写出了一个肯定的后续结果；原文的<code>potential modification or refutation<\/code>却把修改、反驳作为仍然存在的可能。二者的差别落在结果，不能因为都出现挑战就合并。<\/p>\n<p>人物的名言鼓励面对同样的观察提出不同认识，也没有说既有主张终会证明自己正确。新的审视可能支持原来的说法，也可能使它改变；引语并未替这些不同结果作出统一保证。<\/p>\n<p>A将“科学主张持续接受检验”改为“科学主张会成功经受检验”，超出了原文保留的开放结果。<\/p>\n<\/section>"},{"title":"A. scientific claims will survive challenges","raw":"#### 写作视角法\n\n原文在谈主张的后续命运时写道：\n\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.\n>\n> 即使目前看起来重要且可信，主张仍可能受到未来研究者的挑战、修改或反驳。\n\n这一写法使可信度保持可修正的性质。作者随后引入不同于他人的思考，继续给重新认识留下空间，没有用“挑战会被克服”来结束讨论。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Scientific claims will withstand the challenges brought against them.\n>\n> 科学主张会经受住所面临的挑战。\n\n这段假设需要补出主张最终保留下来的肯定结果；它不必说挑战从未发生，也不必取消提出质疑的权利。实际原文没有给出这一结果，而把修改和反驳保留为后续可能，故两种推进不能互换。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1716,889,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q34-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，原文的<code>refutation<\/code>显示为<code>[xxx]<\/code>。第一轮已读到主张<code>open to challenge<\/code>并有<code>potential modification<\/code>，将接受挑战、可能修改与A的经受住挑战比较，认为前者没有给出后者的成功结果，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文真实出现的挑战，把科学主张持续接受质疑的状态改成它们能在挑战后保留下来的结果。原文不仅没有保证成功经受挑战，还明确保留修改或反驳的可能；科学主张需要被审视，与审视后依旧成立是两回事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p>题干的人名定位第4段引语，A的<code>challenges<\/code>对应引语前面的<code>open to challenge<\/code>。需要核对的是接受挑战这一过程，能否推出挑战结束后主张仍然成立的结果。<\/p>\n<p>原文说，看起来重要且有说服力的新发现主张和可信发现仍向挑战开放，也可能被未来研究者修改或反驳。句中的<code>always<\/code>限制的是保持开放这一状态，并不保证被挑战的主张都会保留下来。<\/p>\n<p>A的<code>survive<\/code>要求主张经受挑战后依然成立，写出了一个肯定的后续结果；原文的<code>potential modification or refutation<\/code>却把修改、反驳作为仍然存在的可能。二者的差别落在结果，不能因为都出现挑战就合并。<\/p>\n<p>人物的名言鼓励面对同样的观察提出不同认识，也没有说既有主张终会证明自己正确。新的审视可能支持原来的说法，也可能使它改变；引语并未替这些不同结果作出统一保证。<\/p>\n<p>A将“科学主张持续接受检验”改为“科学主张会成功经受检验”，超出了原文保留的开放结果。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-A-2\"><h3>写作视角法<\/h3>\n<p>原文在谈主张的后续命运时写道：<\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>即使目前看起来重要且可信，主张仍可能受到未来研究者的挑战、修改或反驳。<\/p>\n<\/blockquote>\n<p>这一写法使可信度保持可修正的性质。作者随后引入不同于他人的思考，继续给重新认识留下空间，没有用“挑战会被克服”来结束讨论。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Scientific claims will withstand the challenges brought against them.<\/p>\n<p>科学主张会经受住所面临的挑战。<\/p>\n<\/blockquote>\n<p>这段假设需要补出主张最终保留下来的肯定结果；它不必说挑战从未发生，也不必取消提出质疑的权利。实际原文没有给出这一结果，而把修改和反驳保留为后续可能，故两种推进不能互换。<\/p>\n<\/section>"},{"title":"A. scientific claims will survive challenges","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入34题题干：\n\n> 全文主旨只能确认人物引语与科学认识怎样取得可信度有关，不能由取得可信度进一步判断主张会不会经受住今后的挑战；这种结果必须由第4段原文确定。\n\n但A实际说的是：\n\n> scientific claims will survive challenges  \n> 科学主张会经受住挑战。\n\n可信度的形成不等于此后结果不再开放。A把主题中的“经过检验取得可信地位”向未来延伸，变成“在后续挑战中仍会成立”，而全文没有赋予可信发现这种保证。\n\n本项最终仍要根据“open to challenge”和“potential modification or refutation”这两处局部原文判断。原文允许主张被改变或反驳，A却直接写出它经受住挑战的结果。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1716,889,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q34-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，原文的<code>refutation<\/code>显示为<code>[xxx]<\/code>。第一轮已读到主张<code>open to challenge<\/code>并有<code>potential modification<\/code>，将接受挑战、可能修改与A的经受住挑战比较，认为前者没有给出后者的成功结果，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文真实出现的挑战，把科学主张持续接受质疑的状态改成它们能在挑战后保留下来的结果。原文不仅没有保证成功经受挑战，还明确保留修改或反驳的可能；科学主张需要被审视，与审视后依旧成立是两回事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p>题干的人名定位第4段引语，A的<code>challenges<\/code>对应引语前面的<code>open to challenge<\/code>。需要核对的是接受挑战这一过程，能否推出挑战结束后主张仍然成立的结果。<\/p>\n<p>原文说，看起来重要且有说服力的新发现主张和可信发现仍向挑战开放，也可能被未来研究者修改或反驳。句中的<code>always<\/code>限制的是保持开放这一状态，并不保证被挑战的主张都会保留下来。<\/p>\n<p>A的<code>survive<\/code>要求主张经受挑战后依然成立，写出了一个肯定的后续结果；原文的<code>potential modification or refutation<\/code>却把修改、反驳作为仍然存在的可能。二者的差别落在结果，不能因为都出现挑战就合并。<\/p>\n<p>人物的名言鼓励面对同样的观察提出不同认识，也没有说既有主张终会证明自己正确。新的审视可能支持原来的说法，也可能使它改变；引语并未替这些不同结果作出统一保证。<\/p>\n<p>A将“科学主张持续接受检验”改为“科学主张会成功经受检验”，超出了原文保留的开放结果。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-A-2\"><h3>写作视角法<\/h3>\n<p>原文在谈主张的后续命运时写道：<\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>即使目前看起来重要且可信，主张仍可能受到未来研究者的挑战、修改或反驳。<\/p>\n<\/blockquote>\n<p>这一写法使可信度保持可修正的性质。作者随后引入不同于他人的思考，继续给重新认识留下空间，没有用“挑战会被克服”来结束讨论。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Scientific claims will withstand the challenges brought against them.<\/p>\n<p>科学主张会经受住所面临的挑战。<\/p>\n<\/blockquote>\n<p>这段假设需要补出主张最终保留下来的肯定结果；它不必说挑战从未发生，也不必取消提出质疑的权利。实际原文没有给出这一结果，而把修改和反驳保留为后续可能，故两种推进不能互换。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认人物引语与科学认识怎样取得可信度有关，不能由取得可信度进一步判断主张会不会经受住今后的挑战；这种结果必须由第4段原文确定。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>scientific claims will survive challenges<br>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p>可信度的形成不等于此后结果不再开放。A把主题中的“经过检验取得可信地位”向未来延伸，变成“在后续挑战中仍会成立”，而全文没有赋予可信发现这种保证。<\/p>\n<p>本项最终仍要根据“open to challenge”和“potential modification or refutation”这两处局部原文判断。原文允许主张被改变或反驳，A却直接写出它经受住挑战的结果。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. discoveries today inspire future research","raw":"### B. discoveries today inspire future research\n\n> 今天的发现会启发未来的研究。\n\n**做题模式中的状态：** 当时B的英文没有遮挡。第一轮将`inspire future research`与名言中的独立思考及后句`may not change their views`比较，认为原文没有写出“今天的发现启发未来研究”这一时间与作用关系，因此排除B，后续没有改变。\n\n**错误类型：第三类——无中生有。**\n\nB借用了科学发现和未来研究者这两处真实材料，把它们接成今天的发现启发未来研究。引语讲的是发现者怎样面对相同观察提出新想法；前文的未来研究者则在挑战、修改或反驳现有主张。原文没有把未来研究产生的原因写成受到今天发现的启发，不能凭相关话题补出人物赞同这一说法。\n\n**出处：**\n\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.\n>\n> Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”\n>\n> But thinking what nobody else has thought and telling others what they have missed may not change their views.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 B选项","focus":[93,1801,893,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":34,"option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q34-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡。第一轮将<code>inspire future research<\/code>与名言中的独立思考及后句<code>may not change their views<\/code>比较，认为原文没有写出“今天的发现启发未来研究”这一时间与作用关系，因此排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B借用了科学发现和未来研究者这两处真实材料，把它们接成今天的发现启发未来研究。引语讲的是发现者怎样面对相同观察提出新想法；前文的未来研究者则在挑战、修改或反驳现有主张。原文没有把未来研究产生的原因写成受到今天发现的启发，不能凭相关话题补出人物赞同这一说法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. discoveries today inspire future research","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 阿尔伯特·圣捷尔吉最可能同意，今天的发现会启发未来的研究。\n\n题干的人名定位名言，B的`future research`容易让人联系到前文的`future researchers`；但前文必须按完整动作理解，不能看到未来研究者，就自行补成他们受到启发。\n\n名言说，大家看见相同事物时，发现者想到了别人没有想过的内容。这里比较的是同样的观察与不同的思考，主体是提出新认识的发现者，并未转到后来研究者受到何种启发。\n\n前文确实写了未来研究者，但他们的动作是挑战、修改或反驳主张。后续研究可以与已有发现发生关系，仍不等于本句已经交代“已有发现激发后来研究”的因果；被研究、被质疑与成为灵感来源，需要分别说明。\n\n引语后面的`may not change their views`又提醒，新思考的影响并未得到保证。这句话不能证明未来研究绝不会受到启发，但它也没有提供B需要的正面依据；本题要找有文本支持的人物意见，而不是一般情况下可能成立的科学常识。\n\nB把“如何产生不同认识”改成“现有发现对未来研究的启发作用”，增加了引语及其语境都没有明确建立的时间和作用关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 B选项","focus":[93,1801,893,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q34-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡。第一轮将<code>inspire future research<\/code>与名言中的独立思考及后句<code>may not change their views<\/code>比较，认为原文没有写出“今天的发现启发未来研究”这一时间与作用关系，因此排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B借用了科学发现和未来研究者这两处真实材料，把它们接成今天的发现启发未来研究。引语讲的是发现者怎样面对相同观察提出新想法；前文的未来研究者则在挑战、修改或反驳现有主张。原文没有把未来研究产生的原因写成受到今天发现的启发，不能凭相关话题补出人物赞同这一说法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-B-1\"><h3>定位比对法<\/ 现启发未来研究。引语讲的是发现者怎样面对相同观察提出新想法；前文的未来研究者则在挑战、修改或反驳现有主张。原文没有把未来研究产生的原因写成受到今天发现的启发，不能凭相关话题补出人物赞同这一说法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p>题干的人名定位名言，B的<code>future research<\/code>容易让人联系到前文的<code>future researchers<\/code>；但前文必须按完整动作理解，不能看到未来研究者，就自行补成他们受到启发。<\/p>\n<p>名言说，大家看见相同事物时，发现者想到了别人没有想过的内容。这里比较的是同样的观察与不同的思考，主体是提出新认识的发现者，并未转到后来研究者受到何种启发。<\/p>\n<p>前文确实写了未来研究者，但他们的动作是挑战、修改或反驳主张。后续研究可以与已有发现发生关系，仍不等于本句已经交代“已有发现激发后来研究”的因果；被研究、被质疑与成为灵感来源，需要分别说明。<\/p>\n<p>引语后面的<code>may not change their views<\/code>又提醒，新思考的影响并未得到保证。这句话不能证明未来研究绝不会受到启发，但它也没有提供B需要的正面依据；本题要找有文本支持的人物意见，而不是一般情况下可能成立的科学常识。<\/p>\n<p>B把“如何产生不同认识”改成“现有发现对未来研究的启发作用”，增加了引语及其语境都没有明确建立的时间和作用关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-B-2\"><h3>写作视角法<\/h3>\n<p>原文在名言之后这样接着写：<\/p>\n<blockquote>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>Sometimes years are required for truly novel discovery claims to be accepted and appreciated.<\/p>\n<p>新想法未必能改变别人的观点，真正新颖的发现主张有时还需要多年才能被接受和欣赏。<\/p>\n<\/blockquote>\n<p>作者实际继续讨论的是新颖认识怎样遭遇接受困难，让人物引语服务于可信度形成中的阻力。这里既没有介绍一项后来的研究，也没有说明它受到先前发现的激发。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Present discoveries provide ideas that stimulate later scientific research.<\/p>\n<p>现有发现提供新的想法，启发后来的科学研究。<\/p>\n<\/blockquote>\n<p>假设写法只需补出启发这一作用，不必保证所有发现都立刻引起更多研究。实际文章写的是新想法可能不被接受，未说明它为后续研究提供灵感；接受受阻不排除未来影响，但也不能代替B所需的启发关系。<\/p>\n<\/section>"},{"title":"B. discoveries today inspire future research","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入34题题干：\n\n> 全文主旨只能确认人物引语在解释发现与可信度形成之间的关系，不能单独判断今天的发现是否启发未来研究；仍须看这位人物具体谈了什么。\n\n但B实际说的是：\n\n> discoveries today inspire future research  \n> 今天的发现会启发未来的研究。\n\nB把关注点放在今天与未来之间的启发作用上，而全文这一位置在说发现者如何提出不同认识，以及新认识为什么未必被立即接受。两者都属于科学活动，却回答了不同问题。\n\n本项最终仍要根据“thinking what nobody has thought”这处局部原文判断。它支持独立思考的方式，没有交代由现有发现推动未来研究的作用；不能用主题相关来补足这一缺失。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 B选项","focus":[93,1801,893,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q34-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡。第一轮将<code>inspire future research<\/code>与名言中的独立思考及后句<code>may not change their views<\/code>比较，认为原文没有写出“今天的发现启发未来研究”这一时间与作用关系，因此排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B借用了科学发现和未来研究者这两处真实材料，把它们接成今天的发现启发未来研究。引语讲的是发现者怎样面对相同观察提出新想法；前文的未来研究者则在挑战、修改或反驳现有主张。原文没有把未来研究产生的原因写成受到今天发现的启发，不能凭相关话题补出人物赞同这一说法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not c 被立即接受。两者都属于科学活动，却回答了不同问题。<\/p>\n<p>本项最终仍要根据“thinking what nobody has thought”这处局部原文判断。它支持独立思考的方式，没有交代由现有发现推动未来研究的作用；不能用主题相关来补足这一缺失。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. efforts to make discoveries are justified","raw":"### C. efforts to make discoveries are justified\n\n> 为作出发现而付出的努力是有正当理由的。\n\n**做题模式中的状态：** 当时C的`justified`显示为`[xxx]`。第一轮已看出选项要评价`efforts to make discoveries`，而人物引语在描述面对同样事物怎样产生不同认识；后句也只补充新想法未必改变别人，因此没有从思考方式推到对发现努力的评价，排除C，后续没有改变。\n\n**错误类型：第三类——无中生有。**\n\nC借用了发现这一话题，把“发现包含怎样的观察与思考”换成“投入发现的努力是否有正当理由”。`justified`需要对付出这些努力的合理性作肯定判断，而引语并未作出这种评价。说明一种活动怎样发生，并不自动等于评价为它付出努力是合理的；不能把对创新思维的描述扩展成对研究投入的总体肯定。\n\n**出处：**\n\n> Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”\n>\n> But thinking what nobody else has thought and telling others what they have missed may not change their views.\n>\n> Sometimes years are required for truly novel discovery claims to be accepted and appreciated.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1886,881,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q34-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>justified<\/code>显示为<code>[xxx]<\/code>。第一轮已看出选项要评价<code>efforts to make discoveries<\/code>，而人物引语在描述面对同样事物怎样产生不同认识；后句也只补充新想法未必改变别人，因此没有从思考方式推到对发现努力的评价，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了发现这一话题，把“发现包含怎样的观察与思考”换成“投入发现的努力是否有正当理由”。<code>justified<\/code>需要对付出这些努力的合理性作肯定判断，而引语并未作出这种评价。说明一种活动怎样发生，并不自动等于评价为它付出努力是合理的；不能把对创新思维的描述扩展成对研究投入的总体肯定。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>Sometimes years are required for truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. efforts to make discoveries are justified","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 阿尔伯特·圣捷尔吉最可能同意，为作出发现而付出的努力是有正当理由的。\n\n用题干的人名找到名言，C中的`make discoveries`对应名言描述的`discovery`，而`efforts`和`justified`则需要找到关于研究努力及其合理性的判断。仅有共同的发现话题，还不足以把这两个内容补进去。\n\n名言明确给出的事实是：发现者看见人人看见的事物，却想到了别人没有想到的内容。它把差别放在如何思考，既没有比较投入多少努力，也没有就这些努力是否值得或是否有正当理由作评价。\n\n后两句说，新想法可能改变不了他人，真正新颖的主张有时经过多年才获接受。它们补的是认识传播与接受的困难；等待多年可以说明过程漫长，却不能单独证明为此付出的努力是合理还是不合理。\n\nC的主语换成`efforts`，谓语用`are justified`作肯定评价。要接受这项，就需要人物把作出发现的努力与值得投入的理由联系起来；现有引语和补充句均没有给出这条联系。\n\nC把发现时的思维特点转成对研究努力的正当性评价，新增了原文没有表达的判断。不能选C，也不意味着文章在否定科学努力，只表示这项人物意见未由引语支持。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1886,881,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q34-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>justified<\/code>显示为<code>[xxx]<\/code>。第一轮已看出选项要评价<code>efforts to make discoveries<\/code>，而人物引语在描述面对同样事物怎样产生不同认识；后句也只补充新想法未必改变别人，因此没有从思考方式推到对发现努力的评价，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了发现这一话题，把“发现包含怎样的观察与思考”换成“投入发现的努力是否有正当理由”。<code>justified<\/code>需要对付出这些努力的合理性作肯定判断，而引语并未作出这种评价。说明一种活动怎样发生，并不自动等于评价为它付出努力是合理的；不能把对创新思维的描述扩展成对研究投入的总体肯定。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>Sometimes years are required for truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>用题干的人名找到名言，C中的<code>make discoveries<\/code>对应名言描述的<code>discovery<\/code>，而<code>efforts<\/code>和<code>justified<\/code>则需要找到关于研究努力及其合理性的判断。仅有共同的发现话题，还不足以把这两个内容补进去。<\/p>\n<p>名言明确给出的事实是：发现者看见人人看见的事物，却想到了别人没有想到的内容。它把差别放在如何思考，既没有比较投入多少努力，也没有就这些努力是否值得或是否有正当理由作评价。<\/p>\n<p>后两句说，新想法可能改变不了他人，真正新颖的主张有时经过多年才获接受。它们补的是认识传播与接受的困难；等待多年可以说明过程漫长，却不能单独证明为此付出的努力是合理还是不合理。<\/p>\n<p>C的主语换成<code>efforts<\/code>，谓语用<code>are justified<\/code>作肯定评价。要接受这项，就需要人物把作出发现的努力与值得投入的理由联系起来；现有引语和补充句均没有给出这条联系。<\/p>\n<p>C把发现时的思维特点转成对研究努力的正当性评价，新增了原文没有表达的判断。不能选C，也不意味着文章在否定科学努力，只表示这项人物意见未由引语支持。<\/p>\n<\/section>"},{"title":"C. efforts to make discoveries are justified","raw":"#### 写作视角法\n\n原文从人物引语继续写道：\n\n> Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”\n>\n> But thinking what nobody else has thought and telling others what they have missed may not change their views.\n>\n> 新发现依靠不同于他人的思考，但提出这样的新想法，未必就能改变别人的观点。\n\n实际推进先说明发现的思考特点，再转向新认识受到接受阻力。作者没有由这句名言转入“付出这些努力为什么合理”的论证，也没有在困难之后给出投入正当性的评价。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The effort devoted to making scientific discoveries is warranted.\n>\n> 为作出科学发现而投入努力是有正当理由的。\n\n这段假设只增加C要求的评价，不必同时承诺发现必然成功或立即获得认可。实际原文没有作出这一评价；新认识怎样产生、怎样被接受，与为此投入努力是否有正当理由，属于两个需要分别表达的判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1886,881,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulative  what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>新发现依靠不同于他人的思考，但提出这样的新想法，未必就能改变别人的观点。<\/p>\n<\/blockquote>\n<p>实际推进先说明发现的思考特点，再转向新认识受到接受阻力。作者没有由这句名言转入“付出这些努力为什么合理”的论证，也没有在困难之后给出投入正当性的评价。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The effort devoted to making scientific discoveries is warranted.<\/p>\n<p>为作出科学发现而投入努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>这段假设只增加C要求的评价，不必同时承诺发现必然成功或立即获得认可。实际原文没有作出这一评价；新认识怎样产生、怎样被接受，与为此投入努力是否有正当理由，属于两个需要分别表达的判断。<\/p>\n<\/section>"},{"title":"C. efforts to make discoveries are justified","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入34题题干：\n\n> 全文主旨只能确认人物引语与发现主张取得可信度的过程有关，不能判断他是否肯定发现努力的正当性；这一评价仍需由人物引语提供依据。\n\n但C实际说的是：\n\n> efforts to make discoveries are justified  \n> 为作出发现而付出的努力是有正当理由的。\n\n全文解释的是可信度如何形成，C评价的是为发现投入努力是否合理。解释科学实践中的一个过程，可以涉及创新与困难，却没有因此完成对研究努力的价值或正当性判断。\n\n本项最终仍要根据“seeing what everybody has seen and thinking what nobody has thought”这处局部原文判断。它说明观察相同而思考不同，没有评价努力是否合理，C添入了引语没有表达的态度。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1886,881,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q34-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>justified<\/code>显示为<code>[xxx]<\/code>。第一轮已看出选项要评价<code>efforts to make discoveries<\/code>，而人物引语在描述面对同样事物怎样产生不同认识；后句也只补充新想法未必改变别人，因此没有从思考方式推到对发现努力的评价，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了发现这一话题，把“发现包含怎样的观察与思考”换成“投入发现的努力是否有正当理由”。<code>justified<\/code>需要对付出这些努力的合理性作肯定判断，而引语并未作出这种评价。说明一种活动怎样发生，并不自动等于评价为它付出努力是合理的；不能把对创新思维的描述扩展成对研究投入的总体肯定。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>Sometimes years are required for truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>用题干的人名找到名言，C中的<code>make discoveries<\/code>对应名言描述的<code>discovery<\/code>，而<code>efforts<\/code>和<code>justified<\/code>则需要找到关于研究努力及其合理性的判断。仅有共同的发现话题，还不足以把这两个内容补进去。<\/p>\n<p>名言明确给出的事实是：发现者看见人人看见的事物，却想到了别人没有想到的内容。它把差别放在如何思考，既没有比较投入多少努力，也没有就这些努力是否值得或是否有正当理由作评价。<\/p>\n<p>后两句说，新想法可能改变不了他人，真正新颖的主张有时经过多年才获接受。它们补的是认识传播与接受的困难；等待多年可以说明过程漫长，却不能单独证明为此付出的努力是合理还是不合理。<\/p>\n<p>C的主语换成<code>efforts<\/code>，谓语用<code>are justified<\/code>作肯定评价。要接受这项，就需要人物把作出发现的努力与值得投入的理由联系起来；现有引语和补充句均没有给出这条联系。<\/p>\n<p>C把发现时的思维特点转成对研究努力的正当性评价，新增了原文没有表达的判断。不能选C，也不意味着文章在否定科学努力，只表示这项人物意见未由引语支持。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-2\"><h3>写作视角法<\/h3>\n<p>原文从人物引语继续写道：<\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>新发现依靠不同于他人的思考，但提出这样的新想法，未必就能改变别人的观点。<\/p>\n<\/blockquote>\n<p>实际推进先说明发现的思考特点，再转向新认识受到接受阻力。作者没有由这句名言转入“付出这些努力为什么合理”的论证，也没有在困难之后给出投入正当性的评价。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The effort devoted to making scientific discoveries is warranted.<\/p>\n<p>为作出科学发现而投入努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>这段假设只增加C要求的评价，不必同时承诺发现必然成功或立即获得认可。实际原文没有作出这一评价；新认识怎样产生、怎样被接受，与为此投入努力是否有正当理由，属于两个需要分别表达的判断。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认人物引语与发现主张取得可信度的过程有关，不能判断他是否肯定发现努力的正当性；这一评价仍需由人物引语提供依据。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>efforts to make discoveries are justified<br>为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>全文解释的是可信度如何形成，C评价的是为发现投入努力是否合理。解释科学实践中的一个过程，可以涉及创新与困难，却没有因此完成对研究努力的价值或正当性判断。<\/p>\n<p>本项最终仍要根据“seeing what everybody has seen and thinking what nobody has thought”这处局部原文判断。它说明观察相同而思考不同，没有评价努力是否合理，C添入了引语没有表达的态度。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. scientific work calls for a critical mind","raw":"### D. scientific work calls for a critical mind\n\n> 科学工作需要批判性思维。\n\n**做题模式中的状态：** 当时D的英文没有遮挡。第一轮把人物引语的`thinking what nobody has thought`与前文主张保持`open to challenge`接起来，读出不照搬已有看法、重新审视认识的要求，因此保留D；其余三项排除后选择D，后续没有改变。\n\n**选项类型：正确局部推断。**\n\nD把名言所说的独立思考概括为科学工作需要的批判性思维。大家可以面对相同事物，发现者却不能只停留在已有解释上；本段又把科学工作指向现有知识中不完整或不正确的部分，允许已被认可的主张继续接受挑战。两层共同支持独立审视、提出不同判断的能力，而不是否定所有既有知识。\n\n**出处：**\n\n> First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.\n>\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.\n>\n> Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1971,877,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q34-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把人物引语的<code>thinking what nobody has thought<\/code>与前文主张保持<code>open to challenge<\/code>接起来，读出不照搬已有看法、重新审视认识的要求，因此保留D；其余三项排除后选择D，后续没有改变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>D把名言所说的独立思考概括为科学工作需要的批判性思维。大家可以面对相同事物，发现者却不能只停留在已有解释上；本段又把科学工作指向现有知识中不完整或不正确的部分，允许已被认可的主张继续接受挑战。两层共同支持独立审视、提出不同判断的能力，而不是否定所有既有知识。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.<\/p>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. scientific work calls for a critical mind","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 阿尔伯特·圣捷尔吉最可能同意，科学工作需要批判性思维。\n\n题干的人名锁定名言，D的`critical mind`对应引语中不满足于已有思考的`thinking what nobody has thought`，并需结合本段对不完整、错误知识的重新审视来理解。这里不是只看“新想法”三个字，而是看作者将它放在哪种科学活动中。\n\n名言先说看到人人看见的事物，再说想到别人没有想到的内容。第一部分说明观察对象可以相同，第二部分把发现的区别放在思考方式上：不能因为他人已有解释，就停止自己的判断。\n\n前文补充了这种独立思考所面对的对象和态度。科学工作关注现有认识中被视为不完整或不正确的部分，即便看起来重要且可信的发现也仍向挑战、修改或反驳开放；已有认可不能替代继续审视。\n\nD的`critical`因此应理解为能够反思、检验和质疑现有认识，`calls for`说明科学工作需要这种能力。它没有说所有旧认识都是错的，也没有把独特想法直接等同于真实发现，只概括形成新认识所需要的思维要求。\n\nD从“相同观察中形成独立认识”及“既有主张仍接受审视”作出有限推断，准确回答这位人物最可能赞同的科学思维方式。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1971,877,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focu
