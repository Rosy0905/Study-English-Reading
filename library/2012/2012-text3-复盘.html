我、这里、现在”属于个体研究者，“任何人、任何地方、任何时间”属于共同体，顺序不能对调。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>这就是可信度过程，通过这个过程，个体研究者的&quot;我、这里、现在&quot;变成了社区的&quot;任何人、任何地方、任何时间&quot;。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>这里的“社区”指共同从事科学活动、审查和接受发现的人，改成“科学共同体”，避免被误解成居住社区。<\/li>\n<li>两边都保留三个并列词和引号，让“人、地点、时间”的一一对应清楚可见，不把它们泛化成一句“所有人都认可”。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>这就是可信度过程，通过这个过程，个体研究者的&quot;我、这里、现在&quot;变成了科学共同体的&quot;任何人、任何地方、任何时间&quot;。<\/p>\n<\/blockquote>\n<h3>3. 第3段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Within the complex social structure / of the scientific community, / researchers make discoveries; / editors and reviewers act as gatekeepers / by controlling the publication process; / other scientists use the new finding / to suit their own purposes; / and finally, / the public (including other scientists) / receives the new discovery / and possibly accompanying technology.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>在复杂的社会结构中 / 科学共同体的，/ 研究者做出发现；/ 编辑和审稿人充当守门人 / 通过控制出版过程；/ 其他科学家使用新发现 / 来适应他们自己的目的；/ 最后，/ 公众（包括其他科学家）/ 接收新发现 / 以及可能伴随的技术。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“科学共同体的”放在“复杂社会结构”前，说明整串活动发生在什么范围内：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中<\/p>\n<\/blockquote>\n<p>编辑和审稿人的做法要接到他们的角色前：<\/p>\n<blockquote>\n<p>编辑和审稿人通过控制出版过程充当守门人<\/p>\n<\/blockquote>\n<p>再分别合并其他科学家和公众所做的事，不能把两类人混成一个主体：<\/p>\n<blockquote>\n<p>其他科学家使用新发现来适应自己的目的\n公众（包括其他科学家）接收新发现以及可能伴随的技术<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中，研究者做出发现\n编辑和审稿人通过控制出版过程充当守门人\n其他科学家使用新发现来适应自己的目的\n最后，公众（包括其他科学家）接收新发现及可能伴随的技术<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>研究者做出发现，各方随后审查、使用或接受发现。<\/p>\n<\/blockquote>\n<p>把共同的范围“在科学共同体的复杂社会结构中”放在最前面，再依次摆出四组“谁做什么”，每组之间用分号分开。控制出版过程是编辑和审稿人的做法；服务自己的目的属于其他科学家；最后接受发现和技术的是公众。“包括其他科学家”紧跟“公众”，“可能伴随的”紧贴“技术”，不要把技术写成必然同时出现。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家使用新发现来适应自己的目的；最后，公众（包括其他科学家）接收新发现以及可能伴随的技术。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“使用新发现来适应自己的目的”搭配生硬，整理为“利用新发现来服务自己的目的”，说明他们怎样把发现用于自身研究。<\/li>\n<li>“接收新发现”改为“接受新发现”，“以及”收为“及”；仍保留“可能伴随的技术”，不把有可能出现的技术改成确定结果。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家利用新发现来服务自己的目的；最后，公众（包括其他科学家）接受新发现及可能伴随的技术。<\/p>\n<\/blockquote>\n<h3>4. 第3段第4句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>As a discovery claim / works its way through the community, / the interaction and confrontation / between shared and competing beliefs / about the science and the technology involved / transforms an individual&#39;s discovery claim / into the community&#39;s credible discovery.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>当一个发现声明 / 在社区中传播时，/ 互动和对抗 / 在共享和竞争的信念之间 / 关于涉及的科学和技术 / 转变个人的发现声明 / 成为社区的可信发现。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把开头两块接起来，说清楚发现声明正经历什么：<\/p>\n<blockquote>\n<p>当一个发现声明在社区中传播时<\/p>\n<\/blockquote>\n<p>中间的说明从里往外合并：先说信念涉及什么，再说两种信念之间发生什么：<\/p>\n<blockquote>\n<p>关于所涉及科学和技术的共享信念与竞争信念\n这些信念之间的互动和对抗<\/p>\n<\/blockquote>\n<p>最后把转变的起点和终点放在一起：<\/p>\n<blockquote>\n<p>将个人的发现声明转变为社区的可信发现<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>当一个发现声明在社区中传播时\n关于所涉及科学和技术的共享信念与竞争信念之间的互动和对抗\n将个人的发现声明转变为社区的可信发现<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>信念之间的互动和对抗促成发现的转变。<\/p>\n<\/blockquote>\n<p>先把传播发生的过程放在句首。主干中的“互动和对抗”比较抽象，要先在它前面说清楚是哪两种信念之间的互动，再给这些信念加上“关于所涉及科学和技术”的范围说明。最后按“将个人的发现声明转变为共同体的可信发现”接出变化结果，不能把个人声明和共同体认可的发现交换位置。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>当一个发现声明在社区中传播时，关于涉及的科学和技术的共享信念与竞争信念之间的互动和对抗，将个人的发现声明转变为社区的可信发现。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“社区”在这里统一为“共同体”，与文章讨论的科学群体保持一致；“一个发现声明”收成“发现声明”，保留泛指。<\/li>\n<li>“关于涉及的科学和技术的……”整理为“关于所涉及科学和技术的……”，减少连续的“的”，但保留这些信念所针对的范围。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>当发现声明在共同体中传播时，关于所涉及科学和技术的共享信念与竞争信念之间的互动和对抗，将个人的发现声明转变为共同体的可信发现。<\/p>\n<\/blockquote>\n<h3>5. 第4段第5句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be  important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Not surprisingly, / newly published discovery claims / and credible discoveries / that appear to be important and convincing / will always be open to / challenge and potential modification or refutation / by future researchers.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>不出所料，/ 新发表的发现声明 / 和可信的发现 / 看起来重要且令人信服的 / 将始终开放于 / 挑战和潜在的修改或反驳 / 由未来的研究者。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把两类对象分别说完整，再并列起来；“看起来”要保留，不能变成毫无限制的断言：<\/p>\n<blockquote>\n<p>新发表的发现声明\n看起来重要且令人信服的可信发现<\/p>\n<\/blockquote>\n<p>后半句先把未来的研究者和他们可能做的事合在一起：<\/p>\n<blockquote>\n<p>未来研究者的挑战、潜在修改或反驳<\/p>\n<\/blockquote>\n<p>再把前面的语气和持续性留下来：<\/p>\n<blockquote>\n<p>不出所料\n将始终开放于这些挑战、修改或反驳<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>不出所料，新发表的发现声明和看起来重要且令人信服的可信发现\n将始终开放于未来研究者的挑战、潜在修改或反驳<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>发现声明和可信发现仍然会面临挑战。<\/p>\n<\/blockquote>\n<p>先放“不出所料”，承接前面科学研究重在求新的说法。把“新发表的”接在发现声明前，把“看起来重要且令人信服的”接在可信发现前，两者共同作被挑战的对象。再用“总是会”接到后面的挑战、修改或反驳；把“未来研究者的”放在这些行动前，说明是谁继续检验发现。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>不出所料，新发表的发现声明和看起来重要且令人信服的可信发现，将总是对未来研究者的挑战、潜在修改或反驳保持开放。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“对挑战、修改或反驳保持开放”带有直译痕迹，改为“面临……”，让中文直接说明这些发现仍可被继续检验。<\/li>\n<li>“将总是”整理为“总是会”，保留持续可被挑战的语气；“潜在”仍然保留，不把可能的修改或反驳写成已经发生的结果。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>不出所料，新发表的发现声明和看起来重要且令人信服的可信发现，总是会面临未来研究者的挑战、潜在修改或反驳。<\/p>\n<\/blockquote>\n<h3>6. 第5段第1句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>In the end, credibility “happens” to a discovery claim – a process that corresponds to what philosopher Annette Baier has described as the <em>commons of the mind<\/em>.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>In the end, / credibility &quot;happens&quot; to / a discovery claim -- / a process that corresponds to / what philosopher Annette Baier / has described as / the <em>commons of the mind<\/em>.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>最终，/ 可信度&quot;发生在&quot; / 一个发现声明上 -- / 一个过程对应于 / 哲学家安妮特·拜尔 / 所描述的 / &quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“发生在”和它针对的对象连起来，保留原文特意加上的引号：<\/p>\n<blockquote>\n<p>可信度“发生在”一个发现声明上<\/p>\n<\/blockquote>\n<p>再把人物、说法和这个说法的名称合并起来：<\/p>\n<blockquote>\n<p>哲学家安妮特·拜尔所描述的“思想的公地”<\/p>\n<\/blockquote>\n<p>破折号后的“一个过程”是在接着解释前面的事情，先把它指回去：<\/p>\n<blockquote>\n<p>这个过程对应于“思想的公地”<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>最终，可信度“发生在”一个发现声明上\n这个过程对应于哲学家安妮特·拜尔所描述的“思想的公地”<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>可信度的形成过程对应于“思想的公地”。<\/p>\n<\/blockquote>\n<p>先放时间收束语“最终”，再交代可信度发生在发现声明上。破折号后用“这个过程”接回前半句的形成过程，随后放“对应于”。把哲学家的姓名和“所描述的”一起放在“思想的公地”前，说明这一名称来自谁，不把哲学家本人写成过程对应的对象。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>最终，可信度&quot;发生在&quot;一个发现声明上——这个过程对应于哲学家安妮特·拜尔所描述的&quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“发生在一个发现声明上”整理为“是‘发生在’发现声明上的”，保留原文对“发生在”的特别强调，并省去不必逐字译出的“一个”。<\/li>\n<li>“所描述的”收成“所说的”，使引用名称的表达更自然；“思想的公地”保留，等待下一句解释共同推理、挑战和完善的含义。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>最终，可信度是&quot;发生在&quot;发现声明上的——这个过程对应于哲学家安妮特·拜尔所说的&quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>35题<\/h2>\n<p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>下面哪个标题最适合这篇文章？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Novelty as an Engine of Scientific Development<\/strong><\/p>\n<p>新颖性：科学发展的引擎<\/p>\n<p>B. <strong>Collective Scrutiny in Scientific Discovery<\/strong><\/p>\n<p>科学发现中的集体审查<\/p>\n<p>C. <strong>Evolution of Credibility in Doing Science<\/strong><\/p>\n<p>科学实践中可信度的形成<\/p>\n<p>D. <strong>Challenge to Credibility at the Gate to Science<\/strong><\/p>\n<p>科学门口对可信度的挑战<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中的科学发现应当客观整齐，再指出现实发现会受经历、知识和兴趣影响，路径复杂且容易出错<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>把刚出现的发现主张称为原始阶段，说明它必须经过集体审视和接受，才能变成成熟、客观的知识<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开共同体中的多方角色：研究者、编辑审稿人、其他科学家和公众共同参与，把个人主张变成共同体的可信发现<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>补出可信度形成中的两个悖论：新主张会不断受挑战，而真正新颖的想法又常先遭到怀疑<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>用“共同推理、质疑、修订和补全”收束，强调可信度是在共同思考中逐渐发生的<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<h3>A. Novelty as an Engine of Scientific Development<\/h3>\n<p>新颖性：科学发展的引擎<\/p>\n<h4>如果 A 是主旨，文章5段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>新颖性：科学发展的引擎<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先提出只要不断积累和确认已有知识，科学就会持续前进的理想图景，再指出这种积累无法自行突破旧解释的局限，引出新颖认识在推动科学发展中的作用<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>说明一个打破旧想法的新构想刚出现时还只是待发展、待检验的初步方案，尚需把它提供的新方向做成能推动科学前进的成果<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开提出者完善新构想、同行检验并发展新解释、其他研究者把新方法用于后续问题的共同工作，说明新颖性怎样经多人参与转化为科学发展的实际动力<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明新颖性推动科学发展时的两处矛盾：科学通过新认识突破既有解释，而新认识成熟后也会成为下一轮创新需要突破的对象；有突破价值的新想法又会因不同于熟悉的解释而先受到怀疑<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>收束到共同推进创新：研究者通过提出、检验、修正和运用新想法，一起把初步的新颖构想做成推动科学发展的成果，从而发挥新颖性的引擎作用<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>A把新颖性看成科学发展的推动力量。这个标题不等于“想法越新就一定越正确”，也没有声称“创新越多，发展就越快”。如果全文围绕它展开，作者完全可以写新想法需要检验、受到怀疑、经过合作才产生进展；判断时要看这些内容最终是在说明新颖性怎样推动科学发展，还是在回答另一件事。<\/p>\n<p>实际第1段从理想中的客观发现转到受经历和兴趣影响的现实发现，第2段随即用<code>Consequently<\/code>引出尚未成熟的发现主张，并明确说<code>Objective knowledge is the goal, not the starting point.<\/code>。这一推进追问的是初步主张如何变成客观知识，没有转向新想法怎样推动研究领域向前发展。<\/p>\n<p>第3段进一步把个人主张转成共同体的可信发现，第4段才在<code>this credibility process<\/code>之下讨论两个悖论。新颖性受到重视、又会引发怀疑，都是作者解释可信度形成为何曲折的内容。结尾仍落在可信度通过共同推理逐步形成，而没有把这些段落收束为新颖性带来的科学进展。A抓住了第四段的重要内容，却把服务于可信度过程的一项因素换成了全文中心。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<h3>B. Collective Scrutiny in Scientific Discovery<\/h3>\n<p>科学发现中的集体审查<\/p>\n<h4>如果 B 是主旨，文章5段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>科学发现中的集体审查<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中研究者独自依照科学方法检查事实就能排除判断偏差，再指出个人检查仍受经验和兴趣限制，提出科学发现需要多人共同审查<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>说明个人提交的发现及其自我检验还只是等待共同核查的初稿，证据和解释中尚未解决的问题需要进入集体审查后进一步查明<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开提出者回应疑问、编辑审稿人检查论证、同行复核和补充证据的分工，把科学发现的集体审查写成多方相互质询并完善核查结果的过程<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明集体审查中的两处矛盾：共同体需要依靠共同认可的知识作出审查判断，却又要审查会修正这些知识的新发现；审查者要识别新贡献，却容易因为贡献超出熟悉框架而先不相信它<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>总结提出者与其他研究者怎样一起检查、质疑和修订论证，共同补全对科学发现的审查，突出集体审查在判断发现是否成立中的作用<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>B提出的是科学发现中的集体审查，重点在多人怎样检查证据、质询论证和共同判断。这不是无关信息：第2段确实写了<code>collective scrutiny and acceptance<\/code>，第3段有编辑和审稿人，第5段也有共同质疑和修订。因此，不能把B说成全文只提到了一次的零碎细节。<\/p>\n<p>但实际第1段的问题是发现为什么起初会受个人条件限制；第2段接着明确区分原始阶段与成熟发现，并用“个人的我、这里、现在”变成“共同体的任何人、任何地方、任何时间”说明变化的方向。集体审查在这里解释主张怎样变化，作者要追踪的对象是逐步形成的可信度。<\/p>\n<p>第3段也没有只罗列核查步骤：发表之后，其他科学家使用新发现，公众接收它，不同信念之间发生互动和对抗，最后个人主张转为共同体的可信发现。第4段把已显得可信的发现仍可受挑战、真正新颖的发现迟迟不获相信并列为这一形成过程的悖论；结尾直接回到<code>credibility “happens”<\/code>。B抓住了贯穿过程的重要方法，却没有像C一样把起点、转化方向、过程中出现的矛盾和最终形成的结果都纳入标题的中心。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<h3>C. Evolution of Credibility in Doing Science<\/h3>\n<p>科学实践中可信度的形成<\/p>\n<h4>如果 C 是主旨，文章5段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>科学实践中可信度的形成<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中的科学发现仿佛从客观研究者观察事实开始就拥有可靠基础，再以个人经历、知识和兴趣对实际发现的影响拆解这一图景，提出可信度需要在科学实践中逐步形成<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>把个人刚提出的发现写成有潜力但尚未成熟的主张，说明它还要经过共同审视与接受才能获得共同体认可的可信度，客观知识是待达到的目标<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>依次展开主张公开后研究者、编辑审稿人、其他科学家和公众的参与，说明个人主张如何在不同认识的互动中逐步转为共同体的可信发现<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明可信度形成中的两处矛盾：科学不断追求新认识，已经显得可信的新发现仍会被后来的研究挑战和修改；真正新颖的主张又常因其新颖性先遭怀疑，需要时间获得认可<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>以共同推理、质疑、修订和补全收束全过程，说明大家一起完善发现主张和判断依据，可信度正是在这种共同科学实践中逐步形成的<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>C的完整意思是可信度在科学实践中逐步形成。<code>Evolution<\/code>在这个标题里指一个发展、转化的过程，不能读成个人一旦宣布发现，可信度就已完成，也不意味着获得可信度以后永远不会再被修改。<\/p>\n<p>第1段先说明现实中的发现受个人经历、知识和兴趣影响，误解、错误与自欺都有发生的空间，所以可信度不能作为未经处理的起点。第2段把发现主张称为<code>protoscience<\/code>，再写它通过集体审视与接受变成成熟发现，并直接把这段变化命名为<code>the credibility process<\/code>。<\/p>\n<p>第3段展开这一过程：主张公开后进入共同体，经过编辑审稿人、其他科学家和公众等参与者，个人主张在互动与对抗中转为共同体的可信发现。第4段继续用<code>this credibility process<\/code>承接，解释其中的两个悖论：追求新认识也意味着既有发现持续接受挑战；新颖性又常使新主张先遭怀疑。<\/p>\n<p>第5段以<code>In the end<\/code>回到可信度的形成，用共同推理、质疑、修订和补全概括大家怎样一起完成它。C既能解释开头为什么要拆解理想图景，也能统摄中间的社会过程和矛盾，最后与结尾落在同一个判断上。<\/p>\n<p>判断：<\/p>\n<p><strong>C 保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<h3>D. Challenge to Credibility at the Gate to Science<\/h3>\n<p>科学门口对可信度的挑战<\/p>\n<h4>如果 D 是主旨，文章5段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>科学门口对可信度的挑战<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中新发现只要展示客观事实就能顺利进入科学知识体系，再指出发现者的个人判断仍会留下可信性疑点，引出科学入口处对新主张可信度的质疑<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>说明申请进入科学知识体系的发现主张还只是未完成的论证，支持其可信度的证据和解释仍需补齐，才能回应入口处提出的质疑<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开发现者、审稿人和相关领域研究者围绕入门主张交换证据、提出质疑并修订解释的过程，说明一个回应可信度挑战的完整论证怎样经多人参与形成<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明科学入口处可信度挑战的两处矛盾：入门审查依赖已有知识提出疑问，新发现却要以修正已有知识证明自身贡献；质疑有助于发现可信性缺口，却也会使一些值得接纳的新颖主张较晚进入科学知识体系<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>收束到提出者与审查者共同澄清入口处的疑问、修正论证并补足证据，一起完成对新主张入门资格的判断，说明科学入口处的可信度挑战怎样得到处理<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D把中心放在新主张进入科学知识体系时，其可信度受到的挑战。<code>Challenge<\/code>可以是必要的质疑和检验，不一定是恶意阻挡；<code>at the Gate to Science<\/code>也不要求把所有审查者写成反对新发现的人。因此，不能因为文章肯定共同体合作，就直接断定D与作者态度相反。<\/p>\n<p>需要比对的是讨论范围。假如D是主旨，个人偏差、审查分工和新颖性引发的怀疑，都应围绕科学入口处的可信性疑问展开，结尾也应收束到这些入门挑战怎样被提出和处理。实际第2段讲的却是从个人主张到成熟发现的完整转化，入口处的质疑只是这段过程能够涉及的一部分。<\/p>\n<p>第3段的<code>gatekeepers<\/code>确实容易引人想到D，但编辑和审稿人只负责控制发表环节。作者随后继续写其他科学家如何使用发现、公众如何接收发现，以及不同信念怎样共同完成可信度转化，视线没有停在发表入口。第4段还明确说已显得可信的发现仍可能被未来研究者挑战、修改或反驳，说明挑战并不限于“进入科学之前”。第5段收束于共同推理使可信度形成，也没有把入门质疑确立为全文终点。D抓住了文中的把关与挑战，却用科学入口处的问题收窄了贯穿科学实践的可信度形成过程。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<hr>\n<h3>35题结论<\/h3>\n<p><strong>35. C. Evolution of Credibility in Doing Science<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Evolution of Credibility in Doing Science / 科学实践中可信度的形成<\/strong><\/p>\n<h2>31题<\/h2>\n<blockquote>\n<p>According to the first paragraph, the process of discovery is characterized by its ______.<br>根据第一段，发现的过程具有怎样的特点？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道段落概括题。<code>According to the first paragraph<\/code>限定第一段，<code>the process of discovery<\/code>要求概括发现过程的特点。需要区分段首先摆出的理想图景与<code>But<\/code>之后说明的日常实践，并把后面有关个人经历、知识兴趣和出错机会的句子一起纳入判断。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<p>第一句写理想化的科学工作，第二句用<code>But<\/code>转到现实中的发现路径，给出<code>ambiguous and complicated<\/code>。后三句解释这种路径为什么难以完全清晰、稳定：研究者受到个人背景、知识和兴趣影响，理解与行动中也存在误读、错误和自我欺骗的机会。题干问的是这些句子共同说明的过程特点，不能只抽出“客观研究者”或某一种失误来回答。<\/p>\n<h3>A. uncertainty and complexity<\/h3>\n<blockquote>\n<p>不确定性和复杂性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>ambiguous<\/code>和<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；先由<code>complicated route<\/code>看出复杂路径，再结合个人经历、知识兴趣以及误读和错误理解不确定性，第一轮保留A，其余三项排除后选择A。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>A用<code>uncertainty<\/code>概括<code>ambiguous<\/code>所体现的不明确与不确定，用<code>complexity<\/code>改写<code>complicated<\/code>。后文有关背景影响和出错机会的说明进一步支撑这两个概括，选项既没有把科学研究说成毫无规律，也没有把追求客观的目标当作发现过程已经达到的状态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有不确定性和复杂性。<\/p>\n<\/blockquote>\n<p>题干的<code>process of discovery<\/code>对应原文的<code>discovery ... follows ... route<\/code>，A的<code>complexity<\/code>对应<code>complicated<\/code>。这句话位于<code>But<\/code>之后，讨论的是<code>everyday practice of science<\/code>，因此先把它与段首的理想化版本分开。<\/p>\n<p>出处先用<code>ambiguous and complicated<\/code>描述发现路径，再说研究者无法摆脱自身经历，知识与兴趣会影响观察、理解和行动。最后一句补充误读、错误及自我欺骗的机会很多，使“路径不完全明确”有了具体内容。<\/p>\n<p>原文与A描述的主体都是发现过程。<code>complexity<\/code>保留复杂这一性质，<code>uncertainty<\/code>概括路径中的不明确以及认识可能受到干扰的状态，没有把研究者换成事实本身，也没有把科学方法说成完全无效。<\/p>\n<p><code>frequently<\/code>是“经常”，说明作者在概括日常实践中常见的情况；A把这两点作为过程特征，并未额外写成每一次发现、每一个环节都必然出错。后文的出错机会也只是帮助解释不确定性，不等于所有研究结论都是错误的。<\/p>\n<p>A把原文对现实路径的两个形容词改成两个名词，并保留后文的解释方向：发现过程受到多种因素影响，因而常常不确定且复杂。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在说明发现过程后，接着是这样写的：<\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>因此，发现主张还只是初步的科学，需要经过集体审视和接受，才能变成成熟发现。<\/p>\n<\/blockquote>\n<p>作者由最初认识可能受干扰，推到个人提出的主张不能马上获得成熟知识的地位。后文安排集体处理，是因为最初发现仍有需要澄清、检验和修正的地方。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Because the route to discovery is uncertain and complex, a discovery claim needs collective scrutiny before it becomes a mature discovery.<\/p>\n<p>由于发现路径不确定而复杂，发现主张在成为成熟发现之前需要集体审视。<\/p>\n<\/blockquote>\n<p>这段假设写法保留了文章已有的推进：第一段说明发现路径的现实限制，第二段用<code>Consequently<\/code>接出对初步主张的处理。A所概括的特点能够解释后文为什么继续讨论可信度怎样形成。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段是在交代科学发现为什么还需要形成可信度，不能单独确定作者用哪两个特点描述最初的发现过程。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>uncertainty and complexity<br>不确定性和复杂性<\/p>\n<\/blockquote>\n<p>主旨关注发现主张怎样变得可信，A说明初始过程存在不确定性和复杂性，两者能接成起点与后续转化的关系。选项没有把主旨改成研究者故意欺骗别人，也没有把客观性预先当作已经完成的结果。<\/p>\n<p>本项最终仍要根据“an ambiguous and complicated route”这处局部原文判断。它给出了A所概括的两个性质；主旨则帮助确认，这种有待检验的起点与全文后续讨论相容。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<h3>B. misconception and deceptiveness<\/h3>\n<blockquote>\n<p>误解和欺骗性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的<code>deceptiveness<\/code>和原文的<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；由<code>misinterpretation<\/code>看出误读是过程中可能出现的问题，比较后认为B把其中一类失误抬成整个过程的特点，第一轮排除B，并未靠认出被遮挡的词作判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用段尾的误读和自我欺骗，把“存在发生这些问题的机会”改成“发现过程以误解和欺骗性为特征”。尤其<code>self-deception<\/code>指研究者可能欺骗自己，<code>deceptiveness<\/code>却把能够误导、欺骗的性质交给发现过程；原文没有把这个过程描述成具有欺骗性的活动。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有误解和欺骗性。<\/p>\n<\/blockquote>\n<p>B的<code>misconception<\/code>让人想到段尾的<code>misinterpretation<\/code>，<code>deceptiveness<\/code>又与<code>self-deception<\/code>词形接近。但题干要填在<code>the process of discovery is characterized by<\/code>后面，必须比较这些词在原文里究竟修饰什么、承担什么作用。<\/p>\n<p>出处描述发现路径时使用<code>ambiguous and complicated<\/code>；写误读、错误和自我欺骗时，主语却是<code>Opportunities<\/code>，谓语是<code>abound<\/code>。后一句说明这类问题有很多发生机会，为前面的不确定与复杂提供解释。<\/p>\n<p><code>misinterpretation<\/code>与<code>misconception<\/code>都涉及理解出错，仅凭二者近义，确实容易把B留下；但完整选项还包含<code>deceptiveness<\/code>。原文的<code>self-deception<\/code>说研究者可能误导自己，B则把欺骗性作为发现过程的属性，省掉了<code>self-<\/code>限制，也改变了性质落在哪个对象上。<\/p>\n<p>这里不能把“可能受错误认识影响”读成“发现过程本身具有欺骗性”。一种认识活动会出现自我欺骗的机会，并不说明这一活动以欺骗为性质；文章也没有借段尾判断发现都出自误解。<\/p>\n<p>B把用于解释过程为何不确定的风险项目改成了过程本身的性质，并把自我欺骗的具体风险改写为欺骗性，未能保留原文对对象和范围的限制。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文从个人认识中的问题继续往下是这样写的：<\/p>\n<blockquote>\n<p>Similar to newly staked mining claims, they are full of potential.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>初步发现主张充满潜力，经过集体审视和接受，可以变成成熟发现。<\/p>\n<\/blockquote>\n<p>作者没有因研究者可能误读或欺骗自己，就把发现过程定性为具有欺骗性。后文保留主张的潜力，并着重说明怎样通过共同体的处理获得可信度。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The process of discovery is characterized by misconceptions and a deceptive appearance that misleads those involved.<\/p>\n<p>发现过程以误解和误导参与者的欺骗性外观为特征。<\/p>\n<\/blockquote>\n<p>这段假设写法需要把误解和欺骗性直接交给过程，才能支持B的完整命题。实际文章写的却是认识可能受到干扰、主张仍有潜力、共同体能够推进其成熟；它没有从风险的存在转到对发现过程的这种定性。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段是在交代发现主张尚需获得可信度，不能判断原文是否把误解和欺骗性认定为发现过程的总体特点。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>misconception and deceptiveness<br>误解和欺骗性<\/p>\n<\/blockquote>\n<p>可信度有待形成，可以与认识不成熟、有出错风险相容，却不会自动推出发现过程具有欺骗性。B把“还需集体处理”解释成一种欺骗性的总体状态，主旨本身没有提供这一步判断。<\/p>\n<p>本项最终仍要根据“Opportunities for misinterpretation, error, and self-deception abound”这处局部原文判断。它说风险机会很多，且保留自我欺骗这一具体限制，不能改成过程以误解和欺骗性为特征。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. logicality and objectivity<\/h3>\n<blockquote>\n<p>逻辑性和客观性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>We aim to be objective<\/code>，也读到紧随其后的<code>but we cannot escape the context<\/code>；由目标与现实限制的区别，判断C把追求的客观性当作过程已具备的特点，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用理想化图景中的客观研究者和研究者想做到客观的目标，却略去<code>But<\/code>引出的现实限制。<code>objectivity<\/code>把追求的方向写成过程已经具备的性质，<code>logicality<\/code>也没有获得第一段对现实过程的相应概括支持。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有逻辑性和客观性。<\/p>\n<\/blockquote>\n<p>C的<code>objectivity<\/code>对应段首的<code>objective researchers<\/code>和后面的<code>aim to be objective<\/code>。前一处受<code>In the idealized version<\/code>限定，后一处受<code>aim<\/code>限定，都不能脱离自己的语境单独用于概括现实过程。<\/p>\n<p>出处先写理想图景，再以<code>But<\/code>转到日常科学实践；随后又用一个<code>but<\/code>说明，研究者虽力求客观，却无法摆脱各自生活经历的背景。作者连续区分理想与现实、目标与限制。<\/p>\n<p>原文的主体是希望客观的研究者，动作是<code>aim to be<\/code>，后面同时保留尚未摆脱的影响。C把它改成发现过程具有<code>objectivity<\/code>，从“力求达到”跨到了“已经具有”，改变了客观性在句子中的地位。<\/p>\n<p><code>logicality<\/code>也不能仅凭段首出现<code>scientific method<\/code>就补出来。研究者采用科学方法，不等于本段已把现实路径概括为逻辑而客观；但同样不能反过来说作者否定一切逻辑，他实际强调的是个人背景使路径不完全明确、简单。<\/p>\n<p>C取用了原文正面词汇，却移除了理想化和目标这两层限定，把现实仍受影响的发现过程写成已经达到客观状态。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文随后明确说明客观知识的地位：<\/p>\n<blockquote>\n<p>Objective knowledge is the goal, not the starting point.<\/p>\n<p>客观知识是目标，而不是起点。<\/p>\n<\/blockquote>\n<p>这句话接在集体审视、接受以及个人走向共同体的说明之后。作者把客观知识放在过程需要达到的一端，进一步解释第一段为什么不把初始发现视为已经客观。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>In everyday scientific practice, discovery follows a logical and objective route.<\/p>\n<p>在日常科学实践中，发现沿着合乎逻辑而客观的路径展开。<\/p>\n<\/blockquote>\n<p>这段假设写法要让客观性成为现实路径已有的性质，才接得上C。实际文章却先说个人背景无法摆脱，再说客观知识是需要实现的目标；两种写法把客观性放在了不同位置。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段属于可信度形成的起点说明，不能仅由标题确定发现过程是否已经具有逻辑性和客观性。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>logicality and objectivity<br>逻辑性和客观性<\/p>\n<\/blockquote>\n<p>主旨追踪可信度怎样形成，不能拿来证明每一项最初发现已经达到客观。结合文章的实际推进，个人主张还需共同体处理，C却把有待达到的性质提前放进起点。<\/p>\n<p>本项最终仍要根据“We aim to be objective, but we cannot escape the context”这处局部原文判断。作者强调追求与现实限制并存，后文“Objective knowledge is the goal, not the starting point”又将这一位置区别说得更明确。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. systematicness and regularity<\/h3>\n<blockquote>\n<p>系统性和规律性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>complicated route<\/code>、个人背景的影响以及误读和错误，认为D所说的系统性和规律性没有概括现实发现路径，第一轮排除D；原文中被<code>[xxx]<\/code>遮挡的词没有被当作已读懂的信息。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D容易借段首的科学方法联想到系统而有规律的活动，却把理想图景移到<code>But<\/code>之后的现实发现路径上。原文在这里突出路径不明确、复杂以及认识受多种因素影响，D却把过程的概括重点改成系统性和规律性。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有系统性和规律性。<\/p>\n<\/blockquote>\n<p>题干限定第一段，讨论的是<code>process of discovery<\/code>；原文对该过程最直接的描写是<code>discovery frequently follows an ambiguous and complicated route<\/code>。D可能让人想到段首的<code>scientific method<\/code>，但那一句正在交代理想化版本。<\/p>\n<p>出处以<code>But<\/code>把理想图景与日常实践分开，再用个人背景和知识兴趣说明现实路径为什么会受到干扰。对观察什么、怎样理解以及随后怎样行动的影响，都属于作者具体展开的过程特征。<\/p>\n<p>需要比较的并不是“复杂”这个词能否与“系统”在任何情况下同时成立。复杂的系统也可能有规律；本题的关键是，作者没有沿着系统性或规律性解释现实发现，而是用不明确、复杂及多重影响来概括它。<\/p>\n<p>D若成立，需要第一段把有组织、按规律展开确定为这个过程的特点。仅凭研究者会使用科学方法，无法越过<code>idealized<\/code>与<code>But<\/code>的限定，得出作者对日常路径作了这样的概括。<\/p>\n<p>D把理想化叙述容易引出的有序印象移作现实过程的结论，改变了转折后作者实际强调的性质；不能用一种关于科学的通常印象替换本段给出的描述。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在转入现实之后是这样展开的：<\/p>\n<blockquote>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<p>知识和兴趣影响经历、理解与行动，误读、错误和自我欺骗的机会也很多。<\/p>\n<\/blockquote>\n<p>作者没有接着列出固定步骤或稳定规则，而是把现实过程中的影响来源和风险逐层补出来，用来说明前面的不明确与复杂。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>In everyday practice, discovery follows a systematic and regular route, with observations and conclusions connected through stable procedures.<\/p>\n<p>在日常实践中，发现沿着系统而有规律的路径展开，观察与结论由稳定程序连接起来。<\/p>\n<\/blockquote>\n<p>假设写法要以系统程序和稳定秩序解释发现路径，才能支撑D。实际写法却继续说明个人因素会影响观察和解释，两者关注的过程特征不同；有科学方法这一背景事实并不能替代文章实际展开的重点。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段在介绍可信度形成之前的发现过程，不能判断这个过程是否被作者概括为系统而有规律。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>systematicness and regularity<br>系统性和规律性<\/p>\n<\/blockquote>\n<p>主旨讨论的是科学实践，不能因此把日常观念中的“科学很系统”代入题干。文章后来说明共同体怎样处理主张，也不等于第一段已把个人发现路径写成规则稳定的过程。<\/p>\n<p>本项最终仍要根据“an ambiguous and complicated route”及随后个人背景影响的局部原文判断。作者实际用这些内容解释发现过程，D所概括的系统性和规律性没有保留这一段的展开重点。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>31题结论<\/h3>\n<blockquote>\n<p><strong>31. A. uncertainty and complexity<\/strong><\/p>\n<\/blockquote>\n<p>A概括现实发现路径的不确定性和复杂性，并能容纳后文对个人背景和出错风险的说明。<\/p>\n<p>B借误读和自我欺骗的风险，把它们改成整个发现过程具有误解和欺骗性。<\/p>\n<p>C借客观研究者与追求客观的目标，把理想和目标改成现实过程已经具备的性质。<\/p>\n<p>D借科学方法带来的有序印象，把理想图景移作现实路径的概括，没有保留转折后的展开重点。<\/p>\n<h2>32题<\/h2>\n<blockquote>\n<p>It can be inferred from Paragraph 2 that credibility process requires ______.<br>从第二段可以推断，可信度形成过程需要什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部推断题。<code>Paragraph 2<\/code>限定第二段，<code>credibility process requires<\/code>问发现主张获得可信度所需要的条件。先看<code>it takes<\/code>明确列出的条件，再看个人研究者与共同体的对比；推断应概括这些明示信息，不能另外补进文章没有建立的条件。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>Similar to newly staked mining claims, they are full of potential.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<p>Objective knowledge is the goal, not the starting point.<\/p>\n<\/blockquote>\n<p>发现主张起初有潜力，却还不是成熟发现。第三句明说转化需要<code>collective scrutiny and acceptance<\/code>，第四句接着说明，个人研究者的“我、这里、现在”要转向共同体的“任何人、任何地方、任何时候”。因此，作出推断时，应抓住这两句共同强调的集体参与：审视和接受使主张不再停留于研究者个人。<\/p>\n<h3>A. strict inspection<\/h3>\n<blockquote>\n<p>严格检查<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>strict<\/code>被<code>[xxx]<\/code>遮挡，能读懂的<code>inspection<\/code>与原文<code>scrutiny<\/code>接近，因此第一轮保留A，同时保留B；35题主旨确定后，回查发现A偏向检查环节及其强度，B更能概括从个人走向共同体的形成过程，最终排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用<code>scrutiny<\/code>这一真实动作，却把原文所强调的<code>collective<\/code>集体参与改成<code>strict<\/code>严格程度。原文并不反对认真检查，问题在于它用集体审视、接受以及个人走向共同体解释可信度形成，不能把参与范围的限定直接改写成检查强度的要求。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要严格检查。<\/p>\n<\/blockquote>\n<p>题干的<code>requires<\/code>对应原文的<code>it takes<\/code>，A的<code>inspection<\/code>对应<code>scrutiny<\/code>。这处词义联系是真实的，所以要进一步看检查前面的限定，以及后一句怎样解释<code>credibility process<\/code>。<\/p>\n<p>出处把<code>collective scrutiny and acceptance<\/code>作为发现主张转为成熟发现的条件，下一句把这一转化写成个人的主张走向共同体。两句共同强调主张由集体审视、接受，并获得超出个人的效力；它们没有具体讨论检查标准的严格程度。<\/p>\n<p><code>collective<\/code>说明由谁参与，<code>strict<\/code>说明检查要求有多严；两者不是同一个限定。原文的<code>scrutiny<\/code>确有仔细审查的意味，但不能因此把<code>collective<\/code>所落实的多人参与也理解成严格程度。比较A、B时，B的共同努力能够直接对应这一限定及后一句的<code>community<\/code>。<\/p>\n<p>不能仅因A只写了一个环节，就断言任何只概括一个条件的选项都不成立；也不能说<code>scrutiny<\/code>完全不含仔细审查的意味。本项真正的问题是，用<code>strict inspection<\/code>回答本段推断时，改变了两句反复突出的参与范围，原文没有把“严格程度”确立为这里要推出的关键条件。<\/p>\n<p>A保留了检查动作，却把共同体参与这一条件转成检查强度；它不足以概括原文所说明的个人主张怎样成为共同体认可的发现。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文下一段把共同体参与具体展开为：<\/p>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>主张公开后，共同体接管后续过程；研究者、编辑和审稿人、其他科学家以及公众在不同环节参与其中。<\/p>\n<\/blockquote>\n<p>作者接着回答的是“哪些人怎样处理这个主张”，把第二段的<code>collective<\/code>展开成多个参与者。这为B的共同努力补上了具体内容，而没有进一步说明A所提出的检查强度要求。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The credibility process requires a discovery claim to undergo strict inspection.<\/p>\n<p>可信度形成过程要求发现主张接受严格检查。<\/p>\n<\/blockquote>\n<p>这个假设只需把严格检查明确写成所需条件，不必出现严格与宽松的对比，也不必否定共同体参与。实际文章把集体参与明确写入条件，又通过参与者的分工继续展开。因此，在两项之间，B保留了原文直接说明的关系；A则需要把仔细审视进一步概括为作者并未具体说明的严格程度要求。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认本题要找使初步发现逐渐获得可信度的条件，不能单靠标题判断这个条件是检查强度，还是多人共同参与。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>strict inspection<br>严格检查<\/p>\n<\/blockquote>\n<p>把全文实际展开补回主旨，可以看到文章反复说明个人主张怎样经由共同体处理而形成可信度。A只把回答落在检查严格程度上，没有概括这一转化中反复出现的参与关系；与主题有关，不等于就是本段要推出的条件。<\/p>\n<p>本项最终仍要根据“collective scrutiny and acceptance”和个人转向“the community”这处局部原文判断。前者给出集体动作，后者再次限定参与范围，两句共同支持B所说的多人参与。这里排除A，不是在断言科学不需要严格检查，而是它未像B一样准确抓住本段明示的条件。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. shared efforts<\/h3>\n<blockquote>\n<p>共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>collective scrutiny and acceptance<\/code>及个人研究者走向<code>community<\/code>，第一轮保留B，但A的检查动作也接近局部原文，因此先留下A、B两项；35题主旨确定后，回查两项对形成过程的概括，最终选择B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B把<code>collective scrutiny and acceptance<\/code>中的集体行动概括成<code>shared efforts<\/code>，又用后一句个人走向共同体的变化确认参与范围。它不把共同努力说成意见从一开始就完全一致，而是说明可信度需要多人共同处理主张才能形成。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要共同努力。<\/p>\n<\/blockquote>\n<p>题干的<code>requires<\/code>对应<code>it takes<\/code>，B的<code>shared<\/code>对应<code>collective<\/code>；后一句又用<code>individual researcher<\/code>与<code>community<\/code>的对比说明这个“共同”涉及怎样的参与范围。<\/p>\n<p>第一处原文提供具体行动：对发现主张进行集体审视和接受，使它转成成熟发现。第二处提供转化方向：个人当下、当地的认识要变成共同体可以接受的发现，两句共同说明这件事不能只停在个人提出主张。<\/p>\n<p>B中的<code>efforts<\/code>概括原文列出的处理活动，<code>shared<\/code>保留集体参与这一共同属性。它没有将参与者限制为发现者，也没有把审视缩成某一种单独的检查标准。<\/p>\n<p>这里的共同努力并不要求所有人从开始就赞同同一主张。审视本来可以包含质疑，接受也要经过过程；选项只说转化需要多人参与，没有额外推出意见永远一致或个人完全不发挥作用。<\/p>\n<p>B把两句中的集体行动和个人走向共同体概括成共同努力，既保留了所需动作的共同性质，也保留了完成转化的参与范围。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在结尾回收这一过程时是这样写的：<\/p>\n<blockquote>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>我们共同推理，相互质疑、修正并补全彼此的推理及对理性的认识。<\/p>\n<\/blockquote>\n<p>文章由第二段的集体审视和接受，经过第三段的不同参与者，最终写到相互推理、质疑与修正。结尾具体说明共同努力可以包含分歧和修订，而不是把主张交给某个人独自定论。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim gains credibility through the shared work of people who scrutinize it, challenge it, and help develop it into knowledge accepted by the community.<\/p>\n<p>发现主张通过人们共同审视、质疑和推进，发展成共同体接受的知识，从而获得可信度。<\/p>\n<\/blockquote>\n<p>这段假设写法要求多人共同参与转化，文章已有的推进正好满足它：第二段明确写集体条件，后文展开参与者与相互推理。B没有额外添加一种文章之外的形成方式。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认本题要找推动发现主张逐渐获得可信度的条件，具体由谁参与、通过什么行动完成，还需要第二段及全文展开来确定。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>shared efforts<br>共同努力<\/p>\n<\/blockquote>\n<p>文章把可信度形成展开成个人主张交由共同体审视、处理和接受的过程，B正好保留其中的共同参与。它既能包容检查，也能包容质疑、修正与接受，不把形成过程压成检查强度这一个维度。<\/p>\n<p>本项最终仍要根据“collective scrutiny and acceptance”以及个人转向“the community”这处局部原文判断。前句给出共同动作，后句补出参与范围；两句先支撑B，全文的形成过程再与这个概括互相印证。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. individual wisdom<\/h3>\n<blockquote>\n<p>个人智慧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>individual researcher<\/code>看作主张的起点，而把<code>collective scrutiny and acceptance<\/code>看作转化条件；C把条件落回个人智慧，与这一区别不符，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用原文中的个人研究者，却把提出主张的个人身份改成可信度形成所依靠的条件。原文没有否定个人智慧的价值，但这段明确说明主张要通过集体审视和接受，不能用起点的个人取代完成转化的共同体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要个人智慧。<\/p>\n<\/blockquote>\n<p>C的<code>individual<\/code>在原文中确实出现，但它修饰<code>researcher<\/code>，处在<code>becomes<\/code>所连接的起点一侧。题干的<code>requires<\/code>则应对应前一句<code>it takes<\/code>后面的集体审视和接受，两处不能因都涉及研究者就相互替换。<\/p>\n<p>出处先说明什么能使发现主张转成成熟发现，再把转化方向写成从个人走向共同体。个人提供的是待处理的主张，集体审视与接受才是这一段明说的形成条件。<\/p>\n<p>C把条件写成<code>individual wisdom<\/code>，把参与范围收回个人，并增加“智慧”这一解释。第二段并未评价发现者是否聪明，也没有说个人能力达到某个程度就能完成可信度转化。<\/p>\n<p>这不意味着个人智慧对科学发现没有作用。题目限定的是本段所说明的可信度形成过程，不能把发现主张可能需要个人思考这一常识，替代文章明确给出的共同体处理关系。<\/p>\n<p>C把转化起点中的个人身份改成了完成转化的关键条件，丢掉了<code>collective<\/code>以及个人走向共同体这两处共同确定的参与范围。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在主张公开以后接着写道：<\/p>\n<blockquote>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit.<\/p>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>发现者获得智力贡献的荣誉，但主张接下来如何发展，由共同体接管。<\/p>\n<\/blockquote>\n<p>作者保留发现者的贡献，却用<code>But<\/code>把贡献归属与后续处理分开。个人获得荣誉，并不表示可信度接下来仍由其个人智慧独自建立。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>After making a discovery claim, the individual researcher relies on personal wisdom to turn it into a credible discovery.<\/p>\n<p>提出发现主张后，个人研究者依靠自身智慧，把它转化为可信发现。<\/p>\n<\/blockquote>\n<p>假设写法要让个人智慧承担转化，才能支持C；实际文章却把后续控制交给共同体，并继续列出其他参与者。发现者的贡献被承认，但文章没有因此把共同体的作用收回个人。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认题目问的是推动可信度形成的条件，不能单独判断这一条件属于个人能力还是共同体的参与。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>individual wisdom<br>个人智慧<\/p>\n<\/blockquote>\n<p>把文章的展开补回主旨，可信度形成不是停在个人提出主张，而是继续经过共同体的处理。C把回答放在个人智慧上，没有保留这个形成过程中的参与范围变化。<\/p>\n<p>本项最终仍要根据“collective scrutiny and acceptance”这处局部原文判断。它明说条件来自集体行动，后一句又从个人写到共同体；不能因为主旨涉及科学，就用关于个人智慧的常识代替这些原句。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. persistent innovation<\/h3>\n<blockquote>\n<p>持续创新<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>transform a discovery claim<\/code>，理解为处理已经提出的主张；D说不断创新，没有接上集体审视和接受这一转化条件，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D容易借科学发现与新主张的语境，补出“要获得可信度就必须持续创新”的要求。第二段处理的是已有主张怎样变成成熟发现，没有把不断产生新东西、持续维持创新写成这项转化的条件。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要持续创新。<\/p>\n<\/blockquote>\n<p>题干限定第二段，原文的<code>discovery claims<\/code>提供科学发现这一背景，<code>transform a discovery claim<\/code>说明所讨论的任务。D的<code>innovation<\/code>虽与发现新东西有关，却不能直接对应<code>transform<\/code>在这里的具体对象和结果。<\/p>\n<p>出处把一个已经存在的发现主张视为初步科学，再说明它需要集体审视与接受才能变成成熟发现。发生变化的是这项主张的成熟程度与共同体认可状态，不是要求研究者接连另提新主张。<\/p>\n<p>D的<code>persistent<\/code>额外增加持续性，<code>innovation<\/code>则把活动改成不断创新。原文没有建立“若不持续创新，某一已有主张便不能获得可信度”的必要关系，也没有给创新频率设定条件。<\/p>\n<p>后来第四段确实谈新颖发现及挑战，但那是在说明可信度过程中的悖论，不能倒填成第二段未曾提出的持续创新要求。新主张值得探索，与一个主张必须靠持续创新才变可信，是两个不同命题。<\/p>\n<p>D借科学发现的背景补出了持续创新这一条件，改变了原文处理已有主张的任务，并增加了没有依据的时间与必要性要求。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文对初步主张接下来的变化是这样写的：<\/p>\n<blockquote>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<p>Objective knowledge is the goal, not the starting point.<\/p>\n<p>可信度过程使个人当下、当地的主张走向共同体可以接受的认识，客观知识是要达到的目标。<\/p>\n<\/blockquote>\n<p>作者沿着同一个主张的地位变化往下写：它从个人认识走向共同体知识。接下来的共同体分工解释这种变化怎样发生，而不是要求发现者一边求认可、一边持续产出新发现。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim cannot gain credibility unless researchers continue to innovate throughout the process.<\/p>\n<p>研究者必须在整个过程中持续创新，发现主张才能获得可信度。<\/p>\n<\/blockquote>\n<p>假设写法必须把持续创新设为获得可信度的前提，才能支持D。实际写法给出的前提却是集体审视和接受，并用个人走向共同体解释结果；它没有加入这项额外要求。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认本题要找让已有发现主张逐渐获得可信度的条件，不能判断这个过程是否要求研究者持续创新。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>persistent innovation<br>持续创新<\/p>\n<\/blockquote>\n<p>主旨中的<code>Evolution<\/code>说可信度逐渐形成，不能被改读成新发现不断增加。D把需要解释的变化从“同一主张怎样变可信”移成“研究者怎样持续创新”，又把后者加为前者的条件。<\/p>\n<p>本项最终仍要根据“it takes collective scrutiny and acceptance to transform a discovery claim”这处局部原文判断。它列出的条件是共同体对主张的处理，没有提出持续创新的要求。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>32题结论<\/h3>\n<blockquote>\n<p><strong>32. B. shared efforts<\/strong><\/p>\n<\/blockquote>\n<p>A借用了检查动作，却把集体参与改为严格程度，没有概括本段所强调的形成条件。<\/p>\n<p>B概括集体审视、接受以及个人走向共同体这两句共同说明的多人参与。<\/p>\n<p>C借个人研究者这一转化起点，把完成转化的共同体条件改成个人智慧。<\/p>\n<p>D借科学发现的语境，额外添加持续创新是获得可信度所需条件的命题。<\/p>\n<h2>33题<\/h2>\n<blockquote>\n<p>Paragraph 3 shows that a discovery claim becomes credible after it ______.<br>第3段表明，一项发现主张在经历什么之后会变得可信？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题。题干用<code>Paragraph 3<\/code>限定第3段，询问<code>a discovery claim becomes credible<\/code>之前经历了什么。重点是从个人提出主张到共同体认可发现的转化过程，不能把公开、发表、被使用等某一个环节直接当成可信度形成的全部条件。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<p>第一句把公开之后的后续过程交给共同体；第二句列出研究者、编辑和审稿人、其他科学家以及公众在这个过程中的不同作用；第三句给出题干所问的结果：共同与相互竞争的看法经过互动、交锋，使个人主张转成共同体的可信发现。<\/p>\n<p>题干的<code>becomes credible<\/code>对应末句的<code>transforms ... into ... credible discovery<\/code>。因此，要回答的是共同体怎样检验和处理主张，而不是只找一个在时间上出现过的动作。<\/p>\n<h3>A. has attracted the attention of the general public<\/h3>\n<blockquote>\n<p>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，第3段中的<code>accompanying<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮已读出公众接收新发现，以及主张在共同体互动中发生转化；将这两层与A的“吸引公众注意后变可信”比较，发现原文没有把公众注意写成转化条件，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了公众接收新发现这一真实环节，把公众接触信息改成发现吸引注意，并把这一动作放到主张变可信的条件位置。原文在列举参与者后另用一句交代转化力量：共同体内部不同看法的互动与交锋。公众接触发现与共同体检验主张不是同一层信息。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在吸引普通公众注意之后会变得可信。<\/p>\n<\/blockquote>\n<p>用题干的<code>Paragraph 3<\/code>找到第3段，A的<code>general public<\/code>对应长句后部的<code>the public<\/code>；题干的<code>becomes credible<\/code>则对应下一句的<code>transforms ... into ... credible discovery<\/code>。这两个定位点必须放在一起，才能看清公众接收与主张变可信之间有没有A所说的关系。<\/p>\n<p>前一句按参与者分工写过程：编辑和审稿人控制发表，其他科学家使用发现，公众接收发现及可能伴随的技术。它说明发现经过哪些人、怎样进入更广泛的传播和使用过程，没有说受到注意便取得可信地位。<\/p>\n<p>下一句才明确说明转化：主张在共同体中推进，共同与相互竞争的看法发生互动、交锋，由此成为可信发现。句子的转化力量是这些看法之间的检验过程，不能换成公众关注程度。<\/p>\n<p>A的<code>attracted the attention<\/code>也不等于原文的<code>receives<\/code>。接收信息只说明接触到了它，吸引注意则说它引起关注；更关键的是，A把关注放在题干要求的可信度形成条件上，而原文没有建立这条关系。<\/p>\n<p>A借公众这一相同参与者，把“传播过程中接收发现”改成“吸引公众注意后变得可信”，丢掉了不同看法在共同体中接受检验这一决定性环节。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文列出公众之后，继续这样写：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>主张在共同体中流转时，不同看法的互动与交锋把个人发现主张变成共同体的可信发现。<\/p>\n<\/blockquote>\n<p>作者没有在“公众收到发现”处结束解释，而是再推进一层，专门交代转化怎样发生。公众属于过程中的参与者，末句的职责是说明这些社会活动中真正使主张获得可信度的检验关系。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim gains credibility when it attracts the attention of the general public.<\/p>\n<p>一项发现主张在吸引普通公众注意时获得可信度。<\/p>\n<\/blockquote>\n<p>假设写法只需把公众注意与取得可信度直接连起来，就能支撑A。实际文章连接的是共同体中不同看法的互动、交锋与可信度转化，既没有以公众注意收束段落，也没有把关注程度当成可信程度。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>第3段应当说明发现主张经历怎样的科学共同体活动而取得可信度；需要寻找实际承担检验、转化作用的过程，而不是只看发现是否受到公众关注。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>has attracted the attention of the general public<br>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p>主旨关心的是科学主张怎样变得可信，A关心的却是它怎样进入公众注意之中。两者可能同时出现，但受到注意本身并未说明主张经过怎样的质疑、比较和检验，不能直接填上题干要求的转化过程。<\/p>\n<p>具体条件仍由第3段末句确定：<code>interaction and confrontation<\/code>推动个人主张变成共同体的可信发现。A把前面的传播参与者移到了形成条件的位置，没有保持这层关系。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. has been examined by the scientific community<\/h3>\n<blockquote>\n<p>经过科学共同体的检验。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，第3段的<code>gatekeepers<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮根据发表过程受到控制、其他科学家使用发现、主张在共同体中推进并经互动转化这些已读信息，将B的共同体检验与整个过程接起来，保留B；其余三项排除后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>examined by the scientific community<\/code>概括本段展开的多方检验。前面列出的分工说明主张不再只由发现者自己处理，末句的不同看法互动与交锋则说明它如何接受共同体审视并取得可信地位。B保留共同体这一主体和检验后转化这一顺序，没有把一次发表或某个人的认可当成全部过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在经过科学共同体检验之后会变得可信。<\/p>\n<\/blockquote>\n<p>题干的<code>becomes credible<\/code>定位本段末句，B的<code>scientific community<\/code>对应前面的共同体分工和末句的<code>through the community<\/code>。<code>examined<\/code>没有逐字出现在这几句中，需要看共同体实际对发现主张做了什么。<\/p>\n<p>本段先说共同体接管后续过程，再分别写发表把关、其他科学家使用以及公众接收。这些分工把主张置于发现者之外的使用和评价之中，说明它不再只是个人自己的声明。<\/p>\n<p>末句补出最关键的一步：关于科学与技术的共同看法和竞争看法相互作用、相互交锋，进而把个人主张转成可信发现。这里的<code>confrontation<\/code>使我们看清，主张经过的并非单纯转发，而是不同认识之间的审视和检验。<\/p>\n<p>B的被动结构让主张成为被检验的对象，检验者是科学共同体；原文的主张同样在共同体内部受到不同看法的检验。原文最后报告它成为可信发现，B接入<code>after it<\/code>也把检验放在可信度取得之前，主体、动作和先后关系一致。<\/p>\n<p>B将前面的共同体分工与后面的观点交锋合成“经过科学共同体检验”，准确概括了段落写出的可信度形成过程；它没有额外要求每位公众成员都亲自做实验，也没有承诺可信发现从此不能再被修改。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第3段的收束与第5段的总结是这样接起来的：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>第3段用不同看法的互动与交锋说明可信度转化，结尾又把共同推理、质疑、修正和补充作为这一过程的总结。<\/p>\n<\/blockquote>\n<p>作者后文继续强调共同体成员怎样相互审视和修正，给第3段的社会过程补上更具体的认识活动。因此，B中的检验并非只指发表前的一次手续，而能概括全文反复说明的共同审视。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim becomes credible through examination by the scientific community, whose members test and revise one another’s reasoning.<\/p>\n<p>一项发现主张经过科学共同体的检验而变得可信，共同体成员相互审视并修正彼此的推理。<\/p>\n<\/blockquote>\n<p>这一假设所需的推进已经在原文中出现：第3段写主张进入共同体并经观点交锋发生转化，结尾写共同推理、质疑和修正。两处都让可信度来自共同体的处理过程，与B的概括相接。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>一项发现主张应当经过科学实践中的共同审视和检验，才能从个人提出的说法转成共同体承认的可信发现；第3段具体交代了这一转化如何发生。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>has been examined by the scientific community<br>经过科学共同体的检验。<\/p>\n<\/blockquote>\n<p>B的对象是发现主张，处理者是科学共同体，动作是检验，正好回答可信度形成过程中“经历了什么”。它保留从个人主张走向共同体认可的范围，没有把问题换成发现者获得荣誉或发现引起关注。<\/p>\n<p>主旨确定要寻找形成过程，第3段的<code>interaction and confrontation<\/code>则给出检验如何发生的具体依据；B既能承接全文问题，也能概括本段的转化机制。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. has received recognition from editors and reviewers<\/h3>\n<blockquote>\n<p>获得了编辑和审稿人的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C中的<code>recognition<\/code>显示为<code>[xxx]<\/code>，原文的<code>gatekeepers<\/code>也有遮挡。第一轮仍已读出编辑和审稿人控制发表过程，后面还有其他科学家的使用和共同体互动；因此没有把“从编辑和审稿人那里获得某物”当成全部可信度形成过程，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>C抓住了编辑与审稿人把关发表这一实际环节，编辑审稿认可可以对应这一入口，但题干询问的是发现主张怎样获得共同体的可信地位。原文在发表把关之后仍继续写其他科学家的使用、公众接收及不同看法的互动。C把其中一组参与者在发表环节的认可，拿来回答涵盖共同体后续检验的转化过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在获得编辑和审稿人的认可之后会变得可信。<\/p>\n<\/blockquote>\n<p>C的<code>editors and reviewers<\/code>对应本段长句中控制发表过程的人，<code>recognition<\/code>要放在他们的<code>gatekeepers<\/code>角色中理解；题干的<code>becomes credible<\/code>却落在后一句的共同体转化结果上。两处对应的是不同范围的处理。<\/p>\n<p>长句给编辑和审稿人的任务是<code>controlling the publication process<\/code>，即把住发表入口。之后分号仍接着其他科学家怎样使用发现、公众怎样接收发现，说明发表把关不是本段过程的终点。<\/p>\n<p>末句再把这些社会活动提升到认识层面：不同科学与技术看法相互作用、交锋，个人主张由此成为共同体的可信发现。题目要找的是主张经过这一审视过程，而不是只找它获得了哪两类人的认可。<\/p>\n<p>C中的编辑和审稿人确实属于科学共同体，他们的工作也有检验作用；问题不在于认可毫无用处，而在于这一环节的范围不足以概括本段所写的可信度转化。接受发表与共同体形成可信发现不是同一个结果。<\/p>\n<p>C拿发表入口中的认可回答整个转化条件，省去了原文随后专门展开的其他科学家使用与不同看法交锋，因此没有完整接上<code>becomes credible<\/code>所要求的关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在编辑与审稿人之后继续写道：<\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>发表把关之后，主张仍会被其他科学家使用、被公众接收，并在共同体不同看法的交锋中成为可信发现。<\/p>\n<\/blockquote>\n<p>作者不断把参与范围向编辑审稿之外展开，直到段末才交代可信度转化。这样的顺序让发表成为共同体过程中的一环，而非决定可信地位的最终认可。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Recognition from editors and reviewers establishes the credibility of a discovery claim.<\/p>\n<p>编辑和审稿人的认可确立了一项发现主张的可信度。<\/p>\n<\/blockquote>\n<p>这段假设只把确立可信度的作用放到编辑审稿认可上，不需要否认后面还会有人使用发现。实际文章却将这个作用明确交给主张在共同体流转时不同看法的互动与交锋；两种写法的区别，是究竟哪个环节完成题干所问的转化。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>第3段需要说明科学主张获得可信度的形成过程；全文主旨本身不能判定编辑审稿认可的具体地位，仍须区分本段的发表入口与共同体后续检验。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>has received recognition from editors and reviewers<br>获得了编辑和审稿人的认可。<\/p>\n<\/blockquote>\n<p>C所说的认可与可信度主题有关，却只落在一组参与者和一个发表环节上。相关不等于足以回答全过程：题干需要的是主张怎样成为共同体的可信发现，不能仅凭“有人认可”就把不同阶段合并。<\/p>\n<p>本项最终仍要根据“controlling the publication process”和“interaction and confrontation”这两处局部原文判断。前者限定编辑审稿人的职责，后者解释可信度转化；C用前者范围内的认可替代了后者。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. has been frequently quoted by peer scientists<\/h3>\n<blockquote>\n<p>被同行科学家频繁引用。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把<code>frequently quoted<\/code>与原文其他科学家<code>use the new finding<\/code>比较，发现使用新发现没有交代引用动作和引用频率；再看共同体互动完成转化，排除把频繁引用当作可信度条件的D，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了其他科学家会使用新发现这一事实，补出同行频繁引用的具体方式和数量特征，又让它承担主张变可信的条件。原文没有统计引用，也没有建立引用频率与可信程度的关系；科学家使用一个结果还可能为了检验或质疑它，不能把使用自动读成反复引用并认可。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在被同行科学家频繁引用之后会变得可信。<\/p>\n<\/blockquote>\n<p>D的<code>peer scientists<\/code>对应本段的<code>other scientists<\/code>，其动作要与<code>use the new finding to suit their own purposes<\/code>比较；<code>becomes credible<\/code>继续定位到段末的转化句。人物相近，还不能保证他们做了D所说的事。<\/p>\n<p>原文只写其他科学家使用新发现，以服务各自的目的。<code>use<\/code>可以涵盖多种使用方式，句子没有把它缩小为<code>quoted<\/code>，更没有用次数或频率说明这些科学家反复引用。<\/p>\n<p>接下来的转化句强调不同看法之间的互动与交锋。共同体成员可以赞同，也可以竞争或质疑；这里讨论的是认识如何受到审视，不是用被提及的次数衡量它是否可靠。<\/p>\n<p>D至少加入两个原文没有给出的限制：一是具体动作必须为引用，二是引用必须频繁。将D接回题干后，它还需要频繁引用与获得可信度相连，原文同样没有建立这一关系。<\/p>\n<p>D从“他人使用发现”补成“同行频繁引用后可信”，既没有保留原句的动作范围，也没有找到引用频率承担转化作用的依据。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文描述使用之后，接着写道：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>发现主张在共同体中的推进伴随不同看法的互动与交锋，这个过程把个人主张变成可信发现。<\/p>\n<\/blockquote>\n<p>作者沿着“主张怎样被不同认识检验”往下写，没有沿着“主张被提到了多少次”展开。末句解释的是形成可信度的作用关系，而非传播数量。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Frequent quotation by fellow scientists helps establish a discovery claim as credible.<\/p>\n<p>同行科学家的频繁引用有助于确立一项发现主张的可信地位。<\/p>\n<\/blockquote>\n<p>假设写法不需要宣称引用多就绝无错误，只需明确让频繁引用参与确立可信度，才有D的依据。实际原文没有写引用或频率，更未赋予它这种作用；它交代的是不同看法之间的相互审视。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第3段在解释科学主张怎样获得可信度，不能判断同行是否频繁引用该主张，也不能单凭主题推出引用次数具有确立可信度的作用。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>has been frequently quoted by peer scientists<br>被同行科学家频繁引用。<\/p>\n<\/blockquote>\n<p>D让同行这一真实参与者和引用次数连在一起，表面上仍在谈科学活动，实质却新增了主旨没有提供的衡量方式。可信度形成需要看共同体怎样处理主张，不能用“同行提到它很多次”替代这一步说明。<\/p>\n<p>本项最终仍要根据“use the new finding to suit their own purposes”和“interaction and confrontation”这两处局部原文判断。前者没有提供引用频率，后者交代的是真实转化过程，D未得到支持。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>33题结论<\/h3>\n<blockquote>\n<p><strong>33. B. has been examined by the scientific community<\/strong><\/p>\n<\/blockquote>\n<p>A借公众接收发现的环节，把吸引公众注意改成主张变可信的条件。<\/p>\n<p>B概括共同体分工与不同看法的互动交锋，准确回答主张经历了什么检验。<\/p>\n<p>C用编辑和审稿人在发表环节的认可，回答了范围更广的共同体可信度转化。<\/p>\n<p>D由其他科学家使用发现，补出频繁引用及其确立可信度的作用。<\/p>\n<h2>34题<\/h2>\n<blockquote>\n<p>Albert Szent-Györgyi would most likely agree that ______.<br>阿尔伯特·圣捷尔吉最可能同意以下哪种说法？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>局部推断题。题干以<code>Albert Szent-Györgyi<\/code>锁定第4段的引语，要求判断他最可能赞同什么。先列出名言明确说的思考方式，再结合本段重新审视已有知识的语境作最小推断；不能把作者提到的任何科学现象都当成这位人物的意见，也不能替引语增加关于未来影响或研究价值的判断。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.<\/p>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<\/blockquote>\n<p>前两句说明科学工作会重新审视已有认识，已被认为可信的发现也仍接受质疑、修改或反驳；名言则直接说明，在人人看见的事物面前，发现者要能提出别人没有想到的认识。后一句补充，新想法未必能改变他人的观点，没有保证它的影响结果。<\/p>\n<p>据此可作的最小推断是：科学工作需要独立审视、质疑既有解释的思维。<code>critical mind<\/code>在这里指这种批判性思维，不是凡事否定，也不是保证自己的新想法必定正确。<\/p>\n<h3>A. scientific claims will survive challenges<\/h3>\n<blockquote>\n<p>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，原文的<code>refutation<\/code>显示为<code>[xxx]<\/code>。第一轮已读到主张<code>open to challenge<\/code>并有<code>potential modification<\/code>，将接受挑战、可能修改与A的经受住挑战比较，认为前者没有给出后者的成功结果，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文真实出现的挑战，把科学主张持续接受质疑的状态改成它们能在挑战后保留下来的结果。原文不仅没有保证成功经受挑战，还明确保留修改或反驳的可能；科学主张需要被审视，与审视后依旧成立是两回事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p>题干的人名定位第4段引语，A的<code>challenges<\/code>对应引语前面的<code>open to challenge<\/code>。需要核对的是接受挑战这一过程，能否推出挑战结束后主张仍然成立的结果。<\/p>\n<p>原文说，看起来重要且有说服力的新发现主张和可信发现仍向挑战开放，也可能被未来研究者修改或反驳。句中的<code>always<\/code>限制的是保持开放这一状态，并不保证被挑战的主张都会保留下来。<\/p>\n<p>A的<code>survive<\/code>要求主张经受挑战后依然成立，写出了一个肯定的后续结果；原文的<code>potential modification or refutation<\/code>却把修改、反驳作为仍然存在的可能。二者的差别落在结果，不能因为都出现挑战就合并。<\/p>\n<p>人物的名言鼓励面对同样的观察提出不同认识，也没有说既有主张终会证明自己正确。新的审视可能支持原来的说法，也可能使它改变；引语并未替这些不同结果作出统一保证。<\/p>\n<p>A将“科学主张持续接受检验”改为“科学主张会成功经受检验”，超出了原文保留的开放结果。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在谈主张的后续命运时写道：<\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>即使目前看起来重要且可信，主张仍可能受到未来研究者的挑战、修改或反驳。<\/p>\n<\/blockquote>\n<p>这一写法使可信度保持可修正的性质。作者随后引入不同于他人的思考，继续给重新认识留下空间，没有用“挑战会被克服”来结束讨论。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Scientific claims will withstand the challenges brought against them.<\/p>\n<p>科学主张会经受住所面临的挑战。<\/p>\n<\/blockquote>\n<p>这段假设需要补出主张最终保留下来的肯定结果；它不必说挑战从未发生，也不必取消提出质疑的权利。实际原文没有给出这一结果，而把修改和反驳保留为后续可能，故两种推进不能互换。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认人物引语与科学认识怎样取得可信度有关，不能由取得可信度进一步判断主张会不会经受住今后的挑战；这种结果必须由第4段原文确定。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>scientific claims will survive challenges<br>科学主张会经受住挑战。<\/p>\n<\/blockquote>\n<p>可信度的形成不等于此后结果不再开放。A把主题中的“经过检验取得可信地位”向未来延伸，变成“在后续挑战中仍会成立”，而全文没有赋予可信发现这种保证。<\/p>\n<p>本项最终仍要根据“open to challenge”和“potential modification or refutation”这两处局部原文判断。原文允许主张被改变或反驳，A却直接写出它经受住挑战的结果。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. discoveries today inspire future research<\/h3>\n<blockquote>\n<p>今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡。第一轮将<code>inspire future research<\/code>与名言中的独立思考及后句<code>may not change their views<\/code>比较，认为原文没有写出“今天的发现启发未来研究”这一时间与作用关系，因此排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B借用了科学发现和未来研究者这两处真实材料，把它们接成今天的发现启发未来研究。引语讲的是发现者怎样面对相同观察提出新想法；前文的未来研究者则在挑战、修改或反驳现有主张。原文没有把未来研究产生的原因写成受到今天发现的启发，不能凭相关话题补出人物赞同这一说法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p>题干的人名定位名言，B的<code>future research<\/code>容易让人联系到前文的<code>future researchers<\/code>；但前文必须按完整动作理解，不能看到未来研究者，就自行补成他们受到启发。<\/p>\n<p>名言说，大家看见相同事物时，发现者想到了别人没有想过的内容。这里比较的是同样的观察与不同的思考，主体是提出新认识的发现者，并未转到后来研究者受到何种启发。<\/p>\n<p>前文确实写了未来研究者，但他们的动作是挑战、修改或反驳主张。后续研究可以与已有发现发生关系，仍不等于本句已经交代“已有发现激发后来研究”的因果；被研究、被质疑与成为灵感来源，需要分别说明。<\/p>\n<p>引语后面的<code>may not change their views<\/code>又提醒，新思考的影响并未得到保证。这句话不能证明未来研究绝不会受到启发，但它也没有提供B需要的正面依据；本题要找有文本支持的人物意见，而不是一般情况下可能成立的科学常识。<\/p>\n<p>B把“如何产生不同认识”改成“现有发现对未来研究的启发作用”，增加了引语及其语境都没有明确建立的时间和作用关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在名言之后这样接着写：<\/p>\n<blockquote>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>Sometimes years are required for truly novel discovery claims to be accepted and appreciated.<\/p>\n<p>新想法未必能改变别人的观点，真正新颖的发现主张有时还需要多年才能被接受和欣赏。<\/p>\n<\/blockquote>\n<p>作者实际继续讨论的是新颖认识怎样遭遇接受困难，让人物引语服务于可信度形成中的阻力。这里既没有介绍一项后来的研究，也没有说明它受到先前发现的激发。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Present discoveries provide ideas that stimulate later scientific research.<\/p>\n<p>现有发现提供新的想法，启发后来的科学研究。<\/p>\n<\/blockquote>\n<p>假设写法只需补出启发这一作用，不必保证所有发现都立刻引起更多研究。实际文章写的是新想法可能不被接受，未说明它为后续研究提供灵感；接受受阻不排除未来影响，但也不能代替B所需的启发关系。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认人物引语在解释发现与可信度形成之间的关系，不能单独判断今天的发现是否启发未来研究；仍须看这位人物具体谈了什么。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>discoveries today inspire future research<br>今天的发现会启发未来的研究。<\/p>\n<\/blockquote>\n<p>B把关注点放在今天与未来之间的启发作用上，而全文这一位置在说发现者如何提出不同认识，以及新认识为什么未必被立即接受。两者都属于科学活动，却回答了不同问题。<\/p>\n<p>本项最终仍要根据“thinking what nobody has thought”这处局部原文判断。它支持独立思考的方式，没有交代由现有发现推动未来研究的作用；不能用主题相关来补足这一缺失。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. efforts to make discoveries are justified<\/h3>\n<blockquote>\n<p>为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>justified<\/code>显示为<code>[xxx]<\/code>。第一轮已看出选项要评价<code>efforts to make discoveries<\/code>，而人物引语在描述面对同样事物怎样产生不同认识；后句也只补充新想法未必改变别人，因此没有从思考方式推到对发现努力的评价，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了发现这一话题，把“发现包含怎样的观察与思考”换成“投入发现的努力是否有正当理由”。<code>justified<\/code>需要对付出这些努力的合理性作肯定判断，而引语并未作出这种评价。说明一种活动怎样发生，并不自动等于评价为它付出努力是合理的；不能把对创新思维的描述扩展成对研究投入的总体肯定。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>Sometimes years are required for truly novel discovery claims to be accepted and appreciated.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>用题干的人名找到名言，C中的<code>make discoveries<\/code>对应名言描述的<code>discovery<\/code>，而<code>efforts<\/code>和<code>justified<\/code>则需要找到关于研究努力及其合理性的判断。仅有共同的发现话题，还不足以把这两个内容补进去。<\/p>\n<p>名言明确给出的事实是：发现者看见人人看见的事物，却想到了别人没有想到的内容。它把差别放在如何思考，既没有比较投入多少努力，也没有就这些努力是否值得或是否有正当理由作评价。<\/p>\n<p>后两句说，新想法可能改变不了他人，真正新颖的主张有时经过多年才获接受。它们补的是认识传播与接受的困难；等待多年可以说明过程漫长，却不能单独证明为此付出的努力是合理还是不合理。<\/p>\n<p>C的主语换成<code>efforts<\/code>，谓语用<code>are justified<\/code>作肯定评价。要接受这项，就需要人物把作出发现的努力与值得投入的理由联系起来；现有引语和补充句均没有给出这条联系。<\/p>\n<p>C把发现时的思维特点转成对研究努力的正当性评价，新增了原文没有表达的判断。不能选C，也不意味着文章在否定科学努力，只表示这项人物意见未由引语支持。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文从人物引语继续写道：<\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>But thinking what nobody else has thought and telling others what they have missed may not change their views.<\/p>\n<p>新发现依靠不同于他人的思考，但提出这样的新想法，未必就能改变别人的观点。<\/p>\n<\/blockquote>\n<p>实际推进先说明发现的思考特点，再转向新认识受到接受阻力。作者没有由这句名言转入“付出这些努力为什么合理”的论证，也没有在困难之后给出投入正当性的评价。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The effort devoted to making scientific discoveries is warranted.<\/p>\n<p>为作出科学发现而投入努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>这段假设只增加C要求的评价，不必同时承诺发现必然成功或立即获得认可。实际原文没有作出这一评价；新认识怎样产生、怎样被接受，与为此投入努力是否有正当理由，属于两个需要分别表达的判断。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认人物引语与发现主张取得可信度的过程有关，不能判断他是否肯定发现努力的正当性；这一评价仍需由人物引语提供依据。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>efforts to make discoveries are justified<br>为作出发现而付出的努力是有正当理由的。<\/p>\n<\/blockquote>\n<p>全文解释的是可信度如何形成，C评价的是为发现投入努力是否合理。解释科学实践中的一个过程，可以涉及创新与困难，却没有因此完成对研究努力的价值或正当性判断。<\/p>\n<p>本项最终仍要根据“seeing what everybody has seen and thinking what nobody has thought”这处局部原文判断。它说明观察相同而思考不同，没有评价努力是否合理，C添入了引语没有表达的态度。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. scientific work calls for a critical mind<\/h3>\n<blockquote>\n<p>科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把人物引语的<code>thinking what nobody has thought<\/code>与前文主张保持<code>open to challenge<\/code>接起来，读出不照搬已有看法、重新审视认识的要求，因此保留D；其余三项排除后选择D，后续没有改变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>D把名言所说的独立思考概括为科学工作需要的批判性思维。大家可以面对相同事物，发现者却不能只停留在已有解释上；本段又把科学工作指向现有知识中不完整或不正确的部分，允许已被认可的主张继续接受挑战。两层共同支持独立审视、提出不同判断的能力，而不是否定所有既有知识。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.<\/p>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p>题干的人名锁定名言，D的<code>critical mind<\/code>对应引语中不满足于已有思考的<code>thinking what nobody has thought<\/code>，并需结合本段对不完整、错误知识的重新审视来理解。这里不是只看“新想法”三个字，而是看作者将它放在哪种科学活动中。<\/p>\n<p>名言先说看到人人看见的事物，再说想到别人没有想到的内容。第一部分说明观察对象可以相同，第二部分把发现的区别放在思考方式上：不能因为他人已有解释，就停止自己的判断。<\/p>\n<p>前文补充了这种独立思考所面对的对象和态度。科学工作关注现有认识中被视为不完整或不正确的部分，即便看起来重要且可信的发现也仍向挑战、修改或反驳开放；已有认可不能替代继续审视。<\/p>\n<p>D的<code>critical<\/code>因此应理解为能够反思、检验和质疑现有认识，<code>calls for<\/code>说明科学工作需要这种能力。它没有说所有旧认识都是错的，也没有把独特想法直接等同于真实发现，只概括形成新认识所需要的思维要求。<\/p>\n<p>D从“相同观察中形成独立认识”及“既有主张仍接受审视”作出有限推断，准确回答这位人物最可能赞同的科学思维方式。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在本段和结尾分别这样写：<\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>人物名言强调对同样事物作独立思考，结尾进一步把相互质疑、修正和补充列为共同认识活动。<\/p>\n<\/blockquote>\n<p>文章后续没有要求新观点一经提出就免于批评，而是继续让认识进入共同体的审视之中。独立提出不同看法与愿意检验彼此推理能够接上，说明这里的科学思维既有创造新的解释，也有反思和修正的要求。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Scientific work requires researchers to think independently and critically examine accepted views.<\/p>\n<p>科学工作要求研究者独立思考，并以批判的眼光审视已有观点。<\/p>\n<\/blockquote>\n<p>这段假设所需的两步都能在实际推进中找到：名言要求在同样观察上形成别人没有的思考，本段及结尾要求已有认识继续接受质疑和修正。因此D概括的是文章写出的思维要求，没有额外增添研究结果的保证。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>人物对科学工作的看法应当能解释可信度形成所需要的思考：研究者既要独立形成认识，也要让已有认识接受审视；第4段名言具体说明了不止步于他人想法的要求。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>scientific work calls for a critical mind<br>科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p>D的主体是从事科学工作的人，要求是独立审视和判断，对象是观察及已有认识，方向与全文共同检验、质疑和修正的过程相接。它回答思维要求，没有把形成可信度写成无需继续怀疑的终点。<\/p>\n<p>这一判断仍有具体局部根据：人物要求<code>thinking what nobody has thought<\/code>，本段又允许现有发现保持<code>open to challenge<\/code>。两者共同支持批判性思维，而非仅凭全文谈科学就泛泛赞成某种能力。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>34题结论<\/h3>\n<blockquote>\n<p><strong>34. D. scientific work calls for a critical mind<\/strong><\/p>\n<\/blockquote>\n<p>A把接受挑战且可能被修改或反驳，改成主张会经受住挑战的肯定结果。<\/p>\n<p>B由发现与未来研究者这两处材料，补出今天的发现启发未来研究的作用。<\/p>\n<p>C把对发现时思考方式的描述，改成对发现努力正当性的评价。<\/p>\n<p>D结合独立思考与审视既有知识的语境，概括科学工作需要的批判性思维。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：科学发现的理想与现实<\/strong>（段落1核心对比） 理想版本：（客观研究者用科学方法观察收集事实）// 现实实践：（发现遵循模糊复杂的路线）→ 原因：【无法摆脱个人经历背景 + 先前知识和兴趣影响认知 + 误解错误自欺的机会大量存在】<\/p>\n<p>↓（因此引出概念）<\/p>\n<p><strong>逻辑层次2：从原始科学到成熟发现的转变<\/strong>（段落2可信度过程） 发现声明=原始科学（如新采矿权，充满潜力）→ 需要集体审查和接受 → 转变为成熟发现：【可信度过程：个体的&quot;我、这里、现在&quot;→共同体的&quot;任何人、任何地方、任何时间&quot;】→ 客观知识是目标而非起点<\/p>\n<p>↓（具体机制说明）<\/p>\n<p><strong>逻辑层次3：科学共同体的社会结构与转化过程<\/strong>（段落3社会机制） 发现声明公开后的过程：【发现者获得智力认可 // 但共同体掌控后续】→ 复杂社会结构中的角色：（研究者做出发现 + 编辑审稿人守门 + 其他科学家利用发现 + 公众接受发现和技术）→ 通过信念的互动和对抗：个人发现声明→共同体可信发现<\/p>\n<p>→（过程中的悖论）<\/p>\n<p><strong>逻辑层次4：可信度过程的两个悖论<\/strong>（段落4矛盾现象） 悖论一：【科学关注不完整/不正确的知识 + 复制确认无奖励 + 目标是&quot;新搜索&quot;非&quot;重新搜索&quot;】→ 结果：重要发现始终面临挑战 悖论二：【新颖性引发怀疑 + 圣捷尔吉：&quot;看到所有人看到的，思考无人想过的&quot; + 告诉他人其错过的可能无法改变其观点】→ 结果：真正新颖的发现需要数年才被接受<\/p>\n<p>↑（哲学总结）<\/p>\n<p><strong>逻辑层次5：可信度的本质<\/strong>（段落5哲学升华） 可信度&quot;发生在&quot;发现声明上 = 思想的公地（拜尔）：【共同推理 + 相互挑战 + 相互修正 + 相互完善】<\/p>\n<p>全文核心观点：科学发现从个人声明到共同体认可的可信发现，是一个复杂的社会过程。这个过程充满不确定性和悖论，需要集体审查、相互挑战和共同完善，最终在&quot;思想的公地&quot;中实现客观知识的目标。<\/p>\n<h2>小标题题<\/h2>\n<p>Read the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.<\/p>\n<p>[A] A shared answer through reasoning together<\/p>\n<p>[B] Protecting the discoverer&#39;s ownership of new knowledge<\/p>\n<p>[C] From a personal claim to a community&#39;s credible discovery<\/p>\n<p>[D] Looking beyond an idealized picture of scientific knowledge<\/p>\n<p>[E] The pursuit of novelty and its two difficulties<\/p>\n<p>[F] A lasting question about the grounds of belief<\/p>\n<p>[G] Technological success as sufficient proof of scientific truth<\/p>\n<h3>41. ______<\/h3>\n<p>As a graduate student in biochemistry at Tufts University School of Medicine, I read an abridged version of Montaigne&#39;s Essays. A friend and I spent hours walking around Boston, discussing what the essays meant. Montaigne had lived near Bordeaux in the sixteenth century, writing in a tower of his chateau among more than a thousand books. His question was simple: “What do I know?” It also invites another question: Why do we believe what we think we know?<\/p>\n<p>That question did not remain merely a topic for those student conversations. My book, Everyday Practice of Science: Where Intuition and Passion Meet Objectivity and Logic, was a later attempt to answer it. A problem raised by an earlier thinker thus continued into an inquiry about scientific life. The starting concern was not just what scientists believe, but what gives them grounds for believing it.<\/p>\n<h3>42. ______<\/h3>\n<p>Scientists may answer the question about knowledge rather readily. They can point to successful technology as evidence that their work is true. But that response makes the situation seem simpler than it is. In an idealized account, facts are waiting to be observed and collected by objective researchers using the scientific method.<\/p>\n<p>Actual discovery often takes an ambiguous and complicated route. Researchers seek objectivity, yet cannot escape their individual life histories. Prior knowledge and interests affect what they experience, how they interpret those experiences, and what they do next. There are many opportunities for mistakes, misinterpretation, and self-deception. The contrast does not require abandoning objectivity as an aim; it requires recognizing that an investigator does not begin free of these influences.<\/p>\n<h3>43. ______<\/h3>\n<p>For this reason, a discovery claim is better regarded as protoscience than as a finished achievement. Like a newly staked mining claim, it holds potential. Communal examination and acceptance are needed to turn that potential into a full-fledged discovery. In this credibility process, the individual&#39;s “me, here, now” becomes the community&#39;s “anyone, anywhere, anytime.” Objective knowledge is a goal to be reached.<\/p>\n<p>Once the claim becomes public, its originator receives intellectual credit, but does not control everything that follows. Researchers make discoveries; editors and reviewers control access to publication; other scientists put findings t
