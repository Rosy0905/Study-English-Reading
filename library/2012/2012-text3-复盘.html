seeing what everybody has seen and thinking what nobody has thought.”\n>\n> “We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”\n>\n> 人物名言强调对同样事物作独立思考，结尾进一步把相互质疑、修正和补充列为共同认识活动。\n\n文章后续没有要求新观点一经提出就免于批评，而是继续让认识进入共同体的审视之中。独立提出不同看法与愿意检验彼此推理能够接上，说明这里的科学思维既有创造新的解释，也有反思和修正的要求。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Scientific work requires researchers to think independently and critically examine accepted views.\n>\n> 科学工作要求研究者独立思考，并以批判的眼光审视已有观点。\n\n这段假设所需的两步都能在实际推进中找到：名言要求在同样观察上形成别人没有的思考，本段及结尾要求已有认识继续接受质疑和修正。因此D概括的是文章写出的思维要求，没有额外增添研究结果的保证。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1971,877,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q34-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把人物引语的<code>thinking what nobody has thought<\/code>与前文主张保持<code>open to challenge<\/code>接起来，读出不照搬已有看法、重新审视认识的要求，因此保留D；其余三项排除后选择D，后续没有改变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>D把名言所说的独立思考概括为科学工作需要的批判性思维。大家可以面对相同事物，发现者却不能只停留在已有解释上；本段又把科学工作指向现有知识中不完整或不正确的部分，允许已被认可的主张继续接受挑战。两层共同支持独立审视、提出不同判断的能力，而不是否定所有既有知识。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.<\/p>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p>题干的人名锁定名言，D的<code>critical mind<\/code>对应引语中不满足于已有思考的<code>thinking what nobody has thought<\/code>，并需结合本段对不完整、错误知识的重新审视来理解。这里不是只看“新想法”三个字，而是看作者将它放在哪种科学活动中。<\/p>\n<p>名言先说看到人人看见的事物，再说想到别人没有想到的内容。第一部分说明观察对象可以相同，第二部分把发现的区别放在思考方式上：不能因为他人已有解释，就停止自己的判断。<\/p>\n<p>前文补充了这种独立思考所面对的对象和态度。科学工作关注现有认识中被视为不完整或不正确的部分，即便看起来重要且可信的发现也仍向挑战、修改或反驳开放；已有认可不能替代继续审视。<\/p>\n<p>D的<code>critical<\/code>因此应理解为能够反思、检验和质疑现有认识，<code>calls for<\/code>说明科学工作需要这种能力。它没有说所有旧认识都是错的，也没有把独特想法直接等同于真实发现，只概括形成新认识所需要的思维要求。<\/p>\n<p>D从“相同观察中形成独立认识”及“既有主张仍接受审视”作出有限推断，准确回答这位人物最可能赞同的科学思维方式。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-2\"><h3>写作视角法<\/h3>\n<p>原文在本段和结尾分别这样写：<\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>人物名言强调对同样事物作独立思考，结尾进一步把相互质疑、修正和补充列为共同认识活动。<\/p>\n<\/blockquote>\n<p>文章后续没有要求新观点一经提出就免于批评，而是继续让认识进入共同体的审视之中。独立提出不同看法与愿意检验彼此推理能够接上，说明这里的科学思维既有创造新的解释，也有反思和修正的要求。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Scientific work requires researchers to think independently and critically examine accepted views.<\/p>\n<p>科学工作要求研究者独立思考，并以批判的眼光审视已有观点。<\/p>\n<\/blockquote>\n<p>这段假设所需的两步都能在实际推进中找到：名言要求在同样观察上形成别人没有的思考，本段及结尾要求已有认识继续接受质疑和修正。因此D概括的是文章写出的思维要求，没有额外增添研究结果的保证。<\/p>\n<\/section>"},{"title":"D. scientific work calls for a critical mind","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入34题题干：\n\n> 人物对科学工作的看法应当能解释可信度形成所需要的思考：研究者既要独立形成认识，也要让已有认识接受审视；第4段名言具体说明了不止步于他人想法的要求。\n\nD实际说的是：\n\n> scientific work calls for a critical mind  \n> 科学工作需要批判性思维。\n\nD的主体是从事科学工作的人，要求是独立审视和判断，对象是观察及已有认识，方向与全文共同检验、质疑和修正的过程相接。它回答思维要求，没有把形成可信度写成无需继续怀疑的终点。\n\n这一判断仍有具体局部根据：人物要求`thinking what nobody has thought`，本段又允许现有发现保持`open to challenge`。两者共同支持批判性思维，而非仅凭全文谈科学就泛泛赞成某种能力。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1971,877,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q34-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮把人物引语的<code>thinking what nobody has thought<\/code>与前文主张保持<code>open to challenge<\/code>接起来，读出不照搬已有看法、重新审视认识的要求，因此保留D；其余三项排除后选择D，后续没有改变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>D把名言所说的独立思考概括为科学工作需要的批判性思维。大家可以面对相同事物，发现者却不能只停留在已有解释上；本段又把科学工作指向现有知识中不完整或不正确的部分，允许已被认可的主张继续接受挑战。两层共同支持独立审视、提出不同判断的能力，而不是否定所有既有知识。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete or incorrect.<\/p>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or refutation by future researchers.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>阿尔伯特·圣捷尔吉最可能同意，科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p>题干的人名锁定名言，D的<code>critical mind<\/code>对应引语中不满足于已有思考的<code>thinking what nobody has thought<\/code>，并需结合本段对不完整、错误知识的重新审视来理解。这里不是只看“新想法”三个字，而是看作者将它放在哪种科学活动中。<\/p>\n<p>名言先说看到人人看见的事物，再说想到别人没有想到的内容。第一部分说明观察对象可以相同，第二部分把发现的区别放在思考方式上：不能因为他人已有解释，就停止自己的判断。<\/p>\n<p>前文补充了这种独立思考所面对的对象和态度。科学工作关注现有认识中被视为不完整或不正确的部分，即便看起来重要且可信的发现也仍向挑战、修改或反驳开放；已有认可不能替代继续审视。<\/p>\n<p>D的<code>critical<\/code>因此应理解为能够反思、检验和质疑现有认识，<code>calls for<\/code>说明科学工作需要这种能力。它没有说所有旧认识都是错的，也没有把独特想法直接等同于真实发现，只概括形成新认识所需要的思维要求。<\/p>\n<p>D从“相同观察中形成独立认识”及“既有主张仍接受审视”作出有限推断，准确回答这位人物最可能赞同的科学思维方式。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-2\"><h3>写作视角法<\/h3>\n<p>原文在本段和结尾分别这样写：<\/p>\n<blockquote>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”<\/p>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>人物名言强调对同样事物作独立思考，结尾进一步把相互质疑、修正和补充列为共同认识活动。<\/p>\n<\/blockquote>\n<p>文章后续没有要求新观点一经提出就免于批评，而是继续让认识进入共同体的审视之中。独立提出不同看法与愿意检验彼此推理能够接上，说明这里的科学思维既有创造新的解释，也有反思和修正的要求。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Scientific work requires researchers to think independently and critically examine accepted views.<\/p>\n<p>科学工作要求研究者独立思考，并以批判的眼光审视已有观点。<\/p>\n<\/blockquote>\n<p>这段假设所需的两步都能在实际推进中找到：名言要求在同样观察上形成别人没有的思考，本段及结尾要求已有认识继续接受质疑和修正。因此D概括的是文章写出的思维要求，没有额外增添研究结果的保证。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>人物对科学工作的看法应当能解释可信度形成所需要的思考：研究者既要独立形成认识，也要让已有认识接受审视；第4段名言具体说明了不止步于他人想法的要求。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>scientific work calls for a critical mind<br>科学工作需要批判性思维。<\/p>\n<\/blockquote>\n<p>D的主体是从事科学工作的人，要求是独立审视和判断，对象是观察及已有认识，方向与全文共同检验、质疑和修正的过程相接。它回答思维要求，没有把形成可信度写成无需继续怀疑的终点。<\/p>\n<p>这一判断仍有具体局部根据：人物要求<code>thinking what nobody has thought<\/code>，本段又允许现有发现保持<code>open to challenge<\/code>。两者共同支持批判性思维，而非仅凭全文谈科学就泛泛赞成某种能力。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. D. scientific work calls for a critical mind**\n\nA把接受挑战且可能被修改或反驳，改成主张会经受住挑战的肯定结果。\n\nB由发现与未来研究者这两处材料，补出今天的发现启发未来研究的作用。\n\nC把对发现时思考方式的描述，改成对发现努力正当性的评价。\n\nD结合独立思考与审视既有知识的语境，概括科学工作需要的批判性思维。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[18,1631,1124,398],"sourceW":1732,"sourceH":2566},"meta":{"kind":"conclusion","question":34},"level":3,"html":"<blockquote>\n<p><strong>34. D. scientific work calls for a critical mind<\/strong><\/p>\n<\/blockquote>\n<p>A把接受挑战且可能被修改或反驳，改成主张会经受住挑战的肯定结果。<\/p>\n<p>B由发现与未来研究者这两处材料，补出今天的发现启发未来研究的作用。<\/p>\n<p>C把对发现时思考方式的描述，改成对发现努力正当性的评价。<\/p>\n<p>D结合独立思考与审视既有知识的语境，概括科学工作需要的批判性思维。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：科学发现的理想与现实**（段落1核心对比） 理想版本：（客观研究者用科学方法观察收集事实）// 现实实践：（发现遵循模糊复杂的路线）→ 原因：【无法摆脱个人经历背景 + 先前知识和兴趣影响认知 + 误解错误自欺的机会大量存在】\n\n↓（因此引出概念）\n\n**逻辑层次2：从原始科学到成熟发现的转变**（段落2可信度过程） 发现声明=原始科学（如新采矿权，充满潜力）→ 需要集体审查和接受 → 转变为成熟发现：【可信度过程：个体的\"我、这里、现在\"→共同体的\"任何人、任何地方、任何时间\"】→ 客观知识是目标而非起点\n\n↓（具体机制说明）\n\n**逻辑层次3：科学共同体的社会结构与转化过程**（段落3社会机制） 发现声明公开后的过程：【发现者获得智力认可 // 但共同体掌控后续】→ 复杂社会结构中的角色：（研究者做出发现 + 编辑审稿人守门 + 其他科学家利用发现 + 公众接受发现和技术）→ 通过信念的互动和对抗：个人发现声明→共同体可信发现\n\n→（过程中的悖论）\n\n**逻辑层次4：可信度过程的两个悖论**（段落4矛盾现象） 悖论一：【科学关注不完整/不正确的知识 + 复制确认无奖励 + 目标是\"新搜索\"非\"重新搜索\"】→ 结果：重要发现始终面临挑战 悖论二：【新颖性引发怀疑 + 圣捷尔吉：\"看到所有人看到的，思考无人想过的\" + 告诉他人其错过的可能无法改变其观点】→ 结果：真正新颖的发现需要数年才被接受\n\n↑（哲学总结）\n\n**逻辑层次5：可信度的本质**（段落5哲学升华） 可信度\"发生在\"发现声明上 = 思想的公地（拜尔）：【共同推理 + 相互挑战 + 相互修正 + 相互完善】\n\n全文核心观点：科学发现从个人声明到共同体认可的可信发现，是一个复杂的社会过程。这个过程充满不确定性和悖论，需要集体审查、相互挑战和共同完善，最终在\"思想的公地\"中实现客观知识的目标。\n\n## 小标题题\n\nRead the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.\n\n[A] A shared answer through reasoning together\n\n[B] Protecting the discoverer's ownership of new knowledge\n\n[C] From a personal claim to a community's credible discovery\n\n[D] Looking beyond an idealized picture of scientific knowledge\n\n[E] The pursuit of novelty and its two difficulties\n\n[F] A lasting question about the grounds of belief\n\n[G] Technological success as sufficient proof of scientific truth\n\n### 41. ______\n\nAs a graduate student in biochemistry at Tufts University School of Medicine, I read an abridged version of Montaigne's Essays. A friend and I spent hours walking around Boston, discussing what the essays meant. Montaigne had lived near Bordeaux in the sixteenth century, writing in a tower of his chateau among more than a thousand books. His question was simple: “What do I know?” It also invites another question: Why do we believe what we think we know?\n\nThat question did not remain merely a topic for those student conversations. My book, Everyday Practice of Science: Where Intuition and Passion Meet Objectivity and Logic, was a later attempt to answer it. A problem raised by an earlier thinker thus continued into an inquiry about scientific life. The starting concern was not just what scientists believe, but what gives them grounds for believing it.\n\n### 42. ______\n\nScientists may answer the question about knowledge rather readily. They can point to successful technology as evidence that their work is true. But that response makes the situation seem simpler than it is. In an idealized account, facts are waiting to be observed and collected by objective researchers using the scientific method.\n\nActual discovery often takes an ambiguous and complicated route. Researchers seek objectivity, yet cannot escape their individual life histories. Prior knowledge and interests affect what they experience, how they interpret those experiences, and what they do next. There are many opportunities for mistakes, misinterpretation, and self-deception. The contrast does not require abandoning objectivity as an aim; it requires recognizing that an investigator does not begin free of these influences.\n\n### 43. ______\n\nFor this reason, a discovery claim is better regarded as protoscience than as a finished achievement. Like a newly staked mining claim, it holds potential. Communal examination and acceptance are needed to turn that potential into a full-fledged discovery. In this credibility process, the individual's “me, here, now” becomes the community's “anyone, anywhere, anytime.” Objective knowledge is a goal to be reached.\n\nOnce the claim becomes public, its originator receives intellectual credit, but does not control everything that follows. Researchers make discoveries; editors and reviewers control access to publication; other scientists put findings to their own uses; and the public receives new knowledge and possibly new technology. Shared and competing beliefs interact and confront one another as the claim moves through this structure. Credibility develops through that social process, rather than simply remaining the private possession of the person who first made the claim.\n\n### 44. ______\n\nThe credibility process contains two paradoxes. First, scientists usually look for what is incomplete or wrong in existing knowledge. Merely repeating and confirming familiar beliefs brings little reward. Yet the same search for something new means that even an impressive, convincing discovery remains open to later challenge, revision, or rejection.\n\nSecond, the novelty that makes a claim valuable can also make it difficult to believe. The physiologist and Nobel laureate Albert Szent-Györgyi described discovery as seeing what everyone has seen while thinking what no one has thought. But telling people about a possibility they have missed does not necessarily change their minds. A truly new claim may need years to be accepted and appreciated. Science therefore seeks departures from established thought while exposing accepted findings to fresh criticism and new proposals to initial resistance.\n\n### 45. ______\n\nIn the end, credibility emerges through a process that philosopher Annette Baier called the “commons of the mind.” People reason together: they challenge, revise, and complete one another's reasoning, as well as their ideas about reason itself. A discovery claim becomes credible within this continuing exchange.\n\nThe phrase also brings the discussion back to Montaigne. The answer to why we believe what we think we know is found, in the case of science, in this shared activity. The argument thus returns to its opening question with an account of mutual examination, rather than ending with the confidence of a single investigator.","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：科学发现的理想与现实<\/strong>（段落1核心对比） 理想版本：（客观研究者用科学方法观察收集事实）// 现实实践：（发现遵循模糊复杂的路线）→ 原因：【无法摆脱个人经历背景 + 先前知识和兴趣影响认知 + 误解错误自欺的机会大量存在】<\/p>\n<p>↓（因此引出概念）<\/p>\n<p><strong>逻辑层次2：从原始科学到成熟发现的转变<\/strong>（段落2可信度过程） 发现声明=原始科学（如新采矿权，充满潜力）→ 需要集体审查和接受 → 转变为成熟发现：【可信度过程：个体的&quot;我、这里、现在&quot;→共同体的&quot;任何人、任何地方、任何时间&quot;】→ 客观知识是目标而非起点<\/p>\n<p>↓（具体机制说明）<\/p>\n<p><strong>逻辑层次3：科学共同体的社会结构与转化过程<\/strong>（段落3社会机制） 发现声明公开后的过程：【发现者获得智力认可 // 但共同体掌控后续】→ 复杂社会结构中的角色：（研究者做出发现 + 编辑审稿人守门 + 其他科学家利用发现 + 公众接受发现和技术）→ 通过信念的互动和对抗：个人发现声明→共同体可信发现<\/p>\n<p>→（过程中的悖论）<\/p>\n<p><strong>逻辑层次4：可信度过程的两个悖论<\/strong>（段落4矛盾现象） 悖论一：【科学关注不完整/不正确的知识 + 复制确认无奖励 + 目标是&quot;新搜索&quot;非&quot;重新搜索&quot;】→ 结果：重要发现始终面临挑战 悖论二：【新颖性引发怀疑 + 圣捷尔吉：&quot;看到所有人看到的，思考无人想过的&quot; + 告诉他人其错过的可能无法改变其观点】→ 结果：真正新颖的发现需要数年才被接受<\/p>\n<p>↑（哲学总结）<\/p>\n<p><strong>逻辑层次5：可信度的本质<\/strong>（段落5哲学升华） 可信度&quot;发生在&quot;发现声明上 = 思想的公地（拜尔）：【共同推理 + 相互挑战 + 相互修正 + 相互完善】<\/p>\n<p>全文核心观点：科学发现从个人声明到共同体认可的可信发现，是一个复杂的社会过程。这个过程充满不确定性和悖论，需要集体审查、相互挑战和共同完善，最终在&quot;思想的公地&quot;中实现客观知识的目标。<\/p>\n"},{"title":"小标题题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 41题解析\n\n**答案：F — A lasting question about the grounds of belief。** 中文：一个关于信念依据的持久问题。\n\n这一部分整体在交代：作者怎样接触到“我知道什么、我为什么相信”这个问题，以及它怎样从学生时代的讨论延续到后来对科学实践的思考。写散步、古代思想家和书籍，都是为了建立这条持续追问的线索。\n\n关键证据是首段的 Montaigne's question 与 Why do we believe what we think we know，随后第二段说 That question did not remain merely a topic for those student conversations。末句进一步把问题限定为 what gives them grounds for believing it，而非仅仅列举科学家的信念。\n\n段内推进链：学生时代读随笔并与朋友讨论 → 接触“我知道什么”的追问 → 延伸为“相信的依据是什么” → 后来的书继续寻找答案 → 明确本文要处理的认识问题。\n\n标题中的 A lasting question 对应从学生讨论到后来著书的延续；grounds of belief 对应最后的“凭什么相信”。两部分同时覆盖时间线和真正的讨论对象，Montaigne的生活地点与藏书则是引入这位提问者的背景。\n\n最强干扰项是A。这里确实提到作者和朋友一起讨论，也提到一本尝试回答问题的书；但本节还没有提出“共同推理如何建立可信度”的答案。把shared answer放在这里，就把引入问题提前写成了论证结论。\n\n**最终答案：41选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{},"html":"<h3>41题解析<\/h3>\n<p><strong>答案：F — A lasting question about the grounds of belief。<\/strong> 中文：一个关于信念依据的持久问题。<\/p>\n<p>这一部分整体在交代：作者怎样接触到“我知道什么、我为什么相信”这个问题，以及它怎样从学生时代的讨论延续到后来对科学实践的思考。写散步、古代思想家和书籍，都是为了建立这条持续追问的线索。<\/p>\n<p>关键证据是首段的 Montaigne&#39;s question 与 Why do we believe what we think we know，随后第二段说 That question did not remain merely a topic for those student conversations。末句进一步把问题限定为 what gives them grounds for believing it，而非仅仅列举科学家的信念。<\/p>\n<p>段内推进链：学生时代读随笔并与朋友讨论 → 接触“我知道什么”的追问 → 延伸为“相信的依据是什么” → 后来的书继续寻找答案 → 明确本文要处理的认识问题。<\/p>\n<p>标题中的 A lasting question 对应从学生讨论到后来著书的延续；grounds of belief 对应最后的“凭什么相信”。两部分同时覆盖时间线和真正的讨论对象，Montaigne的生活地点与藏书则是引入这位提问者的背景。<\/p>\n<p>最强干扰项是A。这里确实提到作者和朋友一起讨论，也提到一本尝试回答问题的书；但本节还没有提出“共同推理如何建立可信度”的答案。把shared answer放在这里，就把引入问题提前写成了论证结论。<\/p>\n<p><strong>最终答案：41选F。<\/strong><\/p>\n"},{"title":"小标题题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 42题解析\n\n**答案：D — Looking beyond an idealized picture of scientific knowledge。** 中文：超越关于科学知识的理想化图景。\n\n这一部分整体在拆开“研究者一开始就完全客观、事实只等着被收集”的简单认识，指出科学实践中个人经历、已有知识和兴趣造成的复杂影响。它是在说明理想图景遗漏了什么，不是在否定追求客观的目标。\n\n开头先说科学家容易拿技术成功作答，紧接着用 But that response makes the situation seem simpler than it is 转向限制；第二段的 Actual discovery 与前面的 idealized account 对照。末句明确说 objectivity 仍是aim，只是研究者并非begin free of these influences。\n\n段内推进链：技术成功带来迅速而自信的回答 → 摆出客观研究者收集事实的理想模型 → 转到发现的现实路径 → 列出经历、知识和兴趣的影响 → 修正“客观是天然起点”的假设。\n\n标题中的 idealized picture 对应第一段的理想模型；Looking beyond 对应接下来补入实际研究的复杂性。scientific knowledge覆盖被讨论的知识获取过程，而不是只抓住某项技术成果。\n\n最强干扰项是G。技术成功的确出现在开头，但它属于被进一步审视的简答；sufficient proof却把它写成了已经充分的证明，跨过了But之后的反思，也无法解释第二段为什么集中讲错误和自欺的机会。\n\n**最终答案：42选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{},"html":"<h3>42题解析<\/h3>\n<p><strong>答案：D — Looking beyond an idealized picture of scientific knowledge。<\/strong> 中文：超越关于科学知识的理想化图景。<\/p>\n<p>这一部分整体在拆开“研究者一开始就完全客观、事实只等着被收集”的简单认识，指出科学实践中个人经历、已有知识和兴趣造成的复杂影响。它是在说明理想图景遗漏了什么，不是在否定追求客观的目标。<\/p>\n<p>开头先说科学家容易拿技术成功作答，紧接着用 But that response makes the situation seem simpler than it is 转向限制；第二段的 Actual discovery 与前面的 idealized account 对照。末句明确说 objectivity 仍是aim，只是研究者并非begin free of these influences。<\/p>\n<p>段内推进链：技术成功带来迅速而自信的回答 → 摆出客观研究者收集事实的理想模型 → 转到发现的现实路径 → 列出经历、知识和兴趣的影响 → 修正“客观是天然起点”的假设。<\/p>\n<p>标题中的 idealized picture 对应第一段的理想模型；Looking beyond 对应接下来补入实际研究的复杂性。scientific knowledge覆盖被讨论的知识获取过程，而不是只抓住某项技术成果。<\/p>\n<p>最强干扰项是G。技术成功的确出现在开头，但它属于被进一步审视的简答；sufficient proof却把它写成了已经充分的证明，跨过了But之后的反思，也无法解释第二段为什么集中讲错误和自欺的机会。<\/p>\n<p><strong>最终答案：42选D。<\/strong><\/p>\n"},{"title":"小标题题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 43题解析\n\n**答案：C — From a personal claim to a community's credible discovery。** 中文：从个人的发现声明到共同体认可的可信发现。\n\n这一部分整体在解释可信度形成的转变及其具体运作。首段说明个人声明只是有潜力的起点，需要共同审查和接受；次段说明公开之后由哪些人参与、通过什么互动完成这种转化。\n\n关键证据是第一段的 Communal examination and acceptance are needed，以及从 me, here, now 到 anyone, anywhere, anytime 的变化。第二段末尾又用 develops through that social process 收拢研究者、编辑、审稿人、其他科学家和公众的角色。\n\n段内推进链：发现声明有潜力但尚未成熟 → 共同审查和接受带来可信度 → 声明公开后发现者获得认可 → 共同体接手后续过程 → 不同角色和信念发生互动 → 个人声明转成公共的可信发现。\n\n标题中的 From a personal claim 对应protoscience与个体的时空经验；to a community's credible discovery对应审查、接受和共同体互动所形成的结果。中间的角色清单不是另起话题，而是解释from到to如何发生。\n\n最强干扰项是B。mining claim与intellectual credit容易让人联想到发现者的权利，但后文明确说发现者 does not control everything that follows，且结尾否定可信度只是私人财产。B把用于比较的矿权细节和应得认可扩大成对知识所有权的保护，方向与主体变化都不合。\n\n**最终答案：43选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{},"html":"<h3>43题解析<\/h3>\n<p><strong>答案：C — From a personal claim to a community&#39;s credible discovery。<\/strong> 中文：从个人的发现声明到共同体认可的可信发现。<\/p>\n<p>这一部分整体在解释可信度形成的转变及其具体运作。首段说明个人声明只是有潜力的起点，需要共同审查和接受；次段说明公开之后由哪些人参与、通过什么互动完成这种转化。<\/p>\n<p>关键证据是第一段的 Communal examination and acceptance are needed，以及从 me, here, now 到 anyone, anywhere, anytime 的变化。第二段末尾又用 develops through that social process 收拢研究者、编辑、审稿人、其他科学家和公众的角色。<\/p>\n<p>段内推进链：发现声明有潜力但尚未成熟 → 共同审查和接受带来可信度 → 声明公开后发现者获得认可 → 共同体接手后续过程 → 不同角色和信念发生互动 → 个人声明转成公共的可信发现。<\/p>\n<p>标题中的 From a personal claim 对应protoscience与个体的时空经验；to a community&#39;s credible discovery对应审查、接受和共同体互动所形成的结果。中间的角色清单不是另起话题，而是解释from到to如何发生。<\/p>\n<p>最强干扰项是B。mining claim与intellectual credit容易让人联想到发现者的权利，但后文明确说发现者 does not control everything that follows，且结尾否定可信度只是私人财产。B把用于比较的矿权细节和应得认可扩大成对知识所有权的保护，方向与主体变化都不合。<\/p>\n<p><strong>最终答案：43选C。<\/strong><\/p>\n"},{"title":"小标题题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 44题解析\n\n**答案：E — The pursuit of novelty and its two difficulties。** 中文：对新颖性的追求及其带来的两重困难。\n\n这一部分整体在解释可信度过程中的两个悖论：追求新知让已经可信的发现继续面临挑战，同时新颖本身又可能让新声明遭遇怀疑。两条线都围绕科学为何需要新东西、却不能让新东西自动获得稳定认可展开。\n\n开头直接提出 two paradoxes，随后用 First 与 Second 分开推进。第一部分的 Yet the same search 把奖励新知与继续挑战连接起来；第二部分的 But ... does not necessarily change their minds 则把独特思考与迟缓接受连接起来。\n\n段内推进链：科学寻找现有知识的缺口 → 单纯重复确认缺少奖励 → 连有说服力的发现也将被后人挑战 → 新颖使声明有价值 → 新颖又使其难以被相信 → 真正的新发现可能多年后才获认可。\n\n标题中的 pursuit of novelty覆盖两部分共同的动力；two difficulties分别对应既有发现难以获得终局地位、新颖声明难以立即得到接受。末句把fresh criticism与initial resistance并列，正是对标题两部分的回收。\n\n最强干扰项是C。这一节确实处在可信度形成的大背景中，也谈接受；但它没有完整展开“个人声明经共同体转化”的机制，而是专门讨论这一过程中的两个矛盾。C的范围过宽，会掩盖First、Second共同建立的局部中心。\n\n**最终答案：44选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{},"html":"<h3>44题解析<\/h3>\n<p><strong>答案：E — The pursuit of novelty and its two difficulties。<\/strong> 中文：对新颖性的追求及其带来的两重困难。<\/p>\n<p>这一部分整体在解释可信度过程中的两个悖论：追求新知让已经可信的发现继续面临挑战，同时新颖本身又可能让新声明遭遇怀疑。两条线都围绕科学为何需要新东西、却不能让新东西自动获得稳定认可展开。<\/p>\n<p>开头直接提出 two paradoxes，随后用 First 与 Second 分开推进。第一部分的 Yet the same search 把奖励新知与继续挑战连接起来；第二部分的 But ... does not necessarily change their minds 则把独特思考与迟缓接受连接起来。<\/p>\n<p>段内推进链：科学寻找现有知识的缺口 → 单纯重复确认缺少奖励 → 连有说服力的发现也将被后人挑战 → 新颖使声明有价值 → 新颖又使其难以被相信 → 真正的新发现可能多年后才获认可。<\/p>\n<p>标题中的 pursuit of novelty覆盖两部分共同的动力；two difficulties分别对应既有发现难以获得终局地位、新颖声明难以立即得到接受。末句把fresh criticism与initial resistance并列，正是对标题两部分的回收。<\/p>\n<p>最强干扰项是C。这一节确实处在可信度形成的大背景中，也谈接受；但它没有完整展开“个人声明经共同体转化”的机制，而是专门讨论这一过程中的两个矛盾。C的范围过宽，会掩盖First、Second共同建立的局部中心。<\/p>\n<p><strong>最终答案：44选E。<\/strong><\/p>\n"},{"title":"小标题题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 45题解析\n\n**答案：A — A shared answer through reasoning together。** 中文：通过共同推理形成的回答。\n\n这一部分整体在给全文收束：用“思想的公地”概括可信度如何在共同活动中形成，再把这个概括接回开篇“为什么相信自己所知道的”这一问题。\n\n关键证据是 In the end、People reason together，以及第二段的 brings the discussion back to Montaigne。最后又说 returns to its opening question with an account of mutual examination，明确告诉我们这里已经从提出问题走到解释答案。\n\n段内推进链：以“思想的公地”概括可信度过程 → 解释共同挑战、修正与完善 → 把发现的可信度放入这种持续交流 → 回扣Montaigne的问题 → 以相互审查的过程回答“凭什么相信”。\n\n标题中的 shared 对应并非单个研究者独享的认识活动；reasoning together对应共同推理及相互修正；answer则对应本节回到开头问题并给出解释的收尾功能。\n\n最强干扰项是F。首尾确实重复同一个关于信念依据的问题，但这一节重点已不是问题持续了多久，而是科学如何借共同活动回答它。若只选lasting question，就漏掉本节新增的答案，也无法覆盖Baier的核心概括。\n\n**最终答案：45选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{},"html":"<h3>45题解析<\/h3>\n<p><strong>答案：A — A shared answer through reasoning together。<\/strong> 中文：通过共同推理形成的回答。<\/p>\n<p>这一部分整体在给全文收束：用“思想的公地”概括可信度如何在共同活动中形成，再把这个概括接回开篇“为什么相信自己所知道的”这一问题。<\/p>\n<p>关键证据是 In the end、People reason together，以及第二段的 brings the discussion back to Montaigne。最后又说 returns to its opening question with an account of mutual examination，明确告诉我们这里已经从提出问题走到解释答案。<\/p>\n<p>段内推进链：以“思想的公地”概括可信度过程 → 解释共同挑战、修正与完善 → 把发现的可信度放入这种持续交流 → 回扣Montaigne的问题 → 以相互审查的过程回答“凭什么相信”。<\/p>\n<p>标题中的 shared 对应并非单个研究者独享的认识活动；reasoning together对应共同推理及相互修正；answer则对应本节回到开头问题并给出解释的收尾功能。<\/p>\n<p>最强干扰项是F。首尾确实重复同一个关于信念依据的问题，但这一节重点已不是问题持续了多久，而是科学如何借共同活动回答它。若只选lasting question，就漏掉本节新增的答案，也无法覆盖Baier的核心概括。<\/p>\n<p><strong>最终答案：45选A。<\/strong><\/p>\n"},{"title":"排序题 · 完整题面与全局解析","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\nThe following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.\n\n| 已给位置 | 41 | 42 | 已给位置 | 43 | 44 | 45 | 已给位置 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| A | ______ | ______ | E | ______ | ______ | ______ | H |\n\n### [A]\n\nAs a biochemistry graduate student, I read Montaigne's Essays and spent hours discussing them with a friend as we walked around Boston. The sixteenth-century writer asked, “What do I know?” My later book, Everyday Practice of Science: Where Intuition and Passion Meet Objectivity and Logic, was another attempt to address the issue. Montaigne's challenge extends beyond listing what we know to asking why we accept it: Why do we believe what we think we know?\n\n### [B]\n\nThe first paradox concerns what the search for new knowledge does to findings that already appear convincing. Scientific work often challenges some part of prevailing knowledge that seems incomplete or incorrect. Little reward comes from simply duplicating and confirming what is already accepted. As a result, even an important discovery remains open to modification or refutation by later researchers. The pursuit of novelty thus keeps established findings provisional. It creates a second difficulty as well.\n\n### [C]\n\nScientists may answer that question readily by pointing to the success of technology as evidence for the truth of their work. This confidence fits an idealized picture: objective researchers use a scientific method to observe and collect facts waiting in the world. But the situation is more complicated. What is missing from this picture of an investigator who is already objective?\n\n### [D]\n\nWhat it leaves out is the investigator's own history. In everyday science, discovery follows an ambiguous and complicated route, and researchers cannot escape the influence of their experiences. Prior knowledge and interests shape what they encounter, how they interpret it, and what they do next. Misinterpretation, error, and self-deception are possible at many points. A claim emerging from these circumstances has potential, but cannot yet be treated as a mature discovery.\n\n### [E]\n\nThis potential is what makes a discovery claim resemble a newly staked mining claim. It should be regarded as protoscience until communal scrutiny and acceptance turn it into a full-fledged discovery. The credibility process transforms the individual's “me, here, now” into the community's “anyone, anywhere, anytime.” Objective knowledge is the goal rather than the starting point. How, then, does the community carry out this transformation?\n\n### [F]\n\nThe process begins to involve the wider community once the claim becomes public. Its maker receives intellectual credit, but the community controls what happens next. Researchers produce discoveries, editors and reviewers control publication, other scientists use the findings, and the public receives knowledge and possibly technology. As shared and competing beliefs interact and confront one another, a personal claim becomes a credible discovery. Within this process, however, the search for new knowledge creates two paradoxes.\n\n### [G]\n\nThat second difficulty is that novelty itself often provokes disbelief. Albert Szent-Györgyi described discovery as seeing what everyone has seen while thinking what nobody has thought. Yet telling others what they have missed may not alter their views. Acceptance and appreciation of a truly novel claim can take years. Credibility therefore cannot simply be declared by the discoverer; it emerges as others consider and respond to the claim.\n\n### [H]\n\nIn the end, credibility comes about in what philosopher Annette Baier called the “commons of the mind.” People reason together, challenging, revising, and completing one another's reasoning and conceptions of reason. This shared activity is where science finds its answer to the question that began the discussion. To explain why we believe what we think we know, we must consider how minds work with, and question, one another.\n\n## 排序题全局解析\n\n先辨认每一段在全文中的功能，再检查段首、段尾能否双向接住，不能只凭“都在讲科学”就连在一起。\n\n| 段落 | 这一段在做什么 | 关键接点 |\n| --- | --- | --- |\n| A | 用读Montaigne的经历和后来的书引出“凭什么相信” | 末尾提出Why do we believe这一问题 |\n| B | 解释第一个悖论：追求新知让已有发现继续受挑战 | The first paradox起头，a second difficulty收尾 |\n| C | 先给科学家的迅速回答与理想模型，再追问遗漏了什么 | that question回指A；段尾问already objective图景漏了什么 |\n| D | 补入个人经历与解释偏差，说明声明仅有潜力 | What it leaves out回答C；段尾potential接E |\n| E | 定义从潜力到成熟发现的可信度过程 | This potential回指D；末尾追问共同体如何转化 |\n| F | 解释公开后的社会角色和信念互动，并引出两个悖论 | 回答E的How；末尾two paradoxes领起B、G |\n| G | 解释第二个悖论：新颖本身引发不信与迟缓接受 | That second difficulty回指B；末尾把可信度交给他人回应 |\n| H | 用思想的公地总结共同推理，并回答开篇问题 | In the end收束，the question that began the discussion回扣A |\n\n全文推进链：提出信念依据的问题 → 给出科学家的简单答案和理想图景 → 补足现实中的个人影响 → 引入可信度转化 → 解释共同体的实际机制 → 悖论一：已有发现仍受挑战 → 悖论二：新颖声明可能受怀疑 → 以共同推理回扣最初的问题。\n\n**完整顺序：A → C → D → E → F → B → G → H。**\n\n**41—45答案：C、D、F、B、G。**\n\nA、E、H三个已给位置分别固定“提出问题”“概念转折”“最后回答”。A与E之间的C、D完成理想和现实的对比；E与H之间的F、B、G则依次完成机制解释和两个悖论。每段都同时接住前段的任务，并为后段留下具体对象。\n","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{},"html":"<h2>排序题全局解析<\/h2>\n<p>先辨认每一段在全文中的功能，再检查段首、段尾能否双向接住，不能只凭“都在讲科学”就连在一起。<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段 "sorting","current":"C","label":"排序题"},"meta":{},"html":"<h3>排序41题解析<\/h3>\n<p>当前空位在已给A之后、42题之前；再往后是已给E的“潜力转为成熟发现”。41题需要先回应A末尾的认识问题，并为42题解释实际研究的局限建立一个被修正的理想模型。<\/p>\n<p>A段尾提出 Why do we believe what we think we know，C开头紧接 Scientists may answer that question readily。C先说技术成功与客观研究者的理想图景，末尾问 What is missing from this picture；下一段D的 What it leaves out 则正面回答“漏掉了什么”。<\/p>\n<p>that question的指代和answer的动作使A→C形成问答。C后半用But质疑简答，才引出D对研究者个人经历的补充。前后不是简单重复“知识”，而是“提出问题—先给答案—指出答案遗漏”的推进。<\/p>\n<p>局部推进链：A问为何相信 → C给技术成功与理想模型的简答 → C追问客观研究者图景遗漏何物 → D补入研究者个人历史与偏差。<\/p>\n<p>最强候选是D，因为它也能说明知识为什么不稳固。但D的What it leaves out需要前文已有一个遗漏了东西的picture；A只有Montaigne的问题，并未描述理想研究者。若直接放D，既丢掉C的简答，也让D的指代没有准确前项。<\/p>\n<p><strong>最终答案：41填C。<\/strong><\/p>\n"},{"title":"排序题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序42题解析\n\n当前空位在已确定的C之后、已给E之前。C末尾问完全客观的研究者图景漏掉了什么，E开头则用This potential承接某个尚未成熟的声明。因此42题要回答前一个问题，并建立“有潜力但未成熟”这个后续对象。\n\nC段尾的 What is missing from this picture 对应D首句 What it leaves out is the investigator's own history。D列出知识、兴趣和经历带来的影响，结尾说 a claim ... has potential, but cannot yet be treated as a mature discovery；E随即以 This potential 接入矿权类比与共同审查。\n\n前端是明确问答，后端是this指代和potential的重复。D的段落功能又把“理想模型遗漏个人因素”推进为“个人声明不能直接当成成熟发现”，E才有理由说明转化的必要条件。\n\n局部推进链：C理想图景存在遗漏 → D补入个体经验、解释和错误可能 → D判定声明有潜力但未成熟 → E解释共同审查如何使其成熟。\n\n最强候选是F。它同样谈声明与共同体，但没有回答C的问题，也没有提供E的This potential所回指的明确判断。F是在E定义credibility process之后解释如何运作，提前放入会让概念与机制的顺序倒置。\n\n**最终答案：42填D。**","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{},"html":"<h3>排序42题解析<\/h3>\n<p>当前空位在已确定的C之后、已给E之前。C末尾问完全客观的研究者图景漏掉了什么，E开头则用This potential承接某个尚未成熟的声明。因此42题要回答前一个问题，并建立“有潜力但未成熟”这个后续对象。<\/p>\n<p>C段尾的 What is missing from this picture 对应D首句 What it leaves out is the investigator&#39;s own history。D列出知识、兴趣和经历带来的影响，结尾说 a claim ... has potential, but cannot yet be treated as a mature discovery；E随即以 This potential 接入矿权类比与共同审查。<\/p>\n<p>前端是明确问答，后端是this指代和potential的重复。D的段落功能又把“理想模型遗漏个人因素”推进为“个人声明不能直接当成成熟发现”，E才有理由说明转化的必要条件。<\/p>\n<p>局部推进链：C理想图景存在遗漏 → D补入个体经验、解释和错误可能 → D判定声明有潜力但未成熟 → E解释共同审查如何使其成熟。<\/p>\n<p>最强候选是F。它同样谈声明与共同体，但没有回答C的问题，也没有提供E的This potential所回指的明确判断。F是在E定义credibility process之后解释如何运作，提前放入会让概念与机制的顺序倒置。<\/p>\n<p><strong>最终答案：42填D。<\/strong><\/p>\n"},{"title":"排序题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序43题解析\n\n当前空位在已给E之后、44题之前；44和45将分别放入两个悖论。E末尾问共同体如何完成转化，因此43题要给出操作过程，并建立后面展开悖论所需要的总领。\n\nE段尾问 How ... does the community carry out this transformation，F从 claim becomes public 开始，按发现者、编辑审稿人、其他科学家和公众说明参与过程。F末句提出 two paradoxes，下一段B便以 The first paradox 起头。\n\n前端是“怎么转化—角色与信念互动”的问答，后端是“两个—第一个”的总分连接。F中的The process有E已经定义的credibility process作前项，personal claim becomes a credible discovery又把这一问答收拢。\n\n局部推进链：E定义可信度并问如何实现 → F说明公开后的共同体角色与互动 → F引出两个悖论 → B先展开第一个悖论。\n\n最强候选是B，因为E已经说到可信度，可以继续谈困难。但B开头的The first paradox在E中没有总领前项，E最后的How也尚未得到回答。F既补足社会机制，又给B、G安排好总分关系，不能省掉。\n\n**最终答案：43填F。**","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{},"html":"<h3>排序43题解析<\/h3>\n<p>当前空位在已给E之后、44题之前；44和45将分别放入两个悖论。E末尾问共同体如何完成转化，因此43题要给出操作过程，并建立后面展开悖论所需要的总领。<\/p>\n<p>E段尾问 How ... does the community carry out this transformation，F从 claim becomes public 开始，按发现者、编辑审稿人、其他科学家和公众说明参与过程。F末句提出 two paradoxes，下一段B便以 The first paradox 起头。<\/p>\n<p>前端是“怎么转化—角色与信念互动”的问答，后端是“两个—第一个”的总分连接。F中的The process有E已经定义的credibility process作前项，personal claim becomes a credible discovery又把这一问答收拢。<\/p>\n<p>局部推进链：E定义可信度并问如何实现 → F说明公开后的共同体角色与互动 → F引出两个悖论 → B先展开第一个悖论。<\/p>\n<p>最强候选是B，因为E已经说到可信度，可以继续谈困难。但B开头的The first paradox在E中没有总领前项，E最后的How也尚未得到回答。F既补足社会机制，又给B、G安排好总分关系，不能省掉。<\/p>\n<p><strong>最终答案：43填F。<\/strong><\/p>\n"},{"title":"排序题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序44题解析\n\n当前空位在已确定的F之后、45题之前。F刚总领two paradoxes；45题的G以That second difficulty起头。因此44题必须先写第一个悖论，并在末尾把话题递交给第二个。\n\nF段尾的 two paradoxes 对应B段首 The first paradox。B解释新知导向如何使已有发现持续受到挑战，末尾说 It creates a second difficulty as well；G段首的 That second difficulty is that novelty itself often provokes disbelief 就接住了这句话。\n\n前端靠数目与序次建立总分，后端靠that指代与second difficulty的重复对象连接。内容上，B先看创新对既有发现的后果，G再看创新对新声明被接受的后果，两者构成不同方向的困难。\n\n局部推进链：F宣布两个悖论 → B讲已有知识仍可能被更新推翻 → B转向创新的第二重困难 → G讲新颖声明引起怀疑。\n\n最强候选是G。它也在讨论新颖带来的困难，却以That second difficulty开头，必须有前文明确提出的第二重困难；直接接F就跳过了first，也使B末尾的second指向无法顺着阅读方向继续。\n\n**最终答案：44填B。**","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{},"html":"<h3>排序44题解析<\/h3>\n<p>当前空位在已确定的F之后、45题之前。F刚总领two paradoxes；45题的G以That second difficulty起头。因此44题必须先写第一个悖论，并在末尾把话题递交给第二个。<\/p>\n<p>F段尾的 two paradoxes 对应B段首 The first paradox。B解释新知导向如何使已有发现持续受到挑战，末尾说 It creates a second difficulty as well；G段首的 That second difficulty is that novelty itself often provokes disbelief 就接住了这句话。<\/p>\n<p>前端靠数目与序次建立总分，后端靠that指代与second difficulty的重复对象连接。内容上，B先看创新对既有发现的后果，G再看创新对新声明被接受的后果，两者构成不同方向的困难。<\/p>\n<p>局部推进链：F宣布两个悖论 → B讲已有知识仍可能被更新推翻 → B转向创新的第二重困难 → G讲新颖声明引起怀疑。<\/p>\n<p>最强候选是G。它也在讨论新颖带来的困难，却以That second difficulty开头，必须有前文明确提出的第二重困难；直接接F就跳过了first，也使B末尾的second指向无法顺着阅读方向继续。<\/p>\n<p><strong>最终答案：44填B。<\/strong><\/p>\n"},{"title":"排序题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序45题解析\n\n当前空位在已确定的B之后、已给H之前。B末尾已经提出a second difficulty，H将用思想的公地收束全文。45题需要完成尚未解释的第二个困难，并把讨论交给共同体的回应与推理。\n\nB段尾的 a second difficulty 与G首句 That second difficulty is that novelty itself often provokes disbelief 逐项呼应。G从独特思考不一定说服他人，推进到新声明可能多年后才被接受，末尾强调 others consider and respond；H再以 People reason together 解释这种共同活动的总体性质。\n\n前端是明确指代与定义，后端是他人回应到共同推理的功能提升。G没有另起一套标准，而是完成F预告、B转交的第二个悖论；H因此能从全部过程上升到“思想的公地”，再回扣开头。\n\n局部推进链：B提出第二重困难 → G解释新颖引发怀疑与接受延迟 → G指出可信度在他人回应中形成 → H以共同挑战、修正和完善给出总结。\n\n最强候选是F。它也讲共同体，似乎能接到H的共享活动，但不能解释B已经点出的第二重困难；而且F末尾才宣布two paradoxes，放在这里会倒置总分顺序，让已解释过的第一悖论失去前面的总领。\n\n**最终答案：45填G。**","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{},"html":"<h3>排序45题解析<\/h3>\n<p>当前空位在已确定的B之后、已给H之前。B末尾已经提出a second difficulty，H将用思想的公地收束全文。45题需要完成尚未解释的第二个困难，并把讨论交给共同体的回应与推理。<\/p>\n<p>B段尾的 a second difficulty 与G首句 That second difficulty is that novelty itself often provokes disbelief 逐项呼应。G从独特思考不一定说服他人，推进到新声明可能多年后才被接受，末尾强调 others consider and respond；H再以 People reason together 解释这种共同活动的总体性质。<\/p>\n<p>前端是明确指代与定义，后端是他人回应到共同推理的功能提升。G没有另起一套标准，而是完成F预告、B转交的第二个悖论；H因此能从全部过程上升到“思想的公地”，再回扣开头。<\/p>\n<p>局部推进链：B提出第二重困难 → G解释新颖引发怀疑与接受延迟 → G指出可信度在他人回应中形成 → H以共同挑战、修正和完善给出总结。<\/p>\n<p>最强候选是F。它也讲共同体，似乎能接到H的共享活动，但不能解释B已经点出的第二重困难；而且F末尾才宣布two paradoxes，放在这里会倒置总分顺序，让已解释过的第一悖论失去前面的总领。<\/p>\n<p><strong>最终答案：45填G。<\/strong><\/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **critical thinking** | **批判性思维** | **人生哲理类** | **个人主题** |\n| independent thinking | 独立思考 | 人生哲理类 | 个人主题 |\n| intellectual modesty | 求知中的谦虚态度 | 人生哲理类 | 个人主题 |\n| **joint efforts** | **共同努力** | **人生哲理类** | **个人主题** |\n| striving for excellence | 精益求精 | 人生哲理类 | 个人主题 |\n| persistence | 坚持 | 人生哲理类 | 个人主题 |\n| mutual trust | 相互信任 | 人生哲理类 | 个人主题 |\n| lifelong learning | 终身学习 | 社会现象类—文化教育 | 个人主题 |\n| quality-oriented education | 素质教育 | 社会现象类—文化教育 | 宏观主题 |\n| **technological innovation** | **科技创新** | **经济消费类** | **宏观主题** |\n| technological progress | 科技进步 | 经济消费类 | 宏观主题 |\n| a rational view of new technology | 理性看待新科技 | 社会现象类—科技经济 | 个人主题 |","level":2,"section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>critical thinking<\/strong><\/td>\n<td><strong>批判性思维<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>independent thinking<\/td>\n<td>独立思考<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>intellectual modesty<\/td>\n<td>求知中的谦虚态度<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>joint efforts<\/strong><\/td>\n<td><strong>共同努力<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/t ople take.<\/td>\n<td>短文解释了A如何影响B以及人们随后采取的行动。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage discusses why A is open to challenge and revision.<\/td>\n<td>短文讨论了A为何可能受到质疑和修正。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage focuses on the joint efforts required to turn A into B.<\/td>\n<td>短文着重介绍了将A转变为B所需要的共同努力。<\/td>\n<\/tr>\n<\/tbody><\/table>\n"}];

const NEWTYPE={"smallTitle":"<h2>小标题题<\/h2><p>Choose the most suitable heading from A–G for each section (41–45). There are two extra headings.<\/p><p><b>[A]<\/b> A shared answer through reasoning together<\/p><p><b>[B]<\/b> Protecting the discoverer&#x27;s ownership of new knowledge<\/p><p><b>[C]<\/b> From a personal claim to a community&#x27;s credible discovery<\/p><p><b>[D]<\/b> Looking beyond an idealized picture of scientific knowledge<\/p><p><b>[E]<\/b> The pursuit of novelty and its two difficulties<\/p><p><b>[F]<\/b> A lasting question about the grounds of belief<\/p><p><b>[G]<\/b> Technological success as sufficient proof of scientific truth<\/p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. ______<\/h3><p>As a graduate student in biochemistry at Tufts University School of Medicine, I read an abridged version of Montaigne&#x27;s Essays. A friend and I spent hours walking around Boston, discussing what the essays meant. Montaigne had lived near Bordeaux in the sixteenth century, writing in a tower of his chateau among more than a thousand books. His question was simple: “What do I know?” It also invites another question: Why do we believe what we think we know?<\/p><p>That question did not remain merely a topic for those student conversations. My book, Everyday Practice of Science: Where Intuition and Passion Meet Objectivity and Logic, was a later attempt to answer it. A problem raised by an earlier thinker thus continued into an inquiry about scientific life. The starting concern was not just what scientists believe, but what gives them grounds for believing it.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. ______<\/h3><p>Scientists may answer the question about knowledge rather readily. They can point to successful technology as evidence that their work is true. But that response makes the situation seem simpler than it is. In an idealized account, facts are waiting to be observed and collected by objective researchers using the scientific method.<\/p><p>Actual discovery often takes an ambiguous and complicated route. Researchers seek objectivity, yet cannot escape their individual life histories. Prior knowledge and interests affect what they experience, how they interpret those experiences, and what they do next. There are many opportunities for mistakes, misinterpretation, and self-deception. The contrast does not require abandoning objectivity as an aim; it requires recognizing that an investigator does not begin free of these influences.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. ______<\/h3><p>For this reason, a discovery claim is better regarded as protoscience than as a finished achievement. Like a newly staked mining claim, it holds potential. Communal examination and acceptance are needed to turn that potential into a full-fledged discovery. In this credibility process, the individual&#x27;s “me, here, now” becomes the community&#x27;s “anyone, anywhere, anytime.” Objective knowledge is a goal to be reached.<\/p><p>Once the claim becomes public, its originator receives intellectual credit, but does not control everything that follows. Researchers make discoveries; editors and reviewers control access to publication; other scientists put findings to their own uses; and the public receives new knowledge and possibly new technology. Shared and competing beliefs interact and confront one another as the claim moves through this structure. Credibility develops through that social process, rather than simply remaining the private possession of the person who first made the claim.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. ______<\/h3><p>The credibility process contains two paradoxes. First, scientists usually look for what is incomplete or wrong in existing knowledge. Merely repeating and confirming familiar beliefs brings little reward. Yet the same search for something new means that even an impressive, convincing discovery remains open to later challenge, revision, or rejection.<\/p><p>Second, the novelty that makes a claim valuable can also make it difficult to believe. The physiologist and Nobel laureate Albert Szent-Györgyi described discovery as seeing what everyone has seen while thinking what no one has thought. But telling people about a possibility they have missed does not necessarily change their minds. A truly new claim may need years to be accepted and appreciated. Science therefore seeks departures from established thought while exposing accepted findings to fresh criticism and new proposals to initial resistance.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. ______<\/h3><p>In the end, credibility emerges through a process that philosopher Annette Baier called the “commons of the mind.” People reason together: they challenge, revise, and complete one another&#x27;s reasoning, as well as their ideas about reason itself. A discovery claim becomes credible within this continuing exchange.<\/p><p>The phrase also brings the discussion back to Montaigne. The answer to why we believe what we think we know is found, in the case of science, in this shared activity. The argument thus returns to its opening question with an account of mutual examination, rather than ending with the confidence of a single investigator.<\/p><\/section>","sorting":"<h2>排序题<\/h2><p>Reorganize paragraphs A–H. Paragraphs A, E and H have been correctly placed.<\/p><p>A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H<\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>[A]<\/h3><p>As a biochemistry graduate student, I read Montaigne&#x27;s Essays and spent hours discussing them with a friend as we walked around Boston. The sixteenth-century writer asked, “What do I know?” My later book, Everyday Practice of Science: Where Intuition and Passion Meet Objectivity and Logic, was another attempt to address the issue. Montaigne&#x27;s challenge extends beyond listing what we know to asking why we accept it: Why do we believe what we think we know?<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>[B]<\/h3><p>The first paradox concerns what the search for new knowledge does to findings that already appear convincing. Scientific work often challenges some part of prevailing knowledge that seems incomplete or incorrect. Little reward comes from simply duplicating and confirming what is already accepted. As a result, even an important discovery remains open to modification or refutation by later researchers. The pursuit of novelty thus keeps established findings provisional. It creates a second difficulty as well.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>[C]<\/h3><p>Scientists may answer that question readily by pointing to the success of technology as evidence for the truth of their work. This confidence fits an idealized picture: objective researchers use a scientific method to observe and collect facts waiting in the world. But the situation is more complicated. What is missing from this picture of an investigator who is already objective?<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>[D]<\/h3><p>What it leaves out is the investigator&#x27;s own history. In everyday science, discovery follows an ambiguous and complicated route, and researchers cannot escape the influence of their experiences. Prior knowledge and interests shape what they encounter, how they interpret it, and what they do next. Misinterpretation, error, and self-deception are possible at many points. A claim emerging from these circumstances has potential, but cannot yet be treated as a mature discovery.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>[E]<\/h3><p>This potential is what makes a discovery claim resemble a newly staked mining claim. It should be regarded as protoscience until communal scrutiny and acceptance turn it into a full-fledged discovery. The credibility process transforms the individual&#x27;s “me, here, now” into the community&#x27;s “anyone, anywhere, anytime.” Objective knowledge is the goal rather than the starting point. How, then, does the community carry out this transformation?<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>[F]<\/h3><p>The process begins to involve the wider community once the claim becomes public. Its maker receives intellectual credit, but the community controls what happens next. Researchers produce discoveries, editors and reviewers control publication, other scientists use the findings, and the public receives knowledge and possibly technology. As shared and competing beliefs interact and confront one another, a personal claim becomes a credible discovery. Within this process, however, the search for new knowledge creates two paradoxes.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>[G]<\/h3><p>That second difficulty is that novelty itself often provokes disbelief. Albert Szent-Györgyi described discovery as seeing what everyone has seen while thinking what nobody has thought. Yet telling others what they have missed may not alter their views. Acceptance and appreciation of a truly novel claim can take years. Credibility therefore cannot simply be declared by the discoverer; it emerges as others consider and respond to the claim.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>[H]<\/h3><p>In the end, credibility comes about in what philosopher Annette Baier called the “commons of the mind.” People reason together, challenging, revising, and completing one another&#x27;s reasoning and conceptions of reason. This shared activity is where science finds its answer to the question that began the discussion. To explain why we believe what we think we know, we must consider how minds work with, and question, one another.<\/p><\/section>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>idealized version<\/td>\n<td>名词短语：理想化的版本<\/td>\n<td>science<\/td>\n<td>n. 科学<\/td>\n<td>done<\/td>\n<td>v. 进行；完成<\/td>\n<\/tr>\n<tr>\n<td>facts<\/td>\n<td>n. 事实<\/td>\n<td>world<\/td>\n<td>n. 世界<\/td>\n<td>waiting to be<\/td>\n<td>动词短语：正等待被……<\/td>\n<\/tr>\n<tr>\n<td>observed<\/td>\n<td>v. 观察<\/td>\n<td>collected<\/td>\n<td>v. 收集<\/td>\n<td>objective researchers<\/td>\n<td>名词短语：客观的研究者<\/td>\n<\/tr>\n<tr>\n<td>use<\/td>\n<td>v. 使用<\/td>\n<td>scientific method<\/td>\n<td>名词短语：科学方法<\/td>\n<td>carry out<\/td>\n<td>动词短语：开展；执行<\/td>\n<\/tr>\n<tr>\n<td>work<\/td>\n<td>n. 工作；研究工作<\/td>\n<td>everyday practice<\/td>\n<td>名词短语：日常实践<\/td>\n<td>discovery<\/td>\n<td>n. 发现<\/td>\n<\/tr>\n<tr>\n<td>frequently<\/td>\n<td>adv. 经常<\/td>\n<td>follows<\/td>\n<td>v. 沿着；遵循 <\/td>\n<td>v. 思考；想到<\/td>\n<\/tr>\n<tr>\n<td>thinking<\/td>\n<td>v. 思考<\/td>\n<td>else<\/td>\n<td>adv. 其他；另外<\/td>\n<td>missed<\/td>\n<td>v. 忽略；未曾注意到<\/td>\n<\/tr>\n<tr>\n<td>change their views<\/td>\n<td>动词短语：改变他们的看法<\/td>\n<td>sometimes<\/td>\n<td>adv. 有时<\/td>\n<td>required<\/td>\n<td>v. 需要<\/td>\n<\/tr>\n<tr>\n<td>truly<\/td>\n<td>adv. 真正地<\/td>\n<td>appreciated<\/td>\n<td>v. 受到赏识；获得认可<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h1>第5段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>credibility<\/td>\n<td>n. 可信度<\/td>\n<td>happens to<\/td>\n<td>动词短语：发生在……身上；此处指可信度逐步形成<\/td>\n<td>discovery claim<\/td>\n<td>名词短语：发现声明<\/td>\n<\/tr>\n<tr>\n<td>process<\/td>\n<td>n. 过程<\/td>\n<td>corresponds to<\/td>\n<td>动词短语：与……相对应<\/td>\n<td>philosopher<\/td>\n<td>n. 哲学家<\/td>\n<\/tr>\n<tr>\n<td>described as<\/td>\n<td>动词短语：描述为<\/td>\n<td>the commons of the mind<\/td>\n<td>名词短语：思想的公地；共同思考的领域<\/td>\n<td>reason together<\/td>\n<td>动词短语：共同推理<\/td>\n<\/tr>\n<tr>\n<td>revise<\/td>\n<td>v. 修正<\/td>\n<td>complete<\/td>\n<td>v. 补充完善<\/td>\n<td>each other’s<\/td>\n<td>代词短语：彼此的<\/td>\n<\/tr>\n<tr>\n<td>reasoning<\/td>\n<td>n. 推理过程<\/td>\n<td>conceptions of reason<\/td>\n<td>名词短语：对理性的理解<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h1>\n<h2>第1段<\/h2>\n<h3>完整原文 · 第1段<\/h3>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method  to carry out their work. But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<h3>意群划分 · 第1段<\/h3>\n<p>In the idealized version / of how science is done, / facts about the world / are waiting to be observed and collected / by objective researchers / who use the scientific method / to carry out their work.<\/p>\n<p>But in the everyday practice of science, / discovery frequently follows / an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, / but we cannot escape / the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests / influence what we experience, / what we think our experiences mean, / and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, / error, and self-deception / abound.<\/p>\n<h3>意群翻译 · 第1段<\/h3>\n<p>在理想化的版本中 / 关于科学如何进行的，/ 关于世界的事实 / 正等待被观察和收集 / 由客观的研究者 / 使用科学方法的人 / 来执行他们的工作。<\/p>\n<p>但在科学的日常实践中，/ 发现经常遵循 / 一条模糊而复杂的路线。<\/p>\n<p>我们旨在保持客观，/ 但我们无法逃脱 / 我们独特生活经历的背景。<\/p>\n<p>先前的知识和兴趣 / 影响我们所经历的，/ 我们认为我们的经历意味着什么，/ 以及我们采取的后续行动。<\/p>\n<p>误解的机会，/ 错误和自欺 / 大量存在。<\/p>\n<h3>标准译文 · 第1段<\/h3>\n<p>在理想化的科学研究版本中，关于世界的事实等待着使用科学方法的客观研究者去观察和收集。但在科学的日常实践中，发现往往遵循着一条模糊而复杂的路线。我们力求客观，但无法摆脱自身独特生活经历的影响。先前的知识和兴趣影响着我们的经历、我们对经历的理解，以及我们随后采取的行动。误解、错误和自我欺骗的机会比比皆是。<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>Consequently, discovery claims should be thought of as protoscience. Similar to newly staked mining claims, they are full of potential. But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery. This is the credibility process, through which the individual researcher’s <em>me<\/em>, <em>here<\/em>, <em>now<\/em> becomes the community’s <em>anyone<\/em>, <em>anywhere<\/em>, <em>anytime<\/em>. Objective knowledge is the goal, not the starting point.<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>Consequently, / discovery claims should be thought of / as protoscience.<\/p>\n<p>Similar to newly staked mining claims, / they are full of potential.<\/p>\n<p>But it takes / collective scrutiny and acceptance / to transform a discovery claim / into a mature discovery.<\/p>\n<p>This is the credibility process, / through which / the individual researcher&#39;s <em>me<\/em>, <em>here<\/em>, <em>now<\/em> / becomes the community&#39;s / <em>anyone<\/em>, <em>anywhere<\/em>, <em>anytime<\/em>.<\/p>\n<p>Objective knowledge is the goal, / not the starting point.<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>因此，/ 发现声明应该被认为是 / 原始科学。<\/p>\n<p>类似于新设立的采矿权，/ 它们充满潜力。<\/p>\n<p>但需要 / 集体审查和接受 / 来转变一个发现声明 / 成为一个成熟的发现。<\/p>\n<p>这就是可信度过程，/ 通过它 / 个体研究者的&quot;我&quot;、&quot;这里&quot;、&quot;现在&quot; / 变成了社区的 / &quot;任何人&quot;、&quot;任何地方&quot;、&quot;任何时间&quot;。<\/p>\n<p>客观知识是目标，/ 而非起点。<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>因此，发现声明应被视为原始科学。就像新设立的采矿权一样，它们充满潜力。但要将一个发现声明转变为成熟的发现，需要集体的审查和接受。这就是可信度过程，通过这个过程，个体研究者的&quot;我、这里、现在&quot;变成了科学共同体的&quot;任何人、任何地方、任何时间&quot;。客观知识是目标，而非起点。<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit. But, unlike with mining claims, the community takes control of what happens next. Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology. As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>Once a discovery claim becomes public, / the discoverer receives / intellectual credit.<\/p>\n<p>But, unlike with mining claims, / the community takes control / of what happens next.<\/p>\n<p>Within the complex social structure / of the scientific community, / researchers make discoveries; / editors and reviewers act as gatekeepers / by controlling the publication process; / other scientists use the new finding / to suit their own purposes; / and finally, / the public (including other scientists) / receives the new discovery / and possibly accompanying technology.<\/p>\n<p>As a discovery claim / works its way through the community, / the interaction and confrontation / between shared and competing beliefs / about the science and the technology involved / transforms an individual&#39;s discovery claim / into the community&#39;s credible discovery.<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>一旦发现声明变成公开的，/ 发现者获得 / 智力信用。<\/p>\n<p>但是，不同于采矿权，/ 社区掌控 / 接下来发生的事情。<\/p>\n<p>在复杂的社会结构中 / 科学共同体的，/ 研究者做出发现；/ 编辑和审稿人充当守门人 / 通过控制出版过程；/ 其他科学家使用新发现 / 来适应他们自己的目的；/ 最后，/ 公众（包括其他科学家）/ 接收新发现 / 以及可能伴随的技术。<\/p>\n<p>当一个发现声明 / 在社区中传播时，/ 互动和对抗 / 在共享和竞争的信念之间 / 关于涉及的科学和技术 / 转变个人的发现声明 / 成为社区的可信发现。<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>一旦发现声明公开，发现者就会获得智力上的认可。但与采矿权不同，科学共同体掌控着接下来的进程。在科学共同体的复杂社会结构中，研究者做出发现；编辑和审稿人通过控制出版过程充当守门人；其他科学家利用新发现来服务自己的目的；最后，公众（包括其他科学家）接受新发现及可能伴随的技术。当发现声明在共同体中传播时，关于所涉及科学和技术的共享信念与竞争信念之间的互动和对抗，将个人的发现声明转变为共同体的可信发现。<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>Two paradoxes exist throughout this credibility process. First, scientific work tends to focus on some aspect of prevailing knowledge that is viewed as incomplete  or incorrect. Little reward accompanies duplication and confirmation of what is already known and believed. The goal is <em>new-search<\/em>, not <em>re-search<\/em>. Not surprisingly, newly published discovery claims and credible discoveries that appear to be  important and convincing will always be open to challenge and potential modification or refutation by future researchers. Second, novelty itself frequently provokes disbelief. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they  have missed may not change their views. Sometimes years are required for  truly novel discovery claims to be accepted and appreciated.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>Two paradoxes exist / throughout this credibility process.<\/p>\n<p>First, / scientific work tends to focus on / some aspect of prevailing knowledge / that is viewed as / incomplete or incorrect.<\/p>\n<p>Little reward accompanies / duplication and confirmation / of what is already known and believed.<\/p>\n<p>The goal is <em>new-search<\/em>, / not <em>re-search<\/em>.<\/p>\n<p>Not surprisingly, / newly published discovery claims / and credible discoveries / that appear to be important and convincing / will always be open to / challenge and potential modification or refutation / by future researchers.<\/p>\n<p>Second, / novelty itself / frequently provokes disbelief.<\/p>\n<p>Nobel Laureate and physiologist / Albert Szent-Györgyi / once described discovery as / &quot;seeing what everybody has seen / and thinking what nobody has thought.&quot;<\/p>\n<p>But thinking what nobody else has thought / and telling others / what they have missed / may not change their views.<\/p>\n<p>Sometimes years are required / for truly novel discovery claims / to be accepted and appreciated.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>两个悖论存在 / 贯穿这个可信度过程。<\/p>\n<p>首先，/ 科学工作倾向于关注 / 主流知识的某些方面 / 被视为 / 不完整或不正确的。<\/p>\n<p>很少的奖励伴随着 / 复制和确认 / 已知和已信的东西。<\/p>\n<p>目标是&quot;新搜索&quot;，/ 而非&quot;重新搜索&quot;。<\/p>\n<p>不出所料，/ 新发表的发现声明 / 和可信的发现 / 看起来重要且令人信服的 / 将始终开放于 / 挑战和潜在的修改或反驳 / 由未来的研究者。<\/p>\n<p>第二，/ 新颖性本身 / 经常引发怀疑。<\/p>\n<p>诺贝尔奖获得者和生理学家 / 阿尔伯特·圣捷尔吉 / 曾经描述发现为 / &quot;看到每个人都看到的 / 并思考没有人想过的。&quot;<\/p>\n<p>但思考别人没有想过的 / 并告诉他人 / 他们错过了什么 / 可能不会改变他们的观点。<\/p>\n<p>有时需要数年 / 对于真正新颖的发现声明 / 被接受和欣赏。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>在整个可信度过程中存在两个悖论。首先，科学工作倾向于关注被视为不完整或不正确的主流知识的某些方面。复制和确认已知已信的内容很少得到奖励。目标是&quot;新搜索&quot;，而非&quot;重新搜索&quot;。不出所料，新发表的发现声明和看起来重要且令人信服的可信发现，总是会面临未来研究者的挑战、潜在修改或反驳。第二，新颖性本身经常引发怀疑。诺贝尔奖获得者、生理学家阿尔伯特·圣捷尔吉曾将发现描述为&quot;看到每个人都看到的，思考没有人想过的&quot;。但思考别人没想过的，并告诉他人他们错过了什么，可能不会改变他们的观点。真正新颖的发现声明有时需要数年才能被接受和欣赏。<\/p>\n<h2>第5段<\/h2>\n<h3>完整原文 · 第5段<\/h3>\n<p>In the end, credibility “happens” to a discovery claim – a process that corresponds to what philosopher Annette Baier has described as the <em>commons of the mind<\/em>. “We reason together, challenge, revise, and complete each other’s reasoning  and each other’s conceptions of reason.”<\/p>\n<h3>意群划分 · 第5段<\/h3>\n<p>In the end, / credibility &quot;happens&quot; to / a discovery claim -- / a process that corresponds to / what philosopher Annette Baier / has described as / the <em>commons of the mind<\/em>.<\/p>\n<p>&quot;We reason together, / challenge, / revise, / and complete / each other&#39;s reasoning / and each other&#39;s conceptions of reason.&quot;<\/p>\n<h3>意群翻译 · 第5段<\/h3>\n<p>最终，/ 可信度&quot;发生在&quot; / 一个发现声明上 -- / 一个过程对应于 / 哲学家安妮特·拜尔 / 所描述的 / &quot;思想的公地&quot;。<\/p>\n<p>&quot;我们一起推理，/ 挑战，/ 修正，/ 并完善 / 彼此的推理 / 和彼此的理性概念。&quot;<\/p>\n<h3>标准译文 · 第5段<\/h3>\n<p>最终，可信度是&quot;发生在&quot;发现声明上的——这个过程对应于哲学家安妮特·拜尔所说的&quot;思想的公地&quot;。&quot;我们一起推理，挑战、修正并完善彼此的推理和彼此的理性概念。&quot;<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>In the idealized version：(of how science is done) → facts about the world → are waiting to be observed and collected：(by objective researchers：(who use the scientific method：(to carry out their work))).<\/p>\n<p>But in the everyday practice of science // discovery frequently follows → an ambiguous and complicated route.<\/p>\n<p>We aim to be objective // but we cannot escape → the context：(of our unique life experiences).<\/p>\n<p>Prior knowledge and interests → influence：(what we experience) + (what we think our experiences mean) + (the subsequent actions we take).<\/p>\n<p>Opportunities：(for misinterpretation + error + self-deception) → abound.<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>Consequently → discovery claims should be thought of → as protoscience.<\/p>\n<p>Similar to newly staked mining claims → they are full of potential.<\/p>\n<p>But it takes → collective scrutiny and acceptance → to transform a discovery claim → into a mature discovery.<\/p>\n<p>This is the credibility process：(through which → the individual researcher&#39;s <em>me<\/em>, <em>here<\/em>, <em>now<\/em> → becomes → the community&#39;s <em>anyone<\/em>, <em>anywhere<\/em>, <em>anytime<\/em>).<\/p>\n<p>Objective knowledge is the goal // not the starting point.<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>Once a discovery claim becomes public → the discoverer receives → intellectual credit.<\/p>\n<p>But, unlike with mining claims // the community takes control → of what happens next.<\/p>\n<p>Within the complex social structure：(of the scientific community) → researchers make discoveries + editors and reviewers act as gatekeepers：(by controlling the publication process) + other scientists use the new finding：(to suit their own purposes) + finally → the public (including other scientists) → receives the new discovery + possibly accompanying technology.<\/p>\n<p>As a discovery claim → works its way through the community → the interaction and confrontation：(between shared and competing beliefs：(about the science and the technology involved)) → transforms an individual&#39;s discovery claim → into the community&#39;s credible discovery.<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>Two paradoxes exist → throughout this credibility process.<\/p>\n<p>First → scientific work tends to focus on → some aspect of prevailing knowledge：(that is viewed as → incomplete or incorrect).<\/p>\n<p>Little reward accompanies → duplication and confirmation：(of what is already known and believed).<\/p>\n<p>The goal is <em>new-search<\/em> // not <em>re-search<\/em>.<\/p>\n<p>Not surprisingly → newly published discovery claims + credible discoveries：(that appear to be important and convincing) → will always be open to → challenge and potential modification or refutation：(by future researchers).<\/p>\n<p>Second → novelty itself → frequently provokes disbelief.<\/p>\n<p>Nobel Laureate and physiologist Albert Szent-Györgyi → once described discovery as：(&quot;seeing what everybody has seen + thinking what nobody has thought&quot;).<\/p>\n<p>But thinking what nobody else has thought + telling others：(what they have missed) → may not change their views.<\/p>\n<p>Sometimes years are required → for truly novel discovery claims → to be accepted and appreciated.<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>In the end → credibility &quot;happens&quot; to → a discovery claim -- a process：(that corresponds to → what philosopher Annette Baier → has described as → the <em>commons of the mind<\/em>).<\/p>\n<p>&quot;We reason together + challenge + revise + complete → each other&#39;s reasoning + each other&#39;s conceptions of reason.&quot;<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>在理想化的版本中：(关于科学如何进行的) → 关于世界的事实 → 正等待被观察和收集：(由客观的研究者：(使用科学方法的人：(来执行他们的工作)))。<\/p>\n<p>但在科学的日常实践中 // 发现经常遵循 → 一条模糊而复杂的路线。<\/p>\n<p>我们旨在保持客观 // 但我们无法逃脱 → 背景：(我们独特生活经历的)。<\/p>\n<p>先前的知识和兴趣 → 影响：(我们所经历的) + (我们认为我们的经历意味着什么) + (我们采取的后续行动)。<\/p>\n<p>机会：(误解的 + 错误的 + 自欺的) → 大量存在。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>因此 → 发现声明应该被认为是 → 原始科学。<\/p>\n<p>类似于新设立的采矿权 → 它们充满潜力。<\/p>\n<p>但需要 → 集体审查和接受 → 来转变一个发现声明 → 成为一个成熟的发现。<\/p>\n<p>这就是可信度过程：(通过它 → 个体研究者的&quot;我&quot;、&quot;这里&quot;、&quot;现在&quot; → 变成了 → 社区的&quot;任何人&quot;、&quot;任何地方&quot;、&quot;任何时间&quot;)。<\/p>\n<p>客观知识是目标 // 而非起点。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>一旦发现声明变成公开的 → 发现者获得 → 智力信用。<\/p>\n<p>但是，不同于采矿权 // 社区掌控 → 接下来发生的事情。<\/p>\n<p>在复杂的社会结构中：(科学共同体的) → 研究者做出发现 + 编辑和审稿人充当守门人：(通过控制出版过程) + 其他科学家使用新发现：(来适应他们自己的目的) + 最后 → 公众（包括其他科学家）→ 接收新发现 + 可能伴随的技术。<\/p>\n<p>当一个发现声明 → 在社区中传播时 → 互动和对抗：(在共享和竞争的信念之间：(关于涉及的科学和技术)) → 转变个人的发现声明 → 成为社区的可信发现。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>两个悖论存在 → 贯穿这个可信度过程。<\/p>\n<p>首先 → 科学工作倾向于关注 → 主流知识的某些方面：(被视为 → 不完整或不正确的)。<\/p>\n<p>很少的奖励伴随着 → 复制和确认：(已知和已信的东西)。<\/p>\n<p>目标是&quot;新搜索&quot; // 而非&quot;重新搜索&quot;。<\/p>\n<p>不出所料 → 新发表的发现声明 + 可信的发现：(看起来重要且令人信服的) → 将始终开放于 → 挑战和潜在的修改或反驳：(由未来的研究者)。<\/p>\n<p>第二 → 新颖性本身 → 经常引发怀疑。<\/p>\n<p>诺贝尔奖获得者和生理学家阿尔伯特·圣捷尔吉 → 曾经描述发现为：(&quot;看到每个人都看到的 + 思考没有人想过的&quot;)。<\/p>\n<p>但思考别人没有想过的 + 告诉他人：(他们错过了什么) → 可能不会改变他们的观点。<\/p>\n<p>有时需要数年 → 对于真正新颖的发现声明 → 被接受和欣赏。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>最终 → 可信度&quot;发生在&quot; → 一个发现声明上 -- 一个过程：(对应于 → 哲学家安妮特·拜尔 → 所描述的 → &quot;思想的公地&quot;)。<\/p>\n<p>&quot;我们一起推理 + 挑战 + 修正 + 完善 → 彼此的推理 + 彼此的理性概念。&quot;<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h3>1. 第1段第1句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method  to carry out their work.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>In the idealized version / of how science is done, / facts about the world / are waiting to be observed and collected / by objective researchers / who use the scientific method / to carry out their work.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>在理想化的版本中 / 关于科学如何进行的，/ 关于世界的事实 / 正等待被观察和收集 / 由客观的研究者 / 使用科学方法的人 / 来执行他们的工作。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“关于科学如何进行的”接到“理想化的版本”前，说明这里想象的是怎样的科学研究：<\/p>\n<blockquote>\n<p>在关于科学如何进行的理想化版本中<\/p>\n<\/blockquote>\n<p>再把研究者的特点和工作方式接在一起：<\/p>\n<blockquote>\n<p>使用科学方法来执行研究工作的客观研究者<\/p>\n<\/blockquote>\n<p>最后把做事的人接到“观察和收集”前：<\/p>\n<blockquote>\n<p>由这些客观研究者观察和收集关于世界的事实<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>在关于科学如何进行的理想化版本中\n关于世界的事实等待着被观察和收集\n做这件事的是使用科学方法来执行研究工作的客观研究者<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>关于世界的事实等待着研究者去观察和收集。<\/p>\n<\/blockquote>\n<p>先在句首交代“在关于科学如何进行的理想化版本中”，把这个说法的适用范围说明白。再让“关于世界的事实”作开头，“等待着”连接后面的事情。把“使用科学方法来执行研究工作的”放在“客观研究者”前，研究者之后紧跟“观察和收集”，让谁做什么一口气连起来。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>在关于科学如何进行的理想化版本中，关于世界的事实等待着由使用科学方法来执行研究工作的客观研究者观察和收集。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“关于科学如何进行的理想化版本”层层嵌套，整理为“理想化的科学研究版本”，先交代研究，再保留它是理想化图景的限制。<\/li>\n<li>“使用科学方法来执行研究工作”中的工作已经由“科学研究”交代，收成“使用科学方法”；“等待着由研究者观察和收集”改成“等待着研究者去观察和收集”，中文更顺畅。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>在理想化的科学研究版本中，关于世界的事实等待着使用科学方法的客观研究者去观察和收集。<\/p>\n<\/blockquote>\n<h3>2. 第2段第4句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>This is the credibility process, through which the individual researcher’s <em>me<\/em>, <em>here<\/em>, <em>now<\/em> becomes the community’s <em>anyone<\/em>, <em>anywhere<\/em>, <em>anytime<\/em>.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>This is the credibility process, / through which / the individual researcher&#39;s <em>me<\/em>, <em>here<\/em>, <em>now<\/em> / becomes the community&#39;s / <em>anyone<\/em>, <em>anywhere<\/em>, <em>anytime<\/em>.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>这就是可信度过程，/ 通过它 / 个体研究者的&quot;我&quot;、&quot;这里&quot;、&quot;现在&quot; / 变成了社区的 / &quot;任何人&quot;、&quot;任何地方&quot;、&quot;任何时间&quot;。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把三个词与它们所属的一方合在一起：<\/p>\n<blockquote>\n<p>个体研究者的“我、这里、现在”<\/p>\n<\/blockquote>\n<p>另一组同样合并，保留从个人向共同体扩展的对应关系：<\/p>\n<blockquote>\n<p>社区的“任何人、任何地方、任何时间”<\/p>\n<\/blockquote>\n<p>“通过它”指的就是前面刚说的过程，先把指向说清楚：<\/p>\n<blockquote>\n<p>通过这个可信度过程<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>这就是可信度过程\n通过这个过程\n个体研究者的“我、这里、现在”变成社区的“任何人、任何地方、任何时间”<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>个体研究者的认识变成共同体的认识。<\/p>\n<\/blockquote>\n<p>先保留“这就是可信度过程”，承接前面集体审查和接受的说明。接着把“通过这个过程”放在变化发生之前，再按“谁的什么变成谁的什么”排列两组词。“
