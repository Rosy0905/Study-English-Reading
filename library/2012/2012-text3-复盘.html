<em>commons of the mind<\/em>.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>最终，/ 可信度&quot;发生在&quot; / 一个发现声明上 -- / 一个过程对应于 / 哲学家安妮特·拜尔 / 所描述的 / &quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把“发生在”和它针对的对象连起来，保留原文特意加上的引号：<\/p>\n<blockquote>\n<p>可信度“发生在”一个发现声明上<\/p>\n<\/blockquote>\n<p>再把人物、说法和这个说法的名称合并起来：<\/p>\n<blockquote>\n<p>哲学家安妮特·拜尔所描述的“思想的公地”<\/p>\n<\/blockquote>\n<p>破折号后的“一个过程”是在接着解释前面的事情，先把它指回去：<\/p>\n<blockquote>\n<p>这个过程对应于“思想的公地”<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>最终，可信度“发生在”一个发现声明上\n这个过程对应于哲学家安妮特·拜尔所描述的“思想的公地”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>可信度的形成过程对应于“思想的公地”。<\/p>\n<\/blockquote>\n<p>先放时间收束语“最终”，再交代可信度发生在发现声明上。破折号后用“这个过程”接回前半句的形成过程，随后放“对应于”。把哲学家的姓名和“所描述的”一起放在“思想的公地”前，说明这一名称来自谁，不把哲学家本人写成过程对应的对象。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>最终，可信度&quot;发生在&quot;一个发现声明上——这个过程对应于哲学家安妮特·拜尔所描述的&quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“发生在一个发现声明上”整理为“是‘发生在’发现声明上的”，保留原文对“发生在”的特别强调，并省去不必逐字译出的“一个”。<\/li>\n<li>“所描述的”收成“所说的”，使引用名称的表达更自然；“思想的公地”保留，等待下一句解释共同推理、挑战和完善的含义。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>最终，可信度是&quot;发生在&quot;发现声明上的——这个过程对应于哲学家安妮特·拜尔所说的&quot;思想的公地&quot;。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1732,"sourceH":2566},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n**Which of the following would be the best title of the text?**\n\n下面哪个标题最适合这篇文章？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Novelty as an Engine of Scientific Development**\n\n新颖性：科学发展的引擎\n\nB. **Collective Scrutiny in Scientific Discovery**\n\n科学发现中的集体审查\n\nC. **Evolution of Credibility in Doing Science**\n\n科学实践中可信度的形成\n\nD. **Challenge to Credibility at the Gate to Science**\n\n科学门口对可信度的挑战\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写理想中的科学发现应当客观整齐，再指出现实发现会受经历、知识和兴趣影响，路径复杂且容易出错 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 把刚出现的发现主张称为原始阶段，说明它必须经过集体审视和接受，才能变成成熟、客观的知识 | 再说一个东西还只是半成品 |\n| 3 | 展开共同体中的多方角色：研究者、编辑审稿人、其他科学家和公众共同参与，把个人主张变成共同体的可信发现 | 接着说它要经过很多人才能成形 |\n| 4 | 补出可信度形成中的两个悖论：新主张会不断受挑战，而真正新颖的想法又常先遭到怀疑 | 再说中间还有两处矛盾 |\n| 5 | 用“共同推理、质疑、修订和补全”收束，强调可信度是在共同思考中逐渐发生的 | 最后下结论：大家一起把它做完 |\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[18,2141,1292,407],"sourceW":1732,"sourceH":2566},"meta":{"kind":"question","question":35},"level":2,"html":"<p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>下面哪个标题最适合这篇文章？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Novelty as an Engine of Scientific Development<\/strong><\/p>\n<p>新颖性：科学发展的引擎<\/p>\n<p>B. <strong>Collective Scrutiny in Scientific Discovery<\/strong><\/p>\n<p>科学发现中的集体审查<\/p>\n<p>C. <strong>Evolution of Credibility in Doing Science<\/strong><\/p>\n<p>科学实践中可信度的形成<\/p>\n<p>D. <strong>Challenge to Credibility at the Gate to Science<\/strong><\/p>\n<p>科学门口对可信度的挑战<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中的科学发现应当客观整齐，再指出现实发现会受经历、知识和兴趣影响，路径复杂且容易出错<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>把刚出现的发现主张称为原始阶段，说明它必须经过集体审视和接受，才能变成成熟、客观的知识<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开共同体中的多方角色：研究者、编辑审稿人、其他科学家和公众共同参与，把个人主张变成共同体的可信发现<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>补出可信度形成中的两个悖论：新主张会不断受挑战，而真正新颖的想法又常先遭到怀疑<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>用“共同推理、质疑、修订和补全”收束，强调可信度是在共同思考中逐渐发生的<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n"},{"title":"A. Novelty as an Engine of Scientific Development","raw":"**Which of the following would be the best title of the text?**\n\n### A. Novelty as an Engine of Scientific Development\n\n新颖性：科学发展的引擎","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 A选项","focus":[93,2226,1065,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":35,"option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q35-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>新颖性：科学发展的引擎<\/p>\n<\/section>"},{"title":"A. Novelty as an Engine of Scientific Development","raw":"#### 如果 A 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n新颖性：科学发展的引擎\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先提出只要不断积累和确认已有知识，科学就会持续前进的理想图景，再指出这种积累无法自行突破旧解释的局限，引出新颖认识在推动科学发展中的作用 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 说明一个打破旧想法的新构想刚出现时还只是待发展、待检验的初步方案，尚需把它提供的新方向做成能推动科学前进的成果 | 再说一个东西还只是半成品 |\n| 3 | 展开提出者完善新构想、同行检验并发展新解释、其他研究者把新方法用于后续问题的共同工作，说明新颖性怎样经多人参与转化为科学发展的实际动力 | 接着说它要经过很多人才能成形 |\n| 4 | 说明新颖性推动科学发展时的两处矛盾：科学通过新认识突破既有解释，而新认识成熟后也会成为下一轮创新需要突破的对象；有突破价值的新想法又会因不同于熟悉的解释而先受到怀疑 | 再说中间还有两处矛盾 |\n| 5 | 收束到共同推进创新：研究者通过提出、检验、修正和运用新想法，一起把初步的新颖构想做成推动科学发展的成果，从而发挥新颖性的引擎作用 | 最后下结论：大家一起把它做完 |\n\nA把新颖性看成科学发展的推动力量。这个标题不等于“想法越新就一定越正确”，也没有声称“创新越多，发展就越快”。如果全文围绕它展开，作者完全可以写新想法需要检验、受到怀疑、经过合作才产生进展；判断时要看这些内容最终是在说明新颖性怎样推动科学发展，还是在回答另一件事。\n\n实际第1段从理想中的客观发现转到受经历和兴趣影响的现实发现，第2段随即用`Consequently`引出尚未成熟的发现主张，并明确说`Objective knowledge is the goal, not the starting point.`。这一推进追问的是初步主张如何变成客观知识，没有转向新想法怎样推动研究领域向前发展。\n\n第3段进一步把个人主张转成共同体的可信发现，第4段才在`this credibility process`之下讨论两个悖论。新颖性受到重视、又会引发怀疑，都是作者解释可信度形成为何曲折的内容。结尾仍落在可信度通过共同推理逐步形成，而没有把这些段落收束为新颖性带来的科学进展。A抓住了第四段的重要内容，却把服务于可信度过程的一项因素换成了全文中心。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 A选项","focus":[93,2226,1065,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":35,"option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q35-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>新颖性：科学发展的引擎<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-A-1\"><h3>如果 A 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>新颖性：科学发展的引擎<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先提出只要不断积累和确认已有知识，科学就会持续前进的理想图景，再指出这种积累无法自行突破旧解释的局限，引出新颖认识在推动科学发展中的作用<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>说明一个打破旧想法的新构想刚出现时还只是待发展、待检验的初步方案，尚需把它提供的新方向做成能推动科学前进的成果<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开提出者完善新构想、同行检验并发展新解释、其他研究者把新方法用于后续问题的共同工作，说明新颖性怎样经多人参与转化为科学发展的实际动力<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明新颖性推动科学发展时的两处矛盾：科学通过新认识突破既有解释，而新认识成熟后也会成为下一轮创新需要突破的对象；有突破价值的新想法又会因不同于熟悉的解释而先受到怀疑<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>收束到共同推进创新：研究者通过提出、检验、修正和运用新想法，一起把初步的新颖构想做成推动科学发展的成果，从而发挥新颖性的引擎作用<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A把新颖性看成科学发展的推动力量。这个标题不等于“想法越新就一定越正确”，也没有声称“创新越多，发展就越快”。如果全文围绕它展开，作者完全可以写新想法需要检验、受到怀疑、经过合作才产生进展；判断时要看这些内容最终是在说明新颖性怎样推动科学发展，还是在回答另一件事。<\/p>\n<p>实际第1段从理想中的客观发现转到受经历和兴趣影响的现实发现，第2段随即用<code>Consequently<\/code>引出尚未成熟的发现主张，并明确说<code>Objective knowledge is the goal, not the starting point.<\/code>。这一推进追问的是初步主张如何变成客观知识，没有转向新想法怎样推动研究领域向前发展。<\/p>\n<p>第3段进一步把个人主张转成共同体的可信发现，第4段才在<code>this credibility process<\/code>之下讨论两个悖论。新颖性受到重视、又会引发怀疑，都是作者解释可信度形成为何曲折的内容。结尾仍落在可信度通过共同推理逐步形成，而没有把这些段落收束为新颖性带来的科学进展。A抓住了第四段的重要内容，却把服务于可信度过程的一项因素换成了全文中心。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<\/section>"},{"title":"B. Collective Scrutiny in Scientific Discovery","raw":"**Which of the following would be the best title of the text?**\n\n### B. Collective Scrutiny in Scientific Discovery\n\n科学发现中的集体审查","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 B选项","focus":[93,2311,946,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":35,"option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q35-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>科学发现中的集体审查<\/p>\n<\/section>"},{"title":"B. Collective Scrutiny in Scientific Discovery","raw":"#### 如果 B 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n科学发现中的集体审查\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写理想中研究者独自依照科学方法检查事实就能排除判断偏差，再指出个人检查仍受经验和兴趣限制，提出科学发现需要多人共同审查 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 说明个人提交的发现及其自我检验还只是等待共同核查的初稿，证据和解释中尚未解决的问题需要进入集体审查后进一步查明 | 再说一个东西还只是半成品 |\n| 3 | 展开提出者回应疑问、编辑审稿人检查论证、同行复核和补充证据的分工，把科学发现的集体审查写成多方相互质询并完善核查结果的过程 | 接着说它要经过很多人才能成形 |\n| 4 | 说明集体审查中的两处矛盾：共同体需要依靠共同认可的知识作出审查判断，却又要审查会修正这些知识的新发现；审查者要识别新贡献，却容易因为贡献超出熟悉框架而先不相信它 | 再说中间还有两处矛盾 |\n| 5 | 总结提出者与其他研究者怎样一起检查、质疑和修订论证，共同补全对科学发现的审查，突出集体审查在判断发现是否成立中的作用 | 最后下结论：大家一起把它做完 |\n\nB提出的是科学发现中的集体审查，重点在多人怎样检查证据、质询论证和共同判断。这不是无关信息：第2段确实写了`collective scrutiny and acceptance`，第3段有编辑和审稿人，第5段也有共同质疑和修订。因此，不能把B说成全文只提到了一次的零碎细节。\n\n但实际第1段的问题是发现为什么起初会受个人条件限制；第2段接着明确区分原始阶段与成熟发现，并用“个人的我、这里、现在”变成“共同体的任何人、任何地方、任何时间”说明变化的方向。集体审查在这里解释主张怎样变化，作者要追踪的对象是逐步形成的可信度。\n\n第3段也没有只罗列核查步骤：发表之后，其他科学家使用新发现，公众接收它，不同信念之间发生互动和对抗，最后个人主张转为共同体的可信发现。第4段把已显得可信的发现仍可受挑战、真正新颖的发现迟迟不获相信并列为这一形成过程的悖论；结尾直接回到`credibility “happens”`。B抓住了贯穿过程的重要方法，却没有像C一样把起点、转化方向、过程中出现的矛盾和最终形成的结果都纳入标题的中心。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 B选项","focus":[93,2311,946,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":35,"option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q35-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>科学发现中的集体审查<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-B-1\"><h3>如果 B 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>科学发现中的集体审查<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中研究者独自依照科学方法检查事实就能排除判断偏差，再指出个人检查仍受经验和兴趣限制，提出科学发现需要多人共同审查<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>说明个人提交的发现及其自我检验还只是等待共同核查的初稿，证据和解释中尚未解决的问题需要进入集体审查后进一步查明<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开提出者回应疑问、编辑审稿人检查论证、同行复核和补充证据的分工，把科学发现的集体审查写成多方相互质询并完善核查结果的过程<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明集体审查中的两处矛盾：共同体需要依靠共同认可的知识作出审查判断，却又要审查会修正这些知识的新发现；审查者要识别新贡献，却容易因为贡献超出熟悉框架而先不相信它<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>总结提出者与其他研究者怎样一起检查、质疑和修订论证，共同补全对科学发现的审查，突出集体审查在判断发现是否成立中的作用<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>B提出的是科学发现中的集体审查，重点在多人怎样检查证据、质询论证和共同判断。这不是无关信息：第2段确实写了<code>collective scrutiny and acceptance<\/code>，第3段有编辑和审稿人，第5段也有共同质疑和修订。因此，不能把B说成全文只提到了一次的零碎细节。<\/p>\n<p>但实际第1段的问题是发现为什么起初会受个人条件限制；第2段接着明确区分原始阶段与成熟发现，并用“个人的我、这里、现在”变成“共同体的任何人、任何地方、任何时间”说明变化的方向。集体审查在这里解释主张怎样变化，作者要追踪的对象是逐步形成的可信度。<\/p>\n<p>第3段也没有只罗列核查步骤：发表之后，其他科学家使用新发现，公众接收它，不同信念之间发生互动和对抗，最后个人主张转为共同体的可信发现。第4段把已显得可信的发现仍可受挑战、真正新颖的发现迟迟不获相信并列为这一形成过程的悖论；结尾直接回到<code>credibility “happens”<\/code>。B抓住了贯穿过程的重要方法，却没有像C一样把起点、转化方向、过程中出现的矛盾和最终形成的结果都纳入标题的中心。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<\/section>"},{"title":"C. Evolution of Credibility in Doing Science","raw":"**Which of the following would be the best title of the text?**\n\n### C. Evolution of Credibility in Doing Science\n\n科学实践中可信度的形成","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 C选项","focus":[94,2395,927,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":35,"option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q35-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>科学实践中可信度的形成<\/p>\n<\/section>"},{"title":"C. Evolution of Credibility in Doing Science","raw":"#### 如果 C 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n科学实践中可信度的形成\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写理想中的科学发现仿佛从客观研究者观察事实开始就拥有可靠基础，再以个人经历、知识和兴趣对实际发现的影响拆解这一图景，提出可信度需要在科学实践中逐步形成 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 把个人刚提出的发现写成有潜力但尚未成熟的主张，说明它还要经过共同审视与接受才能获得共同体认可的可信度，客观知识是待达到的目标 | 再说一个东西还只是半成品 |\n| 3 | 依次展开主张公开后研究者、编辑审稿人、其他科学家和公众的参与，说明个人主张如何在不同认识的互动中逐步转为共同体的可信发现 | 接着说它要经过很多人才能成形 |\n| 4 | 说明可信度形成中的两处矛盾：科学不断追求新认识，已经显得可信的新发现仍会被后来的研究挑战和修改；真正新颖的主张又常因其新颖性先遭怀疑，需要时间获得认可 | 再说中间还有两处矛盾 |\n| 5 | 以共同推理、质疑、修订和补全收束全过程，说明大家一起完善发现主张和判断依据，可信度正是在这种共同科学实践中逐步形成的 | 最后下结论：大家一起把它做完 |\n\nC的完整意思是可信度在科学实践中逐步形成。`Evolution`在这个标题里指一个发展、转化的过程，不能读成个人一旦宣布发现，可信度就已完成，也不意味着获得可信度以后永远不会再被修改。\n\n第1段先说明现实中的发现受个人经历、知识和兴趣影响，误解、错误与自欺都有发生的空间，所以可信度不能作为未经处理的起点。第2段把发现主张称为`protoscience`，再写它通过集体审视与接受变成成熟发现，并直接把这段变化命名为`the credibility process`。\n\n第3段展开这一过程：主张公开后进入共同体，经过编辑审稿人、其他科学家和公众等参与者，个人主张在互动与对抗中转为共同体的可信发现。第4段继续用`this credibility process`承接，解释其中的两个悖论：追求新认识也意味着既有发现持续接受挑战；新颖性又常使新主张先遭怀疑。\n\n第5段以`In the end`回到可信度的形成，用共同推理、质疑、修订和补全概括大家怎样一起完成它。C既能解释开头为什么要拆解理想图景，也能统摄中间的社会过程和矛盾，最后与结尾落在同一个判断上。\n\n判断：\n\n**C 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 C选项","focus":[94,2395,927,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":35,"option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q35-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>科学实践中可信度的形成<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-C-1\"><h3>如果 C 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>科学实践中可信度的形成<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中的科学发现仿佛从客观研究者观察事实开始就拥有可靠基础，再以个人经历、知识和兴趣对实际发现的影响拆解这一图景，提出可信度需要在科学实践中逐步形成<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>把个人刚提出的发现写成有潜力但尚未成熟的主张，说明它还要经过共同审视与接受才能获得共同体认可的可信度，客观知识是待达到的目标<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>依次展开主张公开后研究者、编辑审稿人、其他科学家和公众的参与，说明个人主张如何在不同认识的互动中逐步转为共同体的可信发现<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明可信度形成中的两处矛盾：科学不断追求新认识，已经显得可信的新发现仍会被后来的研究挑战和修改；真正新颖的主张又常因其新颖性先遭怀疑，需要时间获得认可<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>以共同推理、质疑、修订和补全收束全过程，说明大家一起完善发现主张和判断依据，可信度正是在这种共同科学实践中逐步形成的<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>C的完整意思是可信度在科学实践中逐步形成。<code>Evolution<\/code>在这个标题里指一个发展、转化的过程，不能读成个人一旦宣布发现，可信度就已完成，也不意味着获得可信度以后永远不会再被修改。<\/p>\n<p>第1段先说明现实中的发现受个人经历、知识和兴趣影响，误解、错误与自欺都有发生的空间，所以可信度不能作为未经处理的起点。第2段把发现主张称为<code>protoscience<\/code>，再写它通过集体审视与接受变成成熟发现，并直接把这段变化命名为<code>the credibility process<\/code>。<\/p>\n<p>第3段展开这一过程：主张公开后进入共同体，经过编辑审稿人、其他科学家和公众等参与者，个人主张在互动与对抗中转为共同体的可信发现。第4段继续用<code>this credibility process<\/code>承接，解释其中的两个悖论：追求新认识也意味着既有发现持续接受挑战；新颖性又常使新主张先遭怀疑。<\/p>\n<p>第5段以<code>In the end<\/code>回到可信度的形成，用共同推理、质疑、修订和补全概括大家怎样一起完成它。C既能解释开头为什么要拆解理想图景，也能统摄中间的社会过程和矛盾，最后与结尾落在同一个判断上。<\/p>\n<p>判断：<\/p>\n<p><strong>C 保留。<\/strong><\/p>\n<\/section>"},{"title":"D. Challenge to Credibility at the Gate to Science","raw":"**Which of the following would be the best title of the text?**\n\n### D. Challenge to Credibility at the Gate to Science\n\n科学门口对可信度的挑战","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 D选项","focus":[93,2480,991,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":35,"option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q35-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>科学门口对可信度的挑战<\/p>\n<\/section>"},{"title":"D. Challenge to Credibility at the Gate to Science","raw":"#### 如果 D 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n科学门口对可信度的挑战\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写理想中新发现只要展示客观事实就能顺利进入科学知识体系，再指出发现者的个人判断仍会留下可信性疑点，引出科学入口处对新主张可信度的质疑 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 说明申请进入科学知识体系的发现主张还只是未完成的论证，支持其可信度的证据和解释仍需补齐，才能回应入口处提出的质疑 | 再说一个东西还只是半成品 |\n| 3 | 展开发现者、审稿人和相关领域研究者围绕入门主张交换证据、提出质疑并修订解释的过程，说明一个回应可信度挑战的完整论证怎样经多人参与形成 | 接着说它要经过很多人才能成形 |\n| 4 | 说明科学入口处可信度挑战的两处矛盾：入门审查依赖已有知识提出疑问，新发现却要以修正已有知识证明自身贡献；质疑有助于发现可信性缺口，却也会使一些值得接纳的新颖主张较晚进入科学知识体系 | 再说中间还有两处矛盾 |\n| 5 | 收束到提出者与审查者共同澄清入口处的疑问、修正论证并补足证据，一起完成对新主张入门资格的判断，说明科学入口处的可信度挑战怎样得到处理 | 最后下结论：大家一起把它做完 |\n\nD把中心放在新主张进入科学知识体系时，其可信度受到的挑战。`Challenge`可以是必要的质疑和检验，不一定是恶意阻挡；`at the Gate to Science`也不要求把所有审查者写成反对新发现的人。因此，不能因为文章肯定共同体合作，就直接断定D与作者态度相反。\n\n需要比对的是讨论范围。假如D是主旨，个人偏差、审查分工和新颖性引发的怀疑，都应围绕科学入口处的可信性疑问展开，结尾也应收束到这些入门挑战怎样被提出和处理。实际第2段讲的却是从个人主张到成熟发现的完整转化，入口处的质疑只是这段过程能够涉及的一部分。\n\n第3段的`gatekeepers`确实容易引人想到D，但编辑和审稿人只负责控制发表环节。作者随后继续写其他科学家如何使用发现、公众如何接收发现，以及不同信念怎样共同完成可信度转化，视线没有停在发表入口。第4段还明确说已显得可信的发现仍可能被未来研究者挑战、修改或反驳，说明挑战并不限于“进入科学之前”。第5段收束于共同推理使可信度形成，也没有把入门质疑确立为全文终点。D抓住了文中的把关与挑战，却用科学入口处的问题收窄了贯穿科学实践的可信度形成过程。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 D选项","focus":[93,2480,991,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":35,"option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q35-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><p><strong>Which of the following would be the best title of the text?<\/strong><\/p>\n<p>科学门口对可信度的挑战<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-D-1\"><h3>如果 D 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>科学门口对可信度的挑战<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写理想中新发现只要展示客观事实就能顺利进入科学知识体系，再指出发现者的个人判断仍会留下可信性疑点，引出科学入口处对新主张可信度的质疑<\/td>\n<td>先摆出一种理想说法，再拆掉它<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>说明申请进入科学知识体系的发现主张还只是未完成的论证，支持其可信度的证据和解释仍需补齐，才能回应入口处提出的质疑<\/td>\n<td>再说一个东西还只是半成品<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>展开发现者、审稿人和相关领域研究者围绕入门主张交换证据、提出质疑并修订解释的过程，说明一个回应可信度挑战的完整论证怎样经多人参与形成<\/td>\n<td>接着说它要经过很多人才能成形<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>说明科学入口处可信度挑战的两处矛盾：入门审查依赖已有知识提出疑问，新发现却要以修正已有知识证明自身贡献；质疑有助于发现可信性缺口，却也会使一些值得接纳的新颖主张较晚进入科学知识体系<\/td>\n<td>再说中间还有两处矛盾<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>收束到提出者与审查者共同澄清入口处的疑问、修正论证并补足证据，一起完成对新主张入门资格的判断，说明科学入口处的可信度挑战怎样得到处理<\/td>\n<td>最后下结论：大家一起把它做完<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>D把中心放在新主张进入科学知识体系时，其可信度受到的挑战。<code>Challenge<\/code>可以是必要的质疑和检验，不一定是恶意阻挡；<code>at the Gate to Science<\/code>也不要求把所有审查者写成反对新发现的人。因此，不能因为文章肯定共同体合作，就直接断定D与作者态度相反。<\/p>\n<p>需要比对的是讨论范围。假如D是主旨，个人偏差、审查分工和新颖性引发的怀疑，都应围绕科学入口处的可信性疑问展开，结尾也应收束到这些入门挑战怎样被提出和处理。实际第2段讲的却是从个人主张到成熟发现的完整转化，入口处的质疑只是这段过程能够涉及的一部分。<\/p>\n<p>第3段的<code>gatekeepers<\/code>确实容易引人想到D，但编辑和审稿人只负责控制发表环节。作者随后继续写其他科学家如何使用发现、公众如何接收发现，以及不同信念怎样共同完成可信度转化，视线没有停在发表入口。第4段还明确说已显得可信的发现仍可能被未来研究者挑战、修改或反驳，说明挑战并不限于“进入科学之前”。第5段收束于共同推理使可信度形成，也没有把入门质疑确立为全文终点。D抓住了文中的把关与挑战，却用科学入口处的问题收窄了贯穿科学实践的可信度形成过程。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<\/section>"},{"title":"35题结论","raw":"### 35题结论\n\n**35. C. Evolution of Credibility in Doing Science**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Evolution of Credibility in Doing Science / 科学实践中可信度的形成**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[18,2141,1292,407],"sourceW":1732,"sourceH":2566},"meta":{"kind":"conclusion","question":35},"level":3,"html":"<p><strong>35. C. Evolution of Credibility in Doing Science<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Evolution of Credibility in Doing Science / 科学实践中可信度的形成<\/strong><\/p>\n"},{"title":"31题 · 题干、题型与核心出处","raw":"## 31题\n\n> According to the first paragraph, the process of discovery is characterized by its ______.  \n> 根据第一段，发现的过程具有怎样的特点？\n\n### 题型\n\n这是一道段落概括题。`According to the first paragraph`限定第一段，`the process of discovery`要求概括发现过程的特点。需要区分段首先摆出的理想图景与`But`之后说明的日常实践，并把后面有关个人经历、知识兴趣和出错机会的句子一起纳入判断。\n\n### 核心出处\n\n> In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.\n>\n> But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.\n>\n> We aim to be objective, but we cannot escape the context of our unique life experiences.\n>\n> Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.\n>\n> Opportunities for misinterpretation, error, and self-deception abound.\n\n第一句写理想化的科学工作，第二句用`But`转到现实中的发现路径，给出`ambiguous and complicated`。后三句解释这种路径为什么难以完全清晰、稳定：研究者受到个人背景、知识和兴趣影响，理解与行动中也存在误读、错误和自我欺骗的机会。题干问的是这些句子共同说明的过程特点，不能只抽出“客观研究者”或某一种失误来回答。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[18,18,1676,493],"sourceW":1732,"sourceH":2566},"meta":{"kind":"question","question":31},"level":2,"html":"<blockquote>\n<p>According to the first paragraph, the process of discovery is characterized by its ______.<br>根据第一段，发现的过程具有怎样的特点？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道段落概括题。<code>According to the first paragraph<\/code>限定第一段，<code>the process of discovery<\/code>要求概括发现过程的特点。需要区分段首先摆出的理想图景与<code>But<\/code>之后说明的日常实践，并把后面有关个人经历、知识兴趣和出错机会的句子一起纳入判断。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<p>第一句写理想化的科学工作，第二句用<code>But<\/code>转到现实中的发现路径，给出<code>ambiguous and complicated<\/code>。后三句解释这种路径为什么难以完全清晰、稳定：研究者受到个人背景、知识和兴趣影响，理解与行动中也存在误读、错误和自我欺骗的机会。题干问的是这些句子共同说明的过程特点，不能只抽出“客观研究者”或某一种失误来回答。<\/p>\n"},{"title":"A. uncertainty and complexity","raw":"### A. uncertainty and complexity\n\n> 不确定性和复杂性\n\n**做题模式中的状态：** 当时原文的`ambiguous`和`self-deception`被`[xxx]`遮挡；先由`complicated route`看出复杂路径，再结合个人经历、知识兴趣以及误读和错误理解不确定性，第一轮保留A，其余三项排除后选择A。\n\n**选项类型：正确同义改写。**\n\nA用`uncertainty`概括`ambiguous`所体现的不明确与不确定，用`complexity`改写`complicated`。后文有关背景影响和出错机会的说明进一步支撑这两个概括，选项既没有把科学研究说成毫无规律，也没有把追求客观的目标当作发现过程已经达到的状态。\n\n**出处：**\n\n> But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.\n>\n> We aim to be objective, but we cannot escape the context of our unique life experiences.\n>\n> Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.\n>\n> Opportunities for misinterpretation, error, and self-deception abound.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[94,188,631,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q31-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>不确定性和复杂性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>ambiguous<\/code>和<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；先由<code>complicated route<\/code>看出复杂路径，再结合个人经历、知识兴趣以及误读和错误理解不确定性，第一轮保留A，其余三项排除后选择A。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>A用<code>uncertainty<\/code>概括<code>ambiguous<\/code>所体现的不明确与不确定，用<code>complexity<\/code>改写<code>complicated<\/code>。后文有关背景影响和出错机会的说明进一步支撑这两个概括，选项既没有把科学研究说成毫无规律，也没有把追求客观的目标当作发现过程已经达到的状态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. uncertainty and complexity","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第一段，发现的过程具有不确定性和复杂性。\n\n题干的`process of discovery`对应原文的`discovery ... follows ... route`，A的`complexity`对应`complicated`。这句话位于`But`之后，讨论的是`everyday practice of science`，因此先把它与段首的理想化版本分开。\n\n出处先用`ambiguous and complicated`描述发现路径，再说研究者无法摆脱自身经历，知识与兴趣会影响观察、理解和行动。最后一句补充误读、错误及自我欺骗的机会很多，使“路径不完全明确”有了具体内容。\n\n原文与A描述的主体都是发现过程。`complexity`保留复杂这一性质，`uncertainty`概括路径中的不明确以及认识可能受到干扰的状态，没有把研究者换成事实本身，也没有把科学方法说成完全无效。\n\n`frequently`是“经常”，说明作者在概括日常实践中常见的情况；A把这两点作为过程特征，并未额外写成每一次发现、每一个环节都必然出错。后文的出错机会也只是帮助解释不确定性，不等于所有研究结论都是错误的。\n\nA把原文对现实路径的两个形容词改成两个名词，并保留后文的解释方向：发现过程受到多种因素影响，因而常常不确定且复杂。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[94,188,631,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q31-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>不确定性和复杂性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>ambiguous<\/code>和<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；先由<code>complicated route<\/code>看出复杂路径，再结合个人经历、知识兴趣以及误读和错误理解不确定性，第一轮保留A，其余三项排除后选择A。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>A用<code>uncertainty<\/code>概括<code>ambiguous<\/code>所体现的不明确与不确定，用<code>complexity<\/code>改写<code>complicated<\/code>。后文有关背景影响和出错机会的说明进一步支撑这两个概括，选项既没有把科学研究说成毫无规律，也没有把追求客观的目标当作发现过程已经达到的状态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有不确定性和复杂性。<\/p>\n<\/blockquote>\n<p>题干的<code>process of discovery<\/code>对应原文的<code>discovery ... follows ... route<\/code>，A的<code>complexity<\/code>对应<code>complicated<\/code>。这句话位于<code>But<\/code>之后 >complicated<\/code>。后文有关背景影响和出错机会的说明进一步支撑这两个概括，选项既没有把科学研究说成毫无规律，也没有把追求客观的目标当作发现过程已经达到的状态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有不确定性和复杂性。<\/p>\n<\/blockquote>\n<p>题干的<code>process of discovery<\/code>对应原文的<code>discovery ... follows ... route<\/code>，A的<code>complexity<\/code>对应<code>complicated<\/code>。这句话位于<code>But<\/code>之后，讨论的是<code>everyday practice of science<\/code>，因此先把它与段首的理想化版本分开。<\/p>\n<p>出处先用<code>ambiguous and complicated<\/code>描述发现路径，再说研究者无法摆脱自身经历，知识与兴趣会影响观察、理解和行动。最后一句补充误读、错误及自我欺骗的机会很多，使“路径不完全明确”有了具体内容。<\/p>\n<p>原文与A描述的主体都是发现过程。<code>complexity<\/code>保留复杂这一性质，<code>uncertainty<\/code>概括路径中的不明确以及认识可能受到干扰的状态，没有把研究者换成事实本身，也没有把科学方法说成完全无效。<\/p>\n<p><code>frequently<\/code>是“经常”，说明作者在概括日常实践中常见的情况；A把这两点作为过程特征，并未额外写成每一次发现、每一个环节都必然出错。后文的出错机会也只是帮助解释不确定性，不等于所有研究结论都是错误的。<\/p>\n<p>A把原文对现实路径的两个形容词改成两个名词，并保留后文的解释方向：发现过程受到多种因素影响，因而常常不确定且复杂。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-2\"><h3>写作视角法<\/h3>\n<p>原文在说明发现过程后，接着是这样写的：<\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>因此，发现主张还只是初步的科学，需要经过集体审视和接受，才能变成成熟发现。<\/p>\n<\/blockquote>\n<p>作者由最初认识可能受干扰，推到个人提出的主张不能马上获得成熟知识的地位。后文安排集体处理，是因为最初发现仍有需要澄清、检验和修正的地方。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Because the route to discovery is uncertai blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段是在交代科学发现为什么还需要形成可信度，不能单独确定作者用哪两个特点描述最初的发现过程。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>uncertainty and complexity<br>不确定性和复杂性<\/p>\n<\/blockquote>\n<p>主旨关注发现主张怎样变得可信，A说明初始过程存在不确定性和复杂性，两者能接成起点与后续转化的关系。选项没有把主旨改成研究者故意欺骗别人，也没有把客观性预先当作已经完成的结果。<\/p>\n<p>本项最终仍要根据“an ambiguous and complicated route”这处局部原文判断。它给出了A所概括的两个性质；主旨则帮助确认，这种有待检验的起点与全文后续讨论相容。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<\/section>"},{"title":"B. misconception and deceptiveness","raw":"### B. misconception and deceptiveness\n\n> 误解和欺骗性\n\n**做题模式中的状态：** 当时B的`deceptiveness`和原文的`self-deception`被`[xxx]`遮挡；由`misinterpretation`看出误读是过程中可能出现的问题，比较后认为B把其中一类失误抬成整个过程的特点，第一轮排除B，并未靠认出被遮挡的词作判断。\n\n**错误类型：第一类——歪曲原意。**\n\nB借用段尾的误读和自我欺骗，把“存在发生这些问题的机会”改成“发现过程以误解和欺骗性为特征”。尤其`self-deception`指研究者可能欺骗自己，`deceptiveness`却把能够误导、欺骗的性质交给发现过程；原文没有把这个过程描述成具有欺骗性的活动。\n\n**出处：**\n\n> But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.\n>\n> Opportunities for misinterpretation, error, and self-deception abound.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[94,273,743,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q31-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>误解和欺骗性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的<code>deceptiveness<\/code>和原文的<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；由<code>misinterpretation<\/code>看出误读是过程中可能出现的问题，比较后认为B把其中一类失误抬成整个过程的特点，第一轮排除B，并未靠认出被遮挡的词作判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用段尾的误读和自我欺骗，把“存在发生这些问题的机会”改成“发现过程以误解和欺骗性为特征”。尤其<code>self-deception<\/code>指研究者可能欺骗自己，<code>deceptiveness<\/code>却把能够误导、欺骗的性质交给发现过程；原文没有把这个过程描述成具有欺骗性的活动。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. misconception and deceptiveness","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据第一段，发现的过程具有误解和欺骗性。\n\nB的`misconception`让人想到段尾的`misinterpretation`，`deceptiveness`又与`self-deception`词形接近。但题干要填在`the process of discovery is characterized by`后面，必须比较这些词在原文里究竟修饰什么、承担什么作用。\n\n出处描述发现路径时使用`ambiguous and complicated`；写误读、错误和自我欺骗时，主语却是`Opportunities`，谓语是`abound`。后一句说明这类问题有很多发生机会，为前面的不确定与复杂提供解释。\n\n`misinterpretation`与`misconception`都涉及理解出错，仅凭二者近义，确实容易把B留下；但完整选项还包含`deceptiveness`。原文的`self-deception`说研究者可能误导自己，B则把欺骗性作为发现过程的属性，省掉了`self-`限制，也改变了性质落在哪个对象上。\n\n这里不能把“可能受错误认识影响”读成“发现过程本身具有欺骗性”。一种认识活动会出现自我欺骗的机会，并不说明这一活动以欺骗为性质；文章也没有借段尾判断发现都出自误解。\n\nB把用于解释过程为何不确定的风险项目改成了过程本身的性质，并把自我欺骗的具体风险改写为欺骗性，未能保留原文对对象和范围的限制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[94,273,743,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q31-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>误解和欺骗性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的<code>deceptiveness<\/code>和原文的<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；由<code>misinterpretation<\/code>看出误读是过程中可能出现的问题，比较后认为B把其中一类失误抬成整个过程的特点，第一轮排除B，并未靠认出被遮挡的词作判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用段尾的误读和自我欺骗，把“存在发生这些问题的机会”改成“发现过程以误解和欺骗性为特征”。尤其<code>self-deception<\/code>指研究者可能欺骗自己，<code>deceptiveness<\/code>却把能够误导、欺骗的性质交给发现过程；原文没有把这个过程描述成具有欺骗性的活动。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception ery.<\/p>\n<p>初步发现主张充满潜力，经过集体审视和接受，可以变成成熟发现。<\/p>\n<\/blockquote>\n<p>作者没有因研究者可能误读或欺骗自己，就把发现过程定性为具有欺骗性。后文保留主张的潜力，并着重说明怎样通过共同体的处理获得可信度。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The process of discovery is characterized by misconceptions and a deceptive appearance that misleads those involved.<\/p>\n<p>发现过程以误解和误导参与者的欺骗性外观为特征。<\/p>\n<\/blockquote>\n<p>这段假设写法需要把误解和欺骗性直接交给过程，才能支持B的完整命题。实际文章写的却是认识可能受到干扰、主张仍有潜力、共同体能够推进其成熟；它没有从风险的存在转到对发现过程的这种定性。<\/p>\n<\/section>"},{"title":"B. misconception and deceptiveness","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认第一段是在交代发现主张尚需获得可信度，不能判断原文是否把误解和欺骗性认定为发现过程的总体特点。\n\n但B实际说的是：\n\n> misconception and deceptiveness  \n> 误解和欺骗性\n\n可信度有待形成，可以与认识不成熟、有出错风险相容，却不会自动推出发现过程具有欺骗性。B把“还需集体处理”解释成一种欺骗性的总体状态，主旨本身没有提供这一步判断。\n\n本项最终仍要根据“Opportunities for misinterpretation, error, and self-deception abound”这处局部原文判断。它说风险机会很多，且保留自我欺骗这一具体限制，不能改成过程以误解和欺骗性为特征。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[94,273,743,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q31-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>误解和欺骗性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的<code>deceptiveness<\/code>和原文的<code>self-deception<\/code>被<code>[xxx]<\/code>遮挡；由<code>misinterpretation<\/code>看出误读是过程中可能出现的问题，比较后认为B把其中一类失误抬成整个过程的特点，第一轮排除B，并未靠认出被遮挡的词作判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用段尾的误读和自我欺骗，把“存在发生这些问题的机会”改成“发现过程以误解和欺骗性为特征”。尤其<code>self-deception<\/code>指研究者可能欺骗自己，<code>deceptiveness<\/code>却把能够误导、欺骗的性质交给发现过程；原文没有把这个过程描述成具有欺骗性的活动。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有误解和欺骗性。<\/p>\n<\/blockquote>\n<p>B的<code>misconception<\/code>让人想到段尾的<code>misinterpretation<\/code>，<code>deceptiveness<\/code>又与<code>self-deception<\/code>词形接近。但题干要填在<code>the process of discovery is characterized by<\/code>后面，必须比较这些词在原文里究竟修饰什么、承担什么作用。<\/p>\n<p>出处描述发现路径时使用<code>ambiguous and complicated<\/code>；写误读、错误和自我欺骗时，主语却是<code>Opportunities<\/code>，谓语是<code>abound<\/code>。后一句说明这类问题有很多发生机会，为前面的不确定与复杂提供解释。<\/p>\n<p><code>misinterpretation<\/code>与<code>misconception<\/code>都涉及理解出错，仅凭二者近义，确实容易把B留下；但完整选项还包含<code>deceptiveness<\/code>。原文的<code>self-deception<\/code>说研究者可能误导自己，B则把欺骗性作为发现过程的属性，省掉了<code>self-<\/code>限制，也改变了性质落在哪个对象上。<\/p>\n<p>这里不能把“可能受错误认识影响”读成“发现过程本身具有欺骗性”。一种认识活动会出现自我欺骗的机会，并不说明这一活动以欺骗为性质；文章也没有借段尾判断发现都出自误解。<\/p>\n<p>B把用于解释过程为何不确定的风险项目改成了过程本身的性质，并把自我欺骗的具体风险改写为欺骗性，未能保留原文对对象和范围的限制。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-2\"><h3>写作视角法<\/h3>\n<p>原文从个人认识中的问题继续往下是这样写的：<\/p>\n<blockquote>\n<p>Similar to newly staked mining claims, they are full of potential.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>初步发现主张充满潜力，经过集体审视和接受，可以变成成熟发现。<\/p>\n<\/blockquote>\n<p>作者没有因研究者可能误读或欺骗自己，就把发现过程定性为具有欺骗性。后文保留主张的潜力，并着重说明怎样通过共同体的处理获得可信度。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The process of discovery is characterized by misconceptions and a deceptive appearance that misleads those involved.<\/p>\n<p>发现过程以误解和误导参与者的欺骗性外观为特征。<\/p>\n<\/blockquote>\n<p>这段假设写法需要把误解和欺骗性直接交给过程，才能支持B的完整命题。实际文章写的却是认识可能受到干扰、主张仍有潜力、共同体能够推进其成熟；它没有从风险的存在转到对发现过程的这种定性。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段是在交代发现主张尚需获得可信度，不能判断原文是否把误解和欺骗性认定为发现过程的总体特点。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>misconception and deceptiveness<br>误解和欺骗性<\/p>\n<\/blockquote>\n<p>可信度有待形成，可以与认识不成熟、有出错风险相容，却不会自动推出发现过程具有欺骗性。B把“还需集体处理”解释成一种欺骗性的总体状态，主旨本身没有提供这一步判断。<\/p>\n<p>本项最终仍要根据“Opportunities for misinterpretation, error, and self-deception abound”这处局部原文判断。它说风险机会很多，且保留自我欺骗这一具体限制，不能改成过程以误解和欺骗性为特征。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. logicality and objectivity","raw":"### C. logicality and objectivity\n\n> 逻辑性和客观性\n\n**做题模式中的状态：** 当时读到`We aim to be objective`，也读到紧随其后的`but we cannot escape the context`；由目标与现实限制的区别，判断C把追求的客观性当作过程已具备的特点，第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用理想化图景中的客观研究者和研究者想做到客观的目标，却略去`But`引出的现实限制。`objectivity`把追求的方向写成过程已经具备的性质，`logicality`也没有获得第一段对现实过程的相应概括支持。\n\n**出处：**\n\n> In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.\n>\n> But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.\n>\n> We aim to be objective, but we cannot escape the context of our unique life experiences.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,358,583,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q31-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>逻辑性和客观性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>We aim to be objective<\/code>，也读到紧随其后的<code>but we cannot escape the context<\/code>；由目标与现实限制的区别，判断C把追求的客观性当作过程已具备的特点，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用理想化图景中的客观研究者和研究者想做到客观的目标，却略去<code>But<\/code>引出的现实限制。<code>objectivity<\/code>把追求的方向写成过程已经具备的性质，<code>logicality<\/code>也没有获得第一段对现实过程的相应概括支持。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. logicality and objectivity","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据第一段，发现的过程具有逻辑性和客观性。\n\nC的`objectivity`对应段首的`objective researchers`和后面的`aim to be objective`。前一处受`In the idealized version`限定，后一处受`aim`限定，都不能脱离自己的语境单独用于概括现实过程。\n\n出处先写理想图景，再以`But`转到日常科学实践；随后又用一个`but`说明，研究者虽力求客观，却无法摆脱各自生活经历的背景。作者连续区分理想与现实、目标与限制。\n\n原文的主体是希望客观的研究者，动作是`aim to be`，后面同时保留尚未摆脱的影响。C把它改成发现过程具有`objectivity`，从“力求达到”跨到了“已经具有”，改变了客观性在句子中的地位。\n\n`logicality`也不能仅凭段首出现`scientific method`就补出来。研究者采用科学方法，不等于本段已把现实路径概括为逻辑而客观；但同样不能反过来说作者否定一切逻辑，他实际强调的是个人背景使路径不完全明确、简单。\n\nC取用了原文正面词汇，却移除了理想化和目标这两层限定，把现实仍受影响的发现过程写成已经达到客观状态。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,358,583,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q31-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>逻辑性和客观性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>We aim to be objective<\/code>，也读到紧随其后的<code>but we cannot escape the context<\/code>；由目标与现实限制的区别，判断C把追求的客观性当作过程已具备的特点，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用理想化图景中的客观研究者和研究者想做到客观的目标，却略去<code>But<\/code>引出的现实限制。<code>objectivity<\/code>把追求的方向写成过程已经具备的性质，<code>logicality<\/code>也没有获得第一段对现实过程的相应概括支持。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有逻辑性和客观性。<\/p>\n<\/blockquote>\n<p>C的<code>objectivity<\/code>对应段首的<code>objective researchers<\/code>和后面的<code>aim to be objective<\/code>。前一处受<code>In the idealized version<\/code>限定，后一处受<code>aim<\/code>限定，都不能脱离自己的语境单独用于概括现实过程。<\/p>\n<p>出处先写理想图景，再以<code>But<\/code>转到日常科学实践；随后又用一个<code>but<\/code>说明，研究者虽力求客观，却无法摆脱各自生活经历的背景。作者连续区分理想与现实、目标与限制。<\/p>\n<p>原文的主体是希望客观的研究者，动作是<code>aim to be<\/code>，后面同时保留尚未摆脱的影响。C把它改成发现过程具有<code>objectivity<\/code>，从“力求达到”跨到了“已经具有”，改变了客观性在句子中的地位。<\/p>\n<p><code>logicality<\/code>也不能仅凭段首出现<code>scientific method<\/code>就补出来。研究者采用科学方法，不等于本段已把现实路径概括为逻辑而客观；但同样不能反过来说作者否定一切逻辑，他实际强调的是个人背景使路径不完全明确、简单。<\/p>\n<p>C取用了原文正面词汇，却移除了理想化和目标这两层限定，把现实仍受影响的发现过程写成已经达到客观状态。<\/p>\n<\/section>"},{"title":"C. logicality and objectivity","raw":"#### 写作视角法\n\n原文随后明确说明客观知识的地位：\n\n> Objective knowledge is the goal, not the starting point.\n>\n> 客观知识是目标，而不是起点。\n\n这句话接在集体审视、接受以及个人走向共同体的说明之后。作者把客观知识放在过程需要达到的一端，进一步解释第一段为什么不把初始发现视为已经客观。\n\n如果C真是作者的意思，文章至少得写成：\n\n> In everyday scientific practice, discovery follows a logical and objective route.\n>\n> 在日常科学实践中，发现沿着合乎逻辑而客观的路径展开。\n\n这段假设写法要让客观性成为现实路径已有的性质，才接得上C。实际文章却先说个人背景无法摆脱，再说客观知识是需要实现的目标；两种写法把客观性放在了不同位置。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,358,583,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-3 blockquote>\n<p>logicality and objectivity<br>逻辑性和客观性<\/p>\n<\/blockquote>\n<p>主旨追踪可信度怎样形成，不能拿来证明每一项最初发现已经达到客观。结合文章的实际推进，个人主张还需共同体处理，C却把有待达到的性质提前放进起点。<\/p>\n<p>本项最终仍要根据“We aim to be objective, but we cannot escape the context”这处局部原文判断。作者强调追求与现实限制并存，后文“Objective knowledge is the goal, not the starting point”又将这一位置区别说得更明确。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. systematicness and regularity","raw":"### D. systematicness and regularity\n\n> 系统性和规律性\n\n**做题模式中的状态：** 当时由`complicated route`、个人背景的影响以及误读和错误，认为D所说的系统性和规律性没有概括现实发现路径，第一轮排除D；原文中被`[xxx]`遮挡的词没有被当作已读懂的信息。\n\n**错误类型：第一类——歪曲原意。**\n\nD容易借段首的科学方法联想到系统而有规律的活动，却把理想图景移到`But`之后的现实发现路径上。原文在这里突出路径不明确、复杂以及认识受多种因素影响，D却把过程的概括重点改成系统性和规律性。\n\n**出处：**\n\n> In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.\n>\n> But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.\n>\n> Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[94,443,670,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q31-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>系统性和规律性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>complicated route<\/code>、个人背景的影响以及误读和错误，认为D所说的系统性和规律性没有概括现实发现路径，第一轮排除D；原文中被<code>[xxx]<\/code>遮挡的词没有被当作已读懂的信息。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D容易借段首的科学方法联想到系统而有规律的活动，却把理想图景移到<code>But<\/code>之后的现实发现路径上。原文在这里突出路径不明确、复杂以及认识受多种因素影响，D却把过程的概括重点改成系统性和规律性。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. systematicness and regularity","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第一段，发现的过程具有系统性和规律性。\n\n题干限定第一段，讨论的是`process of discovery`；原文对该过程最直接的描写是`discovery frequently follows an ambiguous and complicated route`。D可能让人想到段首的`scientific method`，但那一句正在交代理想化版本。\n\n出处以`But`把理想图景与日常实践分开，再用个人背景和知识兴趣说明现实路径为什么会受到干扰。对观察什么、怎样理解以及随后怎样行动的影响，都属于作者具体展开的过程特征。\n\n需要比较的并不是“复杂”这个词能否与“系统”在任何情况下同时成立。复杂的系统也可能有规律；本题的关键是，作者没有沿着系统性或规律性解释现实发现，而是用不明确、复杂及多重影响来概括它。\n\nD若成立，需要第一段把有组织、按规律展开确定为这个过程的特点。仅凭研究者会使用科学方法，无法越过`idealized`与`But`的限定，得出作者对日常路径作了这样的概括。\n\nD把理想化叙述容易引出的有序印象移作现实过程的结论，改变了转折后作者实际强调的性质；不能用一种关于科学的通常印象替换本段给出的描述。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[94,443,670,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q31-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>系统性和规律性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>complicated route<\/code>、个人背景的影响以及误读和错误，认为D所说的系统性和规律性没有概括现实发现路径，第一轮排除D；原文中被<code>[xxx]<\/code>遮挡的词没有被当作已读懂的信息。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D容易借段首的科学方法联想到系统而有规律的活动，却把理想图景移到<code>But<\/code>之后的现实发现路径上。原文在这里突出路径不明确、复杂以及认识受多种因素影响，D却把过程的概括重点改成系统性和规律性。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有系统性和规律性。<\/p>\n<\/blockquote>\n<p>题干限定第一段，讨论的是<code>process of discovery<\/code>；原文对该过程最直接的描写是<code>discovery frequently follows an ambiguous and complicated route<\/code>。D可能让人想到段首的<code>scientific method<\/code>，但那一句正在交代理想化版本。<\/p>\n<p>出处以<code>But<\/code>把理想图景与日常实践分开，再用个人背景和知识兴趣说明现实路径为什么会受到干扰。对观察什么、怎样理解以及随后怎样行动的影响，都属于作者具体展开的过程特征。<\/p>\n<p>需要比较的并不是“复杂”这个词能否与“系统”在任何情况下同时成立。复杂的系统也可能有规律；本题的关键是，作者没有沿着系统性或规律性解释现实发现，而是用不明确、复杂及多重影响来概括它。<\/p>\n<p>D若成立，需要第一段把有组织、按规律展开确定为这个过程的特点。仅凭研究者会使用科学方法，无法越过<code>idealized<\/code>与<code>But<\/code>的限定，得出作者对日常路径作了这样的概括。<\/p>\n<p>D把理想化叙述容易引出的有序印象移作现实过程的结论，改变了转折后作者实际强调的性质；不能用一种关于科学的通常印象替换本段给出的描述。<\/p>\n<\/section>"},{"title":"D. systematicness and regularity","raw":"#### 写作视角法\n\n原文在转入现实之后是这样展开的：\n\n> Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.\n>\n> Opportunities for misinterpretation, error, and self-deception abound.\n>\n> 知识和兴趣影响经历、理解与行动，误读、错误和自我欺骗的机会也很多。\n\n作者没有接着列出固定步骤或稳定规则，而是把现实过程中的影响来源和风险逐层补出来，用来说明前面的不明确与复杂。\n\n如果D真是作者的意思，文章至少得写成：\n\n> In everyday practice, discovery follows a systematic and regular route, with observations and conclusions connected through stable procedures.\n>\n> 在日常实践中，发现沿着系统而有规律的路径展开，观察与结论由稳定程序连接起来。\n\n假设写法要以系统程序和稳定秩序解释发现路径，才能支撑D。实际写法却继续说明个人因素会影响观察和解释，两者关注的过程特征不同；有科学方法这一背景事实并不能替代文章实际展开的重点。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[94,443,670,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question  and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<p>知识和兴趣影响经历、理解与行动，误读、错误和自我欺骗的机会也很多。<\/p>\n<\/blockquote>\n<p>作者没有接着列出固定步骤或稳定规则，而是把现实过程中的影响来源和风险逐层补出来，用来说明前面的不明确与复杂。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>In everyday practice, discovery follows a systematic and regular route, with observations and conclusions connected through stable procedures.<\/p>\n<p>在日常实践中，发现沿着系统而有规律的路径展开，观察与结论由稳定程序连接起来。<\/p>\n<\/blockquote>\n<p>假设写法要以系统程序和稳定秩序解释发现路径，才能支撑D。实际写法却继续说明个人因素会影响观察和解释，两者关注的过程特征不同；有科学方法这一背景事实并不能替代文章实际展开的重点。<\/p>\n<\/section>"},{"title":"D. systematicness and regularity","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认第一段在介绍可信度形成之前的发现过程，不能判断这个过程是否被作者概括为系统而有规律。\n\n但D实际说的是：\n\n> systematicness and regularity  \n> 系统性和规律性\n\n主旨讨论的是科学实践，不能因此把日常观念中的“科学很系统”代入题干。文章后来说明共同体怎样处理主张，也不等于第一段已把个人发现路径写成规则稳定的过程。\n\n本项最终仍要根据“an ambiguous and complicated route”及随后个人背景影响的局部原文判断。作者实际用这些内容解释发现过程，D所概括的系统性和规律性没有保留这一段的展开重点。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[94,443,670,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q31-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>系统性和规律性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>complicated route<\/code>、个人背景的影响以及误读和错误，认为D所说的系统性和规律性没有概括现实发现路径，第一轮排除D；原文中被<code>[xxx]<\/code>遮挡的词没有被当作已读懂的信息。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D容易借段首的科学方法联想到系统而有规律的活动，却把理想图景移到<code>But<\/code>之后的现实发现路径上。原文在这里突出路径不明确、复杂以及认识受多种因素影响，D却把过程的概括重点改成系统性和规律性。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the idealized version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work.<\/p>\n<p>But in the everyday practice of science, discovery frequently follows an ambiguous and complicated route.<\/p>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，发现的过程具有系统性和规律性。<\/p>\n<\/blockquote>\n<p>题干限定第一段，讨论的是<code>process of discovery<\/code>；原文对该过程最直接的描写是<code>discovery frequently follows an ambiguous and complicated route<\/code>。D可能让人想到段首的<code>scientific method<\/code>，但那一句正在交代理想化版本。<\/p>\n<p>出处以<code>But<\/code>把理想图景与日常实践分开，再用个人背景和知识兴趣说明现实路径为什么会受到干扰。对观察什么、怎样理解以及随后怎样行动的影响，都属于作者具体展开的过程特征。<\/p>\n<p>需要比较的并不是“复杂”这个词能否与“系统”在任何情况下同时成立。复杂的系统也可能有规律；本题的关键是，作者没有沿着系统性或规律性解释现实发现，而是用不明确、复杂及多重影响来概括它。<\/p>\n<p>D若成立，需要第一段把有组织、按规律展开确定为这个过程的特点。仅凭研究者会使用科学方法，无法越过<code>idealized<\/code>与<code>But<\/code>的限定，得出作者对日常路径作了这样的概括。<\/p>\n<p>D把理想化叙述容易引出的有序印象移作现实过程的结论，改变了转折后作者实际强调的性质；不能用一种关于科学的通常印象替换本段给出的描述。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-2\"><h3>写作视角法<\/h3>\n<p>原文在转入现实之后是这样展开的：<\/p>\n<blockquote>\n<p>Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take.<\/p>\n<p>Opportunities for misinterpretation, error, and self-deception abound.<\/p>\n<p>知识和兴趣影响经历、理解与行动，误读、错误和自我欺骗的机会也很多。<\/p>\n<\/blockquote>\n<p>作者没有接着列出固定步骤或稳定规则，而是把现实过程中的影响来源和风险逐层补出来，用来说明前面的不明确与复杂。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>In everyday practice, discovery follows a systematic and regular route, with observations and conclusions connected through stable procedures.<\/p>\n<p>在日常实践中，发现沿着系统而有规律的路径展开，观察与结论由稳定程序连接起来。<\/p>\n<\/blockquote>\n<p>假设写法要以系统程序和稳定秩序解释发现路径，才能支撑D。实际写法却继续说明个人因素会影响观察和解释，两者关注的过程特征不同；有科学方法这一背景事实并不能替代文章实际展开的重点。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第一段在介绍可信度形成之前的发现过程，不能判断这个过程是否被作者概括为系统而有规律。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>systematicness and regularity<br>系统性和规律性<\/p>\n<\/blockquote>\n<p>主旨讨论的是科学实践，不能因此把日常观念中的“科学很系统”代入题干。文章后来说明共同体怎样处理主张，也不等于第一段已把个人发现路径写成规则稳定的过程。<\/p>\n<p>本项最终仍要根据“an ambiguous and complicated route”及随后个人背景影响的局部原文判断。作者实际用这些内容解释发现过程，D所概括的系统性和规律性没有保留这一段的展开重点。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. A. uncertainty and complexity**\n\nA概括现实发现路径的不确定性和复杂性，并能容纳后文对个人背景和出错风险的说明。\n\nB借误读和自我欺骗的风险，把它们改成整个发现过程具有误解和欺骗性。\n\nC借客观研究者与追求客观的目标，把理想和目标改成现实过程已经具备的性质。\n\nD借科学方法带来的有序印象，把理想图景移作现实路径的概括，没有保留转折后的展开重点。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[18,18,1676,493],"sourceW":1732,"sourceH":2566},"meta":{"kind":"conclusion","question":31},"level":3,"html":"<blockquote>\n<p><strong>31. A. uncertainty and complexity<\/strong><\/p>\n<\/blockquote>\n<p>A概括现实发现路径的不确定性和复杂性，并能容纳后文对个人背景和出错风险的说明。<\/p>\n<p>B借误读和自我欺骗的风险，把它们改成整个发现过程具有误解和欺骗性。<\/p>\n<p>C借客观研究者与追求客观的目标，把理想和目标改成现实过程已经具备的性质。<\/p>\n<p>D借科学方法带来的有序印象，把理想图景移作现实路径的概括，没有保留转折后的展开重点。<\/p>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> It can be inferred from Paragraph 2 that credibility process requires ______.  \n> 从第二段可以推断，可信度形成过程需要什么？\n\n### 题型\n\n这是一道局部推断题。`Paragraph 2`限定第二段，`credibility process requires`问发现主张获得可信度所需要的条件。先看`it takes`明确列出的条件，再看个人研究者与共同体的对比；推断应概括这些明示信息，不能另外补进文章没有建立的条件。\n\n### 核心出处\n\n> Consequently, discovery claims should be thought of as protoscience.\n>\n> Similar to newly staked mining claims, they are full of potential.\n>\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.\n>\n> This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.\n>\n> Objective knowledge is the goal, not the starting point.\n\n发现主张起初有潜力，却还不是成熟发现。第三句明说转化需要`collective scrutiny and acceptance`，第四句接着说明，个人研究者的“我、这里、现在”要转向共同体的“任何人、任何地方、任何时候”。因此，作出推断时，应抓住这两句共同强调的集体参与：审视和接受使主张不再停留于研究者个人。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[18,612,1465,408],"sourceW":1732,"sourceH":2566},"meta":{"kind":"question","question":32},"level":2,"html":"<blockquote>\n<p>It can be inferred from Paragraph 2 that credibility process requires ______.<br>从第二段可以推断，可信度形成过程需要什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部推断题。<code>Paragraph 2<\/code>限定第二段，<code>credibility process requires<\/code>问发现主张获得可信度所需要的条件。先看<code>it takes<\/code>明确列出的条件，再看个人研究者与共同体的对比；推断应概括这些明示信息，不能另外补进文章没有建立的条件。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>Similar to newly staked mining claims, they are full of potential.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<p>Objective knowledge is the goal, not the starting point.<\/p>\n<\/blockquote>\n<p>发现主张起初有潜力，却还不是成熟发现。第三句明说转化需要<code>collective scrutiny and acceptance<\/code>，第四句接着说明，个人研究者的“我、这里、现在”要转向共同体的“任何人、任何地方、任何时候”。因此，作出推断时，应抓住这两句共同强调的集体参与：审视和接受使主张不再停留于研究者个人。<\/p>\n"},{"title":"A. strict inspection","raw":"### A. strict inspection\n\n> 严格检查\n\n**做题模式中的状态：** 当时A的`strict`被`[xxx]`遮挡，能读懂的`inspection`与原文`scrutiny`接近，因此第一轮保留A，同时保留B；35题主旨确定后，回查发现A偏向检查环节及其强度，B更能概括从个人走向共同体的形成过程，最终排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用`scrutiny`这一真实动作，却把原文所强调的`collective`集体参与改成`strict`严格程度。原文并不反对认真检查，问题在于它用集体审视、接受以及个人走向共同体解释可信度形成，不能把参与范围的限定直接改写成检查强度的要求。\n\n**出处：**\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.\n>\n> This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,697,402,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q32-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>严格检查<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>strict<\/code>被<code>[xxx]<\/code>遮挡，能读懂的<code>inspection<\/code>与原文<code>scrutiny<\/code>接近，因此第一轮保留A，同时保留B；35题主旨确定后，回查发现A偏向检查环节及其强度，B更能概括从个人走向共同体的形成过程，最终排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用<code>scrutiny<\/code>这一真实动作，却把原文所强调的<code>collective<\/code>集体参与改成<code>strict<\/code>严格程度。原文并不反对认真检查，问题在于它用集体审视、接受以及个人走向共同体解释可信度形成，不能把参与范围的限定直接改写成检查强度的要求。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. strict inspection","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 从第二段可以推断，可信度形成过程需要严格检查。\n\n题干的`requires`对应原文的`it takes`，A的`inspection`对应`scrutiny`。这处词义联系是真实的，所以要进一步看检查前面的限定，以及后一句怎样解释`credibility process`。\n\n出处把`collective scrutiny and acceptance`作为发现主张转为成熟发现的条件，下一句把这一转化写成个人的主张走向共同体。两句共同强调主张由集体审视、接受，并获得超出个人的效力；它们没有具体讨论检查标准的严格程度。\n\n`collective`说明由谁参与，`strict`说明检查要求有多严；两者不是同一个限定。原文的`scrutiny`确有仔细审查的意味，但不能因此把`collective`所落实的多人参与也理解成严格程度。比较A、B时，B的共同努力能够直接对应这一限定及后一句的`community`。\n\n不能仅因A只写了一个环节，就断言任何只概括一个条件的选项都不成立；也不能说`scrutiny`完全不含仔细审查的意味。本项真正的问题是，用`strict inspection`回答本段推断时，改变了两句反复突出的参与范围，原文没有把“严格程度”确立为这里要推出的关键条件。\n\nA保留了检查动作，却把共同体参与这一条件转成检查强度；它不足以概括原文所说明的个人主张怎样成为共同体认可的发现。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,697,402,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>严格检查<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>strict<\/code>被<code>[xxx]<\/code>遮挡，能读懂的<code>inspection<\/code>与原文<code>scrutiny<\/code>接近，因此第一轮保留A，同时保留B；35题主旨确定后，回查发现A偏向检查环节及其强度，B更能概括从个人走向共同体的形成过程，最终排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用<code>scrutiny<\/code>这一真实动作，却把原文所强调的<code>collective<\/code>集体参与改成<code>strict<\/code>严格程度。原文并不反对认真检查，问题在于它用集体审视、接受以及个人走向共同体解释可信度形成，不能把参与范围的限定直接改写成检查强度的要求。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要严格检查。<\/p>\n<\/blockquote>\n<p>题干的<code>requires<\/code>对应原文的<code>it takes<\/code>，A的<code>inspection<\/code>对应<code>scrutiny<\/code>。这处词义联系是真实的，所以要进一步看检查前面的限定，以及后一句怎样解释<code>credibility process<\/code>。<\/p>\n<p>出处把<code>collective scrutiny and acceptance<\/code>作为发现主张转为成熟发现的条件，下一句把这一转化写成个人的主张走向共同体。两句共同强调主张由集体审视、接受，并获得超出个人的效力；它们没有具体讨论检查标准的严格程度。<\/p>\n<p><code>collective<\/code>说明由谁参与，<code>strict<\/code>说明检查要求有多严；两者不是同一个限定。原文的<code>scrutiny<\/code>确有仔细审查的意味，但不能因此把<code>collective<\/code>所落实的多人参与也理解成严格程度。比较A、B时，B的共同努力能够直接对应这一限定及后一句的<code>community<\/code>。<\/p>\n<p>不能仅因A只写了一个环节，就断言任何只概括一个条件的选项都不成立；也不能说<code>scrutiny<\/code>完全不含仔细审查的意味。本项真正的问题是，用<code>strict inspection<\/code>回答本段推断时，改变了两句反复突出的参与范围，原文没有把“严格程度”确立为这里要推出的关键条件。<\/p>\n<p>A保留了检查动作，却把共同体参与这一条件转成检查强度；它不足以概括原文所说明的个人主张怎样成为共同体认可的发现。<\/p>\n<\/section>"},{"title":"A. strict inspection","raw":"#### 写作视角法\n\n原文下一段把共同体参与具体展开为：\n\n> But, unlike with mining claims, the community takes control of what happens next.\n>\n> Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.\n>\n> 主张公开后，共同体接管后续过程；研究者、编辑和审稿人、其他科学家以及公众在不同环节参与其中。\n\n作者接着回答的是“哪些人怎样处理这个主张”，把第二段的`collective`展开成多个参与者。这为B的共同努力补上了具体内容，而没有进一步说明A所提出的检查强度要求。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The credibility process requires a discovery claim to undergo strict inspection.\n>\n> 可信度形成过程要求发现主张接受严格检查。\n\n这个假设只需把严格检查明确写成所需条件，不必出现严格与宽松的对比，也不必否定共同体参与。实际文章把集体参与明确写入条件，又通过参与者的分工继续展开。因此，在两项之间，B保留了原文直接说明的关系；A则需要把仔细审视进一步概括为作者并未具体说明的严格程度要求。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,697,402,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>严格检查<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>strict<\/code>被<code>[xxx]<\/code>遮挡，能读懂的<code>inspection<\/code>与原文<code>scrutiny<\/code>接近，因此第一轮保留A，同时保留B；35题主旨确定后，回查发现A偏向检查环节及其强度，B更能概括从个人走向共同体的形成过程，最终排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用<code>scrutiny<\/code>这一真实动作，却把原文所强调的<code>collective<\/code>集体参与改成<code>strict<\/code>严格程度。原文并不反对认真检查，问题在于它用集体审视、接受以及个人走向共同体解释可信度形成，不能把参与范围的限定
