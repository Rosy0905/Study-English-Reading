者。这为B的共同努力补上了具体内容，而没有进一步说明A所提出的检查强度要求。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The credibility process requires a discovery claim to undergo strict inspection.<\/p>\n<p>可信度形成过程要求发现主张接受严格检查。<\/p>\n<\/blockquote>\n<p>这个假设只需把严格检查明确写成所需条件，不必出现严格与宽松的对比，也不必否定共同体参与。实际文章把集体参与明确写入条件，又通过参与者的分工继续展开。因此，在两项之间，B保留了原文直接说明的关系；A则需要把仔细审视进一步概括为作者并未具体说明的严格程度要求。<\/p>\n<\/section>"},{"title":"A. strict inspection","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认本题要找使初步发现逐渐获得可信度的条件，不能单靠标题判断这个条件是检查强度，还是多人共同参与。\n\n但A实际说的是：\n\n> strict inspection  \n> 严格检查\n\n把全文实际展开补回主旨，可以看到文章反复说明个人主张怎样经由共同体处理而形成可信度。A只把回答落在检查严格程度上，没有概括这一转化中反复出现的参与关系；与主题有关，不等于就是本段要推出的条件。\n\n本项最终仍要根据“collective scrutiny and acceptance”和个人转向“the community”这处局部原文判断。前者给出集体动作，后者再次限定参与范围，两句共同支持B所说的多人参与。这里排除A，不是在断言科学不需要严格检查，而是它未像B一样准确抓住本段明示的条件。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,697,402,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q32-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>严格检查<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>strict<\/code>被<code>[xxx]<\/code>遮挡，能读懂的<code>inspection<\/code>与原文<code>scrutiny<\/code>接近，因此第一轮保留A，同时保留B；35题主旨确定后，回查发现A偏向检查环节及其强度，B更能概括从个人走向共同体的形成过程，最终排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用<code>scrutiny<\/code>这一真实动作，却把原文所强调的<code>collective<\/code>集体参与改成<code>strict<\/code>严格程度。原文并不反对认真检查，问题在于它用集体审视、接受以及个人走向共同体解释可信度形成，不能把参与范围的限定直接改写成检查强度的要求。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要严格检查。<\/p>\n<\/blockquote>\n<p>题干的<code>requires<\/code>对应原文的<code>it takes<\/code>，A的<code>inspection<\/code>对应<code>scrutiny<\/code>。这处词义联系是真实的，所以要进一步看检查前面的限定，以及后一句怎样解释<code>credibility process<\/code>。<\/p>\n<p>出处把<code>collective scrutiny and acceptance<\/code>作为发现主张转为成熟发现的条件，下一句把这一转化写成个人的主张走向共同体。两句共同强调主张由集体审视、接受，并获得超出个人的效力；它们没有具体讨论检查标准的严格程度。<\/p>\n<p><code>collective<\/code>说明由谁参与，<code>strict<\/code>说明检查要求有多严；两者不是同一个限定。原文的<code>scrutiny<\/code>确有仔细审查的意味，但不能因此把<code>collective<\/code>所落实的多人参与也理解成严格程度。比较A、B时，B的共同努力能够直接对应这一限定及后一句的<code>community<\/code>。<\/p>\n<p>不能仅因A只写了一个环节，就断言任何只概括一个条件的选项都不成立；也不能说<code>scrutiny<\/code>完全不含仔细审查的意味。本项真正的问题是，用<code>strict inspection<\/code>回答本段推断时，改变了两句反复突出的参与范围，原文没有把“严格程度”确立为这里要推出的关键条件。<\/p>\n<p>A保留了检查动作，却把共同体参与这一条件转成检查强度；它不足以概括原文所说明的个人主张怎样成为共同体认可的发现。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法<\/h3>\n<p>原文下一段把共同体参与具体展开为：<\/p>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>主张公开后，共同体接管后续过程；研究者、编辑和审稿人、其他科学家以及公众在不同环节参与其中。<\/p>\n<\/blockquote>\n<p>作者接着回答的是“哪些人怎样处理这个主张”，把第二段的<code>collective<\/code>展开成多个参与者。这为B的共同努力补上了具体内容，而没有进一步说明A所提出的检查强度要求。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The credibility process requires a discovery claim to undergo strict inspection.<\/p>\n<p>可信度形成过程要求发现主张接受严格检查。<\/p>\n<\/blockquote>\n<p>这个假设只需把严格检查明确写成所需条件，不必出现严格与宽松的对比，也不必否定共同体参与。实际文章把集体参与明确写入条件，又通过参与者的分工继续展开。因此，在两项之间，B保留了原文直接说明的关系；A则需要把仔细审视进一步概括为作者并未具体说明的严格程度要求。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认本题要找使初步发现逐渐获得可信度的条件，不能单靠标题判断这个条件是检查强度，还是多人共同参与。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>strict inspection<br>严格检查<\/p>\n<\/blockquote>\n<p>把全文实际展开补回主旨，可以看到文章反复说明个人主张怎样经由共同体处理而形成可信度。A只把回答落在检查严格程度上，没有概括这一转化中反复出现的参与关系；与主题有关，不等于就是本段要推出的条件。<\/p>\n<p>本项最终仍要根据“collective scrutiny and acceptance”和个人转向“the community”这处局部原文判断。前者给出集体动作，后者再次限定参与范围，两句共同支持B所说的多人参与。这里排除A，不是在断言科学不需要严格检查，而是它未像B一样准确抓住本段明示的条件。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. shared efforts","raw":"### B. shared efforts\n\n> 共同努力\n\n**做题模式中的状态：** 当时由`collective scrutiny and acceptance`及个人研究者走向`community`，第一轮保留B，但A的检查动作也接近局部原文，因此先留下A、B两项；35题主旨确定后，回查两项对形成过程的概括，最终选择B。\n\n**选项类型：正确跨句概括。**\n\nB把`collective scrutiny and acceptance`中的集体行动概括成`shared efforts`，又用后一句个人走向共同体的变化确认参与范围。它不把共同努力说成意见从一开始就完全一致，而是说明可信度需要多人共同处理主张才能形成。\n\n**出处：**\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.\n>\n> This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,782,354,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q32-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>collective scrutiny and acceptance<\/code>及个人研究者走向<code>community<\/code>，第一轮保留B，但A的检查动作也接近局部原文，因此先留下A、B两项；35题主旨确定后，回查两项对形成过程的概括，最终选择B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B把<code>collective scrutiny and acceptance<\/code>中的集体行动概括成<code>shared efforts<\/code>，又用后一句个人走向共同体的变化确认参与范围。它不把共同努力说成意见从一开始就完全一致，而是说明可信度需要多人共同处理主张才能形成。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. shared efforts","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 从第二段可以推断，可信度形成过程需要共同努力。\n\n题干的`requires`对应`it takes`，B的`shared`对应`collective`；后一句又用`individual researcher`与`community`的对比说明这个“共同”涉及怎样的参与范围。\n\n第一处原文提供具体行动：对发现主张进行集体审视和接受，使它转成成熟发现。第二处提供转化方向：个人当下、当地的认识要变成共同体可以接受的发现，两句共同说明这件事不能只停在个人提出主张。\n\nB中的`efforts`概括原文列出的处理活动，`shared`保留集体参与这一共同属性。它没有将参与者限制为发现者，也没有把审视缩成某一种单独的检查标准。\n\n这里的共同努力并不要求所有人从开始就赞同同一主张。审视本来可以包含质疑，接受也要经过过程；选项只说转化需要多人参与，没有额外推出意见永远一致或个人完全不发挥作用。\n\nB把两句中的集体行动和个人走向共同体概括成共同努力，既保留了所需动作的共同性质，也保留了完成转化的参与范围。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,782,354,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q32-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>collective scrutiny and acceptance<\/code>及个人研究者走向<code>community<\/code>，第一轮保留B，但A的检查动作也接近局部原文，因此先留下A、B两项；35题主旨确定后，回查两项对形成过程的概括，最终选择B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B把<code>collective scrutiny and acceptance<\/code>中的集体行动概括成<code>shared efforts<\/code>，又用后一句个人走向共同体的变化确认参与范围。它不把共同努力说成意见从一开始就完全一致，而是说明可信度需要多人共同处理主张才能形成。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要共同努力。<\/p>\n<\/blockquote>\n<p>题干的<code>requires<\/code>对应<code>it takes<\/code>，B的<code>shared<\/code>对应<code>collective<\/code>；后一句又用<code>individual researcher<\/code>与<code>community<\/code>的对比说明这个“共同”涉及怎样的参与范围。<\/p>\n<p>第一处原文提供具体行动：对发现主张进行集体审视和接受，使它转成成熟发现。第二处提供转化方向：个人当下、当地的认识要变成共同体可以接受的发现，两句共同说明这件事不能只停在个人提出主张。<\/p>\n<p>B中的<code>efforts<\/code>概括原文列出的处理活动，<code>shared<\/code>保留集体参与这一共同属性。它没有将参与者限制为发现者，也没有把审视缩成某一种单独的检查标准。<\/p>\n<p>这里的共同努力并不要求所有人从开始就赞同同一主张。审视本来可以包含质疑，接受也要经过过程；选项只说转化需要多人参与，没有额外推出意见永远一致或个人完全不发挥作用。<\/p>\n<p>B把两句中的集体行动和个人走向共同体概括成共同努力，既保留了所需动作的共同性质，也保留了完成转化的参与范围。<\/p>\n<\/section>"},{"title":"B. shared efforts","raw":"#### 写作视角法\n\n原文在结尾回收这一过程时是这样写的：\n\n> “We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”\n>\n> 我们共同推理，相互质疑、修正并补全彼此的推理及对理性的认识。\n\n文章由第二段的集体审视和接受，经过第三段的不同参与者，最终写到相互推理、质疑与修正。结尾具体说明共同努力可以包含分歧和修订，而不是把主张交给某个人独自定论。\n\n如果B真是作者的意思，文章至少得写成：\n\n> A discovery claim gains credibility through the shared work of people who scrutinize it, challenge it, and help develop it into knowledge accepted by the community.\n>\n> 发现主张通过人们共同审视、质疑和推进，发展成共同体接受的知识，从而获得可信度。\n\n这段假设写法要求多人共同参与转化，文章已有的推进正好满足它：第二段明确写集体条件，后文展开参与者与相互推理。B没有额外添加一种文章之外的形成方式。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,782,354,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q32-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>collective scrutiny and acceptance<\/code>及个人研究者走向<code>community<\/code>，第一轮保留B，但A的检查动作也接近局部原文，因此先留下A、B两项；35题主旨确定后，回查两项对形成过程的概括，最终选择B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B把<code>collective scrutiny and acceptance<\/code>中的集体行动概括成<code>shared efforts<\/code>，又用后一句个人走向共同体的变化确认参与范围。它不把共同努力说成意见从一开始就完全一致，而是说明可信度需要多人共同处理主张才能形成。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要共同努力。<\/p>\n<\/blockquote>\n<p>题干的<code>requires<\/code>对应<code>it takes<\/code>，B的<code>shared<\/code>对应<code>collective<\/code>；后一句又用<code>individual researcher<\/code>与<code>community<\/code>的对比说明这个“共同”涉及怎样的参与范围。<\/p>\n<p>第一处原文提供具体行动：对发现主张进行集体审视和接受，使它转成成熟发现。第二处提供转化方向：个人当下、当地的认识要变成共同体可以接受的发现，两句共同说明这件事不能只停在个人提出主张。<\/p>\n<p>B中的<code>efforts<\/code>概括原文列出的处理活动，<code>shared<\/code>保留集体参与这一共同属性。它没有将参与者限制为发现者，也没有把审视缩成某一种单独的检查标准。<\/p>\n<p>这里的共同努力并不要求所有人从开始就赞同同一主张。审视本来可以包含质疑，接受也要经过过程；选项只说转化需要多人参与，没有额外推出意见永远一致或个人完全不发挥作用。<\/p>\n<p>B把两句中的集体行动和个人走向共同体概括成共同努力，既保留了所需动作的共同性质，也保留了完成转化的参与范围。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-2\"><h3>写作视角法<\/h3>\n<p>原文在结尾回收这一过程时是这样写的：<\/p>\n<blockquote>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>我们共同推理，相互质疑、修正并补全彼此的推理及对理性的认识。<\/p>\n<\/blockquote>\n<p>文章由第二段的集体审视和接受，经过第三段的不同参与者，最终写到相互推理、质疑与修正。结尾具体说明共同努力可以包含分歧和修订，而不是把主张交给某个人独自定论。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim gains credibility through the shared work of people who scrutinize it, challenge it, and help develop it into knowledge accepted by the community.<\/p>\n<p>发现主张通过人们共同审视、质疑和推进，发展成共同体接受的知识，从而获得可信度。<\/p>\n<\/blockquote>\n<p>这段假设写法要求多人共同参与转化，文章已有的推进正好满足它：第二段明确写集体条件，后文展开参与者与相互推理。B没有额外添加一种文章之外的形成方式。<\/p>\n<\/section>"},{"title":"B. shared efforts","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认本题要找推动发现主张逐渐获得可信度的条件，具体由谁参与、通过什么行动完成，还需要第二段及全文展开来确定。\n\nB实际说的是：\n\n> shared efforts  \n> 共同努力\n\n文章把可信度形成展开成个人主张交由共同体审视、处理和接受的过程，B正好保留其中的共同参与。它既能包容检查，也能包容质疑、修正与接受，不把形成过程压成检查强度这一个维度。\n\n本项最终仍要根据“collective scrutiny and acceptance”以及个人转向“the community”这处局部原文判断。前句给出共同动作，后句补出参与范围；两句先支撑B，全文的形成过程再与这个概括互相印证。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,782,354,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q32-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由<code>collective scrutiny and acceptance<\/code>及个人研究者走向<code>community<\/code>，第一轮保留B，但A的检查动作也接近局部原文，因此先留下A、B两项；35题主旨确定后，回查两项对形成过程的概括，最终选择B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B把<code>collective scrutiny and acceptance<\/code>中的集体行动概括成<code>shared efforts<\/code>，又用后一句个人走向共同体的变化确认参与范围。它不把共同努力说成意见从一开始就完全一致，而是说明可信度需要多人共同处理主张才能形成。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度 rong><\/p>\n<\/section>"},{"title":"C. individual wisdom","raw":"### C. individual wisdom\n\n> 个人智慧\n\n**做题模式中的状态：** 当时把`individual researcher`看作主张的起点，而把`collective scrutiny and acceptance`看作转化条件；C把条件落回个人智慧，与这一区别不符，第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用原文中的个人研究者，却把提出主张的个人身份改成可信度形成所依靠的条件。原文没有否定个人智慧的价值，但这段明确说明主张要通过集体审视和接受，不能用起点的个人取代完成转化的共同体。\n\n**出处：**\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.\n>\n> This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,867,452,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q32-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>个人智慧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>individual researcher<\/code>看作主张的起点，而把<code>collective scrutiny and acceptance<\/code>看作转化条件；C把条件落回个人智慧，与这一区别不符，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用原文中的个人研究者，却把提出主张的个人身份改成可信度形成所依靠的条件。原文没有否定个人智慧的价值，但这段明确说明主张要通过集体审视和接受，不能用起点的个人取代完成转化的共同体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. individual wisdom","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 从第二段可以推断，可信度形成过程需要个人智慧。\n\nC的`individual`在原文中确实出现，但它修饰`researcher`，处在`becomes`所连接的起点一侧。题干的`requires`则应对应前一句`it takes`后面的集体审视和接受，两处不能因都涉及研究者就相互替换。\n\n出处先说明什么能使发现主张转成成熟发现，再把转化方向写成从个人走向共同体。个人提供的是待处理的主张，集体审视与接受才是这一段明说的形成条件。\n\nC把条件写成`individual wisdom`，把参与范围收回个人，并增加“智慧”这一解释。第二段并未评价发现者是否聪明，也没有说个人能力达到某个程度就能完成可信度转化。\n\n这不意味着个人智慧对科学发现没有作用。题目限定的是本段所说明的可信度形成过程，不能把发现主张可能需要个人思考这一常识，替代文章明确给出的共同体处理关系。\n\nC把转化起点中的个人身份改成了完成转化的关键条件，丢掉了`collective`以及个人走向共同体这两处共同确定的参与范围。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,867,452,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q32-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>个人智慧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>individual researcher<\/code>看作主张的起点，而把<code>collective scrutiny and acceptance<\/code>看作转化条件；C把条件落回个人智慧，与这一区别不符，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用原文中的个人研究者，却把提出主张的个人身份改成可信度形成所依靠的条件。原文没有否定个人智慧的价值，但这段明确说明主张要通过集体审视和接受，不能用起点的个人取代完成转化的共同体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要个人智慧。<\/p>\n<\/blockquote>\n<p>C的<code>individual<\/code>在原文中确实出现，但它修饰<code>researcher<\/code>，处在<code>becomes<\/code>所连接的起点一侧。题干的<code>requires<\/code>则应对应前一句<code>it takes<\/code>后面的集体审视和接受，两处不能因都涉及研究者就相互替换。<\/p>\n<p>出处先说明什么能使发现主张转成成熟发现，再把转化方向写成从个人走向共同体。个人提供的是待处理的主张，集体审视与接受才是这一段明说的形成条件。<\/p>\n<p>C把条件写成<code>individual wisdom<\/code>，把参与范围收回个人，并增加“智慧”这一解释。第二段并未评价发现者是否聪明，也没有说个人能力达到某个程度就能完成可信度转化。<\/p>\n<p>这不意味着个人智慧对科学发现没有作用。题目限定的是本段所说明的可信度形成过程，不能把发现主张可能需要个人思考这一常识，替代文章明确给出的共同体处理关系。<\/p>\n<p>C把转化起点中的个人身份改成了完成转化的关键条件，丢掉了<code>collective<\/code>以及个人走向共同体这两处共同确定的参与范围。<\/p>\n<\/section>"},{"title":"C. individual wisdom","raw":"#### 写作视角法\n\n原文在主张公开以后接着写道：\n\n> Once a discovery claim becomes public, the discoverer receives intellectual credit.\n>\n> But, unlike with mining claims, the community takes control of what happens next.\n>\n> 发现者获得智力贡献的荣誉，但主张接下来如何发展，由共同体接管。\n\n作者保留发现者的贡献，却用`But`把贡献归属与后续处理分开。个人获得荣誉，并不表示可信度接下来仍由其个人智慧独自建立。\n\n如果C真是作者的意思，文章至少得写成：\n\n> After making a discovery claim, the individual researcher relies on personal wisdom to turn it into a credible discovery.\n>\n> 提出发现主张后，个人研究者依靠自身智慧，把它转化为可信发现。\n\n假设写法要让个人智慧承担转化，才能支持C；实际文章却把后续控制交给共同体，并继续列出其他参与者。发现者的贡献被承认，但文章没有因此把共同体的作用收回个人。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,867,452,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q32-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>个人智慧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>individual researcher<\/code>看作主张的起点，而把<code>collective scrutiny and acceptance<\/code>看作转化条件；C把条件落回个人智慧，与这一区别不符，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用原文中的个人研究者，却把提出主张的个人身份改成可信度形成所依靠的条件。原文没有否定个人智慧的价值，但这段明确说明主张要通过集体审视和接受，不能用起点的个人取代完成转化的共同体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要个人智慧。<\/p>\n<\/blockquote>\n<p>C的<code>individual<\/code>在原文中确实出现，但它修饰<code>researcher<\/code>，处在<code>becomes<\/code>所连接的起点一侧。题干的<code>requires<\/code>则应对应前一句<code>it takes<\/code>后面的集体审视和接受，两处不能因都涉及研究者就相互替换。<\/p>\n<p>出处先说明什么能使发现主张转成成熟发现，再把转化方向写成从个人走向共同体。个人提供的是待处理的主张，集体审视与接受才是这一段明说的形成条件。<\/p>\n<p>C把条件写成<code>individual wisdom<\/code>，把参与范围收回个人，并增加“智慧”这一解释。第二段并未评价发现者是否聪明，也没有说个人能力达到某个程度就能完成可信度转化。<\/p>\n<p>这不意味着个人智慧对科学发现没有作用。题目限定的是本段所说明的可信度形成过程，不能把发现主张可能需要个人思考这一常识，替代文章明确给出的共同体处理关系。<\/p>\n<p>C把转化起点中的个人身份改成了完成转化的关键条件，丢掉了<code>collective<\/code>以及个人走向共同体这两处共同确定的参与范围。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-2\"><h3>写作视角法<\/h3>\n<p>原文在主张公开以后接着写道：<\/p>\n<blockquote>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit.<\/p>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>发现者获得智力贡献的荣誉，但主张接下来如何发展，由共同体接管。<\/p>\n<\/blockquote>\n<p>作者保留发现者的贡献，却用<code>But<\/code>把贡献归属与后续处理分开。个人获得荣誉，并不表示可信度接下来仍由其个人智慧独自建立。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>After making a discovery claim, the individual researcher relies on personal wisdom to turn it into a credible discovery.<\/p>\n<p>提出发现主张后，个人研究者依靠自身智慧，把它转化为可信发现。<\/p>\n<\/blockquote>\n<p>假设写法要让个人智慧承担转化，才能支持C；实际文章却把后续控制交给共同体，并继续列出其他参与者。发现者的贡献被承认，但文章没有因此把共同体的作用收回个人。<\/p>\n<\/section>"},{"title":"C. individual wisdom","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认题目问的是推动可信度形成的条件，不能单独判断这一条件属于个人能力还是共同体的参与。\n\n但C实际说的是：\n\n> individual wisdom  \n> 个人智慧\n\n把文章的展开补回主旨，可信度形成不是停在个人提出主张，而是继续经过共同体的处理。C把回答放在个人智慧上，没有保留这个形成过程中的参与范围变化。\n\n本项最终仍要根据“collective scrutiny and acceptance”这处局部原文判断。它明说条件来自集体行动，后一句又从个人写到共同体；不能因为主旨涉及科学，就用关于个人智慧的常识代替这些原句。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,867,452,58],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q32-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>个人智慧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>individual researcher<\/code>看作主张的起点，而把<code>collective scrutiny and acceptance<\/code>看作转化条件；C把条件落回个人智慧，与这一区别不符，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用原文中的个人研究者，却把提出主张的个人身份改成可信度形成所依靠的条件。原文没有否定个人智慧的价值，但这段明确说明主张要通过集体审视和接受，不能用起点的个人取代完成转化的共同体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要个人智慧。<\/p>\n<\/blockquote>\n<p>C的<code>individual<\/code>在原文中确实出现，但它修饰<code>researcher<\/code>，处在<code>becomes<\/code>所连接的起点一侧。题干的<code>requires<\/code>则应对应前一句<code>it takes<\/code>后面的集体审视和接受，两处不能因都涉及研究者就相互替换。<\/p>\n<p>出处先说明什么能使发现主张转成成熟发现，再把转化方向写成从个人走向共同体。个人提供的是待处理的主张，集体审视与接受才是这一段明说的形成条件。<\/p>\n<p>C把条件写成<code>individual wisdom<\/code>，把参与范围收回个人，并增加“智慧”这一解释。第二段并未评价发现者是否聪明，也没有说个人能力达到某个程度就能完成可信度转化。<\/p>\n<p>这不意味着个人智慧对科学发现没有作用。题目限定的是本段所说明的可信度形成过程，不能把发现主张可能需要个人思考这一常识，替代文章明确给出的共同体处理关系。<\/p>\n<p>C把转化起点中的个人身份改成了完成转化的关键条件，丢掉了<code>collective<\/code>以及个人走向共同体这两处共同确定的参与范围。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-2\"><h3>写作视角法<\/h3>\n<p>原文在主张公开以后接着写道：<\/p>\n<blockquote>\n<p>Once a discovery claim becomes public, the discoverer receives intellectual credit.<\/p>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>发现者获得智力贡献的荣誉，但主张接下来如何发展，由共同体接管。<\/p>\n<\/blockquote>\n<p>作者保留发现者的贡献，却用<code>But<\/code>把贡献归属与后续处理分开。个人获得荣誉，并不表示可信度接下来仍由其个人智慧独自建立。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>After making a discovery claim, the individual researcher relies on personal wisdom to turn it into a credible discovery.<\/p>\n<p>提出发现主张后，个人研究者依靠自身智慧，把它转化为可信发现。<\/p>\n<\/blockquote>\n<p>假设写法要让个人智慧承担转化，才能支持C；实际文章却把后续控制交给共同体，并继续列出其他参与者。发现者的贡献被承认，但文章没有因此把共同体的作用收回个人。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认题目问的是推动可信度形成的条件，不能单独判断这一条件属于个人能力还是共同体的参与。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>individual wisdom<br>个人智慧<\/p>\n<\/blockquote>\n<p>把文章的展开补回主旨，可信度形成不是停在个人提出主张，而是继续经过共同体的处理。C把回答放在个人智慧上，没有保留这个形成过程中的参与范围变化。<\/p>\n<p>本项最终仍要根据“collective scrutiny and acceptance”这处局部原文判断。它明说条件来自集体行动，后一句又从个人写到共同体；不能因为主旨涉及科学，就用关于个人智慧的常识代替这些原句。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. persistent innovation","raw":"### D. persistent innovation\n\n> 持续创新\n\n**做题模式中的状态：** 当时读到`transform a discovery claim`，理解为处理已经提出的主张；D说不断创新，没有接上集体审视和接受这一转化条件，第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\nD容易借科学发现与新主张的语境，补出“要获得可信度就必须持续创新”的要求。第二段处理的是已有主张怎样变成成熟发现，没有把不断产生新东西、持续维持创新写成这项转化的条件。\n\n**命题人借用的原文材料：**\n\n> Consequently, discovery claims should be thought of as protoscience.\n>\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,952,498,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q32-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>持续创新<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>transform a discovery claim<\/code>，理解为处理已经提出的主张；D说不断创新，没有接上集体审视和接受这一转化条件，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D容易借科学发现与新主张的语境，补出“要获得可信度就必须持续创新”的要求。第二段处理的是已有主张怎样变成成熟发现，没有把不断产生新东西、持续维持创新写成这项转化的条件。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. persistent innovation","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从第二段可以推断，可信度形成过程需要持续创新。\n\n题干限定第二段，原文的`discovery claims`提供科学发现这一背景，`transform a discovery claim`说明所讨论的任务。D的`innovation`虽与发现新东西有关，却不能直接对应`transform`在这里的具体对象和结果。\n\n出处把一个已经存在的发现主张视为初步科学，再说明它需要集体审视与接受才能变成成熟发现。发生变化的是这项主张的成熟程度与共同体认可状态，不是要求研究者接连另提新主张。\n\nD的`persistent`额外增加持续性，`innovation`则把活动改成不断创新。原文没有建立“若不持续创新，某一已有主张便不能获得可信度”的必要关系，也没有给创新频率设定条件。\n\n后来第四段确实谈新颖发现及挑战，但那是在说明可信度过程中的悖论，不能倒填成第二段未曾提出的持续创新要求。新主张值得探索，与一个主张必须靠持续创新才变可信，是两个不同命题。\n\nD借科学发现的背景补出了持续创新这一条件，改变了原文处理已有主张的任务，并增加了没有依据的时间与必要性要求。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,952,498,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q32-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>持续创新<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>transform a discovery claim<\/code>，理解为处理已经提出的主张；D说不断创新，没有接上集体审视和接受这一转化条件，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D容易借科学发现与新主张的语境，补出“要获得可信度就必须持续创新”的要求。第二段处理的是已有主张怎样变成成熟发现，没有把不断产生新东西、持续维持创新写成这项转化的条件。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要持续创新。<\/p>\n<\/blockquote>\n<p>题干限定第二段，原文的<code>discovery claims<\/code>提供科学发现这一背景，<code>transform a discovery claim<\/code>说明所讨论的任务。D的<code>innovation<\/code>虽与发现新东西有关，却不能直接对应<code>transform<\/code>在这里的具体对象和结果。<\/p>\n<p>出处把一个已经存在的发现主张视为初步科学，再说明它需要集体审视与接受才能变成成熟发现。发生变化的是这项主张的成熟程度与共同体认可状态，不是要求研究者接连另提新主张。<\/p>\n<p>D的<code>persistent<\/code>额外增加持续性，<code>innovation<\/code>则把活动改成不断创新。原文没有建立“若不持续创新，某一已有主张便不能获得可信度”的必要关系，也没有给创新频率设定条件。<\/p>\n<p>后来第四段确实谈新颖发现及挑战，但那是在说明可信度过程中的悖论，不能倒填成第二段未曾提出的持续创新要求。新主张值得探索，与一个主张必须靠持续创新才变可信，是两个不同命题。<\/p>\n<p>D借科学发现的背景补出了持续创新这一条件，改变了原文处理已有主张的任务，并增加了没有依据的时间与必要性要求。<\/p>\n<\/section>"},{"title":"D. persistent innovation","raw":"#### 写作视角法\n\n原文对初步主张接下来的变化是这样写的：\n\n> This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.\n>\n> Objective knowledge is the goal, not the starting point.\n>\n> 可信度过程使个人当下、当地的主张走向共同体可以接受的认识，客观知识是要达到的目标。\n\n作者沿着同一个主张的地位变化往下写：它从个人认识走向共同体知识。接下来的共同体分工解释这种变化怎样发生，而不是要求发现者一边求认可、一边持续产出新发现。\n\n如果D真是作者的意思，文章至少得写成：\n\n> A discovery claim cannot gain credibility unless researchers continue to innovate throughout the process.\n>\n> 研究者必须在整个过程中持续创新，发现主张才能获得可信度。\n\n假设写法必须把持续创新设为获得可信度的前提，才能支持D。实际写法给出的前提却是集体审视和接受，并用个人走向共同体解释结果；它没有加入这项额外要求。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,952,498,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q32-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>持续创新<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>transform a discovery claim<\/code>，理解为处理已经提出的主张；D说不断创新，没有接上集体审视和接受这一转化条件，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D容易借科学发现与新主张的语境，补出“要获得可信度就必须持续创新”的要求。第二段处理的是已有主张怎样变成成熟发现，没有把不断产生新东西、持续维持创新写成这项转化的条件。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要持续创新。<\/p>\n<\/blockquote>\n<p>题干限定第二段，原文的<code>discovery claims<\/code>提供科学发现这一背景，<code>transform a discovery claim<\/code>说明所讨论的任务。D的<code>innovation<\/code>虽与发现新东西有关，却不能直接对应<code>transform<\/code>在这里的具体对象和结果。<\/p>\n<p>出处把一个已经存在的发现主张视为初步科学，再说明它需要集体审视与接受才能变成成熟发现。发生变化的是这项主张的成熟程度与共同体认可状态，不是要求研究者接连另提新主张。<\/p>\n<p>D的<code>persistent<\/code>额外增加持续性，<code>innovation<\/code>则把活动改成不断创新。原文没有建立“若不持续创新，某一已有主张便不能获得可信度”的必要关系，也没有给创新频率设定条件。<\/p>\n<p>后来第四段确实谈新颖发现及挑战，但那是在说明可信度过程中的悖论，不能倒填成第二段未曾提出的持续创新要求。新主张值得探索，与一个主张必须靠持续创新才变可信，是两个不同命题。<\/p>\n<p>D借科学发现的背景补出了持续创新这一条件，改变了原文处理已有主张的任务，并增加了没有依据的时间与必要性要求。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文对初步主张接下来的变化是这样写的：<\/p>\n<blockquote>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<p>Objective knowledge is the goal, not the starting point.<\/p>\n<p>可信度过程使个人当下、当地的主张走向共同体可以接受的认识，客观知识是要达到的目标。<\/p>\n<\/blockquote>\n<p>作者沿着同一个主张的地位变化往下写：它从个人认识走向共同体知识。接下来的共同体分工解释这种变化怎样发生，而不是要求发现者一边求认可、一边持续产出新发现。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim cannot gain credibility unless researchers continue to innovate throughout the process.<\/p>\n<p>研究者必须在整个过程中持续创新，发现主张才能获得可信度。<\/p>\n<\/blockquote>\n<p>假设写法必须把持续创新设为获得可信度的前提，才能支持D。实际写法给出的前提却是集体审视和接受，并用个人走向共同体解释结果；它没有加入这项额外要求。<\/p>\n<\/section>"},{"title":"D. persistent innovation","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认本题要找让已有发现主张逐渐获得可信度的条件，不能判断这个过程是否要求研究者持续创新。\n\n但D实际说的是：\n\n> persistent innovation  \n> 持续创新\n\n主旨中的`Evolution`说可信度逐渐形成，不能被改读成新发现不断增加。D把需要解释的变化从“同一主张怎样变可信”移成“研究者怎样持续创新”，又把后者加为前者的条件。\n\n本项最终仍要根据“it takes collective scrutiny and acceptance to transform a discovery claim”这处局部原文判断。它列出的条件是共同体对主张的处理，没有提出持续创新的要求。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,952,498,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q32-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>持续创新<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到<code>transform a discovery claim<\/code>，理解为处理已经提出的主张；D说不断创新，没有接上集体审视和接受这一转化条件，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D容易借科学发现与新主张的语境，补出“要获得可信度就必须持续创新”的要求。第二段处理的是已有主张怎样变成成熟发现，没有把不断产生新东西、持续维持创新写成这项转化的条件。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Consequently, discovery claims should be thought of as protoscience.<\/p>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a mature discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要持续创新。<\/p>\n<\/blockquote>\n<p>题干限定第二段，原文的<code>discovery claims<\/code>提供科学发现这一背景，<code>transform a discovery claim<\/code>说明所讨论的任务。D的<code>innovation<\/code>虽与发现新东西有关，却不能直接对应<code>transform<\/code>在这里的具体对象和结果。<\/p>\n<p>出处把一个已经存在的发现主张视为初步科学，再说明它需要集体审视与接受才能变成成熟发现。发生变化的是这项主张的成熟程度与共同体认可状态，不是要求研究者接连另提新主张。<\/p>\n<p>D的<code>persistent<\/code>额外增加持续性，<code>innovation<\/code>则把活动改成不断创新。原文没有建立“若不持续创新，某一已有主张便不能获得可信度”的必要关系，也没有给创新频率设定条件。<\/p>\n<p>后来第四段确实谈新颖发现及挑战，但那是在说明可信度过程中的悖论，不能倒填成第二段未曾提出的持续创新要求。新主张值得探索，与一个主张必须靠持续创新才变可信，是两个不同命题。<\/p>\n<p>D借科学发现的背景补出了持续创新这一条件，改变了原文处理已有主张的任务，并增加了没有依据的时间与必要性要求。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文对初步主张接下来的变化是这样写的：<\/p>\n<blockquote>\n<p>This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.<\/p>\n<p>Objective knowledge is the goal, not the starting point.<\/p>\n<p>可信度过程使个人当下、当地的主张走向共同体可以接受的认识，客观知识是要达到的目标。<\/p>\n<\/blockquote>\n<p>作者沿着同一个主张的地位变化往下写：它从个人认识走向共同体知识。接下来的共同体分工解释这种变化怎样发生，而不是要求发现者一边求认可、一边持续产出新发现。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim cannot gain credibility unless researchers continue to innovate throughout the process.<\/p>\n<p>研究者必须在整个过程中持续创新，发现主张才能获得可信度。<\/p>\n<\/blockquote>\n<p>假设写法必须把持续创新设为获得可信度的前提，才能支持D。实际写法给出的前提却是集体审视和接受，并用个人走向共同体解释结果；它没有加入这项额外要求。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认本题要找让已有发现主张逐渐获得可信度的条件，不能判断这个过程是否要求研究者持续创新。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>persistent innovation<br>持续创新<\/p>\n<\/blockquote>\n<p>主旨中的<code>Evolution<\/code>说可信度逐渐形成，不能被改读成新发现不断增加。D把需要解释的变化从“同一主张怎样变可信”移成“研究者怎样持续创新”，又把后者加为前者的条件。<\/p>\n<p>本项最终仍要根据“it takes collective scrutiny and acceptance to transform a discovery claim”这处局部原文判断。它列出的条件是共同体对主张的处理，没有提出持续创新的要求。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. B. shared efforts**\n\nA借用了检查动作，却把集体参与改为严格程度，没有概括本段所强调的形成条件。\n\nB概括集体审视、接受以及个人走向共同体这两句共同说明的多人参与。\n\nC借个人研究者这一转化起点，把完成转化的共同体条件改成个人智慧。\n\nD借科学发现的语境，额外添加持续创新是获得可信度所需条件的命题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[18,612,1465,408],"sourceW":1732,"sourceH":2566},"meta":{"kind":"conclusion","question":32},"level":3,"html":"<blockquote>\n<p><strong>32. B. shared efforts<\/strong><\/p>\n<\/blockquote>\n<p>A借用了检查动作，却把集体参与改为严格程度，没有概括本段所强调的形成条件。<\/p>\n<p>B概括集体审视、接受以及个人走向共同体这两句共同说明的多人参与。<\/p>\n<p>C借个人研究者这一转化起点，把完成转化的共同体条件改成个人智慧。<\/p>\n<p>D借科学发现的语境，额外添加持续创新是获得可信度所需条件的命题。<\/p>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> Paragraph 3 shows that a discovery claim becomes credible after it ______.  \n> 第3段表明，一项发现主张在经历什么之后会变得可信？\n\n### 题型\n\n具体细节题。题干用`Paragraph 3`限定第3段，询问`a discovery claim becomes credible`之前经历了什么。重点是从个人提出主张到共同体认可发现的转化过程，不能把公开、发表、被使用等某一个环节直接当成可信度形成的全部条件。\n\n### 核心出处\n\n> But, unlike with mining claims, the community takes control of what happens next.\n>\n> Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.\n>\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n\n第一句把公开之后的后续过程交给共同体；第二句列出研究者、编辑和审稿人、其他科学家以及公众在这个过程中的不同作用；第三句给出题干所问的结果：共同与相互竞争的看法经过互动、交锋，使个人主张转成共同体的可信发现。\n\n题干的`becomes credible`对应末句的`transforms ... into ... credible discovery`。因此，要回答的是共同体怎样检验和处理主张，而不是只找一个在时间上出现过的动作。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[18,1122,1456,408],"sourceW":1732,"sourceH":2566},"meta":{"kind":"question","question":33},"level":2,"html":"<blockquote>\n<p>Paragraph 3 shows that a discovery claim becomes credible after it ______.<br>第3段表明，一项发现主张在经历什么之后会变得可信？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题。题干用<code>Paragraph 3<\/code>限定第3段，询问<code>a discovery claim becomes credible<\/code>之前经历了什么。重点是从个人提出主张到共同体认可发现的转化过程，不能把公开、发表、被使用等某一个环节直接当成可信度形成的全部条件。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<p>第一句把公开之后的后续过程交给共同体；第二句列出研究者、编辑和审稿人、其他科学家以及公众在这个过程中的不同作用；第三句给出题干所问的结果：共同与相互竞争的看法经过互动、交锋，使个人主张转成共同体的可信发现。<\/p>\n<p>题干的<code>becomes credible<\/code>对应末句的<code>transforms ... into ... credible discovery<\/code>。因此，要回答的是共同体怎样检验和处理主张，而不是只找一个在时间上出现过的动作。<\/p>\n"},{"title":"A. has attracted the attention of the general public","raw":"### A. has attracted the attention of the general public\n\n> 吸引了普通公众的注意。\n\n**做题模式中的状态：** 当时A的英文没有遮挡，第3段中的`accompanying`、`confrontation`等词显示为`[xxx]`。第一轮已读出公众接收新发现，以及主张在共同体互动中发生转化；将这两层与A的“吸引公众注意后变可信”比较，发现原文没有把公众注意写成转化条件，因此排除A，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用了公众接收新发现这一真实环节，把公众接触信息改成发现吸引注意，并把这一动作放到主张变可信的条件位置。原文在列举参与者后另用一句交代转化力量：共同体内部不同看法的互动与交锋。公众接触发现与共同体检验主张不是同一层信息。\n\n**出处：**\n\n> Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.\n>\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1207,1040,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q33-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，第3段中的<code>accompanying<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮已读出公众接收新发现，以及主张在共同体互动中发生转化；将这两层与A的“吸引公众注意后变可信”比较，发现原文没有把公众注意写成转化条件，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了公众接收新发现这一真实环节，把公众接触信息改成发现吸引注意，并把这一动作放到主张变可信的条件位置。原文在列举参与者后另用一句交代转化力量：共同体内部不同看法的互动与交锋。公众接触发现与共同体检验主张不是同一层信息。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. has attracted the attention of the general public","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第3段表明，一项发现主张在吸引普通公众注意之后会变得可信。\n\n用题干的`Paragraph 3`找到第3段，A的`general public`对应长句后部的`the public`；题干的`becomes credible`则对应下一句的`transforms ... into ... credible discovery`。这两个定位点必须放在一起，才能看清公众接收与主张变可信之间有没有A所说的关系。\n\n前一句按参与者分工写过程：编辑和审稿人控制发表，其他科学家使用发现，公众接收发现及可能伴随的技术。它说明发现经过哪些人、怎样进入更广泛的传播和使用过程，没有说受到注意便取得可信地位。\n\n下一句才明确说明转化：主张在共同体中推进，共同与相互竞争的看法发生互动、交锋，由此成为可信发现。句子的转化力量是这些看法之间的检验过程，不能换成公众关注程度。\n\nA的`attracted the attention`也不等于原文的`receives`。接收信息只说明接触到了它，吸引注意则说它引起关注；更关键的是，A把关注放在题干要求的可信度形成条件上，而原文没有建立这条关系。\n\nA借公众这一相同参与者，把“传播过程中接收发现”改成“吸引公众注意后变得可信”，丢掉了不同看法在共同体中接受检验这一决定性环节。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1207,1040,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，第3段中的<code>accompanying<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮已读出公众接收新发现，以及主张在共同体互动中发生转化；将这两层与A的“吸引公众注意后变可信”比较，发现原文没有把公众注意写成转化条件，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了公众接收新发现这一真实环节，把公众接触信息改成发现吸引注意，并把这一动作放到主张变可信的条件位置。原文在列举参与者后另用一句交代转化力量：共同体内部不同看法的互动与交锋。公众接触发现与共同体检验主张不是同一层信息。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在吸引普通公众注意之后会变得可信。<\/p>\n<\/blockquote>\n<p>用题干的<code>Paragraph 3<\/code>找到第3段，A的<code>general public<\/code>对应长句后部的<code>the public<\/code>；题干的<code>becomes credible<\/code>则对应下一句的<code>transforms ... into ... credible discovery<\/code>。这两个定位点必须放在一起，才能看清公众接收与主张变可信之间有没有A所说的关系。<\/p>\n<p>前一句按参与者分工写过程：编辑和审稿人控制发表，其他科学家使用发现，公众接收发现及可能伴随的技术。它说明发现经过哪些人、怎样进入更广泛的传播和使用过程，没有说受到注意便取得可信地位。<\/p>\n<p>下一句才明确说明转化：主张在共同体中推进，共同与相互竞争的看法发生互动、交锋，由此成为可信发现。句子的转化力量是这些看法之间的检验过程，不能换成公众关注程度。<\/p>\n<p>A的<code>attracted the attention<\/code>也不等于原文的<code>receives<\/code>。接收信息只说明接触到了它，吸引注意则说它引起关注；更关键的是，A把关注放在题干要求的可信度形成条件上，而原文没有建立这条关系。<\/p>\n<p>A借公众这一相同参与者，把“传播过程中接收发现”改成“吸引公众注意后变得可信”，丢掉了不同看法在共同体中接受检验这一决定性环节。<\/p>\n<\/section>"},{"title":"A. has attracted the attention of the general public","raw":"#### 写作视角法\n\n原文列出公众之后，继续这样写：\n\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n>\n> 主张在共同体中流转时，不同看法的互动与交锋把个人发现主张变成共同体的可信发现。\n\n作者没有在“公众收到发现”处结束解释，而是再推进一层，专门交代转化怎样发生。公众属于过程中的参与者，末句的职责是说明这些社会活动中真正使主张获得可信度的检验关系。\n\n如果A真是作者的意思，文章至少得写成：\n\n> A discovery claim gains credibility when it attracts the attention of the general public.\n>\n> 一项发现主张在吸引普通公众注意时获得可信度。\n\n假设写法只需把公众注意与取得可信度直接连起来，就能支撑A。实际文章连接的是共同体中不同看法的互动、交锋与可信度转化，既没有以公众注意收束段落，也没有把关注程度当成可信程度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1207,1040,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，第3段中的<code>accompanying<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮已读出公众接收新发现，以及主张在共同体互动中发生转化；将这两层与A的“吸引公众注意后变可信”比较，发现原文没有把公众注意写成转化条件，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了公众接收新发现这一真实环节，把公众接触信息改成发现吸引注意，并把这一动作放到主张变可信的条件位置。原文在列举参与者后另用一句交代转化力量：共同体内部不同看法的互动与交锋。公众接触发现与共同体检验主张不是同一层信息。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在吸引普通公众注意之后会变得可信。<\/p>\n<\/blockquote>\n<p>用题干的<code>Paragraph 3<\/code>找到第3段，A的<code>general public<\/code>对应长句后部的<code>the public<\/code>；题干的<code>becomes credible<\/code>则对应下一句的<code>transforms ... into ... credible discovery<\/code>。这两个定位点必须放在一起，才能看清公众接收与主张变可信之间有没有A所说的关系。<\/p>\n<p>前一句按参与者分工写过程：编辑和审稿人控制发表，其他科学家使用发现，公众接收发现及可能伴随的技术。它说明发现经过哪些人、怎样进入更广泛的传播和使用过程，没有说受到注意便取得可信地位。<\/p>\n<p>下一句才明确说明转化：主张在共同体中推进，共同与相互竞争的看法发生互动、交锋，由此成为可信发现。句子的转化力量是这些看法之间的检验过程，不能换成公众关注程度。<\/p>\n<p>A的<code>attracted the attention<\/code>也不等于原文的<code>receives<\/code>。接收信息只说明接触到了它，吸引注意则说它引起关注；更关键的是，A把关注放在题干要求的可信度形成条件上，而原文没有建立这条关系。<\/p>\n<p>A借公众这一相同参与者，把“传播过程中接收发现”改成“吸引公众注意后变得可信”，丢掉了不同看法在共同体中接受检验这一决定性环节。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-2\"><h3>写作视角法<\/h3>\n<p>原文列出公众之后，继续这样写：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>主张在共同体中流转时，不同看法的互动与交锋把个人发现主张变成共同体的可信发现。<\/p>\n<\/blockquote>\n<p>作者没有在“公众收到发现”处结束解释，而是再推进一层，专门交代转化怎样发生。公众属于过程中的参与者，末句的职责是说明这些社会活动中真正使主张获得可信度的检验关系。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim gains credibility when it attracts the attention of the general public.<\/p>\n<p>一项发现主张在吸引普通公众注意时获得可信度。<\/p>\n<\/blockquote>\n<p>假设写法只需把公众注意与取得可信度直接连起来，就能支撑A。实际文章连接的是共同体中不同看法的互动、交锋与可信度转化，既没有以公众注意收束段落，也没有把关注程度当成可信程度。<\/p>\n<\/section>"},{"title":"A. has attracted the attention of the general public","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入33题题干：\n\n> 第3段应当说明发现主张经历怎样的科学共同体活动而取得可信度；需要寻找实际承担检验、转化作用的过程，而不是只看发现是否受到公众关注。\n\n但A实际说的是：\n\n> has attracted the attention of the general public  \n> 吸引了普通公众的注意。\n\n主旨关心的是科学主张怎样变得可信，A关心的却是它怎样进入公众注意之中。两者可能同时出现，但受到注意本身并未说明主张经过怎样的质疑、比较和检验，不能直接填上题干要求的转化过程。\n\n具体条件仍由第3段末句确定：`interaction and confrontation`推动个人主张变成共同体的可信发现。A把前面的传播参与者移到了形成条件的位置，没有保持这层关系。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1207,1040,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q33-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，第3段中的<code>accompanying<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮已读出公众接收新发现，以及主张在共同体互动中发生转化；将这两层与A的“吸引公众注意后变可信”比较，发现原文没有把公众注意写成转化条件，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了公众接收新发现这一真实环节，把公众接触信息改成发现吸引注意，并把这一动作放到主张变可信的条件位置。原文在列举参与者后另用一句交代转化力量：共同体内部不同看法的互动与交锋。公众接触发现与共同体检验主张不是同一层信息。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在吸引普通公众注意之后会变得可信。<\/p>\n<\/blockquote>\n<p>用题干的<code>Paragraph 3<\/code>找到第3段，A的<code>general public<\/code>对应长句后部的<code>the public<\/code>；题干的<code>becomes credible<\/code>则对应下一句的<code>transforms ... into ... credible discovery<\/code>。这两个定位点必须放在一起，才能看清公众接收与主张变可信之间有没有A所说的关系。<\/p>\n<p>前一句按参与者分工写过程：编辑和审稿人控制发表，其他科学家使用发现，公众接收发现及可能伴随的技术。它说明发现经过哪些人、怎样进入更广泛的传播和使用过程，没有说受到注意便取得可信地位。<\/p>\n<p>下一句才明确说明转化：主张在共同体中推进，共同与相互竞争的看法发生互动、交锋，由此成为可信发现。句子的转化力量是这些看法之间的检验过程，不能换成公众关注程度。<\/p>\n<p>A的<code>attracted the attention<\/code>也不等于原文的<code>receives<\/code>。接收信息只说明接触到了它，吸引注意则说它引起关注；更关键的是，A把关注放在题干要求的可信度形成条件上，而原文没有建立这条关系。<\/p>\n<p>A借公众这一相同参与者，把“传播过程中接收发现”改成“吸引公众注意后变得可信”，丢掉了不同看法在共同体中接受检验这一决定性环节。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-2\"><h3>写作视角法<\/h3>\n<p>原文列出公众之后，继续这样写：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>主张在共同体中流转时，不同看法的互动与交锋把个人发现主张变成共同体的可信发现。<\/p>\n<\/blockquote>\n<p>作者没有在“公众收到发现”处结束解释，而是再推进一层，专门交代转化怎样发生。公众属于过程中的参与者，末句的职责是说明这些社会活动中真正使主张获得可信度的检验关系。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim gains credibility when it attracts the attention of the general public.<\/p>\n<p>一项发现主张在吸引普通公众注意时获得可信度。<\/p>\n<\/blockquote>\n<p>假设写法只需把公众注意与取得可信度直接连起来，就能支撑A。实际文章连接的是共同体中不同看法的互动、交锋与可信度转化，既没有以公众注意收束段落，也没有把关注程度当成可信程度。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>第3段应当说明发现主张经历怎样的科学共同体活动而取得可信度；需要寻找实际承担检验、转化作用的过程，而不是只看发现是否受到公众关注。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>has attracted the attention of the general public<br>吸引了普通公众的注意。<\/p>\n<\/blockquote>\n<p>主旨关心的是科学主张怎样变得可信，A关心的却是它怎样进入公众注意之中。两者可能同时出现，但受到注意本身并未说明主张经过怎样的质疑、比较和检验，不能直接填上题干要求的转化过程。<\/p>\n<p>具体条件仍由第3段末句确定：<code>interaction and confrontation<\/code>推动个人主张变成共同体的可信发现。A把前面的传播参与者移到了形成条件的位置，没有保持这层关系。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. has been examined by the scientific community","raw":"### B. has been examined by the scientific community\n\n> 经过科学共同体的检验。\n\n**做题模式中的状态：** 当时B的英文没有遮挡，第3段的`gatekeepers`、`confrontation`等词显示为`[xxx]`。第一轮根据发表过程受到控制、其他科学家使用发现、主张在共同体中推进并经互动转化这些已读信息，将B的共同体检验与整个过程接起来，保留B；其余三项排除后选择B，后续没有改变。\n\n**选项类型：正确跨句概括。**\n\nB用`examined by the scientific community`概括本段展开的多方检验。前面列出的分工说明主张不再只由发现者自己处理，末句的不同看法互动与交锋则说明它如何接受共同体审视并取得可信地位。B保留共同体这一主体和检验后转化这一顺序，没有把一次发表或某个人的认可当成全部过程。\n\n**出处：**\n\n> But, unlike with mining claims, the community takes control of what happens next.\n>\n> Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.\n>\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1292,1047,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"option","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q33-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>经过科学共同体的检验。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，第3段的<code>gatekeepers<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮根据发表过程受到控制、其他科学家使用发现、主张在共同体中推进并经互动转化这些已读信息，将B的共同体检验与整个过程接起来，保留B；其余三项排除后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>examined by the scientific community<\/code>概括本段展开的多方检验。前面列出的分工说明主张不再只由发现者自己处理，末句的不同看法互动与交锋则说明它如何接受共同体审视并取得可信地位。B保留共同体这一主体和检验后转化这一顺序，没有把一次发表或某个人的认可当成全部过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. has been examined by the scientific community","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第3段表明，一项发现主张在经过科学共同体检验之后会变得可信。\n\n题干的`becomes credible`定位本段末句，B的`scientific community`对应前面的共同体分工和末句的`through the community`。`examined`没有逐字出现在这几句中，需要看共同体实际对发现主张做了什么。\n\n本段先说共同体接管后续过程，再分别写发表把关、其他科学家使用以及公众接收。这些分工把主张置于发现者之外的使用和评价之中，说明它不再只是个人自己的声明。\n\n末句补出最关键的一步：关于科学与技术的共同看法和竞争看法相互作用、相互交锋，进而把个人主张转成可信发现。这里的`confrontation`使我们看清，主张经过的并非单纯转发，而是不同认识之间的审视和检验。\n\nB的被动结构让主张成为被检验的对象，检验者是科学共同体；原文的主张同样在共同体内部受到不同看法的检验。原文最后报告它成为可信发现，B接入`after it`也把检验放在可信度取得之前，主体、动作和先后关系一致。\n\nB将前面的共同体分工与后面的观点交锋合成“经过科学共同体检验”，准确概括了段落写出的可信度形成过程；它没有额外要求每位公众成员都亲自做实验，也没有承诺可信发现从此不能再被修改。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1292,1047,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q33-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>经过科学共同体的检验。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，第3段的<code>gatekeepers<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮根据发表过程受到控制、其他科学家使用发现、主张在共同体中推进并经互动转化这些已读信息，将B的共同体检验与整个过程接起来，保留B；其余三项排除后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>examined by the scientific community<\/code>概括本段展开的多方检验。前面列出的分工说明主张不再只由发现者自己处理，末句的不同看法互动与交锋则说明它如何接受共同体审视并取得可信地位。B保留共同体这一主体和检验后转化这一顺序，没有把一次发表或某个人的认可当成全部过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在经过科学共同体检验之后会变得可信。<\/p>\n<\/blockquote>\n<p>题干的<code>becomes credible<\/code>定位本段末句，B的<code>scientific community<\/code>对应前面的共同体分工和末句的<code>through the community<\/code>。<code>examined<\/code>没有逐字出现在这几句中，需要看共同体实际对发现主张做了什么。<\/p>\n<p>本段先说共同体接管后续过程，再分别写发表把关、其他科学家使用以及公众接收。这些分工把主张置于发现者之外的使用和评价之中，说明它不再只是个人自己的声明。<\/p>\n<p>末句补出最关键的一步：关于科学与技术的共同看法和竞争看法相互作用、相互交锋，进而把个人主张转成可信发现。这里的<code>confrontation<\/code>使我们看清，主张经过的并非单纯转发，而是不同认识之间的审视和检验。<\/p>\n<p>B的被动结构让主张成为被检验的对象，检验者是科学共同体；原文的主张同样在共同体内部受到不同看法的检验。原文最后报告它成为可信发现，B接入<code>after it<\/code>也把检验放在可信度取得之前，主体、动作和先后关系一致。<\/p>\n<p>B将前面的共同体分工与后面的观点交锋合成“经过科学共同体检验”，准确概括了段落写出的可信度形成过程；它没有额外要求每位公众成员都亲自做实验，也没有承诺可信发现从此不能再被修改。<\/p>\n<\/section>"},{"title":"B. has been examined by the scientific community","raw":"#### 写作视角法\n\n原文第3段的收束与第5段的总结是这样接起来的：\n\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n>\n> “We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”\n>\n> 第3段用不同看法的互动与交锋说明可信度转化，结尾又把共同推理、质疑、修正和补充作为这一过程的总结。\n\n作者后文继续强调共同体成员怎样相互审视和修正，给第3段的社会过程补上更具体的认识活动。因此，B中的检验并非只指发表前的一次手续，而能概括全文反复说明的共同审视。\n\n如果B真是作者的意思，文章至少得写成：\n\n> A discovery claim becomes credible through examination by the scientific community, whose members test and revise one another’s reasoning.\n>\n> 一项发现主张经过科学共同体的检验而变得可信，共同体成员相互审视并修正彼此的推理。\n\n这一假设所需的推进已经在原文中出现：第3段写主张进入共同体并经观点交锋发生转化，结尾写共同推理、质疑和修正。两处都让可信度来自共同体的处理过程，与B的概括相接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1292,1047,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q33-B-2","html":" 可信度取得之前，主体、动作和先后关系一致。<\/p>\n<p>B将前面的共同体分工与后面的观点交锋合成“经过科学共同体检验”，准确概括了段落写出的可信度形成过程；它没有额外要求每位公众成员都亲自做实验，也没有承诺可信发现从此不能再被修改。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-2\"><h3>写作视角法<\/h3>\n<p>原文第3段的收束与第5段的总结是这样接起来的：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>第3段用不同看法的互动与交锋说明可信度转化，结尾又把共同推理、质疑、修正和补充作为这一过程的总结。<\/p>\n<\/blockquote>\n<p>作者后文继续强调共同体成员怎样相互审视和修正，给第3段的社会过程补上更具体的认识活动。因此，B中的检验并非只指发表前的一次手续，而能概括全文反复说明的共同审视。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim becomes credible through examination by the scientific community, whose members test and revise one another’s reasoning.<\/p>\n<p>一项发现主张经过科学共同体的检验而变得可信，共同体成员相互审视并修正彼此的推理。<\/p>\n<\/blockquote>\n<p>这一假设所需的推进已经在原文中出现：第3段写主张进入共同体并经观点交锋发生转化，结尾写共同推理、质疑和修正。两处都让可信度来自共同体的处理过程，与B的概括相接。<\/p>\n<\/section>"},{"title":"B. has been examined by the scientific community","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Evolution of Credibility in Doing Science  \n> 科学实践中可信度的形成。\n\n把这个主旨直接代入33题题干：\n\n> 一项发现主张应当经过科学实践中的共同审视和检验，才能从个人提出的说法转成共同体承认的可信发现；第3段具体交代了这一转化如何发生。\n\nB实际说的是：\n\n> has been examined by the scientific community  \n> 经过科学共同体的检验。\n\nB的对象是发现主张，处理者是科学共同体，动作是检验，正好回答可信度形成过程中“经历了什么”。它保留从个人主张走向共同体认可的范围，没有把问题换成发现者获得荣誉或发现引起关注。\n\n主旨确定要寻找形成过程，第3段的`interaction and confrontation`则给出检验如何发生的具体依据；B既能承接全文问题，也能概括本段的转化机制。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1292,1047,68],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q33-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>经过科学共同体的检验。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，第3段的<code>gatekeepers<\/code>、<code>confrontation<\/code>等词显示为<code>[xxx]<\/code>。第一轮根据发表过程受到控制、其他科学家使用发现、主张在共同体中推进并经互动转化这些已读信息，将B的共同体检验与整个过程接起来，保留B；其余三项排除后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>examined by the scientific community<\/code>概括本段展开的多方检验。前面列出的分工说明主张不再只由发现者自己处理，末句的不同看法互动与交锋则说明它如何接受共同体审视并取得可信地位。B保留共同体这一主体和检验后转化这一顺序，没有把一次发表或某个人的认可当成全部过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But, unlike with mining claims, the community takes control of what happens next.<\/p>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第3段表明，一项发现主张在经过科学共同体检验之后会变得可信。<\/p>\n<\/blockquote>\n<p>题干的<code>becomes credible<\/code>定位本段末句，B的<code>scientific community<\/code>对应前面的共同体分工和末句的<code>through the community<\/code>。<code>examined<\/code>没有逐字出现在这几句中，需要看共同体实际对发现主张做了什么。<\/p>\n<p>本段先说共同体接管后续过程，再分别写发表把关、其他科学家使用以及公众接收。这些分工把主张置于发现者之外的使用和评价之中，说明它不再只是个人自己的声明。<\/p>\n<p>末句补出最关键的一步：关于科学与技术的共同看法和竞争看法相互作用、相互交锋，进而把个人主张转成可信发现。这里的<code>confrontation<\/code>使我们看清，主张经过的并非单纯转发，而是不同认识之间的审视和检验。<\/p>\n<p>B的被动结构让主张成为被检验的对象，检验者是科学共同体；原文的主张同样在共同体内部受到不同看法的检验。原文最后报告它成为可信发现，B接入<code>after it<\/code>也把检验放在可信度取得之前，主体、动作和先后关系一致。<\/p>\n<p>B将前面的共同体分工与后面的观点交锋合成“经过科学共同体检验”，准确概括了段落写出的可信度形成过程；它没有额外要求每位公众成员都亲自做实验，也没有承诺可信发现从此不能再被修改。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-2\"><h3>写作视角法<\/h3>\n<p>原文第3段的收束与第5段的总结是这样接起来的：<\/p>\n<blockquote>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<p>“We reason together, challenge, revise, and complete each other’s reasoning and each other’s conceptions of reason.”<\/p>\n<p>第3段用不同看法的互动与交锋说明可信度转化，结尾又把共同推理、质疑、修正和补充作为这一过程的总结。<\/p>\n<\/blockquote>\n<p>作者后文继续强调共同体成员怎样相互审视和修正，给第3段的社会过程补上更具体的认识活动。因此，B中的检验并非只指发表前的一次手续，而能概括全文反复说明的共同审视。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A discovery claim becomes credible through examination by the scientific community, whose members test and revise one another’s reasoning.<\/p>\n<p>一项发现主张经过科学共同体的检验而变得可信，共同体成员相互审视并修正彼此的推理。<\/p>\n<\/blockquote>\n<p>这一假设所需的推进已经在原文中出现：第3段写主张进入共同体并经观点交锋发生转化，结尾写共同推理、质疑和修正。两处都让可信度来自共同体的处理过程，与B的概括相接。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Evolution of Credibility in Doing Science<br>科学实践中可信度的形成。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>一项发现主张应当经过科学实践中的共同审视和检验，才能从个人提出的说法转成共同体承认的可信发现；第3段具体交代了这一转化如何发生。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>has been examined by the scientific community<br>经过科学共同体的检验。<\/p>\n<\/blockquote>\n<p>B的对象是发现主张，处理者是科学共同体，动作是检验，正好回答可信度形成过程中“经历了什么”。它保留从个人主张走向共同体认可的范围，没有把问题换成发现者获得荣誉或发现引起关注。<\/p>\n<p>主旨确定要寻找形成过程，第3段的<code>interaction and confrontation<\/code>则给出检验如何发生的具体依据；B既能承接全文问题，也能概括本段的转化机制。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<\/section>"},{"title":"C. has received recognition from editors and reviewers","raw":"### C. has received recognition from editors and revi  and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. has received recognition from editors and reviewers","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第3段表明，一项发现主张在获得编辑和审稿人的认可之后会变得可信。\n\nC的`editors and reviewers`对应本段长句中控制发表过程的人，`recognition`要放在他们的`gatekeepers`角色中理解；题干的`becomes credible`却落在后一句的共同体转化结果上。两处对应的是不同范围的处理。\n\n长句给编辑和审稿人的任务是`controlling the publication process`，即把住发表入口。之后分号仍接着其他科学家怎样使用发现、公众怎样接收发现，说明发表把关不是本段过程的终点。\n\n末句再把这些社会活动提升到认识层面：不同科学与技术看法相互作用、交锋，个人主张由此成为共同体的可信发现。题目要找的是主张经过这一审视过程，而不是只找它获得了哪两类人的认可。\n\nC中的编辑和审稿人确实属于科学共同体，他们的工作也有检验作用；问题不在于认可毫无用处，而在于这一环节的范围不足以概括本段所写的可信度转化。接受发表与共同体形成可信发现不是同一个结果。\n\nC拿发表入口中的认可回答整个转化条件，省去了原文随后专门展开的其他科学家使用与不同看法交锋，因此没有完整接上`becomes credible`所要求的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1376,1128,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q33-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>获得了编辑和审稿人的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C中的<code>recognition<\/code>显示为<code>[xxx]<\/code>，原文的<code>gatekeepers<\/code>也有遮挡。第一轮仍已读出编辑和审稿人控制发表过程，后面还有其他科学家的使用和共同体互动；因此没有把“从编辑和审稿人那里获得某物”当成全部可信度形成过程，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>C抓住了编辑与审稿人把关发表这一实际环节，编辑审稿认可可以对应这一入口，但题干询问的是发现主张怎样获得共同体的可信地位。原文在发表把关之后仍继续写其他 ibly accompanying technology.\n>\n> As a discovery claim works its way through the community, the interaction and confrontation between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n>\n> 发表把关之后，主张仍会被其他科学家使用、被公众接收，并在共同体不同看法的交锋中成为可信发现。\n\n作者不断把参与范围向编辑审稿之外展开，直到段末才交代可信度转化。这样的顺序让发表成为共同体过程中的一环，而非决定可信地位的最终认可。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Recognition from editors and reviewers establishes the credibility of a discovery claim.\n>\n> 编辑和审稿人的认可确立了一项发现主张的可信度。\n\n这段假设只把确立可信度的作用放到编辑审稿认可上，不需要否认后面还会有人使用发现。实际文章却将这个作用明确交给主张在共同体流转时不同看法的互动与交锋；两种写法的区别，是究竟哪个环节完成题干所问的转化。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1376,1128,69],"sourceW":1732,"sourceH":2566},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q33-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>获得了编辑和审稿人的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C中的<code>recognition<\/code>显示为<code>[xxx]<\/code>，原文的<code>gatekeepers<\/code>也有遮挡。第一轮仍已读出编辑和审稿人控制发表过程，后面还有其他科学家的使用和共同体互动；因此没有把“从编辑和审稿人那里获得某物”当成全部可信度形成过程，排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>C抓住了编辑与审稿人把关发表这一实际环节，编辑审稿认可可以对应这一入口，但题干询问的是发现主张怎样获得共同体的可信地位。原文在发表把关之后仍继续写其他科学家的使用、公众接收及不同看法的互动。C把其中一组参与者在发表环节的认可，拿来回答涵盖共同体后续检验的转化过程。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.<\/p>\n<p>As a discovery claim works its way through the community, the i
