o their own uses; and the public receives new knowledge and possibly new technology. Shared and competing beliefs interact and confront one another as the claim moves through this structure. Credibility develops through that social process, rather than simply remaining the private possession of the person who first made the claim.<\/p>\n<h3>44. ______<\/h3>\n<p>The credibility process contains two paradoxes. First, scientists usually look for what is incomplete or wrong in existing knowledge. Merely repeating and confirming familiar beliefs brings little reward. Yet the same search for something new means that even an impressive, convincing discovery remains open to later challenge, revision, or rejection.<\/p>\n<p>Second, the novelty that makes a claim valuable can also make it difficult to believe. The physiologist and Nobel laureate Albert Szent-Györgyi described discovery as seeing what everyone has seen while thinking what no one has thought. But telling people about a possibility they have missed does not necessarily change their minds. A truly new claim may need years to be accepted and appreciated. Science therefore seeks departures from established thought while exposing accepted findings to fresh criticism and new proposals to initial resistance.<\/p>\n<h3>45. ______<\/h3>\n<p>In the end, credibility emerges through a process that philosopher Annette Baier called the “commons of the mind.” People reason together: they challenge, revise, and complete one another&#39;s reasoning, as well as their ideas about reason itself. A discovery claim becomes credible within this continuing exchange.<\/p>\n<p>The phrase also brings the discussion back to Montaigne. The answer to why we believe what we think we know is found, in the case of science, in this shared activity. The argument thus returns to its opening question with an account of mutual examination, rather than ending with the confidence of a single investigator.<\/p>\n<h3>41题解析<\/h3>\n<p><strong>答案：F — A lasting question about the grounds of belief。<\/strong> 中文：一个关于信念依据的持久问题。<\/p>\n<p>这一部分整体在交代：作者怎样接触到“我知道什么、我为什么相信”这个问题，以及它怎样从学生时代的讨论延续到后来对科学实践的思考。写散步、古代思想家和书籍，都是为了建立这条持续追问的线索。<\/p>\n<p>关键证据是首段的 Montaigne&#39;s question 与 Why do we believe what we think we know，随后第二段说 That question did not remain merely a topic for those student conversations。末句进一步把问题限定为 what gives them grounds for believing it，而非仅仅列举科学家的信念。<\/p>\n<p>段内推进链：学生时代读随笔并与朋友讨论 → 接触“我知道什么”的追问 → 延伸为“相信的依据是什么” → 后来的书继续寻找答案 → 明确本文要处理的认识问题。<\/p>\n<p>标题中的 A lasting question 对应从学生讨论到后来著书的延续；grounds of belief 对应最后的“凭什么相信”。两部分同时覆盖时间线和真正的讨论对象，Montaigne的生活地点与藏书则是引入这位提问者的背景。<\/p>\n<p>最强干扰项是A。这里确实提到作者和朋友一起讨论，也提到一本尝试回答问题的书；但本节还没有提出“共同推理如何建立可信度”的答案。把shared answer放在这里，就把引入问题提前写成了论证结论。<\/p>\n<p><strong>最终答案：41选F。<\/strong><\/p>\n<h3>42题解析<\/h3>\n<p><strong>答案：D — Looking beyond an idealized picture of scientific knowledge。<\/strong> 中文：超越关于科学知识的理想化图景。<\/p>\n<p>这一部分整体在拆开“研究者一开始就完全客观、事实只等着被收集”的简单认识，指出科学实践中个人经历、已有知识和兴趣造成的复杂影响。它是在说明理想图景遗漏了什么，不是在否定追求客观的目标。<\/p>\n<p>开头先说科学家容易拿技术成功作答，紧接着用 But that response makes the situation seem simpler than it is 转向限制；第二段的 Actual discovery 与前面的 idealized account 对照。末句明确说 objectivity 仍是aim，只是研究者并非begin free of these influences。<\/p>\n<p>段内推进链：技术成功带来迅速而自信的回答 → 摆出客观研究者收集事实的理想模型 → 转到发现的现实路径 → 列出经历、知识和兴趣的影响 → 修正“客观是天然起点”的假设。<\/p>\n<p>标题中的 idealized picture 对应第一段的理想模型；Looking beyond 对应接下来补入实际研究的复杂性。scientific knowledge覆盖被讨论的知识获取过程，而不是只抓住某项技术成果。<\/p>\n<p>最强干扰项是G。技术成功的确出现在开头，但它属于被进一步审视的简答；sufficient proof却把它写成了已经充分的证明，跨过了But之后的反思，也无法解释第二段为什么集中讲错误和自欺的机会。<\/p>\n<p><strong>最终答案：42选D。<\/strong><\/p>\n<h3>43题解析<\/h3>\n<p><strong>答案：C — From a personal claim to a community&#39;s credible discovery。<\/strong> 中文：从个人的发现声明到共同体认可的可信发现。<\/p>\n<p>这一部分整体在解释可信度形成的转变及其具体运作。首段说明个人声明只是有潜力的起点，需要共同审查和接受；次段说明公开之后由哪些人参与、通过什么互动完成这种转化。<\/p>\n<p>关键证据是第一段的 Communal examination and acceptance are needed，以及从 me, here, now 到 anyone, anywhere, anytime 的变化。第二段末尾又用 develops through that social process 收拢研究者、编辑、审稿人、其他科学家和公众的角色。<\/p>\n<p>段内推进链：发现声明有潜力但尚未成熟 → 共同审查和接受带来可信度 → 声明公开后发现者获得认可 → 共同体接手后续过程 → 不同角色和信念发生互动 → 个人声明转成公共的可信发现。<\/p>\n<p>标题中的 From a personal claim 对应protoscience与个体的时空经验；to a community&#39;s credible discovery对应审查、接受和共同体互动所形成的结果。中间的角色清单不是另起话题，而是解释from到to如何发生。<\/p>\n<p>最强干扰项是B。mining claim与intellectual credit容易让人联想到发现者的权利，但后文明确说发现者 does not control everything that follows，且结尾否定可信度只是私人财产。B把用于比较的矿权细节和应得认可扩大成对知识所有权的保护，方向与主体变化都不合。<\/p>\n<p><strong>最终答案：43选C。<\/strong><\/p>\n<h3>44题解析<\/h3>\n<p><strong>答案：E — The pursuit of novelty and its two difficulties。<\/strong> 中文：对新颖性的追求及其带来的两重困难。<\/p>\n<p>这一部分整体在解释可信度过程中的两个悖论：追求新知让已经可信的发现继续面临挑战，同时新颖本身又可能让新声明遭遇怀疑。两条线都围绕科学为何需要新东西、却不能让新东西自动获得稳定认可展开。<\/p>\n<p>开头直接提出 two paradoxes，随后用 First 与 Second 分开推进。第一部分的 Yet the same search 把奖励新知与继续挑战连接起来；第二部分的 But ... does not necessarily change their minds 则把独特思考与迟缓接受连接起来。<\/p>\n<p>段内推进链：科学寻找现有知识的缺口 → 单纯重复确认缺少奖励 → 连有说服力的发现也将被后人挑战 → 新颖使声明有价值 → 新颖又使其难以被相信 → 真正的新发现可能多年后才获认可。<\/p>\n<p>标题中的 pursuit of novelty覆盖两部分共同的动力；two difficulties分别对应既有发现难以获得终局地位、新颖声明难以立即得到接受。末句把fresh criticism与initial resistance并列，正是对标题两部分的回收。<\/p>\n<p>最强干扰项是C。这一节确实处在可信度形成的大背景中，也谈接受；但它没有完整展开“个人声明经共同体转化”的机制，而是专门讨论这一过程中的两个矛盾。C的范围过宽，会掩盖First、Second共同建立的局部中心。<\/p>\n<p><strong>最终答案：44选E。<\/strong><\/p>\n<h3>45题解析<\/h3>\n<p><strong>答案：A — A shared answer through reasoning together。<\/strong> 中文：通过共同推理形成的回答。<\/p>\n<p>这一部分整体在给全文收束：用“思想的公地”概括可信度如何在共同活动中形成，再把这个概括接回开篇“为什么相信自己所知道的”这一问题。<\/p>\n<p>关键证据是 In the end、People reason together，以及第二段的 brings the discussion back to Montaigne。最后又说 returns to its opening question with an account of mutual examination，明确告诉我们这里已经从提出问题走到解释答案。<\/p>\n<p>段内推进链：以“思想的公地”概括可信度过程 → 解释共同挑战、修正与完善 → 把发现的可信度放入这种持续交流 → 回扣Montaigne的问题 → 以相互审查的过程回答“凭什么相信”。<\/p>\n<p>标题中的 shared 对应并非单个研究者独享的认识活动；reasoning together对应共同推理及相互修正；answer则对应本节回到开头问题并给出解释的收尾功能。<\/p>\n<p>最强干扰项是F。首尾确实重复同一个关于信念依据的问题，但这一节重点已不是问题持续了多久，而是科学如何借共同活动回答它。若只选lasting question，就漏掉本节新增的答案，也无法覆盖Baier的核心概括。<\/p>\n<p><strong>最终答案：45选A。<\/strong><\/p>\n<h2>排序题<\/h2>\n<p>The following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.<\/p>\n<table>\n<thead>\n<tr>\n<th>已给位置<\/th>\n<th>41<\/th>\n<th>42<\/th>\n<th>已给位置<\/th>\n<th>43<\/th>\n<th>44<\/th>\n<th>45<\/th>\n<th>已给位置<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>E<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>[A]<\/h3>\n<p>As a biochemistry graduate student, I read Montaigne&#39;s Essays and spent hours discussing them with a friend as we walked around Boston. The sixteenth-century writer asked, “What do I know?” My later book, Everyday Practice of Science: Where Intuition and Passion Meet Objectivity and Logic, was another attempt to address the issue. Montaigne&#39;s challenge extends beyond listing what we know to asking why we accept it: Why do we believe what we think we know?<\/p>\n<h3>[B]<\/h3>\n<p>The first paradox concerns what the search for new knowledge does to findings that already appear convincing. Scientific work often challenges some part of prevailing knowledge that seems incomplete or incorrect. Little reward comes from simply duplicating and confirming what is already accepted. As a result, even an important discovery remains open to modification or refutation by later researchers. The pursuit of novelty thus keeps established findings provisional. It creates a second difficulty as well.<\/p>\n<h3>[C]<\/h3>\n<p>Scientists may answer that question readily by pointing to the success of technology as evidence for the truth of their work. This confidence fits an idealized picture: objective researchers use a scientific method to observe and collect facts waiting in the world. But the situation is more complicated. What is missing from this picture of an investigator who is already objective?<\/p>\n<h3>[D]<\/h3>\n<p>What it leaves out is the investigator&#39;s own history. In everyday science, discovery follows an ambiguous and complicated route, and researchers cannot escape the influence of their experiences. Prior knowledge and interests shape what they encounter, how they interpret it, and what they do next. Misinterpretation, error, and self-deception are possible at many points. A claim emerging from these circumstances has potential, but cannot yet be treated as a mature discovery.<\/p>\n<h3>[E]<\/h3>\n<p>This potential is what makes a discovery claim resemble a newly staked mining claim. It should be regarded as protoscience until communal scrutiny and acceptance turn it into a full-fledged discovery. The credibility process transforms the individual&#39;s “me, here, now” into the community&#39;s “anyone, anywhere, anytime.” Objective knowledge is the goal rather than the starting point. How, then, does the community carry out this transformation?<\/p>\n<h3>[F]<\/h3>\n<p>The process begins to involve the wider community once the claim becomes public. Its maker receives intellectual credit, but the community controls what happens next. Researchers produce discoveries, editors and reviewers control publication, other scientists use the findings, and the public receives knowledge and possibly technology. As shared and competing beliefs interact and confront one another, a personal claim becomes a credible discovery. Within this process, however, the search for new knowledge creates two paradoxes.<\/p>\n<h3>[G]<\/h3>\n<p>That second difficulty is that novelty itself often provokes disbelief. Albert Szent-Györgyi described discovery as seeing what everyone has seen while thinking what nobody has thought. Yet telling others what they have missed may not alter their views. Acceptance and appreciation of a truly novel claim can take years. Credibility therefore cannot simply be declared by the discoverer; it emerges as others consider and respond to the claim.<\/p>\n<h3>[H]<\/h3>\n<p>In the end, credibility comes about in what philosopher Annette Baier called the “commons of the mind.” People reason together, challenging, revising, and completing one another&#39;s reasoning and conceptions of reason. This shared activity is where science finds its answer to the question that began the discussion. To explain why we believe what we think we know, we must consider how minds work with, and question, one another.<\/p>\n<h2>排序题全局解析<\/h2>\n<p>先辨认每一段在全文中的功能，再检查段首、段尾能否双向接住，不能只凭“都在讲科学”就连在一起。<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在做什么<\/th>\n<th>关键接点<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>用读Montaigne的经历和后来的书引出“凭什么相信”<\/td>\n<td>末尾提出Why do we believe这一问题<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>解释第一个悖论：追求新知让已有发现继续受挑战<\/td>\n<td>The first paradox起头，a second difficulty收尾<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>先给科学家的迅速回答与理想模型，再追问遗漏了什么<\/td>\n<td>that question回指A；段尾问already objective图景漏了什么<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>补入个人经历与解释偏差，说明声明仅有潜力<\/td>\n<td>What it leaves out回答C；段尾potential接E<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>定义从潜力到成熟发现的可信度过程<\/td>\n<td>This potential回指D；末尾追问共同体如何转化<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>解释公开后的社会角色和信念互动，并引出两个悖论<\/td>\n<td>回答E的How；末尾two paradoxes领起B、G<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>解释第二个悖论：新颖本身引发不信与迟缓接受<\/td>\n<td>That second difficulty回指B；末尾把可信度交给他人回应<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>用思想的公地总结共同推理，并回答开篇问题<\/td>\n<td>In the end收束，the question that began the discussion回扣A<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：提出信念依据的问题 → 给出科学家的简单答案和理想图景 → 补足现实中的个人影响 → 引入可信度转化 → 解释共同体的实际机制 → 悖论一：已有发现仍受挑战 → 悖论二：新颖声明可能受怀疑 → 以共同推理回扣最初的问题。<\/p>\n<p><strong>完整顺序：A → C → D → E → F → B → G → H。<\/strong><\/p>\n<p><strong>41—45答案：C、D、F、B、G。<\/strong><\/p>\n<p>A、E、H三个已给位置分别固定“提出问题”“概念转折”“最后回答”。A与E之间的C、D完成理想和现实的对比；E与H之间的F、B、G则依次完成机制解释和两个悖论。每段都同时接住前段的任务，并为后段留下具体对象。<\/p>\n<h3>排序41题解析<\/h3>\n<p>当前空位在已给A之后、42题之前；再往后是已给E的“潜力转为成熟发现”。41题需要先回应A末尾的认识问题，并为42题解释实际研究的局限建立一个被修正的理想模型。<\/p>\n<p>A段尾提出 Why do we believe what we think we know，C开头紧接 Scientists may answer that question readily。C先说技术成功与客观研究者的理想图景，末尾问 What is missing from this picture；下一段D的 What it leaves out 则正面回答“漏掉了什么”。<\/p>\n<p>that question的指代和answer的动作使A→C形成问答。C后半用But质疑简答，才引出D对研究者个人经历的补充。前后不是简单重复“知识”，而是“提出问题—先给答案—指出答案遗漏”的推进。<\/p>\n<p>局部推进链：A问为何相信 → C给技术成功与理想模型的简答 → C追问客观研究者图景遗漏何物 → D补入研究者个人历史与偏差。<\/p>\n<p>最强候选是D，因为它也能说明知识为什么不稳固。但D的What it leaves out需要前文已有一个遗漏了东西的picture；A只有Montaigne的问题，并未描述理想研究者。若直接放D，既丢掉C的简答，也让D的指代没有准确前项。<\/p>\n<p><strong>最终答案：41填C。<\/strong><\/p>\n<h3>排序42题解析<\/h3>\n<p>当前空位在已确定的C之后、已给E之前。C末尾问完全客观的研究者图景漏掉了什么，E开头则用This potential承接某个尚未成熟的声明。因此42题要回答前一个问题，并建立“有潜力但未成熟”这个后续对象。<\/p>\n<p>C段尾的 What is missing from this picture 对应D首句 What it leaves out is the investigator&#39;s own history。D列出知识、兴趣和经历带来的影响，结尾说 a claim ... has potential, but cannot yet be treated as a mature discovery；E随即以 This potential 接入矿权类比与共同审查。<\/p>\n<p>前端是明确问答，后端是this指代和potential的重复。D的段落功能又把“理想模型遗漏个人因素”推进为“个人声明不能直接当成成熟发现”，E才有理由说明转化的必要条件。<\/p>\n<p>局部推进链：C理想图景存在遗漏 → D补入个体经验、解释和错误可能 → D判定声明有潜力但未成熟 → E解释共同审查如何使其成熟。<\/p>\n<p>最强候选是F。它同样谈声明与共同体，但没有回答C的问题，也没有提供E的This potential所回指的明确判断。F是在E定义credibility process之后解释如何运作，提前放入会让概念与机制的顺序倒置。<\/p>\n<p><strong>最终答案：42填D。<\/strong><\/p>\n<h3>排序43题解析<\/h3>\n<p>当前空位在已给E之后、44题之前；44和45将分别放入两个悖论。E末尾问共同体如何完成转化，因此43题要给出操作过程，并建立后面展开悖论所需要的总领。<\/p>\n<p>E段尾问 How ... does the community carry out this transformation，F从 claim becomes public 开始，按发现者、编辑审稿人、其他科学家和公众说明参与过程。F末句提出 two paradoxes，下一段B便以 The first paradox 起头。<\/p>\n<p>前端是“怎么转化—角色与信念互动”的问答，后端是“两个—第一个”的总分连接。F中的The process有E已经定义的credibility process作前项，personal claim becomes a credible discovery又把这一问答收拢。<\/p>\n<p>局部推进链：E定义可信度并问如何实现 → F说明公开后的共同体角色与互动 → F引出两个悖论 → B先展开第一个悖论。<\/p>\n<p>最强候选是B，因为E已经说到可信度，可以继续谈困难。但B开头的The first paradox在E中没有总领前项，E最后的How也尚未得到回答。F既补足社会机制，又给B、G安排好总分关系，不能省掉。<\/p>\n<p><strong>最终答案：43填F。<\/strong><\/p>\n<h3>排序44题解析<\/h3>\n<p>当前空位在已确定的F之后、45题之前。F刚总领two paradoxes；45题的G以That second difficulty起头。因此44题必须先写第一个悖论，并在末尾把话题递交给第二个。<\/p>\n<p>F段尾的 two paradoxes 对应B段首 The first paradox。B解释新知导向如何使已有发现持续受到挑战，末尾说 It creates a second difficulty as well；G段首的 That second difficulty is that novelty itself often provokes disbelief 就接住了这句话。<\/p>\n<p>前端靠数目与序次建立总分，后端靠that指代与second difficulty的重复对象连接。内容上，B先看创新对既有发现的后果，G再看创新对新声明被接受的后果，两者构成不同方向的困难。<\/p>\n<p>局部推进链：F宣布两个悖论 → B讲已有知识仍可能被更新推翻 → B转向创新的第二重困难 → G讲新颖声明引起怀疑。<\/p>\n<p>最强候选是G。它也在讨论新颖带来的困难，却以That second difficulty开头，必须有前文明确提出的第二重困难；直接接F就跳过了first，也使B末尾的second指向无法顺着阅读方向继续。<\/p>\n<p><strong>最终答案：44填B。<\/strong><\/p>\n<h3>排序45题解析<\/h3>\n<p>当前空位在已确定的B之后、已给H之前。B末尾已经提出a second difficulty，H将用思想的公地收束全文。45题需要完成尚未解释的第二个困难，并把讨论交给共同体的回应与推理。<\/p>\n<p>B段尾的 a second difficulty 与G首句 That second difficulty is that novelty itself often provokes disbelief 逐项呼应。G从独特思考不一定说服他人，推进到新声明可能多年后才被接受，末尾强调 others consider and respond；H再以 People reason together 解释这种共同活动的总体性质。<\/p>\n<p>前端是明确指代与定义，后端是他人回应到共同推理的功能提升。G没有另起一套标准，而是完成F预告、B转交的第二个悖论；H因此能从全部过程上升到“思想的公地”，再回扣开头。<\/p>\n<p>局部推进链：B提出第二重困难 → G解释新颖引发怀疑与接受延迟 → G指出可信度在他人回应中形成 → H以共同挑战、修正和完善给出总结。<\/p>\n<p>最强候选是F。它也讲共同体，似乎能接到H的共享活动，但不能解释B已经点出的第二重困难；而且F末尾才宣布two paradoxes，放在这里会倒置总分顺序，让已解释过的第一悖论失去前面的总领。<\/p>\n<p><strong>最终答案：45填G。<\/strong><\/p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>critical thinking<\/strong><\/td>\n<td><strong>批判性思维<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>independent thinking<\/td>\n<td>独立思考<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>intellectual modesty<\/td>\n<td>求知中的谦虚态度<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>joint efforts<\/strong><\/td>\n<td><strong>共同努力<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>striving for excellence<\/td>\n<td>精益求精<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>persistence<\/td>\n<td>坚持<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>mutual trust<\/td>\n<td>相互信任<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>lifelong learning<\/td>\n<td>终身学习<\/td>\n<td>社会现象类—文化教育<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>quality-oriented education<\/td>\n<td>素质教育<\/td>\n<td>社会现象类—文化教育<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td><strong>technological innovation<\/strong><\/td>\n<td><strong>科技创新<\/strong><\/td>\n<td><strong>经济消费类<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>technological progress<\/td>\n<td>科技进步<\/td>\n<td>经济消费类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>a rational view of new technology<\/td>\n<td>理性看待新科技<\/td>\n<td>社会现象类—科技经济<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>2. 大作文第一段描述题目信息时可积累的表达<\/h2>\n<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In the picture, A and B are working together to examine C.<\/strong><\/td>\n<td><strong>图画中，A和B正在共同检验C。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture shows A challenging B’s view of C.<\/td>\n<td>图画展现了A对B关于C的看法提出质疑。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>In the picture, A is revising his or her understanding of B.<\/td>\n<td>图画中，A正在修正自己对B的理解。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture depicts A examining B from different perspectives.<\/td>\n<td>图画描绘了A从不同角度审视B的情景。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares the numbers of A involved in B in different years.<\/td>\n<td>图表比较了不同年份参与B的A的数量。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart shows the time required for A to be accepted by B.<\/td>\n<td>图表显示了A被B接受所需的时间。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart presents changes in public acceptance of A over the period from B to C.<\/strong><\/td>\n<td><strong>图表呈现了从B到C期间公众对A的接受程度的变化。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares A and B in terms of their contributions to C.<\/td>\n<td>图表比较了A和B对C的贡献。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The passage describes the process through which A is transformed into B.<\/strong><\/td>\n<td><strong>短文描述了A转变为B的过程。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage explains how A influences B and the subsequent actions people take.<\/td>\n<td>短文解释了A如何影响B以及人们随后采取的行动。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage discusses why A is open to challenge and revision.<\/td>\n<td>短文讨论了A为何可能受到质疑和修正。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage focuses on the joint efforts required to turn A into B.<\/td>\n<td>短文着重介绍了将A转变为B所需要的共同努力。<\/td>\n<\/tr>\n<\/tbody><\/table>\n";

function imageReady(img){
 if(img.complete)return Promise.resolve();
 return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})});
}
function hydrateAssets(root){
 if(!root)return Promise.resolve();
 root.querySelectorAll('img.embedded-asset[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
 return Promise.all([...root.querySelectorAll('img')].map(imageReady));
}
function afterLayout(place,epoch,delay=80){
 return new Promise(resolve=>requestAnimationFrame(()=>{
  if(epoch!==renderEpoch){resolve();return}
  place();
  setTimeout(()=>{if(epoch===renderEpoch)place();resolve()},delay);
 }));
}
function renderContext(ctx,epoch,restoreTop=null){
 if(!ctx)return Promise.resolve();
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  leftStage.innerHTML=`<div class="newtypePaper">${NEWTYPE[ctx.kind]||''}</div>`;
  const cur=String(ctx.current||'');
  const el=cur?leftStage.querySelector(ctx.kind==='smallTitle'?`[data-q="${CSS.escape(cur)}"]`:`[data-letter="${CSS.escape(cur)}"]`):null;
  if(el)el.classList.add('current');
  return afterLayout(()=>{
   if(restoreTop!==null){leftScroll.scrollTop=restoreTop;return}
   if(!el){leftScroll.scrollTop=0;return}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absoluteTop=leftScroll.scrollTop+er.top-sr.top;
   const max=Math.max(0,leftScroll.scrollHeight-leftScroll.clientHeight);
   leftScroll.scrollTop=Math.max(0,Math.min(max,absoluteTop-leftScroll.clientHeight*.2));
  },epoch);
 }
 leftStage.className='leftStage';
 if(ctx.mode!=='image'||!ASSET_KEYS.includes(ctx.asset)){leftStage.innerHTML='';return Promise.resolve()}
 const focused=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=focused?Math.max(40,leftScroll.clientHeight/2):0;
 leftStage.innerHTML=`<div class="scrollPad" aria-hidden="true" style="height:${pad}px"></div><div class="focusPage${ctx.asset==='articleAnnotated'?' annotatedPdfPage':''}" id="focusPage"><img id="focusImg"><div id="focusAnchor"></div></div><div class="scrollPad" aria-hidden="true" style="height:${pad}px"></div>`;
 const img=leftStage.querySelector('#focusImg'),page=leftStage.querySelector('#focusPage'),anchor=leftStage.querySelector('#focusAnchor');
 img.alt=ctx.label||'';loadAsset(ctx.asset,function(src){img.src=src;});
 return imageReady(img).then(()=>afterLayout(()=>{
  if(restoreTop!==null){leftScroll.scrollTop=restoreTop;return}
  if(!Array.isArray(ctx.focus)){leftScroll.scrollTop=0;return}
  const scale=img.clientWidth/(ctx.sourceW||img.naturalWidth),view=leftScroll.clientHeight;
  const pr=page.getBoundingClientRect(),sr=leftScroll.getBoundingClientRect();
  const top=leftScroll.scrollTop+pr.top-sr.top+ctx.focus[1]*scale,height=Math.max(2,ctx.focus[3]*scale);
  anchor.style.cssText=`position:absolute;left:0;right:0;top:${ctx.focus[1]*scale}px;height:${height}px;pointer-events:none`;
  let target;
  if(focused){
   const margin=Math.max(24,Math.min(72,view*.09));
   target=height<=view-2*margin?top+height/2-view/2:top-margin;
  }else{
   const margin=Math.max(10,Math.min(22,view*.025));
   const includeTitle=ctx.includeTitle===true||(ctx.asset==='articleAnnotated'&&ctx.includeTitle!==false&&ctx.focus[1]<=120);
   target=includeTitle?0:top-margin;
  }
  leftScroll.scrollTop=Math.max(0,Math.min(Math.max(0,leftScroll.scrollHeight-view),target));
 },epoch));
}
function isLongSentenceCumulative(st){const g=st&&st.meta&&st.meta.cumulativeGroup;return !!(st&&st.meta&&st.meta.cumulative&&typeof g==='string'&&g.startsWith('long-'))}
function isQuestionOptionCumulative(st){const g=st&&st.meta&&st.meta.cumulativeGroup;return !!(st&&st.meta&&st.meta.cumulative&&typeof g==='string'&&g.startsWith('question-'))}
