social progress\n\n> 根据第一段，同伴压力常常是社会进步的障碍。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。\n\n**出处：**\n\n> It usually leads to no good—drinking, drugs and casual sex.\n>\n> peer pressure can also be a positive force","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-C-0\"><blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force</p>\n</blockquote>\n</section>"},{"title":"C. an obstacle to social progress","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据第一段，同伴压力常常是社会进步的障碍。\n\n`obstacle to social progress`说的是阻碍社会进步。首段的`no good`确实是负面评价，但破折号后已经具体说明它指什么：`drinking, drugs and casual sex`，也就是受到同伴影响而出现的不良行为。\n\n从这些行为还不能直接换到社会进步受到怎样的阻碍。C需要把个体行为与社会发展的某种停滞连接起来，而本段并没有作这一步论证。\n\n后面的积极用途也仍落在`help individuals improve their lives`上。题目要概括通常出现的行为后果，D正好能接住这些例子；C则把讨论层级扩大了。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-C-0\"><blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><code>obstacle to social progress</code>说的是阻碍社会进步。首段的<code>no good</code>确实是负面评价，但破折号后已经具体说明它指什么：<code>drinking, drugs and casual sex</code>，也就是受到同伴影响而出现的不良行为。</p>\n<p>从这些行为还不能直接换到社会进步受到怎样的阻碍。C需要把个体行为与社会发展的某种停滞连接起来，而本段并没有作这一步论证。</p>\n<p>后面的积极用途也仍落在<code>help individuals improve their lives</code>上。题目要概括通常出现的行为后果，D正好能接住这些例子；C则把讨论层级扩大了。</p>\n</section>"},{"title":"C. an obstacle to social progress","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It usually leads to no good—drinking, drugs and casual sex.\n>\n> peer pressure can also be a positive force\n>\n> 它通常导致不好的结果——酗酒、吸毒和随意性行为。同伴压力也可以成为一种积极力量。\n\n作者在`no good`后立即列行为例子，让我们看见同伴压力常把个人带向什么行为。转折之后再说这股力量也可以帮助个人，并没有举社会改革或社会发展受阻的例子。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Peer pressure holds back social progress by preventing changes that society needs.\n>\n> 同伴压力妨碍社会所需的改变，从而阻碍社会进步。\n\nC需要出现社会发展怎样受阻这一层。实际举出的酗酒、吸毒等后果只能直接支持“不良行为”，不能把负面评价自动扩大成任何更宏观的坏结果。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-C-0\"><blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><code>obstacle to social progress</code>说的是阻碍社会进步。首段的<code>no good</code>确实是负面评价，但破折号后已经具体说明它指什么：<code>drinking, drugs and casual sex</code>，也就是受到同伴影响而出现的不良行为。</p>\n<p>从这些行为还不能直接换到社会进步受到怎样的阻碍。C需要把个体行为与社会发展的某种停滞连接起来，而本段并没有作这一步论证。</p>\n<p>后面的积极用途也仍落在<code>help individuals improve their lives</code>上。题目要概括通常出现的行为后果，D正好能接住这些例子；C则把讨论层级扩大了。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force</p>\n<p>它通常导致不好的结果——酗酒、吸毒和随意性行为。同伴压力也可以成为一种积极力量。</p>\n</blockquote>\n<p>作者在<code>no good</code>后立即列行为例子，让我们看见同伴压力常把个人带向什么行为。转折之后再说这股力量也可以帮助个人，并没有举社会改革或社会发展受阻的例子。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Peer pressure holds back social progress by preventing changes that society needs.</p>\n<p>同伴压力妨碍社会所需的改变，从而阻碍社会进步。</p>\n</blockquote>\n<p>C需要出现社会发展怎样受阻这一层。实际举出的酗酒、吸毒等后果只能直接支持“不良行为”，不能把负面评价自动扩大成任何更宏观的坏结果。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. a cause of undesirable behaviors","raw":"### D. a cause of undesirable behaviors\n\n> 根据第一段，同伴压力常常导致不良行为。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n`a cause of`对应`leads to`，`undesirable behaviors`概括破折号后的酗酒、吸毒等例子，`often`与`usually`的频率也一致。\n\n**出处：**\n\n> It usually leads to no good—drinking, drugs and casual sex.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>a cause of</code>对应<code>leads to</code>，<code>undesirable behaviors</code>概括破折号后的酗酒、吸毒等例子，<code>often</code>与<code>usually</code>的频率也一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n</section>"},{"title":"D. a cause of undesirable behaviors","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第一段，同伴压力常常导致不良行为。\n\n先把题干与选项的关系接全：同伴压力常常导致不良行为。`often`不是泛泛的频率词，它在首段直接找到`usually`；`a cause of`说明造成什么，对应`leads to`。\n\n`undesirable behaviors`并非原词照抄，而是对`drinking, drugs and casual sex`的概括。作者先说`no good`，再列出这些具体行为，负面评价与行为对象都已给出。\n\n后面`can also be a positive force`只是补充同伴压力也可能发挥积极作用，不会取消前面“通常”产生坏结果的说法。D没有写`always`，因此不需要否认另一种用途，也能准确回答题干。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>a cause of</code>对应<code>leads to</code>，<code>undesirable behaviors</code>概括破折号后的酗酒、吸毒等例子，<code>often</code>与<code>usually</code>的频率也一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p>先把题干与选项的关系接全：同伴压力常常导致不良行为。<code>often</code>不是泛泛的频率词，它在首段直接找到<code>usually</code>；<code>a cause of</code>说明造成什么，对应<code>leads to</code>。</p>\n<p><code>undesirable behaviors</code>并非原词照抄，而是对<code>drinking, drugs and casual sex</code>的概括。作者先说<code>no good</code>，再列出这些具体行为，负面评价与行为对象都已给出。</p>\n<p>后面<code>can also be a positive force</code>只是补充同伴压力也可能发挥积极作用，不会取消前面“通常”产生坏结果的说法。D没有写<code>always</code>，因此不需要否认另一种用途，也能准确回答题干。</p>\n</section>"},{"title":"D. a cause of undesirable behaviors","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It usually leads to no good—drinking, drugs and casual sex.\n>\n> 它通常导致不好的结果——酗酒、吸毒和随意性行为。\n\n首段先用`usually`作概括，再以三个行为例子解释坏结果，之后转向一种积极利用方式。前面的常见情况与后面的另一种可能可以同时成立。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Peer pressure often leads people into undesirable behaviors, although it can also be used positively.\n>\n> 同伴压力常使人出现不良行为，但也可以被积极利用。\n\nD需要的原因与结果就在`leads to no good`及其例子中。保留`often`后，它不会把后面的积极用途排除掉，与这一段的先概括、再转折相合。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>a cause of</code>对应<code>leads to</code>，<code>undesirable behaviors</code>概括破折号后的酗酒、吸毒等例子，<code>often</code>与<code>usually</code>的频率也一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p>先把题干与选项的关系接全：同伴压力常常导致不良行为。<code>often</code>不是泛泛的频率词，它在首段直接找到<code>usually</code>；<code>a cause of</code>说明造成什么，对应<code>leads to</code>。</p>\n<p><code>undesirable behaviors</code>并非原词照抄，而是对<code>drinking, drugs and casual sex</code>的概括。作者先说<code>no good</code>，再列出这些具体行为，负面评价与行为对象都已给出。</p>\n<p>后面<code>can also be a positive force</code>只是补充同伴压力也可能发挥积极作用，不会取消前面“通常”产生坏结果的说法。D没有写<code>always</code>，因此不需要否认另一种用途，也能准确回答题干。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>它通常导致不好的结果——酗酒、吸毒和随意性行为。</p>\n</blockquote>\n<p>首段先用<code>usually</code>作概括，再以三个行为例子解释坏结果，之后转向一种积极利用方式。前面的常见情况与后面的另一种可能可以同时成立。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Peer pressure often leads people into undesirable behaviors, although it can also be used positively.</p>\n<p>同伴压力常使人出现不良行为，但也可以被积极利用。</p>\n</blockquote>\n<p>D需要的原因与结果就在<code>leads to no good</code>及其例子中。保留<code>often</code>后，它不会把后面的积极用途排除掉，与这一段的先概括、再转折相合。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. D**\n\n- A：social cure确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面usually所限定的常见表现。\n- B：原文写组织和官员利用group dynamics产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。\n- C：酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。\n- D：a cause of对应leads to，undesirable behaviors概括破折号后的酗酒、吸毒等例子，often与usually的频率也一致。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"21","questionConclusion":true},"html":"<blockquote>\n<p><strong>21. D</strong></p>\n</blockquote>\n<ul>\n<li>A：social cure确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面usually所限定的常见表现。</li>\n<li>B：原文写组织和官员利用group dynamics产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。</li>\n<li>C：酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。</li>\n<li>D：a cause of对应leads to，undesirable behaviors概括破折号后的酗酒、吸毒等例子，often与usually的频率也一致。</li>\n</ul>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> Rosenberg holds that public-health advocates should ______.\n>\n> Rosenberg认为，公共卫生倡导者应该怎样做？\n\n### 题型\n\n细节题。题干问Rosenberg给公共卫生倡导者的建议，定位第三段末句ought to之后的行动。\n\n前面的戒烟口号说明为什么需要改变方法，最后一句才直接回答应该向谁、学习什么。\n\n### 核心出处\n\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.\n>\n> Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"22","questionIntro":true},"html":"<blockquote>\n<p>Rosenberg holds that public-health advocates should ______.</p>\n<p>Rosenberg认为，公共卫生倡导者应该怎样做？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干问Rosenberg给公共卫生倡导者的建议，定位第三段末句ought to之后的行动。</p>\n<p>前面的戒烟口号说明为什么需要改变方法，最后一句才直接回答应该向谁、学习什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n</blockquote>\n"},{"title":"A. recruit professional advertisers","raw":"### A. recruit professional advertisers\n\n> Rosenberg认为，公共卫生倡导者应招募专业广告人。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n`take a page from`表示借鉴做法，A的`recruit`却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。\n\n**出处：**\n\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>take a page from</code>表示借鉴做法，A的<code>recruit</code>却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section>"},{"title":"A. recruit professional advertisers","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Rosenberg认为，公共卫生倡导者应招募专业广告人。\n\n题干中的公共卫生倡导者，在原文里是`ought to`后面行动的执行者。这个行动是`take a page from advertisers`，意为效仿、借鉴广告商的做法。\n\n逗号后的`so skilled at applying peer pressure`还给出了借鉴内容：广告商善于利用同伴压力。原文因此已经把“向谁学”和“学什么”说清楚。\n\n`recruit professional advertisers`则变成聘用人员。招募之后或许也能学到经验，但文章并没有把这一可能的实施办法写成Rosenberg的建议。A添了人员安排，不能直接替换原来的学习动作。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>take a page from</code>表示借鉴做法，A的<code>recruit</code>却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p>题干中的公共卫生倡导者，在原文里是<code>ought to</code>后面行动的执行者。这个行动是<code>take a page from advertisers</code>，意为效仿、借鉴广告商的做法。</p>\n<p>逗号后的<code>so skilled at applying peer pressure</code>还给出了借鉴内容：广告商善于利用同伴压力。原文因此已经把“向谁学”和“学什么”说清楚。</p>\n<p><code>recruit professional advertisers</code>则变成聘用人员。招募之后或许也能学到经验，但文章并没有把这一可能的实施办法写成Rosenberg的建议。A添了人员安排，不能直接替换原来的学习动作。</p>\n</section>"},{"title":"A. recruit professional advertisers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.\n>\n> Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。\n\n戒烟宣传号召青少年与众不同，却碰到青少年希望融入群体的心理。作者接着引出Rosenberg的建议，让公共卫生宣传借鉴广告商利用这种心理的办法。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Public-health advocates should recruit professional advertisers to work on their campaigns.\n>\n> 公共卫生倡导者应招募专业广告人为宣传活动工作。\n\nA需要出现聘请、加入团队或承担宣传工作等人员安排。原文在指出宣传口号与受众心理相反之后，给出的是学习方法的建议，并未把工作人员的更换作为解决办法。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>take a page from</code>表示借鉴做法，A的<code>recruit</code>却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p>题干中的公共卫生倡导者，在原文里是<code>ought to</code>后面行动的执行者。这个行动是<code>take a page from advertisers</code>，意为效仿、借鉴广告商的做法。</p>\n<p>逗号后的<code>so skilled at applying peer pressure</code>还给出了借鉴内容：广告商善于利用同伴压力。原文因此已经把“向谁学”和“学什么”说清楚。</p>\n<p><code>recruit professional advertisers</code>则变成聘用人员。招募之后或许也能学到经验，但文章并没有把这一可能的实施办法写成Rosenberg的建议。A添了人员安排，不能直接替换原来的学习动作。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。</p>\n</blockquote>\n<p>戒烟宣传号召青少年与众不同，却碰到青少年希望融入群体的心理。作者接着引出Rosenberg的建议，让公共卫生宣传借鉴广告商利用这种心理的办法。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-health advocates should recruit professional advertisers to work on their campaigns.</p>\n<p>公共卫生倡导者应招募专业广告人为宣传活动工作。</p>\n</blockquote>\n<p>A需要出现聘请、加入团队或承担宣传工作等人员安排。原文在指出宣传口号与受众心理相反之后，给出的是学习方法的建议，并未把工作人员的更换作为解决办法。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. learn from advertisers’ experience","raw":"### B. learn from advertisers’ experience\n\n> Rosenberg认为，公共卫生倡导者应借鉴广告商的经验。\n\n**做题模式中的状态：** 第一轮保留B，此时B尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nB的`learn from`改写`take a page from`；广告商善于运用同伴压力，正是前面的戒烟口号所没有利用好的群体心理。\n\n**出处：**\n\n> Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in\n>\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-B-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应借鉴广告商的经验。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>B的<code>learn from</code>改写<code>take a page from</code>；广告商善于运用同伴压力，正是前面的戒烟口号所没有利用好的群体心理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section>"},{"title":"B. learn from advertisers’ experience","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Rosenberg认为，公共卫生倡导者应借鉴广告商的经验。\n\n`take a page from advertisers`不是从广告中取一张纸，而是借鉴广告商的办法，B的`learn from advertisers’ experience`保留了这一学习关系。\n\n再看为什么要学习：青少年最想`fitting in`，也就是融入同伴，但广告牌却说`Dare to be different`，让他们与众不同。这一宣传要求与受众愿望相反。\n\nRosenberg接着指出广告商`skilled at applying peer pressure`。要学的是如何顺着群体归属心理进行劝导，而非照搬商业产品或招一批广告人。B把具体内容概括为经验，学习的主体和对象都没有改变。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-B-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应借鉴广告商的经验。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此 \n<blockquote>\n<p>Public-health advocates should avoid commercial advertisers and distance themselves from their methods.</p>\n<p>公共卫生倡导者应避开商业广告商，并与他们的方法保持距离。</p>\n</blockquote>\n<p>C需要把广告商的方法作为应当避免的对象。原文收尾却称赞他们运用同伴压力的技能，并建议借鉴，展开方向与C相反。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. recognize the limitations of advertisements","raw":"### D. recognize the limitations of advertisements\n\n> Rosenberg认为，公共卫生倡导者应认识广告的局限。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。\n\n**出处：**\n\n> Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in\n>\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section>"},{"title":"D. recognize the limitations of advertisements","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Rosenberg认为，公共卫生倡导者应认识广告的局限。\n\n`recognize the limitations of advertisements`要求认识广告有哪些局限。前面的戒烟广告确实没有处理好青少年想融入群体的愿望，因此D容易与这个例子发生联系。\n\n但题干要的是`Rosenberg holds ... should`，要看她在指出问题后主张怎么做。原句给出的动作是`take a page from advertisers`，理由是他们善于`applying peer pressure`。\n\n作者没有由这个口号推到“广告这种方式本身有限”，而是认为公共卫生宣传可以在使用同伴压力的方法上向广告商学习。D保留了批评宣传这一表面印象，却没有承接实际提出的改进建议。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><code>recognize the limitations of advertisements</code>要求认识广告有哪些局限。前面的戒烟广告确实没有处理好青少年想融入群体的愿望，因此D容易与这个例子发生联系。</p>\n<p>但题干要的是<code>Rosenberg holds ... should</code>，要看她在指出问题后主张怎么做。原句给出的动作是<code>take a page from advertisers</code>，理由是他们善于<code>applying peer pressure</code>。</p>\n<p>作者没有由这个口号推到“广告这种方式本身有限”，而是认为公共卫生宣传可以在使用同伴压力的方法上向广告商学习。D保留了批评宣传这一表面印象，却没有承接实际提出的改进建议。</p>\n</section>"},{"title":"D. recognize the limitations of advertisements","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in\n>\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.\n>\n> 一个旨在减少青少年吸烟的广告牌呼吁：“敢于与众不同，请勿吸烟！”但青少年最希望的就是融入群体。Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。\n\n例子把青少年想融入群体与宣传号召不同并列，随后Rosenberg没有要求放弃或限制广告，而是转向广告商熟练运用群体心理的经验。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Public-health advocates should recognise the limits of what advertisements can achieve.\n>\n> 公共卫生倡导者应认识广告所能取得的效果的局限。\n\nD需要从宣传例子进一步讨论广告能力的边界。实际结尾在同一种宣传活动中寻找可借鉴的方法，焦点是怎样更好地利用同伴压力，不能用一般的局限评价代替这项建议。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><code>recognize the limitations of advertisements</code>要求认识广告有哪些局限。前面的戒烟广告确实没有处理好青少年想融入群体的愿望，因此D容易与这个例子发生联系。</p>\n<p>但题干要的是<code>Rosenberg holds ... should</code>，要看她在指出问题后主张怎么做。原句给出的动作是<code>take a page from advertisers</code>，理由是他们善于<code>applying peer pressure</code>。</p>\n<p>作者没有由这个口号推到“广告这种方式本身有限”，而是认为公共卫生宣传可以在使用同伴压力的方法上向广告商学习。D保留了批评宣传这一表面印象，却没有承接实际提出的改进建议。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>一个旨在减少青少年吸烟的广告牌呼吁：“敢于与众不同，请勿吸烟！”但青少年最希望的就是融入群体。Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。</p>\n</blockquote>\n<p>例子把青少年想融入群体与宣传号召不同并列，随后Rosenberg没有要求放弃或限制广告，而是转向广告商熟练运用群体心理的经验。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-health advocates should recognise the limits of what advertisements can achieve.</p>\n<p>公共卫生倡导者应认识广告所能取得的效果的局限。</p>\n</blockquote>\n<p>D需要从宣传例子进一步讨论广告能力的边界。实际结尾在同一种宣传活动中寻找可借鉴的方法，焦点是怎样更好地利用同伴压力，不能用一般的局限评价代替这项建议。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. B**\n\n- A：take a page from表示借鉴做法，A的recruit却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。\n- B：B的learn from改写take a page from；广告商善于运用同伴压力，正是前面的戒烟口号所没有利用好的群体心理。\n- C：原文把广告商放在值得借鉴的位置，C却说应该远离他们，将take a page from所表示的接近和学习改成回避。\n- D：前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,710,1344,181],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"22","questionConclusion":true},"html":"<blockquote>\n<p><strong>22. B</strong></p>\n</blockquote>\n<ul>\n<li>A：take a page from表示借鉴做法，A的recruit却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。</li>\n<li>B：B的learn from改写take a page from；广告商善于运用同伴压力，正是前面的戒烟口号所没有利用好的群体心理。</li>\n<li>C：原文把广告商放在值得借鉴的位置，C却说应该远离他们，将take a page from所表示的接近和学习改成回避。</li>\n<li>D：前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。</li>\n</ul>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> In the author’s view, Rosenberg’s book fails to ______.\n>\n> 在作者看来，Rosenberg的书没有做到什么？\n\n### 题型\n\n细节题。题干的主体是Rosenberg的书，并用fails to问它未完成的事情。\n\n先核对not enough exploration对书中分析的批评，再与后面疗法项目成效不足的批评分开。\n\n### 核心出处\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful\n>\n> The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long\n>\n> Rage Against the Haze failed once state funding was cut.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"23","questionIntro":true},"html":"<blockquote>\n<p>In the author’s view, Rosenberg’s book fails to ______.</p>\n<p>在作者看来，Rosenberg的书没有做到什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干的主体是Rosenberg的书，并用fails to问它未完成的事情。</p>\n<p>先核对not enough exploration对书中分析的批评，再与后面疗法项目成效不足的批评分开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n"},{"title":"A. adequately probe social and biological factors","raw":"### A. adequately probe social and biological factors\n\n> 作者认为，Rosenberg的书没有充分探究社会与生物因素。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n`fails to adequately probe`与`not enough exploration`表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。\n\n**出处：**\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>作者认为，Rosenberg的书没有充分探究社会与生物因素。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>fails to adequately probe</code>与<code>not enough exploration</code>表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n</blockquote>\n</section>"},{"title":"A. adequately probe social and biological factors","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为，Rosenberg的书没有充分探究社会与生物因素。\n\n先看题干的否定：`the book fails to`。把A接上后，才得到“这本书没有充分探究社会与生物因素”，不是说这本书已经充分探究了它们。\n\n原文对应的是`not enough exploration of the social and biological factors that make peer pressure so powerful`。`exploration`是探究，A用`probe`替换；`not enough`说明不足，题干的`fails to`与A的`adequately`共同表达这一程度。\n\n前面的`too much irrelevant detail`与后面的探究不足形成对照：细节多，却没有充分回答同伴压力为什么如此强大。A同时保留了书这一主体、探究这一行动和具体研究对象，是对这项缺陷的准确改写。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>作者认为，Rosenberg的书没有充分探究社会与生物因素。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>fails to adequately probe</code>与<code>not enough exploration</code>表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书没有充分探究社会与生物因素。</p>\n</blockquote>\n<p>先看题干的否定：<code>the book fails to</code>。把A接上后，才得到“这本书没有充分探究社会与生物因素”，不是说这本书已经充分探究了它们。</p>\n<p>原文对应的是<code>not enough exploration of the social and biological factors that make peer pressure so powerful</code>。<code>exploration</code>是探究，A用<code>probe</code>替换；<code>not enough</code>说明不足，题干的<code>fails to</code>与A的<code>adequately</code>共同表达这一程度。</p>\n<p>前面的<code>too much irrelevant detail</code>与后面的探究不足形成对照：细节多，却没有充分回答同伴压力为什么如此强大。A同时保留了书这一主体、探究这一行动和具体研究对象，是对这项缺陷的准确改写。</p>\n</section>"},{"title":"A. adequately probe social and biological factors","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful\n>\n> 《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。\n\n作者先嫌书中无关细节太多，再紧接着指出真正应该深入的社会与生物原因没有得到足够探究。两种内容的比例失衡构成了对书的批评。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The book provides too little analysis of the social and biological factors behind the power of peer pressure.\n>\n> 这本书对同伴压力之所以强大的社会和生物因素分析得太少。\n\nA所需的不足就在`not enough exploration`中。后面疗法能否持久的例子是另一层批评，不能取代这里对书中原因解释不充分的直接评价。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A 析得太少。</p>\n</blockquote>\n<p>A所需的不足就在<code>not enough exploration</code>中。后面疗法能否持久的例子是另一层批评，不能取代这里对书中原因解释不充分的直接评价。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. effectively evade the flaws of the social cure","raw":"### B. effectively evade the flaws of the social cure\n\n> 作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。\n\n**出处：**\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful\n>\n> The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n</blockquote>\n</section>"},{"title":"B. effectively evade the flaws of the social cure","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。\n\n`evade the flaws of the social cure`要说书未能避开社会疗法的缺陷。原文确实同时出现书的不足和疗法的缺点，但要先看各自被评价的动作。\n\n对书，作者说无关细节太多、社会与生物因素的`exploration`不够；对疗法，随后才说它`doesn’t work very well for very long`，有效作用不能很好地维持。\n\n书可以充分研究一个有缺陷的疗法，疗法也不会因为书把它写清楚就自动消除缺陷。因此“探究原因不够”不能改成“未能避开疗法缺陷”。B把两个邻近的负面评价拼成了另一个任务关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><code>evade the flaws of the social cure</code>要说书未能避开社会疗法的缺陷。原文确实同时出现书的不足和疗法的缺点，但要先看各自被评价的动作。</p>\n<p>对书，作者说无关细节太多、社会与生物因素的<code>exploration</code>不够；对疗法，随后才说它<code>doesn’t work very well for very long</code>，有效作用不能很好地维持。</p>\n<p>书可以充分研究一个有缺陷的疗法，疗法也不会因为书把它写清楚就自动消除缺陷。因此“探究原因不够”不能改成“未能避开疗法缺陷”。B把两个邻近的负面评价拼成了另一个任务关系。</p>\n</section>"},{"title":"B. effectively evade the flaws of the social cure","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful\n>\n> The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long\n>\n> 《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。书中所呈现的社会疗法最明显的缺陷是，它不能长时间保持良好效果。\n\n作者先评价书解释了多少、没有解释多少，再转到书中疗法的长期表现。前者是论述深度，后者是实践成效，段落依次展开两种不足。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The book fails to show how the weaknesses of the social cure can be avoided in practice.\n>\n> 这本书未能说明在实践中怎样避开社会疗法的弱点。\n\nB至少需要把避开或克服疗法弱点列为书没有完成的事情。实际对书的直接批评指向原因探究不足，后面的项目失效也没有把任务改成了如何避开缺陷。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><code>evade the flaws of the social cure</code>要说书未能避开社会疗法的缺陷。原文确实同时出现书的不足和疗法的缺点，但要先看各自被评价的动作。</p>\n<p>对书，作者说无关细节太多、社会与生物因素的<code>exploration</code>不够；对疗法，随后才说它<code>doesn’t work very well for very long</code>，有效作用不能很好地维持。</p>\n<p>书可以充分研究一个有缺陷的疗法，疗法也不会因为书把它写清楚就自动消除缺陷。因此“探究原因不够”不能改成“未能避开疗法缺陷”。B把两个邻近的负面评价拼成了另一个任务关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n<p>《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。书中所呈现的社会疗法最明显的缺陷是，它不能长时间保持良好效果。</p>\n</blockquote>\n<p>作者先评价书解释了多少、没有解释多少，再转到书中疗法的长期表现。前者是论述深度，后者是实践成效，段落依次展开两种不足。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The book fails to show how the weaknesses of the social cure can be avoided in practice.</p>\n<p>这本书未能说明在实践中怎样避开社会疗法的弱点。</p>\n</blockquote>\n<p>B至少需要把避开或克服疗法弱点列为书没有完成的事情。实际对书的直接批评指向原因探究不足，后面的项目失效也没有把任务改成了如何避开缺陷。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. illustrate the functions of state funding","raw":"### C. illustrate the functions of state funding\n\n> 作者认为，Rosenberg的书未能说明州拨款的作用。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。\n\n**出处：**\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful\n>\n> Rage Against the Haze failed once state funding was cut.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n</section>"},{"title":"C. illustrate the functions of state funding","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为，Rosenberg的书未能说明州拨款的作用。\n\nC的`illustrate the functions of state funding`要求说明州拨款起什么作用，再由题干`fails to`把它变成这本书没做到的事情。\n\n原文说`Rage Against the Haze failed once state funding was cut`，削减拨款后项目失败。这个例子紧接疗法不能长久奏效的评价，直接展示项目持续运行与资金支持的关系。\n\n它能支持疗法持续性受到质疑，却没有告诉我们这本书是否专门讨论过拨款功能，更没有把漏讲拨款列为作者的主要批评。C借用了例子中的`state funding`，另加了书本论述缺失的判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p>C的<code>illustrate the functions of state funding</code>要求说明州拨款起什么作用，再由题干<code>fails to</code>把它变成这本书没做到的事情。</p>\n<p>原文说<code>Rage Against the Haze failed once state funding was cut</code>，削减拨款后项目失败。这个例子紧接疗法不能长久奏效的评价，直接展示项目持续运行与资金支持的关系。</p>\n<p>它能支持疗法持续性受到质疑，却没有告诉我们这本书是否专门讨论过拨款功能，更没有把漏讲拨款列为作者的主要批评。C借用了例子中的<code>state funding</code>，另加了书本论述缺失的判断。</p>\n</section>"},{"title":"C. illustrate the functions of state funding","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful\n>\n> Rage Against the Haze failed once state funding was cut.\n>\n> 《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。州拨款一被削减，“向烟雾宣战”项目便失败了。\n\n作者先提出疗法长期成效不足，再列拨款被削减后项目失败的事实。资金在这里帮助解释一个项目为何不能持续，服务于前面的成效评价。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The book leaves unexplained the role that state funding plays in sustaining the programme.\n>\n> 这本书没有解释州拨款在维持项目中所起的作用。\n\nC需要作者指出书中漏掉了这一解释。原文却已经用资金减少与项目失败的先后关系支撑持续性批评，并没有转去审查书是否说明了拨款的功能。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p>C的<code>illustrate the functions of state funding</code>要求说明州拨款起什么作用，再由题干<code>fails to</code>把它变成这本书没做到的事情。</p>\n<p>原文说<code>Rage Against the Haze failed once state funding was cut</code>，削减拨款后项目失败。这个例子紧接疗法不能长久奏效的评价，直接展示项目持续运行与资金支持的关系。</p>\n<p>它能支持疗法持续性受到质疑，却没有告诉我们这本书是否专门讨论过拨款功能，更没有把漏讲拨款列为作者的主要批评。C借用了例子中的<code>state funding</code>，另加了书本论述缺失的判断。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n<p>《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。州拨款一被削减，“向烟雾宣战”项目便失败了。</p>\n</blockquote>\n<p>作者先提出疗法长期成效不足，再列拨款被削减后项目失败的事实。资金在这里帮助解释一个项目为何不能持续，服务于前面的成效评价。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The book leaves unexplained the role that state funding plays in sustaining the programme.</p>\n<p>这本书没有解释州拨款在维持项目中所起的作用。</p>\n</blockquote>\n<p>C需要作者指出书中漏掉了这一解释。原文却已经用资金减少与项目失败的先后关系支撑持续性批评，并没有转去审查书是否说明了拨款的功能。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. produce a long-lasting social effect","raw":"### D. produce a long-lasting social effect\n\n> 作者认为，Rosenberg的书未能产生持久的社会效果。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n`lasting changes`评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。\n\n**出处：**\n\n> Evidence that the loveLife program produces lasting changes is limited and mixed.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>lasting changes</code>评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n</section>"},{"title":"D. produce a long-lasting social effect","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者认为，Rosenberg的书未能产生持久的社会效果。\n\n把D接回`Rosenberg’s book fails to`，完整主语是书，谓语是产生持久社会效果。这个关系不能只凭原文也出现`lasting`就成立。\n\n原句说`Evidence that the loveLife program produces lasting changes is limited and mixed`。`produces`的主语是`the loveLife program`，证据不足且结果不一致，说明还不能确认这个项目能持续改变行为。\n\n作者对书另有明确评价：无关细节过多，原因探究不够。D把项目应取得的社会成效交给书承担，漏掉了两个主体之间的区别。因此题干的否定与项目成效的否定虽相近，也不能直接拼接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>lasting changes</code>评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p>把D接回<code>Rosenberg’s book fails to</code>，完整主语是书，谓语是产生持久社会效果。这个关系不能只凭原文也出现<code>lasting</code>就成立。</p>\n<p>原句说<code>Evidence that the loveLife program produces lasting changes is limited and mixed</code>。<code>produces</code>的主语是<code>the loveLife program</code>，证据不足且结果不一致，说明还不能确认这个项目能持续改变行为。</p>\n<p>作者对书另有明确评价：无关细节过多，原因探究不够。D把项目应取得的社会成效交给书承担，漏掉了两个主体之间的区别。因此题干的否定与项目成效的否定虽相近，也不能直接拼接。</p>\n</section>"},{"title":"D. produce a long-lasting social effect","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Evidence that the loveLife program produces lasting changes is limited and mixed.\n>\n> 证明loveLife项目能带来持久改变的证据有限，而且结果并不一致。\n\n第四段先谈书中分析的不足，再用具体项目说明疗法效果难以长期保持。loveLife是被评价的实践项目，书则是介绍和解释这些实践的文本。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Rosenberg’s book has failed to bring about lasting changes in society.\n>\n> Rosenberg的这本书未能在社会中带来持久改变。\n\nD需要作者评估书出版之后产生了什么社会影响。实际评估的是疗法项目有无持续改变行为的证据，没有把书的社会影响列为问题。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>lasting changes</code>评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p>把D接回<code>Rosenberg’s book fails to</code>，完整主语是书，谓语是产生持久社会效果。这个关系不能只凭原文也出现<code>lasting</code>就成立。</p>\n<p>原句说<code>Evidence that the loveLife program produces lasting changes is limited and mixed</code>。<code>produces</code>的主语是<code>the loveLife program</code>，证据不足且结果不一致，说明还不能确认这个项目能持续改变行为。</p>\n<p>作者对书另有明确评价：无关细节过多，原因探究不够。D把项目应取得的社会成效交给书承担，漏掉了两个主体之间的区别。因此题干的否定与项目成效的否定虽相近，也不能直接拼接。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n<p>证明loveLife项目能带来持久改变的证据有限，而且结果并不一致。</p>\n</blockquote>\n<p>第四段先谈书中分析的不足，再用具体项目说明疗法效果难以长期保持。loveLife是被评价的实践项目，书则是介绍和解释这些实践的文本。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Rosenberg’s book has failed to bring about lasting changes in society.</p>\n<p>Rosenberg的这本书未能在社会中带来持久改变。</p>\n</blockquote>\n<p>D需要作者评估书出版之后产生了什么社会影响。实际评估的是疗法项目有无持续改变行为的证据，没有把书的社会影响列为问题。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. A**\n\n- A：fails to adequately probe与not enough exploration表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。\n- B：书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。\n- C：州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。\n- D：lasting changes评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,891,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"23","questionConclusion":true},"html":"<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：fails to adequately probe与not enough exploration表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。</li>\n<li>B：书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。</li>\n<li>C：州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。</li>\n<li>D：lasting changes评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。</li>\n</ul>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> Paragraph 5 shows that our imitation of behaviors ______.\n>\n> 第五段说明，我们模仿行为时有什么特点？\n\n### 题型\n\n段落理解题。题干限定第五段，imitation对应冒号后的imitate，要看作者怎样解释前面的习惯传播。\n\n好坏习惯先并列出现，随后用不自觉模仿解释共同方式。比较C、D时，不能把D说成完全不可能，而要看哪一项更完整接住段落的解释。\n\n### 核心出处\n\n> An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.\n>\n> This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"24","questionIntro":true},"html":"<blockquote>\n<p>Paragraph 5 shows that our imitation of behaviors ______.</p>\n<p>第五段说明，我们模仿行为时有什么特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落理解题。题干限定第五段，imitation对应冒号后的imitate，要看作者怎样解释前面的习惯传播。</p>\n<p>好坏习惯先并列出现，随后用不自觉模仿解释共同方式。比较C、D时，不能把D说成完全不可能，而要看哪一项更完整接住段落的解释。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day</p>\n</blockquote>\n"},{"title":"A. is harmful to our networks of friends","raw":"### A. is harmful to our networks of friends\n\n> 第五段说明，模仿行为会损害我们的朋友网络。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n朋友网络是习惯传播经过的途径。A用`harmful to`把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。\n\n**出处：**\n\n> An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>朋友网络是习惯传播经过的途径。A用<code>harmful to</code>把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n</section>"},{"title":"A. is harmful to our networks of friends","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第五段说明，模仿行为会损害我们的朋友网络。\n\n原文的`spread through networks of friends`要连着介词看。`through`说明好习惯和坏习惯经过什么路径传播，朋友网络是传播渠道。\n\nA却说`harmful to our networks of friends`，把问题换成模仿是否损害朋友之间的联系。负面的健康习惯确实可能传播，但健康后果不好与朋友网络本身受到损害并不相同。\n\n后面`via social communication`进一步说明传播手段，`unconsciously imitate`再解释人们如何受到影响。整段在补全传播过程，没有评价朋友关系因此变弱或破裂。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>朋友网络是习惯传播经过的途径。A用<code>harmful to</code>把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p>原文的<code>spread through networks of friends</code>要连着介词看。<code>through</code>说明好习惯和坏习惯经过什么路径传播，朋友网络是传播渠道。</p>\n<p>A却说<code>harmful to our networks of friends</code>，把问题换成模仿是否损害朋友之间的联系。负面的健康习惯确实可能传播，但健康后果不好与朋友网络本身受到损害并不相同。</p>\n<p>后面<code>via social communication</code>进一步说明传播手段，<code>unconsciously imitate</code>再解释人们如何受到影响。整段在补全传播过程，没有评价朋友关系因此变弱或破裂。</p>\n</section>"},{"title":"A. is harmful to our networks of friends","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.\n>\n> 不断出现的研究表明，积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。\n\n作者先说习惯通过朋友网络和社会交流扩散，再用日常不自觉模仿解释这种扩散。网络在前后句中一直承担传递作用。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Imitating these behaviors damages friendships and weakens people’s social networks.\n>\n> 模仿这些行为会损害友谊，削弱人们的社会网络。\n\nA需要网络遭到损害的结果，原文给的却是习惯经过网络传播的过程。不能因其中有坏习惯，就把坏的后果直接安到传播渠道上。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>朋友网络是习惯传播经过的途径。A用<code>harmful to</code>把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p>原文的<code>spread through networks of friends</code>要连着介词看。<code>through</code>说明好习惯和坏习惯经过什么路径传播，朋友网络是传播渠道。</p>\n<p>A却说<code>harmful to our networks of friends</code>，把问题换成模仿是否损害朋友之间的联系。负面的健康习惯确实可能传播，但健康后果不好与朋友网络本身受到损害并不相同。</p>\n<p>后面<code>via social communication</code>进一步说明传播手段，<code>unconsciously imitate</code>再解释人们如何受到影响。整段在补全传播过程，没有评价朋友关系因此变弱或破裂。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>不断出现的研究表明，积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。</p>\n</blockquote>\n<p>作者先说习惯通过朋友网络和社会交流扩散，再用日常不自觉模仿解释这种扩散。网络在前后句中一直承担传递作用。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Imitating these behaviors damages friendships and weakens people’s social networks.</p>\n<p>模仿这些行为会损害友谊，削弱人们的社会网络。</p>\n</blockquote>\n<p>A需要网络遭到损害的结果，原文给的却是习惯经过网络传播的过程。不能因其中有坏习惯，就把坏的后果直接安到传播渠道上。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. will mislead behavioral studies","raw":"### B. will mislead behavioral studies\n\n> 第五段说明，我们的行为模仿会误导行为研究。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留`research shows`的关系。\n\n**出处：**\n\n> An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>第五段说明，我们的行为模仿会误导行为研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留<code>research shows</code>的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n</section>"},{"title":"B. will mislead behavioral studies","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第五段说明，我们的行为模仿会误导行为研究。\n\n`An emerging body of research shows ...`里，`research`是提供发现的一方。它发现积极和消极的健康习惯都会通过朋友网络扩散，后面接着解释这种现象表现为日常不自觉的模仿。\n\nB的`will mislead behavioral studies`把研究放到另一端：行为模仿使研究得出错误判断。原段既没有说研究误把什么当成了什么，也没有指出其方法或结论因此失真。\n\n所以B不是对`research shows`的改写。它将“研究揭示一种行为”倒置成“这种行为使研究出错”，需要文章额外讨论研究可靠性，原段没有这一步。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>第五段说明，我们的行为模仿会误导行为研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留<code>research shows</code>的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，我们的行为模仿会误导行为研究。</p>\n</blockquote>\n<p><code>An emerging body of research shows ...</code>里，<code>research</code>是提供发现的一方。它发现积极和消极的健康习惯都会通过朋友网络扩散，后面接着解释这种现象表现为日常不自觉的模仿。</p>\n<p>B的<code>will mislead behavioral studies</code>把研究放到另一端：行为模仿使研究得出错误判断。原段既没有说研究误把什么当成了什么，也没有指出其方法或结论因此失真。</p>\n<p>所以B不是对<code>research shows</code>的改写。它将“研究揭示一种行为”倒置成“这种行为使研究出错”，需要文章额外讨论研究可靠性，原段没有这一步。</p>\n</section>"},{"title":"B. will mislead behavioral studies","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.\n>\n> 不断出现的研究表明，积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。\n\n作者援引新研究来支持同伴影响确实存在，再以模仿解释其自然发生方式。随后质疑的是外部人员能否成功控制这个过程，没有推翻刚引用的研究。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Unconscious imitation can mislead researchers into drawing incorrect conclusion usly noticing that they are doing so.\n>\n> 人们模仿日常看到的行为，却没有清楚意识到自己正在这样做。\n\nC所需的不自觉性在冒号后的解释中已经明说。它能同时接住前面的两类习惯，并给后文讨论外部控制提供自然过程这一前提。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-C-0\"><blockquote>\n<p>第五段说明，我们往往在没有意识到的情况下模仿行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>without our realizing it</code>直接改写<code>unconsciously</code>。它概括的是前面好坏习惯都能传播的共同发生方式，而不是只取其中一种后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，我们往往在没有意识到的情况下模仿行为。</p>\n</blockquote>\n<p>本段先给出研究发现：<code>positive health habits—as well as negative ones</code>都会通过朋友网络和社会交流传播。随后<code>This is a subtle form of peer pressure</code>中的<code>This</code>接住这种传播，冒号后解释它具体怎样发生。</p>\n<p><code>we unconsciously imitate the behavior we see every day</code>里，<code>unconsciously</code>修饰<code>imitate</code>，就是没有意识到自己正在模仿。C的<code>occurs without our realizing it</code>把同一个动作特点说得更完整。</p>\n<p>这个解释同时适用于前面积极和消极的习惯，所以能概括段落共同说明的方式。第六段接着问外部人员能否选择我们的同伴、控制这种过程，也正是先承认自然模仿存在，再讨论能否人为利用。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day</p>\n<p>这是一种不易察觉的同伴压力：我们不自觉地模仿每天看到的行为。</p>\n</blockquote>\n<p>研究发现之后，作者没有只挑坏习 —spread through networks of friends via social communication.</p>\n<p>we unconsciously imitate the behavior we see every day.</p>\n<p>积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。我们不自觉地模仿每天看到的行为。</p>\n</blockquote>\n<p>作者先把好习惯和坏习惯并排，再用<code>This</code>与冒号说明二者如何通过不自觉模仿传播。后文转入人为干预是否有效，没有只继续追踪坏习惯。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Through imitation, people may pick up unhealthy habits from those around them.</p>\n<p>通过模仿，人们可能从周围的人那里学到不健康的习惯。</p>\n</blockquote>\n<p>这一说法与第一句中的一部分相容，不能硬说它是假的。但它只能重述一种结果，不能替代冒号之后对共同机制的解释。题目在C、D之间取更完整对应段落落点的C。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. C**\n\n- A：朋友网络是习惯传播经过的途径。A用harmful to把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。\n- B：研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留research shows的关系。\n- C：without our realizing it直接改写unconsciously。它概括的是前面好坏习惯都能传播的共同发生方式，而不是只取其中一种后果。\n- D：原文确实承认坏习惯会传播，D并非与此相反。但本段把好坏习惯并列后，进一步解释两者共同的不自觉模仿方式，C比只取坏习惯的D更贴近这一落点。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1258,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"24","questionConclusion":true},"html":"<blockquote>\n<p><strong>24. C</strong></p>\n</blockquote>\n<ul>\n<li>A：朋友网络是习惯传播经过的途径。A用harmful to把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。</li>\n<li>B：研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留research shows的关系。</li>\n<li>C：without our realizing it直接改写unconsciously。它概括的是前面好坏习惯都能传播的共同发生方式，而不是只取其中一种后果。</li>\n<li>D：原文确实承认坏习惯会传播，D并非与此相反。但本段把好坏习惯并列后，进一步解释两者共同的不自觉模仿方式，C比只取坏习惯的D更贴近这一落点。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> The author suggests in the last paragraph that the effect of peer pressure is, ______.\n>\n> 作者在最后一段暗示，同伴压力的效果怎么样？\n\n### 题型\n\n局部观点题。题干限定最后一段，问作者怎样评价利用同伴压力的效果。\n\nhowever把自然影响确实存在与外部安排能否成功分开。教师配对是后一问题的例子，不能直接拿前段的强大影响作答案。\n\n### 核心出处\n\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions\n>\n> The tactic never really works.\n>\n> by pairing them with better-behaved classmates.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>The author suggests in the last paragraph that the effect of peer pressure is, ______.</p>\n<p>作者在最后一段暗示，同伴压力的效果怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部观点题。题干限定最后一段，问作者怎样评价利用同伴压力的效果。</p>\n<p>however把自然影响确实存在与外部安排能否成功分开。教师配对是后一问题的例子，不能直接拿前段的强大影响作答案。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>by pairing them with better-behaved classmates.</p>\n</blockquote>\n"},{"title":"A. harmful","raw":"### A. harmful\n\n> 作者在末段认为，人为利用同伴压力的效果是有害的。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。\n\n**出处：**\n\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions\n>\n> The tactic never really works.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n</blockquote>\n</section>"},{"title":"A. harmful","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者在末段认为，人为利用同伴压力的效果是有害的。\n\n末段承接上一段对自然影响的承认，转而问专家和官员能否选定我们的同伴群体，并把活动引向好的方向。`Far less certain`限定的就是这项人为利用能否成功。\n\n教师把表现不好的学生与表现更好的同学配在一起，希望改善行为，结果`The tactic never really works`。这说明策略没有实现预期，并没有接着说学生行为更坏或同伴关系受损。\n\nA的`harmful`则要求实际出现伤害。前文曾说坏习惯会自然传播，也不能搬来充当这个安排已经造成坏结果的证据。末段怀疑的是利用成效，D比A准确。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p>末段承接上一段对自然影响的承认，转而问专家和官员能否选定我们的同伴群体，并把活动引向好的方向。<code>Far less certain</code>限定的就是这项人为利用能否成功。</p>\n<p>教师把表现不好的学生与表现更好的同学配在一起，希望改善行为，结果<code>The tactic never really works</code>。这说明策略没有实现预期，并没有接着说学生行为更坏或同伴关系受损。</p>\n<p>A的<code>harmful</code>则要求实际出现伤害。前文曾说坏习惯会自然传播，也不能搬来充当这个安排已经造成坏结果的证据。末段怀疑的是利用成效，D比A准确。</p>\n</section>"},{"title":"A. harmful","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions\n>\n> The tactic never really works.\n>\n> 然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。\n\n作者先提出外部安排能否成功的不确定性，再举教师配对的例子，最后用我们坚持自己选朋友解释为什么安排难以奏效。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Arranging peer groups in this way causes harm to the people involved.\n>\n> 这样安排同伴群体会给参与其中的人造成伤害。\n\nA需要出现损害结果。实际结尾说明自主择友使外部安排难以控制，没有把无效进一步写成有害。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p>末段承接上一段对自然影响的承认，转而问专家和官员能否选定我们的同伴群体，并把活动引向好的方向。<code>Far less certain</code>限定的就是这项人为利用能否成功。</p>\n<p>教师把表现不好的学生与表现更好的同学配在一起，希望改善行为，结果<code>The tactic never really works</code>。这说明策略没有实现预期，并没有接着说学生行为更坏或同伴关系受损。</p>\n<p>A的<code>harmful</code>则要求实际出现伤害。前文曾说坏习惯会自然传播，也不能搬来充当这个安排已经造成坏结果的证据。末段怀疑的是利用成效，D比A准确。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。</p>\n</blockquote>\n<p>作者先提出外部安排能否成功的不确定性，再举教师配对的例子，最后用我们坚持自己选朋友解释为什么安排难以奏效。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Arranging peer groups in this way causes harm to the people involved.</p>\n<p>这样安排同伴群体会给参与其中的人造成伤害。</p>\n</blockquote>\n<p>A需要出现损害结果。实际结尾说明自主择友使外部安排难以控制，没有把无效进一步写成有害。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. desirable","raw":"### B. desirable\n\n> 作者在末段认为，人为利用同伴压力的效果令人满意。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n与表现更好的同学配对是教师的希望，`never really works`才是作者给出的结果。B把改善意图当成已经实现的成效。\n\n**出处：**\n\n> by pairing them with better-behaved classmates.\n>\n> The tactic never really works.\n>\n> we insist on choosing our own friends.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-B-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果令人满意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>与表现更好的同学配对是教师的希望，<code>never really works</code>才是作者给出的结果。B把改善意图当成已经实现的成效。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>by pairing them with better-behaved classmates.</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n</blockquote>\n</section>"},{"title":"B. desirable","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者在末段认为，人为利用同伴压力的效果令人满意。\n\n`desirable`是令人满意、值得期待的。末段确实出现`virtuous directions`和`better-behaved classmates`，但前者是专家想引导的方向，后者是教师希望借用的积极同伴。\n\n评价结果要继续读：`The tactic never really works`说这种办法 urceH":2262},"level":4,"meta":{"question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-C-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果深远。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>前面承认自然同伴关系有巨大影响，末段另问这种力量能否由外部人员成功操控。C把自然影响的强大直接当成人为干预的深远效果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>enormous influence on our behavior.</p>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果深远。</p>\n</blockquote>\n<p>C的<code>profound</code>容易让我们想到前面的<code>enormous influence on our behavior</code>。这句话确实承认身边人会强烈影响我们的行为，不能把作者理解为全面否认同伴影响。</p>\n<p>但末段用<code>Far less certain, however</code>另起问题：专家和官员能否选定群体，并成功引导其活动？自然形成的朋友关系会产生影响，不代表外人安排的关系也能取得同样效果。</p>\n<p>教师配对的失败例子正是在说明后者受限制。C越过这个转折，把前面已承认的自然力量搬来评价后面待检验的干预，没有回答题干限定的末段判断。</p>\n</section>"},{"title":"C. profound","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> enormous influence on our behavior.\n>\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions\n>\n> The tactic never really works.\n>\n> 对我们的行为有巨大影响。然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。\n\n文章先承认同伴影响存在，再以`however`转向能否人为控制。教师的例子和自主择友的结尾都在限制这种控制，而非继续夸大自然影响的强度。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Experts can create a profound effect on behavior by choosing people’s peer groups for them.\n>\n> 专家通过替人们选择同伴群体，可以对行为产生深远影响。\n\nC需要从自然力量强大进一步证明外部选择也能奏效。原文恰恰把这一步单独提出来怀疑，不能用前一层事实替后一层补上成功结果。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","con
