 a profound effect on behavior by choosing people’s peer groups for them.</p>\n<p>专家通过替人们选择同伴群体，可以对行为产生深远影响。</p>\n</blockquote>\n<p>C需要从自然力量强大进一步证明外部选择也能奏效。原文恰恰把这一步单独提出来怀疑，不能用前一层事实替后一层补上成功结果。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. questionable","raw":"### D. questionable\n\n> 作者在末段认为，人为利用同伴压力的效果值得怀疑。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n`questionable`概括`Far less certain`，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。\n\n**出处：**\n\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions\n>\n> The tactic never really works.\n>\n> we insist on choosing our own friends.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>questionable</code>概括<code>Far less certain</code>，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n</blockquote>\n</section>"},{"title":"D. questionable","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者在末段认为，人为利用同伴压力的效果值得怀疑。\n\n先保留末段讨论的范围：专家和官员替我们选择同伴群体、引导其活动，这种做法能否成功？原文用`Far less certain`直接表示把握不足，D的`questionable`与这个评价对应。\n\n随后教师把学生与表现更好的同学配对，是上述外部安排的一个具体例子。`The tactic never really works`表明预期没有实现，`we insist on choosing our own friends`再说明限制来自自主择友。\n\nD把直接评价与例子的结果合在一起，得到对干预成效的怀疑。它不必扩展成“同伴压力从不影响人”，因为第五段已经承认自然影响，末段所怀疑的是外人能否按自己的目标操控它。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>questionable</code>概括<code>Far less certain</code>，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p>先保留末段讨论的范围：专家和官员替我们选择同伴群体、引导其活动，这种做法能否成功？原文用<code>Far less certain</code>直接表示把握不足，D的<code>questionable</code>与这个评价对应。</p>\n<p>随后教师把学生与表现更好的同学配对，是上述外部安排的一个具体例子。<code>The tactic never really works</code>表明预期没有实现，<code>we insist on choosing our own friends</code>再说明限制来自自主择友。</p>\n<p>D把直接评价与例子的结果合在一起，得到对干预成效的怀疑。它不必扩展成“同伴压力从不影响人”，因为第五段已经承认自然影响，末段所怀疑的是外人能否按自己的目标操控它。</p>\n</section>"},{"title":"D. questionable","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions\n>\n> The tactic never really works.\n>\n> we insist on choosing our own friends.\n>\n> 然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。我们坚持自己选择朋友。\n\n末段从不确定判断进入教师安排的实例，再用人们自行选择朋友收尾。三个位置都围绕外部控制为什么难以保证成功。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Although peer influence exists, efforts to direct it by assigning people to groups may fail because they choose their own friends.\n>\n> 同伴影响虽然存在，但通过安排群体来引导它的尝试可能失败，因为人们会自行选择朋友。\n\nD所需的成效疑问能由评价、例子和原因共同支持。它保留了自然影响与人为控制的区别，也没有把不成功进一步改成造成伤害。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>questionable</code>概括<code>Far less certain</code>，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p>先保留末段讨论的范围：专家和官员替我们选择同伴群体、引导其活动，这种做法能否成功？原文用<code>Far less certain</code>直接表示把握不足，D的<code>questionable</code>与这个评价对应。</p>\n<p>随后教师把学生与表现更好的同学配对，是上述外部安排的一个具体例子。<code>The tactic never really works</code>表明预期没有实现，<code>we insist on choosing our own friends</code>再说明限制来自自主择友。</p>\n<p>D把直接评价与例子的结果合在一起，得到对干预成效的怀疑。它不必扩展成“同伴压力从不影响人”，因为第五段已经承认自然影响，末段所怀疑的是外人能否按自己的目标操控它。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n<p>然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。我们坚持自己选择朋友。</p>\n</blockquote>\n<p>末段从不确定判断进入教师安排的实例，再用人们自行选择朋友收尾。三个位置都围绕外部控制为什么难以保证成功。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Although peer influence exists, efforts to direct it by assigning people to groups may fail because they choose their own friends.</p>\n<p>同伴影响虽然存在，但通过安排群体来引导它的尝试可能失败，因为人们会自行选择朋友。</p>\n</blockquote>\n<p>D所需的成效疑问能由评价、例子和原因共同支持。它保留了自然影响与人为控制的区别，也没有把不成功进一步改成造成伤害。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. D**\n\n- A：作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。\n- B：与表现更好的同学配对是教师的希望，never really works才是作者给出的结果。B把改善意图当成已经实现的成效。\n- C：前面承认自然同伴关系有巨大影响，末段另问这种力量能否由外部人员成功操控。C把自然影响的强大直接当成人为干预的深远效果。\n- D：questionable概括Far less certain，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1625,1344,452],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. D</strong></p>\n</blockquote>\n<ul>\n<li>A：作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。</li>\n<li>B：与表现更好的同学配对是教师的希望，never really works才是作者给出的结果。B把改善意图当成已经实现的成效。</li>\n<li>C：前面承认自然同伴关系有巨大影响，末段另问这种力量能否由外部人员成功操控。C把自然影响的强大直接当成人为干预的深远效果。</li>\n<li>D：questionable概括Far less certain，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：同伴压力的传统认知与新观点**（段落1核心论点） 同伴压力通常被视为负面力量：（导致酗酒、吸毒、随意性行为）// 罗森伯格提出新观点：（同伴压力可以成为积极力量，通过\"社会疗法\"改善生活）\n\n↓（具体举例说明）\n\n**逻辑层次2：社会疗法的实践案例**（段落2具体例证） 南卡罗来纳州：\"向烟雾宣战\"项目（让吸烟变得不酷）+ 南非：loveLife项目（在同龄人中推广安全性行为）\n\n→（深入分析现状）\n\n**逻辑层次3：公共健康运动的问题与解决方案**（段落3批判与建议） 罗森伯格的批判：【现有公共健康运动的失败：（未能动员同伴压力 + 误解心理学原理）→ 案例：\"敢于与众不同\"（忽视青少年渴望融入的心理）】→ 建议：向广告商学习运用同伴压力\n\n//（转折：批判该理论）\n\n**逻辑层次4：社会疗法的缺陷**（段落4反面论证） 书籍本身的问题：（过多无关细节 + 缺乏深入探讨）→ 实践效果的问题：【持续时间短：（\"向烟雾宣战\"因资金削减而失败）+ （loveLife效果有限且混杂）】\n\n↓（理论基础与现实困境）\n\n**逻辑层次5：同伴压力的科学基础与实施困境**（段落5-6总结反思） 科学事实：（同伴群体确实影响行为 + 健康习惯通过社交网络传播 + 无意识模仿是微妙的同伴压力）// 实施困境：（专家难以成功选择和引导同伴群体）→ 类比：（如同老师拆散捣蛋鬼的策略失败）→ 根本问题：【外部设计的局限性：（人们坚持自主选择朋友）】\n\n↑（总体评价）\n\n全文核心观点：同伴压力可以被用作积极的社会改变工具（社会疗法），但外部设计和实施这种压力面临根本性挑战——人们倾向于自主选择朋友圈，而非接受外部安排。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：同伴压力的传统认知与新观点</strong>（段落1核心论点） 同伴压力通常被视为负面力量：（导致酗酒、吸毒、随意性行为）// 罗森伯格提出新观点：（同伴压力可以成为积极力量，通过&quot;社会疗法&quot;改善生活）</p>\n<p>↓（具体举例说明）</p>\n<p><strong>逻辑层次2：社会疗法的实践案例</strong>（段落2具体例证） 南卡罗来纳州：&quot;向烟雾宣战&quot;项目（让吸烟变得不酷）+ 南非：loveLife项目（在同龄人中推广安全性行为）</p>\n<p>→（深入分析现状）</p>\n<p><strong>逻辑层次3：公共健康运动的问题与解决方案</strong>（段落3批判与建议） 罗森伯格的批判：【现有公共健康运动的失败：（未能动员同伴压力 + 误解心理学原理）→ 案例：&quot;敢于与众不同&quot;（忽视青少年渴望融入的心理）】→ 建议：向广告商学习运用同伴压力</p>\n<p>//（转折：批判该理论）</p>\n<p><strong>逻辑层次4：社会疗法的缺陷</strong>（段落4反面论证） 书籍本身的问题：（过多无关细节 + 缺乏深入探讨）→ 实践效果的问题：【持续时间短：（&quot;向烟雾宣战&quot;因资金削减而失败）+ （loveLife效果有限且混杂）】</p>\n<p>↓（理论基础与现实困境）</p>\n<p><strong>逻辑层次5：同伴压力的科学基础与实施困境</strong>（段落5-6总结反思） 科学事实：（同伴群体确实影响行为 + 健康习惯通过社交网络传播 + 无意识模仿是微妙的同伴压力）// 实施困境：（专家难以成功选择和引导同伴群体）→ 类比：（如同老师拆散捣蛋鬼的策略失败）→ 根本问题：【外部设计的局限性：（人们坚持自主选择朋友）】</p>\n<p>↑（总体评价）</p>\n<p>全文核心观点：同伴压力可以被用作积极的社会改变工具（社会疗法），但外部设计和实施这种压力面临根本性挑战——人们倾向于自主选择朋友圈，而非接受外部安排。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. A potentially positive use of an unpopular force\n\n> 通常不受欢迎的力量也可能有积极用途\n\n以同伴压力的常见负面印象开头，再由But转向社会疗法的积极设想。前后讨论的是同一种群体力量的不同用法，不能因为开头列举不良行为，就漏掉后半段的改善目标。\n\n> Come on – Everybody’s doing it.\n\n`Everybody’s doing it`用大家都这样做来劝一个人加入，半是邀请、半是压力，先把同伴压力发生的方式摆出来。\n\n> It usually leads to no good – drinking, drugs and casual sex.\n\n`usually leads to no good`给出常见的负面看法，后面的酗酒、吸毒等是这类后果的例子。标题中的`unpopular force`能接住这种一般印象。\n\n> But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.\n\n`But`后仍以`peer pressure`作主语，却改说它`can also be a positive force`。`in which`继续说明组织怎样利用群体力量帮助个人，积极用途不是标题额外加出来的。\n\n这一部分的推进关系是：\n\n> 大家都这样做的劝导 → 通常被视为坏行为的来源 → 同一力量也可能被积极利用 → 介绍社会疗法\n\nunpopular force接住通常导致不良行为的同伴压力，potentially positive use接住can also be a positive force。can表示可能用途，并未保证项目成功。\n\n再看最强干扰项G：Rejecting the existence of peer influence altogether。\n\n末段才会讨论外部安排的限度，本文从未因此否认同伴影响存在；首段更直接承认这种力量可能改善生活。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. A potentially positive use of an unpopular force</p>\n<blockquote>\n<p>通常不受欢迎的力量也可能有积极用途</p>\n</blockquote>\n<p>以同伴压力的常见负面印象开头，再由But转向社会疗法的积极设想。前后讨论的是同一种群体力量的不同用法，不能因为开头列举不良行为，就漏掉后半段的改善目标。</p>\n<blockquote>\n<p>Come on – Everybody’s doing it.</p>\n</blockquote>\n<p><code>Everybody’s doing it</code>用大家都这样做来劝一个人加入，半是邀请、半是压力，先把同伴压力发生的方式摆出来。</p>\n<blockquote>\n<p>It usually leads to no good – drinking, drugs and casual sex.</p>\n</blockquote>\n<p><code>usually leads to no good</code>给出常见的负面看法，后面的酗酒、吸毒等是这类后果的例子。标题中的<code>unpopular force</code>能接住这种一般印象。</p>\n<blockquote>\n<p>But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<p><code>But</code>后仍以<code>peer pressure</code>作主语，却改说它<code>can also be a positive force</code>。<code>in which</code>继续说明组织怎样利用群体力量帮助个人，积极用途不是标题额外加出来的。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>大家都这样做的劝导 → 通常被视为坏行为的来源 → 同一力量也可能被积极利用 → 介绍社会疗法</p>\n</blockquote>\n<p>unpopular force接住通常导致不良行为的同伴压力，potentially positive use接住can also be a positive force。can表示可能用途，并未保证项目成功。</p>\n<p>再看最强干扰项G：Rejecting the existence of peer influence altogether。</p>\n<p>末段才会讨论外部安排的限度，本文从未因此否认同伴影响存在；首段更直接承认这种力量可能改善生活。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】F. Why health campaigns should understand the wish to belong\n\n> 健康宣传为何应理解融入群体的愿望\n\n先列禁烟与安全性行为项目，再通过禁烟口号的反例说明宣传为何失灵。青少年想融入群体，口号却要求与众不同；应向广告商学习的是运用这种心理的方法。\n\n> Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking  program called Rage Against the Haze sets out to make cigarettes uncool.\n\n`social cure in action`说明本段从概念进入实际运用；让吸烟变得不酷，正是把青少年在同伴面前的形象与健康行为联系起来。\n\n> Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology.\n\n批评的具体内容紧跟在冒号后：这些宣传没有调动同伴压力，而且误解青少年心理。后面的`Dare to be different`与`fitting in`把冲突说明白了——宣传要求不同，受众却想融入。\n\n> Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.\n\n`take a page from advertisers`把前面的心理问题接成方法建议。要学的内容也明确写成`applying peer pressure`，因此标题落在健康宣传理解归属愿望，而非笼统赞美广告。\n\n这一部分的推进关系是：\n\n> 公共卫生项目利用同伴评价 → 反例显示宣传与归属愿望相反 → 指出心理理解不足 → 建议学习广告商运用同伴压力的方法\n\nhealth campaigns概括两个公共卫生项目，wish to belong对应fitting in；标题能够把实践例子和方法建议接在一起。\n\n再看最强干扰项D：Guaranteeing lasting success by recruiting advertisers。\n\ntake a page from说借鉴方法，并非招募人员。段落也没有证明这些项目一定带来持久改变，guaranteeing额外加上了结果保证。\n\n**42题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】F. Why health campaigns should understand the wish to belong</p>\n<blockquote>\n<p>健康宣传为何应理解融入群体的愿望</p>\n</blockquote>\n<p>先列禁烟与安全性行为项目，再通过禁烟口号的反例说明宣传为何失灵。青少年想融入群体，口号却要求与众不同；应向广告商学习的是运用这种心理的方法。</p>\n<blockquote>\n<p>Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking  program called Rage Against the Haze sets out to make cigarettes uncool.</p>\n</blockquote>\n<p><code>social cure in action</code>说明本段从概念进入实际运用；让吸烟变得不酷，正是把青少年在同伴面前的形象与健康行为联系起来。</p>\n<blockquote>\n<p>Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology.</p>\n</blockquote>\n<p>批评的具体内容紧跟在冒号后：这些宣传没有调动同伴压力，而且误解青少年心理。后面的<code>Dare to be different</code>与<code>fitting in</code>把冲突说明白了——宣传要求不同，受众却想融入。</p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<p><code>take a page from advertisers</code>把前面的心理问题接成方法建议。要学的内容也明确写成<code>applying peer pressure</code>，因此标题落在健康宣传理解归属愿望，而非笼统赞美广告。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公共卫生项目利用同伴评价 → 反例显示宣传与归属愿望相反 → 指出心理理解不足 → 建议学习广告商运用同伴压力的方法</p>\n</blockquote>\n<p>health campaigns概括两个公共卫生项目，wish to belong对应fitting in；标题能够把实践例子和方法建议接在一起。</p>\n<p>再看最强干扰项D：Guaranteeing lasting success by recruiting advertisers。</p>\n<p>take a page from说借鉴方法，并非招募人员。段落也没有证明这些项目一定带来持久改变，guaranteeing额外加上了结果保证。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】E. Questions about explanation and lasting effectiveness\n\n> 对原因解释和持久成效的质疑\n\nBut把评价转到总体有效性。作者分别指出书里原因探究不足，以及疗法效果不持久；两个项目的后续情况用于说明后一项问题。\n\n> But on the general effectiveness of the social cure, Rosenberg is less persuasive.\n\n`But`承接上一段对方法建议的肯定，改问社会疗法是否普遍有效。`less persuasive`限定了这次评价：对一个建议说得有道理，不等于对总体效果也证明充分。\n\n> The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long.\n\n`doesn’t work very well for very long`同时涉及效果和持续时间。前面还有`not enough exploration`，指出书对社会与生物原因探究不足，所以标题需要覆盖解释与实践两层。\n\n> Evidence that the loveLife program produces lasting changes is limited and mixed.\n\n`limited and mixed`说的是持久改变的证据有限、结果不一致，不能改成已经证明绝无效果。连同拨款削减后项目失败，它支撑的是长期有效性仍有疑问。\n\n这一部分的推进关系是：\n\n> 转向总体有效性 → 书中原因探究不足 → 项目难以维持效果 → 长期证据有限且不一致\n\nexplanation对应not enough exploration，lasting effectiveness对应doesn’t work very well for very long。标题同时覆盖论证不足和效果不足。\n\n再看最强干扰项D：Guaranteeing lasting success by recruiting advertisers。\n\n段落展示的是长期证据有限以及拨款削减后失败，无法推出招募广告商就能解决这些缺陷。\n\n**43题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】E. Questions about explanation and lasting effectiveness</p>\n<blockquote>\n<p>对原因解释和持久成效的质疑</p>\n</blockquote>\n<p>But把评价转到总体有效性。作者分别指出书里原因探究不足，以及疗法效果不持久；两个项目的后续情况用于说明后一项问题。</p>\n<blockquote>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive.</p>\n</blockquote>\n<p><code>But</code>承接上一段对方法建议的肯定，改问社会疗法是否普遍有效。<code>less persuasive</code>限定了这次评价：对一个建议说得有道理，不等于对总体效果也证明充分。</p>\n<blockquote>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long.</p>\n</blockquote>\n<p><code>doesn’t work very well for very long</code>同时涉及效果和持续时间。前面还有<code>not enough exploration</code>，指出书对社会与生物原因探究不足，所以标题需要覆盖解释与实践两层。</p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n<p><code>limited and mixed</code>说的是持久改变的证据有限、结果不一致，不能改成已经证明绝无效果。连同拨款削减后项目失败，它支撑的是长期有效性仍有疑问。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>转向总体有效性 → 书中原因探究不足 → 项目难以维持效果 → 长期证据有限且不一致</p>\n</blockquote>\n<p>explanation对应not enough exploration，lasting effectiveness对应doesn’t work very well for very long。标题同时覆盖论证不足和效果不足。</p>\n<p>再看最强干扰项D：Guaranteeing lasting success by recruiting advertisers。</p>\n<p>段落展示的是长期证据有限以及拨款削减后失败，无法推出招募广告商就能解决这些缺陷。</p>\n<p><strong>43题选E。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】B. The everyday spread of both good and bad habits\n\n> 好坏习惯在日常交往中的传播\n\n先承认同伴群体有强大影响，再把积极与消极习惯并列，最后用不自觉模仿说明它们共同的传播方式。这里讨论自然发生的日常过程。\n\n> There’s no doubt that our peer groups exert enormous influence on our behavior.\n\n`There’s no doubt`先肯定同伴群体确实有影响，接住前文质疑疗法后容易产生的疑问：疗法成效不足，不等于这种自然力量不存在。\n\n> An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication.\n\n`positive ... as well as negative`把好坏习惯并列，`through networks`与`via social communication`又说明传播路径。标题的`both good and bad habits`保留了这个范围。\n\n> This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.\n\n`This`回指前面的传播，冒号后的`unconsciously imitate`解释它怎样发生；`every day`则把这种影响放在普通日常接触中，正好对应标题的`everyday spread`。\n\n这一部分的推进关系是：\n\n> 承认同伴影响存在 → 好坏习惯都会经朋友网络传播 → 日常不自觉模仿解释共同过程\n\nboth good and bad保留并列范围，everyday spread概括朋友网络与每天看到的行为，没有把效果缩成只有坏习惯。\n\n再看最强干扰项G：Rejecting the existence of peer influence altogether。\n\nThere’s no doubt与否认影响存在方向相反。作者保留这个事实，才在下一段另问外部人员能否利用它。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】B. The everyday spread of both good and bad habits</p>\n<blockquote>\n<p>好坏习惯在日常交往中的传播</p>\n</blockquote>\n<p>先承认同伴群体有强大影响，再把积极与消极习惯并列，最后用不自觉模仿说明它们共同的传播方式。这里讨论自然发生的日常过程。</p>\n<blockquote>\n<p>There’s no doubt that our peer groups exert enormous influence on our behavior.</p>\n</blockquote>\n<p><code>There’s no doubt</code>先肯定同伴群体确实有影响，接住前文质疑疗法后容易产生的疑问：疗法成效不足，不等于这种自然力量不存在。</p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication.</p>\n</blockquote>\n<p><code>positive ... as well as negative</code>把好坏习惯并列，<code>through networks</code>与<code>via social communication</code>又说明传播路径。标题的<code>both good and bad habits</code>保留了这个范围。</p>\n<blockquote>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n</blockquote>\n<p><code>This</code>回指前面的传播，冒号后的<code>unconsciously imitate</code>解释它怎样发生；<code>every day</code>则把这种影响放在普通日常接触中，正好对应标题的<code>everyday spread</code>。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>承认同伴影响存在 → 好坏习惯都会经朋友网络传播 → 日常不自觉模仿解释共同过程</p>\n</blockquote>\n<p>both good and bad保留并列范围，everyday spread概括朋友网络与每天看到的行为，没有把效果缩成只有坏习惯。</p>\n<p>再看最强干扰项G：Rejecting the existence of peer influence altogether。</p>\n<p>There’s no doubt与否认影响存在方向相反。作者保留这个事实，才在下一段另问外部人员能否利用它。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】A. The limits of directing friendships from outside\n\n> 从外部安排友谊的局限\n\nhowever将自然影响与外部干预区分。教师配对的例子解释安排为什么不奏效，结尾自主选择朋友点出对这种干预的限制。\n\n> Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions.\n\n`however`把问题由自然影响转向专家和官员能否主动选择群体、引导活动。`Far less certain`不是否定上一段的事实，而是对这一层控制是否成功保留怀疑。\n\n> The tactic never really works.\n\n`The tactic`回指教师让学生与表现较好的同学配对的办法；`never really works`评价实际成效，不能把教师希望改善行为的目标当成结果。\n\n> And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.\n\n冒号后`we insist on choosing our own friends`解释外部设计受什么限制。它从课堂推广到真实生活，说明人们的自主选择为何使安排同伴关系难以按计划产生效果。\n\n这一部分的推进关系是：\n\n> 自然影响存在 → 外部选择与引导未必成功 → 教师配对并不奏效 → 自主择友限制外部安排\n\ndirecting friendships from outside对应专家选群体、教师配对和engineered from the outside；limits对应成功程度不确定及自主选择的障碍。\n\n再看最强干扰项G：Rejecting the existence of peer influence altogether。\n\n对外部控制存疑不等于否认同伴影响存在。这个标题删除了上一段明确保留的事实，也换掉本段被评价的对象。\n\n**45题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】A. The limits of directing friendships from outside</p>\n<blockquote>\n<p>从外部安排友谊的局限</p>\n</blockquote>\n<p>however将自然影响与外部干预区分。教师配对的例子解释安排为什么不奏效，结尾自主选择朋友点出对这种干预的限制。</p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions.</p>\n</blockquote>\n<p><code>however</code>把问题由自然影响转向专家和官员能否主动选择群体、引导活动。<code>Far less certain</code>不是否定上一段的事实，而是对这一层控制是否成功保留怀疑。</p>\n<blockquote>\n<p>The tactic never really works.</p>\n</blockquote>\n<p><code>The tactic</code>回指教师让学生与表现较好的同学配对的办法；<code>never really works</code>评价实际成效，不能把教师希望改善行为的目标当成结果。</p>\n<blockquote>\n<p>And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n</blockquote>\n<p>冒号后<code>we insist on choosing our own friends</code>解释外部设计受什么限制。它从课堂推广到真实生活，说明人们的自主选择为何使安排同伴关系难以按计划产生效果。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>自然影响存在 → 外部选择与引导未必成功 → 教师配对并不奏效 → 自主择友限制外部安排</p>\n</blockquote>\n<p>directing friendships from outside对应专家选群体、教师配对和engineered from the outside；limits对应成功程度不确定及自主选择的障碍。</p>\n<p>再看最强干扰项G：Rejecting the existence of peer influence altogether。</p>\n<p>对外部控制存疑不等于否认同伴影响存在。这个标题删除了上一段明确保留的事实，也换掉本段被评价的对象。</p>\n<p><strong>45题选A。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出同伴压力也可能用于改善生活 |\n| B | 区分自然形成的影响与外部安排 |\n| C | 用教师配对解释自主选朋友如何限制控制 |\n| D | 由融入需要提出方法建议，并追问持久成效 |\n| E | 列出长期成效和原因解释的不足 |\n| F | 用公共卫生项目说明积极运用同伴心理 |\n| G | 保留好坏习惯自然传播这一基础事实 |\n| H | 总结自然影响与干预成功需要不同证据 |\n\n全文推进：\n\n> 提出同伴压力也可能用于改善生活 → 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效 → 列出长期成效和原因解释的不足 → 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制 → 总结自然影响与干预成功需要不同证据\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出同伴压力也可能用于改善生活</td>\n</tr>\n<tr>\n<td>B</td>\n<td>区分自然形成的影响与外部安排</td>\n</tr>\n<tr>\n<td>C</td>\n<td>用教师配对解释自主选朋友如何限制控制</td>\n</tr>\n<tr>\n<td>D</td>\n<td>由融入需要提出方法建议，并追问持久成效</td>\n</tr>\n<tr>\n<td>E</td>\n<td>列出长期成效和原因解释的不足</td>\n</tr>\n<tr>\n<td>F</td>\n<td>用公共卫生项目说明积极运用同伴心理</td>\n</tr>\n<tr>\n<td>G</td>\n<td>保留好坏习惯自然传播这一基础事实</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结自然影响与干预成功需要不同证据</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出同伴压力也可能用于改善生活 → 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效 → 列出长期成效和原因解释的不足 → 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制 → 总结自然影响与干预成功需要不同证据</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → D。\n\n先看前段A的结尾：\n\n> She calls this positive application the social cure.\n\n再看F段开头：\n\n> This social cure is illustrated by campaigns against smoking and unsafe sex.\n\nA末尾第一次给积极应用命名为`the social cure`，F开头的`This social cure`直接回指它。`is illustrated by`再把刚提出的概念带到禁烟和安全性行为的实例中，先有定义，才有这个回指和例证。\n\n本段内部继续写道：\n\n> Instead of addressing each person in isolation, the projects try to make healthy behavior attractive among peers. Their method depends on understanding what group members want from one another, particularly the desire to belong.\n\nF没有逐个孤立劝导，而是让健康行为在同伴中显得有吸引力。末句把这种办法依赖的心理明确收束为`the desire to belong`，为下一段提供可以继续解释的愿望。\n\n后段D开头是：\n\n> That desire makes some familiar health messages doubtful.\n\nD的`That desire`正是承接F末尾的归属愿望。D接着检验让青少年与众不同的宣传，说明为什么一则看似正确的健康信息会与受众想融入的心理相冲突。\n\n这三段的推进关系：\n\n> 提出同伴压力也可能用于改善生活 → 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效\n\n再检验候选G：\n\n> These weaknesses do not show that peer influence itself is imaginary.\n\nG以`These weaknesses`开头，需要前面已经列出疗法或论述的弱点。A只有积极用途的提出，尚未展示成效问题；若此处接G，不但这个指代无所依附，D的`That desire`也失去刚出现的归属愿望。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>She calls this positive application the social cure.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex.</p>\n</blockquote>\n<p>A末尾第一次给积极应用命名为<code>the social cure</code>，F开头的<code>This social cure</code>直接回指它。<code>is illustrated by</code>再把刚提出的概念带到禁烟和安全性行为的实例中，先有定义，才有这个回指和例证。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Instead of addressing each person in isolation, the projects try to make healthy behavior attractive among peers. Their method depends on understanding what group members want from one another, particularly the desire to belong.</p>\n</blockquote>\n<p>F没有逐个孤立劝导，而是让健康行为在同伴中显得有吸引力。末句把这种办法依赖的心理明确收束为<code>the desire to belong</code>，为下一段提供可以继续解释的愿望。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>That desire makes some familiar health messages doubtful.</p>\n</blockquote>\n<p>D的<code>That desire</code>正是承接F末尾的归属愿望。D接着检验让青少年与众不同的宣传，说明为什么一则看似正确的健康信息会与受众想融入的心理相冲突。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出同伴压力也可能用于改善生活 → 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>These weaknesses do not show that peer influence itself is imaginary.</p>\n</blockquote>\n<p>G以<code>These weaknesses</code>开头，需要前面已经列出疗法或论述的弱点。A只有积极用途的提出，尚未展示成效问题；若此处接G，不但这个指代无所依附，D的<code>That desire</code>也失去刚出现的归属愿望。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> Their method depends on understanding what group members want from one another, particularly the desire to belong.\n\n再看D段开头：\n\n> That desire makes some familiar health messages doubtful.\n\nF以`the desire to belong`结束，D的`That desire`接住同一个愿望。紧接的`stand apart`与`fit in`形成具体冲突，因此D是在解释F刚点出的心理条件，不是突然改谈另一种需要。\n\n本段内部继续写道：\n\n> Asking teenagers to stand apart from their peers can ignore their wish to fit in. Advertisers often understand the wish more effectively. Learning from their methods is a plausible recommendation, but a promising method still leaves a separate question: whether its effects will last.\n\nD先批评让青少年与同伴不同的口号，再提出学习广告商的方法。但末句用`but`分开方法看起来有希望与成效能否持久，并明确提出`whether its effects will last`。\n\n后段E开头是：\n\n> On that question of lasting effects, the evidence is much less reassuring.\n\n固定E开头的`On that question of lasting effects`逐字接住D刚提出的持续性问题，然后才报告证据不够令人放心。问题在D末尾提出，回答在E开头开始，顺序清楚。\n\n这三段的推进关系：\n\n> 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效 → 列出长期成效和原因解释的不足\n\n再检验候选G：\n\n> These weaknesses do not show that peer influence itself is imaginary.\n\nG要承接的是已经列出的`weaknesses`。此处F还在展示积极实践和归属需要，没有具体列出长期缺点；若跳到G，E的`that question of lasting effects`也找不到刚刚提出的问题。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Their method depends on understanding what group members want from one another, particularly the desire to belong.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>That desire makes some familiar health messages doubtful.</p>\n</blockquote>\n<p>F以<code>the desire to belong</code>结束，D的<code>That desire</code>接住同一个愿望。紧接的<code>stand apart</code>与<code>fit in</code>形成具体冲突，因此D是在解释F刚点出的心理条件，不是突然改谈另一种需要。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Asking teenagers to stand apart from their peers can ignore their wish to fit in. Advertisers often understand the wish more effectively. Learning from their methods is a plausible recommendation, but a promising method still leaves a separate question: whether its effects will last.</p>\n</blockquote>\n<p>D先批评让青少年与同伴不同的口号，再提出学习广告商的方法。但末句用<code>but</code>分开方法看起来有希望与成效能否持久，并明确提出<code>whether its effects will last</code>。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>On that question of lasting effects, the evidence is much less reassuring.</p>\n</blockquote>\n<p>固定E开头的<code>On that question of lasting effects</code>逐字接住D刚提出的持续性问题，然后才报告证据不够令人放心。问题在D末尾提出，回答在E开头开始，顺序清楚。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效 → 列出长期成效和原因解释的不足</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>These weaknesses do not show that peer influence itself is imaginary.</p>\n</blockquote>\n<p>G要承接的是已经列出的<code>weaknesses</code>。此处F还在展示积极实践和归属需要，没有具体列出长期缺点；若跳到G，E的<code>that question of lasting effects</code>也找不到刚刚提出的问题。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> The book also gives too little attention to the social and biological factors that make peer influence powerful.\n\n再看G段开头：\n\n> These weaknesses do not show that peer influence itself is imaginary.\n\nE已经列出长期成效证据不足，并在结尾加上书的原因解释不够；G以`These weaknesses`把这些不足合起来，再用`do not show`限制它们能推出什么：不能据此说同伴影响不存在。\n\n本段内部继续写道：\n\n> Good habits and bad ones can both spread through networks of friends. People often imitate what they encounter every day without consciously deciding to do so. The existence of that spontaneous process is not the main point in dispute.\n\nG随后列出好坏习惯都能在朋友网络中传播，并用不自觉模仿解释这种日常过程。结尾明确说`that spontaneous process`存在与否并非主要争议，从对疗法的批评退回一个仍被承认的基础事实。\n\n后段B开头是：\n\n> What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want.\n\nB开头`What remains in dispute`接G的`not the main point in dispute`：不是争论自然过程存在不存在，而是争论外部人员能否组织它来实现目标。`the spontaneous process`也直接回指G刚解释的模仿。\n\n这三段的推进关系：\n\n> 列出长期成效和原因解释的不足 → 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排\n\n再检验候选C：\n\n> In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.\n\nC直接进入课堂配对的例子。若它紧跟E，书与疗法的缺点会突然跳到课堂，还没有说清自然影响与外部组织的区别；更直接的是，后面的B所说`the spontaneous process`也缺少G刚刚给出的完整解释。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The book also gives too little attention to the social and biological factors that make peer influence powerful.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>These weaknesses do not show that peer influence itself is imaginary.</p>\n</blockquote>\n<p>E已经列出长期成效证据不足，并在结尾加上书的原因解释不够；G以<code>These weaknesses</code>把这些不足合起来，再用<code>do not show</code>限制它们能推出什么：不能据此说同伴影响不存在。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Good habits and bad ones can both spread through networks of friends. People often imitate what they encounter every day without consciously deciding to do so. The existence of that spontaneous process is not the main point in dispute.</p>\n</blockquote>\n<p>G随后列出好坏习惯都能在朋友网络中传播，并用不自觉模仿解释这种日常过程。结尾明确说<code>that spontaneous process</code>存在与否并非主要争议，从对疗法的批评退回一个仍被承认的基础事实。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want.</p>\n</blockquote>\n<p>B开头<code>What remains in dispute</code>接G的<code>not the main point in dispute</code>：不是争论自然过程存在不存在，而是争论外部人员能否组织它来实现目标。<code>the spontaneous process</code>也直接回指G刚解释的模仿。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列出长期成效和原因解释的不足 → 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.</p>\n</blockquote>\n<p>C直接进入课堂配对的例子。若它紧跟E，书与疗法的缺点会突然跳到课堂，还没有说清自然影响与外部组织的区别；更直接的是，后面的B所说<code>the spontaneous process</code>也缺少G刚刚给出的完整解释。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> The existence of that spontaneous process is not the main point in dispute.\n\n再看B段开头：\n\n> What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want.\n\nG末尾说自然过程的存在不是主要争议，B便用`What remains in dispute`提出仍有争议的另一件事。两句一否一立，分别是承认自然传播和追问外部人员能否控制它。\n\n本段内部继续写道：\n\n> Choosing a group for someone is different from observing influence within a group that has already formed. A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.\n\nB把替别人选群体与观察已形成群体里的影响分开；随后引入`A classroom`，并明确说它能展示`natural contact and imposed arrangement`的差别。例子出现前，先给出它要说明的关系。\n\n后段C开头是：\n\n> In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.\n\nC开头的`In the classroom`接住B最后引入的课堂，具体写教师怎样安排学生配对。这个例子既有地点上的衔接，也兑现了前句要展示外部安排的承诺。\n\n这三段的推进关系：\n\n> 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制\n\n再检验候选F：\n\n> This social cure is illustrated by campaigns against smoking and unsafe sex.\n\nF以`This social cure`开头，回到积极应用的概念与公共卫生项目。在这里它既没有承接G关于争议范围的区分，也没有在结尾引出课堂；下一段的`In the classroom`会缺少刚建立的例证入口。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The existence of that spontaneous process is not the main point in dispute.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want.</p>\n</blockquote>\n<p>G末尾说自然过程的存在不是主要争议，B便用<code>What remains in dispute</code>提出仍有争议的另一件事。两句一否一立，分别是承认自然传播和追问外部人员能否控制它。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Choosing a group for someone is different from observing influence within a group that has already formed. A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.</p>\n</blockquote>\n<p>B把替别人选群体与观察已形成群体里的影响分开；随后引入<code>A classroom</code>，并明确说它能展示<code>natural contact and imposed arrangement</code>的差别。例子出现前，先给出它要说明的关系。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.</p>\n</blockquote>\n<p>C开头的<code>In the classroom</code>接住B最后引入的课堂，具体写教师怎样安排学生配对。这个例子既有地点上的衔接，也兑现了前句要展示外部安排的承诺。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex.</p>\n</blockquote>\n<p>F以<code>This social cure</code>开头，回到积极应用的概念与公共卫生项目。在这里它既没有承接G关于争议范围的区分，也没有在结尾引出课堂；下一段的<code>In the classroom</code>会缺少刚建立的例证入口。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.\n\n再看C段开头：\n\n> In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.\n\nB结尾明确说课堂可以展示自然接触与强加安排的区别，C马上以`In the classroom`进入教师配对的细节。它用一个具体安排来兑现前段的例证提示。\n\n本段内部继续写道：\n\n> The expected improvement does not simply follow from the seating plan. Pupils, like adults outside school, insist on choosing their own friends, and this choice limits the planner's control.\n\nC先写预期改善不会从座位安排中自动产生，再解释学生坚持自己选朋友。`this choice limits the planner’s control`把例子的意义收束为自主选择限制外部控制。\n\n后段H开头是：\n\n> Such limits leave room for a more careful conclusion.\n\n固定H开头的`Such limits`直接承接C末句`limits the planner’s control`。先通过教师例子看见限制，再据此得出更谨慎的结论，H的概括才有刚刚论证的对象。\n\n这三段的推进关系：\n\n> 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制 → 总结自然影响与干预成功需要不同证据\n\n再检验候选F：\n\n> This social cure is illustrated by campaigns against smoking and unsafe sex.\n\nF介绍禁烟和安全性行为项目，重心在怎样积极利用归属愿望。B已经承诺一个课堂例子，F不能兑现这个承诺；它也没有以控制受到限制收尾，无法给H的`Such limits`提供近接依据。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.</p>\n</blockquote>\n<p>B结尾明确说课堂可以展示自然接触与强加安排的区别，C马上以<code>In the classroom</code>进入教师配对的细节。它用一个具体安排来兑现前段的例证提示。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The expected improvement does not simply follow from the seating plan. Pupils, like adults outside school, insist on choosing their own friends, and this choice limits the planner&#39;s control.</p>\n</blockquote>\n<p>C先写预期改善不会从座位安排中自动产生，再解释学生坚持自己选朋友。<code>this choice limits the planner’s control</code>把例子的意义收束为自主选择限制外部控制。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Such limits leave room for a more careful conclusion.</p>\n</blockquote>\n<p>固定H开头的<code>Such limits</code>直接承接C末句<code>limits the planner’s control</code>。先通过教师例子看见限制，再据此得出更谨慎的结论，H的概括才有刚刚论证的对象。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制 → 总结自然影响与干预成功需要不同证据</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex.</p>\n</blockquote>\n<p>F介绍禁烟和安全性行为项目，重心在怎样积极利用归属愿望。B已经承诺一个课堂例子，F不能兑现这个承诺；它也没有以控制受到限制收尾，无法给H的<code>Such limits</code>提供近接依据。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 alf invitation and half pressure, is directed at the young person.** | **一条半是邀请半是压力的信息传向这个年轻人。** |\n| 图画 | The picture shows how a peer group can become a positive force. | 图画展示了同伴群体如何成为一种积极力量。 |\n| 图画 | The individuals are using the power of cooperation to improve their lives. | 这些人正借助合作的力量改善生活。 |\n| **图表** | **The chart offers a revealing look at changes in people’s everyday habits.** | **图表揭示了人们日常习惯的变化。** |\n| 图表 | The proportion of people adopting A rose from X to Y during the period. | 在这段时期内，采取A行为的人数比例从X上升到Y。 |\n| 图表 | The figures show a tendency for the behavior to spread within groups. | 数据表明这种行为有在群体内传播的趋势。 |\n| 文本评论 | The statement draws attention to the social factors behind individual choices. | 这句话把注意力引向个人选择背后的社会因素。 |\n| 文本评论 | The passage distinguishes a natural influence from an organised intervention. | 这段文字区分了自然影响与有组织的干预。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>A message, half invitation and half pressure, is directed at the young person.</strong></td>\n<td><strong>一条半是邀请半是压力的信息传向这个年轻人。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture shows how a peer group can become a positive force.</td>\n<td>图画展示了同伴群体如何成为一种积极力量。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The individuals are using the power of cooperation to improve their lives.</td>\n<td>这些人正借助合作的力量改善生活。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The chart offers a revealing look at changes in people’s everyday habits.</strong></td>\n<td><strong>图表揭示了人们日常习惯的变化。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The proportion of people adopting A rose from X to Y during the period.</td>\n<td>在这段时期内，采取A行为的人数比例从X上升到Y。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The figures show a tendency for the behavior to spread within groups.</td>\n<td>数据表明这种行为有在群体内传播的趋势。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement draws attention to the social factors behind individual choices.</td>\n<td>这句话把注意力引向个人选择背后的社会因素。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage distinguishes a natural influence from an organised intervention.</td>\n<td>这段文字区分了自然影响与有组织的干预。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. The limits of directing friendships from outside</strong></p><p><strong>B. The everyday spread of both good and bad habits</strong></p><p><strong>C. A potentially positive use of an unpopular force</strong></p><p><strong>D. Guaranteeing lasting success by recruiting advertisers</strong></p><p><strong>E. Questions about explanation and lasting effectiveness</strong></p><p><strong>F. Why health campaigns should understand the wish to belong</strong></p><p><strong>G. Rejecting the existence of peer influence altogether</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Come on – Everybody’s doing it. That whispered message, half invitation and half forcing, is what most of us think of when we hear the words peer pressure. It usually leads to no good – drinking, drugs and casual sex. But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking  program called Rage Against the Haze sets out to make cigarettes uncool. In South Africa, an HIV-prevention initiative known as loveLife recruits young people to promote safe sex among their peers. The idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>There’s no doubt that our peer groups exert enormous influence on our behavior. An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication. This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Peer pressure is often associated with drinking, drugs and other undesirable behavior. The invitation to do what everyone else is doing can seem partly like a threat. Tina Rosenberg, however, proposes that the same social force might be used to improve people&#x27;s lives. She calls this positive application the social cure.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want. Choosing a group for someone is different from observing influence within a group that has already formed. A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct. The expected improvement does not simply follow from the seating plan. Pupils, like adults outside school, insist on choosing their own friends, and this choice limits the planner&#x27;s control.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>That desire makes some familiar health messages doubtful. Asking teenagers to stand apart from their peers can ignore their wish to fit in. Advertisers often understand the wish more effectively. Learning from their methods is a plausible recommendation, but a promising method still leaves a separate question: whether its effects will last.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>On that question of lasting effects, the evidence is much less reassuring. One antismoking project failed after state funding was cut, while another programme produced limited and mixed evidence of durable change. The book also gives too little attention to the social and biological factors that make peer influence powerful.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>This social cure is illustrated by campaigns against smoking and unsafe sex. Instead of addressing each person in isolation, the projects try to make healthy behavior attractive among peers. Their method depends on understanding what group members want from one another, particularly the desire to belong.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>These weaknesses do not show that peer influence itself is imaginary. Good habits and bad ones can both spread through networks of friends. People often imitate what they encounter every day without consciously deciding to do so. The existence of that spontaneous process is not the main point in dispute.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Such limits leave room for a more careful conclusion. Recognising the power of peer groups can improve the understanding of behavior, but it does not establish that an externally designed cure will work reliably. The strength of natural influence and the success of organised intervention are distinct claims requiring different evidence.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>whispered</td>\n<td>adj.低声说出的</td>\n<td>invitation</td>\n<td>n.邀请</td>\n<td>forcing</td>\n<td>n.强迫</td>\n</tr>\n<tr>\n<td>peer pressure</td>\n<td>n.同伴压力</td>\n<td>leads to</td>\n<td>导致</td>\n<td>contends</td>\n<td>v.主张</td>\n</tr>\n<tr>\n<td>positive force</td>\n<td>积极力量</td>\n<td>social cure</td>\n<td>社会疗法</td>\n<td>group dynamics</td>\n<td>群体互动</td>\n</tr>\n<tr>\n<td>improve</td>\n<td>v.改善</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>recipient</td>\n<td>n.获得者</td>\n<td>offers</td>\n<td>v.提供</td>\n<td>examples</td>\n<td>n.例子</td>\n</tr>\n<tr>\n<td>state-sponsored</td>\n<td>adj.州政府资助的</td>\n<td>antismoking</td>\n<td>adj.反吸烟的</td>\n<td>initiative</td>\n<td>n.倡议</td>\n</tr>\n<tr>\n<td>recruits</td>\n<td>v.招募</td>\n<td>promote</td>\n<td>v.推广</td>\n<td>peers</td>\n<td>n.同龄人</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"table ><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>bureaucrats</td>\n<td>n.官僚</td>\n<td>select</td>\n<td>v.选择</td>\n<td>steer</td>\n<td>v.引导</td>\n</tr>\n<tr>\n<td>virtuous</td>\n<td>adj.有道德的</td>\n<td>troublemakers</td>\n<td>n.捣乱者</td>\n<td>pairing</td>\n<td>v.配对</td>\n</tr>\n<tr>\n<td>tactic</td>\n<td>n.策略</td>\n<td>engineered</td>\n<td>adj.人为设计的</td>\n<td>insist on</td>\n<td>坚持</td>\n</tr>\n<tr>\n<td>choosing</td>\n<td>v.选择</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Come on – Everybody’s doing it. That whispered message, half invitation and half forcing, is what most of us think of when we hear the words peer pressure. It usually leads to no good – drinking, drugs and casual sex. But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Come on -- / Everybody&#39;s doing it.</p>\n<p>That whispered message, / half invitation and half forcing, / is what most of us think of / when we hear the words / <em>peer pressure</em>.</p>\n<p>It usually leads to no good -- / drinking, drugs and casual sex.</p>\n<p>But in her new book / <em>Join the Club</em>, / Tina Rosenberg contends / that peer pressure / can also be a positive force / through what she calls / the social cure, / in which organizations and officials / use the power of group dynamics / to help individuals / improve their lives / and possibly the world.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>来吧 -- / 每个人都在做。</p>\n<p>那种窃窃私语的信息，/ 一半是邀请一半是强迫，/ 是我们大多数人想到的 / 当我们听到这些词 / <em>同伴压力</em>。</p>\n<p>它通常导致不好的事 -- / 喝酒、吸毒和随意性行为。</p>\n<p>但在她的新书中 / <em>加入俱乐部</em>，/ 蒂娜·罗森伯格主张 / 同伴压力 / 也可以是一种积极力量 / 通过她所称的 / 社会疗法，/ 在其中组织和官员们 / 使用群体动力的力量 / 来帮助个人 / 改善他们的生活 / 以及可能改善世界。</p>\n<h3>标准译文 · 第1段</h3>\n<p>&quot;来吧——大家都在做。&quot;这种半是邀请、半是强迫的窃窃私语，正是我们大多数人听到&quot;同伴压力&quot;一词时的第一反应。它通常引向不良后果——酗酒、吸毒和随意性行为。但蒂娜·罗森伯格在其新书《加入俱乐部》中提出，同伴压力也可以成为一种积极力量，她称之为&quot;社会疗法&quot;：组织和官员利用群体动力的力量，帮助个人改善生活，甚至可能改变世界。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking  program called Rage Against the Haze sets out to make cigarettes uncool. In South Africa, an HIV-prevention initiative known as loveLife recruits young people to promote safe sex among their peers.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Rosenberg, / the recipient of a Pulitzer Prize, / offers a host of examples / of the social cure in action: / In South Carolina, / a state-sponsored antismoking program / called Rage Against the Haze / sets out to make / cigarettes uncool.</p>\n<p>In South Africa, / an HIV-prevention initiative / known as loveLife / recruits young people / to promote safe sex / among their peers.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>罗森伯格，/ 普利策奖获得者，/ 提供了大量例子 / 关于社会疗法的实践：/ 在南卡罗来纳州，/ 一个州政府资助的反吸烟项目 / 叫做&quot;向烟雾宣战&quot; / 致力于让 / 香烟变得不酷。</p>\n<p>在南非，/ 一个预防艾滋病的倡议 / 被称为loveLife / 招募年轻人 / 来推广安全性行为 / 在他们的同龄人中。</p>\n<h3>标准译文 · 第2段</h3>\n<p>普利策奖得主罗森伯格提供了许多社会疗法实践的例子：在南卡罗来纳州，一个名为&quot;向烟雾宣战&quot;的州政府资助反吸烟项目，致力于让吸烟变得&quot;不酷&quot;；在南非，一个名为loveLife的艾滋病预防倡议招募年轻人，在同龄人中推广安全性行为。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>The idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<h3>意群划分 · 第3段</h3>\n<p>The idea seems promising, / and Rosenberg is a perceptive observer.</p>\n<p>Her critique / of the lameness / of many public-health campaigns / is spot-on: / they fail to mobilize / peer pressure for healthy habits, / and they demonstrate / a seriously flawed understanding / of psychology.</p>\n<p>&quot;Dare to be different, / please don&#39;t smoke!&quot; / pleads one billboard campaign / aimed at reducing smoking / among teenagers -- / <em>teenagers</em>, / who desire nothing more / than fitting in.</p>\n<p>Rosenberg argues convincingly / that public-health advocates / ought to take a page / from advertisers, / so skilled at / applying peer pressure.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>这个想法看起来很有前景，/ 而且罗森伯格是一个敏锐的观察者。</p>\n<p>她的批评 / 关于拙劣之处 / 许多公共健康运动的 / 非常准确：/ 它们未能动员 / 同伴压力来促进健康习惯，/ 而且它们展示了 / 一种严重有缺陷的理解 / 对心理学的。</p>\n<p>&quot;敢于与众不同，/ 请不要吸烟！&quot; / 恳求一个广告牌运动 / 旨在减少吸烟 / 在青少年中 -- / <em>青少年</em>，/ 他们最渴望的无非是 / 融入群体。</p>\n<p>罗森伯格令人信服地论证 / 公共健康倡导者 / 应该学习一页 / 从广告商那里，/ 如此擅长 / 运用同伴压力。</p>\n<h3>标准译文 · 第3段</h3>\n<p>这个想法看似大有可为，罗森伯格也是一位敏锐的观察者。她对许多公共健康运动之拙劣的批评可谓一针见血：这些运动未能调动同伴压力来促进健康习惯，还暴露出对心理学的严重误解。&quot;敢于与众不同，请勿吸烟！&quot;一个旨在减少青少年吸烟的广告牌如此呼吁——对象可是青少年，他们最渴望的恰恰是融入群体。罗森伯格令人信服地指出，公共健康倡导者应该向广告商学习，后者在运用同伴压力方面游刃有余。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n<h3>意群划分 · 第4段</h3>\n<p>But on the general effectiveness / of the social cure, / Rosenberg is less persuasive.</p>\n<p><em>Join the Club</em> / is filled with / too much irrelevant detail / and not enough exploration / of the social and biological factors / that make peer pressure so powerful.</p>\n<p>The most glaring flaw / of the social cure / as it&#39;s presented here / is that it doesn&#39;t work very well / for very long.</p>\n<p>Rage Against the Haze failed / once state funding was cut.</p>\n<p>Evidence that the loveLife program / produces lasting changes / is limited and mixed.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>但关于总体效果 / 社会疗法的，/ 罗森伯格不太有说服力。</p>\n<p><em>加入俱乐部</em> / 充满了 / 太多无关的细节 / 而缺乏足够的探索 / 关于社会和生物因素的 / 这些因素使同伴压力如此强大。</p>\n<p>最明显的缺陷 / 社会疗法的 / 正如这里呈现的 / 是它效果不太好 / 持续时间不长。</p>\n<p>&quot;向烟雾宣战&quot;失败了 / 一旦州政府资金被削减。</p>\n<p>证据表明loveLife项目 / 产生持久改变的 / 是有限且混杂的。</p>\n<h3>标准译文 · 第4段</h3>\n<p>但谈到社会疗法的总体效果，罗森伯格的论证就不那么有说服力了。《加入俱乐部》一书充斥着过多无关细节，却缺乏对使同伴压力如此强大的社会和生物因素的深入探讨。书中所呈现的社会疗法最明显的缺陷是：它的效果难以持久。&quot;向烟雾宣战&quot;项目在州政府资金被削减后就失败了。而loveLife项目能否产生持久改变，相关证据也十分有限且结果参差不齐。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>There’s no doubt that our peer groups exert enormous influence on our behavior. An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication. This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n<h3>意群划分 · 第5段</h3>\n<p>There&#39;s no doubt / that our peer groups / exert enormous influence / on our behavior.</p>\n<p>An emerging body of research / shows that positive health habits -- / as well as negative ones -- / spread through networks of friends / via social communication.</p>\n<p>This is a subtle form / of peer pressure: / we unconsciously imitate / the behavior we see / every day.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>毫无疑问 / 我们的同伴群体 / 施加巨大影响 / 对我们的行为。</p>\n<p>一个新兴的研究体系 / 显示积极的健康习惯 -- / 以及消极的 -- / 传播通过朋友网络 / 通过社交沟通。</p>\n<p>这是一种微妙的形式 / 同伴压力的：/ 我们无意识地模仿 / 我们看到的行为 / 每天。</p>\n<h3>标准译文 · 第5段</h3>\n<p>毫无疑问，我们的同伴群体对我们的行为产生着巨大影响。新兴研究表明，积极的健康习惯——以及消极的习惯——通过社交沟通在朋友网络中传播。这是一种微妙的同伴压力形式：我们会无意识地模仿每天所见的行为。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Far less certain, however, / is how successfully / experts and bureaucrats / can select our peer groups / and steer their activities / in virtuous directions.</p>\n<p>It&#39;s like the teacher / who breaks up the troublemakers / in the back row / by pairing them / with better-behaved classmates.</p>\n<p>The tactic never really works.</p>\n<p>And that&#39;s the problem / with a social cure / engineered from the outside: / in the real world, / as in school, / we insist on / choosing our own friends.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>远不那么确定的，然而，/ 是多么成功地 / 专家和官僚们 / 能够选择我们的同伴群体 / 并引导他们的活动 / 朝着良好的方向。</p>\n<p>这就像老师 / 拆散捣乱分子 / 在后排的 / 通过把他们配对 / 与表现更好的同学。</p>\n<p>这种策略从来没有真正奏效。</p>\n<p>这就是问题所在 / 对于社会疗法 / 从外部设计的：/ 在现实世界中，/ 就像在学校里，/ 我们坚持 / 选择我们自己的朋友。</p>\n<h3>标准译文 · 第6段</h3>\n<p>然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。这就像老师把后排的捣蛋鬼拆散，让他们与表现良好的同学搭档。这种策略从来都不真正奏效。这正是外部设计的社会疗法的问题所在：在现实世界中，就像在学校里一样，我们坚持要自己选择朋友。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Come on -- Everybody&#39;s doing it.</p>\n<p>That whispered message：(half invitation and half forcing) → is what most of us think of：(when we hear the words <em>peer pressure</em>).</p>\n<p>It usually leads to no good：(drinking + drugs + casual sex).</p>\n<p>But in her new book <em>Join the Club</em> → Tina Rosenberg contends：(that peer pressure → can also be a positive force：(through what she calls the social cure：(in which organizations and officials → use the power of group dynamics → to help individuals → improve their lives + possibly the world))).</p>\n<p><strong>第2段</strong></p>\n<p>Rosenberg：(the recipient of a Pulitzer Prize) → offers a host of examples：(of the social cure in action)：In South Carolina：(a state-sponsored antismoking program：(called Rage Against the Haze) → sets out to make → cigarettes uncool).</p>\n<p>In South Africa：(an HIV-prevention initiative：(known as loveLife) → recruits young people → to promote safe sex：(among their peers)).</p>\n<p><strong>第3段</strong></p>\n<p>The idea seems promising + Rosenberg is a perceptive observer.</p>\n<p>Her critique：(of the lameness：(of many public-health campaigns)) → is spot-on：(they fail to mobilize peer pressure：(for healthy habits) + they demonstrate a seriously flawed understanding：(of psychology)).</p>\n<p>&quot;Dare to be different, please don&#39;t smoke!&quot; → pleads one billboard campaign：(aimed at reducing smoking：(among teenagers))：(<em>teenagers</em>：(who desire nothing more than fitting in)).</p>\n<p>Rosenberg argues convincingly：(that public-health advocates → ought to take a page：(from advertisers：(so skilled at applying peer pressure))).</p>\n<p><strong>第4段</strong></p>\n<p>But on the general effectiveness：(of the social cure) // Rosenberg is less persuasive.</p>\n<p><em>Join the Club</em> → is filled with：(too much irrelevant detail) + not enough exploration：(of the social and biological factors：(that make peer pressure so powerful)).</p>\n<p>The most glaring flaw：(of the social cure：(as it&#39;s presented here)) → is that it doesn&#39;t work very well：(for very long).</p>\n<p>Rage Against the Haze failed：(once state funding was cut).</p>\n<p>Evidence：(that the loveLife program → produces lasting changes) → is limited and mixed.</p>\n<p><strong>第5段</strong></p>\n<p>There&#39;s no doubt：(that our peer groups → exert enormous influence：(on our behavior)).</p>\n<p>An emerging body of research → shows：(that positive health habits -- as well as negative ones -- → spread：(through networks of friends)：(via social communication)).</p>\n<p>This is a subtle form：(of peer pressure)：(we unconsciously imitate → the behavior：(we see every day)).</p>\n<p><strong>第6段</strong></p>\n<p>Far less certain, however // is how successfully：(experts and bureaucrats → can select our peer groups + steer their activities：(in virtuous directions)).</p>\n<p>It&#39;s like the teacher：(who breaks up the troublemakers：(in the back row)：(by pairing them：(with better-behaved classmates))).</p>\n<p>The tactic never really works.</p>\n<p>And that&#39;s the problem：(with a social cure：(engineered from the outside))：(in the real world + as in school → we insist on：(choosing our own friends)).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>来吧 -- 每个人都在做。</p>\n<p>那种窃窃私语的信息：(一半是邀请一半是强迫) → 是我们大多数人想到的：(当我们听到_同伴压力_这些词)。</p>\n<p>它通常导致不好的事：(喝酒 + 吸毒 + 随意性行为)。</p>\n<p>但在她的新书_加入俱乐部_中 → 蒂娜·罗森伯格主张：(同伴压力 → 也可以是一种积极力量：(通过她所称的社会疗法：(在其中组织和官员们 → 使用群体动力的力量 → 来帮助个人 → 改善他们的生活 + 可能改善世界)))。</p>\n<p><strong>第2段</strong></p>\n<p>罗森伯格：(普利策奖获得者) → 提供了大量例子：(关于社会疗法的实践)：在南卡罗来纳州：(一个州政府资助的反吸烟项目：(叫做&quot;向烟雾宣战&quot;) → 致力于让 → 香烟变得不酷)。</p>\n<p>在南非：(一个预防艾滋病的倡议：(被称为loveLife) → 招募年轻人 → 来推广安全性行为：(在他们的同龄人中))。</p>\n<p><strong>第3段</strong></p>\n<p>这个想法看起来很有前景 + 罗森伯格是一个敏锐的观察者。</p>\n<p>她的批评：(关于拙劣之处：(许多公共健康运动的)) → 非常准确：(它们未能动员同伴压力：(来促进健康习惯) + 它们展示了严重有缺陷的理解：(对心理学的))。</p>\n<p>&quot;敢于与众不同，请不要吸烟！&quot; → 恳求一个广告牌运动：(旨在减少吸烟：(在青少年中))：(<em>青少年</em>：(他们最渴望的无非是融入群体))。</p>\n<p>罗森伯格令人信服地论证：(公共健康倡导者 → 应该学习一页：(从广告商那里：(如此擅长运用同伴压力)))。</p>\n<p><strong>第4段</strong></p>\n<p>但关于总体效果：(社会疗法的) // 罗森伯格不太有说服力。</p>\n<p><em>加入俱乐部</em> → 充满了：(太多无关的细节) + 缺乏足够的探索：(关于社会和生物因素的：(这些因素使同伴压力如此强大))。</p>\n<p>最明显的缺陷：(社会疗法的：(正如这里呈现的)) → 是它效果不太好：(持续时间不长)。</p>\n<p>&quot;向烟雾宣战&quot;失败了：(一旦州政府资金被削减)。</p>\n<p>证据：(表明loveLife项目 → 产生持久改变的) → 是有限且混杂的。</p>\n<p><strong>第5段</strong></p>\n<p>毫无疑问：(我们的同伴群体 → 施加巨大影响：(对我们的行为))。</p>\n<p>一个新兴的研究体系 → 显示：(积极的健康习惯 -- 以及消极的 -- → 传播：(通过朋友网络)：(通过社交沟通))。</p>\n<p>这是一种微妙的形式：(同伴压力的)：(我们无意识地模仿 → 行为：(我们每天看到的))。</p>\n<p><strong>第6段</strong></p>\n<p>远不那么确定的，然而 // 是多么成功地：(专家和官僚们 → 能够选择我们的同伴群体 + 引导他们的活动：(朝着良好的方向))。</p>\n<p>这就像老师：(拆散捣乱分子：(在后排的)：(通过把他们配对：(与表现更好的同学)))。</p>\n<p>这种策略从来没有真正奏效。</p>\n<p>这就是问题所在：(对于社会疗法：(从外部设计的))：(在现实世界中 + 就像在学校里 → 我们坚持：(选择我们自己的朋友))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第4句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>But in her new book / <em>Join the Club</em>, / Tina Rosenberg contends / that peer pressure / can also be a positive force / through what she calls / the social cure, / in which organizations and officials / use the power of group dynamics / to help individuals / improve their lives / and possibly the world.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但在她的新书中 / <em>加入俱乐部</em>，/ 蒂娜·罗森伯格主张 / 同伴压力 / 也可以是一种积极力量 / 通过她所称的 / 社会疗法，/ 在其中组织和官员们 / 使用群体动力的力量 / 来帮助个人 / 改善他们的生活 / 以及可能改善世界。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把“在新书中”与书名合并；再把“组织和官员利用群体力量”连到帮助个人的目的上。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>但在她的新书中  加入俱乐部， 蒂娜·罗森伯格主张  同伴压力  也可以是一种积极力量  通过她所称的  社会疗法， 在其中组织和官员们  使用群体动力的力量  来帮助个人  改善他们的生活  以及可能改善世界。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>罗森伯格提出，同伴压力也能成为积极力量。</p>\n</blockquote>\n<p>把书名和提出者放在前面，随后说明社会疗法是什么，最后列出改善个人乃至世界的目标。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但蒂娜·罗森伯格在其新书《加入俱乐部》中提出，同伴压力也可以成为一种积极力量，她称之为&quot;社会疗法&quot;：组织和官员利用群体动力的力量，帮助个人改善生活，甚至可能改变世界。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>can also保留“也可以”，possibly保留“可能”，不能把积极用途写成确定成效。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但蒂娜·罗森伯格在其新书《加入俱乐部》中提出，同伴压力也可以成为一种积极力量，她称之为&quot;社会疗法&quot;：组织和官员利用群体动力的力量，帮助个人改善生活，甚至可能改变世界。</p>\n</blockquote>\n<h2>2. 第3段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>&quot;Dare to be different, please don&#39;t smoke!&quot; pleads one billboard campaign aimed at reducing smoking among teenagers -- teenagers, who desire nothing more than fitting in.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>&quot;Dare to be different, / please don&#39;t smoke!&quot; / pleads one billboard campaign / aimed at reducing smoking / among teenagers -- / <em>teenagers</em>, / who desire nothing more / than fitting in.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>&quot;敢于与众不同，/ 请不要吸烟！&quot; / 恳求一个广告牌运动 / 旨在减少吸烟 / 在青少年中 -- / <em>青少年</em>，/ 他们最渴望的无非是 / 融入群体。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把广告的目的并入“旨在减少青少年吸烟的广告”；破折号后单独保留青少年最想融入群体的解释。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>&quot;敢于与众不同， 请不要吸烟！&quot;  恳求一个广告牌运动  旨在减少吸烟  在青少年中 --  青少年， 他们最渴望的无非是  融入群体。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>一则禁烟广告呼吁青少年与众不同。</p>\n</blockquote>\n<p>先呈现口号，再交代谁在呼吁、对谁呼吁，最后指出口号与对象心理之间的反差。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>“敢于与众不同，请勿吸烟！”一个旨在减少青少年吸烟的广告牌如此呼吁——对象可是青少年，他们最渴望的恰恰是融入群体。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>nothing more than不是“不想要什么”，而是强调最渴望的就是融入群体。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>“敢于与众不同，请勿吸烟！”一个旨在减少青少年吸烟的广告牌如此呼吁——对象可是青少年，他们最渴望的恰恰是融入群体。</p>\n</blockquote>\n<h2>3. 第6段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Far less certain, however, / is how successfully / experts and bureaucrats / can select our peer groups / and steer their activities / in virtuous directions.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>远不那么确定的，然而，/ 是多么成功地 / 专家和官僚们 / 能够选择我们的同伴群体 / 并引导他们的活动 / 朝着良好的方向。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把“替我们选择同伴群体”和“引导他们的活动”合成外部干预的两项动作。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>远不那么确定的，然而， 是多么成功地  专家和官僚们  能够选择我们的同伴群体  并引导他们的活动  朝着良好的方向。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>专家能多成功地选择并引导群体，远不确定。</p>\n</blockquote>\n<p>先用“然而，更不确定的是”引出问题，再说专家和官僚能否成功完成两项动作。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>less certain表示更不确定，不能译成已经证实完全无效；virtuous修饰引导的方向。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看
