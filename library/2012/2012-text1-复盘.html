到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>21题</h2>\n<blockquote>\n<p>According to the first paragraph, peer pressure often emerges as ______.</p>\n<p>根据第一段，同伴压力常常表现为什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干用often限定常见表现，要与第一段的usually对应。</p>\n<p>先读破折号后的具体行为，再看转折引出的积极用途。通常的后果和另一种可能不要混成同一结论。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<h3>A. a supplement to the social cure</h3>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会疗法的一种补充。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>social cure</code>确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面<code>usually</code>所限定的常见表现。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会疗法的一种补充。</p>\n</blockquote>\n<p><code>supplement to</code>是对某事物的补充，意味着先有一套社会疗法，再在它之外加上同伴压力。原文在<code>social cure</code>后面接<code>in which</code>，解释的却是这项疗法本身怎样进行：组织和官员运用群体互动的力量，帮助个人改善生活。</p>\n<p>前面的<code>peer pressure can also be a positive force through ...</code>与这个解释连在一起，说明同伴压力可以被积极利用。它不是一项已经独立存在的疗法之外的附加工具。</p>\n<p>再看题干<code>often</code>，它要对应前面<code>usually leads to no good</code>所说的常见情况。A既改了同伴压力与疗法的关系，又没有接住这一频率限定，不能因为看见<code>social cure</code>就保留。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n<p>它通常导致不好的结果——酗酒、吸毒和随意性行为。同伴压力也可以通过她称作“社会疗法”的方式成为积极力量：组织和官员利用群体互动的力量，帮助个人改善生活，甚至可能改善世界。</p>\n</blockquote>\n<p>作者先写同伴压力通常造成的坏结果，再用<code>But</code>引出另一种可能，随后解释怎样利用群体力量。后半段是在展开一种积极用途，没有先介绍别的疗法再追加补充措施。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The social cure relies on other methods, with peer pressure added as a supplementary measure.</p>\n<p>社会疗法依靠其他方法，并把同伴压力加入作为补充措施。</p>\n</blockquote>\n<p>A需要把疗法本身与后来补入的同伴压力分开。实际的<code>in which</code>直接把运用群体力量写成疗法的内容，没有这两个先后独立的部分。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. a stimulus to group dynamics</h3>\n<blockquote>\n<p>根据第一段，同伴压力常常是刺激群体互动的因素。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写组织和官员利用<code>group dynamics</code>产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是刺激群体互动的因素。</p>\n</blockquote>\n<p><code>stimulus to group dynamics</code>要说同伴压力刺激或推动群体互动。原句却是<code>use the power of group dynamics to help individuals</code>，主语是组织和官员，所利用的是群体互动的力量，要达到的是帮助个人的效果。</p>\n<p>所以这里是在说明怎样借助群体关系发挥影响，并没有先问群体互动为何出现，再把同伴压力列为原因。B虽然使用了原文的<code>group dynamics</code>，却将被利用的力量换成需要被刺激的结果。</p>\n<p>题干还问同伴压力常常表现为什么。首段用酗酒、吸毒等例子解释的常见后果，也不是群体互动被刺激。两个位置都不能给B所需的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n<p>在这种疗法中，组织和官员利用群体互动的力量，帮助个人改善生活，甚至可能改善世界。</p>\n</blockquote>\n<p>段末的<code>in which</code>解释社会疗法怎样运作，句子沿“利用群体力量→帮助个人”推进。后文继续用公共卫生项目说明这种利用方式，没有转去说明怎样启动群体互动。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Peer pressure stimulates interaction within a group and strengthens its dynamics.</p>\n<p>同伴压力刺激群体内部的互动，并增强群体动力。</p>\n</blockquote>\n<p>B需要同伴压力作为刺激来源、群体互动作为产生的结果。原文把群体力量当作已经可以利用的条件，说明的是它怎样影响个人，不能把同一句中的词换个位置就得到B。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. an obstacle to social progress</h3>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会进步的障碍。</p>\n</blockquote>\n<p><code>obstacle to social progress</code>说的是阻碍社会进步。首段的<code>no good</code>确实是负面评价，但破折号后已经具体说明它指什么：<code>drinking, drugs and casual sex</code>，也就是受到同伴影响而出现的不良行为。</p>\n<p>从这些行为还不能直接换到社会进步受到怎样的阻碍。C需要把个体行为与社会发展的某种停滞连接起来，而本段并没有作这一步论证。</p>\n<p>后面的积极用途也仍落在<code>help individuals improve their lives</code>上。题目要概括通常出现的行为后果，D正好能接住这些例子；C则把讨论层级扩大了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force</p>\n<p>它通常导致不好的结果——酗酒、吸毒和随意性行为。同伴压力也可以成为一种积极力量。</p>\n</blockquote>\n<p>作者在<code>no good</code>后立即列行为例子，让我们看见同伴压力常把个人带向什么行为。转折之后再说这股力量也可以帮助个人，并没有举社会改革或社会发展受阻的例子。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Peer pressure holds back social progress by preventing changes that society needs.</p>\n<p>同伴压力妨碍社会所需的改变，从而阻碍社会进步。</p>\n</blockquote>\n<p>C需要出现社会发展怎样受阻这一层。实际举出的酗酒、吸毒等后果只能直接支持“不良行为”，不能把负面评价自动扩大成任何更宏观的坏结果。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. a cause of undesirable behaviors</h3>\n<blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>a cause of</code>对应<code>leads to</code>，<code>undesirable behaviors</code>概括破折号后的酗酒、吸毒等例子，<code>often</code>与<code>usually</code>的频率也一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常导致不良行为。</p>\n</blockquote>\n<p>先把题干与选项的关系接全：同伴压力常常导致不良行为。<code>often</code>不是泛泛的频率词，它在首段直接找到<code>usually</code>；<code>a cause of</code>说明造成什么，对应<code>leads to</code>。</p>\n<p><code>undesirable behaviors</code>并非原词照抄，而是对<code>drinking, drugs and casual sex</code>的概括。作者先说<code>no good</code>，再列出这些具体行为，负面评价与行为对象都已给出。</p>\n<p>后面<code>can also be a positive force</code>只是补充同伴压力也可能发挥积极作用，不会取消前面“通常”产生坏结果的说法。D没有写<code>always</code>，因此不需要否认另一种用途，也能准确回答题干。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>它通常导致不好的结果——酗酒、吸毒和随意性行为。</p>\n</blockquote>\n<p>首段先用<code>usually</code>作概括，再以三个行为例子解释坏结果，之后转向一种积极利用方式。前面的常见情况与后面的另一种可能可以同时成立。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Peer pressure often leads people into undesirable behaviors, although it can also be used positively.</p>\n<p>同伴压力常使人出现不良行为，但也可以被积极利用。</p>\n</blockquote>\n<p>D需要的原因与结果就在<code>leads to no good</code>及其例子中。保留<code>often</code>后，它不会把后面的积极用途排除掉，与这一段的先概括、再转折相合。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. D</strong></p>\n</blockquote>\n<ul>\n<li>A：social cure确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面usually所限定的常见表现。</li>\n<li>B：原文写组织和官员利用group dynamics产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。</li>\n<li>C：酗酒、吸毒等例子支持对具体行为的不良评价。C把这些行为结果扩大成对社会整体进步的阻碍，增加了原段没有展开的社会层面关系。</li>\n<li>D：a cause of对应leads to，undesirable behaviors概括破折号后的酗酒、吸毒等例子，often与usually的频率也一致。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>Rosenberg holds that public-health advocates should ______.</p>\n<p>Rosenberg认为，公共卫生倡导者应该怎样做？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干问Rosenberg给公共卫生倡导者的建议，定位第三段末句ought to之后的行动。</p>\n<p>前面的戒烟口号说明为什么需要改变方法，最后一句才直接回答应该向谁、学习什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n</blockquote>\n<h3>A. recruit professional advertisers</h3>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p><code>take a page from</code>表示借鉴做法，A的<code>recruit</code>却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应招募专业广告人。</p>\n</blockquote>\n<p>题干中的公共卫生倡导者，在原文里是<code>ought to</code>后面行动的执行者。这个行动是<code>take a page from advertisers</code>，意为效仿、借鉴广告商的做法。</p>\n<p>逗号后的<code>so skilled at applying peer pressure</code>还给出了借鉴内容：广告商善于利用同伴压力。原文因此已经把“向谁学”和“学什么”说清楚。</p>\n<p><code>recruit professional advertisers</code>则变成聘用人员。招募之后或许也能学到经验，但文章并没有把这一可能的实施办法写成Rosenberg的建议。A添了人员安排，不能直接替换原来的学习动作。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。</p>\n</blockquote>\n<p>戒烟宣传号召青少年与众不同，却碰到青少年希望融入群体的心理。作者接着引出Rosenberg的建议，让公共卫生宣传借鉴广告商利用这种心理的办法。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-health advocates should recruit professional advertisers to work on their campaigns.</p>\n<p>公共卫生倡导者应招募专业广告人为宣传活动工作。</p>\n</blockquote>\n<p>A需要出现聘请、加入团队或承担宣传工作等人员安排。原文在指出宣传口号与受众心理相反之后，给出的是学习方法的建议，并未把工作人员的更换作为解决办法。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. learn from advertisers’ experience</h3>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应借鉴广告商的经验。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>B的<code>learn from</code>改写<code>take a page from</code>；广告商善于运用同伴压力，正是前面的戒烟口号所没有利用好的群体心理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应借鉴广告商的经验。</p>\n</blockquote>\n<p><code>take a page from advertisers</code>不是从广告中取一张纸，而是借鉴广告商的办法，B的<code>learn from advertisers’ experience</code>保留了这一学习关系。</p>\n<p>再看为什么要学习：青少年最想<code>fitting in</code>，也就是融入同伴，但广告牌却说<code>Dare to be different</code>，让他们与众不同。这一宣传要求与受众愿望相反。</p>\n<p>Rosenberg接着指出广告商<code>skilled at applying peer pressure</code>。要学的是如何顺着群体归属心理进行劝导，而非照搬商业产品或招一批广告人。B把具体内容概括为经验，学习的主体和对象都没有改变。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>一个旨在减少青少年吸烟的广告牌呼吁：“敢于与众不同，请勿吸烟！”但青少年最希望的就是融入群体。Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。</p>\n</blockquote>\n<p>段落先列一则不顺着受众心理的戒烟宣传，再点出青少年希望融入群体，最后建议向擅长运用同伴压力的广告商借鉴。问题与改进方向紧接在一起。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-health advocates should learn how advertisers use the desire to fit in to influence behavior.</p>\n<p>公共卫生倡导者应学习广告商怎样利用融入群体的愿望影响行为。</p>\n</blockquote>\n<p>B所需的经验有具体落点，就是<code>applying peer pressure</code>。前面的失败劝导说明为何需要这种经验，最后的<code>take a page from</code>明确给出学习建议，前后能够连上。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. stay away from commercial advertisers</h3>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应远离商业广告商。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文把广告商放在值得借鉴的位置，C却说应该远离他们，将<code>take a page from</code>所表示的接近和学习改成回避。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应远离商业广告商。</p>\n</blockquote>\n<p>C的<code>stay away from</code>表示远离，方向必须与原文的建议核对。原句是<code>ought to take a page from advertisers</code>，公共卫生倡导者应向广告商借鉴。</p>\n<p>这里提出学习的原因是广告商<code>so skilled at applying peer pressure</code>，作者明确点出他们在方法上的长处。即使商业广告与公共卫生的目标不同，这种差别也没有被用来推出回避建议。</p>\n<p>前面受批评的戒烟口号，是因为它让渴望融入的青少年与众不同；这个例子反而促成了向广告商学习的建议。C不能借“广告可能有问题”把原段的建议方向倒过来。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。</p>\n</blockquote>\n<p>戒烟口号的例子写完后，作者用Rosenberg的建议收束，指出广告商善于运用同伴压力。段落从宣传失当走向学习有效方法。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-health advocates should avoid commercial advertisers and distance themselves from their methods.</p>\n<p>公共卫生倡导者应避开商业广告商，并与他们的方法保持距离。</p>\n</blockquote>\n<p>C需要把广告商的方法作为应当避免的对象。原文收尾却称赞他们运用同伴压力的技能，并建议借鉴，展开方向与C相反。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. recognize the limitations of advertisements</h3>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Rosenberg认为，公共卫生倡导者应认识广告的局限。</p>\n</blockquote>\n<p><code>recognize the limitations of advertisements</code>要求认识广告有哪些局限。前面的戒烟广告确实没有处理好青少年想融入群体的愿望，因此D容易与这个例子发生联系。</p>\n<p>但题干要的是<code>Rosenberg holds ... should</code>，要看她在指出问题后主张怎么做。原句给出的动作是<code>take a page from advertisers</code>，理由是他们善于<code>applying peer pressure</code>。</p>\n<p>作者没有由这个口号推到“广告这种方式本身有限”，而是认为公共卫生宣传可以在使用同伴压力的方法上向广告商学习。D保留了批评宣传这一表面印象，却没有承接实际提出的改进建议。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in</p>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>一个旨在减少青少年吸烟的广告牌呼吁：“敢于与众不同，请勿吸烟！”但青少年最希望的就是融入群体。Rosenberg令人信服地主张，公共卫生倡导者应向广告商借鉴，广告商非常善于运用同伴压力。</p>\n</blockquote>\n<p>例子把青少年想融入群体与宣传号召不同并列，随后Rosenberg没有要求放弃或限制广告，而是转向广告商熟练运用群体心理的经验。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public-health advocates should recognise the limits of what advertisements can achieve.</p>\n<p>公共卫生倡导者应认识广告所能取得的效果的局限。</p>\n</blockquote>\n<p>D需要从宣传例子进一步讨论广告能力的边界。实际结尾在同一种宣传活动中寻找可借鉴的方法，焦点是怎样更好地利用同伴压力，不能用一般的局限评价代替这项建议。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. B</strong></p>\n</blockquote>\n<ul>\n<li>A：take a page from表示借鉴做法，A的recruit却要求把广告人招进来。学习一种经验与聘用拥有经验的人并不是同一项建议。</li>\n<li>B：B的learn from改写take a page from；广告商善于运用同伴压力，正是前面的戒烟口号所没有利用好的群体心理。</li>\n<li>C：原文把广告商放在值得借鉴的位置，C却说应该远离他们，将take a page from所表示的接近和学习改成回避。</li>\n<li>D：前面的戒烟口号暴露的是这一宣传没有顺着青少年心理。后面的建议具体落在借鉴广告商的方法上，D把它换成了对广告局限的一般认识。</li>\n</ul>\n<h2>23题</h2>\n<blockquote>\n<p>In the author’s view, Rosenberg’s book fails to ______.</p>\n<p>在作者看来，Rosenberg的书没有做到什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干的主体是Rosenberg的书，并用fails to问它未完成的事情。</p>\n<p>先核对not enough exploration对书中分析的批评，再与后面疗法项目成效不足的批评分开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n<h3>A. adequately probe social and biological factors</h3>\n<blockquote>\n<p>作者认为，Rosenberg的书没有充分探究社会与生物因素。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>fails to adequately probe</code>与<code>not enough exploration</code>表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书没有充分探究社会与生物因素。</p>\n</blockquote>\n<p>先看题干的否定：<code>the book fails to</code>。把A接上后，才得到“这本书没有充分探究社会与生物因素”，不是说这本书已经充分探究了它们。</p>\n<p>原文对应的是<code>not enough exploration of the social and biological factors that make peer pressure so powerful</code>。<code>exploration</code>是探究，A用<code>probe</code>替换；<code>not enough</code>说明不足，题干的<code>fails to</code>与A的<code>adequately</code>共同表达这一程度。</p>\n<p>前面的<code>too much irrelevant detail</code>与后面的探究不足形成对照：细节多，却没有充分回答同伴压力为什么如此强大。A同时保留了书这一主体、探究这一行动和具体研究对象，是对这项缺陷的准确改写。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。</p>\n</blockquote>\n<p>作者先嫌书中无关细节太多，再紧接着指出真正应该深入的社会与生物原因没有得到足够探究。两种内容的比例失衡构成了对书的批评。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The book provides too little analysis of the social and biological factors behind the power of peer pressure.</p>\n<p>这本书对同伴压力之所以强大的社会和生物因素分析得太少。</p>\n</blockquote>\n<p>A所需的不足就在<code>not enough exploration</code>中。后面疗法能否持久的例子是另一层批评，不能取代这里对书中原因解释不充分的直接评价。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. effectively evade the flaws of the social cure</h3>\n<blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p><code>evade the flaws of the social cure</code>要说书未能避开社会疗法的缺陷。原文确实同时出现书的不足和疗法的缺点，但要先看各自被评价的动作。</p>\n<p>对书，作者说无关细节太多、社会与生物因素的<code>exploration</code>不够；对疗法，随后才说它<code>doesn’t work very well for very long</code>，有效作用不能很好地维持。</p>\n<p>书可以充分研究一个有缺陷的疗法，疗法也不会因为书把它写清楚就自动消除缺陷。因此“探究原因不够”不能改成“未能避开疗法缺陷”。B把两个邻近的负面评价拼成了另一个任务关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long</p>\n<p>《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。书中所呈现的社会疗法最明显的缺陷是，它不能长时间保持良好效果。</p>\n</blockquote>\n<p>作者先评价书解释了多少、没有解释多少，再转到书中疗法的长期表现。前者是论述深度，后者是实践成效，段落依次展开两种不足。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The book fails to show how the weaknesses of the social cure can be avoided in practice.</p>\n<p>这本书未能说明在实践中怎样避开社会疗法的弱点。</p>\n</blockquote>\n<p>B至少需要把避开或克服疗法弱点列为书没有完成的事情。实际对书的直接批评指向原因探究不足，后面的项目失效也没有把任务改成了如何避开缺陷。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. illustrate the functions of state funding</h3>\n<blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能说明州拨款的作用。</p>\n</blockquote>\n<p>C的<code>illustrate the functions of state funding</code>要求说明州拨款起什么作用，再由题干<code>fails to</code>把它变成这本书没做到的事情。</p>\n<p>原文说<code>Rage Against the Haze failed once state funding was cut</code>，削减拨款后项目失败。这个例子紧接疗法不能长久奏效的评价，直接展示项目持续运行与资金支持的关系。</p>\n<p>它能支持疗法持续性受到质疑，却没有告诉我们这本书是否专门讨论过拨款功能，更没有把漏讲拨款列为作者的主要批评。C借用了例子中的<code>state funding</code>，另加了书本论述缺失的判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful</p>\n<p>Rage Against the Haze failed once state funding was cut.</p>\n<p>《加入俱乐部》有太多无关细节，却没有充分探究使同伴压力如此强大的社会和生物因素。州拨款一被削减，“向烟雾宣战”项目便失败了。</p>\n</blockquote>\n<p>作者先提出疗法长期成效不足，再列拨款被削减后项目失败的事实。资金在这里帮助解释一个项目为何不能持续，服务于前面的成效评价。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The book leaves unexplained the role that state funding plays in sustaining the programme.</p>\n<p>这本书没有解释州拨款在维持项目中所起的作用。</p>\n</blockquote>\n<p>C需要作者指出书中漏掉了这一解释。原文却已经用资金减少与项目失败的先后关系支撑持续性批评，并没有转去审查书是否说明了拨款的功能。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. produce a long-lasting social effect</h3>\n<blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>lasting changes</code>评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，Rosenberg的书未能产生持久的社会效果。</p>\n</blockquote>\n<p>把D接回<code>Rosenberg’s book fails to</code>，完整主语是书，谓语是产生持久社会效果。这个关系不能只凭原文也出现<code>lasting</code>就成立。</p>\n<p>原句说<code>Evidence that the loveLife program produces lasting changes is limited and mixed</code>。<code>produces</code>的主语是<code>the loveLife program</code>，证据不足且结果不一致，说明还不能确认这个项目能持续改变行为。</p>\n<p>作者对书另有明确评价：无关细节过多，原因探究不够。D把项目应取得的社会成效交给书承担，漏掉了两个主体之间的区别。因此题干的否定与项目成效的否定虽相近，也不能直接拼接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n<p>证明loveLife项目能带来持久改变的证据有限，而且结果并不一致。</p>\n</blockquote>\n<p>第四段先谈书中分析的不足，再用具体项目说明疗法效果难以长期保持。loveLife是被评价的实践项目，书则是介绍和解释这些实践的文本。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Rosenberg’s book has failed to bring about lasting changes in society.</p>\n<p>Rosenberg的这本书未能在社会中带来持久改变。</p>\n</blockquote>\n<p>D需要作者评估书出版之后产生了什么社会影响。实际评估的是疗法项目有无持续改变行为的证据，没有把书的社会影响列为问题。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：fails to adequately probe与not enough exploration表达同样的探究不足，所探究的对象都是使同伴压力强大的社会和生物因素。</li>\n<li>B：书没有充分分析同伴压力强大的原因，与疗法本身效果不持久是两层批评。B把它们合成书应当避开疗法缺陷的任务。</li>\n<li>C：州拨款削减后项目失败，原文借此说明疗法难以持久。C把作者已经使用的成效例子，改成书没有解释拨款功能的指控。</li>\n<li>D：lasting changes评价的是loveLife项目，D接回题干后却让书本身成为应当带来社会效果的主体，把项目成效移成了书的任务。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>Paragraph 5 shows that our imitation of behaviors ______.</p>\n<p>第五段说明，我们模仿行为时有什么特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落理解题。题干限定第五段，imitation对应冒号后的imitate，要看作者怎样解释前面的习惯传播。</p>\n<p>好坏习惯先并列出现，随后用不自觉模仿解释共同方式。比较C、D时，不能把D说成完全不可能，而要看哪一项更完整接住段落的解释。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day</p>\n</blockquote>\n<h3>A. is harmful to our networks of friends</h3>\n<blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>朋友网络是习惯传播经过的途径。A用<code>harmful to</code>把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，模仿行为会损害我们的朋友网络。</p>\n</blockquote>\n<p>原文的<code>spread through networks of friends</code>要连着介词看。<code>through</code>说明好习惯和坏习惯经过什么路径传播，朋友网络是传播渠道。</p>\n<p>A却说<code>harmful to our networks of friends</code>，把问题换成模仿是否损害朋友之间的联系。负面的健康习惯确实可能传播，但健康后果不好与朋友网络本身受到损害并不相同。</p>\n<p>后面<code>via social communication</code>进一步说明传播手段，<code>unconsciously imitate</code>再解释人们如何受到影响。整段在补全传播过程，没有评价朋友关系因此变弱或破裂。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>不断出现的研究表明，积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。</p>\n</blockquote>\n<p>作者先说习惯通过朋友网络和社会交流扩散，再用日常不自觉模仿解释这种扩散。网络在前后句中一直承担传递作用。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Imitating these behaviors damages friendships and weakens people’s social networks.</p>\n<p>模仿这些行为会损害友谊，削弱人们的社会网络。</p>\n</blockquote>\n<p>A需要网络遭到损害的结果，原文给的却是习惯经过网络传播的过程。不能因其中有坏习惯，就把坏的后果直接安到传播渠道上。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. will mislead behavioral studies</h3>\n<blockquote>\n<p>第五段说明，我们的行为模仿会误导行为研究。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留<code>research shows</code>的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，我们的行为模仿会误导行为研究。</p>\n</blockquote>\n<p><code>An emerging body of research shows ...</code>里，<code>research</code>是提供发现的一方。它发现积极和消极的健康习惯都会通过朋友网络扩散，后面接着解释这种现象表现为日常不自觉的模仿。</p>\n<p>B的<code>will mislead behavioral studies</code>把研究放到另一端：行为模仿使研究得出错误判断。原段既没有说研究误把什么当成了什么，也没有指出其方法或结论因此失真。</p>\n<p>所以B不是对<code>research shows</code>的改写。它将“研究揭示一种行为”倒置成“这种行为使研究出错”，需要文章额外讨论研究可靠性，原段没有这一步。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>不断出现的研究表明，积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。</p>\n</blockquote>\n<p>作者援引新研究来支持同伴影响确实存在，再以模仿解释其自然发生方式。随后质疑的是外部人员能否成功控制这个过程，没有推翻刚引用的研究。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Unconscious imitation can mislead researchers into drawing incorrect conclusions about behavior.</p>\n<p>不自觉的模仿会误导研究者，使他们对行为得出错误结论。</p>\n</blockquote>\n<p>B需要作者说明研究如何因模仿而误判。实际后文以自然影响为基础提出干预问题，接受这项发现与质疑干预成效可以并存，不等于研究受到误导。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. occurs without our realizing it</h3>\n<blockquote>\n<p>第五段说明，我们往往在没有意识到的情况下模仿行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>without our realizing it</code>直接改写<code>unconsciously</code>。它概括的是前面好坏习惯都能传播的共同发生方式，而不是只取其中一种后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，我们往往在没有意识到的情况下模仿行为。</p>\n</blockquote>\n<p>本段先给出研究发现：<code>positive health habits—as well as negative ones</code>都会通过朋友网络和社会交流传播。随后<code>This is a subtle form of peer pressure</code>中的<code>This</code>接住这种传播，冒号后解释它具体怎样发生。</p>\n<p><code>we unconsciously imitate the behavior we see every day</code>里，<code>unconsciously</code>修饰<code>imitate</code>，就是没有意识到自己正在模仿。C的<code>occurs without our realizing it</code>把同一个动作特点说得更完整。</p>\n<p>这个解释同时适用于前面积极和消极的习惯，所以能概括段落共同说明的方式。第六段接着问外部人员能否选择我们的同伴、控制这种过程，也正是先承认自然模仿存在，再讨论能否人为利用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day</p>\n<p>这是一种不易察觉的同伴压力：我们不自觉地模仿每天看到的行为。</p>\n</blockquote>\n<p>研究发现之后，作者没有只挑坏习惯继续说，而是用冒号解释共同的传播方式：人们不自觉模仿每天见到的行为。下一段再把这一自然过程与人为干预分开。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>People copy everyday behaviors without consciously noticing that they are doing so.</p>\n<p>人们模仿日常看到的行为，却没有清楚意识到自己正在这样做。</p>\n</blockquote>\n<p>C所需的不自觉性在冒号后的解释中已经明说。它能同时接住前面的两类习惯，并给后文讨论外部控制提供自然过程这一前提。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. can produce negative health habits</h3>\n<blockquote>\n<p>第五段说明，我们的行为模仿能够带来不良健康习惯。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>原文确实承认坏习惯会传播，D并非与此相反。但本段把好坏习惯并列后，进一步解释两者共同的不自觉模仿方式，C比只取坏习惯的D更贴近这一落点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>we unconsciously imitate the behavior we see every day.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第五段说明，我们的行为模仿能够带来不良健康习惯。</p>\n</blockquote>\n<p><code>negative health habits</code>能够在第一句找到，因此不能因为D带负面意义就直接排除。文章确实承认模仿可能传递不良习惯。</p>\n<p>但第一句把<code>positive</code>与<code>negative</code>并列，接着用<code>This</code>统指上述传播，并用冒号解释<code>unconsciously imitate</code>。作者从两种传播结果转到共同机制，句子的落点是我们怎样在日常接触中模仿。</p>\n<p>D只说其中一种可能结果，没有把这一共同方式说出来。C能对应后面的直接解释，也能覆盖前面好坏两种情况。再接下一段，讨论的是这种自然影响能否由别人安排，仍要以前面的不自觉模仿为基础。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n<p>we unconsciously imitate the behavior we see every day.</p>\n<p>积极的健康习惯和消极的习惯都会通过社会交流在朋友网络中传播。我们不自觉地模仿每天看到的行为。</p>\n</blockquote>\n<p>作者先把好习惯和坏习惯并排，再用<code>This</code>与冒号说明二者如何通过不自觉模仿传播。后文转入人为干预是否有效，没有只继续追踪坏习惯。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Through imitation, people may pick up unhealthy habits from those around them.</p>\n<p>通过模仿，人们可能从周围的人那里学到不健康的习惯。</p>\n</blockquote>\n<p>这一说法与第一句中的一部分相容，不能硬说它是假的。但它只能重述一种结果，不能替代冒号之后对共同机制的解释。题目在C、D之间取更完整对应段落落点的C。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. C</strong></p>\n</blockquote>\n<ul>\n<li>A：朋友网络是习惯传播经过的途径。A用harmful to把这条传播途径改成受害对象，原句并没有描述朋友关系因模仿而受损。</li>\n<li>B：研究是发现习惯传播现象的来源，B却把研究改成被模仿行为误导的对象，没有保留research shows的关系。</li>\n<li>C：without our realizing it直接改写unconsciously。它概括的是前面好坏习惯都能传播的共同发生方式，而不是只取其中一种后果。</li>\n<li>D：原文确实承认坏习惯会传播，D并非与此相反。但本段把好坏习惯并列后，进一步解释两者共同的不自觉模仿方式，C比只取坏习惯的D更贴近这一落点。</li>\n</ul>\n<h2>25题</h2>\n<blockquote>\n<p>The author suggests in the last paragraph that the effect of peer pressure is, ______.</p>\n<p>作者在最后一段暗示，同伴压力的效果怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部观点题。题干限定最后一段，问作者怎样评价利用同伴压力的效果。</p>\n<p>however把自然影响确实存在与外部安排能否成功分开。教师配对是后一问题的例子，不能直接拿前段的强大影响作答案。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>by pairing them with better-behaved classmates.</p>\n</blockquote>\n<h3>A. harmful</h3>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果是有害的。</p>\n</blockquote>\n<p>末段承接上一段对自然影响的承认，转而问专家和官员能否选定我们的同伴群体，并把活动引向好的方向。<code>Far less certain</code>限定的就是这项人为利用能否成功。</p>\n<p>教师把表现不好的学生与表现更好的同学配在一起，希望改善行为，结果<code>The tactic never really works</code>。这说明策略没有实现预期，并没有接着说学生行为更坏或同伴关系受损。</p>\n<p>A的<code>harmful</code>则要求实际出现伤害。前文曾说坏习惯会自然传播，也不能搬来充当这个安排已经造成坏结果的证据。末段怀疑的是利用成效，D比A准确。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。</p>\n</blockquote>\n<p>作者先提出外部安排能否成功的不确定性，再举教师配对的例子，最后用我们坚持自己选朋友解释为什么安排难以奏效。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Arranging peer groups in this way causes harm to the people involved.</p>\n<p>这样安排同伴群体会给参与其中的人造成伤害。</p>\n</blockquote>\n<p>A需要出现损害结果。实际结尾说明自主择友使外部安排难以控制，没有把无效进一步写成有害。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. desirable</h3>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果令人满意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>与表现更好的同学配对是教师的希望，<code>never really works</code>才是作者给出的结果。B把改善意图当成已经实现的成效。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>by pairing them with better-behaved classmates.</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果令人满意。</p>\n</blockquote>\n<p><code>desirable</code>是令人满意、值得期待的。末段确实出现<code>virtuous directions</code>和<code>better-behaved classmates</code>，但前者是专家想引导的方向，后者是教师希望借用的积极同伴。</p>\n<p>评价结果要继续读：<code>The tactic never really works</code>说这种办法实际上不奏效。随后<code>we insist on choosing our own friends</code>解释，外部安排不能轻易替代人们自主选择的关系。</p>\n<p>所以原段是“希望借同伴改善行为→这种安排难以奏效→说明原因”，不能只拿目标里的好词就判定效果好。B把愿望与结果接成了一件事。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>by pairing them with better-behaved classmates.</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n<p>把他们与表现更好的同学配对。这种策略实际上并不奏效。我们坚持自己选择朋友。</p>\n</blockquote>\n<p>教师把学生安排到表现较好的同伴身边，目的是让其改善；作者紧接着说办法并不奏效，再从自主择友解释限制。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Pairing pupils with better-behaved classmates successfully improves their conduct.</p>\n<p>让学生与表现更好的同学配对，成功改善了他们的行为。</p>\n</blockquote>\n<p>B需要安排与改善之间真正接上结果。实际转到<code>never really works</code>，正是切断这一预期，不支持令人满意的成效。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. profound</h3>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果深远。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>前面承认自然同伴关系有巨大影响，末段另问这种力量能否由外部人员成功操控。C把自然影响的强大直接当成人为干预的深远效果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>enormous influence on our behavior.</p>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果深远。</p>\n</blockquote>\n<p>C的<code>profound</code>容易让我们想到前面的<code>enormous influence on our behavior</code>。这句话确实承认身边人会强烈影响我们的行为，不能把作者理解为全面否认同伴影响。</p>\n<p>但末段用<code>Far less certain, however</code>另起问题：专家和官员能否选定群体，并成功引导其活动？自然形成的朋友关系会产生影响，不代表外人安排的关系也能取得同样效果。</p>\n<p>教师配对的失败例子正是在说明后者受限制。C越过这个转折，把前面已承认的自然力量搬来评价后面待检验的干预，没有回答题干限定的末段判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>enormous influence on our behavior.</p>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>对我们的行为有巨大影响。然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。</p>\n</blockquote>\n<p>文章先承认同伴影响存在，再以<code>however</code>转向能否人为控制。教师的例子和自主择友的结尾都在限制这种控制，而非继续夸大自然影响的强度。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Experts can create a profound effect on behavior by choosing people’s peer groups for them.</p>\n<p>专家通过替人们选择同伴群体，可以对行为产生深远影响。</p>\n</blockquote>\n<p>C需要从自然力量强大进一步证明外部选择也能奏效。原文恰恰把这一步单独提出来怀疑，不能用前一层事实替后一层补上成功结果。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. questionable</h3>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>questionable</code>概括<code>Far less certain</code>，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段认为，人为利用同伴压力的效果值得怀疑。</p>\n</blockquote>\n<p>先保留末段讨论的范围：专家和官员替我们选择同伴群体、引导其活动，这种做法能否成功？原文用<code>Far less certain</code>直接表示把握不足，D的<code>questionable</code>与这个评价对应。</p>\n<p>随后教师把学生与表现更好的同学配对，是上述外部安排的一个具体例子。<code>The tactic never really works</code>表明预期没有实现，<code>we insist on choosing our own friends</code>再说明限制来自自主择友。</p>\n<p>D把直接评价与例子的结果合在一起，得到对干预成效的怀疑。它不必扩展成“同伴压力从不影响人”，因为第五段已经承认自然影响，末段所怀疑的是外人能否按自己的目标操控它。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions</p>\n<p>The tactic never really works.</p>\n<p>we insist on choosing our own friends.</p>\n<p>然而，专家和官员能在多大程度上成功地为我们选择同伴群体、把其活动引向好的方向，就远不那么确定了。这种策略实际上并不奏效。我们坚持自己选择朋友。</p>\n</blockquote>\n<p>末段从不确定判断进入教师安排的实例，再用人们自行选择朋友收尾。三个位置都围绕外部控制为什么难以保证成功。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Although peer influence exists, efforts to direct it by assigning people to groups may fail because they choose their own friends.</p>\n<p>同伴影响虽然存在，但通过安排群体来引导它的尝试可能失败，因为人们会自行选择朋友。</p>\n</blockquote>\n<p>D所需的成效疑问能由评价、例子和原因共同支持。它保留了自然影响与人为控制的区别，也没有把不成功进一步改成造成伤害。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>25题结论</h3>\n<blockquote>\n<p><strong>25. D</strong></p>\n</blockquote>\n<ul>\n<li>A：作者怀疑外部安排能否成功，并用教师配对未奏效作例子。未能达到改善目标，不等于已经造成伤害，A把成效不足改成了负面结果。</li>\n<li>B：与表现更好的同学配对是教师的希望，never really works才是作者给出的结果。B把改善意图当成已经实现的成效。</li>\n<li>C：前面承认自然同伴关系有巨大影响，末段另问这种力量能否由外部人员成功操控。C把自然影响的强大直接当成人为干预的深远效果。</li>\n<li>D：questionable概括Far less certain，教师配对不奏效与人们坚持自主择友又给出怀疑的具体依据；它没有否定自然形成的同伴影响。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：同伴压力的传统认知与新观点</strong>（段落1核心论点） 同伴压力通常被视为负面力量：（导致酗酒、吸毒、随意性行为）// 罗森伯格提出新观点：（同伴压力可以成为积极力量，通过&quot;社会疗法&quot;改善生活）</p>\n<p>↓（具体举例说明）</p>\n<p><strong>逻辑层次2：社会疗法的实践案例</strong>（段落2具体例证） 南卡罗来纳州：&quot;向烟雾宣战&quot;项目（让吸烟变得不酷）+ 南非：loveLife项目（在同龄人中推广安全性行为）</p>\n<p>→（深入分析现状）</p>\n<p><strong>逻辑层次3：公共健康运动的问题与解决方案</strong>（段落3批判与建议） 罗森伯格的批判：【现有公共健康运动的失败：（未能动员同伴压力 + 误解心理学原理）→ 案例：&quot;敢于与众不同&quot;（忽视青少年渴望融入的心理）】→ 建议：向广告商学习运用同伴压力</p>\n<p>//（转折：批判该理论）</p>\n<p><strong>逻辑层次4：社会疗法的缺陷</strong>（段落4反面论证） 书籍本身的问题：（过多无关细节 + 缺乏深入探讨）→ 实践效果的问题：【持续时间短：（&quot;向烟雾宣战&quot;因资金削减而失败）+ （loveLife效果有限且混杂）】</p>\n<p>↓（理论基础与现实困境）</p>\n<p><strong>逻辑层次5：同伴压力的科学基础与实施困境</strong>（段落5-6总结反思） 科学事实：（同伴群体确实影响行为 + 健康习惯通过社交网络传播 + 无意识模仿是微妙的同伴压力）// 实施困境：（专家难以成功选择和引导同伴群体）→ 类比：（如同老师拆散捣蛋鬼的策略失败）→ 根本问题：【外部设计的局限性：（人们坚持自主选择朋友）】</p>\n<p>↑（总体评价）</p>\n<p>全文核心观点：同伴压力可以被用作积极的社会改变工具（社会疗法），但外部设计和实施这种压力面临根本性挑战——人们倾向于自主选择朋友圈，而非接受外部安排。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. The limits of directing friendships from outside</p>\n<p>B. The everyday spread of both good and bad habits</p>\n<p>C. A potentially positive use of an unpopular force</p>\n<p>D. Guaranteeing lasting success by recruiting advertisers</p>\n<p>E. Questions about explanation and lasting effectiveness</p>\n<p>F. Why health campaigns should understand the wish to belong</p>\n<p>G. Rejecting the existence of peer influence altogether</p>\n<p><strong>41.</strong></p>\n<p>Come on – Everybody’s doing it. That whispered message, half invitation and half forcing, is what most of us think of when we hear the words peer pressure. It usually leads to no good – drinking, drugs and casual sex. But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n<p><strong>42.</strong></p>\n<p>Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking  program called Rage Against the Haze sets out to make cigarettes uncool. In South Africa, an HIV-prevention initiative known as loveLife recruits young people to promote safe sex among their peers. The idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p><strong>43.</strong></p>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n<p><strong>44.</strong></p>\n<p>There’s no doubt that our peer groups exert enormous influence on our behavior. An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication. This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n<p><strong>45.</strong></p>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. A potentially positive use of an unpopular force</p>\n<blockquote>\n<p>通常不受欢迎的力量也可能有积极用途</p>\n</blockquote>\n<p>以同伴压力的常见负面印象开头，再由But转向社会疗法的积极设想。前后讨论的是同一种群体力量的不同用法，不能因为开头列举不良行为，就漏掉后半段的改善目标。</p>\n<blockquote>\n<p>Come on – Everybody’s doing it.</p>\n</blockquote>\n<p><code>Everybody’s doing it</code>用大家都这样做来劝一个人加入，半是邀请、半是压力，先把同伴压力发生的方式摆出来。</p>\n<blockquote>\n<p>It usually leads to no good – drinking, drugs and casual sex.</p>\n</blockquote>\n<p><code>usually leads to no good</code>给出常见的负面看法，后面的酗酒、吸毒等是这类后果的例子。标题中的<code>unpopular force</code>能接住这种一般印象。</p>\n<blockquote>\n<p>But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<p><code>But</code>后仍以<code>peer pressure</code>作主语，却改说它<code>can also be a positive force</code>。<code>in which</code>继续说明组织怎样利用群体力量帮助个人，积极用途不是标题额外加出来的。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>大家都这样做的劝导 → 通常被视为坏行为的来源 → 同一力量也可能被积极利用 → 介绍社会疗法</p>\n</blockquote>\n<p>unpopular force接住通常导致不良行为的同伴压力，potentially positive use接住can also be a positive force。can表示可能用途，并未保证项目成功。</p>\n<p>再看最强干扰项G：Rejecting the existence of peer influence altogether。</p>\n<p>末段才会讨论外部安排的限度，本文从未因此否认同伴影响存在；首段更直接承认这种力量可能改善生活。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】F. Why health campaigns should understand the wish to belong</p>\n<blockquote>\n<p>健康宣传为何应理解融入群体的愿望</p>\n</blockquote>\n<p>先列禁烟与安全性行为项目，再通过禁烟口号的反例说明宣传为何失灵。青少年想融入群体，口号却要求与众不同；应向广告商学习的是运用这种心理的方法。</p>\n<blockquote>\n<p>Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking  program called Rage Against the Haze sets out to make cigarettes uncool.</p>\n</blockquote>\n<p><code>social cure in action</code>说明本段从概念进入实际运用；让吸烟变得不酷，正是把青少年在同伴面前的形象与健康行为联系起来。</p>\n<blockquote>\n<p>Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology.</p>\n</blockquote>\n<p>批评的具体内容紧跟在冒号后：这些宣传没有调动同伴压力，而且误解青少年心理。后面的<code>Dare to be different</code>与<code>fitting in</code>把冲突说明白了——宣传要求不同，受众却想融入。</p>\n<blockquote>\n<p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<p><code>take a page from advertisers</code>把前面的心理问题接成方法建议。要学的内容也明确写成<code>applying peer pressure</code>，因此标题落在健康宣传理解归属愿望，而非笼统赞美广告。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公共卫生项目利用同伴评价 → 反例显示宣传与归属愿望相反 → 指出心理理解不足 → 建议学习广告商运用同伴压力的方法</p>\n</blockquote>\n<p>health campaigns概括两个公共卫生项目，wish to belong对应fitting in；标题能够把实践例子和方法建议接在一起。</p>\n<p>再看最强干扰项D：Guaranteeing lasting success by recruiting advertisers。</p>\n<p>take a page from说借鉴方法，并非招募人员。段落也没有证明这些项目一定带来持久改变，guaranteeing额外加上了结果保证。</p>\n<p><strong>42题选F。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】E. Questions about explanation and lasting effectiveness</p>\n<blockquote>\n<p>对原因解释和持久成效的质疑</p>\n</blockquote>\n<p>But把评价转到总体有效性。作者分别指出书里原因探究不足，以及疗法效果不持久；两个项目的后续情况用于说明后一项问题。</p>\n<blockquote>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive.</p>\n</blockquote>\n<p><code>But</code>承接上一段对方法建议的肯定，改问社会疗法是否普遍有效。<code>less persuasive</code>限定了这次评价：对一个建议说得有道理，不等于对总体效果也证明充分。</p>\n<blockquote>\n<p>The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long.</p>\n</blockquote>\n<p><code>doesn’t work very well for very long</code>同时涉及效果和持续时间。前面还有<code>not enough exploration</code>，指出书对社会与生物原因探究不足，所以标题需要覆盖解释与实践两层。</p>\n<blockquote>\n<p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n<p><code>limited and mixed</code>说的是持久改变的证据有限、结果不一致，不能改成已经证明绝无效果。连同拨款削减后项目失败，它支撑的是长期有效性仍有疑问。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>转向总体有效性 → 书中原因探究不足 → 项目难以维持效果 → 长期证据有限且不一致</p>\n</blockquote>\n<p>explanation对应not enough exploration，lasting effectiveness对应doesn’t work very well for very long。标题同时覆盖论证不足和效果不足。</p>\n<p>再看最强干扰项D：Guaranteeing lasting success by recruiting advertisers。</p>\n<p>段落展示的是长期证据有限以及拨款削减后失败，无法推出招募广告商就能解决这些缺陷。</p>\n<p><strong>43题选E。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】B. The everyday spread of both good and bad habits</p>\n<blockquote>\n<p>好坏习惯在日常交往中的传播</p>\n</blockquote>\n<p>先承认同伴群体有强大影响，再把积极与消极习惯并列，最后用不自觉模仿说明它们共同的传播方式。这里讨论自然发生的日常过程。</p>\n<blockquote>\n<p>There’s no doubt that our peer groups exert enormous influence on our behavior.</p>\n</blockquote>\n<p><code>There’s no doubt</code>先肯定同伴群体确实有影响，接住前文质疑疗法后容易产生的疑问：疗法成效不足，不等于这种自然力量不存在。</p>\n<blockquote>\n<p>An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication.</p>\n</blockquote>\n<p><code>positive ... as well as negative</code>把好坏习惯并列，<code>through networks</code>与<code>via social communication</code>又说明传播路径。标题的<code>both good and bad habits</code>保留了这个范围。</p>\n<blockquote>\n<p>This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n</blockquote>\n<p><code>This</code>回指前面的传播，冒号后的<code>unconsciously imitate</code>解释它怎样发生；<code>every day</code>则把这种影响放在普通日常接触中，正好对应标题的<code>everyday spread</code>。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>承认同伴影响存在 → 好坏习惯都会经朋友网络传播 → 日常不自觉模仿解释共同过程</p>\n</blockquote>\n<p>both good and bad保留并列范围，everyday spread概括朋友网络与每天看到的行为，没有把效果缩成只有坏习惯。</p>\n<p>再看最强干扰项G：Rejecting the existence of peer influence altogether。</p>\n<p>There’s no doubt与否认影响存在方向相反。作者保留这个事实，才在下一段另问外部人员能否利用它。</p>\n<p><strong>44题选B。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】A. The limits of directing friendships from outside</p>\n<blockquote>\n<p>从外部安排友谊的局限</p>\n</blockquote>\n<p>however将自然影响与外部干预区分。教师配对的例子解释安排为什么不奏效，结尾自主选择朋友点出对这种干预的限制。</p>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions.</p>\n</blockquote>\n<p><code>however</code>把问题由自然影响转向专家和官员能否主动选择群体、引导活动。<code>Far less certain</code>不是否定上一段的事实，而是对这一层控制是否成功保留怀疑。</p>\n<blockquote>\n<p>The tactic never really works.</p>\n</blockquote>\n<p><code>The tactic</code>回指教师让学生与表现较好的同学配对的办法；<code>never really works</code>评价实际成效，不能把教师希望改善行为的目标当成结果。</p>\n<blockquote>\n<p>And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n</blockquote>\n<p>冒号后<code>we insist on choosing our own friends</code>解释外部设计受什么限制。它从课堂推广到真实生活，说明人们的自主选择为何使安排同伴关系难以按计划产生效果。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>自然影响存在 → 外部选择与引导未必成功 → 教师配对并不奏效 → 自主择友限制外部安排</p>\n</blockquote>\n<p>directing friendships from outside对应专家选群体、教师配对和engineered from the outside；limits对应成功程度不确定及自主选择的障碍。</p>\n<p>再看最强干扰项G：Rejecting the existence of peer influence altogether。</p>\n<p>对外部控制存疑不等于否认同伴影响存在。这个标题删除了上一段明确保留的事实，也换掉本段被评价的对象。</p>\n<p><strong>45题选A。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Peer pressure is often associated with drinking, drugs and other undesirable behavior. The invitation to do what everyone else is doing can seem partly like a threat. Tina Rosenberg, however, proposes that the same social force might be used to improve people&#39;s lives. She calls this positive application the social cure.</p>\n<p><strong>B.</strong></p>\n<p>What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want. Choosing a group for someone is different from observing influence within a group that has already formed. A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.</p>\n<p><strong>C.</strong></p>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct. The expected improvement does not simply follow from the seating plan. Pupils, like adults outside school, insist on choosing their own friends, and this choice limits the planner&#39;s control.</p>\n<p><strong>D.</strong></p>\n<p>That desire makes some familiar health messages doubtful. Asking teenagers to stand apart from their peers can ignore their wish to fit in. Advertisers often understand the wish more effectively. Learning from their methods is a plausible recommendation, but a promising method still leaves a separate question: whether its effects will last.</p>\n<p><strong>E.</strong></p>\n<p>On that question of lasting effects, the evidence is much less reassuring. One antismoking project failed after state funding was cut, while another programme produced limited and mixed evidence of durable change. The book also gives too little attention to the social and biological factors that make peer influence powerful.</p>\n<p><strong>F.</strong></p>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex. Instead of addressing each person in isolation, the projects try to make healthy behavior attractive among peers. Their method depends on understanding what group members want from one another, particularly the desire to belong.</p>\n<p><strong>G.</strong></p>\n<p>These weaknesses do not show that peer influence itself is imaginary. Good habits and bad ones can both spread through networks of friends. People often imitate what they encounter every day without consciously deciding to do so. The existence of that spontaneous process is not the main point in dispute.</p>\n<p><strong>H.</strong></p>\n<p>Such limits leave room for a more careful conclusion. Recognising the power of peer groups can improve the understanding of behavior, but it does not establish that an externally designed cure will work reliably. The strength of natural influence and the success of organised intervention are distinct claims requiring different evidence.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出同伴压力也可能用于改善生活</td>\n</tr>\n<tr>\n<td>B</td>\n<td>区分自然形成的影响与外部安排</td>\n</tr>\n<tr>\n<td>C</td>\n<td>用教师配对解释自主选朋友如何限制控制</td>\n</tr>\n<tr>\n<td>D</td>\n<td>由融入需要提出方法建议，并追问持久成效</td>\n</tr>\n<tr>\n<td>E</td>\n<td>列出长期成效和原因解释的不足</td>\n</tr>\n<tr>\n<td>F</td>\n<td>用公共卫生项目说明积极运用同伴心理</td>\n</tr>\n<tr>\n<td>G</td>\n<td>保留好坏习惯自然传播这一基础事实</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结自然影响与干预成功需要不同证据</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出同伴压力也可能用于改善生活 → 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效 → 列出长期成效和原因解释的不足 → 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制 → 总结自然影响与干预成功需要不同证据</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>She calls this positive application the social cure.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex.</p>\n</blockquote>\n<p>A末尾第一次给积极应用命名为<code>the social cure</code>，F开头的<code>This social cure</code>直接回指它。<code>is illustrated by</code>再把刚提出的概念带到禁烟和安全性行为的实例中，先有定义，才有这个回指和例证。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Instead of addressing each person in isolation, the projects try to make healthy behavior attractive among peers. Their method depends on understanding what group members want from one another, particularly the desire to belong.</p>\n</blockquote>\n<p>F没有逐个孤立劝导，而是让健康行为在同伴中显得有吸引力。末句把这种办法依赖的心理明确收束为<code>the desire to belong</code>，为下一段提供可以继续解释的愿望。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>That desire makes some familiar health messages doubtful.</p>\n</blockquote>\n<p>D的<code>That desire</code>正是承接F末尾的归属愿望。D接着检验让青少年与众不同的宣传，说明为什么一则看似正确的健康信息会与受众想融入的心理相冲突。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出同伴压力也可能用于改善生活 → 用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>These weaknesses do not show that peer influence itself is imaginary.</p>\n</blockquote>\n<p>G以<code>These weaknesses</code>开头，需要前面已经列出疗法或论述的弱点。A只有积极用途的提出，尚未展示成效问题；若此处接G，不但这个指代无所依附，D的<code>That desire</code>也失去刚出现的归属愿望。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Their method depends on understanding what group members want from one another, particularly the desire to belong.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>That desire makes some familiar health messages doubtful.</p>\n</blockquote>\n<p>F以<code>the desire to belong</code>结束，D的<code>That desire</code>接住同一个愿望。紧接的<code>stand apart</code>与<code>fit in</code>形成具体冲突，因此D是在解释F刚点出的心理条件，不是突然改谈另一种需要。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Asking teenagers to stand apart from their peers can ignore their wish to fit in. Advertisers often understand the wish more effectively. Learning from their methods is a plausible recommendation, but a promising method still leaves a separate question: whether its effects will last.</p>\n</blockquote>\n<p>D先批评让青少年与同伴不同的口号，再提出学习广告商的方法。但末句用<code>but</code>分开方法看起来有希望与成效能否持久，并明确提出<code>whether its effects will last</code>。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>On that question of lasting effects, the evidence is much less reassuring.</p>\n</blockquote>\n<p>固定E开头的<code>On that question of lasting effects</code>逐字接住D刚提出的持续性问题，然后才报告证据不够令人放心。问题在D末尾提出，回答在E开头开始，顺序清楚。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用公共卫生项目说明积极运用同伴心理 → 由融入需要提出方法建议，并追问持久成效 → 列出长期成效和原因解释的不足</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>These weaknesses do not show that peer influence itself is imaginary.</p>\n</blockquote>\n<p>G要承接的是已经列出的<code>weaknesses</code>。此处F还在展示积极实践和归属需要，没有具体列出长期缺点；若跳到G，E的<code>that question of lasting effects</code>也找不到刚刚提出的问题。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The book also gives too little attention to the social and biological factors that make peer influence powerful.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>These weaknesses do not show that peer influence itself is imaginary.</p>\n</blockquote>\n<p>E已经列出长期成效证据不足，并在结尾加上书的原因解释不够；G以<code>These weaknesses</code>把这些不足合起来，再用<code>do not show</code>限制它们能推出什么：不能据此说同伴影响不存在。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Good habits and bad ones can both spread through networks of friends. People often imitate what they encounter every day without consciously deciding to do so. The existence of that spontaneous process is not the main point in dispute.</p>\n</blockquote>\n<p>G随后列出好坏习惯都能在朋友网络中传播，并用不自觉模仿解释这种日常过程。结尾明确说<code>that spontaneous process</code>存在与否并非主要争议，从对疗法的批评退回一个仍被承认的基础事实。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want.</p>\n</blockquote>\n<p>B开头<code>What remains in dispute</code>接G的<code>not the main point in dispute</code>：不是争论自然过程存在不存在，而是争论外部人员能否组织它来实现目标。<code>the spontaneous process</code>也直接回指G刚解释的模仿。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列出长期成效和原因解释的不足 → 保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.</p>\n</blockquote>\n<p>C直接进入课堂配对的例子。若它紧跟E，书与疗法的缺点会突然跳到课堂，还没有说清自然影响与外部组织的区别；更直接的是，后面的B所说<code>the spontaneous process</code>也缺少G刚刚给出的完整解释。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The existence of that spontaneous process is not the main point in dispute.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>What remains in dispute is whether outsiders can organise the spontaneous process to obtain the results they want.</p>\n</blockquote>\n<p>G末尾说自然过程的存在不是主要争议，B便用<code>What remains in dispute</code>提出仍有争议的另一件事。两句一否一立，分别是承认自然传播和追问外部人员能否控制它。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Choosing a group for someone is different from observing influence within a group that has already formed. A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.</p>\n</blockquote>\n<p>B把替别人选群体与观察已形成群体里的影响分开；随后引入<code>A classroom</code>，并明确说它能展示<code>natural contact and imposed arrangement</code>的差别。例子出现前，先给出它要说明的关系。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.</p>\n</blockquote>\n<p>C开头的<code>In the classroom</code>接住B最后引入的课堂，具体写教师怎样安排学生配对。这个例子既有地点上的衔接，也兑现了前句要展示外部安排的承诺。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>保留好坏习惯自然传播这一基础事实 → 区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex.</p>\n</blockquote>\n<p>F以<code>This social cure</code>开头，回到积极应用的概念与公共卫生项目。在这里它既没有承接G关于争议范围的区分，也没有在结尾引出课堂；下一段的<code>In the classroom</code>会缺少刚建立的例证入口。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>A classroom provides a familiar illustration of that difference between natural contact and imposed arrangement.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>In the classroom, a teacher may place troublesome pupils beside better-behaved classmates in the hope of improving their conduct.</p>\n</blockquote>\n<p>B结尾明确说课堂可以展示自然接触与强加安排的区别，C马上以<code>In the classroom</code>进入教师配对的细节。它用一个具体安排来兑现前段的例证提示。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The expected improvement does not simply follow from the seating plan. Pupils, like adults outside school, insist on choosing their own friends, and this choice limits the planner&#39;s control.</p>\n</blockquote>\n<p>C先写预期改善不会从座位安排中自动产生，再解释学生坚持自己选朋友。<code>this choice limits the planner’s control</code>把例子的意义收束为自主选择限制外部控制。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Such limits leave room for a more careful conclusion.</p>\n</blockquote>\n<p>固定H开头的<code>Such limits</code>直接承接C末句<code>limits the planner’s control</code>。先通过教师例子看见限制，再据此得出更谨慎的结论，H的概括才有刚刚论证的对象。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分自然形成的影响与外部安排 → 用教师配对解释自主选朋友如何限制控制 → 总结自然影响与干预成功需要不同证据</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This social cure is illustrated by campaigns against smoking and unsafe sex.</p>\n</blockquote>\n<p>F介绍禁烟和安全性行为项目，重心在怎样积极利用归属愿望。B已经承诺一个课堂例子，F不能兑现这个承诺；它也没有以控制受到限制收尾，无法给H的<code>Such limits</code>提供近接依据。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>setting a positive example</strong></td>\n<td><strong>树立积极榜样</strong></td>\n<td><strong>人生哲理类｜榜样作用</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>healthy habits</td>\n<td>健康的习惯</td>\n<td>社会现象类｜社会生活</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>effective social communication</td>\n<td>有效的社会交流</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>self-improvement</strong></td>\n<td><strong>自我提升</strong></td>\n<td><strong>人生哲理类｜拼搏进取</strong></td>\n<td>
