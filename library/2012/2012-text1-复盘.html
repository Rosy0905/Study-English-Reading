<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| whispered | adj.低声说出的 | invitation | n.邀请 | forcing | n.强迫 |\n| peer pressure | n.同伴压力 | leads to | 导致 | contends | v.主张 |\n| positive force | 积极力量 | social cure | 社会疗法 | group dynamics | 群体互动 |\n| improve | v.改善 |  |  |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,148,900,482],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>whispered</td>\n<td>adj.低声说出的</td>\n<td>invitation</td>\n<td>n.邀请</td>\n<td>forcing</td>\n<td>n.强迫</td>\n</tr>\n<tr>\n<td>peer pressure</td>\n<td>n.同伴压力</td>\n<td>leads to</td>\n<td>导致</td>\n<td>contends</td>\n<td>v.主张</td>\n</tr>\n<tr>\n<td>positive force</td>\n<td>积极力量</td>\n<td>social cure</td>\n<td>社会疗法</td>\n<td>group dynamics</td>\n<td>群体互动</td>\n</tr>\n<tr>\n<td>improve</td>\n<td>v.改善</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| recipient | n.获得者 | offers | v.提供 | examples | n.例子 |\n| state-sponsored | adj.州政府资助的 | antismoking | adj.反吸烟的 | initiative | n.倡议 |\n| recruits | v.招募 | promote | v.推广 | peers | n.同龄人 |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,869,900,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<t ugs and casual sex. But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Come on -- / Everybody&#39;s doing it.</p>\n<p>That whispered message, / half invitation and half forcing, / is what most of us think of / when we hear the words / <em>peer pressure</em>.</p>\n<p>It usually leads to no good -- / drinking, drugs and casual sex.</p>\n<p>But in her new book / <em>Join the Club</em>, / Tina Rosenberg contends / that peer pressure / can also be a positive force / through what she calls / the social cure, / in which organizations and officials / use the power of group dynamics / to help individuals / improve their lives / and possibly the world.</p>\n</section>"},{"title":"第1段","raw":"### 意群翻译 · 第1段\n\n来吧 -- / 每个人都在做。\n\n那种窃窃私语的信息，/ 一半是邀请一半是强迫，/ 是我们大多数人想到的 / 当我们听到这些词 / _同伴压力_。\n\n它通常导致不好的事 -- / 喝酒、吸毒和随意性行为。\n\n但在她的新书中 / _加入俱乐部_，/ 蒂娜·罗森伯格主张 / 同伴压力 / 也可以是一种积极力量 / 通过她所称的 / 社会疗法，/ 在其中组织和官员们 / 使用群体动力的力量 / 来帮助个人 / 改善他们的生活 / 以及可能改善世界。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[95,148,900,482],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Come on – Everybody’s doing it. That whispered message, half invitation and half forcing, is what most of us think of when we hear the words peer pressure. It usually leads to no good – drinking, drugs and casual sex. But in her new book Join the Club, Tina Rosenberg contends that peer pressure can also be a positive for >标准译文 · 第2段</h3>\n<p>普利策奖得主罗森伯格提供了许多社会疗法实践的例子：在南卡罗来纳州，一个名为&quot;向烟雾宣战&quot;的州政府资助反吸烟项目，致力于让吸烟变得&quot;不酷&quot;；在南非，一个名为loveLife的艾滋病预防倡议招募年轻人，在同龄人中推广安全性行为。</p>\n</section>"},{"title":"第3段","raw":"### 完整原文 · 第3段\n\nThe idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1612,900,547],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>The idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</section>"},{"title":"第3段","raw":"### 意群划分 · 第3段\n\nThe idea seems promising, / and Rosenberg is a perceptive observer.\n\nHer critique / of the lameness / of many public-health campaigns / is spot-on: / they fail to mobilize / peer pressure for healthy habits, / and they demonstrate / a seriously flawed understanding / of psychology.\n\n\"Dare to be different, / please don't smoke!\" / pleads one billboard campaign / aimed at reducing smoking / among teenagers -- / _teenagers_, / who desire nothing more / than fitting in.\n\nRosenberg argues convincingly / that public-health advocates / ought to take a page / from advertisers, / so skilled at / applying peer pressure.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1612,900,547],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>The idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>The idea seems promising, / and Rosenberg is a perceptive observer.</p>\n<p>Her critique / of the lameness / of many public-health campaigns / is spot-on: / they fail to mobilize / peer pressure for healthy habits, / and they demonstrate / a seriously flawed understanding / of psychology.</p>\n<p>&quot;Dare to be different, / please don&#39;t smoke!&quot; / pleads one billboard campaign / aimed at reducing smoking / among teenagers -- / <em>teenagers</em>, / who desire nothing more / than fitting in.</p>\n<p>Rosenberg argues convincingly / that public-health advocates / ought to take a page / from advertisers, / so skilled at / applying peer pressure.</p>\n</section>"},{"title":"第3段","raw":"### 意群翻译 · 第3段\n\n这个想法看起来很有前景，/ 而且罗森伯格是一个敏锐的观察者。\n\n她的批评 / 关于拙劣之处 / 许多公共健康运动的 / 非常准确：/ 它们未能动员 / 同伴压力来促进健康习惯，/ 而且它们展示了 / 一种严重有缺陷的理解 / 对心理学的。\n\n\"敢于与众不同，/ 请不要吸烟！\" / 恳求一个广告牌运动 / 旨在减少吸烟 / 在青少年中 -- / _青少年_，/ 他们最渴望的无非是 / 融入群体。\n\n罗森伯格令人信服地论证 / 公共健康倡导者 / 应该学习一页 / 从广告商那里，/ 如此擅长 / 运用同伴压力。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1612,900,547],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>The idea seems promising, and Rosenberg is a perceptive observer. Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize  peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” pleads one billboard campaign aimed at reducing smoking among teenagers – teenagers, who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>The idea seems promising, / and Rosenberg is a perceptive observer.</p>\n<p>Her critique / of the lameness / of many public-health campaigns / is spot-on: / they fail to mobilize / peer pressure for healthy habits, / and they demonstrate / a seriously flawed understanding / of psychology.</p>\n<p>&quot;Dare to be different, / please don&#39;t smoke!&quot; / pleads one billboard campaign / aimed at ":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</section>"},{"title":"第4段","raw":"### 意群划分 · 第4段\n\nBut on the general effectiveness / of the social cure, / Rosenberg is less persuasive.\n\n_Join the Club_ / is filled with / too much irrelevant detail / and not enough exploration / of the social and biological factors / that make peer pressure so powerful.\n\nThe most glaring flaw / of the social cure / as it's presented here / is that it doesn't work very well / for very long.\n\nRage Against the Haze failed / once state funding was cut.\n\nEvidence that the loveLife program / produces lasting changes / is limited and mixed.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,2398,900,476],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>But on the general effectiveness / of the social cure, / Rosenberg is less persuasive.</p>\n<p><em>Join the Club</em> / is filled with / too much irrelevant detail / and not enough exploration / of the social and biological factors / that make peer pressure so powerful.</p>\n<p>The most glaring flaw / of the social cure / as it&#39;s presented here / is that it doesn&#39;t work very well / for very long.</p>\n<p>Rage Against the Haze failed / once state funding was cut.</p>\n<p>Evidence that the loveLife program / produces lasting changes / is limited and mixed.</p>\n</section>"},{"title":"第4段","raw":"### 意群翻译 · 第4段\n\n但关于总体效果 / 社会疗法的，/ 罗森伯格不太有说服力。\n\n_加入俱乐部_ / 充满了 / 太多无关的细节 / 而缺乏足够的探索 / 关于社会和生物因素的 / 这些因素使同伴压力如此强大。\n\n最明显的缺陷 / 社会疗法的 / 正如这里呈现的 / 是它效果不太好 / 持续时间不长。\n\n\"向烟雾宣战\"失败了 / 一旦州政府资金被削减。\n\n证据表明loveLife项目 / 产生持久改变的 / 是有限且混杂的。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,2398,900,476],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>But on the general effectiveness / of the social cure, / Rosenberg is less persuasive.</p>\n<p><em>Join the Club</em> / is filled with / too much irrelevant detail / and not enough exploration / of the social and biological factors / that make peer pressure so powerful.</p>\n<p>The most glaring flaw / of the social cure / as it&#39;s presented here / is that it doesn&#39;t work very well / for very long.</p>\n<p>Rage Against the Haze failed / once state funding was cut.</p>\n<p>Evidence that the loveLife program / produces lasting changes / is limited and mixed.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3>\n<p>但关于总体效果 / 社会疗法的，/ 罗森伯格不太有说服力。</p>\n<p><em>加入俱乐部</em> / 充满了 / 太多无关的细节 / 而缺乏足够的探索 / 关于社会和生物因素的 / 这些因素使同伴压力如此强大。</p>\n<p>最明显的缺陷 / 社会疗法的 / 正如这里呈现的 / 是它效果不太好 / 持续时间不长。</p>\n<p>&quot;向烟雾宣战&quot;失败了 / 一旦州政府资金被削减。</p>\n<p>证据表明loveLife项目 / 产生持久改变的 / 是有限且混杂的。</p>\n</section>"},{"title":"第4段","raw":"### 标准译文 · 第4段\n\n但谈到社会疗法的总体效果，罗森伯格的论证就不那么有说服力了。《加入俱乐部》一书充斥着过多无关细节，却缺乏对使同伴压力如此强大的社会和生物因素的深入探讨。书中所呈现的社会疗法最明显的缺陷是：它的效果难以持久。\"向烟雾宣战\"项目在州政府资金被削减后就失败了。而loveLife项目能否产生持久改变，相关证据也十分有限且结果参差不齐。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,2398,900,476],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true},"focusId":"focus-paragraph-4-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much irrelevant detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most glaring flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>But on the general effectiveness / of the social cure, / Rosenberg is less persuasive.</p>\n<p><em>Join the Club</em> / is filled with / too much irrelevant detail / and not enough exploration / of the social and biological factors / that make peer pressure so powerful.</p>\n<p>The most glaring flaw / of the social cure / as it&#39;s presented here / is that it doesn&#39;t work very well / for very long.</p>\n<p>Rage Against the Haze failed / once state funding was cut.</p>\n<p>Evidence that the loveLife program / produces lasting changes / is limited and mixed.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3>\n<p>但关于总体效果 / 社会疗法的，/ 罗森伯格不太有说服力。</p>\n<p><em>加入俱乐部</em> / 充满了 / 太多无关的细节 / 而缺乏足够的探索 / 关于社会和生物因素的 / 这些因素使同伴压力如此强大。</p>\n<p>最明显的缺陷 / 社会疗法的 / 正如这里呈现的 / 是它效果不太好 / 持续时间不长。</p>\n<p>&quot;向烟雾宣战&quot;失败了 / 一旦州政府资金被削减。</p>\n<p>证据表明loveLife项目 / 产生持久改变的 / 是有限且混杂的。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-3\"><h3>标准译文 · 第4段</h3>\n<p>但谈到社会疗法的总体效果，罗森伯格的论证就不那么有说服力了。《加入俱乐部》一书充斥着过多无关细节，却缺乏对使同伴压力如此强大的社会和生物因素的深入探讨。书中所呈现的社会疗法最明显的缺陷是：它的效果难以持久。&quot;向烟雾宣战&quot;项目在州政府资金被削减后就失败了。而loveLife项目能否产生持久改变，相关证据也十分有限且结果参差不齐。</p>\n</section>"},{"title":"第5段","raw":"### 完整原文 · 第5段\n\nThere’s no doubt that our peer groups exert enormous influence on our behavior. An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication. This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAn ce / on our behavior.</p>\n<p>An emerging body of research / shows that positive health habits -- / as well as negative ones -- / spread through networks of friends / via social communication.</p>\n<p>This is a subtle form / of peer pressure: / we unconsciously imitate / the behavior we see / every day.</p>\n</section>"},{"title":"第5段","raw":"### 意群翻译 · 第5段\n\n毫无疑问 / 我们的同伴群体 / 施加巨大影响 / 对我们的行为。\n\n一个新兴的研究体系 / 显示积极的健康习惯 -- / 以及消极的 -- / 传播通过朋友网络 / 通过社交沟通。\n\n这是一种微妙的形式 / 同伴压力的：/ 我们无意识地模仿 / 我们看到的行为 / 每天。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,3273,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>There’s no doubt that our peer groups exert enormous influence on our behavior. An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication. This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>There&#39;s no doubt / that our peer groups / exert enormous influence / on our behavior.</p>\n<p>An emerging body of research / shows that positive health habits -- / as well as negative ones -- / spread through networks of friends / via social communication.</p>\n<p>This is a subtle form / of peer pressure: / we unconsciously imitate / the behavior we see / every day.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>毫无疑问 / 我们的同伴群体 / 施加巨大影响 / 对我们的行为。</p>\n<p>一个新兴的研究体系 / 显示积极的健康习惯 -- / 以及消极的 -- / 传播通过朋友网络 / 通过社交沟通。</p>\n<p>这是一种微妙的形式 / 同伴压力的：/ 我们无意识地模仿 / 我们看到的行为 / 每天。</p>\n</section>"},{"title":"第5段","raw":"### 标准译文 · 第5段\n\n毫无疑问，我们的同伴群体对我们的行为产生着巨大影响。新兴研究表明，积极的健康习惯——以及消极的习惯——通过社交沟通在朋友网络中传播。这是一种微妙的同伴压力形式：我们会无意识地模仿每天所见的行为。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,3273,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true},"focusId":"focus-paragraph-5-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>There’s no doubt that our peer groups exert enormous influence on our behavior. An emerging body of research shows that positive health habits – as well as negative ones – spread through networks of friends via social communication. This is a subtle form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>There&#39;s no doubt / that our peer groups / exert enormous influence / on our behavior.</p>\n<p>An emerging body of research / shows that positive health habits -- / as well as negative ones -- / spread through networks of friends / via social communication.</p>\n<p>This is a subtle form / of peer pressure: / we unconsciously imitate / the behavior we see / every day.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>毫无疑问 / 我们的同伴群体 / 施加巨大影响 / 对我们的行为。</p>\n<p>一个新兴的研究体系 / 显示积极的健康习惯 -- / 以及消极的 -- / 传播通过朋友网络 / 通过社交沟通。</p>\n<p>这是一种微妙的形式 / 同伴压力的：/ 我们无意识地模仿 / 我们看到的行为 / 每天。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段</h3>\n<p>毫无疑问，我们的同伴群体对我们的行为产生着巨大影响。新兴研究表明，积极的健康习惯——以及消极的习惯——通过社交沟通在朋友网络中传播。这是一种微妙的同伴压力形式：我们会无意识地模仿每天所见的行为。</p>\n</section>"},{"title":"第6段","raw":"### 完整原文 · 第6段\n\nFar less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[95,3731,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure engineered from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n</section>"},{"title":"第6段","raw":"### 意群划分 · 第6段\n\nFar less certain, however, / is how successfully / experts and bureaucrats / can select our peer groups / and steer their activities / in virtuous directions.\n\nIt's like the teacher / who breaks up the troublemakers / in the back row / by pairing them / with better-behaved classmates.\n\nThe tactic never really works.\n\nAnd that's the problem / with a social cure / engineered from the outside: / in the real world, / as in school, / we insist on / choosing our own friends.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[95,3731,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-1","html e>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>"},{"title":"句子逻辑梳理（选修）","raw":"## 句子逻辑梳理（选修）\n\n**第1段**\n\nCome on -- Everybody's doing it.\n\nThat whispered message：(half invitation and half forcing) → is what most of us think of：(when we hear the words _peer pressure_).\n\nIt usually leads to no good：(drinking + drugs + casual sex).\n\nBut in her new book _Join the Club_ → Tina Rosenberg contends：(that peer pressure → can also be a positive force：(through what she calls the social cure：(in which organizations and officials → use the power of group dynamics → to help individuals → improve their lives + possibly the world))).\n\n**第2段**\n\nRosenberg：(the recipient of a Pulitzer Prize) → offers a host of examples：(of the social cure in action)：In South Carolina：(a state-sponsored antismoking program：(called Rage Against the Haze) → sets out to make → cigarettes uncool).\n\nIn South Africa：(an HIV-prevention initiative：(known as loveLife) → recruits young people → to promote safe sex：(among their peers)).\n\n**第3段**\n\nThe idea seems promising + Rosenberg is a perceptive observer.\n\nHer critique：(of the lameness：(of many public-health campaigns)) → is spot-on：(they fail to mobilize peer pressure：(for healthy habits) + they demonstrate a seriously flawed understanding：(of psychology)).\n\n\"Dare to be different, please don't smoke!\" → pleads one billboard campaign：(aimed at reducing smoking：(among teenagers))：(_teenagers_：(who desire nothing more than fitting in)).\n\nRosenberg argues convincingly：(that public-health advocates → ought to take a page：(from advertisers：(so skilled at applying peer pressure))).\n\n**第4段**\n\nBut on the general effectiveness：(of the social cure) // Rosenberg is less persuasive.\n\n_Join the Club_ → is filled with：(too much irrelevant detail) + not enough exploration：(of the social and biological factors：(that make peer pressure so powerful)).\n\nThe most glaring flaw：(of the social cure：(as it's presented here)) → is that it doesn't work very well：(for very long).\n\nRage Against the Haze failed：(once state funding was cut).\n\nEvidence：(that the loveLife program → produces lasting changes) → is limited and mixed.\n\n**第5段**\n\nThere's no doubt：(that our peer groups → exert enormous influence：(on our behavior)).\n\nAn emerging body of research → shows：(that positive health habits -- as well as negative ones -- → spread：(through networks of friends)：(via social communication)).\n\nThis is a subtle form：(of peer pressure)：(we unconsciously imitate → the behavior：(we see every day)).\n\n**第6段**\n\nFar less certain, however // is how successfully：(experts and bureaucrats → can select our peer groups + steer their activities：(in virtuous directions)).\n\nIt's like the teacher：(who breaks up the troublemakers：(in the back row)：(by pairing them：(with better-behaved classmates))).\n\nThe tactic never really works.\n\nAnd that's the problem：(with a social cure：(engineered from the outside))：(in the real world + as in school → we insist on：(choosing our own friends)).","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>Come on -- Everybody&#39;s doing it.</p>\n<p>That whispered message：(half invitation and half forcing) → is what most of us think of：(when we hear the words <em>peer pressure</em>).</p>\n<p>It usually leads to no good：(drinking + drugs + casual sex).</p>\n<p>But in her new book <em>Join the Club</em> → Tina Rosenberg contends：(that peer pressure → can also be a positive force：(through what she calls the social cure：(in which organizations and officials → use the power of group dynamics → to help individuals → improve their lives + possibly the world))).</p>\n<p><strong>第2段</strong></p>\n<p>Rosenberg：(the recipient of a Pulitzer Prize) → offers a host of examples：(of the social cure in action)：In South ain, however // is how successfully：(experts and bureaucrats → can select our peer groups + steer their activities：(in virtuous directions)).</p>\n<p>It&#39;s like the teacher：(who breaks up the troublemakers：(in the back row)：(by pairing them：(with better-behaved classmates))).</p>\n<p>The tactic never really works.</p>\n<p>And that&#39;s the problem：(with a social cure：(engineered from the outside))：(in the real world + as in school → we insist on：(choosing our own friends)).</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n来吧 -- 每个人都在做。\n\n那种窃窃私语的信息：(一半是邀请一半是强迫) → 是我们大多数人想到的：(当我们听到_同伴压力_这些词)。\n\n它通常导致不好的事：(喝酒 + 吸毒 + 随意性行为)。\n\n但在她的新书_加入俱乐部_中 → 蒂娜·罗森伯格主张：(同伴压力 → 也可以是一种积极力量：(通过她所称的社会疗法：(在其中组织和官员们 → 使用群体动力的力量 → 来帮助个人 → 改善他们的生活 + 可能改善世界)))。\n\n**第2段**\n\n罗森伯格：(普利策奖获得者) → 提供了大量例子：(关于社会疗法的实践)：在南卡罗来纳州：(一个州政府资助的反吸烟项目：(叫做\"向烟雾宣战\") → 致力于让 → 香烟变得不酷)。\n\n在南非：(一个预防艾滋病的倡议：(被称为loveLife) → 招募年轻人 → 来推广安全性行为：(在他们的同龄人中))。\n\n**第3段**\n\n这个想法看起来很有前景 + 罗森伯格是一个敏锐的观察者。\n\n她的批评：(关于拙劣之处：(许多公共健康运动的)) → 非常准确：(它们未能动员同伴压力：(来促进健康习惯) + 它们展示了严重有缺陷的理解：(对心理学的))。\n\n\"敢于与众不同，请不要吸烟！\" → 恳求一个广告牌运动：(旨在减少吸烟：(在青少年中))：(_青少年_：(他们最渴望的无非是融入群体))。\n\n罗森伯格令人信服地论证：(公共健康倡导者 → 应该学习一页：(从广告商那里：(如此擅长运用同伴压力)))。\n\n**第4段**\n\n但关于总体效果：(社会疗法的) // 罗森伯格不太有说服力。\n\n_加入俱乐部_ → 充满了：(太多无关的细节) + 缺乏足够的探索：(关于社会和生物因素的：(这些因素使同伴压力如此强大))。\n\n最明显的缺陷：(社会疗法的：(正如这里呈现的)) → 是它效果不太好：(持续时间不长)。\n\n\"向烟雾宣战\"失败了：(一旦州政府资金被削减)。\n\n证据：(表明loveLife项目 → 产生持久改变的) → 是有限且混杂的。\n\n**第5段**\n\n毫无疑问：(我们的同伴群体 → 施加巨大影响：(对我们的行为))。\n\n一个新兴的研究体系 → 显示：(积极的健康习惯 -- 以及消极的 -- → 传播：(通过朋友网络)：(通过社交沟通))。\n\n这是一种微妙的形式：(同伴压力的)：(我们无意识地模仿 → 行为：(我们每天看到的))。\n\n**第6段**\n\n远不那么确定的，然而 // 是多么成功地：(专家和官僚们 → 能够选择我们的同伴群体 + 引导他们的活动：(朝着良好的方向))。\n\n这就像老师：(拆散捣乱分子：(在后排的)：(通过把他们配对：(与表现更好的同学)))。\n\n这种策略从来没有真正奏效。\n\n这就是问题所在：(对于社会疗法：(从外部设计的))：(在现实世界中 + 就像在学校里 → 我们坚持：(选择我们自己的朋友))。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p 先用“然而，更不确定的是”引出问题，再说专家和官僚能否成功完成两项动作。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。</p>\n</blockquote>\n</section>"},{"title":"3. 第6段第1句","raw":"### 第五步：艺术加工\n\nless certain表示更不确定，不能译成已经证实完全无效；virtuous修饰引导的方向。\n\n参考译文：\n\n> 然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段第1句","focus":[95,3731,900,155],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":true},"focusId":"focus-long-3-5","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous directions.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>Far less certain, however, / is how successfully / experts and bureaucrats / can select our peer groups / and steer their activities / in virtuous directions.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>远不那么确定的，然而，/ 是多么成功地 / 专家和官僚们 / 能够选择我们的同伴群体 / 并引导他们的活动 / 朝着良好的方向。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>把“替我们选择同伴群体”和“引导他们的活动”合成外部干预的两项动作。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>远不那么确定的，然而， 是多么成功地  专家和官僚们  能够选择我们的同伴群体  并引导他们的活动  朝着良好的方向。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>专家能多成功地选择并引导群体，远不确定。</p>\n</blockquote>\n<p>先用“然而，更不确定的是”引出问题，再说专家和官僚能否成功完成两项动作。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>less certain表示更不确定，不能译成已经证实完全无效；virtuous修饰引导的方向。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>然而，专家和官僚能否成功地为我们选择同伴群体，并将其活动引向正途，这一点远不那么确定。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> According to the first paragraph, peer pressure often emerges as ______.\n>\n> 根据第一段，同伴压力常常表现为什么？\n\n### 题型\n\n细节题。题干用often限定常见表现，要与第一段的usually对应。\n\n先读破折号后的具体行为，再看转折引出的积极用途。通常的后果和另一种可能不要混成同一结论。\n\n### 核心出处\n\n> It usually leads to no good—drinking, drugs and casual sex.\n>\n> peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"21","questionIntro":true},"html":"<blockquote>\n<p>According to the first paragraph, peer pressure often emerges as ______.</p>\n<p>根据第一段，同伴压力常常表现为什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干用often限定常见表现，要与第一段的usually对应。</p>\n<p>先读破折号后的具体行为，再看转折引出的积极用途。通常的后果和另一种可能不要混成同一结论。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n"},{"title":"A. a supplement to the social cure","raw":"### A. a supplement to the social cure\n\n> 根据第一段，同伴压力常常是社会疗法的一种补充。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n`social cure`确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面`usually`所限定的常见表现。\n\n**出处：**\n\n> It usually leads to no good—drinking, drugs and casual sex.\n>\n> peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>根据第一段，同伴压力常常是社会疗法的一种补充。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>social cure</code>确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面<code>usually</code>所限定的常见表现。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n</section>"},{"title":"A. a supplement to the social cure","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第一段，同伴压力常常是社会疗法的一种补充。\n\n`supplement to`是对某事物的补充，意味着先有一套社会疗法，再在它之外加上同伴压力。原文在`social cure`后面接`in which`，解释的却是这项疗法本身怎样进行：组织和官员运用群体互动的力量，帮助个人改善生活。\n\n前面的`peer pressure can also be a positive force through ...`与这个解释连在一起，说明同伴压力可以被积极利用。它不是一项已经独立存在的疗法之外的附加工具。\n\n再看题干`often`，它要对应前面`usually leads to no good`所说的常见情况。A既改了同伴压力与疗法的关系，又没有接住这一频率限定，不能因为看见`social cure`就保留。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>根据第一段，同伴压力常常是社会疗法的一种补充。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>social cure</code>确实在段末出现，但利用群体力量就是这项疗法的做法。A把这种力量改成了疗法之外的一项补充，也没有回答前面<code>usually</code>所限定的常见表现。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It usually leads to no good—drinking, drugs and casual sex.</p>\n<p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是社会疗法的一种补充。</p>\n</blockquote>\n<p><code>supplement to</code>是对某事物的补充，意味着先有一套社会疗法，再在它之外加上同伴压力。原文在<code>social cure</code>后面接<code>in which</code>，解释的却是这项疗法本身怎样进行：组织和官员运用群体互动的力量，帮助个人改善生活。</p>\n<p>前面的<code>peer pressure can also be a positive force through ...</code>与这个解释连在一起，说明同伴压力可以被积极利用。它不是一项已经独立存在的疗法之外的附加工具。</p>\n<p>再看题干<code>often</code>，它要对应前面<code>usually leads to no good</code>所说的常见情况。A既改了同伴压力与疗法的关系，又没有接住这一频率限定，不能因为看见<code>social cure</code>就保留。</p>\n</section>"},{"title":"A. a supplement to the social cure","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It usually leads to no good—drinking, drugs and casual sex.\n>\n> peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.\n>\n> 它通常导致不好的结果——酗酒、吸毒和随意性行为。同伴压力也可以通过她称作“社会疗法”的方式成为积极力量：组织和官员利用群体互动的力量，帮助个人改善生活，甚至可能改善世界。\n\n作者先写同伴压力通常造成的坏结果，再用`But`引出另一种可能，随后解释怎样利用群体力量。后半段是在展开一种积极用途，没有先介绍别的疗法再追加补充措施。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The social cure relies on other methods, with peer pressure added as a supplementary measure.\n>\n> 社会疗法依靠其他方法，并把同伴压力加入作为补充措施。\n\nA需要把疗法本身与后来补入的同伴压力分开。实际的`in which`直接把运用群体力量写成疗法的内容，没有这两个先后独立的部分。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-optio 其他方法，并把同伴压力加入作为补充措施。</p>\n</blockquote>\n<p>A需要把疗法本身与后来补入的同伴压力分开。实际的<code>in which</code>直接把运用群体力量写成疗法的内容，没有这两个先后独立的部分。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. a stimulus to group dynamics","raw":"### B. a stimulus to group dynamics\n\n> 根据第一段，同伴压力常常是刺激群体互动的因素。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n原文写组织和官员利用`group dynamics`产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。\n\n**出处：**\n\n> in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-B-0\"><blockquote>\n<p>根据第一段，同伴压力常常是刺激群体互动的因素。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写组织和官员利用<code>group dynamics</code>产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n</section>"},{"title":"B. a stimulus to group dynamics","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据第一段，同伴压力常常是刺激群体互动的因素。\n\n`stimulus to group dynamics`要说同伴压力刺激或推动群体互动。原句却是`use the power of group dynamics to help individuals`，主语是组织和官员，所利用的是群体互动的力量，要达到的是帮助个人的效果。\n\n所以这里是在说明怎样借助群体关系发挥影响，并没有先问群体互动为何出现，再把同伴压力列为原因。B虽然使用了原文的`group dynamics`，却将被利用的力量换成需要被刺激的结果。\n\n题干还问同伴压力常常表现为什么。首段用酗酒、吸毒等例子解释的常见后果，也不是群体互动被刺激。两个位置都不能给B所需的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-B-0\"><blockquote>\n<p>根据第一段，同伴压力常常是刺激群体互动的因素。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写组织和官员利用<code>group dynamics</code>产生积极影响；B把同伴压力放到前面，说它刺激了群体互动。它重新安排了这几个概念之间的作用方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第一段，同伴压力常常是刺激群体互动的因素。</p>\n</blockquote>\n<p><code>stimulus to group dynamics</code>要说同伴压力刺激或推动群体互动。原句却是<code>use the power of group dynamics to help individuals</code>，主语是组织和官员，所利用的是群体互动的力量，要达到的是帮助个人的效果。</p>\n<p>所以这里是在说明怎样借助群体关系发挥影响，并没有先问群体互动为何出现，再把同伴压力列为原因。B虽然使用了原文的<code>group dynamics</code>，却将被利用的力量换成需要被刺激的结果。</p>\n<p>题干还问同伴压力常常表现为什么。首段用酗酒、吸毒等例子解释的常见后果，也不是群体互动被刺激。两个位置都不能给B所需的关系。</p>\n</section>"},{"title":"B. a stimulus to group dynamics","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.\n>\n> 在这种疗法中，组织和官员利用群体互动的力量，帮助个人改善生活，甚至可能改善世界。\n\n段末的`in which`解释社会疗法怎样运作，句子沿“利用群体力量→帮助个人”推进。后文继续用公共卫生项目说明这种利用方式，没有转去说明怎样启动群体互动。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Peer pressure stimulates interaction within a group and strengthens its dynamics.\n>\n> 同伴压力刺激群体内部的互动，并增强群体动力。\n\nB需要同伴压力作为刺激来源、群体互动作为产生的结果。原文把群体力量当作已经可以利用的条件，说明的是它怎样影响个人，不能把同一句中的词换个位置就得到B。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"B","cu
