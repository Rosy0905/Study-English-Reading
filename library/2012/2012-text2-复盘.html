nt legislature</code>，仍是州立法机关。</p>\n<p>B写<code>federal legislature</code>，把机构改成联邦立法机关；<code>seek favor</code>又把动作从获得一项具体交易许可，改成争取支持或好感。</p>\n<p>后文出现联邦法院，是公司后来挑战州规则的地点，不属于2002年购厂协议的目的。题目有明确时间，不能把其他年份出现的联邦机构搬过来，也不能把法院改成立法机关。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n<p>为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。2006年，州又进一步要求，电站许可的任何延期都须经Vermont州议会批准。</p>\n</blockquote>\n<p>第三段按2002年购厂、接受条件、2006年追加审批要求的时间顺序展开，涉及的始终是州在交易和运营中的权限。联邦法律争议到后面才出现。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy entered the agreement to win support from the federal legislature.</p>\n<p>Entergy签订协议，是为了争取联邦立法机关的支持。</p>\n</blockquote>\n<p>B需要2002年签约与联邦立法机关支持之间的联系。实际句子把这项协议直接放在州批准购厂的条件中，机构和目的都不同。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. acquire an extension of its business license","raw":"### C. acquire an extension of its business license\n\n> Entergy签订2002年协议，是为了延长营业许可。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。\n\n**出处：**\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n>\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"C","cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-C-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n</section>"},{"title":"C. acquire an extension of its business license","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> Entergy签订2002年协议，是为了延长营业许可。\n\n原句要按条件关系读：为了取得`approval for the sale`，公司`agreed to seek permission ... to operate past 2012`。前者是当时希望获得的交易批准，后者是为此接受的未来程序。\n\n`seek permission`并不等于已经取得许可；同意以后申请，也不等于在2002年通过这份协议直接延长了运营权。2006年的`any extension ... be subject to ... approval`又说明延期还需要州议会同意。\n\nC把协议中将来要审查的事项当成这次签约立即要取得的许可，忽略了“购厂批准以接受未来监管为条件”的关系。D更准确对应`for the sale`。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"C","cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-C-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p>原句要按条件关系读：为了取得<code>approval for the sale</code>，公司<code>agreed to seek permission ... to operate past 2012</code>。前者是当时希望获得的交易批准，后者是为此接受的未来程序。</p>\n<p><code>seek permission</code>并不等于已经取得许可；同意以后申请，也不等于在2002年通过这份协议直接延长了运营权。2006年的<code>any extension ... be subject to ... approval</code>又说明延期还需要州议会同意。</p>\n<p>C把协议中将来要审查的事项当成这次签约立即要取得的许可，忽略了“购厂批准以接受未来监管为条件”的关系。D更准确对应<code>for the sale</code>。</p>\n</section>"},{"title":"C. acquire an extension of its business license","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n>\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval\n>\n> 为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。2006年，州又进一步要求，电站许可的任何延期都须经Vermont州议会批准。\n\n作者先写购厂，再解释公司为了获得交易批准接受哪些后续条件；随后才交代2006年针对延期增加的审批要求。交易与延期在叙述中是两件事。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Entergy entered the 2002 agreement in order to obtain an extension of its operating licence.\n>\n> Entergy签订2002年协议，是为了取得运营许可的延期。\n\nC需要把这次签约所求的批准明确落在运营延期上。实际`approval for the sale`指眼前的购厂交易，未来延期则是仍须另行申请的事项。公司当然希望今后继续运营，但不能用这个较远的愿望替换本句直接给出的签约目的。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"C","cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-C-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p>原句要按条件关系读：为了取得<code>approval for the sale</code>，公司<code>agreed to seek permission ... to operate past 2012</code>。前者是当时希望获得的交易批准，后者是为此接受的未来程序。</p>\n<p><code>seek permission</code>并不等于已经取得许可；同意以后申请，也不等于在2002年通过这份协议直接延长了运营权。2006年的<code>any extension ... be subject to ... approval</code>又说明延期还需要州议会同意。</p>\n<p>C把协议中将来要审查的事项当成这次签约立即要取得的许可，忽略了“购厂批准以接受未来监管为条件”的关系。D更准确对应<code>for the sale</code>。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n<p>为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。2006年，州又进一步要求，电站许可的任何延期都须经Vermont州议会批准。</p>\n</blockquote>\n<p>作者先写购厂，再解释公司为了获得交易批准接受哪些后续条件；随后才交代2006年针对延期增加的审批要求。交易与延期在叙述中是两件事。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy entered the 2002 agreement in order to obtain an extension of its operating licence.</p>\n<p>Entergy签订2002年协议，是为了取得运营许可的延期。</p>\n</blockquote>\n<p>C需要把这次签约所求的批准明确落在运营延期上。实际<code>approval for the sale</code>指眼前的购厂交易，未来延期则是仍须另行申请的事项。公司当然希望今后继续运营，但不能用这个较远的愿望替换本句直接给出的签约目的。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. get permission to purchase a power plant","raw":"### D. get permission to purchase a power plant\n\n> Entergy签订2002年协议，是为了获准购买核电站。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n`get permission`改写`receiving state approval`，购买核电站承接前句`bought`与本句`the sale`，目的和条件都能连起来。\n\n**出处：**\n\n> The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon\n>\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>get permission</code>改写<code>receiving state approval</code>，购买核电站承接前句<code>bought</code>与本句<code>the sale</code>，目的和条件都能连起来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n</section>"},{"title":"D. get permission to purchase a power plant","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Entergy签订2002年协议，是为了获准购买核电站。\n\n第三段先说`when the corporation bought ... nuclear power plant`，点出2002年的交易。下一句中的`the sale`就是这一交易，不是出售别的业务。\n\n`As a condition of receiving state approval for the sale`说明公司想取得州对这次交易的批准，必须答应将来在2012年后继续运营前向州申请许可。D的`permission to purchase a power plant`正好概括前半句的目的。\n\n购买与出售只是同一交易的不同视角：对公司是购厂，对这笔买卖本身是`the sale`。D没有把后面将来申请运营许可的条件，误作现在已经取得的延期结果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>get permission</code>改写<code>receiving state approval</code>，购买核电站承接前句<code>bought</code>与本句<code>the sale</code>，目的和条件都能连起来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p>第三段先说<code>when the corporation bought ... nuclear power plant</code>，点出2002年的交易。下一句中的<code>the sale</code>就是这一交易，不是出售别的业务。</p>\n<p><code>As a condition of receiving state approval for the sale</code>说明公司想取得州对这次交易的批准，必须答应将来在2012年后继续运营前向州申请许可。D的<code>permission to purchase a power plant</code>正好概括前半句的目的。</p>\n<p>购买与出售只是同一交易的不同视角：对公司是购厂，对这笔买卖本身是<code>the sale</code>。D没有把后面将来申请运营许可的条件，误作现在已经取得的延期结果。</p>\n</section>"},{"title":"D. get permission to purchase a power plant","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon\n>\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n>\n> 2002年，公司购买了Vermont唯一的核电站，那是Vernon一座已老化的反应堆。为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。\n\n作者用购厂事实引出协议，再说明同意未来申请许可是州批准这次买卖的条件。两句话共同解释2002年为什么签下约定。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> To obtain state permission to buy the plant, Entergy agreed to seek approval before operating it past 2012.\n>\n> 为取得州对购厂的许可，Entergy同意在2012年后继续运营之前另行申请批准。\n\nD所需的购厂目的由`approval for the sale`直接支持，后半句的未来义务又说明公司用什么条件换取许可，整条关系完整。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>get permission</code>改写<code>receiving state approval</code>，购买核电站承接前句<code>bought</code>与本句<code>the sale</code>，目的和条件都能连起来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p>第三段先说<code>when the corporation bought ... nuclear power plant</code>，点出2002年的交易。下一句中的<code>the sale</code>就是这一交易，不是出售别的业务。</p>\n<p><code>As a condition of receiving state approval for the sale</code>说明公司想取得州对这次交易的批准，必须答应将来在2012年后继续运营前向州申请许可。D的<code>permission to purchase a power plant</code>正好概括前半句的目的。</p>\n<p>购买与出售只是同一交易的不同视角：对公司是购厂，对这笔买卖本身是<code>the sale</code>。D没有把后面将来申请运营许可的条件，误作现在已经取得的延期结果。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>2002年，公司购买了Vermont唯一的核电站，那是Vernon一座已老化的反应堆。为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。</p>\n</blockquote>\n<p>作者用购厂事实引出协议，再说明同意未来申请许可是州批准这次买卖的条件。两句话共同解释2002年为什么签下约定。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>To obtain state permission to buy the plant, Entergy agreed to seek approval before operating it past 2012.</p>\n<p>为取得州对购厂的许可，Entergy同意在2012年后继续运营之前另行申请批准。</p>\n</blockquote>\n<p>D所需的购厂目的由<code>approval for the sale</code>直接支持，后半句的未来义务又说明公司用什么条件换取许可，整条关系完整。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. D**\n\n- A：原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。\n- B：2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。\n- C：2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。\n- D：get permission改写receiving state approval，购买核电站承接前句bought与本句the sale，目的和条件都能连起来。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"27","questionConclusion":true},"html":"<blockquote>\n<p><strong>27. D</strong></p>\n</blockquote>\n<ul>\n<li>A：原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。</li>\n<li>B：2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。</li>\n<li>C：2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。</li>\n<li>D：get permission改写receiving state approval，购买核电站承接前句bought与本句the sale，目的和条件都能连起来。</li>\n</ul>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> According to Paragraph 4, Entergy seems to have problems with its ______.\n>\n> 第四段显示，Entergy似乎在哪方面有问题？\n\n### 题型\n\n段落理解题。题干限定第四段，核对raised serious questions后面直接列出的评价对象。\n\n段首Either ... or ...只是两种可能解释；事故、误导性声明与议会反应才是随后具体展开的事实。\n\n### 核心出处\n\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe\n>\n> Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension\n>\n> Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"28","questionIntro":true},"html":"<blockquote>\n<p>According to Paragraph 4, Entergy seems to have problems with its ______.</p>\n<p>第四段显示，Entergy似乎在哪方面有问题？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落理解题。题干限定第四段，核对raised serious questions后面直接列出的评价对象。</p>\n<p>段首Either ... or ...只是两种可能解释；事故、误导性声明与议会反应才是随后具体展开的事实。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n</blockquote>\n"},{"title":"A. managerial practices","raw":"### A. managerial practices\n\n> 第四段显示，Entergy的管理做法存在问题。\n\n**做题模式中的状态：** 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与`Entergy’s management`对应。\n\n**出处：**\n\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与<code>Entergy’s management</code>对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n</section>"},{"title":"A. managerial practices","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第四段显示，Entergy的管理做法存在问题。\n\n核心句用`both ... and ...`并列两个被质疑对象：`Vermont Yankee’s safety`是电站安全，`Entergy’s management`是公司的管理。题干问Entergy哪方面有问题，后者直接对应A的`managerial practices`。\n\n事故名单说明管理为何受到关注，而破折号后的`especially after ... misleading statements`进一步点出公司如何回应管道问题。这里不只是发生了技术故障，还涉及公司是否如实交代情况。\n\n后面的州议会对公司行为愤怒、否决延期，是这类行为带来的后果。A概括的不是凭空推测的经营能力，而是事故处理与说明行为中被明确质疑的管理做法。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与<code>Entergy’s management</code>对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p>核心句用<code>both ... and ...</code>并列两个被质疑对象：<code>Vermont Yankee’s safety</code>是电站安全，<code>Entergy’s management</code>是公司的管理。题干问Entergy哪方面有问题，后者直接对应A的<code>managerial practices</code>。</p>\n<p>事故名单说明管理为何受到关注，而破折号后的<code>especially after ... misleading statements</code>进一步点出公司如何回应管道问题。这里不只是发生了技术故障，还涉及公司是否如实交代情况。</p>\n<p>后面的州议会对公司行为愤怒、否决延期，是这类行为带来的后果。A概括的不是凭空推测的经营能力，而是事故处理与说明行为中被明确质疑的管理做法。</p>\n</section>"},{"title":"A. managerial practices","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe\n>\n> 一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。\n\n作者先列事故，再明确说它们使安全和管理受到质疑，随后突出误导性声明，最后写州议会的反应。评价有事实和处理行为两层依据。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The accidents and the company’s misleading statements cast doubt on how Entergy manages the plant.\n>\n> 事故和公司的误导性声明，使人们怀疑Entergy管理电站的方式。\n\nA所需的管理问题已经被`management`点名，并由后续声明和议会反应继续展开，不依赖把段首某一种可能猜测当成定论。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与<code>Entergy’s management</code>对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p>核心句用<code>both ... and ...</code>并列两个被质疑对象：<code>Vermont Yankee’s safety</code>是电站安全，<code>Entergy’s management</code>是公司的管理。题干问Entergy哪方面有问题，后者直接对应A的<code>managerial practices</code>。</p>\n<p>事故名单说明管理为何受到关注，而破折号后的<code>especially after ... misleading statements</code>进一步点出公司如何回应管道问题。这里不只是发生了技术故障，还涉及公司是否如实交代情况。</p>\n<p>后面的州议会对公司行为愤怒、否决延期，是这类行为带来的后果。A概括的不是凭空推测的经营能力，而是事故处理与说明行为中被明确质疑的管理做法。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。</p>\n</blockquote>\n<p>作者先列事故，再明确说它们使安全和管理受到质疑，随后突出误导性声明，最后写州议会的反应。评价有事实和处理行为两层依据。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The accidents and the company’s misleading statements cast doubt on how Entergy manages the plant.</p>\n<p>事故和公司的误导性声明，使人们怀疑Entergy管理电站的方式。</p>\n</blockquote>\n<p>A所需的管理问题已经被<code>management</code>点名，并由后续声明和议会反应继续展开，不依赖把段首某一种可能猜测当成定论。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. technical innovativeness","raw":"### B. technical innovativeness\n\n> 第四段显示，Entergy的技术创新能力存在问题。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n设备事故涉及运行安全，却没有比较新技术研发或创新能力。B把管理与安全方面的事实转成了技术创新评价。\n\n**出处：**\n\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false,"kind":"option"},"focusI e, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe\n>\n> Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-C-0\"><blockquote>\n<p>第四段显示，Entergy的财务目标存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段的因果是事故和误导性声明引发管理质疑及议会反对，未讨论利润、收入或成本目标是否合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n</blockquote>\n</section>"},{"title":"C. financial goals","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第四段显示，Entergy的财务目标存在问题。\n\n`financial goals`指公司希望实现的财务目标。第四段虽然有事故和延期被否决，这些事情可能影响公司收入，却没有把任何利润、成本或投资目标拿来评价。\n\n句子直接写出的质疑对象是`both ... safety and ... management`。尤其是`misleading statements`，说明公司对管道情况的表述让管理问题更加突出。\n\n随后议会愤怒并反对延期，是对公司行为的反应。不能从这一后果自行补出公司的财务计划不合理，更不能把“可能有财务后果”换成“原来的财务目标有问题”。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false, y’s financial targets have proved unrealistic or inappropriate.\n>\n> Entergy的财务目标被证明不切实际或不恰当。\n\nC需要文章呈现财务目标及其问题。实际提供的都是安全与管理的证据，续期可能受影响并不能反推某个未出现的财务目标出了错。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-C-0\"><blockquote>\n<p>第四段显示，Entergy的财务目标存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段的因果是事故和误导性声明引发管理质疑及议会反对，未讨论利润、收入或成本目标是否合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy的财务目标存在问题。</p>\n</blockquote>\n<p><code>financial goals</code>指公司希望实现的财务目标。第四段虽然有事故和延期被否决，这些事情可能影响公司收入，却没有把任何利润、成本或投资目标拿来评价。</p>\n<p>句子直接写出的质疑对象是<code>both ... safety and ... management</code>。尤其是<code>misleading statements</code>，说明公司对管道情况的表述让管理问题更加突出。</p>\n<p>随后议会愤怒并反对延期，是对公司行为的反应。不能从这一后果自行补出公司的财务计划不合理，更不能把“可能有财务后果”换成“原来的财务目标有问题”。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n<p>一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。州参议院被公司的行为激怒，以26票对4票反对允许延期。</p>\n</blockquote>\n<p>作者围绕事故、公司说明、议会投票三个环节推进，结尾的否决延续了对公司行为的不满，没有转入经营目标的计算。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy’s financial targets have proved unrealistic or inappropriate.</p>\n<p>Entergy的财务目标被证明不切实际或不恰当。</p>\n</blockquote>\n<p>C需要文章呈现财务目标及其问题。实际提供的都是安全与管理的证据，续期可能受影响并不能反推某个未出现的财务目标出了错。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. business vision","raw":"### D. business vision\n\n> 第四段显示，Entergy缺乏商业远见。\n\n**做题模式中的状态：** 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第一类——歪曲原意。**\n\n`didn’t foresee`在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。\n\n**出处：**\n\n> Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next\n>\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>didn’t foresee</code>在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n</section>"},{"title":"D. business vision","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第四段显示，Entergy缺乏商业远见。\n\n段首是`Either ... or ...`：要么公司从未真心打算遵守承诺，要么它没有预见后来会发生什么。两种可能并列，作者没有在这一句中确定是后一种。\n\nD的`business vision`容易与`didn’t foresee`联系，但它需要把公司的商业远见作为已经得到支持的问题。原文随后实际展开的是事故、安全、管理和误导性声明，直接说`raised serious questions about ... Entergy’s management`。\n\n因此这里不能只截下`didn’t foresee`，删除前面的另一种解释和后面的明确评价。缺乏远见或许是一种解释，A所说的管理做法则有本段具体事实和原词共同支持。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>didn’t foresee</code>在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p>段首是<code>Either ... or ...</code>：要么公司从未真心打算遵守承诺，要么它没有预见后来会发生什么。两种可能并列，作者没有在这一句中确定是后一种。</p>\n<p>D的<code>business vision</code>容易与<code>didn’t foresee</code>联系，但它需要把公司的商业远见作为已经得到支持的问题。原文随后实际展开的是事故、安全、管理和误导性声明，直接说<code>raised serious questions about ... Entergy’s management</code>。</p>\n<p>因此这里不能只截下<code>didn’t foresee</code>，删除前面的另一种解释和后面的明确评价。缺乏远见或许是一种解释，A所说的管理做法则有本段具体事实和原词共同支持。</p>\n</section>"},{"title":"D. business vision","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next\n>\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe\n>\n> Entergy要么从未真心打算履行这些承诺，要么没有预见后来会发生什么。一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。\n\n作者以两种可能开头，并没有选择其中一种继续证明；接下来用事故与失实说明具体论证管理为何令人担忧。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Entergy’s poor business foresight left it unprepared for developments that followed.\n>\n> Entergy商业远见不足，因而没有为后来的变化做好准备。\n\nD需要把缺乏远见确立为原因。实际开头还保留根本无意守约这一可能，后文的明确落点又是管理行为，不能将未定的解释当成已经坐实的结论。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>didn’t foresee</code>在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p>段首是<code>Either ... or ...</code>：要么公司从未真心打算遵守承诺，要么它没有预见后来会发生什么。两种可能并列，作者没有在这一句中确定是后一种。</p>\n<p>D的<code>business vision</code>容易与<code>didn’t foresee</code>联系，但它需要把公司的商业远见作为已经得到支持的问题。原文随后实际展开的是事故、安全、管理和误导性声明，直接说<code>raised serious questions about ... Entergy’s management</code>。</p>\n<p>因此这里不能只截下<code>didn’t foresee</code>，删除前面的另一种解释和后面的明确评价。缺乏远见或许是一种解释，A所说的管理做法则有本段具体事实和原词共同支持。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Entergy要么从未真心打算履行这些承诺，要么没有预见后来会发生什么。一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。</p>\n</blockquote>\n<p>作者以两种可能开头，并没有选择其中一种继续证明；接下来用事故与失实说明具体论证管理为何令人担忧。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy’s poor business foresight left it unprepared for developments that followed.</p>\n<p>Entergy商业远见不足，因而没有为后来的变化做好准备。</p>\n</blockquote>\n<p>D需要把缺乏远见确立为原因。实际开头还保留根本无意守约这一可能，后文的明确落点又是管理行为，不能将未定的解释当成已经坐实的结论。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. A**\n\n- A：事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与Entergy’s management对应。\n- B：设备事故涉及运行安全，却没有比较新技术研发或创新能力。B把管理与安全方面的事实转成了技术创新评价。\n- C：原段的因果是事故和误导性声明引发管理质疑及议会反对，未讨论利润、收入或成本目标是否合理。\n- D：didn’t foresee在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"28","questionConclusion":true},"html":"<blockquote>\n<p><strong>28. A</strong></p>\n</blockquote>\n<ul>\n<li>A：事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与Entergy’s management对应。</li>\n<li>B：设备事故涉及运行安全，却没有比较新技术研发或创新能力。B把管理与安全方面的事实转成了技术创新评价。</li>\n<li>C：原段的因果是事故和误导性声明引发管理质疑及议会反对，未讨论利润、收入或成本目标是否合理。</li>\n<li>D：didn’t foresee在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。</li>\n</ul>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> In the author’s view, the Vermont case will test ______.\n>\n> 作者认为，Vermont案件将检验什么？\n\n### 题型\n\n细节题。题干问案件检验什么，定位test of之后的how far those powers extend。\n\n先找到those powers的先行内容，再将案件的法律问题与公司失信的起因、规则分散的顾虑分开。\n\n### 核心出处\n\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> But had Entergy kept its word, that debate would be beside the point.\n>\n> Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"29","questionIntro":true},"html":"<blockquote>\n<p>In the author’s view, the Vermont case will test ______.</p>\n<p>作者认为，Vermont案件将检验什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干问案件检验什么，定位test of之后的how far those powers extend。</p>\n<p>先找到those powers的先行内容，再将案件的法律问题与公司失信的起因、规则分散的顾虑分开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n</blockquote>\n"},{"title":"A. Entergy’s capacity to fulfill all its promises","raw":"### A. Entergy’s capacity to fulfill all its promises\n\n> 作者认为，这起案件将检验Entergy履行全部承诺的能力。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n公司失信引出了法律争议，但`test of`后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。\n\n**出处：**\n\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> But had Entergy kept its word, that debate would be beside the point.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者认为，这起案件将检验Entergy履行全部承诺的能力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>公司失信引出了法律争议，但<code>test of</code>后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n</section>"},{"title":"A. Entergy’s capacity to fulfill all its promises","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为，这起案件将检验Entergy履行全部承诺的能力。\n\n`test of how far those powers extend`先把案件的检验对象说清楚了。`those powers`回指前面州对核电拥有的一定监管权，问题是权力边界在哪里。\n\nA却说`Entergy’s capacity to fulfill all its promises`，既换成公司的履约能力，又加上全部承诺。文章批评公司没有守约，不等于法院正在检验它能不能履行所有约定。\n\n末尾`had Entergy kept its word, that debate would be beside the point`解释争论为何在这里发生：若公司守约，就无需进行这场辩论。它不改变前面已点明的法律检验对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者认为，这起案件将检验Entergy履行全部承诺的能力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>公司失信引出了法律争议，但<code>test of</code>后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验Entergy履行全部承诺的能力。</p>\n</blockquote>\n<p><code>test of how far those powers extend</code>先把案件的检验对象说清楚了。<code>those powers</code>回指前面州对核电拥有的一定监管权，问题是权力边界在哪里。</p>\n<p>A却说<code>Entergy’s capacity to fulfill all its promises</code>，既换成公司的履约能力，又加上全部承诺。文章批评公司没有守约，不等于法院正在检验它能不能履行所有约定。</p>\n<p>末尾<code>had Entergy kept its word, that debate would be beside the point</code>解释争论为何在这里发生：若公司守约，就无需进行这场辩论。它不改变前面已点明的法律检验对象。</p>\n</section>"},{"title":"A. Entergy’s capacity to fulfill all its promises","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> But had Entergy kept its word, that debate would be beside the point.\n>\n> 案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。但若Entergy遵守承诺，这场辩论便无关紧要。\n\n作者先承认州有一定监管权，再引出案件将界定权力范围，最后补一句守约本可使这场争论没有必要。法律问题与失信起因在段内分别承担不同作用。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The case will determine whether Entergy is capable of carrying out all its promises.\n>\n> 这起案件将确定Entergy是否有能力履行全部承诺。\n\nA需要法院判断公司的履约能力。实际`how far`讨论州权能伸到哪里；守约本可避免争议，并不把争议改成了能力测试。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-o 。法律问题与失信起因在段内分别承担不同作用。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The case will determine whether Entergy is capable of carrying out all its promises.</p>\n<p>这起案件将确定Entergy是否有能力履行全部承诺。</p>\n</blockquote>\n<p>A需要法院判断公司的履约能力。实际<code>how far</code>讨论州权能伸到哪里；守约本可避免争议，并不把争议改成了能力测试。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. the nature of states’ patchwork regulations","raw":"### B. the nature of states’ patchwork regulations\n\n> 作者认为，这起案件将检验各州零散监管规则的性质。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。\n\n**出处：**\n\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n</blockquote>\n</section>"},{"title":"B. the nature of states’ patchwork regulations","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为，这起案件将检验各州零散监管规则的性质。\n\n原文先给`test of how far those powers extend`，说案件要界定州监管权的延伸范围。接着`Certainly`承认另一个值得考虑的问题：如果每个州都设自己的规则，可能形成`patchwork regulations`。\n\n`could result if`说明这种零散状态是一个有条件的可能后果，作者承认对它的担忧有道理。B却把这项担忧变成案件本身要检验的`nature`。\n\n讨论州权边界时可以考虑规则分散的影响，但考虑一个后果与把它指定为检验对象不同。D能直接对上`how far`，B则取了旁边的相关顾虑来回答。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p>原文先给<code>test of how far those powers extend</code>，说案件要界定州监管权的延伸范围。接着<code>Certainly</code>承认另一个值得考虑的问题：如果每个州都设自己的规则，可能形成<code>patchwork regulations</code>。</p>\n<p><code>could result if</code>说明这种零散状态是一个有条件的可能后果，作者承认对它的担忧有道理。B却把这项担忧变成案件本身要检验的<code>nature</code>。</p>\n<p>讨论州权边界时可以考虑规则分散的影响，但考虑一个后果与把它指定为检验对象不同。D能直接对上<code>how far</code>，B则取了旁边的相关顾虑来回答。</p>\n</section>"},{"title":"B. the nature of states’ patchwork regulations","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules\n>\n> 案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。当然，如果每个州都自行设定规则，可能形成零散监管，对此担忧是有道理的。\n\n案件的法律问题先被明确提出，随后作者让步承认监管规则可能分散的担忧，再回到公司本应守约这一批评。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The case will examine the character of the different regulatory systems created by the states.\n>\n> 这起案件将考察各州制定的不同监管体系具有怎样的性质。\n\nB需要讨论重心落到这些规则的性质上。实际`Certainly`只补入一项顾虑，前面已确定的检验仍是州有权监管到什么程度，不能拿让步部分换掉它。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p>原文先给<code>test of how far those powers extend</code>，说案件要界定州监管权的延伸范围。接着<code>Certainly</code>承认另一个值得考虑的问题：如果每个州都设自己的规则，可能形成<code>patchwork regulations</code>。</p>\n<p><code>could result if</code>说明这种零散状态是一个有条件的可能后果，作者承认对它的担忧有道理。B却把这项担忧变成案件本身要检验的<code>nature</code>。</p>\n<p>讨论州权边界时可以考虑规则分散的影响，但考虑一个后果与把它指定为检验对象不同。D能直接对上<code>how far</code>，B则取了旁边的相关顾虑来回答。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n<p>案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。当然，如果每个州都自行设定规则，可能形成零散监管，对此担忧是有道理的。</p>\n</blockquote>\n<p>案件的法律问题先被明确提出，随后作者让步承认监管规则可能分散的担忧，再回到公司本应守约这一批评。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The case will examine the character of the different regulatory systems created by the states.</p>\n<p>这起案件将考察各州制定的不同监管体系具有怎样的性质。</p>\n</blockquote>\n<p>B需要讨论重心落到这些规则的性质上。实际<code>Certainly</code>只补入一项顾虑，前面已确定的检验仍是州有权监管到什么程度，不能拿让步部分换掉它。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. the federal authority over nuclear issues","raw":"### C. the federal authority over nuclear issues\n\n> 作者认为，这起案件将检验联邦在核问题上的权力。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。\n\n**出处：**\n\n> Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.\n>\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-C-0\"><blockquote>\n<p>作者认为，这起案件将检验联邦在核问题上的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n</blockquote>\n</section>"},{"title":"C. the federal authority over nuclear issues","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为，这起案件将检验联邦在核问题上的权力。\n\n第五段开头写公司声称`only the federal government has regulatory power`，这是Entergy用来挑战州规则的说法，要与后面的法律判断分开。\n\n下一句先交代最高法院已认定`states do have some regulatory authority`，再说案件会检验`how far those powers extend`。`those powers`承接的是州拥有的那部分监管权，不是前一处公司主张的联邦专属权。\n\n案件当然涉及州与联邦的关系，但选项仍要准确指出本句正在界定谁的权限。C只抓到前面出现的联邦政府，没有保留这一代词的实际回指，D才对应州权的界限。","section":"第三鸟 : whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> 公司现在声称2002年的协议因2006年的立法而无效，并声称只有联邦政府对核问题有监管权。案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。\n\n作者先转述公司否认州权的说法，继而用最高法院承认州有一定权限作限定，最后提出尚待确定的是这部分州权有多大。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The case will determine how far federal authority over nuclear matters extends.\n>\n> 这起案件将确定联邦在核事务上的权力延伸到哪里。\n\nC需要`those powers`指向联邦权限。实际离它最近并被明确承认的先行内容是州的一定监管权；争议涉及联邦，并不意味着句子所检验的主体就能替换。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-C-0\"><blockquote>\n<p>作者认为，这起案件将检验联邦在核问题上的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验联邦在核问题上的权力。</p>\n</blockquote>\n<p>第五段开头写公司声称<code>only the federal government has regulatory power</code>，这是Ent wer</code>对应州的一定监管权，<code>limits</code>改写<code>how far ... extend</code>，两部分共同保留了法律问题的主体和范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验各州在核问题上的权力界限。</p>\n</blockquote>\n<p>先把长句拆开：最高法院已认定各州<code>do have some regulatory authority over nuclear power</code>，也就是说州并非一点权力都没有。</p>\n<p>接下来法律学者说，这起案件将成为先例性检验，具体检验<code>how far those powers extend</code>。<code>those powers</code>回指上述州权，<code>how far</code>问它能延伸到多大范围。</p>\n<p>D的<code>the limits of states’ power over nuclear issues</code>把这两部分合起来：核问题上州权的界限。它既没有说州可以无限监管，也没有采用公司“只有联邦有权”的主张，而是保留已经有部分州权、具体边界仍需确定的关系。</p>\n</section>"},{"title":"D. the limits of states’ power over nuclear issues","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend\n>\n> 案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。\n\n段落由已确定的部分州权进入尚未确定的权限范围。案件的重要性就在于可能为这个边界提供先例，而非重新宣称州毫无权限。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> States possess some authority over nuclear power, and this case will clarify the limits of that authority.\n>\n> 各州对核电拥有一定权限，这起案件将澄清这些权限的界限。\n\nD与原句的先承认、再界定完全相接。前一句给权力主体，后一句给待解决的问题，选项把两者压缩成同一法律范围判断。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-D-0\"><blockquote>\n<p>作者认为，这起案件将检验各州在核问题上的权力界限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>states’ power</code>对应州的一定监管权，<code>limits</code>改写<code>how far ... extend</code>，两部分共同保留了法律问题的主体和范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验各州在核问题上的权力界限。</p>\n</blockquote>\n<p>先把长句拆开：最高法院已认定各州<code>do have some regulatory authority over nuclear power</code>，也就是说州并非一点权力都没有。</p>\n<p>接下来法律学者说，这起案件将成为先例性检验，具体检验<code>how far those powers extend</code>。<code>those powers</code>回指上述州权，<code>how far</code>问它能延伸到多大范围。</p>\n<p>D的<code>the limits of states’ power over nuclear issues</code>把这两部分合起来：核问题上州权的界限。它既没有说州可以无限监管，也没有采用公司“只有联邦有权”的主张，而是保留已经有部分州权、具体边界仍需确定的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。</p>\n</blockquote>\n<p>段落由已确定的部分州权进入尚未确定的权限范围。案件的重要性就在于可能为这个边界提供先例，而非重新宣称州毫无权限。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>States possess some authority over nuclear power, and this case will clarify the limits of that authority.</p>\n<p>各州对核电拥有一定权限，这起案件将澄清这些权限的界限。</p>\n</blockquote>\n<p>D与原句的先承认、再界定完全相接。前一句给权力主体，后一句给待解决的问题，选项把两者压缩成同一法律范围判断。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"29题结论","raw":"### 29题结论\n\n> **29. D**\n\n- A：公司失信引出了法律争议，但test of后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。\n- B：作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。\n- C：只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。\n- D：states’ power对应州的一定监管权，limits改写how far ... extend，两部分共同保留了法律问题的主体和范围。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"29","questionConclusion":true},"html":"<blockquote>\n<p><strong>29. D</strong></p>\n</blockquote>\n<ul>\n<li>A：公司失信引出了法律争议，但test of后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。</li>\n<li>B：作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。</li>\n<li>C：只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。</li>\n<li>D：states’ power对应州的一定监管权，limits改写how far ... extend，两部分共同保留了法律问题的主体和范围。</li>\n</ul>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n> It can be inferred from the last paragraph that ______.\n>\n> 从末段可以推知什么？\n\n### 题型\n\n局部推断题。末段从Vermont的信用问题转向其他电站及续期申请，追踪这种转向带来的后果。\n\nNRC得到的是审查提醒，文章没有宣布撤回、驳回或停业。推断要保留可能性，不能替监管者或公司作出决定。\n\n### 核心出处\n\n> Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years\n>\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"30","questionIntro":true},"html":"<blockquote>\n<p>It can be inferred from the last paragraph that ______.</p>\n<p>从末段可以推知什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部推断题。末段从Vermont的信用问题转向其他电站及续期申请，追踪这种转向带来的后果。</p>\n<p>NRC得到的是审查提醒，文章没有宣布撤回、驳回或停业。推断要保留可能性，不能替监管者或公司作出决定。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n"},{"title":"A. Entergy’s business elsewhere might be affected","raw":"### A. Entergy’s business elsewhere might be affected\n\n> 末段暗示，Entergy在其他地方的业务可能受到影响。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。\n\n**出处：**\n\n> Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years\n>\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-30-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>末段暗示，Entergy在其他地方的业务可能受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n</section>"},{"title":"A. Entergy’s business elsewhere might be affected","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 末段暗示，Entergy在其他地方的业务可能受到影响。\n\n末段先说公司在Vermont声誉受损，接着用`But there should be consequences`指出不应让它在失信后毫无后果。\n\n为什么随后列`11 other reactors`并点名Plymouth的Pilgrim电站？因为公司正在承诺安全运营，并申请再开20年。作者紧接着要求NRC在审查时记住`what promises from Entergy are worth`，将这次守约记录带入另一处续期审查。\n\nA的`business elsewhere might be affected`保留了这种可能后果。它没有说所有电站都会关闭，也没有说申请已被驳回；只说其他地方的业务可能因信用问题受到影响，范围与程度都合适。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-30-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>末段暗示，Entergy在其他地方的业务可能受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，Entergy在其他地方的业务可能受到影响。</p>\n</blockquote>\n<p>末段先说公司在Vermont声誉受损，接着用<code>But there should be consequences</code>指出不应让它在失信后毫无后果。</p>\n<p>为什么随后列<code>11 other reactors</code>并点名Plymouth的Pilgrim电站？因为公司正在承诺安全运营，并申请再开20年。作者紧接着要求NRC在审查时记住<code>what promises from Entergy are worth</code>，将这次守约记录带入另一处续期审查。</p>\n<p>A的<code>business elsewhere might be affected</code>保留了这种可能后果。它没有说所有电站都会关闭，也没有说申请已被驳回；只说其他地方的业务可能因信用问题受到影响，范围与程度都合适。</p>\n</section>"},{"title":"A. Entergy’s business elsewhere might be affected","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years\n>\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.\n>\n> Entergy在美国还运营其他11座反应堆，其中包括Plymouth的Pilgrim核电站。公司承诺安全运营Pilgrim，并已申请联邦许可，想让它再运行20年。但NRC审查公司申请时，应记住Entergy的承诺究竟有多少可信度。\n\n末段没有停在Vermont的声誉上，而是依次写其他反应堆、另一座电站的申请、审查者应警惕承诺。信用问题通过续期审批连到别处业务。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Entergy’s record in Vermont may affect the way regulators assess its applications elsewhere.\n>\n> Entergy在Vermont的记录，可能影响监管者怎样审查它在其他地方的申请。\n\nA所需的地域延伸由其他反应堆和Pilgrim的例子给出，可能影响由审查提醒给出。作者未宣布审批结局，因此选项的`might`没有把推断说过头。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>末段暗示，Entergy在其他地方的业务可能受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。</p>\n<p><strong>
