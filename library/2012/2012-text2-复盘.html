不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>26题</h2>\n<blockquote>\n<p>The phrase “reneging on” (Line 3, Para. 1) is closest in meaning to ______.</p>\n<p>第一段reneging on最接近哪个意思？</p>\n</blockquote>\n<h3>题型</h3>\n<p>词义题。把短语放回commitment之前，再用下一段的实际行动检验含义。</p>\n<p>不能只凭outrage一类情绪词挑负面选项，关键是has done与promised it would not之间的相反关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n<h3>A. condemning</h3>\n<blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>condemning</code>是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p>把短语放回<code>a longstanding commitment to abide by ...</code>前面，先确定它所作用的对象是一项长期承诺：遵守州的严格核监管规定。</p>\n<p>第二段用<code>Instead</code>解释公司实际做了什么，<code>has done precisely what it had long promised it would not</code>是“恰恰做了长期以来承诺不会做的事”，随后冒号点出行动——向联邦法院挑战州规则的合宪性。</p>\n<p><code>condemning</code>只表示谴责，可以用语言批评一个承诺，却没有表达行动违反承诺。这里的同义词必须保留承诺与实际行动相反的关系，A做不到。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>作为新英格兰一家主要能源供应商，公司宣布不履行遵守州严格核监管规定的长期承诺，在Vermont激起了有理由的愤怒。公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>第一段点出对承诺的态度发生变化，第二段没有列公司怎样批评承诺，而是用已经进行的法律挑战来具体解释这种变化。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company publicly condemned its commitment, describing it as unreasonable.</p>\n<p>公司公开谴责这项承诺，称它不合理。</p>\n</blockquote>\n<p>A需要负面评价的言辞；实际段落以<code>has done</code>展示违背承诺的行动。它不是没有发表过不满便绝不能诉讼，而是被考短语在这里要解释已经发生的失约。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. reaffirming</h3>\n<blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><code>reaffirming</code>是再次肯定，接<code>commitment</code>就是重申自己仍会遵守原来的约定。这样代回首段，承诺应当得到继续确认。</p>\n<p>第二段的<code>Instead</code>接出相反事实：公司已经做了自己长期承诺不会做的事。<code>promised it would not</code>与<code>has done</code>指向同一项法律挑战，一个是否定的承诺，一个是已经发生的行动。</p>\n<p>因此上下文不是再次确认遵守州规定，而是以行动否定这项约定。即使公司仍可能在其他场合许下安全承诺，也不能用后文别的承诺改变本句的动作方向。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>作者先说公司在承诺问题上引起愤怒，再用<code>Instead</code>展开它怎样挑战州规则。后段为前面的失约提供实例，语气也继续谴责这一举动。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company reaffirmed that it would continue to abide by Vermont’s nuclear regulations.</p>\n<p>公司重申会继续遵守Vermont的核监管规定。</p>\n</blockquote>\n<p>B要求后面继续确认守约，实际后文却列出曾承诺不做而如今已做的行为。重申与违背在这项约定上方向相反。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. dishonoring</h3>\n<blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>dishonoring a commitment</code>是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><code>dishonoring</code>接承诺时，意思是不遵守、不履行。原句的承诺内容是<code>abide by the state’s strict nuclear regulations</code>，即遵守州的核监管规定。</p>\n<p>第二段把不履行的事实补全：公司以前承诺不会采取的行动，现在<code>has done precisely</code>，即已经恰恰做了。冒号后的挑战州规则合宪性，让我们看见承诺具体如何被违反。</p>\n<p>所以这不是只靠首段的愤怒猜一个负面词，而是由后段行为与前段约定的对照确定含义。C保留的是失信这一关系，与<code>reneging on</code>在这里的用法一致。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>被考短语后先给承诺内容，下一段再从承诺转到实际行动，并明确把两者放成相反关系。这是用后面的事实解释前面的概括。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company broke its commitment by taking the legal action it had promised not to take.</p>\n<p>公司采取了先前承诺不会采取的法律行动，违背了自己的承诺。</p>\n</blockquote>\n<p>C所需的不履行有明确行为支撑。后面的法院挑战不是新加的猜测，而是冒号直接写出的事例，因此能回到首段解释这个短语。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. securing</h3>\n<blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>securing</code>通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p>D的<code>securing</code>若与<code>commitment</code>连用，方向是取得、确保或巩固承诺，至少不会把承诺与行为读成已经背离。</p>\n<p>原文对现状的解释是<code>done precisely what ... promised ... not</code>。先前答应遵守的州规则，现在被公司拿到联邦法院挑战，作者正以这项行动说明旧约定没有被履行。</p>\n<p>公司想保住核电站继续运营，是另一个目的；不能因为它想“保障运营”，就让被考短语也变成“保障承诺”。短语的宾语是<code>commitment</code>，不是电站运营。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>公司宣布不履行遵守州严格核监管规定的长期承诺。公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>第二段说公司为了让核电站继续运行而发起挑战。这解释了它的行为目的，却同时显示它与先前的守约承诺相背。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company took steps to ensure that its commitment to obey the state’s rules would be upheld.</p>\n<p>公司采取措施，确保其遵守州规则的承诺得到履行。</p>\n</blockquote>\n<p>D需要巩固或确保守约的行动。实际公司采取的是先前承诺不会采取的挑战，把保住运营的目的移到承诺上，会混淆两个不同对象。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>26题结论</h3>\n<blockquote>\n<p><strong>26. C</strong></p>\n</blockquote>\n<ul>\n<li>A：condemning是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。</li>\n<li>B：重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。</li>\n<li>C：dishonoring a commitment是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。</li>\n<li>D：securing通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。</li>\n</ul>\n<h2>27题</h2>\n<blockquote>\n<p>By entering into the 2002 agreement, Entergy intended to ______.</p>\n<p>Entergy签订2002年协议时，是为了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>目的细节题。题干限定2002年的协议，重点拆清眼前取得什么批准、为此接受什么未来条件。</p>\n<p>As a condition of receiving state approval for the sale限定交易目的，后面的seek permission说将来再运营时须履行的程序。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n</blockquote>\n<h3>A. obtain protection from Vermont regulators</h3>\n<blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p>第三段先交代公司在2002年购买核电站，随后<code>As a condition of receiving state approval for the sale</code>说明获准交易必须接受的条件。</p>\n<p><code>approval for the sale</code>是对买卖行为的许可；<code>the company agreed to seek permission ... past 2012</code>才是公司为此答应以后履行的程序。州在这里是在批准交易并保留未来监管权限。</p>\n<p>A的<code>protection from Vermont regulators</code>要求监管者保护公司，原文没有说明保护它免受哪种风险或责任。获得监管批准与得到监管者庇护不能互换，真正的目的已经被<code>for the sale</code>限定。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。</p>\n</blockquote>\n<p>作者把购厂时间与协议条件紧接在一起，先说完成交易，再说明为获得州批准，公司接受了将来继续运营须另行申请的约定。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy accepted the agreement in order to obtain protection from Vermont’s regulators.</p>\n<p>Entergy接受协议，是为了获得Vermont监管者的保护。</p>\n</blockquote>\n<p>A需要协议给公司带来保护。实际约定给公司增加了将来申请许可的义务，换取的是眼前购厂交易的批准，没有建立保护关系。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. seek favor from the federal legislature</h3>\n<blockquote>\n<p>Entergy签订2002年协议，是为了争取联邦立法机关的好感。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了争取联邦立法机关的好感。</p>\n</blockquote>\n<p>先看层级：原文说<code>state approval</code>和<code>state regulators</code>，都是州这一层面的许可和监管。2006年后来加入的也是<code>Vermont legislature</code>，仍是州立法机关。</p>\n<p>B写<code>federal legislature</code>，把机构改成联邦立法机关；<code>seek favor</code>又把动作从获得一项具体交易许可，改成争取支持或好感。</p>\n<p>后文出现联邦法院，是公司后来挑战州规则的地点，不属于2002年购厂协议的目的。题目有明确时间，不能把其他年份出现的联邦机构搬过来，也不能把法院改成立法机关。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n<p>为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。2006年，州又进一步要求，电站许可的任何延期都须经Vermont州议会批准。</p>\n</blockquote>\n<p>第三段按2002年购厂、接受条件、2006年追加审批要求的时间顺序展开，涉及的始终是州在交易和运营中的权限。联邦法律争议到后面才出现。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy entered the agreement to win support from the federal legislature.</p>\n<p>Entergy签订协议，是为了争取联邦立法机关的支持。</p>\n</blockquote>\n<p>B需要2002年签约与联邦立法机关支持之间的联系。实际句子把这项协议直接放在州批准购厂的条件中，机构和目的都不同。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. acquire an extension of its business license</h3>\n<blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了延长营业许可。</p>\n</blockquote>\n<p>原句要按条件关系读：为了取得<code>approval for the sale</code>，公司<code>agreed to seek permission ... to operate past 2012</code>。前者是当时希望获得的交易批准，后者是为此接受的未来程序。</p>\n<p><code>seek permission</code>并不等于已经取得许可；同意以后申请，也不等于在2002年通过这份协议直接延长了运营权。2006年的<code>any extension ... be subject to ... approval</code>又说明延期还需要州议会同意。</p>\n<p>C把协议中将来要审查的事项当成这次签约立即要取得的许可，忽略了“购厂批准以接受未来监管为条件”的关系。D更准确对应<code>for the sale</code>。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n<p>为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。2006年，州又进一步要求，电站许可的任何延期都须经Vermont州议会批准。</p>\n</blockquote>\n<p>作者先写购厂，再解释公司为了获得交易批准接受哪些后续条件；随后才交代2006年针对延期增加的审批要求。交易与延期在叙述中是两件事。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy entered the 2002 agreement in order to obtain an extension of its operating licence.</p>\n<p>Entergy签订2002年协议，是为了取得运营许可的延期。</p>\n</blockquote>\n<p>C需要把这次签约所求的批准明确落在运营延期上。实际<code>approval for the sale</code>指眼前的购厂交易，未来延期则是仍须另行申请的事项。公司当然希望今后继续运营，但不能用这个较远的愿望替换本句直接给出的签约目的。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. get permission to purchase a power plant</h3>\n<blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>get permission</code>改写<code>receiving state approval</code>，购买核电站承接前句<code>bought</code>与本句<code>the sale</code>，目的和条件都能连起来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了获准购买核电站。</p>\n</blockquote>\n<p>第三段先说<code>when the corporation bought ... nuclear power plant</code>，点出2002年的交易。下一句中的<code>the sale</code>就是这一交易，不是出售别的业务。</p>\n<p><code>As a condition of receiving state approval for the sale</code>说明公司想取得州对这次交易的批准，必须答应将来在2012年后继续运营前向州申请许可。D的<code>permission to purchase a power plant</code>正好概括前半句的目的。</p>\n<p>购买与出售只是同一交易的不同视角：对公司是购厂，对这笔买卖本身是<code>the sale</code>。D没有把后面将来申请运营许可的条件，误作现在已经取得的延期结果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>2002年，公司购买了Vermont唯一的核电站，那是Vernon一座已老化的反应堆。为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。</p>\n</blockquote>\n<p>作者用购厂事实引出协议，再说明同意未来申请许可是州批准这次买卖的条件。两句话共同解释2002年为什么签下约定。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>To obtain state permission to buy the plant, Entergy agreed to seek approval before operating it past 2012.</p>\n<p>为取得州对购厂的许可，Entergy同意在2012年后继续运营之前另行申请批准。</p>\n</blockquote>\n<p>D所需的购厂目的由<code>approval for the sale</code>直接支持，后半句的未来义务又说明公司用什么条件换取许可，整条关系完整。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>27题结论</h3>\n<blockquote>\n<p><strong>27. D</strong></p>\n</blockquote>\n<ul>\n<li>A：原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。</li>\n<li>B：2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。</li>\n<li>C：2012年之后继续运营确实在协议中出现，但它是公司答应将来另行申请的事项。眼前签约换取的是购厂获批，不是已经获准延长运营。</li>\n<li>D：get permission改写receiving state approval，购买核电站承接前句bought与本句the sale，目的和条件都能连起来。</li>\n</ul>\n<h2>28题</h2>\n<blockquote>\n<p>According to Paragraph 4, Entergy seems to have problems with its ______.</p>\n<p>第四段显示，Entergy似乎在哪方面有问题？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落理解题。题干限定第四段，核对raised serious questions后面直接列出的评价对象。</p>\n<p>段首Either ... or ...只是两种可能解释；事故、误导性声明与议会反应才是随后具体展开的事实。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n</blockquote>\n<h3>A. managerial practices</h3>\n<blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与<code>Entergy’s management</code>对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy的管理做法存在问题。</p>\n</blockquote>\n<p>核心句用<code>both ... and ...</code>并列两个被质疑对象：<code>Vermont Yankee’s safety</code>是电站安全，<code>Entergy’s management</code>是公司的管理。题干问Entergy哪方面有问题，后者直接对应A的<code>managerial practices</code>。</p>\n<p>事故名单说明管理为何受到关注，而破折号后的<code>especially after ... misleading statements</code>进一步点出公司如何回应管道问题。这里不只是发生了技术故障，还涉及公司是否如实交代情况。</p>\n<p>后面的州议会对公司行为愤怒、否决延期，是这类行为带来的后果。A概括的不是凭空推测的经营能力，而是事故处理与说明行为中被明确质疑的管理做法。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。</p>\n</blockquote>\n<p>作者先列事故，再明确说它们使安全和管理受到质疑，随后突出误导性声明，最后写州议会的反应。评价有事实和处理行为两层依据。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The accidents and the company’s misleading statements cast doubt on how Entergy manages the plant.</p>\n<p>事故和公司的误导性声明，使人们怀疑Entergy管理电站的方式。</p>\n</blockquote>\n<p>A所需的管理问题已经被<code>management</code>点名，并由后续声明和议会反应继续展开，不依赖把段首某一种可能猜测当成定论。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. technical innovativeness</h3>\n<blockquote>\n<p>第四段显示，Entergy的技术创新能力存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>设备事故涉及运行安全，却没有比较新技术研发或创新能力。B把管理与安全方面的事实转成了技术创新评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy的技术创新能力存在问题。</p>\n</blockquote>\n<p>B的<code>technical innovativeness</code>是技术创新能力，不等于设备有没有发生故障。第四段列冷却塔部分倒塌与地下管道泄漏，用来解释为什么安全和管理受到质疑。</p>\n<p>接下来的<code>misleading statements about the pipe</code>更具体地落到公司怎样说明管道情况。它反映的是管理和信息披露，不是研发出新技术的能力。</p>\n<p>老设备、事故和创新不足在现实中可能有关联，但文章没有在此建立这种因果。要得到B，还得另有技术开发、改良或创新比较的材料，原段没有给出。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。</p>\n</blockquote>\n<p>事故之后，作者跟进公司关于管道的误导性说法与州议会的愤怒，始终追究运营与管理行为，没有展开研发水平。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy’s inability to develop or adopt new technology has exposed weaknesses in its technical innovation.</p>\n<p>Entergy开发或采用新技术的能力不足，暴露了其技术创新方面的弱点。</p>\n</blockquote>\n<p>B需要把问题落到新技术能力。实际后文落到如实说明与监管反应，不能因为事故涉及设备，就把所有技术相关评价都放进来。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. financial goals</h3>\n<blockquote>\n<p>第四段显示，Entergy的财务目标存在问题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段的因果是事故和误导性声明引发管理质疑及议会反对，未讨论利润、收入或成本目标是否合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy的财务目标存在问题。</p>\n</blockquote>\n<p><code>financial goals</code>指公司希望实现的财务目标。第四段虽然有事故和延期被否决，这些事情可能影响公司收入，却没有把任何利润、成本或投资目标拿来评价。</p>\n<p>句子直接写出的质疑对象是<code>both ... safety and ... management</code>。尤其是<code>misleading statements</code>，说明公司对管道情况的表述让管理问题更加突出。</p>\n<p>随后议会愤怒并反对延期，是对公司行为的反应。不能从这一后果自行补出公司的财务计划不合理，更不能把“可能有财务后果”换成“原来的财务目标有问题”。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension</p>\n<p>一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。州参议院被公司的行为激怒，以26票对4票反对允许延期。</p>\n</blockquote>\n<p>作者围绕事故、公司说明、议会投票三个环节推进，结尾的否决延续了对公司行为的不满，没有转入经营目标的计算。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy’s financial targets have proved unrealistic or inappropriate.</p>\n<p>Entergy的财务目标被证明不切实际或不恰当。</p>\n</blockquote>\n<p>C需要文章呈现财务目标及其问题。实际提供的都是安全与管理的证据，续期可能受影响并不能反推某个未出现的财务目标出了错。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. business vision</h3>\n<blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>didn’t foresee</code>在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第四段显示，Entergy缺乏商业远见。</p>\n</blockquote>\n<p>段首是<code>Either ... or ...</code>：要么公司从未真心打算遵守承诺，要么它没有预见后来会发生什么。两种可能并列，作者没有在这一句中确定是后一种。</p>\n<p>D的<code>business vision</code>容易与<code>didn’t foresee</code>联系，但它需要把公司的商业远见作为已经得到支持的问题。原文随后实际展开的是事故、安全、管理和误导性声明，直接说<code>raised serious questions about ... Entergy’s management</code>。</p>\n<p>因此这里不能只截下<code>didn’t foresee</code>，删除前面的另一种解释和后面的明确评价。缺乏远见或许是一种解释，A所说的管理做法则有本段具体事实和原词共同支持。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next</p>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe</p>\n<p>Entergy要么从未真心打算履行这些承诺，要么没有预见后来会发生什么。一连串事故，包括2007年冷却塔部分倒塌和地下管道系统泄漏，使Vermont Yankee的安全及Entergy的管理都受到严重质疑，尤其是在公司对管道作出误导性声明之后。</p>\n</blockquote>\n<p>作者以两种可能开头，并没有选择其中一种继续证明；接下来用事故与失实说明具体论证管理为何令人担忧。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy’s poor business foresight left it unprepared for developments that followed.</p>\n<p>Entergy商业远见不足，因而没有为后来的变化做好准备。</p>\n</blockquote>\n<p>D需要把缺乏远见确立为原因。实际开头还保留根本无意守约这一可能，后文的明确落点又是管理行为，不能将未定的解释当成已经坐实的结论。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>28题结论</h3>\n<blockquote>\n<p><strong>28. A</strong></p>\n</blockquote>\n<ul>\n<li>A：事故后对安全和管理的质疑、关于管道的误导性声明都直接指向公司的管理行为，A与Entergy’s management对应。</li>\n<li>B：设备事故涉及运行安全，却没有比较新技术研发或创新能力。B把管理与安全方面的事实转成了技术创新评价。</li>\n<li>C：原段的因果是事故和误导性声明引发管理质疑及议会反对，未讨论利润、收入或成本目标是否合理。</li>\n<li>D：didn’t foresee在段首只是两种可能解释中的一种。A有后面管理问题的直接依据，D却把一个未确定的可能解释提升成商业远见的结论。</li>\n</ul>\n<h2>29题</h2>\n<blockquote>\n<p>In the author’s view, the Vermont case will test ______.</p>\n<p>作者认为，Vermont案件将检验什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题。题干问案件检验什么，定位test of之后的how far those powers extend。</p>\n<p>先找到those powers的先行内容，再将案件的法律问题与公司失信的起因、规则分散的顾虑分开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n</blockquote>\n<h3>A. Entergy’s capacity to fulfill all its promises</h3>\n<blockquote>\n<p>作者认为，这起案件将检验Entergy履行全部承诺的能力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>公司失信引出了法律争议，但<code>test of</code>后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验Entergy履行全部承诺的能力。</p>\n</blockquote>\n<p><code>test of how far those powers extend</code>先把案件的检验对象说清楚了。<code>those powers</code>回指前面州对核电拥有的一定监管权，问题是权力边界在哪里。</p>\n<p>A却说<code>Entergy’s capacity to fulfill all its promises</code>，既换成公司的履约能力，又加上全部承诺。文章批评公司没有守约，不等于法院正在检验它能不能履行所有约定。</p>\n<p>末尾<code>had Entergy kept its word, that debate would be beside the point</code>解释争论为何在这里发生：若公司守约，就无需进行这场辩论。它不改变前面已点明的法律检验对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n<p>案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。但若Entergy遵守承诺，这场辩论便无关紧要。</p>\n</blockquote>\n<p>作者先承认州有一定监管权，再引出案件将界定权力范围，最后补一句守约本可使这场争论没有必要。法律问题与失信起因在段内分别承担不同作用。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The case will determine whether Entergy is capable of carrying out all its promises.</p>\n<p>这起案件将确定Entergy是否有能力履行全部承诺。</p>\n</blockquote>\n<p>A需要法院判断公司的履约能力。实际<code>how far</code>讨论州权能伸到哪里；守约本可避免争议，并不把争议改成了能力测试。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. the nature of states’ patchwork regulations</h3>\n<blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验各州零散监管规则的性质。</p>\n</blockquote>\n<p>原文先给<code>test of how far those powers extend</code>，说案件要界定州监管权的延伸范围。接着<code>Certainly</code>承认另一个值得考虑的问题：如果每个州都设自己的规则，可能形成<code>patchwork regulations</code>。</p>\n<p><code>could result if</code>说明这种零散状态是一个有条件的可能后果，作者承认对它的担忧有道理。B却把这项担忧变成案件本身要检验的<code>nature</code>。</p>\n<p>讨论州权边界时可以考虑规则分散的影响，但考虑一个后果与把它指定为检验对象不同。D能直接对上<code>how far</code>，B则取了旁边的相关顾虑来回答。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules</p>\n<p>案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。当然，如果每个州都自行设定规则，可能形成零散监管，对此担忧是有道理的。</p>\n</blockquote>\n<p>案件的法律问题先被明确提出，随后作者让步承认监管规则可能分散的担忧，再回到公司本应守约这一批评。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The case will examine the character of the different regulatory systems created by the states.</p>\n<p>这起案件将考察各州制定的不同监管体系具有怎样的性质。</p>\n</blockquote>\n<p>B需要讨论重心落到这些规则的性质上。实际<code>Certainly</code>只补入一项顾虑，前面已确定的检验仍是州有权监管到什么程度，不能拿让步部分换掉它。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. the federal authority over nuclear issues</h3>\n<blockquote>\n<p>作者认为，这起案件将检验联邦在核问题上的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验联邦在核问题上的权力。</p>\n</blockquote>\n<p>第五段开头写公司声称<code>only the federal government has regulatory power</code>，这是Entergy用来挑战州规则的说法，要与后面的法律判断分开。</p>\n<p>下一句先交代最高法院已认定<code>states do have some regulatory authority</code>，再说案件会检验<code>how far those powers extend</code>。<code>those powers</code>承接的是州拥有的那部分监管权，不是前一处公司主张的联邦专属权。</p>\n<p>案件当然涉及州与联邦的关系，但选项仍要准确指出本句正在界定谁的权限。C只抓到前面出现的联邦政府，没有保留这一代词的实际回指，D才对应州权的界限。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>公司现在声称2002年的协议因2006年的立法而无效，并声称只有联邦政府对核问题有监管权。案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。</p>\n</blockquote>\n<p>作者先转述公司否认州权的说法，继而用最高法院承认州有一定权限作限定，最后提出尚待确定的是这部分州权有多大。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The case will determine how far federal authority over nuclear matters extends.</p>\n<p>这起案件将确定联邦在核事务上的权力延伸到哪里。</p>\n</blockquote>\n<p>C需要<code>those powers</code>指向联邦权限。实际离它最近并被明确承认的先行内容是州的一定监管权；争议涉及联邦，并不意味着句子所检验的主体就能替换。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. the limits of states’ power over nuclear issues</h3>\n<blockquote>\n<p>作者认为，这起案件将检验各州在核问题上的权力界限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>states’ power</code>对应州的一定监管权，<code>limits</code>改写<code>how far ... extend</code>，两部分共同保留了法律问题的主体和范围。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，这起案件将检验各州在核问题上的权力界限。</p>\n</blockquote>\n<p>先把长句拆开：最高法院已认定各州<code>do have some regulatory authority over nuclear power</code>，也就是说州并非一点权力都没有。</p>\n<p>接下来法律学者说，这起案件将成为先例性检验，具体检验<code>how far those powers extend</code>。<code>those powers</code>回指上述州权，<code>how far</code>问它能延伸到多大范围。</p>\n<p>D的<code>the limits of states’ power over nuclear issues</code>把这两部分合起来：核问题上州权的界限。它既没有说州可以无限监管，也没有采用公司“只有联邦有权”的主张，而是保留已经有部分州权、具体边界仍需确定的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend</p>\n<p>案件的法律问题并不清楚：最高法院已认定各州对核电确有一定监管权限，而法律学者认为，此案将对这些权限能延伸多远作出具有先例意义的检验。</p>\n</blockquote>\n<p>段落由已确定的部分州权进入尚未确定的权限范围。案件的重要性就在于可能为这个边界提供先例，而非重新宣称州毫无权限。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>States possess some authority over nuclear power, and this case will clarify the limits of that authority.</p>\n<p>各州对核电拥有一定权限，这起案件将澄清这些权限的界限。</p>\n</blockquote>\n<p>D与原句的先承认、再界定完全相接。前一句给权力主体，后一句给待解决的问题，选项把两者压缩成同一法律范围判断。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>29题结论</h3>\n<blockquote>\n<p><strong>29. D</strong></p>\n</blockquote>\n<ul>\n<li>A：公司失信引出了法律争议，但test of后面直接接州监管权能延伸多远。A把争议的起因换成法院要界定的对象。</li>\n<li>B：作者承认各州自设规则可能形成零散监管，但这是随后提出的担忧。案件明确检验的仍是州权的范围，不是规则拼凑状态的性质。</li>\n<li>C：只有联邦有监管权是公司的主张；法律学者所说的检验对象则是州已被承认的部分权力能延伸多远，C换了主体。</li>\n<li>D：states’ power对应州的一定监管权，limits改写how far ... extend，两部分共同保留了法律问题的主体和范围。</li>\n</ul>\n<h2>30题</h2>\n<blockquote>\n<p>It can be inferred from the last paragraph that ______.</p>\n<p>从末段可以推知什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部推断题。末段从Vermont的信用问题转向其他电站及续期申请，追踪这种转向带来的后果。</p>\n<p>NRC得到的是审查提醒，文章没有宣布撤回、驳回或停业。推断要保留可能性，不能替监管者或公司作出决定。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<h3>A. Entergy’s business elsewhere might be affected</h3>\n<blockquote>\n<p>末段暗示，Entergy在其他地方的业务可能受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，Entergy在其他地方的业务可能受到影响。</p>\n</blockquote>\n<p>末段先说公司在Vermont声誉受损，接着用<code>But there should be consequences</code>指出不应让它在失信后毫无后果。</p>\n<p>为什么随后列<code>11 other reactors</code>并点名Plymouth的Pilgrim电站？因为公司正在承诺安全运营，并申请再开20年。作者紧接着要求NRC在审查时记住<code>what promises from Entergy are worth</code>，将这次守约记录带入另一处续期审查。</p>\n<p>A的<code>business elsewhere might be affected</code>保留了这种可能后果。它没有说所有电站都会关闭，也没有说申请已被驳回；只说其他地方的业务可能因信用问题受到影响，范围与程度都合适。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n<p>Entergy在美国还运营其他11座反应堆，其中包括Plymouth的Pilgrim核电站。公司承诺安全运营Pilgrim，并已申请联邦许可，想让它再运行20年。但NRC审查公司申请时，应记住Entergy的承诺究竟有多少可信度。</p>\n</blockquote>\n<p>末段没有停在Vermont的声誉上，而是依次写其他反应堆、另一座电站的申请、审查者应警惕承诺。信用问题通过续期审批连到别处业务。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy’s record in Vermont may affect the way regulators assess its applications elsewhere.</p>\n<p>Entergy在Vermont的记录，可能影响监管者怎样审查它在其他地方的申请。</p>\n</blockquote>\n<p>A所需的地域延伸由其他反应堆和Pilgrim的例子给出，可能影响由审查提醒给出。作者未宣布审批结局，因此选项的<code>might</code>没有把推断说过头。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. the authority of the NRC will be defied</h3>\n<blockquote>\n<p>末段暗示，NRC的权威将受到挑战。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公司挑战的是州规则，末段写它向联邦申请许可、NRC进行审查。B把对州的既有挑战转给了另一个机构，并把它说成将发生的事。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，NRC的权威将受到挑战。</p>\n</blockquote>\n<p>NRC在末段承担的动作是<code>reviews the company’s application</code>，即审查公司的续期申请；公司对应的动作则是<code>has applied for federal permission</code>，向联邦申请许可。</p>\n<p>B的<code>will be defied</code>需要公司或其他人挑战NRC权威。前文的诉讼确实在挑战州规则，但那是另一个权力主体，不能直接搬到这里。</p>\n<p>作者要求NRC记住公司承诺值多少，是建议审查者慎重，不是在预测NRC即将被抗拒。把提醒审查改成权威遭到挑战，同时改了行为和结果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n<p>Entergy在美国还运营其他11座反应堆，其中包括Plymouth的Pilgrim核电站。公司承诺安全运营Pilgrim，并已申请联邦许可，想让它再运行20年。但NRC审查公司申请时，应记住Entergy的承诺究竟有多少可信度。</p>\n</blockquote>\n<p>末段把NRC写成应认真审查的一方，把Entergy写成等待许可的一方。作者希望失信记录影响审查，而没有继续叙述公司向这个联邦机构发起抗争。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy will challenge the NRC’s authority to review or regulate its operations.</p>\n<p>Entergy将挑战NRC审查或监管其运营的权力。</p>\n</blockquote>\n<p>B需要针对NRC的新挑战。实际公司正在申请该层级的许可，段落重心是监管者应如何审慎判断，不能由先前对州规则的诉讼推出这里必然抗拒NRC。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Entergy will withdraw its Plymouth application</h3>\n<blockquote>\n<p>末段暗示，Entergy将撤回其Plymouth续期申请。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原段写申请已经提交、NRC正在审查，作者要求注意承诺的可信度。C额外指定公司会撤回申请，原文没有给出这一决定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，Entergy将撤回其Plymouth续期申请。</p>\n</blockquote>\n<p><code>has applied for federal permission</code>只说明公司已提出再运营20年的申请，后面的<code>as the NRC reviews</code>说明申请进入审查。</p>\n<p>作者的建议是审查时考虑Entergy承诺是否可信。这可能使其他业务受到影响，但影响的具体形式与最终结果都没有被定下来。</p>\n<p>C的<code>will withdraw</code>却让公司成为决定撤回的一方，并把未来行为说得确定。即使审查遇到困难，公司仍可能继续申请或采取其他行动；原文没有从信用担忧推到主动撤回的这一步。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years</p>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n<p>Entergy在美国还运营其他11座反应堆，其中包括Plymouth的Pilgrim核电站。公司承诺安全运营Pilgrim，并已申请联邦许可，想让它再运行20年。但NRC审查公司申请时，应记住Entergy的承诺究竟有多少可信度。</p>\n</blockquote>\n<p>作者用仍在进行的申请把讨论交给监管者，最后一句也是给监管者的审查提醒，没有补写公司如何应对或放弃申请。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy will withdraw its application to keep the Plymouth plant operating.</p>\n<p>Entergy将撤回让Plymouth电站继续运营的申请。</p>\n</blockquote>\n<p>C需要公司作出撤回决定。实际段落停在监管审查阶段，不能把审批可能受影响改成申请者一定退出。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Vermont’s reputation might be damaged</h3>\n<blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>its reputation in Vermont</code>中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p>原句主语是<code>The company</code>，随后<code>its reputation in Vermont</code>中的<code>its</code>继续回指公司；<code>in Vermont</code>说明公司在什么地方的声誉。</p>\n<p>D写<code>Vermont’s reputation</code>，却把声誉归给州本身。两个短语都出现Vermont，但一个是公司在某地的声誉，另一个是那个地方自身的声誉，所属关系不同。</p>\n<p>再看时间，原句说<code>already so damaged</code>，公司认为自己在当地声誉已经严重受损，因此觉得与州对抗也没什么可失去。D又改成州的声誉将来可能受损，主体与时间都对不上。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n<p>公司似乎认为，自己在Vermont的声誉已严重受损，因而与州对抗也没有什么可再失去的。</p>\n</blockquote>\n<p>首句解释公司为何觉得对抗州已无所损失，后面才指出这种想法不应让公司逃过后果。整段追究的是公司的信用，不是州的形象。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Vermont’s own reputation may suffer as a result of the dispute.</p>\n<p>这场争议可能使Vermont自身的声誉受损。</p>\n</blockquote>\n<p>D需要州成为受损主体。实际始终是<code>The company</code>与<code>its reputation</code>相接，州只是地点；后文要求公司在别处也面对信用后果，进一步确认了这一主体。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>30题结论</h3>\n<blockquote>\n<p><strong>30. A</strong></p>\n</blockquote>\n<ul>\n<li>A：作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。</li>\n<li>B：公司挑战的是州规则，末段写它向联邦申请许可、NRC进行审查。B把对州的既有挑战转给了另一个机构，并把它说成将发生的事。</li>\n<li>C：原段写申请已经提交、NRC正在审查，作者要求注意承诺的可信度。C额外指定公司会撤回申请，原文没有给出这一决定。</li>\n<li>D：its reputation in Vermont中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：Entergy违背承诺引发争议</strong>（段落1-2核心事件） Entergy违背长期承诺（不遵守佛蒙特州核能法规）→ 在联邦法院挑战佛蒙特州规则的合宪性（为保持核电站运行的绝望努力）</p>\n<p>↓（历史背景回顾）</p>\n<p><strong>逻辑层次2：冲突的历史脉络</strong>（段落3历史背景） 2002年：Entergy购买佛蒙特唯一核电站 → 条件：同意2012年后运营需州监管机构许可 + 2006年：州要求延期需议会批准 → Entergy当时都同意了</p>\n<p>↓（导致冲突升级的原因）</p>\n<p><strong>逻辑层次3：信任破裂的过程</strong>（段落4事故与后果） Entergy的问题：【要么从未打算遵守承诺 // 要么没预见到后果】→ 一连串事故：（2007年冷却塔倒塌 + 地下管道泄漏）+ 管理问题：（做出误导性声明）→ 结果：佛蒙特州参议院26:4反对延期</p>\n<p>→（当前法律争议）</p>\n<p><strong>逻辑层次4：法律争议的复杂性</strong>（段落5法律分析） Entergy的主张：（2002协议因2006立法而无效 + 只有联邦有核能监管权）→ 法律的模糊性：（最高法院承认州有一定监管权 // 但边界不清）→ 佛蒙特案将测试州权力边界 → 作者观点：如果Entergy信守承诺，这些争议本可避免</p>\n<p>↓（更广泛的影响）</p>\n<p><strong>逻辑层次5：对Entergy其他业务的潜在影响</strong>（段落6警示与后果） Entergy的态度：（在佛蒙特声誉已毁，无所顾忌）// 但应有后果：【核电站许可是公共信任 → Entergy在美国还运营11个反应堆（包括普利茅斯朝圣者核电站）→ 正申请延期20年】→ 警示：NRC审查时应考虑Entergy承诺的可信度</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：Entergy违背对佛蒙特州的承诺，挑战州监管权力，这不仅暴露了其管理和信誉问题，还可能影响其在其他州的核电站运营许可，因为核电站运营许可基于公共信任。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Distinguish the legal boundary from the broken promise</p>\n<p>B. Treat public permission as a continuing responsibility</p>\n<p>C. An assurance reversed by the company’s conduct</p>\n<p>D. The conditions accepted when the plant changed hands</p>\n<p>E. Why every state must abandon nuclear regulation</p>\n<p>F. Safety failures followed by a refusal to extend operation</p>\n<p>G. A confirmed decision to withdraw every application</p>\n<p><strong>41.</strong></p>\n<p>A deal is a deal – except, apparently, when Entergy is involved. The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was <u>reneging on</u> a longstanding commitment to abide by the state’s strict nuclear regulations. Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running. It’s a stunning move.</p>\n<p><strong>42.</strong></p>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012. In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval. Then, too, the company went along.</p>\n<p><strong>43.</strong></p>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next. A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe. Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n<p><strong>44.</strong></p>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend. Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules. But had Entergy kept its word, that debate would be beside the point.</p>\n<p><strong>45.</strong></p>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state. But there should be consequences. Permission to run a nuclear plant is a public trust. Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years. But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. An assurance reversed by the company’s conduct</p>\n<blockquote>\n<p>公司行动推翻了既有保证</p>\n</blockquote>\n<p>首段用A deal is a deal建立承诺的约束，随后说明公司宣布违背长期保证。第二段把具体行动补出来：此前答应不挑战州规则，现在却去联邦法院挑战。</p>\n<blockquote>\n<p>A deal is a deal – except, apparently, when Entergy is involved.</p>\n</blockquote>\n<p><code>A deal is a deal</code>先把约定应当履行当作共同前提，破折号后的<code>except</code>却把Entergy列作反常例外。后面要解释的是这家公司怎样背离了这个前提。</p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running.</p>\n</blockquote>\n<p><code>has done</code>与<code>promised ... would not</code>把同一行动放成相反关系，冒号具体写出公司向联邦法院挑战州规则。标题中的<code>reversed</code>因此有行动依据，不只是作者表达惊讶。</p>\n<blockquote>\n<p>It’s a stunning move.</p>\n</blockquote>\n<p><code>It</code>回指刚刚说明的法院挑战，<code>stunning</code>收束作者对这种反向行动的批评。结尾仍在评价公司的举动，并未要求各州退出核监管。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>约定应当履行 → Entergy却成为例外 → 法律挑战与原承诺相反 → 作者批评这一举动</p>\n</blockquote>\n<p>assurance对应longstanding commitment与promised，reversed对应实际行动与承诺相反，conduct指提起合宪性挑战。</p>\n<p>再看最强干扰项E：Why every state must abandon nuclear regulation。</p>\n<p>讨论公司违约不等于要求全部州退出监管，文章后面还承认州确有一定监管权。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. The conditions accepted when the plant changed hands</p>\n<blockquote>\n<p>电站交易时接受的条件</p>\n</blockquote>\n<p>时间线回到2002年买厂，并说明州批准交易的条件是延长运行要再求许可。2006年又增加州议会批准要求，公司仍然同意。</p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon.</p>\n</blockquote>\n<p><code>since 2002</code>把叙述带回购厂时点，<code>bought</code>说明电站易手。下一句的<code>As a condition</code>随即解释获准交易时公司接受了什么限制。</p>\n<blockquote>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval.</p>\n</blockquote>\n<p><code>a step further</code>表示2006年的要求是在既有条件上增加一层，新增的是延期须经州议会批准。它没有把购厂与延期并成同一次许可。</p>\n<blockquote>\n<p>Then, too, the company went along.</p>\n</blockquote>\n<p><code>Then, too</code>中的<code>too</code>回接公司此前已接受条件，说明追加要求时它同样同意。这样两次接受都留下明确记录，为后文的失约批评提供依据。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>回到购厂交易 → 获批以未来申请运营许可为条件 → 州追加议会审批要求 → 公司再次同意</p>\n</blockquote>\n<p>conditions对应两次监管要求，plant changed hands对应购入电站的交易背景；标题不把买厂许可与续期许可混同。</p>\n<p>再看最强干扰项G：A confirmed decision to withdraw every application。</p>\n<p>这里记录公司接受的条件，没有撤回任何申请的决定。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】F. Safety failures followed by a refusal to extend operation</p>\n<blockquote>\n<p>安全问题之后的续期拒绝</p>\n</blockquote>\n<p>先列公司无意履约或未预见后果的两种解释，再以事故和误导性说明展示实质问题。州参议院的反对票是对这些问题的回应。</p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next.</p>\n</blockquote>\n<p><code>Either ... or ...</code>先提出无意守约或未预见后果的两种可能，没有在这里确定是哪一种。接下来的事故与声明才是要展开的具体事实。</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe.</p>\n</blockquote>\n<p><code>both ... safety and ... management</code>明确列出质疑对象。冷却塔和管道事故涉及运行安全，<code>especially</code>之后的误导性声明又让公司的管理行为成为重点。</p>\n<blockquote>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n</blockquote>\n<p><code>Enraged by</code>说明州参议院投票与公司的行为相联系，<code>against allowing an extension</code>给出续期遭到反对的结果。标题中的<code>followed by a refusal</code>接住了事实到监管反应的推进。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>提出两种解释 → 列事故与误导性声明 → 安全和管理受到质疑 → 州议会反对续期</p>\n</blockquote>\n<p>safety failures对应冷却塔坍塌与管道泄漏，refusal to extend对应不允许延长运行的投票。</p>\n<p>再看最强干扰项D：The conditions accepted when the plant changed hands。</p>\n<p>D描述交易时接受的条件，不能概括后来事故为何激怒州方及续期为何被拒绝。</p>\n<p><strong>43题选F。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】A. Distinguish the legal boundary from the broken promise</p>\n<blockquote>\n<p>区分法律权限争议与失信行为</p>\n</blockquote>\n<p>先报告公司对协议效力和联邦专属监管的主张，再说明州权边界尚待检验。末尾承认规则拼凑的合理担忧，同时指出守约本可避免这一争端。</p>\n<blockquote>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n</blockquote>\n<p><code>the company ... claiming</code>先标清说法属于公司。它把协议无效与联邦专属监管连在一起，但后面的最高法院判断又承认州有一定权限，法律争议因此落在范围上。</p>\n<blockquote>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules.</p>\n</blockquote>\n<p><code>Certainly</code>承认各州规则不同可能形成零散监管的担忧，<code>could result if</code>还保留了条件与可能性。作者没有因此直接接受公司关于州完全无权的主张。</p>\n<blockquote>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n<p><code>But had ... kept its word</code>把讨论拉回履约：若公司守约，眼前这场辩论原本无需进行。法律问题值得厘清，并不能抹掉公司先前作出的承诺。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公司提出联邦专属权主张 → 州权范围需要厘清 → 承认规则分散的顾虑 → 回到公司应当守约</p>\n</blockquote>\n<p>legal boundary对应how far those powers extend，broken promise对应kept its word的反事实。标题把复杂法律问题与作者对履约的评价分开。</p>\n<p>再看最强干扰项E：Why every state must abandon nuclear regulation。</p>\n<p>州权范围待明确不等于州完全无权，原文明确说states do have some regulatory authority。</p>\n<p><strong>44题选A。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Treat public permission as a continuing responsibility</p>\n<blockquote>\n<p>把公共许可视为持续责任</p>\n</blockquote>\n<p>文章由佛蒙特的信用受损转向其他反应堆和Pilgrim续期申请，要求监管者记住公司承诺是否可信。经营许可因此是公众托付，失信可能影响别处业务。</p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n<p>首句说的是公司自以为在Vermont声誉已损、再无可失。紧接着<code>But there should be consequences</code>反对这种无后果的想法，<code>public trust</code>给出经营许可与公众责任的联系。</p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth.</p>\n</blockquote>\n<p>列出其他11座反应堆并点名Pilgrim，是把视线从一个州移到公司仍在经营和申请的其他项目。它为后面的审查提醒提供具体对象。</p>\n<blockquote>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<p><code>reviews ... application</code>说明审批仍在进行，<code>keep in mind</code>要求审查者把旧承诺的可信度纳入判断。责任会延续到后续许可，却没有在这里宣布申请结局。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公司认为当地失信已无损失 → 作者强调许可依靠公众信任 → 转向别处运营和申请 → 要求后续审批检验承诺可信度</p>\n</blockquote>\n<p>public permission对应Permission to run，continuing responsibility对应public trust以及以后审批中对承诺的审视。</p>\n<p>再看最强干扰项G：A confirmed decision to withdraw every application。</p>\n<p>公司正在申请，作者要求审查其信用；这不是已经撤回申请，更没有涉及全部申请。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>An operating agreement is supposed to bind an energy company after the immediate commercial advantage has been secured. Entergy&#39;s dispute with Vermont makes that expectation important. The company had promised to accept state requirements, but later took an action that appeared to reverse its assurance.</p>\n<p><strong>B.</strong></p>\n<p>Clarifying those powers might also address legitimate concerns about a patchwork of state rules. Such concerns deserve attention, but they do not erase the company&#39;s earlier promise. Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.</p>\n<p><strong>C.</strong></p>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust. Entergy also runs reactors elsewhere and seeks a further term for Pilgrim. Regulators assessing the new application must therefore consider whether the company&#39;s record supports confidence in its latest assurances.</p>\n<p><strong>D.</strong></p>\n<p>At the time of that purchase in 2002, state approval depended on the company&#39;s agreeing to seek permission for operation beyond 2012. Vermont later required legislative approval for an extension as well. Entergy accepted the additional requirement, so both stages left a record of commitments it had chosen to make.</p>\n<p><strong>E.</strong></p>\n<p>Those commitments became harder to fulfil after accidents and misleading statements damaged confidence in the plant&#39;s management. Concerns about safety were no longer abstract. The state Senate responded by voting against an extension, turning the accepted conditions into an immediate obstacle to continued operation.</p>\n<p><strong>F.</strong></p>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules. Rather than accepting the state&#39;s conditions, the company sought to keep its plant running by questioning their constitutionality. To understand why this move provoked outrage, it is necessary to return to the original purchase.</p>\n<p><strong>G.</strong></p>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone. This argument raised a genuine legal question. States had some recognised authority, but the precise reach of their powers still required clarification.</p>\n<p><strong>H.</strong></p>\n<p>Considering that record does not announce the result of the new application in advance. It identifies a responsibility of the regulator: promises made to obtain permission must retain weight when the operator later finds them inconvenient. Trust in a public undertaking cannot depend only on the operator&#39;s immediate business interest.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>由履约期待引出公司反向行动</td>\n</tr>\n<tr>\n<td>B</td>\n<td>承认规则担忧但不抹去履约责任</td>\n</tr>\n<tr>\n<td>C</td>\n<td>把失信记录接到别处续期审批</td>\n</tr>\n<tr>\n<td>D</td>\n<td>交代交易及续期条件均获接受</td>\n</tr>\n<tr>\n<td>E</td>\n<td>事故及管理问题引发续期拒绝</td>\n</tr>\n<tr>\n<td>F</td>\n<td>说明挑战州规则并回溯交易</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由经营受阻转向州权边界争议</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结审批应重视持续履约而非预判结果</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>由履约期待引出公司反向行动 → 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受 → 事故及管理问题引发续期拒绝 → 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批 → 总结审批应重视持续履约而非预判结果</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The company had promised to accept state requirements, but later took an action that appeared to reverse its assurance.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules.</p>\n</blockquote>\n<p>A以<code>reverse its assurance</code>收尾，F开头的<code>That reversal</code>回指同一次反向行动。F再用<code>took the form of</code>点明其形式是联邦法院挑战，把抽象失信落到具体行动。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Rather than accepting the state&#39;s conditions, the company sought to keep its plant running by questioning their constitutionality. To understand why this move provoked outrage, it is necessary to return to the original purchase.</p>\n</blockquote>\n<p>F先解释公司为保住运营而质疑规则合宪性，再提出<code>return to the original purchase</code>。这个回溯要求说明为何今天的行动与当初关系不一致，为历史条件作铺垫。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>At the time of that purchase in 2002, state approval depended on the company&#39;s agreeing to seek permission for operation beyond 2012.</p>\n</blockquote>\n<p>D开头的<code>that purchase in 2002</code>直接接F的<code>the original purchase</code>，随后交代交易获批的条件。先提出回溯需要，再回到交易事实，衔接完整。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由履约期待引出公司反向行动 → 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.</p>\n</blockquote>\n<p>G用<code>Faced with that obstacle</code>起笔，需要前面已给出阻碍继续运营的结果。A只说保证被反向行动推翻，尚未交代州议会否决延期；G的障碍没有具体先行内容，D的<code>that purchase</code>也失去近接入口。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>To understand why this move provoked outrage, it is necessary to return to the original purchase.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>At the time of that purchase in 2002, state approval depended on the company&#39;s agreeing to seek permission for operation beyond 2012.</p>\n</blockquote>\n<p>F末句要求回到最初购厂，D马上用<code>At the time of that purchase in 2002</code>进入这个时点。<code>that purchase</code>有明确回指，后面的批准条件解释了为什么现今的挑战被视为违约。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Vermont later required legislative approval for an extension as well. Entergy accepted the additional requirement, so both stages left a record of commitments it had chosen to make.</p>\n</blockquote>\n<p>D先交代2012年后运营须另求批准，再说州后来追加议会要求，公司也接受。末句把两次接受收成<code>a record of commitments</code>，不再只停在某一个年份。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Those commitments became harder to fulfil after accidents and misleading statements damaged confidence in the plant&#39;s management.</p>\n</blockquote>\n<p>固定E以<code>Those commitments</code>接住D最后的承诺记录，转入事故与失实说明怎样损害管理信用。先说明承诺有哪些，才谈它们后来为何变得难以履行。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受 → 事故及管理问题引发续期拒绝</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.</p>\n</blockquote>\n<p>G已经用<code>that obstacle</code>指一个现实运营障碍。F此时才要求回顾购厂，还没有进入事故和延期否决；若跳到G，会让后来才交代的后果提前出现，也不能给E的复数<code>Those commitments</code>提供两次接受的记录。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The state Senate responded by voting against an extension, turning the accepted conditions into an immediate obstacle to continued operation.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.</p>\n</blockquote>\n<p>E最后说州议会反对续期，把已接受的条件变成<code>an immediate obstacle</code>。G开头<code>Faced with that obstacle</code>逐字承接这个经营障碍，再写公司如何提出协议无效和联邦专属监管的抗辩。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>This argument raised a genuine legal question. States had some recognised authority, but the precise reach of their powers still required clarification.</p>\n</blockquote>\n<p>G由公司的抗辩进入法律问题，先承认州有部分已被认可的权限，再指出<code>the precise reach</code>仍需澄清。公司想继续运营的具体争议被推进成州权边界问题。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Clarifying those powers might also address legitimate concerns about a patchwork of state rules.</p>\n</blockquote>\n<p>B的<code>Clarifying those powers</code>承接G末尾的<code>powers ... required clarification</code>，接着说明厘清权限还涉及不同州规则拼凑的顾虑。权限对象与澄清动作都连续。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>事故及管理问题引发续期拒绝 → 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust.</p>\n</blockquote>\n<p>C一开始就把承诺的意义扩展到别处电站与公共信任。E后面尚未展开州权范围问题；若直接放C，B随后说<code>Clarifying those powers</code>就找不到刚刚界定的州权，也跳过公司从运营受阻走向法律抗辩的过程。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>States had some recognised authority, but the precise reach of their powers still required clarification.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Clarifying those powers might also address legitimate concerns about a patchwork of state rules.</p>\n</blockquote>\n<p>G末尾说州权限的具体范围仍需澄清，B用<code>Clarifying those powers</code>接住这件事。<code>also</code>进一步补充厘清权限可能回应的另一个顾虑，即各州规则拼凑。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Such concerns deserve attention, but they do not erase the company&#39;s earlier promise. Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.</p>\n</blockquote>\n<p>B先承认这些顾虑值得注意，再用<code>but</code>指出它们不能抹去公司的<code>earlier promise</code>。最后的反事实把责任落实为：若遵守当初接受的条件，这起具体争端会有不同走向。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust.</p>\n</blockquote>\n<p>C开头<code>That earlier promise</code>回指B刚重新提起的承诺，<code>beyond this one plant</code>再把它的意义扩展到其他业务。B完成法律顾虑到履约责任的转回，C才能沿履约记录继续扩展。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules.</p>\n</blockquote>\n<p>F的<code>That reversal</code>要求前文刚给出承诺被反转的行动，而G刚落到州权如何澄清。F还会再次要求回到购厂，把已经讲完的历史重启，无法接上C对承诺后续影响的扩展。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust.</p>\n</blockquote>\n<p>B以守约本会改变争端走向作结，C用<code>That earlier promise</code>接住守约问题。<code>beyond this one plant</code>说明接下来要从当地争端扩展到公司其他经营项目。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Entergy also runs reactors elsewhere and seeks a further term for Pilgrim. Regulators assessing the new application must therefore consider whether the company&#39;s record supports confidence in its latest assurances.</p>\n</blockquote>\n<p>C列出别处反应堆和Pilgrim续期，再用<code>therefore</code>推出监管者应考虑公司的<code>record</code>能否支持最新保证。旧记录怎样进入新审批，在这两句中具体建立。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Considering that record does not announce the result of the new application in advance.</p>\n</blockquote>\n<p>固定H的<code>Considering that record</code>接C的<code>company’s record</code>，随后限制推断程度：考虑信用不等于提前宣布新申请结果。先给审查依据，再说明它不自动决定结局。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批 → 总结审批应重视持续履约而非预判结果</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules.</p>\n</blockquote>\n<p>F讲法院挑战并准备回溯购厂，没有介绍新申请及审查旧记录的要求。若把它放在H前，H中的<code>that record</code>与<code>the new application</code>都缺少紧邻说明，还会让全文在收束时重新回到历史开头。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>public trust</strong></td>\n<td><strong>公众信任</strong></td>\n<td><strong>诚信｜社会信用</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>corporate responsibility</td>\n<td>企业责任</td>\n<td>敬业｜责任担当</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>safety management</td>\n<td>安全管理</td>\n<td>和谐｜公共安全</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>effective regulatory oversight</strong></td>\n<td><strong>有效监管</strong></td>\n<td><strong>法治｜依法监管</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>keeping one’s promises</td>\n<td>信守承诺</td>\n<td>诚信｜信守承诺</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>clear rules and responsibilities</td>\n<td>明确规则与责任</td>\n<td>法治｜制度建设</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>public welfare</td>\n<td>公共福祉</td>\n<td>和谐｜社会福祉</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>taking responsibility for one’s actions</td>\n<td>为自己的行为负责</
