</p>\n</blockquote>\n<p>C需要公司作出撤回决定。实际段落停在监管审查阶段，不能把审批可能受影响改成申请者一定退出。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. Vermont’s reputation might be damaged","raw":"### D. Vermont’s reputation might be damaged\n\n> 末段暗示，Vermont的声誉可能受损。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n`its reputation in Vermont`中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。\n\n**出处：**\n\n> The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-30-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>its reputation in Vermont</code>中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n</section>"},{"title":"D. Vermont’s reputation might be damaged","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 末段暗示，Vermont的声誉可能受损。\n\n原句主语是`The company`，随后`its reputation in Vermont`中的`its`继续回指公司；`in Vermont`说明公司在什么地方的声誉。\n\nD写`Vermont’s reputation`，却把声誉归给州本身。两个短语都出现Vermont，但一个是公司在某地的声誉，另一个是那个地方自身的声誉，所属关系不同。\n\n再看时间，原句说`already so damaged`，公司认为自己在当地声誉已经严重受损，因此觉得与州对抗也没什么可失去。D又改成州的声誉将来可能受损，主体与时间都对不上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-30-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>its reputation in Vermont</code>中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p>原句主语是<code>The company</code>，随后<code>its reputation in Vermont</code>中的<code>its</code>继续回指公司；<code>in Vermont</code>说明公司在什么地方的声誉。</p>\n<p>D写<code>Vermont’s reputation</code>，却把声誉归给州本身。两个短语都出现Vermont，但一个是公司在某地的声誉，另一个是那个地方自身的声誉，所属关系不同。</p>\n<p>再看时间，原句说<code>already so damaged</code>，公司认为自己在当地声誉已经严重受损，因此觉得与州对抗也没什么可失去。D又改成州的声誉将来可能受损，主体与时间都对不上。</p>\n</section>"},{"title":"D. Vermont’s reputation might be damaged","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.\n>\n> 公司似乎认为，自己在Vermont的声誉已严重受损，因而与州对抗也没有什么可再失去的。\n\n首句解释公司为何觉得对抗州已无所损失，后面才指出这种想法不应让公司逃过后果。整段追究的是公司的信用，不是州的形象。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Vermont’s own reputation may suffer as a result of the dispute.\n>\n> 这场争议可能使Vermont自身的声誉受损。\n\nD需要州成为受损主体。实际始终是`The company`与`its reputation`相接，州只是地点；后文要求公司在别处也面对信用后果，进一步确认了这一主体。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>its reputation in Vermont</code>中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示，Vermont的声誉可能受损。</p>\n</blockquote>\n<p>原句主语是<code>The company</code>，随后<code>its reputation in Vermont</code>中的<code>its</code>继续回指公司；<code>in Vermont</code>说明公司在什么地方的声誉。</p>\n<p>D写<code>Vermont’s reputation</code>，却把声誉归给州本身。两个短语都出现Vermont，但一个是公司在某地的声誉，另一个是那个地方自身的声誉，所属关系不同。</p>\n<p>再看时间，原句说<code>already so damaged</code>，公司认为自己在当地声誉已经严重受损，因此觉得与州对抗也没什么可失去。D又改成州的声誉将来可能受损，主体与时间都对不上。</p>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n<p>公司似乎认为，自己在Vermont的声誉已严重受损，因而与州对抗也没有什么可再失去的。</p>\n</blockquote>\n<p>首句解释公司为何觉得对抗州已无所损失，后面才指出这种想法不应让公司逃过后果。整段追究的是公司的信用，不是州的形象。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Vermont’s own reputation may suffer as a result of the dispute.</p>\n<p>这场争议可能使Vermont自身的声誉受损。</p>\n</blockquote>\n<p>D需要州成为受损主体。实际始终是<code>The company</code>与<code>its reputation</code>相接，州只是地点；后文要求公司在别处也面对信用后果，进一步确认了这一主体。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"30题结论","raw":"### 30题结论\n\n> **30. A**\n\n- A：作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。\n- B：公司挑战的是州规则，末段写它向联邦申请许可、NRC进行审查。B把对州的既有挑战转给了另一个机构，并把它说成将发生的事。\n- C：原段写申请已经提交、NRC正在审查，作者要求注意承诺的可信度。C额外指定公司会撤回申请，原文没有给出这一决定。\n- D：its reputation in Vermont中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"30","questionConclusion":true},"html":"<blockquote>\n<p><strong>30. A</strong></p>\n</blockquote>\n<ul>\n<li>A：作者从Vermont的信用问题转向别处的运营与续期申请，再要求NRC审视公司承诺的价值，这使失信可能影响其他业务，而未宣布审批结果。</li>\n<li>B：公司挑战的是州规则，末段写它向联邦申请许可、NRC进行审查。B把对州的既有挑战转给了另一个机构，并把它说成将发生的事。</li>\n<li>C：原段写申请已经提交、NRC正在审查，作者要求注意承诺的可信度。C额外指定公司会撤回申请，原文没有给出这一决定。</li>\n<li>D：its reputation in Vermont中its回指公司，Vermont是声誉受损发生的地方。D把地点改成声誉拥有者，且原文说损害已经发生。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：Entergy违背承诺引发争议**（段落1-2核心事件） Entergy违背长期承诺（不遵守佛蒙特州核能法规）→ 在联邦法院挑战佛蒙特州规则的合宪性（为保持核电站运行的绝望努力）\n\n↓（历史背景回顾）\n\n**逻辑层次2：冲突的历史脉络**（段落3历史背景） 2002年：Entergy购买佛蒙特唯一核电站 → 条件：同意2012年后运营需州监管机构许可 + 2006年：州要求延期需议会批准 → Entergy当时都同意了\n\n↓（导致冲突升级的原因）\n\n**逻辑层次3：信任破裂的过程**（段落4事故与后果） Entergy的问题：【要么从未打算遵守承诺 // 要么没预见到后果】→ 一连串事故：（2007年冷却塔倒塌 + 地下管道泄漏）+ 管理问题：（做出误导性声明）→ 结果：佛蒙特州参议院26:4反对延期\n\n→（当前法律争议）\n\n**逻辑层次4：法律争议的复杂性**（段落5法律分析） Entergy的主张：（2002协议因2006立法而无效 + 只有联邦有核能监管权）→ 法律的模糊性：（最高法院承认州有一定监管权 // 但边界不清）→ 佛蒙特案将测试州权力边界 → 作者观点：如果Entergy信守承诺，这些争议本可避免\n\n↓（更广泛的影响）\n\n**逻辑层次5：对Entergy其他业务的潜在影响**（段落6警示与后果） Entergy的态度：（在佛蒙特声誉已毁，无所顾忌）// 但应有后果：【核电站许可是公共信任 → Entergy在美国还运营11个反应堆（包括普利茅斯朝圣者核电站）→ 正申请延期20年】→ 警示：NRC审查时应考虑Entergy承诺的可信度\n\n↑（全文主旨）\n\n全文核心观点：Entergy违背对佛蒙特州的承诺，挑战州监管权力，这不仅暴露了其管理和信誉问题，还可能影响其在其他州的核电站运营许可，因为核电站运营许可基于公共信任。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：Entergy违背承诺引发争议</strong>（段落1-2核心事件） Entergy违背长期承诺（不遵守佛蒙特州核能法规）→ 在联邦法院挑战佛蒙特州规则的合宪性（为保持核电站运行的绝望努力）</p>\n<p>↓（历史背景回顾）</p>\n<p><strong>逻辑层次2：冲突的历史脉络</strong>（段落3历史背景） 2002年：Entergy购买佛蒙特唯一核电站 → 条件：同意2012年后运营需州监管机构许可 + 2006年：州要求延期需议会批准 → Entergy当时都同意了</p>\n<p>↓（导致冲突升级的原因）</p>\n<p><strong>逻辑层次3：信任破裂的过程</strong>（段落4事故与后果） Entergy的问题：【要么从未打算遵守承诺 // 要么没预见到后果】→ 一连串事故：（2007年冷却塔倒塌 + 地下管道泄漏）+ 管理问题：（做出误导性声明）→ 结果：佛蒙特州参议院26:4反对延期</p>\n<p>→（当前法律争议）</p>\n<p><strong>逻辑层次4：法律争议的复杂性</strong>（段落5法律分析） Entergy的主张：（2002协议因2006立法而无效 + 只有联邦有核能监管权）→ 法律的模糊性：（最高法院承认州有一定监管权 // 但边界不清）→ 佛蒙特案将测试州权力边界 → 作者观点：如果Entergy信守承诺，这些争议本可避免</p>\n<p>↓（更广泛的影响）</p>\n<p><strong>逻辑层次5：对Entergy其他业务的潜在影响</strong>（段落6警示与后果） Entergy的态度：（在佛蒙特声誉已毁，无所顾忌）// 但应有后果：【核电站许可是公共信任 → Entergy在美国还运营11个反应堆（包括普利茅斯朝圣者核电站）→ 正申请延期20年】→ 警示：NRC审查时应考虑Entergy承诺的可信度</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：Entergy违背对佛蒙特州的承诺，挑战州监管权力，这不仅暴露了其管理和信誉问题，还可能影响其在其他州的核电站运营许可，因为核电站运营许可基于公共信任。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. An assurance reversed by the company’s conduct\n\n> 公司行动推翻了既有保证\n\n首段用A deal is a deal建立承诺的约束，随后说明公司宣布违背长期保证。第二段把具体行动补出来：此前答应不挑战州规则，现在却去联邦法院挑战。\n\n> A deal is a deal – except, apparently, when Entergy is involved.\n\n`A deal is a deal`先把约定应当履行当作共同前提，破折号后的`except`却把Entergy列作反常例外。后面要解释的是这家公司怎样背离了这个前提。\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running.\n\n`has done`与`promised ... would not`把同一行动放成相反关系，冒号具体写出公司向联邦法院挑战州规则。标题中的`reversed`因此有行动依据，不只是作者表达惊讶。\n\n> It’s a stunning move.\n\n`It`回指刚刚说明的法院挑战，`stunning`收束作者对这种反向行动的批评。结尾仍在评价公司的举动，并未要求各州退出核监管。\n\n这一部分的推进关系是：\n\n> 约定应当履行 → Entergy却成为例外 → 法律挑战与原承诺相反 → 作者批评这一举动\n\nassurance对应longstanding commitment与promised，reversed对应实际行动与承诺相反，conduct指提起合宪性挑战。\n\n再看最强干扰项E：Why every state must abandon nuclear regulation。\n\n讨论公司违约不等于要求全部州退出监管，文章后面还承认州确有一定监管权。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. An assurance reversed by the company’s conduct</p>\n<blockquote>\n<p>公司行动推翻了既有保证</p>\n</blockquote>\n<p>首段用A deal is a deal建立承诺的约束，随后说明公司宣布违背长期保证。第二段把具体行动补出来：此前答应不挑战州规则，现在却去联邦法院挑战。</p>\n<blockquote>\n<p>A deal is a deal – except, apparently, when Entergy is involved.</p>\n</blockquote>\n<p><code>A deal is a deal</code>先把约定应当履行当作共同前提，破折号后的<code>except</code>却把Entergy列作反常例外。后面要解释的是这家公司怎样背离了这个前提。</p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running.</p>\n</blockquote>\n<p><code>has done</code>与<code>promised ... would not</code>把同一行动放成相反关系，冒号具体写出公司向联邦法院挑战州规则。标题中的<code>reversed</code>因此有行动依据，不只是作者表达惊讶。</p>\n<blockquote>\n<p>It’s a stunning move.</p>\n</blockquote>\n<p><code>It</code>回指刚刚说明的法院挑战，<code>stunning</code>收束作者对这种反向行动的批评。结尾仍在评价公司的举动，并未要求各州退出核监管。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>约定应当履行 → Entergy却成为例外 → 法律挑战与原承诺相反 → 作者批评这一举动</p>\n</blockquote>\n<p>assurance对应longstanding commitment与promised，reversed对应实际行动与承诺相反，conduct指提起合宪性挑战。</p>\n<p>再看最强干扰项E：Why every state must abandon nuclear regulation。</p>\n<p>讨论公司违约不等于要求全部州退出监管，文章后面还承认州确有一定监管权。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】D. The conditions accepted when the plant changed hands\n\n> 电站交易时接受的条件\n\n时间线回到2002年买厂，并说明州批准交易的条件是延长运行要再求许可。2006年又增加州议会批准要求，公司仍然同意。\n\n> The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon.\n\n`since 2002`把叙述带回购厂时点，`bought`说明电站易手。下一句的`As a condition`随即解释获准交易时公司接受了什么限制。\n\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval.\n\n`a step further`表示2006年的要求是在既有条件上增加一层，新增的是延期须经州议会批准。它没有把购厂与延期并成同一次许可。\n\n> Then, too, the company went along.\n\n`Then, too`中的`too`回接公司此前已接受条件，说明追加要求时它同样同意。这样两次接受都留下明确记录，为后文的失约批评提供依据。\n\n这一部分的推进关系是：\n\n> 回到购厂交易 → 获批以未来申请运营许可为条件 → 州追加议会审批要求 → 公司再次同意\n\nconditions对应两次监管要求，plant changed hands对应购入电站的交易背景；标题不把买厂许可与续期许可混同。\n\n再看最强干扰项G：A confirmed decision to withdraw every application。\n\n这里记录公司接受的条件，没有撤回任何申请的决定。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】D. The conditions accepted when the plant changed hands</p>\n<blockquote>\n<p>电站交易时接受的条件</p>\n</blockquote>\n<p>时间线回到2002年买厂，并说明州批准交易的条件是延长运行要再求许可。2006年又增加州议会批准要求，公司仍然同意。</p>\n<blockquote>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon.</p>\n</blockquote>\n<p><code>since 2002</code>把叙述带回购厂时点，<code>bought</code>说明电站易手。下一句的<code>As a condition</code>随即解释获准交易时公司接受了什么限制。</p>\n<blockquote>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval.</p>\n</blockquote>\n<p><code>a step further</code>表示2006年的要求是在既有条件上增加一层，新增的是延期须经州议会批准。它没有把购厂与延期并成同一次许可。</p>\n<blockquote>\n<p>Then, too, the company went along.</p>\n</blockquote>\n<p><code>Then, too</code>中的<code>too</code>回接公司此前已接受条件，说明追加要求时它同样同意。这样两次接受都留下明确记录，为后文的失约批评提供依据。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>回到购厂交易 → 获批以未来申请运营许可为条件 → 州追加议会审批要求 → 公司再次同意</p>\n</blockquote>\n<p>conditions对应两次监管要求，plant changed hands对应购入电站的交易背景；标题不把买厂许可与续期许可混同。</p>\n<p>再看最强干扰项G：A confirmed decision to withdraw every application。</p>\n<p>这里记录公司接受的条件，没有撤回任何申请的决定。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】F. Safety failures followed by a refusal to extend operation\n\n> 安全问题之后的续期拒绝\n\n先列公司无意履约或未预见后果的两种解释，再以事故和误导性说明展示实质问题。州参议院的反对票是对这些问题的回应。\n\n> Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next.\n\n`Either ... or ...`先提出无意守约或未预见后果的两种可能，没有在这里确定是哪一种。接下来的事故与声明才是要展开的具体事实。\n\n> A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe.\n\n`both ... safety and ... management`明确列出质疑对象。冷却塔和管道事故涉及运行安全，`especially`之后的误导性声明又让公司的管理行为成为重点。\n\n> Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.\n\n`Enraged by`说明州参议院投票与公司的行为相联系，`against allowing an extension`给出续期遭到反对的结果。标题中的`followed by a refusal`接住了事实到监管反应的推进。\n\n这一部分的推进关系是：\n\n> 提出两种解释 → 列事故与误导性声明 → 安全和管理受到质疑 → 州议会反对续期\n\nsafety failures对应冷却塔坍塌与管道泄漏，refusal to extend对应不允许延长运行的投票。\n\n再看最强干扰项D：The conditions accepted when the plant changed hands。\n\nD描述交易时接受的条件，不能概括后来事故为何激怒州方及续期为何被拒绝。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】F. Safety failures followed by a refusal to extend operation</p>\n<blockquote>\n<p>安全问题之后的续期拒绝</p>\n</blockquote>\n<p>先列公司无意履约或未预见后果的两种解释，再以事故和误导性说明展示实质问题。州参议院的反对票是对这些问题的回应。</p>\n<blockquote>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next.</p>\n</blockquote>\n<p><code>Either ... or ...</code>先提出无意守约或未预见后果的两种可能，没有在这里确定是哪一种。接下来的事故与声明才是要展开的具体事实。</p>\n<blockquote>\n<p>A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe.</p>\n</blockquote>\n<p><code>both ... safety and ... management</code>明确列出质疑对象。冷却塔和管道事故涉及运行安全，<code>especially</code>之后的误导性声明又让公司的管理行为成为重点。</p>\n<blockquote>\n<p>Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n</blockquote>\n<p><code>Enraged by</code>说明州参议院投票与公司的行为相联系，<code>against allowing an extension</code>给出续期遭到反对的结果。标题中的<code>followed by a refusal</code>接住了事实到监管反应的推进。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>提出两种解释 → 列事故与误导性声明 → 安全和管理受到质疑 → 州议会反对续期</p>\n</blockquote>\n<p>safety failures对应冷却塔坍塌与管道泄漏，refusal to extend对应不允许延长运行的投票。</p>\n<p>再看最强干扰项D：The conditions accepted when the plant changed hands。</p>\n<p>D描述交易时接受的条件，不能概括后来事故为何激怒州方及续期为何被拒绝。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】A. Distinguish the legal boundary from the broken promise\n\n> 区分法律权限争议与失信行为\n\n先报告公司对协议效力和联邦专属监管的主张，再说明州权边界尚待检验。末尾承认规则拼凑的合理担忧，同时指出守约本可避免这一争端。\n\n> Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.\n\n`the company ... claiming`先标清说法属于公司。它把协议无效与联邦专属监管连在一起，但后面的最高法院判断又承认州有一定权限，法律争议因此落在范围上。\n\n> Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules.\n\n`Certainly`承认各州规则不同可能形成零散监管的担忧，`could result if`还保留了条件与可能性。作者没有因此直接接受公司关于州完全无权的主张。\n\n> But had Entergy kept its word, that debate would be beside the point.\n\n`But had ... kept its word`把讨论拉回履约：若公司守约，眼前这场辩论原本无需进行。法律问题值得厘清，并不能抹掉公司先前作出的承诺。\n\n这一部分的推进关系是：\n\n> 公司提出联邦专属权主张 → 州权范围需要厘清 → 承认规则分散的顾虑 → 回到公司应当守约\n\nlegal boundary对应how far those powers extend，broken promise对应kept its word的反事实。标题把复杂法律问题与作者对履约的评价分开。\n\n再看最强干扰项E：Why every state must abandon nuclear regulation。\n\n州权范围待明确不等于州完全无权，原文明确说states do have some regulatory authority。\n\n**44题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】A. Distinguish the legal boundary from the broken promise</p>\n<blockquote>\n<p>区分法律权限争议与失信行为</p>\n</blockquote>\n<p>先报告公司对协议效力和联邦专属监管的主张，再说明州权边界尚待检验。末尾承认规则拼凑的合理担忧，同时指出守约本可避免这一争端。</p>\n<blockquote>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n</blockquote>\n<p><code>the company ... claiming</code>先标清说法属于公司。它把协议无效与联邦专属监管连在一起，但后面的最高法院判断又承认州有一定权限，法律争议因此落在范围上。</p>\n<blockquote>\n<p>Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules.</p>\n</blockquote>\n<p><code>Certainly</code>承认各州规则不同可能形成零散监管的担忧，<code>could result if</code>还保留了条件与可能性。作者没有因此直接接受公司关于州完全无权的主张。</p>\n<blockquote>\n<p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n<p><code>But had ... kept its word</code>把讨论拉回履约：若公司守约，眼前这场辩论原本无需进行。法律问题值得厘清，并不能抹掉公司先前作出的承诺。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公司提出联邦专属权主张 → 州权范围需要厘清 → 承认规则分散的顾虑 → 回到公司应当守约</p>\n</blockquote>\n<p>legal boundary对应how far those powers extend，broken promise对应kept its word的反事实。标题把复杂法律问题与作者对履约的评价分开。</p>\n<p>再看最强干扰项E：Why every state must abandon nuclear regulation。</p>\n<p>州权范围待明确不等于州完全无权，原文明确说states do have some regulatory authority。</p>\n<p><strong>44题选A。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Treat public permission as a continuing responsibility\n\n> 把公共许可视为持续责任\n\n文章由佛蒙特的信用受损转向其他反应堆和Pilgrim续期申请，要求监管者记住公司承诺是否可信。经营许可因此是公众托付，失信可能影响别处业务。\n\n> The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.\n\n首句说的是公司自以为在Vermont声誉已损、再无可失。紧接着`But there should be consequences`反对这种无后果的想法，`public trust`给出经营许可与公众责任的联系。\n\n> Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth.\n\n列出其他11座反应堆并点名Pilgrim，是把视线从一个州移到公司仍在经营和申请的其他项目。它为后面的审查提醒提供具体对象。\n\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.\n\n`reviews ... application`说明审批仍在进行，`keep in mind`要求审查者把旧承诺的可信度纳入判断。责任会延续到后续许可，却没有在这里宣布申请结局。\n\n这一部分的推进关系是：\n\n> 公司认为当地失信已无损失 → 作者强调许可依靠公众信任 → 转向别处运营和申请 → 要求后续审批检验承诺可信度\n\npublic permission对应Permission to run，continuing responsibility对应public trust以及以后审批中对承诺的审视。\n\n再看最强干扰项G：A confirmed decision to withdraw every application。\n\n公司正在申请，作者要求审查其信用；这不是已经撤回申请，更没有涉及全部申请。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Treat public permission as a continuing responsibility</p>\n<blockquote>\n<p>把公共许可视为持续责任</p>\n</blockquote>\n<p>文章由佛蒙特的信用受损转向其他反应堆和Pilgrim续期申请，要求监管者记住公司承诺是否可信。经营许可因此是公众托付，失信可能影响别处业务。</p>\n<blockquote>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n<p>首句说的是公司自以为在Vermont声誉已损、再无可失。紧接着<code>But there should be consequences</code>反对这种无后果的想法，<code>public trust</code>给出经营许可与公众责任的联系。</p>\n<blockquote>\n<p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth.</p>\n</blockquote>\n<p>列出其他11座反应堆并点名Pilgrim，是把视线从一个州移到公司仍在经营和申请的其他项目。它为后面的审查提醒提供具体对象。</p>\n<blockquote>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<p><code>reviews ... application</code>说明审批仍在进行，<code>keep in mind</code>要求审查者把旧承诺的可信度纳入判断。责任会延续到后续许可，却没有在这里宣布申请结局。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公司认为当地失信已无损失 → 作者强调许可依靠公众信任 → 转向别处运营和申请 → 要求后续审批检验承诺可信度</p>\n</blockquote>\n<p>public permission对应Permission to run，continuing responsibility对应public trust以及以后审批中对承诺的审视。</p>\n<p>再看最强干扰项G：A confirmed decision to withdraw every application。</p>\n<p>公司正在申请，作者要求审查其信用；这不是已经撤回申请，更没有涉及全部申请。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 由履约期待引出公司反向行动 |\n| B | 承认规则担忧但不抹去履约责任 |\n| C | 把失信记录接到别处续期审批 |\n| D | 交代交易及续期条件均获接受 |\n| E | 事故及管理问题引发续期拒绝 |\n| F | 说明挑战州规则并回溯交易 |\n| G | 由经营受阻转向州权边界争议 |\n| H | 总结审批应重视持续履约而非预判结果 |\n\n全文推进：\n\n> 由履约期待引出公司反向行动 → 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受 → 事故及管理问题引发续期拒绝 → 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批 → 总结审批应重视持续履约而非预判结果\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>由履约期待引出公司反向行动</td>\n</tr>\n<tr>\n<td>B</td>\n<td>承认规则担忧但不抹去履约责任</td>\n</tr>\n<tr>\n<td>C</td>\n<td>把失信记录接到别处续期审批</td>\n</tr>\n<tr>\n<td>D</td>\n<td>交代交易及续期条件均获接受</td>\n</tr>\n<tr>\n<td>E</td>\n<td>事故及管理问题引发续期拒绝</td>\n</tr>\n<tr>\n<td>F</td>\n<td>说明挑战州规则并回溯交易</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由经营受阻转向州权边界争议</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结审批应重视持续履约而非预判结果</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>由履约期待引出公司反向行动 → 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受 → 事故及管理问题引发续期拒绝 → 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批 → 总结审批应重视持续履约而非预判结果</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → D。\n\n先看前段A的结尾：\n\n> The company had promised to accept state requirements, but later took an action that appeared to reverse its assurance.\n\n再看F段开头：\n\n> That reversal took the form of a federal court challenge to Vermont's nuclear rules.\n\nA以`reverse its assurance`收尾，F开头的`That reversal`回指同一次反向行动。F再用`took the form of`点明其形式是联邦法院挑战，把抽象失信落到具体行动。\n\n本段内部继续写道：\n\n> Rather than accepting the state's conditions, the company sought to keep its plant running by questioning their constitutionality. To understand why this move provoked outrage, it is necessary to return to the original purchase.\n\nF先解释公司为保住运营而质疑规则合宪性，再提出`return to the original purchase`。这个回溯要求说明为何今天的行动与当初关系不一致，为历史条件作铺垫。\n\n后段D开头是：\n\n> At the time of that purchase in 2002, state approval depended on the company's agreeing to seek permission for operation beyond 2012.\n\nD开头的`that purchase in 2002`直接接F的`the original purchase`，随后交代交易获批的条件。先提出回溯需要，再回到交易事实，衔接完整。\n\n这三段的推进关系：\n\n> 由履约期待引出公司反向行动 → 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受\n\n再检验候选G：\n\n> Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.\n\nG用`Faced with that obstacle`起笔，需要前面已给出阻碍继续运营的结果。A只说保证被反向行动推翻，尚未交代州议会否决延期；G的障碍没有具体先行内容，D的`that purchase`也失去近接入口。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The company had promised to accept state requirements, but later took an action that appeared to reverse its assurance.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules.</p>\n</blockquote>\n<p>A以<code>reverse its assurance</code>收尾，F开头的<code>That reversal</code>回指同一次反向行动。F再用<code>took the form of</code>点明其形式是联邦法院挑战，把抽象失信落到具体行动。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Rather than accepting the state&#39;s conditions, the company sought to keep its plant running by questioning their constitutionality. To understand why this move provoked outrage, it is necessary to return to the original purchase.</p>\n</blockquote>\n<p>F先解释公司为保住运营而质疑规则合宪性，再提出<code>return to the original purchase</code>。这个回溯要求说明为何今天的行动与当初关系不一致，为历史条件作铺垫。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>At the time of that purchase in 2002, state approval depended on the company&#39;s agreeing to seek permission for operation beyond 2012.</p>\n</blockquote>\n<p>D开头的<code>that purchase in 2002</code>直接接F的<code>the original purchase</code>，随后交代交易获批的条件。先提出回溯需要，再回到交易事实，衔接完整。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由履约期待引出公司反向行动 → 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.</p>\n</blockquote>\n<p>G用<code>Faced with that obstacle</code>起笔，需要前面已给出阻碍继续运营的结果。A只说保证被反向行动推翻，尚未交代州议会否决延期；G的障碍没有具体先行内容，D的<code>that purchase</code>也失去近接入口。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> To understand why this move provoked outrage, it is necessary to return to the original purchase.\n\n再看D段开头：\n\n> At the time of that purchase in 2002, state approval depended on the company's agreeing to seek permission for operation beyond 2012.\n\nF末句要求回到最初购厂，D马上用`At the time of that purchase in 2002`进入这个时点。`that purchase`有明确回指，后面的批准条件解释了为什么现今的挑战被视为违约。\n\n本段内部继续写道：\n\n> Vermont later required legislative approval for an extension as well. Entergy accepted the additional requirement, so both stages left a record of commitments it had chosen to make.\n\nD先交代2012年后运营须另求批准，再说州后来追加议会要求，公司也接受。末句把两次接受收成`a record of commitments`，不再只停在某一个年份。\n\n后段E开头是：\n\n> Those commitments became harder to fulfil after accidents and misleading statements damaged confidence in the plant's management.\n\n固定E以`Those commitments`接住D最后的承诺记录，转入事故与失实说明怎样损害管理信用。先说明承诺有哪些，才谈它们后来为何变得难以履行。\n\n这三段的推进关系：\n\n> 说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受 → 事故及管理问题引发续期拒绝\n\n再检验候选G：\n\n> Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.\n\nG已经用`that obstacle`指一个现实运营障碍。F此时才要求回顾购厂，还没有进入事故和延期否决；若跳到G，会让后来才交代的后果提前出现，也不能给E的复数`Those commitments`提供两次接受的记录。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>To understand why this move provoked outrage, it is necessary to return to the original purchase.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>At the time of that purchase in 2002, state approval depended on the company&#39;s agreeing to seek permission for operation beyond 2012.</p>\n</blockquote>\n<p>F末句要求回到最初购厂，D马上用<code>At the time of that purchase in 2002</code>进入这个时点。<code>that purchase</code>有明确回指，后面的批准条件解释了为什么现今的挑战被视为违约。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Vermont later required legislative approval for an extension as well. Entergy accepted the additional requirement, so both stages left a record of commitments it had chosen to make.</p>\n</blockquote>\n<p>D先交代2012年后运营须另求批准，再说州后来追加议会要求，公司也接受。末句把两次接受收成<code>a record of commitments</code>，不再只停在某一个年份。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Those commitments became harder to fulfil after accidents and misleading statements damaged confidence in the plant&#39;s management.</p>\n</blockquote>\n<p>固定E以<code>Those commitments</code>接住D最后的承诺记录，转入事故与失实说明怎样损害管理信用。先说明承诺有哪些，才谈它们后来为何变得难以履行。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明挑战州规则并回溯交易 → 交代交易及续期条件均获接受 → 事故及管理问题引发续期拒绝</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.</p>\n</blockquote>\n<p>G已经用<code>that obstacle</code>指一个现实运营障碍。F此时才要求回顾购厂，还没有进入事故和延期否决；若跳到G，会让后来才交代的后果提前出现，也不能给E的复数<code>Those commitments</code>提供两次接受的记录。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> The state Senate responded by voting against an extension, turning the accepted conditions into an immediate obstacle to continued operation.\n\n再看G段开头：\n\n> Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.\n\nE最后说州议会反对续期，把已接受的条件变成`an immediate obstacle`。G开头`Faced with that obstacle`逐字承接这个经营障碍，再写公司如何提出协议无效和联邦专属监管的抗辩。\n\n本段内部继续写道：\n\n> This argument raised a genuine legal question. States had some recognised authority, but the precise reach of their powers still required clarification.\n\nG由公司的抗辩进入法律问题，先承认州有部分已被认可的权限，再指出`the precise reach`仍需澄清。公司想继续运营的具体争议被推进成州权边界问题。\n\n后段B开头是：\n\n> Clarifying those powers might also address legitimate concerns about a patchwork of state rules.\n\nB的`Clarifying those powers`承接G末尾的`powers ... required clarification`，接着说明厘清权限还涉及不同州规则拼凑的顾虑。权限对象与澄清动作都连续。\n\n这三段的推进关系：\n\n> 事故及管理问题引发续期拒绝 → 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任\n\n再检验候选C：\n\n> That earlier promise matters beyond this one plant because operating permission rests on public trust.\n\nC一开始就把承诺的意义扩展到别处电站与公共信任。E后面尚未展开州权范围问题；若直接放C，B随后说`Clarifying those powers`就找不到刚刚界定的州权，也跳过公司从运营受阻走向法律抗辩的过程。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The state Senate responded by voting against an extension, turning the accepted conditions into an immediate obstacle to continued operation.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone.</p>\n</blockquote>\n<p>E最后说州议会反对续期，把已接受的条件变成<code>an immediate obstacle</code>。G开头<code>Faced with that obstacle</code>逐字承接这个经营障碍，再写公司如何提出协议无效和联邦专属监管的抗辩。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>This argument raised a genuine legal question. States had some recognised authority, but the precise reach of their powers still required clarification.</p>\n</blockquote>\n<p>G由公司的抗辩进入法律问题，先承认州有部分已被认可的权限，再指出<code>the precise reach</code>仍需澄清。公司想继续运营的具体争议被推进成州权边界问题。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Clarifying those powers might also address legitimate concerns about a patchwork of state rules.</p>\n</blockquote>\n<p>B的<code>Clarifying those powers</code>承接G末尾的<code>powers ... required clarification</code>，接着说明厘清权限还涉及不同州规则拼凑的顾虑。权限对象与澄清动作都连续。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>事故及管理问题引发续期拒绝 → 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust.</p>\n</blockquote>\n<p>C一开始就把承诺的意义扩展到别处电站与公共信任。E后面尚未展开州权范围问题；若直接放C，B随后说<code>Clarifying those powers</code>就找不到刚刚界定的州权，也跳过公司从运营受阻走向法律抗辩的过程。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> States had some recognised authority, but the precise reach of their powers still required clarification.\n\n再看B段开头：\n\n> Clarifying those powers might also address legitimate concerns about a patchwork of state rules.\n\nG末尾说州权限的具体范围仍需澄清，B用`Clarifying those powers`接住这件事。`also`进一步补充厘清权限可能回应的另一个顾虑，即各州规则拼凑。\n\n本段内部继续写道：\n\n> Such concerns deserve attention, but they do not erase the company's earlier promise. Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.\n\nB先承认这些顾虑值得注意，再用`but`指出它们不能抹去公司的`earlier promise`。最后的反事实把责任落实为：若遵守当初接受的条件，这起具体争端会有不同走向。\n\n后段C开头是：\n\n> That earlier promise matters beyond this one plant because operating permission rests on public trust.\n\nC开头`That earlier promise`回指B刚重新提起的承诺，`beyond this one plant`再把它的意义扩展到其他业务。B完成法律顾虑到履约责任的转回，C才能沿履约记录继续扩展。\n\n这三段的推进关系：\n\n> 由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批\n\n再检验候选F：\n\n> That reversal took the form of a federal court challenge to Vermont's nuclear rules.\n\nF的`That reversal`要求前文刚给出承诺被反转的行动，而G刚落到州权如何澄清。F还会再次要求回到购厂，把已经讲完的历史重启，无法接上C对承诺后续影响的扩展。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>States had some recognised authority, but the precise reach of their powers still required clarification.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Clarifying those powers might also address legitimate concerns about a patchwork of state rules.</p>\n</blockquote>\n<p>G末尾说州权限的具体范围仍需澄清，B用<code>Clarifying those powers</code>接住这件事。<code>also</code>进一步补充厘清权限可能回应的另一个顾虑，即各州规则拼凑。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Such concerns deserve attention, but they do not erase the company&#39;s earlier promise. Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.</p>\n</blockquote>\n<p>B先承认这些顾虑值得注意，再用<code>but</code>指出它们不能抹去公司的<code>earlier promise</code>。最后的反事实把责任落实为：若遵守当初接受的条件，这起具体争端会有不同走向。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust.</p>\n</blockquote>\n<p>C开头<code>That earlier promise</code>回指B刚重新提起的承诺，<code>beyond this one plant</code>再把它的意义扩展到其他业务。B完成法律顾虑到履约责任的转回，C才能沿履约记录继续扩展。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由经营受阻转向州权边界争议 → 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules.</p>\n</blockquote>\n<p>F的<code>That reversal</code>要求前文刚给出承诺被反转的行动，而G刚落到州权如何澄清。F还会再次要求回到购厂，把已经讲完的历史重启，无法接上C对承诺后续影响的扩展。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.\n\n再看C段开头：\n\n> That earlier promise matters beyond this one plant because operating permission rests on public trust.\n\nB以守约本会改变争端走向作结，C用`That earlier promise`接住守约问题。`beyond this one plant`说明接下来要从当地争端扩展到公司其他经营项目。\n\n本段内部继续写道：\n\n> Entergy also runs reactors elsewhere and seeks a further term for Pilgrim. Regulators assessing the new application must therefore consider whether the company's record supports confidence in its latest assurances.\n\nC列出别处反应堆和Pilgrim续期，再用`therefore`推出监管者应考虑公司的`record`能否支持最新保证。旧记录怎样进入新审批，在这两句中具体建立。\n\n后段H开头是：\n\n> Considering that record does not announce the result of the new application in advance.\n\n固定H的`Considering that record`接C的`company’s record`，随后限制推断程度：考虑信用不等于提前宣布新申请结果。先给审查依据，再说明它不自动决定结局。\n\n这三段的推进关系：\n\n> 承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批 → 总结审批应重视持续履约而非预判结果\n\n再检验候选F：\n\n> That reversal took the form of a federal court challenge to Vermont's nuclear rules.\n\nF讲法院挑战并准备回溯购厂，没有介绍新申请及审查旧记录的要求。若把它放在H前，H中的`that record`与`the new application`都缺少紧邻说明，还会让全文在收束时重新回到历史开头。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That earlier promise matters beyond this one plant because operating permission rests on public trust.</p>\n</blockquote>\n<p>B以守约本会改变争端走向作结，C用<code>That earlier promise</code>接住守约问题。<code>beyond this one plant</code>说明接下来要从当地争端扩展到公司其他经营项目。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Entergy also runs reactors elsewhere and seeks a further term for Pilgrim. Regulators assessing the new application must therefore consider whether the company&#39;s record supports confidence in its latest assurances.</p>\n</blockquote>\n<p>C列出别处反应堆和Pilgrim续期，再用<code>therefore</code>推出监管者应考虑公司的<code>record</code>能否支持最新保证。旧记录怎样进入新审批，在这两句中具体建立。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Considering that record does not announce the result of the new application in advance.</p>\n</blockquote>\n<p>固定H的<code>Considering that record</code>接C的<code>company’s record</code>，随后限制推断程度：考虑信用不等于提前宣布新申请结果。先给审查依据，再说明它不自动决定结局。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>承认规则担忧但不抹去履约责任 → 把失信记录接到别处续期审批 → 总结审批应重视持续履约而非预判结果</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>That reversal took the form of a federal court challenge to Vermont&#39;s nuclear rules.</p>\n</blockquote>\n<p>F讲法院挑战并准备回溯购厂，没有介绍新申请及审查旧记录的要求。若把它放在H前，H中的<code>that record</code>与<code>the new application</code>都缺少紧邻说明，还会让全文在收束时重新回到历史开头。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **public trust** | **公众信任** | **诚信｜社会信用** | **宏观主题** |\n| corporate responsibility | 企业责任 | 敬业｜责任担当 | 宏观主题 |\n| safety management | 安全管理 | 和谐｜公共安全 | 宏观主题 |\n| **effective regulatory oversight** | **有效监管** | **法治｜依法监管** | **宏观主题** |\n| keeping one’s promises | 信守承诺 | 诚信｜信守承诺 | 个人主题 |\n| clear rules and responsibilities | 明确规则与责任 | 法治｜制度建设 | 宏观主题 |\n| public welfare | 公共福祉 | 和谐｜社会福祉 | 宏观主题 |\n| taking responsibility for one’s actions | 为自己的行为负责 | 人生哲理类｜责任感 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"arti  brings continuing responsibilities. | 这句话提醒我们，获得许可也带来持续责任。 |\n| 文本评论 | The passage raises a legitimate concern about the reliability of public promises. | 这段文字提出了对公开承诺可靠性的合理担忧。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The picture presents a striking contrast between a promise and the action that follows.</strong></td>\n<td><strong>图画呈现了承诺与后续行动之间的鲜明反差。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The person is expected to abide by the rules previously accepted.</td>\n<td>这个人被期待遵守先前接受的规则。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene highlights the public trust placed in a service provider.</td>\n<td>这一场景凸显了服务提供者所承载的公众信任。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The chart shows how confidence changed after a series of incidents.</strong></td>\n<td><strong>图表展示了一系列事件之后信心的变化。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The figures reveal a steady increase in attention to safety management.</td>\n<td>数据反映出对安全管理的关注持续增加。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The two groups differ in the extent to which they fulfil their commitments.</td>\n<td>两组在履行承诺的程度上有所不同。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement reminds us that permission brings continuing responsibilities.</td>\n<td>这句话提醒我们，获得许可也带来持续责任。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage raises a legitimate concern about the reliability of public promises.</td>\n<td>这段文字提出了对公开承诺可靠性的合理担忧。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Distinguish the legal boundary from the broken promise</strong></p><p><strong>B. Treat public permission as a continuing responsibility</strong></p><p><strong>C. An assurance reversed by the company’s conduct</strong></p><p><strong>D. The conditions accepted when the plant changed hands</strong></p><p><strong>E. Why every state must abandon nuclear regulation</strong></p><p><strong>F. Safety failures followed by a refusal to extend operation</strong></p><p><strong>G. A confirmed decision to withdraw every application</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>A deal is a deal – except, apparently, when Entergy is involved. The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was &lt;u&gt;reneging on&lt;/u&gt; a longstanding commitment to abide by the state’s strict nuclear regulations. Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running. It’s a stunning move.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012. In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval. Then, too, the company went along.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next. A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe. Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend. Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules. But had Entergy kept its word, that debate would be beside the point.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state. But there should be consequences. Permission to run a nuclear plant is a public trust. Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years. But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>An operating agreement is supposed to bind an energy company after the immediate commercial advantage has been secured. Entergy&#x27;s dispute with Vermont makes that expectation important. The company had promised to accept state requirements, but later took an action that appeared to reverse its assurance.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Clarifying those powers might also address legitimate concerns about a patchwork of state rules. Such concerns deserve attention, but they do not erase the company&#x27;s earlier promise. Had it honoured the conditions it accepted, the particular dispute over its right to continue operating would have taken a different course.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>That earlier promise matters beyond this one plant because operating permission rests on public trust. Entergy also runs reactors elsewhere and seeks a further term for Pilgrim. Regulators assessing the new application must therefore consider whether the company&#x27;s record supports confidence in its latest assurances.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>At the time of that purchase in 2002, state approval depended on the company&#x27;s agreeing to seek permission for operation beyond 2012. Vermont later required legislative approval for an extension as well. Entergy accepted the additional requirement, so both stages left a record of commitments it had chosen to make.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>Those commitments became harder to fulfil after accidents and misleading statements damaged confidence in the plant&#x27;s management. Concerns about safety were no longer abstract. The state Senate responded by voting against an extension, turning the accepted conditions into an immediate obstacle to continued operation.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>That reversal took the form of a federal court challenge to Vermont&#x27;s nuclear rules. Rather than accepting the state&#x27;s conditions, the company sought to keep its plant running by questioning their constitutionality. To understand why this move provoked outrage, it is necessary to return to the original purchase.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Faced with that obstacle, the company began to argue that the earlier agreement was invalid and that nuclear regulation belonged to the federal government alone. This argument raised a genuine legal question. States had some recognised authority, but the precise reach of their powers still required clarification.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Considering that record does not announce the result of the new application in advance. It identifies a responsibility of the regulator: promises made to obtain permission must retain weight when the operator later finds them inconvenient. Trust in a public undertaking cannot depend only on the operator&#x27;s immediate business interest.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>deal</td>\n<td>n.协议</td>\n<td>involved</td>\n<td>adj.涉及的</td>\n<td>supplier</td>\n<td>n.供应商</td>\n</tr>\n<tr>\n<td>provoked</td>\n<td>v.引发</td>\n<td>justified</td>\n<td>adj.有正当理由的</td>\n<td>outrage</td>\n<td>n.愤怒</td>\n</tr>\n<tr>\n<td>commitment</td>\n<td>n.承诺</td>\n<td>abide by</td>\n<td>遵守</td>\n<td>regulations</td>\n<td>n.规章</td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>precisely</td>\n<td>adv.恰恰</td>\n<td>promised</td>\n<td>v.承诺</td>\n<td>challenge</td>\n<td>v.质疑</td>\n</tr>\n<tr>\n<td>constitutionality</td>\n<td>n.合宪性</td>\n<td>federal</td>\n<td>adj.联邦的</td>\n<td>desperate</td>\n<td>adj.孤注一掷的</td>\n</tr>\n<tr>\n<td>effort</td>\n<td>n.努力</td>\n<td>stunning</td>\n<td>adj.令人震惊的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</t >public trust</td>\n<td>公众信任</td>\n<td>pledging</td>\n<td>v.承诺</td>\n<td>applied</td>\n<td>v.申请</td>\n</tr>\n<tr>\n<td>reviews</td>\n<td>v.审查</td>\n<td>application</td>\n<td>n.申请</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>A deal is a deal – except, apparently, when Entergy is involved. The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was <u>reneging on</u> a longstanding commitment to abide by the state’s strict nuclear regulations.</p>\n<h3>意群划分 · 第1段</h3>\n<p>A deal is a deal -- / except, apparently, / when Entergy is involved.</p>\n<p>The company, / a major energy supplier in New England, / provoked justified outrage / in Vermont last week / when it announced / it was reneging on / a longstanding commitment / to abide by / the state&#39;s strict nuclear regulations.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>协议就是协议 -- / 除了，显然，/ 当Entergy涉及其中时。</p>\n<p>这家公司，/ 新英格兰地区的主要能源供应商，/ 引发了正当的愤怒 / 在佛蒙特州上周 / 当它宣布 / 它正在违背 / 一项长期承诺 / 去遵守 / 该州严格的核能法规。</p>\n<h3>标准译文 · 第1段</h3>\n<p>协议就是协议——但显然，当涉及Entergy公司时就另当别论了。上周，这家新英格兰地区的主要能源供应商在佛蒙特州引发了正当的公愤，因为它宣布将违背其长期以来遵守该州严格核能法规的承诺。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running. It’s a stunning move.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Instead, / the company has done / precisely what / it had long promised / it would not: / challenge the constitutionality / of Vermont&#39;s rules / in the federal court, / as part of a desperate effort / to keep its Vermont Yankee nuclear power plant running.</p>\n<p>It&#39;s a stunning move.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>相反，/ 这家公司已经做了 / 恰恰是 / 它长期承诺 / 不会做的事：/ 挑战合宪性 / 佛蒙特州规则的 / 在联邦法院，/ 作为绝望努力的一部分 / 来保持其佛蒙特扬基核电站继续运行。</p>\n<p>这是一个令人震惊的举动。</p>\n<h3>标准译文 · 第2段</h3>\n<p>相反，该公司恰恰做了它长期承诺不会做的事：在联邦法院挑战佛蒙特州规则的合宪性，这是其为保持佛蒙特扬基核电站继续运行而做出的绝望努力的一部分。这真是令人震惊的举动。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012. In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval. Then, too, the company went along.</p>\n<h3>意群划分 · 第3段</h3>\n<p>The conflict has been surfacing / since 2002, / when the corporation bought / Vermont&#39;s only nuclear power plant, / an aging reactor in Vernon.</p>\n<p>As a condition / of receiving state approval / for the sale, / the company agreed / to seek permission / from state regulators / to operate past 2012.</p>\n<p>In 2006, / the state went a step further, / requiring that / any extension of the plant&#39;s license / be subject to / the Vermont legislature&#39;s approval.</p>\n<p>Then, too, / the company went along.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>这个冲突一直在浮现 / 自2002年以来，/ 当这家公司购买了 / 佛蒙特州唯一的核电站，/ 位于弗农的一个老化反应堆。</p>\n<p>作为一个条件 / 获得州政府批准 / 对于这次收购，/ 该公司同意 / 寻求许可 / 从州监管机构 / 在2012年后继续运营。</p>\n<p>在2006年，/ 该州更进一步，/ 要求 / 任何电站许可证的延期 / 必须服从于 / 佛蒙特州议会的批准。</p>\n<p>那时，同样，/ 该公司也同意了。</p>\n<h3>标准译文 · 第3段</h3>\n<p>这场冲突始于2002年，当时该公司购买了佛蒙特州唯一的核电站——位于弗农的一座老化反应堆。作为获得州政府批准收购的条件，该公司同意在2012年后继续运营需要向州监管机构申请许可。2006年，该州更进一步，要求任何电站许可证的延期都必须获得佛蒙特州议会的批准。当时，该公司也同意了这一要求。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next. A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe. Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Either Entergy never really intended / to live by those commitments, / or it simply didn&#39;t foresee / what would happen next.</p>\n<p>A string of accidents, / including the partial collapse / of a cooling tower in 2007 / and the discovery / of an underground pipe system leakage, / raised serious questions / about both Vermont Yankee&#39;s safety / and Entergy&#39;s management -- / especially after / the company made misleading statements / about the pipe.</p>\n<p>Enraged by Entergy&#39;s behavior, / the Vermont Senate voted / 26 to 4 last year / against allowing an extension.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>要么Entergy从未真正打算 / 遵守这些承诺，/ 或者它只是没有预见到 / 接下来会发生什么。</p>\n<p>一连串的事故，/ 包括部分倒塌 / 一座冷却塔的在2007年 / 以及发现 / 地下管道系统泄漏，/ 引发了严重的质疑 / 关于佛蒙特扬基的安全性 / 和Entergy的管理 -- / 尤其是在 / 该公司做出误导性声明 / 关于管道之后。</p>\n<p>被Entergy的行为激怒，/ 佛蒙特州参议院投票 / 以26比4去年 / 反对允许延期。</p>\n<h3>标准译文 · 第4段</h3>\n<p>要么Entergy从未真正打算遵守这些承诺，要么它只是没有预见到接下来会发生的事。一连串的事故，包括2007年一座冷却塔的部分倒塌和地下管道系统泄漏的发现，引发了对佛蒙特扬基安全性和Entergy管理能力的严重质疑——尤其是在该公司就管道问题做出误导性声明之后。被Entergy的行为激怒的佛蒙特州参议院去年以26比4的投票结果反对允许延期。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend. Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules. But had Entergy kept its word, that debate would be beside the point.</p>\n<h3>意群划分 · 第5段</h3>\n<p>Now the company is suddenly claiming / that the 2002 agreement is invalid / because of the 2006 legislation, / and that only the federal government / has regulatory power / over nuclear issues.</p>\n<p>The legal issues in the case are obscure: / whereas the Supreme Court has ruled / that states do have / some regulatory authority / over nuclear power, / legal scholars say / that Vermont case will offer / a precedent-setting test / of how far those powers extend.</p>\n<p>Certainly, / there are valid concerns / about the patchwork regulations / that could result / if every state sets its own rules.</p>\n<p>But had Entergy kept its word, / that debate would be / beside the point.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>现在该公司突然声称 / 2002年的协议无效 / 因为2006年的立法，/ 并且只有联邦政府 / 拥有监管权力 / 对核能问题。</p>\n<p>该案中的法律问题是模糊的：/ 尽管最高法院已经裁定 / 各州确实拥有 / 一些监管权力 / 对核能，/ 法律学者说 / 佛蒙特案将提供 / 一个设定先例的测试 / 关于这些权力延伸多远。</p>\n<p>当然，/ 存在合理的担忧 / 关于拼凑的法规 / 可能产生的 / 如果每个州设定自己的规则。</p>\n<p>但如果Entergy遵守了承诺，/ 这场辩论就会 / 无关紧要。</p>\n<h3>标准译文 · 第5段</h3>\n<p>现在该公司突然声称2002年的协议因2006年的立法而无效，并且只有联邦政府对核能问题拥有监管权力。该案中的法律问题颇为复杂：虽然最高法院已裁定各州确实对核能拥有一定的监管权力，但法律学者表示，佛蒙特案将为这些权力的边界提供一个具有先例意义的测试。<font style=\"color:black;\">以确定州政府的权力的范围有多大</font><font style=\"color:black;\">。</font>当然，如果每个州都制定自己的规则，由此产生的拼凑式法规确实令人担忧。但如果Entergy信守承诺，这场辩论就无关紧要了。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state. But there should be consequences. Permission to run a nuclear plant is a public trust. Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. Pledging to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years. But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n<h3>意群划分 · 第6段</h3>\n<p>The company seems to have concluded / that its reputation in Vermont / is already so damaged / that it has nothing left to lose / by going to war with the state.</p>\n<p>But there should be consequences.</p>\n<p>Permission to run a nuclear plant / is a public trust.</p>\n<p>Entergy runs 11 other reactors / in the United States, / including Pilgrim Nuclear station / in Plymouth.</p>\n<p>Pledging to run Pilgrim safely, / the company has applied / for federal permission / to keep it open / for another 20 years.</p>\n<p>But as the Nuclear Regulatory Commission (NRC) / reviews the company&#39;s application, / it should keep in mind / what promises from Entergy are worth.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>该公司似乎已经得出结论 / 它在佛蒙特州的声誉 / 已经如此受损 / 以至于它没有什么可失去的了 / 通过与该州开战。</p>\n<p>但应该有后果。</p>\n<p>运营核电站的许可 / 是一项公共信任。</p>\n<p>Entergy运营着另外11个反应堆 / 在美国，/ 包括朝圣者核电站 / 在普利茅斯。</p>\n<p>承诺安全运营朝圣者核电站，/ 该公司已经申请 / 联邦许可 / 保持它开放 / 再运营20年。</p>\n<p>但当核管理委员会（NRC）/ 审查该公司的申请时，/ 它应该记住 / Entergy的承诺价值几何。</p>\n<h3>标准译文 · 第6段</h3>\n<p>该公司似乎已经得出结论：它在佛蒙特州的声誉已经严重受损，与该州开战也没什么可失去的了。但这应该有后果。运营核电站的许可是一项公共信任。Entergy在美国运营着另外11个反应堆，包括位于普利茅斯的朝圣者核电站。该公司承诺安全运营朝圣者核电站，并已申请联邦许可再运营20年。但当核管理委员会（NRC）审查该公司的申请时，应该记住Entergy的承诺究竟价值几何。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>A deal is a deal -- except, apparently：(when Entergy is involved).</p>\n<p>The company：(a major energy supplier in New England) → provoked justified outrage：(in Vermont last week)：(when it announced：(it was reneging on → a longstanding commitment：(to abide by → the state&#39;s strict nuclear regulations))).</p>\n<p><strong>第2段</strong></p>\n<p>Instead → the company has done → precisely what：(it had long promised → it would not)：challenge the constitutionality：(of Vermont&#39;s rules)：(in the federal court)，as part of a desperate effort：(to keep its Vermont Yankee nuclear power plant running).</p>\n<p>It&#39;s a stunning move.</p>\n<p><strong>第3段</strong></p>\n<p>The conflict has been surfacing：(since 2002)：(when the corporation bought → Vermont&#39;s only nuclear power plant：(an aging reactor in Vernon)).</p>\n<p>As a condition：(of receiving state approval：(for the sale)) → the company agreed → to seek permission：(from state regulators)：(to operate past 2012).</p>\n<p>In 2006 → the state went a step further → requiring：(that any extension of the plant&#39;s license → be subject to → the Vermont legislature&#39;s approval).</p>\n<p>Then, too → the company went along.</p>\n<p><strong>第4段</strong></p>\n<p>Either Entergy never really intended：(to live by those commitments) // or it simply didn&#39;t foresee：(what would happen next).</p>\n<p>A string of accidents：(including the partial collapse：(of a cooling tower in 2007) + the discovery：(of an underground pipe system leakage)) → raised serious questions：(about both Vermont Yankee&#39;s safety + Entergy&#39;s management) -- especially after：(the company made misleading statements：(about the pipe)).</p>\n<p>Enraged by Entergy&#39;s behavior → the Vermont Senate voted：(26 to 4 last year)：(against allowing an extension).</p>\n<p><strong>第5段</strong></p>\n<p>Now the company is suddenly claiming：(that the 2002 agreement is invalid：(because of the 2006 legislation)) + (that only the federal government → has regulatory power：(over nuclear issues)).</p>\n<p>The legal issues in the case are obscure：whereas the Supreme Court has ruled：(that states do have → some regulatory authority：(over nuclear power))，legal scholars say：(that Vermont case will offer → a precedent-setting test：(of how far those powers extend)).</p>\n<p>Certainly → there are valid concerns：(about the patchwork regulations：(that could result：(if every state sets its own rules))).</p>\n<p>But had Entergy kept its word // that debate would be → beside the point.</p>\n<p><strong>第6段</strong></p>\n<p>The company seems to have concluded：(that its reputation in Vermont → is already so damaged：(that it has nothing left to lose：(by going to war with the state))).</p>\n<p>But there should be consequences.</p>\n<p>Permission to run a nuclear plant → is a public trust.</p>\n<p>Entergy runs 11 other reactors：(in the United States)：(including Pilgrim Nuclear station：(in Plymouth)).</p>\n<p>Pledging to run Pilgrim safely → the company has applied：(for federal permission)：(to keep it open：(for another 20 years)).</p>\n<p>But as the Nuclear Regulatory Commission (NRC) → reviews the company&#39;s application → it should keep in mind：(what promises from Entergy are worth).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>协议就是协议 -- 除了，显然：(当Entergy涉及其中时)。</p>\n<p>这家公司：(新英格兰地区的主要能源供应商) → 引发了正当的愤怒：(在佛蒙特州上周)：(当它宣布：(它正在违背 → 一项长期承诺：(去遵守 → 该州严格的核能法规)))。</p>\n<p><strong>第2段</strong></p>\n<p>相反 → 这家公司已经做了 → 恰恰是：(它长期承诺 → 不会做的事)：挑战合宪性：(佛蒙特州规则的)：(在联邦法院)，作为绝望努力的一部分：(来保持其佛蒙特扬基核电站继续运行)。</p>\n<p>这是一个令人震惊的举动。</p>\n<p><strong>第3段</strong></p>\n<p>这个冲突一直在浮现：(自2002年以来)：(当这家公司购买了 → 佛蒙特州唯一的核电站：(位于弗农的一个老化反应堆))。</p>\n<p>作为一个条件：(获得州政府批准：(对于这次收购)) → 该公司同意 → 寻求许可：(从州监管机构)：(在2012年后继续运营)。</p>\n<p>在2006年 → 该州更进一步 → 要求：(任何电站许可证的延期 → 必须服从于 → 佛蒙特州议会的批准)。</p>\n<p>那时，同样 → 该公司也同意了。</p>\n<p><strong>第4段</strong></p>\n<p>要么Entergy从未真正打算：(遵守这些承诺) // 或者它只是没有预见到：(接下来会发生什么)。</p>\n<p>一连串的事故：(包括部分倒塌：(一座冷却塔的在2007年) + 发现：(地下管道系统泄漏)) → 引发了严重的质疑：(关于佛蒙特扬基的安全性 + Entergy的管理) -- 尤其是在：(该公司做出误导性声明：(关于管道))之后。</p>\n<p>被Entergy的行为激怒 → 佛蒙特州参议院投票：(以26比4去年)：(反对允许延期)。</p>\n<p><strong>第5段</strong></p>\n<p>现在该公司突然声称：(2002年的协议无效：(因为2006年的立法)) + (只有联邦政府 → 拥有监管权力：(对核能问题))。</p>\n<p>该案中的法律问题是模糊的：尽管最高法院已经裁定：(各州确实拥有 → 一些监管权力：(对核能))，法律学者说：(佛蒙特案将提供 → 一个设定先例的测试：(关于这些权力延伸多远))。</p>\n<p>当然 → 存在合理的担忧：(关于拼凑的法规：(可能产生的：(如果每个州设定自己的规则)))。</p>\n<p>但如果Entergy遵守了承诺 // 这场辩论就会 → 无关紧要。</p>\n<p><strong>第6段</strong></p>\n<p>该公司似乎已经得出结论：(它在佛蒙特州的声誉 → 已经如此受损：(以至于它没有什么可失去的了：(通过与该州开战)))。</p>\n<p>但应该有后果。</p>\n<p>运营核电站的许可 → 是一项公共信任。</p>\n<p>Entergy运营着另外11个反应堆：(在美国)：(包括朝圣者核电站：(在普利茅斯))。</p>\n<p>承诺安全运营朝圣者核电站 → 该公司已经申请：(联邦许可)：(保持它开放：(再运营20年))。</p>\n<p>但当核管理委员会（NRC）→ 审查该公司的申请时 → 它应该记住：(Entergy的承诺价值几何)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state&#39;s strict nuclear regulations.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The company, / a major energy supplier in New England, / provoked justified outrage / in Vermont last week / when it announced / it was reneging on / a longstanding commitment / to abide by / the state&#39;s strict nuclear regulations.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>这家公司，/ 新英格兰地区的主要能源供应商，/ 引发了正当的愤怒 / 在佛蒙特州上周 / 当它宣布 / 它正在违背 / 一项长期承诺 / 去遵守 / 该州严格的核能法规。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把新英格兰的能源供应商身份并到公司名称后；把遵守州严格核电规则作为承诺的具体内容。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>这家公司， 新英格兰地区的主要能源供应商， 引发了正当的愤怒  在佛蒙特州上周  当它宣布  它正在违背  一项长期承诺  去遵守  该州严格的核能法规。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这家主要能源供应商宣布违背承诺，引发愤怒。</p>\n</blockquote>\n<p>先交代公司，再说何时、在何地引发愤怒，最后用宣布违背承诺解释起因。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>上周，这家新英格兰地区的主要能源供应商在佛蒙特州引发了正当的公愤，因为它宣布将违背其长期以来遵守该州严格核能法规的承诺。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>justified是对愤怒有根据的评价，不能省成只说愤怒；reneging on明确是违背承诺。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>上周，这家新英格兰地区的主要能源供应商在佛蒙特州引发了正当的公愤，因为它宣布将违背其长期以来遵守该州严格核能法规的承诺。</p>\n</blockquote>\n<h2>2. 第3段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>As a condition / of receiving state approval / for the sale, / the company agreed / to seek permission / from state regulators / to operate past 2012.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>作为一个条件 / 获得州政府批准 / 对于这次收购，/ 该公司同意 / 寻求许可 / 从州监管机构 / 在2012年后继续运营。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把获得州批准交易看作条件框架；再把seek permission与operate past 2012连起来。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>作为一个条件  获得州政府批准  对于这次收购， 该公司同意  寻求许可  从州监管机构  在2012年后继续运营。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>公司同意在2012年以后继续运行前取得许可。</p>\n</blockquote>\n<p>中文先说为获得交易批准，公司答应什么，最后点明继续运行的时间范围。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>作为获得州政府批准收购的条件，该公司同意在2012年后继续运营需要向州监管机构申请许可。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>approval for the sale是购厂交易许可，不应译成已经得到运营延期。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>作为获得州政府批准收购的条件，该公司同意在2012年后继续运营需要向州监管机构申请许可。</p>\n</blockquote>\n<h2>3. 第6段第6句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>But as the Nuclear Regulatory Commission (NRC) reviews the company&#39;s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>But as the Nuclear Regulatory Commission (NRC) / reviews the company&#39;s application, / it should keep in mind / what promises from Entergy are worth.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但当核管理委员会（NRC）/ 审查该公司的申请时，/ 它应该记住 / Entergy的承诺价值几何。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把as引出的审查过程放在时间背景中；keep in mind的宾语是Entergy承诺究竟值多少。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>但当核管理委员会（NRC） 审查该公司的申请时， 它应该记住  Entergy的承诺价值几何。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>监管委员会审查申请时，应记住承诺的分量。</p>\n</blockquote>\n<p>先说审查申请的机构与时间，再落到应当审视的信用问题。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但当核管理委员会（NRC）审查该公司的申请时，应该记住Entergy的承诺究竟价值几何。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>what promises ... are worth在此指承诺的可信度与分量，不是承诺的货币价值。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但当核管理委员会（NRC）审查该公司的申请时，应该记住Entergy的承诺究竟价值几何。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能
