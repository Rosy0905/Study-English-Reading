<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| deal | n.协议 | involved | adj.涉及的 | supplier | n.供应商 |\n| provoked | v.引发 | justified | adj.有正当理由的 | outrage | n.愤怒 |\n| commitment | n.承诺 | abide by | 遵守 | regulations | n.规章 |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,123,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>deal</td>\n<td>n.协议</td>\n<td>involved</td>\n<td>adj.涉及的</td>\n<td>supplier</td>\n<td>n.供应商</td>\n</tr>\n<tr>\n<td>provoked</td>\n<td>v.引发</td>\n<td>justified</td>\n<td>adj.有正当理由的</td>\n<td>outrage</td>\n<td>n.愤怒</td>\n</tr>\n<tr>\n<td>commitment</td>\n<td>n.承诺</td>\n<td>abide by</td>\n<td>遵守</td>\n<td>regulations</td>\n<td>n.规章</td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| precisely | adv.恰恰 | promised | v.承诺 | challenge | v.质疑 |\n| constitutionality | n.合宪性 | federal | adj.联邦的 | desperate | adj.孤注一掷的 |\n| effort | n.努力 | stunning | adj.令人震惊的 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,549,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>precisely</td>\n<td>adv.恰恰</td>\n<td>promised</td>\n<td>v.承诺</td>\n<td>challenge</td>\n<td>v.质疑</td>\n</tr>\n<tr>\n<td>constitutionality</td>\n<td>n.合宪性</td>\n<td y and Entergy’s management – especially after the company made misleading statements about the pipe. Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,1751,900,481],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t foresee what would happen next. A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management – especially after the company made misleading statements about the pipe. Enraged by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n</section>"},{"title":"第4段","raw":"### 意群划分 · 第4段\n\nEither Entergy never really intended / to live by those commitments, / or it simply didn't foresee / what would happen next.\n\nA string of accidents, / including the partial collapse / of a cooling tower in 2007 / and the discovery / of an underground pipe system leakage, / raised serious questions / about both Vermont Yankee's safety / and Entergy's management -- / especially after / the company made misleading statements / about the pipe.\n\nEnraged by Entergy's behavior, / the Vermont Senate voted / 26 to 4 last year / against allowing an extension.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,1751,900,481],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cu olars say / that Vermont case will offer / a precedent-setting test / of how far those powers extend.</p>\n<p>Certainly, / there are valid concerns / about the patchwork regulations / that could result / if every state sets its own rules.</p>\n<p>But had Entergy kept its word, / that debate would be / beside the point.</p>\n</section>"},{"title":"第5段","raw":"### 意群翻译 · 第5段\n\n现在该公司突然声称 / 2002年的协议无效 / 因为2006年的立法，/ 并且只有联邦政府 / 拥有监管权力 / 对核能问题。\n\n该案中的法律问题是模糊的：/ 尽管最高法院已经裁定 / 各州确实拥有 / 一些监管权力 / 对核能，/ 法律学者说 / 佛蒙特案将提供 / 一个设定先例的测试 / 关于这些权力延伸多远。\n\n当然，/ 存在合理的担忧 / 关于拼凑的法规 / 可能产生的 / 如果每个州设定自己的规则。\n\n但如果Entergy遵守了承诺，/ 这场辩论就会 / 无关紧要。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,2505,900,700],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend. Certainly, there are valid concerns about the patchwork regulations that could result if every state sets its own rules. But had Entergy kept its word, that debate would be beside the point.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>Now the company is suddenly claiming / that the 2002 agreement is invalid / because of the 2006 legislation, / and that only the federal government / has regulatory power / over nuclear issues.</p>\n<p>The legal issues in the case are obscure: / whereas the Supreme Court has ruled / that states do have / some regulatory authority / over nuclear power, / legal scholars say / that Vermont case will offer / a precedent-setting test / of how far those powers extend.</p>\n<p>Certainly, / there are valid concerns / about the patchwork regulations / that could result / if every state sets its own rules.</p>\n<p>But had Entergy kept its word, / that debate would be / beside the point.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>现在该公司突然声称 / 2002年的协议无效 / 因为2006年的立法，/ 并且只有联邦政府 / 拥有监管权力 / 对核能问题。</p>\n<p>该案中的法律问题是模糊的：/ 尽管最高法院已经裁定 / 各州确实拥有 / 一些监管权力 / 对核能，/ 法律学者说 / 佛蒙特案将提供 / 一个设定先例的测试 / 关于这些权力延伸多远。</p>\n<p>当然，/ 存在合理的担忧 / 关于拼凑的法规 / 可能产生的 / 如果每个州设定自己的规则。</p>\n<p>但如果Entergy遵守了承诺，/ 这场辩论就会 / 无关紧要。</p>\n</section>"},{"title":"第5段","raw":"### 标准译文 · 第5段\n\n现在该公司突然声称2002年的协议因2006年的立法而无效，并且只有联邦政府对核能问题拥有监管权力。该案中的法律问题颇为复杂：虽然最高法院已裁定各州确实对核能拥有一定的监管权力，但法律学者表示，佛蒙特案将为这些权力的边界提供一个具有先例意义的测试。<font style=\"color:black;\">以确定州政府的权力的范围有多大</font><font style=\"color:black;\">。</font>当然，如果每个州都制定自己的规则，由此产生的拼凑式法规确实令人担忧。但如果Entergy信守承诺，这场辩论就无关紧要了。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,2505,900,700],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true},"focusId":"focus-paragraph-5-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are obscure: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend. Certainly, ther ing Pilgrim Nuclear station / in Plymouth.</p>\n<p>Pledging to run Pilgrim safely, / the company has applied / for federal permission / to keep it open / for another 20 years.</p>\n<p>But as the Nuclear Regulatory Commission (NRC) / reviews the company&#39;s application, / it should keep in mind / what promises from Entergy are worth.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-2\"><h3>意群翻译 · 第6段</h3>\n<p>该公司似乎已经得出结论 / 它在佛蒙特州的声誉 / 已经如此受损 / 以至于它没有什么可失去的了 / 通过与该州开战。</p>\n<p>但应该有后果。</p>\n<p>运营核电站的许可 / 是一项公共信任。</p>\n<p>Entergy运营着另外11个反应堆 / 在美国，/ 包括朝圣者核电站 / 在普利茅斯。</p>\n<p>承诺安全运营朝圣者核电站，/ 该公司已经申请 / 联邦许可 / 保持它开放 / 再运营20年。</p>\n<p>但当核管理委员会（NRC）/ 审查该公司的申请时，/ 它应该记住 / Entergy的承诺价值几何。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-3\"><h3>标准译文 · 第6段</h3>\n<p>该公司似乎已经得出结论：它在佛蒙特州的声誉已经严重受损，与该州开战也没什么可失去的了。但这应该有后果。运营核电站的许可是一项公共信任。Entergy在美国运营着另外11个反应堆，包括位于普利茅斯的朝圣者核电站。该公司承诺安全运营朝圣者核电站，并已申请联邦许可再运营20年。但当核管理委员会（NRC）审查该公司的申请时，应该记住Entergy的承诺究竟价值几何。</p>\n</section>"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>"},{"title":"句子逻辑梳理（选修）","raw":"## 句子逻辑梳理（选修）\n\n**第1段**\n\nA deal is a deal -- except, apparently：(when Entergy is involved).\n\nThe company：(a major energy supplier in New England) → provoked justified outrage：(in Vermont last week)：(when it ations：(that could result：(if every state sets its own rules))).\n\nBut had Entergy kept its word // that debate would be → beside the point.\n\n**第6段**\n\nThe company seems to have concluded：(that its reputation in Vermont → is already so damaged：(that it has nothing left to lose：(by going to war with the state))).\n\nBut there should be consequences.\n\nPermission to run a nuclear plant → is a public trust.\n\nEntergy runs 11 other reactors：(in the United States)：(including Pilgrim Nuclear station：(in Plymouth)).\n\nPledging to run Pilgrim safely → the company has applied：(for federal permission)：(to keep it open：(for another 20 years)).\n\nBut as the Nuclear Regulatory Commission (NRC) → reviews the company's application → it should keep in mind：(what promises from Entergy are worth).","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>A deal is a deal -- except, apparently：(when Entergy is involved).</p>\n<p>The company：(a major energy supplier in New England) → provoked justified outrage：(in Vermont last week)：(when it announced：(it was reneging on → a longstanding commitment：(to abide by → the state&#39;s strict nuclear regulations))).</p>\n<p><strong>第2段</strong></p>\n<p>Instead → the company has done → precisely what：(it had long promised → it would not)：challenge the constitutionality：(of Vermont&#39;s rules)：(in the federal court)，as part of a desperate effort：(to keep its Vermont Yankee nuclear power plant running).</p>\n<p>It&#39;s a stunning move.</p>\n<p><strong>第3段</strong></p>\n<p>The conflict has been surfacing：(since 2002)：(when the corporation bought → Vermont&#39;s only nuclear power plant：(an aging reactor in Vernon)).</p>\n<p>As a condition：(of receiving state approval：(for the sale)) → the company agreed → to seek permission：(from state regulators)：(to operate past 2012).</p>\n<p>In 2006 → the sta al permission)：(to keep it open：(for another 20 years)).</p>\n<p>But as the Nuclear Regulatory Commission (NRC) → reviews the company&#39;s application → it should keep in mind：(what promises from Entergy are worth).</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n协议就是协议 -- 除了，显然：(当Entergy涉及其中时)。\n\n这家公司：(新英格兰地区的主要能源供应商) → 引发了正当的愤怒：(在佛蒙特州上周)：(当它宣布：(它正在违背 → 一项长期承诺：(去遵守 → 该州严格的核能法规)))。\n\n**第2段**\n\n相反 → 这家公司已经做了 → 恰恰是：(它长期承诺 → 不会做的事)：挑战合宪性：(佛蒙特州规则的)：(在联邦法院)，作为绝望努力的一部分：(来保持其佛蒙特扬基核电站继续运行)。\n\n这是一个令人震惊的举动。\n\n**第3段**\n\n这个冲突一直在浮现：(自2002年以来)：(当这家公司购买了 → 佛蒙特州唯一的核电站：(位于弗农的一个老化反应堆))。\n\n作为一个条件：(获得州政府批准：(对于这次收购)) → 该公司同意 → 寻求许可：(从州监管机构)：(在2012年后继续运营)。\n\n在2006年 → 该州更进一步 → 要求：(任何电站许可证的延期 → 必须服从于 → 佛蒙特州议会的批准)。\n\n那时，同样 → 该公司也同意了。\n\n**第4段**\n\n要么Entergy从未真正打算：(遵守这些承诺) // 或者它只是没有预见到：(接下来会发生什么)。\n\n一连串的事故：(包括部分倒塌：(一座冷却塔的在2007年) + 发现：(地下管道系统泄漏)) → 引发了严重的质疑：(关于佛蒙特扬基的安全性 + Entergy的管理) -- 尤其是在：(该公司做出误导性声明：(关于管道))之后。\n\n被Entergy的行为激怒 → 佛蒙特州参议院投票：(以26比4去年)：(反对允许延期)。\n\n**第5段**\n\n现在该公司突然声称：(2002年的协议无效：(因为2006年的立法)) + (只有联邦政府 → 拥有监管权力：(对核能问题))。\n\n该案中的法律问题是模糊的：尽管最高法院已经裁定：(各州确实拥有 → 一些监管权力：(对核能))，法律学者说：(佛蒙特案将提供 → 一个设定先例的测试：(关于这些权力延伸多远))。\n\n当然 → 存在合理的担忧：(关于拼凑的法规：(可能产生的：(如果每个州设定自己的规则)))。\n\n但如果Entergy遵守了承诺 // 这场辩论就会 → 无关紧要。\n\n**第6段**\n\n该公司似乎已经得出结论：(它在佛蒙特州的声誉 → 已经如此受损：(以至于它没有什么可失去的了：(通过与该州开战)))。\n\n但应该有后果。\n\n运营核电站的许可 → 是一项公共信任。\n\nEntergy运营着另外11个反应堆：(在美国)：(包括朝圣者核电站：(在普利茅斯))。\n\n承诺安全运营朝圣者核电站 → 该公司已经申请：(联邦许可)：(保持它开放：(再运营20年))。\n\n但当核管理委员会（NRC）→ 审查该公司的申请时 → 它应该记住：(Entergy的承诺价值几何)。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>协议就是协议 -- 除了，显然：(当Entergy涉及其中时)。</p>\n<p>这家公司：(新英格兰地区的主要能源供应商) → 引发了正当的愤怒：(在佛蒙特州上周)：(当它宣布：(它正在违背 → 一项长期承诺：(去遵守 → 该州严格的核能法规)))。</p>\n<p><strong>第2段</strong></p>\n<p>相反 → 这家公司已经做了 → 恰恰是：(它长期承诺 → 不会做的事)：挑战合宪性：(佛蒙特州规则的)：(在联邦法院)，作为绝望努力的一部分：(来保持其佛蒙特扬基核电站继续运行)。</p>\n<p>这是一个令人震惊的举动。</p>\n<p><strong>第3段</s 例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> The phrase “reneging on” (Line 3, Para. 1) is closest in meaning to ______.\n>\n> 第一段reneging on最接近哪个意思？\n\n### 题型\n\n词义题。把短语放回commitment之前，再用下一段的实际行动检验含义。\n\n不能只凭outrage一类情绪词挑负面选项，关键是has done与promised it would not之间的相反关系。\n\n### 核心出处\n\n> The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations\n>\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"26","questionIntro":true},"html":"<blockquote>\n<p>The phrase “reneging on” (Line 3, Para. 1) is closest in meaning to ______.</p>\n<p>第一段reneging on最接近哪个意思？</p>\n</blockquote>\n<h3>题型</h3>\n<p>词义题。把短语放回commitment之前，再用下一段的实际行动检验含义。</p>\n<p>不能只凭outrage一类情绪词挑负面选项，关键是has done与promised it would not之间的相反关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n"},{"title":"A. condemning","raw":"### A. condemning\n\n> reneging on表示谴责这项承诺。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n`condemning`是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。\n\n**出处：**\n\n> The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations\n>\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>condemning</code>是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section>"},{"title":"A. condemning","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> reneging on表示谴责这项承诺。\n\n把短语放回`a longstanding commitment to abide by ...`前面，先确定它所作用的对象是一项长期承诺：遵守州的严格核监管规定。\n\n第二段用`Instead`解释公司实际做了什么，`has done precisely what it had long promised it would not`是“恰恰做了长期以来承诺不会做的事”，随后冒号点出行动——向联邦法院挑战州规则的合宪性。\n\n`condemning`只表示谴责，可以用语言批评一个承诺，却没有表达行动违反承诺。这里的同义词必须保留承诺与实际行动相反的关系，A做不到。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>condemning</code>是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p>把短语放回<code>a longstanding commitment to abide by ...</code>前面，先确定它所作用的对象是一项长期承诺：遵守州的严格核监管规定。</p>\n<p>第二段用<code>Instead</code>解释公司实际做了什么，<code>has done precisely what it had long promised it would not</code>是“恰恰做了长期以来承诺不会做的事”，随后冒号点出行动——向联邦法院挑战州规则的合宪性。</p>\n<p><code>condemning</code>只表示谴责，可以用语言批评一个承诺，却没有表达行动违反承诺。这里的同义词必须保留承诺与实际行动相反的关系，A做不到。</p>\n</section>"},{"title":"A. condemning","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations\n>\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running\n>\n> 作为新英格兰一家主要能源供应商，公司宣布不履行遵守州严格核监管规定的长期承诺，在Vermont激起了有理由的愤怒。公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。\n\n第一段点出对承诺的态度发生变化，第二段没有列公司怎样批评承诺，而是用已经进行的法律挑战来具体解释这种变化。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The company publicly condemned its commitment, describing it as unreasonable.\n>\n> 公司公开谴责这项承诺，称它不合理。\n\nA需要负面评价的言辞；实际段落以`has done`展示违背承诺的行动。它不是没有发表过不满便绝不能诉讼，而是被考短语在这里要解释已经发生的失约。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>condemning</code>是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示谴责这项承诺。</p>\n</blockquote>\n<p>把短语放回<code>a longstanding commitment to abide by ...</code>前面，先确定它所作用的对象是一项长期承诺：遵守州的严格核监管规定。</p>\n<p>第二段用<code>Instead</code>解释公司实际做了什么，<code>has done precisely what it had long promised it would not</code>是“恰恰做了长期以来承诺不会做的事”，随后冒号点出行动——向联邦法院挑战州规则的合宪性。</p>\n<p><code>condemning</code>只表示谴责，可以用语言批评一个承诺，却没有表达行动违反承诺。这里的同义词必须保留承诺与实际行动相反的关系，A做不到。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>作为新英格兰一家主要能源供应商，公司宣布不履行遵守州严格核监管规定的长期承诺，在Vermont激起了有理由的愤怒。公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>第一段点出对承诺的态度发生变化，第二段没有列公司怎样批评承诺，而是用已经进行的法律挑战来具体解释这种变化。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company publicly condemned its commitment, describing it as unreasonable.</p>\n<p>公司公开谴责这项承诺，称它不合理。</p>\n</blockquote>\n<p>A需要负面评价的言辞；实际段落以<code>has done</code>展示违背承诺的行动。它不是没有发表过不满便绝不能诉讼，而是被考短语在这里要解释已经发生的失约。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. reaffirming","raw":"### B. reaffirming\n\n> reneging on表示重申这项承诺。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。\n\n**出处：**\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section>"},{"title":"B. reaffirming","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> reneging on表示重申这项承诺。\n\n`reaffirming`是再次肯定，接`commitment`就是重申自己仍会遵守原来的约定。这样代回首段，承诺应当得到继续确认。\n\n第二段的`Instead`接出相反事实：公司已经做了自己长期承诺不会做的事。`promised it would not`与`has done`指向同一项法律挑战，一个是否定的承诺，一个是已经发生的行动。\n\n因此上下文不是再次确认遵守州规定，而是以行动否定这项约定。即使公司仍可能在其他场合许下安全承诺，也不能用后文别的承诺改变本句的动作方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><code>reaffirming</code>是再次肯定，接<code>commitment</code>就是重申自己仍会遵守原来的约定。这样代回首段，承诺应当得到继续确认。</p>\n<p>第二段的<code>Instead</code>接出相反事实：公司已经做了自己长期承诺不会做的事。<code>promised it would not</code>与<code>has done</code>指向同一项法律挑战，一个是否定的承诺，一个是已经发生的行动。</p>\n<p>因此上下文不是再次确认遵守州规定，而是以行动否定这项约定。即使公司仍可能在其他场合许下安全承诺，也不能用后文别的承诺改变本句的动作方向。</p>\n</section>"},{"title":"B. reaffirming","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running\n>\n> 公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。\n\n作者先说公司在承诺问题上引起愤怒，再用`Instead`展开它怎样挑战州规则。后段为前面的失约提供实例，语气也继续谴责这一举动。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The company reaffirmed that it would continue to abide by Vermont’s nuclear regulations.\n>\n> 公司重申会继续遵守Vermont的核监管规定。\n\nB要求后面继续确认守约，实际后文却列出曾承诺不做而如今已做的行为。重申与违背在这项约定上方向相反。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示重申这项承诺。</p>\n</blockquote>\n<p><code>reaffirming</code>是再次肯定，接<code>commitment</code>就是重申自己仍会遵守原来的约定。这样代回首段，承诺应当得到继续确认。</p>\n<p>第二段的<code>Instead</code>接出相反事实：公司已经做了自己长期承诺不会做的事。<code>promised it would not</code>与<code>has done</code>指向同一项法律挑战，一个是否定的承诺，一个是已经发生的行动。</p>\n<p>因此上下文不是再次确认遵守州规定，而是以行动否定这项约定。即使公司仍可能在其他场合许下安全承诺，也不能用后文别的承诺改变本句的动作方向。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>作者先说公司在承诺问题上引起愤怒，再用<code>Instead</code>展开它怎样挑战州规则。后段为前面的失约提供实例，语气也继续谴责这一举动。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company reaffirmed that it would continue to abide by Vermont’s nuclear regulations.</p>\n<p>公司重申会继续遵守Vermont的核监管规定。</p>\n</blockquote>\n<p>B要求后面继续确认守约，实际后文却列出曾承诺不做而如今已做的行为。重申与违背在这项约定上方向相反。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. dishonoring","raw":"### C. dishonoring\n\n> reneging on表示不履行这项承诺。\n\n**做题模式中的状态：** 第一轮保留C，此时C尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n`dishonoring a commitment`是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。\n\n**出处：**\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-C-0\"><blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>dishonoring a commitment</code>是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section>"},{"title":"C. dishonoring","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> reneging on表示不履行这项承诺。\n\n`dishonoring`接承诺时，意思是不遵守、不履行。原句的承诺内容是`abide by the state’s strict nuclear regulations`，即遵守州的核监管规定。\n\n第二段把不履行的事实补全：公司以前承诺不会采取的行动，现在`has done precisely`，即已经恰恰做了。冒号后的挑战州规则合宪性，让我们看见承诺具体如何被违反。\n\n所以这不是只靠首段的愤怒猜一个负面词，而是由后段行为与前段约定的对照确定含义。C保留的是失信这一关系，与`reneging on`在这里的用法一致。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-C-0\"><blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>dishonoring a commitment</code>是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><code>dishonoring</code>接承诺时，意思是不遵守、不履行。原句的承诺内容是<code>abide by the state’s strict nuclear regulations</code>，即遵守州的核监管规定。</p>\n<p>第二段把不履行的事实补全：公司以前承诺不会采取的行动，现在<code>has done precisely</code>，即已经恰恰做了。冒号后的挑战州规则合宪性，让我们看见承诺具体如何被违反。</p>\n<p>所以这不是只靠首段的愤怒猜一个负面词，而是由后段行为与前段约定的对照确定含义。C保留的是失信这一关系，与<code>reneging on</code>在这里的用法一致。</p>\n</section>"},{"title":"C. dishonoring","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running\n>\n> 公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。\n\n被考短语后先给承诺内容，下一段再从承诺转到实际行动，并明确把两者放成相反关系。这是用后面的事实解释前面的概括。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The company broke its commitment by taking the legal action it had promised not to take.\n>\n> 公司采取了先前承诺不会采取的法律行动，违背了自己的承诺。\n\nC所需的不履行有明确行为支撑。后面的法院挑战不是新加的猜测，而是冒号直接写出的事例，因此能回到首段解释这个短语。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-C-0\"><blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p><code>dishonoring a commitment</code>是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示不履行这项承诺。</p>\n</blockquote>\n<p><code>dishonoring</code>接承诺时，意思是不遵守、不履行。原句的承诺内容是<code>abide by the state’s strict nuclear regulations</code>，即遵守州的核监管规定。</p>\n<p>第二段把不履行的事实补全：公司以前承诺不会采取的行动，现在<code>has done precisely</code>，即已经恰恰做了。冒号后的挑战州规则合宪性，让我们看见承诺具体如何被违反。</p>\n<p>所以这不是只靠首段的愤怒猜一个负面词，而是由后段行为与前段约定的对照确定含义。C保留的是失信这一关系，与<code>reneging on</code>在这里的用法一致。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>被考短语后先给承诺内容，下一段再从承诺转到实际行动，并明确把两者放成相反关系。这是用后面的事实解释前面的概括。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company broke its commitment by taking the legal action it had promised not to take.</p>\n<p>公司采取了先前承诺不会采取的法律行动，违背了自己的承诺。</p>\n</blockquote>\n<p>C所需的不履行有明确行为支撑。后面的法院挑战不是新加的猜测，而是冒号直接写出的事例，因此能回到首段解释这个短语。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. securing","raw":"### D. securing\n\n> reneging on表示保障这项承诺。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n`securing`通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。\n\n**出处：**\n\n> The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations\n>\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>securing</code>通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section>"},{"title":"D. securing","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> reneging on表示保障这项承诺。\n\nD的`securing`若与`commitment`连用，方向是取得、确保或巩固承诺，至少不会把承诺与行为读成已经背离。\n\n原文对现状的解释是`done precisely what ... promised ... not`。先前答应遵守的州规则，现在被公司拿到联邦法院挑战，作者正以这项行动说明旧约定没有被履行。\n\n公司想保住核电站继续运营，是另一个目的；不能因为它想“保障运营”，就让被考短语也变成“保障承诺”。短语的宾语是`commitment`，不是电站运营。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>securing</code>通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p>D的<code>securing</code>若与<code>commitment</code>连用，方向是取得、确保或巩固承诺，至少不会把承诺与行为读成已经背离。</p>\n<p>原文对现状的解释是<code>done precisely what ... promised ... not</code>。先前答应遵守的州规则，现在被公司拿到联邦法院挑战，作者正以这项行动说明旧约定没有被履行。</p>\n<p>公司想保住核电站继续运营，是另一个目的；不能因为它想“保障运营”，就让被考短语也变成“保障承诺”。短语的宾语是<code>commitment</code>，不是电站运营。</p>\n</section>"},{"title":"D. securing","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations\n>\n> Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running\n>\n> 公司宣布不履行遵守州严格核监管规定的长期承诺。公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。\n\n第二段说公司为了让核电站继续运行而发起挑战。这解释了它的行为目的，却同时显示它与先前的守约承诺相背。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The company took steps to ensure that its commitment to obey the state’s rules would be upheld.\n>\n> 公司采取措施，确保其遵守州规则的承诺得到履行。\n\nD需要巩固或确保守约的行动。实际公司采取的是先前承诺不会采取的挑战，把保住运营的目的移到承诺上，会混淆两个不同对象。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>securing</code>通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>reneging on表示保障这项承诺。</p>\n</blockquote>\n<p>D的<code>securing</code>若与<code>commitment</code>连用，方向是取得、确保或巩固承诺，至少不会把承诺与行为读成已经背离。</p>\n<p>原文对现状的解释是<code>done precisely what ... promised ... not</code>。先前答应遵守的州规则，现在被公司拿到联邦法院挑战，作者正以这项行动说明旧约定没有被履行。</p>\n<p>公司想保住核电站继续运营，是另一个目的；不能因为它想“保障运营”，就让被考短语也变成“保障承诺”。短语的宾语是<code>commitment</code>，不是电站运营。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state’s strict nuclear regulations</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the constitutionality of Vermont’s rules in the federal court, as part of a desperate effort to keep its Vermont Yankee nuclear power plant running</p>\n<p>公司宣布不履行遵守州严格核监管规定的长期承诺。公司恰恰做了它长期以来承诺不会做的事：向联邦法院挑战Vermont规则的合宪性，以求让Vermont Yankee核电站继续运行。</p>\n</blockquote>\n<p>第二段说公司为了让核电站继续运行而发起挑战。这解释了它的行为目的，却同时显示它与先前的守约承诺相背。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The company took steps to ensure that its commitment to obey the state’s rules would be upheld.</p>\n<p>公司采取措施，确保其遵守州规则的承诺得到履行。</p>\n</blockquote>\n<p>D需要巩固或确保守约的行动。实际公司采取的是先前承诺不会采取的挑战，把保住运营的目的移到承诺上，会混淆两个不同对象。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. C**\n\n- A：condemning是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。\n- B：重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。\n- C：dishonoring a commitment是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。\n- D：securing通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"26","questionConclusion":true},"html":"<blockquote>\n<p><strong>26. C</strong></p>\n</blockquote>\n<ul>\n<li>A：condemning是作出负面评价。原文描述的却是公司已经做了曾经承诺不做的事，关键在不履行承诺，而不只是说承诺不好。</li>\n<li>B：重申意味着再次确认原来的承诺，下一段却写实际行动与承诺相反，B把关系的方向读反了。</li>\n<li>C：dishonoring a commitment是不履行承诺，与公司已经做出先前承诺不做的法律挑战对应。</li>\n<li>D：securing通常指取得或使之稳固。这里公司没有确保承诺得到落实，而是在做承诺所排除的事情。</li>\n</ul>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> By entering into the 2002 agreement, Entergy intended to ______.\n>\n> Entergy签订2002年协议时，是为了什么？\n\n### 题型\n\n目的细节题。题干限定2002年的协议，重点拆清眼前取得什么批准、为此接受什么未来条件。\n\nAs a condition of receiving state approval for the sale限定交易目的，后面的seek permission说将来再运营时须履行的程序。\n\n### 核心出处\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n>\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval\n>\n> The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"27","questionIntro":true},"html":"<blockquote>\n<p>By entering into the 2002 agreement, Entergy intended to ______.</p>\n<p>Entergy签订2002年协议时，是为了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>目的细节题。题干限定2002年的协议，重点拆清眼前取得什么批准、为此接受什么未来条件。</p>\n<p>As a condition of receiving state approval for the sale限定交易目的，后面的seek permission说将来再运营时须履行的程序。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n<p>The conflict has been surfacing since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon</p>\n</blockquote>\n"},{"title":"A. obtain protection from Vermont regulators","raw":"### A. obtain protection from Vermont regulators\n\n> Entergy签订2002年协议，是为了得到Vermont监管者的保护。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。\n\n**出处：**\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n</section>"},{"title":"A. obtain protection from Vermont regulators","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Entergy签订2002年协议，是为了得到Vermont监管者的保护。\n\n第三段先交代公司在2002年购买核电站，随后`As a condition of receiving state approval for the sale`说明获准交易必须接受的条件。\n\n`approval for the sale`是对买卖行为的许可；`the company agreed to seek permission ... past 2012`才是公司为此答应以后履行的程序。州在这里是在批准交易并保留未来监管权限。\n\nA的`protection from Vermont regulators`要求监管者保护公司，原文没有说明保护它免受哪种风险或责任。获得监管批准与得到监管者庇护不能互换，真正的目的已经被`for the sale`限定。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p>第三段先交代公司在2002年购买核电站，随后<code>As a condition of receiving state approval for the sale</code>说明获准交易必须接受的条件。</p>\n<p><code>approval for the sale</code>是对买卖行为的许可；<code>the company agreed to seek permission ... past 2012</code>才是公司为此答应以后履行的程序。州在这里是在批准交易并保留未来监管权限。</p>\n<p>A的<code>protection from Vermont regulators</code>要求监管者保护公司，原文没有说明保护它免受哪种风险或责任。获得监管批准与得到监管者庇护不能互换，真正的目的已经被<code>for the sale</code>限定。</p>\n</section>"},{"title":"A. obtain protection from Vermont regulators","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n>\n> 为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。\n\n作者把购厂时间与协议条件紧接在一起，先说完成交易，再说明为获得州批准，公司接受了将来继续运营须另行申请的约定。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Entergy accepted the agreement in order to obtain protection from Vermont’s regulators.\n>\n> Entergy接受协议，是为了获得Vermont监管者的保护。\n\nA需要协议给公司带来保护。实际约定给公司增加了将来申请许可的义务，换取的是眼前购厂交易的批准，没有建立保护关系。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文所需的是购厂交易获批。A保留监管者，却把批准交易换成保护公司，改变了协议所换取的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了得到Vermont监管者的保护。</p>\n</blockquote>\n<p>第三段先交代公司在2002年购买核电站，随后<code>As a condition of receiving state approval for the sale</code>说明获准交易必须接受的条件。</p>\n<p><code>approval for the sale</code>是对买卖行为的许可；<code>the company agreed to seek permission ... past 2012</code>才是公司为此答应以后履行的程序。州在这里是在批准交易并保留未来监管权限。</p>\n<p>A的<code>protection from Vermont regulators</code>要求监管者保护公司，原文没有说明保护它免受哪种风险或责任。获得监管批准与得到监管者庇护不能互换，真正的目的已经被<code>for the sale</code>限定。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>为了取得州对这笔交易的批准，公司同意在2012年以后继续运营前向州监管者申请许可。</p>\n</blockquote>\n<p>作者把购厂时间与协议条件紧接在一起，先说完成交易，再说明为获得州批准，公司接受了将来继续运营须另行申请的约定。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Entergy accepted the agreement in order to obtain protection from Vermont’s regulators.</p>\n<p>Entergy接受协议，是为了获得Vermont监管者的保护。</p>\n</blockquote>\n<p>A需要协议给公司带来保护。实际约定给公司增加了将来申请许可的义务，换取的是眼前购厂交易的批准，没有建立保护关系。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. seek favor from the federal legislature","raw":"### B. seek favor from the federal legislature\n\n> Entergy签订2002年协议，是为了争取联邦立法机关的好感。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。\n\n**出处：**\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n>\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-B-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了争取联邦立法机关的好感。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n</section>"},{"title":"B. seek favor from the federal legislature","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Entergy签订2002年协议，是为了争取联邦立法机关的好感。\n\n先看层级：原文说`state approval`和`state regulators`，都是州这一层面的许可和监管。2006年后来加入的也是`Vermont legislature`，仍是州立法机关。\n\nB写`federal legislature`，把机构改成联邦立法机关；`seek favor`又把动作从获得一项具体交易许可，改成争取支持或好感。\n\n后文出现联邦法院，是公司后来挑战州规则的地点，不属于2002年购厂协议的目的。题目有明确时间，不能把其他年份出现的联邦机构搬过来，也不能把法院改成立法机关。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-B-0\"><blockquote>\n<p>Entergy签订2002年协议，是为了争取联邦立法机关的好感。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>2002年的许可来自州，目标是购厂交易获批。B把机构换成联邦立法机关，又把具体批准换成争取好感。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n<p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont legislature’s approval</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Entergy签订2002年协议，是为了争取联邦立法机关的好感。</p>\n</blockquote>\n<p>先看层级：原文说<code>state approval</code>和<code>state regulators</code>，都是州这一层面的许可和监管。2006年后来加入的也是<code>Vermont legislature</code>，仍是州立法机关。</p>\n<p>B写<code>federal legislature</code>，把机构改成联邦立法机关；<code>seek favor</code>又把动作从获得一项具体交易许可，改成争取支持或好感。</p>\n<p>后文出现联邦法院，是公司后来挑战州规则的地点，不属于2002年购厂协议的目的。题目有明确时间，不能把其他年份出现的联邦机构搬过来，也不能把法院改成立法机关。</p>\n</section>"},{"title":"B. seek favor
