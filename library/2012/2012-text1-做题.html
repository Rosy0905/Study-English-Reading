，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>21题题干</h2>\n<p><strong>According to the first paragraph, peer pressure often emerges as ______.</strong></p>\n<blockquote><p>根据第一段，同伴压力常常表现为什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>22题题干</h2>\n<p><strong>Rosenberg holds that public-health advocates should ______.</strong></p>\n<blockquote><p>Rosenberg认为，公共卫生倡导者应该怎样做？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>23题题干</h2>\n<p><strong>In the author’s view, Rosenberg’s book fails to ______.</strong></p>\n<blockquote><p>在作者看来，Rosenberg的书没有做到什么？</p>\n</blockquote>\n<p>题型：<strong>局部作者观点题</strong>。</p>\n\n<hr />\n<h2>24题题干</h2>\n<p><strong>Paragraph 5 shows that our imitation of behaviors ______.</strong></p>\n<blockquote><p>第五段说明，我们模仿行为时有什么特点？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n\n<hr />\n<h2>25题题干</h2>\n<p><strong>The author suggests in the last paragraph that the effect of peer pressure is, ______.</strong></p>\n<blockquote><p>作者在最后一段暗示，同伴压力的效果怎么样？</p>\n</blockquote>\n<p>题型：<strong>局部作者态度题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, however, as well as</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>positive, promising, less persuasive</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>improve, spread, imitate</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>failed, lasting changes</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>peer pressure, social cure, friends</td></tr></tbody></table>\n\n<hr />\n<p>Come on—Everybody’s doing it. That whispered message, half invitation and half forcing, is what most of us think of when we hear the words peer pressure. It usually leads to no good—drinking, drugs and casual sex. But in her new book Join the Club, Tina Rosenberg <strong>[xxx]</strong> that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n\n<hr />\n<p>Come on — / Everybody’s doing it. / That whispered message, / half invitation and half forcing, / is what most of us think of when we hear the words peer pressure. / It usually leads to no good — drinking, / drugs and casual sex. / But in her new book Join the Club, / Tina Rosenberg <strong>[xxx]</strong> that peer pressure can also be a positive force through what she calls the social cure, / in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n\n<hr />\n<p>Come on — / 大家都这么做. / That whispered message, / 一半邀请一半强迫, / is what 我们多数人想到 when we hear the words 同伴压力. / It usually leads to 没有好结果 — drinking, / drugs and casual sex. / But in 她的新书 Join the Club, / Tina Rosenberg <strong>[xxx]</strong> that peer pressure can also be 积极力量 through what she calls the social cure, / in which 组织和官员 use the power of group dynamics to 帮助个人 改善他们的生活 and 可能还有世界.</p>\n\n<hr />\n<p>1、大家都这么做、一半邀请一半强迫、我们多数人想到、同伴压力、没有好结果、她的新书、积极力量、组织和官员、帮助个人、改善他们的生活、可能还有世界。</p>\n\n<hr />\n<p>Rosenberg , the <strong>[xxx]</strong> of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking program called Rage Against the Haze sets out to make cigarettes uncool. In South Africa, an HIV-prevention <strong>[xxx]</strong> known as loveLife <strong>[xxx]</strong> young people to promote safe sex among their peers.</p>\n\n<hr />\n<p>Rosenberg , / the <strong>[xxx]</strong> of a Pulitzer Prize, / offers a host of examples of the social cure in action: / In South Carolina, / a state-sponsored antismoking program called Rage Against the Haze sets out to make cigarettes uncool. / In South Africa, / an HIV-prevention <strong>[xxx]</strong> known as loveLife <strong>[xxx]</strong> young people to promote safe sex among their peers.</p>\n\n<hr />\n<p>Rosenberg , / the <strong>[xxx]</strong> of a Pulitzer Prize, / offers a host of 例子 of the social cure in action: / In 南卡罗来纳, / a state-sponsored antismoking program called Rage Against the Haze sets out to make 香烟不酷. / In South Africa, / an HIV-prevention <strong>[xxx]</strong> known as loveLife <strong>[xxx]</strong> 年轻人 to promote 同伴中的安全性行为.</p>\n\n<hr />\n<p>2、例子、南卡罗来纳、香烟不酷、年轻人、同伴中的安全性行为。</p>\n\n<hr />\n<p>The idea seems promising, and Rosenberg is a <strong>[xxx]</strong> observer. Her critique of the <strong>[xxx]</strong> of many public-health campaigns is spot-on: they fail to <strong>[xxx]</strong> peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking among teenagers—teenagers , who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n\n<hr />\n<p>The idea seems promising, / and Rosenberg is a <strong>[xxx]</strong> observer. / Her critique of the <strong>[xxx]</strong> of many public-health campaigns is spot-on: / they fail to <strong>[xxx]</strong> peer pressure for healthy habits, / and they demonstrate a seriously flawed understanding of psychology. / “Dare to be different, / please don’t smoke!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking among teenagers — teenagers , / who desire nothing more than fitting in. / Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, / so skilled at applying peer pressure.</p>\n\n<hr />\n<p>The idea 似乎有希望, / and Rosenberg is a <strong>[xxx]</strong> observer. / Her critique of the <strong>[xxx]</strong> of many 公共卫生运动 is spot-on: / they fail to <strong>[xxx]</strong> peer pressure for 健康习惯, / and they demonstrate a seriously flawed 对心理学的理解. / “Dare to be different, / please 不要吸烟!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking 青少年当中 — teenagers , / who desire 最想要的就是 融入群体. / Rosenberg argues convincingly that 公共卫生倡导者 ought to take a page from advertisers, / so skilled at applying peer pressure.</p>\n\n<hr />\n<p>3、似乎有希望、公共卫生运动、健康习惯、对心理学的理解、不要吸烟、青少年当中、最想要的就是、融入群体、公共卫生倡导者。</p>\n\n<hr />\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much <strong>[xxx]</strong> detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most <strong>[xxx]</strong> flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n\n<hr />\n<p>But on the general effectiveness of the social cure, / Rosenberg is less persuasive. / Join the Club is filled with too much <strong>[xxx]</strong> detail and not enough exploration of the social and biological factors that make peer pressure so powerful. / The most <strong>[xxx]</strong> flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. / Rage Against the Haze failed once state funding was cut. / Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n\n<hr />\n<p>But on the 总体效果 of the social cure, / Rosenberg is 不那么有说服力. / Join the Club is filled with 太多 <strong>[xxx]</strong> detail and not enough exploration of the 社会和生物因素 that make peer pressure so powerful. / The most <strong>[xxx]</strong> flaw of the social cure as it’s presented here is that it 并不很好地起作用 for very long. / Rage Against the Haze failed once 州拨款被削减. / Evidence that the loveLife program produces 持久变化 is limited and mixed.</p>\n\n<hr />\n<p>4、总体效果、不那么有说服力、太多、社会和生物因素、并不很好地起作用、州拨款被削减、持久变化。</p>\n\n<hr />\n<p>There’s no doubt that our peer groups <strong>[xxx]</strong> enormous influence on our behavior. An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication. This is a <strong>[xxx]</strong> form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n\n<hr />\n<p>There’s no doubt that our peer groups <strong>[xxx]</strong> enormous influence on our behavior. / An emerging body of research shows that positive health habits — / as well as negative ones — / spread through networks of friends via social communication. / This is a <strong>[xxx]</strong> form of peer pressure: / we unconsciously imitate the behavior we see every day.</p>\n\n<hr />\n<p>There’s 毫无疑问 that our peer groups <strong>[xxx]</strong> enormous influence on 我们的行为. / An emerging body of research shows that 积极健康习惯 — / as well as negative ones — / spread through 朋友网络 via social communication. / This is a <strong>[xxx]</strong> form of peer pressure: / we unconsciously imitate the behavior we see 每天.</p>\n\n<hr />\n<p>5、毫无疑问、我们的行为、积极健康习惯、朋友网络、每天。</p>\n\n<hr />\n<p>Far less certain, however, is how successfully experts and <strong>[xxx]</strong> can select our peer groups and steer their activities in <strong>[xxx]</strong> directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure <strong>[xxx]</strong> from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n\n<hr />\n<p>Far less certain, however, / is how successfully experts and <strong>[xxx]</strong> can select our peer groups and steer their activities in <strong>[xxx]</strong> directions. / It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. / The tactic never really works. / And that’s the problem with a social cure <strong>[xxx]</strong> from the outside: / in the real world, / as in school, / we insist on choosing our own friends.</p>\n\n<hr />\n<p>远不确定, however, / is 能多成功 experts and <strong>[xxx]</strong> can select 我们的同伴群体 and steer their activities in <strong>[xxx]</strong> directions. / It’s like the teacher who breaks up the troublemakers in the back row by pairing them with 表现较好的同学. / 这个办法 从未真正奏效. / And that’s the problem with a social cure <strong>[xxx]</strong> 从外部: / 在现实世界里, / as in school, / we insist on 选择我们自己的朋友.</p>\n\n<hr />\n<p>6、远不确定、能多成功、我们的同伴群体、表现较好的同学、这个办法、从未真正奏效、从外部、在现实世界里、选择我们自己的朋友。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到大家都这么做、一半邀请一半强迫、改善他们的生活、可能还有世界；中间又出现例子、南卡罗来纳、年轻人、同伴中的安全性行为；似乎有希望、公共卫生运动、融入群体、公共卫生倡导者；总体效果、不那么有说服力、州拨款被削减、持久变化；毫无疑问、我们的行为、朋友网络、每天；结尾还有远不确定、能多成功、在现实世界里、选择我们自己的朋友。</p>\n<p>到这里还不能自然地说清楚：同伴压力怎样作用于具体行为，书里的例子能说明什么，后面为什么又出现不确定的说法。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n\n<hr />\n<h2>21题</h2>\n<blockquote><p>According to the first paragraph, peer pressure often emerges as ______.<br />\n根据第一段，同伴压力常常表现为什么？</p>\n</blockquote>\n<p>题干限定第一段，often要接住作者说usually的那一句。</p>\n<blockquote><p>原文参考：</p>\n<p>Come on—Everybody’s doing it. That whispered message, half invitation and half forcing, is what most of us think of when we hear the words peer pressure. It usually leads to no good—drinking, drugs and casual sex. But in her new book Join the Club, Tina Rosenberg <strong>[xxx]</strong> that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n<p>开始精读：</p>\n<p>Come on—Everybody’s doing it. / That whispered message, half invitation and half forcing, / is what most of us think of when we hear the words peer pressure. / It usually leads to no good—drinking, drugs and casual sex. / But in her new book Join the Club, Tina Rosenberg <strong>[xxx]</strong> / that peer pressure can also be a positive force / through what she calls the social cure, / in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n<p>来吧，大家都这么做。/ 那个低声传来的信息，一半邀请，一半强迫，/ 就是大多数人听到同伴压力时想到的。/ 它通常没有好结果：饮酒、毒品和随意性行为。/ 但是，Tina Rosenberg在新书《加入俱乐部》中<strong>[xxx]</strong>，/ 同伴压力也能成为积极力量，/ 通过她称为社会疗法的方式，/ 组织和官员利用群体互动的力量帮助个人改善生活，甚至改善世界。</p>\n</blockquote>\n<p>先读的是同伴压力常见的负面表现；But以后才转到Rosenberg提出的另一种用法。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. a supplement to the social cure</h3>\n<blockquote><p>同伴压力常作为社会疗法的一种补充出现。</p>\n</blockquote>\n<p>把A接回题干，它说的是：同伴压力常作为社会疗法的一种补充出现。</p>\n<p>A把同伴压力叫作<code>social cure</code>的补充。第一段最后一句正解释这种疗法，我们看<code>in which</code>后面到底怎样使用群体的力量，再接回题干的<code>often</code>。</p>\n<blockquote><p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n<blockquote><p>peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<p>原句说同伴压力也能成为积极力量，接着介绍所谓社会疗法：组织和官员利用群体互动的力量帮助个人。这里使用群体力量，就是这项疗法正在做的事。</p>\n<p>A却把同伴压力放到补充的位置，好像先有一种疗法，再额外加上同伴压力。原文没有把它们这样分开。</p>\n<p>题干的<code>often</code>还对应前面的<code>usually leads to no good</code>，问通常呈现的情况。原文先写通常引起不良行为，才转到这种积极用法。</p>\n<p><strong>社会疗法在这里正是利用群体力量，同伴压力只是另加在疗法外的一项补充吗？</strong></p>\n<p>不是。原句用群体力量解释疗法本身怎样做，A的补充关系接不上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. a stimulus to group dynamics</h3>\n<blockquote><p>同伴压力是群体互动的刺激因素。</p>\n</blockquote>\n<p>把B接回题干，它说的是：同伴压力是群体互动的刺激因素。</p>\n<p>B里的<code>group dynamics</code>能在<code>use the power of group dynamics</code>中找到。<code>stimulus to</code>说同伴压力刺激了这种群体互动，我们看原句有没有说群体互动由什么引起。</p>\n<blockquote><p>in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world.</p>\n</blockquote>\n<p><code>organizations and officials</code>是利用这种力量的人，<code>use the power of group dynamics</code>说他们使用群体力量，后面<code>to help individuals</code>说用它来帮助个人。</p>\n<p>原文把群体力量当作已经可以利用的东西，说明它怎样作用到个人身上。B则要说明同伴压力使群体互动发生或加强。</p>\n<p>我们读到了“谁利用群体力量帮助谁”，没有读到“群体互动受到同伴压力刺激而产生”。B把原句没有解释的起因写了进来。</p>\n<p><strong>原句在说群体互动由什么刺激出来，还是组织利用群体力量来帮助个人？</strong></p>\n<p>是后者。B说的刺激群体互动，没有出现在这句用法说明里。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. an obstacle to social progress</h3>\n<blockquote><p>同伴压力是社会进步的障碍。</p>\n</blockquote>\n<p>把C接回题干，它说的是：同伴压力是社会进步的障碍。</p>\n<p>C说阻碍<code>social progress</code>，首段最像负面评价的是<code>leads to no good</code>。我们把破折号后面列出的东西读出来，看这句话所说的坏结果具体是什么。</p>\n<blockquote><p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n<blockquote><p>peer pressure can also be a positive force</p>\n</blockquote>\n<p><code>no good</code>后面马上列出饮酒、毒品和随意性行为，这些都是个人在同伴影响下可能采取的行为。</p>\n<p>C把它们概括成整个社会的进步受到阻碍。首段没有继续讨论社会发展怎样被拖慢，也没有把这几种行为合起来作这种判断。</p>\n<p>后面还说同伴压力可能被用来改善个人生活，甚至改善世界。所以，这段给出的常见坏结果是具体行为，不能直接把整股力量定为社会进步的障碍。</p>\n<p><strong>破折号后的例子说明的是个人做了哪些不好的事，还是整个社会的发展受到了怎样的阻碍？</strong></p>\n<p>是个人的不良行为。C把这个判断扩大成了对社会进步的判断。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. a cause of undesirable behaviors</h3>\n<blockquote><p>同伴压力常常引起不良行为。</p>\n</blockquote>\n<p>把D接回题干，它说的是：同伴压力常常引起不良行为。</p>\n<p>D说导致<code>undesirable behaviors</code>，首段正有<code>leads to no good</code>，后面还列了三种行为。我们看<code>It</code>指谁，以及这几个例子怎样接在<code>leads to</code>后面。</p>\n<blockquote><p>It usually leads to no good—drinking, drugs and casual sex.</p>\n</blockquote>\n<p><code>It</code>承接前面说的同伴压力。<code>leads to</code>说明同伴压力会引起后面的事情；饮酒、毒品和随意性行为，把<code>no good</code>具体解释成了不良行为。</p>\n<p>所以，D的<code>cause</code>接住“引起”，<code>undesirable behaviors</code>接住这几种行为。题干<code>often</code>和原句<code>usually</code>也都说通常如此。</p>\n<p>D没有说每一次同伴影响都只能带来坏处，后面的<code>can also be a positive force</code>并不妨碍我们回答它通常表现为什么。</p>\n<p><strong>同伴压力通常引起饮酒、吸毒等行为，能不能概括成通常引起不良行为？</strong></p>\n<p>能。引起的东西就是这些不良行为，D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>21题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>A把疗法所借助的力量写成附加补充，B改成群体互动的起因，C把具体不良行为扩大为社会进步受阻。D同时接住leads to、三个行为例子和usually，因此本题保留D。</p>\n\n<hr />\n<h2>22题</h2>\n<blockquote><p>Rosenberg holds that public-health advocates should ______.<br />\nRosenberg认为，公共卫生倡导者应该怎样做？</p>\n</blockquote>\n<p>public-health advocates出现在第三段末句。前一段给出她所举的实践，第三段才直接说应该向谁学习。</p>\n<blockquote><p>原文参考：</p>\n<p>Rosenberg , the <strong>[xxx]</strong> of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking program called Rage Against the Haze sets out to make cigarettes uncool. In South Africa, an HIV-prevention <strong>[xxx]</strong> known as loveLife <strong>[xxx]</strong> young people to promote safe sex among their peers.</p>\n<p>开始精读：</p>\n<p>Rosenberg , the <strong>[xxx]</strong> of a Pulitzer Prize, / offers a host of examples of the social cure in action: / In South Carolina, a state-sponsored antismoking program called Rage Against the Haze sets out to make cigarettes uncool. / In South Africa, an HIV-prevention <strong>[xxx]</strong> known as loveLife <strong>[xxx]</strong> young people to promote safe sex among their peers.</p>\n<p>Rosenberg是普利策奖的<strong>[xxx]</strong>，/ 她提供了许多社会疗法实践的例子：/ 南卡罗来纳州一项由州资助的反吸烟计划Rage Against the Haze，着手让香烟变得不酷。/ 南非一项名为loveLife的艾滋病预防<strong>[xxx]</strong>，<strong>[xxx]</strong>年轻人向同伴推广安全性行为。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The idea seems promising, and Rosenberg is a <strong>[xxx]</strong> observer. Her critique of the <strong>[xxx]</strong> of many public-health campaigns is spot-on: they fail to <strong>[xxx]</strong> peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of psychology. “Dare to be different, please don’t smoke!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking among teenagers—teenagers , who desire nothing more than fitting in. Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n<p>开始精读：</p>\n<p>The idea seems promising, / and Rosenberg is a <strong>[xxx]</strong> observer. / Her critique of the <strong>[xxx]</strong> of many public-health campaigns is spot-on: / they fail to <strong>[xxx]</strong> peer pressure for healthy habits, / and they demonstrate a seriously flawed understanding of psychology. / “Dare to be different, please don’t smoke!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking among teenagers—teenagers , / who desire nothing more than fitting in. / Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, / so skilled at applying peer pressure.</p>\n<p>这个想法似乎有希望，/ Rosenberg也是<strong>[xxx]</strong>的观察者。/ 她对许多公共卫生运动<strong>[xxx]</strong>的批评很到位：/ 它们没有为了健康习惯而<strong>[xxx]</strong>同伴压力，/ 也表现出对心理学严重错误的理解。/ “敢于与众不同，请不要吸烟！”一项面向青少年的广告牌运动这样<strong>[xxx]</strong>，/ 而青少年最想要的恰恰是融入群体。/ Rosenberg有说服力地提出，公共卫生倡导者应向广告商学一招，/ 后者非常善于运用同伴压力。</p>\n</blockquote>\n<p>广告商与卫生运动的差别，落在是否会利用人们想融入同伴的心理。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. recruit <strong>[xxx]</strong> advertisers</h3>\n<blockquote><p>公共卫生倡导者应该招募<strong>[xxx]</strong>广告商。</p>\n</blockquote>\n<p>把A接回题干，它说的是：公共卫生倡导者应该招募<strong>[xxx]</strong>广告商。</p>\n<p>A说<code>recruit ... advertisers</code>，要招募广告商。第三段的建议也指向广告商，但动作用的是<code>take a page from</code>。我们看后面的<code>skilled at applying peer pressure</code>在解释什么。</p>\n<blockquote><p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<p>原文说广告商善于运用同伴压力，因此公共卫生倡导者应借鉴他们的做法。前面的禁烟口号正好出了问题：叫青少年与众不同，可青少年很想融入群体。</p>\n<p>要补上的是怎样运用这种心理，所以这里让倡导者学广告商的本领。A的<code>recruit</code>却让他们把广告商招进来工作。</p>\n<p>A中不认识的词修饰哪种广告商，但招募人员这个动作已经很清楚；原句提出的学习方法，并不等于招募这些人。</p>\n<p><strong>向广告商学习怎样使用同伴压力，就等于必须把广告商招募进来吗？</strong></p>\n<p>不等于。原文建议学习做法，A改成了人员招募。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. learn from advertisers’ experience</h3>\n<blockquote><p>公共卫生倡导者应该学习广告商的经验。</p>\n</blockquote>\n<p>把B接回题干，它说的是：公共卫生倡导者应该学习广告商的经验。</p>\n<p>B的<code>learn from</code>是向别人学习，原句有<code>take a page from advertisers</code>。再把前面的禁烟口号读上，看看向广告商具体学什么。</p>\n<blockquote><p>“Dare to be different, please don’t smoke!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking among teenagers—teenagers , who desire nothing more than fitting in.</p>\n</blockquote>\n<blockquote><p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<p>禁烟口号让青少年<code>Dare to be different</code>，勇于和别人不同。可原文紧接着说，他们最希望的是<code>fitting in</code>，融入群体。这个口号正好和他们想要的东西相反。</p>\n<p>后面说广告商善于<code>applying peer pressure</code>，也就是利用人受到同伴影响的心理。公共卫生倡导者向他们学，能学到怎样顺着这种心理劝人养成健康习惯。</p>\n<p>B既说了学习这个动作，也说了向广告商学习，能把口号的问题和后面的建议接起来。</p>\n<p><strong>Rosenberg让公共卫生倡导者向广告商学的，具体是什么经验？</strong></p>\n<p>是怎样运用同伴压力，而不是让想融入群体的青少年一味与众不同。B保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. stay away from commercial advertisers</h3>\n<blockquote><p>公共卫生倡导者应该远离商业广告商。</p>\n</blockquote>\n<p>把C接回题干，它说的是：公共卫生倡导者应该远离商业广告商。</p>\n<p>C让倡导者<code>stay away from</code>广告商，意思是远离他们。原句却说<code>ought to take a page from advertisers</code>，我们看这是劝人避开，还是劝人借鉴。</p>\n<blockquote><p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<p><code>take a page from</code>让公共卫生倡导者借鉴广告商，后面的<code>so skilled</code>还说明值得学的地方：广告商很会使用同伴压力。</p>\n<p>C让他们远离商业广告商，和这条建议反了。原句没有因为广告是商业活动，就否定广告商对人们心理的了解。</p>\n<p><strong>作者引出的这条建议，让人向广告商学习，还是让人远离广告商？</strong></p>\n<p>是向他们学习。C的<code>stay away</code>把这个动作反过来了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. recognize the limitations of advertisements</h3>\n<blockquote><p>公共卫生倡导者应该认识广告的局限。</p>\n</blockquote>\n<p>把D接回题干，它说的是：公共卫生倡导者应该认识广告的局限。</p>\n<p>D说认识<code>advertisements</code>的局限，容易让我们想到那条失败的禁烟广告牌。我们把这条口号和Rosenberg随后明确提出的<code>ought to</code>一起看。</p>\n<blockquote><p>“Dare to be different, please don’t smoke!” <strong>[xxx]</strong> one billboard campaign aimed at reducing smoking among teenagers—teenagers , who desire nothing more than fitting in.</p>\n</blockquote>\n<blockquote><p>Rosenberg argues convincingly that public-health advocates ought to take a page from advertisers, so skilled at applying peer pressure.</p>\n</blockquote>\n<p>口号的问题是要求青少年与众不同，忽略了他们想融入群体。Rosenberg没有由此说广告这种手段普遍行不通，而是紧接着说，广告商很善于运用同伴压力，卫生倡导者应向他们学习。</p>\n<p>D只剩下认识广告局限，没有说向谁学习，也没有说要补上怎样使用同伴心理这件事。</p>\n<p>题干问她认为倡导者应该怎样做，原文已经在<code>ought to</code>后给出学习的行动，不能把前面那条口号的问题另外改成对所有广告局限的建议。</p>\n<p><strong>批评这条禁烟口号以后，Rosenberg接着要求的是认识广告的一般局限吗？</strong></p>\n<p>不是。她明确要求借鉴广告商运用同伴压力的本领。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>A把学习方法改成招募人员，C把借鉴改为回避，D把学习特定技能改成认识广告的一般局限。B对应take a page from，也说清所学的是运用同伴心理的经验，因此本题保留B。</p>\n\n<hr />\n<h2>23题</h2>\n<blockquote><p>In the author’s view, Rosenberg’s book fails to ______.<br />\n在作者看来，Rosenberg的书没有做到什么？</p>\n</blockquote>\n<p>book与fails to把我们带到第四段的Join the Club和not enough。</p>\n<blockquote><p>原文参考：</p>\n<p>But on the general effectiveness of the social cure, Rosenberg is less persuasive. Join the Club is filled with too much <strong>[xxx]</strong> detail and not enough exploration of the social and biological factors that make peer pressure so powerful. The most <strong>[xxx]</strong> flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. Rage Against the Haze failed once state funding was cut. Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n<p>开始精读：</p>\n<p>But on the general effectiveness of the social cure, / Rosenberg is less persuasive. / Join the Club is filled with too much <strong>[xxx]</strong> detail / and not enough exploration of the social and biological factors that make peer pressure so powerful. / The most <strong>[xxx]</strong> flaw of the social cure as it’s presented here is that it doesn’t work very well for very long. / Rage Against the Haze failed once state funding was cut. / Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n<p>但是，说到社会疗法的总体效果，/ Rosenberg就不那么有说服力。/ 《加入俱乐部》塞进了太多<strong>[xxx]</strong>细节，/ 却没有充分探究让同伴压力如此强大的社会和生物因素。/ 这里呈现的社会疗法最<strong>[xxx]</strong>的缺点是，它不能很长久地发挥良好作用。/ 州拨款一被削减，Rage Against the Haze就失败了。/ loveLife带来持久变化的证据有限，而且结果不一致。</p>\n</blockquote>\n<p>要区分书的论述不足与书中介绍的社会疗法效果不足。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. adequately probe social and biological factors</h3>\n<blockquote><p>这本书没有充分探究社会和生物因素。</p>\n</blockquote>\n<p>把A接回题干，它说的是：这本书没有充分探究社会和生物因素。</p>\n<p>A的<code>adequately probe</code>说充分探究，第四段对这本书的批评正有<code>not enough exploration</code>。我们把它后面探究的内容读完整。</p>\n<blockquote><p>Join the Club is filled with too much <strong>[xxx]</strong> detail and not enough exploration of the social and biological factors that make peer pressure so powerful.</p>\n</blockquote>\n<p><code>not enough exploration of the social and biological factors</code>说社会和生物因素探究得不够，后面的<code>that make peer pressure so powerful</code>又说明，正是这些因素让同伴压力很强。</p>\n<p>题干已经有<code>fails to</code>，接上A就是“没有充分探究社会和生物因素”。<code>adequately</code>加上题干的否定，正对应原文的<code>not enough</code>。</p>\n<p>这里说的是不够充分，不要求我们把它读成书里一个因素也没有提。前面修饰<code>detail</code>的生词，也不影响后半句已经说清的探究不足。</p>\n<p><strong>题干的<code>fails to</code>接上A，是否就是没有把这些社会和生物因素探究充分？</strong></p>\n<p>是。探究的内容和不足的程度，都能接上<code>not enough exploration</code>。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. effectively evade the flaws of the social cure</h3>\n<blockquote><p>这本书没有有效避开社会疗法的缺陷。</p>\n</blockquote>\n<p>把B接回题干，它说的是：这本书没有有效避开社会疗法的缺陷。</p>\n<p>B要让这本书<code>evade the flaws</code>，避开社会疗法的缺陷。第四段先说书的<code>exploration</code>不够，又说疗法<code>doesn’t work ... for very long</code>，先把两句的主语分开。</p>\n<blockquote><p>Join the Club is filled with too much <strong>[xxx]</strong> detail and not enough exploration of the social and biological factors that make peer pressure so powerful.</p>\n</blockquote>\n<blockquote><p>The most <strong>[xxx]</strong> flaw of the social cure as it’s presented here is that it doesn’t work very well for very long.</p>\n</blockquote>\n<p>第一句的主语是书，批评它没把社会和生物因素研究说明得足够充分。第二句谈的是疗法的缺陷：它的效果不能很好地持续。</p>\n<p>一本书把疗法为什么有效、为什么不持久分析清楚，是补足分析；让它避开疗法的实际缺陷，则成了另一件事。</p>\n<p>B没有说把原因探究得更充分，而是把疗法本身的缺陷搬到书应该避开什么上，不能接住作者对这本书写得不够深入的批评。</p>\n<p><strong>要求书把因素探究得更充分，能直接改成要求书避开疗法缺陷吗？</strong></p>\n<p>不能。原文批评书分析得不够，B换成了避开缺陷。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. illustrate the functions of state funding</h3>\n<blockquote><p>这本书没有说明州拨款的作用。</p>\n</blockquote>\n<p>把C接回题干，它说的是：这本书没有说明州拨款的作用。</p>\n<p>C的<code>state funding</code>就在第四段，原文说资金一被削减，项目就失败了。我们看这句话有没有说书忘了介绍拨款的作用。</p>\n<blockquote><p>Join the Club is filled with too much <strong>[xxx]</strong> detail and not enough exploration of the social and biological factors that make peer pressure so powerful.</p>\n</blockquote>\n<blockquote><p>Rage Against the Haze failed once state funding was cut.</p>\n</blockquote>\n<p>原句已经写出资金与项目的联系：拨款被削减，Rage Against the Haze就失败。这是在说明项目为什么不能稳定持续。</p>\n<p>它没有说作者漏讲了州拨款，也没有要求这本书专门介绍拨款有哪些功能。对书的明确批评在前面：相关因素没有探究充分。</p>\n<p>C把后面用来展示项目问题的拨款事例，换成了书没有完成的一项写作任务。原文没有这样评价这本书。</p>\n<p><strong>“拨款削减后项目失败”，是在说明项目依赖资金，还是在说这本书没有讲拨款的作用？</strong></p>\n<p>是在说明项目依赖资金。它不能证明书漏讲了拨款功能。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. produce a <strong>[xxx]</strong> social effect</h3>\n<blockquote><p>Rosenberg的书未能产生<strong>[xxx]</strong>社会效果。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Rosenberg的书未能产生<strong>[xxx]</strong>社会效果。</p>\n<p>D让书<code>produce ... social effect</code>，产生社会效果。第四段末句也有<code>produces lasting changes</code>，我们先看这里产生变化的到底是谁。</p>\n<blockquote><p>Evidence that the loveLife program produces lasting changes is limited and mixed.</p>\n</blockquote>\n<p>这句的主语是<code>the loveLife program</code>，即loveLife项目。原文说这个项目带来持久变化的证据还有限，且并不一致。</p>\n<p>D接上题干后，产生社会效果的主语变成了Rosenberg的书。书介绍某个项目，和项目本身对人的生活产生变化，不能当成同一个动作。</p>\n<p>对书，前面说应该把因素探究得更充分；对项目，后面才问有没有带来持久变化。D中修饰效果的词虽然未知，主语已经换了。</p>\n<p><strong>原文在怀疑loveLife项目带来持久变化，能直接说Rosenberg的书没产生这种变化吗？</strong></p>\n<p>不能。被评价实际效果的是项目，书受到的批评是分析不够充分。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>23题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>A保留书没有充分探究相关因素的动作和程度。B把探究换成避开疗法缺陷，C否认了例子已经展示的拨款作用，D把疗法项目的效果移作书本身的任务，因此本题保留A。</p>\n\n<hr />\n<h2>24题</h2>\n<blockquote><p>Paragraph 5 shows that our imitation of behaviors ______.<br />\n第五段说明，我们模仿行为时有什么特点？</p>\n</blockquote>\n<p>题干明确指定第五段，imitation对应最后一句imitate。</p>\n<blockquote><p>原文参考：</p>\n<p>There’s no doubt that our peer groups <strong>[xxx]</strong> enormous influence on our behavior. An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication. This is a <strong>[xxx]</strong> form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n<p>开始精读：</p>\n<p>There’s no doubt that our peer groups <strong>[xxx]</strong> enormous influence on our behavior. / An emerging body of research shows that positive health habits—as well as negative ones— / spread through networks of friends via social communication. / This is a <strong>[xxx]</strong> form of peer pressure: / we unconsciously imitate the behavior we see every day.</p>\n<p>毫无疑问，同伴群体对我们的行为<strong>[xxx]</strong>巨大影响。/ 不断出现的研究表明，积极健康习惯和消极习惯一样，/ 通过社会交流在朋友网络中传播。/ 这是一种<strong>[xxx]</strong>的同伴压力：/ 我们不知不觉地模仿每天看到的行为。</p>\n</blockquote>\n<p>段首说影响很大，中间说好坏习惯都能传播，末句才点出模仿发生时是否自觉。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. is harmful to our networks of friends</h3>\n<blockquote><p>模仿会伤害我们的朋友网络。</p>\n</blockquote>\n<p>把A接回题干，它说的是：模仿会伤害我们的朋友网络。</p>\n<p>A把<code>networks of friends</code>说成受损的对象。第五段也有朋友网络，但前面连的是<code>spread through</code>。我们看习惯经过这个网络，和这个网络受到伤害是否一样。</p>\n<blockquote><p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n<p>原句说好习惯和坏习惯都通过朋友网络、经社会交往传播。朋友网络在这里告诉我们习惯沿什么途径传过去。</p>\n<p>A改成模仿伤害这张网络。原文没有说朋友关系被破坏，也没有说网络因此不能维持。</p>\n<p>其中确实包括坏习惯，但坏习惯沿朋友网络传播，并不能再推出它伤害的就是朋友网络本身。</p>\n<p><strong>朋友网络是习惯传播经过的地方，就表示原文说这张网络受到伤害了吗？</strong></p>\n<p>没有。<code>through</code>说明传播途径，A的<code>harmful to</code>另说了受损结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. will mislead <strong>[xxx]</strong> studies</h3>\n<blockquote><p>我们的行为模仿会误导<strong>[xxx]</strong>研究。</p>\n</blockquote>\n<p>把B接回题干，它说的是：我们的行为模仿会误导<strong>[xxx]</strong>研究。</p>\n<p>B说模仿<code>mislead ... studies</code>，误导研究。第五段以<code>research shows</code>引出模仿的发现，我们看研究在这里有没有被说成弄错了。</p>\n<blockquote><p>An emerging body of research shows that positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n<p>原文使用研究来说明，好习惯和坏习惯能够在朋友之间传播。接着又说明，我们会不自觉地模仿每天见到的行为。</p>\n<p>这里是研究帮助我们了解模仿怎样发生。B却说模仿使研究受到误导，等于还要看到研究因模仿现象得出了错误结论。</p>\n<p>原文没有作这种批评。B中研究的种类还不认识，但<code>mislead</code>已经把提供发现的研究改成了被带向错误的一方。</p>\n<p><strong>研究发现习惯经朋友网络传播，就表示模仿误导了这项研究吗？</strong></p>\n<p>不表示。原文拿研究解释模仿，没有说研究因此得出了错误结论。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. occurs without our realizing it</h3>\n<blockquote><p>模仿在我们没有意识到时发生。</p>\n</blockquote>\n<p>把C接回题干，它说的是：模仿在我们没有意识到时发生。</p>\n<p>C的<code>without our realizing it</code>说没有意识到，段末直接有<code>we unconsciously imitate</code>。我们把模仿的人、模仿的东西和是否自觉分别接上。</p>\n<blockquote><p>This is a <strong>[xxx]</strong> form of peer pressure: we unconsciously imitate the behavior we see every day.</p>\n</blockquote>\n<p><code>we</code>就是题干的<code>our</code>，<code>imitate</code>就是模仿。后面的<code>the behavior we see every day</code>又说，模仿的是我们每天看到的行为。</p>\n<p><code>unconsciously</code>修饰这个模仿动作，说明动作发生时并不自觉。C的“没有意识到”正好把这一点说出来。</p>\n<p>上一句还说好习惯和坏习惯都能传播，C没有只留下其中一类。不过D也提到了坏习惯，先把C留下，接着比较D说的究竟是模仿怎样发生，还是可能传来什么。</p>\n<p><strong>C中的没有意识到，是否就是<code>unconsciously</code>对模仿这个动作的说明？</strong></p>\n<p>是。人不自觉地模仿日常看到的行为，C先保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. can produce negative health habits</h3>\n<blockquote><p>模仿能够产生消极健康习惯。</p>\n</blockquote>\n<p>把D接回题干，它说的是：模仿能够产生消极健康习惯。</p>\n<p>D的<code>negative health habits</code>在第五段确实出现，前面还有<code>positive ... as well as negative ones</code>。我们看这句话和下一句<code>unconsciously imitate</code>怎样相接。</p>\n<blockquote><p>positive health habits—as well as negative ones—spread through networks of friends via social communication.</p>\n</blockquote>\n<blockquote><p>we unconsciously imitate the behavior we see every day.</p>\n</blockquote>\n<p>好习惯和坏习惯都可以通过朋友网络传播，后面接着说，我们会不自觉地模仿每天看到的行为。如果看到并模仿的是坏习惯，一个人也可能养成那种习惯。</p>\n<p>因此，D的<code>can</code>只说可能带来坏习惯，还没有说模仿只能带来坏习惯。我们不能因为原文同时写了好习惯，就把D当成与原文相反。</p>\n<p>现在C说明模仿时人有没有意识到，D说明可能受到哪类习惯影响。两项都先留下，再回来看题干要概括模仿本身的什么特点。</p>\n<p><strong>原文说好坏习惯都能传播，D只说可能带来坏习惯，二者就互相矛盾吗？</strong></p>\n<p>不矛盾。D没有说只能带来坏习惯，目前先与C一起保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>24题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>A把传播途径改成受损对象，B把提供发现的研究改成被误导的对象，先排除。C直接说明模仿是不自觉的；D能接上坏习惯也会传播，而且can没有排除好习惯。两项分别说过程特点和可能结果，单看第五段还不能只凭C更直接就结束比较，先留下C、D。</p>\n\n<hr />\n<h2>25题</h2>\n<blockquote><p>The author suggests in the last paragraph that the effect of peer pressure is, ______.<br />\n作者在最后一段暗示，同伴压力的效果怎么样？</p>\n</blockquote>\n<p>题干限定最后一段，先看Far less certain和教师配对的例子。</p>\n<blockquote><p>原文参考：</p>\n<p>Far less certain, however, is how successfully experts and <strong>[xxx]</strong> can select our peer groups and steer their activities in <strong>[xxx]</strong> directions. It’s like the teacher who breaks up the troublemakers in the back row by pairing them with better-behaved classmates. The tactic never really works. And that’s the problem with a social cure <strong>[xxx]</strong> from the outside: in the real world, as in school, we insist on choosing our own friends.</p>\n<p>开始精读：</p>\n<p>Far less certain, however, / is how successfully experts and <strong>[xxx]</strong> can select our peer groups / and steer their activities in <strong>[xxx]</strong> directions. / It’s like the teacher who breaks up the troublemakers in the back row / by pairing them with better-behaved classmates. / The tactic never really works. / And that’s the problem with a social cure <strong>[xxx]</strong> from the outside: / in the real world, as in school, / we insist on choosing our own friends.</p>\n<p>然而，远不确定的是，/ 专家和<strong>[xxx]</strong>能否成功选择我们的同伴群体，/ 并把他们的活动引向<strong>[xxx]</strong>方向。/ 这就像教师拆散后排的捣乱者，/ 让他们与表现较好的同学配对。/ 这种办法从来没有真正奏效。/ 这正是从外部<strong>[xxx]</strong>的社会疗法的问题：/ 在现实世界里，就像在学校里，/ 我们坚持自己选择朋友。</p>\n</blockquote>\n<p>这里怀疑的是专家从外部安排同伴、引导人变好的效果，不能抹掉上一段对自然同伴影响的承认。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. harmful</h3>\n<blockquote><p>这种效果是有害的。</p>\n</blockquote>\n<p>把A接回题干，它说的是：这种效果是有害的。</p>\n<p>A的<code>harmful</code>要说造成伤害。末段却先问<code>how successfully</code>，又说教师的办法<code>never really works</code>，我们看没有奏效是否已经等于造成伤害。</p>\n<blockquote><p>Far less certain, however, is how successfully experts and <strong>[xxx]</strong> can select our peer groups and steer their activities in <strong>[xxx]</strong> directions.</p>\n</blockquote>\n<blockquote><p>The tactic never really works.</p>\n</blockquote>\n<p>教师把捣乱者和表现较好的学生放在一起，希望他们受到好的影响。<code>never really works</code>说这种安排没有真正达到预期。</p>\n<p>一个安排没能改善行为，还不能让我们知道它造成了什么伤害。A需要的是后面那种损害，末段并没有报告。</p>\n<p>作者在怀疑外部人员能不能成功安排同伴关系，不能把这种对成效的怀疑直接读成效果有害。</p>\n<p><strong>教师配对的办法没有真正奏效，就说明它已经造成了伤害吗？</strong></p>\n<p>不能。没有达到改善的目标，和已经造成伤害还不是同一件事。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. desirable</h3>\n<blockquote><p>这种效果是令人满意的。</p>\n</blockquote>\n<p>把B接回题干，它说的是：这种效果是令人满意的。</p>\n<p>B说效果<code>desirable</code>，是可取、令人满意的。末段的教师配对例子却接着<code>never really works</code>，我们看安排者希望的结果和实际评价。</p>\n<blockquote><p>by pairing them with better-behaved classmates.</p>\n</blockquote>\n<blockquote><p>The tactic never really works.</p>\n</blockquote>\n<blockquote><p>we insist on choosing our own friends.</p>\n</blockquote>\n<p>把捣乱者放到表现好的同学旁边，当然是希望行为变好。但作者马上说这个办法没有真正奏效。</p>\n<p>末句又解释，我们坚持自己选择朋友。别人把两个学生安排在一起，并不能保证他们就成为能够互相影响的朋友。</p>\n<p>所以，原文没有把良好的目的当成已经取得的结果。B若说实际效果令人满意，就和这一段对办法不奏效的评价反了。</p>\n<p><strong>安排者想让学生变好，就能说作者认为实际效果令人满意吗？</strong></p>\n<p>不能。作者明确说办法没有真正奏效，愿望没有变成这样的效果。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. profound</h3>\n<blockquote><p>这种效果深远。</p>\n</blockquote>\n<p>把C接回题干，它说的是：这种效果深远。</p>\n<p>C的<code>profound</code>是深远，前一段确有<code>enormous influence</code>。但题干限定最后一段，我们把<code>however</code>后面具体提出的问题再读清楚。</p>\n<blockquote><p>enormous influence on our behavior.</p>\n</blockquote>\n<blockquote><p>Far less certain, however, is how successfully experts and <strong>[xxx]</strong> can select our peer groups and steer their activities in <strong>[xxx]</strong> directions.</p>\n</blockquote>\n<blockquote><p>The tactic never really works.</p>\n</blockquote>\n<p>前一段肯定自然形成的同伴群体会强烈影响行为。最后一段却问，专家替我们挑选同伴、引导活动，能不能成功。</p>\n<p>这两件事不能直接接成同一个结论：朋友本来能影响我们，不代表别人安排一个人坐到我们身边，他就能按安排者的意思影响我们。教师配对不奏效，举的正是这个差别。</p>\n<p>C拿前一段的强大影响来肯定末段的外部安排，跳过了作者在<code>however</code>后提出的疑问。</p>\n<p><strong>自己交的朋友影响很大，就能说明别人替我们安排同伴也一定产生深远效果吗？</strong></p>\n<p>不能。末段正在怀疑外部安排能否成功，C没有保留这层区别。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. questionable</h3>\n<blockquote><p>这种效果值得怀疑。</p>\n</blockquote>\n<p>把D接回题干，它说的是：这种效果值得怀疑。</p>\n<p>D的<code>questionable</code>是值得怀疑，末段开头正是<code>Far less certain</code>。我们再看教师配对的例子，以及最后为什么说人坚持自己选朋友。</p>\n<blockquote><p>Far less certain, however, is how successfully experts and <strong>[xxx]</strong> can select our peer groups and steer their activities in <strong>[xxx]</strong> directions.</p>\n</blockquote>\n<blockquote><p>The tactic never really works.</p>\n</blockquote>\n<blockquote><p>we insist on choosing our own friends.</p>\n</blockquote>\n<p>开头不太确定的，是专家能多成功地替我们挑选同伴并引导活动。教师的例子把做法写出来：把捣乱的学生和行为较好的同学配对。</p>\n<p>作者接着说办法没有真正奏效，因为在学校和现实里，我们都坚持自己选择朋友。安排在一起，还不能保证双方形成作者前面说的那种同伴影响。</p>\n<p>D说效果值得怀疑，能接上开头的不确定，也能接上例子里的不奏效及后面的原因。</p>\n<p><strong>开头说不太确定，例子又说安排不奏效，这能否支持D的效果值得怀疑？</strong></p>\n<p>能。被怀疑的是外部安排能不能成功利用同伴影响，D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>25题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>A把成效受疑升级为确定有害，B把愿望当成可取效果，C将自然同伴影响的强度移入外部干预的评价。D同时接住Far less certain、教师例子和自主选朋友的理由，因此本题保留D。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>usually leads to no good；can also be a positive force</td><td>同伴压力通常让人想到坏后果，但Rosenberg提出它也能成为积极力量：can also be a positive force。她的social cure借助群体力量改善个人生活。</td><td>提出需要讨论的主张：能否利用同伴影响来改善行为。这里既有负面表现，也提出了积极用法，不能先把同伴压力整体定为好或坏。</td></tr><tr><td>第2段</td><td>offers a host of examples；make cigarettes uncool；promote safe sex</td><td>offers a host of examples后面给出两个项目：让香烟变得不酷，向年轻人的同伴推广安全性行为。</td><td>把首段的设想落到具体项目；这些例子说明疗法想怎样起作用，尚未证明效果能持续。</td></tr><tr><td>第3段</td><td>fitting in；take a page from advertisers；applying peer pressure</td><td>青少年最想fitting in，失败的禁烟口号却要求他们与众不同；广告商善于applying peer pressure，因此值得学习。</td><td>承认Rosenberg的一部分分析有道理：健康宣传应该理解同伴心理。赞成这个方法上的提醒，不等于已经承认全部疗法都有效。</td></tr><tr><td>第4段</td><td>less persuasive；not enough exploration；doesn’t work very well for very long</td><td>转到general effectiveness时，Rosenberg变得less persuasive。书对因素探索不足，疗法也doesn’t work very well for very long，两个项目的长期效果都有问题。</td><td>从想法和宣传方法转到实际成效，把“值得尝试”与“已经证实有效”分开；同时区分书的论证缺陷和项目的运行问题。</td></tr><tr><td>第5段</td><td>positive health habits—as well as negative ones；we unconsciously imitate</td><td>好坏习惯都会在朋友网络中spread；段末用we unconsciously imitate说明这种同伴影响在日常生活中如何发生。</td><td>保留一个基础事实：自然同伴影响确实存在。作者没有因为批评疗法就否认这种影响，而是先说明自然形成的模仿过程。</td></tr><tr><td>第6段</td><td>Far less certain；The tactic never really works；choosing our own friends</td><td>Far less certain的是外部人员能否替人选择群体并成功引导活动。教师配对的办法不奏效，因为we insist on choosing our own friends。</td><td>指出从自然影响走到人为干预缺少的条件：群体关系由人们自己选择，不能只因同伴有影响，就假定安排别人交朋友也能按预期奏效。</td></tr></tbody></table>\n<p>全文要分清的是两件事：同伴之间自然发生的影响，可以很强，也可以使好坏习惯传播；外部人员能否把这种影响组织成稳定有效的改善方案，却是另一回事。作者认可理解同伴心理的价值，但认为Rosenberg没有充分说明这种社会疗法为何能够持久、成功地运作。最后一段用自主选择朋友解释外部安排的限度，第五段则先保留了自然模仿这个事实。</p>\n\n<hr />\n<h2>回查24题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul><li>C. occurs without our realizing it</li><li>D. can produce negative health habits</li></ul>\n<p>C接回题干：我们模仿行为时，并没有意识到自己在模仿。</p>\n<p>D接回题干：我们模仿行为，可能带来消极的健康习惯。</p>\n<p>第5段先说：</p>\n<blockquote><p>positive health habits—as well as negative ones—spread through networks of friends via social communication</p>\n</blockquote>\n<p>好习惯和坏习惯都能在朋友之间传播。D确实抓到了其中的坏习惯，所以第一遍没有把它直接排除。</p>\n<p>但接下来，作者对这种传播是怎样发生的又作了解释：</p>\n<blockquote><p>we unconsciously imitate the behavior we see every day</p>\n</blockquote>\n<p>这句话具体落到题干的<code>our imitation of behaviors</code>。我们模仿的是每天见到的行为，<code>unconsciously</code>说明模仿时并没有自觉。C直接说出了这个动作怎样发生，好行为和坏行为都能按这种方式被模仿。</p>\n<p>再接第6段。作者随后提出，专家能否替我们选朋友、引导这种影响，就不那么确定了。教师把学生配在一起也不一定奏效，因为我们坚持自己选择朋友。</p>\n<p>这样连起来，第5段先说明朋友之间本来会发生不自觉的模仿，第6段才追问别人能不能安排并控制它。前面不分好坏都会发生的那个模仿过程，就是这两段接在一起讨论的事情。</p>\n<p><strong>C和D中，哪一项直接接住<code>unconsciously imitate</code>，同时适用于前面说的好习惯和坏习惯？</strong></p>\n<p>C。D只取出坏习惯这一种可能结果，没有说出模仿本身怎样发生；C能把好坏习惯共同的传播方式说清楚。</p>\n<blockquote><p><strong>24题选C。</strong></p>\n</blockquote>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>21. D</strong></p>\n<p><strong>22. B</strong></p>\n<p><strong>23. A</strong></p>\n<p><strong>24. C</strong></p>\n<p><strong>25. D</strong></p>\n","analysisStartIndex":33,"maskInventory":{"token":"[xxx]","count":18},"questio
