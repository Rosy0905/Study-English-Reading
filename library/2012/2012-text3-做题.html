<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**According to the first paragraph, the process of discovery is characterized by its ______.**\n\n> 根据第一段，发现的过程具有怎样的特点？\n\n题型：**具体细节题**。\n\n---","html":"<h2>31题题干</h2>\n<p><strong>According to the first paragraph, the process of discovery is characterized by its ______.</strong></p>\n<blockquote>\n<p>根据第一段，发现的过程具有怎样的特点？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,157,1002,34],[231,208,141,33]],"scrollTarget":null,"meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**It can be inferred from Paragraph 2 that credibility process requires ______.**\n\n> 从第二段可以推断，可信度形成过程需要什么？\n\n题型：**局部推断题**。\n\n---","html":"<h2>32题题干</h2>\n<p><strong>It can be inferred from Paragraph 2 that credibility process requires ______.</strong></p>\n<blockquote>\n<p>从第二段可以推断，可信度形成过程需要什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,513,980,35],[231,564,236,35]],"scrollTarget":null,"meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**Paragraph 3 shows that a discovery claim becomes credible after it ______.**\n\n> 第三段表明，一项发现主张在什么之后才会变得可信？\n\n题型：**具体细节题**。\n\n---","html":"<h2>33题题干</h2>\n<p><strong>Paragraph 3 shows that a discovery claim becomes credible after it ______.</strong></p>\n<blockquote>\n<p>第三段表明，一项发现主张在什么之后才会变得可信？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,819,974,35],[230,870,621,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**Albert Szent-Györgyi would most likely agree that ______.**\n\n> Albert Szent-Györgyi最可能同意什么？\n\n题型：**局部推断题**。\n\n---","html":"<h2>34题题干</h2>\n<p><strong>Albert Szent-Györgyi would most likely agree that ______.</strong></p>\n<blockquote>\n<p>Albert Szent-Györgyi最可能同意什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,1125,775,34],[230,1176,531,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**Which of the following would be the best title of the text?**\n\n> 下面哪个标题最适合这篇文章？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>35题题干</h2>\n<p><strong>Which of the following would be the best title of the text?</strong></p>\n<blockquote>\n<p>下面哪个标题最适合这篇文章？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,1430,773,35],[231,1481,635,35]],"scrollTarget":null,"meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, Consequently, First, Second, In the end |\n| 态度词 / 评价词 | 先抓个大概好坏 | objective, complicated, credible, important |\n| 动作词 | 先看谁做了什么 | transform, receives, challenge, revise |\n| 结果词 | 看最后出了什么事 | mature discovery, credible discovery |\n| 重复主题词 | 大概知道老在说什么 | discovery, credibility, community, knowledge |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>But, Consequently, First, Second, In the end</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>objective, complicated, credible, important</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>transform, receives, challenge, revise</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>mature discovery, credible discovery</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>discovery, credibility, community, knowledge</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"In the **[xxx]** version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work. But in the everyday practice of science, discovery frequently follows an **[xxx]** and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. Opportunities for misinterpretation, error, and **[xxx]** abound.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>In the <span class=\"mask\">[xxx]</span> version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work. But in the everyday practice of science, discovery frequently follows an <span class=\"mask\">[xxx]</span> and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and th 去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住日常科学实践、发现主张、个人研究者、复杂社会体系、两个悖论、新探索、哲学家贝尔和共同推理；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个阶段或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和日常科学实践、发现主张、可信度以及研究者有关；开头出现关于世界的事实、客观研究者、科学方法、独特生活经历、错误；中间出现采矿主张、充满潜力、个人研究者、公开之后、复杂社会体系、两个悖论、新探索和未来研究者；结尾又看到哲学家贝尔、心灵、共同推理和质疑。</p>\n<p>到这里还不能自然地说清楚：世界事实、日常科学实践和发现主张到底怎样连起来，发现主张、个人研究者、复杂社会体系和可信度之间是什么关系，两个悖论与新探索、未来研究者分别在说什么，最后的共同推理和质疑又怎样接回前面。粗读时只要能判断“这篇文章大概与日常科学实践、发现主张、可信度和研究者有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住日常科学实践、发现主张、个人研究者、复杂社会体系、两个悖论、新探索、哲学家贝尔和共同推理；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35],[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34],[225,730,941,35],[165,764,1002,34],[165,794,1000,42],[165,831,1001,35],[165,865,1002,34],[165,897,1001,36],[165,932,1002,34],[165,965,1001,35],[166,999,1001,34],[165,1032,1001,35],[165,1066,131,34],[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35],[224,1535,943,35],[165,1569,1007,35],[165,1603,1001,35]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> According to the first paragraph, the process of discovery is characterized by its ______.  \n> 根据第一段，发现的过程具有怎样的特点？\n\n题干明确写了`first paragraph`，所以直接回到第一段，从段首读到段尾。\n\n> 原文参考：\n>\n> In the **[xxx]** version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work. But in the everyday practice of science, discovery frequently follows an **[xxx]** and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. Opportunities for misinterpretation, error, and **[xxx]** abound.\n>\n> 开始精读：\n>\n> In the **[xxx]** version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work. / But in the everyday practice of science, discovery frequently follows an **[xxx]** and complicated route. / We aim to be objective, but we cannot escape the context of our unique life experiences. / Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. / Opportunities for misinterpretation, error, and **[xxx]** abound.\n>\n> 顺着英文顺序读：\n>\n> 在科学如何开展的 **[xxx]** 图景里，关于世界的事实正等着被观察，并由使用科学方法工作的客观研究者收集。 / 但在日常科学实践中，发现常常沿着一条 **[xxx]** 而复杂的路径前进。 / 我们力求客观，却无法摆脱各自独特生活经历形成的背景。 / 既有知识和兴趣会影响我们经历什么、怎样理解这些经历，以及随后采取什么行动。 / 误读、错误和 **[xxx]** 的机会大量存在。\n\n题干要填的是“发现过程的特点”。整段先摆出理想化的科学图景，`But`以后转到日常实践：发现走的是复杂路径，个人经历会介入，误读和错误也会出现。下面看四项各自把哪一层写进了空格。","html":"<h2>31题</h2>\n<blockquote>\n<p>According to the first paragraph, the process of discovery is characterized by its ______.<br />\n根据第一段，发现的过程具有怎样的特点？</p>\n</blockquote>\n<p>题干明确写了<code>first paragraph</code>，所以直接回到第一段，从段首读到段尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In the <span class=\"mask\">[xxx]</span> version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work. But in the everyday practice of science, discovery frequently follows an <span class=\"mask\">[xxx]</span> and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. Opportunities for misinterpretation, error, and <span class=\"mask\">[xxx]</span> abound.</p>\n<p>开始精读：</p>\n<p>In the <span class=\"mask\">[xxx]</span> version of how science is done, facts about the world are waiting to be observed and collected by objective researchers who use the scientific method to carry out their work. / But in the everyday practice of science, discovery frequently follows an <span class=\"mask\">[xxx]</span> and complicated route. / We aim to be objective, but we cannot escape the context of our unique life experiences. / Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. / Opportunities for misinterpretation, error, and <span class=\"mask\">[xxx]</span> abound.</p>\n<p>顺着英文顺序读：</p>\n<p>在科学如何开展的 <span class=\"mask\">[xxx]</span> 图景里，关于世界的事实正等着被观察，并由使用科学方法工作的客观研究者收集。 / 但在日常科学实践中，发现常常沿着一条 <span class=\"mask\">[xxx]</span> 而复杂的路径前进。 / 我们力求客观，却无法摆脱各自独特生活经历形成的背景。 / 既有知识和兴趣会影响我们经历什么、怎样理解这些经历，以及随后采取什么行动。 / 误读、错误和 <span class=\"mask\">[xxx]</span> 的机会大量存在。</p>\n</blockquote>\n<p>题干要填的是“发现过程的特点”。整段先摆出理想化的科学图景，<code>But</code>以后转到日常实践：发现走的是复杂路径，个人经历会介入，误读和错误也会出现。下面看四项各自把哪一层写进了空格。</p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35]],"questionRects":[[185,157,1002,34],[231,208,141,33],[230,259,376,34],[230,310,444,34],[230,361,347,34],[230,412,400,34]],"scrollTarget":null,"meta":{"kind":"question","qid":"31"}},{"section":"31题","raw":"### A. uncertainty and complexity\n\n> 不确定性和复杂性\n\n把A接回题干，它说的是：根据第一段，发现的过程具有“不确定性和复杂性”这两个特点。\n\nA里的`complexity`和原文的`complicated route`意思接近，所以先回看写日常科学发现路径的这句；A里的`uncertainty`再让我顺着个人经历、知识兴趣、误读和错误几句一起看。\n\n> But in the everyday practice of science, discovery frequently follows an **[xxx]** and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. Opportunities for misinterpretation, error, and **[xxx]** abound.\n\n原文的`complicated route`直接写出路径复杂；研究者无法摆脱个人经历，既有知识和兴趣还会影响他们看见什么、怎样理解以及随后怎样行动，段尾又写误读和错误大量出现。A的`complexity`对应前面的复杂路径，`uncertainty`对应这些让过程难以稳定预料的影响。两边相同的是都在概括这条发现路径的整体状态：原文分别写复杂路线和多重干扰，A分别用`complexity`和`uncertainty`收住，正面回答了题干所问的“过程具有怎样的特点”。\n\n**复杂路径和这些不断介入的因素，能不能合起来概括成`uncertainty and complexity`？**\n\n能。`complicated route`支撑复杂性，个人经历、知识兴趣以及误读和错误共同支撑不确定性，A没有把原文对发现过程的描述改成别的关系。\n\n**第一轮判断：A保留。**","html":"<h3>A. uncertainty and complexity</h3>\n<blockquote>\n<p>不确定性和复杂性</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第一段，发现的过程具有“不确定性和复杂性”这两个特点。</p>\n<p>A里的<code>complexity</code>和原文的<code>complicated route</code>意思接近，所以先回看写日常科学发现路径的这句；A里的<code>uncertainty</code>再让我顺着个人经历、知识兴趣、误读和错误几句一起看。</p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an <span class=\"mask\">[xxx]</span> and complicated route. We aim to be objective, but we cannot escape the context of our unique life experiences. Prior knowledge and interests influence what we experience, what we think our experiences mean, and the subsequent actions we take. Opportunities for misinterpretation, error, and <span class=\"mask\">[xxx]</span> abound.</p>\n</blockquote>\n<p>原文的<code>complicated route</code>直接写出路径复杂；研究者无法摆脱个人经历，既有知识和兴趣还会影响他们看见什么、怎样理解以及随后怎样行动，段尾又写误读和错误大量出现。A的<code>complexity</code>对应前面的复杂路径，<code>uncertainty</code>对应这些让过程难以稳定预料的影响。两边相同的是都在概括这条发现路径的整体状态：原文分别写复杂路线和多重干扰，A分别用<code>complexity</code>和<code>uncertainty</code>收住，正面回答了题干所问的“过程具有怎样的特点”。</p>\n<p><strong>复杂路径和这些不断介入的因素，能不能合起来概括成<code>uncertainty and complexity</code>？</strong></p>\n<p>能。<code>complicated route</code>支撑复杂性，个人经历、知识兴趣以及误读和错误共同支撑不确定性，A没有把原文对发现过程的描述改成别的关系。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35]],"questionRects":[[185,157,1002,34],[231,208,141,33],[230,259,376,34],[230,310,444,34],[230,361,347,34],[230,412,400,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["A里的`complexity`和原文的`complicated route`意思接近，所以先回看写日常科学发现路径的这句；A里的`uncertainty`再让我顺着个人经历、知识兴趣、误读和错误几句一起看。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnma objective`只是他们努力达到的目标。C的`objectivity`却把尚未完全做到的目标写成发现过程已经具备的特点；同时`logicality`在这句中也没有对应的动作或状态。目标与现实状态的差别，正好决定题干能不能用“客观性”概括这一过程。\n\n**这里写的是过程已经具有`objectivity`，还是研究者想客观却仍无法摆脱个人背景？**\n\n后者。`we cannot escape the context`由`but`转出实际限制，不能把前面的努力目标改写成过程已经客观，更不能据此再补出逻辑性。\n\n**第一轮判断：C排除。**","html":"<h3>C. logicality and objectivity</h3>\n<blockquote>\n<p>逻辑性和客观性</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第一段，发现的过程具有“逻辑性和客观性”。</p>\n<p>C里的<code>objectivity</code>让我找到原文的<code>We aim to be objective</code>，但这句后面紧跟<code>we cannot escape the context</code>，二者由<code>but</code>连接，所以要把整句一起回看。</p>\n<blockquote>\n<p>We aim to be objective, but we cannot escape the context of our unique life experiences.</p>\n</blockquote>\n<p>原文的<code>we cannot escape the context</code>说研究者仍然受独特生活经历限制，<code>We aim to be objective</code>只是他们努力达到的目标。C的<code>objectivity</code>却把尚未完全做到的目标写成发现过程已经具备的特点；同时<code>logicality</code>在这句中也没有对应的动作或状态。目标与现实状态的差别，正好决定题干能不能用“客观性”概括这一过程。</p>\n<p><strong>这里写的是过程已经具有<code>objectivity</code>，还是研究者想客观却仍无法摆脱个人背景？</strong></p>\n<p>后者。<code>we cannot escape the context</code>由<code>but</code>转出实际限制，不能把前面的努力目标改写成过程已经客观，更不能据此再补出逻辑性。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35]],"questionRects":[[185,157,1002,34],[231,208,141,33],[230,259,376,34],[230,310,444,34],[230,361,347,34],[230,412,400,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["C里的`objectivity`让我找到原文的`We aim to be objective`，但这句后面紧跟`we cannot escape the context`，二者由`but`连接，所以要把整句一起回看。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"we cannot escape the context","visibleOptionAnchor":"objectivity"}}}},{"section":"31题","raw":"### D. systematicness and regularity\n\n> 系统性和规律性\n\n把D接回题干，它说的是：根据第一段，发现的过程具有“系统性和规律性”。\n\nD里的`systematicness and regularity`表示过程按固定秩序运行，而原文描述路径时用了`complicated route`，两边状态相反，所以先回看这一句，再顺着段尾的`misinterpretation`和`error`一起确认。\n\n> But in the everyday practice of science, discovery frequently follows an **[xxx]** and complicated route. ... Opportunities for misinterpretation, error, and **[xxx]** abound.\n\n原文的`complicated route`写的是一条复杂路线，后文又说个人经历会介入，`misinterpretation`和`error`会大量出现。D的`systematicness and regularity`则要求同一过程系统、规律、按稳定秩序展开。两边对发现过程给出的状态相反，这个差别直接回答了题干所问的过程特点。\n\n**一条被写成`complicated route`且容易出现误读和错误的路径，能不能概括成`systematicness and regularity`？**\n\n不能。复杂、受个人背景影响并容易出错，与系统而规律的运行方向相反；两个 **[xxx]** 不会消除`complicated route`和D之间已经存在的冲突。\n\n**第一轮判断：D排除。**","html":"<h3>D. systematicness and regularity</h3>\n<blockquote>\n<p>系统性和规律性</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第一段，发现的过程具有“系统性和规律性”。</p>\n<p>D里的<code>systematicness and regularity</code>表示过程按固定秩序运行，而原文描述路径时用了<code>complicated route</code>，两边状态相反，所以先回看这一句，再顺着段尾的<code>misinterpretation</code>和<code>error</code>一起确认。</p>\n<blockquote>\n<p>But in the everyday practice of science, discovery frequently follows an <span class=\"mask\">[xxx]</span> and complicated route. ... Opportunities for misinterpretation, error, and <span class=\"mask\">[xxx]</span> abound.</p>\n</blockquote>\n<p>原文的<code>complicated route</code>写的是一条复杂路线，后文又说个人经历会介入，<code>misinterpretation</code>和<code>error</code>会大量出现。D的<code>systematicness and regularity</code>则要求同一过程系统、规律、按稳定秩序展开。两边对发现过程给出的状态相反，这个差别直接回答了题干所问的过程特点。</p>\n<p><strong>一条被写成<code>complicated route</code>且容易出现误读和错误的路径，能不能概括成<code>systematicness and regularity</code>？</strong></p>\n<p>不能。复杂、受个人背景影响并容易出错，与系统而规律的运行方向相反；两个 <span class=\"mask\">[xxx]</span> 不会消除<code>complicated route</code>和D之间已经存在的冲突。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35]],"questionRects":[[185,157,1002,34],[231,208,141,33],[230,259,376,34],[230,310,444,34],[230,361,347,34],[230,412,400,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["D里的`systematicness and regularity`表示过程按固定秩序运行，而原文描述路径时用了`complicated route`，两边状态相反，所以先回看这一句，再顺着段尾的`misinterpretation`和`error`一起确认。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"complicated route","visibleOptionAnchor":"systematicness and regularity"}}}},{"section":"31题","raw":"### 31题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **31题选A。**","html":"<h3>31题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>31题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[185,157,1002,34],[231,208,141,33],[230,259,376,34],[230,310,444,34],[230,361,347,34],[230,412,400,34]],"scrollTarget":null,"meta":{"kind":"result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> It can be inferred from Paragraph 2 that credibility process requires ______.  \n> 从第二段可以推断，可信度形成过程需要什么？\n\n题干明确写了`Paragraph 2`，所以直接回到第二段，从第一句读到最后一句。\n\n> 原文参考：\n>\n> Consequently, discovery claims should be thought of as **[xxx]**. Similar to newly **[xxx]** mining claims, they are full of potential. But it takes collective scrutiny and acceptance to transform a discovery claim into a **[xxx]** discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime. Objective knowledge is the goal, not the starting point.\n>\n> 开始精读：\n>\n> Consequently, discovery claims should be thought of as **[xxx]**. / Similar to newly **[xxx]** mining claims, they are full of potential. / But it takes collective scrutiny and acceptance to transform a discovery claim into a **[xxx]** discovery. / This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime. / Objective knowledge is the goal, not the starting point.\n>\n> 顺着英文顺序读：\n>\n> 因此，发现主张应当被看作 **[xxx]**。 / 它们像新近 **[xxx]** 的采矿主张一样，充满潜力。 / 但要把一项发现主张变成 **[xxx]** 的发现，需要集体审视和接受。 / 这就是可信度形成过程；个人研究者的“我、这里、现在”在其中变成共同体的“任何人、任何地方、任何时候”。 / 客观知识是目标，不是起点。\n\n题干问可信度形成需要什么。第二段先把发现主张写成尚未成熟、但有潜力的东西，接着明确写出集体审视和接受，再把个人研究者的说法推向共同体。下面逐项比对。","html":"<h2>32题</h2>\n<blockquote>\n<p>It can be inferred from Paragraph 2 that credibility process requires ______.<br />\n从第二段可以推断，可信度形成过程需要什么？</p>\n</blockquote>\n<p>题干明确写了<code>Paragraph 2</code>，所以直接回到第二段，从第一句读到最后一句。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Consequently, discovery claims should be thought of as <span class=\"mask\">[xxx]</span>. Similar to newly <span class=\"mask\">[xxx]</span> mining claims, they are full of potential. But it takes collective scrutiny and acceptance to transform a discovery claim into a <span class=\"mask\">[xxx]</span> discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime. Objective knowledge is the goal, not the starting point.</p>\n<p>开始精读：</p>\n<p>Consequently, discovery claims should be thought of as <span class=\"mask\">[xxx]</span>. / Similar to newly <span class=\"mask\">[xxx]</span> mining claims, they are full of potential. / But it takes collective scrutiny and acceptance to transform a discovery claim into a <span class=\"mask\">[xxx]</span> discovery. / This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime. / Objective knowledge is the goal, not the starting point.</p>\n<p>顺着英文顺序读：</p>\n<p>因此，发现主张应当被看作 <span class=\"mask\">[xxx]</span>。 / 它们像新近 <span class=\"mask\">[xxx]</span> 的采矿主张一样，充满潜力。 / 但要把一项发现主张变成 <span class=\"mask\">[xxx]</span> 的发现，需要集体审视和接受。 / 这就是可信度形成过程；个人研究者的“我、这里、现在”在其中变成共同体的“任何人、任何地方、任何时候”。 / 客观知识是目标，不是起点。</p>\n</blockquote>\n<p>题干问可信度形成需要什么。第二段先把发现主张写成尚未成熟、但有潜力的东西，接着明确写出集体审视和接受，再把个人研究者的说法推向共同体。下面逐项比对。</p>\n","articleRects":[[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34]],"questionRects":[[185,513,980,35],[231,564,236,35],[230,615,210,29],[230,666,268,29],[268,717,258,35]],"scrollTarget":null,"meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. **[xxx]** inspection\n\n> **[xxx]** 的检查\n\n把A接回题干，它说的是：从第二段可以推断，可信度形成过程需要“**[xxx]** 的检查”。\n\nA里能看清的`inspection`和原文的`collective scrutiny`意思接近，所以回看写“把发现主张变成某种发现需要什么”的这句；A前面的遮挡位置还要和`collective`的限定放在一起判断。\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a **[xxx]** discovery.\n\n原文的`collective scrutiny`明确是这项转化所需要的条件之一，旁边还并列了`acceptance`。A的`inspection`对应`scrutiny`这个检查动作，但A前面的限定读不清，目前不知道它与`collective`是否一致，也不知道整个短语是否能把并列的`acceptance`一并概括进去。题干问可信度形成“需要什么”，而现有文字至少没有让`inspection`与所需条件发生冲突。\n\n**`inspection`已经对应`collective scrutiny`，而前面的限定又没有读清，此时能不能把A排除？**\n\n还不能。`collective scrutiny`直接支持“检查”这一步，遮挡位置可能继续限定检查方式；`acceptance`是否需要在选项中另行体现，单看当前短语也还不能拉开。\n\n**第一轮判断：A保留。**","html":"<h3>A. <span class=\"mask\">[xxx]</span> inspection</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的检查</p>\n</blockquote>\n<p>把A接回题干，它说的是：从第二段可以推断，可信度形成过程需要“<span class=\"mask\">[xxx]</span> 的检查”。</p>\n<p>A里能看清的<code>inspection</code>和原文的<code>collective scrutiny</code>意思接近，所以回看写“把发现主张变成某种发现需要什么”的这句；A前面的遮挡位置还要和<code>collective</code>的限定放在一起判断。</p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a <span class=\"mask\">[xxx]</span> discovery.</p>\n</blockquote>\n<p>原文的<code>collective scrutiny</code>明确是这项转化所需要的条件之一，旁边还并列了<code>acceptance</code>。A的<code>inspection</code>对应<code>scrutiny</code>这个检查动作，但A前面的限定读不清，目前不知道它与<code>collective</code>是否一致，也不知道整个短语是否能把并列的<code>acceptance</code>一并概括进去。题干问可信度形成“需要什么”，而现有文字至少没有让<code>inspection</code>与所需条件发生冲突。</p>\n<p><strong><code>inspection</code>已经对应<code>collective scrutiny</code>，而前面的限定又没有读清，此时能不能把A排除？</strong></p>\n<p>还不能。<code>collective scrutiny</code>直接支持“检查”这一步，遮挡位置可能继续限定检查方式；<code>acceptance</code>是否需要在选项中另行体现，单看当前短语也还不能拉开。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34]],"questionRects":[[185,513,980,35],[231,564,236,35],[230,615,210,29],[230,666,268,29],[268,717,258,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["A里能看清的`inspection`和原文的`collective scrutiny`意思接近，所以回看写“把发现主张变成某种发现需要什么”的这句；A前面的遮挡位置还要和`collective`的限定放在一起判断。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"collective scrutiny","visibleOptionAnchor":"inspection"}}}},{"section":"32题","raw":"### B. shared efforts\n\n> 共同努力\n\n把B接回题干，它说的是：从第二段可以推断，可信度形成过程需要“共同努力”。\n\nB里的`shared efforts`强调多人共同完成，而原文把所需条件写成`collective scrutiny and acceptance`，并让`individual researcher`变成`community`中的任何人，所以要回看这两句一起判断。\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a **[xxx]** discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.\n\n原文的`collective scrutiny and acceptance`写明审视和接受由集体完成，下一句又把个人研究者的`me, here, now`转成共同体的`anyone, anywhere, anytime`。B的`shared efforts`没有把条件限制在某一个动作上，而是概括多人共同参与这项转化。两边在参与者和过程方向上相同，因此能够回答题干所问的可信度形成需要什么。\n\n**由`individual researcher`走向`community`，并经过集体审视和接受，能不能概括成`shared efforts`？**\n\n能。`collective scrutiny and acceptance`给出了共同参与的动作，个人到共同体的变化又给出了参与范围，B没有把其中一个局部环节冒充整个过程。\n\n**第一轮判断：B保留。**","html":"<h3>B. shared efforts</h3>\n<blockquote>\n<p>共同努力</p>\n</blockquote>\n<p>把B接回题干，它说的是：从第二段可以推断，可信度形成过程需要“共同努力”。</p>\n<p>B里的<code>shared efforts</code>强调多人共同完成，而原文把所需条件写成<code>collective scrutiny and acceptance</code>，并让<code>individual researcher</code>变成<code>community</code>中的任何人，所以要回看这两句一起判断。</p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a <span class=\"mask\">[xxx]</span> discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.</p>\n</blockquote>\n<p>原文的<code>collective scrutiny and acceptance</code>写明审视和接受由集体完成，下一句又把个人研究者的<code>me, here, now</code>转成共同体的<code>anyone, anywhere, anytime</code>。B的<code>shared efforts</code>没有把条件限制在某一个动作上，而是概括多人共同参与这项转化。两边在参与者和过程方向上相同，因此能够回答题干所问的可信度形成需要什么。</p>\n<p><strong>由<code>individual researcher</code>走向<code>community</code>，并经过集体审视和接受，能不能概括成<code>shared efforts</code>？</strong></p>\n<p>能。<code>collective scrutiny and acceptance</code>给出了共同参与的动作，个人到共同体的变化又给出了参与范围，B没有把其中一个局部环节冒充整个过程。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34]],"questionRects":[[185,513,980,35],[231,564,236,35],[230,615,210,29],[230,666,268,29],[268,717,258,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["B里的`shared efforts`强调多人共同完成，而原文把所需条件写成`collective scrutiny and acceptance`，并让`individual researcher`变成`community`中的任何人，所以要回看这两句一起判断。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"collective scrutiny and acceptance","visibleOptionAnchor":"shared efforts"}}}},{"section":"32题","raw":"### C. individual wisdom\n\n> 个人智慧\n\n把C接回题干，它说的是：从第二段可以推断，可信度形成过程需要“个人智慧”。\n\nC里的`individual wisdom`把条件放在个人身上，而原文真正用`it takes`引出的条件是`collective scrutiny and acceptance`，两者参与范围相反，所以回看这句以及后面的个人到共同体转化。\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a **[xxx]** discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.\n\n原文的`collective scrutiny and acceptance`是使发现主张发生转化的条件，`individual researcher`只是转化的起点，终点是`community`。C的`individual wisdom`却把“由集体审视和接受”改成“依靠个人智慧”。这不是少写一个环节，而是把完成过程的主体从共同体换回个人，直接改变了题干所问的必要条件。\n\n**个人研究者是主张的起点，能不能据此把`collective scrutiny and acceptance`改成`individual wisdom`？**\n\n不能。起点是谁不等于转化靠谁完成；原文明确把条件交给集体审视和接受，C却把参与范围缩成个人。\n\n**第一轮判断：C排除。**","html":"<h3>C. individual wisdom</h3>\n<blockquote>\n<p>个人智慧</p>\n</blockquote>\n<p>把C接回题干，它说的是：从第二段可以推断，可信度形成过程需要“个人智慧”。</p>\n<p>C里的<code>individual wisdom</code>把条件放在个人身上，而原文真正用<code>it takes</code>引出的条件是<code>collective scrutiny and acceptance</code>，两者参与范围相反，所以回看这句以及后面的个人到共同体转化。</p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a <span class=\"mask\">[xxx]</span> discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.</p>\n</blockquote>\n<p>原文的<code>collective scrutiny and acceptance</code>是使发现主张发生转化的条件，<code>individual researcher</code>只是转化的起点，终点是<code>community</code>。C的<code>individual wisdom</code>却把“由集体审视和接受”改成“依靠个人智慧”。这不是少写一个环节，而是把完成过程的主体从共同体换回个人，直接改变了题干所问的必要条件。</p>\n<p><strong>个人研究者是主张的起点，能不能据此把<code>collective scrutiny and acceptance</code>改成<code>individual wisdom</code>？</strong></p>\n<p>不能。起点是谁不等于转化靠谁完成；原文明确把条件交给集体审视和接受，C却把参与范围缩成个人。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34]],"questionRects":[[185,513,980,35],[231,564,236,35],[230,615,210,29],[230,666,268,29],[268,717,258,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["C里的`individual wisdom`把条件放在个人身上，而原文真正用`it takes`引出的条件是`collective scrutiny and acceptance`，两者参与范围相反，所以回看这句以及后面的个人到共同体转化。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"collective scrutiny and acceptance","visibleOptionAnchor":"individual wisdom"}}}},{"section":"32题","raw":"### D. persistent innovation\n\n> 持续创新\n\n把D接回题干，它说的是：从第二段可以推断，可信度形成过程需要“持续创新”。\n\nD里的`persistent innovation`说的是不断产生新东西，而原文写的是`transform a discovery claim`，即把已经提出的主张转成另一种状态，所以回看这句以及它前面的`collective scrutiny and acceptance`。\n\n> But it takes collective scrutiny and acceptance to transform a discovery claim into a **[xxx]** discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.\n\n原文的`transform a discovery claim`处理的是一个已经存在的发现主张：共同体对它进行审视和接受，使它从个人说法走向共同体认可的状态。D的`persistent innovation`却要求持续进行创新，把“检验并转化已有主张”改成“不断产生新的发现”。动作对象和所处阶段都不同，因此不能回答第二段所说的可信度形成条件。\n\n**对已有主张进行审视并完成`transform a discovery claim`，能不能等同于`persistent innovation`？**\n\n不能。前者处理已有主张怎样获得可信度，后者强调持续创新；原文没有把不断产生新东西写成这项转化所需的条件。\n\n**第一轮判断：D排除。**","html":"<h3>D. persistent innovation</h3>\n<blockquote>\n<p>持续创新</p>\n</blockquote>\n<p>把D接回题干，它说的是：从第二段可以推断，可信度形成过程需要“持续创新”。</p>\n<p>D里的<code>persistent innovation</code>说的是不断产生新东西，而原文写的是<code>transform a discovery claim</code>，即把已经提出的主张转成另一种状态，所以回看这句以及它前面的<code>collective scrutiny and acceptance</code>。</p>\n<blockquote>\n<p>But it takes collective scrutiny and acceptance to transform a discovery claim into a <span class=\"mask\">[xxx]</span> discovery. This is the credibility process, through which the individual researcher’s me, here, now becomes the community’s anyone, anywhere, anytime.</p>\n</blockquote>\n<p>原文的<code>transform a discovery claim</code>处理的是一个已经存在的发现主张：共同体对它进行审视和接受，使它从个人说法走向共同体认可的状态。D的<code>persistent innovation</code>却要求持续进行创新，把“检验并转化已有主张”改成“不断产生新的发现”。动作对象和所处阶段都不同，因此不能回答第二段所说的可信度形成条件。</p>\n<p><strong>对已有主张进行审视并完成<code>transform a discovery claim</code>，能不能等同于<code>persistent innovation</code>？</strong></p>\n<p>不能。前者处理已有主张怎样获得可信度，后者强调持续创新；原文没有把不断产生新东西写成这项转化所需的条件。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34]],"questionRects":[[185,513,980,35],[231,564,236,35],[230,615,210,29],[230,666,268,29],[268,717,258,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["D里的`persistent innovation`说的是不断产生新东西，而原文写的是`transform a discovery claim`，即把已经提出的主张转成另一种状态，所以回看这句以及它前面的`collective scrutiny and acceptance`。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"transform a discovery claim","visibleOptionAnchor":"persistent innovation"}}}},{"section":"32题","raw":"### 32题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n这一轮留下A和B。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。","html":"<h3>32题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下A和B。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n","articleRects":[],"questionRects":[[185,513,980,35],[231,564,236,35],[230,615,210,29],[230,666,268,29],[268,717,258,35]],"scrollTarget":null,"meta":{"kind":"result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> Paragraph 3 shows that a discovery claim becomes credible after it ______.  \n> 第三段表明，一项发现主张在什么之后会变得可信？\n\n题干明确写了`Paragraph 3`，所以直接回到第三段，把这一段完整读完。\n\n> 原文参考：\n>\n> Once a discovery claim becomes public, the discoverer receives **[xxx]** credit. But, unlike with mining claims, the community takes control of what happens next. Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as **[xxx]** by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly **[xxx]** technology. As a discovery claim works its way through the community, the interaction and **[xxx]** between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n>\n> 开始精读：\n>\n> Once a discovery claim becomes public, the discoverer receives **[xxx]** credit. / But, unlike with mining claims, the community takes control of what happens next. / Within the complex social structure of the scientific community, researchers make discoveries; / editors and reviewers act as **[xxx]** by controlling the publication process; / other scientists use the new finding to suit their own purposes; / and finally, the public (including other scientists) receives the new discovery and possibly **[xxx]** technology. / As a discovery claim works its way through the community, the interaction and **[xxx]** between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n>\n> 顺着英文顺序读：\n>\n> 一项发现主张公开后，发现者获得 **[xxx]** 荣誉。 / 但与采矿主张不同，接下来发生什么由共同体接管。 / 在科学共同体复杂的社会结构中，研究者作出发现； / 编辑和审稿人通过控制发表过程充当 **[xxx]**； / 其他科学家把新发现用于自己的目的； / 最后，公众，包括其他科学家，接收新发现以及可能随之而来的 **[xxx]** 技术。 / 当发现主张在共同体中推进时，共同与竞争信念之间的互动和 **[xxx]**，把个人的发现主张变成共同体的可信发现。\n\n题干问一项主张在什么之后变得可信。第三段从主张公开以后写起，列出研究者、编辑和审稿人、其他科学家、公众等参与者，最后说明个人主张怎样在共同体中转成可信发现。下面看四项有没有保留这条关系。","html":"<h2>33题</h2>\n<blockquote>\n<p>Paragraph 3 shows that a discovery claim becomes credible after it ______.<br />\n第三段表明，一项发现主张在什么之后会变得可信？</p>\n</blockquote>\n<p>题干明确写了<code>Paragraph 3</code>，所以直接回到第三段，把这一段完整读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Once a discovery claim becomes public, the discoverer receives <span class=\"mask\">[xxx]</span> credit. But, unlike with mining claims, the community takes control of what happens next. Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as <span class=\"mask\">[xxx]</span> by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly <span class=\"mask\">[xxx]</span> technology. As a discovery claim works its way through the community, the interaction and <span class=\"mask\">[xxx]</span> between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.</p>\n<p>开始精读：</p>\n<p>Once a discovery claim becomes public, the discoverer receives <span class=\"mask\">[xxx]</span> credit. / But, unlike with mining claims, the community takes control of what happens next. / Within the complex social structure of the scientific community, researchers make discoveries; / editors and reviewers act as <span class=\"mask\">[xxx]</span> by controlling the publication process; / other scientists use the new finding to suit their own purposes; / and finally, the public (including other scientists) receives the new discovery and possibly <span class=\"mask\">[xxx]</span> technology. / As a discovery claim works its way through the community, the interaction and <span class=\"mask\">[xxx]</span> between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.</p>\n<p>顺着英文顺序读：</p>\n<p>一项发现主张公开后，发现者获得 <span class=\"mask\">[xxx]</span> 荣誉。 / 但与采矿主张不同，接下来发生什么由共同体接管。 / 在科学共同体复杂的社会结构中，研究者作出发现； / 编辑和审稿人通过控制发表过程充当 <span class=\"mask\">[xxx]</span>； / 其他科学家把新发现用于自己的目的； / 最后，公众，包括其他科学家，接收新发现以及可能随之而来的 <span class=\"mask\">[xxx]</span> 技术。 / 当发现主张在共同体中推进时，共同与竞争信念之间的互动和 <span class=\"mask\">[xxx]</span>，把个人的发现主张变成共同体的可信发现。</p>\n</blockquote>\n<p>题干问一项主张在什么之后变得可信。第三段从主张公开以后写起，列出研究者、编辑和审稿人、其他科学家、公众等参与者，最后说明个人主张怎样在共同体中转成可信发现。下面看四项有没有保留这条关系。</p>\n","articleRects":[[225,730,941,35],[165,764,1002,34],[165,794,1000,42],[165,831,1001,35],[165,865,1002,34],[165,897,1001,36],[165,932,1002,34],[165,965,1001,35],[166,999,1001,34],[165,1032,1001,35],[165,1066,131,34]],"questionRects":[[185,819,974,35],[230,870,621,34],[230,921,625,34],[230,972,675,34],[230,1023,593,34]],"scrollTarget":null,"meta":{"kind":"question","qid":"33"}},{"section":"33题","raw":"### A. has attracted the attention of the general public\n\n> 吸引了普通公众的注意\n\n把A接回题干，它说的是：第三段表明，一项发现主张在吸引普通公众注意之后会变得可信。\n\nA里的`attracted the attention`和原文的`receives the new discovery`都涉及公众接触发现，但动作并不一样，所以回看公众出现的这句，再看紧接着是谁把个人主张变成可信发现。\n\n> and finally, the public (including other scientists) receives the new discovery and possibly **[xxx]** technology. As a discovery claim works its way through the community, the interaction and **[xxx]** between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.\n\n原文的`receives the new discovery`只说公众在过程后部接收新发现；下一句把转化归给主张在共同体中推进时发生的互动。A的`attracted the attention`却改成发现主动吸引公众注意，并进一步把这种注意写成变得可信之前的条件。动作从“公众接收”换成“发现吸引”，又新增了注意导致可信的因果，这两处都会改变题干中`after it`所接的条件。\n\n**公众在最后`receives`一项发现，能不能改成发现先`attracted the attention`，然后因此变得可信？**\n\n不能。`receives the new discovery`没有建立“吸引注意”这个动作，更没有把公众注意写成可信度形成的原因；原文给出的转化力量是共同体中的互动。\n\n**第一轮判断：A排除。**","html":"<h3>A. has attracted the attention of the general public</h3>\n<blockquote>\n<p>吸引了普通公众的注意</p>\n</blockquote>\n<p>把A接回题干，它说的是：第三段表明，一项发现主张在吸引普通公众注意之后会变得可信。</p>\n<p>A里的<code>attracted the attention</code>和原文的<code>receives the new discovery</code>都涉及公众接触发现，但动作并不一样，所以回看公众出现的这句，再看紧接着是谁把个人主张变成可信发现。</p>\n<blockquote>\n<p>and finally, the public (including other scientists) receives the new discovery and possibly <span class=\"mask\">[xxx]</span> technology. As a discovery claim works its way through the community, the interaction and <span class=\"mask\">[xxx]</span> between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.</p>\n</blockquote>\n<p>原文的<code>receives the new discovery</code>只说公众在过程后部接收新发现；下一句把转化归给主张在共同体中推进时发生的互动。A的<code>attracted the attention</code>却改成发现主动吸引公众注意，并进一步把这种注意写成变得可信之前的条件。动作从“公众接收”换成“发现吸引”，又新增了注意导致可信的因果，这两处都会改变题干中<code>after it</code>所接的条件。</p>\n<p><strong>公众在最后<code>receives</code>一项发现，能不能改成发现先<code>attracted the attention</code>，然后因此变得可信？</strong></p>\n<p>不能。<code>receives the new discovery</code>没有建立“吸引注意”这个动作，更没有把公众注意写成可信度形成的原因；原文给出的转化力量是共同体中的互动。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[225,730,941,35],[165,764,1002,34],[165,794,1000,42],[165,831,1001,35],[165,865,1002,34],[165,897,1001,36],[165,932,1002,34],[165,965,1001,35],[166,999,1001,34],[165,1032,1001,35],[165,1066,131,34]],"questionRects":[[  individual’s discovery claim into the community’s credible discovery.\n\n原文的`controlling the publication process`只说明编辑和审稿人负责发表环节，后面仍有其他科学家使用、公众接收以及不同信念之间的互动。C的`from editors and reviewers`却把可信度变化收束为从这两类人那里获得某物之后完成。即使遮挡位置补出一种肯定评价，也只能说明编辑和审稿人给了什么，不能让后续共同体环节消失；C把全过程缩成了其中一部分。\n\n**编辑和审稿人只负责`controlling the publication process`，能不能由`from editors and reviewers`这一环单独完成可信度转化？**\n\n不能。原文在编辑和审稿人之后还继续写其他科学家、公众和共同体互动，这些都参与了主张变可信的过程；遮挡内容改不了这种部分与整体的差别。\n\n**第一轮判断：C排除。**","html":"<h3>C. has received <span class=\"mask\">[xxx]</span> from editors and reviewers</h3>\n<blockquote>\n<p>获得编辑和审稿人的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把C接回题干，它说的是：第三段表明，一项发现主张在从编辑和审稿人那里获得某种 <span class=\"mask\">[xxx]</span> 之后会变得可信。</p>\n<p>C里的<code>from editors and reviewers</code>把关键条件锁在编辑和审稿人身上，原文给他们的动作是<code>controlling the publication process</code>，所以先回看这一分句，再顺着后面的其他科学家、公众和共同体互动继续看。</p>\n<blockquote>\n<p>editors and reviewers act as <span class=\"mask\">[xxx]</span> by controlling the publication process; other scientists use the new finding to suit their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly <span class=\"mask\">[xxx]</span> technology. As a discovery claim works its way through the community, the interaction and <span class=\"mask\">[xxx]</span> between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.</p>\n</blockquote>\n<p>原文的<code>controlling the publication process</code>只说明编辑和审稿人负责发表环节，后面仍有其他科学家使用、公众接收以及不同信念之间的互动。C的<code>from editors and reviewers</code>却把可信度变化收束为从这两类人那里获得某物之后完成。即使遮挡位置补出一种肯定评价，也只能说明编辑和审稿人给了什么，不能让后续共同体环节消失；C把全过程缩成了其中一部分。</p>\n<p><strong>编辑和审稿人只负责<code>controlling the publication process</code>，能不能由<code>from editors and reviewers</code>这一环单独完成可信度转化？</strong></p>\n<p>不能。原文在编辑和审稿人之后还继续写其他科学家、公众和共同体互动，这些都参与了主张变可信的过程；遮挡内容改不了这种部分与整体的差别。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","article 的互动发生转化。D的`frequently quoted`把“使用”换成“频繁引用”，又把引用次数写成变可信之前的条件。原文既没有这个频率，也没有建立“被引用所以可信”的因果，因此D改变了题干所问的动作和条件。\n\n**`other scientists use the new finding`，能不能改成主张因为`frequently quoted`才变得可信？**\n\n不能。使用不等于频繁引用，真正完成转化的是共同体中的互动；D新增的引用动作、频率和因果都没有在第三段建立。\n\n**第一轮判断：D排除。**","html":"<h3>D. has been frequently quoted by peer scientists</h3>\n<blockquote>\n<p>被同行科学家频繁引用</p>\n</blockquote>\n<p>把D接回题干，它说的是：第三段表明，一项发现主张在被同行科学家频繁引用之后会变得可信。</p>\n<p>D里的<code>frequently quoted</code>表示被反复引用，而原文给同行科学家的动作是<code>other scientists use the new finding</code>，两者动作不同，所以回看这一句，再看随后共同体互动怎样完成转化。</p>\n<blockquote>\n<p>other scientists use the new finding to suit their own purposes; ... As a discovery claim works its way through the community, the interaction and <span class=\"mask\">[xxx]</span> between shared and competing beliefs about the science and the technology involved transforms an individual’s discovery claim into the community’s credible discovery.</p>\n</blockquote>\n<p>原文的<code>other scientists use the new finding</code>说其他科学家把新发现用于自己的目的，随后主张在共同体中经由不同信念的互动发生转化。D的<code>frequently quoted</code>把“使用”换成“频繁引用”，又把引用次数写成变可信之前的条件。原文既没有这个频率，也没有建立“被引用所以可信”的因果，因此D改变了题干所问的动作和条件。</p>\n<p><strong><code>other scientists use the new finding</code>，能不能改成主张因为<code>frequently quoted</code>才变得可信？</strong></p>\n<p>不能。使用不等于频繁引用，真正完成转化的是共同体中的互动；D新增的引用动作、频率和因果都没有在第三段建立。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,730,941,35],[165,764,1002,34],[165,794,1000,42],[165,831,1001,35],[165,865,1002,34],[165,897,1001,36],[165,932,1002,34],[165,965,1001,35],[166,999,1001,34],[165,1032,1001,35],[165,1066,131,34]],"questionRects":[[185,819,974,35],[230,870,621,34],[230,921,625,34],[230,972,675,34],[230,1023,593,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"33","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer"," ovelty itself frequently **[xxx]** **[xxx]**. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views. Sometimes years are required for truly novel discovery claims to be accepted and appreciated.\n>\n> 开始精读：\n>\n> Two paradoxes exist throughout this credibility process. / First, scientific work tends to focus on some aspect of **[xxx]** knowledge that is viewed as incomplete or incorrect. / Little reward accompanies **[xxx]** and confirmation of what is already known and believed. / The goal is new-search, not re-search. / Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or **[xxx]** by future researchers. / Second, novelty itself frequently **[xxx]** **[xxx]**. / Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views. / Sometimes years are required for truly novel discovery claims to be accepted and appreciated.\n>\n> 顺着英文顺序读：\n>\n> 在这一可信度形成过程中存在两个悖论。 / 第一，科学工作往往关注 **[xxx]** 知识中被认为不完整或错误的某个方面。 / 对已经知道并相信的内容进行 **[xxx]** 和确认，所得回报很少。 / 目标是新探索，而不是重复探索。 / 因此，看起来重要且有说服力的新发现主张和可信发现，总会面对挑战，并可能被未来研究者修改或 **[xxx]**。 / 第二，新颖性本身经常 **[xxx]** **[xxx]**。 / 诺奖得主、生理学家 Albert Szent-Györgyi 曾把发现描述为“看见人人都看见的，却想到无人想到的”；但想到别人没想到的，再告诉他们漏掉了什么，未必会改变他们的看法。 / 真正新颖的发现主张，有时需要多年才会被接受和欣赏。\n\n题干要判断Albert Szent-Györgyi最可能同意哪句话。第四段先写科学工作追求新东西、已有主张仍会被挑战，再引出他关于“人人看见同样的东西，却想到别人没有想到的东西”的话，并说明新想法未必马上改变别人。下面逐项比较。","html":"<h2>34题</h2>\n<blockquote>\n<p>Albert Szent-Györgyi would most likely agree that ______.<br />\nAlbert Szent-Györgyi最可能同意什么？</p>\n</blockquote>\n<p>题干给出了<code>Albert Szent-Györgyi</code>这个人物，直接在第四段找到他的名字，再把这一整段从头读到尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Two paradoxes exist throughout this credibility process. First, scientific work tends to focus on some aspect of <span class=\"mask\">[xxx]</span> knowledge that is viewed as incomplete or incorrect. Little reward accompanies <span class=\"mask\">[xxx]</span> and confirmation of what is already known and believed. The goal is new-search, not re-search. Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or <span class=\"mask\">[xxx]</span> by future researchers. Second, novelty itself frequently <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span>. Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views. Sometimes years are required for truly novel discovery claims to be accepted and appreciated.</p>\n<p>开始精读：</p>\n<p>Two paradoxes exist throughout this credibility process. / First, scientific work tends to focus on some aspect of <span class=\"mask\">[xxx]</span> knowledge that is viewed as incomplete or incorrect. / Little reward accompanies <span class=\"mask\">[xxx]</span> and confirmation of what is already known and believed. / The goal is new-search, not re-search. / Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or <span class=\"mask\">[xxx]</span> by future researchers. / Second, novelty itself frequently <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span>. / Nobel Laureate and physiologist Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views. / Sometimes years are required for truly novel discovery claims to be accepted and appreciated.</p>\n<p>顺着英文顺序读：</p>\n<p>在这一可信度形成过程中存在两个悖论。 / 第一，科学工作往往关注 <span class=\"mask\">[xxx]</span> 知识中被认为不完整或错误的某个方面。 / 对已经知道并相信的内容进行 <span class=\"mask\">[xxx]</span> 和确认，所得回报很少。 / 目标是新探索，而不是重复探索。 / 因此，看起来重要且有说服力的新发现主张和可信发现，总会面对挑战，并可能被未来研究者修改或 <span class=\"mask\">[xxx]</span>。 / 第二，新颖性本身经常 <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span>。 / 诺奖得主、生理学家 Albert Szent-Györgyi 曾把发现描述为“看见人人都看见的，却想到无人想到的”；但想到别人没想到的，再告诉他们漏掉了什么，未必会改变他们的看法。 / 真正新颖的发现主张，有时需要多年才会被接受和欣赏。</p>\n</blockquote>\n<p>题干要判断Albert Szent-Györgyi最可能同意哪句话。第四段先写科学工作追求新东西、已有主张仍会被挑战，再引出他关于“人人看见同样的东西，却想到别人没有想到的东西”的话，并说明新想法未必马上改变别人。下面逐项比较。</p>\n","articleRects":[[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35]],"questionRects":[[185,1125,775,34],[230,1176,531,34],[230,1227,533,34],[230,1278,527,34],[269,1328,298,29]],"scrollTarget":null,"meta":{"kind":"question","qid":"34"}},{"section":"34题","raw":"### A. scientific claims will survive challenges\n\n> 科学主张会经受住挑战\n\n把A接回题干，它说的是：Albert Szent-Györgyi最可能同意，科学主张最终会经受住挑战。\n\nA里的`will survive challenges`说主张会在挑战后保留下来，原文只写它们`open to challenge`，所以回看这句，并连同后面的`potential modification`一起判断。\n\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or **[xxx]** by future researchers.\n\n原文的`open to challenge`说明主张会持续接受质疑，`potential modification`还说明它可能被修改。A的`will survive challenges`则把尚未确定的后果改成必然成功经受挑战。一个是暴露在挑战中，另一个是保证挑战后仍然成立，这个结果差别直接决定能不能把A当成Albert Szent-Györgyi会同意的判断。\n\n**主张只是`open to challenge`并可能被修改，能不能进一步保证它`will survive challenges`？**\n\n不能。面对挑战不等于一定经受住挑战，`potential modification`还保留了主张被改变的可能；A把开放结果写成了确定结果。\n\n**第一轮判断：A排除。**","html":"<h3>A. scientific claims will survive challenges</h3>\n<blockquote>\n<p>科学主张会经受住挑战</p>\n</blockquote>\n<p>把A接回题干，它说的是：Albert Szent-Györgyi最可能同意，科学主张最终会经受住挑战。</p>\n<p>A里的<code>will survive challenges</code>说主张会在挑战后保留下来，原文只写它们<code>open to challenge</code>，所以回看这句，并连同后面的<code>potential modification</code>一起判断。</p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or <span class=\"mask\">[xxx]</span> by future researchers.</p>\n</blockquote>\n<p>原文的<code>open to challenge</code>说明主张会持续接受质疑，<code>potential modification</code>还说明它可能被修改。A的<code>will survive challenges</code>则把尚未确定的后果改成必然成功经受挑战。一个是暴露在挑战中，另一个是保证挑战后仍然成立，这个结果差别直接决定能不能把A当成Albert Szent-Györgyi会同意的判断。</p>\n<p><strong>主张只是<code>open to challenge</code>并可能被修改，能不能进一步保证它<code>will survive challenges</code>？</strong></p>\n<p>不能。面对挑战不等于一定经受住挑战，<code>potential modification</code>还保留了主张被改变的可能；A把开放结果写成了确定结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35]],"questionRects":[[185,1125,775,34],[230,1176,531,34],[230,1227,533,34],[230,1278,527,34],[269,1328,298,29]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["A里的`will survive challenges`说主张会在挑战后保留下来，原文只写它们`open to challenge`，所以回看这句，并连同后面的`potential modification`一起判断。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"open to challenge","visibleOptionAnchor":"will survive challenges"}}}},{"section":"34题","raw":"### B. discoveries today inspire future research\n\n> 今天的发现会启发未来研究\n\n把B接回题干，它说的是：Albert Szent-Györgyi最可能同意，今天的发现会启发未来研究。\n\nB里的`inspire future research`涉及后续研究受到启发，而名言的核心是`thinking what nobody has thought`，后一句又说新想法`may not change their views`，所以要把这两句一起回看。\n\n> Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views.\n\n原文的`thinking what nobody has thought`描述的是发现者面对同样事物时产生别人没有的想法；`may not change their views`又说明这种新想法甚至未必改变别人。B的`inspire future research`却增加了“今天的发现推动未来研究”的时间关系和因果结果。原文没有写后来的研究会受启发，后一句反而削弱了这种影响必然发生的说法，因此B不能由名言推出。\n\n**`thinking what nobody has thought`甚至可能不改变别人，能不能直接推出它会`inspire future research`？**\n\n不能。独立产生新想法不等于未来研究一定受到启发，`may not change their views`还明确保留了别人不受影响的可能。\n\n**第一轮判断：B排除。**","html":"<h3>B. discoveries today inspire future research</h3>\n<blockquote>\n<p>今天的发现会启发未来研究</p>\n</blockquote>\n<p>把B接回题干，它说的是：Albert Szent-Györgyi最可能同意，今天的发现会启发未来研究。</p>\n<p>B里的<code>inspire future research</code>涉及后续研究受到启发，而名言的核心是<code>thinking what nobody has thought</code>，后一句又说新想法<code>may not change their views</code>，所以要把这两句一起回看。</p>\n<blockquote>\n<p>Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views.</p>\n</blockquote>\n<p>原文的<code>thinking what nobody has thought</code>描述的是发现者面对同样事物时产生别人没有的想法；<code>may not change their views</code>又说明这种新想法甚至未必改变别人。B的<code>inspire future research</code>却增加了“今天的发现推动未来研究”的时间关系和因果结果。原文没有写后来的研究会受启发，后一句反而削弱了这种影响必然发生的说法，因此B不能由名言推出。</p>\n<p><strong><code>thinking what nobody has thought</code>甚至可能不改变别人，能不能直接推出它会<code>inspire future research</code>？</strong></p>\n<p>不能。独立产生新想法不等于未来研究一定受到启发，<code>may not change their views</code>还明确保留了别人不受影响的可能。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35]],"questionRects":[[185,1125,775,34],[230,1176,531,34],[230,1227,533,34],[230,1278,527,34],[269,1328,298,29]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["B里的`inspire future research`涉及后续研究受到启发，而名言的核心是`thinking what nobody has thought`，后一句又说新想法`may not change their views`，所以要把这两句一起回看。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","time"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"thinking what nobody has thought","visibleOptionAnchor":"inspire future research"}}}},{"section":"34题","raw":"### C. efforts to make discoveries are **[xxx]**\n\n> 进行发现的努力是 **[xxx]** 的\n\n把C接回题干，它说的是：Albert Szent-Györgyi最可能同意，进行发现的努力具有某种 **[xxx]** 的评价。\n\nC里的`efforts to make discoveries`把对象放在“进行发现的努力”上，而原文名言从`seeing what everybody has seen`开始，描述的是发现者怎样看、怎样想，所以回看整句和后面的补充。\n\n> Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views.\n\n原文的`seeing what everybody has seen`和后面的`thinking what nobody has thought`都在描述发现时的思考方式，下一句只补充这种新想法未必改变别人。C的`efforts to make discoveries`却把对象换成“进行发现的努力”，并要求给这些努力下一个 **[xxx]** 的评价。遮挡位置决定评价内容，但无论是哪种评价，原文都没有建立“发现努力具有这种价值”的关系；对象和判断类型都被换掉了。\n\n**原文只从`seeing what everybody has seen`开始描述怎样发现，能不能据此评价`efforts to make discoveries`是某种性质？**\n\n不能。描述发现者怎样观察和思考，不等于评价进行发现的努力；被挡住的词只能补出评价是什么，补不出原文没有建立的评价关系。\n\n**第一轮判断：C排除。**","html":"<h3>C. efforts to make discoveries are <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>进行发现的努力是 <span class=\"mask\">[xxx]</span> 的</p>\n</blockquote>\n<p>把C接回题干，它说的是：Albert Szent-Györgyi最可能同意，进行发现的努力具有某种 <span class=\"mask\">[xxx]</span> 的评价。</p>\n<p>C里的<code>efforts to make discoveries</code>把对象放在“进行发现的努力”上，而原文名言从<code>seeing what everybody has seen</code>开始，描述的是发现者怎样看、怎样想，所以回看整句和后面的补充。</p>\n<blockquote>\n<p>Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.” But thinking what nobody else has thought and telling others what they have missed may not change their views.</p>\n</blockquote>\n<p>原文的<code>seeing what everybody has seen</code>和后面的<code>thinking what nobody has thought</code>都在描述发现时的思考方式，下一句只补充这种新想法未必改变别人。C的<code>efforts to make discoveries</code>却把对象换成“进行发现的努力”，并要求给这些努力下一个 <span class=\"mask\">[xxx]</span> 的评价。遮挡位置决定评价内容，但无论是哪种评价，原文都没有建立“发现努力具有这种价值”的关系；对象和判断类型都被换掉了。</p>\n<p><strong>原文只从<code>seeing what everybody has seen</code>开始描述怎样发现，能不能据此评价<code>efforts to make discoveries</code>是某种性质？</strong></p>\n<p>不能。描述发现者怎样观察和思考，不等于评价进行发现的努力；被挡住的词只能补出评价是什么，补不出原文没有建立的评价关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35]],"questionRects":[[185,1125,775,34],[230,1176,531,34],[230,1227,533,34],[230,1278,527,34],[269,1328,298,29]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","sourceAnchors":["C里的`efforts to make discoveries`把对象放在“进行发现的努力”上，而原文名言从`seeing what everybody has seen`开始，描述的是发现者怎样看、怎样想，所以回看整句和后面的补充。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"seeing what everybody has seen","visibleOptionAnchor":"efforts to make discoveries"}}}},{"section":"34题","raw":"### D. scientific work calls for a critical mind\n\n> 科学工作需要批判性思维\n\n把D接回题干，它说的是：Albert Szent-Györgyi最可能同意，科学工作需要批判性思维。\n\nD里的`critical mind`强调不照搬已有看法，原文名言中的`thinking what nobody has thought`正是在同样观察上提出不同想法；前文又说主张`open to challenge`，所以把这两处一起回看。\n\n> Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or **[xxx]** by future researchers. ... Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”\n\n原文的`thinking what nobody has thought`要求面对人人看见的事物仍能提出不同想法，`open to challenge`又说明即使看起来重要、可信的主张也可以被质疑和修改。D的`critical mind`正是在概括这种不把已有看法当成终点、继续重新审视的思维方式。它没有保证新想法一定正确，只说科学工作需要这种思考能力，因此与名言和前文方向一致。\n\n**既要`thinking what nobody has thought`，又要让已有主张保持`open to challenge`，能不能概括为需要`critical mind`？**\n\n能。一个要求提出不同判断，一个允许继续质疑和修改，二者都指向独立审视已有认识的能力，D没有额外保证结果一定成功。\n\n**第一轮判断：D保留。**","html":"<h3>D. scientific work calls for a critical mind</h3>\n<blockquote>\n<p>科学工作需要批判性思维</p>\n</blockquote>\n<p>把D接回题干，它说的是：Albert Szent-Györgyi最可能同意，科学工作需要批判性思维。</p>\n<p>D里的<code>critical mind</code>强调不照搬已有看法，原文名言中的<code>thinking what nobody has thought</code>正是在同样观察上提出不同想法；前文又说主张<code>open to challenge</code>，所以把这两处一起回看。</p>\n<blockquote>\n<p>Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential modification or <span class=\"mask\">[xxx]</span> by future researchers. ... Albert Szent-Györgyi once described discovery as “seeing what everybody has seen and thinking what nobody has thought.”</p>\n</blockquote>\n<p>原文的<code>thinking what nobody has thought</code>要求面对人人看见的事物仍能提出不同想法，<code>open to challenge</code>又说明即使看起来重要、可信的主张也可以被质疑和修改。D的<code>critical mind</code>正是在概括这种不把已有看法当成终点、继续重新审视的思维方式。它没有保证新想法一定正确，只说科学工作需要这种思考能力，因此与名言和前文方向一致。</p>\n<p><strong>既要<code>thinking what nobody has thought</code>，又要让已有主张保持<code>open to challenge</code>，能不能概括为需要<code>critical mind</code>？</strong></p>\n<p>能。一个要求提出不同判断，一个允许继续质疑和修改，二者都指向独立审视已有认识的能力，D没有额外保证结果一定成功。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35]],"questionRects":[[185,1125,775,34],[ ng Science**\n\n科学实践中可信度的形成\n\nD. **Challenge to Credibility at the Gate to Science**\n\n科学门口对可信度的挑战","html":"<h2>35题</h2>\n<p><strong>Which of the following would be the best title of the text?</strong></p>\n<p>下面哪个标题最适合这篇文章？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Novelty as an Engine of Scientific Development</strong></p>\n<p>新颖性：科学发展的引擎</p>\n<p>B. <strong>Collective Scrutiny in Scientific Discovery</strong></p>\n<p>科学发现中的集体审查</p>\n<p>C. <strong>Evolution of Credibility in Doing Science</strong></p>\n<p>科学实践中可信度的形成</p>\n<p>D. <strong>Challenge to Credibility at the Gate to Science</strong></p>\n<p>科学门口对可信度的挑战</p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35],[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34],[225,730,941,35],[165,764,1002,34],[165,794,1000,42],[165,831,1001,35],[165,865,1002,34],[165,897,1001,36],[165,932,1002,34],[165,965,1001,35],[166,999,1001,34],[165,1032,1001,35],[165,1066,131,34],[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35],[224,1535,943,35],[165,1569,1007,35],[165,1603,1001,35]],"questionRects":[[185,1430,773,35],[231,1481,635,35],[230,1532,565,35],[230,1583,554,35],[268,1634,554,35]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写理想中的科学发现应当客观整齐，再指出现实发现会受经历、知识和兴趣影响，路径复杂且容易出错 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 把刚出现的发现主张称为原始阶段，说明它必须经过集体审视和接受，才能变成成熟、客观的知识 | 再说一个东西还只是半成品 |\n| 3 | 展开共同体中的多方角色：研究者、编辑审稿人、其他科学家和公众共同参与，把个人主张变成共同体的可信发现 | 接着说它要经过很多人才能成形 |\n| 4 | 补出可信度形成中的两个悖论：新主张会不断受挑战，而真正新颖的想法又常先遭到怀疑 | 再说中间还有两处矛盾 |\n| 5 | 用“共同推理、质疑、修订和补全”收束，强调可信度是在共同思考中逐渐发生的 | 最后下结论：大家一起把它做完 |\n\n先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先写理想中的科学发现应当客观整齐，再指出现实发现会受经历、知识和兴趣影响，路径复杂且容易出错</td>\n  <td>先摆出一种理想说法，再拆掉它</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>把刚出现的发现主张称为原始阶段，说明它必须经过集体审视和接受，才能变成成熟、客观的知识</td>\n  <td>再说一个东西还只是半成品</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>展开共同体中的多方角色：研究者、编辑审稿人、其他科学家和公众共同参与，把个人主张变成共同体的可信发现</td>\n  <td>接着说它要经过很多人才能成形</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>补出可信度形成中的两个悖论：新主张会不断受挑战，而真正新颖的想法又常先遭到怀疑</td>\n  <td>再说中间还有两处矛盾</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>用“共同推理、质疑、修订和补全”收束，强调可信度是在共同思考中逐渐发生的</td>\n  <td>最后下结论：大家一起把它做完</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,34],[165,361,1002,35],[165,395,1003,34],[165,424,1002,43],[165,462,1000,34],[216,495,170,35],[225,525,943,44],[165,563,1002,34],[166,596,993,35],[165,630,999,34],[165,663,1002,35],[165,697,416,34],[225,730,941,35],[165,764,1002,34],[165,794,1000,42],[165,831,1001,35],[165,865,1002,34],[165,897,1001,36],[165,932,1002,34],[165,965,1001,35],[166,999,1001,34],[165,1032,1001,35],[165,1066,131,34],[224,1100,942,34],[165,1133,1001,35],[165,1167,1002,34],[165,1200,994,35],[165,1234,1002,34],[165,1267,1001,35],[165,1301,1001,35],[165,1335,1001,34],[165,1367,1002,35],[165,1400,1002,36],[165,1435,1001,35],[165,1469,1002,34],[165,1502,153,35],[224,1535,943,35],[165,1569,1007,35],[165,1603,1001,35]],"questionRects":[[185,1430,773,35],[231,1481,635,35],[230,1532,565,35],[230,1583,554,35],[268,1634,554,35]],"scrollTarget":null,"meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"### A. Novelty as an Engine of Scientific Development\n\n> 新颖性：科学发展的引擎\n\n如果A是主旨，全文应当把“新颖性”当成推动科学前进的核心力量，主要写新想法怎样产生突破、带来后续成果，并最终证明创新越多，发展越快。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写旧知识不够用了，必须出现新想法 | 先摆出一种理想说法，再拆掉它 |\n| 2 | 说明新想法一出现就具有推动力 | 再说一个东西还只是半成品 |\n| 3 | 写新想法怎样被采用并产生影响 | 接着说它要经过很多人才能成形 |\n| 4 | 集中列出新颖性带来的突破与收益 | 再说中间还有两处矛盾 |\n| 5 | 最后肯定新颖性是持续发展的发动机 | 最后下结论：大家一起把它做完 |\n\nA只能覆盖第四段里“新颖想法常被怀疑”的一小部分，而且原文还说重复确认回报少，却没有把新颖性写成全文的发动机。前面三段和结尾一直追踪的是可信度怎样形成。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. Novelty as an Engine of Scientific Development</h3>\n<blockquote>\n<p>新颖性：科学发展的引擎</p>\n</blockquote>\n<p>如果A是主旨，全文应当把“新颖性”当成推动科学前进的核心力量，主要写新想法怎样产生突破、带来后续成果，并最终证明创新越多，发展越快。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先写旧知识不够用了，必须出现新想法</td>\n  <td>先摆出一种理想说法，再拆掉它</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明新想法一出现就具有推动力</td>\n  <td>再说一个东西还只是半成品</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>写新想法怎样被采用并产生影响</td>\n  <td>接着说它要经过很多人才能成形</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>集中列出新颖性带来的突破与收益</td>\n  <td>再说中间还有两处矛盾</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>最后肯定新颖性是持续发展的发动机</td>\n  <td>最后下结论：大家一起把它做完</td>\n</tr>\n</tbody>\n</table>\n<p>A只能覆盖第四段里“新颖想法常被怀疑”的一小部分，而且原文还说重复确认回报少，却没有把新颖性写成全文的发动机。前面三段和结尾一直追踪的是可信度怎样形成。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[225,261,942,33],[165,294,1001,35],[166,328,997,
