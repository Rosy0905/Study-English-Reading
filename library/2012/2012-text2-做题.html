一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"26题","raw":"## 26题\n\n> The phrase “reneging on” (Line 3, Para. 1) is closest in meaning to ______.  \n> 第一段reneging on最接近哪个意思？\n\n被考短语后面是commitment；下一段Instead把公司实际做的事说清了。\n\n> 原文参考：\n> \n> A deal is a deal—except, apparently, when Entergy is involved. The company, a major energy supplier in New England, provoked justified **[xxx]** in Vermont last week when it announced it was reneging on a **[xxx]** commitment to abide by the state’s strict nuclear regulations.\n> \n> 开始精读：\n> \n> A deal is a deal—except, apparently, when Entergy is involved. / The company, a major energy supplier in New England, provoked justified **[xxx]** in Vermont last week / when it announced it was reneging on a **[xxx]** commitment to abide by the state’s strict nuclear regulations.\n> \n> 协议就是协议——显然，除非涉及Entergy。/ 这家新英格兰的大型能源供应商，上周在Vermont引发了有道理的**[xxx]**，/ 因为它宣布正在违背一项**[xxx]**承诺：遵守该州严格的核能规定。\n\n> 原文参考：\n> \n> Instead, the company has done precisely what it had long promised it would not: challenge the **[xxx]** of Vermont’s rules in the federal court, as part of a **[xxx]** effort to keep its Vermont Yankee nuclear power plant running. It’s a **[xxx]** move.\n> \n> 开始精读：\n> \n> Instead, the company has done precisely what it had long promised it would not: / challenge the **[xxx]** of Vermont’s rules in the federal court, / as part of a **[xxx]** effort to keep its Vermont Yankee nuclear power plant running. / It’s a **[xxx]** move.\n> \n> 相反，公司恰好做了长期承诺不会做的事：/ 在联邦法院挑战Vermont规则的**[xxx]**，/ 作为**[xxx]**维持Vermont Yankee核电站运行的努力之一。/ 这是一个**[xxx]**的举动。\n\n公司以前承诺不挑战规则，现在恰好去挑战。未知短语需要表达的是实际行动与承诺相背。\n\n接下来按A—D逐项看。","articleRects":[[274,312,1122,38],[202,358,1194,38],[203,404,1193,39],[202,450,895,37],[274,496,1122,37],[202,542,1194,37],[202,588,1194,37],[202,634,252,37]],"questionRects":[[226,188,1179,40],[281,253,222,38],[280,317,208,38],[280,380,215,38],[280,444,169,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0,1],"qid":"26","initialReadingPids":[0,1]},"html":"<h2>26题</h2>\n<blockquote><p>The phrase “reneging on” (Line 3, Para. 1) is closest in meaning to ______.<br />\n第一段reneging on最接近哪个意思？</p>\n</blockquote>\n<p>被考短语后面是commitment；下一段Instead把公司实际做的事说清了。</p>\n<blockquote><p>原文参考：</p>\n<p>A deal is a deal—except, apparently, when Entergy is involved. The company, a major energy supplier in New England, provoked justified <strong>[xxx]</strong> in Vermont last week when it announced it was reneging on a <strong>[xxx]</strong> commitment to abide by the state’s strict nuclear regulations.</p>\n<p>开始精读：</p>\n<p>A deal is a deal—except, apparently, when Entergy is involved. / The company, a major energy supplier in New England, provoked justified <strong>[xxx]</strong> in Vermont last week / when it announced it was reneging on a <strong>[xxx]</strong> commitment to abide by the state’s strict nuclear regulations.</p>\n<p>协议就是协议——显然，除非涉及Entergy。/ 这家新英格兰的大型能源供应商，上周在Vermont引发了有道理的<strong>[xxx]</strong>，/ 因为它宣布正在违背一项<strong>[xxx]</strong>承诺：遵守该州严格的核能规定。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Instead, the company has done precisely what it had long promised it would not: challenge the <strong>[xxx]</strong> of Vermont’s rules in the federal court, as part of a <strong>[xxx]</strong> effort to keep its Vermont Yankee nuclear power plant running. It’s a <strong>[xxx]</strong> move.</p>\n<p>开始精读：</p>\n<p>Instead, the company has done precisely what it had long promised it would not: / challenge the <strong>[xxx]</strong> of Vermont’s rules in the federal court, / as part of a <strong>[xxx]</strong> effort to keep its Vermont Yankee nuclear power plant running. / It’s a <strong>[xxx]</strong> move.</p>\n<p>相反，公司恰好做了长期承诺不会做的事：/ 在联邦法院挑战Vermont规则的<strong>[xxx]</strong>，/ 作为<strong>[xxx]</strong>维持Vermont Yankee核电站运行的努力之一。/ 这是一个<strong>[xxx]</strong>的举动。</p>\n</blockquote>\n<p>公司以前承诺不挑战规则，现在恰好去挑战。未知短语需要表达的是实际行动与承诺相背。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"26题","raw":"### A. condemning\n\n> reneging on表示谴责。\n\n把A接回题干，它说的是：reneging on表示谴责。\n\nA的`condemning`是谴责，放回去就要接后面的`commitment`。先看承诺了什么，再看第二段怎样解释公司现在做的事。\n\n> The company, a major energy supplier in New England, provoked justified **[xxx]** in Vermont last week when it announced it was reneging on a **[xxx]** commitment to abide by the state’s strict nuclear regulations.\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the **[xxx]** of Vermont’s rules in the federal court, as part of a **[xxx]** effort to keep its Vermont Yankee nuclear power plant running.\n\n第一段说，承诺的内容是遵守州的核规定。第二段接着说，公司恰恰做了长期保证不会做的事：到联邦法院挑战Vermont的规定。\n\n因此，这里前后摆着的是“原来答应怎样做”和“后来实际怎样做”。`condemning`只能说公司谴责了某件事，没有说它的行动违背了承诺。\n\n把A放回去，变成公司谴责自己的承诺，后面那句“答应不做却去做了”仍然解释不上。\n\n**后一句在解释公司批评了承诺，还是解释公司做了违反承诺的事？**\n\n是违反承诺的行动。A的谴责没有表达这层意思。\n\n**第一轮判断：A排除。**","articleRects":[[274,312,1122,38],[202,358,1194,38],[203,404,1193,39],[202,450,895,37],[274,496,1122,37],[202,542,1194,37],[202,588,1194,37],[202,634,252,37]],"questionRects":[[281,253,222,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"26","paragraphPids":[0,1]},"html":"<h3>A. condemning</h3>\n<blockquote><p>reneging on表示谴责。</p>\n</blockquote>\n<p>把A接回题干，它说的是：reneging on表示谴责。</p>\n<p>A的<code>condemning</code>是谴责，放回去就要接后面的<code>commitment</code>。先看承诺了什么，再看第二段怎样解释公司现在做的事。</p>\n<blockquote><p>The company, a major energy supplier in New England, provoked justified <strong>[xxx]</strong> in Vermont last week when it announced it was reneging on a <strong>[xxx]</strong> commitment to abide by the state’s strict nuclear regulations.</p>\n</blockquote>\n<blockquote><p>Instead, the company has done precisely what it had long promised it would not: challenge the <strong>[xxx]</strong> of Vermont’s rules in the federal court, as part of a <strong>[xxx]</strong> effort to keep its Vermont Yankee nuclear power plant running.</p>\n</blockquote>\n<p>第一段说，承诺的内容是遵守州的核规定。第二段接着说，公司恰恰做了长期保证不会做的事：到联邦法院挑战Vermont的规定。</p>\n<p>因此，这里前后摆着的是“原来答应怎样做”和“后来实际怎样做”。<code>condemning</code>只能说公司谴责了某件事，没有说它的行动违背了承诺。</p>\n<p>把A放回去，变成公司谴责自己的承诺，后面那句“答应不做却去做了”仍然解释不上。</p>\n<p><strong>后一句在解释公司批评了承诺，还是解释公司做了违反承诺的事？</strong></p>\n<p>是违反承诺的行动。A的谴责没有表达这层意思。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"26题","raw":"### B. reaffirming\n\n> reneging on表示重申。\n\n把B接回题干，它说的是：reneging on表示重申。\n\nB的`reaffirming`是重新确认，接上`commitment`就是再次确认承诺。第二段的`Instead`后面，正好写出了公司这次怎样对待此前的承诺。\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the **[xxx]** of Vermont’s rules in the federal court, as part of a **[xxx]** effort to keep its Vermont Yankee nuclear power plant running.\n\n`had long promised it would not`表示以前一直保证不会做，`has done precisely what ...`却说现在恰好做了。\n\n如果是重新确认原来的承诺，接下来应该仍按承诺行事；这里的新行动反而和原先保证的相反。即使`challenge`后面的词没读懂，这个前后反差也已经读得出来。\n\n**以前保证不做，现在恰好做了，能叫重新确认原来的承诺吗？**\n\n不能。这是在违背原来的承诺，和`reaffirming`的意思相反。\n\n**第一轮判断：B排除。**","articleRects":[[274,496,1122,37],[202,542,1194,37],[202,588,1194,37],[202,634,252,37]],"questionRects":[[280,317,208,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"26","paragraphPids":[1]},"html":"<h3>B. reaffirming</h3>\n<blockquote><p>reneging on表示重申。</p>\n</blockquote>\n<p>把B接回题干，它说的是：reneging on表示重申。</p>\n<p>B的<code>reaffirming</code>是重新确认，接上<code>commitment</code>就是再次确认承诺。第二段的<code>Instead</code>后面，正好写出了公司这次怎样对待此前的承诺。</p>\n<blockquote><p>Instead, the company has done precisely what it had long promised it would not: challenge the <strong>[xxx]</strong> of Vermont’s rules in the federal court, as part of a <strong>[xxx]</strong> effort to keep its Vermont Yankee nuclear power plant running.</p>\n</blockquote>\n<p><code>had long promised it would not</code>表示以前一直保证不会做，<code>has done precisely what ...</code>却说现在恰好做了。</p>\n<p>如果是重新确认原来的承诺，接下来应该仍按承诺行事；这里的新行动反而和原先保证的相反。即使<code>challenge</code>后面的词没读懂，这个前后反差也已经读得出来。</p>\n<p><strong>以前保证不做，现在恰好做了，能叫重新确认原来的承诺吗？</strong></p>\n<p>不能。这是在违背原来的承诺，和<code>reaffirming</code>的意思相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"26题","raw":"### C. dishonoring\n\n> reneging on表示不履行。\n\n把C接回题干，它说的是：reneging on表示不履行。\n\nC的`dishonoring`接承诺，表示没有遵守。我们拿第二段的`has done`和`had long promised it would not`对照，看看是否正是有承诺却没照做。\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the **[xxx]** of Vermont’s rules in the federal court, as part of a **[xxx]** effort to keep its Vermont Yankee nuclear power plant running.\n\n公司以前已经作了承诺，第一段写`commitment`，第二段又写`had long promised`，这点没有疑问。\n\n现在做的事又恰好是它承诺不会做的事。因此，问题不是没作过承诺，而是作过承诺后没有遵守。\n\n`dishonoring`接上这项承诺，正好说出后来没有履行的意思。开头“协议就是协议，除非牵涉Entergy”也在暗示，这家公司成了不按协议行事的例外。\n\n**有一项原先作出的承诺，后来却做了它明说不会做的事，这能接上`dishonoring`吗？**\n\n能。它说的就是没有遵守这项承诺，C保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,496,1122,37],[202,542,1194,37],[202,588,1194,37],[202,634,252,37]],"questionRects":[[280,380,215,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"26","paragraphPids":[1]},"html":"<h3>C. dishonoring</h3>\n<blockquote><p>reneging on表示不履行。</p>\n</blockquote>\n<p>把C接回题干，它说的是：reneging on表示不履行。</p>\n<p>C的<code>dishonoring</code>接承诺，表示没有遵守。我们拿第二段的<code>has done</code>和<code>had long promised it would not</code>对照，看看是否正是有承诺却没照做。</p>\n<blockquote><p>Instead, the company has done precisely what it had long promised it would not: challenge the <strong>[xxx]</strong> of Vermont’s rules in the federal court, as part of a <strong>[xxx]</strong> effort to keep its Vermont Yankee nuclear power plant running.</p>\n</blockquote>\n<p>公司以前已经作了承诺，第一段写<code>commitment</code>，第二段又写<code>had long promised</code>，这点没有疑问。</p>\n<p>现在做的事又恰好是它承诺不会做的事。因此，问题不是没作过承诺，而是作过承诺后没有遵守。</p>\n<p><code>dishonoring</code>接上这项承诺，正好说出后来没有履行的意思。开头“协议就是协议，除非牵涉Entergy”也在暗示，这家公司成了不按协议行事的例外。</p>\n<p><strong>有一项原先作出的承诺，后来却做了它明说不会做的事，这能接上<code>dishonoring</code>吗？</strong></p>\n<p>能。它说的就是没有遵守这项承诺，C保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"26题","raw":"### D. securing\n\n> reneging on表示保障。\n\n把D接回题干，它说的是：reneging on表示保障。\n\nD的`securing`可以表示取得或确保。第一段后面是承诺，第二段又说`had long promised`，我们看现在是在取得承诺，还是在处理已经作过的承诺。\n\n> The company, a major energy supplier in New England, provoked justified **[xxx]** in Vermont last week when it announced it was reneging on a **[xxx]** commitment to abide by the state’s strict nuclear regulations.\n\n> Instead, the company has done precisely what it had long promised it would not: challenge the **[xxx]** of Vermont’s rules in the federal court, as part of a **[xxx]** effort to keep its Vermont Yankee nuclear power plant running.\n\n`had long promised`把承诺放在以前，公司现在才作出与承诺相反的行动。所以，这不是现在刚取得一项承诺。\n\n若把`securing`读成确保承诺落实，也仍然对不上：原先说不做的事，现在偏偏做了，并没有让承诺得到落实。\n\n原文需要表达既有承诺没有被遵守，D的取得或确保都没有把这个变化说出来。\n\n**以前已经答应不做，现在却做了，是在取得或确保承诺吗？**\n\n不是。承诺已经存在，现在发生的是违背承诺。\n\n**第一轮判断：D排除。**","articleRects":[[274,312,1122,38],[202,358,1194,38],[203,404,1193,39],[202,450,895,37],[274,496,1122,37],[202,542,1194,37],[202,588,1194,37],[202,634,252,37]],"questionRects":[[280,444,169,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"26","paragraphPids":[0,1]},"html":"<h3>D. securing</h3>\n<blockquote><p>reneging on表示保障。</p>\n</blockquote>\n<p>把D接回题干，它说的是：reneging on表示保障。</p>\n<p>D的<code>securing</code>可以表示取得或确保。第一段后面是承诺，第二段又说<code>had long promised</code>，我们看现在是在取得承诺，还是在处理已经作过的承诺。</p>\n<blockquote><p>The company, a major energy supplier in New England, provoked justified <strong>[xxx]</strong> in Vermont last week when it announced it was reneging on a <strong>[xxx]</strong> commitment to abide by the state’s strict nuclear regulations.</p>\n</blockquote>\n<blockquote><p>Instead, the company has done precisely what it had long promised it would not: challenge the <strong>[xxx]</strong> of Vermont’s rules in the federal court, as part of a <strong>[xxx]</strong> effort to keep its Vermont Yankee nuclear power plant running.</p>\n</blockquote>\n<p><code>had long promised</code>把承诺放在以前，公司现在才作出与承诺相反的行动。所以，这不是现在刚取得一项承诺。</p>\n<p>若把<code>securing</code>读成确保承诺落实，也仍然对不上：原先说不做的事，现在偏偏做了，并没有让承诺得到落实。</p>\n<p>原文需要表达既有承诺没有被遵守，D的取得或确保都没有把这个变化说出来。</p>\n<p><strong>以前已经答应不做，现在却做了，是在取得或确保承诺吗？</strong></p>\n<p>不是。承诺已经存在，现在发生的是违背承诺。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"26题","raw":"### 26题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n保留C。第二段明确写公司做了以前保证不做的事，解释的是没有遵守承诺；另外三项改变了这个动作。","articleRects":[],"questionRects":[[226,188,1179,40],[281,253,222,38],[280,317,208,38],[280,380,215,38],[280,444,169,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"26"},"html":"<h3>26题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>保留C。第二段明确写公司做了以前保证不做的事，解释的是没有遵守承诺；另外三项改变了这个动作。</p>\n"},{"section":"27题","raw":"## 27题\n\n> By entering into the 2002 agreement, Entergy intended to ______.  \n> Entergy签订2002年协议时，是为了什么？\n\n2002直接指向第三段；条件句As a condition of receiving state approval for the sale说明当时的目的。\n\n> 原文参考：\n> \n> The conflict has been **[xxx]** since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012. In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont **[xxx]** approval. Then, too, the company went along.\n> \n> 开始精读：\n> \n> The conflict has been **[xxx]** since 2002, / when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. / As a condition of receiving state approval for the sale, / the company agreed to seek permission from state regulators to operate past 2012. / In 2006, the state went a step further, / requiring that any extension of the plant’s license be subject to the Vermont **[xxx]** approval. / Then, too, the company went along.\n> \n> 冲突从2002年开始**[xxx]**，/ 当时公司买下Vermont唯一的核电站，即Vernon一座老化的反应堆。/ 作为获得州政府批准这笔交易的条件，/ 公司同意在2012年后继续运营时，向州监管者申请许可。/ 2006年州进一步规定，/ 电站执照的任何延期都须得到州**[xxx]**批准。/ 当时公司也同意了。\n\n购厂获批是当时要取得的东西，2012年后的运营许可是公司为此接受的后续条件。\n\n接下来按A—D逐项看。","articleRects":[[273,679,1123,38],[202,725,1193,38],[202,771,1193,38],[202,817,1189,38],[202,863,1194,38],[202,909,885,38]],"questionRects":[[226,570,1025,38],[280,634,665,38],[280,697,604,38],[280,761,675,38],[280,824,650,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"27","initialReadingPids":[2]},"html":"<h2>27题</h2>\n<blockquote><p>By entering into the 2002 agreement, Entergy intended to ______.<br />\nEntergy签订2002年协议时，是为了什么？</p>\n</blockquote>\n<p>2002直接指向第三段；条件句As a condition of receiving state approval for the sale说明当时的目的。</p>\n<blockquote><p>原文参考：</p>\n<p>The conflict has been <strong>[xxx]</strong> since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012. In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont <strong>[xxx]</strong> approval. Then, too, the company went along.</p>\n<p>开始精读：</p>\n<p>The conflict has been <strong>[xxx]</strong> since 2002, / when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon. / As a condition of receiving state approval for the sale, / the company agreed to seek permission from state regulators to operate past 2012. / In 2006, the state went a step further, / requiring that any extension of the plant’s license be subject to the Vermont <strong>[xxx]</strong> approval. / Then, too, the company went along.</p>\n<p>冲突从2002年开始<strong>[xxx]</strong>，/ 当时公司买下Vermont唯一的核电站，即Vernon一座老化的反应堆。/ 作为获得州政府批准这笔交易的条件，/ 公司同意在2012年后继续运营时，向州监管者申请许可。/ 2006年州进一步规定，/ 电站执照的任何延期都须得到州<strong>[xxx]</strong>批准。/ 当时公司也同意了。</p>\n</blockquote>\n<p>购厂获批是当时要取得的东西，2012年后的运营许可是公司为此接受的后续条件。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"27题","raw":"### A. obtain protection from Vermont regulators\n\n> 它想获得Vermont监管者的保护。\n\n把A接回题干，它说的是：它想获得Vermont监管者的保护。\n\nA的`Vermont regulators`和第三段的`state regulators`可以接上，但A想得到的是`protection`。我们读清`receiving state approval for the sale`与后面`agreed to`各说哪件事。\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n\n公司想取得州对购厂交易的批准，为此同意，若要在2012年以后继续运营，就向州监管者申请许可。\n\n州在这里批准的是买卖，监管者以后还要决定是否允许继续运营。原句没有说州向公司提供保护，也没有说签了协议就由监管者保护公司。\n\nA把要取得的交易批准换成了保护，这件事不是原句给出的签约目的。\n\n**公司要得到的`approval for the sale`，是购厂交易获批，还是监管者保护它？**\n\n是购厂交易获批。A的保护没有接上。\n\n**第一轮判断：A排除。**","articleRects":[[273,679,1123,38],[202,725,1193,38],[202,771,1193,38],[202,817,1189,38],[202,863,1194,38],[202,909,885,38]],"questionRects":[[280,634,665,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"27","paragraphPids":[2]},"html":"<h3>A. obtain protection from Vermont regulators</h3>\n<blockquote><p>它想获得Vermont监管者的保护。</p>\n</blockquote>\n<p>把A接回题干，它说的是：它想获得Vermont监管者的保护。</p>\n<p>A的<code>Vermont regulators</code>和第三段的<code>state regulators</code>可以接上，但A想得到的是<code>protection</code>。我们读清<code>receiving state approval for the sale</code>与后面<code>agreed to</code>各说哪件事。</p>\n<blockquote><p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<p>公司想取得州对购厂交易的批准，为此同意，若要在2012年以后继续运营，就向州监管者申请许可。</p>\n<p>州在这里批准的是买卖，监管者以后还要决定是否允许继续运营。原句没有说州向公司提供保护，也没有说签了协议就由监管者保护公司。</p>\n<p>A把要取得的交易批准换成了保护，这件事不是原句给出的签约目的。</p>\n<p><strong>公司要得到的<code>approval for the sale</code>，是购厂交易获批，还是监管者保护它？</strong></p>\n<p>是购厂交易获批。A的保护没有接上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"27题","raw":"### B. seek favor from the federal legislature\n\n> 它想争取联邦立法机关的好感。\n\n把B接回题干，它说的是：它想争取联邦立法机关的好感。\n\nB提到`federal legislature`，即联邦立法机关。题干问2002年的协议，我们先回看当年要求的`state approval`，再看下一句2006年增加的要求。\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont **[xxx]** approval.\n\n2002年这句说的都是州：州批准买厂，公司答应日后继续经营还向州监管者申请许可。\n\n2006年那句又写`the state went a step further`，仍是州进一步提出要求。两句都没有把联邦立法机关写成公司争取的对象。\n\n而且，公司要的是对具体买卖的批准，B说的`seek favor`却成了争取好感。谁来批准、要批准什么，都被换了。\n\n**签协议是为了得到州对买厂交易的批准，能写成向联邦立法机关争取好感吗？**\n\n不能。州与联邦不是同一个机构，交易批准也不是争取好感。\n\n**第一轮判断：B排除。**","articleRects":[[273,679,1123,38],[202,725,1193,38],[202,771,1193,38],[202,817,1189,38],[202,863,1194,38],[202,909,885,38]],"questionRects":[[280,697,604,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"27","paragraphPids":[2]},"html":"<h3>B. seek favor from the federal legislature</h3>\n<blockquote><p>它想争取联邦立法机关的好感。</p>\n</blockquote>\n<p>把B接回题干，它说的是：它想争取联邦立法机关的好感。</p>\n<p>B提到<code>federal legislature</code>，即联邦立法机关。题干问2002年的协议，我们先回看当年要求的<code>state approval</code>，再看下一句2006年增加的要求。</p>\n<blockquote><p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<blockquote><p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont <strong>[xxx]</strong> approval.</p>\n</blockquote>\n<p>2002年这句说的都是州：州批准买厂，公司答应日后继续经营还向州监管者申请许可。</p>\n<p>2006年那句又写<code>the state went a step further</code>，仍是州进一步提出要求。两句都没有把联邦立法机关写成公司争取的对象。</p>\n<p>而且，公司要的是对具体买卖的批准，B说的<code>seek favor</code>却成了争取好感。谁来批准、要批准什么，都被换了。</p>\n<p><strong>签协议是为了得到州对买厂交易的批准，能写成向联邦立法机关争取好感吗？</strong></p>\n<p>不能。州与联邦不是同一个机构，交易批准也不是争取好感。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"27题","raw":"### C. acquire an extension of its business license\n\n> 它想延长营业执照。\n\n把C接回题干，它说的是：它想延长营业执照。\n\nC里的`extension`确实出现在第三段后面，继续运营到2012年以后也与延期有关。但题干问这次签协议为什么，先看`As a condition of receiving ...`后面给出的交换条件。\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n\n> In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont **[xxx]** approval.\n\n公司答应的是，日后如果要继续运营，必须去申请许可。原句用的是`seek permission`，也就是还要申请，并没有说这份协议已经批准延期。\n\n它为什么接受这个条件？前面的`receiving state approval for the sale`说，为了让现在的购厂交易得到批准。\n\n因此，继续经营时要申请许可，是公司承担的条件；买厂交易获批，才是接受条件要取得的结果。C把前一件事当成了后一件事。\n\n**承诺日后申请延期，是否表示签这份协议就取得了延期许可？**\n\n不是。签约换来的是购厂批准，延期在日后仍要另行申请。\n\n**第一轮判断：C排除。**","articleRects":[[273,679,1123,38],[202,725,1193,38],[202,771,1193,38],[202,817,1189,38],[202,863,1194,38],[202,909,885,38]],"questionRects":[[280,761,675,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"27","paragraphPids":[2]},"html":"<h3>C. acquire an extension of its business license</h3>\n<blockquote><p>它想延长营业执照。</p>\n</blockquote>\n<p>把C接回题干，它说的是：它想延长营业执照。</p>\n<p>C里的<code>extension</code>确实出现在第三段后面，继续运营到2012年以后也与延期有关。但题干问这次签协议为什么，先看<code>As a condition of receiving ...</code>后面给出的交换条件。</p>\n<blockquote><p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<blockquote><p>In 2006, the state went a step further, requiring that any extension of the plant’s license be subject to the Vermont <strong>[xxx]</strong> approval.</p>\n</blockquote>\n<p>公司答应的是，日后如果要继续运营，必须去申请许可。原句用的是<code>seek permission</code>，也就是还要申请，并没有说这份协议已经批准延期。</p>\n<p>它为什么接受这个条件？前面的<code>receiving state approval for the sale</code>说，为了让现在的购厂交易得到批准。</p>\n<p>因此，继续经营时要申请许可，是公司承担的条件；买厂交易获批，才是接受条件要取得的结果。C把前一件事当成了后一件事。</p>\n<p><strong>承诺日后申请延期，是否表示签这份协议就取得了延期许可？</strong></p>\n<p>不是。签约换来的是购厂批准，延期在日后仍要另行申请。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"27题","raw":"### D. get permission to purchase a power plant\n\n> 它想获准购买一座电站。\n\n把D接回题干，它说的是：它想获准购买一座电站。\n\nD的`purchase a power plant`可以接上前一句公司`bought ... nuclear power plant`，`get permission`又能接上`receiving state approval for the sale`。把这两句连起来看。\n\n> The conflict has been **[xxx]** since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon.\n\n> As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.\n\n第一句交代2002年公司买下这座核电站，第二句就说明它怎样取得州对这笔交易的批准。\n\n`As a condition of receiving ...`表示，要得到买卖获批，公司得先同意一个条件：将来2012年以后继续运营要向州申请。\n\n这笔交易从卖的一边叫`sale`，从Entergy这一买方看就是`purchase`。D说获准买电站，正好接上本次签约要取得的结果。\n\n**同一笔购厂交易，原文说批准这笔`sale`，从Entergy这边能否说获准`purchase`？**\n\n能。都是公司买这座电站的交易得到批准，D保留。\n\n**第一轮判断：D保留。**","articleRects":[[273,679,1123,38],[202,725,1193,38],[202,771,1193,38],[202,817,1189,38],[202,863,1194,38],[202,909,885,38]],"questionRects":[[280,824,650,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"27","paragraphPids":[2]},"html":"<h3>D. get permission to purchase a power plant</h3>\n<blockquote><p>它想获准购买一座电站。</p>\n</blockquote>\n<p>把D接回题干，它说的是：它想获准购买一座电站。</p>\n<p>D的<code>purchase a power plant</code>可以接上前一句公司<code>bought ... nuclear power plant</code>，<code>get permission</code>又能接上<code>receiving state approval for the sale</code>。把这两句连起来看。</p>\n<blockquote><p>The conflict has been <strong>[xxx]</strong> since 2002, when the corporation bought Vermont’s only nuclear power plant, an aging reactor in Vernon.</p>\n</blockquote>\n<blockquote><p>As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to operate past 2012.</p>\n</blockquote>\n<p>第一句交代2002年公司买下这座核电站，第二句就说明它怎样取得州对这笔交易的批准。</p>\n<p><code>As a condition of receiving ...</code>表示，要得到买卖获批，公司得先同意一个条件：将来2012年以后继续运营要向州申请。</p>\n<p>这笔交易从卖的一边叫<code>sale</code>，从Entergy这一买方看就是<code>purchase</code>。D说获准买电站，正好接上本次签约要取得的结果。</p>\n<p><strong>同一笔购厂交易，原文说批准这笔<code>sale</code>，从Entergy这边能否说获准<code>purchase</code>？</strong></p>\n<p>能。都是公司买这座电站的交易得到批准，D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n保留D。As a condition of把公司承担的后续监管承诺与当前购厂获批区分开；D保留了approval for the sale这个目的。","articleRects":[],"questionRects":[[226,570,1025,38],[280,634,665,38],[280,697,604,38],[280,761,675,38],[280,824,650,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"27"},"html":"<h3>27题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>保留D。As a condition of把公司承担的后续监管承诺与当前购厂获批区分开；D保留了approval for the sale这个目的。</p>\n"},{"section":"28题","raw":"## 28题\n\n> According to Paragraph 4, Entergy seems to have problems with its ______.  \n> 第四段显示，Entergy似乎在哪方面有问题？\n\n题干限定第四段，重点看事故之后raised serious questions的两个对象。\n\n> 原文参考：\n> \n> Either Entergy never really intended to live by those commitments, or it simply didn’t **[xxx]** what would happen next. A string of accidents, including the partial **[xxx]** of a cooling tower in 2007 and the discovery of an **[xxx]** pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe. **[xxx]** by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.\n> \n> 开始精读：\n> \n> Either Entergy never really intended to live by those commitments, / or it simply didn’t **[xxx]** what would happen next. / A string of accidents, including the partial **[xxx]** of a cooling tower in 2007 and the discovery of an **[xxx]** pipe system leakage, / raised serious questions about both Vermont Yankee’s safety and Entergy’s management— / especially after the company made misleading statements about the pipe. / **[xxx]** by Entergy’s behavior, / the Vermont Senate voted 26 to 4 last year against allowing an extension.\n> \n> 要么Entergy从未真想履行承诺，/ 要么它没有**[xxx]**接下来会发生什么。/ 一连串事故，包括2007年冷却塔部分**[xxx]**和**[xxx]**管道系统泄漏的发现，/ 使电站安全和公司管理都受到严重质疑——/ 尤其在公司就管道作了误导性说明之后。/ 被公司行为**[xxx]**，/ 州参议院去年以26比4投票反对延期。\n\n题干用seems询问第四段表现出的问题。本段明确点出安全与管理，也保留了对公司为何作出承诺的两种解释；进入选项时把这两部分分别核对。\n\n接下来按A—D逐项看。","articleRects":[[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38]],"questionRects":[[226,951,1055,38],[281,1014,343,38],[280,1078,397,30],[280,1141,258,38],[280,1205,267,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"28","initialReadingPids":[3]},"html":"<h2>28题</h2>\n<blockquote><p>According to Paragraph 4, Entergy seems to have problems with its ______.<br />\n第四段显示，Entergy似乎在哪方面有问题？</p>\n</blockquote>\n<p>题干限定第四段，重点看事故之后raised serious questions的两个对象。</p>\n<blockquote><p>原文参考：</p>\n<p>Either Entergy never really intended to live by those commitments, or it simply didn’t <strong>[xxx]</strong> what would happen next. A string of accidents, including the partial <strong>[xxx]</strong> of a cooling tower in 2007 and the discovery of an <strong>[xxx]</strong> pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe. <strong>[xxx]</strong> by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n<p>开始精读：</p>\n<p>Either Entergy never really intended to live by those commitments, / or it simply didn’t <strong>[xxx]</strong> what would happen next. / A string of accidents, including the partial <strong>[xxx]</strong> of a cooling tower in 2007 and the discovery of an <strong>[xxx]</strong> pipe system leakage, / raised serious questions about both Vermont Yankee’s safety and Entergy’s management— / especially after the company made misleading statements about the pipe. / <strong>[xxx]</strong> by Entergy’s behavior, / the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n<p>要么Entergy从未真想履行承诺，/ 要么它没有<strong>[xxx]</strong>接下来会发生什么。/ 一连串事故，包括2007年冷却塔部分<strong>[xxx]</strong>和<strong>[xxx]</strong>管道系统泄漏的发现，/ 使电站安全和公司管理都受到严重质疑——/ 尤其在公司就管道作了误导性说明之后。/ 被公司行为<strong>[xxx]</strong>，/ 州参议院去年以26比4投票反对延期。</p>\n</blockquote>\n<p>题干用seems询问第四段表现出的问题。本段明确点出安全与管理，也保留了对公司为何作出承诺的两种解释；进入选项时把这两部分分别核对。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"28题","raw":"### A. managerial practices\n\n> Entergy的管理做法有问题。\n\n把A接回题干，它说的是：Entergy的管理做法有问题。\n\nA的`managerial`来自管理，第四段已经直接写了`Entergy’s management`。后面还用`especially after`补充公司对管道作出的陈述，我们把这两处一起看。\n\n> A string of accidents, including the partial **[xxx]** of a cooling tower in 2007 and the discovery of an **[xxx]** pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.\n\n一连串事故引起的质疑，被原文明确写成两部分：电站的安全，以及Entergy的管理。A说管理做法有问题，已经能接上第二部分。\n\n`especially after`又说明，公司对管道作了误导性陈述后，这种质疑更严重。公司怎样处理并说明管道的情况，也是实际作出的管理行为。\n\n所以，A并不只靠我们看到事故后猜测管理不好；原句已经点出管理，还写了加重疑问的具体做法。\n\n**原文既点名`management`，又写公司作误导性陈述，能否支持A的管理做法有问题？**\n\n能。管理被明确质疑，陈述管道情况的做法又让这个疑问加重，A保留。\n\n**第一轮判断：A保留。**","articleRects":[[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38]],"questionRects":[[281,1014,343,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"28","paragraphPids":[3]},"html":"<h3>A. managerial practices</h3>\n<blockquote><p>Entergy的管理做法有问题。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Entergy的管理做法有问题。</p>\n<p>A的<code>managerial</code>来自管理，第四段已经直接写了<code>Entergy’s management</code>。后面还用<code>especially after</code>补充公司对管道作出的陈述，我们把这两处一起看。</p>\n<blockquote><p>A string of accidents, including the partial <strong>[xxx]</strong> of a cooling tower in 2007 and the discovery of an <strong>[xxx]</strong> pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.</p>\n</blockquote>\n<p>一连串事故引起的质疑，被原文明确写成两部分：电站的安全，以及Entergy的管理。A说管理做法有问题，已经能接上第二部分。</p>\n<p><code>especially after</code>又说明，公司对管道作了误导性陈述后，这种质疑更严重。公司怎样处理并说明管道的情况，也是实际作出的管理行为。</p>\n<p>所以，A并不只靠我们看到事故后猜测管理不好；原句已经点出管理，还写了加重疑问的具体做法。</p>\n<p><strong>原文既点名<code>management</code>，又写公司作误导性陈述，能否支持A的管理做法有问题？</strong></p>\n<p>能。管理被明确质疑，陈述管道情况的做法又让这个疑问加重，A保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"28题","raw":"### B. technical innovativeness\n\n> Entergy的技术创新能力有问题。\n\n把B接回题干，它说的是：Entergy的技术创新能力有问题。\n\nB的`technical innovativeness`问能否创造新技术。第四段虽提冷却塔和管道，我们还得看这些设施后面接的是什么问题。\n\n> A string of accidents, including the partial **[xxx]** of a cooling tower in 2007 and the discovery of an **[xxx]** pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.\n\n冷却塔和管道是在`a string of accidents`下面举出的事故例子。原文接着说，这些事故引起对电站安全和公司管理的疑问。\n\n它没有介绍公司研发了哪些新技术，也没有比较技术是否足够新。后面加上的误导性陈述，更是在看公司有没有如实说明管道情况。\n\n因此，技术设施出问题，在这里支持的是运行、管理受到质疑，不能单靠设施名称就变成创新能力不足。\n\n**列出设备事故并批评公司对管道的说明，就等于评价它创造新技术的能力吗？**\n\n不等于。原文在问安全和管理出了什么问题，没有评价研发创新。\n\n**第一轮判断：B排除。**","articleRects":[[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38]],"questionRects":[[280,1078,397,30]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>B. technical innovativeness</h3>\n<blockquote><p>Entergy的技术创新能力有问题。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Entergy的技术创新能力有问题。</p>\n<p>B的<code>technical innovativeness</code>问能否创造新技术。第四段虽提冷却塔和管道，我们还得看这些设施后面接的是什么问题。</p>\n<blockquote><p>A string of accidents, including the partial <strong>[xxx]</strong> of a cooling tower in 2007 and the discovery of an <strong>[xxx]</strong> pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.</p>\n</blockquote>\n<p>冷却塔和管道是在<code>a string of accidents</code>下面举出的事故例子。原文接着说，这些事故引起对电站安全和公司管理的疑问。</p>\n<p>它没有介绍公司研发了哪些新技术，也没有比较技术是否足够新。后面加上的误导性陈述，更是在看公司有没有如实说明管道情况。</p>\n<p>因此，技术设施出问题，在这里支持的是运行、管理受到质疑，不能单靠设施名称就变成创新能力不足。</p>\n<p><strong>列出设备事故并批评公司对管道的说明，就等于评价它创造新技术的能力吗？</strong></p>\n<p>不等于。原文在问安全和管理出了什么问题，没有评价研发创新。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"28题","raw":"### C. financial goals\n\n> Entergy的财务目标有问题。\n\n把C接回题干，它说的是：Entergy的财务目标有问题。\n\nC说`financial goals`，是财务方面的目标。我们回到事故后面的`questions about`，看作者明确接上的是哪两件事。\n\n> A string of accidents, including the partial **[xxx]** of a cooling tower in 2007 and the discovery of an **[xxx]** pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.\n\n> **[xxx]** by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.\n\n`questions about both Vermont Yankee’s safety and Entergy’s management`，已经把疑问写成安全和管理。后面公司的误导性陈述，又进一步加重管理方面的问题。\n\nC要谈财务目标，至少得读到公司怎样设置收入、成本等目标，并且这些目标出了问题。本段没有给出这种联系。\n\n我们不能因为公司经营可能和钱有关，就把这一段写清的事故、管理和不实说明，都改成对财务目标的评价。\n\n**事故后面明确接着的是安全、管理，还是公司的财务目标？**\n\n是安全和管理。C把被质疑的事情换成了财务目标。\n\n**第一轮判断：C排除。**","articleRects":[[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38]],"questionRects":[[280,1141,258,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>C. financial goals</h3>\n<blockquote><p>Entergy的财务目标有问题。</p>\n</blockquote>\n<p>把C接回题干，它说的是：Entergy的财务目标有问题。</p>\n<p>C说<code>financial goals</code>，是财务方面的目标。我们回到事故后面的<code>questions about</code>，看作者明确接上的是哪两件事。</p>\n<blockquote><p>A string of accidents, including the partial <strong>[xxx]</strong> of a cooling tower in 2007 and the discovery of an <strong>[xxx]</strong> pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.</p>\n</blockquote>\n<blockquote><p><strong>[xxx]</strong> by Entergy’s behavior, the Vermont Senate voted 26 to 4 last year against allowing an extension.</p>\n</blockquote>\n<p><code>questions about both Vermont Yankee’s safety and Entergy’s management</code>，已经把疑问写成安全和管理。后面公司的误导性陈述，又进一步加重管理方面的问题。</p>\n<p>C要谈财务目标，至少得读到公司怎样设置收入、成本等目标，并且这些目标出了问题。本段没有给出这种联系。</p>\n<p>我们不能因为公司经营可能和钱有关，就把这一段写清的事故、管理和不实说明，都改成对财务目标的评价。</p>\n<p><strong>事故后面明确接着的是安全、管理，还是公司的财务目标？</strong></p>\n<p>是安全和管理。C把被质疑的事情换成了财务目标。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"28题","raw":"### D. business vision\n\n> Entergy的商业远见有问题。\n\n把D接回题干，它说的是：Entergy的商业远见有问题。\n\nD的`business vision`说商业远见，第四段开头恰有`what would happen next`，后来会发生什么。我们看`Either ... or ...`怎样把它和履行承诺放在一起。\n\n> Either Entergy never really intended to live by those commitments, or it simply didn’t **[xxx]** what would happen next.\n\n> A string of accidents, including the partial **[xxx]** of a cooling tower in 2007 and the discovery of an **[xxx]** pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.\n\n第一种解释是，公司从没真正打算遵守承诺。第二种是，它没有**[xxx]**后来会发生什么。\n\n第二种解释里的动作还读不清，但`what would happen next`确实与对未来情况的认识有关，所以D有一个能接上的地方。后面事故发生、延期被拒，也都是后来发生的事。\n\nA的管理有明确的`management`支持；D还不能确认，因为那句话中间有生词。先把两项都留下，看看后文继续追究公司的哪种做法。\n\n**开头提到公司对后来情况的认识，但中间动作还不清楚，现在能把D完全定下来吗？**\n\n不能完全确定。它和`what would happen next`有联系，先与A一起保留。\n\n**第一轮判断：D保留。**","articleRects":[[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38]],"questionRects":[[280,1205,267,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"28","paragraphPids":[3]},"html":"<h3>D. business vision</h3>\n<blockquote><p>Entergy的商业远见有问题。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Entergy的商业远见有问题。</p>\n<p>D的<code>business vision</code>说商业远见，第四段开头恰有<code>what would happen next</code>，后来会发生什么。我们看<code>Either ... or ...</code>怎样把它和履行承诺放在一起。</p>\n<blockquote><p>Either Entergy never really intended to live by those commitments, or it simply didn’t <strong>[xxx]</strong> what would happen next.</p>\n</blockquote>\n<blockquote><p>A string of accidents, including the partial <strong>[xxx]</strong> of a cooling tower in 2007 and the discovery of an <strong>[xxx]</strong> pipe system leakage, raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe.</p>\n</blockquote>\n<p>第一种解释是，公司从没真正打算遵守承诺。第二种是，它没有<strong>[xxx]</strong>后来会发生什么。</p>\n<p>第二种解释里的动作还读不清，但<code>what would happen next</code>确实与对未来情况的认识有关，所以D有一个能接上的地方。后面事故发生、延期被拒，也都是后来发生的事。</p>\n<p>A的管理有明确的<code>management</code>支持；D还不能确认，因为那句话中间有生词。先把两项都留下，看看后文继续追究公司的哪种做法。</p>\n<p><strong>开头提到公司对后来情况的认识，但中间动作还不清楚，现在能把D完全定下来吗？</strong></p>\n<p>不能完全确定。它和<code>what would happen next</code>有联系，先与A一起保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"28题","raw":"### 28题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n暂时保留：A、D。\n\n保留A、D。A对应management以及误导性陈述；D与开头what would happen next相接，但动作尚未读清。题干的seems又容许仍在讨论的可能问题，两项暂时没有完全拉开。","articleRects":[],"questionRects":[[226,951,1055,38],[281,1014,343,38],[280,1078,397,30],[280,1141,258,38],[280,1205,267,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"28"},"html":"<h3>28题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：A、D。</p>\n<p>保留A、D。A对应management以及误导性陈述；D与开头what would happen next相接，但动作尚未读清。题干的seems又容许仍在讨论的可能问题，两项暂时没有完全拉开。</p>\n"},{"section":"29题","raw":"## 29题\n\n> In the author’s view, the Vermont case will test ______.  \n> 作者认为，Vermont案件将检验什么？\n\nVermont case和test出现在第五段，how far those powers extend给出了检验对象。\n\n> 原文参考：\n> \n> Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are **[xxx]**: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a **[xxx]** test of how far those powers extend. Certainly, there are valid concerns about the **[xxx]** regulations that could result if every state sets its own rules. But had Entergy kept its word, that debate would be beside the point.\n> \n> 开始精读：\n> \n> Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, / and that only the federal government has regulatory power over nuclear issues. / The legal issues in the case are **[xxx]**: / whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, / legal scholars say that Vermont case will offer a **[xxx]** test of how far those powers extend. / Certainly, there are valid concerns about the **[xxx]** regulations that could result if every state sets its own rules. / But had Entergy kept its word, that debate would be beside the point.\n> \n> 现在公司突然宣称，2002年协议因2006年立法而无效，/ 并且只有联邦政府才有核问题的监管权。/ 此案法律问题**[xxx]**：/ 最高法院已裁定州的确有一些核能监管权，/ 法律学者说Vermont案将成为一次**[xxx]**的检验，看这些权力延伸多远。/ 当然，每个州各定规则可能产生**[xxx]**法规，相关担忧有道理。/ 但如果Entergy信守承诺，这场争论就与此无关。\n\nsome regulatory authority已被承认；待厘清的是这种州权能延伸到哪儿。\n\n接下来按A—D逐项看。","articleRects":[[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38]],"questionRects":[[226,1331,766,37],[280,1395,683,38],[280,1458,666,38],[280,1522,629,38],[280,1585,718,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"29","initialReadingPids":[4]},"html":"<h2>29题</h2>\n<blockquote><p>In the author’s view, the Vermont case will test ______.<br />\n作者认为，Vermont案件将检验什么？</p>\n</blockquote>\n<p>Vermont case和test出现在第五段，how far those powers extend给出了检验对象。</p>\n<blockquote><p>原文参考：</p>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues. The legal issues in the case are <strong>[xxx]</strong>: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a <strong>[xxx]</strong> test of how far those powers extend. Certainly, there are valid concerns about the <strong>[xxx]</strong> regulations that could result if every state sets its own rules. But had Entergy kept its word, that debate would be beside the point.</p>\n<p>开始精读：</p>\n<p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, / and that only the federal government has regulatory power over nuclear issues. / The legal issues in the case are <strong>[xxx]</strong>: / whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, / legal scholars say that Vermont case will offer a <strong>[xxx]</strong> test of how far those powers extend. / Certainly, there are valid concerns about the <strong>[xxx]</strong> regulations that could result if every state sets its own rules. / But had Entergy kept its word, that debate would be beside the point.</p>\n<p>现在公司突然宣称，2002年协议因2006年立法而无效，/ 并且只有联邦政府才有核问题的监管权。/ 此案法律问题<strong>[xxx]</strong>：/ 最高法院已裁定州的确有一些核能监管权，/ 法律学者说Vermont案将成为一次<strong>[xxx]</strong>的检验，看这些权力延伸多远。/ 当然，每个州各定规则可能产生<strong>[xxx]</strong>法规，相关担忧有道理。/ 但如果Entergy信守承诺，这场争论就与此无关。</p>\n</blockquote>\n<p>some regulatory authority已被承认；待厘清的是这种州权能延伸到哪儿。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"29题","raw":"### A. Entergy’s **[xxx]** to fulfill all its promises\n\n> 案件将检验Entergy履行全部诺言的**[xxx]**。\n\n把A接回题干，它说的是：案件将检验Entergy履行全部诺言的**[xxx]**。\n\nA提到公司履行承诺，段末也有`kept its word`。但题干问案件`will test`什么，先到同段的`test of`后面找它真正要检验的内容。\n\n> The legal issues in the case are **[xxx]**: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a **[xxx]** test of how far those powers extend.\n\n> But had Entergy kept its word, that debate would be beside the point.\n\n`test of how far those powers extend`说，要检验那些权力能延伸多远。`those powers`往前接的是州已有的一部分核监管权。\n\n段末的`had Entergy kept its word`则是在说，如果公司守约，这场争论就没有必要发生。它解释争论为什么被挑起来，没有把案件检验的内容改成公司怎样履行全部承诺。\n\nA中的生词还未读清，但后面的`fulfill all its promises`已经把问题转到了公司守约，和`test of`后面的州权范围不同。\n\n**`test of`后面直接问的是公司怎样守约，还是州的权力能管到哪里？**\n\n是州权能管到哪里。A把引起争论的失信问题换成了案件要检验的内容。\n\n**第一轮判断：A排除。**","articleRects":[[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38]],"questionRects":[[280,1395,683,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>A. Entergy’s <strong>[xxx]</strong> to fulfill all its promises</h3>\n<blockquote><p>案件将检验Entergy履行全部诺言的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把A接回题干，它说的是：案件将检验Entergy履行全部诺言的<strong>[xxx]</strong>。</p>\n<p>A提到公司履行承诺，段末也有<code>kept its word</code>。但题干问案件<code>will test</code>什么，先到同段的<code>test of</code>后面找它真正要检验的内容。</p>\n<blockquote><p>The legal issues in the case are <strong>[xxx]</strong>: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a <strong>[xxx]</strong> test of how far those powers extend.</p>\n</blockquote>\n<blockquote><p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n<p><code>test of how far those powers extend</code>说，要检验那些权力能延伸多远。<code>those powers</code>往前接的是州已有的一部分核监管权。</p>\n<p>段末的<code>had Entergy kept its word</code>则是在说，如果公司守约，这场争论就没有必要发生。它解释争论为什么被挑起来，没有把案件检验的内容改成公司怎样履行全部承诺。</p>\n<p>A中的生词还未读清，但后面的<code>fulfill all its promises</code>已经把问题转到了公司守约，和<code>test of</code>后面的州权范围不同。</p>\n<p><strong><code>test of</code>后面直接问的是公司怎样守约，还是州的权力能管到哪里？</strong></p>\n<p>是州权能管到哪里。A把引起争论的失信问题换成了案件要检验的内容。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"29题","raw":"### B. the nature of states’ patchwork regulations\n\n> 案件将检验各州拼接式法规的性质。\n\n把B接回题干，它说的是：案件将检验各州拼接式法规的性质。\n\nB的各州法规能接到后一句`every state sets its own rules`。我们把这句担忧和前一句`test of`区分开，看案件到底要回答哪一个问题。\n\n> The legal issues in the case are **[xxx]**: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a **[xxx]** test of how far those powers extend.\n\n> Certainly, there are valid concerns about the **[xxx]** regulations that could result if every state sets its own rules.\n\n前一句先承认州有一些核监管权，然后问这些权力能到什么范围。这是案件要检验的问题。\n\n后一句说，如果各州都各自制定规则，确实会产生值得担心的法规问题。这里是进一步解释为什么这场权力争论让人关心。\n\nB把后一句的法规性质接到了前一句案件要检验的位置。各州规则会是什么样，与州有权管到哪里，还不是同一个问题。\n\n**各州分别设规则可能引出哪些法规问题，是否就等于州的监管权能到什么范围？**\n\n不是。前者是后面的担忧，`test of`直接提出的是后一种权力范围。\n\n**第一轮判断：B排除。**","articleRects":[[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38]],"questionRects":[[280,1458,666,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>B. the nature of states’ patchwork regulations</h3>\n<blockquote><p>案件将检验各州拼接式法规的性质。</p>\n</blockquote>\n<p>把B接回题干，它说的是：案件将检验各州拼接式法规的性质。</p>\n<p>B的各州法规能接到后一句<code>every state sets its own rules</code>。我们把这句担忧和前一句<code>test of</code>区分开，看案件到底要回答哪一个问题。</p>\n<blockquote><p>The legal issues in the case are <strong>[xxx]</strong>: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a <strong>[xxx]</strong> test of how far those powers extend.</p>\n</blockquote>\n<blockquote><p>Certainly, there are valid concerns about the <strong>[xxx]</strong> regulations that could result if every state sets its own rules.</p>\n</blockquote>\n<p>前一句先承认州有一些核监管权，然后问这些权力能到什么范围。这是案件要检验的问题。</p>\n<p>后一句说，如果各州都各自制定规则，确实会产生值得担心的法规问题。这里是进一步解释为什么这场权力争论让人关心。</p>\n<p>B把后一句的法规性质接到了前一句案件要检验的位置。各州规则会是什么样，与州有权管到哪里，还不是同一个问题。</p>\n<p><strong>各州分别设规则可能引出哪些法规问题，是否就等于州的监管权能到什么范围？</strong></p>\n<p>不是。前者是后面的担忧，<code>test of</code>直接提出的是后一种权力范围。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"29题","raw":"### C. the federal authority over nuclear issues\n\n> 案件将检验联邦对核问题的权威。\n\n把C接回题干，它说的是：案件将检验联邦对核问题的权威。\n\nC的`federal authority`能在公司“只有联邦有监管权”的说法里找到。但我们要接的是作者后面说的案件检验，我们继续读最高法院承认的`states`和`those powers`。\n\n> Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.\n\n> The legal issues in the case are **[xxx]**: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a **[xxx]** test of how far those powers extend.\n\n公司先主张只有联邦政府有核监管权。随后原文写，最高法院已经裁定，州确实有一些监管权。\n\n后面的`those powers`紧接着州的权力，问的是这些州权能延伸到什么程度。它没有跳回公司刚提出的联邦独占主张。\n\n因此，争论虽然牵涉联邦与州，空格要补的仍是州权的界限。C把这个具体的权力主体换成了联邦。\n\n**`those powers`紧接州有一些监管权，能在这里改指联邦的权威吗？**\n\n不能。它沿用的是州已有的监管权，C换了主体。\n\n**第一轮判断：C排除。**","articleRects":[[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38]],"questionRects":[[280,1522,629,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>C. the federal authority over nuclear issues</h3>\n<blockquote><p>案件将检验联邦对核问题的权威。</p>\n</blockquote>\n<p>把C接回题干，它说的是：案件将检验联邦对核问题的权威。</p>\n<p>C的<code>federal authority</code>能在公司“只有联邦有监管权”的说法里找到。但我们要接的是作者后面说的案件检验，我们继续读最高法院承认的<code>states</code>和<code>those powers</code>。</p>\n<blockquote><p>Now the company is suddenly claiming that the 2002 agreement is invalid because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues.</p>\n</blockquote>\n<blockquote><p>The legal issues in the case are <strong>[xxx]</strong>: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a <strong>[xxx]</strong> test of how far those powers extend.</p>\n</blockquote>\n<p>公司先主张只有联邦政府有核监管权。随后原文写，最高法院已经裁定，州确实有一些监管权。</p>\n<p>后面的<code>those powers</code>紧接着州的权力，问的是这些州权能延伸到什么程度。它没有跳回公司刚提出的联邦独占主张。</p>\n<p>因此，争论虽然牵涉联邦与州，空格要补的仍是州权的界限。C把这个具体的权力主体换成了联邦。</p>\n<p><strong><code>those powers</code>紧接州有一些监管权，能在这里改指联邦的权威吗？</strong></p>\n<p>不能。它沿用的是州已有的监管权，C换了主体。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"29题","raw":"### D. the limits of states’ power over nuclear issues\n\n> 案件将检验州在核问题上的权力界限。\n\n把D接回题干，它说的是：案件将检验州在核问题上的权力界限。\n\nD的`limits`说界限，原文的`how far ... extend`也是问能延伸多远。再看这个范围属于谁：前半句已经有`states ... regulatory authority`。\n\n> The legal issues in the case are **[xxx]**: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a **[xxx]** test of how far those powers extend.\n\n最高法院已经承认州有一些核监管权，所以此处不是重新问州到底有没有任何权力。\n\n要通过这个案件进一步检验的，是已有权力的范围。D的`states’ power`接住州这一方，`limits`接住能管到哪里，`nuclear issues`又接住核问题。\n\n这几部分连起来，就是原句先承认有权、再问界限的意思。\n\n**州已经有一些核监管权，还要检验它能延伸到哪里，这能否概括为州权的界限？**\n\n能。D保留了州这一方，也保留了真正待确定的范围。\n\n**第一轮判断：D保留。**","articleRects":[[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38]],"questionRects":[[280,1585,718,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"29","paragraphPids":[4]},"html":"<h3>D. the limits of states’ power over nuclear issues</h3>\n<blockquote><p>案件将检验州在核问题上的权力界限。</p>\n</blockquote>\n<p>把D接回题干，它说的是：案件将检验州在核问题上的权力界限。</p>\n<p>D的<code>limits</code>说界限，原文的<code>how far ... extend</code>也是问能延伸多远。再看这个范围属于谁：前半句已经有<code>states ... regulatory authority</code>。</p>\n<blockquote><p>The legal issues in the case are <strong>[xxx]</strong>: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a <strong>[xxx]</strong> test of how far those powers extend.</p>\n</blockquote>\n<p>最高法院已经承认州有一些核监管权，所以此处不是重新问州到底有没有任何权力。</p>\n<p>要通过这个案件进一步检验的，是已有权力的范围。D的<code>states’ power</code>接住州这一方，<code>limits</code>接住能管到哪里，<code>nuclear issues</code>又接住核问题。</p>\n<p>这几部分连起来，就是原句先承认有权、再问界限的意思。</p>\n<p><strong>州已经有一些核监管权，还要检验它能延伸到哪里，这能否概括为州权的界限？</strong></p>\n<p>能。D保留了州这一方，也保留了真正待确定的范围。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"29题","raw":"### 29题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n保留D。test of的对象是how far those powers extend，those powers承接州已有的核监管权，问的是它的界限。","articleRects":[],"questionRects":[[226,1331,766,37],[280,1395,683,38],[280,1458,666,38],[280,1522,629,38],[280,1585,718,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"29"},"html":"<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>保留D。test of的对象是how far those powers extend，those powers承接州已有的核监管权，问的是它的界限。</p>\n"},{"section":"30题","raw":"## 30题\n\n> It can be inferred from the last paragraph that ______.  \n> 从末段可以推知什么？\n\n末段从Vermont声誉转到其他11座反应堆，再点名Pilgrim的续期申请。\n\n> 原文参考：\n> \n> The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state. But there should be consequences. Permission to run a nuclear plant is a public trust. Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. **[xxx]** to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years. But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.\n> \n> 开始精读：\n> \n> The company seems to have concluded that its reputation in Vermont is already so damaged / that it has nothing left to lose by going to war with the state. / But there should be consequences. / Permission to run a nuclear plant is a public trust. / Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. / **[xxx]** to run Pilgrim safely, / the company has applied for federal permission to keep it open for another 20 years. / But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, / it should keep in mind what promises from Entergy are worth.\n> \n> 公司似乎断定，它在Vermont的声誉已严重受损，/ 因此与州开战也没什么可失去的了。/ 但它应当承担后果。/ 核电站运营许可是一份公众信任。/ Entergy在美国还运行另外11座反应堆，包括Plymouth的Pilgrim电站。/ 公司**[xxx]**安全运营Pilgrim，/ 并向联邦申请再开20年。/ 可当核监管委员会审查申请时，/ 应该记住Entergy的承诺到底值多少。\n\n这些地名不是额外背景：作者要求核监管委员会审查其他地区业务时，也考虑这次失信。\n\n接下来按A—D逐项看。","articleRects":[[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[[226,1712,730,38],[281,1775,737,38],[280,1839,628,38],[280,1902,736,38],[280,1966,636,37],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"30","initialReadingPids":[5]},"html":"<h2>30题</h2>\n<blockquote><p>It can be inferred from the last paragraph that ______.<br />\n从末段可以推知什么？</p>\n</blockquote>\n<p>末段从Vermont声誉转到其他11座反应堆，再点名Pilgrim的续期申请。</p>\n<blockquote><p>原文参考：</p>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state. But there should be consequences. Permission to run a nuclear plant is a public trust. Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. <strong>[xxx]</strong> to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years. But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n<p>开始精读：</p>\n<p>The company seems to have concluded that its reputation in Vermont is already so damaged / that it has nothing left to lose by going to war with the state. / But there should be consequences. / Permission to run a nuclear plant is a public trust. / Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth. / <strong>[xxx]</strong> to run Pilgrim safely, / the company has applied for federal permission to keep it open for another 20 years. / But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, / it should keep in mind what promises from Entergy are worth.</p>\n<p>公司似乎断定，它在Vermont的声誉已严重受损，/ 因此与州开战也没什么可失去的了。/ 但它应当承担后果。/ 核电站运营许可是一份公众信任。/ Entergy在美国还运行另外11座反应堆，包括Plymouth的Pilgrim电站。/ 公司<strong>[xxx]</strong>安全运营Pilgrim，/ 并向联邦申请再开20年。/ 可当核监管委员会审查申请时，/ 应该记住Entergy的承诺到底值多少。</p>\n</blockquote>\n<p>这些地名不是额外背景：作者要求核监管委员会审查其他地区业务时，也考虑这次失信。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"30题","raw":"### A. Entergy’s business elsewhere might be affected\n\n> Entergy在其他地方的业务可能受影响。\n\n把A接回题干，它说的是：Entergy在其他地方的业务可能受影响。\n\nA说`business elsewhere`，在别处的业务。末段列出`11 other reactors`，还特别写Pilgrim的续期申请，我们看为什么刚讲完Vermont就转到另一座电站。\n\n> Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth.\n\n> **[xxx]** to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years.\n\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.\n\n公司似乎觉得自己在Vermont已经名声很差，继续与州争斗也没什么可失去。作者却说还应该有后果，随即提到公司在别处的反应堆和Pilgrim再运行20年的申请。\n\n最后要求NRC审查时想一想Entergy的承诺值多少。这样，Vermont发生的失信就和另一座电站的许可审查接在一起：监管者可能不会轻易相信公司又作出的承诺。\n\nA用了`might`，只说别处业务可能受到影响，没有说所有电站都会关闭，也没有说申请一定被拒。\n\n**Vermont的失信要被带进Pilgrim的续期审查，能否支持别处业务可能受到影响？**\n\n能。另一份许可申请也要考虑公司的承诺是否可靠，A保留。\n\n**第一轮判断：A保留。**","articleRects":[[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[[281,1775,737,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"30","paragraphPids":[5]},"html":"<h3>A. Entergy’s business elsewhere might be affected</h3>\n<blockquote><p>Entergy在其他地方的业务可能受影响。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Entergy在其他地方的业务可能受影响。</p>\n<p>A说<code>business elsewhere</code>，在别处的业务。末段列出<code>11 other reactors</code>，还特别写Pilgrim的续期申请，我们看为什么刚讲完Vermont就转到另一座电站。</p>\n<blockquote><p>Entergy runs 11 other reactors in the United States, including Pilgrim Nuclear station in Plymouth.</p>\n</blockquote>\n<blockquote><p><strong>[xxx]</strong> to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years.</p>\n</blockquote>\n<blockquote><p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<p>公司似乎觉得自己在Vermont已经名声很差，继续与州争斗也没什么可失去。作者却说还应该有后果，随即提到公司在别处的反应堆和Pilgrim再运行20年的申请。</p>\n<p>最后要求NRC审查时想一想Entergy的承诺值多少。这样，Vermont发生的失信就和另一座电站的许可审查接在一起：监管者可能不会轻易相信公司又作出的承诺。</p>\n<p>A用了<code>might</code>，只说别处业务可能受到影响，没有说所有电站都会关闭，也没有说申请一定被拒。</p>\n<p><strong>Vermont的失信要被带进Pilgrim的续期审查，能否支持别处业务可能受到影响？</strong></p>\n<p>能。另一份许可申请也要考虑公司的承诺是否可靠，A保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"30题","raw":"### B. the authority of the NRC will be defied\n\n> 核监管委员会的权威将受到公然挑战。\n\n把B接回题干，它说的是：核监管委员会的权威将受到公然挑战。\n\nB说将挑战NRC。末段与公司争斗的是`the state`，NRC则出现在`reviews the company’s application`。我们把这两个机构各自参与的事分清。\n\n> **[xxx]** to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years.\n\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.\n\n公司已经在与Vermont州争斗，但向联邦提出的是Pilgrim的续期申请。NRC接下来要做的，是审查这份申请，并考虑公司承诺是否可信。\n\n原文没有说公司拒绝NRC的要求或准备挑战它。B把对州的争斗，接到了联邦审查机构身上。\n\n作者转到NRC，是要说明失信可能使另一份申请也付出代价，并不是预告公司还会对NRC采取同样的抗拒。\n\n**原文说公司与州争斗、由NRC审查另一份申请，就能断定它还会挑战NRC吗？**\n\n不能。两件事的对象不同，原文没有给出针对NRC的挑战行为。\n\n**第一轮判断：B排除。**","articleRects":[[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[[280,1839,628,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>B. the authority of the NRC will be defied</h3>\n<blockquote><p>核监管委员会的权威将受到公然挑战。</p>\n</blockquote>\n<p>把B接回题干，它说的是：核监管委员会的权威将受到公然挑战。</p>\n<p>B说将挑战NRC。末段与公司争斗的是<code>the state</code>，NRC则出现在<code>reviews the company’s application</code>。我们把这两个机构各自参与的事分清。</p>\n<blockquote><p><strong>[xxx]</strong> to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years.</p>\n</blockquote>\n<blockquote><p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<p>公司已经在与Vermont州争斗，但向联邦提出的是Pilgrim的续期申请。NRC接下来要做的，是审查这份申请，并考虑公司承诺是否可信。</p>\n<p>原文没有说公司拒绝NRC的要求或准备挑战它。B把对州的争斗，接到了联邦审查机构身上。</p>\n<p>作者转到NRC，是要说明失信可能使另一份申请也付出代价，并不是预告公司还会对NRC采取同样的抗拒。</p>\n<p><strong>原文说公司与州争斗、由NRC审查另一份申请，就能断定它还会挑战NRC吗？</strong></p>\n<p>不能。两件事的对象不同，原文没有给出针对NRC的挑战行为。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"30题","raw":"### C. Entergy will withdraw its Plymouth application\n\n> Entergy将撤回其Plymouth申请。\n\n把C接回题干，它说的是：Entergy将撤回其Plymouth申请。\n\nC提到的申请就是Pilgrim再运营20年的申请。我们看`has applied`之后，原文把下一步动作交给公司，还是交给NRC。\n\n> **[xxx]** to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years.\n\n> But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.\n\n公司已经申请了许可，下一步写的是NRC审查这份申请时，应考虑Entergy的承诺有多可信。\n\nC却说公司会主动`withdraw`，撤回申请。认真审查可能让申请不顺利，但还不能替公司决定它因此就会放弃。\n\n原文给出的动作是监管者审查，C换成公司撤回，还用`will`把这个没有写出的决定说成一定会发生。\n\n**NRC应当审查公司是否可信，就表示公司已经决定撤回申请了吗？**\n\n没有。审查可能影响申请，不能直接推出公司必定主动撤回。\n\n**第一轮判断：C排除。**","articleRects":[[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[[280,1902,736,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>C. Entergy will withdraw its Plymouth application</h3>\n<blockquote><p>Entergy将撤回其Plymouth申请。</p>\n</blockquote>\n<p>把C接回题干，它说的是：Entergy将撤回其Plymouth申请。</p>\n<p>C提到的申请就是Pilgrim再运营20年的申请。我们看<code>has applied</code>之后，原文把下一步动作交给公司，还是交给NRC。</p>\n<blockquote><p><strong>[xxx]</strong> to run Pilgrim safely, the company has applied for federal permission to keep it open for another 20 years.</p>\n</blockquote>\n<blockquote><p>But as the Nuclear Regulatory Commission (NRC) reviews the company’s application, it should keep in mind what promises from Entergy are worth.</p>\n</blockquote>\n<p>公司已经申请了许可，下一步写的是NRC审查这份申请时，应考虑Entergy的承诺有多可信。</p>\n<p>C却说公司会主动<code>withdraw</code>，撤回申请。认真审查可能让申请不顺利，但还不能替公司决定它因此就会放弃。</p>\n<p>原文给出的动作是监管者审查，C换成公司撤回，还用<code>will</code>把这个没有写出的决定说成一定会发生。</p>\n<p><strong>NRC应当审查公司是否可信，就表示公司已经决定撤回申请了吗？</strong></p>\n<p>没有。审查可能影响申请，不能直接推出公司必定主动撤回。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"30题","raw":"### D. Vermont’s reputation might be damaged\n\n> Vermont的声誉可能受损。\n\n把D接回题干，它说的是：Vermont的声誉可能受损。\n\nD说`Vermont’s reputation`，把声誉归给州。原句却是`its reputation in Vermont`，我们从前面的`The company`接回`its`，再看`in Vermont`的作用。\n\n> The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.\n\n`The company`指Entergy，`its`接的仍是这家公司。因此，受损的是公司的声誉，`in Vermont`只是说公司在Vermont那里的名声。\n\nD把地点放进所有格，变成Vermont州自己的声誉受损。公司在一个地方名声不好，不等于这个地方自己的名声不好。\n\n后面讨论其他反应堆和许可申请，也仍在追问公司要承担的后果，没有转到州的声誉。\n\n**`its reputation in Vermont`里，声誉属于Entergy还是属于Vermont？**\n\n属于Entergy。Vermont表示地点，D把声誉的拥有者换成了州。\n\n**第一轮判断：D排除。**","articleRects":[[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[[280,1966,636,37],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>D. Vermont’s reputation might be damaged</h3>\n<blockquote><p>Vermont的声誉可能受损。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Vermont的声誉可能受损。</p>\n<p>D说<code>Vermont’s reputation</code>，把声誉归给州。原句却是<code>its reputation in Vermont</code>，我们从前面的<code>The company</code>接回<code>its</code>，再看<code>in Vermont</code>的作用。</p>\n<blockquote><p>The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to war with the state.</p>\n</blockquote>\n<p><code>The company</code>指Entergy，<code>its</code>接的仍是这家公司。因此，受损的是公司的声誉，<code>in Vermont</code>只是说公司在Vermont那里的名声。</p>\n<p>D把地点放进所有格，变成Vermont州自己的声誉受损。公司在一个地方名声不好，不等于这个地方自己的名声不好。</p>\n<p>后面讨论其他反应堆和许可申请，也仍在追问公司要承担的后果，没有转到州的声誉。</p>\n<p><strong><code>its reputation in Vermont</code>里，声誉属于Entergy还是属于Vermont？</strong></p>\n<p>属于Entergy。Vermont表示地点，D把声誉的拥有者换成了州。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"30题","raw":"### 30题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n保留A。作者把公司在Vermont的失信带进其他地区续期申请的审查，支持业务可能受影响；不能把这一后果改成挑战NRC、主动撤回申请或州声誉受损。","articleRects":[],"questionRects":[[226,1712,730,38],[281,1775,737,38],[280,1839,628,38],[280,1902,736,38],[280,1966,636,37],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"30"},"html":"<h3>30题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>保留A。作者把公司在Vermont的失信带进其他地区续期申请的审查，支持业务可能受影响；不能把这一后果改成挑战NRC、主动撤回申请或州声誉受损。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | A deal is a deal；commitment to abide by the state’s strict nuclear regulations | Entergy曾承诺遵守州的核规定，现在却违背承诺；开头用A deal is a deal表达对守约的要求。 | 先提出要追究的事情：这家公司作出的承诺还能不能作数。 |\n| 第2段 | has done precisely what it had long promised it would not | 公司has done precisely what it had long promised it would not，向联邦法院挑战州规则，目的是让电站继续运行。 | 把“违背承诺”落到一项主动采取的行动上。 |\n| 第3段 | As a condition of receiving state approval for the sale；Then, too, the company went along | 2002年公司为取得state approval for the sale，同意继续运营时申请州许可；2006年州增加审批要求，公司当时也同意。 | 交代承诺不是被事后强加的条件，而是公司取得交易批准时接受的安排。 |\n| 第4段 | raised serious questions；safety and Entergy’s management；misleading statements | 电站发生事故，公司又作misleading statements about the pipe，安全和管理受到质疑，州参议院因而反对延期。 | 说明公司继续运营遇阻的具体原因，把问题落在运行和说明行为上。开头对公司最初为何承诺，仍保留两种解释。 |\n| 第5段 | how far those powers extend；had Entergy kept its word | 公司现在主张旧协议无效、只有联邦拥有监管权；作者承认州权范围值得讨论，却接着用had Entergy kept its word说明，若公司守约，这场争论便无须成为眼前的问题。 | 区分法律争议与失信责任：监管边界可以讨论，但不能用这个争议抹去已经接受的承诺。 |\n| 第6段 | a public trust；11 other reactors；what promises from Entergy are worth | 公司似乎认为当地声誉已经很差，继续与州争斗也无可损失；作者指出它还有别处的电站和续期申请，要求NRC记住what promises from Entergy are worth。 | 把履约问题推进到具体后果：运营许可建立在公众信任上，失信可能影响其他地区的申请。 |\n\n全文不是只在问州和联邦谁有权监管，也不是只在罗列电站事故。法律争议之前，作者先交代公司曾经同意什么；法律争议之后，又回到公司承诺究竟值多少。中间的事故、误导性说明和事后挑战规则，说明为什么这种信用会受到质疑。\n\n全文的主要观点是：Entergy为了继续运行电站而违背已接受的监管承诺，其运行和管理行为又削弱了信用；核电运营许可建立在公众信任上，监管者审查其他地区的续期申请时，也应考虑这种失信所带来的问题。","articleRects":[[274,312,1122,38],[202,358,1194,38],[203,404,1193,39],[202,450,895,37],[274,496,1122,37],[202,542,1194,37],[202,588,1194,37],[202,634,252,37],[273,679,1123,38],[202,725,1193,38],[202,771,1193,38],[202,817,1189,38],[202,863,1194,38],[202,909,885,38],[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38],[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38],[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>A deal is a deal；commitment to abide by the state’s strict nuclear regulations</td><td>Entergy曾承诺遵守州的核规定，现在却违背承诺；开头用A deal is a deal表达对守约的要求。</td><td>先提出要追究的事情：这家公司作出的承诺还能不能作数。</td></tr><tr><td>第2段</td><td>has done precisely what it had long promised it would not</td><td>公司has done precisely what it had long promised it would not，向联邦法院挑战州规则，目的是让电站继续运行。</td><td>把“违背承诺”落到一项主动采取的行动上。</td></tr><tr><td>第3段</td><td>As a condition of receiving state approval for the sale；Then, too, the company went along</td><td>2002年公司为取得state approval for the sale，同意继续运营时申请州许可；2006年州增加审批要求，公司当时也同意。</td><td>交代承诺不是被事后强加的条件，而是公司取得交易批准时接受的安排。</td></tr><tr><td>第4段</td><td>raised serious questions；safety and Entergy’s management；misleading statements</td><td>电站发生事故，公司又作misleading statements about the pipe，安全和管理受到质疑，州参议院因而反对延期。</td><td>说明公司继续运营遇阻的具体原因，把问题落在运行和说明行为上。开头对公司最初为何承诺，仍保留两种解释。</td></tr><tr><td>第5段</td><td>how far those powers extend；had Entergy kept its word</td><td>公司现在主张旧协议无效、只有联邦拥有监管权；作者承认州权范围值得讨论，却接着用had Entergy kept its word说明，若公司守约，这场争论便无须成为眼前的问题。</td><td>区分法律争议与失信责任：监管边界可以讨论，但不能用这个争议抹去已经接受的承诺。</td></tr><tr><td>第6段</td><td>a public trust；11 other reactors；what promises from Entergy are worth</td><td>公司似乎认为当地声誉已经很差，继续与州争斗也无可损失；作者指出它还有别处的电站和续期申请，要求NRC记住what promises from Entergy are worth。</td><td>把履约问题推进到具体后果：运营许可建立在公众信任上，失信可能影响其他地区的申请。</td></tr></tbody></table>\n<p>全文不是只在问州和联邦谁有权监管，也不是只在罗列电站事故。法律争议之前，作者先交代公司曾经同意什么；法律争议之后，又回到公司承诺究竟值多少。中间的事故、误导性说明和事后挑战规则，说明为什么这种信用会受到质疑。</p>\n<p>全文的主要观点是：Entergy为了继续运行电站而违背已接受的监管承诺，其运行和管理行为又削弱了信用；核电运营许可建立在公众信任上，监管者审查其他地区的续期申请时，也应考虑这种失信所带来的问题。</p>\n"},{"section":"进阶回查","raw":"## 回查28题：A还是D？\n\n第一遍留下：\n\n- A. managerial practices\n- D. business vision\n\nA接回题干：Entergy的管理做法似乎有问题。\n\nD接回题干：Entergy的商业远见似乎有问题。\n\n第一遍A有`management`和管道误导性陈述的明确对应。D则让我们想到第四段开头的`what would happen next`，但前面的动作还没有读清。\n\n先回第四段最明确的一句：\n\n> raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe\n\n事故发生以后，公司怎样说明管道情况，是它已经作出的管理行为。作者用`especially after`说，误导性陈述使管理方面的疑问更严重。\n\n后面公司又作了什么选择？第5段说，它突然声称旧协议无效，并且只有联邦拥有核监管权。作者承认法律上有问题值得讨论，仍接着写：\n\n> But had Entergy kept its word, that debate would be beside the point.\n\n如果公司守约，这场争论本来就没有必要。这里继续追究的是公司怎样对待自己接受过的约定。\n\n第6段又写它似乎认为，在Vermont已经没什么声誉可失去，于是继续和州争斗。作者因此要求NRC审查其他申请时，想一想它的承诺究竟值多少。\n\n把这些事接起来：先对管道作误导性说明，再否定以前接受的约定，最后可能让其他申请也受到信任问题的影响。每一步都是公司具体选择怎样管理、怎样说明、怎样履约。\n\n**后文接着追究的，是公司当初有没有预见未来，还是它在事情发生后怎样说明事实、怎样履行承诺？**\n\n是后者。D在开头有一个还没读清的联系，A却能直接接上第四段点名的管理，也能接上后文继续写出的这些做法。\n\n> **28题选A。**\n","articleRects":[[273,955,1123,38],[203,1001,1193,38],[202,1047,1194,38],[202,1093,1194,38],[202,1139,1194,38],[202,1185,1194,38],[202,1231,1027,38],[273,1277,1123,38],[202,1322,1194,38],[202,1369,1194,37],[202,1415,1193,37],[202,1460,1194,38],[202,1506,1194,38],[202,1552,1194,38],[202,1598,1184,38],[273,1644,1123,38],[202,1690,1184,38],[202,1736,1193,38],[202,1782,1194,38],[202,1828,1194,38],[202,1874,1194,38],[202,1918,1194,40],[203,1966,884,38]],"questionRects":[[226,951,1055,38],[281,1014,343,38],[280,1078,397,30],[280,1141,258,38],[280,1205,267,30]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","D"],"newEvidencePids":[5,6],"finalChoice":"A","qid":"28","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查28题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul><li>A. managerial practices</li><li>D. business vision</li></ul>\n<p>A接回题干：Entergy的管理做法似乎有问题。</p>\n<p>D接回题干：Entergy的商业远见似乎有问题。</p>\n<p>第一遍A有<code>management</code>和管道误导性陈述的明确对应。D则让我们想到第四段开头的<code>what would happen next</code>，但前面的动作还没有读清。</p>\n<p>先回第四段最明确的一句：</p>\n<blockquote><p>raised serious questions about both Vermont Yankee’s safety and Entergy’s management—especially after the company made misleading statements about the pipe</p>\n</blockquote>\n<p>事故发生以后，公司怎样说明管道情况，是它已经作出的管理行为。作者用<code>especially after</code>说，误导性陈述使管理方面的疑问更严重。</p>\n<p>后面公司又作了什么选择？第5段说，它突然声称旧协议无效，并且只有联邦拥有核监管权。作者承认法律上有问题值得讨论，仍接着写：</p>\n<blockquote><p>But had Entergy kept its word, that debate would be beside the point.</p>\n</blockquote>\n<p>如果公司守约，这场争论本来就没有必要。这里继续追究的是公司怎样对待自己接受过的约定。</p>\n<p>第6段又写它似乎认为，在Vermont已经没什么声誉可失去，于是继续和州争斗。作者因此要求NRC审查其他申请时，想一想它的承诺究竟值多少。</p>\n<p>把这些事接起来：先对管道作误导性说明，再否定以前接受的约定，最后可能让其他申请也受到信任问题的影响。每一步都是公司具体选择怎样管理、怎样说明、怎样履约。</p>\n<p><strong>后文接着追究的，是公司当初有没有预见未来，还是它在事情发生后怎样说明事实、怎样履行承诺？</strong></p>\n<p>是后者。D在开头有一个还没读清的联系，A却能直接接上第四段点名的管理，也能接上后文继续写出的这些做法。</p>\n<blockquote><p><strong>28题选A。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**26. C**\n\n**27. D**\n\n**28. A**\n\n**29. D**\n\n**30. A**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>26. C</strong></p>\n<p><strong>27. D</strong></p>\n<p><strong>28. A</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. A</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRkKFBABXRUJQVlA4TDaFBAAvV0Y1AlWT4rZtI6n7b33aBfqPiAngq4qTIKK68n6Y3xF4EHJNCDGH2lwBsr46zbCOqA1tVMlRsJFlLDPrSBPGHFEBQhTmK+53PPW2HWn/11uKcHd3d3d3d3d3d3fK3d3d3d3dXcvdKXetuv9zzj197qlzL1W/U58FkHWOL4Ai8ggidyIyOxugcyJW4L4GNkDkTkSxi464ERuwzwJwQgvdiRxyNuARmYeesYEbsQByIjLXmxF5RtTVOZp1hluHnbOAznsDOBEZG/DI10CRO0SdwUwvYGoin+8axjWaifRGdD6Rz0RDxAZYwOSTEY1G1CyAPYzswCPtbPJTrGEin9kAlo1WRP8dQZKkKNm47r2wwwZbvLD/v//qP0dJ20m3007adGfbzmZnJ/2nV2nTabeT7eym29lpZ7vTEZ1t52KbznZ3s91200m7O9mdbtPd7GQ27WZnu9vdaabX27SZTdqmu9Nu01zlamanO81up02u9vqiabpNm3bb3TbdznTbZK/P5/V8vS/Oge8Xfr//fjEoDEFhyBGgMASFQYHCkI8AhSGIEwwKFAZFMCgQJxgUKAyKYFAccYJBEQwKQzAojjjBoAjigcIQDIp8EoLCEMRBYQgGhQKFIUccFIagMChQGHLECQYFCoMChSFHEAwKxCcYFMGg+AiCQYE4waAIBoUhGBQ5yQkKQzAoDMGgyElOUBiCQWEICkOOAIUhiIPCEBSGPAUoDDniBIMChUGBwpAjTjAoUBgUwaA4gmBQoDAogkFxBMGgCMkJCkMwKAzBoMhJTlAYgkFhCApDjjgoDInovwfatus2km2royqqHJURBf4AfmUBBj+ycv//esnNA2hrw8ychZMO8zIN0x3emR3YmdmBO3DvDu3AZcb/5Tv3zuwsNMycp9Mnwfu/d3v+G5zTBV2WzFXcqvq4uJKrZIeOVV1c2aeqirkqZZTc2pz4Mkv6uT6ASvY88WWuygPoia+Lj6pjxa1bX1cffgJlUkyKuYpd1J74MituFTNz65mZ2ycQVaZ9AMV9BFHlX5lBxqe+KlHluvr4Km4ds2pUUeXEl5lpT1TRRZWZudXcqjqSvFHFI0G27bZtRXIHGYukrEqRKGzojZ0AKTo98W7bdhPbtq3x/u8111oBEUhqcoCQBVlMmD5TWn/7D4eRJEVStL/MeFcPRn9WK4H/4D/4D/6D/+A/+A/+g//gP/gP/oP/4D/4D/6D/+A/+A/+g//gP/gP/oP/4D/4D/6D/+A/+A/+g//gP/gP/oP/4D/4D/6D/+A/+A/+g//gP/gP/oP/4D/4D/6D/+A/+A/+g//gP/gP/oP/4D/4D/6D/+A/+A/+g//gP/gP/oP/4D/4Dzbrva3We1L+lRuPUSnUibWcYQgBMfDEa1P85UMyqKTyLzsSkpzrjwUnHyzJ9E2n496MUbmdu
