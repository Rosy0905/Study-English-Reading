<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"stem_intro"},"scrollTarget":"questionTop"},{"section":"先读题干","raw":"## 26题题干\n\n**Business-method patents have recently aroused concern because of ______.**\n\n> 商业方法专利最近为什么引起了关注？\n\n题型：**具体细节题**。\n\n---","html":"<h2>26题题干</h2>\n<p><strong>Business-method patents have recently aroused concern because of ______.</strong></p>\n<blockquote>\n<p>商业方法专利最近为什么引起了关注？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,170,1530,410]],"meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**Which of the following is true of the Bilski case?**\n\n> 关于Bilski案，下面哪项说法正确？\n\n题型：**具体细节题**。\n\n---","html":"<h2>27题题干</h2>\n<p><strong>Which of the following is true of the Bilski case?</strong></p>\n<blockquote>\n<p>关于Bilski案，下面哪项说法正确？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,590,1530,405]],"meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**The word “about-face” (Line 1, Para. 3) most probably means ______.**\n\n> 第3段第1行的“about-face”最可能是什么意思？\n\n题型：**猜词题**。\n\n---","html":"<h2>28题题干</h2>\n<p><strong>The word “about-face” (Line 1, Para. 3) most probably means ______.</strong></p>\n<blockquote>\n<p>第3段第1行的“about-face”最可能是什么意思？</p>\n</blockquote>\n<p>题型：<strong>猜词题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**We learn from the last two paragraphs that business-method patents ______.**\n\n> 从最后两段可以知道，商业方法专利怎么样？\n\n题型：**局部推断题**。\n\n---","html":"<  reconsider, narrowed</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>entire class, more than 300, too many, narrowed</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>patent, business-method, Federal Circuit, Bilski</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_intro"},"scrollTarget":"articleTop"},{"section":"读文章","raw":"Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its “one-click” online payment system. Merrill Lynch got legal protection for an asset **[xxx]** strategy. One inventor patented a **[xxx]** for **[xxx]** a box.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its “one-click” online payment system. Merrill Lynch got legal protection for an asset <span class=\"mask\">[xxx]</span> strategy. One inventor patented a <span class=\"mask\">[xxx]</span> for <span class=\"mask\">[xxx]</span> a box.</p>\n</div></div>","articleRects":[[150,285,1500,290]],"questionRects":[],"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0}},{"section":"读文章","raw":"Over the past decade, / thousands of patents have been granted / for what are called business methods. / Amazon.com received one / for its “one-click” online payment system. / Merrill Lynch got legal protection / for an asset **[xxx]** strategy. / One inventor patented / a **[xxx]** / for **[xxx]** a box.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Over the past decade, / thousands of patents have been granted / for what are called business methods. / Amazon.com received one / for its “one-click” online payment system. / Merrill Lynch got legal protection / for an asset <span class=\"mask\">[xxx]</span> strategy. / One inventor patented / a 、最高法院、一系列近期决定、保护范围、太多专利、反专利动向。</p>\n</div></div>","articleRects":[[150,1840,1500,410]],"questionRects":[],"meta":{"kind":"coarse","coarse":true,"pid":4,"form":3}},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个案件、某项做法或最后两段时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和business-method patents有关；开头列了不少已经拿到专利的做法，第二段突然出现最高专利法院、广泛审查、Bilski和“整个一类专利”，中间回看以前怎样引入并大量增加这类专利，后面又写全部十二名法官、重新考虑旧决定，以及最高法院的一系列近期动作。\n\n到这里还不能自然地说清楚：法院现在究竟要做多大的改变，Bilski案为什么重要，第三段的“about-face”具体指什么，最后两段对这类专利作出了什么判断。粗读时只要知道“这篇文章大概在写一类专利原来很多，现在可能遇到一场很大的变化”，并记住相关内容大约在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。这里先记住专利例子、法院审查、旧决定、Bilski和最高法院这几块；它们之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个案件、某项做法或最后两段时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和business-method patents有关；开头列了不少已经拿到专利的做法，第二段突然出现最高专利法院、广泛审查、Bilski和“整个一类专利”，中间回看以前怎样引入并大量增加这类专利，后面又写全部十二名法官、重新考虑旧决定，以及最高法院的一系列近期动作。</p>\n<p>到这里还不能自然地说清楚：法院现在究竟要做多大的改变，Bilski案为什么重要，第三段的“about-face”具体指什么，最后两段对这类专利作出了什么判断。粗读时只要知道“这篇文章大概在写一类专利原来很多，现在可能遇到一场很大的变化”，并记住相关内容大约在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。这里先记住专利例子、法院审查、旧决定、Bilski和最高法院这几块；它们之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[[150,285,1500,290],[150,555,1500,410],[150,930,1500,665],[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[],"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> Business-method patents have recently aroused concern because of ______.  \n> 商业方法专利最近为什么引起了关注？\n\n我们先抓题干里的`recently aroused concern`。粗读时好像第二段突然写到最高专利法院准备对business-method patents采取动作，第一段则只是列了几个已经拿到专利的例子。为了分清“最近的原因”和“旧例子”，进入A以前先把第1、2段一起读完。\n\n> 原文参考：\n>\n> Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its “one-click” online payment system. Merrill Lynch got legal protection for an asset **[xxx]** strategy. One inventor patented a **[xxx]** for **[xxx]** a box.\n>\n> Now the nation’s top patent court **[xxx]** completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers **[xxx]**, the U.S. Court of Appeals for the Federal Circuit said it would use a **[xxx]** case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is “a very big deal,” says Dennis D. Crouch of the University of Missouri School of Law. It “has the **[xxx]** to eliminate an entire class of patents.”\n>\n> 开始精读：\n>\n> Over the past decade, / thousands of patents have been granted / for what are called business methods. / Amazon.com received one / for its “one-click” online payment system. / Merrill Lynch got legal protection / for an asset **[xxx]** strategy. / One inventor patented / a **[xxx]** / for **[xxx]** a box.\n>\n> Now the nation’s top patent court / **[xxx]** completely ready / to scale back on business-method patents, / which have been controversial / ever since they were first authorized 10 years ago. / In a move / that has intellectual-property lawyers **[xxx]**, / the U.S. Court of Appeals for the Federal Circuit said / it would use a **[xxx]** case / to conduct a broad review / of business-method patents. / In re Bilski, / as the case is known, / is “a very big deal,” / says Dennis D. Crouch / of the University of Missouri School of Law. / It “has the **[xxx]** / to eliminate an entire class / of patents.”\n>\n> 在过去十年里 / 数千项专利已经被授予 / 给所谓的商业方法。/ Amazon.com获得了一项 / 用于它的“一键式”在线支付系统。/ Merrill Lynch得到法律保护 / 用于一种资产 **[xxx]** 策略。/ 一位发明人为一种 **[xxx]** 申请了专利 / 用来 **[xxx]** 一个箱子。\n>\n> 现在这个国家最高的专利法院 / **[xxx]** 已经完全准备好 / 缩减商业方法专利，/ 这类专利一直有争议 / 自从十年前首次获准以来。/ 在一个举动中 / 使知识产权律师们 **[xxx]**，/ 美国联邦巡回上诉法院说 / 它将使用一个 **[xxx]** 案件 / 进行一次广泛审查 / 对商业方法专利。/ 这个案件叫In re Bilski，/ 是“一件非常大的事”，/ 一位法学教授说。/ 它“有 **[xxx]** / 消除整个一类 / 专利”。\n\n现在先把时间线分开：第1段写的是过去十年已经授予了哪些专利；第2段写的是现在法院准备`scale back`、进行`a broad review`，甚至可能`eliminate an entire class of patents`。题干问“最近为什么引起关注”，重点应落在第2段的新动作，而不是第1段某个旧例子。\n\n接下来按A—D逐项看。","html":"<h2>26题</h2>\n<blockquote>\n<p>Business-method patents have recently aroused concern because of ______.<br />\n商业方法专利最近为什么引起了关注？</p>\n</blockquote>\n<p>我们先抓题干里的<code>recently aroused concern</code>。粗读时好像第二段突然写到最高专利法院准备对business-method patents采取动作，第一段则只是列了几个已经拿到专利的例子。为了分清“最近的原因”和“旧例子”，进入A以前先把第1、2段一起读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its “one-click” online payment system. Merrill Lynch got legal protection for an asset <span class=\"mask\">[xxx]</span> strategy. One inventor patented a <span class=\"mask\">[xxx]</span> for <span class=\"mask\">[xxx]</span> a box.</p>\n<p>Now the nation’s top patent court <span class=\"mask\">[xxx]</span> completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers <span class=\"mask\">[xxx]</span>, the U.S. Court of Appeals for the Federal Circuit said it would use a <span class=\"mask\">[xxx]</span> case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is “a very big deal,” says Dennis D. Crouch of the University of Missouri School of Law. It “has the <span class=\"mask\">[xxx]</span> to eliminate an entire class of patents.”</p>\n<p>开始精读：</p>\n<p>Over the past decade, / thousands of patents have been granted / for what are called business methods. / Amazon.com received one / for its “one-click” online payment system. / Merrill Lynch got legal protection / for an asset <span class=\"mask\">[xxx]</span> strategy. / One inventor patented / a <span class=\"mask\">[xxx]</span> / for <span class=\"mask\">[xxx]</span> a box.</p>\n<p>Now the nation’s top patent court / <span class=\"mask\">[xxx]</span> completely ready / to scale back on business-method patents, / which have been controversial / ever since they were first authorized 10 years ago. / In a move / that has intellectual-property lawyers <span class=\"mask\">[xxx]</span>, / the U.S. Court of Appeals for the Federal Circuit said / it would use a <span class=\"mask\">[xxx]</span> case / to conduct a broad review / of business-method patents. / In re Bilski, / as the case is known, / is “a very big deal,” / says Dennis D. Crouch / of the University of Missouri School of Law. / It “has the <span class=\"mask\">[xxx]</span> / to eliminate an entire class / of patents.”</p>\n<p>在过去十年里 / 数千项专利已经被授予 / 给所谓的商业方法。/ Amazon.com获得了一项 / 用于它的“一键式”在线支付系统。/ Merrill Lynch得到法律保护 / 用于一种资产 <span class=\"mask\">[xxx]</span> 策略。/ 一位发明人为一种 <span class=\"mask\">[xxx]</span> 申请了专利 / 用来 <span class=\"mask\">[xxx]</span> 一个箱子。</p>\n<p>现在这个国家最高的专利法院 / <span class=\"mask\">[xxx]</span> 已经完全准备好 / 缩减商业方法专利，/ 这类专利一直有争议 / 自从十年前首次获准以来。/ 在一个举动中 / 使知识产权律师们 <span class=\"mask\">[xxx]</span>，/ 美国联邦巡回上诉法院说 / 它将使用一个 <span class=\"mask\">[xxx]</span> 案件 / 进行一次广泛审查 / 对商业方法专利。/ 这个案件叫In re Bilski，/ 是“一件非常大的事”，/ 一位法学教授说。/ 它“有 <span class=\"mask\">[xxx]</span> / 消除整个一类 / 专利”。</p>\n</blockquote>\n<p>现在先把时间线分开：第1段写的是过去十年已经授予了哪些专利；第2段写的是现在法院准备<code>scale back</code>、进行<code>a broad review</code>，甚至可能<code>eliminate an entire class of patents</code>。题干问“最近为什么引起关注”，重点应落在第2段的新动作，而不是第1段某个旧例子。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[150,285,1500,290],[150,555,1500,410]],"questionRects":[[135,170,1530,410]],"meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. their **[xxx]** value to businesses\n\n> 它们对企业的 **[xxx]** 价值\n\n把A接回题干，它说的是：商业方法专利最近引起关注，是因为它们对企业具有某种 **[xxx]** 价值。\n\nA里的`value to businesses`看着好像能和第1段的企业例子沾上边，但题干问的是“最近”的关注原因，先看原文有没有直接评价这些专利对企业的价值。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> Amazon.com received one for its “one-click” online payment system.\n>\nNow the nation’s top patent court **[xxx]** completely ready to scale back on business-method patents.\n\n原文说的是一些企业曾经获得这类专利，随后法院现在准备缩减这类专利。选项说的却是这些专利对企业的价值怎样。企业获得过专利，只能说明它们使用了这种保护，不能自动变成一种价值评价。\n\n**原文有没有说，最近的关注来自这些专利对企业“价值有限”或具有某种特定价值？**\n\n不能。原文没有给`value to businesses`作评价，最近发生的新情况是法院准备缩减并广泛审查。\n\n要选A，原文还得直接把“企业价值”写成引发近期关注的原因；第1、2段没有这样连接。\n\n**第一轮判断：A排除。**","html":"<h3>A. their <span class=\"mask\">[xxx]</span> value to businesses</h3>\n<blockquote>\n<p>它们对企业的 <span class=\"mask\">[xxx]</span> 价值</p>\n</blockquote>\n<p>把A接回题干，它说的是：商业方法专利最近引起关注，是因为它们对企业具有某种 <span class=\"mask\">[xxx]</span> 价值。</p>\n<p>A里的<code>value to businesses</code>看着好像能和第1段的企业例子沾上边，但题干问的是“最近”的关注原因，先看原文有没有直接评价这些专利对企业的价值。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>Amazon.com received one for its “one-click” online payment system.</p>\n</blockquote>\n<p>Now the nation’s top patent court <span class=\"mask\">[xxx]</span> completely ready to scale back on business-method patents.</p>\n<p>原文说的是一些企业曾经获得这类专利，随后法院现在准备缩减这类专利。选项说的却是这些专利对企业的价值怎样。企业获得过专利，只能说明它们使用了这种保护，不能自动变成一种价值评价。</p>\n<p><strong>原文有没有说，最近的关注来自这些专利对企业“价值有限”或具有某种特定价值？</strong></p>\n<p>不能。原文没有给<code>value to businesses</code>作评价，最近发生的新情况是法院准备缩减并广泛审查。</p>\n<p>要选A，原文还得直接把“企业价值”写成引发近期关注的原因；第1、2段没有这样连接。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[150,285,1500,290],[150,555,1500,410]],"questionRects":[[135,170,1530,410]],"meta":{"kind":"option","qid":"26","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P1","T2-P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"26题","raw":"### B. their connection with asset allocation\n\n> 它们与资产配置之间的联系\n\n把B接回题干，它说的是：商业方法专利最近引起关注，是因为它们与资产配置有关。\n\nB里的`asset allocation`很眼熟，刚才精读第1段时好像见过Merrill Lynch的例子，所以先把那句话放回来。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> Merrill Lynch got legal protection for an asset **[xxx]** strategy.\n>\nOne inventor patented a **[xxx]** for **[xxx]** a box.\n\n原文说资产 **[xxx]** 只是众多获准专利中的一个例子，后面还马上列了另一个完全不同的做法。选项却把其中一个例子提成了“最近引起关注”的原因。\n\n**一个专利例子里出现了资产配置，能不能说明整类专利最近就是因为这种联系而受关注？**\n\n不能。它只是第1段用来说明business methods范围很广的一个例子，近期变化仍在第2段。\n\n要选B，原文还得说法院此次动作由资产配置问题触发；文章没有写这种因果。\n\n**第一轮判断：B排除。**","html":"<h3>B. their connection with asset allocation</h3>\n<blockquote>\n<p>它们与资产配置之间的联系</p>\n</blockquote>\n<p>把B接回题干，它说的是：商业方法专利最近引起关注，是因为它们与资产配置有关。</p>\n<p>B里的<code>asset allocation</code>很眼熟，刚才精读第1段时好像见过Merrill Lynch的例子，所以先把那句话放回来。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>Merrill Lynch got legal protection for an asset <span class=\"mask\">[xxx]</span> strategy.</p>\n</blockquote>\n<p>One inventor patented a <span class=\"mask\">[xxx]</span> for <span class=\"mask\">[xxx]</span> a box.</p>\n<p>原文说资产 <span class=\"mask\">[xxx]</span> 只是众多获准专利中的一个例子，后面还马上列了另一个完全不同的做法。选项却把其中一个例子提成了“最近引起关注”的原因。</p>\n<p><strong>一个专利例子里出现了资产配置，能不能说明整类专利最近就是因为这种联系而受关注？</strong></p>\n<p>不能。它只是第1段用来说明business methods范围很广的一个例子，近期变化仍在第2段。</p>\n<p>要选B，原文还得说法院此次动作由资产配置问题触发；文章没有写这种因果。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[150,285,1500,290]],"questionRects":[[135,170,1530,410]],"meta":{"kind":"option","qid":"26","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"26题","raw":"### C. the possible restriction on their granting\n\n> 它们的授予可能受到限制\n\n把C接回题干，它说的是：商业方法专利最近引起关注，是因为今后授予这类专利可能会受到限制。\n\nC里的`possible restriction`没有照抄原文，不过刚才精读时好像连续看到`scale back`、`broad review`和`eliminate an entire class`，先把这几处接起来。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> the nation’s top patent court **[xxx]** completely ready to scale back on business-method patents\n>\nIt “has the **[xxx]** to eliminate an entire class of patents.”\n\n原文说法院准备缩减这类专利，还可能消除整个一类专利。选项说的是“授予可能受限”。虽然`granting`不是原句复现，但如果一整类专利被缩减甚至取消，今后能获得这类专利的范围自然会受到影响。\n\n**法院准备缩减并可能消除整个一类专利，能不能支持“这类专利的授予可能受限”？**\n\n能。原文给出的正是一个尚未落地、但可能大幅收缩授予范围的新动作。\n\n到这里，第2段的近期动作、可能性和限制方向都能和C接上，不需要替任何遮挡词补意思。\n\n**第一轮判断：C保留。**","html":"<h3>C. the possible restriction on their granting</h3>\n<blockquote>\n<p>它们的授予可能受到限制</p>\n</blockquote>\n<p>把C接回题干，它说的是：商业方法专利最近引起关注，是因为今后授予这类专利可能会受到限制。</p>\n<p>C里的<code>possible restriction</code>没有照抄原文，不过刚才精读时好像连续看到<code>scale back</code>、<code>broad review</code>和<code>eliminate an entire class</code>，先把这几处接起来。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>the nation’s top patent court <span class=\"mask\">[xxx]</span> completely ready to scale back on business-method patents</p>\n</blockquote>\n<p>It “has the <span class=\"mask\">[xxx]</span> to eliminate an entire class of patents.”</p>\n<p>原文说法院准备缩减这类专利，还可能消除整个一类专利。选项说的是“授予可能受限”。虽然<code>granting</code>不是原句复现，但如果一整类专利被缩减甚至取消，今后能获得这类专利的范围自然会受到影响。</p>\n<p><strong>法院准备缩减并可能消除整个一类专利，能不能支持“这类专利的授予可能受限”？</strong></p>\n<p>能。原文给出的正是一个尚未落地、但可能大幅收缩授予范围的新动作。</p>\n<p>到这里，第2段的近期动作、可能性和限制方向都能和C接上，不需要替任何遮挡词补意思。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[150,555,1500,410]],"questionRects":[[135,170,1530,410]],"meta":{"kind":"option","qid":"26","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"26题","raw":"### D. the controversy over their authorization\n\n> 围绕这类专利获准问题的争议\n\n把D接回题干，它说的是：商业方法专利最近引起关注，是因为围绕它们获准的问题存在争议。\n\nD里的`controversy`和`authorized`看着都很眼熟，刚才精读时好像在第2段同一句里见过，但还要看它们对应的是“最近”还是更早以前。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> business-method patents, which have been controversial ever since they were first authorized 10 years ago\n>\nNow the nation’s top patent court **[xxx]** completely ready to scale back on business-method patents\n\n原文确实说这类专利自十年前首次获准以来一直有争议。可题干问的是它们“最近”为什么引起关注；紧跟着写出的近期新情况，是法院现在准备缩减并审查。D把长期背景当成了这次新闻点。\n\n**“十年来一直有争议”和“最近因为法院可能收缩而受关注”，是不是同一个时间层面的原因？**\n\n不是。前者是旧背景，后者才是文章当前要报道的新变化。\n\n要选D，题干至少应问这类专利长期为何有争议；现在的`recently`把判断拉回法院的新动作。\n\n**第一轮判断：D排除。**","html":"<h3>D. the controversy over their authorization</h3>\n<blockquote>\n<p>围绕这类专利获准问题的争议</p>\n</blockquote>\n<p>把D接回题干，它说的是：商业方法专利最近引起关注，是因为围绕它们获准的问题存在争议。</p>\n<p>D里的<code>controversy</code>和<code>authorized</code>看着都很眼熟，刚才精读时好像在第2段同一句里见过，但还要看它们对应的是“最近”还是更早以前。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>business-method patents, which have been controversial ever since they were first authorized 10 years ago</p>\n</blockquote>\n<p>Now the nation’s top patent court <span class=\"mask\">[xxx]</span> completely ready to scale back on business-method patents</p>\n<p>原文确实说这类专利自十年前首次获准以来一直有争议。可题干问的是它们“最近”为什么引起关注；紧跟着写出的近期新情况，是法院现在准备缩减并审查。D把长期背景当成了这次新闻点。</p>\n<p><strong>“十年来一直有争议”和“最近因为法院可能收缩而受关注”，是不是同一个时间层面的原因？</strong></p>\n<p>不是。前者是旧背景，后者才是文章当前要报道的新变化。</p>\n<p>要选D，题干至少应问这类专利长期为何有争议；现在的<code>recently</code>把判断拉回法院的新动作。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[150,555,1500,410]],"questionRects":[[135,170,1530,410]],"meta":{"kind":"option","qid":"26","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"26题","raw":"### 26题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除。\n\n第2段写出的近期变化是法院准备缩减、广泛审查，甚至可能消除整个一类专利。第一轮可以确定C。","html":"<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>第2段写出的近期变化是法院准备缩减、广泛审查，甚至可能消除整个一类专利。第一轮可以确定C。</p>\n","articleRects":[[150,555,1500,410]],"questionRects":[[135,170,1530,410]],"meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> Which of the following is true of the Bilski case?  \n> 关于Bilski案，下面哪项说法正确？\n\n题干点名`Bilski case`。粗读时好像第二段第一次说这个案子“很大”，第四段又专门写它会由全部十二名法官处理。进入A以前先把这两处放在一起，看看这个案子已经发生了什么、还可能带来什么。\n\n> 原文参考：\n>\n> Now the nation’s top patent court **[xxx]** completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers **[xxx]**, the U.S. Court of Appeals for the Federal Circuit said it would use a **[xxx]** case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is “a very big deal,” says Dennis D. Crouch of the University of Missouri School of Law. It “has the **[xxx]** to eliminate an entire class of patents.”\n>\n> The Bilski case involves a **[xxx]** patent on a method for **[xxx]** risk in the energy market. The Federal Circuit issued an **[xxx]** order stating that the case would be heard by all 12 of the court’s judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling.\n>\n> 开始精读：\n>\n> Now the nation’s top patent court / **[xxx]** completely ready / to scale back on business-method patents, / which have been controversial / ever since they were first authorized 10 years ago. / In a move / that has intellectual-property lawyers **[xxx]**, / the U.S. Court of Appeals for the Federal Circuit said / it would use a **[xxx]** case / to conduct a broad review / of business-method patents. / In re Bilski, / as the case is known, / is “a very big deal,” / says Dennis D. Crouch / of the University of Missouri School of Law. / It “has the **[xxx]** / to eliminate an entire class / of patents.”\n>\n> The Bilski case involves / a **[xxx]** patent / on a method for **[xxx]** risk / in the energy market. / The Federal Circuit issued an **[xxx]** order / stating that the case would be heard / by all 12 of the court’s judges, / rather than a typical panel of three, / and that one issue / it wants to evaluate / is whether it should “reconsider” / its State Street Bank ruling.\n>\n> 现在这个国家最高的专利法院 / **[xxx]** 已经完全准备好 / 缩减商业方法专利，/ 这类专利一直有争议 / 自从十年前首次获准以来。/ 一个举动使知识产权律师们 **[xxx]**：/ 美国联邦巡回上诉法院说 / 它将使用一个 **[xxx]** 案件 / 对商业方法专利作广泛审查。/ 这个案件叫In re Bilski，/ 被称为“一件非常大的事”。/ 它“有 **[xxx]** / 消除整个一类 / 专利”。\n>\n> Bilski案涉及 / 一项 **[xxx]** 专利 / 关于一种 **[xxx]** 风险的方法 / 在能源市场中。/ 联邦巡回法院发布了一项 **[xxx]** 命令 / 说明该案将被审理 / 由法院全部十二名法官，/ 而不是通常的三人小组，/ 并且有一个问题 / 它想评估 / 就是是否应该“重新考虑” / State Street Bank决定。\n\n到这里先别把`a very big deal`理解成“交易很大”。第2段说的是案件影响可能很大；第4段写的是审理阵容异常，并且法院要考虑是否推翻自己以前的做法。题干问“哪项是真的”，所以每个选项都要和这两处事实逐项对上。\n\n接下来按A—D逐项看。","html":"<h2>27题</h2>\n<blockquote>\n<p>Which of the following is true of the Bilski case?<br />\n关于Bilski案，下面哪项说法正确？</p>\n</blockquote>\n<p>题干点名<code>Bilski case</code>。粗读时好像第二段第一次说这个案子“很大”，第四段又专门写它会由全部十二名法官处理。进入A以前先把这两处放在一起，看看这个案子已经发生了什么、还可能带来什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Now the nation’s top patent court <span class=\"mask\">[xxx]</span> completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers <span class=\"mask\">[xxx]</span>, the U.S. Court of Appeals for the Federal Circuit said it would use a <span class=\"mask\">[xxx]</span> case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is “a very big deal,” says Dennis D. Crouch of the University of Missouri School of Law. It “has the <span class=\"mask\">[xxx]</span> to eliminate an entire class of patents.”</p>\n<p>The Bilski case involves a <span class=\"mask\">[xxx]</span> patent on a method for <span class=\"mask\">[xxx]</span> risk in the energy market. The Federal Circuit issued an <span class=\"mask\">[xxx]</span> order stating that the case would be heard by all 12 of the court’s judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling.</p>\n<p>开始精读：</p>\n<p>Now the nation’s top patent court / <span class=\"mask\">[xxx]</span> completely ready / to scale back on business-method patents, / which have been controversial / ever since they were first authorized 10 years ago. / In a move / that has intellectual-property lawyers <span class=\"mask\">[xxx]</span>, / the U.S. Court of Appeals for the Federal Circuit said / it would use a <span class=\"mask\">[xxx]</span> case / to conduct a broad review / of business-method patents. / In re Bilski, / as the case is known, / is “a very big deal,” / says Dennis D. Crouch / of the University of Missouri School of Law. / It “has the <span class=\"mask\">[xxx]</span> / to eliminate an entire class / of patents.”</p>\n<p>The Bilski case involves / a <span class=\"mask\">[xxx]</span> patent / on a method for <span class=\"mask\">[xxx]</span> risk / in the energy market. / The Federal Circuit issued an <span class=\"mask\">[xxx]</span> order / stating that the case would be heard / by all 12 of the court’s judges, / rather than a typical panel of three, / and that one issue / it wants to evaluate / is whether it should “reconsider” / its State Street Bank ruling.</p>\n<p>现在这个国家最高的专利法院 / <span class=\"mask\">[xxx]</span> 已经完全准备好 / 缩减商业方法专利，/ 这类专利一直有争议 / 自从十年前首次获准以来。/ 一个举动使知识产权律师们 <span class=\"mask\">[xxx]</span>：/ 美国联邦巡回上诉法院说 / 它将使用一个 <span class=\"mask\">[xxx]</span> 案件 / 对商业方法专利作广泛审查。/ 这个案件叫In re Bilski，/ 被称为“一件非常大的事”。/ 它“有 <span class=\"mask\">[xxx]</span> / 消除整个一类 / 专利”。</p>\n<p>Bilski案涉及 / 一项 <span class=\"mask\">[xxx]</span> 专利 / 关于一种 <span class=\"mask\">[xxx]</span> 风险的方法 / 在能源市场中。/ 联邦巡回法院发布了一项 <span class=\"mask\">[xxx]</span> 命令 / 说明该案将被审理 / 由法院全部十二名法官，/ 而不是通常的三人小组，/ 并且有一个问题 / 它想评估 / 就是是否应该“重新考虑” / State Street Bank决定。</p>\n</blockquote>\n<p>到这里先别把<code>a very big deal</code>理解成“交易很大”。第2段说的是案件影响可能很大；第4段写的是审理阵容异常，并且法院要考虑是否推翻自己以前的做法。题干问“哪项是真的”，所以每个选项都要和这两处事实逐项对上。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[150,555,1500,410],[150,1570,1500,315]],"questionRects":[[135,590,1530,405]],"meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. Its ruling complies with the court decisions.\n\n> 它的裁决符合这些法院决定\n\n把A接回题干，它说的是：Bilski案已经作出的裁决与其他法院决定相一致。\n\nA里的`ruling`让人好像想起第四段的`State Street Bank ruling`，但题干问的是Bilski案本身，先看这个案子现在有没有已经作出的裁决。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> the case would be heard by all 12 of the court’s judges\n>\none issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling\n\n原文说案件将由全部十二名法官审理，还要评估是否重新考虑旧决定。选项却先假定Bilski案已经有了一个`ruling`，并且这个裁决符合其他决定。文章写的是待审和待评估，不是已裁决。\n\n**原文是在汇报一个已经完成并且相互一致的裁决，还是在说案件即将被重新审视？**\n\n后者。Bilski案的审理和对旧决定的重新考虑都还在进行方向上。\n\n要选A，原文还得给出Bilski案已经形成的裁决及其与其他决定的一致关系；这里没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. Its ruling complies with the court decisions.</h3>\n<blockquote>\n<p>它的裁决符合这些法院决定</p>\n</blockquote>\n<p>把A接回题干，它说的是：Bilski案已经作出的裁决与其他法院决定相一致。</p>\n<p>A里的<code>ruling</code>让人好像想起第四段的<code>State Street Bank ruling</code>，但题干问的是Bilski案本身，先看这个案子现在有没有已经作出的裁决。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>the case would be heard by all 12 of the court’s judges</p>\n</blockquote>\n<p>one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling</p>\n<p>原文说案件将由全部十二名法官审理，还要评估是否重新考虑旧决定。选项却先假定Bilski案已经有了一个<code>ruling</code>，并且这个裁决符合其他决定。文章写的是待审和待评估，不是已裁决。</p>\n<p><strong>原文是在汇报一个已经完成并且相互一致的裁决，还是在说案件即将被重新审视？</strong></p>\n<p>后者。Bilski案的审理和对旧决定的重新考虑都还在进行方向上。</p>\n<p>要选A，原文还得给出Bilski案已经形成的裁决及其与其他决定的一致关系；这里没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[150,555,1500,410],[150,1570,1500,315]],"questionRects":[[135,590,1530,405]],"meta":{"kind":"option","qid":"27","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P2","T2-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"27题","raw":"### B. It involves a very big business transaction.\n\n> 它涉及一笔非常大的商业交易\n\n把B接回题干，它说的是：Bilski案涉及一笔规模非常大的商业交易。\n\nB里的`very big`看着很眼熟，刚才精读第二段时好像见过`a very big deal`，所以先把这个短语放回完整句子，而不是只看表面词。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> In re Bilski, as the case is known, is “a very big deal,” says Dennis D. Crouch.\n>\nThe Bilski case involves a **[xxx]** patent on a method for **[xxx]** risk in the energy market.\n\n原文中的`a very big deal`是法学教授对案件重要性的评价；下一段具体写它涉及一种能源市场中的专利方法。选项把`deal`改成了`business transaction`，说成交易规模很大。\n\n**“这个案子影响很大”和“这个案子涉及一笔很大的商业交易”能不能直接画等号？**\n\n不能。前者说案件分量，后者说交易规模，原文没有那笔“大交易”。\n\n要选B，第四段还得出现交易金额、交易双方或交易规模；文章没有这些内容。\n\n**第一轮判断：B排除。**","html":"<h3>B. It involves a very big business transaction.</h3>\n<blockquote>\n<p>它涉及一笔非常大的商业交易</p>\n</blockquote>\n<p>把B接回题干，它说的是：Bilski案涉及一笔规模非常大的商业交易。</p>\n<p>B里的<code>very big</code>看着很眼熟，刚才精读第二段时好像见过<code>a very big deal</code>，所以先把这个短语放回完整句子，而不是只看表面词。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is “a very big deal,” says Dennis D. Crouch.</p>\n</blockquote>\n<p>The Bilski case involves a <span class=\"mask\">[xxx]</span> patent on a method for <span class=\"mask\">[xxx]</span> risk in the energy market.</p>\n<p>原文中的<code>a very big deal</code>是法学教授对案件重要性的评价；下一段具体写它涉及一种能源市场中的专利方法。选项把<code>deal</code>改成了<code>business transaction</code>，说成交易规模很大。</p>\n<p><strong>“这个案子影响很大”和“这个案子涉及一笔很大的商业交易”能不能直接画等号？</strong></p>\n<p>不能。前者说案件分量，后者说交易规模，原文没有那笔“大交易”。</p>\n<p>要选B，第四段还得出现交易金额、交易双方或交易规模；文章没有这些内容。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[150,555,1500,410],[150,1570,1500,315]],"questionRects":[[135,590,1530,405]],"meta":{"kind":"option","qid":"27","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P2","T2-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"27题","raw":"### C. It has been dismissed by the Federal Circuit.\n\n> 它已被联邦巡回法院驳回\n\n把C接回题干，它说的是：Bilski案已经被联邦巡回法院驳回。\n\nC里的`Federal Circuit`当然眼熟，但`dismissed`好像没有在刚才的精读里出现。我们先看法院对这个案子实际做了什么。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> The Federal Circuit issued an **[xxx]** order stating that the case would be heard by all 12 of the court’s judges\n>\none issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling\n\n原文说法院发布命令，让全部十二名法官来审理，并准备评估一个重要问题。选项却说案件已经被驳回。继续审理和直接驳回在动作方向上完全不同。\n\n**法院既然安排全部十二名法官审理，还能不能同时说它已经把案件驳回了？**\n\n不能。原文明确写的是将被审理，而不是结束审理。\n\n要选C，原文至少应出现案件被拒绝受理或已经终结；现在看到的是相反动作。\n\n**第一轮判断：C排除。**","html":"<h3>C. It has been dismissed by the Federal Circuit.</h3>\n<blockquote>\n<p>它已被联邦巡回法院驳回</p>\n</blockquote>\n<p>把C接回题干，它说的是：Bilski案已经被联邦巡回法院驳回。</p>\n<p>C里的<code>Federal Circuit</code>当然眼熟，但<code>dismissed</code>好像没有在刚才的精读里出现。我们先看法院对这个案子实际做了什么。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>The Federal Circuit issued an <span class=\"mask\">[xxx]</span> order stating that the case would be heard by all 12 of the court’s judges</p>\n</blockquote>\n<p>one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling</p>\n<p>原文说法院发布命令，让全部十二名法官来审理，并准备评估一个重要问题。选项却说案件已经被驳回。继续审理和直接驳回在动作方向上完全不同。</p>\n<p><strong>法院既然安排全部十二名法官审理，还能不能同时说它已经把案件驳回了？</strong></p>\n<p>不能。原文明确写的是将被审理，而不是结束审理。</p>\n<p>要选C，原文至少应出现案件被拒绝受理或已经终结；现在看到的是相反动作。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[150,1570,1500,315]],"questionRects":[[135,590,1530,405]],"meta":{"kind":"option","qid":"27","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"27题","raw":"### D. It may change the **[xxx]** practices in the U.S.\n\n> 它可能改变美国的 **[xxx]** 实践\n\n把D接回题干，它说的是：Bilski案可能改变美国某一类 **[xxx]** 实践。\n\nD里的核心修饰词被挡住了，但`may change ... practices`让人隐约想起刚才两处都在写“重新考虑原来的做法”，先看这种变化到底有多大。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> It “has the **[xxx]** to eliminate an entire class of patents.”\n>\none issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling\n\n原文说这个案子可能消除整个一类专利，还可能让法院重新考虑自己过去建立的做法。选项没有要求我们翻出被挡住的词，只要判断“可能改变一套实践”是否与这两层影响相符。\n\n**如果一个案件可能取消整类专利并重审旧决定，能不能说它可能改变相关实践？**\n\n能。`may`保留了尚未裁决的不确定性，`change ... practices`也接住了重新考虑旧做法的后果。\n\n到这里，案件的潜在影响、变化方向和不确定语气都与D一致；遮挡词不需要自行补义。\n\n**第一轮判断：D保留。**","html":"<h3>D. It may change the <span class=\"mask\">[xxx]</span> practices in the U.S.</h3>\n<blockquote>\n<p>它可能改变美国的 <span class=\"mask\">[xxx]</span> 实践</p>\n</blockquote>\n<p>把D接回题干，它说的是：Bilski案可能改变美国某一类 <span class=\"mask\">[xxx]</span> 实践。</p>\n<p>D里的核心修饰词被挡住了，但<code>may change ... practices</code>让人隐约想起刚才两处都在写“重新考虑原来的做法”，先看这种变化到底有多大。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>It “has the <span class=\"mask\">[xxx]</span> to eliminate an entire class of patents.”</p>\n</blockquote>\n<p>one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling</p>\n<p>原文说这个案子可能消除整个一类专利，还可能让法院重新考虑自己过去建立的做法。选项没有要求我们翻出被挡住的词，只要判断“可能改变一套实践”是否与这两层影响相符。</p>\n<p><strong>如果一个案件可能取消整类专利并重审旧决定，能不能说它可能改变相关实践？</strong></p>\n<p>能。<code>may</code>保留了尚未裁决的不确定性，<code>change ... practices</code>也接住了重新考虑旧做法的后果。</p>\n<p>到这里，案件的潜在影响、变化方向和不确定语气都与D一致；遮挡词不需要自行补义。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[150,555,1500,410],[150,1570,1500,315]],"questionRects":[[135,590,1530,405]],"meta":{"kind":"option","qid":"27","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P2","T2-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"27题","raw":"### 27题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留。\n\n案件还没有形成A所说的裁决，也没有被驳回；“very big deal”说的是影响，不是大交易。第2、4段共同支持D。","html":"<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>案件还没有形成A所说的裁决，也没有被驳回；“very big deal”说的是影响，不是大交易。第2、4段共同支持D。</p>\n","articleRects":[[150,555,1500,410],[150,1570,1500,315]],"questionRects":[[135,590,1530,405]],"meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> The word “about-face” (Line 1, Para. 3) most probably means ______.  \n> 第3段第1行的“about-face”最可能是什么意思？\n\n题干直接给了第3段第1行。粗读时好像第三段先说一种`Curbs`会是`about-face`，随后马上用`because`回看联邦巡回法院以前做过什么。猜词时不单猜词形，先把前后因果读完整。\n\n> 原文参考：\n>\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of **[xxx]** mutual-fund assets. That ruling produced an **[xxx]** in business-method patent filings, initially by **[xxx]** Internet companies trying to stake out **[xxx]** rights to specific types of online transactions. Later, more established companies raced to add such patents to their files, if only as a **[xxx]** move against rivals that might beat them to the punch. In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.\n>\n> 开始精读：\n>\n> Curbs on business-method claims / would be a dramatic about-face, / because it was the Federal Circuit itself / that introduced such patents / with its 1998 decision / in the so-called State Street Bank case, / approving a patent / on a way of **[xxx]** mutual-fund assets. / That ruling produced an **[xxx]** / in business-method patent filings, / initially by **[xxx]** Internet companies / trying to stake out **[xxx]** rights / to specific types of online transactions. / Later, more established companies raced / to add such patents to their files, / if only as a **[xxx]** move / against rivals / that might beat them to the punch. / In 2005, IBM noted in a court filing / that it had been issued / more than 300 business-method patents, / despite the fact / that it questioned the legal basis / for granting them. / Similarly, some Wall Street investment firms / armed themselves with patents / for financial products, / even as they took positions / in court cases opposing the practice.\n>\n> 对商业方法申请的遏制 / 将会是一次剧烈的about-face，/ 因为正是联邦巡回法院自己 / 引入了这类专利 / 通过它1998年的决定 / 在State Street Bank案中，/ 批准了一项专利 / 关于把共同基金资产 **[xxx]** 的一种方式。/ 那项决定造成了商业方法专利申请的一次 **[xxx]**，/ 最初由 **[xxx]** 互联网公司 / 试图圈出对特定在线交易的 **[xxx]** 权利。/ 后来更多成熟公司争相 / 把这类专利加入自己的档案，/ 哪怕只是作为一种 **[xxx]** 动作 / 对付竞争者。/ 2005年，一家公司在法庭文件中指出 / 它已被授予 / 三百多项商业方法专利，/ 尽管它质疑 / 授予这些专利的法律依据。/ 类似地，一些华尔街投资公司 / 用专利武装自己 / 针对金融产品，/ 同时又在法庭上反对这种做法。\n\n第1句本身已经给出解释：现在如果`Curbs`出现，会构成`about-face`，因为当初正是同一个法院引入了这类专利。也就是“以前推动，现在可能收回来”。后面整段只是继续说明以前这套做法扩得有多大。\n\n接下来按A—D逐项看。","html":"<h2>28题</h2>\n<blockquote>\n<p>The word “about-face” (Line 1, Para. 3) most probably means ______.<br />\n第3段第1行的“about-face”最可能是什么意思？</p>\n</blockquote>\n<p>题干直接给了第3段第1行。粗读时好像第三段先说一种<code>Curbs</code>会是<code>about-face</code>，随后马上用<code>because</code>回看联邦巡回法院以前做过什么。猜词时不单猜词形，先把前后因果读完整。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of <span class=\"mask\">[xxx]</span> mutual-fund assets. That ruling produced an <span class=\"mask\">[xxx]</span> in business-method patent filings, initially by <span class=\"mask\">[xxx]</span> Internet companies trying to stake out <span class=\"mask\">[xxx]</span> rights to specific types of online transactions. Later, more established companies raced to add such patents to their files, if only as a <span class=\"mask\">[xxx]</span> move against rivals that might beat them to the punch. In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.</p>\n<p>开始精读：</p>\n<p>Curbs on business-method claims / would be a dramatic about-face, / because it was the Federal Circuit itself / that introduced such patents / with its 1998 decision / in the so-called State Street Bank case, / approving a patent / on a way of <span class=\"mask\">[xxx]</span> mutual-fund assets. / That ruling produced an <span class=\"mask\">[xxx]</span> / in business-method patent filings, / initially by <span class=\"mask\">[xxx]</span> Internet companies / trying to stake out <span class=\"mask\">[xxx]</span> rights / to specific types of online transactions. / Later, more established companies raced / to add such patents to their files, / if only as a <span class=\"mask\">[xxx]</span> move / against rivals / that might beat them to the punch. / In 2005, IBM noted in a court filing / that it had been issued / more than 300 business-method patents, / despite the fact / that it questioned the legal basis / for granting them. / Similarly, some Wall Street investment firms / armed themselves with patents / for financial products, / even as they took positions / in court cases opposing the practice.</p>\n<p>对商业方法申请的遏制 / 将会是一次剧烈的about-face，/ 因为正是联邦巡回法院自己 / 引入了这类专利 / 通过它1998年的决定 / 在State Street Bank案中，/ 批准了一项专利 / 关于把共同基金资产 <span class=\"mask\">[xxx]</span> 的一种方式。/ 那项决定造成了商业方法专利申请的一次 <span class=\"mask\">[xxx]</span>，/ 最初由 <span class=\"mask\">[xxx]</span> 互联网公司 / 试图圈出对特定在线交易的 <span class=\"mask\">[xxx]</span> 权利。/ 后来更多成熟公司争相 / 把这类专利加入自己的档案，/ 哪怕只是作为一种 <span class=\"mask\">[xxx]</span> 动作 / 对付竞争者。/ 2005年，一家公司在法庭文件中指出 / 它已被授予 / 三百多项商业方法专利，/ 尽管它质疑 / 授予这些专利的法律依据。/ 类似地，一些华尔街投资公司 / 用专利武装自己 / 针对金融产品，/ 同时又在法庭上反对这种做法。</p>\n</blockquote>\n<p>第1句本身已经给出解释：现在如果<code>Curbs</code>出现，会构成<code>about-face</code>，因为当初正是同一个法院引入了这类专利。也就是“以前推动，现在可能收回来”。后面整段只是继续说明以前这套做法扩得有多大。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[150,930,1500,665]],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. loss of goodwill\n\n> 失去善意或信誉\n\n把A接回题干，它说的是：`about-face`表示善意或信誉的丧失。\n\nA里的`loss`好像能表达一种变坏，但刚才精读的解释句并没有谈谁的好感或信誉，而是在对比同一个法院前后的动作。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> Curbs on business-method claims would be a dramatic about-face,\n>\nbecause it was the Federal Circuit itself that introduced such patents\n\n原文说的是：现在要遏制，而以前正是它引入。选项说的是：善意或信誉减少。两者谈的关系不同。\n\n**前后动作从“引入”变成“遏制”，需要的是方向反转，还是信誉损失？**\n\n前者。句中没有`goodwill`对应的人际评价，也没有谁失去信誉。\n\n要选A，前后文还得写某个主体原来受信任、后来失去好感；这条线不存在。\n\n**第一轮判断：A排除。**","html":"<h3>A. loss of goodwill</h3>\n<blockquote>\n<p>失去善意或信誉</p>\n</blockquote>\n<p>把A接回题干，它说的是：<code>about-face</code>表示善意或信誉的丧失。</p>\n<p>A里的<code>loss</code>好像能表达一种变坏，但刚才精读的解释句并没有谈谁的好感或信誉，而是在对比同一个法院前后的动作。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n</blockquote>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n<p>原文说的是：现在要遏制，而以前正是它引入。选项说的是：善意或信誉减少。两者谈的关系不同。</p>\n<p><strong>前后动作从“引入”变成“遏制”，需要的是方向反转，还是信誉损失？</strong></p>\n<p>前者。句中没有<code>goodwill</code>对应的人际评价，也没有谁失去信誉。</p>\n<p>要选A，前后文还得写某个主体原来受信任、后来失去好感；这条线不存在。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[150,930,1500,665]],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"option","qid":"28","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"28题","raw":"### B. increase of **[xxx]**\n\n> **[xxx]** 的增加\n\n把B接回题干，它说的是：`about-face`表示某种 **[xxx]** 在增加。\n\nB里的核心名词被挡住了，不过`increase of`是可见的。刚才精读时好像不是在写某种东西越来越多，而是在把“以前引入”和“现在遏制”对照。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> Curbs on business-method claims would be a dramatic about-face,\n>\nbecause it was the Federal Circuit itself that introduced such patents\n\n原文的可见结构是两个相反动作：`introduced`与`Curbs`。B的可见结构则是“某种东西增加”。即使不补 **[xxx]** 的意思，`increase`也没有把前后反转关系说出来。\n\n**只知道某种量增加，能不能表达同一个主体从原来的做法转到相反做法？**\n\n不能。数量增加和方向掉头是两种不同关系。\n\n要选B，被挡住的名词还得让整个`increase of ...`等于“前后做法反转”；可见结构已经不支持。\n\n**第一轮判断：B排除。**","html":"<h3>B. increase of <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的增加</p>\n</blockquote>\n<p>把B接回题干，它说的是：<code>about-face</code>表示某种 <span class=\"mask\">[xxx]</span> 在增加。</p>\n<p>B里的核心名词被挡住了，不过<code>increase of</code>是可见的。刚才精读时好像不是在写某种东西越来越多，而是在把“以前引入”和“现在遏制”对照。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n</blockquote>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n<p>原文的可见结构是两个相反动作：<code>introduced</code>与<code>Curbs</code>。B的可见结构则是“某种东西增加”。即使不补 <span class=\"mask\">[xxx]</span> 的意思，<code>increase</code>也没有把前后反转关系说出来。</p>\n<p><strong>只知道某种量增加，能不能表达同一个主体从原来的做法转到相反做法？</strong></p>\n<p>不能。数量增加和方向掉头是两种不同关系。</p>\n<p>要选B，被挡住的名词还得让整个<code>increase of ...</code>等于“前后做法反转”；可见结构已经不支持。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[150,930,1500,665]],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"option","qid":"28","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"28题","raw":"### C. change of attitude\n\n> 态度或立场的改变\n\n把C接回题干，它说的是：`about-face`表示态度或立场发生改变。\n\nC没有照抄`introduced`或`Curbs`，但刚才精读时好像正看到同一个法院前后站到了相反方向，先把两头再对一下。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> the Federal Circuit itself ... introduced such patents\n>\nCurbs on business-method claims would be a dramatic about-face\n\n原文说以前由它引入，现在若限制就会形成`about-face`。选项说立场改变，正好概括了同一主体前后动作相反。\n\n**从“亲自引入”转到“准备遏制”，能不能叫作立场改变？**\n\n能。这里的解释句把这个变化直接写出来了。\n\nC既抓住同一主体，也抓住前后反向，不需要依赖后面那些专利申请细节。\n\n**第一轮判断：C保留。**","html":"<h3>C. change of attitude</h3>\n<blockquote>\n<p>态度或立场的改变</p>\n</blockquote>\n<p>把C接回题干，它说的是：<code>about-face</code>表示态度或立场发生改变。</p>\n<p>C没有照抄<code>introduced</code>或<code>Curbs</code>，但刚才精读时好像正看到同一个法院前后站到了相反方向，先把两头再对一下。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>the Federal Circuit itself ... introduced such patents</p>\n</blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face</p>\n<p>原文说以前由它引入，现在若限制就会形成<code>about-face</code>。选项说立场改变，正好概括了同一主体前后动作相反。</p>\n<p><strong>从“亲自引入”转到“准备遏制”，能不能叫作立场改变？</strong></p>\n<p>能。这里的解释句把这个变化直接写出来了。</p>\n<p>C既抓住同一主体，也抓住前后反向，不需要依赖后面那些专利申请细节。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[150,930,1500,665]],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"option","qid":"28","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"28题","raw":"### D. enhancement of dignity\n\n> 尊严或地位的提升\n\n把D接回题干，它说的是：`about-face`表示尊严或地位得到提升。\n\nD里的`enhancement`也是一种变好，好像和`dramatic`的强烈语气能沾边，但刚才精读的因果仍然只写前后做法。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> Curbs on business-method claims would be a dramatic about-face,\n>\nbecause it was the Federal Circuit itself that introduced such patents\n\n原文没有写法院地位变高，也没有谈尊严。`dramatic`只说明转变幅度大，不能自动给这个转变加上正面评价。\n\n**“变化很大”能不能直接等于“尊严得到提升”？**\n\n不能。一个是幅度，一个是评价对象，原文没有后者。\n\n要选D，句子还得出现地位、尊重或荣誉的上升；这里完全没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. enhancement of dignity</h3>\n<blockquote>\n<p>尊严或地位的提升</p>\n</blockquote>\n<p>把D接回题干，它说的是：<code>about-face</code>表示尊严或地位得到提升。</p>\n<p>D里的<code>enhancement</code>也是一种变好，好像和<code>dramatic</code>的强烈语气能沾边，但刚才精读的因果仍然只写前后做法。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n</blockquote>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n<p>原文没有写法院地位变高，也没有谈尊严。<code>dramatic</code>只说明转变幅度大，不能自动给这个转变加上正面评价。</p>\n<p><strong>“变化很大”能不能直接等于“尊严得到提升”？</strong></p>\n<p>不能。一个是幅度，一个是评价对象，原文没有后者。</p>\n<p>要选D，句子还得出现地位、尊重或荣誉的上升；这里完全没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[150,930,1500,665]],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"option","qid":"28","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"28题","raw":"### 28题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除。\n\n`because`后面直接给出同一法院“以前引入、现在可能遏制”的前后反转，所以C可以确定。","html":"<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p><code>because</code>后面直接给出同一法院“以前引入、现在可能遏制”的前后反转，所以C可以确定。</p>\n","articleRects":[[150,930,1500,665]],"questionRects":[[135,1025,1530,385]],"meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> We learn from the last two paragraphs that business-method patents ______.  \n> 从最后两段可以知道，商业方法专利怎么样？\n\n题干把范围限定在最后两段。粗读时好像第四段写法院要重新考虑旧决定，第五段又写最高法院已经缩小保护范围，还觉得有太多明显的“发明”被维持。进入A以前把这两段一起读完。\n\n> 原文参考：\n>\n> The Bilski case involves a **[xxx]** patent on a method for **[xxx]** risk in the energy market. The Federal Circuit issued an **[xxx]** order stating that the case would be heard by all 12 of the court’s judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling.\n>\n> The Federal Circuit’s action comes in the **[xxx]** of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders. Last April, for example, the justices **[xxx]** that too many patents were being upheld for “inventions” that are obvious. The judges on the Federal Circuit are “**[xxx]** to the anti-patent trend at the Supreme Court,” says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.\n>\n> 开始精读：\n>\n> The Bilski case involves / a **[xxx]** patent / on a method for **[xxx]** risk / in the energy market. / The Federal Circuit issued an **[xxx]** order / stating that the case would be heard / by all 12 of the court’s judges, / rather than a typical panel of three, / and that one issue / it wants to evaluate / is whether it should “reconsider” / its State Street Bank ruling.\n>\n> The Federal Circuit’s action comes / in the **[xxx]** of a series of recent decisions / by the Supreme Court / that has narrowed the scope of protections / for patent holders. / Last April, for example, / the justices **[xxx]** / that too many patents were being upheld / for “inventions” / that are obvious. / The judges on the Federal Circuit / are “**[xxx]** to the anti-patent trend / at the Supreme Court,” / says Harold C. Wegner, / a patent attorney and professor / at George Washington University Law School.\n>\n> Bilski案涉及 / 一项 **[xxx]** 专利 / 关于一种 **[xxx]** 风险的方法 / 在能源市场中。/ 联邦巡回法院发布一项 **[xxx]** 命令 / 说明该案将被 / 全部十二名法官审理，/ 而不是通常三人小组，/ 并且有一个问题 / 它想评估 / 就是是否应该重新考虑 / State Street Bank决定。\n>\n> 联邦巡回法院此举出现 / 在一系列近期决定的 **[xxx]** 中 / 由最高法院作出，/ 这些决定缩小了保护范围 / 对专利持有人。/ 去年四月，例如，/ 法官们 **[xxx]** / 太多专利正在被维持 / 针对那些很明显的“发明”。/ 联邦巡回法院的法官们 / 正在对最高法院的反专利动向作 **[xxx]**，/ 一位专利律师兼教授说。\n\n两段共同方向很清楚：旧决定要被重新考虑，最高法院又在缩小保护，并且认为太多明显的“发明”仍拿着专利。题干问从最后两段能知道什么，所以选项要概括这条共同方向，不能只抓能源市场里的`risk`。\n\n接下来按A—D逐项看。","html":"<h2>29题</h2>\n<blockquote>\n<p>We learn from the last two paragraphs that business-method patents ______.<br />\n从最后两段可以知道，商业方法专利怎么样？</p>\n</blockquote>\n<p>题干把范围限定在最后两段。粗读时好像第四段写法院要重新考虑旧决定，第五段又写最高法院已经缩小保护范围，还觉得有太多明显的“发明”被维持。进入A以前把这两段一起读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The Bilski case involves a <span class=\"mask\">[xxx]</span> patent on a method for <span class=\"mask\">[xxx]</span> risk in the energy market. The Federal Circuit issued an <span class=\"mask\">[xxx]</span> order stating that the case would be heard by all 12 of the court’s judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should “reconsider” its State Street Bank ruling.</p>\n<p>The Federal Circuit’s action comes in the <span class=\"mask\">[xxx]</span> of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders. Last April, for example, the justices <span class=\"mask\">[xxx]</span> that too many patents were being upheld for “inventions” that are obvious. The judges on the Federal Circuit are “<span class=\"mask\">[xxx]</span> to the anti-patent trend at the Supreme Court,” says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.</p>\n<p>开始精读：</p>\n<p>The Bilski case involves / a <span class=\"mask\">[xxx]</span> patent / on a method for <span class=\"mask\">[xxx]</span> risk / in the energy market. / The Federal Circuit issued an <span class=\"mask\">[xxx]</span> order / stating that the case would be heard / by all 12 of the court’s judges, / rather than a typical panel of three, / and that one issue / it wants to evaluate / is whether it should “reconsider” / its State Street Bank ruling.</p>\n<p>The Federal Circuit’s action comes / in the <span class=\"mask\">[xxx]</span> of a series of recent decisions / by the Supreme Court / that has narrowed the scope of protections / for patent holders. / Last April, for example, / the justices <span class=\"mask\">[xxx]</span> / that too many patents were being upheld / for “inventions” / that are obvious. / The judges on the Federal Circuit / are “<span class=\"mask\">[xxx]</span> to the anti-patent trend / at the Supreme Court,” / says Harold C. Wegner, / a patent attorney and professor / at George Washington University Law School.</p>\n<p>Bilski案涉及 / 一项 <span class=\"mask\">[xxx]</span> 专利 / 关于一种 <span class=\"mask\">[xxx]</span> 风险的方法 / 在能源市场中。/ 联邦巡回法院发布一项 <span class=\"mask\">[xxx]</span> 命令 / 说明该案将被 / 全部十二名法官审理，/ 而不是通常三人小组，/ 并且有一个问题 / 它想评估 / 就是是否应该重新考虑 / State Street Bank决定。</p>\n<p>联邦巡回法院此举出现 / 在一系列近期决定的 <span class=\"mask\">[xxx]</span> 中 / 由最高法院作出，/ 这些决定缩小了保护范围 / 对专利持有人。/ 去年四月，例如，/ 法官们 <span class=\"mask\">[xxx]</span> / 太多专利正在被维持 / 针对那些很明显的“发明”。/ 联邦巡回法院的法官们 / 正在对最高法院的反专利动向作 <span class=\"mask\">[xxx]</span>，/ 一位专利律师兼教授说。</p>\n</blockquote>\n<p>两段共同方向很清楚：旧决定要被重新考虑，最高法院又在缩小保护，并且认为太多明显的“发明”仍拿着专利。题干问从最后两段能知道什么，所以选项要概括这条共同方向，不能只抓能源市场里的<code>risk</code>。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. are immune to legal challenges\n\n> 不受法律挑战影响\n\n把A接回题干，它说的是：商业方法专利不会受到法律上的挑战。\n\nA里的`legal challenges`好像和法院、案件这些词很搭，但刚才精读时看到的恰恰是旧决定被重新考虑、保护范围被缩小。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> whether it should “reconsider” its State Street Bank ruling\n>\na series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders\n\n原文说相关做法正在被法院重新审视，专利保护也在收窄。选项说它们对法律挑战免疫，方向正好相反。\n\n**已经进入重新审理并可能缩小保护的东西，能不能叫作“不受法律挑战影响”？**\n\n不能。它们现在就在承受这种挑战。\n\n要选A，最后两段应该强调现有专利地位稳固、法院不会动它们；原文没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. are immune to legal challenges</h3>\n<blockquote>\n<p>不受法律挑战影响</p>\n</blockquote>\n<p>把A接回题干，它说的是：商业方法专利不会受到法律上的挑战。</p>\n<p>A里的<code>legal challenges</code>好像和法院、案件这些词很搭，但刚才精读时看到的恰恰是旧决定被重新考虑、保护范围被缩小。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>whether it should “reconsider” its State Street Bank ruling</p>\n</blockquote>\n<p>a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n<p>原文说相关做法正在被法院重新审视，专利保护也在收窄。选项说它们对法律挑战免疫，方向正好相反。</p>\n<p><strong>已经进入重新审理并可能缩小保护的东西，能不能叫作“不受法律挑战影响”？</strong></p>\n<p>不能。它们现在就在承受这种挑战。</p>\n<p>要选A，最后两段应该强调现有专利地位稳固、法院不会动它们；原文没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"29","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P4","T2-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"29题","raw":"### B. are often unnecessarily issued\n\n> 经常在没有必要的情况下被授予\n\n把B接回题干，它说的是：商业方法专利经常被不必要地授予。\n\nB里的`unnecessarily issued`不是原句，但刚才精读时好像看到最高法院说“太多专利”被维持给了很明显的“发明”，先看这层评价能不能接过来。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> the justices **[xxx]** that too many patents were being upheld for “inventions” that are obvious\n>\nwhether it should “reconsider” its State Street Bank ruling\n\n原文说太多专利被维持给明显的“发明”，同时旧决定还要重审。选项说有些专利本来没有必要却被授予。`too many`加`obvious`给出的就是“发得过多、门槛过低”的方向。\n\n**“太多明显的发明仍被维持为专利”，能不能支持“这些专利常有不必要的授予”？**\n\n能。选项把最后一段的数量和必要性评价压成了一句话。\n\nB没有把所有专利说成无效，只用`often`保留了范围，和最后两段能对上。\n\n**第一轮判断：B保留。**","html":"<h3>B. are often unnecessarily issued</h3>\n<blockquote>\n<p>经常在没有必要的情况下被授予</p>\n</blockquote>\n<p>把B接回题干，它说的是：商业方法专利经常被不必要地授予。</p>\n<p>B里的<code>unnecessarily issued</code>不是原句，但刚才精读时好像看到最高法院说“太多专利”被维持给了很明显的“发明”，先看这层评价能不能接过来。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>the justices <span class=\"mask\">[xxx]</span> that too many patents were being upheld for “inventions” that are obvious</p>\n</blockquote>\n<p>whether it should “reconsider” its State Street Bank ruling</p>\n<p>原文说太多专利被维持给明显的“发明”，同时旧决定还要重审。选项说有些专利本来没有必要却被授予。<code>too many</code>加<code>obvious</code>给出的就是“发得过多、门槛过低”的方向。</p>\n<p><strong>“太多明显的发明仍被维持为专利”，能不能支持“这些专利常有不必要的授予”？</strong></p>\n<p>能。选项把最后一段的数量和必要性评价压成了一句话。</p>\n<p>B没有把所有专利说成无效，只用<code>often</code>保留了范围，和最后两段能对上。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[150,1840,1500,410]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"29","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"29题","raw":"### C. lower the **[xxx]** for patent holders\n\n> 降低专利持有人的 **[xxx]**\n\n把C接回题干，它说的是：商业方法专利会降低专利持有人的某种 **[xxx]**。\n\nC里的`patent holders`很眼熟，刚才精读第五段好像看到过，但被挡住的是选项核心名词，所以先看原句到底对持有人说了什么。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders\n>\ntoo many patents were being upheld for “inventions” that are obvious\n\n原文说的是专利持有人得到的保护范围变窄；选项却说商业方法专利本身降低了持有人的某种 **[xxx]**。主体、动作和结果都没有在原句中接成这一关系。\n\n**看到`patent holders`和一个被缩小的东西，就能不能把它改写成“专利降低持有人的某种东西”？**\n\n不能。原文是法院决定缩小保护，不能把动作主体换成专利本身。\n\n要选C，最后两段还得直接写商业方法专利造成持有人某种评价下降；现在找不到。\n\n**第一轮判断：C排除。**","html":"<h3>C. lower the <span class=\"mask\">[xxx]</span> for patent holders</h3>\n<blockquote>\n<p>降低专利持有人的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把C接回题干，它说的是：商业方法专利会降低专利持有人的某种 <span class=\"mask\">[xxx]</span>。</p>\n<p>C里的<code>patent holders</code>很眼熟，刚才精读第五段好像看到过，但被挡住的是选项核心名词，所以先看原句到底对持有人说了什么。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n</blockquote>\n<p>too many patents were being upheld for “inventions” that are obvious</p>\n<p>原文说的是专利持有人得到的保护范围变窄；选项却说商业方法专利本身降低了持有人的某种 <span class=\"mask\">[xxx]</span>。主体、动作和结果都没有在原句中接成这一关系。</p>\n<p><strong>看到<code>patent holders</code>和一个被缩小的东西，就能不能把它改写成“专利降低持有人的某种东西”？</strong></p>\n<p>不能。原文是法院决定缩小保护，不能把动作主体换成专利本身。</p>\n<p>要选C，最后两段还得直接写商业方法专利造成持有人某种评价下降；现在找不到。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[150,1840,1500,410]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"29","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"29题","raw":"### D. increase the incidence of risks\n\n> 增加风险发生的频率\n\n把D接回题干，它说的是：商业方法专利会让风险更经常发生。\n\nD里的`risks`让人依稀想起第四段能源市场中的`risk`，但还要看原文是在说专利增加风险，还是专利方法用来处理风险。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> The Bilski case involves a **[xxx]** patent on a method for **[xxx]** risk in the energy market.\n>\nthe case would be heard by all 12 of the court’s judges\n\n原文只说这个案子涉及一种与风险有关的方法；看不见的动作究竟是什么也不能自行补。选项却进一步说专利会提高风险发生率。原文没有这个因果，更没有风险次数的数据。\n\n**文章里出现一次`risk`，能不能直接推出“商业方法专利让风险更常发生”？**\n\n不能。话题里有风险，不等于专利造成风险。\n\n要选D，最后两段还得写专利实施后风险数量上升；文章没有这一结果。\n\n**第一轮判断：D排除。**","html":"<h3>D. increase the incidence of risks</h3>\n<blockquote>\n<p>增加风险发生的频率</p>\n</blockquote>\n<p>把D接回题干，它说的是：商业方法专利会让风险更经常发生。</p>\n<p>D里的<code>risks</code>让人依稀想起第四段能源市场中的<code>risk</code>，但还要看原文是在说专利增加风险，还是专利方法用来处理风险。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>The Bilski case involves a <span class=\"mask\">[xxx]</span> patent on a method for <span class=\"mask\">[xxx]</span> risk in the energy market.</p>\n</blockquote>\n<p>the case would be heard by all 12 of the court’s judges</p>\n<p>原文只说这个案子涉及一种与风险有关的方法；看不见的动作究竟是什么也不能自行补。选项却进一步说专利会提高风险发生率。原文没有这个因果，更没有风险次数的数据。</p>\n<p><strong>文章里出现一次<code>risk</code>，能不能直接推出“商业方法专利让风险更常发生”？</strong></p>\n<p>不能。话题里有风险，不等于专利造成风险。</p>\n<p>要选D，最后两段还得写专利实施后风险数量上升；文章没有这一结果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[150,1570,1500,315]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"29","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T2-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"29题","raw":"### 29题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除。\n\n最后两段共同写重新审视、缩小保护和“太多明显发明仍被维持”，B最完整。","html":"<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>最后两段共同写重新审视、缩小保护和“太多明显发明仍被维持”，B最完整。</p>\n","articleRects":[[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**Which of the following would be the subject of the text?**\n\n下面哪一项最适合作为文章的主题？\n\n这是全文作者观点／全文主旨题。\n\n这类题先别急着数`business-method patents`、`Bilski`或`trend`出现了几次。更稳的办法是把每个选项当成作者真正想写的中心，看看文章按这个中心应该怎么展开，再和全文实际写法对照。\n\n选项：\n\nA. **A looming threat to business-method patents.**\n\n商业方法专利面临的一场迫近威胁\n\nB. **Protection for business-method patent holders.**\n\n对商业方法专利持有人的保护\n\nC. **A legal case regarding business-method patents.**\n\n一起关于商业方法专利的案件\n\nD. **A prevailing trend against business-method patents.**\n\n一种反对商业方法专利的普遍趋势","html":"<h2>30题</h2>\n<p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>下面哪一项最适合作为文章的主题？</p>\n<p>这是全文作者观点／全文主旨题。</p>\n<p>这类题先别急着数<code>business-method patents</code>、<code>Bilski</code>或<code>trend</code>出现了几次。更稳的办法是把每个选项当成作者真正想写的中心，看看文章按这个中心应该怎么展开，再和全文实际写法对照。</p>\n<p>选项：</p>\n<p>A. <strong>A looming threat to business-method patents.</strong></p>\n<p>商业方法专利面临的一场迫近威胁</p>\n<p>B. <strong>Protection for business-method patent holders.</strong></p>\n<p>对商业方法专利持有人的保护</p>\n<p>C. <strong>A legal case regarding business-method patents.</strong></p>\n<p>一起关于商业方法专利的案件</p>\n<p>D. <strong>A prevailing trend against business-method patents.</strong></p>\n<p>一种反对商业方法专利的普遍趋势</p>\n","articleRects":[],"questionRects":[[135,1855,1530,420]],"meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先列出过去十年已经获准的几种商业方法专利 | 先摆出原来的做法很常见 |\n| 第2段 | 转到现在，写联邦巡回法院准备缩减并全面审查这类专利 | 再说现在有人要反过来 |\n| 第3段 | 回看旧决定怎样引入这类专利，以及企业为何大量申请 | 回头解释以前为什么会这样 |\n| 第4段 | 写Bilski案的异常审理安排和重新考虑旧决定的可能 | 接着写这次变化可能有多大 |\n| 第5段 | 补最高法院近来的反专利动作，说明眼前变化有更大背景 | 最后补更大背景说明不是偶然 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先列出过去十年已经获准的几种商业方法专利</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>转到现在，写联邦巡回法院准备缩减并全面审查这类专利</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看旧决定怎样引入这类专利，以及企业为何大量申请</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>写Bilski案的异常审理安排和重新考虑旧决定的可能</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补最高法院近来的反专利动作，说明眼前变化有更大背景</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table>\n<hr />\n","articleRects":[[150,285,1500,290],[150,555,1500,410],[150,930,1500,665],[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1855,1530,420]],"meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. A looming threat to business-method patents.\n\n商业方法专利面临的一场迫近威胁\n\n#### 如果 A 是主旨，文章应该怎么写？\n\n如果A是主旨，文章应先写这类专利原来已经大量存在，再迅速转到一个可能收缩甚至取消整类专利的新动作；随后回顾旧基础、写核心案件，最后补更大背景。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先交代这类专利过去已经发展得很普遍 | 先摆出原来的做法很常见 |\n| 第2段 | 马上写现在出现一项可能大幅收缩它们的新动作 | 再说现在有人要反过来 |\n| 第3段 | 回看它们当初怎样被建立并迅速扩张 | 回头解释以前为什么会这样 |\n| 第4段 | 用核心案件说明这次冲击可能改动旧基础 | 接着写这次变化可能有多大 |\n| 第5段 | 补更大范围的近期动向，说明危险并非孤立事件 | 最后补更大背景说明不是偶然 |\n\n实际文章正是这样推进：第1段只负责交代这类专利已经很常见，第2段立即抛出法院准备`scale back`以及可能`eliminate an entire class`；第3、4段说明这次转向为什么大，第5段再说明它顺着最高法院的近期方向而来。\n\n**一个主题能否同时解释开头的既有规模、第二段的突然转向、第三段的旧基础、第四段的重审和结尾的更大背景？**\n\n能。A里的`looming threat`把“尚未完全落地但可能大幅收缩”的核心状态收住，范围也始终限定在business-method patents。\n\n**判断：A保留。**\n\n---","html":"<h3>A. A looming threat to business-method patents.</h3>\n<p>商业方法专利面临的一场迫近威胁</p>\n<h4>如果 A 是主旨，文章应该怎么写？</h4>\n<p>如果A是主旨，文章应先写这类专利原来已经大量存在，再迅速转到一个可能收缩甚至取消整类专利的新动作；随后回顾旧基础、写核心案件，最后补更大背景。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先交代这类专利过去已经发展得很普遍</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>马上写现在出现一项可能大幅收缩它们的新动作</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看它们当初怎样被建立并迅速扩张</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用核心案件说明这次冲击可能改动旧基础</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补更大范围的近期动向，说明危险并非孤立事件</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章正是这样推进：第1段只负责交代这类专利已经很常见，第2段立即抛出法院准备<code>scale back</code>以及可能<code>eliminate an entire class</code>；第3、4段说明这次转向为什么大，第5段再说明它顺着最高法院的近期方向而来。</p>\n<p><strong>一个主题能否同时解释开头的既有规模、第二段的突然转向、第三段的旧基础、第四段的重审和结尾的更大背景？</strong></p>\n<p>能。A里的<code>looming threat</code>把“尚未完全落地但可能大幅收缩”的核心状态收住，范围也始终限定在business-method patents。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr />\n","articleRects":[[150,285,1500,290],[150,555,1500,410],[150,930,1500,665],[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1855,1530,420]],"meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"### B. Protection for business-method patent holders.\n\n对商业方法专利持有人的保护\n\n#### 如果 B 是主旨，文章应该怎么写？\n\n如果B是主旨，文章中心应是持有人怎样得到保护、这种保护为何合理，以及法院现在如何维护或加强他们的地位。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写持有人原来获得了哪些权利和利益 | 先摆出原来的做法很常见 |\n| 第2段 | 再写现在有人准备加强或维护这些权利 | 再说现在有人要反过来 |\n| 第3段 | 解释这套保护为什么建立、怎样帮助企业 | 回头解释以前为什么会这样 |\n| 第4段 | 用案件说明保护措施可能扩大到什么程度 | 接着写这次变化可能有多大 |\n| 第5段 | 补其他有利背景，说明持有人的地位更稳 | 最后补更大背景说明不是偶然 |\n\n实际文章没有替持有人争取更多保护。第2段写的是缩减和全面审查，第5段还写保护范围已被缩小。第3段虽然提到企业用专利保护自己，却是为了说明这类专利如何扩张，并非全文立场。\n\n**全文是在解释保护如何加强，还是在写原有保护正可能被收回？**\n\n后者。B把全文方向完全倒了过来。\n\n**判断：B排除。**\n\n---","html":"<h3>B. Protection for business-method patent holders.</h3>\n<p>对商业方法专利持有人的保护</p>\n<h4>如果 B 是主旨，文章应该怎么写？</h4>\n<p>如果B是主旨，文章中心应是持有人怎样得到保护、这种保护为何合理，以及法院现在如何维护或加强他们的地位。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写持有人原来获得了哪些权利和利益</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写现在有人准备加强或维护这些权利</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>解释这套保护为什么建立、怎样帮助企业</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用案件说明保护措施可能扩大到什么程度</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补其他有利背景，说明持有人的地位更稳</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章没有替持有人争取更多保护。第2段写的是缩减和全面审查，第5段还写保护范围已被缩小。第3段虽然提到企业用专利保护自己，却是为了说明这类专利如何扩张，并非全文立场。</p>\n<p><strong>全文是在解释保护如何加强，还是在写原有保护正可能被收回？</strong></p>\n<p>后者。B把全文方向完全倒了过来。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr />\n","articleRects":[[150,285,1500,290],[150,555,1500,410],[150,930,1500,665],[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1855,1530,420]],"meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. A legal case regarding business-method patents.\n\n一起关于商业方法专利的案件\n\n#### 如果 C 是主旨，文章应该怎么写？\n\n如果C是主旨，文章应主要围绕一个案件的事实、程序、争点和结果展开，其他背景都只服务于理解这个案件。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先介绍案件涉及的专利对象和争议事实 | 先摆出原来的做法很常见 |\n| 第2段 | 再交代案件的当事方、程序和当前进展 | 再说现在有人要反过来 |\n| 第3段 | 回顾与案件直接相关的旧事实和法律背景 | 回头解释以前为什么会这样 |\n| 第4段 | 集中说明本案具体争点和审理安排 | 接着写这次变化可能有多大 |\n| 第5段 | 补案件可能形成的结果及后续影响 | 最后补更大背景说明不是偶然 |\n\nBilski案确实是文章的重要抓手，但第1段先写整类专利的普遍存在，第3段大篇幅回顾旧决定造成的扩张，第5段又转向最高法院的更大方向。案件是这场变化的载体，不是文章停留的最终范围。\n\n**把Bilski案拿掉后，文章的核心问题是“这个案子本身”，还是“整类专利可能遭遇什么变化”？**\n\n后者。C能解释第2、4段，却包不住第1、3、5段共同指向的整类专利前景。\n\n**判断：C排除。**\n\n---","html":"<h3>C. A legal case regarding business-method patents.</h3>\n<p>一起关于商业方法专利的案件</p>\n<h4>如果 C 是主旨，文章应该怎么写？</h4>\n<p>如果C是主旨，文章应主要围绕一个案件的事实、程序、争点和结果展开，其他背景都只服务于理解这个案件。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先介绍案件涉及的专利对象和争议事实</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再交代案件的当事方、程序和当前进展</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回顾与案件直接相关的旧事实和法律背景</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>集中说明本案具体争点和审理安排</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补案件可能形成的结果及后续影响</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table>\n<p>Bilski案确实是文章的重要抓手，但第1段先写整类专利的普遍存在，第3段大篇幅回顾旧决定造成的扩张，第5段又转向最高法院的更大方向。案件是这场变化的载体，不是文章停留的最终范围。</p>\n<p><strong>把Bilski案拿掉后，文章的核心问题是“这个案子本身”，还是“整类专利可能遭遇什么变化”？</strong></p>\n<p>后者。C能解释第2、4段，却包不住第1、3、5段共同指向的整类专利前景。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr />\n","articleRects":[[150,285,1500,290],[150,555,1500,410],[150,930,1500,665],[150,1570,1500,315],[150,1840,1500,410]],"questionRects":[[135,1855,1530,420]],"meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. A prevailing trend against business-method patents.\n\n一种反对商业方法专利的普遍趋势\n\n#### 如果 D 是主旨，文章应该怎么写？\n\n如果D是主旨，文章应从一开始就展示多个同向事件，证明反对商业方法专利已经成为占主导的普遍趋势，再把Bilski作为其中一个例子。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先列出近年反对这类专利的多个现象 | 先摆出原来的做法很常见 |\n| 第2段 | 再写这种反对已经从个别声音变成普遍方向 | 再说现在有人要反过来 |\n| 第3段 | 回头解释这种普遍反对为什么形成 | 回头解释以前为什么会这样 |\n| 第4段 | 用一个案件说明大趋势可能怎样落地 | 接着写这次变化可能有多大 |\n| 第5段 | 再补更多同向事件，确认趋势已经占主导 | 最后补更大背景说明不是偶然 |\n\n实际文章的新闻中心是联邦巡回法院即将用Bilski作广泛审查。最后一段才补最高法院的`anti-patent trend`，而且这个趋势针对专利保护总体，不等于全文都在证明反对business-method patents已经普遍占主导。\n\n**结尾的一句更大背景，能不能反过来取代前四段的核心事件，变成全文唯一中心？**\n\n不能。D抓住了结尾方向，却把背景扩大成中心；A更准确地概括了这次迫近的具体冲击。\n\n**判断：D排除。**\n\n--
