<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"stem_intro"},"scrollTarget":"questionTop"},{"section":"先读题干","raw":"## 36题题干\n\n**Bankers complained that they were forced to ______.**\n\n> 银行家抱怨他们被迫做什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>36题题干</h2>\n<p><strong>Bankers complained that they were forced to ______.</strong></p>\n<blockquote>\n<p>银行家抱怨他们被迫做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,165,1530,410]],"meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**According to the author, the rule changes of the FASB may result in ______.**\n\n> 作者认为，FASB的规则变化可能导致什么？\n\n题型：**局部推断题**。\n\n---","html":"<h2>37题题干</h2>\n<p><strong>According to the author, the rule changes of the FASB may result in ______.</strong></p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,585,1530,400]],"meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.**\n\n> 根据第4段，McCreevy反对IASB试图做什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>38题题干</h2>\n<p><strong>According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.</strong></p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,990,1530,435]],"meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**The author thinks the banks were “on the wrong planet” in that they ______.**\n\n> 作者说银行“在错误的星球上”，指的是银行怎么样？\n\n题型：**定位解释题**。\n\n---","html":"<h2>39题题干</h2>\n<p><strong>The author thinks the banks were “on the wrong planet” in that they ______.</strong></p>\n<blockquote>\n<p>作者说银行“在错误的星球上”，指的是银行怎么样？</p>\n</blockquote>\n<p>题型：<strong>定位解释题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**The author’s attitude towards standard-setters is one of ______.**\n\n> 作者对准则制定者持什么态度？\n\n题型：**全文作者态度题**。\n\n---","html":"<h2>40题题干</h2>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<blockquote>\n<p>作者对准则制定者持什么态度？</p>\n</blockquote>\n<p>题型：<strong>全文作者态度题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Unfortunately, Yet, but, unless |\n| 态度词 / 评价词 | 先抓个大概好坏 | not fair, compromised, wrong planet, successful |\n| 动作词 | 先看谁做了什么 | blaming, lobbying, demanded, overvalued, giving in |\n| 结果词 | 看最后出了什么事 | losses, rule changes, skeptical, pressure |\n| 重复主题词 | 大概知道老在说什么 | banks, standard-setters, FASB, IASB, assets |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>Unfortunately, Yet, but, unless</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>not fair, compromised, wrong planet, successful</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>blaming, lobbying, demanded, overvalued, giving in</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>losses, rule changes, skeptical, pressure</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>banks, standard-setters, FASB, IASB, assets</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_intro"},"scrollTarget":"articleTop"},{"section":"读文章","raw":"Bankers have been blaming themselves for their troubles in public. Behind the **[xxx]**, they have been taking aim at someone else: the accounting standard-setters. Their rules, **[xxx]** the banks, have forced them to report **[xxx]** losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Bankers have been blaming themselves for their troubles in public. Behind the <span class=\"mask\">[xxx]</span>, they have been taking aim at someone else: the accounting standard-setters. Their rules, <span class=\"mask\">[xxx]</span> the banks, have forced them to report <span class=\"mask\">[xxx]</span> losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</div></div>","articleRects":[[145,290,1510,390]],"questionRects":[],"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0}},{"section":"读文章","raw":"Bankers have been blaming themselves / for their troubles in public. / Behind the **[xxx]**, / they have been taking aim at someone else: / the accounting standard-setters. / Their rules, / **[xxx]** the banks, / have forced them / to report **[xxx]** losses, / and it’s just not fair. / These rules say / they must value some assets / at the price a third party would pay, / not the price / managers and regulators wo 片，不要急着把会计术语全部翻完。题目问到某段时，再用意群法把那一段的主体、动作和评价接起来。这里先记住银行抱怨、游说奏效、两家准则机构、资产高估和结尾的独立要求。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到银行的抱怨、FASB、IASB或“wrong planet”时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：银行家表面怪自己，背后却把矛头对准准则制定者；银行游说似乎奏效，FASB先改了规则，欧洲一边又向IASB施压；后面作者突然说银行才在错误一边，最后强调损失要确认、资产要卖得出去，而且制定者不能继续让步。</p>\n<p>到这里还不能自然地说清楚：银行具体抱怨哪条规则，FASB规则变化会造成什么，McCreevy究竟反对IASB哪种做法，“wrong planet”指哪一层错误，作者到底站在银行还是准则制定者一边。粗读时只要判断“这篇文章大概在写银行向准则制定者施压，而且作者似乎不赞成这种让步”，并知道相关内容在哪几段，就已经够用了。</p>\n<p>实际做题时，先保留这些碎片，不要急着把会计术语全部翻完。题目问到某段时，再用意群法把那一段的主体、动作和评价接起来。这里先记住银行抱怨、游说奏效、两家准则机构、资产高估和结尾的独立要求。</p>\n","articleRects":[[145,290,1510,390],[145,645,1510,255],[145,865,1510,355],[145,1185,1510,355],[145,1500,1510,420],[145,1880,1510,400]],"questionRects":[],"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做36至39题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> Bankers complained that they were forced to ______.  \n> 银行家抱怨他们被迫做什么？\n\n题干中的`complained`和`forced to`都在找银行自己说的话。粗读时好像第1段就出现银行抱怨规则迫使他们报告损失，并按第三方愿意支付的价格给资产定价。进入A以前先把第1段完整读一遍。\n\n> 原文参考：\n>\n> Bankers have been blaming themselves for their troubles in public. Behind the **[xxx]**, they have been taking aim at someone else: the accounting standard-setters. Their rules, **[xxx]** the banks, have forced them to report **[xxx]** losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n>\n> 开始精读：\n>\n> Bankers have been blaming themselves / for their troubles in public. / Behind the **[xxx]**, / they have been taking aim at someone else: / the accounting standard-setters. / Their rules, / **[xxx]** the banks, / have forced them / to report **[xxx]** losses, / and it’s just not fair. / These rules say / they must value some assets / at the price a third party would pay, / not the price / managers and regulators would like them to fetch.\n>\n> 银行家一直在公开责怪自己 / 为了他们的麻烦。/ 在 **[xxx]** 背后，/ 他们一直把矛头对准别人：/ 会计准则制定者。/ 银行 **[xxx]** 说，他们的规则 / 已经迫使他们 / 报告 **[xxx]** 损失，/ 而且这不公平。/ 这些规则说 / 他们必须给一些资产定价 / 按第三方愿意支付的价格，/ 而不是 / 管理者和监管者希望它们卖到的价格。\n\n第1段先给抱怨，再把规则内容说具体：银行不能按自己或监管者喜欢的价格报资产，而要按第三方会支付的价格来估；这会让它们报告很大的损失。题干问“被迫做什么”，选项需要概括整条估值要求。\n\n接下来按A—D逐项看。","html":"<h2>36题</h2>\n<blockquote>\n<p>Bankers complained that they were forced to ______.<br />\n银行家抱怨他们被迫做什么？</p>\n</blockquote>\n<p>题干中的<code>complained</code>和<code>forced to</code>都在找银行自己说的话。粗读时好像第1段就出现银行抱怨规则迫使他们报告损失，并按第三方愿意支付的价格给资产定价。进入A以前先把第1段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Bankers have been blaming themselves for their troubles in public. Behind the <span class=\"mask\">[xxx]</span>, they have been taking aim at someone else: the accounting standard-setters. Their rules, <span class=\"mask\">[xxx]</span> the banks, have forced them to report <span class=\"mask\">[xxx]</span> losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>开始精读：</p>\n<p>Bankers have been blaming themselves / for their troubles in public. / Behind the <span class=\"mask\">[xxx]</span>, / they have been taking aim at someone else: / the accounting standard-setters. / Their rules, / <span class=\"mask\">[xxx]</span> the banks, / have forced them / to report <span class=\"mask\">[xxx]</span> losses, / and it’s just not fair. / These rules say / they must value some assets / at the price a third party would pay, / not the price / managers and regulators would like them to fetch.</p>\n<p>银行家一直在公开责怪自己 / 为了他们的麻烦。/ 在 <span class=\"mask\">[xxx]</span> 背后，/ 他们一直把矛头对准别人：/ 会计准则制定者。/ 银行 <span class=\"mask\">[xxx]</span> 说，他们的规则 / 已经迫使他们 / 报告 <span class=\"mask\">[xxx]</span> 损失，/ 而且这不公平。/ 这些规则说 / 他们必须给一些资产定价 / 按第三方愿意支付的价格，/ 而不是 / 管理者和监管者希望它们卖到的价格。</p>\n</blockquote>\n<p>第1段先给抱怨，再把规则内容说具体：银行不能按自己或监管者喜欢的价格报资产，而要按第三方会支付的价格来估；这会让它们报告很大的损失。题干问“被迫做什么”，选项需要概括整条估值要求。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[145,290,1510,390]],"questionRects":[[135,165,1530,410]],"meta":{"kind":"question","qid":"36"}},{"section":"36题","raw":"### A. follow unfavorable asset evaluation rules\n\n> 遵守对他们不利的资产估值规则\n\n把A接回题干，它说的是：银行家抱怨自己被迫遵守对他们不利的资产估值规则。\n\nA里的`asset evaluation rules`没有照抄原文，但刚才精读时好像整段都在解释一套银行不喜欢的定价规则，先看规则内容能不能完整接上。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> Their rules ... have forced them to report **[xxx]** losses\n>\nthey must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch\n\n原文说规则迫使银行报告损失，并按第三方愿付价格给资产定价；银行还直接抱怨`it’s just not fair`。选项说这是一套对银行不利的资产估值规则，主体、被迫动作和评价方向都能对上。\n\n**“按第三方价格给资产定价并因此报告损失”，能不能概括成遵守不利的资产估值规则？**\n\n能。A没有把规则细节改掉，只把整段压成了一个上位概括。\n\n到这里，`forced`、资产定价和银行的负面评价都由第1段直接支持。\n\n**第一轮判断：A保留。**","html":"<h3>A. follow unfavorable asset evaluation rules</h3>\n<blockquote>\n<p>遵守对他们不利的资产估值规则</p>\n</blockquote>\n<p>把A接回题干，它说的是：银行家抱怨自己被迫遵守对他们不利的资产估值规则。</p>\n<p>A里的<code>asset evaluation rules</code>没有照抄原文，但刚才精读时好像整段都在解释一套银行不喜欢的定价规则，先看规则内容能不能完整接上。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>Their rules ... have forced them to report <span class=\"mask\">[xxx]</span> losses</p>\n</blockquote>\n<p>they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch</p>\n<p>原文说规则迫使银行报告损失，并按第三方愿付价格给资产定价；银行还直接抱怨<code>it’s just not fair</code>。选项说这是一套对银行不利的资产估值规则，主体、被迫动作和评价方向都能对上。</p>\n<p><strong>“按第三方价格给资产定价并因此报告损失”，能不能概括成遵守不利的资产估值规则？</strong></p>\n<p>能。A没有把规则细节改掉，只把整段压成了一个上位概括。</p>\n<p>到这里，<code>forced</code>、资产定价和银行的负面评价都由第1段直接支持。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[145,290,1510,390]],"questionRects":[[135,165,1530,410]],"meta":{"kind":"option","qid":"36","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"36题","raw":"### B. collect **[xxx]** from third parties\n\n> 向第三方收取 **[xxx]**\n\n把B接回题干，它说的是：银行家抱怨自己被迫向第三方收取某种 **[xxx]**。\n\nB里的`third parties`很眼熟，刚才精读时好像就出现在定价句里，但先看第三方在原句中到底是付款对象还是价格参照。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> at the price a third party would pay\n>\nnot the price managers and regulators would like them to fetch\n\n原文说第三方“愿意支付多少”是资产估值的参照，并没有说银行要向第三方收取什么。选项把一个假设价格标准改成了实际收款动作。\n\n**“按第三方愿付的价格估值”和“向第三方收取某物”是不是同一个动作？**\n\n不是。前者是定价基准，后者是资金流向。\n\n要选B，原文还得出现银行向第三方收款；第1段没有这层关系，遮挡词也不能替我们补出来。\n\n**第一轮判断：B排除。**","html":"<h3>B. collect <span class=\"mask\">[xxx]</span> from third parties</h3>\n<blockquote>\n<p>向第三方收取 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把B接回题干，它说的是：银行家抱怨自己被迫向第三方收取某种 <span class=\"mask\">[xxx]</span>。</p>\n<p>B里的<code>third parties</code>很眼熟，刚才精读时好像就出现在定价句里，但先看第三方在原句中到底是付款对象还是价格参照。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>at the price a third party would pay</p>\n</blockquote>\n<p>not the price managers and regulators would like them to fetch</p>\n<p>原文说第三方“愿意支付多少”是资产估值的参照，并没有说银行要向第三方收取什么。选项把一个假设价格标准改成了实际收款动作。</p>\n<p><strong>“按第三方愿付的价格估值”和“向第三方收取某物”是不是同一个动作？</strong></p>\n<p>不是。前者是定价基准，后者是资金流向。</p>\n<p>要选B，原文还得出现银行向第三方收款；第1段没有这层关系，遮挡词也不能替我们补出来。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[145,290,1510,390]],"questionRects":[[135,165,1530,410]],"meta":{"kind":"option","qid":"36","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"36题","raw":"### C. cooperate with the price managers\n\n> 与价格管理者合作\n\n把C接回题干，它说的是：银行家抱怨自己被迫与价格管理者合作。\n\nC里的`managers`好像在第1段出现过，但刚才精读时它和`price`并不是一个固定人物称呼，先回到完整结构。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> not the price managers and regulators would like them to fetch\n>\nat the price a third party would pay\n\n原文是`the price`加上一个定语从句：管理者和监管者希望资产卖到这个价格。它不是在说“price managers”这种人，更没有`cooperate with`。选项把句子边界切错了。\n\n**原文中的`managers`是在管理“价格”，还是在表达他们希望资产卖到什么价格？**\n\n后者。原句没有“价格管理者”这个主体。\n\n要选C，还得在原文中找到合作对象和合作动作；这里两个都没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. cooperate with the price managers</h3>\n<blockquote>\n<p>与价格管理者合作</p>\n</blockquote>\n<p>把C接回题干，它说的是：银行家抱怨自己被迫与价格管理者合作。</p>\n<p>C里的<code>managers</code>好像在第1段出现过，但刚才精读时它和<code>price</code>并不是一个固定人物称呼，先回到完整结构。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>not the price managers and regulators would like them to fetch</p>\n</blockquote>\n<p>at the price a third party would pay</p>\n<p>原文是<code>the price</code>加上一个定语从句：管理者和监管者希望资产卖到这个价格。它不是在说“price managers”这种人，更没有<code>cooperate with</code>。选项把句子边界切错了。</p>\n<p><strong>原文中的<code>managers</code>是在管理“价格”，还是在表达他们希望资产卖到什么价格？</strong></p>\n<p>后者。原句没有“价格管理者”这个主体。</p>\n<p>要选C，还得在原文中找到合作对象和合作动作；这里两个都没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[145,290,1510,390]],"questionRects":[[135,165,1530,410]],"meta":{"kind":"option","qid":"36","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"36题","raw":"### D. reevaluate some of their assets\n\n> 重新评估他们的一些资产\n\n把D接回题干，它说的是：银行家抱怨自己被迫重新评估一部分资产。\n\nD里的`assets`和`value`让人隐约觉得很接近，刚才精读时确实说他们必须给一些资产定价。不过还要看题干问的抱怨是不是只剩“重新评估”这一层。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> they must value some assets at the price a third party would pay\n>\nTheir rules ... have forced them to report **[xxx]** losses\n\n原文不是泛泛说再评一次，而是规定必须使用第三方价格，并由此报告损失。D只保留“再评估资产”，把最关键的估值标准和不利结果都拿掉了。\n\n**只说“重新评估资产”，能不能完整回答银行抱怨自己被迫遵守了什么？**\n\n不能。它没有写出被迫采用的具体价格规则，也没有接住报告损失。\n\n要选D，题干或原文应只关心是否再次估值；当前段落关心的是按什么标准估值，A更完整。\n\n**第一轮判断：D排除。**","html":"<h3>D. reevaluate some of their assets</h3>\n<blockquote>\n<p>重新评估他们的一些资产</p>\n</blockquote>\n<p>把D接回题干，它说的是：银行家抱怨自己被迫重新评估一部分资产。</p>\n<p>D里的<code>assets</code>和<code>value</code>让人隐约觉得很接近，刚才精读时确实说他们必须给一些资产定价。不过还要看题干问的抱怨是不是只剩“重新评估”这一层。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>they must value some assets at the price a third party would pay</p>\n</blockquote>\n<p>Their rules ... have forced them to report <span class=\"mask\">[xxx]</span> losses</p>\n<p>原文不是泛泛说再评一次，而是规定必须使用第三方价格，并由此报告损失。D只保留“再评估资产”，把最关键的估值标准和不利结果都拿掉了。</p>\n<p><strong>只说“重新评估资产”，能不能完整回答银行抱怨自己被迫遵守了什么？</strong></p>\n<p>不能。它没有写出被迫采用的具体价格规则，也没有接住报告损失。</p>\n<p>要选D，题干或原文应只关心是否再次估值；当前段落关心的是按什么标准估值，A更完整。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[145,290,1510,390]],"questionRects":[[135,165,1530,410]],"meta":{"kind":"option","qid":"36","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"36题","raw":"### 36题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除。\n\n第1段的抱怨核心是被迫按第三方价格给资产估值并报告损失，A最完整。","html":"<h3>36题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>第1段的抱怨核心是被迫按第三方价格给资产估值并报告损失，A最完整。</p>\n","articleRects":[[145,290,1510,390]],"questionRects":[[135,165,1530,410]],"meta":{"kind":"result","qid":"36"}},{"section":"37题","raw":"## 37题\n\n> According to the author, the rule changes of the FASB may result in ______.  \n> 作者认为，FASB的规则变化可能导致什么？\n\n题干点名`rule changes of the FASB`并问作者判断的结果。粗读时好像第2段先说银行游说正在奏效、制定者独立性受损，第3段才写FASB在国会压力后匆忙改规则。进入A以前把这两段连起来读。\n\n> 原文参考：\n>\n> Unfortunately, banks’ lobbying now seems to be working. The details may be **[xxx]**, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry **[xxx]** assets at prices that attract buyers, **[xxx]** the banking system will be difficult.\n>\n> After a **[xxx]** encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value **[xxx]** assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, cried out against those who “question our motives.” Yet bank shares rose and the changes enhance what one lobbying group **[xxx]** calls “the use of judgment by management.”\n>\n> 开始精读：\n>\n> Unfortunately, / banks’ lobbying now seems to be working. / The details may be **[xxx]**, / but the independence of standard-setters, / essential to the proper functioning of capital markets, / is being compromised. / And, unless banks carry **[xxx]** assets / at prices that attract buyers, / **[xxx]** the banking system / will be difficult.\n>\n> After a **[xxx]** encounter with Congress, / America’s Financial Accounting Standards Board (FASB) / rushed through rule changes. / These gave banks more freedom / to use models / to value **[xxx]** assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements. / Bob Herz, / the FASB’s chairman, / cried out against those / who “question our motives.” / Yet bank shares rose / and the changes enhance / what one lobbying group **[xxx]** calls / “the use of judgment by management.”\n>\n> 不幸的是，/ 银行的游说现在似乎正在奏效。/ 细节也许 **[xxx]**，/ 但是准则制定者的独立性，/ 它对资本市场正常运转很重要，/ 正在受损。/ 而且，除非银行把 **[xxx]** 资产 / 放在能够吸引买家的价格上，/ **[xxx]** 银行系统 / 将会很困难。\n>\n> 在一次与国会的 **[xxx]** 交锋之后，/ 美国财务会计准则委员会FASB / 匆忙通过了规则变化。/ 这些给银行更多自由 / 去使用模型 / 给 **[xxx]** 资产定价，/ 也给了更多灵活性 / 在确认损失时 / 对长期资产 / 在收益表中。/ Bob Herz，/ FASB主席，/ 对那些“质疑我们动机”的人表示反对。/ 然而银行股上涨，/ 这些变化增强了 / 某游说团体 **[xxx]** 所称的 / “管理层判断的使用”。\n\n顺序是：游说奏效，独立性受损；接着FASB在国会交锋后匆忙改规则，银行获得更多自由和管理层判断空间。题干问作者认为“可能导致什么”，所以要看作者在第2段先给出的总判断，而不是只看到第3段某个`losses`熟词。\n\n接下来按A—D逐项看。","html":"<h2>37题</h2>\n<blockquote>\n<p>According to the author, the rule changes of the FASB may result in ______.<br />\n作者认为，FASB的规则变化可能导致什么？</p>\n</blockquote>\n<p>题干点名<code>rule changes of the FASB</code>并问作者判断的结果。粗读时好像第2段先说银行游说正在奏效、制定者独立性受损，第3段才写FASB在国会压力后匆忙改规则。进入A以前把这两段连起来读。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Unfortunately, banks’ lobbying now seems to be working. The details may be <span class=\"mask\">[xxx]</span>, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry <span class=\"mask\">[xxx]</span> assets at prices that attract buyers, <span class=\"mask\">[xxx]</span> the banking system will be difficult.</p>\n<p>After a <span class=\"mask\">[xxx]</span> encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value <span class=\"mask\">[xxx]</span> assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, cried out against those who “question our motives.” Yet bank shares rose and the changes enhance what one lobbying group <span class=\"mask\">[xxx]</span> calls “the use of judgment by management.”</p>\n<p>开始精读：</p>\n<p>Unfortunately, / banks’ lobbying now seems to be working. / The details may be <span class=\"mask\">[xxx]</span>, / but the independence of standard-setters, / essential to the proper functioning of capital markets, / is being compromised. / And, unless banks carry <span class=\"mask\">[xxx]</span> assets / at prices that attract buyers, / <span class=\"mask\">[xxx]</span> the banking system / will be difficult.</p>\n<p>After a <span class=\"mask\">[xxx]</span> encounter with Congress, / America’s Financial Accounting Standards Board (FASB) / rushed through rule changes. / These gave banks more freedom / to use models / to value <span class=\"mask\">[xxx]</span> assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements. / Bob Herz, / the FASB’s chairman, / cried out against those / who “question our motives.” / Yet bank shares rose / and the changes enhance / what one lobbying group <span class=\"mask\">[xxx]</span> calls / “the use of judgment by management.”</p>\n<p>不幸的是，/ 银行的游说现在似乎正在奏效。/ 细节也许 <span class=\"mask\">[xxx]</span>，/ 但是准则制定者的独立性，/ 它对资本市场正常运转很重要，/ 正在受损。/ 而且，除非银行把 <span class=\"mask\">[xxx]</span> 资产 / 放在能够吸引买家的价格上，/ <span class=\"mask\">[xxx]</span> 银行系统 / 将会很困难。</p>\n<p>在一次与国会的 <span class=\"mask\">[xxx]</span> 交锋之后，/ 美国财务会计准则委员会FASB / 匆忙通过了规则变化。/ 这些给银行更多自由 / 去使用模型 / 给 <span class=\"mask\">[xxx]</span> 资产定价，/ 也给了更多灵活性 / 在确认损失时 / 对长期资产 / 在收益表中。/ Bob Herz，/ FASB主席，/ 对那些“质疑我们动机”的人表示反对。/ 然而银行股上涨，/ 这些变化增强了 / 某游说团体 <span class=\"mask\">[xxx]</span> 所称的 / “管理层判断的使用”。</p>\n</blockquote>\n<p>顺序是：游说奏效，独立性受损；接着FASB在国会交锋后匆忙改规则，银行获得更多自由和管理层判断空间。题干问作者认为“可能导致什么”，所以要看作者在第2段先给出的总判断，而不是只看到第3段某个<code>losses</code>熟词。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[145,645,1510,255],[145,865,1510,355]],"questionRects":[[135,585,1530,400]],"meta":{"kind":"question","qid":"37"}},{"section":"37题","raw":"### A. the diminishing role of management\n\n> 管理层作用减弱\n\n把A接回题干，它说的是：FASB的规则变化可能使管理层的作用变小。\n\nA里的`management`很眼熟，刚才精读第3段末尾好像直接出现了，但要看规则变化是减少还是增强管理层判断。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> the changes enhance what one lobbying group **[xxx]** calls “the use of judgment by management”\n>\nThese gave banks more freedom to use models\n\n原文说变化增强了“管理层判断的使用”，并给银行更多自由。选项却说管理层作用减弱，方向相反。\n\n**规则变化是把更多判断交给管理层，还是把管理层作用拿走？**\n\n前者。A把增强写成了减弱。\n\n要选A，原文应出现管理层被限制或判断权被收回；现在看到的是相反内容。\n\n**第一轮判断：A排除。**","html":"<h3>A. the diminishing role of management</h3>\n<blockquote>\n<p>管理层作用减弱</p>\n</blockquote>\n<p>把A接回题干，它说的是：FASB的规则变化可能使管理层的作用变小。</p>\n<p>A里的<code>management</code>很眼熟，刚才精读第3段末尾好像直接出现了，但要看规则变化是减少还是增强管理层判断。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>the changes enhance what one lobbying group <span class=\"mask\">[xxx]</span> calls “the use of judgment by management”</p>\n</blockquote>\n<p>These gave banks more freedom to use models</p>\n<p>原文说变化增强了“管理层判断的使用”，并给银行更多自由。选项却说管理层作用减弱，方向相反。</p>\n<p><strong>规则变化是把更多判断交给管理层，还是把管理层作用拿走？</strong></p>\n<p>前者。A把增强写成了减弱。</p>\n<p>要选A，原文应出现管理层被限制或判断权被收回；现在看到的是相反内容。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[145,865,1510,355]],"questionRects":[[135,585,1530,400]],"meta":{"kind":"option","qid":"37","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"37题","raw":"### B. the revival of the banking system\n\n> 银行系统的复苏\n\n把B接回题干，它说的是：FASB的规则变化可能让银行系统复苏。\n\nB里的`banking system`和“复苏”方向让人好像想起第2段末尾，但刚才精读时那句话带着明确条件，先看规则变化是否满足了这个条件。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> unless banks carry **[xxx]** assets at prices that attract buyers, **[xxx]** the banking system will be difficult\n>\nThese gave banks more freedom to use models to value **[xxx]** assets\n\n原文说银行系统能否恢复，关键是资产价格要能吸引买家；FASB变化只是让银行更自由地用模型估值。作者没有说这种自由就会把资产标到买家愿意接受的水平，反而先说独立性受损。\n\n**给银行更多估值自由，能不能直接等于银行系统因此复苏？**\n\n不能。原文给复苏设的是“价格吸引买家”的条件，不是“管理层更自由”。\n\n要选B，还得证明规则变化会让资产真正成交；第2、3段没有给出这个结果。\n\n**第一轮判断：B排除。**","html":"<h3>B. the revival of the banking system</h3>\n<blockquote>\n<p>银行系统的复苏</p>\n</blockquote>\n<p>把B接回题干，它说的是：FASB的规则变化可能让银行系统复苏。</p>\n<p>B里的<code>banking system</code>和“复苏”方向让人好像想起第2段末尾，但刚才精读时那句话带着明确条件，先看规则变化是否满足了这个条件。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>unless banks carry <span class=\"mask\">[xxx]</span> assets at prices that attract buyers, <span class=\"mask\">[xxx]</span> the banking system will be difficult</p>\n</blockquote>\n<p>These gave banks more freedom to use models to value <span class=\"mask\">[xxx]</span> assets</p>\n<p>原文说银行系统能否恢复，关键是资产价格要能吸引买家；FASB变化只是让银行更自由地用模型估值。作者没有说这种自由就会把资产标到买家愿意接受的水平，反而先说独立性受损。</p>\n<p><strong>给银行更多估值自由，能不能直接等于银行系统因此复苏？</strong></p>\n<p>不能。原文给复苏设的是“价格吸引买家”的条件，不是“管理层更自由”。</p>\n<p>要选B，还得证明规则变化会让资产真正成交；第2、3段没有给出这个结果。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[145,645,1510,255],[145,865,1510,355]],"questionRects":[[135,585,1530,400]],"meta":{"kind":"option","qid":"37","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P2","T4-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"37题","raw":"### C. the banks’ **[xxx]** asset losses\n\n> 银行的 **[xxx]** 资产损失\n\n把C接回题干，它说的是：FASB的规则变化可能导致银行出现某种 **[xxx]** 资产损失。\n\nC里的`asset losses`看着很眼熟，刚才精读第3段确实写到长期资产和损失，但先看变化是在制造损失，还是改变确认损失的方式。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> more flexibility in recognizing losses on long-term assets in their income statements\n>\nThese gave banks more freedom to use models to value **[xxx]** assets\n\n原文说规则变化给银行更多灵活性来确认损失，并没有说变化造成这些损失。选项把“怎样确认已有损失”改成“导致某类损失出现”。\n\n**确认损失更灵活，能不能直接说规则变化造成了这些资产损失？**\n\n不能。确认方式和损失成因不是一回事。\n\n要选C，原文还得写规则变化使资产价值进一步下降或制造了新损失；这里没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. the banks’ <span class=\"mask\">[xxx]</span> asset losses</h3>\n<blockquote>\n<p>银行的 <span class=\"mask\">[xxx]</span> 资产损失</p>\n</blockquote>\n<p>把C接回题干，它说的是：FASB的规则变化可能导致银行出现某种 <span class=\"mask\">[xxx]</span> 资产损失。</p>\n<p>C里的<code>asset losses</code>看着很眼熟，刚才精读第3段确实写到长期资产和损失，但先看变化是在制造损失，还是改变确认损失的方式。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>more flexibility in recognizing losses on long-term assets in their income statements</p>\n</blockquote>\n<p>These gave banks more freedom to use models to value <span class=\"mask\">[xxx]</span> assets</p>\n<p>原文说规则变化给银行更多灵活性来确认损失，并没有说变化造成这些损失。选项把“怎样确认已有损失”改成“导致某类损失出现”。</p>\n<p><strong>确认损失更灵活，能不能直接说规则变化造成了这些资产损失？</strong></p>\n<p>不能。确认方式和损失成因不是一回事。</p>\n<p>要选C，原文还得写规则变化使资产价值进一步下降或制造了新损失；这里没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[145,865,1510,355]],"questionRects":[[135,585,1530,400]],"meta":{"kind":"option","qid":"37","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"37题","raw":"### D. the weakening of its independence\n\n> 它的独立性被削弱\n\n把D接回题干，它说的是：FASB的规则变化可能削弱它自身的独立性。\n\nD里的`independence`刚才精读时好像就在第2段直接出现，而第3段又交代规则变化发生在国会施压之后，先把这两段的先后关系接起来。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> banks’ lobbying now seems to be working\n>\nthe independence of standard-setters ... is being compromised\n>\nAfter a **[xxx]** encounter with Congress, America’s Financial Accounting Standards Board rushed through rule changes.\n\n原文先判断银行游说奏效、制定者独立性正在受损，再用FASB匆忙改规则把这个判断写具体。选项说这些变化可能削弱FASB独立性，正好接住作者的评价。\n\n**在国会交锋后匆忙让步，并被作者概括为独立性受损，能不能支持D？**\n\n能。第2段先给结论，第3段给具体表现。\n\nD的主体、原因链和结果方向都在这两段中出现，没有把管理层自由误当成复苏。\n\n**第一轮判断：D保留。**","html":"<h3>D. the weakening of its independence</h3>\n<blockquote>\n<p>它的独立性被削弱</p>\n</blockquote>\n<p>把D接回题干，它说的是：FASB的规则变化可能削弱它自身的独立性。</p>\n<p>D里的<code>independence</code>刚才精读时好像就在第2段直接出现，而第3段又交代规则变化发生在国会施压之后，先把这两段的先后关系接起来。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>banks’ lobbying now seems to be working</p>\n</blockquote>\n<p>the independence of standard-setters ... is being compromised</p>\n<blockquote>\n</blockquote>\n<p>After a <span class=\"mask\">[xxx]</span> encounter with Congress, America’s Financial Accounting Standards Board rushed through rule changes.</p>\n<p>原文先判断银行游说奏效、制定者独立性正在受损，再用FASB匆忙改规则把这个判断写具体。选项说这些变化可能削弱FASB独立性，正好接住作者的评价。</p>\n<p><strong>在国会交锋后匆忙让步，并被作者概括为独立性受损，能不能支持D？</strong></p>\n<p>能。第2段先给结论，第3段给具体表现。</p>\n<p>D的主体、原因链和结果方向都在这两段中出现，没有把管理层自由误当成复苏。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[145,645,1510,255],[145,865,1510,355]],"questionRects":[[135,585,1530,400]],"meta":{"kind":"option","qid":"37","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P2","T4-P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"37题","raw":"### 37题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留。\n\n第2段先说独立性受损，第3段用FASB在压力后匆忙改规则把这一点写具体，D可以确定。","html":"<h3>37题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>第2段先说独立性受损，第3段用FASB在压力后匆忙改规则把这一点写具体，D可以确定。</p>\n","articleRects":[[145,645,1510,255],[145,865,1510,355]],"questionRects":[[135,585,1530,400]],"meta":{"kind":"result","qid":"37"}},{"section":"38题","raw":"## 38题\n\n> According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.  \n> 根据第4段，McCreevy反对IASB试图做什么？\n\n题干直接限定第4段并点名McCreevy。粗读时好像这一段先写IASB不想在没有整体规划时行动，后面McCreevy却警告它不在“政治真空”中，欧洲还可以另订规则。进入A以前先把整段的谁在施压、谁想保留什么读清楚。\n\n> 原文参考：\n>\n> European ministers **[xxx]** demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its **[xxx]** of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political **[xxx]**” but “in the real world” and that Europe could yet develop different rules.\n>\n> 开始精读：\n>\n> European ministers **[xxx]** demanded / that the International Accounting Standards Board (IASB) / do likewise. / The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes its **[xxx]** of rules / later this year / is strong. / Charlie McCreevy, / a European commissioner, / warned the IASB / that it did “not live in a political **[xxx]**” / but “in the real world” / and that Europe could yet develop different rules.\n>\n> 欧洲部长们 **[xxx]** 要求 / 国际会计准则委员会IASB / 也这样做。/ IASB说 / 它不想行动 / 在没有整体规划的情况下，/ 但是屈服的压力 / 当它今年晚些时候完成规则 **[xxx]** 时 / 很强。/ Charlie McCreevy，/ 一名欧洲委员，/ 警告IASB / 它“不生活在政治 **[xxx]** 中” / 而是“在现实世界中”，/ 而且欧洲仍可能制定不同规则。\n\n这里有两边：IASB说不愿在缺少整体规划时立刻跟着做；McCreevy用“现实世界”和“欧洲可另订规则”施压。题干问他反对IASB试图做什么，要从IASB可见的动作和他的警告之间找对应，不能只凭`political`猜。\n\n接下来按A—D逐项看。","html":"<h2>38题</h2>\n<blockquote>\n<p>According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.<br />\n根据第4段，McCreevy反对IASB试图做什么？</p>\n</blockquote>\n<p>题干直接限定第4段并点名McCreevy。粗读时好像这一段先写IASB不想在没有整体规划时行动，后面McCreevy却警告它不在“政治真空”中，欧洲还可以另订规则。进入A以前先把整段的谁在施压、谁想保留什么读清楚。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>European ministers <span class=\"mask\">[xxx]</span> demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its <span class=\"mask\">[xxx]</span> of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political <span class=\"mask\">[xxx]</span>” but “in the real world” and that Europe could yet develop different rules.</p>\n<p>开始精读：</p>\n<p>European ministers <span class=\"mask\">[xxx]</span> demanded / that the International Accounting Standards Board (IASB) / do likewise. / The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes its <span class=\"mask\">[xxx]</span> of rules / later this year / is strong. / Charlie McCreevy, / a European commissioner, / warned the IASB / that it did “not live in a political <span class=\"mask\">[xxx]</span>” / but “in the real world” / and that Europe could yet develop different rules.</p>\n<p>欧洲部长们 <span class=\"mask\">[xxx]</span> 要求 / 国际会计准则委员会IASB / 也这样做。/ IASB说 / 它不想行动 / 在没有整体规划的情况下，/ 但是屈服的压力 / 当它今年晚些时候完成规则 <span class=\"mask\">[xxx]</span> 时 / 很强。/ Charlie McCreevy，/ 一名欧洲委员，/ 警告IASB / 它“不生活在政治 <span class=\"mask\">[xxx]</span> 中” / 而是“在现实世界中”，/ 而且欧洲仍可能制定不同规则。</p>\n</blockquote>\n<p>这里有两边：IASB说不愿在缺少整体规划时立刻跟着做；McCreevy用“现实世界”和“欧洲可另订规则”施压。题干问他反对IASB试图做什么，要从IASB可见的动作和他的警告之间找对应，不能只凭<code>political</code>猜。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[145,1185,1510,355]],"questionRects":[[135,990,1530,435]],"meta":{"kind":"question","qid":"38"}},{"section":"38题","raw":"### A. keep away from political influences\n\n> 远离政治影响\n\n把A接回题干，它说的是：McCreevy反对IASB试图避开一切政治影响。\n\nA里的`political influences`和McCreevy的“政治 **[xxx]**”看着好像很接近，但刚才精读时IASB自己说的目标不是“远离政治”，而是“不在没有整体规划时行动”。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> The IASB says it does not want to act without overall planning\n>\nMcCreevy warned the IASB that it did “not live in a political **[xxx]**” but “in the real world”\n\n原文确实有政治语境，但没有写IASB要隔绝所有政治影响。A把McCreevy用来施压的措辞，反推成IASB明确追求的目标，范围放大了。\n\n**IASB说“我要整体规划后再行动”，能不能直接改写成“我要远离一切政治影响”？**\n\n不能。前者是决策程序，后者是全面隔绝政治，原文没有后者。\n\n要选A，还得看到IASB明确主张不受政治干预；第4段只说它不愿无计划地跟进。\n\n**第一轮判断：A排除。**","html":"<h3>A. keep away from political influences</h3>\n<blockquote>\n<p>远离政治影响</p>\n</blockquote>\n<p>把A接回题干，它说的是：McCreevy反对IASB试图避开一切政治影响。</p>\n<p>A里的<code>political influences</code>和McCreevy的“政治 <span class=\"mask\">[xxx]</span>”看着好像很接近，但刚才精读时IASB自己说的目标不是“远离政治”，而是“不在没有整体规划时行动”。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning</p>\n</blockquote>\n<p>McCreevy warned the IASB that it did “not live in a political <span class=\"mask\">[xxx]</span>” but “in the real world”</p>\n<p>原文确实有政治语境，但没有写IASB要隔绝所有政治影响。A把McCreevy用来施压的措辞，反推成IASB明确追求的目标，范围放大了。</p>\n<p><strong>IASB说“我要整体规划后再行动”，能不能直接改写成“我要远离一切政治影响”？</strong></p>\n<p>不能。前者是决策程序，后者是全面隔绝政治，原文没有后者。</p>\n<p>要选A，还得看到IASB明确主张不受政治干预；第4段只说它不愿无计划地跟进。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[145,1185,1510,355]],"questionRects":[[135,990,1530,435]],"meta":{"kind":"option","qid":"38","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"38题","raw":"### B. evade the pressure from their **[xxx]**\n\n> 逃避来自其 **[xxx]** 的压力\n\n把B接回题干，它说的是：McCreevy反对IASB试图逃避来自某些 **[xxx]** 的压力。\n\nB里的`pressure`很眼熟，刚才精读时好像明确写了`the pressure to fold`，但被挡住的对象和`evade`这个动作都需要回到原句核对。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> the pressure to fold ... is strong\n>\nThe IASB says it does not want to act without overall planning\n\n原文说IASB承受屈服压力，也说它希望先有整体规划。选项却把这概括成“逃避某些人的压力”。不马上屈服不等于逃避，而且 **[xxx]** 指谁也看不出来。\n\n**在压力下仍要求整体规划，能不能直接定性为“逃避压力”？**\n\n不能。原文只写它没有立即照做，没有写它躲开或拒绝面对压力。\n\n要选B，至少要知道被挡住的对象是谁，并看到`evade`所要求的躲避动作；当前信息都不够。\n\n**第一轮判断：B排除。**","html":"<h3>B. evade the pressure from their <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>逃避来自其 <span class=\"mask\">[xxx]</span> 的压力</p>\n</blockquote>\n<p>把B接回题干，它说的是：McCreevy反对IASB试图逃避来自某些 <span class=\"mask\">[xxx]</span> 的压力。</p>\n<p>B里的<code>pressure</code>很眼熟，刚才精读时好像明确写了<code>the pressure to fold</code>，但被挡住的对象和<code>evade</code>这个动作都需要回到原句核对。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>the pressure to fold ... is strong</p>\n</blockquote>\n<p>The IASB says it does not want to act without overall planning</p>\n<p>原文说IASB承受屈服压力，也说它希望先有整体规划。选项却把这概括成“逃避某些人的压力”。不马上屈服不等于逃避，而且 <span class=\"mask\">[xxx]</span> 指谁也看不出来。</p>\n<p><strong>在压力下仍要求整体规划，能不能直接定性为“逃避压力”？</strong></p>\n<p>不能。原文只写它没有立即照做，没有写它躲开或拒绝面对压力。</p>\n<p>要选B，至少要知道被挡住的对象是谁，并看到<code>evade</code>所要求的躲避动作；当前信息都不够。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[145,1185,1510,355]],"questionRects":[[135,990,1530,435]],"meta":{"kind":"option","qid":"38","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"38题","raw":"### C. act on their own in rule-setting\n\n> 在制定规则时自行其是\n\n把C接回题干，它说的是：McCreevy反对IASB在规则制定上按自己的规划独立行动。\n\nC里的`act on their own`没有原词复现，但刚才精读时好像看到IASB不愿直接照欧洲部长的要求行动，而McCreevy又拿“欧洲可以另订规则”来逼它，先把双方动作接起来。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> European ministers **[xxx]** demanded that the IASB do likewise.\n>\nThe IASB says it does not want to act without overall planning.\n>\nEurope could yet develop different rules.\n\n原文先要求IASB“也这样做”，IASB却要按自己的整体规划来；McCreevy随后警告欧洲可以另订规则。选项说他反对IASB在规则制定中自行决定，正好概括这场冲突。\n\n**一方要求立即跟进，另一方坚持自己的整体规划，警告者反对的是不是后者的独立决策？**\n\n能。C把段内双方的动作关系完整接上了。\n\n这里不需要把`political **[xxx]**`翻出来，只凭要求、拒绝立即照做和另订规则的威胁就能保留C。\n\n**第一轮判断：C保留。**","html":"<h3>C. act on their own in rule-setting</h3>\n<blockquote>\n<p>在制定规则时自行其是</p>\n</blockquote>\n<p>把C接回题干，它说的是：McCreevy反对IASB在规则制定上按自己的规划独立行动。</p>\n<p>C里的<code>act on their own</code>没有原词复现，但刚才精读时好像看到IASB不愿直接照欧洲部长的要求行动，而McCreevy又拿“欧洲可以另订规则”来逼它，先把双方动作接起来。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>European ministers <span class=\"mask\">[xxx]</span> demanded that the IASB do likewise.</p>\n</blockquote>\n<p>The IASB says it does not want to act without overall planning.</p>\n<blockquote>\n</blockquote>\n<p>Europe could yet develop different rules.</p>\n<p>原文先要求IASB“也这样做”，IASB却要按自己的整体规划来；McCreevy随后警告欧洲可以另订规则。选项说他反对IASB在规则制定中自行决定，正好概括这场冲突。</p>\n<p><strong>一方要求立即跟进，另一方坚持自己的整体规划，警告者反对的是不是后者的独立决策？</strong></p>\n<p>能。C把段内双方的动作关系完整接上了。</p>\n<p>这里不需要把<code>political **[xxx]**</code>翻出来，只凭要求、拒绝立即照做和另订规则的威胁就能保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[145,1185,1510,355]],"questionRects":[[135,990,1530,435]],"meta":{"kind":"option","qid":"38","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"38题","raw":"### D. take gradual measures in reform\n\n> 在改革中采取渐进措施\n\n把D接回题干，它说的是：McCreevy反对IASB以渐进方式推进改革。\n\nD里的`later this year`和规则重建好像能让人想到“逐步改革”，但刚才精读时这只是IASB完成重建的时间，不是改革速度的评价。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> when it completes its **[xxx]** of rules later this year\n>\nThe IASB says it does not want to act without overall planning\n\n原文写的是等待整体规划和规则重建完成，McCreevy的压力则是要求它跟进。没有一句说IASB在采用“渐进措施”，也没有比较改革快慢。\n\n**“今年晚些时候完成规则重建”能不能直接等于“采取渐进改革措施”？**\n\n不能。时间点和改革方式不是同一层信息。\n\n要选D，原文还得明确出现逐步、分阶段或缓慢改革；第4段没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. take gradual measures in reform</h3>\n<blockquote>\n<p>在改革中采取渐进措施</p>\n</blockquote>\n<p>把D接回题干，它说的是：McCreevy反对IASB以渐进方式推进改革。</p>\n<p>D里的<code>later this year</code>和规则重建好像能让人想到“逐步改革”，但刚才精读时这只是IASB完成重建的时间，不是改革速度的评价。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>when it completes its <span class=\"mask\">[xxx]</span> of rules later this year</p>\n</blockquote>\n<p>The IASB says it does not want to act without overall planning</p>\n<p>原文写的是等待整体规划和规则重建完成，McCreevy的压力则是要求它跟进。没有一句说IASB在采用“渐进措施”，也没有比较改革快慢。</p>\n<p><strong>“今年晚些时候完成规则重建”能不能直接等于“采取渐进改革措施”？</strong></p>\n<p>不能。时间点和改革方式不是同一层信息。</p>\n<p>要选D，原文还得明确出现逐步、分阶段或缓慢改革；第4段没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[145,1185,1510,355]],"questionRects":[[135,990,1530,435]],"meta":{"kind":"option","qid":"38","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"38题","raw":"### 38题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除。\n\nIASB想按整体规划自行决定，McCreevy则以欧洲可另订规则施压，C最完整。","html":"<h3>38题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>IASB想按整体规划自行决定，McCreevy则以欧洲可另订规则施压，C最完整。</p>\n","articleRects":[[145,1185,1510,355]],"questionRects":[[135,990,1530,435]],"meta":{"kind":"result","qid":"38"}},{"section":"39题","raw":"## 39题\n\n> The author thinks the banks were “on the wrong planet” in that they ______.  \n> 作者说银行“在错误的星球上”，指的是银行怎么样？\n\n题干给出第5段的原话`on the wrong planet`。粗读时好像这句话后面紧跟`accounts that vastly overvalued assets`，后面才继续写银行今天怎样辩解、投资者怎样看、银行为何不卖资产。进入A以前先按句子顺序读完整段。\n\n> 原文参考：\n>\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the **[xxx]** illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the **[xxx]** of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those **[xxx]** bargains.\n>\n> 开始精读：\n>\n> It was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets. / Today they argue / that market prices overstate losses, / because they largely reflect / the **[xxx]** illiquidity of markets, / not the likely extent of bad debts. / The truth will not be known for years. / But banks’ shares trade below their book value, / suggesting that investors are skeptical. / And dead markets partly reflect / the **[xxx]** of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those **[xxx]** bargains.\n>\n> 是银行 / 处在错误的星球上，/ 它们的账目 / 大幅高估了资产。/ 今天它们辩称 / 市场价格夸大损失，/ 因为这些价格主要反映 / 市场的 **[xxx]** 非流动性，/ 而不是坏账可能达到的程度。/ 真相多年后才会知道。/ 但是银行股票低于账面价值交易，/ 表明投资者持怀疑态度。/ 而停滞的市场部分反映 / 银行的 **[xxx]**：/ 它们不愿出售资产 / 因为害怕 **[xxx]** 损失，/ 却又不愿购买 / 那些所谓的 **[xxx]**。\n\n`wrong planet`后面直接用`with accounts that vastly overvalued assets`解释银行错在哪里。后面的市场价格、坏账和不卖资产是在继续反驳银行今天的说法。定位解释题先抓紧跟着的解释，不要把后续结果倒灌回短语。\n\n接下来按A—D逐项看。","html":"<h2>39题</h2>\n<blockquote>\n<p>The author thinks the banks were “on the wrong planet” in that they ______.<br />\n作者说银行“在错误的星球上”，指的是银行怎么样？</p>\n</blockquote>\n<p>题干给出第5段的原话<code>on the wrong planet</code>。粗读时好像这句话后面紧跟<code>accounts that vastly overvalued assets</code>，后面才继续写银行今天怎样辩解、投资者怎样看、银行为何不卖资产。进入A以前先按句子顺序读完整段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the <span class=\"mask\">[xxx]</span> illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the <span class=\"mask\">[xxx]</span> of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those <span class=\"mask\">[xxx]</span> bargains.</p>\n<p>开始精读：</p>\n<p>It was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets. / Today they argue / that market prices overstate losses, / because they largely reflect / the <span class=\"mask\">[xxx]</span> illiquidity of markets, / not the likely extent of bad debts. / The truth will not be known for years. / But banks’ shares trade below their book value, / suggesting that investors are skeptical. / And dead markets partly reflect / the <span class=\"mask\">[xxx]</span> of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those <span class=\"mask\">[xxx]</span> bargains.</p>\n<p>是银行 / 处在错误的星球上，/ 它们的账目 / 大幅高估了资产。/ 今天它们辩称 / 市场价格夸大损失，/ 因为这些价格主要反映 / 市场的 <span class=\"mask\">[xxx]</span> 非流动性，/ 而不是坏账可能达到的程度。/ 真相多年后才会知道。/ 但是银行股票低于账面价值交易，/ 表明投资者持怀疑态度。/ 而停滞的市场部分反映 / 银行的 <span class=\"mask\">[xxx]</span>：/ 它们不愿出售资产 / 因为害怕 <span class=\"mask\">[xxx]</span> 损失，/ 却又不愿购买 / 那些所谓的 <span class=\"mask\">[xxx]</span>。</p>\n</blockquote>\n<p><code>wrong planet</code>后面直接用<code>with accounts that vastly overvalued assets</code>解释银行错在哪里。后面的市场价格、坏账和不卖资产是在继续反驳银行今天的说法。定位解释题先抓紧跟着的解释，不要把后续结果倒灌回短语。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[145,1500,1510,420]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. misinterpreted market price indicators\n\n> 误解了市场价格指标\n\n把A接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们误解了市场价格指标。\n\nA里的`market prices`很眼熟，刚才精读时好像就在下一句出现，但题干引用的短语后面先有一个更直接的解释，先看哪一层离它最近。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n>\nToday they argue that market prices overstate losses.\n\n原文先说银行的账目高估资产，随后才写它们今天认为市场价格夸大损失。A抓住的是后续辩解，却没有复述`wrong planet`后紧跟的账目问题。\n\n**作者用`with accounts...`直接解释错误，能不能跳过它，改说错误只是对市场价格的误解？**\n\n不能。A把后一句银行自己的辩解提成了作者的直接定义。\n\n要选A，`wrong planet`后面应直接接市场价格指标；实际接的是资产被高估。\n\n**第一轮判断：A排除。**","html":"<h3>A. misinterpreted market price indicators</h3>\n<blockquote>\n<p>误解了市场价格指标</p>\n</blockquote>\n<p>把A接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们误解了市场价格指标。</p>\n<p>A里的<code>market prices</code>很眼熟，刚才精读时好像就在下一句出现，但题干引用的短语后面先有一个更直接的解释，先看哪一层离它最近。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n</blockquote>\n<p>Today they argue that market prices overstate losses.</p>\n<p>原文先说银行的账目高估资产，随后才写它们今天认为市场价格夸大损失。A抓住的是后续辩解，却没有复述<code>wrong planet</code>后紧跟的账目问题。</p>\n<p><strong>作者用<code>with accounts...</code>直接解释错误，能不能跳过它，改说错误只是对市场价格的误解？</strong></p>\n<p>不能。A把后一句银行自己的辩解提成了作者的直接定义。</p>\n<p>要选A，<code>wrong planet</code>后面应直接接市场价格指标；实际接的是资产被高估。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[145,1500,1510,420]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"39","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"39题","raw":"### B. exaggerated the real value of their assets\n\n> 夸大了自己资产的真实价值\n\n把B接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们把资产真实价值报得过高。\n\nB里的`value of assets`没有原句复现，不过刚才精读时好像紧跟短语的就是`overvalued assets`，先把词义关系放回句子。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n\n原文说银行账目`overvalued assets`，也就是把资产价值记得过高。选项说夸大资产真实价值，主体、动作和对象完全对应。\n\n**“账目大幅高估资产”能不能直接支持“夸大资产真实价值”？**\n\n能。这就是紧跟短语的解释，没有跨到后面其他信息。\n\nB不需要依赖市场是否暂时缺乏流动性，也不需要知道后面几个遮挡词。\n\n**第一轮判断：B保留。**","html":"<h3>B. exaggerated the real value of their assets</h3>\n<blockquote>\n<p>夸大了自己资产的真实价值</p>\n</blockquote>\n<p>把B接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们把资产真实价值报得过高。</p>\n<p>B里的<code>value of assets</code>没有原句复现，不过刚才精读时好像紧跟短语的就是<code>overvalued assets</code>，先把词义关系放回句子。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n</blockquote>\n<p>原文说银行账目<code>overvalued assets</code>，也就是把资产价值记得过高。选项说夸大资产真实价值，主体、动作和对象完全对应。</p>\n<p><strong>“账目大幅高估资产”能不能直接支持“夸大资产真实价值”？</strong></p>\n<p>能。这就是紧跟短语的解释，没有跨到后面其他信息。</p>\n<p>B不需要依赖市场是否暂时缺乏流动性，也不需要知道后面几个遮挡词。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[145,1500,1510,420]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"39","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"39题","raw":"### C. neglected the likely existence of bad debts\n\n> 忽视了坏账可能存在\n\n把C接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们忽视了可能存在的坏账。\n\nC里的`bad debts`很眼熟，刚才精读时好像出现在银行解释市场价格的句子中，但先看作者有没有说银行“忽视”了坏账。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> market prices overstate losses, because they largely reflect the **[xxx]** illiquidity of markets, not the likely extent of bad debts\n>\nThe truth will not be known for years.\n\n原文是在转述银行的说法：市场价格主要反映市场问题，而不是真实坏账程度；作者随后说真相多年后才知道。这里没有直接说银行否认或忽视坏账存在，更没有用它解释`wrong planet`。\n\n**提到“坏账可能达到的程度”，能不能直接推出银行忽视坏账的存在？**\n\n不能。程度和存在不是一回事，作者还明确保留了未知。\n\n要选C，原文至少得说银行不承认坏账或没有计入坏账；当前句没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. neglected the likely existence of bad debts</h3>\n<blockquote>\n<p>忽视了坏账可能存在</p>\n</blockquote>\n<p>把C接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们忽视了可能存在的坏账。</p>\n<p>C里的<code>bad debts</code>很眼熟，刚才精读时好像出现在银行解释市场价格的句子中，但先看作者有没有说银行“忽视”了坏账。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>market prices overstate losses, because they largely reflect the <span class=\"mask\">[xxx]</span> illiquidity of markets, not the likely extent of bad debts</p>\n</blockquote>\n<p>The truth will not be known for years.</p>\n<p>原文是在转述银行的说法：市场价格主要反映市场问题，而不是真实坏账程度；作者随后说真相多年后才知道。这里没有直接说银行否认或忽视坏账存在，更没有用它解释<code>wrong planet</code>。</p>\n<p><strong>提到“坏账可能达到的程度”，能不能直接推出银行忽视坏账的存在？</strong></p>\n<p>不能。程度和存在不是一回事，作者还明确保留了未知。</p>\n<p>要选C，原文至少得说银行不承认坏账或没有计入坏账；当前句没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[145,1500,1510,420]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"39","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"39题","raw":"### D. denied **[xxx]** losses in their sale of assets\n\n> 否认在出售资产时 **[xxx]** 损失\n\n把D接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们否认出售资产时会有某种 **[xxx]** 损失。\n\nD里的`sale of assets`和`losses`让人隐约想起段落后半，刚才精读时好像说银行因为害怕一种 **[xxx]** 损失而不卖资产，先看这是不是“否认”。\n\n我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：\n\n> banks ... will not sell assets for fear of **[xxx]** losses\n>\nIt was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n\n原文说银行害怕确认某种损失，所以不愿出售；选项却说它们否认这种损失。害怕发生并回避出售，不等于否认它存在，而且这还是后续市场僵局，不是短语的直接解释。\n\n**“因为害怕损失而不卖”能不能改写成“否认损失”？**\n\n不能。一个是承认风险后回避动作，另一个是否认事实。\n\n要选D，还得看到银行明确否认损失，并且这件事紧接`wrong planet`；两点都不满足。\n\n**第一轮判断：D排除。**","html":"<h3>D. denied <span class=\"mask\">[xxx]</span> losses in their sale of assets</h3>\n<blockquote>\n<p>否认在出售资产时 <span class=\"mask\">[xxx]</span> 损失</p>\n</blockquote>\n<p>把D接回题干，它说的是：银行之所以“在错误的星球上”，是因为它们否认出售资产时会有某种 <span class=\"mask\">[xxx]</span> 损失。</p>\n<p>D里的<code>sale of assets</code>和<code>losses</code>让人隐约想起段落后半，刚才精读时好像说银行因为害怕一种 <span class=\"mask\">[xxx]</span> 损失而不卖资产，先看这是不是“否认”。</p>\n<p>我们先回到刚才已经读过的具体句子，看原文原来是怎么说的：</p>\n<blockquote>\n<p>banks ... will not sell assets for fear of <span class=\"mask\">[xxx]</span> losses</p>\n</blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>原文说银行害怕确认某种损失，所以不愿出售；选项却说它们否认这种损失。害怕发生并回避出售，不等于否认它存在，而且这还是后续市场僵局，不是短语的直接解释。</p>\n<p><strong>“因为害怕损失而不卖”能不能改写成“否认损失”？</strong></p>\n<p>不能。一个是承认风险后回避动作，另一个是否认事实。</p>\n<p>要选D，还得看到银行明确否认损失，并且这件事紧接<code>wrong planet</code>；两点都不满足。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[145,1500,1510,420]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"option","qid":"39","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["T4-P5"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"39题","raw":"### 39题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除。\n\n`wrong planet`后紧跟的解释就是银行账目大幅高估资产，B可以直接确定。","html":"<h3>39题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p><code>wrong planet</code>后紧跟的解释就是银行账目大幅高估资产，B可以直接确定。</p>\n","articleRects":[[145,1500,1510,420]],"questionRects":[[135,1440,1530,400]],"meta":{"kind":"result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n**The author’s attitude towards standard-setters is one of ______.**\n\n作者对准则制定者持什么态度？\n\n这是全文作者态度题，也要回到整篇文章的写法来判断。\n\n态度题不能只看作者是否批评过某个动作。文章可能批评准则制定者“现在让步”，却仍然站在他们这一边，认为他们原来的独立做法是必要的。更稳的办法是把四种态度分别代入全文，看作者应该怎样安排六段，再和实际写法对照。\n\n选项：\n\nA. **satisfaction**\n\n满意\n\nB. **skepticism**\n\n怀疑\n\nC. **objectiveness**\n\n客观中立\n\nD. **sympathy**\n\n同情、支持","html":"<h2>40题</h2>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<p>作者对准则制定者持什么态度？</p>\n<p>这是全文作者态度题，也要回到整篇文章的写法来判断。</p>\n<p>态度题不能只看作者是否批评过某个动作。文章可能批评准则制定者“现在让步”，却仍然站在他们这一边，认为他们原来的独立做法是必要的。更稳的办法是把四种态度分别代入全文，看作者应该怎样安排六段，再和实际写法对照。</p>\n<p>选项：</p>\n<p>A. <strong>satisfaction</strong></p>\n<p>满意</p>\n<p>B. <strong>skepticism</strong></p>\n<p>怀疑</p>\n<p>C. <strong>objectiveness</strong></p>\n<p>客观中立</p>\n<p>D. <strong>sympathy</strong></p>\n<p>同情、支持</p>\n","articleRects":[],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 写银行表面自责，背后却把损失归咎于准则制定者 | 先摆出一方正在怪别人 |\n| 第2段 | 直接判断银行游说正在奏效，准则制定者的独立地位受损 | 再说让步已经开始发生 |\n| 第3段 | 写FASB在国会压力后匆忙改规则，银行因此获得更多判断空间 | 举一个例子把让步写具体 |\n| 第4段 | 写欧洲部长继续向IASB施压，要求它也作出类似改变 | 再把同样压力推到另一边 |\n| 第5段 | 转而批评银行高估资产，并说明投资者并不相信银行的说法 | 回头解释真正的问题在谁 |\n| 第6段 | 明确要求独立甚至强硬的准则制定者，并警告继续让步会招来更多压力 | 最后下结论不能继续退让 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>写银行表面自责，背后却把损失归咎于准则制定者</td>\n  <td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>直接判断银行游说正在奏效，准则制定者的独立地位受损</td>\n  <td>再说让步已经开始发生</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>写FASB在国会压力后匆忙改规则，银行因此获得更多判断空间</td>\n  <td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>写欧洲部长继续向IASB施压，要求它也作出类似改变</td>\n  <td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>转而批评银行高估资产，并说明投资者并不相信银行的说法</td>\n  <td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>明确要求独立甚至强硬的准则制定者，并警告继续让步会招来更多压力</td>\n  <td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table>\n<hr />\n","articleRects":[[145,290,1510,390],[145,645,1510,255],[145,865,1510,355],[145,1185,1510,355],[145,1500,1510,420],[145,1880,1510,400]],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"main_method","qid":"40","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"40题","raw":"### A. satisfaction\n\n满意\n\n#### 如果 A 是主旨，文章应该怎么写？\n\n如果A是作者态度，全文应把当前制度和规则变化写成令人满意的改进，结尾也应肯定现状已经解决问题。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写准则制定者的现状总体令人满意 | 先摆出一方正在怪别人 |\n| 第2段 | 再说明近期改变让各方问题得到缓解 | 再说让步已经开始发生 |\n| 第3段 | 用一项变化证明制度运转得更好 | 举一个例子把让步写具体 |\n| 第4段 | 写另一方也顺利采用同样办法 | 再把同样压力推到另一边 |\n| 第5段 | 解释剩余问题不影响总体成效 | 回头解释真正的问题在谁 |\n| 第6段 | 最后肯定当前做法并表示无需再调整 | 最后下结论不能继续退让 |\n\n实际文章从第2段就用`Unfortunately`和`compromised`评价游说结果，第6段又警告让步会招来更多压力。作者肯定的是制定者过去独立、强硬的作用，不是对他们现在被迫让步的状态感到满意。\n\n**作者既说独立性受损，又警告继续让步，能不能叫作对准则制定者现状“满意”？**\n\n不能。A把作者的担忧改成了认可。\n\n**判断：A排除。**\n\n---","html":"<h3>A. satisfaction</h3>\n<p>满意</p>\n<h4>如果 A 是主旨，文章应该怎么写？</h4>\n<p>如果A是作者态度，全文应把当前制度和规则变化写成令人满意的改进，结尾也应肯定现状已经解决问题。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写准则制定者的现状总体令人满意</td>\n  <td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再说明近期改变让各方问题得到缓解</td>\n  <td>再说让步已经开始发生</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>用一项变化证明制度运转得更好</td>\n  <td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>写另一方也顺利采用同样办法</td>\n  <td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>解释剩余问题不影响总体成效</td>\n  <td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后肯定当前做法并表示无需再调整</td>\n  <td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章从第2段就用<code>Unfortunately</code>和<code>compromised</code>评价游说结果，第6段又警告让步会招来更多压力。作者肯定的是制定者过去独立、强硬的作用，不是对他们现在被迫让步的状态感到满意。</p>\n<p><strong>作者既说独立性受损，又警告继续让步，能不能叫作对准则制定者现状“满意”？</strong></p>\n<p>不能。A把作者的担忧改成了认可。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr />\n","articleRects":[[145,290,1510,390],[145,645,1510,255],[145,865,1510,355],[145,1185,1510,355],[145,1500,1510,420],[145,1880,1510,400]],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"main_option","qid":"40","option":"A"}},{"section":"40题","raw":"### B. skepticism\n\n怀疑\n\n#### 如果 B 是主旨，文章应该怎么写？\n\n如果B是作者态度，文章应持续怀疑准则制定者的动机、能力或判断，银行对他们的指责应得到作者支持。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出准则制定者可能有动机或能力问题 | 先摆出一方正在怪别人 |\n| 第2段 | 再写近期事件进一步暴露其不可信 | 再说让步已经开始发生 |\n| 第3段 | 用一项失误证明他们的判断有问题 | 举一个例子把让步写具体 |\n| 第4段 | 再写另一家机构也可能作出错误决定 | 再把同样压力推到另一边 |\n| 第5段 | 解释市场问题主要来自制定者的失误 | 回头解释真正的问题在谁 |\n| 第6段 | 最后要求限制他们的权力或重新监督 | 最后下结论不能继续退让 |\n\n实际文章虽然写FASB和IASB正在让步，却没有怀疑它们原来的价值。结尾反而说成功市场需要独立、甚至强硬的准则制定者，并明确说FASB和IASB过去“exactly that”。作者怀疑的是银行的账目和说法。\n\n**全文真正被作者称为不可信的是准则制定者，还是银行及其资产账目？**\n\n后者。B把怀疑对象换错了。\n\n**判断：B排除。**\n\n---","html":"<h3>B. skepticism</h3>\n<p>怀疑</p>\n<h4>如果 B 是主旨，文章应该怎么写？</h4>\n<p>如果B是作者态度，文章应持续怀疑准则制定者的动机、能力或判断，银行对他们的指责应得到作者支持。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先提出准则制定者可能有动机或能力问题</td>\n  <td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写近期事件进一步暴露其不可信</td>\n  <td>再说让步已经开始发生</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>用一项失误证明他们的判断有问题</td>\n  <td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>再写另一家机构也可能作出错误决定</td>\n  <td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>解释市场问题主要来自制定者的失误</td>\n  <td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后要求限制他们的权力或重新监督</td>\n  <td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章虽然写FASB和IASB正在让步，却没有怀疑它们原来的价值。结尾反而说成功市场需要独立、甚至强硬的准则制定者，并明确说FASB和IASB过去“exactly that”。作者怀疑的是银行的账目和说法。</p>\n<p><strong>全文真正被作者称为不可信的是准则制定者，还是银行及其资产账目？</strong></p>\n<p>后者。B把怀疑对象换错了。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr />\n","articleRects":[[145,290,1510,390],[145,645,1510,255],[145,865,1510,355],[145,1185,1510,355],[145,1500,1510,420],[145,1880,1510,400]],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"main_option","qid":"40","option":"B"}},{"section":"40题","raw":"### C. objectiveness\n\n客观中立\n\n#### 如果 C 是主旨，文章应该怎么写？\n\n如果C是作者态度，全文应平衡呈现银行和准则制定者的理由，避免明确站队，结尾只说明争议复杂。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先平衡呈现争议双方各自的说法 | 先摆出一方正在怪别人 |\n| 第2段 | 再中性说明近期变化及其不确定影响 | 再说让步已经开始发生 |\n| 第3段 | 列出一方得到的好处和可能代价 | 举一个例子把让步写具体 |\n| 第4段 | 再列出另一方的理由和现实压力 | 再把同样压力推到另一边 |\n| 第5段 | 继续并列双方证据而不作明确判断 | 回头解释真正的问题在谁 |\n| 第6段 | 最后只总结争议仍在，不站任何一边 | 最后下结论不能继续退让 |\n\n实际文章不是中立汇报。`Unfortunately`、`compromised`、`wrong planet`、`Successful markets require`以及结尾对让步的警告都带着清楚判断。作者先转述银行观点，再逐步反驳并为独立制定者辩护。\n\n**一篇在结尾明确说哪一方是市场所必需、哪一方才“错了”的文章，还能不能算不站队？**\n\n不能。C与全文明确的评价方向不符。\n\n**判断：C排除。**\n\n---","html":"<h3>C. objectiveness</h3>\n<p>客观中立</p>\n<h4>如果 C 是主旨，文章应该怎么写？</h4>\n<p>如果C是作者态度，全文应平衡呈现银行和准则制定者的理由，避免明确站队，结尾只说明争议复杂。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先平衡呈现争议双方各自的说法</td>\n  <td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再中性说明近期变化及其不确定影响</td>\n  <td>再说让步已经开始发生</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>列出一方得到的好处和可能代价</td>\n  <td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>再列出另一方的理由和现实压力</td>\n  <td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>继续并列双方证据而不作明确判断</td>\n  <td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后只总结争议仍在，不站任何一边</td>\n  <td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章不是中立汇报。<code>Unfortunately</code>、<code>compromised</code>、<code>wrong planet</code>、<code>Successful markets require</code>以及结尾对让步的警告都带着清楚判断。作者先转述银行观点，再逐步反驳并为独立制定者辩护。</p>\n<p><strong>一篇在结尾明确说哪一方是市场所必需、哪一方才“错了”的文章，还能不能算不站队？</strong></p>\n<p>不能。C与全文明确的评价方向不符。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr />\n","articleRects":[[145,290,1510,390],[145,645,1510,255],[145,865,1510,355],[145,1185,1510,355],[145,1500,1510,420],[145,1880,1510,400]],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"main_option","qid":"40","option":"C"}},{"section":"40题","raw":"### D. sympathy\n\n同情、支持\n\n#### 如果 D 是主旨，文章应该怎么写？\n\n如果D是作者态度，文章应把准则制定者写成承受银行和政治压力的一方，指出让步会损害市场，并在结尾为他们原来的独立和强硬辩护。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写准则制定者正在承受银行指责 | 先摆出一方正在怪别人 |\n| 第2段 | 再指出这种压力已经伤到他们应有的自主地位 | 再说让步已经开始发生 |\n| 第3段 | 用FASB的让步说明受压的一方处境艰难 | 举一个例子把让步写具体 |\n| 第4段 | 再写IASB面临同样的政治压力 | 再把同样压力推到另一边 |\n| 第5段 | 把主要责任转回银行，说明制定者并非问题根源 | 回头解释真正的问题在谁 |\n| 第6段 | 最后肯定他们原来的强硬作用，并警告不要继续退让 | 最后下结论不能继续退让 |\n\n实际文章正是这条线：银行先指责，游说随后奏效，两家机构都受压；作者接着把资产高估和市场僵局的责任推回银行，最后强调成功市场需要独立且强硬的制定者，并担心它们继续作出让步。\n\n**作者批评准则制定者“现在让步”，是不是就等于作者反对他们，还是恰恰因为他希望他们顶住压力？**\n\n后者。批评让步是因为作者认同他们应保持独立和强硬，这种写法体现的是同情与支持。\n\n**判断：D保留。**\n\n---","html":"<h3>D. sympathy</h3>\n<p>同情、支持</p>\n<h4>如果 D 是主旨，文章应该怎么写？</h4>\n<p>如果D是作者态度，文章应把准则制定者写成承受银行和政治压力的一方，指出让步会损害市场，并在结尾为他们原来的独立和强硬辩护。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写准则制定者正在承受银行指责</td>\n  <td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再指出这种压力已经伤到他们应有的自主地位</td>\n  <td>再说让步已经开始发生</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>用FASB的让步说明受压的一方处境艰难</td>\n  <td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>再写IASB面临同样的政治压力</td>\n  <td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>把主要责任转回银行，说明制定者并非问题根源</td>\n  <td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后肯定他们原来的强硬作用，并警告不要继续退让</td>\n  <td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章正是这条线：银行先指责，游说随后奏效，两家机构都受压；作者接着把资产高估和市场僵局的责任推回银行，最后强调成功市场需要独立且强硬的制定者，并担心它们继续作出让步。</p>\n<p><strong>作者批评准则制定者“现在让步”，是不是就等于作者反对他们，还是恰恰因为他希望他们顶住压力？</strong></p>\n<p>后者。批评让步是因为作者认同他们应保持独立和强硬，这种写法体现的是同情与支持。</p>\n<p><strong>判断：D保留。</strong></p>\n<hr />\n","articleRects":[[145,290,1510,390],[145,645,1510,255],[145,865,1510,355],[145,1185,1510,355],[145,1500,1510,420],[145,1880,1510,400]],"questionRects":[[135,1850,1530,430]],"meta":{"kind":"main_option","qid":"40","option":"D"}},{"section":"40题","raw":"### 40题结论\n\n**40. D. sympathy**\n\n这句话就是本文后续做题的主旨底牌：\n\n**sympathy / 作者同情并支持保持独立、强硬的准则制定者**\n\n---","html":"<h3>40题结论</h3>\n<p><strong>40. D. sympathy</strong></p>\
