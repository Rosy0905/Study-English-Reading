<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**It is indicated in Paragraphs 1 and 2 that ______.**\n\n> 第1、2段说明了什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>21题题干</h2>\n<p><strong>It is indicated in Paragraphs 1 and 2 that ______.</strong></p>\n<blockquote>\n<p>第1、2段说明了什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[113,127,689,43]],"meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**Newspaper reviews in England before World War II were characterized by ______.**\n\n> 第二次世界大战以前，英国的报纸评论具有什么特点？\n\n题型：**具体细节题**。\n\n---","html":"<h2>22题题干</h2>\n<p><strong>Newspaper reviews in England before World War II were characterized by ______.</strong></p>\n<blockquote>\n<p>第二次世界大战以前，英国的报纸评论具有什么特点？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[113,407,977,43],[113,450,150,43]],"meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**Which of the following would Shaw and Newman most probably agree on?**\n\n> 下面哪个说法最可能是Shaw和Newman都会同意的？\n\n题型：**局部推断题**。\n\n---","html":"<h2>23题题干</h2>\n<p><strong>Which of the following would Shaw and Newman most probably agree on?</strong></p>\n<blockquote>\n<p>下面哪个说法最可能是Shaw和Newman都会同意的？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[113,730,1013,43]],"meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**What can be learned about Cardus according to the last two paragraphs?**\n\n> 根据最后两段，关于Cardus可以知道什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>24题题干</h2>\n<p><strong>What can be learned about Cardus according to the last two paragraphs?</strong></p>\n<blockquote>\n<p>根据最后两段，关于Cardus可以知道什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[113,1010,999,43]],"meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**What would be the best title for the text?**\n\n> 这篇文章最合适的标题是什么？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>25题题干</h2>\n<p><strong>What would be the best title for the text?</strong></p>\n<blockquote>\n<p>这篇文章最合适的标题是什么？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[113,1290,582,43]],"meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Yet, Unfortunately, though, Moreover |\n| 态度词 / 评价词 | 先抓个大概好坏 | difficult, serious, forgotten, remote |\n| 动作词 | 先看谁做了什么 | write, believed, proud, changed |\n| 结果词 | 看最后出了什么事 | decline, best-seller, only one book, retreat |\n| 重复主题词 | 大概知道老在说什么 | arts, criticism, newspaper, Cardus, music |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Yet, Unfortunately, though, Moreover</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>difficult, serious, forgotten, remote</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>write, believed, proud, changed</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>decline, best-seller, only one book, retreat</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>arts, criticism, newspaper, Cardus, music</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most **[xxx]** has been the **[xxx]** decline in the scope and seriousness of their arts coverage.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most <span class=\"mask\">[xxx]</span> has been the <span class=\"mask\">[xxx]</span> decline in the scope and seriousness of their arts coverage.</p>\n\n</div></div>","articleRects":[[114,144,970,43],[114,187,1004,43],[114,230,468,43]],"questionRects":[],"meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most **[xxx]** / has been / the **[xxx]** decline / in the scope and seriousness / of their arts coverage.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most <span class=\"mask\">[xxx]</span> / has been / the <span class=\"mask\">[xxx]</span> decline / in the scope and seriousness / of their arts coverage.</p>\n\n</div></div>","articleRects":[[114,144,970,43],[114,187,1004,43],[114,230,468,43]],"questionRects":[],"meta":{"kind":"coarse","pid":0,"form":1,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"所有变化 / that have taken place / 英文报纸 / 过去25年, / perhaps the most **[xxx]** / has been / the **[xxx]** 下降 / in the scope and seriousness / of their 艺术报道.","html":"<div class=\"coarseStack\ seDone\"><p>4、评论家几乎被忘；Cardus、1917、1975；畅销书；一本书、现在还在印。</p>\n\n</div><div class=\"coarsePara currentFocus\"><p>5、Cardus评论、有没有机会、前景很远；新闻口味、已经改变、他去世很久以前；业余传统、<span class=\"mask\">[xxx]</span>后退。</p>\n\n</div></div>","articleRects":[[114,1416,972,43],[114,1459,948,43],[114,1502,969,43],[114,1545,895,43]],"questionRects":[],"meta":{"kind":"coarse","pid":4,"form":3,"coarse":true},"contextRaw":"1、英文报纸、过去25年、**[xxx]**下降、艺术报道。\n\n2、很难、普通读者、40岁以下、高质量艺术评论、20世纪、报纸评论。\n\n3、二战前、英国、**[xxx]**报纸评论；详细、长篇、严肃的事；Shaw、Newman；日报。\n\n4、评论家几乎被忘；Cardus、1917、1975；畅销书；一本书、现在还在印。"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和英文报纸里的艺术评论有关，开头似乎说过去25年这方面出现了某种 **[xxx]** 下降；中间又出现二战前英国的报纸评论、Shaw、Newman，后面出现Cardus、畅销书和一本还在印的书，结尾还看到Cardus评论有没有机会、前景很远、新闻口味已经改变，以及业余传统在 **[xxx]** 后退。\n\n到这里还不能自然地说清楚：过去和现在到底怎样比较，Shaw、Newman和Cardus分别说明什么，Cardus为什么前景很远，整篇文章的准确逻辑是什么。粗读时只要能判断“这篇文章大概与报纸艺术评论及几个老评论家有关”，并知道这些信息大约出现在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住报纸评论、二战前、Shaw、Newman、Cardus和结尾的几个变化词块；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和英文报纸里的艺术评论有关，开头似乎说过去25年这方面出现了某种 <span class=\"mask\">[xxx]</span> 下降；中间又出现二战前英国的报纸评论、Shaw、Newman，后面出现Cardus、畅销书和一本还在印的书，结尾还看到Cardus评论有没有机会、前景很远、新闻口味已经改变，以及业余传统在 <span class=\"mask\">[xxx]</span> 后退。</p>\n<p>到这里还不能自然地说清楚：过去和现在到底怎样比较，Shaw、Newman和Cardus分别说明什么，Cardus为什么前景很远，整篇文章的准确逻辑是什么。粗读时只要能判断“这篇文章大概与报纸艺术评论及几个老评论家有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住报纸评论、二战前、Shaw、Newman、Cardus和结尾的几个变化词块；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> It is indicated in Paragraphs 1 and 2 that ______.  \n> 第1、2段放在一起，说明了什么？\n\n题干把范围圈在第1、2段，直接回文章开头精读。看选项时，就在这两段里找和它最接近的原句，再把原文的今昔变化和选项完整比一遍。\n\n> 原文参考：\n>\n> Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most **[xxx]** has been the **[xxx]** decline in the scope and seriousness of their arts coverage.\n>\n> It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to **[xxx]** at the fact that their **[xxx]** contents were once deemed suitable for publication in general-**[xxx]** dailies.\n>\n> 开始精读：\n>\n> Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most **[xxx]** / has been the **[xxx]** decline / in the scope and seriousness / of their arts coverage.\n>\n> It is difficult / to the point of impossibility / for the average reader / under the age of forty / to imagine a time / when high-quality arts criticism / could be found / in most big-city newspapers. Yet / a considerable number / of the most significant collections of criticism / published in the 20th century / consisted in large part / of newspaper reviews. To read such books today / is to **[xxx]** / at the fact / that their **[xxx]** contents / were once deemed suitable / for publication / in general-**[xxx]** dailies.\n>\n> 在所有这些变化里面 / 它们已经发生了 / 在英文报纸里面 / 在过去四分之一世纪期间，/ 也许最 **[xxx]** 的 / 已经是这种 **[xxx]** 的下降 / 在范围和严肃性方面 / 对于它们的艺术报道。\n>\n> 它是困难的 / 到了几乎不可能的程度 / 对普通读者来说 / 年龄在四十岁以下的 / 去想象一个时期 / 当高质量艺术评论 / 能够被找到 / 在大多数大城市报纸里面。然而 / 一个相当大的数量 / 最重要的评论集中的 / 出版在20世纪的 / 很大部分由……组成 / 报纸评论。今天去读这样的书 / 就是去 **[xxx]** / 对着这个事实 / 它们那些 **[xxx]** 的内容 / 曾经被认为是合适的 / 用来发表 / 在一般-**[xxx]**的日报里面。\n>\n\n现在回到题干。第1段最清楚的是：\n\n> the **[xxx]** decline in the scope and seriousness of their arts coverage\n\n也就是英文报纸的艺术报道在范围和严肃性上下降了。\n\n第2段又说：\n\n> high-quality arts criticism could be found in most big-city newspapers\n>\n> consisted in large part of newspaper reviews\n\n也就是过去大多数大城市报纸里有高质量艺术评论，不少重要评论集也大量来自报纸评论。\n\n**题干为什么把第1、2段放在一起？**\n\n因为任何一段单独拿出来都只能说明一头：第1段只告诉我们现在变差了，第2段只告诉我们过去是什么样。把两段合在一起，才能得到“过去与现在相比发生了变化”这条完整信息。所以选项不能只抄第2段里的某个熟词，也不能只复述第1段的`decline`，而要把今昔两头接住。\n\n接下来按A—D逐项看。\n","html":"<h2>21题</h2>\n<blockquote>\n<p>It is indicated in Paragraphs 1 and 2 that ______.<br />\n第1、2段放在一起，说明了什么？</p>\n</blockquote>\n<p>题干把范围圈在第1、2段，直接回文章开头精读。看选项时，就在这两段里找和它最接近的原句，再把原文的今昔变化和选项完整比一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most <span class=\"mask\">[xxx]</span> has been the <span class=\"mask\">[xxx]</span> decline in the scope and seriousness of their arts coverage.</p>\n<p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to <span class=\"mask\">[xxx]</span> at the fact that their <span class=\"mask\">[xxx]</span> contents were once deemed suitable for publication in general-<span class=\"mask\">[xxx]</span> dailies.</p>\n<p>开始精读：</p>\n<p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most <span class=\"mask\">[xxx]</span> / has been the <span class=\"mask\">[xxx]</span> decline / in the scope and seriousness / of their arts coverage.</p>\n<p>It is difficult / to the point of impossibility / for the average reader / under the age of forty / to imagine a time / when high-quality arts criticism / could be found / in most big-city newspapers. Yet / a considerable number / of the most significant collections of criticism / published in the 20th century / consisted in large part / of newspaper reviews. To read such books today / is to <span class=\"mask\">[xxx]</span> / at the fact / that their <span class=\"mask\">[xxx]</span> contents / were once deemed suitable / for publication / in general-<span class=\"mask\">[xxx]</span> dailies.</p>\n<p>在所有这些变化里面 / 它们已经发生了 / 在英文报纸里面 / 在过去四分之一世纪期间，/ 也许最 <span class=\"mask\">[xxx]</span> 的 / 已经是这种 <span class=\"mask\">[xxx]</span> 的下降 / 在范围和严肃性方面 / 对于它们的艺术报道。</p>\n<p>它是困难的 / 到了几乎不可能的程度 / 对普通读者来说 / 年龄在四十岁以下的 / 去想象一个时期 / 当高质量艺术评论 / 能够被找到 / 在大多数大城市报纸里面。然而 / 一个相当大的数量 / 最重要的评论集中的 / 出版在20世纪的 / 很大部分由……组成 / 报纸评论。今天去读这样的书 / 就是去 <span class=\"mask\">[xxx]</span> / 对着这个事实 / 它们那些 <span class=\"mask\">[xxx]</span> 的内容 / 曾经被认为是合适的 / 用来发表 / 在一般-<span class=\"mask\">[xxx]</span>的日报里面。</p>\n</blockquote>\n<p>现在回到题干。第1段最清楚的是：</p>\n<blockquote>\n<p>the <span class=\"mask\">[xxx]</span> decline in the scope and seriousness of their arts coverage</p>\n</blockquote>\n<p>也就是英文报纸的艺术报道在范围和严肃性上下降了。</p>\n<p>第2段又说：</p>\n<blockquote>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>consisted in large part of newspaper reviews</p>\n</blockquote>\n<p>也就是过去大多数大城市报纸里有高质量艺术评论，不少重要评论集也大量来自报纸评论。</p>\n<p><strong>题干为什么把第1、2段放在一起？</strong></p>\n<p>因为任何一段单独拿出来都只能说明一头：第1段只告诉我们现在变差了，第2段只告诉我们过去是什么样。把两段合在一起，才能得到“过去与现在相比发生了变化”这条完整信息。所以选项不能只抄第2段里的某个熟词，也不能只复述第1段的<code>decline</code>，而要把今昔两头接住。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[114,144,970,43],[114,187,1004,43],[114,230,468,43],[114,290,973,43],[114,333,960,43],[114,376,1001,43],[114,419,946,43],[114,462,989,43],[114,505,722,43]],"questionRects":[[113,127,689,43]],"meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. arts criticism has disappeared from big-city newspapers\n\n> 艺术评论已经从大城市报纸中消失\n\n把A接回题干，它说的是：第1、2段表明，现在大城市报纸里已经完全没有艺术评论了。\n\n看A时，`arts criticism`和`big-city newspapers`让人依稀想起刚才读过的第2段；`disappeared`又好像要和第1段的`decline`比程度。\n\n大概记得这几块分别在第1、2段出现过，先回到下面两处确认一下，看原文原来是怎么接的：\n\n> the **[xxx]** decline in the scope and seriousness of their arts coverage\n>\n> high-quality arts criticism could be found in most big-city newspapers\n\n第2段确实给了同一个对象，第1段也确实写了变化，所以A会让人觉得很像原文。可原文只说艺术报道的范围在缩小、严肃性在变弱，还没有说它已经彻底没了。\n\n**原文只是说艺术报道在变少、变弱，能不能直接说它已经完全消失？**\n\n不能。要选`disappeared`，至少得在第1、2段里找到“现在大城市报纸已经完全不再刊登艺术评论”这样的明确内容；原文没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. arts criticism has disappeared from big-city newspapers</h3>\n<blockquote>\n<p>艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p>把A接回题干，它说的是：第1、2段表明，现在大城市报纸里已经完全没有艺术评论了。</p>\n<p>看A时，<code>arts criticism</code>和<code>big-city newspapers</code>让人依稀想起刚才读过的第2段；<code>disappeared</code>又好像要和第1段的<code>decline</code>比程度。</p>\n<p>大概记得这几块分别在第1、2段出现过，先回到下面两处确认一下，看原文原来是怎么接的：</p>\n<blockquote>\n<p>the <span class=\"mask\">[xxx]</span> decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote>\n<p>第2段确实给了同一个对象，第1段也确实写了变化，所以A会让人觉得很像原文。可原文只说艺术报道的范围在缩小、严肃性在变弱，还没有说它已经彻底没了。</p>\n<p><strong>原文只是说艺术报道在变少、变弱，能不能直接说它已经完全消失？</strong></p>\n<p>不能。要选<code>disappeared</code>，至少得在第1、2段里找到“现在大城市报纸已经完全不再刊登艺术评论”这样的明确内容；原文没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[114,187,1004,43],[114,230,468,43],[114,333,960,43],[114,376,1001,43]],"questionRects":[[113,127,689,43],[150,180,720,43]],"meta":{"kind":"option","qid":"21","option":"A","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"21题","raw":"### B. English-language newspapers used to carry more arts reviews\n\n> 英文报纸过去会刊登更多艺术评论\n\n把B接回题干，它说的是：第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。\n\nB里的`English-language newspapers`和`arts reviews`看着都很眼熟，好像在题干限定的第1、2段出现过；`used to`又让人隐约想到，文章可能在拿过去和现在作比较。\n\n刚才读下来，大概能感觉到第1段在写现在的变化，第2段在回看过去，先把下面几句放在一起：\n\n> the **[xxx]** decline in the scope and seriousness of their arts coverage\n>\n> high-quality arts criticism could be found in most big-city newspapers\n>\n> a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews\n\n第一句写现在在`decline`；后两句写过去多数大城市报纸能看到高质量艺术评论，不少重要评论集也大量来自报纸评论。`more`不是某个词的直接替换，而是把现在和过去放在一起后得到的关系。\n\n**第2段只是在说评论写得好，还是也在说这种评论过去很常见？**\n\n两层都有。`high-quality`说明质量，`most big-city newspapers`和“大量评论集来自报纸评论”又说明它过去并不罕见。再接上第1段的下降，B正好把两段共同说明的变化概括出来。\n\n**第一轮判断：B保留。**","html":"<h3>B. English-language newspapers used to carry more arts reviews</h3>\n<blockquote>\n<p>英文报纸过去会刊登更多艺术评论</p>\n</blockquote>\n<p>把B接回题干，它说的是：第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。</p>\n<p>B里的<code>English-language newspapers</code>和<code>arts reviews</code>看着都很眼熟，好像在题干限定的第1、2段出现过；<code>used to</code>又让人隐约想到，文章可能在拿过去和现在作比较。</p>\n<p>刚才读下来，大概能感觉到第1段在写现在的变化，第2段在回看过去，先把下面几句放在一起：</p>\n<blockquote>\n<p>the <span class=\"mask\">[xxx]</span> decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews</p>\n</blockquote>\n<p>第一句写现在在<code>decline</code>；后两句写过去多数大城市报纸能看到高质量艺术评论，不少重要评论集也大量来自报纸评论。<code>more</code>不是某个词的直接替换，而是把现在和过去放在一起后得到的关系。</p>\n<p><strong>第2段只是在说评论写得好，还是也在说这种评论过去很常见？</strong></p>\n<p>两层都有。<code>high-quality</code>说明质量，<code>most big-city newspapers</code>和“大量评论集来自报纸评论”又说明它过去并不罕见。再接上第1段的下降，B正好把两段共同说明的变化概括出来。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[114,187,1004,43],[114,230,468,43],[114,333,960,43],[114,376,1001,43],[114,419,946,43],[114,462,989,43]],"questionRects":[[113,127,689,43],[150,230,791,43]],"meta":{"kind":"option","qid":"21","option":"B","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"21题","raw":"### C. high-quality newspapers retain a large body of readers\n\n> 高质量报纸仍然拥有大量读者\n\n把C接回题干，它说的是：第1、2段表明，高质量报纸现在仍然保有大量读者。\n\nC里的`high-quality`、`newspapers`和`readers`都让人觉得好像在第2段见过。题干又圈了第1、2段，所以先回去看看这些词原来是不是连在一起。\n\n依稀记得它们好像都在刚才精读过的范围里，先把原句找出来确认一下，看它们分别修饰谁：\n\n> for the average reader under the age of forty\n>\n> high-quality arts criticism could be found in most big-city newspapers\n\n**原文说的是“高质量的报纸”，还是“报纸里有高质量的艺术评论”？**\n\n后者。把这些词放回原句就能看出：`high-quality`修饰的是`arts criticism`，不是`newspapers`；`reader under the age of forty`说的是一类读者，也不是“报纸保有大量读者”。\n\nC只是把原文里的几个词重新拼了一遍。一个修饰对象换了，另一个人物关系也换了；原文既没有统计读者数量，也没有`retain`这层意思。\n\n**第一轮判断：C排除。**","html":"<h3>C. high-quality newspapers retain a large body of readers</h3>\n<blockquote>\n<p>高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p>把C接回题干，它说的是：第1、2段表明，高质量报纸现在仍然保有大量读者。</p>\n<p>C里的<code>high-quality</code>、<code>newspapers</code>和<code>readers</code>都让人觉得好像在第2段见过。题干又圈了第1、2段，所以先回去看看这些词原来是不是连在一起。</p>\n<p>依稀记得它们好像都在刚才精读过的范围里，先把原句找出来确认一下，看它们分别修饰谁：</p>\n<blockquote>\n<p>for the average reader under the age of forty</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote>\n<p><strong>原文说的是“高质量的报纸”，还是“报纸里有高质量的艺术评论”？</strong></p>\n<p>后者。把这些词放回原句就能看出：<code>high-quality</code>修饰的是<code>arts criticism</code>，不是<code>newspapers</code>；<code>reader under the age of forty</code>说的是一类读者，也不是“报纸保有大量读者”。</p>\n<p>C只是把原文里的几个词重新拼了一遍。一个修饰对象换了，另一个人物关系也换了；原文既没有统计读者数量，也没有<code>retain</code>这层意思。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[114,290,973,43],[114,333,960,43],[114,376,1001,43]],"questionRects":[[113,127,689,43],[150,280,702,43]],"meta":{"kind":"option","qid":"21","option":"C","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"21题","raw":"### D. young readers doubt the **[xxx]** of criticism on dailies\n\n> 年轻读者怀疑日报上评论的 **[xxx]**\n\n把D接回题干，它说的是：第1、2段表明，年轻读者会怀疑日报上评论的某个方面。\n\nD里能读懂的是`young readers`和`criticism on dailies`。这两块看着都像刚才第2段里的内容，所以先回去确认一下，看原文究竟把年轻读者、评论和日报接成了什么关系。\n\nD里的几个词让人觉得第2段好像都出现过，但它们是不是在说同一件事还不清楚，先回到这两处：\n\n> for the average reader under the age of forty to imagine a time ...\n>\n> To read such books today is to **[xxx]** at the fact that their **[xxx]** contents were once deemed suitable for publication in general-**[xxx]** dailies.\n\n原文确实写了40岁以下的读者，也写了过去的评论曾经能刊登在日报上。现在能确认的只是人物和话题对上了；年轻读者是什么反应、D里到底怀疑什么，这两个关键位置都被挡住。\n\n**只凭`young readers`和`criticism on dailies`两个眼熟词，能不能判断年轻读者到底在怀疑什么？**\n\n不能。整句话往哪边走还看不清，此时不能只凭两个眼熟词就排除，也不能替两个 **[xxx]** 补意思。所以D没有B顺，但暂时还得留下。\n\n**第一轮判断：D保留。**","html":"<h3>D. young readers doubt the <span class=\"mask\">[xxx]</span> of criticism on dailies</h3>\n<blockquote>\n<p>年轻读者怀疑日报上评论的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：第1、2段表明，年轻读者会怀疑日报上评论的某个方面。</p>\n<p>D里能读懂的是<code>young readers</code>和<code>criticism on dailies</code>。这两块看着都像刚才第2段里的内容，所以先回去确认一下，看原文究竟把年轻读者、评论和日报接成了什么关系。</p>\n<p>D里的几个词让人觉得第2段好像都出现过，但它们是不是在说同一件事还不清楚，先回到这两处：</p>\n<blockquote>\n<p>for the average reader under the age of forty to imagine a time ...</p>\n<p>To read such books today is to <span class=\"mask\">[xxx]</span> at the fact that their <span class=\"mask\">[xxx]</span> contents were once deemed suitable for publication in general-<span class=\"mask\">[xxx]</span> dailies.</p>\n</blockquote>\n<p>原文确实写了40岁以下的读者，也写了过去的评论曾经能刊登在日报上。现在能确认的只是人物和话题对上了；年轻读者是什么反应、D里到底怀疑什么，这两个关键位置都被挡住。</p>\n<p><strong>只凭<code>young readers</code>和<code>criticism on dailies</code>两个眼熟词，能不能判断年轻读者到底在怀疑什么？</strong></p>\n<p>不能。整句话往哪边走还看不清，此时不能只凭两个眼熟词就排除，也不能替两个 <span class=\"mask\">[xxx]</span> 补意思。所以D没有B顺，但暂时还得留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[114,290,973,43],[114,333,960,43],[114,462,989,43],[114,505,722,43]],"questionRects":[[113,127,689,43],[150,330,655,43]],"meta":{"kind":"option","qid":"21","option":"D","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"21题","raw":"### 21题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D保留。\n\n现在剩下B和D。B能把第1段的下降和第2段对过去的回看直接连起来；D的两个关键位置还被挡着，所以先留到后面再看。第一轮先停在这里。","html":"<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；< red. Theirs was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know what they were about. These men believed in journalism / as a **[xxx]**, / and were proud / to be published / in the daily press. “So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” Newman wrote, / “that I am tempted / to define ‘journalism’ / as ‘a term of **[xxx]** / applied by writers / who are not read / to writers who are’.”\n>\n> 我们甚至更加远离 / 那些 **[xxx]** 的报纸评论 / 它们发表在英国 / 在20世纪之交 / 和第二次世界大战前夕之间，/ 在一个时期 / 那时 **[xxx]** 便宜得像土 / 并且有风格的艺术评论 / 被认为是一个 **[xxx]** / 对那些出版物来说 / 它出现在里面的。在那些遥远的日子里，/ 它被当作理所当然 / 大报的评论家 / 会详细地并且长篇地写 / 关于他们报道的事情。他们的是一件严肃的事情，/ 而且甚至那些评论家 / 把自己的学问穿得很轻，/ 像George Bernard Shaw和Ernest Newman，/ 可以被信任 / 知道他们在做什么。这些人相信新闻写作 / 作为一种 **[xxx]**，/ 并且感到自豪 / 被发表 / 在日报上。“如此少的作者 / 有足够的头脑 / 或者足够的文学天赋 / 去把他们自己的那一头撑住 / 在新闻写作里面，”Newman写道，/ “以至于我被诱惑 / 去定义‘journalism’ / 作为‘一个 **[xxx]** 的称呼 / 被作家使用 / 那些不被阅读的 / 去称呼那些被阅读的作家’。”\n>\n\n把这一段顺着读下来，先抓住三件事：大报评论家会围绕自己报道的事情写得详细而且很长；他们把这当成一件严肃的工作；Shaw和Newman也被认为清楚自己在做什么。\n\n第三段开头还有一个看不懂的词放在`newspaper reviews`前面。这个词具体在说什么，现在不知道，所以先不猜它，直接看四个选项里已经认识的部分能排掉什么。\n","html":"<h2>22题</h2>\n<blockquote>\n<p>Newspaper reviews in England before World War II were characterized by ______.<br />\n第二次世界大战以前，英国的报纸评论具有什么特点？</p>\n</blockquote>\n<p>题干里最显眼的是<code>newspaper reviews</code>、<code>in England</code>和<code>before World War II</code>。粗读时我们记得中间出现过“二战前、英国、报纸评论”，现在再用题干里的这三个词回到第三段开头。先把整段精读完；后面看选项时，再分别找和每一项最接近的原句。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>We are even farther removed from the <span class=\"mask\">[xxx]</span> newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when <span class=\"mask\">[xxx]</span> was dirt-cheap and stylish arts criticism was considered an <span class=\"mask\">[xxx]</span> to the publications in which it appeared. In those far-off days, g></p>\n<p>前者。要选<code>casual style</code>，原文至少得把评论本身写成轻松、松散或不拘一格；第三段没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[114,737,998,43],[114,780,978,43],[114,823,958,43],[114,866,991,43]],"questionRects":[[113,407,977,43],[113,450,150,43],[150,553,190,43]],"meta":{"kind":"option","qid":"22","option":"B","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"22题","raw":"### C. **[xxx]** layout\n\n> **[xxx]** 的版式、排布\n\n把C接回题干，它说的是：二战前英国报纸评论的版式或排布具有某种 **[xxx]** 的特点。\n\n乍一看，C里的`layout`会让人隐约想到刚才好像读过的`in detail and at length`，两边都像在说“形式”，所以先回到这句确认一下：\n\n> the critics of major papers would write in detail and at length about the events they covered\n\n**`in detail and at length`说的是内容写得细、写得长，能不能直接变成页面版式？**\n\n不能。`layout`已经把选项锁定在页面、栏目或排版上。原文的`in detail and at length`说的是内容展开得细、篇幅写得长。\n\n前面的 **[xxx]** 只会告诉我们“什么样的版式”，改不了`layout`这个中心意思；第三段也没有页面或排版方面的内容。\n\n**第一轮判断：C排除。**","html":"<h3>C. <span class=\"mask\">[xxx]</span> layout</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的版式、排布</p>\n</blockquote>\n<p>把C接回题干，它说的是：二战前英国报纸评论的版式或排布具有某种 <span class=\"mask\">[xxx]</span> 的特点。</p>\n<p>乍一看，C里的<code>layout</code>会让人隐约想到刚才好像读过的<code>in detail and at length</code>，两边都像在说“形式”，所以先回到这句确认一下：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n</blockquote>\n<p><strong><code>in detail and at length</code>说的是内容写得细、写得长，能不能直接变成页面版式？</strong></p>\n<p>不能。<code>layout</code>已经把选项锁定在页面、栏目或排版上。原文的<code>in detail and at length</code>说的是内容展开得细、篇幅写得长。</p>\n<p>前面的 <span class=\"mask\">[xxx]</span> 只会告诉我们“什么样的版式”，改不了<code>layout</code>这个中心意思；第三段也没有页面或排版方面的内容。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[114,737,998,43],[114,780,978,43]],"questionRects":[[113,407,977,43],[113,450,150,43],[150,603,171,43]],"meta":{"kind":"option","qid":"22","option":"C","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"22题","raw":"### D. radical viewpoints\n\n> 激进的观点\n\n把D接回题干，它说的是：二战前英国报纸评论普遍以激进观点为特点。\n\nD说的是整类报纸评论的观点很激进。看到这个说法，脑子里可能会先冒出Newman后面的个人引语，所以回去看看他到底说了什么：\n\n> “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of **[xxx]** applied by writers who are not read to writers who are’.”\n\n**Newman一个人的说法，能不能直接变成整类报纸评论的共同特点？**\n\n不能。Newman的引语只是一个人的说法，内容也在谈作家有没有能力做好新闻写作。D却把它改成“整类报纸评论都以激进观点为特点”。\n\n要选D，原文至少还得连续写多位评论家的激进立场，或者明确说这类评论以激进观点见长；第三段没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. radical viewpoints</h3>\n<blockquote>\n<p>激进的观点</p>\n</blockquote>\n<p>把D接回题干，它说的是：二战前英国报纸评论普遍以激进观点为特点。</p>\n<p>D说的是整类报纸评论的观点很激进。看到这个说法，脑子里可能会先冒出Newman后面的个人引语，所以回去看看他到底说了什么：</p>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of <span class=\"mask\">[xxx]</span> applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n<p><strong>Newman一个人的说法，能不能直接变成整类报纸评论的共同特点？</strong></p>\n<p>不能。Newman的引语只是一个人的说法，内容也在谈作家有没有能力做好新闻写作。D却把它改成“整类报纸评论都以激进观点为特点”。</p>\n<p>要选D，原文至少还得连续写多位评论家的激进立场，或者明确说这类评论以激进观点见长；第三段没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[114,909,954,43],[114,952,979,43],[114,995,925,43],[114,1038,559,43]],"questionRects":[[113,407,977,43],[113,450,150,43],[150,653,273,43]],"meta":{"kind":"option","qid":"22","option":"D","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"22题","raw":"### 22题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除。\n\nA还没有得到正面证明，但B、C、D都能凭已经读懂的部分排掉。第三段开头的 **[xxx]** 仍然不用猜，排除后三项即可选择A。\n\n> **22题选A。**","html":"<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A还没有得到正面证明，但B、C、D都能凭已经读懂的部分排掉。第三段开头的 <span class=\"mask\">[xxx]</span> 仍然不用猜，排除后三项即可选择A。</p>\n<blockquote>\n<p><strong>22题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[113,407,977,43],[113,450,150,43],[150,503,191,43],[150,553,190,43],[150,603,171,43],[150,653,273,43]],"meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> Which of the following would Shaw and Newman most probably agree on?  \n> 下面哪个说法最可能是Shaw和Newman都会同意的？\n\n题干点名`Shaw and Newman`。上一题已经把第三段精读过，这两个人就在后半段，所以沿用刚才读到的内容。某个选项如果又让我们想到别处的内容，再回原文补读那一处。\n\n> 原文参考：\n>\n> Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a **[xxx]**, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of **[xxx]** applied by writers who are not read to writers who are’.”\n>\n> 开始精读：\n>\n> Theirs was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know what they were about. These men believed in journalism / as a **[xxx]**, / and were proud / to be published / in the daily press. “So few authors / have brains enough / or literary gift enough / to keep their own end up / in journalism,” Newman wrote, / “that I am tempted / to define ‘journalism’ / as ‘a term of **[xxx]** / applied by writers / who are not read / to writers who are’.”\n>\n> 他们的是一件严肃的事情，/ 而且甚至那些评论家 / 把自己的学问穿得很轻，/ 像George Bernard Shaw和Ernest Newman，/ 可以被信任 / 知道他们在做什么。这些人相信新闻写作 / 作为一种 **[xxx]**，/ 并且感到自豪 / 被发表 / 在日报上。“如此少的作者 / 有足够的头脑 / 或者足够的文学天赋 / 去把他们自己的那一头撑住 / 在新闻写作里面，”Newman写道，/ “以至于我被诱惑 / 去定义‘journalism’ / 作为‘一个 **[xxx]** 的称呼 / 被作家使用 / 那些不被阅读的 / 去称呼那些被阅读的作家’。”\n>\n\n这里先分清两类话。\n\n前面写：\n\n> like George Bernard Shaw and Ernest Newman\n>\n> These men believed in journalism as a **[xxx]**, and were proud to be published in the daily press\n\n`These men`接着说的就是Shaw和Newman，所以这是对两个人的共同描写。\n\n后面的引语明确写着：\n\n> Newman wrote\n\n因此，这段引语只能先直接说明Newman怎么想，不能因为Shaw刚好也在前面出现，就自动算成Shaw亲口表达了同样的意思。\n\n题干问的是两个人“最可能”共同同意什么。共同描写可以直接用；Newman的引语如果要推到两个人身上，还要看它能不能接上前面对两人的共同描写。\n","html":"<h2>23题</h2>\n<blockquote>\n<p>Which of the following would Shaw and Newman most probably agree on?<br />\n下面哪个说法最可能是Shaw和Newman都会同意的？</p>\n</blockquote>\n<p>题干点名<code>Shaw and Newman</code>。上一题已经把第三段精读过，这两个人就在后半段，所以沿用刚才读到的内容。某个选项如果又让我们想到别处的内容，再回原文补读那一处。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a <span class=\"mask\">[xxx]</span>, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of <span class=\"mask\">[xxx]</span> applied by writers who are not read to writers who are’.”</p>\n<p>开始精读：</p>\n<p>Theirs was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know what they were about. These men believed in journalism / as a <span class=\"mask\">[xxx]</span>, / and were proud / to be published / in the daily press. “So few authors / have brains enough / or literary gift enough / to keep their own end up / in journalism,” Newman wrote, / “that I am tempted / to define ‘journalism’ / as ‘a term of <span class=\"mask\">[xxx]</span> / applied by writers / who are not read / to writers who are’.”</p>\n<p>他们的是一件严肃的事情，/ 而且甚至那些评论家 / 把自己的学问穿得很轻，/ 像George Bernard Shaw和Ernest Newman，/ 可以被信任 / 知道他们在做什么。这些人相信新闻写作 / 作为一种 <span class=\"mask\">[xxx]</span>，/ 并且感到自豪 / 被发表 / 在日报上。“如此少的作者 / 有足够的头脑 / 或者足够的文学天赋 / 去把他们自己的那一头撑住 / 在新闻写作里面，”Newman写道，/ “以至于我被诱惑 / 去定义‘journalism’ / 作为‘一个 <span class=\"mask\">[xxx]</span> 的称呼 / 被作家使用 / 那些不被阅读的 / 去称呼那些被阅读的作家’。”</p>\n</blockquote>\n<p>这里先分清两类话。</p>\n<p>前面写：</p>\n<blockquote>\n<p>like George Bernard Shaw and Ernest Newman</p>\n<p>These men believed in journalism as a <span class=\"mask\">[xxx]</span>, and were proud to be published in the daily press</p>\n</blockquote>\n<p><code>These men</code>接着说的就是Shaw和Newman，所以这是对两个人的共同描写。</p>\n<p>后面的引语明确写着：</p>\n<blockquote>\n<p>Newman wrote</p>\n</blockquote>\n<p>因此，这段引语只能先直接说明Newman怎么想，不能因为Shaw刚好也在前面出现，就自动算成Shaw亲口表达了同样的意思。</p>\n<p>题干问的是两个人“最可能”共同同意什么。共同描写可以直接用；Newman的引语如果要推到两个人身上，还要看它能不能接上前面对两人的共同描写。</p>\n","articleRects":[[114,565,906,43],[114,608,954,43],[114,651,970,43],[114,694,1010,43],[114,737,998,43],[114,780,978,43],[114,823,958,43],[114,866,991,43],[114,909,954,43],[114,952,979,43],[114,995,925,43],[114,1038,559,43]],"questionRects":[[113,730,1013,43]],"meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. It is writers’ duty to fulfill journalistic goals.\n\n> 完成新闻写作目标是作家的责任\n\n把A接回题干，它说的是：Shaw和Newman认为，作家有责任完成某种新闻写作目标。\n\nA里的`writers`和`journalistic`看着很眼熟，依稀记得上一题读第三段后半部分时见过。先回去把相关句子找出来确认一下：\n\n> These men believed in journalism as a **[xxx]**, and were proud to be published in the daily press.\n>\n> So few authors have brains enough or literary gift enough to keep their own end up in journalism\n\n**原文说“做好新闻写作需要能力”，能不能直接改成“作家有责任完成新闻目标”？**\n\n不能。原文在谈两件事：他们怎样看待新闻写作，以及做好它需要头脑和文学才能。A却改成“作家有责任完成新闻目标”。\n\n要选A，原文至少得出现`duty`、`should`，或者明确写出作家要履行什么职责、达到什么目标；这一段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. It is writers’ duty to fulfill journalistic goals.</h3>\n<blockquote>\n<p>完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p>把A接回题干，它说的是：Shaw和Newman认为，作家有责任完成某种新闻写作目标。</p>\n<p>A里的<code>writers</code>和<code>journalistic</code>看着很眼熟，依稀记得上一题读第三段后半部分时见过。先回去把相关句子找出来确认一下：</p>\n<blockquote>\n<p>These men believed in journalism as a <span class=\"mask\">[xxx]</span>, and were proud to be published in the daily press.</p>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism</p>\n</blockquote>\n<p><strong>原文说“做好新闻写作需要能力”，能不能直接改成“作家有责任完成新闻目标”？</strong></p>\n<p>不能。原文在谈两件事：他们怎样看待新闻写作，以及做好它需要头脑和文学才能。A却改成“作家有责任完成新闻目标”。</p>\n<p>要选A，原文至少得出现<code>duty</code>、<code>should</code>，或者明确写出作家要履行什么职责、达到什么目标；这一段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[114,866,991,43],[114,909,954,43],[114,952,979,43]],"questionRects":[[113,730,1013,43],[150,783,587,43]],"meta":{"kind":"option","qid":"23","option":"A","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"23题","raw":"### B. It is **[xxx]** for writers to be journalists.\n\n> 对作家来说，做新闻工作者是 **[xxx]** 的\n\n把B接回题干，它说的是：Shaw和Newman认为，作家做新闻工作者是一件 **[xxx]** 的事。\n\nB说的人和事都和第三段后半部分很像。大概记得那里一边写两人怎么看新闻写作，一边又出现一个带评价的说法，先回去确认：\n\n> These men believed in journalism as a **[xxx]**, and were proud to be published in the daily press.\n>\n> a term of **[xxx]** applied by writers who are not read to writers who are\n\n`were proud`说明两人并不排斥在日报发表，这只能给出一个大方向。\n\n**`were proud`能不能让我们直接判断B里被挡住的那个词到底是在夸还是在贬？**\n\n不能。B的方向仍由选项里的 **[xxx]** 决定；原文里可能相关的两个评价词也都被挡住。\n\n现在不能把B确定下来，也不能因为`were proud`就直接排掉，只能先保留。\n\n**第一轮判断：B保留。**","html":"<h3>B. It is <span class=\"mask\">[xxx]</span> for writers to be journalists.</h3>\n<blockquote>\n<p>对作家来说，做新闻工作者是 <span class=\"mask\">[xxx]</span> 的</p>\n</blockquote>\n<p>把B接回题干，它说的是：Shaw和Newman认为，作家做新闻工作者是一件 <span class=\"mask\">[xxx]</span> 的事。</p>\n<p>B说的人和事都和第三段后半部分很像。大概记得那里一边写两人怎么看新闻写作，一边又出现一个带评价的说法，先回去确认：</p>\n<blockquote>\n<p>These men believed in journalism as a <span class=\"mask\">[xxx]</span>, and were proud to be published in the daily press.</p>\n<p>a term of <span class=\"mask\">[xxx]</span> applied by writers who are not read to writers who are</p>\n</blockquote>\n<p><code>were proud</code>说明两人并不排斥在日报发表，这只能给出一个大方向。</p>\n<p><strong><code>were proud</code>能不能让我们直接判断B里被挡住的那个词到底是在夸还是在贬？</strong></p>\n<p>不能。B的方向仍由选项里的 <span class=\"mask\">[xxx]</span> 决定；原文里可能相关的两个评价词也都被挡住。</p>\n<p>现在不能把B确定下来，也不能因为<code>were proud</code>就直接排掉，只能先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[114,866,991,43],[114,909,954,43],[114,995,925,43],[114,1038,559,43]],"questionRects":[[113,730,1013,43],[150,833,482,43]],"meta":{"kind":"option","qid":"23","option":"B","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"23题","raw":"### C. Writers are likely to be tempted into journalism.\n\n> 作家很可能受到诱惑而进入新闻业\n\n把C接回题干，它说的是：Shaw和Newman认为，作家很容易受到诱惑而进入新闻业。\n\nC里的`tempted`和`journalism`让人依稀想起Newman的引语，好像原句里就有这两个词。先回去看看当时的主语和动作到底是什么：\n\n> Newman wrote, “that I am tempted to define ‘journalism’ ...”\n\n**Newman说“我忍不住想定义`journalism`”，能不能改成“作家容易被吸引进入新闻业”？**\n\n不能。原文是Newman说“我忍不住想定义`journalism`”；C变成“作家容易被吸引进入新闻业”。主语从`I`换成`Writers`，`to define`也换成了“进入新闻业”。\n\n两个眼熟的词还在，整件事已经变了。\n\n**第一轮判断：C排除。**","html":"<h3>C. Writers are likely to be tempted into journalism.</h3>\n<blockquote>\n<p>作家很可能受到诱惑而进入新闻业</p>\n</blockquote>\n<p>把C接回题干，它说的是：Shaw和Newman认为，作家很容易受到诱惑而进入新闻业。</p>\n<p>C里的<code>tempted</code>和<code>journalism</code>让人依稀想起Newman的引语，好像原句里就有这两个词。先回去看看当时的主语和动作到底是什么：</p>\n<blockquote>\n<p>Newman wrote, “that I am tempted to define ‘journalism’ ...”</p>\n</blockquote>\n<p><strong>Newman说“我忍不住想定义<code>journalism</code>”，能不能改成“作家容易被吸引进入新闻业”？</strong></p>\n<p>不能。原文是Newman说“我忍不住想定义<code>journalism</code>”；C变成“作家容易被吸引进入新闻业”。主语从<code>I</code>换成<code>Writers</code>，<code>to define</code>也换成了“进入新闻业”。</p>\n<p>两个眼熟的词还在，整件事已经变了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[114,952,979,43],[114,995,925,43],[114,1038,559,43]],"questionRects":[[113,730,1013,43],[150,883,627,43]],"meta":{"kind":"option","qid":"23","option":"C","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"23题","raw":"### D. Not all writers are capable of journalistic writing.\n\n> 并不是所有作家都有能力进行新闻写作\n\n把D接回题干，它说的是：Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。\n\nD里的`writers`、`capable`和`journalistic writing`看着像是在说“有没有能力做好新闻写作”。依稀记得第三段有一句提到作者有没有足够的头脑和文学才能，所以先回去确认。\n\n大概对应的是：\n\n> So few authors have brains enough or literary gift enough to keep their own end up in journalism\n\n前面好像还有两句同时写到两人：\n\n> like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about\n>\n> These men believed in journalism as a **[xxx]**, and were proud to be published in the daily press.\n\n`So few authors have brains enough or literary gift enough...`直接说明，真正有头脑和文学才能、能在新闻写作中撑住的作者很少，所以D能代表Newman的看法。\n\n**Newman的这句话能不能直接算Shaw也同意？**\n\n单看引语还不能。个人原话只能先证明个人；不过，这句引语紧跟在对Shaw和Newman的共同描写后面，和“两人都认真看待新闻写作、也被认为有能力”能够接起来，所以D很有可能，先留到后面用全文方向再核对。\n\n**第一轮判断：D保留。**","html":"<h3>D. Not all writers are capable of journalistic writing.</h3>\n<blockquote>\n<p>并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p>把D接回题干，它说的是：Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。</p>\n<p>D里的<code>writers</code>、<code>capable</code>和<code>journalistic writing</code>看着像是在说“有没有能力做好新闻写作”。依稀记得第三段有一句提到作者有没有足够的头脑和文学才能，所以先回去确认。</p>\n<p>大概对应的是：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism</p>\n</blockquote>\n<p>前面好像还有两句同时写到两人：</p>\n<blockquote>\n<p>like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about</p>\n<p>These men believed in journalism as a <span class=\"mask\">[xxx]</span>, and were proud to be published in the daily press.</p>\n</blockquote>\n<p><code>So few authors have brains enough or literary gift enough...</code>直接说明，真正有头脑和文学才能、能在新闻写作中撑住的作者很少，所以D能代表Newman的看法。</p>\n<p><strong>Newman的这句话能不能直接算Shaw也同意？</strong></p>\n<p>单看引语还不能。个人原话只能先证明个人；不过，这句引语紧跟在对Shaw和Newman的共同描写后面，和“两人都认真看待新闻写作、也被认为有能力”能够接起来，所以D很有可能，先留到后面用全文方向再核对。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[114,823,958,43],[114,866,991,43],[114,909,954,43],[114,952,979,43]],"questionRects":[[113,730,1013,43],[150,933,645,43]],"meta":{"kind":"option","qid":"23","option":"D","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"multiple_sources","status":"保留"}}},{"section":"23题","raw":"### 23题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D保留。\n\n现在剩下B和D。\n\nB的问题是，决定整句话意思的 **[xxx]** 还不认识；D的问题是，最直接的话由Newman说出，还要再确认它能不能和前面对两人的共同描写接起来。就局部原文看，D更有可能，后面再结合全文方向回查。","html":"<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>现在剩下B和D。</p>\n<p>B的问题是，决定整句话意思的 <span class=\"mask\">[xxx]</span> 还不认识；D的问题是，最直接的话由Newman说出，还要再确认它能不能和前面对两人的共同描写接起来。就局部原文看，D更有可能，后面再结合全文方向回查。</p>\n","articleRects":[],"questionRects":[[113,730,1013,43],[150,783,587,43],[150,833,482,43],[150,883,627,43],[150,933,645,43]],"meta":{"kind":"result","qid":"23"}},{"section":"24题","raw":"## 24题\n\n> What can be learned about Cardus according to the last two paragraphs?  \n> 根据最后两段，关于Cardus可以知道什么？\n\n题干把人物锁定为`Cardus`，范围锁定为最后两段。粗读时后面见过Cardus和“前景很远”，所以回第4、5段精读。看选项时，先找它对应的原句；如果把两处信息拼到一起，就把两处都找出来再比。\n\n> 原文参考：\n>\n> Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England’s **[xxx]** classical-music critics, and a **[xxx]** so widely admired that his Autobiography (1947) became a best-seller. He was **[xxx]** in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.\n>\n> Is there any chance that Cardus’s criticism will enjoy a **[xxx]**? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly **[xxx]** Victorian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in **[xxx]** retreat.\n>\n> 开始精读：\n>\n> Unfortunately, / these critics / are virtually forgotten. Neville Cardus, / who wrote for the Manchester Guardian / from 1917 / until shortly before his death in 1975, / is now known solely / as a writer of essays / on the game of cricket. During his lifetime, though, / he was also / one of England’s **[xxx]** classical-music critics, / and a **[xxx]** / so widely admired / that his Autobiography (1947) / became a best-seller. He was **[xxx]** in 1967, / the first music critic / to be so honored. Yet / only one of his books / is now in print, / and his vast body of writings / on music / is unknown save / to specialists.\n>\n> Is there any chance / that Cardus’s criticism / will enjoy a **[xxx]**? The prospect / seems remote. Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly **[xxx]** Victorian prose / in which he specialized. Moreover, / the amateur tradition / in music criticism / has been in **[xxx]** retreat.\n>\n> 不幸的是 / 这些评论家 / 几乎被忘记了。Neville Cardus / 他为Manchester Guardian写作 / 从1917年 / 一直到1975年去世前不久，/ 现在只被知道 / 作为一个文章作者 / 关于板球运动的。在他一生期间，不过，/ 他也是 / 英国 **[xxx]** 的古典音乐评论家之一，/ 并且是一个 **[xxx]** / 被如此广泛地欣赏 / 以至于他的Autobiography (1947) / 成为一本畅销书。他在1967年被 **[xxx]**，/ 第一个音乐评论家 / 被这样尊敬的。然而 / 只有他的一本书 / 现在还在印刷，/ 并且他庞大的写作总量 / 关于音乐的 / 是不被知道的，除了 / 对专家来说。\n>\n> 有没有任何机会 / Cardus的评论 / 将享受一次 **[xxx]**？这个前景 / 看起来遥远。新闻写作的口味 / 已经改变 / 早在他去世之前，/ 并且后现代读者 / 几乎没有用处 / 对于那种丰富地 **[xxx]** 的Victorian prose / 他专长于其中。此外 / 业余传统 / 在音乐评论中 / 一直处在 **[xxx]** 的退却里面。\n>\n\n第4段把Cardus生前和现在放在一起：生前他的音乐评论和文字很受欣赏，现在却主要因为板球文章被人知道，音乐文章除专家外几乎无人知晓。\n\n第5段又问他的评论还能不能重新回来，接着说：\n\n> The prospect seems remote.\n>\n> postmodern readers have little use for the richly **[xxx]** Victorian prose in which he specialized\n\n也就是复兴前景很远，现代读者也不太需要他擅长的这种文字。\n\n接下来逐项看。\n","html":"<h2>24题</h2>\n<blockquote>\n<p>What can be learned about Cardus according to the last two paragraphs?<br />\n根据最后两段，关于Cardus可以知道什么？</p>\n</blockquote>\n<p>题干把人物锁定为<code>Cardus</code>，范围锁定为最后两段。粗读时后面见过Cardus和“前景很远”，所以回第4、5段精读。看选项时，先找它对应的原句；如果把两处信息拼到一起，就把两处都找出来再比。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England’s <span class=\"mask\">[xxx]</span> classical-music critics, and a <span class=\"mask\">[xxx]</span> so widely admired that his Autobiography (1947) became a best-seller. He was <span class=\"mask\">[xxx]</span> in 1967, t (1947) / 成为一本畅销书。他在1967年被 <span class=\"mask\">[xxx]</span>，/ 第一个音乐评论家 / 被这样尊敬的。然而 / 只有他的一本书 / 现在还在印刷，/ 并且他庞大的写作总量 / 关于音乐的 / 是不被知道的，除了 / 对专家来说。</p>\n<p>有没有任何机会 / Cardus的评论 / 将享受一次 <span class=\"mask\">[xxx]</span>？这个前景 / 看起来遥远。新闻写作的口味 / 已经改变 / 早在他去世之前，/ 并且后现代读者 / 几乎没有用处 / 对于那种丰富地 <span class=\"mask\">[xxx]</span> 的Victorian prose / 他专长于其中。此外 / 业余传统 / 在音乐评论中 / 一直处在 <span class=\"mask\">[xxx]</span> 的退却里面。</p>\n</blockquote>\n<p>第4段把Cardus生前和现在放在一起：生前他的音乐评论和文字很受欣赏，现在却主要因为板球文章被人知道，音乐文章除专家外几乎无人知晓。</p>\n<p>第5段又问他的评论还能不能重新回来，接着说：</p>\n<blockquote>\n<p>The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly <span class=\"mask\">[xxx]</span> Victorian prose in which he specialized</p>\n</blockquote>\n<p>也就是复兴前景很远，现代读者也不太需要他擅长的这种文字。</p>\n<p>接下来逐项看。</p>\n","articleRects":[[114,1098,986,43],[114,1141,993,43],[114,1184,948,43],[114,1227,935,43],[114,1270,1000,43],[114,1313,972,43],[114,1356,908,43],[114,1416,972,43],[114,1459,948,43],[114,1502,969,43],[114,1545,895,43]],"questionRects":[[113,1010,999,43]],"meta":{"kind":"question","qid":"24"}},{"section":"24题","raw":"### A. His music criticism may not appeal to readers today.\n\n> 他的音乐评论今天可能不太吸引读者\n\n把A接回题干，它说的是：从最后两段可以知道，Cardus的音乐评论今天可能不太吸引读者。\n\nA说今天的读者可能不再喜欢他的评论，这会让人依稀想起最后一段里“复兴前景很远”和“当代读者不太需要这种文字”的说法。先回去确认这两句：\n\n> Is there any chance that Cardus’s criticism will enjoy a **[xxx]**? The prospect seems remote.\n>\n> postmodern readers have little use for the richly **[xxx]** Victorian prose in which he specialized\n\n**“复兴前景很远”加上“当代读者不太需要这种文字”，能不能说明他的评论今天可能不太受欢迎？**\n\n能。原文一边说复兴前景很远，一边说当代读者不太需要他擅长的这种文字。A只说“今天可能不太吸引读者”，对象还是Cardus的评论和今天的读者，语气甚至比原文更谨慎，所以可以保留。\n\n**第一轮判断：A保留。**","html":"<h3>A. His music criticism may not appeal to readers today.</h3>\n<blockquote>\n<p>他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p>把A接回题干，它说的是：从最后两段可以知道，Cardus的音乐评论今天可能不太吸引读者。</p>\n<p>A说今天的读者可能不再喜欢他的评论，这会让人依稀想起最后一段里“复兴前景很远”和“当代读者不太需要这种文字”的说法。先回去确认这两句：</p>\n<blockquote>\n<p>Is there any chance that Cardus’s criticism will enjoy a <span class=\"mask\">[xxx]</span>? The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly <span class=\"mask\">[xxx]</span> Victorian prose in which he specialized</p>\n</blockquote>\n<p><strong>“复兴前景很远”加上“当代读者不太需要这种文字”，能不能说明他的评论今天可能不太受欢迎？</strong></p>\n<p>能。原文一边说复兴前景很远，一边说当代读者不太需要他擅长的这种文字。A只说“今天可能不太吸引读者”，对象还是Cardus的评论和今天的读者，语气甚至比原文更谨慎，所以可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[114,1416,972,43],[114,1459,948,43],[114,1502,969,43]],"questionRects":[[113,1010,999,43],[150,1063,681,43]],"meta":{"kind":"option","qid":"24","option":"A","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"24题","raw":"### B. His reputation as a music critic has long been in dispute.\n\n> 他作为音乐评论家的声誉长期存在争议\n\n把B接回题干，它说的是：从最后两段可以知道，人们长期对Cardus作为音乐评论家的声誉有不同意见。\n\nB把问题放在“声誉长期有争议”上。看到这个说法，会隐约想到第4段把他生前和后来的处境放在了一起，先回到这两处看看：\n\n> these critics are virtually forgotten\n>\n> a **[xxx]** so widely admired that his Autobiography (1947) became a best-seller\n\n**“生前广受欣赏、后来被忘记”，能不能直接改成“他的声誉长期有争议”？**\n\n不能。原文写的是时间变化：生前`widely admired`，后来`virtually forgotten`。被忘记说明大家不再熟悉他，`in dispute`却说人们长期争论他到底好不好。\n\n要选B，原文至少得出现批评、争论或褒贬不一；第4、5段没有这条线。\n\n**第一轮判断：B排除。**","html":"<h3>B. His reputation as a music critic has long been in dispute.</h3>\n<blockquote>\n<p>他作为音乐评论家的声誉长期存在争议</p>\n</blockquote>\n<p>把B接回题干，它说的是：从最后两段可以知道，人们长期对Cardus作为音乐评论家的声誉有不同意见。</p>\n<p>B把问题放在“声誉长期有争议”上。看到这个说法，会隐约想到第4段把他生前和后来的处境放在了一起，先回到这两处看看：</p>\n<blockquote>\n<p>these critics are virtually forgotten</p>\n<p>a <span class=\"mask\">[xxx]</span> so widely admired that his Autobiography (1947) became a best-seller</p>\n</blockquote>\n<p><strong>“生前广受欣赏、后来被忘记”，能不能直接改成“他的声誉长期有争议”？</strong></p>\n<p>不能。原文写的是时间变化：生前<code>widely admired</code>，后来<code>virtually forgotten</code>。被忘记说明大家不再熟悉他，<code>in dispute</code>却说人们长期争论他到底好不好。</p>\n<p>要选B，原文至少得出现批评、争论或褒贬不一；第4、5段没有这条线。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[114,1098,986,43],[114,1227,935,43],[114,1270,1000,43]],"questionRects":[[113,1010,999,43],[150,1113,679,43]],"meta":{"kind":"option","qid":"24","option":"B","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"24题","raw":"### C. His style caters largely to modern specialists.\n\n> 他的风格主要迎合现代专家\n\n把C接回题干，它说的是：从最后两段可以知道，Cardus的写作风格主要迎合现代专家。\n\nC里的`specialists`和`style`分散在第4、5段里，看上去好像能接成一句话，但到底是不是同一层意思还不清楚，所以先分别回到原文。\n\n大概对应的是下面两句：\n\n> his vast body of writings on music is unknown save to specialists\n>\n> the richly **[xxx]** Victorian prose in which he specialized\n\n第一句说的是现在还有谁知道他的音乐文章；第二句说的是他擅长哪种文风。C把“专家还知道作品”和“他擅长某种文风”拼成“这种文风是为了迎合专家”。\n\n**专家还知道这些文章，等不等于Cardus写作时在迎合专家？**\n\n不等于。一个说的是作品今天的知晓范围，一个说的是作者写作时面向谁。原文没有说Cardus为了专家而写，也没有说这种风格迎合现代专家。\n\n**第一轮判断：C排除。**","html":"<h3>C. His style caters largely to modern specialists.</h3>\n<blockquote>\n<p>他的风格主要迎合现代专家</p>\n</blockquote>\n<p>把C接回题干，它说的是：从最后两段可以知道，Cardus的写作风格主要迎合现代专家。</p>\n<p>C里的<code>specialists</code>和<code>style</code>分散在第4、5段里，看上去好像能接成一句话，但到底是不是同一层意思还不清楚，所以先分别回到原文。</p>\n<p>大概对应的是下面两句：</p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>the richly <span class=\"mask\">[xxx]</span> Victorian prose in which he specialized</p>\n</blockquote>\n<p>第一句说的是现在还有谁知道他的音乐文章；第二句说的是他擅长哪种文风。C把“专家还知道作品”和“他擅长某种文风”拼成“这种文风是为了迎合专家”。</p>\n<p><strong>专家还知道这些文章，等不等于Cardus写作时在迎合专家？</strong></p>\n<p>不等于。一个说的是作品今天的知晓范围，一个说的是作者写作时面向谁。原文没有说Cardus为了专家而写，也没有说这种风格迎合现代专家。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[114,1356,908,43],[114,1459,948,43],[114,1502,969,43]],"questionRects":[[113,1010,999,43],[150,1163,560,43]],"meta":{"kind":"option","qid":"24","option":"C","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"24题","raw":"### D. His writings fail to follow the amateur tradition.\n\n> 他的文章没有遵循业余评论传统\n\n把D接回题干，它说的是：从最后两段可以知道，Cardus的文章没有遵循业余评论传统。\n\nD里的`amateur tradition`看着很眼熟，依稀记得它出现在最后一句。题干问的是Cardus本人，所以先回去看看原句的主语到底是谁：\n\n> the amateur tradition in music criticism has been in **[xxx]** retreat\n\n**原文说的是“业余评论传统正在退却”，能不能改成“Cardus的文章没有遵循这种传统”？**\n\n不能。原文的主语是`the amateur tradition`，说这种传统正在退；D的主语变成`His writings`，说Cardus的文章没有遵循传统。\n\n即使最后的 **[xxx]** 不认识，也只是在修饰`retreat`，改不了是谁在退。原文是传统在退，D却写成Cardus的文章背离传统，主语和动作都换了。\n\n**第一轮判断：D排除。**","html":"<h3>D. His writings fail to follow the amateur tradition.</h3>\n<blockquote>\n<p>他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p>把D接回题干，它说的是：从最后两段可以知道，Cardus的文章没有遵循业余评论传统。</p>\n<p>D里的<code>amateur tradition</code>看着很眼熟，依稀记得它出现在最后一句。题干问的是Cardus本人，所以先回去看看原句的主语到底是谁：</p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in <span class=\"mask\">[xxx]</span> retreat</p>\n</blockquote>\n<p><strong>原文说的是“业余评论传统正在退却”，能不能改成“Cardus的文章没有遵循这种传统”？</strong></p>\n<p>不能。原文的主语是<code>the amateur tradition</code>，说这种传统正在退；D的主语变成<code>His writings</code>，说Cardus的文章没有遵循传统。</p>\n<p>即使最后的 <span class=\"mask\">[xxx]</span> 不认识，也只是在修饰<code>retreat</code>，改不了是谁在退。原文是传统在退，D却写成Cardus的文章背离传统，主语和动作都换了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[114,1545,895,43]],"questionRects":[[113,1010,999,43],[150,1213,629,43]],"meta":{"kind":"option","qid":"24","option":"D","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"24题","raw":"### 24题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除。\n\n第4、5段能够直接支持A，另外三项也都和原文的关系对不上。\n\n> **24题选A。**","html":"<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>第4、5段能够直接支持A，另外三项也都和原文的关系对不上。</p>\n<blockquote>\n<p><strong>24题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[113,1010,999,43],[150,1063,681,43],[150,1113,679,43],[150,1163,560,43],[150,1213,629,43]],"meta":{"kind":"result","qid":"24"}},{"section":"25题","raw":"## 25题\n\n**What would be the best title for the text?**\n\n这篇文章最合适的标题是什么？\n\n这是全文作者观点／全文主旨题。\n\n这类题先别急着数哪个词出现得最多。一个标题里出现了`newspapers`、`journalism`或者`critics`，都不代表它就是主旨。更稳的办法是把每个标题当成作者真正想写的中心，看看文章按这个标题应该怎么展开，再和全文实际写法对照。\n\n选项：\n\nA. **Newspapers of the Good Old Days**\n\n美好旧时光里的报纸\n\nB. **The Lost Horizon in Newspapers**\n\n报纸中失去的一片天地\n\nC. **Mournful Decline of Journalism**\n\n新闻业令人哀伤的衰落\n\nD. **Prominent Critics in Memory**\n\n记忆中的杰出评论家\n","html":"<h2>25题</h2>\n<p><strong>What would be the best title for the text?</strong></p>\n<p>这篇文章最合适的标题是什么？</p>\n<p>这是全文作者观点／全文主旨题。</p>\n<p>这类题先别急着数哪个词出现得最多。一个标题里出现了<code>newspapers</code>、<code>journalism</code>或者<code>critics</code>，都不代表它就是主旨。更稳的办法是把每个标题当成作者真正想写的中心，看看文章按这个标题应该怎么展开，再和全文实际写法对照。</p>\n<p>选项：</p>\n<p>A. <strong>Newspapers of the Good Old Days</strong></p>\n<p>美好旧时光里的报纸</p>\n<p>B. <strong>The Lost Horizon in Newspapers</strong></p>\n<p>报纸中失去的一片天地</p>\n<p>C. <strong>Mournful Decline of Journalism</strong></p>\n<p>新闻业令人哀伤的衰落</p>\n<p>D. <strong>Prominent Critics in Memory</strong></p>\n<p>记忆中的杰出评论家</p>\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1343,471,43],[150,1393,449,43],[150,1443,438,43],[150,1493,406,43]],"meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从报纸的许多变化中挑出一种真正想谈的变化 | 先说xxx现在不行了 |\n| 第2段 | 把过去和现在放在一起，让变化更明显 | 再说xxx以前其实很行 |\n| 第3段 | 继续写过去的状态，说明失去的东西原来有分量 | 举第一个例子，证明xxx以前确实很行 |\n| 第4段 | 用Cardus这个人物把前面的变化写具体 | 举第二个例子，说明一个人以前很行、现在不行 |\n| 第5段 | 回到现在，问这种东西还能不能回来，并说明希望不大 | 最后下结论：xxx现在不行，也很难再回来 |\n\n---\n\n**What would be the best title for the text?**\n","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>从报纸的许多变化中挑出一种真正想谈的变化</td>\n<td>先说xxx现在不行了</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>把过去和现在放在一起，让变化更明显</td>\n<td>再说xxx以前其实很行</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续写过去的状态，说明失去的东西原来有分量</td>\n<td>举第一个例子，证明xxx以前确实很行</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用Cardus这个人物把前面的变化写具体</td>\n<td>举第二个例子，说明一个人以前很行、现在不行</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回到现在，问这种东西还能不能回来，并说明希望不大</td>\n<td>最后下结论：xxx现在不行，也很难再回来</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><strong>What would be the best title for the text?</strong></p>\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1343,471,43],[150,1393,449,43],[150,1443,438,43],[150,1493,406,43]],"meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"### A. Newspapers of the Good Old Days\n\n美好旧时光里的报纸\n\n#### 如果 A 是主旨，文章5段应该怎么写？\n\n如果A是主旨，文章中心就应该是“过去的报纸整体上更好”。作者通常会从内容、质量、读者、版面或社会影响等多个方面写旧报纸的优点，最后表达对旧报纸的怀念。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说过去的报纸总体比现在好 | 先说xxx现在不行了 |\n| 第2段 | 罗列旧报纸在内容、质量等方面的优点 | 再说xxx以前其实很行 |\n| 第3段 | 再补充旧报纸其他方面的长处 | 举第一个例子，证明xxx以前确实很行 |\n| 第4段 | 用人物或事件证明旧报纸整体繁荣 | 举第二个例子，说明一个人以前很行、现在不行 |\n| 第5段 | 总结旧报纸为什么值得怀念 | 最后下结论：xxx现在不行，也很难再回来 |\n\n但实际文章没有介绍旧报纸各方面有多好。它没有谈发行量、新闻版面、政治报道或者普通读者，只盯着报纸中的艺术评论这一块。Cardus也不是用来证明旧报纸整体繁荣，而是用来说明这一块怎样离开大众视野。\n\n**A若真能做标题，Cardus这一段应该证明“旧报纸整体更好”，还是只证明“艺术评论这一块正在退出大众视野”？实际例子能承担前一种作用吗？**\n\n实际只能承担后一种作用。Cardus的经历说明过去重要的音乐评论家和作品今天越来越少被大众知道，却不能证明旧报纸在新闻、发行、版面、政治报道等各方面都更好。A只抓住了“过去”和“报纸”，范围放得太大，没有抓住全文真正反复写的那一块失去。\n\n**判断：A排除。**\n\n---\n\n**What would be the best title for the text?**\n","html":"<h3>A. Newspapers of the Good Old Days</h3>\n<p>美好旧时光里的报纸</p>\n<h4>如果 A 是主旨，文章5段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“过去的报纸整体上更好”。作者通常会从内容、质量、读者、版面或社会影响等多个方面写旧报纸的优点，最后表达对旧报纸的怀念。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先说过去的报纸总体比现在好</td>\n<td>先说xxx现在不行了</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>罗列旧报纸在内容、质量等方面的优点</td>\n<td>再说xxx以前其实很行</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>再补充旧报纸其他方面的长处</td>\n<td>举第一个例子，证明xxx以前确实很行</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用人物或事件证明旧报纸整体繁荣</td>\n<td>举第二个例子，说明一个人以前很行、现在不行</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>总结旧报纸为什么值得怀念</td>\n<td>最后下结论：xxx现在不行，也很难再回来</td>\n</tr>\n</tbody>\n</table>\n<p>但实际文章没有介绍旧报纸各方面有多好。它没有谈发行量、新闻版面、政治报道或者普通读者，只盯着报纸中的艺术评论这一块。Cardus也不是用来证明旧报纸整体繁荣，而是用来说明这一块怎样离开大众视野。</p>\n<p><strong>A若真能做标题，Cardus这一段应该证明“旧报纸整体更好”，还是只证明“艺术评论这一块正在退出大众视野”？实际例子能承担前一种作用吗？</strong></p>\n<p>实际只能承担后一种作用。Cardus的经历说明过去重要的音乐评论家和作品今天越来越少被大众知道，却不能证明旧报纸在新闻、发行、版面、政治报道等各方面都更好。A只抓住了“过去”和“报纸”，范围放得太大，没有抓住全文真正反复写的那一块失去。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr />\n<p><strong>What would be the best title for the text?</strong></p>\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1343,471,43]],"meta":{"kind":"main_option","qid":"25","option":"A"}},{"section":"25题","raw":"### B. The Lost Horizon in Newspapers\n\n报纸中失去的一片天地\n\n#### 如果 B 是主旨，文章5段应该怎么写？\n\n如果B是主旨，文章应该先指出报纸里有一块重要内容正在失去，再回到过去说明它以前有多普遍、多有分量，接着用人物把这种变化写具体，最后说明它很难回来。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 直接指出报纸里某个重要部分正在缩小或消失 | 先说xxx现在不行了 |\n| 第2段 | 回到过去，说明它以前很常见，也很有分量 | 再说xxx以前其实很行 |\n| 第3段 | 继续写旧状态，证明失去的不是小东西 | 举第一个例子，证明xxx以前确实很行 |\n| 第4段 | 用一个代表人物展示这种失去怎样发生 | 举第二个例子，说明一个人以前很行、现在不行 |\n| 第5段 | 回到现在，说明重新回来希望不大 | 最后下结论：xxx现在不行，也很难再回来 |\n\n实际文章正是这样写的：开头说艺术报道在下降，接着回看过去的报纸评论，再用Cardus说明这种评论怎样被大众忘记，最后说重新回来希望很小。\n\n而且B里的`Horizon`不是在说一个具体人物或一份具体报纸，而是报纸里原来存在、现在正在消失的一整块天地，这正好能把前面的历史回看和后面的Cardus都包进去。\n\n**一个标题要同时解释第1段的下降、第2、3段对过去的回看、第4段的Cardus和第5段的“前景很远”。B里的`Lost Horizon`能不能把这四步收进同一条线，又不把范围扩大成整个新闻业？**\n\n能。它抓住的是报纸里原来存在、现在正在失去的一块艺术评论天地：前两段交代变化与落差，第三段补足它过去的分量，第四段用Cardus把失去写具体，第五段说明这块天地很难回来。范围既没有扩大到整个新闻业，也没有缩成单独纪念某个评论家。\n\n**判断：B保留。**\n\n---\n\n**What would be the best title for the text?**\n","html":"<h3>B. The Lost Horizon in Newspapers</h3>\n<p>报纸中失去的一片天地</p>\n<h4>如果 B 是主旨，文章5段应该怎么写？</h4>\n<p>如果B是主旨，文章应该先指出报纸里有一块重要内容正在失去，再回到过去说明它以前有多普遍、多有分量，接着用人物把这种变化写具体，最后说明它很难回来。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>直接指出报纸里某个重要部分正在缩小或消失</td>\n<td>先说xxx现在不行了</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到过去，说明它以前很常见，也很有分量</td>\n<td>再说xxx以前其实很行</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续写旧状态，证明失去的不是小东西</td>\n<td>举第一个例子，证明xxx以前确实很行</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用一个代表人物展示这种失去怎样发生</td>\n<td>举第二个例子，说明一个人以前很行、现在不行</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回到现在，说明重新回来希望不大</td>\n<td>最后下结论：xxx现在不行，也很难再回来</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章正是这样写的：开头说艺术报道在下降，接着回看过去的报纸评论，再用Cardus说明这种评论怎样被大众忘记，最后说重新回来希望很小。</p>\n<p>而且B里的<code>Horizon</code>不是在说一个具体人物或一份具体报纸，而是报纸里原来存在、现在正在消失的一整块天地，这正好能把前面的历史回看和后面的Cardus都包进去。</p>\n<p><strong>一个标题要同时解释第1段的下降、第2、3段对过去的回看、第4段的Cardus和第5段的“前景很远”。B里的<code>Lost Horizon</code>能不能把这四步收进同一条线，又不把范围扩大成整个新闻业？</strong></p>\n<p>能。它抓住的是报纸里原来存在、现在正在失去的一块艺术评论天地：前两段交代变化与落差，第三段补足它过去的分量，第四段用Cardus把失去写具体，第五段说明这块天地很难回来。范围既没有扩大到整个新闻业，也没有缩成单独纪念某个评论家。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr />\n<p><strong>What would be the best title for the text?</strong></p>\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1393,449,43]],"meta":{"kind":"main_option","qid":"25","option":"B"}},{"section":"25题","raw":"### C. Mournful Decline of Journalism\n\n新闻业令人哀伤的衰落\n\n#### 如果 C 是主旨，文章5段应该怎么写？\n\n如果C是主旨，文章中心就应该是“整个新闻业正在衰落”。作者应该从新闻内容、发行、读者、经营、职业影响等多个方面展示整个行业的问题。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 总体指出整个新闻业在衰落 | 先说xxx现在不行了 |\n| 第2段 | 罗列新闻业多个方面的衰退 | 再说xxx以前其实很行 |\n| 第3段 | 继续讨论新闻机构或新闻职业整体失去影响 | 举第一个例子，证明xxx以前确实很行 |\n| 第4段 | 用人物或事件证明整个行业衰落 | 举第二个例子，说明一个人以前很行、现在不行 |\n| 第5段 | 总结整个新闻业为什么难以恢复 | 最后下结论：xxx现在不行，也很难再回来 |\n\n但实际文章没有谈整个新闻业。`journalism`虽然在第三段出现过，那里是在写Shaw和Newman怎样看待新闻写作，并不代表全文中心变成新闻业整体。全文也没有讨论新闻业的经营、发行、政治报道或行业危机。\n\n**C和全文都带有“衰落”的方向，但主旨题不能只对方向。把对象从“报纸中的艺术评论”换成整个`journalism`后，全文哪些内容会变得解释不通？**\n\n第1、2段始终限定在艺术报道和艺术评论，第4段Cardus也是音乐评论家的例子，第5段讨论的仍是这种评论及其传统能否回来。文章没有展开新闻业的发行、经营、政治报道或职业危机。C只对上了“衰落”的情绪和`journalism`这个词，却把对象扩大了。\n\n**判断：C排除。**\n\n---\n\n**What would be the best title for the text?**\n","html":"<h3>C. Mournful Decline of Journalism</h3>\n<p>新闻业令人哀伤的衰落</p>\n<h4>如果 C 是主旨，文章5段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“整个新闻业正在衰落”。作者应该从新闻内容、发行、读者、经营、职业影响等多个方面展示整个行业的问题。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>总体指出整个新闻业在衰落</td>\n<td>先说xxx现在不行了</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>罗列新闻业多个方面的衰退</td>\n<td>再说xxx以前其实很行</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续讨论新闻机构或新闻职业整体失去影响</td>\n<td>举第一个例子，证明xxx以前确实很行</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用人物或事件证明整个行业衰落</td>\n<td>举第二个例子，说明一个人以前很行、现在不行</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>总结整个新闻业为什么难以恢复</td>\n<td>最后下结论：xxx现在不行，也很难再回来</td>\n</tr>\n</tbody>\n</table>\n<p>但实际文章没有谈整个新闻业。<code>journalism</code>虽然在第三段出现过，那里是在写Shaw和Newman怎样看待新闻写作，并不代表全文中心变成新闻业整体。全文也没有讨论新闻业的经营、发行、政治报道或行业危机。</p>\n<p><strong>C和全文都带有“衰落”的方向，但主旨题不能只对方向。把对象从“报纸中的艺术评论”换成整个<code>journalism</code>后，全文哪些内容会变得解释不通？</strong></p>\n<p>第1、2段始终限定在艺术报道和艺术评论，第4段Cardus也是音乐评论家的例子，第5段讨论的仍是这种评论及其传统能否回来。文章没有展开新闻业的发行、经营、政治报道或职业危机。C只对上了“衰落”的情绪和<code>journalism</code>这个词，却把对象扩大了。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr />\n<p><strong>What would be the best title for the text?</strong></p>\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1443,438,43]],"meta":{"kind":"main_option","qid":"25","option":"C"}},{"section":"25题","raw":"### D. Prominent Critics in Memory\n\n记忆中的杰出评论家\n\n#### 如果 D 是主旨，文章5段应该怎么写？\n\n如果D是主旨，文章应该主要回忆一批杰出评论家，介绍他们的作品、经历和贡献，最后说明为什么后人应该记住他们。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出一批值得回忆的评论家 | 先说xxx现在不行了 |\n| 第2段 | 介绍他们的作品和共同成就 | 再说xxx以前其实很行 |\n| 第3段 | 写Shaw、Newman等人的经历和观点 | 举第一个例子，证明xxx以前确实很行 |\n| 第4段 | 重点介绍Cardus的生平、荣誉和作品 | 举第二个例子，说明一个人以前很行、现在不行 |\n| 第5段 | 总结为什么应该继续记住这些评论家 | 最后下结论：xxx现在不行，也很难再回来 |\n\n实际文章中的人物不是单独拿来纪念的。Shaw、Newman和Cardus都在说明同一件事：过去有这样一批艺术评论家，现在他们和作品越来越少被大众知道。\n\n如果D是中心，文章应该花更多篇幅介绍这些人的经历、代表作和贡献；但第1、2段根本还没有进入人物，最后一段也不是号召大家记住他们，而是在说这种评论很难回来。\n\n**D能解释Shaw、Newman和Cardus为什么出现，却能不能解释文章为什么先用两段写艺术报道的今昔，最后又落到“复兴前景很远”？**\n\n不能。人物只占中后段，前两段先建立的是报纸艺术评论的今昔落差，最后一段又回到这种评论和传统能否回来。如果D是中心，文章应围绕人物生平、作品和贡献展开，并以纪念收尾；实际人物只是把“这片艺术评论天地正在失去”写得更具体。\n\n**判断：D排除。**\n\n---\n","html":"<h3>D. Prominent Critics in Memory</h3>\n<p>记忆中的杰出评论家</p>\n<h4>如果 D 是主旨，文章5段应该怎么写？</h4>\n<p>如果D是主旨，文章应该主要回忆一批杰出评论家，介绍他们的作品、经历和贡献，最后说明为什么后人应该记住他们。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先提出一批值得回忆的评论家</td>\n<td>先说xxx现在不行了</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍他们的作品和共同成就</td>\n<td>再说xxx以前其实很行</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写Shaw、Newman等人的经历和观点</td>\n<td>举第一个例子，证明xxx以前确实很行</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>重点介绍Cardus的生平、荣誉和作品</td>\n<td>举第二个例子，说明一个人以前很行、现在不行</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>总结为什么应该继续记住这些评论家</td>\n<td>最后下结论：xxx现在不行，也很难再回来</td>\n</tr>\n</tbody>\n</table>\n<p>实际文章中的人物不是单独拿来纪念的。Shaw、Newman和Cardus都在说明同一件事：过去有这样一批艺术评论家，现在他们和作品越来越少被大众知道。</p>\n<p>如果D是中心，文章应该花更多篇幅介绍这些人的经历、代表作和贡献；但第1、2段根本还没有进入人物，最后一段也不是号召大家记住他们，而是在说这种评论很难回来。</p>\n<p><strong>D能解释Shaw、Newman和Cardus为什么出现，却能不能解释文章为什么先用两段写艺术报道的今昔，最后又落到“复兴前景很远”？</strong></p>\n<p>不能。人物只占中后段，前两段先建立的是报纸艺术评论的今昔落差，最后一段又回到这种评论和传统能否回来。如果D是中心，文章应围绕人物生平、作品和贡献展开，并以纪念收尾；实际人物只是把“这片艺术评论天地正在失去”写得更具体。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr />\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1493,406,43]],"meta":{"kind":"main_option","qid":"25","option":"D"}},{"section":"25题","raw":"### 25题结论\n\n**25. B. The Lost Horizon in Newspapers**\n\n这句话就是本文后续做题的主旨底牌：\n\n**The Lost Horizon in Newspapers / 报纸中失去的一片天地**\n\n---","html":"<h3>25题结论</h3>\n<p><strong>25. B. The Lost Horizon in Newspapers</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>The Lost Horizon in Newspapers / 报纸中失去的一片天地</strong></p>\n<hr />\n","articleRects":[],"questionRects":[[113,1290,582,43],[150,1343,471,43],[150,1393,449,43],[150,1443,438,43],[150,1493,406,43]],"meta":{"kind":"main_result","qid":"25"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查21题：B还是D？\n\n第一遍留下：\n\n- B. English-language newspapers used to carry more arts reviews\n- D. young readers doubt the **[xxx]** of criticism on dailies\n\n主旨底牌是：\n\n> **The Lost Horizon in Newspapers**\n\n也就是：\n\n> 报纸中原来有一片很有分量的艺术评论天地，现在这片天地正在失去，而且很难回来。\n\n我们先把题干和两个选项接起来。\n\nB接上以后是：\n\n> 第1、2段说明，英文报纸过去刊登的艺术评论更多。\n\nD接上以后大致是：\n\n> 第1、2段说明，年轻读者怀疑日报评论的某个 **[xxx]**。\n\n第一遍我们没有直接定下来，是因为D里有一个 **[xxx]** 不认识，而且`young readers`、`criticism`、`dailies`这些词在第2段都能看到；B也不是照抄一句原文，而是要把第1段的现在下降和第2段的过去情况接起来。\n\n现在拿主旨来检查。\n\n全文主旨是“报纸中失去的一片天地”。第1段写这片艺术报道在范围和严肃性上下降，第2段回看过去大城市报纸里的高质量评论。B正好把今昔两头接起来：现在在下降，过去自然比现在更多。\n\n再看D。它只抓住第2段里的年轻读者和日报评论。即使被遮住的词最后能和某个局部意思沾边，它也解释不了第1段为什么先写下降，更解释不了题干为什么把第1、2段一起圈出来。\n\n所以B既能接住局部证据，也能和主旨底牌对上；D只能碰到第2段的局部词。\n\n> **21题选B。**\n\n---","html":"<h2>回查21题：B还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. English-language newspapers used to carry more arts reviews</li>\n<li>D. young readers doubt the <span class=\"mask\">[xxx]</span> of criticism on dailies</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Lost Horizon in Newspapers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>报纸中原来有一片很有分量的艺术评论天地，现在这片天地正在失去，而且很难回来。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B接上以后是：</p>\n<blockquote>\n<p>第1、2段说明，英文报纸过去刊登的艺术评论更多。</p>\n</blockquote>\n<p>D接上以后大致是：</p>\n<blockquote>\n<p>第1、2段说明，年轻读者怀疑日报评论的某个 <span class=\"mask\">[xxx]</span>。</p>\n</blockquote>\n<p>第一遍我们没有直接定下来，是因为D里有一个 <span class=\"mask\">[xxx]</span> 不认识，而且<code>young readers</code>、<code>criticism</code>、<code>dailies</code>这些词在第2段都能看到；B也不是照抄一句原文，而是要把第1段的现在下降和第2段的过去情况接起来。</p>\n<p>现在拿主旨来检查。</p>\n<p>全文主旨是“报纸中失去的一片天地”。第1段写这片艺术报道在范围和严肃性上下降，第2段回看过去大城市报纸里的高质量评论。B正好把今昔两头接起来：现在在下降，过去自然比现在更多。</p>\n<p>再看D。它只抓住第2段里的年轻读者和日报评论。即使被遮住的词最后能和某个局部意思沾边，它也解释不了第1段为什么先写下降，更解释不了题干为什么把第1、2段一起圈出来。</p>\n<p>所以B既能接住局部证据，也能和主旨底牌对上；D只能碰到第2段的局部词。</p>\n<blockquote>\n<p><strong>21题选B。</strong></p>\n</blockquote>\n<hr />\n","articleRects":[],"questionRects":[[113,127,689,43],[150,230,791,43],[150,330,655,43]],"meta":{"kind":"review","qid":"21"}},{"section":"进阶回查","raw":"## 回查23题：B还是D？\n\n第一遍留下：\n\n- B. It is **[xxx]** for writers to be journalists.\n- D. Not all writers are capable of journalistic writing.\n\n主旨底牌仍然是：\n\n> **The Lost Horizon in Newspapers**\n\n也就是：\n\n> 报纸中原来有一片很有分量的艺术评论天地，现在这片天地正在失去，而且很难回来。\n\n我们先把题干和两个选项接起来。\n\nB接上以后大致是：\n\n> Shaw和Newman都会同意，作家去做新闻工作是某种 **[xxx]** 的。\n\nD接上以后是：\n\n> Shaw和Newman都会同意，不是所有作家都能做好新闻写作。\n\n第一遍我们没有直接定下来，是因为B里的评价词被挡住了；D虽然能接上Newman关于能力门槛的引语，但题干问的是Shaw和Newman两个人最可能共同同意什么，不能只看到Newman一个人的话就马上结束。\n\n现在拿主旨来检查。\n\n全文主旨是在怀念报纸里已经失去的一片高质量艺术评论天地。第三段把Shaw和Newman放进来，不是在批评他们从事新闻写作，而是在把过去那批评论家认真、专业、有能力这件事写具体。\n\n原文先把两个人放在同一组共同描写里：\n\n> could be trusted to know what they were about\n>\n> These men believed in journalism as a **[xxx]**\n>\n> were proud to be published in the daily press\n\n随后Newman又说：\n\n> So few authors have brains enough or literary gift enough to keep their own end up in journalism\n\nD既能接上这句明确的能力门槛，也能接上主旨底牌对过去评论家的整体肯定。题干问的是“两人最可能共同同意”，不是问两人是否分别留下过同一句原话。\n\n再看B。主旨只能告诉我们作者总体肯定这些老评论家，不能替我们把B里的 **[xxx]** 翻出来。这个评价到底是什么，到这里仍然不知道。\n\n所以D同时得到局部原文和主旨底牌的支持；B仍然依赖一个没有读出来的评价词。\n\n> **23题选D。**","html":"<h2>回查23题：B还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. It is <span class=\"mask\">[xxx]</span> for writers to be journalists.</li>\n<li>D. Not all writers are capable of journalistic writing.</li>\n</ul>\n<p>主旨底牌仍然是：</p>\n<blockquote>\n<p><strong>The Lost Horizon in Newspapers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>报纸中原来有一片很有分量的艺术评论天地，现在这片天地正在失去，而且很难回来。</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B接上以后大致是：</p>\n<blockquote>\n<p>Shaw和Newman都会同意，作家去做新闻工作是某种 <span class=\"mask\">[xxx]</span> 的。</p>\n</blockquote>\n<p>D接上以后是：</p>\n<blockquote>\n<p>Shaw和Newman都会同意，不是所有作家都能做好新闻写作。</p>\n</blockquote>\n<p>第一遍我们没有直接定下来，是因为B里的评价词被挡住了；D虽然能接上Newman关于能力门槛的引语，但题干问的是Shaw和Newman两个人最可能共同同意什么，不能只看到Newman一个人的话就马上结束。</p>\n<p>现在拿主旨来检查。</p>\n<p>全文主旨是在怀念报纸里已经失去的一片高质量艺术评论天地。第三段把Shaw和Newman放进来，不是在批评他们从事新闻写作，而是在把过去那批评论家认真、专业、有能力这件事写具体。</p>\n<p>原文先把两个人放在同一组共同描写里：</p>\n<blockquote>\n<p>could be trusted to
