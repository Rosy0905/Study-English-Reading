gal protection for an asset allocation strategy.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>商业方法专利最近引起关注，是因为它们对企业的价值有限。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>recently</code>和选项中的<code>limited value to businesses</code>。<code>limited value to businesses</code>会把视线带到第一段的企业例子；<code>recently</code>则要求继续看到第二段由<code>Now</code>引出的当前变化。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents.</p>\n</blockquote>\n<p>原文中的关系是：第一段的主体是Amazon.com和Merrill Lynch，动作是“获得专利或法律保护”，对象是具体商业方法；第二段的主体换成国家最高专利法院，当前动作是<code>scale back</code>，对象才是整类商业方法专利，时间限制是<code>Now</code>。</p>\n<p>A中的关系是：主体是商业方法专利，选项给它们加上“对企业价值有限”这一性质，并把这一性质设为“最近引起关注”的原因。</p>\n<p>具体差异在于：原文只写企业过去获得过专利，没有评价这些专利给企业带来的价值高低；A又额外补出“价值有限 → 最近受到关注”的因果。评价和因果都无原文依据。</p></section><section class=\"revealPart\" id=\"focus-q26-A-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n<p>文章只说明企业过去获得过专利，随后把当前焦点转向法院准备缩减这类专利；没有评价这些专利对企业的价值高低。</p>\n</blockquote>\n<p>文章先用几个企业实例交代这类专利已经存在十年，随后用<code>Now</code>把新闻中心转到法院准备缩减和审查这类专利。作者没有计算收益、成本或商业实用性。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Yet these patents have delivered little practical value to businesses. Their limited commercial usefulness has recently become the principal source of concern.</p>\n<p>然而，这些专利给企业带来的实际价值很小。它们有限的商业用途最近已成为主要担忧来源。</p>\n</blockquote>\n<p>假设写法把“企业价值有限”放在新闻因果链的起点；原文实际把“法院准备收缩”放在起点。两条路线的中心动作不同，A所需的商业价值评估没有出现。</p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"focusId":"focus-q26-A-2","raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> Amazon.com received one for its \"one-click\" online payment system.\n>\n> Merrill Lynch got legal protection for an asset allocation strategy.\n>\n> Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.\n>\n> 文章只说明企业过去获得过专利，随后把当前焦点转向法院准备缩减这类专利；没有评价这些专利对企业的价值高低。\n\n文章先用几个企业实例交代这类专利已经存在十年，随后用`Now`把新闻中心转到法院准备缩减和审查这类专利。作者没有计算收益、成本或商业实用性。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Yet these patents have delivered little practical value to businesses. Their limited commercial usefulness has recently become the principal source of concern.\n>\n> 然而，这些专利给企业带来的实际价值很小。它们有限的商业用途最近已成为主要担忧来源。\n\n假设写法把“企业价值有限”放在新闻因果链的起点；原文实际把“法院准备收缩”放在起点。两条路线的中心动作不同，A所需的商业价值评估没有出现。","lines":["#### 写作视角法","","原文第1、2段是这样写的：","","> Amazon.com received one for its \"one-click\" online payment system.",">","> Merrill Lynch got legal protection for an asset allocation strategy.",">","> Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.",">","> 文章只说明企业过去获得过专利，随后把当前焦点转向法院准备缩减这类专利；没有评价这些专利对企业的价值高低。","","文章先用几个企业实例交代这类专利已经存在十年，随后用`Now`把新闻中心转到法院准备缩减和审查这类专利。作者没有计算收益、成本或商业实用性。","","如果A真是作者的意思，文章至少得写成：","","> Yet these patents have delivered little practical value to businesses. Their limited commercial usefulness has recently become the principal source of concern.",">","> 然而，这些专利给企业带来的实际价值很小。它们有限的商业用途最近已成为主要担忧来源。","","假设写法把“企业价值有限”放在新闻因果链的起点；原文实际把“法院准备收缩”放在起点。两条路线的中心动作不同，A所需的商业价值评估没有出现。"]},{"title":"A. their limited value to businesses","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>它们对企业的有限价值</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>their [xxx] value to businesses</code>。只能看到<code>value to businesses</code>可能与第一段企业获得专利的例子有关，但原文没有评价这些专利对企业的价值；题干中的<code>recently</code>又把关注点拉向第二段法院的新动作，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了第一段中的企业名称和企业获得专利这一场景，所以看起来像在谈专利对企业的作用。原文写的是企业曾经获得不同类型的专利，A却把它接成“这些专利对企业价值有限，因此最近受到关注”。原文没有给出“价值有限”这项评价，也没有建立这条因果。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>商业方法专利最近引起关注，是因为它们对企业的价值有限。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>recently</code>和选项中的<code>limited value to businesses</code>。<code>limited value to businesses</code>会把视线带到第一段的企业例子；<code>recently</code>则要求继续看到第二段由<code>Now</code>引出的当前变化。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents.</p>\n</blockquote>\n<p>原文中的关系是：第一段的主体是Amazon.com和Merrill Lynch，动作是“获得专利或法律保护”，对象是具体商业方法；第二段的主体换成国家最高专利法院，当前动作是<code>scale back</code>，对象才是整类商业方法专利，时间限制是<code>Now</code>。</p>\n<p>A中的关系是：主体是商业方法专利，选项给它们加上“对企业价值有限”这一性质，并把这一性质设为“最近引起关注”的原因。</p>\n<p>具体差异在于：原文只写企业过去获得过专利，没有评价这些专利给企业带来的价值高低；A又额外补出“价值有限 → 最近受到关注”的因果。评价和因果都无原文依据。</p></section><section class=\"revealPart\" id=\"focus-q26-A-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n<p>文章只说明企业过去获得过专利，随后把当前焦点转向法院准备缩减这类专利；没有评价这些专利对企业的价值高低。</p>\n</blockquote>\n<p>文章先用几个企业实例交代这类专利已经存在十年，随后用<code>Now</code>把新闻中心转到法院准备缩减和审查这类专利。作者没有计算收益、成本或商业实用性。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Yet these patents have delivered little practical value to businesses. Their limited commercial usefulness has recently become the principal source of concern.</p>\n<p>然而，这些专利给企业带来的实际价值很小。它们有限的商业用途最近已成为主要担忧来源。</p>\n</blockquote>\n<p>假设写法把“企业价值有限”放在新闻因果链的起点；原文实际把“法院准备收缩”放在起点。两条路线的中心动作不同，A所需的商业价值评估没有出现。</p></section><section class=\"revealPart\" id=\"focus-q26-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>全文既然写的是一场正在逼近的司法威胁，本题问“最近为什么引起关注”，答案应指出最近出现了什么可能压缩这类专利生存空间的动作，即法院可能限制或取消这类专利。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. their limited value to businesses<br />\n它们对企业的有限价值</p>\n</blockquote>\n<p>具体比较：主旨中的主体是法院及其审查行动，动作方向是收缩，作用对象是整类商业方法专利；A的主体仍是专利，却把原因改成对企业的价值评价。它既换了动作，也换了因果来源。</p>\n<p>局部原文“<code>Now ... ready to scale back on business-method patents</code>”进一步坐实，近期新闻点是司法收缩，而不是企业价值。</p>\n<p><strong>复盘判断：A错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true},"focusId":"focus-q26-A-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入26题题干：\n\n> 全文既然写的是一场正在逼近的司法威胁，本题问“最近为什么引起关注”，答案应指出最近出现了什么可能压缩这类专利生存空间的动作，即法院可能限制或取消这类专利。\n\n但A实际说的是：\n\n> A. their limited >\n<p>原文中的关系是：第一句的主体是Merrill Lynch，动作是获得法律保护，对象是一项资产配置策略；后两句的主体是法院，动作是缩减和广泛审查，对象是整类商业方法专利，时间是现在。</p>\n<p>B中的关系是：主体扩大为全部商业方法专利，选项把其中一个例子的内容“资产配置”改成整类专利近期受关注的原因。</p>\n<p>具体差异在于：<code>asset allocation</code>确实是原文事实，但只承担“举例说明商业方法专利范围很广”的功能。B把论据升级成新闻原因，又把单例范围扩大到整类专利。</p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false},"focusId":"focus-q26-B-1","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 商业方法专利最近引起关注，是因为它们与资产配置有关。\n\n定位时先同时抓住题干中的`recently`和选项中的`asset allocation`。`asset allocation`只能定位到第一段Merrill Lynch的单个例子；`recently`要求判断这个旧例子是否真是第二段当前关注的原因。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> Merrill Lynch got legal protection for an asset allocation strategy.\n>\n> Now the nation's top patent court appears completely ready to scale back on business-method patents.\n>\n> The U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.\n\n原文中的关系是：第一句的主体是Merrill Lynch，动作是获得法律保护，对象是一项资产配置策略；后两句的主体是法院，动作是缩减和广泛审查，对象是整类商业方法专利，时间是现在。\n\nB中的关系是：主体扩大为全部商业方法专利，选项把其中一个例子的内容“资产配置”改成整类专利近期受关注的原因。\n\n具体差异在于：`asset allocation`确实是原文事实，但只承担“举例说明商业方法专利范围很广”的功能。B把论据升级成新闻原因，又把单例范围扩大到整类专利。","lines":["#### 定位比对法","","先把B接回题干，整句话就变成：","","> 商业方法专利最近引起关注，是因为它们与资产配置有关。","","定位时先同时抓住题干中的`recently`和选项中的`asset allocation`。`asset allocation`只能定位到第一段Merrill Lynch的单个例子；`recently`要求判断这个旧例子是否真是第二段当前关注的原因。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> Merrill Lynch got legal protection for an asset allocation strategy.",">","> Now the nation's top patent court appears completely ready to scale back on business-method patents.",">","> The U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.","","原文中的关系是：第一句的主体是Merrill Lynch，动作是获得法律保护，对象是一项资产配置策略；后两句的主体是法院，动作是缩减和广 ection for an asset allocation strategy.</p>\n<p>One inventor patented a technique for lifting a box.</p>\n<p>In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>资产配置只是并列例子之一；文章列举完例子后，转而写法院对整类商业方法专利进行广泛审查。</p>\n</blockquote>\n<p>第一段把“一键支付、资产配置、搬箱子”并列，三例没有谁被写成争议核心；第二段才转向法院的广泛审查。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Recent concern has centered on the connection between business-method patents and asset-allocation strategies. That connection prompted the court's broad review.</p>\n<p>近期关注集中在商业方法专利与资产配置策略之间的联系上。正是这种联系促使法院展开广泛审查。</p>\n</blockquote>\n<p>假设写法让资产配置贯穿因果链；实际文章在列举结束后就离开该例子，后文讨论Bilski、旧裁决和最高法院趋势。B抓住了细节，却没有抓住作者继续写下去的中心。</p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false},"focusId":"focus-q26-B-2","raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> Merrill Lynch got legal protection for an asset allocation strategy.\n>\n> One inventor patented a technique for lifting a box.\n>\n> In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.\n>\n> 资产配置只是并列例子之一；文章列举完例子后，转而写法院对整类商业方法专利进行广泛审查。\n\n第一段把“一键支付、资产配置、搬箱子”并列，三例没有谁被写成争议核心；第二段才转向法院的广泛审查。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Recent concern has centered on the connection between business-method patents and asset-allocation strategies. That connection prompted the court's broad review.\n>\n> 近期关注集中在商业方法专利与资产配置策略之间的联系上。正是这种联系促使法院展开广泛审查。\n\n假设写法让资产配置贯穿因果链；实际文章在列举结束后就离开该例子，后文讨论Bilski、旧裁决和最高法院趋势。B抓住了细节，却没有抓住作者继续写下去的中心。","lines":["#### 写作视角法","","原文第1、2段是这样写的：","","> Merrill Lynch got legal protection for an asset allocation strategy  Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n</blockquote>\n<p>原文中的关系是：第一句的主体是Merrill Lynch，动作是获得法律保护，对象是一项资产配置策略；后两句的主体是法院，动作是缩减和广泛审查，对象是整类商业方法专利，时间是现在。</p>\n<p>B中的关系是：主体扩大为全部商业方法专利，选项把其中一个例子的内容“资产配置”改成整类专利近期受关注的原因。</p>\n<p>具体差异在于：<code>asset allocation</code>确实是原文事实，但只承担“举例说明商业方法专利范围很广”的功能。B把论据升级成新闻原因，又把单例范围扩大到整类专利。</p></section><section class=\"revealPart\" id=\"focus-q26-B-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n<p>One inventor patented a technique for lifting a box.</p>\n<p>In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>资产配置只是并列例子之一；文章列举完例子后，转而写法院对整类商业方法专利进行广泛审查。</p>\n</blockquote>\n<p>第一段把“一键支付、资产配置、搬箱子”并列，三例没有谁被写成争议核心；第二段才转向法院的广泛审查。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Recent concern has centered on the connection between business-method patents and asset-allocation strategies. That connection prompted the court's broad review.</p>\n<p>近期关注集中在商业方法专利与资产配置策略之间的联系上。正是这种联系促使法院展开广泛审查。</p>\n</blockquote>\n<p>假设写法让资产配置贯穿因果链；实际文章在列举结束后就离开该例子，后文讨论Bilski、旧裁决和最高法院趋势。B抓住了细节，却没有抓住作者继续写下去的中心。</p></section><section class=\"revealPart\" id=\"focus-q26-B-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>在“商业方法专利面临迫近威胁”的主旨下，本题应回答造成这场威胁的当前制度动作，而不是复述专利曾应用于哪一种商业活动。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>B. their connection with asset allocation<br />\n它们与资产配置之间的联系</p>\n</blockquote>\n<p>具体比较：主旨的范围是整类专利的司法前景，动作是即将被收紧；B的范围只是第一段一项资产配置策略，功能是例子。主体范围、信息层级和因果功能均不相同。</p>\n<p>“<code>Merrill Lynch got legal protection for an asset allocation strategy</code>”只能证明这个例子存在，不能证明它解释了<code>recently aroused concern</code>。</p>\n ki案可能影响整类专利；C把两处合成了“授予可能受到限制”。其中<code>possible</code>也保留了事情尚未最终落地的语气。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents.</p>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q26-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>商业方法专利最近引起关注，是因为今后授予这类专利可能受到限制。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>recently aroused concern</code>和选项中的<code>possible restriction on their granting</code>。选项没有照抄原文，需要把第二段的<code>scale back</code>、<code>broad review</code>和<code>potential to eliminate an entire class</code>连续接起来。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents.</p>\n<p>The U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n</blockquote>\n<p>原文中的关系是：主体是国家最高专利法院及其审理的Bilski案；动作依次是准备缩减、开展广泛审查，并可能消除整整一类专利；对象始终是商业方法专利；<code>appears</code>和<code>potential</code>保留未决性。</p>\n<p>C中的关系是：主体仍是商业方法专利，动作结果被概括成授予范围受到限制，<code>possible</code>同样保留尚未最终发生的语气。</p>\n<p>具体差异在于：这里只发生了概括，没有改变关系。原文用三个具体司法动作说明“如何收紧”，C把共同后果压缩为“可能限制授予”；对象、方向、范围和不确定语气均被保留。</p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false},"focusId":"focus-q26-C-1","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 商业方法专利最近引起关注，是因为今后授予这类专利可能受到限制。\n\n定位时先同时抓住题干中的`recently aroused concern`和选项中的`possible restriction on their granting`。选项没有照抄原文，需要把第二段的`scale back`、`broad review`和`potential to eliminate an entire class`连续接起来。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连 s</code>连续接起来。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents.</p>\n<p>The U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n</blockquote>\n<p>原文中的关系是：主体是国家最高专利法院及其审理的Bilski案；动作依次是准备缩减、开展广泛审查，并可能消除整整一类专利；对象始终是商业方法专利；<code>appears</code>和<code>potential</code>保留未决性。</p>\n<p>C中的关系是：主体仍是商业方法专利，动作结果被概括成授予范围受到限制，<code>possible</code>同样保留尚未最终发生的语气。</p>\n<p>具体差异在于：这里只发生了概括，没有改变关系。原文用三个具体司法动作说明“如何收紧”，C把共同后果压缩为“可能限制授予”；对象、方向、范围和不确定语气均被保留。</p></section><section class=\"revealPart\" id=\"focus-q26-C-2\"><h3>写作视角法</h3><p>原文第2段是这样写的：</p>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n<p>In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>法院准备缩减并广泛审查商业方法专利，待审案件还可能影响整整一类专利；三处共同指向授予范围可能收紧。</p>\n</blockquote>\n<p>作者先用<code>Now</code>提出法院准备收缩，再补广泛审查，最后把潜在影响推进到可能消除整类专利，三句话由意图写到程序再写到后果。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The court appears ready to narrow the circumstances in which business-method patents may be granted, and the pending case could eliminate an entire class of them.</p>\n<p>法院似乎准备缩小商业方法专利可获授的情形，而待审案件可能取消其中整整一类。</p>\n</blockquote>\n<p>这段最小假设与原文实际推进一一对应：<code>appears ready</code>对应可能性，<code>narrow</code>对应<code>scale back</code>，<code>eliminate an entire class</code>对应影响范围。C所需要的写法已经存在。</p></section><section class=\"revealPart\" id=\"focus-q26-C-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>主旨告诉我们，近期关注的原因应当就是那场“迫近威胁”的具体形式：商业方法专利可能被法院大幅收紧，今后授予范围也可能因此缩小。</p>\n</blockquote>\n<p>C实际说的是：</p>\n<blockquote>\n<p>C. the possible restriction on their granting<br />\n它们的授予可能受到限制</p>\n</blockquote>\n<p>具体比较：主旨与C的主体都是商业方法专利，动作方向都是从原有扩张转向收紧，对象范围都是整类专利，<code>looming</code>与<code>possible</code>都保留尚未定案的状态。五个维度一致。</p>\n<p>局部原文“<code>has the potential to eliminate an entire class of patents</code>”又把“可能性”和“整类范围”同时坐实。</p>\n<p><strong>复盘判断：C正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":true},"focusId":"focus-q26-C-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入26题题干：\n\n> 主旨告诉我们，近期关注的原因应当就是那场“迫近威胁”的具体形式：商业方法专利可能被法院大幅收紧，今后授予范围也可能因此缩小。\n\nC实际说的是：\n\n> C. the possible restriction on their granting  \n> 它们的授予可能受到限制\n\n具体比较：主旨与C的主体都是商业方法专利，动作方向都是从原有扩张转向收紧，对象范围都是整类专利，`looming`与`possible`都保留尚未定案的状态。五个维度一致。\n\n局部原文“`has the potential to eliminate an entire class of patents`”又把“可能性”和“整类范围”同时坐实。\n\n**复盘判断：C正确。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入26题题干：","","> 主旨告诉我们，近期关注的原因应当就是那场“迫近威胁”的具体形式：商业方法专利可能被法院大幅收紧，今后授予范围也可能因此缩小。","","C实际说的是：","","> C. the possible restriction on their granting  ","> 它们的授予可能受到限制","","具体比较：主旨与C的主体都是商业方法专利，动作方向都是从原有扩张转向收紧，对象范围都是整类专利，`looming`与`possible`都保留尚未定案的状态。五个维度一致。","","局部原文“`has the potential to eliminate an entire class of patents`”又把“可能性”和“整类范围”同时坐实。","","**复盘判断：C正确。**"]},{"title":"D. the controversy over their authorization","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"> y were first authorized 10 years ago.",">","> In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.",">","> 十年来持续存在的争议被放在背景从句中；由Now引出的法院收缩与审查才是当前事件。","","作者用`Now`开启当前事件，把“十年前起一直有争议”压在非限制性从句中作为背景，随后继续写广泛审查和Bilski案。","","如果D真是作者的意思，文章至少得写成：","","> A new controversy over the authorization of business-method patents has recently erupted. This renewed dispute, rather than a change in court policy, has drawn public concern.",">","> 围绕商业方法专利授权的一场新争议最近爆发。引发关注的是这场重新出现的争议，而不是法院政策的变化。","","假设写法把“新的授权争议”置于主句和因果中心；实际文章把长期争议当旧背景，把法院收缩当新事件。D所需的时间线和信息功能都与原文不一致。"]},{"title":"D. the controversy over their authorization","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>围绕这类专利获准问题的争议</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>controversial</code>和<code>authorized</code>都能在第二段同一句中找到。但原文说这场争议自十年前就存在，题干问的却是“最近”为什么受关注；近期新情况是法院准备缩减并审查，因此D被排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>D抓住了原文中的<code>controversial</code>和<code>authorized</code>，所以它描述的长期背景确实存在。原文写的是这类专利自十年前首次获准以来一直有争议，D却用这条长期背景回答“最近为什么引起关注”。真正变化的是时间层面：长期争议不等于当前新闻点。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>business-method patents, which have been controversial ever since they were first authorized 10 years ago</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q26-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>商业方法专利最近引起关注，是因为围绕这类专利获准问题存在争议。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的时间限制<code>recently</code>以及选项中的<code>controversy</code>和<code>authorization</code>。后两个词对应第二段的从句<code>controversial ever since they were first authorized 10 years ago</code>，而<code>recently</code>要求继续比较主句里由<code>Now</code>引出的新动作。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n<p>The U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n</blockquote>\n<p>原文中的关系是：主句的时间是<code>Now</code>，主体是法院，动作是准备缩减；从句只补充背景：商业方法专利自十年前首次获准以来一直有争议。</p>\n<p>D中的关系是：选项把从十年前持续至今的长期争议直接设为“最近引起关注”的原因，没有保留主句里的法院新动作。</p>\n<p>具体差异在于：原文把长期争议放在修饰从句里，把当前司法审查放在主句和下一句里。D虽然复用了真实词语，却把背景和新闻点调换了功能，并忽略<code>recently</code>与“10 years ago”之间的时间差。</p></section><section class=\"revealPart\" id=\"focus-q26-D-2\"><h3>写作视角法</h3><p>原文第2段是这样写的：</p>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n<p>In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>十年来持续存在的争议被放在背景从句中；由Now引出的法院收缩与审查才是当前事件。</p>\n</blockquote>\n<p>作者用<code>Now</code>开启当前事件，把“十年前起一直有争议”压在非限制性从句中作为背景，随后继续写广泛审查和Bilski案。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>A new controversy over the authorization of business-method patents has recently erupted. This renewed dispute, rather than a change in court policy, has drawn public concern.</p>\n<p>围绕商业方法专利授权的一场新争议最近爆发。引发关注的是这场重新出现的争议，而不是法院政策的变化。</p>\n</blockquote>\n<p>假设写法把“新的授权争议”置于主句和因果中心；实际文章把长期争议当旧背景，把法院收缩当新事件。D所需的时间线和信息功能都与原文不一致。</p></section><section class=\"revealPart\" id=\"focus-q26-D-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>全文主旨要求本题回答一场正在逼近的威胁从哪里来，答案应落在法院当前可能收缩专利，而不是十年前就存在的争议背景。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>D. the controversy over their authorization<br />\n围绕这类专利获准问题的争议</p>\n</blockquote>\n<p>具体比较：主旨的中心动作是未来可能发生的司法收紧，D的中心却是过去已经存在十年的争议；主体、时间、动作和信息层级均发生偏移。</p>\n<p>局部句中的“<code>ever since they were first authorized 10 years ago</code>”明确说明争议并非最近才出现，不能独立回答<code>recently</code>。</p>\n<p><strong>复盘判断：D错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true},"focusId":"focus-q26-D-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入26题题干：\n\n> 全文主旨要求本题回答一场正在逼近的威胁从哪里来，答案应落在法院当前可能收缩专利，而不是十年前就存在的争议背景。\n\n但D实际说的是：\n\n> D. the controversy over their authorization  \n> 围绕这类专利获准问题的争议\n\n具体比较：主旨的中心动作是未来可能发生的司法收紧，D的中心却是过去已经存在十年的争议；主体、时间、动作和信息层级均发生偏移。\n\n局部句中的“`ever since they were first authorized 10 years ago`”明确说明争议并非最近才出现，不能独立回答`recently`。\n\n**复盘判断：D错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入26题题干：","","> 全文主旨要求本题回答一场正在逼近的威胁从哪里来，答案应落在法院当前可能收缩专利，而不是十年前就存在的争议背景。","","但D实际说的是：","","> D. the controversy over their authorization  ","> 围绕这类专利获准问题的争议","","具体比较：主旨的中心动作是未来可能发生的司法收紧，D的中心却是过去已经存在十年的争议；主体、时间、动作和信息层级均发生偏移。","","局部句中的“`ever since they were first authorized 10 years ago`”明确说明争议并非最近才出现，不能独立回答`recently`。","","**复盘判断：D错误。**"]},{"title":"26题结论","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p><strong>26. C. the possible restriction on their granting</strong></p>\n</blockquote>\n<ul>\n<li>A借用了企业获授专利的场景，却补出“价值有限”及其与近期关注的因果；</li>\n<li>B是原文中的真实例子，但没有回答近期关注的原因；</li>\n<li>C把法院收缩、审查和可能影响整类专利概括成授予可能受限；</li>\n<li>D写的是持续十年的争议背景，却答错了<code>recently</code>指定的时间层面。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"conclusion","question":"26","questionConclusion":true}},{"title":"27题 · 题干、题型与核心出处","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p>Which of the following is true of the Bilski case?<br />\n关于Bilski案，下面哪项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道具体细节题，题干点名Bilski案，要求从文中四项陈述中选出真实的一项。需要把第二段写出的潜在影响与第四段写出的审理安排结合起来，同时保留案件尚未裁决的时间状态。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot; It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>题干点名Bilski案，需要把第二段的潜在影响和第四段的审理安排接起来。文章写的是案件将由全体12名法官审理，法院还要考虑是否重新审视旧裁决；这些都是尚在推进中的动作。</p>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"question","question":"27","questionIntro":true}},{"title":"A. Its ruling complies with the court decisions.","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>该案的裁决与这些法院裁决一致</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文只说案件将由12名法官审理，并要评估是否重新考虑旧裁决，没有写Bilski案已经形成裁决，更没有比较它与其他裁决是否一致，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了原文中的<code>ruling</code>和法院决定这一法律场景，所以表面词汇很接近。原文中的<code>ruling</code>指州街银行案的旧裁决，Bilski案仍将被审理；A却先补出Bilski案已经有裁决，再补出它与其他裁决一致。原文没有表达这套完整命题。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the case would be heard by all 12 of the court's judges</p>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"foc Street Bank ruling</code>；同一段对Bilski案使用的是<code>would be heard</code>和<code>wants to evaluate</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案和联邦巡回法院；案件状态是“将由12名法官审理”，法院当前动作是评估是否重新考虑另一案件的旧裁决；对象是State Street Bank ruling。</p>\n<p>A中的关系是：<code>Its</code>把<code>ruling</code>归给Bilski案，默认该案已经裁决；<code>complies with</code>又新增它与其他法院决定一致的关系。</p>\n<p>具体差异在于：原文中的旧裁决和待审案件被A合并成同一个对象。A同时改掉时间状态（待审→已裁决）、指代对象（旧案裁决→Bilski裁决）并增加“一致”关系。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"focusId":"focus-q27-A-1","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Bilski案已经形成裁决，而且该裁决与这些法院裁决相一致。\n\n定位时先同时抓住选项中的`Its ruling`和`complies with the court decisions`。`ruling`在第四段确实出现，但它属于`State Street Bank ruling`；同一段对Bilski案使用的是`would be heard`和`wants to evaluate`。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.\n>\n> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n\n原文中的关系是：主体是Bilski案和联邦巡回法院；案件状态是“将由12名法官审理”，法院当前动作是评估是否重新考虑另一案件的旧裁决；对象是State Street Bank ruling。\n\nA中的关系是：`Its`把`ruling`归给Bilski案，默认该案已经裁决；`complies with`又新增它与其他法院决定一致的关系。\n\n具体差异在于：原文中的旧裁决和待审案件被A合并成同一个对象。A同时改掉时间状态（待审→已裁决）、指代对象（旧案裁决→Bilski裁决）并增加“一致”关系。","lines":["#### 定位比对法","","先把A接回题干，整句话就变成：","","> Bilski案已经形成裁决，而且该裁决与这些法院裁决相一致。","","定位时先同时抓住选项中的`Its ruling`和`complies with the court decisions`。`ruling`在第四段确实出现，但它属于`State Street Bank ruling`；同一段对Bilski案使用的是`would be heard`和`wants to evaluate`。","", 作是评估是否重新考虑另一案件的旧裁决；对象是State Street Bank ruling。</p>\n<p>A中的关系是：<code>Its</code>把<code>ruling</code>归给Bilski案，默认该案已经裁决；<code>complies with</code>又新增它与其他法院决定一致的关系。</p>\n<p>具体差异在于：原文中的旧裁决和待审案件被A合并成同一个对象。A同时改掉时间状态（待审→已裁决）、指代对象（旧案裁决→Bilski裁决）并增加“一致”关系。</p></section><section class=\"revealPart\" id=\"focus-q27-A-2\"><h3>写作视角法</h3><p>原文第4段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>文章写的是Bilski案将被审理、法院还要评估是否重新考虑旧裁决；没有写本案已经形成裁决。</p>\n</blockquote>\n<p>文章只交代全体法官将审理Bilski案，并列出法院准备评估的问题，没有公布本案结果。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Federal Circuit has now issued its ruling in Bilski. That ruling complies with the court's recent decisions and leaves the existing legal approach intact.</p>\n<p>联邦巡回法院现已对Bilski案作出裁决。该裁决与法院近期决定一致，并维持了现有法律做法。</p>\n</blockquote>\n<p>假设写法需要“已经裁决”和“保持一致”两层信息；原文实际停留在“将审理”和“是否重新考虑”阶段，甚至暗示旧做法可能改变，A所需的两层均不存在。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"focusId":"focus-q27-A-2","raw":"#### 写作视角法\n\n原文第4段是这样写的：\n\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n>\n> 文章写的是Bilski案将被审理、法院还要评估是否重新考虑旧裁决；没有写本案已经形成裁决。\n\n文章只交代全体法官将审理Bilski案，并列出法院准备评估的问题，没有公布本案结果。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The Federal Circuit has now issued its ruling in Bilski. That ruling complies with the court's recent decisions and leaves the existing legal approach intact.\n>\n> 联邦巡回法院现已对Bilski案作出裁决。该裁决与法院近期决定一致，并维持了现有法律做法。\n\n假设写法需要“已经裁决”和“保持一致”两层信息；原文实际停留在“将审理”和“是否重新考虑”阶段，甚至暗示旧做法可能改变，A所需的两层均不存在。","lines":["#### 写作视角法","","原文第4段是这样写的：","","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.",">","> 文章写的是Bilski案将被审理、法院还要评估是否重新考虑旧裁决；没有写本案已经形成裁决。","","文章只交代全体法官将审理Bilski案，并列出法院准备评估的问题，没有公布本案结果。","","如果A真是作者的意思，文章至少得写成：","","> The Federal Circuit has now issued its ruling in Bilski. That ruling complies with the court's recent decisions and leaves the existing legal approach intact.",">","> 联邦巡回法院现已对Bilski案作出裁决。该裁决与法院近期决定一致，并维持了现有法律做法。","","假设写法需要“已经裁决”和“保持一致”两层信息；原文实际停留在“将审理”和“是否重新考虑”阶段，甚至暗示旧做法可能改变，A所需的两层均不存在。"]},{"title":"A. Its ruling complies with the court decisions.","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>该案的裁决与这些法院裁决一致</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文只说案件将由12名法官审理，并要评估是否重新考虑旧裁决，没有写Bilski案已经形成裁决，更没有比较它与其他裁决是否一致，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了原文中的<code>ruling</code>和法院决定这一法律场景，所以表面词汇很接近。原文中的<code>ruling</code>指州街银行案的旧裁决，Bilski案仍将被审理；A却先补出Bilski案已经有裁决，再补出它与其他裁决一致。原文没有表达这套完整命题。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the case would be heard by all 12 of the court's judges</p>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案已经形成裁决，而且该裁决与这些法院裁决相一致。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>Its ruling</code>和<code>complies with the court decisions</code>。<code>ruling</code>在第四段确实出现，但它属于<code>State Street Bank ruling</code>；同一段对Bilski案使用的是<code>would be heard</code>和<code>wants to evaluate</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案和联邦巡回法院；案件状态是“将由12名法官审理”，法院当前动作是评估是否重新考虑另一案件的旧裁决；对象是State Street Bank ruling。</p>\n<p>A中的关系是：<code>Its</code>把<code>ruling</code>归给Bilski案，默认该案已经裁决；<code>complies with</code>又新增它与其他法院决定一致的关系。</p>\n<p>具体差异在于：原文中的旧裁决和待审案件被A合并成同一个对象。A同时改掉时间状态（待审→已裁决）、指代对象（旧案裁决→Bilski裁决）并增加“一致”关系。</p></section><section class=\"revealPart\" id=\"focus-q27-A-2\"><h3>写作视角法</h3><p>原文第4段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>文章写的是Bilski案将被审理、法院还要评估是否重新考虑旧裁决；没有写本案已经形成裁决。</p>\n</blockquote>\n<p>文章只交代全体法官将审理Bilski案，并列出法院准备评估的问题，没有公布本案结果。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Federal Circuit has now issued its ruling in Bilski. That ruling complies with the court's recent decisions and leaves the existing legal approach intact.</p>\n<p>联邦巡回法院现已对Bilski案作出裁决。该裁决与法院近期决定一致，并维持了现有法律做法。</p>\n</blockquote>\n<p>假设写法需要“已经裁决”和“保持一致”两层信息；原文实际停留在“将审理”和“是否重新考虑”阶段，甚至暗示旧做法可能改变，A所需的两层均不存在。</p></section><section class=\"revealPart\" id=\"focus-q27-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>全文主旨只能确认Bilski案是这场迫近威胁的载体，不能单独判断本案是否已经形成裁决、该裁决又是否与其他决定一致。</p>\n</blockquote>\n<p>本项最终仍要根据<code>the case would be heard</code>和<code>whether it should reconsider</code>这两处局部原文判断。</p>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. Its ruling complies with the court decisions.<br />\n该案的裁决与这些法院裁决一致</p>\n</blockquote>\n<p>具体比较：主旨的方向是现行商业方法专利规则可能受到冲击；A却让本案裁决与既有决定保持一致，方向上倾向维持现状。更关键的是，主旨不能单独判定程序是否完成，A仍须接受局部事实检验。</p>\n<p>局部原文“<code>the case would be heard</code>”明确表明案件仍待审；“<code>reconsider</code> its State Street Bank ruling”还说明被谈论的裁决属于旧案。</p>\n<p><strong>复盘判断：A错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":true},"focusId":"focus-q27-A-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入27题题干：\n\n> 全文主旨只能确认Bilski案是这场迫近威胁的载体，不能单独判断本案是否已经形成裁决、该裁决又是否与其他决定一致。\n\n本项最终仍要根据`the case would be heard`和`whether it should reconsider`这两处局部原文判断。\n\n但A实际说的是：\n\n> A. Its ruling complies with the court decisions.  \n> 该案的裁决与这些法院裁决一致\n\n具体比较：主旨的方向是现行商业方法专利规则可能受到冲击；A却让本案裁决与既有决定保持一致，方向上倾向维持现状。更关键的是，主旨不能单独判定程序是否完成，A仍须接受局部事实检验。\n\n局部原文“`the case would be heard`”明确表明案件仍待审；“`reconsider` its State Street Bank ruling”还说明被谈论的裁决属于旧案。\n\n**复盘判断：A错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入27题题干：","","> 全文主旨只能确认Bilski案是这场迫近威胁的载体，不能单独判断本案是否已经形成裁决、该裁决又是否与其他决定一致。","","本项最终仍要根据`the case would be heard`和`whether it should reconsider`这两处局部原文判断。","","但A实际说的是：","","> A. Its ruling complies with the court decisions.  ","> 该案的裁决与这些法院裁决一致","","具体比较：主旨的方向是现行商业方法专利规则可能受到冲击；A却让本案裁决与既有决定保持一致，方向上倾向维持现状。更关键的是，主旨不能单独判定程序是否完成，A仍须接受局部事实检验。","","局部原文“`the case would be heard`”明确表明案件仍待审；“`reconsider` its State Street Bank ruling”还说明被谈论的裁决属于旧案。","","**复盘判断：A错误。**"]},{"title":"B. It involves a very big business transaction.","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>该案涉及一笔非常大的商业交易</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>very big</code>与原文<code>a very big deal</code>表面重合。但原文是在评价案件影响重大，第四段写的是能源市场中的风险对冲方法，并没有一笔规模很大的商业交易，因此B被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B抓住了原文中的<code>a very big deal</code>，所以看起来像近距离改写。原文写的是一位学者把Bilski案称为“影响重大的事”，B却把<code>deal</code>改成了字面上的“商业交易”。真正变化的是短语在语境中的含义和它所评价的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot;</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"27","option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false},"focusId":"focus-q27-B-0","raw":"### B. It involves a very big business transaction.\n\n> 该案涉及一笔非常大的商业交易\n\n**做题模式中的状态：**当时选项完整可见，`very big`与原文`a very big deal`表面重合。但原文是在评价案件影响重大，第四段写的是能源市场中的风险对冲方法，并没有一笔规模很大的商业交易，因此B被排除。\n\n**错误类型：第一类——歪曲原意。**\n\nB抓住了原文中的`a very big deal`，所以看起来像近距离改写。原文写的是一位学者把Bilski案称为“影响重大的事”，B却把`deal`改成了字面上的“商业交易”。真正变化的是短语在语境中的含义和它所评价的对象。\n\n**命题人借用的原文材料：**\n\n> In re Bilski, as the case is known, is \"a very big deal.\"\n>\n> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.","lines":["### B. It involves a very big business transaction.","","> 该案涉及一笔非常大的商业交易","","**做题模式中的状态：**当时选项完整可见，`very big`与原文`a very big deal`表面重合。但原文是在评价案件影响重大，第四段写的是能源市场中的风险对冲方法，并没有一笔规模很大的商业交易，因此B被排除。","","**错误类型：第一类——歪曲原意。**","","B抓住了原文中的`a very big deal`，所以看起来像近距离改写。原文写的是一位学者把Bilski案称为“影响重大的事”，B却把`deal`改成了字面上的“商业交易”。真正变化的是短语在语境中的含义和它所评价的对象。","","**命题人借用的原文材料：**","","> In re Bilski, as the case is known, is \"a very big deal.\"",">","> The Bilski case involves a claimed patent on a method for hedging risk in the energy market."]},{"title":"B. It involves a very big business transaction.","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>该案涉及一笔非常大的商业交易</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>very big</code>与原文<code>a very big deal</code>表面重合。但原文是在评价案件影响重大，第四段写的是能源市场中的风险对冲方法，并没有一笔规模很大的商业交易，因此B被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B抓住了原文中的<code>a very big deal</code>，所以看起来像近距离改写。原文写的是一位学者把Bilski案称为“影响重大的事”，B却把<code>deal</code>改成了字面上的“商业交易”。真正变化的是短语在语境中的含义和它所评价的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot;</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案涉及一笔非常大的商业交易。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>very big business transaction</code>以及原文中的<code>a very big deal</code>。表面重合的<code>very big</code>和<code>deal</code>会把人带回第二段，但还要把短语放回完整语境，并与第四段对案件内容的说明核对。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote>\n<p>原文中的关系是：第一句的主体是整个Bilski案，<code>is a very big deal</code>是专家对案件重要性和潜在影响的评价；第二句说明案件涉及一项能源市场风险对冲方法的专利。</p>\n<p>B中的关系是：选项把<code>deal</code>按“交易”理解，并用<code>business transaction</code>把评价短语改成案件事实，还用<code>very big</code>修饰交易规模。</p>\n<p>具体差异在于：原文的<code>deal</code>属于固定表达“重要的事”，评价对象是案件影响；B把它歪曲为商业交易，改了词义、谓语关系和对象。能源市场背景并不能补出一笔大额交易。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false},"focusId":"focus-q27-B-1","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Bilski案涉及一笔非常大的商业交易。\n\n定位时先同时抓住选项中的`very big business transaction`以及原文中的`a very big deal`。表面重合的`very big`和`deal`会把人带回第二段，但还要把短语放回完整语境，并与第四段对案件内容的说明核对。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> In re Bilski, as the case is known, is \"a very big deal,\" says Dennis D. Crouch.\n>\n> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.\n\n原文中的关系是：第一句的主体是整个Bilski案，`is a very big deal`是专家对案件重要性和潜在影响的评价；第二句说明案件涉及一项能源市场风险对冲方法的专利。\n\nB中的关系是：选项把`deal`按“交易”理解，并用`business transaction`把评价短语改成案件事实，还用`very big`修饰交易规模。\n\n具体差异在于：原文的`deal`属于固定表达“重要的事”，评价对象是案件影响；B把它歪曲为商业交易，改了词义、谓语关系和对象。能源市场背景并不能补出一笔大额交易。","lines":["#### 定位比对法","","先把B接回题干，整句话就变成：","","> Bilski案涉及一笔非常大的商业交易。","","定位时先同时抓住选项中的`very big business transaction`以及原文中的`a very big deal`。表面重合的`very big`和`deal`会把人带回第二段，但还要把短语放回完整语境，并与第四段对案件内容的说明核对。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> In re Bilski, as the case is known, is \"a very big deal,\" says Dennis D. Crouch.",">","> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.","","原文中的关系是：第一句的主体是整个Bilski案，`is a very big deal`是专家对案件重要性和潜在影响的评价；第二句说明案件涉及一项能源市场风险对冲方法的专利。","","B中的关系是：选项把`deal`按“交易”理解，并用`business transaction`把评价短语改成案件事实，还用`very big`修饰交易规模。","","具体差异在于：原文的`deal`属于固定表达“重要的事”，评价对象是案件影响；B把它歪曲为商业交易，改了词义、谓语关系和对象。能源市场背景并不能补出一笔大额交易。"]},{"title":"B. It involves a very big business transaction.","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>该案涉及一笔非常大的商业交易</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>very big</code>与原文<code>a very big deal</code>表面重合。但原文是在评价案件影响重大，第四段写的是能源市场中的风险对冲方法，并没有一笔规模很大的商业交易，因此B被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B抓住了原文中的<code>a very big deal</code>，所以看起来像近距离改写。原文写的是一位学者把Bilski案称为“影响重大的事”，B却把<code>deal</code>改成了字面上的“商业交易”。真正变化的是短语在语境中的含义和它所评价的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot;</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案涉及一笔非常大的商业交易。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>very big business transaction</code>以及原文中的<code>a very big deal</code>。表面重合的<code>very big</code>和<code>deal</code>会把人带回第二段，但还要把短语放回完整语境，并与第四段对案件内容的说明核对。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote>\n<p>原文中的关系是：第一句的主体是整个Bilski案，<code>is a very big deal</code>是专家对案件重要性和潜在影响的评价；第二句说明案件涉及一项能源市场风险对冲方法的专利。</p>\n<p>B中的关系是：选项把<code>deal</code>按“交易”理解，并用<code>business transaction</code>把评价短语改成案件事实，还用<code>very big</code>修饰交易规模。</p>\n<p>具体差异在于：原文的<code>deal</code>属于固定表达“重要的事”，评价对象是案件影响；B把它歪曲为商业交易，改了词义、谓语关系和对象。能源市场背景并不能补出一笔大额交易。</p></section><section class=\"revealPart\" id=\"focus-q27-B-2\"><h3>写作视角法</h3><p>原文第2、4段是这样写的：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch of the University of Missouri School of Law.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>a very big deal评价的是案件影响，案件实际涉及一种能源市场风险对冲的专利方法；文章没有写巨额商业交易。</p>\n</blockquote>\n<p>作者先由专家强调案件分量，之后解释它涉及哪一种专利方法和为何由全体法官审理。全文没有交易金额、交易双方或交易规模。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Bilski dispute arose from a very large business transaction in the energy market, involving substantial assets and identifiable trading parties.</p>\n<p>Bilski争议源于能源市场中的一笔巨额商业交易，涉及大量资产和明确的交易方。</p>\n</blockquote>\n<p>假设写法必须出现“交易事实”；实际文章出现的是“专利方法”和“案件影响”。B只是利用<code>deal</code>的一词多义，把评价误读成事实。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"B","cumulative":true,"cumulative 是短语在语境中的含义和它所评价的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot;</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案涉及一笔非常大的商业交易。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>very big business transaction</code>以及原文中的<code>a very big deal</code>。表面重合的<code>very big</code>和<code>deal</code>会把人带回第二段，但还要把短语放回完整语境，并与第四段对案件内容的说明核对。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote>\n<p>原文中的关系是：第一句的主体是整个Bilski案，<code>is a very big deal</code>是专家对案件重要性和潜在影响的评价；第二句说明案件涉及一项能源市场风险对冲方法的专利。</p>\n<p>B中的关系是：选项把<code>deal</code>按“交易”理解，并用<code>business transaction</code>把评价短语改成案件事实，还用<code>very big</code>修饰交易规模。</p>\n<p>具体差异在于：原文的<code>deal</code>属于固定表达“重要的事”，评价对象是案件影响；B把它歪曲为商业交易，改了词义、谓语关系和对象。能源市场背景并不能补出一笔大额交易。</p></section><section class=\"revealPart\" id=\"focus-q27-B-2\"><h3>写作视角法</h3><p>原文第2、4段是这样写的：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch of the University of Missouri School of Law.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>a very big deal评价的是案件影响，案件实际涉及一种能源市场风险对冲的专利方法；文章没有写巨额商业交易。</p>\n</blockquote>\n<p>作者先由专家强调案件分量，之后解释它涉及哪一种专利方法和为何由全体法官审理。全文没有交易金额、交易双方或交易规模。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Bilski dispute arose from a very large business transaction in the energy market, involving substantial assets and identifiable trading parties.</p>\n<p>Bilski争议源于能源市场中的一笔巨额商业交易，涉及大量资产和明确的交易方。</p>\n</blockquote>\n<p>假设写法必须出现“交易事实”；实际文章出现的是“专利方法”和“案件影响”。B只是利用<code>deal</code>的一词多义，把评价误读成事实。</p></section><section class=\"revealPart\" id=\"focus-q27-B-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>全文主旨只能确认Bilski案具有重要制度影响，不能单独判断它是否涉及一笔规模很大的商业交易。</p>\n</blockquote>\n<p>本项最终仍要根据<code>a very big deal</code>所在的完整句子以及<code>involves a claimed patent</code>这处局部原文判断。</p>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>B. It involves a very big business transaction.<br />\n该案涉及一笔非常大的商业交易</p>\n</blockquote>\n<p>具体比较：主旨的主体虽也是Bilski案，但动作对象是商业方法专利制度；B把对象换成一笔交易。主旨能够提示B偏离中心，但“是否有大交易”仍是局部事实。</p>\n<p>局部原文只说“<code>a claimed patent on a method for hedging risk</code>”，并没有任何<code>business transaction</code>。</p>\n<p><strong>复盘判断：B错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":true},"focusId":"focus-q27-B-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入27题题干：\n\n> 全文主旨只能确认Bilski案具有重要制度影响，不能单独判断它是否涉及一笔规模很大的商业交易。\n\n本项最终仍要根据`a very big deal`所在的完整句子以及`involves a claimed patent`这处局部原文判断。\n\n但B实际说的是：\n\n> B. It involves a very big business transaction.  \n> 该案涉及一笔非常大的商业交易\n\n具体比较：主旨的主体虽也是Bilski案，但动作对象是商业方法专利制度；B把对象换成一笔交易。主旨能够提示B偏离中心，但“是否有大交易”仍是局部事实。\n\n局部原文只说“`a claimed patent on a method for hedging risk`”，并没有任何`business transaction`。\n\n**复盘判断：B错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入27题题干：","","> 全文主旨只能确认Bilski案具有重要制度影响，不能单独判断它是否涉及一笔规模很大的商业交易。","","本项最终仍要根据`a very big deal`所在的完整句子以及`involves a claimed patent`这处局部原文判断。","","但B实际说的是：","","> B. It involves a very big business transaction.  ","> 该案涉及一笔非常大的商业交易","","具体比较：主旨的主体虽也是Bilski案，但动作对象是商业方法专利制度；B把对象换成一笔交易。主旨能够提示B偏离中心，但“是否有大交易”仍是局部事实。","","局部原文只说“`a claimed patent on a method for hedging risk`”，并没有任何`business transaction`。","","**复盘判断：B错误。**"]},{"title":"C. It has been dismissed by the Federal Circuit.","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>该案已被联邦巡回法院驳回</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文说联邦巡回法院发布命令，让全部12名法官审理该案，并准备评估一个重要问题；“将被审理”和“已经驳回”方向相反，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了联邦巡回法院与Bilski案之间的直接关系，所以主体有明确来源。原文写的是法院安排全体法官审理，C却写成法院已经驳回案件。真正变化的是法院动作和案件状态。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"27","option":"C","cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false},"focusId":"focus-q27-C-0","raw":"### C. It has been dismissed by the Federal Circuit.\n\n> 该案已被联邦巡回法院驳回\n\n**做题模式中的状态：**当时选项完整可见。原文说联邦巡回法院发布命令，让全部12名法官审理该案，并准备评估一个重要问题；“将被审理”和“已经驳回”方向相反，因此C被排除。\n\n**错误类型：第一类——歪曲原意。**\n\nC抓住了联邦巡回法院与Bilski案之间的直接关系，所以主体有明确来源。原文写的是法院安排全体法官审理，C却写成法院已经驳回案件。真正变化的是法院动作和案件状态。\n\n**命题人借用的原文材料：**\n\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.","lines":["### C. It has been dismissed by the Federal Circuit.","","> 该案已被联邦巡回法院驳回","","**做题模式中的状态：**当时选项完整可见。原文说联邦巡回法院发布命令，让全部12名法官审理该案，并准备评估一个重要问题；“将被审理”和“已经驳回”方向相反，因此C被排除。","","**错误类型：第一类——歪曲原意。**","","C抓住了联邦巡回法院与Bilski案之间的直接关系，所以主体有明确来源。原文写的是法院安排全体法官审理，C却写成法院已经驳回案件。真正变化的是法院动作和案件状态。","","**命题人借用的原文材料：**","","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges."]},{"title":"C. It has been dismissed by the Federal Circuit.","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>该案已被联邦巡回法院驳回</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文说联邦巡回法院发布命令，让全部12名法官审理该案，并准备评估一个重要问题；“将被审理”和“已经驳回”方向相反，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了联邦巡回法院与Bilski案之间的直接关系，所以主体有明确来源。原文写的是法院安排全体法官审理，C却写成法院已经驳回案件。真正变化的是法院动作和案件状态。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案已经被联邦巡回法院驳回。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>dismissed by the Federal Circuit</code>和原文中同一法院对案件作出的具体动作。<code>Federal Circuit</code>定位到第四段；判断关键不是法院名称是否相同，而是比较<code>dismissed</code>与<code>would be heard by all 12 ... judges</code>的动作方向和时间状态。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是联邦巡回法院，动作是发布一项特殊命令，命令内容是案件将由全部12名法官审理并评估重要问题；对象是Bilski案及旧裁决，时间仍在未来审理阶段。</p>\n<p>C中的关系是：主体仍是联邦巡回法院，但动作被改成<code>dismissed</code>，对象是Bilski案，完成时态<code>has been</code>表示案件已经终结。</p>\n<p>具体差异在于：主体和案件名称未变，核心动作却从“安排全院审理”反转成“已经驳回”，案件状态也从待审变成终结。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"C","cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false},"focusId":"focus-q27-C-1","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> Bilski案已经被联邦巡回法院驳回。\n\n定位时先同时抓住选项中的`dismissed by the Federal Circuit`和原文中同一法院对案件作出的具体动作。`Federal Circuit`定位到第四段；判断关键不是法院名称是否相同，而是比较`dismissed`与`would be heard by all 12 ... judges`的动作方向和时间状态。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three.\n>\n> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n\n原文中的关系是：主体是联邦巡回法院，动作是发布一项特殊命令，命令内容是案件将由全部12名法官审理并评估重要问题；对象是Bilski案及旧裁决，时间仍在未来审理阶段。\n\nC中的关系是：主体仍是联邦巡回法院，但动作被改成`dismissed`，对象是Bilski案，完成时态`has been`表示案件已经终结。\n\n具体差异在于：主体和案件名称未变，核心动作却从“安排全院审理”反转成“已经驳回”，案件状态也从待审变成终结。","lines":["#### 定位比对法","","先把C接回题干，整句话就变成：","","> Bilski案已经被联邦巡回法院驳回。","","定位时先同时抓住选项中的`dismissed by the Federal Circuit`和原文中同一法院对案件作出的具体动作。`Federal Circuit`定位到第四段；判断关键不是法院名称是否相同，而是比较`dismissed`与`would be heard by all 12 ... judges`的动作方向和时间状态。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three.",">","> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.","","原文中的关系是：主体是联邦巡回法院，动作是发布一项特殊命令，命令内容是案件将由全部12名法官审理并评估重要问题；对象是Bilski案及旧裁决，时间仍在未来审理阶段。","","C中的关系是：主体仍是联邦巡回法院，但动作被改成`dismissed`，对象是Bilski案，完成时态`has been`表示案件已经终结。","","具体差异在于：主体和案件名称未变，核心动作却从“安排全院审理”反转成“已经驳回”，案件状态也从待审变成终结。"]},{"title":"C. It has been dismissed by the Federal Circuit.","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>该案已被联邦巡回法院驳回</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文说联邦巡回法院发布命令，让全部12名法官审理该案，并准备评估一个重要问题；“将被审理”和“已经驳回”方向相反，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了联邦巡回法院与Bilski案之间的直接关系，所以主体有明确来源。原文写的是法院安排全体法官审理，C却写成法院已经驳回案件。真正变化的是法院动作和案件状态。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案已经被联邦巡回法院驳回。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>dismissed by the Federal Circuit</code>和原文中同一法院对案件作出的具体动作。<code>Federal Circuit</code>定位到第四段；判断关键不是法院名称是否相同，而是比较<code>dismissed</code>与<code>would be heard by all 12 ... judges</code>的动作方向和时间状态。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是联邦巡回法院，动作是发布一项特殊命令，命令内容是案件将由全部12名法官审理并评估重要问题；对象是Bilski案及旧裁决，时间仍在未来审理阶段。</p>\n<p>C中的关系是：主体仍是联邦巡回法院，但动作被改成<code>dismissed</code>，对象是Bilski案，完成时态<code>has been</code>表示案件已经终结。</p>\n<p>具体差异在于：主体和案件名称未变，核心动作却从“安排全院审理”反转成“已经驳回”，案件状态也从待审变成终结。</p></section><section class=\"revealPart\" id=\"focus-q27-C-2\"><h3>写作视角法</h3><p>原文第4段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>案件将由全部12名法官审理，法院还要评估旧裁决，说明案件正在被认真推进，而不是已经遭到驳回。</p>\n</blockquote>\n<p>作者强调审理阵容异常扩大，并继续交代法院要评估是否重新考虑旧裁决，这说明案件正被认真推进。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Federal Circuit dismissed the Bilski case and declined to review the patent issue further. No full-court hearing will take place.</p>\n<p>联邦巡回法院驳回了Bilski案，并拒绝继续审查该专利问题。案件不会由全院法官审理。</p>\n</blockquote>\n<p>假设写法中的“终止”和“不审理”与实际的“全部12名法官审理”正面相反。C不是遗漏细节，而是把法院的核心动作倒写。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"C","cumulative":true,"cumulativeGro ange the legal practices in the U.S.","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>该案可能改变美国的法律实践</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>It may change the [xxx] practices in the U.S.</code>。虽然核心修饰词被遮挡，但<code>may change ... practices</code>能够与案件可能消除整类专利、法院准备重新考虑旧裁决接起来，因此D被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的跨段概括。</strong></p>\n<p>D抓住了原文中的潜在制度影响。原文先写Bilski案可能消除整类专利，接着又补了法院要评估是否重新考虑奠定旧做法的州街银行案裁决；D把两处合成了“可能改变美国的法律实践”。<code>may</code>也保留了案件尚未裁决的不确定性。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"focusId":"focus-q27-D-0","raw":"### D. It may change the legal practices in the U.S.\n\n> 该案可能改变美国的法律实践\n\n**做题模式中的状态：**选项当时显示为`It may change the [xxx] practices in the U.S.`。虽然核心修饰词被遮挡，但`may change ... practices`能够与案件可能消除整类专利、法院准备重新考虑旧裁决接起来，因此D被保留并成为本题结果。\n\n**选项类型：正确的跨段概括。**\n\nD抓住了原文中的潜在制度影响。原文先写Bilski案可能消除整类专利，接着又补了法院要评估是否重新考虑奠定旧做法的州街银行案裁决；D把两处合成了“可能改变美国的法律实践”。`may`也保留了案件尚未裁决的不确定性。\n\n**出处：**\n\n> It \"has the potential to eliminate an entire class of patents.\"\n>\n> one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling","lines":["### D. It may change the legal practices in the U.S.","","> 该案可能改变美国的法律实践","","**做题模式中的状态：**选项当时显示为`It may change the [xxx] practices in the U.S.`。虽然核心修饰词被遮挡，但`may change ... practices`能够与案件可能消除整类专利、法院准备重新考虑旧裁决接起来，因此D被保留并成为本题结果。","","**选项类型：正确的跨段概括。**","","D抓住了原文中的潜在制度影响。原文先写Bilski案可能消除整类专利，接着又补了法院要评估是否重新考虑奠定旧做法的州街银行案裁决；D把两处合成了“可能改变美国的法律实践”。`may`也 ode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"focusId":"focus-q27-D-1","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Bilski案可能改变美国的法律实践。\n\n定位时先同时抓住选项中的`may change the legal practices in the U.S.`以及原文的`potential`、`eliminate an entire class`和`reconsider`。这不是单句照抄，需要把第二段的潜在影响和第四段对旧裁决的重新审视跨段合并。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> It \"has the potential to eliminate an entire class of patents.\"\n>\n> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n\n原文中的关系是：主体是Bilski案及审理它的联邦巡回法院；动作是可能消除整类专利并重新考虑奠定旧做法的State Street Bank裁决；对象是商业方法专利规则；`potential`和`whether`都保留不确定性。\n\nD中的关系是：主体仍是Bilski案，动作被概括为`may change`，对象被概括为美国相关法律实践，范围从单一案件提升到制度层面。\n\n具体差异在于：D没有改变原文关系，而是把“取消整类专利＋重审旧裁决”的共同制度后果概括成“可能改变法律实践”。`may`准确保留尚未判决的状态。","lines":["#### 定位比对法","","先把D接回题干，整句话就变成：","","> Bilski案可能改变美国的法律实践。","","定位时先同时抓住选项中的`may change the legal practices in the U.S.`以及原文的`potential`、`eliminate an entire class`和`reconsider`。这不是单句照抄，需要把第二段的潜在影响和第四段对旧裁决的重新审视跨段合并。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> It \"has the potential to eliminate an entire class of patents.\"",">","> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.","","原文中的关系是：主体是Bilski案及审理它的联邦巡回法院；动作是可能消除整类专利并重新考虑奠定旧做法的State Street Bank裁决；对象是商业方法专利规则；`potential`和`whether`都保留不确定性。","","D中的关系是：主体仍是Bilski案，动作被概括为`may change`，对象被概括为美国相关法律实践，范围从单一案件提升到制度层面。","","具体差异在于：D没有改变原文关系，而是把“取消整类专利＋重审旧裁决”的共同制度后果概括成“可能改变法律实践”。`may`准确保留尚未判决的状态。"]},{"title":"D. It may change the legal practices in the U.S.","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>该案可能改变美国的法律实践</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>It may change the [xxx] practices in the U.S.</code>。虽然核心修饰词被遮挡，但<code>may change ... practices</code>能够与案件可能消除整类专利、法院准备重新考虑旧裁决接起来，因此D被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的跨段概括。</strong></p>\n<p>D抓住了原文中的潜在制度影响。原文先写Bilski案可能消除整类专利，接着又补了法院要评估是否重新考虑奠定旧做法的州街银行案裁决；D把两处合成了“可能改变美国的法律实践”。<code>may</code>也保留了案件尚未裁决的不确定性。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q27-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案可能改变美国的法律实践。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>may change the legal practices in the U.S.</code>以及原文的<code>potential</code>、<code>eliminate an entire class</code>和<code>reconsider</code>。这不是单句照抄，需要把第二段的潜在影响和第四段对旧裁决的重新审视跨段合并。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案及审理它的联邦巡回法院；动作是可能消除整类专利并重新考虑奠定旧做法的State Street Bank裁决；对象是商业方法专利规则；<code>potential</code>和<code>whether</code>都保留不确定性。</p>\n<p>D中的关系是：主体仍是Bilski案，动作被概括为<code>may change</code>，对象被概括为美国相关法律实践，范围从单一案件提升到制度层面。</p>\n<p>具体差异在于：D没有改变原文关系，而是把“取消整类专利＋重审旧裁决”的共同制度后果概括成“可能改变法律实践”。<code>may</code>准确保留尚未判决的状态。</p></section><section class=\"revealPart\" id=\"focus-q27-D-2\"><h3>写作视角法</h3><p>原文第2、4段是这样写的：</p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>案件可能影响整类专利，法院还准备借它重新考虑建立旧制度的裁决；潜在影响已经触及相关法律规则与实践。</p>\n</blockquote>\n<p>文章先说该案可能消除整类专利，之后具体说明全体法官将评估是否重新考虑1998年旧裁决，影响由专利类别进一步推进到规则基础。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The court will use Bilski to reconsider the rule that established business-method patents, and the outcome may alter how such patents are treated across the United States.</p>\n<p>法院将借Bilski案重新考虑建立商业方法专利的旧规则，裁判结果可能改变美国处理这类专利的方式。</p>\n</blockquote>\n<p>最小假设中的“重审旧规则”和“改变处理方式”正是原文两段已有的推进。D所需的主体、制度对象、变化方向及未决语气均能找到。</p></section>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"focusId":"focus-q27-D-2","raw":"#### 写作视角法\n\n原文第2、4段是这样写的：\n\n> It \"has the potential to eliminate an entire class of patents.\"\n>\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n>\n> 案件可能影响整类专利，法院还准备借它重新考虑建立旧制度的裁决；潜在影响已经触及相关法律规则与实践。\n\n文章先说该案可能消除整类专利，之后具体说明全体法官将评估是否重新考虑1998年旧裁决，影响由专利类别进一步推进到规则基础。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The court will use Bilski to reconsider the rule that established business-method patents, and the outcome may alter how such patents are treated across the United States.\n>\n> 法院将借Bilski案重新考虑建立商业方法专利的旧规则，裁判结果可能改变美国处理这类专利的方式。\n\n最小假设中的“重审旧规则”和“改变处理方式”正是原文两段已有的推进。D所需的主体、制度对象、变化方向及未决语气均能找到。","lines":["#### 写作视角法","","原文第2、4段是这样写的：","","> It \"has the potential to eliminate an entire class of patents.\"",">","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.",">","> 案件可能影响整类专利，法院还准备借它重新考虑建立旧制度的裁决；潜在影响已经触及相关法律规则与实践。","","文章先说该案可能消除整类专利，之后具体说明全体法官将评估是否重新考虑1998年旧裁决，影响由专利类别进一 focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true},"focusId":"focus-q27-D-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入27题题干：\n\n> 全文主旨只能确认Bilski案可能威胁整类商业方法专利，不能单独判断这种影响是否会具体改变美国的法律实践。\n\n本项最终仍要根据`potential to eliminate an entire class`和`reconsider its State Street Bank ruling`这两处局部原文判断。\n\nD实际说的是：\n\n> D. It may change the legal practices in the U.S.  \n> 该案可能改变美国的法律实践\n\n具体比较：主旨与D的主体都围绕Bilski案推动的制度变化，动作方向都是改变或收紧，作用对象都是整类商业方法专利；`looming`与`may`也都表示尚未最终落地。\n\n局部的“`reconsider` its State Street Bank ruling”和“`eliminate an entire class of patents`”分别坐实规则基础与影响范围。\n\n**复盘判断：D正确。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入27题题干：","","> 全文主旨只能确认Bilski案可能威胁整类商业方法专利，不能单独判断这种影响是否会具体改变美国的法律实践。","","本项最终仍要根据`potential to eliminate an entire class`和`reconsider its State Street Bank ruling`这两处局部原文判断。","","D实际说的是：","","> D. It may change the legal practices in the U.S.  ","> 该案可能改变美国的法律实践","","具体比较：主旨与D的主体都围绕Bilski案推动的制度变化，动作方向都是改变或收紧，作用对象都是整类商业方法专利；`looming`与`may`也都表示尚未最终落地。","","局部的“`reconsider` its State Street Bank ruling”和“`eliminate an entire class of patents`”分别坐实规则基础与影响范围。","","**复盘判断：D正确。**"]},{"title":"27题结论","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p><strong>27. D. It may change the legal practices in the U.S.</strong></p>\n</blockquote>\n<ul>\n<li>A把旧案裁决和待审程序拼成了Bilski案已经有一致裁决；</li>\n<li>B把“案件影响重大”改成了“一笔很大的商业交易”；</li>\n<li>C把全体法官继续审理改成案件已经被驳回；</li>\n<li>D跨段概括了案件可能取消整类专利并重审旧规则的制度影响。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"27题","focus":[0,360,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"conclusion","question":"27","questionConclusion":true}},{"title":"28题 · 题干、题型与核心出处","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p>The word “about-face” (Line 1, Para. 3) most probably means ______.<br />\n第3段第1行的“about-face”最可能是什么意思？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道猜词题。题干已经把位置限定在第三段首句，<code>because</code>后面的内容直接解释了<code>about-face</code>：同一个法院过去引入这类专利，现在却可能限制它们。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.</p>\n</blockquote>\n<p>猜词位置后面紧跟<code>because</code>，作者已经解释了这个词：同一个联邦巡回法院过去亲自引入这类专利，现在却准备限制它们。要找的是这种前后方向反转，而不是单独猜<code>about</code>或<code>face</code>。</p>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"question","question":"28","questionIntro":true}},{"title":"A. loss of goodwill","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>善意或信誉的丧失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了<code>dramatic</code>带来的强烈变化感，所以可能让人觉得是某种负面损失。原文写的是同一法院前后做法反向，A却写成善意或信誉减少。原文没有建立任何信誉评价。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"focusId":"focus-q28-A-0","raw":"### A. loss of goodwill\n\n> 善意或信誉的丧失\n\n**做题模式中的状态：**当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。\n\n**错误类型：第三类——无中生有。**\n\nA抓住了`dramatic`带来的强烈变化感，所以可能让人觉得是某种负面损失。原文写的是同一法院前后做法反向，A却写成善意或信誉减少。原文没有建立任何信誉评价。\n\n**命题人借用的原文材料：**\n\n> Curbs on business-method claims would be a dramatic about-face,\n>\n> because it was the Federal Circuit itself that introduced such patents","lines":["### A. loss of goodwill","","> 善意或信誉的丧失","","**做题模式中的状态：**当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。","","**错误类型：第三类——无中生有。**","","A抓住了`dramatic`带来的强烈变化感，所以可能让人觉得是某种负面损失。原文写的是同一法院前后做法反向，A却写成善意或信誉减少。原文没有建立任何信誉评价。","","**命题人借用的原文材料：**","","> Curbs on business-method claims would be a dramatic about-face,",">","> because it was the Federal Circuit itself that introduced such patents"]},{"title":"A. loss of goodwill","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>善意或信誉的丧失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了<code>dramatic</code>带来的强烈变化感，所以可能让人觉得是某种负面损失。原文写的是同一法院前后做法反向，A却写成善意或信誉减少。原文没有建立任何信誉评价。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示善意或信誉的丧失。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的<code>about-face</code>及选项中的<code>loss of goodwill</code>。题干已经把位置锁定在第三段第一句；<code>because</code>后面的内容就是作者给出的语境解释，必须优先于对<code>dramatic</code>的情绪联想。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.</p>\n</blockquote>\n<p>原文中的关系是：主体是同一个Federal Circuit；过去动作是<code>introduced such patents</code>，现在设想的动作是<code>Curbs</code>；<code>because</code>把前后相反动作直接连成解释关系。</p>\n<p>A中的关系是：A把该词解释成<code>goodwill</code>这一声誉或善意对象的<code>loss</code>，需要原文出现某个主体的信誉下降。</p>\n<p>具体差异在于：原文表达的是行动方向反转，A却改成评价对象的减少。文章没有<code>goodwill</code>、信任、声誉或公众评价这条线。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"focusId":"focus-q28-A-1","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第三段第一行的`about-face`表示善意或信誉的丧失。\n\n定位时先同时抓住题干指定的`about-face`及选项中的`loss of goodwill`。题干已经把位置锁定在第三段第一句；`because`后面的内容就是作者给出的语境解释，必须优先于对`dramatic`的情绪联想。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.\n\n原文中的关系是：主体是同一个Federal Circuit；过去动作是`introduced such patents`，现在设想的动作是`Curbs`；`because`把前后相反动作直接连成解释关系。\n\nA中的关系是：A把该词解释成`goodwill`这一声誉或善意对象的`loss`，需要原文出现某个主体的信誉下降。\n\n具体差异在于：原文表达的是行动方向反转，A却改成评价对象的减少。文章没有`goodwill`、信任、声誉或公众评价这条线。","lines":["#### 定位比对法","","先把A接回题干，整句话就变成：","","> 第三段第一行的`about-face`表示善意或信誉的丧失。","","定位时先同时抓住题干指定的`about-face`及选项中的`loss of goodwill`。题干已经把位置锁定在第三段第一句；`because`后面的内容就是作者给出的语境解释，必须优先于对`dramatic`的情绪联想。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.","","原文中的关系是：主体是同一个Federal Circuit；过去动作是`introduced such patents`，现在设想的动作是`Curbs`；`because`把前后相反动作直接连成解释关系。","","A中的关系是：A把该词解释成`goodwill`这一声誉或善意对象的`loss`，需要原文出现某个主体的信誉下降。","","具体差异在于：原文表达的是行动方向反转，A却改成评价对象的减少。文章没有`goodwill`、信任、声誉或公众评价这条线。"]},{"title":"A. loss of goodwill","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>善意或信誉的丧失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了<code>dramatic</code>带来的强烈变化感，所以可能让人觉得是某种负面损失。原文写的是同一法院前后做法反向，A却写成善意或信誉减少。原文没有建立任何信誉评价。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示善意或信誉的丧失。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的<code>about-face</code>及选项中的<code>loss of goodwill</code>。题干已经把位置锁定在第三段第一句；<code>because</code>后面的内容就是作者给出的语境解释，必须优先于对<code>dramatic</code>的情绪联想。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.</p>\n</blockquote>\n<p>原文中的关系是：主体是同一个Federal Circuit；过去动作是<code>introduced such patents</code>，现在设想的动作是<code>Curbs</code>；<code>because</code>把前后相反动作直接连成解释关系。</p>\n<p>A中的关系是：A把该词解释成<code>goodwill</code>这一声誉或善意对象的<code>loss</code>，需要原文出现某个主体的信誉下降。</p>\n<p>具体差异在于：原文表达的是行动方向反转，A却改成评价对象的减少。文章没有<code>goodwill</code>、信任、声誉或公众评价这条线。</p></section><section class=\"revealPart\" id=\"focus-q28-A-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>同一法院过去引入、现在可能限制同一类专利，构成前后动作反转；句中没有善意或信誉的得失。</p>\n</blockquote>\n<p>作者写完<code>about-face</code>后立刻回顾“正是这个法院自己在1998年引入此类专利”，用同一主体的前后动作解释词义。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The court's retreat has cost it the goodwill of patent holders and damaged public trust in the institution.</p>\n<p>法院的退让使其失去了专利持有人的好感，并损害了公众对该机构的信任。</p>\n</blockquote>\n<p>假设写法需要声誉主体、失去对象和评价结果；实际句子只有“引入→限制”的动作对照。A所需的语义关系完全缺席。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"focusId":"focus-q28-A-2","raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.\n>\n> 同一法院过去引入、现在可能限制同一类专利，构成前后动作反转；句中没有善意或信誉的得失。\n\n作者写完`about-face`后立刻回顾“正是这个法院自己在1998年引入此类专利”，用同一主体的前后动作解释词义。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The court's retreat has cost it the goodwill of patent holders and damaged public trust in the institution.\n>\n> 法院的退让使其失去了专利持有人的好感，并损害了公众对该机构的信任。\n\n假设写法需要声誉主体、失去对象和评价结果；实际句子只有“引入→限制”的动作对照。A所需的语义关系完全缺席。","lines":["#### 写作视角法","","原文第3段是这样写的：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.",">","> 同一法院过去引入、现在可能限制同一类专利，构成前后动作反转；句中没有善意或信誉的得失。","","作者写完`about-face`后立刻回顾“正是这个法院自己在1998年引入此类专利”，用同一主体的前后动作解释词义。","","如果A真是作者的意思，文章至少得写成：","","> The court's retreat has cost it the goodwill of patent holders and damaged public trust in the institution.",">","> 法院的退让使其失去了专利持有人的好感，并损害了公众对该机构的信任。","","假设写法需要声誉主体、失去对象和评价结果；实际句子只有“引入→限制”的动作对照。A所需的语义关系完全缺席。"]},{"title":"A. loss of goodwill","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>善意或信誉的丧失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了<co
