1885},"meta":{"kind":"method","question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false},"focusId":"focus-q29-A-2","raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n>\n> The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.\n>\n> 旧裁决正在被重新考虑，专利保护范围也在收窄；相关专利正承受法律挑战，而不是不受挑战。\n\n第四段把Bilski案交由全体法官审理并重审旧规则，第五段继续写最高法院的一系列收紧裁决，法律压力逐层加强。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Business-method patents remain immune to legal challenge. The Federal Circuit will not reconsider its earlier ruling, and the Supreme Court has left patent protections unchanged.\n>\n> 商业方法专利仍不受法律挑战。联邦巡回法院不会重新考虑旧裁决，最高法院也没有改变专利保护。\n\n假设写法需要“拒绝重审＋保护不变”；实际文章正好写“考虑重审＋保护缩小”。A所需的行文与原文逐项相反。","lines":["#### 写作视角法","","原文第4、5段是这样写的：","","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.",">","> The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.",">","> 旧裁决正在被重新考虑，专利保护范围也在收窄；相关专利正承受法律挑战，而不是不受挑战。","","第四段把Bilski案交由全体法官审理并重审旧规则，第五段继续写最高法院的一系列收紧裁决，法律压力逐层加强。","","如果A真是作者的意思，文章至少得写成：","","> Business-method patents remain immune to legal challenge. The Federal Circuit will not reconsider its earlier ruling, and the Supreme Court has left patent protections unchanged.",">","> 商业方法专利仍不受法律挑战。联邦巡回法院不会重新考虑旧裁决，最高法院也没有改变专利保护。","","假设写法需要“拒绝重审＋保护不变”；实际文章正好写“考虑重审＋保护缩小”。A所需的行文与原文逐项相反。"]},{"title":"A. are immune to legal challenges","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-A-0\"><blockquote>\n<p>不受法律挑战影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。最后两段恰好写法院要重新考虑旧裁决、最高法院也在缩小保护范围，这说明相关专利正在受到法律挑战；A的方向相反，因此被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住了法院、裁决和专利保护这些法律场景，所以形式上与原文接近。原文写的是相关规则正在被重新审视、保护范围正在收窄，A却写成商业方法专利不受法律挑战。真正变化的是挑战是否存在这一方向。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n<p>a series of recent decisions ... has narrowed the scope of protections for patent holders</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利不受法律挑战影响。</p>\n</blockquote>\n<p>定位时先同时抓住题干的范围限制<code>the last two paragraphs</code>和选项中的<code>immune to legal challenges</code>。最后两段必须整体读取：第四段写法院可能重新考虑旧裁决，第五段写最高法院已缩小专利保护范围。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：法律主体是Federal Circuit和Supreme Court；动作是重新考虑旧裁决、缩小保护范围；对象是商业方法专利规则及专利持有人保护，说明挑战正在发生。</p>\n<p>A中的关系是：主体是商业方法专利，谓语<code>are immune to</code>断言它们不会受到法律挑战，范围是绝对免疫。</p>\n<p>具体差异在于：A把“正在被两级法院重新审视和收紧”改成“完全不受挑战”，方向直接反转；<code>immune</code>还把程度绝对化。</p></section><section class=\"revealPart\" id=\"focus-q29-A-2\"><h3>写作视角法</h3><p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>旧裁决正在被重新考虑，专利保护范围也在收窄；相关专利正承受法律挑战，而不是不受挑战。</p>\n</blockquote>\n<p>第四段把Bilski案交由全体法官审理并重审旧规则，第五段继续写最高法院的一系列收紧裁决，法律压力逐层加强。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Business-method patents remain immune to legal challenge. The Federal Circuit will not reconsider its earlier ruling, and the Supreme Court has left patent protections unchanged.</p>\n<p>商业方法专利仍不受法律挑战。联邦巡回法院不会重新考虑旧裁决，最高法院也没有改变专利保护。</p>\n</blockquote>\n<p>假设写法需要“拒绝重审＋保护不变”；实际文章正好写“考虑重审＋保护缩小”。A所需的行文与原文逐项相反。</p></section><section class=\"revealPart\" id=\"focus-q29-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨已经确定整类商业方法专利正面临迫近威胁，因此从最后两段得到的结论至少不能是它们对法律挑战免疫。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. are immune to legal challenges<br />\n不受法律挑战影响</p>\n</blockquote>\n<p>具体比较：主旨的方向是风险和收紧，A的方向是安全和免疫；动作方向、程度和最终状态全部相反。</p>\n<p>局部的“<code>reconsider</code> its State Street Bank ruling”和“<code>narrowed the scope of protections</code>”直接证明法律挑战存在。</p>\n<p><strong>复盘判断：A错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":true},"focusId":"focus-q29-A-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨已经确定整类商业方法专利正面临迫近威胁，因此从最后两段得到的结论至少不能是它们对法律挑战免疫。\n\n但A实际说的是：\n\n> A. are immune to legal challenges  \n> 不受法律挑战影响\n\n具体比较：主旨的方向是风险和收紧，A的方向是安全和免疫；动作方向、程度和最终状态全部相反。\n\n局部的“`reconsider` its State Street Bank ruling”和“`narrowed the scope of protections`”直接证明法律挑战存在。\n\n**复盘判断：A错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入29题题干：","","> 全文主旨已经确定整类商业方法专利正面临迫近威胁，因此从最后两段得到的结论至少不能是它们对法律挑战免疫。","","但A实际说的是：","","> A. are immune to legal challenges  ","> 不受法律挑战影响","","具体比较：主旨的方向是风险和收紧，A的方向是安全和免疫；动作方向、程度和最终状态全部相反。","","局部的“`reconsider` its State Street Bank ruling”和“`narrowed the scope of protections`”直接证明法律挑战存在。","","**复盘判断：A错误。**"]},{"title":"B. are often unnecessarily issued","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-B-0\"><blockquote>\n<p>经常在没有必要的情况下被授予</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>B抓住了最后一段的<code>too many patents</code>和<code>inventions that are obvious</code>。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。<code>often</code>没有把所有专利一概否定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false},"focusId":"focus-q29-B-0","raw":"### B. are often unnecessarily issued\n\n> 经常在没有必要的情况下被授予\n\n**做题模式中的状态：**当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。\n\n**选项类型：正确的局部推断。**\n\nB抓住了最后一段的`too many patents`和`inventions that are obvious`。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。`often`没有把所有专利一概否定。\n\n**出处：**\n\n> the justices signaled that too many patents were being upheld for \"inventions\" that are obvious\n>\n> one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling","lines":["### B. are often unnecessarily issued","","> 经常在没有必要的情况下被授予","","**做题模式中的状态：**当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。","","**选项类型：正确的局部推断。**","","B抓住了最后一段的`too many patents`和`inventions that are obvious`。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。`often`没有把所有专利一概否定。","","**出处：**","","> the justices signaled that too many patents were being upheld for \"inventions\" that are obvious",">","> one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling"]},{"title":"B. are often unnecessarily issued","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-B-0\"><blockquote>\n<p>经常在没有必要的情况下被授予</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>B抓住了最后一段的<code>too many patents</code>和<code>inventions that are obvious</code>。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。<code>often</code>没有把所有专利一概否定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利经常在没有必要的情况下被授予。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的最后两段以及选项中的<code>unnecessarily issued</code>。<code>unnecessarily</code>不是原词，需要由第五段的<code>too many patents</code>和<code>inventions that are obvious</code>作最小推断，再用第四段的<code>reconsider</code>补充制度正在纠偏。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：最高法院法官是评价主体，指出被维持的专利数量“太多”，对应的“发明”又是<code>obvious</code>；联邦巡回法院还准备重新考虑建立旧做法的裁决。</p>\n<p>B中的关系是：主体被概括成商业方法专利，<code>often unnecessarily issued</code>把“数量过多＋发明显而易见”压缩成部分授予缺乏必要性；<code>often</code>保留非全称范围。</p>\n<p>具体差异在于：B没有照抄<code>upheld</code>，但作出的推断很小：若太多显而易见的“发明”仍获专利支持，就存在相当数量本不应给予的专利。它没有把所有专利一概判为无效。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false},"focusId":"focus-q29-B-1","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 从最后两段可以知道，商业方法专利经常在没有必要的情况下被授予。\n\n定位时先同时抓住题干指定的最后两段以及选项中的`unnecessarily issued`。`unnecessarily`不是原词，需要由第五段的`too many patents`和`inventions that are obvious`作最小推断，再用第四段的`reconsider`补充制度正在纠偏。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> The justices signaled that too many patents were being upheld for \"inventions\" that are obvious.\n>\n> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n\n原文中的关系是：最高法院法官是评价主体，指出被维持的专利数量“太多”，对应的“发明”又是`obvious`；联邦巡回法院还准备重新考虑建立旧做法的裁决。\n\nB中的关系是：主体被概括成商业方法专利，`often unnecessarily issued`把“数量过多＋发明显而易见”压缩成部分授予缺乏必要性；`often`保留非全称范围。\n\n具体差异在于：B没有照抄`upheld`，但作出的推断很小：若太多显而易见的“发明”仍获专利支持，就存在相当数量本不应给予的专利。它没有把所有专利一概判为无效。","lines":["#### 定位比对法","","先把B接回题干，整句话就变成：","","> 从最后两段可以知道，商业方法专利经常在没有必要的情况下被授予。","","定位时先同时抓住题干指定的最后两段以及选项中的`unnecessarily issued`。`unnecessarily`不是原词，需要由第五段的`too many patents`和`inventions that are obvious`作最小推断，再用第四段的`reconsider`补充制度正在纠偏。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> The justices signaled that too many patents were being upheld for \"inventions\" that are obvious.",">","> One issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.","","原文中的关系是：最高法院法官是评价主体，指出被维持的专利数量“太多”，对应的“发明”又是`obvious`；联邦巡回法院还准备重新考虑建立旧做法的裁决。","","B中的关系是：主体被概括成商业方法专利，`often unnecessarily issued`把“数量过多＋发明显而易见”压缩成部分授予缺乏必要性；`often`保留非全称范围。","","具体差异在于：B没有照抄`upheld`，但作出的推断很小：若太多显而易见的“发明”仍获专利支持，就存在相当数量本不应给予的专利。它没有把所有专利一概判为无效。"]},{"title":"B. are often unnecessarily issued","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-B-0\"><blockquote>\n<p>经常在没有必要的情况下被授予</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>B抓住了最后一段的<code>too many patents</code>和<code>inventions that are obvious</code>。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。<code>often</code>没有把所有专利一概否定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利经常在没有必要的情况下被授予。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的最后两段以及选项中的<code>unnecessarily issued</code>。<code>unnecessarily</code>不是原词，需要由第五段的<code>too many patents</code>和<code>inventions that are obvious</code>作最小推断，再用第四段的<code>reconsider</code>补充制度正在纠偏。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：最高法院法官是评价主体，指出被维持的专利数量“太多”，对应的“发明”又是<code>obvious</code>；联邦巡回法院还准备重新考虑建立旧做法的裁决。</p>\n<p>B中的关系是：主体被概括成商业方法专利，<code>often unnecessarily issued</code>把“数量过多＋发明显而易见”压缩成部分授予缺乏必要性；<code>often</code>保留非全称范围。</p>\n<p>具体差异在于：B没有照抄<code>upheld</code>，但作出的推断很小：若太多显而易见的“发明”仍获专利支持，就存在相当数量本不应给予的专利。它没有把所有专利一概判为无效。</p></section><section class=\"revealPart\" id=\"focus-q29-B-2\"><h3>写作视角法</h3><p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>旧裁决可能被重审，最高法院又认为太多显而易见的“发明”仍获专利支持；这表明部分专利授予或维持得过多。</p>\n</blockquote>\n<p>作者先写旧裁决可能被重新考虑，再用最高法院的判断解释背景：过多明显的“发明”仍被授予或维持专利保护。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The courts are concerned that business-method patents have often been granted or sustained even when the claimed inventions are obvious and do not warrant protection.</p>\n<p>法院担心，即使所称发明显而易见、不值得保护，商业方法专利仍经常被授予或维持。</p>\n</blockquote>\n<p>最小假设只是把原文的评价关系说直：<code>too many</code>提供频率或数量方向，<code>obvious</code>提供“不值得专利保护”的理由。B所需的写法已经包含在最后一段。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false},"focusId":"focus-q29-B-2","raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n>\n> Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.\n>\n> 旧裁决可能被重审，最高法院又认为太多显而易见的“发明”仍获专利支持；这表明部分专利授予或维持得过多。\n\n作者先写旧裁决可能被重新考虑，再用最高法院的判断解释背景：过多明显的“发明”仍被授予或维持专利保护。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The courts are concerned that business-method patents have often been granted or sustained even when the claimed inventions are obvious and do not warrant protection.\n>\n> 法院担心，即使所称发明显而易见、不值得保护，商业方法专利仍经常被授予或维持。\n\n最小假设只是把原文的评价关系说直：`too many`提供频率或数量方向，`obvious`提供“不值得专利保护”的理由。B所需的写法已经包含在最后一段。","lines":["#### 写作视角法","","原文第4、5段是这样写的：","","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.",">","> Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.",">","> 旧裁决可能被重审，最高法院又认为太多显而易见的“发明”仍获专利支持；这表明部分专利授予或维持得过多。","","作者先写旧裁决可能被重新考虑，再用最高法院的判断解释背景：过多明显的“发明”仍被授予或维持专利保护。","","如果B真是作者的意思，文章至少得写成：","","> The courts are concerned that business-method patents have often been granted or sustained even when the claimed inventions are obvious and do not warrant protection.",">","> 法院担心，即使所称发明显而易见、不值得保护，商业方法专利仍经常被授予或维持。","","最小假设只是把原文的评价关系说直：`too many`提供频率或数量方向，`obvious`提供“不值得专利保护”的理由。B所需的写法已经包含在最后一段。"]},{"title":"B. are often unnecessarily issued","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-B-0\"><blockquote>\n<p>经常在没有必要的情况下被授予</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>B抓住了最后一段的<code>too many patents</code>和<code>inventions that are obvious</code>。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。<code>often</code>没有把所有专利一概否定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利经常在没有必要的情况下被授予。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的最后两段以及选项中的<code>unnecessarily issued</code>。<code>unnecessarily</code>不是原词，需要由第五段的<code>too many patents</code>和<code>inventions that are obvious</code>作最小推断，再用第四段的<code>reconsider</code>补充制度正在纠偏。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：最高法院法官是评价主体，指出被维持的专利数量“太多”，对应的“发明”又是<code>obvious</code>；联邦巡回法院还准备重新考虑建立旧做法的裁决。</p>\n<p>B中的关系是：主体被概括成商业方法专利，<code>often unnecessarily issued</code>把“数量过多＋发明显而易见”压缩成部分授予缺乏必要性；<code>often</code>保留非全称范围。</p>\n<p>具体差异在于：B没有照抄<code>upheld</code>，但作出的推断很小：若太多显而易见的“发明”仍获专利支持，就存在相当数量本不应给予的专利。它没有把所有专利一概判为无效。</p></section><section class=\"revealPart\" id=\"focus-q29-B-2\"><h3>写作视角法</h3><p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>旧裁决可能被重审，最高法院又认为太多显而易见的“发明”仍获专利支持；这表明部分专利授予或维持得过多。</p>\n</blockquote>\n<p>作者先写旧裁决可能被重新考虑，再用最高法院的判断解释背景：过多明显的“发明”仍被授予或维持专利保护。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The courts are concerned that business-method patents have often been granted or sustained even when the claimed inventions are obvious and do not warrant protection.</p>\n<p>法院担心，即使所称发明显而易见、不值得保护，商业方法专利仍经常被授予或维持。</p>\n</blockquote>\n<p>最小假设只是把原文的评价关系说直：<code>too many</code>提供频率或数量方向，<code>obvious</code>提供“不值得专利保护”的理由。B所需的写法已经包含在最后一段。</p></section><section class=\"revealPart\" id=\"focus-q29-B-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利正面临收紧，不能单独推出它们“经常在没有必要时被授予”这一局部判断。</p>\n</blockquote>\n<p>本项最终仍要根据<code>too many patents</code>和<code>inventions that are obvious</code>这两个局部限制判断。</p>\n<p>B实际说的是：</p>\n<blockquote>\n<p>B. are often unnecessarily issued<br />\n经常在没有必要的情况下被授予</p>\n</blockquote>\n<p>具体比较：主旨的方向是收紧整类专利，B给出收紧的制度理由；主体范围相符，动作是授予，评价方向是过度。主旨提供大方向，局部原文负责完成“unnecessarily”的推断。</p>\n<p>“<code>too many patents</code>”与“<code>inventions that are obvious</code>”共同坐实：数量过多且对象显而易见，最小推断就是部分专利并无授予必要。</p>\n<p><strong>复盘判断：B正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":true},"focusId":"focus-q29-B-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨只能确认商业方法专利正面临收紧，不能单独推出它们“经常在没有必要时被授予”这一局部判断。\n\n本项最终仍要根据`too many patents`和`inventions that are obvious`这两个局部限制判断。\n\nB实际说的是：\n\n> B. are often unnecessarily issued  \n> 经常在没有必要的情况下被授予\n\n具体比较：主旨的方向是收紧整类专利，B给出收紧的制度理由；主体范围相符，动作是授予，评价方向是过度。主旨提供大方向，局部原文负责完成“unnecessarily”的推断。\n\n“`too many patents`”与“`inventions that are obvious`”共同坐实：数量过多且对象显而易见，最小推断就是部分专利并无授予必要。\n\n**复盘判断：B正确。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入29题题干：","","> 全文主旨只能确认商业方法专利正面临收紧，不能单独推出它们“经常在没有必要时被授予”这一局部判断。","","本项最终仍要根据`too many patents`和`inventions that are obvious`这两个局部限制判断。","","B实际说的是：","","> B. are often unnecessarily issued  ","> 经常在没有必要的情况下被授予","","具体比较：主旨的方向是收紧整类专利，B给出收紧的制度理由；主体范围相符，动作是授予，评价方向是过度。主旨提供大方向，局部原文负责完成“unnecessarily”的推断。","","“`too many patents`”与“`inventions that are obvious`”共同坐实：数量过多且对象显而易见，最小推断就是部分专利并无授予必要。","","**复盘判断：B正确。**"]},{"title":"C. lower the esteem for patent holders","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-C-0\"><blockquote>\n<p>降低专利持有人的声望</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>lower the [xxx] for patent holders</code>。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了原文中的<code>patent holders</code>和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false},"focusId":"focus-q29-C-0","raw":"### C. lower the esteem for patent holders\n\n> 降低专利持有人的声望\n\n**做题模式中的状态：**选项当时显示为`lower the [xxx] for patent holders`。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。\n\n**错误类型：第一类——歪曲原意。**\n\nC抓住了原文中的`patent holders`和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。\n\n**命题人借用的原文材料：**\n\n> a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders","lines":["### C. lower the esteem for patent holders","","> 降低专利持有人的声望","","**做题模式中的状态：**选项当时显示为`lower the [xxx] for patent holders`。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。","","**错误类型：第一类——歪曲原意。**","","C抓住了原文中的`patent holders`和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。","","**命题人借用的原文材料：**","","> a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders"]},{"title":"C. lower the esteem for patent holders","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-C-0\"><blockquote>\n<p>降低专利持有人的声望</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>lower the [xxx] for patent holders</code>。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了原文中的<code>patent holders</code>和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利降低了专利持有人的声望。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>lower the esteem for patent holders</code>和原文中的<code>narrowed the scope of protections for patent holders</code>。两者都出现<code>patent holders</code>和“降低”的表面方向，但必须逐项核对是谁降低、降低的是什么。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：主体是最高法院近期一系列裁决，动作是<code>narrowed</code>，对象是<code>the scope of protections</code>，受影响者是专利持有人。</p>\n<p>C中的关系是：主体被换成商业方法专利，动作变成<code>lower</code>，对象从法律保护范围换成<code>esteem</code>即声望，专利持有人仍只是受影响者。</p>\n<p>具体差异在于：C保留了<code>patent holders</code>和下降方向，却同时偷换动作主体与被降低对象。原文讲权利保护变窄，C改成名誉评价下降。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false},"focusId":"focus-q29-C-1","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 从最后两段可以知道，商业方法专利降低了专利持有人的声望。\n\n定位时先同时抓住选项中的`lower the esteem for patent holders`和原文中的`narrowed the scope of protections for patent holders`。两者都出现`patent holders`和“降低”的表面方向，但必须逐项核对是谁降低、降低的是什么。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.\n\n原文中的关系是：主体是最高法院近期一系列裁决，动作是`narrowed`，对象是`the scope of protections`，受影响者是专利持有人。\n\nC中的关系是：主体被换成商业方法专利，动作变成`lower`，对象从法律保护范围换成`esteem`即声望，专利持有人仍只是受影响者。\n\n具体差异在于：C保留了`patent holders`和下降方向，却同时偷换动作主体与被降低对象。原文讲权利保护变窄，C改成名誉评价下降。","lines":["#### 定位比对法","","先把C接回题干，整句话就变成：","","> 从最后两段可以知道，商业方法专利降低了专利持有人的声望。","","定位时先同时抓住选项中的`lower the esteem for patent holders`和原文中的`narrowed the scope of protections for patent holders`。两者都出现`patent holders`和“降低”的表面方向，但必须逐项核对是谁降低、降低的是什么。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.","","原文中的关系是：主体是最高法院近期一系列裁决，动作是`narrowed`，对象是`the scope of protections`，受影响者是专利持有人。","","C中的关系是：主体被换成商业方法专利，动作变成`lower`，对象从法律保护范围换成`esteem`即声望，专利持有人仍只是受影响者。","","具体差异在于：C保留了`patent holders`和下降方向，却同时偷换动作主体与被降低对象。原文讲权利保护变窄，C改成名誉评价下降。"]},{"title":"C. lower the esteem for patent holders","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-C-0\"><blockquote>\n<p>降低专利持有人的声望</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>lower the [xxx] for patent holders</code>。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了原文中的<code>patent holders</code>和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利降低了专利持有人的声望。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>lower the esteem for patent holders</code>和原文中的<code>narrowed the scope of protections for patent holders</code>。两者都出现<code>patent holders</code>和“降低”的表面方向，但必须逐项核对是谁降低、降低的是什么。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：主体是最高法院近期一系列裁决，动作是<code>narrowed</code>，对象是<code>the scope of protections</code>，受影响者是专利持有人。</p>\n<p>C中的关系是：主体被换成商业方法专利，动作变成<code>lower</code>，对象从法律保护范围换成<code>esteem</code>即声望，专利持有人仍只是受影响者。</p>\n<p>具体差异在于：C保留了<code>patent holders</code>和下降方向，却同时偷换动作主体与被降低对象。原文讲权利保护变窄，C改成名誉评价下降。</p></section><section class=\"revealPart\" id=\"focus-q29-C-2\"><h3>写作视角法</h3><p>原文第5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>法院裁决缩小的是专利持有人的法律保护范围，后文继续讨论专利门槛；文章没有评价持有人的社会声望。</p>\n</blockquote>\n<p>第五段用司法裁决解释专利持有人可获得的保护范围正在收缩，后文继续谈显而易见的“发明”被过度支持。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The proliferation of business-method patents has lowered public esteem for patent holders and damaged their reputation.</p>\n<p>商业方法专利的扩张降低了公众对专利持有人的评价，并损害了他们的声誉。</p>\n</blockquote>\n<p>假设写法需要“专利造成声誉损害”；实际写法是“法院裁决造成保护范围缩小”。表面都能翻成“降低”，但主体、对象和关系完全不同。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false},"focusId":"focus-q29-C-2","raw":"#### 写作视角法\n\n原文第5段是这样写的：\n\n> The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.\n>\n> Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.\n>\n> 法院裁决缩小的是专利持有人的法律保护范围，后文继续讨论专利门槛；文章没有评价持有人的社会声望。\n\n第五段用司法裁决解释专利持有人可获得的保护范围正在收缩，后文继续谈显而易见的“发明”被过度支持。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The proliferation of business-method patents has lowered public esteem for patent holders and damaged their reputation.\n>\n> 商业方法专利的扩张降低了公众对专利持有人的评价，并损害了他们的声誉。\n\n假设写法需要“专利造成声誉损害”；实际写法是“法院裁决造成保护范围缩小”。表面都能翻成“降低”，但主体、对象和关系完全不同。","lines":["#### 写作视角法","","原文第5段是这样写的：","","> The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.",">","> Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.",">","> 法院裁决缩小的是专利持有人的法律保护范围，后文继续讨论专利门槛；文章没有评价持有人的社会声望。","","第五段用司法裁决解释专利持有人可获得的保护范围正在收缩，后文继续谈显而易见的“发明”被过度支持。","","如果C真是作者的意思，文章至少得写成：","","> The proliferation of business-method patents has lowered public esteem for patent holders and damaged their reputation.",">","> 商业方法专利的扩张降低了公众对专利持有人的评价，并损害了他们的声誉。","","假设写法需要“专利造成声誉损害”；实际写法是“法院裁决造成保护范围缩小”。表面都能翻成“降低”，但主体、对象和关系完全不同。"]},{"title":"C. lower the esteem for patent holders","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-C-0\"><blockquote>\n<p>降低专利持有人的声望</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>lower the [xxx] for patent holders</code>。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了原文中的<code>patent holders</code>和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利降低了专利持有人的声望。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>lower the esteem for patent holders</code>和原文中的<code>narrowed the scope of protections for patent holders</code>。两者都出现<code>patent holders</code>和“降低”的表面方向，但必须逐项核对是谁降低、降低的是什么。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：主体是最高法院近期一系列裁决，动作是<code>narrowed</code>，对象是<code>the scope of protections</code>，受影响者是专利持有人。</p>\n<p>C中的关系是：主体被换成商业方法专利，动作变成<code>lower</code>，对象从法律保护范围换成<code>esteem</code>即声望，专利持有人仍只是受影响者。</p>\n<p>具体差异在于：C保留了<code>patent holders</code>和下降方向，却同时偷换动作主体与被降低对象。原文讲权利保护变窄，C改成名誉评价下降。</p></section><section class=\"revealPart\" id=\"focus-q29-C-2\"><h3>写作视角法</h3><p>原文第5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>法院裁决缩小的是专利持有人的法律保护范围，后文继续讨论专利门槛；文章没有评价持有人的社会声望。</p>\n</blockquote>\n<p>第五段用司法裁决解释专利持有人可获得的保护范围正在收缩，后文继续谈显而易见的“发明”被过度支持。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The proliferation of business-method patents has lowered public esteem for patent holders and damaged their reputation.</p>\n<p>商业方法专利的扩张降低了公众对专利持有人的评价，并损害了他们的声誉。</p>\n</blockquote>\n<p>假设写法需要“专利造成声誉损害”；实际写法是“法院裁决造成保护范围缩小”。表面都能翻成“降低”，但主体、对象和关系完全不同。</p></section><section class=\"revealPart\" id=\"focus-q29-C-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利的法律处境正在收紧，不能单独判断专利持有人的社会声望是否下降。</p>\n</blockquote>\n<p>本项最终仍要根据<code>narrowed the scope of protections for patent holders</code>这处局部原文判断。</p>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>C. lower the esteem for patent holders<br />\n降低专利持有人的声望</p>\n</blockquote>\n<p>具体比较：主旨的对象是商业方法专利的法律命运，C的对象是持有人的声望；主旨中的动作来自法院，C的动作主体却是专利本身。对象和因果主体均偏离。</p>\n<p>局部短语是“<code>narrowed the scope of protections</code>”，不是<code>lowered the esteem</code>，不能仅凭<code>patent holders</code>重合选C。</p>\n<p><strong>复盘判断：C错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":true},"focusId":"focus-q29-C-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨只能确认商业方法专利的法律处境正在收紧，不能单独判断专利持有人的社会声望是否下降。\n\n本项最终仍要根据`narrowed the scope of protections for patent holders`这处局部原文判断。\n\n但C实际说的是：\n\n> C. lower the esteem for patent holders  \n> 降低专利持有人的声望\n\n具体比较：主旨的对象是商业方法专利的法律命运，C的对象是持有人的声望；主旨中的动作来自法院，C的动作主体却是专利本身。对象和因果主体均偏离。\n\n局部短语是“`narrowed the scope of protections`”，不是`lowered the esteem`，不能仅凭`patent holders`重合选C。\n\n**复盘判断：C错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入29题题干：","","> 全文主旨只能确认商业方法专利的法律处境正在收紧，不能单独判断专利持有人的社会声望是否下降。","","本项最终仍要根据`narrowed the scope of protections for patent holders`这处局部原文判断。","","但C实际说的是：","","> C. lower the esteem for patent holders  ","> 降低专利持有人的声望","","具体比较：主旨的对象是商业方法专利的法律命运，C的对象是持有人的声望；主旨中的动作来自法院，C的动作主体却是专利本身。对象和因果主体均偏离。","","局部短语是“`narrowed the scope of protections`”，不是`lowered the esteem`，不能仅凭`patent holders`重合选C。","","**复盘判断：C错误。**"]},{"title":"D. increase the incidence of risks","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>增加风险发生的频率</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>risks</code>能让人想到第四段能源市场中的<code>risk</code>。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了第四段中的<code>risk</code>，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false},"focusId":"focus-q29-D-0","raw":"### D. increase the incidence of risks\n\n> 增加风险发生的频率\n\n**做题模式中的状态：**当时选项完整可见，`risks`能让人想到第四段能源市场中的`risk`。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。\n\n**错误类型：第三类——无中生有。**\n\nD抓住了第四段中的`risk`，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。\n\n**命题人借用的原文材料：**\n\n> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.","lines":["### D. increase the incidence of risks","","> 增加风险发生的频率","","**做题模式中的状态：**当时选项完整可见，`risks`能让人想到第四段能源市场中的`risk`。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。","","**错误类型：第三类——无中生有。**","","D抓住了第四段中的`risk`，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。","","**命题人借用的原文材料：**","","> The Bilski case involves a claimed patent on a method for hedging risk in the energy market."]},{"title":"D. increase the incidence of risks","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>增加风险发生的频率</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>risks</code>能让人想到第四段能源市场中的<code>risk</code>。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了第四段中的<code>risk</code>，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利会提高风险发生的频率。</p>\n</blockquote>\n<p>定位时先同时抓住题干范围<code>the last two paragraphs</code>和选项中的<code>risks</code>。<code>risks</code>只能把人带到第四段第一句的<code>a method for hedging risk</code>，还需核对原文是在说风险被管理，还是风险发生率增加。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案，涉及对象是一项用于<code>hedging risk</code>的专利方法；<code>risk</code>只是该方法处理的对象。后文动作是法院审理案件。</p>\n<p>D中的关系是：主体扩大成全部商业方法专利，动作是<code>increase</code>，对象是风险发生率，形成“专利导致更多风险”的因果。</p>\n<p>具体差异在于：D只借用了<code>risk</code>这个名词，却把“处理风险的方法”改成“导致风险增加”，还从单一案件扩大到整类专利，并新增发生频率概念。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false},"focusId":"focus-q29-D-1","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从最后两段可以知道，商业方法专利会提高风险发生的频率。\n\n定位时先同时抓住题干范围`the last two paragraphs`和选项中的`risks`。`risks`只能把人带到第四段第一句的`a method for hedging risk`，还需核对原文是在说风险被管理，还是风险发生率增加。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.\n>\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.\n\n原文中的关系是：主体是Bilski案，涉及对象是一项用于`hedging risk`的专利方法；`risk`只是该方法处理的对象。后文动作是法院审理案件。\n\nD中的关系是：主体扩大成全部商业方法专利，动作是`increase`，对象是风险发生率，形成“专利导致更多风险”的因果。\n\n具体差异在于：D只借用了`risk`这个名词，却把“处理风险的方法”改成“导致风险增加”，还从单一案件扩大到整类专利，并新增发生频率概念。","lines":["#### 定位比对法","","先把D接回题干，整句话就变成：","","> 从最后两段可以知道，商业方法专利会提高风险发生的频率。","","定位时先同时抓住题干范围`the last two paragraphs`和选项中的`risks`。`risks`只能把人带到第四段第一句的`a method for hedging risk`，还需核对原文是在说风险被管理，还是风险发生率增加。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.",">","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.","","原文中的关系是：主体是Bilski案，涉及对象是一项用于`hedging risk`的专利方法；`risk`只是该方法处理的对象。后文动作是法院审理案件。","","D中的关系是：主体扩大成全部商业方法专利，动作是`increase`，对象是风险发生率，形成“专利导致更多风险”的因果。","","具体差异在于：D只借用了`risk`这个名词，却把“处理风险的方法”改成“导致风险增加”，还从单一案件扩大到整类专利，并新增发生频率概念。"]},{"title":"D. increase the incidence of risks","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>增加风险发生的频率</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>risks</code>能让人想到第四段能源市场中的<code>risk</code>。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了第四段中的<code>risk</code>，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利会提高风险发生的频率。</p>\n</blockquote>\n<p>定位时先同时抓住题干范围<code>the last two paragraphs</code>和选项中的<code>risks</code>。<code>risks</code>只能把人带到第四段第一句的<code>a method for hedging risk</code>，还需核对原文是在说风险被管理，还是风险发生率增加。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案，涉及对象是一项用于<code>hedging risk</code>的专利方法；<code>risk</code>只是该方法处理的对象。后文动作是法院审理案件。</p>\n<p>D中的关系是：主体扩大成全部商业方法专利，动作是<code>increase</code>，对象是风险发生率，形成“专利导致更多风险”的因果。</p>\n<p>具体差异在于：D只借用了<code>risk</code>这个名词，却把“处理风险的方法”改成“导致风险增加”，还从单一案件扩大到整类专利，并新增发生频率概念。</p></section><section class=\"revealPart\" id=\"focus-q29-D-2\"><h3>写作视角法</h3><p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>risk是专利方法要对冲的对象，后文随即转入案件审理；没有写商业方法专利使风险发生率上升。</p>\n</blockquote>\n<p>第四段用一句话交代Bilski专利涉及能源风险对冲，随后立刻转入全体法官审理和重审旧裁决；第五段讨论保护范围与显而易见的发明。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The use of business-method patents has increased the incidence of risk in the energy market, producing more frequent and severe losses.</p>\n<p>商业方法专利的使用增加了能源市场中的风险发生率，造成了更频繁、更严重的损失。</p>\n</blockquote>\n<p>假设写法新增“风险变多”的结果；实际原文只说某方法用于<code>hedging risk</code>，没有风险数量、频率或因果数据。D从一个关键词脑补出了完整结论。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false},"focusId":"focus-q29-D-2","raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.\n>\n> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.\n>\n> risk是专利方法要对冲的对象，后文随即转入案件审理；没有写商业方法专利使风险发生率上升。\n\n第四段用一句话交代Bilski专利涉及能源风险对冲，随后立刻转入全体法官审理和重审旧裁决；第五段讨论保护范围与显而易见的发明。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The use of business-method patents has increased the incidence of risk in the energy market, producing more frequent and severe losses.\n>\n> 商业方法专利的使用增加了能源市场中的风险发生率，造成了更频繁、更严重的损失。\n\n假设写法新增“风险变多”的结果；实际原文只说某方法用于`hedging risk`，没有风险数量、频率或因果数据。D从一个关键词脑补出了完整结论。","lines":["#### 写作视角法","","原文第4、5段是这样写的：","","> The Bilski case involves a claimed patent on a method for hedging risk in the energy market.",">","> The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.",">","> risk是专利方法要对冲的对象，后文随即转入案件审理；没有写商业方法专利使风险发生率上升。","","第四段用一句话交代Bilski专利涉及能源风险对冲，随后立刻转入全体法官审理和重审旧裁决；第五段讨论保护范围与显而易见的发明。","","如果D真是作者的意思，文章至少得写成：","","> The use of business-method patents has increased the incidence of risk in the energy market, producing more frequent and severe losses.",">","> 商业方法专利的使用增加了能源市场中的风险发生率，造成了更频繁、更严重的损失。","","假设写法新增“风险变多”的结果；实际原文只说某方法用于`hedging risk`，没有风险数量、频率或因果数据。D从一个关键词脑补出了完整结论。"]},{"title":"D. increase the incidence of risks","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>增加风险发生的频率</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>risks</code>能让人想到第四段能源市场中的<code>risk</code>。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了第四段中的<code>risk</code>，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利会提高风险发生的频率。</p>\n</blockquote>\n<p>定位时先同时抓住题干范围<code>the last two paragraphs</code>和选项中的<code>risks</code>。<code>risks</code>只能把人带到第四段第一句的<code>a method for hedging risk</code>，还需核对原文是在说风险被管理，还 的频率</p>\n</blockquote>\n<p>具体比较：主旨中的主体虽是商业方法专利，但动作是被法院收紧；D的动作是主动增加风险，对象也变成市场风险。动作和对象均不相同。</p>\n<p>局部原文“<code>a method for hedging risk</code>”只说明专利方法与风险对冲有关，无法推出<code>increase the incidence</code>。</p>\n<p><strong>复盘判断：D错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true},"focusId":"focus-q29-D-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨只能确认商业方法专利面临司法威胁，不能单独判断这些专利是否会提高市场风险的发生率。\n\n本项最终仍要根据`a method for hedging risk`这处局部原文判断。\n\n但D实际说的是：\n\n> D. increase the incidence of risks  \n> 增加风险发生的频率\n\n具体比较：主旨中的主体虽是商业方法专利，但动作是被法院收紧；D的动作是主动增加风险，对象也变成市场风险。动作和对象均不相同。\n\n局部原文“`a method for hedging risk`”只说明专利方法与风险对冲有关，无法推出`increase the incidence`。\n\n**复盘判断：D错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入29题题干：","","> 全文主旨只能确认商业方法专利面临司法威胁，不能单独判断这些专利是否会提高市场风险的发生率。","","本项最终仍要根据`a method for hedging risk`这处局部原文判断。","","但D实际说的是：","","> D. increase the incidence of risks  ","> 增加风险发生的频率","","具体比较：主旨中的主体虽是商业方法专利，但动作是被法院收紧；D的动作是主动增加风险，对象也变成市场风险。动作和对象均不相同。","","局部原文“`a method for hedging risk`”只说明专利方法与风险对冲有关，无法推出`increase the incidence`。","","**复盘判断：D错误。**"]},{"title":"29题结论","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p><strong>29. B. are often unnecessarily issued</strong></p>\n</blockquote>\n<ul>\n<li>A把正在发生的法律审查改成“不受挑战”；</li>\n<li>B从“太多明显发明仍获专利”作出最小限度的过度授予推断；</li>\n<li>C把法院决定缩小保护范围改成专利降低持有人声望；</li>\n<li>D借用<code>risk</code>一词，却补出专利会提高风险发生率。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"conclusion","question":"29","questionConclusion":true}},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<h2>段落与全文逻辑框架</h2>\n<p><strong>逻辑层次1：过去十年授予了数千项商业方法专利</strong>（段落1背景介绍） 过去十年授予了数千项商业方法专利 → 【举例：（亚马逊的一键支付）+（美林的资产配置）+（搬箱子技术）】</p>\n<p>↓（转折：当前形势变化）</p>\n<p><strong>逻辑层次2：国家最高专利法院准备缩减商业方法专利</strong>（段落2当前动向） 国家最高专利法院准备缩减商业方法专利 →（这类专利自10年前授权以来一直存在争议）→【联邦巡回法院将通过Bilski案进行广泛审查：（可能消除整个类别的专利）】</p>\n<p>↓（历史背景与现状对比）</p>\n<p><strong>逻辑层次3：限制将是戏剧性转变</strong>（段落3历史与矛盾现状） 限制将是戏剧性转变 →（因为联邦巡回法院1998年州街银行案引入此类专利）→【引发的后果：（互联网公司抢占在线交易专利）+（老牌公司防御性申请）+（IBM获300多项专利但质疑其法律基础）+（华尔街公司申请专利但在法庭反对）】</p>\n<p>→（具体案例说明）</p>\n<p><strong>逻辑层次4：Bilski案详情</strong>（段落4案例细节） Bilski案详情 →（涉及能源市场风险对冲方法专利）→【审理方式特殊：（12名法官全体审理而非3人小组）+（评估是否重新考虑州街银行裁决）】</p>\n<p>↑（更大背景解释）</p>\n<p><strong>逻辑层次5：联邦巡回法院行动的背景</strong>（段落5深层原因） 联邦巡回法院行动的背景 →（最高法院近期缩小专利保护范围）→【举例：（去年4月：太多显而易见的发明获得专利）】→ 结论：（联邦巡回法院在回应最高法院的反专利趋势）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：商业方法专利在经历了十年的快速发展后，现在面临着可能被大幅限制的威胁，这种转变反映了法院系统对专利保护范围的重新思考。</p>","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{"kind":"standard"}},{"title":"小标题题 · 41题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】A. Everyday Business Practices Enter the Patent System</p>\n<blockquote>\n<p>日常商业做法进入专利体系</p>\n</blockquote>\n<p>这一部分整体在交代：过去十年，原本属于日常经营或操作方式的做法大量进入了专利体系。</p>\n<p>开头先给出规模：</p>\n<blockquote>\n<p>thousands of patents have been granted for what are called business methods</p>\n</blockquote>\n<p>随后连续列出三类跨度很大的例子：</p>\n<blockquote>\n<p>one-click online payment system<br/>\nan asset allocation strategy<br/>\na technique for lifting a box</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>先说明商业方法专利数量庞大<br/>\n→ 再用网络支付、金融策略和搬箱子技术说明它覆盖了各种日常做法</p>\n</blockquote>\n<p>A中的<code>Everyday Business Practices</code>对应这些普通经营与操作方式，<code>Enter the Patent System</code>对应它们被授予专利。</p>\n<p>最强干扰项是G。段中确实有企业申请专利，但这一段没有写企业“联合支持”这套制度，只是在列举获授对象。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. A</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{"kind":"standard"}},{"title":"小标题题 · 42题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】B. A Pending Review Puts a Patent Class at Risk</p>\n<blockquote>\n<p>一场即将展开的审查使整类专利面临风险</p>\n</blockquote>\n<p>这一部分整体在写当前新闻：联邦巡回法院准备借一个待审案件全面审查商业方法专利，影响可能覆盖整个类别。</p>\n<p>开头用<code>Now</code>完成时间转折：</p>\n<blockquote>\n<p>appears poised to scale back on business-method patents</p>\n</blockquote>\n<p>随后说明法院要做什么：</p>\n<blockquote>\n<p>use a case pending before it to conduct a broad review</p>\n</blockquote>\n<p>结尾把影响范围推到最高：</p>\n<blockquote>\n<p>has the potential to eliminate an entire class of patents</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>法院准备收缩<br/>\n→ 用待审案件开展广泛审查<br/>\n→ 整类专利都可能受影响</p>\n</blockquote>\n<p>B中的<code>Pending Review</code>对应待审案件和广泛审查，<code>a Patent Class at Risk</code>对应可能消除整类专利。</p>\n<p>最强干扰项是D。这里确实出现了案件，但“全体法官审理”和“重开旧规则”要到下一处案件细节中才展开。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. B</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{"kind":"standard"}},{"title":"小标题题 · 43题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】C. One Ruling Triggers a Defensive Patent Rush</p>\n<blockquote>\n<p>一项裁决引发防御性专利申请潮</p>\n</blockquote>\n<p>这一部分整体在解释：1998年的州街银行案怎样开启商业方法专利，并把企业推入一轮申请和防御性囤积。</p>\n<p>开头先回到制度起点：</p>\n<blockquote>\n<p>the Federal Circuit itself ... ushered in such patents with its 1998 decision</p>\n</blockquote>\n<p>中间写直接后果：</p>\n<blockquote>\n<p>produced an explosion in business-method patent filings</p>\n</blockquote>\n<p>后半继续把申请潮扩展到老牌公司：</p>\n<blockquote>\n<p>raced to add such patents to their portfolios<br/>\nas a defensive move against rivals</p>\n</blockquote>\n<p>段尾的IBM和华尔街公司又显示一种矛盾：即使质疑或反对这种做法，也会先用专利保护自己。</p>\n<p>段内推进链是：</p>\n<blockquote>\n<p>旧裁决引入专利<br/>\n→ 新兴企业抢占权利<br/>\n→ 老牌企业防御性跟进<br/>\n→ 反对者也不得不参与</p>\n</blockquote>\n<p>C中的<code>One Ruling</code>对应1998年裁决，<code>Defensive Patent Rush</code>覆盖申请爆发和防御性积累。</p>\n<p>最强干扰项是G。企业确实大量持有专利，但IBM和华尔街公司的例子正说明它们并未一致认同其法律基础。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. C</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{"kind":"standard"}},{"title":"小标题题 · 44题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】D. An Exceptional Hearing Reopens an Old Rule</p>\n<blockquote>\n<p>一次特殊审理重新打开旧规则</p>\n</blockquote>\n<p>这一部分整体在写Bilski案的具体程序，以及法院准备借此重新审视旧裁决。</p>\n<p>开头只用一句交代案件对象：</p>\n<blockquote>\n<p>a method for hedging risk in the energy market</p>\n</blockquote>\n<p>真正的段落重心落在异常审理安排：</p>\n<blockquote>\n<p>heard by all 12 of the court's judges<br/>\nrather than a typical panel of three</p>\n</blockquote>\n<p>结尾指出要评估的核心问题：</p>\n<blockquote>\n<p>whether it should \"reconsider\" its State Street Bank ruling</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>交代案件对象<br/>\n→ 强调全体法官审理的特殊性<br/>\n→ 把审理指向旧裁决是否重开</p>\n</blockquote>\n<p>D中的<code>Exceptional Hearing</code>对应12名法官全体审理，<code>Reopens an Old Rule</code>对应重新考虑州街银行案裁决。</p>\n<p>最强干扰项是F。能源市场只说明涉案方法的应用场景，段落并没有讨论新的能源规则怎样重塑金融市场。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. D</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{"kind":"standard"}},{"title":"小标题题 · 45题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】E. A Broader Judicial Retreat from Patent Protection</p>\n<blockquote>\n<p>司法系统整体收紧专利保护</p>\n</blockquote>\n<p>这一部分整体在把联邦巡回法院的行动放进更大的司法背景中：最高法院近期已经连续收窄专利保护。</p>\n<p>开头直接建立背景关系：</p>\n<blockquote>\n<p>comes in the wake of a series of recent decisions by the Supreme Court</p>\n</blockquote>\n<p>随后说明这些决定的共同方向：</p>\n<blockquote>\n<p>narrowed the scope of protections for patent holders</p>\n</blockquote>\n<p>例子进一步写出收紧的理由：</p>\n<blockquote>\n<p>too many patents were being upheld for \"inventions\" that are obvious</p>\n</blockquote>\n<p>结尾把联邦巡回法院的动作概括为：</p>\n<blockquote>\n<p>reacting to the anti-patent trend at the Supreme Court</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>最高法院连续裁决<br/>\n→ 专利保护范围收窄<br/>\n→ 对明显发明获专利提出质疑<br/>\n→ 联邦巡回法院作出回应</p>\n</blockquote>\n<p>E中的<code>Broader Judicial Retreat</code>对应跨法院、跨裁决的收紧背景，<code>from Patent Protection</code>对应保护范围缩小。</p>\n<p>最强干扰项是B。B概括的是前面那项具体待审案件造成的风险，而本段的功能是提供更大的司法趋势背景。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. E</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{"kind":"standard"}},{"title":"排序题 · 解析","level":1,"section":"第四鸟 · 新题型","html":"<p>这是一道8段排序题，其中A、E、H三个段落的位置已经给出。先把八段分别在做什么看清：</p>\n<ul>\n<li>D：从过去十年的规模与例子写起，建立整类商业方法专利的背景；</li>\n<li>A：用<code>Now</code>转到当前，提出联邦巡回法院准备缩减并广泛审查；</li>\n<li>G：点明待审案件就是Bilski，并说明它可能影响整类专利；</li>\n<li>C：解释为什么限制会是一次大转向，回到1998年州街银行案；</li>\n<li>E：写旧裁决如何引发申请爆发和老牌公司的防御性跟进；</li>\n<li>B：用IBM和华尔街公司的矛盾行为把防御性申请具体化；</li>\n<li>F：回到Bilski案，说明全体法官审理与重审旧裁决；</li>\n<li>H：补最高法院近期收紧专利保护的更大背景。</li>\n</ul>\n<p>全文的组织顺序是：</p>\n<blockquote>\n<p>过去十年的扩张与例子<br/>\n→ 当前法院准备收缩<br/>\n→ 点明核心案件及其影响<br/>\n→ 回看旧制度起点<br/>\n→ 说明申请潮与防御性积累<br/>\n→ 用企业矛盾行为落地<br/>\n→ 回到案件审理细节<br/>\n→ 补充最高法院的整体背景</p>\n</blockquote>\n<p>因此，完整顺序为：</p>\n<blockquote>\n<p><strong>D → A → G → C → E → B → F → H</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{"kind":"standard"}},{"title":"排序题 · 41题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】D</p>\n<p>41题位于已知A段之前，也就是全文第一段。</p>\n<p>A段一开头就是：</p>\n<blockquote>\n<p>Now the nation's top patent court appears poised to scale back on business-method patents</p>\n</blockquote>\n<p><code>Now</code>说明前文应该先有一段过去或既有状态，随后才转到当前变化；A中的<code>business-method patents</code>也需要先被介绍。</p>\n<p>D段正好先完成两件事：</p>\n<blockquote>\n<p>Over the past decade, thousands of patents have been granted<br/>\nAmazon、Merrill Lynch和搬箱子技术的三个例子</p>\n</blockquote>\n<p>局部推进链是：</p>\n<blockquote>\n<p>D：先说明过去十年的扩张，并解释这类专利覆盖什么<br/>\n↓<br/>\nA：用<code>Now</code>转入法院准备收缩</p>\n</blockquote>\n<p>最强候选G不能放在这里，因为它用<code>In re Bilski, as the case is known</code>承接前文已经出现的“一个待审案件”，而全文开头还没有引出该案。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. D</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{"kind":"standard"}},{"title":"排序题 · 42题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】G</p>\n<p>42题位于已知A段之后，下一空还要继续承接当前审查。</p>\n<p>A段尾部先写：</p>\n<blockquote>\n<p>use a case pending before it to conduct a broad review</p>\n</blockquote>\n<p>G段开头马上把这个尚未点名的案件具体化：</p>\n<blockquote>\n<p>In re Bilski, as the case is known</p>\n</blockquote>\n<p>G段随后把案件影响推到：</p>\n<blockquote>\n<p>eliminate an entire class of patents</p>\n</blockquote>\n<p>下一段C以<code>Curbs on business-method claims</code>起笔，正好接住这种整类专利可能被限制的后果，并解释为何这是一次转向。</p>\n<p>局部推进链是：</p>\n<blockquote>\n<p>A：提出将利用一个待审案件<br/>\n→ G：给案件命名并说明潜在影响<br/>\n→ C：解释这种限制为何构成历史性反转</p>\n</blockquote>\n<p>最强候选F也写Bilski案，但它直接进入专利方法、12名法官和重审问题；在案件第一次出现时，先说明“这是什么案、为何重大”更自然。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. G</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{"kind":"standard"}},{"title":"排序题 · 43题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】C</p>\n<p>43题位于G段之后、已知E段之前。</p>\n<p>G段尾部写的是：</p>\n<blockquote>\n<p>eliminate an entire class of patents</p>\n</blockquote>\n<p>C段用<code>Curbs on business-method claims</code>把这个潜在后果接过来，然后提出<code>about-face</code>，再回到1998年州街银行案。</p>\n<p>更关键的是，已知E段开头是：</p>\n<blockquote>\n<p>That ruling produced an explosion in business-method patent filings</p>\n</blockquote>\n<p>这里的<code>That ruling</code>必须回指前文已经出现的具体裁决。C段正好在末尾给出：</p>\n<blockquote>\n<p>its 1998 decision in the ... State Street Bank case</p>\n</blockquote>\n<p>局部推进链是：</p>\n<blockquote>\n<p>G：整类专利可能被消除<br/>\n→ C：这种限制会逆转法院过去建立的规则<br/>\n→ E：那项旧裁决随后引发申请潮</p>\n</blockquote>\n<p>最强候选F虽然也含有<code>State Street Bank ruling</code>，但F讨论的是当前案件审理，接到E的“那项裁决产生申请爆发”会把时间从当前突然跳回过去，顺序不如C自然。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. C</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{"kind":"standard"}},{"title":"排序题 · 44题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】B</p>\n<p>44题位于已知E段之后，后面还要回到当前的Bilski案。</p>\n<p>E段先写一般变化：</p>\n<blockquote>\n<p>more established companies raced to add such patents to their portfolios<br/>\nas a defensive move against rivals</p>\n</blockquote>\n<p>B段马上用两个具体例子把这种防御性行为落地：</p>\n<blockquote>\n<p>IBM ... more than 300 business-method patents<br/>\nWall Street investment firms armed themselves with patents</p>\n</blockquote>\n<p>两例还共同补出同一种矛盾：企业一边质疑或反对这种做法，一边又为防止竞争对手抢先而持有专利。</p>\n<p>局部推进链是：</p>\n<blockquote>\n<p>E：老牌公司普遍防御性跟进<br/>\n→ B：IBM和华尔街公司具体展示这种矛盾行为<br/>\n→ F：历史扩张说明完毕，回到当前核心案件</p>\n</blockquote>\n<p>最强候选F可以在主题上接回Bilski，但若立刻放在E后，E段提出的企业防御性申请还缺少原文随后给出的实例，B会失去最自然的位置。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. B</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{"kind":"standard"}},{"title":"排序题 · 45题","level":1,"section":"第四鸟 · 新题型","html":"<p>【答案】F</p>\n<p>45题位于B段之后、已知H段之前。</p>\n<p>B段结束了企业在旧制度下如何行动的历史回顾。接下来需要回到文章当前的核心案件，F段正好开头就是：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent</p>\n</blockquote>\n<p>F随后说明联邦巡回法院发布了一项特殊命令：</p>\n<blockquote>\n<p>heard by all 12 of the court's judges<br/>\nwhether it should \"reconsider\" its State Street Bank ruling</p>\n</blockquote>\n<p>已知H段一开头则是：</p>\n<blockquote>\n<p>The Federal Circuit's action comes in the wake of ...</p>\n</blockquote>\n<p>这里的<code>action</code>需要回指前文刚写完的全体法官审理和重审安排；F正好提供这个指代对象。</p>\n<p>局部推进链是：</p>\n<blockquote>\n<p>B：旧制度下的企业行为<br/>\n→ F：回到Bilski案及法院的具体行动<br/>\n→ H：解释这一行动背后的最高法院趋势</p>\n</blockquote>\n<p>最强候选C也能引出州街银行案，但它属于前面的历史起点；放在这里会让<code>That ruling</code>、申请潮和企业例子的时间链被打断。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. F</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{"kind":"standard"}},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","level":1,"section":"第五鸟 · 写作积累","html":"<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>technological innovation</strong></td>\n<td><strong>科技创新</strong></td>\n<td><strong>创新｜科技发展</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td><strong>sound intellectual property protection</strong></td>\n<td><strong>健全的知识产权保护</strong></td>\n<td><strong>法治｜制度建设</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>high-quality patent examination</td>\n<td>高质量专利审查</td>\n<td>法治｜规范治理</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>clear and reasonable patent standards</td>\n<td>清晰合理的专利标准</td>\n<td>法治｜制度建设</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>balancing innovation with the public interest</strong></td>\n<td><strong>平衡创新与公共利益</strong></td>\n<td><strong>和谐｜发展平衡</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>fair market competition</td>\n<td>公平市场竞争</td>\n<td>公正｜市场秩序</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>responsible innovation</td>\n<td>负责任的创新</td>\n<td>敬业｜责任意识</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>corporate integrity</td>\n<td>企业诚信</td>\n<td>诚信｜商业伦理</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>independent judicial review</strong></td>\n<td><strong>独立的司法审查</strong></td>\n<td><strong>法治｜司法公正</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>evidence-based policymaking</td>\n<td>基于证据的政策制定</td>\n<td>法治｜科学治理</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>institutional adaptability</td>\n<td>制度适应力</td>\n<td>创新｜与时俱进</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>preventing unnecessary monopolies</td>\n<td>防止不必要的垄断</td>\n<td>公正｜市场秩序</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>protection of legitimate inventions</strong></td>\n<td><strong>对正当发明的保护</strong></td>\n<td><strong>法治｜权利保障</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>rational use of legal rights</td>\n<td>理性使用法律权利</td>\n<td>诚信｜规则意识</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>long-term thinking in business decisions</td>\n<td>商业决策中的长远眼光</td>\n<td>人生哲理｜远见</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>a sense of social responsibility</td>\n<td>社会责任感</td>\n<td>敬业｜责任感</td>\n<td>个人主题</td>\n</tr>\n</tbody>\n</table></div>","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true}},{"title":"2. 大作文第一段描述题目信息时可积累的表达","level":1,"section":"第五鸟 · 写作积累","html":"<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>图画题</strong></td>\n<td><strong>The scene presents a dramatic about-face from A to B.</strong></td>\n<td><strong>画面呈现了从A到B的剧烈转向。</strong></td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>In the picture, A appears ready to scale back on B.</td>\n<td>画面中，A看起来准备缩减B。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>A, once widely encouraged, is now being reconsidered.</td>\n<td>A过去曾被广泛鼓励，如今正被重新审视。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>The contrast between A and B reflects a change in attitude toward C.</td>\n<td>A与B的对比反映了人们对C的态度变化。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>The image suggests that excessive reliance on A may eventually trigger B.</td>\n<td>画面表明，对A的过度依赖最终可能引发B。</td>\n</tr>\n<tr>\n<td><strong>图表题</strong></td>\n<td><strong>Over the past X years, the number of A has risen sharply.</strong></td>\n<td><strong>在过去X年里，A的数量大幅上升。</strong></td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The chart shows an explosion in A during the period.</td>\n<td>图表显示，这一时期A出现爆发式增长。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>A increased from X to Y, while B remained comparatively stable.</td>\n<td>A从X增至Y，而B相对稳定。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The figure indicates that A accounts for a growing share of B.</td>\n<td>数据表明，A在B中所占比重不断上升。</td>\n</tr>\n<tr>\n<td><strong>图表题</strong></td>\n<td><strong>After a decade of rapid growth, A now faces possible restriction.</strong></td>\n<td><strong>经历十年的快速增长后，A如今面临可能的限制。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The article reviews how A was introduced and then rapidly expanded.</td>\n<td>文章回顾了A如何被引入并迅速扩张。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The author uses B as a concrete example of the wider debate over A.</td>\n<td>作者用B作为围绕A的更大争论的具体例子。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>The text contrasts the former expansion of A with the current attempt to scale it back.</strong></td>\n<td><strong>文章把A过去的扩张与当前缩减A的尝试进行对比。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The article points out that a single decision may change an entire class of practices.</td>\n<td>文章指出，一项裁决可能改变整整一类做法。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The author attributes the policy shift partly to a broader trend toward B.</td>\n<td>作者把这项政策转向部分归因于更广泛的B趋势。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The text shows that organizations may adopt A merely as a defensive move against rivals.</td>\n<td>文章表明，组织可能仅把A作为防范竞争对手的手段。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The article highlights the tension between protecting A and preventing B.</td>\n<td>文章突出了保护A与防止B之间的张力。</td>\n</tr>\n</tbody>\n</table></div>","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true}}];
