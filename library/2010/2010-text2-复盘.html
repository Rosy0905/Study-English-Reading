<li>B是原文中的真实例子，但没有回答近期关注的原因；</li>\n<li>C把法院收缩、审查和可能影响整类专利概括成授予可能受限；</li>\n<li>D写的是持续十年的争议背景，却答错了<code>recently</code>指定的时间层面。</li>\n</ul>\n<h2>27题</h2>\n<blockquote>\n<p>Which of the following is true of the Bilski case?<br />\n关于Bilski案，下面哪项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道具体细节题，题干点名Bilski案，要求从文中四项陈述中选出真实的一项。需要把第二段写出的潜在影响与第四段写出的审理安排结合起来，同时保留案件尚未裁决的时间状态。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot; It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>题干点名Bilski案，需要把第二段的潜在影响和第四段的审理安排接起来。文章写的是案件将由全体12名法官审理，法院还要考虑是否重新审视旧裁决；这些都是尚在推进中的动作。</p>\n<h3>A. Its ruling complies with the court decisions.</h3>\n<blockquote>\n<p>该案的裁决与这些法院裁决一致</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文只说案件将由12名法官审理，并要评估是否重新考虑旧裁决，没有写Bilski案已经形成裁决，更没有比较它与其他裁决是否一致，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了原文中的<code>ruling</code>和法院决定这一法律场景，所以表面词汇很接近。原文中的<code>ruling</code>指州街银行案的旧裁决，Bilski案仍将被审理；A却先补出Bilski案已经有裁决，再补出它与其他裁决一致。原文没有表达这套完整命题。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the case would be heard by all 12 of the court's judges</p>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案已经形成裁决，而且该裁决与这些法院裁决相一致。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>Its ruling</code>和<code>complies with the court decisions</code>。<code>ruling</code>在第四段确实出现，但它属于<code>State Street Bank ruling</code>；同一段对Bilski案使用的是<code>would be heard</code>和<code>wants to evaluate</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案和联邦巡回法院；案件状态是“将由12名法官审理”，法院当前动作是评估是否重新考虑另一案件的旧裁决；对象是State Street Bank ruling。</p>\n<p>A中的关系是：<code>Its</code>把<code>ruling</code>归给Bilski案，默认该案已经裁决；<code>complies with</code>又新增它与其他法院决定一致的关系。</p>\n<p>具体差异在于：原文中的旧裁决和待审案件被A合并成同一个对象。A同时改掉时间状态（待审→已裁决）、指代对象（旧案裁决→Bilski裁决）并增加“一致”关系。</p>\n<h4>写作视角法</h4>\n<p>原文第4段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>文章写的是Bilski案将被审理、法院还要评估是否重新考虑旧裁决；没有写本案已经形成裁决。</p>\n</blockquote>\n<p>文章只交代全体法官将审理Bilski案，并列出法院准备评估的问题，没有公布本案结果。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Federal Circuit has now issued its ruling in Bilski. That ruling complies with the court's recent decisions and leaves the existing legal approach intact.</p>\n<p>联邦巡回法院现已对Bilski案作出裁决。该裁决与法院近期决定一致，并维持了现有法律做法。</p>\n</blockquote>\n<p>假设写法需要“已经裁决”和“保持一致”两层信息；原文实际停留在“将审理”和“是否重新考虑”阶段，甚至暗示旧做法可能改变，A所需的两层均不存在。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>全文主旨只能确认Bilski案是这场迫近威胁的载体，不能单独判断本案是否已经形成裁决、该裁决又是否与其他决定一致。</p>\n</blockquote>\n<p>本项最终仍要根据<code>the case would be heard</code>和<code>whether it should reconsider</code>这两处局部原文判断。</p>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. Its ruling complies with the court decisions.<br />\n该案的裁决与这些法院裁决一致</p>\n</blockquote>\n<p>具体比较：主旨的方向是现行商业方法专利规则可能受到冲击；A却让本案裁决与既有决定保持一致，方向上倾向维持现状。更关键的是，主旨不能单独判定程序是否完成，A仍须接受局部事实检验。</p>\n<p>局部原文“<code>the case would be heard</code>”明确表明案件仍待审；“<code>reconsider</code> its State Street Bank ruling”还说明被谈论的裁决属于旧案。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. It involves a very big business transaction.</h3>\n<blockquote>\n<p>该案涉及一笔非常大的商业交易</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>very big</code>与原文<code>a very big deal</code>表面重合。但原文是在评价案件影响重大，第四段写的是能源市场中的风险对冲方法，并没有一笔规模很大的商业交易，因此B被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B抓住了原文中的<code>a very big deal</code>，所以看起来像近距离改写。原文写的是一位学者把Bilski案称为“影响重大的事”，B却把<code>deal</code>改成了字面上的“商业交易”。真正变化的是短语在语境中的含义和它所评价的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal.&quot;</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案涉及一笔非常大的商业交易。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>very big business transaction</code>以及原文中的<code>a very big deal</code>。表面重合的<code>very big</code>和<code>deal</code>会把人带回第二段，但还要把短语放回完整语境，并与第四段对案件内容的说明核对。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote>\n<p>原文中的关系是：第一句的主体是整个Bilski案，<code>is a very big deal</code>是专家对案件重要性和潜在影响的评价；第二句说明案件涉及一项能源市场风险对冲方法的专利。</p>\n<p>B中的关系是：选项把<code>deal</code>按“交易”理解，并用<code>business transaction</code>把评价短语改成案件事实，还用<code>very big</code>修饰交易规模。</p>\n<p>具体差异在于：原文的<code>deal</code>属于固定表达“重要的事”，评价对象是案件影响；B把它歪曲为商业交易，改了词义、谓语关系和对象。能源市场背景并不能补出一笔大额交易。</p>\n<h4>写作视角法</h4>\n<p>原文第2、4段是这样写的：</p>\n<blockquote>\n<p>In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch of the University of Missouri School of Law.</p>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>a very big deal评价的是案件影响，案件实际涉及一种能源市场风险对冲的专利方法；文章没有写巨额商业交易。</p>\n</blockquote>\n<p>作者先由专家强调案件分量，之后解释它涉及哪一种专利方法和为何由全体法官审理。全文没有交易金额、交易双方或交易规模。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Bilski dispute arose from a very large business transaction in the energy market, involving substantial assets and identifiable trading parties.</p>\n<p>Bilski争议源于能源市场中的一笔巨额商业交易，涉及大量资产和明确的交易方。</p>\n</blockquote>\n<p>假设写法必须出现“交易事实”；实际文章出现的是“专利方法”和“案件影响”。B只是利用<code>deal</code>的一词多义，把评价误读成事实。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>全文主旨只能确认Bilski案具有重要制度影响，不能单独判断它是否涉及一笔规模很大的商业交易。</p>\n</blockquote>\n<p>本项最终仍要根据<code>a very big deal</code>所在的完整句子以及<code>involves a claimed patent</code>这处局部原文判断。</p>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>B. It involves a very big business transaction.<br />\n该案涉及一笔非常大的商业交易</p>\n</blockquote>\n<p>具体比较：主旨的主体虽也是Bilski案，但动作对象是商业方法专利制度；B把对象换成一笔交易。主旨能够提示B偏离中心，但“是否有大交易”仍是局部事实。</p>\n<p>局部原文只说“<code>a claimed patent on a method for hedging risk</code>”，并没有任何<code>business transaction</code>。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. It has been dismissed by the Federal Circuit.</h3>\n<blockquote>\n<p>该案已被联邦巡回法院驳回</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。原文说联邦巡回法院发布命令，让全部12名法官审理该案，并准备评估一个重要问题；“将被审理”和“已经驳回”方向相反，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了联邦巡回法院与Bilski案之间的直接关系，所以主体有明确来源。原文写的是法院安排全体法官审理，C却写成法院已经驳回案件。真正变化的是法院动作和案件状态。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案已经被联邦巡回法院驳回。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>dismissed by the Federal Circuit</code>和原文中同一法院对案件作出的具体动作。<code>Federal Circuit</code>定位到第四段；判断关键不是法院名称是否相同，而是比较<code>dismissed</code>与<code>would be heard by all 12 ... judges</code>的动作方向和时间状态。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是联邦巡回法院，动作是发布一项特殊命令，命令内容是案件将由全部12名法官审理并评估重要问题；对象是Bilski案及旧裁决，时间仍在未来审理阶段。</p>\n<p>C中的关系是：主体仍是联邦巡回法院，但动作被改成<code>dismissed</code>，对象是Bilski案，完成时态<code>has been</code>表示案件已经终结。</p>\n<p>具体差异在于：主体和案件名称未变，核心动作却从“安排全院审理”反转成“已经驳回”，案件状态也从待审变成终结。</p>\n<h4>写作视角法</h4>\n<p>原文第4段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>案件将由全部12名法官审理，法院还要评估旧裁决，说明案件正在被认真推进，而不是已经遭到驳回。</p>\n</blockquote>\n<p>作者强调审理阵容异常扩大，并继续交代法院要评估是否重新考虑旧裁决，这说明案件正被认真推进。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The Federal Circuit dismissed the Bilski case and declined to review the patent issue further. No full-court hearing will take place.</p>\n<p>联邦巡回法院驳回了Bilski案，并拒绝继续审查该专利问题。案件不会由全院法官审理。</p>\n</blockquote>\n<p>假设写法中的“终止”和“不审理”与实际的“全部12名法官审理”正面相反。C不是遗漏细节，而是把法院的核心动作倒写。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>全文主旨只能确认Bilski案正在推动对商业方法专利的审查，不能单独判断法院是否已经把案件驳回。</p>\n</blockquote>\n<p>本项最终仍要根据<code>the case would be heard by all 12 of the court's judges</code>这处局部原文判断。</p>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>C. It has been dismissed by the Federal Circuit.<br />\n该案已被联邦巡回法院驳回</p>\n</blockquote>\n<p>具体比较：主旨中的动作是案件可能促成制度变化，方向是继续推进；C的动作是案件已经被终止，方向相反。主体相同，但动作、时间和结果完全冲突。</p>\n<p>“<code>the case would be heard by all 12 of the court's judges</code>”直接否定<code>has been dismissed</code>。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. It may change the legal practices in the U.S.</h3>\n<blockquote>\n<p>该案可能改变美国的法律实践</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>It may change the [xxx] practices in the U.S.</code>。虽然核心修饰词被遮挡，但<code>may change ... practices</code>能够与案件可能消除整类专利、法院准备重新考虑旧裁决接起来，因此D被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的跨段概括。</strong></p>\n<p>D抓住了原文中的潜在制度影响。原文先写Bilski案可能消除整类专利，接着又补了法院要评估是否重新考虑奠定旧做法的州街银行案裁决；D把两处合成了“可能改变美国的法律实践”。<code>may</code>也保留了案件尚未裁决的不确定性。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Bilski案可能改变美国的法律实践。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>may change the legal practices in the U.S.</code>以及原文的<code>potential</code>、<code>eliminate an entire class</code>和<code>reconsider</code>。这不是单句照抄，需要把第二段的潜在影响和第四段对旧裁决的重新审视跨段合并。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案及审理它的联邦巡回法院；动作是可能消除整类专利并重新考虑奠定旧做法的State Street Bank裁决；对象是商业方法专利规则；<code>potential</code>和<code>whether</code>都保留不确定性。</p>\n<p>D中的关系是：主体仍是Bilski案，动作被概括为<code>may change</code>，对象被概括为美国相关法律实践，范围从单一案件提升到制度层面。</p>\n<p>具体差异在于：D没有改变原文关系，而是把“取消整类专利＋重审旧裁决”的共同制度后果概括成“可能改变法律实践”。<code>may</code>准确保留尚未判决的状态。</p>\n<h4>写作视角法</h4>\n<p>原文第2、4段是这样写的：</p>\n<blockquote>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>案件可能影响整类专利，法院还准备借它重新考虑建立旧制度的裁决；潜在影响已经触及相关法律规则与实践。</p>\n</blockquote>\n<p>文章先说该案可能消除整类专利，之后具体说明全体法官将评估是否重新考虑1998年旧裁决，影响由专利类别进一步推进到规则基础。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The court will use Bilski to reconsider the rule that established business-method patents, and the outcome may alter how such patents are treated across the United States.</p>\n<p>法院将借Bilski案重新考虑建立商业方法专利的旧规则，裁判结果可能改变美国处理这类专利的方式。</p>\n</blockquote>\n<p>最小假设中的“重审旧规则”和“改变处理方式”正是原文两段已有的推进。D所需的主体、制度对象、变化方向及未决语气均能找到。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>全文主旨只能确认Bilski案可能威胁整类商业方法专利，不能单独判断这种影响是否会具体改变美国的法律实践。</p>\n</blockquote>\n<p>本项最终仍要根据<code>potential to eliminate an entire class</code>和<code>reconsider its State Street Bank ruling</code>这两处局部原文判断。</p>\n<p>D实际说的是：</p>\n<blockquote>\n<p>D. It may change the legal practices in the U.S.<br />\n该案可能改变美国的法律实践</p>\n</blockquote>\n<p>具体比较：主旨与D的主体都围绕Bilski案推动的制度变化，动作方向都是改变或收紧，作用对象都是整类商业方法专利；<code>looming</code>与<code>may</code>也都表示尚未最终落地。</p>\n<p>局部的“<code>reconsider</code> its State Street Bank ruling”和“<code>eliminate an entire class of patents</code>”分别坐实规则基础与影响范围。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>27题结论</h3>\n<blockquote>\n<p><strong>27. D. It may change the legal practices in the U.S.</strong></p>\n</blockquote>\n<ul>\n<li>A把旧案裁决和待审程序拼成了Bilski案已经有一致裁决；</li>\n<li>B把“案件影响重大”改成了“一笔很大的商业交易”；</li>\n<li>C把全体法官继续审理改成案件已经被驳回；</li>\n<li>D跨段概括了案件可能取消整类专利并重审旧规则的制度影响。</li>\n</ul>\n<h2>28题</h2>\n<blockquote>\n<p>The word “about-face” (Line 1, Para. 3) most probably means ______.<br />\n第3段第1行的“about-face”最可能是什么意思？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道猜词题。题干已经把位置限定在第三段首句，<code>because</code>后面的内容直接解释了<code>about-face</code>：同一个法院过去引入这类专利，现在却可能限制它们。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.</p>\n</blockquote>\n<p>猜词位置后面紧跟<code>because</code>，作者已经解释了这个词：同一个联邦巡回法院过去亲自引入这类专利，现在却准备限制它们。要找的是这种前后方向反转，而不是单独猜<code>about</code>或<code>face</code>。</p>\n<h3>A. loss of goodwill</h3>\n<blockquote>\n<p>善意或信誉的丧失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文只比较法院“过去引入”和“现在限制”两种相反动作，没有写谁失去善意或信誉，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了<code>dramatic</code>带来的强烈变化感，所以可能让人觉得是某种负面损失。原文写的是同一法院前后做法反向，A却写成善意或信誉减少。原文没有建立任何信誉评价。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示善意或信誉的丧失。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的<code>about-face</code>及选项中的<code>loss of goodwill</code>。题干已经把位置锁定在第三段第一句；<code>because</code>后面的内容就是作者给出的语境解释，必须优先于对<code>dramatic</code>的情绪联想。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case.</p>\n</blockquote>\n<p>原文中的关系是：主体是同一个Federal Circuit；过去动作是<code>introduced such patents</code>，现在设想的动作是<code>Curbs</code>；<code>because</code>把前后相反动作直接连成解释关系。</p>\n<p>A中的关系是：A把该词解释成<code>goodwill</code>这一声誉或善意对象的<code>loss</code>，需要原文出现某个主体的信誉下降。</p>\n<p>具体差异在于：原文表达的是行动方向反转，A却改成评价对象的减少。文章没有<code>goodwill</code>、信任、声誉或公众评价这条线。</p>\n<h4>写作视角法</h4>\n<p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>同一法院过去引入、现在可能限制同一类专利，构成前后动作反转；句中没有善意或信誉的得失。</p>\n</blockquote>\n<p>作者写完<code>about-face</code>后立刻回顾“正是这个法院自己在1998年引入此类专利”，用同一主体的前后动作解释词义。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The court's retreat has cost it the goodwill of patent holders and damaged public trust in the institution.</p>\n<p>法院的退让使其失去了专利持有人的好感，并损害了公众对该机构的信任。</p>\n</blockquote>\n<p>假设写法需要声誉主体、失去对象和评价结果；实际句子只有“引入→限制”的动作对照。A所需的语义关系完全缺席。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断<code>about-face</code>在第三段第一句中的具体词义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs ... because ... introduced such patents</code>这组前后动作判断。</p>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. loss of goodwill<br />\n善意或信誉的丧失</p>\n</blockquote>\n<p>具体比较：主旨中的“威胁”与A都带负面色彩，但颜色相同不等于含义相同。主旨不能判断<code>about-face</code>是否涉及声誉；A的主体、对象和动作均无法从主旨推出。</p>\n<p>最终仍要根据局部结构“<code>Curbs ... because ... introduced</code>”判断：这里是前后做法相反，不是失去<code>goodwill</code>。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. increase of hostility</h3>\n<blockquote>\n<p>敌意的增加</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>increase of [xxx]</code>。即使核心名词被遮挡，<code>increase of</code>表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把<code>about-face</code>解释为情绪增加。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>business-method patents, which have been controversial</p>\n<p>Curbs on business-method claims would be a dramatic about-face</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示敌意的增加。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项可见结构<code>increase of hostility</code>。<code>hostility</code>可能让人联想到<code>controversial</code>或结尾的<code>anti-patent trend</code>，但题干指定的是第三段第一句，词义必须由该句的<code>Curbs ... because ... introduced</code>解释。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：同一法院过去引入这类专利，现在若限制它们就形成前后动作反向；句子比较的是立场或做法。</p>\n<p>B中的关系是：B把含义改成某种情绪<code>hostility</code>在程度上增加，要求原文呈现“敌意少→敌意多”的量变。</p>\n<p>具体差异在于：“方向反转”和“程度增加”不是同一种关系。即便文章后来提到反专利趋势，也没有把<code>about-face</code>定义为敌意的上升。</p>\n<h4>写作视角法</h4>\n<p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>前后关系是从引入转向限制的方向反转，不是敌意程度逐渐增加。</p>\n</blockquote>\n<p>第三段先用<code>Curbs</code>提出现在的限制方向，再用<code>introduced</code>回看过去的支持方向，作者在两个动作之间建立对照。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Hostility toward business-method patents has steadily increased, and the court has become progressively more antagonistic to patent holders.</p>\n<p>对商业方法专利的敌意不断上升，法院对专利持有人也变得越来越敌对。</p>\n</blockquote>\n<p>假设写法的核心是“越来越敌对”；实际写法的核心是“过去做A、现在转做非A”。B把关系类型从反转换成递增。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断<code>about-face</code>在第三段第一句中的具体词义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs</code>与<code>introduced</code>构成的动作对照判断。</p>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>B. increase of hostility<br />\n敌意的增加</p>\n</blockquote>\n<p>具体比较：B与主旨在负面方向上表面相容，但主旨没有提供“increase”的程度轴，也没有把法院态度写成<code>hostility</code>。范围和语义关系不足以支持B。</p>\n<p>局部<code>because</code>从句明确给出前后动作对照，因此最终应按“转向”而不是“敌意增加”理解。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. change of attitude</h3>\n<blockquote>\n<p>态度或立场的改变</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。<code>because</code>后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>C抓住了原文中同一主体的前后反向动作。原文写法院过去<code>introduced</code>这类专利，现在若<code>Curbs</code>它们就构成<code>about-face</code>；C把这种行动方向的反转概括成“态度或立场的改变”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示态度或立场的改变。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>以及解释句中的<code>Curbs</code>和<code>introduced</code>。同一主体Federal Circuit先后对应两个方向相反的动作，<code>because</code>把这一对照直接作为词义线索。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit；过去立场通过<code>introduced such patents</code>体现，现在的新立场通过<code>Curbs</code>体现；两者对象相同而动作方向相反。</p>\n<p>C中的关系是：C把同一主体前后行动方向的反转概括成<code>change of attitude</code>，没有增加新的主体、对象或程度。</p>\n<p>具体差异在于：原文写行为层面的转向，C用态度层面的概括表达同一关系。这里属于语境同义改写，而不是改变原意。</p>\n<h4>写作视角法</h4>\n<p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>同一主体在同一对象上的做法从引入转为限制，正是态度或立场发生改变。</p>\n</blockquote>\n<p>作者明确把“现在可能限制”与“过去亲自引入”并置，随后整段继续回顾旧裁决如何推动专利扩张，强化这次转向幅度很大。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Having once introduced business-method patents, the Federal Circuit is now prepared to curb them; this reversal marks a change in its position.</p>\n<p>联邦巡回法院过去曾引入商业方法专利，如今却准备限制它们；这种反转标志着其立场发生变化。</p>\n</blockquote>\n<p>假设写法只把原文隐含的“立场变化”说得更直白，前后动作和对象与原文完全一致。C所需的写法正是文章已有推进。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利从过去扩张转向现在面临收紧，不能单独确定<code>about-face</code>的准确释义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs</code>与<code>introduced</code>构成的动作对照判断。</p>\n<p>C实际说的是：</p>\n<blockquote>\n<p>C. change of attitude<br />\n态度或立场的改变</p>\n</blockquote>\n<p>具体比较：主旨中的整体方向是“过去广泛存在→现在面临收紧”，C的动作关系也是前后立场改变；主体、对象和方向能够接上。</p>\n<p>局部的<code>Curbs</code>与<code>introduced</code>构成直接反义动作对照，完整支持<code>change of attitude</code>。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. enhancement of dignity</h3>\n<blockquote>\n<p>尊严或地位的提升</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，<code>dramatic</code>也只表示转变幅度大，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了<code>dramatic</code>的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示尊严或地位的提升。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项中的<code>enhancement of dignity</code>。<code>dramatic</code>只说明变化显著，不能直接定位到<code>dignity</code>；真正的解释仍在<code>because</code>后的旧动作<code>introduced</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit，句子比较它过去引入与现在限制同一类专利的动作方向；没有出现机构地位、尊严或声望。</p>\n<p>D中的关系是：D设置的动作是<code>enhancement</code>，对象是<code>dignity</code>，需要原文写某种价值或地位得到提升。</p>\n<p>具体差异在于：D把“做法转向”改成“地位提升”。<code>dramatic</code>修饰转向的幅度，并不提供正面评价，更不能补出<code>dignity</code>。</p>\n<h4>写作视角法</h4>\n<p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>句子说明的是政策动作反转，没有评价法院的尊严、地位或声望。</p>\n</blockquote>\n<p>文章把焦点放在法院政策前后不一致以及旧裁决带来的专利扩张，没有讨论法院因此获得更高尊严。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By curbing these patents, the court would enhance its dignity and strengthen its institutional standing.</p>\n<p>通过限制这些专利，法院将提升自身尊严并巩固其制度地位。</p>\n</blockquote>\n<p>假设写法新增了正面评价和地位结果；实际句子只说明前后行动反转。D所需的对象与结果都不存在。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断<code>about-face</code>在第三段第一句中的具体词义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs ... because ... introduced such patents</code>这处局部原文判断。</p>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>D. enhancement of dignity<br />\n尊严或地位的提升</p>\n</blockquote>\n<p>具体比较：主旨的对象是专利制度，方向是收紧；D的对象是法院尊严，方向是提升。对象和评价方向都换了。</p>\n<p>局部原文没有任何地位或声誉词，<code>about-face</code>只能从<code>Curbs</code>与<code>introduced</code>的动作对照中解释。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>28题结论</h3>\n<blockquote>\n<p><strong>28. C. change of attitude</strong></p>\n</blockquote>\n<ul>\n<li>A把行动方向变化改成信誉损失；</li>\n<li>B借用负面背景，却把前后反转改成敌意程度增加；</li>\n<li>C用“态度改变”概括同一法院从引入到限制的转向；</li>\n<li>D把变化幅度大误写成尊严或地位提升。</li>\n</ul>\n<h2>29题</h2>\n<blockquote>\n<p>We learn from the last two paragraphs that business-method patents ______.<br />\n从最后两段可以知道，商业方法专利怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道局部推断题，范围被限定在最后两段。先列出旧裁决可能被重新考虑、专利保护范围收窄以及“太多显而易见的发明仍获专利支持”这几项明示事实，再作最小限度的推断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n</blockquote>\n<p>题干把范围锁定在最后两段。第四段写旧裁决可能被重新考虑，第五段写最高法院已经缩小专利保护范围，并认为太多显而易见的“发明”仍被维持为专利。需要从这些明示事实作最小限度的概括。</p>\n<h3>A. are immune to legal challenges</h3>\n<blockquote>\n<p>不受法律挑战影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。最后两段恰好写法院要重新考虑旧裁决、最高法院也在缩小保护范围，这说明相关专利正在受到法律挑战；A的方向相反，因此被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住了法院、裁决和专利保护这些法律场景，所以形式上与原文接近。原文写的是相关规则正在被重新审视、保护范围正在收窄，A却写成商业方法专利不受法律挑战。真正变化的是挑战是否存在这一方向。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n<p>a series of recent decisions ... has narrowed the scope of protections for patent holders</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利不受法律挑战影响。</p>\n</blockquote>\n<p>定位时先同时抓住题干的范围限制<code>the last two paragraphs</code>和选项中的<code>immune to legal challenges</code>。最后两段必须整体读取：第四段写法院可能重新考虑旧裁决，第五段写最高法院已缩小专利保护范围。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：法律主体是Federal Circuit和Supreme Court；动作是重新考虑旧裁决、缩小保护范围；对象是商业方法专利规则及专利持有人保护，说明挑战正在发生。</p>\n<p>A中的关系是：主体是商业方法专利，谓语<code>are immune to</code>断言它们不会受到法律挑战，范围是绝对免疫。</p>\n<p>具体差异在于：A把“正在被两级法院重新审视和收紧”改成“完全不受挑战”，方向直接反转；<code>immune</code>还把程度绝对化。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>旧裁决正在被重新考虑，专利保护范围也在收窄；相关专利正承受法律挑战，而不是不受挑战。</p>\n</blockquote>\n<p>第四段把Bilski案交由全体法官审理并重审旧规则，第五段继续写最高法院的一系列收紧裁决，法律压力逐层加强。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Business-method patents remain immune to legal challenge. The Federal Circuit will not reconsider its earlier ruling, and the Supreme Court has left patent protections unchanged.</p>\n<p>商业方法专利仍不受法律挑战。联邦巡回法院不会重新考虑旧裁决，最高法院也没有改变专利保护。</p>\n</blockquote>\n<p>假设写法需要“拒绝重审＋保护不变”；实际文章正好写“考虑重审＋保护缩小”。A所需的行文与原文逐项相反。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨已经确定整类商业方法专利正面临迫近威胁，因此从最后两段得到的结论至少不能是它们对法律挑战免疫。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. are immune to legal challenges<br />\n不受法律挑战影响</p>\n</blockquote>\n<p>具体比较：主旨的方向是风险和收紧，A的方向是安全和免疫；动作方向、程度和最终状态全部相反。</p>\n<p>局部的“<code>reconsider</code> its State Street Bank ruling”和“<code>narrowed the scope of protections</code>”直接证明法律挑战存在。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. are often unnecessarily issued</h3>\n<blockquote>\n<p>经常在没有必要的情况下被授予</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。第五段说太多专利被维持给了显而易见的“发明”，第四段又写旧裁决可能被重新考虑；这共同指向部分专利授予门槛过低、没有必要，因此B被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>B抓住了最后一段的<code>too many patents</code>和<code>inventions that are obvious</code>。原文先写太多显而易见的发明仍获得专利支持，接着把联邦巡回法院的行动放进收紧保护的背景中；B把这层评价概括成“有些专利常被不必要地授予”。<code>often</code>没有把所有专利一概否定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious</p>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利经常在没有必要的情况下被授予。</p>\n</blockquote>\n<p>定位时先同时抓住题干指定的最后两段以及选项中的<code>unnecessarily issued</code>。<code>unnecessarily</code>不是原词，需要由第五段的<code>too many patents</code>和<code>inventions that are obvious</code>作最小推断，再用第四段的<code>reconsider</code>补充制度正在纠偏。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n</blockquote>\n<p>原文中的关系是：最高法院法官是评价主体，指出被维持的专利数量“太多”，对应的“发明”又是<code>obvious</code>；联邦巡回法院还准备重新考虑建立旧做法的裁决。</p>\n<p>B中的关系是：主体被概括成商业方法专利，<code>often unnecessarily issued</code>把“数量过多＋发明显而易见”压缩成部分授予缺乏必要性；<code>often</code>保留非全称范围。</p>\n<p>具体差异在于：B没有照抄<code>upheld</code>，但作出的推断很小：若太多显而易见的“发明”仍获专利支持，就存在相当数量本不应给予的专利。它没有把所有专利一概判为无效。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>旧裁决可能被重审，最高法院又认为太多显而易见的“发明”仍获专利支持；这表明部分专利授予或维持得过多。</p>\n</blockquote>\n<p>作者先写旧裁决可能被重新考虑，再用最高法院的判断解释背景：过多明显的“发明”仍被授予或维持专利保护。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The courts are concerned that business-method patents have often been granted or sustained even when the claimed inventions are obvious and do not warrant protection.</p>\n<p>法院担心，即使所称发明显而易见、不值得保护，商业方法专利仍经常被授予或维持。</p>\n</blockquote>\n<p>最小假设只是把原文的评价关系说直：<code>too many</code>提供频率或数量方向，<code>obvious</code>提供“不值得专利保护”的理由。B所需的写法已经包含在最后一段。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利正面临收紧，不能单独推出它们“经常在没有必要时被授予”这一局部判断。</p>\n</blockquote>\n<p>本项最终仍要根据<code>too many patents</code>和<code>inventions that are obvious</code>这两个局部限制判断。</p>\n<p>B实际说的是：</p>\n<blockquote>\n<p>B. are often unnecessarily issued<br />\n经常在没有必要的情况下被授予</p>\n</blockquote>\n<p>具体比较：主旨的方向是收紧整类专利，B给出收紧的制度理由；主体范围相符，动作是授予，评价方向是过度。主旨提供大方向，局部原文负责完成“unnecessarily”的推断。</p>\n<p>“<code>too many patents</code>”与“<code>inventions that are obvious</code>”共同坐实：数量过多且对象显而易见，最小推断就是部分专利并无授予必要。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. lower the esteem for patent holders</h3>\n<blockquote>\n<p>降低专利持有人的声望</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>lower the [xxx] for patent holders</code>。虽然核心名词被遮挡，但原文的动作主体是最高法院近期裁决，结果是保护范围缩小；选项却把商业方法专利本身写成动作主体，因此C被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住了原文中的<code>patent holders</code>和某种“变低”的方向，所以有明确改写来源。原文写的是法院裁决缩小了专利持有人的保护范围，C却写成商业方法专利降低了持有人的声望。真正变化的是动作主体和被降低的对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利降低了专利持有人的声望。</p>\n</blockquote>\n<p>定位时先同时抓住选项中的<code>lower the esteem for patent holders</code>和原文中的<code>narrowed the scope of protections for patent holders</code>。两者都出现<code>patent holders</code>和“降低”的表面方向，但必须逐项核对是谁降低、降低的是什么。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：主体是最高法院近期一系列裁决，动作是<code>narrowed</code>，对象是<code>the scope of protections</code>，受影响者是专利持有人。</p>\n<p>C中的关系是：主体被换成商业方法专利，动作变成<code>lower</code>，对象从法律保护范围换成<code>esteem</code>即声望，专利持有人仍只是受影响者。</p>\n<p>具体差异在于：C保留了<code>patent holders</code>和下降方向，却同时偷换动作主体与被降低对象。原文讲权利保护变窄，C改成名誉评价下降。</p>\n<h4>写作视角法</h4>\n<p>原文第5段是这样写的：</p>\n<blockquote>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n<p>法院裁决缩小的是专利持有人的法律保护范围，后文继续讨论专利门槛；文章没有评价持有人的社会声望。</p>\n</blockquote>\n<p>第五段用司法裁决解释专利持有人可获得的保护范围正在收缩，后文继续谈显而易见的“发明”被过度支持。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The proliferation of business-method patents has lowered public esteem for patent holders and damaged their reputation.</p>\n<p>商业方法专利的扩张降低了公众对专利持有人的评价，并损害了他们的声誉。</p>\n</blockquote>\n<p>假设写法需要“专利造成声誉损害”；实际写法是“法院裁决造成保护范围缩小”。表面都能翻成“降低”，但主体、对象和关系完全不同。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利的法律处境正在收紧，不能单独判断专利持有人的社会声望是否下降。</p>\n</blockquote>\n<p>本项最终仍要根据<code>narrowed the scope of protections for patent holders</code>这处局部原文判断。</p>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>C. lower the esteem for patent holders<br />\n降低专利持有人的声望</p>\n</blockquote>\n<p>具体比较：主旨的对象是商业方法专利的法律命运，C的对象是持有人的声望；主旨中的动作来自法院，C的动作主体却是专利本身。对象和因果主体均偏离。</p>\n<p>局部短语是“<code>narrowed the scope of protections</code>”，不是<code>lowered the esteem</code>，不能仅凭<code>patent holders</code>重合选C。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. increase the incidence of risks</h3>\n<blockquote>\n<p>增加风险发生的频率</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见，<code>risks</code>能让人想到第四段能源市场中的<code>risk</code>。但原文只说Bilski案涉及一种与风险对冲有关的方法，没有写专利导致风险更频繁，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了第四段中的<code>risk</code>，所以有一个表面词汇落点。原文写的是专利方法用于对冲能源市场风险，D却把它接成商业方法专利增加风险发生率。原文没有表达这条因果，也没有风险次数的变化。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利会提高风险发生的频率。</p>\n</blockquote>\n<p>定位时先同时抓住题干范围<code>the last two paragraphs</code>和选项中的<code>risks</code>。<code>risks</code>只能把人带到第四段第一句的<code>a method for hedging risk</code>，还需核对原文是在说风险被管理，还是风险发生率增加。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges.</p>\n</blockquote>\n<p>原文中的关系是：主体是Bilski案，涉及对象是一项用于<code>hedging risk</code>的专利方法；<code>risk</code>只是该方法处理的对象。后文动作是法院审理案件。</p>\n<p>D中的关系是：主体扩大成全部商业方法专利，动作是<code>increase</code>，对象是风险发生率，形成“专利导致更多风险”的因果。</p>\n<p>具体差异在于：D只借用了<code>risk</code>这个名词，却把“处理风险的方法”改成“导致风险增加”，还从单一案件扩大到整类专利，并新增发生频率概念。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market.</p>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>risk是专利方法要对冲的对象，后文随即转入案件审理；没有写商业方法专利使风险发生率上升。</p>\n</blockquote>\n<p>第四段用一句话交代Bilski专利涉及能源风险对冲，随后立刻转入全体法官审理和重审旧裁决；第五段讨论保护范围与显而易见的发明。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The use of business-method patents has increased the incidence of risk in the energy market, producing more frequent and severe losses.</p>\n<p>商业方法专利的使用增加了能源市场中的风险发生率，造成了更频繁、更严重的损失。</p>\n</blockquote>\n<p>假设写法新增“风险变多”的结果；实际原文只说某方法用于<code>hedging risk</code>，没有风险数量、频率或因果数据。D从一个关键词脑补出了完整结论。</p>\n<h4>主旨交叉验证法</h4>\n<p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入29题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利面临司法威胁，不能单独判断这些专利是否会提高市场风险的发生率。</p>\n</blockquote>\n<p>本项最终仍要根据<code>a method for hedging risk</code>这处局部原文判断。</p>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>D. increase the incidence of risks<br />\n增加风险发生的频率</p>\n</blockquote>\n<p>具体比较：主旨中的主体虽是商业方法专利，但动作是被法院收紧；D的动作是主动增加风险，对象也变成市场风险。动作和对象均不相同。</p>\n<p>局部原文“<code>a method for hedging risk</code>”只说明专利方法与风险对冲有关，无法推出<code>increase the incidence</code>。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>29题结论</h3>\n<blockquote>\n<p><strong>29. B. are often unnecessarily issued</strong></p>\n</blockquote>\n<ul>\n<li>A把正在发生的法律审查改成“不受挑战”；</li>\n<li>B从“太多明显发明仍获专利”作出最小限度的过度授予推断；</li>\n<li>C把法院决定缩小保护范围改成专利降低持有人声望；</li>\n<li>D借用<code>risk</code>一词，却补出专利会提高风险发生率。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<h2>段落与全文逻辑框架</h2>\n<p><strong>逻辑层次1：过去十年授予了数千项商业方法专利</strong>（段落1背景介绍） 过去十年授予了数千项商业方法专利 → 【举例：（亚马逊的一键支付）+（美林的资产配置）+（搬箱子技术）】</p>\n<p>↓（转折：当前形势变化）</p>\n<p><strong>逻辑层次2：国家最高专利法院准备缩减商业方法专利</strong>（段落2当前动向） 国家最高专利法院准备缩减商业方法专利 →（这类专利自10年前授权以来一直存在争议）→【联邦巡回法院将通过Bilski案进行广泛审查：（可能消除整个类别的专利）】</p>\n<p>↓（历史背景与现状对比）</p>\n<p><strong>逻辑层次3：限制将是戏剧性转变</strong>（段落3历史与矛盾现状） 限制将是戏剧性转变 →（因为联邦巡回法院1998年州街银行案引入此类专利）→【引发的后果：（互联网公司抢占在线交易专利）+（老牌公司防御性申请）+（IBM获300多项专利但质疑其法律基础）+（华尔街公司申请专利但在法庭反对）】</p>\n<p>→（具体案例说明）</p>\n<p><strong>逻辑层次4：Bilski案详情</strong>（段落4案例细节） Bilski案详情 →（涉及能源市场风险对冲方法专利）→【审理方式特殊：（12名法官全体审理而非3人小组）+（评估是否重新考虑州街银行裁决）】</p>\n<p>↑（更大背景解释）</p>\n<p><strong>逻辑层次5：联邦巡回法院行动的背景</strong>（段落5深层原因） 联邦巡回法院行动的背景 →（最高法院近期缩小专利保护范围）→【举例：（去年4月：太多显而易见的发明获得专利）】→ 结论：（联邦巡回法院在回应最高法院的反专利趋势）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：商业方法专利在经历了十年的快速发展后，现在面临着可能被大幅限制的威胁，这种转变反映了法院系统对专利保护范围的重新思考。</p>\n<h2>小标题题</h2>\n<h3>题目</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p><strong>A. Everyday Business Practices Enter the Patent System</strong></p>\n<p><strong>B. A Pending Review Puts a Patent Class at Risk</strong></p>\n<p><strong>C. One Ruling Triggers a Defensive Patent Rush</strong></p>\n<p><strong>D. An Exceptional Hearing Reopens an Old Rule</strong></p>\n<p><strong>E. A Broader Judicial Retreat from Patent Protection</strong></p>\n<p><strong>F. New Energy Rules Reshape Financial Markets</strong></p>\n<p><strong>G. Companies Unite behind Business-Method Patents</strong></p>\n<h2>A Pending Threat to Patents</h2>\n<h3>41. __________</h3>\n<p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com (AMZN) received one for its &quot;one-click&quot; online payment system. Merrill Lynch (MER) got legal protection for an asset allocation strategy. One inventor patented a technique for lifting a box.</p>\n<h3>42. __________</h3>\n<p>Now the nation's top patent court appears poised to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit on Feb. 15 said it would use a case pending before it to conduct a broad review of business-method patents. In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch, a patent professor at the University of Missouri School of Law. It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<h3>43. __________</h3>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that ushered in such patents with its 1998 decision in the so-called State Street Bank (STT) case, approving a patent on a way of pooling mutual-fund assets. That ruling produced an explosion in business-method patent filings, initially by nascent Internet companies trying to stake out exclusive rights to specific types of online transactions. Later, more established companies raced to add such patents to their portfolios, if only as a defensive move against rivals that might beat them to the punch. In 2005, IBM (IBM) noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.</p>\n<h3>44. __________</h3>\n<p>The Bilski case involves a claimed patent on a method for hedging risk in the energy market. The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<h3>45. __________</h3>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders. Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious. The judges on the Federal Circuit are &quot;reacting to the anti-patent trend at the Supreme Court,&quot; says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.</p>\n<h3>解析</h3>\n<h4>41题</h4>\n<p>【答案】A. Everyday Business Practices Enter the Patent System</p>\n<blockquote>\n<p>日常商业做法进入专利体系</p>\n</blockquote>\n<p>这一部分整体在交代：过去十年，原本属于日常经营或操作方式的做法大量进入了专利体系。</p>\n<p>开头先给出规模：</p>\n<blockquote>\n<p>thousands of patents have been granted for what are called business methods</p>\n</blockquote>\n<p>随后连续列出三类跨度很大的例子：</p>\n<blockquote>\n<p>one-click online payment system<br />\nan asset allocation strategy<br />\na technique for lifting a box</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>先说明商业方法专利数量庞大<br />\n→ 再用网络支付、金融策略和搬箱子技术说明它覆盖了各种日常做法</p>\n</blockquote>\n<p>A中的<code>Everyday Business Practices</code>对应这些普通经营与操作方式，<code>Enter the Patent System</code>对应它们被授予专利。</p>\n<p>最强干扰项是G。段中确实有企业申请专利，但这一段没有写企业“联合支持”这套制度，只是在列举获授对象。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. A</strong></p>\n</blockquote>\n<h4>42题</h4>\n<p>【答案】B. A Pending Review Puts a Patent Class at Risk</p>\n<blockquote>\n<p>一场即将展开的审查使整类专利面临风险</p>\n</blockquote>\n<p>这一部分整体在写当前新闻：联邦巡回法院准备借一个待审案件全面审查商业方法专利，影响可能覆盖整个类别。</p>\n<p>开头用<code>Now</code>完成时间转折：</p>\n<blockquote>\n<p>appears poised to scale back on business-method patents</p>\n</blockquote>\n<p>随后说明法院要做什么：</p>\n<blockquote>\n<p>use a case pending before it to conduct a broad review</p>\n</blockquote>\n<p>结尾把影响范围推到最高：</p>\n<blockquote>\n<p>has the potential to eliminate an entire class of patents</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>法院准备收缩<br />\n→ 用待审案件开展广泛审查<br />\n→ 整类专利都可能受影响</p>\n</blockquote>\n<p>B中的<code>Pending Review</code>对应待审案件和广泛审查，<code>a Patent Class at Risk</code>对应可能消除整类专利。</p>\n<p>最强干扰项是D。这里确实出现了案件，但“全体法官审理”和“重开旧规则”要到下一处案件细节中才展开。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. B</strong></p>\n</blockquote>\n<h4>43题</h4>\n<p>【答案】C. One Ruling Triggers a Defensive Patent Rush</p>\n<blockquote>\n<p>一项裁决引发防御性专利申请潮</p>\n</blockquote>\n<p>这一部分整体在解释：1998年的州街银行案怎样开启商业方法专利，并把企业推入一轮申请和防御性囤积。</p>\n<p>开头先回到制度起点：</p>\n<blockquote>\n<p>the Federal Circuit itself ... ushered in such patents with its 1998 decision</p>\n</blockquote>\n<p>中间写直接后果：</p>\n<blockquote>\n<p>produced an explosion in business-method patent filings</p>\n</blockquote>\n<p>后半继续把申请潮扩展到老牌公司：</p>\n<blockquote>\n<p>raced to add such patents to their portfolios<br />\nas a defensive move against rivals</p>\n</blockquote>\n<p>段尾的IBM和华尔街公司又显示一种矛盾：即使质疑或反对这种做法，也会先用专利保护自己。</p>\n<p>段内推进链是：</p>\n<blockquote>\n<p>旧裁决引入专利<br />\n→ 新兴企业抢占权利<br />\n→ 老牌企业防御性跟进<br />\n→ 反对者也不得不参与</p>\n</blockquote>\n<p>C中的<code>One Ruling</code>对应1998年裁决，<code>Defensive Patent Rush</code>覆盖申请爆发和防御性积累。</p>\n<p>最强干扰项是G。企业确实大量持有专利，但IBM和华尔街公司的例子正说明它们并未一致认同其法律基础。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. C</strong></p>\n</blockquote>\n<h4>44题</h4>\n<p>【答案】D. An Exceptional Hearing Reopens an Old Rule</p>\n<blockquote>\n<p>一次特殊审理重新打开旧规则</p>\n</blockquote>\n<p>这一部分整体在写Bilski案的具体程序，以及法院准备借此重新审视旧裁决。</p>\n<p>开头只用一句交代案件对象：</p>\n<blockquote>\n<p>a method for hedging risk in the energy market</p>\n</blockquote>\n<p>真正的段落重心落在异常审理安排：</p>\n<blockquote>\n<p>heard by all 12 of the court's judges<br />\nrather than a typical panel of three</p>\n</blockquote>\n<p>结尾指出要评估的核心问题：</p>\n<blockquote>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>交代案件对象<br />\n→ 强调全体法官审理的特殊性<br />\n→ 把审理指向旧裁决是否重开</p>\n</blockquote>\n<p>D中的<code>Exceptional Hearing</code>对应12名法官全体审理，<code>Reopens an Old Rule</code>对应重新考虑州街银行案裁决。</p>\n<p>最强干扰项是F。能源市场只说明涉案方法的应用场景，段落并没有讨论新的能源规则怎样重塑金融市场。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. D</strong></p>\n</blockquote>\n<h4>45题</h4>\n<p>【答案】E. A Broader Judicial Retreat from Patent Protection</p>\n<blockquote>\n<p>司法系统整体收紧专利保护</p>\n</blockquote>\n<p>这一部分整体在把联邦巡回法院的行动放进更大的司法背景中：最高法院近期已经连续收窄专利保护。</p>\n<p>开头直接建立背景关系：</p>\n<blockquote>\n<p>comes in the wake of a series of recent decisions by the Supreme Court</p>\n</blockquote>\n<p>随后说明这些决定的共同方向：</p>\n<blockquote>\n<p>narrowed the scope of protections for patent holders</p>\n</blockquote>\n<p>例子进一步写出收紧的理由：</p>\n<blockquote>\n<p>too many patents were being upheld for &quot;inventions&quot; that are obvious</p>\n</blockquote>\n<p>结尾把联邦巡回法院的动作概括为：</p>\n<blockquote>\n<p>reacting to the anti-patent trend at the Supreme Court</p>\n</blockquote>\n<p>段内推进链是：</p>\n<blockquote>\n<p>最高法院连续裁决<br />\n→ 专利保护范围收窄<br />\n→ 对明显发明获专利提出质疑<br />\n→ 联邦巡回法院作出回应</p>\n</blockquote>\n<p>E中的<code>Broader Judicial Retreat</code>对应跨法院、跨裁决的收紧背景，<code>from Patent Protection</code>对应保护范围缩小。</p>\n<p>最强干扰项是B。B概括的是前面那项具体待审案件造成的风险，而本段的功能是提供更大的司法趋势背景。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. E</strong></p>\n</blockquote>\n<h2>排序题</h2>\n<h3>题目</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. <strong>Paragraphs A, E, and H have been correctly placed.</strong> Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p><strong>A.</strong> Now the nation's top patent court appears poised to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit on Feb. 15 said it would use a case pending before it to conduct a broad review of business-method patents.</p>\n<p><strong>B.</strong> In 2005, IBM (IBM) noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.</p>\n<p><strong>C.</strong> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that ushered in such patents with its 1998 decision in the so-called State Street Bank (STT) case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p><strong>D.</strong> Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com (AMZN) received one for its &quot;one-click&quot; online payment system. Merrill Lynch (MER) got legal protection for an asset allocation strategy. One inventor patented a technique for lifting a box.</p>\n<p><strong>E.</strong> That ruling produced an explosion in business-method patent filings, initially by nascent Internet companies trying to stake out exclusive rights to specific types of online transactions. Later, more established companies raced to add such patents to their portfolios, if only as a defensive move against rivals that might beat them to the punch.</p>\n<p><strong>F.</strong> The Bilski case involves a claimed patent on a method for hedging risk in the energy market. The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p><strong>G.</strong> In re Bilski, as the case is known, is &quot;a very big deal,&quot; says Dennis D. Crouch, a patent professor at the University of Missouri School of Law. It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n<p><strong>H.</strong> The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders. Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious. The judges on the Federal Circuit are &quot;reacting to the anti-patent trend at the Supreme Court,&quot; says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.</p>\n<p><strong>41. _____　A　42. _____　43. _____　E　44. _____　45. _____　H</strong></p>\n<h4>解析</h4>\n<p>这是一道8段排序题，其中A、E、H三个段落的位置已经给出。先把八段分别在做什么看清：</p>\n<ul>\n<li>D：从过去十年的规模与例子写起，建立整类商业方法专利的背景；</li>\n<li>A：用<code>Now</code>转到当前，提出联邦巡回法院准备缩减并广泛审查；</li>\n<li>G：点明待审案件就是Bilski，并说明它可能影响整类专利；</li>\n<li>C：解释为什么限制会是一次大转向，回到1998年州街银行案；</li>\n<li>E：写旧裁决如何引发申请爆发和老牌公司的防御性跟进；</li>\n<li>B：用IBM和华尔街公司的矛盾行为把防御性申请具体化；</li>\n<li>F：回到Bilski案，说明全体法官审理与重审旧裁决；</li>\n<li>H：补最高法院近期收紧专利保护的更大背景。</li>\n</ul>\n<p>全文的组织顺序是：</p>\n<blockquote>\n<p>过去十年的扩张与例子<br />\n→ 当前法院准备收缩<br />\n→ 点明核心案件及其影响<br />\n→ 回看旧制度起点<br />\n→ 说明申请潮与防御性积累<br />\n→ 用企业矛盾行为落地<br />\n→ 回到案件审理细节<br />\n→ 补充最高法院的整体背景</p>\n</blockquote>\n<p>因此，完整顺序为：</p>\n<blockquote>\n<p><strong>D → A → G → C → E → B → F → H</strong></p>\n</blockquote>\n<h4>41题</h4>\n<p>【答案】D</p>\n<p>41题位于已知A段之前，也就是全文第一段。</p>\n<p>A段一开头就是：</p>\n<blockquote>\n<p>Now the nation's top patent court appears poised to scale back on business-method patents</p>\n</blockquote>\n<p><code>Now</code>说明前文应该先有一段过去或既有状态，随后才转到当前变化；A中的<code>business-method patents</code>也需要先被介绍。</p>\n<p>D段正好先完成两件事：</p>\n<blockquote>\n<p>Over the past decade, thousands of patents have been granted<br />\nAmazon、Merrill Lynch和搬箱子技术的三个例子</p>\n</blockquote>\n<p>局部推进链是：</p>\n<blockquote>\n<p>D：先说明过去十年的扩张，并解释这类专利覆盖什么<br />\n↓<br />\nA：用<code>Now</code>转入法院准备收缩</p>\n</blockquote>\n<p>最强候选G不能放在这里，因为它用<code>In re Bilski, as the case is known</code>承接前文已经出现的“一个待审案件”，而全文开头还没有引出该案。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. D</strong></p>\n</blockquote>\n<h4>42题</h4>\n<p>【答案】G</p>\n<p>42题位于已知A段之后，下一空还要继续承接当前审查。</p>\n<p>A段尾部先写：</p>\n<blockquote>\n<p>use a case pending before it to conduct a broad review</p>\n</blockquote>\n<p>G段开头马上把这个尚未点名的案件具体化：</p>\n<blockquote>\n<p>In re Bilski, as the case is known</p>\n</blockquote>\n<p>G段随后把案件影响推到：</p>\n<blockquote>\n<p>eliminate an entire class of patents</p>\n</blockquote>\n<p>下一段C以<code>Curbs on business-method claims</code>起笔，正好接住这种整类专利可能被限制的后果，并解释为何这是一次转向。</p>\n<p>局部推进链是：</p>\n<blockquote>\n<p>A：提出将利用一个待审案件<br />\n→ G：给案件命名并说明潜在影响<br />\n→ C：解释这种限制为何构成历史性反转</p>\n</blockquote>\n<p>最强候选F也写Bilski案，但它直接进入专利方法、12名法官和重审问题；在案件第一次出现时，先说明“这是什么案、为何重大”更自然。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. G</strong></p>\n</blockquote>\n<h4>43题</h4>\n<p>【答案】C</p>\n<p>43题位于G段之后、已知E段之前。</p>\n<p>G段尾部写的是：</p>\n<blockquote>\n<p>eliminate an entire class of patents</p>\n</blockquote>\n<p>C段用<code>Curbs on business-method claims</code>把这个潜在后果接过来，然后提出<code>about-face</code>，再回到1998年州街银行案。</p>\n<p>更关键的是，已知E段开头是：</p>\n<blockquote>\n<p>That ruling produced an explosion in business-method patent filings</p>\n</blockquote>\n<p>这里的<code>That ruling</code>必须回指前文已经出现的具体裁决。C段正好在末尾给出：</p>\n<blockquote>\n<p>its 1998 decision in the ... State Street Bank case</p>\n</blockquote>\n<p>局部推进链是：</p>\n<blockquote>\n<p>G：整类专利可能被消除<br />\n→ C：这种限制会逆转法院过去建立的规则<br />\n→ E：那项旧裁决随后引发申请潮</p>\n</blockquote>\n<p>最强候选F虽然也含有<code>State Street Bank ruling</code>，但F讨论的是当前案件审理，接到E的“那项裁决产生申请爆发”会把时间从当前突然跳回过去，顺序不如C自然。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. C</strong></p>\n</blockquote>\n<h4>44题</h4>\n<p>【答案】B</p>\n<p>44题位于已知E段之后，后面还要回到当前的Bilski案。</p>\n<p>E段先写一般变化：</p>\n<blockquote>\n<p>more established companies raced to add such patents to their portfolios<br />\nas a defensive move against rivals</p>\n</blockquote>\n<p>B段马上用两个具体例子把这种防御性行为落地：</p>\n<blockquote>\n<p>IBM ... more than 300 business-method patents<br />\nWall Street investment firms armed themselves with patents</p>\n</blockquote>\n<p>两例还共同补出同一种矛盾：企业一边质疑或反对这种做法，一边又为防止竞争对手抢先而持有专利。</p>\n<p>局部推进链是：</p>\n<blockquote>\n<p>E：老牌公司普遍防御性跟进<br />\n→ B：IBM和华尔街公司具体展示这种矛盾行为<br />\n→ F：历史扩张说明完毕，回到当前核心案件</p>\n</blockquote>\n<p>最强候选F可以在主题上接回Bilski，但若立刻放在E后，E段提出的企业防御性申请还缺少原文随后给出的实例，B会失去最自然的位置。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. B</strong></p>\n</blockquote>\n<h4>45题</h4>\n<p>【答案】F</p>\n<p>45题位于B段之后、已知H段之前。</p>\n<p>B段结束了企业在旧制度下如何行动的历史回顾。接下来需要回到文章当前的核心案件，F段正好开头就是：</p>\n<blockquote>\n<p>The Bilski case involves a claimed patent</p>\n</blockquote>\n<p>F随后说明联邦巡回法院发布了一项特殊命令：</p>\n<blockquote>\n<p>heard by all 12 of the court's judges<br />\nwhether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n</blockquote>\n<p>已知H段一开头则是：</p>\n<blockquote>\n<p>The Federal Circuit's action comes in the wake of ...</p>\n</blockquote>\n<p>这里的<code>action</code>需要回指前文刚写完的全体法官审理和重审安排；F正好提供这个指代对象。</p>\n<p>局部推进链是：</p>\n<blockquote>\n<p>B：旧制度下的企业行为<br />\n→ F：回到Bilski案及法院的具体行动<br />\n→ H：解释这一行动背后的最高法院趋势</p>\n</blockquote>\n<p>最强候选C也能引出州街银行案，但它属于前面的历史起点；放在这里会让<code>That ruling</code>、申请潮和企业例子的时间链被打断。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. F</strong></p>\n</blockquote>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>可积累的主题表达</th>\n  <th>中文翻译</th>\n  <th>所属类别</th>\n  <th>使用层级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>technological innovation</strong></td>\n  <td><strong>科技创新</strong></td>\n  <td><strong>创新｜科技发展</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td><strong>sound intellectual property protection</strong></td>\n  <td><strong>健全的知识产权保护</strong></td>\n  <td><strong>法治｜制度建设</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td>high-quality patent examination</td>\n  <td>高质量专利审查</td>\n  <td>法治｜规范治理</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>clear and reasonable patent standards</td>\n  <td>清晰合理的专利标准</td>\n  <td>法治｜制度建设</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td><strong>balancing innovation with the public interest</strong></td>\n  <td><strong>平衡创新与公共利益</strong></td>\n  <td><strong>和谐｜发展平衡</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td>fair market competition</td>\n  <td>公平市场竞争</td>\n  <td>公正｜市场秩序</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>responsible innovation</td>\n  <td>负责任的创新</td>\n  <td>敬业｜责任意识</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>corporate integrity</td>\n  <td>企业诚信</td>\n  <td>诚信｜商业伦理</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td><strong>independent judicial review</strong></td>\n  <td><strong>独立的司法审查</strong></td>\n  <td><strong>法治｜司法公正</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td>evidence-based policymaking</td>\n  <td>基于证据的政策制定</td>\n  <td>法治｜科学治理</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>institutional adaptability</td>\n  <td>制度适应力</td>\n  <td>创新｜与时俱进</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>preventing unnecessary monopolies</td>\n  <td>防止不必要的垄断</td>\n  <td>公正｜市场秩序</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td><strong>protection of legitimate inventions</strong></td>\n  <td><strong>对正当发明的保护</strong></td>\n  <td><strong>法治｜权利保障</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td>rational use of legal rights</td>\n  <td>理性使用法律权利</td>\n  <td>诚信｜规则意识</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>long-term thinking in business decisions</td>\n  <td>商业决策中的长远眼光</td>\n  <td>人生哲理｜远见</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>a sense of social responsibility</td>\n  <td>社会责任感</td>\n  <td>敬业｜责任感</td>\n  <td>个人主题</td>\n</tr>\n</tbody>\n</table></div>\n<h2>2. 大作文第一段描述题目信息时可积累的表达</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>适用题型</th>\n  <th>考试时可复用的形式</th>\n  <th>中文翻译</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>图画题</strong></td>\n  <td><strong>The scene presents a dramatic about-face from A to B.</strong></td>\n  <td><strong>画面呈现了从A到B的剧烈转向。</strong></td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>In the picture, A appears ready to scale back on B.</td>\n  <td>画面中，A看起来准备缩减B。</td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>A, once widely encouraged, is now being reconsidered.</td>\n  <td>A过去曾被广泛鼓励，如今正被重新审视。</td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>The contrast between A and B reflects a change in attitude toward C.</td>\n  <td>A与B的对比反映了人们对C的态度变化。</td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>The image suggests that excessive reliance on A may eventually trigger B.</td>\n  <td>画面表明，对A的过度依赖最终可能引发B。</td>\n</tr>\n<tr>\n  <td><strong>图表题</strong></td>\n  <td><strong>Over the past X years, the number of A has risen sharply.</strong></td>\n  <td><strong>在过去X年里，A的数量大幅上升。</strong></td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>The chart shows an explosion in A during the period.</td>\n  <td>图表显示，这一时期A出现爆发式增长。</td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>A increased from X to Y, while B remained comparatively stable.</td>\n  <td>A从X增至Y，而B相对稳定。</td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>The figure indicates that A accounts for a growing share of B.</td>\n  <td>数据表明，A在B中所占比重不断上升。</td>\n</tr>\n<tr>\n  <td><strong>图表题</strong></td>\n  <td><strong>After a decade of rapid growth, A now faces possible restriction.</strong></td>\n  <td><strong>经历十年的快速增长后，A如今面临可能的限制。</strong></td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The article reviews how A was introduced and then rapidly expanded.</td>\n  <td>文章回顾了A如何被引入并迅速扩张。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The author uses B as a concrete example of the wider debate over A.</td>\n  <td>作者用B作为围绕A的更大争论的具体例子。</td>\n</tr>\n<tr>\n  <td><strong>文本评论题</strong></td>\n  <td><strong>The text contrasts the former expansion of A with the current attempt to scale it back.</strong></td>\n  <td><strong>文章把A过去的扩张与当前缩减A的尝试进行对比。</strong></td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The article points out that a single decision may change an entire class of practices.</td>\n  <td>文章指出，一项裁决可能改变整整一类做法。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The author attributes the policy shift partly to a broader trend toward B.</td>\n  <td>作者把这项政策转向部分归因于更广泛的B趋势。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The text shows that organizations may adopt A merely as a defensive move against rivals.</td>\n  <td>文章表明，组织可能仅把A作为防范竞争对手的手段。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The article highlights the tension between protecting A and preventing B.</td>\n  <td>文章突出了保护A与防止B之间的张力。</td>\n</tr>\n</tbody>\n</table></div>";

 if(!ctx)return;

   ctx={mode:'image',asset:key,focus:null,sourceW:key==='articleAnnotated'?1080:1354,sourceH:key==='articleAnnotated'?6116:1885};

 const leftScroll=document.getElementById('leftScroll');
 if(ctx.mode==='newtype'){

 const img=document.getElementById('focusImg'), page=document.getElementById('focusPage'), anchor=document.getElementById('focusAnchor');

 const place=()=>{
   if(!Array.isArray(ctx.focus)){leftScroll.scrollTop=0;return;}
   const sourceW=ctx.sourceW||361;

 };
