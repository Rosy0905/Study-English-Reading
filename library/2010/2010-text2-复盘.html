“引入→限制”的动作对照。A所需的语义关系完全缺席。</p></section><section class=\"revealPart\" id=\"focus-q28-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断<code>about-face</code>在第三段第一句中的具体词义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs ... because ... introduced such patents</code>这组前后动作判断。</p>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>A. loss of goodwill<br />\n善意或信誉的丧失</p>\n</blockquote>\n<p>具体比较：主旨中的“威胁”与A都带负面色彩，但颜色相同不等于含义相同。主旨不能判断<code>about-face</code>是否涉及声誉；A的主体、对象和动作均无法从主旨推出。</p>\n<p>最终仍要根据局部结构“<code>Curbs ... because ... introduced</code>”判断：这里是前后做法相反，不是失去<code>goodwill</code>。</p>\n<p><strong>复盘判断：A错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":true},"focusId":"focus-q28-A-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入28题题干：\n\n> 全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断`about-face`在第三段第一句中的具体词义。\n\n本项最终仍要根据`Curbs ... because ... introduced such patents`这组前后动作判断。\n\n但A实际说的是：\n\n> A. loss of goodwill  \n> 善意或信誉的丧失\n\n具体比较：主旨中的“威胁”与A都带负面色彩，但颜色相同不等于含义相同。主旨不能判断`about-face`是否涉及声誉；A的主体、对象和动作均无法从主旨推出。\n\n最终仍要根据局部结构“`Curbs ... because ... introduced`”判断：这里是前后做法相反，不是失去`goodwill`。\n\n**复盘判断：A错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入28题题干：","","> 全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断`about-face`在第三段第一句中的具体词义。","","本项最终仍要根据`Curbs ... because ... introduced such patents`这组前后动作判断。","","但A实际说的是：","","> A. loss of goodwill  ","> 善意或信誉的丧失","","具体比较：主旨中的“威胁”与A都带负面色彩，但颜色相同不等于含义相同。主旨不能判断`about-face`是否涉及声誉；A的主体、对象和动作均无法从主旨推出。","","最终仍要根据局部结构“`Curbs ... because ... introduced`”判断：这里是前后做法相反，不是失去`goodwill`。","","**复盘判断：A错误。**"]},{"title":"B. increase of hostility","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>敌意的增加</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>increase of [xxx]</code>。即使核心名词被遮挡，<code>increase of</code>表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把<code>about-face</code>解释为情绪增加。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>business-method patents, which have been controversial</p>\n<p>Curbs on business-method claims would be a dramatic about-face</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"focusId":"focus-q28-B-0","raw":"### B. increase of hostility\n\n> 敌意的增加\n\n**做题模式中的状态：**选项当时显示为`increase of [xxx]`。即使核心名词被遮挡，`increase of`表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。\n\n**错误类型：第三类——无中生有。**\n\nB抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把`about-face`解释为情绪增加。\n\n**命题人借用的原文材料：**\n\n> business-method patents, which have been controversial\n>\n> Curbs on business-method claims would be a dramatic about-face","lines":["### B. increase of hostility","","> 敌意的增加","","**做题模式中的状态：**选项当时显示为`increase of [xxx]`。即使核心名词被遮挡，`increase of`表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。","","**错误类型：第三类——无中生有。**","","B抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把`about-face`解释为情绪增加。","","**命题人借用的原文材料：**","","> business-method patents, which have been controversial",">","> Curbs on business-method claims would be a dramatic about-face"]},{"title":"B. increase of hostility","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>敌意的增加</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>increase of [xxx]</code>。即使核心名词被遮挡，<code>increase of</code>表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把<code>about-face</code>解释为情绪增加。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>business-method patents, which have been controversial</p>\n<p>Curbs on business-method claims would be a dramatic about-face</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示敌意的增加。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项可见结构<code>increase of hostility</code>。<code>hostility</code>可能让人联想到<code>controversial</code>或结尾的<code>anti-patent trend</code>，但题干指定的是第三段第一句，词义必须由该句的<code>Curbs ... because ... introduced</code>解释。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：同一法院过去引入这类专利，现在若限制它们就形成前后动作反向；句子比较的是立场或做法。</p>\n<p>B中的关系是：B把含义改成某种情绪<code>hostility</code>在程度上增加，要求原文呈现“敌意少→敌意多”的量变。</p>\n<p>具体差异在于：“方向反转”和“程度增加”不是同一种关系。即便文章后来提到反专利趋势，也没有把<code>about-face</code>定义为敌意的上升。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"focusId":"focus-q28-B-1","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第三段第一行的`about-face`表示敌意的增加。\n\n定位时先同时抓住题干中的`about-face`和选项可见结构`increase of hostility`。`hostility`可能让人联想到`controversial`或结尾的`anti-patent trend`，但题干指定的是第三段第一句，词义必须由该句的`Curbs ... because ... introduced`解释。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.\n\n原文中的关系是：同一法院过去引入这类专利，现在若限制它们就形成前后动作反向；句子比较的是立场或做法。\n\nB中的关系是：B把含义改成某种情绪`hostility`在程度上增加，要求原文呈现“敌意少→敌意多”的量变。\n\n具体差异在于：“方向反转”和“程度增加”不是同一种关系。即便文章后来提到反专利趋势，也没有把`about-face`定义为敌意的上升。","lines":["#### 定位比对法","","先把B接回题干，整句话就变成：","","> 第三段第一行的`about-face`表示敌意的增加。","","定位时先同时抓住题干中的`about-face`和选项可见结构`increase of hostility`。`hostility`可能让人联想到`controversial`或结尾的`anti-patent trend`，但题干指定的是第三段第一句，词义必须由该句的`Curbs ... because ... introduced`解释。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.","","原文中的关系是：同一法院过去引入这类专利，现在若限制它们就形成前后动作反向；句子比较的是立场或做法。","","B中的关系是：B把含义改成某种情绪`hostility`在程度上增加，要求原文呈现“敌意少→敌意多”的量变。","","具体差异在于：“方向反转”和“程度增加”不是同一种关系。即便文章后来提到反专利趋势，也没有把`about-face`定义为敌意的上升。"]},{"title":"B. increase of hostility","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>敌意的增加</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>increase of [xxx]</code>。即使核心名词被遮挡，<code>increase of</code>表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把<code>about-face</code>解释为情绪增加。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>business-method patents, which have been controversial</p>\n<p>Curbs on business-method claims would be a dramatic about-face</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示敌意的增加。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项可见结构<code>increase of hostility</code>。<code>hostility</code>可能让人联想到<code>controversial</code>或结尾的<code>anti-patent trend</code>，但题干指定的是第三段第一句，词义必须由该句的<code>Curbs ... because ... introduced</code>解释。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：同一法院过去引入这类专利，现在若限制它们就形成前后动作反向；句子比较的是立场或做法。</p>\n<p>B中的关系是：B把含义改成某种情绪<code>hostility</code>在程度上增加，要求原文呈现“敌意少→敌意多”的量变。</p>\n<p>具体差异在于：“方向反转”和“程度增加”不是同一种关系。即便文章后来提到反专利趋势，也没有把<code>about-face</code>定义为敌意的上升。</p></section><section class=\"revealPart\" id=\"focus-q28-B-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>前后关系是从引入转向限制的方向反转，不是敌意程度逐渐增加。</p>\n</blockquote>\n<p>第三段先用<code>Curbs</code>提出现在的限制方向，再用<code>introduced</code>回看过去的支持方向，作者在两个动作之间建立对照。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Hostility toward business-method patents has steadily increased, and the court has become progressively more antagonistic to patent holders.</p>\n<p>对商业方法专利的敌意不断上升，法院对专利持有人也变得越来越敌对。</p>\n</blockquote>\n<p>假设写法的核心是“越来越敌对”；实际写法的核心是“过去做A、现在转做非A”。B把关系类型从反转换成递增。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"focusId":"focus-q28-B-2","raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.\n>\n> 前后关系是从引入转向限制的方向反转，不是敌意程度逐渐增加。\n\n第三段先用`Curbs`提出现在的限制方向，再用`introduced`回看过去的支持方向，作者在两个动作之间建立对照。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Hostility toward business-method patents has steadily increased, and the court has become progressively more antagonistic to patent holders.\n>\n> 对商业方法专利的敌意不断上升，法院对专利持有人也变得越来越敌对。\n\n假设写法的核心是“越来越敌对”；实际写法的核心是“过去做A、现在转做非A”。B把关系类型从反转换成递增。","lines":["#### 写作视角法","","原文第3段是这样写的：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.",">","> 前后关系是从引入转向限制的方向反转，不是敌意程度逐渐增加。","","第三段先用`Curbs`提出现在的限制方向，再用`introduced`回看过去的支持方向，作者在两个动作之间建立对照。","","如果B真是作者的意思，文章至少得写成：","","> Hostility toward business-method patents has steadily increased, and the court has become progressively more antagonistic to patent holders.",">","> 对商业方法专利的敌意不断上升，法院对专利持有人也变得越来越敌对。","","假设写法的核心是“越来越敌对”；实际写法的核心是“过去做A、现在转做非A”。B把关系类型从反转换成递增。"]},{"title":"B. increase of hostility","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>敌意的增加</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>increase of [xxx]</code>。即使核心名词被遮挡，<code>increase of</code>表达的是某种数量或程度上升；而上下文写的是同一法院从“引入”转向“限制”，因此B被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住了全文中的争议和反专利背景，所以“敌意增加”听起来似乎有些气氛上的依据。原文写的是法院前后动作发生反转，B却写成敌意程度上升。原文没有把<code>about-face</code>解释为情绪增加。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>business-method patents, which have been controversial</p>\n<p>Curbs on business-method claims would be a dramatic about-face</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示敌意的增加。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项可见结构<code>increase of hostility</code>。<code>hostility</code>可能让人联想到<code>controversial</code>或结尾的<code>anti-patent trend</code>，但题干指定的是第三段第一句，词义必须由该句的<code>Curbs ... because ... introduced</code>解释。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：同一法院过去引入这类专利，现在若限制它们就形成前后动作反向；句子比较的是立场或做法。</p>\n<p>B中的关系是：B把含义改成某种情绪<code>hostility</code>在程度上增加，要求原文呈现“敌意少→敌意多”的量变。</p>\n<p>具体差异在于：“方向反转”和“程度增加”不是同一种关系。即便文章后来提到反专利趋势，也没有把<code>about-face</code>定义为敌意的上升。</p></section><section class=\"revealPart\" id=\"focus-q28-B-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>前后关系是从引入转向限制的方向反转，不是敌意程度逐渐增加。</p>\n</blockquote>\n<p>第三段先用<code>Curbs</code>提出现在的限制方向，再用<code>introduced</code>回看过去的支持方向，作者在两个动作之间建立对照。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Hostility toward business-method patents has steadily increased, and the court has become progressively more antagonistic to patent holders.</p>\n<p>对商业方法专利的敌意不断上升，法院对专利持有人也变得越来越敌对。</p>\n</blockquote>\n<p>假设写法的核心是“越来越敌对”；实际写法的核心是“过去做A、现在转做非A”。B把关系类型从反转换成递增。</p></section><section class=\"revealPart\" id=\"focus-q28-B-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断<code>about-face</code>在第三段第一句中的具体词义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs</code>与<code>introduced</code>构成的动作对照判断。</p>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>B. increase of hostility<br />\n敌意的增加</p>\n</blockquote>\n<p>具体比较：B与主旨在负面方向上表面相容，但主旨没有提供“increase”的程度轴，也没有把法院态度写成<code>hostility</code>。范围和语义关系不足以支持B。</p>\n<p>局部<code>because</code>从句明确给出前后动作对照，因此最终应按“转向”而不是“敌意增加”理解。</p>\n<p><strong>复盘判断：B错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":true},"focusId":"focus-q28-B-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入28题题干：\n\n> 全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断`about-face`在第三段第一句中的具体词义。\n\n本项最终仍要根据`Curbs`与`introduced`构成的动作对照判断。\n\n但B实际说的是：\n\n> B. increase of hostility  \n> 敌意的增加\n\n具体比较：B与主旨在负面方向上表面相容，但主旨没有提供“increase”的程度轴，也没有把法院态度写成`hostility`。范围和语义关系不足以支持B。\n\n局部`because`从句明确给出前后动作对照，因此最终应按“转向”而不是“敌意增加”理解。\n\n**复盘判断：B错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入28题题干：","","> 全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断`about-face`在第三段第一句中的具体词义。","","本项最终仍要根据`Curbs`与`introduced`构成的动作对照判断。","","但B实际说的是：","","> B. increase of hostility  ","> 敌意的增加","","具体比较：B与主旨在负面方向上表面相容，但主旨没有提供“increase”的程度轴，也没有把法院态度写成`hostility`。范围和语义关系不足以支持B。","","局部`because`从句明确给出前后动作对照，因此最终应按“转向”而不是“敌意增加”理解。","","**复盘判断：B错误。**"]},{"title":"C. change of attitude","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>态度或立场的改变</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。<code>because</code>后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>C抓住了原文中同一主体的前后反向动作。原文写法院过去<code>introduced</code>这类专利，现在若<code>Curbs</code>它们就构成<code>about-face</code>；C把这种行动方向的反转概括成“态度或立场的改变”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false},"focusId":"focus-q28-C-0","raw":"### C. change of attitude\n\n> 态度或立场的改变\n\n**做题模式中的状态：**当时选项完整可见。`because`后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。\n\n**选项类型：正确的同义改写。**\n\nC抓住了原文中同一主体的前后反向动作。原文写法院过去`introduced`这类专利，现在若`Curbs`它们就构成`about-face`；C把这种行动方向的反转概括成“态度或立场的改变”。\n\n**出处：**\n\n> Curbs on business-method claims would be a dramatic about-face,\n>\n> because it was the Federal Circuit itself that introduced such patents","lines":["### C. change of attitude","","> 态度或立场的改变","","**做题模式中的状态：**当时选项完整可见。`because`后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。","","**选项类型：正确的同义改写。**","","C抓住了原文中同一主体的前后反向动作。原文写法院过去`introduced`这类专利，现在若`Curbs`它们就构成`about-face`；C把这种行动方向的反转概括成“态度或立场的改变”。","","**出处：**","","> Curbs on business-method claims would be a dramatic about-face,",">","> because it was the Federal Circuit itself that introduced such patents"]},{"title":"C. change of attitude","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>态度或立场的改变</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。<code>because</code>后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>C抓住了原文中同一主体的前后反向动作。原文写法院过去<code>introduced</code>这类专利，现在若<code>Curbs</code>它们就构成<code>about-face</code>；C把这种行动方向的反转概括成“态度或立场的改变”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示态度或立场的改变。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>以及解释句中的<code>Curbs</code>和<code>introduced</code>。同一主体Federal Circuit先后对应两个方向相反的动作，<code>because</code>把这一对照直接作为词义线索。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit；过去立场通过<code>introduced such patents</code>体现，现在的新立场通过<code>Curbs</code>体现；两者对象相同而动作方向相反。</p>\n<p>C中的关系是：C把同一主体前后行动方向的反转概括成<code>change of attitude</code>，没有增加新的主体、对象或程度。</p>\n<p>具体差异在于：原文写行为层面的转向，C用态度层面的概括表达同一关系。这里属于语境同义改写，而不是改变原意。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false},"focusId":"focus-q28-C-1","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第三段第一行的`about-face`表示态度或立场的改变。\n\n定位时先同时抓住题干中的`about-face`以及解释句中的`Curbs`和`introduced`。同一主体Federal Circuit先后对应两个方向相反的动作，`because`把这一对照直接作为词义线索。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision.\n\n原文中的关系是：主体是Federal Circuit；过去立场通过`introduced such patents`体现，现在的新立场通过`Curbs`体现；两者对象相同而动作方向相反。\n\nC中的关系是：C把同一主体前后行动方向的反转概括成`change of attitude`，没有增加新的主体、对象或程度。\n\n具体差异在于：原文写行为层面的转向，C用态度层面的概括表达同一关系。这里属于语境同义改写，而不是改变原意。","lines":["#### 定位比对法","","先把C接回题干，整句话就变成：","","> 第三段第一行的`about-face`表示态度或立场的改变。","","定位时先同时抓住题干中的`about-face`以及解释句中的`Curbs`和`introduced`。同一主体Federal Circuit先后对应两个方向相反的动作，`because`把这一对照直接作为词义线索。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision.","","原文中的关系是：主体是Federal Circuit；过去立场通过`introduced such patents`体现，现在的新立场通过`Curbs`体现；两者对象相同而动作方向相反。","","C中的关系是：C把同一主体前后行动方向的反转概括成`change of attitude`，没有增加新的主体、对象或程度。","","具体差异在于：原文写行为层面的转向，C用态度层面的概括表达同一关系。这里属于语境同义改写，而不是改变原意。"]},{"title":"C. change of attitude","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>态度或立场的改变</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。<code>because</code>后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>C抓住了原文中同一主体的前后反向动作。原文写法院过去<code>introduced</code>这类专利，现在若<code>Curbs</code>它们就构成<code>about-face</code>；C把这种行动方向的反转概括成“态度或立场的改变”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示态度或立场的改变。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>以及解释句中的<code>Curbs</code>和<code>introduced</code>。同一主体Federal Circuit先后对应两个方向相反的动作，<code>because</code>把这一对照直接作为词义线索。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit；过去立场通过<code>introduced such patents</code>体现，现在的新立场通过<code>Curbs</code>体现；两者对象相同而动作方向相反。</p>\n<p>C中的关系是：C把同一主体前后行动方向的反转概括成<code>change of attitude</code>，没有增加新的主体、对象或程度。</p>\n<p>具体差异在于：原文写行为层面的转向，C用态度层面的概括表达同一关系。这里属于语境同义改写，而不是改变原意。</p></section><section class=\"revealPart\" id=\"focus-q28-C-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>同一主体在同一对象上的做法从引入转为限制，正是态度或立场发生改变。</p>\n</blockquote>\n<p>作者明确把“现在可能限制”与“过去亲自引入”并置，随后整段继续回顾旧裁决如何推动专利扩张，强化这次转向幅度很大。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Having once introduced business-method patents, the Federal Circuit is now prepared to curb them; this reversal marks a change in its position.</p>\n<p>联邦巡回法院过去曾引入商业方法专利，如今却准备限制它们；这种反转标志着其立场发生变化。</p>\n</blockquote>\n<p>假设写法只把原文隐含的“立场变化”说得更直白，前后动作和对象与原文完全一致。C所需的写法正是文章已有推进。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false},"focusId":"focus-q28-C-2","raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.\n>\n> 同一主体在同一对象上的做法从引入转为限制，正是态度或立场发生改变。\n\n作者明确把“现在可能限制”与“过去亲自引入”并置，随后整段继续回顾旧裁决如何推动专利扩张，强化这次转向幅度很大。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Having once introduced business-method patents, the Federal Circuit is now prepared to curb them; this reversal marks a change in its position.\n>\n> 联邦巡回法院过去曾引入商业方法专利，如今却准备限制它们；这种反转标志着其立场发生变化。\n\n假设写法只把原文隐含的“立场变化”说得更直白，前后动作和对象与原文完全一致。C所需的写法正是文章已有推进。","lines":["#### 写作视角法","","原文第3段是这样写的：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.",">","> 同一主体在同一对象上的做法从引入转为限制，正是态度或立场发生改变。","","作者明确把“现在可能限制”与“过去亲自引入”并置，随后整段继续回顾旧裁决如何推动专利扩张，强化这次转向幅度很大。","","如果C真是作者的意思，文章至少得写成：","","> Having once introduced business-method patents, the Federal Circuit is now prepared to curb them; this reversal marks a change in its position.",">","> 联邦巡回法院过去曾引入商业方法专利，如今却准备限制它们；这种反转标志着其立场发生变化。","","假设写法只把原文隐含的“立场变化”说得更直白，前后动作和对象与原文完全一致。C所需的写法正是文章已有推进。"]},{"title":"C. change of attitude","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>态度或立场的改变</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。<code>because</code>后的解释表明：同一法院过去引入这类专利，现在却可能限制它们，前后立场发生变化，因此C被保留并成为本题结果。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>C抓住了原文中同一主体的前后反向动作。原文写法院过去<code>introduced</code>这类专利，现在若<code>Curbs</code>它们就构成<code>about-face</code>；C把这种行动方向的反转概括成“态度或立场的改变”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face,</p>\n<p>because it was the Federal Circuit itself that introduced such patents</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示态度或立场的改变。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>以及解释句中的<code>Curbs</code>和<code>introduced</code>。同一主体Federal Circuit先后对应两个方向相反的动作，<code>because</code>把这一对照直接作为词义线索。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit；过去立场通过<code>introduced such patents</code>体现，现在的新立场通过<code>Curbs</code>体现；两者对象相同而动作方向相反。</p>\n<p>C中的关系是：C把同一主体前后行动方向的反转概括成<code>change of attitude</code>，没有增加新的主体、对象或程度。</p>\n<p>具体差异在于：原文写行为层面的转向，C用态度层面的概括表达同一关系。这里属于语境同义改写，而不是改变原意。</p></section><section class=\"revealPart\" id=\"focus-q28-C-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>同一主体在同一对象上的做法从引入转为限制，正是态度或立场发生改变。</p>\n</blockquote>\n<p>作者明确把“现在可能限制”与“过去亲自引入”并置，随后整段继续回顾旧裁决如何推动专利扩张，强化这次转向幅度很大。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Having once introduced business-method patents, the Federal Circuit is now prepared to curb them; this reversal marks a change in its position.</p>\n<p>联邦巡回法院过去曾引入商业方法专利，如今却准备限制它们；这种反转标志着其立场发生变化。</p>\n</blockquote>\n<p>假设写法只把原文隐含的“立场变化”说得更直白，前后动作和对象与原文完全一致。C所需的写法正是文章已有推进。</p></section><section class=\"revealPart\" id=\"focus-q28-C-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认商业方法专利从过去扩张转向现在面临收紧，不能单独确定<code>about-face</code>的准确释义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs</code>与<code>introduced</code>构成的动作对照判断。</p>\n<p>C实际说的是：</p>\n<blockquote>\n<p>C. change of attitude<br />\n态度或立场的改变</p>\n</blockquote>\n<p>具体比较：主旨中的整体方向是“过去广泛存在→现在面临收紧”，C的动作关系也是前后立场改变；主体、对象和方向能够接上。</p>\n<p>局部的<code>Curbs</code>与<code>introduced</code>构成直接反义动作对照，完整支持<code>change of attitude</code>。</p>\n<p><strong>复盘判断：C正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":true},"focusId":"focus-q28-C-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入28题题干：\n\n> 全文主旨只能确认商业方法专利从过去扩张转向现在面临收紧，不能单独确定`about-face`的准确释义。\n\n本项最终仍要根据`Curbs`与`introduced`构成的动作对照判断。\n\nC实际说的是：\n\n> C. change of attitude  \n> 态度或立场的改变\n\n具体比较：主旨中的整体方向是“过去广泛存在→现在面临收紧”，C的动作关系也是前后立场改变；主体、对象和方向能够接上。\n\n局部的`Curbs`与`introduced`构成直接反义动作对照，完整支持`change of attitude`。\n\n**复盘判断：C正确。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入28题题干：","","> 全文主旨只能确认商业方法专利从过去扩张转向现在面临收紧，不能单独确定`about-face`的准确释义。","","本项最终仍要根据`Curbs`与`introduced`构成的动作对照判断。","","C实际说的是：","","> C. change of attitude  ","> 态度或立场的改变","","具体比较：主旨中的整体方向是“过去广泛存在→现在面临收紧”，C的动作关系也是前后立场改变；主体、对象和方向能够接上。","","局部的`Curbs`与`introduced`构成直接反义动作对照，完整支持`change of attitude`。","","**复盘判断：C正确。**"]},{"title":"D. enhancement of dignity","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>尊严或地位的提升</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，<code>dramatic</code>也只表示转变幅度大，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了<code>dramatic</code>的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false},"focusId":"focus-q28-D-0","raw":"### D. enhancement of dignity\n\n> 尊严或地位的提升\n\n**做题模式中的状态：**当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，`dramatic`也只表示转变幅度大，因此D被排除。\n\n**错误类型：第三类——无中生有。**\n\nD抓住了`dramatic`的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。\n\n**命题人借用的原文材料：**\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.","lines":["### D. enhancement of dignity","","> 尊严或地位的提升","","**做题模式中的状态：**当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，`dramatic`也只表示转变幅度大，因此D被排除。","","**错误类型：第三类——无中生有。**","","D抓住了`dramatic`的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。","","**命题人借用的原文材料：**","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents."]},{"title":"D. enhancement of dignity","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>尊严或地位的提升</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，<code>dramatic</code>也只表示转变幅度大，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了<code>dramatic</code>的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示尊严或地位的提升。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项中的<code>enhancement of dignity</code>。<code>dramatic</code>只说明变化显著，不能直接定位到<code>dignity</code>；真正的解释仍在<code>because</code>后的旧动作<code>introduced</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit，句子比较它过去引入与现在限制同一类专利的动作方向；没有出现机构地位、尊严或声望。</p>\n<p>D中的关系是：D设置的动作是<code>enhancement</code>，对象是<code>dignity</code>，需要原文写某种价值或地位得到提升。</p>\n<p>具体差异在于：D把“做法转向”改成“地位提升”。<code>dramatic</code>修饰转向的幅度，并不提供正面评价，更不能补出<code>dignity</code>。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false},"focusId":"focus-q28-D-1","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第三段第一行的`about-face`表示尊严或地位的提升。\n\n定位时先同时抓住题干中的`about-face`和选项中的`enhancement of dignity`。`dramatic`只说明变化显著，不能直接定位到`dignity`；真正的解释仍在`because`后的旧动作`introduced`。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.\n\n原文中的关系是：主体是Federal Circuit，句子比较它过去引入与现在限制同一类专利的动作方向；没有出现机构地位、尊严或声望。\n\nD中的关系是：D设置的动作是`enhancement`，对象是`dignity`，需要原文写某种价值或地位得到提升。\n\n具体差异在于：D把“做法转向”改成“地位提升”。`dramatic`修饰转向的幅度，并不提供正面评价，更不能补出`dignity`。","lines":["#### 定位比对法","","先把D接回题干，整句话就变成：","","> 第三段第一行的`about-face`表示尊严或地位的提升。","","定位时先同时抓住题干中的`about-face`和选项中的`enhancement of dignity`。`dramatic`只说明变化显著，不能直接定位到`dignity`；真正的解释仍在`because`后的旧动作`introduced`。","","回看第一层已经列出的出处，再把完成判断所需的原文连起来：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.","","原文中的关系是：主体是Federal Circuit，句子比较它过去引入与现在限制同一类专利的动作方向；没有出现机构地位、尊严或声望。","","D中的关系是：D设置的动作是`enhancement`，对象是`dignity`，需要原文写某种价值或地位得到提升。","","具体差异在于：D把“做法转向”改成“地位提升”。`dramatic`修饰转向的幅度，并不提供正面评价，更不能补出`dignity`。"]},{"title":"D. enhancement of dignity","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>尊严或地位的提升</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，<code>dramatic</code>也只表示转变幅度大，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了<code>dramatic</code>的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示尊严或地位的提升。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项中的<code>enhancement of dignity</code>。<code>dramatic</code>只说明变化显著，不能直接定位到<code>dignity</code>；真正的解释仍在<code>because</code>后的旧动作<code>introduced</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit，句子比较它过去引入与现在限制同一类专利的动作方向；没有出现机构地位、尊严或声望。</p>\n<p>D中的关系是：D设置的动作是<code>enhancement</code>，对象是<code>dignity</code>，需要原文写某种价值或地位得到提升。</p>\n<p>具体差异在于：D把“做法转向”改成“地位提升”。<code>dramatic</code>修饰转向的幅度，并不提供正面评价，更不能补出<code>dignity</code>。</p></section><section class=\"revealPart\" id=\"focus-q28-D-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>句子说明的是政策动作反转，没有评价法院的尊严、地位或声望。</p>\n</blockquote>\n<p>文章把焦点放在法院政策前后不一致以及旧裁决带来的专利扩张，没有讨论法院因此获得更高尊严。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By curbing these patents, the court would enhance its dignity and strengthen its institutional standing.</p>\n<p>通过限制这些专利，法院将提升自身尊严并巩固其制度地位。</p>\n</blockquote>\n<p>假设写法新增了正面评价和地位结果；实际句子只说明前后行动反转。D所需的对象与结果都不存在。</p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false},"focusId":"focus-q28-D-2","raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.\n>\n> 句子说明的是政策动作反转，没有评价法院的尊严、地位或声望。\n\n文章把焦点放在法院政策前后不一致以及旧裁决带来的专利扩张，没有讨论法院因此获得更高尊严。\n\n如果D真是作者的意思，文章至少得写成：\n\n> By curbing these patents, the court would enhance its dignity and strengthen its institutional standing.\n>\n> 通过限制这些专利，法院将提升自身尊严并巩固其制度地位。\n\n假设写法新增了正面评价和地位结果；实际句子只说明前后行动反转。D所需的对象与结果都不存在。","lines":["#### 写作视角法","","原文第3段是这样写的：","","> Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.",">","> 句子说明的是政策动作反转，没有评价法院的尊严、地位或声望。","","文章把焦点放在法院政策前后不一致以及旧裁决带来的专利扩张，没有讨论法院因此获得更高尊严。","","如果D真是作者的意思，文章至少得写成：","","> By curbing these patents, the court would enhance its dignity and strengthen its institutional standing.",">","> 通过限制这些专利，法院将提升自身尊严并巩固其制度地位。","","假设写法新增了正面评价和地位结果；实际句子只说明前后行动反转。D所需的对象与结果都不存在。"]},{"title":"D. enhancement of dignity","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>尊严或地位的提升</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。上下文没有写法院的尊严、地位或声望得到提升，<code>dramatic</code>也只表示转变幅度大，因此D被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D抓住了<code>dramatic</code>的强烈语气，所以可能让人误以为是某种显著提升。原文写的是法院前后做法相反，D却补出尊严或地位上升。原文没有这项评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q28-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段第一行的<code>about-face</code>表示尊严或地位的提升。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>about-face</code>和选项中的<code>enhancement of dignity</code>。<code>dramatic</code>只说明变化显著，不能直接定位到<code>dignity</code>；真正的解释仍在<code>because</code>后的旧动作<code>introduced</code>。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents.</p>\n</blockquote>\n<p>原文中的关系是：主体是Federal Circuit，句子比较它过去引入与现在限制同一类专利的动作方向；没有出现机构地位、尊严或声望。</p>\n<p>D中的关系是：D设置的动作是<code>enhancement</code>，对象是<code>dignity</code>，需要原文写某种价值或地位得到提升。</p>\n<p>具体差异在于：D把“做法转向”改成“地位提升”。<code>dramatic</code>修饰转向的幅度，并不提供正面评价，更不能补出<code>dignity</code>。</p></section><section class=\"revealPart\" id=\"focus-q28-D-2\"><h3>写作视角法</h3><p>原文第3段是这样写的：</p>\n<blockquote>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.</p>\n<p>句子说明的是政策动作反转，没有评价法院的尊严、地位或声望。</p>\n</blockquote>\n<p>文章把焦点放在法院政策前后不一致以及旧裁决带来的专利扩张，没有讨论法院因此获得更高尊严。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By curbing these patents, the court would enhance its dignity and strengthen its institutional standing.</p>\n<p>通过限制这些专利，法院将提升自身尊严并巩固其制度地位。</p>\n</blockquote>\n<p>假设写法新增了正面评价和地位结果；实际句子只说明前后行动反转。D所需的对象与结果都不存在。</p></section><section class=\"revealPart\" id=\"focus-q28-D-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>A looming threat to business-method patents.<br />\n商业方法专利面临的一场迫近威胁。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断<code>about-face</code>在第三段第一句中的具体词义。</p>\n</blockquote>\n<p>本项最终仍要根据<code>Curbs ... because ... introduced such patents</code>这处局部原文判断。</p>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>D. enhancement of dignity<br />\n尊严或地位的提升</p>\n</blockquote>\n<p>具体比较：主旨的对象是专利制度，方向是收紧；D的对象是法院尊严，方向是提升。对象和评价方向都换了。</p>\n<p>局部原文没有任何地位或声誉词，<code>about-face</code>只能从<code>Curbs</code>与<code>introduced</code>的动作对照中解释。</p>\n<p><strong>复盘判断：D错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":true},"focusId":"focus-q28-D-3","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A looming threat to business-method patents.  \n> 商业方法专利面临的一场迫近威胁。\n\n把这个主旨直接代入28题题干：\n\n> 全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断`about-face`在第三段第一句中的具体词义。\n\n本项最终仍要根据`Curbs ... because ... introduced such patents`这处局部原文判断。\n\n但D实际说的是：\n\n> D. enhancement of dignity  \n> 尊严或地位的提升\n\n具体比较：主旨的对象是专利制度，方向是收紧；D的对象是法院尊严，方向是提升。对象和评价方向都换了。\n\n局部原文没有任何地位或声誉词，`about-face`只能从`Curbs`与`introduced`的动作对照中解释。\n\n**复盘判断：D错误。**","lines":["#### 主旨交叉验证法","","30题的正确答案是：","","> A looming threat to business-method patents.  ","> 商业方法专利面临的一场迫近威胁。","","把这个主旨直接代入28题题干：","","> 全文主旨只能确认法院对商业方法专利的方向正在转向收紧，不能判断`about-face`在第三段第一句中的具体词义。","","本项最终仍要根据`Curbs ... because ... introduced such patents`这处局部原文判断。","","但D实际说的是：","","> D. enhancement of dignity  ","> 尊严或地位的提升","","具体比较：主旨的对象是专利制度，方向是收紧；D的对象是法院尊严，方向是提升。对象和评价方向都换了。","","局部原文没有任何地位或声誉词，`about-face`只能从`Curbs`与`introduced`的动作对照中解释。","","**复盘判断：D错误。**"]},{"title":"28题结论","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p><strong>28. C. change of attitude</strong></p>\n</blockquote>\n<ul>\n<li>A把行动方向变化改成信誉损失；</li>\n<li>B借用负面背景，却把前后反转改成敌意程度增加；</li>\n<li>C用“态度改变”概括同一法院从引入到限制的转向；</li>\n<li>D把变化幅度大误写成尊严或地位提升。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"28题","focus":[0,665,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"conclusion","question":"28","questionConclusion":true}},{"title":"29题 · 题干、题型与核心出处","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p>We learn from the last two paragraphs that business-method patents ______.<br />\n从最后两段可以知道，商业方法专利怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道局部推断题，范围被限定在最后两段。先列出旧裁决可能被重新考虑、专利保护范围收窄以及“太多显而易见的发明仍获专利支持”这几项明示事实，再作最小限度的推断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>one issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.</p>\n<p>Last April, for example, the justices signaled that too many patents were being upheld for &quot;inventions&quot; that are obvious.</p>\n</blockquote>\n<p>题干把范围锁定在最后两段。第四段写旧裁决可能被重新考虑，第五段写最高法院已经缩小专利保护范围，并认为太多显而易见的“发明”仍被维持为专利。需要从这些明示事实作最小限度的概括。</p>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"question","question":"29","questionIntro":true}},{"title":"A. are immune to legal challenges","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-A-0\"><blockquote>\n<p>不受法律挑战影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。最后两段恰好写法院要重新考虑旧裁决、最高法院也在缩小保护范围，这说明相关专利正在受到法律挑战；A的方向相反，因此被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住了法院、裁决和专利保护这些法律场景，所以形式上与原文接近。原文写的是相关规则正在被重新审视、保护范围正在收窄，A却写成商业方法专利不受法律挑战。真正变化的是挑战是否存在这一方向。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n<p>a series of recent decisions ... has narrowed the scope of protections for patent holders</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false},"focusId":"focus-q29-A-0","raw":"### A. are immune to legal challenges\n\n> 不受法律挑战影响\n\n**做题模式中的状态：**当时选项完整可见。最后两段恰好写法院要重新考虑旧裁决、最高法院也在缩小保护范围，这说明相关专利正在受到法律挑战；A的方向相反，因此被排除。\n\n**错误类型：第一类——歪曲原意。**\n\nA抓住了法院、裁决和专利保护这些法律场景，所以形式上与原文接近。原文写的是相关规则正在被重新审视、保护范围正在收窄，A却写成商业方法专利不受法律挑战。真正变化的是挑战是否存在这一方向。\n\n**命题人借用的原文材料：**\n\n> whether it should \"reconsider\" its State Street Bank ruling\n>\n> a series of recent decisions ... has narrowed the scope of protections for patent holders","lines":["### A. are immune to legal challenges","","> 不受法律挑战影响","","**做题模式中的状态：**当时选项完整可见。最后两段恰好写法院要重新考虑旧裁决、最高法院也在缩小保护范围，这说明相关专利正在受到法律挑战；A的方向相反，因此被排除。","","**错误类型：第一类——歪曲原意。**","","A抓住了法院、裁决和专利保护这些法律场景，所以形式上与原文接近。原文写的是相关规则正在被重新审视、保护范围正在收窄，A却写成商业方法专利不受法律挑战。真正变化的是挑战是否存在这一方向。","","**命题人借用的原文材料：**","","> whether it should \"reconsider\" its State Street Bank ruling",">","> a series of recent decisions ... has narrowed the scope of protections for patent holders"]},{"title":"A. are immune to legal challenges","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-A-0\"><blockquote>\n<p>不受法律挑战影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时选项完整可见。最后两段恰好写法院要重新考虑旧裁决、最高法院也在缩小保护范围，这说明相关专利正在受到法律挑战；A的方向相反，因此被排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住了法院、裁决和专利保护这些法律场景，所以形式上与原文接近。原文写的是相关规则正在被重新审视、保护范围正在收窄，A却写成商业方法专利不受法律挑战。真正变化的是挑战是否存在这一方向。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>whether it should &quot;reconsider&quot; its State Street Bank ruling</p>\n<p>a series of recent decisions ... has narrowed the scope of protections for patent holders</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q29-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从最后两段可以知道，商业方法专利不受法律挑战影响。</p>\n</blockquote>\n<p>定位时先同时抓住题干的范围限制<code>the last two paragraphs</code>和选项中的<code>immune to legal challenges</code>。最后两段必须整体读取：第四段写法院可能重新考虑旧裁决，第五段写最高法院已缩小专利保护范围。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>One issue it wants to evaluate is whether it should &quot;reconsider&quot; its State Street Bank ruling.</p>\n<p>A series of recent decisions by the Supreme Court has narrowed the scope of protections for patent holders.</p>\n</blockquote>\n<p>原文中的关系是：法律主体是Federal Circuit和Supreme Court；动作是重新考虑旧裁决、缩小保护范围；对象是商业方法专利规则及专利持有人保护，说明挑战正在发生。</p>\n<p>A中的关系是：主体是商业方法专利，谓语<code>are immune to</code>断言它们不会受到法律挑战，范围是绝对免疫。</p>\n<p>具体差异在于：A把“正在被两级法院重新审视和收紧”改成“完全不受挑战”，方向直接反转；<code>immune</code>还把程度绝对化。</p></section>","context":{"mode":"image","asset":"questions","label":"29题","focus":[0,995,1354,355],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false},"focusId":"focus-q29-A-1","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成
