<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img alt=\"重点词语境标注示例\" class=\"embedded-asset\" data-asset=\"method_vocab_example\"/><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img alt=\"意群法示例\" class=\"embedded-asset\" data-asset=\"method_intent_example\"/><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img alt=\"新题型考纲总览\" class=\"embedded-asset\" data-asset=\"method_newtype_overview\"/><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img alt=\"新题型考纲表格\" class=\"embedded-asset\" data-asset=\"method_newtype_table\"/><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img alt=\"七选五题型说明\" class=\"embedded-asset\" data-asset=\"method_cloze_intro\"/><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img alt=\"小标题题考点\" class=\"embedded-asset\" data-asset=\"method_smalltitle\"/><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img alt=\"排序题考点\" class=\"embedded-asset\" data-asset=\"method_sorting\"/><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img alt=\"匹配题考点\" class=\"embedded-asset\" data-asset=\"method_matching\"/><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr/>\n<hr/>","context":null},{"title":"第1段","level":1,"section":"第一鸟 · 词汇","html":"<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>over the past decade</td>\n<td>在过去十年里</td>\n<td>thousands of</td>\n<td>数千；成千上万的</td>\n<td>patent</td>\n<td>n. 专利</td>\n</tr>\n<tr>\n<td>be granted for</td>\n<td>因……而获授；被授予给</td>\n<td>what are called</td>\n<td>所谓的</td>\n<td>business method</td>\n<td>商业方法</td>\n</tr>\n<tr>\n<td>receive</td>\n<td>v. 获得</td>\n<td>one-click</td>\n<td>a. 一键式的</td>\n<td>online payment system</td>\n<td>在线支付系统</td>\n</tr>\n<tr>\n<td>legal protection</td>\n<td>法律保护</td>\n<td>asset allocation strategy</td>\n<td>资产配置策略</td>\n<td>inventor</td>\n<td>n. 发明者</td>\n</tr>\n<tr>\n<td>patent a technique</td>\n<td>为一项技术申请专利</td>\n<td>lift a box</td>\n<td>抬起箱子</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[80,135,920,425],"sourceW":1080,"sourceH":6116,"inclu -paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its \"one-click\" online payment system. Merrill Lynch got legal protection for an asset allocation strategy. One inventor patented a technique for lifting a box.</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[80,135,920,425],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-0"},{"title":"第1段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its \"one-click\" online payment system. Merrill Lynch got legal protection for an asset allocation strategy. One inventor patented a technique for lifting a box.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Over the past decade, / thousands of patents / have been granted / for what are called / business methods.</p>\n<p>Amazon.com received one / for its \"one-click\" / online payment system.</p>\n<p>Merrill Lynch / got legal protection / for an asset allocation strategy.</p>\n<p>One inventor / patented a technique / for lifting a box.</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[80,135,920,425],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-1"},{"title":"第1段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its \"one-click\" online payment system. Merrill Lynch got legal protection for an asset allocation strategy. One inventor patented a technique for lifting a box.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Over the past decade, / thousands of patents / have been granted / for what are called / business methods.</p>\n<p>Amazon.com received one / for its \"one-click\" / online payment system.</p>\n<p>Merrill Lynch / got legal protection / for an asset allocation strategy.</p>\n<p>One inventor / patented a technique / for lifting a box.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3>\n<p>在过去十年里，/ 数千项专利 / 已经被授予 / 对于所谓的 / 商业方法。</p>\n<p>亚马逊获得了一项 / 为其\"一键式\" / 在线支付系统。</p>\n<p>美林证券 / 获得了法律保护 / 为一项资产配置策略。</p>\n<p>一位发明者 / 获得了一项技术专利 / 用于抬起箱子。</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[80,135,920,425],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-2"},{"title":"第1段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Over the past decade, thousands of patents have been granted for what are called business methods. Amazon.com received one for its \"one-click\" online payment system. Merrill Lynch got legal protection for an asset allocation strategy. One inventor patented a technique for lifting a box.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Over the past decade, / thousands of patents / have been granted / for what are called / business methods.</p>\n<p>Amazon.com received one / for its \"one-click\" / online payment system.</p>\n<p>Merrill Lynch / got legal protection / for an asset allocation strategy.</p>\n<p>One inventor / patented a technique / for lifting a box.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3>\n<p>在过去十年里，/ 数千项专利 / 已经被授予 / 对于所谓的 / 商业方法。</p>\n<p>亚马逊获得了一项 / 为其\"一键式\" / 在线支付系统。</p>\n<p>美林证券 / 获得了法律保护 / 为一项资产配置策略。</p>\n<p>一位发明者 / 获得了一项技术专利 / 用于抬起箱子。</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段</h3>\n<p>在过去十年里，数千项所谓的商业方法专利已经被授予。亚马逊为其\"一键式\"在线支付系统获得了专利。美林证券为一项资产配置策略获得了法律保护。甚至有一位发明者为抬起箱子的技术申请了专利。</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[80,135,920,425],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true},"focusId":"focus-paragraph-1-3"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is \"a very big deal,\" says Dennis D. Crouch of the University of Missouri School of Law. It \"has the potential to eliminate an entire class of patents.\"</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,570,920,780],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is \"a very big deal,\" says Dennis D. Crouch of the University of Missouri School of Law. It \"has the potential to eliminate an entire class of patents.\"</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n<p>In a move / that has intellectual-property lawyers abuzz, / the U.S. Court of Appeals / for the Federal Circuit / said it would use / a particular case / to conduct a broad review / of business-method patents.</p>\n<p>In re Bilski, / as the case is known, / is \"a very big deal,\" / says Dennis D. Crouch / of the University of Missouri School of Law.</p>\n<p>It \"has the potential / to eliminate / an entire class of patents.\"</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,570,920,780],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-1"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is \"a very big deal,\" says Dennis D. Crouch of the University of Missouri School of Law. It \"has the potential to eliminate an entire class of patents.\"</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n<p>In a move / that has intellectual-property lawyers abuzz, / the U.S. Court of Appeals / for the Federal Circuit / said it would use / a particular case / to conduct a broad review / of business-method patents.</p>\n<p>In re Bilski, / as the case is known, / is \"a very big deal,\" / says Dennis D. Crouch / of the University of Missouri School of Law.</p>\n<p>It \"has the potential / to eliminate / an entire class of patents.\"</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>现在国家最高专利法院 / 看起来完全准备好 / 缩减 / 商业方法专利，/ 这些专利一直存在争议 / 自从它们首次被授权 / 10年前。</p>\n<p>在一个举动中 / 让知识产权律师们议论纷纷的，/ 美国上诉法院 / 联邦巡回法院的 / 说它将使用 / 一个特定案件 / 进行广泛审查 / 对商业方法专利。</p>\n<p>In re Bilski案，/ 正如该案为人所知，/ 是\"一件大事\"，/ 丹尼斯·D·克劳奇说 / 密苏里大学法学院的。</p>\n<p>它\"有潜力 / 消除 / 整个类别的专利。\"</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,570,920,780],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-2"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago. In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents. In re Bilski, as the case is known, is \"a very big deal,\" says Dennis D. Crouch of the University of Missouri School of Law. It \"has the potential to eliminate an entire class of patents.\"</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n<p>In a move / that has intellectual-property lawyers abuzz, / the U.S. Court of Appeals / for the Federal Circuit / said it would use / a particular case / to conduct a broad review / of business-method patents.</p>\n<p>In re Bilski, / as the case is known, / is \"a very big deal,\" / says Dennis D. Crouch / of the University of Missouri School of Law.</p>\n<p>It \"has the potential / to eliminate / an entire class of patents.\"</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>现在国家最高专利法院 / 看起来完全准备好 / 缩减 / 商业方法专利，/ 这些专利一直存在争议 / 自从它们首次被授权 / 10年前。</p>\n<p>在一个举动中 / 让知识产权律师们议论纷纷的，/ 美国上诉法院 / 联邦巡回法院的 / 说它将使用 / 一个特定案件 / 进行广泛审查 / 对商业方法专利。</p>\n<p>In re Bilski案，/ 正如该案为人所知，/ 是\"一件大事\"，/ 丹尼斯·D·克劳奇说 / 密苏里大学法学院的。</p>\n<p>它\"有潜力 / 消除 / 整个类别的专利。\"</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-3\"><h3>标准译文 · 第2段</h3>\n<p>现在，国家最高专利法院看起来完全准备好缩减商业方法专利了，这些专利自10年前首次被授权以来一直存在争议。在一个让知识产权律师们议论纷纷的举动中，美国联邦巡回上诉法院表示将使用一个特定案件对商业方法专利进行广泛审查。密苏里大学法学院的丹尼斯·D·克劳奇说，这个被称为In re Bilski的案件\"是一件大事\"。它\"有可能消除整个类别的专利\"。</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,570,920,780],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true},"focusId":"focus-paragraph-2-3"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets. That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out exclusive rights to specific types of online transactions. Later, more established companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the punch. In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[80,1350,920,1325],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets. That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out exclusive rights to specific types of online transactions. Later, more established companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the punch. In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>Curbs on business-method claims / would be a dramatic about-face, / because it was the Federal Circuit itself / that introduced such patents / with its 1998 decision / in the so-called State Street Bank case, / approving a patent / on a way of pooling / mutual-fund assets.</p>\n<p>That ruling / produced an explosion / in business-method patent filings, / initially by emerging Internet companies / trying to stake out / exclusive rights / to specific types / of online transactions.</p>\n<p>Later, / more established companies / raced to add / such patents to their files, / if only as a defensive move / against rivals / that might beat them to the punch.</p>\n<p>In 2005, / IBM noted / in a court filing / that it had been issued / more than 300 business-method patents, / despite the fact / that it questioned / the legal basis / for granting them.</p>\n<p>Similarly, / some Wall Street investment firms / armed themselves / with patents for financial products, / even as they took positions / in court cases / opposing the practice.</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[80,1350,920,1325],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-1"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets. That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out exclusive rights to specific types of online transactions. Later, more established companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the punch. In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>Curbs on business-method claims / would be a dramatic about-face, / because it was the Federal Circuit itself / that introduced such patents / with its 1998 decision / in the so-called State Street Bank case, / approving a patent / on a way of pooling / mutual-fund assets.</p>\n<p>That ruling / produced an explosion / in business-method patent filings, / initially by emerging Internet companies / trying to stake out / exclusive rights / to specific types / of online transactions.</p>\n<p>Later, / more established companies / raced to add / such patents to their files, / if only as a defensive move / against rivals / that might beat them to the punch.</p>\n<p>In 2005, / IBM noted / in a court filing / that it had been issued / more than 300 business-method patents, / despite the fact / that it questioned / the legal basis / for granting them.</p>\n<p>Similarly, / some Wall Street investment firms / armed themselves / with patents for financial products, / even as they took positions / in court cases / opposing the practice.</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>对商业方法权利要求的限制 / 将是一个戏剧性的态度转变，/ 因为正是联邦巡回法院本身 / 引入了这类专利 / 通过其1998年的裁决 / 在所谓的州街银行案中，/ 批准了一项专利 / 关于一种汇集方式 / 共同基金资产的。</p>\n<p>那项裁决 / 产生了爆炸式增长 / 在商业方法专利申请中，/ 最初是新兴互联网公司 / 试图圈定 / 独占权利 / 对特定类型的 / 在线交易。</p>\n<p>后来，/ 更多老牌公司 / 竞相添加 / 这类专利到他们的档案中，/ 即使只是作为防御性举措 / 对抗竞争对手 / 可能抢先一步的。</p>\n<p>在2005年，/ IBM指出 / 在一份法庭文件中 / 它已经被授予 / 超过300项商业方法专利，/ 尽管事实上 / 它质疑 / 法律基础 / 授予它们的。</p>\n<p>类似地，/ 一些华尔街投资公司 / 武装自己 / 用金融产品专利，/ 即使他们采取立场 / 在法庭案件中 / 反对这种做法。</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[80,1350,920,1325],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-2"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets. That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out exclusive rights to specific types of online transactions. Later, more established companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the punch. In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them. Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in co holders. Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious. The judges on the Federal Circuit are \"reacting to the anti-patent trend at the Supreme Court,\" says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[80,3390,920,615],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-0"},{"title":"第5段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders. Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious. The judges on the Federal Circuit are \"reacting to the anti-patent trend at the Supreme Court,\" says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>The Federal Circuit's action / comes in the wake of / a series of recent decisions / by the Supreme Court / that has narrowed / the scope of protections / for patent holders.</p>\n<p>Last April, / for example, / the justices signaled / that too many patents / were being upheld / for \"inventions\" / that are obvious.</p>\n<p>The judges on the Federal Circuit / are \"reacting to / the anti-patent trend / at the Supreme Court,\" / says Harold C. Wegner, / a patent attorney and professor / at George Washington University Law School.</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[80,3390,920,615 agraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-2"},{"title":"第5段","level":1,"section":"第二鸟 · 精读与翻译","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders. Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious. The judges on the Federal Circuit are \"reacting to the anti-patent trend at the Supreme Court,\" says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>The Federal Circuit's action / comes in the wake of / a series of recent decisions / by the Supreme Court / that has narrowed / the scope of protections / for patent holders.</p>\n<p>Last April, / for example, / the justices signaled / that too many patents / were being upheld / for \"inventions\" / that are obvious.</p>\n<p>The judges on the Federal Circuit / are \"reacting to / the anti-patent trend / at the Supreme Court,\" / says Harold C. Wegner, / a patent attorney and professor / at George Washington University Law School.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>联邦巡回法院的行动 / 发生在之后 / 一系列最近的裁决 / 由最高法院做出的 / 已经缩小了 / 保护范围 / 对专利持有人的。</p>\n<p>去年四月，/ 例如，/ 大法官们发出信号 / 太多专利 / 正在被支持 / 对于\"发明\" / 那些显而易见的。</p>\n<p>联邦巡回法院的法官们 / 正在\"回应 / 反专利趋势 / 在最高法院的，\"/ 哈罗德·C·韦格纳说，/ 一位专利律师和教授 / 在乔治华盛顿大学法学院。</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段</h3>\n<p>联邦巡回法院的行动是在最高法院一系列缩小专利持有人保护范围的最近裁决之后发生的。例如，去年四月，大法官们发出信号，认为太多显而易见的\"发明\"正在获得专利支持。乔治华盛顿大学法学院的专利律师兼教授哈罗德·C·韦格纳说，联邦巡回法院的法官们正在\"回应最高法院的反专利趋势\"。</p></section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[80,3390,920,615],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true},"focusId":"focus-paragraph-5-3"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","level":1,"section":"第二鸟 · 精读与翻译","html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116,"includeTitle":false}},{"title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":1,"section":"第二鸟 · 精读与翻译","html":"<p><strong>第1段</strong></p>\n<p>Over the past decade → thousands of patents → have been granted → for what are called → business methods.</p>\n<p>Amazon.com received one → for its \"one-click\"：(online payment system).</p>\n<p>Merrill Lynch → got legal protection → for an asset allocation strategy.</p>\n<p>One inventor → patented a technique → for lifting a box.</p>\n<p><strong>第2段</strong></p>\n<p>Now the nation's top patent court → appears completely ready → to scale back：(on business-method patents)：(which have been controversial：(ever since they were first authorized：(10 years ago))).</p>\n<p>In a move：(that has intellectual-property lawyers abuzz) → the U.S. Court of Appeals：(for the Federal Circuit) → said it would use：(a particular case) → to conduct a broad review：(of business-method patents).</p>\n<p>In re Bilski：(as the case is known) → is \"a very big deal\" → says Dennis D. Crouch：(of the University of Missouri School of Law).</p>\n<p>It → \"has the potential → to eliminate → an entire class of patents.\"</p>\n<p><strong>第3段</strong></p>\n<p>Curbs on business-method claims → would be a dramatic about-face // because it was the Federal Circuit itself：(that introduced such patents：(with its 1998 decision：(in the so-called State Street Bank case)))：(approving a patent：(on a way of pooling：(mutual-fund assets))).</p>\n<p>That ruling → produced an explosion：(in business-method patent filings) → initially by emerging Internet companies：(trying to stake out：(exclusive rights：(to specific types：(of online transactions)))).</p>\n<p>Later → more established companies → raced to add：(such patents to their files)：(if only as a defensive move：(against rivals：(that might beat them to the punch))).</p>\n<p>In 2005 → IBM noted：(in a court filing)：(that it had been issued：(more than 300 business-method patents)) // despite the fact：(that it questioned：(the legal basis：(for granting them))).</p>\n<p>Similarly → some Wall Street investment firms → armed themselves：(with patents for financial products) // even as they took positions：(in court cases)：(opposing the practice).</p>\n<p><strong>第4段</strong></p>\n<p>The Bilski case → involves a claimed patent：(on a method：(for hedging risk：(in the energy market))).</p>\n<p>The Federal Circuit → issued an unusual order → stating：(that the case → would be heard：(by all 12 of the court's judges) // rather than a typical panel of three) + (that one issue：(it wants to evaluate) → is whether it should \"reconsider\"：(its State Street Bank ruling)).</p>\n<p><strong>第5段</strong></p>\n<p>The Federal Circuit's action → comes in the wake of：(a series of recent decisions：(by the Supreme Court)：(that has narrowed → the scope of protections：(for patent holders))).</p>\n<p>Last April → for example → the justices signaled：(that too many patents → were being upheld → for \"inventions\"：(that are obvious)).</p>\n<p>The judges on the Federal Circuit → are \"reacting to：(the anti-patent trend：(at the Supreme Court))\" → says Harold C. Wegner：(a patent attorney and professor：(at George Washington University Law School)).</p>","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116,"includeTitle":false}},{"title":"中文版句子逻辑（选修)","level":1,"section":"第二鸟 · 精读与翻译","html":"<p><strong>第1段</strong></p>\n<p>在过去十年里 → 数千项专利 → 已经被授予 → 对于所谓的 → 商业方法。</p>\n<p>亚马逊获得了一项 → 为其\"一键式\"：(在线支付系统)。</p>\n<p>美林证券 → 获得了法律保护 → 为一项资产配置策略。</p>\n<p>一位发明者 → 获得了一项技术专利 → 用于抬起箱子。</p>\n<p><strong>第2段</strong></p>\n<p>现在国家最高专利法院 → 看起来完全准备好 → 缩减：(商业方法专利)：(这些专利一直存在争议：(自从它们首次被授权：(10年前)))。</p>\n<p>在一个举动中：(让知识产权律师们议论纷纷的) → 美国上诉法院：(联邦巡回法院的) → 说它将使用：(一个特定案件) → 进行广泛审查：(对商业方法专利)。</p>\n<p>In re Bilski案：(正如该案为人所知) → 是\"一件大事\" → 丹尼斯·D·克劳奇说：(密苏里大学法学院的)。</p>\n<p>它 → \"有潜力 → 消除 → 整个类别的专利。\"</p>\n<p><strong>第3段</strong></p>\n<p>对商业方法权利要求的限制 → 将是一个戏剧性的态度转变 // 因为正是联邦巡回法院本身：(引入了这类专利：(通过其1998年的裁决：(在所谓的州街银行案中)))：(批准了一项专利：(关于一种汇集方式：(共同基金资产的)))。</p>\n<p>那项裁决 → 产生了爆炸式增长：(在商业方法专利申请中) → 最初是新兴互联网公司：(试图圈定：(独占权利：(对特定类型的：(在线交易))))。</p>\n<p>后来 → 更多老牌公司 → 竞相添加：(这类专利到他们的档案中)：(即使只是作为防御性举措：(对抗竞争对手：(可能抢先一步的)))。</p>\n<p>在2005年 → IBM指出：(在一份法庭文件中)：(它已经被授予：(超过300项商业方法专利)) // 尽管事实上：(它质疑：(法律基础：(授予它们的)))。</p>\n<p>类似地 → 一些华尔街投资公司 → 武装自己：(用金融产品专利) // 即使他们采取立场：(在法庭案件中)：(反对这种做法)。</p>\n<p><strong>第4段</strong></p>\n<p>Bilski案 → 涉及一项声称的专利：(关于一种方法：(用于对冲风险：(在能源市场)))。</p>\n<p>联邦巡回法院 → 发布了一项不寻常的命令 → 声明：(该案 → 将被审理：(由法院所有12名法官) // 而不是典型的三人小组) + (一个问题：(它想要评估的) → 是否应该\"重新考虑\"：(其州街银行裁决))。</p>\n<p><strong>第5段</strong></p>\n<p>联邦巡回法院的行动 → 发生在之后：(一系列最近的裁决：(由最高法院做出的)：(已经缩小了 → 保护范围：(对专利持有人的)))。</p>\n<p>去年四月 → 例如 → 大法官们发出信号：(太多专利 → 正在被支持 → 对于\"发明\"：(那些显而易见的))。</p>\n<p>联邦巡回法院的法官们 → 正在\"回应：(反专利趋势：(在最高法院的))\" → 哈罗德·C·韦格纳说：(一位专利律师和教授：(在乔治华盛顿大学法学院))。</p>","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116,"includeTitle":false}},{"title":"长难句翻译练习（英一必修，英二选修)","level":1,"section":"第二鸟 · 精读与翻译","html":"<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并起来；</li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；</li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。</li>\n</ol>","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116,"includeTitle":false}},{"title":"1. 第二段第一句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h4>原文</h4>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"1. 第二段第一句","focus":[95,575,890,175],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-0"},{"title":"1. 第二段第一句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h4>原文</h4>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"1. 第二段第一句","focus":[95,575,890,175],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-1"},{"title":"1. 第二段第一句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h4>原文</h4>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>现在国家最高专利法院 / 看起来完全准备好 / 缩减 / 商业方法专利，/ 这些专利一直存在争议 / 自从它们首次被授权 / 10年前。</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"1. 第二段第一句","focus":[95,575,890,175],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-2"},{"title":"1. 第二段第一句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h4>原文</h4>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>现在国家最高专利法院 / 看起来完全准备好 / 缩减 / 商业方法专利，/ 这些专利一直存在争议 / 自从它们首次被授权 / 10年前。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把时间和“谁准备做什么”放到一起：</p>\n<blockquote>\n<p>现在，国家最高专利法院看起来已经完全准备好缩减商业方法专利</p>\n</blockquote>\n<p>后半句都在补充说明“商业方法专利”，中文接在这个名词后面：</p>\n<blockquote>\n<p>这类专利自10年前首次被授权以来一直存在争议</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>现在，国家最高专利法院看起来已经完全准备好缩减商业方法专利<br/>\n这类专利自10年前首次被授权以来一直存在争议</p>\n</blockquote></section>", eH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-4"},{"title":"1. 第二段第一句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h4>原文</h4>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>Now the nation's top patent court / appears completely ready / to scale back / on business-method patents, / which have been controversial / ever since they were first authorized / 10 years ago.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>现在国家最高专利法院 / 看起来完全准备好 / 缩减 / 商业方法专利，/ 这些专利一直存在争议 / 自从它们首次被授权 / 10年前。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把时间和“谁准备做什么”放到一起：</p>\n<blockquote>\n<p>现在，国家最高专利法院看起来已经完全准备好缩减商业方法专利</p>\n</blockquote>\n<p>后半句都在补充说明“商业方法专利”，中文接在这个名词后面：</p>\n<blockquote>\n<p>这类专利自10年前首次被授权以来一直存在争议</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>现在，国家最高专利法院看起来已经完全准备好缩减商业方法专利<br/>\n这类专利自10年前首次被授权以来一直存在争议</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-4\"><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>国家最高专利法院准备缩减商业方法专利。</p>\n</blockquote>\n<p>把“现在”放到句首，把“看起来完全准备好”放在主语和动作之间；关于这类专利的十年争议背景接在后面。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>现在，国家最高专利法院看起来已经完全准备好缩减商业方法专利，而这类专利自10年前首次获得授权以来一直存在争议。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-1-5\"><h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li><code>appears completely ready</code>保留“看起来已经准备好”的判断，不写成法院已经作出最终裁决；</li>\n<li><code>scale back</code>用“缩减”承接范围收缩，不扩大成“彻底取消” is for granting them.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>In 2005, / IBM noted / in a court filing / that it had been issued / more than 300 business-method patents, / despite the fact / that it questioned / the legal basis / for granting them.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>在2005年，/ IBM指出 / 在一份法庭文件中 / 它已经被授予 / 超过300项商业方法专利，/ 尽管事实上 / 它质疑 / 法律基础 / 授予它们的。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把时间和“在哪里指出”放到主句前面：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出</p>\n</blockquote>\n<p>再把它获得了什么说完整：</p>\n<blockquote>\n<p>它已经获得了300多项商业方法专利</p>\n</blockquote>\n<p>让步部分改成中文常用的“尽管……”：</p>\n<blockquote>\n<p>尽管它质疑授予这类专利的法律依据</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出<br/>\n尽管它质疑授予这类专利的法律依据<br/>\n它已经获得了300多项商业方法专利</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-4\"><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>IBM指出，它已经获得300多项商业方法专利。</p>\n</blockquote>\n<p>把时间和文件位置放在“指出”之前；把“尽管……”放在实际获授结果之前，突出公司立场与行为之间的反差。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出，尽管它质疑授予这类专利的法律依据，但它已经获得了300多项商业方法专利。</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"4. 第三段第四句","focus":[95,1995,890,185],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false},"focusId":"focus-long-4-4"},{"title":"4. 第三段第四句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h4>原文</h4>\n<blockquote>\n<p>In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>In 2005, / IBM noted / in a court filing / that it had been issued / more than 300 business-method patents, / despite the fact / that it questioned / the legal basis / for granting them.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>在2005年，/ IBM指出 / 在一份法庭文件中 / 它已经被授予 / 超过300项商业方法专利，/ 尽管事实上 / 它质疑 / 法律基础 / 授予它们的。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把时间和“在哪里指出”放到主句前面：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出</p>\n</blockquote>\n<p>再把它获得了什么说完整：</p>\n<blockquote>\n<p>它已经获得了300多项商业方法专利</p>\n</blockquote>\n<p>让步部分改成中文常用的“尽管……”：</p>\n<blockquote>\n<p>尽管它质疑授予这类专利的法律依据</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出<br/>\n尽管它质疑授予这类专利的法律依据<br/>\n它已经获得了300多项商业方法专利</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-4\"><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>IBM指出，它已经获得300多项商业方法专利。</p>\n</blockquote>\n<p>把时间和文件位置放在“指出”之前；把“尽管……”放在实际获授结果之前，突出公司立场与行为之间的反差。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出，尽管它质疑授予这类专利的法律依据，但它已经获得了300多项商业方法专利。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-4-5\"><h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li><code>had been issued</code>按专利语境译成“已经被授予”，中文也可自然说成“已经获得”；</li>\n<li>用“尽管……但……”把立场与行为的冲突说清；</li>\n<li><code>granting them</code>中的<code>them</code>还原为“这类专利”，避免指代含混。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>2005年，IBM在一份法庭文件中指出，尽管它质疑授予这些专利的法律基础，但它已经被授予了超过300项商业方法专利。</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"4. 第三段第四句","focus":[95,1995,890,185],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":true},"focusId":"focus-long-4-5"},{"title" p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>联邦巡回法院 / 发布了一项不寻常的命令 / 声明该案 / 将被审理 / 由法院所有12名法官，/ 而不是典型的三人小组，/ 并且一个问题 / 它想要评估的 / 是否应该\"重新考虑\" / 其州街银行裁决。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把主句说完整：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令</p>\n</blockquote>\n<p>命令的第一项内容是审理阵容：</p>\n<blockquote>\n<p>该案将由法院全部12名法官审理，而不是通常的三人小组</p>\n</blockquote>\n<p>第二项内容是法院要评估的问题：</p>\n<blockquote>\n<p>法院还要评估是否应该重新考虑州街银行案裁决</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令<br/>\n该案将由法院全部12名法官审理，而不是通常的三人小组<br/>\n法院还要评估是否应该重新考虑州街银行案裁决</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"5. 第四段第二句","focus":[95,2760,890,430],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-3"},{"title":"5. 第四段第二句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h4>原文</h4>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>The Federal Circuit / issued an unusual order / stating that the case / would be heard / by all 12 of the court's judges, / rather than a typical panel of three, / and that one issue / it wants to evaluate / is whether it should \"reconsider\" / its State Street Bank ruling.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>联邦巡回法院 / 发布了一项不寻常的命令 / 声明该案 / 将被审理 / 由法院所有12名法官，/ 而不是典型的三人小组，/ 并且一个问题 / 它想要评估的 / 是否应该\"重新考虑\" / 其州街银行裁决。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把主句说完整：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令</p>\n</blockquote>\n<p>命令的第一项内容是审理阵容：</p>\n<blockquote>\n<p>该案将由法院全部12名法官审理，而不是通常的三人小组</p>\n</blockquote>\n<p>第二项内容是法院要评估的问题：</p>\n<blockquote>\n<p>法院还要评估是否应该重新考虑州街银行案裁决</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令<br/>\n该案将由法院全部12名法官审理，而不是通常的三人小组<br/>\n法院还要评估是否应该重新考虑州街银行案裁决</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-4\"><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>联邦巡回法院发布命令，说明审理安排，并提出要评估的问题。</p>\n</blockquote>\n<p>把“12名法官而不是三人小组”放在第一项内容中，把“是否重新考虑旧裁决”作为第二项并列内容；中文可用冒号和分号分开。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令：该案将由全院12名法官审理，而不是通常的三人小组；法院还将评估是否应该重新考虑州街银行案裁决。</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"5. 第四段第二句","focus":[95,2760,890,430],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-4"},{"title":"5. 第四段第二句","level":1,"section":"第二鸟 · 长难句手译","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h4>原文</h4>\n<blockquote>\n<p>The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-1\"><h4>第一步：划分意群</h4>\n<blockquote>\n<p>The Federal Circuit / issued an unusual order / stating that the case / would be heard / by all 12 of the court's judges, / rather than a typical panel of three, / and that one issue / it wants to evaluate / is whether it should \"reconsider\" / its State Street Bank ruling.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-2\"><h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>联邦巡回法院 / 发布了一项不寻常的命令 / 声明该案 / 将被审理 / 由法院所有12名法官，/ 而不是典型的三人小组，/ 并且一个问题 / 它想要评估的 / 是否应该\"重新考虑\" / 其州街银行裁决。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-3\"><h4>第三步：按照中文语感合并意群</h4>\n<p>先把主句说完整：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令</p>\n</blockquote>\n<p>命令的第一项内容是审理阵容：</p>\n<blockquote>\n<p>该案将由法院全部12名法官审理，而不是通常的三人小组</p>\n</blockquote>\n<p>第二项内容是法院要评估的问题：</p>\n<blockquote>\n<p>法院还要评估是否应该重新考虑州街银行案裁决</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令<br/>\n该案将由法院全部12名法官审理，而不是通常的三人小组<br/>\n法院还要评估是否应该重新考虑州街银行案裁决</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-4\"><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>联邦巡回法院发布命令，说明审理安排，并提出要评估的问题。</p>\n</blockquote>\n<p>把“12名法官而不是三人小组”放在第一项内容中，把“是否重新考虑旧裁决”作为第二项并列内容；中文可用冒号和分号分开。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令：该案将由全院12名法官审理，而不是通常的三人小组；法院还将评估是否应该重新考虑州街银行案裁决。</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-long-5-5\"><h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li><code>all 12 of the court's judges</code>处理为“法院全部12名法官”，保留全体审理的特殊性；</li>\n<li>两个<code>that</code>引出的内容在中文中改为两项并列说明；</li>\n<li><code>reconsider</code>保留“重新考虑”，不提前写成“推翻”。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>联邦巡回法院发布了一项不寻常的命令，声明该案将由法院所有12名法官审理，而不是典型的三人小组，并且法院想要评估的一个问题是是否应该\"重新考虑\"其州街银行案的裁决。</p>\n</blockquote></section>","context":{"mode":"image","asset":"articleAnnotated","label":"5. 第四段第二句","focus":[95,2760,890,430],"sourceW":1080,"sourceH":6116,"includeTitle":false,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":true},"focusId":"focus-long-5-5"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"section":"第三鸟 · 题目复盘","html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。</li>\n</ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n<li><strong>全文主旨：</strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h3>第一类：歪曲原意</h3>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr />\n<h3>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h3>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr />\n<h3>第三类：无中生有</h3>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>在本篇文章里，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。</p>","context":{"mode":"image","asset":"questions","label":"完整题目页","focus":null,"sourceW":1354,"sourceH":1885},"meta":{"kind":"section-cover","mergedIntro":true}},{"title":"30题 · 题干、题型与核心出处","level":1,"section":"第三鸟 · 题目复盘","html":"<p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>下面哪一项最适合作为文章的主题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>A looming threat to business-method patents.</strong></p>\n<p>商业方法专利面临的一场迫近威胁</p>\n<p>B. <strong>Protection for business-method patent holders.</strong></p>\n<p>对商业方法专利持有人的保护</p>\n<p>C. <strong>A legal case regarding business-method patents.</strong></p>\n<p>一起关于商业方法专利的案件</p>\n<p>D. <strong>A prevailing trend against business-method patents.</strong></p>\n<p>一种反对商业方法专利的普遍趋势</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>这一段在说什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先列出过去十年已经获准的几种商业方法专利</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>转到现在，写联邦巡回法院准备缩减并全面审查这类专利</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看旧决定怎样引入这类专利，以及企业为何大量申请</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>写Bilski案的异常审理安排和重新考虑旧决定的可能</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补最高法院近来的反专利动作，说明眼前变化有更大背景</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table></div>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"question","question":"30","questionIntro":true}},{"title":"A. A looming threat to business-method patents.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-A-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>商业方法专利面临的一场迫近威胁</p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false},"focusId":"focus-q30-A-0"},{"title":"A. A looming threat to business-method patents.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-A-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>商业方法专利面临的一场迫近威胁</p></section><section class=\"revealPart\" id=\"focus-q30-A-1\"><h3>如果 A 是主旨，文章5段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>商业方法专利面临的一场迫近威胁</p>\n<p>那文章5段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写商业方法专利在过去十年已被大量授予，并用多类商业做法举例，建立“受威胁对象原本已广泛存在”的旧状态</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写法院现在准备缩减并全面审查商业方法专利，使这类既有专利面临尚未落地但迫近的限制</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看法院过去怎样通过既有裁决引入商业方法专利，以及企业怎样大量申请，解释此次收缩为何会冲击原有制度</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用Bilski案的全体法官审理和拟重审旧裁决，具体说明这场迫近威胁将如何动摇整类商业方法专利的法律基础</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补充最高法院近期持续收紧专利保护的背景，说明商业方法专利的迫近威胁并非孤立动作</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table></div>\n<p>文章实际正是这样推进的：第1段写过去十年的专利规模；第2段用<code>Now</code>转到法院准备<code>scale back</code>并开展<code>a broad review</code>；第3段回看1998年裁决及其引发的申请潮；第4段写Bilski案可能促使法院重新考虑旧裁决；第5段再补最高法院收紧专利保护的背景。A能够同时解释全文的既有规模、当前变化、历史回看、案件落点和结尾背景。</p>\n<p>判断：</p>\n<p><strong>A 保留。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true},"focusId":"focus-q30-A-1"},{"title":"B. Protection for business-method patent holders.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-B-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>对商业方法专利持有人的保护</p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"30","option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":false},"focusId":"focus-q30-B-0"},{"title":"B. Protection for business-method patent holders.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-B-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>对商业方法专利持有人的保护</p></section><section class=\"revealPart\" id=\"focus-q30-B-1\"><h3>如果 B 是主旨，文章5段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>对商业方法专利持有人的保护</p>\n<p>那文章5段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写竞争者过去经常模仿或绕开受专利保护的商业方法，使持有人难以维权，建立这种削弱保护的做法很常见的旧状态</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写法院现在反过来准备加强商业方法专利的有效性和执行力度，为持有人提供更稳固的保护</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看过去保护不足源于怎样的裁决标准和制度缺口，以及持有人为何长期难以维护权利</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用一个关键案件说明新的保护措施将扩大到整类商业方法专利，并改变持有人维权实践</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补充最高法院与其他司法机关同向强化专利保护的更大背景，说明这次保护并非孤立举措</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table></div>\n<p>文章实际没有沿这条路线写。第2段的核心动作是缩减和全面审查，第4段写法院可能重新考虑旧裁决，第5段又写专利保护范围已经被缩小。第1段虽然列出企业获得专利的例子，但它只是在交代旧状态，不能把全文方向改成“加强保护”。</p>\n<p>判断：</p>\n<p><strong>B 不保留。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"30","option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true},"focusId":"focus-q30-B-1"},{"title":"C. A legal case regarding business-method patents.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-C-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>一起关于商业方法专利的案件</p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"30","option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":false},"focusId":"focus-q30-C-0"},{"title":"C. A legal case regarding business-method patents.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-C-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>一起关于商业方法专利的案件</p></section><section class=\"revealPart\" id=\"focus-q30-C-1\"><h3>如果 C 是主旨，文章5段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>一起关于商业方法专利的案件</p>\n<p>那文章5段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先交代这起案件所涉的商业方法专利属于一种长期常见的专利做法，并用同类专利例子建立案件背景</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写该案出现后，法院开始反过来审查原先普遍接受的做法，交代案件引发的当前程序变化</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看与该案争点直接相关的旧裁决如何建立商业方法专利制度，解释案件为什么会触及既有规则</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>集中说明该案的当事争点、全体法官审理安排及拟重审旧裁决的影响，展示案件将造成多大变化</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补充最高法院近期判例这一更大司法背景，说明该案并非孤立诉讼，而是更广泛变化中的关键案件</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table></div>\n<p>Bilski案确实是当前变化的核心载体，但全文没有停在一个案件本身。第1段先写整类商业方法专利的普遍存在，第3段大篇幅回顾整类专利的扩张史，第5段又把视野扩展到最高法院的整体司法方向。文章真正关心的是这个案件可能怎样改变整类专利的前景，C的范围过窄。</p>\n<p>判断：</p>\n<p><strong>C 不保留。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"30","option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":true},"focusId":"focus-q30-C-1"},{"title":"D. A prevailing trend against business-method patents.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-D-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>一种反对商业方法专利的普遍趋势</p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false},"focusId":"focus-q30-D-0"},{"title":"D. A prevailing trend against business-method patents.","level":1,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-D-0\"><p><strong>Which of the following would be the subject of the text?</strong></p>\n<p>一种反对商业方法专利的普遍趋势</p></section><section class=\"revealPart\" id=\"focus-q30-D-1\"><h3>如果 D 是主旨，文章5段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>一种反对商业方法专利的普遍趋势</p>\n<p>那文章5段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写商业方法专利过去普遍获准并被企业广泛使用，建立后来“普遍反对”所要逆转的常见旧做法</td>\n  <td>先摆出原来的做法很常见</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写法院、律师界和其他参与者现在转而广泛质疑并限制商业方法专利，表明反对力量已形成共同方向</td>\n  <td>再说现在有人要反过来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>回看这类专利当初怎样被引入并迅速扩张，以及扩张中暴露的矛盾，解释普遍反对为何形成</td>\n  <td>回头解释以前为什么会这样</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用Bilski案的全体法官审理和拟重审旧裁决，说明反对趋势将如何改变整类商业方法专利制度</td>\n  <td>接着写这次变化可能有多大</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>补充最高法院近期连续收紧专利保护的同向事件，证明反对商业方法专利的趋势不是单个法院的偶然动作</td>\n  <td>最后补更大背景说明不是偶然</td>\n</tr>\n</tbody>\n</table></div>\n<p>文章实际的新闻中心是联邦巡回法院准备利用Bilski案进行广泛审查。最后一段出现的<code>anti-patent trend</code>是针对专利保护总体的更大背景，不等于全文都在证明“反对商业方法专利”已经成为普遍且占主导的趋势。原文还使用<code>appears</code>、<code>potential</code>和<code>whether</code>保留未决性，D把一项迫近的具体威胁扩大成已经形成的普遍局面。</p>\n<p>判断：</p>\n<p><strong>D 不保留。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true},"focusId":"focus-q30-D-1"},{"title":"30题结论","level":1,"section":"第三鸟 · 题目复盘","html":"<p><strong>30. A. A looming threat to business-method patents.</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>A looming threat to business-method patents. / 商业方法专利面临的一场迫近威胁</strong></p>","context":{"mode":"image","asset":"questions","label":"30题","focus":[0,1305,1354,390],"sourceW":1354,"sourceH":1885},"meta":{"kind":"conclusion","question":"30","questionConclusion":true}},{"title":"26题 · 题干、题型与核心出处","level":1,"section":"第三鸟 · 题目复盘","html":"<blockquote>\n<p>Business-method patents have recently aroused concern because of ______.<br />\n商业方法专利最近为什么引起了关注？</p>\n</blockquote>\n<h3>题型</h3>\n<p>这是一道具体细节题，题干用<code>recently</code>锁定近期变化，并要求找出商业方法专利最近引起关注的原因。判断时要把过去十年的背景、持续已久的争议和第二段当前法院动作分开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.</p>\n<p>In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.</p>\n<p>It &quot;has the potential to eliminate an entire class of patents.&quot;</p>\n</blockquote>\n<p>题干中的<code>recently</code>先锁定当前的新变化。第一段的企业例子属于过去十年的背景；第二段才写法院现在准备缩减、广泛审查，甚至可能影响整类专利。题干问的是近期关注的原因，因此要比较的是这项新动作，而不是某个旧例子或持续十年的争议背景。</p>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"question","question":"26","questionIntro":true}},{"title":"A. their limited value to businesses","level":3,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>它们对企业的有限价值</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>their [xxx] value to businesses</code>。只能看到<code>value to businesses</code>可能与第一段企业获得专利的例子有关，但原文没有评价这些专利对企业的价值；题干中的<code>recently</code>又把关注点拉向第二段法院的新动作，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了第一段中的企业名称和企业获得专利这一场景，所以看起来像在谈专利对企业的作用。原文写的是企业曾经获得不同类型的专利，A却把它接成“这些专利对企业价值有限，因此最近受到关注”。原文没有给出“价值有限”这项评价，也没有建立这条因果。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"option","question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"focusId":"focus-q26-A-0","raw":"### A. their limited value to businesses\n\n> 它们对企业的有限价值\n\n**做题模式中的状态：**选项当时显示为`their [xxx] value to businesses`。只能看到`value to businesses`可能与第一段企业获得专利的例子有关，但原文没有评价这些专利对企业的价值；题干中的`recently`又把关注点拉向第二段法院的新动作，因此A被排除。\n\n**错误类型：第三类——无中生有。**\n\nA抓住了第一段中的企业名称和企业获得专利这一场景，所以看起来像在谈专利对企业的作用。原文写的是企业曾经获得不同类型的专利，A却把它接成“这些专利对企业价值有限，因此最近受到关注”。原文没有给出“价值有限”这项评价，也没有建立这条因果。\n\n**命题人借用的原文材料：**\n\n> Amazon.com received one for its \"one-click\" online payment system.\n>\n> Merrill Lynch got legal protection for an asset allocation strategy.","lines":["### A. their limited value to businesses","","> 它们对企业的有限价值","","**做题模式中的状态：**选项当时显示为`their [xxx] value to businesses`。只能看到`value to businesses`可能与第一段企业获得专利的例子有关，但原文没有评价这些专利对企业的价值；题干中的`recently`又把关注点拉向第二段法院的新动作，因此A被排除。","","**错误类型：第三类——无中生有。**","","A抓住了第一段中的企业名称和企业获得专利这一场景，所以看起来像在谈专利对企业的作用。原文写的是企业曾经获得不同类型的专利，A却把它接成“这些专利对企业价值有限，因此最近受到关注”。原文没有给出“价值有限”这项评价，也没有建立这条因果。","","**命题人借用的原文材料：**","","> Amazon.com received one for its \"one-click\" online payment system.",">","> Merrill Lynch got legal protection for an asset allocation strategy."]},{"title":"A. their limited value to businesses","level":4,"section":"第三鸟 · 题目复盘","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>它们对企业的有限价值</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>选项当时显示为<code>their [xxx] value to businesses</code>。只能看到<code>value to businesses</code>可能与第一段企业获得专利的例子有关，但原文没有评价这些专利对企业的价值；题干中的<code>recently</code>又把关注点拉向第二段法院的新动作，因此A被排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A抓住了第一段中的企业名称和企业获得专利这一场景，所以看起来像在谈专利对企业的作用。原文写的是企业曾经获得不同类型的专利，A却把它接成“这些专利对企业价值有限，因此最近受到关注”。原文没有给出“价值有限”这项评价，也没有建立这条因果。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>商业方法专利最近引起关注，是因为它们对企业的价值有限。</p>\n</blockquote>\n<p>定位时先同时抓住题干中的<code>recently</code>和选项中的<code>limited value to businesses</code>。<code>limited value to businesses</code>会把视线带到第一段的企业例子；<code>recently</code>则要求继续看到第二段由<code>Now</code>引出的当前变化。</p>\n<p>回看第一层已经列出的出处，再把完成判断所需的原文连起来：</p>\n<blockquote>\n<p>Amazon.com received one for its &quot;one-click&quot; online payment system.</p>\n<p>Merrill Lynch got legal protection for an asset allocation strategy.</p>\n<p>Now the nation's top patent court appears completely ready to scale back on business-method patents.</p>\n</blockquote>\n<p>原文中的关系是：第一段的主体是Amazon.com和Merrill Lynch，动作是“获得专利或法律保护”，对象是具体商业方法；第二段的主体换成国家最高专利法院，当前动作是<code>scale back</code>，对象才是整类商业方法专利，时间限制是<code>Now</code>。</p>\n<p>A中的关系是：主体是商业方法专利，选项给它们加上“对企业价值有限”这一性质，并把这一性质设为“最近引起关注”的原因。</p>\n<p>具体差异在于：原文只写企业过去获得过专利，没有评价这些专利给企业带来的价值高低；A又额外补出“价值有限 → 最近受到关注”的因果。评价和因果都无原文依据。</p></section>","context":{"mode":"image","asset":"questions","label":"26题","focus":[0,85,1354,360],"sourceW":1354,"sourceH":1885},"meta":{"kind":"method","question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"focusId":"focus-q26-A-1","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 商业方法专利最近引起关注，是因为它们对企业的价值有限。\n\n定位时先同时抓住题干中的`recently`和选项中的`limited value to businesses`。`limited value to businesses`会把视线带到第一段的企业例子；`recently`则要求继续看到第二段由`Now`引出的当前变化。\n\n回看第一层已经列出的出处，再把完成判断所需的原文连起来：\n\n> Amazon.com received one for its \"one-click\" onli
