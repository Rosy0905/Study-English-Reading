nected member of a community has a limited circle of direct contacts.</p>\n</blockquote>\n<p>后段E的开头是：</p>\n<blockquote>\n<p>A limited circle does not rule out widespread diffusion, but it means that direct persuasion cannot be the whole explanation.</p>\n</blockquote>\n<p>B以limited circle of direct contacts收束，固定E开头A limited circle原样接住，再说有限接触不排除广泛传播，却要求补充传播链。局限与补充机制正好相接。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>展开两步流动理论，并解释营销吸引力与表面证据 → 限制先行证据的因果含义，转向影响者实际接触范围 → 由直接接触有限推出逐级传播，把注意力转向后来接收者</p>\n</blockquote>\n<p>再检验容易混淆的候选C。它的开头是：</p>\n<blockquote>\n<p>These later recipients introduce a condition that no initial influential can supply alone.</p>\n</blockquote>\n<p>C开头These later recipients需要先出现后续接收者，D还只介绍两步路径和先行故事。把C放在E前，既缺少later recipients的近接先行词，也无法给E的A limited circle提供所需对象。</p>\n<p><strong>42题选B。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → C → F的关系。\n\n先看前段E的结尾：\n\n> The analysis must therefore turn from the first messenger to these later recipients.\n\n再看候选C的开头：\n\n> These later recipients introduce a condition that no initial influential can supply alone.\n\n固定E末尾明确转向these later recipients，C开头These later recipients承接同一批人，并立即说明他们带来的条件。此处不再回头描述发起者的人格魅力。\n\nC把后续环节展开为接受信息并再传出去，接着用两步之外出现抵制说明链条可能终止。最后把问题提炼成population’s receptiveness，完成从传播机制到可研究问题的推进。\n\nC段最终落在：\n\n> The decisive question therefore concerns the population's receptiveness, rather than simply the special qualities of its first messenger.\n\n后段F的开头是：\n\n> To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.\n\nC以接受度问题结束，F用To investigate that question接住，随后说明模拟同时调整影响力和接受度。先提出要检验什么，再说怎样研究，衔接完整。\n\n这三段的局部推进是：\n\n> 由直接接触有限推出逐级传播，把注意力转向后来接收者 → 说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象\n\n再检验容易混淆的候选F。它的开头是：\n\n> To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.\n\nF也讨论接受度，看似能直接接E，但that question需要前文已经明确提出接受度这一研究问题。E只要求转向后来接收者，尚未解释他们的接受意愿为什么成为决定条件。\n\n**43题选C。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype","question":"C"},"html":"<p>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → C → F的关系。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The analysis must therefore turn from the first messenger to these later recipients.</p>\n</blockquote>\n<p>再看候选C的开头：</p>\n<blockquote>\n<p>These later recipients introduce a condition that no initial influential can supply alone.</p>\n</blockquote>\n<p>固定E末尾明确转向these later recipients，C开头These later recipients承接同一批人，并立即说明他们带来的条件。此处不再回头描述发起者的人格魅力。</p>\n<p>C把后续环节展开为接受信息并再传出去，接着用两步之外出现抵制说明链条可能终止。最后把问题提炼成population’s receptiveness，完成从传播机制到可研究问题的推进。</p>\n<p>C段最终落在：</p>\n<blockquote>\n<p>The decisive question therefore concerns the population&#39;s receptiveness, rather than simply the special qualities of its first messenger.</p>\n</blockquote>\n<p>后段F的开头是：</p>\n<blockquote>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.</p>\n</blockquote>\n<p>C以接受度问题结束，F用To investigate that question接住，随后说明模拟同时调整影响力和接受度。先提出要检验什么，再说怎样研究，衔接完整。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>由直接接触有限推出逐级传播，把注意力转向后来接收者 → 说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象</p>\n</blockquote>\n<p>再检验容易混淆的候选F。它的开头是：</p>\n<blockquote>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.</p>\n</blockquote>\n<p>F也讨论接受度，看似能直接接E，但that question需要前文已经明确提出接受度这一研究问题。E只要求转向后来接收者，尚未解释他们的接受意愿为什么成为决定条件。</p>\n<p><strong>43题选C。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成C → F → G的关系。\n\n先看前段C的结尾：\n\n> The decisive question therefore concerns the population's receptiveness, rather than simply the special qualities of its first messenger.\n\n再看候选F的开头：\n\n> To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.\n\nC最后把关键问题定为群体接受度，F以To investigate that question引入研究方法。that question回指的是接受度条件，而非最早是谁带头的名人追溯。\n\nF交代模拟可调整影响力和接受度，接着给出足够多易受影响者这一主要条件，再限制特殊发起者的必要性。由方法到发现，再到研究注意力变化，层次完整。\n\nF段最终落在：\n\n> The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.\n\n后段G的开头是：\n\n> That change of attention has a practical consequence.\n\nF末尾changed the object of attention被G的That change of attention承接。G再谈实际启发，形成研究发现之后才解释其应用的顺序。\n\n这三段的局部推进是：\n\n> 说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发\n\n再检验容易混淆的候选G。它的开头是：\n\n> That change of attention has a practical consequence.\n\nG一开始就是That change，但C提出了问题，尚未给出模拟结果和由此产生的关注变化。若先放G，会先引用未交代的研究转变，F的证据则被推迟到启发之后。\n\n**44题选F。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype","question":"F"},"html":"<p>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成C → F → G的关系。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>The decisive question therefore concerns the population&#39;s receptiveness, rather than simply the special qualities of its first messenger.</p>\n</blockquote>\n<p>再看候选F的开头：</p>\n<blockquote>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.</p>\n</blockquote>\n<p>C最后把关键问题定为群体接受度，F以To investigate that question引入研究方法。that question回指的是接受度条件，而非最早是谁带头的名人追溯。</p>\n<p>F交代模拟可调整影响力和接受度，接着给出足够多易受影响者这一主要条件，再限制特殊发起者的必要性。由方法到发现，再到研究注意力变化，层次完整。</p>\n<p>F段最终落在：</p>\n<blockquote>\n<p>The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.</p>\n</blockquote>\n<p>后段G的开头是：</p>\n<blockquote>\n<p>That change of attention has a practical consequence.</p>\n</blockquote>\n<p>F末尾changed the object of attention被G的That change of attention承接。G再谈实际启发，形成研究发现之后才解释其应用的顺序。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发</p>\n</blockquote>\n<p>再检验容易混淆的候选G。它的开头是：</p>\n<blockquote>\n<p>That change of attention has a practical consequence.</p>\n</blockquote>\n<p>G一开始就是That change，但C提出了问题，尚未给出模拟结果和由此产生的关注变化。若先放G，会先引用未交代的研究转变，F的证据则被推迟到启发之后。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → G → H的关系。\n\n先看前段F的结尾：\n\n> The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.\n\n再看候选G的开头：\n\n> That change of attention has a practical consequence.\n\nF刚说明关注点由少数特殊个人转向网络，G用That change of attention接住，并说明这会改变怎样评价宣传者和后续传播。\n\nG承认能说服人的代言者可能有用，同时强调仍要检查信息能否走出第一批受众。其结尾要求兼看开端与延续条件，既不把能人全盘否定，也不把开端当成充分原因。\n\nG段最终落在：\n\n> Explaining a trend therefore requires evidence about both its beginning and the conditions that sustain its continuation.\n\n后段H的开头是：\n\n> A memorable account of the beginning can still form part of that explanation.\n\nG末尾的Explaining a trend给固定H的that explanation提供对象。H继而承认开端故事可成为解释的一部分，但不能替代全过程，正好收束G提出的两方面证据。\n\n这三段的局部推进是：\n\n> 用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发 → 收束起点与全程的关系，强调网络持续展开的过程\n\n再检验容易混淆的候选B。它的开头是：\n\n> The difficulty is that being early does not by itself establish being decisive.\n\nB回到先行与决定性的初步区分，并以接触圈有限收尾。这适合导入传播链，却不能承接F刚形成的研究转变；放在末尾还会把已经展开的机制重新退回起点。\n\n**45题选G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype","question":"G"},"html":"<p>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → G → H的关系。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.</p>\n</blockquote>\n<p>再看候选G的开头：</p>\n<blockquote>\n<p>That change of attention has a practical consequence.</p>\n</blockquote>\n<p>F刚说明关注点由少数特殊个人转向网络，G用That change of attention接住，并说明这会改变怎样评价宣传者和后续传播。</p>\n<p>G承认能说服人的代言者可能有用，同时强调仍要检查信息能否走出第一批受众。其结尾要求兼看开端与延续条件，既不把能人全盘否定，也不把开端当成充分原因。</p>\n<p>G段最终落在：</p>\n<blockquote>\n<p>Explaining a trend therefore requires evidence about both its beginning and the conditions that sustain its continuation.</p>\n</blockquote>\n<p>后段H的开头是：</p>\n<blockquote>\n<p>A memorable account of the beginning can still form part of that explanation.</p>\n</blockquote>\n<p>G末尾的Explaining a trend给固定H的that explanation提供对象。H继而承认开端故事可成为解释的一部分，但不能替代全过程，正好收束G提出的两方面证据。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发 → 收束起点与全程的关系，强调网络持续展开的过程</p>\n</blockquote>\n<p>再检验容易混淆的候选B。它的开头是：</p>\n<blockquote>\n<p>The difficulty is that being early does not by itself establish being decisive.</p>\n</blockquote>\n<p>B回到先行与决定性的初步区分，并以接触圈有限收尾。这适合导入传播链，却不能承接F刚形成的研究转变；放在末尾还会把已经展开的机制重新退回起点。</p>\n<p><strong>45题选G。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **critical thinking** | **批判性思维** | **人生哲理类｜独立思考** | **个人主题** |\n| discerning the validity of information | 甄别信息的有效性 | 社会现象类｜科技经济 | 个人主题 |\n| a rational attitude toward influential figures | 理性看待有影响力的人物 | 社会现象类｜社会生活 | 个人主题 |\n| **independent judgment** | **独立判断** | **人生哲理类｜独立思考** | **个人主题** |\n| effective interpersonal communication | 有效的人际沟通 | 社会现象类｜社会生活 | 个人主题 |\n| joint efforts | 共同努力 | 人生哲理类｜团结合作 | 个人主题 |\n| building a healthy Net | 构建网络文明 | 社会现象类｜科技经济 | 宏观主题 |\n| responsible information sharing | 负责任的信息分享 | 人生哲理类｜责任感 | 个人主题 |\n| **respect for evidence** | **尊重证据** | **人生哲理类｜理性思考** | **个人主题** |\n| rational consumption | 理性消费 | 社会现象类｜社会生活 | 个人主题 |\n| openness to new ideas | 对新观念保持开放 | 人生哲理类｜与时俱进 | 个人主题 |\n| respect for ordinary people’s contributions | 尊重普通人的贡献 | 人生哲理类｜尊重他人 | 个人主题 |","section":"第五鸟 · 写作积累","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tb B中所起作用的关注。** |\n| 图表题 | The chart shows the sudden increase in the popularity of A. | 图表显示了A受欢迎程度的突然上升。 |\n| 图表题 | A accounts for only a small minority of the total. | A只占总数的极少部分。 |\n| 图表题 | The figures compare A’s ability to do B with its tendency to do C. | 数据比较了A做B的能力与做C的倾向。 |\n| 图表题 | The data suggest that A has a greater impact on B than C does. | 数据表明，与C相比，A对B的影响更大。 |\n| **文本评论题** | **The passage questions the supposed importance of A in B.** | **文章质疑A在B中被认为具有的重要性。** |\n| 文本评论题 | The author argues that A is driven in large part by B. | 作者认为，A在很大程度上由B推动。 |\n| 文本评论题 | The passage suggests that the key requirement for A is not B but C. | 文章表明，A的关键条件不是B，而是C。 |\n| 文本评论题 | The author draws on research to explain how A spreads through B. | 作者借助研究解释A怎样经由B传播。 |","section":"第五鸟 · 写作积累","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画题</strong></td>\n<td><strong>In the picture, A is trying to influence B through C.</strong></td>\n<td><strong>图中，A正试图通过C影响B。</strong></td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>The scene shows how an idea spreads from A to B and then to C.</td>\n<td>画面展示了一个观念怎样从A传向B，再传向C。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>A pays close attention to B, while C remains resistant to its influence.</td>\n<td>A密切关注B，而C仍不接受它的影响。</td>\n</tr>\n<tr>\n<td><strong>图画题</strong></td>\n<td><strong>The picture draws attention to the role of A in shaping B.</strong></td>\n<td><strong>这幅图引起人们对A在塑造B中所起作用的关注。</strong></td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The chart shows the sudden increase in the popularity of A.</td>\n<td>图表显示了A受欢迎程度的突然上升。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>A accounts for only a small minority of the total.</td>\n<td>A只占总数的极少部分。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The figures compare A’s ability to do B with its tendency to do C.</td>\n<td>数据比较了A做B的能力与做C的倾向。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The data suggest that A has a greater impact on B than C does.</td>\n<td>数据表明，与C相比，A对B的影响更大。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>The passage questions the supposed importance of A in B.</strong></td>\n<td><strong>文章质疑A在B中被认为具有的重要性。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The author argues that A is driven in large part by B.</td>\n<td>作者认为，A在很大程度上由B推动。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The passage suggests that the key requirement for A is not B but C.</td>\n<td>文章表明，A的关键条件不是B，而是C。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The author draws on research to explain how A spreads through B.</td>\n<td>作者借助研究解释A怎样经由B传播。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Distinguish public visibility from personal contact</strong></p><p><strong>B. Let a successful beginning stand for the whole process</strong></p><p><strong>C. Look for receptive people throughout the network</strong></p><p><strong>D. Do not turn an early appearance into proof of causation</strong></p><p><strong>E. Replace every influential with a celebrity</strong></p><p><strong>F. Test what happens beyond the first circle</strong></p><p><strong>G. Explain the appeal of a convenient marketing model</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>A marketer who wants a new product to spread faces a large and varied audience. The two-step model appears to reduce that task to finding a small group of unusually persuasive or well-connected people. Reach them, the reasoning goes, and they will carry the message to everyone else. This is an attractive promise because it offers an identifiable target and a seemingly economical route to a much larger market. Its practical appeal, however, is not itself evidence that the route works as described. A theory can be useful for organising a campaign while still leaving its central account of influence insufficiently tested.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>When a style becomes popular, it is often possible to find a small group that adopted it before most others. Such a discovery tells us something about the sequence of events. It does not establish that the same people could have produced a comparable result in a less receptive population. Looking back from a successful trend also leaves out early adopters whose choices went nowhere. The first visible users may therefore be part of an explanation without being its decisive cause. To explain the eventual spread, we need evidence about what happened after their initial involvement, not merely a memorable story about who came first.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>A famous television personality may reach a huge audience without personally speaking to most of its members. That reach depends heavily on the medium through which the message travels. A well-connected individual in an ordinary community, by contrast, generally influences people through direct interaction. Even an extensive personal circle has limits. Treating these two kinds of reach as interchangeable makes it easy to exaggerate what an ordinary influential can accomplish. The relevant distinction is not whether one person is more impressive than another. It is whether the audience receives a broadcast message or is reached through a chain of personal contacts.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Suppose an influential persuades several acquaintances to adopt a new practice. This is a successful first step, but a widespread change requires further steps that the original person does not control. Those acquaintances must reach others, and the later recipients must be willing to respond. If the next circle resists, the chain can stop despite the strength of the beginning. A campaign therefore cannot be evaluated only by counting the first person&#x27;s immediate converts. It must follow the message into later circles and ask whether each link continues the process. Early success and extensive diffusion are different outcomes that require different evidence.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Computer simulations allow researchers to vary both the ability to influence others and the willingness to be influenced. The finding described in the passage shifts attention from a few exceptional starters to a sufficiently large body of receptive people. This does not mean that every ordinary individual will pass on every message, or that a cascade can be guaranteed. It means that the surrounding population supplies a condition the starter alone cannot create. Understanding large-scale diffusion consequently requires attention to the distribution of receptiveness across a network. A search confined to its most prominent members may miss what allows influence to continue travelling.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>When a new style spreads rapidly, observers often search for the person who set it in motion. A familiar answer points to a small group of unusually informed or persuasive individuals. Their personal qualities seem to explain why everyone else eventually followed. Behind this answer lies a particular account of how information moves through society, commonly known as the two-step flow of communication.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>The difficulty is that being early does not by itself establish being decisive. A group can adopt a style before everyone else without controlling what later users do. To test its influence, we must move beyond the first adopters and examine the people they actually reach. Even a highly connected member of a community has a limited circle of direct contacts.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>These later recipients introduce a condition that no initial influential can supply alone. They must be sufficiently willing to accept a message and, in turn, carry it into other circles. If resistance appears only two links away, a promising start can end abruptly. The decisive question therefore concerns the population&#x27;s receptiveness, rather than simply the special qualities of its first messenger.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>In this account, information passes from the media to the influential few and then from them to the wider public. For marketers, the attraction is clear: persuade a small, identifiable group and let it do much of the remaining work. Stories about trends often appear to support the model, especially when they reveal that a few people adopted a style before it became widely popular.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>A limited circle does not rule out widespread diffusion, but it means that direct persuasion cannot be the whole explanation. The first person&#x27;s acquaintances must influence their own acquaintances, who must then influence others. Each additional link depends on a response beyond the starter&#x27;s immediate reach. The analysis must therefore turn from the first messenger to these later recipients.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied. Their finding pointed to a critical mass of easily influenced people as the principal requirement for extensive cascades. Exceptional starters were not the necessary ingredient they were often assumed to be. The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>That change of attention has a practical consequence. Finding a persuasive spokesperson may be useful, but it does not remove the need to ask whether a message can travel beyond the first audience. A population containing enough receptive people offers opportunities that even a gifted messenger cannot create single-handedly. Explaining a trend therefore requires evidence about both its beginning and the conditions that sustain its continuation.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>A memorable account of the beginning can still form part of that explanation. What it cannot do is stand in for the entire process. By tracing later responses and the conditions under which they connect, we can understand why an apparently strong start sometimes fades and why extensive change may occur without an exceptional starter. Social diffusion is a property of the unfolding network, not merely a biography of its first visible participant.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>argue</td>\n<td>v.主张；论证</td>\n<td>social epidemics</td>\n<td>n.社会流行现象</td>\n<td>be driven by</td>\n<td>由……推动</td>\n</tr>\n<tr>\n<td>in large part</td>\n<td>在很大程度上</td>\n<td>actions</td>\n<td>n.行动</td>\n<td>a tiny minority</td>\n<td>极少数</td>\n</tr>\n<tr>\n<td>special individuals</td>\n<td>特殊个体</td>\n<td>influentials</td>\n<td>n.有影响力的人</td>\n<td>unusually</td>\n<td>adv.不同寻常地</td>\n</tr>\n<tr>\n<td>informed</td>\n<td>adj.见多识广的</td>\n<td>persuasive</td>\n<td>adj.有说服力的</td>\n<td>well connected</td>\n<td>人脉广的</td>\n</tr>\n<tr>\n<td>idea</td>\n<td>n.想法；观点</td>\n<td>intuitively</td>\n<td>adv.凭直觉地</td>\n<td>compelling</td>\n<td>adj.令人信服的</td>\n</tr>\n<tr>\n<td>explain</td>\n<td>v.解释</td>\n<td>actually</td>\n<td>adv.实际上</td>\n<td>spread</td>\n<td>v.传播</td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>supposed</td>\n<td>adj.被认为的</td>\n<td>importance</td>\n<td>n.重要性</td>\n<td>derive from</td>\n<td> h>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>argument</td>\n<td>n.论点</td>\n<td>stem from</td>\n<td>源于</td>\n<td>observation</td>\n<td>n.观察</td>\n</tr>\n<tr>\n<td>with the exception of</td>\n<td>除了</td>\n<td>celebrities</td>\n<td>n.名人</td>\n<td>outsize presence</td>\n<td>超乎寻常的影响力</td>\n</tr>\n<tr>\n<td>primarily</td>\n<td>adv.主要地</td>\n<td>function</td>\n<td>n.作用；结果</td>\n<td>interpersonal</td>\n<td>adj.人际的</td>\n</tr>\n<tr>\n<td>influential members</td>\n<td>有影响力的成员</td>\n<td>population</td>\n<td>n.人群</td>\n<td>interact</td>\n<td>v.互动；交往</td>\n</tr>\n<tr>\n<td>precisely</td>\n<td>adv.恰恰</td>\n<td>according to</td>\n<td>根据</td>\n<td>be supposed to</td>\n<td>被认为会</td>\n</tr>\n<tr>\n<td>colleagues</td>\n<td>n.同事</td>\n<td>directly</td>\n<td>adv.直接地</td>\n<td>occur</td>\n<td>v.发生</td>\n</tr>\n<tr>\n<td>affected</td>\n<td>adj.受到影响的</td>\n<td>acquaintances</td>\n<td>n.熟人</td>\n<td>in turn</td>\n<td>依次；接着</td>\n</tr>\n<tr>\n<td>initial</td>\n<td>adj.最初的</td>\n<td>network</td>\n<td>n.网络</td>\n<td>degrees removed</td>\n<td>相隔的层级</td>\n</tr>\n<tr>\n<td>prove resistant</td>\n<td>表现出抵抗；不接受</td>\n<td>cascade</td>\n<td>n.连锁反应</td>\n<td>propagate</td>\n<td>v.传播</td>\n</tr>\n<tr>\n<td>affect</td>\n<td>v.影响</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第5段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>build on</td>\n<td>以……为基础</td>\n<td>basic truth</td>\n<td>基本事实</td>\n<td>interpersonal influence</td>\n<td>人际影响</td>\n</tr>\n<tr>\n<td>dynamics</td>\n<td>n.动态过程；作用机制</td>\n<td>conduct</td>\n<td>v.开展；进行</td>\n<td>computer simulations</td>\n<td>计算机模拟</td>\n</tr>\n<tr>\n<td>populations</td>\n<td>n.人群</td>\n<td>manipulate</td>\n<td>v.操纵；控制</td>\n<td>variables</td>\n<td>n.变量</td>\n</tr>\n<tr>\n<td>relate to</td>\n<td>与……有关</td>\n<td>ability to influence others</td>\n<td>影响别人的能力</td>\n<td>tendency to be influenced</td>\n<td>受到影响的倾向</td>\n</tr>\n<tr>\n<td>principal requirement</td>\n<td>首要条件</td>\n<td>global cascades</td>\n<td>全局连锁传播</td>\n<td>propagation</td>\n<td>n.传播；扩散</td>\n</tr>\n<tr>\n<td>a critical mass</td>\n<td>达到关键规模的数量</td>\n<td>easily influenced</td>\n<td>容易受到影响的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected. The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<h3>意群划分 · 第1段</h3>\n<p>In his book The Tipping Point, / Malcolm Gladwell argues / that &quot;social epidemics&quot; / are driven in large part / by the actions / of a tiny minority / of special individuals, / often called influentials, / who are unusually informed, / persuasive, / or well connected.</p>\n<p>The idea is intuitively compelling, / but it doesn&#39;t explain / how ideas actually spread.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>在他的书《引爆点》中，/ 马尔科姆·格拉德威尔论证 / &quot;社会流行&quot; / 在很大程度上被驱动 / 通过行动 / 一小部分的 / 特殊个体，/ 通常被称为影响者，/ 他们异常知情，/ 有说服力，/ 或人脉广泛。</p>\n<p>这个想法直觉上很有吸引力，/ 但它没有解释 / 想法实际上如何传播。</p>\n<h3>标准译文 · 第1段</h3>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们异常知情、有说服力或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else. Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods. In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<h3>意群划分 · 第2段</h3>\n<p>The supposed importance of influentials / derives from / a plausible-sounding but largely untested theory / called the &quot;two-step flow of communication&quot;: / Information flows / from the media / to the influentials / and from them / to everyone else.</p>\n<p>Marketers have embraced / the two-step flow / because it suggests / that if they can just find / and influence the influentials, / those select people / will do most of the work / for them.</p>\n<p>The theory also seems to explain / the sudden and unexpected popularity / of certain looks, / brands, / or neighborhoods.</p>\n<p>In many such cases, / a cursory search for causes / finds that / some small group of people / was wearing, / promoting, / or developing / whatever it is / before anyone else paid attention.</p>\n<p>Anecdotal evidence of this kind / fits nicely / with the idea / that only certain special people / can drive trends.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>影响者的假定重要性 / 源自于 / 一个听起来合理但基本未经检验的理论 / 被称为&quot;传播的两步流动&quot;：/ 信息流动 / 从媒体 / 到影响者 / 再从他们 / 到其他所有人。</p>\n<p>营销人员已经接受了 / 两步流动理论 / 因为它暗示 / 如果他们能够找到 / 并影响影响者，/ 那些精选的人 / 将完成大部分工作 / 为他们。</p>\n<p>该理论似乎也解释了 / 突然和意外的流行 / 某些外观的，/ 品牌，/ 或社区。</p>\n<p>在许多这样的情况下，/ 对原因的粗略搜索 / 发现 / 一些小群体 / 正在穿着，/ 推广，/ 或开发 / 无论是什么 / 在其他任何人注意之前。</p>\n<p>这种轶事证据 / 很好地符合 / 这个想法 / 只有某些特殊的人 / 能够驱动趋势。</p>\n<h3>标准译文 · 第2段</h3>\n<p>影响者的假定重要性源于一个听起来合理但基本未经检验的理论，即&quot;传播的两步流动&quot;：信息从媒体流向影响者，再从他们流向其他所有人。营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些精选的人将为他们完成大部分工作。该理论似乎也解释了某些外观、品牌或社区突然和意外的流行。在许多这样的情况下，对原因的粗略搜索发现，在其他任何人注意之前，一些小群体正在穿着、推广或开发这些东西。这种轶事证据很好地符合只有某些特殊的人能够驱动趋势的想法。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed. In fact, they don&#39;t seem to be required at all.</p>\n<h3>意群划分 · 第3段</h3>\n<p>In their recent work, / however, / some researchers / have come up with the finding / that influentials / have far less impact / on social epidemics / than is generally supposed.</p>\n<p>In fact, / they don&#39;t seem to be required / at all.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>在他们最近的工作中，/ 然而，/ 一些研究人员 / 已经得出发现 / 影响者 / 有远更少的影响 / 对社会流行 / 比通常认为的。</p>\n<p>事实上，/ 他们似乎不被需要 / 根本。</p>\n<h3>标准译文 · 第3段</h3>\n<p>然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。事实上，他们似乎根本不是必需的。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others. Yet it is precisely these non-celebrity influentials who, according to the two-step-flow theory, are supposed to drive social epidemics, by influencing their friends and colleagues directly. For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential. If people in the network just two degrees removed from the initial influential prove resistant, for example, the cascade of change won&#39;t propagate very far or affect many people.</p>\n<h3>意群划分 · 第4段</h3>\n<p>The researchers&#39; argument / stems from / a simple observation / about social influence: / With the exception of / a few celebrities / like Oprah Winfrey – / whose outsize presence / is primarily a function / of media, / not interpersonal, influence – / even the most influential members / of a population / simply don&#39;t interact / with that many others.</p>\n<p>Yet it is precisely / these non-celebrity influentials / who, / according to the two-step-flow theory, / are supposed to drive / social epidemics, / by influencing / their friends and colleagues / directly.</p>\n<p>For a social epidemic to occur, / however, / each person so affected / must then influence / his or her own acquaintances, / who must in turn / influence theirs, / and so on; / and just how many others / pay attention to / each of these people / has little to do with / the initial influential.</p>\n<p>If people in the network / just two degrees removed / from the initial influential / prove resistant, / for example, / the cascade of change / won&#39;t propagate very far / or affect many people.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>研究人员的论点 / 源于 / 一个简单的观察 / 关于社会影响：/ 除了 / 少数名人 / 像奥普拉·温弗瑞 – / 她的巨大存在 / 主要是一个功能 / 媒体的，/ 而非人际的，影响 – / 即使是最有影响力的成员 / 人群中的 / 简单地不互动 / 与那么多其他人。</p>\n<p>然而恰恰是 / 这些非名人影响者 / 他们，/ 根据两步流动理论，/ 应该驱动 / 社会流行，/ 通过影响 / 他们的朋友和同事 / 直接地。</p>\n<p>为了社会流行发生，/ 然而，/ 每个如此受影响的人 / 必须然后影响 / 他或她自己的熟人，/ 他们必须反过来 / 影响他们的，/ 等等；/ 到底有多少其他人 / 注意 / 这些人中的每一个 / 与...关系不大 / 最初的影响者。</p>\n<p>如果网络中的人 / 仅仅相隔两度 / 从最初的影响者 / 证明有抵抗力，/ 例如，/ 变化的级联 / 不会传播很远 / 或影响很多人。</p>\n<h3>标准译文 · 第4段</h3>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。然而，根据两步流动理论，恰恰是这些非名人影响者应该通过直接影响他们的朋友和同事来驱动社会流行。然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。例如，如果网络中距离最初影响者仅两度之隔的人证明有抵抗力，变化的级联就不会传播很远或影响很多人。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced. They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<h3>意群划分 · 第5段</h3>\n<p>Building on / this basic truth / about interpersonal influence, / the researchers studied / the dynamics of social influence / by conducting / thousands of computer simulations / of populations, / manipulating / a number of variables / relating to / people&#39;s ability to influence others / and their tendency / to be influenced.</p>\n<p>They found / that the principal requirement / for what is called / &quot;global cascades&quot; – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>基于 / 这个基本事实 / 关于人际影响，/ 研究人员研究了 / 社会影响的动态 / 通过进行 / 数千次计算机模拟 / 人群的，/ 操纵 / 许多变量 / 涉及 / 人们影响他人的能力 / 和他们的倾向 / 被影响。</p>\n<p>他们发现 / 主要要求 / 对于被称为 / &quot;全球级联&quot;的 – / 广泛传播 / 影响的 / 通过网络 – / 是存在 / 不是少数影响者 / 而是，相反，/ 临界质量 / 容易被影响的人。</p>\n<h3>标准译文 · 第5段</h3>\n<p>基于这个关于人际影响的基本事实，研究人员通过对人群进行数千次计算机模拟来研究社会影响的动态，操纵涉及人们影响他人的能力和他们被影响倾向的许多变量。他们发现，所谓&quot;全球级联&quot;——影响通过网络的广泛传播——的主要要求不是少数影响者的存在，而是存在临界质量的容易被影响的人。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)</h2>\n<p><strong>第1段</strong></p>\n<p>In his book The Tipping Point → Malcolm Gladwell argues：(that &quot;social epidemics&quot; → are driven in large part → by the actions：(of a tiny minority：(of special individuals：(often called influentials：(who are unusually informed + persuasive + or well connected))))).</p>\n<p>The idea is intuitively compelling // but it doesn&#39;t explain：(how ideas actually spread).</p>\n<p><strong>第2段</strong></p>\n<p>The supposed importance of influentials → derives from → a plausible-sounding but largely untested theory：(called the &quot;two-step flow of communication&quot;)：Information flows：(from the media → to the influentials) + (from them → to everyone else).</p>\n<p>Marketers have embraced → the two-step flow → because it suggests：(that if they can just find + influence the influentials → those select people → will do most of the work：(for them)).</p>\n<p>The theory also seems to explain → the sudden and unexpected popularity：(of certain looks + brands + or neighborhoods).</p>\n<p>In many such cases → a cursory search for causes → finds：(that some small group of people → was wearing + promoting + or developing → whatever it is：(before anyone else paid attention)).</p>\n<p>Anecdotal evidence of this kind → fits nicely：(with the idea：(that only certain special people → can drive trends)).</p>\n<p><strong>第3段</strong></p>\n<p>In their recent work, however // some researchers → have come up with the finding：(that influentials → have far less impact：(on social epidemics)：(than is generally supposed)).</p>\n<p>In fact → they don&#39;t seem to be required → at all.</p>\n<p><strong>第4段</strong></p>\n<p>The researchers&#39; argument → stems from → a simple observation：(about social influence)：With the exception of：(a few celebrities：(like Oprah Winfrey))：(whose outsize presence → is primarily a function：(of media, not interpersonal, influence)) → even the most influential members：(of a population) → simply don&#39;t interact：(with that many others).</p>\n<p>Yet it is precisely → these non-celebrity influentials：(who：(according to the two-step-flow theory) → are supposed to drive → social epidemics：(by influencing → their friends and colleagues → directly)).</p>\n<p>For a social epidemic to occur, however → each person so affected → must then influence → his or her own acquaintances：(who must in turn → influence theirs) + and so on; + just how many others → pay attention to → each of these people → has little to do with → the initial influential.</p>\n<p>If people in the network：(just two degrees removed：(from the initial influential)) → prove resistant → for example → the cascade of change → won&#39;t propagate very far + or affect many people.</p>\n<p><strong>第5段</strong></p>\n<p>Building on → this basic truth：(about interpersonal influence) → the researchers studied → the dynamics of social influence：(by conducting → thousands of computer simulations：(of populations))：(manipulating → a number of variables：(relating to → people&#39;s ability to influence others + their tendency → to be influenced)).</p>\n<p>They found：(that the principal requirement：(for what is called → &quot;global cascades&quot;)：(the widespread propagation：(of influence：(through networks))) → is the presence：(not of a few influentials // but, rather, of a critical mass：(of easily influenced people))).</p>\n<h2>中文版句子逻辑（选修)</h2>\n<p><strong>第1段</strong></p>\n<p>在他的书《引爆点》中 → 马尔科姆·格拉德威尔论证：(&quot;社会流行&quot; → 在很大程度上被驱动 → 通过行动：(一小部分的：(特殊个体：(通常被称为影响者：(他们异常知情 + 有说服力 + 或人脉广泛)))))。</p>\n<p>这个想法直觉上很有吸引力 // 但它没有解释：(想法实际上如何传播)。</p>\n<p><strong>第2段</strong></p>\n<p>影响者的假定重要性 → 源自于 → 一个听起来合理但基本未经检验的理论：(被称为&quot;传播的两步流动&quot;)：信息流动：(从媒体 → 到影响者) + (从他们 → 到其他所有人)。</p>\n<p>营销人员已经接受了 → 两步流动理论 → 因为它暗示：(如果他们能够找到 + 影响影响者 → 那些精选的人 → 将完成大部分工作：(为他们))。</p>\n<p>该理论似乎也解释了 → 突然和意外的流行：(某些外观的 + 品牌 + 或社区)。</p>\n<p>在许多这样的情况下 → 对原因的粗略搜索 → 发现：(一些小群体 → 正在穿着 + 推广 + 或开发 → 无论是什么：(在其他任何人注意之前))。</p>\n<p>这种轶事证据 → 很好地符合：(这个想法：(只有某些特殊的人 → 能够驱动趋势))。</p>\n<p><strong>第3段</strong></p>\n<p>在他们最近的工作中，然而 // 一些研究人员 → 已经得出发现：(影响者 → 有远更少的影响：(对社会流行)：(比通常认为的))。</p>\n<p>事实上 → 他们似乎不被需要 → 根本。</p>\n<p><strong>第4段</strong></p>\n<p>研究人员的论点 → 源于 → 一个简单的观察：(关于社会影响)：除了：(少数名人：(像奥普拉·温弗瑞))：(她的巨大存在 → 主要是一个功能：(媒体的，而非人际的，影响)) → 即使是最有影响力的成员：(人群中的) → 简单地不互动：(与那么多其他人)。</p>\n<p>然而恰恰是 → 这些非名人影响者：(他们：(根据两步流动理论) → 应该驱动 → 社会流行：(通过影响 → 他们的朋友和同事 → 直接地))。</p>\n<p>为了社会流行发生，然而 → 每个如此受影响的人 → 必须然后影响 → 他或她自己的熟人：(他们必须反过来 → 影响他们的) + 等等；+ 到底有多少其他人 → 注意 → 这些人中的每一个 → 与...关系不大 → 最初的影响者。</p>\n<p>如果网络中的人：(仅仅相隔两度：(从最初的影响者)) → 证明有抵抗力 → 例如 → 变化的级联 → 不会传播很远 + 或影响很多人。</p>\n<p><strong>第5段</strong></p>\n<p>基于 → 这个基本事实：(关于人际影响) → 研究人员研究了 → 社会影响的动态：(通过进行 → 数千次计算机模拟：(人群的))：(操纵 → 许多变量：(涉及 → 人们影响他人的能力 + 他们的倾向 → 被影响))。</p>\n<p>他们发现：(主要要求：(对于被称为 → &quot;全球级联&quot;的)：(广泛传播：(影响的：(通过网络))) → 是存在：(不是少数影响者 // 而是，相反，临界质量：(容易被影响的人)))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>In his book The Tipping Point, / Malcolm Gladwell argues / that &quot;social epidemics&quot; / are driven in large part / by the actions / of a tiny minority / of special individuals, / often called influentials, / who are unusually informed, / persuasive, / or well connected.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在他的书《引爆点》中，/ 马尔科姆·格拉德威尔论证 / &quot;社会流行&quot; / 在很大程度上被驱动 / 通过行动 / 一小部分的 / 特殊个体，/ 通常被称为影响者，/ 他们异常知情，/ 有说服力，/ 或人脉广泛。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把“在他的书中”与书名放到一起，确定说话的出处：</p>\n<blockquote>\n<p>在其著作《引爆点》中</p>\n</blockquote>\n<p>把层层补充的个体说明接到同一个对象上：</p>\n<blockquote>\n<p>一小部分特殊个体的行动；这些人通常被称为影响者</p>\n</blockquote>\n<p>最后把三项并列特点合并：</p>\n<blockquote>\n<p>异常知情、有说服力或人脉广泛</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>格拉德威尔在《引爆点》中提出一个判断\n社会流行在很大程度上由一小部分特殊个体的行动驱动\n接着补充这些人的称呼和三项特点</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>格拉德威尔认为，社会流行由少数特殊个体的行动驱动。</p>\n</blockquote>\n<p>把书名放在“认为”之前；“在很大程度上”放在“由……驱动”之前保留程度；个体的称呼与特点接在主判断之后，避免连续堆在“行动”前。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>格拉德威尔在《引爆点》中认为，社会流行在很大程度上被一小部分特殊个体的行动驱动；这些个体通常被叫作影响者，他们异常知情、有说服力或人脉广泛。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>将“被……行动驱动”整理为“由……的行动所驱动”，表达关系更顺；把“这些个体”接为“这些人”，承接前面的对象；三项特点保持并列，保留“或”，不把原文变成每个人都必须具备三项。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们异常知情、有说服力或人脉广泛。</p>\n</blockquote>\n<h2>2. 第4段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>For a social epidemic to occur, / however, / each person so affected / must then influence / his or her own acquaintances, / who must in turn / influence theirs, / and so on; / and just how many others / pay attention to / each of these people / has little to do with / the initial influential.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>为了社会流行发生，/ 然而，/ 每个如此受影响的人 / 必须然后影响 / 他或她自己的熟人，/ 他们必须反过来 / 影响他们的，/ 等等；/ 到底有多少其他人 / 注意 / 这些人中的每一个 / 与...关系不大 / 最初的影响者。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把目的放到前面，并把“如此受影响的人”作为完整对象：</p>\n<blockquote>\n<p>为了让社会流行发生，每个受影响的人</p>\n</blockquote>\n<p>把连续的影响动作接成接力过程：</p>\n<blockquote>\n<p>先影响自己的熟人，这些熟人又影响他们的熟人，以此类推</p>\n</blockquote>\n<p>后半句把“有多少其他人关注每一个人”整体保留，不拆成“这些人与起点没关系”：</p>\n<blockquote>\n<p>每个接力者吸引多少其他人关注，与最初的影响者关系不大</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>社会流行要发生，需要受影响的人继续向熟人传递\n这种传递逐层继续\n后续每个人吸引的关注人数，与起点人物关系不大</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>每个受影响的人必须继续影响熟人；后续关注人数与最初影响者关系不大。</p>\n</blockquote>\n<p>前半句先放目的，再安排逐层重复的动作；后半句将“有多少其他人关注这些人中的每一个”整个放在“关系不大”前。两部分用分号分开，保留“接力传播”和“后续人数”的区别。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>然而，要让社会流行发生，每个受到影响的人必须再影响自己的熟人，熟人再影响他们的熟人，以此类推；有多少其他人关注每一个这样的人，与最初影响者没有多大关系。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>用“为了让……发生”把目的表达完整；将连续重复的“熟人”适当换成“这些人”承接，仍保留下一层熟人；将“没有多大关系”整理为“关系不大”，不能改成“完全无关”。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<h2>3. 第5段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>They found / that the principal requirement / for what is called / &quot;global cascades&quot; – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们发现 / 主要要求 / 对于被称为 / &quot;全球级联&quot;的 – / 广泛传播 / 影响的 / 通过网络 – / 是存在 / 不是少数影响者 / 而是，相反，/ 临界质量 / 容易被影响的人。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把名称与解释合在一起：</p>\n<blockquote>\n<p>所谓“全球级联”，也就是影响通过网络的广泛传播</p>\n</blockquote>\n<p>再把“主要要求”和后面的存在条件相接：</p>\n<blockquote>\n<p>关键条件不是有少数影响者，而是有达到关键规模的易受影响者</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>研究人员发现了广泛传播的主要条件\n不是少数影响者的存在\n而是有足够规模的容易受影响的人</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>他们发现，主要条件不是少数影响者，而是达到关键规模的易受影响者。</p>\n</blockquote>\n<p>“他们发现”放在最前面；“全球级联”与解释一起作“主要要求”的范围；最后保留“不是……而是……”的对照，把人数规模留在后一个条件里。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他们发现，所谓全球级联，也就是影响通过网络广泛传播，其主要要求不是存在几个影响者，而是存在达到临界规模的、容易受影响的人。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>名称后用破折号容纳解释，避免主判断被“也就是”拖得太长；把“不是存在几个”整理为“不是少数……的存在”，与后项对照。材料中的“临界质量”指达到关键规模的人群数量，不是对人的品质作评价。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>他们发现，所谓&quot;全球级联&quot;——影响通过网络的广泛传播——的主要要求不是少数影响者的存在，而是存在临界质量的容易被影响的人。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>31题</h2>\n<blockquote>\n<p>By citing the book The Tipping Point, the author intends to ______.</p>\n<p>作者引用《引爆点》，意在做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例子作用题。书名锁定第一段，题干问引用的目的，需要把书中观点、作者紧接着的回应和后文的展开连起来。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<p>第一句提出“少数特殊人物推动社会流行”的解释；第二句的 but 把关注点转到这种解释能否说明观念传播；第三段再用研究结果检验特殊人物的作用。人物的特点是讨论对象的介绍，讨论他们在传播中的作用才是引用的用途。</p>\n<h3>A. analyze the consequences of social epidemics</h3>\n<blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 driven by 和 how ideas actually spread，已经分清原文追问的是产生与传播，而 A 问发生后的后果，所以第一轮排除了 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>social epidemics</code>，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><code>consequences</code>问的是流行之后发生什么；回看开头<code>driven</code>和结尾<code>spread</code>，文中谈的却是流行怎样产生和传播。</p>\n<p><code>A</code>把引用这本书的目的说成分析社会流行的后果。先把因果两端摆清：首句是特殊人物的行动推动<code>social epidemics</code>，流行是被解释的现象；末句又问<code>ideas</code>怎样<code>spread</code>，仍在解释这一现象怎样形成和传开。</p>\n<p><code>A</code>中的<code>consequences</code>却把社会流行放到原因一端，要继续谈它造成了什么。两种问题的方向不同，不能因为都出现<code>social epidemics</code>就当成同一件事。书中人物的行动、信息传播以及流行之后产生的后果，是三个不同位置；首段连起来讨论的是前两个位置，<code>A</code>把问题带到了第三个位置。</p>\n<p>它不能回答这本书为何被用来引出传播问题。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。</p>\n</blockquote>\n<p>首句先交代书中对流行起因的解释，转折句追问它能不能解释实际传播。后文仍在研究传播机制，没有沿着流行发生后的社会后果展开。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The book helps explain what happens to a society after an idea has become widely popular.</p>\n<p>这本书帮助解释一个观念广泛流行以后，社会会发生什么变化。</p>\n</blockquote>\n<p><code>A</code> 所需要的是“流行已经出现 → 再讨论后果”；原文实际是“提出驱动流行的解释 → 追问如何传开”。两条路线从要解释的问题上就不同。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. discuss influentials’ function in spreading ideas</h3>\n<blockquote>\n<p>作者引用这本书，是为了讨论有影响力者在传播观念中的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮里，B 能接住 driven by 和 ideas actually spread，因此保留；D 也对应人物特征，当时暂留 B、D。最后把第三至五段的研究接起来，才确定引用是为讨论传播作用，最终选 B。</p>\n<p><strong>选项类型：例子作用概括。</strong></p>\n<p>它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。<code>discuss</code> 只表示讨论，不要求作者赞同书里的判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了讨论有影响力者在传播观念中的作用。</p>\n</blockquote>\n<p>先看书中主张的完整关系：少数特殊人物的行动在很大程度上推动了<code>social epidemics</code>。<code>influentials</code>是这些人，<code>driven by</code>说的是他们对传播起什么作用，正好对应B的<code>function in spreading ideas</code>。</p>\n<p>作者紧接着写<code>The idea is intuitively compelling, but ...</code>，先承认这种解释听起来有说服力，再指出它并未解释观念实际如何传播。第三段又引入研究，认为这群人的作用远小于一般人的想象。这些句子都在检验同一个问题：流行是否主要靠少数特殊人物推动。</p>\n<p>B用的是<code>discuss</code>，不是<code>approve of</code>。讨论可以从介绍一种看法开始，也可以通过后面的研究反对它。书的观点为后文提供了要检验的对象，因此“讨论这些人的传播作用”能贯穿引用和后文。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>书中先提出影响者很重要，作者接着指出解释不足，再引入影响者作用远小于想象的研究。后文是在检验他们的作用，而不是补写人物介绍。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Gladwell assigns influentials a major role in spreading ideas, but researchers question how much influence they actually have.</p>\n<p>格拉德威尔认为影响者在观念传播中起重要作用，但研究人员质疑他们实际能起多大作用。</p>\n</blockquote>\n<p><code>B</code> 所需的“先提出作用 → 再讨论、检验作用”已经完整出现在文章中。作者可以最后反对原理论，但这一过程仍属于讨论影响者的传播功能。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. exemplify people’s intuitive response to social epidemics</h3>\n<blockquote>\n<p>作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 C 的 exemplify 被遮挡，原文 compelling 也被遮挡；但能读出的 people’s intuitive response 已经把对象换成公众对流行的反应。根据 The idea 回指书中解释，第一轮就排除了 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>intuitively</code> 说的是这套理论在直觉上令人信服；<code>C</code> 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。</p>\n</blockquote>\n<p><code>exemplify</code>是举例说明，C要说明的是<code>people’s intuitive response to social epidemics</code>，也就是人们面对流行现象时产生了怎样的直觉反应。</p>\n<p>原文的<code>intuitively</code>却在评价<code>The idea</code>。这个<code>idea</code>回指书中“少数特殊人物推动社会流行”的解释；<code>compelling</code>说这套解释凭直觉看很有说服力。被评价的是一个解释，不是人们看到某种潮流后作出的反应。</p>\n<p>再把<code>but</code>后半句接上：作者马上追问这套解释能否说明观念实际怎样传播。如果本段在举例说明公众反应，后面应当接公众怎样想、怎样行动；这里接的却是对理论解释力的质疑。C虽用了相近的<code>intuitive</code>，所说的事情并没有与这一句对应。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。</p>\n</blockquote>\n<p>作者评价这套解释“直觉上有吸引力”，随即用 <code>but</code> 指出它不能说明实际传播。后文转向传播研究，没有列举公众面对某种潮流的直觉反应。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The book gives examples of how people instinctively react when a social epidemic occurs.</p>\n<p>这本书举例展示社会流行发生时，人们会怎样凭直觉作出反应。</p>\n</blockquote>\n<p><code>C</code> 至少需要“流行现象出现 → 人们产生某种直觉反应”的例子。实际句子的主语是 <code>The idea</code>，转折后检验的也是这个解释，不能把理论的说服力当成人群反应。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. describe the essential characteristics of influentials</h3>\n<blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮确实看到了 informed、persuasive、well connected，D 因而与 B 一起保留。最后回查后文发现文章持续检验传播作用，人物特征只是引入对象，于是排除 D、选择 B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，<code>D</code> 却把用来介绍对象的一小段内容当成引用的主要目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><code>essential characteristics</code>对应<code>informed</code>、<code>persuasive</code>、<code>well connected</code>，确实能在第一句找到人物特征。</p>\n<p><code>characteristics</code> 确实能对应 <code>informed, persuasive, or well connected</code>，这些特点不是虚构的。但它们位于介绍 influentials 的从句中，先说明这套理论在谈哪一类人。</p>\n<p>题干的 <code>By citing ... intends to</code> 问引用要推进什么讨论。段末追问观念如何传播，第三段检验影响者的实际作用，后文继续研究传播条件。D 只复述引入对象时的局部内容，没有回答这处引述在论证中的用途。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p><code>who</code> 从句介绍影响者是什么样的人；紧接着的 <code>but</code> 切入传播解释是否成立。第三段继续谈 <code>impact</code>，第四、五段继续谈传播条件，讨论对象已经从特征转到了作用。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The book identifies the defining qualities of influentials, and the discussion goes on to explain these qualities in detail.</p>\n<p>这本书列出影响者的基本特征，后文接着逐项说明这些特征。</p>\n</blockquote>\n<p><code>D</code> 若作为引用目的，后文就应继续刻画或区分那些特征。实际后文既不继续讲见识，也不展开说服力，而是检验影响者能否推动扩散。真实细节不能代替例子作用。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>31题结论</h3>\n<blockquote>\n<p><strong>31. B. discuss influentials’ function in spreading ideas</strong></p>\n</blockquote>\n<ul>\n<li>A：它借用了 social epidemics，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。</li>\n<li>B：它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。discuss 只表示讨论，不要求作者赞同书里的判断。</li>\n<li>C：intuitively 说的是这套理论在直觉上令人信服；C 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。</li>\n<li>D：特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，D 却把用来介绍对象的一小段内容当成引用的主要目的。</li>\n</ul>\n<h2>32题</h2>\n<blockquote>\n<p>The author suggests that the “two-step-flow theory” ______.</p>\n<p>作者认为“两级传播理论”怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部作者观点题。对象是第二段的两级传播理论，需要区分营销人员为什么喜欢它，以及作者怎样评价它的可靠性。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<p>largely untested 点出检验不足，seems to explain 只是表面解释力，anecdotal evidence 是零散事例。第三段 however 后的研究又削弱了它所夸大的影响者作用。把这些评价连起来，才能回答作者对理论的看法。</p>\n<h3>A. serves as a solution to marketing problems</h3>\n<blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读到 largely untested，以及第三段 however 后削弱影响者作用的发现。A 把营销人员期待的办法当成作者确认有效的办法，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。<code>A</code> 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><code>marketing problems</code>让我们回到<code>Marketers</code>和<code>do most of the work</code>，看看这一效果是谁期待的。</p>\n<p><code>A</code>把理论写成解决营销问题的办法。第二段确实出现一条营销设想：如果找到并影响少数人，那些人就会替营销人员完成大部分工作。</p>\n<p>但<code>if they can</code>写的是预期办法，不是已经发生的效果；题干还要求作者的判断，不能把营销人员的设想直接安在作者身上。第二段说理论<code>largely untested</code>，紧接着第三段用<code>however</code>引入研究发现：有影响力者的实际作用远小于通常想象，甚至并非必需。两段连起来是在检验并削弱营销设想赖以成立的前提。</p>\n<p><code>A</code>却把这一被质疑的传播捷径当成作者确认的解决办法，评价归属和论证方向都接不上。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些选中的人会替营销人员完成大部分传播工作。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>第二段从<code>Marketers have embraced</code>写起，交代营销人员为什么接受理论：它许诺找到少数影响者后，传播工作就会容易得多。第三段的<code>however</code>没有接上这种办法的成效，而是引入研究，指出少数影响者的作用被高估。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Finding and influencing these people can provide marketers with a workable way to spread their message.</p>\n<p>找到并影响这些人，可以为营销人员提供一种切实可行的信息传播办法。</p>\n</blockquote>\n<p>A需要作者把这条途径当成可用的解决办法，不要求作者宣布所有营销问题都已解决。实际的后文却在削弱这条途径所依赖的前提：起点人物不能决定后续各层会不会继续接受影响。营销人员觉得它好用，与作者认可它能够解决问题，仍是两种判断。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. has helped explain certain prevalent trends</h3>\n<blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 prevalent 被遮挡，但 helped explain 仍可与 seems to explain 比较。结合未经充分检验和后文 however 的研究评价，第一轮没有把表面解释力当成作者结论，排除了 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了原文对流行现象的介绍，保留了 <code>explain</code>，却丢掉 <code>seems</code> 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><code>helped explain</code>对应<code>seems to explain</code>，但后者前面多了<code>seems</code>，要连同<code>untested</code>一起读。</p>\n<p><code>B</code>能对应第二段的<code>seems to explain</code>：理论表面上可以把小群体先行动与后来出现的潮流连起来。<code>has helped explain</code>不等于理论已经经过严格证明，不能单凭这两个时态就判错；真正需要继续看的，是作者怎样处理这份解释。</p>\n<p>第一段已经说这种想法不能解释观念实际怎样传播，第二段谨慎写<code>seems</code>，第三段又以<code>however</code>转向研究对特殊人物作用的削弱。作者在交代一种看起来合理的解释，并没有把“它已帮助解释潮流”作为自己的结论。</p>\n<p><code>B</code>拿走了被介绍的解释力，却漏掉作者连续保留、随后反驳的关系，因此不能作为题干所问的作者判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。该理论似乎也解释了某些外观、品牌或社区突然和意外的流行。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>第二段先展示理论看起来能够解释的现象，再把支撑材料称作<code>anecdotal evidence</code>。第三段转向研究，发现影响者的作用远小于通常的想象。作者是在追问这个解释是否站得住，而没有沿着“它已经解释了潮流”继续补充结果。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The theory helps explain the popularity of these trends by showing how a few early adopters influence the wider public.</p>\n<p>这一理论通过说明少数早期采用者如何影响大众，帮助解释了这些趋势为何流行。</p>\n</blockquote>\n<p>B所需要的是作者对这份解释力的认可，并不要求额外写成“研究已经完全证明理论”。原文却在第一段说它解释不了实际传播，第二段保留<code>seems</code>，第三段再质疑少数人的关键作用。把这些前后评价连起来，不能只留下“帮助解释流行”的肯定。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. has won support from influentials</h3>\n<blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 embraced 被遮挡，但句子的主语 Marketers 和 find and influence 后面的 influentials 可见。两类人的角色并不相同，不能把被寻找的人当作支持理论的人，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；<code>C</code> 把宾语位置的一群人换成了表态支持的主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><code>has won support from influentials</code>中的<code>from</code>说明支持来自有影响力者。要核对这项，就看原文里谁接受了理论。</p>\n<p>第二段写的是<code>Marketers have embraced the two-step flow</code>。<code>embraced</code>在这里表示接受、支持，主语<code>Marketers</code>是营销人员。接着的<code>because</code>解释他们的理由：如果能找到并影响<code>the influentials</code>，这些人就会替他们完成大部分传播工作。</p>\n<p>同一句里，两类人各有位置：营销人员接受理论，影响者是营销人员准备寻找和影响的对象。C把被利用来传播信息的人，换成了表态支持理论的人。后文也只讨论影响者实际能起多大作用，没有给出他们对这一理论的态度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些选中的人会替营销人员完成大部分传播工作。</p>\n</blockquote>\n<p>句子从 <code>Marketers</code> 出发，解释他们为何接受理论；后面 <code>if</code> 从句仍在说他们怎样利用 <code>influentials</code>。后文研究这些人的作用，也没有让他们出来为理论背书。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Influentials have embraced the two-step-flow theory and expressed their support for it.</p>\n<p>有影响力者已经接受两级传播理论，并表达了对它的支持。</p>\n</blockquote>\n<p><code>C</code> 需要影响者本人作出支持行为，实际支持行为的主语却是 <code>Marketers</code>。理论赋予某群人重要作用，不等于这群人赞成这套理论。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. requires solid evidence for its validity</h3>\n<blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 largely untested 可见，零散事例与理论相合却不足以证明因果，第三段又给出不同的研究结果。D 概括了需要可靠证据检验有效性的意思，第一轮保留并最终选择 D。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把 <code>untested</code>、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><code>solid evidence</code>和<code>validity</code>要回到<code>largely untested</code>，它直接关系到理论有没有受到检验。</p>\n<p><code>D</code>问的是理论是否有效需要什么，而不是它是否吸引过人。<code>largely untested</code>说明检验不足；第二段末尾的<code>fits nicely</code>说明那些先行动、后流行的例子与理论相合。</p>\n<p>小群体先行动、后来出现潮流，说明时间先后与理论相合，却尚不能证明正是他们的特殊性造成了后续扩散。第三段的研究结果与人们通常的想象不同，进一步说明表面符合与实际影响不能混在一起。<code>D</code>要求用可靠证据检验有效性，承接了这个区别。</p>\n<p>它没有武断宣判理论所有部分都错误，也没有把营销人员的期待当作成效，保留了作者对未经充分检验的解释所持的审慎态度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>影响者的假定重要性源于一个听起来合理但基本未经检验的理论，即&quot;传播的两步流动&quot;：信息从媒体流向影响者，再从他们流向其他所有人。这种轶事证据很好地符合只有某些特殊的人能够驱动趋势的想法。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>第二段先指出理论未经充分检验，再展示与它相合的零散例子；第三段用研究发现打破“看起来符合就算证明”的推断。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The theory may sound plausible, but its validity needs to be established by solid evidence rather than anecdotal examples.</p>\n<p>理论可能听起来合理，但其有效性需要由扎实证据来确立，不能只靠零散事例。</p>\n</blockquote>\n<p>这正好对应原文由表面合理走向实际检验的推进。<code>D</code> 保留的是证据要求，没有替作者添加“理论绝对无效”的更强结论。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>32题结论</h3>\n<blockquote>\n<p><strong>32. D. requires solid evidence for its validity</strong></p>\n</blockquote>\n<ul>\n<li>A：营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。A 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。</li>\n<li>B：它借用了原文对流行现象的介绍，保留了 explain，却丢掉 seems 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。</li>\n<li>C：明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；C 把宾语位置的一群人换成了表态支持的主体。</li>\n<li>D：它把 untested、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。</li>\n</ul>\n<h2>33题</h2>\n<blockquote>\n<p>What the researchers have observed recently shows that ______.</p>\n<p>研究人员最近的观察说明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节与局部概括题。observed 对应第四段的 observation，问的是这项观察支持的关系，不是从段中挑一句关于媒体的描述。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the
