luentials 的从句中，先说明这套理论在谈哪一类人。\n\n题干的 `By citing ... intends to` 问引用要推进什么讨论。段末追问观念如何传播，第三段检验影响者的实际作用，后文继续研究传播条件。D 只复述引入对象时的局部内容，没有回答这处引述在论证中的用途。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q31-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮确实看到了 informed、persuasive、well connected，D 因而与 B 一起保留。最后回查后文发现文章持续检验传播作用，人物特征只是引入对象，于是排除 D、选择 B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，<code>D</code> 却把用来介绍对象的一小段内容当成引用的主要目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><code>essential characteristics</code>对应<code>informed</code>、<code>persuasive</code>、<code>well connected</code>，确实能在第一句找到人物特征。</p>\n<p><code>characteristics</code> 确实能对应 <code>informed, persuasive, or well connected</code>，这些特点不是虚构的。但它们位于介绍 influentials 的从句中，先说明这套理论在谈哪一类人。</p>\n<p>题干的 <code>By citing ... intends to</code> 问引用要推进什么讨论。段末追问观念如何传播，第三段检验影响者的实际作用，后文继续研究传播条件。D 只复述引入对象时的局部内容，没有回答这处引述在论证中的用途。</p>\n</section>"},{"title":"D. describe the essential characteristics of influentials","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n>\n> 马尔科姆·格拉德威尔在其著作《引爆点》中认为，\"社会流行\"在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。\n\n`who` 从句介绍影响者是什么样的人；紧接着的 `but` 切入传播解释是否成立。第三段继续谈 `impact`，第四、五段继续谈传播条件，讨论对象已经从特征转到了作用。\n\n如果`D`真是作者的意思，文章至少得写成：\n\n> The book identifies the defining qualities of influentials, and the discussion goes on to explain these qualities in detail.\n>\n> 这本书列出影响者的基本特征，后文接着逐项说明这些特征。\n\n`D` 若作为引用目的，后文就应继续刻画或区分那些特征。实际后文既不继续讲见识，也不展开说服力，而是检验影响者能否推动扩散。真实细节不能代替例子作用。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q31-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮确实看到了 informed、persuasive、well connected，D 因而与 B 一起保留。最后回查后文发现文章持续检验传播作用，人物特征只是引入对象，于是排除 D、选择 B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，<code>D</code> 却把用来介绍对象的一小段内容当成引用的主要目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><code>essential characteristics</code>对应<code>informed</code>、<code>persuasive</code>、<code>well connected</code>，确实能在第一句找到人物特征。</p>\n<p><code>characteristics</code> 确实能对应 <code>informed, persuasive, or well connected</code>，这些特点不是虚构的。但它们位于介绍 influentials 的从句中，先说明这套理论在谈哪一类人。</p>\n<p>题干的 <code>By citing ... intends to</code> 问引用要推进什么讨论。段末追问观念如何传播，第三段检验影响者的实际作用，后文继续研究传播条件。D 只复述引入对象时的局部内容，没有回答这处引述在论证中的用途。</p>\n</section><section class=\"revealPart\" id=\"focus-q31-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p><code>who</code> 从句介绍影响者是什么样的人；紧接着的 <code>but</code> 切入传播解释是否成立。第三段继续谈 <code>impact</code>，第四、五段继续谈传播条件，讨论对象已经从特征转到了作用。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The book identifies the defining qualities of influentials, and the discussion goes on to explain these qualities in detail.</p>\n<p>这本书列出影响者的基本特征，后文接着逐项说明这些特征。</p>\n</blockquote>\n<p><code>D</code> 若作为引用目的，后文就应继续刻画或区分那些特征。实际后文既不继续讲见识，也不展开说服力，而是检验影响者能否推动扩散。真实细节不能代替例子作用。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. B. discuss influentials’ function in spreading ideas**\n\n- A：它借用了 social epidemics，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。\n- B：它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。discuss 只表示讨论，不要求作者赞同书里的判断。\n- C：intuitively 说的是这套理论在直觉上令人信服；C 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。\n- D：特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，D 却把用来介绍对象的一小段内容当成引用的主要目的。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"31","questionConclusion":true},"html":"<blockquote>\n<p><strong>31. B. discuss influentials’ function in spreading ideas</strong></p>\n</blockquote>\n<ul>\n<li>A：它借用了 social epidemics，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。</li>\n<li>B：它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。discuss 只表示讨论，不要求作者赞同书里的判断。</li>\n<li>C：intuitively 说的是这套理论在直觉上令人信服；C 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。</li>\n<li>D：特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，D 却把用来介绍对象的一小段内容当成引用的主要目的。</li>\n</ul>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> The author suggests that the “two-step-flow theory” ______.\n>\n> 作者认为“两级传播理论”怎么样？\n\n### 题型\n\n局部作者观点题。对象是第二段的两级传播理论，需要区分营销人员为什么喜欢它，以及作者怎样评价它的可靠性。\n\n### 核心出处\n\n> The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from the media to the influentials and from them to everyone else.\n>\n> The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.\n>\n> Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n\nlargely untested 点出检验不足，seems to explain 只是表面解释力，anecdotal evidence 是零散事例。第三段 however 后的研究又削弱了它所夸大的影响者作用。把这些评价连起来，才能回答作者对理论的看法。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"32","questionIntro":true},"html":"<blockquote>\n<p>The author suggests that the “two-step-flow theory” ______.</p>\n<p>作者认为“两级传播理论”怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部作者观点题。对象是第二段的两级传播理论，需要区分营销人员为什么喜欢它，以及作者怎样评价它的可靠性。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<p>largely untested 点出检验不足，seems to explain 只是表面解释力，anecdotal evidence 是零散事例。第三段 however 后的研究又削弱了它所夸大的影响者作用。把这些评价连起来，才能回答作者对理论的看法。</p>\n"},{"title":"A. serves as a solution to marketing problems","raw":"### A. serves as a solution to marketing problems\n\n> 作者认为，两级传播理论能作为解决营销问题的办法。\n\n**做题模式中的状态：** 当时已读到 largely untested，以及第三段 however 后削弱影响者作用的发现。A 把营销人员期待的办法当成作者确认有效的办法，第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\n营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。`A` 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。\n\n**出处：**\n\n> Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q32-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读到 largely untested，以及第三段 however 后削弱影响者作用的发现。A 把营销人员期待的办法当成作者确认有效的办法，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。<code>A</code> 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section>"},{"title":"A. serves as a solution to marketing problems","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 作者认为，两级传播理论能作为解决营销问题的办法。\n\n`marketing problems`让我们回到`Marketers`和`do most of the work`，看看这一效果是谁期待的。\n\n`A`把理论写成解决营销问题的办法。第二段确实出现一条营销设想：如果找到并影响少数人，那些人就会替营销人员完成大部分工作。\n\n但`if they can`写的是预期办法，不是已经发生的效果；题干还要求作者的判断，不能把营销人员的设想直接安在作者身上。第二段说理论`largely untested`，紧接着第三段用`however`引入研究发现：有影响力者的实际作用远小于通常想象，甚至并非必需。两段连起来是在检验并削弱营销设想赖以成立的前提。\n\n`A`却把这一被质疑的传播捷径当成作者确认的解决办法，评价归属和论证方向都接不上。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q32-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读到 largely untested，以及第三段 however 后削弱影响者作用的发现。A 把营销人员期待的办法当成作者确认有效的办法，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。<code>A</code> 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><code>marketing problems</code>让我们回到<code>Marketers</code>和<code>do most of the work</code>，看看这一效果是谁期待的。</p>\n<p><code>A</code>把理论写成解决营销问题的办法。第二段确实出现一条营销设想：如果找到并影响少数人，那些人就会替营销人员完成大部分工作。</p>\n<p>但<code>if they can</code>写的是预期办法，不是已经发生的效果；题干还要求作者的判断，不能把营销人员的设想直接安在作者身上。第二段说理论<code>largely untested</code>，紧接着第三段用<code>however</code>引入研究发现：有影响力者的实际作用远小于通常想象，甚至并非必需。两段连起来是在检验并削弱营销设想赖以成立的前提。</p>\n<p><code>A</code>却把这一被质疑的传播捷径当成作者确认的解决办法，评价归属和论证方向都接不上。</p>\n</section>"},{"title":"A. serves as a solution to marketing problems","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n>\n> 营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些选中的人会替营销人员完成大部分传播工作。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。\n\n第二段从`Marketers have embraced`写起，交代营销人员为什么接受理论：它许诺找到少数影响者后，传播工作就会容易得多。第三段的`however`没有接上这种办法的成效，而是引入研究，指出少数影响者的作用被高估。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Finding and influencing these people can provide marketers with a workable way to spread their message.\n>\n> 找到并影响这些人，可以为营销人员提供一种切实可行的信息传播办法。\n\nA需要作者把这条途径当成可用的解决办法，不要求作者宣布所有营销问题都已解决。实际的后文却在削弱这条途径所依赖的前提：起点人物不能决定后续各层会不会继续接受影响。营销人员觉得它好用，与作者认可它能够解决问题，仍是两种判断。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q32-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读到 largely untested，以及第三段 however 后削弱影响者作用的发现。A 把营销人员期待的办法当成作者确认有效的办法，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。<code>A</code> 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论能作为解决营销问题的办法。</p>\n</blockquote>\n<p><code>marketing problems</code>让我们回到<code>Marketers</code>和<code>do most of the work</code>，看看这一效果是谁期待的。</p>\n<p><code>A</code>把理论写成解决营销问题的办法。第二段确实出现一条营销设想：如果找到并影响少数人，那些人就会替营销人员完成大部分工作。</p>\n<p>但<code>if they can</code>写的是预期办法，不是已经发生的效果；题干还要求作者的判断，不能把营销人员的设想直接安在作者身上。第二段说理论<code>largely untested</code>，紧接着第三段用<code>however</code>引入研究发现：有影响力者的实际作用远小于通常想象，甚至并非必需。两段连起来是在检验并削弱营销设想赖以成立的前提。</p>\n<p><code>A</code>却把这一被质疑的传播捷径当成作者确认的解决办法，评价归属和论证方向都接不上。</p>\n</section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些选中的人会替营销人员完成大部分传播工作。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>第二段从<code>Marketers have embraced</code>写起，交代营销人员为什么接受理论：它许诺找到少数影响者后，传播工作就会容易得多。第三段的<code>however</code>没有接上这种办法的成效，而是引入研究，指出少数影响者的作用被高估。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Finding and influencing these people can provide marketers with a workable way to spread their message.</p>\n<p>找到并影响这些人，可以为营销人员提供一种切实可行的信息传播办法。</p>\n</blockquote>\n<p>A需要作者把这条途径当成可用的解决办法，不要求作者宣布所有营销问题都已解决。实际的后文却在削弱这条途径所依赖的前提：起点人物不能决定后续各层会不会继续接受影响。营销人员觉得它好用，与作者认可它能够解决问题，仍是两种判断。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. has helped explain certain prevalent trends","raw":"### B. has helped explain certain prevalent trends\n\n> 作者认为，两级传播理论已经帮助解释了某些流行趋势。\n\n**做题模式中的状态：** 当时 prevalent 被遮挡，但 helped explain 仍可与 seems to explain 比较。结合未经充分检验和后文 however 的研究评价，第一轮没有把表面解释力当成作者结论，排除了 B。\n\n**错误类型：第一类——歪曲原意。**\n\n它借用了原文对流行现象的介绍，保留了 `explain`，却丢掉 `seems` 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。\n\n**出处：**\n\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q32-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 prevalent 被遮挡，但 helped explain 仍可与 seems to explain 比较。结合未经充分检验和后文 however 的研究评价，第一轮没有把表面解释力当成作者结论，排除了 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了原文对流行现象的介绍，保留了 <code>explain</code>，却丢掉 <code>seems</code> 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section>"},{"title":"B. has helped explain certain prevalent trends","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> 作者认为，两级传播理论已经帮助解释了某些流行趋势。\n\n`helped explain`对应`seems to explain`，但后者前面多了`seems`，要连同`untested`一起读。\n\n`B`能对应第二段的`seems to explain`：理论表面上可以把小群体先行动与后来出现的潮流连起来。`has helped explain`不等于理论已经经过严格证明，不能单凭这两个时态就判错；真正需要继续看的，是作者怎样处理这份解释。\n\n第一段已经说这种想法不能解释观念实际怎样传播，第二段谨慎写`seems`，第三段又以`however`转向研究对特殊人物作用的削弱。作者在交代一种看起来合理的解释，并没有把“它已帮助解释潮流”作为自己的结论。\n\n`B`拿走了被介绍的解释力，却漏掉作者连续保留、随后反驳的关系，因此不能作为题干所问的作者判断。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q32-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 prevalent 被遮挡，但 helped explain 仍可与 seems to explain 比较。结合未经充分检验和后文 however 的研究评价，第一轮没有把表面解释力当成作者结论，排除了 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了原文对流行现象的介绍，保留了 <code>explain</code>，却丢掉 <code>seems</code> 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><code>helped explain</code>对应<code>seems to explain</code>，但后者前面多了<code>seems</code>，要连同<code>untested</code>一起读。</p>\n<p><code>B</code>能对应第二段的<code>seems to explain</code>：理论表面上可以把小群体先行动与后来出现的潮流连起来。<code>has helped explain</code>不等于理论已经经过严格证明，不能单凭这两个时态就判错；真正需要继续看的，是作者怎样处理这份解释。</p>\n<p>第一段已经说这种想法不能解释观念实际怎样传播，第二段谨慎写<code>seems</code>，第三段又以<code>however</code>转向研究对特殊人物作用的削弱。作者在交代一种看起来合理的解释，并没有把“它已帮助解释潮流”作为自己的结论。</p>\n<p><code>B</code>拿走了被介绍的解释力，却漏掉作者连续保留、随后反驳的关系，因此不能作为题干所问的作者判断。</p>\n</section>"},{"title":"B. has helped explain certain prevalent trends","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n>\n> 这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。该理论似乎也解释了某些外观、品牌或社区突然和意外的流行。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。\n\n第二段先展示理论看起来能够解释的现象，再把支撑材料称作`anecdotal evidence`。第三段转向研究，发现影响者的作用远小于通常的想象。作者是在追问这个解释是否站得住，而没有沿着“它已经解释了潮流”继续补充结果。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The theory helps explain the popularity of these trends by showing how a few early adopters influence the wider public.\n>\n> 这一理论通过说明少数早期采用者如何影响大众，帮助解释了这些趋势为何流行。\n\nB所需要的是作者对这份解释力的认可，并不要求额外写成“研究已经完全证明理论”。原文却在第一段说它解释不了实际传播，第二段保留`seems`，第三段再质疑少数人的关键作用。把这些前后评价连起来，不能只留下“帮助解释流行”的肯定。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q32-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 prevalent 被遮挡，但 helped explain 仍可与 seems to explain 比较。结合未经充分检验和后文 however 的研究评价，第一轮没有把表面解释力当成作者结论，排除了 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了原文对流行现象的介绍，保留了 <code>explain</code>，却丢掉 <code>seems</code> 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论已经帮助解释了某些流行趋势。</p>\n</blockquote>\n<p><code>helped explain</code>对应<code>seems to explain</code>，但后者前面多了<code>seems</code>，要连同<code>untested</code>一起读。</p>\n<p><code>B</code>能对应第二段的<code>seems to explain</code>：理论表面上可以把小群体先行动与后来出现的潮流连起来。<code>has helped explain</code>不等于理论已经经过严格证明，不能单凭这两个时态就判错；真正需要继续看的，是作者怎样处理这份解释。</p>\n<p>第一段已经说这种想法不能解释观念实际怎样传播，第二段谨慎写<code>seems</code>，第三段又以<code>however</code>转向研究对特殊人物作用的削弱。作者在交代一种看起来合理的解释，并没有把“它已帮助解释潮流”作为自己的结论。</p>\n<p><code>B</code>拿走了被介绍的解释力，却漏掉作者连续保留、随后反驳的关系，因此不能作为题干所问的作者判断。</p>\n</section><section class=\"revealPart\" id=\"focus-q32-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。该理论似乎也解释了某些外观、品牌或社区突然和意外的流行。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>第二段先展示理论看起来能够解释的现象，再把支撑材料称作<code>anecdotal evidence</code>。第三段转向研究，发现影响者的作用远小于通常的想象。作者是在追问这个解释是否站得住，而没有沿着“它已经解释了潮流”继续补充结果。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The theory helps explain the popularity of these trends by showing how a few early adopters influence the wider public.</p>\n<p>这一理论通过说明少数早期采用者如何影响大众，帮助解释了这些趋势为何流行。</p>\n</blockquote>\n<p>B所需要的是作者对这份解释力的认可，并不要求额外写成“研究已经完全证明理论”。原文却在第一段说它解释不了实际传播，第二段保留<code>seems</code>，第三段再质疑少数人的关键作用。把这些前后评价连起来，不能只留下“帮助解释流行”的肯定。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. has won support from influentials","raw":"### C. has won support from influentials\n\n> 作者认为，两级传播理论得到了有影响力者的支持。\n\n**做题模式中的状态：** 当时 embraced 被遮挡，但句子的主语 Marketers 和 find and influence 后面的 influentials 可见。两类人的角色并不相同，不能把被寻找的人当作支持理论的人，第一轮排除 C。\n\n**错误类型：第一类——歪曲原意。**\n\n明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；`C` 把宾语位置的一群人换成了表态支持的主体。\n\n**出处：**\n\n> Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q32-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 embraced 被遮挡，但句子的主语 Marketers 和 find and influence 后面的 influentials 可见。两类人的角色并不相同，不能把被寻找的人当作支持理论的人，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；<code>C</code> 把宾语位置的一群人换成了表态支持的主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n</blockquote>\n</section>"},{"title":"C. has won support from influentials","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为，两级传播理论得到了有影响力者的支持。\n\n`has won support from influentials`中的`from`说明支持来自有影响力者。要核对这项，就看原文里谁接受了理论。\n\n第二段写的是`Marketers have embraced the two-step flow`。`embraced`在这里表示接受、支持，主语`Marketers`是营销人员。接着的`because`解释他们的理由：如果能找到并影响`the influentials`，这些人就会替他们完成大部分传播工作。\n\n同一句里，两类人各有位置：营销人员接受理论，影响者是营销人员准备寻找和影响的对象。C把被利用来传播信息的人，换成了表态支持理论的人。后文也只讨论影响者实际能起多大作用，没有给出他们对这一理论的态度。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q32-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 embraced 被遮挡，但句子的主语 Marketers 和 find and influence 后面的 influentials 可见。两类人的角色并不相同，不能把被寻找的人当作支持理论的人，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；<code>C</code> 把宾语位置的一群人换成了表态支持的主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><code>has won support from influentials</code>中的<code>from</code>说明支持来自有影响力者。要核对这项，就看原文里谁接受了理论。</p>\n<p>第二段写的是<code>Marketers have embraced the two-step flow</code>。<code>embraced</code>在这里表示接受、支持，主语<code>Marketers</code>是营销人员。接着的<code>because</code>解释他们的理由：如果能找到并影响<code>the influentials</code>，这些人就会替他们完成大部分传播工作。</p>\n<p>同一句里，两类人各有位置：营销人员接受理论，影响者是营销人员准备寻找和影响的对象。C把被利用来传播信息的人，换成了表态支持理论的人。后文也只讨论影响者实际能起多大作用，没有给出他们对这一理论的态度。</p>\n</section>"},{"title":"C. has won support from influentials","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.\n>\n> 营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些选中的人会替营销人员完成大部分传播工作。\n\n句子从 `Marketers` 出发，解释他们为何接受理论；后面 `if` 从句仍在说他们怎样利用 `influentials`。后文研究这些人的作用，也没有让他们出来为理论背书。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Influentials have embraced the two-step-flow theory and expressed their support for it.\n>\n> 有影响力者已经接受两级传播理论，并表达了对它的支持。\n\n`C` 需要影响者本人作出支持行为，实际支持行为的主语却是 `Marketers`。理论赋予某群人重要作用，不等于这群人赞成这套理论。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q32-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 embraced 被遮挡，但句子的主语 Marketers 和 find and influence 后面的 influentials 可见。两类人的角色并不相同，不能把被寻找的人当作支持理论的人，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；<code>C</code> 把宾语位置的一群人换成了表态支持的主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论得到了有影响力者的支持。</p>\n</blockquote>\n<p><code>has won support from influentials</code>中的<code>from</code>说明支持来自有影响力者。要核对这项，就看原文里谁接受了理论。</p>\n<p>第二段写的是<code>Marketers have embraced the two-step flow</code>。<code>embraced</code>在这里表示接受、支持，主语<code>Marketers</code>是营销人员。接着的<code>because</code>解释他们的理由：如果能找到并影响<code>the influentials</code>，这些人就会替他们完成大部分传播工作。</p>\n<p>同一句里，两类人各有位置：营销人员接受理论，影响者是营销人员准备寻找和影响的对象。C把被利用来传播信息的人，换成了表态支持理论的人。后文也只讨论影响者实际能起多大作用，没有给出他们对这一理论的态度。</p>\n</section><section class=\"revealPart\" id=\"focus-q32-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n<p>营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些选中的人会替营销人员完成大部分传播工作。</p>\n</blockquote>\n<p>句子从 <code>Marketers</code> 出发，解释他们为何接受理论；后面 <code>if</code> 从句仍在说他们怎样利用 <code>influentials</code>。后文研究这些人的作用，也没有让他们出来为理论背书。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Influentials have embraced the two-step-flow theory and expressed their support for it.</p>\n<p>有影响力者已经接受两级传播理论，并表达了对它的支持。</p>\n</blockquote>\n<p><code>C</code> 需要影响者本人作出支持行为，实际支持行为的主语却是 <code>Marketers</code>。理论赋予某群人重要作用，不等于这群人赞成这套理论。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. requires solid evidence for its validity","raw":"### D. requires solid evidence for its validity\n\n> 作者认为，两级传播理论的有效性需要扎实证据。\n\n**做题模式中的状态：** 当时 largely untested 可见，零散事例与理论相合却不足以证明因果，第三段又给出不同的研究结果。D 概括了需要可靠证据检验有效性的意思，第一轮保留并最终选择 D。\n\n**选项类型：跨句概括。**\n\n它把 `untested`、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。\n\n**出处：**\n\n> The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from the media to the influentials and from them to everyone else.\n>\n> Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q32-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 largely untested 可见，零散事例与理论相合却不足以证明因果，第三段又给出不同的研究结果。D 概括了需要可靠证据检验有效性的意思，第一轮保留并最终选择 D。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把 <code>untested</code>、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section>"},{"title":"D. requires solid evidence for its validity","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 作者认为，两级传播理论的有效性需要扎实证据。\n\n`solid evidence`和`validity`要回到`largely untested`，它直接关系到理论有没有受到检验。\n\n`D`问的是理论是否有效需要什么，而不是它是否吸引过人。`largely untested`说明检验不足；第二段末尾的`fits nicely`说明那些先行动、后流行的例子与理论相合。\n\n小群体先行动、后来出现潮流，说明时间先后与理论相合，却尚不能证明正是他们的特殊性造成了后续扩散。第三段的研究结果与人们通常的想象不同，进一步说明表面符合与实际影响不能混在一起。`D`要求用可靠证据检验有效性，承接了这个区别。\n\n它没有武断宣判理论所有部分都错误，也没有把营销人员的期待当作成效，保留了作者对未经充分检验的解释所持的审慎态度。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q32-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 largely untested 可见，零散事例与理论相合却不足以证明因果，第三段又给出不同的研究结果。D 概括了需要可靠证据检验有效性的意思，第一轮保留并最终选择 D。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把 <code>untested</code>、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><code>solid evidence</code>和<code>validity</code>要回到<code>largely untested</code>，它直接关系到理论有没有受到检验。</p>\n<p><code>D</code>问的是理论是否有效需要什么，而不是它是否吸引过人。<code>largely untested</code>说明检验不足；第二段末尾的<code>fits nicely</code>说明那些先行动、后流行的例子与理论相合。</p>\n<p>小群体先行动、后来出现潮流，说明时间先后与理论相合，却尚不能证明正是他们的特殊性造成了后续扩散。第三段的研究结果与人们通常的想象不同，进一步说明表面符合与实际影响不能混在一起。<code>D</code>要求用可靠证据检验有效性，承接了这个区别。</p>\n<p>它没有武断宣判理论所有部分都错误，也没有把营销人员的期待当作成效，保留了作者对未经充分检验的解释所持的审慎态度。</p>\n</section>"},{"title":"D. requires solid evidence for its validity","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from the media to the influentials and from them to everyone else.\n>\n> Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n>\n> 影响者的假定重要性源于一个听起来合理但基本未经检验的理论，即\"传播的两步流动\"：信息从媒体流向影响者，再从他们流向其他所有人。这种轶事证据很好地符合只有某些特殊的人能够驱动趋势的想法。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。\n\n第二段先指出理论未经充分检验，再展示与它相合的零散例子；第三段用研究发现打破“看起来符合就算证明”的推断。\n\n如果`D`真是作者的意思，文章至少得写成：\n\n> The theory may sound plausible, but its validity needs to be established by solid evidence rather than anecdotal examples.\n>\n> 理论可能听起来合理，但其有效性需要由扎实证据来确立，不能只靠零散事例。\n\n这正好对应原文由表面合理走向实际检验的推进。`D` 保留的是证据要求，没有替作者添加“理论绝对无效”的更强结论。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q32-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 largely untested 可见，零散事例与理论相合却不足以证明因果，第三段又给出不同的研究结果。D 概括了需要可靠证据检验有效性的意思，第一轮保留并最终选择 D。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把 <code>untested</code>、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p><code>solid evidence</code>和<code>validity</code>要回到<code>largely untested</code>，它直接关系到理论有没有受到检验。</p>\n<p><code>D</code>问的是理论是否有效需要什么，而不是它是否吸引过人。<code>largely untested</code>说明检验不足；第二段末尾的<code>fits nicely</code>说明那些先行动、后流行的例子与理论相合。</p>\n<p>小群体先行动、后来出现潮流，说明时间先后与理论相合，却尚不能证明正是他们的特殊性造成了后续扩散。第三段的研究结果与人们通常的想象不同，进一步说明表面符合与实际影响不能混在一起。<code>D</code>要求用可靠证据检验有效性，承接了这个区别。</p>\n<p>它没有武断宣判理论所有部分都错误，也没有把营销人员的期待当作成效，保留了作者对未经充分检验的解释所持的审慎态度。</p>\n</section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.</p>\n<p>Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>影响者的假定重要性源于一个听起来合理但基本未经检验的理论，即&quot;传播的两步流动&quot;：信息从媒体流向影响者，再从他们流向其他所有人。这种轶事证据很好地符合只有某些特殊的人能够驱动趋势的想法。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>第二段先指出理论未经充分检验，再展示与它相合的零散例子；第三段用研究发现打破“看起来符合就算证明”的推断。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The theory may sound plausible, but its validity needs to be established by solid evidence rather than anecdotal examples.</p>\n<p>理论可能听起来合理，但其有效性需要由扎实证据来确立，不能只靠零散事例。</p>\n</blockquote>\n<p>这正好对应原文由表面合理走向实际检验的推进。<code>D</code> 保留的是证据要求，没有替作者添加“理论绝对无效”的更强结论。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. D. requires solid evidence for its validity**\n\n- A：营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。A 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。\n- B：它借用了原文对流行现象的介绍，保留了 explain，却丢掉 seems 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。\n- C：明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；C 把宾语位置的一群人换成了表态支持的主体。\n- D：它把 untested、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"32题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"32","questionConclusion":true},"html":"<blockquote>\n<p><strong>32. D. requires solid evidence for its validity</strong></p>\n</blockquote>\n<ul>\n<li>A：营销人员接受理论，是因为它看起来能让少数人替自己完成传播工作。A 把这种期待变成作者认可的实际解决办法，改变了说法的归属和证据状态。</li>\n<li>B：它借用了原文对流行现象的介绍，保留了 explain，却丢掉 seems 及前后连续的质疑。问题不是现在完成时本身，而是把正在被检验的解释当成作者的肯定。</li>\n<li>C：明确接受理论的是营销人员。影响者是理论所讨论、营销人员准备去寻找并影响的对象；C 把宾语位置的一群人换成了表态支持的主体。</li>\n<li>D：它把 untested、表面吻合的事例和后文的研究质疑概括成“需要扎实证据”。要求证据不等于武断宣判理论的所有部分都错误。</li>\n</ul>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> What the researchers have observed recently shows that ______.\n>\n> 研究人员最近的观察说明什么？\n\n### 题型\n\n具体细节与局部概括题。observed 对应第四段的 observation，问的是这项观察支持的关系，不是从段中挑一句关于媒体的描述。\n\n### 核心出处\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.\n>\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n\n第四段先把少数依靠媒体影响的名人作为例外排开，再指出普通影响者实际交往的人有限。后面的逐层传播说明，人际影响必须依托具体的人际互动。这里概括的是联系，不是影响力与交往人数之间的精确比例。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"33","questionIntro":true},"html":"<blockquote>\n<p>What the researchers have observed recently shows that ______.</p>\n<p>研究人员最近的观察说明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节与局部概括题。observed 对应第四段的 observation，问的是这项观察支持的关系，不是从段中挑一句关于媒体的描述。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p>第四段先把少数依靠媒体影响的名人作为例外排开，再指出普通影响者实际交往的人有限。后面的逐层传播说明，人际影响必须依托具体的人际互动。这里概括的是联系，不是影响力与交往人数之间的精确比例。</p>\n"},{"title":"A. the power of influence goes with social interactions","raw":"### A. the power of influence goes with social interactions\n\n> 研究人员的观察说明，影响力与社会互动相联系。\n\n**做题模式中的状态：** 当时第四段已经读到普通影响者并不与很多人互动，以及影响需要逐层传递。A 说的是影响力与交往的联系，未添加精确比例，第一轮保留并选 A。\n\n**选项类型：局部概括。**\n\n观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。`A` 概括这一关系，没有把少数媒体名人的例外推广到所有人。\n\n**出处：**\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.\n>\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q33-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时第四段已经读到普通影响者并不与很多人互动，以及影响需要逐层传递。A 说的是影响力与交往的联系，未添加精确比例，第一轮保留并选 A。</p>\n<p><strong>选项类型：局部概括。</strong></p>\n<p>观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。<code>A</code> 概括这一关系，没有把少数媒体名人的例外推广到所有人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section>"},{"title":"A. the power of influence goes with social interactions","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 研究人员的观察说明，影响力与社会互动相联系。\n\n`social interactions`对应`don’t interact with that many others`，回看研究人员限制普通人影响范围的那句。\n\n`A`把影响力与社会交往联系起来。第四段先排开少数媒体名人，再说即使最有影响力的普通成员，也不与那么多人实际互动。\n\n这不是给影响力列一个精确公式，而是在指出限制：不能因为某人被称作有影响力者，就假定他本人直接接触了大量其他人。接下来传播必须由其他人一层层继续，正是因为最初个人的交往范围有限。`A`中的`goes with`表达联系，没有添加“只取决于”或“一定成正比”，所以能够概括观察中的人际关系。\n\n它也不把少数名人的媒体影响硬套进普通人的人际传播，两种情况仍然分开。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q33-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时第四段已经读到普通影响者并不与很多人互动，以及影响需要逐层传递。A 说的是影响力与交往的联系，未添加精确比例，第一轮保留并选 A。</p>\n<p><strong>选项类型：局部概括。</strong></p>\n<p>观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。<code>A</code> 概括这一关系，没有把少数媒体名人的例外推广到所有人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><code>social interactions</code>对应<code>don’t interact with that many others</code>，回看研究人员限制普通人影响范围的那句。</p>\n<p><code>A</code>把影响力与社会交往联系起来。第四段先排开少数媒体名人，再说即使最有影响力的普通成员，也不与那么多人实际互动。</p>\n<p>这不是给影响力列一个精确公式，而是在指出限制：不能因为某人被称作有影响力者，就假定他本人直接接触了大量其他人。接下来传播必须由其他人一层层继续，正是因为最初个人的交往范围有限。<code>A</code>中的<code>goes with</code>表达联系，没有添加“只取决于”或“一定成正比”，所以能够概括观察中的人际关系。</p>\n<p>它也不把少数名人的媒体影响硬套进普通人的人际传播，两种情况仍然分开。</p>\n</section>"},{"title":"A. the power of influence goes with social interactions","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.\n>\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n>\n> 研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。\n\n作者先排除媒体名人的特殊情形，再谈普通成员直接交往有限；随后解释要大范围传播，就得由受影响的人继续影响自己的熟人。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> Because an individual interacts with only a limited number of people, influence must pass through further social interactions to spread widely.\n>\n> 由于个人交往人数有限，影响要广泛传播，就必须经过后续的人际互动。\n\n`A` 所需的联系既有前句的个人交往限制，也有后句的逐层传递来支撑。它没有说交往越多影响力就必然按同一比例增长。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q33-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时第四段已经读到普通影响者并不与很多人互动，以及影响需要逐层传递。A 说的是影响力与交往的联系，未添加精确比例，第一轮保留并选 A。</p>\n<p><strong>选项类型：局部概括。</strong></p>\n<p>观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。<code>A</code> 概括这一关系，没有把少数媒体名人的例外推广到所有人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><code>social interactions</code>对应<code>don’t interact with that many others</code>，回看研究人员限制普通人影响范围的那句。</p>\n<p><code>A</code>把影响力与社会交往联系起来。第四段先排开少数媒体名人，再说即使最有影响力的普通成员，也不与那么多人实际互动。</p>\n<p>这不是给影响力列一个精确公式，而是在指出限制：不能因为某人被称作有影响力者，就假定他本人直接接触了大量其他人。接下来传播必须由其他人一层层继续，正是因为最初个人的交往范围有限。<code>A</code>中的<code>goes with</code>表达联系，没有添加“只取决于”或“一定成正比”，所以能够概括观察中的人际关系。</p>\n<p>它也不把少数名人的媒体影响硬套进普通人的人际传播，两种情况仍然分开。</p>\n</section><section class=\"revealPart\" id=\"focus-q33-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>作者先排除媒体名人的特殊情形，再谈普通成员直接交往有限；随后解释要大范围传播，就得由受影响的人继续影响自己的熟人。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Because an individual interacts with only a limited number of people, influence must pass through further social interactions to spread widely.</p>\n<p>由于个人交往人数有限，影响要广泛传播，就必须经过后续的人际互动。</p>\n</blockquote>\n<p><code>A</code> 所需的联系既有前句的个人交往限制，也有后句的逐层传递来支撑。它没有说交往越多影响力就必然按同一比例增长。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. interpersonal links can be enhanced through the media","raw":"### B. interpersonal links can be enhanced through the media\n\n> 研究人员的观察说明，人际联系能够通过媒体得到增强。\n\n**做题模式中的状态：** 当时 media, not interpersonal 这一对照可见。原文在区分媒体影响与人际影响，B 却把两者连成媒体增强人际联系，第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\n原句说少数名人的巨大影响主要来自媒体，而非人际交往。`B` 把本来用于区分来源的两类影响改接成了因果关系。\n\n**出处：**\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q33-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 media, not interpersonal 这一对照可见。原文在区分媒体影响与人际影响，B 却把两者连成媒体增强人际联系，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说少数名人的巨大影响主要来自媒体，而非人际交往。<code>B</code> 把本来用于区分来源的两类影响改接成了因果关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section>"},{"title":"B. interpersonal links can be enhanced through the media","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> 研究人员的观察说明，人际联系能够通过媒体得到增强。\n\n`through the media`会让人想到`Oprah`，但那句用`media`, `not interpersonal`把两种影响分开。\n\n`B`说媒体可以增强人际联系。原句提媒体时，是解释`Oprah`这类少数名人的影响来源：`primarily a function of media`, `not interpersonal`, `influence`。\n\n这里`media`与`interpersonal`被放在对照的两侧，用来说明名人的影响不能拿普通人的交往范围解释。`B`却把两侧连成“媒体增强人际联系”这一作用链。原文接下来观察普通人的实际互动有限，也是在讨论他们本人能接触多少人，并没有把这种限制解释为媒体增强或削弱人际联系的结果。\n\n因此`B`把用于区分影响来源的例外，改成了媒体作用于人际联系的一般规律，已经换了这项观察所建立的关系。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q33-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 media, not interpersonal 这一对照可见。原文在区分媒体影响与人际影响，B 却把两者连成媒体增强人际联系，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说少数名人的巨大影响主要来自媒体，而非人际交往。<code>B</code> 把本来用于区分来源的两类影响改接成了因果关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><code>through the media</code>会让人想到<code>Oprah</code>，但那句用<code>media</code>, <code>not interpersonal</code>把两种影响分开。</p>\n<p><code>B</code>说媒体可以增强人际联系。原句提媒体时，是解释<code>Oprah</code>这类少数名人的影响来源：<code>primarily a function of media</code>, <code>not interpersonal</code>, <code>influence</code>。</p>\n<p>这里<code>media</code>与<code>interpersonal</code>被放在对照的两侧，用来说明名人的影响不能拿普通人的交往范围解释。<code>B</code>却把两侧连成“媒体增强人际联系”这一作用链。原文接下来观察普通人的实际互动有限，也是在讨论他们本人能接触多少人，并没有把这种限制解释为媒体增强或削弱人际联系的结果。</p>\n<p>因此<code>B</code>把用于区分影响来源的例外，改成了媒体作用于人际联系的一般规律，已经换了这项观察所建立的关系。</p>\n</section>"},{"title":"B. interpersonal links can be enhanced through the media","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.\n>\n> 研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。\n\n作者把媒体名人单独放在例外里，随后考察普通人的实际互动。他并未用名人的媒体影响来说明普通人的人际关系如何得到增强。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> Media exposure strengthens interpersonal links and thereby expands people’s direct social interactions.\n>\n> 媒体曝光增强了人际联系，从而扩展了人们的直接交往。\n\n`B` 至少需要“媒体 → 人际联系增强”这一步。实际原文是 `media`, `not interpersonal`，用媒体解释例外，不能把“不是靠人际影响”改成“增强了人际联系”。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q33-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 media, not interpersonal 这一对照可见。原文在区分媒体影响与人际影响，B 却把两者连成媒体增强人际联系，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说少数名人的巨大影响主要来自媒体，而非人际交往。<code>B</code> 把本来用于区分来源的两类影响改接成了因果关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><code>through the media</code>会让人想到<code>Oprah</code>，但那句用<code>media</code>, <code>not interpersonal</code>把两种影响分开。</p>\n<p><code>B</code>说媒体可以增强人际联系。原句提媒体时，是解释<code>Oprah</code>这类少数名人的影响来源：<code>primarily a function of media</code>, <code>not interpersonal</code>, <code>influence</code>。</p>\n<p>这里<code>media</code>与<code>interpersonal</code>被放在对照的两侧，用来说明名人的影响不能拿普通人的交往范围解释。<code>B</code>却把两侧连成“媒体增强人际联系”这一作用链。原文接下来观察普通人的实际互动有限，也是在讨论他们本人能接触多少人，并没有把这种限制解释为媒体增强或削弱人际联系的结果。</p>\n<p>因此<code>B</code>把用于区分影响来源的例外，改成了媒体作用于人际联系的一般规律，已经换了这项观察所建立的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-q33-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。</p>\n</blockquote>\n<p>作者把媒体名人单独放在例外里，随后考察普通人的实际互动。他并未用名人的媒体影响来说明普通人的人际关系如何得到增强。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Media exposure strengthens interpersonal links and thereby expands people’s direct social interactions.</p>\n<p>媒体曝光增强了人际联系，从而扩展了人们的直接交往。</p>\n</blockquote>\n<p><code>B</code> 至少需要“媒体 → 人际联系增强”这一步。实际原文是 <code>media</code>, <code>not interpersonal</code>，用媒体解释例外，不能把“不是靠人际影响”改成“增强了人际联系”。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. influentials have more channels to reach the public","raw":"### C. influentials have more channels to reach the public\n\n> 研究人员的观察说明，有影响力者拥有更多接触公众的渠道。\n\n**做题模式中的状态：** 当时区分了少数媒体名人与普通影响者。普通成员的实际互动有限，不能推出渠道更多，第一轮排除了 C。\n\n**错误类型：第三类——无中生有。**\n\n它把少数名人的媒体条件与 `influentials` 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。\n\n**命题人借用的原文材料：**\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q33-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了少数媒体名人与普通影响者。普通成员的实际互动有限，不能推出渠道更多，第一轮排除了 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把少数名人的媒体条件与 <code>influentials</code> 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section>"},{"title":"C. influentials have more channels to reach the public","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 研究人员的观察说明，有影响力者拥有更多接触公众的渠道。\n\nC中的比较是`more channels`，要说有影响力者接触公众的渠道更多。先看原文怎样区分人群：`With the exception of a few celebrities`把少数名人排作例外，他们可以通过媒体获得巨大影响；后面才转到普通人群中的有影响力者。\n\n对后一类人，观察发现即使他们很有影响力，也不与那么多人直接互动。接下来的问题因此是：个人直接交往有限，传播如何经过其他人继续下去？\n\n这里没有比较普通人与有影响力者各自拥有多少种渠道。媒体属于前面单独排开的少数名人，不能拿来证明后一类人的渠道优势；直接互动人数有限，也不能换算成渠道的多少。C所需的比较不在这项观察中。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q33-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了少数媒体名人与普通影响者。普通成员的实际互动有限，不能推出渠道更多，第一轮排除了 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把少数名人的媒体条件与 <code>influentials</code> 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p>C中的比较是<code>more channels</code>，要说有影响力者接触公众的渠道更多。先看原文怎样区分人群：<code>With the exception of a few celebrities</code>把少数名人排作例外，他们可以通过媒体获得巨大影响；后面才转到普通人群中的有影响力者。</p>\n<p>对后一类人，观察发现即使他们很有影响力，也不与那么多人直接互动。接下来的问题因此是：个人直接交往有限，传播如何经过其他人继续下去？</p>\n<p>这里没有比较普通人与有影响力者各自拥有多少种渠道。媒体属于前面单独排开的少数名人，不能拿来证明后一类人的渠道优势；直接互动人数有限，也不能换算成渠道的多少。C所需的比较不在这项观察中。</p>\n</section>"},{"title":"C. influentials have more channels to reach the public","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.\n>\n> 研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。\n\n观察的重点是，即使普通成员很有影响力，他本人实际接触的人仍有限。接下来才需要别人继续传递；作者不是在补充他拥有多少传播渠道。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Compared with other people, influentials can reach the public through a wider range of channels.\n>\n> 与其他人相比，有影响力者能够通过更多种渠道接触公众。\n\n`C` 需要渠道种类的比较。原文给出的是直接交往人数的限制；人数有限不能反过来证明渠道少，也不能变成渠道更多，两种指标必须分开。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q33-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了少数媒体名人与普通影响者。普通成员的实际互动有限，不能推出渠道更多，第一轮排除了 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把少数名人的媒体条件与 <code>influentials</code> 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p>C中的比较是<code>more channels</code>，要说有影响力者接触公众的渠道更多。先看原文怎样区分人群：<code>With the exception of a few celebrities</code>把少数名人排作例外，他们可以通过媒体获得巨大影响；后面才转到普通人群中的有影响力者。</p>\n<p>对后一类人，观察发现即使他们很有影响力，也不与那么多人直接互动。接下来的问题因此是：个人直接交往有限，传播如何经过其他人继续下去？</p>\n<p>这里没有比较普通人与有影响力者各自拥有多少种渠道。媒体属于前面单独排开的少数名人，不能拿来证明后一类人的渠道优势；直接互动人数有限，也不能换算成渠道的多少。C所需的比较不在这项观察中。</p>\n</section><section class=\"revealPart\" id=\"focus-q33-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。</p>\n</blockquote>\n<p>观察的重点是，即使普通成员很有影响力，他本人实际接触的人仍有限。接下来才需要别人继续传递；作者不是在补充他拥有多少传播渠道。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Compared with other people, influentials can reach the public through a wider range of channels.</p>\n<p>与其他人相比，有影响力者能够通过更多种渠道接触公众。</p>\n</blockquote>\n<p><code>C</code> 需要渠道种类的比较。原文给出的是直接交往人数的限制；人数有限不能反过来证明渠道少，也不能变成渠道更多，两种指标必须分开。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. most celebrities enjoy wide media attention","raw":"### D. most celebrities enjoy wide media attention\n\n> 研究人员的观察说明，大多数名人都受到广泛的媒体关注。\n\n**做题模式中的状态：** 当时看到 a few celebrities 是例外，题目所问的观察主体仍是普通成员的互动限制。D 改成大多数名人的媒体关注，第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\n它从 `a few celebrities` 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。\n\n**出处：**\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q33-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 a few celebrities 是例外，题目所问的观察主体仍是普通成员的互动限制。D 改成大多数名人的媒体关注，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它从 <code>a few celebrities</code> 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section>"},{"title":"D. most celebrities enjoy wide media attention","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 研究人员的观察说明，大多数名人都受到广泛的媒体关注。\n\n`most celebrities`与原文`a few celebrities`数量不同；回看`Oprah`所在的例外说明。\n\n`D`说大多数名人受到广泛媒体关注。原句只用少数名人说明一种例外：他们的影响主要来自媒体，而不是人际交往。\n\n少数例子不能证明大多数，但也不能反过来当成大多数没有媒体关注的统计。这里更关键的是题干问研究人员观察到了什么，观察的主体在`even the most influential members`之后，是普通成员实际互动有限；名人部分只是排除一种特殊情况。`D`将例外变成主要结论，还把“影响来自媒体”改成“受到媒体关注”，并把少数例子扩展为大多数。\n\n三处改动叠在一起，无法概括这项关于人际影响的观察。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q33-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 a few celebrities 是例外，题目所问的观察主体仍是普通成员的互动限制。D 改成大多数名人的媒体关注，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它从 <code>a few celebrities</code> 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><code>most celebrities</code>与原文<code>a few celebrities</code>数量不同；回看<code>Oprah</code>所在的例外说明。</p>\n<p><code>D</code>说大多数名人受到广泛媒体关注。原句只用少数名人说明一种例外：他们的影响主要来自媒体，而不是人际交往。</p>\n<p>少数例子不能证明大多数，但也不能反过来当成大多数没有媒体关注的统计。这里更关键的是题干问研究人员观察到了什么，观察的主体在<code>even the most influential members</code>之后，是普通成员实际互动有限；名人部分只是排除一种特殊情况。<code>D</code>将例外变成主要结论，还把“影响来自媒体”改成“受到媒体关注”，并把少数例子扩展为大多数。</p>\n<p>三处改动叠在一起，无法概括这项关于人际影响的观察。</p>\n</section>"},{"title":"D. most celebrities enjoy wide media attention","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don't interact with that many others.\n>\n> 研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。\n\n句子先用`With the exception of`暂时排开媒体名人的情况，然后把观察落到普通影响者的直接交往范围。后文顺着这个范围限制解释逐层传播，没有转去介绍名人普遍受到怎样的媒体关注。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Most celebrities receive extensive media attention, which gives them a large public presence.\n>\n> 大多数名人受到广泛的媒体关注，因而在公众面前具有很高的曝光度。\n\nD要把“大多数名人的媒体关注”作为观察得出的说明。实际只提少数名人作例外，并用这个例外限定后面的讨论范围。少数名人的情况不能直接概括为大多数，介绍例外也不能替代随后关于一般人际互动的观察。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q33-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 a few celebrities 是例外，题目所问的观察主体仍是普通成员的互动限制。D 改成大多数名人的媒体关注，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它从 <code>a few celebrities</code> 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><code>most celebrities</code>与原文<code>a few celebrities</code>数量不同；回看<code>Oprah</code>所在的例外说明。</p>\n<p><code>D</code>说大多数名人受到广泛媒体关注。原句只用少数名人说明一种例外：他们的影响主要来自媒体，而不是人际交往。</p>\n<p>少数例子不能证明大多数，但也不能反过来当成大多数没有媒体关注的统计。这里更关键的是题干问研究人员观察到了什么，观察的主体在<code>even the most influential members</code>之后，是普通成员实际互动有限；名人部分只是排除一种特殊情况。<code>D</code>将例外变成主要结论，还把“影响来自媒体”改成“受到媒体关注”，并把少数例子扩展为大多数。</p>\n<p>三处改动叠在一起，无法概括这项关于人际影响的观察。</p>\n</section><section class=\"revealPart\" id=\"focus-q33-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。</p>\n</blockquote>\n<p>句子先用<code>With the exception of</code>暂时排开媒体名人的情况，然后把观察落到普通影响者的直接交往范围。后文顺着这个范围限制解释逐层传播，没有转去介绍名人普遍受到怎样的媒体关注。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Most celebrities receive extensive media attention, which gives them a large public presence.</p>\n<p>大多数名人受到广泛的媒体关注，因而在公众面前具有很高的曝光度。</p>\n</blockquote>\n<p>D要把“大多数名人的媒体关注”作为观察得出的说明。实际只提少数名人作例外，并用这个例外限定后面的讨论范围。少数名人的情况不能直接概括为大多数，介绍例外也不能替代随后关于一般人际互动的观察。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. A. the power of influence goes with social interactions**\n\n- A：观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。A 概括这一关系，没有把少数媒体名人的例外推广到所有人。\n- B：原句说少数名人的巨大影响主要来自媒体，而非人际交往。B 把本来用于区分来源的两类影响改接成了因果关系。\n- C：它把少数名人的媒体条件与 influentials 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。\n- D：它从 a few celebrities 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"33题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"33","questionConclusion":true},"html":"<blockquote>\n<p><strong>33. A. the power of influence goes with social interactions</strong></p>\n</blockquote>\n<ul>\n<li>A：观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。A 概括这一关系，没有把少数媒体名人的例外推广到所有人。</li>\n<li>B：原句说少数名人的巨大影响主要来自媒体，而非人际交往。B 把本来用于区分来源的两类影响改接成了因果关系。</li>\n<li>C：它把少数名人的媒体条件与 influentials 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。</li>\n<li>D：它从 a few celebrities 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。</li>\n</ul>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.\n>\n> 第四段中画线的 these people 指哪些人？\n\n### 题型\n\n指代题。把代词放回原句，沿 each person so affected、who 和 and so on 找到反复出现的同一种角色，再把选项代回去检验。\n\n### 核心出处\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n\neach person so affected 先说受到影响，must then influence 再说继续影响熟人，who must in turn influence theirs 把这个角色延伸到下一层。these people 回指这些逐层接收、再传递影响的人。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"34","questionIntro":true},"html":"<blockquote>\n<p>The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.</p>\n<p>第四段中画线的 these people 指哪些人？</p>\n</blockquote>\n<h3>题型</h3>\n<p>指代题。把代词放回原句，沿 each person so affected、who 和 and so on 找到反复出现的同一种角色，再把选项代回去检验。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p>each person so affected 先说受到影响，must then influence 再说继续影响熟人，who must in turn influence theirs 把这个角色延伸到下一层。these people 回指这些逐层接收、再传递影响的人。</p>\n"},{"title":"A. stay outside the network of social influence","raw":"### A. stay outside the network of social influence\n\n> these people 指处在社会影响网络之外的人。\n\n**做题模式中的状态：** 当时已读出 each person so affected 与 must then influence 所构成的接力链。参与接收和传递的人仍在网络中，第一轮排除 A。\n\n**错误类型：第一类——歪曲原意。**\n\n它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。\n\n**出处：**\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"A","cumulative":true,"cumul
