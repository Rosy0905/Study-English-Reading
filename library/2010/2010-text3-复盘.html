 most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p>第四段先把少数依靠媒体影响的名人作为例外排开，再指出普通影响者实际交往的人有限。后面的逐层传播说明，人际影响必须依托具体的人际互动。这里概括的是联系，不是影响力与交往人数之间的精确比例。</p>\n<h3>A. the power of influence goes with social interactions</h3>\n<blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时第四段已经读到普通影响者并不与很多人互动，以及影响需要逐层传递。A 说的是影响力与交往的联系，未添加精确比例，第一轮保留并选 A。</p>\n<p><strong>选项类型：局部概括。</strong></p>\n<p>观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。<code>A</code> 概括这一关系，没有把少数媒体名人的例外推广到所有人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，影响力与社会互动相联系。</p>\n</blockquote>\n<p><code>social interactions</code>对应<code>don’t interact with that many others</code>，回看研究人员限制普通人影响范围的那句。</p>\n<p><code>A</code>把影响力与社会交往联系起来。第四段先排开少数媒体名人，再说即使最有影响力的普通成员，也不与那么多人实际互动。</p>\n<p>这不是给影响力列一个精确公式，而是在指出限制：不能因为某人被称作有影响力者，就假定他本人直接接触了大量其他人。接下来传播必须由其他人一层层继续，正是因为最初个人的交往范围有限。<code>A</code>中的<code>goes with</code>表达联系，没有添加“只取决于”或“一定成正比”，所以能够概括观察中的人际关系。</p>\n<p>它也不把少数名人的媒体影响硬套进普通人的人际传播，两种情况仍然分开。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>作者先排除媒体名人的特殊情形，再谈普通成员直接交往有限；随后解释要大范围传播，就得由受影响的人继续影响自己的熟人。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Because an individual interacts with only a limited number of people, influence must pass through further social interactions to spread widely.</p>\n<p>由于个人交往人数有限，影响要广泛传播，就必须经过后续的人际互动。</p>\n</blockquote>\n<p><code>A</code> 所需的联系既有前句的个人交往限制，也有后句的逐层传递来支撑。它没有说交往越多影响力就必然按同一比例增长。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. interpersonal links can be enhanced through the media</h3>\n<blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 media, not interpersonal 这一对照可见。原文在区分媒体影响与人际影响，B 却把两者连成媒体增强人际联系，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说少数名人的巨大影响主要来自媒体，而非人际交往。<code>B</code> 把本来用于区分来源的两类影响改接成了因果关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，人际联系能够通过媒体得到增强。</p>\n</blockquote>\n<p><code>through the media</code>会让人想到<code>Oprah</code>，但那句用<code>media</code>, <code>not interpersonal</code>把两种影响分开。</p>\n<p><code>B</code>说媒体可以增强人际联系。原句提媒体时，是解释<code>Oprah</code>这类少数名人的影响来源：<code>primarily a function of media</code>, <code>not interpersonal</code>, <code>influence</code>。</p>\n<p>这里<code>media</code>与<code>interpersonal</code>被放在对照的两侧，用来说明名人的影响不能拿普通人的交往范围解释。<code>B</code>却把两侧连成“媒体增强人际联系”这一作用链。原文接下来观察普通人的实际互动有限，也是在讨论他们本人能接触多少人，并没有把这种限制解释为媒体增强或削弱人际联系的结果。</p>\n<p>因此<code>B</code>把用于区分影响来源的例外，改成了媒体作用于人际联系的一般规律，已经换了这项观察所建立的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。</p>\n</blockquote>\n<p>作者把媒体名人单独放在例外里，随后考察普通人的实际互动。他并未用名人的媒体影响来说明普通人的人际关系如何得到增强。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Media exposure strengthens interpersonal links and thereby expands people’s direct social interactions.</p>\n<p>媒体曝光增强了人际联系，从而扩展了人们的直接交往。</p>\n</blockquote>\n<p><code>B</code> 至少需要“媒体 → 人际联系增强”这一步。实际原文是 <code>media</code>, <code>not interpersonal</code>，用媒体解释例外，不能把“不是靠人际影响”改成“增强了人际联系”。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. influentials have more channels to reach the public</h3>\n<blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了少数媒体名人与普通影响者。普通成员的实际互动有限，不能推出渠道更多，第一轮排除了 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把少数名人的媒体条件与 <code>influentials</code> 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，有影响力者拥有更多接触公众的渠道。</p>\n</blockquote>\n<p>C中的比较是<code>more channels</code>，要说有影响力者接触公众的渠道更多。先看原文怎样区分人群：<code>With the exception of a few celebrities</code>把少数名人排作例外，他们可以通过媒体获得巨大影响；后面才转到普通人群中的有影响力者。</p>\n<p>对后一类人，观察发现即使他们很有影响力，也不与那么多人直接互动。接下来的问题因此是：个人直接交往有限，传播如何经过其他人继续下去？</p>\n<p>这里没有比较普通人与有影响力者各自拥有多少种渠道。媒体属于前面单独排开的少数名人，不能拿来证明后一类人的渠道优势；直接互动人数有限，也不能换算成渠道的多少。C所需的比较不在这项观察中。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。</p>\n</blockquote>\n<p>观察的重点是，即使普通成员很有影响力，他本人实际接触的人仍有限。接下来才需要别人继续传递；作者不是在补充他拥有多少传播渠道。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Compared with other people, influentials can reach the public through a wider range of channels.</p>\n<p>与其他人相比，有影响力者能够通过更多种渠道接触公众。</p>\n</blockquote>\n<p><code>C</code> 需要渠道种类的比较。原文给出的是直接交往人数的限制；人数有限不能反过来证明渠道少，也不能变成渠道更多，两种指标必须分开。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. most celebrities enjoy wide media attention</h3>\n<blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 a few celebrities 是例外，题目所问的观察主体仍是普通成员的互动限制。D 改成大多数名人的媒体关注，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它从 <code>a few celebrities</code> 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究人员的观察说明，大多数名人都受到广泛的媒体关注。</p>\n</blockquote>\n<p><code>most celebrities</code>与原文<code>a few celebrities</code>数量不同；回看<code>Oprah</code>所在的例外说明。</p>\n<p><code>D</code>说大多数名人受到广泛媒体关注。原句只用少数名人说明一种例外：他们的影响主要来自媒体，而不是人际交往。</p>\n<p>少数例子不能证明大多数，但也不能反过来当成大多数没有媒体关注的统计。这里更关键的是题干问研究人员观察到了什么，观察的主体在<code>even the most influential members</code>之后，是普通成员实际互动有限；名人部分只是排除一种特殊情况。<code>D</code>将例外变成主要结论，还把“影响来自媒体”改成“受到媒体关注”，并把少数例子扩展为大多数。</p>\n<p>三处改动叠在一起，无法概括这项关于人际影响的观察。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The researchers&#39; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey – whose outsize presence is primarily a function of media, not interpersonal, influence – even the most influential members of a population simply don&#39;t interact with that many others.</p>\n<p>研究人员的论点源于对社会影响的一个简单观察：除了像奥普拉·温弗瑞这样的少数名人——她们的巨大影响力主要来自媒体而非人际影响——即使是人群中最有影响力的成员也不会与那么多其他人互动。</p>\n</blockquote>\n<p>句子先用<code>With the exception of</code>暂时排开媒体名人的情况，然后把观察落到普通影响者的直接交往范围。后文顺着这个范围限制解释逐层传播，没有转去介绍名人普遍受到怎样的媒体关注。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Most celebrities receive extensive media attention, which gives them a large public presence.</p>\n<p>大多数名人受到广泛的媒体关注，因而在公众面前具有很高的曝光度。</p>\n</blockquote>\n<p>D要把“大多数名人的媒体关注”作为观察得出的说明。实际只提少数名人作例外，并用这个例外限定后面的讨论范围。少数名人的情况不能直接概括为大多数，介绍例外也不能替代随后关于一般人际互动的观察。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>33题结论</h3>\n<blockquote>\n<p><strong>33. A. the power of influence goes with social interactions</strong></p>\n</blockquote>\n<ul>\n<li>A：观察用交往范围有限来解释个人影响的边界，后面的接力传播补出影响怎样延续。A 概括这一关系，没有把少数媒体名人的例外推广到所有人。</li>\n<li>B：原句说少数名人的巨大影响主要来自媒体，而非人际交往。B 把本来用于区分来源的两类影响改接成了因果关系。</li>\n<li>C：它把少数名人的媒体条件与 influentials 这个称呼拼起来，让人自行补出“渠道优势”。文章没有给普通影响者列出更多渠道，也没有建立这种比较。</li>\n<li>D：它从 a few celebrities 的例子出发，将少数扩大成大多数，又把“影响主要来自媒体”改成“受到广泛媒体关注”。两处关系都超出了原句。</li>\n</ul>\n<h2>34题</h2>\n<blockquote>\n<p>The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.</p>\n<p>第四段中画线的 these people 指哪些人？</p>\n</blockquote>\n<h3>题型</h3>\n<p>指代题。把代词放回原句，沿 each person so affected、who 和 and so on 找到反复出现的同一种角色，再把选项代回去检验。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p>each person so affected 先说受到影响，must then influence 再说继续影响熟人，who must in turn influence theirs 把这个角色延伸到下一层。these people 回指这些逐层接收、再传递影响的人。</p>\n<h3>A. stay outside the network of social influence</h3>\n<blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读出 each person so affected 与 must then influence 所构成的接力链。参与接收和传递的人仍在网络中，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><code>outside the network</code>与前面<code>each person so affected</code>的链条相对，回看<code>these people</code>所在的整句。</p>\n<p><code>A</code>说这些人处在社会影响网络之外。<code>network</code>现在可以连着<code>outside</code>一起读，范围不再含糊。</p>\n<p>原句先用<code>each person so affected</code>说明他们已经承接上一轮影响，再用<code>must then influence</code>和<code>who must in turn influence</code>说明他们继续把影响传下去。接收、传递、再接收，正是在这个网络内发生的连续动作。<code>A</code>将参与传递的人说成停留在网络之外，与他们在句中承担的角色相反。</p>\n<p>不能把“距离起点已经较远”误读成“不在网络中”：距离远只表示经过较多层，退出网络则表示不再属于这一传递关系，句子并没有这样描述他们。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>原句不断重复“受影响 → 影响自己的熟人”的动作，然后逐个问这些接力者还能引来多少关注。<code>these people</code> 所在的位置承接的是参与者。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These people remain outside the influence network and take no part in receiving or passing on its influence.</p>\n<p>这些人停留在影响网络之外，不参与接收或传递其中的影响。</p>\n</blockquote>\n<p><code>A</code> 所需的是未参与网络，原文却已经给这些人安排了接收和传递两种动作。把网络外的人代入 <code>these people</code>，前面的接力关系就断了。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. have little contact with the source of influence</h3>\n<blockquote>\n<p>these people 指与最初影响源接触很少的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时检查了 has little to do with 的完整主语，发现关系不大的是后续关注人数，不是这些人与起点人物的接触频率，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用 <code>little</code> 和 <code>initial influential</code>，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指与最初影响源接触很少的人。</p>\n</blockquote>\n<p><code>little contact</code>看似接近<code>has little to do with the initial influential</code>，但要看<code>little to do with</code>前面的主语。</p>\n<p><code>B</code>容易被<code>has little to do with the initial influential</code>吸引，但先拆主语就能看到问题。<code>has little to do with</code>前面的完整主语是<code>just how many others pay attention to each of these people</code>，即每个节点能引来多少其他人关注；并不是<code>these people</code>本身。</p>\n<p>后面说的是这个人数与最初影响者关系不大，不是在统计两个人见面或联络的频率。<code>B</code>把传播结果的依赖关系改成<code>little contact</code>，既换了主语，也换了被衡量的事情。题目要解释<code>these people</code>承接哪一群人，不能把后面另一个判断中的<code>little</code>剪下来，改作这些人与起点人物的接触特点。</p>\n<p>这个句法差别在本句中就可以分清。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>前半句定义接力者，后半句讨论每个接力者还能吸引多少人。作者从传播角色转到传播效果，没有开始描述与起点人物见面或联络的频率。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These people have little direct contact with the person who first set the influence in motion.</p>\n<p>这些人与最初发动影响的那个人直接接触很少。</p>\n</blockquote>\n<p><code>B</code> 至少需要一句关于这些人接触频率的说明。实际 <code>has little to do with</code> 的主语是 <code>how many others pay attention</code>，不能从结果的依赖关系跳到人与人的接触频率。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. are influenced and then influence others</h3>\n<blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时沿 each person so affected、must then influence、who must in turn influence 和 and so on 连读，C 同时保留了接收与传递两个方向，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><code>are influenced and then influence others</code>正好接上<code>each person so affected must then influence</code>和<code>who must in turn influence</code>。</p>\n<p><code>C</code>保留了句中连续出现的两种角色。<code>each person so affected</code>先承接前一轮影响，<code>must then influence</code>说明这个人还要继续影响其他人；<code>who must in turn influence theirs</code>把同一种角色传到下一层，<code>and so on</code>再把链条延续。</p>\n<p><code>these people</code>放在后面逐个讨论能吸引多少关注，回接的就是这些接力的人。<code>C</code>不要求所有人都由同一位起点人物直接发动，也没有把链条限定为一层，因此能涵盖已经写出的各层接收者和传播者。</p>\n<p>它的依据不是仅仅重复<code>influence</code>，而是被影响、再影响这两个方向在同一个人身上前后相接，逐层重复。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>作者先写第一层接力者影响熟人，再让熟人影响自己的熟人，用 <code>and so on</code> 延长链条；随后 <code>these people</code> 逐个回看这些接力者的传播效果。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Each person receives influence from someone else and then passes it on to further acquaintances.</p>\n<p>每个人先受到别人的影响，再把它传给更多熟人。</p>\n</blockquote>\n<p><code>C</code> 所需的这两个连续动作，在 <code>each person</code> 和后面的 <code>who</code> 所指人群身上反复出现。把 <code>C</code> 代回去，既能接住前文，也能接住每个人后续吸引多少人的讨论。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. are influenced by the initial influential</h3>\n<blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有给 D 擅自加上 only 或 directly。比较后发现它只用共同来源界定人群，未保留逐层接收、再传递的角色，因此排除 D、选择 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它抓住句末的 <code>initial influential</code>，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><code>initial influential</code>出现在句末，但前面<code>who</code>和<code>and so on</code>已经把链条延伸到后面的多层人。</p>\n<p><code>D</code>写的是受到最初有影响力者影响的人，没有<code>only</code>或<code>directly</code>，不能擅自给它加上“仅限直接影响”。但它仍然用同一个影响来源来界定这群人：<code>by the initial influential</code>。</p>\n<p>原句界定的则是一个反复出现的角色：<code>each person</code>受到前一层影响，又影响后一层；后面的<code>who</code>与<code>and so on</code>继续这种重复。共同追溯到一个起点，与在每一层接收并继续传递，不是同一个指代说明。<code>D</code>只写来源，没有说明句中这些人为何还分别拥有自己的受影响对象，也不能完整承接逐层变化的施动者。</p>\n<p><code>C</code>直接保留了原句连续安排的两个动作，所以指代对应更准确。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>原句的行动者从 <code>each person</code> 转到 <code>his or her own acquaintances</code>，再由 <code>who</code> 转到下一层。<code>these people</code> 概括的是这些连续节点，后面还讨论每个节点自己的关注者。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The discussion concerns people affected by the initial influential, with their common source of influence defining the group.</p>\n<p>这段讨论的是受到最初影响者影响的人，并用这个共同来源来界定他们。</p>\n</blockquote>\n<p><code>D</code> 需要把“同一来源”作为人群的定义；实际句子用反复发生的两种动作定义他们。<code>D</code> 没有 <code>only</code> 或 <code>directly</code>，也仍不能替代 <code>C</code> 对整条接力链的准确概括。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>34题结论</h3>\n<blockquote>\n<p><strong>34. C. are influenced and then influence others</strong></p>\n</blockquote>\n<ul>\n<li>A：它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。</li>\n<li>B：它借用 little 和 initial influential，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。</li>\n<li>C：它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。</li>\n<li>D：它抓住句末的 initial influential，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。</li>\n</ul>\n<h2>35题</h2>\n<blockquote>\n<p>What is the essential element in the dynamics of social influence?</p>\n<p>社会影响动态过程中的关键要素是什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。essential element 对应末段 principal requirement；先区分研究考察了哪些变量，再看研究最终选出了什么条件。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<p>研究同时考察影响别人的能力与被影响的倾向，结论却用 not ... but, rather ... 明确将关键放在足够多容易受影响的人身上。答案要概括这群人的接受倾向，不能把所有研究变量都当作结论。</p>\n<h3>A. The eagerness to be accepted.</h3>\n<blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已分清“自己接受影响”与“希望别人接纳自己”的动作方向。A 将接受倾向改成寻求认可，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><code>eagerness to be accepted</code>说的是寻求接纳，回看末句<code>easily influenced people</code>所描述的倾向。</p>\n<p><code>A</code>说渴望被别人接受。这里被接受的对象是自己，方向是他人接纳自己；原文<code>easily influenced people</code>说的是自己容易受到别人的影响，可能改变观念或行为。</p>\n<p>两者都涉及别人，却不是同一种关系。一个人接受某种新做法，不必然是在争取群体认可；想被群体接纳，也不能直接说明他接受了传播来的具体影响。题干寻找研究结论中的关键要素，要对应研究点明的条件，不能把一种可能的心理动机替换成条件本身。</p>\n<p><code>A</code>的错误是把接受影响的倾向换成寻求他人接纳，并不需要声称这两种心理在现实中绝不可能同时出现。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>结论先排开少数影响者，再将关键放到足够多容易受影响的人上。作者在说明传播对象的接受性，没有解释他们是否为了融入群体而行动。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The critical factor is that many people are eager to gain acceptance from others.</p>\n<p>关键因素是许多人渴望获得别人的接纳。</p>\n</blockquote>\n<p><code>A</code> 至少需要把寻求认可写成研究选出的动机。实际 <code>easily influenced</code> 只说明受影响的倾向，不能替作者补上为什么愿意受影响的心理解释。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. The impulse to influence others.</h3>\n<blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有把研究考察的 ability to influence others 直接当成研究结果，而是读到 not ... but rather 后的条件，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><code>impulse to influence others</code>对应研究所考察的<code>ability to influence others</code>，但末句选出的条件在另一边。</p>\n<p><code>B</code>说有主动影响他人的冲动。第一句确实同时考察人们影响别人的能力和受影响的倾向，因此看到<code>to influence others</code>不能立刻认作答案。</p>\n<p>下一句才报告研究发现，用<code>not</code>...<code>but rather</code>...把关键条件放在足够多容易受影响的人身上。题目问<code>essential element</code>，要接研究选出的条件，而不是把研究过的所有因素都当成结论。<code>B</code>不仅把<code>ability</code>改成<code>impulse</code>，还将接受影响的一端转成主动发出影响的一端。</p>\n<p>传播当然还包含继续影响他人的动作，但这不能让主动发出的冲动代替末句明确选定的接受倾向。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>基于这个关于人际影响的基本事实，研究人员通过对人群进行数千次计算机模拟来研究社会影响的动态，操纵涉及人们影响他人的能力和他们被影响倾向的许多变量。他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>前一句列出施加影响与接受影响两类变量，后一句才报告主要条件。两句是“研究什么 → 发现什么”，并不是所考察的变量个个都是关键。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The simulations show that people’s impulse to influence others is the principal requirement for widespread propagation.</p>\n<p>模拟显示，人们主动影响他人的冲动是广泛传播的首要条件。</p>\n</blockquote>\n<p><code>B</code> 需要结论落在主动施加影响上，原文却落在容易被影响的人上。不能因为前句出现 <code>influence others</code>，就抹掉结论中的方向选择。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. The readiness to be influenced.</h3>\n<blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 readiness to be influenced 与 easily influenced people 在接受方向上相接；同时保留了需要足够多人这一原文条件，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 <code>a critical mass</code> 所要求的人数规模。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><code>readiness to be influenced</code>接上<code>easily influenced people</code>，两个说法都落在接受影响这一端。</p>\n<p><code>C</code>的<code>readiness to be influenced</code>说一个人愿意或容易接受影响，<code>to be influenced</code>保留被动方向，与<code>easily influenced people</code>对应。原句还要求<code>a critical mass</code>，即这样的人达到足够规模；四个选项比较的是这一要素的性质，所以<code>C</code>概括这群人的共同倾向，并不是声称只要一个人愿意就一定发生大范围传播。</p>\n<p><code>not of a few influentials</code>排开的是把关键归给少数特殊人物的看法，不是否认传播还需要接触、传递。</p>\n<p>把人数条件与个体倾向一起读，就能看到<code>C</code>承接的是研究最后明确放到关键位置的接受端。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>作者用 <code>not of a few influentials</code> 把重点从少数特殊人物移开，再用 <code>but</code>, <code>rather</code> 指向足够多容易受影响的人，完成了关键条件的确定。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Widespread propagation requires enough people who are ready to be influenced.</p>\n<p>广泛传播需要足够多愿意受到影响的人。</p>\n</blockquote>\n<p><code>C</code> 所需的接受倾向和原文条件一致。这里不是“一个人愿意就保证传播成功”，而是关键人群达到足够规模，并共同具有接受影响的倾向。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. The inclination to rely on others.</h3>\n<blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 inclination 被遮挡，但 rely on others 可见，已经能分清依赖别人和受到影响不是同一关系，因此第一轮排除 D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 <code>others</code> 相同就当作同义。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><code>rely on others</code>也提到人与人的关系，但末句具体谈的是<code>influenced</code>而不是<code>dependence</code>。</p>\n<p><code>inclination</code> 是倾向，和后面的 <code>to rely on others</code> 合起来就是依靠他人的倾向。对应结论中的 <code>easily influenced people</code>，真正需要比较的是 <code>rely on</code> 与 <code>be influenced</code> 的关系。</p>\n<p>受到影响可以只是接受一条观念、改变一次做法，不必以依赖别人为前提；依赖也不等于在这次传播中接受了影响。原文点名的是接受性，<code>D</code> 换成依赖性，不能作为同义改写。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>研究收束在影响怎样经过网络扩散，最后点名接受性。作者没有把传播的关键解释为人们不能独立行动，或需要依靠别人。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Widespread propagation depends on a large number of people being inclined to rely on others.</p>\n<p>广泛传播取决于许多人倾向于依赖别人。</p>\n</blockquote>\n<p><code>D</code> 需要研究明确选中依赖关系；原文只选中受影响倾向。即使某个人既容易受影响又依赖别人，也不能把两种特征作为同一研究发现。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>35题结论</h3>\n<blockquote>\n<p><strong>35. C. The readiness to be influenced.</strong></p>\n</blockquote>\n<ul>\n<li>A：它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。</li>\n<li>B：它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。</li>\n<li>C：它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 a critical mass 所要求的人数规模。</li>\n<li>D：它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 others 相同就当作同义。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：传统理论及其局限</strong>（段落1引入话题） 格拉德威尔观点：社会流行由少数特殊个体（影响者）驱动：（异常知情 + 有说服力 + 人脉广泛）// 但未解释想法如何实际传播</p>\n<p>↓（理论基础）</p>\n<p><strong>逻辑层次2：两步流动理论的内容与应用</strong>（段落2理论阐述） 理论内容：信息流动路径（媒体→影响者→其他人）→ 营销应用：找到并影响影响者即可 → 表面证据：【流行现象的回溯：小群体先行→轶事证据支持特殊人群驱动趋势】</p>\n<p>//（研究挑战）</p>\n<p><strong>逻辑层次3：新研究的反驳发现</strong>（段落3转折点） 最新发现：影响者对社会流行的影响远小于预期 → 极端结论：影响者可能根本不必要</p>\n<p>↓（深入分析）</p>\n<p><strong>逻辑层次4：影响力传播的真实机制</strong>（段落4机制剖析） 关键观察：【名人例外（如奥普拉）：影响力来自媒体而非人际 // 非名人影响者：互动人数有限】→ 传播链条问题：（每个人必须影响熟人→熟人再影响其熟人→连锁反应）→ 关键点：后续每个人能吸引多少关注，与最初影响者关系不大 → 脆弱性：两度之隔的人若有抵抗力，级联即失败</p>\n<p>↓（研究验证）</p>\n<p><strong>逻辑层次5：社会影响的真正动力</strong>（段落5研究结论） 研究方法：数千次计算机模拟（操纵影响能力和被影响倾向变量）→ 核心发现：【大范围连锁传播的要求：不是少数影响者 // 而是数量达到临界规模、容易接受影响的人】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：社会流行的关键不在于少数影响者的存在，而在于是否存在足够多容易被影响的人群。传统的&quot;影响者理论&quot;过度夸大了特殊个体的作用，忽视了社会网络中普通人的接受度才是决定性因素。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Distinguish public visibility from personal contact</p>\n<p>B. Let a successful beginning stand for the whole process</p>\n<p>C. Look for receptive people throughout the network</p>\n<p>D. Do not turn an early appearance into proof of causation</p>\n<p>E. Replace every influential with a celebrity</p>\n<p>F. Test what happens beyond the first circle</p>\n<p>G. Explain the appeal of a convenient marketing model</p>\n<p><strong>41.</strong></p>\n<p>A marketer who wants a new product to spread faces a large and varied audience. The two-step model appears to reduce that task to finding a small group of unusually persuasive or well-connected people. Reach them, the reasoning goes, and they will carry the message to everyone else. This is an attractive promise because it offers an identifiable target and a seemingly economical route to a much larger market. Its practical appeal, however, is not itself evidence that the route works as described. A theory can be useful for organising a campaign while still leaving its central account of influence insufficiently tested.</p>\n<p><strong>42.</strong></p>\n<p>When a style becomes popular, it is often possible to find a small group that adopted it before most others. Such a discovery tells us something about the sequence of events. It does not establish that the same people could have produced a comparable result in a less receptive population. Looking back from a successful trend also leaves out early adopters whose choices went nowhere. The first visible users may therefore be part of an explanation without being its decisive cause. To explain the eventual spread, we need evidence about what happened after their initial involvement, not merely a memorable story about who came first.</p>\n<p><strong>43.</strong></p>\n<p>A famous television personality may reach a huge audience without personally speaking to most of its members. That reach depends heavily on the medium through which the message travels. A well-connected individual in an ordinary community, by contrast, generally influences people through direct interaction. Even an extensive personal circle has limits. Treating these two kinds of reach as interchangeable makes it easy to exaggerate what an ordinary influential can accomplish. The relevant distinction is not whether one person is more impressive than another. It is whether the audience receives a broadcast message or is reached through a chain of personal contacts.</p>\n<p><strong>44.</strong></p>\n<p>Suppose an influential persuades several acquaintances to adopt a new practice. This is a successful first step, but a widespread change requires further steps that the original person does not control. Those acquaintances must reach others, and the later recipients must be willing to respond. If the next circle resists, the chain can stop despite the strength of the beginning. A campaign therefore cannot be evaluated only by counting the first person&#39;s immediate converts. It must follow the message into later circles and ask whether each link continues the process. Early success and extensive diffusion are different outcomes that require different evidence.</p>\n<p><strong>45.</strong></p>\n<p>Computer simulations allow researchers to vary both the ability to influence others and the willingness to be influenced. The finding described in the passage shifts attention from a few exceptional starters to a sufficiently large body of receptive people. This does not mean that every ordinary individual will pass on every message, or that a cascade can be guaranteed. It means that the surrounding population supplies a condition the starter alone cannot create. Understanding large-scale diffusion consequently requires attention to the distribution of receptiveness across a network. A search confined to its most prominent members may miss what allows influence to continue travelling.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】G. Explain the appeal of a convenient marketing model</p>\n<blockquote>\n<p>解释一种便利营销模型为何有吸引力</p>\n</blockquote>\n<p>这一段解释两步流动理论为什么受营销者欢迎，同时把“便于使用”与“得到证实”分开。</p>\n<blockquote>\n<p>reduce that task to finding a small group</p>\n</blockquote>\n<p>开头先摆出受众庞杂的现实，再说明模型把任务缩减为寻找少数人。营销者不必逐一接触全部消费者，这正是其便利所在。</p>\n<blockquote>\n<p>an identifiable target and a seemingly economical route</p>\n</blockquote>\n<p>可识别的对象和看起来省力的路径共同解释吸引力。seemingly保留了作者距离，不能直接译成已经证明有效。</p>\n<blockquote>\n<p>Its practical appeal, however, is not itself evidence</p>\n</blockquote>\n<p>转折把实践吸引力与实证依据分开。结尾不是否认营销者会使用这个模型，而是说明采用它不能自动证明其传播机制。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>庞杂的营销受众 → 模型把任务缩成寻找少数人 → 有明确对象且看似省力 → 便利不能代替机制验证</p>\n</blockquote>\n<p>appeal对应明确目标与省力路径，convenient marketing model对应两步流动理论在营销中的简化作用。Explain要求概括“为何受欢迎”，同时容纳末尾对其证据基础的保留。</p>\n<p>再看最强干扰项B：Let a successful beginning stand for the whole process。</p>\n<p>B把成功的开端当作整个过程，但本段并没有展示一次已经成功的宣传，更没有赞成这种替代。它只是分析模型许诺的便利，并提醒这种许诺尚需检验。把被限制的想象写成作者主张，方向就反了。</p>\n<p><strong>41题选G。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. Do not turn an early appearance into proof of causation</p>\n<blockquote>\n<p>不要把较早出现当成因果证明</p>\n</blockquote>\n<p>这一段针对“最先采用某事物的人必然驱动流行”的推断，区分时间先后和因果力量。</p>\n<blockquote>\n<p>something about the sequence of events</p>\n</blockquote>\n<p>找到早期使用者只先建立先后次序；这句话明确限定了眼前证据能够说明的范围。</p>\n<blockquote>\n<p>leaves out early adopters whose choices went nowhere</p>\n</blockquote>\n<p>回头只看成功趋势，会遗漏那些同样先行却没引起流行的人。这使“先出现”不足以独立解释成功。</p>\n<blockquote>\n<p>what happened after their initial involvement</p>\n</blockquote>\n<p>结尾要求观察后续传播过程。作者没有否认先行者参与其中，而是反对只靠一个谁先行动的故事完成因果解释。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>发现少数人率先采用 → 只证明时间次序 → 成功回溯遗漏未成功的先行者 → 还须检验后来怎样传播</p>\n</blockquote>\n<p>early appearance对应率先采用，proof of causation对应把先后次序提升为决定性原因。Do not turn准确概括本段的证据边界，并不等于认定早期使用者毫无作用。</p>\n<p>再看最强干扰项B：Let a successful beginning stand for the whole process。</p>\n<p>B把开端直接当成全程，恰是作者要求避免的做法。它抓住first和initial这些词，却忽略does not establish以及not merely的限制，把被批评的推断当成了标题结论。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】A. Distinguish public visibility from personal contact</p>\n<blockquote>\n<p>区分公众曝光与个人接触</p>\n</blockquote>\n<p>这一段比较名人的媒体触达和普通影响者的人际接触，说明不能把两种传播能力混为一谈。</p>\n<blockquote>\n<p>without personally speaking to most of its members</p>\n</blockquote>\n<p>名人能覆盖大批观众，并不意味着他逐一与这些人接触。观众规模首先由媒体渠道解释。</p>\n<blockquote>\n<p>through direct interaction</p>\n</blockquote>\n<p>普通社区里的有影响力者通常依赖直接互动。即使其熟人圈很大，也仍有边界，与广播式触达不是同一种条件。</p>\n<blockquote>\n<p>a broadcast message or ... a chain of personal contacts</p>\n</blockquote>\n<p>结尾明确指出真正的区分标准：接收广播信息，还是沿个人联系传播。这里比较的是传播机制，而非谁更优秀。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>名人借媒体触达大众 → 普通影响者依赖有限的直接交往 → 混同会夸大个人作用 → 按传播渠道区分两种触达</p>\n</blockquote>\n<p>public visibility对应电视等媒体带来的公众曝光，personal contact对应普通人的直接交往。Distinguish与结尾的区分标准一致，覆盖两个对象及其关系。</p>\n<p>再看最强干扰项E：Replace every influential with a celebrity。</p>\n<p>E把机制辨析改成营销建议：用名人替换所有影响者。原文没有比较替换后的成本或效果，也没有提出替换方案；媒体与人际不同，不能推出人人都应改用名人。</p>\n<p><strong>43题选A。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Test what happens beyond the first circle</p>\n<blockquote>\n<p>检验第一圈人之外会发生什么</p>\n</blockquote>\n<p>这一段沿传播链向后追踪，解释第一轮说服成功为什么还不能证明会出现广泛扩散。</p>\n<blockquote>\n<p>further steps that the original person does not control</p>\n</blockquote>\n<p>最初影响者能启动第一轮，却不能控制后面每次传递。段落由一个人的表现转向连续多个环节。</p>\n<blockquote>\n<p>If the next circle resists, the chain can stop</p>\n</blockquote>\n<p>下一圈人的抵制就能截断链条。这是条件性的反例，说明开端强并不能保障后续继续。</p>\n<blockquote>\n<p>follow the message into later circles</p>\n</blockquote>\n<p>结尾据此提出检验方式：追踪信息进入后续圈层，而不只清点第一轮受影响的人数。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>影响者说服熟人 → 熟人还须继续传播 → 后续圈层可能抵制 → 判断扩散必须检查第一圈之外</p>\n</blockquote>\n<p>first circle对应最初被说服的熟人，beyond对应他们后来接触的人及更多圈层。Test概括结尾提出的检验要求，能够同时覆盖传播条件和中断可能。</p>\n<p>再看最强干扰项B：Let a successful beginning stand for the whole process。</p>\n<p>B几乎就是本段反对的评价方式。即便开端成功，也要区分early success与extensive diffusion；用前者代表后者会删掉本段反复强调的后续条件。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】C. Look for receptive people throughout the network</p>\n<blockquote>\n<p>在整个网络中寻找愿意接受影响的人</p>\n</blockquote>\n<p>这一段根据模拟研究调整关注重点：解释大范围传播，需要看网络中是否有足够多愿意接受影响的人。</p>\n<blockquote>\n<p>both the ability to influence others and the willingness to be influenced</p>\n</blockquote>\n<p>模拟把影响别人的能力和接受影响的倾向都纳入，说明研究并未只研究少数能人。</p>\n<blockquote>\n<p>a sufficiently large body of receptive people</p>\n</blockquote>\n<p>发现把关键条件转向接受者群体的规模。这里要求达到足够数量，不是挑出另一个特别有能力的人。</p>\n<blockquote>\n<p>the distribution of receptiveness across a network</p>\n</blockquote>\n<p>结尾将研究含义落实到整个网络：接受度在哪里分布，影响才可能在哪里继续。前面的does not mean还排除了必然成功的夸张理解。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>同时调整影响能力与接受倾向 → 发现足够多接受者的重要性 → 不保证每人都传播或每次都成功 → 把观察范围扩展到整个网络</p>\n</blockquote>\n<p>receptive people对应易于接受影响的人，throughout the network对应接受度的网络分布。Look for表示把研究和观察重点转过去，没有额外许诺一定发生级联。</p>\n<p>再看最强干扰项E：Replace every influential with a celebrity。</p>\n<p>E仍把解决办法放在更换少数发起者，甚至要求全部换成名人。本段恰恰强调发起者独自造不出的群体条件，替换名人不能回答周围的人是否愿意继续传递。</p>\n<p><strong>45题选C。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>When a new style spreads rapidly, observers often search for the person who set it in motion. A familiar answer points to a small group of unusually informed or persuasive individuals. Their personal qualities seem to explain why everyone else eventually followed. Behind this answer lies a particular account of how information moves through society, commonly known as the two-step flow of communication.</p>\n<p><strong>B.</strong></p>\n<p>The difficulty is that being early does not by itself establish being decisive. A group can adopt a style before everyone else without controlling what later users do. To test its influence, we must move beyond the first adopters and examine the people they actually reach. Even a highly connected member of a community has a limited circle of direct contacts.</p>\n<p><strong>C.</strong></p>\n<p>These later recipients introduce a condition that no initial influential can supply alone. They must be sufficiently willing to accept a message and, in turn, carry it into other circles. If resistance appears only two links away, a promising start can end abruptly. The decisive question therefore concerns the population&#39;s receptiveness, rather than simply the special qualities of its first messenger.</p>\n<p><strong>D.</strong></p>\n<p>In this account, information passes from the media to the influential few and then from them to the wider public. For marketers, the attraction is clear: persuade a small, identifiable group and let it do much of the remaining work. Stories about trends often appear to support the model, especially when they reveal that a few people adopted a style before it became widely popular.</p>\n<p><strong>E.</strong></p>\n<p>A limited circle does not rule out widespread diffusion, but it means that direct persuasion cannot be the whole explanation. The first person&#39;s acquaintances must influence their own acquaintances, who must then influence others. Each additional link depends on a response beyond the starter&#39;s immediate reach. The analysis must therefore turn from the first messenger to these later recipients.</p>\n<p><strong>F.</strong></p>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied. Their finding pointed to a critical mass of easily influenced people as the principal requirement for extensive cascades. Exceptional starters were not the necessary ingredient they were often assumed to be. The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.</p>\n<p><strong>G.</strong></p>\n<p>That change of attention has a practical consequence. Finding a persuasive spokesperson may be useful, but it does not remove the need to ask whether a message can travel beyond the first audience. A population containing enough receptive people offers opportunities that even a gifted messenger cannot create single-handedly. Explaining a trend therefore requires evidence about both its beginning and the conditions that sustain its continuation.</p>\n<p><strong>H.</strong></p>\n<p>A memorable account of the beginning can still form part of that explanation. What it cannot do is stand in for the entire process. By tracing later responses and the conditions under which they connect, we can understand why an apparently strong start sometimes fades and why extensive change may occur without an exceptional starter. Social diffusion is a property of the unfolding network, not merely a biography of its first visible participant.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从寻找带动流行的人，引出两步流动理论</td>\n</tr>\n<tr>\n<td>B</td>\n<td>限制先行证据的因果含义，转向影响者实际接触范围</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明后续接受度是发起者不能独自提供的条件</td>\n</tr>\n<tr>\n<td>D</td>\n<td>展开两步流动理论，并解释营销吸引力与表面证据</td>\n</tr>\n<tr>\n<td>E</td>\n<td>由直接接触有限推出逐级传播，把注意力转向后来接收者</td>\n</tr>\n<tr>\n<td>F</td>\n<td>用模拟研究回答接受度问题，改变研究关注对象</td>\n</tr>\n<tr>\n<td>G</td>\n<td>说明关注对象改变后，对实际传播判断有什么启发</td>\n</tr>\n<tr>\n<td>H</td>\n<td>收束起点与全程的关系，强调网络持续展开的过程</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从寻找带动流行的人，引出两步流动理论 → 展开两步流动理论，并解释营销吸引力与表面证据 → 限制先行证据的因果含义，转向影响者实际接触范围 → 由直接接触有限推出逐级传播，把注意力转向后来接收者 → 说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发 → 收束起点与全程的关系，强调网络持续展开的过程</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → B → E → C → F → G → H</strong></p>\n<p>41—45：D、B、C、F、G。</p>\n<h3>排序题 · 41题</h3>\n<p>41题在已知A与E之间，是全文第2段的位置。它与紧邻两段形成A → D → B的关系。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Behind this answer lies a particular account of how information moves through society, commonly known as the two-step flow of communication.</p>\n</blockquote>\n<p>再看候选D的开头：</p>\n<blockquote>\n<p>In this account, information passes from the media to the influential few and then from them to the wider public.</p>\n</blockquote>\n<p>A最后提出two-step flow这一理论名称，D以In this account紧接着解释其路径。account对应的不是一段泛泛的流行故事，而是刚刚点名的信息传播理论。</p>\n<p>D先交代媒体到少数人、再到大众的两个环节，再解释营销者为何愿意采纳，最后给出少数人率先采用的表面证据。因此本段同时补足理论内容和下一段需要审视的证据。</p>\n<p>D段最终落在：</p>\n<blockquote>\n<p>Stories about trends often appear to support the model, especially when they reveal that a few people adopted a style before it became widely popular.</p>\n</blockquote>\n<p>后段B的开头是：</p>\n<blockquote>\n<p>The difficulty is that being early does not by itself establish being decisive.</p>\n</blockquote>\n<p>D末尾的adopted ... before连接B开头being early；B用The difficulty指出“先发生”还不能证明“有决定性作用”。证据先展示、局限后分析，顺序不能倒置。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>从寻找带动流行的人，引出两步流动理论 → 展开两步流动理论，并解释营销吸引力与表面证据 → 限制先行证据的因果含义，转向影响者实际接触范围</p>\n</blockquote>\n<p>再检验容易混淆的候选B。它的开头是：</p>\n<blockquote>\n<p>The difficulty is that being early does not by itself establish being decisive.</p>\n</blockquote>\n<p>B以The difficulty起笔，需要前面已有一个需要限制的具体理由。A只提出理论名称，未给出早期采用者的支持故事，直接接B会跳过理论内容和被质疑证据。</p>\n<p><strong>41题选D。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题在已知A与E之间，是全文第3段的位置。它与紧邻两段形成D → B → E的关系。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>Stories about trends often appear to support the model, especially when they reveal that a few people adopted a style before it became widely popular.</p>\n</blockquote>\n<p>再看候选B的开头：</p>\n<blockquote>\n<p>The difficulty is that being early does not by itself establish being decisive.</p>\n</blockquote>\n<p>D末尾说少数人先采用某风格，B立刻用being early与being decisive分开时间先后和决定性因果。The difficulty因此有明确对象，不是泛指营销都很困难。</p>\n<p>B不是停留在反驳，而是提出检验办法：看先行者实际接触了谁。随后说明哪怕联系广的个人，其直接交往范围仍有限，为从个人转向连续传播建立必要性。</p>\n<p>B段最终落在：</p>\n<blockquote>\n<p>Even a highly connected member of a community has a limited circle of direct contacts.</p>\n</blockquote>\n<p>后段E的开头是：</p>\n<blockquote>\n<p>A limited circle does not rule out widespread diffusion, but it means that direct persuasion cannot be the whole explanation.</p>\n</blockquote>\n<p>B以limited circle of direct contacts收束，固定E开头A limited circle原样接住，再说有限接触不排除广泛传播，却要求补充传播链。局限与补充机制正好相接。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>展开两步流动理论，并解释营销吸引力与表面证据 → 限制先行证据的因果含义，转向影响者实际接触范围 → 由直接接触有限推出逐级传播，把注意力转向后来接收者</p>\n</blockquote>\n<p>再检验容易混淆的候选C。它的开头是：</p>\n<blockquote>\n<p>These later recipients introduce a condition that no initial influential can supply alone.</p>\n</blockquote>\n<p>C开头These later recipients需要先出现后续接收者，D还只介绍两步路径和先行故事。把C放在E前，既缺少later recipients的近接先行词，也无法给E的A limited circle提供所需对象。</p>\n<p><strong>42题选B。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → C → F的关系。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The analysis must therefore turn from the first messenger to these later recipients.</p>\n</blockquote>\n<p>再看候选C的开头：</p>\n<blockquote>\n<p>These later recipients introduce a condition that no initial influential can supply alone.</p>\n</blockquote>\n<p>固定E末尾明确转向these later recipients，C开头These later recipients承接同一批人，并立即说明他们带来的条件。此处不再回头描述发起者的人格魅力。</p>\n<p>C把后续环节展开为接受信息并再传出去，接着用两步之外出现抵制说明链条可能终止。最后把问题提炼成population’s receptiveness，完成从传播机制到可研究问题的推进。</p>\n<p>C段最终落在：</p>\n<blockquote>\n<p>The decisive question therefore concerns the population&#39;s receptiveness, rather than simply the special qualities of its first messenger.</p>\n</blockquote>\n<p>后段F的开头是：</p>\n<blockquote>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.</p>\n</blockquote>\n<p>C以接受度问题结束，F用To investigate that question接住，随后说明模拟同时调整影响力和接受度。先提出要检验什么，再说怎样研究，衔接完整。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>由直接接触有限推出逐级传播，把注意力转向后来接收者 → 说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象</p>\n</blockquote>\n<p>再检验容易混淆的候选F。它的开头是：</p>\n<blockquote>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.</p>\n</blockquote>\n<p>F也讨论接受度，看似能直接接E，但that question需要前文已经明确提出接受度这一研究问题。E只要求转向后来接收者，尚未解释他们的接受意愿为什么成为决定条件。</p>\n<p><strong>43题选C。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成C → F → G的关系。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>The decisive question therefore concerns the population&#39;s receptiveness, rather than simply the special qualities of its first messenger.</p>\n</blockquote>\n<p>再看候选F的开头：</p>\n<blockquote>\n<p>To investigate that question, researchers used computer simulations in which influence and receptiveness could be varied.</p>\n</blockquote>\n<p>C最后把关键问题定为群体接受度，F以To investigate that question引入研究方法。that question回指的是接受度条件，而非最早是谁带头的名人追溯。</p>\n<p>F交代模拟可调整影响力和接受度，接着给出足够多易受影响者这一主要条件，再限制特殊发起者的必要性。由方法到发现，再到研究注意力变化，层次完整。</p>\n<p>F段最终落在：</p>\n<blockquote>\n<p>The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.</p>\n</blockquote>\n<p>后段G的开头是：</p>\n<blockquote>\n<p>That change of attention has a practical consequence.</p>\n</blockquote>\n<p>F末尾changed the object of attention被G的That change of attention承接。G再谈实际启发，形成研究发现之后才解释其应用的顺序。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发</p>\n</blockquote>\n<p>再检验容易混淆的候选G。它的开头是：</p>\n<blockquote>\n<p>That change of attention has a practical consequence.</p>\n</blockquote>\n<p>G一开始就是That change，但C提出了问题，尚未给出模拟结果和由此产生的关注变化。若先放G，会先引用未交代的研究转变，F的证据则被推迟到启发之后。</p>\n<p><strong>44题选F。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → G → H的关系。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The simulation result thus changed the object of attention from a few outstanding individuals to the surrounding network.</p>\n</blockquote>\n<p>再看候选G的开头：</p>\n<blockquote>\n<p>That change of attention has a practical consequence.</p>\n</blockquote>\n<p>F刚说明关注点由少数特殊个人转向网络，G用That change of attention接住，并说明这会改变怎样评价宣传者和后续传播。</p>\n<p>G承认能说服人的代言者可能有用，同时强调仍要检查信息能否走出第一批受众。其结尾要求兼看开端与延续条件，既不把能人全盘否定，也不把开端当成充分原因。</p>\n<p>G段最终落在：</p>\n<blockquote>\n<p>Explaining a trend therefore requires evidence about both its beginning and the conditions that sustain its continuation.</p>\n</blockquote>\n<p>后段H的开头是：</p>\n<blockquote>\n<p>A memorable account of the beginning can still form part of that explanation.</p>\n</blockquote>\n<p>G末尾的Explaining a trend给固定H的that explanation提供对象。H继而承认开端故事可成为解释的一部分，但不能替代全过程，正好收束G提出的两方面证据。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>用模拟研究回答接受度问题，改变研究关注对象 → 说明关注对象改变后，对实际传播判断有什么启发 → 收束起点与全程的关系，强调网络持续展开的过程</p>\n</blockquote>\n<p>再检验容易混淆的候选B。它的开头是：</p>\n<blockquote>\n<p>The difficulty is that being early does not by itself establish being decisive.</p>\n</blockquote>\n<p>B回到先行与决定性的初步区分，并以接触圈有限收尾。这适合导入传播链，却不能承接F刚形成的研究转变；放在末尾还会把已经展开的机制重新退回起点。</p>\n<p><strong>45题选G。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>cr
