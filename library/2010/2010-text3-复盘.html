ativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q34-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读出 each person so affected 与 must then influence 所构成的接力链。参与接收和传递的人仍在网络中，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section>"},{"title":"A. stay outside the network of social influence","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> these people 指处在社会影响网络之外的人。\n\n`outside the network`与前面`each person so affected`的链条相对，回看`these people`所在的整句。\n\n`A`说这些人处在社会影响网络之外。`network`现在可以连着`outside`一起读，范围不再含糊。\n\n原句先用`each person so affected`说明他们已经承接上一轮影响，再用`must then influence`和`who must in turn influence`说明他们继续把影响传下去。接收、传递、再接收，正是在这个网络内发生的连续动作。`A`将参与传递的人说成停留在网络之外，与他们在句中承担的角色相反。\n\n不能把“距离起点已经较远”误读成“不在网络中”：距离远只表示经过较多层，退出网络则表示不再属于这一传递关系，句子并没有这样描述他们。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q34-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读出 each person so affected 与 must then influence 所构成的接力链。参与接收和传递的人仍在网络中，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><code>outside the network</code>与前面<code>each person so affected</code>的链条相对，回看<code>these people</code>所在的整句。</p>\n<p><code>A</code>说这些人处在社会影响网络之外。<code>network</code>现在可以连着<code>outside</code>一起读，范围不再含糊。</p>\n<p>原句先用<code>each person so affected</code>说明他们已经承接上一轮影响，再用<code>must then influence</code>和<code>who must in turn influence</code>说明他们继续把影响传下去。接收、传递、再接收，正是在这个网络内发生的连续动作。<code>A</code>将参与传递的人说成停留在网络之外，与他们在句中承担的角色相反。</p>\n<p>不能把“距离起点已经较远”误读成“不在网络中”：距离远只表示经过较多层，退出网络则表示不再属于这一传递关系，句子并没有这样描述他们。</p>\n</section>"},{"title":"A. stay outside the network of social influence","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n>\n> 然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。\n\n原句不断重复“受影响 → 影响自己的熟人”的动作，然后逐个问这些接力者还能引来多少关注。`these people` 所在的位置承接的是参与者。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> These people remain outside the influence network and take no part in receiving or passing on its influence.\n>\n> 这些人停留在影响网络之外，不参与接收或传递其中的影响。\n\n`A` 所需的是未参与网络，原文却已经给这些人安排了接收和传递两种动作。把网络外的人代入 `these people`，前面的接力关系就断了。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q34-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已读出 each person so affected 与 must then influence 所构成的接力链。参与接收和传递的人仍在网络中，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指处在社会影响网络之外的人。</p>\n</blockquote>\n<p><code>outside the network</code>与前面<code>each person so affected</code>的链条相对，回看<code>these people</code>所在的整句。</p>\n<p><code>A</code>说这些人处在社会影响网络之外。<code>network</code>现在可以连着<code>outside</code>一起读，范围不再含糊。</p>\n<p>原句先用<code>each person so affected</code>说明他们已经承接上一轮影响，再用<code>must then influence</code>和<code>who must in turn influence</code>说明他们继续把影响传下去。接收、传递、再接收，正是在这个网络内发生的连续动作。<code>A</code>将参与传递的人说成停留在网络之外，与他们在句中承担的角色相反。</p>\n<p>不能把“距离起点已经较远”误读成“不在网络中”：距离远只表示经过较多层，退出网络则表示不再属于这一传递关系，句子并没有这样描述他们。</p>\n</section><section class=\"revealPart\" id=\"focus-q34-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>原句不断重复“受影响 → 影响自己的熟人”的动作，然后逐个问这些接力者还能引来多少关注。<code>these people</code> 所在的位置承接的是参与者。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These people remain outside the influence network and take no part in receiving or passing on its influence.</p>\n<p>这些人停留在影响网络之外，不参与接收或传递其中的影响。</p>\n</blockquote>\n<p><code>A</code> 所需的是未参与网络，原文却已经给这些人安排了接收和传递两种动作。把网络外的人代入 <code>these people</code>，前面的接力关系就断了。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. have little contact with the source of influence","raw":"### B. have little contact with the source of influence\n\n> these people 指与最初影响源接触很少的人。\n\n**做题模式中的状态：** 当时检查了 has little to do with 的完整主语，发现关系不大的是后续关注人数，不是这些人与起点人物的接触频率，所以第一轮排除 B。\n\n**错误类型：第一类——歪曲原意。**\n\n它借用 `little` 和 `initial influential`，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。\n\n**出处：**\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q34-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>these people 指与最初影响源接触很少的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时检查了 has little to do with 的完整主语，发现关系不大的是后续关注人数，不是这些人与起点人物的接触频率，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用 <code>little</code> 和 <code>initial influential</code>，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section>"},{"title":"B. have little contact with the source of influence","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> these people 指与最初影响源接触很少的人。\n\n`little contact`看似接近`has little to do with the initial influential`，但要看`little to do with`前面的主语。\n\n`B`容易被`has little to do with the initial influential`吸引，但先拆主语就能看到问题。`has little to do with`前面的完整主语是`just how many others pay attention to each of these people`，即每个节点能引来多少其他人关注；并不是`these people`本身。\n\n后面说的是这个人数与最初影响者关系不大，不是在统计两个人见面或联络的频率。`B`把传播结果的依赖关系改成`little contact`，既换了主语，也换了被衡量的事情。题目要解释`these people`承接哪一群人，不能把后面另一个判断中的`little`剪下来，改作这些人与起点人物的接触特点。\n\n这个句法差别在本句中就可以分清。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q34-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>these people 指与最初影响源接触很少的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时检查了 has little to do with 的完整主语，发现关系不大的是后续关注人数，不是这些人与起点人物的接触频率，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用 <code>little</code> 和 <code>initial influential</code>，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指与最初影响源接触很少的人。</p>\n</blockquote>\n<p><code>little contact</code>看似接近<code>has little to do with the initial influential</code>，但要看<code>little to do with</code>前面的主语。</p>\n<p><code>B</code>容易被<code>has little to do with the initial influential</code>吸引，但先拆主语就能看到问题。<code>has little to do with</code>前面的完整主语是<code>just how many others pay attention to each of these people</code>，即每个节点能引来多少其他人关注；并不是<code>these people</code>本身。</p>\n<p>后面说的是这个人数与最初影响者关系不大，不是在统计两个人见面或联络的频率。<code>B</code>把传播结果的依赖关系改成<code>little contact</code>，既换了主语，也换了被衡量的事情。题目要解释<code>these people</code>承接哪一群人，不能把后面另一个判断中的<code>little</code>剪下来，改作这些人与起点人物的接触特点。</p>\n<p>这个句法差别在本句中就可以分清。</p>\n</section>"},{"title":"B. have little contact with the source of influence","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n>\n> 然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。\n\n前半句定义接力者，后半句讨论每个接力者还能吸引多少人。作者从传播角色转到传播效果，没有开始描述与起点人物见面或联络的频率。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> These people have little direct contact with the person who first set the influence in motion.\n>\n> 这些人与最初发动影响的那个人直接接触很少。\n\n`B` 至少需要一句关于这些人接触频率的说明。实际 `has little to do with` 的主语是 `how many others pay attention`，不能从结果的依赖关系跳到人与人的接触频率。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q34-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>these people 指与最初影响源接触很少的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时检查了 has little to do w ittle direct contact with the person who first set the influence in motion.</p>\n<p>这些人与最初发动影响的那个人直接接触很少。</p>\n</blockquote>\n<p><code>B</code> 至少需要一句关于这些人接触频率的说明。实际 <code>has little to do with</code> 的主语是 <code>how many others pay attention</code>，不能从结果的依赖关系跳到人与人的接触频率。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. are influenced and then influence others","raw":"### C. are influenced and then influence others\n\n> these people 指先受到影响、随后又影响别人的人。\n\n**做题模式中的状态：** 当时沿 each person so affected、must then influence、who must in turn influence 和 and so on 连读，C 同时保留了接收与传递两个方向，第一轮保留并选 C。\n\n**选项类型：同义改写。**\n\n它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。\n\n**出处：**\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q34-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时沿 each person so affected、must then influence、who must in turn influence 和 and so on 连读，C 同时保留了接收与传递两个方向，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section>"},{"title":"C. are influenced and then influence others","raw":"#### 定位比对法\n\n先把`C`接回题干，整句话就变成：\n\n> these people 指先受到影响、随后又影响别人的人。\n\n`are influenced and then influence others`正好接上`each person so affected must then influence`和`who must in turn influence`。\n\n`C`保留了句中连续出现的两种角色。`each person so affected`先承接前一轮影响，`must then influence`说明这个人还要继续影响其他人；`who must in turn influence theirs`把同一种角色传到下一层，`and so on`再把链条延续。\n\n`these people`放在后面逐个讨论能吸引多少关注，回接的就是这些接力的人。`C`不要求所有人都由同一位起点人物直接发动，也没有把链条限定为一层，因此能涵盖已经写出的各层接收者和传播者。\n\n它的依据不是仅仅重复`influence`，而是被影响、再影响这两个方向在同一个人身上前后相接，逐层重复。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q34-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时沿 each person so affected、must then influence、who must in turn influence 和 and so on 连读，C 同时保留了接收与传递两个方向，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><code>are influenced and then influence others</code>正好接上<code>each person so affected must then influence</code>和<code>who must in turn influence</code>。</p>\n<p><code>C</code>保留了句中连续出现的两种角色。<code>each person so affected</code>先承接前一轮影响，<code>must then influence</code>说明这个人还要继续影响其他人；<code>who must in turn influence theirs</code>把同一种角色传到下一层，<code>and so on</code>再把链条延续。</p>\n<p><code>these people</code>放在后面逐个讨论能吸引多少关注，回接的就是这些接力的人。<code>C</code>不要求所有人都由同一位起点人物直接发动，也没有把链条限定为一层，因此能涵盖已经写出的各层接收者和传播者。</p>\n<p>它的依据不是仅仅重复<code>influence</code>，而是被影响、再影响这两个方向在同一个人身上前后相接，逐层重复。</p>\n</section>"},{"title":"C. are influenced and then influence others","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n>\n> 然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。\n\n作者先写第一层接力者影响熟人，再让熟人影响自己的熟人，用 `and so on` 延长链条；随后 `these people` 逐个回看这些接力者的传播效果。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Each person receives influence from someone else and then passes it on to further acquaintances.\n>\n> 每个人先受到别人的影响，再把它传给更多熟人。\n\n`C` 所需的这两个连续动作，在 `each person` 和后面的 `who` 所指人群身上反复出现。把 `C` 代回去，既能接住前文，也能接住每个人后续吸引多少人的讨论。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q34-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时沿 each person so affected、must then influence、who must in turn influence 和 and so on 连读，C 同时保留了接收与传递两个方向，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指先受到影响、随后又影响别人的人。</p>\n</blockquote>\n<p><code>are influenced and then influence others</code>正好接上<code>each person so affected must then influence</code>和<code>who must in turn influence</code>。</p>\n<p><code>C</code>保留了句中连续出现的两种角色。<code>each person so affected</code>先承接前一轮影响，<code>must then influence</code>说明这个人还要继续影响其他人；<code>who must in turn influence theirs</code>把同一种角色传到下一层，<code>and so on</code>再把链条延续。</p>\n<p><code>these people</code>放在后面逐个讨论能吸引多少关注，回接的就是这些接力的人。<code>C</code>不要求所有人都由同一位起点人物直接发动，也没有把链条限定为一层，因此能涵盖已经写出的各层接收者和传播者。</p>\n<p>它的依据不是仅仅重复<code>influence</code>，而是被影响、再影响这两个方向在同一个人身上前后相接，逐层重复。</p>\n</section><section class=\"revealPart\" id=\"focus-q34-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>作者先写第一层接力者影响熟人，再让熟人影响自己的熟人，用 <code>and so on</code> 延长链条；随后 <code>these people</code> 逐个回看这些接力者的传播效果。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Each person receives influence from someone else and then passes it on to further acquaintances.</p>\n<p>每个人先受到别人的影响，再把它传给更多熟人。</p>\n</blockquote>\n<p><code>C</code> 所需的这两个连续动作，在 <code>each person</code> 和后面的 <code>who</code> 所指人群身上反复出现。把 <code>C</code> 代回去，既能接住前文，也能接住每个人后续吸引多少人的讨论。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. are influenced by the initial influential","raw":"### D. are influenced by the initial influential\n\n> these people 指受到最初有影响力者影响的人。\n\n**做题模式中的状态：** 当时没有给 D 擅自加上 only 或 directly。比较后发现它只用共同来源界定人群，未保留逐层接收、再传递的角色，因此排除 D、选择 C。\n\n**错误类型：第一类——歪曲原意。**\n\n它抓住句末的 `initial influential`，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。\n\n**出处：**\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q34-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有给 D 擅自加上 only 或 directly。比较后发现它只用共同来源界定人群，未保留逐层接收、再传递的角色，因此排除 D、选择 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它抓住句末的 <code>initial influential</code>，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section>"},{"title":"D. are influenced by the initial influential","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> these people 指受到最初有影响力者影响的人。\n\n`initial influential`出现在句末，但前面`who`和`and so on`已经把链条延伸到后面的多层人。\n\n`D`写的是受到最初有影响力者影响的人，没有`only`或`directly`，不能擅自给它加上“仅限直接影响”。但它仍然用同一个影响来源来界定这群人：`by the initial influential`。\n\n原句界定的则是一个反复出现的角色：`each person`受到前一层影响，又影响后一层；后面的`who`与`and so on`继续这种重复。共同追溯到一个起点，与在每一层接收并继续传递，不是同一个指代说明。`D`只写来源，没有说明句中这些人为何还分别拥有自己的受影响对象，也不能完整承接逐层变化的施动者。\n\n`C`直接保留了原句连续安排的两个动作，所以指代对应更准确。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q34-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有给 D 擅自加上 only 或 directly。比较后发现它只用共同来源界定人群，未保留逐层接收、再传递的角色，因此排除 D、选择 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它抓住句末的 <code>initial influential</code>，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><code>initial influential</code>出现在句末，但前面<code>who</code>和<code>and so on</code>已经把链条延伸到后面的多层人。</p>\n<p><code>D</code>写的是受到最初有影响力者影响的人，没有<code>only</code>或<code>directly</code>，不能擅自给它加上“仅限直接影响”。但它仍然用同一个影响来源来界定这群人：<code>by the initial influential</code>。</p>\n<p>原句界定的则是一个反复出现的角色：<code>each person</code>受到前一层影响，又影响后一层；后面的<code>who</code>与<code>and so on</code>继续这种重复。共同追溯到一个起点，与在每一层接收并继续传递，不是同一个指代说明。<code>D</code>只写来源，没有说明句中这些人为何还分别拥有自己的受影响对象，也不能完整承接逐层变化的施动者。</p>\n<p><code>C</code>直接保留了原句连续安排的两个动作，所以指代对应更准确。</p>\n</section>"},{"title":"D. are influenced by the initial influential","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n>\n> 然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。\n\n原句的行动者从 `each person` 转到 `his or her own acquaintances`，再由 `who` 转到下一层。`these people` 概括的是这些连续节点，后面还讨论每个节点自己的关注者。\n\n如果`D`真是作者的意思，文章至少得写成：\n\n> The discussion concerns people affected by the initial influential, with their common source of influence defining the group.\n>\n> 这段讨论的是受到最初影响者影响的人，并用这个共同来源来界定他们。\n\n`D` 需要把“同一来源”作为人群的定义；实际句子用反复发生的两种动作定义他们。`D` 没有 `only` 或 `directly`，也仍不能替代 `C` 对整条接力链的准确概括。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q34-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有给 D 擅自加上 only 或 directly。比较后发现它只用共同来源界定人群，未保留逐层接收、再传递的角色，因此排除 D、选择 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它抓住句末的 <code>initial influential</code>，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>these people 指受到最初有影响力者影响的人。</p>\n</blockquote>\n<p><code>initial influential</code>出现在句末，但前面<code>who</code>和<code>and so on</code>已经把链条延伸到后面的多层人。</p>\n<p><code>D</code>写的是受到最初有影响力者影响的人，没有<code>only</code>或<code>directly</code>，不能擅自给它加上“仅限直接影响”。但它仍然用同一个影响来源来界定这群人：<code>by the initial influential</code>。</p>\n<p>原句界定的则是一个反复出现的角色：<code>each person</code>受到前一层影响，又影响后一层；后面的<code>who</code>与<code>and so on</code>继续这种重复。共同追溯到一个起点，与在每一层接收并继续传递，不是同一个指代说明。<code>D</code>只写来源，没有说明句中这些人为何还分别拥有自己的受影响对象，也不能完整承接逐层变化的施动者。</p>\n<p><code>C</code>直接保留了原句连续安排的两个动作，所以指代对应更准确。</p>\n</section><section class=\"revealPart\" id=\"focus-q34-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n<p>原句的行动者从 <code>each person</code> 转到 <code>his or her own acquaintances</code>，再由 <code>who</code> 转到下一层。<code>these people</code> 概括的是这些连续节点，后面还讨论每个节点自己的关注者。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The discussion concerns people affected by the initial influential, with their common source of influence defining the group.</p>\n<p>这段讨论的是受到最初影响者影响的人，并用这个共同来源来界定他们。</p>\n</blockquote>\n<p><code>D</code> 需要把“同一来源”作为人群的定义；实际句子用反复发生的两种动作定义他们。<code>D</code> 没有 <code>only</code> 或 <code>directly</code>，也仍不能替代 <code>C</code> 对整条接力链的准确概括。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. C. are influenced and then influence others**\n\n- A：它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。\n- B：它借用 little 和 initial influential，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。\n- C：它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。\n- D：它抓住句末的 initial influential，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"34题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"34","questionConclusion":true},"html":"<blockquote>\n<p><strong>34. C. are influenced and then influence others</strong></p>\n</blockquote>\n<ul>\n<li>A：它把已经参与传播的人改成网络外的人。离最初人物较远只表示传播经过了更多层，并不意味着已经退出传播网络。</li>\n<li>B：它借用 little 和 initial influential，把“后续扩散人数不太取决于起点人物”改成“这些人与起点人物很少来往”，同时换了主语和关系。</li>\n<li>C：它把长句中反复出现的传播角色缩成先受影响、再影响别人。受到谁影响可以逐层变化，但每个人承担的这两种动作保持一致。</li>\n<li>D：它抓住句末的 initial influential，却把各层人物不断变化的接力关系收缩成与同一个起点的关系。能追溯到一个起点，不等于已经准确解释代词承接的角色。</li>\n</ul>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n> What is the essential element in the dynamics of social influence?\n>\n> 社会影响动态过程中的关键要素是什么？\n\n### 题型\n\n具体细节题。essential element 对应末段 principal requirement；先区分研究考察了哪些变量，再看研究最终选出了什么条件。\n\n### 核心出处\n\n> Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people's ability to influence others and their tendency to be influenced.\n>\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n\n研究同时考察影响别人的能力与被影响的倾向，结论却用 not ... but, rather ... 明确将关键放在足够多容易受影响的人身上。答案要概括这群人的接受倾向，不能把所有研究变量都当作结论。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"35","questionIntro":true},"html":"<blockquote>\n<p>What is the essential element in the dynamics of social influence?</p>\n<p>社会影响动态过程中的关键要素是什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。essential element 对应末段 principal requirement；先区分研究考察了哪些变量，再看研究最终选出了什么条件。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<p>研究同时考察影响别人的能力与被影响的倾向，结论却用 not ... but, rather ... 明确将关键放在足够多容易受影响的人身上。答案要概括这群人的接受倾向，不能把所有研究变量都当作结论。</p>\n"},{"title":"A. The eagerness to be accepted.","raw":"### A. The eagerness to be accepted.\n\n> 社会影响动态过程的关键要素是渴望被别人接受。\n\n**做题模式中的状态：** 当时已分清“自己接受影响”与“希望别人接纳自己”的动作方向。A 将接受倾向改成寻求认可，第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\n它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。\n\n**出处：**\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q35-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已分清“自己接受影响”与“希望别人接纳自己”的动作方向。A 将接受倾向改成寻求认可，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section>"},{"title":"A. The eagerness to be accepted.","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 社会影响动态过程的关键要素是渴望被别人接受。\n\n`eagerness to be accepted`说的是寻求接纳，回看末句`easily influenced people`所描述的倾向。\n\n`A`说渴望被别人接受。这里被接受的对象是自己，方向是他人接纳自己；原文`easily influenced people`说的是自己容易受到别人的影响，可能改变观念或行为。\n\n两者都涉及别人，却不是同一种关系。一个人接受某种新做法，不必然是在争取群体认可；想被群体接纳，也不能直接说明他接受了传播来的具体影响。题干寻找研究结论中的关键要素，要对应研究点明的条件，不能把一种可能的心理动机替换成条件本身。\n\n`A`的错误是把接受影响的倾向换成寻求他人接纳，并不需要声称这两种心理在现实中绝不可能同时出现。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q35-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已分清“自己接受影响”与“希望别人接纳自己”的动作方向。A 将接受倾向改成寻求认可，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><code>eagerness to be accepted</code>说的是寻求接纳，回看末句<code>easily influenced people</code>所描述的倾向。</p>\n<p><code>A</code>说渴望被别人接受。这里被接受的对象是自己，方向是他人接纳自己；原文<code>easily influenced people</code>说的是自己容易受到别人的影响，可能改变观念或行为。</p>\n<p>两者都涉及别人，却不是同一种关系。一个人接受某种新做法，不必然是在争取群体认可；想被群体接纳，也不能直接说明他接受了传播来的具体影响。题干寻找研究结论中的关键要素，要对应研究点明的条件，不能把一种可能的心理动机替换成条件本身。</p>\n<p><code>A</code>的错误是把接受影响的倾向换成寻求他人接纳，并不需要声称这两种心理在现实中绝不可能同时出现。</p>\n</section>"},{"title":"A. The eagerness to be accepted.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n>\n> 他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。\n\n结论先排开少数影响者，再将关键放到足够多容易受影响的人上。作者在说明传播对象的接受性，没有解释他们是否为了融入群体而行动。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> The critical factor is that many people are eager to gain acceptance from others.\n>\n> 关键因素是许多人渴望获得别人的接纳。\n\n`A` 至少需要把寻求认可写成研究选出的动机。实际 `easily influenced` 只说明受影响的倾向，不能替作者补上为什么愿意受影响的心理解释。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q35-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已分清“自己接受影响”与“希望别人接纳自己”的动作方向。A 将接受倾向改成寻求认可，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是渴望被别人接受。</p>\n</blockquote>\n<p><code>eagerness to be accepted</code>说的是寻求接纳，回看末句<code>easily influenced people</code>所描述的倾向。</p>\n<p><code>A</code>说渴望被别人接受。这里被接受的对象是自己，方向是他人接纳自己；原文<code>easily influenced people</code>说的是自己容易受到别人的影响，可能改变观念或行为。</p>\n<p>两者都涉及别人，却不是同一种关系。一个人接受某种新做法，不必然是在争取群体认可；想被群体接纳，也不能直接说明他接受了传播来的具体影响。题干寻找研究结论中的关键要素，要对应研究点明的条件，不能把一种可能的心理动机替换成条件本身。</p>\n<p><code>A</code>的错误是把接受影响的倾向换成寻求他人接纳，并不需要声称这两种心理在现实中绝不可能同时出现。</p>\n</section><section class=\"revealPart\" id=\"focus-q35-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>结论先排开少数影响者，再将关键放到足够多容易受影响的人上。作者在说明传播对象的接受性，没有解释他们是否为了融入群体而行动。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The critical factor is that many people are eager to gain acceptance from others.</p>\n<p>关键因素是许多人渴望获得别人的接纳。</p>\n</blockquote>\n<p><code>A</code> 至少需要把寻求认可写成研究选出的动机。实际 <code>easily influenced</code> 只说明受影响的倾向，不能替作者补上为什么愿意受影响的心理解释。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. The impulse to influence others.","raw":"### B. The impulse to influence others.\n\n> 社会影响动态过程的关键要素是主动影响他人的冲动。\n\n**做题模式中的状态：** 当时没有把研究考察的 ability to influence others 直接当成研究结果，而是读到 not ... but rather 后的条件，所以第一轮排除 B。\n\n**错误类型：第一类——歪曲原意。**\n\n它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。\n\n**出处：**\n\n> Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people's ability to influence others and their tendency to be influenced.\n>\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q35-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有把研究考察的 ability to influence others 直接当成研究结果，而是读到 not ... but rather 后的条件，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section>"},{"title":"B. The impulse to influence others.","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> 社会影响动态过程的关键要素是主动影响他人的冲动。\n\n`impulse to influence others`对应研究所考察的`ability to influence others`，但末句选出的条件在另一边。\n\n`B`说有主动影响他人的冲动。第一句确实同时考察人们影响别人的能力和受影响的倾向，因此看到`to influence others`不能立刻认作答案。\n\n下一句才报告研究发现，用`not`...`but rather`...把关键条件放在足够多容易受影响的人身上。题目问`essential element`，要接研究选出的条件，而不是把研究过的所有因素都当成结论。`B`不仅把`ability`改成`impulse`，还将接受影响的一端转成主动发出影响的一端。\n\n传播当然还包含继续影响他人的动作，但这不能让主动发出的冲动代替末句明确选定的接受倾向。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q35-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有把研究考察的 ability to influence others 直接当成研究结果，而是读到 not ... but rather 后的条件，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><code>impulse to influence others</code>对应研究所考察的<code>ability to influence others</code>，但末句选出的条件在另一边。</p>\n<p><code>B</code>说有主动影响他人的冲动。第一句确实同时考察人们影响别人的能力和受影响的倾向，因此看到<code>to influence others</code>不能立刻认作答案。</p>\n<p>下一句才报告研究发现，用<code>not</code>...<code>but rather</code>...把关键条件放在足够多容易受影响的人身上。题目问<code>essential element</code>，要接研究选出的条件，而不是把研究过的所有因素都当成结论。<code>B</code>不仅把<code>ability</code>改成<code>impulse</code>，还将接受影响的一端转成主动发出影响的一端。</p>\n<p>传播当然还包含继续影响他人的动作，但这不能让主动发出的冲动代替末句明确选定的接受倾向。</p>\n</section>"},{"title":"B. The impulse to influence others.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people's ability to influence others and their tendency to be influenced.\n>\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n>\n> 基于这个关于人际影响的基本事实，研究人员通过对人群进行数千次计算机模拟来研究社会影响的动态，操纵涉及人们影响他人的能力和他们被影响倾向的许多变量。他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。\n\n前一句列出施加影响与接受影响两类变量，后一句才报告主要条件。两句是“研究什么 → 发现什么”，并不是所考察的变量个个都是关键。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> The simulations show that people’s impulse to influence others is the principal requirement for widespread propagation.\n>\n> 模拟显示，人们主动影响他人的冲动是广泛传播的首要条件。\n\n`B` 需要结论落在主动施加影响上，原文却落在容易被影响的人上。不能因为前句出现 `influence others`，就抹掉结论中的方向选择。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q35-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有把研究考察的 ability to influence others 直接当成研究结果，而是读到 not ... but rather 后的条件，所以第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是主动影响他人的冲动。</p>\n</blockquote>\n<p><code>impulse to influence others</code>对应研究所考察的<code>ability to influence others</code>，但末句选出的条件在另一边。</p>\n<p><code>B</code>说有主动影响他人的冲动。第一句确实同时考察人们影响别人的能力和受影响的倾向，因此看到<code>to influence others</code>不能立刻认作答案。</p>\n<p>下一句才报告研究发现，用<code>not</code>...<code>but rather</code>...把关键条件放在足够多容易受影响的人身上。题目问<code>essential element</code>，要接研究选出的条件，而不是把研究过的所有因素都当成结论。<code>B</code>不仅把<code>ability</code>改成<code>impulse</code>，还将接受影响的一端转成主动发出影响的一端。</p>\n<p>传播当然还包含继续影响他人的动作，但这不能让主动发出的冲动代替末句明确选定的接受倾向。</p>\n</section><section class=\"revealPart\" id=\"focus-q35-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced.</p>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>基于这个关于人际影响的基本事实，研究人员通过对人群进行数千次计算机模拟来研究社会影响的动态，操纵涉及人们影响他人的能力和他们被影响倾向的许多变量。他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>前一句列出施加影响与接受影响两类变量，后一句才报告主要条件。两句是“研究什么 → 发现什么”，并不是所考察的变量个个都是关键。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The simulations show that people’s impulse to influence others is the principal requirement for widespread propagation.</p>\n<p>模拟显示，人们主动影响他人的冲动是广泛传播的首要条件。</p>\n</blockquote>\n<p><code>B</code> 需要结论落在主动施加影响上，原文却落在容易被影响的人上。不能因为前句出现 <code>influence others</code>，就抹掉结论中的方向选择。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. The readiness to be influenced.","raw":"### C. The readiness to be influenced.\n\n> 社会影响动态过程的关键要素是愿意或容易受到影响。\n\n**做题模式中的状态：** 当时 readiness to be influenced 与 easily influenced people 在接受方向上相接；同时保留了需要足够多人这一原文条件，第一轮保留并选 C。\n\n**选项类型：同义改写。**\n\n它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 `a critical mass` 所要求的人数规模。\n\n**出处：**\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q35-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 readiness to be influenced 与 easily influenced people 在接受方向上相接；同时保留了需要足够多人这一原文条件，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 <code>a critical mass</code> 所要求的人数规模。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section>"},{"title":"C. The readiness to be influenced.","raw":"#### 定位比对法\n\n先把`C`接回题干，整句话就变成：\n\n> 社会影响动态过程的关键要素是愿意或容易受到影响。\n\n`readiness to be influenced`接上`easily influenced people`，两个说法都落在接受影响这一端。\n\n`C`的`readiness to be influenced`说一个人愿意或容易接受影响，`to be influenced`保留被动方向，与`easily influenced people`对应。原句还要求`a critical mass`，即这样的人达到足够规模；四个选项比较的是这一要素的性质，所以`C`概括这群人的共同倾向，并不是声称只要一个人愿意就一定发生大范围传播。\n\n`not of a few influentials`排开的是把关键归给少数特殊人物的看法，不是否认传播还需要接触、传递。\n\n把人数条件与个体倾向一起读，就能看到`C`承接的是研究最后明确放到关键位置的接受端。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q35-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 readiness to be influenced 与 easily influenced people 在接受方向上相接；同时保留了需要足够多人这一原文条件，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 <code>a critical mass</code> 所要求的人数规模。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><code>readiness to be influenced</code>接上<code>easily influenced people</code>，两个说法都落在接受影响这一端。</p>\n<p><code>C</code>的<code>readiness to be influenced</code>说一个人愿意或容易接受影响，<code>to be influenced</code>保留被动方向，与<code>easily influenced people</code>对应。原句还要求<code>a critical mass</code>，即这样的人达到足够规模；四个选项比较的是这一要素的性质，所以<code>C</code>概括这群人的共同倾向，并不是声称只要一个人愿意就一定发生大范围传播。</p>\n<p><code>not of a few influentials</code>排开的是把关键归给少数特殊人物的看法，不是否认传播还需要接触、传递。</p>\n<p>把人数条件与个体倾向一起读，就能看到<code>C</code>承接的是研究最后明确放到关键位置的接受端。</p>\n</section>"},{"title":"C. The readiness to be influenced.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n>\n> 他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。\n\n作者用 `not of a few influentials` 把重点从少数特殊人物移开，再用 `but`, `rather` 指向足够多容易受影响的人，完成了关键条件的确定。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Widespread propagation requires enough people who are ready to be influenced.\n>\n> 广泛传播需要足够多愿意受到影响的人。\n\n`C` 所需的接受倾向和原文条件一致。这里不是“一个人愿意就保证传播成功”，而是关键人群达到足够规模，并共同具有接受影响的倾向。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q35-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 readiness to be influenced 与 easily influenced people 在接受方向上相接；同时保留了需要足够多人这一原文条件，第一轮保留并选 C。</p>\n<p><strong>选项类型：同义改写。</strong></p>\n<p>它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 <code>a critical mass</code> 所要求的人数规模。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是愿意或容易受到影响。</p>\n</blockquote>\n<p><code>readiness to be influenced</code>接上<code>easily influenced people</code>，两个说法都落在接受影响这一端。</p>\n<p><code>C</code>的<code>readiness to be influenced</code>说一个人愿意或容易接受影响，<code>to be influenced</code>保留被动方向，与<code>easily influenced people</code>对应。原句还要求<code>a critical mass</code>，即这样的人达到足够规模；四个选项比较的是这一要素的性质，所以<code>C</code>概括这群人的共同倾向，并不是声称只要一个人愿意就一定发生大范围传播。</p>\n<p><code>not of a few influentials</code>排开的是把关键归给少数特殊人物的看法，不是否认传播还需要接触、传递。</p>\n<p>把人数条件与个体倾向一起读，就能看到<code>C</code>承接的是研究最后明确放到关键位置的接受端。</p>\n</section><section class=\"revealPart\" id=\"focus-q35-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>作者用 <code>not of a few influentials</code> 把重点从少数特殊人物移开，再用 <code>but</code>, <code>rather</code> 指向足够多容易受影响的人，完成了关键条件的确定。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Widespread propagation requires enough people who are ready to be influenced.</p>\n<p>广泛传播需要足够多愿意受到影响的人。</p>\n</blockquote>\n<p><code>C</code> 所需的接受倾向和原文条件一致。这里不是“一个人愿意就保证传播成功”，而是关键人群达到足够规模，并共同具有接受影响的倾向。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. The inclination to rely on others.","raw":"### D. The inclination to rely on others.\n\n> 社会影响动态过程的关键要素是依赖他人的倾向。\n\n**做题模式中的状态：** 当时 inclination 被遮挡，但 rely on others 可见，已经能分清依赖别人和受到影响不是同一关系，因此第一轮排除 D。\n\n**错误类型：第一类——歪曲原意。**\n\n它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 `others` 相同就当作同义。\n\n**出处：**\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q35-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 inclination 被遮挡，但 rely on others 可见，已经能分清依赖别人和受到影响不是同一关系，因此第一轮排除 D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 <code>others</code> 相同就当作同义。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section>"},{"title":"D. The inclination to rely on others.","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 社会影响动态过程的关键要素是依赖他人的倾向。\n\n`rely on others`也提到人与人的关系，但末句具体谈的是`influenced`而不是`dependence`。\n\n`inclination` 是倾向，和后面的 `to rely on others` 合起来就是依靠他人的倾向。对应结论中的 `easily influenced people`，真正需要比较的是 `rely on` 与 `be influenced` 的关系。\n\n受到影响可以只是接受一条观念、改变一次做法，不必以依赖别人为前提；依赖也不等于在这次传播中接受了影响。原文点名的是接受性，`D` 换成依赖性，不能作为同义改写。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q35-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 inclination 被遮挡，但 rely on others 可见，已经能分清依赖别人和受到影响不是同一关系，因此第一轮排除 D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 <code>others</code> 相同就当作同义。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><code>rely on others</code>也提到人与人的关系，但末句具体谈的是<code>influenced</code>而不是<code>dependence</code>。</p>\n<p><code>inclination</code> 是倾向，和后面的 <code>to rely on others</code> 合起来就是依靠他人的倾向。对应结论中的 <code>easily influenced people</code>，真正需要比较的是 <code>rely on</code> 与 <code>be influenced</code> 的关系。</p>\n<p>受到影响可以只是接受一条观念、改变一次做法，不必以依赖别人为前提；依赖也不等于在这次传播中接受了影响。原文点名的是接受性，<code>D</code> 换成依赖性，不能作为同义改写。</p>\n</section>"},{"title":"D. The inclination to rely on others.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n>\n> 他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。\n\n研究收束在影响怎样经过网络扩散，最后点名接受性。作者没有把传播的关键解释为人们不能独立行动，或需要依靠别人。\n\n如果`D`真是作者的意思，文章至少得写成：\n\n> Widespread propagation depends on a large number of people being inclined to rely on others.\n>\n> 广泛传播取决于许多人倾向于依赖别人。\n\n`D` 需要研究明确选中依赖关系；原文只选中受影响倾向。即使某个人既容易受影响又依赖别人，也不能把两种特征作为同一研究发现。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q35-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 inclination 被遮挡，但 rely on others 可见，已经能分清依赖别人和受到影响不是同一关系，因此第一轮排除 D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 <code>others</code> 相同就当作同义。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q35-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>社会影响动态过程的关键要素是依赖他人的倾向。</p>\n</blockquote>\n<p><code>rely on others</code>也提到人与人的关系，但末句具体谈的是<code>influenced</code>而不是<code>dependence</code>。</p>\n<p><code>inclination</code> 是倾向，和后面的 <code>to rely on others</code> 合起来就是依靠他人的倾向。对应结论中的 <code>easily influenced people</code>，真正需要比较的是 <code>rely on</code> 与 <code>be influenced</code> 的关系。</p>\n<p>受到影响可以只是接受一条观念、改变一次做法，不必以依赖别人为前提；依赖也不等于在这次传播中接受了影响。原文点名的是接受性，<code>D</code> 换成依赖性，不能作为同义改写。</p>\n</section><section class=\"revealPart\" id=\"focus-q35-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>他们发现，所谓“大范围连锁传播”——影响通过网络广泛扩散——的主要条件不是存在少数影响者，而是存在数量达到临界规模、容易接受影响的人。</p>\n</blockquote>\n<p>研究收束在影响怎样经过网络扩散，最后点名接受性。作者没有把传播的关键解释为人们不能独立行动，或需要依靠别人。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Widespread propagation depends on a large number of people being inclined to rely on others.</p>\n<p>广泛传播取决于许多人倾向于依赖别人。</p>\n</blockquote>\n<p><code>D</code> 需要研究明确选中依赖关系；原文只选中受影响倾向。即使某个人既容易受影响又依赖别人，也不能把两种特征作为同一研究发现。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"35题结论","raw":"### 35题结论\n\n> **35. C. The readiness to be influenced.**\n\n- A：它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。\n- B：它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。\n- C：它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 a critical mass 所要求的人数规模。\n- D：它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 others 相同就当作同义。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"35题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"35","questionConclusion":true},"html":"<blockquote>\n<p><strong>35. C. The readiness to be influenced.</strong></p>\n</blockquote>\n<ul>\n<li>A：它借用了容易受到别人影响这一特征，改成希望自己被别人接纳的心理动机。两者在现实中可能同时存在，但并不是同一个研究条件。</li>\n<li>B：它拿研究变量中的影响他人能力作诱饵，换成主动影响的冲动，又让这个变量占据结论位置。结论明确选出的是接受影响的一端。</li>\n<li>C：它抽取关键人群的共同特征：容易接受影响。选项比较的是要素的性质，并没有取消原句 a critical mass 所要求的人数规模。</li>\n<li>D：它把容易受影响改成依赖别人。前者说观念或行为容易被改变，后者说某种行动或需要以别人为依靠，不能仅凭 others 相同就当作同义。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：传统理论及其局限**（段落1引入话题） 格拉德威尔观点：社会流行由少数特殊个体（影响者）驱动：（异常知情 + 有说服力 + 人脉广泛）// 但未解释想法如何实际传播\n\n↓（理论基础）\n\n**逻辑层次2：两步流动理论的内容与应用**（段落2理论阐述） 理论内容：信息流动路径（媒体→影响者→其他人）→ 营销应用：找到并影响影响者即可 → 表面证据：【流行现象的回溯：小群体先行→轶事证据支持特殊人群驱动趋势】\n\n//（研究挑战）\n\n**逻辑层次3：新研究的反驳发现**（段落3转折点） 最新发现：影响者对社会流行的影响远小于预期 → 极端结论：影响者可能根本不必要\n\n↓（深入分析）\n\n**逻辑层次4：影响力传播的真实机制**（段落4机制剖析） 关键观察：【名人例外（如奥普拉）：影响力来自媒体而非人际 // 非名人影响者：互动人数有限】→ 传播链条问题：（每个人必须影响熟人→熟人再影响其熟人→连锁反应）→ 关键点：后续每个人能吸引多少关注，与最初影响者关系不大 → 脆弱性：两度之隔的人若有抵抗力，级联即失败\n\n↓（研究验证）\n\n**逻辑层次5：社会影响的真正动力**（段落5研究结论） 研究方法：数千次计算机模拟（操纵影响能力和被影响倾向变量）→ 核心发现：【大范围连锁传播的要求：不是少数影响者 // 而是数量达到临界规模、容易接受影响的人】\n\n↑（全文主旨）\n\n全文核心观点：社会流行的关键不在于少数影响者的存在，而在于是否存在足够多容易被影响的人群。传统的\"影响者理论\"过度夸大了特殊个体的作用，忽视了社会网络中普通人的接受度才是决定性因素。","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：传统理论及其局限</strong>（段落1引入话题） 格拉德威尔观点：社会流行由少数特殊个体（影响者）驱动：（异常知情 + 有说服力 + 人脉广泛）// 但未解释想法如何实际传播</p>\n<p>↓（理论基础）</p>\n<p><strong>逻辑层次2：两步流动理论的内容与应用</strong>（段落2理论阐述） 理论内容：信息流动路径（媒体→影响者→其他人）→ 营销应用：找到并影响影响者即可 → 表面证据：【流行现象的回溯：小群体先行→轶事证据支持特殊人群驱动趋势】</p>\n<p>//（研究挑战）</p>\n<p><strong>逻辑层次3：新研究的反驳发现</strong>（段落3转折点） 最新发现：影响者对社会流行的影响远小于预期 → 极端结论：影响者可能根本不必要</p>\n<p>↓（深入分析）</p>\n<p><strong>逻辑层次4：影响力传播的真实机制</strong>（段落4机制剖析） 关键观察：【名人例外（如奥普拉）：影响力来自媒体而非人际 // 非名人影响者：互动人数有限】→ 传播链条问题：（每个人必须影响熟人→熟人再影响其熟人→连锁反应）→ 关键点：后续每个人能吸引多少关注，与最初影响者关系不大 → 脆弱性：两度之隔的人若有抵抗力，级联即失败</p>\n<p>↓（研究验证）</p>\n<p><strong>逻辑层次5：社会影响的真正动力</strong>（段落5研究结论） 研究方法：数千次计算机模拟（操纵影响能力和被影响倾向变量）→ 核心发现：【大范围连锁传播的要求：不是少数影响者 // 而是数量达到临界规模、容易接受影响的人】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：社会流行的关键不在于少数影响者的存在，而在于是否存在足够多容易被影响的人群。传统的&quot;影响者理论&quot;过度夸大了特殊个体的作用，忽视了社会网络中普通人的接受度才是决定性因素。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】G. Explain the appeal of a convenient marketing model\n\n> 解释一种便利营销模型为何有吸引力\n\n这一段解释两步流动理论为什么受营销者欢迎，同时把“便于使用”与“得到证实”分开。\n\n> reduce that task to finding a small group\n\n开头先摆出受众庞杂的现实，再说明模型把任务缩减为寻找少数人。营销者不必逐一接触全部消费者，这正是其便利所在。\n\n> an identifiable target and a seemingly economical route\n\n可识别的对象和看起来省力的路径共同解释吸引力。seemingly保留了作者距离，不能直接译成已经证明有效。\n\n> Its practical appeal, however, is not itself evidence\n\n转折把实践吸引力与实证依据分开。结尾不是否认营销者会使用这个模型，而是说明采用它不能自动证明其传播机制。\n\n这一部分的推进关系是：\n\n> 庞杂的营销受众 → 模型把任务缩成寻找少数人 → 有明确对象且看似省力 → 便利不能代替机制验证\n\nappeal对应明确目标与省力路径，convenient marketing model对应两步流动理论在营销中的简化作用。Explain要求概括“为何受欢迎”，同时容纳末尾对其证据基础的保留。\n\n再看最强干扰项B：Let a successful beginning stand for the whole process。\n\nB把成功的开端当作整个过程，但本段并没有展示一次已经成功的宣传，更没有赞成这种替代。它只是分析模型许诺的便利，并提醒这种许诺尚需检验。把被限制的想象写成作者主张，方向就反了。\n\n**41题选G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】G. Explain the appeal of a convenient marketing model</p>\n<blockquote>\n<p>解释一种便利营销模型为何有吸引力</p>\n</blockquote>\n<p>这一段解释两步流动理论为什么受营销者欢迎，同时把“便于使用”与“得到证实”分开。</p>\n<blockquote>\n<p>reduce that task to finding a small group</p>\n</blockquote>\n<p>开头先摆出受众庞杂的现实，再说明模型把任务缩减为寻找少数人。营销者不必逐一接触全部消费者，这正是其便利所在。</p>\n<blockquote>\n<p>an identifiable target and a seemingly economical route</p>\n</blockquote>\n<p>可识别的对象和看起来省力的路径共同解释吸引力。seemingly保留了作者距离，不能直接译成已经证明有效。</p>\n<blockquote>\n<p>Its practical appeal, however, is not itself evidence</p>\n</blockquote>\n<p>转折把实践吸引力与实证依据分开。结尾不是否认营销者会使用这个模型，而是说明采用它不能自动证明其传播机制。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>庞杂的营销受众 → 模型把任务缩成寻找少数人 → 有明确对象且看似省力 → 便利不能代替机制验证</p>\n</blockquote>\n<p>appeal对应明确目标与省力路径，convenient marketing model对应两步流动理论在营销中的简化作用。Explain要求概括“为何受欢迎”，同时容纳末尾对其证据基础的保留。</p>\n<p>再看最强干扰项B：Let a successful beginning stand for the whole process。</p>\n<p>B把成功的开端当作整个过程，但本段并没有展示一次已经成功的宣传，更没有赞成这种替代。它只是分析模型许诺的便利，并提醒这种许诺尚需检验。把被限制的想象写成作者主张，方向就反了。</p>\n<p><strong>41题选G。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】D. Do not turn an early appearance into proof of causation\n\n> 不要把较早出现当成因果证明\n\n这一段针对“最先采用某事物的人必然驱动流行”的推断，区分时间先后和因果力量。\n\n> something about the sequence of events\n\n找到早期使用者只先建立先后次序；这句话明确限定了眼前证据能够说明的范围。\n\n> leaves out early adopters whose choices went nowhere\n\n回头只看成功趋势，会遗漏那些同样先行却没引起流行的人。这使“先出现”不足以独立解释成功。\n\n> what happened after their initial involvement\n\n结尾要求观察后续传播过程。作者没有否认先行者参与其中，而是反对只靠一个谁先行动的故事完成因果解释。\n\n这一部分的推进关系是：\n\n> 发现少数人率先采用 → 只证明时间次序 → 成功回溯遗漏未成功的先行者 → 还须检验后来怎样传播\n\nearly appearance对应率先采用，proof of causation对应把先后次序提升为决定性原因。Do not turn准确概括本段的证据边界，并不等于认定早期使用者毫无作用。\n\n再看最强干扰项B：Let a successful beginning stand for the whole process。\n\nB把开端直接当成全程，恰是作者要求避免的做法。它抓住first和initial这些词，却忽略does not establish以及not merely的限制，把被批评的推断当成了标题结论。\n\n**42题选D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】D. Do not turn an early appearance into proof of causation</p>\n<blockquote>\n<p>不要把较早出现当成因果证明</p>\n</blockquote>\n<p>这一段针对“最先采用某事物的人必然驱动流行”的推断，区分时间先后和因果力量。</p>\n<blockquote>\n<p>something about the sequence of events</p>\n</blockquote>\n<p>找到早期使用者只先建立先后次序；这句话明确限定了眼前证据能够说明的范围。</p>\n<blockquote>\n<p>leaves out early adopters whose choices went nowhere</p>\n</blockquote>\n<p>回头只看成功趋势，会遗漏那些同样先行却没引起流行的人。这使“先出现”不足以独立解释成功。</p>\n<blockquote>\n<p>what happened after their initial involvement</p>\n</blockquote>\n<p>结尾要求观察后续传播过程。作者没有否认先行者参与其中，而是反对只靠一个谁先行动的故事完成因果解释。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>发现少数人率先采用 → 只证明时间次序 → 成功回溯遗漏未成功的先行者 → 还须检验后来怎样传播</p>\n</blockquote>\n<p>early appearance对应率先采用，proof of causation对应把先后次序提升为决定性原因。Do not turn准确概括本段的证据边界，并不等于认定早期使用者毫无作用。</p>\n<p>再看最强干扰项B：Let a successful beginning stand for the whole process。</p>\n<p>B把开端直接当成全程，恰是作者要求避免的做法。它抓住first和initial这些词，却忽略does not establish以及not merely的限制，把被批评的推断当成了标题结论。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. Distinguish public visibility from personal contact\n\n> 区分公众曝光与个人接触\n\n这一段比较名人的媒体触达和普通影响者的人际接触，说明不能把两种传播能力混为一谈。\n\n> without personally speaking to most of its members\n\n名人能覆盖大批观众，并不意味着他逐一与这些人接触。观众规模首先由媒体渠道解释。\n\n> through direct interaction\n\n普通社区里的有影响力者通常依赖直接互动。即使其熟人圈很大，也仍有边界，与广播式触达不是同一种条件。\n\n> a broadcast message or ... a chain of personal contacts\n\n结尾明确指出真正的区分标准：接收广播信息，还是沿个人联系传播。这里比较的是传播机制，而非谁更优秀。\n\n这一部分的推进关系是：\n\n> 名人借媒体触达大众 → 普通影响者依赖有限的直接交往 → 混同会夸大个人作用 → 按传播渠道区分两种触达\n\npublic visibility对应电视等媒体带来的公众曝光，personal contact对应普通人的直接交往。Distinguish与结尾的区分标准一致，覆盖两个对象及其关系。\n\n再看最强干扰项E：Replace every influential with a celebrity。\n\nE把机制辨析改成营销建议：用名人替换所有影响者。原文没有比较替换后的成本或效果，也没有提出替换方案；媒体与人际不同，不能推出人人都应改用名人。\n\n**43题选A。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. Distinguish public visibility from personal contact</p>\n<blockquote>\n<p>区分公众曝光与个人接触</p>\n</blockquote>\n<p>这一段比较名人的媒体触达和普通影响者的人际接触，说明不能把两种传播能力混为一谈。</p>\n<blockquote>\n<p>without personally speaking to most of its members</p>\n</blockquote>\n<p>名人能覆盖大批观众，并不意味着他逐一与这些人接触。观众规模首先由媒体渠道解释。</p>\n<blockquote>\n<p>through direct interaction</p>\n</blockquote>\n<p>普通社区里的有影响力者通常依赖直接互动。即使其熟人圈很大，也仍有边界，与广播式触达不是同一种条件。</p>\n<blockquote>\n<p>a broadcast message or ... a chain of personal contacts</p>\n</blockquote>\n<p>结尾明确指出真正的区分标准：接收广播信息，还是沿个人联系传播。这里比较的是传播机制，而非谁更优秀。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>名人借媒体触达大众 → 普通影响者依赖有限的直接交往 → 混同会夸大个人作用 → 按传播渠道区分两种触达</p>\n</blockquote>\n<p>public visibility对应电视等媒体带来的公众曝光，personal contact对应普通人的直接交往。Distinguish与结尾的区分标准一致，覆盖两个对象及其关系。</p>\n<p>再看最强干扰项E：Replace every influential with a celebrity。</p>\n<p>E把机制辨析改成营销建议：用名人替换所有影响者。原文没有比较替换后的成本或效果，也没有提出替换方案；媒体与人际不同，不能推出人人都应改用名人。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Test what happens beyond the first circle\n\n> 检验第一圈人之外会发生什么\n\n这一段沿传播链向后追踪，解释第一轮说服成功为什么还不能证明会出现广泛扩散。\n\n> further steps that the original person does not control\n\n最初影响者能启动第一轮，却不能控制后面每次传递。段落由一个人的表现转向连续多个环节。\n\n> If the next circle resists, the chain can stop\n\n下一圈人的抵制就能截断链条。这是条件性的反例，说明开端强并不能保障后续继续。\n\n> follow the message into later circles\n\n结尾据此提出检验方式：追踪信息进入后续圈层，而不只清点第一轮受影响的人数。\n\n这一部分的推进关系是：\n\n> 影响者说服熟人 → 熟人还须继续传播 → 后续圈层可能抵制 → 判断扩散必须检查第一圈之外\n\nfirst circle对应最初被说服的熟人，beyond对应他们后来接触的人及更多圈层。Test概括结尾提出的检验要求，能够同时覆盖传播条件和中断可能。\n\n再看最强干扰项B：Let a successful beginning stand for the whole process。\n\nB几乎就是本段反对的评价方式。即便开端成功，也要区分early success与extensive diffusion；用前者代表后者会删掉本段反复强调的后续条件。\n\n**44题选F。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Test what happens beyond the first circle</p>\n<blockquote>\n<p>检验第一圈人之外会发生什么</p>\n</blockquote>\n<p>这一段沿传播链向后追踪，解释第一轮说服成功为什么还不能证明会出现广泛扩散。</p>\n<blockquote>\n<p>further steps that the original person does not control</p>\n</blockquote>\n<p>最初影响者能启动第一轮，却不能控制后面每次传递。段落由一个人的表现转向连续多个环节。</p>\n<blockquote>\n<p>If the next circle resists, the chain can stop</p>\n</blockquote>\n<p>下一圈人的抵制就能截断链条。这是条件性的反例，说明开端强并不能保障后续继续。</p>\n<blockquote>\n<p>follow the message into later circles</p>\n</blockquote>\n<p>结尾据此提出检验方式：追踪信息进入后续圈层，而不只清点第一轮受影响的人数。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>影响者说服熟人 → 熟人还须继续传播 → 后续圈层可能抵制 → 判断扩散必须检查第一圈之外</p>\n</blockquote>\n<p>first circle对应最初被说服的熟人，beyond对应他们后来接触的人及更多圈层。Test概括结尾提出的检验要求，能够同时覆盖传播条件和中断可能。</p>\n<p>再看最强干扰项B：Let a successful beginning stand for the whole process。</p>\n<p>B几乎就是本段反对的评价方式。即便开端成功，也要区分early success与extensive diffusion；用前者代表后者会删掉本段反复强调的后续条件。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】C. Look for receptive people throughout the network\n\n> 在整个网络中寻找愿意接受影响的人\n\n这一段根据模拟研究调整关注重点：解释大范围传播，需要看网络中是否有足够多愿意接受影响的人。\n\n> both the ability to influence others and the willingness to be influenced\n\n模拟把影响别人的能力和接受影响的倾向都纳入，说明研究并未只研究少数能人。\n\n> a sufficiently large body of receptive people\n\n发现把关键条件转向接受者群体的规模。这里要求达到足够数量，不是挑出另一个特别有能力的人。\n\n> the distribution of receptiveness across a network\n\n结尾将研究含义落实到整个网络：接受度在哪里分布，影响才可能在哪里继续。前面的does not mean还排除了必然成功的夸张理解。\n\n这一部分的推进关系是：\n\n> 同时调整影响能力与接受倾向 → 发现足够多接受者的重要性 → 不保证每人都传播或每次都成功 → 把观察范围扩展到整个网络\n\nreceptive people对应易于接受影响的人，throughout the network对应接受度的网络分布。Look for表示把研究和观察重点转过去，没有额外许诺一定发生级联。\n\n再看最强干扰项E：Replace every influential with a celebrity。\n\nE仍把解决办法放在更换少数发起者，甚至要求全部换成名人。本段恰恰强调发起者独自造不出的群体条件，替换名人不能回答周围的人是否愿意继续传递。\n\n**45题选C。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】C. Look for receptive people throughout the network</p>\n<blockquote>\n<p>在整个网络中寻找愿意接受影响的人</p>\n</blockquote>\n<p>这一段根据模拟研究调整关注重点：解释大范围传播，需要看网络中是否有足够多愿意接受影响的人。</p>\n<blockquote>\n<p>both the ability to influence others and the willingness to be influenced</p>\n</blockquote>\n<p>模拟把影响别人的能力和接受影响的倾向都纳入，说明研究并未只研究少数能人。</p>\n<blockquote>\n<p>a sufficiently large body of receptive people</p>\n</blockquote>\n<p>发现把关键条件转向接受者群体的规模。这里要求达到足够数量，不是挑出另一个特别有能力的人。</p>\n<blockquote>\n<p>the distribution of receptiveness across a network</p>\n</blockquote>\n<p>结尾将研究含义落实到整个网络：接受度在哪里分布，影响才可能在哪里继续。前面的does not mean还排除了必然成功的夸张理解。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>同时调整影响能力与接受倾向 → 发现足够多接受者的重要性 → 不保证每人都传播或每次都成功 → 把观察范围扩展到整个网络</p>\n</blockquote>\n<p>receptive people对应易于接受影响的人，throughout the network对应接受度的网络分布。Look for表示把研究和观察重点转过去，没有额外许诺一定发生级联。</p>\n<p>再看最强干扰项E：Replace every influential with a celebrity。</p>\n<p>E仍把解决办法放在更换少数发起者，甚至要求全部换成名人。本段恰恰强调发起者独自造不出的群体条件，替换名人不能回答周围的人是否愿意继续传递。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从寻找带动流行的人，引出两步流动理论 |\n| B | 限制先行证据的因果含义，转向影响者实际接触范围 |\n| C | 说明后续接受度是发起者不能独自提供的条件 |\n| D | 展开两步流动理论，并解释营销吸引力与表面证据 |\n| E | 由直接接触有限推出逐级传播，把注意力转向后来接收者 |\n| F | 用模拟研究回答接受度问题，改变研究关注对象 |\n| G | 说明关注对象改变后，对实际传播判断有什么启发 |\n| H | 收束起点与全程的关系，强调网络持续展开的过程 |\n\n全文推进：\n\n> 从寻找带动流行的人，引出两步流动理论 → 展开两步流动理论，并解释营销吸引力与表面证据 → 限制先行证据的因果含义，转向影响者实际接触范围 → 由直接接触有限推出逐级传播，把注意力转向后来接收者 → 说明后续接受度是发起者不能独自提供的条件 → 用模拟研究回答接受度问题，改变
