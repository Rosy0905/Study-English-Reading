<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| argue | v.主张；论证 | social epidemics | n.社会流行现象 | be driven by | 由……推动 |\n| in large part | 在很大程度上 | actions | n.行动 | a tiny minority | 极少数 |\n| special individuals | 特殊个体 | influentials | n.有影响力的人 | unusually | adv.不同寻常地 |\n| informed | adj.见多识广的 | persuasive | adj.有说服力的 | well connected | 人脉广的 |\n| idea | n.想法；观点 | intuitively | adv.凭直觉地 | compelling | adj.令人信服的 |\n| explain | v.解释 | actually | adv.实际上 | spread | v.传播 |","section":"第一鸟 · 词汇","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[80,130,920,515],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>argue</td>\n<td>v.主张；论证</td>\n<td>social epidemics</td>\n<td>n.社会流行现象</td>\n<td>be driven by</td>\n<td>由……推动</td>\n</tr>\n<tr>\n<td>in large part</td>\n<td>在很大程度上</td>\n<td>actions</td>\n<td>n.行动</td>\n<td>a tiny minority</td>\n<td>极少数</td>\n</tr>\n<tr>\n<td>special individuals</td>\n<td>特殊个体</td>\n<td>influentials</td>\n<td>n.有影响力的人</td>\n<td>unusually</td>\n<td>adv.不同寻常地</td>\n</tr>\n<tr>\n<td>informed</td>\n<td>adj.见多识广的</td>\n<td>persuasive</td>\n<td>adj.有说服力的</td>\n<td>well connected</td>\n<td>人脉广的</td>\n</tr>\n<tr>\n<td>idea</td>\n<td>n.想法；观点</td>\n<td>intuitively</td>\n<td>adv.凭直觉地</td>\n<td>compelling</td>\n<td>adj.令人信服的</td>\n</tr>\n<tr>\n<td>explain</td>\n<td>v.解释</td>\n<td>actually</td>\n<td>adv.实际上</td>\n<td>spread</td>\n<td>v.传播</td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| supposed | adj.被认为的 | importance | n.重要性 | derive from | 源于 |\n| plausible-sounding | adj.听起来合理的 | largely untested | 基本未经检验的 | theory | n </section>"},{"title":"第2段","raw":"### 完整原文 · 第2段\n\nThe supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from the media to the influentials and from them to everyone else. Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods. In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,650,920,1130],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else. Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods. In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. Anecdotal evidence rsory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>The supposed importance of influentials / derives from / a plausible-sounding but largely untested theory / called the &quot;two-step flow of communication&quot;: / Information flows / from the media / to the influentials / and from them / to everyone else.</p>\n<p>Marketers have embraced / the two-step flow / because it suggests / that if they can just find / and influence the influentials, / those select people / will do most of the work / for them.</p>\n<p>The theory also seems to explain / the sudden and unexpected popularity / of certain looks, / brands, / or neighborhoods.</p>\n<p>In many such cases, / a cursory search for causes / finds that / some small group of people / was wearing, / promoting, / or developing / whatever it is / before anyone else paid attention.</p>\n<p>Anecdotal evidence of this kind / fits nicely / with the idea / that only certain special people / can drive trends.</p>\n</section>"},{"title":"第2段","raw":"### 意群翻译 · 第2段\n\n影响者的假定重要性 / 源自于 / 一个听起来合理但基本未经检验的理论 / 被称为\"传播的两步流动\"：/ 信息流动 / 从媒体 / 到影响者 / 再从他们 / 到其他所有人。\n\n营销人员已经接受了 / 两步流动理论 / 因为它暗示 / 如果他们能够找到 / 并影响影响者，/ 那些精选的人 / 将完成大部分工作 / 为他们。\n\n该理论似乎也解释了 / 突然和意外的流行 / 某些外观的，/ 品牌，/ 或社区。\n\n在许多这样的情况下，/ 对原因的粗略搜索 / 发现 / 一些小群体 / 正在穿着，/ 推广，/ 或开发 / 无论是什么 / 在其他任何人注意之前。\n\n这种轶事证据 / 很好地符合 / 这个想法 / 只有某些特殊的人 / 能够驱动趋势。","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,650,920,1130],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else. Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods. In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>The supposed importance of influentials / derives from / a plausible-sounding but largely untested theory / called the &quot;two-step flow of communication&quot;: / Information flows / from the media / to the influentials / and from them / to everyone else.</p>\n<p>Marketers have embraced / the two-step flow / because it suggests / that if they can just find / and influence the influentials, / those select people / will do most of the work / for them.</p>\n<p>The theory also seems to explain / the sudden and unexpected popularity / of certain looks, / brands, / or neighborhoods.</p>\n<p>In many such cases, / a cursory search for causes / finds that / some small group of people / was wearing, / promoting, / or developing / whatever it is / before anyone else paid attention.</p>\n<p>Anecdotal evidence of this kind / fits nicely / with the idea / that only certain special people / can drive trends.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>影响者的假定重要性 / 源自于 / 一个听起来合理但基本未经检验的理论 / 被称为&quot;传播的两步流动&quot;：/ 信息流动 / 从媒体 / 到影响者 / 再从他们 / 到其他所有人。</p>\n<p>营销人员已经接受了 / 两步流动理论 / 因为它暗示 / 如果他们能够找到 / 并影响影响者，/ 那些精选的人 / 将完成大部分工作 / 为他们。</p>\n<p>该理论似乎也解释了 / 突然和意外的流行 / 某些外观的，/ 品牌，/ 或社区。</p>\n<p>在许多这样的情况下，/ 对原因的粗略搜索 / 发现 / 一些小群体 / 正在穿着，/ 推广，/ 或开发 / 无论是什么 / 在其他任何人注意之前。</p>\n<p>这种轶事证据 / 很好地符合 / 这个想法 / 只有某些特殊的人 / 能够驱动趋势。</p>\n</section>"},{"title":"第2段","raw":"### 标准译文 · 第2段\n\n影响者的假定重要性源于一个听起来合理但基本未经检验的理论，即\"传播的两步流动\"：信息从媒体流向影响者，再从他们流向其他所有人。营销人员接受了两步流动理论，因为它暗示如果他们能够找到并影响影响者，这些精选的人将为他们完成大部分工作。该理论似乎也解释了某些外观、品牌或社区突然和意外的流行。在许多这样的情况下，对原因的粗略搜索发现，在其他任何人注意之前，一些小群体正在穿着、推广或开发这些东西。这种轶事证据很好地符合只有某些特殊的人能够驱动趋势的想法。","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[80,650,920,1130],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true},"focusId":"focus-paragraph-2-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else. Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods. In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>The supposed importance of influentials / 传播很远或影响很多人。</p>\n</section>"},{"title":"第5段","raw":"### 完整原文 · 第5段\n\nBuilding on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people's ability to influence others and their tendency to be influenced. They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[80,3452,920,665],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people&#39;s ability to influence others and their tendency to be influenced. They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</section>"},{"title":"第5段","raw":"### 意群划分 · 第5段\n\nBuilding on / this basic truth / about interpersonal influence, / the researchers studied / the dynamics of social influence / by conducting / thousands of computer simulations / of populations, / manipulating / a number of variables / relating to / people's ability to influence others / and their tendency / to be influenced.\n\nThey found / that th ather, of a critical mass：(of easily influenced people))).</p>\n"},{"title":"中文版句子逻辑（选修)","raw":"## 中文版句子逻辑（选修)\n\n**第1段**\n\n在他的书《引爆点》中 → 马尔科姆·格拉德威尔论证：(\"社会流行\" → 在很大程度上被驱动 → 通过行动：(一小部分的：(特殊个体：(通常被称为影响者：(他们异常知情 + 有说服力 + 或人脉广泛)))))。\n\n这个想法直觉上很有吸引力 // 但它没有解释：(想法实际上如何传播)。\n\n**第2段**\n\n影响者的假定重要性 → 源自于 → 一个听起来合理但基本未经检验的理论：(被称为\"传播的两步流动\")：信息流动：(从媒体 → 到影响者) + (从他们 → 到其他所有人)。\n\n营销人员已经接受了 → 两步流动理论 → 因为它暗示：(如果他们能够找到 + 影响影响者 → 那些精选的人 → 将完成大部分工作：(为他们))。\n\n该理论似乎也解释了 → 突然和意外的流行：(某些外观的 + 品牌 + 或社区)。\n\n在许多这样的情况下 → 对原因的粗略搜索 → 发现：(一些小群体 → 正在穿着 + 推广 + 或开发 → 无论是什么：(在其他任何人注意之前))。\n\n这种轶事证据 → 很好地符合：(这个想法：(只有某些特殊的人 → 能够驱动趋势))。\n\n**第3段**\n\n在他们最近的工作中，然而 // 一些研究人员 → 已经得出发现：(影响者 → 有远更少的影响：(对社会流行)：(比通常认为的))。\n\n事实上 → 他们似乎不被需要 → 根本。\n\n**第4段**\n\n研究人员的论点 → 源于 → 一个简单的观察：(关于社会影响)：除了：(少数名人：(像奥普拉·温弗瑞))：(她的巨大存在 → 主要是一个功能：(媒体的，而非人际的，影响)) → 即使是最有影响力的成员：(人群中的) → 简单地不互动：(与那么多其他人)。\n\n然而恰恰是 → 这些非名人影响者：(他们：(根据两步流动理论) → 应该驱动 → 社会流行：(通过影响 → 他们的朋友和同事 → 直接地))。\n\n为了社会流行发生，然而 → 每个如此受影响的人 → 必须然后影响 → 他或她自己的熟人：(他们必须反过来 → 影响他们的) + 等等；+ 到底有多少其他人 → 注意 → 这些人中的每一个 → 与...关系不大 → 最初的影响者。\n\n如果网络中的人：(仅仅相隔两度：(从最初的影响者)) → 证明有抵抗力 → 例如 → 变化的级联 → 不会传播很远 + 或影响很多人。\n\n**第5段**\n\n基于 → 这个基本事实：(关于人际影响) → 研究人员研究了 → 社会影响的动态：(通过进行 → 数千次计算机模拟：(人群的))：(操纵 → 许多变量：(涉及 → 人们影响他人的能力 + 他们的倾向 → 被影响))。\n\n他们发现：(主要要求：(对于被称为 → \"全球级联\"的)：(广泛传播：(影响的：(通过网络))) → 是存在：(不是少数影响者 // 而是，相反，临界质量：(容易被影响的人)))。","section":"第二鸟 · 精读与翻译","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>在他的书《引爆点》中 → 马尔科姆·格拉德威尔论证：(&quot;社会流行&quot; → 在很大程度上被驱动 → 通过行动：(一小部分的：(特殊个体：(通常被称为影响者：(他们异常知情 + 有说服力 + 或人脉广泛)))))。</p>\n<p>这个想法直觉上很有吸引力 // 但它没有解释：(想法实际上如何传播)。</p>\n<p><strong>第2段</strong></p>\n<p>影响者的假定重要性 → 源自于 → 一个听起来合理但基本未经检验的理论：(被称为&quot;传播的两步流动&quot;)：信息流动：(从媒体 → 到影响者) + (从他们 → 到其他所有人)。</p>\n<p>营销人员已经接受了 → 两步流动理论 → 因为它暗示：(如果他们能够找到 + 影响影响者 → 那些精选的人 → 将完成大部分工作：(为他们))。</p>\n<p>该理论似乎也解释了 → 突然和意外的流行：(某些外观的 + 品牌 + 或社区)。</p>\n<p>在许多这样的情况下 → 对原因的粗略搜索 ote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>In his book The Tipping Point, / Malcolm Gladwell argues / that &quot;social epidemics&quot; / are driven in large part / by the actions / of a tiny minority / of special individuals, / often called influentials, / who are unusually informed, / persuasive, / or well connected.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在他的书《引爆点》中，/ 马尔科姆·格拉德威尔论证 / &quot;社会流行&quot; / 在很大程度上被驱动 / 通过行动 / 一小部分的 / 特殊个体，/ 通常被称为影响者，/ 他们异常知情，/ 有说服力，/ 或人脉广泛。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把“在他的书中”与书名放到一起，确定说话的出处：</p>\n<blockquote>\n<p>在其著作《引爆点》中</p>\n</blockquote>\n<p>把层层补充的个体说明接到同一个对象上：</p>\n<blockquote>\n<p>一小部分特殊个体的行动；这些人通常被称为影响者</p>\n</blockquote>\n<p>最后把三项并列特点合并：</p>\n<blockquote>\n<p>异常知情、有说服力或人脉广泛</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>格拉德威尔在《引爆点》中提出一个判断\n社会流行在很大程度上由一小部分特殊个体的行动驱动\n接着补充这些人的称呼和三项特点</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>格拉德威尔认为，社会流行由少数特殊个体的行动驱动。</p>\n</blockquote>\n<p>把书名放在“认为”之前；“在很大程度上”放在“由……驱动”之前保留程度；个体的称呼与特点接在主判断之后，避免连续堆在“行动”前。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>格拉德威尔在《引爆点》中认为，社会流行在很大程度上被一小部分特殊个体的行动驱动；这些个体通常被叫作影响者，他们异常知情、有说服力或人脉广泛。</p>\n</blockquote>\n</section>"},{"title":"1. 第1段第1句","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n将“被……行动驱动”整理为“由……的行动所驱动”，表达关系更顺；把“这些个体”接为“这些人”，承接前面的对象；三项特点保持并列，保留“或”，不把原文变成每个人都必须具备三项。\n\n参考译文：\n\n> 马尔科姆·格拉德威尔在其著作《引爆点》中认为，\"社会流行\"在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们异常知情、有说服力或人脉广泛。","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第1段第1句","focus":[80,135,920,270],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":true},"focusId":"focus-long-1-5","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>In his book The Tipping Point, / Malcolm Gladwell argues / that &quot;social epidemics&quot; / are driven in large part / by the actions / of a tiny minority / of special individuals, / often called influentials, / who are unusually informed, / persuasive, / or well connected.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在他的书《引爆点》中，/ 马尔科姆·格拉德威尔论证 / &quot;社会流行&quot; / 在很大程度上被驱动 / 通过行动 / 一小部分的 / 特殊个体，/ 通常被称为影响者，/ 他们异常知情，/ 有说服力，/ 或人脉广泛。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把“在他的书中”与书名放到一起，确定说话的出处：</p>\n<blockquote>\n<p>在其著作《引爆点》中</p>\n</blockquote>\n<p>把层层补充的个体说明接到同一个对象上：</p>\n<blockquote>\n<p>一小部分特殊个体的行动；这些人通常被称为影响者</p>\n</blockquote>\n<p>最后把三项并列特点合并：</p>\n<blockquote>\n<p>异常知情、有说服力或人脉广泛</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>格拉德威尔在《引爆点》中提出一个判断\n社会流行在很大程度上由一小部分特殊个体的行动驱动\n接着补充这些人的称呼和三项特点</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>格拉德威尔认为，社会流行由少数特殊个体的行动驱动。</p>\n</blockquote>\n<p>把书名放在“认为”之前；“在很大程度上”放在“由……驱动”之前保留程度；个体的称呼与特点接在主判断之后，避免连续堆在“行动”前。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>格拉德威尔在《引爆点》中认为，社会流行在很大程度上被一小部分特殊个体的行动驱动；这些个体通常被叫作影响者，他们异常知情、有说服力或人脉广泛。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-5\"><h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>将“被……行动驱动”整理为“由……的行动所驱动”，表达关系更顺；把“这些个体”接为“这些人”，承接前面的对象；三项特点保持并列，保留“或”，不把原文变成每个人都必须具备三项。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们异常知情、有说服力或人脉广泛。</p>\n</blockquote>\n</section>"},{"title":"2. 第4段第3句","raw":"### 原文\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段第3句","focus":[80,2518,920,245],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-2","cumulativeFinal":false},"focusId":"focus-long-2-0","html":"<section class=\"revealPart\" id=\"focus-long-2-0\"><h3>原文</h3>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section>"},{"title":"2. 第4段第3句","raw":"### 第一步：划分意群\n\n> For a social epidemic to occur, / however, / each person so affected / must then influence / his or her own acquaintances, / who must in turn / influence theirs, / and so on; / and just how many others / pay attention to / each of these people / has little to do with / the initial influential.","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段第3句","focus":[80,2518,920,245],"  initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>为了社会流行发生，/ 然而，/ 每个如此受影响的人 / 必须然后影响 / 他或她自己的熟人，/ 他们必须反过来 / 影响他们的，/ 等等；/ 到底有多少其他人 / 注意 / 这些人中的每一个 / 与...关系不大 / 最初的影响者。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把目的放到前面，并把“如此受影响的人”作为完整对象：</p>\n<blockquote>\n<p>为了让社会流行发生，每个受影响的人</p>\n</blockquote>\n<p>把连续的影响动作接成接力过程：</p>\n<blockquote>\n<p>先影响自己的熟人，这些熟人又影响他们的熟人，以此类推</p>\n</blockquote>\n<p>后半句把“有多少其他人关注每一个人”整体保留，不拆成“这些人与起点没关系”：</p>\n<blockquote>\n<p>每个接力者吸引多少其他人关注，与最初的影响者关系不大</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>社会流行要发生，需要受影响的人继续向熟人传递\n这种传递逐层继续\n后续每个人吸引的关注人数，与起点人物关系不大</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>每个受影响的人必须继续影响熟人；后续关注人数与最初影响者关系不大。</p>\n</blockquote>\n<p>前半句先放目的，再安排逐层重复的动作；后半句将“有多少其他人关注这些人中的每一个”整个放在“关系不大”前。两部分用分号分开，保留“接力传播”和“后续人数”的区别。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>然而，要让社会流行发生，每个受到影响的人必须再影响自己的熟人，熟人再影响他们的熟人，以此类推；有多少其他人关注每一个这样的人，与最初影响者没有多大关系。</p>\n</blockquote>\n</section>"},{"title":"2. 第4段第3句","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n用“为了让……发生”把目的表达完整；将连续重复的“熟人”适当换成“这些人”承接，仍保留下一层熟人；将“没有多大关系”整理为“关系不大”，不能改成“完全无关”。\n\n参考译文：\n\n> 然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段第3句","focus":[80,2518,920,245],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-2","cumulativeFinal":true},"focusId":"focus-long-2-5","html":"<section class=\"revealPart\" id=\"focus-long-2-0\"><h3>原文</h3>\n<blockquote>\n<p>For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>For a social epidemic to occur, / however, / each person so affected / must then influence / his or her own acquaintances, / who must in turn / influence theirs, / and so on; / and just how many others / pay attention to / each of these people / has little to do with / the initial influential.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>为了社会流行发生，/ 然而，/ 每个如此受影响的人 / 必须然后影响 / 他或她自己的熟人，/ 他们必须反过来 / 影响他们的，/ 等等；/ 到底有多少其他人 / 注意 / 这些人中的每一个 / 与...关系不大 / 最初的影响者。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把目的放到前面，并把“如此受影响的人”作为完整对象：</p>\n<blockquote>\n<p>为了让社会流行发生，每个受影响的人</p>\n</blockquote>\n<p>把连续的影响动作接成接力过程：</p>\n<blockquote>\n<p>先影响自己的熟人，这些熟人又影响他们的熟人，以此类推</p>\n</blockquote>\n<p>后半句把“有多少其他人关注每一个人”整体保留，不拆成“这些人与起点没关系”：</p>\n<blockquote>\n<p>每个接力者吸引多少其他人关注，与最初的影响者关系不大</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>社会流行要发生，需要受影响的人继续向熟人传递\n这种传递逐层继续\n后续每个人吸引的关注人数，与起点人物关系不大</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>每个受影响的人必须继续影响熟人；后续关注人数与最初影响者关系不大。</p>\n</blockquote>\n<p>前半句先放目的，再安排逐层重复的动作；后半句将“有多少其他人关注这些人中的每一个”整个放在“关系不大”前。两部分用分号分开，保留“接力传播”和“后续人数”的区别。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>然而，要让社会流行发生，每个受到影响的人必须再影响自己的熟人，熟人再影响他们的熟人，以此类推；有多少其他人关注每一个这样的人，与最初影响者没有多大关系。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-5\"><h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>用“为了让……发生”把目的表达完整；将连续重复的“熟人”适当换成“这些人”承接，仍保留下一层熟人；将“没有多大关系”整理为“关系不大”，不能改成“完全无关”。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>然而，为了让社会流行发生，每个受影响的人必须接着影响他或她自己的熟人，这些人又必须影响他们的熟人，以此类推；而有多少其他人关注这些人中的每一个，与最初的影响者关系不大。</p>\n</blockquote>\n</section>"},{"title":"3. 第5段第2句","raw":"### 原文\n\n> They found that the principal requirement for what is called \"global cascades\" – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第5段第2句","focus":[80,3650,920,260],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false},"focusId":"focus-long-3-0","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section>"},{"title":"3. 第5段第2句","raw":"### 第一步：划分意群\n\n> They found / that the principal requirement / for what is called / \"global cascades\" – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第5段第2句","focus":[80,3650,920,260],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false},"focusId":"focus-long-3-1","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>They found / that the principal requirement / for what is called / &quot;global cascades&quot; – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.</p>\n</blockquote>\n</section>"},{"title":"3. 第5段第2句","raw":"### 第二步：逐个意群直译\n\n> 他们发现 / 主要要求 / 对于被称为 / \"全球级联\"的 – / 广泛传播 / 影响的 / 通过网络 – / 是存在 / 不是少数影响者 / 而是，相反，/ 临界质量 / 容易被影响的人。","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第5段第2句","focus":[80,3650,920,260],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false},"focusId":"focus-long-3-2","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>They found / that the principal requirement / for what is called / &quot;global cascades&quot; – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们发现 / 主要要求 / 对于被称为 / &quot;全球级联&quot;的 – / 广泛传播 / 影响的 / 通过网络 – / 是存在 / 不是少数影响者 / 而是，相反，/ 临界质量 / 容易被影响的人。</p>\n</blockquote>\n</section>"},{"title":"3. 第5段第2句","raw":"### 第三步：按照中文语感合并意群\n\n先把名称与解释合在一起：\n\n> 所谓“全球级联”，也就是影响通过网络的广泛传播\n\n再把“主要要求”和后面的存在条件相接：\n\n> 关键条件不是有少数影响者，而是有达到关键规模的易受影响者\n\n先得到： 翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第5段第2句","focus":[80,3650,920,260],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false},"focusId":"focus-long-3-4","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>They found / that the principal requirement / for what is called / &quot;global cascades&quot; – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们发现 / 主要要求 / 对于被称为 / &quot;全球级联&quot;的 – / 广泛传播 / 影响的 / 通过网络 – / 是存在 / 不是少数影响者 / 而是，相反，/ 临界质量 / 容易被影响的人。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把名称与解释合在一起：</p>\n<blockquote>\n<p>所谓“全球级联”，也就是影响通过网络的广泛传播</p>\n</blockquote>\n<p>再把“主要要求”和后面的存在条件相接：</p>\n<blockquote>\n<p>关键条件不是有少数影响者，而是有达到关键规模的易受影响者</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>研究人员发现了广泛传播的主要条件\n不是少数影响者的存在\n而是有足够规模的容易受影响的人</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>他们发现，主要条件不是少数影响者，而是达到关键规模的易受影响者。</p>\n</blockquote>\n<p>“他们发现”放在最前面；“全球级联”与解释一起作“主要要求”的范围；最后保留“不是……而是……”的对照，把人数规模留在后一个条件里。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他们发现，所谓全球级联，也就是影响通过网络广泛传播，其主要要求不是存在几个影响者，而是存在达到临界规模的、容易受影响的人。</p>\n</blockquote>\n</section>"},{"title":"3. 第5段第2句","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n名称后用破折号容纳解释，避免主判断被“也就是”拖得太长；把“不是存在几个”整理为“不是少数……的存在”，与后项对照。材料中的“临界质量”指达到关键规模的人群数量，不是对人的品质作评价。\n\n参考译文：\n\n> 他们发现，所谓\"全球级联\"——影响通过网络的广泛传播——的主要要求不是少数影响者的存在，而是存在临界质量的容易被影响的人。","section":"第二鸟 · 精读与翻译","level":4,"context":{"mode":"image","asset":"articleAnnotated","label":"第5段第2句","focus":[80,3650,920,260],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":true},"focusId":"focus-long-3-5","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>They found that the principal requirement for what is called &quot;global cascades&quot; – the widespread propagation of influence through networks – is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>They found / that the principal requirement / for what is called / &quot;global cascades&quot; – / the widespread propagation / of influence / through networks – / is the presence / not of a few influentials / but, rather, / of a critical mass / of easily influenced people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们发现 / 主要要求 / 对于被称为 / &quot;全球级联&quot;的 – / 广泛传播 / 影响的 / 通过网络 – / 是存在 / 不是少数影响者 / 而是，相反，/ 临界质量 / 容易被影响的人。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把名称与解释合在一起：</p>\n<blockquote>\n<p>所谓“全球级联”，也就是影响通过网络的广泛传播</p>\n</blockquote>\n<p>再把“主要要求”和后面的存在条件相接：</p>\n<blockquote>\n<p>关键条件不是有少数影响者，而是有达到关键规模的易受影响者</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>研究人员发现了广泛传播的主要条件\n不是少数影响者的存在\n而是有足够规模的容易受影响的人</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>他们发现，主要条件不是少数影响者，而是达到关键规模的易受影响者。</p>\n</blockquote>\n<p>“他们发现”放在最前面；“全球级联”与解释一起作“主要要求”的范围；最后保留“不是……而是……”的对照，把人数规模留在后一个条件里。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他们发现，所谓全球级联，也就是影响通过网络广泛传播，其主要要求不是存在几个影响者，而是存在达到临界规模的、容易受影响的人。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>名称后用破折号容纳解释，避免主判断被“也就是”拖得太长；把“不是存在几个”整理为“不是少数……的存在”，与后项对照。材料中的“临界质量”指达到关键规模的人群数量，不是对人的品质作评价。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>他们发现，所谓&quot;全球级联&quot;——影响通过网络的广泛传播——的主要要求不是少数影响者的存在，而是存在临界质量的容易被影响的人。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","level":1,"context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":2256,"sourceH":3142},"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"31题 · 题干、题型与核心出处","raw":"## 31题\n\n> By citing the book The Tipping Point, the author intends to ______.\n>\n> 作者引用《引爆点》，意在做什么？\n\n### 题型\n\n例子作用题。书名锁定第一段，题干问引用的目的，需要把书中观点、作者紧接着的回应和后文的展开连起来。\n\n### 核心出处\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n\n第一句提出“少数特殊人物推动社会流行”的解释；第二句的 but 把关注点转到这种解释能否说明观念传播；第三段再用研究结果检验特殊人物的作用。人物的特点是讨论对象的介绍，讨论他们在传播中的作用才是引用的用途。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"31","questionIntro":true},"html":"<blockquote>\n<p>By citing the book The Tipping Point, the author intends to ______.</p>\n<p>作者引用《引爆点》，意在做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例子作用题。书名锁定第一段，题干问引用的目的，需要把书中观点、作者紧接着的回应和后文的展开连起来。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<p>第一句提出“少数特殊人物推动社会流行”的解释；第二句的 but 把关注点转到这种解释能否说明观念传播；第三段再用研究结果检验特殊人物的作用。人物的特点是讨论对象的介绍，讨论他们在传播中的作用才是引用的用途。</p>\n"},{"title":"A. analyze the consequences of social epidemics","raw":"### A. analyze the consequences of social epidemics\n\n> 作者引用这本书，是为了分析社会流行现象的后果。\n\n**做题模式中的状态：** 当时读到 driven by 和 how ideas actually spread，已经分清原文追问的是产生与传播，而 A 问发生后的后果，所以第一轮排除了 A。\n\n**错误类型：第一类——歪曲原意。**\n\n它借用了 `social epidemics`，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。\n\n**出处：**\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q31-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 driven by 和 how ideas actually spread，已经分清原文追问的是产生与传播，而 A 问发生后的后果，所以第一轮排除了 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>social epidemics</code>，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n</section>"},{"title":"A. analyze the consequences of social epidemics","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 作者引用这本书，是为了分析社会流行现象的后果。\n\n`consequences`问的是流行之后发生什么；回看开头`driven`和结尾`spread`，文中谈的却是流行怎样产生和传播。\n\n`A`把引用这本书的目的说成分析社会流行的后果。先把因果两端摆清：首句是特殊人物的行动推动`social epidemics`，流行是被解释的现象；末句又问`ideas`怎样`spread`，仍在解释这一现象怎样形成和传开。\n\n`A`中的`consequences`却把社会流行放到原因一端，要继续谈它造成了什么。两种问题的方向不同，不能因为都出现`social epidemics`就当成同一件事。书中人物的行动、信息传播以及流行之后产生的后果，是三个不同位置；首段连起来讨论的是前两个位置，`A`把问题带到了第三个位置。\n\n它不能回答这本书为何被用来引出传播问题。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q31-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 driven by 和 how ideas actually spread，已经分清原文追问的是产生与传播，而 A 问发生后的后果，所以第一轮排除了 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>social epidemics</code>，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><code>consequences</code>问的是流行之后发生什么；回看开头<code>driven</code>和结尾<code>spread</code>，文中谈的却是流行怎样产生和传播。</p>\n<p><code>A</code>把引用这本书的目的说成分析社会流行的后果。先把因果两端摆清：首句是特殊人物的行动推动<code>social epidemics</code>，流行是被解释的现象；末句又问<code>ideas</code>怎样<code>spread</code>，仍在解释这一现象怎样形成和传开。</p>\n<p><code>A</code>中的<code>consequences</code>却把社会流行放到原因一端，要继续谈它造成了什么。两种问题的方向不同，不能因为都出现<code>social epidemics</code>就当成同一件事。书中人物的行动、信息传播以及流行之后产生的后果，是三个不同位置；首段连起来讨论的是前两个位置，<code>A</code>把问题带到了第三个位置。</p>\n<p>它不能回答这本书为何被用来引出传播问题。</p>\n</section>"},{"title":"A. analyze the consequences of social epidemics","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> 马尔科姆·格拉德威尔在其著作《引爆点》中认为，\"社会流行\"在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。\n\n首句先交代书中对流行起因的解释，转折句追问它能不能解释实际传播。后文仍在研究传播机制，没有沿着流行发生后的社会后果展开。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> The book helps explain what happens to a society after an idea has become widely popular.\n>\n> 这本书帮助解释一个观念广泛流行以后，社会会发生什么变化。\n\n`A` 所需要的是“流行已经出现 → 再讨论后果”；原文实际是“提出驱动流行的解释 → 追问如何传开”。两条路线从要解释的问题上就不同。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q31-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 driven by 和 how ideas actually spread，已经分清原文追问的是产生与传播，而 A 问发生后的后果，所以第一轮排除了 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>social epidemics</code>，却把“什么推动流行、流行怎样传播”改成“流行造成了什么”，把被解释的现象移到了造成后果的一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了分析社会流行现象的后果。</p>\n</blockquote>\n<p><code>consequences</code>问的是流行之后发生什么；回看开头<code>driven</code>和结尾<code>spread</code>，文中谈的却是流行怎样产生和传播。</p>\n<p><code>A</code>把引用这本书的目的说成分析社会流行的后果。先把因果两端摆清：首句是特殊人物的行动推动<code>social epidemics</code>，流行是被解释的现象；末句又问<code>ideas</code>怎样<code>spread</code>，仍在解释这一现象怎样形成和传开。</p>\n<p><code>A</code>中的<code>consequences</code>却把社会流行放到原因一端，要继续谈它造成了什么。两种问题的方向不同，不能因为都出现<code>social epidemics</code>就当成同一件事。书中人物的行动、信息传播以及流行之后产生的后果，是三个不同位置；首段连起来讨论的是前两个位置，<code>A</code>把问题带到了第三个位置。</p>\n<p>它不能回答这本书为何被用来引出传播问题。</p>\n</section><section class=\"revealPart\" id=\"focus-q31-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。</p>\n</blockquote>\n<p>首句先交代书中对流行起因的解释，转折句追问它能不能解释实际传播。后文仍在研究传播机制，没有沿着流行发生后的社会后果展开。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The book helps explain what happens to a society after an idea has become widely popular.</p>\n<p>这本书帮助解释一个观念广泛流行以后，社会会发生什么变化。</p>\n</blockquote>\n<p><code>A</code> 所需要的是“流行已经出现 → 再讨论后果”；原文实际是“提出驱动流行的解释 → 追问如何传开”。两条路线从要解释的问题上就不同。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. discuss influentials’ function in spreading ideas","raw":"### B. discuss influentials’ function in spreading ideas\n\n> 作者引用这本书，是为了讨论有影响力者在传播观念中的作用。\n\n**做题模式中的状态：** 第一轮里，B 能接住 driven by 和 ideas actually spread，因此保留；D 也对应人物特征，当时暂留 B、D。最后把第三至五段的研究接起来，才确定引用是为讨论传播作用，最终选 B。\n\n**选项类型：例子作用概括。**\n\n它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。`discuss` 只表示讨论，不要求作者赞同书里的判断。\n\n**出处：**\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q31-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>作者引用这本书，是为了讨论有影响力者在传播观念中的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮里，B 能接住 driven by 和 ideas actually spread，因此保留；D 也对应人物特征，当时暂留 B、D。最后把第三至五段的研究接起来，才确定引用是为讨论传播作用，最终选 B。</p>\n<p><strong>选项类型：例子作用概括。</strong></p>\n<p>它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。<code>discuss</code> 只表示讨论，不要求作者赞同书里的判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section>"},{"title":"B. discuss influentials’ function in spreading ideas","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者引用这本书，是为了讨论有影响力者在传播观念中的作用。\n\n先看书中主张的完整关系：少数特殊人物的行动在很大程度上推动了`social epidemics`。`influentials`是这些人，`driven by`说的是他们对传播起什么作用，正好对应B的`function in spreading ideas`。\n\n作者紧接着写`The idea is intuitively compelling, but ...`，先承认这种解释听起来有说服力，再指出它并未解释观念实际如何传播。第三段又引入研究，认为这群人的作用远小于一般人的想象。这些句子都在检验同一个问题：流行是否主要靠少数特殊人物推动。\n\nB用的是`discuss`，不是`approve of`。讨论可以从介绍一种看法开始，也可以通过后面的研究反对它。书的观点为后文提供了要检验的对象，因此“讨论这些人的传播作用”能贯穿引用和后文。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q31-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>作者引用这本书，是为了讨论有影响力者在传播观念中的作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮里，B 能接住 driven by 和 ideas actually spread，因此保留；D 也对应人物特征，当时暂留 B、D。最后把第三至五段的研究接起来，才确定引用是为讨论传播作用，最终选 B。</p>\n<p><strong>选项类型：例子作用概括。</strong></p>\n<p>它把第一句中的“特殊人物推动流行”与作者后面对这种作用的质疑合在一起。<code>discuss</code> 只表示讨论，不要求作者赞同书里的判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q31-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了讨论有影响力者在传播观念中的作用。</p>\n</blockquote>\n<p>先看书中主张的完整关系：少数特殊人物的行动在很大程度上推动了<code>social epidemics</code>。<code>influentials</code>是这些人，<code>driven by</code>说的是他们对传播起什么作用，正好对应B的<code>function in spreading ideas</code>。</p>\n<p>作者紧接着写<code>The idea is intuitively compelling, but ...</code>，先承认这种解释听起来有说服力，再指出它并未解释观念实际如何传播。第三段又引入研究，认为这群人的作用远小于一般人的想象。这些句子都在检验同一个问题：流行是否主要靠少数特殊人物推动。</p>\n<p>B用的是<code>discuss</code>，不是<code>approve of</code>。讨论可以从介绍一种看法开始，也可以通过后面的研究反对它。书的观点为后文提供了要检验的对象，因此“讨论这些人的传播作用”能贯穿引用和后文。</p>\n</section>"},{"title":"B. discuss influentials’ function in spreading ideas","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n>\n> 马尔科姆·格拉德威尔在其著作《引爆点》中认为，\"社会流行\"在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。\n\n书中先提出影响者很重要，作者接着指出解释不足，再引入影响者作用远小于想象的研究。后文是在检验他们的作用，而不是补写人物介绍。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> Gladwell assigns influentials a major role in spreading ideas, but researchers question how much influence they actually have.\n>\n> 格拉德威尔认为影响者在观念传播中起重要作用，但研究人员质疑他们实际能起多大作用。\n\n`B` 所需的“先提出作用 → 再讨论、检验作用”已经完整出现在文章中。作者可以最后反对原理论，但这一过程仍属于讨论影响者的传播功能。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","labe oint, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n<p>马尔科姆·格拉德威尔在其著作《引爆点》中认为，&quot;社会流行&quot;在很大程度上是由一小部分特殊个体的行动所驱动的，这些人通常被称为影响者，他们消息灵通、善于说服别人或人脉广泛。这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。然而，在最近的研究中，一些研究人员发现，影响者对社会流行的影响远小于人们通常认为的。</p>\n</blockquote>\n<p>书中先提出影响者很重要，作者接着指出解释不足，再引入影响者作用远小于想象的研究。后文是在检验他们的作用，而不是补写人物介绍。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Gladwell assigns influentials a major role in spreading ideas, but researchers question how much influence they actually have.</p>\n<p>格拉德威尔认为影响者在观念传播中起重要作用，但研究人员质疑他们实际能起多大作用。</p>\n</blockquote>\n<p><code>B</code> 所需的“先提出作用 → 再讨论、检验作用”已经完整出现在文章中。作者可以最后反对原理论，但这一过程仍属于讨论影响者的传播功能。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. exemplify people’s intuitive response to social epidemics","raw":"### C. exemplify people’s intuitive response to social epidemics\n\n> 作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。\n\n**做题模式中的状态：** 当时 C 的 exemplify 被遮挡，原文 compelling 也被遮挡；但能读出的 people’s intuitive response 已经把对象换成公众对流行的反应。根据 The idea 回指书中解释，第一轮就排除了 C。\n\n**错误类型：第一类——歪曲原意。**\n\n`intuitively` 说的是这套理论在直觉上令人信服；`C` 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。\n\n**出处：**\n\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q31-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 C 的 exemplify 被遮挡，原文 compelling 也被遮挡；但能读出的 people’s intuitive response 已经把对象换成公众对流行的反应。根据 The idea 回指书中解释，第一轮就排除了 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>intuitively</code> 说的是这套理论在直觉上令人信服；<code>C</code> 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n</section>"},{"title":"C. exemplify people’s intuitive response to social epidemics","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。\n\n`exemplify`是举例说明，C要说明的是`people’s intuitive response to social epidemics`，也就是人们面对流行现象时产生了怎样的直觉反应。\n\n原文的`intuitively`却在评价`The idea`。这个`idea`回指书中“少数特殊人物推动社会流行”的解释；`compelling`说这套解释凭直觉看很有说服力。被评价的是一个解释，不是人们看到某种潮流后作出的反应。\n\n再把`but`后半句接上：作者马上追问这套解释能否说明观念实际怎样传播。如果本段在举例说明公众反应，后面应当接公众怎样想、怎样行动；这里接的却是对理论解释力的质疑。C虽用了相近的`intuitive`，所说的事情并没有与这一句对应。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q31-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 C 的 exemplify 被遮挡，原文 compelling 也被遮挡；但能读出的 people’s intuitive response 已经把对象换成公众对流行的反应。根据 The idea 回指书中解释，第一轮就排除了 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>intuitively</code> 说的是这套理论在直觉上令人信服；<code>C</code> 却把它搬成公众面对流行时的心理反应。被评价的是解释，选项回答的却是另一群人的反应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\  intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q31-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者引用这本书，是为了举例说明人们对社会流行现象的直觉反应。</p>\n</blockquote>\n<p><code>exemplify</code>是举例说明，C要说明的是<code>people’s intuitive response to social epidemics</code>，也就是人们面对流行现象时产生了怎样的直觉反应。</p>\n<p>原文的<code>intuitively</code>却在评价<code>The idea</code>。这个<code>idea</code>回指书中“少数特殊人物推动社会流行”的解释；<code>compelling</code>说这套解释凭直觉看很有说服力。被评价的是一个解释，不是人们看到某种潮流后作出的反应。</p>\n<p>再把<code>but</code>后半句接上：作者马上追问这套解释能否说明观念实际怎样传播。如果本段在举例说明公众反应，后面应当接公众怎样想、怎样行动；这里接的却是对理论解释力的质疑。C虽用了相近的<code>intuitive</code>，所说的事情并没有与这一句对应。</p>\n</section><section class=\"revealPart\" id=\"focus-q31-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>这个想法直觉上很有吸引力，但它并没有解释想法实际上是如何传播的。</p>\n</blockquote>\n<p>作者评价这套解释“直觉上有吸引力”，随即用 <code>but</code> 指出它不能说明实际传播。后文转向传播研究，没有列举公众面对某种潮流的直觉反应。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The book gives examples of how people instinctively react when a social epidemic occurs.</p>\n<p>这本书举例展示社会流行发生时，人们会怎样凭直觉作出反应。</p>\n</blockquote>\n<p><code>C</code> 至少需要“流行现象出现 → 人们产生某种直觉反应”的例子。实际句子的主语是 <code>The idea</code>，转折后检验的也是这个解释，不能把理论的说服力当成人群反应。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. describe the essential characteristics of influentials","raw":"### D. describe the essential characteristics of influentials\n\n> 作者引用这本书，是为了描述有影响力者的基本特征。\n\n**做题模式中的状态：** 第一轮确实看到了 informed、persuasive、well connected，D 因而与 B 一起保留。最后回查后文发现文章持续检验传播作用，人物特征只是引入对象，于是排除 D、选择 B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，`D` 却把用来介绍对象的一小段内容当成引用的主要目的。\n\n**出处：**\n\n> In his book The Tipping Point, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.\n>\n> The idea is intuitively compelling, but it doesn't explain how ideas actually spread.\n>\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"31题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"31","option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q31-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>作者引用这本书，是为了描述有影响力者的基本特征。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮确实看到了 informed、persuasive、well connected，D 因而与 B 一起保留。最后回查后文发现文章持续检验传播作用，人物特征只是引入对象，于是排除 D、选择 B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>特征列举确实在原文中，错误不在这些特征本身。题干问引用的作用，<code>D</code> 却把用来介绍对象的一小段内容当成引用的主要目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that &quot;social epidemics&quot; are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.</p>\n<p>The idea is intuitively compelling, but it doesn&#39;t explain how ideas actually spread.</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n</section>"},{"title":"D. describe the essential characteristics of influentials","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 作者引用这本书，是为了描述有影响力者的基本特征。\n\n`essential characteristics`对应`informed`、`persuasive`、`well connected`，确实能在第一句找到人物特征。\n\n`characteristics` 确实能对应 `informed, persuasive, or well connected`，这些特点不是虚构的。但它们位于介绍 inf
