<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 31题题干\n\n**By citing the book The Tipping Point, the author intends to  ______.**\n\n> 作者引用《引爆点》，是想做什么？\n\n题型：**例子作用题**。","articleRects":[],"questionRects":[[226,190,937,38],[1172,222,111,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"},"html":"<h2>31题题干</h2>\n<p><strong>By citing the book The Tipping Point, the author intends to  ______.</strong></p>\n<blockquote><p>作者引用《引爆点》，是想做什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 32题题干\n\n**The author suggests that the “two-step-flow theory”  ______.**\n\n> 作者认为“两级传播理论”怎么样？\n\n题型：**局部作者观点题**。","articleRects":[],"questionRects":[[226,555,820,40]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"},"html":"<h2>32题题干</h2>\n<p><strong>The author suggests that the “two-step-flow theory”  ______.</strong></p>\n<blockquote><p>作者认为“两级传播理论”怎么样？</p>\n</blockquote>\n<p>题型：<strong>局部作者观点题</strong>。</p>\n"},{"section":"先读题干","raw":"## 33题题干\n\n**What the researchers have observed recently shows that  ______.**\n\n> 研究人员最近的观察说明什么？\n\n题型：**具体细节题**。","articleRects":[],"questionRects":[[226,924,872,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"},"html":"<h2>33题题干</h2>\n<p><strong>What the researchers have observed recently shows that  ______.</strong></p>\n<blockquote><p>研究人员最近的观察说明什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 34题题干\n\n**The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.**\n\n> 第四段these people指的是哪些人？\n\n题型：**指代题**。","articleRects":[],"questionRects":[[226,1289,1195,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"},"html":"<h2>34题题干</h2>\n<p><strong>The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.</strong></p>\n<blockquote><p>第四段these people指的是哪些人？</p>\n</blockquote>\n<p>题型：<strong>指代题</strong>。</p>\n"},{"section":"先读题干","raw":"## 35题题干\n\n**What is the essential element in the dynamics of social influence?**\n\n> 社会影响动态过程中的关键要素是什么？\n\n题型：**具体细节题**。","articleRects":[],"questionRects":[[226,1718,1026,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"},"html":"<h2>35题题干</h2>\n<p><strong>What is the essential element in the dynamics of social influence?</strong></p>\n<blockquote><p>社会影响动态过程中的关键要素是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, however, Yet |\n| 态度词／评价词 | 先抓个大概好坏 | far less, required, resistant |\n| 动作词 | 先看谁做了什么 | flows, influence, spread |\n| 结果词 | 看最后出了什么事 | popularity, impact, changes |\n| 重复主题词 | 大概知道老在说什么 | influentials, people, social influence |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, however, Yet</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>far less, required, resistant</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>flows, influence, spread</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>popularity, impact, changes</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>influentials, people, social influence</td></tr></tbody></table>\n"},{"section":"读文章","raw":"In his book The Tipping Point, Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected. The idea is intuitively **[xxx]**, but it doesn’t explain how ideas actually spread.","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>In his book The Tipping Point, Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected. The idea is intuitively <strong>[xxx]</strong>, but it doesn’t explain how ideas actually spread.</p>\n</div></div>"},{"section":"读文章","raw":"In his book The Tipping Point, / Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, / often called influentials, / who are unusually informed, persuasive, / or well connected. / The idea is intuitively **[xxx]**, / but it doesn’t explain how ideas actually spread.","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>In his bo 的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到在他的书里、社会流行现象、并不解释怎样、观念实际传播；中间又出现被认为的重要性、大体未经检验的理论、在其他任何人注意到之前、推动潮流；最近的工作、一些研究人员、远小得多的影响、完全需要；一个简单观察、社会影响、两级、很多人；结尾还有这个基本事实、研究人员、不是几个有影响力者、容易受影响的人。</p>\n<p>到这里还不能自然地说清楚：有影响力者和其他人在传播中怎样联系，那项理论与后面的研究是什么关系。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"31题","raw":"## 31题\n\n> By citing the book The Tipping Point, the author intends to  ______.  \n> 作者引用《引爆点》，是想做什么？\n\n书名The Tipping Point就在开头。读完第一段，既看书里说了什么，也看作者接着怎样回应。\n\n> 原文参考：\n> \n> In his book The Tipping Point, Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected. The idea is intuitively **[xxx]**, but it doesn’t explain how ideas actually spread.\n> \n> 开始精读：\n> \n> In his book The Tipping Point, / Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, / often called influentials, / who are unusually informed, persuasive, / or well connected. / The idea is intuitively **[xxx]**, / but it doesn’t explain how ideas actually spread.\n> \n> 在他的《引爆点》一书里，/ Malcolm Gladwell认为，社会流行现象很大程度上由极少数特殊人物的行动推动，/ 这些人常被叫作有影响力者，/ 他们知道得特别多，有说服力，/ 或人脉广。/ 这个想法在直觉上很**[xxx]**，/ 但它并没有解释观念实际上怎样传播。\n\n书里先说少数特殊人物推动社会流行。后一句的`The idea`接着这个说法，`but`后又说它没有解释观念怎样传播。题干问为什么引用这本书，我们看选项时，要把书里的说法和作者接着说的这句都接上。\n\n接下来按A—D逐项看。","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[[226,190,937,38],[1172,222,111,7],[280,251,711,38],[280,312,736,38],[280,373,878,38],[280,434,784,31]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"31","initialReadingPids":[0]},"html":"<h2>31题</h2>\n<blockquote><p>By citing the book The Tipping Point, the author intends to  ______.<br />\n作者引用《引爆点》，是想做什么？</p>\n</blockquote>\n<p>书名The Tipping Point就在开头。读完第一段，既看书里说了什么，也看作者接着怎样回应。</p>\n<blockquote><p>原文参考：</p>\n<p>In his book The Tipping Point, Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected. The idea is intuitively <strong>[xxx]</strong>, but it doesn’t explain how ideas actually spread.</p>\n<p>开始精读：</p>\n<p>In his book The Tipping Point, / Malcolm Gladwell argues that “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals, / often called influentials, / who are unusually informed, persuasive, / or well connected. / The idea is intuitively <strong>[xxx]</strong>, / but it doesn’t explain how ideas actually spread.</p>\n<p>在他的《引爆点》一书里，/ Malcolm Gladwell认为，社会流行现象很大程度上由极少数特殊人物的行动推动，/ 这些人常被叫作有影响力者，/ 他们知道得特别多，有说服力，/ 或人脉广。/ 这个想法在直觉上很<strong>[xxx]</strong>，/ 但它并没有解释观念实际上怎样传播。</p>\n</blockquote>\n<p>书里先说少数特殊人物推动社会流行。后一句的<code>The idea</code>接着这个说法，<code>but</code>后又说它没有解释观念怎样传播。题干问为什么引用这本书，我们看选项时，要把书里的说法和作者接着说的这句都接上。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"31题","raw":"### A. analyze the consequences of social epidemics\n\n> 作者想分析社会流行现象的后果。\n\n把A接回题干，它说的是：作者想分析社会流行现象的后果。\n\nA中的`social epidemics`就在第一句，`consequences`说的是它发生以后造成什么后果。我们把第一句的`are driven ... by`和最后的`how ideas actually spread`拿回来，看作者是在说流行之前的推动，还是流行之后的后果。\n\n> “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals\n\n> but it doesn’t explain how ideas actually spread.\n\n首句把两件事接了起来：少数特殊人物采取行动，社会流行现象受这些行动推动。这里要解释的是流行怎样发生。\n\n末句又问，观念实际上怎样传播。它接着追问的仍是前面那件事怎样发生、怎样传开。\n\nA要说的却是社会流行已经发生之后，又造成了什么后果。如果把A接上，应该继续读到流行使哪些人或哪些事情发生了变化；这两句话都没有往那里说。\n\n**作者在解释流行怎样产生、怎样传播，这和A说的流行造成什么后果，是同一个问题吗？**\n\n不是。原文追问推动流行的原因和传播过程，A要追问的是流行之后的结果。\n\n**第一轮判断：A排除。**","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[[280,251,711,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>A. analyze the consequences of social epidemics</h3>\n<blockquote><p>作者想分析社会流行现象的后果。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者想分析社会流行现象的后果。</p>\n<p>A中的<code>social epidemics</code>就在第一句，<code>consequences</code>说的是它发生以后造成什么后果。我们把第一句的<code>are driven ... by</code>和最后的<code>how ideas actually spread</code>拿回来，看作者是在说流行之前的推动，还是流行之后的后果。</p>\n<blockquote><p>“ social epidemics” are driven in large part by the actions of a tiny minority of special individuals</p>\n</blockquote>\n<blockquote><p>but it doesn’t explain how ideas actually spread.</p>\n</blockquote>\n<p>首句把两件事接了起来：少数特殊人物采取行动，社会流行现象受这些行动推动。这里要解释的是流行怎样发生。</p>\n<p>末句又问，观念实际上怎样传播。它接着追问的仍是前面那件事怎样发生、怎样传开。</p>\n<p>A要说的却是社会流行已经发生之后，又造成了什么后果。如果把A接上，应该继续读到流行使哪些人或哪些事情发生了变化；这两句话都没有往那里说。</p>\n<p><strong>作者在解释流行怎样产生、怎样传播，这和A说的流行造成什么后果，是同一个问题吗？</strong></p>\n<p>不是。原文追问推动流行的原因和传播过程，A要追问的是流行之后的结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"31题","raw":"### B. discuss influentials’ function in spreading ideas\n\n> 作者想讨论有影响力者在传播观念中的作用。\n\n把B接回题干，它说的是：作者想讨论有影响力者在传播观念中的作用。\n\nB里的`influentials`就是第一句中那些特殊人物，`spreading ideas`又和段末的`how ideas actually spread`接得上。我们把书里的说法和作者紧接着说的话一起看，看看这些人在传播中做了什么。\n\n> “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals\n\n> but it doesn’t explain how ideas actually spread.\n\n书里先说，极少数特殊人物的行动在很大程度上推动了社会流行。作者接着用`but`说，这个想法还没有解释观念究竟怎样传播。\n\n所以，前一句认为这些人对传播很重要，后一句开始追问这种解释到底说不说得通。B的`discuss ... function`就是讨论他们起什么作用，既可以讨论他们能推动什么，也可以讨论他们究竟能不能起这么大的作用。\n\nB没有写“证明他们一定重要”。因此，作者引用书中的说法以后提出疑问，也能接在B说的讨论里。\n\n**讨论这些人在传播中的作用，是否就必须赞成书中“他们起了很大作用”的说法？**\n\n不必。先引出这种说法，再追问它能否解释传播，也是在讨论这些人的作用。B先留下。\n\n**第一轮判断：B保留。**","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[[280,312,736,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"31","paragraphPids":[0]},"html":"<h3>B. discuss influentials’ function in spreading ideas</h3>\n<blockquote><p>作者想讨论有影响力者在传播观念中的作用。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者想讨论有影响力者在传播观念中的作用。</p>\n<p>B里的<code>influentials</code>就是第一句中那些特殊人物，<code>spreading ideas</code>又和段末的<code>how ideas actually spread</code>接得上。我们把书里的说法和作者紧接着说的话一起看，看看这些人在传播中做了什么。</p>\n<blockquote><p>“ social epidemics” are driven in large part by the actions of a tiny minority of special individuals</p>\n</blockquote>\n<blockquote><p>but it doesn’t explain how ideas actually spread.</p>\n</blockquote>\n<p>书里先说，极少数特殊人物的行动在很大程度上推动了社会流行。作者接着用<code>but</code>说，这个想法还没有解释观念究竟怎样传播。</p>\n<p>所以，前一句认为这些人对传播很重要，后一句开始追问这种解释到底说不说得通。B的<code>discuss ... function</code>就是讨论他们起什么作用，既可以讨论他们能推动什么，也可以讨论他们究竟能不能起这么大的作用。</p>\n<p>B没有写“证明他们一定重要”。因此，作者引用书中的说法以后提出疑问，也能接在B说的讨论里。</p>\n<p><strong>讨论这些人在传播中的作用，是否就必须赞成书中“他们起了很大作用”的说法？</strong></p>\n<p>不必。先引出这种说法，再追问它能否解释传播，也是在讨论这些人的作用。B先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"31题","raw":"### C. **[xxx]** people’s intuitive response to social epidemics\n\n> 作者想**[xxx]**人们对社会流行现象的直觉反应。\n\n把C接回题干，它说的是：作者想**[xxx]**人们对社会流行现象的直觉反应。\n\nC中的`intuitive response`和首段的`intuitively`很像。我们回到`The idea is intuitively [xxx]`，先看被形容的`the idea`指什么，再看C说的是谁的反应。\n\n> The idea is intuitively **[xxx]**, but it doesn’t explain how ideas actually spread.\n\n`the idea`接的是前一句书中的说法：社会流行很大程度上由极少数特殊人物推动。作者在这里评价的是这个想法，后面的`it doesn’t explain`又说，这个想法解释不了观念怎样传播。\n\nC说的则是`people’s ... response to social epidemics`，即人们面对社会流行现象时的反应。原句里的“那个想法”变成了“人们的反应”，连面对的事情也变了：一个是听到对传播的解释，一个是面对流行现象本身。\n\nC开头的动作还不认识，但它后面已经明确要谈人们对流行的反应；首段这句话没有介绍这种反应。\n\n**`The idea`指书里的传播解释，能不能把它读成人们面对流行现象时的反应？**\n\n不能。作者在评价那种解释是否说得通，C说的是人们对流行的反应。\n\n**第一轮判断：C排除。**","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[[280,373,878,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>C. <strong>[xxx]</strong> people’s intuitive response to social epidemics</h3>\n<blockquote><p>作者想<strong>[xxx]</strong>人们对社会流行现象的直觉反应。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者想<strong>[xxx]</strong>人们对社会流行现象的直觉反应。</p>\n<p>C中的<code>intuitive response</code>和首段的<code>intuitively</code>很像。我们回到<code>The idea is intuitively [xxx]</code>，先看被形容的<code>the idea</code>指什么，再看C说的是谁的反应。</p>\n<blockquote><p>The idea is intuitively <strong>[xxx]</strong>, but it doesn’t explain how ideas actually spread.</p>\n</blockquote>\n<p><code>the idea</code>接的是前一句书中的说法：社会流行很大程度上由极少数特殊人物推动。作者在这里评价的是这个想法，后面的<code>it doesn’t explain</code>又说，这个想法解释不了观念怎样传播。</p>\n<p>C说的则是<code>people’s ... response to social epidemics</code>，即人们面对社会流行现象时的反应。原句里的“那个想法”变成了“人们的反应”，连面对的事情也变了：一个是听到对传播的解释，一个是面对流行现象本身。</p>\n<p>C开头的动作还不认识，但它后面已经明确要谈人们对流行的反应；首段这句话没有介绍这种反应。</p>\n<p><strong><code>The idea</code>指书里的传播解释，能不能把它读成人们面对流行现象时的反应？</strong></p>\n<p>不能。作者在评价那种解释是否说得通，C说的是人们对流行的反应。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"31题","raw":"### D. describe the essential characteristics of influentials\n\n> 作者想描述有影响力者的基本特征。\n\n把D接回题干，它说的是：作者想描述有影响力者的基本特征。\n\nD说`essential characteristics`，也就是基本特征。刚才第一句在`influentials`后面确实接了`who are unusually informed, persuasive, or well connected`。我们把这一段描述和首尾两句一起看。\n\n> who are unusually informed, persuasive, or well connected.\n\n> “ social epidemics” are driven in large part by the actions of a tiny minority of special individuals\n\n> but it doesn’t explain how ideas actually spread.\n\n`who`接着前面的`influentials`，说这些人知道得多、有说服力或人脉广。这些都是他们的特点，D里的“描述特征”确实能在书中这句话里找到。\n\n不过，第一句还说这些人的行动推动社会流行，最后一句又问这个想法能不能解释传播。作者既介绍了他们是谁，也谈了他们起什么作用。\n\n题干问的是引用这本书想做什么。现在首段两件事都写到了：是要继续介绍这类人的特点，还是介绍完这类人后继续讨论传播？先把D留下，和B一起看后面的内容接着写哪件事。\n\n**第一句确实列出了特点，到这里能否确定引用这本书主要就是为了介绍这些特点？**\n\n还不能。段末已经问到观念怎样传播，D先和B一起保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37]],"questionRects":[[280,434,784,31]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"31","paragraphPids":[0]},"html":"<h3>D. describe the essential characteristics of influentials</h3>\n<blockquote><p>作者想描述有影响力者的基本特征。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者想描述有影响力者的基本特征。</p>\n<p>D说<code>essential characteristics</code>，也就是基本特征。刚才第一句在<code>influentials</code>后面确实接了<code>who are unusually informed, persuasive, or well connected</code>。我们把这一段描述和首尾两句一起看。</p>\n<blockquote><p>who are unusually informed, persuasive, or well connected.</p>\n</blockquote>\n<blockquote><p>“ social epidemics” are driven in large part by the actions of a tiny minority of special individuals</p>\n</blockquote>\n<blockquote><p>but it doesn’t explain how ideas actually spread.</p>\n</blockquote>\n<p><code>who</code>接着前面的<code>influentials</code>，说这些人知道得多、有说服力或人脉广。这些都是他们的特点，D里的“描述特征”确实能在书中这句话里找到。</p>\n<p>不过，第一句还说这些人的行动推动社会流行，最后一句又问这个想法能不能解释传播。作者既介绍了他们是谁，也谈了他们起什么作用。</p>\n<p>题干问的是引用这本书想做什么。现在首段两件事都写到了：是要继续介绍这类人的特点，还是介绍完这类人后继续讨论传播？先把D留下，和B一起看后面的内容接着写哪件事。</p>\n<p><strong>第一句确实列出了特点，到这里能否确定引用这本书主要就是为了介绍这些特点？</strong></p>\n<p>还不能。段末已经问到观念怎样传播，D先和B一起保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D保留。\n\n暂时保留：B、D。\n\nB能接住作者对传播作用的提问，D也能对应书中实际列出的人物特征。引用是为介绍特点，还是为讨论作用，先把这个用途上的差别留下。","articleRects":[],"questionRects":[[226,190,937,38],[1172,222,111,7],[280,251,711,38],[280,312,736,38],[280,373,878,38],[280,434,784,31]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"31"},"html":"<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：B、D。</p>\n<p>B能接住作者对传播作用的提问，D也能对应书中实际列出的人物特征。引用是为介绍特点，还是为讨论作用，先把这个用途上的差别留下。</p>\n"},{"section":"32题","raw":"## 32题\n\n> The author suggests that the “two-step-flow theory”  ______.  \n> 作者认为“两级传播理论”怎么样？\n\ntwo-step-flow theory把我们带到第2段。第3段开头的however紧接着改变对这种解释的评价；题干问作者的看法，所以把这两段连着读完，分清营销人员的设想与作者引入的研究结果。\n\n> 原文参考：\n> \n> The supposed importance of influentials derives from a **[xxx]** but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else. Marketers have **[xxx]** the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or **[xxx]**. In many such cases, a **[xxx]** search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. **[xxx]** evidence of this kind fits nicely with the idea that only certain special people can drive trends.\n> \n> 开始精读：\n> \n> The supposed importance of influentials derives from a **[xxx]** but largely untested theory called the “two-step flow of communication”: / Information flows from the media to the influentials and from them to everyone else. / Marketers have **[xxx]** the two-step flow because it suggests that if they can just find and influence the influentials, / those select people will do most of the work for them. / The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or **[xxx]**. / In many such cases, / a **[xxx]** search for causes finds that some small group of people was wearing, promoting, / or developing whatever it is before anyone else paid attention. / **[xxx]** evidence of this kind fits nicely with the idea that only certain special people can drive trends.\n> \n> 有影响力者被认为很重要，这来自一个听起来**[xxx]**、但大体未经检验的理论，叫作“两级传播”：/ 信息从媒体流向有影响力者，再从他们流向其他人。/ 营销人员已经**[xxx]**了两级传播，因为它意味着，如果他们只需找到并影响有影响力者，/ 那些被挑中的人就会替他们做大部分工作。/ 这个理论似乎也解释了某些外观、品牌或**[xxx]**突然、意外地流行。/ 在许多这样的事例中，/ 对原因作一次**[xxx]**搜寻，就发现某一小群人在穿戴、推广，/ 或开发那些东西，在其他人注意到之前。/ 这种**[xxx]**证据很符合那个想法：只有某些特殊人物才能推动潮流。\n\n> 原文参考：\n> \n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed. In fact, they don’t seem to be required at all.\n> \n> 开始精读：\n> \n> In their recent work, however, / some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed. In fact, / they don’t seem to be required at all.\n> \n> 然而，在最近的工作中，/ 一些研究人员发现，有影响力者对社会流行现象的影响远小于一般人以为的。事实上，/ 看起来根本不需要他们。\n\n把第2段的理论解释与第3段的研究评价连起来，再判断哪一项真正表达作者对理论可靠性的看法。\n\n接下来按A—D逐项看。","articleRects":[[274,537,1122,38],[202,580,1185,39],[202,625,1194,38],[202,670,1194,37],[202,714,1194,38],[202,758,1195,38],[202,802,1195,38],[202,847,1189,37],[202,891,1184,38],[202,935,1194,38],[202,979,351,38],[274,1024,1122,37],[202,1068,1194,38],[203,1112,833,38]],"questionRects":[[226,555,820,40],[280,618,672,38],[280,679,669,38],[280,740,537,38],[280,801,602,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1,2],"qid":"32","initialReadingPids":[1,2]},"html":"<h2>32题</h2>\n<blockquote><p>The author suggests that the “two-step-flow theory”  ______.<br />\n作者认为“两级传播理论”怎么样？</p>\n</blockquote>\n<p>two-step-flow theory把我们带到第2段。第3段开头的however紧接着改变对这种解释的评价；题干问作者的看法，所以把这两段连着读完，分清营销人员的设想与作者引入的研究结果。</p>\n<blockquote><p>原文参考：</p>\n<p>The supposed importance of influentials derives from a <strong>[xxx]</strong> but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else. Marketers have <strong>[xxx]</strong> the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them. The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or <strong>[xxx]</strong>. In many such cases, a <strong>[xxx]</strong> search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention. <strong>[xxx]</strong> evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>开始精读：</p>\n<p>The supposed importance of influentials derives from a <strong>[xxx]</strong> but largely untested theory called the “two-step flow of communication”: / Information flows from the media to the influentials and from them to everyone else. / Marketers have <strong>[xxx]</strong> the two-step flow because it suggests that if they can just find and influence the influentials, / those select people will do most of the work for them. / The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or <strong>[xxx]</strong>. / In many such cases, / a <strong>[xxx]</strong> search for causes finds that some small group of people was wearing, promoting, / or developing whatever it is before anyone else paid attention. / <strong>[xxx]</strong> evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n<p>有影响力者被认为很重要，这来自一个听起来<strong>[xxx]</strong>、但大体未经检验的理论，叫作“两级传播”：/ 信息从媒体流向有影响力者，再从他们流向其他人。/ 营销人员已经<strong>[xxx]</strong>了两级传播，因为它意味着，如果他们只需找到并影响有影响力者，/ 那些被挑中的人就会替他们做大部分工作。/ 这个理论似乎也解释了某些外观、品牌或<strong>[xxx]</strong>突然、意外地流行。/ 在许多这样的事例中，/ 对原因作一次<strong>[xxx]</strong>搜寻，就发现某一小群人在穿戴、推广，/ 或开发那些东西，在其他人注意到之前。/ 这种<strong>[xxx]</strong>证据很符合那个想法：只有某些特殊人物才能推动潮流。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed. In fact, they don’t seem to be required at all.</p>\n<p>开始精读：</p>\n<p>In their recent work, however, / some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed. In fact, / they don’t seem to be required at all.</p>\n<p>然而，在最近的工作中，/ 一些研究人员发现，有影响力者对社会流行现象的影响远小于一般人以为的。事实上，/ 看起来根本不需要他们。</p>\n</blockquote>\n<p>把第2段的理论解释与第3段的研究评价连起来，再判断哪一项真正表达作者对理论可靠性的看法。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"32题","raw":"### A. serves as a solution to marketing problems\n\n> 两级传播理论能解决营销问题。\n\n把A接回题干，它说的是：两级传播理论能解决营销问题。\n\nA说解决`marketing problems`，第2段也写了`Marketers`，还说那些人会替他们`do most of the work`。我们回看这句话，再接上第3段开头的`however`，看看这个办法是营销人员的设想，还是作者已经确认的效果。\n\n> The supposed importance of influentials derives from a **[xxx]** but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else.\n\n> Marketers have **[xxx]** the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.\n\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n\n`because it suggests that if ...`说的是这个理论给营销人员的设想：如果能找到并影响那些有影响力者，他们就会替自己完成大部分工作。这里还没有说营销人员照做以后，问题就真的解决了。\n\n作者先把理论称为`largely untested`，大体上还没有经过检验。接着用`however`引入研究发现：这些人的影响比通常以为的小得多。\n\nA把这个办法直接写成能解决营销问题；我们读到的却是，办法依靠的那群人可能并没有预想的作用。营销人员希望他们能帮忙，不能接成作者认可这套办法已经有效。\n\n**营销人员认为找到这些人就能省力，作者是否也确认了这个办法能解决营销问题？**\n\n没有。作者说理论还没有充分检验，后面又引入了这些人实际影响更小的研究。\n\n**第一轮判断：A排除。**","articleRects":[[274,537,1122,38],[202,580,1185,39],[202,625,1194,38],[202,670,1194,37],[202,714,1194,38],[202,758,1195,38],[202,802,1195,38],[202,847,1189,37],[202,891,1184,38],[202,935,1194,38],[202,979,351,38],[274,1024,1122,37],[202,1068,1194,38],[203,1112,833,38]],"questionRects":[[280,618,672,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"32","paragraphPids":[1,2]},"html":"<h3>A. serves as a solution to marketing problems</h3>\n<blockquote><p>两级传播理论能解决营销问题。</p>\n</blockquote>\n<p>把A接回题干，它说的是：两级传播理论能解决营销问题。</p>\n<p>A说解决<code>marketing problems</code>，第2段也写了<code>Marketers</code>，还说那些人会替他们<code>do most of the work</code>。我们回看这句话，再接上第3段开头的<code>however</code>，看看这个办法是营销人员的设想，还是作者已经确认的效果。</p>\n<blockquote><p>The supposed importance of influentials derives from a <strong>[xxx]</strong> but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else.</p>\n</blockquote>\n<blockquote><p>Marketers have <strong>[xxx]</strong> the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n</blockquote>\n<blockquote><p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<p><code>because it suggests that if ...</code>说的是这个理论给营销人员的设想：如果能找到并影响那些有影响力者，他们就会替自己完成大部分工作。这里还没有说营销人员照做以后，问题就真的解决了。</p>\n<p>作者先把理论称为<code>largely untested</code>，大体上还没有经过检验。接着用<code>however</code>引入研究发现：这些人的影响比通常以为的小得多。</p>\n<p>A把这个办法直接写成能解决营销问题；我们读到的却是，办法依靠的那群人可能并没有预想的作用。营销人员希望他们能帮忙，不能接成作者认可这套办法已经有效。</p>\n<p><strong>营销人员认为找到这些人就能省力，作者是否也确认了这个办法能解决营销问题？</strong></p>\n<p>没有。作者说理论还没有充分检验，后面又引入了这些人实际影响更小的研究。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"32题","raw":"### B. has helped explain certain **[xxx]** trends\n\n> 两级传播理论已经帮助解释了某些**[xxx]**趋势。\n\n把B接回题干，它说的是：两级传播理论已经帮助解释了某些**[xxx]**趋势。\n\nB中的`helped explain`让我们想到第2段的`seems to explain`，都是在说解释某些潮流。先读这句前面的`largely untested`，再看第3段怎样接下去。\n\n> The supposed importance of influentials derives from a **[xxx]** but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else.\n\n> The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or **[xxx]**.\n\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n\n第2段说，这个理论似乎能解释某些东西为什么突然流行：回头找，会发现少数人先开始穿、推广或开发，后来其他人才注意到。\n\n但作者没有停在这里。前面说理论大体上没有经过检验，后面又用`however`引入研究，发现有影响力者的作用远小于一般人以为的。这样读下来，“似乎能解释”是作者正在拿来检查的说法。\n\nB只接走了“帮助解释潮流”这一部分。题干要问作者怎样看这个理论，还得接上他随后引出的质疑；不能读到`seems to explain`就把后面的研究放下。\n\n**作者介绍它似乎能够解释潮流以后，是认可了这份解释，还是继续拿研究来质疑它？**\n\n继续质疑它。后面的研究说这些人的影响远没有一般人以为的大，B没有接上这层转折。\n\n**第一轮判断：B排除。**","articleRects":[[274,537,1122,38],[202,580,1185,39],[202,625,1194,38],[202,670,1194,37],[202,714,1194,38],[202,758,1195,38],[202,802,1195,38],[202,847,1189,37],[202,891,1184,38],[202,935,1194,38],[202,979,351,38],[274,1024,1122,37],[202,1068,1194,38],[203,1112,833,38]],"questionRects":[[280,679,669,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"32","paragraphPids":[1,2]}," 认可这个理论；仅仅在理论里承担传播工作，还不能说明他们赞成理论。\n\n**被营销人员找到并影响，是否就说明这些人支持“两级传播理论”？**\n\n不能。原文把他们写成准备被利用来传播消息的人，没有写他们赞成这一理论。\n\n**第一轮判断：C排除。**","articleRects":[[274,537,1122,38],[202,580,1185,39],[202,625,1194,38],[202,670,1194,37],[202,714,1194,38],[202,758,1195,38],[202,802,1195,38],[202,847,1189,37],[202,891,1184,38],[202,935,1194,38],[202,979,351,38]],"questionRects":[[280,740,537,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>C. has won support from influentials</h3>\n<blockquote><p>两级传播理论得到有影响力者的支持。</p>\n</blockquote>\n<p>把C接回题干，它说的是：两级传播理论得到有影响力者的支持。</p>\n<p>C说支持理论的是<code>influentials</code>。第2段同时出现了<code>Marketers</code>和<code>influentials</code>，我们回看<code>find and influence</code>这句话，分清是谁准备找谁。</p>\n<blockquote><p>Marketers have <strong>[xxx]</strong> the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.</p>\n</blockquote>\n<p>这一句先说营销人员看中了理论里的某个东西，接着说：如果<code>they</code>能找到并影响<code>the influentials</code>，那些被选中的人就能替他们完成大部分工作。</p>\n<p><code>they</code>接着前面的营销人员；<code>influentials</code>是他们准备寻找和影响的人。原文说这些人可能帮营销人员传播消息，没有写他们如何看待“两级传播理论”。</p>\n<p>C却说这些人支持理论。要得到这句话，我们得读到他们赞成或认可这个理论；仅仅在理论里承担传播工作，还不能说明他们赞成理论。</p>\n<p><strong>被营销人员找到并影响，是否就说明这些人支持“两级传播理论”？</strong></p>\n<p>不能。原文把他们写成准备被利用来传播消息的人，没有写他们赞成这一理论。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"32题","raw":"### D. requires solid evidence for its validity\n\n> 两级传播理论的有效性需要扎实证据。\n\n把D接回题干，它说的是：两级传播理论的有效性需要扎实证据。\n\nD里的`validity`问理论是否站得住，`solid evidence`说需要扎实证据。第2段一开始的`largely untested`正好谈到理论有没有经过检验，我们再把段末的证据和第3段的新发现连起来看。\n\n> The supposed importance of influentials derives from a **[xxx]** but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else.\n\n> **[xxx]** evidence of this kind fits nicely with the idea that only certain special people can drive trends.\n\n> In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.\n\n`largely untested`已经说明，这个理论还缺少充分检验。段末说有一些例子和它很相合：少数人先做某件事，随后这件事流行起来。\n\n先开始做，能说明他们出现得早，但还没有告诉我们，后来的流行是不是正由这些人的特殊影响推动。第3段的研究又发现，这些人的实际作用远小于大家以为的。\n\n因此，原来那些“看起来和理论相合”的例子还不能把这件事定下来。D说要用扎实证据看理论是否有效，正接上这里尚未解决的问题：到底是不是这群人推动了后来的传播。\n\n**少数人先行动、后来出现潮流，就已经证明潮流是靠这些人的特殊影响传开的吗？**\n\n还没有。尤其后面的研究给出了不同结果，还要拿出证据说明他们实际起了什么作用。D保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,537,1122,38],[202,580,1185,39],[202,625,1194,38],[202,670,1194,37],[202,714,1194,38],[202,758,1195,38],[202,802,1195,38],[202,847,1189,37],[202,891,1184,38],[202,935,1194,38],[202,979,351,38],[274,1024,1122,37],[202,1068,1194,38],[203,1112,833,38]],"questionRects":[[280,801,602,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"32","paragraphPids":[1,2]},"html":"<h3>D. requires solid evidence for its validity</h3>\n<blockquote><p>两级传播理论的有效性需要扎实证据。</p>\n</blockquote>\n<p>把D接回题干，它说的是：两级传播理论的有效性需要扎实证据。</p>\n<p>D里的<code>validity</code>问理论是否站得住，<code>solid evidence</code>说需要扎实证据。第2段一开始的<code>largely untested</code>正好谈到理论有没有经过检验，我们再把段末的证据和第3段的新发现连起来看。</p>\n<blockquote><p>The supposed importance of influentials derives from a <strong>[xxx]</strong> but largely untested theory called the “two-step flow of communication”: Information flows from the media to the influentials and from them to everyone else.</p>\n</blockquote>\n<blockquote><p><strong>[xxx]</strong> evidence of this kind fits nicely with the idea that only certain special people can drive trends.</p>\n</blockquote>\n<blockquote><p>In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.</p>\n</blockquote>\n<p><code>largely untested</code>已经说明，这个理论还缺少充分检验。段末说有一些例子和它很相合：少数人先做某件事，随后这件事流行起来。</p>\n<p>先开始做，能说明他们出现得早，但还没有告诉我们，后来的流行是不是正由这些人的特殊影响推动。第3段的研究又发现，这些人的实际作用远小于大家以为的。</p>\n<p>因此，原来那些“看起来和理论相合”的例子还不能把这件事定下来。D说要用扎实证据看理论是否有效，正接上这里尚未解决的问题：到底是不是这群人推动了后来的传播。</p>\n<p><strong>少数人先行动、后来出现潮流，就已经证明潮流是靠这些人的特殊影响传开的吗？</strong></p>\n<p>还没有。尤其后面的研究给出了不同结果，还要拿出证据说明他们实际起了什么作用。D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"32题","raw":"### 32题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。","articleRects":[],"questionRects":[[226,555,820,40],[280,618,672,38],[280,679,669,38],[280,740,537,38],[280,801,602,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"32"},"html":"<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n"},{"section":"33题","raw":"## 33题\n\n> What the researchers have observed recently shows that  ______.  \n> 研究人员最近的观察说明什么？\n\nresearchers和observed对应第四段的simple observation。先看观察本身，再看作者怎样区分名人与普通有影响力者。\n\n> 原文参考：\n> \n> The researchers’ argument **[xxx]** from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose **[xxx]** presence is primarily a function of media, not interpersonal, influence— even the most influential members of a **[xxx]** simply don’t interact with that many others. Yet it is precisely these non-celebrity influentials who, according to the two-step-flow theory, are supposed to drive social epidemics, by influencing their friends and **[xxx]** directly. For a social epidemic to occur, however, each person so affected must then influence his or her own **[xxx]**, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential. If people in the network just two degrees removed from the initial influential prove resistant, for example, the cascade of change won’t **[xxx]** very far or affect many people.\n> \n> 开始精读：\n> \n> The researchers’ argument **[xxx]** from a simple observation about social influence: / With the exception of a few celebrities like Oprah Winfrey— /  resistant, for example, / the cascade of change won’t <strong>[xxx]</strong> very far or affect many people.</p>\n<p>研究人员的论点<strong>[xxx]</strong>于一个关于社会影响的简单观察：/ 除了Oprah Winfrey这样的少数名人之外——/ 他们<strong>[xxx]</strong>的存在感主要来自媒体，而非人际影响——/ 即使<strong>[xxx]</strong>中最有影响力的成员，也不会与那么多人互动。/ 然而，恰恰是这些非名人的有影响力者，/ 按照两级传播理论，/ 被认为会推动社会流行，/ 通过直接影响自己的朋友和<strong>[xxx]</strong>。/ 然而，要发生社会流行，/ 每个这样受到影响的人接下来都必须影响自己的<strong>[xxx]</strong>，/ 而后者又必须影响他们认识的人，/ 如此继续；/ 到底有多少人关注这些人中的每一个，与最初的有影响力者没有多大关系。/ 比如，网络中与最初有影响力者只隔两级的人如果不接受影响，/ 这一连串变化就不会<strong>[xxx]</strong>得很远，也不会影响很多人。</p>\n</blockquote>\n<p>这一段把影响的传播范围同实际接触联系起来，并把媒体名人列作例外。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"33题","raw":"### A. the power of influence goes with social interactions\n\n> 影响力的大小与社会互动相联系。\n\n把A接回题干，它说的是：影响力的大小与社会互动相联系。\n\nA里的`social interactions`和第4段的`interact with that many others`说的都是与别人交往。我们回到这项观察，看看研究人员为什么要数这些人实际能和多少人接触。\n\n> The researchers’ argument **[xxx]** from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose **[xxx]** presence is primarily a function of media, not interpersonal, influence— even the most influential members of a **[xxx]** simply don’t interact with that many others.\n\n原句先把Oprah这类少数名人放在一边，接着说，即使最有影响力的普通成员，也没有和那么多人直接交往。\n\n这意味着，一个人虽然被称为有影响力者，他能直接影响的人仍受自己接触范围的限制。要继续向外传播，就还得由接触过他的人再影响别人。\n\nA说影响力与社会互动相联系，正好接住这点：不能跳过一个人实际与谁接触，就假定他本人已经影响了很多人。`goes with`只说二者相联系，没有说每增加一次接触就会增加固定多少影响。\n\n**原文说一个人实际交往的人不多，是不是在说明他能直接影响多少人和交往范围有关？**\n\n是。直接接触的人有限，他本人能直接传到的人也就受到限制。A保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,985,803,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"33","paragraphPids":[3]},"html":"<h3>A. the power of influence goes with social interactions</h3>\n<blockquote><p>影响力的大小与社会互动相联系。</p>\n</blockquote>\n<p>把A接回题干，它说的是：影响力的大小与社会互动相联系。</p>\n<p>A里的<code>social interactions</code>和第4段的<code>interact with that many others</code>说的都是与别人交往。我们回到这项观察，看看研究人员为什么要数这些人实际能和多少人接触。</p>\n<blockquote><p>The researchers’ argument <strong>[xxx]</strong> from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose <strong>[xxx]</strong> presence is primarily a function of media, not interpersonal, influence— even the most influential members of a <strong>[xxx]</strong> simply don’t interact with that many others.</p>\n</blockquote>\n<p>原句先把Oprah这类少数名人放在一边，接着说，即使最有影响力的普通成员，也没有和那么多人直接交往。</p>\n<p>这意味着，一个人虽然被称为有影响力者，他能直接影响的人仍受自己接触范围的限制。要继续向外传播，就还得由接触过他的人再影响别人。</p>\n<p>A说影响力与社会互动相联系，正好接住这点：不能跳过一个人实际与谁接触，就假定他本人已经影响了很多人。<code>goes with</code>只说二者相联系，没有说每增加一次接触就会增加固定多少影响。</p>\n<p><strong>原文说一个人实际交往的人不多，是不是在说明他能直接影响多少人和交往范围有关？</strong></p>\n<p>是。直接接触的人有限，他本人能直接传到的人也就受到限制。A保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"33题","raw":"### B. interpersonal links can be enhanced through the media\n\n> 人际联系可以通过媒体得到增强。\n\n把B接回题干，它说的是：人际联系可以通过媒体得到增强。\n\nB同时有`interpersonal`和`media`，原文介绍Oprah时也把这两个词放在一起。我们看连接它们的是`not`，还是“借助媒体增强人际联系”。\n\n> The researchers’ argument **[xxx]** from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose **[xxx]** presence is primarily a function of media, not interpersonal, influence— even the most influential members of a **[xxx]** simply don’t interact with that many others.\n\n原句说，Oprah这类人的影响主要来自媒体，接着用`not interpersonal`说明不能把这种影响主要归到人与人的直接交往上。\n\nB说的却是，通过媒体，人际联系得到了增强。这样一来，媒体就成了增强人际交往的办法。\n\n原句只在说明名人的影响从哪里来：大量人知道他们，主要靠媒体传播。它没有说媒体使这些人与更多人直接交往，也没有说原有的人际联系因此更强。\n\n**影响主要来自媒体、并非人际交往，能不能接成媒体增强了人际联系？**\n\n不能。原文把这两种影响分开说明，B却让媒体去增强其中的人际联系。\n\n**第一轮判断：B排除。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1046,843,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>B. interpersonal links can be enhanced through the media</h3>\n<blockquote><p>人际联系可以通过媒体得到增强。</p>\n</blockquote>\n<p>把B接回题干，它说的是：人际联系可以通过媒体得到增强。</p>\n<p>B同时有<code>interpersonal</code>和<code>media</code>，原文介绍Oprah时也把这两个词放在一起。我们看连接它们的是<code>not</code>，还是“借助媒体增强人际联系”。</p>\n<blockquote><p>The researchers’ argument <strong>[xxx]</strong> from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose <strong>[xxx]</strong> presence is primarily a function of media, not interpersonal, influence— even the most influential members of a <strong>[xxx]</strong> simply don’t interact with that many others.</p>\n</blockquote>\n<p>原句说，Oprah这类人的影响主要来自媒体，接着用<code>not interpersonal</code>说明不能把这种影响主要归到人与人的直接交往上。</p>\n<p>B说的却是，通过媒体，人际联系得到了增强。这样一来，媒体就成了增强人际交往的办法。</p>\n<p>原句只在说明名人的影响从哪里来：大量人知道他们，主要靠媒体传播。它没有说媒体使这些人与更多人直接交往，也没有说原有的人际联系因此更强。</p>\n<p><strong>影响主要来自媒体、并非人际交往，能不能接成媒体增强了人际联系？</strong></p>\n<p>不能。原文把这两种影响分开说明，B却让媒体去增强其中的人际联系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"33题","raw":"### C. influentials have more channels to reach the public\n\n> 有影响力者有更多接触公众的渠道。\n\n把C接回题干，它说的是：有影响力者有更多接触公众的渠道。\n\nC说有影响力者拥有更多`channels`去接触公众。原文谈到接触别人的地方，是先介绍少数名人的媒体影响，再说普通成员`don’t interact with that many others`。两部分要分开看。\n\n> The researchers’ argument **[xxx]** from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose **[xxx]** presence is primarily a function of media, not interpersonal, influence— even the most influential members of a **[xxx]** simply don’t interact with that many others.\n\n媒体出现在`a few celebrities like Oprah Winfrey`后面，解释的是这几位名人的影响。句子先用了`With the exception of`，已经把他们作为例外放在一边。\n\n随后对普通有影响力者的观察是，他们并没有和那么多人直接交往。这里说的是实际接触人数有限，没有列出他们比别人多哪些接触渠道。\n\n因此，前半句的媒体不能直接搬到普通有影响力者身上；后半句也只能让我们知道他们直接接触的人不多，得不到C说的“渠道更多”。\n\n**少数名人主要借助媒体受到关注，就能说明普通有影响力者也比别人多一些接触渠道吗？**\n\n不能。原文先把少数名人排作例外，对普通成员写的是直接交往有限。\n\n**第一轮判断：C排除。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1107,792,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>C. influentials have more channels to reach the public</h3>\n<blockquote><p>有影响力者有更多接触公众的渠道。</p>\n</blockquote>\n<p>把C接回题干，它说的是：有影响力者有更多接触公众的渠道。</p>\n<p>C说有影响力者拥有更多<code>channels</code>去接触公众。原文谈到接触别人的地方，是先介绍少数名人的媒体影响，再说普通成员<code>don’t interact with that many others</code>。两部分要分开看。</p>\n<blockquote><p>The researchers’ argument <strong>[xxx]</strong> from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose <strong>[xxx]</strong> presence is primarily a function of media, not interpersonal, influence— even the most influential members of a <strong>[xxx]</strong> simply don’t interact with that many others.</p>\n</blockquote>\n<p>媒体出现在<code>a few celebrities like Oprah Winfrey</code>后面，解释的是这几位名人的影响。句子先用了<code>With the exception of</code>，已经把他们作为例外放在一边。</p>\n<p>随后对普通有影响力者的观察是，他们并没有和那么多人直接交往。这里说的是实际接触人数有限，没有列出他们比别人多哪些接触渠道。</p>\n<p>因此，前半句的媒体不能直接搬到普通有影响力者身上；后半句也只能让我们知道他们直接接触的人不多，得不到C说的“渠道更多”。</p>\n<p><strong>少数名人主要借助媒体受到关注，就能说明普通有影响力者也比别人多一些接触渠道吗？</strong></p>\n<p>不能。原文先把少数名人排作例外，对普通成员写的是直接交往有限。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"33题","raw":"### D. most celebrities enjoy wide media attention\n\n> 大多数名人受到广泛的媒体关注。\n\n把D接回题干，它说的是：大多数名人受到广泛的媒体关注。\n\nD中的`celebrities`和`media`都能在Oprah那一段找到。我们看清前面的`a few`，以及后面真正落在`even the most influential members`上的观察。\n\n> The researchers’ argument **[xxx]** from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose **[xxx]** presence is primarily a function of media, not interpersonal, influence— even the most influential members of a **[xxx]** simply don’t interact with that many others.\n\n原文举的是`a few celebrities`，即少数名人。介绍他们是为了说明一个例外：这些人的影响主要来自媒体。然后句子才说普通有影响力者实际交往的人有限。\n\nD说的是`most celebrities`，大多数名人，还把内容写成他们受到广泛媒体关注。少数名人的例子，不能让我们知道大多数名人受到多少关注。\n\n而且，题干问研究人员的观察说明什么。这里研究人员用来说明人际影响受限的，是后半句关于普通成员的交往，D没有说到这一部分。\n\n**这段举了少数名人的例外，是否就能得出大多数名人都受到广泛媒体关注？**\n\n不能。原文没有把少数例子扩展到大多数，真正接着讨论的又是普通成员的交往范围。\n\n**第一轮判断：D排除。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1168,683,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>D. most celebrities enjoy wide media attention</h3>\n<blockquote><p>大多数名人受到广泛的媒体关注。</p>\n</blockquote>\n<p>把D接回题干，它说的是：大多数名人受到广泛的媒体关注。</p>\n<p>D中的<code>celebrities</code>和<code>media</code>都能在Oprah那一段找到。我们看清前面的<code>a few</code>，以及后面真正落在<code>even the most influential members</code>上的观察。</p>\n<blockquote><p>The researchers’ argument <strong>[xxx]</strong> from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey—whose <strong>[xxx]</strong> presence is primarily a function of media, not interpersonal, influence— even the most influential members of a <strong>[xxx]</strong> simply don’t interact with that many others.</p>\n</blockquote>\n<p>原文举的是<code>a few celebrities</code>，即少数名人。介绍他们是为了说明一个例外：这些人的影响主要来自媒体。然后句子才说普通有影响力者实际交往的人有限。</p>\n<p>D说的是<code>most celebrities</code>，大多数名人，还把内容写成他们受到广泛媒体关注。少数名人的例子，不能让我们知道大多数名人受到多少关注。</p>\n<p>而且，题干问研究人员的观察说明什么。这里研究人员用来说明人际影响受限的，是后半句关于普通成员的交往，D没有说到这一部分。</p>\n<p><strong>这段举了少数名人的例外，是否就能得出大多数名人都受到广泛媒体关注？</strong></p>\n<p>不能。原文没有把少数例子扩展到大多数，真正接着讨论的又是普通成员的交往范围。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"33题","raw":"### 33题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。","articleRects":[],"questionRects":[[226,924,872,37],[280,985,803,37],[280,1046,843,38],[280,1107,792,38],[280,1168,683,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"33"},"html":"<h3>33题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n"},{"section":"34题","raw":"## 34题\n\n> The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.  \n> 第四段these people指的是哪些人？\n\nthese people位于第四段传播链的后半段。这一段已经读过，直接沿each person—who—theirs往前接。\n\n`these people`前面先有`each person so affected`，再有`who must in turn influence theirs`。我们沿这几处往前接，看哪些人先受影响、又把影响传给了谁。\n\n接下来按A—D逐项看。","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[226,1289,1195,39],[280,1413,685,37],[280,1474,728,30],[280,1535,631,30],[280,1596,611,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"34","initialReadingPids":[]},"html":"<h2>34题</h2>\n<blockquote><p>The underlined phrase “these people” in Paragraph 4 refers to the ones who ______.<br />\n第四段these people指的是哪些人？</p>\n</blockquote>\n<p>these people位于第四段传播链的后半段。这一段已经读过，直接沿each person—who—theirs往前接。</p>\n<p><code>these people</code>前面先有<code>each person so affected</code>，再有<code>who must in turn influence theirs</code>。我们沿这几处往前接，看哪些人先受影响、又把影响传给了谁。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"34题","raw":"### A. stay outside the network of social influence\n\n> 这些人处在社会影响网络之外。\n\n把A接回题干，它说的是：这些人处在社会影响网络之外。\n\nA说这些人在网络`outside`，也就是外面。`these people`前面却连着`each person so affected`和`must then influence`，我们沿这两个动作看他们有没有参加传播。\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own **[xxx]**, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n\n`each person so affected`先说这个人已经受到影响，`must then influence`接着说他还要去影响别人。后面的`who must in turn influence theirs`又让下一层的人把影响传下去。\n\n所以，这些人已经接到了上一层传来的东西，还继续传给下一层。这样的接收和传递就在这张网络里面发生。\n\nA把他们说成处在网络之外，和句中这些动作接不上。传到后来的一层，并不等于已经离开这张网络。\n\n**已经接到影响、又继续把影响传给别人的人，是在这张网络外面吗？**\n\n不是。他们就在网络中继续传递，A的`outside`对不上。\n\n**第一轮判断：A排除。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1413,685,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"34","paragraphPids":[3]},"html":"<h3>A. stay outside the network of social influence</h3>\n<blockquote><p>这些人处在社会影响网络之外。</p>\n</blockquote>\n<p>把A接回题干，它说的是：这些人处在社会影响网络之外。</p>\n<p>A说这些人在网络<code>outside</code>，也就是外面。<code>these people</code>前面却连着<code>each person so affected</code>和<code>must then influence</code>，我们沿这两个动作看他们有没有参加传播。</p>\n<blockquote><p>For a social epidemic to occur, however, each person so affected must then influence his or her own <strong>[xxx]</strong>, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p><code>each person so affected</code>先说这个人已经受到影响，<code>must then influence</code>接着说他还要去影响别人。后面的<code>who must in turn influence theirs</code>又让下一层的人把影响传下去。</p>\n<p>所以，这些人已经接到了上一层传来的东西，还继续传给下一层。这样的接收和传递就在这张网络里面发生。</p>\n<p>A把他们说成处在网络之外，和句中这些动作接不上。传到后来的一层，并不等于已经离开这张网络。</p>\n<p><strong>已经接到影响、又继续把影响传给别人的人，是在这张网络外面吗？</strong></p>\n<p>不是。他们就在网络中继续传递，A的<code>outside</code>对不上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"34题","raw":"### B. have little contact with the source of influence\n\n> 这些人与最初的影响源接触很少。\n\n把B接回题干，它说的是：这些人与最初的影响源接触很少。\n\nB里的`little contact`很容易让我们想到句末的`has little to do with the initial influential`。我们把`has`前面的主语完整读出来，看它到底说什么与最初那个人关系不大。\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own **[xxx]**, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n\n主语是`just how many others pay attention to each of these people`，即每个后续传播者能让多少其他人来关注。和最初影响者关系不大的是这个人数。\n\nB说的则是，这些人与最初影响者接触得少。它把“后面能吸引多少人的关注”换成了“两个人之间接触多少”。\n\n原句没有说他们见面少、联系少。即使他们能吸引多少人不由起点那个人决定，也还不知道他们平时和起点那个人接触多少。\n\n**句末说与最初影响者关系不大的，是后续关注的人数，还是这些人与他接触的次数？**\n\n是后续关注的人数。B把它读成了接触少，原句没有这样说。\n\n**第一轮判断：B排除。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1474,728,30]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"34","paragraphPids":[3]},"html":"<h3>B. have little contact with the source of influence</h3>\n<blockquote><p>这些人与最初的影响源接触很少。</p>\n</blockquote>\n<p>把B接回题干，它说的是：这些人与最初的影响源接触很少。</p>\n<p>B里的<code>little contact</code>很容易让我们想到句末的<code>has little to do with the initial influential</code>。我们把<code>has</code>前面的主语完整读出来，看它到底说什么与最初那个人关系不大。</p>\n<blockquote><p>For a social epidemic to occur, however, each person so affected must then influence his or her own <strong>[xxx]</strong>, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p>主语是<code>just how many others pay attention to each of these people</code>，即每个后续传播者能让多少其他人来关注。和最初影响者关系不大的是这个人数。</p>\n<p>B说的则是，这些人与最初影响者接触得少。它把“后面能吸引多少人的关注”换成了“两个人之间接触多少”。</p>\n<p>原句没有说他们见面少、联系少。即使他们能吸引多少人不由起点那个人决定，也还不知道他们平时和起点那个人接触多少。</p>\n<p><strong>句末说与最初影响者关系不大的，是后续关注的人数，还是这些人与他接触的次数？</strong></p>\n<p>是后续关注的人数。B把它读成了接触少，原句没有这样说。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"34题","raw":"### C. are influenced and then influence others\n\n> 这些人受到影响，然后又影响别人。\n\n把C接回题干，它说的是：这些人受到影响，然后又影响别人。\n\nC先说`are influenced`，再说`influence others`。我们在`these people`前面也刚读到`so affected`和`must then influence`，把这两个先后动作接起来看。\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own **[xxx]**, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n\n`each person so affected`里的`so affected`，说这个人先受到前面传来的影响。紧接着`must then influence his or her own [xxx]`，说他还要继续影响自己身边的一些人。\n\n后面的`who must in turn influence theirs`继续往后接：新受到影响的人又影响他们那一边的人。`and so on`表示这个过程还会继续。\n\n`these people`接在这串人之后，正指这些先接收影响、再传递影响的人。C的两个动作都写出来了，也没有把人限定在最初那个人身边的一层。\n\n**C说的先受到影响、然后再影响别人，能不能接住前面一层层出现的这些人？**\n\n能。每往后一层，重复的都是这两个动作，C保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1535,631,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"34","paragraphPids":[3]},"html":"<h3>C. are influenced and then influence others</h3>\n<blockquote><p>这些人受到影响，然后又影响别人。</p>\n</blockquote>\n<p>把C接回题干，它说的是：这些人受到影响，然后又影响别人。</p>\n<p>C先说<code>are influenced</code>，再说<code>influence others</code>。我们在<code>these people</code>前面也刚读到<code>so affected</code>和<code>must then influence</code>，把这两个先后动作接起来看。</p>\n<blockquote><p>For a social epidemic to occur, however, each person so affected must then influence his or her own <strong>[xxx]</strong>, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p><code>each person so affected</code>里的<code>so affected</code>，说这个人先受到前面传来的影响。紧接着<code>must then influence his or her own [xxx]</code>，说他还要继续影响自己身边的一些人。</p>\n<p>后面的<code>who must in turn influence theirs</code>继续往后接：新受到影响的人又影响他们那一边的人。<code>and so on</code>表示这个过程还会继续。</p>\n<p><code>these people</code>接在这串人之后，正指这些先接收影响、再传递影响的人。C的两个动作都写出来了，也没有把人限定在最初那个人身边的一层。</p>\n<p><strong>C说的先受到影响、然后再影响别人，能不能接住前面一层层出现的这些人？</strong></p>\n<p>能。每往后一层，重复的都是这两个动作，C保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"34题","raw":"### D. are influenced by the initial influential\n\n> 这些人受到最初有影响力者的影响。\n\n把D接回题干，它说的是：这些人受到最初有影响力者的影响。\n\nD提到`the initial influential`，原句末尾也有这个人。我们先往前读`who must in turn influence theirs, and so on`，看`these people`是否只靠这个起点就能说清。\n\n> For a social epidemic to occur, however, each person so affected must then influence his or her own **[xxx]**, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.\n\n句子先写一个人受到影响，再让他去影响自己那一边的人；下一批人又影响他们那一边的人。越往后，直接把影响传过来的那个人也在变化。\n\nD只说受到最初影响者的影响，没有写这些人接过影响以后继续做什么。我们当然可以往前追到最初的传播起点，但`these people`前面特意反复写出的，是每个人接收后还要传下去。\n\n所以，D没有像C那样把这串人的两个动作接全。C既接住`so affected`，也接住`must then influence`，和紧前面的句子更完整地对应。\n\n**只说受到最初那个人的影响，是否已经把前面每一层人做的两件事都说出来了？**\n\n没有。它还没说这些人继续影响别人；C把接收和再传播两件事都说出来了。\n\n**第一轮判断：D排除。**","articleRects":[[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38]],"questionRects":[[280,1596,611,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"34","paragraphPids":[3]},"html":"<h3>D. are influenced by the initial influential</h3>\n<blockquote><p>这些人受到最初有影响力者的影响。</p>\n</blockquote>\n<p>把D接回题干，它说的是：这些人受到最初有影响力者的影响。</p>\n<p>D提到<code>the initial influential</code>，原句末尾也有这个人。我们先往前读<code>who must in turn influence theirs, and so on</code>，看<code>these people</code>是否只靠这个起点就能说清。</p>\n<blockquote><p>For a social epidemic to occur, however, each person so affected must then influence his or her own <strong>[xxx]</strong>, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.</p>\n</blockquote>\n<p>句子先写一个人受到影响，再让他去影响自己那一边的人；下一批人又影响他们那一边的人。越往后，直接把影响传过来的那个人也在变化。</p>\n<p>D只说受到最初影响者的影响，没有写这些人接过影响以后继续做什么。我们当然可以往前追到最初的传播起点，但<code>these people</code>前面特意反复写出的，是每个人接收后还要传下去。</p>\n<p>所以，D没有像C那样把这串人的两个动作接全。C既接住<code>so affected</code>，也接住<code>must then influence</code>，和紧前面的句子更完整地对应。</p>\n<p><strong>只说受到最初那个人的影响，是否已经把前面每一层人做的两件事都说出来了？</strong></p>\n<p>没有。它还没说这些人继续影响别人；C把接收和再传播两件事都说出来了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。","articleRects":[],"questionRects":[[226,1289,1195,39],[280,1413,685,37],[280,1474,728,30],[280,1535,631,30],[280,1596,611,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"34"},"html":"<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n"},{"section":"35题","raw":"## 35题\n\n> What is the essential element in the dynamics of social influence?  \n> 社会影响动态过程中的关键要素是什么？\n\nessential element对应末段principal requirement。把计算机研究的方法和研究得到的条件分开。\n\n> 原文参考：\n> \n> Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer **[xxx]** of populations, **[xxx]** a number of **[xxx]** relating to people’s ability to influence others and their tendency to be influenced. They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n> \n> 开始精读：\n> \n> Building on this basic truth about interpersonal influence, / the researchers studied the dynamics of social influence by conducting thousands of computer **[xxx]** of populations, / **[xxx]** a number of **[xxx]** relating to people’s ability to influence others and their tendency to be influenced. / They found that the principal requirement for what is called “global cascades” / —the widespread propagation of influence through networks— / is the presence not of a few influentials / but, rather, of a critical mass of easily influenced people.\n> \n> 以这一关于人际影响的基本事实为基础，/ 研究人员通过开展数千次群体的计算机**[xxx]**，研究社会影响的动态过程，/ **[xxx]**若干**[xxx]**，它们涉及人们影响别人的能力及受别人影响的倾向。/ 他们发现，所谓“全局连锁反应”的首要条件——/ 即影响通过网络广泛传播——/ 不是存在几个有影响力者，/ 而是存在足够多容易受影响的人。\n\n题目问什么条件让影响大范围扩散，答案应接在not...but rather...之后。\n\n接下来按A—D逐项看。","articleRects":[[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[[226,1718,1026,38],[280,1780,484,37],[280,1841,517,37],[280,1902,502,30],[280,1963,530,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"35","initialReadingPids":[4]},"html":"<h2>35题</h2>\n<blockquote><p>What is the essential element in the dynamics of social influence?<br />\n社会影响动态过程中的关键要素是什么？</p>\n</blockquote>\n<p>essential element对应末段principal requirement。把计算机研究的方法和研究得到的条件分开。</p>\n<blockquote><p>原文参考：</p>\n<p>Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer <strong>[xxx]</strong> of populations, <strong>[xxx]</strong> a number of <strong>[xxx]</strong> relating to people’s ability to influence others and their tendency to be influenced. They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n<p>开始精读：</p>\n<p>Building on this basic truth about interpersonal influence, / the researchers studied the dynamics of social influence by conducting thousands of computer <strong>[xxx]</strong> of populations, / <strong>[xxx]</strong> a number of <strong>[xxx]</strong> relating to people’s ability to influence others and their tendency to be influenced. / They found that the principal requirement for what is called “global cascades” / —the widespread propagation of influence through networks— / is the presence not of a few influentials / but, rather, of a critical mass of easily influenced people.</p>\n<p>以这一关于人际影响的基本事实为基础，/ 研究人员通过开展数千次群体的计算机<strong>[xxx]</strong>，研究社会影响的动态过程，/ <strong>[xxx]</strong>若干<strong>[xxx]</strong>，它们涉及人们影响别人的能力及受别人影响的倾向。/ 他们发现，所谓“全局连锁反应”的首要条件——/ 即影响通过网络广泛传播——/ 不是存在几个有影响力者，/ 而是存在足够多容易受影响的人。</p>\n</blockquote>\n<p>题目问什么条件让影响大范围扩散，答案应接在not...but rather...之后。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"35题","raw":"### A. The eagerness to be accepted.\n\n> 关键在于渴望被别人接受。\n\n把A接回题干，它说的是：关键在于渴望被别人接受。\n\nA说`be accepted`，即自己被别人接纳。末句则是`easily influenced people`，即容易受别人影响的人。我们看这两处的“自己”和“别人”各在做什么。\n\n> They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n\n原文说，传播广泛发生需要有足够多容易受影响的人。也就是别人传来某种观念或做法，他们容易接受，随后传播才继续下去。\n\nA说渴望被别人接受，期待的是别人认可、接纳自己。一个是自己接受别人传来的影响，一个是希望别人接纳自己。\n\n末句没有说这些人是为了得到群体认可才接受影响。把后一种愿望加进去，就把研究指出的接受影响，换成了寻找他人接纳。\n\n**自己容易接受别人的影响，与希望别人接纳自己，是否说的是同一件事？**\n\n不是。前一句是自己受到影响，A说的是别人接纳自己。\n\n**第一轮判断：A排除。**","articleRects":[[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[[280,1780,484,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"35","paragraphPids":[4]},"html":"<h3>A. The eagerness to be accepted.</h3>\n<blockquote><p>关键在于渴望被别人接受。</p>\n</blockquote>\n<p>把A接回题干，它说的是：关键在于渴望被别人接受。</p>\n<p>A说<code>be accepted</code>，即自己被别人接纳。末句则是<code>easily influenced people</code>，即容易受别人影响的人。我们看这两处的“自己”和“别人”各在做什么。</p>\n<blockquote><p>They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<p>原文说，传播广泛发生需要有足够多容易受影响的人。也就是别人传来某种观念或做法，他们容易接受，随后传播才继续下去。</p>\n<p>A说渴望被别人接受，期待的是别人认可、接纳自己。一个是自己接受别人传来的影响，一个是希望别人接纳自己。</p>\n<p>末句没有说这些人是为了得到群体认可才接受影响。把后一种愿望加进去，就把研究指出的接受影响，换成了寻找他人接纳。</p>\n<p><strong>自己容易接受别人的影响，与希望别人接纳自己，是否说的是同一件事？</strong></p>\n<p>不是。前一句是自己受到影响，A说的是别人接纳自己。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"35题","raw":"### B. The impulse to influence others.\n\n> 关键在于主动影响他人的冲动。\n\n把B接回题干，它说的是：关键在于主动影响他人的冲动。\n\nB里的`influence others`在研究方法那句也出现了，原文说研究者考察`ability to influence others`。但题干问关键要素，我们还要接着看`They found`之后究竟选出了什么。\n\n> people’s ability to influence others and their tendency to be influenced.\n\n> is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n\n研究者先考察两件事：人影响别人的能力，以及人受到影响的倾向。句中的`and`把两件事并列列出来，表示它们都被研究了。\n\n后面才报告发现：首要条件不在少数有影响力者，而在足够多容易受影响的人。这里被点出来的是愿意接受影响的那些人。\n\nB写的`impulse to influence others`，则是想主动去影响别人的冲动。前面考察过影响别人的能力，不等于后面就把这种冲动选成了关键条件。\n\n**研究里考察过影响别人的能力，最后的发现就把主动影响别人的冲动选作关键了吗？**\n\n没有。最后明确点出的是容易受到影响的人，B把方向换成主动影响别人了。\n\n**第一轮判断：B排除。**","articleRects":[[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[[280,1841,517,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"35","paragraphPids":[4]},"html":"<h3>B. The impulse to influence others.</h3>\n<blockquote><p>关键在于主动影响他人的冲动。</p>\n</blockquote>\n<p>把B接回题干，它说的是：关键在于主动影响他人的冲动。</p>\n<p>B里的<code>influence others</code>在研究方法那句也出现了，原文说研究者考察<code>ability to influence others</code>。但题干问关键要素，我们还要接着看<code>They found</code>之后究竟选出了什么。</p>\n<blockquote><p>people’s ability to influence others and their tendency to be influenced.</p>\n</blockquote>\n<blockquote><p>is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<p>研究者先考察两件事：人影响别人的能力，以及人受到影响的倾向。句中的<code>and</code>把两件事并列列出来，表示它们都被研究了。</p>\n<p>后面才报告发现：首要条件不在少数有影响力者，而在足够多容易受影响的人。这里被点出来的是愿意接受影响的那些人。</p>\n<p>B写的<code>impulse to influence others</code>，则是想主动去影响别人的冲动。前面考察过影响别人的能力，不等于后面就把这种冲动选成了关键条件。</p>\n<p><strong>研究里考察过影响别人的能力，最后的发现就把主动影响别人的冲动选作关键了吗？</strong></p>\n<p>没有。最后明确点出的是容易受到影响的人，B把方向换成主动影响别人了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"35题","raw":"### C. The readiness to be influenced.\n\n> 关键在于愿意受到影响。\n\n把C接回题干，它说的是：关键在于愿意受到影响。\n\nC中的`to be influenced`是受到影响，末句的`easily influenced people`也说这些人容易受到影响。我们回到`principal requirement`后面，确认研究选出的是什么人。\n\n> They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n\n`principal requirement`就是题干问的关键条件。原文用`not ... but, rather ...`写得很明确：关键在足够多容易受到影响的人。\n\nC说`readiness to be influenced`，就是愿意或容易接受别人的影响。它和`easily influenced`都让这些人处在接受影响的一边。\n\n原文另外还有`a critical mass`，要求这样的人足够多。C说的是这群人有什么共同倾向，仍是接受影响，并没有把它换成主动去影响别人或依赖别人。\n\n**C中的`to be influenced`，和原文`easily influenced people`说的是同一个受到影响的方向吗？**\n\n是。都是这些人接受别人传来的影响，C保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[[280,1902,502,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"35","paragraphPids":[4]},"html":"<h3>C. The readiness to be influenced.</h3>\n<blockquote><p>关键在于愿意受到影响。</p>\n</blockquote>\n<p>把C接回题干，它说的是：关键在于愿意受到影响。</p>\n<p>C中的<code>to be influenced</code>是受到影响，末句的<code>easily influenced people</code>也说这些人容易受到影响。我们回到<code>principal requirement</code>后面，确认研究选出的是什么人。</p>\n<blockquote><p>They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<p><code>principal requirement</code>就是题干问的关键条件。原文用<code>not ... but, rather ...</code>写得很明确：关键在足够多容易受到影响的人。</p>\n<p>C说<code>readiness to be influenced</code>，就是愿意或容易接受别人的影响。它和<code>easily influenced</code>都让这些人处在接受影响的一边。</p>\n<p>原文另外还有<code>a critical mass</code>，要求这样的人足够多。C说的是这群人有什么共同倾向，仍是接受影响，并没有把它换成主动去影响别人或依赖别人。</p>\n<p><strong>C中的<code>to be influenced</code>，和原文<code>easily influenced people</code>说的是同一个受到影响的方向吗？</strong></p>\n<p>是。都是这些人接受别人传来的影响，C保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"35题","raw":"### D. The **[xxx]** to rely on others.\n\n> 关键在于依赖他人的**[xxx]**。\n\n把D接回题干，它说的是：关键在于依赖他人的**[xxx]**。\n\nD里能读懂的`rely on others`是依靠别人。末句也说人与人之间的影响，我们把它的`easily influenced people`拿来，看看依靠别人和受到影响是否一样。\n\n> They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.\n\n原文需要的是容易受影响的人：别人传来的观念或做法能被他们接受，传播便有机会继续。\n\nD说依靠别人，意思是做某件事时要以别人为依靠。受到别人的某次影响，还没有告诉我们这个人做事要靠别人。\n\nD前面的**[xxx]**还不认识，但后面`to rely on others`已经说出它要谈哪件事。研究结论点出的是接受影响，没有说传播必须依靠一群要靠别人做事的人。\n\n**一个人接受了别人传来的观念，是否就等于他要依靠别人？**\n\n不等于。原文说的是容易接受影响，D说的依靠关系没有接上。\n\n**第一轮判断：D排除。**","articleRects":[[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[[280,1963,530,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"35","paragraphPids":[4]},"html":"<h3>D. The <strong>[xxx]</strong> to rely on others.</h3>\n<blockquote><p>关键在于依赖他人的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把D接回题干，它说的是：关键在于依赖他人的<strong>[xxx]</strong>。</p>\n<p>D里能读懂的<code>rely on others</code>是依靠别人。末句也说人与人之间的影响，我们把它的<code>easily influenced people</code>拿来，看看依靠别人和受到影响是否一样。</p>\n<blockquote><p>They found that the principal requirement for what is called “global cascades” —the widespread propagation of influence through networks—is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.</p>\n</blockquote>\n<p>原文需要的是容易受影响的人：别人传来的观念或做法能被他们接受，传播便有机会继续。</p>\n<p>D说依靠别人，意思是做某件事时要以别人为依靠。受到别人的某次影响，还没有告诉我们这个人做事要靠别人。</p>\n<p>D前面的<strong>[xxx]</strong>还不认识，但后面<code>to rely on others</code>已经说出它要谈哪件事。研究结论点出的是接受影响，没有说传播必须依靠一群要靠别人做事的人。</p>\n<p><strong>一个人接受了别人传来的观念，是否就等于他要依靠别人？</strong></p>\n<p>不等于。原文说的是容易接受影响，D说的依靠关系没有接上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"35题","raw":"### 35题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。","articleRects":[],"questionRects":[[226,1718,1026,38],[280,1780,484,37],[280,1841,517,37],[280,1902,502,30],[280,1963,530,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"35"},"html":"<h3>35题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | driven in large part；but it doesn’t explain | 书中把流行归给极少数特殊人物，作者追问它能否解释实际传播。 | 提出一种解释，并留下需要检验的问题。 |\n| 第2段 | largely untested theory；seems to explain | 两级传播把媒体、特殊人物与其他人接起来，理论给出的营销设想是借少数人完成传播。 | 说明这一解释为什么容易令人接受，同时保留检验不足的问题。 |\n| 第3段 | far less impact；don’t seem to be required at all | 研究发现特殊人物的作用远小于通常想象，甚至并非必需。 | 将开头的疑问推进为与旧解释不同的发现。 |\n| 第4段 | don’t interact with that many others；two degrees removed | 普通人的直接交往有限，传播必须逐层继续，后面的人不接受就传不远。 | 从接力过程解释为何起点人物不能单独决定大范围传播。 |\n| 第5段 | not of a few influentials；a critical mass of easily influenced people | 研究把关键放在足够多容易受影响的人上。 | 给出替代少数人物决定论的主要条件。 |\n\n**全文的主要意思：大范围传播不能只靠少数特殊人物来解释；传播能否逐层继续，更取决于有足够多的人愿意接受影响。**\n\n人物特征只在开头用于说明那套解释所说的“特殊人物”是谁。后面实际检验的是他们在传播中的作用，并把判断推进到后续人群的接受性。","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37],[274,537,1122,38],[202,580,1185,39],[202,625,1194,38],[202,670,1194,37],[202,714,1194,38],[202,758,1195,38],[202,802,1195,38],[202,847,1189,37],[202,891,1184,38],[202,935,1194,38],[202,979,351,38],[274,1024,1122,37],[202,1068,1194,38],[203,1112,833,38],[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38],[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>driven in large part；but it doesn’t explain</td><td>书中把流行归给极少数特殊人物，作者追问它能否解释实际传播。</td><td>提出一种解释，并留下需要检验的问题。</td></tr><tr><td>第2段</td><td>largely untested theory；seems to explain</td><td>两级传播把媒体、特殊人物与其他人接起来，理论给出的营销设想是借少数人完成传播。</td><td>说明这一解释为什么容易令人接受，同时保留检验不足的问题。</td></tr><tr><td>第3段</td><td>far less impact；don’t seem to be required at all</td><td>研究发现特殊人物的作用远小于通常想象，甚至并非必需。</td><td>将开头的疑问推进为与旧解释不同的发现。</td></tr><tr><td>第4段</td><td>don’t interact with that many others；two degrees removed</td><td>普通人的直接交往有限，传播必须逐层继续，后面的人不接受就传不远。</td><td>从接力过程解释为何起点人物不能单独决定大范围传播。</td></tr><tr><td>第5段</td><td>not of a few influentials；a critical mass of easily influenced people</td><td>研究把关键放在足够多容易受影响的人上。</td><td>给出替代少数人物决定论的主要条件。</td></tr></tbody></table>\n<p><strong>全文的主要意思：大范围传播不能只靠少数特殊人物来解释；传播能否逐层继续，更取决于有足够多的人愿意接受影响。</strong></p>\n<p>人物特征只在开头用于说明那套解释所说的“特殊人物”是谁。后面实际检验的是他们在传播中的作用，并把判断推进到后续人群的接受性。</p>\n"},{"section":"进阶回查","raw":"## 回查31题：B还是D？\n\n第一遍留下：\n\n- B. discuss influentials’ function in spreading ideas\n- D. describe the essential characteristics of influentials\n\nB接回题干：作者引用《引爆点》，是想讨论有影响力者在传播观念中的作用。\n\nD接回题干：作者引用《引爆点》，是想描述这些人的基本特征。\n\n第一段里确实有`informed, persuasive, or well connected`，所以D没有被马上排除。但末句又说这个想法解释不了观念怎样传播。现在看完后面，我们回来找作者接着回答的是哪件事。\n\n第3段写的是：\n\n> influentials have far less impact on social epidemics than is generally supposed\n>\n> they don’t seem to be required at all\n\n这两句都在看他们起多大作用：影响比一般人以为的小，甚至似乎没有他们也行。这里没有继续介绍他们知道多少、怎样有说服力或人脉多广。\n\n第4段又说：\n\n> even the most influential members of a **[xxx]** simply don’t interact with that many others\n>\n> each person so affected must then influence his or her own **[xxx]**, who must in turn influence theirs, and so on\n\n这些人自己接触不了那么多人，后面的传播还得靠其他人一层层继续。这样读，我们能看出作者在回答：即使起点是一个有影响力者，他本人到底能把观念传多远，后面又要靠谁。\n\n最后一段明确写：\n\n> not of a few influentials but, rather, of a critical mass of easily influenced people\n\n真正被研究找出的条件，落在足够多容易受影响的人身上。文章一直从“少数特殊人物能推动传播吗”往下问，最后回答传播还需要哪些人。\n\n**后面这些研究是在继续描述有影响力者的特征，还是在检查他们对传播到底起多大作用？**\n\n是在检查他们的作用。这样就能接回第一段的`but it doesn’t explain how ideas actually spread`：引用书里的解释以后，作者一直在追问并回答传播怎样发生。开头列出特征，是先让我们知道这本书所说的是哪类人。\n\n> **31题选B。**\n","articleRects":[[274,315,1122,38],[202,358,1194,40],[203,404,1194,38],[203,448,1193,38],[202,493,314,37],[274,1024,1122,37],[202,1068,1194,38],[203,1112,833,38],[274,1156,1120,38],[202,1200,1194,38],[202,1245,1195,37],[202,1289,1194,38],[203,1333,1193,38],[202,1377,1194,38],[202,1422,1189,37],[202,1466,1194,38],[202,1510,1194,38],[202,1554,1194,40],[202,1599,1195,38],[202,1643,1184,38],[274,1687,1122,38],[203,1732,1194,37],[203,1776,1193,38],[202,1820,1194,38],[202,1863,1194,39],[202,1909,1194,37],[202,1953,1093,38]],"questionRects":[[226,190,937,38],[1172,222,111,7],[280,251,711,38],[280,312,736,38],[280,373,878,38],[280,434,784,31]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","D"],"newEvidencePids":[3,4,5],"finalChoice":"B","qid":"31","paragraphPids":[0,1,2,3,4]},"html":"<h2>回查31题：B还是D？</h2>\n<p>第一遍留下：</p>\n<ul><li>B. discuss influentials’ function in spreading ideas</li><li>D. describe the essential characteristics of influentials</li></ul>\n<p>B接回题干：作者引用《引爆点》，是想讨论有影响力者在传播观念中的作用。</p>\n<p>D接回题干：作者引用《引爆点》，是想描述这些人的基本特征。</p>\n<p>第一段里确实有<code>informed, persuasive, or well connected</code>，所以D没有被马上排除。但末句又说这个想法解释不了观念怎样传播。现在看完后面，我们回来找作者接着回答的是哪件事。</p>\n<p>第3段写的是：</p>\n<blockquote><p>influentials have far less impact on social epidemics than is generally supposed</p>\n<p>they don’t seem to be required at all</p>\n</blockquote>\n<p>这两句都在看他们起多大作用：影响比一般人以为的小，甚至似乎没有他们也行。这里没有继续介绍他们知道多少、怎样有说服力或人脉多广。</p>\n<p>第4段又说：</p>\n<blockquote><p>even the most influential members of a <strong>[xxx]</strong> simply don’t interact with that many others</p>\n<p>each person so affected must then influence his or her own <strong>[xxx]</strong>, who must in turn influence theirs, and so on</p>\n</blockquote>\n<p>这些人自己接触不了那么多人，后面的传播还得靠其他人一层层继续。这样读，我们能看出作者在回答：即使起点是一个有影响力者，他本人到底能把观念传多远，后面又要靠谁。</p>\n<p>最后一段明确写：</p>\n<blockquote><p>not of a few influentials but, rather, of a critical mass of easily influenced people</p>\n</blockquote>\n<p>真正被研究找出的条件，落在足够多容易受影响的人身上。文章一直从“少数特殊人物能推动传播吗”往下问，最后回答传播还需要哪些人。</p>\n<p><strong>后面这些研究是在继续描述有影响力者的特征，还是在检查他们对传播到底起多大作用？</strong></p>\n<p>是在检查他们的作用。这样就能接回第一段的<code>but it doesn’t explain how ideas actually spread</code>：引用书里的解释以后，作者一直在追问并回答传播怎样发生。开头列出特征，是先让我们知道这本书所说的是哪类人。</p>\n<blockquote><p><strong>31题选B。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**31. B**\n\n**32. D**\n\n**33. A**\n\n**34. C**\n\n**35. C**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>31. B</strong></p>\n<p><strong>32. D</strong></p>\n<p><strong>33. A</strong></p>\n<p><strong>34. C</stro
