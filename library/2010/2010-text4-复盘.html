const NEWTYPE = {"status":"ready","smallTitle":"<h2>小标题题</h2>\n<h3>题目</h3>\n<p>Read the following text and choose the most suitable heading from the list A–G for each part (41–45). There are two extra headings.</p>\n<p>[A] Political Pressure Forces Concessions from Rule-Makers</p>\n<p>[B] Banks, Not Market Prices, Remain the Central Problem</p>\n<p>[C] Accounting Disclosure Must Stay Separate from Bank Regulation</p>\n<p>[D] Lobbying Against Fair-Value Rules Threatens Independent Standards</p>\n<p>[E] Strong Standard-Setters Are Necessary for Recovery</p>\n<p>[F] One Official Valuation Can End Financial Uncertainty</p>\n<p>[G] Bank Managers Should Determine Asset Prices Alone</p>\n\n<section class=\"newtype-qblock\" data-q=\"41\"><h3>41. __________</h3>\n<p>IN PUBLIC, bankers have been blaming themselves for their troubles. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch. Unfortunately, banks’ lobbying now seems to be working. The details may be arcane, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n</section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. __________</h3>\n<p>On April 2nd, after a bruising encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognising losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, decried those who “impugn our motives”. Yet bank shares rose and the changes enhance what one lobbying group politely calls “the use of judgment by management”.</p>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to be “piecemeal”, but the pressure to fold when it completes its overhaul of rules later this year is strong. On April 1st Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political vacuum” but “in the real world” and that Europe could yet develop different rules.</p>\n</section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. __________</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are sceptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. __________</h3>\n<p>To get the system working again, losses must be recognised and dealt with. Japan’s procrastination prolonged its crisis. America’s new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by appeasing critics now they are inviting pressure to make more concessions.</p>\n</section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. __________</h3>\n<p>Standard-setters should defuse the argument by making clear that their job is not to regulate banks but to force them to reveal information. The banks, their capital-adequacy regulators and politicians seem to dream of a single, grown-up version of the truth, which enhances financial stability. Investors and accountants, however, think all valuations are subjective, doubt managers’ motives and judge that market prices are the least-bad option. They are right. A bank’s solvency is a matter of judgment for its regulators and for investors, not whatever a piece of paper signed by its auditors says it is. Accounts can inform that decision, but not make it.</p>\n<p>Banks’ regulators have to take responsibility. If they want to remove the mechanical link between drops in market prices and capital shortfalls at banks, they should take the accounts that standard-setters create for investors and adjust them when they calculate capital. They already do this to some degree. But the banks’ campaign to change the rules is making inevitable a split between two sets of accounts, one for regulators and another for investors. The FASB and IASB can help regulators to create whatever balance-sheet they want. But in doing so they must not compromise their duty to investors.</p>\n</section>","sorting":"<h2>排序题</h2>\n<h3>题目</h3>\n<p>Arrange paragraphs A–H in the correct order to form a coherent text. Paragraphs A, E and H have been correctly placed. Fill the five blanks (41–45) with the remaining paragraph letters.</p>\n<p><strong>A → 41. ____ → 42. ____ → 43. ____ → E → 44. ____ → 45. ____ → H</strong></p>\n\n<section class=\"newtype-qblock\" data-letter=\"A\"><h3>[A]</h3>\n<p>IN PUBLIC, bankers have been blaming themselves for their troubles. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>[B]</h3>\n<p>On April 2nd, after a bruising encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognising losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, decried those who “impugn our motives”. Yet bank shares rose and the changes enhance what one lobbying group politely calls “the use of judgment by management”.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>[C]</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to be “piecemeal”, but the pressure to fold when it completes its overhaul of rules later this year is strong. On April 1st Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political vacuum” but “in the real world” and that Europe could yet develop different rules.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>[D]</h3>\n<p>Unfortunately, banks’ lobbying now seems to be working. The details may be arcane, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>[E]</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are sceptical.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>[F]</h3>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n<p>To get the system working again, losses must be recognised and dealt with. Japan’s procrastination prolonged its crisis. America’s new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>[G]</h3>\n<p>Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by appeasing critics now they are inviting pressure to make more concessions.</p>\n</section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>[H]</h3>\n<p>Standard-setters should defuse the argument by making clear that their job is not to regulate banks but to force them to reveal information. The banks, their capital-adequacy regulators and politicians seem to dream of a single, grown-up version of the truth, which enhances financial stability. Investors and accountants, however, think all valuations are subjective, doubt managers’ motives and judge that market prices are the least-bad option. They are right. A bank’s solvency is a matter of judgment for its regulators and for investors, not whatever a piece of paper signed by its auditors says it is. Accounts can inform that decision, but not make it.</p>\n<p>Banks’ regulators have to take responsibility. If they want to remove the mechanical link between drops in market prices and capital shortfalls at banks, they should take the accounts that standard-setters create for investors and adjust them when they calculate capital. They already do this to some degree. But the banks’ campaign to change the rules is making inevitable a split between two sets of accounts, one for regulators and another for investors. The FASB and IASB can help regulators to create whatever balance-sheet they want. But in doing so they must not compromise their duty to investors.</p>\n</section>"};
const FULL = "<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img alt=\"重点词语境标注示例\" class=\"embedded-asset\" data-asset=\"method_vocab_example\"/><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img alt=\"意群法示例\" class=\"embedded-asset\" data-asset=\"method_intent_example\"/><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img alt=\"新题型考纲总览\" class=\"embedded-asset\" data-asset=\"method_newtype_overview\"/><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img alt=\"新题型考纲表格\" class=\"embedded-asset\" data-asset=\"method_newtype_table\"/><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img alt=\"七选五题型说明\" class=\"embedded-asset\" data-asset=\"method_cloze_intro\"/><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img alt=\"小标题题考点\" class=\"embedded-asset\" data-asset=\"method_smalltitle\"/><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img alt=\"排序题考点\" class=\"embedded-asset\" data-asset=\"method_sorting\"/><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img alt=\"匹配题考点\" class=\"embedded-asset\" data-asset=\"method_matching\"/><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr/>\n<hr/>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<p><img alt=\"2010 英语一 Text 4 重点词与语境标注\" class=\"embedded-asset\" data-asset=\"articleAnnotated\"/></p>\n<h1>第1段</h1>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>banker</td>\n<td>n. 银行家</td>\n<td>blame oneself for</td>\n<td>因……责备自己</td>\n<td>trouble</td>\n<td>n. 麻烦；困境</td>\n</tr>\n<tr>\n<td>in public</td>\n<td>公开地；在公众面前</td>\n<td>behind the scenes</td>\n<td>在幕后</td>\n<td>take aim at</td>\n<td>把矛头对准</td>\n</tr>\n<tr>\n<td>someone else</td>\n<td>其他人</td>\n<td>accounting standard-setter</td>\n<td>会计准则制定者</td>\n<td>rule</td>\n<td>n. 规则</td>\n</tr>\n<tr>\n<td>moan</td>\n<td>v. 抱怨</td>\n<td>force sb. to do</td>\n<td>迫使某人做某事</td>\n<td>report enormous losses</td>\n<td>报告巨额损失</td>\n</tr>\n<tr>\n<td>fair</td>\n<td>a. 公平的</td>\n<td>value assets</td>\n<td>给资产估值</td>\n<td>third party</td>\n<td>第三方</td>\n</tr>\n<tr>\n<td>pay</td>\n<td>v. 支付</td>\n<td>price</td>\n<td>n. 价格</td>\n<td>manager</td>\n<td>n. 管理者</td>\n</tr> 动机</td>\n</tr>\n<tr>\n<td>bank shares</td>\n<td>银行股</td>\n<td>rise</td>\n<td>v. 上涨</td>\n<td>enhance</td>\n<td>v. 加强</td>\n</tr>\n<tr>\n<td>lobbying group</td>\n<td>游说团体</td>\n<td>politely call</td>\n<td>礼貌地称为</td>\n<td>judgment by management</td>\n<td>管理层判断</td>\n</tr>\n</tbody>\n</table></div>\n<h1>第4段</h1>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>European minister</td>\n<td>欧洲部长</td>\n<td>instantly</td>\n<td>ad. 立即</td>\n<td>demand</td>\n<td>v. 要求</td>\n</tr>\n<tr>\n<td>International Accounting Standards Board</td>\n<td>国际会计准则理事会</td>\n<td>do likewise</td>\n<td>也采取同样做法</td>\n<td>act</td>\n<td>v. 行动</td>\n</tr>\n<tr>\n<td>overall planning</td>\n<td>整体规划</td>\n<td>pressure to fold</td>\n<td>屈服的压力</td>\n<td>complete</td>\n<td>v. 完成</td>\n</tr>\n<tr>\n<td>reconstruction of rules</td>\n<td>规则重建</td>\n<td>commissioner</td>\n<td>n. 委员；专员</td>\n<td>warn</td>\n<td>v. 警告</td>\n</tr>\n<tr>\n<td>political vacuum</td>\n<td>政治真空</td>\n<td>in the real world</td>\n<td>在现实世界中</td>\n<td>develop different rules</td>\n<td>制定不同规则</td>\n</tr>\n</tbody>\n</table></div>\n<h1>第5段</h1>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>on the wrong planet</td>\n<td>完全脱离现实；站错立场</td>\n<td>account</td>\n<td>n. 账目</td>\n<td>vastly</td>\n<td>ad. 极大地</td>\n</tr>\n<tr>\n<td>overvalue assets</td>\n<td>高估资产</td>\n<td>argue</td>\n<td>v. 辩称</td>\n<td>market prices</td>\n<td>市场价格</td>\n</tr>\n<tr>\n<td>overstate losses</td>\n<td>夸大损失</td>\n<td>largely reflect</td>\n<td>主要反映</td>\n<td>temporary illiquidity</td>\n<td>暂时的流动性不足</td>\n</tr>\n<tr>\n<td>likely extent</td>\n<td>可能的程度</td>\n<td>bad debts</td>\n<td>坏账</td>\n<td>trade below book value</td>\n<td>低于账面价值交易</td>\n</tr>\n<tr>\n<td>suggest</td>\n<td>v. 表明</td>\n<td>investor</td>\n<td>n. 投资者</td>\n<td>skeptical</td>\n<td>a. 怀疑的</td>\n</tr>\n<tr>\n<td>dead markets</td>\n<td>停滞的市场</td>\n<td>paralysis</td>\n<td>n. 瘫痪；停滞</td>\n<td>for fear of</td>\n<td>因为害怕</td>\n</tr>\n<tr>\n<td>book losses</td>\n<td>确认账面损失</td>\n<td>be reluctant to</td>\n<td>不愿意做</td>\n<td>supposed bargains</td>\n<td>所谓的便宜货</td>\n</tr>\n</tbody>\n</table></div>\n<h1>第6段</h1>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>get the system working again</td>\n<td>让系统重新运作</td>\n<td>recognize and deal with losses</td>\n<td>承认并处理损失</td>\n<td>buy up toxic assets</td>\n<td>收购有毒资产</td>\n</tr>\n<tr>\n<td>mark assets to levels</td>\n<td>把资产标价到某一水平</td>\n<td>find attractive</td>\n<td>认为有吸引力</td>\n<td>successful market</td>\n<td>成功运作的市场</td>\n</tr>\n<tr>\n<td>require</td>\n<td>v. 需要</td>\n<td>independent</td>\n<td>a. 独立的</td>\n<td>combative</td>\n<td>a. 强硬好斗的</td>\n</tr>\n<tr>\n<td>standard-setter</td>\n<td>n. 准则制定者</td>\n<td>clean up rules</td>\n<td>清理、完善规则</td>\n<td>stock options</td>\n<td>股票期权</td>\n</tr>\n<tr>\n<td>pensions</td>\n<td>n. 养老金</td>\n<td>against hostility</td>\n<td>顶着敌意</td>\n<td>special interests</td>\n<td>特殊利益集团</td>\n</tr>\n<tr>\n<td>give in to critics</td>\n<td>向批评者屈服</td>\n<td>invite pressure</td>\n<td>招致压力</td>\n<td>make concessions</td>\n<td>作出让步</td>\n</tr>\n</tbody>\n</table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<h2>逐句逐段分析</h2>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Bankers have been blaming themselves for their troubles in public. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Bankers have been blaming themselves / for their troubles / in public.</p>\n<p>Behind the scenes, / they have been taking aim / at someone else: / the accounting standard-setters.</p>\n<p>Their rules, / moan the banks, / have forced them / to report enormous losses, / and it's just not fair.</p>\n<p>These rules say / they must value some assets / at the price / a third party would pay, / not the price / managers and regulators / would like them to fetch.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>银行家们一直在自责 / 为他们的麻烦 / 在公开场合。</p>\n<p>在幕后，/ 他们一直在瞄准 / 其他人：/ 会计准则制定者。</p>\n<p>他们的规则，/ 银行抱怨道，/ 已经迫使他们 / 报告巨额损失，/ 而这很不公平。</p>\n<p>这些规则规定 / 他们必须对某些资产估值 / 按照价格 / 第三方愿意支付的，/ 而不是价格 / 管理者和监管者 / 希望它们达到的。</p>\n<h3>标准译文 · 第1段</h3>\n<p>银行家们在公开场合一直为自己的麻烦自责。但在幕后，他们却把矛头指向了其他人：会计准则制定者。银行抱怨说，他们的规则迫使银行报告巨额损失，这很不公平。这些规则要求银行必须按照第三方愿意支付的价格对某些资产进行估值，而不是按照管理者和监管者希望的价格。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Unfortunately, banks' lobbying now seems to be working. The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Unfortunately, / banks' lobbying / now seems to be working.</p>\n<p>The details / may be unknowable, / but the independence of standard-setters, / essential to the proper functioning / of capital markets, / is being compromised.</p>\n<p>And, / unless banks carry toxic assets / at prices that attract buyers, / reviving the banking system / will be difficult.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>不幸的是，/ 银行的游说 / 现在似乎正在奏效。</p>\n<p>细节 / 可能无法知晓，/ 但准则制定者的独立性，/ 对正常运作至关重要的 / 资本市场的，/ 正在被损害。</p>\n<p>而且，/ 除非银行持有有毒资产 / 以吸引买家的价格，/ 重振银行系统 / 将会很困难。</p>\n<h3>标准译文 · 第2段</h3>\n<p>不幸的是，银行的游说现在似乎正在奏效。虽然具体细节可能无法知晓，但对资本市场正常运作至关重要的准则制定者的独立性正在被损害。而且，除非银行以能够吸引买家的价格持有有毒资产，否则重振银行系统将会很困难。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\" Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n<h3>意群划分 · 第3段</h3>\n<p>After a bruising encounter / with Congress, / America's Financial Accounting Standards Board (FASB) / rushed through / rule changes.</p>\n<p>These gave banks / more freedom / to use models / to value illiquid assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements.</p>\n<p>Bob Herz, / the FASB's chairman, / cried out / against those / who \"question our motives.\"</p>\n<p>Yet bank shares rose / and the changes enhance / what one lobbying group / politely calls / \"the use of judgment by management.\"</p>\n<h3>意群翻译 · 第3段</h3>\n<p>在一次激烈交锋后 / 与国会的，/ 美国财务会计准则委员会（FASB）/ 匆忙通过了 / 规则变更。</p>\n<p>这些给了银行 / 更多自由 / 使用模型 / 来评估非流动资产 / 以及更多灵活性 / 在确认损失方面 / 对长期资产的 / 在他们的损益表中。</p>\n<p>鲍勃·赫兹，/ FASB的主席，/ 大声反对 / 那些人 / \"质疑我们动机\"的人。</p>\n<p>然而银行股上涨了 / 而且这些变更加强了 / 一个游说团体 / 礼貌地称之为 / \"管理层判断的使用\"。</p>\n<h3>标准译文 · 第3段</h3>\n<p>在与国会的激烈交锋后，美国财务会计准则委员会（FASB）匆忙通过了规则变更。这些变更给了银行更多自由来使用模型评估非流动资产，以及在损益表中确认长期资产损失时更多的灵活性。FASB主席鲍勃·赫兹大声反对那些\"质疑我们动机\"的人。然而银行股上涨了，而且这些变更加强了一个游说团体礼貌地称之为\"管理层判断的使用\"。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<h3>意群划分 · 第4段</h3>\n<p>European ministers / instantly demanded / that the International Accounting Standards Board (IASB) / do likewise.</p>\n<p>The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes / its reconstruction of rules / later this year / is strong.</p>\n<p>Charlie McCreevy, / a European commissioner, / warned the IASB / that it did \"not live / in a political vacuum\" / but \"in the real world\" / and that Europe / could yet develop / different rules.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>欧洲部长们 / 立即要求 / 国际会计准则理事会（IASB）/ 也这样做。</p>\n<p>IASB说 / 它不想行动 / 没有整体规划的情况下，/ 但屈服的压力 / 当它完成 / 其规则重建 / 今年晚些时候 / 是强大的。</p>\n<p>查理·麦克里维，/ 一位欧洲专员，/ 警告IASB / 它\"不是生活 / 在政治真空中\" / 而是\"在现实世界中\" / 而且欧洲 / 可能还会制定 / 不同的规则。</p>\n<h3>标准译文 · 第4段</h3>\n<p>欧洲部长们立即要求国际会计准则理事会（IASB）也采取同样的做法。IASB表示不想在没有整体规划的情况下行动，但当它在今年晚些时候完成规则重建时，屈服的压力将会很大。欧洲专员查理·麦克里维警告IASB，它\"不是生活在政治真空中\"而是\"在现实世界中\"，而且欧洲可能还会制定不同的规则。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks' shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n<h3>意群划分 · 第5段</h3>\n<p>It was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets.</p>\n<p>Today they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.</p>\n<p>The truth / will not be known / for years.</p>\n<p>But banks' shares / trade below their book value, / suggesting that investors / are skeptical.</p>\n<p>And dead markets / partly reflect / the paralysis of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those supposed bargains.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>是银行 / 在错误的星球上，/ 用账目 / 大大高估了资产。</p>\n<p>今天他们争辩 / 市场价格 / 夸大了损失，/ 因为它们主要反映 / 市场的暂时流动性不足，/ 而不是可能的程度 / 坏账的。</p>\n<p>真相 / 将不会被知道 / 多年内。</p>\n<p>但银行股票 / 交易低于其账面价值，/ 表明投资者 / 是怀疑的。</p>\n<p>而且死气沉沉的市场 / 部分反映了 / 银行的瘫痪 / 它们不会出售资产 / 因为害怕记录损失，/ 但又不愿意购买 / 所有那些所谓的便宜货。</p>\n<h3>标准译文 · 第5段</h3>\n<p>是银行在错误的星球上，他们的账目大大高估了资产价值。今天他们争辩说市场价格夸大了损失，因为这些价格主要反映的是市场暂时的流动性不足，而不是坏账的可能程度。真相在多年内都不会被知晓。但银行股票的交易价格低于其账面价值，这表明投资者持怀疑态度。而且死气沉沉的市场部分反映了银行的瘫痪状态——它们因害怕记录损失而不愿出售资产，但又不愿意购买所有那些所谓的便宜货。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>To get the system working again, losses must be recognized and dealt with. America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by giving in to critics now they are inviting pressure to make more concessions.</p>\n<h3>意群划分 · 第6段</h3>\n<p>To get the system working again, / losses must be recognized / and dealt with.</p>\n<p>America's new plan / to buy up toxic assets / will not work / unless banks mark assets / to levels / which buyers find attractive.</p>\n<p>Successful markets / require independent / and even combative / standard-setters.</p>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n<p>But by giving in / to critics now / they are inviting pressure / to make more concessions.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>要让系统重新运作，/ 损失必须被承认 / 并处理。</p>\n<p>美国的新计划 / 购买有毒资产的 / 将不会奏效 / 除非银行标记资产 / 到水平 / 买家认为有吸引力的。</p>\n<p>成功的市场 / 需要独立的 / 甚至是好斗的 / 准则制定者。</p>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n<p>但通过屈服 / 于批评者现在 / 他们正在招致压力 / 做出更多让步。</p>\n<h3>标准译文 · 第6段</h3>\n<p>要让系统重新运作，损失必须被承认并加以处理。美国购买有毒资产的新计划将不会奏效，除非银行将资产标记到买家认为有吸引力的水平。成功的市场需要独立的、甚至是好斗的准则制定者。FASB和IASB一直正是这样，例如，他们不顾特殊利益集团的敌意，清理了股票期权和养老金的规则。但现在通过向批评者屈服，他们正在招致做出更多让步的压力。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n<h3>句子逻辑梳理（选修，按照自身语法基础而定)</h3>\n<p><strong>第1段</strong></p>\n<p>Bankers have been blaming themselves：(for their troubles)：(in public).</p>\n<p>Behind the scenes → they have been taking aim：(at someone else)：the accounting standard-setters.</p>\n<p>Their rules：(moan the banks) → have forced them → to report enormous losses + it's just not fair.</p>\n<p>These rules say：(they must value some assets：(at the price：(a third party would pay))) // not the price：(managers and regulators → would like them to fetch).</p>\n<p><strong>第2段</strong></p>\n<p>Unfortunately → banks' lobbying → now seems to be working.</p>\n<p>The details → may be unknowable // but the independence of standard-setters：(essential to the proper functioning：(of capital markets)) → is being compromised.</p>\n<p>And → unless banks carry toxic assets：(at prices：(that attract buyers)) → reviving the banking system → will be difficult.</p>\n<p><strong>第3段</strong></p>\n<p>After a bruising encounter：(with Congress) → America's Financial Accounting Standards Board (FASB) → rushed through → rule changes.</p>\n<p>These gave banks：(more freedom：(to use models：(to value illiquid assets))) + (more flexibility：(in recognizing losses：(on long-term assets)：(in their income statements))).</p>\n<p>Bob Herz：(the FASB's chairman) → cried out：(against those：(who \"question our motives\")).</p>\n<p>Yet bank shares rose + the changes enhance：(what one lobbying group → politely calls：(\"the use of judgment by management\")).</p>\n<p><strong>第4段</strong></p>\n<p>European ministers → instantly demanded：(that the International Accounting Standards Board (IASB) → do likewise).</p>\n<p>The IASB says：(it does not want to act：(without overall planning)) // but the pressure to fold：(when it completes → its reconstruction of rules：(later this year)) → is strong.</p>\n<p>Charlie McCreevy：(a European commissioner) → warned the IASB：(that it did \"not live：(in a political vacuum)\" // but \"in the real world\") + (that Europe → could yet develop → different rules).</p>\n<p><strong>第5段</strong></p>\n<p>It was banks：(that were on the wrong planet)：(with accounts：(that vastly overvalued assets)).</p>\n<p>Today they argue：(that market prices → overstate losses)：(because they largely reflect → the temporary illiquidity of markets // not the likely extent：(of bad debts)).</p>\n<p>The truth → will not be known：(for years).</p>\n<p>But banks' shares → trade below their book value → suggesting：(that investors → are skeptical).</p>\n<p>And dead markets → partly reflect → the paralysis of banks：(which will not sell assets：(for fear of booking losses)) // (yet are reluctant to buy：(all those supposed bargains)).</p>\n<p><strong>第6段</strong></p>\n<p>To get the system working again → losses must be recognized + dealt with.</p>\n<p>America's new plan：(to buy up toxic assets) → will not work → unless banks mark assets：(to levels：(which buyers find attractive)).</p>\n<p>Successful markets → require independent + even combative → standard-setters.</p>\n<p>The FASB and IASB → have been exactly that → cleaning up rules：(on stock options and pensions)：(for example)：(against hostility：(from special interests)).</p>\n<p>But by giving in：(to critics now) → they are inviting pressure：(to make more concessions).</p>\n<h3>中文版句子逻辑（选修)</h3>\n<p><strong>第1段</strong></p>\n<p>银行家们一直在自责：(为他们的麻烦)：(在公开场合)。</p>\n<p>在幕后 → 他们一直在瞄准：(其他人)：会计准则制定者。</p>\n<p>他们的规则：(银行抱怨道) → 已经迫使他们 → 报告巨额损失 + 这很不公平。</p>\n<p>这些规则规定：(他们必须对某些资产估值：(按照价格：(第三方愿意支付的))) // 而不是价格：(管理者和监管者 → 希望它们达到的)。</p>\n<p><strong>第2段</strong></p>\n<p>不幸的是 → 银行的游说 → 现在似乎正在奏效。</p>\n<p>细节 → 可能无法知晓 // 但准则制定者的独立性：(对正常运作至关重要的：(资本市场的)) → 正在被损害。</p>\n<p>而且 → 除非银行持有有毒资产：(以价格：(吸引买家的)) → 重振银行系统 → 将会很困难。</p>\n<p><strong>第3段</strong></p>\n<p>在一次激烈交锋后：(与国会的) → 美国财务会计准则委员会（FASB）→ 匆忙通过了 → 规则变更。</p>\n<p>这些给了银行：(更多自由：(使用模型：(来评估非流动资产))) + (更多灵活性：(在确认损失方面：(对长期资产的)：(在他们的损益表中)))。</p>\n<p>鲍勃·赫兹：(FASB的主席) → 大声反对：(那些人：(\"质疑我们动机\"的人))。</p>\n<p>然而银行股上涨了 + 这些变更加强了：(一个游说团体 → 礼貌地称之为：(\"管理层判断的使用\"))。</p>\n<p><strong>第4段</strong></p>\n<p>欧洲部长们 → 立即要求：(国际会计准则理事会（IASB）→ 也这样做)。</p>\n<p>IASB说：(它不想行动：(没有整体规划的情况下)) // 但屈服的压力：(当它完成 → 其规则重建：(今年晚些时候)) → 是强大的。</p>\n<p>查理·麦克里维：(一位欧洲专员) → 警告IASB：(它\"不是生活：(在政治真空中)\" // 而是\"在现实世界中\") + (欧洲 → 可能还会制定 → 不同的规则)。</p>\n<p><strong>第5段</strong></p>\n<p>是银行：(在错误的星球上)：(用账目：(大大高估了资产))。</p>\n<p>今天他们争辩：(市场价格 → 夸大了损失)：(因为它们主要反映 → 市场的暂时流动性不足 // 而不是可能的程度：(坏账的))。</p>\n<p>真相 → 将不会被知道：(多年内)。</p>\n<p>但银行股票 → 交易低于其账面价值 → 表明：(投资者 → 是怀疑的)。</p>\n<p>而且死气沉沉的市场 → 部分反映了 → 银行的瘫痪：(它们不会出售资产：(因为害怕记录损失)) // (但又不愿意购买：(所有那些所谓的便宜货))。</p>\n<p><strong>第6段</strong></p>\n<p>要让系统重新运作 → 损失必须被承认 + 处理。</p>\n<p>美国的新计划：(购买有毒资产的) → 将不会奏效 → 除非银行标记资产：(到水平：(买家认为有吸引力的))。</p>\n<p>成功的市场 → 需要独立的 + 甚至是好斗的 → 准则制定者。</p>\n<p>FASB和IASB → 一直正是这样 → 清理规则：(关于股票期权和养老金的)：(例如)：(对抗敌意：(来自特殊利益集团的))。</p>\n<p>但通过屈服：(于批评者现在) → 他们正在招致压力：(做出更多让步)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并起来；</li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；</li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。</li>\n</ol>\n<h3>1. 第一段第四句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>These rules say / they must value some assets / at the price / a third party would pay, / not the price / managers and regulators / would like them to fetch.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>这些规则规定 / 他们必须对某些资产估值 / 按照价格 / 第三方愿意支付的，/ 而不是价格 / 管理者和监管者 / 希望它们达到的。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把“第三方愿意支付的”放到“价格”前：</p>\n<blockquote>\n<p>按照第三方愿意支付的价格</p>\n</blockquote>\n<p>后半句也在说明另一种“价格”，先把“管理者和监管者”与“希望它们达到的”接起来：</p>\n<blockquote>\n<p>而不是管理者和监管者希望这些资产达到的价格</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>这些规则规定，银行必须按照第三方愿意支付的价格对某些资产估值，而不是按照管理者和监管者希望这些资产达到的价格。</p>\n</blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这些规则要求银行按一种价格估值，而不是按另一种价格估值。</p>\n</blockquote>\n<p>把“某些资产”放在“估值”的对象位置；两种价格分别由第三方愿付价格与管理者、监管者期望价格限定。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>这些规则要求银行按照第三方愿意支付的价格给某些资产估值，而不能按照管理者和监管者希望资产达到的价格估值。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li>“给资产估值”可整理为“对资产进行估值”；</li>\n<li>后半句不必重复“资产达到”，直接说“希望的价格”更符合中文表达；</li>\n<li><code>must</code>的约束性用“必须”保留。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>这些规则要求银行必须按照第三方愿意支付的价格对某些资产进行估值，而不是按照管理者和监管者希望的价格。</p>\n</blockquote>\n<h3>2. 第二段第二句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>The details / may be unknowable, / but the independence of standard-setters, / essential to the proper functioning / of capital markets, / is being compromised.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>细节 / 可能无法知晓，/ 但准则制定者的独立性，/ 对正常运作至关重要的 / 资本市场的，/ 正在被损害。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把中间两块都放回“独立性”前面，它们是在说明这种独立性为什么重要：</p>\n<blockquote>\n<p>对资本市场正常运作至关重要的准则制定者的独立性</p>\n</blockquote>\n<p>再用“但”把前后两个判断接起来：</p>\n<blockquote>\n<p>细节可能无法知晓，但这种独立性正在受到损害</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>细节可能无法知晓，但对资本市场正常运作至关重要的准则制定者的独立性正在受到损害。</p>\n</blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>细节可能不知道，但独立性正在受损。</p>\n</blockquote>\n<p>“准则制定者的”限定独立性；“对资本市场正常运作至关重要”是对该独立性的补充评价，中文放到中心名词前。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>具体细节也许无法知晓，但对资本市场正常运作至关重要的准则制定者独立性正在受损。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li><code>details</code>译为“具体细节”更完整；</li>\n<li>“准则制定者独立性”补上“的”，避免生硬；</li>\n<li>被动进行态用“正在被损害”保留过程感。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>虽然具体细节可能无法知晓，但对资本市场正常运作至关重要的准则制定者的独立性正在被损害。</p>\n</blockquote>\n<h3>3. 第三段第二句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>These gave banks / more freedom / to use models / to value illiquid assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>这些给了银行 / 更多自由 / 使用模型 / 来评估非流动资产 / 以及更多灵活性 / 在确认损失方面 / 对长期资产的 / 在他们的损益表中。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把“更多自由”后面的动作接完整：</p>\n<blockquote>\n<p>更自由地使用模型评估非流动资产</p>\n</blockquote>\n<p>再把“更多灵活性”后面的对象和位置接完整：</p>\n<blockquote>\n<p>更灵活地在损益表中确认长期资产损失</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>这些变更给了银行更多自由去使用模型评估非流动资产，也给了银行更多灵活性去在损益表中确认长期资产损失。</p>\n</blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这些变更给了银行更多自由和更多灵活性。</p>\n</blockquote>\n<p>第一组说明“自由”用于什么；第二组说明“灵活性”体现在哪个确认动作、针对什么资产、出现在哪张报表里。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>这些变更使银行可以更自由地使用模型评估非流动资产，也能更灵活地在损益表中确认长期资产损失。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li>用“这些变更”补清<code>These</code>的指代；</li>\n<li>两个并列结构分别用“更多自由”“更多灵活性”，保持原句对应；</li>\n<li><code>income statements</code>稳定译为“损益表”。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>这些变更给了银行更多自由来使用模型评估非流动资产，以及在损益表中确认长期资产损失时更多的灵活性。</p>\n</blockquote>\n<h3>4. 第四段第二句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes / its reconstruction of rules / later this year / is strong.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>IASB说 / 它不想行动 / 没有整体规划的情况下，/ 但屈服的压力 / 当它完成 / 其规则重建 / 今年晚些时候 / 是强大的。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把前半句的条件放到动作前面：</p>\n<blockquote>\n<p>IASB说，它不想在没有整体规划的情况下行动</p>\n</blockquote>\n<p>后半句先把时间说完整，再说压力：</p>\n<blockquote>\n<p>但当它在今年晚些时候完成规则重建时，屈服的压力会很大</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>IASB说，它不想在没有整体规划的情况下行动，但当它在今年晚些时候完成规则重建时，屈服的压力会很大。</p>\n</blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>IASB不想行动，但压力很大。</p>\n</blockquote>\n<p>“没有整体规划”限制前一个动作；“今年晚些时候完成规则重建时”交代压力集中出现的时间；“屈服”说明压力逼它做什么。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>IASB表示自己不愿在缺少整体规划时行动，但等到今年晚些时候完成规则重建时，它将面临很大的屈服压力。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li><code>says</code>用“表示”比“说”更适合机构主体；</li>\n<li><code>pressure to fold</code>不能只写“压力”，要保留“屈服”方向；</li>\n<li>时间状语放在后半句动作之前。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>IASB表示不想在没有整体规划的情况下行动，但当它在今年晚些时候完成规则重建时，屈服的压力将会很大。</p>\n</blockquote>\n<h3>5. 第五段第二句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>Today they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>今天他们争辩 / 市场价格 / 夸大了损失，/ 因为它们主要反映 / 市场的暂时流动性不足，/ 而不是可能的程度 / 坏账的。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把银行的主张说完整：</p>\n<blockquote>\n<p>今天它们辩称，市场价格夸大了损失</p>\n</blockquote>\n<p>原因内部是“反映A，而不是反映B”的对照：</p>\n<blockquote>\n<p>因为这些价格主要反映市场暂时的流动性不足，而不是坏账可能达到的程度</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>今天它们辩称市场价格夸大了损失，因为这些价格主要反映市场暂时的流动性不足，而不是坏账可能达到的程度。</p>\n</blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>银行辩称市场价格夸大损失，因为价格反映A，而非B。</p>\n</blockquote>\n<p><code>they</code>回指银行；第二个<code>they</code>回指市场价格。两个代词的对象不同，中文都要补清，避免指代混乱。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>如今银行辩称，市场价格夸大了损失，因为这些价格主要反映的是市场暂时缺乏流动性，而不是真实坏账的可能程度。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li>两处<code>they</code>分别译出“银行”和“这些价格”；</li>\n<li><code>temporary illiquidity</code>整理为“市场暂时的流动性不足”；</li>\n<li><code>likely extent</code>保留为“可能程度”，不脑补成坏账不存在。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>今天他们争辩说市场价格夸大了损失，因为这些价格主要反映的是市场暂时的流动性不足，而不是坏账的可能程度。</p>\n</blockquote>\n<h3>6. 第六段第四句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把<code>exactly that</code>接回上一句的“独立、甚至强硬的准则制定者”：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样的准则制定者</p>\n</blockquote>\n<p>后面的例子说它们顶着谁的阻力做了什么：</p>\n<blockquote>\n<p>例如，它们顶着特殊利益集团的敌意，清理了股票期权和养老金规则</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样的准则制定者，例如顶着特殊利益集团的敌意，清理股票期权和养老金规则。</p>\n</blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>FASB和IASB一直如此，并清理了规则。</p>\n</blockquote>\n<p>“股票期权和养老金”限定规则类型；“来自特殊利益集团的敌意”交代阻力；“例如”提示这是对上一句评价的证明。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>FASB和IASB一直就是这种独立而强硬的制定者，例如，它们不顾特殊利益集团的敌意，清理了股票期权和养老金方面的规则。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<ul>\n<li>把<code>that</code>的具体内容补出，避免“正是这样”指代悬空；</li>\n<li><code>against hostility</code>处理为“不顾……的敌意”更自然；</li>\n<li>“规则”与“股票期权和养老金”直接组合。</li>\n</ul>\n<p>参考译文：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样，例如，他们不顾特殊利益集团的敌意，清理了股票期权和养老金的规则。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。</li>\n</ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n<li><strong>全文主旨：</strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr/>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr/>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>在本篇文章里，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。</p>\n<h2>40题</h2>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<p>作者对准则制定者持什么态度？</p>\n<p>这是全文作者态度题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>satisfaction</strong></p>\n<p>满意</p>\n<p>B. <strong>skepticism</strong></p>\n<p>怀疑</p>\n<p>C. <strong>objectiveness</strong></p>\n<p>客观中立</p>\n<p>D. <strong>sympathy</strong></p>\n<p>同情、支持</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在说什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>写银行表面自责，背后却把损失归咎于准则制定者</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>直接判断银行游说正在奏效，准则制定者的独立地位受损</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写FASB在国会压力后匆忙改规则，银行因此获得更多判断空间</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>写欧洲部长继续向IASB施压，要求它也作出类似改变</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>转而批评银行高估资产，并说明投资者并不相信银行的说法</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>明确要求独立甚至强硬的准则制定者，并警告继续让步会招来更多压力</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>A. satisfaction</h3>\n<p>满意</p>\n<h4>如果 A 是主旨，文章6段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>满意</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先写银行把自己的损失怪到准则制定者头上，而作者认为制定者的资产估值要求合理、处理得当，因而对它们表示满意。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再写制定者已经作出适度让步，并说明这些调整保留了原则、回应了实际需要，正是作者满意的稳妥处理。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB调整规则的例子，具体写它在压力下给出有限灵活性却守住估值底线，因而取得令人满意的效果。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，写它也能妥善安排必要调整而不丢掉整体规划，让作者对两家机构的表现都满意。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头指出损失的根源在银行高估资产，而制定者已恰当地履行职责，用责任区分加强对其工作的肯定。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后肯定制定者目前把握的界限令人满意，并要求不再向银行退让，以维护这种已得到肯定的处理结果。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>A可以借到第6段对制定者过去工作的肯定，但不能只看过去。第2段用<code>Unfortunately</code>评价银行游说奏效，并说独立性正在受损；第6段又用<code>But</code>警告当前屈服会招来更多压力。假设表需要作者满意它们目前把握的界限，实际文章恰恰认为这条界限正在被侵蚀。肯定过去做对的事，不等于满意当前的让步。</p>\n<p>判断：</p>\n<p><strong>A 不保留。</strong></p>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>B. skepticism</h3>\n<p>怀疑</p>\n<h4>如果 B 是主旨，文章6段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>怀疑</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先写银行把损失怪给准则制定者，作者顺着抱怨追问这些制定者的判断是否可靠，从开头建立怀疑。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再写制定者已开始让步，作者将这种摇摆视为其原则和判断不可靠的表现，使怀疑加深。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB受压改规则的例子，具体显示它在没有充分理由时改变判断，让作者更怀疑其制定规则的能力。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，写它也表现出随压力改变判断的倾向，使怀疑从一家机构扩展到两家。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头论证真正的问题在制定者不可靠的判断与规则，而不只在银行的抱怨，明确怀疑所指向的责任方。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后因不信任它们在压力下作出的判断，要求制定者不能继续退让，不能让不可靠的调整进一步扩大。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>B能抓住作者对当前让步的批评，却会把批评扩大成对制定者本身的不信任。实际第5段把责任指向银行高估资产，第6段明确要求独立甚至强硬的制定者，并说FASB和IASB过去正是这样。假设表把问题根源放在制定者判断不可靠，实际文章是在替其独立工作辩护、劝其不要丢掉原来的原则。</p>\n<p>判断：</p>\n<p><strong>B 不保留。</strong></p>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>C. objectiveness</h3>\n<p>客观中立</p>\n<h4>如果 C 是主旨，文章6段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>客观中立</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先不带同情或不满地交代银行责怪准则制定者的事实，并同时列明银行的抱怨与规则的要求。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再以可核查的事实说明让步已经发生，分别陈列它改变了什么，不把这些变化处理成值得赞赏或惋惜的事。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB的实际让步，按内容、程序和影响逐项交代，既不为机构辩护，也不对其表达情感评价。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，以同样中性的口吻列出欧洲的要求、机构的回应和各方的理由。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头仅按账目和市场证据厘清问题应由谁负责，保持事实判断与对制定者的同情、满意或怀疑相分离。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后依据规则进一步退让将影响市场运作这一技术判断，得出不能继续退让的结论，但不表达对制定者的情感立场。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>C需要全文在陈列各方与评估后果时保持中性。实际第2段的<code>Unfortunately</code>、第5段的<code>It was banks that were on the wrong planet</code>以及第6段对独立制定者的明确支持，都超出了不带立场的事实记录。作者虽然引用双方说法，也批评制定者当前让步，但并没有在银行与制定者之间各打五十大板；他明确维护后者的独立职责。</p>\n<p>判断：</p>\n<p><strong>C 不保留。</strong></p>\n<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>D. sympathy</h3>\n<p>同情、支持</p>\n<h4>如果 D 是主旨，文章6段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>同情、支持</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先写银行把自身损失归咎于准则制定者，使读者看到这些机构为何成了被指责的对象，为同情它们的处境作铺垫。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再写银行游说促成让步，作者惋惜制定者的独立性受损，表明自己支持它们本应守住的立场。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB在国会压力后匆忙让步的例子，呈现它受压的处境以及银行因此获利，让对其处境的同情具体可见。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，展示欧洲政治人物也逼它照做，使读者看到准则制定者共同承受的压力。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头指出真正的问题在银行高估资产和回避损失，而不是独立准则本身，从责任判断上为制定者辩护。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后肯定制定者原来独立、强硬的工作，并劝其不要继续退让，把同情处境与支持坚守职责落在一起。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>第1段先让我们看到制定者被银行责怪，第2段直接担忧它们独立性受损，第3、4段把美国与欧洲的压力展开，第5段再把实际责任推回银行，第6段肯定独立制定者的过去并警告不要继续让步。D能贯穿这六段：作者同情它们被施压的处境，并支持其独立工作。支持不等于对它们当前每个选择都满意，所以末段的批评不妨碍D成立。</p>\n<p>判断：</p>\n<p><strong>D 保留。</strong></p>\n<h3>40题结论</h3>\n<p><strong>40. D. sympathy</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>sympathy / 作者同情并支持保持独立、强硬的准则制定者</strong></p>\n<h2>36题</h2>\n<blockquote>\n<p>Bankers complained that they were forced to ______.<br/>\n银行家抱怨他们被迫做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干中的主语是银行家，<code>complained</code>要求找银行的抱怨，<code>were forced to</code>要求找被规则强制执行的动作，而不是作者对规则的评价。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<p>第1段的<code>moan the banks</code>承接题干的<code>complained</code>，<code>have forced them</code>对应<code>were forced to</code>。先看银行抱怨被迫报告损失，再看下一句解释规则要求怎样估值。两句合起来，回答的是银行被迫遵守什么估值要求。</p>\n<h3>A. follow unfavorable asset evaluation rules</h3>\n<blockquote>\n<p>遵守对它们不利的资产估值规则</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时我们先读了第1段，看到<code>forced</code>、按第三方愿付价格估值以及<code>it’s just not fair</code>。损失前的修饰词仍是<code>[xxx]</code>，但估值标准和银行的不满已经读清。A本身没有遮挡，我们把它作为整条规则的概括保留下来；B、C、D随后被排除，A的状态没有再改变。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>A没有逐字照搬某一句。<code>asset evaluation rules</code>概括下一句的定价要求，<code>unfavorable</code>概括银行所说的被迫报告损失与“不公平”。这份“不利”是银行眼中的不利，不代表作者认为准则本身不合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫遵守对它们不利的资产估值规则。</p>\n</blockquote>\n<p>定位时同时看<code>complained</code>和<code>forced to</code>：它们分别对应银行插入的抱怨和规则的强制作用。单看<code>assets</code>只能找到话题，不能知道银行为什么抱怨。</p>\n<p>前一句写规则迫使银行报告巨额损失，后一句说明必须按第三方愿意支付的价格估值，而不能采用管理者和监管者希望的价格。前者给不满的结果，后者给被迫遵守的要求。</p>\n<p>银行是服从规则的一方；准则制定者制定的是资产估值规则。A的<code>follow</code>对应遵守这种强制要求，<code>unfavorable</code>对应银行报告损失后作出的负面评价。它没有把银行自己的评价移交给作者。</p>\n<p>因此，A把两句中“规则内容”和“银行为何觉得不利”压成一个概括，既保留资产估值这个对象，也保留银行抱怨的方向。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>银行先抱怨规则迫使自己报告损失，随后说明规则要求采用第三方愿付价格。</p>\n</blockquote>\n<p>文章并没有停在“银行不高兴”，而是立即解释它们为何不能照自己的理想价格记账。这个解释正好把“不利的规则”落到具体估值要求。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks complain that the valuation rules require third-party prices and force them to report losses.</p>\n<p>银行抱怨估值规则要求使用第三方价格，并迫使它们报告损失。</p>\n</blockquote>\n<p>A所需要的写法正是原文已有的推进：先写受规则约束、报告损失，再给出资产估值标准。假设句没有增加再次估值、实际收款或合作等新动作。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>follow unfavorable asset evaluation rules<br/>\n遵守对它们不利的资产估值规则</p>\n</blockquote>\n<p>同情准则制定者，不等于认为银行没有受到不利影响；作者可以理解银行为何抱怨，同时反对它们施压改变规则。A只概括银行的抱怨，不替银行证明这些抱怨有理。具体规则仍由第1段的第三方价格要求坐实。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. collect payments from third parties</h3>\n<blockquote>\n<p>向第三方收取款项</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>collect [xxx] from third parties</code>。我们没有替遮挡词补出意思，而是拿可读的<code>collect</code>和<code>third parties</code>去对照原句：第三方愿付价格是估值参照，选项却写收取动作。因此第一轮就排除了B，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人借用了<code>a third party would pay</code>，把“第三方在假设交易中愿付的价格”改成“银行必须向第三方收款”。<code>would pay</code>在这里限定估值标准，并不是要求银行去执行一笔收款交易。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫向第三方收取款项。</p>\n</blockquote>\n<p>题干的<code>forced to</code>要求找银行被要求做的动作。B虽然复现了第三方，但原句的主干动作是<code>value some assets</code>，不是<code>collect payments</code>。</p>\n<p>原句要求银行按照第三方愿意支付的价格估值。后半句再排除管理者和监管者希望的价格，两边都在比较估值基准。</p>\n<p>在原文中，第三方是价格参照的提供者；在B中，第三方变成实际付款方，银行则成了被迫收款的一方。选项还把<code>would pay</code>所处的假设估值语境改成了要实施的交易动作。</p>\n<p>问题不在<code>payments</code>能否与<code>pay</code>对应，而在整句动作变了：按愿付价格估值，不等于向这些人收取款项。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>规则要求比较第三方愿付价格与管理者、监管者希望的价格。</p>\n</blockquote>\n<p>作者把两个价格并排，是要说明银行失去了按自身意愿估值的自由；后文才接银行游说，不是接某笔付款怎样完成。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rules require banks to collect payments from third parties.</p>\n<p>这些规则要求银行向第三方收取款项。</p>\n</blockquote>\n<p>假设写法必须把强制动作改成收款，才足以支持B。实际文章强制的是估值所采用的价格，下一步讨论的也是改变规则，而不是追收款项。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>collect payments from third parties<br/>\n向第三方收取款项</p>\n</blockquote>\n<p>全文支持独立准则，能帮助我们理解银行为何把矛头对准规则，却不能凭这个立场推出具体收款业务。本项最终仍要根据<code>value some assets at the price a third party would pay</code>判断：这里有估值基准，没有B所说的强制收款。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. cooperate with the price managers</h3>\n<blockquote>\n<p>与价格管理者合作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C的词语都能看见。我们回到<code>not the price managers and regulators would like them to fetch</code>，发现<code>managers</code>属于说明价格的后半句，并不是<code>price managers</code>这种人物称呼；原文也没有合作动作。第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>the price</code>后面的定语从句切错，将“管理者和监管者希望资产达到的价格”拼成“价格管理者”，再添上<code>cooperate with</code>。看起来复用了原词，实际连合作对象都不是原句中的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫与价格管理者合作。</p>\n</blockquote>\n<p>C最容易让人定位到<code>price managers</code>相邻的位置，但应该先问：题干中的强制动作究竟对应哪一个谓语？原文对应的是<code>must value</code>。</p>\n<p>整句先写第三方愿付的价格，再写银行不能采用的另一种价格。后一种价格由<code>managers and regulators would like them to fetch</code>说明，即管理者和监管者希望资产卖到的数额。</p>\n<p><code>managers and regulators</code>是后面从句的主语，不是<code>price</code>的同位解释。C却把价格修饰关系拆成一个人群名称，还把采用价格标准改成了与某些人合作。</p>\n<p>因此，C不是概括得粗一点，而是同时改变原句的人物关系和动作：原文谈两种估值价格，C谈银行同谁合作。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>原文对照的是第三方愿付价格和管理者、监管者希望的价格。</p>\n</blockquote>\n<p>这条对照继续解释资产应按什么价格记账，句子里没有成立一个名叫“价格管理者”的合作方。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rules force banks to cooperate with price managers.</p>\n<p>这些规则迫使银行与价格管理者合作。</p>\n</blockquote>\n<p>假设句必须明确出现合作方和合作动作；实际句子只让管理者、监管者表达希望的价格，并且否定采用这种价格。两条写作路线不是一回事。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>cooperate with the price managers<br/>\n与价格管理者合作</p>\n</blockquote>\n<p>作者支持准则制定者的独立性，但这种立场不能证明银行与任何“价格管理者”存在合作。局部原文的<code>the price ... would like them to fetch</code>已经说明这里是价格的限定关系，不能用全文对机构的讨论替C补出新角色。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. reevaluate some of their assets</h3>\n<blockquote>\n<p>重新评估它们的一些资产</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们承认它的<code>assets</code>与<code>value</code>看起来接近，但比较后发现它只写“重新评估”，没有接住必须使用第三方价格以及由此报告损失。做题材料据此第一轮排除了D，此后A成为唯一保留项，没有二次改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>value some assets</code>，却把银行抱怨的具体估值约束压成“再评估一次”。原句的重点是按谁的价格评估，而非评估次数；<code>reevaluate</code>还额外带入“重新”的时间意味。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫重新评估它们的一些资产。</p>\n</blockquote>\n<p>定位不能只靠<code>assets</code>。题干的<code>complained</code>要接到银行所说的“不公平”，<code>forced to</code>要接到规则规定的具体义务。</p>\n<p>规则迫使银行按第三方愿付价格估值，因此报告巨额损失。原句用<code>not the price</code>明确排除另一种估值标准，是在区分采用什么价格。</p>\n<p>D只保留资产评估这个宽泛动作，把约束标准删掉，再用<code>re-</code>把动作转成重新进行。文章没有把“是否再次评估”作为抱怨焦点，也没有先交代一轮评估、再要求重复的过程。</p>\n<p>所以D与原文有共同话题，但没有保留构成这次抱怨的关键关系：银行被迫采用自己不愿采用的价格规则，而不只是被要求重做一个评估动作。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>银行的不满集中于必须按第三方价格估值，并在账目上报告损失。</p>\n</blockquote>\n<p>作者花一句话对照两个价格标准，是为了解释不满从哪里来。若重点只是再评估一次，这个价格对照就不能由D本身概括出来。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks complain that the rules force them to assess some assets again.</p>\n<p>银行抱怨规则迫使它们再评估一次某些资产。</p>\n</blockquote>\n<p>假设句把抱怨焦点放在重复评估；实际句子把焦点放在不能采用理想价格。D带入了次数变化，却拿掉了文章专门展开的估值标准，A则保留了这条关系。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>reevaluate some of their assets<br/>\n重新评估它们的一些资产</p>\n</blockquote>\n<p>主旨能确认争议围绕银行施压准则制定者展开，但不能靠主旨判断银行是否重新进行过估值。本项仍要回到<code>at the price a third party would pay, not the price ...</code>：作者解释的是标准冲突，D却改成再次评估。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. A. follow unfavorable asset evaluation rules</strong></p>\n</blockquote>\n<p>A概括了银行被迫遵守的不利估值规则及其损失后果。</p>\n<p>B把第三方愿付价格这一估值参照变成了实际收款。</p>\n<p>C切错价格定语从句，拼出“价格管理者”并添加合作动作。</p>\n<p>D把采用特定价格标准改成再次评估，遗漏了抱怨的核心约束。</p>\n<h2>37题</h2>\n<blockquote>\n<p>According to the author, the rule changes of the FASB may result in ______.<br/>\n作者认为，FASB的规则变化可能导致什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部推断题。题干点名FASB的规则变更，并问作者判断的可能后果。<code>According to the author</code>不能替换成银行或游说团体的立场，<code>may</code>也不能扩大成已经确定发生的一切结果。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n<p>第2段先给出作者的总判断：银行游说奏效，准则制定者的独立性受损。第3段再写FASB在与国会交锋后匆忙改规则，并交代银行因此得到的自由与灵活性。这是总判断与具体事例之间的关系；由此可以把“独立性受损”落到FASB身上。</p>\n<h3>A. the diminishing role of management</h3>\n<blockquote>\n<p>管理层作用减弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们把<code>diminishing role of management</code>与第3段末尾的<code>enhance ... the use of judgment by management</code>对比，并看到银行获得<code>more freedom</code>。增强与减弱方向相反，因此第一轮排除A，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A借用<code>management</code>，把规则变更增强管理层判断空间改成削弱管理层作用。它保留了同一主体，却把变化方向反了过来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致管理层作用减弱。</p>\n</blockquote>\n<p>题干的<code>rule changes</code>对应第3段的<code>These</code>和<code>the changes</code>，A的<code>management</code>对应段末的<code>judgment by management</code>。两处把“什么变化影响谁”都定位清楚了。</p>\n<p>第3段先写银行得到更多使用模型的自由和确认损失的灵活性，末句再说这些变化增强了管理层判断的使用。两句都指向判断余地扩大。</p>\n<p>原文动作是<code>gave ... more freedom</code>和<code>enhance</code>，A的动作方向却是<code>diminishing</code>。管理层与FASB也不是同一主体：银行管理层得到更多空间，不等于准则制定机构自身更加独立。</p>\n<p>A把增大改成减小，不能因为两边都出现<code>management</code>就把这种反向变化当成同义改写。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n<p>规则放宽使银行和管理层拥有更多估值、确认损失的判断空间。</p>\n</blockquote>\n<p>段末的<code>Yet</code>把主席的辩护与银行受益放在一起；作者接着看到的是银行股上涨和管理层判断得到增强，不是管理层被限制。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The changes reduce the use of judgment by management.</p>\n<p>这些变化减少了管理层判断的使用。</p>\n</blockquote>\n<p>假设写法只有把<code>enhance</code>换成减少，才能支持A。实际文章两个层面的“更多”都与它相反。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>the diminishing role of management<br/>\n管理层作用减弱</p>\n</blockquote>\n<p>作者反对向银行压力让步，实际例子是银行获得更多估值自由，准则制定者独立性受损。A说银行管理层作用减弱，既不符合这一让步方向，也与局部的<code>enhance</code>相反。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. the revival of the banking system</h3>\n<blockquote>\n<p>银行系统的复苏</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B是完整选项。第2段相关句子仍有遮挡，我们主要读清了<code>unless</code>和“价格吸引买家”这个条件，再与第3段银行得到更多估值自由作比较。做题时没有把自由增加当成复苏条件已满足，第一轮排除B，后续未改变。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用银行股上涨、估值更自由以及文中出现的“重振银行系统”，诱导读者补出“改规则会带来复苏”。但原文将复苏与资产标价能否吸引买家相连，没有写估值自由增加就会满足这个条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行系统的复苏。</p>\n</blockquote>\n<p>B的<code>revival of the banking system</code>对应第2段的<code>reviving the banking system</code>。定位到同一目标以后，还必须检查题干规定的原因——FASB规则变更——是否被原文接到这个结果上。</p>\n<p>第2段说没有吸引买家的价格，复苏会困难；第6段又说收购计划要奏效，银行必须把资产标到买家觉得合适的水平。第3段只说银行得到更自由的模型估值和确认损失方式。</p>\n<p>资产价格能吸引买家是一项条件，银行能更自由地估值是另一件事。文本没有说规则变更会使价格降到买家愿意接受的水平，也没有把银行股上涨当成整个银行体系已经恢复。</p>\n<p>B增加了“规则变化促成体系复苏”的因果关系。原文提供的是必须满足的估值条件，而不是这项规则变化已经具备或将会产生的复苏效果。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n<p>体系恢复和收购计划能否奏效，都取决于银行能否用吸引买家的价格给资产记价。</p>\n</blockquote>\n<p>作者在结尾再次重复价格条件，并要求确认和处理损失，没有用“管理层判断空间变大”代替这些步骤。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The rule changes will help revive the banking system by bringing asset prices to levels that attract buyers.</p>\n<p>规则变更会使资产价格达到吸引买家的水平，从而帮助银行系统复苏。</p>\n</blockquote>\n<p>要支持B，至少需要这座从变更到可成交价格、再到复苏的桥。实际文章没有搭这座桥，反而担心让步损害独立性。银行股上涨也不能替代整套条件。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>the revival of the banking system<br/>\n银行系统的复苏</p>\n</blockquote>\n<p>作者同情准则制定者并警告其让步，是因为独立估值和确认损失不能让位于银行偏好。B却把让步写成复苏的利好；这个正面后果既不是全文判断，也缺少局部所要求的买家价格条件。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. the banks’ long-term asset losses</h3>\n<blockquote>\n<p>银行的长期资产损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C显示为<code>the banks’ [xxx] asset losses</code>。我们用可读的<code>asset losses</code>回到第3段，看到规则增加的是<code>flexibility in recognizing losses</code>，不是制造损失。即使修饰词当时没有读出，这个因果差别也足够使C在第一轮被排除，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>recognizing losses on long-term assets</code>里的损失对象搬出来，接在题干的<code>result in</code>后面，就变成规则变更造成长期资产损失。原文写的是损失如何确认，选项写的是损失如何发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行的长期资产损失。</p>\n</blockquote>\n<p>题干问<code>rule changes ... result in</code>，所以不能只核对名词<code>long-term assets</code>和<code>losses</code>。应看第3段的规则变更到底给银行带来了哪种变化。</p>\n<p>原句有两个并列结果：更多估值自由，以及在损益表中确认长期资产损失时更多的灵活性。<code>losses</code>处在确认动作的宾语位置。</p>\n<p>原文的变化对象是确认方式的灵活性，不是长期资产价值本身。C与题干连接以后，损失从“需要确认的对象”变成“规则变化造成的结果”。</p>\n<p>这就是C改坏的因果：调整损失确认方式，不等于规则本身使资产发生损失。两边出现同一个<code>losses</code>，也不能抹掉这个差别。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>规则变更使银行在损益表中确认长期资产损失时拥有更多灵活性。</p>\n</blockquote>\n<p>作者具体展开的是估值和会计处理的自由增加，再写银行股上涨；没有接着解释新规则怎样毁损长期资产价值。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rule changes cause banks to suffer losses on their long-term assets.</p>\n<p>这些规则变更导致银行的长期资产发生损失。</p>\n</blockquote>\n<p>假设句必须把规则写成损失的成因，而实际原文只把损失放在<code>recognizing</code>后。确认动作与损失成因不能互换。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>the banks’ long-term asset losses<br/>\n银行的长期资产损失</p>\n</blockquote>\n<p>全文认为损失应被如实确认和处理，不能通过让步躲开。C却把问题说成规则变更造成了资产损失。本项最终由<code>more flexibility in recognizing losses</code>坐实：变更改变的是确认余地，不是这类损失的来源。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. the weakening of its independence</h3>\n<blockquote>\n<p>其独立性被削弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们先读到第2段制定者的<code>independence ... is being compromised</code>，再把第3段FASB在国会交锋后匆忙改规则接上。第2段给总判断，第3段给表现，因此第一轮保留D；A、B、C排除后，D的状态没有改变。</p>\n<p><strong>选项类型：正确跨段概括。</strong></p>\n<p>D用<code>weakening</code>改写<code>being compromised</code>，并把准则制定者这一总称落实到FASB。它没有把银行管理层获得的自由误当成FASB的独立性，而是抓住压力与让步之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致其独立性被削弱。</p>\n</blockquote>\n<p>D的<code>independence</code>在第2段直接出现；题干指定的FASB在第3段出现。两段不是互不相关的信息，而是总判断在前、美国机构的实例在后。</p>\n<p>第2段先说银行游说正在奏效，随即说准则制定者独立性受损。第3段写FASB在与国会激烈交锋之后匆忙通过规则变更，把“施压奏效”写成可见的机构行动。</p>\n<p>D中的<code>its</code>回指FASB，不是银行或管理层。<code>the weakening</code>保留了受损方向；接到题干的<code>may result in</code>后，仍是对变更可能后果的判断，没有扩大为机构失去全部独立性。</p>\n<p>D由前段的总评价和后段的具体行为共同支持，跨段只是落实同一个判断的对象，并没有另添不相干的后果。</p>\n<h4>写作视角法</h4>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n<p>But by giving in to critics now they are inviting pressure to make more concessions.</p>\n<p>独立性正在受损；FASB在压力后匆忙改规则；结尾又警告让步会引来更大的让步压力。</p>\n</blockquote>\n<p>文章从总评价走到FASB的具体行动，最后再提醒继续退让的代价。这些内容连续围绕独立决策能否守住展开。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By changing its rules under pressure, the FASB risks weakening its independence.</p>\n<p>FASB在压力下修改规则，可能削弱自身独立性。</p>\n</blockquote>\n<p>D所要求的推进已经存在：外部压力促成变更，作者担心独立性受损，结尾警告继续让步。假设句只是把这几处关系接在一起。</p>\n<h4>主旨交叉验证法</h4>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>the weakening of its independence<br/>\n其独立性被削弱</p>\n</blockquote>\n<p>作者同情并支持独立、强硬的制定者，所以对其在压力下改规则的后果，关注的正是独立地位被侵蚀。D与这个担忧同向；第2段的<code>is being compromised</code>和第3段的国会压力进一步把它落到FASB。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>37题结论</h3>\n<blockquote>\n<p><strong>37. D. the weakening of its independence</strong></p>\n</blockquote>\n<p>A把管理层判断空间增强改成作用减弱。</p>\n<p>B从估值自由增加推演出体系复苏，缺少买家价格条件的支持。</p>\n<p>C把确认损失的灵活性改成规则造成损失。</p>\n<p>D用第2段的独立性受损总判断概括第3段FASB的受压让步。</p>\n<h2>38题</h2>\n<blockquote>\n<p>According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.<br/>\n根据第4段，McCreevy反对IASB试图做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干限定第4段，要求从McCreevy的警告反推他反对IASB的哪种做法。必须把欧洲方面的要求、IASB自己的回应和McCreevy的威胁连起来，不能把警告里的一个词直接当成IASB已经表明的目标。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IA
