e.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行系统的复苏。</p>\n</blockquote>\n<p>B的<code>revival of the banking system</code>对应第2段的<code>reviving the banking system</code>。定位到同一目标以后，还必须检查题干规定的原因——FASB规则变更——是否被原文接到这个结果上。</p>\n<p>第2段说没有吸引买家的价格，复苏会困难；第6段又说收购计划要奏效，银行必须把资产标到买家觉得合适的水平。第3段只说银行得到更自由的模型估值和确认损失方式。</p>\n<p>资产价格能吸引买家是一项条件，银行能更自由地估值是另一件事。文本没有说规则变更会使价格降到买家愿意接受的水平，也没有把银行股上涨当成整个银行体系已经恢复。</p>\n<p>B增加了“规则变化促成体系复苏”的因果关系。原文提供的是必须满足的估值条件，而不是这项规则变化已经具备或将会产生的复苏效果。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-B-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n<p>体系恢复和收购计划能否奏效，都取决于银行能否用吸引买家的价格给资产记价。</p>\n</blockquote>\n<p>作者在结尾再次重复价格条件，并要求确认和处理损失，没有用“管理层判断空间变大”代替这些步骤。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The rule changes will help revive the banking system by bringing asset prices to levels that attract buyers.</p>\n<p>规则变更会使资产价格达到吸引买家的水平，从而帮助银行系统复苏。</p>\n</blockquote>\n<p>要支持B，至少需要这座从变更到可成交价格、再到复苏的桥。实际文章没有搭这座桥，反而担心让步损害独立性。银行股上涨也不能替代整套条件。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false},"focusId":"focus-q37-B-2"},{"title":"B. the revival of the banking system","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入37题题干：\n\n> 作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。\n\n但B实际说的是：\n\n> the revival of the banking system  \n> 银行系统的复苏\n\n作者同情准则制定者并警告其让步，是因为独立估值和确认损失不能让位于银行偏好。B却把让步写成复苏的利好；这个正面后果既不是全文判断，也缺少局部所要求的买家价格条件。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>银行系统的复苏</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B是完整选项。第2段相关句子仍有遮挡，我们主要读清了<code>unless</code>和“价格吸引买家”这个条件，再与第3段银行得到更多估值自由作比较。做题时没有把自由增加当成复苏条件已满足，第一轮排除B，后续未改变。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用银行股上涨、估值更自由以及文中出现的“重振银行系统”，诱导读者补出“改规则会带来复苏”。但原文将复苏与资产标价能否吸引买家相连，没有写估值自由增加就会满足这个条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行系统的复苏。</p>\n</blockquote>\n<p>B的<code>revival of the banking system</code>对应第2段的<code>reviving the banking system</code>。定位到同一目标以后，还必须检查题干规定的原因——FASB规则变更——是否被原文接到这个结果上。</p>\n<p>第2段说没有吸引买家的价格，复苏会困难；第6段又说收购计划要奏效，银行必须把资产标到买家觉得合适的水平。第3段只说银行得到更自由的模型估值和确认损失方式。</p>\n<p>资产价格能吸引买家是一项条件，银行能更自由地估值是另一件事。文本没有说规则变更会使价格降到买家愿意接受的水平，也没有把银行股上涨当成整个银行体系已经恢复。</p>\n<p>B增加了“规则变化促成体系复苏”的因果关系。原文提供的是必须满足的估值条件，而不是这项规则变化已经具备或将会产生的复苏效果。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-B-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n<p>体系恢复和收购计划能否奏效，都取决于银行能否用吸引买家的价格给资产记价。</p>\n</blockquote>\n<p>作者在结尾再次重复价格条件，并要求确认和处理损失，没有用“管理层判断空间变大”代替这些步骤。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The rule changes will help revive the banking system by bringing asset prices to levels that attract buyers.</p>\n<p>规则变更会使资产价格达到吸引买家的水平，从而帮助银行系统复苏。</p>\n</blockquote>\n<p>要支持B，至少需要这座从变更到可成交价格、再到复苏的桥。实际文章没有搭这座桥，反而担心让步损害独立性。银行股上涨也不能替代整套条件。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-B-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>the revival of the banking system<br/>\n银行系统的复苏</p>\n</blockquote>\n<p>作者同情准则制定者并警告其让步，是因为独立估值和确认损失不能让位于银行偏好。B却把让步写成复苏的利好；这个正面后果既不是全文判断，也缺少局部所要求的买家价格条件。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":true},"focusId":"focus-q37-B-3"},{"title":"C. the banks’ long-term asset losses","level":3,"section":"第三鸟 · 题目复盘","raw":"### C. the banks’ long-term asset losses\n\n> 银行的长期资产损失\n\n**做题模式中的状态：**当时C显示为`the banks’ [xxx] asset losses`。我们用可读的`asset losses`回到第3段，看到规则增加的是`flexibility in recognizing losses`，不是制造损失。即使修饰词当时没有读出，这个因果差别也足够使C在第一轮被排除，后来没有改判。\n\n**错误类型：第一类——歪曲原意。**\n\nC把`recognizing losses on long-term assets`里的损失对象搬出来，接在题干的`result in`后面，就变成规则变更造成长期资产损失。原文写的是损失如何确认，选项写的是损失如何发生。\n\n**出处：**\n\n> These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>银行的长期资产损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C显示为<code>the banks’ [xxx] asset losses</code>。我们用可读的<code>asset losses</code>回到第3段，看到规则增加的是<code>flexibility in recognizing losses</code>，不是制造损失。即使修饰词当时没有读出，这个因果差别也足够使C在第一轮被排除，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>recognizing losses on long-term assets</code>里的损失对象搬出来，接在题干的<code>result in</code>后面，就变成规则变更造成长期资产损失。原文写的是损失如何确认，选项写的是损失如何发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false},"focusId":"focus-q37-C-0"},{"title":"C. the banks’ long-term asset losses","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为，FASB的规则变化可能导致银行的长期资产损失。\n\n题干问`rule changes ... result in`，所以不能只核对名词`long-term assets`和`losses`。应看第3段的规则变更到底给银行带来了哪种变化。\n\n原句有两个并列结果：更多估值自由，以及在损益表中确认长期资产损失时更多的灵活性。`losses`处在确认动作的宾语位置。\n\n原文的变化对象是确认方式的灵活性，不是长期资产价值本身。C与题干连接以后，损失从“需要确认的对象”变成“规则变化造成的结果”。\n\n这就是C改坏的因果：调整损失确认方式，不等于规则本身使资产发生损失。两边出现同一个`losses`，也不能抹掉这个差别。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>银行的长期资产损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C显示为<code>the banks’ [xxx] asset losses</code>。我们用可读的<code>asset losses</code>回到第3段，看到规则增加的是<code>flexibility in recognizing losses</code>，不是制造损失。即使修饰词当时没有读出，这个因果差别也足够使C在第一轮被排除，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>recognizing losses on long-term assets</code>里的损失对象搬出来，接在题干的<code>result in</code>后面，就变成规则变更造成长期资产损失。原文写的是损失如何确认，选项写的是损失如何发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行的长期资产损失。</p>\n</blockquote>\n<p>题干问<code>rule changes ... result in</code>，所以不能只核对名词<code>long-term assets</code>和<code>losses</code>。应看第3段的规则变更到底给银行带来了哪种变化。</p>\n<p>原句有两个并列结果：更多估值自由，以及在损益表中确认长期资产损失时更多的灵活性。<code>losses</code>处在确认动作的宾语位置。</p>\n<p>原文的变化对象是确认方式的灵活性，不是长期资产价值本身。C与题干连接以后，损失从“需要确认的对象”变成“规则变化造成的结果”。</p>\n<p>这就是C改坏的因果：调整损失确认方式，不等于规则本身使资产发生损失。两边出现同一个<code>losses</code>，也不能抹掉这个差别。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false},"focusId":"focus-q37-C-1"},{"title":"C. the banks’ long-term asset losses","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.\n>\n> 规则变更使银行在损益表中确认长期资产损失时拥有更多灵活性。\n\n作者具体展开的是估值和会计处理的自由增加，再写银行股上涨；没有接着解释新规则怎样毁损长期资产价值。\n\n如果C真是作者的意思，文章至少得写成：\n\n> These rule changes cause banks to suffer losses on their long-term assets.\n>\n> 这些规则变更导致银行的长期资产发生损失。\n\n假设句必须把规则写成损失的成因，而实际原文只把损失放在`recognizing`后。确认动作与损失成因不能互换。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>银行的长期资产损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C显示为<code>the banks’ [xxx] asset losses</code>。我们用可读的<code>asset losses</code>回到第3段，看到规则增加的是<code>flexibility in recognizing losses</code>，不是制造损失。即使修饰词当时没有读出，这个因果差别也足够使C在第一轮被排除，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>recognizing losses on long-term assets</code>里的损失对象搬出来，接在题干的<code>result in</code>后面，就变成规则变更造成长期资产损失。原文写的是损失如何确认，选项写的是损失如何发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行的长期资产损失。</p>\n</blockquote>\n<p>题干问<code>rule changes ... result in</code>，所以不能只核对名词<code>long-term assets</code>和<code>losses</code>。应看第3段的规则变更到底给银行带来了哪种变化。</p>\n<p>原句有两个并列结果：更多估值自由，以及在损益表中确认长期资产损失时更多的灵活性。<code>losses</code>处在确认动作的宾语位置。</p>\n<p>原文的变化对象是确认方式的灵活性，不是长期资产价值本身。C与题干连接以后，损失从“需要确认的对象”变成“规则变化造成的结果”。</p>\n<p>这就是C改坏的因果：调整损失确认方式，不等于规则本身使资产发生损失。两边出现同一个<code>losses</code>，也不能抹掉这个差别。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>规则变更使银行在损益表中确认长期资产损失时拥有更多灵活性。</p>\n</blockquote>\n<p>作者具体展开的是估值和会计处理的自由增加，再写银行股上涨；没有接着解释新规则怎样毁损长期资产价值。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rule changes cause banks to suffer losses on their long-term assets.</p>\n<p>这些规则变更导致银行的长期资产发生损失。</p>\n</blockquote>\n<p>假设句必须把规则写成损失的成因，而实际原文只把损失放在<code>recognizing</code>后。确认动作与损失成因不能互换。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false},"focusId":"focus-q37-C-2"},{"title":"C. the banks’ long-term asset losses","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入37题题干：\n\n> 作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。\n\n但C实际说的是：\n\n> the banks’ long-term asset losses  \n> 银行的长期资产损失\n\n全文认为损失应被如实确认和处理，不能通过让步躲开。C却把问题说成规则变更造成了资产损失。本项最终由`more flexibility in recognizing losses`坐实：变更改变的是确认余地，不是这类损失的来源。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>银行的长期资产损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C显示为<code>the banks’ [xxx] asset losses</code>。我们用可读的<code>asset losses</code>回到第3段，看到规则增加的是<code>flexibility in recognizing losses</code>，不是制造损失。即使修饰词当时没有读出，这个因果差别也足够使C在第一轮被排除，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>recognizing losses on long-term assets</code>里的损失对象搬出来，接在题干的<code>result in</code>后面，就变成规则变更造成长期资产损失。原文写的是损失如何确认，选项写的是损失如何发生。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行的长期资产损失。</p>\n</blockquote>\n<p>题干问<code>rule changes ... result in</code>，所以不能只核对名词<code>long-term assets</code>和<code>losses</code>。应看第3段的规则变更到底给银行带来了哪种变化。</p>\n<p>原句有两个并列结果：更多估值自由，以及在损益表中确认长期资产损失时更多的灵活性。<code>losses</code>处在确认动作的宾语位置。</p>\n<p>原文的变化对象是确认方式的灵活性，不是长期资产价值本身。C与题干连接以后，损失从“需要确认的对象”变成“规则变化造成的结果”。</p>\n<p>这就是C改坏的因果：调整损失确认方式，不等于规则本身使资产发生损失。两边出现同一个<code>losses</code>，也不能抹掉这个差别。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>规则变更使银行在损益表中确认长期资产损失时拥有更多灵活性。</p>\n</blockquote>\n<p>作者具体展开的是估值和会计处理的自由增加，再写银行股上涨；没有接着解释新规则怎样毁损长期资产价值。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rule changes cause banks to suffer losses on their long-term assets.</p>\n<p>这些规则变更导致银行的长期资产发生损失。</p>\n</blockquote>\n<p>假设句必须把规则写成损失的成因，而实际原文只把损失放在<code>recognizing</code>后。确认动作与损失成因不能互换。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-C-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>the banks’ long-term asset losses<br/>\n银行的长期资产损失</p>\n</blockquote>\n<p>全文认为损失应被如实确认和处理，不能通过让步躲开。C却把问题说成规则变更造成了资产损失。本项最终由<code>more flexibility in recognizing losses</code>坐实：变更改变的是确认余地，不是这类损失的来源。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":true},"focusId":"focus-q37-C-3"},{"title":"D. the weakening of its independence","level":3,"section":"第三鸟 · 题目复盘","raw":"### D. the weakening of its independence\n\n> 其独立性被削弱\n\n**做题模式中的状态：**当时D没有遮挡。我们先读到第2段制定者的`independence ... is being compromised`，再把第3段FASB在国会交锋后匆忙改规则接上。第2段给总判断，第3段给表现，因此第一轮保留D；A、B、C排除后，D的状态没有改变。\n\n**选项类型：正确跨段概括。**\n\nD用`weakening`改写`being compromised`，并把准则制定者这一总称落实到FASB。它没有把银行管理层获得的自由误当成FASB的独立性，而是抓住压力与让步之间的关系。\n\n**出处：**\n\n> Unfortunately, banks' lobbying now seems to be working.\n>\n> The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.\n>\n> After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>其独立性被削弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们先读到第2段制定者的<code>independence ... is being compromised</code>，再把第3段FASB在国会交锋后匆忙改规则接上。第2段给总判断，第3段给表现，因此第一轮保留D；A、B、C排除后，D的状态没有改变。</p>\n<p><strong>选项类型：正确跨段概括。</strong></p>\n<p>D用<code>weakening</code>改写<code>being compromised</code>，并把准则制定者这一总称落实到FASB。它没有把银行管理层获得的自由误当成FASB的独立性，而是抓住压力与让步之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false},"focusId":"focus-q37-D-0"},{"title":"D. the weakening of its independence","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者认为，FASB的规则变化可能导致其独立性被削弱。\n\nD的`independence`在第2段直接出现；题干指定的FASB在第3段出现。两段不是互不相关的信息，而是总判断在前、美国机构的实例在后。\n\n第2段先说银行游说正在奏效，随即说准则制定者独立性受损。第3段写FASB在与国会激烈交锋之后匆忙通过规则变更，把“施压奏效”写成可见的机构行动。\n\nD中的`its`回指FASB，不是银行或管理层。`the weakening`保留了受损方向；接到题干的`may result in`后，仍是对变更可能后果的判断，没有扩大为机构失去全部独立性。\n\nD由前段的总评价和后段的具体行为共同支持，跨段只是落实同一个判断的对象，并没有另添不相干的后果。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>其独立性被削弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们先读到第2段制定者的<code>independence ... is being compromised</code>，再把第3段FASB在国会交锋后匆忙改规则接上。第2段给总判断，第3段给表现，因此第一轮保留D；A、B、C排除后，D的状态没有改变。</p>\n<p><strong>选项类型：正确跨段概括。</strong></p>\n<p>D用<code>weakening</code>改写<code>being compromised</code>，并把准则制定者这一总称落实到FASB。它没有把银行管理层获得的自由误当成FASB的独立性，而是抓住压力与让步之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致其独立性被削弱。</p>\n</blockquote>\n<p>D的<code>independence</code>在第2段直接出现；题干指定的FASB在第3段出现。两段不是互不相关的信息，而是总判断在前、美国机构的实例在后。</p>\n<p>第2段先说银行游说正在奏效，随即说准则制定者独立性受损。第3段写FASB在与国会激烈交锋之后匆忙通过规则变更，把“施压奏效”写成可见的机构行动。</p>\n<p>D中的<code>its</code>回指FASB，不是银行或管理层。<code>the weakening</code>保留了受损方向；接到题干的<code>may result in</code>后，仍是对变更可能后果的判断，没有扩大为机构失去全部独立性。</p>\n<p>D由前段的总评价和后段的具体行为共同支持，跨段只是落实同一个判断的对象，并没有另添不相干的后果。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false},"focusId":"focus-q37-D-1"},{"title":"D. the weakening of its independence","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.\n>\n> After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.\n>\n> But by giving in to critics now they are inviting pressure to make more concessions.\n>\n> 独立性正在受损；FASB在压力后匆忙改规则；结尾又警告让步会引来更大的让步压力。\n\n文章从总评价走到FASB的具体行动，最后再提醒继续退让的代价。这些内容连续围绕独立决策能否守住展开。\n\n如果D真是作者的意思，文章至少得写成：\n\n> By changing its rules under pressure, the FASB risks weakening its independence.\n>\n> FASB在压力下修改规则，可能削弱自身独立性。\n\nD所要求的推进已经存在：外部压力促成变更，作者担心独立性受损，结尾警告继续让步。假设句只是把这几处关系接在一起。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>其独立性被削弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们先读到第2段制定者的<code>independence ... is being compromised</code>，再把第3段FASB在国会交锋后匆忙改规则接上。第2段给总判断，第3段给表现，因此第一轮保留D；A、B、C排除后，D的状态没有改变。</p>\n<p><strong>选项类型：正确跨段概括。</strong></p>\n<p>D用<code>weakening</code>改写<code>being compromised</code>，并把准则制定者这一总称落实到FASB。它没有把银行管理层获得的自由误当成FASB的独立性，而是抓住压力与让步之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致其独立性被削弱。</p>\n</blockquote>\n<p>D的<code>independence</code>在第2段直接出现；题干指定的FASB在第3段出现。两段不是互不相关的信息，而是总判断在前、美国机构的实例在后。</p>\n<p>第2段先说银行游说正在奏效，随即说准则制定者独立性受损。第3段写FASB在与国会激烈交锋之后匆忙通过规则变更，把“施压奏效”写成可见的机构行动。</p>\n<p>D中的<code>its</code>回指FASB，不是银行或管理层。<code>the weakening</code>保留了受损方向；接到题干的<code>may result in</code>后，仍是对变更可能后果的判断，没有扩大为机构失去全部独立性。</p>\n<p>D由前段的总评价和后段的具体行为共同支持，跨段只是落实同一个判断的对象，并没有另添不相干的后果。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n<p>But by giving in to critics now they are inviting pressure to make more concessions.</p>\n<p>独立性正在受损；FASB在压力后匆忙改规则；结尾又警告让步会引来更大的让步压力。</p>\n</blockquote>\n<p>文章从总评价走到FASB的具体行动，最后再提醒继续退让的代价。这些内容连续围绕独立决策能否守住展开。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By changing its rules under pressure, the FASB risks weakening its independence.</p>\n<p>FASB在压力下修改规则，可能削弱自身独立性。</p>\n</blockquote>\n<p>D所要求的推进已经存在：外部压力促成变更，作者担心独立性受损，结尾警告继续让步。假设句只是把这几处关系接在一起。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false},"focusId":"focus-q37-D-2"},{"title":"D. the weakening of its independence","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入37题题干：\n\n> 作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。\n\nD实际说的是：\n\n> the weakening of its independence  \n> 其独立性被削弱\n\n作者同情并支持独立、强硬的制定者，所以对其在压力下改规则的后果，关注的正是独立地位被侵蚀。D与这个担忧同向；第2段的`is being compromised`和第3段的国会压力进一步把它落到FASB。\n\n**复盘判断：D正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>其独立性被削弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们先读到第2段制定者的<code>independence ... is being compromised</code>，再把第3段FASB在国会交锋后匆忙改规则接上。第2段给总判断，第3段给表现，因此第一轮保留D；A、B、C排除后，D的状态没有改变。</p>\n<p><strong>选项类型：正确跨段概括。</strong></p>\n<p>D用<code>weakening</code>改写<code>being compromised</code>，并把准则制定者这一总称落实到FASB。它没有把银行管理层获得的自由误当成FASB的独立性，而是抓住压力与让步之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致其独立性被削弱。</p>\n</blockquote>\n<p>D的<code>independence</code>在第2段直接出现；题干指定的FASB在第3段出现。两段不是互不相关的信息，而是总判断在前、美国机构的实例在后。</p>\n<p>第2段先说银行游说正在奏效，随即说准则制定者独立性受损。第3段写FASB在与国会激烈交锋之后匆忙通过规则变更，把“施压奏效”写成可见的机构行动。</p>\n<p>D中的<code>its</code>回指FASB，不是银行或管理层。<code>the weakening</code>保留了受损方向；接到题干的<code>may result in</code>后，仍是对变更可能后果的判断，没有扩大为机构失去全部独立性。</p>\n<p>D由前段的总评价和后段的具体行为共同支持，跨段只是落实同一个判断的对象，并没有另添不相干的后果。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n<p>But by giving in to critics now they are inviting pressure to make more concessions.</p>\n<p>独立性正在受损；FASB在压力后匆忙改规则；结尾又警告让步会引来更大的让步压力。</p>\n</blockquote>\n<p>文章从总评价走到FASB的具体行动，最后再提醒继续退让的代价。这些内容连续围绕独立决策能否守住展开。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By changing its rules under pressure, the FASB risks weakening its independence.</p>\n<p>FASB在压力下修改规则，可能削弱自身独立性。</p>\n</blockquote>\n<p>D所要求的推进已经存在：外部压力促成变更，作者担心独立性受损，结尾警告继续让步。假设句只是把这几处关系接在一起。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-D-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>the weakening of its independence<br/>\n其独立性被削弱</p>\n</blockquote>\n<p>作者同情并支持独立、强硬的制定者，所以对其在压力下改规则的后果，关注的正是独立地位被侵蚀。D与这个担忧同向；第2段的<code>is being compromised</code>和第3段的国会压力进一步把它落到FASB。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true},"focusId":"focus-q37-D-3"},{"title":"37题结论","level":3,"section":"第三鸟 · 题目复盘","raw":"### 37题结论\n\n> **37. D. the weakening of its independence**\n\nA把管理层判断空间增强改成作用减弱。\n\nB从估值自由增加推演出体系复苏，缺少买家价格条件的支持。\n\nC把确认损失的灵活性改成规则造成损失。\n\nD用第2段的独立性受损总判断概括第3段FASB的受压让步。","html":"<blockquote>\n<p><strong>37. D. the weakening of its independence</strong></p>\n</blockquote>\n<p>A把管理层判断空间增强改成作用减弱。</p>\n<p>B从估值自由增加推演出体系复苏，缺少买家价格条件的支持。</p>\n<p>C把确认损失的灵活性改成规则造成损失。</p>\n<p>D用第2段的独立性受损总判断概括第3段FASB的受压让步。</p>\n","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"conclusion","question":"37","questionConclusion":true}},{"title":"38题 · 题干、题型与核心出处","level":2,"section":"第三鸟 · 题目复盘","raw":"## 38题\n\n> According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.  \n> 根据第4段，McCreevy反对IASB试图做什么？\n\n### 题型\n\n具体细节题。题干限定第4段，要求从McCreevy的警告反推他反对IASB的哪种做法。必须把欧洲方面的要求、IASB自己的回应和McCreevy的威胁连起来，不能把警告里的一个词直接当成IASB已经表明的目标。\n\n### 核心出处\n\n> European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.\n>\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.\n\n欧洲部长先要求IASB“也这样做”，IASB则表示不愿在缺少整体规划时行动。McCreevy接着用“不生活在政治真空中”和“欧洲可以制定不同规则”施压。因此，分歧落在IASB能否按照自己的规划和判断制定规则，而不只是某个时间词或政治词是否出现。","html":"<blockquote>\n<p>According to Paragraph 4, McCreevy objects to the IASB’s attempt to ______.<br/>\n根据第4段，McCreevy反对IASB试图做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干限定第4段，要求从McCreevy的警告反推他反对IASB的哪种做法。必须把欧洲方面的要求、IASB自己的回应和McCreevy的威胁连起来，不能把警告里的一个词直接当成IASB已经表明的目标。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n<p>欧洲部长先要求IASB“也这样做”，IASB则表示不愿在缺少整体规划时行动。McCreevy接着用“不生活在政治真空中”和“欧洲可以制定不同规则”施压。因此，分歧落在IASB能否按照自己的规划和判断制定规则，而不只是某个时间词或政治词是否出现。</p>\n","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"question","question":"38","questionIntro":true}},{"title":"A. keep away from political influences","level":3,"section":"第三鸟 · 题目复盘","raw":"### A. keep away from political influences\n\n> 避开政治影响\n\n**做题模式中的状态：**当时A没有遮挡，原文`political`后仍显示`[xxx]`。我们没有只凭相同的政治话题作判断，而是比较IASB自己说的“没有整体规划就不行动”和McCreevy的警告。做题材料认为不能把对方的施压措辞反推成IASB明确追求的目标，第一轮排除A，随后没有改判。\n\n**错误类型：第一类——歪曲原意。**\n\nA把McCreevy警告中的“政治真空”转换成IASB自己的行动目标。这个短语确实体现政治施压，但题干问他反对IASB试图做什么；必须回到制定规则的具体分歧，不能把施压话语直接当作被施压者的自我声明。\n\n**出处：**\n\n> European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.\n>\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>避开政治影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡，原文<code>political</code>后仍显示<code>[xxx]</code>。我们没有只凭相同的政治话题作判断，而是比较IASB自己说的“没有整体规划就不行动”和McCreevy的警告。做题材料认为不能把对方的施压措辞反推成IASB明确追求的目标，第一轮排除A，随后没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A把McCreevy警告中的“政治真空”转换成IASB自己的行动目标。这个短语确实体现政治施压，但题干问他反对IASB试图做什么；必须回到制定规则的具体分歧，不能把施压话语直接当作被施压者的自我声明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false},"focusId":"focus-q38-A-0"},{"title":"A. keep away from political influences","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第4段，McCreevy反对IASB试图避开政治影响。\n\nA的`political influences`使人回到`not live in a political vacuum`，但这句话的说话人是McCreevy。题干同时要求识别IASB的`attempt`，所以还要找IASB自己的回应。\n\nIASB回应的是不想缺少整体规划就行动；欧洲部长要求它照着美国改，McCreevy又以欧洲可以制定不同规则施压。整段讨论的是规则应由谁按什么规划决定。\n\nA把警告所涉及的政治影响直接抽象成IASB要避开的对象。它没有保留`rule-setting`这一具体领域，也没有由机构自己的话证明“避开政治影响”就是此处被反对的尝试。\n\n因此，政治施压是原文的情境，却不能自动改写成IASB已经提出的行为目标。C把这个情境落实到自主制定规则，更准确地接住全段冲突。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>避开政治影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡，原文<code>political</code>后仍显示<code>[xxx]</code>。我们没有只凭相同的政治话题作判断，而是比较IASB自己说的“没有整体规划就不行动”和McCreevy的警告。做题材料认为不能把对方的施压措辞反推成IASB明确追求的目标，第一轮排除A，随后没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A把McCreevy警告中的“政治真空”转换成IASB自己的行动目标。这个短语确实体现政治施压，但题干问他反对IASB试图做什么；必须回到制定规则的具体分歧，不能把施压话语直接当作被施压者的自我声明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图避开政治影响。</p>\n</blockquote>\n<p>A的<code>political influences</code>使人回到<code>not live in a political vacuum</code>，但这句话的说话人是McCreevy。题干同时要求识别IASB的<code>attempt</code>，所以还要找IASB自己的回应。</p>\n<p>IASB回应的是不想缺少整体规划就行动；欧洲部长要求它照着美国改，McCreevy又以欧洲可以制定不同规则施压。整段讨论的是规则应由谁按什么规划决定。</p>\n<p>A把警告所涉及的政治影响直接抽象成IASB要避开的对象。它没有保留<code>rule-setting</code>这一具体领域，也没有由机构自己的话证明“避开政治影响”就是此处被反对的尝试。</p>\n<p>因此，政治施压是原文的情境，却不能自动改写成IASB已经提出的行为目标。C把这个情境落实到自主制定规则，更准确地接住全段冲突。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false},"focusId":"focus-q38-A-1"},{"title":"A. keep away from political influences","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.\n>\n> IASB坚持整体规划，McCreevy则用政治现实和欧洲另订规则来警告它。\n\n警告的落点不是讨论机构应否退出政治生活，而是要求它在制定这套规则时响应欧洲的要求。末尾的`different rules`把具体争执范围再次点出来。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The IASB says it is trying to keep away from political influences, and McCreevy objects to that attempt.\n>\n> IASB说自己正试图避开政治影响，McCreevy反对这一尝试。\n\n支持A至少需要把避开政治影响确立为IASB的尝试。原文给它的自我陈述是整体规划，并用另一套规则的威胁回应。政治词能说明压力性质，不能替换完整的行为对象。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>避开政治影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡，原文<code>political</code>后仍显示<code>[xxx]</code>。我们没有只凭相同的政治话题作判断，而是比较IASB自己说的“没有整体规划就不行动”和McCreevy的警告。做题材料认为不能把对方的施压措辞反推成IASB明确追求的目标，第一轮排除A，随后没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A把McCreevy警告中的“政治真空”转换成IASB自己的行动目标。这个短语确实体现政治施压，但题干问他反对IASB试图做什么；必须回到制定规则的具体分歧，不能把施压话语直接当作被施压者的自我声明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图避开政治影响。</p>\n</blockquote>\n<p>A的<code>political influences</code>使人回到<code>not live in a political vacuum</code>，但这句话的说话人是McCreevy。题干同时要求识别IASB的<code>attempt</code>，所以还要找IASB自己的回应。</p>\n<p>IASB回应的是不想缺少整体规划就行动；欧洲部长要求它照着美国改，McCreevy又以欧洲可以制定不同规则施压。整段讨论的是规则应由谁按什么规划决定。</p>\n<p>A把警告所涉及的政治影响直接抽象成IASB要避开的对象。它没有保留<code>rule-setting</code>这一具体领域，也没有由机构自己的话证明“避开政治影响”就是此处被反对的尝试。</p>\n<p>因此，政治施压是原文的情境，却不能自动改写成IASB已经提出的行为目标。C把这个情境落实到自主制定规则，更准确地接住全段冲突。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>IASB坚持整体规划，McCreevy则用政治现实和欧洲另订规则来警告它。</p>\n</blockquote>\n<p>警告的落点不是讨论机构应否退出政治生活，而是要求它在制定这套规则时响应欧洲的要求。末尾的<code>different rules</code>把具体争执范围再次点出来。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The IASB says it is trying to keep away from political influences, and McCreevy objects to that attempt.</p>\n<p>IASB说自己正试图避开政治影响，McCreevy反对这一尝试。</p>\n</blockquote>\n<p>支持A至少需要把避开政治影响确立为IASB的尝试。原文给它的自我陈述是整体规划，并用另一套规则的威胁回应。政治词能说明压力性质，不能替换完整的行为对象。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false},"focusId":"focus-q38-A-2"},{"title":"A. keep away from political influences","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入38题题干：\n\n> 全文主旨只能确认作者支持准则制定者抵御压力，不能单独判断McCreevy反对IASB的哪种具体尝试。本题仍要把第4段的要求、回应与警告连起来。\n\n但A实际说的是：\n\n> keep away from political influences  \n> 避开政治影响\n\n全文支持准则制定者保持独立，使“政治影响”成为很容易联想到的话题；但主旨不能单独确定McCreevy反对的具体尝试。仍要用`do likewise`、`overall planning`与`develop different rules`判断：此处被争夺的是制定规则的自主决定权，而不是原文已经声明的避开政治影响目标。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>避开政治影响</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡，原文<code>political</code>后仍显示<code>[xxx]</code>。我们没有只凭相同的政治话题作判断，而是比较IASB自己说的“没有整体规划就不行动”和McCreevy的警告。做题材料认为不能把对方的施压措辞反推成IASB明确追求的目标，第一轮排除A，随后没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A把McCreevy警告中的“政治真空”转换成IASB自己的行动目标。这个短语确实体现政治施压，但题干问他反对IASB试图做什么；必须回到制定规则的具体分歧，不能把施压话语直接当作被施压者的自我声明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图避开政治影响。</p>\n</blockquote>\n<p>A的<code>political influences</code>使人回到<code>not live in a political vacuum</code>，但这句话的说话人是McCreevy。题干同时要求识别IASB的<code>attempt</code>，所以还要找IASB自己的回应。</p>\n<p>IASB回应的是不想缺少整体规划就行动；欧洲部长要求它照着美国改，McCreevy又以欧洲可以制定不同规则施压。整段讨论的是规则应由谁按什么规划决定。</p>\n<p>A把警告所涉及的政治影响直接抽象成IASB要避开的对象。它没有保留<code>rule-setting</code>这一具体领域，也没有由机构自己的话证明“避开政治影响”就是此处被反对的尝试。</p>\n<p>因此，政治施压是原文的情境，却不能自动改写成IASB已经提出的行为目标。C把这个情境落实到自主制定规则，更准确地接住全段冲突。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>IASB坚持整体规划，McCreevy则用政治现实和欧洲另订规则来警告它。</p>\n</blockquote>\n<p>警告的落点不是讨论机构应否退出政治生活，而是要求它在制定这套规则时响应欧洲的要求。末尾的<code>different rules</code>把具体争执范围再次点出来。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The IASB says it is trying to keep away from political influences, and McCreevy objects to that attempt.</p>\n<p>IASB说自己正试图避开政治影响，McCreevy反对这一尝试。</p>\n</blockquote>\n<p>支持A至少需要把避开政治影响确立为IASB的尝试。原文给它的自我陈述是整体规划，并用另一套规则的威胁回应。政治词能说明压力性质，不能替换完整的行为对象。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-A-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入38题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者支持准则制定者抵御压力，不能单独判断McCreevy反对IASB的哪种具体尝试。本题仍要把第4段的要求、回应与警告连起来。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>keep away from political influences<br/>\n避开政治影响</p>\n</blockquote>\n<p>全文支持准则制定者保持独立，使“政治影响”成为很容易联想到的话题；但主旨不能单独确定McCreevy反对的具体尝试。仍要用<code>do likewise</code>、<code>overall planning</code>与<code>develop different rules</code>判断：此处被争夺的是制定规则的自主决定权，而不是原文已经声明的避开政治影响目标。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":true},"focusId":"focus-q38-A-3"},{"title":"B. evade the pressure from their peers","level":3,"section":"第三鸟 · 题目复盘","raw":"### B. evade the pressure from their peers\n\n> 躲避来自同僚的压力\n\n**做题模式中的状态：**当时B显示为`evade the pressure from their [xxx]`。我们看到`pressure`确实在第4段出现，但没有用遮挡位置猜出压力来源，也没有把IASB要求整体规划改成逃避压力。第一轮排除B，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nB借用了第4段的`pressure`，却把来自欧洲部长和McCreevy的政治压力写成来自同僚的压力。它还把IASB按自身规划决定行动的立场写成逃避，与原文的主体关系和动作都不相同。\n\n**出处：**\n\n> European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.\n>\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-B-0\"><blockquote>\n<p>躲避来自同僚的压力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>evade the pressure from their [xxx]</code>。我们看到<code>pressure</code>确实在第4段出现，但没有用遮挡位置猜出压力来源，也没有把IASB要求整体规划改成逃避压力。第一轮排除B，后续没有改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了第4段的<code>pressure</code>，却把来自欧洲部长和McCreevy的政治压力写成来自同僚的压力。它还把IASB按自身规划决定行动的立场写成逃避，与原文的主体关系和动作都不相同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false},"focusId":"focus-q38-B-0"},{"title":"B. evade the pressure from their peers","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据第4段，McCreevy反对IASB试图躲避来自同僚的压力。\n\nB含有原文的`pressure`，但真正区分答案的是`from their peers`。应顺着第4段的主语逐句看是谁提出要求、谁回应、谁发出警告。\n\n提出`do likewise`要求的是欧洲部长；表达整体规划立场的是IASB；发出“不在政治真空”警告的是欧洲委员McCreevy。FASB只是前段已经改规则的机构，并没有在本段向IASB施压。\n\nB把压力来源换成`peers`，仿佛是同僚之间要求IASB服从。原文则明确列出政治人物，且用`warned`说明其警告行动；IASB的回应也是安排规则重建，不是文本所写的逃避行为。\n\n因此，不能把“段里有压力”缩短成“就是选项中的同僚压力”。这会丢掉谁向谁施压的核心关系。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-B-0\"><blockquote>\n<p>躲避来自同僚的压力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>evade the pressure from their [xxx]</code>。我们看到<code>pressure</code>确实在第4段出现，但没有用遮挡位置猜出压力来源，也没有把IASB要求整体规划改成逃避压力。第一轮排除B，后续没有改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了第4段的<code>pressure</code>，却把来自欧洲部长和McCreevy的政治压力写成来自同僚的压力。它还把IASB按自身规划决定行动的立场写成逃避，与原文的主体关系和动作都不相同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图躲避来自同僚的压力。</p>\n</blockquote>\n<p>B含有原文的<code>pressure</code>，但真正区分答案的是<code>from their peers</code>。应顺着第4段的主语逐句看是谁提出要求、谁回应、谁发出警告。</p>\n<p>提出<code>do likewise</code>要求的是欧洲部长；表达整体规划立场的是IASB；发出“不在政治真空”警告的是欧洲委员McCreevy。FASB只是前段已经改规则的机构，并没有在本段向IASB施压。</p>\n<p>B把压力来源换成<code>peers</code>，仿佛是同僚之间要求IASB服从。原文则明确列出政治人物，且用<code>warned</code>说明其警告行动；IASB的回应也是安排规则重建，不是文本所写的逃避行为。</p>\n<p>因此，不能把“段里有压力”缩短成“就是选项中的同僚压力”。这会丢掉谁向谁施压的核心关系。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false},"focusId":"focus-q38-B-1"},{"title":"B. evade the pressure from their peers","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.\n>\n> 欧洲部长要求IASB效仿，McCreevy以欧洲可以另订规则警告IASB。\n\n作者把美国之后的压力扩展到欧洲，具体呈现政治人物如何向准则机构施加要求，并没有转入准则机构同僚之间的争执。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The IASB is trying to evade pressure from fellow standard-setters, and McCreevy objects.\n>\n> IASB试图躲避来自其他准则制定者的压力，McCreevy对此反对。\n\n这段假设必须换入同僚作为施压者，才能使B的来源关系成立。实际段落列出的施压者是部长和欧洲委员，FASB并没有变成发出要求的一方。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-B-0\"><blockquote>\n<p>躲避来自同僚的压力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>evade the pressure from their [xxx]</code>。我们看到<code>pressure</code>确实在第4段出现，但没有用遮挡位置猜出压力来源，也没有把IASB要求整体规划改成逃避压力。第一轮排除B，后续没有改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了第4段的<code>pressure</code>，却把来自欧洲部长和McCreevy的政治压力写成来自同僚的压力。它还把IASB按自身规划决定行动的立场写成逃避，与原文的主体关系和动作都不相同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图躲避来自同僚的压力。</p>\n</blockquote>\n<p>B含有原文的<code>pressure</code>，但真正区分答案的是<code>from their peers</code>。应顺着第4段的主语逐句看是谁提出要求、谁回应、谁发出警告。</p>\n<p>提出<code>do likewise</code>要求的是欧洲部长；表达整体规划立场的是IASB；发出“不在政治真空”警告的是欧洲委员McCreevy。FASB只是前段已经改规则的机构，并没有在本段向IASB施压。</p>\n<p>B把压力来源换成<code>peers</code>，仿佛是同僚之间要求IASB服从。原文则明确列出政治人物，且用<code>warned</code>说明其警告行动；IASB的回应也是安排规则重建，不是文本所写的逃避行为。</p>\n<p>因此，不能把“段里有压力”缩短成“就是选项中的同僚压力”。这会丢掉谁向谁施压的核心关系。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-B-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>欧洲部长要求IASB效仿，McCreevy以欧洲可以另订规则警告IASB。</p>\n</blockquote>\n<p>作者把美国之后的压力扩展到欧洲，具体呈现政治人物如何向准则机构施加要求，并没有转入准则机构同僚之间的争执。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The IASB is trying to evade pressure from
