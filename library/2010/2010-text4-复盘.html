"image","asset":"articleAnnotated","label":"6. 第六段第四句","focus":[96,3931,891,226],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":true},"focusId":"focus-long-6-5"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"section":"第三鸟 · 题目复盘","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。</li>\n</ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n<li><strong>全文主旨：</strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr/>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr/>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>在本篇文章里，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。</p>\n","context":{"mode":"image","asset":"questions","label":"完整题目页","focus":null,"sourceW":1353,"sourceH":1885},"meta":{"kind":"section-cover","mergedIntro":true}},{"title":"40题 · 题干、题型与核心出处","level":2,"section":"第三鸟 · 题目复盘","raw":"## 40题\n\n**The author’s attitude towards standard-setters is one of ______.**\n\n作者对准则制定者持什么态度？\n\n这是全文作者态度题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **satisfaction**\n\n满意\n\nB. **skepticism**\n\n怀疑\n\nC. **objectiveness**\n\n客观中立\n\nD. **sympathy**\n\n同情、支持\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 写银行表面自责，背后却把损失归咎于准则制定者 | 先摆出一方正在怪别人 |\n| 第2段 | 直接判断银行游说正在奏效，准则制定者的独立地位受损 | 再说让步已经开始发生 |\n| 第3段 | 写FASB在国会压力后匆忙改规则，银行因此获得更多判断空间 | 举一个例子把让步写具体 |\n| 第4段 | 写欧洲部长继续向IASB施压，要求它也作出类似改变 | 再把同样压力推到另一边 |\n| 第5段 | 转而批评银行高估资产，并说明投资者并不相信银行的说法 | 回头解释真正的问题在谁 |\n| 第6段 | 明确要求独立甚至强硬的准则制定者，并警告继续让步会招来更多压力 | 最后下结论不能继续退让 |","html":"<p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<p>作者对准则制定者持什么态度？</p>\n<p>这是全文作者态度题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>satisfaction</strong></p>\n<p>满意</p>\n<p>B. <strong>skepticism</strong></p>\n<p>怀疑</p>\n<p>C. <strong>objectiveness</strong></p>\n<p>客观中立</p>\n<p>D. <strong>sympathy</strong></p>\n<p>同情、支持</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在说什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>写银行表面自责，背后却把损失归咎于准则制定者</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>直接判断银行游说正在奏效，准则制定者的独立地位受损</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写FASB在国会压力后匆忙改规则，银行因此获得更多判断空间</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>写欧洲部长继续向IASB施压，要求它也作出类似改变</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>转而批评银行高估资产，并说明投资者并不相信银行的说法</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>明确要求独立甚至强硬的准则制定者，并警告继续让步会招来更多压力</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"question","question":"40","questionIntro":true}},{"title":"A. satisfaction","level":3,"section":"第三鸟 · 题目复盘","raw":"**The author’s attitude towards standard-setters is one of ______.**\n\n### A. satisfaction\n\n满意","html":"<section class=\"revealPart\" id=\"focus-q40-A-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>A. satisfaction</h3>\n<p>满意</p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false},"focusId":"focus-q40-A-0"},{"title":"A. satisfaction","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n满意\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写银行把自己的损失怪到准则制定者头上，而作者认为制定者的资产估值要求合理、处理得当，因而对它们表示满意。 | 先摆出一方正在怪别人 |\n| 第2段 | 再写制定者已经作出适度让步，并说明这些调整保留了原则、回应了实际需要，正是作者满意的稳妥处理。 | 再说让步已经开始发生 |\n| 第3段 | 举FASB调整规则的例子，具体写它在压力下给出有限灵活性却守住估值底线，因而取得令人满意的效果。 | 举一个例子把让步写具体 |\n| 第4段 | 把同样压力推到IASB，写它也能妥善安排必要调整而不丢掉整体规划，让作者对两家机构的表现都满意。 | 再把同样压力推到另一边 |\n| 第5段 | 回头指出损失的根源在银行高估资产，而制定者已恰当地履行职责，用责任区分加强对其工作的肯定。 | 回头解释真正的问题在谁 |\n| 第6段 | 最后肯定制定者目前把握的界限令人满意，并要求不再向银行退让，以维护这种已得到肯定的处理结果。 | 最后下结论不能继续退让 |\n\nA可以借到第6段对制定者过去工作的肯定，但不能只看过去。第2段用`Unfortunately`评价银行游说奏效，并说独立性正在受损；第6段又用`But`警告当前屈服会招来更多压力。假设表需要作者满意它们目前把握的界限，实际文章恰恰认为这条界限正在被侵蚀。肯定过去做对的事，不等于满意当前的让步。\n\n判断：\n\n**A 不保留。**","html":"<section class=\"revealPart\" id=\"focus-q40-A-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>A. satisfaction</h3>\n<p>满意</p>\n</section><section class=\"revealPart\" id=\"focus-q40-A-1\"><h3>如果 A 是主旨，文章6段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>满意</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先写银行把自己的损失怪到准则制定者头上，而作者认为制定者的资产估值要求合理、处理得当，因而对它们表示满意。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再写制定者已经作出适度让步，并说明这些调整保留了原则、回应了实际需要，正是作者满意的稳妥处理。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB调整规则的例子，具体写它在压力下给出有限灵活性却守住估值底线，因而取得令人满意的效果。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，写它也能妥善安排必要调整而不丢掉整体规划，让作者对两家机构的表现都满意。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头指出损失的根源在银行高估资产，而制定者已恰当地履行职责，用责任区分加强对其工作的肯定。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后肯定制定者目前把握的界限令人满意，并要求不再向银行退让，以维护这种已得到肯定的处理结果。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>A可以借到第6段对制定者过去工作的肯定，但不能只看过去。第2段用<code>Unfortunately</code>评价银行游说奏效，并说独立性正在受损；第6段又用<code>But</code>警告当前屈服会招来更多压力。假设表需要作者满意它们目前把握的界限，实际文章恰恰认为这条界限正在被侵蚀。肯定过去做对的事，不等于满意当前的让步。</p>\n<p>判断：</p>\n<p><strong>A 不保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true},"focusId":"focus-q40-A-1"},{"title":"B. skepticism","level":3,"section":"第三鸟 · 题目复盘","raw":"**The author’s attitude towards standard-setters is one of ______.**\n\n### B. skepticism\n\n怀疑","html":"<section class=\"revealPart\" id=\"focus-q40-B-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>B. skepticism</h3>\n<p>怀疑</p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false},"focusId":"focus-q40-B-0"},{"title":"B. skepticism","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n怀疑\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写银行把损失怪给准则制定者，作者顺着抱怨追问这些制定者的判断是否可靠，从开头建立怀疑。 | 先摆出一方正在怪别人 |\n| 第2段 | 再写制定者已开始让步，作者将这种摇摆视为其原则和判断不可靠的表现，使怀疑加深。 | 再说让步已经开始发生 |\n| 第3段 | 举FASB受压改规则的例子，具体显示它在没有充分理由时改变判断，让作者更怀疑其制定规则的能力。 | 举一个例子把让步写具体 |\n| 第4段 | 把同样压力推到IASB，写它也表现出随压力改变判断的倾向，使怀疑从一家机构扩展到两家。 | 再把同样压力推到另一边 |\n| 第5段 | 回头论证真正的问题在制定者不可靠的判断与规则，而不只在银行的抱怨，明确怀疑所指向的责任方。 | 回头解释真正的问题在谁 |\n| 第6段 | 最后因不信任它们在压力下作出的判断，要求制定者不能继续退让，不能让不可靠的调整进一步扩大。 | 最后下结论不能继续退让 |\n\nB能抓住作者对当前让步的批评，却会把批评扩大成对制定者本身的不信任。实际第5段把责任指向银行高估资产，第6段明确要求独立甚至强硬的制定者，并说FASB和IASB过去正是这样。假设表把问题根源放在制定者判断不可靠，实际文章是在替其独立工作辩护、劝其不要丢掉原来的原则。\n\n判断：\n\n**B 不保留。**","html":"<section class=\"revealPart\" id=\"focus-q40-B-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>B. skepticism</h3>\n<p>怀疑</p>\n</section><section class=\"revealPart\" id=\"focus-q40-B-1\"><h3>如果 B 是主旨，文章6段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>怀疑</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先写银行把损失怪给准则制定者，作者顺着抱怨追问这些制定者的判断是否可靠，从开头建立怀疑。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再写制定者已开始让步，作者将这种摇摆视为其原则和判断不可靠的表现，使怀疑加深。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB受压改规则的例子，具体显示它在没有充分理由时改变判断，让作者更怀疑其制定规则的能力。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，写它也表现出随压力改变判断的倾向，使怀疑从一家机构扩展到两家。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头论证真正的问题在制定者不可靠的判断与规则，而不只在银行的抱怨，明确怀疑所指向的责任方。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后因不信任它们在压力下作出的判断，要求制定者不能继续退让，不能让不可靠的调整进一步扩大。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>B能抓住作者对当前让步的批评，却会把批评扩大成对制定者本身的不信任。实际第5段把责任指向银行高估资产，第6段明确要求独立甚至强硬的制定者，并说FASB和IASB过去正是这样。假设表把问题根源放在制定者判断不可靠，实际文章是在替其独立工作辩护、劝其不要丢掉原来的原则。</p>\n<p>判断：</p>\n<p><strong>B 不保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true},"focusId":"focus-q40-B-1"},{"title":"C. objectiveness","level":3,"section":"第三鸟 · 题目复盘","raw":"**The author’s attitude towards standard-setters is one of ______.**\n\n### C. objectiveness\n\n客观中立","html":"<section class=\"revealPart\" id=\"focus-q40-C-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>C. objectiveness</h3>\n<p>客观中立</p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false},"focusId":"focus-q40-C-0"},{"title":"C. objectiveness","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n客观中立\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先不带同情或不满地交代银行责怪准则制定者的事实，并同时列明银行的抱怨与规则的要求。 | 先摆出一方正在怪别人 |\n| 第2段 | 再以可核查的事实说明让步已经发生，分别陈列它改变了什么，不把这些变化处理成值得赞赏或惋惜的事。 | 再说让步已经开始发生 |\n| 第3段 | 举FASB的实际让步，按内容、程序和影响逐项交代，既不为机构辩护，也不对其表达情感评价。 | 举一个例子把让步写具体 |\n| 第4段 | 把同样压力推到IASB，以同样中性的口吻列出欧洲的要求、机构的回应和各方的理由。 | 再把同样压力推到另一边 |\n| 第5段 | 回头仅按账目和市场证据厘清问题应由谁负责，保持事实判断与对制定者的同情、满意或怀疑相分离。 | 回头解释真正的问题在谁 |\n| 第6段 | 最后依据规则进一步退让将影响市场运作这一技术判断，得出不能继续退让的结论，但不表达对制定者的情感立场。 | 最后下结论不能继续退让 |\n\nC需要全文在陈列各方与评估后果时保持中性。实际第2段的`Unfortunately`、第5段的`It was banks that were on the wrong planet`以及第6段对独立制定者的明确支持，都超出了不带立场的事实记录。作者虽然引用双方说法，也批评制定者当前让步，但并没有在银行与制定者之间各打五十大板；他明确维护后者的独立职责。\n\n判断：\n\n**C 不保留。**","html":"<section class=\"revealPart\" id=\"focus-q40-C-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>C. objectiveness</h3>\n<p>客观中立</p>\n</section><section class=\"revealPart\" id=\"focus-q40-C-1\"><h3>如果 C 是主旨，文章6段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>客观中立</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先不带同情或不满地交代银行责怪准则制定者的事实，并同时列明银行的抱怨与规则的要求。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再以可核查的事实说明让步已经发生，分别陈列它改变了什么，不把这些变化处理成值得赞赏或惋惜的事。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB的实际让步，按内容、程序和影响逐项交代，既不为机构辩护，也不对其表达情感评价。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，以同样中性的口吻列出欧洲的要求、机构的回应和各方的理由。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头仅按账目和市场证据厘清问题应由谁负责，保持事实判断与对制定者的同情、满意或怀疑相分离。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后依据规则进一步退让将影响市场运作这一技术判断，得出不能继续退让的结论，但不表达对制定者的情感立场。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>C需要全文在陈列各方与评估后果时保持中性。实际第2段的<code>Unfortunately</code>、第5段的<code>It was banks that were on the wrong planet</code>以及第6段对独立制定者的明确支持，都超出了不带立场的事实记录。作者虽然引用双方说法，也批评制定者当前让步，但并没有在银行与制定者之间各打五十大板；他明确维护后者的独立职责。</p>\n<p>判断：</p>\n<p><strong>C 不保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true},"focusId":"focus-q40-C-1"},{"title":"D. sympathy","level":3,"section":"第三鸟 · 题目复盘","raw":"**The author’s attitude towards standard-setters is one of ______.**\n\n### D. sympathy\n\n同情、支持","html":"<section class=\"revealPart\" id=\"focus-q40-D-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>D. sympathy</h3>\n<p>同情、支持</p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false},"focusId":"focus-q40-D-0"},{"title":"D. sympathy","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n同情、支持\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写银行把自身损失归咎于准则制定者，使读者看到这些机构为何成了被指责的对象，为同情它们的处境作铺垫。 | 先摆出一方正在怪别人 |\n| 第2段 | 再写银行游说促成让步，作者惋惜制定者的独立性受损，表明自己支持它们本应守住的立场。 | 再说让步已经开始发生 |\n| 第3段 | 举FASB在国会压力后匆忙让步的例子，呈现它受压的处境以及银行因此获利，让对其处境的同情具体可见。 | 举一个例子把让步写具体 |\n| 第4段 | 把同样压力推到IASB，展示欧洲政治人物也逼它照做，使读者看到准则制定者共同承受的压力。 | 再把同样压力推到另一边 |\n| 第5段 | 回头指出真正的问题在银行高估资产和回避损失，而不是独立准则本身，从责任判断上为制定者辩护。 | 回头解释真正的问题在谁 |\n| 第6段 | 最后肯定制定者原来独立、强硬的工作，并劝其不要继续退让，把同情处境与支持坚守职责落在一起。 | 最后下结论不能继续退让 |\n\n第1段先让我们看到制定者被银行责怪，第2段直接担忧它们独立性受损，第3、4段把美国与欧洲的压力展开，第5段再把实际责任推回银行，第6段肯定独立制定者的过去并警告不要继续让步。D能贯穿这六段：作者同情它们被施压的处境，并支持其独立工作。支持不等于对它们当前每个选择都满意，所以末段的批评不妨碍D成立。\n\n判断：\n\n**D 保留。**","html":"<section class=\"revealPart\" id=\"focus-q40-D-0\"><p><strong>The author’s attitude towards standard-setters is one of ______.</strong></p>\n<h3>D. sympathy</h3>\n<p>同情、支持</p>\n</section><section class=\"revealPart\" id=\"focus-q40-D-1\"><h3>如果 D 是主旨，文章6段应该怎么写？</h3>\n<p>如果全文主旨真的是：</p>\n<p>同情、支持</p>\n<p>那文章6段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第1段</td>\n<td>先写银行把自身损失归咎于准则制定者，使读者看到这些机构为何成了被指责的对象，为同情它们的处境作铺垫。</td>\n<td>先摆出一方正在怪别人</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再写银行游说促成让步，作者惋惜制定者的独立性受损，表明自己支持它们本应守住的立场。</td>\n<td>再说让步已经开始发生</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举FASB在国会压力后匆忙让步的例子，呈现它受压的处境以及银行因此获利，让对其处境的同情具体可见。</td>\n<td>举一个例子把让步写具体</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>把同样压力推到IASB，展示欧洲政治人物也逼它照做，使读者看到准则制定者共同承受的压力。</td>\n<td>再把同样压力推到另一边</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>回头指出真正的问题在银行高估资产和回避损失，而不是独立准则本身，从责任判断上为制定者辩护。</td>\n<td>回头解释真正的问题在谁</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>最后肯定制定者原来独立、强硬的工作，并劝其不要继续退让，把同情处境与支持坚守职责落在一起。</td>\n<td>最后下结论不能继续退让</td>\n</tr>\n</tbody>\n</table></div>\n<p>第1段先让我们看到制定者被银行责怪，第2段直接担忧它们独立性受损，第3、4段把美国与欧洲的压力展开，第5段再把实际责任推回银行，第6段肯定独立制定者的过去并警告不要继续让步。D能贯穿这六段：作者同情它们被施压的处境，并支持其独立工作。支持不等于对它们当前每个选择都满意，所以末段的批评不妨碍D成立。</p>\n<p>判断：</p>\n<p><strong>D 保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true},"focusId":"focus-q40-D-1"},{"title":"40题结论","level":3,"section":"第三鸟 · 题目复盘","raw":"### 40题结论\n\n**40. D. sympathy**\n\n这句话就是本文后续做题的主旨底牌：\n\n**sympathy / 作者同情并支持保持独立、强硬的准则制定者**","html":"<p><strong>40. D. sympathy</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>sympathy / 作者同情并支持保持独立、强硬的准则制定者</strong></p>\n","context":{"mode":"image","asset":"questions","label":"40题","focus":[168,1428,1018,272],"sourceW":1353,"sourceH":1885},"meta":{"kind":"conclusion","question":"40","questionConclusion":true}},{"title":"36题 · 题干、题型与核心出处","level":2,"section":"第三鸟 · 题目复盘","raw":"## 36题\n\n> Bankers complained that they were forced to ______.  \n> 银行家抱怨他们被迫做什么？\n\n### 题型\n\n具体细节题。题干中的主语是银行家，`complained`要求找银行的抱怨，`were forced to`要求找被规则强制执行的动作，而不是作者对规则的评价。\n\n### 核心出处\n\n> Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.\n>\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n\n第1段的`moan the banks`承接题干的`complained`，`have forced them`对应`were forced to`。先看银行抱怨被迫报告损失，再看下一句解释规则要求怎样估值。两句合起来，回答的是银行被迫遵守什么估值要求。","html":"<blockquote>\n<p>Bankers complained that they were forced to ______.<br/>\n银行家抱怨他们被迫做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干中的主语是银行家，<code>complained</code>要求找银行的抱怨，<code>were forced to</code>要求找被规则强制执行的动作，而不是作者对规则的评价。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n<p>第1段的<code>moan the banks</code>承接题干的<code>complained</code>，<code>have forced them</code>对应<code>were forced to</code>。先看银行抱怨被迫报告损失，再看下一句解释规则要求怎样估值。两句合起来，回答的是银行被迫遵守什么估值要求。</p>\n","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"question","question":"36","questionIntro":true}},{"title":"A. follow unfavorable asset evaluation rules","level":3,"section":"第三鸟 · 题目复盘","raw":"### A. follow unfavorable asset evaluation rules\n\n> 遵守对它们不利的资产估值规则\n\n**做题模式中的状态：**当时我们先读了第1段，看到`forced`、按第三方愿付价格估值以及`it’s just not fair`。损失前的修饰词仍是`[xxx]`，但估值标准和银行的不满已经读清。A本身没有遮挡，我们把它作为整条规则的概括保留下来；B、C、D随后被排除，A的状态没有再改变。\n\n**选项类型：正确跨句概括。**\n\nA没有逐字照搬某一句。`asset evaluation rules`概括下一句的定价要求，`unfavorable`概括银行所说的被迫报告损失与“不公平”。这份“不利”是银行眼中的不利，不代表作者认为准则本身不合理。\n\n**出处：**\n\n> Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.\n>\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>遵守对它们不利的资产估值规则</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时我们先读了第1段，看到<code>forced</code>、按第三方愿付价格估值以及<code>it’s just not fair</code>。损失前的修饰词仍是<code>[xxx]</code>，但估值标准和银行的不满已经读清。A本身没有遮挡，我们把它作为整条规则的概括保留下来；B、C、D随后被排除，A的状态没有再改变。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>A没有逐字照搬某一句。<code>asset evaluation rules</code>概括下一句的定价要求，<code>unfavorable</code>概括银行所说的被迫报告损失与“不公平”。这份“不利”是银行眼中的不利，不代表作者认为准则本身不合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false},"focusId":"focus-q36-A-0"},{"title":"A. follow unfavorable asset evaluation rules","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 银行家抱怨他们被迫遵守对它们不利的资产估值规则。\n\n定位时同时看`complained`和`forced to`：它们分别对应银行插入的抱怨和规则的强制作用。单看`assets`只能找到话题，不能知道银行为什么抱怨。\n\n前一句写规则迫使银行报告巨额损失，后一句说明必须按第三方愿意支付的价格估值，而不能采用管理者和监管者希望的价格。前者给不满的结果，后者给被迫遵守的要求。\n\n银行是服从规则的一方；准则制定者制定的是资产估值规则。A的`follow`对应遵守这种强制要求，`unfavorable`对应银行报告损失后作出的负面评价。它没有把银行自己的评价移交给作者。\n\n因此，A把两句中“规则内容”和“银行为何觉得不利”压成一个概括，既保留资产估值这个对象，也保留银行抱怨的方向。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>遵守对它们不利的资产估值规则</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时我们先读了第1段，看到<code>forced</code>、按第三方愿付价格估值以及<code>it’s just not fair</code>。损失前的修饰词仍是<code>[xxx]</code>，但估值标准和银行的不满已经读清。A本身没有遮挡，我们把它作为整条规则的概括保留下来；B、C、D随后被排除，A的状态没有再改变。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>A没有逐字照搬某一句。<code>asset evaluation rules</code>概括下一句的定价要求，<code>unfavorable</code>概括银行所说的被迫报告损失与“不公平”。这份“不利”是银行眼中的不利，不代表作者认为准则本身不合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫遵守对它们不利的资产估值规则。</p>\n</blockquote>\n<p>定位时同时看<code>complained</code>和<code>forced to</code>：它们分别对应银行插入的抱怨和规则的强制作用。单看<code>assets</code>只能找到话题，不能知道银行为什么抱怨。</p>\n<p>前一句写规则迫使银行报告巨额损失，后一句说明必须按第三方愿意支付的价格估值，而不能采用管理者和监管者希望的价格。前者给不满的结果，后者给被迫遵守的要求。</p>\n<p>银行是服从规则的一方；准则制定者制定的是资产估值规则。A的<code>follow</code>对应遵守这种强制要求，<code>unfavorable</code>对应银行报告损失后作出的负面评价。它没有把银行自己的评价移交给作者。</p>\n<p>因此，A把两句中“规则内容”和“银行为何觉得不利”压成一个概括，既保留资产估值这个对象，也保留银行抱怨的方向。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false},"focusId":"focus-q36-A-1"},{"title":"A. follow unfavorable asset evaluation rules","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.\n>\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n>\n> 银行先抱怨规则迫使自己报告损失，随后说明规则要求采用第三方愿付价格。\n\n文章并没有停在“银行不高兴”，而是立即解释它们为何不能照自己的理想价格记账。这个解释正好把“不利的规则”落到具体估值要求。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Banks complain that the valuation rules require third-party prices and force them to report losses.\n>\n> 银行抱怨估值规则要求使用第三方价格，并迫使它们报告损失。\n\nA所需要的写法正是原文已有的推进：先写受规则约束、报告损失，再给出资产估值标准。假设句没有增加再次估值、实际收款或合作等新动作。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>遵守对它们不利的资产估值规则</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时我们先读了第1段，看到<code>forced</code>、按第三方愿付价格估值以及<code>it’s just not fair</code>。损失前的修饰词仍是<code>[xxx]</code>，但估值标准和银行的不满已经读清。A本身没有遮挡，我们把它作为整条规则的概括保留下来；B、C、D随后被排除，A的状态没有再改变。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>A没有逐字照搬某一句。<code>asset evaluation rules</code>概括下一句的定价要求，<code>unfavorable</code>概括银行所说的被迫报告损失与“不公平”。这份“不利”是银行眼中的不利，不代表作者认为准则本身不合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫遵守对它们不利的资产估值规则。</p>\n</blockquote>\n<p>定位时同时看<code>complained</code>和<code>forced to</code>：它们分别对应银行插入的抱怨和规则的强制作用。单看<code>assets</code>只能找到话题，不能知道银行为什么抱怨。</p>\n<p>前一句写规则迫使银行报告巨额损失，后一句说明必须按第三方愿意支付的价格估值，而不能采用管理者和监管者希望的价格。前者给不满的结果，后者给被迫遵守的要求。</p>\n<p>银行是服从规则的一方；准则制定者制定的是资产估值规则。A的<code>follow</code>对应遵守这种强制要求，<code>unfavorable</code>对应银行报告损失后作出的负面评价。它没有把银行自己的评价移交给作者。</p>\n<p>因此，A把两句中“规则内容”和“银行为何觉得不利”压成一个概括，既保留资产估值这个对象，也保留银行抱怨的方向。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>银行先抱怨规则迫使自己报告损失，随后说明规则要求采用第三方愿付价格。</p>\n</blockquote>\n<p>文章并没有停在“银行不高兴”，而是立即解释它们为何不能照自己的理想价格记账。这个解释正好把“不利的规则”落到具体估值要求。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks complain that the valuation rules require third-party prices and force them to report losses.</p>\n<p>银行抱怨估值规则要求使用第三方价格，并迫使它们报告损失。</p>\n</blockquote>\n<p>A所需要的写法正是原文已有的推进：先写受规则约束、报告损失，再给出资产估值标准。假设句没有增加再次估值、实际收款或合作等新动作。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false},"focusId":"focus-q36-A-2"},{"title":"A. follow unfavorable asset evaluation rules","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入36题题干：\n\n> 全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。\n\nA实际说的是：\n\n> follow unfavorable asset evaluation rules  \n> 遵守对它们不利的资产估值规则\n\n同情准则制定者，不等于认为银行没有受到不利影响；作者可以理解银行为何抱怨，同时反对它们施压改变规则。A只概括银行的抱怨，不替银行证明这些抱怨有理。具体规则仍由第1段的第三方价格要求坐实。\n\n**复盘判断：A正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>遵守对它们不利的资产估值规则</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时我们先读了第1段，看到<code>forced</code>、按第三方愿付价格估值以及<code>it’s just not fair</code>。损失前的修饰词仍是<code>[xxx]</code>，但估值标准和银行的不满已经读清。A本身没有遮挡，我们把它作为整条规则的概括保留下来；B、C、D随后被排除，A的状态没有再改变。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>A没有逐字照搬某一句。<code>asset evaluation rules</code>概括下一句的定价要求，<code>unfavorable</code>概括银行所说的被迫报告损失与“不公平”。这份“不利”是银行眼中的不利，不代表作者认为准则本身不合理。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫遵守对它们不利的资产估值规则。</p>\n</blockquote>\n<p>定位时同时看<code>complained</code>和<code>forced to</code>：它们分别对应银行插入的抱怨和规则的强制作用。单看<code>assets</code>只能找到话题，不能知道银行为什么抱怨。</p>\n<p>前一句写规则迫使银行报告巨额损失，后一句说明必须按第三方愿意支付的价格估值，而不能采用管理者和监管者希望的价格。前者给不满的结果，后者给被迫遵守的要求。</p>\n<p>银行是服从规则的一方；准则制定者制定的是资产估值规则。A的<code>follow</code>对应遵守这种强制要求，<code>unfavorable</code>对应银行报告损失后作出的负面评价。它没有把银行自己的评价移交给作者。</p>\n<p>因此，A把两句中“规则内容”和“银行为何觉得不利”压成一个概括，既保留资产估值这个对象，也保留银行抱怨的方向。</p>\n</section><section cl 限定估值标准，并不是要求银行去执行一笔收款交易。\n\n**出处：**\n\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>向第三方收取款项</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>collect [xxx] from third parties</code>。我们没有替遮挡词补出意思，而是拿可读的<code>collect</code>和<code>third parties</code>去对照原句：第三方愿付价格是估值参照，选项却写收取动作。因此第一轮就排除了B，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人借用了<code>a third party would pay</code>，把“第三方在假设交易中愿付的价格”改成“银行必须向第三方收款”。<code>would pay</code>在这里限定估值标准，并不是要求银行去执行一笔收款交易。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false},"focusId":"focus-q36-B-0"},{"title":"B. collect payments from third parties","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 银行家抱怨他们被迫向第三方收取款项。\n\n题干的`forced to`要求找银行被要求做的动作。B虽然复现了第三方，但原句的主干动作是`value some assets`，不是`collect payments`。\n\n原句要求银行按照第三方愿意支付的价格估值。后半句再排除管理者和监管者希望的价格，两边都在比较估值基准。\n\n在原文中，第三方是价格参照的提供者；在B中，第三方变成实际付款方，银行则成了被迫收款的一方。选项还把`would pay`所处的假设估值语境改成了要实施的交易动作。\n\n问题不在`payments`能否与`pay`对应，而在整句动作变了：按愿付价格估值，不等于向这些人收取款项。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>向第三方收取款项</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>collect [xxx] from third parties</code>。我们没有替遮挡词补出意思，而是拿可读的<code>collect</code>和<code>third parties</code>去对照原句：第三方愿付价格是估值参照，选项却写收取动作。因此第一轮就排除了B，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人借用了<code>a third party would pay</code>，把“第三方在假设交易中愿付的价格”改成“银行必须向第三方收款”。<code>would pay</code>在这里限定估值标准，并不是要求银行去执行一笔收款交易。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫向第三方收取款项。</p>\n</blockquote>\n<p>题干的<code>forced to</code>要求找银行被要求做的动作。B虽然复现了第三方，但原句的主干动作是<code>value some assets</code>，不是<code>collect payments</code>。</p>\n<p>原句要求银行按照第三方愿意支付的价格估值。后半句再排除管理者和监管者希望的价格，两边都在比较估值基准。</p>\n<p>在原文中，第三方是价格参照的提供者；在B中，第三方变成实际付款方，银行则成了被迫收款的一方。选项还把<code>would pay</code>所处的假设估值语境改成了要实施的交易动作。</p>\n<p>问题不在<code>payments</code>能否与<code>pay</code>对应，而在整句动作变了：按愿付价格估值，不等于向这些人收取款项。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false},"focusId":"focus-q36-B-1"},{"title":"B. collect payments from third parties","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n>\n> 规则要求比较第三方愿付价格与管理者、监管者希望的价格。\n\n作者把两个价格并排，是要说明银行失去了按自身意愿估值的自由；后文才接银行游说，不是接某笔付款怎样完成。\n\n如果B真是作者的意思，文章至少得写成：\n\n> These rules require banks to collect payments from third parties.\n>\n> 这些规则要求银行向第三方收取款项。\n\n假设写法必须把强制动作改成收款，才足以支持B。实际文章强制的是估值所采用的价格，下一步讨论的也是改变规则，而不是追收款项。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>向第三方收取款项</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>collect [xxx] from third parties</code>。我们没有替遮挡词补出意思，而是拿可读的<code>collect</code>和<code>third parties</code>去对照原句：第三方愿付价格是估值参照，选项却写收取动作。因此第一轮就排除了B，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人借用了<code>a third party would pay</code>，把“第三方在假设交易中愿付的价格”改成“银行必须向第三方收款”。<code>would pay</code>在这里限定估值标准，并不是要求银行去执行一笔收款交易。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫向第三方收取款项。</p>\n</blockquote>\n<p>题干的<code>forced to</code>要求找银行被要求做的动作。B虽然复现了第三方，但原句的主干动作是<code>value some assets</code>，不是<code>collect payments</code>。</p>\n<p>原句要求银行按照第三方愿意支付的价格估值。后半句再排除管理者和监管者希望的价格，两边都在比较估值基准。</p>\n<p>在原文中，第三方是价格参照的提供者；在B中，第三方变成实际付款方，银行则成了被迫收款的一方。选项还把<code>would pay</code>所处的假设估值语境改成了要实施的交易动作。</p>\n<p>问题不在<code>payments</code>能否与<code>pay</code>对应，而在整句动作变了：按愿付价格估值，不等于向这些人收取款项。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-B-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>规则要求比较第三方愿付价格与管理者、监管者希望的价格。</p>\n</blockquote>\n<p>作者把两个价格并排，是要说明银行失去了按自身意愿估值的自由；后文才接银行游说，不是接某笔付款怎样完成。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rules require banks to collect payments from third parties.</p>\n<p>这些规则要求银行向第三方收取款项。</p>\n</blockquote>\n<p>假设写法必须把强制动作改成收款，才足以支持B。实际文章强制的是估值所采用的价格，下一步讨论的也是改变规则，而不是追收款项。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false},"focusId":"focus-q36-B-2"},{"title":"B. collect payments from third parties","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入36题题干：\n\n> 全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。\n\n但B实际说的是：\n\n> collect payments from third parties  \n> 向第三方收取款项\n\n全文支持独立准则，能帮助我们理解银行为何把矛头对准规则，却不能凭这个立场推出具体收款业务。本项最终仍要根据`value some assets at the price a third party would pay`判断：这里有估值基准，没有B所说的强制收款。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>向第三方收取款项</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B显示为<code>collect [xxx] from third parties</code>。我们没有替遮挡词补出意思，而是拿可读的<code>collect</code>和<code>third parties</code>去对照原句：第三方愿付价格是估值参照，选项却写收取动作。因此第一轮就排除了B，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人借用了<code>a third party would pay</code>，把“第三方在假设交易中愿付的价格”改成“银行必须向第三方收款”。<code>would pay</code>在这里限定估值标准，并不是要求银行去执行一笔收款交易。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫向第三方收取款项。</p>\n</blockquote>\n<p>题干的<code>forced to</code>要求找银行被要求做的动作。B虽然复现了第三方，但原句的主干动作是<code>value some assets</code>，不是<code>collect payments</code>。</p>\n<p>原句要求银行按照第三方愿意支付的价格估值。后半句再排除管理者和监管者希望的价格，两边都在比较估值基准。</p>\n<p>在原文中，第三方是价格参照的提供者；在B中，第三方变成实际付款方，银行则成了被迫收款的一方。选项还把<code>would pay</code>所处的假设估值语境改成了要实施的交易动作。</p>\n<p>问题不在<code>payments</code>能否与<code>pay</code>对应，而在整句动作变了：按愿付价格估值，不等于向这些人收取款项。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-B-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>规则要求比较第三方愿付价格与管理者、监管者希望的价格。</p>\n</blockquote>\n<p>作者把两个价格并排，是要说明银行失去了按自身意愿估值的自由；后文才接银行游说，不是接某笔付款怎样完成。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rules require banks to collect payments from third parties.</p>\n<p>这些规则要求银行向第三方收取款项。</p>\n</blockquote>\n<p>假设写法必须把强制动作改成收款，才足以支持B。实际文章强制的是估值所采用的价格，下一步讨论的也是改变规则，而不是追收款项。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-B-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>collect payments from third parties<br/>\n向第三方收取款项</p>\n</blockquote>\n<p>全文支持独立准则，能帮助我们理解银行为何把矛头对准规则，却不能凭这个立场推出具体收款业务。本项最终仍要根据<code>value some assets at the price a third party would pay</code>判断：这里有估值基准，没有B所说的强制收款。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":true},"focusId":"focus-q36-B-3"},{"title":"C. cooperate with the price managers","level":3,"section":"第三鸟 · 题目复盘","raw":"### C. cooperate with the price managers\n\n> 与价格管理者合作\n\n**做题模式中的状态：**当时C的词语都能看见。我们回到`not the price managers and regulators would like them to fetch`，发现`managers`属于说明价格的后半句，并不是`price managers`这种人物称呼；原文也没有合作动作。第一轮排除C，后续未改变。\n\n**错误类型：第一类——歪曲原意。**\n\nC把`the price`后面的定语从句切错，将“管理者和监管者希望资产达到的价格”拼成“价格管理者”，再添上`cooperate with`。看起来复用了原词，实际连合作对象都不是原句中的对象。\n\n**出处：**\n\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>与价格管理者合作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C的词语都能看见。我们回到<code>not the price managers and regulators would like them to fetch</code>，发现<code>managers</code>属于说明价格的后半句，并不是<code>price managers</code>这种人物称呼；原文也没有合作动作。第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>the price</code>后面的定语从句切错，将“管理者和监管者希望资产达到的价格”拼成“价格管理者”，再添上<code>cooperate with</code>。看起来复用了原词，实际连合作对象都不是原句中的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false},"focusId":"focus-q36-C-0"},{"title":"C. cooperate with the price managers","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 银行家抱怨他们被迫与价格管理者合作。\n\nC最容易让人定位到`price managers`相邻的位置，但应该先问：题干中的强制动作究竟对应哪一个谓语？原文对应的是`must value`。\n\n整句先写第三方愿付的价格，再写银行不能采用的另一种价格。后一种价格由`managers and regulators would like them to fetch`说明，即管理者和监管者希望资产卖到的数额。\n\n`managers and regulators`是后面从句的主语，不是`price`的同位解释。C却把价格修饰关系拆成一个人群名称，还把采用价格标准改成了与某些人合作。\n\n因此，C不是概括得粗一点，而是同时改变原句的人物关系和动作：原文谈两种估值价格，C谈银行同谁合作。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>与价格管理者合作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C的词语都能看见。我们回到<code>not the price managers and regulators would like them to fetch</code>，发现<code>managers</code>属于说明价格的后半句，并不是<code>price managers</code>这种人物称呼；原文也没有合作动作。第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>the price</code>后面的定语从句切错，将“管理者和监管者希望资产达到的价格”拼成“价格管理者”，再添上<code>cooperate with</code>。看起来复用了原词，实际连合作对象都不是原句中的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫与价格管理者合作。</p>\n</blockquote>\n<p>C最容易让人定位到<code>price managers</code>相邻的位置，但应该先问：题干中的强制动作究竟对应哪一个谓语？原文对应的是<code>must value</code>。</p>\n<p>整句先写第三方愿付的价格，再写银行不能采用的另一种价格。后一种价格由<code>managers and regulators would like them to fetch</code>说明，即管理者和监管者希望资产卖到的数额。</p>\n<p><code>managers and regulators</code>是后面从句的主语，不是<code>price</code>的同位解释。C却把价格修饰关系拆成一个人群名称，还把采用价格标准改成了与某些人合作。</p>\n<p>因此，C不是概括得粗一点，而是同时改变原句的人物关系和动作：原文谈两种估值价格，C谈银行同谁合作。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false},"focusId":"focus-q36-C-1"},{"title":"C. cooperate with the price managers","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n>\n> 原文对照的是第三方愿付价格和管理者、监管者希望的价格。\n\n这条对照继续解释资产应按什么价格记账，句子里没有成立一个名叫“价格管理者”的合作方。\n\n如果C真是作者的意思，文章至少得写成：\n\n> These rules force banks to cooperate with price managers.\n>\n> 这些规则迫使银行与价格管理者合作。\n\n假设句必须明确出现合作方和合作动作；实际句子只让管理者、监管者表达希望的价格，并且否定采用这种价格。两条写作路线不是一回事。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>与价格管理者合作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C的词语都能看见。我们回到<code>not the price managers and regulators would like them to fetch</code>，发现<code>managers</code>属于说明价格的后半句，并不是<code>price managers</code>这种人物称呼；原文也没有合作动作。第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>the price</code>后面的定语从句切错，将“管理者和监管者希望资产达到的价格”拼成“价格管理者”，再添上<code>cooperate with</code>。看起来复用了原词，实际连合作对象都不是原句中的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫与价格管理者合作。</p>\n</blockquote>\n<p>C最容易让人定位到<code>price managers</code>相邻的位置，但应该先问：题干中的强制动作究竟对应哪一个谓语？原文对应的是<code>must value</code>。</p>\n<p>整句先写第三方愿付的价格，再写银行不能采用的另一种价格。后一种价格由<code>managers and regulators would like them to fetch</code>说明，即管理者和监管者希望资产卖到的数额。</p>\n<p><code>managers and regulators</code>是后面从句的主语，不是<code>price</code>的同位解释。C却把价格修饰关系拆成一个人群名称，还把采用价格标准改成了与某些人合作。</p>\n<p>因此，C不是概括得粗一点，而是同时改变原句的人物关系和动作：原文谈两种估值价格，C谈银行同谁合作。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>原文对照的是第三方愿付价格和管理者、监管者希望的价格。</p>\n</blockquote>\n<p>这条对照继续解释资产应按什么价格记账，句子里没有成立一个名叫“价格管理者”的合作方。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rules force banks to cooperate with price managers.</p>\n<p>这些规则迫使银行与价格管理者合作。</p>\n</blockquote>\n<p>假设句必须明确出现合作方和合作动作；实际句子只让管理者、监管者表达希望的价格，并且否定采用这种价格。两条写作路线不是一回事。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false},"focusId":"focus-q36-C-2"},{"title":"C. cooperate with the price managers","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入36题题干：\n\n> 全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。\n\n但C实际说的是：\n\n> cooperate with the price managers  \n> 与价格管理者合作\n\n作者支持准则制定者的独立性，但这种立场不能证明银行与任何“价格管理者”存在合作。局部原文的`the price ... would like them to fetch`已经说明这里是价格的限定关系，不能用全文对机构的讨论替C补出新角色。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>与价格管理者合作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C的词语都能看见。我们回到<code>not the price managers and regulators would like them to fetch</code>，发现<code>managers</code>属于说明价格的后半句，并不是<code>price managers</code>这种人物称呼；原文也没有合作动作。第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把<code>the price</code>后面的定语从句切错，将“管理者和监管者希望资产达到的价格”拼成“价格管理者”，再添上<code>cooperate with</code>。看起来复用了原词，实际连合作对象都不是原句中的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫与价格管理者合作。</p>\n</blockquote>\n<p>C最容易让人定位到<code>price managers</code>相邻的位置，但应该先问：题干中的强制动作究竟对应哪一个谓语？原文对应的是<code>must value</code>。</p>\n<p>整句先写第三方愿付的价格，再写银行不能采用的另一种价格。后一种价格由<code>managers and regulators would like them to fetch</code>说明，即管理者和监管者希望资产卖到的数额。</p>\n<p><code>managers and regulators</code>是后面从句的主语，不是<code>price</code>的同位解释。C却把价格修饰关系拆成一个人群名称，还把采用价格标准改成了与某些人合作。</p>\n<p>因此，C不是概括得粗一点，而是同时改变原句的人物关系和动作：原文谈两种估值价格，C谈银行同谁合作。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>原文对照的是第三方愿付价格和管理者、监管者希望的价格。</p>\n</blockquote>\n<p>这条对照继续解释资产应按什么价格记账，句子里没有成立一个名叫“价格管理者”的合作方。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These rules force banks to cooperate with price managers.</p>\n<p>这些规则迫使银行与价格管理者合作。</p>\n</blockquote>\n<p>假设句必须明确出现合作方和合作动作；实际句子只让管理者、监管者表达希望的价格，并且否定采用这种价格。两条写作路线不是一回事。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-C-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>cooperate with the price managers<br/>\n与价格管理者合作</p>\n</blockquote>\n<p>作者支持准则制定者的独立性，但这种立场不能证明银行与任何“价格管理者”存在合作。局部原文的<code>the price ... would like them to fetch</code>已经说明这里是价格的限定关系，不能用全文对机构的讨论替C补出新角色。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true},"focusId":"focus-q36-C-3"},{"title":"D. reevaluate some of their assets","level":3,"section":"第三鸟 · 题目复盘","raw":"### D. reevaluate some of their assets\n\n> 重新评估它们的一些资产\n\n**做题模式中的状态：**当时D没有遮挡。我们承认它的`assets`与`value`看起来接近，但比较后发现它只写“重新评估”，没有接住必须使用第三方价格以及由此报告损失。做题材料据此第一轮排除了D，此后A成为唯一保留项，没有二次改判。\n\n**错误类型：第一类——歪曲原意。**\n\nD借用了`value some assets`，却把银行抱怨的具体估值约束压成“再评估一次”。原句的重点是按谁的价格评估，而非评估次数；`reevaluate`还额外带入“重新”的时间意味。\n\n**出处：**\n\n> Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.\n>\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>重新评估它们的一些资产</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们承认它的<code>assets</code>与<code>value</code>看起来接近，但比较后发现它只写“重新评估”，没有接住必须使用第三方价格以及由此报告损失。做题材料据此第一轮排除了D，此后A成为唯一保留项，没有二次改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>value some assets</code>，却把银行抱怨的具体估值约束压成“再评估一次”。原句的重点是按谁的价格评估，而非评估次数；<code>reevaluate</code>还额外带入“重新”的时间意味。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false},"focusId":"focus-q36-D-0"},{"title":"D. reevaluate some of their assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 银行家抱怨他们被迫重新评估它们的一些资产。\n\n定位不能只靠`assets`。题干的`complained`要接到银行所说的“不公平”，`forced to`要接到规则规定的具体义务。\n\n规则迫使银行按第三方愿付价格估值，因此报告巨额损失。原句用`not the price`明确排除另一种估值标准，是在区分采用什么价格。\n\nD只保留资产评估这个宽泛动作，把约束标准删掉，再用`re-`把动作转成重新进行。文章没有把“是否再次评估”作为抱怨焦点，也没有先交代一轮评估、再要求重复的过程。\n\n所以D与原文有共同话题，但没有保留构成这次抱怨的关键关系：银行被迫采用自己不愿采用的价格规则，而不只是被要求重做一个评估动作。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>重新评估它们的一些资产</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们承认它的<code>assets</code>与<code>value</code>看起来接近，但比较后发现它只写“重新评估”，没有接住必须使用第三方价格以及由此报告损失。做题材料据此第一轮排除了D，此后A成为唯一保留项，没有二次改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>value some assets</code>，却把银行抱怨的具体估值约束压成“再评估一次”。原句的重点是按谁的价格评估，而非评估次数；<code>reevaluate</code>还额外带入“重新”的时间意味。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫重新评估它们的一些资产。</p>\n</blockquote>\n<p>定位不能只靠<code>assets</code>。题干的<code>complained</code>要接到银行所说的“不公平”，<code>forced to</code>要接到规则规定的具体义务。</p>\n<p>规则迫使银行按第三方愿付价格估值，因此报告巨额损失。原句用<code>not the price</code>明确排除另一种估值标准，是在区分采用什么价格。</p>\n<p>D只保留资产评估这个宽泛动作，把约束标准删掉，再用<code>re-</code>把动作转成重新进行。文章没有把“是否再次评估”作为抱怨焦点，也没有先交代一轮评估、再要求重复的过程。</p>\n<p>所以D与原文有共同话题，但没有保留构成这次抱怨的关键关系：银行被迫采用自己不愿采用的价格规则，而不只是被要求重做一个评估动作。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false},"focusId":"focus-q36-D-1"},{"title":"D. reevaluate some of their assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n>\n> Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.\n>\n> 银行的不满集中于必须按第三方价格估值，并在账目上报告损失。\n\n作者花一句话对照两个价格标准，是为了解释不满从哪里来。若重点只是再评估一次，这个价格对照就不能由D本身概括出来。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Banks complain that the rules force them to assess some assets again.\n>\n> 银行抱怨规则迫使它们再评估一次某些资产。\n\n假设句把抱怨焦点放在重复评估；实际句子把焦点放在不能采用理想价格。D带入了次数变化，却拿掉了文章专门展开的估值标准，A则保留了这条关系。","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>重新评估它们的一些资产</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们承认它的<code>assets</code>与<code>value</code>看起来接近，但比较后发现它只写“重新评估”，没有接住必须使用第三方价格以及由此报告损失。做题材料据此第一轮排除了D，此后A成为唯一保留项，没有二次改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>value some assets</code>，却把银行抱怨的具体估值约束压成“再评估一次”。原句的重点是按谁的价格评估，而非评估次数；<code>reevaluate</code>还额外带入“重新”的时间意味。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫重新评估它们的一些资产。</p>\n</blockquote>\n<p>定位不能只靠<code>assets</code>。题干的<code>complained</code>要接到银行所说的“不公平”，<code>forced to</code>要接到规则规定的具体义务。</p>\n<p>规则迫使银行按第三方愿付价格估值，因此报告巨额损失。原句用<code>not the price</code>明确排除另一种估值标准，是在区分采用什么价格。</p>\n<p>D只保留资产评估这个宽泛动作，把约束标准删掉，再用<code>re-</code>把动作转成重新进行。文章没有把“是否再次评估”作为抱怨焦点，也没有先交代一轮评估、再要求重复的过程。</p>\n<p>所以D与原文有共同话题，但没有保留构成这次抱怨的关键关系：银行被迫采用自己不愿采用的价格规则，而不只是被要求重做一个评估动作。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>银行的不满集中于必须按第三方价格估值，并在账目上报告损失。</p>\n</blockquote>\n<p>作者花一句话对照两个价格标准，是为了解释不满从哪里来。若重点只是再评估一次，这个价格对照就不能由D本身概括出来。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks complain that the rules force them to assess some assets again.</p>\n<p>银行抱怨规则迫使它们再评估一次某些资产。</p>\n</blockquote>\n<p>假设句把抱怨焦点放在重复评估；实际句子把焦点放在不能采用理想价格。D带入了次数变化，却拿掉了文章专门展开的估值标准，A则保留了这条关系。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false},"focusId":"focus-q36-D-2"},{"title":"D. reevaluate some of their assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入36题题干：\n\n> 全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。\n\n但D实际说的是：\n\n> reevaluate some of their assets  \n> 重新评估它们的一些资产\n\n主旨能确认争议围绕银行施压准则制定者展开，但不能靠主旨判断银行是否重新进行过估值。本项仍要回到`at the price a third party would pay, not the price ...`：作者解释的是标准冲突，D却改成再次评估。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>重新评估它们的一些资产</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D没有遮挡。我们承认它的<code>assets</code>与<code>value</code>看起来接近，但比较后发现它只写“重新评估”，没有接住必须使用第三方价格以及由此报告损失。做题材料据此第一轮排除了D，此后A成为唯一保留项，没有二次改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>value some assets</code>，却把银行抱怨的具体估值约束压成“再评估一次”。原句的重点是按谁的价格评估，而非评估次数；<code>reevaluate</code>还额外带入“重新”的时间意味。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>银行家抱怨他们被迫重新评估它们的一些资产。</p>\n</blockquote>\n<p>定位不能只靠<code>assets</code>。题干的<code>complained</code>要接到银行所说的“不公平”，<code>forced to</code>要接到规则规定的具体义务。</p>\n<p>规则迫使银行按第三方愿付价格估值，因此报告巨额损失。原句用<code>not the price</code>明确排除另一种估值标准，是在区分采用什么价格。</p>\n<p>D只保留资产评估这个宽泛动作，把约束标准删掉，再用<code>re-</code>把动作转成重新进行。文章没有把“是否再次评估”作为抱怨焦点，也没有先交代一轮评估、再要求重复的过程。</p>\n<p>所以D与原文有共同话题，但没有保留构成这次抱怨的关键关系：银行被迫采用自己不愿采用的价格规则，而不只是被要求重做一个评估动作。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<p>Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.</p>\n<p>银行的不满集中于必须按第三方价格估值，并在账目上报告损失。</p>\n</blockquote>\n<p>作者花一句话对照两个价格标准，是为了解释不满从哪里来。若重点只是再评估一次，这个价格对照就不能由D本身概括出来。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks complain that the rules force them to assess some assets again.</p>\n<p>银行抱怨规则迫使它们再评估一次某些资产。</p>\n</blockquote>\n<p>假设句把抱怨焦点放在重复评估；实际句子把焦点放在不能采用理想价格。D带入了次数变化，却拿掉了文章专门展开的估值标准，A则保留了这条关系。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-D-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入36题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者维护准则制定者、反对银行将自身问题归咎于规则，不能判断银行被迫执行的具体动作。本题仍须回到银行关于估值和损失的抱怨。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>reevaluate some of their assets<br/>\n重新评估它们的一些资产</p>\n</blockquote>\n<p>主旨能确认争议围绕银行施压准则制定者展开，但不能靠主旨判断银行是否重新进行过估值。本项仍要回到<code>at the price a third party would pay, not the price ...</code>：作者解释的是标准冲突，D却改成再次评估。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":true},"focusId":"focus-q36-D-3"},{"title":"36题结论","level":3,"section":"第三鸟 · 题目复盘","raw":"### 36题结论\n\n> **36. A. follow unfavorable asset evaluation rules**\n\nA概括了银行被迫遵守的不利估值规则及其损失后果。\n\nB把第三方愿付价格这一估值参照变成了实际收款。\n\nC切错价格定语从句，拼出“价格管理者”并添加合作动作。\n\nD把采用特定价格标准改成再次评估，遗漏了抱怨的核心约束。","html":"<blockquote>\n<p><strong>36. A. follow unfavorable asset evaluation rules</strong></p>\n</blockquote>\n<p>A概括了银行被迫遵守的不利估值规则及其损失后果。</p>\n<p>B把第三方愿付价格这一估值参照变成了实际收款。</p>\n<p>C切错价格定语从句，拼出“价格管理者”并添加合作动作。</p>\n<p>D把采用特定价格标准改成再次评估，遗漏了抱怨的核心约束。</p>\n","context":{"mode":"image","asset":"questions","label":"36题","focus":[168,139,1018,264],"sourceW":1353,"sourceH":1885},"meta":{"kind":"conclusion","question":"36","questionConclusion":true}},{"title":"37题 · 题干、题型与核心出处","level":2,"section":"第三鸟 · 题目复盘","raw":"## 37题\n\n> According to the author, the rule changes of the FASB may result in ______.  \n> 作者认为，FASB的规则变化可能导致什么？\n\n### 题型\n\n局部推断题。题干点名FASB的规则变更，并问作者判断的可能后果。`According to the author`不能替换成银行或游说团体的立场，`may`也不能扩大成已经确定发生的一切结果。\n\n### 核心出处\n\n> Unfortunately, banks' lobbying now seems to be working.\n>\n> The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.\n>\n> After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.\n>\n> These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.\n>\n> Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"\n\n第2段先给出作者的总判断：银行游说奏效，准则制定者的独立性受损。第3段再写FASB在与国会交锋后匆忙改规则，并交代银行因此得到的自由与灵活性。这是总判断与具体事例之间的关系；由此可以把“独立性受损”落到FASB身上。","html":"<blockquote>\n<p>According to the author, the rule changes of the FASB may result in ______.<br/>\n作者认为，FASB的规则变化可能导致什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部推断题。题干点名FASB的规则变更，并问作者判断的可能后果。<code>According to the author</code>不能替换成银行或游说团体的立场，<code>may</code>也不能扩大成已经确定发生的一切结果。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Unfortunately, banks' lobbying now seems to be working.</p>\n<p>The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.</p>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n<p>第2段先给出作者的总判断：银行游说奏效，准则制定者的独立性受损。第3段再写FASB在与国会交锋后匆忙改规则，并交代银行因此得到的自由与灵活性。这是总判断与具体事例之间的关系；由此可以把“独立性受损”落到FASB身上。</p>\n","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"question","question":"37","questionIntro":true}},{"title":"A. the diminishing role of management","level":3,"section":"第三鸟 · 题目复盘","raw":"### A. the diminishing role of management\n\n> 管理层作用减弱\n\n**做题模式中的状态：**当时A没有遮挡。我们把`diminishing role of management`与第3段末尾的`enhance ... the use of judgment by management`对比，并看到银行获得`more freedom`。增强与减弱方向相反，因此第一轮排除A，后续没有改判。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用`management`，把规则变更增强管理层判断空间改成削弱管理层作用。它保留了同一主体，却把变化方向反了过来。\n\n**出处：**\n\n> These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.\n>\n> Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>管理层作用减弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们把<code>diminishing role of management</code>与第3段末尾的<code>enhance ... the use of judgment by management</code>对比，并看到银行获得<code>more freedom</code>。增强与减弱方向相反，因此第一轮排除A，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A借用<code>management</code>，把规则变更增强管理层判断空间改成削弱管理层作用。它保留了同一主体，却把变化方向反了过来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false},"focusId":"focus-q37-A-0"},{"title":"A. the diminishing role of management","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为，FASB的规则变化可能导致管理层作用减弱。\n\n题干的`rule changes`对应第3段的`These`和`the changes`，A的`management`对应段末的`judgment by management`。两处把“什么变化影响谁”都定位清楚了。\n\n第3段先写银行得到更多使用模型的自由和确认损失的灵活性，末句再说这些变化增强了管理层判断的使用。两句都指向判断余地扩大。\n\n原文动作是`gave ... more freedom`和`enhance`，A的动作方向却是`diminishing`。管理层与FASB也不是同一主体：银行管理层得到更多空间，不等于准则制定机构自身更加独立。\n\nA把增大改成减小，不能因为两边都出现`management`就把这种反向变化当成同义改写。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>管理层作用减弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们把<code>diminishing role of management</code>与第3段末尾的<code>enhance ... the use of judgment by management</code>对比，并看到银行获得<code>more freedom</code>。增强与减弱方向相反，因此第一轮排除A，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A借用<code>management</code>，把规则变更增强管理层判断空间改成削弱管理层作用。它保留了同一主体，却把变化方向反了过来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致管理层作用减弱。</p>\n</blockquote>\n<p>题干的<code>rule changes</code>对应第3段的<code>These</code>和<code>the changes</code>，A的<code>management</code>对应段末的<code>judgment by management</code>。两处把“什么变化影响谁”都定位清楚了。</p>\n<p>第3段先写银行得到更多使用模型的自由和确认损失的灵活性，末句再说这些变化增强了管理层判断的使用。两句都指向判断余地扩大。</p>\n<p>原文动作是<code>gave ... more freedom</code>和<code>enhance</code>，A的动作方向却是<code>diminishing</code>。管理层与FASB也不是同一主体：银行管理层得到更多空间，不等于准则制定机构自身更加独立。</p>\n<p>A把增大改成减小，不能因为两边都出现<code>management</code>就把这种反向变化当成同义改写。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false},"focusId":"focus-q37-A-1"},{"title":"A. the diminishing role of management","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.\n>\n> Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"\n>\n> 规则放宽使银行和管理层拥有更多估值、确认损失的判断空间。\n\n段末的`Yet`把主席的辩护与银行受益放在一起；作者接着看到的是银行股上涨和管理层判断得到增强，不是管理层被限制。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The changes reduce the use of judgment by management.\n>\n> 这些变化减少了管理层判断的使用。\n\n假设写法只有把`enhance`换成减少，才能支持A。实际文章两个层面的“更多”都与它相反。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>管理层作用减弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们把<code>diminishing role of management</code>与第3段末尾的<code>enhance ... the use of judgment by management</code>对比，并看到银行获得<code>more freedom</code>。增强与减弱方向相反，因此第一轮排除A，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A借用<code>management</code>，把规则变更增强管理层判断空间改成削弱管理层作用。它保留了同一主体，却把变化方向反了过来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致管理层作用减弱。</p>\n</blockquote>\n<p>题干的<code>rule changes</code>对应第3段的<code>These</code>和<code>the changes</code>，A的<code>management</code>对应段末的<code>judgment by management</code>。两处把“什么变化影响谁”都定位清楚了。</p>\n<p>第3段先写银行得到更多使用模型的自由和确认损失的灵活性，末句再说这些变化增强了管理层判断的使用。两句都指向判断余地扩大。</p>\n<p>原文动作是<code>gave ... more freedom</code>和<code>enhance</code>，A的动作方向却是<code>diminishing</code>。管理层与FASB也不是同一主体：银行管理层得到更多空间，不等于准则制定机构自身更加独立。</p>\n<p>A把增大改成减小，不能因为两边都出现<code>management</code>就把这种反向变化当成同义改写。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n<p>规则放宽使银行和管理层拥有更多估值、确认损失的判断空间。</p>\n</blockquote>\n<p>段末的<code>Yet</code>把主席的辩护与银行受益放在一起；作者接着看到的是银行股上涨和管理层判断得到增强，不是管理层被限制。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The changes reduce the use of judgment by management.</p>\n<p>这些变化减少了管理层判断的使用。</p>\n</blockquote>\n<p>假设写法只有把<code>enhance</code>换成减少，才能支持A。实际文章两个层面的“更多”都与它相反。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false},"focusId":"focus-q37-A-2"},{"title":"A. the diminishing role of management","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入37题题干：\n\n> 作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。\n\n但A实际说的是：\n\n> the diminishing role of management  \n> 管理层作用减弱\n\n作者反对向银行压力让步，实际例子是银行获得更多估值自由，准则制定者独立性受损。A说银行管理层作用减弱，既不符合这一让步方向，也与局部的`enhance`相反。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>管理层作用减弱</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们把<code>diminishing role of management</code>与第3段末尾的<code>enhance ... the use of judgment by management</code>对比，并看到银行获得<code>more freedom</code>。增强与减弱方向相反，因此第一轮排除A，后续没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A借用<code>management</code>，把规则变更增强管理层判断空间改成削弱管理层作用。它保留了同一主体，却把变化方向反了过来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致管理层作用减弱。</p>\n</blockquote>\n<p>题干的<code>rule changes</code>对应第3段的<code>These</code>和<code>the changes</code>，A的<code>management</code>对应段末的<code>judgment by management</code>。两处把“什么变化影响谁”都定位清楚了。</p>\n<p>第3段先写银行得到更多使用模型的自由和确认损失的灵活性，末句再说这些变化增强了管理层判断的使用。两句都指向判断余地扩大。</p>\n<p>原文动作是<code>gave ... more freedom</code>和<code>enhance</code>，A的动作方向却是<code>diminishing</code>。管理层与FASB也不是同一主体：银行管理层得到更多空间，不等于准则制定机构自身更加独立。</p>\n<p>A把增大改成减小，不能因为两边都出现<code>management</code>就把这种反向变化当成同义改写。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n<p>规则放宽使银行和管理层拥有更多估值、确认损失的判断空间。</p>\n</blockquote>\n<p>段末的<code>Yet</code>把主席的辩护与银行受益放在一起；作者接着看到的是银行股上涨和管理层判断得到增强，不是管理层被限制。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The changes reduce the use of judgment by management.</p>\n<p>这些变化减少了管理层判断的使用。</p>\n</blockquote>\n<p>假设写法只有把<code>enhance</code>换成减少，才能支持A。实际文章两个层面的“更多”都与它相反。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-A-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入37题题干：</p>\n<blockquote>\n<p>作者支持准则制定者保持独立，并担心银行压力促成让步。因此，FASB受压改规则的后果，应与独立性受损这一担忧相联系，而不能将银行受益直接等同于体系复苏。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>the diminishing role of management<br/>\n管理层作用减弱</p>\n</blockquote>\n<p>作者反对向银行压力让步，实际例子是银行获得更多估值自由，准则制定者独立性受损。A说银行管理层作用减弱，既不符合这一让步方向，也与局部的<code>enhance</code>相反。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true},"focusId":"focus-q37-A-3"},{"title":"B. the revival of the banking system","level":3,"section":"第三鸟 · 题目复盘","raw":"### B. the revival of the banking system\n\n> 银行系统的复苏\n\n**做题模式中的状态：**当时B是完整选项。第2段相关句子仍有遮挡，我们主要读清了`unless`和“价格吸引买家”这个条件，再与第3段银行得到更多估值自由作比较。做题时没有把自由增加当成复苏条件已满足，第一轮排除B，后续未改变。\n\n**错误类型：第三类——无中生有。**\n\nB利用银行股上涨、估值更自由以及文中出现的“重振银行系统”，诱导读者补出“改规则会带来复苏”。但原文将复苏与资产标价能否吸引买家相连，没有写估值自由增加就会满足这个条件。\n\n**出处：**\n\n> And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.\n>\n> These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.\n>\n> America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>银行系统的复苏</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B是完整选项。第2段相关句子仍有遮挡，我们主要读清了<code>unless</code>和“价格吸引买家”这个条件，再与第3段银行得到更多估值自由作比较。做题时没有把自由增加当成复苏条件已满足，第一轮排除B，后续未改变。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用银行股上涨、估值更自由以及文中出现的“重振银行系统”，诱导读者补出“改规则会带来复苏”。但原文将复苏与资产标价能否吸引买家相连，没有写估值自由增加就会满足这个条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false},"focusId":"focus-q37-B-0"},{"title":"B. the revival of the banking system","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为，FASB的规则变化可能导致银行系统的复苏。\n\nB的`revival of the banking system`对应第2段的`reviving the banking system`。定位到同一目标以后，还必须检查题干规定的原因——FASB规则变更——是否被原文接到这个结果上。\n\n第2段说没有吸引买家的价格，复苏会困难；第6段又说收购计划要奏效，银行必须把资产标到买家觉得合适的水平。第3段只说银行得到更自由的模型估值和确认损失方式。\n\n资产价格能吸引买家是一项条件，银行能更自由地估值是另一件事。文本没有说规则变更会使价格降到买家愿意接受的水平，也没有把银行股上涨当成整个银行体系已经恢复。\n\nB增加了“规则变化促成体系复苏”的因果关系。原文提供的是必须满足的估值条件，而不是这项规则变化已经具备或将会产生的复苏效果。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>银行系统的复苏</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B是完整选项。第2段相关句子仍有遮挡，我们主要读清了<code>unless</code>和“价格吸引买家”这个条件，再与第3段银行得到更多估值自由作比较。做题时没有把自由增加当成复苏条件已满足，第一轮排除B，后续未改变。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用银行股上涨、估值更自由以及文中出现的“重振银行系统”，诱导读者补出“改规则会带来复苏”。但原文将复苏与资产标价能否吸引买家相连，没有写估值自由增加就会满足这个条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为，FASB的规则变化可能导致银行系统的复苏。</p>\n</blockquote>\n<p>B的<code>revival of the banking system</code>对应第2段的<code>reviving the banking system</code>。定位到同一目标以后，还必须检查题干规定的原因——FASB规则变更——是否被原文接到这个结果上。</p>\n<p>第2段说没有吸引买家的价格，复苏会困难；第6段又说收购计划要奏效，银行必须把资产标到买家觉得合适的水平。第3段只说银行得到更自由的模型估值和确认损失方式。</p>\n<p>资产价格能吸引买家是一项条件，银行能更自由地估值是另一件事。文本没有说规则变更会使价格降到买家愿意接受的水平，也没有把银行股上涨当成整个银行体系已经恢复。</p>\n<p>B增加了“规则变化促成体系复苏”的因果关系。原文提供的是必须满足的估值条件，而不是这项规则变化已经具备或将会产生的复苏效果。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"37题","focus":[168,451,1018,267],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false},"focusId":"focus-q37-B-1"},{"title":"B. the revival of the banking system","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.\n>\n> America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.\n>\n> 体系恢复和收购计划能否奏效，都取决于银行能否用吸引买家的价格给资产记价。\n\n作者在结尾再次重复价格条件，并要求确认和处理损失，没有用“管理层判断空间变大”代替这些步骤。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The rule changes will help revive the banking system by bringing asset prices to levels that attract buyers.\n>\n> 规则变更会使资产价格达到吸引买家的水平，从而帮助银行系统复苏。\n\n要支持B，至少需要这座从变更到可成交价格、再到复苏的桥。实际文章没有搭这座桥，反而担心让步损害独立性。银行股上涨也不能替代整套条件。","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>银行系统的复苏</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B是完整选项。第2段相关句子仍有遮挡，我们主要读清了<code>unless</code>和“价格吸引买家”这个条件，再与第3段银行得到更多估值自由作比较。做题时没有把自由增加当成复苏条件已满足，第一轮排除B，后续未改变。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用银行股上涨、估值更自由以及文中出现的“重振银行系统”，诱导读者补出“改规则会带来复苏”。但原文将复苏与资产标价能否吸引买家相连，没有写估值自由增加就会满足这个条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<p>These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.</p>\n<p>America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractiv
