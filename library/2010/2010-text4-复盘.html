<script>
const DATA = [{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"# 0.阅前须知\n\n## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img alt=\"重点词语境标注示例\" class=\"embedded-asset\" data-asset=\"method_vocab_example\"/><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img alt=\"意群法示例\" class=\"embedded-asset\" data-asset=\"method_intent_example\"/><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img alt=\"新题型考纲总览\" class=\"embedded-asset\" data-asset=\"method_newtype_overview\"/><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img alt=\"新题型考纲表格\" class=\"embedded-asset\" data-asset=\"method_newtype_table\"/><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img alt=\"七选五题型说明\" class=\"embedded-asset\" data-asset=\"method_cloze_intro\"/><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img alt=\"小标题题考点\" class=\"embedded-asset\" data-asset=\"method_smalltitle\"/><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img alt=\"排序题考点\" class=\"embedded-asset\" data-asset=\"method_sorting\"/><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img alt=\"匹配题考点\" class=\"embedded-asset\" data-asset=\"method_matching\"/><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n he price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[94,152,894,586],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-0"},{"title":"第1段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第1段\n\nBankers have been blaming themselves / for their troubles / in public.\n\nBehind the scenes, / they have been taking aim / at someone else: / the accounting standard-setters.\n\nTheir rules, / moan the banks, / have forced them / to report enormous losses, / and it's just not fair.\n\nThese rules say / they must value some assets / at the price / a third party would pay, / not the price / managers and regulators / would like them to fetch.","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Bankers have been blaming themselves for their troubles in public. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Bankers have been blaming themselves / for their troubles / in public.</p>\n<p>Behind the scenes, / they have been taking aim / at someone else: / the accounting standard-setters.</p>\n<p>Their rules, / moan the banks, / have forced them / to report enormous losses, / and it's just not fair.</p>\n<p>These rules say / they must value some assets / at the price / a third party would pay, / not the price / managers and regulators / would like them to fetch.</p>\n</section>","context" 0,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-2"},{"title":"第1段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第1段\n\n银行家们在公开场合一直为自己的麻烦自责。但在幕后，他们却把矛头指向了其他人：会计准则制定者。银行抱怨说，他们的规则迫使银行报告巨额损失，这很不公平。这些规则要求银行必须按照第三方愿意支付的价格对某些资产进行估值，而不是按照管理者和监管者希望的价格。","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Bankers have been blaming themselves for their troubles in public. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Bankers have been blaming themselves / for their troubles / in public.</p>\n<p>Behind the scenes, / they have been taking aim / at someone else: / the accounting standard-setters.</p>\n<p>Their rules, / moan the banks, / have forced them / to report enormous losses, / and it's just not fair.</p>\n<p>These rules say / they must value some assets / at the price / a third party would pay, / not the price / managers and regulators / would like them to fetch.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3>\n<p>银行家们一直在自责 / 为他们的麻烦 / 在公开场合。</p>\n<p>在幕后，/ 他们一直在瞄准 / 其他人：/ 会计准则制定者。</p>\n<p>他们的规则，/ 银行抱怨道，/ 已经迫使他们 / 报告巨额损失，/ 而这很不公平。</p>\n<p>这些规则规定 / 他们必须对某些资产估值 / 按照价格 / 第三方愿意支付的，/ 而不是价格 / 管理者和监管者 / 希望它们达到的。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段</h3>\n<p>银行家们在公开场合一直为自己的麻烦自责。但在幕后，他们却把矛头指向了其他人：会计准则制定者。银行抱怨说，他们的规则迫使银行报告巨额损失，这很不公平。这些规则要求银行必须按照第三方愿意支付的价格对某些资产进行估值，而不是按照管理者和监管者希望的价格。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[94,152,894,586],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true},"focusId":"focus-paragraph-1-3"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第2段\n\nUnfortunately, banks' lobbying now seems to be working. The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Unfortunately, banks' lobbying now seems to be working. The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[94,743,894,514],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第2段\n\nUnfortunately, / banks' lobbying / now seems to be working.\n\nThe details / may be unknowable, / but the independence of standard-setters, / essential to the proper functioning / of capital markets, / is being compromised.\n\nAnd, / unless banks carry toxic assets / at prices that attract buyers, / reviving the banking system / will be difficult.","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Unfortunately, banks' lobbying now seems to be working. The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Unfortunately, / banks' lobbying / now seems to be working.</p>\n<p>The details / may be unknowable, / but the independence of standard-setters, / essential to the proper functioning / of capital markets, / is being compromised.</p>\n<p>And, / unless banks carry toxic assets / at prices that attract buyers, / reviving the banking system / will be difficult.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[94,743,894,514],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-1"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第2段\n\n不幸的是，/ 银行的游说 / 现在似乎正在奏效。\n\n细节 / 可能无法知晓，/ 但准则制定者的独立性，/ 对正常运作至关重要的 / 资本市场的，/ 正在被损害。\n\n而且，/ 除非银行持有有毒资产 / 以吸引买家的价格，/ 重振银行系统 / 将会很困难。","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Unfortunately, banks' lobbying now seems to be working. The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Unfortunately, / banks' lobbying / now seems to be working.</p>\n<p>The details / may be unknowable, / but the independence of standard-setters, / essential to the proper functioning / of capital markets, / is being compromised.</p>\n<p>And, / unless banks carry toxic assets / at prices that attract buyers, / reviving the banking system / will be difficult.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>不幸的是，/ 银行的游说 / 现在似乎正在奏效。</p>\n<p>细节 / 可能无法知晓，/ 但准则制定者的独立性，/ 对正常运作至关重要的 / 资本市场的，/ 正在被损害。</p>\n<p>而且，/ 除非银行持有有毒资产 / 以吸引买家的价格，/ 重振银行系统 / 将会很困难。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[94,743,894,514],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-2"},{"title":"第2段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第2段\n\n不幸的是，银行的游说现在似乎正在奏效。虽然具体细节可能无法知晓，但对资本市场正常运作至关重要的准则制定者的独立性正在被损害。而且，除非银行以能够吸引买家的价格持有有毒资产，否则重振银行系统将会很困难。","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Unfortunately, banks' lobbying now seems to be working. The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Unfortunately, / banks' lobbying / now seems to be working.</p>\n<p>The details / may be unknowable, / but the independence of standard-setters, / essential to the proper functioning / of capital markets, / is being compromised.</p>\n<p>And, / unless banks carry toxic assets / at prices that attract buyers, / reviving the banking system / will be difficult.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>不幸的是，/ 银行的游说 / 现在似乎正在奏效。</p>\n<p>细节 / 可能无法知晓，/ 但准则制定者的独立性，/ 对正常运作至关重要的 / 资本市场的，/ 正在被损害。</p>\n<p>而且，/ 除非银行持有有毒资产 / 以吸引买家的价格，/ 重振银行系统 / 将会很困难。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-3\"><h3>标准译文 · 第2段</h3>\n<p>不幸的是，银行的游说现在似乎正在奏效。虽然具体细节可能无法知晓，但对资本市场正常运作至关重要的准则制定者的独立性正在被损害。而且，除非银行以能够吸引买家的价格持有有毒资产，否则重振银行系统将会很困难。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[94,743,894,514],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true},"focusId":"focus-paragraph-2-3"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第3段\n\nAfter a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\" Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\" Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[94,1267,894,901],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第3段\n\nAfter a bruising encounter / with Congress, / America's Financial Accounting Standards Board (FASB) / rushed through / rule changes.\n\nThese gave banks / more freedom / to use models / to value illiquid assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements.\n\nBob Herz, / the FASB's chairman, / cried out / against those / who \"question our motives.\"\n\nYet bank shares rose / and the changes enhance / what one lobbying group / politely calls / \"the use of judgment by management.\"","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\" Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>After a bruising encounter / with Congress, / America's Financial Accounting Standards Board (FASB) / rushed through / rule changes.</p>\n<p>These gave banks / more freedom / to use models / to value illiquid assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements.</p>\n<p>Bob Herz, / the FASB's chairman, / cried out / against those / who \"question our motives.\"</p>\n<p>Yet bank shares rose / and the changes enhance / what one lobbying group / politely calls / \"the use of judgment by management.\"</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[94,1267,894,901],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-1"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第3段\n\n在一次激烈交锋后 / 与国会的，/ 美国财务会计准则委员会（FASB）/ 匆忙通过了 / 规则变更。\n\n这些给了银行 / 更多自由 / 使用模型 / 来评估非流动资产 / 以及更多灵活性 / 在确认损失方面 / 对长期资产的 / 在他们的损益表中。\n\n鲍勃·赫兹，/ FASB的主席，/ 大声反对 / 那些人 / \"质疑我们动机\"的人。\n\n然而银行股上涨了 / 而且这些变更加强了 / 一个游说团体 / 礼貌地称之为 / \"管理层判断的使用\"。","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\" Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>After a bruising encounter / with Congress, / America's Financial Accounting Standards Board (FASB) / rushed through / rule changes.</p>\n<p>These gave banks / more freedom / to use models / to value illiquid assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements.</p>\n<p>Bob Herz, / the FASB's chairman, / cried out / against those / who \"question our motives.\"</p>\n<p>Yet bank shares rose / and the changes enhance / what one lobbying group / politely calls / \"the use of judgment by management.\"</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>在一次激烈交锋后 / 与国会的，/ 美国财务会计准则委员会（FASB）/ 匆忙通过了 / 规则变更。</p>\n<p>这些给了银行 / 更多自由 / 使用模型 / 来评估非流动资产 / 以及更多灵活性 / 在确认损失方面 / 对长期资产的 / 在他们的损益表中。</p>\n<p>鲍勃·赫兹，/ FASB的主席，/ 大声反对 / 那些人 / \"质疑我们动机\"的人。</p>\n<p>然而银行股上涨了 / 而且这些变更加强了 / 一个游说团体 / 礼貌地称之为 / \"管理层判断的使用\"。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[94,1267,894,901],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-2"},{"title":"第3段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第3段\n\n在与国会的激烈交锋后，美国财务会计准则委员会（FASB）匆忙通过了规则变更。这些变更给了银行更多自由来使用模型评估非流动资产，以及在损益表中确认长期资产损失时更多的灵活性。FASB主席鲍勃·赫兹大声反对那些\"质疑我们动机\"的人。然而银行股上涨了，而且这些变更加强了一个游说团体礼貌地称之为\"管理层判断的使用\"。","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements. Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\" Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>After a bruising encounter / with Congress, / America's Financial Accounting Standards Board (FASB) / rushed through / rule changes.</p>\n<p>These gave banks / more freedom / to use models / to value illiquid assets / and more flexibility / in recognizing losses / on long-term assets / in their income statements.</p>\n<p>Bob Herz, / the FASB's chairman, / cried out / against those / who \"question our motives.\"</p>\n<p>Yet bank shares rose / and the changes enhance / what one lobbying group / politely calls / \"the use of judgment by management.\"</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>在一次激烈交锋后 / 与国会的，/ 美国财务会计准则委员会（FASB）/ 匆忙通过了 / 规则变更。</p>\n<p>这些给了银行 / 更多自由 / 使用模型 / 来评估非流动资产 / 以及更多灵活性 / 在确认损失方面 / 对长期资产的 / 在他们的损益表中。</p>\n<p>鲍勃·赫兹，/ FASB的主席，/ 大声反对 / 那些人 / \"质疑我们动机\"的人。</p>\n<p>然而银行股上涨了 / 而且这些变更加强了 / 一个游说团体 / 礼貌地称之为 / \"管理层判断的使用\"。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-3\"><h3>标准译文 · 第3段</h3>\n<p>在与国会的激烈交锋后，美国财务会计准则委员会（FASB）匆忙通过了规则变更。这些变更给了银行更多自由来使用模型评估非流动资产，以及在损益表中确认长期资产损失时更多的灵活性。FASB主席鲍勃·赫兹大声反对那些\"质疑我们动机\"的人。然而银行股上涨了，而且这些变更加强了一个游说团体礼貌地称之为\"管理层判断的使用\"。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[94,1267,894,901],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true},"focusId":"focus-paragraph-3-3"},{"title":"第4段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第4段\n\nEuropean ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[94,2174,894,617],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-0"},{"title":"第4段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第4段\n\nEuropean ministers / instantly demanded / that the International Accounting Standards Board (IASB) / do likewise.\n\nThe IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes / its reconstruction of rules / later this year / is strong.\n\nCharlie McCreevy, / a European commissioner, / warned the IASB / that it did \"not live / in a political vacuum\" / but \"in the real world\" / and that Europe / could yet develop / different rules.","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>European ministers / instantly demanded / that the International Accounting Standards Board (IASB) / do likewise.</p>\n<p>The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes / its reconstruction of rules / later this year / is strong.</p>\n<p>Charlie McCreevy, / a European commissioner, / warned the IASB / that it did \"not live / in a political vacuum\" / but \"in the real world\" / and that Europe / could yet develop / different rules.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[94,2174,894,617],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-1"},{"title":"第4段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第4段\n\n欧洲部长们 / 立即要求 / 国际会计准则理事会（IASB）/ 也这样做。\n\nIASB说 / 它不想行动 / 没有整体规划的情况下，/ 但屈服的压力 / 当它完成 / 其规则重建 / 今年晚些时候 / 是强大的。\n\n查理·麦克里维，/ 一位欧洲专员，/ 警告IASB / 它\"不是生活 / 在政治真空中\" / 而是\"在现实世界中\" / 而且欧洲 / 可能还会制定 / 不同的规则。","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>European ministers / instantly demanded / that the International Accounting Standards Board (IASB) / do likewise.</p>\n<p>The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes / its reconstruction of rules / later this year / is strong.</p>\n<p>Charlie McCreevy, / a European commissioner, / warned the IASB / that it did \"not live / in a political vacuum\" / but \"in the real world\" / and that Europe / could yet develop / different rules.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3>\n<p>欧洲部长们 / 立即要求 / 国际会计准则理事会（IASB）/ 也这样做。</p>\n<p>IASB说 / 它不想行动 / 没有整体规划的情况下，/ 但屈服的压力 / 当它完成 / 其规则重建 / 今年晚些时候 / 是强大的。</p>\n<p>查理·麦克里维，/ 一位欧洲专员，/ 警告IASB / 它\"不是生活 / 在政治真空中\" / 而是\"在现实世界中\" / 而且欧洲 / 可能还会制定 / 不同的规则。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[94,2174,894,617],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-2"},{"title":"第4段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第4段\n\n欧洲部长们立即要求国际会计准则理事会（IASB）也采取同样的做法。IASB表示不想在没有整体规划的情况下行动，但当它在今年晚些时候完成规则重建时，屈服的压力将会很大。欧洲专员查理·麦克里维警告IASB，它\"不是生活在政治真空中\"而是\"在现实世界中\"，而且欧洲可能还会制定不同的规则。","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong. Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>European ministers / instantly demanded / that the International Accounting Standards Board (IASB) / do likewise.</p>\n<p>The IASB says / it does not want to act / without overall planning, / but the pressure to fold / when it completes / its reconstruction of rules / later this year / is strong.</p>\n<p>Charlie McCreevy, / a European commissioner, / warned the IASB / that it did \"not live / in a political vacuum\" / but \"in the real world\" / and that Europe / could yet develop / different rules.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3>\n<p>欧洲部长们 / 立即要求 / 国际会计准则理事会（IASB）/ 也这样做。</p>\n<p>IASB说 / 它不想行动 / 没有整体规划的情况下，/ 但屈服的压力 / 当它完成 / 其规则重建 / 今年晚些时候 / 是强大的。</p>\n<p>查理·麦克里维，/ 一位欧洲专员，/ 警告IASB / 它\"不是生活 / 在政治真空中\" / 而是\"在现实世界中\" / 而且欧洲 / 可能还会制定 / 不同的规则。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-3\"><h3>标准译文 · 第4段</h3>\n<p>欧洲部长们立即要求国际会计准则理事会（IASB）也采取同样的做法。IASB表示不想在没有整体规划的情况下行动，但当它在今年晚些时候完成规则重建时，屈服的压力将会很大。欧洲专员查理·麦克里维警告IASB，它\"不是生活在政治真空中\"而是\"在现实世界中\"，而且欧洲可能还会制定不同的规则。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[94,2174,894,617],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true},"focusId":"focus-paragraph-4-3"},{"title":"第5段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第5段\n\nIt was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks' shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks' shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[94,2796,894,935],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-0"},{"title":"第5段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第5段\n\nIt was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets.\n\nToday they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.\n\nThe truth / will not be known / for years.\n\nBut banks' shares / trade below their book value, / suggesting that investors / are skeptical.\n\nAnd dead markets / partly reflect / the paralysis of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those supposed bargains.","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks' shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>It was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets.</p>\n<p>Today they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.</p>\n<p>The truth / will not be known / for years.</p>\n<p>But banks' shares / trade below their book value, / suggesting that investors / are skeptical.</p>\n<p>And dead markets / partly reflect / the paralysis of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those supposed bargains.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[94,2796,894,935],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-1"},{"title":"第5段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第5段\n\n是银行 / 在错误的星球上，/ 用账目 / 大大高估了资产。\n\n今天他们争辩 / 市场价格 / 夸大了损失，/ 因为它们主要反映 / 市场的暂时流动性不足，/ 而不是可能的程度 / 坏账的。\n\n真相 / 将不会被知道 / 多年内。\n\n但银行股票 / 交易低于其账面价值，/ 表明投资者 / 是怀疑的。\n\n而且死气沉沉的市场 / 部分反映了 / 银行的瘫痪 / 它们不会出售资产 / 因为害怕记录损失，/ 但又不愿意购买 / 所有那些所谓的便宜货。","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks' shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>It was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets.</p>\n<p>Today they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.</p>\n<p>The truth / will not be known / for years.</p>\n<p>But banks' shares / trade below their book value, / suggesting that investors / are skeptical.</p>\n<p>And dead markets / partly reflect / the paralysis of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those supposed bargains.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>是银行 / 在错误的星球上，/ 用账目 / 大大高估了资产。</p>\n<p>今天他们争辩 / 市场价格 / 夸大了损失，/ 因为它们主要反映 / 市场的暂时流动性不足，/ 而不是可能的程度 / 坏账的。</p>\n<p>真相 / 将不会被知道 / 多年内。</p>\n<p>但银行股票 / 交易低于其账面价值，/ 表明投资者 / 是怀疑的。</p>\n<p>而且死气沉沉的市场 / 部分反映了 / 银行的瘫痪 / 它们不会出售资产 / 因为害怕记录损失，/ 但又不愿意购买 / 所有那些所谓的便宜货。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[94,2796,894,935],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-2"},{"title":"第5段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第5段\n\n是银行在错误的星球上，他们的账目大大高估了资产价值。今天他们争辩说市场价格夸大了损失，因为这些价格主要反映的是市场暂时的流动性不足，而不是坏账的可能程度。真相在多年内都不会被知晓。但银行股票的交易价格低于其账面价值，这表明投资者持怀疑态度。而且死气沉沉的市场部分反映了银行的瘫痪状态——它们因害怕记录损失而不愿出售资产，但又不愿意购买所有那些所谓的便宜货。","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks' shares trade below their book value, suggesting that investors are skeptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>It was banks / that were on the wrong planet, / with accounts / that vastly overvalued assets.</p>\n<p>Today they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.</p>\n<p>The truth / will not be known / for years.</p>\n<p>But banks' shares / trade below their book value, / suggesting that investors / are skeptical.</p>\n<p>And dead markets / partly reflect / the paralysis of banks / which will not sell assets / for fear of booking losses, / yet are reluctant to buy / all those supposed bargains.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>是银行 / 在错误的星球上，/ 用账目 / 大大高估了资产。</p>\n<p>今天他们争辩 / 市场价格 / 夸大了损失，/ 因为它们主要反映 / 市场的暂时流动性不足，/ 而不是可能的程度 / 坏账的。</p>\n<p>真相 / 将不会被知道 / 多年内。</p>\n<p>但银行股票 / 交易低于其账面价值，/ 表明投资者 / 是怀疑的。</p>\n<p>而且死气沉沉的市场 / 部分反映了 / 银行的瘫痪 / 它们不会出售资产 / 因为害怕记录损失，/ 但又不愿意购买 / 所有那些所谓的便宜货。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段</h3>\n<p>是银行在错误的星球上，他们的账目大大高估了资产价值。今天他们争辩说市场价格夸大了损失，因为这些价格主要反映的是市场暂时的流动性不足，而不是坏账的可能程度。真相在多年内都不会被知晓。但银行股票的交易价格低于其账面价值，这表明投资者持怀疑态度。而且死气沉沉的市场部分反映了银行的瘫痪状态——它们因害怕记录损失而不愿出售资产，但又不愿意购买所有那些所谓的便宜货。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[94,2796,894,935],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true},"focusId":"focus-paragraph-5-3"},{"title":"第6段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第6段\n\nTo get the system working again, losses must be recognized and dealt with. America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by giving in to critics now they are inviting pressure to make more concessions.","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>To get the system working again, losses must be recognized and dealt with. America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by giving in to critics now they are inviting pressure to make more concessions.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[94,3735,894,684],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-0"},{"title":"第6段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第6段\n\nTo get the system working again, / losses must be recognized / and dealt with.\n\nAmerica's new plan / to buy up toxic assets / will not work / unless banks mark assets / to levels / which buyers find attractive.\n\nSuccessful markets / require independent / and even combative / standard-setters.\n\nThe FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.\n\nBut by giving in / to critics now / they are inviting pressure / to make more concessions.","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>To get the system working again, losses must be recognized and dealt with. America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by giving in to critics now they are inviting pressure to make more concessions.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3>\n<p>To get the system working again, / losses must be recognized / and dealt with.</p>\n<p>America's new plan / to buy up toxic assets / will not work / unless banks mark assets / to levels / which buyers find attractive.</p>\n<p>Successful markets / require independent / and even combative / standard-setters.</p>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n<p>But by giving in / to critics now / they are inviting pressure / to make more concessions.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[94,3735,894,684],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-1"},{"title":"第6段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第6段\n\n要让系统重新运作，/ 损失必须被承认 / 并处理。\n\n美国的新计划 / 购买有毒资产的 / 将不会奏效 / 除非银行标记资产 / 到水平 / 买家认为有吸引力的。\n\n成功的市场 / 需要独立的 / 甚至是好斗的 / 准则制定者。\n\nFASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。\n\n但通过屈服 / 于批评者现在 / 他们正在招致压力 / 做出更多让步。","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>To get the system working again, losses must be recognized and dealt with. America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by giving in to critics now they are inviting pressure to make more concessions.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3>\n<p>To get the system working again, / losses must be recognized / and dealt with.</p>\n<p>America's new plan / to buy up toxic assets / will not work / unless banks mark assets / to levels / which buyers find attractive.</p>\n<p>Successful markets / require independent / and even combative / standard-setters.</p>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n<p>But by giving in / to critics now / they are inviting pressure / to make more concessions.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-2\"><h3>意群翻译 · 第6段</h3>\n<p>要让系统重新运作，/ 损失必须被承认 / 并处理。</p>\n<p>美国的新计划 / 购买有毒资产的 / 将不会奏效 / 除非银行标记资产 / 到水平 / 买家认为有吸引力的。</p>\n<p>成功的市场 / 需要独立的 / 甚至是好斗的 / 准则制定者。</p>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n<p>但通过屈服 / 于批评者现在 / 他们正在招致压力 / 做出更多让步。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[94,3735,894,684],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-2"},{"title":"第6段","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第6段\n\n要让系统重新运作，损失必须被承认并加以处理。美国购买有毒资产的新计划将不会奏效，除非银行将资产标记到买家认为有吸引力的水平。成功的市场需要独立的、甚至是好斗的准则制定者。FASB和IASB一直正是这样，例如，他们不顾特殊利益集团的敌意，清理了股票期权和养老金的规则。但现在通过向批评者屈服，他们正在招致做出更多让步的压力。","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>To get the system working again, losses must be recognized and dealt with. America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by giving in to critics now they are inviting pressure to make more concessions.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3>\n<p>To get the system working again, / losses must be recognized / and dealt with.</p>\n<p>America's new plan / to buy up toxic assets / will not work / unless banks mark assets / to levels / which buyers find attractive.</p>\n<p>Successful markets / require independent / and even combative / standard-setters.</p>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n<p>But by giving in / to critics now / they are inviting pressure / to make more concessions.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-2\"><h3>意群翻译 · 第6段</h3>\n<p>要让系统重新运作，/ 损失必须被承认 / 并处理。</p>\n<p>美国的新计划 / 购买有毒资产的 / 将不会奏效 / 除非银行标记资产 / 到水平 / 买家认为有吸引力的。</p>\n<p>成功的市场 / 需要独立的 / 甚至是好斗的 / 准则制定者。</p>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n<p>但通过屈服 / 于批评者现在 / 他们正在招致压力 / 做出更多让步。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-3\"><h3>标准译文 · 第6段</h3>\n<p>要让系统重新运作，损失必须被承认并加以处理。美国购买有毒资产的新计划将不会奏效，除非银行将资产标记到买家认为有吸引力的水平。成功的市场需要独立的、甚至是好斗的准则制定者。FASB和IASB一直正是这样，例如，他们不顾特殊利益集团的敌意，清理了股票期权和养老金的规则。但现在通过向批评者屈服，他们正在招致做出更多让步的压力。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[94,3735,894,684],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":true},"focusId":"focus-paragraph-6-3"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","level":1,"section":"第二鸟 · 精读与翻译","raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\n\n符号的作用：\n\n- `→`：主要叙述继续向下推进；\n- `+`：并列；\n- `：`：解释、修饰或补充；\n- `//`：转折或对比；\n- 括号：把同一层的信息捆成一个整体。","html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{}},{"title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 句子逻辑梳理（选修，按照自身语法基础而定)\n\n**第1段**\n\nBankers have been blaming themselves：(for their troubles)：(in public).\n\nBehind the scenes → they have been taking aim：(at someone else)：the accounting standard-setters.\n\nTheir rules：(moan the banks) → have forced them → to report enormous losses + it's just not fair.\n\nThese rules say：(they must value some assets：(at the price：(a third party would pay))) // not the price：(managers and regulators → would like them to fetch).\n\n**第2段**\n\nUnfortunately → banks' lobbying → now seems to be working.\n\nThe details → may be unknowable // but the independence of standard-setters：(essential to the proper functioning：(of capital markets)) → is being compromised.\n\nAnd → unless banks carry toxic assets：(at prices：(that attract buyers)) → reviving the banking system → will be difficult.\n\n**第3段**\n\nAfter a bruising encounter：(with Congress) → America's Financial Accounting Standards Board (FASB) → rushed through → rule changes.\n\nThese gave banks：(more freedom：(to use models：(to value illiquid assets))) + (more flexibility：(in recognizing losses：(on long-term assets)：(in their income statements))).\n\nBob Herz：(the FASB's chairman) → cried out：(against those：(who \"question our motives\")).\n\nYet bank shares rose + the changes enhance：(what one lobbying group → politely calls：(\"the use of judgment by management\")).\n\n**第4段**\n\nEuropean ministers → instantly demanded：(that the International Accounting Standards Board (IASB) → do likewise).\n\nThe IASB says：(it does not want to act：(without overall planning)) // but the pressure to fold：(when it completes → its reconstruction of rules：(later this year)) → is strong.\n\nCharlie McCreevy：(a European commissioner) → warned the IASB：(that it did \"not live：(in a political vacuum)\" // but \"in the real world\") + (that Europe → could yet develop → different rules).\n\n**第5段**\n\nIt was banks：(that were on the wrong planet)：(with accounts：(that vastly overvalued assets)).\n\nToday they argue：(that market prices → overstate losses)：(because they largely reflect → the temporary illiquidity of markets // not the likely extent：(of bad debts)).\n\nThe truth → will not be known：(for years).\n\nBut banks' shares → trade below their book value → suggesting：(that investors → are skeptical).\n\nAnd dead markets → partly reflect → the paralysis of banks：(which will not sell assets：(for fear of booking losses)) // (yet are reluctant to buy：(all those supposed bargains)).\n\n**第6段**\n\nTo get the system working again → losses must be recognized + dealt with.\n\nAmerica's new plan：(to buy up toxic assets) → will not work → unless banks mark assets：(to levels：(which buyers find attractive)).\n\nSuccessful markets → require independent + even combative → standard-setters.\n\nThe FASB and IASB → have been exactly that → cleaning up rules：(on stock options and pensions)：(for example)：(against hostility：(from special interests)).\n\nBut by giving in：(to critics now) → they are inviting pressure：(to make more concessions).","html":"<p><strong>第1段</strong></p>\n<p>Bankers have been blaming themselves：(for their troubles)：(in public).</p>\n<p>Behind the scenes → they have been taking aim：(at someone else)：the accounting standard-setters.</p>\n<p>Their rules：(moan the banks) → have forced them → to report enormous losses + it's just not fair.</p>\n<p>These rules say：(they must value some assets：(at the price：(a third party would pay))) // not the price：(managers and regulators → would like them to fetch).</p>\n<p><strong>第2段</strong></p>\n<p>Unfortunately → banks' lobbying → now seems to be working.</p>\n<p>The details → may be unknowable // but the independence of standard-setters：(essential to the proper functioning：(of capital markets)) → is being compromised.</p>\n<p>And → unless banks carry toxic assets：(at prices：(that attract buyers)) → reviving the banking system → will be difficult.</p>\n<p><strong>第3段</strong></p>\n<p>After a bruising encounter：(with Congress) → America's Financial Accounting Standards Board (FASB) → rushed through → rule changes.</p>\n<p>These gave banks：(more freedom：(to use models：(to value illiquid assets))) + (more flexibility：(in recognizing losses：(on long-term assets)：(in their income statements))).</p>\n<p>Bob Herz：(the FASB's chairman) → cried out：(against those：(who \"question our motives\")).</p>\n<p>Yet bank shares rose + the changes enhance：(what one lobbying group → politely calls：(\"the use of judgment by management\")).</p>\n<p><strong>第4段</strong></p>\n<p>European ministers → instantly demanded：(that the International Accounting Standards Board (IASB) → do likewise).</p>\n<p>The IASB says：(it does not want to act：(without overall planning)) // but the pressure to fold：(when it completes → its reconstruction of rules：(later this year)) → is strong.</p>\n<p>Charlie McCreevy：(a European commissioner) → warned the IASB：(that it did \"not live：(in a political vacuum)\" // but \"in the real world\") + (that Europe → could yet develop → different rules).</p>\n<p><strong>第5段</strong></p>\n<p>It was banks：(that were on the wrong planet)：(with accounts：(that vastly overvalued assets)).</p>\n<p>Today they argue：(that market prices → overstate losses)：(because they largely reflect → the temporary illiquidity of markets // not the likely extent：(of bad debts)).</p>\n<p>The truth → will not be known：(for years).</p>\n<p>But banks' shares → trade below their book value → suggesting：(that investors → are skeptical).</p>\n<p>And dead markets → partly reflect → the paralysis of banks：(which will not sell assets：(for fear of booking losses)) // (yet are reluctant to buy：(all those supposed bargains)).</p>\n<p><strong>第6段</strong></p>\n<p>To get the system working again → losses must be recognized + dealt with.</p>\n<p>America's new plan：(to buy up toxic assets) → will not work → unless banks mark assets：(to levels：(which buyers find attractive)).</p>\n<p>Successful markets → require independent + even combative → standard-setters.</p>\n<p>The FASB and IASB → have been exactly that → cleaning up rules：(on stock options and pensions)：(for example)：(against hostility：(from special interests)).</p>\n<p>But by giving in：(to critics now) → they are inviting pressure：(to make more concessions).</p>\n","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{}},{"title":"中文版句子逻辑（选修)","level":1,"section":"第二鸟 · 精读与翻译","raw":"### 中文版句子逻辑（选修)\n\n**第1段**\n\n银行家们一直在自责：(为他们的麻烦)：(在公开场合)。\n\n在幕后 → 他们一直在瞄准：(其他人)：会计准则制定者。\n\n他们的规则：(银行抱怨道) → 已经迫使他们 → 报告巨额损失 + 这很不公平。\n\n这些规则规定：(他们必须对某些资产估值：(按照价格：(第三方愿意支付的))) // 而不是价格：(管理者和监管者 → 希望它们达到的)。\n\n**第2段**\n\n不幸的是 → 银行的游说 → 现在似乎正在奏效。\n\n细节 → 可能无法知晓 // 但准则制定者的独立性：(对正常运作至关重要的：(资本市场的)) → 正在被损害。\n\n而且 → 除非银行持有有毒资产：(以价格：(吸引买家的)) → 重振银行系统 → 将会很困难。\n\n**第3段**\n\n在一次激烈交锋后：(与国会的) → 美国财务会计准则委员会（FASB）→ 匆忙通过了 → 规则变更。\n\n这些给了银行：(更多自由：(使用模型：(来评估非流动资产))) + (更多灵活性：(在确认损失方面：(对长期资产的)：(在他们的损益表中)))。\n\n鲍勃·赫兹：(FASB的主席) → 大声反对：(那些人：(\"质疑我们动机\"的人))。\n\n然而银行股上涨了 + 这些变更加强了：(一个游说团体 → 礼貌地称之为：(\"管理层判断的使用\"))。\n\n**第4段**\n\n欧洲部长们 → 立即要求：(国际会计准则理事会（IASB）→ 也这样做)。\n\nIASB说：(它不想行动：(没有整体规划的情况下)) // 但屈服的压力：(当它完成 → 其规则重建：(今年晚些时候)) → 是强大的。\n\n查理·麦克里维：(一位欧洲专员) → 警告IASB：(它\"不是生活：(在政治真空中)\" // 而是\"在现实世界中\") + (欧洲 → 可能还会制定 → 不同的规则)。\n\n**第5段**\n\n是银行：(在错误的星球上)：(用账目：(大大高估了资产))。\n\n今天他们争辩：(市场价格 → 夸大了损失)：(因为它们主要反映 → 市场的暂时流动性不足 // 而不是可能的程度：(坏账的))。\n\n真相 → 将不会被知道：(多年内)。\n\n但银行股票 → 交易低于其账面价值 → 表明：(投资者 → 是怀疑的)。\n\n而且死气沉沉的市场 → 部分反映了 → 银行的瘫痪：(它们不会出售资产：(因为害怕记录损失)) // (但又不愿意购买：(所有那些所谓的便宜货))。\n\n**第6段**\n\n要让系统重新运作 → 损失必须被承认 + 处理。\n\n美国的新计划：(购买有毒资产的) → 将不会奏效 → 除非银行标记资产：(到水平：(买家认为有吸引力的))。\n\n成功的市场 → 需要独立的 + 甚至是好斗的 → 准则制定者。\n\nFASB和IASB → 一直正是这样 → 清理规则：(关于股票期权和养老金的)：(例如)：(对抗敌意：(来自特殊利益集团的))。\n\n但通过屈服：(于批评者现在) → 他们正在招致压力：(做出更多让步)。","html":"<p><strong>第1段</strong></p>\n<p>银行家们一直在自责：(为他们的麻烦)：(在公开场合)。</p>\n<p>在幕后 → 他们一直在瞄准：(其他人)：会计准则制定者。</p>\n<p>他们的规则：(银行抱怨道) → 已经迫使他们 → 报告巨额损失 + 这很不公平。</p>\n<p>这些规则规定：(他们必须对某些资产估值：(按照价格：(第三方愿意支付的))) // 而不是价格：(管理者和监管者 → 希望它们达到的)。</p>\n<p><strong>第2段</strong></p>\n<p>不幸的是 → 银行的游说 → 现在似乎正在奏效。</p> 损失，因为这些价格主要反映市场暂时的流动性不足，而不是坏账可能达到的程度。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>银行辩称市场价格夸大损失，因为价格反映A，而非B。</p>\n</blockquote>\n<p><code>they</code>回指银行；第二个<code>they</code>回指市场价格。两个代词的对象不同，中文都要补清，避免指代混乱。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>如今银行辩称，市场价格夸大了损失，因为这些价格主要反映的是市场暂时缺乏流动性，而不是真实坏账的可能程度。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"5. 第五段第二句","focus":[96,2861,891,445],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-4"},{"title":"5. 第五段第二句","level":1,"section":"第二鸟 · 长难句手译","raw":"#### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- 两处`they`分别译出“银行”和“这些价格”；\n- `temporary illiquidity`整理为“市场暂时的流动性不足”；\n- `likely extent`保留为“可能程度”，不脑补成坏账不存在。\n\n参考译文：\n\n> 今天他们争辩说市场价格夸大了损失，因为这些价格主要反映的是市场暂时的流动性不足，而不是坏账的可能程度。","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3>\n<blockquote>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>Today they argue / that market prices / overstate losses, / because they largely reflect / the temporary illiquidity of markets, / not the likely extent / of bad debts.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>今天他们争辩 / 市场价格 / 夸大了损失，/ 因为它们主要反映 / 市场的暂时流动性不足，/ 而不是可能的程度 / 坏账的。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把银行的主张说完整：</p>\n<blockquote>\n<p>今天它们辩称，市场价格夸大了损失</p>\n</blockquote>\n<p>原因内部是“反映A，而不是反映B”的对照：</p>\n<blockquote>\n<p>因为这些价格主要反映市场暂时的流动性不足，而不是坏账可能达到的程度</p>\n</blockquot 一步：划分意群\n\n> The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文</h3>\n<blockquote>\n<p>The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"6. 第六段第四句","focus":[96,3931,891,226],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-1"},{"title":"6. 第六段第四句","level":1,"section":"第二鸟 · 长难句手译","raw":"#### 第二步：逐个意群直译\n\n> FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文</h3>\n<blockquote>\n<p>The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"6. 第六段第四句","focus":[96,3931,891,226],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-2"},{"title":"6. 第六段第四句","level":1,"section":"第二鸟 · 长难句手译","raw":"#### 第三步：按照中文语感合并意群\n\n先把`exactly that`接回上一句的“独立、甚至强硬的准则制定者”：\n\n> FASB和IASB一直正是这样的准则制定者\n\n后面的例子说它们顶着谁的阻力做了什么：\n\n> 例如，它们顶着特殊利益集团的敌意，清理了股票期权和养老金规则\n\n先得到：\n\n> FASB和IASB一直正是这样的准则制定者，例如顶着特殊利益集团的敌意，清理股票期权和养老金规则。","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文</h3>\n<blockquote>\n<p>The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把<code>exactly that</code>接回上一句的“独立、甚至强硬的准则制定者”：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样的准则制定者</p>\n</blockquote>\n<p>后面的例子说它们顶着谁的阻力做了什么：</p>\n<blockquote>\n<p>例如，它们顶着特殊利益集团的敌意，清理了股票期权和养老金规则</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样的准则制定者，例如顶着特殊利益集团的敌意，清理股票期权和养老金规则。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"6. 第六段第四句","focus":[96,3931,891,226],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-3"},{"title":"6. 第六段第四句","level":1,"section":"第二鸟 · 长难句手译","raw":"#### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> FASB和IASB一直如此，并清理了规则。\n\n“股票期权和养老金”限定规则类型；“来自特殊利益集团的敌意”交代阻力；“例如”提示这是对上一句评价的证明。\n\n按照中文语序调整后是：\n\n> FASB和IASB一直就是这种独立而强硬的制定者，例如，它们不顾特殊利益集团的敌意，清理了股票期权和养老金方面的规则。","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文</h3>\n<blockquote>\n<p>The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>The FASB and IASB / have been exactly that, / cleaning up rules / on stock options and pensions, / for example, / against hostility / from special interests.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>FASB和IASB / 一直正是这样，/ 清理规则 / 关于股票期权和养老金的，/ 例如，/ 对抗敌意 / 来自特殊利益集团的。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把<code>exactly that</code>接回上一句的“独立、甚至强硬的准则制定者”：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样的准则制定者</p>\n</blockquote>\n<p>后面的例子说它们顶着谁的阻力做了什么：</p>\n<blockquote>\n<p>例如，它们顶着特殊利益集团的敌意，清理了股票期权和养老金规则</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>FASB和IASB一直正是这样的准则制定者，例如顶着特殊利益集团的敌意，清理股票期权和养老金规则。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>FASB和IASB一直如此，并清理了规则。</p>\n</blockquote>\n<p>“股票期权和养老金”限定规则类型；“来自特殊利益集团的敌意”交代阻力；“例如”提示这是对上一句评价的证明。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>FASB和IASB一直就是这种独立而强硬的制定者，例如，它们不顾特殊利益集团的敌意，清理了股票期权和养老金方面的规则。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"6. 第六段第四句","focus":[96,3931,891,226],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-4"},{"title":"6. 第六段第四句","level":1,"section":"第二鸟 · 长难句手译","raw":"#### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- 把`that`的具体内容补出，避免“正是这
