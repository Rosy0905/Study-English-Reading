\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们夸大了其资产的实际价值。</p>\n</blockquote>\n<p>题干引用的<code>wrong planet</code>与B的资产价值描述，在第5段首句就能对应。关键不只是<code>banks</code>，而是紧接的<code>with accounts</code>及其后面说明账目问题的部分。</p>\n<p>作者说是银行完全脱离现实，因为它们的账目大幅高估了资产。<code>overvalued</code>说明估值超过应有价值，<code>vastly</code>加强高估的程度。</p>\n<p>B的主体仍是银行，对象仍是银行自己的资产，动作是夸大实际价值，与原文的高估方向相同。它没有改成低估资产，也没有改成否认坏账或误读市场指标。</p>\n<p><code>overvalued assets</code>与<code>exaggerated the real value of their assets</code>只是表达方式不同；题干要求解释的评价与同句理由完整对应。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-B-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>But banks' shares trade below their book value, suggesting that investors are skeptical.</p>\n<p>银行账目高估资产，后文又用股价低于账面价值和投资者怀疑说明银行的说法不可信。</p>\n</blockquote>\n<p>作者先指出账面估值偏高，再让读者看到市场并不接受银行所报的价值。后文的怀疑与首句批评保持同一方向。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks’ accounts greatly exaggerated the value of their assets.</p>\n<p>银行的账目大大夸大了其资产价值。</p>\n</blockquote>\n<p>B所需要的写法就是原文首句中的账目高估；后面的账面价值与市场价格对照又延续这一问题，而不是另给一项无关原因。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-B-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入39题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。</p>\n</blockquote>\n<p>B实际说的是：</p>\n<blockquote>\n<p>exaggerated the real value of their assets<br/>\n夸大了其资产的实际价值</p>\n</blockquote>\n<p>作者支持准则制定者，是因为真正需要处理的是银行资产和损失的问题。B与这个责任方向一致，但决定本项的仍是首句<code>vastly overvalued assets</code>，它把宽泛的银行问题限定为资产价值高估。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":true},"focusId":"focus-q39-B-3"},{"title":"C. neglected the likely existence of bad debts","level":3,"section":"第三鸟 · 题目复盘","raw":"### C. neglected the likely existence of bad debts\n\n> 忽视了坏账可能存在\n\n**做题模式中的状态：**当时C完整可读。我们看到原文中确实有`bad debts`，但银行谈的是市场价格是否反映坏账的可能程度，不是忽视坏账存在；`wrong planet`后面又明确写高估资产。所以第一轮排除C，后续未改变。\n\n**错误类型：第一类——歪曲原意。**\n\nC借了`the likely extent of bad debts`，把坏账“可能达到什么程度”改成坏账“可能存在”，再加上银行忽视它的态度。对象看似还是坏账，实际问题从规模变成存在性，也换掉了首句的解释。\n\n**出处：**\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n>\n> Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>忽视了坏账可能存在</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C完整可读。我们看到原文中确实有<code>bad debts</code>，但银行谈的是市场价格是否反映坏账的可能程度，不是忽视坏账存在；<code>wrong planet</code>后面又明确写高估资产。所以第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>the likely extent of bad debts</code>，把坏账“可能达到什么程度”改成坏账“可能存在”，再加上银行忽视它的态度。对象看似还是坏账，实际问题从规模变成存在性，也换掉了首句的解释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false},"focusId":"focus-q39-C-0"},{"title":"C. neglected the likely existence of bad debts","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为银行“完全脱离现实”，是因为它们忽视了坏账可能存在。\n\nC的`bad debts`出现在第5段第二句，但题干的引语在首句。即便先顺着这个词定位，也要检查原文谈坏账的哪一方面。\n\n银行辩称市场价格主要反映暂时流动性不足，而不是坏账的可能程度。原文使用`extent`，不是`existence`；银行在谈坏账多严重，而不是文中说它们忽略坏账会存在。\n\nC将程度换成存在性，又用`neglected`替银行补出忽视的行为。`not`在原文否定的是价格反映什么，不能搬过去否定银行对坏账的认识。\n\n因此，C不只是从后句取证，还改变了后句本身的关系：不认为某价格反映坏账规模，不等于忽略坏账可能存在。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>忽视了坏账可能存在</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C完整可读。我们看到原文中确实有<code>bad debts</code>，但银行谈的是市场价格是否反映坏账的可能程度，不是忽视坏账存在；<code>wrong planet</code>后面又明确写高估资产。所以第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>the likely extent of bad debts</code>，把坏账“可能达到什么程度”改成坏账“可能存在”，再加上银行忽视它的态度。对象看似还是坏账，实际问题从规模变成存在性，也换掉了首句的解释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们忽视了坏账可能存在。</p>\n</blockquote>\n<p>C的<code>bad debts</code>出现在第5段第二句，但题干的引语在首句。即便先顺着这个词定位，也要检查原文谈坏账的哪一方面。</p>\n<p>银行辩称市场价格主要反映暂时流动性不足，而不是坏账的可能程度。原文使用<code>extent</code>，不是<code>existence</code>；银行在谈坏账多严重，而不是文中说它们忽略坏账会存在。</p>\n<p>C将程度换成存在性，又用<code>neglected</code>替银行补出忽视的行为。<code>not</code>在原文否定的是价格反映什么，不能搬过去否定银行对坏账的认识。</p>\n<p>因此，C不只是从后句取证，还改变了后句本身的关系：不认为某价格反映坏账规模，不等于忽略坏账可能存在。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false},"focusId":"focus-q39-C-1"},{"title":"C. neglected the likely existence of bad debts","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.\n>\n> The truth will not be known for years.\n>\n> 银行争辩价格反映的是暂时缺乏流动性而非坏账程度，作者接着说真相多年以后才会清楚。\n\n实际文章把争执放在损失究竟多大、价格反映什么上，并没有接着揭露银行完全忘记坏账这种可能性。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Banks were on the wrong planet because they ignored the possibility that bad debts existed.\n>\n> 银行完全脱离现实，是因为它们忽视了坏账可能存在。\n\n假设句要把忽视坏账存在写成原因。实际原文既在首句给出资产高估，又在次句讨论坏账程度；它没有走向C的存在性忽视。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>忽视了坏账可能存在</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C完整可读。我们看到原文中确实有<code>bad debts</code>，但银行谈的是市场价格是否反映坏账的可能程度，不是忽视坏账存在；<code>wrong planet</code>后面又明确写高估资产。所以第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>the likely extent of bad debts</code>，把坏账“可能达到什么程度”改成坏账“可能存在”，再加上银行忽视它的态度。对象看似还是坏账，实际问题从规模变成存在性，也换掉了首句的解释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们忽视了坏账可能存在。</p>\n</blockquote>\n<p>C的<code>bad debts</code>出现在第5段第二句，但题干的引语在首句。即便先顺着这个词定位，也要检查原文谈坏账的哪一方面。</p>\n<p>银行辩称市场价格主要反映暂时流动性不足，而不是坏账的可能程度。原文使用<code>extent</code>，不是<code>existence</code>；银行在谈坏账多严重，而不是文中说它们忽略坏账会存在。</p>\n<p>C将程度换成存在性，又用<code>neglected</code>替银行补出忽视的行为。<code>not</code>在原文否定的是价格反映什么，不能搬过去否定银行对坏账的认识。</p>\n<p>因此，C不只是从后句取证，还改变了后句本身的关系：不认为某价格反映坏账规模，不等于忽略坏账可能存在。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>The truth will not be known for years.</p>\n<p>银行争辩价格反映的是暂时缺乏流动性而非坏账程度，作者接着说真相多年以后才会清楚。</p>\n</blockquote>\n<p>实际文章把争执放在损失究竟多大、价格反映什么上，并没有接着揭露银行完全忘记坏账这种可能性。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks were on the wrong planet because they ignored the possibility that bad debts existed.</p>\n<p>银行完全脱离现实，是因为它们忽视了坏账可能存在。</p>\n</blockquote>\n<p>假设句要把忽视坏账存在写成原因。实际原文既在首句给出资产高估，又在次句讨论坏账程度；它没有走向C的存在性忽视。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false},"focusId":"focus-q39-C-2"},{"title":"C. neglected the likely existence of bad debts","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入39题题干：\n\n> 全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。\n\n但C实际说的是：\n\n> neglected the likely existence of bad debts  \n> 忽视了坏账可能存在\n\n全文批评银行不正视资产和损失问题，不能因此把所有形式的忽视都强加给银行。C的具体判断仍须由局部证实，而`likely extent`谈程度，不支持`likely existence`与`neglected`这两个变化。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>忽视了坏账可能存在</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C完整可读。我们看到原文中确实有<code>bad debts</code>，但银行谈的是市场价格是否反映坏账的可能程度，不是忽视坏账存在；<code>wrong planet</code>后面又明确写高估资产。所以第一轮排除C，后续未改变。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>the likely extent of bad debts</code>，把坏账“可能达到什么程度”改成坏账“可能存在”，再加上银行忽视它的态度。对象看似还是坏账，实际问题从规模变成存在性，也换掉了首句的解释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们忽视了坏账可能存在。</p>\n</blockquote>\n<p>C的<code>bad debts</code>出现在第5段第二句，但题干的引语在首句。即便先顺着这个词定位，也要检查原文谈坏账的哪一方面。</p>\n<p>银行辩称市场价格主要反映暂时流动性不足，而不是坏账的可能程度。原文使用<code>extent</code>，不是<code>existence</code>；银行在谈坏账多严重，而不是文中说它们忽略坏账会存在。</p>\n<p>C将程度换成存在性，又用<code>neglected</code>替银行补出忽视的行为。<code>not</code>在原文否定的是价格反映什么，不能搬过去否定银行对坏账的认识。</p>\n<p>因此，C不只是从后句取证，还改变了后句本身的关系：不认为某价格反映坏账规模，不等于忽略坏账可能存在。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>The truth will not be known for years.</p>\n<p>银行争辩价格反映的是暂时缺乏流动性而非坏账程度，作者接着说真相多年以后才会清楚。</p>\n</blockquote>\n<p>实际文章把争执放在损失究竟多大、价格反映什么上，并没有接着揭露银行完全忘记坏账这种可能性。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks were on the wrong planet because they ignored the possibility that bad debts existed.</p>\n<p>银行完全脱离现实，是因为它们忽视了坏账可能存在。</p>\n</blockquote>\n<p>假设句要把忽视坏账存在写成原因。实际原文既在首句给出资产高估，又在次句讨论坏账程度；它没有走向C的存在性忽视。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-C-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入39题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>neglected the likely existence of bad debts<br/>\n忽视了坏账可能存在</p>\n</blockquote>\n<p>全文批评银行不正视资产和损失问题，不能因此把所有形式的忽视都强加给银行。C的具体判断仍须由局部证实，而<code>likely extent</code>谈程度，不支持<code>likely existence</code>与<code>neglected</code>这两个变化。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":true},"focusId":"focus-q39-C-3"},{"title":"D. denied booking losses in their sale of assets","level":3,"section":"第三鸟 · 题目复盘","raw":"### D. denied booking losses in their sale of assets\n\n> 否认在出售资产时确认损失\n\n**做题模式中的状态：**当时D显示为`denied [xxx] losses in their sale of assets`。我们对照段末银行因为害怕确认损失而不愿卖资产，区分了“害怕后果所以不出售”与“否认出售中的损失”。做题材料据此第一轮排除D，并由首句解释收敛到B，后续未改判。\n\n**错误类型：第一类——歪曲原意。**\n\nD取了段末的`booking losses`和`sell assets`，却拿掉`for fear of`及`will not sell`。原文是害怕确认损失而不愿出售，D成了在资产出售中否认确认损失，动作、情态和前提都变了。\n\n**出处：**\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n>\n> And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>否认在出售资产时确认损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D显示为<code>denied [xxx] losses in their sale of assets</code>。我们对照段末银行因为害怕确认损失而不愿卖资产，区分了“害怕后果所以不出售”与“否认出售中的损失”。做题材料据此第一轮排除D，并由首句解释收敛到B，后续未改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D取了段末的<code>booking losses</code>和<code>sell assets</code>，却拿掉<code>for fear of</code>及<code>will not sell</code>。原文是害怕确认损失而不愿出售，D成了在资产出售中否认确认损失，动作、情态和前提都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false},"focusId":"focus-q39-D-0"},{"title":"D. denied booking losses in their sale of assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者认为银行“完全脱离现实”，是因为它们否认在出售资产时确认损失。\n\nD的`booking losses`对应段末`for fear of booking losses`，`sale of assets`对应`will not sell assets`。这两处否定和原因限制不能跳过。\n\n银行不愿出售资产，因为一旦出售就可能需要把损失记入账目。作者把这种不卖也不愿买的状态用来解释市场为何停滞。\n\nD先把尚未愿意实施的出售变成`in their sale of assets`这一情境，再用`denied`改写害怕确认。害怕损失入账恰恰说明银行顾虑这个后果，不等于它们否认已发生出售中的损失确认。\n\n因此，D把“因害怕入账而拒绝出售”的因果改成“出售时否认入账”；并且这本是段末解释市场停滞的行为，不是`wrong planet`后直接给出的资产高估。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>否认在出售资产时确认损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D显示为<code>denied [xxx] losses in their sale of assets</code>。我们对照段末银行因为害怕确认损失而不愿卖资产，区分了“害怕后果所以不出售”与“否认出售中的损失”。做题材料据此第一轮排除D，并由首句解释收敛到B，后续未改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D取了段末的<code>booking losses</code>和<code>sell assets</code>，却拿掉<code>for fear of</code>及<code>will not sell</code>。原文是害怕确认损失而不愿出售，D成了在资产出售中否认确认损失，动作、情态和前提都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们否认在出售资产时确认损失。</p>\n</blockquote>\n<p>D的<code>booking losses</code>对应段末<code>for fear of booking losses</code>，<code>sale of assets</code>对应<code>will not sell assets</code>。这两处否定和原因限制不能跳过。</p>\n<p>银行不愿出售资产，因为一旦出售就可能需要把损失记入账目。作者把这种不卖也不愿买的状态用来解释市场为何停滞。</p>\n<p>D先把尚未愿意实施的出售变成<code>in their sale of assets</code>这一情境，再用<code>denied</code>改写害怕确认。害怕损失入账恰恰说明银行顾虑这个后果，不等于它们否认已发生出售中的损失确认。</p>\n<p>因此，D把“因害怕入账而拒绝出售”的因果改成“出售时否认入账”；并且这本是段末解释市场停滞的行为，不是<code>wrong planet</code>后直接给出的资产高估。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false},"focusId":"focus-q39-D-1"},{"title":"D. denied booking losses in their sale of assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.\n>\n> 银行担心出售资产会确认损失，因而不愿卖；同时又不愿买所谓便宜资产，导致市场停滞。\n\n作者的推进是“害怕记损失—不肯卖—市场停滞”。他没有先交代资产已经卖出，再指控银行否认这次交易应有的损失。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Banks sold assets but denied booking the losses from those sales.\n>\n> 银行出售了资产，却否认确认这些出售产生的损失。\n\n假设路线需要先有出售，再有否认；实际路线是在出售前就因害怕确认损失而停止行动。把相同的`losses`和`assets`拼起来，会丢掉这一先后与因果。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>否认在出售资产时确认损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D显示为<code>denied [xxx] losses in their sale of assets</code>。我们对照段末银行因为害怕确认损失而不愿卖资产，区分了“害怕后果所以不出售”与“否认出售中的损失”。做题材料据此第一轮排除D，并由首句解释收敛到B，后续未改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D取了段末的<code>booking losses</code>和<code>sell assets</code>，却拿掉<code>for fear of</code>及<code>will not sell</code>。原文是害怕确认损失而不愿出售，D成了在资产出售中否认确认损失，动作、情态和前提都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们否认在出售资产时确认损失。</p>\n</blockquote>\n<p>D的<code>booking losses</code>对应段末<code>for fear of booking losses</code>，<code>sale of assets</code>对应<code>will not sell assets</code>。这两处否定和原因限制不能跳过。</p>\n<p>银行不愿出售资产，因为一旦出售就可能需要把损失记入账目。作者把这种不卖也不愿买的状态用来解释市场为何停滞。</p>\n<p>D先把尚未愿意实施的出售变成<code>in their sale of assets</code>这一情境，再用<code>denied</code>改写害怕确认。害怕损失入账恰恰说明银行顾虑这个后果，不等于它们否认已发生出售中的损失确认。</p>\n<p>因此，D把“因害怕入账而拒绝出售”的因果改成“出售时否认入账”；并且这本是段末解释市场停滞的行为，不是<code>wrong planet</code>后直接给出的资产高估。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n<p>银行担心出售资产会确认损失，因而不愿卖；同时又不愿买所谓便宜资产，导致市场停滞。</p>\n</blockquote>\n<p>作者的推进是“害怕记损失—不肯卖—市场停滞”。他没有先交代资产已经卖出，再指控银行否认这次交易应有的损失。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks sold assets but denied booking the losses from those sales.</p>\n<p>银行出售了资产，却否认确认这些出售产生的损失。</p>\n</blockquote>\n<p>假设路线需要先有出售，再有否认；实际路线是在出售前就因害怕确认损失而停止行动。把相同的<code>losses</code>和<code>assets</code>拼起来，会丢掉这一先后与因果。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false},"focusId":"focus-q39-D-2"},{"title":"D. denied booking losses in their sale of assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入39题题干：\n\n> 全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。\n\n但D实际说的是：\n\n> denied booking losses in their sale of assets  \n> 否认在出售资产时确认损失\n\n全文要求损失得到确认，能解释作者为何反对银行回避问题，但不能自动证明D说的出售与否认已发生。局部原文的`will not sell ... for fear of`与D的`denied ... in their sale`不同，首句的高估资产才回答题干评价。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>否认在出售资产时确认损失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D显示为<code>denied [xxx] losses in their sale of assets</code>。我们对照段末银行因为害怕确认损失而不愿卖资产，区分了“害怕后果所以不出售”与“否认出售中的损失”。做题材料据此第一轮排除D，并由首句解释收敛到B，后续未改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D取了段末的<code>booking losses</code>和<code>sell assets</code>，却拿掉<code>for fear of</code>及<code>will not sell</code>。原文是害怕确认损失而不愿出售，D成了在资产出售中否认确认损失，动作、情态和前提都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们否认在出售资产时确认损失。</p>\n</blockquote>\n<p>D的<code>booking losses</code>对应段末<code>for fear of booking losses</code>，<code>sale of assets</code>对应<code>will not sell assets</code>。这两处否定和原因限制不能跳过。</p>\n<p>银行不愿出售资产，因为一旦出售就可能需要把损失记入账目。作者把这种不卖也不愿买的状态用来解释市场为何停滞。</p>\n<p>D先把尚未愿意实施的出售变成<code>in their sale of assets</code>这一情境，再用<code>denied</code>改写害怕确认。害怕损失入账恰恰说明银行顾虑这个后果，不等于它们否认已发生出售中的损失确认。</p>\n<p>因此，D把“因害怕入账而拒绝出售”的因果改成“出售时否认入账”；并且这本是段末解释市场停滞的行为，不是<code>wrong planet</code>后直接给出的资产高估。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n<p>银行担心出售资产会确认损失，因而不愿卖；同时又不愿买所谓便宜资产，导致市场停滞。</p>\n</blockquote>\n<p>作者的推进是“害怕记损失—不肯卖—市场停滞”。他没有先交代资产已经卖出，再指控银行否认这次交易应有的损失。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Banks sold assets but denied booking the losses from those sales.</p>\n<p>银行出售了资产，却否认确认这些出售产生的损失。</p>\n</blockquote>\n<p>假设路线需要先有出售，再有否认；实际路线是在出售前就因害怕确认损失而停止行动。把相同的<code>losses</code>和<code>assets</code>拼起来，会丢掉这一先后与因果。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-D-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入39题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>denied booking losses in their sale of assets<br/>\n否认在出售资产时确认损失</p>\n</blockquote>\n<p>全文要求损失得到确认，能解释作者为何反对银行回避问题，但不能自动证明D说的出售与否认已发生。局部原文的<code>will not sell ... for fear of</code>与D的<code>denied ... in their sale</code>不同，首句的高估资产才回答题干评价。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true},"focusId":"focus-q39-D-3"},{"title":"39题结论","level":3,"section":"第三鸟 · 题目复盘","raw":"### 39题结论\n\n> **39. B. exaggerated the real value of their assets**\n\nA把后文围绕市场价格的争论拿来替代首句的直接解释。\n\nB准确改写账目大幅高估资产这一理由。\n\nC把坏账程度变成坏账存在性，并额外写成银行忽视它。\n\nD把害怕记损失而不肯出售改成出售时否认确认损失。","html":"<blockquote>\n<p><strong>39. B. exaggerated the real value of their assets</strong></p>\n</blockquote>\n<p>A把后文围绕市场价格的争论拿来替代首句的直接解释。</p>\n<p>B准确改写账目大幅高估资产这一理由。</p>\n<p>C把坏账程度变成坏账存在性，并额外写成银行忽视它。</p>\n<p>D把害怕记损失而不肯出售改成出售时否认确认损失。</p>\n","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"conclusion","question":"39","questionConclusion":true}},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：银行的双重态度**（段落1核心矛盾） 表面：银行公开自责 // 实际：幕后指责会计准则制定者 → 银行的抱怨：【规则迫使报告巨额损失（按第三方愿付价格估值 // 而非管理者期望价格）】\n\n↓（影响与后果）\n\n**逻辑层次2：游说的成功与危害**（段落2游说影响） 现状：银行游说正在奏效 → 后果：【准则制定者独立性受损（对资本市场正常运作至关重要）】→ 困境：除非银行以吸引买家的价格持有有毒资产，否则难以重振银行系统\n\n↓（具体案例）\n\n**逻辑层次3：美国FASB的妥协**（段落3美国情况） 背景：与国会激烈交锋后 → FASB匆忙通过规则变更：【给银行更多自由（使用模型评估非流动资产）+ 更多灵活性（确认长期资产损失）】→ 结果：银行股上涨 + 加强\"管理层判断\" // 主席辩护但无力\n\n↓（连锁反应）\n\n**逻辑层次4：欧洲的压力**（段落4欧洲反应） 欧洲要求：IASB也采取同样做法 → IASB困境：【想要整体规划 // 但面临强大压力】→ 威胁：麦克里维警告（\"不在政治真空中\"+\"欧洲可能制定不同规则\"）\n\n↓（真相与现实）\n\n**逻辑层次5：问题的本质**（段落5现实困境） 真相：银行才是\"在错误星球上\"（账目大大高估资产）→ 银行辩解：市场价格夸大损失（反映暂时流动性不足）// 但投资者怀疑（股价低于账面价值）→ 恶性循环：银行不愿出售（怕记录损失）也不愿购买（所谓便宜货）\n\n↓（解决方案）\n\n**逻辑层次6：独立性的重要性**（段落6作者观点） 解决之道：损失必须被承认和处理 → 前提条件：【银行必须合理定价（吸引买家）+ 准则制定者保持独立甚至好斗】→ 历史证明：FASB和IASB曾成功对抗特殊利益（股票期权、养老金规则）// 但现在屈服将招致更多压力\n\n↑（全文主旨）\n\n全文核心观点：银行通过游说削弱会计准则制定者的独立性，虽然短期内可能避免报告损失，但这种做法损害了资本市场的正常运作，真正的解决方案需要银行承认损失并保持准则制定者的独立性。\n\n## 小标题题\n\n### 题目\n\nRead the following text and choose the most suitable heading from the list A–G for each part (41–45). There are two extra headings.\n\n[A] Political Pressure Forces Concessions from Rule-Makers\n\n[B] Banks, Not Market Prices, Remain the Central Problem\n\n[C] Accounting Disclosure Must Stay Separate from Bank Regulation\n\n[D] Lobbying Against Fair-Value Rules Threatens Independent Standards\n\n[E] Strong Standard-Setters Are Necessary for Recovery\n\n[F] One Official Valuation Can End Financial Uncertainty\n\n[G] Bank Managers Should Determine Asset Prices Alone\n\n### 41. __________\n\nIN PUBLIC, bankers have been blaming themselves for their troubles. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch. Unfortunately, banks’ lobbying now seems to be working. The details may be arcane, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.\n\n### 42. __________\n\nOn April 2nd, after a bruising encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognising losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, decried those who “impugn our motives”. Yet bank shares rose and the changes enhance what one lobbying group politely calls “the use of judgment by management”.\n\nEuropean ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to be “piecemeal”, but the pressure to fold when it completes its overhaul of rules later this year is strong. On April 1st Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political vacuum” but “in the real world” and that Europe could yet develop different rules.\n\n### 43. __________\n\nIt was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are sceptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.\n\n### 44. __________\n\nTo get the system working again, losses must be recognised and dealt with. Japan’s procrastination prolonged its crisis. America’s new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by appeasing critics now they are inviting pressure to make more concessions.\n\n### 45. __________\n\nStandard-setters should defuse the argument by making clear that their job is not to regulate banks but to force them to reveal information. The banks, their capital-adequacy regulators and politicians seem to dream of a single, grown-up version of the truth, which enhances financial stability. Investors and accountants, however, think all valuations are subjective, doubt managers’ motives and judge that market prices are the least-bad option. They are right. A bank’s solvency is a matter of judgment for its regulators and for investors, not whatever a piece of paper signed by its auditors says it is. Accounts can inform that decision, but not make it.\n\nBanks’ regulators have to take responsibility. If they want to remove the mechanical link between drops in market prices and capital shortfalls at banks, they should take the accounts that standard-setters create for investors and adjust them when they calculate capital. They already do this to some degree. But the banks’ campaign to change the rules is making inevitable a split between two sets of accounts, one for regulators and another for investors. The FASB and IASB can help regulators to create whatever balance-sheet they want. But in doing so they must not compromise their duty to investors.","html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<h2>段落与全文逻辑框架</h2>\n<p><strong>逻辑层次1：银行的双重态度</strong>（段落1核心矛盾） 表面：银行公开自责 // 实际：幕后指责会计准则制定者 → 银行的抱怨：【规则迫使报告巨额损失（按第三方愿付价格估值 // 而非管理者期望价格）】</p>\n<p>↓（影响与后果）</p>\n<p><strong>逻辑层次2：游说的成功与危害</strong>（段落2游说影响） 现状：银行游说正在奏效 → 后果：【准则制定者独立性受损（对资本市场正常运作至关重要）】→ 困境：除非银行以吸引买家的价格持有有毒资产，否则难以重振银行系统</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次3：美国FASB的妥协</strong>（段落3美国情况） 背景：与国会激烈交锋后 → FASB匆忙通过规则变更：【给银行更多自由（使用模型评估非流动资产）+ 更多灵活性（确认长期资产损失）】→ 结果：银行股上涨 + 加强\"管理层判断\" // 主席辩护但无力</p>\n<p>↓（连锁反应）</p>\n<p><strong>逻辑层次4：欧洲的压力</strong>（段落4欧洲反应） 欧洲要求：IASB也采取同样做法 → IASB困境：【想要整体规划 // 但面临强大压力】→ 威胁：麦克里维警告（\"不在政治真空中\"+\"欧洲可能制定不同规则\"）</p>\n<p>↓（真相与现实）</p>\n<p><strong>逻辑层次5：问题的本质</strong>（段落5现实困境） 真相：银行才是\"在错误星球上\"（账目大大高估资产）→ 银行辩解：市场价格夸大损失（反映暂时流动性不足）// 但投资者怀疑（股价低于账面价值）→ 恶性循环：银行不愿出售（怕记录损失）也不愿购买（所谓便宜货）</p>\n<p>↓（解决方案）</p>\n<p><strong>逻辑层次6：独立性的重要性</strong>（段落6作者观点） 解决之道：损失必须被承认和处理 → 前提条件：【银行必须合理定价（吸引买家）+ 准则制定者保持独立甚至好斗】→ 历史证明：FASB和IASB曾成功对抗特殊利益（股票期权、养老金规则）// 但现在屈服将招致更多压力</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：银行通过游说削弱会计准则制定者的独立性，虽然短期内可能避免报告损失，但这种做法损害了资本市场的正常运作，真正的解决方案需要银行承认损失并保持准则制定者的独立性。</p>\n<h2>小标题题</h2>\n<h3>题目</h3>\n<p>Read the following text and choose the most suitable heading from the list A–G for each part (41–45). There are two extra headings.</p>\n<p>[A] Political Pressure Forces Concessions from Rule-Makers</p>\n<p>[B] Banks, Not Market Prices, Remain the Central Problem</p>\n<p>[C] Accounting Disclosure Must Stay Separate from Bank Regulation</p>\n<p>[D] Lobbying Against Fair-Value Rules Threatens Independent Standards</p>\n<p>[E] Strong Standard-Setters Are Necessary for Recovery</p>\n<p>[F] One Official Valuation Can End Financial Uncertainty</p>\n<p>[G] Bank Managers Should Determine Asset Prices Alone</p>\n<h3>41. __________</h3>\n<p>IN PUBLIC, bankers have been blaming themselves for their troubles. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch. Unfortunately, banks’ lobbying now seems to be working. The details may be arcane, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<h3>42. __________</h3>\n<p>On April 2nd, after a bruising encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognising losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, decried those who “impugn our motives”. Yet bank shares rose and the changes enhance what one lobbying group politely calls “the use of judgment by management”.</p>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to be “piecemeal”, but the pressure to fold when it completes its overhaul of rules later this year is strong. On April 1st Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political vacuum” but “in the real world” and that Europe could yet develop different rules.</p>\n<h3>43. __________</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are sceptical. And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n<h3>44. __________</h3>\n<p>To get the system working again, losses must be recognised and dealt with. Japan’s procrastination prolonged its crisis. America’s new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive. Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by appeasing critics now they are inviting pressure to make more concessions.</p>\n<h3>45. __________</h3>\n<p>Standard-setters should defuse the argument by making clear that their job is not to regulate banks but to force them to reveal information. The banks, their capital-adequacy regulators and politicians seem to dream of a single, grown-up version of the truth, which enhances financial stability. Investors and accountants, however, think all valuations are subjective, doubt managers’ motives and judge that market prices are the least-bad option. They are right. A bank’s solvency is a matter of judgment for its regulators and for investors, not whatever a piece of paper signed by its auditors says it is. Accounts can inform that decision, but not make it.</p>\n<p>Banks’ regulators have to take responsibility. If they want to remove the mechanical link between drops in market prices and capital shortfalls at banks, they should take the accounts that standard-setters create for investors and adjust them when they calculate capital. They already do this to some degree. But the banks’ campaign to change the rules is making inevitable a split between two sets of accounts, one for regulators and another for investors. The FASB and IASB can help regulators to create whatever balance-sheet they want. But in doing so they must not compromise their duty to investors.</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{}},{"title":"小标题题 · 41题","level":4,"section":"第四鸟 · 新题型","raw":"#### 41题\n\n答案：**D. Lobbying Against Fair-Value Rules Threatens Independent Standards**\n\n中文：反对公允价值规则的游说威胁独立准则。\n\n这一部分先把银行的不满交代出来，再指出游说已经威胁准则制定者的独立性。标题不能只概括第一句银行自责，也不能把银行自己的抱怨当成作者的主张。\n\n开头的`IN PUBLIC`与`Behind the scenes`构成对照：表面自责，背后却指责制定者。中间两句解释银行不满的规则——资产应按第三方愿付价格估值，而非管理者希望的价格。转到`Unfortunately`以后，作者指出游说奏效、独立性受损，结尾再补银行复苏取决于有吸引力的资产价格。\n\n推进链是：银行抱怨规则 → 规则要求真实的第三方价格 → 游说开始奏效 → 独立性受损 → 银行体系恢复仍离不开合适的价格。\n\nD中的`Lobbying Against ... Rules`覆盖银行施压及其对象，`Threatens Independent Standards`覆盖作者明确提出的危害。两部分组合后，既保留争议起点，也保留本段真正落下来的判断。\n\n最有吸引力的干扰项是G：段内确实提到管理者希望资产卖到的价格，但原文用`not the price`将它排除。把这一价格愿望提升为管理者应独自定价，会把被作者反对的做法写成作者赞成的原则。E虽然也谈复苏，却只能抓住段尾，不能概括此前围绕规则的游说冲突。\n\n因此，41题选**D**。","html":"<p>答案：<strong>D. Lobbying Against Fair-Value Rules Threatens Independent Standards</strong></p>\n<p>中文：反对公允价值规则的游说威胁独立准则。</p>\n<p>这一部分先把银行的不满交代出来，再指出游说已经威胁准则制定者的独立性。标题不能只概括第一句银行自责，也不能把银行自己的抱怨当成作者的主张。</p>\n<p>开头的<code>IN PUBLIC</code>与<code>Behind the scenes</code>构成对照：表面自责，背后却指责制定者。中间两句解释银行不满的规则——资产应按第三方愿付价格估值，而非管理者希望的价格。转到<code>Unfortunately</code>以后，作者指出游说奏效、独立性受损，结尾再补银行复苏取决于有吸引力的资产价格。</p>\n<p>推进链是：银行抱怨规则 → 规则要求真实的第三方价格 → 游说开始奏效 → 独立性受损 → 银行体系恢复仍离不开合适的价格。</p>\n<p>D中的<code>Lobbying Against ... Rules</code>覆盖银行施压及其对象，<code>Threatens Independent Standards</code>覆盖作者明确提出的危害。两部分组合后，既保留争议起点，也保留本段真正落下来的判断。</p>\n<p>最有吸引力的干扰项是G：段内确实提到管理者希望资产卖到的价格，但原文用<code>not the price</code>将它排除。把这一价格愿望提升为管理者应独自定价，会把被作者反对的做法写成作者赞成的原则。E虽然也谈复苏，却只能抓住段尾，不能概括此前围绕规则的游说冲突。</p>\n<p>因此，41题选<strong>D</strong>。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{}},{"title":"小标题题 · 42题","level":4,"section":"第四鸟 · 新题型","raw":"#### 42题\n\n答案：**A. Political Pressure Forces Concessions from Rule-Makers**\n\n中文：政治压力迫使规则制定者让步。\n\n这一部分把前面“游说正在奏效”的总判断写成美国和欧洲两组具体行动：FASB已在压力下改规则，欧洲政治人物又要求IASB照做。\n\n第一组以`after a bruising encounter with Congress`交代压力来源，紧接`rushed through rule changes`写让步结果；`more freedom`、`more flexibility`及管理层判断增强说明银行受益。第二组以`European ministers ... do likewise`接上前例，再以McCreevy的警告和欧洲可另订规则的说法，把政治压力推到IASB。\n\n推进链是：美国国会施压 → FASB匆忙改规则 → 银行得到更大判断空间 → 欧洲要求IASB效仿 → IASB面临政治警告。\n\nA中的`Political Pressure`对应国会、欧洲部长及委员的行动，`Concessions from Rule-Makers`对应FASB已经作出的变化，以及IASB被要求作出的同类让步。它能同时覆盖两地两家机构，而不止概括一个人的讲话。\n\n最强竞争项D与全文总问题有关，但本部分的重点不是重新解释银行为何反对估值规则，而是展开政治人物怎样迫使制定者改变行动。F也有“官方”的感觉，却额外宣称单一估值会结束不确定性，本部分并未给出这种结论。\n\n因此，42题选**A**。","html":"<p>答案：<strong>A. Political Pressure Forces Concessions from Rule-Makers</strong></p>\n<p>中文：政治压力迫使规则制定者让步。</p>\n<p>这一部分把前面“游说正在奏效”的总判断写成美国和欧洲两组具体行动：FASB已在压力下改规则，欧洲政治人物又要求IASB照做。</p>\n<p>第一组以<code>after a bruising encounter with Congress</code>交代压力来源，紧接<code>rushed through rule changes</code>写让步结果；<code>more freedom</code>、<code>more flexibility</code>及管理层判断增强说明银行受益。第二组以<code>European ministers ... do likewise</code>接上前例，再以McCreevy的警告和欧洲可另订规则的说法，把政治压力推到IASB。</p>\n<p>推进链是：美国国会施压 → FASB匆忙改规则 → 银行得到更大判断空间 → 欧洲要求IASB效仿 → IASB面临政治警告。</p>\n<p>A中的<code>Political Pressure</code>对应国会、欧洲部长及委员的行动，<code>Concessions from Rule-Makers</code>对应FASB已经作出的变化，以及IASB被要求作出的同类让步。它能同时覆盖两地两家机构，而不止概括一个人的讲话。</p>\n<p>最强竞争项D与全文总问题有关，但本部分的重点不是重新解释银行为何反对估值规则，而是展开政治人物怎样迫使制定者改变行动。F也有“官方”的感觉，却额外宣称单一估值会结束不确定性，本部分并未给出这种结论。</p>\n<p>因此，42题选<strong>A</strong>。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{}},{"title":"小标题题 · 43题","level":4,"section":"第四鸟 · 新题型","raw":"#### 43题\n\n答案：**B. Banks, Not Market Prices, Remain the Central Problem**\n\n中文：核心问题仍在银行，而不是市场价格。\n\n这一部分从前面的政治警告转回事实责任，作者先指出银行账目高估资产，再检验银行关于市场价格的辩解。\n\n开头`It was banks that were on the wrong planet`把批评对象锁定为银行，`vastly overvalued assets`说明具体问题。银行随后辩称市场价格只反映暂时的流动性不足，作者则用`But banks’ shares trade below their book value`表明投资者并不认同。结尾再写银行怕确认损失而不卖、又不愿买，市场停滞也有它们自己的原因。\n\n推进链是：银行高估资产 → 银行责怪市场价格 → 投资者持怀疑态度 → 银行自身的买卖瘫痪也造成市场停滞。\n\nB中的`Banks`承接首句强调的责任方，`Not Market Prices`概括作者不接受把问题简单归给价格的辩护，`Central Problem`覆盖估值与交易行为这两层。它不等于作者已知道每项坏账的最终数额；文中仍保留真相多年后才能清楚的限制。\n\n最强干扰项G抓住银行不相信市场价格的表态，却把这种不满改成管理者应拥有独自定价的权力。实际作者紧接着用投资者怀疑和银行不肯行动反驳银行，而不是为其争取独自定价。A只适合前一部分的政治施压，这里已转向银行自身的问题。\n\n因此，43题选**B**。","html":"<p>答案：<strong>B. Banks, Not Market Prices, Remain the Central Problem</strong></p>\n<p>中文：核心问题仍在银行，而不是市场价格。</p>\n<p>这一部分从前面的政治警告转回事实责任，作者先指出银行账目高估资产，再检验银行关于市场价格的辩解。</p>\n<p>开头<code>It was banks that were on the wrong planet</code>把批评对象锁定为银行，<code>vastly overvalued assets</code>说明具体问题。银行随后辩称市场价格只反映暂时的流动性不足，作者则用<code>But banks’ shares trade below their book value</code>表明投资者并不认同。结尾再写银行怕确认损失而不卖、又不愿买，市场停滞也有它们自己的原因。</p>\n<p>推进链是：银行高估资产 → 银行责怪市场价格 → 投资者持怀疑态度 → 银行自身的买卖瘫痪也造成市场停滞。</p>\n<p>B中的<code>Banks</code>承接首句强调的责任方，<code>Not Market Prices</code>概括作者不接受把问题简单归给价格的辩护，<code>Central Problem</code>覆盖估值与交易行为这两层。它不等于作者已知道每项坏账的最终数额；文中仍保留真相多年后才能清楚的限制。</p>\n<p>最强干扰项G抓住银行不相信市场价格的表态，却把这种不满改成管理者应拥有独自定价的权力。实际作者紧接着用投资者怀疑和银行不肯行动反驳银行，而不是为其争取独自定价。A只适合前一部分的政治施压，这里已转向银行自身的问题。</p>\n<p>因此，43题选<strong>B</strong>。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{}},{"title":"小标题题 · 44题","level":4,"section":"第四鸟 · 新题型","raw":"#### 44题\n\n答案：**E. Strong Standard-Setters Are Necessary for Recovery**\n\n中文：强硬的准则制定者是复苏的必要条件。\n\n这一部分在指出银行的问题后提出出路：损失要承认和处理，资产价格要吸引买家，而这些要求需要独立、能顶住压力的准则制定者。\n\n开头`To get the system working again`先给目标，随后`losses must be recognised and dealt with`给必要动作；日本拖延危机的例子说明不处理损失的代价。美国收购计划又把买家愿接受的价格作为条件。中间的`Successful markets require independent and even combative standard-setters`明确落到机构应具备的品质，结尾用`But`警告眼下讨好批评者会招来更多要求。\n\n推进链是：恢复体系 → 承认处理损失 → 资产价格必须可交易 → 需要独立而强硬的制定者 → 肯定过去工作并警告不能继续让步。\n\nE中的`Recovery`对应开头恢复体系，`Necessary`对应`must`、`unless`和`require`所表达的条件，`Strong Standard-Setters`对应`independent and even combative`。它把恢复目标与维护独立准则的要求连在了一起。\n\n最强竞争项A只抓住最后的让步压力，无法覆盖开头关于承认损失、价格和体系恢复的整条建议。F宣称一个官方估值即可结束不确定性，更换了作者的出路：作者要求正视损失与保持独立，而不是找一个统一数字掩盖分歧。\n\n因此，44题选**E**。","html":"<p>答案：<strong>E. Strong Standard-Setters Are Necessary for Recovery</strong></p>\n<p>中文：强硬的准则制定者是复苏的必要条件。</p>\n<p>这一部分在指出银行的问题后提出出路：损失要承认和处理，资产价格要吸引买家，而这些要求需要独立、能顶住压力的准则制定者。</p>\n<p>开头<code>To get the system working again</code>先给目标，随后<code>losses must be recognised and dealt with</code>给必要动作；日本拖延危机的例子说明不处理损失的代价。美国收购计划又把买家愿接受的价格作为条件。中间的<code>Successful markets require independent and even combative standard-setters</code>明确落到机构应具备的品质，结尾用<code>But</code>警告眼下讨好批评者会招来更多要求。</p>\n<p>推进链是：恢复体系 → 承认处理损失 → 资产价格必须可交易 → 需要独立而强硬的制定者 → 肯定过去工作并警告不能继续让步。</p>\n<p>E中的<code>Recovery</code>对应开头恢复体系，<code>Necessary</code>对应<code>must</code>、<code>unless</code>和<code>require</code>所表达的条件，<code>Strong Standard-Setters</code>对应<code>independent and even combative</code>。它把恢复目标与维护独立准则的要求连在了一起。</p>\n<p>最强竞争项A只抓住最后的让步压力，无法覆盖开头关于承认损失、价格和体系恢复的整条建议。F宣称一个官方估值即可结束不确定性，更换了作者的出路：作者要求正视损失与保持独立，而不是找一个统一数字掩盖分歧。</p>\n<p>因此，44题选<strong>E</strong>。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{}},{"title":"小标题题 · 45题","level":4,"section":"第四鸟 · 新题型","raw":"#### 45题\n\n答案：**C. Accounting Disclosure Must Stay Separate from Bank Regulation**\n\n中文：会计信息披露必须与银行监管保持区分。\n\n这一部分进一步澄清职责：准则制定者负责让银行披露信息，监管者负责判断和调整监管资本；两种用途不能混成同一个任务。\n\n开头直接用`not to regulate banks but to force them to reveal information`分开监管与披露。接着对照银行、监管者、政客想要的单一真相与投资者对估值的看法，指出账目能为偿付能力判断提供信息，却不能替人作出决定。下一段以`Banks’ regulators have to take responsibility`承接这一分工，再说明监管者可以在计算资本时调整账目，结尾则坚持制定者不能损害对投资者的职责。\n\n推进链是：披露不是监管 → 账目提供信息而非代替判断 → 监管者应承担自身责任 → 监管用途与投资者用途可以分别处理 → 制定者仍须维护对投资者的职责。\n\nC中的`Accounting Disclosure`对应揭示信息与面向投资者的账目，`Bank Regulation`对应资本计算及监管判断，`Stay Separate`对应两个任务不能相互取代。标题覆盖两段，而不只摘取一个会计术语。\n\n最强干扰项F借用了`a single, grown-up version of the truth`，但那是作者归给银行、监管者和政客的愿望，随后投资者与会计师的看法被作者认可。F把一个受质疑的愿望改成作者确认有效的解决方案。E虽延续维护准则的总立场，却不如C准确点明本部分新增的职责区分。\n\n因此，45题选**C**。","html":"<p>答案：<strong>C. Accounting Disclosure Must Stay Separate from Bank Regulation</strong></p>\n<p>中文：会计信息披露必须与银行监管保持区分。</p>\n<p>这一部分进一步澄清职责：准则制定者负责让银行披露信息，监管者负责判断和调整监管资本；两种用途不能混成同一个任务。</p>\n<p>开头直接用<code>not to regulate banks but to force them to reveal information</code>分开监管与披露。接着对照银行、监管者、政客想要的单一真相与投资者对估值的看法，指出账目能为偿付能力判断提供信息，却不能替人作出决定。下一段以<code>Banks’ regulators have to take responsibility</code>承接这一分工，再说明监管者可以在计算资本时调整账目，结尾则坚持制定者不能损害对投资者的职责。</p>\n<p>推进链是：披露不是监管 → 账目提供信息而非代替判断 → 监管者应承担自身责任 → 监管用途与投资者用途可以分别处理 → 制定者仍须维护对投资者的职责。</p>\n<p>C中的<code>Accounting Disclosure</code>对应揭示信息与面向投资者的账目，<code>Bank Regulation</code>对应资本计算及监管判断，<code>Stay Separate</code>对应两个任务不能相互取代。标题覆盖两段，而不只摘取一个会计术语。</p>\n<p>最强干扰项F借用了<code>a single, grown-up version of the truth</code>，但那是作者归给银行、监管者和政客的愿望，随后投资者与会计师的看法被作者认可。F把一个受质疑的愿望改成作者确认有效的解决方案。E虽延续维护准则的总立场，却不如C准确点明本部分新增的职责区分。</p>\n<p>因此，45题选<strong>C</strong>。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{}},{"title":"排序题 · 题面与全局解析","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\n### 题目\n\nArrange paragraphs A–H in the correct order to form a coherent text. Paragraphs A, E and H have been correctly placed. Fill the five blanks (41–45) with the remaining paragraph letters.\n\n**A → 41. ____ → 42. ____ → 43. ____ → E → 44. ____ → 45. ____ → H**\n\n### [A]\n\nIN PUBLIC, bankers have been blaming themselves for their troubles. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.\n\n### [B]\n\nOn April 2nd, after a bruising encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognising losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, decried those who “impugn our motives”. Yet bank shares rose and the changes enhance what one lobbying group politely calls “the use of judgment by management”.\n\n### [C]\n\nEuropean ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to be “piecemeal”, but the pressure to fold when it completes its overhaul of rules later this year is strong. On April 1st Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political vacuum” but “in the real world” and that Europe could yet develop different rules.\n\n### [D]\n\nUnfortunately, banks’ lobbying now seems to be working. The details may be arcane, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.\n\n### [E]\n\nIt was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are sceptical.\n\n### [F]\n\nAnd dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.\n\nTo get the system working again, losses must be recognised and dealt with. Japan’s procrastination prolonged its crisis. America’s new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.\n\n### [G]\n\nSuccessful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by appeasing critics now they are inviting pressure to make more concessions.\n\n### [H]\n\nStandard-setters should defuse the argument by making clear that their job is not to regulate banks but to force them to reveal information. The banks, their capital-adequacy regulators and politicians seem to dream of a single, grown-up version of the truth, which enhances financial stability. Investors and accountants, however, think all valuations are subjective, doubt managers’ motives and judge that market prices are the least-bad option. They are right. A bank’s solvency is a matter of judgment for its regulators and for investors, not whatever a piece of paper signed by its auditors says it is. Accounts can inform that decision, but not make it.\n\nBanks’ regulators have to take responsibility. If they want to remove the mechanical link between drops in market prices and capital shortfalls at banks, they should take the accounts that standard-setters create for investors and adjust them when they calculate capital. They already do this to some degree. But the banks’ campaign to change the rules is making inevitable a split between two sets of accounts, one for regulators and another for investors. The FASB and IASB can help regulators to create whatever balance-sheet they want. But in doing so they must not compromise their duty to investors.\n\n### 全局解析\n\n| 段落 | 本段功能 |\n| --- | --- |\n| A | 写银行表面自责、背后怪罪准则，并说明估值规则的内容。 |\n| B | 写FASB在国会压力后改规则，以及银行得到的自由。 |\n| C | 写欧洲要求IASB照做，并用政治现实继续施压。 |\n| D | 从银行抱怨转到游说奏效、独立性受损及复苏条件。 |\n| E | 指出银行高估资产，转述其价格辩解，再用投资者怀疑回应。 |\n| F | 用银行不肯买卖解释市场停滞，继而提出承认损失和恢复交易的条件。 |\n| G | 提出独立而强硬的制定者是必要条件，肯定其过去并警告进一步让步。 |\n| H | 分清信息披露与银行监管的职责，落实监管者与准则制定者各自的责任。 |\n\n先沿论证功能排大顺序：银行抱怨 → 游说危害 → 美国的让步实例 → 欧洲效仿的压力 → 问题其实在银行 → 怎样正视损失、恢复交易 → 为什么要维护独立准则 → 最后怎样划分披露与监管职责。\n\n再看紧衔接：D的`Unfortunately`评价A介绍的游说背景；C的`do likewise`需要B的美国变化作参照；F的`And dead markets`继续E对银行的反驳，再用`To get the system working again`转向方案；G把方案从价格与损失推到执行规则的机构；H进一步把机构任务限定为披露信息。\n\n完整顺序：**A → D → B → C → E → F → G → H**。\n\n五空答案：**41 D，42 B，43 C，44 F，45 G**。","html":"<h3>题目</h3>\n<p>Arrange paragraphs A–H in the correct order to form a coherent text. Paragraphs A, E and H have been correctly placed. Fill the five blanks (41–45) with the remaining paragraph letters.</p>\n<p><strong>A → 41. ____ → 42. ____ → 43. ____ → E → 44. ____ → 45. ____ → H</strong></p>\n<h3>[A]</h3>\n<p>IN PUBLIC, bankers have been blaming themselves for their troubles. Behind the scenes, they have been taking aim at someone else: the accounting standard-setters. Their rules, moan the banks, have forced them to report enormous losses, and it’s just not fair. These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.</p>\n<h3>[B]</h3>\n<p>On April 2nd, after a bruising encounter with Congress, America’s Financial Accounting Standards Board (FASB) rushed through rule changes. These gave banks more freedom to use models to value illiquid assets and more flexibility in recognising losses on long-term assets in their income statements. Bob Herz, the FASB’s chairman, decried those who “impugn our motives”. Yet bank shares rose and the changes enhance what one lobbying group politely calls “the use of judgment by management”.</p>\n<h3>[C]</h3>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise. The IASB says it does not want to be “piecemeal”, but the pressure to fold when it completes its overhaul of rules later this year is strong. On April 1st Charlie McCreevy, a European commissioner, warned the IASB that it did “not live in a political vacuum” but “in the real world” and that Europe could yet develop different rules.</p>\n<h3>[D]</h3>\n<p>Unfortunately, banks’ lobbying now seems to be working. The details may be arcane, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised. And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.</p>\n<h3>[E]</h3>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets. Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts. The truth will not be known for years. But banks’ shares trade below their book value, suggesting that investors are sceptical.</p>\n<h3>[F]</h3>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n<p>To get the system working again, losses must be recognised and dealt with. Japan’s procrastination prolonged its crisis. America’s new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.</p>\n<h3>[G]</h3>\n<p>Successful markets require independent and even combative standard-setters. The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests. But by appeasing critics now they are inviting pressure to make more concessions.</p>\n<h3>[H]</h3>\n<p>Standard-setters should defuse the argument by making clear that their job is not to regulate banks but to force them to reveal information. The banks, their capital-adequacy regulators and politicians seem to dream of a single, grown-up version of the truth, which enhances financial stability. Investors and accountants, however, think all valuations are subjective, doubt managers’ motives and judge that market prices are the least-bad option. They are right. A bank’s solvency is a matter of judgment for its regulators and for investors, not whatever a piece of paper signed by its auditors says it is. Accounts can inform that decision, but not make it.</p>\n<p>Banks’ regulators have to take responsibility. If they want to remove the mechanical link between drops in market prices and capital shortfalls at banks, they should take the accounts that standard-setters create for investors and adjust them when they calculate capital. They already do this to some degree. But the banks’ campaign to change the rules is making inevitable a split between two sets of accounts, one for regulators and another for investors. The FASB and IASB can help regulators to create whatever balance-sheet they want. But in doing so they must not compromise their duty to investors.</p>\n<h3>全局解析</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>本段功能</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A</td>\n<td>写银行表面自责、背后怪罪准则，并说明估值规则的内容。</td>\n</tr>\n<tr>\n<td>B</td>\n<td>写FASB在国会压力后改规则，以及银行得到的自由。</td>\n</tr>\n<tr>\n<td>C</td>\n<td>写欧洲要求IASB照做，并用政治现实继续施压。</td>\n</tr>\n<tr>\n<td>D</td>\n<td>从银行抱怨转到游说奏效、独立性受损及复苏条件。</td>\n</tr>\n<tr>\n<td>E</td>\n<td>指出银行高估资产，转述其价格辩解，再用投资者怀疑回应。</td>\n</tr>\n<tr>\n<td>F</td>\n<td>用银行不肯买卖解释市场停滞，继而提出承认损失和恢复交易的条件。</td>\n</tr>\n<tr>\n<td>G</td>\n<td>提出独立而强硬的制定者是必要条件，肯定其过去并警告进一步让步。</td>\n</tr>\n<tr>\n<td>H</td>\n<td>分清信息披露与银行监管的职责，落实监管者与准则制定者各自的责任。</td>\n</tr>\n</tbody>\n</table></div>\n<p>先沿论证功能排大顺序：银行抱怨 → 游说危害 → 美国的让步实例 → 欧洲效仿的压力 → 问题其实在银行 → 怎样正视损失、恢复交易 → 为什么要维护独立准则 → 最后怎样划分披露与监管职责。</p>\n<p>再看紧衔接：D的<code>Unfortunately</code>评价A介绍的游说背景；C的<code>do likewise</code>需要B的美国变化作参照；F的<code>And dead markets</code>继续E对银行的反驳，再用<code>To get the system working again</code>转向方案；G把方案从价格与损失推到执行规则的机构；H进一步把机构任务限定为披露信息。</p>\n<p>完整顺序：<strong>A → D → B → C → E → F → G → H</strong>。</p>\n<p>五空答案：<strong>41 D，42 B，43 C，44 F，45 G</strong>。</p>\n","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{}},{"title":"排序题 · 41题","level":4,"section":"第四鸟 · 新题型","raw":"#### 41题\n\n41空位于已给定的A之后，后面还要接美国与欧洲的具体事件。应先找能把银行的抱怨提升为全文问题的一段。\n\nA末尾讲第三方愿付价格与管理者期望价格的差别；D开头的`Unfortunately, banks’ lobbying now seems to be working`把话题从“银行为什么抱怨”推进到“抱怨和游说造成什么”。D后面的独立性受损又为B中FASB受压改规则提供总判断。\n\n这里的联系是对象复现与评价推进：A说明银行针对准则的怨言，D接银行游说及危害，B再用美国机构具体让步作证明。`Unfortunately`不是另起无关话题，而是作者开始评价这一走向。\n\n局部链是：A估值规则引来抱怨 → D游说奏效但独立性受损 → B国会压力后FASB改规则。\n\nB是最强竞争项，因为它也能接银行抱怨。但若立刻放B，就跳过了D给出的作者总判断，后面D再插入又会割开B与C之间的`do likewise`。D在此先统领两个实例，衔接更完整。\n\n因此，41题选**D**。","html":"<p>41空位于已给定的A之后，后面还要接美国与欧洲的具体事件。应先找能把银行的抱怨提升为全文问题的一段。</p>\n<p>A末尾讲第三方愿付价格与管理者期望价格的差别；D开头的<code>Unfortunately, banks’ lobbying now seems to be working</code>把话题从“银行为什么抱怨”推进到“抱怨和游说造成什么”。D后面的独立性受损又为B中FASB受压改规则提供总判断。</p>\n<p>这里的联系是对象复现与评价推进：A说明银行针对准则的怨言，D接银行游说及危害，B再用美国机构具体让步作证明。<code>Unfortunately</code>不是另起无关话题，而是作者开始评价这一走向。</p>\n<p>局部链是：A估值规则引来抱怨 → D游说奏效但独立性受损 → B国会压力后FASB改规则。</p>\n<p>B是最强竞争项，因为它也能接银行抱怨。但若立刻放B，就跳过了D给出的作者总判断，后面D再插入又会割开B与C之间的<code>do likewise</code>。D在此先统领两个实例，衔接更完整。</p>\n<p>因此，41题选<strong>D</strong>。</p>\n","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{}},{"title":"排序题 · 42题","level":4,"section":"第四鸟 · 新题型","raw":"#### 42题\n\n42空接在D之后，43空随后将通向给定的E。D已经指出独立性受损，此处需要一个具体让步实例。\n\nD末尾提醒体系复苏离不开吸引买家的资产价格；B开头用`after a bruising encounter with Congress`写FASB在压力后改规则，随后逐项写估值自由和损失确认灵活性。C的开头又要求IASB`do likewise`，需要前文先有一套已经发生的改变。\n\nB既落实D的“游说奏效”，也给C的“也这样做”提供参照。美国机构已让步，欧洲政治人物才要求另一个机构效仿，人物和动作顺序接得上。\n\n局部链是：D总判断 → B美国受压改变规则 → C欧洲要求IASB仿效。\n\nC是最强竞争项，但单独把C放在D后，`do likewise`将缺少刚刚写出的FASB规则变化，后放B又倒转了效仿关系。G则是对策和警告，应留在银行事实责任与恢复条件解释以后。\n\n因此，42题选**B**。","html":"<p>42空接在D之后，43空随后将通向给定的E。D已经指出独立性受损，此处需要一个具体让步实例。</p>\n<p>D末尾提醒体系复苏离不开吸引买家的资产价格；B开头用<code>after a bruising encounter with Congress</code>写FASB在压力后改规则，随后逐项写估值自由和损失确认灵活性。C的开头又要求IASB<code>do likewise</code>，需要前文先有一套已经发生的改变。</p>\n<p>B既落实D的“游说奏效”，也给C的“也这样做”提供参照。美国机构已让步，欧洲政治人物才要求另一个机构效仿，人物和动作顺序接得上。</p>\n<p>局部链是：D总判断 → B美国受压改变规则 → C欧洲要求IASB仿效。</p>\n<p>C是最强竞争项，但单独把C放在D后，<code>do likewise</code>将缺少刚刚写出的FASB规则变化，后放B又倒转了效仿关系。G则是对策和警告，应留在银行事实责任与恢复条件解释以后。</p>\n<p>因此，42题选<strong>B</strong>。</p>\n","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{}},{"title":"排序题 · 43题","level":4,"section":"第四鸟 · 新题型","raw":"#### 43题\n\n43空前面是B，后面给定E。要同时解释前文美国事例怎样继续，并给E开头的反击找到对象。\n\nB写FASB已经作出规则变化；C首句的`European ministers ... do likewise`要求IASB也采取同类行动。C末尾McCreevy强调它生活在`the real world`，E紧接`It was banks that were on the wrong planet`，反过来指出真正脱离现实的是银行。\n\n前一处靠`likewise`承接相同动作，后一处靠`real world`与`wrong planet`的措辞对照承接作者的反击。C把两头连在一起：先把压力扩到欧洲，再为E转向银行责任铺路。\n\n局部链是：B美国让步 → C欧洲施压、要求面对现实 → E作者反击银行才脱离现实。\n\nG是较强竞争项，因为它也说制定者受压。但G直接提出独立机构的必要性，无法承接E这句针对“现实”的反击，也会使欧洲的`do likewise`失去紧邻前例的位置。\n\n因此，43题选**C**。","html":"<p>43空前面是B，后面给定E。要同时解释前文美国事例怎样继续，并给E开头的反击找到对象。</p>\n<p>B写FASB已经作出规则变化；C首句的<code>European ministers ... do likewise</code>要求IASB也采取同类行动。C末尾McCreevy强调它生活在<code>the real world</code>，E紧接<code>It was banks that were on the wrong planet</code>，反过来指出真正脱离现实的是银行。</p>\n<p>前一处靠<code>likewise</code>承接相同动作，后一处靠<code>real world</code>与<code>wrong planet</code>的措辞对照承接作者的反击。C把两头连在一起：先把压力扩到欧洲，再为E转向银行责任铺路。</p>\n<p>局部链是：B美国让步 → C欧洲施压、要求面对现实 → E作者反击银行才脱离现实。</p>\n<p>G是较强竞争项，因为它也说制定者受压。但G直接提出独立机构的必要性，无法承接E这句针对“现实”的反击，也会使欧洲的<code>do likewise</code>失去紧邻前例的位置。</p>\n<p>因此，43题选<strong>C</strong>。</p>\n","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{}},{"title":"排序题 · 44题","level":4,"section":"第四鸟 · 新题型","raw":"#### 44题\n\n44空前面给定E，45空后面给定H。E已说明银行高估资产，并以股价低于账面价值表示投资者怀疑；此处应继续把银行自身的问题说完，再转向解决条件。\n\nE末句是投资者不接受银行账面价值。F开头`And dead markets partly reflect the paralysis of banks`用`And`追加另一条针对银行的说明：怕确认损失而不卖，也不愿买所谓便宜货。后半段`To get the system working again`再由市场停滞转入承认损失、形成可交易价格的出路。\n\nG接着提出成功市场需要独立甚至强硬的准则制定者，将F的估值与交易条件推进到谁来维护规则。这样，事实批评先完成，对策再逐层展开。\n\n局部链是：E投资者怀疑 → F银行瘫痪与恢复交易条件 → G独立制定者的必要性。\n\nG是最强竞争项，但它若抢在F前，会先提出机构要求，再退回补充银行为何不交易；F的`And`也会失去与E批评银行的紧接关系。H的职责分工则是更后面的制度安排，不宜先于恢复条件展开。\n\n因此，44题选**F**。","html":"<p>44空前面给定E，45空后面给定H。E已说明银行高估资产，并以股价低于账面价值表示投资者怀疑；此处应继续把银行自身的问题说完，再转向解决条件。</p>\n<p>E末句是投资者不接受银行账面价值。F开头<code>And dead markets partly reflect the paralysis of banks</code>用<code>And</code>追加另一条针对银行的说明：怕确认损失而不卖，也不愿买所谓便宜货。后半段<code>To get the system working again</code>再由市场停滞转入承认损失、形成可交易价格的出路。</p>\n<p>G接着提出成功市场需要独立甚至强硬的准则制定者，将F的估值与交易条件推进到谁来维护规则。这样，事实批评先完成，对策再逐层展开。</p>\n<p>局部链是：E投资者怀疑 → F银行瘫痪与恢复交易条件 → G独立制定者的必要性。</p>\n<p>G是最强竞争项，但它若抢在F前，会先提出机构要求，再退回补充银行为何不交易；F的<code>And</code>也会失去与E批评银行的紧接关系。H的职责分工则是更后面的制度安排，不宜先于恢复条件展开。</p>\n<p>因此，44题选<strong>F</strong>。</p>\n","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{}},{"title":"排序题 · 45题","level":4,"section":"第四鸟 · 新题型","raw":"#### 45题\n\n45空位于F之后、给定H之前。F已说明损失必须处理、资产价格必须吸引买家；H将讨论准则制定者究竟负责披露还是监管，二者之间需要先把“准则制定者为什么重要”说出来。\n\nF末尾讲收购计划只有在买家接受价格时才有效。G首句`Successful markets require independent and even combative standard-setters`把市场条件落到维护规则的机构上，并以股票期权、养老金规则举例，最后警告让步只会引来更多压力。H开头`Standard-setters should defuse the argument by making clear that their job is ...`于是顺势回答它们应怎样守住职责。\n\n这里依次是市场要求、机构原则、具体分工。G结尾的压力与争议，也为H的`defuse the argument`提供要化解的问题。\n\n局部链是：F正视损失与可成交价格 → G维护独立准则制定者 → H分清披露和监管、落实各方职责。\n\nD是主题相近的竞争项，但D用`Unfortunately`开启游说危害，属于前面的总判断；移到这里会在提出解决条件后倒退回问题开场，而且不能像G那样把H的机构职责讨论直接引出来。\n\n因此，45题选**G**。","html":"<p>45空位于F之后、给定H之前。F已说明损失必须处理、资产价格必须吸引买家；H将讨论准则制定者究竟负责披露还是监管，二者之间需要先把“准则制定者为什么重要”说出来。</p>\n<p>F末尾讲收购计划只有在买家接受价格时才有效。G首句<code>Successful markets require independent and even combative standard-setters</code>把市场条件落到维护规则的机构上，并以股票期权、养老金规则举例，最后警告让步只会引来更多压力。H开头<code>Standard-setters should defuse the argument by making clear that their job is ...</code>于是顺势回答它们应怎样守住职责。</p>\n<p>这里依次是市场要求、机构原则、具体分工。G结尾的压力与争议，也为H的<code>defuse the argument</code>提供要化解的问题。</p>\n<p>局部链是：F正视损失与可成交价格 → G维护独立准则制定者 → H分清披露和监管、落实各方职责。</p>\n<p>D是主题相近的竞争项，但D用<code>Unfortunately</code>开启游说危害，属于前面的总判断；移到这里会在提出解决条件后倒退回问题开场，而且不能像G那样把H的机构职责讨论直接引出来。</p>\n<p>因此，45题选<strong>G</strong>。</p>\n","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{}},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"section":"第五鸟 · 写作积累","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **independent thinking** | **独立思考** | **人生哲理类** | **个人主题** |\n| **a sense of responsibility** | **责任感** | **人生哲理类** | **个人主题** |\n| the courage to admit mistakes | 承认错误的勇气 | 人生哲理类 | 个人主题 |\n| coping with pressure | 应对压力 | 人生哲理类 | 个人主题 |\n| overall planning | 整体规划 | 人生哲理类 | 个人主题 |\n| putting plans into practice | 把计划付诸实践 | 人生哲理类 | 个人主题 |\n| long-term thinking | 长远思考 | 人生哲理类 | 个人主题 |\n| rational judgment | 理性判断 >\n<tbody>\n<tr>\n<td><strong>图画题</strong></td>\n<td><strong>In the picture, A is blaming B for X.</strong></td>\n<td><strong>图中，A正在因X责怪B。</strong></td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>A is taking aim at B rather than dealing with X.</td>\n<td>A把矛头对准B，而不是处理X。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>A is reluctant to do X for fear of Y.</td>\n<td>A因为担心Y而不愿做X。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>By giving in to X, A is inviting pressure to do Y.</td>\n<td>A由于向X让步，正在招致进一步做Y的压力。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>As the chart shows, A rose, while B fell.</td>\n<td>如图所示，A上升，而B下降。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The figures largely reflect X, not Y.</td>\n<td>这些数据主要反映X，而非Y。</td>\n</tr>\n<tr>\n<td><strong>图表题</strong></td>\n<td><strong>A remains below B, suggesting that X.</strong></td>\n<td><strong>A仍低于B，表明X。</strong></td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The change in A partly reflects X.</td>\n<td>A的变化部分反映了X。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>The passage argues that A is essential to the proper functioning of B.</strong></td>\n<td><strong>材料认为，A对B的正常运作至关重要。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>According to the passage, X will be difficult unless A does B.</td>\n<td>材料指出，除非A做B，否则实现X将很困难。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The passage points out that X must be recognized and dealt with.</td>\n<td>材料指出，必须承认并处理X。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The passage stresses that successful X requires A.</td>\n<td>材料强调，成功的X需要A。</td>\n</tr>\n</tbody>\n</table></div>\n","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{}}];
