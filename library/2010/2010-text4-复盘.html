ceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":true},"focusId":"focus-q38-B-3"},{"title":"C. act on their own in rule-setting","level":3,"section":"第三鸟 · 题目复盘","raw":"### C. act on their own in rule-setting\n\n> 在制定规则时自主行事\n\n**做题模式中的状态：**当时C没有遮挡。我们把欧洲要求IASB`do likewise`、IASB不愿无整体规划就行动，以及欧洲可以另订规则这几处连起来，判断McCreevy是在反对它按自己的规划决定规则。第一轮保留C；其他三项排除后没有再变动。\n\n**选项类型：正确跨句概括。**\n\nC没有逐字使用“政治真空”，而是把全段冲突概括为制定规则的自主权。欧洲要求照做，IASB要按整体规划处理，McCreevy以另订规则相威胁；三处共同指向它能否自行决定规则。\n\n**出处：**\n\n> European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.\n>\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>在制定规则时自主行事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C没有遮挡。我们把欧洲要求IASB<code>do likewise</code>、IASB不愿无整体规划就行动，以及欧洲可以另订规则这几处连起来，判断McCreevy是在反对它按自己的规划决定规则。第一轮保留C；其他三项排除后没有再变动。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>C没有逐字使用“政治真空”，而是把全段冲突概括为制定规则的自主权。欧洲要求照做，IASB要按整体规划处理，McCreevy以另订规则相威胁；三处共同指向它能否自行决定规则。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false},"focusId":"focus-q38-C-0"},{"title":"C. act on their own in rule-setting","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据第4段，McCreevy反对IASB试图在制定规则时自主行事。\n\n题干中的McCreevy对应段末的`warned`。要知道这声警告反对什么，需往前接IASB的`does not want to act without overall planning`，再接欧洲部长的`do likewise`。\n\n欧洲先要求IASB仿效美国机构的变化，IASB则不愿在缺乏整体规划时行动。McCreevy随后强调政治现实，并警告欧洲可以制定不同规则。\n\n选项中的`on their own`不是指IASB从来不与别人交流，而是在这次规则制定中按自己的规划与判断行事。`in rule-setting`保留了冲突的具体领域，没有把独立性泛化成回避任何政治影响。\n\n因此，C把“要求照做—坚持规划—威胁另订规则”的三句关系压成对自主制定规则的反对，主体、动作和领域都能接上。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>在制定规则时自主行事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C没有遮挡。我们把欧洲要求IASB<code>do likewise</code>、IASB不愿无整体规划就行动，以及欧洲可以另订规则这几处连起来，判断McCreevy是在反对它按自己的规划决定规则。第一轮保留C；其他三项排除后没有再变动。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>C没有逐字使用“政治真空”，而是把全段冲突概括为制定规则的自主权。欧洲要求照做，IASB要按整体规划处理，McCreevy以另订规则相威胁；三处共同指向它能否自行决定规则。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图在制定规则时自主行事。</p>\n</blockquote>\n<p>题干中的McCreevy对应段末的<code>warned</code>。要知道这声警告反对什么，需往前接IASB的<code>does not want to act without overall planning</code>，再接欧洲部长的<code>do likewise</code>。</p>\n<p>欧洲先要求IASB仿效美国机构的变化，IASB则不愿在缺乏整体规划时行动。McCreevy随后强调政治现实，并警告欧洲可以制定不同规则。</p>\n<p>选项中的<code>on their own</code>不是指IASB从来不与别人交流，而是在这次规则制定中按自己的规划与判断行事。<code>in rule-setting</code>保留了冲突的具体领域，没有把独立性泛化成回避任何政治影响。</p>\n<p>因此，C把“要求照做—坚持规划—威胁另订规则”的三句关系压成对自主制定规则的反对，主体、动作和领域都能接上。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false},"focusId":"focus-q38-C-1"},{"title":"C. act on their own in rule-setting","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.\n>\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.\n>\n> 欧洲要求IASB照做；IASB坚持整体规划；McCreevy用政治现实和欧洲另订规则施压。\n\n每句话都在加深同一个冲突：IASB想按自身的规则重建安排处理，欧洲政治人物不接受它自行决定。\n\n如果C真是作者的意思，文章至少得写成：\n\n> McCreevy warned the IASB not to decide its rules solely on its own terms, since Europe could develop different rules.\n>\n> McCreevy警告IASB，不能只按自己的安排决定规则，因为欧洲可以制定不同规则。\n\nC所需要的警告已经由原文的结尾给出：若IASB不按欧洲要求改变，欧洲仍可另订规则。假设句把这层施压关系说直白，没有改成同僚压力或渐进改革。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>在制定规则时自主行事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C没有遮挡。我们把欧洲要求IASB<code>do likewise</code>、IASB不愿无整体规划就行动，以及欧洲可以另订规则这几处连起来，判断McCreevy是在反对它按自己的规划决定规则。第一轮保留C；其他三项排除后没有再变动。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>C没有逐字使用“政治真空”，而是把全段冲突概括为制定规则的自主权。欧洲要求照做，IASB要按整体规划处理，McCreevy以另订规则相威胁；三处共同指向它能否自行决定规则。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图在制定规则时自主行事。</p>\n</blockquote>\n<p>题干中的McCreevy对应段末的<code>warned</code>。要知道这声警告反对什么，需往前接IASB的<code>does not want to act without overall planning</code>，再接欧洲部长的<code>do likewise</code>。</p>\n<p>欧洲先要求IASB仿效美国机构的变化，IASB则不愿在缺乏整体规划时行动。McCreevy随后强调政治现实，并警告欧洲可以制定不同规则。</p>\n<p>选项中的<code>on their own</code>不是指IASB从来不与别人交流，而是在这次规则制定中按自己的规划与判断行事。<code>in rule-setting</code>保留了冲突的具体领域，没有把独立性泛化成回避任何政治影响。</p>\n<p>因此，C把“要求照做—坚持规划—威胁另订规则”的三句关系压成对自主制定规则的反对，主体、动作和领域都能接上。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>欧洲要求IASB照做；IASB坚持整体规划；McCreevy用政治现实和欧洲另订规则施压。</p>\n</blockquote>\n<p>每句话都在加深同一个冲突：IASB想按自身的规则重建安排处理，欧洲政治人物不接受它自行决定。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>McCreevy warned the IASB not to decide its rules solely on its own terms, since Europe could develop different rules.</p>\n<p>McCreevy警告IASB，不能只按自己的安排决定规则，因为欧洲可以制定不同规则。</p>\n</blockquote>\n<p>C所需要的警告已经由原文的结尾给出：若IASB不按欧洲要求改变，欧洲仍可另订规则。假设句把这层施压关系说直白，没有改成同僚压力或渐进改革。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false},"focusId":"focus-q38-C-2"},{"title":"C. act on their own in rule-setting","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入38题题干：\n\n> 全文主旨只能确认作者支持准则制定者抵御压力，不能单独判断McCreevy反对IASB的哪种具体尝试。本题仍要把第4段的要求、回应与警告连起来。\n\nC实际说的是：\n\n> act on their own in rule-setting  \n> 在制定规则时自主行事\n\n全文同情受到压力的制定者，支持它们保有独立判断。C描写的正是这种独立在第4段怎样受到挑战：McCreevy反对IASB自行安排规则制定。具体仍由欧洲要求照做与另订规则的威胁支持，不能只凭主旨跳过人物关系。\n\n**复盘判断：C正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>在制定规则时自主行事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时C没有遮挡。我们把欧洲要求IASB<code>do likewise</code>、IASB不愿无整体规划就行动，以及欧洲可以另订规则这几处连起来，判断McCreevy是在反对它按自己的规划决定规则。第一轮保留C；其他三项排除后没有再变动。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>C没有逐字使用“政治真空”，而是把全段冲突概括为制定规则的自主权。欧洲要求照做，IASB要按整体规划处理，McCreevy以另订规则相威胁；三处共同指向它能否自行决定规则。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图在制定规则时自主行事。</p>\n</blockquote>\n<p>题干中的McCreevy对应段末的<code>warned</code>。要知道这声警告反对什么，需往前接IASB的<code>does not want to act without overall planning</code>，再接欧洲部长的<code>do likewise</code>。</p>\n<p>欧洲先要求IASB仿效美国机构的变化，IASB则不愿在缺乏整体规划时行动。McCreevy随后强调政治现实，并警告欧洲可以制定不同规则。</p>\n<p>选项中的<code>on their own</code>不是指IASB从来不与别人交流，而是在这次规则制定中按自己的规划与判断行事。<code>in rule-setting</code>保留了冲突的具体领域，没有把独立性泛化成回避任何政治影响。</p>\n<p>因此，C把“要求照做—坚持规划—威胁另订规则”的三句关系压成对自主制定规则的反对，主体、动作和领域都能接上。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-C-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.</p>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>欧洲要求IASB照做；IASB坚持整体规划；McCreevy用政治现实和欧洲另订规则施压。</p>\n</blockquote>\n<p>每句话都在加深同一个冲突：IASB想按自身的规则重建安排处理，欧洲政治人物不接受它自行决定。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>McCreevy warned the IASB not to decide its rules solely on its own terms, since Europe could develop different rules.</p>\n<p>McCreevy警告IASB，不能只按自己的安排决定规则，因为欧洲可以制定不同规则。</p>\n</blockquote>\n<p>C所需要的警告已经由原文的结尾给出：若IASB不按欧洲要求改变，欧洲仍可另订规则。假设句把这层施压关系说直白，没有改成同僚压力或渐进改革。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-C-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入38题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者支持准则制定者抵御压力，不能单独判断McCreevy反对IASB的哪种具体尝试。本题仍要把第4段的要求、回应与警告连起来。</p>\n</blockquote>\n<p>C实际说的是：</p>\n<blockquote>\n<p>act on their own in rule-setting<br/>\n在制定规则时自主行事</p>\n</blockquote>\n<p>全文同情受到压力的制定者，支持它们保有独立判断。C描写的正是这种独立在第4段怎样受到挑战：McCreevy反对IASB自行安排规则制定。具体仍由欧洲要求照做与另订规则的威胁支持，不能只凭主旨跳过人物关系。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":true},"focusId":"focus-q38-C-3"},{"title":"D. take gradual measures in reform","level":3,"section":"第三鸟 · 题目复盘","raw":"### D. take gradual measures in reform\n\n> 在改革中采取渐进措施\n\n**做题模式中的状态：**当时D是完整选项。我们回看第4段的`overall planning`和`later this year`，区分了整体规划、完成时间与渐进改革：原文没有说一步步推进是McCreevy反对的事。第一轮排除D，后续没有改判。\n\n**错误类型：第三类——无中生有。**\n\nD借用“整体规划”和“今年晚些时候”，让读者自行补成“渐进改革”。有计划、有完成时间，并不等于分阶段逐步实施；原文也没有把改革速度或步骤写成McCreevy反对的对象。\n\n**出处：**\n\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>在改革中采取渐进措施</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D是完整选项。我们回看第4段的<code>overall planning</code>和<code>later this year</code>，区分了整体规划、完成时间与渐进改革：原文没有说一步步推进是McCreevy反对的事。第一轮排除D，后续没有改判。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D借用“整体规划”和“今年晚些时候”，让读者自行补成“渐进改革”。有计划、有完成时间，并不等于分阶段逐步实施；原文也没有把改革速度或步骤写成McCreevy反对的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false},"focusId":"focus-q38-D-0"},{"title":"D. take gradual measures in reform","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第4段，McCreevy反对IASB试图在改革中采取渐进措施。\n\nD的`gradual measures`在原文没有直接对应词。容易被拿来联想的是`overall planning`和`later this year`，需要分别看它们修饰什么。\n\n`without overall planning`说明IASB不愿在缺少总体安排时行动；`later this year`说明完成规则重建的时间。McCreevy的警告则落在政治现实和欧洲另订规则上。\n\n整体规划讲决策安排，时间状语讲何时完成，两者都没有说明改革将按多少阶段或多慢的速度推进。D需要的“渐进措施”不能由这两个词组相加得到。\n\nD因此补出了一条原文没有的改革路线，并进一步把它设定为McCreevy反对的内容；这两层关系在段落里都没有被写明。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>在改革中采取渐进措施</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D是完整选项。我们回看第4段的<code>overall planning</code>和<code>later this year</code>，区分了整体规划、完成时间与渐进改革：原文没有说一步步推进是McCreevy反对的事。第一轮排除D，后续没有改判。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D借用“整体规划”和“今年晚些时候”，让读者自行补成“渐进改革”。有计划、有完成时间，并不等于分阶段逐步实施；原文也没有把改革速度或步骤写成McCreevy反对的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图在改革中采取渐进措施。</p>\n</blockquote>\n<p>D的<code>gradual measures</code>在原文没有直接对应词。容易被拿来联想的是<code>overall planning</code>和<code>later this year</code>，需要分别看它们修饰什么。</p>\n<p><code>without overall planning</code>说明IASB不愿在缺少总体安排时行动；<code>later this year</code>说明完成规则重建的时间。McCreevy的警告则落在政治现实和欧洲另订规则上。</p>\n<p>整体规划讲决策安排，时间状语讲何时完成，两者都没有说明改革将按多少阶段或多慢的速度推进。D需要的“渐进措施”不能由这两个词组相加得到。</p>\n<p>D因此补出了一条原文没有的改革路线，并进一步把它设定为McCreevy反对的内容；这两层关系在段落里都没有被写明。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false},"focusId":"focus-q38-D-1"},{"title":"D. take gradual measures in reform","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.\n>\n> Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.\n>\n> IASB强调整体规划，McCreevy强调政治要求以及欧洲另立规则的可能。\n\n作者继续写的是能否抵住政治压力，不是比较快速改革和逐步改革哪种方案更合适。\n\n如果D真是作者的意思，文章至少得写成：\n\n> McCreevy objected to the IASB’s plan to introduce reforms gradually.\n>\n> McCreevy反对IASB逐步推行改革的计划。\n\n假设句至少必须出现分阶段推进的改革计划，再写McCreevy反对这种节奏。实际文章只给整体规划和完成时间，警告也没有针对渐进性。","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>在改革中采取渐进措施</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D是完整选项。我们回看第4段的<code>overall planning</code>和<code>later this year</code>，区分了整体规划、完成时间与渐进改革：原文没有说一步步推进是McCreevy反对的事。第一轮排除D，后续没有改判。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D借用“整体规划”和“今年晚些时候”，让读者自行补成“渐进改革”。有计划、有完成时间，并不等于分阶段逐步实施；原文也没有把改革速度或步骤写成McCreevy反对的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图在改革中采取渐进措施。</p>\n</blockquote>\n<p>D的<code>gradual measures</code>在原文没有直接对应词。容易被拿来联想的是<code>overall planning</code>和<code>later this year</code>，需要分别看它们修饰什么。</p>\n<p><code>without overall planning</code>说明IASB不愿在缺少总体安排时行动；<code>later this year</code>说明完成规则重建的时间。McCreevy的警告则落在政治现实和欧洲另订规则上。</p>\n<p>整体规划讲决策安排，时间状语讲何时完成，两者都没有说明改革将按多少阶段或多慢的速度推进。D需要的“渐进措施”不能由这两个词组相加得到。</p>\n<p>D因此补出了一条原文没有的改革路线，并进一步把它设定为McCreevy反对的内容；这两层关系在段落里都没有被写明。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>IASB强调整体规划，McCreevy强调政治要求以及欧洲另立规则的可能。</p>\n</blockquote>\n<p>作者继续写的是能否抵住政治压力，不是比较快速改革和逐步改革哪种方案更合适。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>McCreevy objected to the IASB’s plan to introduce reforms gradually.</p>\n<p>McCreevy反对IASB逐步推行改革的计划。</p>\n</blockquote>\n<p>假设句至少必须出现分阶段推进的改革计划，再写McCreevy反对这种节奏。实际文章只给整体规划和完成时间，警告也没有针对渐进性。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false},"focusId":"focus-q38-D-2"},{"title":"D. take gradual measures in reform","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入38题题干：\n\n> 全文主旨只能确认作者支持准则制定者抵御压力，不能单独判断McCreevy反对IASB的哪种具体尝试。本题仍要把第4段的要求、回应与警告连起来。\n\n但D实际说的是：\n\n> take gradual measures in reform  \n> 在改革中采取渐进措施\n\n支持准则制定者的独立性，可以说明作者为何在意政治施压，却不能告诉我们改革是一步到位还是逐步推进。本项最终仍要看第4段：`overall planning`与`later this year`都没有建立`gradual measures`，不能用主旨替D补这个方案。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>在改革中采取渐进措施</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时D是完整选项。我们回看第4段的<code>overall planning</code>和<code>later this year</code>，区分了整体规划、完成时间与渐进改革：原文没有说一步步推进是McCreevy反对的事。第一轮排除D，后续没有改判。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D借用“整体规划”和“今年晚些时候”，让读者自行补成“渐进改革”。有计划、有完成时间，并不等于分阶段逐步实施；原文也没有把改革速度或步骤写成McCreevy反对的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第4段，McCreevy反对IASB试图在改革中采取渐进措施。</p>\n</blockquote>\n<p>D的<code>gradual measures</code>在原文没有直接对应词。容易被拿来联想的是<code>overall planning</code>和<code>later this year</code>，需要分别看它们修饰什么。</p>\n<p><code>without overall planning</code>说明IASB不愿在缺少总体安排时行动；<code>later this year</code>说明完成规则重建的时间。McCreevy的警告则落在政治现实和欧洲另订规则上。</p>\n<p>整体规划讲决策安排，时间状语讲何时完成，两者都没有说明改革将按多少阶段或多慢的速度推进。D需要的“渐进措施”不能由这两个词组相加得到。</p>\n<p>D因此补出了一条原文没有的改革路线，并进一步把它设定为McCreevy反对的内容；这两层关系在段落里都没有被写明。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-D-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.</p>\n<p>Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.</p>\n<p>IASB强调整体规划，McCreevy强调政治要求以及欧洲另立规则的可能。</p>\n</blockquote>\n<p>作者继续写的是能否抵住政治压力，不是比较快速改革和逐步改革哪种方案更合适。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>McCreevy objected to the IASB’s plan to introduce reforms gradually.</p>\n<p>McCreevy反对IASB逐步推行改革的计划。</p>\n</blockquote>\n<p>假设句至少必须出现分阶段推进的改革计划，再写McCreevy反对这种节奏。实际文章只给整体规划和完成时间，警告也没有针对渐进性。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-D-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入38题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者支持准则制定者抵御压力，不能单独判断McCreevy反对IASB的哪种具体尝试。本题仍要把第4段的要求、回应与警告连起来。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>take gradual measures in reform<br/>\n在改革中采取渐进措施</p>\n</blockquote>\n<p>支持准则制定者的独立性，可以说明作者为何在意政治施压，却不能告诉我们改革是一步到位还是逐步推进。本项最终仍要看第4段：<code>overall planning</code>与<code>later this year</code>都没有建立<code>gradual measures</code>，不能用主旨替D补这个方案。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true},"focusId":"focus-q38-D-3"},{"title":"38题结论","level":3,"section":"第三鸟 · 题目复盘","raw":"### 38题结论\n\n> **38. C. act on their own in rule-setting**\n\nA把政治警告改成IASB自己的尝试，未落到制定规则的具体分歧。\n\nB把部长和委员的政治施压改成同僚压力。\n\nC概括了欧洲要求照做与IASB坚持自主规划之间的冲突。\n\nD把整体规划和完成时间补写成渐进改革措施。","html":"<blockquote>\n<p><strong>38. C. act on their own in rule-setting</strong></p>\n</blockquote>\n<p>A把政治警告改成IASB自己的尝试，未落到制定规则的具体分歧。</p>\n<p>B把部长和委员的政治施压改成同僚压力。</p>\n<p>C概括了欧洲要求照做与IASB坚持自主规划之间的冲突。</p>\n<p>D把整体规划和完成时间补写成渐进改革措施。</p>\n","context":{"mode":"image","asset":"questions","label":"38题","focus":[168,759,1018,312],"sourceW":1353,"sourceH":1885},"meta":{"kind":"conclusion","question":"38","questionConclusion":true}},{"title":"39题 · 题干、题型与核心出处","level":2,"section":"第三鸟 · 题目复盘","raw":"## 39题\n\n> The author thinks the banks were “on the wrong planet” in that they ______.  \n> 作者认为银行“完全脱离现实”，是因为它们做了什么？\n\n### 题型\n\n定位解释题。题干引用`on the wrong planet`，又用`in that`追问具体原因。要解释的是作者在这句话里指责银行哪一点，不是把第5段所有批评银行的内容都拿来作答。\n\n### 核心出处\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n>\n> Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.\n>\n> And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.\n\n第5段首句用强调句把批评对象锁定为银行，紧接的`with accounts that vastly overvalued assets`把“脱离现实”说具体：账目大幅高估资产。后面`Today they argue`转入银行如今的辩解，段末又写银行不愿买卖资产的行为；这两部分各有功能，不能替换首句的直接解释。","html":"<blockquote>\n<p>The author thinks the banks were “on the wrong planet” in that they ______.<br/>\n作者认为银行“完全脱离现实”，是因为它们做了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>定位解释题。题干引用<code>on the wrong planet</code>，又用<code>in that</code>追问具体原因。要解释的是作者在这句话里指责银行哪一点，不是把第5段所有批评银行的内容都拿来作答。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.</p>\n</blockquote>\n<p>第5段首句用强调句把批评对象锁定为银行，紧接的<code>with accounts that vastly overvalued assets</code>把“脱离现实”说具体：账目大幅高估资产。后面<code>Today they argue</code>转入银行如今的辩解，段末又写银行不愿买卖资产的行为；这两部分各有功能，不能替换首句的直接解释。</p>\n","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"question","question":"39","questionIntro":true}},{"title":"A. misinterpreted market price indicators","level":3,"section":"第三鸟 · 题目复盘","raw":"### A. misinterpreted market price indicators\n\n> 误读了市场价格指标\n\n**做题模式中的状态：**当时A没有遮挡。我们看到后文银行辩称市场价格夸大损失，但题干引用的`wrong planet`紧跟的解释是账目高估资产。做题时把银行的后续辩解与首句解释分开，第一轮排除A，后来没有改判。\n\n**错误类型：第一类——歪曲原意。**\n\nA抓住后文围绕市场价格的争执，将银行对市场价格的解释拿来回答`wrong planet`的具体含义。市场价格确实是这一段的话题，但题干要的是首句紧接着说明的错误，不是这一段另外一层争论。\n\n**出处：**\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n>\n> Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.\n>\n> But banks' shares trade below their book value, suggesting that investors are skeptical.","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>误读了市场价格指标</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们看到后文银行辩称市场价格夸大损失，但题干引用的<code>wrong planet</code>紧跟的解释是账目高估资产。做题时把银行的后续辩解与首句解释分开，第一轮排除A，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住后文围绕市场价格的争执，将银行对市场价格的解释拿来回答<code>wrong planet</code>的具体含义。市场价格确实是这一段的话题，但题干要的是首句紧接着说明的错误，不是这一段另外一层争论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>But banks' shares trade below their book value, suggesting that investors are skeptical.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false},"focusId":"focus-q39-A-0"},{"title":"A. misinterpreted market price indicators","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为银行“完全脱离现实”，是因为它们误读了市场价格指标。\n\n题干直接引用`on the wrong planet`，因此首要锚点是第5段首句；`in that`要求向后找这次评价的解释，而不是见到`market prices`就换到第二句。\n\n首句紧接`with accounts that vastly overvalued assets`，给出账目高估资产的具体错误。第二句用`Today they argue`转入银行如今的说法：市场价格夸大了损失。\n\n首句是作者直接指出的错误，第二句是银行的辩解，随后作者再引投资者怀疑。即便后文足以使人认为银行对市场价格的看法可疑，也不能用这一争论替换首句已经给出的解释。\n\nA的回答跑到了后续市场价格争论这一层；题干锁定的评价，在同句中已经被具体限定为高估资产。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>误读了市场价格指标</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们看到后文银行辩称市场价格夸大损失，但题干引用的<code>wrong planet</code>紧跟的解释是账目高估资产。做题时把银行的后续辩解与首句解释分开，第一轮排除A，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住后文围绕市场价格的争执，将银行对市场价格的解释拿来回答<code>wrong planet</code>的具体含义。市场价格确实是这一段的话题，但题干要的是首句紧接着说明的错误，不是这一段另外一层争论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>But banks' shares trade below their book value, suggesting that investors are skeptical.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们误读了市场价格指标。</p>\n</blockquote>\n<p>题干直接引用<code>on the wrong planet</code>，因此首要锚点是第5段首句；<code>in that</code>要求向后找这次评价的解释，而不是见到<code>market prices</code>就换到第二句。</p>\n<p>首句紧接<code>with accounts that vastly overvalued assets</code>，给出账目高估资产的具体错误。第二句用<code>Today they argue</code>转入银行如今的说法：市场价格夸大了损失。</p>\n<p>首句是作者直接指出的错误，第二句是银行的辩解，随后作者再引投资者怀疑。即便后文足以使人认为银行对市场价格的看法可疑，也不能用这一争论替换首句已经给出的解释。</p>\n<p>A的回答跑到了后续市场价格争论这一层；题干锁定的评价，在同句中已经被具体限定为高估资产。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false},"focusId":"focus-q39-A-1"},{"title":"A. misinterpreted market price indicators","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.\n>\n> Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.\n>\n> 作者先说银行的账目高估资产，再另起一句转述银行对市场价格的辩解。\n\n`Today they argue`标明新的说话层次：先有作者指出的账目问题，后有银行试图辩护。两部分不是同一句评价后互相平行的释义。\n\n如果A真是作者的意思，文章至少得写成：\n\n> It was banks that were on the wrong planet because they misread market price indicators.\n>\n> 银行之所以完全脱离现实，是因为它们误读了市场价格指标。\n\n要让A直接解释`wrong planet`，作者须把这条市场价格判断放进该评价的原因位置。实际放在这里的是`vastly overvalued assets`，市场价格的争执在后一句才展开。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>误读了市场价格指标</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们看到后文银行辩称市场价格夸大损失，但题干引用的<code>wrong planet</code>紧跟的解释是账目高估资产。做题时把银行的后续辩解与首句解释分开，第一轮排除A，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住后文围绕市场价格的争执，将银行对市场价格的解释拿来回答<code>wrong planet</code>的具体含义。市场价格确实是这一段的话题，但题干要的是首句紧接着说明的错误，不是这一段另外一层争论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>But banks' shares trade below their book value, suggesting that investors are skeptical.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们误读了市场价格指标。</p>\n</blockquote>\n<p>题干直接引用<code>on the wrong planet</code>，因此首要锚点是第5段首句；<code>in that</code>要求向后找这次评价的解释，而不是见到<code>market prices</code>就换到第二句。</p>\n<p>首句紧接<code>with accounts that vastly overvalued assets</code>，给出账目高估资产的具体错误。第二句用<code>Today they argue</code>转入银行如今的说法：市场价格夸大了损失。</p>\n<p>首句是作者直接指出的错误，第二句是银行的辩解，随后作者再引投资者怀疑。即便后文足以使人认为银行对市场价格的看法可疑，也不能用这一争论替换首句已经给出的解释。</p>\n<p>A的回答跑到了后续市场价格争论这一层；题干锁定的评价，在同句中已经被具体限定为高估资产。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>作者先说银行的账目高估资产，再另起一句转述银行对市场价格的辩解。</p>\n</blockquote>\n<p><code>Today they argue</code>标明新的说话层次：先有作者指出的账目问题，后有银行试图辩护。两部分不是同一句评价后互相平行的释义。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet because they misread market price indicators.</p>\n<p>银行之所以完全脱离现实，是因为它们误读了市场价格指标。</p>\n</blockquote>\n<p>要让A直接解释<code>wrong planet</code>，作者须把这条市场价格判断放进该评价的原因位置。实际放在这里的是<code>vastly overvalued assets</code>，市场价格的争执在后一句才展开。</p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false},"focusId":"focus-q39-A-2"},{"title":"A. misinterpreted market price indicators","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> sympathy  \n> 作者同情并支持保持独立、强硬的准则制定者。\n\n把这个主旨直接代入39题题干：\n\n> 全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。\n\n但A实际说的是：\n\n> misinterpreted market price indicators  \n> 误读了市场价格指标\n\n全文可以确认作者认为银行的问题不该归咎于准则制定者，但无法只靠这一立场区分银行究竟犯了哪一个局部错误。仍应根据`with accounts that vastly overvalued assets`判断。A取了同段的另一层内容，不能取代题干评价后的直接解释。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>误读了市场价格指标</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时A没有遮挡。我们看到后文银行辩称市场价格夸大损失，但题干引用的<code>wrong planet</code>紧跟的解释是账目高估资产。做题时把银行的后续辩解与首句解释分开，第一轮排除A，后来没有改判。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A抓住后文围绕市场价格的争执，将银行对市场价格的解释拿来回答<code>wrong planet</code>的具体含义。市场价格确实是这一段的话题，但题干要的是首句紧接着说明的错误，不是这一段另外一层争论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>But banks' shares trade below their book value, suggesting that investors are skeptical.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们误读了市场价格指标。</p>\n</blockquote>\n<p>题干直接引用<code>on the wrong planet</code>，因此首要锚点是第5段首句；<code>in that</code>要求向后找这次评价的解释，而不是见到<code>market prices</code>就换到第二句。</p>\n<p>首句紧接<code>with accounts that vastly overvalued assets</code>，给出账目高估资产的具体错误。第二句用<code>Today they argue</code>转入银行如今的说法：市场价格夸大了损失。</p>\n<p>首句是作者直接指出的错误，第二句是银行的辩解，随后作者再引投资者怀疑。即便后文足以使人认为银行对市场价格的看法可疑，也不能用这一争论替换首句已经给出的解释。</p>\n<p>A的回答跑到了后续市场价格争论这一层；题干锁定的评价，在同句中已经被具体限定为高估资产。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-A-2\"><h3>写作视角法</h3>\n<p>原文相关部分是这样写的：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n<p>Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.</p>\n<p>作者先说银行的账目高估资产，再另起一句转述银行对市场价格的辩解。</p>\n</blockquote>\n<p><code>Today they argue</code>标明新的说话层次：先有作者指出的账目问题，后有银行试图辩护。两部分不是同一句评价后互相平行的释义。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It was banks that were on the wrong planet because they misread market price indicators.</p>\n<p>银行之所以完全脱离现实，是因为它们误读了市场价格指标。</p>\n</blockquote>\n<p>要让A直接解释<code>wrong planet</code>，作者须把这条市场价格判断放进该评价的原因位置。实际放在这里的是<code>vastly overvalued assets</code>，市场价格的争执在后一句才展开。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-A-3\"><h3>主旨交叉验证法</h3>\n<p>40题的正确答案是：</p>\n<blockquote>\n<p>sympathy<br/>\n作者同情并支持保持独立、强硬的准则制定者。</p>\n</blockquote>\n<p>把这个主旨直接代入39题题干：</p>\n<blockquote>\n<p>全文主旨只能确认作者把真正的问题指向银行而非独立准则，不能单独判断“wrong planet”具体指哪一种错误。本题必须找这句评价紧接的解释。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>misinterpreted market price indicators<br/>\n误读了市场价格指标</p>\n</blockquote>\n<p>全文可以确认作者认为银行的问题不该归咎于准则制定者，但无法只靠这一立场区分银行究竟犯了哪一个局部错误。仍应根据<code>with accounts that vastly overvalued assets</code>判断。A取了同段的另一层内容，不能取代题干评价后的直接解释。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"method","question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true},"focusId":"focus-q39-A-3"},{"title":"B. exaggerated the real value of their assets","level":3,"section":"第三鸟 · 题目复盘","raw":"### B. exaggerated the real value of their assets\n\n> 夸大了其资产的实际价值\n\n**做题模式中的状态：**当时B没有遮挡。我们把它与`with accounts that vastly overvalued assets`对比，读到同样是银行的账目把资产估得过高，因此第一轮保留B。A、C、D排除后，B没有发生后续变化。\n\n**选项类型：正确同义改写。**\n\nB把动词`overvalued`展开为`exaggerated the real value`，保留资产价值被估高的方向。它直接改写`wrong planet`后面的解释，没有借用后续银行的辩解或段末买卖行为。\n\n**出处：**\n\n> It was banks that were on the wrong planet, with accounts that vastly overvalued assets.","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>夸大了其资产的实际价值</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B没有遮挡。我们把它与<code>with accounts that vastly overvalued assets</code>对比，读到同样是银行的账目把资产估得过高，因此第一轮保留B。A、C、D排除后，B没有发生后续变化。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p>B把动词<code>overvalued</code>展开为<code>exaggerated the real value</code>，保留资产价值被估高的方向。它直接改写<code>wrong planet</code>后面的解释，没有借用后续银行的辩解或段末买卖行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"39题","focus":[168,1117,1018,266],"sourceW":1353,"sourceH":1885},"meta":{"kind":"option","question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false},"focusId":"focus-q39-B-0"},{"title":"B. exaggerated the real value of their assets","level":4,"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为银行“完全脱离现实”，是因为它们夸大了其资产的实际价值。\n\n题干引用的`wrong planet`与B的资产价值描述，在第5段首句就能对应。关键不只是`banks`，而是紧接的`with accounts`及其后面说明账目问题的部分。\n\n作者说是银行完全脱离现实，因为它们的账目大幅高估了资产。`overvalued`说明估值超过应有价值，`vastly`加强高估的程度。\n\nB的主体仍是银行，对象仍是银行自己的资产，动作是夸大实际价值，与原文的高估方向相同。它没有改成低估资产，也没有改成否认坏账或误读市场指标。\n\n`overvalued assets`与`exaggerated the real value of their assets`只是表达方式不同；题干要求解释的评价与同句理由完整对应。","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>夸大了其资产的实际价值</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时B没有遮挡。我们把它与<code>with accounts that vastly overvalued assets</code>对比，读到同样是银行的账目把资产估得过高，因此第一轮保留B。A、C、D排除后，B没有发生后续变化。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p>B把动词<code>overvalued</code>展开为<code>exaggerated the real value</code>，保留资产价值被估高的方向。它直接改写<code>wrong planet</code>后面的解释，没有借用后续银行的辩解或段末买卖行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It was banks that were on the wrong planet, with accounts that vastly overvalued assets.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为银行“完全脱离现实”，是因为它们夸大了其资产的实际价值。</p>\n</blockquote>\n<p>题干引用的<code>wrong planet</code>与B的资产价值描述，在第5段首句就能对应。关键不只是<code>banks</code>，而是紧接的<code>with accounts</code>及其后面说明账目问题的部分。</p>\n<p>作者说是银行完全脱离现实，因为它们的账目大幅高估了资产。<code>overvalued</code>说明估值超过应有价值，<code>vastly</code>加强高估的程度。</p>\n<p>B的主体仍是银行，对象仍是银行自己的资产，动作是夸大实际价值，与原文的高估方向相同。它没有改成低估资产，也没有改成否认坏账或误读市场指标。</p>\n<p><code>overvalued assets</code>与<code>exaggerated the real va
