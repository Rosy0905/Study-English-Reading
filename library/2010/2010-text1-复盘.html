 · 精读与翻译","raw":"#### 第三步：按照中文语感合并意群\n\n这句话有两个并列原因。第一处把时间放到前面：\n\n> 早在他去世之前，新闻业的审美趣味就已经改变\n\n第二处把“他所擅长的”放到“散文”前面：\n\n> 后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文\n\n最后用“而且”接起来：\n\n> 早在他去世之前，新闻业的审美趣味就已经改变，而且后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>新闻业的品味 / 已经改变 / 早在他去世之前，/ 并且后现代读者 / 几乎不需要 / 他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>这句话有两个并列原因。第一处把时间放到前面：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变</p>\n</blockquote>\n<p>第二处把“他所擅长的”放到“散文”前面：</p>\n<blockquote>\n<p>后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n<p>最后用“而且”接起来：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变，而且后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第5段重点词与语境","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-5-3","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false}},{"title":"5. 第五段第三句","level":4,"lines":["","中文骨干是：","","> 新闻品味已经改变，而且现代读者不喜欢他的文风。","","再补时间和文风特征：","","> 早在他去世前；华丽装饰的维多利亚—爱德华时代散文。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第四步：寻找句子骨干并按照中文语序调整\n\n这句话先抓住主干：\n\n> 新闻品味已经改变，而且现代读者不喜欢他的文风。\n\n然后补上时间和文风特征：\n\n> 早在他去世前；华丽装饰的维多利亚—爱德华时代散文。","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>新闻业的品味 / 已经改变 / 早在他去世之前，/ 并且后现代读者 / 几乎不需要 / 他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>这句话有两个并列原因。第一处把时间放到前面：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变</p>\n</blockquote>\n<p>第二处把“他所擅长的”放到“散文”前面：</p>\n<blockquote>\n<p>后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n<p>最后用“而且”接起来：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变，而且后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>这句话先抓住主干：</p>\n<blockquote>\n<p>新闻品味已经改变，而且现代读者不喜欢他的文风。</p>\n</blockquote>\n<p>然后补上时间和文风特征：</p>\n<blockquote>\n<p>早在他去世前；华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第5段重点词与语境","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-5-4","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false}},{"title":"5. 第五段第三句","level":4,"lines":["","> 早在卡达斯去世之前，新闻业的审美趣味就已经改变；后现代读者也不再欣赏他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第五步：艺术加工\n\n> 早在卡达斯去世之前，新闻业的审美趣味就已经改变；后现代读者也不再欣赏他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>新闻业的品味 / 已经改变 / 早在他去世之前，/ 并且后现代读者 / 几乎不需要 / 他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>这句话有两个并列原因。第一处把时间放到前面：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变</p>\n</blockquote>\n<p>第二处把“他所擅长的”放到“散文”前面：</p>\n<blockquote>\n<p>后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n<p>最后用“而且”接起来：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变，而且后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>这句话先抓住主干：</p>\n<blockquote>\n<p>新闻品味已经改变，而且现代读者不喜欢他的文风。</p>\n</blockquote>\n<p>然后补上时间和文风特征：</p>\n<blockquote>\n<p>早在他去世前；华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-5\"><h3>第五步：艺术加工</h3><blockquote>\n<p>早在卡达斯去世之前，新闻业的审美趣味就已经改变；后现代读者也不再欣赏他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第5段重点词与语境","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-5-5","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":true}},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"lines":["","之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。","","而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：","","1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；","2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；","3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。","","其中三个判据的含义如下，我们在之前的做题模式里都见过：","","- **定位比对：**检查选项有没有准确改写局部原文；","- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；","- **全文主旨：**检查选项能不能放进“英文报纸中曾经繁荣、严肃、有分量的艺术评论传统正在消失，而且难以复兴”这个全文逻辑中。","","命题人的命题手法主要有三类，如下：","","#### 第一类：歪曲原意","","##### 定义","","选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。","","但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：","","- 肯定改成否定；","- 原因改成结果；","- 目的改成原因；","- 主体或对象偷换；","- 时间范围改变；","- 程度扩大或缩小；","- 动词词义改变；","- 语法结构改变；","- 作者承认 A 但支持 B，被改成作者否认 A。","","这一类的关键是：","","> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**","","##### 典型误选脑回路","","咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。","","所以这一类不能只问：","","> 这个词文章里有没有？","","而要问：","","> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？","","------","","#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答","","##### 定义","","这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。","","它错的不是“原文没这么说”，而是：","","> **它没有回答题干真正问的层面、范围或者功能。**","","常见情况包括：","","- 题目问段落主旨，选项是段落中的一个细节；","- 题目问全文主旨，选项只是某一段的内容；","- 题目问例子作用，选项只是例子内部发生了什么；","- 题目问作者观点，选项只是作者用来论证观点的事实；","- 题目限定某一段，选项出处却在其他段；","- 题目问论点，选项给的是论据；","- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。","","这一类的关键是：","","> **选项内容可以是真的，但它回答错了问题。**","","##### 典型误选脑回路","","咱们在原文里找到了这句话，确认它确实是真的，就直接选了。","","但阅读选择题不是判断选项本身真假，而是判断：","","> 这个选项能不能准确回答题干？","","所以这一类最常见的错误脑回路是：","","> 文章里确实写了 → 这个选项是真的 → 那就一定能选。","","真正应该继续追问：","","> 题干问的是主旨、作用、态度还是细节？",">  这个选项是论点还是论据？",">  它的出处在题干限定范围内吗？",">  它是在回答例子作用，还是只复述例子内容？","","------","","#### 第三类：无中生有","","##### 定义","","结合题干和选项的完整意思，文章实际没有表达这个命题。","","选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。","","在本篇文章里，常见的脑补包括：","","- 原文有`decline`，脑补成艺术评论已经彻底`disappeared`；","- 原文有`high-quality arts criticism`和`newspapers`，脑补成`high-quality newspapers`；","- 原文同时出现年轻读者、日报和`suitable`，脑补成年轻读者怀疑评论是否适合刊登；","- 原文有Newman的一段讽刺性引语，脑补成二战前英国报纸评论普遍具有激进观点；","- 原文出现`specialists`，脑补成Cardus的写作风格主要迎合现代专家；","- 原文说业余评论传统正在退却，脑补成Cardus的文章没有遵循这一传统。","","这一类的关键是：","","> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**","","##### 典型误选脑回路","","咱们不是在比对原文，而是在替作者把文章继续写下去：","","> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。","","但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。","","无中生有的分析不能只写：","","> 原文没提，所以错。","","而要写清楚：","","> 命题人拿了文章中的哪个词或哪句话；",">  咱们从这个地方开始怎样脑补；",">  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。","","","那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：","","我们先从25题开始，为什么要从全文主旨题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。"],"section":"第三鸟 · 题目复盘","raw":"做题模式还原的是考场状态：有些词不认识，只能用当时读到的信息判断。到了复盘阶段，单词、句子和答案都已经看清楚，不必再把题重做一遍，重点是弄明白每个选项从哪里来、又改错了什么。\n\n复盘时，把一道题拆成四个选项来看。每个选项主要看三件事：\n\n1. 它从原文哪句话或哪几句话改来；\n2. 它保留了原文什么，又偷偷改了什么；\n3. 用定位比对、写作视角和全文主旨再核一遍。\n\n三个方法分别这样用：\n\n- **定位比对：**把选项接回题干，再和原文逐块比较，看人物、动作、对象、范围、时间、程度和方向有没有变化；\n- **写作视角：**假设这个选项是对的，作者后面至少应该怎么写，再看实际文章是不是沿着这条路写；\n- **全文主旨：**先用全文主旨回答题干，再看选项能不能放进全文主线。主旨只负责核对大方向，局部细节仍要回原文判断。\n\n错误选项大体只有三类。\n\n#### 第一类：歪曲原意\n\n选项确实有出处，但把原文里的关键关系改了。常见改法有：\n\n- 肯定改成否定；\n- 原因和结果对调；\n- 主体或对象换了；\n- 时间、范围或程度变了；\n- 一个词还在，但它修饰的对象换了；\n- 原文只说“变少”，选项却写成“彻底没有”。\n\n这一类最容易被骗的地方，就是选项看起来特别像原文。不能只看词有没有出现，要把整句话接起来看。\n\n#### 第二类：内容是真的，但没有回答题干\n\n这种选项在原文里也能找到，甚至它本身没有说错。问题是题干问的是主旨、作用、态度或某个限定范围，它却拿一个细节、例子或其他段落来回答。\n\n看到原文里有这句话，还不能马上选。还要再问一句：\n\n> 这句话真的是题干要的那一层吗？\n\n#### 第三类：无中生有\n\n文章里没有选项说出的完整意思。命题人通常会拿几个原文词、一个相近场景或现实常识，让我们自己把中间缺的关系补出来。\n\n分析这类选项时，不要只写“原文没提”。要说清楚：它借了原文什么，我们又从哪里开始多想了一步，最后补出了哪条原文没有的关系。\n\n下面先复盘25题。先把全文主旨定下来，后面21—24题就多了一张可以随时拿回来核对的“主旨底牌”。","html":"<p>做题模式还原的是考场状态：有些词不认识，只能用当时读到的信息判断。到了复盘阶段，单词、句子和答案都已经看清楚，不必再把题重做一遍，重点是弄明白每个选项从哪里来、又改错了什么。</p>\n<p>复盘时，把一道题拆成四个选项来看。每个选项主要看三件事：</p>\n<ol>\n<li>它从原文哪句话或哪几句话改来；</li>\n<li>它保留了原文什么，又偷偷改了什么；</li>\n<li>用定位比对、写作视角和全文主旨再核一遍。</li>\n</ol>\n<p>三个方法分别这样用：</p>\n<ul>\n<li><strong>定位比对：</strong>把选项接回题干，再和原文逐块比较，看人物、动作、对象、范围、时间、程度和方向有没有变化；</li>\n<li><strong>写作视角：</strong>假设这个选项是对的，作者后面至少应该怎么写，再看实际文章是不是沿着这条路写；</li>\n<li><strong>全文主旨：</strong>先用全文主旨回答题干，再看选项能不能放进全文主线。主旨只负责核对大方向，局部细节仍要回原文判断。</li>\n</ul>\n<p>错误选项大体只有三类。</p>\n<h4>第一类：歪曲原意</h4>\n<p>选项确实有出处，但把原文里的关键关系改了。常见改法有：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因和结果对调；</li>\n<li>主体或对象换了；</li>\n<li>时间、范围或程度变了；</li>\n<li>一个词还在，但它修饰的对象换了；</li>\n<li>原文只说“变少”，选项却写成“彻底没有”。</li>\n</ul>\n<p>这一类最容易被骗的地方，就是选项看起来特别像原文。不能只看词有没有出现，要把整句话接起来看。</p>\n<h4>第二类：内容是真的，但没有回答题干</h4>\n<p>这种选项在原文里也能找到，甚至它本身没有说错。问题是题干问的是主旨、作用、态度或某个限定范围，它却拿一个细节、例子或其他段落来回答。</p>\n<p>看到原文里有这句话，还不能马上选。还要再问一句：</p>\n<blockquote>\n<p>这句话真的是题干要的那一层吗？</p>\n</blockquote>\n<h4>第三类：无中生有</h4>\n<p>文章里没有选项说出的完整意思。命题人通常会拿几个原文词、一个相近场景或现实常识，让我们自己把中间缺的关系补出来。</p>\n<p>分析这类选项时，不要只写“原文没提”。要说清楚：它借了原文什么，我们又从哪里开始多想了一步，最后补出了哪条原文没有的关系。</p>\n<p>下面先复盘25题。先把全文主旨定下来，后面21—24题就多了一张可以随时拿回来核对的“主旨底牌”。</p>\n","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1240,"sourceH":1636},"meta":{"kind":"section-cover","mergedIntro":true}},{"title":"25题 · 题干、选项与全文逻辑","level":2,"lines":["","**What would be the best title for the text?**","","> 这篇文章最合适的标题是什么？","","这是全文主旨题。","","这类题不要一上来就自己硬概括，因为英语和语文基础一般的同学很容易把主旨概括偏。这里继续使用写作视角法，只不过这次不是看某一句，而是把每个标题代入全文的组织逻辑。","","选项：","","A. **Newspapers of the Good Old Days**","","美好旧日的报纸","","B. **The Lost Horizon in Newspapers**","","报纸中消失的地平线","","C. **Mournful Decline of Journalism**","","新闻业令人悲哀的衰退","","D. **Prominent Critics in Memory**","","记忆中的著名评论家","","### 用写作视角确定主旨的方法分析每个选项","","所谓写作视角确定主旨，就是把每个选项代入文章的逻辑框架中，看如果作者真正想表达这个标题，五段至少应该怎样安排，再与实际文章比较。","","外刊文章通常不会毫无目的地堆材料。作者可能中间先承认一点、绕一下、举人物或铺背景，但最后仍会回到自己真正想说的那件事。现在先快速回顾这篇文章五段实际写了什么：","","| 段落 | 这一段在说什么 | 逻辑 |","| --- | --- | --- |","| 第1段 | 英文报纸的艺术报道在范围和严肃性上持续衰退 | 先说xxx现在不行了 |","| 第2段 | 回看过去大城市报纸中高质量艺术评论的普遍存在 | 再拿过去打现在，把今昔反差拉出来 |","| 第3段 | 继续写过去评论的分量、严肃性和评论家的能力 | 接着补证据，证明以前确实好 |","| 第4段 | 用Cardus生前受推崇、如今被遗忘的变化落地 | 再举一个人，说明以前多好、现在多差 |","| 第5段 | 解释Cardus及这类评论为什么难以复兴 | 最后解释为什么xxx回不来，给出结论 |","","---"],"section":"第三鸟 · 题目复盘","raw":"**What would be the best title for the text?**\n\n> 这篇文章最合适的标题是什么？\n\n这道题先不急着自己概括。把四个标题分别当成全文主旨，看五段会怎么安排，再和实际文章对照。\n\n选项：\n\nA. **Newspapers of the Good Old Days**\n\n美好旧日的报纸\n\nB. **The Lost Horizon in Newspapers**\n\n报纸中消失的地平线\n\nC. **Mournful Decline of Journalism**\n\n新闻业令人悲哀的衰退\n\nD. **Prominent Critics in Memory**\n\n记忆中的著名评论家\n\n### 用写作视角确定主旨的方法分析每个选项\n\n写作视角的用法很直接：把每个标题代入全文，看看作者如果真想写这个主题，五段至少应该怎样安排，再与实际文章比较。\n\n外刊文章不会无缘无故地堆材料。中间可以有铺垫、人物和例子，但这些内容最后都要回到同一个中心。先看这篇文章五段实际写了什么：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 英文报纸的艺术报道在范围和严肃性上持续衰退 | 先说xxx现在不行了 |\n| 第2段 | 回看过去大城市报纸中高质量艺术评论的普遍存在 | 再拿过去打现在，把今昔反差拉出来 |\n| 第3段 | 继续写过去评论的分量、严肃性和评论家的能力 | 接着补证据，证明以前确实好 |\n| 第4段 | 用Cardus生前受推崇、如今被遗忘的变化落地 | 再举一个人，说明以前多好、现在多差 |\n| 第5段 | 解释Cardus及这类评论为什么难以复兴 | 最后解释为什么xxx回不来，给出结论 |\n\n---","html":"<p><strong>What would be the best title for the text?</strong></p>\n<blockquote>\n<p>这篇文章最合适的标题是什么？</p>\n</blockquote>\n<p>这道题先不急着自己概括。把四个标题分别当成全文主旨，看五段会怎么安排，再和实际文章对照。</p>\n<p>选项：</p>\n<p>A. <strong>Newspapers of the Good Old Days</strong></p>\n<p>美好旧日的报纸</p>\n<p>B. <strong>The Lost Horizon in Newspapers</strong></p>\n<p>报纸中消失的地平线</p>\n<p>C. <strong>Mournful Decline of Journalism</strong></p>\n<p>新闻业令人悲哀的衰退</p>\n<p>D. <strong>Prominent Critics in Memory</strong></p>\n<p>记忆中的著名评论家</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>写作视角的用法很直接：把每个标题代入全文，看看作者如果真想写这个主题，五段至少应该怎样安排，再与实际文章比较。</p>\n<p>外刊文章不会无缘无故地堆材料。中间可以有铺垫、人物和例子，但这些内容最后都要回到同一个中心。先看这篇文章五段实际写了什么：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>这一段在说什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>英文报纸的艺术报道在范围和严肃性上持续衰退</td>\n  <td>先说xxx现在不行了</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>回看过去大城市报纸中高质量艺术评论的普遍存在</td>\n  <td>再拿过去打现在，把今昔反差拉出来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>继续写过去评论的分量、严肃性和评论家的能力</td>\n  <td>接着补证据，证明以前确实好</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用Cardus生前受推崇、如今被遗忘的变化落地</td>\n  <td>再举一个人，说明以前多好、现在多差</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>解释Cardus及这类评论为什么难以复兴</td>\n  <td>最后解释为什么xxx回不来，给出结论</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"meta":{"kind":"question","question":"25","option":null,"questionIntro":true}},{"title":"A. Newspapers of the Good Old Days","level":3,"lines":["### A. Newspapers of the Good Old Days","","> 美好旧日的报纸"],"section":"第三鸟 · 题目复盘","raw":"> 美好旧日的报纸","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-A-0\"><blockquote>\n<p>美好旧日的报纸</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-A-0","meta":{"kind":"option","question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false}},{"title":"A. Newspapers of the Good Old Days","level":4,"lines":["#### 如果 A 是主旨，文章五段应该怎么写？","","如果全文主旨真的是“美好旧日的报纸”，五段大概需要这样展开：","","| 段落 | 如果该选项正确，这段应该写什么 |","| --- | --- |","| 第1段 | 先整体赞美过去报纸比现在好 |","| 第2段 | 列举过去报纸在政治、社会、文化等方面的优点 |","| 第3段 | 继续补充旧报纸的其他长处 |","| 第4段 | 用人物或事件证明旧报纸整体繁荣 |","| 第5段 | 总结过去报纸值得怀念 |","","A最容易迷惑人的地方，是文章确实一直在拿过去和现在比较，而且明显更怀念过去。只看“过去更好”这一层，A似乎没有问题。","","但标题不能只抓住文章里的情绪，还要看作者到底在怀念什么。本文不是在全面回顾旧报纸，也没有讨论过去报纸的新闻、公信力、政治报道、社会版面等其他方面。作者始终盯着一个具体对象：报纸中的艺术评论。","","换句话说，旧报纸只是这种艺术评论曾经存在的载体，不是全文真正要介绍的中心。A把“报纸中的一种文化内容”扩大成“过去的报纸整体”，范围太大。","","实际文章最后还要解释这种评论为什么难以复兴。这个“已经失去、很难回来”的方向，也比单纯歌颂“美好旧日”更重要。","","**判断：A不保留。**","","---"],"section":"第三鸟 · 题目复盘","raw":"> 美好旧日的报纸\n\n#### 如果 A 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是“美好旧日的报纸”，五段大概需要这样展开：\n\n| 段落 | 如果这个选项正确，这段应该写什么 |\n| --- | --- |\n| 第1段 | 先整体赞美过去报纸比现在好 |\n| 第2段 | 列举过去报纸在政治、社会、文化等方面的优点 |\n| 第3段 | 继续补充旧报纸的其他长处 |\n| 第4段 | 用人物或事件证明旧报纸整体繁荣 |\n| 第5段 | 总结过去报纸值得怀念 |\n\nA容易让人犹豫，是因为文章确实一直在比较过去和现在，而且明显更怀念过去。只看到“过去更好”，A看起来说得通。\n\n但标题还得说清作者怀念的到底是什么。本文没有全面回顾旧报纸，也没有讨论新闻、公信力、政治报道或社会版面；作者始终盯着报纸中的艺术评论。\n\n旧报纸只是这种艺术评论过去依托的载体，全文的中心仍是艺术评论传统。A把“报纸中的一种文化内容”扩大成“过去的报纸整体”，范围太大。\n\n实际文章最后还要解释这种评论为什么难以复兴。这个“已经失去、很难回来”的方向，也比单纯歌颂“美好旧日”更重要。\n\n**判断：A不保留。**\n\n---","html":"<blockquote>\n<p>美好旧日的报纸</p>\n</blockquote>\n<h4>如果 A 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“美好旧日的报纸”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先整体赞美过去报纸比现在好</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>列举过去报纸在政治、社会、文化等方面的优点</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>继续补充旧报纸的其他长处</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用人物或事件证明旧报纸整体繁荣</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>总结过去报纸值得怀念</td>\n</tr>\n</tbody>\n</table></div>\n<p>A容易让人犹豫，是因为文章确实一直在比较过去和现在，而且明显更怀念过去。只看到“过去更好”，A看起来说得通。</p>\n<p>但标题还得说清作者怀念的到底是什么。本文没有全面回顾旧报纸，也没有讨论新闻、公信力、政治报道或社会版面；作者始终盯着报纸中的艺术评论。</p>\n<p>旧报纸只是这种艺术评论过去依托的载体，全文的中心仍是艺术评论传统。A把“报纸中的一种文化内容”扩大成“过去的报纸整体”，范围太大。</p>\n<p>实际文章最后还要解释这种评论为什么难以复兴。这个“已经失去、很难回来”的方向，也比单纯歌颂“美好旧日”更重要。</p>\n<p><strong>判断：A不保留。</strong></p>\n<hr />\n","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-A-1","meta":{"kind":"method","question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true}},{"title":"B. The Lost Horizon in Newspapers","level":3,"lines":["### B. The Lost Horizon in Newspapers","","> 报纸中消失的地平线"],"section":"第三鸟 · 题目复盘","raw":"> 报纸中消失的地平线","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-B-0\"><blockquote>\n<p>报纸中消失的地平线</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-B-0","meta":{"kind":"option","question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false}},{"title":"B. The Lost Horizon in Newspapers","level":4,"lines":["#### 如果 B 是主旨，文章五段应该怎么写？","","如果全文主旨真的是“报纸中消失的地平线”，五段大概需要这样展开：","","| 段落 | 如果该选项正确，这段应该写什么 |","| --- | --- |","| 第1段 | 先指出报纸中某种重要内容正在从视野里消失 |","| 第2段 | 用过去的繁荣反衬现在的失落 |","| 第3段 | 证明过去这类内容确实有质量、有分量 |","| 第4段 | 用典型人物展示这种传统由盛转衰 |","| 第5段 | 说明时代改变，失去的东西很难回来 |","","B没有把文章说死成“已经彻底消失”，而是用`lost horizon`概括一种正在远去、逐渐离开公众视野的文化景观。","","现在逐段对照：第1段先说艺术报道持续衰退；第2、3段回看过去，证明这种评论曾经普遍而且有分量；第4段用Cardus把抽象变化落到一个具体人物身上；第5段再说明这种评论很难复兴。","","也就是说，五段不是各写各的，而是在共同回答一件事：报纸里曾经有一种重要的艺术评论传统，现在它正在消失，而且很难回到原来的位置。","","B既能包住“过去曾经繁荣”，也能包住“现在衰退”和“未来难复兴”，因此能解释全文为什么这样安排。","","**判断：B保留。**","","---"],"section":"第三鸟 · 题目复盘","raw":"> 报纸中消失的地平线\n\n#### 如果 B 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是“报纸中消失的地平线”，五段大概需要这样展开：\n\n| 段落 | 如果这个选项正确，这段应该写什么 |\n| --- | --- |\n| 第1段 | 先指出报纸中某种重要内容正在从视野里消失 |\n| 第2段 | 用过去的繁荣反衬现在的失落 |\n| 第3段 | 证明过去这类内容确实有质量、有分量 |\n| 第4段 | 用典型人物展示这种传统由盛转衰 |\n| 第5段 | 说明时代改变，失去的东西很难回来 |\n\nB没有把文章说死成“已经彻底消失”。`lost horizon`概括的是一种正在远去、逐渐离开公众视野的文化景观。\n\n现在逐段对照：第1段先说艺术报道持续衰退；第2、3段回看过去，证明这种评论曾经普遍而且有分量；第4段用Cardus把抽象变化落到一个具体人物身上；第5段再说明这种评论很难复兴。\n\n五段都在回答同一件事：报纸里曾经有一种重要的艺术评论传统，现在它正在消失，而且很难回到原来的位置。\n\nB既能包住“过去曾经繁荣”，也能包住“现在衰退”和“未来难复兴”，因此能解释全文为什么这样安排。\n\n**判断：B保留。**\n\n---","html":"<blockquote>\n<p>报纸中消失的地平线</p>\n</blockquote>\n<h4>如果 B 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“报纸中消失的地平线”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先指出报纸中某种重要内容正在从视野里消失</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>用过去的繁荣反衬现在的失落</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>证明过去这类内容确实有质量、有分量</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用典型人物展示这种传统由盛转衰</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>说明时代改变，失去的东西很难回来</td>\n</tr>\n</tbody>\n</table></div>\n<p>B没有把文章说死成“已经彻底消失”。<code>lost horizon</code>概括的是一种正在远去、逐渐离开公众视野的文化景观。</p>\n<p>现在逐段对照：第1段先说艺术报道持续衰退；第2、3段回看过去，证明这种评论曾经普遍而且有分量；第4段用Cardus把抽象变化落到一个具体人物身上；第5段再说明这种评论很难复兴。</p>\n<p>五段都在回答同一件事：报纸里曾经有一种重要的艺术评论传统，现在它正在消失，而且很难回到原来的位置。</p>\n<p>B既能包住“过去曾经繁荣”，也能包住“现在衰退”和“未来难复兴”，因此能解释全文为什么这样安排。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr />\n","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-B-1","meta":{"kind":"method","question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true}},{"title":"C. Mournful Decline of Journalism","level":3,"lines":["### C. Mournful Decline of Journalism","","> 新闻业令人悲哀的衰退"],"section":"第三鸟 · 题目复盘","raw":"> 新闻业令人悲哀的衰退","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-C-0\"><blockquote>\n<p>新闻业令人悲哀的衰退</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-C-0","meta":{"kind":"option","question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false}},{"title":"C. Mournful Decline of Journalism","level":4,"lines":["#### 如果 C 是主旨，文章五段应该怎么写？","","如果全文主旨真的是“新闻业令人悲哀的衰退”，五段大概需要这样展开：","","| 段落 | 如果该选项正确，这段应该写什么 |","| --- | --- |","| 第1段 | 先说整个新闻业都在衰退 |","| 第2段 | 回顾过去新闻业整体繁荣 |","| 第3段 | 证明新闻采编、报道、公信力等全面更好 |","| 第4段 | 用记者或报业事件说明整个行业衰落 |","| 第5段 | 总结新闻业整体前景悲观 |","","C也很容易迷惑，因为第三段确实多次出现`journalism`，文章整体也带有惋惜的语气。","","但`journalism`在第三段主要出现在Shaw和Newman怎样看待新闻写作的讨论中，它是用来证明过去评论家的职业态度和能力，不等于全文在讨论整个新闻业。","","如果C成立，文章应该进一步写新闻报道、公信力、记者职业、报业经营等整个行业的问题。实际文章从头到尾都把范围限制在`arts coverage`、`arts criticism`、`newspaper reviews`和`music criticism`。","","所以C把一个局部职业背景扩大成全文对象。文章悲哀的不是“新闻业全面衰退”，而是新闻业内部一种严肃艺术评论传统的消失。","","**判断：C不保留。**","","---"],"section":"第三鸟 · 题目复盘","raw":"> 新闻业令人悲哀的衰退\n\n#### 如果 C 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是“新闻业令人悲哀的衰退”，五段大概需要这样展开：\n\n| 段落 | 如果这个选项正确，这段应该写什么 |\n| --- | --- |\n| 第1段 | 先说整个新闻业都在衰退 |\n| 第2段 | 回顾过去新闻业整体繁荣 |\n| 第3段 | 证明新闻采编、报道、公信力等全面更好 |\n| 第4段 | 用记者或报业事件说明整个行业衰落 |\n| 第5段 | 总结新闻业整体前景悲观 |\n\nC也很容易迷惑，因为第三段确实多次出现`journalism`，文章整体也带有惋惜的语气。\n\n但`journalism`在第三段主要出现在Shaw和Newman怎样看待新闻写作的讨论中，它是用来证明过去评论家的职业态度和能力，不等于全文在讨论整个新闻业。\n\n如果C成立，文章应该再写新闻报道、公信力、记者职业、报业经营等整个行业的问题。实际文章从头到尾都把范围限制在`arts coverage`、`arts criticism`、`newspaper reviews`和`music criticism`。\n\nC把局部职业背景扩大成了全文对象。文章感叹的是新闻业内部一种严肃艺术评论传统的消失，并没有讨论整个新闻业全面衰退。\n\n**判断：C不保留。**\n\n---","html":"<blockquote>\n<p>新闻业令人悲哀的衰退</p>\n</blockquote>\n<h4>如果 C 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“新闻业令人悲哀的衰退”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先说整个新闻业都在衰退</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>回顾过去新闻业整体繁荣</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>证明新闻采编、报道、公信力等全面更好</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用记者或报业事件说明整个行业衰落</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>总结新闻业整体前景悲观</td>\n</tr>\n</tbody>\n</table></div>\n<p>C也很容易迷惑，因为第三段确实多次出现<code>journalism</code>，文章整体也带有惋惜的语气。</p>\n<p>但<code>journalism</code>在第三段主要出现在Shaw和Newman怎样看待新闻写作的讨论中，它是用来证明过去评论家的职业态度和能力，不等于全文在讨论整个新闻业。</p>\n<p>如果C成立，文章应该再写新闻报道、公信力、记者职业、报业经营等整个行业的问题。实际文章从头到尾都把范围限制在<code>arts coverage</code>、<code>arts criticism</code>、<code>newspaper reviews</code>和<code>music criticism</code>。</p>\n<p>C把局部职业背景扩大成了全文对象。文章感叹的是新闻业内部一种严肃艺术评论传统的消失，并没有讨论整个新闻业全面衰退。</p>\n<p><strong>判断：C不保留。</strong></p>\n<hr />\n","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-C-1","meta":{"kind":"method","question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true}},{"title":"D. Prominent Critics in Memory","level":3,"lines":["### D. Prominent Critics in Memory","","> 记忆中的著名评论家"],"section":"第三鸟 · 题目复盘","raw":"> 记忆中的著名评论家","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-D-0\"><blockquote>\n<p>记忆中的著名评论家</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-D-0","meta":{"kind":"option","question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false}},{"title":"D. Prominent Critics in Memory","level":4,"lines":["#### 如果 D 是主旨，文章五段应该怎么写？","","如果全文主旨真的是“记忆中的著名评论家”，五段大概需要这样展开：","","| 段落 | 如果该选项正确，这段应该写什么 |","| --- | --- |","| 第1段 | 先介绍一批值得纪念的评论家 |","| 第2段 | 分别回顾他们的生平和主要成就 |","| 第3段 | 继续补充他们的代表作品和影响 |","| 第4段 | 集中写Cardus等人物如何被后人铭记 |","| 第5段 | 总结这些评论家应当被永远记住 |","","D抓住了Shaw、Newman和Cardus这些人物，所以看起来像是一个人物回忆类标题。","","但人物在本文里不是独立中心。Shaw和Newman用来说明过去评论家有能力、重视新闻写作；Cardus则用来说明一个曾经风光的评论家后来怎样被遗忘。人物都在为“艺术评论传统由盛转衰”服务。","","更直接的是，第4段开头写：","","> Unfortunately, these critics are virtually forgotten.","> 遗憾的是，这些评论家几乎被遗忘了。","","D中的`in Memory`暗示这些评论家仍然被人记住，实际文章却强调他们已经退出公众记忆。它不仅把论据当成主旨，连人物现在的状态也说反了。","","**判断：D不保留。**","","---"],"section":"第三鸟 · 题目复盘","raw":"> 记忆中的著名评论家\n\n#### 如果 D 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是“记忆中的著名评论家”，五段大概需要这样展开：\n\n| 段落 | 如果这个选项正确，这段应该写什么 |\n| --- | --- |\n| 第1段 | 先介绍一批值得纪念的评论家 |\n| 第2段 | 分别回顾他们的生平和主要成就 |\n| 第3段 | 继续补充他们的代表作品和影响 |\n| 第4段 | 集中写Cardus等人物如何被后人铭记 |\n| 第5段 | 总结这些评论家应当被永远记住 |\n\nD抓住了Shaw、Newman和Cardus这些人物，所以看起来像是一个人物回忆类标题。\n\n这些人物都在为全文主线服务。Shaw和Newman说明过去的评论家有能力、重视新闻写作；Cardus则说明一个曾经风光的评论家后来怎样被遗忘。中心仍是艺术评论传统由盛转衰。\n\n更直接的是，第4段开头写：\n\n> Unfortunately, these critics are virtually forgotten.\n> 遗憾的是，这些评论家几乎被遗忘了。\n\nD中的`in Memory`暗示这些评论家仍然被人记住，实际文章却强调他们已经退出公众记忆。它不仅把论据当成主旨，连人物现在的状态也说反了。\n\n**判断：D不保留。**\n\n---","html":"<blockquote>\n<p>记忆中的著名评论家</p>\n</blockquote>\n<h4>如果 D 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“记忆中的著名评论家”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先介绍一批值得纪念的评论家</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>分别回顾他们的生平和主要成就</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>继续补充他们的代表作品和影响</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>集中写Cardus等人物如何被后人铭记</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>总结这些评论家应当被永远记住</td>\n</tr>\n</tbody>\n</table></div>\n<p>D抓住了Shaw、Newman和Cardus这些人物，所以看起来像是一个人物回忆类标题。</p>\n<p>这些人物都在为全文主线服务。Shaw和Newman说明过去的评论家有能力、重视新闻写作；Cardus则说明一个曾经风光的评论家后来怎样被遗忘。中心仍是艺术评论传统由盛转衰。</p>\n<p>更直接的是，第4段开头写：</p>\n<blockquote>\n<p>Unfortunately, these critics are virtually forgotten.\n遗憾的是，这些评论家几乎被遗忘了。</p>\n</blockquote>\n<p>D中的<code>in Memory</code>暗示这些评论家仍然被人记住，实际文章却强调他们已经退出公众记忆。它不仅把论据当成主旨，连人物现在的状态也说反了。</p>\n<p><strong>判断：D不保留。</strong></p>\n<hr />\n","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"focusId":"focus-q25-D-1","meta":{"kind":"method","question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true}},{"title":"25题结论","level":3,"lines":["**25. B. The Lost Horizon in Newspapers.**","","这道题的四个标题分别暴露了四种主旨题常见偏差：","","- A抓住“过去更好”，但把具体的艺术评论扩大成旧报纸整体；","- B能够解释五段从现状、过去、人物到复兴无望的完整推进；","- C抓住`journalism`这个熟词，却把艺术评论传统扩大成整个新闻业；","- D抓住人物细节，却把用来举证的人物误当成全文中心。","","这道题确定的全文主旨是：","","> 英文报纸中曾经繁荣、严肃、有分量的艺术评论传统正在从公众视野中消失，而且复兴希望渺茫。","","后面分析21—24题时，这就是全文主旨底牌。"],"section":"第三鸟 · 题目复盘","raw":"**25. B. The Lost Horizon in Newspapers.**\n\n四个标题分别怎么错：\n\n- A抓住“过去更好”，但把具体的艺术评论扩大成旧报纸整体；\n- B能把五段从现状、过去、人物到复兴无望的顺序全部包住；\n- C抓住`journalism`这个熟词，却把艺术评论传统扩大成整个新闻业；\n- D抓住人物细节，却把用来举证的人物误当成全文中心。\n\n这道题确定的全文主旨是：\n\n> 英文报纸中曾经繁荣、严肃、有分量的艺术评论传统正在从公众视野中消失，而且复兴希望渺茫。\n\n后面分析21—24题时，这就是全文主旨底牌。","html":"<p><strong>25. B. The Lost Horizon in Newspapers.</strong></p>\n<p>四个标题分别怎么错：</p>\n<ul>\n<li>A抓住“过去更好”，但把具体的艺术评论扩大成旧报纸整体；</li>\n<li>B能把五段从现状、过去、人物到复兴无望的顺序全部包住；</li>\n<li>C抓住<code>journalism</code>这个熟词，却把艺术评论传统扩大成整个新闻业；</li>\n<li>D抓住人物细节，却把用来举证的人物误当成全文中心。</li>\n</ul>\n<p>这道题确定的全文主旨是：</p>\n<blockquote>\n<p>英文报纸中曾经繁荣、严肃、有分量的艺术评论传统正在从公众视野中消失，而且复兴希望渺茫。</p>\n</blockquote>\n<p>后面分析21—24题时，这就是全文主旨底牌。</p>\n","context":{"mode":"image","asset":"questions","label":"25题","focus":[0,1190,1240,370],"sourceW":1240,"sourceH":1636},"meta":{"kind":"conclusion","question":"25","option":null,"questionConclusion":true}},{"title":"21题 · 题干与核心出处","level":2,"lines":["## 21题","","> It is indicated in Paragraphs 1 and 2 that ______.  ","> 第1、2段说明了什么？","","### 核心出处","","> Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.",">","> It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.","","第1段给的是现在的变化：艺术报道在范围和严肃性上持续下降。","","第2段回看过去：高质量艺术评论曾经普遍出现在大城市报纸上，许多重要评论文集也大量来自报纸评论。","","因此，这道题要看的就是：哪个选项把两段共同写出的今昔变化接对了。"],"section":"第三鸟 · 题目复盘","raw":"## 21题\n\n> It is indicated in Paragraphs 1 and 2 that ______.  \n> 第1、2段说明了什么？\n\n### 核心出处\n\n> Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.\n>\n> It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.\n\n第1段给的是现在的变化：艺术报道在范围和严肃性上持续下降。\n\n第2段回看过去：高质量艺术评论曾经普遍出现在大城市报纸上，许多重要评论文集也大量来自报纸评论。\n\n因此，这道题要看的就是：哪个选项把两段共同写出的今昔变化接对了。","html":"<blockquote>\n<p>It is indicated in Paragraphs 1 and 2 that ______.<br />\n第1、2段说明了什么？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p>\n<p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote>\n<p>第1段给的是现在的变化：艺术报道在范围和严肃性上持续下降。</p>\n<p>第2段回看过去：高质量艺术评论曾经普遍出现在大城市报纸上，许多重要评论文集也大量来自报纸评论。</p>\n<p>因此，这道题要看的就是：哪个选项把两段共同写出的今昔变化接对了。</p>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"meta":{"kind":"question","question":"21","option":null,"questionIntro":true}},{"title":"A. arts criticism has disappeared from big-city newspapers","level":3,"lines":["### A. arts criticism has disappeared from big-city newspapers","","> 艺术评论已经从大城市报纸中消失","","**做题模式中的状态：**当时已经能看懂`decline`和`disappeared`，因此根据程度差异直接排除A。","","**错误类型：第一类——歪曲原意。**","","A不是完全没有出处。它拿走了原文中的`arts criticism`、`big-city newspapers`以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。","","**命题人借用的原文材料：**","","> the inexorable decline in the scope and seriousness of their arts coverage",">","> high-quality arts criticism could be found in most big-city newspapers"],"section":"第三鸟 · 题目复盘","raw":"### A. arts criticism has disappeared from big-city newspapers\n\n> 艺术评论已经从大城市报纸中消失\n\n**做题模式中的状态：**当时已经能看懂`decline`和`disappeared`，因此根据程度差异直接排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nA也不是凭空来的。它用了原文中的`arts criticism`、`big-city newspapers`以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。\n\n**命题人借用的原文材料：**\n\n> the inexorable decline in the scope and seriousness of their arts coverage\n>\n> high-quality arts criticism could be found in most big-city newspapers","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>decline</code>和<code>disappeared</code>，因此根据程度差异直接排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A也不是凭空来的。它用了原文中的<code>arts criticism</code>、<code>big-city newspapers</code>以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-A-0","meta":{"kind":"option","question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false}},{"title":"A. arts criticism has disappeared from big-city newspapers","level":4,"lines":["#### 定位比对法","","把A接到题干后面，整句话是在说：","","> 第1、2段表明，艺术评论已经从大城市报纸中彻底消失。","","A中最关键的不是`arts criticism`或`big-city newspapers`，因为这两个对象在原文里确实都出现了。真正决定选项对错的是`disappeared`。","","第1段的原词是：","","> decline","> 衰退、下降","","而且作者还专门限定了下降的两个方面：","","> in the scope and seriousness","> 在范围和严肃性上","","这说明作者说的是数量、覆盖范围和认真程度都在变弱，并没有说所有艺术评论已经归零。","","第2段也只是在让今天的读者回想过去的繁荣。它说过去多数大城市报纸都能看到高质量艺术评论，却没有补一句“今天所有大城市报纸都完全不再刊登艺术评论”。","","所以A保留了原文对象，却把变化程度从“衰退”推到了“消失”。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第1、2段表明，艺术评论已经从大城市报纸中彻底消失。\n\nA里的`arts criticism`和`big-city newspapers`本身都能在原文中找到，问题不在这两个对象上。真正需要比较的是`disappeared`。\n\n第1段的原词是：\n\n> decline\n> 衰退、下降\n\n而且作者还专门限定了下降的两个方面：\n\n> in the scope and seriousness\n> 在范围和严肃性上\n\n也就是说，作者写的是数量、覆盖范围和认真程度都在变弱，并没有说艺术评论已经一篇不剩。\n\n第2段也只是在让今天的读者回想过去的繁荣。它说过去多数大城市报纸都能看到高质量艺术评论，却没有补一句“今天所有大城市报纸都完全不再刊登艺术评论”。\n\nA保留了原文中的对象，变化程度却从“衰退”被推成了“消失”。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>decline</code>和<code>disappeared</code>，因此根据程度差异直接排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A也不是凭空来的。它用了原文中的<code>arts criticism</code>、<code>big-city newspapers</code>以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，艺术评论已经从大城市报纸中彻底消失。</p>\n</blockquote>\n<p>A里的<code>arts criticism</code>和<code>big-city newspapers</code>本身都能在原文中找到，问题不在这两个对象上。真正需要比较的是<code>disappeared</code>。</p>\n<p>第1段的原词是：</p>\n<blockquote>\n<p>decline\n衰退、下降</p>\n</blockquote>\n<p>而且作者还专门限定了下降的两个方面：</p>\n<blockquote>\n<p>in the scope and seriousness\n在范围和严肃性上</p>\n</blockquote>\n<p>也就是说，作者写的是数量、覆盖范围和认真程度都在变弱，并没有说艺术评论已经一篇不剩。</p>\n<p>第2段也只是在让今天的读者回想过去的繁荣。它说过去多数大城市报纸都能看到高质量艺术评论，却没有补一句“今天所有大城市报纸都完全不再刊登艺术评论”。</p>\n<p>A保留了原文中的对象，变化程度却从“衰退”被推成了“消失”。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-A-1","meta":{"kind":"method","question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false}},{"title":"A. arts criticism has disappeared from big-city newspapers","level":4,"lines":["#### 写作视角法","","第1、2段实际这样写：","","> the inexorable decline in the scope and seriousness of their arts coverage",">","> high-quality arts criticism could be found in most big-city newspapers",">","> 艺术报道在范围和严肃性上持续衰退；过去多数大城市报纸都能读到高质量艺术评论。","","实际写法是在用“现在衰退”和“过去普遍存在”制造今昔反差，变化程度仍然是`decline`。","","如果A成立，文章至少应该改成：","","> Today, arts criticism can no longer be found in big-city newspapers, and no such reviews remain in the daily press.",">","> 如今，大城市报纸已经完全找不到艺术评论，日报中也不再保留任何此类评论。","","实际文章写的是逐渐衰退，A要求的却是彻底消失，两条写作路线在程度上不同。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> the inexorable decline in the scope and seriousness of their arts coverage\n>\n> high-quality arts criticism could be found in most big-city newspapers\n>\n> 艺术报道在范围和严肃性上持续衰退；过去多数大城市报纸都能读到高质量艺术评论。\n\n文章先写现在正在衰退，再回头写过去曾经普遍存在，今昔反差已经出来了，但用的仍然是`decline`这个程度。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Today, arts criticism can no longer be found in big-city newspapers, and no such reviews remain in the daily press.\n>\n> 如今，大城市报纸已经完全找不到艺术评论，日报中也不再保留任何此类评论。\n\n原文写的是逐渐衰退，A说的却是彻底消失。两边一对照，程度明显对不上。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>decline</code>和<code>disappeared</code>，因此根据程度差异直接排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A也不是凭空来的。它用了原文中的<code>arts criticism</code>、<code>big-city newspapers</code>以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，艺术评论已经从大城市报纸中彻底消失。</p>\n</blockquote>\n<p>A里的<code>arts criticism</code>和<code>big-city newspapers</code>本身都能在原文中找到，问题不在这两个对象上。真正需要比较的是<code>disappeared</code>。</p>\n<p>第1段的原词是：</p>\n<blockquote>\n<p>decline\n衰退、下降</p>\n</blockquote>\n<p>而且作者还专门限定了下降的两个方面：</p>\n<blockquote>\n<p>in the scope and seriousness\n在范围和严肃性上</p>\n</blockquote>\n<p>也就是说，作者写的是数量、覆盖范围和认真程度都在变弱，并没有说艺术评论已经一篇不剩。</p>\n<p>第2段也只是在让今天的读者回想过去的繁荣。它说过去多数大城市报纸都能看到高质量艺术评论，却没有补一句“今天所有大城市报纸都完全不再刊登艺术评论”。</p>\n<p>A保留了原文中的对象，变化程度却从“衰退”被推成了“消失”。</p></section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>艺术报道在范围和严肃性上持续衰退；过去多数大城市报纸都能读到高质量艺术评论。</p>\n</blockquote>\n<p>文章先写现在正在衰退，再回头写过去曾经普遍存在，今昔反差已经出来了，但用的仍然是<code>decline</code>这个程度。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Today, arts criticism can no longer be found in big-city newspapers, and no such reviews remain in the daily press.</p>\n<p>如今，大城市报纸已经完全找不到艺术评论，日报中也不再保留任何此类评论。</p>\n</blockquote>\n<p>原文写的是逐渐衰退，A说的却是彻底消失。两边一对照，程度明显对不上。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-A-2","meta":{"kind":"method","question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false}},{"title":"A. arts criticism has disappeared from big-city newspapers","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入21题题干：","","> 既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。","","但A实际说的是：","","> arts criticism has disappeared from big-city newspapers  ","> 艺术评论已经从大城市报纸中消失","","主旨写的是一种由盛转衰、逐渐离开公众视野的过程。A却把这个过程直接推到了终点，写成大城市报纸里已经彻底没有艺术评论。","","所以，A抓住了同一个对象，也抓住了下降的方向，但它把程度说重了。它和主旨代入题干后得到的答案并不一致。","","**复盘判断：A错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入21题题干：\n\n> 既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。\n\n但A实际说的是：\n\n> arts criticism has disappeared from big-city newspapers  \n> 艺术评论已经从大城市报纸中消失\n\n主旨写的是一种由盛转衰、逐渐离开公众视野的过程。A却把这个过程直接推到了终点，写成大城市报纸里已经彻底没有艺术评论。\n\n所以，A抓住了同一个对象，也抓住了下降的方向，但它把程度说重了。它和主旨代入题干后得到的答案并不一致。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>decline</code>和<code>disappeared</code>，因此根据程度差异直接排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A也不是凭空来的。它用了原文中的<code>arts criticism</code>、<code>big-city newspapers</code>以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，艺术评论已经从大城市报纸中彻底消失。</p>\n</blockquote>\n<p>A里的<code>arts criticism</code>和<code>big-city newspapers</code>本身都能在原文中找到，问题不在这两个对象上。真正需要比较的是<code>disappeared</code>。</p>\n<p>第1段的原词是：</p>\n<blockquote>\n<p>decline\n衰退、下降</p>\n</blockquote>\n<p>而且作者还专门限定了下降的两个方面：</p>\n<blockquote>\n<p>in the scope and seriousness\n在范围和严肃性上</p>\n</blockquote>\n<p>也就是说，作者写的是数量、覆盖范围和认真程度都在变弱，并没有说艺术评论已经一篇不剩。</p>\n<p>第2段也只是在让今天的读者回想过去的繁荣。它说过去多数大城市报纸都能看到高质量艺术评论，却没有补一句“今天所有大城市报纸都完全不再刊登艺术评论”。</p>\n<p>A保留了原文中的对象，变化程度却从“衰退”被推成了“消失”。</p></section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>艺术报道在范围和严肃性上持续衰退；过去多数大城市报纸都能读到高质量艺术评论。</p>\n</blockquote>\n<p>文章先写现在正在衰退，再回头写过去曾经普遍存在，今昔反差已经出来了，但用的仍然是<code>decline</code>这个程度。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Today, arts criticism can no longer be found in big-city newspapers, and no such reviews remain in the daily press.</p>\n<p>如今，大城市报纸已经完全找不到艺术评论，日报中也不再保留任何此类评论。</p>\n</blockquote>\n<p>原文写的是逐渐衰退，A说的却是彻底消失。两边一对照，程度明显对不上。</p></section><section class=\"revealPart\" id=\"focus-q21-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>arts criticism has disappeared from big-city newspapers<br />\n艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p>主旨写的是一种由盛转衰、逐渐离开公众视野的过程。A却把这个过程直接推到了终点，写成大城市报纸里已经彻底没有艺术评论。</p>\n<p>所以，A抓住了同一个对象，也抓住了下降的方向，但它把程度说重了。它和主旨代入题干后得到的答案并不一致。</p>\n<p><strong>复盘判断：A错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-A-3","meta":{"kind":"method","question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true}},{"title":"B. English-language newspapers used to carry more arts reviews","level":3,"lines":["### B. English-language newspapers used to carry more arts reviews","","> 英文报纸过去刊登的艺术评论更多","","**做题模式中的状态：**第一轮已经把B保留下来；第1段的下降和第2段的过去常见能够直接接起来，后来再用全文主旨确认。","","**选项类型：正确的跨段概括与同义改写。**","","B没有照抄任何一句原文，而是把第1段“现在下降”和第2段“过去普遍存在”合成了一个今昔比较。","","**出处：**","","> the inexorable decline in the scope and seriousness of their arts coverage",">","> high-quality arts criticism could be found in most big-city newspapers",">","> a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews"],"section":"第三鸟 · 题目复盘","raw":"### B. English-language newspapers used to carry more arts reviews\n\n> 英文报纸过去刊登的艺术评论更多\n\n**做题模式中的状态：**第一轮已经把B保留下来；第1段的下降和第2段的过去常见能够直接接起来，后来再用全文主旨确认。\n\n**选项类型：正确的跨段概括与同义改写。**\n\nB没有直接照抄原句，它把第1段“现在下降”和第2段“过去普遍存在”合成了一个今昔比较。\n\n**出处：**\n\n> the inexorable decline in the scope and seriousness of their arts coverage\n>\n> high-quality arts criticism could be found in most big-city newspapers\n>\n> a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>英文报纸过去刊登的艺术评论更多</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮已经把B保留下来；第1段的下降和第2段的过去常见能够直接接起来，后来再用全文主旨确认。</p>\n<p><strong>选项类型：正确的跨段概括与同义改写。</strong></p>\n<p>B没有直接照抄原句，它把第1段“现在下降”和第2段“过去普遍存在”合成了一个今昔比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-B-0","meta":{"kind":"option","question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false}},{"title":"B. English-language newspapers used to carry more arts reviews","level":4,"lines":["#### 定位比对法","","把B接到题干后面，整句话是在说：","","> 第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。","","这个选项需要跨两段才能拼完整，所以要逐块看：","","- `English-language newspapers`直接对应第1段的`English-language newspapers`；","- `used to`对应第2段不断回看的过去时代；","- `arts reviews`对应第1段的`arts coverage`以及第2段的`arts criticism`、`newspaper reviews`；","- `more`不是某一个单词的机械替换，而是由“现在出现下降”与“过去多数大城市报纸普遍有高质量评论”共同推出。","","现在出现`decline`，这个下降必须有一个比较基准；第2段恰好把过去的状态补出来。因此，“过去更多”并不是凭空总结，而是两段共同建立的今昔关系。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。\n\n这个选项要把两段的信息接起来，逐块看就清楚了：\n\n- `English-language newspapers`直接对应第1段的`English-language newspapers`；\n- `used to`对应第2段不断回看的过去时代；\n- `arts reviews`对应第1段的`arts coverage`以及第2段的`arts criticism`、`newspaper reviews`；\n- `more`不是原文某个单词的直接替换，它来自两段共同给出的信息：“现在正在下降”，而“过去多数大城市报纸普遍有高质量评论”。\n\n既然现在出现了`decline`，就一定是在和过去比较；第2段正好把过去的情况补出来。这样一来，“过去更多”并不是凭空总结，而是两段合在一起得出的今昔关系。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>英文报纸过去刊登的艺术评论更多</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮已经把B保留下来；第1段的下降和第2段的过去常见能够直接接起来，后来再用全文主旨确认。</p>\n<p><strong>选项类型：正确的跨段概括与同义改写。</strong></p>\n<p>B没有直接照抄原句，它把第1段“现在下降”和第2段“过去普遍存在”合成了一个今昔比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>这个选项要把两段的信息接起来，逐块看就清楚了：</p>\n<ul>\n<li><code>English-language newspapers</code>直接对应第1段的<code>English-language newspapers</code>；</li>\n<li><code>used to</code>对应第2段不断回看的过去时代；</li>\n<li><code>arts reviews</code>对应第1段的<code>arts coverage</code>以及第2段的<code>arts criticism</code>、<code>newspaper reviews</code>；</li>\n<li><code>more</code>不是原文某个单词的直接替换，它来自两段共同给出的信息：“现在正在下降”，而“过去多数大城市报纸普遍有高质量评论”。</li>\n</ul>\n<p>既然现在出现了<code>decline</code>，就一定是在和过去比较；第2段正好把过去的情况补出来。这样一来，“过去更多”并不是凭空总结，而是两段合在一起得出的今昔关系。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-B-1","meta":{"kind":"method","question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false}},{"title":"B. English-language newspapers used to carry more arts reviews","level":4,"lines":["#### 写作视角法","","第1、2段实际这样写：","","> the inexorable decline in the scope and seriousness of their arts coverage",">","> high-quality arts criticism could be found in most big-city newspapers",">","> 艺术报道现在持续衰退，而过去多数大城市报纸都能看到高质量艺术评论。","","实际写法先交代现在变少，再回看过去有多常见，正是在建立“过去比现在更多”的今昔关系。","","如果B成立，文章应该沿着这条路线写：","","> English-language newspapers once carried more substantial arts reviews than they do today.",">","> 英文报纸过去刊登的艺术评论比今天更多，也更有分量。","","实际第1、2段正是这样展开，所以B与文章的写作路线一致。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> the inexorable decline in the scope and seriousness of their arts coverage\n>\n> high-quality arts criticism could be found in most big-city newspapers\n>\n> 艺术报道现在持续衰退，而过去多数大城市报纸都能看到高质量艺术评论。\n\n文章先说现在变少，再回头写过去有多常见，前后接起来就是“过去比现在更多”。\n\n如果B真是作者的意思，文章就应该顺着这条线往下写：\n\n> English-language newspapers once carried more substantial arts reviews than they do today.\n>\n> 英文报纸过去刊登的艺术评论比今天更多，也更有分量。\n\n第1、2段就是这样往下写的，B与原文的展开方式一致。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>英文报纸过去刊登的艺术评论更多</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮已经把B保留下来；第1段的下降和第2段的过去常见能够直接接起来，后来再用全文主旨确认。</p>\n<p><strong>选项类型：正确的跨段概括与同义改写。</strong></p>\n<p>B没有直接照抄原句，它把第1段“现在下降”和第2段“过去普遍存在”合成了一个今昔比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>这个选项要把两段的信息接起来，逐块看就清楚了：</p>\n<ul>\n<li><code>English-language newspapers</code>直接对应第1段的<code>English-language newspapers</code>；</li>\n<li><code>used to</code>对应第2段不断回看的过去时代；</li>\n<li><code>arts reviews</code>对应第1段的<code>arts coverage</code>以及第2段的<code>arts criticism</code>、<code>newspaper reviews</code>；</li>\n<li><code>more</code>不是原文某个单词的直接替换，它来自两段共同给出的信息：“现在正在下降”，而“过去多数大城市报纸普遍有高质量评论”。</li>\n</ul>\n<p>既然现在出现了<code>decline</code>，就一定是在和过去比较；第2段正好把过去的情况补出来。这样一来，“过去更多”并不是凭空总结，而是两段合在一起得出的今昔关系。</p></section><section class=\"revealPart\" id=\"focus-q21-B-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>艺术报道现在持续衰退，而过去多数大城市报纸都能看到高质量艺术评论。</p>\n</blockquote>\n<p>文章先说现在变少，再回头写过去有多常见，前后接起来就是“过去比现在更多”。</p>\n<p>如果B真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>English-language newspapers once carried more substantial arts reviews than they do today.</p>\n<p>英文报纸过去刊登的艺术评论比今天更多，也更有分量。</p>\n</blockquote>\n<p>第1、2段就是这样往下写的，B与原文的展开方式一致。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-B-2","meta":{"kind":"method","question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false}} ge</code>以及第2段的<code>arts criticism</code>、<code>newspaper reviews</code>；</li>\n<li><code>more</code>不是原文某个单词的直接替换，它来自两段共同给出的信息：“现在正在下降”，而“过去多数大城市报纸普遍有高质量评论”。</li>\n</ul>\n<p>既然现在出现了<code>decline</code>，就一定是在和过去比较；第2段正好把过去的情况补出来。这样一来，“过去更多”并不是凭空总结，而是两段合在一起得出的今昔关系。</p></section><section class=\"revealPart\" id=\"focus-q21-B-2\"><h3>写作视角法</h3><p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>艺术报道现在持续衰退，而过去多数大城市报纸都能看到高质量艺术评论。</p>\n</blockquote>\n<p>文章先说现在变少，再回头写过去有多常见，前后接起来就是“过去比现在更多”。</p>\n<p>如果B真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>English-language newspapers once carried more substantial arts reviews than they do today.</p>\n<p>英文报纸过去刊登的艺术评论比今天更多，也更有分量。</p>\n</blockquote>\n<p>第1、2段就是这样往下写的，B与原文的展开方式一致。</p></section><section class=\"revealPart\" id=\"focus-q21-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>B实际说的是：</p>\n<blockquote>\n<p>English-language newspapers used to carry more arts reviews<br />\n英文报纸过去刊登的艺术评论更多</p>\n</blockquote>\n<p>B正好把全文的今昔变化接回了题干。第1段写现在持续下降，第2段写过去大城市报纸中普遍有高质量艺术评论，两段放在一起，就是“过去比现在更多”。</p>\n<p>B没有把范围扩大到整个新闻业，也没有把“衰退”说成“彻底消失”。它与主旨代入题干后得到的答案一致。</p>\n<p><strong>复盘判断：B正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-B-3","meta":{"kind":"method","question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":true}},{"title":"C. high-quality newspapers retain a large body of readers","level":3,"lines":["### C. high-quality newspapers retain a large body of readers","","> 高质量报纸仍然拥有大量读者","","**做题模式中的状态：**当时已经看出`high-quality`的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。","","**错误类型：第一类——歪曲原意。**","","C把原文中分散出现的`high-quality`、`newspapers`和`reader`重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。","","**命题人借用的原文材料：**","","> high-quality arts criticism could be found in most big-city newspapers",">","> for the average reader under the age of forty"],"section":"第三鸟 · 题目复盘","raw":"### C. high-quality newspapers retain a large body of readers\n\n> 高质量报纸仍然拥有大量读者\n\n**做题模式中的状态：**当时已经看出`high-quality`的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC把原文里分散出现的`high-quality`、`newspapers`和`reader`重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。\n\n**命题人借用的原文材料：**\n\n> high-quality arts criticism could be found in most big-city newspapers\n>\n> for the average reader under the age of forty","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出<code>high-quality</code>的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把原文里分散出现的<code>high-quality</code>、<code>newspapers</code>和<code>reader</code>重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>for the average reader under the age of forty</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-C-0","meta":{"kind":"option","question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false}},{"title":"C. high-quality newspapers retain a large body of readers","level":4,"lines":["#### 定位比对法","","把C接到题干后面，整句话是在说：","","> 第1、2段表明，高质量报纸仍然拥有大量读者。","","先看`high-quality newspapers`。原文真正的词组是：","","> high-quality arts criticism","> 高质量的艺术评论","","`high-quality`修饰的是`arts criticism`，不是`newspapers`。C把修饰语从“艺术评论”前面挪到了“报纸”前面，先制造出一个原文没有的对象——“高质量报纸”。","","再看`a large body of readers`。原文只有：","","> the average reader under the age of forty","> 四十岁以下的普通读者","","这句话只是说明年轻读者难以想象过去的报纸环境，没有统计读者数量，也没有说报纸`retain`了多少读者。","","所以C不是一句原文被简单改写，而是把三个熟词重新拼装成了“高质量报纸仍拥有大量读者”这个新命题。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第1、2段表明，高质量报纸仍然拥有大量读者。\n\n先看`high-quality newspapers`。原文里的完整词组其实是：\n\n> high-quality arts criticism\n> 高质量的艺术评论\n\n`high-quality`修饰的是`arts criticism`，不是`newspapers`。C把`high-quality`从“艺术评论”前面挪到了“报纸”前面，于是原文里没有的“高质量报纸”被拼了出来。\n\n再看`a large body of readers`。原文只有：\n\n> the average reader under the age of forty\n> 四十岁以下的普通读者\n\n这句话只是说明年轻读者难以想象过去的报纸环境，没有统计读者数量，也没有说报纸`retain`了多少读者。\n\n所以C并不是把某句原文换了个说法，而是把三个熟词重新拼成了“高质量报纸仍拥有大量读者”这个新意思。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出<code>high-quality</code>的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把原文里分散出现的<code>high-quality</code>、<code>newspapers</code>和<code>reader</code>重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>for the average reader under the age of forty</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，高质量报纸仍然拥有大量读者。</p>\n</blockquote>\n<p>先看<code>high-quality newspapers</code>。原文里的完整词组其实是：</p>\n<blockquote>\n<p>high-quality arts criticism\n高质量的艺术评论</p>\n</blockquote>\n<p><code>high-quality</code>修饰的是<code>arts criticism</code>，不是<code>newspapers</code>。C把<code>high-quality</code>从“艺术评论”前面挪到了“报纸”前面，于是原文里没有的“高质量报纸”被拼了出来。</p>\n<p>再看<code>a large body of readers</code>。原文只有：</p>\n<blockquote>\n<p>the average reader under the age of forty\n四十岁以下的普通读者</p>\n</blockquote>\n<p>这句话只是说明年轻读者难以想象过去的报纸环境，没有统计读者数量，也没有说报纸<code>retain</code>了多少读者。</p>\n<p>所以C并不是把某句原文换了个说法，而是把三个熟词重新拼成了“高质量报纸仍拥有大量读者”这个新意思。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-C-1","meta":{"kind":"method","question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false}},{"title":"C. high-quality newspapers retain a large body of readers","level":4,"lines":["#### 写作视角法","","第2段实际这样写：","","> To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.",">","> 今天读这些书，人们会惊叹这些博学内容当年竟被认为适合刊登在大众日报上。","","实际写法讨论的是评论内容与日报文化容量，没有转向报纸质量或读者数量。","","如果C成立，文章至少应该改成：","","> High-quality newspapers continue to retain a large readership, especially among readers who value serious arts criticism.",">","> 高质量报纸仍然保有大量读者，尤其受到重视严肃艺术评论的读者欢迎。","","实际文章没有沿“高质量报纸仍有大量读者”这条路线展开，所以C不能解释后文。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.\n>\n> 今天读这些书，人们会惊叹这些博学内容当年竟被认为适合刊登在大众日报上。\n\n原文谈的是评论内容以及当时日报能够容纳什么，并没有转去谈报纸质量或读者数量。\n\n如果C真是作者的意思，文章至少得写成：\n\n> High-quality newspapers continue to retain a large readership, especially among readers who value serious arts criticism.\n>\n> 高质量报纸仍然保有大量读者，尤其受到重视严肃艺术评论的读者欢迎。\n\n后文没有沿着“高质量报纸仍有大量读者”往下写，C自然解释不了这两段。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出<code>high-quality</code>的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把原文里分散出现的<code>high-quality</code>、<code>newspapers</code>和<code>reader</code>重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>for the average reader under the age of forty</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，高质量报纸仍然拥有大量读者。</p>\n</blockquote>\n<p>先看<code>high-quality newspapers</code>。原文里的完整词组其实是：</p>\n<blockquote>\n<p>high-quality arts criticism\n高质量的艺术评论</p>\n</blockquote>\n<p><code>high-quality</code>修饰的是<code>arts criticism</code>，不是<code>newspapers</code>。C把<code>high-quality</code>从“艺术评论”前面挪到了“报纸”前面，于是原文里没有的“高质量报纸”被拼了出来。</p>\n<p>再看<code>a large body of readers</code>。原文只有：</p>\n<blockquote>\n<p>the average reader under the age of forty\n四十岁以下的普通读者</p>\n</blockquote>\n<p>这句话只是说明年轻读者难以想象过去的报纸环境，没有统计读者数量，也没有说报纸<code>retain</code>了多少读者。</p>\n<p>所以C并不是把某句原文换了个说法，而是把三个熟词重新拼成了“高质量报纸仍拥有大量读者”这个新意思。</p></section><section class=\"revealPart\" id=\"focus-q21-C-2\"><h3>写作视角法</h3><p>原文第2段是这样写的：</p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n<p>今天读这些书，人们会惊叹这些博学内容当年竟被认为适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文谈的是评论内容以及当时日报能够容纳什么，并没有转去谈报纸质量或读者数量。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>High-quality newspapers continue to retain a large readership, especially among readers who value serious arts criticism.</p>\n<p>高质量报纸仍然保有大量读者，尤其受到重视严肃艺术评论的读者欢迎。</p>\n</blockquote>\n<p>后文没有沿着“高质量报纸仍有大量读者”往下写，C自然解释不了这两段。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-C-2","meta":{"kind":"method","question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false}},{"title":"C. high-quality newspapers retain a large body of readers","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入21题题干：","","> 既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。","","但C实际说的是：","","> high-quality newspapers retain a large body of readers  ","> 高质量报纸仍然拥有大量读者","","主旨关注的是报纸里艺术评论的多少、分量和公共影响，题干也在问第1、2段共同说明了什么。C却把讨论对象换成了报纸质量和读者数量。","","“过去艺术评论更多”和“高质量报纸仍有大量读者”不是同一件事。C借用了原文里的几个熟词，却没有接上全文真正讨论的主线。","","**复盘判断：C错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入21题题干：\n\n> 既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。\n\n但C实际说的是：\n\n> high-quality newspapers retain a large body of readers  \n> 高质量报纸仍然拥有大量读者\n\n主旨关注的是报纸里艺术评论的多少、分量和公共影响，题干也在问第1、2段共同说明了什么。C却把讨论对象换成了报纸质量和读者数量。\n\n“过去艺术评论更多”和“高质量报纸仍有大量读者”不是同一件事。C借用了原文里的几个熟词，却没有接上全文真正讨论的主线。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出<code>high-quality</code>的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把原文里分散出现的<code>high-quality</code>、<code>newspapers</code>和<code>reader</code>重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>for the average reader under the age of forty</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，高质量报纸仍然拥有大量读者。</p>\n</blockquote>\n<p>先看<code>high-quality newspapers</code>。原文里的完整词组其实是：</p>\n<blockquote>\n<p>high-quality arts criticism\n高质量的艺术评论</p>\n</blockquote>\n<p><code>high-quality</code>修饰的是<code>arts criticism</code>，不是<code>newspapers</code>。C把<code>high-quality</code>从“艺术评论”前面挪到了“报纸”前面，于是原文里没有的“高质量报纸”被拼了出来。</p>\n<p>再看<code>a large body of readers</code>。原文只有：</p>\n<blockquote>\n<p>the average reader under the age of forty\n四十岁以下的普通读者</p>\n</blockquote>\n<p>这句话只是说明年轻读者难以想象过去的报纸环境，没有统计读者数量，也没有说报纸<code>retain</code>了多少读者。</p>\n<p>所以C并不是把某句原文换了个说法，而是把三个熟词重新拼成了“高质量报纸仍拥有大量读者”这个新意思。</p></section><section class=\"revealPart\" id=\"focus-q21-C-2\"><h3>写作视角法</h3><p>原文第2段是这样写的：</p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n<p>今天读这些书，人们会惊叹这些博学内容当年竟被认为适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文谈的是评论内容以及当时日报能够容纳什么，并没有转去谈报纸质量或读者数量。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>High-quality newspapers continue to retain a large readership, especially among readers who value serious arts criticism.</p>\n<p>高质量报纸仍然保有大量读者，尤其受到重视严肃艺术评论的读者欢迎。</p>\n</blockquote>\n<p>后文没有沿着“高质量报纸仍有大量读者”往下写，C自然解释不了这两段。</p></section><section class=\"revealPart\" id=\"focus-q21-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>high-quality newspapers retain a large body of readers<br />\n高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p>主旨关注的是报纸里艺术评论的多少、分量和公共影响，题干也在问第1、2段共同说明了什么。C却把讨论对象换成了报纸质量和读者数量。</p>\n<p>“过去艺术评论更多”和“高质量报纸仍有大量读者”不是同一件事。C借用了原文里的几个熟词，却没有接上全文真正讨论的主线。</p>\n<p><strong>复盘判断：C错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-C-3","meta":{"kind":"method","question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true}},{"title":"D. young readers doubt the suitability of criticism on dailies","level":3,"lines":["### D. young readers doubt the suitability of criticism on dailies","","> 年轻读者怀疑评论是否适合刊登在日报上","","**做题模式中的状态：**当时`marvel`及与`suitability`相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。","","**错误类型：第一类——歪曲原意。**","","D借用了年轻读者、日报和“适合刊登”三个真实信息，却改变了反应主体、反应方向和原句时态。","","**出处：**","","> To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies."],"section":"第三鸟 · 题目复盘","raw":"### D. young readers doubt the suitability of criticism on dailies\n\n> 年轻读者怀疑评论是否适合刊登在日报上\n\n**做题模式中的状态：**当时`marvel`及与`suitability`相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。\n\n**错误类型：第一类——歪曲原意。**\n\nD确实用了年轻读者、日报和“适合刊登”这些原文信息，但反应的人、反应的方向和时间都被换了。\n\n**出处：**\n\n> To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>marvel</code>及与<code>suitability</code>相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D确实用了年轻读者、日报和“适合刊登”这些原文信息，但反应的人、反应的方向和时间都被换了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-D-0","meta":{"kind":"option","question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false}},{"title":"D. young readers doubt the suitability of criticism on dailies","level":4,"lines":["#### 定位比对法","","把D接到题干后面，整句话是在说：","","> 第1、2段表明，年轻读者怀疑这些评论是否适合刊登在日报上。","","原文先说四十岁以下的普通读者难以想象过去；随后又说今天读这些书会：","","> marvel at the fact","> 对这个事实感到惊叹","","D却把`marvel at`改成`doubt`。惊叹的意思是“没有想到过去的日报竟能容纳这种博学内容”，怀疑则是“认为这种内容可能不适合日报”，方向不同。","","再看`suitable`所在的结构：","","> their learned contents were once deemed suitable for publication","> 这些博学内容曾经被认为适合刊登","","这是过去出版环境对这些内容的判断。D却把“过去曾被认为适合”改成“今天的年轻读者在怀疑是否适合”，判断主体和时间也都变了。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第1、2段表明，年轻读者怀疑这些评论是否适合刊登在日报上。\n\n原文先说四十岁以下的普通读者难以想象过去；随后又说今天读这些书会：\n\n> marvel at the fact\n> 对这个事实感到惊叹\n\nD把`marvel at`换成了`doubt`。前者是“没想到过去的日报竟然能容纳这种博学内容”，后者却成了“觉得这种内容可能不适合日报”，意思正好拐了一个方向。\n\n再看`suitable`所在的结构：\n\n> their learned contents were once deemed suitable for publication\n> 这些博学内容曾经被认为适合刊登\n\n这句话说的是过去的出版环境怎样看待这些内容。D却改成今天的年轻读者在怀疑它是否适合，作出判断的人和时间都换了。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>marvel</code>及与<code>suitability</code>相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D确实用了年轻读者、日报和“适合刊登”这些原文信息，但反应的人、反应的方向和时间都被换了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，年轻读者怀疑这些评论是否适合刊登在日报上。</p>\n</blockquote>\n<p>原文先说四十岁以下的普通读者难以想象过去；随后又说今天读这些书会：</p>\n<blockquote>\n<p>marvel at the fact\n对这个事实感到惊叹</p>\n</blockquote>\n<p>D把<code>marvel at</code>换成了<code>doubt</code>。前者是“没想到过去的日报竟然能容纳这种博学内容”，后者却成了“觉得这种内容可能不适合日报”，意思正好拐了一个方向。</p>\n<p>再看<code>suitable</code>所在的结构：</p>\n<blockquote>\n<p>their learned contents were once deemed suitable for publication\n这些博学内容曾经被认为适合刊登</p>\n</blockquote>\n<p>这句话说的是过去的出版环境怎样看待这些内容。D却改成今天的年轻读者在怀疑它是否适合，作出判断的人和时间都换了。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-D-1","meta":{"kind":"method","question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false}},{"title":"D. young readers doubt the suitability of criticism on dailies","level":4,"lines":["#### 写作视角法","","第2段实际这样写：","","> To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.",">","> 今天读这些书，人们会惊叹这些博学内容当年竟适合刊登在大众日报上。","","实际写法是在赞叹过去日报能够容纳这类内容，不是在写年轻读者对此提出质疑。","","如果D成立，文章至少应该改成：","","> Young readers today doubt whether such learned criticism is suitable for publication in general-circulation dailies.",">","> 今天的年轻读者怀疑，这类博学评论是否适合刊登在大众日报上。","","实际文章写的是作者的惊叹，D要求的却是年轻读者的怀疑，态度主体和方向都不同。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.\n>\n> 今天读这些书，人们会惊叹这些博学内容当年竟适合刊登在大众日报上。\n\n原文是在赞叹过去的日报能够容纳这类内容，并没有写年轻读者在质疑它。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Young readers today doubt whether such learned criticism is suitable for publication in general-circulation dailies.\n>\n> 今天的年轻读者怀疑，这类博学评论是否适合刊登在大众日报上。\n\n原文写的是作者的惊叹，D却改成年轻读者的怀疑，作出反应的人和态度方向都不同。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>marvel</code>及与<code>suitability</code>相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D确实用了年轻读者、日报和“适合刊登”这些原文信息，但反应的人、反应的方向和时间都被换了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，年轻读者怀疑这些评论是否适合刊登在日报上。</p>\n</blockquote>\n<p>原文先说四十岁以下的普通读者难以想象过去；随后又说今天读这些书会：</p>\n<blockquote>\n<p>marvel at the fact\n对这个事实感到惊叹</p>\n</blockquote>\n<p>D把<code>marvel at</code>换成了<code>doubt</code>。前者是“没想到过去的日报竟然能容纳这种博学内容”，后者却成了“觉得这种内容可能不适合日报”，意思正好拐了一个方向。</p>\n<p>再看<code>suitable</code>所在的结构：</p>\n<blockquote>\n<p>their learned contents were once deemed suitable for publication\n这些博学内容曾经被认为适合刊登</p>\n</blockquote>\n<p>这句话说的是过去的出版环境怎样看待这些内容。D却改成今天的年轻读者在怀疑它是否适合，作出判断的人和时间都换了。</p></section><section class=\"revealPart\" id=\"focus-q21-D-2\"><h3>写作视角法</h3><p>原文第2段是这样写的：</p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n<p>今天读这些书，人们会惊叹这些博学内容当年竟适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文是在赞叹过去的日报能够容纳这类内容，并没有写年轻读者在质疑它。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Young readers today doubt whether such learned criticism is suitable for publication in general-circulation dailies.</p>\n<p>今天的年轻读者怀疑，这类博学评论是否适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文写的是作者的惊叹，D却改成年轻读者的怀疑，作出反应的人和态度方向都不同。</p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-D-2","meta":{"kind":"method","question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false}},{"title":"D. young readers doubt the suitability of criticism on dailies","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入21题题干：","","> 既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。","","但D实际说的是：","","> young readers doubt the suitability of criticism on dailies  ","> 年轻读者怀疑评论是否适合刊登在日报上","","全文写年轻读者难以想象过去的繁荣，是为了拉出今昔差距；他们读到旧评论集时感到惊讶，也是在说明当年的日报曾经能够容纳这种博学、严肃的评论。","","D把这种惊讶改成了怀疑，又把全文的今昔变化缩成了年轻读者的一种态度。它和主旨代入题干后得到的答案对不上。","","**复盘判断：D错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入21题题干：\n\n> 既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。\n\n但D实际说的是：\n\n> young readers doubt the suitability of criticism on dailies  \n> 年轻读者怀疑评论是否适合刊登在日报上\n\n全文写年轻读者难以想象过去的繁荣，是为了拉出今昔差距；他们读到旧评论集时感到惊讶，也是在说明当年的日报曾经能够容纳这种博学、严肃的评论。\n\nD把这种惊讶改成了怀疑，又把全文的今昔变化缩成了年轻读者的一种态度。它和主旨代入题干后得到的答案对不上。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>marvel</code>及与<code>suitability</code>相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D确实用了年轻读者、日报和“适合刊登”这些原文信息，但反应的人、反应的方向和时间都被换了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，年轻读者怀疑这些评论是否适合刊登在日报上。</p>\n</blockquote>\n<p>原文先说四十岁以下的普通读者难以想象过去；随后又说今天读这些书会：</p>\n<blockquote>\n<p>marvel at the fact\n对这个事实感到惊叹</p>\n</blockquote>\n<p>D把<code>marvel at</code>换成了<code>doubt</code>。前者是“没想到过去的日报竟然能容纳这种博学内容”，后者却成了“觉得这种内容可能不适合日报”，意思正好拐了一个方向。</p>\n<p>再看<code>suitable</code>所在的结构：</p>\n<blockquote>\n<p>their learned contents were once deemed suitable for publication\n这些博学内容曾经被认为适合刊登</p>\n</blockquote>\n<p>这句话说的是过去的出版环境怎样看待这些内容。D却改成今天的年轻读者在怀疑它是否适合，作出判断的人和时间都换了。</p></section><section class=\"revealPart\" id=\"focus-q21-D-2\"><h3>写作视角法</h3><p>原文第2段是这样写的：</p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n<p>今天读这些书，人们会惊叹这些博学内容当年竟适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文是在赞叹过去的日报能够容纳这类内容，并没有写年轻读者在质疑它。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Young readers today doubt whether such learned criticism is suitable for publication in general-circulation dailies.</p>\n<p>今天的年轻读者怀疑，这类博学评论是否适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文写的是作者的惊叹，D却改成年轻读者的怀疑，作出反应的人和态度方向都不同。</p></section><section class=\"revealPart\" id=\"focus-q21-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>young readers doubt the suitability of criticism on dailies<br />\n年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p>全文写年轻读者难以想象过去的繁荣，是为了拉出今昔差距；他们读到旧评论集时感到惊讶，也是在说明当年的日报曾经能够容纳这种博学、严肃的评论。</p>\n<p>D把这种惊讶改成了怀疑，又把全文的今昔变化缩成了年轻读者的一种态度。它和主旨代入题干后得到的答案对不上。</p>\n<p><strong>复盘判断：D错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"focusId":"focus-q21-D-3","meta":{"kind":"method","question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":true}},{"title":"21题结论","level":3,"lines":["> **21. B. English-language newspapers used to carry more arts reviews.**","","这道题的四个选项分别展示了四种常见处理：","","- A有原文对象，但把“衰退”扩大成“彻底消失”；","- B没有照抄一句原文，却把两段共同建立的今昔关系概括完整；","- C把原文中的熟词重新拼装，改变了修饰对象和讨论主题；","- D借用了同一句中的多个词，却把“惊叹”改成“怀疑”，还换了判断主体。"],"section":"第三鸟 · 题目复盘","raw":"### 21题结论\n\n> **21. B. English-language newspapers used to carry more arts reviews.**\n\n这道题的四个选项分别展示了四种常见处理：\n\n- A有原文对象，但把“衰退”扩大成“彻底消失”；\n- B没有照抄一句原文，却把两段共同建立的今昔关系概括完整；\n- C把原文中的熟词重新拼装，改变了修饰对象和讨论主题；\n- D借用了同一句中的多个词，却把“惊叹”改成“怀疑”，还换了判断主体。","html":"<blockquote>\n<p><strong>21. B. English-language newspapers used to carry more arts reviews.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种常见处理：</p>\n<ul>\n<li>A有原文对象，但把“衰退”扩大成“彻底消失”；</li>\n<li>B没有照抄一句原文，却把两段共同建立的今昔关系概括完整；</li>\n<li>C把原文中的熟词重新拼装，改变了修饰对象和讨论主题；</li>\n<li>D借用了同一句中的多个词，却把“惊叹”改成“怀疑”，还换了判断主体。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"21题","focus":[0,45,1240,270],"sourceW":1240,"sourceH":1636},"meta":{"kind":"conclusion","question":"21","option":null,"questionConclusion":true}},{"title":"22题 · 题干与核心出处","level":2,"lines":["## 22题","","> Newspaper reviews in England before World War II were characterized by ______.  ","> 第二次世界大战以前，英国的报纸评论具有什么特点？","","### 核心出处","","> We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”","","第三段开头先用`unfocused`概括这类报纸评论，后面再写它们篇幅充分、工作严肃、评论家有能力。做选项时，要分清“整类评论的共同特点”和“评论家个人的表现或引语”。"],"section":"第三鸟 · 题目复盘","raw":"## 22题\n\n> Newspaper reviews in England before World War II were characterized by ______.  \n> 第二次世界大战以前，英国的报纸评论具有什么特点？\n\n### 核心出处\n\n> We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”\n\n第三段开头先用`unfocused`概括这类报纸评论，后面再写它们篇幅充分、工作严肃、评论家有能力。做选项时，要分清“整类评论的共同特点”和“评论家个人的表现或引语”。","html":"<blockquote>\n<p>Newspaper reviews in England before World War II were characterized by ______.<br />\n第二次世界大战以前，英国的报纸评论具有什么特点？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n<p>第三段开头先用<code>unfocused</code>概括这类报纸评论，后面再写它们篇幅充分、工作严肃、评论家有能力。做选项时，要分清“整类评论的共同特点”和“评论家个人的表现或引语”。</p>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"meta":{"kind":"question","question":"22","option":null,"questionIntro":true}},{"title":"A. free themes","level":3,"lines":["### A. free themes","","> 自由的主题；题材不受固定限制","","**做题模式中的状态：**当时`unfocused`被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。","","**选项类型：正确的同义改写。**","","A把`unfocused newspaper reviews`概括为“题材比较自由、不局限于一个固定主题”。","","**出处：**","","> the unfocused newspaper reviews published in England"],"section":"第三鸟 · 题目复盘","raw":"### A. free themes\n\n> 自由的主题；题材不受固定限制\n\n**做题模式中的状态：**当时`unfocused`被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。\n\n**选项类型：正确的同义改写。**\n\nA把`u
