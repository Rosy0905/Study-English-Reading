5))) → is now known solely：(as a writer of essays：(on the game of cricket)).</p>\n<p>During his lifetime：(though)，// he → was also：(one of England's foremost classical-music critics)，+ and a stylist：(so widely admired：(that his Autobiography (1947) → became a best-seller)).</p>\n<p>He → was knighted：(in 1967)，+ the first music critic：(to be so honored).</p>\n<p>Yet + only one of his books → is now in print，+ and his vast body of writings：(on music) → is unknown：(save to specialists).</p>\n<p><strong>第5段</strong></p>\n<p>Is there any chance：(that Cardus's criticism → will enjoy a revival)?</p>\n<p>The prospect → seems remote.</p>\n<p>Journalistic tastes → had changed：(long before his death)，+ and postmodern readers → have little use：(for the richly upholstered Vicwardian prose：(in which he specialized)).</p>\n<p>Moreover, the amateur tradition：(in music criticism) → has been：(in headlong retreat).</p>\n<h3>中文版句子逻辑（选修)</h3>\n<p><strong>第1段</strong></p>\n<p>在所有变化中：(这些变化已发生：(在英语报纸中：(在过去25年里))) → 或许最深远的变化 → 一直是 → 不可逆转的下降：(在范围和严肃性：(对其艺术报道))</p>\n<p><strong>第2段</strong></p>\n<p>这 → 很难：(几乎不可能) → 对于普通读者：(40岁以下的) → 去想象 → 一个时代：(当高质量的艺术评论 → 能够被找到 → 在大部分大城市的报纸里)。</p>\n<p>然而 + (相当多的数量：(最重要的选集之一：(评论的)) → 出版：(在20世纪) → 大部分由 → 报纸评论构成)。</p>\n<p>今天读这些书 → 就是惊叹 → 这个事实：(它们博学的内容 → 曾经被认为适合 → 出版：(在大众发行的日报上))。</p>\n<p><strong>第3段</strong></p>\n<p>我们 → 更加遥远了 → 从那些漫无边际的报纸评论：(发表在英国：(在20世纪初到二战前夕之间)，在一个时代：(当新闻纸非常廉价 + 风格化的艺术评论 → 被认为是一种装饰 → 对于这些出版物：(它们所出现的)))。</p>\n<p>在那些遥远的日子里：理所当然：(评论家们：(来自主要报纸的) → 会撰写：(详细且长篇地) → 关于这些事件：(他们所报道的))。</p>\n<p>他们的工作 → 是严肃的事业，+ 甚至那些评论家：(那些不炫耀自身学识的：(比如萧伯纳和欧内斯特·纽曼)) → 是可以信赖的 → 去了解：(他们所做的事)。</p>\n<p>这些人 → 相信：(新闻作为一种使命) + 并且以此为荣 → 被发表：(在日报上)。</p>\n<p>&quot;如此少的作家：(有足够智慧或文学天赋 → 能在新闻界立足)，&quot; → 纽曼写道，&quot;以至于我忍不住将'新闻'定义为：('一种蔑称：(由不被阅读的作家使用 → 对被广泛阅读的作家)')&quot;。</p>\n<p><strong>第4段</strong></p>\n<p>不幸的是，// 这些评论家 → 几乎被遗忘了。</p>\n<p>内维尔·卡达斯：(为《曼彻斯特卫报》撰稿：(自1917年 + 直到去世前不久：(在1975年))) → 现在仅仅被人们所知：(作为一名散文作家：(关于板球比赛的))。</p>\n<p>尽管在他的一生中，// 他 → 也曾是：(英国最杰出的古典音乐评论家之一)，+ 并且是一位文体家：(广受赞誉的：(以至于他的《自传》（1947年）→ 成为了一本畅销书))。</p>\n<p>他 → 被封为爵士：(于1967年)，+ 第一位音乐评论家：(获此殊荣的)。</p>\n<p>然而 + 现在他只有一本书 → 仍在印刷中，+ 他大量的著作：(关于音乐的) → 不为人所知：(除了专业人士以外)。</p>\n<p><strong>第5段</strong></p>\n<p>是否有任何可能性：(卡达斯的评论 → 会重新受到青睐)？</p>\n<p>这个前景 → 看起来渺茫。</p>\n<p>新闻品味 → 已经发生了改变：(在他去世前很久)，+ 并且后现代的读者 → 几乎不需要：(他所擅长的这种丰富华丽的维多利亚爱德华风格的散文)。</p>\n<p>此外，业余传统：(在音乐评论中) → 一直处于：(急速的衰退中)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h3>1. 第一段唯一一句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>在所有变化中 / 这些变化已经发生 / 在英文报纸中 / 在过去四分之一世纪里，/ 或许影响最深远的变化 / 一直是 / 不可阻挡的下降 / 在范围和严肃性方面 / 对它们的艺术报道。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>按中文习惯，先把时间和范围放到前面：</p>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸发生的所有变化中</p>\n</blockquote>\n<p>再把“艺术报道—范围和严肃性—下降”接起来：</p>\n<blockquote>\n<p>艺术报道在范围和严肃性上的不可阻挡的下降</p>\n</blockquote>\n<p>中间两块直接收成：</p>\n<blockquote>\n<p>影响最深远的或许是</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸发生的所有变化中<br />\n影响最深远的或许是<br />\n艺术报道在范围和严肃性上的不可阻挡的下降</p>\n</blockquote><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>这句话先抓住主干：</p>\n<blockquote>\n<p>影响最深远的变化，是……的下降。</p>\n</blockquote>\n<p>然后补上时间范围，以及具体在哪些方面下降：</p>\n<blockquote>\n<p>在过去四分之一个世纪英文报纸发生的所有变化中，影响最深远的变化，或许是艺术报道在范围和严肃性上的持续下降。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸经历了许多变化。其中影响最为深远的，或许是艺术报道在覆盖范围和严肃性上的持续衰退。</p>\n</blockquote>\n<h3>2. 第三段第一句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>We / are even farther removed / from the unfocused newspaper reviews / published in England / between the turn of the 20th century and the eve of World War II, / at a time / when newsprint was dirt-cheap / and stylish arts criticism / was considered an ornament / to the publications / in which it appeared.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>我们 / 甚至更加远离 / 那些题材不受限制的报纸评论 / 发表于英国 / 从20世纪之交到第二次世界大战前夕，/ 在一个时期 / 那时新闻纸便宜得像土 / 并且有风格的艺术评论 / 被认为是一种点缀 / 对那些出版物来说 / 它出现在其中的。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>地点和时间都在说明“报纸评论”，中文把它们放到名词前面：</p>\n<blockquote>\n<p>20世纪之交到二战前夕在英国发表的那些题材自由的报纸评论</p>\n</blockquote>\n<p>后半句是在交代当时的背景，另起一句更顺：</p>\n<blockquote>\n<p>当时，新闻纸便宜得像土，有风格的艺术评论也被视为报刊的一种点缀</p>\n</blockquote>\n<p>开头直接收成：</p>\n<blockquote>\n<p>我们离……就更远了</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>我们离20世纪之交到二战前夕在英国发表的那些题材自由的报纸评论就更远了<br />\n当时，新闻纸便宜得像土，有风格的艺术评论也被视为报刊的一种点缀</p>\n</blockquote><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>这句话先抓住两层主干：</p>\n<blockquote>\n<p>我们与那些报纸评论距离更远。\n那是一个……的时代。</p>\n</blockquote>\n<p>接着把英国、20世纪初到二战前夕，以及新闻纸便宜、艺术评论受重视这些信息补进去。</p>\n<h4>第五步：艺术加工</h4>\n<blockquote>\n<p>我们与20世纪初到第二次世界大战前夕英国报纸上那些题材自由的评论，距离就更远了。当时新闻纸极其便宜，而有风格的艺术评论被视为报纸的一种点缀。</p>\n</blockquote>\n<h3>3. 第三段纽曼引语</h3>\n<h4>原文</h4>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>“So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>“如此少的作者 / 有足够的头脑或文学天赋 / 在新闻工作中撑起自己这一头，” / 纽曼写道，/ “以至于我忍不住把‘新闻工作’定义为‘一种蔑称 / 被那些不被阅读的作家使用 / 去称呼那些被阅读的作家。’”</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>中文先把“什么样的作者”说完整，再说这样的人很少：</p>\n<blockquote>\n<p>有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了</p>\n</blockquote>\n<p>后面是结果，用“少到……”接起来：</p>\n<blockquote>\n<p>少到让我忍不住把“新闻工作”定义为</p>\n</blockquote>\n<p>最后改成主动说法：</p>\n<blockquote>\n<p>一种没人读的作家用来称呼那些有人读的作家的蔑称</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了<br />\n少到让我忍不住把“新闻工作”定义为<br />\n一种没人读的作家用来称呼那些有人读的作家的蔑称</p>\n</blockquote><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>中文骨干是：</p>\n<blockquote>\n<p>能把新闻工作做好的作者太少，以至于我想把“新闻工作”定义成一种蔑称。</p>\n</blockquote>\n<p>接着补充“谁用这个蔑称称呼谁”：</p>\n<blockquote>\n<p>不被阅读的作家，用它来贬低那些有人阅读的作家。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<blockquote>\n<p>纽曼写道，有足够头脑或文学才华、能够在新闻写作中站稳脚跟的作者少之又少，因此他甚至想把“新闻工作”定义成一种蔑称：不被阅读的作家用它来贬低那些有人阅读的作家。</p>\n</blockquote>\n<h3>4. 第四段第三句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>During his lifetime, though, / he was also / one of England’s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>不过在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位如此广受赞赏的文体家 / 以至于他的《自传》（1947）/ 成为了一本畅销书。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>先把时间放到前面：</p>\n<blockquote>\n<p>不过在他生前</p>\n</blockquote>\n<p>两重身份用“既是……也是……”接起来：</p>\n<blockquote>\n<p>他既是英国最杰出的古典音乐评论家之一，也是一位广受赞赏的文体家</p>\n</blockquote>\n<p>最后直接说受欢迎带来的结果：</p>\n<blockquote>\n<p>他的文风很受欢迎，连《自传》（1947）也成了畅销书</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>不过在他生前<br />\n他既是英国最杰出的古典音乐评论家之一，也是一位广受赞赏的文体家<br />\n他的文风很受欢迎，连《自传》（1947）也成了畅销书</p>\n</blockquote><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>这句话先抓住主干：</p>\n<blockquote>\n<p>他既是……评论家，也是一位广受赞赏的文体家。</p>\n</blockquote>\n<p>然后把结果接在后面：</p>\n<blockquote>\n<p>他的《自传》因此成为畅销书。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<blockquote>\n<p>不过在他生前，他还是英国最杰出的古典音乐评论家之一，也是一位广受赞誉的文体家；他的《自传》（1947）甚至因此成为畅销书。</p>\n</blockquote>\n<h3>5. 第五段第三句</h3>\n<h4>原文</h4>\n<blockquote>\n<p>Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote>\n<h4>第一步：划分意群</h4>\n<blockquote>\n<p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p>\n</blockquote>\n<h4>第二步：逐个意群直译</h4>\n<blockquote>\n<p>新闻业的品味 / 已经改变 / 早在他去世之前，/ 并且后现代读者 / 几乎不需要 / 他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n<h4>第三步：按照中文语感合并意群</h4>\n<p>这句话有两个并列原因。第一处把时间放到前面：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变</p>\n</blockquote>\n<p>第二处把“他所擅长的”放到“散文”前面：</p>\n<blockquote>\n<p>后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote>\n<p>最后用“而且”接起来：</p>\n<blockquote>\n<p>早在他去世之前，新闻业的审美趣味就已经改变，而且后现代读者也几乎不需要他所擅长的那种华丽的维多利亚—爱德华时代散文</p>\n</blockquote><h4>第四步：寻找句子骨干并按照中文语序调整</h4>\n<p>这句话先抓住主干：</p>\n<blockquote>\n<p>新闻品味已经改变，而且现代读者不喜欢他的文风。</p>\n</blockquote>\n<p>然后补上时间和文风特征：</p>\n<blockquote>\n<p>早在他去世前；华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n<h4>第五步：艺术加工</h4>\n<blockquote>\n<p>早在卡达斯去世之前，新闻业的审美趣味就已经改变；后现代读者也不再欣赏他所擅长的那种华丽装饰的维多利亚—爱德华时代散文。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>做题模式还原的是考场状态：有些词不认识，只能用当时读到的信息判断。到了复盘阶段，单词、句子和答案都已经看清楚，不必再把题重做一遍，重点是弄明白每个选项从哪里来、又改错了什么。</p>\n<p>复盘时，把一道题拆成四个选项来看。每个选项主要看三件事：</p>\n<ol>\n<li>它从原文哪句话或哪几句话改来；</li>\n<li>它保留了原文什么，又偷偷改了什么；</li>\n<li>用定位比对、写作视角和全文主旨再核一遍。</li>\n</ol>\n<p>三个方法分别这样用：</p>\n<ul>\n<li><strong>定位比对：</strong>把选项接回题干，再和原文逐块比较，看人物、动作、对象、范围、时间、程度和方向有没有变化；</li>\n<li><strong>写作视角：</strong>假设这个选项是对的，作者后面至少应该怎么写，再看实际文章是不是沿着这条路写；</li>\n<li><strong>全文主旨：</strong>先用全文主旨回答题干，再看选项能不能放进全文主线。主旨只负责核对大方向，局部细节仍要回原文判断。</li>\n</ul>\n<p>错误选项大体只有三类。</p>\n<h4>第一类：歪曲原意</h4>\n<p>选项确实有出处，但把原文里的关键关系改了。常见改法有：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因和结果对调；</li>\n<li>主体或对象换了；</li>\n<li>时间、范围或程度变了；</li>\n<li>一个词还在，但它修饰的对象换了；</li>\n<li>原文只说“变少”，选项却写成“彻底没有”。</li>\n</ul>\n<p>这一类最容易被骗的地方，就是选项看起来特别像原文。不能只看词有没有出现，要把整句话接起来看。</p>\n<h4>第二类：内容是真的，但没有回答题干</h4>\n<p>这种选项在原文里也能找到，甚至它本身没有说错。问题是题干问的是主旨、作用、态度或某个限定范围，它却拿一个细节、例子或其他段落来回答。</p>\n<p>看到原文里有这句话，还不能马上选。还要再问一句：</p>\n<blockquote>\n<p>这句话真的是题干要的那一层吗？</p>\n</blockquote>\n<h4>第三类：无中生有</h4>\n<p>文章里没有选项说出的完整意思。命题人通常会拿几个原文词、一个相近场景或现实常识，让我们自己把中间缺的关系补出来。</p>\n<p>分析这类选项时，不要只写“原文没提”。要说清楚：它借了原文什么，我们又从哪里开始多想了一步，最后补出了哪条原文没有的关系。</p>\n<p>下面先复盘25题。先把全文主旨定下来，后面21—24题就多了一张可以随时拿回来核对的“主旨底牌”。</p>\n<h2>25题</h2>\n<p><strong>What would be the best title for the text?</strong></p>\n<blockquote>\n<p>这篇文章最合适的标题是什么？</p>\n</blockquote>\n<p>这道题先不急着自己概括。把四个标题分别当成全文主旨，看五段会怎么安排，再和实际文章对照。</p>\n<p>选项：</p>\n<p>A. <strong>Newspapers of the Good Old Days</strong></p>\n<p>美好旧日的报纸</p>\n<p>B. <strong>The Lost Horizon in Newspapers</strong></p>\n<p>报纸中消失的地平线</p>\n<p>C. <strong>Mournful Decline of Journalism</strong></p>\n<p>新闻业令人悲哀的衰退</p>\n<p>D. <strong>Prominent Critics in Memory</strong></p>\n<p>记忆中的著名评论家</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>写作视角的用法很直接：把每个标题代入全文，看看作者如果真想写这个主题，五段至少应该怎样安排，再与实际文章比较。</p>\n<p>外刊文章不会无缘无故地堆材料。中间可以有铺垫、人物和例子，但这些内容最后都要回到同一个中心。先看这篇文章五段实际写了什么：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>这一段在说什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>英文报纸的艺术报道在范围和严肃性上持续衰退</td>\n  <td>先说xxx现在不行了</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>回看过去大城市报纸中高质量艺术评论的普遍存在</td>\n  <td>再拿过去打现在，把今昔反差拉出来</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>继续写过去评论的分量、严肃性和评论家的能力</td>\n  <td>接着补证据，证明以前确实好</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用Cardus生前受推崇、如今被遗忘的变化落地</td>\n  <td>再举一个人，说明以前多好、现在多差</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>解释Cardus及这类评论为什么难以复兴</td>\n  <td>最后解释为什么xxx回不来，给出结论</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h3>A. Newspapers of the Good Old Days</h3>\n<blockquote>\n<p>美好旧日的报纸</p>\n</blockquote>\n<h4>如果 A 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“美好旧日的报纸”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先整体赞美过去报纸比现在好</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>列举过去报纸在政治、社会、文化等方面的优点</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>继续补充旧报纸的其他长处</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用人物或事件证明旧报纸整体繁荣</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>总结过去报纸值得怀念</td>\n</tr>\n</tbody>\n</table></div>\n<p>A容易让人犹豫，是因为文章确实一直在比较过去和现在，而且明显更怀念过去。只看到“过去更好”，A看起来说得通。</p>\n<p>但标题还得说清作者怀念的到底是什么。本文没有全面回顾旧报纸，也没有讨论新闻、公信力、政治报道或社会版面；作者始终盯着报纸中的艺术评论。</p>\n<p>旧报纸只是这种艺术评论过去依托的载体，全文的中心仍是艺术评论传统。A把“报纸中的一种文化内容”扩大成“过去的报纸整体”，范围太大。</p>\n<p>实际文章最后还要解释这种评论为什么难以复兴。这个“已经失去、很难回来”的方向，也比单纯歌颂“美好旧日”更重要。</p>\n<p><strong>判断：A不保留。</strong></p>\n<hr />\n<h3>B. The Lost Horizon in Newspapers</h3>\n<blockquote>\n<p>报纸中消失的地平线</p>\n</blockquote>\n<h4>如果 B 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“报纸中消失的地平线”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先指出报纸中某种重要内容正在从视野里消失</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>用过去的繁荣反衬现在的失落</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>证明过去这类内容确实有质量、有分量</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用典型人物展示这种传统由盛转衰</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>说明时代改变，失去的东西很难回来</td>\n</tr>\n</tbody>\n</table></div>\n<p>B没有把文章说死成“已经彻底消失”。<code>lost horizon</code>概括的是一种正在远去、逐渐离开公众视野的文化景观。</p>\n<p>现在逐段对照：第1段先说艺术报道持续衰退；第2、3段回看过去，证明这种评论曾经普遍而且有分量；第4段用Cardus把抽象变化落到一个具体人物身上；第5段再说明这种评论很难复兴。</p>\n<p>五段都在回答同一件事：报纸里曾经有一种重要的艺术评论传统，现在它正在消失，而且很难回到原来的位置。</p>\n<p>B既能包住“过去曾经繁荣”，也能包住“现在衰退”和“未来难复兴”，因此能解释全文为什么这样安排。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr />\n<h3>C. Mournful Decline of Journalism</h3>\n<blockquote>\n<p>新闻业令人悲哀的衰退</p>\n</blockquote>\n<h4>如果 C 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“新闻业令人悲哀的衰退”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先说整个新闻业都在衰退</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>回顾过去新闻业整体繁荣</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>证明新闻采编、报道、公信力等全面更好</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>用记者或报业事件说明整个行业衰落</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>总结新闻业整体前景悲观</td>\n</tr>\n</tbody>\n</table></div>\n<p>C也很容易迷惑，因为第三段确实多次出现<code>journalism</code>，文章整体也带有惋惜的语气。</p>\n<p>但<code>journalism</code>在第三段主要出现在Shaw和Newman怎样看待新闻写作的讨论中，它是用来证明过去评论家的职业态度和能力，不等于全文在讨论整个新闻业。</p>\n<p>如果C成立，文章应该再写新闻报道、公信力、记者职业、报业经营等整个行业的问题。实际文章从头到尾都把范围限制在<code>arts coverage</code>、<code>arts criticism</code>、<code>newspaper reviews</code>和<code>music criticism</code>。</p>\n<p>C把局部职业背景扩大成了全文对象。文章感叹的是新闻业内部一种严肃艺术评论传统的消失，并没有讨论整个新闻业全面衰退。</p>\n<p><strong>判断：C不保留。</strong></p>\n<hr />\n<h3>D. Prominent Critics in Memory</h3>\n<blockquote>\n<p>记忆中的著名评论家</p>\n</blockquote>\n<h4>如果 D 是主旨，文章五段应该怎么写？</h4>\n<p>如果全文主旨真的是“记忆中的著名评论家”，五段大概需要这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果这个选项正确，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先介绍一批值得纪念的评论家</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>分别回顾他们的生平和主要成就</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>继续补充他们的代表作品和影响</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>集中写Cardus等人物如何被后人铭记</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>总结这些评论家应当被永远记住</td>\n</tr>\n</tbody>\n</table></div>\n<p>D抓住了Shaw、Newman和Cardus这些人物，所以看起来像是一个人物回忆类标题。</p>\n<p>这些人物都在为全文主线服务。Shaw和Newman说明过去的评论家有能力、重视新闻写作；Cardus则说明一个曾经风光的评论家后来怎样被遗忘。中心仍是艺术评论传统由盛转衰。</p>\n<p>更直接的是，第4段开头写：</p>\n<blockquote>\n<p>Unfortunately, these critics are virtually forgotten.\n遗憾的是，这些评论家几乎被遗忘了。</p>\n</blockquote>\n<p>D中的<code>in Memory</code>暗示这些评论家仍然被人记住，实际文章却强调他们已经退出公众记忆。它不仅把论据当成主旨，连人物现在的状态也说反了。</p>\n<p><strong>判断：D不保留。</strong></p>\n<hr />\n<h3>25题结论</h3>\n<p><strong>25. B. The Lost Horizon in Newspapers.</strong></p>\n<p>四个标题分别怎么错：</p>\n<ul>\n<li>A抓住“过去更好”，但把具体的艺术评论扩大成旧报纸整体；</li>\n<li>B能把五段从现状、过去、人物到复兴无望的顺序全部包住；</li>\n<li>C抓住<code>journalism</code>这个熟词，却把艺术评论传统扩大成整个新闻业；</li>\n<li>D抓住人物细节，却把用来举证的人物误当成全文中心。</li>\n</ul>\n<p>这道题确定的全文主旨是：</p>\n<blockquote>\n<p>英文报纸中曾经繁荣、严肃、有分量的艺术评论传统正在从公众视野中消失，而且复兴希望渺茫。</p>\n</blockquote>\n<p>后面分析21—24题时，这就是全文主旨底牌。</p>\n<h2>21题</h2>\n<blockquote>\n<p>It is indicated in Paragraphs 1 and 2 that ______.<br />\n第1、2段说明了什么？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p>\n<p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote>\n<p>第1段给的是现在的变化：艺术报道在范围和严肃性上持续下降。</p>\n<p>第2段回看过去：高质量艺术评论曾经普遍出现在大城市报纸上，许多重要评论文集也大量来自报纸评论。</p>\n<p>因此，这道题要看的就是：哪个选项把两段共同写出的今昔变化接对了。</p>\n<h3>A. arts criticism has disappeared from big-city newspapers</h3>\n<blockquote>\n<p>艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>decline</code>和<code>disappeared</code>，因此根据程度差异直接排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>A也不是凭空来的。它用了原文中的<code>arts criticism</code>、<code>big-city newspapers</code>以及“现在不如过去”这个方向，但把“持续衰退”扩大成“已经彻底消失”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，艺术评论已经从大城市报纸中彻底消失。</p>\n</blockquote>\n<p>A里的<code>arts criticism</code>和<code>big-city newspapers</code>本身都能在原文中找到，问题不在这两个对象上。真正需要比较的是<code>disappeared</code>。</p>\n<p>第1段的原词是：</p>\n<blockquote>\n<p>decline\n衰退、下降</p>\n</blockquote>\n<p>而且作者还专门限定了下降的两个方面：</p>\n<blockquote>\n<p>in the scope and seriousness\n在范围和严肃性上</p>\n</blockquote>\n<p>也就是说，作者写的是数量、覆盖范围和认真程度都在变弱，并没有说艺术评论已经一篇不剩。</p>\n<p>第2段也只是在让今天的读者回想过去的繁荣。它说过去多数大城市报纸都能看到高质量艺术评论，却没有补一句“今天所有大城市报纸都完全不再刊登艺术评论”。</p>\n<p>A保留了原文中的对象，变化程度却从“衰退”被推成了“消失”。</p>\n<h4>写作视角法</h4>\n<p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>艺术报道在范围和严肃性上持续衰退；过去多数大城市报纸都能读到高质量艺术评论。</p>\n</blockquote>\n<p>文章先写现在正在衰退，再回头写过去曾经普遍存在，今昔反差已经出来了，但用的仍然是<code>decline</code>这个程度。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Today, arts criticism can no longer be found in big-city newspapers, and no such reviews remain in the daily press.</p>\n<p>如今，大城市报纸已经完全找不到艺术评论，日报中也不再保留任何此类评论。</p>\n</blockquote>\n<p>原文写的是逐渐衰退，A说的却是彻底消失。两边一对照，程度明显对不上。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>arts criticism has disappeared from big-city newspapers<br />\n艺术评论已经从大城市报纸中消失</p>\n</blockquote>\n<p>主旨写的是一种由盛转衰、逐渐离开公众视野的过程。A却把这个过程直接推到了终点，写成大城市报纸里已经彻底没有艺术评论。</p>\n<p>所以，A抓住了同一个对象，也抓住了下降的方向，但它把程度说重了。它和主旨代入题干后得到的答案并不一致。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. English-language newspapers used to carry more arts reviews</h3>\n<blockquote>\n<p>英文报纸过去刊登的艺术评论更多</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮已经把B保留下来；第1段的下降和第2段的过去常见能够直接接起来，后来再用全文主旨确认。</p>\n<p><strong>选项类型：正确的跨段概括与同义改写。</strong></p>\n<p>B没有直接照抄原句，它把第1段“现在下降”和第2段“过去普遍存在”合成了一个今昔比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>a considerable number of the most significant collections of criticism ... consisted in large part of newspaper reviews</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>这个选项要把两段的信息接起来，逐块看就清楚了：</p>\n<ul>\n<li><code>English-language newspapers</code>直接对应第1段的<code>English-language newspapers</code>；</li>\n<li><code>used to</code>对应第2段不断回看的过去时代；</li>\n<li><code>arts reviews</code>对应第1段的<code>arts coverage</code>以及第2段的<code>arts criticism</code>、<code>newspaper reviews</code>；</li>\n<li><code>more</code>不是原文某个单词的直接替换，它来自两段共同给出的信息：“现在正在下降”，而“过去多数大城市报纸普遍有高质量评论”。</li>\n</ul>\n<p>既然现在出现了<code>decline</code>，就一定是在和过去比较；第2段正好把过去的情况补出来。这样一来，“过去更多”并不是凭空总结，而是两段合在一起得出的今昔关系。</p>\n<h4>写作视角法</h4>\n<p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>the inexorable decline in the scope and seriousness of their arts coverage</p>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>艺术报道现在持续衰退，而过去多数大城市报纸都能看到高质量艺术评论。</p>\n</blockquote>\n<p>文章先说现在变少，再回头写过去有多常见，前后接起来就是“过去比现在更多”。</p>\n<p>如果B真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>English-language newspapers once carried more substantial arts reviews than they do today.</p>\n<p>英文报纸过去刊登的艺术评论比今天更多，也更有分量。</p>\n</blockquote>\n<p>第1、2段就是这样往下写的，B与原文的展开方式一致。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>B实际说的是：</p>\n<blockquote>\n<p>English-language newspapers used to carry more arts reviews<br />\n英文报纸过去刊登的艺术评论更多</p>\n</blockquote>\n<p>B正好把全文的今昔变化接回了题干。第1段写现在持续下降，第2段写过去大城市报纸中普遍有高质量艺术评论，两段放在一起，就是“过去比现在更多”。</p>\n<p>B没有把范围扩大到整个新闻业，也没有把“衰退”说成“彻底消失”。它与主旨代入题干后得到的答案一致。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. high-quality newspapers retain a large body of readers</h3>\n<blockquote>\n<p>高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出<code>high-quality</code>的修饰对象被换掉，而且原文没有讨论读者保有量，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把原文里分散出现的<code>high-quality</code>、<code>newspapers</code>和<code>reader</code>重新拼成了一条新关系。每个词都像在原文里出现过，但原来的修饰关系和命题对象已经被换掉。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>high-quality arts criticism could be found in most big-city newspapers</p>\n<p>for the average reader under the age of forty</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，高质量报纸仍然拥有大量读者。</p>\n</blockquote>\n<p>先看<code>high-quality newspapers</code>。原文里的完整词组其实是：</p>\n<blockquote>\n<p>high-quality arts criticism\n高质量的艺术评论</p>\n</blockquote>\n<p><code>high-quality</code>修饰的是<code>arts criticism</code>，不是<code>newspapers</code>。C把<code>high-quality</code>从“艺术评论”前面挪到了“报纸”前面，于是原文里没有的“高质量报纸”被拼了出来。</p>\n<p>再看<code>a large body of readers</code>。原文只有：</p>\n<blockquote>\n<p>the average reader under the age of forty\n四十岁以下的普通读者</p>\n</blockquote>\n<p>这句话只是说明年轻读者难以想象过去的报纸环境，没有统计读者数量，也没有说报纸<code>retain</code>了多少读者。</p>\n<p>所以C并不是把某句原文换了个说法，而是把三个熟词重新拼成了“高质量报纸仍拥有大量读者”这个新意思。</p>\n<h4>写作视角法</h4>\n<p>原文第2段是这样写的：</p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n<p>今天读这些书，人们会惊叹这些博学内容当年竟被认为适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文谈的是评论内容以及当时日报能够容纳什么，并没有转去谈报纸质量或读者数量。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>High-quality newspapers continue to retain a large readership, especially among readers who value serious arts criticism.</p>\n<p>高质量报纸仍然保有大量读者，尤其受到重视严肃艺术评论的读者欢迎。</p>\n</blockquote>\n<p>后文没有沿着“高质量报纸仍有大量读者”往下写，C自然解释不了这两段。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>high-quality newspapers retain a large body of readers<br />\n高质量报纸仍然拥有大量读者</p>\n</blockquote>\n<p>主旨关注的是报纸里艺术评论的多少、分量和公共影响，题干也在问第1、2段共同说明了什么。C却把讨论对象换成了报纸质量和读者数量。</p>\n<p>“过去艺术评论更多”和“高质量报纸仍有大量读者”不是同一件事。C借用了原文里的几个熟词，却没有接上全文真正讨论的主线。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. young readers doubt the suitability of criticism on dailies</h3>\n<blockquote>\n<p>年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>marvel</code>及与<code>suitability</code>相关的位置被遮挡，D曾被暂时保留；复盘恢复完整词义后，可以看清命题人怎样把“惊叹”改成“怀疑”。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D确实用了年轻读者、日报和“适合刊登”这些原文信息，但反应的人、反应的方向和时间都被换了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1、2段表明，年轻读者怀疑这些评论是否适合刊登在日报上。</p>\n</blockquote>\n<p>原文先说四十岁以下的普通读者难以想象过去；随后又说今天读这些书会：</p>\n<blockquote>\n<p>marvel at the fact\n对这个事实感到惊叹</p>\n</blockquote>\n<p>D把<code>marvel at</code>换成了<code>doubt</code>。前者是“没想到过去的日报竟然能容纳这种博学内容”，后者却成了“觉得这种内容可能不适合日报”，意思正好拐了一个方向。</p>\n<p>再看<code>suitable</code>所在的结构：</p>\n<blockquote>\n<p>their learned contents were once deemed suitable for publication\n这些博学内容曾经被认为适合刊登</p>\n</blockquote>\n<p>这句话说的是过去的出版环境怎样看待这些内容。D却改成今天的年轻读者在怀疑它是否适合，作出判断的人和时间都换了。</p>\n<h4>写作视角法</h4>\n<p>原文第2段是这样写的：</p>\n<blockquote>\n<p>To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p>\n<p>今天读这些书，人们会惊叹这些博学内容当年竟适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文是在赞叹过去的日报能够容纳这类内容，并没有写年轻读者在质疑它。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Young readers today doubt whether such learned criticism is suitable for publication in general-circulation dailies.</p>\n<p>今天的年轻读者怀疑，这类博学评论是否适合刊登在大众日报上。</p>\n</blockquote>\n<p>原文写的是作者的惊叹，D却改成年轻读者的怀疑，作出反应的人和态度方向都不同。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>既然全文写的是报纸艺术评论曾经繁荣、如今持续衰退，那么第1、2段最可能说明的是：英文报纸过去刊登的艺术评论比现在更多。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>young readers doubt the suitability of criticism on dailies<br />\n年轻读者怀疑评论是否适合刊登在日报上</p>\n</blockquote>\n<p>全文写年轻读者难以想象过去的繁荣，是为了拉出今昔差距；他们读到旧评论集时感到惊讶，也是在说明当年的日报曾经能够容纳这种博学、严肃的评论。</p>\n<p>D把这种惊讶改成了怀疑，又把全文的今昔变化缩成了年轻读者的一种态度。它和主旨代入题干后得到的答案对不上。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. B. English-language newspapers used to carry more arts reviews.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种常见处理：</p>\n<ul>\n<li>A有原文对象，但把“衰退”扩大成“彻底消失”；</li>\n<li>B没有照抄一句原文，却把两段共同建立的今昔关系概括完整；</li>\n<li>C把原文中的熟词重新拼装，改变了修饰对象和讨论主题；</li>\n<li>D借用了同一句中的多个词，却把“惊叹”改成“怀疑”，还换了判断主体。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>Newspaper reviews in England before World War II were characterized by ______.<br />\n第二次世界大战以前，英国的报纸评论具有什么特点？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n<p>第三段开头先用<code>unfocused</code>概括这类报纸评论，后面再写它们篇幅充分、工作严肃、评论家有能力。做选项时，要分清“整类评论的共同特点”和“评论家个人的表现或引语”。</p>\n<h3>A. free themes</h3>\n<blockquote>\n<p>自由的主题；题材不受固定限制</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>unfocused</code>被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>A把<code>unfocused newspaper reviews</code>换成了更直接的说法：题材比较自由，不局限在一个固定主题上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the unfocused newspaper reviews published in England</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是题材比较自由。</p>\n</blockquote>\n<p>原文直接修饰<code>newspaper reviews</code>的词是：</p>\n<blockquote>\n<p>unfocused</p>\n</blockquote>\n<p>这里的<code>unfocused</code>并不是说评论质量差，也不是说评论家写作没有中心。结合这一段的历史背景，它说的是评论没有被一个很窄、很固定的题目框住，评论家可以随着自己报道的文化事件展开。</p>\n<p>后一句也写：</p>\n<blockquote>\n<p>write in detail and at length about the events they covered\n围绕他们报道的事件写得详细而且篇幅很长</p>\n</blockquote>\n<p>这句话也说明，评论内容可以跟着不同事件展开，不必只围绕固定栏目或单一主题。</p>\n<p>因此，<code>unfocused newspaper reviews</code>和<code>reviews with free themes</code>说的是同一个特点。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the unfocused newspaper reviews</p>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n<p>这些报纸评论题材不受固定范围限制，评论家会围绕自己报道的事件详细而充分地展开。</p>\n</blockquote>\n<p>原文让评论家随着所报道的事件充分展开，没有把评论限制在固定题材里。</p>\n<p>如果A真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Newspaper reviewers were free to range widely over the events and subjects they covered.</p>\n<p>报纸评论家可以围绕自己报道的事件和主题广泛展开。</p>\n</blockquote>\n<p>第三段就是这样写的，A与原文的展开方式一致。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明这种旧式评论本身有什么特点，以及它为什么值得怀念。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>free themes<br />\n自由的主题；题材不受固定限制</p>\n</blockquote>\n<p>A回答的仍然是评论本身的特点，而且能够和第三段开头的<code>unfocused newspaper reviews</code>接上。后文又写评论家会围绕自己报道的不同事件展开，这也没有把题材限制在固定栏目或单一对象上。</p>\n<p>主旨只能帮助我们确认A落在正确的对象和段落作用上；真正把A坐实的，仍然是第三段开头的直接措辞和后面的内容展开。两边放在一起，A与全文方向一致。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. casual style</h3>\n<blockquote>\n<p>随意的风格</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>serious business</code>，也看出<code>wore their learning lightly</code>只描述部分评论家怎样表现学问，因此排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B主要借了<code>wore their learning lightly</code>这句话，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>even those reviewers who wore their learning lightly</p>\n<p>Theirs was a serious business</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，整体风格比较随意。</p>\n</blockquote>\n<p>最容易把人带偏的是：</p>\n<blockquote>\n<p>wore their learning lightly</p>\n</blockquote>\n<p>字面上有<code>lightly</code>，看起来像“轻松、随意”。但完整结构的主语是：</p>\n<blockquote>\n<p>those reviewers\n那些评论家</p>\n</blockquote>\n<p>它说的是部分评论家怎样表现自己的学问：有学问，但不故意摆出沉重、卖弄的姿态。这里并没有把整类报纸评论说成<code>casual</code>。</p>\n<p>同一句前面还明确写：</p>\n<blockquote>\n<p>Theirs was a serious business.\n他们做的是一件严肃的工作。</p>\n</blockquote>\n<p>后面又说这些人：</p>\n<blockquote>\n<p>could be trusted to know what they were about\n被认为清楚自己在做什么</p>\n</blockquote>\n<p>所以，原文只能说明“他们表现学问的方式比较轻松”，推不出“评论工作随便、不严肃”。B把部分人的表现方式扩大成整类评论的总体风格，还把原本偏正面的意思改成了负面评价。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length</p>\n<p>Theirs was a serious business</p>\n<p>could be trusted to know what they were about</p>\n<p>评论家写得详细而且篇幅很长；这是一件严肃的工作；他们被认为清楚自己在做什么。</p>\n</blockquote>\n<p>原文从头到尾都在强调这些评论的严肃和专业。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The reviewers usually wrote briefly and informally, and treated criticism as a light occupation.</p>\n<p>这些评论通常写得简短而随意，评论工作也被当成一种轻松消遣。</p>\n</blockquote>\n<p>原文强调严肃、详细和专业，B却说风格随意，两边正好相反。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种曾经繁荣、严肃、有分量的报纸艺术评论传统，那么第三段应该继续证明这些评论为什么有质量、为什么值得怀念。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>casual style<br />\n随意的风格</p>\n</blockquote>\n<p>B会把过去的报纸评论写成随便、不够严肃。这样一来，第三段就无法承担“证明过去评论确实有分量”这一作用，也会和原文的<code>Theirs was a serious business</code>直接冲突。</p>\n<p>全文主旨需要第三段把过去的评论写得更有分量，B却把它改成随意风格。这个方向接不上全文的论证。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. elaborate layout</h3>\n<blockquote>\n<p>精心复杂的版式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>elaborate</code>被遮挡，但<code>layout</code>已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>in detail and at length</code>带来的“详细、篇幅长”这种感觉，却把评论内容怎样展开，换成了报纸页面怎样排版。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是版式精心而复杂。</p>\n</blockquote>\n<p>判断C时先看它的中心词：</p>\n<blockquote>\n<p>layout\n版式、排布、页面安排</p>\n</blockquote>\n<p>原文中的<code>in detail and at length</code>说的是评论围绕事件写得多细、篇幅多长。它回答的是“内容怎样展开”。</p>\n<p>版式则需要页面、栏目、字体、位置、排版或视觉组织方面的证据。第三段没有写这些内容。</p>\n<p>即使<code>elaborate</code>和<code>in detail</code>都让人想到“详细、复杂”，它们说的也不是一回事：一个讲内容展开得多细，一个讲页面怎么排。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n<p>Theirs was a serious business</p>\n<p>评论家会围绕事件详细展开，而且把这当成一件严肃的工作。</p>\n</blockquote>\n<p>原文谈的是评论写什么、写得多细，以及这项工作是否严肃，没有转去写页面版式。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The reviews appeared in elaborate page layouts, with carefully designed columns and typography.</p>\n<p>这些评论采用复杂精心的页面版式，栏目和字体都经过细致设计。</p>\n</blockquote>\n<p>原文写内容和工作态度，C却转去说版式安排，方向已经换了。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明评论内容、写作方式或评论家的工作状态。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>elaborate layout<br />\n精心复杂的版式</p>\n</blockquote>\n<p>全文怀念的是评论内容的分量、篇幅和严肃性，第三段也一直在写评论家怎样展开内容、怎样看待这份工作。C却把问题带到了页面、栏目和排版方式上。</p>\n<p>版式复杂不能说明评论内容有分量，也解释不了第三段为什么要写评论家的能力和职业态度。C没有进入全文主旨所在的那条线。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. radical viewpoints</h3>\n<blockquote>\n<p>激进的观点</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。</p>\n<p><strong>错误类型：第二类——用个体细节回答整类特点。</strong></p>\n<p>D抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，普遍以激进观点为特点。</p>\n</blockquote>\n<p>第三段确实引用了Newman一句带有讽刺意味的话。但这句话的明确主体是：</p>\n<blockquote>\n<p>Newman wrote\nNewman写道</p>\n</blockquote>\n<p>它最多先说明Newman个人怎样看待新闻写作和其他作家，不能直接替二战前英国所有报纸评论下一个共同结论。</p>\n<p>而且这段引语的核心是“真正能做好新闻写作的作者很少”，并不是在展示政治、文化或社会立场有多激进。</p>\n<p>所以D同时犯了两步错误：先把个人引语扩大成群体特点，再把尖锐讽刺的语气改写成<code>radical viewpoints</code>。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n<p>这些人把新闻写作看成一种使命，并以在日报发表为荣。</p>\n</blockquote>\n<p>原文借Shaw和Newman说明过去评论家的职业态度和能力，并没有概括他们的政治或文化立场。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Reviewers of the period were known for advancing radical political and cultural views.</p>\n<p>当时的评论家以提出激进的政治和文化观点著称。</p>\n</blockquote>\n<p>原文没有顺着“整类评论家观点激进”往下写，D自然解释不了第三段。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种曾经繁荣、有分量的报纸艺术评论传统，那么第三段应该说明这类评论共有的写作特点和专业水准。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>radical viewpoints<br />\n激进的观点</p>\n</blockquote>\n<p>D抓住了Newman后面的个人引语，却把一个人的说法扩大成了二战前英国报纸评论的共同特点。全文需要第三段证明评论家认真、专业、有能力，并没有把“观点激进”当成这类评论的主线。</p>\n<p>所以，D既没有回答整类评论共有的特点，也不能解释第三段在全文中为什么出现。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. A. free themes.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种命题方式：</p>\n<ul>\n<li>A用<code>free themes</code>概括<code>unfocused newspaper reviews</code>，属于正确同义改写；</li>\n<li>B抓住<code>lightly</code>，却把“不卖弄学问”改成“整类评论随意”；</li>\n<li>C抓住“详细、篇幅长”的感觉，却把内容展开偷换成版式；</li>\n<li>D拿Newman个人引语回答整类评论特点，范围和功能都错了。</li>\n</ul>\n<h2>23题</h2>\n<blockquote>\n<p>Which of the following would Shaw and Newman most probably agree on?<br />\n下面哪个说法最可能是Shaw和Newman都会同意的？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote>\n<p>这里要先分清两类证据：</p>\n<ul>\n<li><code>These men believed... and were proud...</code>是对Shaw和Newman的共同描写；</li>\n<li><code>Newman wrote...</code>是Newman个人的直接引语。</li>\n</ul>\n<p>个人引语不能自动变成两个人共同说过的话，但如果它紧接着前面对两人的共同描写，并且继续展开同一职业态度，就可以作为“最可能共同同意”的推断依据。</p>\n<h3>A. It is writers’ duty to fulfill journalistic goals.</h3>\n<blockquote>\n<p>完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出原文谈的是职业态度和能力，没有出现<code>duty</code>和<code>journalistic goals</code>，因此排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借了<code>calling</code>和<code>serious business</code>里的“认真、使命感”，又往前推成“作家有责任完成一套新闻目标”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>These men believed in journalism as a calling.</p>\n<p>Theirs was a serious business.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家有责任完成新闻写作目标。</p>\n</blockquote>\n<p>原文中的<code>calling</code>可以译为“使命、天职、职业召唤”，说明他们怎样看待新闻工作：这是一件值得认真投入的职业。</p>\n<p>但A又加上了两层原文没有的信息：</p>\n<ul>\n<li><code>writers’ duty</code>：所有作家负有某种责任；</li>\n<li><code>journalistic goals</code>：存在一组需要完成的具体新闻目标。</li>\n</ul>\n<p>文章没有列出这些目标，也没有讨论作家如果不完成目标会怎样。它只是说Shaw和Newman认真看待新闻写作，并认为做好它需要能力。</p>\n<p>从“把一种职业看成使命”推到“作家必须完成某些新闻目标”，中间少了一步原文依据。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n<p>真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。</p>\n</blockquote>\n<p>原文后面强调的是作家有没有能力把新闻写作做好。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Writers have a duty to serve the goals of journalism and should be responsible for fulfilling them.</p>\n<p>作家有责任服务于新闻写作的目标，并应当负责完成这些目标。</p>\n</blockquote>\n<p>原文讨论的是能力门槛，A却转去说责任和目标，后文走的并不是这条线。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该围绕新闻写作的价值、难度或能力要求。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>It is writers’ duty to fulfill journalistic goals.<br />\n完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p>全文和第三段都没有给作家规定一套必须完成的新闻目标。原文写的是两人怎样看待新闻工作，以及做好这项工作需要什么能力；A却把“能力和职业认同”改成了“责任和目标”。</p>\n<p>主旨能够把我们带回“过去评论家有能力、有职业认同”这条线，却补不出A所说的责任要求。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. It is contemptible for writers to be journalists.</h3>\n<blockquote>\n<p>作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>contemptible</code>和原文的<code>contempt</code>被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了<code>a term of contempt</code>，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家去做新闻工作者是一件可鄙的事。</p>\n</blockquote>\n<p>原文确实出现了<code>contempt</code>，但要看是谁在轻蔑谁：</p>\n<blockquote>\n<p>a term of contempt applied by writers who are not read to writers who are\n一个由“没人读的作家”用来称呼“有人读的作家”的轻蔑词</p>\n</blockquote>\n<p>Newman是在讽刺那些把<code>journalism</code>当蔑称的人。他不是认同这个蔑称，更不是说作家从事新闻工作本身可鄙。</p>\n<p>前文还明确写：</p>\n<blockquote>\n<p>These men ... were proud to be published in the daily press.\n这些人以能在日报上发表为荣。</p>\n</blockquote>\n<p>如果两人以日报发表为荣，就不可能同时认为作家做新闻工作者是一件可鄙的事。B把引语中的讽刺对象和评价方向都反了。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n<p>这些人把新闻写作看成一种使命，并以在日报发表为荣。</p>\n</blockquote>\n<p>原文对他们从事新闻写作的态度是正面的。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Shaw and Newman regarded journalism as a contemptible occupation and felt ashamed to be associated with the daily press.</p>\n<p>Shaw和Newman认为新闻工作是一种可鄙的职业，也以自己与日报有关联为耻。</p>\n</blockquote>\n<p>原文写的是“使命”和“自豪”，B却变成“可鄙”和“羞耻”，评价方向正好相反。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该体现他们对新闻写作的正面职业认同。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>It is contemptible for writers to be journalists.<br />\n作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p>第三段把两人写成以在日报发表为荣，也把新闻写作当成一项严肃工作。B却把这种正面态度改成轻蔑和羞耻，刚好把方向翻了过来。</p>\n<p>如果B成立，第三段就无法用两人的职业认同来证明旧式评论有分量。它与局部原文和全文主旨都冲突。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Writers are likely to be tempted into journalism.</h3>\n<blockquote>\n<p>作家很可能受到诱惑而进入新闻业</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能够根据主语和动作关系排除C，不需要知道<code>contempt</code>的含义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住<code>tempted</code>、<code>writers</code>和<code>journalism</code>三个原文词，却把它们从原来的语法位置中拆开，重新拼成“作家被诱惑进入新闻业”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as ...</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家很容易被吸引进新闻业。</p>\n</blockquote>\n<p>原文的结构是：</p>\n<ul>\n<li>主语：<code>I</code>，指Newman；</li>\n<li>谓语：<code>am tempted</code>，忍不住、很想；</li>\n<li>后面的动作：<code>to define</code>，去定义；</li>\n<li>被定义的对象：<code>journalism</code>这个词。</li>\n</ul>\n<p>所以原文的意思是：</p>\n<blockquote>\n<p>Newman忍不住想给“journalism”下一个定义。</p>\n</blockquote>\n<p>C却把主语换成<code>Writers</code>，把<code>to define journalism</code>改成<code>into journalism</code>，动作也从“定义一个词”变成“进入一种职业”。</p>\n<p>这些词都来自原文，但原句的语法关系已经被彻底打散。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>I am tempted to define “journalism” as ...</p>\n<p>我忍不住想把“新闻写作”定义为……</p>\n</blockquote>\n<p>原文里的<code>tempted</code>说的是Newman忍不住想下一个定义，并没有继续讨论作家为什么进入新闻业。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Writers are often tempted to enter journalism because the daily press offers them fame, income and a large readership.</p>\n<p>作家常常受到诱惑进入新闻业，因为日报能够给他们名声、收入和大量读者。</p>\n</blockquote>\n<p>原文写的是“想给一个词下定义”，C却改成“受到诱惑进入一个行业”，动作完全不同。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么两人最可能共同同意的内容应该落在新闻写作的能力或职业价值上。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>Writers are likely to be tempted into journalism.<br />\n作家很可能受到诱惑而进入新闻业</p>\n</blockquote>\n<p>全文没有讨论作家为什么进入新闻业，也没有讨论这种职业对作家的吸引力。C只是拿了<code>tempted</code>和<code>journalism</code>两个原词，重新拼成了一件新事情。</p>\n<p>“新闻写作需要能力”和“作家容易被诱惑进入新闻业”不是同一条线。C无法回答两人的共同观点，也接不上第三段在全文中的作用。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Not all writers are capable of journalistic writing.</h3>\n<blockquote>\n<p>并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>D把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。</p>\n</blockquote>\n<p>原文中的核心结构是：</p>\n<blockquote>\n<p>so few authors have brains enough or literary gift enough\n很少有作者具备足够的头脑或文学天赋</p>\n</blockquote>\n<p>后面又限定了这些能力的用途：</p>\n<blockquote>\n<p>to keep their own end up in journalism\n在新闻写作中站稳脚跟、胜任这项工作</p>\n</blockquote>\n<p>“真正做得到的人很少”，自然可以推出“并不是所有作家都做得到”。D没有增加新的能力类型，也没有把程度夸大成“没有作家做得到”。</p>\n<p>本题还要处理两个人的问题。引语确实是Newman说的，但前面先把Shaw和Newman放在同一组里：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n</blockquote>\n<p>作者先给出两人的共同职业态度，再用Newman的引语把“新闻写作需要真本事”说得更具体。题干问的是<code>most probably agree on</code>，不是问两人是否分别说过同一句原话，因此这种共同描写加代表性引语可以支持D。</p>\n<h4>写作视角法</h4>\n<p>原文第三段是这样写的：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n<p>真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。</p>\n</blockquote>\n<p>原文这句话直接给新闻写作设了一道能力门槛。</p>\n<p>如果D真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Only writers with sufficient intelligence and literary talent can do journalistic writing well.</p>\n<p>只有具备足够头脑和文学天赋的作家，才能做好新闻写作。</p>\n</blockquote>\n<p>Newman这段引语表达的正是这一点，所以D和原文的展开方式一致。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的是：新闻写作不是谁都能做好，它需要足够的头脑和文学才能。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>Not all writers are capable of journalistic writing.<br />\n并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p>D正好概括了这道能力门槛。Newman的引语明确说，真正有足够头脑和文学才能、能够在新闻写作中撑住的作者很少；前文又把Shaw和Newman一起写成认真对待新闻工作、清楚自己在做什么的人。</p>\n<p>主旨不能代替这两处局部证据，但它能说明第三段为什么要写这些内容：作者正是在用两人证明过去的评论家有能力、有分量。D与题干、局部原文和全文作用都能接上。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. D. Not all writers are capable of journalistic writing.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别利用了不同陷阱：</p>\n<ul>\n<li>A把<code>calling</code>脑补成作家的责任和具体新闻目标；</li>\n<li>B抓住<code>contempt</code>，却把Newman讽刺别人使用蔑称，改成他自己轻蔑新闻工作；</li>\n<li>C抓住<code>tempted</code>和<code>journalism</code>，但把原句主语、动作和语法位置全部换掉；</li>\n<li>D把“很少作者有能力做好”合理推成“并非所有作家都有能力”，并能与两人的共同描写接上。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>What can be learned about Cardus according to the last two paragraphs?<br />\n根据最后两段，关于Cardus可以知道什么？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p>\n<p>Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p>\n</blockquote>\n<p>最后两段共同建立的方向是：Cardus生前很受重视，现在却几乎被遗忘；现代读者不再喜欢他擅长的文体，因此复兴希望很小。</p>\n<h3>A. His music criticism may not appeal to readers today.</h3>\n<blockquote>\n<p>他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第4、5段已经能够直接支持A，所以第一轮就选择A。</p>\n<p><strong>选项类型：正确的跨句概括。</strong></p>\n<p>A把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的音乐评论今天可能不太吸引读者。</p>\n</blockquote>\n<p>A中的<code>may not appeal to</code>不是说绝对没有人喜欢，而是说对今天读者的吸引力可能不足。原文也保持了同样的谨慎程度：</p>\n<blockquote>\n<p>The prospect seems remote.\n复兴前景似乎很渺茫。</p>\n</blockquote>\n<p>后面又解释原因：</p>\n<blockquote>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n后现代读者不太需要、也不太欣赏他所擅长的华丽维多利亚—爱德华式文体</p>\n</blockquote>\n<p>Cardus的音乐评论正是用这种文体写成。现代读者不喜欢这种写法，自然可以推出他的音乐评论今天可能缺乏吸引力。</p>\n<p>A没有把<code>remote</code>夸大成“绝无可能”，也没有把<code>little use</code>夸大成“所有读者都讨厌”，程度与原文一致。</p>\n<h4>写作视角法</h4>\n<p>原文最后两段是这样写的：</p>\n<blockquote>\n<p>Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized</p>\n<p>Cardus的评论复兴前景渺茫，后现代读者也不再欣赏他所擅长的文体。</p>\n</blockquote>\n<p>原文直接把现代读者的审美变化，和Cardus很难复兴这件事接在了一起。</p>\n<p>如果A真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Cardus’s music criticism is unlikely to regain a broad modern readership because contemporary readers have little taste for his prose style.</p>\n<p>Cardus的音乐评论不太可能重新获得广泛的现代读者，因为当代读者不喜欢他的文体。</p>\n</blockquote>\n<p>最后两段就是这样展开的，A与原文的写法一致。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus把旧式艺术评论由盛转衰落到一个具体人物身上，那么最后两段最可能说明的是：他过去很受推崇，但今天的读者已经不太接受他的音乐评论或文风。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>His music criticism may not appeal to readers today.<br />\n他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p>A把Cardus在全文中的作用概括得很准。第4段写他过去的地位和影响，第5段写现代读者不再喜欢他的文风，并直接判断复兴前景渺茫。</p>\n<p>A没有说他的评论完全无人阅读，只用了<code>may not appeal</code>这种较为谨慎的表达。它与最后两段的具体内容一致，也和全文由盛转衰的主线一致。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. His reputation as a music critic has long been in dispute.</h3>\n<blockquote>\n<p>他作为音乐评论家的声誉长期存在争议</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>dispute</code>恢复以后，已经能看出原文写的是“生前广受赞赏、后来被遗忘”，而不是“长期有争议”，因此排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用“新闻品味改变”“如今被遗忘”这些变化信息，让人脑补Cardus的音乐评论家声誉长期受到争论。但文章没有写任何赞成与反对双方。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a stylist so widely admired</p>\n<p>these critics are virtually forgotten</p>\n<p>Journalistic tastes had changed long before his death</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus作为音乐评论家的声誉长期存在争议。</p>\n</blockquote>\n<p><code>in dispute</code>表示他的能力、地位或声誉长期被人争论：有人认可，也有人否定，双方意见不一致。</p>\n<p>但原文给出的时间线是：</p>\n<ul>\n<li>生前：<code>widely admired</code>，广受赞赏；</li>\n<li>1967年：成为第一位获封爵士的音乐评论家；</li>\n<li>现在：作品大多绝版，音乐文章除专家外几乎无人知晓。</li>\n</ul>\n<p>这里写的是“过去受推崇，后来被遗忘”，不是“长期有人支持、有人反对”。</p>\n<p><code>Journalistic tastes had changed long before his death</code>说的是新闻写作口味变了，也不等于他的声誉从此陷入争议。品味变化可以让一种风格过时，却不会自动产生<code>dispute</code>。</p>\n<h4>写作视角法</h4>\n<p>原文第4段是这样写的：</p>\n<blockquote>\n<p>a stylist so widely admired that his Autobiography became a best-seller</p>\n<p>He was knighted in 1967</p>\n<p>他的文笔广受赞赏，《自传》成为畅销书，他还在1967年获封爵士。</p>\n</blockquote>\n<p>原文先写他生前得到广泛认可，随后才转到他后来逐渐被遗忘。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>His reputation as a music critic remained controversial for decades, with admirers and critics sharply divided over his work.</p>\n<p>几十年来，他作为音乐评论家的声誉一直存在争议，赞赏者和批评者对他的作品分歧明显。</p>\n</blockquote>\n<p>原文没有写长期争议，B需要的这条展开线并不存在。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus说明一种旧式艺术评论怎样从公众中心退到边缘，那么最后两段应该写他的过去成就、今天的失落，以及这种变化为什么发生。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>His reputation as a music critic has long been in dispute.<br />\n他作为音乐评论家的声誉长期存在争议</p>\n</blockquote>\n<p>全文写的是Cardus生前广受赞赏，后来逐渐被遗忘。这里的变化是“过去有名、今天失落”，并没有出现长期争议，也没有写支持者和反对者一直围绕他的声誉争论。</p>\n<p>B给Cardus补出了一条文章没有的冲突线。它既不能概括最后两段，也接不上全文由盛转衰的主旨。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. His style caters largely to modern specialists.</h3>\n<blockquote>\n<p>他的风格主要迎合现代专家</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>the richly upholstered Vicwardian prose in which he specialized</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的写作风格主要迎合现代专家。</p>\n</blockquote>\n<p>先看第一处：</p>\n<blockquote>\n<p>unknown save to specialists\n除专家外几乎无人知晓</p>\n</blockquote>\n<p>它回答的是“今天还有谁知道他的音乐著作”。这是作品传播范围的结果。</p>\n<p>再看C中的：</p>\n<blockquote>\n<p>caters largely to modern specialists\n主要迎合、服务于现代专家</p>\n</blockquote>\n<p>它回答的是“这种风格原本为谁设计、想满足谁”。这是作者写作对象和目的。</p>\n<p>作品后来只剩专家知道，不等于作者写作时主要迎合专家。一个作品从大众视野中退出以后只在专业圈流传，可能只是被动的小众化，不是主动写给专家。</p>\n<p>第二处<code>the richly upholstered Vicwardian prose</code>只说明Cardus擅长怎样的文体；原文紧接着说的是<code>postmodern readers have little use for</code>，也就是现代大众不喜欢它，而不是专家特别喜欢它。</p>\n<h4>写作视角法</h4>\n<p>原文最后两段是这样写的：</p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized</p>\n<p>现在除专家外几乎没人知道他的音乐著作，现代读者也不喜欢他的旧式文体。</p>\n</blockquote>\n<p>原文只说明现在还有谁知道他的文章，以及普通读者为什么不再接受这种文体，没有说他主动迎合专家。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Cardus deliberately developed a specialized prose style for modern experts, and his writing continues to satisfy this professional readership.</p>\n<p>Cardus有意为现代专家发展出一种专业化文体，他的文章至今仍主要满足这一专业读者群的需要。</p>\n</blockquote>\n<p>原文写的是传播范围缩小和大众审美变化，C却说他主动迎合专家，两者不是同一种关系。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus说明旧式艺术评论怎样退出大众视野，那么最后两段最可能写的是：他的作品后来只剩少数专家接触，普通读者已经不太接受这种文风。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>His style caters largely to modern specialists.<br />\n他的风格主要迎合现代专家</p>\n</blockquote>\n<p>主旨说的是一种被动的变化：原本面向公众的评论逐渐失去普通读者，最后只剩专家还知道。C却把它改成主动写作选择，好像Cardus本来就在按现代专家的口味写。</p>\n<p>“后来只有专家还知道”和“写作风格主要迎合专家”不是一回事。C把传播结果改成了写作目的，因此和全文主旨不一致。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. His writings fail to follow the amateur tradition.</h3>\n<blockquote>\n<p>他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经通过主语错位排除D。原文主语是<code>the amateur tradition</code>，D却把主语换成<code>His writings</code>。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>amateur tradition</code>这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的文章没有遵循业余音乐评论传统。</p>\n</blockquote>\n<p>原文的主语是：</p>\n<blockquote>\n<p>the amateur tradition in music criticism\n音乐评论中的业余传统</p>\n</blockquote>\n<p>原文的谓语是：</p>\n<blockquote>\n<p>has been in headlong retreat\n正在迅速退却</p>\n</blockquote>\n<p>也就是说，作者在解释一种行业传统的整体处境：这种传统越来越没有生存空间。</p>\n<p>D却把主语换成<code>His writings</code>，再增加<code>fail to follow</code>，变成Cardus个人是否遵循传统的问题。文章没有拿Cardus的文章与这套传统的规则逐条比较，也没有说他违背传统。</p>\n<p>实际上，Cardus在全文中恰恰被当作这种旧式业余评论传统的代表人物，而不是背离者。</p>\n<h4>写作视角法</h4>\n<p>原文第5段是这样写的：</p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n<p>音乐评论中的业余传统一直在急速衰退。</p>\n</blockquote>\n<p>原文是在解释：承载Cardus这种评论方式的传统本身正在退场。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Cardus departed from the amateur tradition of music criticism, and his writings failed because they did not follow its established principles.</p>\n<p>Cardus背离了音乐评论的业余传统，他的文章之所以失败，是因为没有遵循这套传统的既定原则。</p>\n</blockquote>\n<p>原文写的是“传统正在衰退”，D却改成“Cardus没有遵循传统”，主语和因果方向都不一样。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus作为旧式业余评论传统的代表，那么最后两段应该说明这类传统正在退却，以及Cardus为什么难以重新回到公众视野。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>His writings fail to follow the amateur tradition.<br />\n他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p>Cardus在全文中代表的正是这种旧式评论传统。原文说的是<code>the amateur tradition</code>本身在迅速退却，并没有说Cardus的文章背离了这套传统。</p>\n<p>D把“传统正在消失”改成“Cardus没有遵循传统”，主语和关系都换了，也和这个人物在全文中的作用相反。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. A. His music criticism may not appeal to readers today.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种关系：</p>\n<ul>\n<li>A把“复兴希望渺茫”和“现代读者不喜欢其文体”合并成谨慎概括；</li>\n<li>B把“过去受赞赏、后来被遗忘”脑补成长期有争议；</li>\n<li>C把“只剩专家知道”改成“主动迎合专家”；</li>\n<li>D把“传统本身在退却”改成“Cardus没有遵循传统”。</li>\n</ul>\n<h2>五题答案</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>题号</th>\n  <th>21</th>\n  <th>22</th>\n  <th>23</th>\n  <th>24</th>\n  <th>25</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>答案</td>\n  <td>B</td>\n  <td>A</td>\n  <td>D</td>\n  <td>A</td>\n  <td>B</td>\n</tr>\n</tbody>\n</table></div>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<h2>段落与全文逻辑框架</h2>\n<p><strong>逻辑层次1：英语报纸艺术评论的衰落现状</strong>（段落1核心论点） 所有英语报纸在过去25年发生了许多变化→【其中影响最深远的变化：（艺术报道的范围和严肃性的持续下降）】</p>\n<p>↓（进一步细化支持：当前读者视角）</p>\n<p><strong>逻辑层次2：现在与过去的对比</strong>（段落2进一步说明） 年轻读者难以想象→（过去大城市报纸存在高质量的艺术评论）+ （20世纪重要的评论文集多数来自报纸）→（今天读这些书会惊讶于：（如此学术内容曾经适合大众报纸））</p>\n<p>↓（进一步细化历史背景说明）</p>\n<p><strong>逻辑层次3：二战前英国报纸评论的黄金时代</strong>（段落3历史具体情况说明） 我们现在更难想象→（20世纪初至二战前英国报纸的艺术评论：（详尽且风格优雅，被视作报纸的装饰））→【当时评论家被认为：（应详细严肃地撰写报道）+（评论工作是严肃的）+（萧伯纳、纽曼这样的评论家值得信赖）+（他们视新闻业为使命并为在日报发表而自豪）+（纽曼的观点：&quot;新闻业&quot;被不受欢迎作家用于贬低受欢迎作家）】</p>\n<p>→（举例说明当代境况，与历史形成对比）</p>\n<p><strong>逻辑层次4：被遗忘的评论家——以卡德斯为例</strong>（段落4具体例子举证） 遗憾的是，这些评论家被遗忘了→【例如Neville Cardus：（曾是英国著名古典音乐评论家，文风广受赞赏）+（1967年获爵士荣誉）// （今天只因板球散文闻名）+（仅一本书在印刷，其音乐评论鲜为人知，仅限于专家）】</p>\n<p>↑（整体反思与总结）</p>\n<p><strong>逻辑层次5：复兴无望的原因</strong>（段落5对整体趋势的反思总结） 提出疑问：（Cardus的评论能否再度流行？）→答案：（可能性渺茫）→原因：（新闻品味早已改变）+（当代读者不喜欢他的华丽文风）+（音乐评论业余传统逐渐消退）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：英语报纸的艺术评论经历了从黄金时代到持续衰落的历程，曾经博学深邃、风格优雅的评论传统已经消失，优秀评论家被遗忘，在当代文化环境下复兴无望。</p>\n<h2>小标题题</h2>\n<h3>题目</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p><strong>A. An Unlikely Route into Cultural Journalism</strong></p>\n<p><strong>B. Portraits More Vivid than Technical Analysis</strong></p>\n<p><strong>C. A Conservative Taste with Mixed Results</strong></p>\n<p><strong>D. Changing Journalism Leaves an Old Critic Behind</strong></p>\n<p><strong>E. Why Cardus May Still Matter</strong></p>\n<p><strong>F. Formal Training behind a Critical Career</strong></p>\n<p><strong>G. Leaving Cricket Behind for a Musical Career</strong></p>\n<h2>The Amateur as Critic</h2>\n<p>English-language newspapers have steadily reduced the scope and seriousness of their arts coverage. Some papers have abolished book-review sections; others no longer employ full-time classical-music critics, while cultural think pieces have faded from Sunday pages. Earlier generations could expect major papers to publish lengthy, knowledgeable criticism, and many important twentieth-century collections were drawn from newspaper reviews. Yet the critics who produced this work are now largely forgotten. Neville Cardus, once one of England's foremost classical-music critics and the first music critic to be knighted, is remembered mainly for his writing on cricket. Even such honors did not protect his work from later obscurity.</p>\n<h3>41. __________</h3>\n<p>The bare facts of Cardus's life were remarkable. Born in Manchester in 1889, the illegitimate son of a part-time prostitute, he completed only four years of formal schooling. A self-taught writer who earned his youthful keep as a cricket professional, he talked his way onto the <em>Manchester Guardian</em>'s staff. Within two years he became its chief cricket writer; from 1927 he also served as chief music critic, reviewing concerts as “N.C.” while continuing to cover cricket. His path into cultural journalism was therefore anything but conventional.</p>\n<h3>42. __________</h3>\n<p>In both roles, Cardus was chiefly interested in colorful personalities. He wrote about musicians as he wrote about cricketers, using impressionistic description and polished anecdotes. At Salzburg he pictured Thomas Beecham interrupting a restaurant orchestra so that he could explain Schubert without the “damned strumming.” Whether every scene happened exactly as Cardus told it mattered less than the effect. Technical specificity was often scarce, but his images were so vivid that readers grasped the character of a performer at once.</p>\n<h3>43. __________</h3>\n<p>Cardus's taste also limited him. A romantic who cared mainly for late-eighteenth- and nineteenth-century music, he often met modernism with complacent incomprehension. He dismissed Bartók as tedious and crude, mocked Gershwin, and found even accessible modern works needlessly restless. Yet the same instincts allowed him to recognize Mahler's greatness early and to defend Elgar when younger musicians treated him as merely quaint. His conservatism produced both serious blind spots and strikingly farsighted judgments.</p>\n<h3>44. __________</h3>\n<p>By the end of his career, a lifetime of reaction had weakened Cardus's credibility. Some of his later attacks on avant-garde music now sound perceptive, but few readers were willing to listen after so many earlier dismissals. His editors became less sympathetic and gave him less space; one concert notice was simply cut in half. More broadly, the amateur tradition in music criticism was retreating, and critics were increasingly expected to possess the technical training that Cardus's generation had disdained.</p>\n<h3>45. __________</h3>\n<p>A broad revival still seems unlikely. Journalistic tastes have changed, and modern readers have little patience for Cardus's richly upholstered prose. Even so, a well-edited selection of his concert reviews might introduce him to a new generation. He took music with complete seriousness and believed that meaningful criticism should reflect the workings of the human soul. Something vital disappears when critics refuse to approach music in this way. His romanticism may be unfashionable, but the force and humanity of his best writing remain difficult to dismiss.</p>\n<h3>解析</h3>\n<h4>41题</h4>\n<p>【答案】A. An Unlikely Route into Cultural Journalism</p>\n<blockquote>\n<p>以一条不同寻常的道路进入文化新闻业</p>\n</blockquote>\n<p>这一部分先交代Cardus的出身，再顺着写他怎样走到音乐评论这个位置。</p>\n<p>开头先交代他的起点：</p>\n<blockquote>\n<p>the illegitimate son of a part-time prostitute<br />\nonly four years of formal schooling</p>\n</blockquote>\n<p>随后，文章把身世接到职业路径上：</p>\n<blockquote>\n<p>a self-taught writer<br />\nearned his youthful keep as a cricket professional<br />\ntalked his way onto the <em>Manchester Guardian</em>'s staff</p>\n</blockquote>\n<p>最后又写，他先成为首席板球记者，后来同时担任音乐评论家，而且并没有停止报道板球。</p>\n<p>所以这一段的完整路线是：</p>\n<blockquote>\n<p>出身和教育都很不典型<br />\n→ 靠自学与板球工作进入报社<br />\n→ 从板球记者走到音乐评论家</p>\n</blockquote>\n<p>A中的<code>Unlikely Route</code>对应这条反常规路径，<code>Cultural Journalism</code>则对应他最终进入报纸艺术评论领域。</p>\n<p>最容易混淆的是G，但G说他“离开板球去做音乐”，原文恰恰写的是他继续同时报道板球和音乐。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. A</strong></p>\n</blockquote>\n<h4>42题</h4>\n<p>【答案】B. Portraits More Vivid than Technical Analysis</p>\n<blockquote>\n<p>比技术分析更鲜活的人物描写</p>\n</blockquote>\n<p>这一部分先给出Cardus写评论的基本方式：</p>\n<blockquote>\n<p>interested in colorful personalities<br />\nimpressionistic description and polished anecdotes</p>\n</blockquote>\n<p>他先抓人物和场景，不急着堆技术术语。随后，作者用Beecham在餐厅里的轶事来展示这种写法：场景一出来，人物性格也跟着出来了。</p>\n<p>段尾又明确说明：</p>\n<blockquote>\n<p>Technical specificity was often scarce<br />\nhis images were so vivid that readers grasped the character of a performer at once</p>\n</blockquote>\n<p>段尾说得很清楚：技术细节不多，人物画像却很鲜明。</p>\n<p>B中的<code>Portraits More Vivid</code>对应人物、场景和比喻的鲜活，<code>than Technical Analysis</code>对应技术细节的缺席。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. B</strong></p>\n</blockquote>\n<h4>43题</h4>\n<p>【答案】C. A Conservative Taste with Mixed Results</p>\n<blockquote>\n<p>既带来误判、也带来先见的保守审美</p>\n</blockquote>\n<p>这一部分先写Cardus的审美边界：</p>\n<blockquote>\n<p>cared mainly for late-eighteenth- and nineteenth-century music<br />\nmet modernism with complacent incomprehension</p>\n</blockquote>\n<p>接着给出负面结果：他贬低Bartók、嘲讽Gershwin，对不少现代作品判断失准。</p>\n<p>但作者没有停在“他很保守，所以全错”。后半段马上转回来：</p>\n<blockquote>\n<p>recognize Mahler's greatness early<br />\ndefend Elgar when younger musicians treated him as merely quaint</p>\n</blockquote>\n<p>同一套浪漫主义审美，一方面让他看不懂现代主义，另一方面又让他比别人更早看出Mahler和Elgar的价值。</p>\n<p>这一段既写了保守带来的误判，也写了少数有远见的判断：</p>\n<blockquote>\n<p>保守审美<br />\n→ 造成严重盲点<br />\n// 也产生少数有远见的判断</p>\n</blockquote>\n<p>C中的<code>Mixed Results</code>正好覆盖这种一负一正的结果。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. C</strong></p>\n</blockquote>\n<h4>44题</h4>\n<p>【答案】D. Changing Journalism Leaves an Old Critic Behind</p>\n<blockquote>\n<p>新闻环境变化，把旧式评论家甩在了后面</p>\n</blockquote>\n<p>这一部分从Cardus个人喜欢什么音乐，转到他晚年影响力为什么下降。</p>\n<p>文章先说：</p>\n<blockquote>\n<p>a lifetime of reaction had weakened Cardus's credibility</p>\n</blockquote>\n<p>随后给出报社层面的变化：</p>\n<blockquote>\n<p>increasingly unsympathetic editors gave him less space<br />\none concert notice was simply cut in half</p>\n</blockquote>\n<p>最后把人物遭遇扩大到整个行业：</p>\n<blockquote>\n<p>the amateur tradition in music criticism was retreating<br />\ncritics were increasingly expected to possess technical training</p>\n</blockquote>\n<p>所以这一段的逻辑是：</p>\n<blockquote>\n<p>个人长期反现代造成信誉损耗</p>\n<ul>\n<li>报纸版面和编辑态度改变</li>\n<li>评论行业越来越专业化<br />\n→ Cardus这类旧式评论家被时代甩开</li>\n</ul>\n</blockquote>\n<p>D同时覆盖了<code>Changing Journalism</code>和<code>Leaves an Old Critic Behind</code>两层。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. D</strong></p>\n</blockquote>\n<h4>45题</h4>\n<p>【答案】E. Why Cardus May Still Matter</p>\n<blockquote>\n<p>Cardus今天为什么仍可能有价值</p>\n</blockquote>\n<p>这一部分先承认现实：</p>\n<blockquote>\n<p>A broad revival still seems unlikely<br />\nmodern readers have little patience for Cardus's richly upholstered prose</p>\n</blockquote>\n<p>如果只看这里，标题似乎可以停在“复兴无望”。但后文紧接着换了方向：</p>\n<blockquote>\n<p>a well-edited selection ... might introduce him to a new generation</p>\n</blockquote>\n<p>作者随后把重点放到Cardus的价值上：</p>\n<blockquote>\n<p>criticism should reflect the workings of the human soul<br />\nSomething vital disappears when critics refuse to approach music in this way</p>\n</blockquote>\n<p>所以这一段的中心是：复兴很难，但他的评论所保留的人性、感受力和对音乐的严肃态度仍有价值。</p>\n<p>E中的<code>May Still Matter</code>正好保留了这种谨慎而肯定的结论。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. E</strong></p>\n</blockquote>\n<h2>排序题</h2>\n<h3>题目</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. <strong>Paragraphs A, E, and H have been correctly placed.</strong> Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p><strong>A.</strong> His background made that achievement all the more remarkable. Born in Manchester in 1889, Cardus was the illegitimate son of a part-time prostitute and completed only four years of formal schooling. That such a boy became a music critic for the <em>Guardian</em> was improbable; that he began as the paper's cricket correspondent and continued covering the game after taking over its music beat was more improbable still.</p>\n<p><strong>B.</strong> Perhaps the incident happened exactly as Cardus described it, perhaps not. What mattered was his gift for conveying the essence of a musician in a vivid image. Toscanini's Brahms sounded like “a gigantic musical wheel revolving in a ruthless groove,” while Kreisler's violin playing recalled “a beautiful face” that might be lovelier if lined or wrinkled. Technical detail was often absent, yet the reader understood his point immediately.</p>\n<p><strong>C.</strong> A self-taught writer who earned his youthful keep as a public-school cricket professional, Cardus talked his way onto the <em>Guardian</em>'s staff when the paper prided itself on extensive arts coverage. Within two years he became its chief cricket writer. From 1927 on, music was his other beat, and he reviewed concerts as “N.C.” in the same elaborate style he used as “Cricketer.”</p>\n<p><strong>D.</strong> Neville Cardus, who wrote for the <em>Manchester Guardian</em> from 1917 until shortly before his death in 1975, is now remembered chiefly for his essays on cricket. During his lifetime, however, he was one of England's foremost classical-music critics, a stylist so widely admired that his <em>Autobiography</em> became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet almost all his music writing is now out of print. How did so celebrated a critic fall into near-total obscurity?</p>\n<p><strong>E.</strong> In both roles, Cardus cared most about colorful personalities. He wrote about musicians as he wrote about cricketers, sketching character through impressionistic description and polished anecdotes. At the Salzburg Festival he recalled Thomas Beecham stopping a restaurant orchestra and demanding, “How can I demonstrate to my learned friend here the beauties of Schubert's music if that damned strumming goes on perpetually?”</p>\n<p><strong>F.</strong> Could Cardus enjoy a revival? The prospect seems remote: journalistic tastes changed, modern readers have little use for his richly upholstered prose, and critics are now expected to possess the technical training his generation disdained. Still, a well-edited collection might find new readers. Something vital disappears when criticism no longer treats music as an expression of human character and feeling.</p>\n<p><strong>G.</strong> But Cardus's taste was deeply conservative. He cared mainly for late-eighteenth- and nineteenth-century music and often met modernism with complacent incomprehension, dismissing Bartók as tedious and crude. Yet he was early to recognize Mahler's greatness and consistently defended Elgar. His instincts could therefore make him both badly mistaken and unexpectedly prescient.</p>\n<p><strong>H.</strong> Cardus wrote that way partly because he had to. His musical training amounted to a year of voice lessons, and his contempt for “score-reading critics” suggests that his technical abilities were limited. But his responsiveness to music was extraordinary. He believed the critic's full-time task was to listen with a highly sensitized mind, guided by psychological and aesthetic insight.</p>\n<p><strong>41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____</strong></p>\n<h4>解析</h4>\n<p>这是一道8段排序题，其中A、E、H三个段落的位置已经给出。先不急着逐空填，我们先把八段分别在做什么看清：</p>\n<ul>\n<li>D：先提出Cardus生前著名、今天被遗忘的矛盾；</li>\n<li>A：补他的身世与极不寻常的起点；</li>\n<li>C：说明他怎样进入《卫报》，同时形成板球和音乐两重身份；</li>\n<li>E：写他在两种写作中共同采用的人物化、故事化方式；</li>\n<li>B：解释这种写法为什么有效；</li>\n<li>H：说明这种写法与他有限的技术训练、强调“倾听”的批评观有关；</li>\n<li>G：转向局限，分析他的保守审美；</li>\n<li>F：回到今天，判断复兴前景并总结这种批评的价值。</li>\n</ul>\n<p>全文的组织顺序是：</p>\n<blockquote>\n<p>先提出“著名评论家为何被遗忘”<br />\n→ 追溯身世<br />\n→ 交代职业形成<br />\n→ 展示写作方式<br />\n→ 解释写作方式<br />\n→ 说明能力来源<br />\n→ 分析审美局限<br />\n→ 回到复兴与遗产</p>\n</blockquote>\n<p>因此，完整顺序为：</p>\n<blockquote>\n<p><strong>D → A → C → E → B → H → G → F</strong></p>\n</blockquote>\n<h4>41题</h4>\n<p>【答案】D</p>\n<p>41题位于已知A段之前，也就是全文第一段。</p>\n<p>先看A段开头：</p>\n<blockquote>\n<p>His background made that achievement all the more remarkable.</p>\n</blockquote>\n<p><code>that achievement</code>要回指前文已经提到的成就，A段自己没有先交代。</p>\n<p>D段正好先交代：</p>\n<blockquote>\n<p>one of England's foremost classical-music critics<br />\na stylist so widely admired that his <em>Autobiography</em> became a best-seller</p>\n</blockquote>\n<p>然后D段又提出全文要解释的问题：</p>\n<blockquote>\n<p>How did so celebrated a critic fall into near-total obscurity?</p>\n</blockquote>\n<p>这样两段就能连成：</p>\n<blockquote>\n<p>D：先写Cardus曾经多成功、如今多被遗忘<br />\n↓<br />\nA：他的出身让这种成功显得更加不可思议</p>\n</blockquote>\n<p>D还负责第一次引出人物和全文问题，具有明显的首段功能。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. D</strong></p>\n</blockquote>\n<h4>42题</h4>\n<p>【答案】C</p>\n<p>42题位于已知A段和已知E段之间。</p>\n<p>A段最后说，Cardus从板球记者走到了音乐评论家，而且两项工作长期并行。接下来需要一段把这条职业路径具体展开。</p>\n<p>C段正好说明：</p>\n<blockquote>\n<p>talked his way onto the <em>Guardian</em>'s staff<br />\nbecame its chief cricket writer<br />\nmusic was his other beat</p>\n</blockquote>\n<p>更关键的是，后面的已知E段一开头就是：</p>\n<blockquote>\n<p>In both roles, Cardus cared most about colorful personalities.</p>\n</blockquote>\n<p><code>both roles</code>只能指前文已经明确出现的两种角色。C段刚刚把它们说清楚：</p>\n<blockquote>\n<p>chief cricket writer</p>\n<ul>\n<li>music critic</li>\n</ul>\n</blockquote>\n<p>所以三段的关系是：</p>\n<blockquote>\n<p>A：这一双重职业很不寻常<br />\n↓<br />\nC：具体交代双重职业怎样形成<br />\n↓<br />\nE：分析他在两种角色中的共同写法</p>\n</blockquote>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. C</strong></p>\n</blockquote>\n<h4>43题</h4>\n<p>【答案】B</p>\n<p>43题位于已知E段和已知H段之间。</p>\n<p>E段最后给出Beecham在餐厅叫停乐队的故事。B段开头马上说：</p>\n<blockquote>\n<p>Perhaps the incident happened exactly as Cardus described it, perhaps not.</p>\n</blockquote>\n<p>这里的<code>the incident</code>只能回指E段刚讲完的那个具体轶事，因此B必须紧跟E。</p>\n<p>B接着从这个故事抽出Cardus的写作特点：</p>\n<blockquote>\n<p>convey the essence of a musician in a vivid image<br />\nTechnical detail was often absent</p>\n</blockquote>\n<p>再看后面的已知H段：</p>\n<blockquote>\n<p>Cardus wrote that way partly because he had to.</p>\n</blockquote>\n<p><code>that way</code>又回指B段刚刚概括的“用鲜明比喻代替技术细节”的写法。前后三段正好接上：</p>\n<blockquote>\n<p>E：先给一个故事<br />\n↓<br />\nB：评价这个故事代表的写作方式<br />\n↓<br />\nH：解释他为什么会这样写</p>\n</blockquote>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. B</strong></p>\n</blockquote>\n<h4>44题</h4>\n<p>【答案】G</p>\n<p>44题位于已知H段之后。</p>\n<p>H段先承认Cardus技术训练有限，但强调他的感受力和“倾听”观念。下一段如果继续谈优点，会让文章停在单向赞扬；原文此处实际要转向他的局限。</p>\n<p>G段一开头的<code>But</code>正好完成这个转折：</p>\n<blockquote>\n<p>But Cardus's taste was deeply conservative.</p>\n</blockquote>\n<p>随后G段把这种保守审美的两面写出来：</p>\n<ul>\n<li>对Bartók等现代音乐判断失准；</li>\n<li>却较早看出Mahler和Elgar的价值。</li>\n</ul>\n<p>H先讲这套写法从哪里来，G接着转向它的局限：</p>\n<blockquote>\n<p>H：解释他的独特能力从哪里来<br />\n//<br />\nG：转过来说明这套能力同时有什么边界</p>\n</blockquote>\n<p>F段则从人物能力转向“今天还能否复兴”，所以G放在H和F之间最自然。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. G</strong></p>\n</blockquote>\n<h4>45题</h4>\n<p>【答案】F</p>\n<p>45题是全文最后一段。</p>\n<p>前面的G段已经把Cardus的优点和局限都说完，末段应该回到D段开头提出的总问题：</p>\n<blockquote>\n<p>一个曾经如此著名的评论家，今天还有没有可能重新被阅读？</p>\n</blockquote>\n<p>F段直接提出：</p>\n<blockquote>\n<p>Could Cardus enjoy a revival?</p>\n</blockquote>\n<p>随后先给出现实判断：</p>\n<blockquote>\n<p>The prospect seems remote</p>\n</blockquote>\n<p>随后又补了一层：这种评论方式今天还留下什么价值：</p>\n<blockquote>\n<p>Something vital disappears when criticism no longer treats music as an expression of human character and feeling.</p>\n</blockquote>\n<p>F在结尾同时做了三件事：</p>\n<blockquote>\n<p>回答复兴问题</p>\n<ul>\n<li>总结时代变化</li>\n<li>点出Cardus式批评仍值得保留的东西</li>\n</ul>\n</blockquote>\n<p>它具有明确的结论段功能，只能放在最后。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. F</strong></p>\n</blockquote>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>可积累的主题表达</th>\n  <th>中文翻译</th>\n  <th>所属类别</th>\n  <th>使用层级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>preserving and revitalizing valuable cultural traditions</strong></td>\n  <td><strong>保护并振兴有价值的文化传统</strong></td>\n  <td><strong>文明｜文化传承</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td><strong>cultivating public appreciation of the arts</strong></td>\n  <td><strong>培养公众的艺术鉴赏力</strong></td>\n  <td><strong>文明｜文化素养</strong></td>\n  <td><strong>个人主题</strong></td>\n</tr>\n<tr>\n  <td>promoting serious cultural criticism</td>\n  <td>推动严肃的文化评论</td>\n  <td>文明｜公共文化</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>maintaining the seriousness of public discussion</td>\n  <td>维护公共讨论的严肃性</td>\n  <td>文明｜社会风气</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>professional dedication</td>\n  <td>敬业精神</td>\n  <td>敬业｜职业精神</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>treating one's work as a calling</td>\n  <td>把工作当作使命</td>\n  <td>敬业｜使命感</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td><strong>upholding professional standards</strong></td>\n  <td><strong>坚守专业标准</strong></td>\n  <td><strong>敬业｜职业规范</strong></td>\n  <td><strong>个人主题</strong></td>\n</tr>\n<tr>\n  <td>professional integrity</td>\n  <td>职业操守</td>\n  <td>诚信｜职业诚信</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>respecting expertise and literary talent</td>\n  <td>尊重专业能力和文学才华</td>\n  <td>友善｜尊重他人</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>striving for excellence</td>\n  <td>追求卓越</td>\n  <td>敬业｜工匠精神</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td>preserving cultural memory</td>\n  <td>保存文化记忆</td>\n  <td>文明｜历史传承</td>\n  <td>宏观主题</td>\n</tr>\n<tr>\n  <td>remembering overlooked cultural contributors</td>\n  <td>记住被忽视的文化贡献者</td>\n  <td>友善｜尊重贡献</td>\n  <td>个人主题</td>\n</tr>\n<tr>\n  <td><strong>adapting cultural traditions to changing times</strong></td>\n  <td><strong>推动文化传统与时俱进</strong></td>\n  <td><strong>文明｜文化创新</strong></td>\n  <td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n  <td>balancing accessibility with intellectual depth</td>\n  <td>平衡大众可读性与思想深度</td>\n  <td>和谐｜发展平衡</td>\n  <td>宏观主题</td>\n</tr>\n</tbody>\n</table></div>\n<h2>2. 大作文第一段描述题目信息时可积累的表达</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>适用题型</th>\n  <th>考试时可复用的形式</th>\n  <th>中文翻译</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td><strong>图画题</strong></td>\n  <td><strong>The scene presents a sharp contrast between A in the past and A today.</strong></td>\n  <td><strong>画面呈现了A过去与现在的鲜明反差。</strong></td>\n</tr>\n<tr>\n  <td><strong>图画题</strong></td>\n  <td><strong>A used to be widely admired, but is now largely forgotten.</strong></td>\n  <td><strong>A过去广受赞赏，如今却大多被遗忘。</strong></td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>A is gradually fading from public view.</td>\n  <td>A正逐渐淡出公众视野。</td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>B serves as a concrete example of how A has changed.</td>\n  <td>B具体展示了A发生了怎样的变化。</td>\n</tr>\n<tr>\n  <td>图画题</td>\n  <td>The prospect of reviving A seems remote.</td>\n  <td>复兴A的前景似乎十分渺茫。</td>\n</tr>\n<tr>\n  <td><strong>图表题</strong></td>\n  <td><strong>The chart shows an inexorable decline in the number, proportion or scope of A over the past X years.</strong></td>\n  <td><strong>图表显示，在过去X年里，A的数量、比例或覆盖范围持续下降。</strong></td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>A used to account for a considerable proportion of B.</td>\n  <td>A过去曾占B的相当大一部分。</td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>The number or proportion of A fell from X to Y during the period.</td>\n  <td>在这段时期内，A的数量或比例从X下降到Y。</td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>Compared with the past, A has decreased considerably.</td>\n  <td>与过去相比，A已经大幅下降。</td>\n</tr>\n<tr>\n  <td>图表题</td>\n  <td>Only a small proportion of A remains today.</td>\n  <td>如今A只剩下很小一部分。</td>\n</tr>\n<tr>\n  <td><strong>文本评论题</strong></td>\n  <td><strong>The article contrasts the former prosperity of A with its present decline.</strong></td>\n  <td><strong>文章把A过去的繁荣与现在的衰退进行对比。</strong></td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The article points out that A, once widely admired, is now largely forgotten.</td>\n  <td>文章指出，A过去广受赞赏，如今却大多被遗忘。</td>\n</tr>\n<tr>\n  <td><strong>文本评论题</strong></td>\n  <td><strong>The author uses B as a concrete example of the decline of A.</strong></td>\n  <td><strong>作者用B作为A衰退的具体例子。</strong></td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The article argues that changing tastes have made the revival of A difficult.</td>\n  <td>文章认为，审美或社会偏好的变化使A难以复兴。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The author raises the question of whether A can enjoy a revival and concludes that the prospect seems remote.</td>\n  <td>作者提出A能否复兴的问题，并认为这一前景十分渺茫。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>The article attributes the decline of A partly to B.</td>\n  <td>文章把A的衰退部分归因于B。</td>\n</tr>\n<tr>\n  <td>文本评论题</td>\n  <td>A was once taken for granted, but is now virtually forgotten.</td>\n  <td>A过去曾被视为理所当然，如今却几乎被遗忘。</td>\n</tr>\n</tbody>\n</table></div>\n";
