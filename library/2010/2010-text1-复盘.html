nfocused newspaper reviews`换成了更直接的说法：题材比较自由，不局限在一个固定主题上。\n\n**出处：**\n\n> the unfocused newspaper reviews published in England","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>自由的主题；题材不受固定限制</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>unfocused</code>被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>A把<code>unfocused newspaper reviews</code>换成了更直接的说法：题材比较自由，不局限在一个固定主题上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the unfocused newspaper reviews published in England</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-A-0","meta":{"kind":"option","question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false}},{"title":"A. free themes","level":4,"lines":["#### 定位比对法","","把A接到题干后面，整句话是在说：","","> 二战前英国的报纸评论，特点是题材比较自由。","","原文直接修饰`newspaper reviews`的词是：","","> unfocused","","这里的`unfocused`不是在骂评论质量差，也不是说评论家写作没有中心。放在这段历史语境中，它指这些评论并不被一个很窄、很固定的主题框死，评论家可以围绕所报道的各种文化事件充分展开。","","后一句也写：","","> write in detail and at length about the events they covered","> 围绕他们报道的事件写得详细而且篇幅很长","","这说明评论内容可以跟着不同事件展开，而不是只服务一个固定栏目或单一主题。","","所以`unfocused newspaper reviews`与`reviews with free themes`表达的是同一个总体特点。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 二战前英国的报纸评论，特点是题材比较自由。\n\n原文直接修饰`newspaper reviews`的词是：\n\n> unfocused\n\n这里的`unfocused`并不是说评论质量差，也不是说评论家写作没有中心。结合这一段的历史背景，它说的是评论没有被一个很窄、很固定的题目框住，评论家可以随着自己报道的文化事件展开。\n\n后一句也写：\n\n> write in detail and at length about the events they covered\n> 围绕他们报道的事件写得详细而且篇幅很长\n\n这句话也说明，评论内容可以跟着不同事件展开，不必只围绕固定栏目或单一主题。\n\n因此，`unfocused newspaper reviews`和`reviews with free themes`说的是同一个特点。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>自由的主题；题材不受固定限制</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>unfocused</code>被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>A把<code>unfocused newspaper reviews</code>换成了更直接的说法：题材比较自由，不局限在一个固定主题上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the unfocused newspaper reviews published in England</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是题材比较自由。</p>\n</blockquote>\n<p>原文直接修饰<code>newspaper reviews</code>的词是：</p>\n<blockquote>\n<p>unfocused</p>\n</blockquote>\n<p>这里的<code>unfocused</code>并不是说评论质量差，也不是说评论家写作没有中心。结合这一段的历史背景，它说的是评论没有被一个很窄、很固定的题目框住，评论家可以随着自己报道的文化事件展开。</p>\n<p>后一句也写：</p>\n<blockquote>\n<p>write in detail and at length about the events they covered\n围绕他们报道的事件写得详细而且篇幅很长</p>\n</blockquote>\n<p>这句话也说明，评论内容可以跟着不同事件展开，不必只围绕固定栏目或单一主题。</p>\n<p>因此，<code>unfocused newspaper reviews</code>和<code>reviews with free themes</code>说的是同一个特点。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-A-1","meta":{"kind":"method","question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false}},{"title":"A. free themes","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> the unfocused newspaper reviews",">","> the critics of major papers would write in detail and at length about the events they covered",">","> 这些报纸评论题材不受固定范围限制，评论家会围绕自己报道的事件详细而充分地展开。","","实际写法让评论家可以随着所报道的事件广泛展开，并没有把评论限定在固定题材中。","","如果A成立，文章应该沿着这条路线写：","","> Newspaper reviewers were free to range widely over the events and subjects they covered.",">","> 报纸评论家可以围绕自己报道的事件和主题广泛展开。","","实际第三段正是这样写的，所以A与文章的写作路线一致。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> the unfocused newspaper reviews\n>\n> the critics of major papers would write in detail and at length about the events they covered\n>\n> 这些报纸评论题材不受固定范围限制，评论家会围绕自己报道的事件详细而充分地展开。\n\n原文让评论家随着所报道的事件充分展开，没有把评论限制在固定题材里。\n\n如果A真是作者的意思，文章就应该顺着这条线往下写：\n\n> Newspaper reviewers were free to range widely over the events and subjects they covered.\n>\n> 报纸评论家可以围绕自己报道的事件和主题广泛展开。\n\n第三段就是这样写的，A与原文的展开方式一致。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>自由的主题；题材不受固定限制</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>unfocused</code>被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>A把<code>unfocused newspaper reviews</code>换成了更直接的说法：题材比较自由，不局限在一个固定主题上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the unfocused newspaper reviews published in England</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是题材比较自由。</p>\n</blockquote>\n<p>原文直接修饰<code>newspaper reviews</code>的词是：</p>\n<blockquote>\n<p>unfocused</p>\n</blockquote>\n<p>这里的<code>unfocused</code>并不是说评论质量差，也不是说评论家写作没有中心。结合这一段的历史背景，它说的是评论没有被一个很窄、很固定的题目框住，评论家可以随着自己报道的文化事件展开。</p>\n<p>后一句也写：</p>\n<blockquote>\n<p>write in detail and at length about the events they covered\n围绕他们报道的事件写得详细而且篇幅很长</p>\n</blockquote>\n<p>这句话也说明，评论内容可以跟着不同事件展开，不必只围绕固定栏目或单一主题。</p>\n<p>因此，<code>unfocused newspaper reviews</code>和<code>reviews with free themes</code>说的是同一个特点。</p></section><section class=\"revealPart\" id=\"focus-q22-A-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the unfocused newspaper reviews</p>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n<p>这些报纸评论题材不受固定范围限制，评论家会围绕自己报道的事件详细而充分地展开。</p>\n</blockquote>\n<p>原文让评论家随着所报道的事件充分展开，没有把评论限制在固定题材里。</p>\n<p>如果A真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Newspaper reviewers were free to range widely over the events and subjects they covered.</p>\n<p>报纸评论家可以围绕自己报道的事件和主题广泛展开。</p>\n</blockquote>\n<p>第三段就是这样写的，A与原文的展开方式一致。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-A-2","meta":{"kind":"method","question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false}},{"title":"A. free themes","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入22题题干：","","> 既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明这种旧式评论本身有什么特点，以及它为什么值得怀念。","","A实际说的是：","","> free themes  ","> 自由的主题；题材不受固定限制","","A回答的仍然是评论本身的特点，而且能够和第三段开头的`unfocused newspaper reviews`接上。后文又写评论家会围绕自己报道的不同事件展开，这也没有把题材限制在固定栏目或单一对象上。","","主旨只能帮助我们确认A落在正确的对象和段落作用上；真正把A坐实的，仍然是第三段开头的直接措辞和后面的内容展开。两边放在一起，A与全文方向一致。","","**复盘判断：A正确。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入22题题干：\n\n> 既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明这种旧式评论本身有什么特点，以及它为什么值得怀念。\n\nA实际说的是：\n\n> free themes  \n> 自由的主题；题材不受固定限制\n\nA回答的仍然是评论本身的特点，而且能够和第三段开头的`unfocused newspaper reviews`接上。后文又写评论家会围绕自己报道的不同事件展开，这也没有把题材限制在固定栏目或单一对象上。\n\n主旨只能帮助我们确认A落在正确的对象和段落作用上；真正把A坐实的，仍然是第三段开头的直接措辞和后面的内容展开。两边放在一起，A与全文方向一致。\n\n**复盘判断：A正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>自由的主题；题材不受固定限制</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>unfocused</code>被遮挡，A无法正面确认；通过排除B、C、D以后选择A。复盘恢复完整词义后，直接对应也能补上。</p>\n<p><strong>选项类型：正确的同义改写。</strong></p>\n<p>A把<code>unfocused newspaper reviews</code>换成了更直接的说法：题材比较自由，不局限在一个固定主题上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the unfocused newspaper reviews published in England</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是题材比较自由。</p>\n</blockquote>\n<p>原文直接修饰<code>newspaper reviews</code>的词是：</p>\n<blockquote>\n<p>unfocused</p>\n</blockquote>\n<p>这里的<code>unfocused</code>并不是说评论质量差，也不是说评论家写作没有中心。结合这一段的历史背景，它说的是评论没有被一个很窄、很固定的题目框住，评论家可以随着自己报道的文化事件展开。</p>\n<p>后一句也写：</p>\n<blockquote>\n<p>write in detail and at length about the events they covered\n围绕他们报道的事件写得详细而且篇幅很长</p>\n</blockquote>\n<p>这句话也说明，评论内容可以跟着不同事件展开，不必只围绕固定栏目或单一主题。</p>\n<p>因此，<code>unfocused newspaper reviews</code>和<code>reviews with free themes</code>说的是同一个特点。</p></section><section class=\"revealPart\" id=\"focus-q22-A-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the unfocused newspaper reviews</p>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n<p>这些报纸评论题材不受固定范围限制，评论家会围绕自己报道的事件详细而充分地展开。</p>\n</blockquote>\n<p>原文让评论家随着所报道的事件充分展开，没有把评论限制在固定题材里。</p>\n<p>如果A真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Newspaper reviewers were free to range widely over the events and subjects they covered.</p>\n<p>报纸评论家可以围绕自己报道的事件和主题广泛展开。</p>\n</blockquote>\n<p>第三段就是这样写的，A与原文的展开方式一致。</p></section><section class=\"revealPart\" id=\"focus-q22-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明这种旧式评论本身有什么特点，以及它为什么值得怀念。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>free themes<br />\n自由的主题；题材不受固定限制</p>\n</blockquote>\n<p>A回答的仍然是评论本身的特点，而且能够和第三段开头的<code>unfocused newspaper reviews</code>接上。后文又写评论家会围绕自己报道的不同事件展开，这也没有把题材限制在固定栏目或单一对象上。</p>\n<p>主旨只能帮助我们确认A落在正确的对象和段落作用上；真正把A坐实的，仍然是第三段开头的直接措辞和后面的内容展开。两边放在一起，A与全文方向一致。</p>\n<p><strong>复盘判断：A正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-A-3","meta":{"kind":"method","question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true}},{"title":"B. casual style","level":3,"lines":["### B. casual style","","> 随意的风格","","**做题模式中的状态：**当时已经能看懂`serious business`，也看出`wore their learning lightly`只描述部分评论家怎样表现学问，因此排除B。","","**错误类型：第一类——歪曲原意。**","","B主要借用了`wore their learning lightly`，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。","","**命题人借用的原文材料：**","","> even those reviewers who wore their learning lightly",">","> Theirs was a serious business"],"section":"第三鸟 · 题目复盘","raw":"### B. casual style\n\n> 随意的风格\n\n**做题模式中的状态：**当时已经能看懂`serious business`，也看出`wore their learning lightly`只描述部分评论家怎样表现学问，因此排除B。\n\n**错误类型：第一类——歪曲原意。**\n\nB主要借了`wore their learning lightly`这句话，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。\n\n**命题人借用的原文材料：**\n\n> even those reviewers who wore their learning lightly\n>\n> Theirs was a serious business","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>随意的风格</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>serious business</code>，也看出<code>wore their learning lightly</code>只描述部分评论家怎样表现学问，因此排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B主要借了<code>wore their learning lightly</code>这句话，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>even those reviewers who wore their learning lightly</p>\n<p>Theirs was a serious business</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-B-0","meta":{"kind":"option","question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false}},{"title":"B. casual style","level":4,"lines":["#### 定位比对法","","把B接到题干后面，整句话是在说：","","> 二战前英国的报纸评论，整体风格比较随意。","","最容易让人误选的是：","","> wore their learning lightly","","字面上有`lightly`，看起来像“轻松、随意”。但完整结构的主语是：","","> those reviewers","> 那些评论家","","它说的是部分评论家怎样呈现自己的学问——有学问，但不摆出沉重、卖弄的姿态。它没有把整类报纸评论定义为`casual`。","","同一句前面还明确写：","","> Theirs was a serious business.","> 他们做的是一件严肃的工作。","","后面又说这些人：","","> could be trusted to know what they were about","> 被认为清楚自己在做什么","","因此，原文允许“表达学问比较轻松”，但不允许推出“评论工作随便、不严肃”。B把部分人的呈现方式扩大成整类评论的总体风格，还把正面含义改成了负面含义。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 二战前英国的报纸评论，整体风格比较随意。\n\n最容易把人带偏的是：\n\n> wore their learning lightly\n\n字面上有`lightly`，看起来像“轻松、随意”。但完整结构的主语是：\n\n> those reviewers\n> 那些评论家\n\n它说的是部分评论家怎样表现自己的学问：有学问，但不故意摆出沉重、卖弄的姿态。这里并没有把整类报纸评论说成`casual`。\n\n同一句前面还明确写：\n\n> Theirs was a serious business.\n> 他们做的是一件严肃的工作。\n\n后面又说这些人：\n\n> could be trusted to know what they were about\n> 被认为清楚自己在做什么\n\n所以，原文只能说明“他们表现学问的方式比较轻松”，推不出“评论工作随便、不严肃”。B把部分人的表现方式扩大成整类评论的总体风格，还把原本偏正面的意思改成了负面评价。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>随意的风格</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>serious business</code>，也看出<code>wore their learning lightly</code>只描述部分评论家怎样表现学问，因此排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B主要借了<code>wore their learning lightly</code>这句话，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>even those reviewers who wore their learning lightly</p>\n<p>Theirs was a serious business</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，整体风格比较随意。</p>\n</blockquote>\n<p>最容易把人带偏的是：</p>\n<blockquote>\n<p>wore their learning lightly</p>\n</blockquote>\n<p>字面上有<code>lightly</code>，看起来像“轻松、随意”。但完整结构的主语是：</p>\n<blockquote>\n<p>those reviewers\n那些评论家</p>\n</blockquote>\n<p>它说的是部分评论家怎样表现自己的学问：有学问，但不故意摆出沉重、卖弄的姿态。这里并没有把整类报纸评论说成<code>casual</code>。</p>\n<p>同一句前面还明确写：</p>\n<blockquote>\n<p>Theirs was a serious business.\n他们做的是一件严肃的工作。</p>\n</blockquote>\n<p>后面又说这些人：</p>\n<blockquote>\n<p>could be trusted to know what they were about\n被认为清楚自己在做什么</p>\n</blockquote>\n<p>所以，原文只能说明“他们表现学问的方式比较轻松”，推不出“评论工作随便、不严肃”。B把部分人的表现方式扩大成整类评论的总体风格，还把原本偏正面的意思改成了负面评价。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-B-1","meta":{"kind":"method","question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false}},{"title":"B. casual style","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> the critics of major papers would write in detail and at length",">","> Theirs was a serious business",">","> could be trusted to know what they were about",">","> 评论家写得详细而且篇幅很长；这是一件严肃的工作；他们被认为清楚自己在做什么。","","实际写法一直在强调评论的严肃性和专业性。","","如果B成立，文章至少应该改成：","","> The reviewers usually wrote briefly and informally, and treated criticism as a light occupation.",">","> 这些评论通常写得简短而随意，评论工作也被当成一种轻松消遣。","","实际文章强调严肃、详细和专业，B要求的却是随意，两条写作路线正好相反。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> the critics of major papers would write in detail and at length\n>\n> Theirs was a serious business\n>\n> could be trusted to know what they were about\n>\n> 评论家写得详细而且篇幅很长；这是一件严肃的工作；他们被认为清楚自己在做什么。\n\n原文从头到尾都在强调这些评论的严肃和专业。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The reviewers usually wrote briefly and informally, and treated criticism as a light occupation.\n>\n> 这些评论通常写得简短而随意，评论工作也被当成一种轻松消遣。\n\n原文强调严肃、详细和专业，B却说风格随意，两边正好相反。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>随意的风格</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>serious business</code>，也看出<code>wore their learning lightly</code>只描述部分评论家怎样表现学问，因此排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B主要借了<code>wore their learning lightly</code>这句话，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>even those reviewers who wore their learning lightly</p>\n<p>Theirs was a serious business</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，整体风格比较随意。</p>\n</blockquote>\n<p>最容易把人带偏的是：</p>\n<blockquote>\n<p>wore their learning lightly</p>\n</blockquote>\n<p>字面上有<code>lightly</code>，看起来像“轻松、随意”。但完整结构的主语是：</p>\n<blockquote>\n<p>those reviewers\n那些评论家</p>\n</blockquote>\n<p>它说的是部分评论家怎样表现自己的学问：有学问，但不故意摆出沉重、卖弄的姿态。这里并没有把整类报纸评论说成<code>casual</code>。</p>\n<p>同一句前面还明确写：</p>\n<blockquote>\n<p>Theirs was a serious business.\n他们做的是一件严肃的工作。</p>\n</blockquote>\n<p>后面又说这些人：</p>\n<blockquote>\n<p>could be trusted to know what they were about\n被认为清楚自己在做什么</p>\n</blockquote>\n<p>所以，原文只能说明“他们表现学问的方式比较轻松”，推不出“评论工作随便、不严肃”。B把部分人的表现方式扩大成整类评论的总体风格，还把原本偏正面的意思改成了负面评价。</p></section><section class=\"revealPart\" id=\"focus-q22-B-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length</p>\n<p>Theirs was a serious business</p>\n<p>could be trusted to know what they were about</p>\n<p>评论家写得详细而且篇幅很长；这是一件严肃的工作；他们被认为清楚自己在做什么。</p>\n</blockquote>\n<p>原文从头到尾都在强调这些评论的严肃和专业。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The reviewers usually wrote briefly and informally, and treated criticism as a light occupation.</p>\n<p>这些评论通常写得简短而随意，评论工作也被当成一种轻松消遣。</p>\n</blockquote>\n<p>原文强调严肃、详细和专业，B却说风格随意，两边正好相反。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-B-2","meta":{"kind":"method","question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false}},{"title":"B. casual style","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入22题题干：","","> 既然全文在追忆一种曾经繁荣、严肃、有分量的报纸艺术评论传统，那么第三段应该继续证明这些评论为什么有质量、为什么值得怀念。","","但B实际说的是：","","> casual style  ","> 随意的风格","","B会把过去的报纸评论写成随便、不够严肃。这样一来，第三段就无法承担“证明过去评论确实有分量”这一作用，也会和原文的`Theirs was a serious business`直接冲突。","","全文主旨需要第三段把过去的评论写得更有分量，B却把它改成随意风格。这个方向接不上全文的论证。","","**复盘判断：B错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入22题题干：\n\n> 既然全文在追忆一种曾经繁荣、严肃、有分量的报纸艺术评论传统，那么第三段应该继续证明这些评论为什么有质量、为什么值得怀念。\n\n但B实际说的是：\n\n> casual style  \n> 随意的风格\n\nB会把过去的报纸评论写成随便、不够严肃。这样一来，第三段就无法承担“证明过去评论确实有分量”这一作用，也会和原文的`Theirs was a serious business`直接冲突。\n\n全文主旨需要第三段把过去的评论写得更有分量，B却把它改成随意风格。这个方向接不上全文的论证。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>随意的风格</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看懂<code>serious business</code>，也看出<code>wore their learning lightly</code>只描述部分评论家怎样表现学问，因此排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B主要借了<code>wore their learning lightly</code>这句话，把“有学问但不卖弄”改成“整类评论写得随便、不严肃”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>even those reviewers who wore their learning lightly</p>\n<p>Theirs was a serious business</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，整体风格比较随意。</p>\n</blockquote>\n<p>最容易把人带偏的是：</p>\n<blockquote>\n<p>wore their learning lightly</p>\n</blockquote>\n<p>字面上有<code>lightly</code>，看起来像“轻松、随意”。但完整结构的主语是：</p>\n<blockquote>\n<p>those reviewers\n那些评论家</p>\n</blockquote>\n<p>它说的是部分评论家怎样表现自己的学问：有学问，但不故意摆出沉重、卖弄的姿态。这里并没有把整类报纸评论说成<code>casual</code>。</p>\n<p>同一句前面还明确写：</p>\n<blockquote>\n<p>Theirs was a serious business.\n他们做的是一件严肃的工作。</p>\n</blockquote>\n<p>后面又说这些人：</p>\n<blockquote>\n<p>could be trusted to know what they were about\n被认为清楚自己在做什么</p>\n</blockquote>\n<p>所以，原文只能说明“他们表现学问的方式比较轻松”，推不出“评论工作随便、不严肃”。B把部分人的表现方式扩大成整类评论的总体风格，还把原本偏正面的意思改成了负面评价。</p></section><section class=\"revealPart\" id=\"focus-q22-B-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length</p>\n<p>Theirs was a serious business</p>\n<p>could be trusted to know what they were about</p>\n<p>评论家写得详细而且篇幅很长；这是一件严肃的工作；他们被认为清楚自己在做什么。</p>\n</blockquote>\n<p>原文从头到尾都在强调这些评论的严肃和专业。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The reviewers usually wrote briefly and informally, and treated criticism as a light occupation.</p>\n<p>这些评论通常写得简短而随意，评论工作也被当成一种轻松消遣。</p>\n</blockquote>\n<p>原文强调严肃、详细和专业，B却说风格随意，两边正好相反。</p></section><section class=\"revealPart\" id=\"focus-q22-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种曾经繁荣、严肃、有分量的报纸艺术评论传统，那么第三段应该继续证明这些评论为什么有质量、为什么值得怀念。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>casual style<br />\n随意的风格</p>\n</blockquote>\n<p>B会把过去的报纸评论写成随便、不够严肃。这样一来，第三段就无法承担“证明过去评论确实有分量”这一作用，也会和原文的<code>Theirs was a serious business</code>直接冲突。</p>\n<p>全文主旨需要第三段把过去的评论写得更有分量，B却把它改成随意风格。这个方向接不上全文的论证。</p>\n<p><strong>复盘判断：B错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-B-3","meta":{"kind":"method","question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":true}},{"title":"C. elaborate layout","level":3,"lines":["### C. elaborate layout","","> 精心复杂的版式","","**做题模式中的状态：**当时`elaborate`被遮挡，但`layout`已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。","","**错误类型：第一类——歪曲原意。**","","C借用了`in detail and at length`带来的“充分、复杂”印象，却把评论内容怎样展开，换成了报纸页面怎样排版。","","**命题人借用的原文材料：**","","> the critics of major papers would write in detail and at length about the events they covered"],"section":"第三鸟 · 题目复盘","raw":"### C. elaborate layout\n\n> 精心复杂的版式\n\n**做题模式中的状态：**当时`elaborate`被遮挡，但`layout`已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。\n\n**错误类型：第一类——歪曲原意。**\n\nC借了`in detail and at length`带来的“详细、篇幅长”这种感觉，却把评论内容怎样展开，换成了报纸页面怎样排版。\n\n**命题人借用的原文材料：**\n\n> the critics of major papers would write in detail and at length about the events they covered","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>精心复杂的版式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>elaborate</code>被遮挡，但<code>layout</code>已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>in detail and at length</code>带来的“详细、篇幅长”这种感觉，却把评论内容怎样展开，换成了报纸页面怎样排版。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-C-0","meta":{"kind":"option","question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false}},{"title":"C. elaborate layout","level":4,"lines":["#### 定位比对法","","把C接到题干后面，整句话是在说：","","> 二战前英国的报纸评论，特点是版式精心而复杂。","","C中真正控制方向的是中心名词：","","> layout","> 版式、排布、页面安排","","原文中的`in detail and at length`说的是评论围绕事件写得多细、篇幅多长。它回答的是“内容怎样展开”。","","版式则需要页面、栏目、字体、位置、排版或视觉组织方面的证据。第三段没有写这些内容。","","所以即使`elaborate`和`in detail`都让人感觉“详细、复杂”，两个词所修饰的对象完全不同。一个是内容展开程度，一个是页面排布。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 二战前英国的报纸评论，特点是版式精心而复杂。\n\n判断C时先看它的中心词：\n\n> layout\n> 版式、排布、页面安排\n\n原文中的`in detail and at length`说的是评论围绕事件写得多细、篇幅多长。它回答的是“内容怎样展开”。\n\n版式则需要页面、栏目、字体、位置、排版或视觉组织方面的证据。第三段没有写这些内容。\n\n即使`elaborate`和`in detail`都让人想到“详细、复杂”，它们说的也不是一回事：一个讲内容展开得多细，一个讲页面怎么排。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>精心复杂的版式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>elaborate</code>被遮挡，但<code>layout</code>已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>in detail and at length</code>带来的“详细、篇幅长”这种感觉，却把评论内容怎样展开，换成了报纸页面怎样排版。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是版式精心而复杂。</p>\n</blockquote>\n<p>判断C时先看它的中心词：</p>\n<blockquote>\n<p>layout\n版式、排布、页面安排</p>\n</blockquote>\n<p>原文中的<code>in detail and at length</code>说的是评论围绕事件写得多细、篇幅多长。它回答的是“内容怎样展开”。</p>\n<p>版式则需要页面、栏目、字体、位置、排版或视觉组织方面的证据。第三段没有写这些内容。</p>\n<p>即使<code>elaborate</code>和<code>in detail</code>都让人想到“详细、复杂”，它们说的也不是一回事：一个讲内容展开得多细，一个讲页面怎么排。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-C-1","meta":{"kind":"method","question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false}},{"title":"C. elaborate layout","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> the critics of major papers would write in detail and at length about the events they covered",">","> Theirs was a serious business",">","> 评论家会围绕事件详细展开，而且把这当成一件严肃的工作。","","实际写法讨论的是评论写什么、写多细以及评论工作是否严肃，没有转向页面版式。","","如果C成立，文章至少应该改成：","","> The reviews appeared in elaborate page layouts, with carefully designed columns and typography.",">","> 这些评论采用复杂精心的页面版式，栏目和字体都经过细致设计。","","实际文章写的是内容和工作态度，C要求的却是版式安排，写作方向不同。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> the critics of major papers would write in detail and at length about the events they covered\n>\n> Theirs was a serious business\n>\n> 评论家会围绕事件详细展开，而且把这当成一件严肃的工作。\n\n原文谈的是评论写什么、写得多细，以及这项工作是否严肃，没有转去写页面版式。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The reviews appeared in elaborate page layouts, with carefully designed columns and typography.\n>\n> 这些评论采用复杂精心的页面版式，栏目和字体都经过细致设计。\n\n原文写内容和工作态度，C却转去说版式安排，方向已经换了。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>精心复杂的版式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>elaborate</code>被遮挡，但<code>layout</code>已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>in detail and at length</code>带来的“详细、篇幅长”这种感觉，却把评论内容怎样展开，换成了报纸页面怎样排版。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是版式精心而复杂。</p>\n</blockquote>\n<p>判断C时先看它的中心词：</p>\n<blockquote>\n<p>layout\n版式、排布、页面安排</p>\n</blockquote>\n<p>原文中的<code>in detail and at length</code>说的是评论围绕事件写得多细、篇幅多长。它回答的是“内容怎样展开”。</p>\n<p>版式则需要页面、栏目、字体、位置、排版或视觉组织方面的证据。第三段没有写这些内容。</p>\n<p>即使<code>elaborate</code>和<code>in detail</code>都让人想到“详细、复杂”，它们说的也不是一回事：一个讲内容展开得多细，一个讲页面怎么排。</p></section><section class=\"revealPart\" id=\"focus-q22-C-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n<p>Theirs was a serious business</p>\n<p>评论家会围绕事件详细展开，而且把这当成一件严肃的工作。</p>\n</blockquote>\n<p>原文谈的是评论写什么、写得多细，以及这项工作是否严肃，没有转去写页面版式。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The reviews appeared in elaborate page layouts, with carefully designed columns and typography.</p>\n<p>这些评论采用复杂精心的页面版式，栏目和字体都经过细致设计。</p>\n</blockquote>\n<p>原文写内容和工作态度，C却转去说版式安排，方向已经换了。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-C-2","meta":{"kind":"method","question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false}},{"title":"C. elaborate layout","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入22题题干：","","> 既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明评论内容、写作方式或评论家的工作状态。","","但C实际说的是：","","> elaborate layout  ","> 精心复杂的版式","","全文怀念的是评论内容的分量、篇幅和严肃性，第三段也一直在写评论家怎样展开内容、怎样看待这份工作。C却把问题带到了页面、栏目和排版方式上。","","版式复杂不能说明评论内容有分量，也解释不了第三段为什么要写评论家的能力和职业态度。C没有进入全文主旨所在的那条线。","","**复盘判断：C错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入22题题干：\n\n> 既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明评论内容、写作方式或评论家的工作状态。\n\n但C实际说的是：\n\n> elaborate layout  \n> 精心复杂的版式\n\n全文怀念的是评论内容的分量、篇幅和严肃性，第三段也一直在写评论家怎样展开内容、怎样看待这份工作。C却把问题带到了页面、栏目和排版方式上。\n\n版式复杂不能说明评论内容有分量，也解释不了第三段为什么要写评论家的能力和职业态度。C没有进入全文主旨所在的那条线。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>精心复杂的版式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>elaborate</code>被遮挡，但<code>layout</code>已经能够读懂。只要抓住中心词是“版式”，就可以与原文讨论的“内容和篇幅”区分开来。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借了<code>in detail and at length</code>带来的“详细、篇幅长”这种感觉，却把评论内容怎样展开，换成了报纸页面怎样排版。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，特点是版式精心而复杂。</p>\n</blockquote>\n<p>判断C时先看它的中心词：</p>\n<blockquote>\n<p>layout\n版式、排布、页面安排</p>\n</blockquote>\n<p>原文中的<code>in detail and at length</code>说的是评论围绕事件写得多细、篇幅多长。它回答的是“内容怎样展开”。</p>\n<p>版式则需要页面、栏目、字体、位置、排版或视觉组织方面的证据。第三段没有写这些内容。</p>\n<p>即使<code>elaborate</code>和<code>in detail</code>都让人想到“详细、复杂”，它们说的也不是一回事：一个讲内容展开得多细，一个讲页面怎么排。</p></section><section class=\"revealPart\" id=\"focus-q22-C-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>the critics of major papers would write in detail and at length about the events they covered</p>\n<p>Theirs was a serious business</p>\n<p>评论家会围绕事件详细展开，而且把这当成一件严肃的工作。</p>\n</blockquote>\n<p>原文谈的是评论写什么、写得多细，以及这项工作是否严肃，没有转去写页面版式。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The reviews appeared in elaborate page layouts, with carefully designed columns and typography.</p>\n<p>这些评论采用复杂精心的页面版式，栏目和字体都经过细致设计。</p>\n</blockquote>\n<p>原文写内容和工作态度，C却转去说版式安排，方向已经换了。</p></section><section class=\"revealPart\" id=\"focus-q22-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种已经衰退的报纸艺术评论传统，那么第三段应该继续说明评论内容、写作方式或评论家的工作状态。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>elaborate layout<br />\n精心复杂的版式</p>\n</blockquote>\n<p>全文怀念的是评论内容的分量、篇幅和严肃性，第三段也一直在写评论家怎样展开内容、怎样看待这份工作。C却把问题带到了页面、栏目和排版方式上。</p>\n<p>版式复杂不能说明评论内容有分量，也解释不了第三段为什么要写评论家的能力和职业态度。C没有进入全文主旨所在的那条线。</p>\n<p><strong>复盘判断：C错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-C-3","meta":{"kind":"method","question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":true}},{"title":"D. radical viewpoints","level":3,"lines":["### D. radical viewpoints","","> 激进的观点","","**做题模式中的状态：**当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。","","**错误类型：第二类——用个体细节回答整类特点。**","","D抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。","","**命题人借用的原文材料：**","","> “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ..."],"section":"第三鸟 · 题目复盘","raw":"### D. radical viewpoints\n\n> 激进的观点\n\n**做题模式中的状态：**当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。\n\n**错误类型：第二类——用个体细节回答整类特点。**\n\nD抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。\n\n**命题人借用的原文材料：**\n\n> “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>激进的观点</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。</p>\n<p><strong>错误类型：第二类——用个体细节回答整类特点。</strong></p>\n<p>D抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-D-0","meta":{"kind":"option","question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false}},{"title":"D. radical viewpoints","level":4,"lines":["#### 定位比对法","","把D接到题干后面，整句话是在说：","","> 二战前英国的报纸评论，普遍以激进观点为特点。","","第三段确实引用了Newman一句带有讽刺意味的话。但这句话的明确主体是：","","> Newman wrote","> Newman写道","","它最多先说明Newman个人怎样看待新闻写作和其他作家，不能直接替二战前英国所有报纸评论下一个共同结论。","","而且这段引语的核心是“真正能做好新闻写作的作者很少”，并不是在展示政治、文化或社会立场有多激进。","","所以D同时犯了两步错误：先把个人引语扩大成群体特点，再把尖锐讽刺的语气改写成`radical viewpoints`。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 二战前英国的报纸评论，普遍以激进观点为特点。\n\n第三段确实引用了Newman一句带有讽刺意味的话。但这句话的明确主体是：\n\n> Newman wrote\n> Newman写道\n\n它最多先说明Newman个人怎样看待新闻写作和其他作家，不能直接替二战前英国所有报纸评论下一个共同结论。\n\n而且这段引语的核心是“真正能做好新闻写作的作者很少”，并不是在展示政治、文化或社会立场有多激进。\n\n所以D同时犯了两步错误：先把个人引语扩大成群体特点，再把尖锐讽刺的语气改写成`radical viewpoints`。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>激进的观点</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。</p>\n<p><strong>错误类型：第二类——用个体细节回答整类特点。</strong></p>\n<p>D抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，普遍以激进观点为特点。</p>\n</blockquote>\n<p>第三段确实引用了Newman一句带有讽刺意味的话。但这句话的明确主体是：</p>\n<blockquote>\n<p>Newman wrote\nNewman写道</p>\n</blockquote>\n<p>它最多先说明Newman个人怎样看待新闻写作和其他作家，不能直接替二战前英国所有报纸评论下一个共同结论。</p>\n<p>而且这段引语的核心是“真正能做好新闻写作的作者很少”，并不是在展示政治、文化或社会立场有多激进。</p>\n<p>所以D同时犯了两步错误：先把个人引语扩大成群体特点，再把尖锐讽刺的语气改写成<code>radical viewpoints</code>。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-D-1","meta":{"kind":"method","question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false}},{"title":"D. radical viewpoints","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> These men believed in journalism as a calling, and were proud to be published in the daily press.",">","> 这些人把新闻写作看成一种使命，并以在日报发表为荣。","","实际写法用Shaw和Newman说明过去评论家的职业态度和能力，没有概括他们的政治或文化立场。","","如果D成立，文章至少应该改成：","","> Reviewers of the period were known for advancing radical political and cultural views.",">","> 当时的评论家以提出激进的政治和文化观点著称。","","实际文章没有沿“整类评论家观点激进”这条路线展开，所以D不能解释第三段。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> These men believed in journalism as a calling, and were proud to be published in the daily press.\n>\n> 这些人把新闻写作看成一种使命，并以在日报发表为荣。\n\n原文借Shaw和Newman说明过去评论家的职业态度和能力，并没有概括他们的政治或文化立场。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Reviewers of the period were known for advancing radical political and cultural views.\n>\n> 当时的评论家以提出激进的政治和文化观点著称。\n\n原文没有顺着“整类评论家观点激进”往下写，D自然解释不了第三段。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>激进的观点</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。</p>\n<p><strong>错误类型：第二类——用个体细节回答整类特点。</strong></p>\n<p>D抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，普遍以激进观点为特点。</p>\n</blockquote>\n<p>第三段确实引用了Newman一句带有讽刺意味的话。但这句话的明确主体是：</p>\n<blockquote>\n<p>Newman wrote\nNewman写道</p>\n</blockquote>\n<p>它最多先说明Newman个人怎样看待新闻写作和其他作家，不能直接替二战前英国所有报纸评论下一个共同结论。</p>\n<p>而且这段引语的核心是“真正能做好新闻写作的作者很少”，并不是在展示政治、文化或社会立场有多激进。</p>\n<p>所以D同时犯了两步错误：先把个人引语扩大成群体特点，再把尖锐讽刺的语气改写成<code>radical viewpoints</code>。</p></section><section class=\"revealPart\" id=\"focus-q22-D-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n<p>这些人把新闻写作看成一种使命，并以在日报发表为荣。</p>\n</blockquote>\n<p>原文借Shaw和Newman说明过去评论家的职业态度和能力，并没有概括他们的政治或文化立场。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Reviewers of the period were known for advancing radical political and cultural views.</p>\n<p>当时的评论家以提出激进的政治和文化观点著称。</p>\n</blockquote>\n<p>原文没有顺着“整类评论家观点激进”往下写，D自然解释不了第三段。</p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-D-2","meta":{"kind":"method","question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false}},{"title":"D. radical viewpoints","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入22题题干：","","> 既然全文在追忆一种曾经繁荣、有分量的报纸艺术评论传统，那么第三段应该说明这类评论共有的写作特点和专业水准。","","但D实际说的是：","","> radical viewpoints  ","> 激进的观点","","D抓住了Newman后面的个人引语，却把一个人的说法扩大成了二战前英国报纸评论的共同特点。全文需要第三段证明评论家认真、专业、有能力，并没有把“观点激进”当成这类评论的主线。","","所以，D既没有回答整类评论共有的特点，也不能解释第三段在全文中为什么出现。","","**复盘判断：D错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入22题题干：\n\n> 既然全文在追忆一种曾经繁荣、有分量的报纸艺术评论传统，那么第三段应该说明这类评论共有的写作特点和专业水准。\n\n但D实际说的是：\n\n> radical viewpoints  \n> 激进的观点\n\nD抓住了Newman后面的个人引语，却把一个人的说法扩大成了二战前英国报纸评论的共同特点。全文需要第三段证明评论家认真、专业、有能力，并没有把“观点激进”当成这类评论的主线。\n\n所以，D既没有回答整类评论共有的特点，也不能解释第三段在全文中为什么出现。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>激进的观点</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经看出D主要借了Newman一人的引语，而题干问整类报纸评论的共同特点，因此排除D。</p>\n<p><strong>错误类型：第二类——用个体细节回答整类特点。</strong></p>\n<p>D抓住Newman引语中比较尖锐、讽刺的语气，把一个人的一句话扩大成二战前英国报纸评论普遍具有激进观点。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>二战前英国的报纸评论，普遍以激进观点为特点。</p>\n</blockquote>\n<p>第三段确实引用了Newman一句带有讽刺意味的话。但这句话的明确主体是：</p>\n<blockquote>\n<p>Newman wrote\nNewman写道</p>\n</blockquote>\n<p>它最多先说明Newman个人怎样看待新闻写作和其他作家，不能直接替二战前英国所有报纸评论下一个共同结论。</p>\n<p>而且这段引语的核心是“真正能做好新闻写作的作者很少”，并不是在展示政治、文化或社会立场有多激进。</p>\n<p>所以D同时犯了两步错误：先把个人引语扩大成群体特点，再把尖锐讽刺的语气改写成<code>radical viewpoints</code>。</p></section><section class=\"revealPart\" id=\"focus-q22-D-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n<p>这些人把新闻写作看成一种使命，并以在日报发表为荣。</p>\n</blockquote>\n<p>原文借Shaw和Newman说明过去评论家的职业态度和能力，并没有概括他们的政治或文化立场。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Reviewers of the period were known for advancing radical political and cultural views.</p>\n<p>当时的评论家以提出激进的政治和文化观点著称。</p>\n</blockquote>\n<p>原文没有顺着“整类评论家观点激进”往下写，D自然解释不了第三段。</p></section><section class=\"revealPart\" id=\"focus-q22-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>既然全文在追忆一种曾经繁荣、有分量的报纸艺术评论传统，那么第三段应该说明这类评论共有的写作特点和专业水准。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>radical viewpoints<br />\n激进的观点</p>\n</blockquote>\n<p>D抓住了Newman后面的个人引语，却把一个人的说法扩大成了二战前英国报纸评论的共同特点。全文需要第三段证明评论家认真、专业、有能力，并没有把“观点激进”当成这类评论的主线。</p>\n<p>所以，D既没有回答整类评论共有的特点，也不能解释第三段在全文中为什么出现。</p>\n<p><strong>复盘判断：D错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"focusId":"focus-q22-D-3","meta":{"kind":"method","question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true}},{"title":"22题结论","level":3,"lines":["> **22. A. free themes.**","","这道题的四个选项分别展示了四种命题方式：","","- A用`free themes`概括`unfocused newspaper reviews`，属于正确同义改写；","- B抓住`lightly`，却把“不卖弄学问”改成“整类评论随意”；","- C抓住“详细、篇幅长”的感觉，却把内容展开偷换成版式；","- D拿Newman个人引语回答整类评论特点，范围和功能都错了。"],"section":"第三鸟 · 题目复盘","raw":"### 22题结论\n\n> **22. A. free themes.**\n\n这道题的四个选项分别展示了四种命题方式：\n\n- A用`free themes`概括`unfocused newspaper reviews`，属于正确同义改写；\n- B抓住`lightly`，却把“不卖弄学问”改成“整类评论随意”；\n- C抓住“详细、篇幅长”的感觉，却把内容展开偷换成版式；\n- D拿Newman个人引语回答整类评论特点，范围和功能都错了。","html":"<blockquote>\n<p><strong>22. A. free themes.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种命题方式：</p>\n<ul>\n<li>A用<code>free themes</code>概括<code>unfocused newspaper reviews</code>，属于正确同义改写；</li>\n<li>B抓住<code>lightly</code>，却把“不卖弄学问”改成“整类评论随意”；</li>\n<li>C抓住“详细、篇幅长”的感觉，却把内容展开偷换成版式；</li>\n<li>D拿Newman个人引语回答整类评论特点，范围和功能都错了。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"22题","focus":[0,305,1240,300],"sourceW":1240,"sourceH":1636},"meta":{"kind":"conclusion","question":"22","option":null,"questionConclusion":true}},{"title":"23题 · 题干与核心出处","level":2,"lines":["## 23题","","> Which of the following would Shaw and Newman most probably agree on?  ","> 下面哪个说法最可能是Shaw和Newman都会同意的？","","### 核心出处","","> Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...","","这里要先分清两类证据：","","- `These men believed... and were proud...`是对Shaw和Newman的共同描写；","- `Newman wrote...`是Newman个人的直接引语。","","个人引语不能自动变成两个人共同说过的话，但如果它紧接着前面对两人的共同描写，并且继续展开同一职业态度，就可以作为“最可能共同同意”的推断依据。"],"section":"第三鸟 · 题目复盘","raw":"## 23题\n\n> Which of the following would Shaw and Newman most probably agree on?  \n> 下面哪个说法最可能是Shaw和Newman都会同意的？\n\n### 核心出处\n\n> Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...\n\n这里要先分清两类证据：\n\n- `These men believed... and were proud...`是对Shaw和Newman的共同描写；\n- `Newman wrote...`是Newman个人的直接引语。\n\n个人引语不能自动变成两个人共同说过的话，但如果它紧接着前面对两人的共同描写，并且继续展开同一职业态度，就可以作为“最可能共同同意”的推断依据。","html":"<blockquote>\n<p>Which of the following would Shaw and Newman most probably agree on?<br />\n下面哪个说法最可能是Shaw和Newman都会同意的？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote ...</p>\n</blockquote>\n<p>这里要先分清两类证据：</p>\n<ul>\n<li><code>These men believed... and were proud...</code>是对Shaw和Newman的共同描写；</li>\n<li><code>Newman wrote...</code>是Newman个人的直接引语。</li>\n</ul>\n<p>个人引语不能自动变成两个人共同说过的话，但如果它紧接着前面对两人的共同描写，并且继续展开同一职业态度，就可以作为“最可能共同同意”的推断依据。</p>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"meta":{"kind":"question","question":"23","option":null,"questionIntro":true}},{"title":"A. It is writers’ duty to fulfill journalistic goals.","level":3,"lines":["### A. It is writers’ duty to fulfill journalistic goals.","","> 完成新闻写作目标是作家的责任","","**做题模式中的状态：**当时已经能看出原文谈的是职业态度和能力，没有出现`duty`和`journalistic goals`，因此排除A。","","**错误类型：第三类——无中生有。**","","A借用了`calling`和`serious business`，诱导我们把“把新闻写作看成使命”继续脑补成“作家有责任完成一套新闻目标”。","","**命题人借用的原文材料：**","","> These men believed in journalism as a calling.",">","> Theirs was a serious business."],"section":"第三鸟 · 题目复盘","raw":"### A. It is writers’ duty to fulfill journalistic goals.\n\n> 完成新闻写作目标是作家的责任\n\n**做题模式中的状态：**当时已经能看出原文谈的是职业态度和能力，没有出现`duty`和`journalistic goals`，因此排除A。\n\n**错误类型：第三类——无中生有。**\n\nA借了`calling`和`serious business`里的“认真、使命感”，又往前推成“作家有责任完成一套新闻目标”。\n\n**命题人借用的原文材料：**\n\n> These men believed in journalism as a calling.\n>\n> Theirs was a serious business.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出原文谈的是职业态度和能力，没有出现<code>duty</code>和<code>journalistic goals</code>，因此排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借了<code>calling</code>和<code>serious business</code>里的“认真、使命感”，又往前推成“作家有责任完成一套新闻目标”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>These men believed in journalism as a calling.</p>\n<p>Theirs was a serious business.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-A-0","meta":{"kind":"option","question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false}},{"title":"A. It is writers’ duty to fulfill journalistic goals.","level":4,"lines":["#### 定位比对法","","把A接到题干后面，整句话是在说：","","> Shaw和Newman最可能都认为，作家有责任完成新闻写作目标。","","原文中的`calling`可以译为“使命、天职、职业召唤”，说明他们怎样看待新闻工作：这是一件值得认真投入的职业。","","但A又增加了两层原文没有的信息：","","- `writers’ duty`：所有作家负有某种责任；","- `journalistic goals`：存在一组需要完成的具体新闻目标。","","文章没有列出这些目标，也没有讨论作家如果不完成目标会怎样。它只是说Shaw和Newman认真看待新闻写作，并认为做好它需要能力。","","因此，从“把一种职业看成使命”到“作家必须完成某些新闻目标”，中间缺少完整的一步。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Shaw和Newman最可能都认为，作家有责任完成新闻写作目标。\n\n原文中的`calling`可以译为“使命、天职、职业召唤”，说明他们怎样看待新闻工作：这是一件值得认真投入的职业。\n\n但A又加上了两层原文没有的信息：\n\n- `writers’ duty`：所有作家负有某种责任；\n- `journalistic goals`：存在一组需要完成的具体新闻目标。\n\n文章没有列出这些目标，也没有讨论作家如果不完成目标会怎样。它只是说Shaw和Newman认真看待新闻写作，并认为做好它需要能力。\n\n从“把一种职业看成使命”推到“作家必须完成某些新闻目标”，中间少了一步原文依据。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出原文谈的是职业态度和能力，没有出现<code>duty</code>和<code>journalistic goals</code>，因此排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借了<code>calling</code>和<code>serious business</code>里的“认真、使命感”，又往前推成“作家有责任完成一套新闻目标”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>These men believed in journalism as a calling.</p>\n<p>Theirs was a serious business.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家有责任完成新闻写作目标。</p>\n</blockquote>\n<p>原文中的<code>calling</code>可以译为“使命、天职、职业召唤”，说明他们怎样看待新闻工作：这是一件值得认真投入的职业。</p>\n<p>但A又加上了两层原文没有的信息：</p>\n<ul>\n<li><code>writers’ duty</code>：所有作家负有某种责任；</li>\n<li><code>journalistic goals</code>：存在一组需要完成的具体新闻目标。</li>\n</ul>\n<p>文章没有列出这些目标，也没有讨论作家如果不完成目标会怎样。它只是说Shaw和Newman认真看待新闻写作，并认为做好它需要能力。</p>\n<p>从“把一种职业看成使命”推到“作家必须完成某些新闻目标”，中间少了一步原文依据。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-A-1","meta":{"kind":"method","question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false}},{"title":"A. It is writers’ duty to fulfill journalistic goals.","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> So few authors have brains enough or literary gift enough to keep their own end up in journalism.",">","> 真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。","","实际写法强调的是作家有没有能力做好新闻写作。","","如果A成立，文章至少应该改成：","","> Writers have a duty to serve the goals of journalism and should be responsible for fulfilling them.",">","> 作家有责任服务于新闻写作的目标，并应当负责完成这些目标。","","实际文章讨论能力门槛，A要求的却是责任和目标，两条写作路线不同。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> So few authors have brains enough or literary gift enough to keep their own end up in journalism.\n>\n> 真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。\n\n原文后面强调的是作家有没有能力把新闻写作做好。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Writers have a duty to serve the goals of journalism and should be responsible for fulfilling them.\n>\n> 作家有责任服务于新闻写作的目标，并应当负责完成这些目标。\n\n原文讨论的是能力门槛，A却转去说责任和目标，后文走的并不是这条线。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出原文谈的是职业态度和能力，没有出现<code>duty</code>和<code>journalistic goals</code>，因此排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借了<code>calling</code>和<code>serious business</code>里的“认真、使命感”，又往前推成“作家有责任完成一套新闻目标”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>These men believed in journalism as a calling.</p>\n<p>Theirs was a serious business.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家有责任完成新闻写作目标。</p>\n</blockquote>\n<p>原文中的<code>calling</code>可以译为“使命、天职、职业召唤”，说明他们怎样看待新闻工作：这是一件值得认真投入的职业。</p>\n<p>但A又加上了两层原文没有的信息：</p>\n<ul>\n<li><code>writers’ duty</code>：所有作家负有某种责任；</li>\n<li><code>journalistic goals</code>：存在一组需要完成的具体新闻目标。</li>\n</ul>\n<p>文章没有列出这些目标，也没有讨论作家如果不完成目标会怎样。它只是说Shaw和Newman认真看待新闻写作，并认为做好它需要能力。</p>\n<p>从“把一种职业看成使命”推到“作家必须完成某些新闻目标”，中间少了一步原文依据。</p></section><section class=\"revealPart\" id=\"focus-q23-A-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n<p>真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。</p>\n</blockquote>\n<p>原文后面强调的是作家有没有能力把新闻写作做好。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Writers have a duty to serve the goals of journalism and should be responsible for fulfilling them.</p>\n<p>作家有责任服务于新闻写作的目标，并应当负责完成这些目标。</p>\n</blockquote>\n<p>原文讨论的是能力门槛，A却转去说责任和目标，后文走的并不是这条线。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-A-2","meta":{"kind":"method","question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false}},{"title":"A. It is writers’ duty to fulfill journalistic goals.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入23题题干：","","> 既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该围绕新闻写作的价值、难度或能力要求。","","但A实际说的是：","","> It is writers’ duty to fulfill journalistic goals.  ","> 完成新闻写作目标是作家的责任","","全文和第三段都没有给作家规定一套必须完成的新闻目标。原文写的是两人怎样看待新闻工作，以及做好这项工作需要什么能力；A却把“能力和职业认同”改成了“责任和目标”。","","主旨能够把我们带回“过去评论家有能力、有职业认同”这条线，却补不出A所说的责任要求。","","**复盘判断：A错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入23题题干：\n\n> 既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该围绕新闻写作的价值、难度或能力要求。\n\n但A实际说的是：\n\n> It is writers’ duty to fulfill journalistic goals.  \n> 完成新闻写作目标是作家的责任\n\n全文和第三段都没有给作家规定一套必须完成的新闻目标。原文写的是两人怎样看待新闻工作，以及做好这项工作需要什么能力；A却把“能力和职业认同”改成了“责任和目标”。\n\n主旨能够把我们带回“过去评论家有能力、有职业认同”这条线，却补不出A所说的责任要求。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出原文谈的是职业态度和能力，没有出现<code>duty</code>和<code>journalistic goals</code>，因此排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借了<code>calling</code>和<code>serious business</code>里的“认真、使命感”，又往前推成“作家有责任完成一套新闻目标”。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>These men believed in journalism as a calling.</p>\n<p>Theirs was a serious business.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家有责任完成新闻写作目标。</p>\n</blockquote>\n<p>原文中的<code>calling</code>可以译为“使命、天职、职业召唤”，说明他们怎样看待新闻工作：这是一件值得认真投入的职业。</p>\n<p>但A又加上了两层原文没有的信息：</p>\n<ul>\n<li><code>writers’ duty</code>：所有作家负有某种责任；</li>\n<li><code>journalistic goals</code>：存在一组需要完成的具体新闻目标。</li>\n</ul>\n<p>文章没有列出这些目标，也没有讨论作家如果不完成目标会怎样。它只是说Shaw和Newman认真看待新闻写作，并认为做好它需要能力。</p>\n<p>从“把一种职业看成使命”推到“作家必须完成某些新闻目标”，中间少了一步原文依据。</p></section><section class=\"revealPart\" id=\"focus-q23-A-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n<p>真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。</p>\n</blockquote>\n<p>原文后面强调的是作家有没有能力把新闻写作做好。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Writers have a duty to serve the goals of journalism and should be responsible for fulfilling them.</p>\n<p>作家有责任服务于新闻写作的目标，并应当负责完成这些目标。</p>\n</blockquote>\n<p>原文讨论的是能力门槛，A却转去说责任和目标，后文走的并不是这条线。</p></section><section class=\"revealPart\" id=\"focus-q23-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该围绕新闻写作的价值、难度或能力要求。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>It is writers’ duty to fulfill journalistic goals.<br />\n完成新闻写作目标是作家的责任</p>\n</blockquote>\n<p>全文和第三段都没有给作家规定一套必须完成的新闻目标。原文写的是两人怎样看待新闻工作，以及做好这项工作需要什么能力；A却把“能力和职业认同”改成了“责任和目标”。</p>\n<p>主旨能够把我们带回“过去评论家有能力、有职业认同”这条线，却补不出A所说的责任要求。</p>\n<p><strong>复盘判断：A错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-A-3","meta":{"kind":"method","question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true}},{"title":"B. It is contemptible for writers to be journalists.","level":3,"lines":["### B. It is contemptible for writers to be journalists.","","> 作家做新闻工作者是一件可鄙的事","","**做题模式中的状态：**当时`contemptible`和原文的`contempt`被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。","","**错误类型：第一类——歪曲原意。**","","B借用了`a term of contempt`，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。","","**出处：**","","> I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”."],"section":"第三鸟 · 题目复盘","raw":"### B. It is contemptible for writers to be journalists.\n\n> 作家做新闻工作者是一件可鄙的事\n\n**做题模式中的状态：**当时`contemptible`和原文的`contempt`被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。\n\n**错误类型：第一类——歪曲原意。**\n\nB借用了`a term of contempt`，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。\n\n**出处：**\n\n> I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>contemptible</code>和原文的<code>contempt</code>被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了<code>a term of contempt</code>，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-B-0","meta":{"kind":"option","question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false}},{"title":"B. It is contemptible for writers to be journalists.","level":4,"lines":["#### 定位比对法","","把B接到题干后面，整句话是在说：","","> Shaw和Newman最可能都认为，作家去做新闻工作者是一件可鄙的事。","","原文确实出现了`contempt`，但要看是谁在轻蔑谁：","","> a term of contempt applied by writers who are not read to writers who are","> 一个由“没人读的作家”用来称呼“有人读的作家”的轻蔑词","","Newman是在讽刺那些把`journalism`当蔑称的人。他不是认同这个蔑称，更不是说作家从事新闻工作本身可鄙。","","前文还明确写：","","> These men ... were proud to be published in the daily press.","> 这些人以能在日报上发表为荣。","","如果两人以日报发表为荣，就不可能同时认为作家做新闻工作者是一件可鄙的事。B把引语中的讽刺对象和评价方向都反了。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Shaw和Newman最可能都认为，作家去做新闻工作者是一件可鄙的事。\n\n原文确实出现了`contempt`，但要看是谁在轻蔑谁：\n\n> a term of contempt applied by writers who are not read to writers who are\n> 一个由“没人读的作家”用来称呼“有人读的作家”的轻蔑词\n\nNewman是在讽刺那些把`journalism`当蔑称的人。他不是认同这个蔑称，更不是说作家从事新闻工作本身可鄙。\n\n前文还明确写：\n\n> These men ... were proud to be published in the daily press.\n> 这些人以能在日报上发表为荣。\n\n如果两人以日报发表为荣，就不可能同时认为作家做新闻工作者是一件可鄙的事。B把引语中的讽刺对象和评价方向都反了。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>contemptible</code>和原文的<code>contempt</code>被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了<code>a term of contempt</code>，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家去做新闻工作者是一件可鄙的事。</p>\n</blockquote>\n<p>原文确实出现了<code>contempt</code>，但要看是谁在轻蔑谁：</p>\n<blockquote>\n<p>a term of contempt applied by writers who are not read to writers who are\n一个由“没人读的作家”用来称呼“有人读的作家”的轻蔑词</p>\n</blockquote>\n<p>Newman是在讽刺那些把<code>journalism</code>当蔑称的人。他不是认同这个蔑称，更不是说作家从事新闻工作本身可鄙。</p>\n<p>前文还明确写：</p>\n<blockquote>\n<p>These men ... were proud to be published in the daily press.\n这些人以能在日报上发表为荣。</p>\n</blockquote>\n<p>如果两人以日报发表为荣，就不可能同时认为作家做新闻工作者是一件可鄙的事。B把引语中的讽刺对象和评价方向都反了。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-B-1","meta":{"kind":"method","question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false}},{"title":"B. It is contemptible for writers to be journalists.","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> These men believed in journalism as a calling, and were proud to be published in the daily press.",">","> 这些人把新闻写作看成一种使命，并以在日报发表为荣。","","实际写法对他们从事新闻写作持正面态度。","","如果B成立，文章至少应该改成：","","> Shaw and Newman regarded journalism as a contemptible occupation and felt ashamed to be associated with the daily press.",">","> Shaw和Newman认为新闻工作是一种可鄙的职业，也以自己与日报有关联为耻。","","实际文章写“使命”和“自豪”，B要求的却是“可鄙”和“羞耻”，评价方向正好相反。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> These men believed in journalism as a calling, and were proud to be published in the daily press.\n>\n> 这些人把新闻写作看成一种使命，并以在日报发表为荣。\n\n原文对他们从事新闻写作的态度是正面的。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Shaw and Newman regarded journalism as a contemptible occupation and felt ashamed to be associated with the daily press.\n>\n> Shaw和Newman认为新闻工作是一种可鄙的职业，也以自己与日报有关联为耻。\n\n原文写的是“使命”和“自豪”，B却变成“可鄙”和“羞耻”，评价方向正好相反。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>contemptible</code>和原文的<code>contempt</code>被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了<code>a term of contempt</code>，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家去做新闻工作者是一件可鄙的事。</p>\n</blockquote>\n<p>原文确实出现了<code>contempt</code>，但要看是谁在轻蔑谁：</p>\n<blockquote>\n<p>a term of contempt applied by writers who are not read to writers who are\n一个由“没人读的作家”用来称呼“有人读的作家”的轻蔑词</p>\n</blockquote>\n<p>Newman是在讽刺那些把<code>journalism</code>当蔑称的人。他不是认同这个蔑称，更不是说作家从事新闻工作本身可鄙。</p>\n<p>前文还明确写：</p>\n<blockquote>\n<p>These men ... were proud to be published in the daily press.\n这些人以能在日报上发表为荣。</p>\n</blockquote>\n<p>如果两人以日报发表为荣，就不可能同时认为作家做新闻工作者是一件可鄙的事。B把引语中的讽刺对象和评价方向都反了。</p></section><section class=\"revealPart\" id=\"focus-q23-B-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n<p>这些人把新闻写作看成一种使命，并以在日报发表为荣。</p>\n</blockquote>\n<p>原文对他们从事新闻写作的态度是正面的。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Shaw and Newman regarded journalism as a contemptible occupation and felt ashamed to be associated with the daily press.</p>\n<p>Shaw和Newman认为新闻工作是一种可鄙的职业，也以自己与日报有关联为耻。</p>\n</blockquote>\n<p>原文写的是“使命”和“自豪”，B却变成“可鄙”和“羞耻”，评价方向正好相反。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-B-2","meta":{"kind":"method","question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false}},{"title":"B. It is contemptible for writers to be journalists.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入23题题干：","","> 既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该体现他们对新闻写作的正面职业认同。","","但B实际说的是：","","> It is contemptible for writers to be journalists.  ","> 作家做新闻工作者是一件可鄙的事","","第三段把两人写成以在日报发表为荣，也把新闻写作当成一项严肃工作。B却把这种正面态度改成轻蔑和羞耻，刚好把方向翻了过来。","","如果B成立，第三段就无法用两人的职业认同来证明旧式评论有分量。它与局部原文和全文主旨都冲突。","","**复盘判断：B错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入23题题干：\n\n> 既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该体现他们对新闻写作的正面职业认同。\n\n但B实际说的是：\n\n> It is contemptible for writers to be journalists.  \n> 作家做新闻工作者是一件可鄙的事\n\n第三段把两人写成以在日报发表为荣，也把新闻写作当成一项严肃工作。B却把这种正面态度改成轻蔑和羞耻，刚好把方向翻了过来。\n\n如果B成立，第三段就无法用两人的职业认同来证明旧式评论有分量。它与局部原文和全文主旨都冲突。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>contemptible</code>和原文的<code>contempt</code>被遮挡，B与D一起留下；复盘恢复词义后，可以看清它怎样误读Newman的讽刺定义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>B借用了<code>a term of contempt</code>，但把“journalism这个词被某些作家当作蔑称使用”改成了“作家从事新闻工作本身可鄙”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as “a term of contempt applied by writers who are not read to writers who are”.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家去做新闻工作者是一件可鄙的事。</p>\n</blockquote>\n<p>原文确实出现了<code>contempt</code>，但要看是谁在轻蔑谁：</p>\n<blockquote>\n<p>a term of contempt applied by writers who are not read to writers who are\n一个由“没人读的作家”用来称呼“有人读的作家”的轻蔑词</p>\n</blockquote>\n<p>Newman是在讽刺那些把<code>journalism</code>当蔑称的人。他不是认同这个蔑称，更不是说作家从事新闻工作本身可鄙。</p>\n<p>前文还明确写：</p>\n<blockquote>\n<p>These men ... were proud to be published in the daily press.\n这些人以能在日报上发表为荣。</p>\n</blockquote>\n<p>如果两人以日报发表为荣，就不可能同时认为作家做新闻工作者是一件可鄙的事。B把引语中的讽刺对象和评价方向都反了。</p></section><section class=\"revealPart\" id=\"focus-q23-B-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n<p>这些人把新闻写作看成一种使命，并以在日报发表为荣。</p>\n</blockquote>\n<p>原文对他们从事新闻写作的态度是正面的。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Shaw and Newman regarded journalism as a contemptible occupation and felt ashamed to be associated with the daily press.</p>\n<p>Shaw和Newman认为新闻工作是一种可鄙的职业，也以自己与日报有关联为耻。</p>\n</blockquote>\n<p>原文写的是“使命”和“自豪”，B却变成“可鄙”和“羞耻”，评价方向正好相反。</p></section><section class=\"revealPart\" id=\"focus-q23-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的内容，也应该体现他们对新闻写作的正面职业认同。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>It is contemptible for writers to be journalists.<br />\n作家做新闻工作者是一件可鄙的事</p>\n</blockquote>\n<p>第三段把两人写成以在日报发表为荣，也把新闻写作当成一项严肃工作。B却把这种正面态度改成轻蔑和羞耻，刚好把方向翻了过来。</p>\n<p>如果B成立，第三段就无法用两人的职业认同来证明旧式评论有分量。它与局部原文和全文主旨都冲突。</p>\n<p><strong>复盘判断：B错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-B-3","meta":{"kind":"method","question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B", 题干，整句话就变成：\n\n> Shaw和Newman最可能都认为，作家很容易被吸引进新闻业。\n\n原文的结构是：\n\n- 主语：`I`，指Newman；\n- 谓语：`am tempted`，忍不住、很想；\n- 后面的动作：`to define`，去定义；\n- 被定义的对象：`journalism`这个词。\n\n所以原文的意思是：\n\n> Newman忍不住想给“journalism”下一个定义。\n\nC却把主语换成`Writers`，把`to define journalism`改成`into journalism`，动作也从“定义一个词”变成“进入一种职业”。\n\n这些词都来自原文，但原句的语法关系已经被彻底打散。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>作家很可能受到诱惑而进入新闻业</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能够根据主语和动作关系排除C，不需要知道<code>contempt</code>的含义。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C抓住<code>tempted</code>、<code>writers</code>和<code>journalism</code>三个原文词，却把它们从原来的语法位置中拆开，重新拼成“作家被诱惑进入新闻业”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I am tempted to define “journalism” as ...</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家很容易被吸引进新闻业。</p>\n</blockquote>\n<p>原文的结构是：</p>\n<ul>\n<li>主语：<code>I</code>，指Newman；</li>\n<li>谓语：<code>am tempted</code>，忍不住、很想；</li>\n<li>后面的动作：<code>to define</code>，去定义；</li>\n<li>被定义的对象：<code>journalism</code>这个词。</li>\n</ul>\n<p>所以原文的意思是：</p>\n<blockquote>\n<p>Newman忍不住想给“journalism”下一个定义。</p>\n</blockquote>\n<p>C却把主语换成<code>Writers</code>，把<code>to define journalism</code>改成<code>into journalism</code>，动作也从“定义一个词”变成“进入一种职业”。</p>\n<p>这些词都来自原文，但原句的语法关系已经被彻底打散。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-C-1","meta":{"kind":"method","question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false}},{"title":"C. Writers are likely to be tempted into journalism.","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> I am tempted to define “journalism” as ...",">","> 我忍不住想把“新闻写作”定义为……","","实际写法中的`tempted`说的是Newman忍不住想下定义，没有继续讨论作家为什么进入新闻业。","","如果C成立，文章至少应该改成：","","> Writers are often tempted to enter
