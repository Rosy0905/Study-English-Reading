<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"lines":[],"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n< raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3><p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p></section>","context":{"mode":"image","asset":"annotated","label":"第1段原文","focus":[0,92,1080,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"focusId":"focus-paragraph-1-0"},{"title":"第1段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3><p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3><p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p></section>","context":{"mode":"image","asset":"annotated","label":"第1段原文","focus":[0,92,1080,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"focusId":"focus-paragraph-1-1"},{"title":"第1段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3><p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3><p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3><p>在所有变化中 / 这些变化已发生 / 在英语报纸中 / 在过去25年里，/ 或许最深远的变化 / 一直是 / 不可逆转的下降 / 在范围和严肃性方面 / 对其艺术报道。</p></section>","context":{"mode":"image","asset":"annotated","label":"第1段原文","focus":[0,92,1080,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"focusId":"focus-paragraph-1-2"},{"title":"第1段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3><p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3><p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3><p>在所有变化中 / 这些变化已发生 / 在英语报纸中 / 在过去25年里，/ 或许最深远的变化 / 一直是 / 不可逆转的下降 / 在范围和严肃性方面 / 对其艺术报道。</p></section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段</h3><p>在过去的四分之一个世纪里，英语报纸所经历的种种变化中，或许最深远的一项，便是其艺术报道在广度与严肃性上的持续衰退。</p></section>","context":{"mode":"image","asset":"annotated","label":"第1段原文","focus":[0,92,1080,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"focusId":"focus-paragraph-1-3"},{"title":"第2段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3><p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p></section>","context":{"mode":"image","asset":"annotated","label":"第2段原文","focus":[0,404,1080,610],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-2-0"},{"title":"第2段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3><p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3><p>It is difficult / to the point of impossibility / for the average reader / under the age of forty / to imagine / a time / when high-quality arts criticism / could be found / in most big-city newspapers.</p><p>Yet / a considerable number / of the most significant collections / of criticism / published in the 20th century / consisted in large part / of newspaper reviews.</p><p>To read such books today / is to marvel / at the fact / that their learned contents / were once deemed suitable / for publication / in general-circulation dailies.</p></section>","context":{"mode":"image","asset":"annotated","label":"第2段原文","focus":[0,404,1080,610],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-2-1"},{"title":"第2段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3><p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3><p>It is difficult / to the point of impossibility / for the average reader / under the age of forty / to imagine / a time / when high-quality arts criticism / could be found / in most big-city newspapers.</p><p>Yet / a considerable number / of the most significant collections / of criticism / published in the 20th century / consisted in large part / of newspaper reviews.</p><p>To read such books today / is to marvel / at the fact / that their learned contents / were once deemed suitable / for publication / in general-circulation dailies.</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3><p>很难 / 几乎不可能 / 对于普通读者来说 / 40岁以下的 / 去想象 / 一个时代 / 当高质量的艺术评论 / 能够被找到 / 在大部分大城市的报纸里。</p><p>然而 / 相当多的数量 / 最重要的选集之一 / 评论的 / 出版于20世纪 / 大部分由 / 报纸评论构成。</p><p>今天读这些书 / 就是惊叹 / 这个事实 / 它们博学的内容 / 曾经被认为适合 / 出版 / 在大众发行的日报上。</p></section>","context":{"mode":"image","asset":"annotated","label":"第2段原文","focus":[0,404,1080,610],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-2-2"},{"title":"第2段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3><p>It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers. Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of newspaper reviews. To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3><p>It is difficult / to the point of impossibility / for the average reader / under the age of forty / to imagine / a time / when high-quality arts criticism / could be found / in most big-city newspapers.</p><p>Yet / a considerable number / of the most significant collections / of criticism / published in the 20th century / consisted in large part / of newspaper reviews.</p><p>To read such books today / is to marvel / at the fact / that their learned contents / were once deemed suitable / for publication / in general-circulation dailies.</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3><p>很难 / 几乎不可能 / 对于普通读者来说 / 40岁以下的 / 去想象 / 一个时代 / 当高质量的艺术评论 / 能够被找到 / 在大部分大城市的报纸里。</p><p>然而 / 相当多的数量 / 最重要的选集之一 / 评论的 / 出版于20世纪 / 大部分由 / 报纸评论构成。</p><p>今天读这些书 / 就是惊叹 / 这个事实 / 它们博学的内容 / 曾经被认为适合 / 出版 / 在大众发行的日报上。</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-3\"><h3>标准译文 · 第2段</h3><p>对四十岁以下的普通读者而言，几乎难以想象曾经有那么一段时期——在大多数大城市报纸上，都能读到高水准的艺术评论。然而，20世纪里许多最具分量的评论文集，在很大程度上都由报纸书评汇编而成。今天翻阅这些著作，人们会惊叹：这些博学深邃的文字当年竟被视作适合刊登于面向大众发行的日报。</p></section>","context":{"mode":"image","asset":"annotated","label":"第2段原文","focus":[0,404,1080,610],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-2-3"},{"title":"第3段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3><p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. &quot;So few authors have brains enough or literary gift enough to keep their own end up in journalism,&quot; Newman wrote, &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt applied by writers who are not read to writers who are&#x27;.&quot;</p></section>","context":{"mode":"image","asset":"annotated","label":"第3段原文","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-3-0"},{"title":"第3段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3><p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. &quot;So few authors have brains enough or literary gift enough to keep their own end up in journalism,&quot; Newman wrote, &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt applied by writers who are not read to writers who are&#x27;.&quot;</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3><p>We / are even farther removed / from the unfocused newspaper reviews / published in England / between the turn of the 20th century and the eve of World War II, / at a time / when newsprint was dirt-cheap / and stylish arts criticism / was considered an ornament / to the publications / in which it appeared.</p><p>In those far-off days, / it was taken for granted / that the critics / of major papers / would write / in detail and at length / about the events / they covered.</p><p>Theirs / was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know / what they were about.</p><p>These men / believed / in journalism as a calling, / and were proud / to be published / in the daily press.</p><p>&quot;So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,&quot; / Newman wrote, / &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt / applied by writers who are not read / to writers who are.&#x27;&quot;</p></section>","context":{"mode":"image","asset":"annotated","label":"第3段原文","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-3-1"},{"title":"第3段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3><p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. &quot;So few authors have brains enough or literary gift enough to keep their own end up in journalism,&quot; Newman wrote, &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt applied by writers who are not read to writers who are&#x27;.&quot;</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3><p>We / are even farther removed / from the unfocused newspaper reviews / published in England / between the turn of the 20th century and the eve of World War II, / at a time / when newsprint was dirt-cheap / and stylish arts criticism / was considered an ornament / to the publications / in which it appeared.</p><p>In those far-off days, / it was taken for granted / that the critics / of major papers / would write / in detail and at length / about the events / they covered.</p><p>Theirs / was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know / what they were about.</p><p>These men / believed / in journalism as a calling, / and were proud / to be published / in the daily press.</p><p>&quot;So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,&quot; / Newman wrote, / &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt / applied by writers who are not read / to writers who are.&#x27;&quot;</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3><p>我们 / 更加遥远了 / 从那些漫无边际的报纸评论 / 发表在英国 / 在20世纪初到二战前夕之间，/ 在一个时代 / 当新闻纸非常廉价 / 并且风格化的艺术评论 / 被认为是一种装饰 / 对于这些出版物来说 / 它们所出现的。</p><p>在那些遥远的日子里，/ 理所当然 / 评论家们 / 来自主要报纸的 / 会撰写 / 详细且长篇地 / 关于这些事件 / 他们所报道的。</p><p>他们的工作 / 是严肃的事业，/ 甚至那些评论家 / 那些不炫耀自身学识的，/ 比如萧伯纳和欧内斯特·纽曼，/ 是可以信赖的 / 去了解 / 他们所做的事。</p><p>这些人 / 相信 / 新闻作为一种使命，/ 并且以此为荣 / 被发表 / 在日报上。</p><p>&quot;如此少的作家 / 有足够智慧或文学天赋 / 能在新闻界立足，&quot; / 纽曼写道，/ &quot;以至于我忍不住将&#x27;新闻&#x27;定义为&#x27;一种蔑称 / 由不被阅读的作家使用 / 对被广泛阅读的作家&#x27;。&quot;</p></section>","context":{"mode":"image","asset":"annotated","label":"第3段原文","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-3-2"},{"title":"第3段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3><p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. &quot;So few authors have brains enough or literary gift enough to keep their own end up in journalism,&quot; Newman wrote, &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt applied by writers who are not read to writers who are&#x27;.&quot;</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3><p>We / are even farther removed / from the unfocused newspaper reviews / published in England / between the turn of the 20th century and the eve of World War II, / at a time / when newsprint was dirt-cheap / and stylish arts criticism / was considered an ornament / to the publications / in which it appeared.</p><p>In those far-off days, / it was taken for granted / that the critics / of major papers / would write / in detail and at length / about the events / they covered.</p><p>Theirs / was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know / what they were about.</p><p>These men / believed / in journalism as a calling, / and were proud / to be published / in the daily press.</p><p>&quot;So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,&quot; / Newman wrote, / &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt / applied by writers who are not read / to writers who are.&#x27;&quot;</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3><p>我们 / 更加遥远了 / 从那些漫无边际的报纸评论 / 发表在英国 / 在20世纪初到二战前夕之间，/ 在一个时代 / 当新闻纸非常廉价 / 并且风格化的艺术评论 / 被认为是一种装饰 / 对于这些出版物来说 / 它们所出现的。</p><p>在那些遥远的日子里，/ 理所当然 / 评论家们 / 来自主要报纸的 / 会撰写 / 详细且长篇地 / 关于这些事件 / 他们所报道的。</p><p>他们的工作 / 是严肃的事业，/ 甚至那些评论家 / 那些不炫耀自身学识的，/ 比如萧伯纳和欧内斯特·纽曼，/ 是可以信赖的 / 去了解 / 他们所做的事。</p><p>这些人 / 相信 / 新闻作为一种使命，/ 并且以此为荣 / 被发表 / 在日报上。</p><p>&quot;如此少的作家 / 有足够智慧或文学天赋 / 能在新闻界立足，&quot; / 纽曼写道，/ &quot;以至于我忍不住将&#x27;新闻&#x27;定义为&#x27;一种蔑称 / 由不被阅读的作家使用 / 对被广泛阅读的作家&#x27;。&quot;</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-3\"><h3>标准译文 · 第3段</h3><p>我们与20世纪初至二战前夕英国报纸所刊发的那些漫谈式评论，更已相距甚远。那时新闻纸价格低廉，风格精致的艺术评论被视为报纸的一大点缀。在那遥远的年代，人们理所当然地认定，大报的评论家会详尽且篇幅充足地撰写所评之作；他们的职责无比严肃。即便是像乔治·伯纳德·肖、欧内斯特·纽曼这类轻松挥洒学识的评论家，也能让人放心其专业可靠。这些人笃信新闻事业是一种使命，并以能在日报发表文章为傲。纽曼曾写道：&quot;能在新闻界自立的作家，既要有头脑也要有文才，如此稀少，以至于我几乎要把&#x27;新闻工作&#x27;定义为：&#x27;不被阅读的作家用来贬抑被阅读的作家的一种称谓。&#x27;&quot;</p></section>","context":{"mode":"image","asset":"annotated","label":"第3段原文","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-3-3"},{"title":"第4段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3><p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England&#x27;s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p></section>","context":{"mode":"image","asset":"annotated","label":"第4段原文","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-4-0"},{"title":"第4段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3><p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England&#x27;s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3><p>Unfortunately, / these critics / are virtually forgotten.</p><p>Neville Cardus, / who wrote for the Manchester Guardian / from 1917 / until shortly before his death in 1975, / is now known solely / as a writer of essays / on the game of cricket.</p><p>During his lifetime, though, / he was also / one of England&#x27;s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p><p>He / was knighted / in 1967, / the first music critic / to be so honored.</p><p>Yet / only one of his books / is now in print, / and his vast body of writings on music / is unknown / save to specialists.</p></section>","context":{"mode":"image","asset":"annotated","label":"第4段原文","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-4-1"},{"title":"第4段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3><p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England&#x27;s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3><p>Unfortunately, / these critics / are virtually forgotten.</p><p>Neville Cardus, / who wrote for the Manchester Guardian / from 1917 / until shortly before his death in 1975, / is now known solely / as a writer of essays / on the game of cricket.</p><p>During his lifetime, though, / he was also / one of England&#x27;s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p><p>He / was knighted / in 1967, / the first music critic / to be so honored.</p><p>Yet / only one of his books / is now in print, / and his vast body of writings on music / is unknown / save to specialists.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3><p>不幸的是，/ 这些评论家 / 几乎被遗忘了。</p><p>内维尔·卡达斯，/ 为《曼彻斯特卫报》撰稿的 / 自1917年 / 直到1975年他去世前不久，/ 现在仅仅被人们所知 / 作为一名散文作家 / 关于板球比赛的。</p><p>尽管在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位广受赞誉的文体家，/ 以至于他的《自传》（1947年）/ 成为了一本畅销书。</p><p>他 / 被封为爵士 / 于1967年，/ 第一位音乐评论家 / 获此殊荣。</p><p>然而 / 现在他只有一本书 / 仍在印刷中，/ 他大量的音乐著作 / 不为人所知 / 除了专业人士以外。</p></section>","context":{"mode":"image","asset":"annotated","label":"第4段原文","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-4-2"},{"title":"第4段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3><p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England&#x27;s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3><p>Unfortunately, / these critics / are virtually forgotten.</p><p>Neville Cardus, / who wrote for the Manchester Guardian / from 1917 / until shortly before his death in 1975, / is now known solely / as a writer of essays / on the game of cricket.</p><p>During his lifetime, though, / he was also / one of England&#x27;s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p><p>He / was knighted / in 1967, / the first music critic / to be so honored.</p><p>Yet / only one of his books / is now in print, / and his vast body of writings on music / is unknown / save to specialists.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3><p>不幸的是，/ 这些评论家 / 几乎被遗忘了。</p><p>内维尔·卡达斯，/ 为《曼彻斯特卫报》撰稿的 / 自1917年 / 直到1975年他去世前不久，/ 现在仅仅被人们所知 / 作为一名散文作家 / 关于板球比赛的。</p><p>尽管在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位广受赞誉的文体家，/ 以至于他的《自传》（1947年）/ 成为了一本畅销书。</p><p>他 / 被封为爵士 / 于1967年，/ 第一位音乐评论家 / 获此殊荣。</p><p>然而 / 现在他只有一本书 / 仍在印刷中，/ 他大量的音乐著作 / 不为人所知 / 除了专业人士以外。</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-3\"><h3>标准译文 · 第4段</h3><p>遗憾的是，如今这些评论家几乎被世人遗忘。内维尔·卡德斯自1917年起为《曼彻斯特卫报》撰稿，直至1975年去世前不久；如今他只因其关于板球的散文而为人所知。可在他生前，他同时也是英国首屈一指的古典音乐评论家，其文笔之精妙广受赞誉，以至于其《自传》（1947）跃升为畅销书。他在1967年被封爵，成为首位获此殊荣的音乐评论家。然而，时至今日，他的著作仅有一本仍在付印，他那浩繁的音乐评论作品，除专业人士外已鲜有人涉猎。</p></section>","context":{"mode":"image","asset":"annotated","label":"第4段原文","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-4-3"},{"title":"第5段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Is there any chance that Cardus&#x27;s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-5-0"},{"title":"第5段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Is there any chance that Cardus&#x27;s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3><p>Is there any chance / that Cardus&#x27;s criticism / will enjoy a revival?</p><p>The prospect / seems remote.</p><p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p><p>Moreover, / the amateur tradition / in music criticism / has been / in headlong retreat.</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-5-1"},{"title":"第5段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Is there any chance that Cardus&#x27;s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3><p>Is there any chance / that Cardus&#x27;s criticism / will enjoy a revival?</p><p>The prospect / seems remote.</p><p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p><p>Moreover, / the amateur tradition / in music criticism / has been / in headlong retreat.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3><p>是否有任何可能性 / 卡达斯的评论 / 会重新受到青睐？</p><p>这个前景 / 看起来渺茫。</p><p>新闻品味 / 已经发生了改变 / 在他去世前很久，/ 并且后现代的读者 / 几乎不需要 / 他所擅长的这种丰富华丽的维多利亚爱德华风格的散文。</p><p>此外，/ 业余传统 / 在音乐评论中 / 一直处于 / 急速的衰退中。</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-5-2"},{"title":"第5段","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Is there any chance that Cardus&#x27;s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3><p>Is there any chance / that Cardus&#x27;s criticism / will enjoy a revival?</p><p>The prospect / seems remote.</p><p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p><p>Moreover, / the amateur tradition / in music criticism / has been / in headlong retreat.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3><p>是否有任何可能性 / 卡达斯的评论 / 会重新受到青睐？</p><p>这个前景 / 看起来渺茫。</p><p>新闻品味 / 已经发生了改变 / 在他去世前很久，/ 并且后现代的读者 / 几乎不需要 / 他所擅长的这种丰富华丽的维多利亚爱德华风格的散文。</p><p>此外，/ 业余传统 / 在音乐评论中 / 一直处于 / 急速的衰退中。</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段</h3><p>卡德斯的评论还有复兴的可能吗？希望似乎渺茫。早在他去世前，报纸的审美取向就已改变，而后现代读者对他那华丽、维多维多会时代（Vicwardian）风格的散文化文字兴趣寥寥。此外，音乐评论中的&quot;业余传统&quot;也早已一路式微。</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[0,2972,1080,585],"sourceW":1080,"sourceH":6116},"focusId":"focus-paragraph-5-3"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","level":2,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>","context":{"mode":"image","asset":"annotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116}},{"title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<p><strong>第1段</strong></p>\n<p>Of all the changes：(that have taken place：(in English-language newspapers：(during the past quarter-century))) → perhaps the most far-reaching → has been → the inexorable decline：(in the scope and seriousness：(of their arts coverage))</p>\n<p><strong>第2段</strong></p>\n<p>It → is difficult：(to the point of impossibility) → for the average reader：(under the age of forty) → to imagine → a time：(when high-quality arts criticism → could be found → in most big-city newspapers).</p>\n<p>Yet + (a considerable number：(of the most significant collections：(of criticism)) → published：(in the 20th century) → consisted：(in large part) → of newspaper reviews).</p>\n<p>To read such books today → is to marvel → at the fact：(that their learned contents → were once deemed suitable → for publication：(in general-circulation dailies)).</p>\n<p><strong>第3段</strong></p>\n<p>We → are even farther removed → from the unfocused newspaper reviews：(published in England：(between the turn of the 20th century and the eve of World War II)，at a time：(when newsprint was dirt-cheap + stylish arts criticism → was considered an ornament → to the publications：(in which it appeared))).</p>\n<p>In those far-off days：it → was taken for granted：(that the critics：(of major papers) → would write：(in detail and at length) → about the events：(they covered)).</p>\n<p>Theirs → was a serious business, + even those reviewers：(who wore their learning lightly：(like George Bernard Shaw and Ernest Newman)) → could be trusted → to know：(what they were about).</p>\n<p>These men → believed：(in journalism as a calling) + were proud → to be published：(in the daily press).</p>\n<p>&quot;So few authors：(have brains enough or literary gift enough → to keep their own end up：(in journalism))，&quot; → Newman wrote，&quot;that I am tempted to define 'journalism'：(as 'a term of contempt：(applied by writers who are not read → to writers who are)')&quot;。</p>\n<p><strong>第4段</strong></p>\n<p>Unfortunately, // these critics → are virtually forgotten.</p>\n<p>Neville Cardus：(who wrote for the Manchester Guardian：(from 1917 + until shortly before his death：(in 1975))) → is now known solely：(as a writer of essays：(on the game of cricket)).</p>\n<p>During his lifetime：(though)，// he → was also：(one of England's foremost classical-music critics)，+ and a stylist：(so widely admired：(that his Autobiography (1947) → became a best-seller)).</p>\n<p>He → was knighted：(in 1967)，+ the first music critic：(to be so honored).</p>\n<p>Yet + only one of his books → is now in print，+ and his vast body of writings：(on music) → is unknown：(save to specialists).</p>\n<p><strong>第5段</strong></p>\n<p>Is there any chance：(that Cardus's criticism → will enjoy a revival)?</p>\n<p>The prospect → seems remote.</p>\n<p>Journalistic tastes → had changed：(long before his death)，+ and postmodern readers → have little use：(for the richly upholstered Vicwardian prose：(in which he specialized)).</p>\n<p>Moreover, the amateur tradition：(in music criticism) → has been：(in headlong retreat).</p>","context":{"mode":"image","asset":"annotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116}},{"title":"中文版句子逻辑（选修)","level":3,"lines":[],"section":"第二鸟 · 精读与翻译","raw":"","html":"<p><strong>第1段</strong></p>\n<p>在所有变化中：(这些变化已发生：(在英语报纸中：(在过去25年里))) → 或许最深远的变化 → 一直是 → 不可逆转的下降：(在范围和严肃性：(对其艺术报道))</p>\n<p><strong>第2段</strong></p>\n<p>这 → 很难：(几乎不可能) → 对于普通读者：(40岁以下的) → 去想象 → 一个时代：(当高质量的艺术评论 → 能够被找到 → 在大部分大城市的报纸里)。</p>\n<p>然而 + (相当多的数量：(最重要的选集之一：(评论的)) → 出版：(在20世纪) → 大部分由 → 报纸评论构成)。</p>\n<p>今天读这些书 → 就是惊叹 → 这个事实：(它们博学的内容 → 曾经被认为适合 → 出版：(在大众发行的日报上))。</p>\n<p><strong>第3段</strong></p>\n<p>我们 → 更加遥远了 → 从那些漫无边际的报纸评论：(发表在英国：(在20世纪初到二战前夕之间)，在一个时代：(当新闻纸非常廉价 + 风格化的艺术评论 → 被认为是一种装饰 → 对于这些出版物：(它们所出现的)))。</p>\n<p>在那些遥远的日子里：理所当然：(评论家们：(来自主要报纸的) → 会撰写：(详细且长篇地) → 关于这些事件：(他们所报道的))。</p>\n<p>他们的工作 → 是严肃的事业，+ 甚至那些评论家：(那些不炫耀自身学识的：(比如萧伯纳和欧内斯特·纽曼)) → 是可以信赖的 → 去了解：(他们所做的事)。</p>\n<p>这些人 → 相信：(新闻作为一种使命) + 并且以此为荣 → 被发表：(在日报上)。</p>\n<p>&quot;如此少的作家：(有足够智慧或文学天赋 → 能在新闻界立足)，&quot; → 纽曼写道，&quot;以至于我忍不住将'新闻'定义为：('一种蔑称：(由不被阅读的作家使用 → 对被广泛阅读的作家)')&quot;。</p>\n<p><strong>第4段</strong></p>\n<p>不幸的是，// 这些评论家 → 几乎被遗忘了。</p>\n<p>内维尔·卡达斯：(为《曼彻斯特卫报》撰稿：(自1917年 + 直到去世前不久：(在1975年))) → 现在仅仅被人们所知：(作为一名散文作家：(关于板球比赛的))。</p>\n<p>尽管在他的一生中，// 他 → 也曾是：(英国最杰出的古典音乐评论家之一)，+ 并且是一位文体家：(广受赞誉的：(以至于他的《自传》（1947年）→ 成为了一本畅销书))。</p>\n<p>他 → 被封为爵士：(于1967年)，+ 第一位音乐评论家：(获此殊荣的)。</p>\n<p>然而 + 现在他只有一本书 → 仍在印刷中，+ 他大量的著作：(关于音乐的) → 不为人所知：(除了专业人士以外)。</p>\n<p><strong>第5段</strong></p>\n<p>是否有任何可能性：(卡达斯的评论 → 会重新受到青睐)？</p>\n<p>这个前景 → 看起来渺茫。</p>\n<p>新闻品味 → 已经发生了改变：(在他去世前很久)，+ 并且后现代的读者 → 几乎不需要：(他所擅长的这种丰富华丽的维多利亚爱德华风格的散文)。</p>\n<p>此外，业余传统：(在音乐评论中) → 一直处于：(急速的衰退中)。</p>","context":{"mode":"image","asset":"annotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116}},{"title":"长难句翻译练习（英一必修，英二选修)","level":2,"lines":["","对于长难句的翻译，流程一共五步：","","1. 划分意群；","2. 逐个意群直译；","3. 按照中文语感，把应该放在一起的意群合并；","4. 找到中文句子的骨干，再按照中文语序调整位置；","5. 对完整句子进行艺术加工，整理成参考译文。",""],"section":"第二鸟 · 精读与翻译","raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感，把应该放在一起的意群合并；\n4. 找到中文句子的骨干，再按照中文语序调整位置；\n5. 对完整句子进行艺术加工，整理成参考译文。","html":"<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n","context":{"mode":"image","asset":"annotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116}},{"title":"1. 第一段唯一一句","level":4,"lines":["","> Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.",""],"s rceH":6116,"includeTitle":true},"focusId":"focus-long-1-3","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false}},{"title":"1. 第一段唯一一句","level":4,"lines":["","中文骨干是：","","> 影响最深远的变化，是……的下降。","","再把两个修饰块分别放回“变化”和“下降”前后：","","> 在过去四分之一个世纪英文报纸发生的所有变化中，影响最深远的变化，或许是艺术报道在范围和严肃性上的持续下降。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第四步：寻找句子骨干并按照中文语序调整\n\n这句话先抓住主干：\n\n> 影响最深远的变化，是……的下降。\n\n然后补上时间范围，以及具体在哪些方面下降：\n\n> 在过去四分之一个世纪英文报纸发生的所有变化中，影响最深远的变化，或许是艺术报道在范围和严肃性上的持续下降。","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3><blockquote>\n<p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>在所有变化中 / 这些变化已经发生 / 在英文报纸中 / 在过去四分之一世纪里，/ 或许影响最深远的变化 / 一直是 / 不可阻挡的下降 / 在范围和严肃性方面 / 对它们的艺术报道。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>按中文习惯，先把时间和范围放到前面：</p>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸发生的所有变化中</p>\n</blockquote>\n<p>再把“艺术报道—范围和严肃性—下降”接起来：</p>\n<blockquote>\n<p>艺术报道在范围和严肃性上的不可阻挡的下降</p>\n</blockquote>\n<p>中间两块直接收成：</p>\n<blockquote>\n<p>影响最深远的或许是</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸发生的所有变化中<br />\n影响最深远的或许是<br />\n艺术报道在范围和严肃性上的不可阻挡的下降</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>这句话先抓住主干：</p>\n<blockquote>\n<p>影响最深远的变化，是……的下降。</p>\n</blockquote>\n<p>然后补上时间范围，以及具体在哪些方面下降：</p>\n<blockquote>\n<p>在过去四分之一个世纪英文报纸发生的所有变化中，影响最深远的变化，或许是艺术报道在范围和严肃性上的持续下降。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第1段重点词与语境","focus":[0,92,1080,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"focusId":"focus-long-1-4","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false}},{"title":"1. 第一段唯一一句","level":4,"lines":["","> 在过去四分之一个世纪里，英文报纸经历了许多变化。其中影响最为深远的，或许是艺术报道在覆盖范围和严肃性上的持续衰退。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第五步：艺术加工\n\n> 在过去四分之一个世纪里，英文报纸经历了许多变化。其中影响最为深远的，或许是艺术报道在覆盖范围和严肃性上的持续衰退。","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3><blockquote>\n<p>Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>在所有变化中 / 这些变化已经发生 / 在英文报纸中 / 在过去四分之一世纪里，/ 或许影响最深远的变化 / 一直是 / 不可阻挡的下降 / 在范围和严肃性方面 / 对它们的艺术报道。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>按中文习惯，先把时间和范围放到前面：</p>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸发生的所有变化中</p>\n</blockquote>\n<p>再把“艺术报道—范围和严肃性—下降”接起来：</p>\n<blockquote>\n<p>艺术报道在范围和严肃性上的不可阻挡的下降</p>\n</blockquote>\n<p>中间两块直接收成：</p>\n<blockquote>\n<p>影响最深远的或许是</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>在过去四分之一个世纪里，英文报纸发生的所有变化中<br />\n影响最深远的或许是<br />\n艺术报道在范围和严肃性上的不可阻挡的下降</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>这句话先抓住主干：</p>\n<blockquote>\n<p>影响最深远的变化，是……的下降。</p>\n</blockquote>\n<p>然后补上时间范围，以及具体在哪些方面下降：</p>\n<blockquote>\n<p>在过去四分之一个世纪英文报纸发生的所有变化中，影响最深远的变化，或许是艺术报道在范围和严肃性上的持续下降。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-5\"><h3>第五步：艺术加工</h3><blockquote>\n<p>在过去四分之一个世纪里，英文报纸经历了许多变化。其中影响最为深远的，或许是艺术报道在覆盖范围和严肃性上的持续衰退。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第1段重点词与语境","focus":[0,92,1080,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"focusId":"focus-long-1-5","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":true}},{"title":"2. 第三段第一句","level":4,"lines":["","> We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared.",""],"section":"第二鸟 · 精读与翻译","raw":"#### 原文\n\n> We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared.","html":"<section class=\"revealPart\" id=\"focus-long-2-0\"><h3>原文</h3><blockquote>\n<p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focu \n</blockquote>\n<p>开头直接收成：</p>\n<blockquote>\n<p>我们离……就更远了</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>我们离20世纪之交到二战前夕在英国发表的那些题材自由的报纸评论就更远了<br />\n当时，新闻纸便宜得像土，有风格的艺术评论也被视为报刊的一种点缀</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>这句话先抓住两层主干：</p>\n<blockquote>\n<p>我们与那些报纸评论距离更远。\n那是一个……的时代。</p>\n</blockquote>\n<p>把地点、时间和背景依次放进去即可，不需要保留英文中连续套叠的修饰顺序。</p>\n</section><section class=\"revealPart\" id=\"focus-long-2-5\"><h3>第五步：艺术加工</h3><blockquote>\n<p>我们与20世纪初到第二次世界大战前夕英国报纸上那些题材自由的评论，距离就更远了。当时新闻纸极其便宜，而有风格的艺术评论被视为报纸的一种点缀。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-2-5","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-2","cumulativeFinal":true}},{"title":"3. 第三段纽曼引语","level":4,"lines":["","> “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”",""],"section":"第二鸟 · 精读与翻译","raw":"#### 原文\n\n> “So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3><blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-3-0","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false}},{"title":"3. 第三段纽曼引语","level":4,"lines":["","> “So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第一步：划分意群\n\n> “So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3><blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>“So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-3-1","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false}},{"title":"3. 第三段纽曼引语","level":4,"lines":["","> “如此少的作者 / 有足够的头脑或文学天赋 / 在新闻工作中撑起自己这一头，” / 纽曼写道，/ “以至于我忍不住把‘新闻工作’定义为‘一种蔑称 / 被那些不被阅读的作家使用 / 去称呼那些被阅读的作家。’”",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第二步：逐个意群直译\n\n> “如此少的作者 / 有足够的头脑或文学天赋 / 在新闻工作中撑起自己这一头，” / 纽曼写道，/ “以至于我忍不住把‘新闻工作’定义为‘一种蔑称 / 被那些不被阅读的作家使用 / 去称呼那些被阅读的作家。’”","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3><blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>“So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>“如此少的作者 / 有足够的头脑或文学天赋 / 在新闻工作中撑起自己这一头，” / 纽曼写道，/ “以至于我忍不住把‘新闻工作’定义为‘一种蔑称 / 被那些不被阅读的作家使用 / 去称呼那些被阅读的作家。’”</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-3-2","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false}},{"title":"3. 第三段纽曼引语","level":4,"lines":["","先看`so...that...`结构：","","- `So few authors...`：有能力在新闻写作中站稳脚跟的作者如此少；","- `that I am tempted...`：少到让纽曼忍不住想下一个带讽刺意味的定义。","","定义内部再拆成：","","> a term of contempt / applied by writers who are not read / to writers who are","","即：一种蔑称 / 被不受阅读的作家使用 / 去称呼那些受到阅读的作家。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第三步：按照中文语感合并意群\n\n中文先把“什么样的作者”说完整，再说这样的人很少：\n\n> 有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了\n\n后面是结果，用“少到……”接起来：\n\n> 少到让我忍不住把“新闻工作”定义为\n\n最后改成主动说法：\n\n> 一种没人读的作家用来称呼那些有人读的作家的蔑称\n\n先得到：\n\n> 有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了  \n> 少到让我忍不住把“新闻工作”定义为  \n> 一种没人读的作家用来称呼那些有人读的作家的蔑称","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3><blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>“So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>“如此少的作者 / 有足够的头脑或文学天赋 / 在新闻工作中撑起自己这一头，” / 纽曼写道，/ “以至于我忍不住把‘新闻工作’定义为‘一种蔑称 / 被那些不被阅读的作家使用 / 去称呼那些被阅读的作家。’”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>中文先把“什么样的作者”说完整，再说这样的人很少：</p>\n<blockquote>\n<p>有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了</p>\n</blockquote>\n<p>后面是结果，用“少到……”接起来：</p>\n<blockquote>\n<p>少到让我忍不住把“新闻工作”定义为</p>\n</blockquote>\n<p>最后改成主动说法：</p>\n<blockquote>\n<p>一种没人读的作家用来称呼那些有人读的作家的蔑称</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了<br />\n少到让我忍不住把“新闻工作”定义为<br />\n一种没人读的作家用来称呼那些有人读的作家的蔑称</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-3-3","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false}},{"title":"3. 第三段纽曼引语","level":4,"lines":["","中文骨干是：","","> 真正做得好的作者太少，以至于我想把“新闻工作”定义成一种蔑称。","","接着补充“谁用这个蔑称称呼谁”：","","> 不被阅读的作家，用它来贬低那些有人阅读的作家。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第四步：寻找句子骨干并按照中文语序调整\n\n这句话先抓住主干：\n\n> 能把新闻工作做好的作者太少，以至于我想把“新闻工作”定义成一种蔑称。\n\n接着补充“谁用这个蔑称称呼谁”：\n\n> 不被阅读的作家，用它来贬低那些有人阅读的作家。","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3><blockquote>\n<p>“So few authors have brains enough or literary gift enough to keep their own end up in journalism,” Newman wrote, “that I am tempted to define ‘journalism’ as ‘a term of contempt applied by writers who are not read to writers who are’.”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>“So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,” / Newman wrote, / “that I am tempted to define ‘journalism’ as ‘a term of contempt / applied by writers who are not read / to writers who are.’”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>“如此少的作者 / 有足够的头脑或文学天赋 / 在新闻工作中撑起自己这一头，” / 纽曼写道，/ “以至于我忍不住把‘新闻工作’定义为‘一种蔑称 / 被那些不被阅读的作家使用 / 去称呼那些被阅读的作家。’”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>中文先把“什么样的作者”说完整，再说这样的人很少：</p>\n<blockquote>\n<p>有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了</p>\n</blockquote>\n<p>后面是结果，用“少到……”接起来：</p>\n<blockquote>\n<p>少到让我忍不住把“新闻工作”定义为</p>\n</blockquote>\n<p>最后改成主动说法：</p>\n<blockquote>\n<p>一种没人读的作家用来称呼那些有人读的作家的蔑称</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者太少了<br />\n少到让我忍不住把“新闻工作”定义为<br />\n一种没人读的作家用来称呼那些有人读的作家的蔑称</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>这句话先抓住主干：</p>\n<blockquote>\n<p>能把新闻工作做好的作者太少，以至于我想把“新闻工作”定义成一种蔑称。</p>\n</blockquote>\n<p>接着补充“谁用这个蔑称称呼谁”：</p>\n<blockquote>\n<p>不被阅读的作家，用它来贬低那些有人阅读的作家。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-3-4","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false}},{"title":"3. 第三段纽曼引语","level":4,"lines":["","> 纽曼写道，真正有足够头脑或文学才华、能够在新闻写作中站稳脚跟的作者少之又少，因此他甚至想把“新闻工作”定义成一种蔑称：不被阅读的作家用它来贬低那些有人阅读的作家。",""],"section":"第二鸟 · 精读与 ction>","context":{"mode":"image","asset":"annotated","label":"第3段重点词与语境","focus":[0,1003,1080,1313],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-3-5","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":true}},{"title":"4. 第四段第三句","level":4,"lines":["","> During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.",""],"section":"第二鸟 · 精读与翻译","raw":"#### 原文\n\n> During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3><blockquote>\n<p>During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第4段重点词与语境","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-4-0","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false}},{"title":"4. 第四段第三句","level":4,"lines":["","> During his lifetime, though, / he was also / one of England’s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第一步：划分意群\n\n> During his lifetime, though, / he was also / one of England’s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3><blockquote>\n<p>During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>During his lifetime, though, / he was also / one of England’s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第4段重点词与语境","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-4-1","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false}},{"title":"4. 第四段第三句","level":4,"lines":["","> 不过在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位如此广受赞赏的文体家 / 以至于他的《自传》（1947）/ 成为了一本畅销书。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第二步：逐个意群直译\n\n> 不过在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位如此广受赞赏的文体家 / 以至于他的《自传》（1947）/ 成为了一本畅销书。","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3><blockquote>\n<p>During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>During his lifetime, though, / he was also / one of England’s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>不过在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位如此广受赞赏的文体家 / 以至于他的《自传》（1947）/ 成为了一本畅销书。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第4段重点词与语境","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-4-2","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false}},{"title":"4. 第四段第三句","level":4,"lines":["","先处理并列：","","- `he was also one of England’s foremost classical-music critics`；","- `and a stylist so widely admired that...`。","","第二部分是`so...that...`：文体家如此受赞赏，以至于《自传》成为畅销书。",""],"section":"第二鸟 · 精读与翻译","raw":"#### 第三步：按照中文语感合并意群\n\n先把时间放到前面：\n\n> 不过在他生前\n\n两重身份用“既是……也是……”接起来：\n\n> 他既是英国最杰出的古典音乐评论家之一，也是一位广受赞赏的文体家\n\n最后直接说受欢迎带来的结果：\n\n> 他的文风很受欢迎，连《自传》（1947）也成了畅销书\n\n先得到：\n\n> 不过在他生前  \n> 他既是英国最杰出的古典音乐评论家之一，也是一位广受赞赏的文体家  \n> 他的文风很受欢迎，连《自传》（1947）也成了畅销书","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3><blockquote>\n<p>During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>During his lifetime, though, / he was also / one of England’s foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>不过在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位如此广受赞赏的文体家 / 以至于他的《自传》（1947）/ 成为了一本畅销书。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-3\">\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把时间放到前面：</p>\n<blockquote>\n<p>不过在他生前</p>\n</blockquote>\n<p>两重身份用“既是……也是……”接起来：</p>\n<blockquote>\n<p>他既是英国最杰出的古典音乐评论家之一，也是一位广受赞赏的文体家</p>\n</blockquote>\n<p>最后直接说受欢迎带来的结果：</p>\n<blockquote>\n<p>他的文风很受欢迎，连《自传》（1947）也成了畅销书</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>不过在他生前<br />\n他既是英国最杰出的古典音乐评论家之一，也是一位广受赞赏的文体家<br />\n他的文风很受欢迎，连《自传》（1947）也成了畅销书</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第4段重点词与语境","focus":[0,2140,1080,909],"sourceW":1080,"sourceH":6116},"focusId":"focus-long-4-3","meta":{"kind":"standard","question":null,"option":null,"cumulative":true,"cumulativeGroup":"l
