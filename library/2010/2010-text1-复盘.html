。</p></section><section class=\"revealPart\" id=\"focus-q24-B-2\"><h3>写作视角法</h3><p>原文第4段是这样写的：</p>\n<blockquote>\n<p>a stylist so widely admired that his Autobiography became a best-seller</p>\n<p>He was knighted in 1967</p>\n<p>他的文笔广受赞赏，《自传》成为畅销书，他还在1967年获封爵士。</p>\n</blockquote>\n<p>原文先写他生前得到广泛认可，随后才转到他后来逐渐被遗忘。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>His reputation as a music critic remained controversial for decades, with admirers and critics sharply divided over his work.</p>\n<p>几十年来，他作为音乐评论家的声誉一直存在争议，赞赏者和批评者对他的作品分歧明显。</p>\n</blockquote>\n<p>原文没有写长期争议，B需要的这条展开线并不存在。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-B-2","meta":{"kind":"method","question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false}},{"title":"B. His reputation as a music critic has long been in dispute.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入24题题干：","","> 既然全文用Cardus说明一种旧式艺术评论怎样从公众中心退到边缘，那么最后两段应该写他的过去成就、今天的失落，以及这种变化为什么发生。","","但B实际说的是：","","> His reputation as a music critic has long been in dispute.  ","> 他作为音乐评论家的声誉长期存在争议","","全文写的是Cardus生前广受赞赏，后来逐渐被遗忘。这里的变化是“过去有名、今天失落”，并没有出现长期争议，也没有写支持者和反对者一直围绕他的声誉争论。","","B给Cardus补出了一条文章没有的冲突线。它既不能概括最后两段，也接不上全文由盛转衰的主旨。","","**复盘判断：B错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入24题题干：\n\n> 既然全文用Cardus说明一种旧式艺术评论怎样从公众中心退到边缘，那么最后两段应该写他的过去成就、今天的失落，以及这种变化为什么发生。\n\n但B实际说的是：\n\n> His reputation as a music critic has long been in dispute.  \n> 他作为音乐评论家的声誉长期存在争议\n\n全文写的是Cardus生前广受赞赏，后来逐渐被遗忘。这里的变化是“过去有名、今天失落”，并没有出现长期争议，也没有写支持者和反对者一直围绕他的声誉争论。\n\nB给Cardus补出了一条文章没有的冲突线。它既不能概括最后两段，也接不上全文由盛转衰的主旨。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>他作为音乐评论家的声誉长期存在争议</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>dispute</code>恢复以后，已经能看出原文写的是“生前广受赞赏、后来被遗忘”，而不是“长期有争议”，因此排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用“新闻品味改变”“如今被遗忘”这些变化信息，让人脑补Cardus的音乐评论家声誉长期受到争论。但文章没有写任何赞成与反对双方。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a stylist so widely admired</p>\n<p>these critics are virtually forgotten</p>\n<p>Journalistic tastes had changed long before his death</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-B-1\"><h3>定位比对法</h3><p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus作为音乐评论家的声誉长期存在争议。</p>\n</blockquote>\n<p><code>in dispute</code>表示他的能力、地位或声誉长期被人争论：有人认可，也有人否定，双方意见不一致。</p>\n<p>但原文给出的时间线是：</p>\n<ul>\n<li>生前：<code>widely admired</code>，广受赞赏；</li>\n<li>1967年：成为第一位获封爵士的音乐评论家；</li>\n<li>现在：作品大多绝版，音乐文章除专家外几乎无人知晓。</li>\n</ul>\n<p>这里写的是“过去受推崇，后来被遗忘”，不是“长期有人支持、有人反对”。</p>\n<p><code>Journalistic tastes had changed long before his death</code>说的是新闻写作口味变了，也不等于他的声誉从此陷入争议。品味变化可以让一种风格过时，却不会自动产生<code>dispute</code>。</p></section><section class=\"revealPart\" id=\"focus-q24-B-2\"><h3>写作视角法</h3><p>原文第4段是这样写的：</p>\n<blockquote>\n<p>a stylist so widely admired that his Autobiography became a best-seller</p>\n<p>He was knighted in 1967</p>\n<p>他的文笔广受赞赏，《自传》成为畅销书，他还在1967年获封爵士。</p>\n</blockquote>\n<p>原文先写他生前得到广泛认可，随后才转到他后来逐渐被遗忘。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>His reputation as a music critic remained controversial for decades, with admirers and critics sharply divided over his work.</p>\n<p>几十年来，他作为音乐评论家的声誉一直存在争议，赞赏者和批评者对他的作品分歧明显。</p>\n</blockquote>\n<p>原文没有写长期争议，B需要的这条展开线并不存在。</p></section><section class=\"revealPart\" id=\"focus-q24-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus说明一种旧式艺术评论怎样从公众中心退到边缘，那么最后两段应该写他的过去成就、今天的失落，以及这种变化为什么发生。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>His reputation as a music critic has long been in dispute.<br />\n他作为音乐评论家的声誉长期存在争议</p>\n</blockquote>\n<p>全文写的是Cardus生前广受赞赏，后来逐渐被遗忘。这里的变化是“过去有名、今天失落”，并没有出现长期争议，也没有写支持者和反对者一直围绕他的声誉争论。</p>\n<p>B给Cardus补出了一条文章没有的冲突线。它既不能概括最后两段，也接不上全文由盛转衰的主旨。</p>\n<p><strong>复盘判断：B错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-B-3","meta":{"kind":"method","question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true}},{"title":"C. His style caters largely to modern specialists.","level":3,"lines":["### C. His style caters largely to modern specialists.","","> 他的风格主要迎合现代专家","","**做题模式中的状态：**复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。","","**错误类型：第一类——歪曲原意。**","","C把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。","","**出处：**","","> his vast body of writings on music is unknown save to specialists",">","> the richly upholstered Vicwardian prose in which he specialized"],"section":"第三鸟 · 题目复盘","raw":"### C. His style caters largely to modern specialists.\n\n> 他的风格主要迎合现代专家\n\n**做题模式中的状态：**复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。\n\n**出处：**\n\n> his vast body of writings on music is unknown save to specialists\n>\n> the richly upholstered Vicwardian prose in which he specialized","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>他的风格主要迎合现代专家</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>the richly upholstered Vicwardian prose in which he specialized</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-C-0","meta":{"kind":"option","question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false}},{"title":"C. His style caters largely to modern specialists.","level":4,"lines":["#### 定位比对法","","把C接到题干后面，整句话是在说：","","> 根据最后两段，Cardus的写作风格主要迎合现代专家。","","先看第一处：","","> unknown save to specialists","> 除专家外几乎无人知晓","","它回答的是“今天还有谁知道他的音乐著作”。这是作品传播范围的结果。","","再看C中的：","","> caters largely to modern specialists","> 主要迎合、服务于现代专家","","它回答的是“这种风格原本为谁设计、想满足谁”。这是作者写作对象和目的。","","作品后来只剩专家知道，不等于作者写作时主要迎合专家。一个作品从大众视野中退出以后只在专业圈流传，可能只是被动的小众化，不是主动写给专家。","","第二处`the richly upholstered Vicwardian prose`只说明Cardus擅长怎样的文体；原文紧接着说的是`postmodern readers have little use for`，也就是现代大众不喜欢它，而不是专家特别喜欢它。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据最后两段，Cardus的写作风格主要迎合现代专家。\n\n先看第一处：\n\n> unknown save to specialists\n> 除专家外几乎无人知晓\n\n它回答的是“今天还有谁知道他的音乐著作”。这是作品传播范围的结果。\n\n再看C中的：\n\n> caters largely to modern specialists\n> 主要迎合、服务于现代专家\n\n它回答的是“这种风格原本为谁设计、想满足谁”。这是作者写作对象和目的。\n\n作品后来只剩专家知道，不等于作者写作时主要迎合专家。一个作品从大众视野中退出以后只在专业圈流传，可能只是被动的小众化，不是主动写给专家。\n\n第二处`the richly upholstered Vicwardian prose`只说明Cardus擅长怎样的文体；原文紧接着说的是`postmodern readers have little use for`，也就是现代大众不喜欢它，而不是专家特别喜欢它。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>他的风格主要迎合现代专家</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>the richly upholstered Vicwardian prose in which he specialized</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的写作风格主要迎合现代专家。</p>\n</blockquote>\n<p>先看第一处：</p>\n<blockquote>\n<p>unknown save to specialists\n除专家外几乎无人知晓</p>\n</blockquote>\n<p>它回答的是“今天还有谁知道他的音乐著作”。这是作品传播范围的结果。</p>\n<p>再看C中的：</p>\n<blockquote>\n<p>caters largely to modern specialists\n主要迎合、服务于现代专家</p>\n</blockquote>\n<p>它回答的是“这种风格原本为谁设计、想满足谁”。这是作者写作对象和目的。</p>\n<p>作品后来只剩专家知道，不等于作者写作时主要迎合专家。一个作品从大众视野中退出以后只在专业圈流传，可能只是被动的小众化，不是主动写给专家。</p>\n<p>第二处<code>the richly upholstered Vicwardian prose</code>只说明Cardus擅长怎样的文体；原文紧接着说的是<code>postmodern readers have little use for</code>，也就是现代大众不喜欢它，而不是专家特别喜欢它。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-C-1","meta":{"kind":"method","question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false}},{"title":"C. His style caters largely to modern specialists.","level":4,"lines":["#### 写作视角法","","最后两段实际这样写：","","> his vast body of writings on music is unknown save to specialists",">","> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized",">","> 现在除专家外几乎没人知道他的音乐著作，现代读者也不喜欢他的旧式文体。","","实际写法只说明谁还知道他的文章，以及大众为什么不再接受这种文体，没有说他主动迎合专家。","","如果C成立，文章至少应该改成：","","> Cardus deliberately developed a specialized prose style for modern experts, and his writing continues to satisfy this professional readership.",">","> Cardus有意为现代专家发展出一种专业化文体，他的文章至今仍主要满足这一专业读者群的需要。","","实际文章写的是传播范围缩小和大众审美变化，C要求的却是主动迎合专家，关系不同。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文最后两段是这样写的：\n\n> his vast body of writings on music is unknown save to specialists\n>\n> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n>\n> 现在除专家外几乎没人知道他的音乐著作，现代读者也不喜欢他的旧式文体。\n\n原文只说明现在还有谁知道他的文章，以及普通读者为什么不再接受这种文体，没有说他主动迎合专家。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Cardus deliberately developed a specialized prose style for modern experts, and his writing continues to satisfy this professional readership.\n>\n> Cardus有意为现代专家发展出一种专业化文体，他的文章至今仍主要满足这一专业读者群的需要。\n\n原文写的是传播范围缩小和大众审美变化，C却说他主动迎合专家，两者不是同一种关系。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>他的风格主要迎合现代专家</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>the richly upholstered Vicwardian prose in which he specialized</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的写作风格主要迎合现代专家。</p>\n</blockquote>\n<p>先看第一处：</p>\n<blockquote>\n<p>unknown save to specialists\n除专家外几乎无人知晓</p>\n</blockquote>\n<p>它回答的是“今天还有谁知道他的音乐著作”。这是作品传播范围的结果。</p>\n<p>再看C中的：</p>\n<blockquote>\n<p>caters largely to modern specialists\n主要迎合、服务于现代专家</p>\n</blockquote>\n<p>它回答的是“这种风格原本为谁设计、想满足谁”。这是作者写作对象和目的。</p>\n<p>作品后来只剩专家知道，不等于作者写作时主要迎合专家。一个作品从大众视野中退出以后只在专业圈流传，可能只是被动的小众化，不是主动写给专家。</p>\n<p>第二处<code>the richly upholstered Vicwardian prose</code>只说明Cardus擅长怎样的文体；原文紧接着说的是<code>postmodern readers have little use for</code>，也就是现代大众不喜欢它，而不是专家特别喜欢它。</p></section><section class=\"revealPart\" id=\"focus-q24-C-2\"><h3>写作视角法</h3><p>原文最后两段是这样写的：</p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized</p>\n<p>现在除专家外几乎没人知道他的音乐著作，现代读者也不喜欢他的旧式文体。</p>\n</blockquote>\n<p>原文只说明现在还有谁知道他的文章，以及普通读者为什么不再接受这种文体，没有说他主动迎合专家。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Cardus deliberately developed a specialized prose style for modern experts, and his writing continues to satisfy this professional readership.</p>\n<p>Cardus有意为现代专家发展出一种专业化文体，他的文章至今仍主要满足这一专业读者群的需要。</p>\n</blockquote>\n<p>原文写的是传播范围缩小和大众审美变化，C却说他主动迎合专家，两者不是同一种关系。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-C-2","meta":{"kind":"method","question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false}},{"title":"C. His style caters largely to modern specialists.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入24题题干：","","> 既然全文用Cardus说明旧式艺术评论怎样退出大众视野，那么最后两段最可能写的是：他的作品后来只剩少数专家接触，普通读者已经不太接受这种文风。","","但C实际说的是：","","> His style caters largely to modern specialists.  ","> 他的风格主要迎合现代专家","","主旨说的是一种被动的变化：原本面向公众的评论逐渐失去普通读者，最后只剩专家还知道。C却把它改成主动写作选择，好像Cardus本来就在按现代专家的口味写。","","“后来只有专家还知道”和“写作风格主要迎合专家”不是一回事。C把传播结果改成了写作目的，因此和全文主旨不一致。","","**复盘判断：C错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入24题题干：\n\n> 既然全文用Cardus说明旧式艺术评论怎样退出大众视野，那么最后两段最可能写的是：他的作品后来只剩少数专家接触，普通读者已经不太接受这种文风。\n\n但C实际说的是：\n\n> His style caters largely to modern specialists.  \n> 他的风格主要迎合现代专家\n\n主旨说的是一种被动的变化：原本面向公众的评论逐渐失去普通读者，最后只剩专家还知道。C却把它改成主动写作选择，好像Cardus本来就在按现代专家的口味写。\n\n“后来只有专家还知道”和“写作风格主要迎合专家”不是一回事。C把传播结果改成了写作目的，因此和全文主旨不一致。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>他的风格主要迎合现代专家</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>复盘前已经看出“现在只有专家还知道他的音乐文章”与“他的风格主动迎合专家”不是同一关系，因此排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C把两处真实信息拼在一起：他的音乐著作现在主要只被专家知道；他擅长一种华丽旧式文体。命题人再把这两点改成“这种文体主要为现代专家服务”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>the richly upholstered Vicwardian prose in which he specialized</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的写作风格主要迎合现代专家。</p>\n</blockquote>\n<p>先看第一处：</p>\n<blockquote>\n<p>unknown save to specialists\n除专家外几乎无人知晓</p>\n</blockquote>\n<p>它回答的是“今天还有谁知道他的音乐著作”。这是作品传播范围的结果。</p>\n<p>再看C中的：</p>\n<blockquote>\n<p>caters largely to modern specialists\n主要迎合、服务于现代专家</p>\n</blockquote>\n<p>它回答的是“这种风格原本为谁设计、想满足谁”。这是作者写作对象和目的。</p>\n<p>作品后来只剩专家知道，不等于作者写作时主要迎合专家。一个作品从大众视野中退出以后只在专业圈流传，可能只是被动的小众化，不是主动写给专家。</p>\n<p>第二处<code>the richly upholstered Vicwardian prose</code>只说明Cardus擅长怎样的文体；原文紧接着说的是<code>postmodern readers have little use for</code>，也就是现代大众不喜欢它，而不是专家特别喜欢它。</p></section><section class=\"revealPart\" id=\"focus-q24-C-2\"><h3>写作视角法</h3><p>原文最后两段是这样写的：</p>\n<blockquote>\n<p>his vast body of writings on music is unknown save to specialists</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized</p>\n<p>现在除专家外几乎没人知道他的音乐著作，现代读者也不喜欢他的旧式文体。</p>\n</blockquote>\n<p>原文只说明现在还有谁知道他的文章，以及普通读者为什么不再接受这种文体，没有说他主动迎合专家。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Cardus deliberately developed a specialized prose style for modern experts, and his writing continues to satisfy this professional readership.</p>\n<p>Cardus有意为现代专家发展出一种专业化文体，他的文章至今仍主要满足这一专业读者群的需要。</p>\n</blockquote>\n<p>原文写的是传播范围缩小和大众审美变化，C却说他主动迎合专家，两者不是同一种关系。</p></section><section class=\"revealPart\" id=\"focus-q24-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus说明旧式艺术评论怎样退出大众视野，那么最后两段最可能写的是：他的作品后来只剩少数专家接触，普通读者已经不太接受这种文风。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>His style caters largely to modern specialists.<br />\n他的风格主要迎合现代专家</p>\n</blockquote>\n<p>主旨说的是一种被动的变化：原本面向公众的评论逐渐失去普通读者，最后只剩专家还知道。C却把它改成主动写作选择，好像Cardus本来就在按现代专家的口味写。</p>\n<p>“后来只有专家还知道”和“写作风格主要迎合专家”不是一回事。C把传播结果改成了写作目的，因此和全文主旨不一致。</p>\n<p><strong>复盘判断：C错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-C-3","meta":{"kind":"method","question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true}},{"title":"D. His writings fail to follow the amateur tradition.","level":3,"lines":["### D. His writings fail to follow the amateur tradition.","","> 他的文章没有遵循业余评论传统","","**做题模式中的状态：**当时已经通过主语错位排除D。原文主语是`the amateur tradition`，D却把主语换成`His writings`。","","**错误类型：第一类——歪曲原意。**","","D借用了`amateur tradition`这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。","","**出处：**","","> the amateur tradition in music criticism has been in headlong retreat"],"section":"第三鸟 · 题目复盘","raw":"### D. His writings fail to follow the amateur tradition.\n\n> 他的文章没有遵循业余评论传统\n\n**做题模式中的状态：**当时已经通过主语错位排除D。原文主语是`the amateur tradition`，D却把主语换成`His writings`。\n\n**错误类型：第一类——歪曲原意。**\n\nD借用了`amateur tradition`这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。\n\n**出处：**\n\n> the amateur tradition in music criticism has been in headlong retreat","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经通过主语错位排除D。原文主语是<code>the amateur tradition</code>，D却把主语换成<code>His writings</code>。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>amateur tradition</code>这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-D-0","meta":{"kind":"option","question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false}},{"title":"D. His writings fail to follow the amateur tradition.","level":4,"lines":["#### 定位比对法","","把D接到题干后面，整句话是在说：","","> 根据最后两段，Cardus的文章没有遵循业余音乐评论传统。","","原文的主语是：","","> the amateur tradition in music criticism","> 音乐评论中的业余传统","","原文的谓语是：","","> has been in headlong retreat","> 正在迅速退却","","也就是说，作者在解释一种行业传统的整体处境：这种传统越来越没有生存空间。","","D却把主语换成`His writings`，再增加`fail to follow`，变成Cardus个人是否遵循传统的问题。文章没有拿Cardus的文章与这套传统的规则逐条比较，也没有说他违背传统。","","实际上，Cardus在全文中恰恰被当作这种旧式业余评论传统的代表人物，而不是背离者。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据最后两段，Cardus的文章没有遵循业余音乐评论传统。\n\n原文的主语是：\n\n> the amateur tradition in music criticism\n> 音乐评论中的业余传统\n\n原文的谓语是：\n\n> has been in headlong retreat\n> 正在迅速退却\n\n也就是说，作者在解释一种行业传统的整体处境：这种传统越来越没有生存空间。\n\nD却把主语换成`His writings`，再增加`fail to follow`，变成Cardus个人是否遵循传统的问题。文章没有拿Cardus的文章与这套传统的规则逐条比较，也没有说他违背传统。\n\n实际上，Cardus在全文中恰恰被当作这种旧式业余评论传统的代表人物，而不是背离者。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经通过主语错位排除D。原文主语是<code>the amateur tradition</code>，D却把主语换成<code>His writings</code>。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>amateur tradition</code>这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的文章没有遵循业余音乐评论传统。</p>\n</blockquote>\n<p>原文的主语是：</p>\n<blockquote>\n<p>the amateur tradition in music criticism\n音乐评论中的业余传统</p>\n</blockquote>\n<p>原文的谓语是：</p>\n<blockquote>\n<p>has been in headlong retreat\n正在迅速退却</p>\n</blockquote>\n<p>也就是说，作者在解释一种行业传统的整体处境：这种传统越来越没有生存空间。</p>\n<p>D却把主语换成<code>His writings</code>，再增加<code>fail to follow</code>，变成Cardus个人是否遵循传统的问题。文章没有拿Cardus的文章与这套传统的规则逐条比较，也没有说他违背传统。</p>\n<p>实际上，Cardus在全文中恰恰被当作这种旧式业余评论传统的代表人物，而不是背离者。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-D-1","meta":{"kind":"method","question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false}},{"title":"D. His writings fail to follow the amateur tradition.","level":4,"lines":["#### 写作视角法","","第5段实际这样写：","","> the amateur tradition in music criticism has been in headlong retreat",">","> 音乐评论中的业余传统一直在急速衰退。","","实际写法是在解释承载Cardus这种评论方式的传统本身正在退场。","","如果D成立，文章至少应该改成：","","> Cardus departed from the amateur tradition of music criticism, and his writings failed because they did not follow its established principles.",">","> Cardus背离了音乐评论的业余传统，他的文章之所以失败，是因为没有遵循这套传统的既定原则。","","实际文章写“传统在衰退”，D要求的却是“Cardus没有遵循传统”，主语和因果方向都不同。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第5段是这样写的：\n\n> the amateur tradition in music criticism has been in headlong retreat\n>\n> 音乐评论中的业余传统一直在急速衰退。\n\n原文是在解释：承载Cardus这种评论方式的传统本身正在退场。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Cardus departed from the amateur tradition of music criticism, and his writings failed because they did not follow its established principles.\n>\n> Cardus背离了音乐评论的业余传统，他的文章之所以失败，是因为没有遵循这套传统的既定原则。\n\n原文写的是“传统正在衰退”，D却改成“Cardus没有遵循传统”，主语和因果方向都不一样。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经通过主语错位排除D。原文主语是<code>the amateur tradition</code>，D却把主语换成<code>His writings</code>。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>amateur tradition</code>这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的文章没有遵循业余音乐评论传统。</p>\n</blockquote>\n<p>原文的主语是：</p>\n<blockquote>\n<p>the amateur tradition in music criticism\n音乐评论中的业余传统</p>\n</blockquote>\n<p>原文的谓语是：</p>\n<blockquote>\n<p>has been in headlong retreat\n正在迅速退却</p>\n</blockquote>\n<p>也就是说，作者在解释一种行业传统的整体处境：这种传统越来越没有生存空间。</p>\n<p>D却把主语换成<code>His writings</code>，再增加<code>fail to follow</code>，变成Cardus个人是否遵循传统的问题。文章没有拿Cardus的文章与这套传统的规则逐条比较，也没有说他违背传统。</p>\n<p>实际上，Cardus在全文中恰恰被当作这种旧式业余评论传统的代表人物，而不是背离者。</p></section><section class=\"revealPart\" id=\"focus-q24-D-2\"><h3>写作视角法</h3><p>原文第5段是这样写的：</p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n<p>音乐评论中的业余传统一直在急速衰退。</p>\n</blockquote>\n<p>原文是在解释：承载Cardus这种评论方式的传统本身正在退场。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Cardus departed from the amateur tradition of music criticism, and his writings failed because they did not follow its established principles.</p>\n<p>Cardus背离了音乐评论的业余传统，他的文章之所以失败，是因为没有遵循这套传统的既定原则。</p>\n</blockquote>\n<p>原文写的是“传统正在衰退”，D却改成“Cardus没有遵循传统”，主语和因果方向都不一样。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-D-2","meta":{"kind":"method","question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false}},{"title":"D. His writings fail to follow the amateur tradition.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入24题题干：","","> 既然全文用Cardus作为旧式业余评论传统的代表，那么最后两段应该说明这类传统正在退却，以及Cardus为什么难以重新回到公众视野。","","但D实际说的是：","","> His writings fail to follow the amateur tradition.  ","> 他的文章没有遵循业余评论传统","","Cardus在全文中代表的正是这种旧式评论传统。原文说的是`the amateur tradition`本身在迅速退却，并没有说Cardus的文章背离了这套传统。","","D把“传统正在消失”改成“Cardus没有遵循传统”，主语和关系都换了，也和这个人物在全文中的作用相反。","","**复盘判断：D错误。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入24题题干：\n\n> 既然全文用Cardus作为旧式业余评论传统的代表，那么最后两段应该说明这类传统正在退却，以及Cardus为什么难以重新回到公众视野。\n\n但D实际说的是：\n\n> His writings fail to follow the amateur tradition.  \n> 他的文章没有遵循业余评论传统\n\nCardus在全文中代表的正是这种旧式评论传统。原文说的是`the amateur tradition`本身在迅速退却，并没有说Cardus的文章背离了这套传统。\n\nD把“传统正在消失”改成“Cardus没有遵循传统”，主语和关系都换了，也和这个人物在全文中的作用相反。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经通过主语错位排除D。原文主语是<code>the amateur tradition</code>，D却把主语换成<code>His writings</code>。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用了<code>amateur tradition</code>这个原词，却把“整个传统正在迅速退却”改成“Cardus个人的文章没有遵循这个传统”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的文章没有遵循业余音乐评论传统。</p>\n</blockquote>\n<p>原文的主语是：</p>\n<blockquote>\n<p>the amateur tradition in music criticism\n音乐评论中的业余传统</p>\n</blockquote>\n<p>原文的谓语是：</p>\n<blockquote>\n<p>has been in headlong retreat\n正在迅速退却</p>\n</blockquote>\n<p>也就是说，作者在解释一种行业传统的整体处境：这种传统越来越没有生存空间。</p>\n<p>D却把主语换成<code>His writings</code>，再增加<code>fail to follow</code>，变成Cardus个人是否遵循传统的问题。文章没有拿Cardus的文章与这套传统的规则逐条比较，也没有说他违背传统。</p>\n<p>实际上，Cardus在全文中恰恰被当作这种旧式业余评论传统的代表人物，而不是背离者。</p></section><section class=\"revealPart\" id=\"focus-q24-D-2\"><h3>写作视角法</h3><p>原文第5段是这样写的：</p>\n<blockquote>\n<p>the amateur tradition in music criticism has been in headlong retreat</p>\n<p>音乐评论中的业余传统一直在急速衰退。</p>\n</blockquote>\n<p>原文是在解释：承载Cardus这种评论方式的传统本身正在退场。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Cardus departed from the amateur tradition of music criticism, and his writings failed because they did not follow its established principles.</p>\n<p>Cardus背离了音乐评论的业余传统，他的文章之所以失败，是因为没有遵循这套传统的既定原则。</p>\n</blockquote>\n<p>原文写的是“传统正在衰退”，D却改成“Cardus没有遵循传统”，主语和因果方向都不一样。</p></section><section class=\"revealPart\" id=\"focus-q24-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus作为旧式业余评论传统的代表，那么最后两段应该说明这类传统正在退却，以及Cardus为什么难以重新回到公众视野。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>His writings fail to follow the amateur tradition.<br />\n他的文章没有遵循业余评论传统</p>\n</blockquote>\n<p>Cardus在全文中代表的正是这种旧式评论传统。原文说的是<code>the amateur tradition</code>本身在迅速退却，并没有说Cardus的文章背离了这套传统。</p>\n<p>D把“传统正在消失”改成“Cardus没有遵循传统”，主语和关系都换了，也和这个人物在全文中的作用相反。</p>\n<p><strong>复盘判断：D错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-D-3","meta":{"kind":"method","question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true}},{"title":"24题结论","level":3,"lines":["> **24. A. His music criticism may not appeal to readers today.**","","这道题的四个选项分别展示了四种关系：","","- A把“复兴希望渺茫”和“现代读者不喜欢其文体”合并成谨慎概括；","- B把“过去受赞赏、后来被遗忘”脑补成长期有争议；","- C把“只剩专家知道”改成“主动迎合专家”；","- D把“传统本身在退却”改成“Cardus没有遵循传统”。"],"section":"第三鸟 · 题目复盘","raw":"### 24题结论\n\n> **24. A. His music criticism may not appeal to readers today.**\n\n这道题的四个选项分别展示了四种关系：\n\n- A把“复兴希望渺茫”和“现代读者不喜欢其文体”合并成谨慎概括；\n- B把“过去受赞赏、后来被遗忘”脑补成长期有争议；\n- C把“只剩专家知道”改成“主动迎合专家”；\n- D把“传统本身在退却”改成“Cardus没有遵循传统”。","html":"<blockquote>\n<p><strong>24. A. His music criticism may not appeal to readers today.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种关系：</p>\n<ul>\n<li>A把“复兴希望渺茫”和“现代读者不喜欢其文体”合并成谨慎概括；</li>\n<li>B把“过去受赞赏、后来被遗忘”脑补成长期有争议；</li>\n<li>C把“只剩专家知道”改成“主动迎合专家”；</li>\n<li>D把“传统本身在退却”改成“Cardus没有遵循传统”。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"meta":{"kind":"conclusion","question":"24","option":null,"questionConclusion":true}},{"title":"五题答案","level":2,"lines":["## 五题答案","","| 题号 | 21 | 22 | 23 | 24 | 25 |","| --- | --- | --- | --- | --- | --- |","| 答案 | B | A | D | A | B |"],"section":"第三鸟 · 题目复盘","raw":"| 题号 | 21 | 22 | 23 | 24 | 25 |\n| --- | --- | --- | --- | --- | --- |\n| 答案 | B | A | D | A | B |","html":"<table>\n<thead>\n<tr>\n  <th>题号</th>\n  <th>21</th>\n  <th>22</th>\n  <th>23</th>\n  <th>24</th>\n  <th>25</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>答案</td>\n  <td>B</td>\n  <td>A</td>\n  <td>D</td>\n  <td>A</td>\n  <td>B</td>\n</tr>\n</tbody>\n</table>\n","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1240,"sourceH":1636}},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"lines":["在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。","","以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：","","## 段落与全文逻辑框架","","**逻辑层次1：英语报纸艺术评论的衰落现状**（段落1核心论点） 所有英语报纸在过去25年发生了许多变化→【其中影响最深远的变化：（艺术报道的范围和严肃性的持续下降）】","","↓（进一步细化支持：当前读者视角）","","**逻辑层次2：现在与过去的对比**（段落2进一步说明） 年轻读者难以想象→（过去大城市报纸存在高质量的艺术评论）+ （20世纪重要的评论文集多数来自报纸）→（今天读这些书会惊讶于：（如此学术内容曾经适合大众报纸））","","↓（进一步细化历史背景说明）","","**逻辑层次3：二战前英国报纸评论的黄金时代**（段落3历史具体情况说明） 我们现在更难想象→（20世纪初至二战前英国报纸的艺术评论：（详尽且风格优雅，被视作报纸的装饰））→【当时评论家被认为：（应详细严肃地撰写报道）+（评论工作是严肃的）+（萧伯纳、纽曼这样的评论家值得信赖）+（他们视新闻业为使命并为在日报发表而自豪）+（纽曼的观点：\"新闻业\"被不受欢迎作家用于贬低受欢迎作家）】","","→（举例说明当代境况，与历史形成对比）","","**逻辑层次4：被遗忘的评论家——以卡德斯为例**（段落4具体例子举证） 遗憾的是，这些评论家被遗忘了→【例如Neville Cardus：（曾是英国著名古典音乐评论家，文风广受赞赏）+（1967年获爵士荣誉）// （今天只因板球散文闻名）+（仅一本书在印刷，其音乐评论鲜为人知，仅限于专家）】","","↑（整体反思与总结）","","**逻辑层次5：复兴无望的原因**（段落5对整体趋势的反思总结） 提出疑问：（Cardus的评论能否再度流行？）→答案：（可能性渺茫）→原因：（新闻品味早已改变）+（当代读者不喜欢他的华丽文风）+（音乐评论业余传统逐渐消退）","","↑（全文主旨）","","全文核心观点：英语报纸的艺术评论经历了从黄金时代到持续衰落的历程，曾经博学深邃、风格优雅的评论传统已经消失，优秀评论家被遗忘，在当代文化环境下复兴无望。"],"section":"第四鸟 · 新题型","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：英语报纸艺术评论的衰落现状**（段落1核心论点） 所有英语报纸在过去25年发生了许多变化→【其中影响最深远的变化：（艺术报道的范围和严肃性的持续下降）】\n\n↓（进一步细化支持：当前读者视角）\n\n**逻辑层次2：现在与过去的对比**（段落2进一步说明） 年轻读者难以想象→（过去大城市报纸存在高质量的艺术评论）+ （20世纪重要的评论文集多数来自报纸）→（今天读这些书会惊讶于：（如此学术内容曾经适合大众报纸））\n\n↓（进一步细化历史背景说明）\n\n**逻辑层次3：二战前英国报纸评论的黄金时代**（段落3历史具体情况说明） 我们现在更难想象→（20世纪初至二战前英国报纸的艺术评论：（详尽且风格优雅，被视作报纸的装饰））→【当时评论家被认为：（应详细严肃地撰写报道）+（评论工作是严肃的）+（萧伯纳、纽曼这样的评论家值得信赖）+（他们视新闻业为使命并为在日报发表而自豪）+（纽曼的观点：\"新闻业\"被不受欢迎作家用于贬低受欢迎作家）】\n\n→（举例说明当代境况，与历史形成对比）\n\n**逻辑层次4：被遗忘的评论家——以卡德斯为例**（段落4具体例子举证） 遗憾的是，这些评论家被遗忘了→【例如Neville Cardus：（曾是英国著名古典音乐评论家，文风广受赞赏）+（1967年获爵士荣誉）// （今天只因板球散文闻名）+（仅一本书在印刷，其音乐评论鲜为人知，仅限于专家）】\n\n↑（整体反思与总结）\n\n**逻辑层次5：复兴无望的原因**（段落5对整体趋势的反思总结） 提出疑问：（Cardus的评论能否再度流行？）→答案：（可能性渺茫）→原因：（新闻品味早已改变）+（当代读者不喜欢他的华丽文风）+（音乐评论业余传统逐渐消退）\n\n↑（全文主旨）\n\n全文核心观点：英语报纸的艺术评论经历了从黄金时代到持续衰落的历程，曾经博学深邃、风格优雅的评论传统已经消失，优秀评论家被遗忘，在当代文化环境下复兴无望。","html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<h2>段落与全文逻辑框架</h2>\n<p><strong>逻辑层次1：英语报纸艺术评论的衰落现状</strong>（段落1核心论点） 所有英语报纸在过去25年发生了许多变化→【其中影响最深远的变化：（艺术报道的范围和严肃性的持续下降）】</p>\n<p>↓（进一步细化支持：当前读者视角）</p>\n<p><strong>逻辑层次2：现在与过去的对比</strong>（段落2进一步说明） 年轻读者难以想象→（过去大城市报纸存在高质量的艺术评论）+ （20世纪重要的评论文集多数来自报纸）→（今天读这些书会惊讶于：（如此学术内容曾经适合大众报纸））</p>\n<p>↓（进一步细化历史背景说明）</p>\n<p><strong>逻辑层次3：二战前英国报纸评论的黄金时代</strong>（段落3历史具体情况说明） 我们现在更难想象→（20世纪初至二战前英国报纸的艺术评论：（详尽且风格优雅，被视作报纸的装饰））→【当时评论家被认为：（应详细严肃地撰写报道）+（评论工作是严肃的）+（萧伯纳、纽曼这样的评论家值得信赖）+（他们视新闻业为使命并为在日报发表而自豪）+（纽曼的观点：&quot;新闻业&quot;被不受欢迎作家用于贬低受欢迎作家）】</p>\n<p>→（举例说明当代境况，与历史形成对比）</p>\n<p><strong>逻辑层次4：被遗忘的评论家——以卡德斯为例</strong>（段落4具体例子举证） 遗憾的是，这些评论家被遗忘了→【例如Neville Cardus：（曾是英国著名古典音乐评论家，文风广受赞赏）+（1967年获爵士荣誉）// （今天只因板球散文闻名）+（仅一本书在印刷，其音乐评论鲜为人知，仅限于专家）】</p>\n<p>↑（整体反思与总结）</p>\n<p><strong>逻辑层次5：复兴无望的原因</strong>（段落5对整体趋势的反思总结） 提出疑问：（Cardus的评论能否再度流行？）→答案：（可能性渺茫）→原因：（新闻品味早已改变）+（当代读者不喜欢他的华丽文风）+（音乐评论业余传统逐渐消退）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：英语报纸的艺术评论经历了从黄金时代到持续衰落的历程，曾经博学深邃、风格优雅的评论传统已经消失，优秀评论家被遗忘，在当代文化环境下复兴无望。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"小标题题 · 41题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 41题\n\n【答案】A. An Unlikely Route into Cultural Journalism\n\n> 以一条不同寻常的道路进入文化新闻业\n\n这一部分先交代Cardus的出身，再顺着写他怎样走到音乐评论这个位置。\n\n开头先交代他的起点：\n\n> the illegitimate son of a part-time prostitute  \n> only four years of formal schooling\n\n随后，文章把身世接到职业路径上：\n\n> a self-taught writer  \n> earned his youthful keep as a cricket professional  \n> talked his way onto the *Manchester Guardian*'s staff\n\n最后又写，他先成为首席板球记者，后来同时担任音乐评论家，而且并没有停止报道板球。\n\n所以这一段的完整路线是：\n\n> 出身和教育都很不典型  \n> → 靠自学与板球工作进入报社  \n> → 从板球记者走到音乐评论家\n\nA中的`Unlikely Route`对应这条反常规路径，`Cultural Journalism`则对应他最终进入报纸艺术评论领域。\n\n最容易混淆的是G，但G说他“离开板球去做音乐”，原文恰恰写的是他继续同时报道板球和音乐。\n\n因此：\n\n> **41. A**","html":"<h4>41题</h4>\n<p>【答案】A. An Unlikely Route into Cultural Journalism</p>\n<blockquote>\n<p>以一条不同寻常的道路进入文化新闻业</p>\n</blockquote>\n<p>这一部分先交代Cardus的出身，再顺着写他怎样走到音乐评论这个位置。</p>\n<p>开头先交代他的起点：</p>\n<blockquote>\n<p>the illegitimate son of a part-time prostitute<br />\nonly four years of formal schooling</p>\n</blockquote>\n<p>随后，文章把身世接到职业路径上：</p>\n<blockquote>\n<p>a self-taught writer<br />\nearned his youthful keep as a cricket professional<br />\ntalked his way onto the <em>Manchester Guardian</em>'s staff</p>\n</blockquote>\n<p>最后又写，他先成为首席板球记者，后来同时担任音乐评论家，而且并没有停止报道板球。</p>\n<p>所以这一段的完整路线是：</p>\n<blockquote>\n<p>出身和教育都很不典型<br />\n→ 靠自学与板球工作进入报社<br />\n→ 从板球记者走到音乐评论家</p>\n</blockquote>\n<p>A中的<code>Unlikely Route</code>对应这条反常规路径，<code>Cultural Journalism</code>则对应他最终进入报纸艺术评论领域。</p>\n<p>最容易混淆的是G，但G说他“离开板球去做音乐”，原文恰恰写的是他继续同时报道板球和音乐。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. A</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"小标题题 · 42题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 42题\n\n【答案】B. Portraits More Vivid than Technical Analysis\n\n> 比技术分析更鲜活的人物描写\n\n这一部分先给出Cardus写评论的基本方式：\n\n> interested in colorful personalities  \n> impressionistic description and polished anecdotes\n\n他先抓人物和场景，不急着堆技术术语。随后，作者用Beecham在餐厅里的轶事来展示这种写法：场景一出来，人物性格也跟着出来了。\n\n段尾又明确说明：\n\n> Technical specificity was often scarce  \n> his images were so vivid that readers grasped the character of a performer at once\n\n段尾说得很清楚：技术细节不多，人物画像却很鲜明。\n\nB中的`Portraits More Vivid`对应人物、场景和比喻的鲜活，`than Technical Analysis`对应技术细节的缺席。\n\n因此：\n\n> **42. B**","html":"<h4>42题</h4>\n<p>【答案】B. Portraits More Vivid than Technical Analysis</p>\n<blockquote>\n<p>比技术分析更鲜活的人物描写</p>\n</blockquote>\n<p>这一部分先给出Cardus写评论的基本方式：</p>\n<blockquote>\n<p>interested in colorful personalities<br />\nimpressionistic description and polished anecdotes</p>\n</blockquote>\n<p>他先抓人物和场景，不急着堆技术术语。随后，作者用Beecham在餐厅里的轶事来展示这种写法：场景一出来，人物性格也跟着出来了。</p>\n<p>段尾又明确说明：</p>\n<blockquote>\n<p>Technical specificity was often scarce<br />\nhis images were so vivid that readers grasped the character of a performer at once</p>\n</blockquote>\n<p>段尾说得很清楚：技术细节不多，人物画像却很鲜明。</p>\n<p>B中的<code>Portraits More Vivid</code>对应人物、场景和比喻的鲜活，<code>than Technical Analysis</code>对应技术细节的缺席。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. B</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"小标题题 · 43题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 43题\n\n【答案】C. A Conservative Taste with Mixed Results\n\n> 既带来误判、也带来先见的保守审美\n\n这一部分先写Cardus的审美边界：\n\n> cared mainly for late-eighteenth- and nineteenth-century music  \n> met modernism with complacent incomprehension\n\n接着给出负面结果：他贬低Bartók、嘲讽Gershwin，对不少现代作品判断失准。\n\n但作者没有停在“他很保守，所以全错”。后半段马上转回来：\n\n> recognize Mahler's greatness early  \n> defend Elgar when younger musicians treated him as merely quaint\n\n同一套浪漫主义审美，一方面让他看不懂现代主义，另一方面又让他比别人更早看出Mahler和Elgar的价值。\n\n这一段既写了保守带来的误判，也写了少数有远见的判断：\n\n> 保守审美  \n> → 造成严重盲点  \n> // 也产生少数有远见的判断\n\nC中的`Mixed Results`正好覆盖这种一负一正的结果。\n\n因此：\n\n> **43. C**","html":"<h4>43题</h4>\n<p>【答案】C. A Conservative Taste with Mixed Results</p>\n<blockquote>\n<p>既带来误判、也带来先见的保守审美</p>\n</blockquote>\n<p>这一部分先写Cardus的审美边界：</p>\n<blockquote>\n<p>cared mainly for late-eighteenth- and nineteenth-century music<br />\nmet modernism with complacent incomprehension</p>\n</blockquote>\n<p>接着给出负面结果：他贬低Bartók、嘲讽Gershwin，对不少现代作品判断失准。</p>\n<p>但作者没有停在“他很保守，所以全错”。后半段马上转回来：</p>\n<blockquote>\n<p>recognize Mahler's greatness early<br />\ndefend Elgar when younger musicians treated him as merely quaint</p>\n</blockquote>\n<p>同一套浪漫主义审美，一方面让他看不懂现代主义，另一方面又让他比别人更早看出Mahler和Elgar的价值。</p>\n<p>这一段既写了保守带来的误判，也写了少数有远见的判断：</p>\n<blockquote>\n<p>保守审美<br />\n→ 造成严重盲点<br />\n// 也产生少数有远见的判断</p>\n</blockquote>\n<p>C中的<code>Mixed Results</code>正好覆盖这种一负一正的结果。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. C</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"小标题题 · 44题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 44题\n\n【答案】D. Changing Journalism Leaves an Old Critic Behind\n\n> 新闻环境变化，把旧式评论家甩在了后面\n\n这一部分从Cardus个人喜欢什么音乐，转到他晚年影响力为什么下降。\n\n文章先说：\n\n> a lifetime of reaction had weakened Cardus's credibility\n\n随后给出报社层面的变化：\n\n> increasingly unsympathetic editors gave him less space  \n> one concert notice was simply cut in half\n\n最后把人物遭遇扩大到整个行业：\n\n> the amateur tradition in music criticism was retreating  \n> critics were increasingly expected to possess technical training\n\n所以这一段的逻辑是：\n\n> 个人长期反现代造成信誉损耗  \n> + 报纸版面和编辑态度改变  \n> + 评论行业越来越专业化  \n> → Cardus这类旧式评论家被时代甩开\n\nD同时覆盖了`Changing Journalism`和`Leaves an Old Critic Behind`两层。\n\n因此：\n\n> **44. D**","html":"<h4>44题</h4>\n<p>【答案】D. Changing Journalism Leaves an Old Critic Behind</p>\n<blockquote>\n<p>新闻环境变化，把旧式评论家甩在了后面</p>\n</blockquote>\n<p>这一部分从Cardus个人喜欢什么音乐，转到他晚年影响力为什么下降。</p>\n<p>文章先说：</p>\n<blockquote>\n<p>a lifetime of reaction had weakened Cardus's credibility</p>\n</blockquote>\n<p>随后给出报社层面的变化：</p>\n<blockquote>\n<p>increasingly unsympathetic editors gave him less space<br />\none concert notice was simply cut in half</p>\n</blockquote>\n<p>最后把人物遭遇扩大到整个行业：</p>\n<blockquote>\n<p>the amateur tradition in music criticism was retreating<br />\ncritics were increasingly expected to possess technical training</p>\n</blockquote>\n<p>所以这一段的逻辑是：</p>\n<blockquote>\n<p>个人长期反现代造成信誉损耗</p>\n<ul>\n<li>报纸版面和编辑态度改变</li>\n<li>评论行业越来越专业化<br />\n→ Cardus这类旧式评论家被时代甩开</li>\n</ul>\n</blockquote>\n<p>D同时覆盖了<code>Changing Journalism</code>和<code>Leaves an Old Critic Behind</code>两层。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. D</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"小标题题 · 45题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 45题\n\n【答案】E. Why Cardus May Still Matter\n\n> Cardus今天为什么仍可能有价值\n\n这一部分先承认现实：\n\n> A broad revival still seems unlikely  \n> modern readers have little patience for Cardus's richly upholstered prose\n\n如果只看这里，标题似乎可以停在“复兴无望”。但后文紧接着换了方向：\n\n> a well-edited selection ... might introduce him to a new generation\n\n作者随后把重点放到Cardus的价值上：\n\n> criticism should reflect the workings of the human soul  \n> Something vital disappears when critics refuse to approach music in this way\n\n所以这一段的中心是：复兴很难，但他的评论所保留的人性、感受力和对音乐的严肃态度仍有价值。\n\nE中的`May Still Matter`正好保留了这种谨慎而肯定的结论。\n\n因此：\n\n> **45. E**","html":"<h4>45题</h4>\n<p>【答案】E. Why Cardus May Still Matter</p>\n<blockquote>\n<p>Cardus今天为什么仍可能有价值</p>\n</blockquote>\n<p>这一部分先承认现实：</p>\n<blockquote>\n<p>A broad revival still seems unlikely<br />\nmodern readers have little patience for Cardus's richly upholstered prose</p>\n</blockquote>\n<p>如果只看这里，标题似乎可以停在“复兴无望”。但后文紧接着换了方向：</p>\n<blockquote>\n<p>a well-edited selection ... might introduce him to a new generation</p>\n</blockquote>\n<p>作者随后把重点放到Cardus的价值上：</p>\n<blockquote>\n<p>criticism should reflect the workings of the human soul<br />\nSomething vital disappears when critics refuse to approach music in this way</p>\n</blockquote>\n<p>所以这一段的中心是：复兴很难，但他的评论所保留的人性、感受力和对音乐的严肃态度仍有价值。</p>\n<p>E中的<code>May Still Matter</code>正好保留了这种谨慎而肯定的结论。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. E</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"排序题 · 解析","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 解析\n\n这是一道8段排序题，其中A、E、H三个段落的位置已经给出。先不急着逐空填，我们先把八段分别在做什么看清：\n\n- D：先提出Cardus生前著名、今天被遗忘的矛盾；\n- A：补他的身世与极不寻常的起点；\n- C：说明他怎样进入《卫报》，同时形成板球和音乐两重身份；\n- E：写他在两种写作中共同采用的人物化、故事化方式；\n- B：解释这种写法为什么有效；\n- H：说明这种写法与他有限的技术训练、强调“倾听”的批评观有关；\n- G：转向局限，分析他的保守审美；\n- F：回到今天，判断复兴前景并总结这种批评的价值。\n\n全文的组织顺序是：\n\n> 先提出“著名评论家为何被遗忘”  \n> → 追溯身世  \n> → 交代职业形成  \n> → 展示写作方式  \n> → 解释写作方式  \n> → 说明能力来源  \n> → 分析审美局限  \n> → 回到复兴与遗产\n\n因此，完整顺序为：\n\n> **D → A → C → E → B → H → G → F**","html":"<h4>解析</h4>\n<p>这是一道8段排序题，其中A、E、H三个段落的位置已经给出。先不急着逐空填，我们先把八段分别在做什么看清：</p>\n<ul>\n<li>D：先提出Cardus生前著名、今天被遗忘的矛盾；</li>\n<li>A：补他的身世与极不寻常的起点；</li>\n<li>C：说明他怎样进入《卫报》，同时形成板球和音乐两重身份；</li>\n<li>E：写他在两种写作中共同采用的人物化、故事化方式；</li>\n<li>B：解释这种写法为什么有效；</li>\n<li>H：说明这种写法与他有限的技术训练、强调“倾听”的批评观有关；</li>\n<li>G：转向局限，分析他的保守审美；</li>\n<li>F：回到今天，判断复兴前景并总结这种批评的价值。</li>\n</ul>\n<p>全文的组织顺序是：</p>\n<blockquote>\n<p>先提出“著名评论家为何被遗忘”<br />\n→ 追溯身世<br />\n→ 交代职业形成<br />\n→ 展示写作方式<br />\n→ 解释写作方式<br />\n→ 说明能力来源<br />\n→ 分析审美局限<br />\n→ 回到复兴与遗产</p>\n</blockquote>\n<p>因此，完整顺序为：</p>\n<blockquote>\n<p><strong>D → A → C → E → B → H → G → F</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"排序题 · 41题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 41题\n\n【答案】D\n\n41题位于已知A段之前，也就是全文第一段。\n\n先看A段开头：\n\n> His background made that achievement all the more remarkable.\n\n`that achievement`要回指前文已经提到的成就，A段自己没有先交代。\n\nD段正好先交代：\n\n> one of England's foremost classical-music critics  \n> a stylist so widely admired that his *Autobiography* became a best-seller\n\n然后D段又提出全文要解释的问题：\n\n> How did so celebrated a critic fall into near-total obscurity?\n\n这样两段就能连成：\n\n> D：先写Cardus曾经多成功、如今多被遗忘  \n> ↓  \n> A：他的出身让这种成功显得更加不可思议\n\nD还负责第一次引出人物和全文问题，具有明显的首段功能。\n\n因此：\n\n> **41. D**","html":"<h4>41题</h4>\n<p>【答案】D</p>\n<p>41题位于已知A段之前，也就是全文第一段。</p>\n<p>先看A段开头：</p>\n<blockquote>\n<p>His background made that achievement all the more remarkable.</p>\n</blockquote>\n<p><code>that achievement</code>要回指前文已经提到的成就，A段自己没有先交代。</p>\n<p>D段正好先交代：</p>\n<blockquote>\n<p>one of England's foremost classical-music critics<br />\na stylist so widely admired that his <em>Autobiography</em> became a best-seller</p>\n</blockquote>\n<p>然后D段又提出全文要解释的问题：</p>\n<blockquote>\n<p>How did so celebrated a critic fall into near-total obscurity?</p>\n</blockquote>\n<p>这样两段就能连成：</p>\n<blockquote>\n<p>D：先写Cardus曾经多成功、如今多被遗忘<br />\n↓<br />\nA：他的出身让这种成功显得更加不可思议</p>\n</blockquote>\n<p>D还负责第一次引出人物和全文问题，具有明显的首段功能。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>41. D</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"排序题 · 42题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 42题\n\n【答案】C\n\n42题位于已知A段和已知E段之间。\n\nA段最后说，Cardus从板球记者走到了音乐评论家，而且两项工作长期并行。接下来需要一段把这条职业路径具体展开。\n\nC段正好说明：\n\n> talked his way onto the *Guardian*'s staff  \n> became its chief cricket writer  \n> music was his other beat\n\n更关键的是，后面的已知E段一开头就是：\n\n> In both roles, Cardus cared most about colorful personalities.\n\n`both roles`只能指前文已经明确出现的两种角色。C段刚刚把它们说清楚：\n\n> chief cricket writer  \n> + music critic\n\n所以三段的关系是：\n\n> A：这一双重职业很不寻常  \n> ↓  \n> C：具体交代双重职业怎样形成  \n> ↓  \n> E：分析他在两种角色中的共同写法\n\n因此：\n\n> **42. C**","html":"<h4>42题</h4>\n<p>【答案】C</p>\n<p>42题位于已知A段和已知E段之间。</p>\n<p>A段最后说，Cardus从板球记者走到了音乐评论家，而且两项工作长期并行。接下来需要一段把这条职业路径具体展开。</p>\n<p>C段正好说明：</p>\n<blockquote>\n<p>talked his way onto the <em>Guardian</em>'s staff<br />\nbecame its chief cricket writer<br />\nmusic was his other beat</p>\n</blockquote>\n<p>更关键的是，后面的已知E段一开头就是：</p>\n<blockquote>\n<p>In both roles, Cardus cared most about colorful personalities.</p>\n</blockquote>\n<p><code>both roles</code>只能指前文已经明确出现的两种角色。C段刚刚把它们说清楚：</p>\n<blockquote>\n<p>chief cricket writer</p>\n<ul>\n<li>music critic</li>\n</ul>\n</blockquote>\n<p>所以三段的关系是：</p>\n<blockquote>\n<p>A：这一双重职业很不寻常<br />\n↓<br />\nC：具体交代双重职业怎样形成<br />\n↓<br />\nE：分析他在两种角色中的共同写法</p>\n</blockquote>\n<p>因此：</p>\n<blockquote>\n<p><strong>42. C</strong></p>\n</blockquote>","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"排序题 · 43题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 43题\n\n【答案】B\n\n43题位于已知E段和已知H段之间。\n\nE段最后给出Beecham在餐厅叫停乐队的故事。B段开头马上说：\n\n> Perhaps the incident happened exactly as Cardus described it, perhaps not.\n\n这里的`the incident`只能回指E段刚讲完的那个具体轶事，因此B必须紧跟E。\n\nB接着从这个故事抽出Cardus的写作特点：\n\n> convey the essence of a musician in a vivid image  \n> Technical detail was often absent\n\n再看后面的已知H段：\n\n> Cardus wrote that way partly because he had to.\n\n`that way`又回指B段刚刚概括的“用鲜明比喻代替技术细节”的写法。前后三段正好接上：\n\n> E：先给一个故事  \n> ↓  \n> B：评价这个故事代表的写作方式  \n> ↓  \n> H：解释他为什么会这样写\n\n因此：\n\n> **43. B**","html":"<h4>43题</h4>\n<p>【答案】B</p>\n<p>43题位于已知E段和已知H段之间。</p>\n<p>E段最后给出Beecham在餐厅叫停乐队的故事。B段开头马上说：</p>\n<blockquote>\n<p>Perhaps the incident happened exactly as Cardus described it, perhaps not.</p>\n</blockquote>\n<p>这里的<code>the incident</code>只能回指E段刚讲完的那个具体轶事，因此B必须紧跟E。</p>\n<p>B接着从这个故事抽出Cardus的写作特点：</p>\n<blockquote>\n<p>convey the essence of a musician in a vivid image<br />\nTechnical detail was often absent</p>\n</blockquote>\n<p>再看后面的已知H段：</p>\n<blockquote>\n<p>Cardus wrote that way partly because he had to.</p>\n</blockquote>\n<p><code>that way</code>又回指B段刚刚概括的“用鲜明比喻代替技术细节”的写法。前后三段正好接上：</p>\n<blockquote>\n<p>E：先给一个故事<br />\n↓<br />\nB：评价这个故事代表的写作方式<br />\n↓<br />\nH：解释他为什么会这样写</p>\n</blockquote>\n<p>因此：</p>\n<blockquote>\n<p><strong>43. B</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"排序题 · 44题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 44题\n\n【答案】G\n\n44题位于已知H段之后。\n\nH段先承认Cardus技术训练有限，但强调他的感受力和“倾听”观念。下一段如果继续谈优点，会让文章停在单向赞扬；原文此处实际要转向他的局限。\n\nG段一开头的`But`正好完成这个转折：\n\n> But Cardus's taste was deeply conservative.\n\n随后G段把这种保守审美的两面写出来：\n\n- 对Bartók等现代音乐判断失准；\n- 却较早看出Mahler和Elgar的价值。\n\nH先讲这套写法从哪里来，G接着转向它的局限：\n\n> H：解释他的独特能力从哪里来  \n> //  \n> G：转过来说明这套能力同时有什么边界\n\nF段则从人物能力转向“今天还能否复兴”，所以G放在H和F之间最自然。\n\n因此：\n\n> **44. G**","html":"<h4>44题</h4>\n<p>【答案】G</p>\n<p>44题位于已知H段之后。</p>\n<p>H段先承认Cardus技术训练有限，但强调他的感受力和“倾听”观念。下一段如果继续谈优点，会让文章停在单向赞扬；原文此处实际要转向他的局限。</p>\n<p>G段一开头的<code>But</code>正好完成这个转折：</p>\n<blockquote>\n<p>But Cardus's taste was deeply conservative.</p>\n</blockquote>\n<p>随后G段把这种保守审美的两面写出来：</p>\n<ul>\n<li>对Bartók等现代音乐判断失准；</li>\n<li>却较早看出Mahler和Elgar的价值。</li>\n</ul>\n<p>H先讲这套写法从哪里来，G接着转向它的局限：</p>\n<blockquote>\n<p>H：解释他的独特能力从哪里来<br />\n//<br />\nG：转过来说明这套能力同时有什么边界</p>\n</blockquote>\n<p>F段则从人物能力转向“今天还能否复兴”，所以G放在H和F之间最自然。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>44. G</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"排序题 · 45题","level":3,"lines":[],"section":"第四鸟 · 新题型","raw":"#### 45题\n\n【答案】F\n\n45题是全文最后一段。\n\n前面的G段已经把Cardus的优点和局限都说完，末段应该回到D段开头提出的总问题：\n\n> 一个曾经如此著名的评论家，今天还有没有可能重新被阅读？\n\nF段直接提出：\n\n> Could Cardus enjoy a revival?\n\n随后先给出现实判断：\n\n> The prospect seems remote\n\n随后又补了一层：这种评论方式今天还留下什么价值：\n\n> Something vital disappears when criticism no longer treats music as an expression of human character and feeling.\n\nF在结尾同时做了三件事：\n\n> 回答复兴问题  \n> + 总结时代变化  \n> + 点出Cardus式批评仍值得保留的东西\n\n它具有明确的结论段功能，只能放在最后。\n\n因此：\n\n> **45. F**","html":"<h4>45题</h4>\n<p>【答案】F</p>\n<p>45题是全文最后一段。</p>\n<p>前面的G段已经把Cardus的优点和局限都说完，末段应该回到D段开头提出的总问题：</p>\n<blockquote>\n<p>一个曾经如此著名的评论家，今天还有没有可能重新被阅读？</p>\n</blockquote>\n<p>F段直接提出：</p>\n<blockquote>\n<p>Could Cardus enjoy a revival?</p>\n</blockquote>\n<p>随后先给出现实判断：</p>\n<blockquote>\n<p>The prospect seems remote</p>\n</blockquote>\n<p>随后又补了一层：这种评论方式今天还留下什么价值：</p>\n<blockquote>\n<p>Something vital disappears when criticism no longer treats music as an expression of human character and feeling.</p>\n</blockquote>\n<p>F在结尾同时做了三件事：</p>\n<blockquote>\n<p>回答复兴问题</p>\n<ul>\n<li>总结时代变化</li>\n<li>点出Cardus式批评仍值得保留的东西</li>\n</ul>\n</blockquote>\n<p>它具有明确的结论段功能，只能放在最后。</p>\n<p>因此：</p>\n<blockquote>\n<p><strong>45. F</strong></p>\n</blockquote>\n","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{"kind":"standard","question":null,"option":null}},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"lines":["","| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |","| --- | --- | --- | --- |","| **preserving and revitalizing valuable cultural traditions** | **保护并振兴有价值的文化传统** | **文明｜文化传承** | **宏观主题** |","| **cultivating public appreciation of the arts** | **培养公众的艺术鉴赏力** | **文明｜文化素养** | **个人主题** |","| promoting serious cultural criticism | 推动严肃的文化评论 | 文明｜公共文化 | 宏观主题 |","| maintaining the seriousness of public discussion | 维护公共讨论的严肃性 | 文明｜社会风气 | 宏观主题 |","| professional dedication | 敬业精神 | 敬业｜职业精神 | 个人主题 |","| treating one's work as a calling | 把工作当作使命 | 敬业｜使命感 | 个人主题 |","| **upholding professional standards** | **坚守专业标准** | **敬业｜职业规范** | **个人主题** |","| professional integrity | 职业操守 | 诚信｜职业诚信 | 个人主题 |","| respecting expertise and literary talent | 尊重专业能力和文学才华 | 友善｜尊重他人 | 个人主题 |","| striving for excellence | 追求卓越 | 敬业｜工匠精神 | 个人主题 |","| preserving cultural memory | 保存文化记忆 | 文明｜历史传承 | 宏观主题 |","| remembering overlooked cultural contributors | 记住被忽视的文化贡献者 | 友善｜尊重贡献 | 个人主题 |","| **adapting cultural traditions to changing times** | **推动文化传统与时俱进** | **文明｜文化创新** | **宏观主题** |","| balancing accessibility with intellectual depth | 平衡大众可读性与思想深度 | 和谐｜发展平衡 | 宏观主题 |"],"section":"第五鸟 · 写作积累","raw":"## 1. 大 const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. An Unlikely Route into Cultural Journalism</strong></p><p><strong>B. Portraits More Vivid than Technical Analysis</strong></p><p><strong>C. A Conservative Taste with Mixed Results</strong></p><p><strong>D. Changing Journalism Leaves an Old Critic Behind</strong></p><p><strong>E. Why Cardus May Still Matter</strong></p><p><strong>F. Formal Training behind a Critical Career</strong></p><p><strong>G. Leaving Cricket Behind for a Musical Career</strong></p><h2>The Amateur as Critic</h2><p>English-language newspapers have steadily reduced the scope and seriousness of their arts coverage. Some papers have abolished book-review sections; others no longer employ full-time classical-music critics, while cultural think pieces have faded from Sunday pages. Earlier generations could expect major papers to publish lengthy, knowledgeable criticism, and many important twentieth-century collections were drawn from newspaper reviews. Yet the critics who produced this work are now largely forgotten. Neville Cardus, once one of England's foremost classical-music critics and the first music critic to be knighted, is remembered mainly for his writing on cricket. Even such honors did not protect his work from later obscurity.</p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. __________</h3><p>The bare facts of Cardus's life were remarkable. Born in Manchester in 1889, the illegitimate son of a part-time prostitute, he completed only four years of formal schooling. A self-taught writer who earned his youthful keep as a cricket professional, he talked his way onto the <em>Manchester Guardian</em>'s staff. Within two years he became its chief cricket writer; from 1927 he also served as chief music critic, reviewing concerts as “N.C.” while continuing to cover cricket. His path into cultural journalism was therefore anything but conventional.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. __________</h3><p>In both roles, Cardus was chiefly interested in colorful personalities. He wrote about musicians as he wrote about cricketers, using impressionistic description and polished anecdotes. At Salzburg he pictured Thomas Beecham interrupting a restaurant orchestra so that he could explain Schubert without the “damned strumming.” Whether every scene happened exactly as Cardus told it mattered less than the effect. Technical specificity was often scarce, but his images were so vivid that readers grasped the character of a performer at once.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. __________</h3><p>Cardus's taste also limited him. A romantic who cared mainly for late-eighteenth- and nineteenth-century music, he often met modernism with complacent incomprehension. He dismissed Bartók as tedious and crude, mocked Gershwin, and found even accessible modern works needlessly restless. Yet the same instincts allowed him to recognize Mahler's greatness early and to defend Elgar when younger musicians treated him as merely quaint. His conservatism produced both serious blind spots and strikingly farsighted judgments.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. __________</h3><p>By the end of his career, a lifetime of reaction had weakened Cardus's credibility. Some of his later attacks on avant-garde music now sound perceptive, but few readers were willing to listen after so many earlier dismissals. His editors became less sympathetic and gave him less space; one concert notice was simply cut in half. More broadly, the amateur tradition in music criticism was retreating, and critics were increasingly expected to possess the technical training that Cardus's generation had disdained.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. __________</h3><p>A broad revival still seems unlikely. Journalistic tastes have changed, and modern readers have little patience for Cardus's richly upholstered prose. Even so, a well-edited selection of his concert reviews might introduce him to a new generation. He took music with complete seriousness and believed that meaningful criticism should reflect the workings of the human soul. Something vital disappears when critics refuse to approach music in this way. His romanticism may be unfashionable, but the force and humanity of his best writing remain difficult to dismiss.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. <strong>Paragraphs A, E, and H have been correctly placed.</strong> Mark your answers on the ANSWER SHEET. (10 points)</p><section class=\"newtype-qblock\" data-letter=\"A\"><p><strong>A.</strong> His background made that achievement all the more remarkable. Born in Manchester in 1889, Cardus was the illegitimate son of a part-time prostitute and completed only four years of formal schooling. That such a boy became a music critic for the <em>Guardian</em> was improbable; that he began as the paper's cricket correspondent and continued covering the game after taking over its music beat was more improbable still.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><p><strong>B.</strong> Perhaps the incident happened exactly as Cardus described it, perhaps not. What mattered was his gift for conveying the essence of a musician in a vivid image. Toscanini's Brahms sounded like “a gigantic musical wheel revolving in a ruthless groove,” while Kreisler's violin playing recalled “a beautiful face” that might be lovelier if lined or wrinkled. Technical detail was often absent, yet the reader understood his point immediately.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><p><strong>C.</strong> A self-taught writer who earned his youthful keep as a public-school cricket professional, Cardus talked his way onto the <em>Guardian</em>'s staff when the paper prided itself on extensive arts coverage. Within two years he became its chief cricket writer. From 1927 on, music was his other beat, and he reviewed concerts as “N.C.” in the same elaborate style he used as “Cricketer.”</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><p><strong>D.</strong> Neville Cardus, who wrote for the <em>Manchester Guardian</em> from 1917 until shortly before his death in 1975, is now remembered chiefly for his essays on cricket. During his lifetime, however, he was one of England's foremost classical-music critics, a stylist so widely admired that his <em>Autobiography</em> became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet almost all his music writing is now out of print. How did so celebrated a critic fall into near-total obscurity?</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><p><strong>E.</strong> In both roles, Cardus cared most about colorful personalities. He wrote about musicians as he wrote about cricketers, sketching character through impressionistic description and polished anecdotes. At the Salzburg Festival he recalled Thomas Beecham stopping a restaurant orchestra and demanding, “How can I demonstrate to my learned friend here the beauties of Schubert's music if that damned strumming goes on perpetually?”</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><p><strong>F.</strong> Could Cardus enjoy a revival? The prospect seems remote: journalistic tastes changed, modern readers have little use for his richly upholstered prose, and critics are now expected to possess the technical training his generation disdained. Still, a well-edited collection might find new readers. Something vital disappears when criticism no longer treats music as an expression of human character and feeling.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><p><strong>G.</strong> But Cardus's taste was deeply conservative. He cared mainly for late-eighteenth- and nineteenth-century music and often met modernism with complacent incomprehension, dismissing Bartók as tedious and crude. Yet he was early to recognize Mahler's greatness and consistently defended Elgar. His instincts could therefore make him both badly mistaken and unexpectedly prescient.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><p><strong>H.</strong> Cardus wrote that way partly because he had to. His musical training amounted to a year of voice lessons, and his contempt for “score-reading critics” suggests that his technical abilities were limited. But his responsiveness to music was extraordinary. He believed the critic's full-time task was to listen with a highly sensitized mind, guided by psychological and aesthetic insight.</p></section><p><strong>41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____</strong></p>"}
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E8%AF%8D%E6%B1%87%E8%AF%AD%E5%A2%83%E7%A4%BA%E4%BE%8B.png</p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E6%84%8F%E7%BE%A4%E6%B3%95%E7%A4%BA%E4%BE%8B.png</p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E6%96%B0%E9%A2%98%E5%9E%8B%E8%80%83%E7%BA%B2%E6%80%BB%E8%A7%88.png</p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E6%96%B0%E9%A2%98%E5%9E%8B%E8%80%83%E7%BA%B2%E8%A1%A8%E6%A0%BC.png</p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E4%B8%83%E9%80%89%E4%BA%94%E9%A2%98%E5%9E%8B%E8%AF%B4%E6%98%8E.png</p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E5%B0%8F%E6%A0%87%E9%A2%98%E9%A2%98%E8%80%83%E7%82%B9.png</p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E6%8E%92%E5%BA%8F%E9%A2%98%E8%80%83%E7%82%B9.png</p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p>%E5%A4%8D%E7%9B%98%E6%96%B9%E6%B3%95_%E5%8C%B9%E9%85%8D%E9%A2%98%E8%80%83%E7%82%B9.png</p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<p>2010_Text1_%E5%8D%95%E8%AF%8D%E6%A0%87%E6%B3%A8_%E9%AB%98%E6%B8%85%E5%8E%9F%E5%9B%BE.webp</p>\n<h1>第1段</h1>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>表达</th>\n  <th>词性＋意思</th>\n  <th>表达</th>\n  <th>词性＋意思</th>\n  <th>表达</th>\n  <th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>take place</td>\n  <td>发生</td>\n  <td>quarter-century</td>\n  <td>n. 四分之一个世纪</td>\n  <td>far-reaching</td>\n  <td>a. 影响深远的</td>\n</tr>\n<tr>\n  <td>inexorable</td>\n  <td>a. 不可阻挡的</td>\n  <td>decline</td>\n  <td>n. 衰退；下降</td>\n  <td>scope</td>\n  <td>n. 范围</td>\n</tr>\n<tr>\n  <td>seriousness</td>\n  <td>n. 严肃性</td>\n  <td>arts coverage</td>\n  <td>艺术报道</td>\n  <td></td>\n  <td></td>\n</tr>\n</tbody>\n</table></div>\n<h1>第2段</h1>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>表达</th>\n  <th>词性＋意思</th>\n  <th>表达</th>\n  <th>词性＋意思</th>\n  <th>表达</th>\n  <th>词性＋意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>to the point of impossibility</td>\n  <td>到了几乎不可能的程度</td>\n  <td>average reader</td>\n  <td>普通读者</td>\n  <td>high-quality</td>\n  <td>a. 高质量的</td>\n</tr>\n<tr>\n  <td>arts criticism</td>\n  <td>艺术评论</td>\n  <td>considerable</td>\n  <td>a. 相当多的</td>\n  <td>significant</td>\n  <td>a. 重要的</td>\n</tr>\n<tr>\n  <td>collection</td>\n  <td>n. 文集；选集</td>\n  <td>consist in large part of</td>\n  <td>很大部分由……构成</td>\n  <td>newspaper review</td>\n  <td>报纸评论</td>\n</tr>\n<tr>\n  <td>marvel at</td>\n  <td>对……感到惊叹</td>\n cation in general-circulation dailies.</p>\n<p>We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared. In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered. Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about. These men believed in journalism as a calling, and were proud to be published in the daily press. &quot;So few authors have brains enough or literary gift enough to keep their own end up in journalism,&quot; Newman wrote, &quot;that I am tempted to define 'journalism' as 'a term of contempt applied by writers who are not read to writers who are'.&quot;</p>\n<p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England's foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p>\n<p>Is there any chance that Cardus's criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p>\n<h3>原文意群划分（必修)</h3>\n<p><strong>第1段</strong></p>\n<p>Of all the changes / that have taken place / in English-language newspapers / during the past quarter-century, / perhaps the most far-reaching / has been / the inexorable decline / in the scope and seriousness / of their arts coverage.</p>\n<p><strong>第2段</strong></p>\n<p>It is difficult / to the point of impossibility / for the average reader / under the age of forty / to imagine / a time / when high-quality arts criticism / could be found / in most big-city newspapers.</p>\n<p>Yet / a considerable number / of the most significant collections / of criticism / published in the 20th century / consisted in large part / of newspaper reviews.</p>\n<p>To read such books today / is to marvel / at the fact / that their learned contents / were once deemed suitable / for publication / in general-circulation dailies.</p>\n<p><strong>第3段</strong></p>\n<p>We / are even farther removed / from the unfocused newspaper reviews / published in England / between the turn of the 20th century and the eve of World War II, / at a time / when newsprint was dirt-cheap / and stylish arts criticism / was considered an ornament / to the publications / in which it appeared.</p>\n<p>In those far-off days, / it was taken for granted / that the critics / of major papers / would write / in detail and at length / about the events / they covered.</p>\n<p>Theirs / was a serious business, / and even those reviewers / who wore their learning lightly, / like George Bernard Shaw and Ernest Newman, / could be trusted / to know / what they were about.</p>\n<p>These men / believed / in journalism as a calling, / and were proud / to be published / in the daily press.</p>\n<p>&quot;So few authors / have brains enough or literary gift enough / to keep their own end up / in journalism,&quot; / Newman wrote, / &quot;that I am tempted to define 'journalism' as 'a term of contempt / applied by writers who are not read / to writers who are.'&quot;</p>\n<p><strong>第4段</strong></p>\n<p>Unfortunately, / these critics / are virtually forgotten.</p>\n<p>Neville Cardus, / who wrote for the Manchester Guardian / from 1917 / until shortly before his death in 1975, / is now known solely / as a writer of essays / on the game of cricket.</p>\n<p>During his lifetime, though, / he was also / one of England's foremost classical-music critics, / and a stylist so widely admired / that his Autobiography (1947) / became a best-seller.</p>\n<p>He / was knighted / in 1967, / the first music critic / to be so honored.</p>\n<p>Yet / only one of his books / is now in print, / and his vast body of writings on music / is unknown / save to specialists.</p>\n<p><strong>第5段</strong></p>\n<p>Is there any chance / that Cardus's criticism / will enjoy a revival?</p>\n<p>The prospect / seems remote.</p>\n<p>Journalistic tastes / had changed / long before his death, / and postmodern readers / have little use / for the richly upholstered Vicwardian prose / in which he specialized.</p>\n<p>Moreover, / the amateur tradition / in music criticism / has been / in headlong retreat.</p>\n<h3>意群翻译（必修)</h3>\n<p><strong>第1段</strong></p>\n<p>在所有变化中 / 这些变化已发生 / 在英语报纸中 / 在过去25年里，/ 或许最深远的变化 / 一直是 / 不可逆转的下降 / 在范围和严肃性方面 / 对其艺术报道。</p>\n<p><strong>第2段</strong></p>\n<p>很难 / 几乎不可能 / 对于普通读者来说 / 40岁以下的 / 去想象 / 一个时代 / 当高质量的艺术评论 / 能够被找到 / 在大部分大城市的报纸里。</p>\n<p>然而 / 相当多的数量 / 最重要的选集之一 / 评论的 / 出版于20世纪 / 大部分由 / 报纸评论构成。</p>\n<p>今天读这些书 / 就是惊叹 / 这个事实 / 它们博学的内容 / 曾经被认为适合 / 出版 / 在大众发行的日报上。</p>\n<p><strong>第3段</strong></p>\n<p>我们 / 更加遥远了 / 从那些漫无边际的报纸评论 / 发表在英国 / 在20世纪初到二战前夕之间，/ 在一个时代 / 当新闻纸非常廉价 / 并且风格化的艺术评论 / 被认为是一种装饰 / 对于这些出版物来说 / 它们所出现的。</p>\n<p>在那些遥远的日子里，/ 理所当然 / 评论家们 / 来自主要报纸的 / 会撰写 / 详细且长篇地 / 关于这些事件 / 他们所报道的。</p>\n<p>他们的工作 / 是严肃的事业，/ 甚至那些评论家 / 那些不炫耀自身学识的，/ 比如萧伯纳和欧内斯特·纽曼，/ 是可以信赖的 / 去了解 / 他们所做的事。</p>\n<p>这些人 / 相信 / 新闻作为一种使命，/ 并且以此为荣 / 被发表 / 在日报上。</p>\n<p>&quot;如此少的作家 / 有足够智慧或文学天赋 / 能在新闻界立足，&quot; / 纽曼写道，/ &quot;以至于我忍不住将'新闻'定义为'一种蔑称 / 由不被阅读的作家使用 / 对被广泛阅读的作家'。&quot;</p>\n<p><strong>第4段</strong></p>\n<p>不幸的是，/ 这些评论家 / 几乎被遗忘了。</p>\n<p>内维尔·卡达斯，/ 为《曼彻斯特卫报》撰稿的 / 自1917年 / 直到1975年他去世前不久，/ 现在仅仅被人们所知 / 作为一名散文作家 / 关于板球比赛的。</p>\n<p>尽管在他的一生中，/ 他也曾是 / 英国最杰出的古典音乐评论家之一，/ 并且是一位广受赞誉的文体家，/ 以至于他的《自传》（1947年）/ 成为了一本畅销书。</p>\n<p>他 / 被封为爵士 / 于1967年，/ 第一位音乐评论家 / 获此殊荣。</p>\n<p>然而 / 现在他只有一本书 / 仍在印刷中，/ 他大量的音乐著作 / 不为人所知 / 除了专业人士以外。</p>\n<p><strong>第5段</strong></p>\n<p>是否有任何可能性 / 卡达斯的评论 / 会重新受到青睐？</p>\n<p>这个前景 / 看起来渺茫。</p>\n<p>新闻品味 / 已经发生了改变 / 在他去世前很久，/ 并且后现代的读者 / 几乎不需要 / 他所擅长的这种丰富华丽的维多利亚爱德华风格的散文。</p>\n<p>此外，/ 业余传统 / 在音乐评论中 / 一直处于 / 急速的衰退中。</p>\n<h3>最后翻译成信达雅的人话（选修，按照自身语文水平而定)</h3>\n<p><strong>第1段</strong></p>\n<p>在过去的四分之一个世纪里，英语报纸所经历的种种变化中，或许最深远的一项，便是其艺术报道在广度与严肃性上的持续衰退。</p>\n<p><strong>第2段</strong></p>\n<p>对四十岁以下的普通读者而言，几乎难以想象曾经有那么一段时期——在大多数大城市报纸上，都能读到高水准的艺术评论。然而，20世纪里许多最具分量的评论文集，在很大程度上都由报纸书评汇编而成。今天翻阅这些著作，人们会惊叹：这些博学深邃的文字当年竟被视作适合刊登于面向大众发行的日报。</p>\n<p><strong>第3段</strong></p>\n<p>我们与20世纪初至二战前夕英国报纸所刊发的那些漫谈式评论，更已相距甚远。那时新闻纸价格低廉，风格精致的艺术评论被视为报纸的一大点缀。在那遥远的年代，人们理所当然地认定，大报的评论家会详尽且篇幅充足地撰写所评之作；他们的职责无比严肃。即便是像乔治·伯纳德·肖、欧内斯特·纽曼这类轻松挥洒学识的评论家，也能让人放心其专业可靠。这些人笃信新闻事业是一种使命，并以能在日报发表文章为傲。纽曼曾写道：&quot;能在新闻界自立的作家，既要有头脑也要有文才，如此稀少，以至于我几乎要把'新闻工作'定义为：'不被阅读的作家用来贬抑被阅读的作家的一种称谓。'&quot;</p>\n<p><strong>第4段</strong></p>\n<p>遗憾的是，如今这些评论家几乎被世人遗忘。内维尔·卡德斯自1917年起为《曼彻斯特卫报》撰稿，直至1975年去世前不久；如今他只因其关于板球的散文而为人所知。可在他生前，他同时也是英国首屈一指的古典音乐评论家，其文笔之精妙广受赞誉，以至于其《自传》（1947）跃升为畅销书。他在1967年被封爵，成为首位获此殊荣的音乐评论家。然而，时至今日，他的著作仅有一本仍在付印，他那浩繁的音乐评论作品，除专业人士外已鲜有人涉猎。</p>\n<p><strong>第5段</strong></p>\n<p>卡德斯的评论还有复兴的可能吗？希望似乎渺茫。早在他去世前，报纸的审美取向就已改变，而后现代读者对他那华丽、维多维多会时代（Vicwardian）风格的散文化文字兴趣寥寥。此外，音乐评论中的&quot;业余传统&quot;也早已一路式微。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n<h3>句子逻辑梳理（选修，按照自身语法基础而定)</h3>\n<p><strong>第1段</strong></p>\n<p>Of all the changes：(that have taken place：(in English-language newspapers：(during the past quarter-century))) → perhaps the most far-reaching → has been → the inexorable decline：(in the scope and seriousness：(of their arts coverage))</p>\n<p><strong>第2段</strong></p>\n<p>It → is difficult：(to the point of impossibility) → for the average reader：(under the age of forty) → to imagine → a time：(when high-quality arts criticism → could be found → in most big-city newspapers).</p>\n<p>Yet + (a considerable number：(of the most significant collections：(of criticism)) → published：(in the 20th century) → consisted：(in large part) → of newspaper reviews).</p>\n<p>To read such books today → is to marvel → at the fact：(that their learned contents → were once deemed suitable → for publication：(in general-circulation dailies)).</p>\n<p><strong>第3段</strong></p>\n<p>We → are even farther removed → from the unfocused newspaper reviews：(published in England：(between the turn of the 20th century and the eve of World War II)，at a time：(when newsprint was dirt-cheap + stylish arts criticism → was considered an ornament → to the publications：(in which it appeared))).</p>\n<p>In those far-off days：it → was taken for granted：(that the critics：(of major papers) → would write：(in detail and at length) → about the events：(they covered)).</p>\n<p>Theirs → was a serious business, + even those reviewers：(who wore their learning lightly：(like George Bernard Shaw and Ernest Newman)) → could be trusted → to know：(what they were about).</p>\n<p>These men → believed：(in journalism as a calling) + were proud → to be published：(in the daily press).</p>\n<p>&quot;So few authors：(have brains enough or literary gift enough → to keep their own end up：(in journalism))，&quot; → Newman wrote，&quot;that I am tempted to define 'journalism'：(as 'a term of contempt：(applied by writers who are not read → to writers who are)')&quot;。</p>\n<p><strong>第4段</strong></p>\n<p>Unfortunately, // these critics → are virtually forgotten.</p>\n<p>Neville Cardus：(who wrote for the Manchester Guardian：(from 1917 + until shortly before his death：(in 197
