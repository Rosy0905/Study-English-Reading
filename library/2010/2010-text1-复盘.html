<h3>定位比对法</h3><p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，作家很容易被吸引进新闻业。</p>\n</blockquote>\n<p>原文的结构是：</p>\n<ul>\n<li>主语：<code>I</code>，指Newman；</li>\n<li>谓语：<code>am tempted</code>，忍不住、很想；</li>\n<li>后面的动作：<code>to define</code>，去定义；</li>\n<li>被定义的对象：<code>journalism</code>这个词。</li>\n</ul>\n<p>所以原文的意思是：</p>\n<blockquote>\n<p>Newman忍不住想给“journalism”下一个定义。</p>\n</blockquote>\n<p>C却把主语换成<code>Writers</code>，把<code>to define journalism</code>改成<code>into journalism</code>，动作也从“定义一个词”变成“进入一种职业”。</p>\n<p>这些词都来自原文，但原句的语法关系已经被彻底打散。</p></section><section class=\"revealPart\" id=\"focus-q23-C-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>I am tempted to define “journalism” as ...</p>\n<p>我忍不住想把“新闻写作”定义为……</p>\n</blockquote>\n<p>原文里的<code>tempted</code>说的是Newman忍不住想下一个定义，并没有继续讨论作家为什么进入新闻业。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Writers are often tempted to enter journalism because the daily press offers them fame, income and a large readership.</p>\n<p>作家常常受到诱惑进入新闻业，因为日报能够给他们名声、收入和大量读者。</p>\n</blockquote>\n<p>原文写的是“想给一个词下定义”，C却改成“受到诱惑进入一个行业”，动作完全不同。</p></section><section class=\"revealPart\" id=\"focus-q23-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么两人最可能共同同意的内容应该落在新闻写作的能力或职业价值上。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>Writers are likely to be tempted into journalism.<br />\n作家很可能受到诱惑而进入新闻业</p>\n</blockquote>\n<p>全文没有讨论作家为什么进入新闻业，也没有讨论这种职业对作家的吸引力。C只是拿了<code>tempted</code>和<code>journalism</code>两个原词，重新拼成了一件新事情。</p>\n<p>“新闻写作需要能力”和“作家容易被诱惑进入新闻业”不是同一条线。C无法回答两人的共同观点，也接不上第三段在全文中的作用。</p>\n<p><strong>复盘判断：C错误。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-C-3","meta":{"kind":"method","question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":true}},{"title":"D. Not all writers are capable of journalistic writing.","level":3,"lines":["### D. Not all writers are capable of journalistic writing.","","> 并不是所有作家都有能力进行新闻写作","","**做题模式中的状态：**第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。","","**选项类型：正确的局部推断。**","","D把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。","","**出处：**","","> So few authors have brains enough or literary gift enough to keep their own end up in journalism."],"section":"第三鸟 · 题目复盘","raw":"### D. Not all writers are capable of journalistic writing.\n\n> 并不是所有作家都有能力进行新闻写作\n\n**做题模式中的状态：**第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。\n\n**选项类型：正确的局部推断。**\n\nD把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。\n\n**出处：**\n\n> So few authors have brains enough or literary gift enough to keep their own end up in journalism.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>D把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-D-0","meta":{"kind":"option","question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false}},{"title":"D. Not all writers are capable of journalistic writing.","level":4,"lines":["#### 定位比对法","","把D接到题干后面，整句话是在说：","","> Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。","","原文中的核心结构是：","","> so few authors have brains enough or literary gift enough","> 很少有作者具备足够的头脑或文学天赋","","后面又限定了这些能力的用途：","","> to keep their own end up in journalism","> 在新闻写作中站稳脚跟、胜任这项工作","","“真正做得到的人很少”，自然可以推出“并不是所有作家都做得到”。D没有增加新的能力类型，也没有把程度夸大成“没有作家做得到”。","","本题还要处理两个人的问题。引语确实是Newman说的，但前面先把Shaw和Newman放在同一组里：","","> These men believed in journalism as a calling, and were proud to be published in the daily press.","","作者先给出两人的共同职业态度，再用Newman的引语把“新闻写作需要真本事”说得更具体。题干问的是`most probably agree on`，不是问两人是否分别说过同一句原话，因此这种共同描写加代表性引语可以支持D。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。\n\n原文中的核心结构是：\n\n> so few authors have brains enough or literary gift enough\n> 很少有作者具备足够的头脑或文学天赋\n\n后面又限定了这些能力的用途：\n\n> to keep their own end up in journalism\n> 在新闻写作中站稳脚跟、胜任这项工作\n\n“真正做得到的人很少”，自然可以推出“并不是所有作家都做得到”。D没有增加新的能力类型，也没有把程度夸大成“没有作家做得到”。\n\n本题还要处理两个人的问题。引语确实是Newman说的，但前面先把Shaw和Newman放在同一组里：\n\n> These men believed in journalism as a calling, and were proud to be published in the daily press.\n\n作者先给出两人的共同职业态度，再用Newman的引语把“新闻写作需要真本事”说得更具体。题干问的是`most probably agree on`，不是问两人是否分别说过同一句原话，因此这种共同描写加代表性引语可以支持D。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>D把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。</p>\n</blockquote>\n<p>原文中的核心结构是：</p>\n<blockquote>\n<p>so few authors have brains enough or literary gift enough\n很少有作者具备足够的头脑或文学天赋</p>\n</blockquote>\n<p>后面又限定了这些能力的用途：</p>\n<blockquote>\n<p>to keep their own end up in journalism\n在新闻写作中站稳脚跟、胜任这项工作</p>\n</blockquote>\n<p>“真正做得到的人很少”，自然可以推出“并不是所有作家都做得到”。D没有增加新的能力类型，也没有把程度夸大成“没有作家做得到”。</p>\n<p>本题还要处理两个人的问题。引语确实是Newman说的，但前面先把Shaw和Newman放在同一组里：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n</blockquote>\n<p>作者先给出两人的共同职业态度，再用Newman的引语把“新闻写作需要真本事”说得更具体。题干问的是<code>most probably agree on</code>，不是问两人是否分别说过同一句原话，因此这种共同描写加代表性引语可以支持D。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-D-1","meta":{"kind":"method","question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false}},{"title":"D. Not all writers are capable of journalistic writing.","level":4,"lines":["#### 写作视角法","","第三段实际这样写：","","> So few authors have brains enough or literary gift enough to keep their own end up in journalism.",">","> 真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。","","实际写法直接给新闻写作设置了能力门槛。","","如果D成立，文章应该沿着这条路线写：","","> Only writers with sufficient intelligence and literary talent can do journalistic writing well.",">","> 只有具备足够头脑和文学天赋的作家，才能做好新闻写作。","","实际Newman的引语正是在表达这一点，所以D与文章的写作路线一致。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文第三段是这样写的：\n\n> So few authors have brains enough or literary gift enough to keep their own end up in journalism.\n>\n> 真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。\n\n原文这句话直接给新闻写作设了一道能力门槛。\n\n如果D真是作者的意思，文章就应该顺着这条线往下写：\n\n> Only writers with sufficient intelligence and literary talent can do journalistic writing well.\n>\n> 只有具备足够头脑和文学天赋的作家，才能做好新闻写作。\n\nNewman这段引语表达的正是这一点，所以D和原文的展开方式一致。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>D把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。</p>\n</blockquote>\n<p>原文中的核心结构是：</p>\n<blockquote>\n<p>so few authors have brains enough or literary gift enough\n很少有作者具备足够的头脑或文学天赋</p>\n</blockquote>\n<p>后面又限定了这些能力的用途：</p>\n<blockquote>\n<p>to keep their own end up in journalism\n在新闻写作中站稳脚跟、胜任这项工作</p>\n</blockquote>\n<p>“真正做得到的人很少”，自然可以推出“并不是所有作家都做得到”。D没有增加新的能力类型，也没有把程度夸大成“没有作家做得到”。</p>\n<p>本题还要处理两个人的问题。引语确实是Newman说的，但前面先把Shaw和Newman放在同一组里：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n</blockquote>\n<p>作者先给出两人的共同职业态度，再用Newman的引语把“新闻写作需要真本事”说得更具体。题干问的是<code>most probably agree on</code>，不是问两人是否分别说过同一句原话，因此这种共同描写加代表性引语可以支持D。</p></section><section class=\"revealPart\" id=\"focus-q23-D-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n<p>真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。</p>\n</blockquote>\n<p>原文这句话直接给新闻写作设了一道能力门槛。</p>\n<p>如果D真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Only writers with sufficient intelligence and literary talent can do journalistic writing well.</p>\n<p>只有具备足够头脑和文学天赋的作家，才能做好新闻写作。</p>\n</blockquote>\n<p>Newman这段引语表达的正是这一点，所以D和原文的展开方式一致。</p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-D-2","meta":{"kind":"method","question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false}},{"title":"D. Not all writers are capable of journalistic writing.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入23题题干：","","> 既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的是：新闻写作不是谁都能做好，它需要足够的头脑和文学才能。","","D实际说的是：","","> Not all writers are capable of journalistic writing.  ","> 并不是所有作家都有能力进行新闻写作","","D正好概括了这道能力门槛。Newman的引语明确说，真正有足够头脑和文学才能、能够在新闻写作中撑住的作者很少；前文又把Shaw和Newman一起写成认真对待新闻工作、清楚自己在做什么的人。","","主旨不能代替这两处局部证据，但它能说明第三段为什么要写这些内容：作者正是在用两人证明过去的评论家有能力、有分量。D与题干、局部原文和全文作用都能接上。","","**复盘判断：D正确。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入23题题干：\n\n> 既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的是：新闻写作不是谁都能做好，它需要足够的头脑和文学才能。\n\nD实际说的是：\n\n> Not all writers are capable of journalistic writing.  \n> 并不是所有作家都有能力进行新闻写作\n\nD正好概括了这道能力门槛。Newman的引语明确说，真正有足够头脑和文学才能、能够在新闻写作中撑住的作者很少；前文又把Shaw和Newman一起写成认真对待新闻工作、清楚自己在做什么的人。\n\n主旨不能代替这两处局部证据，但它能说明第三段为什么要写这些内容：作者正是在用两人证明过去的评论家有能力、有分量。D与题干、局部原文和全文作用都能接上。\n\n**复盘判断：D正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第一轮保留D；因为最直接的话由Newman说出，当时还要确认它能不能代表两人最可能共同认可的看法，后来再结合共同描写和全文方向完成验证。</p>\n<p><strong>选项类型：正确的局部推断。</strong></p>\n<p>D把Newman的“真正有足够头脑或文学天赋、能在新闻写作中站稳脚跟的作者很少”，转换成“并非所有作家都有这种能力”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法</h3><p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Shaw和Newman最可能都认为，并不是所有作家都有能力做好新闻写作。</p>\n</blockquote>\n<p>原文中的核心结构是：</p>\n<blockquote>\n<p>so few authors have brains enough or literary gift enough\n很少有作者具备足够的头脑或文学天赋</p>\n</blockquote>\n<p>后面又限定了这些能力的用途：</p>\n<blockquote>\n<p>to keep their own end up in journalism\n在新闻写作中站稳脚跟、胜任这项工作</p>\n</blockquote>\n<p>“真正做得到的人很少”，自然可以推出“并不是所有作家都做得到”。D没有增加新的能力类型，也没有把程度夸大成“没有作家做得到”。</p>\n<p>本题还要处理两个人的问题。引语确实是Newman说的，但前面先把Shaw和Newman放在同一组里：</p>\n<blockquote>\n<p>These men believed in journalism as a calling, and were proud to be published in the daily press.</p>\n</blockquote>\n<p>作者先给出两人的共同职业态度，再用Newman的引语把“新闻写作需要真本事”说得更具体。题干问的是<code>most probably agree on</code>，不是问两人是否分别说过同一句原话，因此这种共同描写加代表性引语可以支持D。</p></section><section class=\"revealPart\" id=\"focus-q23-D-2\"><h3>写作视角法</h3><p>原文第三段是这样写的：</p>\n<blockquote>\n<p>So few authors have brains enough or literary gift enough to keep their own end up in journalism.</p>\n<p>真正有足够头脑和文学天赋、能在新闻写作中站稳脚跟的作者很少。</p>\n</blockquote>\n<p>原文这句话直接给新闻写作设了一道能力门槛。</p>\n<p>如果D真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Only writers with sufficient intelligence and literary talent can do journalistic writing well.</p>\n<p>只有具备足够头脑和文学天赋的作家，才能做好新闻写作。</p>\n</blockquote>\n<p>Newman这段引语表达的正是这一点，所以D和原文的展开方式一致。</p></section><section class=\"revealPart\" id=\"focus-q23-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>既然全文用第三段证明过去的评论家认真、专业、有能力，那么Shaw和Newman最可能共同认可的是：新闻写作不是谁都能做好，它需要足够的头脑和文学才能。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>Not all writers are capable of journalistic writing.<br />\n并不是所有作家都有能力进行新闻写作</p>\n</blockquote>\n<p>D正好概括了这道能力门槛。Newman的引语明确说，真正有足够头脑和文学才能、能够在新闻写作中撑住的作者很少；前文又把Shaw和Newman一起写成认真对待新闻工作、清楚自己在做什么的人。</p>\n<p>主旨不能代替这两处局部证据，但它能说明第三段为什么要写这些内容：作者正是在用两人证明过去的评论家有能力、有分量。D与题干、局部原文和全文作用都能接上。</p>\n<p><strong>复盘判断：D正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q23-D-3","meta":{"kind":"method","question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true}},{"title":"23题结论","level":3,"lines":["> **23. D. Not all writers are capable of journalistic writing.**","","这道题的四个选项分别利用了不同陷阱：","","- A把`calling`脑补成作家的责任和具体新闻目标；","- B抓住`contempt`，却把Newman讽刺别人使用蔑称，改成他自己轻蔑新闻工作；","- C抓住`tempted`和`journalism`，但把原句主语、动作和语法位置全部换掉；","- D把“很少作者有能力做好”合理推成“并非所有作家都有能力”，并能与两人的共同描写接上。"],"section":"第三鸟 · 题目复盘","raw":"### 23题结论\n\n> **23. D. Not all writers are capable of journalistic writing.**\n\n这道题的四个选项分别利用了不同陷阱：\n\n- A把`calling`脑补成作家的责任和具体新闻目标；\n- B抓住`contempt`，却把Newman讽刺别人使用蔑称，改成他自己轻蔑新闻工作；\n- C抓住`tempted`和`journalism`，但把原句主语、动作和语法位置全部换掉；\n- D把“很少作者有能力做好”合理推成“并非所有作家都有能力”，并能与两人的共同描写接上。","html":"<blockquote>\n<p><strong>23. D. Not all writers are capable of journalistic writing.</strong></p>\n</blockquote>\n<p>这道题的四个选项分别利用了不同陷阱：</p>\n<ul>\n<li>A把<code>calling</code>脑补成作家的责任和具体新闻目标；</li>\n<li>B抓住<code>contempt</code>，却把Newman讽刺别人使用蔑称，改成他自己轻蔑新闻工作；</li>\n<li>C抓住<code>tempted</code>和<code>journalism</code>，但把原句主语、动作和语法位置全部换掉；</li>\n<li>D把“很少作者有能力做好”合理推成“并非所有作家都有能力”，并能与两人的共同描写接上。</li>\n</ul>","context":{"mode":"image","asset":"questions","label":"23题","focus":[0,595,1240,310],"sourceW":1240,"sourceH":1636},"meta":{"kind":"conclusion","question":"23","option":null,"questionConclusion":true}},{"title":"24题 · 题干与核心出处","level":2,"lines":["## 24题","","> What can be learned about Cardus according to the last two paragraphs?  ","> 根据最后两段，关于Cardus可以知道什么？","","### 核心出处","","> Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.",">","> Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.","","最后两段共同建立的方向是：Cardus生前很受重视，现在却几乎被遗忘；现代读者不再喜欢他擅长的文体，因此复兴希望很小。"],"section":"第三鸟 · 题目复盘","raw":"## 24题\n\n> What can be learned about Cardus according to the last two paragraphs?  \n> 根据最后两段，关于Cardus可以知道什么？\n\n### 核心出处\n\n> Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.\n>\n> Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.\n\n最后两段共同建立的方向是：Cardus生前很受重视，现在却几乎被遗忘；现代读者不再喜欢他擅长的文体，因此复兴希望很小。","html":"<blockquote>\n<p>What can be learned about Cardus according to the last two paragraphs?<br />\n根据最后两段，关于Cardus可以知道什么？</p>\n</blockquote>\n<h3>核心出处</h3>\n<blockquote>\n<p>Unfortunately, these critics are virtually forgotten. Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket. During his lifetime, though, he was also one of England’s foremost classical-music critics, and a stylist so widely admired that his Autobiography (1947) became a best-seller. He was knighted in 1967, the first music critic to be so honored. Yet only one of his books is now in print, and his vast body of writings on music is unknown save to specialists.</p>\n<p>Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote. Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized. Moreover, the amateur tradition in music criticism has been in headlong retreat.</p>\n</blockquote>\n<p>最后两段共同建立的方向是：Cardus生前很受重视，现在却几乎被遗忘；现代读者不再喜欢他擅长的文体，因此复兴希望很小。</p>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"meta":{"kind":"question","question":"24","option":null,"questionIntro":true}},{"title":"A. His music criticism may not appeal to readers today.","level":3,"lines":["### A. His music criticism may not appeal to readers today.","","> 他的音乐评论今天可能不太吸引读者","","**做题模式中的状态：**第4、5段已经能够直接支持A，所以第一轮就选择A。","","**选项类型：正确的跨句概括。**","","A把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。","","**出处：**","","> The prospect seems remote.",">","> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized."],"section":"第三鸟 · 题目复盘","raw":"### A. His music criticism may not appeal to readers today.\n\n> 他的音乐评论今天可能不太吸引读者\n\n**做题模式中的状态：**第4、5段已经能够直接支持A，所以第一轮就选择A。\n\n**选项类型：正确的跨句概括。**\n\nA把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。\n\n**出处：**\n\n> The prospect seems remote.\n>\n> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第4、5段已经能够直接支持A，所以第一轮就选择A。</p>\n<p><strong>选项类型：正确的跨句概括。</strong></p>\n<p>A把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-A-0","meta":{"kind":"option","question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false}},{"title":"A. His music criticism may not appeal to readers today.","level":4,"lines":["#### 定位比对法","","把A接到题干后面，整句话是在说：","","> 根据最后两段，Cardus的音乐评论今天可能不太吸引读者。","","A中的`may not appeal to`不是说绝对没有人喜欢，而是说对今天读者的吸引力可能不足。原文也保持了同样的谨慎程度：","","> The prospect seems remote.","> 复兴前景似乎很渺茫。","","后面又解释原因：","","> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized","> 后现代读者不太需要、也不太欣赏他所擅长的华丽维多利亚—爱德华式文体","","Cardus的音乐评论正是用这种文体写成。现代读者不喜欢这种写法，自然可以推出他的音乐评论今天可能缺乏吸引力。","","A没有把`remote`夸大成“绝无可能”，也没有把`little use`夸大成“所有读者都讨厌”，程度与原文一致。"],"section":"第三鸟 · 题目复盘","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据最后两段，Cardus的音乐评论今天可能不太吸引读者。\n\nA中的`may not appeal to`不是说绝对没有人喜欢，而是说对今天读者的吸引力可能不足。原文也保持了同样的谨慎程度：\n\n> The prospect seems remote.\n> 复兴前景似乎很渺茫。\n\n后面又解释原因：\n\n> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n> 后现代读者不太需要、也不太欣赏他所擅长的华丽维多利亚—爱德华式文体\n\nCardus的音乐评论正是用这种文体写成。现代读者不喜欢这种写法，自然可以推出他的音乐评论今天可能缺乏吸引力。\n\nA没有把`remote`夸大成“绝无可能”，也没有把`little use`夸大成“所有读者都讨厌”，程度与原文一致。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第4、5段已经能够直接支持A，所以第一轮就选择A。</p>\n<p><strong>选项类型：正确的跨句概括。</strong></p>\n<p>A把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的音乐评论今天可能不太吸引读者。</p>\n</blockquote>\n<p>A中的<code>may not appeal to</code>不是说绝对没有人喜欢，而是说对今天读者的吸引力可能不足。原文也保持了同样的谨慎程度：</p>\n<blockquote>\n<p>The prospect seems remote.\n复兴前景似乎很渺茫。</p>\n</blockquote>\n<p>后面又解释原因：</p>\n<blockquote>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n后现代读者不太需要、也不太欣赏他所擅长的华丽维多利亚—爱德华式文体</p>\n</blockquote>\n<p>Cardus的音乐评论正是用这种文体写成。现代读者不喜欢这种写法，自然可以推出他的音乐评论今天可能缺乏吸引力。</p>\n<p>A没有把<code>remote</code>夸大成“绝无可能”，也没有把<code>little use</code>夸大成“所有读者都讨厌”，程度与原文一致。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-A-1","meta":{"kind":"method","question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false}},{"title":"A. His music criticism may not appeal to readers today.","level":4,"lines":["#### 写作视角法","","最后两段实际这样写：","","> Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote.",">","> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized",">","> Cardus的评论复兴前景渺茫，后现代读者也不再欣赏他所擅长的文体。","","实际写法直接把现代读者的审美变化与Cardus难以复兴联系起来。","","如果A成立，文章应该沿着这条路线写：","","> Cardus’s music criticism is unlikely to regain a broad modern readership because contemporary readers have little taste for his prose style.",">","> Cardus的音乐评论不太可能重新获得广泛的现代读者，因为当代读者不喜欢他的文体。","","实际最后两段正是这样展开，所以A与文章的写作路线一致。"],"section":"第三鸟 · 题目复盘","raw":"#### 写作视角法\n\n原文最后两段是这样写的：\n\n> Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote.\n>\n> postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n>\n> Cardus的评论复兴前景渺茫，后现代读者也不再欣赏他所擅长的文体。\n\n原文直接把现代读者的审美变化，和Cardus很难复兴这件事接在了一起。\n\n如果A真是作者的意思，文章就应该顺着这条线往下写：\n\n> Cardus’s music criticism is unlikely to regain a broad modern readership because contemporary readers have little taste for his prose style.\n>\n> Cardus的音乐评论不太可能重新获得广泛的现代读者，因为当代读者不喜欢他的文体。\n\n最后两段就是这样展开的，A与原文的写法一致。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第4、5段已经能够直接支持A，所以第一轮就选择A。</p>\n<p><strong>选项类型：正确的跨句概括。</strong></p>\n<p>A把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的音乐评论今天可能不太吸引读者。</p>\n</blockquote>\n<p>A中的<code>may not appeal to</code>不是说绝对没有人喜欢，而是说对今天读者的吸引力可能不足。原文也保持了同样的谨慎程度：</p>\n<blockquote>\n<p>The prospect seems remote.\n复兴前景似乎很渺茫。</p>\n</blockquote>\n<p>后面又解释原因：</p>\n<blockquote>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n后现代读者不太需要、也不太欣赏他所擅长的华丽维多利亚—爱德华式文体</p>\n</blockquote>\n<p>Cardus的音乐评论正是用这种文体写成。现代读者不喜欢这种写法，自然可以推出他的音乐评论今天可能缺乏吸引力。</p>\n<p>A没有把<code>remote</code>夸大成“绝无可能”，也没有把<code>little use</code>夸大成“所有读者都讨厌”，程度与原文一致。</p></section><section class=\"revealPart\" id=\"focus-q24-A-2\"><h3>写作视角法</h3><p>原文最后两段是这样写的：</p>\n<blockquote>\n<p>Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized</p>\n<p>Cardus的评论复兴前景渺茫，后现代读者也不再欣赏他所擅长的文体。</p>\n</blockquote>\n<p>原文直接把现代读者的审美变化，和Cardus很难复兴这件事接在了一起。</p>\n<p>如果A真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Cardus’s music criticism is unlikely to regain a broad modern readership because contemporary readers have little taste for his prose style.</p>\n<p>Cardus的音乐评论不太可能重新获得广泛的现代读者，因为当代读者不喜欢他的文体。</p>\n</blockquote>\n<p>最后两段就是这样展开的，A与原文的写法一致。</p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-A-2","meta":{"kind":"method","question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false}},{"title":"A. His music criticism may not appeal to readers today.","level":4,"lines":["#### 主旨交叉验证法","","25题的正确答案是：","","> The Lost Horizon in Newspapers  ","> 报纸中消失的地平线","","把这个主旨直接代入24题题干：","","> 既然全文用Cardus把旧式艺术评论由盛转衰落到一个具体人物身上，那么最后两段最可能说明的是：他过去很受推崇，但今天的读者已经不太接受他的音乐评论或文风。","","A实际说的是：","","> His music criticism may not appeal to readers today.  ","> 他的音乐评论今天可能不太吸引读者","","A把Cardus在全文中的作用概括得很准。第4段写他过去的地位和影响，第5段写现代读者不再喜欢他的文风，并直接判断复兴前景渺茫。","","A没有说他的评论完全无人阅读，只用了`may not appeal`这种较为谨慎的表达。它与最后两段的具体内容一致，也和全文由盛转衰的主线一致。","","**复盘判断：A正确。**"],"section":"第三鸟 · 题目复盘","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> The Lost Horizon in Newspapers  \n> 报纸中消失的地平线\n\n把这个主旨直接代入24题题干：\n\n> 既然全文用Cardus把旧式艺术评论由盛转衰落到一个具体人物身上，那么最后两段最可能说明的是：他过去很受推崇，但今天的读者已经不太接受他的音乐评论或文风。\n\nA实际说的是：\n\n> His music criticism may not appeal to readers today.  \n> 他的音乐评论今天可能不太吸引读者\n\nA把Cardus在全文中的作用概括得很准。第4段写他过去的地位和影响，第5段写现代读者不再喜欢他的文风，并直接判断复兴前景渺茫。\n\nA没有说他的评论完全无人阅读，只用了`may not appeal`这种较为谨慎的表达。它与最后两段的具体内容一致，也和全文由盛转衰的主线一致。\n\n**复盘判断：A正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>第4、5段已经能够直接支持A，所以第一轮就选择A。</p>\n<p><strong>选项类型：正确的跨句概括。</strong></p>\n<p>A把“复兴前景渺茫”和“后现代读者不喜欢他擅长的文体”合并成一个谨慎判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.</p>\n</blockquote></section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法</h3><p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据最后两段，Cardus的音乐评论今天可能不太吸引读者。</p>\n</blockquote>\n<p>A中的<code>may not appeal to</code>不是说绝对没有人喜欢，而是说对今天读者的吸引力可能不足。原文也保持了同样的谨慎程度：</p>\n<blockquote>\n<p>The prospect seems remote.\n复兴前景似乎很渺茫。</p>\n</blockquote>\n<p>后面又解释原因：</p>\n<blockquote>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized\n后现代读者不太需要、也不太欣赏他所擅长的华丽维多利亚—爱德华式文体</p>\n</blockquote>\n<p>Cardus的音乐评论正是用这种文体写成。现代读者不喜欢这种写法，自然可以推出他的音乐评论今天可能缺乏吸引力。</p>\n<p>A没有把<code>remote</code>夸大成“绝无可能”，也没有把<code>little use</code>夸大成“所有读者都讨厌”，程度与原文一致。</p></section><section class=\"revealPart\" id=\"focus-q24-A-2\"><h3>写作视角法</h3><p>原文最后两段是这样写的：</p>\n<blockquote>\n<p>Is there any chance that Cardus’s criticism will enjoy a revival? The prospect seems remote.</p>\n<p>postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized</p>\n<p>Cardus的评论复兴前景渺茫，后现代读者也不再欣赏他所擅长的文体。</p>\n</blockquote>\n<p>原文直接把现代读者的审美变化，和Cardus很难复兴这件事接在了一起。</p>\n<p>如果A真是作者的意思，文章就应该顺着这条线往下写：</p>\n<blockquote>\n<p>Cardus’s music criticism is unlikely to regain a broad modern readership because contemporary readers have little taste for his prose style.</p>\n<p>Cardus的音乐评论不太可能重新获得广泛的现代读者，因为当代读者不喜欢他的文体。</p>\n</blockquote>\n<p>最后两段就是这样展开的，A与原文的写法一致。</p></section><section class=\"revealPart\" id=\"focus-q24-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>The Lost Horizon in Newspapers<br />\n报纸中消失的地平线</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>既然全文用Cardus把旧式艺术评论由盛转衰落到一个具体人物身上，那么最后两段最可能说明的是：他过去很受推崇，但今天的读者已经不太接受他的音乐评论或文风。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>His music criticism may not appeal to readers today.<br />\n他的音乐评论今天可能不太吸引读者</p>\n</blockquote>\n<p>A把Cardus在全文中的作用概括得很准。第4段写他过去的地位和影响，第5段写现代读者不再喜欢他的文风，并直接判断复兴前景渺茫。</p>\n<p>A没有说他的评论完全无人阅读，只用了<code>may not appeal</code>这种较为谨慎的表达。它与最后两段的具体内容一致，也和全文由盛转衰的主线一致。</p>\n<p><strong>复盘判断：A正确。</strong></p></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-A-3","meta":{"kind":"method","question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true}},{"title":"B. His reputation as a music critic has long been in dispute.","level":3,"lines":["### B. His reputation as a music critic has long been in dispute.","","> 他作为音乐评论家的声誉长期存在争议","","**做题模式中的状态：**`dispute`恢复以后，已经能看出原文写的是“生前广受赞赏、后来被遗忘”，而不是“长期有争议”，因此排除B。","","**错误类型：第三类——无中生有。**","","B利用“新闻品味改变”“如今被遗忘”这些变化信息，让人脑补Cardus的音乐评论家声誉长期受到争论。但文章没有写任何赞成与反对双方。","","**命题人借用的原文材料：**","","> a stylist so widely admired",">","> these critics are virtually forgotten",">","> Journalistic tastes had changed long before his death"],"section":"第三鸟 · 题目复盘","raw":"### B. His reputation as a music critic has long been in dispute.\n\n> 他作为音乐评论家的声誉长期存在争议\n\n**做题模式中的状态：**`dispute`恢复以后，已经能看出原文写的是“生前广受赞赏、后来被遗忘”，而不是“长期有争议”，因此排除B。\n\n**错误类型：第三类——无中生有。**\n\nB利用“新闻品味改变”“如今被遗忘”这些变化信息，让人脑补Cardus的音乐评论家声誉长期受到争论。但文章没有写任何赞成与反对双方。\n\n**命题人借用的原文材料：**\n\n> a stylist so widely admired\n>\n> these critics are virtually forgotten\n>\n> Journalistic tastes had changed long before his death","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>他作为音乐评论家的声誉长期存在争议</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>dispute</code>恢复以后，已经能看出原文写的是“生前广受赞赏、后来被遗忘”，而不是“长期有争议”，因此排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B利用“新闻品味改变”“如今被遗忘”这些变化信息，让人脑补Cardus的音乐评论家声誉长期受到争论。但文章没有写任何赞成与反对双方。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>a stylist so widely admired</p>\n<p>these critics are virtually forgotten</p>\n<p>Journalistic tastes had changed long before his death</p>\n</blockquote></section>","context":{"mode":"image","asset":"questions","label":"24题","focus":[0,895,1240,310],"sourceW":1240,"sourceH":1636},"focusId":"focus-q24-B-0","meta":{"kind":"option","question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false}},{"title":"B. His reputation as a music critic has long been in dispute.","level":4,"lines":["#### 定位比对法","","把B接到题干后面，整句话是在说：","","> 根据最后两段，Cardus作为音乐评论家的声誉长期存在争议。","","`in dispute`表示他的能力、地位或声誉长期被人争论：有人认可，也有人否定，双方意见不一致。","","但原文给出的时间线是：","","- 生前：`widely admired`，广受赞赏；","- 1967年：成为第一位获封爵士的音乐评论家；","- 现在：作品大多绝版，音乐文章除专家外几乎无人知晓。","","这里写的是“过去受推崇，后来被遗忘”，不是“长期有人支持、有人反对”。","","`Journalistic tastes had changed long before his death`说的是新闻
