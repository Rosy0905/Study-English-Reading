tory, medical history and comprehensive records of recent correspondence.</p>\n<p>首先应舍弃加州那个站不住脚的论点：查看智能手机内容类似于翻查嫌疑人的钱包。法院已裁定，无搜查令翻查被捕者的钱包或手提包并不违反第四修正案。但查看智能手机更像进入一个人的家，其中可能有阅读、财务、医疗历史以及近期通信的完整记录。</p>\n</blockquote>\n<p>先说弃用手机等同手提包的论点，再介绍搜钱包的既有裁定，But随后说明手机应当另作考虑。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Exploring phone contents is comparable to going through one’s wallet.</p>\n<p>作者认为查看手机内容可比作翻查某人的钱包。</p>\n</blockquote>\n<p>D需要把钱包规则直接延伸到手机。实际But将两种情形分开，因此不能只看wallet出现就跳过它属于被区别的旧情形。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. A**\n\n- A：getting into与entering对应，residence与home对应。A完整保留作者把查看手机比作进入私人住所的关系。\n- B：阅读、财务和医疗记录用来说明手机包含什么。B把处理这些记录写成作者另作的类比，改变了这组材料的作用。\n- C：通信记录是手机私人资料中的一种，作者用它支撑住宅类比。C把这一局部内容当成比较的另一端。\n- D：钱包类比属于加州被作者否定的论点；作者用But另提出进入住宅。D把所反对的比较当成所赞成的比较。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"28","questionConclusion":true},"html":"<blockquote>\n<p><strong>28. A</strong></p>\n</blockquote>\n<ul>\n<li>A：getting into与entering对应，residence与home对应。A完整保留作者把查看手机比作进入私人住所的关系。</li>\n<li>B：阅读、财务和医疗记录用来说明手机包含什么。B把处理这些记录写成作者另作的类比，改变了这组材料的作用。</li>\n<li>C：通信记录是手机私人资料中的一种，作者用它支撑住宅类比。C把这一局部内容当成比较的另一端。</li>\n<li>D：钱包类比属于加州被作者否定的论点；作者用But另提出进入住宅。D把所反对的比较当成所赞成的比较。</li>\n</ul>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> In Paragraphs 5 and 6, the author shows his concern that  ______.\n>\n> 在第5、6段，作者对什么问题表示关切？\n\n### 题型\n\n段落推断题：将第5段隐私权利与第6段具体划界连起来，找作者共同关切的保护问题。\n\n题干直接指定Paragraphs 5 and 6，先完整读第5段，再完整读第6段，留意隐私保护原则与随后划界问题怎样相接。\n\n### 核心出处\n\n> Citizens still have a right to expect private documents to remain private\n>\n> stating that principle doesn’t ease the challenge of line-drawing.\n>\n> The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"29","questionIntro":true},"html":"<blockquote>\n<p>In Paragraphs 5 and 6, the author shows his concern that  ______.</p>\n<p>在第5、6段，作者对什么问题表示关切？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：将第5段隐私权利与第6段具体划界连起来，找作者共同关切的保护问题。</p>\n<p>题干直接指定Paragraphs 5 and 6，先完整读第5段，再完整读第6段，留意隐私保护原则与随后划界问题怎样相接。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Citizens still have a right to expect private documents to remain private</p>\n<p>stating that principle doesn’t ease the challenge of line-drawing.</p>\n<p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n"},{"title":"A. principles are hard to be clearly expressed","raw":"### A. principles are hard to be clearly expressed\n\n> 作者关切的是原则很难被清楚表达。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。\n\n**出处：**\n\n> Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution's prohibition on unreasonable searches.\n> As so often is the case, stating that principle doesn't ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n</section>"},{"title":"A. principles are hard to be clearly expressed","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者关切的是原则很难被清楚表达。\n\n本项`principles are hard to be clearly expressed`说表述原则困难，第6段第1句`stating that principle doesn’t ease the challenge of line-drawing`同时出现原则和困难，因此回看该句并连接第5段已提出的隐私权。\n\n原文`stating that principle doesn’t ease the challenge of line-drawing`说原则提出之后，划定界限仍然困难。第5段已经表达私人文件应保持私密的权利。本项`principles are hard to be clearly expressed`却把难处放在原则本身说不清楚，移动了困难所指向的对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p>本项<code>principles are hard to be clearly expressed</code>说表述原则困难，第6段第1句<code>stating that principle doesn’t ease the challenge of line-drawing</code>同时出现原则和困难，因此回看该句并连接第5段已提出的隐私权。</p>\n<p>原文<code>stating that principle doesn’t ease the challenge of line-drawing</code>说原则提出之后，划定界限仍然困难。第5段已经表达私人文件应保持私密的权利。本项<code>principles are hard to be clearly expressed</code>却把难处放在原则本身说不清楚，移动了困难所指向的对象。</p>\n</section>"},{"title":"A. principles are hard to be clearly expressed","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution's prohibition on unreasonable searches.\n> As so often is the case, stating that principle doesn't ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.\n>\n> 美国人应采取措施保护数字隐私，但在设备上保存敏感信息越来越成为正常生活需要。公民仍有权期待私人文件保持私密，并受宪法禁止不合理搜查的规定保护。\n>\n> 一如常见情况，宣布原则并不能消除划界难题。许多情形下，警方申请搜查令并不过分繁重；面对严重紧急情况仍可突破第四修正案的保护，也可在等待搜查令时采取合理措施防止数据删除或修改。不过，法院可能希望为警方列举可享有更多自由的情况留出空间。\n\n先提出private documents应受保护，再转向stating that principle doesn’t ease...，承认原则与解决实际操作被分为两层。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The author is concerned that principles are hard to be clearly expressed.\n>\n> 作者关切的是原则很难被清楚表达。\n\nA需要原则难以被清楚说出。原文恰能说出原则，却仍需决定何时取得搜查令、何时存在例外；不能把实施难题搬到语言表述上。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p>本项<code>principles are hard to be clearly expressed</code>说表述原则困难，第6段第1句<code>stating that principle doesn’t ease the challenge of line-drawing</code>同时出现原则和困难，因此回看该句并连接第5段已提出的隐私权。</p>\n<p>原文<code>stating that principle doesn’t ease the challenge of line-drawing</code>说原则提出之后，划定界限仍然困难。第5段已经表达私人文件应保持私密的权利。本项<code>principles are hard to be clearly expressed</code>却把难处放在原则本身说不清楚，移动了困难所指向的对象。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often uations where they are entitled to more freedom.\n>\n> 美国人应采取措施保护数字隐私，但在设备上保存敏感信息越来越成为正常生活需要。公民仍有权期待私人文件保持私密，并受宪法禁止不合理搜查的规定保护。\n>\n> 一如常见情况，宣布原则并不能消除划界难题。许多情形下，警方申请搜查令并不过分繁重；面对严重紧急情况仍可突破第四修正案的保护，也可在等待搜查令时采取合理措施防止数据删除或修改。不过，法院可能希望为警方列举可享有更多自由的情况留出空间。\n\n第5段先保留宪法保护，第6段逐项处理搜查令、紧急情形、数据保全和警方自由，显示仅宣布原则并不够。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The author is concerned that citizens’ privacy is not effectively protected.\n>\n> 作者关切的是公民隐私没有得到有效保护。\n\nD在题干shows his concern下表达担忧，不是已统计出所有公民均未获保护。它能同时解释为什么强调隐私权、又为什么细谈搜查边界。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-D-0\"><blockquote>\n<p>作者关切的是公民隐私没有得到有效保护。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>原则上承认隐私，实际搜查与例外仍需划界，作者关切的是数字隐私能否受到有效保障。D概括这一实施层面的问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者关切的是公民隐私没有得到有效保护。</p>\n</blockquote>\n<p>本项<code>citizens’ privacy is not effectively protected</code>谈隐私保护效果，第5段<code>private documents to remain private and protected</code>提出保护权利，第6段<code>stating that principle doesn’t ease the challenge of line-drawing</code>又谈落实原则的难题，因此两段连看。</p>\n<p>原文先主张私人文件应受保护，随后说<code>stating that principle doesn’t ease the challenge of line-drawing</code>，再讨论给警方某些更多自由的情形留余地。承认权利后，实际保护与警方自由的界限仍需处理。本项<code>citizens’ privacy is not effectively protected</code>可以概括这段从权利原则转到实际保障困难所表达的担心，重点是保护能否有效实现。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<p>美国人应采取措施保护数字隐私，但在设备上保存敏感信息越来越成为正常生活需要。公民仍有权期待私人文件保持私密，并受宪法禁止不合理搜查的规定保护。</p>\n<p>一如常见情况，宣布原则并不能消除划界难题。许多情形下，警方申请搜查令并不过分繁重；面对严重紧急情况仍可突破第四修正案的保护，也可在等待搜查令时采取合理措施防止数据删除或修改。不过，法院可能希望为警方列举可享有更多自由的情况留出空间。</p>\n</blockquote>\n<p>第5段先保留宪法保护，第6段逐项处理搜查令、紧急情形、数据保全和警方自由，显示仅宣布原则并不够。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is concerned that citizens’ privacy is not effectively protected.</p>\n<p>作者关切的是公民隐私没有得到有效保护。</p>\n</blockquote>\n<p>D在题干shows his concern下表达担忧，不是已统计出所有公民均未获保护。它能同时解释为什么强调隐私权、又为什么细谈搜查边界。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"29题结论","raw":"### 29题结论\n\n> **29. D**\n\n- A：第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。\n- B：原句说法院可能为警察在某些情形下保留更多自由，B变成法院正在减少行动余地，方向和确定程度都改变了。\n- C：保存敏感信息越来越是正常生活需要，作者据此主张它仍应受保护。C只复述这一生活事实，没有说出两段关切的保护效果。\n- D：原则上承认隐私，实际搜查与例外仍需划界，作者关切的是数字隐私能否受到有效保障。D概括这一实施层面的问题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"29","questionConclusion":true},"html":"<blockquote>\n<p><strong>29. D</strong></p>\n</blockquote>\n<ul>\n<li>A：第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。</li>\n<li>B：原句说法院可能为警察在某些情形下保留更多自由，B变成法院正在减少行动余地，方向和确定程度都改变了。</li>\n<li>C：保存敏感信息越来越是正常生活需要，作者据此主张它仍应受保护。C只复述这一生活事实，没有说出两段关切的保护效果。</li>\n<li>D：原则上承认隐私，实际搜查与例外仍需划界，作者关切的是数字隐私能否受到有效保障。D概括这一实施层面的问题。</li>\n</ul>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n> Orin Kerr’s comparison is quoted to indicate that ______.\n>\n> 引用奥林·克尔的比较，是为了说明什么？\n\n### 题型\n\n例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。\n\n题干点名Orin Kerr，定位第7段。先从段首But读到末尾，将比较前的观点和汽车、数字信息的两种情形完整连起来。\n\n### 核心出处\n\n> technology sometimes demands novel applications of the Constitution’s protections.\n>\n> The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n>\n> But the justices should not swallow California’s argument whole.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"30","questionIntro":true},"html":"<blockquote>\n<p>Orin Kerr’s comparison is quoted to indicate that ______.</p>\n<p>引用奥林·克尔的比较，是为了说明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干点名Orin Kerr，定位第7段。先从段首But读到末尾，将比较前的观点和汽车、数字信息的两种情形完整连起来。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n<p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>But the justices should not swallow California’s argument whole.</p>\n</blockquote>\n"},{"title":"A. the Constitution should be implemented flexibly","raw":"### A. the Constitution should be implemented flexibly\n\n> 引用Kerr的比较旨在说明宪法应灵活实施。\n\n**做题模式中的状态：** 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。\n\n**出处：**\n\n> But the justices should not swallow California's argument whole. New, disruptive technology sometimes demands novel applications of the Constitution's protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-30-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>引用Kerr的比较旨在说明宪法应灵活实施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n</section>"},{"title":"A. the Constitution should be implemented flexibly","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 引用Kerr的比较旨在说明宪法应灵活实施。\n\n灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。\n\n先提出新技术要求新的宪法适用，再以过去汽车与今天数字信息并列，说明相同的适应任务在两种技术时代重现。\n\n不能说原文绝不支持灵活适用；A的不足是泛说实施灵活，不能解释为何专门选汽车与数字信息作比较。B保留两端共同的技术原因与规则回应。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-30-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>引用Kerr的比较旨在说明宪法应灵活实施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39 er</code>所表达的不受时间与情形限制的要求。两种技术情形中如何应用保护，不等于对一切原则改变作出永久禁令。</p>\n</section>"},{"title":"D. principles of the Constitution should never be altered","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But the justices should not swallow California's argument whole. New, disruptive technology sometimes demands novel applications of the Constitution's protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n>\n> 法官不应全盘接受加州论点。颠覆性的新技术有时要求以新方式适用宪法保护。法学教授Kerr把21世纪数字信息激增且易于获取，与20世纪汽车成为生活必需品相比较：当年法官须为汽车这个新的私人领域明确新规则；如今也必须厘清第四修正案如何适用于数字信息。\n\n比较强调既有保护如何适应新领域，变化发生在解释与适用规则，文章没有评判一切宪法原则可否修改。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Principles of the Constitution should never be altered.\n>\n> 引用Kerr的比较旨在说明宪法原则永远不应改变。\n\nD需要永久禁止原则改变的结论。实际只要求为汽车、数字信息明确规则，既不能由它推出永不可改，也不能把新解释误读为必须放弃全部原则。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>引用Kerr的比较旨在说明宪法原则永远不应改变。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>宪法保护在两个时代持续适用，不代表作者提出所有原则永远不能改变的命题。D的never把范围扩出了本文讨论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>引用Kerr的比较旨在说明宪法原则永远不应改变。</p>\n</blockquote>\n<p>本项<code>principles of the Constitution should never be altered</code>谈原则能否改变，第7段<code>novel applications of the Constitution’s protections</code>谈保护的适用，比较结尾<code>specify novel rules</code>又说明法官的任务，因此核对第2、3句所谈的对象和范围。</p>\n<p>原文<code>novel applications of the Constitution’s protections</code>与<code>specify novel rules</code>都在说明新技术领域需要明确适用方式。本项<code>principles of the Constitution should never be altered</code>则把结论改成原则永不可改，新增<code>never</code>所表达的不受时间与情形限制的要求。两种技术情形中如何应用保护，不等于对一切原则改变作出永久禁令。</p>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>法官不应全盘接受加州论点。颠覆性的新技术有时要求以新方式适用宪法保护。法学教授Kerr把21世纪数字信息激增且易于获取，与20世纪汽车成为生活必需品相比较：当年法官须为汽车这个新的私人领域明确新规则；如今也必须厘清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<p>比较强调既有保护如何适应新领域，变化发生在解释与适用规则，文章没有评判一切宪法原则可否修改。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Principles of the Constitution should never be altered.</p>\n<p>引用Kerr的比较旨在说明宪法原则永远不应改变。</p>\n</blockquote>\n<p>D需要永久禁止原则改变的结论。实际只要求为汽车、数字信息明确规则，既不能由它推出永不可改，也不能把新解释误读为必须放弃全部原则。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"30题结论","raw":"### 30题结论\n\n> **30. B**\n\n- A：灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。\n- B：汽车成为生活必需品时要明确新规则，数字信息普及时也要厘清第四修正案的适用。B保留了技术变化促使规则重新阐释的对应。\n- C：作者反对全盘采纳加州论点，但Kerr的比较说明新技术需要新适用规则，并未直接判定加州论点违反宪法原则。\n- D：宪法保护在两个时代持续适用，不代表作者提出所有原则永远不能改变的命题。D的never把范围扩出了本文讨论。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"30","questionConclusion":true},"html":"<blockquote>\n<p><strong>30. B</strong></p>\n</blockquote>\n<ul>\n<li>A：灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。</li>\n<li>B：汽车成为生活必需品时要明确新规则，数字信息普及时也要厘清第四修正案的适用。B保留了技术变化促使规则重新阐释的对应。</li>\n<li>C：作者反对全盘采纳加州论点，但Kerr的比较说明新技术需要新适用规则，并未直接判定加州论点违反宪法原则。</li>\n<li>D：宪法保护在两个时代持续适用，不代表作者提出所有原则永远不能改变的命题。D的never把范围扩出了本文讨论。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：核心问题的提出**（段落1问题引入） 宪法对数字数据的保护程度？→ 最高法院将考虑：警察在逮捕期间是否可以无证搜查手机内容\n\n↓（争议双方立场）\n\n**逻辑层次2：加州的保守立场**（段落2加州观点） 加州要求：避免全面性裁决（特别是颠覆\"逮捕时可搜查嫌疑人物品\"的旧假设）→ 理由：法官难以评估新技术的影响\n\n//（作者批判）\n\n**逻辑层次3：作者对加州立场的批判**（段落3作者立场） 批判加州：遵循其建议是过分退让、反而忽视已显现的问题 → 技术影响已经清晰可辨 → 法院应该提供更新的指导方针\n\n↓（具体论证）\n\n**逻辑层次4：手机搜查的特殊性**（段落4核心论证） 反驳加州的类比：【搜查手机≠翻查钱包（法院已允许无证搜查钱包）// 搜查手机=进入家中】→ 原因：手机包含（阅读历史+财务历史+医疗历史+通信记录）→ 云计算使探索更容易\n\n→（权利与现实）\n\n**逻辑层次5：数字时代的隐私权**（段落5权利确认） 现实困境：（美国人应保护数字隐私 // 但在设备上保存敏感信息是生活必需）→ 核心权利：公民有权期待私人文件受宪法保护\n\n↓（实施挑战）\n\n**逻辑层次6：平衡执法与隐私的挑战**（段落6实施细节） 原则vs实践：陈述原则≠解决划界难题 → 可行方案：【多数情况下获取搜查令并不繁重 + 紧急情况可例外 + 可采取措施防止数据被删除】→ 法院可能为警察留出一定自由空间\n\n↑（总结与类比）\n\n**逻辑层次7：技术变革需要宪法新解释**（段落7历史类比） 核心观点：不应全盘接受加州论点 → 新技术需要宪法保护的新应用 → Kerr的类比：【20世纪：为汽车制定新规则 // 21世纪：为数字信息制定新规则】\n\n全文核心观点：面对数字技术带来的挑战，最高法院不应采取保守立场，而应认识到智能手机搜查的特殊性（类似进入家中而非翻查钱包），并为数字时代制定新的宪法保护规则。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：核心问题的提出</strong>（段落1问题引入） 宪法对数字数据的保护程度？→ 最高法院将考虑：警察在逮捕期间是否可以无证搜查手机内容</p>\n<p>↓（争议双方立场）</p>\n<p><strong>逻辑层次2：加州的保守立场</strong>（段落2加州观点） 加州要求：避免全面性裁决（特别是颠覆&quot;逮捕时可搜查嫌疑人物品&quot;的旧假设）→ 理由：法官难以评估新技术的影响</p>\n<p>//（作者批判）</p>\n<p><strong>逻辑层次3：作者对加州立场的批判</strong>（段落3作者立场） 批判加州：遵循其建议是过分退让、反而忽视已显现的问题 → 技术影响已经清晰可辨 → 法院应该提供更新的指导方针</p>\n<p>↓（具体论证）</p>\n<p><strong>逻辑层次4：手机搜查的特殊性</strong>（段落4核心论证） 反驳加州的类比：【搜查手机≠翻查钱包（法院已允许无证搜查钱包）// 搜查手机=进入家中】→ 原因：手机包含（阅读历史+财务历史+医疗历史+通信记录）→ 云计算使探索更容易</p>\n<p>→（权利与现实）</p>\n<p><strong>逻辑层次5：数字时代的隐私权</strong>（段落5权利确认） 现实困境：（美国人应保护数字隐私 // 但在设备上保存敏感信息是生活必需）→ 核心权利：公民有权期待私人文件受宪法保护</p>\n<p>↓（实施挑战）</p>\n<p><strong>逻辑层次6：平衡执法与隐私的挑战</strong>（段落6实施细节） 原则vs实践：陈述原则≠解决划界难题 → 可行方案：【多数情况下获取搜查令并不繁重 + 紧急情况可例外 + 可采取措施防止数据被删除】→ 法院可能为警察留出一定自由空间</p>\n<p>↑（总结与类比）</p>\n<p><strong>逻辑层次7：技术变革需要宪法新解释</strong>（段落7历史类比） 核心观点：不应全盘接受加州论点 → 新技术需要宪法保护的新应用 → Kerr的类比：【20世纪：为汽车制定新规则 // 21世纪：为数字信息制定新规则】</p>\n<p>全文核心观点：面对数字技术带来的挑战，最高法院不应采取保守立场，而应认识到智能手机搜查的特殊性（类似进入家中而非翻查钱包），并为数字时代制定新的宪法保护规则。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】B. The legal question and a request for judicial restraint\n\n> 法律问题与要求司法克制的主张\n\n先提出逮捕时能否无搜查令查看手机内容，再呈现California要求避免全面裁决的理由。\n\n> Just how much does the Constitution protect your digital data?\n\n首句提出宪法保护数字资料的程度，随后收窄为逮捕时无搜查令查看手机内容的具体问题。\n\n> California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest.\n\n加州要求refrain from a sweeping ruling，尤其不要推翻逮捕时可搜查随身物品的旧假设，形成对法院的克制要求。\n\n> It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.\n\n评估新技术困难是the state argues引出的州方理由。B同时覆盖待判问题与这项请求，没有将州方意见当成既成裁决。\n\n这一部分的推进关系是：\n\n> 数字资料保护问题 → 无搜查令搜手机的具体争议 → 加州以技术不确定为由要求司法克制\n\nlegal question对应whether police can search contents，restraint对应refrain from a sweeping ruling。\n\n再看最强干扰项D：A complete ban on every urgent police measure。\n\n只是呈现待判问题与州方主张，没有全面禁止紧急措施。\n\n**41题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】B. The legal question and a request for judicial restraint</p>\n<blockquote>\n<p>法律问题与要求司法克制的主张</p>\n</blockquote>\n<p>先提出逮捕时能否无搜查令查看手机内容，再呈现California要求避免全面裁决的理由。</p>\n<blockquote>\n<p>Just how much does the Constitution protect your digital data?</p>\n</blockquote>\n<p>首句提出宪法保护数字资料的程度，随后收窄为逮捕时无搜查令查看手机内容的具体问题。</p>\n<blockquote>\n<p>California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest.</p>\n</blockquote>\n<p>加州要求refrain from a sweeping ruling，尤其不要推翻逮捕时可搜查随身物品的旧假设，形成对法院的克制要求。</p>\n<blockquote>\n<p>It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n</blockquote>\n<p>评估新技术困难是the state argues引出的州方理由。B同时覆盖待判问题与这项请求，没有将州方意见当成既成裁决。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>数字资料保护问题 → 无搜查令搜手机的具体争议 → 加州以技术不确定为由要求司法克制</p>\n</blockquote>\n<p>legal question对应whether police can search contents，restraint对应refrain from a sweeping ruling。</p>\n<p>再看最强干扰项D：A complete ban on every urgent police measure。</p>\n<p>只是呈现待判问题与州方主张，没有全面禁止紧急措施。</p>\n<p><strong>41题选B。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. The case for updated judicial guidance\n\n> 更新司法指引的理由\n\n作者用recklessly modest批评过度克制，再说技术影响已足够清楚，法院可以且应该更新指引。\n\n> The court would be recklessly modest if it followed California's advice.\n\nrecklessly modest把照办加州建议评为过分退让，作者并不接受继续保持旧规则的理由。\n\n> Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\n\ndiscernable、obvious说明影响已足够清晰，so that把这一认识接到can and should更新指引。理由与主张一起支持E。\n\n这一部分的推进关系是：\n\n> 批评因不确定而退让 → 影响已清晰可辨 → 法院能够且应该更新指引\n\nupdated guidance直接对应updated guidelines，case for表示给出更新的理由而非继续拖延。\n\n再看最强干扰项G：Replacing all constitutional principles with technology。\n\n更新适用指引不等于替换宪法原则。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. The case for updated judicial guidance</p>\n<blockquote>\n<p>更新司法指引的理由</p>\n</blockquote>\n<p>作者用recklessly modest批评过度克制，再说技术影响已足够清楚，法院可以且应该更新指引。</p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice.</p>\n</blockquote>\n<p>recklessly modest把照办加州建议评为过分退让，作者并不接受继续保持旧规则的理由。</p>\n<blockquote>\n<p>Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n</blockquote>\n<p>discernable、obvious说明影响已足够清晰，so that把这一认识接到can and should更新指引。理由与主张一起支持E。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>批评因不确定而退让 → 影响已清晰可辨 → 法院能够且应该更新指引</p>\n</blockquote>\n<p>updated guidance直接对应updated guidelines，case for表示给出更新的理由而非继续拖延。</p>\n<p>再看最强干扰项G：Replacing all constitutional principles with technology。</p>\n<p>更新适用指引不等于替换宪法原则。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】C. Why a smartphone search resembles entering a home\n\n> 为何搜查手机类似进入住宅\n\n先拒绝手机等于钱包，再提出住宅类比，并用大量私人记录及云端可获取性支撑。\n\n> They should start by discarding California's lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect's purse.\n\ndiscarding先否定手机等同钱包的类比，标题不能把被反对的旧比较当结论。\n\n> But exploring one's smartphone is more like entering his or her home.\n\nBut引出作者认可的住宅类比，后面的阅读、财务、医疗及通信资料说明手机能暴露个人生活的广泛领域。\n\n> The development of \"cloud computing\", meanwhile, has made that exploration so much the easier.\n\n云计算进一步降低获取这些信息的难度，使住宅类比所强调的隐私深度更突出；本段不是讨论禁止所有警务措施。\n\n这一部分的推进关系是：\n\n> 舍弃钱包类比 → 建立住宅类比 → 私人记录与易获取性解释隐私范围\n\nresembles entering a home保留作者赞成的类比，拒绝把手机缩减为钱包。\n\n再看最强干扰项D：A complete ban on every urgent police measure。\n\n本段解释搜索范围与隐私深度，不是概括警方所有紧急处置。\n\n**43题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】C. Why a smartphone search resembles entering a home</p>\n<blockquote>\n<p>为何搜查手机类似进入住宅</p>\n</blockquote>\n<p>先拒绝手机等于钱包，再提出住宅类比，并用大量私人记录及云端可获取性支撑。</p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n<p>discarding先否定手机等同钱包的类比，标题不能把被反对的旧比较当结论。</p>\n<blockquote>\n<p>But exploring one&#39;s smartphone is more like entering his or her home.</p>\n</blockquote>\n<p>But引出作者认可的住宅类比，后面的阅读、财务、医疗及通信资料说明手机能暴露个人生活的广泛领域。</p>\n<blockquote>\n<p>The development of &quot;cloud computing&quot;, meanwhile, has made that exploration so much the easier.</p>\n</blockquote>\n<p>云计算进一步降低获取这些信息的难度，使住宅类比所强调的隐私深度更突出；本段不是讨论禁止所有警务措施。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>舍弃钱包类比 → 建立住宅类比 → 私人记录与易获取性解释隐私范围</p>\n</blockquote>\n<p>resembles entering a home保留作者赞成的类比，拒绝把手机缩减为钱包。</p>\n<p>再看最强干扰项D：A complete ban on every urgent police measure。</p>\n<p>本段解释搜索范围与隐私深度，不是概括警方所有紧急处置。</p>\n<p><strong>43题选C。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Protecting ordinary digital life while drawing practical limits\n\n> 保护日常数字生活并划定实际界限\n\n第五段从数字生活常态提出隐私期待，第六段讨论搜查令、紧急例外与保存数据的措施。\n\n> Americans should take steps to protect their digital privacy.\n\n从个人应保护隐私起笔，But紧接着说明存储敏感资料又是生活需要，所以不能简单要求用户避开设备。\n\n> As so often is the case, stating that principle doesn't ease the challenge of line-drawing.\n\n原则已说出却仍有line-drawing难题，话题转到一般搜查令、紧急情况和等待期间保护数据怎样划界。\n\n> The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.\n\n保留特定警方自由使保护与执法需要并存。F的while正能接住权利原则与实际界限两层，不能用全部禁止来概括。\n\n这一部分的推进关系是：\n\n> 数字生活必要性与隐私权 → 原则落实仍需划界 → 一般授权与特定例外共同考虑\n\nprotecting ordinary digital life概括必要性和权利；practical limits概括一般授权与例外之间的划界。\n\n再看最强干扰项D：A complete ban on every urgent police measure。\n\n原文允许严重紧急情形下的措施，因此不能用全面禁令概括。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Protecting ordinary digital life while drawing practical limits</p>\n<blockquote>\n<p>保护日常数字生活并划定实际界限</p>\n</blockquote>\n<p>第五段从数字生活常态提出隐私期待，第六段讨论搜查令、紧急例外与保存数据的措施。</p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy.</p>\n</blockquote>\n<p>从个人应保护隐私起笔，But紧接着说明存储敏感资料又是生活需要，所以不能简单要求用户避开设备。</p>\n<blockquote>\n<p>As so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing.</p>\n</blockquote>\n<p>原则已说出却仍有line-drawing难题，话题转到一般搜查令、紧急情况和等待期间保护数据怎样划界。</p>\n<blockquote>\n<p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<p>保留特定警方自由使保护与执法需要并存。F的while正能接住权利原则与实际界限两层，不能用全部禁止来概括。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>数字生活必要性与隐私权 → 原则落实仍需划界 → 一般授权与特定例外共同考虑</p>\n</blockquote>\n<p>protecting ordinary digital life概括必要性和权利；practical limits概括一般授权与例外之间的划界。</p>\n<p>再看最强干扰项D：A complete ban on every urgent police measure。</p>\n<p>原文允许严重紧急情形下的措施，因此不能用全面禁令概括。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】A. Rules must adapt when technology creates a new personal domain\n\n> 技术产生新私人领域时规则须适应\n\n汽车普及与数字信息扩张作历史类比：过去为新私人领域定规则，如今也要明确新适用。\n\n> But the justices should not swallow California's argument whole.\n\n不应全盘接受加州论点，承接前面对照旧处理的批评，接着需说明面对新技术应怎样做。\n\n> New, disruptive technology sometimes demands novel applications of the Constitution's protections.\n\nnovel applications是核心要求：保护原则进入新技术领域时，需要更新解释与适用。\n\n> Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n\nthen/now把汽车和数字资料相对，重复技术成为生活必需后法院必须定清规则的任务，说明技术变化为何带来新适用要求。\n\n这一部分的推进关系是：\n\n> 拒绝照旧套用 → 新技术要求新适用 → 汽车与数字信息的历史类比\n\nadapt对应novel applications与novel rules，new personal domain保留技术变动是需要更新的原因。\n\n再看最强干扰项G：Replacing all constitutional principles with technology。\n\n保护原则仍在，改变的是面对新技术时如何适用。\n\n**45题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】A. Rules must adapt when technology creates a new personal domain</p>\n<blockquote>\n<p>技术产生新私人领域时规则须适应</p>\n</blockquote>\n<p>汽车普及与数字信息扩张作历史类比：过去为新私人领域定规则，如今也要明确新适用。</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole.</p>\n</blockquote>\n<p>不应全盘接受加州论点，承接前面对照旧处理的批评，接着需说明面对新技术应怎样做。</p>\n<blockquote>\n<p>New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections.</p>\n</blockquote>\n<p>novel applications是核心要求：保护原则进入新技术领域时，需要更新解释与适用。</p>\n<blockquote>\n<p>Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>then/now把汽车和数字资料相对，重复技术成为生活必需后法院必须定清规则的任务，说明技术变化为何带来新适用要求。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>拒绝照旧套用 → 新技术要求新适用 → 汽车与数字信息的历史类比</p>\n</blockquote>\n<p>adapt对应novel applications与novel rules，new personal domain保留技术变动是需要更新的原因。</p>\n<p>再看最强干扰项G：Replacing all constitutional principles with technology。</p>\n<p>保护原则仍在，改变的是面对新技术时如何适用。</p>\n<p><strong>45题选A。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出数字信息搜查的规则问题 |\n| B | 说明一般搜查令与紧急例外的边界 |\n| C | 以汽车历史解释技术促使更新适用 |\n| D | 反驳拖延并提出手机钱包类比问题 |\n| E | 以私人记录说明住宅类比更贴切 |\n| F | 介绍以技术不确定为由的克制主张 |\n| G | 由数字生活常态推出保护期待 |\n| H | 总结原则连续与规则适应并存 |\n\n全文推进：\n\n> 提出数字信息搜查的规则问题 → 介绍以技术不确定为由的克制主张 → 反驳拖延并提出手机钱包类比问题 → 以私人记录说明住宅类比更贴切 → 由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用 → 总结原则连续与规则适应并存\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出数字信息搜查的规则问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明一般搜查令与紧急例外的边界</td>\n</tr>\n<tr>\n<td>C</td>\n<td>以汽车历史解释技术促使更新适用</td>\n</tr>\n<tr>\n<td>D</td>\n<td>反驳拖延并提出手机钱包类比问题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>以私人记录说明住宅类比更贴切</td>\n</tr>\n<tr>\n<td>F</td>\n<td>介绍以技术不确定为由的克制主张</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由数字生活常态推出保护期待</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结原则连续与规则适应并存</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出数字信息搜查的规则问题 → 介绍以技术不确定为由的克制主张 → 反驳拖延并提出手机钱包类比问题 → 以私人记录说明住宅类比更贴切 → 由数字生活常态推出保护期待 → 说明一般搜 rawing a line.\n\nB的That expectation指G末句的expectation of constitutional protection，随后才谈如何划定实际界限。\n\n这三段的推进关系：\n\n> 以私人记录说明住宅类比更贴切 → 由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界\n\n再检验候选C：\n\n> Finding that line requires a new application of an existing protection rather than abandoning the protection.\n\nC的that line要求前面已经提出界限，E尚在解释住宅类比。先接C既提前了划界结论，也无法为B的That expectation提供刚形成的保护期待。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Accessing this storehouse resembles entering a home more than simply examining a small physical container.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Such a storehouse is increasingly part of ordinary life, not an exceptional choice made by a few careless users.</p>\n</blockquote>\n<p>E称手机为storehouse并用住宅作比，G的Such a storehouse原样承接，转问使用者能否避免把资料放进去。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>People cannot always avoid keeping sensitive information on their devices. Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.</p>\n</blockquote>\n<p>不能总是避免存储敏感信息，因而参与数字生活不应自行取消受到宪法保护的期待。therefore把日常必要性接到权利。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>That expectation still leaves the practical task of drawing a line.</p>\n</blockquote>\n<p>B的That expectation指G末句的expectation of constitutional protection，随后才谈如何划定实际界限。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以私人记录说明住宅类比更贴切 → 由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection.</p>\n</blockquote>\n<p>C的that line要求前面已经提出界限，E尚在解释住宅类比。先接C既提前了划界结论，也无法为B的That expectation提供刚形成的保护期待。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.\n\n再看B段开头：\n\n> That expectation still leaves the practical task of drawing a line.\n\nG提出保护期待，B的That expectation接住它；still说明承认权利后还有实际划界工作。\n\n本段内部继续写道：\n\n> In many situations police can obtain a warrant without excessive difficulty. Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.\n\n一般可申请搜查令，严重紧急情况与防止数据灭失又可能要求即时措施，B具体展开保护与行动之间怎样留界限。\n\n后段C开头是：\n\n> Finding that line requires a new application of an existing protection rather than abandoning the protection.\n\nC的Finding that line指B所讨论的界限，再解释解决它需要更新既有保护的应用方式。\n\n这三段的推进关系：\n\n> 由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用\n\n再检验候选F：\n\n> One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.\n\nF回到以技术太快为由推迟裁决的旧建议，不能展开B应承担的具体划界，也让C的that line缺少紧接的规则边界。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>That expectation still leaves the practical task of drawing a line.</p>\n</blockquote>\n<p>G提出保护期待，B的That expectation接住它；still说明承认权利后还有实际划界工作。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In many situations police can obtain a warrant without excessive difficulty. Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.</p>\n</blockquote>\n<p>一般可申请搜查令，严重紧急情况与防止数据灭失又可能要求即时措施，B具体展开保护与行动之间怎样留界限。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection.</p>\n</blockquote>\n<p>C的Finding that line指B所讨论的界限，再解释解决它需要更新既有保护的应用方式。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.</p>\n</blockquote>\n<p>F回到以技术太快为由推迟裁决的旧建议，不能展开B应承担的具体划界，也让C的that line缺少紧接的规则边界。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.\n\n再看C段开头：\n\n> Finding that line requires a new application of an existing protection rather than abandoning the protection.\n\nB刚说明一般授权与紧急措施的边界，C用Finding that line承接，提出以新方式应用旧保护。\n\n本段内部继续写道：\n\n> The history of the automobile offers a useful parallel: as cars became a necessity, courts had to define rules for a new personal domain. Digital information now calls for a comparable effort.\n\n汽车成为必需品时法院也曾面对新私人领域，数字信息现在要求comparable effort，这个parallel具体支持适应新技术的做法。\n\n后段H开头是：\n\n> The parallel identifies both continuity and change.\n\nH的The parallel专指C刚建立的汽车与数字信息类比，再总结哪些保护持续、哪些规则要更新。\n\n这三段的推进关系：\n\n> 说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用 → 总结原则连续与规则适应并存\n\n再检验候选F：\n\n> One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.\n\nF仅给出技术太快所以克制的建议，不包含两时代的类比；接F会使H的The parallel没有对应材料，并回到前面已经反驳的问题。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection.</p>\n</blockquote>\n<p>B刚说明一般授权与紧急措施的边界，C用Finding that line承接，提出以新方式应用旧保护。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The history of the automobile offers a useful parallel: as cars became a necessity, courts had to define rules for a new personal domain. Digital information now calls for a comparable effort.</p>\n</blockquote>\n<p>汽车成为必需品时法院也曾面对新私人领域，数字信息现在要求comparable effort，这个parallel具体支持适应新技术的做法。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The parallel identifies both continuity and change.</p>\n</blockquote>\n<p>H的The parallel专指C刚建立的汽车与数字信息类比，再总结哪些保护持续、哪些规则要更新。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用 → 总结原则连续与规则适应并存</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.</p>\n</blockquote>\n<p>F仅给出技术太快所以克制的建议，不包含两时代的类比；接F会使H的The parallel没有对应材料，并回到前面已经反驳的问题。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **digital privacy** | **数字隐私** | **社会现象类｜科技经济** | **宏观主题** |\n| technological progress | 技术进步 | 社会现象类｜科技经济 | 宏观主题 |\n| the protection of personal rights | 个人权利保护 | 社会现象类｜社会生活 | 宏观主题 |\n| **reasonable privacy protection** | **合理的隐私保护** | **社会现象类｜科技经济** | **宏观主题** |\n| responsible use of technology | 负责任地使用技术 | 人生哲理类｜责任与理性 | 个人主题 |\n| practical guidance | 切实的指导 | 社会现象类｜科技经济 | 宏观主题 |\n| adaptability | 适应能力 | 人生哲理类｜与时俱进 | 个人主题 |\n| balanced regulation | 兼顾各方的监管 | 社会现象类｜社会生活 | 宏观主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>digital privacy</strong></td>\n<td><str ated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The phone in the picture serves as a vast storehouse of personal information.</strong></td>\n<td><strong>图中的手机充当着个人信息的巨大储存库。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene shows how closely digital devices have become linked to ordinary life.</td>\n<td>场景展示了数字设备与日常生活联系何等紧密。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The image contrasts the convenience of access with the need for privacy.</td>\n<td>图画对比了获取信息的便利与隐私保护的需要。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The chart shows a rapid expansion in the use of digital information.</strong></td>\n<td><strong>图表显示数字信息使用的迅速扩张。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The proportion of users keeping private records on their devices has increased.</td>\n<td>在设备上保存私人记录的用户比例有所增加。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The figures indicate that the technology has become a virtual necessity of life.</td>\n<td>数据表明这项技术几乎已成为生活必需品。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement calls for updated guidance in response to technological change.</td>\n<td>这句话呼吁针对技术变化更新指引。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage highlights the challenge of drawing a line between access and protection.</td>\n<td>这段文字凸显了在获取与保护之间划定界限的挑战。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Rules must adapt when technology creates a new personal domain</strong></p><p><strong>B. The legal question and a request for judicial restraint</strong></p><p><strong>C. Why a smartphone search resembles entering a home</strong></p><p><strong>D. A complete ban on every urgent police measure</strong></p><p><strong>E. The case for updated judicial guidance</strong></p><p><strong>F. Protecting ordinary digital life while drawing practical limits</strong></p><p><strong>G. Replacing all constitutional principles with technology</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest. California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest. It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>The court would be recklessly modest if it followed California&#x27;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>They should start by discarding California&#x27;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#x27;s purse. The court has ruled that police don&#x27;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#x27;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#x27;s reading history, financial history, medical history and comprehensive records of recent correspondence. The development of &quot;cloud computing&quot;, meanwhile, has made that exploration so much the easier.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#x27;s prohibition on unreasonable searches. As so often is the case, stating that principle doesn&#x27;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>But the justices should not swallow California&#x27;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#x27;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Digital privacy presents a familiar constitutional question in an unfamiliar setting. A phone carried during an arrest may contain much more than the physical possessions traditionally searched by police. Courts must decide how protections against unreasonable searches apply to the information inside it.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>That expectation still leaves the practical task of drawing a line. In many situations police can obtain a warrant without excessive difficulty. Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>Finding that line requires a new application of an existing protection rather than abandoning the protection. The history of the automobile offers a useful parallel: as cars became a necessity, courts had to define rules for a new personal domain. Digital information now calls for a comparable effort.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Postponing guidance, however, may itself be reckless when enough of the implications are already clear. The most important implication concerns what a smartphone contains. Its collection of private records makes it necessary to test whether the old comparison with a wallet remains convincing.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The wallet comparison becomes weak once the range of those records is considered. Reading, financial and medical histories, together with correspondence, can expose an extensive private life. Accessing this storehouse resembles entering a home more than simply examining a small physical container.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly. California urged judicial restraint on this ground and appealed to earlier assumptions about searching a suspect’s possessions. That proposal treats uncertainty as a reason for postponing new guidance.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Such a storehouse is increasingly part of ordinary life, not an exceptional choice made by a few careless users. People cannot always avoid keeping sensitive information on their devices. Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>The parallel identifies both continuity and change. Constitutional protection remains the starting point, while the rules that make it effective must respond to the new setting. Courts should therefore clarify how digital privacy is protected instead of assuming that older physical searches settle every modern question.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Constitution</td>\n<td>n.宪法</td>\n<td>digital data</td>\n<td>数字数据</td>\n<td>Supreme Court</td>\n<td>最高法院</td>\n</tr>\n<tr>\n<td>contents</td>\n<td>n.内容</td>\n<td>warrant</td>\n<td>n.搜查令</td>\n<td>suspect</td>\n<td>n.嫌疑人</td>\n</tr>\n<tr>\n<td>arrest</td>\n<td>n.逮捕</td>\n<td>protect</td>\n<td>v.保护</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>refrain from</td>\n<td>避免</td>\n<td>sweeping</td>\n<td>adj.广泛的</td>\n<td>ruling</td>\n<td>n.裁决</td>\n</tr>\n<tr>\n<td>upset</td>\n<td>v.推翻</td>\n<td>assumption</td>\n<td>n.假定</td>\n<td>authorities</td>\n<td>n.当局</td>\n</tr>\n<tr>\n<td>possessions</td>\n<td>n.财物</td>\n<td>assess</td>\n<td>v.评估</td>\n<td>implications</td>\n<td>n.影响</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</t
