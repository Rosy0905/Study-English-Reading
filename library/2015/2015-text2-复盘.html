<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| Constitution | n.宪法 | digital data | 数字数据 | Supreme Court | 最高法院 |\n| contents | n.内容 | warrant | n.搜查令 | suspect | n.嫌疑人 |\n| arrest | n.逮捕 | protect | v.保护 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,123,900,280],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Constitution</td>\n<td>n.宪法</td>\n<td>digital data</td>\n<td>数字数据</td>\n<td>Supreme Court</td>\n<td>最高法院</td>\n</tr>\n<tr>\n<td>contents</td>\n<td>n.内容</td>\n<td>warrant</td>\n<td>n.搜查令</td>\n<td>suspect</td>\n<td>n.嫌疑人</td>\n</tr>\n<tr>\n<td>arrest</td>\n<td>n.逮捕</td>\n<td>protect</td>\n<td>v.保护</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| refrain from | 避免 | sweeping | adj.广泛的 | ruling | n.裁决 |\n| upset | v.推翻 | assumption | n.假定 | authorities | n.当局 |\n| possessions | n.财物 | assess | v.评估 | implications | n.影响 |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,549,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>refrain from</td>\n<td>避免</td>\n<td>sweeping</td>\n<td>adj.广泛的</td>\n<td>ruling</td>\n<td>n.裁决</td>\n</tr>\n<tr>\n<td>upset</td>\n<td>v.推翻</td>\n<td>assumption</td>\n<td>n.假定</td>\n<td>au es / to obtain a warrant / to search through phone contents.\n\nThey could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure / that phone data are not erased or altered / while waiting for a warrant.\n\nThe court, though, / may want to allow room / for police / to cite situations / where they are entitled / to more freedom.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[95,2831,900,635],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>As so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3>\n<p>As so often is the case, / stating that principle / doesn&#39;t ease / the challenge of line-drawing.</p>\n<p>In many cases, / it would not be overly burdensome / for authorities / to obtain a warrant / to search through phone contents.</p>\n<p>They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure / that phone data are not erased or altered / while waiting for a warrant.</p>\n<p>The court, though, / may want to allow room / for police / to cite situations / where they are entitled / to more freedom.</p>\n</section>"},{"title":"第6段","raw":"### 意群翻译 · 第6段\n\n正如经常发生的情况，/ 陈述那个原则 / 并不能缓解 / 划界的挑战。\n\n在许多情况下，/ 不会过于繁重 / 对当局来说 / 获得搜查令 / 来搜查手机内容。\n\n他们仍然可以使无效 / 第四修正案保护 / 当面临严重、紧急情况时，/ 并且他们可以采取合理措施 / 来确保 / 手机数据不被删除或更改 / 在等待搜查令期间。\n\n法院，然而，/ 可能想要留出空间 / 给警察 / 来引用情况 / 在那里他们有权 / 获得更多自由。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[95,2831,900,635],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>As so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3>\n<p>As so often is the case, / stating that principle / doesn&#39;t ease / the challenge of line-drawing.</p>\n<p>In many cases, / it would not be overly burdensome / for authorities / to obtain a warrant / to search through phone contents.</p>\n<p>They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure / that phone data are not erased or altered / while waiting for a warrant.</p>\n<p>The court, though, / may want to allow room / for police / to cite situations / where the tions. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</section>"},{"title":"第7段","raw":"### 意群划分 · 第7段\n\nBut the justices / should not swallow / California's argument whole.\n\nNew, disruptive technology / sometimes demands / novel applications / of the Constitution's protections.\n\nOrin Kerr, / a law professor, / compares / the explosion and accessibility / of digital information / in the 21st century / with the establishment / of automobile use / as a virtual necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment applies / to digital information now.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[95,3673,900,481],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false},"focusId":"focus-paragraph-7-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-7-0\"><h3>完整原文 · 第7段</h3>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</section><sect n of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-7-1\"><h3>意群划分 · 第7段</h3>\n<p>But the justices / should not swallow / California&#39;s argument whole.</p>\n<p>New, disruptive technology / sometimes demands / novel applications / of the Constitution&#39;s protections.</p>\n<p>Orin Kerr, / a law professor, / compares / the explosion and accessibility / of digital information / in the 21st century / with the establishment / of automobile use / as a virtual necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment applies / to digital information now.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-7-2\"><h3>意群翻译 · 第7段</h3>\n<p>但法官们 / 不应该全盘接受 / 加利福尼亚州的论点。</p>\n<p>新的、颠覆性的技术 / 有时需要 / 新颖的应用 / 宪法保护的。</p>\n<p>奥林·克尔，/ 一位法学教授，/ 比较 / 爆炸式增长和可获取性 / 数字信息的 / 在21世纪 / 与确立 / 汽车使用 / 作为生活的实际必需品 / 在20世纪：/ 法官们必须制定 / 新颖的规则 / 为新的个人领域 / 乘用车的当时；/ 他们必须理清 / 第四修正案如何适用 / 于数字信息现在。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-7-3\"><h3>标准译文 · 第7段</h3>\n<p>但法官们不应该全盘接受加利福尼亚州的论点。新的、颠覆性的技术有时需要对宪法保护进行新颖的应用。法学教授奥林·克尔将21世纪数字信息的爆炸式增长和可获取性与20世纪汽车使用成为生活实际必需品的确立进行了比较：当时法官们必须为乘用车这一新的个人领域制定新颖的规则；现在他们必须理清第四修正案如何适用于数字信息。</p>\n</section>"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>"},{"title":"句子逻辑梳理（选修）","raw":"## 句子逻辑梳理（选修）\n\n**第1段**\n\nJust how much → does the Constitution protect → your digital data?\n\nThe Supreme Court → will now consider：(whether police can search → the contents of a mobile phone：(without a warrant)：(if the phone is on or around a person：(during an arrest))).\n\n**第2段**\n\nCalifornia has asked → the justices → to refrain from → a sweeping ruling：(particularly one：(that upsets the old assumption：(that authorities may search through → the possessions of suspects：(at the time of their arrest)))).\n\nIt is hard：(the state argues) → for judges → to assess the implications：(of new and rapidly changing technologies).\n\n**第3段**\n\nThe court → would be recklessly modest：(if it followed → California's advice).\n\nEnough of the implications → are discernable + even obvious → so that the justices → can and should provide → updated guidelines：(to police + lawyers + defendants).\n\n**第4段**\n\nThey should start：(by discarding → California's lame argument：(that exploring the contents of a smartphone：(a vast storehouse of digital information) → is similar to：(going through a suspect's purse))).\n\nThe court has ruled：(that police don't violate → the Fourth Amendment：(when they go through → the wallet or pocketbook：(of an arrestee)：(without a warrant))).\n\nBut exploring one's smartphone → is more like → entering his or her home.\n\nA smartphone may contain：(an arrestee's reading history + financial history + medical history + comprehensive records：(of recent correspondence)).\n\nThe development of \"cloud computing\"：(meanwhile) → has made that exploration → so much the easier.\n\n**第5段**\n\nAmericans should take steps → to protect → their digital privacy.\n\nBut keeping sensitive information：(on these devices) → is increasingly a requirement：(of normal life).\n\nCitizens still have a right → to expect：(private documents to remain private + protected：(by the Constitution's prohibition：(on unreasonable searches))).\n\n**第6段**\n\nAs so often is the case → stating that principle → doesn't ease → the challenge of line-drawing.\n\nIn many cases → it would not be overly burdensome：(for authorities) → to obtain a warrant：(to search through phone contents).\n\nThey could still invalidate → Fourth Amendment protections：(when facing severe, urgent circumstances) + they could take reasonable measures → to ensure：(that phone data are not erased or altered：(while waiting for a warrant)).\n\nThe court：(though) → may want to allow room：(for police) → to cite situations：(where they are entitled → to more freedom).\n\n**第7段**\n\nBut the justices → should not swallow → California's argument whole.\n\nNew, disruptive technology → sometimes demands → novel applications：(of the Constitution's protections).\n\nOrin Kerr：(a law professor) → compares → the explosion and accessibility：(of digital information：(in the 21st century)) → with the establishment：(of automobile use：(as a virtual necessity of life：(in the 20th)))：The justices had to specify → novel rules：(for the new personal domain：(of the passenger car then)); they must sort out → how the Fourth Amendment applies：(to digital information now).","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>Just how much → does the Constitution protect → your digital data?</p>\n<p>The Supreme Court → will now consider：(whether police can search → the contents of a mobile phone：(without a warrant)：(if the phone is on or around a person：(during an arrest))).</p>\n<p><strong>第2段</strong></p>\n<p>California has asked → the justices → to refrain from → a sweeping ruling：(particularly one：(that upsets the old assumption：(that authorities may search through → the possessions of suspects：(at the time of their arrest)))).</p>\n<p>It is hard：(the state argues) → for judges → to assess the implications：(of new and rapidly changing technologies).</p>\n<p><strong>第3段</strong></p>\n<p>The court → would be recklessly modest：(if it followed → California&#39;s advice).</p>\n<p>Enough of the implications → are discernable + even obvious → so that the justices → can and should provide → updated guidelines：(to police + lawyers + defendants).</p>\n<p><strong>第4段</strong></p>\n<p>They should start：(by discarding → California&#39;s lame argument：(that exploring the contents of a smartphone：(a vast storehouse of digital information) → is similar to：(going through a suspect&#39;s purse))).</p>\n<p>The court has ruled：(that police don&#39;t violate → the Fourth Amendment：(when they go through → the wallet or pocketbook：(of an arrestee)：(without a warrant))).</p>\n<p>But exploring one&#39;s smartphone → is more like → entering his or her home.</p>\n<p>A smartphone may contain：(an arrestee&#39;s reading history + financial history + medical history + comprehensive records：(of recent correspondence)).</p>\n<p>The development of &quot;cloud computing&quot;：(meanwhile) → has made that exploration → so much the easier.</p>\n<p><strong>第5段</strong></p>\n<p>Americans should take steps → to protect → their digital privacy.</p>\n<p>But keeping sensitive information：(on these devices) → is increasingly a requirement：(of normal life).</p>\n<p>Citizens still have a right → to expect：(private documents to remain private + protected：(by the Constitution&#39;s prohibition：(on unreasonable searches))).</p>\n<p><strong>第6段</strong></p>\n<p>As so often is the case → stating that principle → doesn&#39;t ease → the challenge of line-drawing.</p>\n<p>In many cases → it would not be overly burdensome：(for authorities) → to obtain a warrant：(to search through phone contents).</p>\n<p>They could still invalidate → Fourth Amendment protections：(when facing severe, urgent circumstances) + they could take reasonable measures → to ensure：(that phone data are not erased or altered：(while waiting for a warrant)).</p>\n<p>The court：(though) → may want to allow room：(for police) → to cite situations：(where they are entitled → to more freedom).</p>\n<p><strong>第7段</strong></p>\n<p>But the justices → should not swallow → California&#39;s argument whole.</p>\n<p>New, disruptive technology → sometimes demands → novel applications：(of the Constitution&#39;s protections).</p>\n<p>Orin Kerr：(a law professor) → compares → the explosion and accessibility：(of digital information：(in the 21st century)) → with the establishment：(of automobile use：(as a virtual necessity of life：(in the 20th)))：The justices had to specify → novel rules：(for the new personal domain：(of the passenger car then)); they must sort out → how the Fourth Amendment applies：(to digital information now).</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n究竟多大程度上 → 宪法保护 → 你的数字数据？\n\n最高法院 → 现在将考虑：(警察是否可以搜查 → 手机的内容：(没有搜查令的情况下)：(如果手机在一个人身上或周围：(在逮捕期间)))。\n\n**第2段**\n\n加利福尼亚州已经要求 → 法官们 → 避免做出 → 一个全面的裁决：(特别是一个：(会颠覆旧有假设的：(即当局可以搜查 → 嫌疑人的物品：(在他们被逮捕时))))。\n\n很困难：(该州辩称) → 对法官来说 → 评估影响：(新的和快速变化的技术的)。\n\n**第3段**\n\n法院 → 将是鲁莽地谦虚：(如果它遵循 → 加利福尼亚州的建议)。\n\n足够多的影响 → 是可以辨别的 + 甚至是明显的 → 因此法官们 → 能够且应该提供 → 更新的指导方针：(给警察 + 律师 + 被告)。\n\n**第4段**\n\n他们应该开始：(通过抛弃 → 加利福尼亚州的蹩脚论点：(即探索智能手机的内容：(一个庞大的数字信息仓库) → 类似于：(翻查嫌疑人的钱包)))。\n\n法院已经裁定：(警察不违反 → 第四修正案：(当他们翻查 → 钱包或手提包：(被捕者的)：(没有搜查令的情况下)))。\n\n但探索某人的智能手机 → 更像是 → 进入他或她的家。\n\n智能手机可能包含：(被捕者的阅读历史 + 财务历史 + 医疗历史 + 全面的记录：(最近通信的))。\n\n\"云计算\"的发展：(与此同时) → 已经使这种探索 → 变得容易得多。\n\n**第5段**\n\n美国人应该采取措施 → 来保护 → 他们的数字隐私。\n\n但保存敏感信息：(在这些设备上) → 越来越成为一种要求：(正常生活的)。\n\n公民仍然有权利 → 期待：(私人文件保持私密 + 受到保护：(通过宪法的禁止：(对不合理搜查的)))。\n\n**第6段**\n\n正如经常发生的情况 → 陈述那个原则 → 并不能缓解 → 划界的挑战。\n\n在许多情况下 → 不会过于繁重：(对当局来说) → 获得搜查令：(来搜查手机内容)。\n\n他们仍然可以使无效 → 第四修正案保护：(当面临严重、紧急情况时) + 他们可以采取合理措施 → 来确保：(手机数据不被删除或更改：(在等待搜查令期间))。\n\n法院：(然而) → 可能想要留出空间：(给警察) → 来引用情况：(在那里他们有权 → 获得更多自由)。\n\n**第7段**\n\n但法官们 → 不应该全盘接受 → 加利福尼亚州的论点。\n\n新的、颠覆性的技术 → 有时需要 → 新颖的应用：(宪法保护的)。\n\n奥林·克尔：(一位法学教授) → 比较 → 爆炸式增长和可获取性：(数字信息的：(在21世纪)) → 与确立：(汽车使用：(作为生活的实际必需品：(在20世纪)))：法官们必须制定 → 新颖的规则：(为新的个人领域：(乘用车的当时))；他们必须理清 → 第四修正案如何适用：(于数字信息现在)。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>究竟多大程度上 → 宪法保护 → 你的数字数据？</p>\n<p>最高法院 → 现在将考虑：(警察是否可以搜查 → 手机的内容：(没有搜查令的情况下)：(如果手机在一个人身上或周围：(在逮捕期间)))。</p>\n<p><strong>第2段</strong></p>\n<p>加利福尼亚州已经要求 → 法官们 → 避免做出 → 一个全面的裁决：(特别是一个：(会颠覆旧有假设的：(即当局可以搜查 → 嫌疑人的物品：(在他们被逮捕时))))。</p>\n<p>很困难：(该州辩称) → 对法官来说 → 评估影响：(新的和快速变化的技术的)。</p>\n<p><strong>第3段</strong></p>\n<p>法院 → 将是鲁莽地谦虚：(如果它遵循 → 加利福尼亚州的建议)。</p>\n<p>足够多的影响 → 是可以辨别的 + 甚至是明显的 → 因此法官们 → 能够且应该提供 → 更新的指导方针：(给警察 + 律师 + 被告)。</p>\n<p><strong>第4段</strong></p>\n<p>他们应该开始：(通过抛弃 → 加利福尼亚州的蹩脚论点：(即探索智能手机的内容：(一个庞大的数字信息仓库) → 类似于：(翻查嫌疑人的钱包)))。</p>\n<p>法院已经裁定：(警察不违反 → 第四修正案：(当他们翻查 → 钱包或手提包：(被捕者的)：(没有搜查令的情况下)))。</p>\n<p>但探索某人的智能手机 → 更像是 → 进入他或她的家。</p>\n<p>智能手机可能包含：(被捕者的阅读历史 + 财务历史 + 医疗历史 + 全面的记录：(最近通信的))。</p>\n<p>&quot;云计算&quot;的发展：(与此同时) → 已经使这种探索 → 变得容易得多。</p>\n<p><strong>第5段</strong></p>\n<p>美国人应该采取措施 → 来保护 → 他们的数字隐私。</p>\n<p>但保存敏感信息：(在这些设备上) → 越来越成为一种要求：(正常生活的)。</p>\n<p>公民仍然有权利 → 期待：(私人文件保持私密 + 受到保护：(通过宪法的禁止：(对不合理搜查的)))。</p>\n<p><strong>第6段</strong></p>\n<p>正如经常发生的情况 → 陈述那个原则 → 并不能缓解 → 划界的挑战。</p>\n<p>在许多情况下 → 不会过于繁重：(对当局来说) → 获得搜查令：(来搜查手机内容)。</p>\n<p>他们仍然可以使无效 → 第四修正案保护：(当面临严重、紧急情况时) + 他们可以采取合理措施 → 来确保：(手机数据不被删除或更改：(在等待搜查令期间))。</p>\n<p>法院：(然而) → 可能想要留出空间：(给警察) → 来引用情况：(在那里他们有权 → 获得更多自由)。</p>\n<p><strong>第7段</strong></p>\n<p>但法官们 → 不应该全盘接受 → 加利福尼亚州的论点。</p>\n<p>新的、颠覆性的技术 → 有时需要 → 新颖的应用：(宪法保护的)。</p>\n<p>奥林·克尔：(一位法学教授) → 比较 → 爆炸式增长和可获取性：(数字信息的：(在21世纪)) → 与确立：(汽车使用：(作为生活的实际必需品：(在20世纪)))：法官们必须制定 → 新颖的规则：(为新的个人领域：(乘用车的当时))；他们必须理清 → 第四修正案如何适用：(于数字信息现在)。</p>\n"},{"title":"长难句翻译练习（英一必修，英二选修）","raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感，把应该放在一起的意群合并；\n4. 找到中文句子的骨干，再按照中  personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment applies / to digital information now.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>奥林·克尔，/ 一位法学教授，/ 比较 / 爆炸式增长和可获取性 / 数字信息的 / 在21世纪 / 与确立 / 汽车使用 / 作为生活的实际必需品 / 在20世纪：/ 法官们必须制定 / 新颖的规则 / 为新的个人领域 / 乘用车的当时；/ 他们必须理清 / 第四修正案如何适用 / 于数字信息现在。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先合并学者身份与compare A with B，再把冒号后then/now对照连接到类比的用途。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>奥林·克尔， 一位法学教授， 比较  爆炸式增长和可获取性  数字信息的  在21世纪  与确立  汽车使用  作为生活的实际必需品  在20世纪： 法官们必须制定  新颖的规则  为新的个人领域  乘用车的当时； 他们必须理清  第四修正案如何适用  于数字信息现在。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>Kerr把数字信息扩张比作汽车成为生活必需品。</p>\n</blockquote>\n<p>先说比较两种技术发展，再说明过去与现在各需要明确什么规则。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>法学教授奥林·克尔将21世纪数字信息的爆炸式增长和可获取性与20世纪汽车使用成为生活实际必需品的确立进行了比较：当时法官们必须为乘用车这一新的个人领域制定新颖的规则；现在他们必须理清第四修正案如何适用于数字信息。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>novel rules强调新适用规则，不等于取消宪法保护原则。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>法学教授奥林·克尔将21世纪数字信息的爆炸式增长和可获取性与20世纪汽车使用成为生活实际必需品的确立进行了比较：当时法官们必须为乘用车这一新的个人领域制定新颖的规则；现在他们必须理清第四修正案如何适用于数字信息。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.\n>\n> 最高法院将裁定，在逮捕过程中，做什么是否合法？\n\n### 题型\n\n细节题：法院还将考虑这个问题，题目要求复述待裁定的行为、对象与条件，并非提前宣布裁定结果。\n\nThe Supreme Court与during an arrest都出现在第1段。先完整读这一段，分清宪法保护的总问题与法院即将考虑的具体情形。\n\n### 核心出处\n\n> whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.\n>\n> whether police can search the contents of a mobile phone without a warrant","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,428],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"26","questionIntro":true},"html":"<blockquote>\n<p>The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.</p>\n<p>最高法院将裁定，在逮捕过程中，做什么是否合法？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：法院还将考虑这个问题，题目要求复述待裁定的行为、对象与条件，并非提前宣布裁定结果。</p>\n<p>The Supreme Court与during an arrest都出现在第1段。先完整读这一段，分清宪法保护的总问题与法院即将考虑的具体情形。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n"},{"title":"A. search for suspects’ mobile phones without a warrant","raw":"### A. search for suspects’ mobile phones without a warrant\n\n> 法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n`search the contents`是搜查手机内部数据，A的`search for ... phones`是寻找手机本身。原文已把手机在身上或身边作为条件，法院要审查的并非寻找物件。\n\n**出处：**\n\n> The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>search the contents</code>是搜查手机内部数据，A的<code>search for ... phones</code>是寻找手机本身。原文已把手机在身上或身边作为条件，法院要审查的并非寻找物件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n</section>"},{"title":"A. search for suspects’ mobile phones without a warrant","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。\n\n本项`search for suspects’ mobile phones`说寻找手机；第1段第2句`search the contents of a mobile phone`写警察的搜查，回到该句核对搜查对象。\n\n原文`search the contents of a mobile phone`是搜查手机里面的内容，手机在某人身上或身边已经作为条件给出。本项`search for suspects’ mobile phones`则是寻找手机本身，虽然保留没有搜查令的条件，却更换了法院要审查的行为和对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>search the contents</code>是搜查手机内部数据，A的<code>search for ... phones</code>是寻找手机本身。原文已把手机在身上或身边作为条件，法院要审查的并非寻找物件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p>本项<code>search for suspects’ mobile phones</code>说寻找手机；第1段第2句<code>search the contents of a mobile phone</code>写警察的搜查，回到该句核对搜查对象。</p>\n<p>原文<code>search the contents of a mobile phone</code>是搜查手机里面的内容，手机在某人身上或身边已经作为条件给出。本项<code>search for suspects’ mobile phones</code>则是寻找手机本身，虽然保留没有搜查令的条件，却更换了法院要审查的行为和对象。</p>\n</section>"},{"title":"A. search for suspects’ mobile phones without a warrant","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.\n>\n> 最高法院现在将考虑：逮捕时，如果手机在某人身上或身边，警察可否在没有搜查令的情况下搜查其中内容。\n\n首句提出数据保护范围，第二句将问题具体 uring an arrest.</p>\n<p>最高法院现在将考虑：逮捕时，如果手机在某人身上或身边，警察可否在没有搜查令的情况下搜查其中内容。</p>\n</blockquote>\n<p>首句提出数据保护范围，第二句将问题具体化为逮捕时能否无搜查令查看手机内容。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Supreme Court will decide whether it is legitimate, during an arrest, to search for suspects&#39; mobile phones without a warrant.</p>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p>A需要法院审查寻找手机的合法性。手机在哪里与手机里有什么是两种对象，保留without a warrant仍不能补回被换掉的contents。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. check suspects’ phone contents without being authorized","raw":"### B. check suspects’ phone contents without being authorized\n\n> 法院将裁定：逮捕时，未经授权查看嫌疑人手机内容是否合法。\n\n**做题模式中的状态：** 第一轮保留B、D，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\nB同时保留逮捕场景、查看手机内容和未取得授权三个条件，正对应首段法院即将考虑的问题。\n\n**出处：**\n\n> The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>法院将裁定：逮捕时，未经授权查看嫌疑人手机内容是否合法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、D，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>B同时保留逮捕场景、查看手机内容和未取得授权三个条件，正对应首段法院即将考虑的问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n</section>"},{"title":"B. check suspects’ phone contents without being authorized","raw":"## their mobile phones.</p>\n<p>法院将裁定：逮捕时，禁止嫌疑人使用手机是否合法。</p>\n</blockquote>\n<p>D要求禁止使用，可能包含打电话等许多操作。原句只讨论警方搜查数据，不能把这项权限问题扩成持有人使用设备的全面禁令。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. B**\n\n- A：search the contents是搜查手机内部数据，A的search for ... phones是寻找手机本身。原文已把手机在身上或身边作为条件，法院要审查的并非寻找物件。\n- B：B同时保留逮捕场景、查看手机内容和未取得授权三个条件，正对应首段法院即将考虑的问题。\n- C：阻止删除数据是限制嫌疑人的操作，查看内容是警方读取数据。C把法院要审查的行为改了。\n- D：D禁止嫌疑人使用手机，原文则问警察能否查看手机内容。动作主体与被限制的行为都不相同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"26","questionConclusion":true},"html":"<blockquote>\n<p><strong>26. B</strong></p>\n</blockquote>\n<ul>\n<li>A：search the contents是搜查手机内部数据，A的search for ... phones是寻找手机本身。原文已把手机在身上或身边作为条件，法院要审查的并非寻找物件。</li>\n<li>B：B同时保留逮捕场景、查看手机内容和未取得授权三个条件，正对应首段法院即将考虑的问题。</li>\n<li>C：阻止删除数据是限制嫌疑人的操作，查看内容是警方读取数据。C把法院要审查的行为改了。</li>\n<li>D：D禁止嫌疑人使用手机，原文则问警察能否查看手机内容。动作主体与被限制的行为都不相同。</li>\n</ul>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> The author’s attitude toward California’s argument is one of ______.\n>\n> 作者对加利福尼亚州的论点持什么态度？\n\n### 题型\n\n态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。\n\nCalifornia’s argument指向第2段加州向法官提出的请求；第3段以California’s advice继续谈这项建议。依次完整读这两段，分清该州的理由与作者的回应。\n\n### 核心出处\n\n> They should start by discarding California's lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect's purse. The court has ruled that police don't violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one's smartphone is more like entering his or her home. A smartphone may contain an arrestee's reading history, financial history, medical history and comprehensive records of recent correspondence. The development of \"cloud computing\", meanwhile, has made that exploration so much the easier\n>\n> The court would be recklessly modest if it followed California's advice\n>\n> They should start by discarding California's lame argument","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,586,1344,368],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"27","questionIntro":true},"html":"<blockquote>\n<p>The author’s attitude toward California’s argument is one of ______.</p>\n<p>作者对加利福尼亚州的论点持什么态度？</p>\n</blockquote>\n<h3>题型</h3>\n<p>态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。</p>\n<p>California’s argument指向第2段加州向法官提出的请求；第3段以California’s advice继续谈这项建议。依次完整读这两段，分清该州的理由与作者的回应。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence. The development of &quot;cloud computing&quot;, meanwhile, has made that exploration so much the easier</p>\n<p>The court would be recklessly modest if it followed California&#39;s advice</p>\n<p>They should start by discarding California&#39;s lame argument</p>\n</blockquote>\n"},{"title":"A. tolerance","raw":"### A. tolerance\n\n> 作者对加州论点的态度是宽容。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。\n\n**出处：**\n\n> The court would be recklessly modest if it followed California's advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\n> They should start by discarding California's lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect's purse.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,586,1344,368],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n</section>"},{"title":"A. tolerance","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者对加州论点的态度是宽容。\n\n`tolerance`要从作者是否接受或容让该论点来判断。第3段的`recklessly modest`不是赞扬谦虚，而是说法院照办就会退让得不负责任；紧接着can and should要求法院更新指引。\n\n第4段又用`lame argument`批评论证薄弱，并明确写`should start by discarding`，要求首先弃用它。评价与处理意见都是否定方向。\n\n因此不能把作者对执法边界的细致讨论，移成对加州论点的容忍。题干限定的是这项论点，而作者已经说清不应采纳它。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,586,1344,368],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p><code>tolerance</code>要从作者是否接受或容让该论点来判断。第3段的<code>recklessly modest</code>不是赞扬谦虚，而是说法院照办就会退让得不负责任；紧接着can and should要求法院更新指引。</p>\n<p>第4段又用<code>lame argument</code>批评论证薄弱，并明确写<code>should start by discarding</code>，要求首先弃用它。评价与处理意见都是否定方向。</p>\n<p>因此不能把作者对执法边界的细致讨论，移成对加州论点的容忍。题干限定的是这项论点，而作者已经说清不应采纳它。</p>\n</section>"},{"title":"A. tolerance","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The court would be recklessly modest if it followed California's advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\n> They should start by discarding California's lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect's purse.\n>\n> 法院若遵循加州建议，就会退让得过于草率。技术的许多影响已经可辨识，甚至显而易见，因此法官能够也应该为警方、律师和被告更新指引。首先应舍弃加州那个站不住脚的论点：查看智能手机——一座庞大的数字信息库——类似于翻查嫌疑人的钱包。\n\n作者先批评法院若照办就是过分退让，再提出更新指引，接着指定首先要舍弃的钱包类比。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The author shows tolerance toward California’s argument.\n>\n> 作者对加州论点的态度是宽容。\n\nA需要在承认问题后仍表达接受或容让。原段没有这一转向，而是沿着批评继续要求弃用，不能把不采纳说成宽容。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,586,1344,368],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p><code>tolerance</code>要从作者是否接受或容让该论点来判断。第3段的<code>recklessly modest</code>不是赞扬谦虚，而是说法院照办就会退让得不负责任；紧接着can and should要求法院更新指引。</p>\n<p>第4段又用<code>lame argument</code>批评论证薄弱，并明确写<code>should start by discarding</code>，要求首先弃用它。评价与处理意见都是否定方向。</p>\n<p>因此不能把作者对执法边界的细致讨论，移成对加州论点的容忍。题干限定的是这项论点，而作者已经说清不应采纳它。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should p 该为警方、律师和被告更新指引。首先应舍弃加州那个站不住脚的论点：查看智能手机——一座庞大的数字信息库——类似于翻查嫌疑人的钱包。</p>\n</blockquote>\n<p>加州以不确定为由主张克制，下一段作者用discernable、obvious反驳这一前提，再提出更新指引。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author shows cautiousness toward California’s argument.</p>\n<p>作者对加州论点的态度是谨慎。</p>\n</blockquote>\n<p>D需要作者尚在谨慎权衡是否接受加州论点。实际他已否定其依据并给出取舍，后文讨论执法边界的谨慎不能替换对这一特定论点的态度。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. C**\n\n- A：作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。\n- B：can and should提出明确行动要求，discarding又给出具体取舍，作者对加州论点有清楚的否定态度。\n- C：discarding表示舍弃，lame评价论点站不住脚。二者共同支持disapproval的不赞成。\n- D：评估技术困难是the state argues引出的加州理由。作者反而说影响已经清楚，并要求弃用其论点，不能把加州的谨慎转给作者。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,586,1344,368],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"27","questionConclusion":true},"html":"<blockquote>\n<p><strong>27. C</strong></p>\n</blockquote>\n<ul>\n<li>A：作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。</li>\n<li>B：can and should提出明确行动要求，discarding又给出具体取舍，作者对加州论点有清楚的否定态度。</li>\n<li>C：discarding表示舍弃，lame评价论点站不住脚。二者共同支持disapproval的不赞成。</li>\n<li>D：评估技术困难是the state argues引出的加州理由。作者反而说影响已经清楚，并要求弃用其论点，不能把加州的谨慎转给作者。</li>\n</ul>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> The author believes that exploring one’s phone contents is comparable to ______.\n>\n> 作者认为，查看某人的手机内容可以比作什么？\n\n### 题型\n\n细节题：找作者明确作出的类比，分清被否定的钱包类比、被认可的住宅类比，以及后面的资料例举。\n\nexploring one’s phone contents对应第4段exploring the contents of a smartphone与exploring one’s smartphone。该段已完整读过，回到同一整段，核对几处相似关系各是谁提出的。\n\n### 核心出处\n\n> But exploring one’s smartphone is more like entering his or her home.\n>\n> A smartphone may contain an arrestee's reading history, financial history, medical history and comprehensive records of recent correspondence\n>\n> They should start by discarding California's lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect's purse","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"28","questionIntro":true},"html":"<blockquote>\n<p>The author believes that exploring one’s phone contents is comparable to ______.</p>\n<p>作者认为，查看某人的手机内容可以比作什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：找作者明确作出的类比，分清被否定的钱包类比、被认可的住宅类比，以及后面的资料例举。</p>\n<p>exploring one’s phone contents对应第4段exploring the contents of a smartphone与exploring one’s smartphone。该段已完整读过，回到同一整段，核对几处相似关系各是谁提出的。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But exploring one’s smartphone is more like entering his or her home.</p>\n<p>A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence</p>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse</p>\n</blockquote>\n"},{"title":"A. getting into one’s residence","raw":"### A. getting into one’s residence\n\n> 作者认为查看手机内容可比作进入某人的住所。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\ngetting into与entering对应，residence与home对应。A完整保留作者把查看手机比作进入私人住所的关系。\n\n**出处：**\n\n> They should start by discarding California's lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect's purse. The court has ruled that police don't violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one's smartphone is more like entering his or her home. A smartphone may contain an arrestee's reading history, financial history, medical history and comprehensive records of recent correspondence.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>作者认为查看手机内容可比作进入某人的住所。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>getting into与entering对应，residence与home对应。A完整保留作者把查看手机比作进入私人住所的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n</blockquote>\n</section>"},{"title":"A. getting into one’s residence","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为查看手机内容可比作进入某人的住所。\n\n本项`getting into one’s residence`与第4段第3句`entering his or her home`都表示进入个人住所，因此回看作者使用`more like`的这句比较。\n\n原文把查看手机比作`entering his or her home`，动作是进入，地点是个人住宅。本项`getting into one’s residence`同样表示进入住所，保持了动作、地点以及它与查看手机之间的比较关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-A-1","html":"<section class=\"revealPart optionLead\" id=\" recent correspondence.\n>\n> 首先应舍弃加州那个站不住脚的论点：查看智能手机内容类似于翻查嫌疑人的钱包。法院已裁定，无搜查令翻查被捕者的钱包或手提包并不违反第四修正案。但查看智能手机更像进入一个人的家，其中可能有阅读、财务、医疗历史以及近期通信的完整记录。\n\n作者先否定钱包类比，再以But转入住宅类比，随后列举手机包含的私人记录解释这种比较。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Exploring phone contents is comparable to getting into one’s residence.\n>\n> 作者认为查看手机内容可比作进入某人的住所。\n\nA没有新增行为或偷换资料种类，既对应明确的more like句，也能与后面的私人资料范围衔接。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>作者认为查看手机内容可比作进入某人的住所。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>getting into与entering对应，residence与home对应。A完整保留作者把查看手机比作进入私人住所的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为查看手机内容可比作进入某人的住所。</p>\n</blockquote>\n<p>本项<code>getting into one’s residence</code>与第4段第3句<code>entering his or her home</code>都表示进入个人住所，因此回看作者使用<code>more like</code>的这句比较。</p>\n<p>原文把查看手机
