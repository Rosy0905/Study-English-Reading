lockquote>\n<p>引用Kerr的比较旨在说明宪法应灵活实施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>引用Kerr的比较旨在说明宪法应灵活实施。</p>\n</blockquote>\n<p>灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。</p>\n<p>先提出新技术要求新的宪法适用，再以过去汽车与今天数字信息并列，说明相同的适应任务在两种技术时代重现。</p>\n<p>不能说原文绝不支持灵活适用；A的不足是泛说实施灵活，不能解释为何专门选汽车与数字信息作比较。B保留两端共同的技术原因与规则回应。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>法官不应全盘接受加州论点。颠覆性的新技术有时要求以新方式适用宪法保护。法学教授Kerr把21世纪数字信息激增且易于获取，与20世纪汽车成为生活必需品相比较：当年法官须为汽车这个新的私人领域明确新规则；如今也必须厘清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<p>先提出新技术要求新的宪法适用，再以过去汽车与今天数字信息并列，说明相同的适应任务在两种技术时代重现。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Constitution should be implemented flexibly.</p>\n<p>引用Kerr的比较旨在说明宪法应灵活实施。</p>\n</blockquote>\n<p>不能说原文绝不支持灵活适用；A的不足是泛说实施灵活，不能解释为何专门选汽车与数字信息作比较。B保留两端共同的技术原因与规则回应。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. new technology requires reinterpretation of the Constitution</h3>\n<blockquote>\n<p>引用Kerr的比较旨在说明新技术要求重新阐释宪法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>汽车成为生活必需品时要明确新规则，数字信息普及时也要厘清第四修正案的适用。B保留了技术变化促使规则重新阐释的对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>引用Kerr的比较旨在说明新技术要求重新阐释宪法。</p>\n</blockquote>\n<p>汽车成为生活必需品时要明确新规则，数字信息普及时也要厘清第四修正案的适用。B保留了技术变化促使规则重新阐释的对应。</p>\n<p>then与now构成历史类比：个人活动领域改变，法院就必须重新说明原有保护在新领域如何运作。</p>\n<p>reinterpretation在这里指解释宪法保护如何适用于新技术，不是重写宪法条文。它与novel applications、specify novel rules处于同一层面。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>法官不应全盘接受加州论点。颠覆性的新技术有时要求以新方式适用宪法保护。法学教授Kerr把21世纪数字信息激增且易于获取，与20世纪汽车成为生活必需品相比较：当年法官须为汽车这个新的私人领域明确新规则；如今也必须厘清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<p>then与now构成历史类比：个人活动领域改变，法院就必须重新说明原有保护在新领域如何运作。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>New technology requires reinterpretation of the Constitution.</p>\n<p>引用Kerr的比较旨在说明新技术要求重新阐释宪法。</p>\n</blockquote>\n<p>reinterpretation在这里指解释宪法保护如何适用于新技术，不是重写宪法条文。它与novel applications、specify novel rules处于同一层面。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. California’s argument violates principles of the Constitution</h3>\n<blockquote>\n<p>引用Kerr的比较旨在说明加州论点违反宪法原则。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者反对全盘采纳加州论点，但Kerr的比较说明新技术需要新适用规则，并未直接判定加州论点违反宪法原则。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>引用Kerr的比较旨在说明加州论点违反宪法原则。</p>\n</blockquote>\n<p>本项<code>violates principles of the Constitution</code>判断加州论点与宪法原则相冲突，第7段先写<code>should not swallow California’s argument whole</code>，随后用克尔比较收在<code>sort out how the Fourth Amendment applies</code>上，因此连看段首与比较结尾。</p>\n<p>原文要求不全盘接受加州论点，并通过过去汽车需要新规则、现在数字信息需要明确适用方式的对应，提出<code>sort out how the Fourth Amendment applies</code>这一任务。本项<code>violates principles of the Constitution</code>却把比较结论写成加州论点违反宪法原则，将应当厘清新领域适用的要求转成论点与宪法原则相冲突的判断。这两种关系不同，不能从反对全盘采纳直接移到违反原则。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>法官不应全盘接受加州论点。颠覆性的新技术有时要求以新方式适用宪法保护。法学教授Kerr把21世纪数字信息激增且易于获取，与20世纪汽车成为生活必需品相比较：当年法官须为汽车这个新的私人领域明确新规则；如今也必须厘清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<p>段首先拒绝照单全收，随后提出新的适用任务，再用汽车与数字信息说明任务为什么必要。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>California’s argument violates principles of the Constitution.</p>\n<p>引用Kerr的比较旨在说明加州论点违反宪法原则。</p>\n</blockquote>\n<p>C需要比较最后落在加州论点违宪的判定上。实际比较的两端都是法院面对新个人领域的规则工作，不能把段首反对意见加强成这一额外裁定。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. principles of the Constitution should never be altered</h3>\n<blockquote>\n<p>引用Kerr的比较旨在说明宪法原则永远不应改变。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>宪法保护在两个时代持续适用，不代表作者提出所有原则永远不能改变的命题。D的never把范围扩出了本文讨论。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>引用Kerr的比较旨在说明宪法原则永远不应改变。</p>\n</blockquote>\n<p>本项<code>principles of the Constitution should never be altered</code>谈原则能否改变，第7段<code>novel applications of the Constitution’s protections</code>谈保护的适用，比较结尾<code>specify novel rules</code>又说明法官的任务，因此核对第2、3句所谈的对象和范围。</p>\n<p>原文<code>novel applications of the Constitution’s protections</code>与<code>specify novel rules</code>都在说明新技术领域需要明确适用方式。本项<code>principles of the Constitution should never be altered</code>则把结论改成原则永不可改，新增<code>never</code>所表达的不受时间与情形限制的要求。两种技术情形中如何应用保护，不等于对一切原则改变作出永久禁令。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>法官不应全盘接受加州论点。颠覆性的新技术有时要求以新方式适用宪法保护。法学教授Kerr把21世纪数字信息激增且易于获取，与20世纪汽车成为生活必需品相比较：当年法官须为汽车这个新的私人领域明确新规则；如今也必须厘清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<p>比较强调既有保护如何适应新领域，变化发生在解释与适用规则，文章没有评判一切宪法原则可否修改。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Principles of the Constitution should never be altered.</p>\n<p>引用Kerr的比较旨在说明宪法原则永远不应改变。</p>\n</blockquote>\n<p>D需要永久禁止原则改变的结论。实际只要求为汽车、数字信息明确规则，既不能由它推出永不可改，也不能把新解释误读为必须放弃全部原则。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>30题结论</h3>\n<blockquote>\n<p><strong>30. B</strong></p>\n</blockquote>\n<ul>\n<li>A：灵活实施与更新适用方式有联系，但A未保留比较两端共同的新技术前提。B将技术变化与重新解释保护规则直接相接，更完整地回答引用目的。</li>\n<li>B：汽车成为生活必需品时要明确新规则，数字信息普及时也要厘清第四修正案的适用。B保留了技术变化促使规则重新阐释的对应。</li>\n<li>C：作者反对全盘采纳加州论点，但Kerr的比较说明新技术需要新适用规则，并未直接判定加州论点违反宪法原则。</li>\n<li>D：宪法保护在两个时代持续适用，不代表作者提出所有原则永远不能改变的命题。D的never把范围扩出了本文讨论。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：核心问题的提出</strong>（段落1问题引入） 宪法对数字数据的保护程度？→ 最高法院将考虑：警察在逮捕期间是否可以无证搜查手机内容</p>\n<p>↓（争议双方立场）</p>\n<p><strong>逻辑层次2：加州的保守立场</strong>（段落2加州观点） 加州要求：避免全面性裁决（特别是颠覆&quot;逮捕时可搜查嫌疑人物品&quot;的旧假设）→ 理由：法官难以评估新技术的影响</p>\n<p>//（作者批判）</p>\n<p><strong>逻辑层次3：作者对加州立场的批判</strong>（段落3作者立场） 批判加州：遵循其建议是过分退让、反而忽视已显现的问题 → 技术影响已经清晰可辨 → 法院应该提供更新的指导方针</p>\n<p>↓（具体论证）</p>\n<p><strong>逻辑层次4：手机搜查的特殊性</strong>（段落4核心论证） 反驳加州的类比：【搜查手机≠翻查钱包（法院已允许无证搜查钱包）// 搜查手机=进入家中】→ 原因：手机包含（阅读历史+财务历史+医疗历史+通信记录）→ 云计算使探索更容易</p>\n<p>→（权利与现实）</p>\n<p><strong>逻辑层次5：数字时代的隐私权</strong>（段落5权利确认） 现实困境：（美国人应保护数字隐私 // 但在设备上保存敏感信息是生活必需）→ 核心权利：公民有权期待私人文件受宪法保护</p>\n<p>↓（实施挑战）</p>\n<p><strong>逻辑层次6：平衡执法与隐私的挑战</strong>（段落6实施细节） 原则vs实践：陈述原则≠解决划界难题 → 可行方案：【多数情况下获取搜查令并不繁重 + 紧急情况可例外 + 可采取措施防止数据被删除】→ 法院可能为警察留出一定自由空间</p>\n<p>↑（总结与类比）</p>\n<p><strong>逻辑层次7：技术变革需要宪法新解释</strong>（段落7历史类比） 核心观点：不应全盘接受加州论点 → 新技术需要宪法保护的新应用 → Kerr的类比：【20世纪：为汽车制定新规则 // 21世纪：为数字信息制定新规则】</p>\n<p>全文核心观点：面对数字技术带来的挑战，最高法院不应采取保守立场，而应认识到智能手机搜查的特殊性（类似进入家中而非翻查钱包），并为数字时代制定新的宪法保护规则。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Rules must adapt when technology creates a new personal domain</p>\n<p>B. The legal question and a request for judicial restraint</p>\n<p>C. Why a smartphone search resembles entering a home</p>\n<p>D. A complete ban on every urgent police measure</p>\n<p>E. The case for updated judicial guidance</p>\n<p>F. Protecting ordinary digital life while drawing practical limits</p>\n<p>G. Replacing all constitutional principles with technology</p>\n<p><strong>41.</strong></p>\n<p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest. California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest. It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n<p><strong>42.</strong></p>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n<p><strong>43.</strong></p>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence. The development of &quot;cloud computing&quot;, meanwhile, has made that exploration so much the easier.</p>\n<p><strong>44.</strong></p>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches. As so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<p><strong>45.</strong></p>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】B. The legal question and a request for judicial restraint</p>\n<blockquote>\n<p>法律问题与要求司法克制的主张</p>\n</blockquote>\n<p>先提出逮捕时能否无搜查令查看手机内容，再呈现California要求避免全面裁决的理由。</p>\n<blockquote>\n<p>Just how much does the Constitution protect your digital data?</p>\n</blockquote>\n<p>首句提出宪法保护数字资料的程度，随后收窄为逮捕时无搜查令查看手机内容的具体问题。</p>\n<blockquote>\n<p>California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest.</p>\n</blockquote>\n<p>加州要求refrain from a sweeping ruling，尤其不要推翻逮捕时可搜查随身物品的旧假设，形成对法院的克制要求。</p>\n<blockquote>\n<p>It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n</blockquote>\n<p>评估新技术困难是the state argues引出的州方理由。B同时覆盖待判问题与这项请求，没有将州方意见当成既成裁决。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>数字资料保护问题 → 无搜查令搜手机的具体争议 → 加州以技术不确定为由要求司法克制</p>\n</blockquote>\n<p>legal question对应whether police can search contents，restraint对应refrain from a sweeping ruling。</p>\n<p>再看最强干扰项D：A complete ban on every urgent police measure。</p>\n<p>只是呈现待判问题与州方主张，没有全面禁止紧急措施。</p>\n<p><strong>41题选B。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】E. The case for updated judicial guidance</p>\n<blockquote>\n<p>更新司法指引的理由</p>\n</blockquote>\n<p>作者用recklessly modest批评过度克制，再说技术影响已足够清楚，法院可以且应该更新指引。</p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice.</p>\n</blockquote>\n<p>recklessly modest把照办加州建议评为过分退让，作者并不接受继续保持旧规则的理由。</p>\n<blockquote>\n<p>Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n</blockquote>\n<p>discernable、obvious说明影响已足够清晰，so that把这一认识接到can and should更新指引。理由与主张一起支持E。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>批评因不确定而退让 → 影响已清晰可辨 → 法院能够且应该更新指引</p>\n</blockquote>\n<p>updated guidance直接对应updated guidelines，case for表示给出更新的理由而非继续拖延。</p>\n<p>再看最强干扰项G：Replacing all constitutional principles with technology。</p>\n<p>更新适用指引不等于替换宪法原则。</p>\n<p><strong>42题选E。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】C. Why a smartphone search resembles entering a home</p>\n<blockquote>\n<p>为何搜查手机类似进入住宅</p>\n</blockquote>\n<p>先拒绝手机等于钱包，再提出住宅类比，并用大量私人记录及云端可获取性支撑。</p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n<p>discarding先否定手机等同钱包的类比，标题不能把被反对的旧比较当结论。</p>\n<blockquote>\n<p>But exploring one&#39;s smartphone is more like entering his or her home.</p>\n</blockquote>\n<p>But引出作者认可的住宅类比，后面的阅读、财务、医疗及通信资料说明手机能暴露个人生活的广泛领域。</p>\n<blockquote>\n<p>The development of &quot;cloud computing&quot;, meanwhile, has made that exploration so much the easier.</p>\n</blockquote>\n<p>云计算进一步降低获取这些信息的难度，使住宅类比所强调的隐私深度更突出；本段不是讨论禁止所有警务措施。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>舍弃钱包类比 → 建立住宅类比 → 私人记录与易获取性解释隐私范围</p>\n</blockquote>\n<p>resembles entering a home保留作者赞成的类比，拒绝把手机缩减为钱包。</p>\n<p>再看最强干扰项D：A complete ban on every urgent police measure。</p>\n<p>本段解释搜索范围与隐私深度，不是概括警方所有紧急处置。</p>\n<p><strong>43题选C。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Protecting ordinary digital life while drawing practical limits</p>\n<blockquote>\n<p>保护日常数字生活并划定实际界限</p>\n</blockquote>\n<p>第五段从数字生活常态提出隐私期待，第六段讨论搜查令、紧急例外与保存数据的措施。</p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy.</p>\n</blockquote>\n<p>从个人应保护隐私起笔，But紧接着说明存储敏感资料又是生活需要，所以不能简单要求用户避开设备。</p>\n<blockquote>\n<p>As so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing.</p>\n</blockquote>\n<p>原则已说出却仍有line-drawing难题，话题转到一般搜查令、紧急情况和等待期间保护数据怎样划界。</p>\n<blockquote>\n<p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<p>保留特定警方自由使保护与执法需要并存。F的while正能接住权利原则与实际界限两层，不能用全部禁止来概括。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>数字生活必要性与隐私权 → 原则落实仍需划界 → 一般授权与特定例外共同考虑</p>\n</blockquote>\n<p>protecting ordinary digital life概括必要性和权利；practical limits概括一般授权与例外之间的划界。</p>\n<p>再看最强干扰项D：A complete ban on every urgent police measure。</p>\n<p>原文允许严重紧急情形下的措施，因此不能用全面禁令概括。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】A. Rules must adapt when technology creates a new personal domain</p>\n<blockquote>\n<p>技术产生新私人领域时规则须适应</p>\n</blockquote>\n<p>汽车普及与数字信息扩张作历史类比：过去为新私人领域定规则，如今也要明确新适用。</p>\n<blockquote>\n<p>But the justices should not swallow California&#39;s argument whole.</p>\n</blockquote>\n<p>不应全盘接受加州论点，承接前面对照旧处理的批评，接着需说明面对新技术应怎样做。</p>\n<blockquote>\n<p>New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections.</p>\n</blockquote>\n<p>novel applications是核心要求：保护原则进入新技术领域时，需要更新解释与适用。</p>\n<blockquote>\n<p>Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>then/now把汽车和数字资料相对，重复技术成为生活必需后法院必须定清规则的任务，说明技术变化为何带来新适用要求。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>拒绝照旧套用 → 新技术要求新适用 → 汽车与数字信息的历史类比</p>\n</blockquote>\n<p>adapt对应novel applications与novel rules，new personal domain保留技术变动是需要更新的原因。</p>\n<p>再看最强干扰项G：Replacing all constitutional principles with technology。</p>\n<p>保护原则仍在，改变的是面对新技术时如何适用。</p>\n<p><strong>45题选A。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Digital privacy presents a familiar constitutional question in an unfamiliar setting. A phone carried during an arrest may contain much more than the physical possessions traditionally searched by police. Courts must decide how protections against unreasonable searches apply to the information inside it.</p>\n<p><strong>B.</strong></p>\n<p>That expectation still leaves the practical task of drawing a line. In many situations police can obtain a warrant without excessive difficulty. Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.</p>\n<p><strong>C.</strong></p>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection. The history of the automobile offers a useful parallel: as cars became a necessity, courts had to define rules for a new personal domain. Digital information now calls for a comparable effort.</p>\n<p><strong>D.</strong></p>\n<p>Postponing guidance, however, may itself be reckless when enough of the implications are already clear. The most important implication concerns what a smartphone contains. Its collection of private records makes it necessary to test whether the old comparison with a wallet remains convincing.</p>\n<p><strong>E.</strong></p>\n<p>The wallet comparison becomes weak once the range of those records is considered. Reading, financial and medical histories, together with correspondence, can expose an extensive private life. Accessing this storehouse resembles entering a home more than simply examining a small physical container.</p>\n<p><strong>F.</strong></p>\n<p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly. California urged judicial restraint on this ground and appealed to earlier assumptions about searching a suspect’s possessions. That proposal treats uncertainty as a reason for postponing new guidance.</p>\n<p><strong>G.</strong></p>\n<p>Such a storehouse is increasingly part of ordinary life, not an exceptional choice made by a few careless users. People cannot always avoid keeping sensitive information on their devices. Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.</p>\n<p><strong>H.</strong></p>\n<p>The parallel identifies both continuity and change. Constitutional protection remains the starting point, while the rules that make it effective must respond to the new setting. Courts should therefore clarify how digital privacy is protected instead of assuming that older physical searches settle every modern question.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出数字信息搜查的规则问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明一般搜查令与紧急例外的边界</td>\n</tr>\n<tr>\n<td>C</td>\n<td>以汽车历史解释技术促使更新适用</td>\n</tr>\n<tr>\n<td>D</td>\n<td>反驳拖延并提出手机钱包类比问题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>以私人记录说明住宅类比更贴切</td>\n</tr>\n<tr>\n<td>F</td>\n<td>介绍以技术不确定为由的克制主张</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由数字生活常态推出保护期待</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结原则连续与规则适应并存</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出数字信息搜查的规则问题 → 介绍以技术不确定为由的克制主张 → 反驳拖延并提出手机钱包类比问题 → 以私人记录说明住宅类比更贴切 → 由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用 → 总结原则连续与规则适应并存</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Courts must decide how protections against unreasonable searches apply to the information inside it.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.</p>\n</blockquote>\n<p>A末句提出how protections apply，F的One proposed answer接这个适用问题，给出暂不作广泛新裁决的方案。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>California urged judicial restraint on this ground and appealed to earlier assumptions about searching a suspect’s possessions. That proposal treats uncertainty as a reason for postponing new guidance.</p>\n</blockquote>\n<p>F交代加州以技术变化过快为理由，并引旧的随身物品搜查规则；末句将方案概括成postponing new guidance。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Postponing guidance, however, may itself be reckless when enough of the implications are already clear.</p>\n</blockquote>\n<p>D开头复现Postponing guidance，再用however指出这种推迟也可能草率，承接的是F刚给出的方案。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出数字信息搜查的规则问题 → 介绍以技术不确定为由的克制主张 → 反驳拖延并提出手机钱包类比问题</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Such a storehouse is increasingly part of ordinary life, not an exceptional choice made by a few careless users.</p>\n</blockquote>\n<p>G的Such a storehouse需要前面先说明手机储存的大量私人资料，A还没有展开这一点；G也无法给D的Postponing guidance提供被反驳的主张。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>That proposal treats uncertainty as a reason for postponing new guidance.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Postponing guidance, however, may itself be reckless when enough of the implications are already clear.</p>\n</blockquote>\n<p>F以推迟新指引作结，D用同样的Postponing guidance接住，however转出作者的反对意见。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The most important implication concerns what a smartphone contains. Its collection of private records makes it necessary to test whether the old comparison with a wallet remains convincing.</p>\n</blockquote>\n<p>D从技术影响已清楚转到手机包含哪些私人记录，并提出旧钱包类比是否仍可信的检验问题。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The wallet comparison becomes weak once the range of those records is considered.</p>\n</blockquote>\n<p>E的The wallet comparison接D末句，those records又指向D刚提的private records，两个衔接对象都明确。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍以技术不确定为由的克制主张 → 反驳拖延并提出手机钱包类比问题 → 以私人记录说明住宅类比更贴切</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Such a storehouse is increasingly part of ordinary life, not an exceptional choice made by a few careless users.</p>\n</blockquote>\n<p>G只说信息库是日常生活一部分，既不回应推迟指引是否合适，也不先提出钱包比较；放这里会削弱E两个指代的对应。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Accessing this storehouse resembles entering a home more than simply examining a small physical container.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Such a storehouse is increasingly part of ordinary life, not an exceptional choice made by a few careless users.</p>\n</blockquote>\n<p>E称手机为storehouse并用住宅作比，G的Such a storehouse原样承接，转问使用者能否避免把资料放进去。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>People cannot always avoid keeping sensitive information on their devices. Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.</p>\n</blockquote>\n<p>不能总是避免存储敏感信息，因而参与数字生活不应自行取消受到宪法保护的期待。therefore把日常必要性接到权利。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>That expectation still leaves the practical task of drawing a line.</p>\n</blockquote>\n<p>B的That expectation指G末句的expectation of constitutional protection，随后才谈如何划定实际界限。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以私人记录说明住宅类比更贴切 → 由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection.</p>\n</blockquote>\n<p>C的that line要求前面已经提出界限，E尚在解释住宅类比。先接C既提前了划界结论，也无法为B的That expectation提供刚形成的保护期待。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Their participation in digital life therefore should not by itself remove their expectation of constitutional protection.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>That expectation still leaves the practical task of drawing a line.</p>\n</blockquote>\n<p>G提出保护期待，B的That expectation接住它；still说明承认权利后还有实际划界工作。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In many situations police can obtain a warrant without excessive difficulty. Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.</p>\n</blockquote>\n<p>一般可申请搜查令，严重紧急情况与防止数据灭失又可能要求即时措施，B具体展开保护与行动之间怎样留界限。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection.</p>\n</blockquote>\n<p>C的Finding that line指B所讨论的界限，再解释解决它需要更新既有保护的应用方式。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由数字生活常态推出保护期待 → 说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.</p>\n</blockquote>\n<p>F回到以技术太快为由推迟裁决的旧建议，不能展开B应承担的具体划界，也让C的that line缺少紧接的规则边界。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Urgent circumstances and the need to preserve data may justify particular measures, so protecting privacy need not mean prohibiting every immediate police response.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Finding that line requires a new application of an existing protection rather than abandoning the protection.</p>\n</blockquote>\n<p>B刚说明一般授权与紧急措施的边界，C用Finding that line承接，提出以新方式应用旧保护。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The history of the automobile offers a useful parallel: as cars became a necessity, courts had to define rules for a new personal domain. Digital information now calls for a comparable effort.</p>\n</blockquote>\n<p>汽车成为必需品时法院也曾面对新私人领域，数字信息现在要求comparable effort，这个parallel具体支持适应新技术的做法。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The parallel identifies both continuity and change.</p>\n</blockquote>\n<p>H的The parallel专指C刚建立的汽车与数字信息类比，再总结哪些保护持续、哪些规则要更新。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明一般搜查令与紧急例外的边界 → 以汽车历史解释技术促使更新适用 → 总结原则连续与规则适应并存</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One proposed answer is to avoid a broad new ruling because the technology is changing too quickly.</p>\n</blockquote>\n<p>F仅给出技术太快所以克制的建议，不包含两时代的类比；接F会使H的The parallel没有对应材料，并回到前面已经反驳的问题。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>digital privacy</strong></td>\n<td><strong>数字隐私</strong></td>\n<td><strong>社会现象类｜科技经济</strong></td>\n<td><strong>宏观主题</strong></td>\n
