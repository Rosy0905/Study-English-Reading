n<td>adj.紧迫的</td>\n</tr>\n<tr>\n<td>erase</td>\n<td>v.删除</td>\n<td>alter</td>\n<td>v.更改</td>\n<td>be entitled to</td>\n<td>有权享有</td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>disruptive</td>\n<td>adj.带来剧变的</td>\n<td>novel</td>\n<td>adj.新的</td>\n<td>applications</td>\n<td>n.适用方式</td>\n</tr>\n<tr>\n<td>explosion</td>\n<td>n.急剧增长</td>\n<td>accessibility</td>\n<td>n.可获取性</td>\n<td>establishment</td>\n<td>n.确立</td>\n</tr>\n<tr>\n<td>necessity</td>\n<td>n.必需品</td>\n<td>specify</td>\n<td>v.明确规定</td>\n<td>personal domain</td>\n<td>个人领域</td>\n</tr>\n<tr>\n<td>sort out</td>\n<td>厘清</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Just how much / does the Constitution protect / your digital data?</p>\n<p>The Supreme Court / will now consider / whether police can search / the contents of a mobile phone / without a warrant / if the phone is on or around a person / during an arrest.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>究竟多大程度上 / 宪法保护 / 你的数字数据？</p>\n<p>最高法院 / 现在将考虑 / 警察是否可以搜查 / 手机的内容 / 没有搜查令的情况下 / 如果手机在一个人身上或周围 / 在逮捕期间。</p>\n<h3>标准译文 · 第1段</h3>\n<p>宪法究竟在多大程度上保护你的数字数据？最高法院现在将考虑，在逮捕期间，如果手机在嫌疑人身上或周围，警察是否可以在没有搜查令的情况下搜查手机内容。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest. It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n<h3>意群划分 · 第2段</h3>\n<p>California has asked / the justices / to refrain from / a sweeping ruling, / particularly one / that upsets the old assumption / that authorities may search through / the possessions of suspects / at the time of their arrest.</p>\n<p>It is hard, / the state argues, / for judges / to assess the implications / of new and rapidly changing technologies.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>加利福尼亚州已经要求 / 法官们 / 避免做出 / 一个全面的裁决，/ 特别是一个 / 会颠覆旧有假设的 / 即当局可以搜查 / 嫌疑人的物品 / 在他们被逮捕时。</p>\n<p>很困难，/ 该州辩称，/ 对法官来说 / 评估影响 / 新的和快速变化的技术的。</p>\n<h3>标准译文 · 第2段</h3>\n<p>加利福尼亚州要求法官们避免做出全面性裁决，特别是那种会颠覆&quot;当局可以在逮捕时搜查嫌疑人物品&quot;这一旧有假设的裁决。该州辩称，法官很难评估新的、快速变化的技术所带来的影响。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n<h3>意群划分 · 第3段</h3>\n<p>The court / would be recklessly modest / if it followed / California&#39;s advice.</p>\n<p>Enough of the implications / are discernable, / even obvious, / so that the justices / can and should provide / updated guidelines / to police, lawyers and defendants.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>法院 / 将是鲁莽地谦虚 / 如果它遵循 / 加利福尼亚州的建议。</p>\n<p>足够多的影响 / 是可以辨别的，/ 甚至是明显的，/ 因此法官们 / 能够且应该提供 / 更新的指导方针 / 给警察、律师和被告。</p>\n<h3>标准译文 · 第3段</h3>\n<p>如果法院遵循加利福尼亚州的建议，那将是鲁莽的谦虚。技术带来的影响已经足够清晰，甚至显而易见，因此法官们能够也应该为警察、律师和被告提供更新的指导方针。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence. The development of &quot;cloud computing&quot;, meanwhile, has made that exploration so much the easier.</p>\n<h3>意群划分 · 第4段</h3>\n<p>They should start / by discarding / California&#39;s lame argument / that exploring the contents of a smartphone – / a vast storehouse of digital information – / is similar to, say, / going through a suspect&#39;s purse.</p>\n<p>The court has ruled / that police don&#39;t violate / the Fourth Amendment / when they go through / the wallet or pocketbook / of an arrestee / without a warrant.</p>\n<p>But exploring one&#39;s smartphone / is more like / entering his or her home.</p>\n<p>A smartphone may contain / an arrestee&#39;s reading history, / financial history, / medical history / and comprehensive records / of recent correspondence.</p>\n<p>The development of &quot;cloud computing&quot;, / meanwhile, / has made that exploration / so much the easier.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>他们应该开始 / 通过抛弃 / 加利福尼亚州的蹩脚论点 / 即探索智能手机的内容 – / 一个庞大的数字信息仓库 – / 类似于，比如说，/ 翻查嫌疑人的钱包。</p>\n<p>法院已经裁定 / 警察不违反 / 第四修正案 / 当他们翻查 / 钱包或手提包 / 被捕者的 / 没有搜查令的情况下。</p>\n<p>但探索某人的智能手机 / 更像是 / 进入他或她的家。</p>\n<p>智能手机可能包含 / 被捕者的阅读历史，/ 财务历史，/ 医疗历史 / 和全面的记录 / 最近通信的。</p>\n<p>&quot;云计算&quot;的发展，/ 与此同时，/ 已经使这种探索 / 变得容易得多。</p>\n<h3>标准译文 · 第4段</h3>\n<p>他们应该首先抛弃加利福尼亚州的蹩脚论点——即探索智能手机（一个庞大的数字信息仓库）的内容类似于翻查嫌疑人的钱包。法院已经裁定，警察在没有搜查令的情况下翻查被捕者的钱包或手提包不违反第四修正案。但探索某人的智能手机更像是进入他或她的家。智能手机可能包含被捕者的阅读历史、财务历史、医疗历史和最近通信的全面记录。与此同时，&quot;云计算&quot;的发展使这种探索变得容易得多。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.</p>\n<h3>意群划分 · 第5段</h3>\n<p>Americans should take steps / to protect / their digital privacy.</p>\n<p>But keeping sensitive information / on these devices / is increasingly a requirement / of normal life.</p>\n<p>Citizens still have a right / to expect / private documents to remain private / and protected / by the Constitution&#39;s prohibition / on unreasonable searches.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>美国人应该采取措施 / 来保护 / 他们的数字隐私。</p>\n<p>但保存敏感信息 / 在这些设备上 / 越来越成为一种要求 / 正常生活的。</p>\n<p>公民仍然有权利 / 期待 / 私人文件保持私密 / 并受到保护 / 通过宪法的禁止 / 对不合理搜查的。</p>\n<h3>标准译文 · 第5段</h3>\n<p>美国人应该采取措施保护他们的数字隐私。但在这些设备上保存敏感信息越来越成为正常生活的要求。公民仍然有权期待私人文件保持私密，并受到宪法对不合理搜查的禁止条款的保护。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>As so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<h3>意群划分 · 第6段</h3>\n<p>As so often is the case, / stating that principle / doesn&#39;t ease / the challenge of line-drawing.</p>\n<p>In many cases, / it would not be overly burdensome / for authorities / to obtain a warrant / to search through phone contents.</p>\n<p>They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure / that phone data are not erased or altered / while waiting for a warrant.</p>\n<p>The court, though, / may want to allow room / for police / to cite situations / where they are entitled / to more freedom.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>正如经常发生的情况，/ 陈述那个原则 / 并不能缓解 / 划界的挑战。</p>\n<p>在许多情况下，/ 不会过于繁重 / 对当局来说 / 获得搜查令 / 来搜查手机内容。</p>\n<p>他们仍然可以使无效 / 第四修正案保护 / 当面临严重、紧急情况时，/ 并且他们可以采取合理措施 / 来确保 / 手机数据不被删除或更改 / 在等待搜查令期间。</p>\n<p>法院，然而，/ 可能想要留出空间 / 给警察 / 来引用情况 / 在那里他们有权 / 获得更多自由。</p>\n<h3>标准译文 · 第6段</h3>\n<p>正如经常发生的情况，陈述原则并不能缓解划定界限的挑战。在许多情况下，当局获得搜查手机内容的搜查令并不会过于繁重。在面临严重、紧急情况时，他们仍然可以使第四修正案的保护无效，并且可以采取合理措施确保在等待搜查令期间手机数据不被删除或更改。然而，法院可能想要为警察留出空间，让他们能够引用有权获得更多自由的情况。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>But the justices should not swallow California&#39;s argument whole. New, disruptive technology sometimes demands novel applications of the Constitution&#39;s protections. Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<h3>意群划分 · 第7段</h3>\n<p>But the justices / should not swallow / California&#39;s argument whole.</p>\n<p>New, disruptive technology / sometimes demands / novel applications / of the Constitution&#39;s protections.</p>\n<p>Orin Kerr, / a law professor, / compares / the explosion and accessibility / of digital information / in the 21st century / with the establishment / of automobile use / as a virtual necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment applies / to digital information now.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>但法官们 / 不应该全盘接受 / 加利福尼亚州的论点。</p>\n<p>新的、颠覆性的技术 / 有时需要 / 新颖的应用 / 宪法保护的。</p>\n<p>奥林·克尔，/ 一位法学教授，/ 比较 / 爆炸式增长和可获取性 / 数字信息的 / 在21世纪 / 与确立 / 汽车使用 / 作为生活的实际必需品 / 在20世纪：/ 法官们必须制定 / 新颖的规则 / 为新的个人领域 / 乘用车的当时；/ 他们必须理清 / 第四修正案如何适用 / 于数字信息现在。</p>\n<h3>标准译文 · 第7段</h3>\n<p>但法官们不应该全盘接受加利福尼亚州的论点。新的、颠覆性的技术有时需要对宪法保护进行新颖的应用。法学教授奥林·克尔将21世纪数字信息的爆炸式增长和可获取性与20世纪汽车使用成为生活实际必需品的确立进行了比较：当时法官们必须为乘用车这一新的个人领域制定新颖的规则；现在他们必须理清第四修正案如何适用于数字信息。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Just how much → does the Constitution protect → your digital data?</p>\n<p>The Supreme Court → will now consider：(whether police can search → the contents of a mobile phone：(without a warrant)：(if the phone is on or around a person：(during an arrest))).</p>\n<p><strong>第2段</strong></p>\n<p>California has asked → the justices → to refrain from → a sweeping ruling：(particularly one：(that upsets the old assumption：(that authorities may search through → the possessions of suspects：(at the time of their arrest)))).</p>\n<p>It is hard：(the state argues) → for judges → to assess the implications：(of new and rapidly changing technologies).</p>\n<p><strong>第3段</strong></p>\n<p>The court → would be recklessly modest：(if it followed → California&#39;s advice).</p>\n<p>Enough of the implications → are discernable + even obvious → so that the justices → can and should provide → updated guidelines：(to police + lawyers + defendants).</p>\n<p><strong>第4段</strong></p>\n<p>They should start：(by discarding → California&#39;s lame argument：(that exploring the contents of a smartphone：(a vast storehouse of digital information) → is similar to：(going through a suspect&#39;s purse))).</p>\n<p>The court has ruled：(that police don&#39;t violate → the Fourth Amendment：(when they go through → the wallet or pocketbook：(of an arrestee)：(without a warrant))).</p>\n<p>But exploring one&#39;s smartphone → is more like → entering his or her home.</p>\n<p>A smartphone may contain：(an arrestee&#39;s reading history + financial history + medical history + comprehensive records：(of recent correspondence)).</p>\n<p>The development of &quot;cloud computing&quot;：(meanwhile) → has made that exploration → so much the easier.</p>\n<p><strong>第5段</strong></p>\n<p>Americans should take steps → to protect → their digital privacy.</p>\n<p>But keeping sensitive information：(on these devices) → is increasingly a requirement：(of normal life).</p>\n<p>Citizens still have a right → to expect：(private documents to remain private + protected：(by the Constitution&#39;s prohibition：(on unreasonable searches))).</p>\n<p><strong>第6段</strong></p>\n<p>As so often is the case → stating that principle → doesn&#39;t ease → the challenge of line-drawing.</p>\n<p>In many cases → it would not be overly burdensome：(for authorities) → to obtain a warrant：(to search through phone contents).</p>\n<p>They could still invalidate → Fourth Amendment protections：(when facing severe, urgent circumstances) + they could take reasonable measures → to ensure：(that phone data are not erased or altered：(while waiting for a warrant)).</p>\n<p>The court：(though) → may want to allow room：(for police) → to cite situations：(where they are entitled → to more freedom).</p>\n<p><strong>第7段</strong></p>\n<p>But the justices → should not swallow → California&#39;s argument whole.</p>\n<p>New, disruptive technology → sometimes demands → novel applications：(of the Constitution&#39;s protections).</p>\n<p>Orin Kerr：(a law professor) → compares → the explosion and accessibility：(of digital information：(in the 21st century)) → with the establishment：(of automobile use：(as a virtual necessity of life：(in the 20th)))：The justices had to specify → novel rules：(for the new personal domain：(of the passenger car then)); they must sort out → how the Fourth Amendment applies：(to digital information now).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>究竟多大程度上 → 宪法保护 → 你的数字数据？</p>\n<p>最高法院 → 现在将考虑：(警察是否可以搜查 → 手机的内容：(没有搜查令的情况下)：(如果手机在一个人身上或周围：(在逮捕期间)))。</p>\n<p><strong>第2段</strong></p>\n<p>加利福尼亚州已经要求 → 法官们 → 避免做出 → 一个全面的裁决：(特别是一个：(会颠覆旧有假设的：(即当局可以搜查 → 嫌疑人的物品：(在他们被逮捕时))))。</p>\n<p>很困难：(该州辩称) → 对法官来说 → 评估影响：(新的和快速变化的技术的)。</p>\n<p><strong>第3段</strong></p>\n<p>法院 → 将是鲁莽地谦虚：(如果它遵循 → 加利福尼亚州的建议)。</p>\n<p>足够多的影响 → 是可以辨别的 + 甚至是明显的 → 因此法官们 → 能够且应该提供 → 更新的指导方针：(给警察 + 律师 + 被告)。</p>\n<p><strong>第4段</strong></p>\n<p>他们应该开始：(通过抛弃 → 加利福尼亚州的蹩脚论点：(即探索智能手机的内容：(一个庞大的数字信息仓库) → 类似于：(翻查嫌疑人的钱包)))。</p>\n<p>法院已经裁定：(警察不违反 → 第四修正案：(当他们翻查 → 钱包或手提包：(被捕者的)：(没有搜查令的情况下)))。</p>\n<p>但探索某人的智能手机 → 更像是 → 进入他或她的家。</p>\n<p>智能手机可能包含：(被捕者的阅读历史 + 财务历史 + 医疗历史 + 全面的记录：(最近通信的))。</p>\n<p>&quot;云计算&quot;的发展：(与此同时) → 已经使这种探索 → 变得容易得多。</p>\n<p><strong>第5段</strong></p>\n<p>美国人应该采取措施 → 来保护 → 他们的数字隐私。</p>\n<p>但保存敏感信息：(在这些设备上) → 越来越成为一种要求：(正常生活的)。</p>\n<p>公民仍然有权利 → 期待：(私人文件保持私密 + 受到保护：(通过宪法的禁止：(对不合理搜查的)))。</p>\n<p><strong>第6段</strong></p>\n<p>正如经常发生的情况 → 陈述那个原则 → 并不能缓解 → 划界的挑战。</p>\n<p>在许多情况下 → 不会过于繁重：(对当局来说) → 获得搜查令：(来搜查手机内容)。</p>\n<p>他们仍然可以使无效 → 第四修正案保护：(当面临严重、紧急情况时) + 他们可以采取合理措施 → 来确保：(手机数据不被删除或更改：(在等待搜查令期间))。</p>\n<p>法院：(然而) → 可能想要留出空间：(给警察) → 来引用情况：(在那里他们有权 → 获得更多自由)。</p>\n<p><strong>第7段</strong></p>\n<p>但法官们 → 不应该全盘接受 → 加利福尼亚州的论点。</p>\n<p>新的、颠覆性的技术 → 有时需要 → 新颖的应用：(宪法保护的)。</p>\n<p>奥林·克尔：(一位法学教授) → 比较 → 爆炸式增长和可获取性：(数字信息的：(在21世纪)) → 与确立：(汽车使用：(作为生活的实际必需品：(在20世纪)))：法官们必须制定 → 新颖的规则：(为新的个人领域：(乘用车的当时))；他们必须理清 → 第四修正案如何适用：(于数字信息现在)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第2段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>California has asked / the justices / to refrain from / a sweeping ruling, / particularly one / that upsets the old assumption / that authorities may search through / the possessions of suspects / at the time of their arrest.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>加利福尼亚州已经要求 / 法官们 / 避免做出 / 一个全面的裁决，/ 特别是一个 / 会颠覆旧有假设的 / 即当局可以搜查 / 嫌疑人的物品 / 在他们被逮捕时。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把particularly后面限定为其中尤其应避免的一种裁决；再展开that所指旧假定。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>加利福尼亚州已经要求  法官们  避免做出  一个全面的裁决， 特别是一个  会颠覆旧有假设的  即当局可以搜查  嫌疑人的物品  在他们被逮捕时。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>加州要求大法官避免作出全面裁决。</p>\n</blockquote>\n<p>先写要求避免裁决，再具体说明哪一种，最后解释逮捕时搜查财物的旧规则。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>加利福尼亚州要求法官们避免做出全面性裁决，特别是那种会颠覆&quot;当局可以在逮捕时搜查嫌疑人物品&quot;这一旧有假设的裁决。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>这是州方请求而非作者态度；may search是被允许搜查。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>加利福尼亚州要求法官们避免做出全面性裁决，特别是那种会颠覆&quot;当局可以在逮捕时搜查嫌疑人物品&quot;这一旧有假设的裁决。</p>\n</blockquote>\n<h2>2. 第6段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure / that phone data are not erased or altered / while waiting for a warrant.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们仍然可以使无效 / 第四修正案保护 / 当面临严重、紧急情况时，/ 并且他们可以采取合理措施 / 来确保 / 手机数据不被删除或更改 / 在等待搜查令期间。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把and连接的两项措施分开译；第二项里的while是等待搜查令期间。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>他们仍然可以使无效  第四修正案保护  当面临严重、紧急情况时， 并且他们可以采取合理措施  来确保  手机数据不被删除或更改  在等待搜查令期间。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>警方仍可在紧急情形采取措施并保全数据。</p>\n</blockquote>\n<p>先交代严重紧急情形，再说等待许可期间保全数据的合理措施。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>在面临严重、紧急情况时，他们仍然可以使第四修正案的保护无效，并且可以采取合理措施确保在等待搜查令期间手机数据不被删除或更改。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>reasonable与severe, urgent都限制措施的范围，不能译成普遍不需授权。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>在面临严重、紧急情况时，他们仍然可以使第四修正案的保护无效，并且可以采取合理措施确保在等待搜查令期间手机数据不被删除或更改。</p>\n</blockquote>\n<h2>3. 第7段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Orin Kerr, / a law professor, / compares / the explosion and accessibility / of digital information / in the 21st century / with the establishment / of automobile use / as a virtual necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment applies / to digital information now.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>奥林·克尔，/ 一位法学教授，/ 比较 / 爆炸式增长和可获取性 / 数字信息的 / 在21世纪 / 与确立 / 汽车使用 / 作为生活的实际必需品 / 在20世纪：/ 法官们必须制定 / 新颖的规则 / 为新的个人领域 / 乘用车的当时；/ 他们必须理清 / 第四修正案如何适用 / 于数字信息现在。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先合并学者身份与compare A with B，再把冒号后then/now对照连接到类比的用途。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>奥林·克尔， 一位法学教授， 比较  爆炸式增长和可获取性  数字信息的  在21世纪  与确立  汽车使用  作为生活的实际必需品  在20世纪： 法官们必须制定  新颖的规则  为新的个人领域  乘用车的当时； 他们必须理清  第四修正案如何适用  于数字信息现在。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>Kerr把数字信息扩张比作汽车成为生活必需品。</p>\n</blockquote>\n<p>先说比较两种技术发展，再说明过去与现在各需要明确什么规则。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>法学教授奥林·克尔将21世纪数字信息的爆炸式增长和可获取性与20世纪汽车使用成为生活实际必需品的确立进行了比较：当时法官们必须为乘用车这一新的个人领域制定新颖的规则；现在他们必须理清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>novel rules强调新适用规则，不等于取消宪法保护原则。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>法学教授奥林·克尔将21世纪数字信息的爆炸式增长和可获取性与20世纪汽车使用成为生活实际必需品的确立进行了比较：当时法官们必须为乘用车这一新的个人领域制定新颖的规则；现在他们必须理清第四修正案如何适用于数字信息。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>26题</h2>\n<blockquote>\n<p>The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.</p>\n<p>最高法院将裁定，在逮捕过程中，做什么是否合法？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：法院还将考虑这个问题，题目要求复述待裁定的行为、对象与条件，并非提前宣布裁定结果。</p>\n<p>The Supreme Court与during an arrest都出现在第1段。先完整读这一段，分清宪法保护的总问题与法院即将考虑的具体情形。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<h3>A. search for suspects’ mobile phones without a warrant</h3>\n<blockquote>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>search the contents</code>是搜查手机内部数据，A的<code>search for ... phones</code>是寻找手机本身。原文已把手机在身上或身边作为条件，法院要审查的并非寻找物件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p>本项<code>search for suspects’ mobile phones</code>说寻找手机；第1段第2句<code>search the contents of a mobile phone</code>写警察的搜查，回到该句核对搜查对象。</p>\n<p>原文<code>search the contents of a mobile phone</code>是搜查手机里面的内容，手机在某人身上或身边已经作为条件给出。本项<code>search for suspects’ mobile phones</code>则是寻找手机本身，虽然保留没有搜查令的条件，却更换了法院要审查的行为和对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<p>最高法院现在将考虑：逮捕时，如果手机在某人身上或身边，警察可否在没有搜查令的情况下搜查其中内容。</p>\n</blockquote>\n<p>首句提出数据保护范围，第二句将问题具体化为逮捕时能否无搜查令查看手机内容。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Supreme Court will decide whether it is legitimate, during an arrest, to search for suspects&#39; mobile phones without a warrant.</p>\n<p>法院将裁定：逮捕时，无搜查令寻找嫌疑人手机是否合法。</p>\n</blockquote>\n<p>A需要法院审查寻找手机的合法性。手机在哪里与手机里有什么是两种对象，保留without a warrant仍不能补回被换掉的contents。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. check suspects’ phone contents without being authorized</h3>\n<blockquote>\n<p>法院将裁定：逮捕时，未经授权查看嫌疑人手机内容是否合法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、D，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>B同时保留逮捕场景、查看手机内容和未取得授权三个条件，正对应首段法院即将考虑的问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>法院将裁定：逮捕时，未经授权查看嫌疑人手机内容是否合法。</p>\n</blockquote>\n<p>原文搜查手机内容，并用<code>without a warrant</code>指出没有搜查令。本项仍然查看手机内容，用<code>without being authorized</code>表示未获授权，可以接上没有取得搜查令的情形；它保持了行为对象及其许可问题。</p>\n<p>本项<code>check suspects’ phone contents</code>与第1段<code>search the contents of a mobile phone</code>都指查看手机内容，<code>without being authorized</code>对应同句<code>without a warrant</code>这一许可条件，因此回看第2句。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<p>最高法院现在将考虑：逮捕时，如果手机在某人身上或身边，警察可否在没有搜查令的情况下搜查其中内容。</p>\n</blockquote>\n<p>法院尚未给出答案，作者用whether提出要裁定的事项；contents与without a warrant界定这项裁定的范围。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Supreme Court will decide whether it is legitimate, during an arrest, to check suspects&#39; phone contents without being authorized.</p>\n<p>法院将裁定：逮捕时，未经授权查看嫌疑人手机内容是否合法。</p>\n</blockquote>\n<p>B中的check contents对应search contents，未获授权在这里对应没有取得搜查令。正确的是它复述了待裁定的问题，不能据此宣称法院已认定这种搜查合法。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. prevent suspects from deleting their phone contents</h3>\n<blockquote>\n<p>法院将裁定：逮捕时，阻止嫌疑人删除手机内容是否合法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>阻止删除数据是限制嫌疑人的操作，查看内容是警方读取数据。C把法院要审查的行为改了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>法院将裁定：逮捕时，阻止嫌疑人删除手机内容是否合法。</p>\n</blockquote>\n<p>本项<code>prevent suspects from deleting</code>谈如何处理手机内容，第1段<code>police can search the contents</code>明确写出法院要考虑的行为，所以回看第 >\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者用lame批评论点，又明确要求discarding。容忍意味着仍可接受或容许其存在，这里给出的却是弃用要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p><code>tolerance</code>要从作者是否接受或容让该论点来判断。第3段的<code>recklessly modest</code>不是赞扬谦虚，而是说法院照办就会退让得不负责任；紧接着can and should要求法院更新指引。</p>\n<p>第4段又用<code>lame argument</code>批评论证薄弱，并明确写<code>should start by discarding</code>，要求首先弃用它。评价与处理意见都是否定方向。</p>\n<p>因此不能把作者对执法边界的细致讨论，移成对加州论点的容忍。题干限定的是这项论点，而作者已经说清不应采纳它。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n<p>法院若遵循加州建议，就会退让得过于草率。技术的许多影响已经可辨识，甚至显而易见，因此法官能够也应该为警方、律师和被告更新指引。首先应舍弃加州那个站不住脚的论点：查看智能手机——一座庞大的数字信息库——类似于翻查嫌疑人的钱包。</p>\n</blockquote>\n<p>作者先批评法院若照办就是过分退让，再提出更新指引，接着指定首先要舍弃的钱包类比。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author shows tolerance toward California’s argument.</p>\n<p>作者对加州论点的态度是宽容。</p>\n</blockquote>\n<p>A需要在承认问题后仍表达接受或容让。原段没有这一转向，而是沿着批评继续要求弃用，不能把不采纳说成宽容。</p>\n<p><strong>复盘判断：A错误。</strong></ ckquote>\n<p>B若成立，作者应不在意是否采纳该论点。这里的依据不只是谈了许多，而是should与discarding直接表达必须行动、拒绝采纳。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. disapproval</h3>\n<blockquote>\n<p>作者对加州论点的态度是不赞成。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>discarding表示舍弃，lame评价论点站不住脚。二者共同支持disapproval的不赞成。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对加州论点的态度是不赞成。</p>\n</blockquote>\n<p>本项<code>disapproval</code>表示不赞成，第4段第1句<code>should start by discarding</code>要求法院弃用加州论点，直接涉及对它的态度，所以回看这一句。</p>\n<p>原文<code>should start by discarding</code>要求先抛弃加州的论点，表达反对采纳。本项<code>disapproval</code>概括为不赞成，正好保持这种态度方向。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The court would be recklessly modest if it followed California&#39;s advice. Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\nThey should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse.</p>\n<p>法院若遵循加州建议，就会退让得过于草率。技术的许多影响已经可辨识，甚至显而易见，因此法官能够也应该为警方、律师和被告更新指引。首先应舍弃加州那个站不住脚的论点：查看智能手机——一座庞大的数字信息库——类似于翻查嫌疑人的钱包。</p>\n</blockquote>\n<p>作者先指出技术影响已可辨识，再否定手机等同钱包的论证，随后以住宅类比说明为何不能照旧处理。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author shows disapproval toward California’s argument.</p>\n<p>作者对加州论点的态度是不赞成。</ ough a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为查看手机内容可比作进入某人的住所。</p>\n</blockquote>\n<p>本项<code>getting into one’s residence</code>与第4段第3句<code>entering his or her home</code>都表示进入个人住所，因此回看作者使用<code>more like</code>的这句比较。</p>\n<p>原文把查看手机比作<code>entering his or her home</code>，动作是进入，地点是个人住宅。本项<code>getting into one’s residence</code>同样表示进入住所，保持了动作、地点以及它与查看手机之间的比较关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n<p>首先应舍弃加州那个站不住脚的论点：查看智能手机内容类似于翻查嫌疑人的钱包。法院已裁定，无搜查令翻查被捕者的钱包或手提包并不违反第四修正案。但查看智能手机更像进入一个人的家，其中可能有阅读、财务、医疗历史以及近期通信的完整记录。</p>\n</blockquote>\n<p>作者先否定钱包类比，再以But转入住宅类比，随后列举手机包含的私人记录解释这种比较。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Exploring phone contents is comparable to getting into one’s residence.</p>\n<p>作者认为查看手机内容可比作进入某人的住所。</p>\n</blockquote>\n<p>A没有新增行为或偷换资料种类，既对应明确的more like句，也能与后面的私人资料范围衔接。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. handling one’s historical records</h3>\n<blockquote>\n<p>作者认为查看手机内容可比作处理某人的历史记录。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>阅读、财务和医疗记录用来说明手机包含什么。B把处理这些记录写成作者另作的类比，改变了这组材料的作用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为查看手机内容可比作处理某人的历史记录。</p>\n</blockquote>\n<p>题干的<code>comparable to</code>要求找到作者比较的两端。第4段先明确说手机搜查<code>more like entering ... home</code>，比较关系已经完整：查看手机内容像进入住宅。</p>\n<p>下一句的<code>may contain</code>换成包含关系，reading history、financial history、medical history列出手机资料的范围。这些例子解释手机为什么不像一个小钱包，为什么会暴露整个私人生活。</p>\n<p>B把historical records取出来，又加上handling动作接到comparable to。手机确实包含记录，却没有因此另建立“查看手机像处理记录”的比较；包含什么与作者拿什么来比不能互换。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n<p>首先应舍弃加州那个站不住脚的论点：查看智能手机内容类似于翻查嫌疑人的钱包。法院已裁定，无搜查令翻查被捕者的钱包或手提包并不违反第四修正案。但查看智能手机更像进入一个人的家，其中可能有阅读、财务、医疗历史以及近期通信的完整记录。</p>\n</blockquote>\n<p>住宅类比先出现，私人记录随后列出，解释为什么搜查手机会深入个人生活；不是记录处理与手机搜查的二次类比。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Exploring phone contents is comparable to handling one’s historical records.</p>\n<p>作者认为查看手机内容可比作处理某人的历史记录。</p>\n</blockquote>\n<p>B需要comparable to把两种行为明确相接。实际may contain只建立手机与所存资料的包含关系，不能从有历史记录补出处理记录的比较。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. scanning one’s correspondences</h3>\n<blockquote>\n<p>作者认为查看手机内容可比作浏览某人的通信。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>通信记录是手机私人资料中的一种，作者用它支撑住宅类比。C把这一局部内容当成比较的另一端。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为查看手机内容可比作浏览某人的通信。</p>\n</blockquote>\n<p>本项<code>scanning one’s correspondences</code>的通信对应第4段第4句<code>records of recent correspondence</code>，该句列举手机内容；前一句<code>more like entering his or her home</code>明确作比较，因而合看两句。</p>\n<p>原文把<code>records of recent correspondence</code>与阅读、财务、医疗记录并列，说明手机可能保存的私人资料。本项<code>scanning one’s correspondences</code>把其中一种资料转成浏览通信的动作，再把它用作作者对查看手机的比喻。题干查的是作者怎样比较行为，而原句中的通信承担列举资料的作用，这个连接被改写了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n<p>首先应舍弃加州那个站不住脚的论点：查看智能手机内容类似于翻查嫌疑人的钱包。法院已裁定，无搜查令翻查被捕者的钱包或手提包并不违反第四修正案。但查看智能手机更像进入一个人的家，其中可能有阅读、财务、医疗历史以及近期通信的完整记录。</p>\n</blockquote>\n<p>作者并列阅读、财务、医疗、通信记录，累积说明信息的广度与私密性，明确的more like仍指向home。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Exploring phone contents is comparable to scanning one’s correspondences.</p>\n<p>作者认为查看手机内容可比作浏览某人的通信。</p>\n</blockquote>\n<p>浏览手机确实可能涉及通信，但题干问作者用什么作比较。列举某种内容不等于把整个搜查行为比作只浏览通信。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. going through one’s wallet</h3>\n<blockquote>\n<p>作者认为查看手机内容可比作翻查某人的钱包。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>钱包类比属于加州被作者否定的论点；作者用But另提出进入住宅。D把所反对的比较当成所赞成的比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为查看手机内容可比作翻查某人的钱包。</p>\n</blockquote>\n<p>本项<code>going through one’s wallet</code>对应第4段第2句<code>go through the wallet</code>，那里写法院的已有裁定；下一句<code>But exploring one’s smartphone</code>作转折，所以连看这两句和段首对相似论点的处理。</p>\n<p>原文要求弃用把查看手机比作翻手提包的论点，随后交代翻钱包的已有裁定，再用<code>But exploring one’s smartphone</code>把手机搜查转向进入住宅的比较。本项<code>going through one’s wallet</code>把钱包句中的旧裁定接成作者的手机比喻，反而合并了作者用<code>But</code>分开的情形。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>They should start by discarding California&#39;s lame argument that exploring the contents of a smartphone – a vast storehouse of digital information – is similar to, say, going through a suspect&#39;s purse. The court has ruled that police don&#39;t violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant. But exploring one&#39;s smartphone is more like entering his or her home. A smartphone may contain an arrestee&#39;s reading history, financial history, medical history and comprehensive records of recent correspondence.</p>\n<p>首先应舍弃加州那个站不住脚的论点：查看智能手机内容类似于翻查嫌疑人的钱包。法院已裁定，无搜查令翻查被捕者的钱包或手提包并不违反第四修正案。但查看智能手机更像进入一个人的家，其中可能有阅读、财务、医疗历史以及近期通信的完整记录。</p>\n</blockquote>\n<p>先说弃用手机等同手提包的论点，再介绍搜钱包的既有裁定，But随后说明手机应当另作考虑。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Exploring phone contents is comparable to going through one’s wallet.</p>\n<p>作者认为查看手机内容可比作翻查某人的钱包。</p>\n</blockquote>\n<p>D需要把钱包规则直接延伸到手机。实际But将两种情形分开，因此不能只看wallet出现就跳过它属于被区别的旧情形。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>28题结论</h3>\n<blockquote>\n<p><strong>28. A</strong></p>\n</blockquote>\n<ul>\n<li>A：getting into与entering对应，residence与home对应。A完整保留作者把查看手机比作进入私人住所的关系。</li>\n<li>B：阅读、财务和医疗记录用来说明手机包含什么。B把处理这些记录写成作者另作的类比，改变了这组材料的作用。</li>\n<li>C：通信记录是手机私人资料中的一种，作者用它支撑住宅类比。C把这一局部内容当成比较的另一端。</li>\n<li>D：钱包类比属于加州被作者否定的论点；作者用But另提出进入住宅。D把所反对的比较当成所赞成的比较。</li>\n</ul>\n<h2>29题</h2>\n<blockquote>\n<p>In Paragraphs 5 and 6, the author shows his concern that  ______.</p>\n<p>在第5、6段，作者对什么问题表示关切？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：将第5段隐私权利与第6段具体划界连起来，找作者共同关切的保护问题。</p>\n<p>题干直接指定Paragraphs 5 and 6，先完整读第5段，再完整读第6段，留意隐私保护原则与随后划界问题怎样相接。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Citizens still have a right to expect private documents to remain private</p>\n<p>stating that principle doesn’t ease the challenge of line-drawing.</p>\n<p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<h3>A. principles are hard to be clearly expressed</h3>\n<blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第5段已清楚说出隐私保护权利，第6段说表达原则仍不能解决划界。难点在适用范围，A却改成原则表达不清。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p>本项<code>principles are hard to be clearly expressed</code>说表述原则困难，第6段第1句<code>stating that principle doesn’t ease the challenge of line-drawing</code>同时出现原则和困难，因此回看该句并连接第5段已提出的隐私权。</p>\n<p>原文<code>stating that principle doesn’t ease the challenge of line-drawing</code>说原则提出之后，划定界限仍然困难。第5段已经表达私人文件应保持私密的权利。本项<code>principles are hard to be clearly expressed</code>却把难处放在原则本身说不清楚，移动了困难所指向的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<p>美国人应采取措施保护数字隐私，但在设备上保存敏感信息越来越成为正常生活需要。公民仍有权期待私人文件保持私密，并受宪法禁止不合理搜查的规定保护。</p>\n<p>一如常见情况，宣布原则并不能消除划界难题。许多情形下，警方申请搜查令并不过分繁重；面对严重紧急情况仍可突破第四修正案的保护，也可在等待搜查令时采取合理措施防止数据删除或修改。不过，法院可能希望为警方列举可享有更多自由的情况留出空间。</p>\n</blockquote>\n<p>先提出private documents应受保护，再转向stating that principle doesn’t ease...，承认原则与解决实际操作被分为两层。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is concerned that principles are hard to be clearly expressed.</p>\n<p>作者关切的是原则很难被清楚表达。</p>\n</blockquote>\n<p>A需要原则难以被清楚说出。原文恰能说出原则，却仍需决定何时取得搜查令、何时存在例外；不能把实施难题搬到语言表述上。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. the court is giving police less room for action</h3>\n<blockquote>\n<p>作者关切的是法院正给予警方更少行动空间。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说法院可能为警察在某些情形下保留更多自由，B变成法院正在减少行动余地，方向和确定程度都改变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者关切的是法院正给予警方更少行动空间。</p>\n</blockquote>\n<p>本项<code>giving police less room for action</code>谈法院给予警方的空间，第6段末句<code>may want to allow room for police</code>写同一关系，并以<code>more freedom</code>说明空间方向，因此回看该句。</p>\n<p>原文<code>may want to allow room for police</code>说法院可能想留出余地，让警方列举享有更多自由的情形。本项<code>giving police less room for action</code>写成法院正在减少行动空间，既把可能的做法改成了正在发生，也将更多自由的方向改为更少空间。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<p>美国人应采取措施保护数字隐私，但在设备上保存敏感信息越来越成为正常生活需要。公民仍有权期待私人文件保持私密，并受宪法禁止不合理搜查的规定保护。</p>\n<p>一如常见情况，宣布原则并不能消除划界难题。许多情形下，警方申请搜查令并不过分繁重；面对严重紧急情况仍可突破第四修正案的保护，也可在等待搜查令时采取合理措施防止数据删除或修改。不过，法院可能希望为警方列举可享有更多自由的情况留出空间。</p>\n</blockquote>\n<p>作者列出通常取得搜查令、紧急情形与数据保全，末句以though提醒可能给予警方额外空间。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is concerned that the court is giving police less room for action.</p>\n<p>作者关切的是法院正给予警方更少行动空间。</p>\n</blockquote>\n<p>B需要正在收紧警方行动的事实。may want与more freedom所说的可能做法不支持is giving ... less，不能以作者重视隐私替代句中实际方向。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. phones are used to store sensitive information</h3>\n<blockquote>\n<p>作者关切的是手机被用来存储敏感信息。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>保存敏感信息越来越是正常生活需要，作者据此主张它仍应受保护。C只复述这一生活事实，没有说出两段关切的保护效果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution&#39;s prohibition on unreasonable searches.\nAs so often is the case, stating that principle doesn&#39;t ease the challenge of line-drawing. In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者关切的是手机被用来存储敏感信息。</p>\n</blockquote>\n<p>保存敏感信息越来越是正常生活需要，作者据此主张它仍应受保护。C只复述这一生活
