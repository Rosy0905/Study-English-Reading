<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 26题题干\n\n**The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.**\n\n> 最高法院将裁定，在逮捕过程中，做什么是否合法？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,190,1195,38],[281,255,31,26]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"},"html":"<h2>26题题干</h2>\n<p><strong>The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.</strong></p>\n<blockquote><p>最高法院将裁定，在逮捕过程中，做什么是否合法？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 27题题干\n\n**The author’s attitude toward California’s argument is one of ______.**\n\n> 作者对加利福尼亚州的论点持什么态度？\n\n题型：**态度题**。","articleRects":[],"questionRects":[[226,618,940,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"},"html":"<h2>27题题干</h2>\n<p><strong>The author’s attitude toward California’s argument is one of ______.</strong></p>\n<blockquote><p>作者对加利福尼亚州的论点持什么态度？</p>\n</blockquote>\n<p>题型：<strong>态度题</strong>。</p>\n"},{"section":"先读题干","raw":"## 28题题干\n\n**The author believes that exploring one’s phone contents is comparable to ______.**\n\n> 作者认为，查看某人的手机内容可以比作什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,986,1068,38],[1301,1018,105,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"},"html":"<h2>28题题干</h2>\n<p><strong>The author believes that exploring one’s phone contents is comparable to ______.</strong></p>\n<blockquote><p>作者认为，查看某人的手机内容可以比作什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 29题题干\n\n**In Paragraphs 5 and 6, the author shows his concern that  ______.**\n\n> 在第5、6段，作者对什么问题表示关切？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,1353,898,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"},"html":"<h2>29题题干</h2>\n<p><strong>In Paragraphs 5 and 6, the author shows his concern that  ______.</strong></p>\n<blockquote><p>在第5、6段，作者对什么问题表示关切？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 30题题干\n\n**Orin Kerr’s comparison is quoted to indicate that ______.**\n\n> 引用奥林·克尔的比较，是为了说明什么？\n\n题型：**例证作用题**。","articleRects":[],"questionRects":[[226,1720,776,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"},"html":"<h2>30题题干</h2>\n<p><strong>Orin Kerr’s comparison is quoted to indicate that ______.</strong></p>\n<blockquote><p>引用奥林·克尔的比较，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例证作用题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, though, Or |\n| 态度词／评价词 | 先抓个大概好坏 | private, protected, unreasonable |\n| 动作词 | 先看谁做了什么 | search, protect, apply |\n| 结果词 | 看最后出了什么事 | implications, challenge, freedom |\n| 重复主题词 | 大概知道老在说什么 | digital data, police, Constitution |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, though, Or</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>private, protected, unreasonable</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>search, protect, apply</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>implications, challenge, freedom</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>digital data, police, Constitution</td></tr></tbody></table>\n"},{"section":"读文章","raw":"Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</div></div>"},{"section":"读文章","raw":"Just how much does the Constitution protect your digital data? / The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Just how much does the Constitution protect your digital data? / The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</div></div>"},{"section":"读文章","raw":"Just how much does the Constitution 保护你的数字数据？ / 最高法院 现在将考虑 警察是否可以搜查 t 章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到保护你的数字数据、最高法院、警察是否可以搜查、在没有搜查令的情况下；中间又出现加利福尼亚州已请求法官们、这很困难、对法官来说、要评估；法院将是、能够而且应该、能够而且应该、提供更新的指导原则；他们应该首先、通过抛弃加州的、更像是、进入他或她的家；美国人应该采取措施、保护他们的数字隐私、美国人应该采取措施、保护他们的数字隐私；并未减轻划界的难题、当面临严重的、可能希望、为警察留出余地；结尾还有但法官们不应该、全盘接受加州的论点、他们必须理清、适用于现在的数字信息。</p>\n<p>到这里还不能自然地说清楚：搜查手机为什么不能直接照搬搜钱包的做法，隐私保护与警察执法之间怎样划定界线。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"26题","raw":"## 26题\n\n> The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.  \n> 最高法院将裁定，在逮捕过程中，做什么是否合法？\n\nThe Supreme Court与during an arrest都出现在第1段。先完整读这一段，分清宪法保护的总问题与法院即将考虑的具体情形。\n\n> 原文参考：\n> \n> Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.\n> \n> 开始精读：\n> \n> Just how much / does the Constitution / protect your digital data? / The Supreme Court / will now consider / whether police can search / the contents of a mobile phone / without a warrant / if the phone is / on or around a person / during an arrest.\n> \n> 究竟在多大程度上 / 宪法 / 保护你的数字数据？ / 最高法院 / 现在将考虑 / 警察是否可以搜查 / 一部手机的内容 / 在没有搜查令的情况下 / 如果手机 / 在某人身上或身边 / 在逮捕期间。\n\n空格要补出whether所引出的待裁定行为，核对谁实施行为、行为针对什么，以及没有搜查令的条件。\n\n接下来按A—D逐项看。","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[[226,190,1195,38],[281,255,31,26],[280,312,827,38],[280,373,874,38],[280,435,797,38],[280,496,761,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"26","initialReadingPids":[0]},"html":"<h2>26题</h2>\n<blockquote><p>The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.<br />\n最高法院将裁定，在逮捕过程中，做什么是否合法？</p>\n</blockquote>\n<p>The Supreme Court与during an arrest都出现在第1段。先完整读这一段，分清宪法保护的总问题与法院即将考虑的具体情形。</p>\n<blockquote><p>原文参考：</p>\n<p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<p>开始精读：</p>\n<p>Just how much / does the Constitution / protect your digital data? / The Supreme Court / will now consider / whether police can search / the contents of a mobile phone / without a warrant / if the phone is / on or around a person / during an arrest.</p>\n<p>究竟在多大程度上 / 宪法 / 保护你的数字数据？ / 最高法院 / 现在将考虑 / 警察是否可以搜查 / 一部手机的内容 / 在没有搜查令的情况下 / 如果手机 / 在某人身上或身边 / 在逮捕期间。</p>\n</blockquote>\n<p>空格要补出whether所引出的待裁定行为，核对谁实施行为、行为针对什么，以及没有搜查令的条件。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"26题","raw":"### A. search for suspects’ mobile phones without a warrant\n\n> 在没有搜查令时寻找嫌疑人的手机。\n\n把A接回题干，它说的是：最高法院将裁定，逮捕期间警方在没有搜查令时寻找嫌疑人的手机是否合法。\n\nA中的`search for`后面接手机，原文的`search`后面接`the contents`。两处都出现搜查，我们回到第1段，看看实际找的是什么。\n\n> whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.\n\n原文已经说手机在被捕者身上或身边，法院要考虑的是警方能不能打开它，搜查里面的内容。\n\nA的`search for suspects’ mobile phones`是寻找嫌疑人的手机，要找到的是那部手机本身。手机在哪里和手机里有什么，是两件事。\n\n两边都有`without a warrant`，但没有搜查令这一条件相同，不能把被搜查的内容也变成一样。A遗漏了原句最关键的`contents`。\n\n**原文是在问能不能寻找手机，还是能不能查看已经在身边的手机内容？**\n\n是查看手机内容。A把内容搜查改成了寻找手机。\n\n**第一轮判断：A排除。**","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[[280,312,827,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>A. search for suspects’ mobile phones without a warrant</h3>\n<blockquote><p>在没有搜查令时寻找嫌疑人的手机。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最高法院将裁定，逮捕期间警方在没有搜查令时寻找嫌疑人的手机是否合法。</p>\n<p>A中的<code>search for</code>后面接手机，原文的<code>search</code>后面接<code>the contents</code>。两处都出现搜查，我们回到第1段，看看实际找的是什么。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n<p>原文已经说手机在被捕者身上或身边，法院要考虑的是警方能不能打开它，搜查里面的内容。</p>\n<p>A的<code>search for suspects’ mobile phones</code>是寻找嫌疑人的手机，要找到的是那部手机本身。手机在哪里和手机里有什么，是两件事。</p>\n<p>两边都有<code>without a warrant</code>，但没有搜查令这一条件相同，不能把被搜查的内容也变成一样。A遗漏了原句最关键的<code>contents</code>。</p>\n<p><strong>原文是在问能不能寻找手机，还是能不能查看已经在身边的手机内容？</strong></p>\n<p>是查看手机内容。A把内容搜查改成了寻找手机。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"26题","raw":"### B. check suspects’ phone contents without being authorized\n\n> 在未获授权时查看嫌疑人的手机内容。\n\n把B接回题干，它说的是：最高法院将裁定，逮捕期间警方未获搜查授权就查看嫌疑人的手机内容是否合法。\n\nB有`phone contents`和`without being authorized`。我们回到第1段的`contents ... without a warrant`，逐个接上。\n\n> whether police can search the contents of a mobile phone without a warrant\n\n原文中的`police can search`是警方能否搜查，搜查对象是手机的内容。B的`check suspects’ phone contents`同样让警方查看这些内容。\n\n`without a warrant`说明警方没有搜查令，B用未获授权来概括这里缺少的许可。放在本题里，这个授权就是与搜查令有关的授权，不能另外扩大成警方从未获得任何执法权。\n\n题干已经保留“逮捕期间”和“法院将裁定”，B补上查看内容以及缺少许可，句子就能和原文完整接起来。\n\n**把B接回题干后，警方做的事和缺少的许可能否对应原句？**\n\n能。查看的是手机内容，缺少的是搜查授权，B留下。\n\n**第一轮判断：B保留。**","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[[280,373,874,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"26","paragraphPids":[0]},"html":"<h3>B. check suspects’ phone contents without being authorized</h3>\n<blockquote><p>在未获授权时查看嫌疑人的手机内容。</p>\n</blockquote>\n<p>把B接回题干，它说的是：最高法院将裁定，逮捕期间警方未获搜查授权就查看嫌疑人的手机内容是否合法。</p>\n<p>B有<code>phone contents</code>和<code>without being authorized</code>。我们回到第1段的<code>contents ... without a warrant</code>，逐个接上。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<p>原文中的<code>police can search</code>是警方能否搜查，搜查对象是手机的内容。B的<code>check suspects’ phone contents</code>同样让警方查看这些内容。</p>\n<p><code>without a warrant</code>说明警方没有搜查令，B用未获授权来概括这里缺少的许可。放在本题里，这个授权就是与搜查令有关的授权，不能另外扩大成警方从未获得任何执法权。</p>\n<p>题干已经保留“逮捕期间”和“法院将裁定”，B补上查看内容以及缺少许可，句子就能和原文完整接起来。</p>\n<p><strong>把B接回题干后，警方做的事和缺少的许可能否对应原句？</strong></p>\n<p>能。查看的是手机内容，缺少的是搜查授权，B留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"26题","raw":"### C. prevent suspects from deleting their phone contents\n\n> 阻止嫌疑人删除其手机内容。\n\n把C接回题干，它说的是：最高法院将裁定，逮捕期间警方阻止嫌疑人删除手机内容是否合法。\n\nC说`prevent ... deleting`，阻止嫌疑人删除内容。原文第1段也有`phone contents`，我们看动作是谁做的。\n\n> whether police can search the contents of a mobile phone without a warrant\n\n原句让警方去`search`手机内容，法院要判断这种查看是否合法。\n\nC让嫌疑人去删除内容，警方再阻止这个删除行为。手机内容虽然没变，但一边是警方查看，另一边是阻止嫌疑人修改资料。\n\n原文问句没有说有人正在删除，也没有把保护数据不被删除列成此处待裁定的行为。不能只因为都是手机里的资料，就忽略前面的动作。\n\n**法院在第1段要裁定的是警方查看资料，还是警方阻止嫌疑人删除资料？**\n\n是警方查看资料。C换成了另一项行动。\n\n**第一轮判断：C排除。**","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[[280,435,797,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>C. prevent suspects from deleting their phone contents</h3>\n<blockquote><p>阻止嫌疑人删除其手机内容。</p>\n</blockquote>\n<p>把C接回题干，它说的是：最高法院将裁定，逮捕期间警方阻止嫌疑人删除手机内容是否合法。</p>\n<p>C说<code>prevent ... deleting</code>，阻止嫌疑人删除内容。原文第1段也有<code>phone contents</code>，我们看动作是谁做的。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<p>原句让警方去<code>search</code>手机内容，法院要判断这种查看是否合法。</p>\n<p>C让嫌疑人去删除内容，警方再阻止这个删除行为。手机内容虽然没变，但一边是警方查看，另一边是阻止嫌疑人修改资料。</p>\n<p>原文问句没有说有人正在删除，也没有把保护数据不被删除列成此处待裁定的行为。不能只因为都是手机里的资料，就忽略前面的动作。</p>\n<p><strong>法院在第1段要裁定的是警方查看资料，还是警方阻止嫌疑人删除资料？</strong></p>\n<p>是警方查看资料。C换成了另一项行动。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"26题","raw":"### D. **[xxx]** suspects from using their mobile phones\n\n> **[xxx]**嫌疑人使用他们的手机。\n\n把D接回题干，它说的是：最高法院将裁定，逮捕期间警方**[xxx]**嫌疑人使用手机是否合法。\n\nD最前面的动作被挡住，只能读到`suspects from using their mobile phones`。我们先拿它与第1段警方搜查手机内容对照。\n\n> whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.\n\nD里能看清的是嫌疑人和他们使用手机这件事。原文能看清的则是警方搜查手机内容，以及没有搜查令这一条件。\n\n现在还不知道D开头要求警方怎样对待嫌疑人，不能把那个**[xxx]**自己填成某个认识的动词。仅凭后面的`from using`也还不能把整项直接译完。\n\nB已经能完整接上原句；D先留下，后面继续看法院讨论的是让嫌疑人怎样使用手机，还是警方对内容的搜查权限。\n\n**D开头的动作尚未读懂，现在能把它整项明确解释成法院要裁定的行为吗？**\n\n还不能。先和B一起留下，回头用文章持续讨论的具体行为来核对。\n\n**第一轮判断：D保留。**","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37]],"questionRects":[[280,496,761,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"26","paragraphPids":[0]},"html":"<h3>D. <strong>[xxx]</strong> suspects from using their mobile phones</h3>\n<blockquote><p><strong>[xxx]</strong>嫌疑人使用他们的手机。</p>\n</blockquote>\n<p>把D接回题干，它说的是：最高法院将裁定，逮捕期间警方<strong>[xxx]</strong>嫌疑人使用手机是否合法。</p>\n<p>D最前面的动作被挡住，只能读到<code>suspects from using their mobile phones</code>。我们先拿它与第1段警方搜查手机内容对照。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquo alifornia’s advice. Enough of the implications are **[xxx]**, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.\n> \n> 开始精读：\n> \n> The court would be **[xxx]** modest / if it followed California’s advice. / Enough of the implications / are **[xxx]**, even obvious, / so that the justices / can and should / provide updated guidelines / to police, lawyers and defendants.\n> \n> 法院将是**[xxx]**谦逊的 / 如果它听从加州的建议。 / 其中足够多的影响 / 是**[xxx]**的，甚至显而易见， / 因此法官们 / 能够而且应该 / 提供更新的指导原则 / 给警察、律师和被告。\n\nattitude要求概括作者怎样对待加州的论点，要核对评价是谁作出的、针对谁的主张，而不是只摘取一处表示困难的词。\n\n接下来按A—D逐项看。","articleRects":[[274,423,1117,38],[202,470,1194,38],[202,517,1189,38],[202,563,1159,38],[273,610,1113,38],[202,657,1194,38],[203,704,1076,37]],"questionRects":[[226,618,940,38],[280,680,181,30],[280,741,220,30],[280,802,212,38],[280,863,229,31]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1,2],"qid":"27","initialReadingPids":[1,2]},"html":"<h2>27题</h2>\n<blockquote><p>The author’s attitude toward California’s argument is one of ______.<br />\n作者对加利福尼亚州的论点持什么态度？</p>\n</blockquote>\n<p>California’s argument指向第2段加州向法官提出的请求；第3段以California’s advice继续谈这项建议。依次完整读这两段，分清该州的理由与作者的回应。</p>\n<blockquote><p>原文参考：</p>\n<p>California has asked the justices to refrain from a <strong>[xxx]</strong> ruling, particularly one that upsets the old assumption that authorities may search through the <strong>[xxx]</strong> of suspects at the time of their arrest. It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n<p>开始精读：</p>\n<p>California has asked the justices / to refrain from a <strong>[xxx]</strong> ruling, / particularly one that upsets / the old assumption / that authorities may search through / the <strong>[xxx]</strong> of suspects / at the time of their arrest. / It is hard, / the state argues, / for judges to assess / the implications of / new and rapidly changing technologies.</p>\n<p>加利福尼亚州已请求法官们 / 避免作出<strong>[xxx]</strong>裁决， / 尤其是会推翻 / 那个旧假设的裁决 / 即当局可以搜查 / 嫌疑人的<strong>[xxx]</strong> / 在逮捕他们的时候。 / 这很困难， / 该州辩称， / 对法官来说，要评估 / 其影响 / 新出现且迅速变化的技术。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The court would be <strong>[xxx]</strong> modest if it followed California’s advice. Enough of the implications are <strong>[xxx]</strong>, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n<p>开始精读：</p>\n<p>The court would be <strong>[xxx]</strong> modest / if it followed California’s advice. / Enough of the implications / are <strong>[xxx]</strong>, even obvious, / so that the justices / can and should / provide updated guidelines / to police, lawyers and defendants.</p>\n<p>法院将是<strong>[xxx]</strong>谦逊的 / 如果它听从加州的建议。 / 其中足够多的影响 / 是<strong>[xxx]</strong>的，甚至显而易见， / 因此法官们 / 能够而且应该 / 提供更新的指导原则 / 给警察、律师和被告。</p>\n</blockquote>\n<p>attitude要求概括作者怎样对待加州的论点，要核对评价是谁作出的、针对谁的主张，而不是只摘取一处表示困难的词。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"27题","raw":"### A. tolerance\n\n> 宽容。\n\n把A接回题干，它说的是：作者对加州论点持宽容态度。\n\nA说宽容。第3段的`modest`前面有词没看懂，我们继续读到下一段的`discarding California’s ... argument`，看作者让法官怎样对待这个论点。\n\n> 原文参考：\n> \n> They should start by discarding California’s **[xxx]** argument that exploring the contents of a smartphone—a vast **[xxx]** of digital information—is similar to, say, going through a suspect’s purse. The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or **[xxx]** of an **[xxx]** without a warrant. But exploring one’s smartphone is more like entering his or her home. A smartphone may contain an arrestee’s reading history, financial history, medical history and **[xxx]** records of recent correspondence. The development of “cloud computing,” meanwhile, has made that exploration so much the easier.\n> \n> 开始精读：\n> \n> They should start / by discarding California’s **[xxx]** argument / that exploring the contents / of a smartphone—a vast **[xxx]** / of digital information—is similar to, / say, going through a suspect’s purse. / The court has ruled / that police don’t violate / the Fourth Amendment / when they go through the wallet / or **[xxx]** of an **[xxx]** / without a warrant. / But exploring one’s smartphone / is more like / entering his or her home. / A smartphone may contain / an arrestee’s reading history, / financial history, medical history / and **[xxx]** records / of recent correspondence. / The development of “cloud computing,” / meanwhile, has made that exploration / so much the easier.\n> \n> 他们应该首先 / 抛弃加州的**[xxx]**论点 / 即查看这些内容 / 一部智能手机——庞大的**[xxx]** / 数字信息的——类似于， / 比如翻查嫌疑人的手提包。 / 法院已经裁定 / 警察并不违反 / 第四修正案 / 当他们翻查钱包 / 或某个**[xxx]**的**[xxx]** / 在没有搜查令的情况下。 / 但查看某人的智能手机 / 更像是 / 进入他或她的家。 / 一部智能手机可能包含 / 被捕者的阅读记录， / 财务记录、医疗记录 / 以及**[xxx]**的记录 / 关于最近的通信。 / “云计算”的发展， / 与此同时，已使这种查看 / 容易了很多。\n\n> The court would be **[xxx]** modest if it followed California’s advice.\n\n> They should start by discarding California’s **[xxx]** argument\n\n第3段要求法官能够而且应该提供新指南。下一段又进一步说，首先就应该丢开加州的这项论点。\n\n`discarding`不是让这个论点暂时存在、对它宽容一些，而是让法官不再采用它。后面作者还自己提出了查看手机更像进入住宅的比较。\n\n所以，即使`modest`前的修饰没读懂，后面已经有明确的做法：加州这项论点应该被放弃。A的宽容接不上这种要求。\n\n**作者要求法官首先抛弃这个论点，还能把他的态度概括成宽容吗？**\n\n不能。`discarding`已经表明他不接受这一论点。\n\n**第一轮判断：A排除。**","articleRects":[[273,610,1113,38],[202,657,1194,38],[203,704,1076,37],[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[280,680,181,30]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"27","initialReadingPids":[3],"paragraphPids":[2,3]},"html":"<h3>A. tolerance</h3>\n<blockquote><p>宽容。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对加州论点持宽容态度。</p>\n<p>A说宽容。第3段的<code>modest</code>前面有词没看懂，我们继续读到下一段的<code>discarding California’s ... argument</code>，看作者让法官怎样对待这个论点。</p>\n<blockquote><p>原文参考：</p>\n<p>They should start by discarding California’s <strong>[xxx]</stron
