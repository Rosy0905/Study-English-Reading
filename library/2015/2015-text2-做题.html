 <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p>第3段要求法官能够而且应该提供新指南。下一段又进一步说，首先就应该丢开加州的这项论点。</p>\n<p><code>discarding</code>不是让这个论点暂时存在、对它宽容一些，而是让法官不再采用它。后面作者还自己提出了查看手机更像进入住宅的比较。</p>\n<p>所以，即使<code>modest</code>前的修饰没读懂，后面已经有明确的做法：加州这项论点应该被放弃。A的宽容接不上这种要求。</p>\n<p><strong>作者要求法官首先抛弃这个论点，还能把他的态度概括成宽容吗？</strong></p>\n<p>不能。<code>discarding</code>已经表明他不接受这一论点。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"27题","raw":"### B. indifference\n\n> 漠不关心。\n\n把B接回题干，它说的是：作者对加州论点漠不关心。\n\nB说作者不关心。我们回到第3段的`can and should`，再接上第4段的`should start`。\n\n> the justices can and should provide updated guidelines to police, lawyers and defendants.\n\n> They should start by discarding California’s **[xxx]** argument\n\n作者不仅认为法官可以给出新指南，还说应该这样做。接着又提出第一步：抛弃加州把手机与手提包相提并论的说法。\n\n他正在告诉法官需要处理什么、先否定哪一点。若是漠不关心，就不会从新指南一路具体谈到该怎样比较手机内容。\n\nB说没有关切，和这些直接提出要求、逐项回应加州论点的话不符。\n\n**作者既要求更新指南，又明确指出先抛弃哪项论点，这像是不关心吗？**\n\n不像。作者已经主动给出明确的处理意见，B排除。\n\n**第一轮判断：B排除。**","articleRects":[[273,610,1113,38],[202,657,1194,38],[203,704,1076,37],[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[280,741,220,30]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"27","paragraphPids":[2,3]},"html":"<h3>B. indifference</h3>\n<blockquote><p>漠不关心。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对加州论点漠不关心。</p>\n<p>B说作者不关心。我们回到第3段的<code>can and should</code>，再接上第4段的<code>should start</code>。</p>\n<blockquote><p>the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n</blockquote>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p>作者不仅认为法官可以给出新指南，还说应该这样做。接着又提出第一步：抛弃加州把手机与手提包相提并论的说法。</p>\n<p>他正在告诉法官需要处理什么、先否定哪一点。若是漠不关心，就不会从新指南一路具体谈到该怎样比较手机内容。</p>\n<p>B说没有关切，和这些直接提出要求、逐项回应加州论点的话不符。</p>\n<p><strong>作者既要求更新指南，又明确指出先抛弃哪项论点，这像是不关心吗？</strong></p>\n<p>不像。作者已经主动给出明确的处理意见，B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"27题","raw":"### C. disapproval\n\n> 不赞成。\n\n把C接回题干，它说的是：作者不赞成加州论点。\n\nC说不赞成。第4段直接有`discarding California’s ... argument`，我们看`discarding`落在哪个对象上。\n\n> They should start by discarding California’s **[xxx]** argument\n\n`They should start`里的`They`接法官，作者让他们首先做的是抛弃加州的论点。\n\n论点前有个词被挡住，但`discarding`和`California’s ... argument`都清楚。也就是说，作者已经明确不希望法官接受它，不必先猜那个修饰词是褒义还是贬义。\n\nC只说作者不赞成，没有额外说他厌恶加州或否定州的一切主张，和这里对这一论点的处理相合。\n\n**作者让法官把加州的这项论点抛弃，能不能说明他不赞成这项论点？**\n\n能。直接的弃用要求已经足以判断，C留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[280,802,212,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"27","paragraphPids":[3]},"html":"<h3>C. disapproval</h3>\n<blockquote><p>不赞成。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者不赞成加州论点。</p>\n<p>C说不赞成。第4段直接有<code>discarding California’s ... argument</code>，我们看<code>discarding</code>落在哪个对象上。</p>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p><code>They should start</code>里的<code>They</code>接法官，作者让他们首先做的是抛弃加州的论点。</p>\n<p>论点前有个词被挡住，但<code>discarding</code>和<code>California’s ... argument</code>都清楚。也就是说，作者已经明确不希望法官接受它，不必先猜那个修饰词是褒义还是贬义。</p>\n<p>C只说作者不赞成，没有额外说他厌恶加州或否定州的一切主张，和这里对这一论点的处理相合。</p>\n<p><strong>作者让法官把加州的这项论点抛弃，能不能说明他不赞成这项论点？</strong></p>\n<p>能。直接的弃用要求已经足以判断，C留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"27题","raw":"### D. cautiousness\n\n> 谨慎。\n\n把D接回题干，它说的是：作者对加州论点持谨慎态度。\n\nD说谨慎。第2段确实说技术变化快、难评估，但中间插着`the state argues`。我们先分清这是谁的理由。\n\n> It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.\n\n> They should start by discarding California’s **[xxx]** argument\n\n说难评估的是加州，它借这个理由请法官避免某种裁决。这说明的是加州希望法官怎样做。\n\n作者接着说，有足够多影响已经显而易见，法官能够且应该更新指南。随后又要求抛弃加州的论点。\n\n所以，不能把加州要求谨慎的理由，直接拿来回答作者对加州论点的态度。作者在回应并反对这一理由，而不是照着它表达谨慎。\n\n**认为技术难评估、希望法官少作裁决的是加州，还是作者对加州论点的回应？**\n\n是加州自己的理由。作者接着要求更新指南、抛弃论点，D把两人的话接错了。\n\n**第一轮判断：D排除。**","articleRects":[[274,423,1117,38],[202,470,1194,38],[202,517,1189,38],[202,563,1159,38],[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[280,863,229,31]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"27","paragraphPids":[1,3]},"html":"<h3>D. cautiousness</h3>\n<blockquote><p>谨慎。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对加州论点持谨慎态度。</p>\n<p>D说谨慎。第2段确实说技术变化快、难评估，但中间插着<code>the state argues</code>。我们先分清这是谁的理由。</p>\n<blockquote><p>It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n</blockquote>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p>说难评估的是加州，它借这个理由请法官避免某种裁决。这说明的是加州希望法官怎样做。</p>\n<p>作者接着说，有足够多影响已经显而易见，法官能够且应该更新指南。随后又要求抛弃加州的论点。</p>\n<p>所以，不能把加州要求谨慎的理由，直接拿来回答作者对加州论点的态度。作者在回应并反对这一理由，而不是照着它表达谨慎。</p>\n<p><strong>认为技术难评估、希望法官少作裁决的是加州，还是作者对加州论点的回应？</strong></p>\n<p>是加州自己的理由。作者接着要求更新指南、抛弃论点，D把两人的话接错了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。作者明确要求弃用加州的一项论点，表现为不赞成。","articleRects":[],"questionRects":[[226,618,940,38],[280,680,181,30],[280,741,220,30],[280,802,212,38],[280,863,229,31]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"27"},"html":"<h3>27题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。作者明确要求弃用加州的一项论点，表现为不赞成。</p>\n"},{"section":"28题","raw":"## 28题\n\n> The author believes that exploring one’s phone contents is comparable to ______.  \n> 作者认为，查看某人的手机内容可以比作什么？\n\nexploring one’s phone contents对应第4段exploring the contents of a smartphone与exploring one’s smartphone。该段已完整读过，回到同一整段，核对几处相似关系各是谁提出的。\n\ncomparable to要求补出作者比较查看手机内容的另一种行为，要同时核对比喻两端和提出比较的人。\n\n接下来按A—D逐项看。","articleRects":[[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[226,986,1068,38],[1301,1018,105,7],[280,1047,451,38],[281,1108,520,38],[281,1169,508,38],[280,1231,442,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"28","initialReadingPids":[]},"html":"<h2>28题</h2>\n<blockquote><p>The author believes that exploring one’s phone contents is comparable to ______.<br />\n作者认为，查看某人的手机内容可以比作什么？</p>\n</blockquote>\n<p>exploring one’s phone contents对应第4段exploring the contents of a smartphone与exploring one’s smartphone。该段已完整读过，回到同一整段，核对几处相似关系各是谁提出的。</p>\n<p>comparable to要求补出作者比较查看手机内容的另一种行为，要同时核对比喻两端和提出比较的人。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"28题","raw":"### A. getting into one’s residence\n\n> 进入某人的住所。\n\n把A接回题干，它说的是：作者认为，查看某人的手机内容就像进入这个人的住所。\n\nA说进入住所。第4段用`But`转过来之后，正有`more like entering his or her home`，我们把比较两边一起读。\n\n> But exploring one’s smartphone is more like entering his or her home.\n\n前半句是查看某人的智能手机，后半句是进入这个人的家。作者用`more like`直接把二者相连。\n\nA的`getting into`对应`entering`，`one’s residence`对应`his or her home`。谁的手机被查看，就好比进入谁的住所，人物关系也没有变。\n\n后面列出的阅读、财务、医疗和通信记录解释了为什么这样比：手机承载很多私人生活资料。A把比较另一端准确补了出来。\n\n**A的进入住所，能否接上作者明确写出的`entering his or her home`？**\n\n能。动作和地点都对应，A留下。\n\n**第一轮判断：A保留。**","articleRects":[[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[280,1047,451,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"28","paragraphPids":[3]},"html":"<h3>A. getting into one’s residence</h3>\n<blockquote><p>进入某人的住所。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为，查看某人的手机内容就像进入这个人的住所。</p>\n<p>A说进入住所。第4段用<code>But</code>转过来之后，正有<code>more like entering his or her home</code>，我们把比较两边一起读。</p>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<p>前半句是查看某人的智能手机，后半句是进入这个人的家。作者用<code>more like</code>直接把二者相连。</p>\n<p>A的<code>getting into</code>对应<code>entering</code>，<code>one’s residence</code>对应<code>his or her home</code>。谁的手机被查看，就好比进入谁的住所，人物关系也没有变。</p>\n<p>后面列出的阅读、财务、医疗和通信记录解释了为什么这样比：手机承载很多私人生活资料。A把比较另一端准确补了出来。</p>\n<p><strong>A的进入住所，能否接上作者明确写出的<code>entering his or her home</code>？</strong></p>\n<p>能。动作和地点都对应，A留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"28题","raw":"### B. handling one’s **[xxx]** records\n\n> 处理某人的**[xxx]**记录。\n\n把B接回题干，它说的是：作者认为，查看某人的手机内容就像处理这个人的**[xxx]**记录。\n\nB说处理某种记录，**[xxx]**未读懂。我们回到第4段，分清`more like`后面接什么，以及`may contain`后面接什么。\n\n> But exploring one’s smartphone is more like entering his or her home.\n\n> A smartphone may contain an arrestee’s reading history, financial history, medical history and **[xxx]** records of recent correspondence.\n\n`more like`后面接的是进入家中，这才是作者直接拿来比较的行为。\n\n各种记录出现在下一句`A smartphone may contain`后面：手机里可能有这些资料。它们用于解释手机为什么涉及私人生活，并没有另立一个“查看手机就像处理某种记录”的比较。\n\n所以，即使记录的具体修饰词还不认识，B已经写出的`handling ... records`也只是处理一类资料，不能替代原句比较中的进入住宅。\n\n**原文把各类记录列为手机可能包含的内容，还是把处理记录写成比较的另一端？**\n\n是手机可能包含的内容。明确的比较另一端仍是进入住宅。\n\n**第一轮判断：B排除。**","articleRects":[[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[281,1108,520,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>B. handling one’s <strong>[xxx]</strong> records</h3>\n<blockquote><p>处理某人的<strong>[xxx]</strong>记录。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为，查看某人的手机内容就像处理这个人的<strong>[xxx]</strong>记录。</p>\n<p>B说处理某种记录，<strong>[xxx]</strong>未读懂。我们回到第4段，分清<code>more like</code>后面接什么，以及<code>may contain</code>后面接什么。</p>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<blockquote><p>A smartphone may contain an arrestee’s reading history, financial history, medical history and <strong>[xxx]</strong> records of recent correspondence.</p>\n</blockquote>\n<p><code>more like</code>后面接的是进入家中，这才是作者直接拿来比较的行为。</p>\n<p>各种记录出现在下一句<code>A smartphone may contain</code>后面：手机里可能有这些资料。它们用于解释手机为什么涉及私人生活，并没有另立一个“查看手机就像处理某种记录”的比较。</p>\n<p>所以，即使记录的具体修饰词还不认识，B已经写出的<code>handling ... records</code>也只是处理一类资料，不能替代原句比较中的进入住宅。</p>\n<p><strong>原文把各类记录列为手机可能包含的内容，还是把处理记录写成比较的另一端？</strong></p>\n<p>是手机可能包含的内容。明确的比较另一端仍是进入住宅。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"28题","raw":"### C. scanning one’s correspondences\n\n> 浏览某人的通信。\n\n把C接回题干，它说的是：作者认为，查看某人的手机内容就像浏览这个人的通信。\n\nC说浏览通信。`correspondence`确实在第4段，我们回看它前面的`may contain`和更前面的`more like`。\n\n> But exploring one’s smartphone is more like entering his or her home.\n\n> A smartphone may contain an arrestee’s reading history, financial history, medical history and **[xxx]** records of recent correspondence.\n\n手机可能含有最近通信的记录，原文把它和阅读、财务、医疗记录一起列出来。这在说明查看手机能接触到多少私人资料。\n\n作者的比较却在前一句已经说完：查看智能手机更像进入家中。通信记录是解释这份私密性的一个例子。\n\nC只拿出了其中一类内容。题干问作者把整个查看行为比作什么，不能用可能看到的一部分资料来替掉那项比较。\n\n**手机里可能有通信记录，是否就等于作者把查看手机比作浏览通信？**\n\n不等于。通信记录是所含资料之一，作者明确比较的是进入家中。\n\n**第一轮判断：C排除。**","articleRects":[[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[281,1169,508,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>C. scanning one’s correspondences</h3>\n<blockquote><p>浏览某人的通信。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为，查看某人的手机内容就像浏览这个人的通信。</p>\n<p>C说浏览通信。<code>correspondence</code>确实在第4段，我们回看它前面的<code>may contain</code>和更前面的<code>more like</code>。</p>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<blockquote><p>A smartphone may contain an arrestee’s reading history, financial history, medical history and <strong>[xxx]</strong> records of recent correspondence.</p>\n</blockquote>\n<p>手机可能含有最近通信的记录，原文把它和阅读、财务、医疗记录一起列出来。这在说明查看手机能接触到多少私人资料。</p>\n<p>作者的比较却在前一句已经说完：查看智能手机更像进入家中。通信记录是解释这份私密性的一个例子。</p>\n<p>C只拿出了其中一类内容。题干问作者把整个查看行为比作什么，不能用可能看到的一部分资料来替掉那项比较。</p>\n<p><strong>手机里可能有通信记录，是否就等于作者把查看手机比作浏览通信？</strong></p>\n<p>不等于。通信记录是所含资料之一，作者明确比较的是进入家中。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"28题","raw":"### D. going through one’s wallet\n\n> 翻查某人的钱包。\n\n把D接回题干，它说的是：作者认为，查看某人的手机内容就像翻查这个人的钱包。\n\nD说翻查钱包，这一段也写了钱包和手提包。我们把段首的`California’s argument`、`discarding`以及后面的`But`连起来看。\n\n> They should start by discarding California’s **[xxx]** argument that exploring the contents of a smartphone—a vast **[xxx]** of digital information—is similar to, say, going through a suspect’s purse.\n\n> The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or **[xxx]** of an **[xxx]** without a warrant.\n\n> But exploring one’s smartphone is more like entering his or her home.\n\n把查看手机比作翻查手提包的是加州，而作者说这个论点应被抛弃。接着介绍法院以前允许无令翻查钱包，是交代旧的处理办法。\n\n随后`But`转向作者对手机的看法：它更像进入某人的家。作者之所以另换这个比较，就是因为不能直接把旧的钱包办法套到手机内容上。\n\nD把作者刚要放下的那一类钱包比较，又写成作者自己的观点。\n\n**钱包的比较属于作者最终采用的说法，还是他正在与手机搜查区分的旧情形？**\n\n是后者。作者在`But`后采用的是进入住宅的比较，D不对。\n\n**第一轮判断：D排除。**","articleRects":[[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38]],"questionRects":[[280,1231,442,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>D. going through one’s wallet</h3>\n<blockquote><p>翻查某人的钱包。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，查看某人的手机内容就像翻查这个人的钱包。</p>\n<p>D说翻查钱包，这一段也写了钱包和手提包。我们把段首的<code>California’s argument</code>、<code>discarding</code>以及后面的<code>But</code>连起来看。</p>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument that exploring the contents of a smartphone—a vast <strong>[xxx]</strong> of digital information—is similar to, say, going through a suspect’s purse.</p>\n</blockquote>\n<blockquote><p>The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or <strong>[xxx]</strong> of an <strong>[xxx]</strong> without a warrant.</p>\n</blockquote>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<p>把查看手机比作翻查手提包的是加州，而作者说这个论点应被抛弃。接着介绍法院以前允许无令翻查钱包，是交代旧的处理办法。</p>\n<p>随后<code>But</code>转向作者对手机的看法：它更像进入某人的家。作者之所以另换这个比较，就是因为不能直接把旧的钱包办法套到手机内容上。</p>\n<p>D把作者刚要放下的那一类钱包比较，又写成作者自己的观点。</p>\n<p><strong>钱包的比较属于作者最终采用的说法，还是他正在与手机搜查区分的旧情形？</strong></p>\n<p>是后者。作者在<code>But</code>后采用的是进入住宅的比较，D不对。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"28题","raw":"### 28题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。作者明确把查看智能手机比作进入某人的家中。","articleRects":[],"questionRects":[[226,986,1068,38],[1301,1018,105,7],[280,1047,451,38],[281,1108,520,38],[281,1169,508,38],[280,1231,442,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"28"},"html":"<h3>28题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。作者明确把查看智能手机比作进入某人的家中。</p>\n"},{"section":"29题","raw":"## 29题\n\n> In Paragraphs 5 and 6, the author shows his concern that  ______.  \n> 在第5、6段，作者对什么问题表示关切？\n\n题干直接指定Paragraphs 5 and 6，先完整读第5段，再完整读第6段，留意隐私保护原则与随后划界问题怎样相接。\n\n> 原文参考：\n> \n> Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution’s **[xxx]** on unreasonable searches.\n> \n> 开始精读：\n> \n> Americans should take steps / to protect their digital privacy. / But keeping sensitive information / on these devices / is increasingly a requirement / of normal life. / Citizens still have a right / to expect private documents / to remain private / and protected by the Constitution’s **[xxx]** / on unreasonable searches.\n> \n> 美国人应该采取措施 / 保护他们的数字隐私。 / 但保存敏感信息 / 在这些设备上 / 越来越成为一种需要 / 正常生活的需要。 / 公民仍然有权 / 期待私人文件 / 保持私密 / 并受宪法的**[xxx]**保护 / 关于不合理的搜查。\n\n> 原文参考：\n> \n> As so often is the case, stating that principle doesn’t ease the challenge of line-drawing. In many cases, it would not be overly **[xxx]** for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not **[xxx]** or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.\n> \n> 开始精读：\n> \n> As so often is the case, / stating that principle / doesn’t ease the challenge of line-drawing. / In many cases, / it would not be overly **[xxx]** / for authorities to obtain a warrant / to search through phone contents. / They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure that phone data / are not **[xxx]** or altered / while waiting for a warrant. / The court, though, may want / to allow room for police / to cite situations / where they are entitled / to more freedom.\n> \n> 正如常有的情况一样， / 表明那一原则 / 并未减轻划界的难题。 / 在许多情况下， / 这不会过于**[xxx]** / 对当局而言，取得搜查令 / 以搜查手机内容。 / 他们仍然可以使之失效 / 第四修正案的保护 / 当面临严重、紧迫的情况时， / 而且他们可以采取合理措施 / 确保手机数据 / 未被**[xxx]**或更改 / 在等待搜查令时。 / 不过，法院可能希望 / 为警察留出余地 / 以列举某些情况 / 在那些情况下，他们有权 / 拥有更多自由。\n\nconcern要概括这两段的关切，核对私人文件的保护、现实生活对设备的需要及警方行动空间之间的关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38]],"questionRects":[[226,1353,898,38],[281,1414,667,38],[280,1475,720,38],[280,1537,717,37],[280,1598,691,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4,5],"qid":"29","initialReadingPids":[4,5]},"html":"<h2>29题</h2>\n<blockquote><p>In Paragraphs 5 and 6, the author shows his concern that  ______.<br />\n在第5、6段，作者对什么问题表示关切？</p>\n</blockquote>\n<p>题干直接指定Paragraphs 5 and 6，先完整读第5段，再完整读第6段，留意隐私保护原则与随后划界问题怎样相接。</p>\n<blockquote><p>原文参考：</p>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n<p>开始精读：</p>\n<p>Americans should take steps / to protect their digital privacy. / But keeping sensitive information / on these devices / is increasingly a requirement / of normal life. / Citizens still have a right / to expect private documents / to remain private / and protected by the Constitution’s <strong>[xxx]</strong> / on unreasonable searches.</p>\n<p>美国人应该采取措施 / 保护他们的数字隐私。 / 但保存敏感信息 / 在这些设备上 / 越来越成为一种需要 / 正常生活的需要。 / 公民仍然有权 / 期待私人文件 / 保持私密 / 并受宪法的<strong>[xxx]</strong>保护 / 关于不合理的搜查。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>As so often is the case, stating that principle doesn’t ease the challenge of line-drawing. In many cases, it would not be overly <strong>[xxx]</strong> for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not <strong>[xxx]</strong> or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<p>开始精读：</p>\n<p>As so often is the case, / stating that principle / doesn’t ease the challenge of line-drawing. / In many cases, / it would not be overly <strong>[xxx]</strong> / for authorities to obtain a warrant / to search through phone contents. / They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure that phone data / are not <strong>[xxx]</strong> or altered / while waiting for a warrant. / The court, though, may want / to allow room for police / to cite situations / where they are entitled / to more freedom.</p>\n<p>正如常有的情况一样， / 表明那一原则 / 并未减轻划界的难题。 / 在许多情况下， / 这不会过于<strong>[xxx]</strong> / 对当局而言，取得搜查令 / 以搜查手机内容。 / 他们仍然可以使之失效 / 第四修正案的保护 / 当面临严重、紧迫的情况时， / 而且他们可以采取合理措施 / 确保手机数据 / 未被<strong>[xxx]</strong>或更改 / 在等待搜查令时。 / 不过，法院可能希望 / 为警察留出余地 / 以列举某些情况 / 在那些情况下，他们有权 / 拥有更多自由。</p>\n</blockquote>\n<p>concern要概括这两段的关切，核对私人文件的保护、现实生活对设备的需要及警方行动空间之间的关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"29题","raw":"### A. principles are hard to be clearly expressed\n\n> 原则很难被清楚地表达出来。\n\n把A接回题干，它说的是：作者在第5、6段担心原则很难表达清楚。\n\nA说原则难以表达清楚。第6段开头的`stating that principle`接的是前一段的隐私权，我们把它与`line-drawing`分开读。\n\n> Citizens still have a right to expect private documents to remain private\n\n> stating that principle doesn’t ease the challenge of line-drawing.\n\n前一段已经把原则写出来：公民有权期待私人文件保持私密。第6段不是说这句话讲不清，而是说讲出这条原则并不能减轻划界的困难。\n\n接下来讨论什么时候要搜查令，什么紧急情况下可以例外，以及等待期间能采取什么措施。这些都是原则怎样落实到具体情形的问题。\n\nA把困难放在“清楚表达原则”上；原文却把困难放在说清原则之后，具体边界仍不好画。\n\n**原则已经被说出而边界仍难划，等于原则本身很难表达清楚吗？**\n\n不等于。原则已经明确，难的是哪些情况可以搜查、哪些需要限制。\n\n**第一轮判断：A排除。**","articleRects":[[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38]],"questionRects":[[281,1414,667,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"29","paragraphPids":[4,5]},"html":"<h3>A. principles are hard to be clearly expressed</h3>\n<blockquote><p>原则很难被清楚地表达出来。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者在第5、6段担心原则很难表达清楚。</p>\n<p>A说原则难以表达清楚。第6段开头的<code>stating that principle</code>接的是前一段的隐私权，我们把它与<code>line-drawing</code>分开读。</p>\n<blockquote><p>Citizens still have a right to expect private documents to remain private</p>\n</blockquote>\n<blockquote><p>stating that principle doesn’t ease the challenge of line-drawing.</p>\n</blockquote>\n<p>前一段已经把原则写出来：公民有权期待私人文件保持私密。第6段不是说这句话讲不清，而是说讲出这条原则并不能减轻划界的困难。</p>\n<p>接下来讨论什么时候要搜查令，什么紧急情况下可以例外，以及等待期间能采取什么措施。这些都是原则怎样落实到具体情形的问题。</p>\n<p>A把困难放在“清楚表达原则”上；原文却把困难放在说清原则之后，具体边界仍不好画。</p>\n<p><strong>原则已经被说出而边界仍难划，等于原则本身很难表达清楚吗？</strong></p>\n<p>不等于。原则已经明确，难的是哪些情况可以搜查、哪些需要限制。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"29题","raw":"### B. the court is giving police less room for action\n\n> 法院正在给警方更少的行动余地。\n\n把B接回题干，它说的是：作者在第5、6段担心法院正在给警方更少的行动余地。\n\nB说法院给警方更少余地。第6段末正有`allow room`，我们看后面接的是`more freedom`还是更少自由。\n\n> The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.\n\n法院可能希望留下空间，让警方列出一些可以拥有更多自由的情况。这里`allow room`与`more freedom`都是往允许更多行动的方向说。\n\nB却写法院正在缩小警方行动空间，与这句的方向不一样。而且`may want`只是可能希望这样安排，也不能直接说某种安排已经在进行。\n\n作者前面强调隐私应受保护，不等于法院已经给警方更少余地；要看法院这句实际怎么写。\n\n**法院可能允许警方列举享有更多自由的情况，能改写成法院正在给警方更少余地吗？**\n\n不能。原文谈可能放宽的空间，B写成已经缩小空间。\n\n**第一轮判断：B排除。**","articleRects":[[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38]],"questionRects":[[280,1475,720,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"29","paragraphPids":[5]},"html":"<h3>B. the court is giving police less room for action</h3>\n<blockquote><p>法院正在给警方更少的行动余地。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者在第5、6段担心法院正在给警方更少的行动余地。</p>\n<p>B说法院给警方更少余地。第6段末正有<code>allow room</code>，我们看后面接的是<code>more freedom</code>还是更少自由。</p>\n<blockquote><p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<p>法院可能希望留下空间，让警方列出一些可以拥有更多自由的情况。这里<code>allow room</code>与<code>more freedom</code>都是往允许更多行动的方向说。</p>\n<p>B却写法院正在缩小警方行动空间，与这句的方向不一样。而且<code>may want</code>只是可能希望这样安排，也不能直接说某种安排已经在进行。</p>\n<p>作者前面强调隐私应受保护，不等于法院已经给警方更少余地；要看法院这句实际怎么写。</p>\n<p><strong>法院可能允许警方列举享有更多自由的情况，能改写成法院正在给警方更少余地吗？</strong></p>\n<p>不能。原文谈可能放宽的空间，B写成已经缩小空间。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"29题","raw":"### C. phones are used to store **[xxx]** information\n\n> 手机被用来存储**[xxx]**信息。\n\n把C接回题干，它说的是：作者在第5、6段担心手机被用于存储**[xxx]**信息。\n\nC说手机存储某种信息，第5段正有`keeping sensitive information on these devices`。我们先把存储这件事对上，再看作者为何接着谈隐私。\n\n> But keeping sensitive information on these devices is increasingly a requirement of normal life.\n\n> Citizens still have a right to expect private documents to remain private and protected by the Constitution’s **[xxx]** on unreasonable searches.\n\n第5段确实说，把敏感信息留在设备上越来越是正常生活的需要。因此，C说的手机存储信息并不是凭空出现。\n\n但C修饰信息的**[xxx]**尚未读懂。它是否就是原句的敏感信息，还是另一种性质，现在无法确定。\n\n还要注意，原句写完生活需要，马上又说公民仍有权让私人文件保持私密。C只写了存储；它能不能回答作者担心什么，要和接下来的权利、划界一起看，先别把后半段丢掉。\n\n**C的信息性质还未读清，而存储行为在原文中确实存在，现在能马上把C整个否定吗？**\n\n还不能。先留下，回查时继续看作者是担心存储本身，还是担心这些资料怎样得到保护。\n\n**第一轮判断：C保留。**","articleRects":[[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38]],"questionRects":[[280,1537,717,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"29","paragraphPids":[4]},"html":"<h3>C. phones are used to store <strong>[xxx]</strong> information</h3>\n<blockquote><p>手机被用来存储<strong>[xxx]</strong>信息。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者在第5、6段担心手机被用于存储<strong>[xxx]</strong>信息。</p>\n<p>C说手机存储某种信息，第5段正有<code>keeping sensitive information on these devices</code>。我们先把存储这件事对上，再看作者为何接着谈隐私。</p>\n<blockquote><p>But keeping sensitive information on these devices is increasingly a requirement of normal life.</p>\n</blockquote>\n<blockquote><p>Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n</blockquote>\n<p>第5段确实说，把敏感信息留在设备上越来越是正常生活的需要。因此，C说的手机存储信息并不是凭空出现。</p>\n<p>但C修饰信息的<strong>[xxx]</strong>尚未读懂。它是否就是原句的敏感信息，还是另一种性质，现在无法确定。</p>\n<p>还要注意，原句写完生活需要，马上又说公民仍有权让私人文件保持私密。C只写了存储；它能不能回答作者担心什么，要和接下来的权利、划界一起看，先别把后半段丢掉。</p>\n<p><strong>C的信息性质还未读清，而存储行为在原文中确实存在，现在能马上把C整个否定吗？</strong></p>\n<p>还不能。先留下，回查时继续看作者是担心存储本身，还是担心这些资料怎样得到保护。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"29题","raw":"### D. citizens’ privacy is not effectively protected\n\n> 公民隐私没有得到有效保护。\n\n把D接回题干，它说的是：作者在第5、6段担心公民隐私没有得到有效保护。\n\nD说隐私未获有效保护。第5段提出保护权利，第6段却说单说原则仍难划界，我们把这两层连起来看。\n\n> Citizens still have a right to expect private documents to remain private and protected by the Constitution’s **[xxx]** on unreasonable searches.\n\n> stating that principle doesn’t ease the challenge of line-drawing.\n\n> The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.\n\n公民有权期待私人资料保持私密，说明应当受到什么保护。但`doesn’t ease the challenge`接着说，即使原则明确，真正划定搜查边界仍有困难。\n\n随后又要考虑严重紧急情况、等待搜查令时的措施，以及警方要求更多自由的情况。怎样既允许必要执法又保住隐私，还需要具体规则。\n\nD担心保护没有有效落实，能接上这份困难。这里并不是说任何人的隐私都已经被侵犯，而是原则本身还不足以保证实际保护。\n\n**已经声明隐私权，却还没有轻易解决搜查边界，是否能让作者担心隐私的实际保护？**\n\n能。D把两段连接处的问题说了出来，先留下。\n\n**第一轮判断：D保留。**","articleRects":[[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38]],"questionRects":[[280,1598,691,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"29","paragraphPids":[4,5]},"html":"<h3>D. citizens’ privacy is not effectively protected</h3>\n<blockquote><p>公民隐私没有得到有效保护。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者在第5、6段担心公民隐私没有得到有效保护。</p>\n<p>D说隐私未获有效保护。第5段提出保护权利，第6段却说单说原则仍难划界，我们把这两层连起来看。</p>\n<blockquote><p>Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n</blockquote>\n<blockquote><p>stating that principle doesn’t ease the challenge of line-drawing.</p>\n</blockquote>\n<blockquote><p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<p>公民有权期待私人资料保持私密，说明应当受到什么保护。但<code>doesn’t ease the challenge</code>接着说，即使原则明确，真正划定搜查边界仍有困难。</p>\n<p>随后又要考虑严重紧急情况、等待搜查令时的措施，以及警方要求更多自由的情况。怎样既允许必要执法又保住隐私，还需要具体规则。</p>\n<p>D担心保护没有有效落实，能接上这份困难。这里并不是说任何人的隐私都已经被侵犯，而是原则本身还不足以保证实际保护。</p>\n<p><strong>已经声明隐私权，却还没有轻易解决搜查边界，是否能让作者担心隐私的实际保护？</strong></p>\n<p>能。D把两段连接处的问题说了出来，先留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"29题","raw":"### 29题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一遍留下C、D。C所存信息的性质仍未知；D接上了权利原则与实际划界困难之间的关系。","articleRects":[],"questionRects":[[226,1353,898,38],[281,1414,667,38],[280,1475,720,38],[280,1537,717,37],[280,1598,691,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"29"},"html":"<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一遍留下C、D。C所存信息的性质仍未知；D接上了权利原则与实际划界困难之间的关系。</p>\n"},{"section":"30题","raw":"## 30题\n\n> Orin Kerr’s comparison is quoted to indicate that ______.  \n> 引用奥林·克尔的比较，是为了说明什么？\n\n题干点名Orin Kerr，定位第7段。先从段首But读到末尾，将比较前的观点和汽车、数字信息的两种情形完整连起来。\n\n> 原文参考：\n> \n> But the justices should not swallow California’s argument whole. New, **[xxx]** technology sometimes demands novel applications of the Constitution’s protections. Orin Kerr, a law professor, compares the explosion and **[xxx]** of digital information in the 21st century with the establishment of automobile use as a **[xxx]** necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n> \n> 开始精读：\n> \n> But the justices should not / swallow California’s argument whole. / New, **[xxx]** technology sometimes demands / novel applications / of the Constitution’s protections. / Orin Kerr, a law professor, / compares the explosion and **[xxx]** / of digital information / in the 21st century / with the establishment / of automobile use / as a **[xxx]** necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment / applies to digital information now.\n> \n> 但法官们不应该 / 全盘接受加州的论点。 / 新的、**[xxx]**的技术有时要求 / 新的运用方式 / 对于宪法的保护。 / 法学教授奥林·克尔， / 将激增和**[xxx]**作比较 / 数字信息的 / 在第21世纪 / 与其确立 / 汽车的使用 / 作为生活中**[xxx]**的必需品 / 在第20世纪： / 法官们必须明确规定 / 新的规则 / 针对新的个人领域 / 即当时的乘用车； / 他们必须理清 / 第四修正案如何 / 适用于现在的数字信息。\n\nis quoted to indicate问引用比较支持什么判断，要核对两种时代情形之间共同的关系，以及比较结尾交给法官的任务。\n\n接下来按A—D逐项看。","articleRects":[[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[[226,1720,776,38],[280,1782,752,37],[280,1843,917,38],[280,1904,921,38],[280,1965,827,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[6],"qid":"30","initialReadingPids":[6]},"html":"<h2>30题</h2>\n<blockquote><p>Orin Kerr’s comparison is quoted to indicate that ______.<br />\n引用奥林·克尔的比较，是为了说明什么？</p>\n</blockquote>\n<p>题干点名Orin Kerr，定位第7段。先从段首But读到末尾，将比较前的观点和汽车、数字信息的两种情形完整连起来。</p>\n<blockquote><p>原文参考：</p>\n<p>But the justices should not swallow California’s argument whole. New, <strong>[xxx]</strong> technology sometimes demands novel applications of the Constitution’s protections. Orin Kerr, a law professor, compares the explosion and <strong>[xxx]</strong> of digital information in the 21st century with the establishment of automobile use as a <strong>[xxx]</strong> necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>开始精读：</p>\n<p>But the justices should not / swallow California’s argument whole. / New, <strong>[xxx]</strong> technology sometimes demands / novel applications / of the Constitution’s protections. / Orin Kerr, a law professor, / compares the explosion and <strong>[xxx]</strong> / of digital information / in the 21st century / with the establishment / of automobile use / as a <strong>[xxx]</strong> necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment / applies to digital information now.</p>\n<p>但法官们不应该 / 全盘接受加州的论点。 / 新的、<strong>[xxx]</strong>的技术有时要求 / 新的运用方式 / 对于宪法的保护。 / 法学教授奥林·克尔， / 将激增和<strong>[xxx]</strong>作比较 / 数字信息的 / 在第21世纪 / 与其确立 / 汽车的使用 / 作为生活中<strong>[xxx]</strong>的必需品 / 在第20世纪： / 法官们必须明确规定 / 新的规则 / 针对新的个人领域 / 即当时的乘用车； / 他们必须理清 / 第四修正案如何 / 适用于现在的数字信息。</p>\n</blockquote>\n<p>is quoted to indicate问引用比较支持什么判断，要核对两种时代情形之间共同的关系，以及比较结尾交给法官的任务。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"30题","raw":"### A. the Constitution should be implemented flexibly\n\n> 宪法应当灵活地实施。\n\n把A接回题干，它说的是：作者引用克尔的比较，是要说明宪法应当灵活实施。\n\nA说宪法应灵活实施。末段的`novel applications`说新的运用，我们再看汽车和数字信息两端各要求法官做什么。\n\n> technology sometimes demands novel applications of the Constitution’s protections.\n\n> The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n\n当汽车成为新的个人领域，法官就要为它明确新规则；现在数字信息出现，又要弄清第四修正案怎样适用。\n\n同样的宪法保护面对不同事物，具体规则需要调整，不能把过去对别的东西的处理直接套过来。A用灵活实施来概括这一点，可以接上。\n\n但“灵活”还比较宽：是执法时灵活处理，还是法官需要重新说明法律适用范围？等会儿和B一起看比较中的`specify`与`sort out how`。\n\n**汽车和数字信息需要各自的适用规则，能否说明实施方式不能一成不变？**\n\n能。A先留下，随后再看哪项把法官这次的任务说得更具体。\n\n**第一轮判断：A保留。**","articleRects":[[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[[280,1782,752,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"30","paragraphPids":[6]},"html":"<h3>A. the Constitution should be implemented flexibly</h3>\n<blockquote><p>宪法应当灵活地实施。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者引用克尔的比较，是要说明宪法应当灵活实施。</p>\n<p>A说宪法应灵活实施。末段的<code>novel applications</code>说新的运用，我们再看汽车和数字信息两端各要求法官做什么。</p>\n<blockquote><p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>当汽车成为新的个人领域，法官就要为它明确新规则；现在数字信息出现，又要弄清第四修正案怎样适用。</p>\n<p>同样的宪法保护面对不同事物，具体规则需要调整，不能把过去对别的东西的处理直接套过来。A用灵活实施来概括这一点，可以接上。</p>\n<p>但“灵活”还比较宽：是执法时灵活处理，还是法官需要重新说明法律适用范围？等会儿和B一起看比较中的<code>specify</code>与<code>sort out how</code>。</p>\n<p><strong>汽车和数字信息需要各自的适用规则，能否说明实施方式不能一成不变？</strong></p>\n<p>能。A先留下，随后再看哪项把法官这次的任务说得更具体。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"30题","raw":"### B. new technology requires reinterpretation of the Constitution\n\n> 新技术要求重新解释宪法。\n\n把B接回题干，它说的是：作者引用克尔的比较，是要说明新技术要求重新解释宪法。\n\nB说新技术要求重新解释宪法。原文比较结尾写了`specify novel rules`和`sort out how the Fourth Amendment applies`，我们看这两件事。\n\n> technology sometimes demands novel applications of the Constitution’s protections.\n\n> The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n\n汽车成为新的个人领域以后，法官必须说明适用于它的新规则；如今又必须理清第四修正案如何用于数字信息。\n\n这里不是要求另外写一部宪法，而是要解释现有保护到了新领域究竟管哪些事情、怎样适用。B的`reinterpretation`在这里可以接到这项工作上。\n\n而且B保留了`new technology`：正是汽车和数字信息这些新情形，使原来的保护需要新的具体说明。原因和后面的任务都能接上。\n\n**理清既有宪法保护如何适用于新技术领域，能否叫作对它作新的解释？**\n\n能。B说的重新解释可以具体落在这项适用范围和规则的说明上，先留下。\n\n**第一轮判断：B保留。**","articleRects":[[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[[280,1843,917,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"30","paragraphPids":[6]},"html":"<h3>B. new technology requires reinterpretation of the Constitution</h3>\n<blockquote><p>新技术要求重新解释宪法。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者引用克尔的比较，是要说明新技术要求重新解释宪法。</p>\n<p>B说新技术要求重新解释宪法。原文比较结尾写了<code>specify novel rules</code>和<code>sort out how the Fourth Amendment applies</code>，我们看这两件事。</p>\n<blockquote><p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>汽车成为新的个人领域以后，法官必须说明适用于它的新规则；如今又必须理清第四修正案如何用于数字信息。</p>\n<p>这里不是要求另外写一部宪法，而是要解释现有保护到了新领域究竟管哪些事情、怎样适用。B的<code>reinterpretation</code>在这里可以接到这项工作上。</p>\n<p>而且B保留了<code>new technology</code>：正是汽车和数字信息这些新情形，使原来的保护需要新的具体说明。原因和后面的任务都能接上。</p>\n<p><strong>理清既有宪法保护如何适用于新技术领域，能否叫作对它作新的解释？</strong></p>\n<p>能。B说的重新解释可以具体落在这项适用范围和规则的说明上，先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"30题","raw":"### C. California’s argument violates principles of the Constitution\n\n> 加利福尼亚州的论点违反宪法原则。\n\n把C接回题干，它说的是：作者引用克尔的比较，是要说明加州论点违反宪法原则。\n\nC说加州论点违背宪法原则。段首确实要求不全盘接受加州论点，但我们要继续看克尔的汽车比较实际说明了什么。\n\n> But the justices should not swallow California’s argument whole.\n\n> The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n\n比较先说过去汽车成为新的个人领域，法官因此要制定新规则；再说现在数字信息出现，法官也应理清适用办法。\n\n它在回答法官面对新事物要做什么，并没有拿加州论点逐条与宪法原则核对，再得出“违宪”的裁定。\n\n不全盘接受一个论点，可以是它把手机和钱包比得不合适，也可以是它不足以处理新情形。不能把作者的反对直接扩大成违反宪法原则，更不能说汽车的比较已经证明了这一点。\n\n**汽车的比较说明了制定新适用规则的需要，是否同时判定加州论点违反宪法原则？**\n\n没有。C把作者的反对改成了这项比较并未证明的违宪结论。\n\n**第一轮判断：C排除。**","articleRects":[[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[[280,1904,921,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"30","paragraphPids":[6]},"html":"<h3>C. California’s argument violates principles of the Constitution</h3>\n<blockquote><p>加利福尼亚州的论点违反宪法原则。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者引用克尔的比较，是要说明加州论点违反宪法原则。</p>\n<p>C说加州论点违背宪法原则。段首确实要求不全盘接受加州论点，但我们要继续看克尔的汽车比较实际说明了什么。</p>\n<blockquote><p>But the justices should not swallow California’s argument whole.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>比较先说过去汽车成为新的个人领域，法官因此要制定新规则；再说现在数字信息出现，法官也应理清适用办法。</p>\n<p>它在回答法官面对新事物要做什么，并没有拿加州论点逐条与宪法原则核对，再得出“违宪”的裁定。</p>\n<p>不全盘接受一个论点，可以是它把手机和钱包比得不合适，也可以是它不足以处理新情形。不能把作者的反对直接扩大成违反宪法原则，更不能说汽车的比较已经证明了这一点。</p>\n<p><strong>汽车的比较说明了制定新适用规则的需要，是否同时判定加州论点违反宪法原则？</strong></p>\n<p>没有。C把作者的反对改成了这项比较并未证明的违宪结论。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"30题","raw":"### D. principles of the Constitution should never be altered\n\n> 宪法原则永远不应被改变。\n\n把D接回题干，它说的是：作者引用克尔的比较，是要说明宪法原则永远不应改变。\n\nD强调原则永远不能变。原文比较中反复出现的却是`novel applications`、`novel rules`，我们看作者借此要求什么。\n\n> technology sometimes demands novel applications of the Constitution’s protections.\n\n> The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n\n作者没有在这里讨论以后任何情况下能不能修改宪法原则。他说的是，当新的个人领域出现，现有的保护需要新的适用说明。\n\n汽车那一端已经要求法官明确新规则，数字信息这一端又要求法官理清第四修正案怎样用。比较一路推进到这项当前任务。\n\nD只说原则永不改变，把具体的新规则和新适用问题都放掉了。即使现有保护继续存在，也不能由此推出文章强调的就是“永远不得改变”。\n\n**这项比较要推动法官说明新情形中的适用规则，还是论证宪法原则在任何时候都不能改？**\n\n是前者。D的“永远”没有被讨论，也没有回答比较最后提出的任务。\n\n**第一轮判断：D排除。**","articleRects":[[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[[280,1965,827,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"30","paragraphPids":[6]},"html":"<h3>D. principles of the Constitution should never be altered</h3>\n<blockquote><p>宪法原则永远不应被改变。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者引用克尔的比较，是要说明宪法原则永远不应改变。</p>\n<p>D强调原则永远不能变。原文比较中反复出现的却是<code>novel applications</code>、<code>novel rules</code>，我们看作者借此要求什么。</p>\n<blockquote><p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>作者没有在这里讨论以后任何情况下能不能修改宪法原则。他说的是，当新的个人领域出现，现有的保护需要新的适用说明。</p>\n<p>汽车那一端已经要求法官明确新规则，数字信息这一端又要求法官理清第四修正案怎样用。比较一路推进到这项当前任务。</p>\n<p>D只说原则永不改变，把具体的新规则和新适用问题都放掉了。即使现有保护继续存在，也不能由此推出文章强调的就是“永远不得改变”。</p>\n<p><strong>这项比较要推动法官说明新情形中的适用规则，还是论证宪法原则在任何时候都不能改？</strong></p>\n<p>是前者。D的“永远”没有被讨论，也没有回答比较最后提出的任务。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"30题","raw":"### 30题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n暂时保留：A、B。\n\n第一遍留下A、B。A概括为实施方式随新领域调整；B也可能表达法官为新情形明确宪法含义及适用规则的任务。","articleRects":[],"questionRects":[[226,1720,776,38],[280,1782,752,37],[280,1843,917,38],[280,1904,921,38],[280,1965,827,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"30"},"html":"<h3>30题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一遍留下A、B。A概括为实施方式随新领域调整；B也可能表达法官为新情形明确宪法含义及适用规则的任务。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | protect your digital data；without a warrant | 以“protect your digital data”提出宪法保护数字数据的问题，再用“search the contents of a mobile phone without a warrant”说明待裁定的是逮捕时无搜查令查看手机内容；后文由此展开规则之争。 | 提出逮捕时能否无令状查看手机内容的问题。 |\n| 第2段 | refrain from a **[xxx]** ruling；for judges to assess | 加州请求法官“refrain from a **[xxx]** ruling”，尤其避免推翻逮捕时可搜查的旧假设，并称“for judges to assess”新技术影响很困难；这一段提出需要作者回应的理由，裁决性质和被搜查对象的具体词仍不清楚。 | 交代加州支持旧做法的理由，为作者回应提供对象。 |\n| 第3段 | can and should provide updated guidelines | 作者明确说法官“can and should provide updated guidelines”，把前段的判断困难转为现在仍能提出更新规则的要求；“**[xxx]** modest”的完整评价不能确定。 | 回应新技术难判断的理由，明确法院仍应更新指南。 |\n| 第4段 | entering his or her home；reading history, financial history, medical history | 作者要求“discarding California’s”有关手机与手提包相似的论点，并以“entering his or her home”比拟查看手机；阅读、财务、医疗及通信记录说明手机承载的私人资料，云计算使查看更容易，从而为更新规则提供具体理由。 | 用手机承载的私人资料解释为何需要区别于普通随身物件。 |\n| 第5段 | a requirement of normal life；private documents to remain private | “a requirement of normal life”说明在设备上保存敏感信息日益成为生活需要，“private documents to remain private”则提出即使如此仍应保有隐私；由手机中的具体资料推进到公民保护权利。 | 从资料存储的现实转向公民仍应保有的隐私权。 |\n| 第6段 | the challenge of line-drawing；more freedom | “the challenge of line-drawing”承接前段权利原则，讨论搜查令、紧迫情形和警方“more freedom”的具体边界；取得令状是否过于**[xxx]**及等待期间数据不被**[xxx]**的完整意思未知，但原则落到执法规则仍需划界的关系明确。 | 把权利原则推进到具体执法界限。 |\n| 第7段 | should not swallow California’s argument whole；novel applications | “should not swallow California’s argument whole”在承认执法空间后重申不能全盘采纳加州主张；“novel applications of the Constitution’s protections”和汽车时代的新规则共同支持现在厘清第四修正案如何适用于数字信息，收束全文。 | 借历史比较说明新情形需要新的适用规则，回到全文问题。 |\n\n全文观点：手机承载私人资料，数字信息的搜查不能直接沿用翻查随身物件的比较。法院应明确、更新宪法保护在数字领域中的适用规则，并处理隐私保护与紧急执法等情形之间的界限。","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37],[274,423,1117,38],[202,470,1194,38],[202,517,1189,38],[202,563,1159,38],[273,610,1113,38],[202,657,1194,38],[203,704,1076,37],[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38],[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38],[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>protect your digital data；without a warrant</td><td>以“protect your digital data”提出宪法保护数字数据的问题，再用“search the contents of a mobile phone without a warrant”说明待裁定的是逮捕时无搜查令查看手机内容；后文由此展开规则之争。</td><td>提出逮捕时能否无令状查看手机内容的问题。</td></tr><tr><td>第2段</td><td>refrain from a <strong>[xxx]</strong> ruling；for judges to assess</td><td>加州请求法官“refrain from a <strong>[xxx]</strong> ruling”，尤其避免推翻逮捕时可搜查的旧假设，并称“for judges to assess”新技术影响很困难；这一段提出需要作者回应的理由，裁决性质和被搜查对象的具体词仍不清楚。</td><td>交代加州支持旧做法的理由，为作者回应提供对象。</td></tr><tr><td>第3段</td><td>can and should provide updated guidelines</td><td>作者明确说法官“can and should provide updated guidelines”，把前段的判断困难转为现在仍能提出更新规则的要求；“<strong>[xxx]</strong> modest”的完整评价不能确定。</td><td>回应新技术难判断的理由，明确法院仍应更新指南。</td></tr><tr><td>第4段</td><td>entering his or her home；reading history, financial history, medical history</td><td>作者要求“discarding California’s”有关手机与手提包相似的论点，并以“entering his or her home”比拟查看手机；阅读、财务、医疗及通信记录说明手机承载的私人资料，云计算使查看更容易，从而为更新规则提供具体理由。</td><td>用手机承载的私人资料解释为何需要区别于普通随身物件。</td></tr><tr><td>第5段</td><td>a requirement of normal life；private documents to remain private</td><td>“a requirement of normal life”说明在设备上保存敏感信息日益成为生活需要，“private documents to remain private”则提出即使如此仍应保有隐私；由手机中的具体资料推进到公民保护权利。</td><td>从资料存储的现实转向公民仍应保有的隐私权。</td></tr><tr><td>第6段</td><td>the challenge of line-drawing；more freedom</td><td>“the challenge of line-drawing”承接前段权利原则，讨论搜查令、紧迫情形和警方“more freedom”的具体边界；取得令状是否过于<strong>[xxx]</strong>及等待期间数据不被<strong>[xxx]</strong>的完整意思未知，但原则落到执法规则仍需划界的关系明确。</td><td>把权利原则推进到具体执法界限。</td></tr><tr><td>第7段</td><td>should not swallow California’s argument whole；novel applications</td><td>“should not swallow California’s argument whole”在承认执法空间后重申不能全盘采纳加州主张；“novel applications of the Constitution’s protections”和汽车时代的新规则共同支持现在厘清第四修正案如何适用于数字信息，收束全文。</td><td>借历史比较说明新情形需要新的适用规则，回到全文问题。</td></tr></tbody></table>\n<p>全文观点：手机承载私人资料，数字信息的搜查不能直接沿用翻查随身物件的比较。法院应明确、更新宪法保护在数字领域中的适用规则，并处理隐私保护与紧急执法等情形之间的界限。</p>\n"},{"section":"进阶回查","raw":"## 回查26题：B还是D？\n\nB. check suspects’ phone contents without being authorized\n\nD. **[xxx]** suspects from using their mobile phones\n\nB说法院要判断警方未获搜查授权就查看手机内容是否合法。D开头的动作仍没读懂，能读出的部分说到嫌疑人使用手机。\n\n读完后面，文章到底持续在问什么？第4段先把查看手机比作进入家中，列出手机里的阅读、财务、医疗和通信资料。第5段再说：\n\n> keeping sensitive information on these devices is increasingly a requirement of normal life\n>\n> Citizens still have a right to expect private documents to remain private\n\n把资料放在手机里已经是正常生活的需要，但资料仍应私密。接着第6段讨论：\n\n> to obtain a warrant to search through phone contents\n>\n> while waiting for a warrant\n\n警察需不需要搜查令，等待搜查令时能做什么，才是后面不断细分的问题。法院不是要一般地决定嫌疑人怎么使用手机，而是要明确警方进入这些私人资料的条件。\n\n回到首段：\n\n> whether police can search the contents of a mobile phone without a warrant\n\nB把查看的对象和缺少的许可都保留了。D虽然仍有词未读清，但已知部分落在嫌疑人使用手机上，没有B这样完整对应警方搜查内容这一问题。\n\n**全文从私人资料讲到搜查令，一直要求法院明确的是哪件事？**\n\n是警方在什么条件下可以查看手机内容。B有首段完整对应，也接上后面的讨论，因此选B。D的遮挡词仍不补译。\n\n> **26题选B。**","articleRects":[[273,283,1123,38],[202,330,1194,38],[202,377,1068,37],[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38],[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38]],"questionRects":[[226,190,1195,38],[281,255,31,26],[280,312,827,38],[280,373,874,38],[280,435,797,38],[280,496,761,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","D"],"newEvidencePids":[4,5,6],"finalChoice":"B","qid":"26","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查26题：B还是D？</h2>\n<p>B. check suspects’ phone contents without being authorized</p>\n<p>D. <strong>[xxx]</strong> suspects from using their mobile phones</p>\n<p>B说法院要判断警方未获搜查授权就查看手机内容是否合法。D开头的动作仍没读懂，能读出的部分说到嫌疑人使用手机。</p>\n<p>读完后面，文章到底持续在问什么？第4段先把查看手机比作进入家中，列出手机里的阅读、财务、医疗和通信资料。第5段再说：</p>\n<blockquote><p>keeping sensitive information on these devices is increasingly a requirement of normal life</p>\n<p>Citizens still have a right to expect private documents to remain private</p>\n</blockquote>\n<p>把资料放在手机里已经是正常生活的需要，但资料仍应私密。接着第6段讨论：</p>\n<blockquote><p>to obtain a warrant to search through phone contents</p>\n<p>while waiting for a warrant</p>\n</blockquote>\n<p>警察需不需要搜查令，等待搜查令时能做什么，才是后面不断细分的问题。法院不是要一般地决定嫌疑人怎么使用手机，而是要明确警方进入这些私人资料的条件。</p>\n<p>回到首段：</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<p>B把查看的对象和缺少的许可都保留了。D虽然仍有词未读清，但已知部分落在嫌疑人使用手机上，没有B这样完整对应警方搜查内容这一问题。</p>\n<p><strong>全文从私人资料讲到搜查令，一直要求法院明确的是哪件事？</strong></p>\n<p>是警方在什么条件下可以查看手机内容。B有首段完整对应，也接上后面的讨论，因此选B。D的遮挡词仍不补译。</p>\n<blockquote><p><strong>26题选B。</strong></p>\n</blockquote>\n"},{"section":"进阶回查","raw":"## 回查29题：C还是D？\n\nC. phones are used to store **[xxx]** information\n\nD. citizens’ privacy is not effectively protected\n\nC说手机存储某种信息，信息性质仍未读懂；D说隐私未获有效保护。第一遍存储事实和保护难题都能找到，现在要分清作者担心哪件事。\n\n第5段先说：\n\n> keeping sensitive information on these devices is increasingly a requirement of normal life\n\n作者把存储敏感信息写成正常生活越来越离不开的事情。随即接：\n\n> Citizens still have a right to expect private documents to remain private\n\n即使资料放进手机，公民仍有权要求它们保持私密。这里的`still`把作者真正坚持的要求带了出来。\n\n第6段继续说：\n\n> stating that principle doesn’t ease the challenge of line-drawing\n\n说出了权利原则，还要解决边界。该不该拿搜查令，什么紧急情形可以例外，警方还能争取多少行动空间，都关系到保护是否真正有效。\n\n再接回前面的要求和末段：\n\n> provide updated guidelines\n>\n> novel applications of the Constitution’s protections\n\n作者要法院补足的是保护规则。若他的担心仅仅是手机被拿来存储资料，后面应该继续讨论如何少存、不要存；实际文章承认存储是生活需要，然后不断要求明确搜查边界。\n\n**作者是把正常存储本身当成要解决的问题，还是担心存下来的私人资料没有得到足够保护？**\n\n是后者。C里的信息性质仍不知道，但它说完“手机用于存储”就停了；D接住了作者随后提出的保护要求和落实困难。\n\n> **29题选D。**","articleRects":[[274,1171,1122,38],[203,1218,1193,37],[202,1264,1194,38],[202,1311,1005,38],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38],[273,610,1113,38],[202,657,1194,38],[203,704,1076,37],[274,750,1122,38],[202,797,1189,38],[203,844,1193,38],[202,891,1194,37],[203,937,1193,38],[202,984,1189,38],[202,1031,1195,37],[202,1076,1194,39],[202,1124,524,38],[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38]],"questionRects":[[226,1353,898,38],[281,1414,667,38],[280,1475,720,38],[280,1537,717,37],[280,1598,691,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[3,4,7],"finalChoice":"D","qid":"29","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查29题：C还是D？</h2>\n<p>C. phones are used to store <strong>[xxx]</strong> information</p>\n<p>D. citizens’ privacy is not effectively protected</p>\n<p>C说手机存储某种信息，信息性质仍未读懂；D说隐私未获有效保护。第一遍存储事实和保护难题都能找到，现在要分清作者担心哪件事。</p>\n<p>第5段先说：</p>\n<blockquote><p>keeping sensitive information on these devices is increasingly a requirement of normal life</p>\n</blockquote>\n<p>作者把存储敏感信息写成正常生活越来越离不开的事情。随即接：</p>\n<blockquote><p>Citizens still have a right to expect private documents to remain private</p>\n</blockquote>\n<p>即使资料放进手机，公民仍有权要求它们保持私密。这里的<code>still</code>把作者真正坚持的要求带了出来。</p>\n<p>第6段继续说：</p>\n<blockquote><p>stating that principle doesn’t ease the challenge of line-drawing</p>\n</blockquote>\n<p>说出了权利原则，还要解决边界。该不该拿搜查令，什么紧急情形可以例外，警方还能争取多少行动空间，都关系到保护是否真正有效。</p>\n<p>再接回前面的要求和末段：</p>\n<blockquote><p>provide updated guidelines</p>\n<p>novel applications of the Constitution’s protections</p>\n</blockquote>\n<p>作者要法院补足的是保护规则。若他的担心仅仅是手机被拿来存储资料，后面应该继续讨论如何少存、不要存；实际文章承认存储是生活需要，然后不断要求明确搜查边界。</p>\n<p><strong>作者是把正常存储本身当成要解决的问题，还是担心存下来的私人资料没有得到足够保护？</strong></p>\n<p>是后者。C里的信息性质仍不知道，但它说完“手机用于存储”就停了；D接住了作者随后提出的保护要求和落实困难。</p>\n<blockquote><p><strong>29题选D。</strong></p>\n</blockquote>\n"},{"section":"进阶回查","raw":"## 回查30题：A还是B？\n\nA. the Constitution should be implemented flexibly\n\nB. new technology requires reinterpretation of the Constitution\n\nA说宪法应灵活实施，B说新技术要求对宪法作新的解释。第一遍两者都能和新规则联系起来，现在回到比较里看法官具体要做哪件事。\n\n第2段加州的理由是新技术变化快、影响难判断，第3段作者却要求：\n\n> the justices can and should provide updated guidelines\n\n法官不能因为新情形难处理，就不说明怎样适用保护。第6段又说仅表明原则还不足以解决划界。末段的比较正是接着这个任务写的：\n\n> The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.\n\n过去汽车带来新的个人领域，法官要明确新规则；现在数字信息带来新的情形，法官要理清第四修正案怎么适用。两端共同写出的，不只是处理事情时灵活一点，而是把现有宪法保护在新领域中的含义和适用范围说明白。\n\nA的灵活实施没有把这个具体任务说出来。B的重新解释，在这里就是说明既有条文到了新技术情形中如何适用，也保留了使这项工作变得必要的新技术。\n\n**比较结尾让法官做的是一般地灵活办事，还是明确第四修正案怎样用于新出现的数字信息？**\n\n是后者。B同时接上新技术和新的适用解释，更准确地说出了汽车与数字信息这项比较的共同点。\n\n> **30题选B。**","articleRects":[[274,1685,1117,38],[202,1732,1194,37],[202,1778,1194,38],[202,1825,1194,38],[202,1872,1194,37],[202,1919,1194,37],[202,1965,799,38],[274,423,1117,38],[202,470,1194,38],[202,517,1189,38],[202,563,1159,38],[273,610,1113,38],[202,657,1194,38],[203,704,1076,37],[274,1358,1125,38],[202,1404,1194,38],[202,1451,1194,38],[202,1498,1194,38],[202,1545,1195,38],[202,1591,1193,38],[202,1638,1005,38]],"questionRects":[[226,1720,776,38],[280,1782,752,37],[280,1843,917,38],[280,1904,921,38],[280,1965,827,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","B"],"newEvidencePids":[2,3,6],"finalChoice":"B","qid":"30","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查30题：A还是B？</h2>\n<p>A. the Constitution should be implemented flexibly</p>\n<p>B. new technology requires reinterpretation of the Constitution</p>\n<p>A说宪法应灵活实施，B说新技术要求对宪法作新的解释。第一遍两者都能和新规则联系起来，现在回到比较里看法官具体要做哪件事。</p>\n<p>第2段加州的理由是新技术变化快、影响难判断，第3段作者却要求：</p>\n<blockquote><p>the justices can and should provide updated guidelines</p>\n</blockquote>\n<p>法官不能因为新情形难处理，就不说明怎样适用保护。第6段又说仅表明原则还不足以解决划界。末段的比较正是接着这个任务写的：</p>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>过去汽车带来新的个人领域，法官要明确新规则；现在数字信息带来新的情形，法官要理清第四修正案怎么适用。两端共同写出的，不只是处理事情时灵活一点，而是把现有宪法保护在新领域中的含义和适用范围说明白。</p>\n<p>A的灵活实施没有把这个具体任务说出来。B的重新解释，在这里就是说明既有条文到了新技术情形中如何适用，也保留了使这项工作变得必要的新技术。</p>\n<p><strong>比较结尾让法官做的是一般地灵活办事，还是明确第四修正案怎样用于新出现的数字信息？</strong></p>\n<p>是后者。B同时接上新技术和新的适用解释，更准确地说出了汽车与数字信息这项比较的共同点。</p>\n<blockquote><p><strong>30题选B。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**26. B**\n\n**27. C**\n\n**28. A**\n\n**29. D**\n\n**30. B**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. C</strong></p>\n<p><strong>28. A</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. B</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRlabBABXRUJQVlA4TEqbBAAvV0Y1AlWThEaSJEmy9OWPOrP6XgARMQHz/8avhTaSr2sXgrlVSqefHx9LlyVzS6ci+XKLWHud2eucjTYRsmemygole2ZGEhQeHumma5aK7F6YILUU5u6pFvlYoahg7iupkrhK9crCEmUnmLsnUeRjsQR5pwo6MHdZ3cieGTs7kj2rkghVmF2KSpWcy5394U4prefMiEXMb/T+Pf2uv5oX9v/vTfknaXdO3dszu9O9PdO929OHme3DzPSc+rDdcz50786me+b/n57pnuwcd+eQ0/acujc7vbvT27M75+nTHuaw3Tvnme1s72x6D9O7nTn9e7Zne2cnPdMz3TOzPd2zxznv9OS/Peedndk5iLo+n8/3UAX3XXXfv7kxKAxBYUiJQmEICoMChSGXAIUhiAoGBQqDIhgUJSoYFCgMimBQlKhgUASDwhAMihIVDIogXigMwaDIlVRQGIIoFIZgUChQGFKiUBiCwqBAYUiJCgYFCoMChSElCAYF4goGRTAoLlHBoEBUMCiCQWEqGBSppILCkDIoDMGgSCUVFIZgUBiCwpAShcIQxIXCEBSGvAUoDClRwaBAYVCgMKREBYMCxR5QBIOiRAWDAoVBEQyKEgSDIiQVFIZg2BOmgkGRSiooDMGgMASFISUKhSEOIklS5HQKOV64u2fmeQeRJClS+jd2z8y0cDT7KvrvgbbtOpIkSdrw8gq1NDMHQRD8qyqgIIXCEJIkyYr8qVfgno7eJ/39/f39XTai/wzbtg3DfWIn2eaF/f97U79JyvROz3RmJ9nu9OxMtmd6ejrT597pnkO655Tt7e7Znu2evnt7Tps+bCd3z+ycurM992R37pnZzuxhDpuZnt5k0rOTmRx3tjObyc72HmaS3s3M3j176Jk9d/cc0nPPno9z2u3pzszO9h57V9T1eX++3+uqgt+v77ln/hgUhqAwpEShMASFQYHCkEuAwhBEBYMChUERDIoSFQwKFAZVwaAoUcGgSBkUhmBQlKhgUAT
