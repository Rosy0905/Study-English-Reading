都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>26题题干</h2>\n<p><strong>The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.</strong></p>\n<blockquote><p>最高法院将裁定，在逮捕过程中，做什么是否合法？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>27题题干</h2>\n<p><strong>The author’s attitude toward California’s argument is one of ______.</strong></p>\n<blockquote><p>作者对加利福尼亚州的论点持什么态度？</p>\n</blockquote>\n<p>题型：<strong>态度题</strong>。</p>\n\n<hr />\n<h2>28题题干</h2>\n<p><strong>The author believes that exploring one’s phone contents is comparable to ______.</strong></p>\n<blockquote><p>作者认为，查看某人的手机内容可以比作什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>29题题干</h2>\n<p><strong>In Paragraphs 5 and 6, the author shows his concern that  ______.</strong></p>\n<blockquote><p>在第5、6段，作者对什么问题表示关切？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n\n<hr />\n<h2>30题题干</h2>\n<p><strong>Orin Kerr’s comparison is quoted to indicate that ______.</strong></p>\n<blockquote><p>引用奥林·克尔的比较，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例证作用题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, though, Or</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>private, protected, unreasonable</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>search, protect, apply</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>implications, challenge, freedom</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>digital data, police, Constitution</td></tr></tbody></table>\n\n<hr />\n<p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n\n<hr />\n<p>Just how much does the Constitution protect your digital data? / The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n\n<hr />\n<p>Just how much does the Constitution 保护你的数字数据？ / 最高法院 现在将考虑 警察是否可以搜查 the contents of a mobile phone 在没有搜查令的情况下 if the phone is on or around a person during an arrest.</p>\n\n<hr />\n<p>1、保护你的数字数据、最高法院、现在将考虑、警察是否可以搜查、在没有搜查令的情况下。</p>\n\n<hr />\n<p>California has asked the justices to refrain from a <strong>[xxx]</strong> ruling, particularly one that upsets the old assumption that authorities may search through the <strong>[xxx]</strong> of suspects at the time of their arrest. It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n\n<hr />\n<p>California has asked the justices to refrain from a <strong>[xxx]</strong> ruling, / particularly one that upsets the old assumption that authorities may search through the <strong>[xxx]</strong> of suspects at the time of their arrest. / It is hard, / the state argues, / for judges to assess the implications of new and rapidly changing technologies.</p>\n\n<hr />\n<p>加利福尼亚州已请求法官们 to refrain from a <strong>[xxx]</strong> ruling, / particularly one that upsets the old assumption that authorities may search through the <strong>[xxx]</strong> of suspects at the time of their arrest. / 这很困难， / the state argues, / 对法官来说，要评估 the implications of new and rapidly changing technologies.</p>\n\n<hr />\n<p>2、加利福尼亚州已请求法官们、这很困难、对法官来说、要评估。</p>\n\n<hr />\n<p>The court would be <strong>[xxx]</strong> modest if it followed California’s advice. Enough of the implications are <strong>[xxx]</strong>, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n\n<hr />\n<p>The court would be <strong>[xxx]</strong> modest if it followed California’s advice. / Enough of the implications are <strong>[xxx]</strong>, even obvious, / so that the justices can and should provide updated guidelines to police, / lawyers and defendants.</p>\n\n<hr />\n<p>法院将是 <strong>[xxx]</strong> modest if it followed California’s advice. / Enough of the implications are <strong>[xxx]</strong>, even obvious, / so that the justices 能够而且应该 提供更新的指导原则 to police, / lawyers and defendants.</p>\n\n<hr />\n<p>3、法院将是、能够而且应该、提供更新的指导原则。</p>\n\n<hr />\n<p>They should start by discarding California’s <strong>[xxx]</strong> argument that exploring the contents of a smartphone—a vast <strong>[xxx]</strong> of digital information—is similar to, say, going through a suspect’s purse. The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or <strong>[xxx]</strong> of an <strong>[xxx]</strong> without a warrant. But exploring one’s smartphone is more like entering his or her home. A smartphone may contain an arrestee’s reading history, financial history, medical history and <strong>[xxx]</strong> records of recent correspondence. The development of “cloud computing,” meanwhile, has made that exploration so much the easier.</p>\n\n<hr />\n<p>They should start by discarding California’s <strong>[xxx]</strong> argument that exploring the contents of a smartphone — / a vast <strong>[xxx]</strong> of digital information — / is similar to, say, / going through a suspect’s purse. / The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or <strong>[xxx]</strong> of an <strong>[xxx]</strong> without a warrant. / But exploring one’s smartphone is more like entering his or her home. / A smartphone may contain an arrestee’s reading history, financial history, / medical history and <strong>[xxx]</strong> records of recent correspondence. / The development of “cloud computing,” meanwhile, / has made that exploration so much the easier.</p>\n\n<hr />\n<p>他们应该首先 通过抛弃加州的 <strong>[xxx]</strong> 论点 that exploring the contents of a smartphone — / a vast <strong>[xxx]</strong> of digital information — / is similar to, say, / going through a suspect’s purse. / The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or <strong>[xxx]</strong> of an <strong>[xxx]</strong> without a warrant. / 但查看某人的智能手机 更像是 进入他或她的家。 / A smartphone may contain an arrestee’s reading history, financial history, / medical history and <strong>[xxx]</strong> records of recent correspondence. / The development of “cloud computing,” meanwhile, / has made that exploration so much the easier.</p>\n\n<hr />\n<p>4、他们应该首先、通过抛弃加州的、论点、但查看某人的智能手机、更像是、进入他或她的家。</p>\n\n<hr />\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n\n<hr />\n<p>Americans should take steps to protect their digital privacy. / But keeping sensitive information on these devices is increasingly a requirement of normal life. / Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n\n<hr />\n<p>美国人应该采取措施 保护他们的数字隐私。 / But keeping sensitive information on these devices is increasingly a requirement of normal life. / Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n\n<hr />\n<p>5、美国人应该采取措施、保护他们的数字隐私。</p>\n\n<hr />\n<p>As so often is the case, stating that principle doesn’t ease the challenge of line-drawing. In many cases, it would not be overly <strong>[xxx]</strong> for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not <strong>[xxx]</strong> or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n\n<hr />\n<p>As so often is the case, / stating that principle doesn’t ease the challenge of line-drawing. / In many cases, / it would not be overly <strong>[xxx]</strong> for authorities to obtain a warrant to search through phone contents. / They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, / and they could take reasonable measures to ensure that phone data are not <strong>[xxx]</strong> or altered while waiting for a warrant. The court, though, / may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n\n<hr />\n<p>As so often is the case, / stating that principle 并未减轻划界的难题。 / In many cases, / it would not be overly <strong>[xxx]</strong> for authorities to obtain a warrant to search through phone contents. / They could still invalidate Fourth Amendment protections 当面临严重的， 紧迫的情况时， / and they could take reasonable measures to ensure that phone data are not <strong>[xxx]</strong> or altered while waiting for a warrant. 法院， 不过， / 可能希望 为警察留出余地 to cite situations where they are entitled to more freedom.</p>\n\n<hr />\n<p>6、并未减轻划界的难题、当面临严重的、紧迫的情况时、法院、不过、可能希望、为警察留出余地。</p>\n\n<hr />\n<p>But the justices should not swallow California’s argument whole. New, <strong>[xxx]</strong> technology sometimes demands novel applications of the Constitution’s protections. Orin Kerr, a law professor, compares the explosion and <strong>[xxx]</strong> of digital information in the 21st century with the establishment of automobile use as a <strong>[xxx]</strong> necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n\n<hr />\n<p>But the justices should not swallow California’s argument whole. New, / <strong>[xxx]</strong> technology sometimes demands novel applications of the Constitution’s protections. Orin Kerr, / a law professor, / compares the explosion and <strong>[xxx]</strong> of digital information in the 21st century with the establishment of automobile use as a <strong>[xxx]</strong> necessity of life in the 20th: / The justices had to specify novel rules for the new personal domain of the passenger car then; / they must sort out how the Fourth Amendment applies to digital information now.</p>\n\n<hr />\n<p>但法官们不应该 全盘接受加州的论点。 新的， / <strong>[xxx]</strong> 技术有时要求 新的运用方式 对于宪法的保护。 Orin Kerr, / a law professor, / compares the explosion and <strong>[xxx]</strong> of digital information in the 21st century with the establishment of automobile use as a <strong>[xxx]</strong> necessity of life in the 20th: / 法官们必须明确规定 新的规则 for the new personal domain of the passenger car then; / 他们必须理清 how the Fourth Amendment 适用于现在的数字信息。</p>\n\n<hr />\n<p>7、但法官们不应该、全盘接受加州的论点、新的、技术有时要求、新的运用方式、对于宪法的保护、法官们必须明确规定、新的规则、他们必须理清、适用于现在的数字信息。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到保护你的数字数据、最高法院、警察是否可以搜查、在没有搜查令的情况下；中间又出现加利福尼亚州已请求法官们、这很困难、对法官来说、要评估；法院将是、能够而且应该、能够而且应该、提供更新的指导原则；他们应该首先、通过抛弃加州的、更像是、进入他或她的家；美国人应该采取措施、保护他们的数字隐私、美国人应该采取措施、保护他们的数字隐私；并未减轻划界的难题、当面临严重的、可能希望、为警察留出余地；结尾还有但法官们不应该、全盘接受加州的论点、他们必须理清、适用于现在的数字信息。</p>\n<p>到这里还不能自然地说清楚：搜查手机为什么不能直接照搬搜钱包的做法，隐私保护与警察执法之间怎样划定界线。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n\n<hr />\n<h2>26题</h2>\n<blockquote><p>The Supreme Court will work out whether, during an arrest, it is legitimate to  ______.<br />\n最高法院将裁定，在逮捕过程中，做什么是否合法？</p>\n</blockquote>\n<p>The Supreme Court与during an arrest都出现在第1段。先完整读这一段，分清宪法保护的总问题与法院即将考虑的具体情形。</p>\n<blockquote><p>原文参考：</p>\n<p>Just how much does the Constitution protect your digital data? The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n<p>开始精读：</p>\n<p>Just how much / does the Constitution / protect your digital data? / The Supreme Court / will now consider / whether police can search / the contents of a mobile phone / without a warrant / if the phone is / on or around a person / during an arrest.</p>\n<p>究竟在多大程度上 / 宪法 / 保护你的数字数据？ / 最高法院 / 现在将考虑 / 警察是否可以搜查 / 一部手机的内容 / 在没有搜查令的情况下 / 如果手机 / 在某人身上或身边 / 在逮捕期间。</p>\n</blockquote>\n<p>空格要补出whether所引出的待裁定行为，核对谁实施行为、行为针对什么，以及没有搜查令的条件。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. search for suspects’ mobile phones without a warrant</h3>\n<blockquote><p>在没有搜查令时寻找嫌疑人的手机。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最高法院将裁定，逮捕期间警方在没有搜查令时寻找嫌疑人的手机是否合法。</p>\n<p>A中的<code>search for</code>后面接手机，原文的<code>search</code>后面接<code>the contents</code>。两处都出现搜查，我们回到第1段，看看实际找的是什么。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n<p>原文已经说手机在被捕者身上或身边，法院要考虑的是警方能不能打开它，搜查里面的内容。</p>\n<p>A的<code>search for suspects’ mobile phones</code>是寻找嫌疑人的手机，要找到的是那部手机本身。手机在哪里和手机里有什么，是两件事。</p>\n<p>两边都有<code>without a warrant</code>，但没有搜查令这一条件相同，不能把被搜查的内容也变成一样。A遗漏了原句最关键的<code>contents</code>。</p>\n<p><strong>原文是在问能不能寻找手机，还是能不能查看已经在身边的手机内容？</strong></p>\n<p>是查看手机内容。A把内容搜查改成了寻找手机。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. check suspects’ phone contents without being authorized</h3>\n<blockquote><p>在未获授权时查看嫌疑人的手机内容。</p>\n</blockquote>\n<p>把B接回题干，它说的是：最高法院将裁定，逮捕期间警方未获搜查授权就查看嫌疑人的手机内容是否合法。</p>\n<p>B有<code>phone contents</code>和<code>without being authorized</code>。我们回到第1段的<code>contents ... without a warrant</code>，逐个接上。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<p>原文中的<code>police can search</code>是警方能否搜查，搜查对象是手机的内容。B的<code>check suspects’ phone contents</code>同样让警方查看这些内容。</p>\n<p><code>without a warrant</code>说明警方没有搜查令，B用未获授权来概括这里缺少的许可。放在本题里，这个授权就是与搜查令有关的授权，不能另外扩大成警方从未获得任何执法权。</p>\n<p>题干已经保留“逮捕期间”和“法院将裁定”，B补上查看内容以及缺少许可，句子就能和原文完整接起来。</p>\n<p><strong>把B接回题干后，警方做的事和缺少的许可能否对应原句？</strong></p>\n<p>能。查看的是手机内容，缺少的是搜查授权，B留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. prevent suspects from deleting their phone contents</h3>\n<blockquote><p>阻止嫌疑人删除其手机内容。</p>\n</blockquote>\n<p>把C接回题干，它说的是：最高法院将裁定，逮捕期间警方阻止嫌疑人删除手机内容是否合法。</p>\n<p>C说<code>prevent ... deleting</code>，阻止嫌疑人删除内容。原文第1段也有<code>phone contents</code>，我们看动作是谁做的。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<p>原句让警方去<code>search</code>手机内容，法院要判断这种查看是否合法。</p>\n<p>C让嫌疑人去删除内容，警方再阻止这个删除行为。手机内容虽然没变，但一边是警方查看，另一边是阻止嫌疑人修改资料。</p>\n<p>原文问句没有说有人正在删除，也没有把保护数据不被删除列成此处待裁定的行为。不能只因为都是手机里的资料，就忽略前面的动作。</p>\n<p><strong>法院在第1段要裁定的是警方查看资料，还是警方阻止嫌疑人删除资料？</strong></p>\n<p>是警方查看资料。C换成了另一项行动。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. <strong>[xxx]</strong> suspects from using their mobile phones</h3>\n<blockquote><p><strong>[xxx]</strong>嫌疑人使用他们的手机。</p>\n</blockquote>\n<p>把D接回题干，它说的是：最高法院将裁定，逮捕期间警方<strong>[xxx]</strong>嫌疑人使用手机是否合法。</p>\n<p>D最前面的动作被挡住，只能读到<code>suspects from using their mobile phones</code>。我们先拿它与第1段警方搜查手机内容对照。</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.</p>\n</blockquote>\n<p>D里能看清的是嫌疑人和他们使用手机这件事。原文能看清的则是警方搜查手机内容，以及没有搜查令这一条件。</p>\n<p>现在还不知道D开头要求警方怎样对待嫌疑人，不能把那个<strong>[xxx]</strong>自己填成某个认识的动词。仅凭后面的<code>from using</code>也还不能把整项直接译完。</p>\n<p>B已经能完整接上原句；D先留下，后面继续看法院讨论的是让嫌疑人怎样使用手机，还是警方对内容的搜查权限。</p>\n<p><strong>D开头的动作尚未读懂，现在能把它整项明确解释成法院要裁定的行为吗？</strong></p>\n<p>还不能。先和B一起留下，回头用文章持续讨论的具体行为来核对。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>26题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：B、D。</p>\n<p>第一遍留下B、D。B保持了查看内容和没有搜查授权的关系；D的核心动作尚未读清。</p>\n\n<hr />\n<h2>27题</h2>\n<blockquote><p>The author’s attitude toward California’s argument is one of ______.<br />\n作者对加利福尼亚州的论点持什么态度？</p>\n</blockquote>\n<p>California’s argument指向第2段加州向法官提出的请求；第3段以California’s advice继续谈这项建议。依次完整读这两段，分清该州的理由与作者的回应。</p>\n<blockquote><p>原文参考：</p>\n<p>California has asked the justices to refrain from a <strong>[xxx]</strong> ruling, particularly one that upsets the old assumption that authorities may search through the <strong>[xxx]</strong> of suspects at the time of their arrest. It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n<p>开始精读：</p>\n<p>California has asked the justices / to refrain from a <strong>[xxx]</strong> ruling, / particularly one that upsets / the old assumption / that authorities may search through / the <strong>[xxx]</strong> of suspects / at the time of their arrest. / It is hard, / the state argues, / for judges to assess / the implications of / new and rapidly changing technologies.</p>\n<p>加利福尼亚州已请求法官们 / 避免作出<strong>[xxx]</strong>裁决， / 尤其是会推翻 / 那个旧假设的裁决 / 即当局可以搜查 / 嫌疑人的<strong>[xxx]</strong> / 在逮捕他们的时候。 / 这很困难， / 该州辩称， / 对法官来说，要评估 / 其影响 / 新出现且迅速变化的技术。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The court would be <strong>[xxx]</strong> modest if it followed California’s advice. Enough of the implications are <strong>[xxx]</strong>, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n<p>开始精读：</p>\n<p>The court would be <strong>[xxx]</strong> modest / if it followed California’s advice. / Enough of the implications / are <strong>[xxx]</strong>, even obvious, / so that the justices / can and should / provide updated guidelines / to police, lawyers and defendants.</p>\n<p>法院将是<strong>[xxx]</strong>谦逊的 / 如果它听从加州的建议。 / 其中足够多的影响 / 是<strong>[xxx]</strong>的，甚至显而易见， / 因此法官们 / 能够而且应该 / 提供更新的指导原则 / 给警察、律师和被告。</p>\n</blockquote>\n<p>attitude要求概括作者怎样对待加州的论点，要核对评价是谁作出的、针对谁的主张，而不是只摘取一处表示困难的词。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. tolerance</h3>\n<blockquote><p>宽容。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对加州论点持宽容态度。</p>\n<p>A说宽容。第3段的<code>modest</code>前面有词没看懂，我们继续读到下一段的<code>discarding California’s ... argument</code>，看作者让法官怎样对待这个论点。</p>\n<blockquote><p>原文参考：</p>\n<p>They should start by discarding California’s <strong>[xxx]</strong> argument that exploring the contents of a smartphone—a vast <strong>[xxx]</strong> of digital information—is similar to, say, going through a suspect’s purse. The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or <strong>[xxx]</strong> of an <strong>[xxx]</strong> without a warrant. But exploring one’s smartphone is more like entering his or her home. A smartphone may contain an arrestee’s reading history, financial history, medical history and <strong>[xxx]</strong> records of recent correspondence. The development of “cloud computing,” meanwhile, has made that exploration so much the easier.</p>\n<p>开始精读：</p>\n<p>They should start / by discarding California’s <strong>[xxx]</strong> argument / that exploring the contents / of a smartphone—a vast <strong>[xxx]</strong> / of digital information—is similar to, / say, going through a suspect’s purse. / The court has ruled / that police don’t violate / the Fourth Amendment / when they go through the wallet / or <strong>[xxx]</strong> of an <strong>[xxx]</strong> / without a warrant. / But exploring one’s smartphone / is more like / entering his or her home. / A smartphone may contain / an arrestee’s reading history, / financial history, medical history / and <strong>[xxx]</strong> records / of recent correspondence. / The development of “cloud computing,” / meanwhile, has made that exploration / so much the easier.</p>\n<p>他们应该首先 / 抛弃加州的<strong>[xxx]</strong>论点 / 即查看这些内容 / 一部智能手机——庞大的<strong>[xxx]</strong> / 数字信息的——类似于， / 比如翻查嫌疑人的手提包。 / 法院已经裁定 / 警察并不违反 / 第四修正案 / 当他们翻查钱包 / 或某个<strong>[xxx]</strong>的<strong>[xxx]</strong> / 在没有搜查令的情况下。 / 但查看某人的智能手机 / 更像是 / 进入他或她的家。 / 一部智能手机可能包含 / 被捕者的阅读记录， / 财务记录、医疗记录 / 以及<strong>[xxx]</strong>的记录 / 关于最近的通信。 / “云计算”的发展， / 与此同时，已使这种查看 / 容易了很多。</p>\n</blockquote>\n<blockquote><p>The court would be <strong>[xxx]</strong> modest if it followed California’s advice.</p>\n</blockquote>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p>第3段要求法官能够而且应该提供新指南。下一段又进一步说，首先就应该丢开加州的这项论点。</p>\n<p><code>discarding</code>不是让这个论点暂时存在、对它宽容一些，而是让法官不再采用它。后面作者还自己提出了查看手机更像进入住宅的比较。</p>\n<p>所以，即使<code>modest</code>前的修饰没读懂，后面已经有明确的做法：加州这项论点应该被放弃。A的宽容接不上这种要求。</p>\n<p><strong>作者要求法官首先抛弃这个论点，还能把他的态度概括成宽容吗？</strong></p>\n<p>不能。<code>discarding</code>已经表明他不接受这一论点。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. indifference</h3>\n<blockquote><p>漠不关心。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对加州论点漠不关心。</p>\n<p>B说作者不关心。我们回到第3段的<code>can and should</code>，再接上第4段的<code>should start</code>。</p>\n<blockquote><p>the justices can and should provide updated guidelines to police, lawyers and defendants.</p>\n</blockquote>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p>作者不仅认为法官可以给出新指南，还说应该这样做。接着又提出第一步：抛弃加州把手机与手提包相提并论的说法。</p>\n<p>他正在告诉法官需要处理什么、先否定哪一点。若是漠不关心，就不会从新指南一路具体谈到该怎样比较手机内容。</p>\n<p>B说没有关切，和这些直接提出要求、逐项回应加州论点的话不符。</p>\n<p><strong>作者既要求更新指南，又明确指出先抛弃哪项论点，这像是不关心吗？</strong></p>\n<p>不像。作者已经主动给出明确的处理意见，B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. disapproval</h3>\n<blockquote><p>不赞成。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者不赞成加州论点。</p>\n<p>C说不赞成。第4段直接有<code>discarding California’s ... argument</code>，我们看<code>discarding</code>落在哪个对象上。</p>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p><code>They should start</code>里的<code>They</code>接法官，作者让他们首先做的是抛弃加州的论点。</p>\n<p>论点前有个词被挡住，但<code>discarding</code>和<code>California’s ... argument</code>都清楚。也就是说，作者已经明确不希望法官接受它，不必先猜那个修饰词是褒义还是贬义。</p>\n<p>C只说作者不赞成，没有额外说他厌恶加州或否定州的一切主张，和这里对这一论点的处理相合。</p>\n<p><strong>作者让法官把加州的这项论点抛弃，能不能说明他不赞成这项论点？</strong></p>\n<p>能。直接的弃用要求已经足以判断，C留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. cautiousness</h3>\n<blockquote><p>谨慎。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对加州论点持谨慎态度。</p>\n<p>D说谨慎。第2段确实说技术变化快、难评估，但中间插着<code>the state argues</code>。我们先分清这是谁的理由。</p>\n<blockquote><p>It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.</p>\n</blockquote>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument</p>\n</blockquote>\n<p>说难评估的是加州，它借这个理由请法官避免某种裁决。这说明的是加州希望法官怎样做。</p>\n<p>作者接着说，有足够多影响已经显而易见，法官能够且应该更新指南。随后又要求抛弃加州的论点。</p>\n<p>所以，不能把加州要求谨慎的理由，直接拿来回答作者对加州论点的态度。作者在回应并反对这一理由，而不是照着它表达谨慎。</p>\n<p><strong>认为技术难评估、希望法官少作裁决的是加州，还是作者对加州论点的回应？</strong></p>\n<p>是加州自己的理由。作者接着要求更新指南、抛弃论点，D把两人的话接错了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>27题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。作者明确要求弃用加州的一项论点，表现为不赞成。</p>\n\n<hr />\n<h2>28题</h2>\n<blockquote><p>The author believes that exploring one’s phone contents is comparable to ______.<br />\n作者认为，查看某人的手机内容可以比作什么？</p>\n</blockquote>\n<p>exploring one’s phone contents对应第4段exploring the contents of a smartphone与exploring one’s smartphone。该段已完整读过，回到同一整段，核对几处相似关系各是谁提出的。</p>\n<p>comparable to要求补出作者比较查看手机内容的另一种行为，要同时核对比喻两端和提出比较的人。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. getting into one’s residence</h3>\n<blockquote><p>进入某人的住所。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为，查看某人的手机内容就像进入这个人的住所。</p>\n<p>A说进入住所。第4段用<code>But</code>转过来之后，正有<code>more like entering his or her home</code>，我们把比较两边一起读。</p>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<p>前半句是查看某人的智能手机，后半句是进入这个人的家。作者用<code>more like</code>直接把二者相连。</p>\n<p>A的<code>getting into</code>对应<code>entering</code>，<code>one’s residence</code>对应<code>his or her home</code>。谁的手机被查看，就好比进入谁的住所，人物关系也没有变。</p>\n<p>后面列出的阅读、财务、医疗和通信记录解释了为什么这样比：手机承载很多私人生活资料。A把比较另一端准确补了出来。</p>\n<p><strong>A的进入住所，能否接上作者明确写出的<code>entering his or her home</code>？</strong></p>\n<p>能。动作和地点都对应，A留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. handling one’s <strong>[xxx]</strong> records</h3>\n<blockquote><p>处理某人的<strong>[xxx]</strong>记录。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为，查看某人的手机内容就像处理这个人的<strong>[xxx]</strong>记录。</p>\n<p>B说处理某种记录，<strong>[xxx]</strong>未读懂。我们回到第4段，分清<code>more like</code>后面接什么，以及<code>may contain</code>后面接什么。</p>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<blockquote><p>A smartphone may contain an arrestee’s reading history, financial history, medical history and <strong>[xxx]</strong> records of recent correspondence.</p>\n</blockquote>\n<p><code>more like</code>后面接的是进入家中，这才是作者直接拿来比较的行为。</p>\n<p>各种记录出现在下一句<code>A smartphone may contain</code>后面：手机里可能有这些资料。它们用于解释手机为什么涉及私人生活，并没有另立一个“查看手机就像处理某种记录”的比较。</p>\n<p>所以，即使记录的具体修饰词还不认识，B已经写出的<code>handling ... records</code>也只是处理一类资料，不能替代原句比较中的进入住宅。</p>\n<p><strong>原文把各类记录列为手机可能包含的内容，还是把处理记录写成比较的另一端？</strong></p>\n<p>是手机可能包含的内容。明确的比较另一端仍是进入住宅。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. scanning one’s correspondences</h3>\n<blockquote><p>浏览某人的通信。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为，查看某人的手机内容就像浏览这个人的通信。</p>\n<p>C说浏览通信。<code>correspondence</code>确实在第4段，我们回看它前面的<code>may contain</code>和更前面的<code>more like</code>。</p>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<blockquote><p>A smartphone may contain an arrestee’s reading history, financial history, medical history and <strong>[xxx]</strong> records of recent correspondence.</p>\n</blockquote>\n<p>手机可能含有最近通信的记录，原文把它和阅读、财务、医疗记录一起列出来。这在说明查看手机能接触到多少私人资料。</p>\n<p>作者的比较却在前一句已经说完：查看智能手机更像进入家中。通信记录是解释这份私密性的一个例子。</p>\n<p>C只拿出了其中一类内容。题干问作者把整个查看行为比作什么，不能用可能看到的一部分资料来替掉那项比较。</p>\n<p><strong>手机里可能有通信记录，是否就等于作者把查看手机比作浏览通信？</strong></p>\n<p>不等于。通信记录是所含资料之一，作者明确比较的是进入家中。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. going through one’s wallet</h3>\n<blockquote><p>翻查某人的钱包。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，查看某人的手机内容就像翻查这个人的钱包。</p>\n<p>D说翻查钱包，这一段也写了钱包和手提包。我们把段首的<code>California’s argument</code>、<code>discarding</code>以及后面的<code>But</code>连起来看。</p>\n<blockquote><p>They should start by discarding California’s <strong>[xxx]</strong> argument that exploring the contents of a smartphone—a vast <strong>[xxx]</strong> of digital information—is similar to, say, going through a suspect’s purse.</p>\n</blockquote>\n<blockquote><p>The court has ruled that police don’t violate the Fourth Amendment when they go through the wallet or <strong>[xxx]</strong> of an <strong>[xxx]</strong> without a warrant.</p>\n</blockquote>\n<blockquote><p>But exploring one’s smartphone is more like entering his or her home.</p>\n</blockquote>\n<p>把查看手机比作翻查手提包的是加州，而作者说这个论点应被抛弃。接着介绍法院以前允许无令翻查钱包，是交代旧的处理办法。</p>\n<p>随后<code>But</code>转向作者对手机的看法：它更像进入某人的家。作者之所以另换这个比较，就是因为不能直接把旧的钱包办法套到手机内容上。</p>\n<p>D把作者刚要放下的那一类钱包比较，又写成作者自己的观点。</p>\n<p><strong>钱包的比较属于作者最终采用的说法，还是他正在与手机搜查区分的旧情形？</strong></p>\n<p>是后者。作者在<code>But</code>后采用的是进入住宅的比较，D不对。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>28题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。作者明确把查看智能手机比作进入某人的家中。</p>\n\n<hr />\n<h2>29题</h2>\n<blockquote><p>In Paragraphs 5 and 6, the author shows his concern that  ______.<br />\n在第5、6段，作者对什么问题表示关切？</p>\n</blockquote>\n<p>题干直接指定Paragraphs 5 and 6，先完整读第5段，再完整读第6段，留意隐私保护原则与随后划界问题怎样相接。</p>\n<blockquote><p>原文参考：</p>\n<p>Americans should take steps to protect their digital privacy. But keeping sensitive information on these devices is increasingly a requirement of normal life. Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n<p>开始精读：</p>\n<p>Americans should take steps / to protect their digital privacy. / But keeping sensitive information / on these devices / is increasingly a requirement / of normal life. / Citizens still have a right / to expect private documents / to remain private / and protected by the Constitution’s <strong>[xxx]</strong> / on unreasonable searches.</p>\n<p>美国人应该采取措施 / 保护他们的数字隐私。 / 但保存敏感信息 / 在这些设备上 / 越来越成为一种需要 / 正常生活的需要。 / 公民仍然有权 / 期待私人文件 / 保持私密 / 并受宪法的<strong>[xxx]</strong>保护 / 关于不合理的搜查。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>As so often is the case, stating that principle doesn’t ease the challenge of line-drawing. In many cases, it would not be overly <strong>[xxx]</strong> for authorities to obtain a warrant to search through phone contents. They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not <strong>[xxx]</strong> or altered while waiting for a warrant. The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n<p>开始精读：</p>\n<p>As so often is the case, / stating that principle / doesn’t ease the challenge of line-drawing. / In many cases, / it would not be overly <strong>[xxx]</strong> / for authorities to obtain a warrant / to search through phone contents. / They could still invalidate / Fourth Amendment protections / when facing severe, urgent circumstances, / and they could take reasonable measures / to ensure that phone data / are not <strong>[xxx]</strong> or altered / while waiting for a warrant. / The court, though, may want / to allow room for police / to cite situations / where they are entitled / to more freedom.</p>\n<p>正如常有的情况一样， / 表明那一原则 / 并未减轻划界的难题。 / 在许多情况下， / 这不会过于<strong>[xxx]</strong> / 对当局而言，取得搜查令 / 以搜查手机内容。 / 他们仍然可以使之失效 / 第四修正案的保护 / 当面临严重、紧迫的情况时， / 而且他们可以采取合理措施 / 确保手机数据 / 未被<strong>[xxx]</strong>或更改 / 在等待搜查令时。 / 不过，法院可能希望 / 为警察留出余地 / 以列举某些情况 / 在那些情况下，他们有权 / 拥有更多自由。</p>\n</blockquote>\n<p>concern要概括这两段的关切，核对私人文件的保护、现实生活对设备的需要及警方行动空间之间的关系。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. principles are hard to be clearly expressed</h3>\n<blockquote><p>原则很难被清楚地表达出来。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者在第5、6段担心原则很难表达清楚。</p>\n<p>A说原则难以表达清楚。第6段开头的<code>stating that principle</code>接的是前一段的隐私权，我们把它与<code>line-drawing</code>分开读。</p>\n<blockquote><p>Citizens still have a right to expect private documents to remain private</p>\n</blockquote>\n<blockquote><p>stating that principle doesn’t ease the challenge of line-drawing.</p>\n</blockquote>\n<p>前一段已经把原则写出来：公民有权期待私人文件保持私密。第6段不是说这句话讲不清，而是说讲出这条原则并不能减轻划界的困难。</p>\n<p>接下来讨论什么时候要搜查令，什么紧急情况下可以例外，以及等待期间能采取什么措施。这些都是原则怎样落实到具体情形的问题。</p>\n<p>A把困难放在“清楚表达原则”上；原文却把困难放在说清原则之后，具体边界仍不好画。</p>\n<p><strong>原则已经被说出而边界仍难划，等于原则本身很难表达清楚吗？</strong></p>\n<p>不等于。原则已经明确，难的是哪些情况可以搜查、哪些需要限制。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. the court is giving police less room for action</h3>\n<blockquote><p>法院正在给警方更少的行动余地。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者在第5、6段担心法院正在给警方更少的行动余地。</p>\n<p>B说法院给警方更少余地。第6段末正有<code>allow room</code>，我们看后面接的是<code>more freedom</code>还是更少自由。</p>\n<blockquote><p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<p>法院可能希望留下空间，让警方列出一些可以拥有更多自由的情况。这里<code>allow room</code>与<code>more freedom</code>都是往允许更多行动的方向说。</p>\n<p>B却写法院正在缩小警方行动空间，与这句的方向不一样。而且<code>may want</code>只是可能希望这样安排，也不能直接说某种安排已经在进行。</p>\n<p>作者前面强调隐私应受保护，不等于法院已经给警方更少余地；要看法院这句实际怎么写。</p>\n<p><strong>法院可能允许警方列举享有更多自由的情况，能改写成法院正在给警方更少余地吗？</strong></p>\n<p>不能。原文谈可能放宽的空间，B写成已经缩小空间。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. phones are used to store <strong>[xxx]</strong> information</h3>\n<blockquote><p>手机被用来存储<strong>[xxx]</strong>信息。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者在第5、6段担心手机被用于存储<strong>[xxx]</strong>信息。</p>\n<p>C说手机存储某种信息，第5段正有<code>keeping sensitive information on these devices</code>。我们先把存储这件事对上，再看作者为何接着谈隐私。</p>\n<blockquote><p>But keeping sensitive information on these devices is increasingly a requirement of normal life.</p>\n</blockquote>\n<blockquote><p>Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n</blockquote>\n<p>第5段确实说，把敏感信息留在设备上越来越是正常生活的需要。因此，C说的手机存储信息并不是凭空出现。</p>\n<p>但C修饰信息的<strong>[xxx]</strong>尚未读懂。它是否就是原句的敏感信息，还是另一种性质，现在无法确定。</p>\n<p>还要注意，原句写完生活需要，马上又说公民仍有权让私人文件保持私密。C只写了存储；它能不能回答作者担心什么，要和接下来的权利、划界一起看，先别把后半段丢掉。</p>\n<p><strong>C的信息性质还未读清，而存储行为在原文中确实存在，现在能马上把C整个否定吗？</strong></p>\n<p>还不能。先留下，回查时继续看作者是担心存储本身，还是担心这些资料怎样得到保护。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. citizens’ privacy is not effectively protected</h3>\n<blockquote><p>公民隐私没有得到有效保护。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者在第5、6段担心公民隐私没有得到有效保护。</p>\n<p>D说隐私未获有效保护。第5段提出保护权利，第6段却说单说原则仍难划界，我们把这两层连起来看。</p>\n<blockquote><p>Citizens still have a right to expect private documents to remain private and protected by the Constitution’s <strong>[xxx]</strong> on unreasonable searches.</p>\n</blockquote>\n<blockquote><p>stating that principle doesn’t ease the challenge of line-drawing.</p>\n</blockquote>\n<blockquote><p>The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.</p>\n</blockquote>\n<p>公民有权期待私人资料保持私密，说明应当受到什么保护。但<code>doesn’t ease the challenge</code>接着说，即使原则明确，真正划定搜查边界仍有困难。</p>\n<p>随后又要考虑严重紧急情况、等待搜查令时的措施，以及警方要求更多自由的情况。怎样既允许必要执法又保住隐私，还需要具体规则。</p>\n<p>D担心保护没有有效落实，能接上这份困难。这里并不是说任何人的隐私都已经被侵犯，而是原则本身还不足以保证实际保护。</p>\n<p><strong>已经声明隐私权，却还没有轻易解决搜查边界，是否能让作者担心隐私的实际保护？</strong></p>\n<p>能。D把两段连接处的问题说了出来，先留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一遍留下C、D。C所存信息的性质仍未知；D接上了权利原则与实际划界困难之间的关系。</p>\n\n<hr />\n<h2>30题</h2>\n<blockquote><p>Orin Kerr’s comparison is quoted to indicate that ______.<br />\n引用奥林·克尔的比较，是为了说明什么？</p>\n</blockquote>\n<p>题干点名Orin Kerr，定位第7段。先从段首But读到末尾，将比较前的观点和汽车、数字信息的两种情形完整连起来。</p>\n<blockquote><p>原文参考：</p>\n<p>But the justices should not swallow California’s argument whole. New, <strong>[xxx]</strong> technology sometimes demands novel applications of the Constitution’s protections. Orin Kerr, a law professor, compares the explosion and <strong>[xxx]</strong> of digital information in the 21st century with the establishment of automobile use as a <strong>[xxx]</strong> necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n<p>开始精读：</p>\n<p>But the justices should not / swallow California’s argument whole. / New, <strong>[xxx]</strong> technology sometimes demands / novel applications / of the Constitution’s protections. / Orin Kerr, a law professor, / compares the explosion and <strong>[xxx]</strong> / of digital information / in the 21st century / with the establishment / of automobile use / as a <strong>[xxx]</strong> necessity of life / in the 20th: / The justices had to specify / novel rules / for the new personal domain / of the passenger car then; / they must sort out / how the Fourth Amendment / applies to digital information now.</p>\n<p>但法官们不应该 / 全盘接受加州的论点。 / 新的、<strong>[xxx]</strong>的技术有时要求 / 新的运用方式 / 对于宪法的保护。 / 法学教授奥林·克尔， / 将激增和<strong>[xxx]</strong>作比较 / 数字信息的 / 在第21世纪 / 与其确立 / 汽车的使用 / 作为生活中<strong>[xxx]</strong>的必需品 / 在第20世纪： / 法官们必须明确规定 / 新的规则 / 针对新的个人领域 / 即当时的乘用车； / 他们必须理清 / 第四修正案如何 / 适用于现在的数字信息。</p>\n</blockquote>\n<p>is quoted to indicate问引用比较支持什么判断，要核对两种时代情形之间共同的关系，以及比较结尾交给法官的任务。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. the Constitution should be implemented flexibly</h3>\n<blockquote><p>宪法应当灵活地实施。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者引用克尔的比较，是要说明宪法应当灵活实施。</p>\n<p>A说宪法应灵活实施。末段的<code>novel applications</code>说新的运用，我们再看汽车和数字信息两端各要求法官做什么。</p>\n<blockquote><p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>当汽车成为新的个人领域，法官就要为它明确新规则；现在数字信息出现，又要弄清第四修正案怎样适用。</p>\n<p>同样的宪法保护面对不同事物，具体规则需要调整，不能把过去对别的东西的处理直接套过来。A用灵活实施来概括这一点，可以接上。</p>\n<p>但“灵活”还比较宽：是执法时灵活处理，还是法官需要重新说明法律适用范围？等会儿和B一起看比较中的<code>specify</code>与<code>sort out how</code>。</p>\n<p><strong>汽车和数字信息需要各自的适用规则，能否说明实施方式不能一成不变？</strong></p>\n<p>能。A先留下，随后再看哪项把法官这次的任务说得更具体。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. new technology requires reinterpretation of the Constitution</h3>\n<blockquote><p>新技术要求重新解释宪法。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者引用克尔的比较，是要说明新技术要求重新解释宪法。</p>\n<p>B说新技术要求重新解释宪法。原文比较结尾写了<code>specify novel rules</code>和<code>sort out how the Fourth Amendment applies</code>，我们看这两件事。</p>\n<blockquote><p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>汽车成为新的个人领域以后，法官必须说明适用于它的新规则；如今又必须理清第四修正案如何用于数字信息。</p>\n<p>这里不是要求另外写一部宪法，而是要解释现有保护到了新领域究竟管哪些事情、怎样适用。B的<code>reinterpretation</code>在这里可以接到这项工作上。</p>\n<p>而且B保留了<code>new technology</code>：正是汽车和数字信息这些新情形，使原来的保护需要新的具体说明。原因和后面的任务都能接上。</p>\n<p><strong>理清既有宪法保护如何适用于新技术领域，能否叫作对它作新的解释？</strong></p>\n<p>能。B说的重新解释可以具体落在这项适用范围和规则的说明上，先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. California’s argument violates principles of the Constitution</h3>\n<blockquote><p>加利福尼亚州的论点违反宪法原则。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者引用克尔的比较，是要说明加州论点违反宪法原则。</p>\n<p>C说加州论点违背宪法原则。段首确实要求不全盘接受加州论点，但我们要继续看克尔的汽车比较实际说明了什么。</p>\n<blockquote><p>But the justices should not swallow California’s argument whole.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>比较先说过去汽车成为新的个人领域，法官因此要制定新规则；再说现在数字信息出现，法官也应理清适用办法。</p>\n<p>它在回答法官面对新事物要做什么，并没有拿加州论点逐条与宪法原则核对，再得出“违宪”的裁定。</p>\n<p>不全盘接受一个论点，可以是它把手机和钱包比得不合适，也可以是它不足以处理新情形。不能把作者的反对直接扩大成违反宪法原则，更不能说汽车的比较已经证明了这一点。</p>\n<p><strong>汽车的比较说明了制定新适用规则的需要，是否同时判定加州论点违反宪法原则？</strong></p>\n<p>没有。C把作者的反对改成了这项比较并未证明的违宪结论。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. principles of the Constitution should never be altered</h3>\n<blockquote><p>宪法原则永远不应被改变。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者引用克尔的比较，是要说明宪法原则永远不应改变。</p>\n<p>D强调原则永远不能变。原文比较中反复出现的却是<code>novel applications</code>、<code>novel rules</code>，我们看作者借此要求什么。</p>\n<blockquote><p>technology sometimes demands novel applications of the Constitution’s protections.</p>\n</blockquote>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>作者没有在这里讨论以后任何情况下能不能修改宪法原则。他说的是，当新的个人领域出现，现有的保护需要新的适用说明。</p>\n<p>汽车那一端已经要求法官明确新规则，数字信息这一端又要求法官理清第四修正案怎样用。比较一路推进到这项当前任务。</p>\n<p>D只说原则永不改变，把具体的新规则和新适用问题都放掉了。即使现有保护继续存在，也不能由此推出文章强调的就是“永远不得改变”。</p>\n<p><strong>这项比较要推动法官说明新情形中的适用规则，还是论证宪法原则在任何时候都不能改？</strong></p>\n<p>是前者。D的“永远”没有被讨论，也没有回答比较最后提出的任务。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>30题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一遍留下A、B。A概括为实施方式随新领域调整；B也可能表达法官为新情形明确宪法含义及适用规则的任务。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>protect your digital data；without a warrant</td><td>以“protect your digital data”提出宪法保护数字数据的问题，再用“search the contents of a mobile phone without a warrant”说明待裁定的是逮捕时无搜查令查看手机内容；后文由此展开规则之争。</td><td>提出逮捕时能否无令状查看手机内容的问题。</td></tr><tr><td>第2段</td><td>refrain from a <strong>[xxx]</strong> ruling；for judges to assess</td><td>加州请求法官“refrain from a <strong>[xxx]</strong> ruling”，尤其避免推翻逮捕时可搜查的旧假设，并称“for judges to assess”新技术影响很困难；这一段提出需要作者回应的理由，裁决性质和被搜查对象的具体词仍不清楚。</td><td>交代加州支持旧做法的理由，为作者回应提供对象。</td></tr><tr><td>第3段</td><td>can and should provide updated guidelines</td><td>作者明确说法官“can and should provide updated guidelines”，把前段的判断困难转为现在仍能提出更新规则的要求；“<strong>[xxx]</strong> modest”的完整评价不能确定。</td><td>回应新技术难判断的理由，明确法院仍应更新指南。</td></tr><tr><td>第4段</td><td>entering his or her home；reading history, financial history, medical history</td><td>作者要求“discarding California’s”有关手机与手提包相似的论点，并以“entering his or her home”比拟查看手机；阅读、财务、医疗及通信记录说明手机承载的私人资料，云计算使查看更容易，从而为更新规则提供具体理由。</td><td>用手机承载的私人资料解释为何需要区别于普通随身物件。</td></tr><tr><td>第5段</td><td>a requirement of normal life；private documents to remain private</td><td>“a requirement of normal life”说明在设备上保存敏感信息日益成为生活需要，“private documents to remain private”则提出即使如此仍应保有隐私；由手机中的具体资料推进到公民保护权利。</td><td>从资料存储的现实转向公民仍应保有的隐私权。</td></tr><tr><td>第6段</td><td>the challenge of line-drawing；more freedom</td><td>“the challenge of line-drawing”承接前段权利原则，讨论搜查令、紧迫情形和警方“more freedom”的具体边界；取得令状是否过于<strong>[xxx]</strong>及等待期间数据不被<strong>[xxx]</strong>的完整意思未知，但原则落到执法规则仍需划界的关系明确。</td><td>把权利原则推进到具体执法界限。</td></tr><tr><td>第7段</td><td>should not swallow California’s argument whole；novel applications</td><td>“should not swallow California’s argument whole”在承认执法空间后重申不能全盘采纳加州主张；“novel applications of the Constitution’s protections”和汽车时代的新规则共同支持现在厘清第四修正案如何适用于数字信息，收束全文。</td><td>借历史比较说明新情形需要新的适用规则，回到全文问题。</td></tr></tbody></table>\n<p>全文观点：手机承载私人资料，数字信息的搜查不能直接沿用翻查随身物件的比较。法院应明确、更新宪法保护在数字领域中的适用规则，并处理隐私保护与紧急执法等情形之间的界限。</p>\n\n<hr />\n<h2>回查26题：B还是D？</h2>\n<p>B. check suspects’ phone contents without being authorized</p>\n<p>D. <strong>[xxx]</strong> suspects from using their mobile phones</p>\n<p>B说法院要判断警方未获搜查授权就查看手机内容是否合法。D开头的动作仍没读懂，能读出的部分说到嫌疑人使用手机。</p>\n<p>读完后面，文章到底持续在问什么？第4段先把查看手机比作进入家中，列出手机里的阅读、财务、医疗和通信资料。第5段再说：</p>\n<blockquote><p>keeping sensitive information on these devices is increasingly a requirement of normal life</p>\n<p>Citizens still have a right to expect private documents to remain private</p>\n</blockquote>\n<p>把资料放在手机里已经是正常生活的需要，但资料仍应私密。接着第6段讨论：</p>\n<blockquote><p>to obtain a warrant to search through phone contents</p>\n<p>while waiting for a warrant</p>\n</blockquote>\n<p>警察需不需要搜查令，等待搜查令时能做什么，才是后面不断细分的问题。法院不是要一般地决定嫌疑人怎么使用手机，而是要明确警方进入这些私人资料的条件。</p>\n<p>回到首段：</p>\n<blockquote><p>whether police can search the contents of a mobile phone without a warrant</p>\n</blockquote>\n<p>B把查看的对象和缺少的许可都保留了。D虽然仍有词未读清，但已知部分落在嫌疑人使用手机上，没有B这样完整对应警方搜查内容这一问题。</p>\n<p><strong>全文从私人资料讲到搜查令，一直要求法院明确的是哪件事？</strong></p>\n<p>是警方在什么条件下可以查看手机内容。B有首段完整对应，也接上后面的讨论，因此选B。D的遮挡词仍不补译。</p>\n<blockquote><p><strong>26题选B。</strong></p>\n</blockquote>\n\n<hr />\n<h2>回查29题：C还是D？</h2>\n<p>C. phones are used to store <strong>[xxx]</strong> information</p>\n<p>D. citizens’ privacy is not effectively protected</p>\n<p>C说手机存储某种信息，信息性质仍未读懂；D说隐私未获有效保护。第一遍存储事实和保护难题都能找到，现在要分清作者担心哪件事。</p>\n<p>第5段先说：</p>\n<blockquote><p>keeping sensitive information on these devices is increasingly a requirement of normal life</p>\n</blockquote>\n<p>作者把存储敏感信息写成正常生活越来越离不开的事情。随即接：</p>\n<blockquote><p>Citizens still have a right to expect private documents to remain private</p>\n</blockquote>\n<p>即使资料放进手机，公民仍有权要求它们保持私密。这里的<code>still</code>把作者真正坚持的要求带了出来。</p>\n<p>第6段继续说：</p>\n<blockquote><p>stating that principle doesn’t ease the challenge of line-drawing</p>\n</blockquote>\n<p>说出了权利原则，还要解决边界。该不该拿搜查令，什么紧急情形可以例外，警方还能争取多少行动空间，都关系到保护是否真正有效。</p>\n<p>再接回前面的要求和末段：</p>\n<blockquote><p>provide updated guidelines</p>\n<p>novel applications of the Constitution’s protections</p>\n</blockquote>\n<p>作者要法院补足的是保护规则。若他的担心仅仅是手机被拿来存储资料，后面应该继续讨论如何少存、不要存；实际文章承认存储是生活需要，然后不断要求明确搜查边界。</p>\n<p><strong>作者是把正常存储本身当成要解决的问题，还是担心存下来的私人资料没有得到足够保护？</strong></p>\n<p>是后者。C里的信息性质仍不知道，但它说完“手机用于存储”就停了；D接住了作者随后提出的保护要求和落实困难。</p>\n<blockquote><p><strong>29题选D。</strong></p>\n</blockquote>\n\n<hr />\n<h2>回查30题：A还是B？</h2>\n<p>A. the Constitution should be implemented flexibly</p>\n<p>B. new technology requires reinterpretation of the Constitution</p>\n<p>A说宪法应灵活实施，B说新技术要求对宪法作新的解释。第一遍两者都能和新规则联系起来，现在回到比较里看法官具体要做哪件事。</p>\n<p>第2段加州的理由是新技术变化快、影响难判断，第3段作者却要求：</p>\n<blockquote><p>the justices can and should provide updated guidelines</p>\n</blockquote>\n<p>法官不能因为新情形难处理，就不说明怎样适用保护。第6段又说仅表明原则还不足以解决划界。末段的比较正是接着这个任务写的：</p>\n<blockquote><p>The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.</p>\n</blockquote>\n<p>过去汽车带来新的个人领域，法官要明确新规则；现在数字信息带来新的情形，法官要理清第四修正案怎么适用。两端共同写出的，不只是处理事情时灵活一点，而是把现有宪法保护在新领域中的含义和适用范围说明白。</p>\n<p>A的灵活实施没有把这个具体任务说出来。B的重新解释，在这里就是说明既有条文到了新技术情形中如何适用，也保留了使这项工作变得必要的新技术。</p>\n<p><strong>比较结尾让法官做的是一般地灵活办事，还是明确第四修正案怎样用于新出现的数字信息？</strong></p>\n<p>是后者。B同时接上新技术和新的适用解释，更准确地说出了汽车与数字信息这项比较的共同点。</p>\n<blockquote><p><strong>30题选B。</strong></p>\n</blockquote>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>26. B</strong></p>\n<p><strong>27. C</strong></p>\n<p><strong>28. A</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. B</strong></p>\n","analysisStartIndex":37,"maskInventory":{"token":"[xxx]","count":18},"questionFlowPlan":[{"qid":"26","initialParagraphPids":[1],"paragraphPids":[1],"entry":38,"options":{"A":39,"B":40,"C":41,"D":42},"initialReadingMode":"full_paragraph"},{"qid":"27","initialParagraphPids":[2,3],"paragraphPids":[2,3],"entry":44,"options":{"A":45,"B":46,"C":47,"D":48},"initialReadingMode":"full_paragraph"},{"qid":"28","initialParagraphPids":[],"paragraphPids":[4],"entry":50,"options":{"A":51,"B":52,"C":53,"D":54},"initialReadingMode":"reuse_previous"},{"qid":"29","initialParagraphPids":[5,6],"paragraphPids":[5,6],"entry":56,"options":{"A":57,"B":58,"C":59,"D":60},"initialReadingMode":"full_paragraph"},{"qid":"30","initialParagraphPids":[7],"paragraphPids":[7],"entry":62,"options":{"A":63,"B":64,"C":65,"D":66},"initialReadingMode":"full_paragraph"}],"jumpSections":["阅前须知","先读题干","读文章","开始做题","26题","27题","28题","29题","30题","进阶方法","进阶回查","最终答案"],"supplementaryFlow":{"id":"whole_text_argument_review_v1","overviewEvidencePids":[1,2,3,4,5,6,7],"ordinaryFirstRoundCandidates":{"26":["B","D"],"27":["C"],"28":["A"],"29":["C","D"],"30":["A","B"]},"reviews":[{"qid":26,"pair":["B","D"],"newEvidencePids":[4,5,6],"final":"B"},{"qid":29,"pair":["C","D"],"newEvidencePids":[3,4,7],"final":"D"},{"qid":30,"pair":["A","B"],"newEvidencePids":[2,3,6],"final":"B"}]}};
let idx=-1,fullMode=false,ready=false,savedInteractive={idx:-1,left:0,right:0};
const articleImg=document.getElementById('articleImg'),questionImg=document.getElementById('questionImg'),leftPane=document.getElementById('leftPane'),rightPane=document.getElementById('rightPane'),combined=document.getElementById('combined');
articleImg.src=DATA.articleImage;questionImg.src=DATA.questionImage;
function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,behavior})}
function scrollFor(st){const article=st?.articleRects?.length,question=st?.questionRects?.length;const run=()=>{if(st?.scrollTarget==='articleTop'||st?.meta?.kind==='coarse_intro')scrollToWrap('articleWrap','auto');else if(st?.scrollTarget==='questionTop')scrollToWrap('questionWrap','auto');else if(article)centerRects('articleWrap');else if(question)centerRects('questionWrap');else if(st?.scrollTarget==='question')scrollToWrap('questionWrap');else if(st?.scrollTarget==='article')scrollToWrap('articleWrap')};requestAnimationFrame(()=>{run();setTimeout(run,240);setTimeout(run,520)})}
function centerRight(){const el=document.getElementById('onlyCurrent');if(!el)return;combined.style.paddingTop='30px';combined.style.paddingBottom='60px';requestAnimationFrame(()=>{const h=el.getBoundingClientRect().height,ph=rightPane.clientHeight;if(h<ph-70){const pad=Math.max(30,Math.floor((ph-h)/2));combined.style.paddingTop=pad+'px';combined.style.paddingBottom=pad+'px'}rightPane.scrollTo({top:0,behavior:'smooth'})})}
function setControls(){document.getElementById('prev').disabled=fullMode||idx<0;document.getElementById('next').disabled=fullMode||idx>=DATA.steps.length-1||!ready;document.getElementById('reset').disabled=fullMode;document.getElementById('jump').disabled=fullMode;const t=document.getElementById('toggleAll');t.textContent=fullMode?'返回交互':'显示全部';t.classList.toggle('active',fullMode)}
function renderFull(){document.body.classList.add('fullMode');combined.classList.remove('analysisMode');highlight('articleWrap',[]);highlight('questionWrap',[]);combined.style.paddingTop='30px';combined.style.paddingBottom='60px';combined.innerHTML=DATA.fullHtml;rightPane.scrollTo({top:0,behavior:'auto'});document.getElementById('progress').textContent='全部内容';setControls()}
function render(opts={}){if(fullMode){renderFull();return}document.body.classList.remove('fullMode');const st=DATA.steps[idx];combined.classList.toggle('analysisMode',idx>=DATA.analysisStartIndex&&DATA.analysisStartIndex>=0);document.getElementById('progress').textContent=idx<0?'0 / '+DATA.steps.length:(idx+1)+' / '+DATA.steps.length;highlight('articleWrap',st?st.articleRects:[]);highlight('questionWrap',st?st.questionRects:[]);if(!opts.restoreScroll&&st)scrollFor(st);const isOption=st&&['option','main_option'].includes(st.meta?.kind);combined.innerHTML=st?'<div class="onlyStep '+(isOption?'optionStep':'')+'" id="onlyCurrent">'+st.html+'</div><span class="caret"></span>':'<div class="onlyStep" id="onlyCurrent" style="color:#9ca3af">点击“下一步”开始。</div>';if(opts.restoreScroll)requestAnimationFrame(()=>{leftPane.scrollTop=opts.left??0;rightPane.scrollTop=opts.right??0});else setTimeout(centerRight,60);if(st?.section)document.getElementById('jump').value=st.section;setControls()}
function next(){if(fullMode||!ready||idx>=DATA.steps.length-1)return;idx++;render()}function prev(){if(fullMode||idx<0)return;idx--;render()}function reset(){if(fullMode)return;idx=-1;leftPane.scrollTo({top:0,behavior:'auto'});rightPane.scrollTo({top:0,behavior:'auto'});render()}function toggleAll(){if(!fullMode){savedInteractive={idx,left:leftPane.scrollTop,right:rightPane.scrollTop};fullMode=true;renderFull()}else{fullMode=false;idx=savedInteractive.idx;render({restoreScroll:true,left:savedInteractive.left,right:savedInteractive.right})}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reset').onclick=reset;document.getElementById('toggleAll').onclick=toggleAll;
const jump=document.getElementById('jump');const FIXED_JUMP_SECTIONS=DATA.jumpSections;if(!Array.isArray(FIXED_JUMP_SECTIONS))throw new Error('missing compiler-frozen jumpSections');FIXED_JUMP_SECTIONS.forEach(sec=>{const o=document.createElement('option');o.value=sec;o.textContent=sec;jump.appendChild(o)});jump.onchange=()=>{if(fullMode)return;const i=DATA.steps.findIndex(s=>s.section===jump.value);if(i>=0){idx=i;render()}};window.addEventListener('resize',()=>{if(ready&&!fullMode)render()});
