<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**According to the first two paragraphs, Elisabeth was upset by ______.**\n\n> 根据前两段，伊丽莎白因什么而感到不安？\n\n题型：**原因细节题**。","articleRects":[],"questionRects":[[226,190,967,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>According to the first two paragraphs, Elisabeth was upset by ______.</strong></p>\n<blockquote><p>根据前两段，伊丽莎白因什么而感到不安？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**It can be inferred from Paragraph 3 that ______.**\n\n> 根据第三段可以推断出什么？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,570,643,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>It can be inferred from Paragraph 3 that ______.</strong></p>\n<blockquote><p>根据第三段可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**The author believes the Rebekah Brooks’s defence ______.**\n\n> 作者认为布鲁克斯的辩护怎样？\n\n题型：**作者评价题**。","articleRects":[],"questionRects":[[226,951,796,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>The author believes the Rebekah Brooks’s defence ______.</strong></p>\n<blockquote><p>作者认为布鲁克斯的辩护怎样？</p>\n</blockquote>\n<p>题型：<strong>作者评价题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**The author holds that the current collective doctrine shows ______.**\n\n> 作者认为当前的集体信条表现出什么？\n\n题型：**观点细节题**。","articleRects":[],"questionRects":[[226,1331,916,31]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>The author holds that the current collective doctrine shows ______.</strong></p>\n<blockquote><p>作者认为当前的集体信条表现出什么？</p>\n</blockquote>\n<p>题型：<strong>观点细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**Which of the following is suggested in the last paragraph?**\n\n> 最后一段暗示下列哪一点？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[225,1712,915,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>Which of the following is suggested in the last paragraph?</strong></p>\n<blockquote><p>最后一段暗示下列哪一点？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, because, not only |\n| 态度词／评价词 | 先抓个大概好坏 | moral, illegal, innocent |\n| 动作词 | 先看谁做了什么 | create, ask, promote |\n| 结果词 | 看最后出了什么事 | profit, circulation, impact |\n| 重复主题词 | 大概知道老在说什么 | integrity, society, newspapers |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, because, not only</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>moral, illegal, innocent</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>create, ask, promote</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>profit, circulation, impact</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>integrity, society, newspapers</td></tr></tbody></table>\n"},{"section":"读文章","raw":"Two years ago, Rupert Murdoch’s daughter, Elisabeth, spoke of the “unsettling dearth of integrity across so many of our institutions.” Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market. But “it’s us, human beings, we the people who create the society we want, not profit. ”","articleRects":[[273,287,1123,37],[204,333,1192,39],[202,381,1194,39],[202,429,1194,39],[202,477,1003,39]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Two years ago, Rupert Murdoch’s daughter, Elisabeth, spoke of the “unsettling dearth of integrity across so many of our institutions.” Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market. But “it’s us, human beings, we the people who create the society we want, not profit. ”</p>\n</div></div>"},{"section":"读文章","raw":"Two years ago, / Rupert Murdoch’s daughter, Elisabeth, / spoke of the “unsettling dearth of integrity across so many of our institutions.” Integrity had collapsed, she argued, / because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market. / But “it’s us, human beings, / we the people who create the society we want, / not profit. ”","articleRects":[[273,287,1123,37],[204,333,1192,39],[202,381,1194,39],[202,429,1194,39],[202,477,1003,39]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Two years ago, / Rupert Murdoch’s daughter, Elisab tionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到两年前、鲁珀特·默多克的女儿、创造我们想要的社会、并非利润；中间又出现为讲透她的观点、她继续说、正在伤害企业、比如新闻国际公司；已知记者们、窃听过电话、负责电话窃听、其他人等待审判；在许多方面、道德宗旨的缺乏、她成功辩护的核心、是她什么也不知道；在当今世界、一代人以来、社会的筛选机制、应当是利润；结尾还有编辑工作的目的、对于《世界新闻报》、为了发行量和影响力、但她没有提出问题。</p>\n<p>到这里还不能自然地说清楚：个人有罪或无罪与报社的道德责任是否是一回事，利润标准怎样影响编辑的做法。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"36题","raw":"## 36题\n\n> According to the first two paragraphs, Elisabeth was upset by ______.  \n> 根据前两段，伊丽莎白因什么而感到不安？\n\n题干明示the first two paragraphs，并点名Elisabeth，直接读第一、二段。从她说机构缺少正直，读到她指出企业如何迷失方向。\n\n> 原文参考：\n> \n> Two years ago, Rupert Murdoch’s daughter, Elisabeth, spoke of the “unsettling dearth of integrity across so many of our institutions.” Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market. But “it’s us, human beings, we the people who create the society we want, not profit. ”\n> \n> 开始精读：\n> \n> Two years ago, / Rupert Murdoch’s daughter, Elisabeth, / spoke of / the “unsettling dearth of integrity / across so many of our institutions.” / Integrity had collapsed, / she argued, / because of a collective acceptance / that the only “sorting mechanism” / in society / should be profit and the market. / But “it’s us, human beings, / we the people / who create the society we want, / not profit. ”\n> \n> 两年前， / 鲁珀特·默多克之女伊丽莎白， / 谈到 / 那“令人不安的正直缺乏 / 遍及我们那么多机构。” / 正直已经崩塌， / 她认为， / 因为一种集体认同， / 即唯一的“筛选机制” / 在社会中 / 应当是利润和市场。 / 但“是我们人类， / 我们这些人， / 创造我们想要的社会， / 并非利润。”\n\n> 原文参考：\n> \n> Driving her point home, she continued: “It’s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for **[xxx]** and freedom. ” This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.\n> \n> 开始精读：\n> \n> Driving her point home, / she continued: / “It’s increasingly apparent / that the absence of purpose, / of a moral language / within government, media or business / could become / one of the most dangerous goals / for **[xxx]** and freedom. ” / This same absence of moral purpose / was wounding companies / such as News International, / she thought, / making it more likely / that it would lose its way / as it had / with widespread illegal telephone hacking.\n> \n> 为讲透她的观点， / 她继续说： / “越来越明显的是， / 宗旨的缺失， / 道德语言的缺失， / 在政府、媒体或企业中， / 可能成为 / 最危险的目标之一， / 对于**[xxx]**和自由。” / 同样的道德宗旨缺失 / 正在伤害企业， / 比如新闻国际公司， / 她认为， / 使之更有可能 / 迷失方向， / 正如它已然如此， / 伴随广泛的非法电话窃听。\n\nupset by要补出使她感到不安的事，需要检查她评价了什么现象，以及她怎样连接社会筛选原则、道德宗旨与企业行为。\n\n接下来按A—D逐项看。","articleRects":[[273,287,1123,37],[204,333,1192,39],[202,381,1194,39],[202,429,1194,39],[202,477,1003,39],[274,525,1122,39],[203,574,1193,38],[202,621,1194,39],[203,670,1193,38],[202,718,1194,38],[202,766,686,38]],"questionRects":[[226,190,967,38],[281,253,792,38],[280,317,789,38],[280,380,705,38],[280,444,737,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0,1],"qid":"36","initialReadingPids":[0,1]},"html":"<h2>36题</h2>\n<blockquote><p>According to the first two paragraphs, Elisabeth was upset by ______.<br />\n根据前两段，伊丽莎白因什么而感到不安？</p>\n</blockquote>\n<p>题干明示the first two paragraphs，并点名Elisabeth，直接读第一、二段。从她说机构缺少正直，读到她指出企业如何迷失方向。</p>\n<blockquote><p>原文参考：</p>\n<p>Two years ago, Rupert Murdoch’s daughter, Elisabeth, spoke of the “unsettling dearth of integrity across so many of our institutions.” Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market. But “it’s us, human beings, we the people who create the society we want, not profit. ”</p>\n<p>开始精读：</p>\n<p>Two years ago, / Rupert Murdoch’s daughter, Elisabeth, / spoke of / the “unsettling dearth of integrity / across so many of our institutions.” / Integrity had collapsed, / she argued, / because of a collective acceptance / that the only “sorting mechanism” / in society / should be profit and the market. / But “it’s us, human beings, / we the people / who create the society we want, / not profit. ”</p>\n<p>两年前， / 鲁珀特·默多克之女伊丽莎白， / 谈到 / 那“令人不安的正直缺乏 / 遍及我们那么多机构。” / 正直已经崩塌， / 她认为， / 因为一种集体认同， / 即唯一的“筛选机制” / 在社会中 / 应当是利润和市场。 / 但“是我们人类， / 我们这些人， / 创造我们想要的社会， / 并非利润。”</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Driving her point home, she continued: “It’s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for <strong>[xxx]</strong> and freedom. ” This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n<p>开始精读：</p>\n<p>Driving her point home, / she continued: / “It’s increasingly apparent / that the absence of purpose, / of a moral language / within government, media or business / could become / one of the most dangerous goals / for <strong>[xxx]</strong> and freedom. ” / This same absence of moral purpose / was wounding companies / such as News International, / she thought, / making it more likely / that it would lose its way / as it had / with widespread illegal telephone hacking.</p>\n<p>为讲透她的观点， / 她继续说： / “越来越明显的是， / 宗旨的缺失， / 道德语言的缺失， / 在政府、媒体或企业中， / 可能成为 / 最危险的目标之一， / 对于<strong>[xxx]</strong>和自由。” / 同样的道德宗旨缺失 / 正在伤害企业， / 比如新闻国际公司， / 她认为， / 使之更有可能 / 迷失方向， / 正如它已然如此， / 伴随广泛的非法电话窃听。</p>\n</blockquote>\n<p>upset by要补出使她感到不安的事，需要检查她评价了什么现象，以及她怎样连接社会筛选原则、道德宗旨与企业行为。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. the consequences of the current sorting mechanism\n\n> 现行筛选机制带来的后果\n\n把A接回题干，它说的是：伊丽莎白因现行筛选机制带来的后果而不安。\n\nA提到`sorting mechanism`，第1段正用这个词解释`Integrity had collapsed`。我们沿`because of`看哪件事导致哪件事。\n\n> Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market.\n\n她先说许多机构缺少正直，这使人不安。接着解释，正直崩塌是因为大家接受了只用利润和市场筛选社会的办法。\n\n这样，利润和市场的筛选在前，正直的缺失是它带来的后果。A里的`consequences`不必另外找一个叫“后果”的词，`because of`已经把这种因果关系写出来。\n\n第2段再说缺少道德目的会使企业迷失方向，延续的也是这套做法造成的伤害。A没有只停在“利润很重要”，而是说她担心这种机制带来的问题。\n\n**她把正直崩塌归因于利润与市场的筛选机制，是否就是在担心这套机制的后果？**\n\n是。机制和令人不安的后果已经由`because of`连在一起，A留下。\n\n**第一轮判断：A保留。**","articleRects":[[273,287,1123,37],[204,333,1192,39],[202,381,1194,39],[202,429,1194,39],[202,477,1003,39]],"questionRects":[[281,253,792,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"36","paragraphPids":[0]},"html":"<h3>A. the consequences of the current sorting mechanism</h3>\n<blockquote><p>现行筛选机制带来的后果</p>\n</blockquote>\n<p>把A接回题干，它说的是：伊丽莎白因现行筛选机制带来的后果而不安。</p>\n<p>A提到<code>sorting mechanism</code>，第1段正用这个词解释<code>Integrity had collapsed</code>。我们沿<code>because of</code>看哪件事导致哪件事。</p>\n<blockquote><p>Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market.</p>\n</blockquote>\n<p>她先说许多机构缺少正直，这使人不安。接着解释，正直崩塌是因为大家接受了只用利润和市场筛选社会的办法。</p>\n<p>这样，利润和市场的筛选在前，正直的缺失是它带来的后果。A里的<code>consequences</code>不必另外找一个叫“后果”的词，<code>because of</code>已经把这种因果关系写出来。</p>\n<p>第2段再说缺少道德目的会使企业迷失方向，延续的也是这套做法造成的伤害。A没有只停在“利润很重要”，而是说她担心这种机制带来的问题。</p>\n<p><strong>她把正直崩塌归因于利润与市场的筛选机制，是否就是在担心这套机制的后果？</strong></p>\n<p>是。机制和令人不安的后果已经由<code>because of</code>连在一起，A留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"36题","raw":"### B. companies’ financial loss due to immoral practices\n\n> 不道德行为造成的公司财务损失\n\n把B接回题干，它说的是：伊丽莎白因不道德行为造成的公司财务损失而不安。\n\nB说`financial loss`，财务损失。第2段的`wounding companies`也写公司受伤害，我们看后面有没有把这种伤害说成亏钱。\n\n> This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.\n\n`making it more likely that it would lose its way`继续解释公司受伤害后会怎样：更可能迷失方向。紧接着举的是大规模非法电话窃听。\n\n这里从缺乏道德目的接到违法取材，没有说公司亏损多少、收入怎样下降。`lose its way`也不能因出现`lose`就当成损失钱财。\n\nB把“受伤害”限定成财务损失。原文已经用迷失方向和非法窃听说明了伤害，不能再替它补出未写的亏损。\n\n**原文公司所“失去”的是方向，还是明确写出的收入或资金？**\n\n是方向。B的财务损失没有从这一句得到说明。\n\n**第一轮判断：B排除。**","articleRects":[[274,525,1122,39],[203,574,1193,38],[202,621,1194,39],[203,670,1193,38],[202,718,1194,38],[202,766,686,38]],"questionRects":[[280,317,789,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[1]},"html":"<h3>B. companies’ financial loss due to immoral practices</h3>\n<blockquote><p>不道德行为造成的公司财务损失</p>\n</blockquote>\n<p>把B接回题干，它说的是：伊丽莎白因不道德行为造成的公司财务损失而不安。</p>\n<p>B说<code>financial loss</code>，财务损失。第2段的<code>wounding companies</code>也写公司受伤害，我们看后面有没有把这种伤害说成亏钱。</p>\n<blockquote><p>This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n</blockquote>\n<p><code>making it more likely that it would lose its way</code>继续解释公司受伤害后会怎样：更可能迷失方向。紧接着举的是大规模非法电话窃听。</p>\n<p>这里从缺乏道德目的接到违法取材，没有说公司亏损多少、收入怎样下降。<code>lose its way</code>也不能因出现<code>lose</code>就当成损失钱财。</p>\n<p>B把“受伤害”限定成财务损失。原文已经用迷失方向和非法窃听说明了伤害，不能再替它补出未写的亏损。</p>\n<p><strong>原文公司所“失去”的是方向，还是明确写出的收入或资金？</strong></p>\n<p>是方向。B的财务损失没有从这一句得到说明。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. governmental ineffectiveness on moral issues\n\n> 政府在道德问题上成效不佳\n\n把C接回题干，它说的是：伊丽莎白因政府在道德问题上成效不佳而不安。\n\nC说政府处理道德问题成效不佳。第2段的`within government, media or business`也有政府，我们看这几类机构后面连着什么。\n\n> the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for **[xxx]** and freedom.\n\n原句说这些机构内部缺少目的、缺少道德语言，政府与媒体、企业并列在其中。\n\nC却把政府放到另一个位置：政府正在治理道德问题，只是没有治理好。要得到这个说法，我们得读到政府采取了哪些措施、措施怎样没生效。\n\n这段没有写那些治理行动。它是在说政府自身也缺少道德目的，而不是评价政府替别人处理道德问题的效率。\n\n**政府内部缺少道德目的，等于政府已经采取治理措施却成效不佳吗？**\n\n不等于。C把机构自身的问题改成了政府治理问题的效果。\n\n**第一轮判断：C排除。**","articleRects":[[274,525,1122,39],[203,574,1193,38],[202,621,1194,39],[203,670,1193,38],[202,718,1194,38],[202,766,686,38]],"questionRects":[[280,380,705,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"36","paragraphPids":[1]},"html":"<h3>C. governmental ineffectiveness on moral issues</h3>\n<blockquote><p>政府在道德问题上成效不佳</p>\n</blockquote>\n<p>把C接回题干，它说的是：伊丽莎白因政府在道德问题上成效不佳而不安。</p>\n<p>C说政府处理道德问题成效不佳。第2段的<code>within government, media or business</code>也有政府，我们看这几类机构后面连着什么。</p>\n<blockquote><p>the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for <strong>[xxx]</strong> and freedom.</p>\n</blockquote>\n<p>原句说这些机构内部缺少目的、缺少道德语言，政府与媒体、企业并列在其中。</p>\n<p>C却把政府放到另一个位置：政府正在治理道德问题，只是没有治理好。要得到这个说法，我们得读到政府采取了哪些措施、措施怎样没生效。</p>\n<p>这段没有写那些治理行动。它是在说政府自身也缺少道德目的，而不是评价政府替别人处理道德问题的效率。</p>\n<p><strong>政府内部缺少道德目的，等于政府已经采取治理措施却成效不佳吗？</strong></p>\n<p>不等于。C把机构自身的问题改成了政府治理问题的效果。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"36题","raw":"### D. the wide misuse of integrity among institutions\n\n> 机构中对正直的广泛误用\n\n把D接回题干，它说的是：伊丽莎白因机构中对正直的广泛误用而不安。\n\nD说正直被`misuse`，误用。原文和`integrity`连在一起的却是`dearth`与`collapsed`，我们看两边说的是有没有，还是怎么用。\n\n> the “unsettling dearth of integrity across so many of our institutions.”\n\n`dearth of integrity`是缺少正直，后一句`Integrity had collapsed`又说正直已经崩塌。她担心的是这种要求不再被坚持。\n\nD的`misuse of integrity`则假定机构在使用正直，只是用法不当。缺少一种品质，和拿这种品质去做不合适的事，并不是同一件事。\n\n`across so many institutions`只能接上广泛存在，不能让前面的“缺少”变成“误用”。\n\n**她说的是许多机构缺少正直，还是机构把正直用错了地方？**\n\n是缺少正直。D换掉了`dearth`所说的问题。\n\n**第一轮判断：D排除。**","articleRects":[[273,287,1123,37],[204,333,1192,39],[202,381,1194,39],[202,429,1194,39],[202,477,1003,39]],"questionRects":[[280,444,737,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>D. the wide misuse of integrity among institutions</h3>\n<blockquote><p>机构中对正直的广泛误用</p>\n</blockquote>\n<p>把D接回题干，它说的是：伊丽莎白因机构中对正直的广泛误用而不安。</p>\n<p>D说正直被<code>misuse</code>，误用。原文和<code>integrity</code>连在一起的却是<code>dearth</code>与<code>collapsed</code>，我们看两边说的是有没有，还是怎么用。</p>\n<blockquote><p>the “unsettling dearth of integrity across so many of our institutions.”</p>\n</blockquote>\n<p><code>dearth of integrity</code>是缺少正直，后一句<code>Integrity had collapsed</code>又说正直已经崩塌。她担心的是这种要求不再被坚持。</p>\n<p>D的<code>misuse of integrity</code>则假定机构在使用正直，只是用法不当。缺少一种品质，和拿这种品质去做不合适的事，并不是同一件事。</p>\n<p><code>across so many institutions</code>只能接上广泛存在，不能让前面的“缺少”变成“误用”。</p>\n<p><strong>她说的是许多机构缺少正直，还是机构把正直用错了地方？</strong></p>\n<p>是缺少正直。D换掉了<code>dearth</code>所说的问题。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。伊丽莎白把正直崩塌归因于利润和市场的筛选原则，能够概括为她对这套机制的后果感到不安。","articleRects":[],"questionRects":[[226,190,967,38],[281,253,792,38],[280,317,789,38],[280,380,705,38],[280,444,737,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。伊丽莎白把正直崩塌归因于利润和市场的筛选原则，能够概括为她对这套机制的后果感到不安。</p>\n"},{"section":"37题","raw":"## 37题\n\n> It can be inferred from Paragraph 3 that ______.  \n> 根据第三段可以推断出什么？\n\n题干明示Paragraph 3，直接读第三段。从窃听审判的结果读到仍在等待审判的人，分清各人物与其行为、判决的对应。\n\n> 原文参考：\n> \n> As the hacking trial concludes—finding guilty one ex-editor of the News of the World, Andy Coulson, for **[xxx]** to hack phones, and finding his **[xxx]**, Rebekah Brooks, innocent of the same charge—the wider issue of **[xxx]** of integrity still stands. Journalists are known to have hacked the phones of up to 5,500 people. This is hacking on an **[xxx]** scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking. Others await trial. This long story still **[xxx]**.\n> \n> 开始精读：\n> \n> As the hacking trial concludes—finding guilty / one ex-editor / of the News of the World, / Andy Coulson, / for **[xxx]** to hack phones, / and finding his **[xxx]**, / Rebekah Brooks, / innocent of the same charge—the / wider issue of **[xxx]** of integrity / still stands. / Journalists are known / to have hacked the phones / of up to 5,500 people. / This is hacking / on an **[xxx]** scale, / as was acknowledged by Glenn Mulcaire, / the man hired / by the News of the World / in 2001 / to be the point person / for phone hacking. / Others await trial. / This long story still **[xxx]**.\n> \n> 随着窃听审判结束并认定有罪， / 一名前主编， / 来自《世界新闻报》， / 安迪·库尔森， / 因**[xxx]**窃听电话， / 并认定他的**[xxx]**， / 丽贝卡·布鲁克斯， / 在同一指控下无罪—— / 更广泛的正直**[xxx]**问题 / 依然存在。 / 已知记者们 / 窃听过电话， / 涉及多达5,500人。 / 这是窃听， / 达到**[xxx]**的规模， / 正如格伦·穆尔凯尔所承认， / 此人受雇， / 受雇于《世界新闻报》， / 在2001年， / 去担任主要负责人， / 负责电话窃听。 / 其他人等待审判。 / 这段漫长故事仍**[xxx]**。\n\nIt can be inferred要求从这段已经交代的事实推出结论，不能把事实承认、审判结果和未来可能性混在一起。\n\n接下来按A—D逐项看。","articleRects":[[285,814,1117,38],[203,862,1193,38],[202,910,1197,38],[202,958,1197,38],[202,1006,1195,38],[202,1054,1194,38],[202,1102,1183,38]],"questionRects":[[226,570,643,38],[280,634,818,38],[280,697,815,38],[280,761,820,38],[280,824,856,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"37","initialReadingPids":[2]},"html":"<h2>37题</h2>\n<blockquote><p>It can be inferred from Paragraph 3 that ______.<br />\n根据第三段可以推断出什么？</p>\n</blockquote>\n<p>题干明示Paragraph 3，直接读第三段。从窃听审判的结果读到仍在等待审判的人，分清各人物与其行为、判决的对应。</p>\n<blockquote><p>原文参考：</p>\n<p>As the hacking trial concludes—finding guilty one ex-editor of the News of the World, Andy Coulson, for <strong>[xxx]</strong> to hack phones, and finding his <strong>[xxx]</strong>, Rebekah Brooks, innocent of the same charge—the wider issue of <strong>[xxx]</strong> of integrity still stands. Journalists are known to have hacked the phones of up to 5,500 people. This is hacking on an <strong>[xxx]</strong> scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking. Others await trial. This long story still <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>As the hacking trial concludes—finding guilty / one ex-editor / of the News of the World, / Andy Coulson, / for <strong>[xxx]</strong> to hack phones, / and finding his <strong>[xxx]</strong>, / Rebekah Brooks, / innocent of the same charge—the / wider issue of <strong>[xxx]</strong> of integrity / still stands. / Journalists are known / to have hacked the phones / of up to 5,500 people. / This is hacking / on an <strong>[xxx]</strong> scale, / as was acknowledged by Glenn Mulcaire, / the man hired / by the News of the World / in 2001 / to be the point person / for phone hacking. / Others await trial. / This long story still <strong>[xxx]</strong>.</p>\n<p>随着窃听审判结束并认定有罪， / 一名前主编， / 来自《世界新闻报》， / 安迪·库尔森， / 因<strong>[xxx]</strong>窃听电话， / 并认定他的<strong>[xxx]</strong>， / 丽贝卡·布鲁克斯， / 在同一指控下无罪—— / 更广泛的正直<strong>[xxx]</strong>问题 / 依然存在。 / 已知记者们 / 窃听过电话， / 涉及多达5,500人。 / 这是窃听， / 达到<strong>[xxx]</strong>的规模， / 正如格伦·穆尔凯尔所承认， / 此人受雇， / 受雇于《世界新闻报》， / 在2001年， / 去担任主要负责人， / 负责电话窃听。 / 其他人等待审判。 / 这段漫长故事仍<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>It can be inferred要求从这段已经交代的事实推出结论，不能把事实承认、审判结果和未来可能性混在一起。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"37题","raw":"### A. Glenn Mulcaire may deny phone hacking as a crime\n\n> 穆尔凯尔可能否认电话窃听是一种犯罪\n\n把A接回题干，它说的是：第三段可推断穆尔凯尔可能否认电话窃听是一种犯罪。\n\nA说穆尔凯尔可能否认窃听是犯罪。原句用`acknowledged`说他承认了什么，我们先读它前面那句。\n\n> This is hacking on an **[xxx]** scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.\n\n他承认的是窃听的规模。句子接着介绍他曾受雇负责电话窃听，没有引出他对犯罪性质的辩解。\n\n承认存在窃听或承认规模，和承认这属于犯罪，并非完全一样；因此不能简单用`acknowledged`去说他一定承认犯罪。但同样，这里也没有依据预测他以后会否认犯罪性质。\n\nA的`may`虽然只说可能，仍然需要文中有这样的表态或迹象。仅凭他参与过窃听，不能替他编出将来的辩词。\n\n**承认窃听规模、曾负责窃听，能否推出他可能会否认窃听是犯罪？**\n\n不能。原文没有交代这种辩解，A加了对他未来表态的猜测。\n\n**第一轮判断：A排除。**","articleRects":[[285,814,1117,38],[203,862,1193,38],[202,910,1197,38],[202,958,1197,38],[202,1006,1195,38],[202,1054,1194,38],[202,1102,1183,38]],"questionRects":[[280,634,818,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"37","paragraphPids":[2]},"html":"<h3>A. Glenn Mulcaire may deny phone hacking as a crime</h3>\n<blockquote><p>穆尔凯尔可能否认电话窃听是一种犯罪</p>\n</blockquote>\n<p>把A接回题干，它说的是：第三段可推断穆尔凯尔可能否认电话窃听是一种犯罪。</p>\n<p>A说穆尔凯尔可能否认窃听是犯罪。原句用<code>acknowledged</code>说他承认了什么，我们先读它前面那句。</p>\n<blockquote><p>This is hacking on an <strong>[xxx]</strong> scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.</p>\n</blockquote>\n<p>他承认的是窃听的规模。句子接着介绍他曾受雇负责电话窃听，没有引出他对犯罪性质的辩解。</p>\n<p>承认存在窃听或承认规模，和承认这属于犯罪，并非完全一样；因此不能简单用<code>acknowledged</code>去说他一定承认犯罪。但同样，这里也没有依据预测他以后会否认犯罪性质。</p>\n<p>A的<code>may</code>虽然只说可能，仍然需要文中有这样的表态或迹象。仅凭他参与过窃听，不能替他编出将来的辩词。</p>\n<p><strong>承认窃听规模、曾负责窃听，能否推出他可能会否认窃听是犯罪？</strong></p>\n<p>不能。原文没有交代这种辩解，A加了对他未来表态的猜测。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"37题","raw":"### B. phone hacking will be accepted on certain **[xxx]**\n\n> 电话窃听将在某些**[xxx]**上被接受\n\n把B接回题干，它说的是：第三段暗示电话窃听将在某些**[xxx]**上被接受。\n\nB说窃听将被`accepted`，接受。原文的`acknowledged by Glenn Mulcaire`容易看成相近意思，我们看被承认的到底是什么。\n\n> This is hacking on an **[xxx]** scale, as was acknowledged by Glenn Mulcaire\n\n原句先说存在这种规模的窃听，再说穆尔凯尔承认了这个事实。承认发生过，并不是认为这样做可以接受。\n\nB的末尾**[xxx]**还不知道，但前面的`will be accepted`已经明确说将来窃听会被认可。原句既没有给出未来安排，也没有讲某些条件下允许窃听。\n\n因此，不必把那个名词补出来，也能看出B把对已发生事实的承认改成了对这种做法的接受。\n\n**一个人承认发生过窃听，是否就意味着窃听这种做法将被接受？**\n\n不意味着。承认事实与认可行为不同，原句也没有作出这项未来判断。\n\n**第一轮判断：B排除。**","articleRects":[[285,814,1117,38],[203,862,1193,38],[202,910,1197,38],[202,958,1197,38],[202,1006,1195,38],[202,1054,1194,38],[202,1102,1183,38]],"questionRects":[[280,697,815,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"37","paragraphPids":[2]},"html":"<h3>B. phone hacking will be accepted on certain <strong>[xxx]</strong></h3>\n<blockquote><p>电话窃听将在某些<strong>[xxx]</strong>上被接受</p>\n</blockquote>\n<p>把B接回题干，它说的是：第三段暗示电话窃听将在某些<strong>[xxx]</strong>上被接受。</p>\n<p>B说窃听将被<code>accepted</code>，接受。原文的<code>acknowledged by Glenn Mulcaire</code>容易看成相近意思，我们看被承认的到底是什么。</p>\n<blockquote><p>This is hacking on an <strong>[xxx]</strong> scale, as was acknowledged by Glenn Mulcaire</p>\n</blockquote>\n<p>原句先说存在这种规模的窃听，再说穆尔凯尔承认了这个事实。承认发生过，并不是认为这样做可以接受。</p>\n<p>B的末尾<strong>[xxx]</strong>还不知道，但前面的<code>will be accepted</code>已经明确说将来窃听会被认可。原句既没有给出未来安排，也没有讲某些条件下允许窃听。</p>\n<p>因此，不必把那个名词补出来，也能看出B把对已发生事实的承认改成了对这种做法的接受。</p>\n<p><strong>一个人承认发生过窃听，是否就意味着窃听这种做法将被接受？</strong></p>\n<p>不意味着。承认事实与认可行为不同，原句也没有作出这项未来判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"37题","raw":"### C. Andy Coulson should be held innocent of the charge\n\n> 安迪·库尔森应被认定在这项指控下无罪\n\n把C接回题干，它说的是：应该认定库尔森在这项指控下无罪。\n\nC把`innocent`接到Andy Coulson身上。第3段首句有两个人、两种判决，我们分别跟着他们的名字读。\n\n> finding guilty one ex-editor of the News of the World, Andy Coulson, for **[xxx]** to hack phones, and finding his **[xxx]**, Rebekah Brooks, innocent of the same charge\n\n`finding guilty`后面接的是前主编Andy Coulson；`finding ... innocent`后面接的是Rebekah Brooks。\n\n这两人面对的是同一指控，但判决并不相同。不能因为后半句有`innocent of the same charge`，就让前一个人也无罪。\n\nC用了`should`，说库尔森应当无罪；原段也没有提出推翻其有罪判决的理由。它只是交代了判决，并继续追问更广泛的正直问题。\n\n**同一指控下被认定无罪的是库尔森，还是布鲁克斯？**\n\n是布鲁克斯。库尔森对应的是有罪，C也没有另获应判无罪的依据。\n\n**第一轮判断：C排除。**","articleRects":[[285,814,1117,38],[203,862,1193,38],[202,910,1197,38],[202,958,1197,38],[202,1006,1195,38],[202,1054,1194,38],[202,1102,1183,38]],"questionRects":[[280,761,820,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"37","paragraphPids":[2]},"html":"<h3>C. Andy Coulson should be held innocent of the charge</h3>\n<blockquote><p>安迪·库尔森应被认定在这项指控下无罪</p>\n</blockquote>\n<p>把C接回题干，它说的是：应该认定库尔森在这项指控下无罪。</p>\n<p>C把<code>innocent</code>接到Andy Coulson身上。第3段首句有两个人、两种判决，我们分别跟着他们的名字读。</p>\n<blockquote><p>finding guilty one ex-editor of the News of the World, Andy Coulson, for <strong>[xxx]</strong> to hack phones, and finding his <strong>[xxx]</strong>, Rebekah Brooks, innocent of the same charge</p>\n</blockquote>\n<p><code>finding guilty</code>后面接的是前主编Andy Coulson；<code>finding ... innocent</code>后面接的是Rebekah Brooks。</p>\n<p>这两人面对的是同一指控，但判决并不相同。不能因为后半句有<code>innocent of the same charge</code>，就让前一个人也无罪。</p>\n<p>C用了<code>should</code>，说库尔森应当无罪；原段也没有提出推翻其有罪判决的理由。它只是交代了判决，并继续追问更广泛的正直问题。</p>\n<p><strong>同一指控下被认定无罪的是库尔森，还是布鲁克斯？</strong></p>\n<p>是布鲁克斯。库尔森对应的是有罪，C也没有另获应判无罪的依据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"37题","raw":"### D. more journalists may be found guilty of phone hacking\n\n> 可能有更多记者因电话窃听被认定有罪\n\n把D接回题干，它说的是：第三段暗示可能有更多记者因电话窃听被认定有罪。\n\nD说可能还有更多记者被判有罪。我们把已经有罪的前主编、已知记者参与的窃听，以及段末`Others await trial`接起来。\n\n> finding guilty one ex-editor of the News of the World, Andy Coulson\n\n> Journalists are known to have hacked the phones of up to 5,500 people.\n\n> Others await trial.\n\n第一句已经有一名新闻机构前主编被判有罪，后面又说已知记者窃听过多达5500人的电话。这不是仅仅听说有一项孤立指控。\n\n段末再说还有人等待审判，说明审理并未涵盖所有相关人员。已经出现有罪判决，又有其他涉事者待审，后续可能继续出现有罪认定。\n\nD保留了`may`，没有把所有待审者说成一定有罪。这正符合眼下有已知行为、但部分判决尚未作出的情况。\n\n**已有涉案者被判有罪，而其他人仍待审，能否说后面还可能有更多有罪判决？**\n\n能。D只说可能，没有预先判定所有待审者有罪。\n\n**第一轮判断：D保留。**","articleRects":[[285,814,1117,38],[203,862,1193,38],[202,910,1197,38],[202,958,1197,38],[202,1006,1195,38],[202,1054,1194,38],[202,1102,1183,38]],"questionRects":[[280,824,856,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"37","paragraphPids":[2]},"html":"<h3>D. more journalists may be found guilty of phone hacking</h3>\n<blockquote><p>可能有更多记者因电话窃听被认定有罪</p>\n</blockquote>\n<p>把D接回题干，它说的是：第三段暗示可能有更多记者因电话窃听被认定有罪。</p>\n<p>D说可能还有更多记者被判有罪。我们把已经有罪的前主编、已知记者参与的窃听，以及段末<code>Others await trial</code>接起来。</p>\n<blockquote><p>finding guilty one ex-editor of the News of the World, Andy Coulson</p>\n</blockquote>\n<blockquote><p>Journalists are known to have hacked the phones of up to 5,500 people.</p>\n</blockquote>\n<blockquote><p>Others await trial.</p>\n</blockquote>\n<p>第一句已经有一名新闻机构前主编被判有罪，后面又说已知记者窃听过多达5500人的电话。这不是仅仅听说有一项孤立指控。</p>\n<p>段末再说还有人等待审判，说明审理并未涵盖所有相关人员。已经出现有罪判决，又有其他涉事者待审，后续可能继续出现有罪认定。</p>\n<p>D保留了<code>may</code>，没有把所有待审者说成一定有罪。这正符合眼下有已知行为、但部分判决尚未作出的情况。</p>\n<p><strong>已有涉案者被判有罪，而其他人仍待审，能否说后面还可能有更多有罪判决？</strong></p>\n<p>能。D只说可能，没有预先判定所有待审者有罪。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"37题","raw":"### 37题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。记者的已知窃听行为与仍有人等待审判，共同支持还可能出现有罪认定。","articleRects":[],"questionRects":[[226,570,643,38],[280,634,818,38],[280,697,815,38],[280,761,820,38],[280,824,856,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"37"},"html":"<h3>37题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。记者的已知窃听行为与仍有人等待审判，共同支持还可能出现有罪认定。</p>\n"},{"section":"38题","raw":"## 38题\n\n> The author believes the Rebekah Brooks’s defence ______.  \n> 作者认为布鲁克斯的辩护怎样？\n\n题干点名Rebekah Brooks’s defence，第四段The core of her successful defence直接谈这份辩护。把这一整段从道德宗旨缺乏读到她以不知情成功辩护。\n\n> 原文参考：\n> \n> In many respects, the dearth of moral purpose **[xxx]** not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing **[xxx]** was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.\n> \n> 开始精读：\n> \n> In many respects, / the dearth of moral purpose / **[xxx]** not only the fact / of such widespread phone hacking / but the terms / on which the trial took place. / One of the astonishing **[xxx]** / was how little Rebekah Brooks knew / of what went on / in her newsroom, / how little she thought to ask / and the fact / that she never inquired / how the stories arrived. / The core of her successful defence / was that she knew nothing.\n> \n> 在许多方面， / 道德宗旨的缺乏 / **[xxx]**的不只是事实， / 即如此广泛的电话窃听， / 也包括条件， / 即审判发生的条件。 / 令人惊讶的**[xxx]**之一 / 是布鲁克斯知之甚少， / 对于所发生的事， / 在她的新闻编辑室里， / 她很少想到去询问， / 以及这个事实， / 即她从不过问 / 这些报道如何得来。 / 她成功辩护的核心 / 是她什么也不知道。\n\nbelieves要求判断作者对辩护的看法。要将作者怎样描述她知情、询问的情况，与她辩护时依靠的理由联系起来。\n\n接下来按A—D逐项看。","articleRects":[[274,1150,1125,38],[203,1198,1193,38],[202,1246,1194,38],[202,1294,1195,38],[202,1342,1194,38],[202,1390,208,38]],"questionRects":[[226,951,796,30],[281,1014,493,38],[280,1078,410,30],[280,1141,375,38],[280,1205,409,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"38","initialReadingPids":[3]},"html":"<h2>38题</h2>\n<blockquote><p>The author believes the Rebekah Brooks’s defence ______.<br />\n作者认为布鲁克斯的辩护怎样？</p>\n</blockquote>\n<p>题干点名Rebekah Brooks’s defence，第四段The core of her successful defence直接谈这份辩护。把这一整段从道德宗旨缺乏读到她以不知情成功辩护。</p>\n<blockquote><p>原文参考：</p>\n<p>In many respects, the dearth of moral purpose <strong>[xxx]</strong> not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing <strong>[xxx]</strong> was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<p>开始精读：</p>\n<p>In many respects, / the dearth of moral purpose / <strong>[xxx]</strong> not only the fact / of such widespread phone hacking / but the terms / on which the trial took place. / One of the astonishing <strong>[xxx]</strong> / was how little Rebekah Brooks knew / of what went on / in her newsroom, / how little she thought to ask / and the fact / that she never inquired / how the stories arrived. / The core of her successful defence / was that she knew nothing.</p>\n<p>在许多方面， / 道德宗旨的缺乏 / <strong>[xxx]</strong>的不只是事实， / 即如此广泛的电话窃听， / 也包括条件， / 即审判发生的条件。 / 令人惊讶的<strong>[xxx]</strong>之一 / 是布鲁克斯知之甚少， / 对于所发生的事， / 在她的新闻编辑室里， / 她很少想到去询问， / 以及这个事实， / 即她从不过问 / 这些报道如何得来。 / 她成功辩护的核心 / 是她什么也不知道。</p>\n</blockquote>\n<p>believes要求判断作者对辩护的看法。要将作者怎样描述她知情、询问的情况，与她辩护时依靠的理由联系起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"38题","raw":"### A. revealed a cunning personality\n\n> 显露出狡猾的个性\n\n把A接回题干，它说的是：作者认为布鲁克斯的辩护显露出狡猾的个性。\n\nA说辩护显出狡猾个性。第4段说她不知、不问，最后以不知情辩护，我们看作者是否进一步说明她在故意耍手段。\n\n> how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.\n\n> The core of her successful defence was that she knew nothing.\n\n作者惊讶的是，她对自己的编辑室所知很少，很少想到询问，甚至从不问报道怎样得来。\n\n这些话可以让我们质疑一个负责人是否尽责，也可以让我们不相信“不知道”就足以免责。但要说她狡猾，还需要知道她有意隐瞒、安排了某种骗术，或故意制造不知情。\n\n本段没有交代这些。不能把作者对辩护的不满，直接变成对她个性和内心打算的判定。\n\n**作者质疑她不知不问，就已经说明她故意耍了什么狡猾手段吗？**\n\n没有。A把尚未交代的个性和意图加了进去。\n\n**第一轮判断：A排除。**","articleRects":[[274,1150,1125,38],[203,1198,1193,38],[202,1246,1194,38],[202,1294,1195,38],[202,1342,1194,38],[202,1390,208,38]],"questionRects":[[281,1014,493,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"38","paragraphPids":[3]},"html":"<h3>A. revealed a cunning personality</h3>\n<blockquote><p>显露出狡猾的个性</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为布鲁克斯的辩护显露出狡猾的个性。</p>\n<p>A说辩护显出狡猾个性。第4段说她不知、不问，最后以不知情辩护，我们看作者是否进一步说明她在故意耍手段。</p>\n<blockquote><p>how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.</p>\n</blockquote>\n<blockquote><p>The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<p>作者惊讶的是，她对自己的编辑室所知很少，很少想到询问，甚至从不问报道怎样得来。</p>\n<p>这些话可以让我们质疑一个负责人是否尽责，也可以让我们不相信“不知道”就足以免责。但要说她狡猾，还需要知道她有意隐瞒、安排了某种骗术，或故意制造不知情。</p>\n<p>本段没有交代这些。不能把作者对辩护的不满，直接变成对她个性和内心打算的判定。</p>\n<p><strong>作者质疑她不知不问，就已经说明她故意耍了什么狡猾手段吗？</strong></p>\n<p>没有。A把尚未交代的个性和意图加了进去。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"38题","raw":"### B. centered on trivial issues\n\n> 围绕琐碎的问题展开\n\n把B接回题干，它说的是：作者认为布鲁克斯的辩护围绕琐碎的问题展开。\n\nB说辩护围绕琐事，原句则直接用了`The core of her ... defence`。我们看这个核心究竟是什么。\n\n> how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.\n\n> The core of her successful defence was that she knew nothing.\n\n辩护核心是她什么也不知道。前一句逐一展开的，也是她不知道编辑室发生了什么、没有去问、没有追查报道来源。\n\n这些都关系到负责人是否知情和负责。作者对它们表示惊讶，并没有说她只是纠缠一些无关紧要的小事。\n\n`how little she knew`里的`little`说她知道得少，不是说事情本身很琐碎。B不能把“知之甚少”读成“讨论琐事”。\n\n**原文的`little`说的是知情程度少，还是辩护所谈的事情微不足道？**\n\n是知情程度少。辩护围绕“不知道”，并未被写成围绕琐事。\n\n**第一轮判断：B排除。**","articleRects":[[274,1150,1125,38],[203,1198,1193,38],[202,1246,1194,38],[202,1294,1195,38],[202,1342,1194,38],[202,1390,208,38]],"questionRects":[[280,1078,410,30]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"38","paragraphPids":[3]},"html":"<h3>B. centered on trivial issues</h3>\n<blockquote><p>围绕琐碎的问题展开</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为布鲁克斯的辩护围绕琐碎的问题展开。</p>\n<p>B说辩护围绕琐事，原句则直接用了<code>The core of her ... defence</code>。我们看这个核心究竟是什么。</p>\n<blockquote><p>how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.</p>\n</blockquote>\n<blockquote><p>The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<p>辩护核心是她什么也不知道。前一句逐一展开的，也是她不知道编辑室发生了什么、没有去问、没有追查报道来源。</p>\n<p>这些都关系到负责人是否知情和负责。作者对它们表示惊讶，并没有说她只是纠缠一些无关紧要的小事。</p>\n<p><code>how little she knew</code>里的<code>little</code>说她知道得少，不是说事情本身很琐碎。B不能把“知之甚少”读成“讨论琐事”。</p>\n<p><strong>原文的<code>little</code>说的是知情程度少，还是辩护所谈的事情微不足道？</strong></p>\n<p>是知情程度少。辩护围绕“不知道”，并未被写成围绕琐事。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"38题","raw":"### C. was hardly convincing\n\n> 几乎没有说服力\n\n把C接回题干，它说的是：作者认为布鲁克斯的辩护几乎没有说服力。\n\nC说几乎不能令人信服。原文称辩护`successful`，但前面又称她的不知不问`astonishing`，两处要一起读。\n\n> One of the astonishing **[xxx]** was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.\n\n> The core of her successful defence was that she knew nothing.\n\n`successful`交代辩护在审判中的结果，它成功了。作者自己的评价在前一句：作为编辑室负责人，她竟然如此不了解发生的事，也从不询问报道来源。\n\n如果作者只是认可这项辩护，就没有必要把这些不知不问逐项拎出来，并说令人惊讶。这里是在追问：负责人的不知情，真的能成为令人接受的理由吗？\n\n因此，法律辩护成功和作者被说服不能画等号。C说作者不信服，能接上他对这一理由的质疑。\n\n**辩护成功，就等于作者也认可“不知情”足以解释负责人的行为吗？**\n\n不等于。作者对她不知不问的强调表明他没有被这项理由说服，C留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,1150,1125,38],[203,1198,1193,38],[202,1246,1194,38],[202,1294,1195,38],[202,1342,1194,38],[202,1390,208,38]],"questionRects":[[280,1141,375,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"38","paragraphPids":[3]},"html":"<h3>C. was hardly convincing</h3>\n<blockquote><p>几乎没有说服力</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为布鲁克斯的辩护几乎没有说服力。</p>\n<p>C说几乎不能令人信服。原文称辩护<code>successful</code>，但前面又称她的不知不问<code>astonishing</code>，两处要一起读。</p>\n<blockquote><p>One of the astonishing <strong>[xxx]</strong> was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.</p>\n</blockquote>\n<blockquote><p>The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<p><code>successful</code>交代辩护在审判中的结果，它成功了。作者自己的评价在前一句：作为编辑室负责人，她竟然如此不了解发生的事，也从不询问报道来源。</p>\n<p>如果作者只是认可这项辩护，就没有必要把这些不知不问逐项拎出来，并说令人惊讶。这里是在追问：负责人的不知情，真的能成为令人接受的理由吗？</p>\n<p>因此，法律辩护成功和作者被说服不能画等号。C说作者不信服，能接上他对这一理由的质疑。</p>\n<p><strong>辩护成功，就等于作者也认可“不知情”足以解释负责人的行为吗？</strong></p>\n<p>不等于。作者对她不知不问的强调表明他没有被这项理由说服，C留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"38题","raw":"### D. was part of a conspiracy\n\n> 是某个阴谋的一部分\n\n把D接回题干，它说的是：作者认为布鲁克斯的辩护是某个阴谋的一部分。\n\nD说辩护属于阴谋。原文末句说她以不知道来辩护，我们看有没有写她与谁共同策划了什么。\n\n> she never inquired how the stories arrived.\n\n> The core of her successful defence was that she knew nothing.\n\n她从不询问报道来源，成功辩护的核心是她不知情。这两句能让我们检查她是否负责，以及辩护是否能让人信服。\n\n阴谋却还要求有暗中的策划。D不仅说辩护有问题，还断定它属于某项策划的一部分。\n\n原段没有交代与她共同策划的人、计划或安排。不能因为事件涉及非法窃听，就把她的辩护本身也自动认定为阴谋。\n\n**不询问来源、以不知情辩护，这些事实已经交代了一项由她参与策划的阴谋吗？**\n\n没有。D加入了本段并未说明的策划。\n\n**第一轮判断：D排除。**","articleRects":[[274,1150,1125,38],[203,1198,1193,38],[202,1246,1194,38],[202,1294,1195,38],[202,1342,1194,38],[202,1390,208,38]],"questionRects":[[280,1205,409,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"38","paragraphPids":[3]},"html":"<h3>D. was part of a conspiracy</h3>\n<blockquote><p>是某个阴谋的一部分</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为布鲁克斯的辩护是某个阴谋的一部分。</p>\n<p>D说辩护属于阴谋。原文末句说她以不知道来辩护，我们看有没有写她与谁共同策划了什么。</p>\n<blockquote><p>she never inquired how the stories arrived.</p>\n</blockquote>\n<blockquote><p>The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<p>她从不询问报道来源，成功辩护的核心是她不知情。这两句能让我们检查她是否负责，以及辩护是否能让人信服。</p>\n<p>阴谋却还要求有暗中的策划。D不仅说辩护有问题，还断定它属于某项策划的一部分。</p>\n<p>原段没有交代与她共同策划的人、计划或安排。不能因为事件涉及非法窃听，就把她的辩护本身也自动认定为阴谋。</p>\n<p><strong>不询问来源、以不知情辩护，这些事实已经交代了一项由她参与策划的阴谋吗？</strong></p>\n<p>没有。D加入了本段并未说明的策划。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。作者强调她不知、不问的惊人情形，使“不知道”这一辩护理由受到质疑；辩护成功不等于作者信服。","articleRects":[],"questionRects":[[226,951,796,30],[281,1014,493,38],[280,1078,410,30],[280,1141,375,38],[280,1205,409,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。作者强调她不知、不问的惊人情形，使“不知道”这一辩护理由受到质疑；辩护成功不等于作者信服。</p>\n"},{"section":"39题","raw":"## 39题\n\n> The author holds that the current collective doctrine shows ______.  \n> 作者认为当前的集体信条表现出什么？\n\n题干的current collective doctrine对应第五段the collective doctrine has been。先完整读第五段，从高管不问责的常态，读到利润筛选原则和两组词语。\n\n> 原文参考：\n> \n> In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, **[xxx]**, **[xxx]** value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words **[xxx]** to the margin have been justice, fairness, tolerance, **[xxx]** and accountability.\n> \n> 开始精读：\n> \n> In today’s world, / it has become normal / that well-paid executives / should not be accountable / for what happens / in the organisations that they run. / Perhaps we should not / be so surprised. / For a generation, / the collective doctrine has been / that the sorting mechanism of society / should be profit. / The words that have mattered / are efficiency, **[xxx]**, **[xxx]** value, / business-friendly, wealth generation, sales, / impact and, in newspapers, circulation. / Words **[xxx]** to the margin / have been justice, fairness, tolerance, / **[xxx]** and accountability.\n> \n> 在当今世界， / 已变得正常的是， / 薪酬丰厚的高管 / 竟无需承担责任， / 对于所发生的事， / 在他们经营的机构中。 / 或许我们不应 / 如此惊讶。 / 一代人以来， / 集体信条一直是， / 社会的筛选机制 / 应当是利润。 / 一直受重视的词 / 效率、**[xxx]**、**[xxx]**价值 / 亲商、财富创造、销量， / 影响力及报纸的发行量。 / **[xxx]**到边缘的词 / 一直是正义、公平、宽容、 / **[xxx]**和问责。\n\nshows要求判断这套集体信条呈现怎样的取向，要对照社会以什么为衡量标准，以及这种标准与管理者承担责任之间的关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1438,1122,38],[202,1486,1194,38],[203,1534,1193,38],[202,1582,1194,38],[203,1630,1190,38],[203,1678,1194,38],[202,1726,1025,38]],"questionRects":[[226,1331,916,31],[280,1395,421,38],[280,1458,414,31],[280,1522,389,38],[280,1585,321,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"39","initialReadingPids":[4]},"html":"<h2>39题</h2>\n<blockquote><p>The author holds that the current collective doctrine shows ______.<br />\n作者认为当前的集体信条表现出什么？</p>\n</blockquote>\n<p>题干的current collective doctrine对应第五段the collective doctrine has been。先完整读第五段，从高管不问责的常态，读到利润筛选原则和两组词语。</p>\n<blockquote><p>原文参考：</p>\n<p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, <strong>[xxx]</strong>, <strong>[xxx]</strong> value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words <strong>[xxx]</strong> to the margin have been justice, fairness, tolerance, <strong>[xxx]</strong> and accountability.</p>\n<p>开始精读：</p>\n<p>In today’s world, / it has become normal / that well-paid executives / should not be accountable / for what happens / in the organisations that they run. / Perhaps we should not / be so surprised. / For a generation, / the collective doctrine has been / that the sorting mechanism of society / should be profit. / The words that have mattered / are efficiency, <strong>[xxx]</strong>, <strong>[xxx]</strong> value, / business-friendly, wealth generation, sales, / impact and, in newspapers, circulation. / Words <strong>[xxx]</strong> to the margin / have been justice, fairness, tolerance, / <strong>[xxx]</strong> and accountability.</p>\n<p>在当今世界， / 已变得正常的是， / 薪酬丰厚的高管 / 竟无需承担责任， / 对于所发生的事， / 在他们经营的机构中。 / 或许我们不应 / 如此惊讶。 / 一代人以来， / 集体信条一直是， / 社会的筛选机制 / 应当是利润。 / 一直受重视的词 / 效率、<strong>[xxx]</strong>、<strong>[xxx]</strong>价值 / 亲商、财富创造、销量， / 影响力及报纸的发行量。 / <strong>[xxx]</strong>到边缘的词 / 一直是正义、公平、宽容、 / <strong>[xxx]</strong>和问责。</p>\n</blockquote>\n<p>shows要求判断这套集体信条呈现怎样的取向，要对照社会以什么为衡量标准，以及这种标准与管理者承担责任之间的关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"39题","raw":"### A. generally distorted values\n\n> 普遍扭曲的价值观\n\n把A接回题干，它说的是：作者认为当前集体信条表现出普遍扭曲的价值观。\n\nA说普遍的价值扭曲。第5段先说高管不担责已成常态，接着说社会以利润筛选，我们把这两件事连起来。\n\n> In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.\n\n> For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.\n\n> The words that have mattered are efficiency, **[xxx]**, **[xxx]** value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation.\n\n高管拿着高薪，却不用为自己管理的机构负责，作者说这已经变得正常。随后解释，一代人以来大家用利润作社会的筛选标准。\n\n再往下，受重视的是效率、财富、销售和发行量；正义、公平、问责却处在另一边。文章不是单纯批评挣钱，而是说挣钱成了主要尺度，责任和道德要求被放下了。\n\nA的`distorted values`概括的就是这种轻重颠倒。`normal`和`collective`又表明作者谈的是普遍接受的做法，不只一个高管。\n\n**利润受到重视，而拿高薪的负责人不担责竟成了常态，是否表现出价值取舍出了问题？**\n\n是。A同时接住了这种取舍的偏差和它的普遍性。\n\n**第一轮判断：A保留。**","articleRects":[[274,1438,1122,38],[202,1486,1194,38],[203,1534,1193,38],[202,1582,1194,38],[203,1630,1190,38],[203,1678,1194,38],[202,1726,1025,38]],"questionRects":[[280,1395,421,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"39","paragraphPids":[4]},"html":"<h3>A. generally distorted values</h3>\n<blockquote><p>普遍扭曲的价值观</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为当前集体信条表现出普遍扭曲的价值观。</p>\n<p>A说普遍的价值扭曲。第5段先说高管不担责已成常态，接着说社会以利润筛选，我们把这两件事连起来。</p>\n<blockquote><p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n</blockquote>\n<blockquote><p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n</blockquote>\n<blockquote><p>The words that have mattered are efficiency, <strong>[xxx]</strong>, <strong>[xxx]</strong> value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation.</p>\n</blockquote>\n<p>高管拿着高薪，却不用为自己管理的机构负责，作者说这已经变得正常。随后解释，一代人以来大家用利润作社会的筛选标准。</p>\n<p>再往下，受重视的是效率、财富、销售和发行量；正义、公平、问责却处在另一边。文章不是单纯批评挣钱，而是说挣钱成了主要尺度，责任和道德要求被放下了。</p>\n<p>A的<code>distorted values</code>概括的就是这种轻重颠倒。<code>normal</code>和<code>collective</code>又表明作者谈的是普遍接受的做法，不只一个高管。</p>\n<p><strong>利润受到重视，而拿高薪的负责人不担责竟成了常态，是否表现出价值取舍出了问题？</strong></p>\n<p>是。A同时接住了这种取舍的偏差和它的普遍性。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"39题","raw":"### B. unfair wealth distribution\n\n> 不公平的财富分配\n\n把B接回题干，它说的是：当前集体信条表现出不公平的财富分配。\n\nB说财富分配不公。原文有`well-paid`和`wealth generation`，我们看作者是在比较谁拿了多少，还是在问拿钱者是否负责。\n\n> In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.\n\n> business-friendly, wealth generation, sales, impact and, in newspapers, circulation.\n\n`well-paid executives should not be accountable`说的是高薪高管竟然不需要为管理的机构负责。作者把报酬和责任放在一起，并没有比较他们与其他群体的收入份额。\n\n`wealth generation`又被列为社会重视的目标，它说创造财富，不是怎样分配财富。\n\n因此，有高薪、有财富，不等于文章已经提出财富分配不公。这里直接指出的问题是唯利润和不问责。\n\n**拿高薪却不担责，是否已经说明了各群体之间怎样分配财富、分配是否公平？**\n\n没有。B把责任问题换成了本段没有展开的财富分配。\n\n**第一轮判断：B排除。**","articleRects":[[274,1438,1122,38],[202,1486,1194,38],[203,1534,1193,38],[202,1582,1194,38],[203,1630,1190,38],[203,1678,1194,38],[202,1726,1025,38]],"questionRects":[[280,1458,414,31]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"39","paragraphPids":[4]},"html":"<h3>B. unfair wealth distribution</h3>\n<blockquote><p>不公平的财富分配</p>\n</blockquote>\n<p>把B接回题干，它说的是：当前集体信条表现出不公平的财富分配。</p>\n<p>B说财富分配不公。原文有<code>well-paid</code>和<code>wealth generation</code>，我们看作者是在比较谁拿了多少，还是在问拿钱者是否负责。</p>\n<blockquote><p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n</blockquote>\n<blockquote><p>business-friendly, wealth generation, sales, impact and, in newspapers, circulation.</p>\n</blockquote>\n<p><code>well-paid executives should not be accountable</code>说的是高薪高管竟然不需要为管理的机构负责。作者把报酬和责任放在一起，并没有比较他们与其他群体的收入份额。</p>\n<p><code>wealth generation</code>又被列为社会重视的目标，它说创造财富，不是怎样分配财富。</p>\n<p>因此，有高薪、有财富，不等于文章已经提出财富分配不公。这里直接指出的问题是唯利润和不问责。</p>\n<p><strong>拿高薪却不担责，是否已经说明了各群体之间怎样分配财富、分配是否公平？</strong></p>\n<p>没有。B把责任问题换成了本段没有展开的财富分配。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"39题","raw":"### C. a **[xxx]** lifestyle\n\n> 一种**[xxx]**的生活方式\n\n把C接回题干，它说的是：作者认为当前集体信条表现出一种**[xxx]**的生活方式。\n\nC的修饰词被挡住，但后面的`lifestyle`是生活方式。第5段写高管的地方，我们看有没有讲他们平时怎样生活。\n\n> In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.\n\n> For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.\n\n高管被描述为拿高薪、不为自己管理的机构担责。接下来写社会以利润筛选，又列出哪些价值受到重视。\n\n这些句子没有介绍他们的吃穿、消费或日常习惯。拿高薪只是报酬情况，不能单靠这一点推断某一种生活方式。\n\n所以，C那个形容词虽还没认出，`lifestyle`已经把问题带到日常生活上。原文写明的却是社会怎样评价成功、负责人需不需要担责。\n\n**高薪和不问责这两件事，足以让我们知道高管过着怎样一种生活方式吗？**\n\n不足以。C要谈的生活方式没有在本段被说明。\n\n**第一轮判断：C排除。**","articleRects":[[274,1438,1122,38],[202,1486,1194,38],[203,1534,1193,38],[202,1582,1194,38],[203,1630,1190,38],[203,1678,1194,38],[202,1726,1025,38]],"questionRects":[[280,1522,389,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"39","paragraphPids":[4]},"html":"<h3>C. a <strong>[xxx]</strong> lifestyle</h3>\n<blockquote><p>一种<strong>[xxx]</strong>的生活方式</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为当前集体信条表现出一种<strong>[xxx]</strong>的生活方式。</p>\n<p>C的修饰词被挡住，但后面的<code>lifestyle</code>是生活方式。第5段写高管的地方，我们看有没有讲他们平时怎样生活。</p>\n<blockquote><p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n</blockquote>\n<blockquote><p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n</blockquote>\n<p>高管被描述为拿高薪、不为自己管理的机构担责。接下来写社会以利润筛选，又列出哪些价值受到重视。</p>\n<p>这些句子没有介绍他们的吃穿、消费或日常习惯。拿高薪只是报酬情况，不能单靠这一点推断某一种生活方式。</p>\n<p>所以，C那个形容词虽还没认出，<code>lifestyle</code>已经把问题带到日常生活上。原文写明的却是社会怎样评价成功、负责人需不需要担责。</p>\n<p><strong>高薪和不问责这两件事，足以让我们知道高管过着怎样一种生活方式吗？</strong></p>\n<p>不足以。C要谈的生活方式没有在本段被说明。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"39题","raw":"### D. a rigid moral code\n\n> 僵硬严格的道德准则\n\n把D接回题干，它说的是：当前集体信条表现出僵硬严格的道德准则。\n\nD说严格僵硬的道德准则。原文开头恰好说高管无需担责，我们看这套信条在要求人遵守什么。\n\n> In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.\n\n> For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.\n\n社会用来筛选的标准是利润，作者列出的受重视目标也是效率、财富、销售和发行量。高管即使不担责，仍被看作正常。\n\n如果这里显示的是严格的道德准则，就应该对正义、公平、责任提出强要求；本段写出的情形却是这些要求被利润挤开。\n\n不能因为“利润标准”被很多人接受，就把它叫作严格的道德准则。标准被坚持和道德被坚持，是两回事。\n\n**负责人不承担责任却被视为正常，能说明这里严格坚持了道德准则吗？**\n\n不能。原文恰好在批评利润取代了责任等道德要求。\n\n**第一轮判断：D排除。**","articleRects":[[274,1438,1122,38],[202,1486,1194,38],[203,1534,1193,38],[202,1582,1194,38],[203,1630,1190,38],[203,1678,1194,38],[202,1726,1025,38]],"questionRects":[[280,1585,321,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"39","paragraphPids":[4]},"html":"<h3>D. a rigid moral code</h3>\n<blockquote><p>僵硬严格的道德准则</p>\n</blockquote>\n<p>把D接回题干，它说的是：当前集体信条表现出僵硬严格的道德准则。</p>\n<p>D说严格僵硬的道德准则。原文开头恰好说高管无需担责，我们看这套信条在要求人遵守什么。</p>\n<blockquote><p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n</blockquote>\n<blockquote><p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n</blockquote>\n<p>社会用来筛选的标准是利润，作者列出的受重视目标也是效率、财富、销售和发行量。高管即使不担责，仍被看作正常。</p>\n<p>如果这里显示的是严格的道德准则，就应该对正义、公平、责任提出强要求；本段写出的情形却是这些要求被利润挤开。</p>\n<p>不能因为“利润标准”被很多人接受，就把它叫作严格的道德准则。标准被坚持和道德被坚持，是两回事。</p>\n<p><strong>负责人不承担责任却被视为正常，能说明这里严格坚持了道德准则吗？</strong></p>\n<p>不能。原文恰好在批评利润取代了责任等道德要求。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。以利润为社会筛选标准而不要求高管问责，呈现了普遍的价值偏差。","articleRects":[],"questionRects":[[226,1331,916,31],[280,1395,421,38],[280,1458,414,31],[280,1522,389,38],[280,1585,321,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。以利润为社会筛选标准而不要求高管问责，呈现了普遍的价值偏差。</p>\n"},{"section":"40题","raw":"## 40题\n\n> Which of the following is suggested in the last paragraph?  \n> 最后一段暗示下列哪一点？\n\n题干直接限定the last paragraph，即第六段。完整读这段，从报纸编辑工作的目的读到布鲁克斯是否怀疑以及她具体做了什么。\n\n> 原文参考：\n> \n> The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity. It was to ruin lives in the **[xxx]** for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions—nor received **[xxx]**, recorded answers.\n> \n> 开始精读：\n> \n> The purpose of editing / the News of the World / was not to promote reader understanding / , to be fair / in what was written / or to betray any common humanity. / It was to ruin lives / in the **[xxx]** / for circulation and impact. / Ms Brooks may or may not / have had suspicions / about how her journalists / got their stories, / but she asked no questions, / gave no instructions—nor received / **[xxx]**, recorded answers.\n> \n> 编辑工作的目的， / 对于《世界新闻报》， / 并不是增进读者的理解， / 不是做到公平， / 在所写的内容中， / 也不是流露任何共同的人性。 / 它是去毁掉人生， / 在**[xxx]**中， / 为了发行量和影响力。 / 布鲁克斯女士可能有也可能没有 / 产生过怀疑， / 关于她的记者如何 / 获得他们的报道， / 但她没有提出问题， / 没有下指令——也没有收到 / **[xxx]**、有记录的回答。\n\nsuggested允许从作者对这份报纸的批评作出推断，需要保留编辑目的、伤害他人的结果与管理者实际行为之间的联系。\n\n接下来按A—D逐项看。","articleRects":[[274,1774,1123,38],[202,1822,1184,38],[407,1843,11,15],[202,1870,1195,38],[202,1918,1194,38],[203,1966,1181,38]],"questionRects":[[225,1712,915,38],[281,1775,767,38],[280,1839,759,38],[280,1902,745,38],[280,1966,714,37],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"40","initialReadingPids":[5]},"html":"<h2>40题</h2>\n<blockquote><p>Which of the following is suggested in the last paragraph?<br />\n最后一段暗示下列哪一点？</p>\n</blockquote>\n<p>题干直接限定the last paragraph，即第六段。完整读这段，从报纸编辑工作的目的读到布鲁克斯是否怀疑以及她具体做了什么。</p>\n<blockquote><p>原文参考：</p>\n<p>The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity. It was to ruin lives in the <strong>[xxx]</strong> for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions—nor received <strong>[xxx]</strong>, recorded answers.</p>\n<p>开始精读：</p>\n<p>The purpose of editing / the News of the World / was not to promote reader understanding / , to be fair / in what was written / or to betray any common humanity. / It was to ruin lives / in the <strong>[xxx]</strong> / for circulation and impact. / Ms Brooks may or may not / have had suspicions / about how her journalists / got their stories, / but she asked no questions, / gave no instructions—nor received / <strong>[xxx]</strong>, recorded answers.</p>\n<p>编辑工作的目的， / 对于《世界新闻报》， / 并不是增进读者的理解， / 不是做到公平， / 在所写的内容中， / 也不是流露任何共同的人性。 / 它是去毁掉人生， / 在<strong>[xxx]</strong>中， / 为了发行量和影响力。 / 布鲁克斯女士可能有也可能没有 / 产生过怀疑， / 关于她的记者如何 / 获得他们的报道， / 但她没有提出问题， / 没有下指令——也没有收到 / <strong>[xxx]</strong>、有记录的回答。</p>\n</blockquote>\n<p>suggested允许从作者对这份报纸的批评作出推断，需要保留编辑目的、伤害他人的结果与管理者实际行为之间的联系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. The quality of writings is of primary importance.\n\n> 写作质量具有首要的重要性。\n\n把A接回题干，它说的是：最后一段暗示写作质量具有首要的重要性。\n\nA说写作质量最重要。末段确实提到`what was written`，我们看作者在意的是文字技巧，还是报道怎样对待人。\n\n> The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.\n\n> It was to ruin lives in the **[xxx]** for circulation and impact.\n\n作者列出的是帮助读者理解、公平和共同人性，接着批评报纸为了发行量和影响力毁掉他人的生活。\n\n这里没有比较文章写得是否流畅、结构是否好，更没有把写作质量排为第一。`fair in what was written`要求内容公平，不能直接换成一般的写作质量。\n\nA的`primary importance`还增加了最高的排序。作者在反对伤害人、只看销量，并未作出这种质量排名。\n\n**批评报道不公平、伤害他人，是否就是在说写作质量具有首要地位？**\n\n不是。原文具体谈的是报道的道德要求，没有给写作质量排第一。\n\n**第一轮判断：A排除。**","articleRects":[[274,1774,1123,38],[202,1822,1184,38],[407,1843,11,15],[202,1870,1195,38],[202,1918,1194,38],[203,1966,1181,38]],"questionRects":[[281,1775,767,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"40","paragraphPids":[5]},"html":"<h3>A. The quality of writings is of primary importance.</h3>\n<blockquote><p>写作质量具有首要的重要性。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最后一段暗示写作质量具有首要的重要性。</p>\n<p>A说写作质量最重要。末段确实提到<code>what was written</code>，我们看作者在意的是文字技巧，还是报道怎样对待人。</p>\n<blockquote><p>The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.</p>\n</blockquote>\n<blockquote><p>It was to ruin lives in the <strong>[xxx]</strong> for circulation and impact.</p>\n</blockquote>\n<p>作者列出的是帮助读者理解、公平和共同人性，接着批评报纸为了发行量和影响力毁掉他人的生活。</p>\n<p>这里没有比较文章写得是否流畅、结构是否好，更没有把写作质量排为第一。<code>fair in what was written</code>要求内容公平，不能直接换成一般的写作质量。</p>\n<p>A的<code>primary importance</code>还增加了最高的排序。作者在反对伤害人、只看销量，并未作出这种质量排名。</p>\n<p><strong>批评报道不公平、伤害他人，是否就是在说写作质量具有首要地位？</strong></p>\n<p>不是。原文具体谈的是报道的道德要求，没有给写作质量排第一。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"40题","raw":"### B. Moral awareness matters in editing a newspaper.\n\n> 道德意识对编辑报纸很重要。\n\n把B接回题干，它说的是：最后一段暗示编辑报纸需要重视道德意识。\n\nB说编辑报纸需要道德意识。末段从`The purpose of editing`起，逐项说哪些要求被放弃，我们把它们与后面的伤害连起来。\n\n> The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.\n\n> It was to ruin lives in the **[xxx]** for circulation and impact.\n\n公平、让读者理解、顾及共同人性，本应在编辑报纸时被考虑。这家报纸却没有以此为目的，而是为了发行量和影响力去毁掉他人生活。\n\n作者把被放下的要求与造成的伤害并列出来，正是在说：编辑不能只问报道有没有影响，还得问报道是否公平、会不会伤害人。\n\nB用道德意识概括这种考虑，既没有另加管理规定，也没有把问题改成文字技巧。\n\n**报纸不顾公平和人性、为发行量伤害人，这样的批评是否要求编辑重视道德？**\n\n是。B接住了作者希望编辑考虑而这家报纸忽略的事情，先留下。\n\n**第一轮判断：B保留。**","articleRects":[[274,1774,1123,38],[202,1822,1184,38],[407,1843,11,15],[202,1870,1195,38],[202,1918,1194,38],[203,1966,1181,38]],"questionRects":[[280,1839,759,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"40","paragraphPids":[5]},"html":"<h3>B. Moral awareness matters in editing a newspaper.</h3>\n<blockquote><p>道德意识对编辑报纸很重要。</p>\n</blockquote>\n<p>把B接回题干，它说的是：最后一段暗示编辑报纸需要重视道德意识。</p>\n<p>B说编辑报纸需要道德意识。末段从<code>The purpose of editing</code>起，逐项说哪些要求被放弃，我们把它们与后面的伤害连起来。</p>\n<blockquote><p>The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.</p>\n</blockquote>\n<blockquote><p>It was to ruin lives in the <strong>[xxx]</strong> for circulation and impact.</p>\n</blockquote>\n<p>公平、让读者理解、顾及共同人性，本应在编辑报纸时被考虑。这家报纸却没有以此为目的，而是为了发行量和影响力去毁掉他人生活。</p>\n<p>作者把被放下的要求与造成的伤害并列出来，正是在说：编辑不能只问报道有没有影响，还得问报道是否公平、会不会伤害人。</p>\n<p>B用道德意识概括这种考虑，既没有另加管理规定，也没有把问题改成文字技巧。</p>\n<p><strong>报纸不顾公平和人性、为发行量伤害人，这样的批评是否要求编辑重视道德？</strong></p>\n<p>是。B接住了作者希望编辑考虑而这家报纸忽略的事情，先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"40题","raw":"### C. Common humanity is central to news reporting.\n\n> 共同的人性在新闻报道中具有核心地位。\n\n把C接回题干，它说的是：最后一段暗示共同的人性在新闻报道中具有核心地位。\n\nC说共同人性对报道很重要。原文直接提到`common humanity`，后一句又说`ruin lives`，我们把这两处接起来。\n\n> The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.\n\n> It was to ruin lives in the **[xxx]** for circulation and impact.\n\n文章批评报纸没有顾及共同的人性，反而毁掉人的生活。缺少对人的关怀与伤害人紧接在一起，确实能让我们想到报道需要这种关怀。\n\n不过，同一句还写了读者理解和公平，段末又写编辑不提问、不指示。C只抓住共同人性，是否把最后一段要说的事都接住，仍需往前后连起来看。\n\n现在不能因为还有其他要求，就说人性关怀不重要；先把C与B保留，再看段末为何落到编辑的做法。\n\n**原文批评不顾共同人性并伤害生活，能否支持报道应该重视对人的基本关怀？**\n\n能。C这一点有原句可接，先和B一起留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,1774,1123,38],[202,1822,1184,38],[407,1843,11,15],[202,1870,1195,38],[202,1918,1194,38],[203,1966,1181,38]],"questionRects":[[280,1902,745,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"40","paragraphPids":[5]},"html":"<h3>C. Common humanity is central to news reporting.</h3>\n<blockquote><p>共同的人性在新闻报道中具有核心地位。</p>\n</blockquote>\n<p>把C接回题干，它说的是：最后一段暗示共同的人性在新闻报道中具有核心地位。</p>\n<p>C说共同人性对报道很重要。原文直接提到<code>common humanity</code>，后一句又说<code>ruin lives</code>，我们把这两处接起来。</p>\n<blockquote><p>The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.</p>\n</blockquote>\n<blockquote><p>It was to ruin lives in the <strong>[xxx]</strong> for circulation and impact.</p>\n</blockquote>\n<p>文章批评报纸没有顾及共同的人性，反而毁掉人的生活。缺少对人的关怀与伤害人紧接在一起，确实能让我们想到报道需要这种关怀。</p>\n<p>不过，同一句还写了读者理解和公平，段末又写编辑不提问、不指示。C只抓住共同人性，是否把最后一段要说的事都接住，仍需往前后连起来看。</p>\n<p>现在不能因为还有其他要求，就说人性关怀不重要；先把C与B保留，再看段末为何落到编辑的做法。</p>\n<p><strong>原文批评不顾共同人性并伤害生活，能否支持报道应该重视对人的基本关怀？</strong></p>\n<p>能。C这一点有原句可接，先和B一起留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"40题","raw":"### D. Journalists need stricter **[xxx]** regulations.\n\n> 记者需要更严格的**[xxx]**规章。\n\n把D接回题干，它说的是：最后一段暗示记者需要更严格的**[xxx]**规章。\n\nD说记者需要更严格的规章。末句写编辑没有提问、没有指示，我们看看缺少的是现有管理行动，还是某套规章太松。\n\n> Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions—nor received **[xxx]**, recorded answers.\n\n布鲁克斯可能怀疑过，也可能没有怀疑，但她没有问报道怎么来的，没有给出指示。这些都是她在管理中未做的事情。\n\nD的**[xxx]**没有读懂，不过`stricter ... regulations`已经说要把规章加严。要推出这件事，还需要知道原有规章怎样不够严格。\n\n本段没有介绍原有规定。负责人不询问、不负责，不能直接变成记者的规章必须再收紧。\n\n**原文写编辑没有询问和指示，是否就证明现有记者规章不够严格？**\n\n没有。D把编辑未尽责任改成了加严规章的要求。\n\n**第一轮判断：D排除。**","articleRects":[[274,1774,1123,38],[202,1822,1184,38],[407,1843,11,15],[202,1870,1195,38],[202,1918,1194,38],[203,1966,1181,38]],"questionRects":[[280,1966,714,37],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"40","paragraphPids":[5]},"html":"<h3>D. Journalists need stricter <strong>[xxx]</strong> regulations.</h3>\n<blockquote><p>记者需要更严格的<strong>[xxx]</strong>规章。</p>\n</blockquote>\n<p>把D接回题干，它说的是：最后一段暗示记者需要更严格的<strong>[xxx]</strong>规章。</p>\n<p>D说记者需要更严格的规章。末句写编辑没有提问、没有指示，我们看看缺少的是现有管理行动，还是某套规章太松。</p>\n<blockquote><p>Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions—nor received <strong>[xxx]</strong>, recorded answers.</p>\n</blockquote>\n<p>布鲁克斯可能怀疑过，也可能没有怀疑，但她没有问报道怎么来的，没有给出指示。这些都是她在管理中未做的事情。</p>\n<p>D的<strong>[xxx]</strong>没有读懂，不过<code>stricter ... regulations</code>已经说要把规章加严。要推出这件事，还需要知道原有规章怎样不够严格。</p>\n<p>本段没有介绍原有规定。负责人不询问、不负责，不能直接变成记者的规章必须再收紧。</p>\n<p><strong>原文写编辑没有询问和指示，是否就证明现有记者规章不够严格？</strong></p>\n<p>没有。D把编辑未尽责任改成了加严规章的要求。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n暂时保留：B、C。\n\n第一遍留下B、C。作者批评办报时不顾公平、人性并伤害他人，可以支持道德意识的重要性，也能支持共同的人性对报道的重要作用。","articleRects":[],"questionRects":[[225,1712,915,38],[281,1775,767,38],[280,1839,759,38],[280,1902,745,38],[280,1966,714,37],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：B 的利润取向。</td></tr><tr><td>第6段</td><td>to be fair；any common humanity；asked no questions, gave no instructions</td><td>not to promote reader understanding、to be fair和any common humanity列出这份报纸没有顾及的编辑要求，ruin lives与for circulation and impact写出它追逐传播效果给人带来的伤害；asked no questions、gave no instructions再落实管理者未采取的行动，接住上段的取向与责任问题。</td><td>将办报目的、伤害后果与编辑失责连起来，收束批评。</td></tr></tbody></table>\n<p>全文观点：作者把只认利润的社会筛选原则与道德宗旨的缺失联系起来，以电话窃听、以不知情辩护和办报伤害他人的事实，批评经济及传播效果被看重而公平、对人的关怀和管理责任受到忽视。</p>\n"},{"section":"进阶回查","raw":"## 回查40题：B还是C？\n\nB. Moral awareness matters in editing a newspaper.\n\nC. Common humanity is central to news reporting.\n\nB说编辑报纸需要重视道德，C说报道要重视共同人性。末段的`common humanity`和`ruin lives`确实能支持C，第一遍没有把它排掉。\n\n现在看作者为什么写完伤害人，还接着写编辑不提问、不指示。第4段说：\n\n> she never inquired how the stories arrived\n>\n> The core of her successful defence was that she knew nothing.\n\n她不过问报道来源，却以不知道来辩护。第5段接着把这个问题放大：\n\n> well-paid executives should not be accountable for what happens in the organisations that they run\n\n拿着高薪的高管，不对自己管理的机构负责。作者接着才写到末段：\n\n> The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity.\n>\n> she asked no questions, gave no instructions\n\n末段先说编辑把哪些要求放下了，结尾再说她没有怎样履行职责。除了关怀人，还包括是否公平、是否追问新闻来历、是否对记者的行为作出指示。\n\n若只用C，能够解释报道不应毁掉人的生活，却还没有说明作者为什么反复写编辑不问、不管、不担责。B说编辑需要道德意识，就能把这些做法连上：不只关心报纸能增加多少发行量，还得判断获得新闻的方式和报道造成的后果。\n\n**把前面的不问责和末段的不询问连起来，作者最终在追问的只是报道有人情味吗？**\n\n不只是。作者在追问编辑是否带着道德要求履行职责。C的关怀有依据，但B更完整地接上了段首的办报目的和段尾的编辑行为。\n\n> **40题选B。**","articleRects":[[274,1774,1123,38],[202,1822,1184,38],[407,1843,11,15],[202,1870,1195,38],[202,1918,1194,38],[203,1966,1181,38],[274,1150,1125,38],[203,1198,1193,38],[202,1246,1194,38],[202,1294,1195,38],[202,1342,1194,38],[202,1390,208,38],[274,1438,1122,38],[202,1486,1194,38],[203,1534,1193,38],[202,1582,1194,38],[203,1630,1190,38],[203,1678,1194,38],[202,1726,1025,38]],"questionRects":[[225,1712,915,38],[281,1775,767,38],[280,1839,759,38],[280,1902,745,38],[280,
