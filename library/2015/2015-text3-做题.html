<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**It can be learned from Paragraph 1 that ______.**\n\n> 从第一段可以得知什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>31题题干</h2>\n<p><strong>It can be learned from Paragraph 1 that ______.</strong></p>\n<blockquote>\n<p>从第一段可以得知什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**The phrase “flagged up” (Para. 2) is the **[xxx]** in meaning to ______.**\n\n> 第二段短语“flagged up”的意思最接近哪一个词？\n\n题型：**词义题**。\n\n---","html":"<h2>32题题干</h2>\n<p><strong>The phrase “flagged up” (Para. 2) is the **[xxx]</strong> in meaning to ______.**</p>\n<blockquote>\n<p>第二段短语“flagged up”的意思最接近哪一个词？</p>\n</blockquote>\n<p>题型：<strong>词义题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,409,1040,37],[183,467,126,29],[184,524,142,29],[184,581,146,28],[183,638,130,28]],"meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**Giovanni Parmigiani believes that the establishment of the SBoRE may ______.**\n\n> 乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？\n\n题型：**具体细节题**。\n\n---","html":"<h2>33题题干</h2>\n<p><strong>Giovanni Parmigiani believes that the establishment of the SBoRE may ______.</strong></p>\n<blockquote>\n<p>乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**David Vaux holds that what Science is doing now ______.**\n\n> 戴维·沃克斯认为，《科学》现在的做法怎么样？\n\n题型：**人物观点细节题**。\n\n---","html":"<h2>34题题干</h2>\n<p><strong>David Vaux holds that what Science is doing now ______.</strong></p>\n<blockquote>\n<p>戴维·沃克斯认为，《科学》现在的做法怎么样？</p>\n</blockquote>\n<p>题型：<strong>人物观点细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,1148,852,35],[183,1204,450,29],[183,1261,480,29],[184,1318,507,35],[183,1374,503,29]],"meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**Which of the following is the best title of the text?**\n\n> 下面哪一个是本文最佳标题？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>35题题干</h2>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<blockquote>\n<p>下面哪一个是本文最佳标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,1488,751,35],[183,1545,705,35],[183,1601,694,35],[183,1658,713,35],[183,1714,644,36]],"meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | after, but, then |\n| 态度词 / 评价词 | 先抓个大概好坏 | widespread, welcome, weak |\n| 动作词 | 先看谁做了什么 | adding, review, identify |\n| 结果词 | 看最后出了什么事 | impact, merit, weakness |\n| 重复主题词 | 大概知道老在说什么 | statistical review, journals, SBoRE, Science |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>after, but, then</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>widespread, welcome, weak</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>adding, review, identify</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>impact, merit, weakness</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>statistical review, journals, SBoRE, Science</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"The journal Science is adding an **[xxx]** round of **[xxx]** checks to its **[xxx]** process, editor-in-chief Marcia McNutt announced today. The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the **[xxx]** of many published research findings.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>The journal Science is adding an <span class=\"mask\">[xxx]</span> round of <span class=\"mask\">[xxx]</span> checks to its <span class=\"mask\">[xxx]</span> process, editor-in-chief Marcia McNutt announced today. The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the <span class=\"mask\">[xxx]</span> of many published research findings.</p>\n\n</div></div>","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[],"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"The journal Science / is adding an **[xxx]** round of **[xxx]** checks / to its **[xxx]** process, / editor-in-chief Marcia McNutt announced today. / The policy follows similar efforts / from other journals, / after widespread concern / that basic mistakes in data analysis are contributing / to the **[xxx]** of many published research findings.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus 到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住《科学》新增检查、统计委员会、外部统计学家、行业支持和最后的弱点；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，  的 **[xxx]** 检查 / 用于它的 **[xxx]** 流程 / 主编玛西娅·麦克纳特今天宣布 / 这项政策跟随类似做法 / 来自其他期刊 / 在广泛担忧之后 / 数据分析中的基本错误正在促成 / 许多已发表研究结果的 **[xxx]**\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>31题</h2>\n<blockquote>\n<p>It can be learned from Paragraph 1 that ______.<br />\n从第一段可以得知什么？</p>\n</blockquote>\n<p>题干明确指定Paragraph 1。第一段同时写《科学》的新做法、其他期刊的类似行动和变化原因，所以完整读第一段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The journal Science is adding an <span class=\"mask\">[xxx]</span> round of <span class=\"mask\">[xxx]</span> checks to its <span class=\"mask\">[xxx]</span> process, editor-in-chief Marcia McNutt announced today. The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the <span class=\"mask\">[xxx]</span> of many published research findings.</p>\n<p>开始精读：</p>\n<p>The journal Science / is adding an <span class=\"mask\">[xxx]</span> round of <span class=\"mask\">[xxx]</span> checks / to its <span class=\"mask\">[xxx]</span> process, / editor-in-chief Marcia McNutt announced today. / The policy follows similar efforts / from other journals, / after widespread concern / that basic mistakes in data analysis are contributing / to the <span class=\"mask\">[xxx]</span> of many published research findings.</p>\n<p>顺着英文顺序读：</p>\n<p>《科学》期刊 / 正在增加一轮 <span class=\"mask\">[xxx]</span> 的 <span class=\"mask\">[xxx]</span> 检查 / 用于它的 <span class=\"mask\">[xxx]</span> 流程 / 主编玛西娅·麦克纳特今天宣布 / 这项政策跟随类似做法 / 来自其他期刊 / 在广泛担忧之后 / 数据分析中的基本错误正在促成 / 许多已发表研究结果的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"question","qid":"31"}},{"section":"31题","raw":"### A. Science intends to simplify its peer-review process\n\n> 《科学》打算简化同行评审流程\n\n把A接回题干，它说的是：《科学》打算简化同行评审流程。\n\nA里的“simplify its peer-review process”和原文“round of”都在写同行评审流程的变化，因为一个说简化，一个显示又增加一轮检查，所以回看第一段第一句。\n\n> The journal Science is adding an **[xxx]** round of **[xxx]** checks to its **[xxx]** process, editor-in-chief Marcia McNutt announced today.\n\n原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。增加检查层与简化方向相反。\n\n“adding ... round”的句法很清楚：原有同行评审流程上又叠加一层检查。即使不知道两个修饰词，“adding”“round”和“checks”已经共同表明流程更严、更复杂。“simplify”则要求减少步骤、降低程序负担或缩短流程，文章没有这种方向。\n\n**在同行评审中再增加一轮检查，能不能说成简化同行评审流程？**\n\n不能。即使具体检查类型被遮住，adding和round of仍表明步骤增加而不是减少。\n\n第一段还说这项政策是在广泛担忧之后采取，并跟随其他期刊的类似行动，这也说明目的在补强质量把关，而不是把评审做得更简单。A的核心动作与段首直接相反。\n\n**第一轮判断：A排除。**","html":"<h3>A. Science intends to simplify its peer-review process</h3>\n<blockquote>\n<p>《科学》打算简化同行评审流程</p>\n</blockquote>\n<p>把A接回题干，它说的是：《科学》打算简化同行评审流程。</p>\n<p>A里的“simplify its peer-review process”和原文“round of”都在写同行评审流程的变化，因为一个说简化，一个显示又增加一轮检查，所以回看第一段第一句。</p>\n<blockquote>\n<p>The journal Science is adding an <span class=\"mask\">[xxx]</span> round of <span class=\"mask\">[xxx]</span> checks to its <span class=\"mask\">[xxx]</span> process, editor-in-chief Marcia McNutt announced today.</p>\n</blockquote>\n<p>原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。增加检查层与简化方向相反。</p>\n<p>“adding ... round”的句法很清楚：原有同行评审流程上又叠加一层检查。即使不知道两个修饰词，“adding”“round”和“checks”已经共同表明流程更严、更复杂。“simplify”则要求减少步骤、降低程序负担或缩短流程，文章没有这种方向。</p>\n<p><strong>在同行评审中再增加一轮检查，能不能说成简化同行评审流程？</strong></p>\n<p>不能。即使具体检查类型被遮住，adding和round of仍表明步骤增加而不是减少。</p>\n<p>第一段还说这项政策是在广泛担忧之后采取，并跟随其他期刊的类似行动，这也说明目的在补强质量把关，而不是把评审做得更简单。A的核心动作与段首直接相反。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“simplify its peer-review process”和原文“round of”都在写同行评审流程的变化，因为一个说简化，一个显示又增加一轮检查，所以回看第一段第一句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"round of","visibleOptionAnchor":"simplify its peer-review process"}}}},{"section":"31题","raw":"### B. journals are **[xxx]** their statistical checks\n\n> 期刊正在 **[xxx]** 统计检查\n\n把B接回题干，它说的是：期刊正在加强自己的统计检查。\n\nB里的“their statistical checks”和原文“similar efforts from other journals”都把做法扩展到多个期刊，因为一个概括期刊检查加强，一个说明其他期刊也有类似行动，所以回看第一段第二句。\n\n> The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the **[xxx]** of many published research findings.\n\n原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。动作词被遮住，但对象和方向可接上。\n\n这句话先写《科学》新增检查，接着写“similar efforts from other journals”，把行动从一家期刊扩展到多家期刊。B的主语“journals”用复数，恰好涵盖《科学》和其他期刊；宾语“their statistical checks”也与段内的数据分析错误相连。\n\n**《科学》跟随其他期刊的类似行动，能不能说明期刊群体正在提高统计检查力度？**\n\n能。B覆盖了Science与other journals共同推进检查这一层，遮挡处不会改变“期刊—统计检查”的核心关系。\n\n中间动作词未读清时，仍可以看它可能连接的方向：前文是adding，后文是similar efforts，二者都指向增加或加强把关，不可能变成取消统计检查。因此B至少不与段内推进冲突，并得到多处支持。\n\n**第一轮判断：B保留。**","html":"<h3>B. journals are <span class=\"mask\">[xxx]</span> their statistical checks</h3>\n<blockquote>\n<p>期刊正在 <span class=\"mask\">[xxx]</span> 统计检查</p>\n</blockquote>\n<p>把B接回题干，它说的是：期刊正在加强自己的统计检查。</p>\n<p>B里的“their statistical checks”和原文“similar efforts from other journals”都把做法扩展到多个期刊，因为一个概括期刊检查加强，一个说明其他期刊也有类似行动，所以回看第一段第二句。</p>\n<blockquote>\n<p>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the <span class=\"mask\">[xxx]</span> of many published research findings.</p>\n</blockquote>\n<p>原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。动作词被遮住，但对象和方向可接上。</p>\n<p>这句话先写《科学》新增检查，接着写“similar efforts from other journals”，把行动从一家期刊扩展到多家期刊。B的主语“journals”用复数，恰好涵盖《科学》和其他期刊；宾语“their statistical checks”也与段内的数据分析错误相连。</p>\n<p><strong>《科学》跟随其他期刊的类似行动，能不能说明期刊群体正在提高统计检查力度？</strong></p>\n<p>能。B覆盖了Science与other journals共同推进检查这一层，遮挡处不会改变“期刊—统计检查”的核心关系。</p>\n<p>中间动作词未读清时，仍可以看它可能连接的方向：前文是adding，后文是similar efforts，二者都指向增加或加强把关，不可能变成取消统计检查。因此B至少不与段内推进冲突，并得到多处支持。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"option","qid":"31","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“their statistical checks”和原文“similar efforts from other journals”都把做法扩展到多个期刊，因为一个概括期刊检查加强，一个说明其他期刊也有类似行动，所以回看第一段第二句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"similar efforts from other journals","visibleOptionAnchor":"their statistical checks"}}}},{"section":"31题","raw":"### C. few journals are blamed for mistakes in data analysis\n\n> 少数期刊因数据分析错误而受到指责\n\n把C接回题干，它说的是：少数期刊因数据分析错误受到指责。\n\nC里的“few journals are blamed”和原文“similar efforts from other journals”都牵涉其他期刊，因为一个判断被指责的数量，一个只说明有类似行动，所以回看第一段第二句。\n\n> The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the **[xxx]** of many published research findings.\n\n原文“similar efforts from other journals”说明其他期刊也采取行动，并写到对数据分析错误的广泛担忧；C的“few journals are blamed”则判断只有少数期刊受到指责。原文没有直接交代被指责期刊的数量，因此这一轮还不能仅凭第一段排死。\n\n需要分清“widespread concern”的范围。它说明对数据分析错误及其后果的担忧很广，并不等于“很多期刊受到指责”；担忧可能指向研究人员、论文质量或整个出版系统。“other journals”也只说明其他期刊采取了行动，没有给出被blamed的主体和数量。\n\n**有广泛担忧并出现其他期刊的类似行动，是否已经明确否定“只有少数期刊被指责”？**\n\n还不能。广泛担忧的对象可以是研究结果和分析错误，不必等同于明确点名很多期刊；C暂时缺乏支持，但也没有与原句形成直接矛盾。\n\n因此C的“few”既没有被证实，也没有被一个明确的“many journals were blamed”否定。第一轮只能说它把“广泛担忧”重新写成“少数期刊被责备”，这条关系很弱，但仅凭当前句子还不足以形成必然冲突。\n\n**第一轮判断：C保留。**","html":"<h3>C. few journals are blamed for mistakes in data analysis</h3>\n<blockquote>\n<p>少数期刊因数据分析错误而受到指责</p>\n</blockquote>\n<p>把C接回题干，它说的是：少数期刊因数据分析错误受到指责。</p>\n<p>C里的“few journals are blamed”和原文“similar efforts from other journals”都牵涉其他期刊，因为一个判断被指责的数量，一个只说明有类似行动，所以回看第一段第二句。</p>\n<blockquote>\n<p>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the <span class=\"mask\">[xxx]</span> of many published research findings.</p>\n</blockquote>\n<p>原文“similar efforts from other journals”说明其他期刊也采取行动，并写到对数据分析错误的广泛担忧；C的“few journals are blamed”则判断只有少数期刊受到指责。原文没有直接交代被指责期刊的数量，因此这一轮还不能仅凭第一段排死。</p>\n<p>需要分清“widespread concern”的范围。它说明对数据分析错误及其后果的担忧很广，并不等于“很多期刊受到指责”；担忧可能指向研究人员、论文质量或整个出版系统。“other journals”也只说明其他期刊采取了行动，没有给出被blamed的主体和数量。</p>\n<p><strong>有广泛担忧并出现其他期刊的类似行动，是否已经明确否定“只有少数期刊被指责”？</strong></p>\n<p>还不能。广泛担忧的对象可以是研究结果和分析错误，不必等同于明确点名很多期刊；C暂时缺乏支持，但也没有与原句形成直接矛盾。</p>\n<p>因此C的“few”既没有被证实，也没有被一个明确的“many journals were blamed”否定。第一轮只能说它把“广泛担忧”重新写成“少数期刊被责备”，这条关系很弱，但仅凭当前句子还不足以形成必然冲突。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"option","qid":"31","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“few journals are blamed”和原文“similar efforts from other journals”都牵涉其他期刊，因为一个判断被指责的数量，一个只说明有类似行动，所以回看第一段第二句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"similar efforts from other journals","visibleOptionAnchor":"few journals are blamed"}}}},{"section":"31题","raw":"### D. lack of data analysis is common in research projects\n\n> 研究项目普遍缺少数据分析\n\n把D接回题干，它说的是：研究项目普遍缺少数据分析。\n\nD里的“lack of data analysis”和原文“basic mistakes in data analysis”都谈数据分析问题，因为一个说完全缺少，一个说分析中存在基本错误，所以回看第一段第二句。\n\n> The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the **[xxx]** of many published research findings.\n\n原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。存在错误与完全缺少不是同一状态，且原文对象是已发表研究结果，不是一般研究项目。\n\n“mistakes in data analysis”的前提是数据分析已经存在，只是做得不够正确；“lack of data analysis”则是根本没有进行分析。两者不是普通程度差异，而是“做了但错”与“没有做”的状态差异。\n\n**数据分析里有基本错误，能不能改写成研究项目缺少数据分析？**\n\n不能。D把分析质量问题改成分析是否存在的问题，并扩大了对象范围。\n\nD还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\n\n**第一轮判断：D排除。**","html":"<h3>D. lack of data analysis is common in research projects</h3>\n<blockquote>\n<p>研究项目普遍缺少数据分析</p>\n</blockquote>\n<p>把D接回题干，它说的是：研究项目普遍缺少数据分析。</p>\n<p>D里的“lack of data analysis”和原文“basic mistakes in data analysis”都谈数据分析问题，因为一个说完全缺少，一个说分析中存在基本错误，所以回看第一段第二句。</p>\n<blockquote>\n<p>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the <span class=\"mask\">[xxx]</span> of many published research findings.</p>\n</blockquote>\n<p>原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。存在错误与完全缺少不是同一状态，且原文对象是已发表研究结果，不是一般研究项目。</p>\n<p>“mistakes in data analysis”的前提是数据分析已经存在，只是做得不够正确；“lack of data analysis”则是根本没有进行分析。两者不是普通程度差异，而是“做了但错”与“没有做”的状态差异。</p>\n<p><strong>数据分析里有基本错误，能不能改写成研究项目缺少数据分析？</strong></p>\n<p>不能。D把分析质量问题改成分析是否存在的问题，并扩大了对象范围。</p>\n<p>D还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"option","qid":"31","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“lack of data analysis”和原文“basic mistakes in data analysis”都谈数据分析问题，因为一个说完全缺少，一个说分析中存在基本错误，所以回看第一段第二句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"basic mistakes in data analysis","visibleOptionAnchor":"lack of data analysis"}}}},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n这一轮留下B和C。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。","html":"<h3>31题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下B和C。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36]],"questionRects":[[133,71,709,35],[183,127,733,36],[183,184,701,35],[184,241,767,35],[183,297,757,36]],"meta":{"kind":"result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> The phrase “flagged up” (Para. 2) is the **[xxx]** in meaning to ______.  \n> 第二段短语“flagged up”的意思最接近哪一个词？\n\n题干明确给出Para. 2。词义不能只看一个词，要把它所在句和前后流程一起读，所以完整读第二段。\n\n> 原文参考：\n>\n> “Readers must have **[xxx]** in the conclusions published in our journal,” writes McNutt in an editorial. Working with the American Statistical Association, the journal has **[xxx]** seven experts to a statistics board of reviewing editors (SBoRE). Manuscript will be flagged up for additional **[xxx]** by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers. The SBoRE panel will then find **[xxx]** statisticians to review these manuscripts.\n>\n> 开始精读：\n>\n> “Readers must have **[xxx]** / in the conclusions published in our journal,” / writes McNutt in an editorial. / Working with the American Statistical Association, / the journal has **[xxx]** seven experts / to a statistics board of reviewing editors (SBoRE). / Manuscript will be flagged up / for additional **[xxx]** by the journal’s internal editors, / or by its existing Board of Reviewing Editors / or by outside peer reviewers. / The SBoRE panel will then find **[xxx]** statisticians / to review these manuscripts.\n>\n> 顺着英文顺序读：\n>\n> “读者必须对结论有 **[xxx]** / 这些结论发表在我们的期刊上” / 麦克纳特在社论中写道 / 通过与美国统计协会合作 / 期刊已经 **[xxx]** 七位专家 / 进入评审编辑统计委员会 / 稿件将被标记出来 / 由期刊内部编辑进行额外 **[xxx]** / 或者由现有评审编辑委员会处理 / 或者由外部同行评审者处理 / 随后该委员会将找到 **[xxx]** 统计学家 / 来评审这些稿件\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>32题</h2>\n<blockquote>\n<p>The phrase “flagged up” (Para. 2) is the <span class=\"mask\">[xxx]</span> in meaning to ______.<br />\n第二段短语“flagged up”的意思最接近哪一个词？</p>\n</blockquote>\n<p>题干明确给出Para. 2。词义不能只看一个词，要把它所在句和前后流程一起读，所以完整读第二段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“Readers must have <span class=\"mask\">[xxx]</span> in the conclusions published in our journal,” writes McNutt in an editorial. Working with the American Statistical Association, the journal has <span class=\"mask\">[xxx]</span> seven experts to a statistics board of reviewing editors (SBoRE). Manuscript will be flagged up for additional <span class=\"mask\">[xxx]</span> by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers. The SBoRE panel will then find <span class=\"mask\">[xxx]</span> statisticians to review these manuscripts.</p>\n<p>开始精读：</p>\n<p>“Readers must have <span class=\"mask\">[xxx]</span> / in the conclusions published in our journal,” / writes McNutt in an editorial. / Working with the American Statistical Association, / the journal has <span class=\"mask\">[xxx]</span> seven experts / to a statistics board of reviewing editors (SBoRE). / Manuscript will be flagged up / for additional <span class=\"mask\">[xxx]</span> by the journal’s internal editors, / or by its existing Board of Reviewing Editors / or by outside peer reviewers. / The SBoRE panel will then find <span class=\"mask\">[xxx]</span> statisticians / to review these manuscripts.</p>\n<p>顺着英文顺序读：</p>\n<p>“读者必须对结论有 <span class=\"mask\">[xxx]</span> / 这些结论发表在我们的期刊上” / 麦克纳特在社论中写道 / 通过与美国统计协会合作 / 期刊已经 <span class=\"mask\">[xxx]</span> 七位专家 / 进入评审编辑统计委员会 / 稿件将被标记出来 / 由期刊内部编辑进行额外 <span class=\"mask\">[xxx]</span> / 或者由现有评审编辑委员会处理 / 或者由外部同行评审者处理 / 随后该委员会将找到 <span class=\"mask\">[xxx]</span> 统计学家 / 来评审这些稿件</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[179,364,1035,37],[111,404,1105,43],[111,450,1107,35],[114,491,1104,36],[111,534,1108,35],[111,576,1108,35],[111,619,170,35]],"questionRects":[[133,409,1040,37],[183,467,126,29],[184,524,142,29],[184,581,146,28],[183,638,130,28]],"meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. found\n\n> 被发现\n\n把A接回题干，它说的是：flagged up在这里表示被发现。\n\nA里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\n\n> Manuscript will be flagged up for additional **[xxx]** by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\n\n原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\n\n“flagged up for additional...”中的“for”说明标记之后还有明确用途，也就是进入额外审查。稿件早已在编辑和评审者手中，不存在先“找到”它才处理的情形。“found”只表示从未知到被发现，不能带出筛选与后续行动。\n\n**编辑把稿件挑出来送去额外审查，是否只是在说稿件被发现？**\n\n不是。稿件本来已经提交，关键动作是作出标记，而不是第一次发现它。\n\n若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\n\n**第一轮判断：A排除。**","html":"<h3>A. found</h3>\n<blockquote>\n<p>被发现</p>\n</blockquote>\n<p>把A接回题干，它说的是：flagged up在这里表示被发现。</p>\n<p>A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。</p>\n<blockquote>\n<p>Manuscript will be flagged up for additional <span class=\"mask\">[xxx]</span> by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.</p>\n</blockquote>\n<p>原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。</p>\n<p>“flagged up for additional...”中的“for”说明标记之后还有明确用途，也就是进入额外审查。稿件早已在编辑和评审者手中，不存在先“找到”它才处理的情形。“found”只表示从未知到被发现，不能带出筛选与后续行动。</p>\n<p><strong>编辑把稿件挑出来送去额外审查，是否只是在说稿件被发现？</strong></p>\n<p>不是。稿件本来已经提交，关键动作是作出标记，而不是第一次发现它。</p>\n<p>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[179,364,1035,37],[111,404,1105,43],[111,450,1107,35],[114,491,1104,36],[111,534,1108,35],[111,576,1108,35],[111,619,170,35]],"questionRects":[[133,409,1040,37],[183,467,126,29],[184,524,142,29],[184,581,146,28],[183,638,130,28]],"meta":{"kind":"option","qid":"32","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"flagged up","visibleOptionAnchor":"found"}}}},{"section":"32题","raw":"### B. revised\n\n> 被修改\n\n把B接回题干，它说的是：flagged up在这里表示被修改。\n\nB里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\n\n> Manuscript will be flagged up for additional **[xxx]** by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\n\n原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\n\n“revised”通常意味着文字、数据或结构已经被改写；原句中执行动作的人是编辑或评审者，他们只是把稿件列为需要更多检查的对象。实际修改即使后来可能发生，也不是“flagged up”此刻完成的动作。\n\n**把稿件列入额外审查，能不能等同于已经修改了稿件？**\n\n不能。标出是进入审查的前一步，修改则是对内容进行改动。\n\n从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\n\n**第一轮判断：B排除。**","html":"<h3>B. revised</h3>\n<blockquote>\n<p>被修改</p>\n</blockquote>\n<p>把B接回题干，它说的是：flagged up在这里表示被修改。</p>\n<p>B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。</p>\n<blockquote>\n<p>Manuscript will be flagged up for additional <span class=\"mask\">[xxx]</span> by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.</p>\n</blockquote>\n<p>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。</p>\n<p>“revised”通常意味着文字、数据或结构已经被改写；原句中执行动作的人是编辑或评审者，他们只是把稿件列为需要更多检查的对象。实际修改即使后来可能发生，也不是“flagged up”此刻完成的动作。</p>\n<p><strong>把稿件列入额外审查，能不能等同于已经修改了稿件？</strong></p>\n<p>不能。标出是进入审查的前一步，修改则是对内容进行改动。</p>\n<p>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[179,364,1035,37],[111,404,1105,43],[111,450,1107,35],[114,491,1104,36],[111,534,1108,35],[111,576,1108,35],[111,619,170,35]],"questionRects":[[133,409,1040,37],[183,467,126,29],[184,524,142,29],[184,581,146,28],[183,638,130,28]],"meta":{"kind":"option","qid":"32","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"flagged up","visibleOptionAnchor":"revised"}}}},{"section":"32题","raw":"### C. marked\n\n> 被标记\n\n把C接回题干，它说的是：flagged up在这里表示被标记。\n\nC里的“marked”和原文“flagged up”都表示给稿件作出醒目标识，因为这种标识使稿件进入额外审查，所以回看第二段第三句。\n\n> Manuscript will be flagged up for additional **[xxx]** by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\n\n原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。动作、对象和流程位置相同。\n\nflag本身就有“做标记、竖旗提醒”的核心意思，“up”在这里让这种标记更醒目。放到句子里，稿件被标出来后由内部编辑、评审委员会或外部同行进一步查看，“marked”能完整保留这个功能。\n\n**把稿件标出来以便后续审查，能不能用marked概括？**\n\n能。marked保留了flagged up的核心动作，没有提前写成修改或储存。\n\nC既没有提前写成修改，也没有弱化成单纯发现；它只概括当前一步的处理，所以与上下文最顺。\n\n**第一轮判断：C保留。**","html":"<h3>C. marked</h3>\n<blockquote>\n<p>被标记</p>\n</blockquote>\n<p>把C接回题干，它说的是：flagged up在这里表示被标记。</p>\n<p>C里的“marked”和原文“flagged up”都表示给稿件作出醒目标识，因为这种标识使稿件进入额外审查，所以回看第二段第三句。</p>\n<blockquote>\n<p>Manuscript will be flagged up for additional <span class=\"mask\">[xxx]</span> by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.</p>\n</blockquote>\n<p>原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。动作、对象和流程位置相同。</p>\n<p>flag本身就有“做标记、竖旗提醒”的核心意思，“up”在这里让这种标记更醒目。放到句子里，稿件被标出来后由内部编辑、评审委员会或外部同行进一步查看，“marked”能完整保留这个功能。</p>\n<p><strong>把稿件标出来以便后续审查，能不能用marked概括？</strong></p>\n<p>能。marked保留了flagged up的核心动作，没有提前写成修改或储存。</p>\n<p>C既没有提前写成修改，也没有弱化成单纯发现；它只概括当前一步的处理，所以与上下文最顺。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[179,364,1035,37],[111,404,1105,43],[111,450,1107,35],[114,491,1104,36],[111,534,1108,35],[111,576,1108,35],[111,619,170,35]],"questionRects":[[133,409,1040,37],[183,467,126,29],[184,524,142,29],[184,581,146,28],[183,638,130,28]],"meta":{"kind":"option","qid":"32","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“marked”和原文“flagged up”都表示给稿件作出醒目标识，因为这种标识使稿件进入额外审查，所以回看第二段第三句。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"flagged up","visibleOptionAnchor":"marked"}}}},{"section":"32题","raw":"### D. stored\n\n> 被存储\n\n把D接回题干，它说的是：flagged up在这里表示被存储。\n\nD里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\n\n> Manuscript will be flagged up for additional **[xxx]** by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\n\n原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\n\n“stored”关注的是保存位置或保管状态，通常不会决定某份稿件是否接受额外审查。原句列出三类可能处理它的人，重点在谁对被标出的稿件进行进一步检查，而不是谁把文件存入系统。\n\n**为了额外审查而标出稿件，能不能理解成把稿件存储起来？**\n\n不能。存储不说明稿件被挑中，也不说明后续审查。\n\n把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\n\n**第一轮判断：D排除。**","html":"<h3>D. stored</h3>\n<blockquote>\n<p>被存储</p>\n</blockquote>\n<p>把D接回题干，它说的是：flagged up在这里表示被存储。</p>\n<p>D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。</p>\n<blockquote>\n<p>Manuscript will be flagged up for additional <span class=\"mask\">[xxx]</span> by the journal’s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.</p>\n</blockquote>\n<p>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。</p>\n<p>“stored”关注的是保存位置或保管状态，通常不会决定某份稿件是否接受额外审查。原句列出三类可能处理它的人，重点在谁对被标出的稿件进行进一步检查，而不是谁把文件存入系统。</p>\n<p><strong>为了额外审查而标出稿件，能不能理解成把稿件存储起来？</strong></p>\n<p>不能。存储不说明稿件被挑中，也不说明后续审查。</p>\n<p>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[179,364,1035,37],[111,404,1105,43],[111,450,1107,35],[114,491,1104,36],[111,534,1108,35],[111,576,1108,35],[111,61 s he expects the board to “play primarily an **[xxx]** role.” He agreed to join because he “found the **[xxx]** behind the establishment of the SBoRE to be novel, unique and likely to have a **[xxx]** impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.”\n>\n> 开始精读：\n>\n> Giovanni Parmigiani, / a **[xxx]** at the Harvard School of Public Health, / a member of the SBoRE group, / says he expects the board / to “play primarily an **[xxx]** role.” / He agreed to join / because he “found the **[xxx]** / behind the establishment of the SBoRE / to be novel, unique / and likely to have a **[xxx]** impact. / This impact will not only be through the publications in Science itself, / but hopefully through a larger group of publishing places / that may want to model their approach after Science.”\n>\n> 顺着英文顺序读：\n>\n> 乔瓦尼·帕尔米贾尼 / 哈佛公共卫生学院的一位 **[xxx]** / 也是该委员会成员 / 他说自己预计这个委员会 / 主要发挥 **[xxx]** 作用 / 他同意加入 / 因为他发现委员会建立背后的 **[xxx]** / 关于委员会的建立 / 既新颖又独特 / 而且很可能产生 **[xxx]** 影响 / 这种影响不会只通过《科学》本身的出版物出现 / 还希望通过更大范围的出版机构出现 / 这些机构可能想仿照《科学》的做法\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>33题</h2>\n<blockquote>\n<p>Giovanni Parmigiani believes that the establishment of the SBoRE may ______.<br />\n乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？</p>\n</blockquote>\n<p>题干给出Giovanni Parmigiani这个专名。第四段从他的身份写到他对委员会影响的判断，所以完整读第四段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Giovanni Parmigiani, a <span class=\"mask\">[xxx]</span> at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to “play primarily an <span class=\"mask\">[xxx]</span> role.” He agreed to join because he “found the <span class=\"mask\">[xxx]</span> behind the establishment of the SBoRE to be novel, unique and likely to have a <span class=\"mask\">[xxx]</span> impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.”</p>\n<p>开始精读：</p>\n<p>Giovanni Parmigiani, / a <span class=\"mask\">[xxx]</span> at the Harvard School of Public Health, / a member of the SBoRE group, / says he expects the board / to “play primarily an <span class=\"mask\">[xxx]</span> role.” / He agreed to join / because he “found the <span class=\"mask\">[xxx]</span> / behind the establishment of the SBoRE / to be novel, unique / and likely to have a <span class=\"mask\">[xxx]</span> impact. / This impact will not only be through the publications in Science itself, / but hopefully through a larger group of publishing places / that may want to model their approach after Science.”</p>\n<p>顺着英文顺序读：</p>\n<p>乔瓦尼·帕尔米贾尼 / 哈佛公共卫生学院的一位 <span class=\"mask\">[xxx]</span> / 也是该委员会成员 / 他说自己预计这个委员会 / 主要发挥 <span class=\"mask\">[xxx]</span> 作用 / 他同意加入 / 因为他发现委员会建立背后的 <span class=\"mask\">[xxx]</span> / 关于委员会的建立 / 既新颖又独特 / 而且很可能产生 <span class=\"mask\">[xxx]</span> 影响 / 这种影响不会只通过《科学》本身的出版物出现 / 还希望通过更大范围的出版机构出现 / 这些机构可能想仿照《科学》的做法</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[178,829,1040,35],[111,870,1108,37],[110,912,1109,37],[111,956,1108,35],[111,998,1107,35],[111,1040,1108,35],[111,1081,505,36]],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"question","qid":"33"}},{"section":"33题","raw":"### A. pose a threat to all its peers\n\n> 对所有同行构成威胁\n\n把A接回题干，它说的是：委员会可能对所有同行构成威胁。\n\nA里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\n\n> This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\n\n原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。回应方向相反。\n\n帕尔米贾尼预期影响会超出《科学》本身，扩散到可能模仿其做法的更多出版机构。这种影响是一个可供采用的范例。A的“pose a threat”则要求其他期刊感到利益、地位或生存受损，段中没有任何对抗或损害。\n\n**其他期刊可能主动仿照《科学》，是否说明委员会会威胁所有同行？**\n\n不能。原文期待扩散和模仿，不是同行受到威胁。\n\n而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。方向和范围都不合。\n\n**第一轮判断：A排除。**","html":"<h3>A. pose a threat to all its peers</h3>\n<blockquote>\n<p>对所有同行构成威胁</p>\n</blockquote>\n<p>把A接回题干，它说的是：委员会可能对所有同行构成威胁。</p>\n<p>A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。</p>\n<blockquote>\n<p>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.</p>\n</blockquote>\n<p>原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。回应方向相反。</p>\n<p>帕尔米贾尼预期影响会超出《科学》本身，扩散到可能模仿其做法的更多出版机构。这种影响是一个可供采用的范例。A的“pose a threat”则要求其他期刊感到利益、地位或生存受损，段中没有任何对抗或损害。</p>\n<p><strong>其他期刊可能主动仿照《科学》，是否说明委员会会威胁所有同行？</strong></p>\n<p>不能。原文期待扩散和模仿，不是同行受到威胁。</p>\n<p>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。方向和范围都不合。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[178,829,1040,35],[111,870,1108,37],[110,912,1109,37],[111,956,1108,35],[111,998,1107,35],[111,1040,1108,35],[111,1081,505,36]],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"option","qid":"33","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"may want to model their approach after Science","visibleOptionAnchor":"pose a threat"}}}},{"section":"33题","raw":"### B. meet with strong opposition\n\n> 遭到强烈反对\n\n把B接回题干，它说的是：委员会可能遭到强烈反对。\n\nB里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\n\n> He agreed to join because he “found the **[xxx]** behind the establishment of the SBoRE to be novel, unique and likely to have a **[xxx]** impact.”\n\n原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\n\n第四段直接写他“agreed to join”，并把成立委员会背后的想法评价为新颖、独特且可能有持久影响。一个人因为认可而加入，至少说明他本人不是强烈反对者；段中也没有列出其他反对力量。\n\n**他因为看好这个做法而加入，能不能支持“会遭到强烈反对”？**\n\n不能。可见态度是认可并参与，不是强烈反对。\n\nB要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\n\n**第一轮判断：B排除。**","html":"<h3>B. meet with strong opposition</h3>\n<blockquote>\n<p>遭到强烈反对</p>\n</blockquote>\n<p>把B接回题干，它说的是：委员会可能遭到强烈反对。</p>\n<p>B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。</p>\n<blockquote>\n<p>He agreed to join because he “found the <span class=\"mask\">[xxx]</span> behind the establishment of the SBoRE to be novel, unique and likely to have a <span class=\"mask\">[xxx]</span> impact.”</p>\n</blockquote>\n<p>原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。</p>\n<p>第四段直接写他“agreed to join”，并把成立委员会背后的想法评价为新颖、独特且可能有持久影响。一个人因为认可而加入，至少说明他本人不是强烈反对者；段中也没有列出其他反对力量。</p>\n<p><strong>他因为看好这个做法而加入，能不能支持“会遭到强烈反对”？</strong></p>\n<p>不能。可见态度是认可并参与，不是强烈反对。</p>\n<p>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[178,829,1040,35],[111,870,1108,37],[110,912,1109,37],[111,956,1108,35],[111,998,1107,35],[111,1040,1108,35],[111,1081,505,36]],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"option","qid":"33","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"agreed to join","visibleOptionAnchor":"meet with strong opposition"}}}},{"section":"33题","raw":"### C. increase Science’s circulation\n\n> 提高《科学》的发行量\n\n把C接回题干，它说的是：委员会可能提高《科学》的发行量。\n\nC里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。\n\n> This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\n\n原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。影响渠道和商业数量不是一回事。\n\n“publications in Science itself”只是说明影响首先会通过《科学》刊发的研究体现，“publishing places”也指其他出版场所。这里谈的是审查做法的影响路径，不是杂志卖出多少份、拥有多少读者或发行规模。\n\n**政策影响通过《科学》的论文体现，是否等于《科学》的发行量会增加？**\n\n不等于。原文没有谈订阅、销量或发行量。\n\ncirculation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。\n\n**第一轮判断：C排除。**","html":"<h3>C. increase Science’s circulation</h3>\n<blockquote>\n<p>提高《科学》的发行量</p>\n</blockquote>\n<p>把C接回题干，它说的是：委员会可能提高《科学》的发行量。</p>\n<p>C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。</p>\n<blockquote>\n<p>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.</p>\n</blockquote>\n<p>原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。影响渠道和商业数量不是一回事。</p>\n<p>“publications in Science itself”只是说明影响首先会通过《科学》刊发的研究体现，“publishing places”也指其他出版场所。这里谈的是审查做法的影响路径，不是杂志卖出多少份、拥有多少读者或发行规模。</p>\n<p><strong>政策影响通过《科学》的论文体现，是否等于《科学》的发行量会增加？</strong></p>\n<p>不等于。原文没有谈订阅、销量或发行量。</p>\n<p>circulation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[178,829,1040,35],[111,870,1108,37],[110,912,1109,37],[111,956,1108,35],[111,998,1107,35],[111,1040,1108,35],[111,1081,505,36]],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"option","qid":"33","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"publications in Science itself","visibleOptionAnchor":"increase Science’s circulation"}}}},{"section":"33题","raw":"### D. set an **[xxx]** for other journals\n\n> 为其他期刊树立一个 **[xxx]**\n\n把D接回题干，它说的是：委员会可能为其他期刊树立一种可供仿照的做法。\n\nD里的“other journals”和原文“may want to model their approach after Science”都指向其他出版机构的模仿，因为一个概括树立范例，一个直接写可能照着做，所以回看第四段最后一句。\n\n> This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\n\n原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。被遮挡的名词不影响模仿关系已经成立。\n\n“model their approach after Science”几乎把关系写明：其他出版机构以《科学》的做法为模板。D中间的名词虽不清楚，但“set an ... for other journals”仍然保留“先有一个做法—别人照着做”的结构。\n\n**其他出版机构可能模仿《科学》的做法，能不能概括为对其他期刊产生示范作用？**\n\n能。D保留了“《科学》先做—其他期刊照着做”的方向，正好对应原文。\n\n帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。\n\n**第一轮判断：D保留。**","html":"<h3>D. set an <span class=\"mask\">[xxx]</span> for other journals</h3>\n<blockquote>\n<p>为其他期刊树立一个 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：委员会可能为其他期刊树立一种可供仿照的做法。</p>\n<p>D里的“other journals”和原文“may want to model their approach after Science”都指向其他出版机构的模仿，因为一个概括树立范例，一个直接写可能照着做，所以回看第四段最后一句。</p>\n<blockquote>\n<p>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.</p>\n</blockquote>\n<p>原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。被遮挡的名词不影响模仿关系已经成立。</p>\n<p>“model their approach after Science”几乎把关系写明：其他出版机构以《科学》的做法为模板。D中间的名词虽不清楚，但“set an ... for other journals”仍然保留“先有一个做法—别人照着做”的结构。</p>\n<p><strong>其他出版机构可能模仿《科学》的做法，能不能概括为对其他期刊产生示范作用？</strong></p>\n<p>能。D保留了“《科学》先做—其他期刊照着做”的方向，正好对应原文。</p>\n<p>帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[178,829,1040,35],[111,870,1108,37],[110,912,1109,37],[111,956,1108,35],[111,998,1107,35],[111,1040,1108,35],[111,1081,505,36]],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"option","qid":"33","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“other journals”和原文“may want to model their approach after Science”都指向其他出版机构的模仿，因为一个概括树立范例，一个直接写可能照着做，所以回看第四段最后一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"may want to model their approach after Science","visibleOptionAnchor":"other journals"}}}},{"section":"33题","raw":"### 33题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **33题选D。**","html":"<h3>33题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>33题选D。</strong></p>\n</blockquote>\n","articleRects":[[178,829,1040,35],[111,870,1108,37],[110,912,1109,37],[111,956,1108,35],[111,998,1107,35],[111,1040,1108,35],[111,1081,505,36]],"questionRects":[[133,751,1107,35],[184,860,426,44],[183,921,424,35],[184,977,442,29],[183,1034,496,36]],"meta":{"kind":"result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> David Vaux holds that what Science is doing now ______.  \n> 戴维·沃克斯认为，《科学》现在的做法怎么样？\n\n题干给出David Vaux。最后一段先写他的总体看法，再具体评价《科学》的方案，因此完整读第六段。\n\n> 原文参考：\n>\n> Professional scientists are expected to know how to analyze data, but statistical errors are **[xxx]** common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, “engaging reviewers who are statistically **[xxx]** and editors who can verify the process.” Vaux says that Science’s idea to pass some papers to statisticians “has some merit, but a weakness is that it relies on the board of reviewing editors to identify ‘the papers that need scrutiny’ in the first place.”\n>\n> 开始精读：\n>\n> Professional scientists are expected / to know how to analyze data, / but statistical errors are **[xxx]** common / in published research, / according to David Vaux, a cell biologist. / Researchers should improve their standards, / he wrote in 2012, / but journals should also take a tougher line, / “engaging reviewers who are statistically **[xxx]** / and editors who can verify the process.” / Vaux says that Science’s idea / to pass some papers to statisticians / “has some merit, / but a weakness is that it relies on the board of reviewing editors / to identify ‘the papers that need scrutiny’ / in the first place.”\n>\n> 顺着英文顺序读：\n>\n> 职业科学家理应 / 知道怎样分析数据 / 但是统计错误 **[xxx]** 常见 / 在已发表研究中 / 细胞生物学家戴维·沃克斯这样说 / 研究人员应该提高标准 / 他在二〇一二年写道 / 但是期刊也应采取更强硬立场 / 聘用懂统计的 **[xxx]** 评审者 / 以及能够核验流程的编辑 / 沃克斯说《科学》的想法 / 把一些论文交给统计学家 / 有一些优点 / 但弱点是它依赖评审编辑委员会 / 先找出那些需要审查的论文 / 从一开始\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>34题</h2>\n<blockquote>\n<p>David Vaux holds that what Science is doing now ______.<br />\n戴维·沃克斯认为，《科学》现在的做法怎么样？</p>\n</blockquote>\n<p>题干给出David Vaux。最后一段先写他的总体看法，再具体评价《科学》的方案，因此完整读第六段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Professional scientists are expected to know how to analyze data, but statistical errors are <span class=\"mask\">[xxx]</span> common in published research,  should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\n\n> Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line.\n\n原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\n\n沃克斯先要求研究人员提高标准，又要求期刊采取更强硬做法，这是责任分配：作者和期刊都需要改进。它不等于他抱怨新方案增加研究人员工作量；提高标准可能需要更多努力，但原文没有把负担本身作为评价对象。\n\n**要求研究人员提高标准，是否等于沃克斯评价《科学》的方案增加了他们的工作量？**\n\n不能。A把规范要求改成了工作负担判断，也没有对到他随后对方案优缺点的评价。\n\n题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\n\n**第一轮判断：A排除。**","html":"<h3>A. adds to researchers’ workload</h3>\n<blockquote>\n<p>增加研究人员的工作量</p>\n</blockquote>\n<p>把A接回题干，它说的是：《科学》的做法增加研究人员的工作量。</p>\n<p>A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。</p>\n<blockquote>\n<p>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line.</p>\n</blockquote>\n<p>原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。</p>\n<p>沃克斯先要求研究人员提高标准，又要求期刊采取更强硬做法，这是责任分配：作者和期刊都需要改进。它不等于他抱怨新方案增加研究人员工作量；提高标准可能需要更多努力，但原文没有把负担本身作为评价对象。</p>\n<p><strong>要求研究人员提高标准，是否等于沃克斯评价《科学》的方案增加了他们的工作量？</strong></p>\n<p>不能。A把规范要求改成了工作负担判断，也没有对到他随后对方案优缺点的评价。</p>\n<p>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[177,1419,1041,36],[111,1462,1108,35],[111,1504,1108,35],[108,1544,1111,37],[111,1587,1109,36],[111,1629,1108,36],[111,1671,1108,36],[111,1713,171,37]],"questionRects":[[133,1148,852,35],[183,1204,450,29],[183,1261,480,29],[184,1318,507,35],[183,1374,503,29]],"meta":{"kind":"option","qid":"34","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Researchers should improve their standards","visibleOptionAnchor":"adds to researchers’ workload"}}}},{"section":"34题","raw":"### B. diminishes the role of reviewers\n\n> 削弱评审者的作用\n\n把B接回题干，它说的是：《科学》的做法削弱了评审者的作用。\n\nB里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\n\n> Journals should also take a tougher line, “engaging reviewers who are statistically **[xxx]** and editors who can verify the process.”\n\n原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。动作方向相反。\n\n“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。\n\n**要求更多地使用合格评审者，能不能写成削弱评审者的作用？**\n\n不能。原文是在强化评审质量，而不是减少评审作用。\n\n后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\n\n**第一轮判断：B排除。**","html":"<h3>B. diminishes the role of reviewers</h3>\n<blockquote>\n<p>削弱评审者的作用</p>\n</blockquote>\n<p>把B接回题干，它说的是：《科学》的做法削弱了评审者的作用。</p>\n<p>B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。</p>\n<blockquote>\n<p>Journals should also take a tougher line, “engaging reviewers who are statistically <span class=\"mask\">[xxx]</span> and editors who can verify the process.”</p>\n</blockquote>\n<p>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。动作方向相反。</p>\n<p>“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。</p>\n<p><strong>要求更多地使用合格评审者，能不能写成削弱评审者的作用？</strong></p>\n<p>不能。原文是在强化评审质量，而不是减少评审作用。</p>\n<p>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[177,1419,1041,36],[111,1462,1108,35],[111,1504,1108,35],[108,1544,1111,37],[111,1587,1109,36],[111,1629,1108,36],[111,1671,1108,36],[111,1713,171,37]],"questionRects":[[133,1148,852,35],[183,1204,450,29],[183,1261,480,29],[184,1318,507,35],[183,1374,503,29]],"meta":{"kind":"option","qid":"34","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"engaging reviewers","visibleOptionAnchor":"diminishes the role of reviewers"}}}},{"section":"34题","raw":"### C. has room for further **[xxx]**\n\n> 仍有进一步 **[xxx]** 的空间\n\n把C接回题干，它说的是：《科学》的做法还有继续改进的空间。\n\nC里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\n\n> Vaux says that Science’s idea to pass some papers to statisticians “has some merit, but a weakness is that it relies on the board of reviewing editors to identify ‘the papers that need scrutiny’ in the first place.”\n\n原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。遮挡处不改变“仍有空间”的方向。\n\n“has some merit”给方案保留了明确价值，“but a weakness”又指出第一轮筛选依赖现有评审委员会。这样的评价既不是全盘肯定，也不是否定，而是认为方向可行、机制还需要补足。“has room for further...”恰好能容纳这种两面判断。\n\n**一个方案有优点但仍存在明确弱点，能不能判断它还需要进一步完善？**\n\n能。C同时容纳了merit和weakness，没有把方案说成毫无价值或注定失败。\n\n具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\n\n**第一轮判断：C保留。**","html":"<h3>C. has room for further <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>仍有进一步 <span class=\"mask\">[xxx]</span> 的空间</p>\n</blockquote>\n<p>把C接回题干，它说的是：《科学》的做法还有继续改进的空间。</p>\n<p>C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。</p>\n<blockquote>\n<p>Vaux says that Science’s idea to pass some papers to statisticians “has some merit, but a weakness is that it relies on the board of reviewing editors to identify ‘the papers that need scrutiny’ in the first place.”</p>\n</blockquote>\n<p>原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。遮挡处不改变“仍有空间”的方向。</p>\n<p>“has some merit”给方案保留了明确价值，“but a weakness”又指出第一轮筛选依赖现有评审委员会。这样的评价既不是全盘肯定，也不是否定，而是认为方向可行、机制还需要补足。“has room for further...”恰好能容纳这种两面判断。</p>\n<p><strong>一个方案有优点但仍存在明确弱点，能不能判断它还需要进一步完善？</strong></p>\n<p>能。C同时容纳了merit和weakness，没有把方案说成毫无价值或注定失败。</p>\n<p>具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[177,1419,1041,36],[111,1462,1108,35],[111,1504,1108,35],[108,1544,1111,37],[111,1587,1109,36],[111,1629,1108,36],[111,1671,1108,36],[111,1713,171,37]],"questionRects":[[133,1148,852,35],[183,1204,450,29],[183,1261,480,29],[184,1318,507,35],[183,1374,503,29]],"meta":{"kind":"option","qid":"34","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"has some merit, but a weakness","visibleOptionAnchor":"has room for further"}}}},{"section":"34题","raw":"### D. is to fail in the foreseeable future\n\n> 在可预见的将来必然失败\n\n把D接回题干，它说的是：《科学》的做法在可预见的将来注定失败。\n\nD里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\n\n> Vaux says that Science’s idea to pass some papers to statisticians “has some merit, but a weakness is that it relies on the board of reviewing editors to identify ‘the papers that need scrutiny’ in the first place.”\n\n原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。评价强度被放大。\n\n“fail in the foreseeable future”包含两个很强的判断：结局是失败，并且发生在可预见时间内。沃克斯只指出一个机制弱点，同时明确承认“some merit”，没有预测最终失败，也没有给出时间。\n\n**指出筛选环节有一个弱点，是否足以断定方案在可预见未来必然失败？**\n\n不能。一个可改进的弱点不等于注定失败，原文还明确承认方案有价值。\n\n一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\n\n**第一轮判断：D排除。**","html":"<h3>D. is to fail in the foreseeable future</h3>\n<blockquote>\n<p>在可预见的将来必然失败</p>\n</blockquote>\n<p>把D接回题干，它说的是：《科学》的做法在可预见的将来注定失败。</p>\n<p>D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。</p>\n<blockquote>\n<p>Vaux says that Science’s idea to pass some papers to statisticians “has some merit, but a weakness is that it relies on the board of reviewing editors to identify ‘the papers that need scrutiny’ in the first place.”</p>\n</blockquote>\n<p>原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。评价强度被放大。</p>\n<p>“fail in the foreseeable future”包含两个很强的判断：结局是失败，并且发生在可预见时间内。沃克斯只指出一个机制弱点，同时明确承认“some merit”，没有预测最终失败，也没有给出时间。</p>\n<p><strong>指出筛选环节有一个弱点，是否足以断定方案在可预见未来必然失败？</strong></p>\n<p>不能。一个可改进的弱点不等于注定失败，原文还明确承认方案有价值。</p>\n<p>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[177,1419,1041,36],[111,1462,1108,35],[111,1504,1108,35],[108,1544,1111,37],[111,1587,1109,36],[111,1629,1108,36],[111,1671,1108,36],[111,1713,171,37]],"questionRects":[[133,1148,852,35],[183,1204,450,29],[183,1261,480,29],[184,1318,507,35],[183,1374,503,29]],"meta":{"kind":"option","qid":"34","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","time"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"has some merit, but a weakness","visibleOptionAnchor":"fail in the foreseeable future"}}}},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **34题选C。**","html":"<h3>34题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>34题选C。</strong></p>\n</blockquote>\n","articleRects":[[177,1419,1041,36],[111,1462,1108,35],[111,1504,1108,35],[108,1544,1111,37],[111,1587,1109,36],[111,1629,1108,36],[111,1671,1108,36],[111,1713,171,37]],"questionRects":[[133,1148,852,35],[183,1204,450,29],[183,1261,480,29],[184,1318,507,35],[183,1374,503,29]],"meta":{"kind":"result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n**Which of the following is the best title of the text?**\n\n下面哪一个是本文最佳标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Science Joins Push to Screen Statistics in Papers**\n\n《科学》加入论文统计审查行动\n\nB. **Professional Statisticians Deserve More Respect**\n\n专业统计学家应得到更多尊重\n\nC. **Data Analysis Finds Its Way onto Editors’ Desks**\n\n数据分析走上编辑办公桌\n\nD. **Statisticians Are Coming Back with Science**\n\n统计学家随《科学》重返舞台","html":"<h2>35题</h2>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<p>下面哪一个是本文最佳标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Science Joins Push to Screen Statistics in Papers</strong></p>\n<p>《科学》加入论文统计审查行动</p>\n<p>B. <strong>Professional Statisticians Deserve More Respect</strong></p>\n<p>专业统计学家应得到更多尊重</p>\n<p>C. <strong>Data Analysis Finds Its Way onto Editors’ Desks</strong></p>\n<p>数据分析走上编辑办公桌</p>\n<p>D. <strong>Statisticians Are Coming Back with Science</strong></p>\n<p>统计学家随《科学》重返舞台</p>\n","articleRects":[],"questionRects":[[133,1488,751,35],[183,1545,705,35],[183,1601,694,35],[183,1658,713,35],[183,1714,644,36]],"meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现 | 先说一方开始采取一种新做法 |\n| 2 | 具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程 | 再把这套做法怎样运行铺开 |\n| 3 | 麦克纳特说明变化来自对科研统计与数据分析的普遍担忧，目标是提高可复现性 | 接着解释为什么要这样改变 |\n| 4 | 帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》 | 然后写有人预计它会扩散出去 |\n| 5 | 约阿尼迪斯欢迎这一迟来的进展，指出多数期刊统计评审薄弱，但部分医学期刊已很重视 | 再补一个背景并加入外部支持 |\n| 6 | 沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点 | 最后说做法有用但还留下缺口 |\n\n先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现</td>\n  <td>先说一方开始采取一种新做法</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程</td>\n  <td>再把这套做法怎样运行铺开</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>麦克纳特说明变化来自对科研统计与数据分析的普遍担忧，目标是提高可复现性</td>\n  <td>接着解释为什么要这样改变</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》</td>\n  <td>然后写有人预计它会扩散出去</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>约阿尼迪斯欢迎这一迟来的进展，指出多数期刊统计评审薄弱，但部分医学期刊已很重视</td>\n  <td>再补一个背景并加入外部支持</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点</td>\n  <td>最后说做法有用但还留下缺口</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[177,154,1041,36],[111,197,1107,35],[111,239,1107,35],[111,281,1109,35],[112,323,901,36],[179,364,1035,37],[111,404,
