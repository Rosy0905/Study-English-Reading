const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A defence built on a manager’s claimed ignorance</strong></p><p><strong>B. The unanswered moral problem behind a criminal trial</strong></p><p><strong>C. The values pushed aside by the pursuit of profit</strong></p><p><strong>D. A warning about institutions without moral purpose</strong></p><p><strong>E. The complete disappearance of newspaper readership</strong></p><p><strong>F. Editorial duties lost in the pursuit of circulation</strong></p><p><strong>G. A proven improvement in journalistic accountability</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Two years ago, Rupert Murdoch&#x27;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;. Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market. But &quot;it&#x27;s us, human beings, we the people who create the society we want, not profit.&quot; Driving her point home, she continued: &quot;It&#x27;s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.&quot; This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands. Journalists are known to have hacked the phones of up to 5,500 people. This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking. Others await trial. This long story still unfolds.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>In today&#x27;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>When profit becomes the only measure of institutional success, integrity can lose its place in decision-making. Elisabeth Murdoch warned that institutions were accepting just such a sorting mechanism. Her criticism was not simply that businesses sometimes lose money, but that society was allowing the market to replace moral judgment.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Those judgments have favoured efficiency, sales, shareholder value and circulation. Justice, fairness and accountability have received much less attention. The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>That hierarchy shaped the newspaper’s editorial purpose. Rather than helping readers understand events or treating people fairly, it pursued circulation and impact even at the cost of damaging lives. In this setting, the editor’s failure to ask questions became part of the moral problem rather than an adequate response to it.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge. Yet those different verdicts did not settle the wider problem. Thousands of phones had been hacked, and further defendants still awaited trial, leaving the scale of the wrongdoing beyond dispute.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The unresolved problem was visible not only in the hacking itself but also in the defence presented at trial. Rebekah Brooks relied on the claim that she knew nothing about how stories reached her newsroom. The striking feature was how little she had asked despite holding a position of responsibility.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose. A newspaper may then mistake commercial success for a sufficient defence of its conduct. The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Such a position normally carries an obligation to know what an organisation is doing. Nevertheless, highly paid executives have increasingly escaped responsibility for events within the institutions they run. This pattern calls for an examination of the values by which their performance has been judged.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>The moral problem therefore survives any single verdict about criminal guilt. Editing a newspaper requires judgment about how stories are obtained and what harm they may cause. A successful defence in court cannot by itself demonstrate that these responsibilities have been fulfilled.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>integrity</td>\n<td>n.正直；诚信</td>\n<td>unsettling</td>\n<td>adj.令人不安的</td>\n<td>dearth</td>\n<td>n.缺乏</td>\n</tr>\n<tr>\n<td>institutions</td>\n<td>n.机构</td>\n<td>collapse</td>\n<td>v.崩塌</td>\n<td>collective</td>\n<td>adj.集体的</td>\n</tr>\n<tr>\n<td>sorting mechanism</td>\n<td>筛选机制</td>\n<td>profit</td>\n<td>n.利润</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>drive ... home</td>\n<td>使……被充分理解</td>\n<td>apparent</td>\n<td>adj.明显的</td>\n<td>absence</td>\n<td>n.缺失</td>\n</tr>\n<tr>\n<td>moral purpose</td>\n<td>道德目标</td>\n<td>capitalism</td>\n<td>n.资本主义</td>\n<td>freedom</td>\n<td>n.自由</td>\n</tr>\n<tr>\n<td>lose its way</td>\n<td>迷失方向</td>\n<td>widespread</td>\n<td>adj.广泛的</td>\n<td>illegal</td>\n<td>adj.非法的</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th .人性</td>\n<td>ruin</td>\n<td>v.毁坏</td>\n</tr>\n<tr>\n<td>in the quest for</td>\n<td>为了追求</td>\n<td>suspicions</td>\n<td>n.怀疑</td>\n<td>traceable</td>\n<td>adj.可追查的</td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;. Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market. But &quot;it&#39;s us, human beings, we the people who create the society we want, not profit.&quot;</p>\n<h3>意群划分 · 第1段</h3>\n<p>Two years ago, / Rupert Murdoch&#39;s daughter, / Elisabeth, / spoke of / the &quot;unsettling dearth of integrity / across so many of our institutions&quot;.</p>\n<p>Integrity had collapsed, / she argued, / because of a collective acceptance / that the only &quot;sorting mechanism&quot; / in society / should be profit and the market.</p>\n<p>But &quot;it&#39;s us, / human beings, / we the people / who create / the society we want, / not profit.&quot;</p>\n<h3>意群翻译 · 第1段</h3>\n<p>两年前，/ 鲁珀特·默多克的女儿，/ 伊丽莎白，/ 谈到了 / &quot;令人不安的诚信缺失 / 在我们如此多的机构中&quot;。</p>\n<p>诚信已经崩溃，/ 她争论道，/ 因为集体接受了 / 唯一的&quot;分类机制&quot; / 在社会中 / 应该是利润和市场。</p>\n<p>但&quot;是我们，/ 人类，/ 我们人民 / 创造 / 我们想要的社会，/ 而不是利润。&quot;</p>\n<h3>标准译文 · 第1段</h3>\n<p>两年前，鲁珀特·默多克的女儿伊丽莎白谈到了&quot;我们如此多机构中令人不安的诚信缺失&quot;。她认为，诚信之所以崩溃，是因为人们集体接受了社会唯一的&quot;分类机制&quot;应该是利润和市场。但她强调：&quot;是我们——人类，我们人民——创造我们想要的社会，而不是利润。&quot;</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Driving her point home, she continued: &quot;It&#39;s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.&quot; This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Driving her point home, / she continued: / &quot;It&#39;s increasingly apparent / that the absence of purpose, / of a moral language / within government, media or business / could become / one of the most dangerous goals / for capitalism and freedom.&quot;</p>\n<p>This same absence of moral purpose / was wounding companies / such as News International, / she thought, / making it more likely / that it would lose its way / as it had / with widespread illegal telephone hacking.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>强调她的观点，/ 她继续说：/ &quot;越来越明显的是 / 目的的缺失，/ 道德语言的缺失 / 在政府、媒体或商业中 / 可能成为 / 最危险的目标之一 / 对资本主义和自由来说。&quot;</p>\n<p>这同样的道德目的缺失 / 正在伤害公司 / 比如新闻国际，/ 她认为，/ 使其更可能 / 迷失方向 / 正如它已经 / 通过广泛的非法电话窃听。</p>\n<h3>标准译文 · 第2段</h3>\n<p>为了强调她的观点，她继续说：&quot;越来越明显的是，在政府、媒体或商业中缺乏目的和道德语言，可能成为资本主义和自由面临的最危险目标之一。&quot;她认为，同样的道德目的缺失正在伤害像新闻国际这样的公司，使其更可能迷失方向，就像它在广泛的非法电话窃听事件中所表现的那样。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands. Journalists are known to have hacked the phones of up to 5,500 people. This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking. Others await trial. This long story still unfolds.</p>\n<h3>意群划分 · 第3段</h3>\n<p>As the hacking trial concludes – / finding guilty / one ex-editor of the News of the World, / Andy Coulson, / for conspiring to hack phones, / and finding his predecessor, / Rebekah Brooks, / innocent of the same charge – / the wider issue / of dearth of integrity / still stands.</p>\n<p>Journalists are known / to have hacked the phones / of up to 5,500 people.</p>\n<p>This is hacking / on an industrial scale, / as was acknowledged / by Glenn Mulcaire, / the man hired / by the News of the World / in 2001 / to be the point person / for phone hacking.</p>\n<p>Others await trial.</p>\n<p>This long story / still unfolds.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>当窃听审判结束时 – / 判定有罪 / 《世界新闻报》的一位前编辑，/ 安迪·库尔森，/ 因为合谋窃听电话，/ 并判定他的前任，/ 丽贝卡·布鲁克斯，/ 对同样指控无罪 – / 更广泛的问题 / 诚信缺失的 / 仍然存在。</p>\n<p>记者们已知 / 窃听了电话 / 多达5500人的。</p>\n<p>这是窃听 / 在工业规模上，/ 正如被承认的 / 格伦·马尔凯尔，/ 这个人被雇用 / 由《世界新闻报》 / 在2001年 / 成为关键人物 / 对于电话窃听。</p>\n<p>其他人等待审判。</p>\n<p>这个漫长的故事 / 仍在展开。</p>\n<h3>标准译文 · 第3段</h3>\n<p>随着窃听审判的结束——《世界新闻报》前编辑安迪·库尔森因合谋窃听电话被判有罪，而他的前任丽贝卡·布鲁克斯被判同样指控无罪——诚信缺失这一更广泛的问题仍然存在。据知，记者们窃听了多达5500人的电话。正如格伦·马尔凯尔所承认的，这是工业规模的窃听，他是2001年被《世界新闻报》雇用来负责电话窃听的关键人物。其他人还在等待审判。这个漫长的故事仍在继续。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<h3>意群划分 · 第4段</h3>\n<p>In many respects, / the dearth of moral purpose / frames not only / the fact of such widespread phone hacking / but the terms / on which the trial took place.</p>\n<p>One of the astonishing revelations / was how little / Rebekah Brooks knew / of what went on / in her newsroom, / how little she thought to ask / and the fact / that she never inquired / how the stories arrived.</p>\n<p>The core / of her successful defence / was that she knew nothing.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>在许多方面，/ 道德目的的缺失 / 不仅框定了 / 如此广泛的电话窃听的事实 / 而且框定了条款 / 审判进行的基础。</p>\n<p>令人惊讶的揭露之一 / 是多么少 / 丽贝卡·布鲁克斯知道 / 关于发生的事 / 在她的新闻编辑室，/ 她多么少想到要问 / 以及事实 / 她从未询问 / 故事是如何来的。</p>\n<p>核心 / 她成功辩护的 / 是她什么都不知道。</p>\n<h3>标准译文 · 第4段</h3>\n<p>在许多方面，道德目的的缺失不仅框定了如此广泛的电话窃听事实，也框定了审判进行的条件。令人惊讶的揭露之一是，丽贝卡·布鲁克斯对她新闻编辑室里发生的事知之甚少，她很少想到要问，而且她从未询问过故事是如何来的。她成功辩护的核心是她什么都不知道。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n<h3>意群划分 · 第5段</h3>\n<p>In today&#39;s world, / it has become normal / that well-paid executives / should not be accountable / for what happens / in the organisations / that they run.</p>\n<p>Perhaps we should not be so surprised.</p>\n<p>For a generation, / the collective doctrine / has been / that the sorting mechanism / of society / should be profit.</p>\n<p>The words that have mattered / are efficiency, flexibility, / shareholder value, business-friendly, / wealth generation, sales, impact / and, in newspapers, circulation.</p>\n<p>Words degraded to the margin / have been justice, fairness, / tolerance, proportionality / and accountability.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>在今天的世界，/ 已经变得正常 / 高薪管理人员 / 不应该负责 / 对于发生的事 / 在组织中 / 他们管理的。</p>\n<p>也许我们不应该如此惊讶。</p>\n<p>一代人以来，/ 集体教条 / 一直是 / 分类机制 / 社会的 / 应该是利润。</p>\n<p>重要的词汇 / 是效率、灵活性，/ 股东价值、商业友好，/ 财富创造、销售、影响力 / 以及，在报纸中，发行量。</p>\n<p>被边缘化的词汇 / 一直是正义、公平，/ 宽容、适度 / 和问责。</p>\n<h3>标准译文 · 第5段</h3>\n<p>在今天的世界，高薪管理人员不对他们管理的组织中发生的事负责已经变得正常。也许我们不应该如此惊讶。一代人以来，集体教条一直是社会的分类机制应该是利润。重要的词汇是效率、灵活性、股东价值、商业友好、财富创造、销售、影响力，以及在报纸中的发行量。被边缘化的词汇则是正义、公平、宽容、适度和问责。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<h3>意群划分 · 第6段</h3>\n<p>The purpose / of editing the News of the World / was not to promote / reader understanding, / to be fair / in what was written / or to betray / any common humanity.</p>\n<p>It was to ruin lives / in the quest / for circulation and impact.</p>\n<p>Ms Brooks may or may not / have had suspicions / about how her journalists / got their stories, / but she asked no questions, / gave no instructions – / nor received / traceable, recorded answers.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>目的 / 编辑《世界新闻报》的 / 不是为了促进 / 读者理解，/ 公平 / 在所写的内容中 / 或表现 / 任何共同的人性。</p>\n<p>而是毁掉生活 / 在追求中 / 发行量和影响力的。</p>\n<p>布鲁克斯女士可能或可能没有 / 有过怀疑 / 关于她的记者如何 / 获得他们的故事，/ 但她没有问问题，/ 没有给指示 – / 也没有收到 / 可追踪的、记录的答案。</p>\n<h3>标准译文 · 第6段</h3>\n<p>编辑《世界新闻报》的目的不是为了促进读者理解、在报道中保持公平或表现任何共同的人性。而是为了追求发行量和影响力而毁掉他人的生活。布鲁克斯女士可能对她的记者如何获得故事有所怀疑，也可能没有，但她没有问任何问题，没有给任何指示——也没有收到任何可追踪的、有记录的答案。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Two years ago → Rupert Murdoch&#39;s daughter：(Elisabeth) → spoke of → the &quot;unsettling dearth of integrity：(across so many of our institutions)&quot;.</p>\n<p>Integrity had collapsed → she argued → because of a collective acceptance：(that the only &quot;sorting mechanism&quot;：(in society) → should be profit and the market).</p>\n<p>But &quot;it&#39;s us：(human beings) + we the people → who create → the society we want // not profit.&quot;</p>\n<p><strong>第2段</strong></p>\n<p>Driving her point home → she continued：&quot;It&#39;s increasingly apparent：(that the absence of purpose + of a moral language：(within government, media or business) → could become → one of the most dangerous goals：(for capitalism and freedom)).&quot;</p>\n<p>This same absence of moral purpose → was wounding companies：(such as News International) → she thought → making it more likely：(that it would lose its way：(as it had：(with widespread illegal telephone hacking))).</p>\n<p><strong>第3段</strong></p>\n<p>As the hacking trial concludes – (finding guilty → one ex-editor of the News of the World：(Andy Coulson)：(for conspiring to hack phones) + finding his predecessor：(Rebekah Brooks) → innocent of the same charge) – the wider issue：(of dearth of integrity) → still stands.</p>\n<p>Journalists are known → to have hacked the phones：(of up to 5,500 people).</p>\n<p>This is hacking：(on an industrial scale) → as was acknowledged：(by Glenn Mulcaire：(the man hired：(by the News of the World)：(in 2001)：(to be the point person：(for phone hacking)))).</p>\n<p>Others await trial.</p>\n<p>This long story → still unfolds.</p>\n<p><strong>第4段</strong></p>\n<p>In many respects → the dearth of moral purpose → frames not only：(the fact of such widespread phone hacking) + but：(the terms：(on which the trial took place)).</p>\n<p>One of the astonishing revelations → was how little：(Rebekah Brooks knew：(of what went on：(in her newsroom))) + how little she thought to ask + the fact：(that she never inquired：(how the stories arrived)).</p>\n<p>The core：(of her successful defence) → was that she knew nothing.</p>\n<p><strong>第5段</strong></p>\n<p>In today&#39;s world → it has become normal：(that well-paid executives → should not be accountable：(for what happens：(in the organisations：(that they run)))).</p>\n<p>Perhaps we should not be so surprised.</p>\n<p>For a generation → the collective doctrine → has been：(that the sorting mechanism：(of society) → should be profit).</p>\n<p>The words that have mattered → are efficiency + flexibility + shareholder value + business-friendly + wealth generation + sales + impact + (in newspapers) circulation.</p>\n<p>Words degraded to the margin → have been justice + fairness + tolerance + proportionality + accountability.</p>\n<p><strong>第6段</strong></p>\n<p>The purpose：(of editing the News of the World) → was not to promote：(reader understanding) + to be fair：(in what was written) + or to betray：(any common humanity).</p>\n<p>It was to ruin lives：(in the quest：(for circulation and impact)).</p>\n<p>Ms Brooks may or may not → have had suspicions：(about how her journalists → got their stories) // but she asked no questions + gave no instructions – + nor received：(traceable, recorded answers).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>两年前 → 鲁珀特·默多克的女儿：(伊丽莎白) → 谈到了 → &quot;令人不安的诚信缺失：(在我们如此多的机构中)&quot;。</p>\n<p>诚信已经崩溃 → 她争论道 → 因为集体接受了：(唯一的&quot;分类机制&quot;：(在社会中) → 应该是利润和市场)。</p>\n<p>但&quot;是我们：(人类) + 我们人民 → 创造 → 我们想要的社会 // 而不是利润。&quot;</p>\n<p><strong>第2段</strong></p>\n<p>强调她的观点 → 她继续说：&quot;越来越明显的是：(目的的缺失 + 道德语言的缺失：(在政府、媒体或商业中) → 可能成为 → 最危险的目标之一：(对资本主义和自由来说))。&quot;</p>\n<p>这同样的道德目的缺失 → 正在伤害公司：(比如新闻国际) → 她认为 → 使其更可能：(迷失方向：(正如它已经：(通过广泛的非法电话窃听)))。</p>\n<p><strong>第3段</strong></p>\n<p>当窃听审判结束时 – (判定有罪 → 《世界新闻报》的一位前编辑：(安迪·库尔森)：(因为合谋窃听电话) + 判定他的前任：(丽贝卡·布鲁克斯) → 对同样指控无罪) – 更广泛的问题：(诚信缺失的) → 仍然存在。</p>\n<p>记者们已知 → 窃听了电话：(多达5500人的)。</p>\n<p>这是窃听：(在工业规模上) → 正如被承认的：(格伦·马尔凯尔：(这个人被雇用：(由《世界新闻报》)：(在2001年)：(成为关键人物：(对于电话窃听))))。</p>\n<p>其他人等待审判。</p>\n<p>这个漫长的故事 → 仍在展开。</p>\n<p><strong>第4段</strong></p>\n<p>在许多方面 → 道德目的的缺失 → 不仅框定了：(如此广泛的电话窃听的事实) + 而且：(条款：(审判进行的基础))。</p>\n<p>令人惊讶的揭露之一 → 是多么少：(丽贝卡·布鲁克斯知道：(关于发生的事：(在她的新闻编辑室))) + 她多么少想到要问 + 事实：(她从未询问：(故事是如何来的))。</p>\n<p>核心：(她成功辩护的) → 是她什么都不知道。</p>\n<p><strong>第5段</strong></p>\n<p>在今天的世界 → 已经变得正常：(高薪管理人员 → 不应该负责：(对于发生的事：(在组织中：(他们管理的))))。</p>\n<p>也许我们不应该如此惊讶。</p>\n<p>一代人以来 → 集体教条 → 一直是：(分类机制：(社会的) → 应该是利润)。</p>\n<p>重要的词汇 → 是效率 + 灵活性 + 股东价值 + 商业友好 + 财富创造 + 销售 + 影响力 + (在报纸中)发行量。</p>\n<p>被边缘化的词汇 → 一直是正义 + 公平 + 宽容 + 适度 + 问责。</p>\n<p><strong>第6段</strong></p>\n<p>目的：(编辑《世界新闻报》的) → 不是为了促进：(读者理解) + 公平：(在所写的内容中) + 或表现：(任何共同的人性)。</p>\n<p>而是毁掉生活：(在追求中：(发行量和影响力的))。</p>\n<p>布鲁克斯女士可能或可能没有 → 有过怀疑：(关于她的记者如何 → 获得他们的故事) // 但她没有问问题 + 没有给指示 – + 也没有收到：(可追踪的、记录的答案)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Integrity had collapsed, / she argued, / because of a collective acceptance / that the only &quot;sorting mechanism&quot; / in society / should be profit and the market.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>诚信已经崩溃，/ 她争论道，/ 因为集体接受了 / 唯一的&quot;分类机制&quot; / 在社会中 / 应该是利润和市场。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把she argued作插入的观点来源，把because of后的集体认同整体连接到原因。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>诚信已经崩溃， 她争论道， 因为集体接受了  唯一的&quot;分类机制&quot;  在社会中  应该是利润和市场。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>她认为，诚信崩塌源于把利润和市场当作唯一筛选机制。</p>\n</blockquote>\n<p>先标明这是她的看法，再说结果，最后解释社会接受了什么标准。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>她认为，诚信之所以崩溃，是因为人们集体接受了社会唯一的&quot;分类机制&quot;应该是利润和市场。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>only不能省；这是单一利润标准带来的问题，不是反对所有市场活动。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>她认为，诚信之所以崩溃，是因为人们集体接受了社会唯一的&quot;分类机制&quot;应该是利润和市场。</p>\n</blockquote>\n<h2>2. 第3段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>As the hacking trial concludes – / finding guilty / one ex-editor of the News of the World, / Andy Coulson, / for conspiring to hack phones, / and finding his predecessor, / Rebekah Brooks, / innocent of the same charge – / the wider issue / of dearth of integrity / still stands.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>当窃听审判结束时 – / 判定有罪 / 《世界新闻报》的一位前编辑，/ 安迪·库尔森，/ 因为合谋窃听电话，/ 并判定他的前任，/ 丽贝卡·布鲁克斯，/ 对同样指控无罪 – / 更广泛的问题 / 诚信缺失的 / 仍然存在。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>破折号里把两位编辑的不同判决并列；不要让长插入语淹没主句。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>当窃听审判结束时 –  判定有罪  《世界新闻报》的一位前编辑， 安迪·库尔森， 因为合谋窃听电话， 并判定他的前任， 丽贝卡·布鲁克斯， 对同样指控无罪 –  更广泛的问题  诚信缺失的  仍然存在。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>审判结束了，但诚信缺失这一更广的问题仍然存在。</p>\n</blockquote>\n<p>先交代审判及判决，再把主句“更广的问题仍在”放在落点。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>随着窃听审判的结束——《世界新闻报》前编辑安迪·库尔森因合谋窃听电话被判有罪，而他的前任丽贝卡·布鲁克斯被判同样指控无罪——诚信缺失这一更广泛的问题仍然存在。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>guilty与innocent的对象必须分别对应Coulson和Brooks。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>随着窃听审判的结束——《世界新闻报》前编辑安迪·库尔森因合谋窃听电话被判有罪，而他的前任丽贝卡·布鲁克斯被判同样指控无罪——诚信缺失这一更广泛的问题仍然存在。</p>\n</blockquote>\n<h2>3. 第6段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Ms Brooks may or may not / have had suspicions / about how her journalists / got their stories, / but she asked no questions, / gave no instructions – / nor received / traceable, recorded answers.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>布鲁克斯女士可能或可能没有 / 有过怀疑 / 关于她的记者如何 / 获得他们的故事，/ 但她没有问问题，/ 没有给指示 – / 也没有收到 / 可追踪的、记录的答案。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把may or may not单独处理成不确定判断，but后连续否定三种管理动作。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>布鲁克斯女士可能或可能没有  有过怀疑  关于她的记者如何  获得他们的故事， 但她没有问问题， 没有给指示 –  也没有收到  可追踪的、记录的答案。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>她或许有所怀疑，却没有询问也没有发出指示。</p>\n</blockquote>\n<p>先保留是否怀疑的不确定，再说可以确定的实际行为缺位。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>布鲁克斯女士可能对她的记者如何获得故事有所怀疑，也可能没有，但她没有问任何问题，没有给任何指示——也没有收到任何可追踪的、有记录的答案。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>traceable, recorded修饰answers，不能把缺少可追查记录写成确知从未获悉任何信息。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>布鲁克斯女士可能对她的记者如何获得故事有所怀疑，也可能没有，但她没有问任何问题，没有给任何指示——也没有收到任何可追踪的、有记录的答案。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>According to the first two paragraphs, Elisabeth was upset by ______.</p>\n<p>根据前两段，伊丽莎白因什么而感到不安？</p>\n</blockquote>\n<h3>题型</h3>\n<p>原因细节题：将Elisabeth不安的内容与她给出的原因相接，区分道德后果、财务损失和机构治理。</p>\n<p>题干明示the first two paragraphs，并点名Elisabeth，直接读第一、二段。从她说机构缺少正直，读到她指出企业如何迷失方向。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Integrity had collapsed, she argued, because of a collective acceptance that the only “sorting mechanism” in society should be profit and the market.</p>\n<p>This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n<p>the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom</p>\n</blockquote>\n<h3>A. the consequences of the current sorting mechanism</h3>\n<blockquote>\n<p>Elisabeth感到不安的是现行筛选机制造成的后果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>大家接受利润与市场为唯一筛选机制，导致正直崩塌。A的consequences接住她不安的结果，sorting mechanism接住原文明确给出的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;. Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market. But &quot;it&#39;s us, human beings, we the people who create the society we want, not profit.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Elisabeth感到不安的是现行筛选机制造成的后果。</p>\n</blockquote>\n<p><code>the consequences</code>问产生了什么结果，第一段<code>Integrity had collapsed</code>正写了一个结果，<code>because of</code>后面又出现<code>sorting mechanism</code>，因此回看这条因果句。</p>\n<p>原文把<code>Integrity had collapsed</code>，即正直崩塌，归因于大家接受利润和市场应当成为社会唯一的筛选机制。本项<code>the consequences</code>将她不安的内容概括为这套机制的后果。崩塌是后果，利润和市场的筛选原则是被指明的原因，本项保持了原句的连接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;. Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market. But &quot;it&#39;s us, human beings, we the people who create the society we want, not profit.&quot;</p>\n<p>两年前，Elisabeth谈到众多机构中令人不安的诚信缺失。她认为，大家接受利润与市场应成为社会唯一的筛选机制，导致诚信崩塌。但她说，应由我们这些人创造我们想要的社会，而不是由利润来创造。</p>\n</blockquote>\n<p>作者先引用许多机构缺乏正直的警告，再用because of说明原因，最后强调应由人来创造所需社会，而非由利润支配。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Elisabeth was upset by the consequences of the current sorting mechanism.</p>\n<p>Elisabeth感到不安的是现行筛选机制造成的后果。</p>\n</blockquote>\n<p>A并未把担忧说成利润减少，而是指只认利润这一社会机制造成的道德后果；它同时保留原因与结果。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. companies’ financial loss due to immoral practices</h3>\n<blockquote>\n<p>Elisabeth感到不安的是不道德行为造成的企业财务损失。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>wounding companies后面解释的是企业lose its way，并以非法窃听为例。B把道德上迷失改成财务损失，原句没有利润亏损的说明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Elisabeth感到不安的是不道德行为造成的企业财务损失。</p>\n</blockquote>\n<p><code>companies’ financial loss</code>说企业受损，第二段<code>was wounding companies</code>也写企业受到伤害，所以回看这句，尤其要连着读<code>lose its way</code>和非法电话窃听。</p>\n<p>原句中的<code>was wounding companies</code>由道德宗旨缺失引起，后面进一步说企业更容易迷失方向，并用非法电话窃听说明它怎样走偏。本项<code>companies’ financial loss</code>却把受损具体说成钱财损失，把不道德行为说成这种损失的原因。原文的链条是道德宗旨缺失导致企业走偏，本项改成不道德行为导致公司赔钱，改变了她谈论的后果和因果连接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n<p>她认为，同样的道德目的缺失正在伤害News International等公司，使其更容易迷失 。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>dearth是缺乏，misuse是误用。范围虽同样涉及众多机构，但品质缺失不能改成对已有品质的错误使用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Elisabeth感到不安的是机构中对正直的广泛误用。</p>\n</blockquote>\n<p><code>the wide misuse of integrity</code>直接对应第一段<code>dearth of integrity</code>所在位置，二者都谈许多机构中的正直，因此回看首句，比较她明确说的是缺少还是使用不当。</p>\n<p>原文<code>dearth of integrity</code>说许多机构缺乏正直，令人不安的是正直不足。本项<code>the wide misuse of integrity</code>却说这些机构在误用正直，把缺少某种品质改成了以错误方式使用这种品质。<code>across so many of our institutions</code>与<code>wide</code>的范围能够接上，但机构出了什么问题已经被<code>dearth</code>明确限定为缺乏，不能改写成误用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;.</p>\n<p>两年前，Rupert Murdoch的女儿Elisabeth谈到“我们众多机构中令人不安的诚信缺失”。</p>\n</blockquote>\n<p>首句直接把令人不安的对象定为dearth of integrity，下一句的collapsed继续说明这种品质遭到削弱。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Elisabeth was upset by the wide misuse of integrity among institutions.</p>\n<p>Elisabeth感到不安的是机构中对正直的广泛误用。</p>\n</blockquote>\n<p>D需要说明机构怎样误用正直。实际是正直不足甚至崩塌，并未建立使用这种品质的行为。wide不能弥补misuse与dearth的差别。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. A</strong></p>\n</blockquote>\n<ul>\n<li>A：大家接受利润与市场为唯一筛选机制，导致正直崩塌。A的consequences接住她不安的结果，sorting mechanism接住原文明确给出的原因。</li>\n<li>B：wounding companies后面解释的是企业lose its way，并以非法窃听为例。B把道德上迷失改成财务损失，原句没有利润亏损的说明。</li>\n<li>C：within government、media or business列出道德宗旨缺失发生的机构。C改成政府处理道德问题无效，把缺失的位置改成治理能力。</li>\n<li>D：dearth是缺乏，misuse是误用。范围虽同样涉及众多机构，但品质缺失不能改成对已有品质的错误使用。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>It can be inferred from Paragraph 3 that ______.</p>\n<p>根据第三段可以推断出什么？</p>\n</blockquote>\n<h3 k and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Brooks的辩护显露出狡猾性格。</p>\n</blockquote>\n<p><code>a cunning personality</code>把辩护接到性格判断，第四段<code>she knew nothing</code>直接给出辩护内容，所以回看这句和她从不过问报道来历的说明。</p>\n<p>原文说她不了解编辑室里的事，很少想问，也从不过问报道来历，随后说辩护的核心是<code>she knew nothing</code>。原文把她平时不知、不问与辩护时以不知情为理由连起来。</p>\n<p>本项<code>a cunning personality</code>却将辩护解释成狡猾性格的显露，为这些行为增加了性格上的归因。</p>\n<p>不了解、不询问与善于使心计不是同一个判断，辩护成功本身也没有建立这条心理联系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<p>道德目的缺失不仅体现于大规模窃听，也体现于审判展开的条件。令人震惊的是，Brooks对编辑部情况知道得如此少，很少想到询问，从未追问报道如何得来。她成功辩护的核心就是自己毫不知情。</p>\n</blockquote>\n<p>作者连续强调Brooks对自己负责的编辑部所知所问极少，再点出辩护核心是她什么都不知道。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Brooks’s defence revealed a cunning personality.</p>\n<p>作者认为Brooks的辩护显露出狡猾性格。</p>\n</blockquote>\n<p>A需要文本进一步把不问解释成有意设计的狡猾策略。实际批评的是管理职责缺失，不能从辩护成功反推性格。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. centered on trivial issues</h3>\n<blockquote>\n<p>作者认为Brooks的辩护围绕琐碎问题展开。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>辩护围绕是否知道新闻获取方式展开，直接涉及被控行为。B却说它以琐碎事项为中心，改变了争点的性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Brooks的辩护围绕琐碎问题展开。</p>\n</blockquote>\n<p><code>centered on trivial issues</code>说辩护以什么为中心，第四段<code>The core of her successful defence</code>正面写到核心，因此回看这句，并用前面的编辑室事务和报道来历理解“不知道”的内容。</p>\n<p>原文<code>The core of her successful defence</code>将辩护核心定为不知情，前面说明的是她是否了解编辑室里发生的事、是否问过报道怎样得来。这些内容关系到她是否知晓记者取得报道的行为。</p>\n<p>本项<code>centered on trivial issues</code>把辩护的中心改成琐碎问题，把是否知道那些行为这一直接争点说成了枝节。</p>\n<p>原句并非描写她通过讨论无关紧要的细节来辩护。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<p>道德目的缺失不仅体现于大规模窃听，也体现于审判展开的条件。令人震惊的是，Brooks对编辑部情况知道得如此少，很少想到询问，从未追问报道如何得来。她成功辩护的核心就是自己毫不知情。</p>\n</blockquote>\n<p>little knew、little thought to ask、never inquired累积指向同一个核心：负责人对其编辑部行为是否知情。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Brooks’s defence centered on trivial issues.</p>\n<p>作者认为Brooks的辩护围绕琐碎问题展开。</p>\n</blockquote>\n<p>B需要她用无关紧要的细枝末节辩护。实际the core明确落在knew nothing，不能把知情与否这个直接争点说成trivial issues。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. was hardly convincing</h3>\n<blockquote>\n<p>作者认为Brooks的辩护难以令人信服。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>successful说明辩护的诉讼结果，astonishing及连续不知、不问则体现作者的质疑。司法上成功不等于作者认为充分可信。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on g but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Brooks的辩护是一项阴谋的组成部分。</p>\n</blockquote>\n<p><code>part of a conspiracy</code>需要将辩护连到一项合谋，第四段说明的却是<code>she never inquired</code>与<code>she knew nothing</code>，因此回看这两处，检查原句建立了什么联系。</p>\n<p>原文<code>she never inquired</code>说她没有过问报道来历，末句又说她以不知情成功辩护，连接的是她的个人做法与辩护理由。本项<code>part of a conspiracy</code>则把辩护嵌入一个合谋计划，增加了它与共同安排的联系。不问和不知道说明她本人如何行动、如何辩护，不能直接转成她的辩护参与合谋。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<p>道德目的缺失不仅体现于大规模窃听，也体现于审判展开的条件。令人震惊的是，Brooks对编辑部情况知道得如此少，很少想到询问，从未追问报道如何得来。她成功辩护的核心就是自己毫不知情。</p>\n</blockquote>\n<p>作者追踪管理行为怎样成为免责理由，没有交代辩护者与其他人协调、共同计划或约定的过程。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Brooks’s defence was part of a conspiracy.</p>\n<p>作者认为Brooks的辩护是一项阴谋的组成部分。</p>\n</blockquote>\n<p>D需要证明这份辩护本身属于conspiracy。前段出现他人的合谋窃听指控，也不能直接移成Brooks辩护的性质。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>38题结论</h3>\n<blockquote>\n<p><strong>38. C</strong></p>\n</blockquote>\n<ul>\n<li>A：不知、不问与用不知情辩护是文中写明的行为，A另添狡猾性格的心理归因。成功辩护本身不能证明蓄意使计。</li>\n<li>B：辩护围绕是否知道新闻获取方式展开，直接涉及被控行为。B却说它以琐碎事项为中心，改变了争点的性质。</li>\n<li>C：successful说明辩护的诉讼结果，astonishing及连续不知、不问则体现作者的质疑。司法上成功不等于作者认为充分可信。</li>\n<li>D：本段写Brooks个人的不问与不知情辩护，没有把这份辩护放入一项共同密谋。D新增了合谋关系。</li>\n</ul>\n<h2>39题</h2>\n<blockquote>\n<p>The author holds that the current collective doctrine shows ______.</p>\n<p>作者认为当前的集体信条表现出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>概括推断题：将高管问责状况与受重视、被边缘化的两组价值放在一起，看集体信条反映的取向。</p>\n<p>题干的current collective doctrine对应第五段the collective doctrine has been。先完整读第五段，从高管不问责的常态，读到利润筛选原则和两组词语。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n<p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n<p>The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation</p>\n</blockquote>\n<h3>A. generally distorted values</h3>\n<blockquote>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p><code>generally distorted values</code>问社会普遍看重什么，第五段<code>become normal</code>写高管不问责成为常态，随后又将社会筛选机制定为<code>profit</code>，因此回看这两句和受重视的词。</p>\n<p>原文先说高薪管理者对自己管理的机构不问责已<code>become normal</code>，再以社会把利润当筛选标准解释这种现象，效率、财富创造和销量也都受到重视。本项<code>generally distorted values</code>把这些取舍概括为普遍的价值偏差：追求经济效果被看重，承担管理责任却不被要求。<code>normal</code>、<code>collective</code>和<code>For a generation</code>又表明作者谈的是广泛、持续的取向，不只是一次个人失误。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n<p>如今，高薪高管不必对其管理机构中发生的事情负责，已成为常态。也许我们不该如此惊讶：一代人以来，共同信条一直是以利润作社会筛选机制。受看重的是效率、灵活性、股东价值、商业友好、创造财富、销量、影响力和报纸发行量；正义、公平、包容、相称原则与问责却被挤到边缘。</p>\n</blockquote>\n<p>作者从高薪高管不负责的常态进入利润信条，再把受重视的经济词与被挤到边缘的道德词并列对照。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The current collective doctrine shows generally distorted values.</p>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p>A的generally对应这种广泛、长期的取向，distorted对应经济效果独尊而责任缺位；不是把追求效率本身一概判错。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. unfair wealth distribution</h3>\n<blockquote>\n<p>作者认为当前集体信条体现不公平的财富分配。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>高管高薪和创造财富确实出现，但批评重点是高薪者不负责、逐利压过道德，未比较财富如何分给不同群体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为当前集体信条体现不公平的财富分配。</p>\n</blockquote>\n<p><code>wealth distribution</code>说钱财怎样分到不同人手里，第五段既有<code>wealth generation</code>，也有<code>well-paid executives</code>，所以回看创造财富的列表和高管无需问责的句子。</p>\n<p>原文<code>well-paid</code>说明高管薪资丰厚，但这一句批评的是高管不对所管机构的事负责；<code>wealth generation</code>说创造财富受到看重。本项<code>wealth distribution</code>把问题改成财富在人与人之间怎样分配，以及这种分配是否公平。创造财富不等于分配财富，高管薪酬丰厚却不负责也不是不同群体获得财富份额的比较，本项改变了两处事实所表达的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n<p>如今，高薪高管不必对其管理机构中发生的事情负责，已成为常态。也许我们不该如此惊讶：一代人以来，共同信条一直是以利润作社会筛选机制。受看重的是效率、灵活性、股东价值、商业友好、创造财富、销量、影响力和报纸发行量；正义、公平、包容、相称原则与问责却被挤到边缘。</p>\n</blockquote>\n<p>well-paid为高管责任问题提供反差，wealth generation则列在受重视的标准中，都服务于价值取舍。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The current collective doctrine shows unfair wealth distribution.</p>\n<p>作者认为当前集体信条体现不公平的财富分配。</p>\n</blockquote>\n<p>B需要不公平分配的关系，例如各方所得与应得的比较。文中谈创造财富和责任缺失，不能把generation替换成distribution。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. a marginalized lifestyle</h3>\n<blockquote>\n<p>作者认为当前集体信条体现被边缘化的生活方式。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>被边缘化的是正义、公平、问责等价值，原文没有描述某一生活方式遭到排斥。C把评价对象改了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In
