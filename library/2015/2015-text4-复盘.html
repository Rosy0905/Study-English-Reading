rong></p>\n</blockquote>\n<ul>\n<li>A：Mulcaire承认窃听规模庞大，A却猜他可能否认其犯罪性质。承认多少人被窃听与判断是否犯罪不是同一个命题。</li>\n<li>B：acknowledged是承认既成窃听事实，accepted on certain occasions是未来在某些场合认可这种行为。承认事实不等于许可行为。</li>\n<li>C：第三段明确把guilty接Coulson，把innocent接Brooks。C把另一个人的无罪结果转给Coulson。</li>\n<li>D：已有一人因合谋窃听获罪，记者窃听规模很大，又有人等待审判。这些线索支持还可能有记者被判有罪，may保留尚未裁定的状态。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> The author believes the Rebekah Brooks’s defence ______.\n>\n> 作者认为布鲁克斯的辩护怎样？\n\n### 题型\n\n观点细节题：区分辩护取得成功这一事实与作者是否信服，结合其对不知、不问的评价判断。\n\n题干点名Rebekah Brooks’s defence，第四段The core of her successful defence直接谈这份辩护。把这一整段从道德宗旨缺乏读到她以不知情成功辩护。\n\n### 核心出处\n\n> how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.\n>\n> The core of her successful defence was that she knew nothing.\n>\n> One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>The author believes the Rebekah Brooks’s defence ______.</p>\n<p>作者认为布鲁克斯的辩护怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点细节题：区分辩护取得成功这一事实与作者是否信服，结合其对不知、不问的评价判断。</p>\n<p>题干点名Rebekah Brooks’s defence，第四段The core of her successful defence直接谈这份辩护。把这一整段从道德宗旨缺乏读到她以不知情成功辩护。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.</p>\n<p>The core of her successful defence was that she knew nothing.</p>\n<p>One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived</p>\n</blockquote>\n"},{"title":"A. revealed a cunning personality","raw":"### A. revealed a cunning personality\n\n> 作者认为Brooks的辩护显露出狡猾性格。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n不知、不问与用不知情辩护是文中写明的行为，A另添狡猾性格的心理归因。成功辩护本身不能证明蓄意使计。\n\n**出处：**\n\n> In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>作者认为Brooks的辩护显露出狡猾性格。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>不知、不问与用不知情辩护是文中写明的行为，A另添狡猾性格的心理归因。成功辩护本身不能证明蓄意使计。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n</section>"},{"title":"A. revealed a cunning personality","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为Brooks的辩护显露出狡猾性格。\n\n`a cunning personality`把辩护接到性格判断，第四段`she knew nothing`直接给出辩护内容，所以回看这句和她从不过问报道来历的说明。\n\  the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<p>道德目的缺失不仅体现于大规模窃听，也体现于审判展开的条件。令人震惊的是，Brooks对编辑部情况知道得如此少，很少想到询问，从未追问报道如何得来。她成功辩护的核心就是自己毫不知情。</p>\n</blockquote>\n<p>作者追踪管理行为怎样成为免责理由，没有交代辩护者与其他人协调、共同计划或约定的过程。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Brooks’s defence was part of a conspiracy.</p>\n<p>作者认为Brooks的辩护是一项阴谋的组成部分。</p>\n</blockquote>\n<p>D需要证明这份辩护本身属于conspiracy。前段出现他人的合谋窃听指控，也不能直接移成Brooks辩护的性质。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. C**\n\n- A：不知、不问与用不知情辩护是文中写明的行为，A另添狡猾性格的心理归因。成功辩护本身不能证明蓄意使计。\n- B：辩护围绕是否知道新闻获取方式展开，直接涉及被控行为。B却说它以琐碎事项为中心，改变了争点的性质。\n- C：successful说明辩护的诉讼结果，astonishing及连续不知、不问则体现作者的质疑。司法上成功不等于作者认为充分可信。\n- D：本段写Brooks个人的不问与不知情辩护，没有把这份辩护放入一项共同密谋。D新增了合谋关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. C</strong></p>\n</blockquote>\n<ul>\n<li>A：不知、不问与用不知情辩护是文中写明的行为，A另添狡猾性格的心理归因。成功辩护本身不能证明蓄意使计。</li>\n<li>B：辩护围绕是否知道新闻获取方式展开，直接涉及被控行为。B却说它以琐碎事项为中心，改变了争点的性质。</li>\n<li>C：successful说明辩护的诉讼结果，astonishing及连续不知、不问则体现作者的质疑。司法上成功不等于作者认为充分可信。</li>\n<li>D：本段写Brooks个人的不问与不知情辩护，没有把这份辩护放入一项共同密谋。D新增了合谋关系。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> The author holds that the current collective doctrine shows ______.\n>\n> 作者认为当前的集体信条表现出什么？\n\n### 题型\n\n概括推断题：将高管问责状况与受重视、被边缘化的两组价值放在一起，看集体信条反映的取向。\n\n题干的current collective doctrine对应第五段the collective doctrine has been。先完整读第五段，从高管不问责的常态，读到利润筛选原则和两组词语。\n\n### 核心出处\n\n> In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.\n>\n> For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.\n>\n> The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>The author holds that the current collective doctrine shows ______.</p>\n<p>作者认为当前的集体信条表现出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>概括推断题：将高管问责状况与受重视、被边缘化的两组价值放在一起，看集体信条反映的取向。</p>\n<p>题干的current collective doctrine对应第五段the collective doctrine has been。先完整读第五段，从高管不问责的常态，读到利润筛选原则和两组词语。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In today’s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n<p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n<p>The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation</p>\n</blockquote>\n"},{"title":"A. generally distorted values","raw":"### A. generally distorted values\n\n> 作者认为当前集体信条体现普遍扭曲的价值观。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。\n\n**出处：**\n\n> In today's world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n</section>"},{"title":"A. generally distorted values","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为当前集体信条体现普遍扭曲的价值观。\n\n`generally distorted values`问社会普遍看重什么，第五段`become normal`写高管不问责成为常态，随后又将社会筛选机制定为`profit`，因此回看这两句和受重视的词。\n\n原文先说高薪管理者对自己管理的机构不问责已`become normal`，再以社会把利润当筛选标准解释这种现象，效率、财富创造和销量也都受到重视。本项`generally distorted values`把这些取舍概括为普遍的价值偏差：追求经济效果被看重，承担管理责任却不被要求。`normal`、`collective`和`For a generation`又表明作者谈的是广泛、持续的取向，不只是一次个人失误。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p><code>generally distorted values</code>问社会普遍看重什么，第五段<code>become normal</code>写高管不问责成为常态，随后又将社会筛选机制定为<code>profit</code>，因此回看这两句和受重视的词。</p>\n<p>原文先说高薪管理者对自己管理的机构不问责已<code>become normal</code>，再以社会把利润当筛选标准解释这种现象，效率、财富创造和销量也都受到重视。本项<code>generally distorted values</code>把这些取舍概括为普遍的价值偏差：追求经济效果被看重，承担管理责任却不被要求。<code>normal</code>、<code>collective</code>和<code>For a generation</code>又表明作者谈的是广泛、持续的取向，不只是一次个人失误。</p>\n</section>"},{"title":"A. generally distorted values","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In today's world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.\n>\n> 如今，高薪高管不必对其管理机构中发生的事情负责，已成为常态。也许我们不该如此惊讶：一代人以来，共同信条一直是以利润作社会筛选机制。受看重的是效率、灵活性、股东价值、商业友好、创造财富、销量、影响力和报纸发行量；正义、公平、包容、相称原则与问责却被挤到边缘。\n\n作者从高薪高管不负责的常态进入利润信条，再把受重视的经济词与被挤到边缘的道德词并列对照。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The current collective doctrine shows generally distorted values.\n>\n> 作者认为当前集体信条体现普遍扭曲的价值观。\n\nA的generally对应这种广泛、长期的取向，distorted对应经济效果独尊而责任缺位；不是把追求效率本身一概判错。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>作者认为当前集体信条体现普遍扭曲的价值观。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n 回看这句以及社会应以利润作筛选标准的解释。\n\n原文说管理者`should not be accountable`，对所管机构的事情无需负责已成为常态，社会又以利润为筛选机制。本项`a rigid moral code`却把这种现象说成道德规范严格僵硬。高管的职责不被要求承担，表明责任约束缺失，本项却改成道德约束过严，方向不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>管理责任、公平等被挤到边缘，体现道德约束不足。D却将它说成道德准则过分严格，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p><code>a rigid moral code</code>强调道德规范的严格约束，第五段<code>should not be accountable</code>直接写是否要求管理者承担责任，因此回看这句以及社会应以利润作筛选标准的解释。</p>\n<p>原文说管理者<code>should not be accountable</code>，对所管机构的事情无需负责已成为常态，社会又以利润为筛选机制。本项<code>a rigid moral code</code>却把这种现象说成道德规范严格僵硬。高管的职责不被要求承担，表明责任约束缺失，本项却改成道德约束过严，方向不同。</p>\n</section>"},{"title":"D. a rigid moral code","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In today's world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.\n>\n> 如今，高薪高管不必对其管理机构中发生的事情负责，已成为常态。也许我们不该如此惊讶：一代人以来，共同信条一直是以利润作社会筛选机制。受看重的是效率、灵活性、股东价值、商业友好、创造财富、销量、影响力和报纸发行量；正义、公平、包容、相称原则与问责却被挤到边缘。\n\n高管无需问责成为正常现象，利润信条随后解释为什么；末尾再明确问责与公平不受重视。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The current collective doctrine shows a rigid moral code.\n>\n> 作者认为当前集体信条体现严格僵硬的道德准则。\n\nD需要道德规范严到僵硬的表现。实际是相关规范失去约束力，不能将经济标准占主导读成道德标准约束过强。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>管理责任、公平等被挤到边缘，体现道德约束不足。D却将它说成道德准则过分严格，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p><code>a rigid moral code</code>强调道德规范的严格约束，第五段<code>should not be accountable</code>直接写是否要求管理者承担责任，因此回看这句以及社会应以利润作筛选标准的解释。</p>\n<p>原文说管理者<code>should not be accountable</code>，对所管机构的事情无需负责已成为常态，社会又以利润为筛选机制。本项<code>a rigid moral code</code>却把这种现象说成道德规范严格僵硬。高管的职责不被要求承担，表明责任约束缺失，本项却改成道德约束过严，方向不同。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n<p>如今，高薪高管不必对其管理机构中发生的事情负责，已成为常态。也许我们不该如此惊讶：一代人以来，共同信条一直是以利润作社会筛选机制。受看重的是效率、灵活性、股东价值、商业友好、创造财富、销量、影响力和报纸发行量；正义、公平、包容、相称原则与问责却被挤到边缘。</p>\n</blockquote>\n<p>高管无需问责成为正常现象，利润信条随后解释为什么；末尾再明确问责与公平不受重视。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The current collective doctrine shows a rigid moral code.</p>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p>D需要道德规范严到僵硬的表现。实际是相关规范失去约束力，不能将经济标准占主导读成道德标准约束过强。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. A**\n\n- A：以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。\n- B：高管高薪和创造财富确实出现，但批评重点是高薪者不负责、逐利压过道德，未比较财富如何分给不同群体。\n- C：被边缘化的是正义、公平、问责等价值，原文没有描述某一生活方式遭到排斥。C把评价对象改了。\n- D：管理责任、公平等被挤到边缘，体现道德约束不足。D却将它说成道德准则过分严格，方向相反。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"39","questionConclusion":true},"html":"<blockquote>\n<p><strong>39. A</strong></p>\n</blockquote>\n<ul>\n<li>A：以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。</li>\n<li>B：高管高薪和创造财富确实出现，但批评重点是高薪者不负责、逐利压过道德，未比较财富如何分给不同群体。</li>\n<li>C：被边缘化的是正义、公平、问责等价值，原文没有描述某一生活方式遭到排斥。C把评价对象改了。</li>\n<li>D：管理责任、公平等被挤到边缘，体现道德约束不足。D却将它说成道德准则过分严格，方向相反。</li>\n</ul>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n> Which of the following is suggested in the last paragraph?\n>\n> 最后一段暗示下列哪一点？\n\n### 题型\n\n段落推断题：从编辑目的、报道伤害与负责人不问不管三处，归纳作者认为编辑应承担什么责任。\n\n题干直接限定the last paragraph，即第六段。完整读这段，从报纸编辑工作的目的读到布鲁克斯是否怀疑以及她具体做了什么。\n\n### 核心出处\n\n> The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.\n>\n> It was to ruin lives in the quest for circulation and impact\n>\n> Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"40","questionIntro":true},"html":"<blockquote>\n<p>Which of the following is suggested in the last paragraph?</p>\n<p>最后一段暗示下列哪一点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：从编辑目的、报道伤害与负责人不问不管三处，归纳作者认为编辑应承担什么责任。</p>\n<p>题干直接限定the last paragraph，即第六段。完整读这段，从报纸编辑工作的目的读到布鲁克斯是否怀疑以及她具体做了什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.</p>\n<p>It was to ruin lives in the quest for circulation and impact</p>\n<p>Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers</p>\n</blockquote>\n"},{"title":"A. The quality of writings is of primary importance.","raw":"### A. The quality of writings is of primary importance.\n\n> 末段暗示：写作质量具有首要重要性。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。\n\n**出处：**\n\n> The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n</section>"},{"title":"A. The quality of writings is of primary importance.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 末段暗示：写作质量具有首要重要性。\n\n`quality of writings`涉及写出的内容，原文`to be fair in what was written`也评价写作，所以回看这句以及随后为了发行量毁掉人生的描述，检查作者是在评价什么。\n\n原文`to be fair in what was written`将公平列为编辑所忽视的要求，又用为了发行量和影响力毁掉人生指出伤害，批评的是办报目的没有顾及公平和他人。本项`quality of writings is of primary importance`把这份批评改成整体写作质量应当居于首要位置。公平地写、关心报道对人的影响属于具体的道德要求，并不等于对作品整体质量作首位排序；本项增加了评价对象及其优先程度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p><code>quality of writings</code>涉及写出的内容，原文<code>to be fair in what was written</code>也评价写作，所以回看这句以及随后为了发行量毁掉人生的描述，检查作者是在评价什么。</p>\n<p>原文<code>to be fair in what was written</code>将公平列为编辑所忽视的要求，又用为了发行量和影响力毁掉人生指出伤害，批评的是办报目的没有顾及公平和他人。本项<code>quality of writings is of primary importance</code>把这份批评改成整体写作质量应当居于首要位置。公平地写、关心报道对人的影响属于具体的道德要求，并不等于对作品整体质量作首位排序；本项增加了评价对象及其优先程度。</p>\n</section>"},{"title":"A. The quality of writings is of primary importance.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.\n>\n> 编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。\n\n作者先列报纸没有追求的理解、公平、人性，再用ruin lives揭示只求销量的伤害，最后落到编辑不问不管。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The quality of writings is of primary importance.\n>\n> 末段暗示：写作质量具有首要重要性。\n\nA需要把作品质量与其他目标作排序。实际关切的是不应以伤害他人为代价追求销量，不能由fair in what was written推出质量具有最高优先性。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their s e of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>末段暗示：编辑报纸应重视道德意识。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>理解读者、公平对人和基本人性都被销量追求挤掉，编辑又不询问报道来源。B用道德意识重要概括这些职责与后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n</section>"},{"title":"B. Moral awareness matters in editing a newspaper.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 末段暗示：编辑报纸应重视道德意识。\n\n`Moral awareness`说的是能否意识到公平和对他人的责任，原文`to be fair`与`common humanity`正涉及这些方面，因此回看编辑目的的句子，再接上`ruin lives`这一后果。\n\n原文说这份报纸的编辑目的没有顾及`to be fair`和`common humanity`，反而为了发行量和影响力去`ruin lives`。作者以伤害人的后果批评这种做法。本项`Moral awareness matters`从这份批评推出编辑应当重视道德意识，承接的正是公平、共同人性与避免伤害他人的要求；它没有把报纸当前忽略道德的做法当成应有标准。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset tions, gave no instructions – nor received traceable, recorded answers.</p>\n<p>编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。</p>\n</blockquote>\n<p>增进理解、公平和共同人性并列，后面还有Brooks不问、不指示的职责问题；段落围绕编辑的道德意识展开。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Common humanity is central to news reporting.</p>\n<p>末段暗示：共同人性在新闻报道中居于核心。</p>\n</blockquote>\n<p>不能因central就说C必然排斥所有其他要求。它的问题是概括较窄：若把段落归结为人性居中心，尚难完整说明负责人为何必须追问来源；B的道德责任将两处接得更全。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. Journalists need stricter industrial regulations.","raw":"### D. Journalists need stricter industrial regulations.\n\n> 末段暗示：记者需要更严格的行业规章。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\n没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。\n\n**出处：**\n\n> The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n</section>"},{"title":"D. Journalists need stricter industrial regulations.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 末段暗示：记者需要更严格的行业规章。\n\n`stricter regulations`涉及规范的严格程度，末句`gave no instructions`说布鲁克斯有没有给记者指示，因此回看她有没有询问和指示，辨别原文写的是行为还是规章本身。\n\n原文对她是否怀疑保持不确定，却明确写她`asked no questions`、`gave no instructions`，说明她实际上没有询问和下指示。本项`stricter regulations`从这些行为推出规范需要比现有的更严格。个人不询问、不指示不能直接说明规章本身过于宽松，本项把不履行管理行为改成了规范应收紧的判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><code>stricter regulations</code>涉及规范的严格程度，末句<code>gave no instructions</code>说布鲁克斯有没有给记者指示，因此回看她有没有询问和指示，辨别原文写的是行为还是规章本身。</p>\n<p>原文对她是否怀疑保持不确定，却明确写她<code>asked no questions</code>、<code>gave no instructions</code>，说明她实际上没有询问和下指示。本项<code>stricter regulations</code>从这些行为推出规范需要比现有的更严格。个人不询问、不指示不能直接说明规章本身过于宽松，本项把不履行管理行为改成了规范应收紧的判断。</p>\n</section>"},{"title":"D. Journalists need stricter industrial regulations.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.\n>\n> 编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。\n\n末句对她是否怀疑保持may or may not，却肯定其不问、不下指示、没有可追踪回答的实际表现。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Journalists need stricter industrial regulations.\n>\n> 末段暗示：记者需要更严格的行业规章。\n\nD需要先说明规则存在宽松缺口再提出收紧。实际未评估规则条文的严宽，而是在写负责人没有做什么，不能把未履责自动改成加严规则的方案。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><code>stricter regulations</code>涉及规范的严格程度，末句<code>gave no instructions</code>说布鲁克斯有没有给记者指示，因此回看她有没有询问和指示，辨别原文写的是行为还是规章本身。</p>\n<p>原文对她是否怀疑保持不确定，却明确写她<code>asked no questions</code>、<code>gave no instructions</code>，说明她实际上没有询问和下指示。本项<code>stricter regulations</code>从这些行为推出规范需要比现有的更严格。个人不询问、不指示不能直接说明规章本身过于宽松，本项把不履行管理行为改成了规范应收紧的判断。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<p>编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。</p>\n</blockquote>\n<p>末句对她是否怀疑保持may or may not，却肯定其不问、不下指示、没有可追踪回答的实际表现。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Journalists need stricter industrial regulations.</p>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p>D需要先说明规则存在宽松缺口再提出收紧。实际未评估规则条文的严宽，而是在写负责人没有做什么，不能把未履责自动改成加严规则的方案。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. B**\n\n- A：末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。\n- B：理解读者、公平对人和基本人性都被销量追求挤掉，编辑又不询问报道来源。B用道德意识重要概括这些职责与后果。\n- C：共同人性确实是作者重视的道德要求，因此C有依据；但它只取并列要求中的一项，B更能覆盖整段编辑目的与管理失责。\n- D：没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. B</strong></p>\n</blockquote>\n<ul>\n<li>A：末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。</li>\n<li>B：理解读者、公平对人和基本人性都被销量追求挤掉，编辑又不询问报道来源。B用道德意识重要概括这些职责与后果。</li>\n<li>C：共同人性确实是作者重视的道德要求，因此C有依据；但它只取并列要求中的一项，B更能覆盖整段编辑目的与管理失责。</li>\n<li>D：没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：伊丽莎白·默多克的批判**（段落1-2核心观点） 诚信危机的根源：【集体接受\"分类机制\"只应是利润和市场 → 诚信崩溃】// 伊丽莎白的观点：（是人创造社会，不是利润）→ 道德缺失的危险：（政府、媒体、商业中缺乏道德目的 → 威胁资本主义和自由）→ 具体影响：新闻国际因道德缺失而迷失（电话窃听）\n\n↓（现实印证）\n\n**逻辑层次2：窃听丑闻的规模与审判结果**（段落3事实陈述） 审判结果：（库尔森有罪 // 布鲁克斯无罪）→ 但诚信缺失问题仍存 → 窃听规模：【5500人被窃听 + 工业规模操作（马尔凯尔承认）+ 更多人等待审判】\n\n↓（深层分析）\n\n**逻辑层次3：道德缺失如何影响审判**（段落4审判分析） 道德目的缺失框定了：（窃听事实 + 审判条件）→ 布鲁克斯的\"无知\"：【对新闻室情况知之甚少 + 很少想到要问 + 从不询问故事来源】→ 辩护核心：她什么都不知道\n\n↓（体制批判）\n\n**逻辑层次4：当代价值观的扭曲**（段落5价值分析） 现状：高薪管理者不负责任已成常态 → 根源：一代人的集体教条（社会分类机制=利润）→ 价值词汇对比：【重要词汇：效率、灵活性、股东价值、财富创造、销售、影响力、发行量 // 边缘化词汇：正义、公平、宽容、适度、问责】\n\n↓（具体体现）\n\n**逻辑层次5：《世界新闻报》的堕落**（段落6案例总结） 编辑目的：不是（促进理解 + 保持公平 + 体现人性）// 而是（为发行量和影响力毁掉他人生活）→ 布鲁克斯的管理：【可能有怀疑 // 但不问、不指示、不追踪】\n\n↑（全文主旨）\n\n全文核心观点：以利润为唯一\"分类机制\"的价值观导致了机构诚信的崩溃，这在新闻集团窃听丑闻中得到充分体现——管理者逃避责任成为常态，道德词汇被边缘化，新闻业失去了基本的人性和道德目的。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：伊丽莎白·默多克的批判</strong>（段落1-2核心观点） 诚信危机的根源：【集体接受&quot;分类机制&quot;只应是利润和市场 → 诚信崩溃】// 伊丽莎白的观点：（是人创造社会，不是利润）→ 道德缺失的危险：（政府、媒体、商业中缺乏道德目的 → 威胁资本主义和自由）→ 具体影响：新闻国际因道德缺失而迷失（电话窃听）</p>\n<p>↓（现实印证）</p>\n<p><strong>逻辑层次2：窃听丑闻的规模与审判结果</strong>（段落3事实陈述） 审判结果：（库尔森有罪 // 布鲁克斯无罪）→ 但诚信缺失问题仍存 → 窃听规模：【5500人被窃听 + 工业规模操作（马尔凯尔承认）+ 更多人等待审判】</p>\n<p>↓（深层分析）</p>\n<p><strong>逻辑层次3：道德缺失如何影响审判</strong>（段落4审判分析） 道德目的缺失框定了：（窃听事实 + 审判条件）→ 布鲁克斯的&quot;无知&quot;：【对新闻室情况知之甚少 + 很少想到要问 + 从不询问故事来源】→ 辩护核心：她什么都不知道</p>\n<p>↓（体制批判）</p>\n<p><strong>逻辑层次4：当代价值观的扭曲</strong>（段落5价值分析） 现状：高薪管理者不负责任已成常态 → 根源：一代人的集体教条（社会分类机制=利润）→ 价值词汇对比：【重要词汇：效率、灵活性、股东价值、财富创造、销售、影响力、发行量 // 边缘化词汇：正义、公平、宽容、适度、问责】</p>\n<p>↓（具体体现）</p>\n<p><strong>逻辑层次5：《世界新闻报》的堕落</strong>（段落6案例总结） 编辑目的：不是（促进理解 + 保持公平 + 体现人性）// 而是（为发行量和影响力毁掉他人生活）→ 布鲁克斯的管理：【可能有怀疑 // 但不问、不指示、不追踪】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：以利润为唯一&quot;分类机制&quot;的价值观导致了机构诚信的崩溃，这在新闻集团窃听丑闻中得到充分体现——管理者逃避责任成为常态，道德词汇被边缘化，新闻业失去了基本的人性和道德目的。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】D. A warning about institutions without moral purpose\n\n> 对机构缺乏道德目标的警告\n\n先引述诚信不足与逐利机制的因果，再以窃听说明失去道德目标如何让企业迷失。\n\n> Two years ago, Rupert Murdoch's daughter, Elisabeth, spoke of the \"unsettling dearth of integrity across so many of our institutions\".\n\nunsettling dearth直接提出机构普遍缺少诚信，讨论的是道德品质而不是公司盈利规模。\n\n> Integrity had collapsed, she argued, because of a collective acceptance that the only \"sorting mechanism\" in society should be profit and the market.\n\nbecause of把诚信崩塌归因于利润和市场独占筛选机制：社会怎样衡量成功，会影响机构怎样行动。\n\n> But \"it's us, human beings, we the people who create the society we want, not profit.\" Driving her point home, she continued: \"It's increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.\" This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.\n\n由人创造社会的主张，与企业因缺少道德目标而迷失的案例相接。窃听把抽象价值警告落实到具体机构行为。\n\n这一部分的推进关系是：\n\n> 诚信不足 → 利润独尊挤掉道德判断 → 企业迷失及窃听案例\n\nwarning概括unsettling与dangerous，without moral purpose贯通两段。\n\n再看最强干扰项E：The complete disappearance of newspaper readership。\n\n发行量并未在这里消失，批评的是机构价值取向。\n\n**41题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】D. A warning about institutions without moral purpose</p>\n<blockquote>\n<p>对机构缺乏道德目标的警告</p>\n</blockquote>\n<p>先引述诚信不足与逐利机制的因果，再以窃听说明失去道德目标如何让企业迷失。</p>\n<blockquote>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;.</p>\n</blockquote>\n<p>unsettling dearth直接提出机构普遍缺少诚信，讨论的是道德品质而不是公司盈利规模。</p>\n<blockquote>\n<p>Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market.</p>\n</blockquote>\n<p>because of把诚信崩塌归因于利润和市场独占筛选机制：社会怎样衡量成功，会影响机构怎样行动。</p>\n<blockquote>\n<p>But &quot;it&#39;s us, human beings, we the people who create the society we want, not profit.&quot; Driving her point home, she continued: &quot;It&#39;s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.&quot; This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n</blockquote>\n<p>由人创造社会的主张，与企业因缺少道德目标而迷失的案例相接。窃听把抽象价值警告落实到具体机构行为。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>诚信不足 → 利润独尊挤掉道德判断 → 企业迷失及窃听案例</p>\n</blockquote>\n<p>warning概括unsettling与dangerous，without moral purpose贯通两段。</p>\n<p>再看最强干扰项E：The complete disappearance of newspaper readership。</p>\n<p>发行量并未在这里消失，批评的是机构价值取向。</p>\n<p><strong>41题选D。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】B. The unanswered moral problem behind a criminal trial\n\n> 刑事审判背后尚未解决的道德问题\n\n审判区分一人有罪与一人无罪，但完整问题仍在，窃听规模巨大且还有人待审。\n\n> As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands.\n\n一人有罪、一人无罪只是个案裁决，句末still stands明确说更广泛的诚信问题仍未解决。\n\n> This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.\n\nindustrial scale与5500人把视野从两名主编扩大到系统性窃听，Mulcaire的承认又提供知情者根据。\n\n> This long story still unfolds.\n\nstill unfolds配合Others await trial表明事件和问题都未随当前审判结束。标题要保留法律个案之外尚存的道德问题。\n\n这一部分的推进关系是：\n\n> 不同个案裁决 → 大规模窃听事实 → 后续审判与诚信问题仍在\n\nunanswered对应still stands和still unfolds；标题没有把未完案件写成全面结案。\n\n再看最强干扰项G：A proven improvement in journalistic accountability。\n\n待审与广泛侵害不构成问责已经改善的证明。\n\n**42题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】B. The unanswered moral problem behind a criminal trial</p>\n<blockquote>\n<p>刑事审判背后尚未解决的道德问题</p>\n</blockquote>\n<p>审判区分一人有罪与一人无罪，但完整问题仍在，窃听规模巨大且还有人待审。</p>\n<blockquote>\n<p>As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands.</p>\n</blockquote>\n<p>一人有罪、一人无罪只是个案裁决，句末still stands明确说更广泛的诚信问题仍未解决。</p>\n<blockquote>\n<p>This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired {"kind":"newtype","question":"44"},"html":"<p>【答案】C. The values pushed aside by the pursuit of profit</p>\n<blockquote>\n<p>逐利所排挤的价值</p>\n</blockquote>\n<p>先指出高管不负责成为常态，再列社会重视和边缘化的两组价值。</p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n</blockquote>\n<p>高薪高管不问责成为normal，先交代需要解释的广泛现象，而非单论Brooks个人性格。</p>\n<blockquote>\n<p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n</blockquote>\n<p>利润作为sorting mechanism，说明为什么效率、销量等被高度重视；作者转向社会判断优劣的标准。</p>\n<blockquote>\n<p>Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n<p>justice、fairness、accountability被挤到margin，与前一组经济标准形成对照，突出逐利排挤哪些价值。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>不问责成为常态 → 利润信条及经济标准居先 → 公平与责任等被边缘化</p>\n</blockquote>\n<p>pursuit of profit对应sorting mechanism，pushed aside对应degraded to the margin。</p>\n<p>再看最强干扰项G：A proven improvement in journalistic accountability。</p>\n<p>作者是在批评责任退位，而非证实问责改善。</p>\n<p><strong>44题选C。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】F. Editorial duties lost in the pursuit of circulation\n\n> 追求发行量中丢失的编辑职责\n\n将应有的理解、公平、人性与毁坏他人生活相对照，再写编辑既不问也不作指示。\n\n> The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity.\n\nnot to后面并列理解、公平、人性，交代报纸没有追求的道德目标。\n\n> It was to ruin lives in the quest for circulation and impact.\n\nIt was to以毁坏生活追求发行量作反面目的，表现逐利与对他人负责之间的冲突。\n\n> Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.\n\n不知是否怀疑与明确不问、不作指示分开：作者能确认的是编辑未履行过问来源的责任，将目的失当落到管理行为。\n\n这一部分的推进关系是：\n\n> 理解、公平、人性未获重视 → 为销量伤害他人 → 编辑不问不管使失责具体化\n\nduties对应编辑应做之事，pursuit of circulation对应实际动机。\n\n再看最强干扰项E：The complete disappearance of newspaper readership。\n\n批评的是以发行量伤人为目标，不是没有读者。\n\n**45题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】F. Editorial duties lost in the pursuit of circulation</p>\n<blockquote>\n<p>追求发行量中丢失的编辑职责</p>\n</blockquote>\n<p>将应有的理解、公平、人性与毁坏他人生活相对照，再写编辑既不问也不作指示。</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity.</p>\n</blockquote>\n<p>not to后面并列理解、公平、人性，交代报纸没有追求的道德目标。</p>\n<blockquote>\n<p>It was to ruin lives in the quest for circulation and impact.</p>\n</blockquote>\n<p>It was to以毁坏生活追求发行量作反面目的，表现逐利与对他人负责之间的冲突。</p>\n<blockquote>\n<p>Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<p>不知是否怀疑与明确不问、不作指示分开：作者能确认的是编辑未履行过问来源的责任，将目的失当落到管理行为。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>理解、公平、人性未获重视 → 为销量伤害他人 → 编辑不问不管使失责具体化</p>\n</blockquote>\n<p>duties对应编辑应做之事，pursuit of circulation对应实际动机。</p>\n<p>再看最强干扰项E：The complete disappearance of newspaper readership。</p>\n<p>批评的是以发行量伤人为目标，不是没有读者。</p>\n<p><strong>45题选F。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出利润独尊导致道德判断失位 |\n| B | 列出被看重及被边缘化的价值 |\n| C | 说明逐利价值怎样改变编辑工作 |\n| D | 区分个案裁决与尚存的广泛问题 |\n| E | 说明不知情辩护与管理职责的冲突 |\n| F | 把价值警告引到电话窃听案例 |\n| G | 由个别编辑转入高管责任缺失 |\n| H | 总结法律结案不等于道德责任解决 |\n\n全文推进：\n\n> 提出利润独尊导致道德判断失位 → 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题 → 说明不知情辩护与管理职责的冲突 → 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作 → 总结法律结案不等于道德责任解决\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出利润独尊导致道德判断失位</td>\n</tr>\n<tr>\n<td>B</td>\n<td>列出被看重及被边缘化的价值</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明逐利价值怎样改变编辑工作</td>\n</tr>\n<tr>\n<td>D</td>\n<td>区分个案裁决与尚存的广泛问题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>说明不知情辩护与管理职责的冲突</td>\n</tr>\n<tr>\n<td>F</td>\n<td>把价值警告引到电话窃听案例</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由个别编辑转入高管责任缺失</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结法律结案不等于道德责任解决</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出利润独尊导致道德判断失位 → 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题 → 说明不知情辩护与管理职责的冲突 → 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作 → 总结法律结案不等于道德责任解决</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → D。\n\n先看前段A的结尾：\n\n> Her criticism was not simply that businesses sometimes lose money, but that society was allowing the market to replace moral judgment.\n\n再看F段开头：\n\n> This replacement becomes particularly dangerous when organisations lose any clear moral purpose.\n\nA末句说市场取代道德判断，F的This replacement直接承接这种替代关系，进一步说明机构失去道德目的时的危险。\n\n本段内部继续写道：\n\n> A newspaper may then mistake commercial success for a sufficient defence of its conduct. The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.\n\nF先以报纸把商业成功当行为辩护为例，再提出phone-hacking scandal，使价值警告落到一宗具体事件。\n\n后段D开头是：\n\n> The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge.\n\nD的The scandal回指F末句电话窃听丑闻，接着交代审判中一人有罪、一人无罪的结果。\n\n这三段的推进关系：\n\n> 提出利润独尊导致道德判断失位 → 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题\n\n再检验候选G：\n\n> Such a position normally carries an obligation to know what an organisation is doing.\n\nG的Such a position要求前文先有负责职位。A只谈社会市场标准，尚未写主编岗位；先接G会使position失去所指，也无法引出D的scandal。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Her criticism was not simply that businesses sometimes lose money, but that society was allowing the market to replace moral judgment.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose.</p>\n</blockquote>\n<p>A末句说市场取代道德判断，F的This replacement直接承接这种替代关系，进一步说明机构失去道德目的时的危险。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A newspaper may then mistake commercial success for a sufficient defence of its conduct. The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.</p>\n</blockquote>\n<p>F先以报纸把商业成功当行为辩护为例，再提出phone-hacking scandal，使价值警告落到一宗具体事件。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge.</p>\n</blockquote>\n<p>D的The scandal回指F末句电话窃听丑闻，接着交代审判中一人有罪、一人无罪的结果。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出利润独尊导致道德判断失位 → 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Such a position normally carries an obligation to know what an organisation is doing.</p>\n</blockquote>\n<p>G的Such a position要求前文先有负责职位。A只谈社会市场标准，尚未写主编岗位；先接G会使position失去所指，也无法引出D的scandal。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.\n\n再看D段开头：\n\n> The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge.\n\nF以phone-hacking scandal结尾，D的The scandal承接同一事件，写它带来的审判与两种判决。\n\n本段内部继续写道：\n\n> Yet those different verdicts did not settle the wider problem. Thousands of phones had been hacked, and further defendants still awaited trial, leaving the scale of the wrongdoing beyond dispute.\n\nYet说明不同裁决并未解决更广问题；数千电话被窃听和还有被告待审，把问题从个案结论拉回规模与延续。\n\n后段E开头是：\n\n> The unresolved problem was visible not only in the hacking itself but also in the defence presented at trial.\n\nE的The unresolved problem接D的未解决问题，并将观察点从hacking itself转到审判中的defence。\n\n这三段的推进关系：\n\n> 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题 → 说明不知情辩护与管理职责的冲突\n\n再检验候选G：\n\n> Such a position normally carries an obligation to know what an organisation is doing.\n\nG谈职位所附义务，此时还没介绍Brooks以不知情辩护和其负责职位。它既不能紧接丑闻的判决，也不能为E的unresolved problem提供刚展开的层次。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge.</p>\n</blockquote>\n<p>F以phone-hacking scandal结尾，D的The scandal承接同一事件，写它带来的审判与两种判决。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Yet those different verdicts did not settle the wider problem. Thousands of phones had been hacked, and further defendants still awaited trial, leaving the scale of the wrongdoing beyond dispute.</p>\n</blockquote>\n<p>Yet说明不同裁决并未解决更广问题；数千电话被窃听和还有被告待审，把问题从个案结论拉回规模与延续。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The unresolved problem was visible not only in the hacking itself but also in the defence presented at trial.</p>\n</blockquote>\n<p>E的The unresolved problem接D的未解决问题，并将观察点从hacking itself转到审判中的defence。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题 → 说明不知情辩护与管理职责的冲突</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Such a position normally carries an obligation to know what an organisation is doing.</p>\n</blockquote>\n<p>G谈职位所附义务，此时还没介绍Brooks以不知情辩护和其负责职位。它既不能紧接丑闻的判决，也不能为E的unresolved problem提供刚展开的层次。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> The striking feature was how little she had asked despite holding a position of responsibility.\n\n再看G段开头：\n\n> Such a position normally carries an obligation to know what an organisation is doing.\n\nE末句写holding a position of responsibility却很少询问，G的Such a position紧接这一负责职位，指出按常理应了解机构所做之事。\n\n本段内部继续写道：\n\n> Nevertheless, highly paid executives have increasingly escaped responsibility for events within the institutions they run. This pattern calls for an examination of the values by which their performance has been judged.\n\nNevertheless转向现实中高管逃避责任的现象，再由这一pattern提出应检查其表现究竟按哪些values判断。\n\n后段B开头是：\n\n> Those judgments have favoured efficiency, sales, shareholder value and circulation.\n\nB的Those judgments承接G末句的performance has been judged，随后才列效率、销量等具体标准。\n\n这三段的推进关系：\n\n> 说明不知情辩护与管理职责的冲突 → 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值\n\n再检验候选C：\n\n> That hierarchy shaped the newspaper’s editorial purpose.\n\nC的That hierarchy要求前面先形成价值高低的排序；E仍在讲个别编辑不问，未建立这套hierarchy，不能跳过普遍问责与价值标准两层。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The striking feature was how little she had asked despite holding a position of responsibility.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Such a position normally carries an obligation to know what an organisation is doing.</p>\n</blockquote>\n<p>E末句写holding a position of responsibility却很少询问，G的Such a position紧接这一负责职位，指出按常理应了解机构所做之事。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Nevertheless, highly paid executives have increasingly escaped responsibility for events within the institutions they run. This pattern calls for an examination of the values by which their performance has been judged.</p>\n</blockquote>\n<p>Nevertheless转向现实中高管逃避责任的现象，再由这一pattern提出应检查其表现究竟按哪些values判断。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Those judgments have favoured efficiency, sales, shareholder value and circulation.</p>\n</blockquote>\n<p>B的Those judgments承接G末句的performance has been judged，随后才列效率、销量等具体标准。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明不知情辩护与管理职责的冲突 → 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>That hierarchy shaped the newspaper’s editorial purpose.</p>\n</blockquote>\n<p>C的That hierarchy要求前面先形成价值高低的排序；E仍在讲个别编辑不问，未建立这套hierarchy，不能跳过普遍问责与价值标准两层。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> This pattern calls for an examination of the values by which their performance has been judged.\n\n再看B段开头：\n\n> Those judgments have favoured efficiency, sales, shareholder value and circulation.\n\nG要求检查评价高管表现的价值标准，B用Those judgments接住这一判断活动，开始列被偏爱的指标。\n\n本段内部继续写道：\n\n> Justice, fairness and accountability have received much less attention. The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.\n\n效率、销量与公平、问责受到的不同待遇组成contrast，并说明这种失责反映更广泛的hierarchy of priorities。\n\n后段C开头是：\n\n> That hierarchy shaped the newspaper’s editorial purpose.\n\nC的That hierarchy准确指B末句价值优先次序，再解释这种次序怎样塑造报纸编辑目的。\n\n这三段的推进关系：\n\n> 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作\n\n再检验候选F：\n\n> This replacement becomes particularly dangerous when organisations lose any clear moral purpose.\n\nF的This replacement回到市场替代道德的一般警告，不具体列出价值次序。放此处不能完成G提出的标准检查，也缺少C所需的hierarchy。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>This pattern calls for an examination of the values by which their performance has been judged.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Those judgments have favoured efficiency, sales, shareholder value and circulation.</p>\n</blockquote>\n<p>G要求检查评价高管表现的价值标准，B用Those judgments接住这一判断活动，开始列被偏爱的指标。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Justice, fairness and accountability have received much less attention. The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.</p>\n</blockquote>\n<p>效率、销量与公平、问责受到的不同待遇组成contrast，并说明这种失责反映更广泛的hierarchy of priorities。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That hierarchy shaped the newspaper’s editorial purpose.</p>\n</blockquote>\n<p>C的That hierarchy准确指B末句价值优先次序，再解释这种次序怎样塑造报纸编辑目的。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose.</p>\n</blockquote>\n<p>F的This replacement回到市场替代道德的一般警告，不具体列出价值次序。放此处不能完成G提出的标准检查，也缺少C所需的hierarchy。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.\n\n再看C段开头：\n\n> That hierarchy shaped the newspaper’s editorial purpose.\n\nB末句已经形成hierarchy of priorities，C开头That hierarchy承接这套价值排序，将其作用落到编辑目的。\n\n本段内部继续写道：\n\n> Rather than helping readers understand events or treating people fairly, it pursued circulation and impact even at the cost of damaging lives. In this setting, the editor’s failure to ask questions became part of the moral problem rather than an adequate response to it.\n\n报纸不增进理解、不公平待人，而为销量伤害生活；在这种背景下，编辑不询问也是道德问题的一部分，不是充分回应。\n\n后段H开头是：\n\n> The moral problem therefore survives any single verdict about criminal guilt.\n\nH的The moral problem接C末句的moral problem，therefore再总结刑事有罪与否不能消除道德责任。\n\n这三段的推进关系：\n\n> 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作 → 总结法律结案不等于道德责任解决\n\n再检验候选F：\n\n> This replacement becomes particularly dangerous when organisations lose any clear moral purpose.\n\nF重新引出窃听案例，尚未讨论编辑失责怎样成为问题。把它放这里会回到案例开头，打断从价值次序到管理责任再到道德结论的推进。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That hierarchy shaped the newspaper’s editorial purpose.</p>\n</blockquote>\n<p>B末句已经形成hierarchy of priorities，C开头That hierarchy承接这套价值排序，将其作用落到编辑目的。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Rather than helping readers understand events or treating people fairly, it pursued circulation and impact even at the cost of damaging lives. In this setting, the editor’s failure to ask questions became part of the moral problem rather than an adequate response to it.</p>\n</blockquote>\n<p>报纸不增进理解、不公平待人，而为销量伤害生活；在这种背景下，编辑不询问也是道德问题的一部分，不是充分回应。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The moral problem therefore survives any single verdict about criminal guilt.</p>\n</blockquote>\n<p>H的The moral problem接C末句的moral problem，therefore再总结刑事有罪与否不能消除道德责任。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作 → 总结法律结案不等于道德责任解决</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose.</p>\n</blockquote>\n<p>F重新引出窃听案例，尚未讨论编辑失责怎样成为问题。把它放这里会回到案例开头，打断从价值次序到管理责任再到道德结论的推进。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| * . | 负责人对正在发生的事情不作询问。 |\n| 图画 | The scene draws attention to the responsibilities attached to a position. | 场景引导人们关注职位所附带的责任。 |\n| **图表** | **The figures reveal the growing scale of the problem.** | **数据显示了问题规模的扩大。** |\n| 图表 | One measure of success has gained importance while others have been pushed aside. | 一种成功衡量标准变得重要，而其他标准被排挤。 |\n| 图表 | The contrast shows a gap between visible achievement and responsible conduct. | 这种对比显示了显性成就与负责任行为之间的差距。 |\n| 文本评论 | The statement questions whether profit should be the only sorting mechanism. | 这句话质疑利润是否应成为唯一的筛选机制。 |\n| 文本评论 | The passage stresses that a successful outcome does not remove moral obligations. | 这段文字强调成功的结果不会取消道德义务。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The picture contrasts commercial success with a lack of moral purpose.</strong></td>\n<td><strong>图画将商业成功与道德目标缺失形成对照。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The person in charge asks no questions about what is happening.</td>\n<td>负责人对正在发生的事情不作询问。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene draws attention to the responsibilities attached to a position.</td>\n<td>场景引导人们关注职位所附带的责任。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The figures reveal the growing scale of the problem.</strong></td>\n<td><strong>数据显示了问题规模的扩大。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>One measure of success has gained importance while others have been pushed aside.</td>\n<td>一种成功衡量标准变得重要，而其他标准被排挤。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The contrast shows a gap between visible achievement and responsible conduct.</td>\n<td>这种对比显示了显性成就与负责任行为之间的差距。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement questions whether profit should be the only sorting mechanism.</td>\n<td>这
