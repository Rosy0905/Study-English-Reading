</h3>\n<blockquote>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>管理责任、公平等被挤到边缘，体现道德约束不足。D却将它说成道德准则过分严格，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p><code>a rigid moral code</code>强调道德规范的严格约束，第五段<code>should not be accountable</code>直接写是否要求管理者承担责任，因此回看这句以及社会应以利润作筛选标准的解释。</p>\n<p>原文说管理者<code>should not be accountable</code>，对所管机构的事情无需负责已成为常态，社会又以利润为筛选机制。本项<code>a rigid moral code</code>却把这种现象说成道德规范严格僵硬。高管的职责不被要求承担，表明责任约束缺失，本项却改成道德约束过严，方向不同。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n<p>如今，高薪高管不必对其管理机构中发生的事情负责，已成为常态。也许我们不该如此惊讶：一代人以来，共同信条一直是以利润作社会筛选机制。受看重的是效率、灵活性、股东价值、商业友好、创造财富、销量、影响力和报纸发行量；正义、公平、包容、相称原则与问责却被挤到边缘。</p>\n</blockquote>\n<p>高管无需问责成为正常现象，利润信条随后解释为什么；末尾再明确问责与公平不受重视。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The current collective doctrine shows a rigid moral code.</p>\n<p>作者认为当前集体信条体现严格僵硬的道德准则。</p>\n</blockquote>\n<p>D需要道德规范严到僵硬的表现。实际是相关规范失去约束力，不能将经济标准占主导读成道德标准约束过强。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>39题结论</h3>\n<blockquote>\n<p><strong>39. A</strong></p>\n</blockquote>\n<ul>\n<li>A：以利润作社会筛选机制，重视销量却边缘化公平、问责，表现出价值取舍的偏差。normal与collective又说明并非孤立个人。</li>\n<li>B：高管高薪和创造财富确实出现，但批评重点是高薪者不负责、逐利压过道德，未比较财富如何分给不同群体。</li>\n<li>C：被边缘化的是正义、公平、问责等价值，原文没有描述某一生活方式遭到排斥。C把评价对象改了。</li>\n<li>D：管理责任、公平等被挤到边缘，体现道德约束不足。D却将它说成道德准则过分严格，方向相反。</li>\n</ul>\n<h2>40题</h2>\n<blockquote>\n<p>Which of the following is suggested in the last paragraph?</p>\n<p>最后一段暗示下列哪一点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：从编辑目的、报道伤害与负责人不问不管三处，归纳作者认为编辑应承担什么责任。</p>\n<p>题干直接限定the last paragraph，即第六段。完整读这段，从报纸编辑工作的目的读到布鲁克斯是否怀疑以及她具体做了什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding , to be fair in what was written or to betray any common humanity.</p>\n<p>It was to ruin lives in the quest for circulation and impact</p>\n<p>Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers</p>\n</blockquote>\n<h3>A. The quality of writings is of primary importance.</h3>\n<blockquote>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p><code>quality of writings</code>涉及写出的内容，原文<code>to be fair in what was written</code>也评价写作，所以回看这句以及随后为了发行量毁掉人生的描述，检查作者是在评价什么。</p>\n<p>原文<code>to be fair in what was written</code>将公平列为编辑所忽视的要求，又用为了发行量和影响力毁掉人生指出伤害，批评的是办报目的没有顾及公平和他人。本项<code>quality of writings is of primary importance</code>把这份批评改成整体写作质量应当居于首要位置。公平地写、关心报道对人的影响属于具体的道德要求，并不等于对作品整体质量作首位排序；本项增加了评价对象及其优先程度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<p>编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。</p>\n</blockquote>\n<p>作者先列报纸没有追求的理解、公平、人性，再用ruin lives揭示只求销量的伤害，最后落到编辑不问不管。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quality of writings is of primary importance.</p>\n<p>末段暗示：写作质量具有首要重要性。</p>\n</blockquote>\n<p>A需要把作品质量与其他目标作排序。实际关切的是不应以伤害他人为代价追求销量，不能由fair in what was written推出质量具有最高优先性。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Moral awareness matters in editing a newspaper.</h3>\n<blockquote>\n<p>末段暗示：编辑报纸应重视道德意识。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>理解读者、公平对人和基本人性都被销量追求挤掉，编辑又不询问报道来源。B用道德意识重要概括这些职责与后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：编辑报纸应重视道德意识。</p>\n</blockquote>\n<p><code>Moral awareness</code>说的是能否意识到公平和对他人的责任，原文<code>to be fair</code>与<code>common humanity</code>正涉及这些方面，因此回看编辑目的的句子，再接上<code>ruin lives</code>这一后果。</p>\n<p>原文说这份报纸的编辑目的没有顾及<code>to be fair</code>和<code>common humanity</code>，反而为了发行量和影响力去<code>ruin lives</code>。作者以伤害人的后果批评这种做法。本项<code>Moral awareness matters</code>从这份批评推出编辑应当重视道德意识，承接的正是公平、共同人性与避免伤害他人的要求；它没有把报纸当前忽略道德的做法当成应有标准。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<p>编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。</p>\n</blockquote>\n<p>目的对比先说明逐利怎样伤害人，Brooks不问不作指示再说明编辑管理为何使这种问题持续。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Moral awareness matters in editing a newspaper.</p>\n<p>末段暗示：编辑报纸应重视道德意识。</p>\n</blockquote>\n<p>B既覆盖内容中的公平与人性，也涵盖负责人应当过问来源的责任，没有将某一项价值抬成唯一要求。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. Common humanity is central to news reporting.</h3>\n<blockquote>\n<p>末段暗示：共同人性在新闻报道中居于核心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时C尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>共同人性确实是作者重视的道德要求，因此C有依据；但它只取并列要求中的一项，B更能覆盖整段编辑目的与管理失责。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：共同人性在新闻报道中居于核心。</p>\n</blockquote>\n<p><code>common humanity</code>确实是段首明确列出的要求。作者批评报纸没有表现对他人的基本关怀，又说它为发行量毁坏人生，所以不能说C完全没有文本支持。</p>\n<p>但是，段首并列了增进读者理解、公平和人性，段末还写编辑不询问、不作指示。这些内容共同涉及编辑应如何判断报道目的、怎样承担管理责任，不仅是报道体现人性这一方面。</p>\n<p>C将其中一项概括为新闻报道的核心，B则以moral awareness覆盖这些具体道德要求与编辑失责。两项比较时，应说明B为何更完整，而不能凭空说C含有“只需要人性”或“排斥公平”的绝对意思。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<p>编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。</p>\n</blockquote>\n<p>增进理解、公平和共同人性并列，后面还有Brooks不问、不指示的职责问题；段落围绕编辑的道德意识展开。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Common humanity is central to news reporting.</p>\n<p>末段暗示：共同人性在新闻报道中居于核心。</p>\n</blockquote>\n<p>不能因central就说C必然排斥所有其他要求。它的问题是概括较窄：若把段落归结为人性居中心，尚难完整说明负责人为何必须追问来源；B的道德责任将两处接得更全。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Journalists need stricter industrial regulations.</h3>\n<blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p><code>stricter regulations</code>涉及规范的严格程度，末句<code>gave no instructions</code>说布鲁克斯有没有给记者指示，因此回看她有没有询问和指示，辨别原文写的是行为还是规章本身。</p>\n<p>原文对她是否怀疑保持不确定，却明确写她<code>asked no questions</code>、<code>gave no instructions</code>，说明她实际上没有询问和下指示。本项<code>stricter regulations</code>从这些行为推出规范需要比现有的更严格。个人不询问、不指示不能直接说明规章本身过于宽松，本项把不履行管理行为改成了规范应收紧的判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<p>编辑《世界新闻报》的目的不是增进读者理解、公平报道或表现基本人性，而是为追求发行量与影响力毁坏他人的生活。Brooks也许怀疑过记者获取报道的方式，也许没有；但她没有提问、没有作指示，也没有收到可追踪、有记录的回答。</p>\n</blockquote>\n<p>末句对她是否怀疑保持may or may not，却肯定其不问、不下指示、没有可追踪回答的实际表现。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Journalists need stricter industrial regulations.</p>\n<p>末段暗示：记者需要更严格的行业规章。</p>\n</blockquote>\n<p>D需要先说明规则存在宽松缺口再提出收紧。实际未评估规则条文的严宽，而是在写负责人没有做什么，不能把未履责自动改成加严规则的方案。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>40题结论</h3>\n<blockquote>\n<p><strong>40. B</strong></p>\n</blockquote>\n<ul>\n<li>A：末段批评办报不顾公平和他人生活，属于编辑的道德目的。A改成整体写作质量居于首位，扩大了评价内容并增加优先次序。</li>\n<li>B：理解读者、公平对人和基本人性都被销量追求挤掉，编辑又不询问报道来源。B用道德意识重要概括这些职责与后果。</li>\n<li>C：共同人性确实是作者重视的道德要求，因此C有依据；但它只取并列要求中的一项，B更能覆盖整段编辑目的与管理失责。</li>\n<li>D：没有询问、没有指示是管理者未履行责任，D要求行业规章变得更严格。行为失职不能直接证明现有规章不够严。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：伊丽莎白·默多克的批判</strong>（段落1-2核心观点） 诚信危机的根源：【集体接受&quot;分类机制&quot;只应是利润和市场 → 诚信崩溃】// 伊丽莎白的观点：（是人创造社会，不是利润）→ 道德缺失的危险：（政府、媒体、商业中缺乏道德目的 → 威胁资本主义和自由）→ 具体影响：新闻国际因道德缺失而迷失（电话窃听）</p>\n<p>↓（现实印证）</p>\n<p><strong>逻辑层次2：窃听丑闻的规模与审判结果</strong>（段落3事实陈述） 审判结果：（库尔森有罪 // 布鲁克斯无罪）→ 但诚信缺失问题仍存 → 窃听规模：【5500人被窃听 + 工业规模操作（马尔凯尔承认）+ 更多人等待审判】</p>\n<p>↓（深层分析）</p>\n<p><strong>逻辑层次3：道德缺失如何影响审判</strong>（段落4审判分析） 道德目的缺失框定了：（窃听事实 + 审判条件）→ 布鲁克斯的&quot;无知&quot;：【对新闻室情况知之甚少 + 很少想到要问 + 从不询问故事来源】→ 辩护核心：她什么都不知道</p>\n<p>↓（体制批判）</p>\n<p><strong>逻辑层次4：当代价值观的扭曲</strong>（段落5价值分析） 现状：高薪管理者不负责任已成常态 → 根源：一代人的集体教条（社会分类机制=利润）→ 价值词汇对比：【重要词汇：效率、灵活性、股东价值、财富创造、销售、影响力、发行量 // 边缘化词汇：正义、公平、宽容、适度、问责】</p>\n<p>↓（具体体现）</p>\n<p><strong>逻辑层次5：《世界新闻报》的堕落</strong>（段落6案例总结） 编辑目的：不是（促进理解 + 保持公平 + 体现人性）// 而是（为发行量和影响力毁掉他人生活）→ 布鲁克斯的管理：【可能有怀疑 // 但不问、不指示、不追踪】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：以利润为唯一&quot;分类机制&quot;的价值观导致了机构诚信的崩溃，这在新闻集团窃听丑闻中得到充分体现——管理者逃避责任成为常态，道德词汇被边缘化，新闻业失去了基本的人性和道德目的。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A defence built on a manager’s claimed ignorance</p>\n<p>B. The unanswered moral problem behind a criminal trial</p>\n<p>C. The values pushed aside by the pursuit of profit</p>\n<p>D. A warning about institutions without moral purpose</p>\n<p>E. The complete disappearance of newspaper readership</p>\n<p>F. Editorial duties lost in the pursuit of circulation</p>\n<p>G. A proven improvement in journalistic accountability</p>\n<p><strong>41.</strong></p>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;. Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market. But &quot;it&#39;s us, human beings, we the people who create the society we want, not profit.&quot; Driving her point home, she continued: &quot;It&#39;s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.&quot; This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n<p><strong>42.</strong></p>\n<p>As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands. Journalists are known to have hacked the phones of up to 5,500 people. This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking. Others await trial. This long story still unfolds.</p>\n<p><strong>43.</strong></p>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place. One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived. The core of her successful defence was that she knew nothing.</p>\n<p><strong>44.</strong></p>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run. Perhaps we should not be so surprised. For a generation, the collective doctrine has been that the sorting mechanism of society should be profit. The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation. Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n<p><strong>45.</strong></p>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity. It was to ruin lives in the quest for circulation and impact. Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】D. A warning about institutions without moral purpose</p>\n<blockquote>\n<p>对机构缺乏道德目标的警告</p>\n</blockquote>\n<p>先引述诚信不足与逐利机制的因果，再以窃听说明失去道德目标如何让企业迷失。</p>\n<blockquote>\n<p>Two years ago, Rupert Murdoch&#39;s daughter, Elisabeth, spoke of the &quot;unsettling dearth of integrity across so many of our institutions&quot;.</p>\n</blockquote>\n<p>unsettling dearth直接提出机构普遍缺少诚信，讨论的是道德品质而不是公司盈利规模。</p>\n<blockquote>\n<p>Integrity had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market.</p>\n</blockquote>\n<p>because of把诚信崩塌归因于利润和市场独占筛选机制：社会怎样衡量成功，会影响机构怎样行动。</p>\n<blockquote>\n<p>But &quot;it&#39;s us, human beings, we the people who create the society we want, not profit.&quot; Driving her point home, she continued: &quot;It&#39;s increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.&quot; This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.</p>\n</blockquote>\n<p>由人创造社会的主张，与企业因缺少道德目标而迷失的案例相接。窃听把抽象价值警告落实到具体机构行为。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>诚信不足 → 利润独尊挤掉道德判断 → 企业迷失及窃听案例</p>\n</blockquote>\n<p>warning概括unsettling与dangerous，without moral purpose贯通两段。</p>\n<p>再看最强干扰项E：The complete disappearance of newspaper readership。</p>\n<p>发行量并未在这里消失，批评的是机构价值取向。</p>\n<p><strong>41题选D。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】B. The unanswered moral problem behind a criminal trial</p>\n<blockquote>\n<p>刑事审判背后尚未解决的道德问题</p>\n</blockquote>\n<p>审判区分一人有罪与一人无罪，但完整问题仍在，窃听规模巨大且还有人待审。</p>\n<blockquote>\n<p>As the hacking trial concludes – finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge – the wider issue of dearth of integrity still stands.</p>\n</blockquote>\n<p>一人有罪、一人无罪只是个案裁决，句末still stands明确说更广泛的诚信问题仍未解决。</p>\n<blockquote>\n<p>This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.</p>\n</blockquote>\n<p>industrial scale与5500人把视野从两名主编扩大到系统性窃听，Mulcaire的承认又提供知情者根据。</p>\n<blockquote>\n<p>This long story still unfolds.</p>\n</blockquote>\n<p>still unfolds配合Others await trial表明事件和问题都未随当前审判结束。标题要保留法律个案之外尚存的道德问题。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>不同个案裁决 → 大规模窃听事实 → 后续审判与诚信问题仍在</p>\n</blockquote>\n<p>unanswered对应still stands和still unfolds；标题没有把未完案件写成全面结案。</p>\n<p>再看最强干扰项G：A proven improvement in journalistic accountability。</p>\n<p>待审与广泛侵害不构成问责已经改善的证明。</p>\n<p><strong>42题选B。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】A. A defence built on a manager’s claimed ignorance</p>\n<blockquote>\n<p>建立在管理者自称不知情之上的辩护</p>\n</blockquote>\n<p>作者惊讶于Brooks对编辑部知道得少、问得少，并明确“不知道”是成功辩护的核心。</p>\n<blockquote>\n<p>In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place.</p>\n</blockquote>\n<p>not only ... but也把道德目的缺失从窃听本身延伸到审判如何进行，标题要回应辩护中的问题。</p>\n<blockquote>\n<p>One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.</p>\n</blockquote>\n<p>little knew、little thought to ask、never inquired连续强调负责编辑部的人不知也不问，使职责与表现的反差加重。</p>\n<blockquote>\n<p>The core of her successful defence was that she knew nothing.</p>\n</blockquote>\n<p>knew nothing恰成为successful defence的核心；成功是结果，作者质疑的是以管理上的无知作辩护的依据。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>道德缺失延及审判 → 负责人不知不问 → 不知情反成成功辩护核心</p>\n</blockquote>\n<p>claimed ignorance对应she knew nothing，manager强调这种说法与其职责的张力。</p>\n<p>再看最强干扰项B：The unanswered moral problem behind a criminal trial。</p>\n<p>B概括上一部分案件与伦理问题，本段已聚焦个人辩护的理由。</p>\n<p><strong>43题选A。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】C. The values pushed aside by the pursuit of profit</p>\n<blockquote>\n<p>逐利所排挤的价值</p>\n</blockquote>\n<p>先指出高管不负责成为常态，再列社会重视和边缘化的两组价值。</p>\n<blockquote>\n<p>In today&#39;s world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.</p>\n</blockquote>\n<p>高薪高管不问责成为normal，先交代需要解释的广泛现象，而非单论Brooks个人性格。</p>\n<blockquote>\n<p>For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.</p>\n</blockquote>\n<p>利润作为sorting mechanism，说明为什么效率、销量等被高度重视；作者转向社会判断优劣的标准。</p>\n<blockquote>\n<p>Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.</p>\n</blockquote>\n<p>justice、fairness、accountability被挤到margin，与前一组经济标准形成对照，突出逐利排挤哪些价值。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>不问责成为常态 → 利润信条及经济标准居先 → 公平与责任等被边缘化</p>\n</blockquote>\n<p>pursuit of profit对应sorting mechanism，pushed aside对应degraded to the margin。</p>\n<p>再看最强干扰项G：A proven improvement in journalistic accountability。</p>\n<p>作者是在批评责任退位，而非证实问责改善。</p>\n<p><strong>44题选C。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】F. Editorial duties lost in the pursuit of circulation</p>\n<blockquote>\n<p>追求发行量中丢失的编辑职责</p>\n</blockquote>\n<p>将应有的理解、公平、人性与毁坏他人生活相对照，再写编辑既不问也不作指示。</p>\n<blockquote>\n<p>The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity.</p>\n</blockquote>\n<p>not to后面并列理解、公平、人性，交代报纸没有追求的道德目标。</p>\n<blockquote>\n<p>It was to ruin lives in the quest for circulation and impact.</p>\n</blockquote>\n<p>It was to以毁坏生活追求发行量作反面目的，表现逐利与对他人负责之间的冲突。</p>\n<blockquote>\n<p>Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions – nor received traceable, recorded answers.</p>\n</blockquote>\n<p>不知是否怀疑与明确不问、不作指示分开：作者能确认的是编辑未履行过问来源的责任，将目的失当落到管理行为。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>理解、公平、人性未获重视 → 为销量伤害他人 → 编辑不问不管使失责具体化</p>\n</blockquote>\n<p>duties对应编辑应做之事，pursuit of circulation对应实际动机。</p>\n<p>再看最强干扰项E：The complete disappearance of newspaper readership。</p>\n<p>批评的是以发行量伤人为目标，不是没有读者。</p>\n<p><strong>45题选F。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>When profit becomes the only measure of institutional success, integrity can lose its place in decision-making. Elisabeth Murdoch warned that institutions were accepting just such a sorting mechanism. Her criticism was not simply that businesses sometimes lose money, but that society was allowing the market to replace moral judgment.</p>\n<p><strong>B.</strong></p>\n<p>Those judgments have favoured efficiency, sales, shareholder value and circulation. Justice, fairness and accountability have received much less attention. The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.</p>\n<p><strong>C.</strong></p>\n<p>That hierarchy shaped the newspaper’s editorial purpose. Rather than helping readers understand events or treating people fairly, it pursued circulation and impact even at the cost of damaging lives. In this setting, the editor’s failure to ask questions became part of the moral problem rather than an adequate response to it.</p>\n<p><strong>D.</strong></p>\n<p>The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge. Yet those different verdicts did not settle the wider problem. Thousands of phones had been hacked, and further defendants still awaited trial, leaving the scale of the wrongdoing beyond dispute.</p>\n<p><strong>E.</strong></p>\n<p>The unresolved problem was visible not only in the hacking itself but also in the defence presented at trial. Rebekah Brooks relied on the claim that she knew nothing about how stories reached her newsroom. The striking feature was how little she had asked despite holding a position of responsibility.</p>\n<p><strong>F.</strong></p>\n<p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose. A newspaper may then mistake commercial success for a sufficient defence of its conduct. The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.</p>\n<p><strong>G.</strong></p>\n<p>Such a position normally carries an obligation to know what an organisation is doing. Nevertheless, highly paid executives have increasingly escaped responsibility for events within the institutions they run. This pattern calls for an examination of the values by which their performance has been judged.</p>\n<p><strong>H.</strong></p>\n<p>The moral problem therefore survives any single verdict about criminal guilt. Editing a newspaper requires judgment about how stories are obtained and what harm they may cause. A successful defence in court cannot by itself demonstrate that these responsibilities have been fulfilled.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出利润独尊导致道德判断失位</td>\n</tr>\n<tr>\n<td>B</td>\n<td>列出被看重及被边缘化的价值</td>\n</tr>\n<tr>\n<td>C</td>\n<td>说明逐利价值怎样改变编辑工作</td>\n</tr>\n<tr>\n<td>D</td>\n<td>区分个案裁决与尚存的广泛问题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>说明不知情辩护与管理职责的冲突</td>\n</tr>\n<tr>\n<td>F</td>\n<td>把价值警告引到电话窃听案例</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由个别编辑转入高管责任缺失</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结法律结案不等于道德责任解决</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出利润独尊导致道德判断失位 → 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题 → 说明不知情辩护与管理职责的冲突 → 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作 → 总结法律结案不等于道德责任解决</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Her criticism was not simply that businesses sometimes lose money, but that society was allowing the market to replace moral judgment.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose.</p>\n</blockquote>\n<p>A末句说市场取代道德判断，F的This replacement直接承接这种替代关系，进一步说明机构失去道德目的时的危险。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A newspaper may then mistake commercial success for a sufficient defence of its conduct. The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.</p>\n</blockquote>\n<p>F先以报纸把商业成功当行为辩护为例，再提出phone-hacking scandal，使价值警告落到一宗具体事件。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge.</p>\n</blockquote>\n<p>D的The scandal回指F末句电话窃听丑闻，接着交代审判中一人有罪、一人无罪的结果。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出利润独尊导致道德判断失位 → 把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Such a position normally carries an obligation to know what an organisation is doing.</p>\n</blockquote>\n<p>G的Such a position要求前文先有负责职位。A只谈社会市场标准，尚未写主编岗位；先接G会使position失去所指，也无法引出D的scandal。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The phone-hacking scandal offers a concrete example of how an institution can lose its way while pursuing its business objectives.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The scandal resulted in a trial that found one former editor guilty and another innocent of the same charge.</p>\n</blockquote>\n<p>F以phone-hacking scandal结尾，D的The scandal承接同一事件，写它带来的审判与两种判决。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Yet those different verdicts did not settle the wider problem. Thousands of phones had been hacked, and further defendants still awaited trial, leaving the scale of the wrongdoing beyond dispute.</p>\n</blockquote>\n<p>Yet说明不同裁决并未解决更广问题；数千电话被窃听和还有被告待审，把问题从个案结论拉回规模与延续。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The unresolved problem was visible not only in the hacking itself but also in the defence presented at trial.</p>\n</blockquote>\n<p>E的The unresolved problem接D的未解决问题，并将观察点从hacking itself转到审判中的defence。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把价值警告引到电话窃听案例 → 区分个案裁决与尚存的广泛问题 → 说明不知情辩护与管理职责的冲突</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Such a position normally carries an obligation to know what an organisation is doing.</p>\n</blockquote>\n<p>G谈职位所附义务，此时还没介绍Brooks以不知情辩护和其负责职位。它既不能紧接丑闻的判决，也不能为E的unresolved problem提供刚展开的层次。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The striking feature was how little she had asked despite holding a position of responsibility.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Such a position normally carries an obligation to know what an organisation is doing.</p>\n</blockquote>\n<p>E末句写holding a position of responsibility却很少询问，G的Such a position紧接这一负责职位，指出按常理应了解机构所做之事。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Nevertheless, highly paid executives have increasingly escaped responsibility for events within the institutions they run. This pattern calls for an examination of the values by which their performance has been judged.</p>\n</blockquote>\n<p>Nevertheless转向现实中高管逃避责任的现象，再由这一pattern提出应检查其表现究竟按哪些values判断。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Those judgments have favoured efficiency, sales, shareholder value and circulation.</p>\n</blockquote>\n<p>B的Those judgments承接G末句的performance has been judged，随后才列效率、销量等具体标准。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明不知情辩护与管理职责的冲突 → 由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>That hierarchy shaped the newspaper’s editorial purpose.</p>\n</blockquote>\n<p>C的That hierarchy要求前面先形成价值高低的排序；E仍在讲个别编辑不问，未建立这套hierarchy，不能跳过普遍问责与价值标准两层。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>This pattern calls for an examination of the values by which their performance has been judged.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Those judgments have favoured efficiency, sales, shareholder value and circulation.</p>\n</blockquote>\n<p>G要求检查评价高管表现的价值标准，B用Those judgments接住这一判断活动，开始列被偏爱的指标。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Justice, fairness and accountability have received much less attention. The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.</p>\n</blockquote>\n<p>效率、销量与公平、问责受到的不同待遇组成contrast，并说明这种失责反映更广泛的hierarchy of priorities。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That hierarchy shaped the newspaper’s editorial purpose.</p>\n</blockquote>\n<p>C的That hierarchy准确指B末句价值优先次序，再解释这种次序怎样塑造报纸编辑目的。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由个别编辑转入高管责任缺失 → 列出被看重及被边缘化的价值 → 说明逐利价值怎样改变编辑工作</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>This replacement becomes particularly dangerous when organisations lose any clear moral purpose.</p>\n</blockquote>\n<p>F的This replacement回到市场替代道德的一般警告，不具体列出价值次序。放此处不能完成G提出的标准检查，也缺少C所需的hierarchy。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>The contrast helps explain why declining responsibility cannot be treated merely as one editor’s unusual personal failing; it reflects a wider hierarchy of priorities.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That hierarchy shaped the newspaper’s editorial purpose.</p>\n</blockquote>\n<p>B末句已经形成hierarchy of priorities，C开头That hierarchy承接这套价值排序，将其作用落到编辑目的。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Rather than helping readers understand events or treating people fairly, it pursued circulation and impact even at the cost of damaging lives. In this setting, the editor’s failure to ask questions became part of the moral problem rather than an adequate response to it.</p>\n</blockquote>\n<p>报纸不增进理解、不公平待人，而为销量伤害生活；在这种背景下，编辑不询问也是道德问题的一部分，不是充分回应。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The moral problem therefore survives any single verdict about criminal guilt.</p>\n</blockquote>\n<p>H的The moral problem接C末句的moral problem，therefore再总结刑事有罪与否不能消除道德责任。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列出被看重及被边缘化的价值 → 说明逐利价
