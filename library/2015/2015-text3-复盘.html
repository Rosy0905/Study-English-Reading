ojects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第一段，研究项目普遍缺少数据分析。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“lack of data analysis”和原文“basic mistakes in data analysis”都谈数据分析问题，因为一个说完全缺少，一个说分析中存在基本错误，所以回看第一段第二句。\u003c/p>\n\u003cp>原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。存在错误与完全缺少不是同一状态，且原文对象是已发表研究结果，不是一般研究项目。\u003c/p>\n\u003cp>“mistakes in data analysis”的前提是数据分析已经存在，只是做得不够正确；“lack of data analysis”则是根本没有进行分析。两者不是普通程度差异，而是“做了但错”与“没有做”的状态差异。\u003c/p>\n\u003cp>D把分析质量问题改成分析是否存在的问题，并扩大了对象范围。\u003c/p>\n\u003cp>D还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003cp>第一句写《科学》新增一轮统计检查，第二句说其他期刊已有类似行动，再以数据错误和不可复现解释改革背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Many research projects lack data analysis altogether.\u003c/p>\n\u003cp>许多研究项目完全没有进行数据分析。\u003c/p>\n\u003c/blockquote>\n\u003cp>若缺的是分析本身，改革应先要求研究开展数据分析。实际要由统计学家检查已经存在的分析，补的是质量把关。\u003c/p>\n\u003c/section>"},{"se cts\u003cbr>研究项目普遍缺少数据分析\u003c/p>\n\u003c/blockquote>\n\u003cp>D还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"31题结论","level":2,"raw":"### 31题结论\n\n> **31. B. journals are strengthening their statistical checks**\n\nA：原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。\n\nB：原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。\n\nC：第一段写的是《科学》增加统计检查，其他期刊也有类似行动，并用widespread concern说明这股改革的背景。\n\nD：原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"31","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>31. B. journals are strengthening their statistical checks\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。\u003c/p>\n\u003cp>B：原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。\u003c/p>\n\u003cp>C：第一段写的是《科学》增加统计检查，其他期刊也有类似行动，并用widespread concern说明这股改革的背景。\u003c/p>\n\u003cp>D：原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"32题 · 题干、题型与核心出处","level":2,"raw":"## 32题\n\n> The phrase “flagged up” (Para. 2) is the closest in meaning to ______.  \n> 第二段短语“flagged up”的意思最接近哪一个词？\n\n### 题型\n\n词义题。题干要求判断“第二段短语“flagged up”的意思最接近哪一个词？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> \"Readers must have confidence in the conclusions published in our journal,\" writes McNutt in an editorial. Working with the American Statistical Association, the journal has appointed seven experts to a statistics board of reviewing editors (SBoRE). Manuscripts will be flagged up for additional scrutiny by the journal's internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers. The SBoRE panel will then find external statisticians to review these manuscripts.\n\n编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。","context":{"mode":"image","asset":"questions","focus":[250,753,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"32","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The phrase “flagged up” (Para. 2) is the closest in meaning to ______.\u003cbr>第二段短语“flagged up”的意思最接近哪一个词？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第二段短语“flagged up”的意思最接近哪一个词？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Readers must have confidence in the conclusions published in our journal,&quot; writes McNutt in an editorial. Working with the American Statistical Association, the journal has appointed seven experts to a statistics board of reviewing editors (SBoRE). Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers. The SBoRE panel will then find external statisticians to review these manuscripts.\u003c/p>\n\u003c/blockquote>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. found","level":3,"raw":"### A. found\n\n> 被发现\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\n\n若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\n\n**命题人借用的原文材料：**\n\n> Manuscripts will be flagged up for additional scrutiny by the journal's internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.","context":{"mode":"image","asset":"questions","focus":[250,848,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"A"},"focusId":"focus-q32-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>被发现\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. found","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第2段中的flagged up表示被发现。\n\nA里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\n\n原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\n\n“flagged up for additional...”中的“for”说明标记之后还有明确用途，也就是进入额外审查。稿件早已在编辑和评审者手中，不存在先“找到”它才处理的情形。“found”只表示从未知到被发现，不能带出筛选与后续行动。\n\n稿件本来已经提交，关键动作是作出标记，而不是第一次发现它。\n\n若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。","context":{"mode":"image","asset":"questions","focus":[250,848,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"q 写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The editors found previously missing manuscripts before arranging a review.\u003c/p>\n\u003cp>编辑在安排评审之前找到了此前遗失的稿件。\u003c/p>\n\u003c/blockquote>\n\u003cp>found要求先发现原来没找到的稿件；实际稿件已在评审流程里，需要识别的是哪些稿件应追加审查。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. found","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Science Joins Push to Screen Statistics in Papers  \n> 《科学》加入论文统计审查行动\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\n\nA实际说的是：\n\n> found  \n> 被发现\n\n若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\n\n从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,848,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>被发现\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被发现。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>“flagged up for additional...”中的“for”说明标记之后还有明确用途，也就是进入额外审查。稿件早已在编辑和评审者手中，不存在先“找到”它才处理的情形。“found”只表示从未知到被发现，不能带出筛选与后续行动。\u003c/p>\n\u003cp>稿件本来已经提交，关键动作是作出标记，而不是第一次发现它。\u003c/p>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The editors found previously missing manuscripts before arranging a review.\u003c/p>\n\u003cp>编辑在安排评审之前找到了此前遗失的稿件。\u003c/p>\n\u003c/blockquote>\n\u003cp>found要求先发现原来没找到的稿件；实际稿件已在评审流程里，需要识别的是哪些稿件应追加审查。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>found\u003cbr>被发现\u003c/p>\n\u003c/blockquote>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. revised","level":3,"raw":"### B. revised\n\n> 被修改\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\n\n从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\n\n**命题人借用的原文材料：**\n\n> Manuscripts will be flagged up for additional scrutiny by the journal's internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.","context":{"mode":"image","asset":"questions","focus":[250,933,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"B"},"focusId":"focus-q32-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-B-0\">\u003cblockquote>\n\u003cp>被修改\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\u003c/p>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. revised","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第2段中的flagged up表示被修改。\n\nB里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\n\n原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\n\n“revised”通常意味着文字、数据或结构已经被改写；原句中执行动作的人是编辑或评审者，他们只是把稿件列为需要更多检查的对象。实际修改即使后来可能发生，也不是“flagged up”此刻完成的动作。\n\n从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。","context":{"mode":"image","asset":"questions","focus":[250,933,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"B"},"focusId":"focus-q32-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-B-0\">\u003cblockquote>\n\u003cp>被修改\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\u003c/p>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被修改。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\u003c/p>\n\u003cp>“revised”通常意味着文字、数据或结构已经被改写；原句中执行动作的人是编辑或评审者，他们只是把稿件列为需要更多检查的对象。实际修改即使后来可能发生，也不是“flagged up”此刻完成的动作。\u003c/p>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. revised","level":4,"raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> Manuscripts will be flagged up for additional scrutiny by the journal's internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\n>\n> 编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\n\n把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The editors revised the manuscripts before sending them for further scrutiny.\n>\n> 编辑先修改稿件，再把它们送去进一步审查。\n\n若是修改，句子应交代内容已经更改。实际随后还要找统计学家评审，当前步骤没有报告改动稿件。","context":{"mode":"image","asset":"questions","focus":[250,933,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"32","option":"B"},"focusId":"focus-q32-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-B-0\">\u003cblockquote>\n\u003cp>被修改\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\u003c/p>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\ D"},"focusId":"focus-q32-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>被存储\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被存储。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003cp>“stored”关注的是保存位置或保管状态，通常不会决定某份稿件是否接受额外审查。原句列出三类可能处理它的人，重点在谁对被标出的稿件进行进一步检查，而不是谁把文件存入系统。\u003c/p>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The manuscripts were stored in an archive for future reference.\u003c/p>\n\u003cp>稿件被存入档案，以供将来参考。\u003c/p>\n\u003c/blockquote>\n\u003cp>保存应接档案、保管或调阅用途；实际用additional scrutiny和review继续推进到审核，重点不是留存。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. stored","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Science Joins Push to Screen Statistics in Papers  \n> 《科学》加入论文统计审查行动\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\n\nD实际说的是：\n\n> stored  \n> 被存储\n\n把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\n\n从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,1103,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"32","option":"D"},"focusId":"focus-q32-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>被存储\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被存储。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003cp>“stored”关注的是保存位置或保管状态，通常不会决定某份稿件是否接受额外审查。原句列出三类可能处理它的人，重点在谁对被标出的稿件进行进一步检查，而不是谁把文件存入系统。\u003c/p>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The manuscripts were stored in an archive for future reference.\u003c/p>\n\u003cp>稿件被存入档案，以供将来参考。\u003c/p>\n\u003c/blockquote>\n\u003cp>保存应接档案、保管或调阅用途；实际用additional scrutiny和review继续推进到审核，重点不是留存。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>stored\u003cbr>被存储\u003c/p>\n\u003c/blockquote>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"32题结论","level":2,"raw":"### 32题结论\n\n> **32. C. marked**\n\nA：原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\n\nB：原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。\n\nC：原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。\n\nD：原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。","context":{"mode":"image","asset":"questions","focus":[250,753,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"32","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>32. C. marked\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>B：原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。\u003c/p>\n\u003cp>C：原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。\u003c/p>\n\u003cp>D：原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"33题 · 题干、题型与核心出处","level":2,"raw":"## 33题\n\n> Giovanni Parmigiani believes that the establishment of the SBoRE may ______.  \n> 乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？\n\n### 题型\n\n人物观点细节题。题干要求判断“乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to \"play primarily an advisory role.\" He agreed to join because he \"found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\"\n\n他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。","context":{"mode":"image","asset":"questions","focus":[250,1263,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"33","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Giovanni Parmigiani believes that the establishment of the SBoRE may ______.\u003cbr>乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点细节题。题干要求判断“乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. pose a threat to all its peers","level":3,"raw":"### A. pose a threat to all its peers\n\n> 对所有同行构成威胁\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\n\n而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\n\n**命题人借用的原文材料：**\n\n> This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\"","context":{"mode":"image","asset":"questions","focus":[250,1443,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"A"},"focusId":"focus-q33-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>对所有同行构成威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. pose a threat to all its peers","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 帕尔米贾尼认为，统计评审编辑委员会的建立可能对所有同行构成威胁。\n\nA里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\n\n原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\n\n帕尔米贾尼预期影响会超出《科学》本身，扩散到可能模仿其做法的更多出版机构。这种影响是一个可供采用的范例。A的“pose a threat”则要求其他期刊感到利益、地位或生存受损，段中没有任何对抗或损害。\n\n而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。","context":{"mode":"image","asset":"questions","focus":[250,1443,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>对所有同行构成威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u0 pact没有把积极示范改成损害，更没有all。","context":{"mode":"image","asset":"questions","focus":[250,1443,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>对所有同行构成威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能对所有同行构成威胁。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\u003c/p>\n\u003cp>原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>帕尔米贾尼预期影响会超出《科学》本身，扩散到可能模仿其做法的更多出版机构。这种影响是一个可供采用的范例。A的“pose a threat”则要求其他期刊感到利益、地位或生存受损，段中没有任何对抗或损害。\u003c/p>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp> ass=\"revealPart\" id=\"focus-q33-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>pose a threat to all its peers\u003cbr>对所有同行构成威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. meet with strong opposition","level":3,"raw":"### B. meet with strong opposition\n\n> 遇到强烈反对\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\n\n**错误类型：第三类——无中生有。**\n\n原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\n\nB要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\n\n**命题人借用的原文材料：**\n\n> Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to \"play primarily an advisory role.\" He agreed to join because he \"found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\"","context":{"mode":"image","asset":"questions","focus":[250,1528,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"B"},"focusId":"focus-q33-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-B-0\">\u003cblockquote>\n\u003cp>遇到强烈反对\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\u003c/p>\n\u003cp>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. meet with strong opposition","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 帕尔米贾尼认为，统计评审编辑委员会的建立可能遇到强烈反对。\n\nB里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\n\n原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\n\n第四段直接写他“agreed to join”，并把成立委员会背后的想法评价为新颖、独特且可能有持久影响。一个人因为认可而加入，至少说明他本人不是强烈反对者；段中也没有列出其他反对力量。\n\nB要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。","context":{"mode":"image","asset":"questions","focus":[250,1528,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015 xpects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能遇到强烈反对。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\u003c/p>\n\u003cp>原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\u003c/p>\n\u003cp>第四段直接写他“agreed to join”，并把成立委员会背后的想法评价为新颖、独特且可能有持久影响。一个人因为认可而加入，至少说明他本人不是强烈反对者；段中也没有列出其他反对力量。\u003c/p>\n\u003cp>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new board is likely to face strong opposition from other journals.\u003c/p>\n\u003cp>新委员会很可能遭到其他期刊强烈反对。\u003c/p>\n\u003c/blockquote>\n\u003cp>强烈反对应有反对者及其理由。实际人物因认可而加入，又期待同行模仿；不能把他人尚未表态的空间写成已预见强烈反对。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>meet with strong opposition\u003cbr>遇到强烈反对\u003c/p>\n\u003c/blockquote>\n\u003cp>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. increase Science’s circulation","level":3,"raw":"### C. increase Science’s circulation\n\n> 增加《科学》的发行量\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。\n\n**错误类型：第三类——无中生有。**\n\n原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。影响渠道和商业数量不是一回事。\n\ncirculation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。\n\n**命题人借用的原文材料：**\n\n> This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\"","context":{"mode":"image","asset":"questions","focus":[250,1612,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":tru ter Science.\"\n>\n> 他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\n\n把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The new board may increase the circulation of Science.\n>\n> 新委员会可能提高《科学》的发行量。\n\n发行增长应继续写读者数量或销量。实际publications指影响首先体现在所发表研究中，后文转到同行做法，不谈商业规模。","context":{"mode":"image","asset":"questions","focus":[250,1612,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"33","option":"C"},"focusId":"focus-q33-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-C-0\">\u003cblockquote>\n\u003cp>增加《科学》的发行量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。影响渠道和商业数量不是一回事。\u003c/p>\n\u003cp>circulation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能增加《科学》的发行量。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。\u003c/p>\n\u003cp>原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版 \u003cp>D保留了“《科学》先做—其他期刊照着做”的方向，正好对应原文。\u003c/p>\n\u003cp>帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new board may set an example that other journals choose to follow.\u003c/p>\n\u003cp>新委员会可能为其他期刊树立它们愿意仿效的榜样。\u003c/p>\n\u003c/blockquote>\n\u003cp>set an example把“《科学》先这样做—其他机构可能照着做”压成一个关系，保留了may的预期语气，没有保证全部同行采用。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>set an example for other journals\u003cbr>为其他期刊树立榜样\u003c/p>\n\u003c/blockquote>\n\u003cp>帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"33题结论","level":2,"raw":"### 33题结论\n\n> **33. D. set an example for other journals**\n\nA：原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\n\nB：原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。\n\nC：原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。\n\nD：原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。","context":{"mode":"image","asset":"questions","focus":[250,1263,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"33","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>33. D. set an example for other journals\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>B：原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。\u003c/p>\n\u003cp>C：原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。\u003c/p>\n\u003cp>D：原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"34题 · 题干、题型与核心出处","level":2,"raw":"## 34题\n\n> David Vaux holds that what Science is doing now ______.  \n> 戴维·沃克斯认为，《科学》现在的做法怎么样？\n\n### 题型\n\n人物观点细节题。题干要求判断“戴维·沃克斯认为，《科学》现在的做法怎么样？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors who can verify the process\". Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the papers that need scrutiny' in the first place\".\n\n沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。","context":{"mode":"image","asset":"questions","focus":[250,1859,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"34","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>David Vaux holds that what Science is doing now ______.\u003cbr>戴维·沃克斯认为，《科学》现在的做法怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点细节题。题干要求判断“戴维·沃克斯认为，《科学》现在的做法怎么样？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. adds to researchers’ workload","level":3,"raw":"### A. adds to researchers’ workload\n\n> 增加研究人员的工作量\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\n\n**错误类型：第三类——无中生有。**\n\n原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\n\n题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\n\n**命题人借用的原文材料：**\n\n> Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors who can verify the process\". Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the papers that need scrutiny' in the first place\".","context":{"mode":"image","asset":"questions","focus":[250,1953,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"A"},"focusId":"focus-q34-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>增加研究人员的工作量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\u003c/p>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. adds to researchers’ workload","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 沃克斯认为，《科学》现在的做法增加研究人员的工作量。\n\nA里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\n\n原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\n\n沃克斯先要求研究人员提高标准，又要求期刊采取更强硬做法，这是责任分配：作者和期刊都需要改进。它不等于他抱怨新方案增加研究人员工作量；提高标准可能需要更多努力，但原文没有把负担本身作为评价对象。\n\nA把规范要求改成了工作负担判断，也没有对到他随后对方案优缺点的评价。\n\n题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。","context":{"mode":"image","asset":"questions","focus":[250,1953,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"34","option":"A"},"focusId":"focus-q34-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>增加研究人员的工作量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\u003c/p>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003c w how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法增加研究人员的工作量。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\u003c/p>\n\u003cp>原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\u003c/p>\n\u003cp>沃克斯先要求研究人员提高标准，又要求期刊采取更强硬做法，这是责任分配：作者和期刊都需要改进。它不等于他抱怨新方案增加研究人员工作量；提高标准可能需要更多努力，但原文没有把负担本身作为评价对象。\u003c/p>\n\u003cp>A把规范要求改成了工作负担判断，也没有对到他随后对方案优缺点的评价。\u003c/p>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The extra checks mainly add to researchers’ workload.\u003c/p>\n\u003cp>额外检查主要增加了研究者的工作量。\u003c/p>\n\u003c/blockquote>\n\u003cp>增加负担应接研究者多做多少工作或因此受到的压力。实际评价落在谁识别需审稿件、评审者是否懂统计，讨论的是把关能力。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>adds to researchers’ workload\u003cbr>增加研究人员的工作量\u003c/p>\n\u003c/blockquote>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. diminishes the role of reviewers","level":3,"raw":"### B. diminishes the role of reviewers\n\n> 削弱评审者的作用\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\n\n后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\n\n**命题人借用的原文材料：**\n\n> Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors who can verify the process\".","context":{"mode":"image","asset":"questions","focus":[250,2038,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"B"},"focusId":"focus-q34-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. diminishes the role of reviewers","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 沃克斯认为，《科学》现在的做法削弱评审者的作用。\n\nB里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\n\n原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\n\n“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。\n\n后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。","context":{"mode":"image","asset":"questions","focus":[250,2038,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法削弱评审者的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. diminishes the role of reviewers","level":4,"raw":"#### 写作视角法\n\n原文第6段是这样写的：\n\n> Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors who can verify the process\".\n>\n> 沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\n\n把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The new system reduces the role played by reviewers.\n>\n> 新制度降低了评审者发挥的作用。\n\n削弱评审者应接减少其参与或权力。实际要求engaging reviewers，并批评筛选过于依赖现有委员会，评审环节仍很关键。","context":{"mode":"image","asset":"questions","focus":[250,2038,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法削弱评审者的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new system reduces the role played by reviewers.\u003c/p>\n\u003cp>新制度降低了评审者发挥的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>削弱评审者应接减少其参与或权力。实际要求engaging reviewers，并批评筛选过于依赖现有委员会，评审环节仍很关键。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. diminishes the role of reviewers","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Science Joins Push to Screen Statistics in Papers  \n> 《科学》加入论文统计审查行动\n\n把这个主旨直接代入34题题干：\n\n> 文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\n\nB实际说的是：\n\n> diminishes the role of reviewers  \n> 削弱评审者的作用\n\n后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\n\n从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,2038,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法削弱评审者的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new system reduces the role played by reviewers.\u003c/p>\n\u003cp>新制度降低了评审者发挥的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>削弱评审者应接减少其参与或权力。实际要求engaging reviewers，并批评筛选过于依赖现有委员会，评审环节仍很关键。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>diminishes the role of reviewers\u003cbr>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. has room for further improvement","level":3,"raw":"### C. has room for further improvement\n\n> 仍有进一步改进的空间\n\n**做题模式中的状态：** 第一轮C保留。当时选项呈现为“has room for further [xxx]”，保留了相应遮挡。当时的定位线索是：C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\n\n**选项类型：正确同义改写。**\n\n原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\n\n具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\n\n**正确选项的原文依据：**\n\n> Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the papers that need scrutiny' in the first place\".","context":{"mode":"image","asset":"questions","focus":[250,2123,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"C"},"focusId":"focus-q34-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-C-0\">\u003cblockquote>\n\u003cp>仍有进一步改进的空间\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“has room for further [xxx]”，保留了相应遮挡。当时的定位线索是：C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\u003c/p>\n\u003cp>具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. has room for further improvement","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 沃克斯认为，《科学》现在的做法仍有进一步改进的空间。\n\nC里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\n\n原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\n\n这样的评价既不是全盘肯定，也不是否定，而是认为方向可行、机制还需要补足。“has room for further...”恰好能容纳这种两面判断。\n\nC同时容纳了merit和weakness，没有把方案说成毫无价值或注定失败。\n\n具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。","context":{"mode":"image","asset":"questions","focus":[250,2123,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text ，《科学》现在的做法仍有进一步改进的空间。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\u003c/p>\n\u003cp>这样的评价既不是全盘肯定，也不是否定，而是认为方向可行、机制还需要补足。“has room for further...”恰好能容纳这种两面判断。\u003c/p>\n\u003cp>C同时容纳了merit和weakness，没有把方案说成毫无价值或注定失败。\u003c/p>\n\u003cp>具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The proposal has merit but still leaves room for improvement.\u003c/p>\n\u003cp>这一方案有价值，但仍存在改进空间。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设保留价值与不足两面，正好对应merit和weakness；改进对象是第一步筛选，不能把承认弱点改成取消整个方案。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. has room for further improvement","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Science Joins Push to Screen Statistics in Papers  \n> 《科学》加入论文统计审查行动\n\n把这个主旨直接代入34题题干：\n\n> 文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\n\nC实际说的是：\n\n> has room for further improvement  \n> 仍有进一步改进的空间\n\n具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\n\n从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：C正确。**","context":{"mode":"image","asset": “has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\n\n一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\n\n**命题人借用的原文材料：**\n\n> Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the papers that need scrutiny' in the first place\".","context":{"mode":"image","asset":"questions","focus":[250,2209,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"D"},"focusId":"focus-q34-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-D-0\">\u003cblockquote>\n\u003cp>将在可预见的将来失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. is to fail in the foreseeable future","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 沃克斯认为，《科学》现在的做法将在可预见的将来失败。\n\nD里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\n\n原文“has some merit, but a weakness”是有限肯定加具体保留；D的
