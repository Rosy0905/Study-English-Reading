unced today. The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003c/blockquote>\n\u003cp>第一句写《科学》新增一轮统计检查，第二句说其他期刊已有类似行动，再以数据错误和不可复现解释改革背景。\u003c/p>\n\u003ch3>A. Science intends to simplify its peer-review process\u003c/h3>\n\u003cblockquote>\n\u003cp>《科学》打算简化同行评审流程\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“simplify its peer-review process”和原文“round of”都在写同行评审流程的变化，因为一个说简化，一个显示又增加一轮检查，所以回看第一段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。增加检查层与简化方向相反。\u003c/p>\n\u003cp>第一段还说这项政策是在广泛担忧之后采取，并跟随其他期刊的类似行动，这也说明目的在补强质量把关，而不是把评审做得更简单。A的核心动作与段首直接相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第一段，《科学》打算简化同行评审流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“simplify its peer-review process”和原文“round of”都在写同行评审流程的变化，因为一个说简化，一个显示又增加一轮检查，所以回看第一段第一句。\u003c/p>\n\u003cp>原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。增加检查层与简化方向相反。\u003c/p>\n\u003cp>“adding ... round”的句法很清楚：原有同行评审流程上又叠加一层检查。即使不知道两个修饰词，“adding”“round”和“checks”已经共同表明流程更严、更复杂。“simplify”则要求减少步骤、降低程序负担或缩短流程，文章没有这种方向。\u003c/p>\n\u003cp>第一段还说这项政策是在广泛担忧之后采取，并跟随其他期刊的类似行动，这也说明目的在补强质量把关，而不是把评审做得更简单。A的核心动作与段首直接相反。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.\u003c/p>\n\u003cp>第一句写《科学》新增一轮统计检查，第二句说其他期刊已有类似行动，再以数据错误和不可复现解释改革背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Science intends to remove a round of checks and simplify its peer-review process.\u003c/p>\n\u003cp>《科学》打算减少一轮检查，简化同行评审流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果是简化，新增检查后应接减少环节的说明；实际用adding引出额外把关，后文还建立委员会，程序方向相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨把本段放在期刊加强统计审查的行业行动中，题干应回答这项行动或其确切背景；主旨不能给出受责期刊的数量。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science intends to simplify its peer-review process\u003cbr>《科学》打算简化同行评审流程\u003c/p>\n\u003c/blockquote>\n\u003cp>第一段还说这项政策是在广泛担忧之后采取，并跟随其他期刊的类似行动，这也说明目的在补强质量把关，而不是把评审做得更简单。A的核心动作与段首直接相反。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. journals are strengthening their statistical checks\u003c/h3>\n\u003cblockquote>\n\u003cp>期刊正在加强统计检查\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“journals are [xxx] their statistical checks”，保留了相应遮挡。当时的定位线索是：B里的“their statistical checks”和原文“similar efforts from other journals”都把做法扩展到多个期刊，因为一个概括期刊检查加强，一个说明其他期刊也有类似行动，所以回看第一段第二句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。\u003c/p>\n\u003cp>这句话先写《科学》新增检查，接着写“similar efforts from other journals”，把行动从一家期刊扩展到多家期刊。B的主语“journals”用复数，恰好涵盖《科学》和其他期刊；宾语“their statistical checks”也与段内的数据分析错误相连。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第一段，期刊正在加强统计检查。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“their statistical checks”和原文“similar efforts from other journals”都把做法扩展到多个期刊，因为一个概括期刊检查加强，一个说明其他期刊也有类似行动，所以回看第一段第二句。\u003c/p>\n\u003cp>原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。\u003c/p>\n\u003cp>这句话先写《科学》新增检查，接着写“similar efforts from other journals”，把行动从一家期刊扩展到多家期刊。B的主语“journals”用复数，恰好涵盖《科学》和其他期刊；宾语“their statistical checks”也与段内的数据分析错误相连。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003cp>第一句写《科学》新增一轮统计检查，第二句说其他期刊已有类似行动，再以数据错误和不可复现解释改革背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Science is joining other journals in strengthening statistical checks.\u003c/p>\n\u003cp>《科学》正在与其他期刊一道加强统计检查。\u003c/p>\n\u003c/blockquote>\n\u003cp>这里所需的是多家期刊同向加强检查。首句的新增与次句的similar efforts共同构成这个推进，不需要把所有期刊写成同步行动。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨把本段放在期刊加强统计审查的行业行动中，题干应回答这项行动或其确切背景；主旨不能给出受责期刊的数量。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>journals are strengthening their statistical checks\u003cbr>期刊正在加强统计检查\u003c/p>\n\u003c/blockquote>\n\u003cp>这句话先写《科学》新增检查，接着写“similar efforts from other journals”，把行动从一家期刊扩展到多家期刊。B的主语“journals”用复数，恰好涵盖《科学》和其他期刊；宾语“their statistical checks”也与段内的数据分析错误相连。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. few journals are blamed for mistakes in data analysis\u003c/h3>\n\u003cblockquote>\n\u003cp>少数期刊因数据分析错误受到指责\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C里的“few journals are blamed”和原文“similar efforts from other journals”都牵涉其他期刊，因为一个判断被指责的数量，一个只说明有类似行动，所以回看第一段第二句。读完全文后，做题模式再经交叉验证排除C，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第一段写的是《科学》增加统计检查，其他期刊也有类似行动，并用widespread concern说明这股改革的背景。它没有统计哪些期刊因数据错误受到了责备。\u003c/p>\n\u003cp>推断题要求选项得到文本支持，并不是只要未被明确反驳就能成立。C的责任归属与数量都缺少依据，而B对期刊共同加强检查的概括能得到adding及similar efforts的正面支持。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第一段，少数期刊因数据分析错误受到指责。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“few journals are blamed”和原文“similar efforts from other journals”都牵涉其他期刊，因为一个判断被指责的数量，一个只说明有类似行动，所以回看第一段第二句。\u003c/p>\n\u003cp>第一段写的是《科学》增加统计检查，其他期刊也有类似行动，并用widespread concern说明这股改革的背景。它没有统计哪些期刊因数据错误受到了责备。\u003c/p>\n\u003cp>C同时增加了两个待证明的关系：一是期刊受到blame，二是受到责备的期刊只有few。广泛担忧不能直接译成大量期刊受责，反过来也不能据此推出受责的期刊很少；两者都超出句子实际提供的信息。\u003c/p>\n\u003cp>推断题要求选项得到文本支持，并不是只要未被明确反驳就能成立。C的责任归属与数量都缺少依据，而B对期刊共同加强检查的概括能得到adding及similar efforts的正面支持。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003cp>第一句写《科学》新增一轮统计检查，第二句说其他期刊已有类似行动，再以数据错误和不可复现解释改革背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Only a few journals have been blamed for errors in data analysis.\u003c/p>\n\u003cp>只有少数期刊因数据分析错误而受到责备。\u003c/p>\n\u003c/blockquote>\n\u003cp>这段假设必须让读者知道哪些期刊受到指责以及数量很少。实际作者写普遍担忧如何推动制度变化，没有给被责期刊作数量统计。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨把本段放在期刊加强统计审查的行业行动中，题干应回答这项行动或其确切背景；主旨不能给出受责期刊的数量。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>few journals are blamed for mistakes in data analysis\u003cbr>少数期刊因数据分析错误受到指责\u003c/p>\n\u003c/blockquote>\n\u003cp>推断题要求选项得到文本支持，并不是只要未被明确反驳就能成立。C的责任归属与数量都缺少依据，而B对期刊共同加强检查的概括能得到adding及similar efforts的正面支持。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. lack of data analysis is common in research projects\u003c/h3>\n\u003cblockquote>\n\u003cp>研究项目普遍缺少数据分析\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“lack of data analysis”和原文“basic mistakes in data analysis”都谈数据分析问题，因为一个说完全缺少，一个说分析中存在基本错误，所以回看第一段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。存在错误与完全缺少不是同一状态，且原文对象是已发表研究结果，不是一般研究项目。\u003c/p>\n\u003cp>D还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第一段，研究项目普遍缺少数据分析。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“lack of data analysis”和原文“basic mistakes in data analysis”都谈数据分析问题，因为一个说完全缺少，一个说分析中存在基本错误，所以回看第一段第二句。\u003c/p>\n\u003cp>原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。存在错误与完全缺少不是同一状态，且原文对象是已发表研究结果，不是一般研究项目。\u003c/p>\n\u003cp>“mistakes in data analysis”的前提是数据分析已经存在，只是做得不够正确；“lack of data analysis”则是根本没有进行分析。两者不是普通程度差异，而是“做了但错”与“没有做”的状态差异。\u003c/p>\n\u003cp>D把分析质量问题改成分析是否存在的问题，并扩大了对象范围。\u003c/p>\n\u003cp>D还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003cp>第一句写《科学》新增一轮统计检查，第二句说其他期刊已有类似行动，再以数据错误和不可复现解释改革背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Many research projects lack data analysis altogether.\u003c/p>\n\u003cp>许多研究项目完全没有进行数据分析。\u003c/p>\n\u003c/blockquote>\n\u003cp>若缺的是分析本身，改革应先要求研究开展数据分析。实际要由统计学家检查已经存在的分析，补的是质量把关。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨把本段放在期刊加强统计审查的行业行动中，题干应回答这项行动或其确切背景；主旨不能给出受责期刊的数量。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>lack of data analysis is common in research projects\u003cbr>研究项目普遍缺少数据分析\u003c/p>\n\u003c/blockquote>\n\u003cp>D还把“many published research findings”换成一般的“research projects”，从已经发表的研究结果扩大到项目全过程。即使错误很常见，也不能推出数据分析本身普遍缺席。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. B. journals are strengthening their statistical checks\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“round of”位于adding之后，说明流程里增加了一轮检查；A的“simplify its peer-review process”却说要简化流程。\u003c/p>\n\u003cp>B：原文“similar efforts from other journals”说明《科学》的做法并非孤例，其他期刊也在采取类似行动；B的“their statistical checks”概括的正是多个期刊加强统计把关。\u003c/p>\n\u003cp>C：第一段写的是《科学》增加统计检查，其他期刊也有类似行动，并用widespread concern说明这股改革的背景。\u003c/p>\n\u003cp>D：原文“basic mistakes in data analysis”表示已经做了分析但出现基本错误；D的“lack of data analysis”表示没有数据分析。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>The phrase “flagged up” (Para. 2) is the closest in meaning to ______.\u003cbr>第二段短语“flagged up”的意思最接近哪一个词？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第二段短语“flagged up”的意思最接近哪一个词？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Readers must have confidence in the conclusions published in our journal,&quot; writes McNutt in an editorial. Working with the American Statistical Association, the journal has appointed seven experts to a statistics board of reviewing editors (SBoRE). Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers. The SBoRE panel will then find external statisticians to review these manuscripts.\u003c/p>\n\u003c/blockquote>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003ch3>A. found\u003c/h3>\n\u003cblockquote>\n\u003cp>被发现\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被发现。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“found”和原文“flagged up”都是对稿件发生的动作，因为题目问这个短语在流程中的含义，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>“flagged up for additional...”中的“for”说明标记之后还有明确用途，也就是进入额外审查。稿件早已在编辑和评审者手中，不存在先“找到”它才处理的情形。“found”只表示从未知到被发现，不能带出筛选与后续行动。\u003c/p>\n\u003cp>稿件本来已经提交，关键动作是作出标记，而不是第一次发现它。\u003c/p>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The editors found previously missing manuscripts before arranging a review.\u003c/p>\n\u003cp>编辑在安排评审之前找到了此前遗失的稿件。\u003c/p>\n\u003c/blockquote>\n\u003cp>found要求先发现原来没找到的稿件；实际稿件已在评审流程里，需要识别的是哪些稿件应追加审查。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>found\u003cbr>被发现\u003c/p>\n\u003c/blockquote>\n\u003cp>若用found替换，句子会变成“稿件被发现以进行额外审查”，语义不自然，也丢失了编辑主动挑出需要重点查看稿件的动作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. revised\u003c/h3>\n\u003cblockquote>\n\u003cp>被修改\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\u003c/p>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被修改。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“revised”和原文“flagged up”都是编辑可能对稿件采取的动作，因为一个说修改稿件，一个说先标出稿件，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。流程阶段和动作内容都不同。\u003c/p>\n\u003cp>“revised”通常意味着文字、数据或结构已经被改写；原句中执行动作的人是编辑或评审者，他们只是把稿件列为需要更多检查的对象。实际修改即使后来可能发生，也不是“flagged up”此刻完成的动作。\u003c/p>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The editors revised the manuscripts before sending them for further scrutiny.\u003c/p>\n\u003cp>编辑先修改稿件，再把它们送去进一步审查。\u003c/p>\n\u003c/blockquote>\n\u003cp>若是修改，句子应交代内容已经更改。实际随后还要找统计学家评审，当前步骤没有报告改动稿件。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>revised\u003cbr>被修改\u003c/p>\n\u003c/blockquote>\n\u003cp>从时间顺序看，先标出，后审查，审查后才可能要求作者修改。B把后续可能发生的结果提前成了短语本义。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. marked\u003c/h3>\n\u003cblockquote>\n\u003cp>被标记\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C里的“marked”和原文“flagged up”都表示给稿件作出醒目标识，因为这种标识使稿件进入额外审查，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。动作、对象和流程位置相同。\u003c/p>\n\u003cp>C既没有提前写成修改，也没有弱化成单纯发现；它只概括当前一步的处理，所以与上下文最顺。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被标记。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“marked”和原文“flagged up”都表示给稿件作出醒目标识，因为这种标识使稿件进入额外审查，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。动作、对象和流程位置相同。\u003c/p>\n\u003cp>flag本身就有“做标记、竖旗提醒”的核心意思，“up”在这里让这种标记更醒目。\u003c/p>\n\u003cp>marked保留了flagged up的核心动作，没有提前写成修改或储存。\u003c/p>\n\u003cp>C既没有提前写成修改，也没有弱化成单纯发现；它只概括当前一步的处理，所以与上下文最顺。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The editors marked manuscripts that required additional statistical scrutiny.\u003c/p>\n\u003cp>编辑标出了需要额外统计审查的稿件。\u003c/p>\n\u003c/blockquote>\n\u003cp>标记能为下一步寻找统计学家提供对象；原句与假设都先识别需要重点复核的稿件，再进入进一步检查。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>marked\u003cbr>被标记\u003c/p>\n\u003c/blockquote>\n\u003cp>C既没有提前写成修改，也没有弱化成单纯发现；它只概括当前一步的处理，所以与上下文最顺。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. stored\u003c/h3>\n\u003cblockquote>\n\u003cp>被存储\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段中的flagged up表示被存储。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“stored”和原文“flagged up”都是对稿件的处理，因为一个说保存起来，一个说标出后送审，所以回看第二段第三句。\u003c/p>\n\u003cp>原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003cp>“stored”关注的是保存位置或保管状态，通常不会决定某份稿件是否接受额外审查。原句列出三类可能处理它的人，重点在谁对被标出的稿件进行进一步检查，而不是谁把文件存入系统。\u003c/p>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.\u003c/p>\n\u003cp>编辑或评审者先标出需要额外审查的稿件，统计委员会再找到外部统计学家复核。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The manuscripts were stored in an archive for future reference.\u003c/p>\n\u003cp>稿件被存入档案，以供将来参考。\u003c/p>\n\u003c/blockquote>\n\u003cp>保存应接档案、保管或调阅用途；实际用additional scrutiny和review继续推进到审核，重点不是留存。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认这里是加强统计审查的一个步骤，不能独立确定短语词义；具体动作须看for additional scrutiny与随后送审的流程。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>stored\u003cbr>被存储\u003c/p>\n\u003c/blockquote>\n\u003cp>把“flagged up”理解为存储，会让后面的“for additional...”失去逻辑连接：存储并不天然导向额外审查，标记才会。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>32题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>32. C. marked\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“flagged up”后面接额外审查，表示编辑把某些稿件挑出来并作标识；A的“found”只是发现某物，两者动作不同，后者不能体现被挑出进入后续审查。\u003c/p>\n\u003cp>B：原文“flagged up”发生在额外审查之前，是把稿件列出来；B的“revised”表示稿件内容已被修改。\u003c/p>\n\u003cp>C：原文“flagged up”把稿件从一般稿件中标出来，随后接受额外审查；C的“marked”正是作标记。\u003c/p>\n\u003cp>D：原文“flagged up”是识别并标记需要额外审查的稿件；D的“stored”只是把稿件保存起来，两者动作不同，后者不含筛选或送审方向。\u003c/p>\n\u003ch2>33题\u003c/h2>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani believes that the establishment of the SBoRE may ______.\u003cbr>乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点细节题。题干要求判断“乔瓦尼·帕尔米贾尼认为，统计评审编辑委员会的建立可能怎样？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003ch3>A. pose a threat to all its peers\u003c/h3>\n\u003cblockquote>\n\u003cp>对所有同行构成威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能对所有同行构成威胁。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“pose a threat”和原文“may want to model their approach after Science”都在说其他期刊会怎样回应，因为一个说受到威胁，一个说可能模仿，所以回看第四段最后一句。\u003c/p>\n\u003cp>原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>帕尔米贾尼预期影响会超出《科学》本身，扩散到可能模仿其做法的更多出版机构。这种影响是一个可供采用的范例。A的“pose a threat”则要求其他期刊感到利益、地位或生存受损，段中没有任何对抗或损害。\u003c/p>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new board may threaten every competing journal.\u003c/p>\n\u003cp>新委员会可能威胁每一家竞争期刊。\u003c/p>\n\u003c/blockquote>\n\u003cp>威胁同行应接竞争受损或对抗。实际接的是其他期刊可能借鉴，lasting impact没有把积极示范改成损害，更没有all。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>pose a threat to all its peers\u003cbr>对所有同行构成威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>而且A用了“all its peers”，把范围推到所有同行；原文只说“a larger group”可能愿意模仿，既不是全部，也不是被迫。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. meet with strong opposition\u003c/h3>\n\u003cblockquote>\n\u003cp>遇到强烈反对\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\u003c/p>\n\u003cp>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能遇到强烈反对。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“meet with strong opposition”和原文“agreed to join”都反映人们对委员会的态度，因为一个说强烈反对，一个写帕尔米贾尼同意加入，所以回看第四段第二句。\u003c/p>\n\u003cp>原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。帕尔米贾尼的态度与之相反。\u003c/p>\n\u003cp>第四段直接写他“agreed to join”，并把成立委员会背后的想法评价为新颖、独特且可能有持久影响。一个人因为认可而加入，至少说明他本人不是强烈反对者；段中也没有列出其他反对力量。\u003c/p>\n\u003cp>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new board is likely to face strong opposition from other journals.\u003c/p>\n\u003cp>新委员会很可能遭到其他期刊强烈反对。\u003c/p>\n\u003c/blockquote>\n\u003cp>强烈反对应有反对者及其理由。实际人物因认可而加入，又期待同行模仿；不能把他人尚未表态的空间写成已预见强烈反对。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>meet with strong opposition\u003cbr>遇到强烈反对\u003c/p>\n\u003c/blockquote>\n\u003cp>B要求现实或未来中出现“strong opposition”，但当前材料呈现的是积极参与和正面预期。不能把对新政策可能存在的一般争议补成强烈反对。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. increase Science’s circulation\u003c/h3>\n\u003cblockquote>\n\u003cp>增加《科学》的发行量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。影响渠道和商业数量不是一回事。\u003c/p>\n\u003cp>circulation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能增加《科学》的发行量。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“increase Science’s circulation”和原文“publications in Science itself”都提到《科学》的出版，因为一个说发行量增加，一个说影响通过出版物体现，所以回看第四段最后两句。\u003c/p>\n\u003cp>原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。影响渠道和商业数量不是一回事。\u003c/p>\n\u003cp>“publications in Science itself”只是说明影响首先会通过《科学》刊发的研究体现，“publishing places”也指其他出版场所。这里谈的是审查做法的影响路径，不是杂志卖出多少份、拥有多少读者或发行规模。\u003c/p>\n\u003cp>circulation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new board may increase the circulation of Science.\u003c/p>\n\u003cp>新委员会可能提高《科学》的发行量。\u003c/p>\n\u003c/blockquote>\n\u003cp>发行增长应继续写读者数量或销量。实际publications指影响首先体现在所发表研究中，后文转到同行做法，不谈商业规模。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>increase Science’s circulation\u003cbr>增加《科学》的发行量\u003c/p>\n\u003c/blockquote>\n\u003cp>circulation属于商业传播指标，原段没有订阅、销量、读者增长等任何支撑。C只因看见publication就换成发行量，名词相近但关系完全不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. set an example for other journals\u003c/h3>\n\u003cblockquote>\n\u003cp>为其他期刊树立榜样\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“set an [xxx] for other journals”，保留了相应遮挡。当时的定位线索是：D里的“other journals”和原文“may want to model their approach after Science”都指向其他出版机构的模仿，因为一个概括树立范例，一个直接写可能照着做，所以回看第四段最后一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。\u003c/p>\n\u003cp>帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>帕尔米贾尼认为，统计评审编辑委员会的建立可能为其他期刊树立榜样。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“other journals”和原文“may want to model their approach after Science”都指向其他出版机构的模仿，因为一个概括树立范例，一个直接写可能照着做，所以回看第四段最后一句。\u003c/p>\n\u003cp>原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。\u003c/p>\n\u003cp>“model their approach after Science”几乎把关系写明：其他出版机构以《科学》的做法为模板。D中间的名词虽不清楚，但“set an ... for other journals”仍然保留“先有一个做法—别人照着做”的结构。\u003c/p>\n\u003cp>D保留了“《科学》先做—其他期刊照着做”的方向，正好对应原文。\u003c/p>\n\u003cp>帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003cp>他先说明自己赞同成立委员会，再预计影响不止落在《科学》论文上，还会通过其他机构仿效而扩大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new board may set an example that other journals choose to follow.\u003c/p>\n\u003cp>新委员会可能为其他期刊树立它们愿意仿效的榜样。\u003c/p>\n\u003c/blockquote>\n\u003cp>set an example把“《科学》先这样做—其他机构可能照着做”压成一个关系，保留了may的预期语气，没有保证全部同行采用。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调《科学》加入审查改进，题干中的新委员会应放在改善评审的行动中；对外影响要由model their approach after Science具体确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>set an example for other journals\u003cbr>为其他期刊树立榜样\u003c/p>\n\u003c/blockquote>\n\u003cp>帕尔米贾尼还说影响不会局限于《科学》自己的论文，而希望进入更大的出版群体，这正说明示范效应是他期待的外溢结果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. D. set an example for other journals\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“may want to model their approach after Science”预期其他出版机构会仿照《科学》；A的“pose a threat”却把影响改成威胁。\u003c/p>\n\u003cp>B：原文“agreed to join”并称这一做法新颖、独特且可能有长远影响；B的“meet with strong opposition”却说会遭到强烈反对。\u003c/p>\n\u003cp>C：原文“publications in Science itself”说影响会通过《科学》发表的论文以及其他出版机构的模仿扩散；C的“increase Science’s circulation”却把影响改成期刊发行量上升。\u003c/p>\n\u003cp>D：原文“may want to model their approach after Science”明确说更多出版机构可能模仿《科学》；D的“other journals”把受影响者概括为其他期刊，两者对象与动作能够对上。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>David Vaux holds that what Science is doing now ______.\u003cbr>戴维·沃克斯认为，《科学》现在的做法怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点细节题。题干要求判断“戴维·沃克斯认为，《科学》现在的做法怎么样？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003ch3>A. adds to researchers’ workload\u003c/h3>\n\u003cblockquote>\n\u003cp>增加研究人员的工作量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\u003c/p>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法增加研究人员的工作量。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“adds to researchers’ workload”和原文“Researchers should improve their standards”都涉及研究人员要做什么，因为一个判断工作量增加，一个要求提高标准，所以回看第六段前两句。\u003c/p>\n\u003cp>原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。原文没有比较工作量。\u003c/p>\n\u003cp>沃克斯先要求研究人员提高标准，又要求期刊采取更强硬做法，这是责任分配：作者和期刊都需要改进。它不等于他抱怨新方案增加研究人员工作量；提高标准可能需要更多努力，但原文没有把负担本身作为评价对象。\u003c/p>\n\u003cp>A把规范要求改成了工作负担判断，也没有对到他随后对方案优缺点的评价。\u003c/p>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The extra checks mainly add to researchers’ workload.\u003c/p>\n\u003cp>额外检查主要增加了研究者的工作量。\u003c/p>\n\u003c/blockquote>\n\u003cp>增加负担应接研究者多做多少工作或因此受到的压力。实际评价落在谁识别需审稿件、评审者是否懂统计，讨论的是把关能力。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>adds to researchers’ workload\u003cbr>增加研究人员的工作量\u003c/p>\n\u003c/blockquote>\n\u003cp>题干问“what Science is doing now”，真正评价出现在后面“has some merit, but a weakness...”。A抓了前面的普遍要求，却没有对准他对《科学》当前方案的具体判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. diminishes the role of reviewers\u003c/h3>\n\u003cblockquote>\n\u003cp>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法削弱评审者的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“diminishes the role of reviewers”和原文“engaging reviewers”都写评审者的作用，因为一个说削弱，一个要求聘用懂统计的评审者，所以回看第六段第二句。\u003c/p>\n\u003cp>原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>“engaging reviewers who are statistically...”意味着期刊要找到更有能力的评审者，并让他们参与把关；这会提高评审环节的重要性。B的“diminishes”则表示减少权力、作用或参与，两者方向正相反。\u003c/p>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new system reduces the role played by reviewers.\u003c/p>\n\u003cp>新制度降低了评审者发挥的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>削弱评审者应接减少其参与或权力。实际要求engaging reviewers，并批评筛选过于依赖现有委员会，评审环节仍很关键。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>diminishes the role of reviewers\u003cbr>削弱评审者的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>后面指出的弱点也是评审委员会能否先识别需要审查的论文，说明评审者仍处于关键入口，而不是被边缘化。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. has room for further improvement\u003c/h3>\n\u003cblockquote>\n\u003cp>仍有进一步改进的空间\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“has room for further [xxx]”，保留了相应遮挡。当时的定位线索是：C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\u003c/p>\n\u003cp>具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法仍有进一步改进的空间。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“has room for further”和原文“has some merit, but a weakness”都在作有保留的评价，因为一个说还能继续完善，一个明确承认优点后指出弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\u003c/p>\n\u003cp>这样的评价既不是全盘肯定，也不是否定，而是认为方向可行、机制还需要补足。“has room for further...”恰好能容纳这种两面判断。\u003c/p>\n\u003cp>C同时容纳了merit和weakness，没有把方案说成毫无价值或注定失败。\u003c/p>\n\u003cp>具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The proposal has merit but still leaves room for improvement.\u003c/p>\n\u003cp>这一方案有价值，但仍存在改进空间。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设保留价值与不足两面，正好对应merit和weakness；改进对象是第一步筛选，不能把承认弱点改成取消整个方案。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>has room for further improvement\u003cbr>仍有进一步改进的空间\u003c/p>\n\u003c/blockquote>\n\u003cp>具体而言，统计学家只能复核被送来的论文，谁先识别哪些论文需要复核仍是薄弱点；只要这个入口可以改进，就说明方案还有继续完善的空间。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. is to fail in the foreseeable future\u003c/h3>\n\u003cblockquote>\n\u003cp>将在可预见的将来失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法将在可预见的将来失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n\u003cp>“fail in the foreseeable future”包含两个很强的判断：结局是失败，并且发生在可预见时间内。沃克斯只指出一个机制弱点，同时明确承认“some merit”，没有预测最终失败，也没有给出时间。\u003c/p>\n\u003cp>一个可改进的弱点不等于注定失败，原文还明确承认方案有价值。\u003c/p>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The proposal will fail in the foreseeable future despite its limited merits.\u003c/p>\n\u003cp>尽管有有限的价值，这一方案仍会在可预见的未来失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>必败路线需要把弱点论证为不可修复，并给出未来判断。实际停在具体缺口，没有跨到结局和时间预言。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is to fail in the foreseeable future\u003cbr>将在可预见的将来失败\u003c/p>\n\u003c/blockquote>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>34题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>34. C. has room for further improvement\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。\u003c/p>\n\u003cp>B：原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>C：原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\u003c/p>\n\u003cp>D：原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：《科学》杂志的新政策\u003c/strong>（段落1核心事件） 《科学》增加额外统计检查 → 紧随其他期刊类似努力 → 背景：广泛担忧数据分析错误导致研究不可重现\u003c/p>\n\u003cp>↓（具体实施方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：SBoRE的建立与运作机制\u003c/strong>（段落2-3具体措施） 建立机制：【与美国统计协会合作 → 任命7位专家组成SBoRE】→ 运作流程：（内部编辑/审稿委员会/外部评审标记手稿 → SBoRE寻找外部统计学家审查）→ 动机说明：广泛担忧统计应用问题 + 提高研究可重现性\u003c/p>\n\u003cp>↓（各方评价）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：专家对新政策的积极评价\u003c/strong>（段落4-5支持声音） Parmigiani（SBoRE成员）：【期望发挥咨询作用 + 认为有新颖性和持久影响 → 希望其他出版机构效仿】+ Ioannidis（方法论专家）：【&quot;最受欢迎的进步&quot;+&quot;早该如此&quot; → 指出多数期刊统计审查薄弱 → 认为统计审查比专家审查更重要】// 但承认某些生物医学期刊已重视统计审查\u003c/p>\n\u003cp>↓（潜在问题）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：现状与改进空间\u003c/strong>（段落6批判性分析） 现状问题：（科学家应懂数据分析 // 但统计错误惊人地常见）→ 双重责任：（研究人员应提高标准 + 期刊应采取强硬立场）→ 对《科学》做法的评价：【有价值 // 但存在弱点：依赖编辑识别需要审查的论文】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点\u003cstrong>：\u003c/strong>《科学》杂志通过建立统计审查委员会来加强同行评审，这一举措虽然获得专家认可并可能产生示范效应，但仍存在依赖编辑判断的局限性，反映了科学出版界对提高研究质量和可重现性的共同努力。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. The Weakness Before the Expert Review Begins\u003c/p>\n\u003cp>B. A Campaign to Punish a Few Authors\u003c/p>\n\u003cp>C. An Example That May Travel Across Journals\u003c/p>\n\u003cp>D. An Additional Gate for Published Evidence\u003c/p>\n\u003cp>E. Making Every Editor a Full-time Statistician\u003c/p>\n\u003cp>F. Specialists Need a Clear Route to the Manuscript\u003c/p>\n\u003cp>G. A Shared Problem Rather Than a Single Scandal\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A journal can publish an impressive result without being certain that the calculations behind it deserve the same confidence. Adding a statistical check to peer review responds to that gap. The new check does not replace scientific judgement about the importance of a question; it asks whether the numerical evidence can support the answer offered. Publication therefore gains another gate, aimed at the reliability of the reasoning that connects observations with conclusions.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>A gate is useful only if manuscripts reach the people qualified to examine them. Editors and reviewers may first identify papers that need closer attention. A specialist board can then locate outside statisticians with suitable expertise. This division of work keeps the identification of a problem distinct from its detailed examination. It also makes clear that forming a board is only one part of a process involving several groups of people.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>It is tempting to describe a new policy as the response to one embarrassing article. Yet weaknesses in statistical practice can extend across subjects and institutions. A journal may change its rules because accumulated concerns have become difficult to ignore, rather than because a single paper has suddenly altered everything. The central question is whether published research can be reproduced. A lasting response must address that recurring problem instead of merely finding a convenient individual to blame.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Other publishers do not need to copy every detail of a new board to learn from it. They can borrow the principle that statistical expertise should enter the review process before publication. If the experiment works, its influence may spread through imitation rather than formal orders. Such an effect would reach beyond the articles printed in one journal. The initiative would become an example of how a shared concern can produce changes throughout an industry.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>Even a well-qualified statistician cannot review a paper that is never referred to the board. The initial decision about which manuscripts require scrutiny therefore matters greatly. If editors fail to recognise a statistical weakness, the extra gate may remain closed to precisely the papers that need it. This does not make the reform worthless. It identifies where further improvement is needed: the screening decision that occurs before specialist examination can do any good.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. An Additional Gate for Published Evidence / 为发表证据增设关口\u003c/strong>\u003c/p>\n\u003cp>提出新检查所填补的证据可靠性缺口，并区分统计把关与研究价值判断。\u003c/p>\n\u003cblockquote>\n\u003cp>A journal can publish an impressive result without being certain that the calculations behind it deserve the same confidence.\u003c/p>\n\u003cp>Publication therefore gains another gate, aimed at the reliability of the reasoning that connects observations with conclusions.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出新检查所填补的证据可靠性缺口 → 并区分统计把关与研究价值判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>Additional Gate对应“给同行评审增加统计检查”，Published Evidence对应从观察到结论的数值证据；一个写新增机制，一个写机制把关的对象。\u003c/p>\n\u003cp>最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但段落说增加一种专业把关，没有要求所有编辑转行；中心是新增检查的功能。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Specialists Need a Clear Route to the Manuscript / 专家需要明确的送审路径\u003c/strong>\u003c/p>\n\u003cp>说明稿件识别、委员会协调和外部统计复核的分工。\u003c/p>\n\u003cblockquote>\n\u003cp>A gate is useful only if manuscripts reach the people qualified to examine them.\u003c/p>\n\u003cp>It also makes clear that forming a board is only one part of a process involving several groups of people.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明稿件识别、委员会协调和外部统计复核的分工。\u003c/p>\n\u003c/blockquote>\n\u003cp>Specialists对应外部统计学家，Clear Route对应编辑识别、委员会协调、专家复核的送审链；标题抓住人如何接到稿件，而非只说成立委员会。\u003c/p>\n\u003cp>最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但分工恰好避免每位编辑包办专业分析；出现编辑不等于把统计全部交给编辑。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. A Shared Problem Rather Than a Single Scandal / 共同问题而非单一丑闻\u003c/strong>\u003c/p>\n\u003cp>从个别丑闻转向研究可重现性的普遍问题，说明政策动因。\u003c/p>\n\u003cblockquote>\n\u003cp>It is tempting to describe a new policy as the response to one embarrassing article.\u003c/p>\n\u003cp>A lasting response must address that recurring problem instead of merely finding a convenient individual to blame.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从个别丑闻转向研究可重现性的普遍问题 → 说明政策动因。\u003c/p>\n\u003c/blockquote>\n\u003cp>Shared Problem对应跨学科、跨机构的统计实践弱点，Rather Than a Single Scandal对应不是只由一篇难堪论文触发；标题保留了普遍与个别的范围对照。\u003c/p>\n\u003cp>最强干扰项B（A Campaign to Punish a Few Authors）容易因相同话题进入考虑。但结尾明确拒绝只找个人负责；责任追究不是这一段组织材料的目标。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：C. An Example That May Travel Across Journals / 可能推广到其他期刊的示范\u003c/strong>\u003c/p>\n\u003cp>将影响范围从一家期刊扩大到其他出版机构的仿效。\u003c/p>\n\u003cblockquote>\n\u003cp>Other publishers do not need to copy every detail of a new board to learn from it.\u003c/p>\n\u003cp>The initiative would become an example of how a shared concern can produce changes throughout an industry.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将影响范围从一家期刊扩大到其他出版机构的仿效。\u003c/p>\n\u003c/blockquote>\n\u003cp>Example对应先行期刊提供的做法，Travel Across Journals对应其他出版者借鉴原则并扩大影响；may保留预期，没有保证所有期刊照搬。\u003c/p>\n\u003cp>最强干扰项D（An Additional Gate for Published Evidence）容易因相同话题进入考虑。但新增关口只是被仿效的内容，本段重点在影响如何向外传播。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. The Weakness Before the Expert Review Begins / 专家复核开始之前的弱点\u003c/strong>\u003c/p>\n\u003cp>先肯定改革，再锁定送审前识别稿件这一薄弱环节。\u003c/p>\n\u003cblockquote>\n\u003cp>Even a well-qualified statistician cannot review a paper that is never referred to the board.\u003c/p>\n\u003cp>It identifies where further improvement is needed: the screening decision that occurs before specialist examination can do any good.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>先肯定改革 → 再锁定送审前识别稿件这一薄弱环节。\u003c/p>\n\u003c/blockquote>\n\u003cp>Weakness对应编辑可能未能识别需要复核的论文，Before the Expert Review Begins对应稿件送达专家之前的筛选位置。\u003c/p>\n\u003cp>最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但需要改进筛选判断不等于把全体编辑培养为全职统计学家。\u003c/p>\n\u003cp>\u003cstrong>45题选A。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>An extra statistical review may look like a small addition to a journal’s existing procedures. Its purpose, however, is substantial: to increase confidence in the evidence supporting published conclusions. To understand the proposal, it helps to begin with the problem that makes such an addition necessary.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>The problem is not simply that researchers sometimes choose uninteresting questions. Even an important question can produce an unreliable answer if the analysis of its data is weak. Repeated concerns about results that cannot be reproduced give journals a reason to inspect this part of scientific reasoning more closely.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Editors’ ability can be supported by clearer referral criteria and closer discussion with specialists. Neither measure guarantees that every error will be discovered. Both, however, strengthen the point at which a paper enters the additional review. Improvement here can preserve the benefits of the proposal while addressing its most obvious limitation.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Closer inspection requires more than a general request to be careful. A journal can establish a specialist board and ask ordinary editors to identify manuscripts needing extra attention. The board can then find outside statisticians. This arrangement separates the initial selection from the detailed examination that follows.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>That initial selection is a crucial link. When a paper reaches a statistician, a hidden error may become visible; when it is never referred, the specialist has no opportunity to help. The arrangement therefore raises a practical question about editors’ ability to recognise the need for additional scrutiny.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Those benefits need not remain within the journal that first adopts the arrangement. Other publishers may observe the process, adapt the referral criteria and recruit their own statistical advisers. Influence would then spread through imitation. A local change could become part of a broader effort to improve review standards.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>A broader effort still leaves researchers with responsibilities of their own. An additional gate at a journal cannot substitute for careful analysis in the laboratory. Reviewers, editors and authors contribute at different stages, and none can reasonably treat another group’s participation as permission to stop checking its own work.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>These different stages explain both the promise and the limits of statistical review. The reform is worth supporting because it adds expertise where mistakes matter. Its success nevertheless depends on effective referral and sound research practices. Confidence grows through several connected safeguards, rather than through the mere existence of a new board.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出统计复核及其待解释的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>回答问题是分析质量与可重现性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>给出支持筛选判断的改进方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>将检查要求落实为两阶段送审安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>追问最初筛选能力这一弱点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由内部收益转向同行仿效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>补充研究者责任，说明审查不替代研究质量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以多环节共同保障收束评价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出统计复核及其待解释的问题 → 回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排 → 追问最初筛选能力这一弱点 → 给出支持筛选判断的改进方向 → 由内部收益转向同行仿效 → 补充研究者责任，说明审查不替代研究质量 → 以多环节共同保障收束评价\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → D → E → C → F → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、D、C、F、G。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → B → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand the proposal, it helps to begin with the problem that makes such an addition necessary.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The problem is not simply that researchers sometimes choose uninteresting questions.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Closer inspection requires more than a general request to be careful.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the problem\u003c/code>，B继续处理这一对象，完成“回答问题是分析质量与可重现性”。到本段末尾，讨论又落到\u003ccode>this part of scientific reasoning\u003c/code>，这正好为下一段“将检查要求落实为两阶段送审安排”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出统计复核及其待解释的问题 → 回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“将检查要求落实为两阶段送审安排”。它也属于同一论题，但若直接放在这里，就会跳过“回答问题是分析质量与可重现性”这一必要环节；其段首“Closer inspection requires more than a general request to be careful.”需要的前提与A当前收束的对象不一致，后续也接不出D所需的\u003ccode>this part of scientific reasoning\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是B → D → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Repeated concerns about results that cannot be reproduced give journals a reason to inspect this part of scientific reasoning more closely.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Closer inspection requires more than a general request to be careful.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That initial selection is a crucial link.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>this part of scientific reasoning\u003c/code>，D继续处理这一对象，完成“将检查要求落实为两阶段送审安排”。到本段末尾，讨论又落到\u003ccode>initial selection\u003c/code>，这正好为下一段“追问最初筛选能力这一弱点”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排 → 追问最初筛选能力这一弱点\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“回答问题是分析质量与可重现性”。它也属于同一论题，但若直接放在这里，就会跳过“将检查要求落实为两阶段送审安排”这一必要环节；其段首“The problem is not simply that researchers sometimes choose uninteresting questions.”需要的前提与B当前收束的对象不一致，后续也接不出E所需的\u003ccode>initial selection\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → C → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The arrangement therefore raises a practical question about editors’ ability to recognise the need for additional scrutiny.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Editors’ ability can be supported by clearer referral criteria and closer discussion with specialists.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those benefits need not remain within the journal that first adopts the arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>editors’ ability\u003c/code>，C继续处理这一对象，完成“给出支持筛选判断的改进方向”。到本段末尾，讨论又落到\u003ccode>benefits of the proposal\u003c/code>，这正好为下一段“由内部收益转向同行仿效”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>追问最初筛选能力这一弱点 → 给出支持筛选判断的改进方向 → 由内部收益转向同行仿效\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“由内部收益转向同行仿效”。它也属于同一论题，但若直接放在这里，就会跳过“给出支持筛选判断的改进方向”这一必要环节；其段首“Those benefits need not remain within the journal that first adopts the arrangement.”需要的前提与E当前收束的对象不一致，后续也接不出F所需的\u003ccode>benefits of the proposal\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是C → F → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Improvement here can preserve the benefits of the proposal while addressing its most obvious limitation.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those benefits need not remain within the journal that first adopts the arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A broader effort still leaves researchers with responsibilities of their own.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>benefits of the proposal\u003c/code>，F继续处理这一对象，完成“由内部收益转向同行仿效”。到本段末尾，讨论又落到\u003ccode>broader effort\u003c/code>，这正好为下一段“补充研究者责任，说明审查不替代研究质量”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>给出支持筛选判断的改进方向 → 由内部收益转向同行仿效 → 补充研究者责任，说明审查不替代研究质量\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“给出支持筛选判断的改进方向”。它也属于同一论题，但若直接放在这里，就会跳过“由内部收益转向同行仿效”这一必要环节；其段首“Editors’ ability can be supported by clearer referral criteria and closer discussion with specialists.”需要的前提与C当前收束的对象不一致，后续也接不出G所需的\u003ccode>broader effort\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是F → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A local change could become part of a broader effort to improve review standards.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A broader effort still leaves researchers with responsibilities of their own.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>These different stages explain both the promise and the limits of statistical review.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>broader effort\u003c/code>，G继续处理这一对象，完成“补充研究者责任，说明审查不替代研究质量”。到本段末尾，讨论又落到\u003ccode>different stages\u003c/code>，这正好为下一段“以多环节共同保障收束评价”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由内部收益转向同行仿效 → 补充研究者责任，说明审查不替代研究质量 → 以多环节共同保障收束评价\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“由内部收益转向同行仿效”。它也属于同一论题，但若直接放在这里，就会跳过“补充研究者责任，说明审查不替代研究质量”这一必要环节；其段首“Those benefits need not remain within the journal that first adopts the arrangement.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的\u003ccode>different stages\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>research integrity\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>科研诚信\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：学习生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical thinking\u003c/td>\n\u003ctd>批判性思维\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional responsibility\u003c/td>\n\u003ctd>职业责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation among specialists\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>专家合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reliable scientific progress\u003c/td>\n\u003ctd>可靠的科学进步\u003c/td>\n\u003ctd>社会现象类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a willingness to admit weaknesses\u003c/td>\n\u003ctd>承认不足的意愿\u003c/td>\n\u003ctd>人生哲理类：谦虚、承认不足\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>independent judgement\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>独立判断\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：批判、独立、全局思维\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>setting a positive example\u003c/td>\n\u003ctd>树立积极榜样\u003c/td>\n\u003ctd>人生哲理类：榜样\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>continuous improvement\u003c/td>\n\u003ctd>持续改进\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A adding an extra check to an existing process.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画显示A在既有流程中增加一道检查。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is asking B to examine the evidence before reaching a conclusion.\u003c/td>\n\u003ctd>A正请B在下结论前检查证据。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene highlights the shared responsibility of A and B for quality.\u003c/td>\n\u003ctd>画面突出A与B对质量的共同责任。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The proportion of institutions adopting A rose from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>采用A的机构比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate a growing concern about the reliability of A.\u003c/td>\n\u003ctd>这些数字表明人们对A可靠性的关注不断增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Compared with A, B devotes a larger share of its resources to quality checks.\u003c/td>\n\u003ctd>与A相比，B把更大比例的资源用于质量检查。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage describes an effort to improve A through additional scrutiny.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文介绍了通过额外审查改进A的努力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author acknowledges the merit of A while identifying a remaining weakness.\u003c/td>\n\u003ctd>作者承认A的价值，同时指出尚存的弱点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The example shows how one institution can set a standard that others may follow.\u003c/td>\n\u003ctd>这个例子说明一个机构如何为其他机构树立可仿效的标准。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
