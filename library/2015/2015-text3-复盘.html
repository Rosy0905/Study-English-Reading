apers  \n> 《科学》加入论文统计审查行动\n\n把这个主旨直接代入34题题干：\n\n> 文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\n\nD实际说的是：\n\n> is to fail in the foreseeable future  \n> 将在可预见的将来失败\n\n一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\n\n从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,2209,1800,85],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"34","option":"D"},"focusId":"focus-q34-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-D-0\">\u003cblockquote>\n\u003cp>将在可预见的将来失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯认为，《科学》现在的做法将在可预见的将来失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“fail in the foreseeable future”和原文“has some merit, but a weakness”都在评价方案前景，因为一个断言近期必败，一个只是承认优点后指出一个弱点，所以回看第六段最后一句。\u003c/p>\n\u003cp>原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n\u003cp>“fail in the foreseeable future”包含两个很强的判断：结局是失败，并且发生在可预见时间内。沃克斯只指出一个机制弱点，同时明确承认“some merit”，没有预测最终失败，也没有给出时间。\u003c/p>\n\u003cp>一个可改进的弱点不等于注定失败，原文还明确承认方案有价值。\u003c/p>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003cp>沃克斯先要求研究者与期刊提高标准，再承认新方案有价值，同时指出最初筛选仍依赖既有编辑委员会这一弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The proposal will fail in the foreseeable future despite its limited merits.\u003c/p>\n\u003cp>尽管有有限的价值，这一方案仍会在可预见的未来失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>必败路线需要把弱点论证为不可修复，并给出未来判断。实际停在具体缺口，没有跨到结局和时间预言。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Science Joins Push to Screen Statistics in Papers\u003cbr>《科学》加入论文统计审查行动\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>文章报道加强统计审查，同时容纳具体方案的不足。题干应回答沃克斯对现有机制的有保留评价，不能把改革报道改成确定的失败预言。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is to fail in the foreseeable future\u003cbr>将在可预见的将来失败\u003c/p>\n\u003c/blockquote>\n\u003cp>一个方案依赖评审委员会筛选，可能降低覆盖率，但仍可通过改进筛选标准、增加统计能力来修正。D把局部缺口放大成不可避免的近期结局。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"34题结论","level":2,"raw":"### 34题结论\n\n> **34. C. has room for further improvement**\n\nA：原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。\n\nB：原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\n\nC：原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\n\nD：原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。","context":{"mode":"image","asset":"questions","focus":[250,1859,1800,470],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 3题目"},"meta":{"question":"34","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>34. C. has room for further improvement\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“Researchers should improve their standards”要求研究人员提高标准，同时强调期刊也要更强硬；A的“adds to researchers’ workload”却把提高标准换成工作量增加。\u003c/p>\n\u003cp>B：原文“engaging reviewers”要求期刊使用具备统计能力的评审者，并让编辑核验流程；B的“diminishes the role of reviewers”却说评审者作用被削弱。\u003c/p>\n\u003cp>C：原文“has some merit, but a weakness”既承认方案有价值，又指出筛选机制的弱点；C的“has room for further”正把这种评价概括成还可以继续完善，两者方向相同。\u003c/p>\n\u003cp>D：原文“has some merit, but a weakness”是有限肯定加具体保留；D的“fail in the foreseeable future”却给出近期必然失败的时间和程度判断。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：《科学》杂志的新政策**（段落1核心事件） 《科学》增加额外统计检查 → 紧随其他期刊类似努力 → 背景：广泛担忧数据分析错误导致研究不可重现\n\n↓（具体实施方案）\n\n**逻辑层次2：SBoRE的建立与运作机制**（段落2-3具体措施） 建立机制：【与美国统计协会合作 → 任命7位专家组成SBoRE】→ 运作流程：（内部编辑/审稿委员会/外部评审标记手稿 → SBoRE寻找外部统计学家审查）→ 动机说明：广泛担忧统计应用问题 + 提高研究可重现性\n\n↓（各方评价）\n\n**逻辑层次3：专家对新政策的积极评价**（段落4-5支持声音） Parmigiani（SBoRE成员）：【期望发挥咨询作用 + 认为有新颖性和持久影响 → 希望其他出版机构效仿】+ Ioannidis（方法论专家）：【\"最受欢迎的进步\"+\"早该如此\" → 指出多数期刊统计审查薄弱 → 认为统计审查比专家审查更重要】// 但承认某些生物医学期刊已重视统计审查\n\n↓（潜在问题）\n\n**逻辑层次4：现状与改进空间**（段落6批判性分析） 现状问题：（科学家应懂数据分析 // 但统计错误惊人地常见）→ 双重责任：（研究人员应提高标准 + 期刊应采取强硬立场）→ 对《科学》做法的评价：【有价值 // 但存在弱点：依赖编辑识别需要审查的论文】\n\n↑（全文主旨）\n\n全文核心观点**：**《科学》杂志通过建立统计审查委员会来加强同行评审，这一举措虽然获得专家认可并可能产生示范效应，但仍存在依赖编辑判断的局限性，反映了科学出版界对提高研究质量和可重现性的共同努力。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：《科学》杂志的新政策\u003c/strong>（段落1核心事件） 《科学》增加额外统计检查 → 紧随其他期刊类似努力 → 背景：广泛担忧数据分析错误导致研究不可重现\u003c/p>\n\u003cp>↓（具体实施方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：SBoRE的建立与运作机制\u003c/strong>（段落2-3具体措施） 建立机制：【与美国统计协会合作 → 任命7位专家组成SBoRE】→ 运作流程：（内部编辑/审稿委员会/外部评审标记手稿 → SBoRE寻找外部统计学家审查）→ 动机说明：广泛担忧统计应用问题 + 提高研究可重现性\u003c/p>\n\u003cp>↓（各方评价）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：专家对新政策的积极评价\u003c/strong>（段落4-5支持声音） Parmigiani（SBoRE成员）：【期望发挥咨询作用 + 认为有新颖性和持久影响 → 希望其他出版机构效仿】+ Ioannidis（方法论专家）：【&quot;最受欢迎的进步&quot;+&quot;早该如此&quot; → 指出多数期刊统计审查薄弱 → 认为统计审查比专家审查更重要】// 但承认某些生物医学期刊已重视统计审查\u003c/p>\n\u003cp>↓（潜在问题）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：现状与改进空间\u003c/strong>（段落6批判性分析） 现状问题：（科学家应懂数据分析 // 但统计错误惊人地常见）→ 双重责任：（研究人员应提高标准 + 期刊应采取强硬立场）→ 对《科学》做法的评价：【有价值 // 但存在弱点：依赖编辑识别需要审查的论文】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点\u003cstrong>：\u003c/strong>《科学》杂志通过建立统计审查委员会来加强同行评审，这一举措虽然获得专家认可并可能产生示范效应，但仍存在依赖编辑判断的局限性，反映了科学出版界对提高研究质量和可重现性的共同努力。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：D. An Additional Gate for Published Evidence / 为发表证据增设关口**\n\n提出新检查所填补的证据可靠性缺口，并区分统计把关与研究价值判断。\n\n> A journal can publish an impressive result without being certain that the calculations behind it deserve the same confidence.\n>\n> Publication therefore gains another gate, aimed at the reliability of the reasoning that connects observations with conclusions.\n\n段内推进：\n\n> 提出新检查所填补的证据可靠性缺口 → 并区分统计把关与研究价值判断。\n\nAdditional Gate对应“给同行评审增加统计检查”，Published Evidence对应从观察到结论的数值证据；一个写新增机制，一个写机制把关的对象。\n\n最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但段落说增加一种专业把关，没有要求所有编辑转行；中心是新增检查的功能。\n\n**41题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. An Additional Gate for Published Evidence / 为发表证据增设关口\u003c/strong>\u003c/p>\n\u003cp>提出新检查所填补的证据可靠性缺口，并区分统计把关与研究价值判断。\u003c/p>\n\u003cblockquote>\n\u003cp>A journal can publish an impressive result without being certain that the calculations behind it deserve the same confidence.\u003c/p>\n\u003cp>Publication therefore gains another gate, aimed at the reliability of the reasoning that connects observations with conclusions.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出新检查所填补的证据可靠性缺口 → 并区分统计把关与研究价值判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>Additional Gate对应“给同行评审增加统计检查”，Published Evidence对应从观察到结论的数值证据；一个写新增机制，一个写机制把关的对象。\u003c/p>\n\u003cp>最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但段落说增加一种专业把关，没有要求所有编辑转行；中心是新增检查的功能。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：F. Specialists Need a Clear Route to the Manuscript / 专家需要明确的送审路径**\n\n说明稿件识别、委员会协调和外部统计复核的分工。\n\n> A gate is useful only if manuscripts reach the people qualified to examine them.\n>\n> It also makes clear that forming a board is only one part of a process involving several groups of people.\n\n段内推进：\n\n> 说明稿件识别、委员会协调和外部统计复核的分工。\n\nSpecialists对应外部统计学家，Clear Route对应编辑识别、委员会协调、专家复核的送审链；标题抓住人如何接到稿件，而非只说成立委员会。\n\n最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但分工恰好避免每位编辑包办专业分析；出现编辑不等于把统计全部交给编辑。\n\n**42题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Specialists Need a Clear Route to the Manuscript / 专家需要明确的送审路径\u003c/strong>\u003c/p>\n\u003cp>说明稿件识别、委员会协调和外部统计复核的分工。\u003c/p>\n\u003cblockquote>\n\u003cp>A gate is useful only if manuscripts reach the people qualified to examine them.\u003c/p>\n\u003cp>It also makes clear that forming a board is only one part of a process involving several groups of people.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明稿件识别、委员会协调和外部统计复核的分工。\u003c/p>\n\u003c/blockquote>\n\u003cp>Specialists对应外部统计学家，Clear Route对应编辑识别、委员会协调、专家复核的送审链；标题抓住人如何接到稿件，而非只说成立委员会。\u003c/p>\n\u003cp>最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但分工恰好避免每位编辑包办专业分析；出现编辑不等于把统计全部交给编辑。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：G. A Shared Problem Rather Than a Single Scandal / 共同问题而非单一丑闻**\n\n从个别丑闻转向研究可重现性的普遍问题，说明政策动因。\n\n> It is tempting to describe a new policy as the response to one embarrassing article.\n>\n> A lasting response must address that recurring problem instead of merely finding a convenient individual to blame.\n\n段内推进：\n\n> 从个别丑闻转向研究可重现性的普遍问题 → 说明政策动因。\n\nShared Problem对应跨学科、跨机构的统计实践弱点，Rather Than a Single Scandal对应不是只由一篇难堪论文触发；标题保留了普遍与个别的范围对照。\n\n最强干扰项B（A Campaign to Punish a Few Authors）容易因相同话题进入考虑。但结尾明确拒绝只找个人负责；责任追究不是这一段组织材料的目标。\n\n**43题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：G. A Shared Problem Rather Than a Single Scandal / 共同问题而非单一丑闻\u003c/strong>\u003c/p>\n\u003cp>从个别丑闻转向研究可重现性的普遍问题，说明政策动因。\u003c/p>\n\u003cblockquote>\n\u003cp>It is tempting to describe a new policy as the response to one embarrassing article.\u003c/p>\n\u003cp>A lasting response must address that recurring problem instead of merely finding a convenient individual to blame.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从个别丑闻转向研究可重现性的普遍问题 → 说明政策动因。\u003c/p>\n\u003c/blockquote>\n\u003cp>Shared Problem对应跨学科、跨机构的统计实践弱点，Rather Than a Single Scandal对应不是只由一篇难堪论文触发；标题保留了普遍与个别的范围对照。\u003c/p>\n\u003cp>最强干扰项B（A Campaign to Punish a Few Authors）容易因相同话题进入考虑。但结尾明确拒绝只找个人负责；责任追究不是这一段组织材料的目标。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：C. An Example That May Travel Across Journals / 可能推广到其他期刊的示范**\n\n将影响范围从一家期刊扩大到其他出版机构的仿效。\n\n> Other publishers do not need to copy every detail of a new board to learn from it.\n>\n> The initiative would become an example of how a shared concern can produce changes throughout an industry.\n\n段内推进：\n\n> 将影响范围从一家期刊扩大到其他出版机构的仿效。\n\nExample对应先行期刊提供的做法，Travel Across Journals对应其他出版者借鉴原则并扩大影响；may保留预期，没有保证所有期刊照搬。\n\n最强干扰项D（An Additional Gate for Published Evidence）容易因相同话题进入考虑。但新增关口只是被仿效的内容，本段重点在影响如何向外传播。\n\n**44题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：C. An Example That May Travel Across Journals / 可能推广到其他期刊的示范\u003c/strong>\u003c/p>\n\u003cp>将影响范围从一家期刊扩大到其他出版机构的仿效。\u003c/p>\n\u003cblockquote>\n\u003cp>Other publishers do not need to copy every detail of a new board to learn from it.\u003c/p>\n\u003cp>The initiative would become an example of how a shared concern can produce changes throughout an industry.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将影响范围从一家期刊扩大到其他出版机构的仿效。\u003c/p>\n\u003c/blockquote>\n\u003cp>Example对应先行期刊提供的做法，Travel Across Journals对应其他出版者借鉴原则并扩大影响；may保留预期，没有保证所有期刊照搬。\u003c/p>\n\u003cp>最强干扰项D（An Additional Gate for Published Evidence）容易因相同话题进入考虑。但新增关口只是被仿效的内容，本段重点在影响如何向外传播。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：A. The Weakness Before the Expert Review Begins / 专家复核开始之前的弱点**\n\n先肯定改革，再锁定送审前识别稿件这一薄弱环节。\n\n> Even a well-qualified statistician cannot review a paper that is never referred to the board.\n>\n> It identifies where further improvement is needed: the screening decision that occurs before specialist examination can do any good.\n\n段内推进：\n\n> 先肯定改革 → 再锁定送审前识别稿件这一薄弱环节。\n\nWeakness对应编辑可能未能识别需要复核的论文，Before the Expert Review Begins对应稿件送达专家之前的筛选位置。\n\n最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但需要改进筛选判断不等于把全体编辑培养为全职统计学家。\n\n**45题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. The Weakness Before the Expert Review Begins / 专家复核开始之前的弱点\u003c/strong>\u003c/p>\n\u003cp>先肯定改革，再锁定送审前识别稿件这一薄弱环节。\u003c/p>\n\u003cblockquote>\n\u003cp>Even a well-qualified statistician cannot review a paper that is never referred to the board.\u003c/p>\n\u003cp>It identifies where further improvement is needed: the screening decision that occurs before specialist examination can do any good.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>先肯定改革 → 再锁定送审前识别稿件这一薄弱环节。\u003c/p>\n\u003c/blockquote>\n\u003cp>Weakness对应编辑可能未能识别需要复核的论文，Before the Expert Review Begins对应稿件送达专家之前的筛选位置。\u003c/p>\n\u003cp>最强干扰项E（Making Every Editor a Full-time Statistician）容易因相同话题进入考虑。但需要改进筛选判断不等于把全体编辑培养为全职统计学家。\u003c/p>\n\u003cp>\u003cstrong>45题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出统计复核及其待解释的问题 |\n| B | 回答问题是分析质量与可重现性 |\n| C | 给出支持筛选判断的改进方向 |\n| D | 将检查要求落实为两阶段送审安排 |\n| E | 追问最初筛选能力这一弱点 |\n| F | 由内部收益转向同行仿效 |\n| G | 补充研究者责任，说明审查不替代研究质量 |\n| H | 以多环节共同保障收束评价 |\n\n全文推进：\n\n> 提出统计复核及其待解释的问题 → 回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排 → 追问最初筛选能力这一弱点 → 给出支持筛选判断的改进方向 → 由内部收益转向同行仿效 → 补充研究者责任，说明审查不替代研究质量 → 以多环节共同保障收束评价\n\n完整顺序：\n\n**A → B → D → E → C → F → G → H**\n\n41—45：B、D、C、F、G。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出统计复核及其待解释的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>回答问题是分析质量与可重现性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>给出支持筛选判断的改进方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>将检查要求落实为两阶段送审安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>追问最初筛选能力这一弱点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由内部收益转向同行仿效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>补充研究者责任，说明审查不替代研究质量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以多环节共同保障收束评价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出统计复核及其待解释的问题 → 回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排 → 追问最初筛选能力这一弱点 → 给出支持筛选判断的改进方向 → 由内部收益转向同行仿效 → 补充研究者责任，说明审查不替代研究质量 → 以多环节共同保障收束评价\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → D → E → C → F → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、D、C、F、G。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → B → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> To understand the proposal, it helps to begin with the problem that makes such an addition necessary.\n\n候选B的开头：\n\n> The problem is not simply that researchers sometimes choose uninteresting questions.\n\n后段D的开头：\n\n> Closer inspection requires more than a general request to be careful.\n\n前文已经落到`the problem`，B继续处理这一对象，完成“回答问题是分析质量与可重现性”。到本段末尾，讨论又落到`this part of scientific reasoning`，这正好为下一段“将检查要求落实为两阶段送审安排”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出统计复核及其待解释的问题 → 回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排\n\n最强候选D的功能是“将检查要求落实为两阶段送审安排”。它也属于同一论题，但若直接放在这里，就会跳过“回答问题是分析质量与可重现性”这一必要环节；其段首“Closer inspection requires more than a general request to be careful.”需要的前提与A当前收束的对象不一致，后续也接不出D所需的`this part of scientific reasoning`。\n\n**41题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → B → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand the proposal, it helps to begin with the problem that makes such an addition necessary.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The problem is not simply that researchers sometimes choose uninteresting questions.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Closer inspection requires more than a general request to be careful.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the problem\u003c/code>，B继续处理这一对象，完成“回答问题是分析质量与可重现性”。到本段末尾，讨论又落到\u003ccode>this part of scientific reasoning\u003c/code>，这正好为下一段“将检查要求落实为两阶段送审安排”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出统计复核及其待解释的问题 → 回答问题是分析质量与可重现性 → 将检查要求落实为两阶段送审安排\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“将检查要求落实为两阶段送审安排”。它也属于同一论题，但若直接放在这里，就会跳过“回答问题是分析质量与可重现性”这一必要环节；其段首“Closer inspection requires more than a general request to be careful.”需要的前提与A当前收束的对象不一致，后续也接不出D所需的\u003ccode>this part of scientific reasoning\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是B → D → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段B的结尾：\n\n> Repea  own.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>These different stages explain both the promise and the limits of statistical review.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>broader effort\u003c/code>，G继续处理这一对象，完成“补充研究者责任，说明审查不替代研究质量”。到本段末尾，讨论又落到\u003ccode>different stages\u003c/code>，这正好为下一段“以多环节共同保障收束评价”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由内部收益转向同行仿效 → 补充研究者责任，说明审查不替代研究质量 → 以多环节共同保障收束评价\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“由内部收益转向同行仿效”。它也属于同一论题，但若直接放在这里，就会跳过“补充研究者责任，说明审查不替代研究质量”这一必要环节；其段首“Those benefits need not remain within the journal that first adopts the arrangement.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的\u003ccode>different stages\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **research integrity** | **科研诚信** | **社会现象类：学习生活** | **宏观主题** |\n| critical thinking | 批判性思维 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| professional responsibility | 职业责任 | 人生哲理类：责任感、奉献精神 | 个人主题 |\n| **cooperation among specialists** | **专家合作** | **人生哲理类：团结合作** | **宏观主题** |\n| reliable scientific progress | 可靠的科学进步 | 社会现象类：科技发展 | 宏观主题 |\n| a willingness to admit weaknesses | 承认不足的意愿 | 人生哲理类：谦虚、承认不足 | 个人主题 |\n| **independent judgement** | **独立判断** | **人生哲理类：批判、独立、全局思维** | **个人主题** |\n| setting a positive example | 树立积极榜样 | 人生哲理类：榜样 | 个人主题 |\n| continuous improvement | 持续改进 | 人生哲理类：创新、开拓、与时俱进 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2015英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>采用A的机构比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate a growing concern about the reliability of A.\u003c/td>\n\u003ctd>这些数字表明人们对A可靠性的关注不断增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Compared with A, B devotes a larger share of its resources to quality checks.\u003c/td>\n\u003ctd>与A相比，B把更大比例的资源用于质量检查。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage describes an effort to improve A through additional scrutiny.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文介绍了通过额外审查改进A的努力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author acknowledges the merit of A while identifying a remaining weakness.\u003c/td>\n\u003ctd>作者承认A的价值，同时指出尚存的弱点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The example shows how one institution can set a standard that others may follow.\u003c/td>\n\u003ctd>这个例子说明一个机构如何为其他机构树立可仿效的标准。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. The Weakness Before the Expert Review Begins\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. A Campaign to Punish a Few Authors\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. An Example That May Travel Across Journals\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. An Additional Gate for Published Evidence\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Making Every Editor a Full-time Statistician\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Specialists Need a Clear Route to the Manuscript\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. A Shared Problem Rather Than a Single Scandal\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A journal can publish an impressive result without being certain that the calculations behind it deserve the same confidence. Adding a statistical check to peer review responds to that gap. The new check does not replace scientific judgement about the importance of a question; it asks whether the numerical evidence can support the answer offered. Publication therefore gains another gate, aimed at the reliability of the reasoning that connects observations with conclusions.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>A gate is useful only if manuscripts reach the people qualified to examine them. Editors and reviewers may first identify papers that need closer attention. A specialist board can then locate outside statisticians with suitable expertise. This division of work keeps the identification of a problem distinct from its detailed examination. It also makes clear that forming a board is only one part of a process involving several groups of people.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>It is tempting to describe a new policy as the response to one embarrassing article. Yet weaknesses in statistical practice can extend across subjects and institutions. A journal may change its rules because accumulated concerns have become difficult to ignore, rather than because a single paper has suddenly altered everything. The central question is whether published research can be reproduced. A lasting response must address that recurring problem instead of merely finding a convenient individual to blame.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>Other publishers do not need to copy every detail of a new board to learn from it. They can borrow the principle that statistical expertise should enter the review process before publication. If the experiment works, its influence may spread through imitation rather than formal orders. Such an effect would reach beyond the articles printed in one journal. The initiative would become an example of how a shared concern can produce changes throughout an industry.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Even a well-qualified statistician cannot review a paper that is never referred to the board. The initial decision about which manuscripts require scrutiny therefore matters greatly. If editors fail to recognise a statistical weakness, the extra gate may remain closed to precisely the papers that need it. This does not make the reform worthless. It identifies where further improvement is needed: the screening decision that occurs before specialist examination can do any good.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>An extra statistical review may look like a small addition to a journal’s existing procedures. Its purpose, however, is substantial: to increase confidence in the evidence supporting published conclusions. To understand the proposal, it helps to begin with the problem that makes such an addition necessary.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>The problem is not simply that researchers sometimes choose uninteresting questions. Even an important question can produce an unreliable answer if the analysis of its data is weak. Repeated concerns about results that cannot be reproduced give journals a reason to inspect this part of scientific reasoning more closely.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Editors’ ability can be supported by clearer referral criteria and closer discussion with specialists. Neither measure guarantees that every error will be discovered. Both, however, strengthen the point at which a paper enters the additional review. Improvement here can preserve the benefits of the proposal while addressing its most obvious limitation.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Closer inspection requires more than a general request to be careful. A journal can establish a specialist board and ask ordinary editors to identify manuscripts needing extra attention. The board can then find outside statisticians. This arrangement separates the initial selection from the detailed examination that follows.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>That initial selection is a crucial link. When a paper reaches a statistician, a hidden error may become visible; when it is never referred, the specialist has no opportunity to help. The arrangement therefore raises a practical question about editors’ ability to recognise the need for additional scrutiny.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Those benefits need not remain within the journal that first adopts the arrangement. Other publishers may observe the process, adapt the referral criteria and recruit their own statistical advisers. Influence would then spread through imitation. A local change could become part of a broader effort to improve review standards.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>A broader effort still leaves researchers with responsibilities of their own. An additional gate at a journal cannot substitute for careful analysis in the laboratory. Reviewers, editors and authors contribute at different stages, and none can reasonably treat another group’s participation as permission to stop checking its own work.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>These different stages explain both the promise and the limits of statistical review. The reform is worth supporting because it adds expertise where mistakes matter. Its success nevertheless depends on effective referral and sound research practices. Confidence grows through several connected safeguards, rather than through the mere existence of a new board.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2015英语一Text 3重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>journal\u003c/td>\n\u003ctd>n.期刊\u003c/td>\n\u003ctd>add\u003c/td>\n\u003ctd>v.增加\u003c/td>\n\u003ctd>extra\u003 第6段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>professional\u003c/td>\n\u003ctd>a.专业的\u003c/td>\n\u003ctd>expect\u003c/td>\n\u003ctd>v.期望\u003c/td>\n\u003ctd>analyse\u003c/td>\n\u003ctd>v.分析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>alarmingly common\u003c/td>\n\u003ctd>普遍得令人担忧的\u003c/td>\n\u003ctd>published research\u003c/td>\n\u003ctd>已发表的研究\u003c/td>\n\u003ctd>biologist\u003c/td>\n\u003ctd>n.生物学家\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>improve standards\u003c/td>\n\u003ctd>提高标准\u003c/td>\n\u003ctd>take a tougher line\u003c/td>\n\u003ctd>采取更强硬的立场\u003c/td>\n\u003ctd>engage\u003c/td>\n\u003ctd>v.聘用；让参与\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>statistically literate\u003c/td>\n\u003ctd>懂统计的\u003c/td>\n\u003ctd>verify\u003c/td>\n\u003ctd>v.核实\u003c/td>\n\u003ctd>process\u003c/td>\n\u003ctd>n.过程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pass to\u003c/td>\n\u003ctd>交给\u003c/td>\n\u003ctd>statistician\u003c/td>\n\u003ctd>n.统计学家\u003c/td>\n\u003ctd>merit\u003c/td>\n\u003ctd>n.价值；长处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>weakness\u003c/td>\n\u003ctd>n.弱点\u003c/td>\n\u003ctd>rely on\u003c/td>\n\u003ctd>依赖\u003c/td>\n\u003ctd>identify\u003c/td>\n\u003ctd>v.识别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scrutiny\u003c/td>\n\u003ctd>n.审查\u003c/td>\n\u003ctd>in the first place\u003c/td>\n\u003ctd>首先\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today. The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>The journal Science / is adding / an extra round of statistical checks / to its peer-review process, / editor-in-chief Marcia McNutt / announced today.\u003c/p>\n\u003cp>The policy follows / similar efforts / from other journals, / after widespread concern / that basic mistakes / in data analysis / are contributing to / the irreproducibility / of many published research findings.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>《科学》杂志 / 正在增加 / 额外一轮统计检查 / 到它的同行评审过程，/ 主编玛西娅·麦克纳特 / 今天宣布。\u003c/p>\n\u003cp>这项政策紧随 / 类似的努力 / 来自其他期刊，/ 在广泛的担忧之后 / 基本错误 / 在数据分析中 / 正在导致 / 不可重现性 / 许多已发表研究发现的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>《科学》杂志主编玛西娅·麦克纳特今天宣布，该杂志将在同行评审过程中增加额外一轮统计检查。这项政策是继其他期刊采取类似措施之后推出的，因为人们普遍担心数据分析中的基本错误正在导致许多已发表研究发现无法重现。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>&quot;Readers must have confidence in the conclusions published in our journal,&quot; writes McNutt in an editorial. Working with the American Statistical Association, the journal has appointed seven experts to a statistics board of reviewing editors (SBoRE). Manuscripts will be flagged up for additional scrutiny by the journal&#39;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers. The SBoRE panel will then find external statisticians to review these manuscripts.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>&quot;Readers must have confidence / in the conclusions / published in our journal,&quot; / writes McNutt / in an editorial.\u003c/p>\n\u003cp>Working with / the American Statistical Association, / the journal has appointed / seven experts / to a statistics board of reviewing editors (SBoRE).\u003c/p>\n\u003cp>Manuscripts will be flagged up / for additional scrutiny / by the journal&#39;s internal editors, / or by its existing Board of Reviewing Editors / or by outside peer reviewers.\u003c/p>\n\u003cp>The SBoRE panel / will then find / external statisticians / to review these manuscripts.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>&quot;读者必须有信心 / 对结论 / 发表在我们期刊上的，&quot; / 麦克纳特写道 / 在一篇社论中。\u003c/p>\n\u003cp>与...合作 / 美国统计协会，/ 该期刊已经任命 / 七位专家 / 到一个统计审稿编辑委员会（SBoRE）。\u003c/p>\n\u003cp>手稿将被标记出来 / 用于额外审查 / 由期刊的内部编辑，/ 或由其现有的审稿编辑委员会 / 或由外部同行评审者。\u003c/p>\n\u003cp>SBoRE小组 / 然后将寻找 / 外部统计学家 / 来审查这些手稿。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>麦克纳特在社论中写道：&quot;读者必须对我们期刊发表的结论有信心。&quot;该期刊与美国统计协会合作，已经任命七位专家组成统计审稿编辑委员会（SBoRE）。手稿将由期刊内部编辑、现有审稿编辑委员会或外部同行评审者标记出来进行额外审查。然后SBoRE小组将寻找外部统计学家来审查这些手稿。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Asked whether any particular papers had impelled the change, McNutt said: &quot;The creation of the &#39;statistics board&#39; was motivated by concerns broadly with the application of statistics and data analysis in scientific research and is part of Science&#39;s overall drive to increase reproducibility in the research we publish.&quot;\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Asked whether / any particular papers / had impelled the change, / McNutt said: / &quot;The creation of the &#39;statistics board&#39; / was motivated by / concerns broadly / with the application of statistics and data analysis / in scientific research / and is part of / Science&#39;s overall drive / to increase reproducibility / in the research we publish.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>当被问及是否 / 任何特定的论文 / 推动了这一改变，/ 麦克纳特说：/ &quot;统计委员会的创建 / 是由...激发的 / 广泛的担忧 / 关于统计和数据分析的应用 / 在科学研究中 / 并且是一部分 / 《科学》的整体努力 / 来增加可重现性 / 在我们发表的研究中。&quot;\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>当被问及是否有特定论文推动了这一改变时，麦克纳特说：&quot;创建&#39;统计委员会&#39;是出于对科学研究中统计和数据分析应用的广泛担忧，这是《科学》杂志提高所发表研究可重现性整体努力的一部分。&quot;\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to &quot;play primarily an advisory role.&quot; He agreed to join because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact. This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.&quot;\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Giovanni Parmigiani, / a biostatistician / at the Harvard School of Public Health, / a member of the SBoRE group, / says he expects / the board to &quot;play primarily an advisory role.&quot;\u003c/p>\n\u003cp>He agreed to join / because he &quot;found the foresight / behind the establishment of the SBoRE / to be novel, unique / and likely to have a lasting impact.\u003c/p>\n\u003cp>This impact / will not only be / through the publications in Science itself, / but hopefully through / a larger group of publishing places / that may want to model / their approach after Science.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>乔瓦尼·帕米贾尼，/ 一位生物统计学家 / 在哈佛公共卫生学院，/ SBoRE小组的成员，/ 说他期望 / 该委员会&quot;主要发挥咨询作用&quot;。\u003c/p>\n\u003cp>他同意加入 / 因为他&quot;发现远见 / 在SBoRE建立背后的 / 是新颖的、独特的 / 并且可能产生持久影响。\u003c/p>\n\u003cp>这种影响 / 将不仅是 / 通过《科学》本身的出版物，/ 而且希望通过 / 更大范围的出版场所 / 它们可能想要效仿 / 他们的方法以《科学》为榜样。&quot;\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>哈佛公共卫生学院的生物统计学家、SBoRE小组成员乔瓦尼·帕米贾尼说，他期望该委员会&quot;主要发挥咨询作用&quot;。他同意加入是因为他&quot;发现建立SBoRE背后的远见是新颖的、独特的，并且可能产生持久影响。这种影响不仅将通过《科学》本身的出版物体现，而且希望通过更多可能想要效仿《科学》做法的出版机构体现。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>John Ioannidis, a physician who studies research methodology, says that the policy is &quot;a most welcome step forward&quot; and &quot;long overdue&quot;. &quot;Most journals are weak in statistical review, and this damages the quality of what they publish. I think that, for the majority of scientific papers nowadays, statistical review is more essential than expert review,&quot; he says, but he noted that biomedical journals such as Annals of Internal Medicine, the Journal of the American Medical Association and The Lancet pay strong attention to statistical review.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>John Ioannidis, / a physician / who studies research methodology, / says that the policy / is &quot;a most welcome step forward&quot; / and &quot;long overdue&quot;.\u003c/p>\n\u003cp>&quot;Most journals / are weak in statistical review, / and this damages / the quality of what they publish.\u003c/p>\n\u003cp>I think that, / for the majority of scientific papers nowadays, / statistical review / is more essential than expert review,&quot; / he says, / but he noted that / biomedical journals / such as Annals of Internal Medicine, / the Journal of the American Medical Association / and The Lancet / pay strong attention / to statistical review.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>约翰·约阿尼迪斯，/ 一位医生 / 研究研究方法论的，/ 说这项政策 / 是&quot;最受欢迎的进步&quot; / 并且&quot;早该如此&quot;。\u003c/p>\n\u003cp>&quot;大多数期刊 / 在统计审查方面薄弱，/ 这损害了 / 他们发表内容的质量。\u003c/p>\n\u003cp>我认为，/ 对于当今大多数科学论文，/ 统计审查 / 比专家审查更重要，&quot; / 他说，/ 但他指出 / 生物医学期刊 / 如《内科医学年鉴》、/ 《美国医学会杂志》/ 和《柳叶刀》/ 高度重视 / 统计审查。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>研究研究方法论的医生约翰·约阿尼迪斯说，这项政策是&quot;最受欢迎的进步&quot;并且&quot;早该如此&quot;。&quot;大多数期刊在统计审查方面薄弱，这损害了他们发表内容的质量。我认为，对于当今大多数科学论文，统计审查比专家审查更重要，&quot;他说，但他指出生物医学期刊如《内科医学年鉴》、《美国医学会杂志》和《柳叶刀》高度重视统计审查。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist. Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;engaging reviewers who are statistically literate and editors who can verify the process&quot;. Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Professional scientists / are expected to know / how to analyse data, / but statistical errors / are alarmingly common / in published research, / according to David Vaux, / a cell biologist.\u003c/p>\n\u003cp>Researchers should improve / their standards, / he wrote in 2012, / but journals should also / take a tougher line, / &quot;engaging reviewers / who are statistically literate / and editors who can verify the process&quot;.\u003c/p>\n\u003cp>Vaux says that / Science&#39;s idea / to pass some papers to statisticians / &quot;has some merit, / but a weakness is / that it relies on / the board of reviewing editors / to identify &#39;the papers that need scrutiny&#39; / in the first place&quot;.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>专业科学家 / 被期望知道 / 如何分析数据，/ 但统计错误 / 惊人地常见 / 在已发表的研究中，/ 根据大卫·沃克斯，/ 一位细胞生物学家。\u003c/p>\n\u003cp>研究人员应该提高 / 他们的标准，/ 他在2012年写道，/ 但期刊也应该 / 采取更强硬的立场，/ &quot;聘用审稿人 / 具有统计素养的 / 以及能够验证过程的编辑&quot;。\u003c/p>\n\u003cp>沃克斯说 / 《科学》的想法 / 把一些论文交给统计学家 / &quot;有一定价值，/ 但一个弱点是 / 它依赖于 / 审稿编辑委员会 / 来识别&#39;需要审查的论文&#39; / 首先&quot;。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>细胞生物学家大卫·沃克斯表示，专业科学家被期望知道如何分析数据，但统计错误在已发表的研究中惊人地常见。他在2012年写道，研究人员应该提高他们的标准，但期刊也应该采取更强硬的立场，&quot;聘用具有统计素养的审稿人和能够验证过程的编辑&quot;。沃克斯说，《科学》把一些论文交给统计学家的想法&quot;有一定价值，但一个弱点是它首先依赖于审稿编辑委员会来识别&#39;需要审查的论文&#39;&quot;。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>The journal Science → is adding → an extra round of statistical checks：(to its peer-review process) → editor-in-chief Marcia McNutt → announced today.\u003c/p>\n\u003cp>The policy follows → similar efforts：(from other journals) → after widespread concern：(that basic mistakes：(in data analysis) → are contributing to → the irreproducibility：(of many published research findings)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>&quot;Readers must have confidence：(in the conclusions：(published in our journal))&quot; → writes McNutt：(in an editorial).\u003c/p>\n\u003cp>Working with：(the American Statistical Association) → the journal has appointed → seven experts → to a statistics board of reviewing editors (SBoRE).\u003c/p>\n\u003cp>Manuscripts will be flagged up：(for additional scrutiny)：(by the journal&#39;s internal editors + or by its existing Board of Reviewing Editors + or by outside peer reviewers).\u003c/p>\n\u003cp>The SBoRE panel → will then find → external statisticians → to review these manuscripts.\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Asked whether：(any particular papers → had impelled the change) → McNutt said：(&quot;The creation of the &#39;statistics board&#39; → was motivated by → concerns broadly：(with the application of statistics and data analysis：(in scientific research)) + is part of：(Science&#39;s overall drive：(to increase reproducibility：(in the research we publish)))&quot;).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Giovanni Parmigiani：(a biostatistician：(at the Harvard School of Public Health) + a member of the SBoRE group) → says he expects → the board to &quot;play primarily an advisory role.&quot;\u003c/p>\n\u003cp>He agreed to join → because he &quot;found the foresight：(behind the establishment of the SBoRE) → to be novel, unique + likely to have a lasting impact.\u003c/p>\n\u003cp>This impact → will not only be：(through the publications in Science itself) // but hopefully through：(a larger group of publishing places：(that may want to model → their approach after Science)).&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>John Ioannidis：(a physician：(who studies research methodology)) → says that the policy → is &quot;a most welcome step forward&quot; + &quot;long overdue&quot;.\u003c/p>\n\u003cp>&quot;Most journals → are weak in statistical review + this damages → the quality of what they publish.\u003c/p>\n\u003cp>I think that：(for the majority of scientific papers nowadays) → statistical review → is more essential than expert review&quot; → he says // but he noted that：(biomedical journals：(such as Annals of Internal Medicine + the Journal of the American Medical Association + The Lancet) → pay strong attention → to statistical review).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Professional scientists → are expected to know → how to analyse data // but statistical errors → are alarmingly common：(in published research) → according to David Vaux：(a cell biologist).\u003c/p>\n\u003cp>Researchers should improve → their standards → he wrote in 2012 // but journals should also → take a tougher line → &quot;engaging reviewers：(who are statistically literate) + editors：(who can verify the process)&quot;.\u003c/p>\n\u003cp>Vaux says that → Science&#39;s idea：(to pass some papers to statisticians) → &quot;has some merit // but a weakness is：(that it relies on → the board of reviewing editors → to identify &#39;the papers that need scrutiny&#39; → in the first place)&quot;.\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>《科学》杂志 → 正在增加 → 额外一轮统计检查：(到它的同行评审过程) → 主编玛西娅·麦克纳特 → 今天宣布。\u003c/p>\n\u003cp>这项政策紧随 → 类似的努力：(来自其他期刊) → 在广泛的担忧之后：(基本错误：(在数据分析中) → 正在导致 → 不可重现性：(许多已发表研究发现的))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>&quot;读者必须有信心：(对结论：(发表在我们期刊上的))&quot; → 麦克纳特写道：(在一篇社论中)。\u003c/p>\n\u003cp>与...合作：(美国统计协会) → 该期刊已经任命 → 七位专家 → 到一个统计审稿编辑委员会（SBoRE）。\u003c/p>\n\u003cp>手稿将被标记出来：(用于额外审查)：(由期刊的内部编辑 + 或由其现有的审稿编辑委员会 + 或由外部同行评审者)。\u003c/p>\n\u003cp>SBoRE小组 → 然后将寻找 → 外部统计学家 → 来审查这些手稿。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>当被问及是否：(任何特定的论文 → 推动了这一改变) → 麦克纳特说：(&quot;统计委员会的创建 → 是由...激发的 → 广泛的担忧：(关于统计和数据分析的应用：(在科学研究中)) + 是一部分：(《科学》的整体努力：(来增加可重现性：(在我们发表的研究中)))&quot;)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>乔瓦尼·帕米贾尼：(一位生物统计学家：(在哈佛公共卫生学院) + SBoRE小组的成员) → 说他期望 → 该委员会&quot;主要发挥咨询作用&quot;。\u003c/p>\n\u003cp>他同意加入 → 因为他&quot;发现远见：(在SBoRE建立背后的) → 是新颖的、独特的 + 可能产生持久影响。\u003c/p>\n\u003cp>这种影响 → 将不仅是：(通过《科学》本身的出版物) // 而且希望通过：(更大范围的出版场所：(它们可能想要效仿 → 他们的方法以《科学》为榜样))&quot;。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>约翰·约阿尼迪斯：(一位医生：(研究研究方法论的)) → 说这项政策 → 是&quot;最受欢迎的进步&quot; + &quot;早该如此&quot;。\u003c/p>\n\u003cp>&quot;大多数期刊 → 在统计审查方面薄弱 + 这损害了 → 他们发表内容的质量。\u003c/p>\n\u003cp>我认为：(对于当今大多数科学论文) → 统计审查 → 比专家审查更重要&quot; → 他说 // 但他指出：(生物医学期刊：(如《内科医学年鉴》+ 《美国医学会杂志》+ 《柳叶刀》) → 高度重视 → 统计审查)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>专业科学家 → 被期望知道 → 如何分析数据 // 但统计错误 → 惊人地常见：(在已发表的研究中) → 根据大卫·沃克斯：(一位细胞生物学家)。\u003c/p>\n\u003cp>研究人员应该提高 → 他们的标准 → 他在2012年写道 // 但期刊也应该 → 采取更强硬的立场 → &quot;聘用审稿人：(具有统计素养的) + 编辑：(能够验证过程的)&quot;。\u003c/p>\n\u003cp>沃克斯说 → 《科学》的想法：(把一些论文交给统计学家) → &quot;有一定价值 // 但一个弱点是：(它依赖于 → 审稿编辑委员会 → 来识别&#39;需要审查的论文&#39; → 首先)&quot;。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第3段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Asked whether any particular papers had impelled the change, McNutt said: &quot;The creation of the &#39;statistics board&#39; was motivated by concerns broadly with the application of statistics and data analysis in scientific research and is part of Science&#39;s overall drive to increase reproducibility in the research we publish.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Asked whether / any particular papers / had impelled the change, / McNutt said: / &quot;The creation of the &#39;statistics board&#39; / was motivated by / concerns broadly / with the application of statistics and data analysis / in scientific research / and is part of / Science&#39;s overall drive / to increase reproducibility / in the research we publish.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>当被问及是否 / 任何特定的论文 / 推动了这一改变，/ 麦克纳特说：/ &quot;统计委员会的创建 / 是由...激发的 / 广泛的担忧 / 关于统计和数据分析的应用 / 在科学研究中 / 并且是一部分 / 《科学》的整体努力 / 来增加可重现性 / 在我们发表的研究中。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并提问的内容，whether引出被问的问题，不是麦克纳特已经确认的原因。：\u003c/p>\n\u003cblockquote>\n\u003cp>被问到是否有特定论文推动这次改变\u003c/p>\n\u003c/blockquote>\n\u003cp>再把引语中并列的两项判断合起来：一项解释创建动机，一项说明它属于什么整体行动。：\u003c/p>\n\u003cblockquote>\n\u003cp>创建统计委员会源于对统计和数据分析应用的广泛担忧，也是提高已发表研究可重现性整体努力的一部分\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>被问到是否有特定论文推动这次改变；创建统计委员会源于对统计和数据分析应用的广泛担忧，也是提高已发表研究可重现性整体努力的一部分。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>麦克纳特说：创建委员会源于担忧，也是整体努力的一部分。\u003c/p>\n\u003c/blockquote>\n\u003cp>把“当被问及……”作为背景放在说话者之前；引语内先讲动机，再讲目的所属的整体行动，in the research we publish紧跟可重现性，限定研究范围。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>当被问到是否有特定论文推动这次改变时，麦克纳特说：“统计委员会的创建，是由对科学研究中统计和数据分析应用的广泛担忧所推动的，也是《科学》提高其发表研究可重现性的整体努力的一部分。”\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>“是否有特定论文推动”只是提问，不能译成确有某篇论文促成改革。\u003c/p>\n\u003cp>is part of不是另一项独立计划，而是把新委员会放进杂志既有的整体努力中。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>当被问及是否有特定论文推动了这一改变时，麦克纳特说：&quot;创建&#39;统计委员会&#39;是出于对科学研究中统计和数据分析应用的广泛担忧，这是《科学》杂志提高所发表研究可重现性整体努力的一部分。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>I think that, for the majority of scientific papers nowadays, statistical review is more essential than expert review,&quot; he says, but he noted that biomedical journals such as Annals of Internal Medicine, the Journal of the American Medical Association and The Lancet pay strong attention to statistical review.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>I think that, / for the majority of scientific papers nowadays, / statistical review / is more essential than expert review,&quot; / he says, / but he noted that / biomedical journals / such as Annals of Internal Medicine, / the Journal of the American Medical Association / and The Lancet / pay strong attention / to statistical review.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>我认为，/ 对于当今大多数科学论文，/ 统计审查 / 比专家审查更重要，&quot; / 他说，/ 但他指出 / 生物医学期刊 / 如《内科医学年鉴》、/ 《美国医学会杂志》/ 和《柳叶刀》/ 高度重视 / 统计审查。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把for引出的适用范围接到比较判断前。：\u003c/p>\n\u003cblockquote>\n\u003cp>对于当今大多数科学论文，统计审查比专家审查更重要\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并but后的例外说明，把三家期刊作为同一类例子处理。：\u003c/p>\n\u003cblockquote>\n\u003cp>但他指出，一些生物医学期刊已经高度重视统计审查\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>对于当今大多数科学论文，统计审查比专家审查更重要；但他指出，一些生物医学期刊已经高度重视统计审查。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>他说统计审查更重要，但指出一些期刊已很重视它。\u003c/p>\n\u003c/blockquote>\n\u003cp>先保留引语中的比较，再接“他说”；but后的例子放在“生物医学期刊”之后，pay strong attention作为这些期刊共同的动作。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>他说：“我认为，对如今大多数科学论文而言，统计审查比专家审查更重要。”但他又指出，像《内科医学年鉴》、《美国医学会杂志》和《柳叶刀》这样的生物医学期刊，很重视统计审查。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>more essential than比较两类评审的重要性，并非否定专家评审。\u003c/p>\n\u003cp>but补充已有重视统计审查的期刊，避免把前面对行业薄弱的评价译成无一例外。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>我认为，对于当今大多数科学论文，统计审查比专家审查更重要，&quot;他说，但他指出生物医学期刊如《内科医学年鉴》、《美国医学会杂志》和《柳叶刀》高度重视统计审查。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Vaux says that Science&#39;s idea to pass some papers to statisticians &quot;has some merit, but a weakness is that it relies on the board of reviewing editors to identify &#39;the papers that need scrutiny&#39; in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Vaux says that / Science&#39;s idea / to pass some papers to statisticians / &quot;has some merit, / but a weakness is / that it relies on / the board of reviewing editors / to identify &#39;the papers that need scrutiny&#39; / in the first place&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>沃克斯说 / 《科学》的想法 / 把一些论文交给统计学家 / &quot;有一定价值，/ 但一个弱点是 / 它依赖于 / 审稿编辑委员会 / 来识别&#39;需要审查的论文&#39; / 首先&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把idea后面的不定式收进“想法”，交代方案是什么。：\u003c/p>\n\u003cblockquote>\n\u003cp>《科学》把一些论文交给统计学家的想法\u003c/p>\n\u003c/blockquote>\n\u003cp>再把价值与弱点两面接起来，弱点的具体内容由that引出。：\u003c/p>\n\u003cblockquote>\n\u003cp>有一定价值，但首先识别需审查论文仍依赖审稿编辑委员会\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>《科学》把一些论文交给统计学家的想法；有一定价值，但首先识别需审查论文仍依赖审稿编辑委员会。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯说，这个想法有价值，但存在依赖编辑筛选的弱点。\u003c/p>\n\u003c/blockquote>\n\u003cp>“一些论文”限定送审范围；先写方案，再以“但”转入弱点，把in the first place译在识别流程的起点处。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯说，《科学》把部分论文交给统计学家的想法有一些价值，但它的一个弱点是，首先还要依靠审稿编辑委员会，识别哪些论文需要审查。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>has some merit保留有限肯定，不能夸成已经彻底解决问题。\u003c/p>\n\u003cp>弱点在前端识别依赖编辑，不是统计学家没有能力评审。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>沃克斯说，《科学》把一些论文交给统计学家的想法&quot;有一定价值，但一个弱点是它首先依赖于审稿编辑委员会来识别&#39;需要审查的论文&#39;&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>35题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following is the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个是本文最佳标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Science Joins Push to Screen Statistics in Papers\u003c/strong>\u003c/p>\n\u003cp>《科学》加入论文统计审查行动\u003c/p>\n\u003cp>B. \u003cstrong>Professional Statisticians Deserve More Respect\u003c/strong>\u003c/p>\n\u003cp>专业统计学家应得到更多尊重\u003c/p>\n\u003cp>C. \u003cstrong>Data Analysis Finds Its Way onto Editors’ Desks\u003c/strong>\u003c/p>\n\u003cp>数据分析走上编辑办公桌\u003c/p>\n\u003cp>D. \u003cstrong>Statisticians Are Coming Back with Science\u003c/strong>\u003c/p>\n\u003cp>统计学家随《科学》重返舞台\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>宣布《科学》在同行评审中增加统计检查，并说明其他期刊也有类似行动，背景是研究结果难以复现\u003c/td>\n\u003ctd>先说一方开始采取一种新做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>具体介绍统计评审编辑委员会、稿件标记和外部统计学家复核的流程\u003c/td>\n\u003ctd>再把这套做法怎样运行铺开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>麦克纳特说明变化来自对科研统计与数据分析的普遍担忧，目标是提高可复现性\u003c/td>\n\u003ctd>接着解释为什么要这样改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>帕尔米贾尼预计委员会先发挥顾问作用，并可能让更多出版机构仿照《科学》\u003c/td>\n\u003ctd>然后写有人预计它会扩散出去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>约阿尼迪斯欢迎这一迟来的进展，指出多数期刊统计评审薄弱，但部分医学期刊已很重视\u003c/td>\n\u003ctd>再补一个背景并加入外部支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>沃克斯说统计错误常见，期刊应更严格；同时认为《科学》的方案有价值但筛选机制仍有弱点\u003c/td>\n\u003ctd>最后说做法有用但还留下缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following is the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Science Joins Push to Screen Statistics in Papers\u003c/h3>\n\u003cp>《科学》加入论文统计审查行动\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>《科学》加入论文统计审查行动\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>宣布《科学》开始加入期刊统计审查行动，用新增检查回应论文质量问题。\u003c/td>\n\u003ctd>先说一方开始采取一种新做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>介绍委员会、编辑标记与外部统计学家复核如何组成新增审查流程。\u003c/td>\n\u003ctd>再把这套做法怎样运行铺开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明数据分析错误与难以复现的担忧，为增加统计审查提供理由。\u003c/td>\n\u003ctd>接着解释为什么要这样改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>写业内人士预计其他期刊会仿效这套统计检查机制。\u003c/td>\n\u003ctd>然后写有人预计它会扩散出去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>补充统计评审薄弱的行业背景，再用外部专家评价支持这项行动。\u003c/td>\n\u003ctd>再补一个背景并加入外部支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>肯定新增审查的价值，同时指出哪些稿件送审的筛选机制仍需完善。\u003c/td>\n\u003ctd>最后说做法有用但还留下缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A与全文各段完全同向：起点是《科学》新增统计检查，中间写具体机制、原因和同行反应，结尾再指出方案仍有改进空间。标题中的joins push还能覆盖“其他期刊已有类似行动”。\u003c/p>\n\u003cp>标题中的三个核心成分都能在全文找到：主体是“Science”，动作是“joins”，因为第一段明说其他期刊已有类似努力；任务是“screen statistics in papers”，对应新增统计检查、统计委员会和外部统计学家审阅。它不是只抓住某一句，而是概括整套政策。\u003c/p>\n\u003cp>结尾对方案弱点的保留也没有推翻这个标题。标题只说《科学》加入审查行动，并未声称机制已经完美；因此正面举措与后续改进空间可以同时容纳。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Professional Statisticians Deserve More Respect\u003c/h3>\n\u003cp>专业统计学家应得到更多尊重\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>专业统计学家应得到更多尊重\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>介绍《科学》开始提高专业统计学家地位的新安排，以回应他们应得到更多尊重的诉求。\u003c/td>\n\u003ctd>先说一方开始采取一种新做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写统计学家怎样获得发言权、参与决策和被正式认可，使尊重落实到制度中。\u003c/td>\n\u003ctd>再把这套做法怎样运行铺开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释统计贡献长期被低估怎样损害公平待遇，因此必须改变对专业人员的看法。\u003c/td>\n\u003ctd>接着解释为什么要这样改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>写专家预计提升统计学家尊重的办法将推广到其他出版机构。\u003c/td>\n\u003ctd>然后写有人预计它会扩散出去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>补充统计人员贡献与地位不相称的背景，并引用外界对提高尊重的支持。\u003c/td>\n\u003ctd>再补一个背景并加入外部支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>承认新安排改善了统计学家的处境，同时指出职业认可仍未覆盖到的环节。\u003c/td>\n\u003ctd>最后说做法有用但还留下缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>文章重心不是统计学家的职业尊重，而是期刊如何加强论文统计审查。专家被邀请是机制的一部分，不是全文要争取的社会地位。\u003c/p>\n\u003cp>统计学家在文中作为解决论文统计错误的一类专业人员出现，文章关心的是他们怎样参与评审、委员会怎样运作。没有工资、职业地位、被轻视经历或社会尊重程度的讨论。\u003c/p>\n\u003cp>若题目真以“deserve more respect”为中心，专家引语应不断证明统计学家被低估并呼吁改变待遇；实际引语都围绕论文质量和审查机制，B把手段当成了主题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Data Analysis Finds Its Way onto Editors’ Desks\u003c/h3>\n\u003cp>数据分析走上编辑办公桌\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>数据分析走上编辑办公桌\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>宣布数据分析开始进入编辑的日常工作议程，成为他们必须处理的事项。\u003c/td>\n\u003ctd>先说一方开始采取一种新做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>具体写数据材料如何进入编辑桌面、怎样由编辑组织分析与判断。\u003c/td>\n\u003ctd>再把这套做法怎样运行铺开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释编辑需要更深入接触数据的原因，将这一工作改变与出版责任相连。\u003c/td>\n\u003ctd>接着解释为什么要这样改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>写这种把数据分析纳入编辑工作的办法预计将被更多编辑部采用。\u003c/td>\n\u003ctd>然后写有人预计它会扩散出去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>补充编辑过去处理数据不足的背景，并引外界支持这种工作内容的扩展。\u003c/td>\n\u003ctd>再补一个背景并加入外部支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明数据分析进入编辑工作有用，同时指出编辑权限或能力仍有不足。\u003c/td>\n\u003ctd>最后说做法有用但还留下缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C抓住编辑工作与数据分析的联系，但文章的中心是《科学》加入统计审查行动，不是介绍数据分析如何成为编辑办公桌上的新工作。第2段把编辑标记、委员会找人、外部统计学家复核分开写，专业分析没有被压成编辑桌前的一项任务。\u003c/p>\n\u003cp>第3段交代广泛担忧和可重现性，第4、5段讨论同行仿效及统计评审，第6段评价筛选机制的不足。C能够碰到其中一个工作场景，却弱化了整篇反复推进的期刊统计审查改革及其行业意义。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Statisticians Are Coming Back with Science\u003c/h3>\n\u003cp>统计学家随《科学》重返舞台\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>统计学家随《科学》重返舞台\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>介绍《科学》新安排让曾经离开的统计学家重新回到科学出版工作。\u003c/td>\n\u003ctd>先说一方开始采取一种新做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>具体说明回归者进入哪些岗位、重新承担什么职责以及如何协作。\u003c/td>\n\u003ctd>再把这套做法怎样运行铺开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释过去统计学家离场造成的缺口，说明为什么现在需要他们回归。\u003c/td>\n\u003ctd>接着解释为什么要这样改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>写这次回归预计将带动其他期刊重新迎回统计专家。\u003c/td>\n\u003ctd>然后写有人预计它会扩散出去\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>补充统计学家过去退出与重新被需要的背景，再引专家欢迎他们归来。\u003c/td>\n\u003ctd>再补一个背景并加入外部支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>肯定回归已恢复部分专业作用，同时说明他们尚未完全重建原有位置。\u003c/td>\n\u003ctd>最后说做法有用但还留下缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>文章没有统计学家离开后回归的历史线，也没有“重新回来”的对比。D从新委员会里凭空补出一段回归故事。\u003c/p>\n\u003cp>“coming back”必须有“过去在场—后来离开—如今回归”的时间对比。全文只说新设委员会、邀请专家和提高统计评审，没有交代统计学家曾退出《科学》或科学出版。\u003c/p>\n\u003cp>此外，“with Science”语义模糊，既可能理解为随《科学》一起回归，也可能理解为回到科学领域；两种解释都没有全文支撑。D用戏剧化回归故事替代了实际的制度新增。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. A. Science Joins Push to Screen Statistics in Papers\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Science Joins Push to Screen Statistics in Papers / 《科学》加入论文统计审查行动\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be learned from Paragraph 1 that ______.\u003cbr>从第一段可以得知什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“从第一段可以得知什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt anno
