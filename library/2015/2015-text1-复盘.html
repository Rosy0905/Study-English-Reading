治放在同一原因位置，结尾又重复非政治服务；再把持续性扩成永久，作者提出警示的余地也被抹掉。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>due to their everlasting political embodiment<br>由于他们永久体现政治</p>\n</blockquote>\n<p>全文给欧洲君主的教训之一是理解制度延续的服务条件。D的永久政治代表性接不上结尾少争议、非政治元首的要求。</p>\n<p>第二、第三和第七段都把政治中立放在同一方向。D虽用了常见的政治词汇，对体现对象和时间程度的改写却破坏了贯穿全篇的理由。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. A. owing to their undoubted and respectable status</strong></p>\n</blockquote>\n<p>A保留少争议且受尊敬的人选条件；B新增平衡目的，C改成增加人物数量，D改坏政治方向与时间程度。</p>\n<h2>23题</h2>\n<blockquote>\n<p>Which of the following is shown to be odd, according to Paragraph 4?<br>根据第四段，下面哪一项被认为很奇怪？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干已给第四段，<code>odd</code> 是对原文 <code>bizarre</code> 的同义改写。真正要找的是作者把哪件事评为奇怪；段中的特权、不平等和继承财富，可能只是评价的背景。先读 <code>it is bizarre that</code> 后的完整命题，再用前句说明这种评价为什么成立。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<p>上一句给特权背景，末句的评价从句明确指出反常的角色。</p>\n<h3>A. Aristocrats&#39; excessive reliance on inherited wealth.</h3>\n<blockquote>\n<p>贵族过度依赖继承财富</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式虽未认出部分财富相关词，仍看出后半句评价的是富有贵族家庭在现代民主国家里的象征地位，没有把它读成贵族依赖财富的方式。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把 <code>inherited wealth</code> 与 <code>aristocratic families</code> 拼成“贵族过度依赖继承财富”。文章说的是继承财富的力量增强，这种时代背景没有提供贵族主动依赖财富的动作，更没有给出过度依赖的程度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族过度依赖继承财富这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>odd</code> 对应第四段末句 <code>bizarre</code>；<code>inherited wealth</code> 又在同句前半段出现。两者位置接近，尤其容易让人把前面的财富背景直接塞进后面的评价。</p>\n<p>整句先用 <code>At a time when</code> 交代不平等加剧、继承财富力量增强的时代，随后才用 <code>it is bizarre that</code> 评价富有贵族家庭仍是现代民主国家的象征核心。两部分各有作用，不能混在一起。</p>\n<p>A新增 <code>reliance</code>，说贵族依靠这种财富；又加 <code>excessive</code>，把依靠判为过度。原文的 <code>increasing power</code> 修饰继承财富的社会力量，没有说明贵族怎样取得生活来源或对遗产依赖多深。</p>\n<p>因此，A没有准确改写背景，还造出了一个新的评价对象。原文的“财富力量上升时，贵族却仍居国家象征中心”，被替换为“贵族过度依赖财富很奇怪”。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>作者评价贵族家庭仍处于民主国家象征核心，下一段顺着这种矛盾写王室如何放弃或掩饰贵族做派。</p>\n</blockquote>\n<p>第四段把财富问题接到制度角色上，第五段于是讨论王室形象怎样调整。这条后续路线关心王室如何面对公众，不需要分析贵族家庭的收入依赖程度。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>At a time of rising inequality, it is bizarre that aristocratic families should rely so excessively on inherited wealth.</p>\n<p>在不平等加剧的时代，贵族家庭竟如此过度依赖继承财富，这很奇怪。</p>\n</blockquote>\n<p>假设把 <code>bizarre</code> 后的对象改成过度依赖财富，A才得到直接支持。实际句中的对象却是 <code>the symbolic heart of modern democratic states</code>；随后讨论形象调整，也没有补写遗产依赖。两个版本评价的事情不同。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>Aristocrats&#39; excessive reliance on inherited wealth.<br>贵族过度依赖继承财富</p>\n</blockquote>\n<p>A与主旨共享王室、财富这些话题，却把制度是否适应现代社会，收窄成贵族家庭如何依赖财产。标题不能替它补出依赖程度。</p>\n<p>全文的继承特权批评固然涉及财富，第四段具体说奇怪的仍是贵族所占的象征角色。A新增的动作与程度没有局部证据，无法通过主旨验证。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. The role of the nobility in modern democracies.</h3>\n<blockquote>\n<p>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定B。当时选项是 <code>The role of the [xxx] in modern democracies.</code>，<code>nobility</code> 被遮挡，但 <code>role</code>、<code>modern democracies</code> 与贵族家庭的民主国家象征地位能接上。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>B用 <code>nobility</code> 概括 <code>wealthy aristocratic families</code>，以 <code>role</code> 概括其充当 <code>symbolic heart</code> 的作用，以 <code>modern democracies</code> 对应 <code>modern democratic states</code>。词更短了，评价的主体、角色及制度环境都没有变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族在现代民主制度中的角色被认为很奇怪。</p>\n</blockquote>\n<p>用 <code>odd</code> 找到 <code>it is bizarre that</code>，再完整读出后面的内容。B中的 <code>modern democracies</code> 对应同句末尾 <code>modern democratic states</code>，因此不必凭贵族一词去别段兜圈。</p>\n<p>从句主体是 <code>wealthy aristocratic families</code>，它们 <code>should still be</code> 民主国家的 <code>symbolic heart</code>。这个表语说的是它们扮演什么公共角色，正是B的 <code>role</code> 所概括的部分。</p>\n<p>上一句说明它们的历史和部分当下行为体现过时特权与不平等；下一句把这种贵族身份放进现代民主制度，突出不协调。<code>still</code> 强调这种角色仍保留到现代，不能漏掉这个对照。</p>\n<p>B抽象了角色名称，却保留谁处在什么制度里这一组关系。读成贵族在民主国家里的象征作用，就能把背景批评与直接评价连起来，没有转成财富来源或生活方式。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>作者先批评历史特权，再质疑贵族家庭的民主国家象征角色，随后写王室努力淡化贵族做派。</p>\n</blockquote>\n<p>后一段的形象调整接着前一段的角色冲突：既要担任现代国家象征，又带着旧贵族身份，就需要让公众看到与传统特权不同的样子。这让第四段的评价对象更清楚。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that the nobility should still occupy such a central symbolic role in modern democracies.</p>\n<p>贵族在现代民主制度中竟仍占据如此核心的象征角色，这很奇怪。</p>\n</blockquote>\n<p>假设只把长表达收短：贵族家庭换成贵族，象征核心换成核心象征角色，现代民主国家换成现代民主制度。B需要的评价在原文已经出现，下一段的应对也继续围绕这个角色矛盾展开。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>B实际说的是：</p>\n<blockquote>\n<p>The role of the nobility in modern democracies.<br>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p>B把回答放在王室与现代制度的关系上，符合主旨要求找出的制度矛盾。西班牙事件之所以能给其他欧洲君主上课，正因为这种冲突并不限于卡洛斯个人。</p>\n<p>主旨只负责确认这层范围；第四段的 <code>bizarre</code> 从句才直接确认贵族的象征角色是评价对象。B在抽象时没有丢掉这一对象，因而能同时接上局部与全篇。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. The simple lifestyle of the aristocratic families.</h3>\n<blockquote>\n<p>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式看到第四段写富有、特权与不平等，没有将王室的简朴形象当作该段明确说奇怪的内容。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>C容易借到第五段王子公主有日常工作、骑自行车的细节。那些细节确实展现了较普通的公共形象，但题干锁定第四段被评价为奇怪的事情；把下一段的生活细节搬来回答，换了范围和评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族家庭的简朴生活方式被认为很奇怪。</p>\n</blockquote>\n<p><code>simple lifestyle</code> 最接近第五段的 <code>day-jobs</code>、<code>ride bicycles</code>。然而题干明确写 <code>according to Paragraph 4</code>，第四段的判断点是 <code>bizarre</code>，所以需要把这两个落点分开。</p>\n<p>第五段用工作、自行车说明王室努力淡化贵族做派。这可以支持一种较普通的外在生活形象，却没有说作者认为这种形象奇怪。</p>\n<p>第四段的评价从句谈 <code>wealthy aristocratic families</code> 仍处在 <code>modern democratic states</code> 的象征中心。它质疑一种制度角色，并未把“生活简朴”放在被评价的位置；<code>wealthy</code> 也提醒我们不可把形象直接当作全面生活事实。</p>\n<p>C抓到了后文可辨认的生活细节，却用它替换本段的制度评价。即便承认骑车和日常工作较朴素，也不能把“这些细节存在”再推成“第四段说它们奇怪”。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>第四段说贵族仍居民主国家象征中心很奇怪；下一段介绍放弃或隐藏旧贵族做派的努力，并举工作和骑车为例。</p>\n</blockquote>\n<p>文章由制度矛盾转向王室的应对，普通形象是针对矛盾作出的调整。段落位置决定了它在论证中的职责，不能把应对措施倒放进前一段的批评结论。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that wealthy aristocratic families should lead such simple lives.</p>\n<p>富有的贵族家庭竟过着如此简朴的生活，这很奇怪。</p>\n</blockquote>\n<p>这句假设必须让 <code>bizarre</code> 直接评价简朴生活。实际评价对象是象征核心，简朴形象到下一段才以应对方式出现。二者相邻，却承担不同功能；把段落顺序抹掉，才会误以为C也在回答同一件事。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>The simple lifestyle of the aristocratic families.<br>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p>主旨中的教训要解释现代君主制的矛盾与应对。C选择的是后文一种应对形象，题干问的却是第四段所指出的矛盾本身。</p>\n<p>全文没有把简朴生活当作需要警惕的毛病。相反，作者承认王室在努力调整，又指出财富与媒体让形象难维持。C的细节有来处，回答的层次和位置却不对。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. The nobility&#39;s adherence to their privileges.</h3>\n<blockquote>\n<p>贵族坚持自己的特权</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式虽在第四段找到 <code>privileges</code>，仍区分了体现特权的历史背景与末句真正评价的贵族角色，没有把前者直接当答案。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D复用 <code>privileges</code>，把历史及行为“体现特权”写成贵族“坚持特权”，再把这一新动作放到奇怪的评价下。原文批评特权，却没有明说贵族拒绝放弃它的行动过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族坚持自己的特权这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>privileges</code> 对应第四段第二句，这是D最像原文的地方。题干问 <code>odd</code>，还必须继续读末句 <code>it is bizarre that</code>，看这个评价落在哪里。</p>\n<p>第二句的主语是王室的历史，有时也包括其当下行为；<code>embodies</code> 表示体现过时且站不住脚的特权与不平等。这里描述一种历史和行为的性质。</p>\n<p>D用 <code>adherence</code> 加入坚持、固守的动作，由贵族主动对特权表明态度。体现某种特权，与被告知应放弃后仍坚持，所需证据不同；不能只因都出现特权就互换。</p>\n<p>末句明确评价的又是贵族家庭仍作民主国家象征核心。D既把性质描述改成未写出的坚持动作，又替换了 <code>bizarre</code> 的对象，因此没有形成完整出处支持。</p>\n<h4>写作视角法</h4>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>历史及行为体现特权，贵族仍居民主国家象征中心显得反常；后面写成功王室努力放弃或掩饰旧做派。</p>\n</blockquote>\n<p>作者由历史遗留的特权转到现代角色，再写王室尝试调整形象。后文有的还是放弃或隐藏旧做派的努力，不能反过来补成贵族集体坚持特权的明示事实。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that the nobility should insist on retaining their privileges.</p>\n<p>贵族竟坚持保留自己的特权，这很奇怪。</p>\n</blockquote>\n<p>D需要 <code>insist on retaining</code> 这种主动坚持，并要让作者直接评价这个动作。原文用的是历史和行为 <code>embodies</code>，末句转向象征地位。后段虽未说实际特权都被消除，也没有提供D所要求的坚持过程。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>The nobility&#39;s adherence to their privileges.<br>贵族坚持自己的特权</p>\n</blockquote>\n<p>特权确实属于这堂课讨论的矛盾，D因此容易显得合题。可主旨只说明这个话题重要，不会把体现特权自动变成坚持特权。</p>\n<p>本题仍须回到第四段的明确评价：富有贵族家庭扮演现代民主国家象征核心。D把支撑评价的背景词加工成新动作，完整命题未获原文支持。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. B. The role of the nobility in modern democracies.</strong></p>\n</blockquote>\n<p>A新增过度依赖，C挪用后段生活细节，D新增坚持特权的动作；B保留贵族在现代民主国家中的象征角色。</p>\n<h2>24题</h2>\n<blockquote>\n<p>The British royals “have most to fear” because Charles ______.<br>英国王室“最需要担心”，是因为查尔斯怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>因果细节题。题干引用第六段 <code>have most to fear</code>，再用 <code>because Charles</code> 要求解释英国为何特别值得担忧。第六段点出英国，第七段先以女王作对照，再描述查尔斯的品味、等级观念及对元首服务角色的误解；这是一条跨段原因链。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>It is only the Queen who has preserved the monarchy&#39;s reputation with her rather ordinary (if well-heeled) granny style.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n<p>第六段提出英国风险，第七段以女王对照查尔斯，并明确服务要求；原因要跨句合起来。</p>\n<h3>A. takes a tough line on political issues</h3>\n<blockquote>\n<p>在政治问题上采取强硬立场</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式看到查尔斯的世界观和角色理解问题，未读到他在具体政治问题上采取强硬立场的行为。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借用 <code>hierarchical view</code> 与 <code>non-political</code>，把等级观念和对职责的误解变成已经采取强硬政治立场。原文提供思想与角色问题，却没有报告相应的政治议题或强硬态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯在政治问题上采取强硬立场。</p>\n</blockquote>\n<p>题干的 <code>Charles</code> 对应第七段 <code>The danger will come with Charles</code>。A的 <code>political issues</code> 容易让人想到下句 <code>non-political</code>，但还要找 <code>takes a tough line</code> 是否有对应。</p>\n<p>原文列两种特征：昂贵的生活品味与相当等级化的世界观。接着解释他未理解现代王室依靠少争议、非政治元首服务而存续。</p>\n<p><code>hierarchical</code> 说他如何看社会等级，<code>tough line</code> 说他在政治问题上如何表态或处理。前者不能自动推出后者；对非政治角色理解不足，也不等于已经在某个议题上态度强硬。</p>\n<p>A缺的是具体行为和态度这一层，不能由同句出现政治二字补出。原文可以支持查尔斯不适应角色，却没有给出他采取强硬政治路线的事实。</p>\n<h4>写作视角法</h4>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>作者写查尔斯的昂贵品味、等级观念和角色误解，结尾据此提醒王室最大的危险可能来自君主本人。</p>\n</blockquote>\n<p>作者从个人特征进入服务条件，再总结内部风险，没有举查尔斯参与政治争议的事例。最后的警告仍停留在如何理解并履行君主角色这一条线上。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The danger will come with Charles, who takes a tough line on political issues rather than remaining politically neutral.</p>\n<p>危险将随查尔斯而来：他在政治问题上立场强硬，未保持政治中立。</p>\n</blockquote>\n<p>假设需要直接写政治立场强硬，才能把A和危险连成因果。实际写法直接陈述的则是品味、世界观与未理解服务角色。两条路线可能在现实中相关，但原文未完成从观念到强硬政治行为的那一步。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>takes a tough line on political issues<br>在政治问题上采取强硬立场</p>\n</blockquote>\n<p>A看似顺着主旨，因为非政治服务确实是王室存续条件。但与主旨相关的行为不一定就是查尔斯在文中已经做过的行为。</p>\n<p>标题只能让我们预期某种内部风险；第七段给的是角色理解不足。用这项不足补出强硬政治立场，仍超出了明示证据。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. fails to change his lifestyle as advised</h3>\n<blockquote>\n<p>没有按照建议改变生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式找到查尔斯昂贵的生活品味，但没有看到有人提出建议，也没有看到他不按建议改变的过程。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住 <code>lifestyle</code> 和 <code>fails</code>，加入 <code>as advised</code>。原文的未能理解被改写为未遵照建议改变，凭空多出一次建议及其未被采纳的过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯没有按照建议改变生活方式。</p>\n</blockquote>\n<p><code>lifestyle</code> 在第七段直接出现，确实属于查尔斯的问题特征。接着要核对B中控制整句话的 <code>fails to change ... as advised</code>，它要求的不止是他生活昂贵。</p>\n<p>出处先写 <code>has ... an expensive taste of lifestyle</code>，报告一种既有品味；下句 <code>failed to understand</code> 的宾语是君主制为何存续，并没有变成关于改变生活的建议。</p>\n<p>B要成立，至少须有“提出过改变建议—他未依此改变”的信息。原文没有明示这种劝告发生，也没有对照劝告前后生活状态；把作者现在的批评当成他过去收到过的建议，时间与关系都被补写了。</p>\n<p>因此，生活方式这一名词虽对得上，B的完整动作链对不上。文章支持他的品味与现代角色不协调，不能再加上曾被劝告却不照做。</p>\n<h4>写作视角法</h4>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>昂贵品味与等级观念构成风险，作者随后把问题归到他不理解现代君主的服务作用。</p>\n</blockquote>\n<p>后一处把前面的两项特征放进角色标准中解释。它没有插入劝告情节，也没有把查尔斯是否听取他人建议设成判断重点。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles has been advised to change his expensive lifestyle but has failed to do so.</p>\n<p>查尔斯曾被建议改变昂贵的生活方式，却没有这样做。</p>\n</blockquote>\n<p>这句假设保留昂贵生活，但增加B必需的已给建议和未改事实。实际只描述现状，随后讨论角色认识，缺少这两环。不能因为改善生活方式听起来合理，就把劝告已发生当作作者报告的事实。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>fails to change his lifestyle as advised<br>没有按照建议改变生活方式</p>\n</blockquote>\n<p>全文确实给王室提出警示，但文章本身在警示，不等于查尔斯此前已收到并拒绝生活方式建议。B把主旨中的教训误变成了人物经历。</p>\n<p>题干要查尔斯为何构成内部危险，末段用角色理解不足回答。B虽提到生活方式，却让没有出处的建议过程承担了因果解释。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. takes republicans as his potential allies</h3>\n<blockquote>\n<p>把共和派视为潜在盟友</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已读懂结尾把国王而非共和派列为王室最大敌人，没有把“共和派不是最大敌人”转成查尔斯视其为盟友。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借用结尾的 <code>not republicans</code>，把“共和派不是最坏敌人”反推成“共和派是潜在盟友”，还将作者的评论移成查尔斯本人的判断。关系和观点持有者都变了。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯把共和派视为自己的潜在盟友。</p>\n</blockquote>\n<p><code>republicans</code> 直接定位第七段末句。原文完整对照是 <code>it is kings, not republicans, who are the monarchy&#39;s worst enemies</code>，需要连同比较程度和判断主体一起读。</p>\n<p>作者提醒查尔斯：从英国历史看，对君主制危害最大的可能是国王自身。<code>not republicans</code> 排除的是共和派占据“最坏敌人”这一位置，没有否认他们可能反对君主制。</p>\n<p>C用 <code>potential allies</code> 跨到了潜在盟友。不是最危险的敌人，还可以是较弱的对手、中立者等，并不必然成为盟友；原文没有合作或结盟信息。</p>\n<p>再看谁在判断：<code>Charles ought to know</code> 是作者认为查尔斯应懂的道理，C却声称查尔斯已经把某些人视作盟友。这样把作者的提醒变成人物现有看法，也改变了原句。</p>\n<h4>写作视角法</h4>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>查尔斯未理解王室的服务条件，作者提醒他，国王自己往往才是君主制最大的敌人。</p>\n</blockquote>\n<p>结尾把危险从外部共和派转回王室内部，回应查尔斯自身的问题。整个收束不需要一段查尔斯结盟共和派的故事。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles regards republicans as potential allies, and this mistaken alliance could endanger the monarchy.</p>\n<p>查尔斯把共和派看作潜在盟友，而这种错误的结盟可能危及王室。</p>\n</blockquote>\n<p>C成立时，文章必须先报告查尔斯的盟友判断，才能解释它造成什么危险。实际用了 <code>ought to know</code> 提醒他认识内部威胁；共和派只在敌人程度对照中出现，没有变成他计划合作的人。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>takes republicans as his potential allies<br>把共和派视为潜在盟友</p>\n</blockquote>\n<p>主旨把西班牙教训传给欧洲王室，结尾进一步指明成员自身可能毁坏制度。C把这条内部警示改成了对外联盟风险，换掉了作者最后收束的关系。</p>\n<p>尤其不能从不是最坏敌人跳到潜在盟友，再把作者判断放进查尔斯头脑里。全篇教训与局部句子共同指出这种双重改写。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. fails to adapt himself to his future role</h3>\n<blockquote>\n<p>未能使自己适应未来角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定D。选项当时为 <code>fails to [xxx] himself to his future role</code>，<code>adapt</code> 被遮挡；做题模式仍从 <code>failed to understand</code> 和国家元首服务要求，看出他与未来角色不相适应。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>D把生活品味、等级观念以及未理解服务条件三处信息概括成未来角色适应不足。<code>future role</code> 指未来君主的国家元首职责；<code>fails to adapt</code> 概括前文特征与这一职责不匹配。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯未能使自己适应未来角色。</p>\n</blockquote>\n<p>第六段 <code>British royals ... have most to fear</code> 是题干原词，下一段 <code>The danger will come with Charles</code> 指出具体风险人物。需要把这两句接起来，再找危险缘由。</p>\n<p>后文先写查尔斯的昂贵品味、等级化世界观，再写 <code>He has failed to understand</code> 王室存续是因为提供服务。破折号后把服务明确为少争议、非政治的国家元首职责。</p>\n<p>这三层各有分工：品味与观念给人物特征，未理解给出缺口，元首服务说明应适应的角色。D用 <code>future role</code> 收束职责，用 <code>fails to adapt himself</code> 概括人物特征与职责之间的差距。</p>\n<p>这里无需补一次拒绝建议或强硬政治行动。原文已经给出角色标准及查尔斯没有理解标准的事实，D是在这些事实之间作最小概括，因而能回答英国为何面临特别风险。</p>\n<h4>写作视角法</h4>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>It is only the Queen who has preserved the monarchy&#39;s reputation with her rather ordinary (if well-heeled) granny style.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>女王以普通的公共形象保住声誉；查尔斯的昂贵品味、等级观念和角色误解形成对照，结尾再警告内部威胁。</p>\n</blockquote>\n<p>女王与查尔斯并排，显示不同角色理解可能怎样影响王室声誉。作者随后把这组个人对照提升为制度教训，查尔斯是尚未学会这堂课的警示对象。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles has failed to adapt to the restrained, non-political role on which the monarchy&#39;s survival depends.</p>\n<p>查尔斯未能适应王室存续所依赖的那种克制、非政治的角色。</p>\n</blockquote>\n<p>这段假设把前面的特征和后面的服务条件连成一句，没有添加新的经历。女王的相对普通形象说明怎样能维护声誉，查尔斯的特征与职责认识说明为何担忧，正好支持D的角色适应概括。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>fails to adapt himself to his future role<br>未能使自己适应未来角色</p>\n</blockquote>\n<p>D把查尔斯的问题放在现代君主必须学会的服务角色上，能够解释为什么卡洛斯的教训尤其值得英国王室警惕。它与全篇由案例到制度、再回到内部风险的推进一致。</p>\n<p>具体支持仍来自末段：人物特征、未理解与角色要求相连。主旨确认这是欧洲共同教训的一部分，局部证据确认查尔斯适应不足的具体含义。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. D. fails to adapt himself to his future role</strong></p>\n</blockquote>\n<p>A新增强硬政治立场，B新增未遵劝告的过程，C改坏敌我关系与观点主体；D概括特征、认识与未来职责之间的差距。</p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：西班牙国王退位引发的思考</strong>（段落1核心事件） 胡安·卡洛斯的转变：【曾坚持&quot;国王不退位，死在睡梦中&quot; → 因丑闻和共和派压力被迫退位】→ 引发质疑：（西班牙危机是否预示君主制末日？）→（是否所有欧洲皇室都将终结？）</p>\n<p>↓（案例分析）</p>\n<p><strong>逻辑层次2：君主制的双面性</strong>（段落2-3利弊分析） 积极面：当社会两极分化时可超越政治体现国家团结（如佛朗哥政权后）→ 欧洲君主制现状：【除中东外世界君主最多地区（10个王国）// 与海湾亚洲专制君主不同：让选民避免寻找无争议但受尊敬公众人物的困难】</p>\n<p>//（转折：负面因素）</p>\n<p><strong>逻辑层次3：君主制的内在矛盾</strong>（段落4-5现代困境） 根本矛盾：【声称象征国家团结 // 实际体现过时特权和不平等】→ 时代背景：皮凯蒂等警告财富不平等加剧时，贵族家庭仍是民主国家象征核心（奇怪）→ 应对策略：（成功君主制努力隐藏贵族方式：王子公主有工作、骑自行车）// 但仍与1%精英交往，媒体使维持形象困难</p>\n<p>↓（具体警示）</p>\n<p><strong>逻辑层次4：英国皇室的特殊危机</strong>（段落6-7英国案例） 英国最应从西班牙例子中担忧 → 现状对比：【女王以普通老奶奶风格维持声誉 // 查尔斯：昂贵生活品味+等级化世界观】→ 查尔斯的失误：未理解君主制存续因提供无争议、非政治的元首服务 → 历史教训：是国王而非共和派才是君主制最大敌人</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：欧洲君主制面临现代性挑战，需要在保持象征性地位和适应民主价值观之间找到平衡。西班牙国王的退位为所有欧洲君主敲响警钟，特别是英国的查尔斯王子，他必须理解君主制的存续依赖于提供无争议的公共服务，而非坚持贵族特权。</p>\n<h2>小标题题</h2>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A Symbol Above Party Conflict</p>\n<p>B. The Limits of Looking Ordinary</p>\n<p>C. A Spanish Warning for Other Crowns</p>\n<p>D. How Elections Choose Better Monarchs</p>\n<p>E. Inherited Privilege in a Democratic Age</p>\n<p>F. The Public Service Bargain</p>\n<p>G. A Debate About Wealth Alone</p>\n<p><strong>41.</strong> When a king who once insisted that kings did not abdicate was forced to step down, the embarrassment could hardly remain a private family matter. Juan Carlos&#39;s retreat followed scandals and the growing strength of the republican left. Yet the important question reached beyond the man who had lost his position. If a crown could no longer rely on past authority to protect its reputation, other European royal households had reason to examine their own conduct. Spain did not prove that every monarchy was about to disappear. It showed how one royal failure could expose a problem that neighbouring crowns also needed to consider.</p>\n<p><strong>42.</strong> There are reasons why those crowns have not simply vanished. In a society divided by party loyalties, the person who wins an election may remain unacceptable to a large part of the population. A monarch can sometimes offer a different kind of representation: continuity that is not identified with the victory of one party over another. This was one of the arguments for the institution in Spain after deep political division. The claim is limited. Royal birth does not guarantee wisdom or fairness. It may, however, allow a public figure to stand for the country while elected politicians argue over its government.</p>\n<p><strong>43.</strong> That position brings an obligation as well as an advantage. Citizens who accept a hereditary head of state are not necessarily inviting a royal family to govern according to personal preference. They may accept the arrangement because it saves another difficult search for a respected, relatively uncontroversial representative. In return, the monarch is expected to perform a public service with restraint. Private importance must not be mistaken for political authority. Once a royal figure treats the office as a personal entitlement, the exchange becomes harder to defend: the public is asked to accept the privileges while receiving less of the service that justified them.</p>\n<p><strong>44.</strong> Even a monarch who observes this restraint cannot remove every contradiction. The symbolic centre of a modern democracy is still occupied by a family whose position is inherited. Its wealth and history may embody inequalities that the political community claims to question. Concerns about inherited fortunes make that contrast more visible, but the argument does not end with the size of a bank account. It asks why birth should confer a special public role in a society that values equal standing. The difficulty therefore survives even when a particular king or queen is personally respected and careful to avoid political controversy.</p>\n<p><strong>45.</strong> Royal households have tried to make this distance less visible. Ordinary jobs, bicycles and informal appearances can suggest that princes and princesses share the lives of other citizens. Such gestures may help, but they do not erase wealth, elite friendships or assumptions about rank. Persistent media attention makes any gap between the presented image and private habits harder to conceal. An apparently ordinary style can protect a reputation only while conduct remains compatible with it. The danger comes when looking like a modest public servant is treated as a substitute for understanding the role. A carefully arranged photograph cannot settle that larger problem.</p>\n<h3>小标题题 · 41题</h3>\n<p><strong>答案：C. A Spanish Warning for Other Crowns / 给其他王室的西班牙警告</strong></p>\n<p>这一部分从卡洛斯难堪退位写起，随即把事件的适用范围扩大到其他欧洲王室。首句是事件，中心动作是把西班牙的事变成别国也要面对的警告。</p>\n<blockquote>\n<p>Yet the important question reached beyond the man who had lost his position.</p>\n<p>Spain did not prove that every monarchy was about to disappear.</p>\n<p>It showed how one royal failure could expose a problem that neighbouring crowns also needed to consider.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>个人退位 → 问题超出个人 → 不断言全部君主制终结 → 提醒其他王室检查自身。</p>\n</blockquote>\n<p>C的 <code>Spanish</code> 对应西班牙退位案例，<code>Warning</code> 对应需要检查自身行为，<code>Other Crowns</code> 对应其他欧洲及邻国王室。标题既有案例来源，又有这一案例在段中的功能。</p>\n<p>G会被丑闻与名誉危机吸引，但段落没有把事件收束成财富争论。它反复扩大到其他王室，且明确否定由一件事断言全体消亡；C能够覆盖这层范围变化。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p><strong>答案：A. A Symbol Above Party Conflict / 超越党派冲突的象征</strong></p>\n<p>这一部分回答王室为何没有消失，提出它可能在党派分裂中代表国家。选举被提到，是为了对比党派胜利与超越党派的连续性。</p>\n<blockquote>\n<p>In a society divided by party loyalties, the person who wins an election may remain unacceptable to a large part of the population.</p>\n<p>A monarch can sometimes offer a different kind of representation: continuity that is not identified with the victory of one party over another.</p>\n<p>It may, however, allow a public figure to stand for the country while elected politicians argue over its government.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>党派分裂 → 选举胜者未必获全民认可 → 君主可能提供另一种代表性 → 有限承认超越党争的国家象征。</p>\n</blockquote>\n<p><code>Symbol</code> 对应代表国家与连续性，<code>Above Party Conflict</code> 对应不与某一党的胜利绑定。标题没有把 <code>can sometimes</code> 扩大成君主永远公平、永无争议。</p>\n<p>D借到了 <code>election</code>，但写成选举选出更好的君主。段里选出的是政界胜者，王室提供的是与这种竞争不同的代表方式；既没有选君主，也没有比较哪个君主更好。</p>\n<p><strong>42题选A。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p><strong>答案：F. The Public Service Bargain / 公共服务的交换条件</strong></p>\n<p>这一部分在已说明的代表位置上加上条件：公众接受世袭安排，以换取克制的公共服务。后半段说明如果只享特权不尽服务，这种安排就难以辩护。</p>\n<blockquote>\n<p>That position brings an obligation as well as an advantage.</p>\n<p>In return, the monarch is expected to perform a public service with restraint.</p>\n<p>Once a royal figure treats the office as a personal entitlement, the exchange becomes harder to defend: the public is asked to accept the privileges while receiving less of the service that justified them.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>接受现有人选有便利 → 与之相应有义务 → 以克制服务交换公众认可 → 服务不足会破坏交换。</p>\n</blockquote>\n<p><code>Public Service</code> 对应克制履职，<code>Bargain</code> 对应 <code>In return</code> 与末句 <code>exchange</code>。两个部分共同概括这一段的条件关系，不能只看见公众人物就停在角色名称上。</p>\n<p>A也谈国家代表性，是最容易混的项，但那是前一部分已经建立的位置。本部分用 <code>obligation</code>、<code>In return</code> 和失衡后果向前推进，重点在公众与君主各付出什么、条件如何维持；A少了这种交换。</p>\n<p><strong>43题选F。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p><strong>答案：E. Inherited Privilege in a Democratic Age / 民主时代的继承特权</strong></p>\n<p>这一部分让步承认君主可能克制且受尊敬，仍继续指出世袭身份与现代民主平等之间的矛盾。财富让反差更明显，却没有穷尽问题。</p>\n<blockquote>\n<p>Even a monarch who observes this restraint cannot remove every contradiction.</p>\n<p>The symbolic centre of a modern democracy is still occupied by a family whose position is inherited.</p>\n<p>It asks why birth should confer a special public role in a society that values equal standing.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>履职克制仍不够 → 民主核心由世袭家族占据 → 财富扩大反差 → 追问出生为何授予特殊公共角色。</p>\n</blockquote>\n<p><code>Inherited Privilege</code> 包括由出身获得的特殊位置及财富历史，<code>Democratic Age</code> 对应民主共同体的平等原则。标题把矛盾两端都保留了。</p>\n<p>G只抓财富，然而段中明确写 <code>does not end with the size of a bank account</code>，随后转向出生和公共角色。把 <code>alone</code> 放进标题会删掉整段最终落下的制度问题。</p>\n<p><strong>44题选E。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p><strong>答案：B. The Limits of Looking Ordinary / 看起来普通的局限</strong></p>\n<p>这一部分先写王室怎样显得普通，再用财富、交往与媒体揭示形象调整的限度，结尾区分看起来像服务者与真正理解职责。</p>\n<blockquote>\n<p>Ordinary jobs, bicycles and informal appearances can suggest that princes and princesses share the lives of other citizens.</p>\n<p>Such gestures may help, but they do not erase wealth, elite friendships or assumptions about rank.</p>\n<p>A carefully arranged photograph cannot settle that larger problem.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>普通化形象 → 承认有帮助 → 现实差距仍在且更易曝光 → 外观不能替代职责理解。</p>\n</blockquote>\n<p><code>Looking Ordinary</code> 对应日常工作、自行车与随和露面，<code>Limits</code> 对应这些姿态无法抹掉差距、无法替代履职认识。标题同时包括前面的做法和后面的转折。</p>\n<p>F与末尾的公共服务有联系，但本段没有重新建立公众接受与王室服务的交换。它在检验普通外观能解决多少问题；只用F会遗漏媒体、照片与形象差距这一整条推进。</p>\n<p><strong>45题选B。</strong></p>\n<h2>排序题</h2>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p><strong>A.</strong> King Juan Carlos&#39;s abdication turned a family embarrassment into a European question. Scandals and the advance of the republican left had forced him to abandon his old claim that kings did not step down. If one established crown could lose authority so quickly, was the problem merely Spanish, or did it reveal a danger shared by other monarchies?</p>\n<p><strong>B.</strong> Many royal households responded to this conflict between inherited privilege and democratic equality by making royalty look less royal. Princes and princesses took ordinary jobs, rode bicycles and presented themselves as useful citizens. These gestures were attempts to show that service, rather than aristocratic distance, defined the modern crown.</p>\n<p><strong>C.</strong> Britain had been protected by a queen whose public manner appeared ordinary and dutiful. The greater risk lay with Charles: expensive tastes and a hierarchical outlook suggested that he had not fully accepted the limited, non-political service expected of a future king. His difficulty gave the Spanish warning a specific British target.</p>\n<p><strong>D.</strong> The answer was not that every crown had reached its final day. Spain itself showed why monarchy could still be useful: after a period of deep political division, a figure placed above ordinary party competition could represent national continuity. The institution retained a function even while a particular king had failed.</p>\n<p><strong>E.</strong> Yet this justification based on public service left a central contradiction unresolved. An office meant to symbolize a democratic nation was inherited by a wealthy family. At a time of concern about inequality and inherited fortunes, the old privileges attached to royalty could make the symbol look hostile to the values it was supposed to unite.</p>\n<p><strong>F.</strong> Image management nevertheless became harder under continuous media scrutiny. Wealthy families could not forever conceal elite friendships, costly tastes or private assumptions about rank. The fall of a carefully protected reputation in Spain therefore pointed directly toward the monarchy across the Channel.</p>\n<p><strong>G.</strong> That function, however, depended on restraint. Modern monarchs survived when citizens regarded them as respected and relatively non-political heads of state. Their place was justified as a service that saved voters from another divisive contest, not as a licence to rule according to personal preference.</p>\n<p><strong>H.</strong> The final lesson of this British comparison was therefore internal rather than revolutionary. Republicans might criticize a monarchy, but a monarch who ignored the bargain of restraint could damage it more effectively than any outside opponent. European crowns would survive only if their own members understood that fact.</p>\n<p><strong>A　41. _____　42. _____　E　43. _____　44. _____　45. _____　H</strong></p>\n<h3>排序题 · 全局解析</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>卡洛斯退位，提出西班牙是否暴露欧洲共同危险的问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>回应继承特权与民主平等冲突，用普通化形象显示服务</td>\n</tr>\n<tr>\n<td>C</td>\n<td>给出英国女王与查尔斯的对照，落下英国风险</td>\n</tr>\n<tr>\n<td>D</td>\n<td>回应A的问题，承认君主制仍有国家连续性的功能</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转向公共服务理由仍未消除的世袭特权矛盾</td>\n</tr>\n<tr>\n<td>F</td>\n<td>转写媒体下的形象困难，并将西班牙警告推向英国</td>\n</tr>\n<tr>\n<td>G</td>\n<td>承接功能，说明克制且非政治的服务条件</td>\n</tr>\n<tr>\n<td>H</td>\n<td>从英国比较收束到君主自身造成的内部威胁</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>退位提出问题 → 回答仍有用途 → 解释服务条件 → 转向世袭矛盾 → 王室调整形象 → 媒体揭出难处并转向英国 → 英国人物对照 → 内部教训</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → G → E → B → F → C → H</strong></p>\n<p>41—45：D、G、B、F、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41紧接已知首段A。A已提出问题，后面还须经42接到已知E，故这里先寻找直接回答，而非抢先进入最终结论。</p>\n<p>前段A的结尾：</p>\n<blockquote>\n<p>If one established crown could lose authority so quickly, was the problem merely Spanish, or did it reveal a danger shared by other monarchies?</p>\n</blockquote>\n<p>候选D的开头：</p>\n<blockquote>\n<p>The answer was not that every crown had reached its final day.</p>\n</blockquote>\n<p>后段G的开头：</p>\n<blockquote>\n<p>That function, however, depended on restraint.</p>\n</blockquote>\n<p>D的 <code>The answer</code> 直接承接A末问句，先否定全部王室终结，再说明国家连续性这一功能。D末尾 <code>a function</code> 又给下一候选G的 <code>That function</code> 提供明确先行词；两侧都能接上。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>A提出欧洲范围问题 → D回答并提出仍有功能 → G解释该功能需要克制。</p>\n</blockquote>\n<p>C虽也写别国王室，却直接从英国女王与查尔斯起笔，不能回答A的整个欧洲问题，也不给G的功能回指提供足够承接。A后过早进入英国个案，会跳过E之前所需的公共服务理由。</p>\n<p><strong>41题选D。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>41确定D后，42位于D与已知E之间。这里要把D的制度功能推进到E提到的公共服务理由。</p>\n<p>前段D的结尾：</p>\n<blockquote>\n<p>The institution retained a function even while a particular king had failed.</p>\n</blockquote>\n<p>候选G的开头：</p>\n<blockquote>\n<p>That function, however, depended on restraint.</p>\n</blockquote>\n<p>后段E的开头：</p>\n<blockquote>\n<p>Yet this justification based on public service left a central contradiction unresolved.</p>\n</blockquote>\n<p><code>That function</code> 精确回收D末的 <code>a function</code>。G先解释克制、非政治元首服务，末句用 <code>justified as a service</code> 说明正当性；E的 <code>this justification based on public service</code> 再回收它，随后转入继承特权矛盾。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>仍有功能 → 功能须以克制服务为条件 → 即使这种理由成立，继承特权的矛盾仍未解决。</p>\n</blockquote>\n<p>B也谈服务，但以 <code>this conflict between inherited privilege and democratic equality</code> 开头。D还没提出这组冲突，B的指代在此落空；这组冲突到E才完整出现，因此B应等待E之后。</p>\n<p><strong>42题选G。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43在已知E之后。E以继承特权与民主价值冲突收尾，此处需要接王室怎样回应这一冲突，并为后续形象管理的困难铺垫。</p>\n<p>前段E的结尾：</p>\n<blockquote>\n<p>At a time of concern about inequality and inherited fortunes, the old privileges attached to royalty could make the symbol look hostile to the values it was supposed to unite.</p>\n</blockquote>\n<p>候选B的开头：</p>\n<blockquote>\n<p>Many royal households responded to this conflict between inherited privilege and democratic equality by making royalty look less royal.</p>\n</blockquote>\n<p>后段F的开头：</p>\n<blockquote>\n<p>Image management nevertheless became harder under continuous media scrutiny.</p>\n</blockquote>\n<p>B把 <code>this conflict</code> 展开为继承特权与民主平等，回指E的两端准确。它用工作、自行车说明如何让王室不那么像王室，随后F的 <code>Image management</code> 才有具体所指，<code>nevertheless</code> 也有可转折的努力。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>E指出制度冲突 → B介绍普通化形象的回应 → F转写形象管理越来越困难。</p>\n</blockquote>\n<p>F在词汇上也接财富，但直接放E后会跳过王室已经尝试管理形象这一环，<code>Image management nevertheless</code> 的转折对象不足。B把问题转成应对，才让F的困难有明确承接。</p>\n<p><strong>43题选B。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>B确定后，44应接普通化形象的努力。45再接已知结尾H，所以这里还要为英国比较准备入口，不能提前总结全篇。</p>\n<p>前段B的结尾：</p>\n<blockquote>\n<p>These gestures were attempts to show that service, rather than aristocratic distance, defined the modern crown.</p>\n</blockquote>\n<p>候选F的开头：</p>\n<blockquote>\n<p>Image management nevertheless became harder under continuous media scrutiny.</p>\n</blockquote>\n<p>后段C的开头：</p>\n<blockquote>\n<p>Britain had been protected by a queen whose public manner appeared ordinary and dutiful.</p>\n</blockquote>\n<p><code>Image management</code> 回收B的工作、自行车等姿态，<code>nevertheless</code> 从努力转到困难。F最后以 <code>across the Channel</code> 把警告指向英国，因此C开头的 <code>Britain</code> 有清楚的地理和案例接力。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>B努力塑造普通形象 → F媒体揭示困难并指向英国 → C具体比较英国女王与查尔斯。</p>\n</blockquote>\n<p>C可以接B里的普通形象，但那样会突然换到英国，尚无F的跨海峡引导；F也就无处安放，且会把C与H的 <code>this British comparison</code> 隔开。F同时承前启后，位置更完整。</p>\n<p><strong>44题选F。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45夹在已确定F和已知H之间。F已把话题转向海峡另一侧，H称 <code>this British comparison</code>，中间必须提供具体的英国比较。</p>\n<p>前段F的结尾：</p>\n<blockquote>\n<p>The fall of a carefully protected reputation in Spain therefore pointed directly toward the monarchy across the Channel.</p>\n</blockquote>\n<p>候选C的开头：</p>\n<blockquote>\n<p>Britain had been protected by a queen whose public manner appeared ordinary and dutiful.</p>\n</blockquote>\n<p>后段H的开头：</p>\n<blockquote>\n<p>The final lesson of this British comparison was therefore internal rather than revolutionary.</p>\n</blockquote>\n<p>C的 <code>Britain</code> 承接跨海峡的王室，女王的普通尽职与查尔斯的昂贵、等级观念构成比较。H据此说 <code>this British comparison</code>，并把个案归到君主自身可能危害制度的内部教训。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>F把西班牙警告推向英国 → C给出女王与查尔斯对照 → H从对照收束内部风险。</p>\n</blockquote>\n<p>G同样谈非政治服务，但它没有英国女王与查尔斯的对照，H的指代会落空；G又早已通过 <code>That function</code> 与D和E连接，不能挪来充当最后的英国案例。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>maintaining public trust</strong></td>\n<td><strong>维护公众信任</strong></td>\n<td><strong>人生哲理类：理解、信任、宽容</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>keeping pace with changing expectations</td>\n<td>与变化的期待保持同步</td>\n<td>人生哲理类：创新、开拓、与时俱进</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>a sense of responsibility</strong></td>\n<td><strong>责任感</strong></td>\n<td><strong>人生哲理类：责任感、奉献精神</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>devotion to public service</td>\n<td>投身公共服务</td>\n<td>人生哲理类：责任感、奉献精神</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>mutual understanding</td>\n<td>相互理解</td>\n<td>人生哲理类：理解、信任、宽容</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>social equality</td>\n<td>社会平等</td>\n<td>社会现象类：社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>self-discipline</strong></td>\n<td><strong>自律</strong></td>\n<td><strong>人生哲理类：自律</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>being courageous enough to admit mistakes</td>\n<td>勇于承认错误</td>\n<td>人生哲理类：谦虚、承认不足</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>critical thinking</td>\n<td>批判性思维</td>\n<td>人生哲理类：批判、独立、全局思维</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>cooperation and social unity</td>\n<td>合作与社会团结</td>\n<td>人生哲理类：团结合作</td>\n<td>宏观 s to its democratic costs.</td>\n<td>作者先承认A的现实价值，随后转向其民主成本。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The article argues that A survives by providing a restrained and non-political public service.</td>\n<td>文章认为，A依靠克制且非政治化的公共服务得以存续。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The central contradiction lies between inherited privilege and modern equality.</td>\n<td>核心矛盾在于继承特权与现代平等之间。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>The author concludes that an institution may be damaged most seriously by its own members.</strong></td>\n<td><strong>作者最后指出，一个制度受到的最严重伤害可能来自其内部成员。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The example demonstrates why traditional institutions must adapt to changing public expectations.</td>\n<td>这一案例说明传统制度为什么必须适应不断变化的公众期待。</td>\n</tr>\n</tbody></table></div>\n";
