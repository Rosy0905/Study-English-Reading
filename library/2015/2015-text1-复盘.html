const DATA=[{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><img src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\"></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><img src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\"></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><img src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\"></p>\n<p><img src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\"></p>\n<p><img src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\"></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><img src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\"></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><img src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\"></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><img src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\"></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n","context":null,"meta":{},"focusId":null},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| King | n. 国王 | Spain | n. 西班牙 | insist | v. 坚持 |\n| abdicate | v. 退位 | die | v. 死去 | in one’s sleep | 在睡梦中 |\n| embarrassing | a. 令人尴尬的 | scandal | n. 丑闻 .\"\n\nBut embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.\n\nSo, / does the Spanish crisis suggest / that monarchy is seeing / its last days?\n\nDoes that mean / the writing is on the wall / for all European royals, / with their magnificent uniforms / and majestic lifestyles?","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot; But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>King Juan Carlos of Spain / once insisted / &quot;kings don&#39;t abdicate, / they die in their sleep.&quot;</p>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n<p>So, / does the Spanish crisis suggest / that monarchy is seeing / its last days?</p>\n<p>Does that mean / the writing is on the wall / for all European royals, / with their magnificent uniforms / and majestic lifestyles?</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[90,137,910,587],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-1-1"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群翻译 · 第1段\n\n西班牙国王胡安·卡洛斯 / 曾经坚持 / \"国王不会退位，/ 他们在睡梦中死去。\"\n\n但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。\n\n那么，/ 西班牙危机是否暗示 / 君主制正在经历 / 它的最后时光？\n\n这是否意味着 / 大限将至 / 对所有欧洲皇室来说，/ 带着他们华丽的制服 / 和威严的生活方式？","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot; But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>King Juan Carlos of Spain / once insisted / &quot;kings don&#39;t abdicate, / they die in their sleep.&quot;</p>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n<p>So, / does the Spanish crisis suggest / that monarchy is seeing / its last days?</p>\n<p>Does that mean / the writing is on the wall / for all European royals, / with their magnificent uniforms / and majestic lifestyles?</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3>\n<p>西班牙国王胡安·卡洛斯 / 曾经坚持 / &quot;国王不会退位，/ 他们在睡梦中死去。&quot;</p>\n<p>但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。</p>\n<p>那么，/ 西班牙危机是否暗示 / 君主制正在经历 / 它的最后时光？</p>\n<p>这是否意味着 / 大限将至 / 对所有欧洲皇室来说，/ 带着他们华丽的制服 / 和威严的生活方式？</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[90,137,910,587],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-1-2"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 标准译文 · 第1段\n\n西班牙国王胡安·卡洛斯曾经坚持\"国王不会退位，他们在睡梦中死去\"。但令人尴尬的丑闻和共和派左翼在最近欧洲选举中的受欢迎程度迫使他食言并退位。那么，西班牙危机是否暗示君主制正在走向终结？这是否意味着所有欧洲皇室及其华丽制服和威严生活方式都将走向末路？","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot; But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>King Juan Carlos of Spain / once insisted / &quot;kings don&#39;t abdicate, / they die in their sleep.&quot;</p>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n<p>So, / does the Spanish crisis suggest / that monarchy is seeing / its last days?</p>\n<p>Does that mean / the writing is on the wall / for all European royals, / with their magnificent uniforms / and majestic lifestyles?</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3>\n<p>西班牙国王胡安·卡洛斯 / 曾经坚持 / &quot;国王不会退位，/ 他们在睡梦中死去。&quot;</p>\n<p>但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。</p>\n<p>那么，/ 西班牙危机是否暗示 / 君主制正在经历 / 它的最后时光？</p>\n<p>这是否意味着 / 大限将至 / 对所有欧洲皇室来说，/ 带着他们华丽的制服 / 和威严的生活方式？</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段</h3>\n<p>西班牙国王胡安·卡洛斯曾经坚持&quot;国王不会退位，他们在睡梦中死去&quot;。但令人尴尬的丑闻和共和派左翼在最近欧洲选举中的受欢迎程度迫使他食言并退位。那么，西班牙危机是否暗示君主制正在走向终结？这是否意味着所有欧洲皇室及其华丽制服和威严生活方式都将走向末路？</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[90,137,910,587],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 完整原文 · 第2段\n\nThe Spanish case provides arguments both for and against monarchy. When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>The Spanish case provides arguments both for and against monarchy. When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[90,734,910,405],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-2-0"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群划分 · 第2段\n\nThe Spanish case / provides arguments / both for and against monarchy.\n\nWhen public opinion / is particularly polarised, / as it was / following the end / of the Franco regime, / monarchs can rise above / \"mere\" politics / and \"embody\" / a spirit of national unity.","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>The Spanish case provides arguments both for and against monarchy. When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>The Spanish case / provides arguments / sted region in the world, with 10 kingdoms (not counting Vatican city and Andorra). But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state. And so, the Middle East excepted, Europe is the most monarch-infested region in the world, with 10 kingdoms (not counting Vatican city and Andorra). But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[90,1152,910,800],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-3-0"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群划分 · 第3段\n\nIt is this apparent transcendence / of politics / that explains / monarchs' continuing popularity / as heads of state.\n\nAnd so, / the Middle East excepted, / Europe is / the most monarch-infested region / in the world, / with 10 kingdoms / (not counting Vatican city and Andorra).\n\nBut unlike / their absolutist counterparts / in the Gulf and Asia, / most royal families / have survived / because they allow voters / to avoid the difficult search / for a non-controversial / but respected public figure.","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state. And so, the Middle Eas s have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>It is this apparent transcendence / of politics / that explains / monarchs&#39; continuing popularity / as heads of state.</p>\n<p>And so, / the Middle East excepted, / Europe is / the most monarch-infested region / in the world, / with 10 kingdoms / (not counting Vatican city and Andorra).</p>\n<p>But unlike / their absolutist counterparts / in the Gulf and Asia, / most royal families / have survived / because they allow voters / to avoid the difficult search / for a non-controversial / but respected public figure.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>正是这种明显的超越性 / 对政治的 / 解释了 / 君主持续的受欢迎程度 / 作为国家元首。</p>\n<p>因此，/ 除了中东，/ 欧洲是 / 君主最多的地区 / 在世界上，/ 有10个王国 / （不算梵蒂冈城和安道尔）。</p>\n<p>但不像 / 他们的专制主义对应者 / 在海湾地区和亚洲，/ 大多数皇室家族 / 得以存续 / 因为他们让选民 / 避免了困难的寻找 / 一个无争议的 / 但受尊敬的公众人物。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[90,1152,910,800],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-3-2"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 标准译文 · 第3段\n\n正是这种对政治的明显超越性解释了君主作为国家元首持续受欢迎的原因。因此，除中东外，欧洲是世界上君主最多的地区，有10个王国（不算梵蒂冈城和安道尔）。但与海湾地区和亚洲的专制君主不同，大多数皇室家族得以存续是因为他们让选民避免了寻找一个无争议但受尊敬的公众人物的困难。","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state. And so, the Middle East excepted, Europe is the most monarch-infested region in the world, with 10 kingdoms (not counting Vatican city and Andorra). But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>It is this apparent transcendence / of politics / that explains / monarchs&#39; continuing popularity / as heads of state.</p>\n<p>And so, / the Middle East excepted, / Europe is / the most monarch-infested region / in the world, / with 10 kingdoms / (not counting Vatican city and Andorra).</p>\n<p>But unlike / their absolutist counterparts / in the Gulf and Asia, / most royal families / have survived / because they allow voters / to avoid the difficult search / for a non-controversial / but respected public figure.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>正是这种明显的超越性 / 对政治的 / 解释了 / 君主持续的受欢迎程度 / 作为国家元首。</p>\n<p>因此，/ 除了中东，/ 欧洲是 / 君主最多的地区 / 在世界上，/ 有10个王国 / （不算梵蒂冈城和安道尔）。</p>\n<p>但不像 / 他们的专制主义对应者 / 在海湾地区和亚洲，/ 大多数皇室家族 / 得以存续 / 因为他们让选民 / 避免了困难的寻找 / 一个无争议的 / 但受尊敬的公众人物。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-3\"><h3>标准译文 · 第3段</h3>\n<p>正是这种对政治的明显超越性解释了君主作为国家元首持续受欢迎的原因。因此，除中东外，欧洲是世界上君主最多的地区，有10个王国（不算梵蒂冈城和安道尔）。但与海湾地区和亚洲的专制君主不同，大多数皇室家族得以存续是因为他们让选民避免了寻找一个无争议但受尊敬的公众人物的困难。</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[90,1152,910,800],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-3-3"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 完整原文 · 第4段\n\nEven so, kings and queens undoubtedly have a downside. Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>Even so, kings and queens undoubtedly have a downside. Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[90,1962,910,616],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-4-0"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nEven so, / kings and queens / undoubtedly have / a downside.\n\nSymbolic of national unity / as they claim to be, / their very history – / and sometimes / the way they behave today – / embodies / outdated and indefensible / privileges and inequalities.\n\nAt a time / when Thomas Piketty / and other economists / are warning / of rising inequality / and the increasing power / of inherited wealth, / it is bizarre / that wealthy aristocratic families / should still be / the symbolic heart / of modern democratic states.","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>Even so, kings and queens undoubtedly have a downside. Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges an  of newspaper reviews).\n\nTo read such books today → is to marvel → at the fact：(that their learned contents → were once deemed suitable → for publication：(in general-circulation dailies)).\n\n**第3段**\n\nWe → are even farther removed → from the unfocused newspaper reviews：(published in England：(between the turn of the 20th century and the eve of World War II)，at a time：(when newsprint was dirt-cheap + stylish arts criticism → was considered an ornament → to the publications：(in which it appeared))).\n\nIn those far-off days：it → was taken for granted：(that the critics：(of major papers) → would write：(in detail and at length) → about the events：(they covered)).\n\nTheirs → was a serious business, + even those reviewers：(who wore their learning lightly：(like George Bernard Shaw and Ernest Newman)) → could be trusted → to know：(what they were about).\n\nThese men → believed：(in journalism as a calling) + were proud → to be published：(in the daily press).\n\n\"So few authors：(have brains enough or literary gift enough → to keep their own end up：(in journalism))，\" → Newman wrote，\"that I am tempted to define 'journalism'：(as 'a term of contempt：(applied by writers who are not read → to writers who are)')\"。\n\n**第4段**\n\nUnfortunately, // these critics → are virtually forgotten.\n\nNeville Cardus：(who wrote for the Manchester Guardian：(from 1917 + until shortly before his death：(in 1975))) → is now known solely：(as a writer of essays：(on the game of cricket)).\n\nDuring his lifetime：(though)，// he → was also：(one of England's foremost classical-music critics)，+ and a stylist：(so widely admired：(that his Autobiography (1947) → became a best-seller)).\n\nHe → was knighted：(in 1967)，+ the first music critic：(to be so honored).\n\nYet + only one of his books → is now in print，+ and his vast body of writings：(on music) → is unknown：(save to specialists).\n\n**第5段**\n\nIs there any chance：(that Cardus's criticism → will enjoy a revival)?\n\nThe prospect → seems remote.\n\nJournalistic tastes → had changed：(long before his death)，+ and postmodern readers → have little use：(for the richly upholstered Vicwardian prose：(in which he specialized)).\n\nMoreover, the amateur tradition：(in music criticism) → has been：(in headlong retreat).\n\n### 中文版句子逻辑（选修)\n\n**第1段**\n\n在所有变化中：(这些变化已发生：(在英语报纸中：(在过去25年里))) → 或许最深远的变化 → 一直是 → 不可逆转的下降：(在范围和严肃性：(对其艺术报道))\n\n**第2段**\n\n这 → 很难：(几乎不可能) → 对于普通读者：(40岁以下的) → 去想象 → 一个时代：(当高质量的艺术评论 → 能够被找到 → 在大部分大城市的报纸里)。\n\n然而 + (相当多的数量：(最重要的选集之一：(评论的)) → 出版：(在20世纪) → 大部分由 → 报纸评论构成)。\n\n今天读这些书 → 就是惊叹 → 这个事实：(它们博学的内容 → 曾经被认为适合 → 出版：(在大众发行的日报上))。\n\n**第3段**\n\n我们 → 更加遥远了 → 从那些漫无边际的报纸评论：(发表在英国：(在20世纪初到二战前夕之间)，在一个时代：(当新闻纸非常廉价 + 风格化的艺术评论 → 被认为是一种装饰 → 对于这些出版物：(它们所出现的)))。\n\n在那些遥远的日子里：理所当然：(评论家们：(来自主要报纸的) → 会撰写：(详细且长篇地) → 关于这些事件：(他们所报道的))。\n\n他们的工作 → 是严肃的事业，+ 甚至那些评论家：(那些不炫耀自身学识的：(比如萧伯纳和欧内斯特·纽曼)) → 是可以信赖的 → 去了解：(他们所做的事)。\n\n这些人 → 相信：(新闻作为一种使命) + 并且以此为荣 → 被发表：(在日报上)。\n\n\"如此少的作家：(有足够智慧或文学天赋 → 能在新闻界立足)，\" → 纽曼写道，\"以至于我忍不住将'新闻'定义为：('一种蔑称：(由不被阅读的作家使用 → 对被广泛阅读的作家)')\"。\n\n**第4段**\n\n不幸的是，// 这些评论家 → 几乎被遗忘了。\n\n内维尔·卡达斯：(为《曼彻斯特卫报》撰稿：(自1917年 + 直到去世前不久：(在1975年))) → 现在仅仅被人们所知：(作为一名散文作家：(关于板球比赛的))。\n\n尽管在他的一生中，// 他 → 也曾是：(英国最杰出的古典音乐评论家之一)，+ 并且是一位文体家：(广受赞誉的：(以至于他的《自传》（1947年）→ 成为了一本畅销书))。\n\n他 → 被封为爵士：(于1967年)，+ 第一位音乐评论家：(获此殊荣的)。\n\n然而 + 现在他只有一本书 → 仍在印刷中，+ 他大量的著作：(关于音乐的) → 不为人所知：(除了专业人士以外)。\n\n**第5段**\n\n是否有任何可能性：(卡达斯的评论 → 会重新受到青睐)？\n\n这个前景 → 看起来渺茫。\n\n新闻品味 → 已经发生了改变：(在他去世前很久)，+ 并且后现代的读者 → 几乎不需要：(他所擅长的这种丰富华丽的维多利亚爱德华风格的散文)。\n\n此外，业余传统：(在音乐评论中) → 一直处于：(急速的衰退中)。","html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n<h3>句子逻辑梳理（选修，按照自身语法基础而定)</h3>\n<p><strong>第1段</strong></p>\n<p>Of all the changes：(that have taken place：(in English-language newspapers：(during the past quarter-century))) → perhaps the most far-reaching → has been →  known solely：(as a writer of essays：(on the game of cricket)).</p>\n<p>During his lifetime：(though)，// he → was also：(one of England&#39;s foremost classical-music critics)，+ and a stylist：(so widely admired：(that his Autobiography (1947) → became a best-seller)).</p>\n<p>He → was knighted：(in 1967)，+ the first music critic：(to be so honored).</p>\n<p>Yet + only one of his books → is now in print，+ and his vast body of writings：(on music) → is unknown：(save to specialists).</p>\n<p><strong>第5段</strong></p>\n<p>Is there any chance：(that Cardus&#39;s criticism → will enjoy a revival)?</p>\n<p>The prospect → seems remote.</p>\n<p>Journalistic tastes → had changed：(long before his death)，+ and postmodern readers → have little use：(for the richly upholstered Vicwardian prose：(in which he specialized)).</p>\n<p>Moreover, the amateur tradition：(in music criticism) → has been：(in headlong retreat).</p>\n<h3>中文版句子逻辑（选修)</h3>\n<p><strong>第1段</strong></p>\n<p>在所有变化中：(这些变化已发生：(在英语报纸中：(在过去25年里))) → 或许最深远的变化 → 一直是 → 不可逆转的下降：(在范围和严肃性：(对其艺术报道))</p>\n<p><strong>第2段</strong></p>\n<p>这 → 很难：(几乎不可能) → 对于普通读者：(40岁以下的) → 去想象 → 一个时代：(当高质量的艺术评论 → 能够被找到 → 在大部分大城市的报纸里)。</p>\n<p>然而 + (相当多的数量：(最重要的选集之一：(评论的)) → 出版：(在20世纪) → 大部分由 → 报纸评论构成)。</p>\n<p>今天读这些书 → 就是惊叹 → 这个事实：(它们博学的内容 → 曾经被认为适合 → 出版：(在大众发行的日报上))。</p>\n<p><strong>第3段</strong></p>\n<p>我们 → 更加遥远了 → 从那些漫无边际的报纸评论：(发表在英国：(在20世纪初到二战前夕之间)，在一个时代：(当新闻纸非常廉价 + 风格化的艺术评论 → 被认为是一种装饰 → 对于这些出版物：(它们所出现的)))。</p>\n<p>在那些遥远的日子里：理所当然：(评论家们：(来自主要报纸的) → 会撰写：(详细且长篇地) → 关于这些事件：(他们所报道的))。</p>\n<p>他们的工作 → 是严肃的事业，+ 甚至那些评论家：(那些不炫耀自身学识的：(比如萧伯纳和欧内斯特·纽曼)) → 是可以信赖的 → 去了解：(他们所做的事)。</p>\n<p>这些人 → 相信：(新闻作为一种使命) + 并且以此为荣 → 被发表：(在日报上)。</p>\n<p>&quot;如此少的作家：(有足够智慧或文学天赋 → 能在新闻界立足)，&quot; → 纽曼写道，&quot;以至于我忍不住将&#39;新闻&#39;定义为：(&#39;一种蔑称：(由不被阅读的作家使用 → 对被广泛阅读的作家)&#39;)&quot;。</p>\n<p><strong>第4段</strong></p>\n<p>不幸的是，// 这些评论家 → 几乎被遗忘了。</p>\n<p>内维尔·卡达斯：(为《曼彻斯特卫报》撰稿：(自1917年 + 直到去世前不久：(在1975年))) → 现在仅仅被人们所知：(作为一名散文作家：(关于板球比赛的))。</p>\n<p>尽管在他的一生中，// 他 → 也曾是：(英国最杰出的古典音乐评论家之一)，+ 并且是一 \n\nSymbolic of national unity：(as they claim to be) // their very history – and sometimes：(the way they behave today) – → embodies：(outdated and indefensible：(privileges and inequalities)).\n\nAt a time：(when Thomas Piketty + other economists → are warning：(of rising inequality + the increasing power：(of inherited wealth))) → it is bizarre：(that wealthy aristocratic families → should still be → the symbolic heart：(of modern democratic states)).\n\n### 第5段\n\nThe most successful monarchies → strive to abandon or hide：(their old aristocratic ways).\n\nPrinces and princesses → have day-jobs + ride bicycles // not horses (or helicopters).\n\nEven so → these are wealthy families：(who party：(with the international 1%)) + media intrusiveness → makes it increasingly difficult → to maintain：(the right image).\n\n### 第6段\n\nWhile Europe's monarchies → will no doubt → be smart enough → to survive：(for some time to come) // it is the British royals → who have most to fear：(from the Spanish example).\n\n### 第7段\n\nIt is only the Queen → who has preserved → the monarchy's reputation：(with her rather ordinary (if well-heeled) granny style).\n\nThe danger will come：(with Charles)：(who has both → an expensive taste of lifestyle + a pretty hierarchical view：(of the world)).\n\nHe has failed to understand：(that monarchies → have largely survived：(because they provide a service – as non-controversial + non-political heads of state)).\n\nCharles ought to know：(that as English history shows → it is kings // not republicans → who are the monarchy's worst enemies).","html":"<h3>第1段</h3>\n<p>King Juan Carlos of Spain → once insisted：(&quot;kings don&#39;t abdicate → they die in their sleep&quot;).</p>\n<p>But embarrassing scandals + the popularity：(of the republican left)：(in the recent Euro-elections) → have forced him → to eat his words + stand down.</p>\n<p>So → does the Spanish crisis suggest：(that monarchy is seeing → its last days)?</p>\n<p>Does that mean → the writing is on the wall：(for all European royals)：(with their magnificent uniforms + majestic lifestyles)?</p>\n<h3>第2段</h3>\n<p>The Spanish case → provides arguments：(both for and against monarchy).</p>\n<p>When public opinion → is particularly polarised：(as it was：(following the end：(of the Franco regime))) → monarchs can rise above：(&quot;mere&quot; politics) + &quot;embody&quot;：(a spirit of national unity).</p>\n<h3>第3段</h3>\n<p>It is this apparent transcendence：(of politics) → that explains → monarchs&#39; continuing popularity：(as heads of state).</p>\n<p>And so：(the Middle East excepted) → Europe is → the most monarch-infested region：(in the world)：(with 10 kingdoms：(not counting Vatican city and Andorra)).</p>\n<p>But unlike：(their absolutist counterparts：(in the Gulf and Asia)) → most royal families → have survived：(because they allow voters → to avoid the difficult search：(for a non-controversial but respected public figure)).</p>\n<h3>第4段</h3>\n<p>Even so → kings and queens → undoubtedly have → a downside.</p>\n<p>Symbolic of national unity：(as they claim to be) // their very history – and sometimes：(the way they behave today) – → embodies：(outdated and indefensible：(privileges and inequalities)).</p>\n<p>At a time：(when Thomas Piketty + other economists → are warning：(of rising inequality + the increasing power：(of inherited wealth))) → it is bizarre：(that wealthy aristocratic families → should still be → the symbolic heart：(of modern democratic states)).</p>\n<h3>第5段</h3>\n<p>The most successful monarchies → strive to abandon or hide：(their old aristocratic ways).</p>\n<p>Princes and princesses → have day-jobs + ride bicycles // not horses (or helicopters).</p>\n<p>Even so → these are wealthy families：(who party：(with the international 1%)) + media intrusiveness → makes it increasingly difficult → to maintain：(the right image).</p>\n<h3>第6段</h3>\n<p>While Europe&#39;s monarchies → will no doubt → be smart enough → to survive：(for some time to come) // it is the British royals → who have most to fear：(from the Spanish example).</p>\n<h3>第7段</h3>\n<p>It is only the Queen → who has preserved → the monarchy&#39;s reputation：(with her rather ordinary (if well-heeled) granny style).</p>\n<p>The danger will come：(with Charles)：(who has both → an expensive taste of lifestyle + a pretty hierarchical view：(of the world)).</p>\n<p>He has failed to understand：(that monarchies → have largely survived：(because they provide a service – as non-controversial + non-political heads of state)).</p>\n<p>Charles ought to know：(that as English history shows → it is kings // not republicans → who are the monarchy&#39;s worst enemies).</p>\n","context":{"mode":"image","asset":"articleAnnotated","label":"2015英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n西班牙国王胡安·卡洛斯 → 曾经坚持：(\"国王不会退位 → 他们在睡梦中死去\")。\n\n但令人尴尬的丑闻 + 受欢迎程度：(共和派左翼的)：(在最近的欧洲选举中) → 迫使他 → 食言 + 退位。\n\n那么 → 西班牙危机是否暗示：(君主制正在经历 → 它的最后时光)？\n\n这是否意味着 → 大限将至：(对所有欧洲皇室来说)：(带着他们华丽的制服 + 威严的生活方式)？\n\n### 第2段\n\n西班牙案例 → 提供了论据：(既支持又反对君主制)。\n\n当公众舆论 → 特别两极分化时：(正如它曾经：(在结束之后：(佛朗哥政权的))) → 君主可以超越：(\"纯粹的\"政治) + \"体现\"：(国家团结的精神)。\n\n### 第3段\n\n正是这种明显的超越性：(对政治的) → 解释了 → 君主持续的受欢迎程度：(作为国家元首)。\n\n因此：(除了中东) → 欧洲是 → 君主最多的地区：(在世界上)：(有10个王国：(不算梵蒂冈城和安道尔))。\n\n但不像：(他们的专制主义对应者：(在海湾地区和亚洲)) → 大多数皇室家族 → 得以存续：(因为他们让选民 → 避免了困难的寻找：(一个无争议但受尊敬的公众人物))。\n\n### 第4段\n\n即便如此 → 国王和女王 → 无疑有 → 缺点。\n\n象征国家团结：(正如他们声称的那样) // 他们的历史本身 – 有时：(他们今天的行为方式) – → 体现了：(过时且站不住脚的：(特权和不平等))。\n\n在这样一个时代：(当托马斯·皮凯蒂 + 其他经济学家 → 正在警告：(日益加剧的不平等 + 不断增强的权力：(继承财富的))) → 这很奇怪：(富有的贵族家庭 → 仍然应该是 → 象征性的核心：(现代民主国家的))。\n\n### 第5段\n\n最成功的君主制 → 努力放弃或隐藏：(他们旧的贵族方式)。\n\n王子和公主们 → 有日常工作 + 骑自行车 // 而不是马（或直升机）。\n\n即便如此 → 这些是富有的家庭：(他们聚会：(与国际1%精英)) + 媒体的侵扰 → 使得越来越困难 → 维持：(正确的形象)。\n\n### 第6段\n\n虽然欧洲的君主制 → 毫无疑问 → 会足够聪明 → 存续下去：(在未来一段时间) // 正是英国皇室 → 最应该担心：(从西班牙的例子)。\n\n### 第7段\n\n只有女王 → 保持了 → 君主制的声誉：(以她相当普通的（尽管富有的）老奶奶风格)。\n\n危险将到来：(随着查尔斯)：(他既有 → 昂贵的生活品味 + 相当等级化的观点：(对世界的))。\n\n他未能理解：(君主制 → 大部分得以存续：(因为他们提供一种服务 – 作为无争议的 + 非政治的国家元首))。\n\n查尔斯应该知道：(正如英国历史所显示的 → 是国王们 // 而非共和派 → 才是君主制的最大敌人)。","html":"<h3>第1段</h3>\n<p>西班牙国王胡安·卡洛斯 → 曾经坚持：(&quot;国王不会退位 → 他们在睡梦中死去&quot;)。</p>\n<p>但令人尴尬的丑闻 + 受欢迎程度：(共和派左翼的)：(在最近的欧洲选举中) → 迫使他 → 食言 + 退位。</p>\n<p>那么 → 西班牙危机是否暗示：(君主制正在经历 → 它的最后时光)？</p>\n<p>这是否意味着 → 大限将至：(对所有欧洲皇室来说)：(带着他们华丽的制服 + 威严的生活方式)？</p>\n<h3>第2段</h3>\n<p>西班牙案例 → 提供了论据：(既支持又反对君主制)。</p>\n<p>当公众舆论 → 特别两极分化时：(正如它曾经：(在结束之后：(佛朗哥政权的))) → 君主可以超越：(&quot;纯粹的&quot;政治) + &quot;体现&quot;：(国家团结的精神)。</p>\n<h3>第3段</h3>\n<p>正是这种明显的超越性：(对政治的) → 解释了 → 君主持续的受欢迎程度：(作为国家元首)。</p>\n<p>因此：(除了中东) → 欧洲是 → 君主最多的地区：(在世界上)：(有10个王国：(不算梵蒂冈城和安道尔))。</p>\n<p>但不像：(他们的专制主义对应者：(在海湾地区和亚洲)) → 大多数皇室家族 → 得以存续：(因为他们让选民 → 避免了困难的寻找：(一个无争议但受尊敬的公众人物))。</p>\n<h3>第4段</h3>\n<p>即便如此 → 国王和女王 → 无疑有 → 缺点。</p>\n<p>象征国家团结：(正如他们声称的那样) // 他们的历史本身 – 有时：(他们今天的行为方式) – → 体现了：(过时且站不住脚的：(特权和不平等))。</p>\n<p>在这样一个时代：(当托马斯·皮凯蒂 + 其他经济学家 → 正在警告：(日益加剧的不平等 + 不断增强的权力：(继承财富的))) → 这很奇怪：(富有的贵族家庭 → 仍然应该是 → 象征性的核心：(现代民主国家的))。</p>\n<h3>第5段</h3>\n<p>最成功的君主制 → 努力放弃或隐藏：(他们旧的贵族方式)。</p>\n<p>王子和公主们 → 有日常工作 + 骑自行车 // 而不是马（或直升机）。</p>\n<p>即便如此 → 这些是富有的家庭：(他们聚会：(与国际1%精英)) + 媒体的侵扰 → 使得越来越困难 → 维持：(正确的形象)。</p>\n<h3>第6段</h3>\n<p>虽然欧洲的君主制 → 毫无疑问 → 会足够聪明 → 存续下去：(在未来一段时间) // 正是英国皇室 → 最应该担心：(从西班牙的例子)。</p>\n<h3>第7段</h3>\n<p>只有女王 → 保持了 → 君主制的声誉：(以她相当普通的（尽管富有的）老奶奶风格)。</p>\n<p>危险将到来：(随着查尔斯)：(他既有 → 昂贵的生活品味 + 相当等级化的观点：(对世界的))。</p>\n<p>他未能理解：(君主制 → 大部分得以存续：(因为他们提供一种服务 – 作为无争议的 + 非政治的国家元首))。</p>\n<p>查尔斯应该知道：(正如英国历史所显示的 → 是国王们 // 而非共和派 → 才是君主制的最大敌人)。</p>\n","context":{"mode":"image","asset":"articleAnnotated","label":"2015英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null},{"section":"第二鸟 · 精读与翻译","title":"长难句翻译练习（英一必修，英二选修)","level":2,"raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感，把应该放在一起的意群合并起来；\n4. 找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\n5. 对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。","html":"<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并起来；</li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；</li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。</li>\n</ol>\n","context":{"mode":"image","asset":"articleAnnotated","label":"2015英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null},{"section":"第二鸟 · 精读与翻译","title":"第1段第2句","level":3,"raw":"### 原文\n\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段第2句","focus":[95,213,900,140],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-long-1-0"},{"section":"第二鸟 · 精读与翻译","title":"第1段第2句","level":3,"raw":"### 第一步：划分意群\n\n> But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段第2句","focus":[95,213,900 e popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把两件带来压力的事情分别合在一起。</p>\n<blockquote>\n<p>令人尴尬的丑闻</p>\n</blockquote>\n<blockquote>\n<p>共和派左翼在最近欧洲选举中的受欢迎程度</p>\n</blockquote>\n<p>再把施加压力及其结果接起来。</p>\n<blockquote>\n<p>迫使他食言并退位</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>但令人尴尬的丑闻，以及共和派左翼在最近欧洲选举中的受欢迎程度，迫使他食言并退位。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第1段第2句","focus":[95,213,900,140],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false,"partIndex":3,"kind":"standard"},"focusId":"focus-long-1-3"},{"section":"第二鸟 · 精读与翻译","title":"第1段第2句","level":3,"raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 丑闻和共和派左翼的受欢迎程度，迫使他食言并退位。\n\n两项原因并列放在前面。共和派左翼是谁的受欢迎程度、发生在哪次选举，都收在第二项原因里；后面紧接被迫做出的两个动作。\n\n按照中文语序调整后是：\n\n> 但令人尴尬的丑闻和共和派左翼在最近欧洲选举中的受欢迎程度，迫使他食言并退位。","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。</p>\n</blockquote>\n</section><section class 精神</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越“纯粹的”政治，并“体现”国家团结的精神。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>君主可以超越政治并体现国家团结的精神。</p>\n</blockquote>\n<p>先放公众舆论分裂这一条件，历史例子紧随条件，避免读成君主在政权结束之后才首次具备这种作用。后面再说君主能做什么。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越“纯粹的”政治并“体现”国家团结的精神。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第2段第2句","focus":[95,802,900,214],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-2","cumulativeFinal":false,"partIndex":4,"kind":"standard"},"focusId":"focus-long-2-4"},{"section":"第二鸟 · 精读与翻译","title":"第2段第2句","level":3,"raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n“可以”保留作用的可能性，不能写成君主一定能团结所有人。\n\n保留“纯粹的”和“体现”的引号，让原文对这些说法的距离感不消失。\n\n参考译文：\n\n> 当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越\"纯粹的\"政治并\"体现\"国家团结的精神。","html":"<section class=\"revealPart\" id=\"focus-long-2-0\"><h3>原文</h3>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>When public opinion / is particularly polarised, / as it was / following the end / of the Franco regime, / monarchs can rise above / &quot;mere&quot; politics / and &quot;embody&quot; / a spirit of national unity.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>当公众舆论 / 特别两极分化时，/ 正如它曾经 / 在结束之后 / 佛朗哥政权的，/ 君主可以超越 / &quot;纯粹的&quot;政治 / 并&quot;体现&quot; / 国家团结的精神。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-2-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把条件和说明条件的历史背景合起 on":"第二鸟 · 精读与翻译","title":"第4段第3句","level":3,"raw":"### 第二步：逐个意群直译\n\n> 在这样一个时代 / 当托马斯·皮凯蒂 / 和其他经济学家 / 正在警告 / 日益加剧的不平等 / 和不断增强的权力 / 继承财富的，/ 这很奇怪 / 富有的贵族家庭 / 仍然应该是 / 象征性的核心 / 现代民主国家的。","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>At a time / when Thomas Piketty / and other economists / are warning / of rising inequality / and the increasing power / of inherited wealth, / it is bizarre / that wealthy aristocratic families / should still be / the symbolic heart / of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在这样一个时代 / 当托马斯·皮凯蒂 / 和其他经济学家 / 正在警告 / 日益加剧的不平等 / 和不断增强的权力 / 继承财富的，/ 这很奇怪 / 富有的贵族家庭 / 仍然应该是 / 象征性的核心 / 现代民主国家的。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段第3句","focus":[95,2170,900,216],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-long-4-2"},{"section":"第二鸟 · 精读与翻译","title":"第4段第3句","level":3,"raw":"### 第三步：按照中文语感合并意群\n\n把时代中的两项变化合成并列信息。\n\n> 不平等日益加剧，继承财富的权力不断增强\n\n再把发出警告的人与这两项变化接起来。\n\n> 托马斯·皮凯蒂和其他经济学家正在警告这些变化\n\n最后把被评为奇怪的事情合完整。\n\n> 富有的贵族家庭仍然是现代民主国家的象征性核心\n\n先得到：\n\n> 在托马斯·皮凯蒂和其他经济学家警告不平等日益加剧和继承财富权力不断增强的时代，富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>At a time / when Thomas Piketty / and other economists / are warning / of rising inequality / and the increasing power / of inherited wealth, / it is bizarre / that wealthy aristocratic families / should still be / the symbolic heart / of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在这样一个时代 / 当托马斯·皮凯蒂 / 和其他经济学家 / 正在警告 / 日益加剧的不平等 / 和不断增强的权力 / 继承财富的，/ 这很奇怪 / 富有的贵族家庭 / 仍然应该是 / 象征性的核心 / 现代民主国家的。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>把时代中的两项变化合成并列信息。</p>\n<blockquote>\n<p>不平等日益加剧，继承财富的权力不断增强</p>\n</blockquote>\n<p>再把发出警告的人与这两项变化接起来。</p>\n<blockquote>\n<p>托马斯·皮凯蒂和其他经济学家正在警告这些变化</p>\n</blockquote>\n<p>最后把被评为奇怪的事情合完整。</p>\n<blockquote>\n<p>富有的贵族家庭仍然是现代民主国家的象征性核心</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>在托马斯·皮凯蒂和其他经济学家警告不平等日益加剧和继承财富权力不断增强的时代，富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第4段第3句","focus":[95,2170,900,216],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false,"partIndex":3,"kind":"standard"},"focusId":"focus-long-4-3"},{"section":"第二鸟 · 精读与翻译","title":"第4段第3句","level":3,"raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。\n\n时代背景放前面，让后面的事情在这个背景下显出反差。先说完整的怪事，再在句末落下评价，不把经济学家的警告本身当成奇怪的对象。\n\n按照中文语序调整后是：\n\n> 在经济学家警告不平等日益加剧、继承财富权力不断增强的时代，富有的贵族家庭仍是现代民主国家的象征性核心，这很奇怪。","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of i  provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>He has failed to understand / that monarchies / have largely survived / because they provide a service – / as non-controversial / and non-political / heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他未能理解 / 君主制 / 大部分得以存续 / 因为他们提供一种服务 – / 作为无争议的 / 和非政治的 / 国家元首。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第7段第3句","focus":[95,3793,900,139],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-long-6-2"},{"section":"第二鸟 · 精读与翻译","title":"第7段第3句","level":3,"raw":"### 第三步：按照中文语感合并意群\n\n先把他未能理解的存续原因合起来。\n\n> 君主制大部分得以存续，是因为他们提供一种服务\n\n把服务的具体内容接在后面。\n\n> 作为无争议和非政治的国家元首\n\n先得到：\n\n> 他未能理解，君主制大部分得以存续，是因为他们提供一种服务——作为无争议和非政治的国家元首。","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文</h3>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>He has failed to understand / that monarchies / have largely survived / because they provide a service – / as non-controversial / and non-political / heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他未能理解 / 君主制 / 大部分得以存续 / 因为他们提供一种服务 – / 作为无争议的 / 和非政治的 / 国家元首。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把他未能理解的存续原因合起来。</p>\n<blockquote>\n<p>君主制大部分得以存续，是因为他们提供一种服务</p>\n</bloc 他没有理解，再把他不理解的内容完整展开；服务是什么放在破折号之后，紧接服务一词。这样不会把无争议和非政治误读成所有王室私人行为的特点。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他未能理解，君主制大部分得以存续，是因为他们作为无争议和非政治的国家元首提供服务。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第7段第3句","focus":[95,3793,900,139],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false,"partIndex":4,"kind":"standard"},"focusId":"focus-long-6-4"},{"section":"第二鸟 · 精读与翻译","title":"第7段第3句","level":3,"raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n恢复破折号，把国家元首职责作为对服务的说明，句子层次更清楚。\n\n保留“大部分”及未能理解的否定，不改成君主只靠唯一原因存续，也不改成查尔斯已经理解。\n\n参考译文：\n\n> 他未能理解君主制大部分得以存续是因为他们提供一种服务——作为无争议和非政治的国家元首。","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文</h3>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>He has failed to understand / that monarchies / have largely survived / because they provide a service – / as non-controversial / and non-political / heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他未能理解 / 君主制 / 大部分得以存续 / 因为他们提供一种服务 – / 作为无争议的 / 和非政治的 / 国家元首。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把他未能理解的存续原因合起来。</p>\n<blockquote>\n<p>君主制大部分得以存续，是因为他们提供一种服务</p>\n</blockquote>\n<p>把服务的具体内容接在后面。</p>\n<blockquote>\n<p>作为无争议和非政治的国家元首</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>他未能理解，君主制大部分得以存续，是因为他们提供一种服务——作为无争议和非政治的国家元首。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>他未能理解君主制得以存续的原因。</p>\n</blockquote>\n<p>先说他没有理解，再把他不理解的内容完整展开；服务是什么放在破折号之后，紧接服务一词。这样不会把无争议和非政治误读成所有王室私人行为的特点。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他未能理解，君主制大部分得以存续，是因为他们作为无争议和非政治的国家元首提供服务。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-6-5\"><h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>恢复破折号，把国家元首职责作为对服务的说明，句子层次更清楚。</p>\n<p>保留“大部分”及未能理解的否定，不改成君主只靠唯一原因存续，也不改成查尔斯已经理解。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>他未能理解君主制大部分得以存续是因为他们提供一种服务——作为无争议和非政治的国家元首。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"articleAnnotated","label":"第7段第3句","focus":[95,3793,900,139],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":true,"partIndex":5,"kind":"standard"},"focusId":"focus-long-6-5"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。</li>\n</ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li>**定位比对：**检查选项有没有准确改写局部原文；</li>\n<li>**写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n<li>**全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>在本篇文章里，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。</p>\n","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"25题 · 题干、题型与核心出处","level":2,"raw":"## 25题\n\n**Which of the following is the best title of the text?**\n\n下面哪一个是本文最佳标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Carlos, Glory and Disgrace Combined**\n\n卡洛斯：荣耀与耻辱并存\n\nB. **Charles, Anxious to Succeed to the Throne**\n\n查尔斯：急于继承王位\n\nC. **Carlos, a Lesson for All European Monarchs**\n\n卡洛斯：给所有欧洲君主的一课\n\nD. **Charles, Slow to React to the Coming Threats**\n\n查尔斯：对即将到来的威胁反应迟缓\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 写卡洛斯在丑闻和共和派声势上升后退位，并追问西班牙危机是否预示君主制衰亡 | 先摆出一个出问题的具体例子 |\n| 2 | 说明西班牙案例既能支持也能反对君主制，君主在公众分裂时可代表国家团结 | 再承认这类东西也有它的用处 |\n| 3 | 解释欧洲王室仍能担任国家元首，是因为选民不必另找一个少争议且受尊敬的人物 | 接着解释它为什么还能留下来 |\n| 4 | 转写君主制的缺点：历史特权、不平等与现代民主国家的象征位置发生冲突 | 然后转过来写它带来的麻烦 |\n| 5 | 写成功王室努力淡化旧贵族形象，但财富和媒体介入使合适形象越来越难维持 | 再写人们怎样努力维持表面 |\n| 6 | 把西班牙案例转向英国，指出英国王室最应从中感到警惕 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 说明女王维持了声誉，而查尔斯不理解现代君主的服务角色；王室内部人物可能成为最大麻烦 | 最后说问题其实来自内部 |","html":"<p><strong>Which of the following is the best title of the text?</strong></p>\n<p>下面哪一个是本文最佳标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Carlos, Glory and Disgrace Combined</strong></p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n<p>B. <strong>Charles, Anxious to Succeed to the Throne</strong></p>\n<p>查尔斯：急于继承王位</p>\n<p>C. <strong>Carlos, a Lesson for All European Monarchs</strong></p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n<p>D. <strong>Charles, Slow to React to the Coming Threats</strong></p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在说什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>写卡洛斯在丑闻和共和派声势上升后退位，并追问西班牙危机是否预示君主制衰亡</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明西班牙案例既能支持也能反对君主制，君主在公众分裂时可代表国家团结</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释欧洲王室仍能担任国家元首，是因为选民不必另找一个少争议且受尊敬的人物</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写君主制的缺点：历史特权、不平等与现代民主国家的象征位置发生冲突</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写成功王室努力淡化旧贵族形象，但财富和媒体介入使合适形象越来越难维持</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把西班牙案例转向英国，指出英国王室最应从中感到警惕</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>说明女王维持了声誉，而查尔斯不理解现代君主的服务角色；王室内部人物可能成为最大麻烦</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","questionIntro":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"A. Carlos, Glory and Disgrace Combined","level":3,"raw":"**Which of the following is the best title of the text?**\n\n### A. Carlos, Glory and Disgrace Combined\n\n卡洛斯：荣耀与耻辱并存","html":"<section class=\"revealPart\" id=\"focus-q25-A-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option"},"focusId":"focus-q25-A-0"},{"section":"第三鸟 · 题目复盘","title":"A. Carlos, Glory and Disgrace Combined","level":3,"raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n卡洛斯：荣耀与耻辱并存\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用卡洛斯因丑闻退位这一失去体面的例子开篇，提出同一国王为何会同时留下荣耀与耻辱。 | 先摆出一个出问题的具体例子 |\n| 2 | 承认卡洛斯的国家团结作用曾有实际价值，使个人功绩成为评价他时必须保留的一面。 | 再承认这类东西也有它的用处 |\n| 3 | 解释这些已有功绩为何在退位之后仍能保住他的一部分声望，让荣耀没有随丑闻一起消失。 | 接着解释它为什么还能留下来 |\n| 4 | 转写卡洛斯的个人失误怎样损伤已有功绩，使公众无法只凭旧日荣耀原谅当前耻辱。 | 然后转过来写它带来的麻烦 |\n| 5 | 写王室如何在丑闻中突出卡洛斯的贡献、淡化负面消息，努力维持仍有荣耀的公共形象。 | 再写人们怎样努力维持表面 |\n| 6 | 把卡洛斯功过并存的遭遇转给其他有功绩的君主作提醒：旧日荣耀也未必能抵消失德的代价。 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 落回卡洛斯自身的选择，说明让他的荣耀最终与耻辱并存的决定性问题来自本人。 | 最后说问题其实来自内部 |\n\nA抓住了开头的难堪退位，却把整篇任务定成评价卡洛斯个人的荣耀与耻辱。若按表中路线写，第二、三段必须交代属于他的功绩及功绩为何仍有效；实际两段用的是一般的君主作用、欧洲元首人选，未铺开他的个人功绩。\n\n第四、五段讨论特权、不平等与王室形象，也没有追踪卡洛斯怎样把荣耀消耗掉。第六段明确换到英国，第七段以查尔斯及国王自身的制度危险收束。人物转换服务于一堂欧洲共同的课，结尾没有回来衡量卡洛斯的功过比例。\n\n判断：\n\n**A 不保留。**","html":"<section class=\"revealPart\" id=\"focus-q25-A-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n</section><section class=\"revealPart\" id=\"focus-q25-A-1\"><h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用卡洛斯因丑闻退位这一失去体面的例子开篇，提出同一国王为何会同时留下荣耀与耻辱。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认卡洛斯的国家团结作用曾有实际价值，使个人功绩成为评价他时必须保留的一面。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释这些已有功绩为何在退位之后仍能保住他的一部分声望，让荣耀没有随丑闻一起消失。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写卡洛斯的个人失误怎样损伤已有功绩，使公众无法只凭旧日荣耀原谅当前耻辱。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写王室如何在丑闻中突出卡洛斯的贡献、淡化负面消息，努力维持仍有荣耀的公共形象。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把卡洛斯功过并存的遭遇转给其他有功绩的君主作提醒：旧日荣耀也未必能抵消失德的代价。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>落回卡洛斯自身的选择，说明让他的荣耀最终与耻辱并存的决定性问题来自本人。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>A抓住了开头的难堪退位，却把整篇任务定成评价卡洛斯个人的荣耀与耻辱。若按表中路线写，第二、三段必须交代属于他的功绩及功绩为何仍有效；实际两段用的是一般的君主作用、欧洲元首人选，未铺开他的个人功绩。</p>\n<p>第四、五段讨论特权、不平等与王室形象，也没有追踪卡洛斯怎样把荣耀消耗掉。第六段明确换到英国，第七段以查尔斯及国王自身的制度危险收束。人物转换服务于一堂欧洲共同的课，结尾没有回来衡量卡洛斯的功过比例。</p>\n<p>判断：</p>\n<p><strong>A 不保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option"},"focusId":"focus-q25-A-1"},{"section":"第三鸟 · 题目复盘","title":"B. Charles, Anxious to Succeed to the Throne","level":3,"raw":"**Which of the following is the best title of the text?**\n\n### B. Charles, Anxious to Succeed to the Throne\n\n查尔斯：急于继承王位","html":"<section class=\"revealPart\" id=\"focus-q25-B-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>查尔斯：急于继承王位</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option"},"focusId":"focus-q25-B-0"},{"section":"第三鸟 · 题目复盘","title":"B. Charles, Anxious to Succeed to the Throne","level":3,"raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n查尔斯：急于继承王位\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用查尔斯等待继位时急于接掌王位、因心急而处置失当的具体事件开篇，提出他的继位急切。 | 先摆出一个出问题的具体例子 |\n| 2 | 承认查尔斯急于承担王位职责也能带来提前投入事务、推动继位准备的积极作用。 | 再承认这类东西也有它的用处 |\n| 3 | 解释现有继承安排和长期等待为何使这份继位期待持续存在，迟迟得不到消解。 | 接着解释它为什么还能留下来 |\n| 4 | 转写查尔斯的急切怎样干扰职责边界、给王室带来不必要的继位摩擦。 | 然后转过来写它带来的麻烦 |\n| 5 | 写查尔斯及身边人如何淡化急于登基的印象，维持耐心、负责的继承人形象。 | 再写人们怎样努力维持表面 |\n| 6 | 把查尔斯心急引起的失误转给其他正在等待接班的人作提醒，说明急于上位会怎样损害准备。 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 收束到查尔斯自己的继位欲望，说明麻烦源于他内心的急切，而不只来自外部等待。 | 最后说问题其实来自内部 |\n\nB的完整意思包含查尔斯、急切态度和继承王位三个部分。实际文章只到最后一段才集中讨论查尔斯，报告的是品味、等级观念和未理解角色，没有急于登基的心理、等待过程或失当催促。\n\n若B能统领全文，中间承认好处、解释延续、转写麻烦的段落都应围绕这份急切展开。实际第二至五段分别解释王室的团结功能、人选便利、特权矛盾与形象困难，讨论范围远大于查尔斯的个人继位愿望。首段西班牙事件和尾段内部威胁也没有组成心急接班的故事。\n\n判断：\n\n**B 不保留。**","html":"<section class=\"revealPart\" id=\"focus-q25-B-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>查尔斯：急于继承王位</p>\n</section><section class=\"revealPart\" id=\"focus-q25-B-1\"><h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>查尔斯：急于继承王位</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用查尔斯等待继位时急于接掌王位、因心急而处置失当的具体事件开篇，提出他的继位急切。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认查尔斯急于承担王位职责也能带来提前投入事务、推动继位准备的积极作用。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释现有继承安排和长期等待为何使这份继位期待持续存在，迟迟得不到消解。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写查尔斯的急切怎样干扰职责边界、给王室带来不必要的继位摩擦。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写查尔斯及身边人如何淡化急于登基的印象，维持耐心、负责的继承人形象。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把查尔斯心急引起的失误转给其他正在等待接班的人作提醒，说明急于上位会怎样损害准备。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>收束到查尔斯自己的继位欲望，说明麻烦源于他内心的急切，而不只来自外部等待。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>B的完整意思包含查尔斯、急切态度和继承王位三个部分。实际文章只到最后一段才集中讨论查尔斯，报告的是品味、等级观念和未理解角色，没有急于登基的心理、等待过程或失当催促。</p>\n<p>若B能统领全文，中间承认好处、解释延续、转写麻烦的段落都应围绕这份急切展开。实际第二至五段分别解释王室的团结功能、人选便利、特权矛盾与形象困难，讨论范围远大于查尔斯的个人继位愿望。首段西班牙事件和尾段内部威胁也没有组成心急接班的故事。</p>\n<p>判断：</p>\n<p><strong>B 不保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option"},"focusId":"focus-q25-B-1"},{"section":"第三鸟 · 题目复盘","title":"C. Carlos, a Lesson for All European Monarchs","level":3,"raw":"**Which of the following is the best title of the text?**\n\n### C. Carlos, a Lesson for All European Monarchs\n\n卡洛斯：给所有欧洲君主的一课","html":"<section class=\"revealPart\" id=\"focus-q25-C-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option"},"focusId":"focus-q25-C-0"},{"section":"第三鸟 · 题目复盘","title":"C. Carlos, a Lesson for All European Monarchs","level":3,"raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n卡洛斯：给所有欧洲君主的一课\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用卡洛斯在丑闻和共和派压力中退位的案例，提出欧洲其他君主也需要面对的生存警告。 | 先摆出一个出问题的具体例子 |\n| 2 | 承认王室在社会分裂时代表国家团结的用途，使卡洛斯教训包含如何发挥作用而不只是宣布终结。 | 再承认这类东西也有它的用处 |\n| 3 | 解释少争议且受尊敬的元首角色为何让欧洲王室继续存在，指出各国君主应守住的存续条件。 | 接着解释它为什么还能留下来 |\n| 4 | 转写贵族特权、财富不平等与现代民主的冲突，说明卡洛斯事件所暴露的风险具有制度共性。 | 然后转过来写它带来的麻烦 |\n| 5 | 写欧洲王室用普通工作与日常形象淡化贵族色彩，同时说明财富和媒体让维持这种外观愈发困难。 | 再写人们怎样努力维持表面 |\n| 6 | 把西班牙的退位案例明确转成对英国王室的提醒，使一位国王的遭遇成为其他欧洲君主应学的一课。 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 用查尔斯未理解元首服务角色说明内部风险，收束到欧洲王室成员本身最可能破坏制度的教训。 | 最后说问题其实来自内部 |\n\nC同时规定案例和范围：卡洛斯提供教训，欧洲君主是需要吸取教训的人。第一段确实以退位发问；第二、三段解释王室为何仍有用途、何以存续，给出教训的正面条件。第四、五段接着揭开特权与形象的困难，给出条件受到威胁的原因。\n\n第六段用 `the Spanish example` 将案例直接推向英国，第七段说明女王怎样维持声誉、查尔斯为何带来危险，再用国王自身是最大敌人收束。标题的教训涵盖这条完整推进，并没有把文章读成欧洲王室马上全部终结，也没有把共同问题缩成个人传记。\n\n判断：\n\n**C 保留。**","html":"<section class=\"revealPart\" id=\"focus-q25-C-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n</section><section class=\"revealPart\" id=\"focus-q25-C-1\"><h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用卡洛斯在丑闻和共和派压力中退位的案例，提出欧洲其他君主也需要面对的生存警告。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认王室在社会分裂时代表国家团结的用途，使卡洛斯教训包含如何发挥作用而不只是宣布终结。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释少争议且受尊敬的元首角色为何让欧洲王室继续存在，指出各国君主应守住的存续条件。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写贵族特权、财富不平等与现代民主的冲突，说明卡洛斯事件所暴露的风险具有制度共性。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写欧洲王室用普通工作与日常形象淡化贵族色彩，同时说明财富和媒体让维持这种外观愈发困难。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把西班牙的退位案例明确转成对英国王室的提醒，使一位国王的遭遇成为其他欧洲君主应学的一课。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>用查尔斯未理解元首服务角色说明内部风险，收束到欧洲王室成员本身最可能破坏制度的教训。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>C同时规定案例和范围：卡洛斯提供教训，欧洲君主是需要吸取教训的人。第一段确实以退位发问；第二、三段解释王室为何仍有用途、何以存续，给出教训的正面条件。第四、五段接着揭开特权与形象的困难，给出条件受到威胁的原因。</p>\n<p>第六段用 <code>the Spanish example</code> 将案例直接推向英国，第七段说明女王怎样维持声誉、查尔斯为何带来危险，再用国王自身是最大敌人收束。标题的教训涵盖这条完整推进，并没有把文章读成欧洲王室马上全部终结，也没有把共同问题缩成个人传记。</p>\n<p>判断：</p>\n<p><strong>C 保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option"},"focusId":"focus-q25-C-1"},{"section":"第三鸟 · 题目复盘","title":"D. Charles, Slow to React to the Coming Threats","level":3,"raw":"
