ion>","context":{"mode":"image","asset":"questions","focus":[270,1916,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q24-A-2"},{"section":"第三鸟 · 题目复盘","title":"A. takes a tough line on political issues","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入24题题干：\n\n> 英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。\n\n但A实际说的是：\n\n> takes a tough line on political issues  \n> 在政治问题上采取强硬立场\n\nA看似顺着主旨，因为非政治服务确实是王室存续条件。但与主旨相关的行为不一定就是查尔斯在文中已经做过的行为。\n\n标题只能让我们预期某种内部风险；第七段给的是角色理解不足。用这项不足补出强硬政治立场，仍超出了明示证据。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>在政治问题上采取强硬立场</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式看到查尔斯的世界观和角色理解问题，未读到他在具体政治问题上采取强硬立场的行为。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借用 <code>hierarchical view</code> 与 <code>non-political</code>，把等级观念和对职责的误解变成已经采取强硬政治立场。原文提供思想与角色问题，却没有报告相应的政治议题或强硬态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯在政治问题上采取强硬立场。</p>\n</blockquote>\n<p>题干的 <code>Charles</code> 对应第七段 <code>The danger will come with Charles</code>。A的 <code>political issues</code> 容易让人想到下句 <code>non-political</code>，但还要找 <code>takes a tough line</code> 是否有对应。</p>\n<p>原文列两种特征：昂贵的生活品味与相当等级化的世界观。接着解释他未理解现代王室依靠少争议、非政治元首服务而存续。</p>\n<p><code>hierarchical</code> 说他如何看社会等级，<code>tough line</code> 说他在政治问题上如何表态或处理。前者不能自动推出后者；对非政治角色理解不足，也不等于已经在某个议题上态度强硬。</p>\n<p>A缺的是具体行为和态度这一层，不能由同句出现政治二字补出。原文可以支持查尔斯不适应角色，却没有给出他采取强硬政治路线的事实。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-A-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>作者写查尔斯的昂贵品味、等级观念和角色误解，结尾据此提醒王室最大的危险可能来自君主本人。</p>\n</blockquote>\n<p>作者从个人特征进入服务条件，再总结内部风险，没有举查尔斯参与政治争议的事例。最后的警告仍停留在如何理解并履行君主角色这一条线上。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The danger will come with Charles, who takes a tough line on political issues rather than remaining politically neutral.</p>\n<p>危险将随查尔斯而来：他在政治问题上立场强硬，未保持政治中立。</p>\n</blockquote>\n<p>假设需要直接写政治立场强硬，才能把A和危险连成因果。实际写法直接陈述的则是品味、世界观与未理解服务角色。两条路线可能在现实中相关，但原文未完成从观念到强硬政治行为的那一步。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>takes a tough line on political issues<br>在政治问题上采取强硬立场</p>\n</blockquote>\n<p>A看似顺着主旨，因为非政治服务确实是王室存续条件。但与主旨相关的行为不一定就是查尔斯在文中已经做过的行为。</p>\n<p>标题只能让我们预期某种内部风险；第七段给的是角色理解不足。用这项不足补出强硬政治立场，仍超出了明示证据。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1916,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q24-A-3"},{"section":"第三鸟 · 题目复盘","title":"B. fails to change his lifestyle as advised","level":3,"raw":"### B. fails to change his lifestyle as advised\n\n> 没有按照建议改变生活方式\n\n**做题模式中的状态：** 第一轮直接排除B。做题模式找到查尔斯昂贵的生活品味，但没有看到有人提出建议，也没有看到他不按建议改变的过程。\n\n**错误类型：第三类——无中生有。**\n\nB抓住 `lifestyle` 和 `fails`，加入 `as advised`。原文的未能理解被改写为未遵照建议改变，凭空多出一次建议及其未被采纳的过程。\n\n**命题人借用的原文材料：**\n\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>没有按照建议改变生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式找到查尔斯昂贵的生活品味，但没有看到有人提出建议，也没有看到他不按建议改变的过程。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住 <code>lifestyle</code> 和 <code>fails</code>，加入 <code>as advised</code>。原文的未能理解被改写为未遵照建议改变，凭空多出一次建议及其未被采纳的过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2005,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q24-B-0"},{"section":"第三鸟 · 题目复盘","title":"B. fails to change his lifestyle as advised","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 英国王室最需要担心，是因为查尔斯没有按照建议改变生活方式。\n\n`lifestyle` 在第七段直接出现，确实属于查尔斯的问题特征。接着要核对B中控制整句话的 `fails to change ... as advised`，它要求的不止是他生活昂贵。\n\n出处先写 `has ... an expensive taste of lifestyle`，报告一种既有品味；下句 `failed to understand` 的宾语是君主制为何存续，并没有变成关于改变生活的建议。\n\nB要成立，至少须有“提出过改变建议—他未依此改变”的信息。原文没有明示这种劝告发生，也没有对照劝告前后生活状态；把作者现在的批评当成他过去收到过的建议，时间与关系都被补写了。\n\n因此，生活方式这一名词虽对得上，B的完整动作链对不上。文章支持他的品味与现代角色不协调，不能再加上曾被劝告却不照做。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>没有按照建议改变生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式找到查尔斯昂贵的生活品味，但没有看到有人提出建议，也没有看到他不按建议改变的过程。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住 <code>lifestyle</code> 和 <code>fails</code>，加入 <code>as advised</code>。原文的未能理解被改写为未遵照建议改变，凭空多出一次建议及其未被采纳的过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯没有按照建议改变生活方式。</p>\n</blockquote>\n<p><code>lifestyle</code> 在第七段直接出现，确实属于查尔斯的问题特征。接着要核对B中控制整句话的 <code>fails to change ... as advised</code>，它要求的不止是他生活昂贵。</p>\n<p>出处先写 <code>has ... an expensive taste of lifestyle</code>，报告一种既有品味；下句 <code>failed to understand</code> 的宾语是君主制为何存续，并没有变成关于改变生活的建议。</p>\n<p>B要成立，至少须有“提出过改变建议—他未依此改变”的信息。原文没有明示这种劝告发生，也没有对照劝告前后生活状态；把作者现在的批评当成他过去收到过的建议，时间与关系都被补写了。</p>\n<p>因此，生活方式这一名词虽对得上，B的完整动作链对不上。文章支持他的品味与现代角色不协调，不能再加上曾被劝告却不照做。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2005,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q24-B-1"},{"section":"第三鸟 · 题目复盘","title":"B. fails to change his lifestyle as advised","level":4,"raw":"#### 写作视角法\n\n原文第7段是这样写的：\n\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> 昂贵品味与等级观念构成风险，作者随后把问题归到他不理解现代君主的服务作用。\n\n后一处把前面的两项特征放进角色标准中解释。它没有插入劝告情节，也没有把查尔斯是否听取他人建议设成判断重点。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Charles has been advised to change his expensive lifestyle but has failed to do so.\n>\n> 查尔斯曾被建议改变昂贵的生活方式，却没有这样做。\n\n这句假设保留昂贵生活，但增加B必需的已给建议和未改事实。实际只描述现状，随后讨论角色认识，缺少这两环。不能因为改善生活方式听起来合理，就把劝告已发生当作作者报告的事实。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>没有按照建议改变生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式找到查尔斯昂贵的生活品味，但没有看到有人提出建议，也没有看到他不按建议改变的过程。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住 <code>lifestyle</code> 和 <code>fails</code>，加入 <code>as advised</code>。原文的未能理解被改写为未遵照建议改变，凭空多出一次建议及其未被采纳的过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯没有按照建议改变生活方式。</p>\n</blockquote>\n<p><code>lifestyle</code> 在第七段直接出现，确实属于查尔斯的问题特征。接着要核对B中控制整句话的 <code>fails to change ... as advised</code>，它要求的不止是他生活昂贵。</p>\n<p>出处先写 <code>has ... an expensive taste of lifestyle</code>，报告一种既有品味；下句 <code>failed to understand</code> 的宾语是君主制为何存续，并没有变成关于改变生活的建议。</p>\n<p>B要成立，至少须有“提出过改变建议—他未依此改变”的信息。原文没有明示这种劝告发生，也没有对照劝告前后生活状态；把作者现在的批评当成他过去收到过的建议，时间与关系都被补写了。</p>\n<p>因此，生活方式这一名词虽对得上，B的完整动作链对不上。文章支持他的品味与现代角色不协调，不能再加上曾被劝告却不照做。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-B-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>昂贵品味与等级观念构成风险，作者随后把问题归到他不理解现代君主的服务作用。</p>\n</blockquote>\n<p>后一处把前面的两项特征放进角色标准中解释。它没有插入劝告情节，也没有把查尔斯是否听取他人建议设成判断重点。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles has been advised to change his expensive lifestyle but has failed to do so.</p>\n<p>查尔斯曾被建议改变昂贵的生活方式，却没有这样做。</p>\n</blockquote>\n<p>这句假设保留昂贵生活，但增加B必需的已给建议和未改事实。实际只描述现状，随后讨论角色认识，缺少这两环。不能因为改善生活方式听起来合理，就把劝告已发生当作作者报告的事实。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2005,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q24-B-2"},{"section":"第三鸟 · 题目复盘","title":"B. fails to change his lifestyle as advised","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入24题题干：\n\n> 英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。\n\n但B实际说的是：\n\n> fails to change his lifestyle as advised  \n> 没有按照建议改变生活方式\n\n全文确实给王室提出警示，但文章本身在警示，不等于查尔斯此前已收到并拒绝生活方式建议。B把主旨中的教训误变成了人物经历。\n\n题干要查尔斯为何构成内部危险，末段用角色理解不足回答。B虽提到生活方式，却让没有出处的建议过程承担了因果解释。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>没有按照建议改变生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式找到查尔斯昂贵的生活品味，但没有看到有人提出建议，也没有看到他不按建议改变的过程。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>B抓住 <code>lifestyle</code> 和 <code>fails</code>，加入 <code>as advised</code>。原文的未能理解被改写为未遵照建议改变，凭空多出一次建议及其未被采纳的过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯没有按照建议改变生活方式。</p>\n</blockquote>\n<p><code>lifestyle</code> 在第七段直接出现，确实属于查尔斯的问题特征。接着要核对B中控制整句话的 <code>fails to change ... as advised</code>，它要求的不止是他生活昂贵。</p>\n<p>出处先写 <code>has ... an expensive taste of lifestyle</code>，报告一种既有品味；下句 <code>failed to understand</code> 的宾语是君主制为何存续，并没有变成关于改变生活的建议。</p>\n<p>B要成立，至少须有“提出过改变建议—他未依此改变”的信息。原文没有明示这种劝告发生，也没有对照劝告前后生活状态；把作者现在的批评当成他过去收到过的建议，时间与关系都被补写了。</p>\n<p>因此，生活方式这一名词虽对得上，B的完整动作链对不上。文章支持他的品味与现代角色不协调，不能再加上曾被劝告却不照做。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-B-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>昂贵品味与等级观念构成风险，作者随后把问题归到他不理解现代君主的服务作用。</p>\n</blockquote>\n<p>后一处把前面的两项特征放进角色标准中解释。它没有插入劝告情节，也没有把查尔斯是否听取他人建议设成判断重点。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles has been advised to change his expensive lifestyle but has failed to do so.</p>\n<p>查尔斯曾被建议改变昂贵的生活方式，却没有这样做。</p>\n</blockquote>\n<p>这句假设保留昂贵生活，但增加B必需的已给建议和未改事实。实际只描述现状，随后讨论角色认识，缺少这两环。不能因为改善生活方式听起来合理，就把劝告已发生当作作者报告的事实。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>fails to change his lifestyle as advised<br>没有按照建议改变生活方式</p>\n</blockquote>\n<p>全文确实给王室提出警示，但文章本身在警示，不等于查尔斯此前已收到并拒绝生活方式建议。B把主旨中的教训误变成了人物经历。</p>\n<p>题干要查尔斯为何构成内部危险，末段用角色理解不足回答。B虽提到生活方式，却让没有出处的建议过程承担了因果解释。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2005,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q24-B-3"},{"section":"第三鸟 · 题目复盘","title":"C. takes republicans as his potential allies","level":3,"raw":"### C. takes republicans as his potential allies\n\n> 把共和派视为潜在盟友\n\n**做题模式中的状态：** 第一轮直接排除C。做题模式已读懂结尾把国王而非共和派列为王室最大敌人，没有把“共和派不是最大敌人”转成查尔斯视其为盟友。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用结尾的 `not republicans`，把“共和派不是最坏敌人”反推成“共和派是潜在盟友”，还将作者的评论移成查尔斯本人的判断。关系和观点持有者都变了。\n\n**命题人借用的原文材料：**\n\n> Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy's worst enemies.","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>把共和派视为潜在盟友</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已读懂结尾把国王而非共和派列为王室最大敌人，没有把“共和派不是最大敌人”转成查尔斯视其为盟友。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借用结尾的 <code>not republicans</code>，把“共和派不是最坏敌人”反推成“共和派是潜在盟友”，还将作者的评论移成查尔斯本人的判断。关系和观点持有者都变了。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2093,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q24-C-0"},{"section":"第三鸟 · 题目复盘","title":"C. takes republicans as his potential allies","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 英国王室最需要担心，是因为查尔斯把共和派视为自己的潜在盟友。\n\n`republicans` 直接定位第七段末句。原文完整对照是 `it is kings, not republicans, who are the monarchy's worst enemies`，需要连同比较程度和判断主体一起读。\n\n作者提醒查尔斯：从英国历史看，对君主制危害最大的可能是国王自身。`not republicans` 排除的是共和派占据“最坏敌人”这一位置，没有否认他们可能反对君主制。\n\nC用 `potential allies` 跨到了潜在盟友。不是最危险的敌人，还可以是较弱的对手、中立者等，并不必然成为盟友；原文没有合作或结盟信息。\n\n再看谁在判断：`Charles ought to know` 是作者认为查尔斯应懂的道理，C却声称查尔斯已经把某些人视作盟友。这样把作者的提醒变成人物现有看法，也改变了原句。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>把共和派视为潜在盟友</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已读懂结尾把国王而非共和派列为王室最大敌人，没有把“共和派不是最大敌人”转成查尔斯视其为盟友。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借用结尾的 <code>not republicans</code>，把“共和派不是最坏敌人”反推成“共和派是潜在盟友”，还将作者的评论移成查尔斯本人的判断。关系和观点持有者都变了。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯把共和派视为自己的潜在盟友。</p>\n</blockquote>\n<p><code>republicans</code> 直接定位第七段末句。原文完整对照是 <code>it is kings, not republicans, who are the monarchy&#39;s worst enemies</code>，需要连同比较程度和判断主体一起读。</p>\n<p>作者提醒查尔斯：从英国历史看，对君主制危害最大的可能是国王自身。<code>not republicans</code> 排除的是共和派占据“最坏敌人”这一位置，没有否认他们可能反对君主制。</p>\n<p>C用 <code>potential allies</code> 跨到了潜在盟友。不是最危险的敌人，还可以是较弱的对手、中立者等，并不必然成为盟友；原文没有合作或结盟信息。</p>\n<p>再看谁在判断：<code>Charles ought to know</code> 是作者认为查尔斯应懂的道理，C却声称查尔斯已经把某些人视作盟友。这样把作者的提醒变成人物现有看法，也改变了原句。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2093,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q24-C-1"},{"section":"第三鸟 · 题目复盘","title":"C. takes republicans as his potential allies","level":4,"raw":"#### 写作视角法\n\n原文第7段是这样写的：\n\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy's worst enemies.\n>\n> 查尔斯未理解王室的服务条件，作者提醒他，国王自己往往才是君主制最大的敌人。\n\n结尾把危险从外部共和派转回王室内部，回应查尔斯自身的问题。整个收束不需要一段查尔斯结盟共和派的故事。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Charles regards republicans as potential allies, and this mistaken alliance could endanger the monarchy.\n>\n> 查尔斯把共和派看作潜在盟友，而这种错误的结盟可能危及王室。\n\nC成立时，文章必须先报告查尔斯的盟友判断，才能解释它造成什么危险。实际用了 `ought to know` 提醒他认识内部威胁；共和派只在敌人程度对照中出现，没有变成他计划合作的人。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>把共和派视为潜在盟友</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已读懂结尾把国王而非共和派列为王室最大敌人，没有把“共和派不是最大敌人”转成查尔斯视其为盟友。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借用结尾的 <code>not republicans</code>，把“共和派不是最坏敌人”反推成“共和派是潜在盟友”，还将作者的评论移成查尔斯本人的判断。关系和观点持有者都变了。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯把共和派视为自己的潜在盟友。</p>\n</blockquote>\n<p><code>republicans</code> 直接定位第七段末句。原文完整对照是 <code>it is kings, not republicans, who are the monarchy&#39;s worst enemies</code>，需要连同比较程度和判断主体一起读。</p>\n<p>作者提醒查尔斯：从英国历史看，对君主制危害最大的可能是国王自身。<code>not republicans</code> 排除的是共和派占据“最坏敌人”这一位置，没有否认他们可能反对君主制。</p>\n<p>C用 <code>potential allies</code> 跨到了潜在盟友。不是最危险的敌人，还可以是较弱的对手、中立者等，并不必然成为盟友；原文没有合作或结盟信息。</p>\n<p>再看谁在判断：<code>Charles ought to know</code> 是作者认为查尔斯应懂的道理，C却声称查尔斯已经把某些人视作盟友。这样把作者的提醒变成人物现有看法，也改变了原句。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-C-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>查尔斯未理解王室的服务条件，作者提醒他，国王自己往往才是君主制最大的敌人。</p>\n</blockquote>\n<p>结尾把危险从外部共和派转回王室内部，回应查尔斯自身的问题。整个收束不需要一段查尔斯结盟共和派的故事。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles regards republicans as potential allies, and this mistaken alliance could endanger the monarchy.</p>\n<p>查尔斯把共和派看作潜在盟友，而这种错误的结盟可能危及王室。</p>\n</blockquote>\n<p>C成立时，文章必须先报告查尔斯的盟友判断，才能解释它造成什么危险。实际用了 <code>ought to know</code> 提醒他认识内部威胁；共和派只在敌人程度对照中出现，没有变成他计划合作的人。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2093,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q24-C-2"},{"section":"第三鸟 · 题目复盘","title":"C. takes republicans as his potential allies","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入24题题干：\n\n> 英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。\n\n但C实际说的是：\n\n> takes republicans as his potential allies  \n> 把共和派视为潜在盟友\n\n主旨把西班牙教训传给欧洲王室，结尾进一步指明成员自身可能毁坏制度。C把这条内部警示改成了对外联盟风险，换掉了作者最后收束的关系。\n\n尤其不能从不是最坏敌人跳到潜在盟友，再把作者判断放进查尔斯头脑里。全篇教训与局部句子共同指出这种双重改写。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>把共和派视为潜在盟友</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已读懂结尾把国王而非共和派列为王室最大敌人，没有把“共和派不是最大敌人”转成查尔斯视其为盟友。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C借用结尾的 <code>not republicans</code>，把“共和派不是最坏敌人”反推成“共和派是潜在盟友”，还将作者的评论移成查尔斯本人的判断。关系和观点持有者都变了。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯把共和派视为自己的潜在盟友。</p>\n</blockquote>\n<p><code>republicans</code> 直接定位第七段末句。原文完整对照是 <code>it is kings, not republicans, who are the monarchy&#39;s worst enemies</code>，需要连同比较程度和判断主体一起读。</p>\n<p>作者提醒查尔斯：从英国历史看，对君主制危害最大的可能是国王自身。<code>not republicans</code> 排除的是共和派占据“最坏敌人”这一位置，没有否认他们可能反对君主制。</p>\n<p>C用 <code>potential allies</code> 跨到了潜在盟友。不是最危险的敌人，还可以是较弱的对手、中立者等，并不必然成为盟友；原文没有合作或结盟信息。</p>\n<p>再看谁在判断：<code>Charles ought to know</code> 是作者认为查尔斯应懂的道理，C却声称查尔斯已经把某些人视作盟友。这样把作者的提醒变成人物现有看法，也改变了原句。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-C-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>查尔斯未理解王室的服务条件，作者提醒他，国王自己往往才是君主制最大的敌人。</p>\n</blockquote>\n<p>结尾把危险从外部共和派转回王室内部，回应查尔斯自身的问题。整个收束不需要一段查尔斯结盟共和派的故事。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles regards republicans as potential allies, and this mistaken alliance could endanger the monarchy.</p>\n<p>查尔斯把共和派看作潜在盟友，而这种错误的结盟可能危及王室。</p>\n</blockquote>\n<p>C成立时，文章必须先报告查尔斯的盟友判断，才能解释它造成什么危险。实际用了 <code>ought to know</code> 提醒他认识内部威胁；共和派只在敌人程度对照中出现，没有变成他计划合作的人。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>takes republicans as his potential allies<br>把共和派视为潜在盟友</p>\n</blockquote>\n<p>主旨把西班牙教训传给欧洲王室，结尾进一步指明成员自身可能毁坏制度。C把这条内部警示改成了对外联盟风险，换掉了作者最后收束的关系。</p>\n<p>尤其不能从不是最坏敌人跳到潜在盟友，再把作者判断放进查尔斯头脑里。全篇教训与局部句子共同指出这种双重改写。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2093,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q24-C-3"},{"section":"第三鸟 · 题目复盘","title":"D. fails to adapt himself to his future role","level":3,"raw":"### D. fails to adapt himself to his future role\n\n> 未能使自己适应未来角色\n\n**做题模式中的状态：** 第一轮保留并确定D。选项当时为 `fails to [xxx] himself to his future role`，`adapt` 被遮挡；做题模式仍从 `failed to understand` 和国家元首服务要求，看出他与未来角色不相适应。\n\n**选项类型：正确跨句概括。**\n\nD把生活品味、等级观念以及未理解服务条件三处信息概括成未来角色适应不足。`future role` 指未来君主的国家元首职责；`fails to adapt` 概括前文特征与这一职责不匹配。\n\n**出处：**\n\n> While Europe's monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.\n>\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>未能使自己适应未来角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定D。选项当时为 <code>fails to [xxx] himself to his future role</code>，<code>adapt</code> 被遮挡；做题模式仍从 <code>failed to understand</code> 和国家元首服务要求，看出他与未来角色不相适应。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>D把生活品味、等级观念以及未理解服务条件三处信息概括成未来角色适应不足。<code>future role</code> 指未来君主的国家元首职责；<code>fails to adapt</code> 概括前文特征与这一职责不匹配。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2181,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q24-D-0"},{"section":"第三鸟 · 题目复盘","title":"D. fails to adapt himself to his future role","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 英国王室最需要担心，是因为查尔斯未能使自己适应未来角色。\n\n第六段 `British royals ... have most to fear` 是题干原词，下一段 `The danger will come with Charles` 指出具体风险人物。需要把这两句接起来，再找危险缘由。\n\n后文先写查尔斯的昂贵品味、等级化世界观，再写 `He has failed to understand` 王室存续是因为提供服务。破折号后把服务明确为少争议、非政治的国家元首职责。\n\n这三层各有分工：品味与观念给人物特征，未理解给出缺口，元首服务说明应适应的角色。D用 `future role` 收束职责，用 `fails to adapt himself` 概括人物特征与职责之间的差距。\n\n这里无需补一次拒绝建议或强硬政治行动。原文已经给出角色标准及查尔斯没有理解标准的事实，D是在这些事实之间作最小概括，因而能回答英国为何面临特别风险。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>未能使自己适应未来角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定D。选项当时为 <code>fails to [xxx] himself to his future role</code>，<code>adapt</code> 被遮挡；做题模式仍从 <code>failed to understand</code> 和国家元首服务要求，看出他与未来角色不相适应。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>D把生活品味、等级观念以及未理解服务条件三处信息概括成未来角色适应不足。<code>future role</code> 指未来君主的国家元首职责；<code>fails to adapt</code> 概括前文特征与这一职责不匹配。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯未能使自己适应未来角色。</p>\n</blockquote>\n<p>第六段 <code>British royals ... have most to fear</code> 是题干原词，下一段 <code>The danger will come with Charles</code> 指出具体风险人物。需要把这两句接起来，再找危险缘由。</p>\n<p>后文先写查尔斯的昂贵品味、等级化世界观，再写 <code>He has failed to understand</code> 王室存续是因为提供服务。破折号后把服务明确为少争议、非政治的国家元首职责。</p>\n<p>这三层各有分工：品味与观念给人物特征，未理解给出缺口，元首服务说明应适应的角色。D用 <code>future role</code> 收束职责，用 <code>fails to adapt himself</code> 概括人物特征与职责之间的差距。</p>\n<p>这里无需补一次拒绝建议或强硬政治行动。原文已经给出角色标准及查尔斯没有理解标准的事实，D是在这些事实之间作最小概括，因而能回答英国为何面临特别风险。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2181,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q24-D-1"},{"section":"第三鸟 · 题目复盘","title":"D. fails to adapt himself to his future role","level":4,"raw":"#### 写作视角法\n\n原文第7段是这样写的：\n\n> It is only the Queen who has preserved the monarchy's reputation with her rather ordinary (if well-heeled) granny style.\n>\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy's worst enemies.\n>\n> 女王以普通的公共形象保住声誉；查尔斯的昂贵品味、等级观念和角色误解形成对照，结尾再警告内部威胁。\n\n女王与查尔斯并排，显示不同角色理解可能怎样影响王室声誉。作者随后把这组个人对照提升为制度教训，查尔斯是尚未学会这堂课的警示对象。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Charles has failed to adapt to the restrained, non-political role on which the monarchy's survival depends.\n>\n> 查尔斯未能适应王室存续所依赖的那种克制、非政治的角色。\n\n这段假设把前面的特征和后面的服务条件连成一句，没有添加新的经历。女王的相对普通形象说明怎样能维护声誉，查尔斯的特征与职责认识说明为何担忧，正好支持D的角色适应概括。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>未能使自己适应未来角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定D。选项当时为 <code>fails to [xxx] himself to his future role</code>，<code>adapt</code> 被遮挡；做题模式仍从 <code>failed to understand</code> 和国家元首服务要求，看出他与未来角色不相适应。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p>D把生活品味、等级观念以及未理解服务条件三处信息概括成未来角色适应不足。<code>future role</code> 指未来君主的国家元首职责；<code>fails to adapt</code> 概括前文特征与这一职责不匹配。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯未能使自己适应未来角色。</p>\n</blockquote>\n<p>第六段 <code>British royals ... have most to fear</code> 是题干原词，下一段 <code>The danger will come with Charles</code> 指出具体风险人物。需要把这两句接起来，再找危险缘由。</p>\n<p>后文先写查尔斯的昂贵品味、等级化世界观，再写 <code>He has failed to understand</code> 王室存续是因为提供服务。破折号后把服务明确为少争议、非政治的国家元首职责。</p>\n<p>这三层各有分工：品味与观念给人物特征，未理解给出缺口，元首服务说明应适应的角色。D用 <code>future role</code> 收束职责，用 <code>fails to adapt himself</code> 概括人物特征与职责之间的差距。</p>\n<p>这里无需补一次拒绝建议或强硬政治行动。原文已经给出角色标准及查尔斯没有理解标准的事实，D是在这些事实之间作最小概括，因而能回答英国为何面临特别风险。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-D-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>It is only the Queen who has preserved the monarchy&#39;s reputation with her rather ordinary (if well-heeled) granny style.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>女王以普通的公共形象保住声誉；查尔斯的昂贵品味、等级观念和角色误解形成对照，结尾再警告内部威胁。</p>\n</blockquote>\n<p>女王与查尔斯并排，显示不同角色理解可能怎样影响王室声誉。作者随后把这组个人对照提升为制度教训，查尔斯是尚未学会这堂课的警示对象。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles has failed to adapt to the restrained, non-political role on which the monarchy&#39;s survival depends.</p>\n<p>查尔斯未能适应王室存续所依赖的那种克制、非政治的角色。</p>\n</blockquote>\n<p>这段假设把前面的特征和后面的服务条件连成一句，没有添加新的经历。女王的相对普通形象说明怎样能维护声誉，查尔斯的特征与职责认识说明为何担忧，正好支持D的角色适应概括。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2181,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q24-D-2"},{"section":"第三鸟 · 题目复盘","title":"D. fails to adapt himself to his future role","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入24题题干：\n\n> 英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。\n\nD实际说的是：\n\n> fails to adapt himself to his future role  \n> 未能使自己适应未来角色\ ather ordinary (if well-heeled) granny style.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>女王以普通的公共形象保住声誉；查尔斯的昂贵品味、等级观念和角色误解形成对照，结尾再警告内部威胁。</p>\n</blockquote>\n<p>女王与查尔斯并排，显示不同角色理解可能怎样影响王室声誉。作者随后把这组个人对照提升为制度教训，查尔斯是尚未学会这堂课的警示对象。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Charles has failed to adapt to the restrained, non-political role on which the monarchy&#39;s survival depends.</p>\n<p>查尔斯未能适应王室存续所依赖的那种克制、非政治的角色。</p>\n</blockquote>\n<p>这段假设把前面的特征和后面的服务条件连成一句，没有添加新的经历。女王的相对普通形象说明怎样能维护声誉，查尔斯的特征与职责认识说明为何担忧，正好支持D的角色适应概括。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入24题题干：</p>\n<blockquote>\n<p>英国王室特别值得担心，是因为查尔斯身上可能出现让英国重蹈西班牙教训的风险。主旨把两个案例联系起来，但不能独自说明查尔斯具体做错了什么，仍须以末段的描述确认。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>fails to adapt himself to his future role<br>未能使自己适应未来角色</p>\n</blockquote>\n<p>D把查尔斯的问题放在现代君主必须学会的服务角色上，能够解释为什么卡洛斯的教训尤其值得英国王室警惕。它与全篇由案例到制度、再回到内部风险的推进一致。</p>\n<p>具体支持仍来自末段：人物特征、未理解与角色要求相连。主旨确认这是欧洲共同教训的一部分，局部证据确认查尔斯适应不足的具体含义。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,2181,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q24-D-3"},{"section":"第三鸟 · 题目复盘","title":"24题结论","level":2,"raw":"### 24题结论\n\n> **24. D. fails to adapt himself to his future role**\n\nA新增强硬政治立场，B新增未遵劝告的过程，C改坏敌我关系与观点主体；D概括特征、认识与未来职责之间的差距。","html":"<blockquote>\n<p><strong>24. D. fails to adapt himself to his future role</strong></p>\n</blockquote>\n<p>A新增强硬政治立场，B新增未遵劝告的过程，C改坏敌我关系与观点主体；D概括特征、认识与未来职责之间的差距。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,1830,1500,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","questionConclusion":true},"focusId":null},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：西班牙国王退位引发的思考**（段落1核心事件） 胡安·卡洛斯的转变：【曾坚持\"国王不退位，死在睡梦中\" → 因丑闻和共和派压力被迫退位】→ 引发质疑：（西班牙危机是否预示君主制末日？）→（是否所有欧洲皇室都将终结？）\n\n↓（案例分析）\n\n**逻辑层次2：君主制的双面性**（段落2-3利弊分析） 积极面：当社会两极分化时可超越政治体现国家团结（如佛朗哥政权后）→ 欧洲君主制现状：【除中东外世界君主最多地区（10个王国）// 与海湾亚洲专制君主不同：让选民避免寻找无争议但受尊敬公众人物的困难】\n\n//（转折：负面因素）\n\n**逻辑层次3：君主制的内在矛盾**（段落4-5现代困境） 根本矛盾：【声称象征国家团结 // 实际体现过时特权和不平等】→ 时代背景：皮凯蒂等警告财富不平等加剧时，贵族家庭仍是民主国家象征核心（奇怪）→ 应对策略：（成功君主制努力隐藏贵族方式：王子公主有工作、骑自行车）// 但仍与1%精英交往，媒体使维持形象困难\n\n↓（具体警示）\n\n**逻辑层次4：英国皇室的特殊危机**（段落6-7英国案例） 英国最应从西班牙例子中担忧 → 现状对比：【女王以普通老奶奶风格维持声誉 // 查尔斯：昂贵生活品味+等级化世界观】→ 查尔斯的失误：未理解君主制存续因提供无争议、非政治的元首服务 → 历史教训：是国王而非共和派才是君主制最大敌人\n\n↑（全文主旨）\n\n全文核心观点：欧洲君主制面临现代性挑战，需要在保持象征性地位和适应民主价值观之间找到平衡。西班牙国王的退位为所有欧洲君主敲响警钟，特别是英国的查尔斯王子，他必须理解君主制的存续依赖于提供无争议的公共服务，而非坚持贵族特权。","html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：西班牙国王退位引发的思考</strong>（段落1核心事件） 胡安·卡洛斯的转变：【曾坚持&quot;国王不退位，死在睡梦中&quot; → 因丑闻和共和派压力被迫退位】→ 引发质疑：（西班牙危机是否预示君主制末日？）→（是否所有欧洲皇室都将终结？）</p>\n<p>↓（案例分析）</p>\n<p><strong>逻辑层次2：君主制的双面性</strong>（段落2-3利弊分析） 积极面：当社会两极分化时可超越政治体现国家团结（如佛朗哥政权后）→ 欧洲君主制现状：【除中东外世界君主最多地区（10个王国）// 与海湾亚洲专制君主不同：让选民避免寻找无争议但受尊敬公众人物的困难】</p>\n<p>//（转折：负面因素）</p>\n<p><strong>逻辑层次3：君主制的内在矛盾</strong>（段落4-5现代困境） 根本矛盾：【声称象征国家团结 // 实际体现过时特权和不平等】→ 时代背景：皮凯蒂等警告财富不平等加剧时，贵族家庭仍是民主国家象征核心（奇怪）→ 应对策略：（成功君主制努力隐藏贵族方式：王子公主有工作、骑自行车）// 但仍与1%精英交往，媒体使维持形象困难</p>\n<p>↓（具体警示）</p>\n<p><strong>逻辑层次4：英国皇室的特殊危机</strong>（段落6-7英国案例） 英国最应从西班牙例子中担忧 → 现状对比：【女王以普通老奶奶风格维持声誉 // 查尔斯：昂贵生活品味+等级化世界观】→ 查尔斯的失误：未理解君主制存续因提供无争议、非政治的元首服务 → 历史教训：是国王而非共和派才是君主制最大敌人</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：欧洲君主制面临现代性挑战，需要在保持象征性地位和适应民主价值观之间找到平衡。西班牙国王的退位为所有欧洲君主敲响警钟，特别是英国的查尔斯王子，他必须理解君主制的存续依赖于提供无争议的公共服务，而非坚持贵族特权。</p>\n","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：C. A Spanish Warning for Other Crowns / 给其他王室的西班牙警告**\n\n这一部分从卡洛斯难堪退位写起，随即把事件的适用范围扩大到其他欧洲王室。首句是事件，中心动作是把西班牙的事变成别国也要面对的警告。\n\n> Yet the important question reached beyond the man who had lost his position.\n>\n> Spain did not prove that every monarchy was about to disappear.\n>\n> It showed how one royal failure could expose a problem that neighbouring crowns also needed to consider.\n\n段内推进：\n\n> 个人退位 → 问题超出个人 → 不断言全部君主制终结 → 提醒其他王室检查自身。\n\nC的 `Spanish` 对应西班牙退位案例，`Warning` 对应需要检查自身行为，`Other Crowns` 对应其他欧洲及邻国王室。标题既有案例来源，又有这一案例在段中的功能。\n\nG会被丑闻与名誉危机吸引，但段落没有把事件收束成财富争论。它反复扩大到其他王室，且明确否定由一件事断言全体消亡；C能够覆盖这层范围变化。\n\n**41题选C。**","html":"<p><strong>答案：C. A Spanish Warning for Other Crowns / 给其他王室的西班牙警告</strong></p>\n<p>这一部分从卡洛斯难堪退位写起，随即把事件的适用范围扩大到其他欧洲王室。首句是事件，中心动作是把西班牙的事变成别国也要面对的警告。</p>\n<blockquote>\n<p>Yet the important question reached beyond the man who had lost his position.</p>\n<p>Spain did not prove that every monarchy was about to disappear.</p>\n<p>It showed how one royal failure could expose a problem that neighbouring crowns also needed to consider.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>个人退位 → 问题超出个人 → 不断言全部君主制终结 → 提醒其他王室检查自身。</p>\n</blockquote>\n<p>C的 <code>Spanish</code> 对应西班牙退位案例，<code>Warning</code> 对应需要检查自身行为，<code>Other Crowns</code> 对应其他欧洲及邻国王室。标题既有案例来源，又有这一案例在段中的功能。</p>\n<p>G会被丑闻与名誉危机吸引，但段落没有把事件收束成财富争论。它反复扩大到其他王室，且明确否定由一件事断言全体消亡；C能够覆盖这层范围变化。</p>\n<p><strong>41题选C。</strong></p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：A. A Symbol Above Party Conflict / 超越党派冲突的象征**\n\n这一部分回答王室为何没有消失，提出它可能在党派分裂中代表国家。选举被提到，是为了对比党派胜利与超越党派的连续性。\n\n> In a society divided by party loyalties, the person who wins an election may remain unacceptable to a large part of the population.\n>\n> A monarch can sometimes offer a different kind of representation: continuity that is not identified with the victory of one party over another.\n>\n> It may, however, allow a public figure to stand for the country while elected politicians argue over its government.\n\n段内推进：\n\n> 党派分裂 → 选举胜者未必获全民认可 → 君主可能提供另一种代表性 → 有限承认超越党争的国家象征。\n\n`Symbol` 对应代表国家与连续性，`Above Party Conflict` 对应不与某一党的胜利绑定。标题没有把 `can sometimes` 扩大成君主永远公平、永无争议。\n\nD借到了 `election`，但写成选举选出更好的君主。段里选出的是政界胜者，王室提供的是与这种竞争不同的代表方式；既没有选君主，也没有比较哪个君主更好。\n\n**42题选A。**","html":"<p><strong>答案：A. A Symbol Above Party Conflict / 超越党派冲突的象征</strong></p>\n<p>这一部分回答王室为何没有消失，提出它可能在党派分裂中代表国家。选举被提到，是为了对比党派胜利与超越党派的连续性。</p>\n<blockquote>\n<p>In a society divided by party loyalties, the person who wins an election may remain unacceptable to a large part of the population.</p>\n<p>A monarch can sometimes offer a different kind of representation: continuity that is not identified with the victory of one party over another.</p>\n<p>It may, however, allow a public figure to stand for the country while elected politicians argue over its government.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>党派分裂 → 选举胜者未必获全民认可 → 君主可能提供另一种代表性 → 有限承认超越党争的国家象征。</p>\n</blockquote>\n<p><code>Symbol</code> 对应代表国家与连续性，<code>Above Party Conflict</code> 对应不与某一党的胜利绑定。标题没有把 <code>can sometimes</code> 扩大成君主永远公平、永无争议。</p>\n<p>D借到了 <code>election</code>，但写成选举选出更好的君主。段里选出的是政界胜者，王室提供的是与这种竞争不同的代表方式；既没有选君主，也没有比较哪个君主更好。</p>\n<p><strong>42题选A。</strong></p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：F. The Public Service Bargain / 公共服务的交换条件**\n\n这一部分在已说明的代表位置上加上条件：公众接受世袭安排，以换取克制的公共服务。后半段说明如果只享特权不尽服务，这种安排就难以辩护。\n\n> That position brings an obligation as well as an advantage.\n>\n> In return, the monarch is expected to perform a public service with restraint.\n>\n> Once a royal figure treats the office as a personal entitlement, the exchange becomes harder to defend: the public is asked to accept the privileges while receiving less of the service that justified them.\n\n段内推进：\n\n> 接受现有人选有便利 → 与之相应有义务 → 以克制服务交换公众认可 → 服务不足会破坏交换。\n\n`Public Service` 对应克制履职，`Bargain` 对应 `In return` 与末句 `exchange`。两个部分共同概括这一段的条件关系，不能只看见公众人物就停在角色名称上。\n\nA也谈国家代表性，是最容易混的项，但那是前一部分已经建立的位置。本部分用 `obligation`、`In return` 和失衡后果向前推进，重点在公众与君主各付出什么、条件如何维持；A少了这种交换。\n\n**43题选F。**","html":"<p><strong>答案：F. The Public Service Bargain / 公共服务的交换条件</strong></p>\n<p>这一部分在已说明的代表位置上加上条件：公众接受世袭安排，以换取克制的公共服务。后半段说明如果只享特权不尽服务，这种安排就难以辩护。</p>\n<blockquote>\n<p>That position brings an obligation as well as an advantage.</p>\n<p>In return, the monarch is expected to perform a public service with restraint.</p>\n<p>Once a royal figure treats the office as a personal entitlement, the exchange becomes harder to defend: the public is asked to accept the privileges while receiving less of the service that justified them.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>接受现有人选有便利 → 与之相应有义务 → 以克制服务交换公众认可 → 服务不足会破坏交换。</p>\n</blockquote>\n<p><code>Public Service</code> 对应克制履职，<code>Bargain</code> 对应 <code>In return</code> 与末句 <code>exchange</code>。两个部分共同概括这一段的条件关系，不能只看见公众人物就停在角色名称上。</p>\n<p>A也谈国家代表性，是最容易混的项，但那是前一部分已经建立的位置。本部分用 <code>obligation</code>、<code>In return</code> 和失衡后果向前推进，重点在公众与君主各付出什么、条件如何维持；A少了这种交换。</p>\n<p><strong>43题选F。</strong></p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：E. Inherited Privilege in a Democratic Age / 民主时代的继承特权**\n\n这一部分让步承认君主可能克制且受尊敬，仍继续指出世袭身份与现代民主平等之间的矛盾。财富让反差更明显，却没有穷尽问题。\n\n> Even a monarch who observes this restraint cannot remove every contradiction.\n>\n> The symbolic centre of a modern democracy is still occupied by a family whose position is inherited.\n>\n> It asks why birth should confer a special public role in a society that values equal standing.\n\n段内推进：\n\n> 履职克制仍不够 → 民主核心由世袭家族占据 → 财富扩大反差 → 追问出生为何授予特殊公共角色。\n\n`Inherited Privilege` 包括由出身获得的特殊位置及财富历史，`Democratic Age` 对应民主共同体的平等原则。标题把矛盾两端都保留了。\n\nG只抓财富，然而段中明确写 `does not end with the size of a bank account`，随后转向出生和公共角色。把 `alone` 放进标题会删掉整段最终落下的制度问题。\n\n**44题选E。**","html":"<p><strong>答案：E. Inherited Privilege in a Democratic Age / 民主时代的继承特权</strong></p>\n<p>这一部分让步承认君主可能克制且受尊敬，仍继续指出世袭身份与现代民主平等之间的矛盾。财富让反差更明显，却没有穷尽问题。</p>\n<blockquote>\n<p>Even a monarch who observes this restraint cannot remove every contradiction.</p>\n<p>The symbolic centre of a modern democracy is still occupied by a family whose position is inherited.</p>\n<p>It asks why birth should confer a special public role in a society that values equal standing.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>履职克制仍不够 → 民主核心由世袭家族占据 → 财富扩大反差 → 追问出生为何授予特殊公共角色。</p>\n</blockquote>\n<p><code>Inherited Privilege</code> 包括由出身获得的特殊位置及财富历史，<code>Democratic Age</code> 对应民主共同体的平等原则。标题把矛盾两端都保留了。</p>\n<p>G只抓财富，然而段中明确写 <code>does not end with the size of a bank account</code>，随后转向出生和公共角色。把 <code>alone</code> 放进标题会删掉整段最终落下的制度问题。</p>\n<p><strong>44题选E。</strong></p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：B. The Limits of Looking Ordinary / 看起来普通的局限**\n\n这一部分先写王室怎样显得普通，再用财富、交往与媒体揭示形象调整的限度，结尾区分看起来像服务者与真正理解职责。\n\n> Ordinary jobs, bicycles and informal appearances can suggest that princes and princesses share the lives of other citizens.\n>\n> Such gestures may help, but they do not erase wealth, elite friendships or assumptions about rank.\n>\n> A carefully arranged photograph cannot settle that larger problem.\n\n段内推进：\n\n> 普通化形象 → 承认有帮助 → 现实差距仍在且更易曝光 → 外观不能替代职责理解。\n\n`Looking Ordinary` 对应日常工作、自行车与随和露面，`Limits` 对应这些姿态无法抹掉差距、无法替代履职认识。标题同时包括前面的做法和后面的转折。\n\nF与末尾的公共服务有联系，但本段没有重新建立公众接受与王室服务的交换。它在检验普通外观能解决多少问题；只用F会遗漏媒体、照片与形象差距这一整条推进。\n\n**45题选B。**","html":"<p><strong>答案：B. The Limits of Looking Ordinary / 看起来普通的局限</strong></p>\n<p>这一部分先写王室怎样显得普通，再用财富、交往与媒体揭示形象调整的限度，结尾区分看起来像服务者与真正理解职责。</p>\n<blockquote>\n<p>Ordinary jobs, bicycles and informal appearances can suggest that princes and princesses share the lives of other citizens.</p>\n<p>Such gestures may help, but they do not erase wealth, elite friendships or assumptions about rank.</p>\n<p>A carefully arranged photograph cannot settle that larger problem.</p>\n</blockquote>\n<p>段内推进：</p>\n<blockquote>\n<p>普通化形象 → 承认有帮助 → 现实差距仍在且更易曝光 → 外观不能替代职责理解。</p>\n</blockquote>\n<p><code>Looking Ordinary</code> 对应日常工作、自行车与随和露面，<code>Limits</code> 对应这些姿态无法抹掉差距、无法替代履职认识。标题同时包括前面的做法和后面的转折。</p>\n<p>F与末尾的公共服务有联系，但本段没有重新建立公众接受与王室服务的交换。它在检验普通外观能解决多少问题；只用F会遗漏媒体、照片与形象差距这一整条推进。</p>\n<p><strong>45题选B。</strong></p>\n","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 卡洛斯退位，提出西班牙是否暴露欧洲共同危险的问题 |\n| B | 回应继承特权与民主平等冲突，用普通化形象显示服务 |\n| C | 给出英国女王与查尔斯的对照，落下英国风险 |\n| D | 回应A的问题，承认君主制仍有国家连续性的功能 |\n| E | 转向公共服务理由仍未消除的世袭特权矛盾 |\n| F | 转写媒体下的形象困难，并将西班牙警告推向英国 |\n| G | 承接功能，说明克制且非政治的服务条件 |\n| H | 从英国比较收束到君主自身造成的内部威胁 |\n\n全文推进：\n\n> 退位提出问题 → 回答仍有用途 → 解释服务条件 → 转向世袭矛盾 → 王室调整形象 → 媒体揭出难处并转向英国 → 英国人物对照 → 内部教训\n\n完整顺序：\n\n**A → D → G → E → B → F → C → H**\n\n41—45：D、G、B、F、C。","html":"<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>卡洛斯退位，提出西班牙是否暴露欧洲共同危险的问题</td>\n</tr>\n<tr>\n<td>B</td>\n<td>回应继承特权与民主平等冲突，用普通化形象显示服务</td>\n</tr>\n<tr>\n<td>C</td>\n<td>给出英国女王与查尔斯的对照，落下英国风险</td>\n</tr>\n<tr>\n<td>D</td>\n<td>回应A的问题，承认君主制仍有国家连续性的功能</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转向公共服务理由仍未消除的世袭特权矛盾</td>\n</tr>\n<tr>\n<td>F</td>\n<td>转写媒体下的形象困难，并将西班牙警告推向英国</td>\n</tr>\n<tr>\n<td>G</td>\n<td>承接功能，说明克制且非政治的服务条件</td>\n</tr>\n<tr>\n<td>H</td>\n<td>从英国比较收束到君主自身造成的内部威胁</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>退位提出问题 → 回答仍有用途 → 解释服务条件 → 转向世袭矛盾 → 王室调整形象 → 媒体揭出难处并转向英国 → 英国人物对照 → 内部教训</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → G → E → B → F → C → H</strong></p>\n<p>41—45：D、G、B、F、C。</p>\n","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41紧接已知首段A。A已提出问题，后面还须经42接到已知E，故这里先寻找直接回答，而非抢先进入最终结论。\n\n前段A的结尾：\n\n> If one established crown could lose authority so quickly, was the problem merely Spanish, or did it reveal a danger shared by other monarchies?\n\n候选D的开头：\n\n> The answer was not that every crown had reached its final day.\n\n后段G的开头：\n\n> That function, however, depended on restraint.\n\nD的 `The answer` 直接承接A末问句，先否定全部王室终结，再说明国家连续性这一功能。D末尾 `a function` 又给下一候选G的 `That function` 提供明确先行词；两侧都能接上。\n\n局部推进：\n\n> A提出欧洲范围问题 → D回答并提出仍有功能 → G解释该功能需要克制。\n\nC虽也写别国王室，却直接从英国女王与查尔斯起笔，不能回答A的整个欧洲问题，也不给G的功能回指提供足够承接。A后过早进入英国个案，会跳过E之前所需的公共服务理由。\n\n**41题选D。**","html":"<p>41紧接已知首段A。A已提出问题，后面还须经42接到已知E，故这里先寻找直接回答，而非抢先进入最终结论。</p>\n<p>前段A的结尾：</p>\n<blockquote>\n<p>If one established crown could lose authority so quickly, was the problem merely Spanish, or did it reveal a danger shared by other monarchies?</p>\n</blockquote>\n<p>候选D的开头：</p>\n<blockquote>\n<p>The answer was not that every crown had reached its final day.</p>\n</blockquote>\n<p>后段G的开头：</p>\n<blockquote>\n<p>That function, however, depended on restraint.</p>\n</blockquote>\n<p>D的 <code>The answer</code> 直接承接A末问句，先否定全部王室终结，再说明国家连续性这一功能。D末尾 <code>a function</code> 又给下一候选G的 <code>That function</code> 提供明确先行词；两侧都能接上。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>A提出欧洲范围问题 → D回答并提出仍有功能 → G解释该功能需要克制。</p>\n</blockquote>\n<p>C虽也写别国王室，却直接从英国女王与查尔斯起笔，不能回答A的整个欧洲问题，也不给G的功能回指提供足够承接。A后过早进入英国个案，会跳过E之前所需的公共服务理由。</p>\n<p><strong>41题选D。</strong></p>\n","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n41确定D后，42位于D与已知E之间。这里要把D的制度功能推进到E提到的公共服务理由。\n\n前段D的结尾：\n\n> The institution retained a function even while a particular king had failed.\n\n候选G的开头：\n\n> That function, however, depended on restraint.\n\n后段E的开头：\n\n> Yet this justification based on public service left a central contradiction unresolved.\n\n`That function` 精确回收D末的 `a function`。G先解释克制、非政治元首服务，末句用 `justified as a service` 说明正当性；E的 `this justification based on public service` 再回收它，随后转入继承特权矛盾。\n\n局部推进：\n\n> 仍有功能 → 功能须以克制服务为条件 → 即使这种理由成立，继承特权的矛盾仍未解决。\n\nB也谈服务，但以 `this conflict between inherited privilege and democratic equality` 开头。D还没提出这组冲突，B的指代在此落空；这组冲突到E才完整出现，因此B应等待E之后。\n\n**42题选G。**","html":"<p>41确定D后，42位于D与已知E之间。这里要把D的制度功能推进到E提到的公共服务理由。</p>\n<p>前段D的结尾：</p>\n<blockquote>\n<p>The institution retained a function even while a particular king had failed.</p>\n</blockquote>\n<p>候选G的开头：</p>\n<blockquote>\n<p>That function, however, depended on restraint.</p>\n</blockquote>\n<p>后段E的开头：</p>\n<blockquote>\n<p>Yet this justification based on public service left a central contradiction unresolved.</p>\n</blockquote>\n<p><code>That function</code> 精确回收D末的 <code>a function</code>。G先解释克制、非政治元首服务，末句用 <code>justified as a service</code> 说明正当性；E的 <code>this justification based on public service</code> 再回收它，随后转入继承特权矛盾。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>仍有功能 → 功能须以克制服务为条件 → 即使这种理由成立，继承特权的矛盾仍未解决。</p>\n</blockquote>\n<p>B也谈服务，但以 <code>this conflict between inherited privilege and democratic equality</code> 开头。D还没提出这组冲突，B的指代在此落空；这组冲突到E才完整出现，因此B应等待E之后。</p>\n<p><strong>42题选G。</strong></p>\n","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43在已知E之后。E以继承特权与民主价值冲突收尾，此处需要接王室怎样回应这一冲突，并为后续形象管理的困难铺垫。\n\n前段E的结尾：\n\n> At a time of concern about inequality and inherited fortunes, the old privileges attached to royalty could make the symbol look hostile to the values it was supposed to unite.\n\n候选B的开头：\n\n> Many royal households responded to this conflict between inherited privilege and democratic equality by making royalty look less royal.\n\n后段F的开头：\n\n> Image management nevertheless became harder under continuous media scrutiny.\n\nB把 `this conflict` 展开为继承特权与民主平等，回指E的两端准确。它用工作、自行车说明如何让王室不那么像王室，随后F的 `Image management` 才有具体所指，`nevertheless` 也有可转折的努力。\n\n局部推进：\n\n> E指出制度冲突 → B介绍普通化形象的回应 → F转写形象管理越来越困难。\n\nF在词汇上也接财富，但直接放E后会跳过王室已经尝试管理形象这一环，`Image management nevertheless` 的转折对象不足。B把问题转成应对，才让F的困难有明确承接。\n\n**43题选B。**","html":"<p>43在已知E之后。E以继承特权与民主价值冲突收尾，此处需要接王室怎样回应这一冲突，并为后续形象管理的困难铺垫。</p>\n<p>前段E的结尾：</p>\n<blockquote>\n<p>At a time of concern about inequality and inherited fortunes, the old privileges attached to royalty could make the symbol look hostile to the values it was supposed to unite.</p>\n</blockquote>\n<p>候选B的开头：</p>\n<blockquote>\n<p>Many royal households responded to this conflict between inherited privilege and democratic equality by making royalty look less royal.</p>\n</blockquote>\n<p>后段F的开头：</p>\n<blockquote>\n<p>Image management nevertheless became harder under continuous media scrutiny.</p>\n</blockquote>\n<p>B把 <code>this conflict</code> 展开为继承特权与民主平等，回指E的两端准确。它用工作、自行车说明如何让王室不那么像王室，随后F的 <code>Image management</code> 才有具体所指，<code>nevertheless</code> 也有可转折的努力。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>E指出制度冲突 → B介绍普通化形象的回应 → F转写形象管理越来越困难。</p>\n</blockquote>\n<p>F在词汇上也接财富，但直接放E后会跳过王室已经尝试管理形象这一环，<code>Image management nevertheless</code> 的转折对象不足。B把问题转成应对，才让F的困难有明确承接。</p>\n<p><strong>43题选B。</strong></p>\n","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\nB确定后，44应接普通化形象的努力。45再接已知结尾H，所以这里还要为英国比较准备入口，不能提前总结全篇。\n\n前段B的结尾：\n\n> These gestures were attempts to show that service, rather than aristocratic distance, defined the modern crown.\n\n候选F的开头：\n\n> Image management nevertheless became harder under continuous media scrutiny.\n\n后段C的开头：\n\n> Britain had been protected by a queen whose public manner appeared ordinary and dutiful.\n\n`Image management` 回收B的工作、自行车等姿态，`nevertheless` 从努力转到困难。F最后以 `across the Channel` 把警告指向英国，因此C开头的 `Britain` 有清楚的地理和案例接力。\n\n局部推进：\n\n> B努力塑造普通形象 → F媒体揭示困难并指向英国 → C具体比较英国女王与查尔斯。\n\nC可以接B里的普通形象，但那样会突然换到英国，尚无F的跨海峡引导；F也就无处安放，且会把C与H的 `this British comparison` 隔开。F同时承前启后，位置更完整。\n\n**44题选F。**","html":"<p>B确定后，44应接普通化形象的努力。45再接已知结尾H，所以这里还要为英国比较准备入口，不能提前总结全篇。</p>\n<p>前段B的结尾：</p>\n<blockquote>\n<p>These gestures were attempts to show that service, rather than aristocratic distance, defined the modern crown.</p>\n</blockquote>\n<p>候选F的开头：</p>\n<blockquote>\n<p>Image management nevertheless became harder under continuous media scrutiny.</p>\n</blockquote>\n<p>后段C的开头：</p>\n<blockquote>\n<p>Britain had been protected by a queen whose public manner appeared ordinary and dutiful.</p>\n</blockquote>\n<p><code>Image management</code> 回收B的工作、自行车等姿态，<code>nevertheless</code> 从努力转到困难。F最后以 <code>across the Channel</code> 把警告指向英国，因此C开头的 <code>Britain</code> 有清楚的地理和案例接力。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>B努力塑造普通形象 → F媒体揭示困难并指向英国 → C具体比较英国女王与查尔斯。</p>\n</blockquote>\n<p>C可以接B里的普通形象，但那样会突然换到英国，尚无F的跨海峡引导；F也就无处安放，且会把C与H的 <code>this British comparison</code> 隔开。F同时承前启后，位置更完整。</p>\n<p><strong>44题选F。</strong></p>\n","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45夹在已确定F和已知H之间。F已把话题转向海峡另一侧，H称 `this British comparison`，中间必须提供具体的英国比较。\n\n前段F的结尾：\n\n> The fall of a carefully protected reputation in Spain therefore pointed directly toward the monarchy across the Channel.\n\n候选C的开头：\n\n> Britain had been protected by a queen whose public manner appeared ordinary and dutiful.\n\n后段H的开头：\n\n> The final lesson of this British comparison was therefore internal rather than revolutionary.\n\nC的 `Britain` 承接跨海峡的王室，女王的普通尽职与查尔斯的昂贵、等级观念构成比较。H据此说 `this British comparison`，并把个案归到君主自身可能危害制度的内部教训。\n\n局部推进：\n\n> F把西班牙警告推向英国 → C给出女王与查尔斯对照 → H从对照收束内部风险。\n\nG同样谈非政治服务，但它没有英国女王与查尔斯的对照，H的指代会落空；G又早已通过 `That function` 与D和E连接，不能挪来充当最后的英国案例。\n\n**45题选C。**","html":"<p>45夹在已确定F和已知H之间。F已把话题转向海峡另一侧，H称 <code>this British comparison</code>，中间必须提供具体的英国比较。</p>\n<p>前段F的结尾：</p>\n<blockquote>\n<p>The fall of a carefully protected reputation in Spain therefore pointed directly toward the monarchy across the Channel.</p>\n</blockquote>\n<p>候选C的开头：</p>\n<blockquote>\n<p>Britain had been protected by a queen whose public manner appeared ordinary and dutiful.</p>\n</blockquote>\n<p>后段H的开头：</p>\n<blockquote>\n<p>The final lesson of this British comparison was therefore internal rather than revolutionary.</p>\n</blockquote>\n<p>C的 <code>Britain</code> 承接跨海峡的王室，女王的普通尽职与查尔斯的昂贵、等级观念构成比较。H据此说 <code>this British comparison</code>，并把个案归到君主自身可能危害制度的内部教训。</p>\n<p>局部推进：</p>\n<blockquote>\n<p>F把西班牙警告推向英国 → C给出女王与查尔斯对照 → H从对照收束内部风险。</p>\n</blockquote>\n<p>G同样谈非政治服务，但它没有英国女王与查尔斯的对照，H的指代会落空；G又早已通过 <code>That function</code> 与D和E连接，不能挪来充当最后的英国案例。</p>\n<p><strong>45题选C。</strong></p>\n","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **maintaining public trust** | **维护公众信任** | **人生哲理类：理解、信任、宽容** | **宏观主题** |\n| keeping pace with changing expectations | 与变化的期待保持同步 | 人生哲理类：创新、开拓、与时俱进 | 宏观主题 |\n| **a sense of responsibility** | **责任感** | **人生哲理类：责任感、奉献精神** | **个人主题** |\n| devotion to public service | 投身公共服务 | 人生哲理类：责任感、奉献精神 | 个人主题 |\n| mutual understanding | 相互理解 | 人生哲理类：理解、信任、宽容 | 宏观主题 |\n| social equality | 社会平等 | 社会现象类：社会生活 | 宏观主题 |\n| **self-discipline** | **自律** | **人生哲理类：自律** | **个人主题** |\n| being courageous enough to admit mistakes | 勇于承认错误 | 人生哲理类：谦虚、承认不足 | 个人主题 |\n| critical thinking | 批判性思维 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| cooperation and social unity | 合作与社会团结 | 人生哲理类：团结合作 | 宏观主题 |\n| frugality | 勤俭节约 | 人生哲理类：勤俭节约 | 个人主题 |\n| **setting a positive example** | **树立积极榜样** | **人生哲理类：榜样** | **个人主题** |","html":"<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>maintaining public trust</strong></td>\n<td><strong>维护公众信任</strong></td>\n<td><strong>人生哲理类：理解、信任、宽容</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>keeping pace with changing expectations</td>\n<td>与变化的期待保持同步</td>\n<td>人生哲理类：创新、开拓、与时俱进</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>a sense of responsibility</strong></td>\n<td><strong>责任感</strong></td>\n<td><strong>人生哲理类：责任感、奉献精神</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>devotion to public service</td>\n<td>投身公共服务</td>\n<td>人生哲理类：责任感、奉献精神</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>mutual understanding</td>\n<td>相互理解</td>\n<td>人生哲理类：理解、信任、宽容</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>social equality</td>\n<td>社会平等</td>\n<td>社会现象类：社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>self-discipline</strong></td>\n<td><strong>自律</strong></td>\n<td><strong>人生哲理类：自律</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>being courageous e  value of A and then turns to its democratic costs. | 作者先承认A的现实价值，随后转向其民主成本。 |\n| 文本评论题 | The article argues that A survives by providing a restrained and non-political public service. | 文章认为，A依靠克制且非政治化的公共服务得以存续。 |\n| 文本评论题 | The central contradiction lies between inherited privilege and modern equality. | 核心矛盾在于继承特权与现代平等之间。 |\n| **文本评论题** | **The author concludes that an institution may be damaged most seriously by its own members.** | **作者最后指出，一个制度受到的最严重伤害可能来自其内部成员。** |\n| 文本评论题 | The example demonstrates why traditional institutions must adapt to changing public expectations. | 这一案例说明传统制度为什么必须适应不断变化的公众期待。 |","html":"<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画题</strong></td>\n<td><strong>The picture reveals a sharp contrast between inherited status and public responsibility.</strong></td>\n<td><strong>图画揭示了继承身份与公共责任之间的鲜明反差。</strong></td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>A is trying to maintain a respectable image under intense public scrutiny.</td>\n<td>A正努力在强烈的公众审视下维持体面形象。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>The scene shows that privilege without responsibility can weaken public trust.</td>\n<td>画面表明，没有责任约束的特权会削弱公众信任。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>A stands above party conflict and symbolizes social unity.</td>\n<td>A超越党派冲突，象征社会团结。</td>\n</tr>\n<tr>\n<td><strong>图表题</strong></td>\n<td><strong>The chart indicates a steady decline in public confidence in A.</strong></td>\n<td><strong>图表显示，公众对A的信任持续下降。</strong></td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The proportion of people supporting A fell from X to Y during the period.</td>\n<td>在这段时期内，支持A的人群比例从X降至Y。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>By contrast, public demand for transparency and accountability continued to rise.</td>\n<td>相比之下，公众对透明度与问责的需求持续上升。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The figures reflect a widening gap between institutional image and public expectation.</td>\n<td>这些数据反映出制度形象与公众期待之间不断扩大的差距。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>The article uses the case of A as a warning to similar institutions elsewhere.</strong></td>\n<td><strong>文章以A的案例警示其他类似制度。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The author first acknowledges the practical value of A and then turns to its democratic costs.</td>\n<td>作者先承认A的现实价值，随后转向其民主成本。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The article argues that A survives by providing a restrained and non-political public service.</td>\n<td>文章认为，A依靠克制且非政治化的公共服务得以存续。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The central contradiction lies between inherited privilege and modern equality.</td>\n<td>核心矛盾在于继承特权与现代平等之间。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>The author concludes that an institution may be damaged most seriously by its own members.</strong></td>\n<td><strong>作者最后指出，一个制度受到的最严重伤害可能来自其内部成员。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The example demonstrates why traditional institutions must adapt to changing public expectations.</td>\n<td>这一案例说明传统制度为什么必须适应不断变化的公众期待。</td>\n</tr>\n</tbody></table></div>\n","context":{"mode":"image","asset":"articleAnnotated","label":"2015英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null}];
