**Which of the following is the best title of the text?**\n\n### D. Charles, Slow to React to the Coming Threats\n\n查尔斯：对即将到来的威胁反应迟缓","html":"<section class=\"revealPart\" id=\"focus-q25-D-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option"},"focusId":"focus-q25-D-0"},{"section":"第三鸟 · 题目复盘","title":"D. Charles, Slow to React to the Coming Threats","level":3,"raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n查尔斯：对即将到来的威胁反应迟缓\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用查尔斯在外界警报已经出现后仍未及时调整的事件开篇，具体展示他对将至威胁反应迟缓。 | 先摆出一个出问题的具体例子 |\n| 2 | 承认谨慎反应有避免草率行动、维持王室稳定的用途，为查尔斯的迟缓呈现可以理解的一面。 | 再承认这类东西也有它的用处 |\n| 3 | 解释既有惯例和保护性环境如何让查尔斯延续等待反应的做法，未能及时摆脱迟缓状态。 | 接着解释它为什么还能留下来 |\n| 4 | 转写威胁临近时继续拖延会怎样扩大损失，使原本的谨慎变成王室的负担。 | 然后转过来写它带来的麻烦 |\n| 5 | 写查尔斯身边人如何把迟缓包装成从容，让公众暂时看不出他尚未应对迫近危险。 | 再写人们怎样努力维持表面 |\n| 6 | 把查尔斯延误应对的案例转给其他王室作提醒，要求他们在类似威胁逼近前及早调整。 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 指出迟缓的根源在查尔斯自身的观念与决策习惯，收束到内部反应能力比外部威胁更成问题。 | 最后说问题其实来自内部 |\n\nD比B更接近结尾的警告气氛，但它仍要求一条特定关系：威胁正在迫近，查尔斯本有反应机会，却反应迟缓。文章没有交代这样一个时序，只描述他的既有特征和角色认识缺口；不理解职责不能直接改成面对威胁时反应慢。\n\n范围也不相同。前六段主要讨论欧洲君主制的普遍用途和矛盾，只有末段以查尔斯落地。若按D的假想路线，第二、三段应解释谨慎的好处与迟缓为何延续，第五段应写反应迟缓的形象包装；实际内容均未围绕查尔斯的应对速度推进。\n\n判断：\n\n**D 不保留。**","html":"<section class=\"revealPart\" id=\"focus-q25-D-0\"><p><strong>Which of the following is the best title of the text?</strong></p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n</section><section class=\"revealPart\" id=\"focus-q25-D-1\"><h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用查尔斯在外界警报已经出现后仍未及时调整的事件开篇，具体展示他对将至威胁反应迟缓。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认谨慎反应有避免草率行动、维持王室稳定的用途，为查尔斯的迟缓呈现可以理解的一面。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释既有惯例和保护性环境如何让查尔斯延续等待反应的做法，未能及时摆脱迟缓状态。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写威胁临近时继续拖延会怎样扩大损失，使原本的谨慎变成王室的负担。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写查尔斯身边人如何把迟缓包装成从容，让公众暂时看不出他尚未应对迫近危险。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把查尔斯延误应对的案例转给其他王室作提醒，要求他们在类似威胁逼近前及早调整。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>指出迟缓的根源在查尔斯自身的观念与决策习惯，收束到内部反应能力比外部威胁更成问题。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>D比B更接近结尾的警告气氛，但它仍要求一条特定关系：威胁正在迫近，查尔斯本有反应机会，却反应迟缓。文章没有交代这样一个时序，只描述他的既有特征和角色认识缺口；不理解职责不能直接改成面对威胁时反应慢。</p>\n<p>范围也不相同。前六段主要讨论欧洲君主制的普遍用途和矛盾，只有末段以查尔斯落地。若按D的假想路线，第二、三段应解释谨慎的好处与迟缓为何延续，第五段应写反应迟缓的形象包装；实际内容均未围绕查尔斯的应对速度推进。</p>\n<p>判断：</p>\n<p><strong>D 不保留。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option"},"focusId":"focus-q25-D-1"},{"section":"第三鸟 · 题目复盘","title":"25题结论","level":2,"raw":"### 25题结论\n\n**25. C. Carlos, a Lesson for All European Monarchs**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Carlos, a Lesson for All European Monarchs / 卡洛斯：给所有欧洲君主的一课**","html":"<p><strong>25. C. Carlos, a Lesson for All European Monarchs</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Carlos, a Lesson for All European Monarchs / 卡洛斯：给所有欧洲君主的一课</strong></p>\n","context":{"mode":"image","asset":"questions","focus":[280,2360,1650,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"25","questionConclusion":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"21题 · 题干、题型与核心出处","level":2,"raw":"## 21题\n\n> According to the first two paragraphs, King Juan Carlos of Spain ______.  \n> 根据前两段，西班牙国王胡安·卡洛斯怎么样？\n\n### 题型\n\n具体细节题。题干用 `the first two paragraphs` 限定前两段，又点名 `King Juan Carlos of Spain`。咱们要找关于卡洛斯本人的事实，不能把君主制的一般作用或欧洲王室的整体处境直接安到他身上。第一段先写他过去关于退位的断言，再写丑闻和选举形势迫使他退位；第二段转入制度的正反作用，没有继续介绍他的个人声望史。\n\n### 核心出处\n\n> King Juan Carlos of Spain once insisted \"kings don't abdicate, they die in their sleep.\"\n>\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.\n>\n> When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.\n\n首句给先前断言，次句给压力与结果；第二段的制度功能要与个人事实区分。","html":"<blockquote>\n<p>According to the first two paragraphs, King Juan Carlos of Spain ______.<br>根据前两段，西班牙国王胡安·卡洛斯怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干用 <code>the first two paragraphs</code> 限定前两段，又点名 <code>King Juan Carlos of Spain</code>。咱们要找关于卡洛斯本人的事实，不能把君主制的一般作用或欧洲王室的整体处境直接安到他身上。第一段先写他过去关于退位的断言，再写丑闻和选举形势迫使他退位；第二段转入制度的正反作用，没有继续介绍他的个人声望史。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n<p>首句给先前断言，次句给压力与结果；第二段的制度功能要与个人事实区分。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,245,1650,450],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","questionIntro":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"A. used to enjoy high public support","level":3,"raw":"### A. used to enjoy high public support\n\n> 过去享有很高的公众支持\n\n**做题模式中的状态：** 第一轮保留A。当时第二段的部分词语被遮挡，但君主可超越政治、代表国家团结这层作用能读出来，因此没有立即否定“过去得到支持”；读完全文后，做题模式以主旨交叉验证排除A，最终选择D。\n\n**错误类型：第三类——无中生有。**\n\nA把第二段君主制在社会分裂时可能发挥的作用，转写成卡洛斯个人过去获得过很高的公众支持。原文给出了容易让人联想“受到拥护”的材料，但“这个人＋过去＋很高支持”三个限制没有同时出现。\n\n**命题人借用的原文材料：**\n\n> When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>过去享有很高的公众支持</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A。当时第二段的部分词语被遮挡，但君主可超越政治、代表国家团结这层作用能读出来，因此没有立即否定“过去得到支持”；读完全文后，做题模式以主旨交叉验证排除A，最终选择D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把第二段君主制在社会分裂时可能发挥的作用，转写成卡洛斯个人过去获得过很高的公众支持。原文给出了容易让人联想“受到拥护”的材料，但“这个人＋过去＋很高支持”三个限制没有同时出现。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,331,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q21-A-0"},{"section":"第三鸟 · 题目复盘","title":"A. used to enjoy high public support","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据前两段，西班牙国王胡安·卡洛斯过去享有很高的公众支持。\n\n先对照 `public support` 和第二段的 `public opinion`、`national unity`。这些词都与公众和社会有关，所以A有一个看起来很像的落点；但 `public opinion` 描述的是舆论分裂，不能直接当作对卡洛斯的支持。\n\n出处说，当公众意见两极分化时，君主可以超越日常政治、体现国家团结。这里的 `monarchs can` 是君主可能发挥的制度作用；佛朗哥政权结束后，是说明舆论分裂的历史背景。\n\nA把主体缩成卡洛斯本人，把时间写成 `used to`，还增加 `high` 这个程度。一个职位能够代表国家团结，不能据此断言某位任职者过去个人支持很高。第一段的“受欢迎”属于共和派左翼，主体同样不能移给国王。\n\nA需要补入一段原文没有报告的个人声望事实。“君主能够起团结作用”可以解释为什么有人支持这一制度，却没有完成“卡洛斯过去广受公众拥护”这个命题。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>过去享有很高的公众支持</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A。当时第二段的部分词语被遮挡，但君主可超越政治、代表国家团结这层作用能读出来，因此没有立即否定“过去得到支持”；读完全文后，做题模式以主旨交叉验证排除A，最终选择D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把第二段君主制在社会分裂时可能发挥的作用，转写成卡洛斯个人过去获得过很高的公众支持。原文给出了容易让人联想“受到拥护”的材料，但“这个人＋过去＋很高支持”三个限制没有同时出现。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯过去享有很高的公众支持。</p>\n</blockquote>\n<p>先对照 <code>public support</code> 和第二段的 <code>public opinion</code>、<code>national unity</code>。这些词都与公众和社会有关，所以A有一个看起来很像的落点；但 <code>public opinion</code> 描述的是舆论分裂，不能直接当作对卡洛斯的支持。</p>\n<p>出处说，当公众意见两极分化时，君主可以超越日常政治、体现国家团结。这里的 <code>monarchs can</code> 是君主可能发挥的制度作用；佛朗哥政权结束后，是说明舆论分裂的历史背景。</p>\n<p>A把主体缩成卡洛斯本人，把时间写成 <code>used to</code>，还增加 <code>high</code> 这个程度。一个职位能够代表国家团结，不能据此断言某位任职者过去个人支持很高。第一段的“受欢迎”属于共和派左翼，主体同样不能移给国王。</p>\n<p>A需要补入一段原文没有报告的个人声望事实。“君主能够起团结作用”可以解释为什么有人支持这一制度，却没有完成“卡洛斯过去广受公众拥护”这个命题。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,331,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q21-A-1"},{"section":"第三鸟 · 题目复盘","title":"A. used to enjoy high public support","level":4,"raw":"#### 写作视角法\n\n原文第1、2段是这样写的：\n\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.\n>\n> So, does the Spanish crisis suggest that monarchy is seeing its last days?\n>\n> When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.\n>\n> 卡洛斯在压力中退位，引出君主制是否衰落的问题；随后作者承认君主在社会分裂时可能发挥团结作用。\n\n作者从一位国王的退位转到制度的两面性。后文接着解释欧洲王室为什么能够存续、又面临哪些矛盾，卡洛斯的个人支持变化没有成为这条叙述线的起点。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Juan Carlos had once enjoyed strong public support, but scandals and the rise of the republican left forced him to step down.\n>\n> 胡安·卡洛斯曾得到公众的强烈支持，但丑闻和共和派左翼的崛起迫使他退位。\n\n这段假设只添入A必需的“曾享有高支持”，后面的退位可以照旧。这样文章才建立了“过去受拥护—如今难堪退位”的个人声望反差。实际第一句讲他不肯退位的断言，第二段讲制度作用，都不能填补这条缺少的前提。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>过去享有很高的公众支持</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A。当时第二段的部分词语被遮挡，但君主可超越政治、代表国家团结这层作用能读出来，因此没有立即否定“过去得到支持”；读完全文后，做题模式以主旨交叉验证排除A，最终选择D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把第二段君主制在社会分裂时可能发挥的作用，转写成卡洛斯个人过去获得过很高的公众支持。原文给出了容易让人联想“受到拥护”的材料，但“这个人＋过去＋很高支持”三个限制没有同时出现。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯过去享有很高的公众支持。</p>\n</blockquote>\n<p>先对照 <code>public support</code> 和第二段的 <code>public opinion</code>、<code>national unity</code>。这些词都与公众和社会有关，所以A有一个看起来很像的落点；但 <code>public opinion</code> 描述的是舆论分裂，不能直接当作对卡洛斯的支持。</p>\n<p>出处说，当公众意见两极分化时，君主可以超越日常政治、体现国家团结。这里的 <code>monarchs can</code> 是君主可能发挥的制度作用；佛朗哥政权结束后，是说明舆论分裂的历史背景。</p>\n<p>A把主体缩成卡洛斯本人，把时间写成 <code>used to</code>，还增加 <code>high</code> 这个程度。一个职位能够代表国家团结，不能据此断言某位任职者过去个人支持很高。第一段的“受欢迎”属于共和派左翼，主体同样不能移给国王。</p>\n<p>A需要补入一段原文没有报告的个人声望事实。“君主能够起团结作用”可以解释为什么有人支持这一制度，却没有完成“卡洛斯过去广受公众拥护”这个命题。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法</h3>\n<p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>卡洛斯在压力中退位，引出君主制是否衰落的问题；随后作者承认君主在社会分裂时可能发挥团结作用。</p>\n</blockquote>\n<p>作者从一位国王的退位转到制度的两面性。后文接着解释欧洲王室为什么能够存续、又面临哪些矛盾，卡洛斯的个人支持变化没有成为这条叙述线的起点。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Juan Carlos had once enjoyed strong public support, but scandals and the rise of the republican left forced him to step down.</p>\n<p>胡安·卡洛斯曾得到公众的强烈支持，但丑闻和共和派左翼的崛起迫使他退位。</p>\n</blockquote>\n<p>这段假设只添入A必需的“曾享有高支持”，后面的退位可以照旧。这样文章才建立了“过去受拥护—如今难堪退位”的个人声望反差。实际第一句讲他不肯退位的断言，第二段讲制度作用，都不能填补这条缺少的前提。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,331,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q21-A-2"},{"section":"第三鸟 · 题目复盘","title":"A. used to enjoy high public support","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入21题题干：\n\n> 根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。\n\n但A实际说的是：\n\n> used to enjoy high public support  \n> 过去享有很高的公众支持\n\nA与全文有公众如何看待王室这一话题联系，但它给出的回答落在一段个人支持史上。主旨要求把卡洛斯当作警示案例，并不自动提供 `used to` 和 `high` 的事实。\n\n前两段能确认的是丑闻和政治压力下的退位。A在做题时可以暂留，复盘时却不能继续把“制度可能有用”当作“本人过去高支持”的证据。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>过去享有很高的公众支持</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A。当时第二段的部分词语被遮挡，但君主可超越政治、代表国家团结这层作用能读出来，因此没有立即否定“过去得到支持”；读完全文后，做题模式以主旨交叉验证排除A，最终选择D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把第二段君主制在社会分裂时可能发挥的作用，转写成卡洛斯个人过去获得过很高的公众支持。原文给出了容易让人联想“受到拥护”的材料，但“这个人＋过去＋很高支持”三个限制没有同时出现。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯过去享有很高的公众支持。</p>\n</blockquote>\n<p>先对照 <code>public support</code> 和第二段的 <code>public opinion</code>、<code>national unity</code>。这些词都与公众和社会有关，所以A有一个看起来很像的落点；但 <code>public opinion</code> 描述的是舆论分裂，不能直接当作对卡洛斯的支持。</p>\n<p>出处说，当公众意见两极分化时，君主可以超越日常政治、体现国家团结。这里的 <code>monarchs can</code> 是君主可能发挥的制度作用；佛朗哥政权结束后，是说明舆论分裂的历史背景。</p>\n<p>A把主体缩成卡洛斯本人，把时间写成 <code>used to</code>，还增加 <code>high</code> 这个程度。一个职位能够代表国家团结，不能据此断言某位任职者过去个人支持很高。第一段的“受欢迎”属于共和派左翼，主体同样不能移给国王。</p>\n<p>A需要补入一段原文没有报告的个人声望事实。“君主能够起团结作用”可以解释为什么有人支持这一制度，却没有完成“卡洛斯过去广受公众拥护”这个命题。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法</h3>\n<p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>卡洛斯在压力中退位，引出君主制是否衰落的问题；随后作者承认君主在社会分裂时可能发挥团结作用。</p>\n</blockquote>\n<p>作者从一位国王的退位转到制度的两面性。后文接着解释欧洲王室为什么能够存续、又面临哪些矛盾，卡洛斯的个人支持变化没有成为这条叙述线的起点。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Juan Carlos had once enjoyed strong public support, but scandals and the rise of the republican left forced him to step down.</p>\n<p>胡安·卡洛斯曾得到公众的强烈支持，但丑闻和共和派左翼的崛起迫使他退位。</p>\n</blockquote>\n<p>这段假设只添入A必需的“曾享有高支持”，后面的退位可以照旧。这样文章才建立了“过去受拥护—如今难堪退位”的个人声望反差。实际第一句讲他不肯退位的断言，第二段讲制度作用，都不能填补这条缺少的前提。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>used to enjoy high public support<br>过去享有很高的公众支持</p>\n</blockquote>\n<p>A与全文有公众如何看待王室这一话题联系，但它给出的回答落在一段个人支持史上。主旨要求把卡洛斯当作警示案例，并不自动提供 <code>used to</code> 和 <code>high</code> 的事实。</p>\n<p>前两段能确认的是丑闻和政治压力下的退位。A在做题时可以暂留，复盘时却不能继续把“制度可能有用”当作“本人过去高支持”的证据。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,331,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q21-A-3"},{"section":"第三鸟 · 题目复盘","title":"B. was unpopular among European royals","level":3,"raw":"### B. was unpopular among European royals\n\n> 在欧洲王室成员中不受欢迎\n\n**做题模式中的状态：** 第一轮直接排除B。做题模式已分清：`popularity` 说共和派左翼受欢迎，`European royals` 是后面被追问前景的对象，没有写欧洲王室不喜欢卡洛斯。\n\n**错误类型：第三类——无中生有。**\n\n命题人把同段的 `popularity` 与 `European royals` 拼接，让共和派左翼受欢迎、欧洲王室面临风险，变成卡洛斯在王室圈里不受欢迎。相同词出现了，人物间的评价关系却是新添的。\n\n**命题人借用的原文材料：**\n\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.\n>\n> Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式已分清：<code>popularity</code> 说共和派左翼受欢迎，<code>European royals</code> 是后面被追问前景的对象，没有写欧洲王室不喜欢卡洛斯。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人把同段的 <code>popularity</code> 与 <code>European royals</code> 拼接，让共和派左翼受欢迎、欧洲王室面临风险，变成卡洛斯在王室圈里不受欢迎。相同词出现了，人物间的评价关系却是新添的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,419,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q21-B-0"},{"section":"第三鸟 · 题目复盘","title":"B. was unpopular among European royals","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据前两段，西班牙国王胡安·卡洛斯在欧洲王室成员中不受欢迎。\n\n`European royals` 能定位到首段末句，`unpopular` 容易让人联想到前面的 `popularity`。要把两处分别读清，不能看到这两个词都出现就连成一句。\n\n第一处写 `the popularity of the republican left`：得到欢迎的是共和派左翼。这股声势与丑闻一起迫使卡洛斯退位。第二处问所有欧洲王室是否面临末路：王室是可能受到影响的对象。\n\nB的 `among` 把欧洲王室放到评价者的位置，声称这一群体不喜欢卡洛斯。原文没有其他君主的评论，也没有他们疏远、反对或支持卡洛斯的行为；问句只关乎他们自己的制度前景。\n\n从共和派受欢迎跳到卡洛斯不受其他王室欢迎，既换了被评价者，又新造了评价群体。卡洛斯受到政治压力，无法说明欧洲王室对他的好恶。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式已分清：<code>popularity</code> 说共和派左翼受欢迎，<code>European royals</code> 是后面被追问前景的对象，没有写欧洲王室不喜欢卡洛斯。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人把同段的 <code>popularity</code> 与 <code>European royals</code> 拼接，让共和派左翼受欢迎、欧洲王室面临风险，变成卡洛斯在王室圈里不受欢迎。相同词出现了，人物间的评价关系却是新添的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在欧洲王室成员中不受欢迎。</p>\n</blockquote>\n<p><code>European royals</code> 能定位到首段末句，<code>unpopular</code> 容易让人联想到前面的 <code>popularity</code>。要把两处分别读清，不能看到这两个词都出现就连成一句。</p>\n<p>第一处写 <code>the popularity of the republican left</code>：得到欢迎的是共和派左翼。这股声势与丑闻一起迫使卡洛斯退位。第二处问所有欧洲王室是否面临末路：王室是可能受到影响的对象。</p>\n<p>B的 <code>among</code> 把欧洲王室放到评价者的位置，声称这一群体不喜欢卡洛斯。原文没有其他君主的评论，也没有他们疏远、反对或支持卡洛斯的行为；问句只关乎他们自己的制度前景。</p>\n<p>从共和派受欢迎跳到卡洛斯不受其他王室欢迎，既换了被评价者，又新造了评价群体。卡洛斯受到政治压力，无法说明欧洲王室对他的好恶。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,419,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q21-B-1"},{"section":"第三鸟 · 题目复盘","title":"B. was unpopular among European royals","level":4,"raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.\n>\n> Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?\n>\n> 共和派左翼的声势参与构成退位压力，作者随后担心这一危机会不会波及所有欧洲王室。\n\n段落扩大的是危机范围：由西班牙一位国王，扩展到其他君主能否继续存在。后面承接制度利弊，所以“其他王室”承担被警示对象的作用。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Juan Carlos had become unpopular among his fellow European royals, who viewed him with disapproval.\n>\n> 胡安·卡洛斯已不受其他欧洲王室成员欢迎，他们对他抱有不满。\n\n假设写法必须让其他王室表达对卡洛斯的态度，B才有出处。实际末句提出的是王室们自身的前途问题。把“别人可能也受影响”读成“别人不喜欢他”，文章的关系就从制度风险变成人际评价。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式已分清：<code>popularity</code> 说共和派左翼受欢迎，<code>European royals</code> 是后面被追问前景的对象，没有写欧洲王室不喜欢卡洛斯。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人把同段的 <code>popularity</code> 与 <code>European royals</code> 拼接，让共和派左翼受欢迎、欧洲王室面临风险，变成卡洛斯在王室圈里不受欢迎。相同词出现了，人物间的评价关系却是新添的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在欧洲王室成员中不受欢迎。</p>\n</blockquote>\n<p><code>European royals</code> 能定位到首段末句，<code>unpopular</code> 容易让人联想到前面的 <code>popularity</code>。要把两处分别读清，不能看到这两个词都出现就连成一句。</p>\n<p>第一处写 <code>the popularity of the republican left</code>：得到欢迎的是共和派左翼。这股声势与丑闻一起迫使卡洛斯退位。第二处问所有欧洲王室是否面临末路：王室是可能受到影响的对象。</p>\n<p>B的 <code>among</code> 把欧洲王室放到评价者的位置，声称这一群体不喜欢卡洛斯。原文没有其他君主的评论，也没有他们疏远、反对或支持卡洛斯的行为；问句只关乎他们自己的制度前景。</p>\n<p>从共和派受欢迎跳到卡洛斯不受其他王室欢迎，既换了被评价者，又新造了评价群体。卡洛斯受到政治压力，无法说明欧洲王室对他的好恶。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-B-2\"><h3>写作视角法</h3>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<p>共和派左翼的声势参与构成退位压力，作者随后担心这一危机会不会波及所有欧洲王室。</p>\n</blockquote>\n<p>段落扩大的是危机范围：由西班牙一位国王，扩展到其他君主能否继续存在。后面承接制度利弊，所以“其他王室”承担被警示对象的作用。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Juan Carlos had become unpopular among his fellow European royals, who viewed him with disapproval.</p>\n<p>胡安·卡洛斯已不受其他欧洲王室成员欢迎，他们对他抱有不满。</p>\n</blockquote>\n<p>假设写法必须让其他王室表达对卡洛斯的态度，B才有出处。实际末句提出的是王室们自身的前途问题。把“别人可能也受影响”读成“别人不喜欢他”，文章的关系就从制度风险变成人际评价。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,419,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q21-B-2"},{"section":"第三鸟 · 题目复盘","title":"B. was unpopular among European royals","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入21题题干：\n\n> 根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。\n\n但B实际说的是：\n\n> was unpopular among European royals  \n> 在欧洲王室成员中不受欢迎\n\n标题中 `for All European Monarchs` 指这堂课讲给谁听；B的 `among European royals` 把同一群人变成评价卡洛斯的人。群体相同，关系却不同。\n\n全篇也找不到其他王室对卡洛斯的好恶。首段起作用的是退位及其警示意义，不能用一个相同的人群名称补出另一件事。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式已分清：<code>popularity</code> 说共和派左翼受欢迎，<code>European royals</code> 是后面被追问前景的对象，没有写欧洲王室不喜欢卡洛斯。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人把同段的 <code>popularity</code> 与 <code>European royals</code> 拼接，让共和派左翼受欢迎、欧洲王室面临风险，变成卡洛斯在王室圈里不受欢迎。相同词出现了，人物间的评价关系却是新添的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在欧洲王室成员中不受欢迎。</p>\n</blockquote>\n<p><code>European royals</code> 能定位到首段末句，<code>unpopular</code> 容易让人联想到前面的 <code>popularity</code>。要把两处分别读清，不能看到这两个词都出现就连成一句。</p>\n<p>第一处写 <code>the popularity of the republican left</code>：得到欢迎的是共和派左翼。这股声势与丑闻一起迫使卡洛斯退位。第二处问所有欧洲王室是否面临末路：王室是可能受到影响的对象。</p>\n<p>B的 <code>among</code> 把欧洲王室放到评价者的位置，声称这一群体不喜欢卡洛斯。原文没有其他君主的评论，也没有他们疏远、反对或支持卡洛斯的行为；问句只关乎他们自己的制度前景。</p>\n<p>从共和派受欢迎跳到卡洛斯不受其他王室欢迎，既换了被评价者，又新造了评价群体。卡洛斯受到政治压力，无法说明欧洲王室对他的好恶。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-B-2\"><h3>写作视角法</h3>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<p>共和派左翼的声势参与构成退位压力，作者随后担心这一危机会不会波及所有欧洲王室。</p>\n</blockquote>\n<p>段落扩大的是危机范围：由西班牙一位国王，扩展到其他君主能否继续存在。后面承接制度利弊，所以“其他王室”承担被警示对象的作用。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Juan Carlos had become unpopular among his fellow European royals, who viewed him with disapproval.</p>\n<p>胡安·卡洛斯已不受其他欧洲王室成员欢迎，他们对他抱有不满。</p>\n</blockquote>\n<p>假设写法必须让其他王室表达对卡洛斯的态度，B才有出处。实际末句提出的是王室们自身的前途问题。把“别人可能也受影响”读成“别人不喜欢他”，文章的关系就从制度风险变成人际评价。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>was unpopular among European royals<br>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p>标题中 <code>for All European Monarchs</code> 指这堂课讲给谁听；B的 <code>among European royals</code> 把同一群人变成评价卡洛斯的人。群体相同，关系却不同。</p>\n<p>全篇也找不到其他王室对卡洛斯的好恶。首段起作用的是退位及其警示意义，不能用一个相同的人群名称补出另一件事。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,419,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q21-B-3"},{"section":"第三鸟 · 题目复盘","title":"C. eased his relationship with his rivals","level":3,"raw":"### C. eased his relationship with his rivals\n\n> 缓和了与对手的关系\n\n**做题模式中的状态：** 第一轮直接排除C。当时虽有词被遮挡，仍能从 `forced`、`stand down` 看出共和派声势带来压力；做题模式没有把退位读成对手关系缓和。\n\n**错误类型：第三类——无中生有。**\n\nC借用退位和共和派左翼，再补上与对手关系改善的结果。压力下退出确实发生了，但退出之后是否和解，原文没有交代。\n\n**命题人借用的原文材料：**\n\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>缓和了与对手的关系</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。当时虽有词被遮挡，仍能从 <code>forced</code>、<code>stand down</code> 看出共和派声势带来压力；做题模式没有把退位读成对手关系缓和。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>C借用退位和共和派左翼，再补上与对手关系改善的结果。压力下退出确实发生了，但退出之后是否和解，原文没有交代。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,507,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q21-C-0"},{"section":"第三鸟 · 题目复盘","title":"C. eased his relationship with his rivals","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据前两段，西班牙国王胡安·卡洛斯缓和了与对手的关系。\n\n`rivals` 最容易让人联想到首段 `republican left`；`eased his relationship` 需要一条关系变得不那么紧张的信息。找到共和派这个对象后，还得继续找这种变化是否出现。\n\n出处的动作是 `have forced him to eat his words and stand down`。丑闻和共和派声势共同构成压力，卡洛斯因此收回断言、结束统治。这句话到退位便结束了。\n\n退位是身份和统治状态的变化，缓和关系是双方相处状态的变化。一个人可以在持续对立中被迫退出，退出本身不保证对手态度改变。C也没有仅仅说向对手让步，它声称关系得到了缓和。\n\n这里不能从退位再多推一步，补成已经和解。原文支持受到压力后下台，C额外写出双方关系改善这一未报告的结果。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>缓和了与对手的关系</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。当时虽有词被遮挡，仍能从 <code>forced</code>、<code>stand down</code> 看出共和派声势带来压力；做题模式没有把退位读成对手关系缓和。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>C借用退位和共和派左翼，再补上与对手关系改善的结果。压力下退出确实发生了，但退出之后是否和解，原文没有交代。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯缓和了与对手的关系。</p>\n</blockquote>\n<p><code>rivals</code> 最容易让人联想到首段 <code>republican left</code>；<code>eased his relationship</code> 需要一条关系变得不那么紧张的信息。找到共和派这个对象后，还得继续找这种变化是否出现。</p>\n<p>出处的动作是 <code>have forced him to eat his words and stand down</code>。丑闻和共和派声势共同构成压力，卡洛斯因此收回断言、结束统治。这句话到退位便结束了。</p>\n<p>退位是身份和统治状态的变化，缓和关系是双方相处状态的变化。一个人可以在持续对立中被迫退出，退出本身不保证对手态度改变。C也没有仅仅说向对手让步，它声称关系得到了缓和。</p>\n<p>这里不能从退位再多推一步，补成已经和解。原文支持受到压力后下台，C额外写出双方关系改善这一未报告的结果。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,507,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q21-C-1"},{"section":"第三鸟 · 题目复盘","title":"C. eased his relationship with his rivals","level":4,"raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.\n>\n> So, does the Spanish crisis suggest that monarchy is seeing its last days?\n>\n> Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?\n>\n> 卡洛斯在压力下退位，随后作者连续追问西班牙及欧洲君主制是否面临衰落。\n\n退位之后，作者继续放大危机，没有转向双方关系恢复平静。两句问句保持警告意味，也为后文讨论整个制度作准备。\n\n如果C真是作者的意思，文章至少得写成：\n\n> After stepping down, Juan Carlos eased his relationship with his republican rivals.\n>\n> 退位之后，胡安·卡洛斯缓和了与共和派对手的关系。\n\n假设句只补上C要求的关系变化，不必假定退位自愿，也不必添加主动谈判。即便采用这样最小的写法，实际段落仍找不到关系缓和的后续信息；它继续谈危机可能扩散。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>缓和了与对手的关系</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。当时虽有词被遮挡，仍能从 <code>forced</code>、<code>stand down</code> 看出共和派声势带来压力；做题模式没有把退位读成对手关系缓和。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>C借用退位和共和派左翼，再补上与对手关系改善的结果。压力下退出确实发生了，但退出之后是否和解，原文没有交代。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯缓和了与对手的关系。</p>\n</blockquote>\n<p><code>rivals</code> 最容易让人联想到首段 <code>republican left</code>；<code>eased his relationship</code> 需要一条关系变得不那么紧张的信息。找到共和派这个对象后，还得继续找这种变化是否出现。</p>\n<p>出处的动作是 <code>have forced him to eat his words and stand down</code>。丑闻和共和派声势共同构成压力，卡洛斯因此收回断言、结束统治。这句话到退位便结束了。</p>\n<p>退位是身份和统治状态的变化，缓和关系是双方相处状态的变化。一个人可以在持续对立中被迫退出，退出本身不保证对手态度改变。C也没有仅仅说向对手让步，它声称关系得到了缓和。</p>\n<p>这里不能从退位再多推一步，补成已经和解。原文支持受到压力后下台，C额外写出双方关系改善这一未报告的结果。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-C-2\"><h3>写作视角法</h3>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<p>卡洛斯在压力下退位，随后作者连续追问西班牙及欧洲君主制是否面临衰落。</p>\n</blockquote>\n<p>退位之后，作者继续放大危机，没有转向双方关系恢复平静。两句问句保持警告意味，也为后文讨论整个制度作准备。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>After stepping down, Juan Carlos eased his relationship with his republican rivals.</p>\n<p>退位之后，胡安·卡洛斯缓和了与共和派对手的关系。</p>\n</blockquote>\n<p>假设句只补上C要求的关系变化，不必假定退位自愿，也不必添加主动谈判。即便采用这样最小的写法，实际段落仍找不到关系缓和的后续信息；它继续谈危机可能扩散。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,507,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q21-C-2"},{"section":"第三鸟 · 题目复盘","title":"C. eased his relationship with his rivals","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入21题题干：\n\n> 根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。\n\n但C实际说的是：\n\n> eased his relationship with his rivals  \n> 缓和了与对手的关系\n\n卡洛斯给其他君主提供教训，要求我们抓住他遭遇的风险。C把回答写成关系修复的结果，全文没有用这条结果来解释这堂课。\n\n主旨不能排除现实中可能发生过和解；决定本题的是前两段只报告压力与退位，没有报告关系转好。把可能后果写成已经发生的事实，超出了出处。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>缓和了与对手的关系</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。当时虽有词被遮挡，仍能从 <code>forced</code>、<code>stand down</code> 看出共和派声势带来压力；做题模式没有把退位读成对手关系缓和。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>C借用退位和共和派左翼，再补上与对手关系改善的结果。压力下退出确实发生了，但退出之后是否和解，原文没有交代。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯缓和了与对手的关系。</p>\n</blockquote>\n<p><code>rivals</code> 最容易让人联想到首段 <code>republican left</code>；<code>eased his relationship</code> 需要一条关系变得不那么紧张的信息。找到共和派这个对象后，还得继续找这种变化是否出现。</p>\n<p>出处的动作是 <code>have forced him to eat his words and stand down</code>。丑闻和共和派声势共同构成压力，卡洛斯因此收回断言、结束统治。这句话到退位便结束了。</p>\n<p>退位是身份和统治状态的变化，缓和关系是双方相处状态的变化。一个人可以在持续对立中被迫退出，退出本身不保证对手态度改变。C也没有仅仅说向对手让步，它声称关系得到了缓和。</p>\n<p>这里不能从退位再多推一步，补成已经和解。原文支持受到压力后下台，C额外写出双方关系改善这一未报告的结果。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-C-2\"><h3>写作视角法</h3>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<p>卡洛斯在压力下退位，随后作者连续追问西班牙及欧洲君主制是否面临衰落。</p>\n</blockquote>\n<p>退位之后，作者继续放大危机，没有转向双方关系恢复平静。两句问句保持警告意味，也为后文讨论整个制度作准备。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>After stepping down, Juan Carlos eased his relationship with his republican rivals.</p>\n<p>退位之后，胡安·卡洛斯缓和了与共和派对手的关系。</p>\n</blockquote>\n<p>假设句只补上C要求的关系变化，不必假定退位自愿，也不必添加主动谈判。即便采用这样最小的写法，实际段落仍找不到关系缓和的后续信息；它继续谈危机可能扩散。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>eased his relationship with his rivals<br>缓和了与对手的关系</p>\n</blockquote>\n<p>卡洛斯给其他君主提供教训，要求我们抓住他遭遇的风险。C把回答写成关系修复的结果，全文没有用这条结果来解释这堂课。</p>\n<p>主旨不能排除现实中可能发生过和解；决定本题的是前两段只报告压力与退位，没有报告关系转好。把可能后果写成已经发生的事实，超出了出处。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,507,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q21-C-3"},{"section":"第三鸟 · 题目复盘","title":"D. ended his reign in embarrassment","level":3,"raw":"### D. ended his reign in embarrassment\n\n> 在难堪中结束了统治\n\n**做题模式中的状态：** 第一轮保留D。选项当时为 `ended his reign in [xxx]`，末词不认识，但 `ended his reign` 能对上 `stand down`；与A二选一后，做题模式结合全文警示方向确定D。复盘恢复完整的 `embarrassment`。\n\n**选项类型：正确跨句概括。**\n\n`ended his reign` 把国王 `stand down` 换成结束统治；`in embarrassment` 汇总丑闻及被迫食言的处境。首句断言与次句现实相撞，使难堪有具体依据。\n\n**出处：**\n\n> King Juan Carlos of Spain once insisted \"kings don't abdicate, they die in their sleep.\"\n>\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>在难堪中结束了统治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D。选项当时为 <code>ended his reign in [xxx]</code>，末词不认识，但 <code>ended his reign</code> 能对上 <code>stand down</code>；与A二选一后，做题模式结合全文警示方向确定D。复盘恢复完整的 <code>embarrassment</code>。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p><code>ended his reign</code> 把国王 <code>stand down</code> 换成结束统治；<code>in embarrassment</code> 汇总丑闻及被迫食言的处境。首句断言与次句现实相撞，使难堪有具体依据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,596,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q21-D-0"},{"section":"第三鸟 · 题目复盘","title":"D. ended his reign in embarrassment","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据前两段，西班牙国王胡安·卡洛斯在难堪中结束了统治。\n\n人名在第一句出现；D的 `ended his reign` 对应第二句 `stand down`。国王下台会结束其统治，这两个表达描述同一结果，不需要另找一个退位事件。\n\n再核对 `in embarrassment`。第二句直接有 `embarrassing scandals`；第一句写他曾坚称国王不会退位，第二句却写 `forced him to eat his words`。丑闻和被迫收回断言共同说明退位时的难堪。\n\n如果只读 `stand down`，只能确认结束统治，尚不能评价处境。连起先前断言与后面的丑闻、食言，D后半部分才有足够证据。这里无需推测他心里是否羞愧，选项概括的是公开处境。\n\nD保留同一个人、同一次退位及其不体面的背景。它没有增加支持率、他人好恶或和解结果，而是把相邻两句的信息压缩成一个完整事实。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>在难堪中结束了统治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D。选项当时为 <code>ended his reign in [xxx]</code>，末词不认识，但 <code>ended his reign</code> 能对上 <code>stand down</code>；与A二选一后，做题模式结合全文警示方向确定D。复盘恢复完整的 <code>embarrassment</code>。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p><code>ended his reign</code> 把国王 <code>stand down</code> 换成结束统治；<code>in embarrassment</code> 汇总丑闻及被迫食言的处境。首句断言与次句现实相撞，使难堪有具体依据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在难堪中结束了统治。</p>\n</blockquote>\n<p>人名在第一句出现；D的 <code>ended his reign</code> 对应第二句 <code>stand down</code>。国王下台会结束其统治，这两个表达描述同一结果，不需要另找一个退位事件。</p>\n<p>再核对 <code>in embarrassment</code>。第二句直接有 <code>embarrassing scandals</code>；第一句写他曾坚称国王不会退位，第二句却写 <code>forced him to eat his words</code>。丑闻和被迫收回断言共同说明退位时的难堪。</p>\n<p>如果只读 <code>stand down</code>，只能确认结束统治，尚不能评价处境。连起先前断言与后面的丑闻、食言，D后半部分才有足够证据。这里无需推测他心里是否羞愧，选项概括的是公开处境。</p>\n<p>D保留同一个人、同一次退位及其不体面的背景。它没有增加支持率、他人好恶或和解结果，而是把相邻两句的信息压缩成一个完整事实。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,596,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q21-D-1"},{"section":"第三鸟 · 题目复盘","title":"D. ended his reign in embarrassment","level":4,"raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> King Juan Carlos of Spain once insisted \"kings don't abdicate, they die in their sleep.\"\n>\n> But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.\n>\n> So, does the Spanish crisis suggest that monarchy is seeing its last days?\n>\n> 先说国王坚称不会退位，接着写压力迫使他食言、下台，再问这是否预示君主制危机。\n\n先前断言与后来的退位形成反差。作者用这种失去体面的结局引出制度问题，事件和后面的追问因而连在一起。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Forced to abandon his claim that kings never abdicate, Juan Carlos ended his reign amid embarrassing scandals.\n>\n> 胡安·卡洛斯被迫放弃国王绝不退位的说法，在令人难堪的丑闻中结束了统治。\n\nD需要的写法可由原文两句直接合成：首句给说过什么，次句给为何收回、发生什么。假设句未补进第三件事。后面的欧洲问题也能接在这次不体面退位之后，作为教训的引子。","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>在难堪中结束了统治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D。选项当时为 <code>ended his reign in [xxx]</code>，末词不认识，但 <code>ended his reign</code> 能对上 <code>stand down</code>；与A二选一后，做题模式结合全文警示方向确定D。复盘恢复完整的 <code>embarrassment</code>。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p><code>ended his reign</code> 把国王 <code>stand down</code> 换成结束统治；<code>in embarrassment</code> 汇总丑闻及被迫食言的处境。首句断言与次句现实相撞，使难堪有具体依据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在难堪中结束了统治。</p>\n</blockquote>\n<p>人名在第一句出现；D的 <code>ended his reign</code> 对应第二句 <code>stand down</code>。国王下台会结束其统治，这两个表达描述同一结果，不需要另找一个退位事件。</p>\n<p>再核对 <code>in embarrassment</code>。第二句直接有 <code>embarrassing scandals</code>；第一句写他曾坚称国王不会退位，第二句却写 <code>forced him to eat his words</code>。丑闻和被迫收回断言共同说明退位时的难堪。</p>\n<p>如果只读 <code>stand down</code>，只能确认结束统治，尚不能评价处境。连起先前断言与后面的丑闻、食言，D后半部分才有足够证据。这里无需推测他心里是否羞愧，选项概括的是公开处境。</p>\n<p>D保留同一个人、同一次退位及其不体面的背景。它没有增加支持率、他人好恶或和解结果，而是把相邻两句的信息压缩成一个完整事实。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-D-2\"><h3>写作视角法</h3>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>先说国王坚称不会退位，接着写压力迫使他食言、下台，再问这是否预示君主制危机。</p>\n</blockquote>\n<p>先前断言与后来的退位形成反差。作者用这种失去体面的结局引出制度问题，事件和后面的追问因而连在一起。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Forced to abandon his claim that kings never abdicate, Juan Carlos ended his reign amid embarrassing scandals.</p>\n<p>胡安·卡洛斯被迫放弃国王绝不退位的说法，在令人难堪的丑闻中结束了统治。</p>\n</blockquote>\n<p>D需要的写法可由原文两句直接合成：首句给说过什么，次句给为何收回、发生什么。假设句未补进第三件事。后面的欧洲问题也能接在这次不体面退位之后，作为教训的引子。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,596,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q21-D-2"},{"section":"第三鸟 · 题目复盘","title":"D. ended his reign in embarrassment","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入21题题干：\n\n> 根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。\n\nD实际说的是：\n\n> ended his reign in embarrassment  \n> 在难堪中结束了统治\n\nD回答了主旨需要的具体案例：卡洛斯在难堪处境中退位，这值得其他欧洲君主警惕。它没有把标题扩写成未出现的生平或人际故事。\n\n难堪仍由 `embarrassing scandals` 和被迫食言确认，结束统治仍由 `stand down` 确认。局部事实先成立，全文警示方向再与它相互印证。\n\n**复盘判断：D正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>在难堪中结束了统治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D。选项当时为 <code>ended his reign in [xxx]</code>，末词不认识，但 <code>ended his reign</code> 能对上 <code>stand down</code>；与A二选一后，做题模式结合全文警示方向确定D。复盘恢复完整的 <code>embarrassment</code>。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p><code>ended his reign</code> 把国王 <code>stand down</code> 换成结束统治；<code>in embarrassment</code> 汇总丑闻及被迫食言的处境。首句断言与次句现实相撞，使难堪有具体依据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在难堪中结束了统治。</p>\n</blockquote>\n<p>人名在第一句出现；D的 <code>ended his reign</code> 对应第二句 <code>stand down</code>。国王下台会结束其统治，这两个表达描述同一结果，不需要另找一个退位事件。</p>\n<p>再核对 <code>in embarrassment</code>。第二句直接有 <code>embarrassing scandals</code>；第一句写他曾坚称国王不会退位，第二句却写 <code>forced him to eat his words</code>。丑闻和被迫收回断言共同说明退位时的难堪。</p>\n<p>如果只读 <code>stand down</code>，只能确认结束统治，尚不能评价处境。连起先前断言与后面的丑闻、食言，D后半部分才有足够证据。这里无需推测他心里是否羞愧，选项概括的是公开处境。</p>\n<p>D保留同一个人、同一次退位及其不体面的背景。它没有增加支持率、他人好恶或和解结果，而是把相邻两句的信息压缩成一个完整事实。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-D-2\"><h3>写作视角法</h3>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>先说国王坚称不会退位，接着写压力迫使他食言、下台，再问这是否预示君主制危机。</p>\n</blockquote>\n<p>先前断言与后来的退位形成反差。作者用这种失去体面的结局引出制度问题，事件和后面的追问因而连在一起。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Forced to abandon his claim that kings never abdicate, Juan Carlos ended his reign amid embarrassing scandals.</p>\n<p>胡安·卡洛斯被迫放弃国王绝不退位的说法，在令人难堪的丑闻中结束了统治。</p>\n</blockquote>\n<p>D需要的写法可由原文两句直接合成：首句给说过什么，次句给为何收回、发生什么。假设句未补进第三件事。后面的欧洲问题也能接在这次不体面退位之后，作为教训的引子。</p>\n</section><section class=\"revealPart\" id=\"focus-q21-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>ended his reign in embarrassment<br>在难堪中结束了统治</p>\n</blockquote>\n<p>D回答了主旨需要的具体案例：卡洛斯在难堪处境中退位，这值得其他欧洲君主警惕。它没有把标题扩写成未出现的生平或人际故事。</p>\n<p>难堪仍由 <code>embarrassing scandals</code> 和被迫食言确认，结束统治仍由 <code>stand down</code> 确认。局部事实先成立，全文警示方向再与它相互印证。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,596,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q21-D-3"},{"section":"第三鸟 · 题目复盘","title":"21题结论","level":2,"raw":"### 21题结论\n\n> **21. D. ended his reign in embarrassment**\n\nA补入个人过去的高支持，B补入其他王室的好恶，C补入关系缓和；D把丑闻、被迫食言与退位准确合在一起。","html":"<blockquote>\n<p><strong>21. D. ended his reign in embarrassment</strong></p>\n</blockquote>\n<p>A补入个人过去的高支持，B补入其他王室的好恶，C补入关系缓和；D把丑闻、被迫食言与退位准确合在一起。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,245,1650,450],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"21","questionConclusion":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"22题 · 题干、题型与核心出处","level":2,"raw":"## 22题\n\n> Monarchs are kept as heads of state in Europe mostly ______.  \n> 欧洲大多保留君主作为国家元首，主要是因为什么？\n\n### 题型\n\n具体细节题。这是原因细节题。`kept as heads of state` 对应第三段的 `continuing popularity as heads of state` 和 `have survived`，`mostly` 要抓主要理由。首句回指第二段的超越政治、国家团结，末句用 `because` 直接给出存续原因；中间王国数量只是现状，不能代替原因。\n\n### 核心出处\n\n> It is this apparent transcendence of politics that explains monarchs' continuing popularity as heads of state.\n>\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.\n\n首句解释受欢迎，末句用原因从句解释存续；两句共同锁定国家元首的人选作用。","html":"<blockquote>\n<p>Monarchs are kept as heads of state in Europe mostly ______.<br>欧洲大多保留君主作为国家元首，主要是因为什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。这是原因细节题。<code>kept as heads of state</code> 对应第三段的 <code>continuing popularity as heads of state</code> 和 <code>have survived</code>，<code>mostly</code> 要抓主要理由。首句回指第二段的超越政治、国家团结，末句用 <code>because</code> 直接给出存续原因；中间王国数量只是现状，不能代替原因。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n<p>首句解释受欢迎，末句用原因从句解释存续；两句共同锁定国家元首的人选作用。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,775,1500,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","questionIntro":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"A. owing to their undoubted and respectable status","level":3,"raw":"### A. owing to their undoubted and respectable status\n\n> 由于他们无可置疑且受人尊敬的地位\n\n**做题模式中的状态：** 第一轮保留并确定A。当时选项为 `owing to their undoubted and [xxx] status`，第二个形容词被遮挡；做题模式仍从 `respected public figure` 和避免艰难寻找人选，看出它与现成、受认可的元首地位对应。\n\n**选项类型：正确同义概括。**\n\nA把现有君主使选民免于另找少争议且受尊敬人物，概括成保留他们的地位原因。`respectable` 对应 `respected`；`undoubted` 在这里概括人选较少引发争议、地位较受认可，不能扩大成所有君主永远无可质疑。\n\n**出处：**\n\n> It is this apparent transcendence of politics that explains monarchs' continuing popularity as heads of state.\n>\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定A。当时选项为 <code>owing to their undoubted and [xxx] status</code>，第二个形容词被遮挡；做题模式仍从 <code>respected public figure</code> 和避免艰难寻找人选，看出它与现成、受认可的元首地位对应。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>A把现有君主使选民免于另找少争议且受尊敬人物，概括成保留他们的地位原因。<code>respectable</code> 对应 <code>respected</code>；<code>undoubted</code> 在这里概括人选较少引发争议、地位较受认可，不能扩大成所有君主永远无可质疑。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,860,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q22-A-0"},{"section":"第三鸟 · 题目复盘","title":"A. owing to their undoubted and respectable status","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 欧洲大多保留君主作为国家元首，主要是由于他们无可置疑且受人尊敬的地位。\n\n题干的 `heads of state` 在第三段首句原词出现。再沿着为什么留下来，找到末句 `have survived because`；`owing to` 和 `because` 都是在给原因。\n\n末句说，保留王室使选民免于艰难寻找 `a non-controversial but respected public figure`。能省掉这次寻找，是因为现任君主已能承担这种少争议、受尊敬的公共人物角色。\n\n`respectable status` 概括 `respected public figure` 的公共地位。`undoubted` 应结合 `non-controversial` 理解为人选的可接受性，不能读成道德上绝无问题；文章后面还会批评王室。\n\n两边的原因都落在君主作为元首的人选条件上。原文从选民免去选人困难解释，A从现有君主地位概括，没有换成传统价值、更多偶像或永恒政治权威。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定A。当时选项为 <code>owing to their undoubted and [xxx] status</code>，第二个形容词被遮挡；做题模式仍从 <code>respected public figure</code> 和避免艰难寻找人选，看出它与现成、受认可的元首地位对应。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>A把现有君主使选民免于另找少争议且受尊敬人物，概括成保留他们的地位原因。<code>respectable</code> 对应 <code>respected</code>；<code>undoubted</code> 在这里概括人选较少引发争议、地位较受认可，不能扩大成所有君主永远无可质疑。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们无可置疑且受人尊敬的地位。</p>\n</blockquote>\n<p>题干的 <code>heads of state</code> 在第三段首句原词出现。再沿着为什么留下来，找到末句 <code>have survived because</code>；<code>owing to</code> 和 <code>because</code> 都是在给原因。</p>\n<p>末句说，保留王室使选民免于艰难寻找 <code>a non-controversial but respected public figure</code>。能省掉这次寻找，是因为现任君主已能承担这种少争议、受尊敬的公共人物角色。</p>\n<p><code>respectable status</code> 概括 <code>respected public figure</code> 的公共地位。<code>undoubted</code> 应结合 <code>non-controversial</code> 理解为人选的可接受性，不能读成道德上绝无问题；文章后面还会批评王室。</p>\n<p>两边的原因都落在君主作为元首的人选条件上。原文从选民免去选人困难解释，A从现有君主地位概括，没有换成传统价值、更多偶像或永恒政治权威。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,860,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q22-A-1"},{"section":"第三鸟 · 题目复盘","title":"A. owing to their undoubted and respectable status","level":4,"raw":"#### 写作视角法\n\n原文第3、7段是这样写的：\n\n> It is this apparent transcendence of politics that explains monarchs' continuing popularity as heads of state.\n>\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> 作者以看似超越政治解释受欢迎，又写免去寻找合适人选的困难，结尾再次强调少争议、非政治的元首服务。\n\n第三段承接国家团结的正面作用，结尾又把这项作用作为查尔斯必须理解的存续条件。前后反复强调同一种公共角色，能够解释王室为何被保留。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Most European monarchs remain heads of state because they offer voters an established, broadly accepted and respected public figure.\n>\n> 多数欧洲君主仍担任元首，因为他们为选民提供了一个地位已确立、较受认可和尊敬的公众人物。\n\nA需要的原因在实际推进中找得到：超越党争的形象、人选便利、非政治服务。这里的受认可始终有公共角色这一范围，不意味着每位王室成员的所有行为都获认可。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定A。当时选项为 <code>owing to their undoubted and [xxx] status</code>，第二个形容词被遮挡；做题模式仍从 <code>respected public figure</code> 和避免艰难寻找人选，看出它与现成、受认可的元首地位对应。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>A把现有君主使选民免于另找少争议且受尊敬人物，概括成保留他们的地位原因。<code>respectable</code> 对应 <code>respected</code>；<code>undoubted</code> 在这里概括人选较少引发争议、地位较受认可，不能扩大成所有君主永远无可质疑。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们无可置疑且受人尊敬的地位。</p>\n</blockquote>\n<p>题干的 <code>heads of state</code> 在第三段首句原词出现。再沿着为什么留下来，找到末句 <code>have survived because</code>；<code>owing to</code> 和 <code>because</code> 都是在给原因。</p>\n<p>末句说，保留王室使选民免于艰难寻找 <code>a non-controversial but respected public figure</code>。能省掉这次寻找，是因为现任君主已能承担这种少争议、受尊敬的公共人物角色。</p>\n<p><code>respectable status</code> 概括 <code>respected public figure</code> 的公共地位。<code>undoubted</code> 应结合 <code>non-controversial</code> 理解为人选的可接受性，不能读成道德上绝无问题；文章后面还会批评王室。</p>\n<p>两边的原因都落在君主作为元首的人选条件上。原文从选民免去选人困难解释，A从现有君主地位概括，没有换成传统价值、更多偶像或永恒政治权威。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-A-2\"><h3>写作视角法</h3>\n<p>原文第3、7段是这样写的：</p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>作者以看似超越政治解释受欢迎，又写免去寻找合适人选的困难，结尾再次强调少争议、非政治的元首服务。</p>\n</blockquote>\n<p>第三段承接国家团结的正面作用，结尾又把这项作用作为查尔斯必须理解的存续条件。前后反复强调同一种公共角色，能够解释王室为何被保留。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Most European monarchs remain heads of state because they offer voters an established, broadly accepted and respected public figure.</p>\n<p>多数欧洲君主仍担任元首，因为他们为选民提供了一个地位已确立、较受认可和尊敬的公众人物。</p>\n</blockquote>\n<p>A需要的原因在实际推进中找得到：超越党争的形象、人选便利、非政治服务。这里的受认可始终有公共角色这一范围，不意味着每位王室成员的所有行为都获认可。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,860,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q22-A-2"},{"section":"第三鸟 · 题目复盘","title":"A. owing to their undoubted and respectable status","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入22题题干：\n\n> 欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。\n\nA实际说的是：\n\n> owing to their undoubted and respectable status  \n> 由于他们无可置疑且受人尊敬的地位\n\nA说的地位与主旨要求寻找的存续条件处于同一层次。全文一边承认公共用途，一边提醒王室：若行为损害认可，西班牙教训也会落到自己身上。\n\n具体对应仍由第三段完成：少争议、受尊敬的人选能够减少选民的寻找困难。主旨能验证方向，不能把 `undoubted` 变成对君主一切行为的绝对肯定。\n\n**复盘判断：A正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定A。当时选项为 <code>owing to their undoubted and [xxx] status</code>，第二个形容词被遮挡；做题模式仍从 <code>respected public figure</code> 和避免艰难寻找人选，看出它与现成、受认可的元首地位对应。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>A把现有君主使选民免于另找少争议且受尊敬人物，概括成保留他们的地位原因。<code>respectable</code> 对应 <code>respected</code>；<code>undoubted</code> 在这里概括人选较少引发争议、地位较受认可，不能扩大成所有君主永远无可质疑。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们无可置疑且受人尊敬的地位。</p>\n</blockquote>\n<p>题干的 <code>heads of state</code> 在第三段首句原词出现。再沿着为什么留下来，找到末句 <code>have survived because</code>；<code>owing to</code> 和 <code>because</code> 都是在给原因。</p>\n<p>末句说，保留王室使选民免于艰难寻找 <code>a non-controversial but respected public figure</code>。能省掉这次寻找，是因为现任君主已能承担这种少争议、受尊敬的公共人物角色。</p>\n<p><code>respectable status</code> 概括 <code>respected public figure</code> 的公共地位。<code>undoubted</code> 应结合 <code>non-controversial</code> 理解为人选的可接受性，不能读成道德上绝无问题；文章后面还会批评王室。</p>\n<p>两边的原因都落在君主作为元首的人选条件上。原文从选民免去选人困难解释，A从现有君主地位概括，没有换成传统价值、更多偶像或永恒政治权威。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-A-2\"><h3>写作视角法</h3>\n<p>原文第3、7段是这样写的：</p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>作者以看似超越政治解释受欢迎，又写免去寻找合适人选的困难，结尾再次强调少争议、非政治的元首服务。</p>\n</blockquote>\n<p>第三段承接国家团结的正面作用，结尾又把这项作用作为查尔斯必须理解的存续条件。前后反复强调同一种公共角色，能够解释王室为何被保留。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Most European monarchs remain heads of state because they offer voters an established, broadly accepted and respected public figure.</p>\n<p>多数欧洲君主仍担任元首，因为他们为选民提供了一个地位已确立、较受认可和尊敬的公众人物。</p>\n</blockquote>\n<p>A需要的原因在实际推进中找得到：超越党争的形象、人选便利、非政治服务。这里的受认可始终有公共角色这一范围，不意味着每位王室成员的所有行为都获认可。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>owing to their undoubted and respectable status<br>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p>A说的地位与主旨要求寻找的存续条件处于同一层次。全文一边承认公共用途，一边提醒王室：若行为损害认可，西班牙教训也会落到自己身上。</p>\n<p>具体对应仍由第三段完成：少争议、受尊敬的人选能够减少选民的寻找困难。主旨能验证方向，不能把 <code>undoubted</code> 变成对君主一切行为的绝对肯定。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,860,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q22-A-3"},{"section":"第三鸟 · 题目复盘","title":"B. to achieve a balance between tradition and reality","level":3,"raw":"### B. to achieve a balance between tradition and reality\n\n> 为了在传统与现实之间取得平衡\n\n**做题模式中的状态：** 第一轮直接排除B。做题模式能读出 `because` 后是避免艰难寻找公众人物，没有把这条具体理由换成平衡传统与现实。\n\n**错误类型：第三类——无中生有。**\n\n古老王室保留于现代欧洲，容易让人想到传统和现实之间的折中。B把读者可作的社会概括写成主要目的，原文没有建立这两个端点及平衡关系。\n\n**命题人借用的原文材料：**\n\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式能读出 <code>because</code> 后是避免艰难寻找公众人物，没有把这条具体理由换成平衡传统与现实。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>古老王室保留于现代欧洲，容易让人想到传统和现实之间的折中。B把读者可作的社会概括写成主要目的，原文没有建立这两个端点及平衡关系。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,948,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q22-B-0"},{"section":"第三鸟 · 题目复盘","title":"B. to achieve a balance between tradition and reality","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 欧洲大多保留君主作为国家元首，主要是为了在传统与现实之间取得平衡。\n\n问保留理由，定位点是第三段 `most royal families have survived because`。B的 `tradition`、`reality` 和 `balance` 没有对应的原因表达，不能凭王室古老、欧洲现代完成匹配。\n\n出处交代选民的人选难题：找到少争议而受尊敬的人不容易，现有君主免去了这项困难。它把具体角色与存续联系起来。\n\nB换成目的：保留王室是为了平衡两种抽象价值。原文没有先把传统与现实设成冲突两端，也没说君主调和二者；第四段反而会写继承特权与现代民主的矛盾。\n\n制度跨越古今是背景，为平衡古今而保留它则是新目的。B多出后者，不能拿听起来合理的概括替代明确的 `because`。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式能读出 <code>because</code> 后是避免艰难寻找公众人物，没有把这条具体理由换成平衡传统与现实。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>古老王室保留于现代欧洲，容易让人想到传统和现实之间的折中。B把读者可作的社会概括写成主要目的，原文没有建立这两个端点及平衡关系。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了在传统与现实之间取得平衡。</p>\n</blockquote>\n<p>问保留理由，定位点是第三段 <code>most royal families have survived because</code>。B的 <code>tradition</code>、<code>reality</code> 和 <code>balance</code> 没有对应的原因表达，不能凭王室古老、欧洲现代完成匹配。</p>\n<p>出处交代选民的人选难题：找到少争议而受尊敬的人不容易，现有君主免去了这项困难。它把具体角色与存续联系起来。</p>\n<p>B换成目的：保留王室是为了平衡两种抽象价值。原文没有先把传统与现实设成冲突两端，也没说君主调和二者；第四段反而会写继承特权与现代民主的矛盾。</p>\n<p>制度跨越古今是背景，为平衡古今而保留它则是新目的。B多出后者，不能拿听起来合理的概括替代明确的 <code>because</code>。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,948,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q22-B-1"},{"section":"第三鸟 · 题目复盘","title":"B. to achieve a balance between tradition and reality","level":4,"raw":"#### 写作视角法\n\n原文第3、4段是这样写的：\n\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n>\n> 第三段解释选择合适元首的困难；第四段质疑富有贵族仍处在现代民主国家的象征核心。\n\n文章先承认现实功能，再摆出尚未消除的制度矛盾。转折保留传统特权与民主价值的张力，没有宣布保留君主已经达到平衡。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Europeans retain monarchs as heads of state to balance inherited traditions with the realities of modern democracy.\n>\n> 欧洲人保留君主担任元首，是为了平衡承袭的传统与现代民主的现实。\n\nB成立需要明确的“为平衡而保留”目的。实际原因始终落在人选便利上，随后又写王室与民主的冲突。所缺的一整条关系，无法靠给 `avoid the difficult search` 换几个词补出。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式能读出 <code>because</code> 后是避免艰难寻找公众人物，没有把这条具体理由换成平衡传统与现实。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>古老王室保留于现代欧洲，容易让人想到传统和现实之间的折中。B把读者可作的社会概括写成主要目的，原文没有建立这两个端点及平衡关系。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了在传统与现实之间取得平衡。</p>\n</blockquote>\n<p>问保留理由，定位点是第三段 <code>most royal families have survived because</code>。B的 <code>tradition</code>、<code>reality</code> 和 <code>balance</code> 没有对应的原因表达，不能凭王室古老、欧洲现代完成匹配。</p>\n<p>出处交代选民的人选难题：找到少争议而受尊敬的人不容易，现有君主免去了这项困难。它把具体角色与存续联系起来。</p>\n<p>B换成目的：保留王室是为了平衡两种抽象价值。原文没有先把传统与现实设成冲突两端，也没说君主调和二者；第四段反而会写继承特权与现代民主的矛盾。</p>\n<p>制度跨越古今是背景，为平衡古今而保留它则是新目的。B多出后者，不能拿听起来合理的概括替代明确的 <code>because</code>。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-B-2\"><h3>写作视角法</h3>\n<p>原文第3、4段是这样写的：</p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>第三段解释选择合适元首的困难；第四段质疑富有贵族仍处在现代民主国家的象征核心。</p>\n</blockquote>\n<p>文章先承认现实功能，再摆出尚未消除的制度矛盾。转折保留传统特权与民主价值的张力，没有宣布保留君主已经达到平衡。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Europeans retain monarchs as heads of state to balance inherited traditions with the realities of modern democracy.</p>\n<p>欧洲人保留君主担任元首，是为了平衡承袭的传统与现代民主的现实。</p>\n</blockquote>\n<p>B成立需要明确的“为平衡而保留”目的。实际原因始终落在人选便利上，随后又写王室与民主的冲突。所缺的一整条关系，无法靠给 <code>avoid the difficult search</code> 换几个词补出。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,948,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q22-B-2"},{"section":"第三鸟 · 题目复盘","title":"B. to achieve a balance between tradition and reality","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入22题题干：\n\n> 欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。\n\n但B实际说的是：\n\n> to achieve a balance between tradition and reality  \n> 为了在传统与现实之间取得平衡\n\n主旨允许讨论古老王室如何面对现代社会，却不能证明平衡传统与现实就是保留原因。否则凡是符合文章背景的目的，都可被塞进题干。\n\n这堂课先立足王室能提供什么服务，再谈服务与行为是否相称。B没有回答第三段明确给出的用途，而加入了未建立的平衡目标。\n\n**复盘判断：B错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式能读出 <code>because</code> 后是避免艰难寻找公众人物，没有把这条具体理由换成平衡传统与现实。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>古老王室保留于现代欧洲，容易让人想到传统和现实之间的折中。B把读者可作的社会概括写成主要目的，原文没有建立这两个端点及平衡关系。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了在传统与现实之间取得平衡。</p>\n</blockquote>\n<p>问保留理由，定位点是第三段 <code>most royal families have survived because</code>。B的 <code>tradition</code>、<code>reality</code> 和 <code>balance</code> 没有对应的原因表达，不能凭王室古老、欧洲现代完成匹配。</p>\n<p>出处交代选民的人选难题：找到少争议而受尊敬的人不容易，现有君主免去了这项困难。它把具体角色与存续联系起来。</p>\n<p>B换成目的：保留王室是为了平衡两种抽象价值。原文没有先把传统与现实设成冲突两端，也没说君主调和二者；第四段反而会写继承特权与现代民主的矛盾。</p>\n<p>制度跨越古今是背景，为平衡古今而保留它则是新目的。B多出后者，不能拿听起来合理的概括替代明确的 <code>because</code>。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-B-2\"><h3>写作视角法</h3>\n<p>原文第3、4段是这样写的：</p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>第三段解释选择合适元首的困难；第四段质疑富有贵族仍处在现代民主国家的象征核心。</p>\n</blockquote>\n<p>文章先承认现实功能，再摆出尚未消除的制度矛盾。转折保留传统特权与民主价值的张力，没有宣布保留君主已经达到平衡。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Europeans retain monarchs as heads of state to balance inherited traditions with the realities of modern democracy.</p>\n<p>欧洲人保留君主担任元首，是为了平衡承袭的传统与现代民主的现实。</p>\n</blockquote>\n<p>B成立需要明确的“为平衡而保留”目的。实际原因始终落在人选便利上，随后又写王室与民主的冲突。所缺的一整条关系，无法靠给 <code>avoid the difficult search</code> 换几个词补出。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>to achieve a balance between tradition and reality<br>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p>主旨允许讨论古老王室如何面对现代社会，却不能证明平衡传统与现实就是保留原因。否则凡是符合文章背景的目的，都可被塞进题干。</p>\n<p>这堂课先立足王室能提供什么服务，再谈服务与行为是否相称。B没有回答第三段明确给出的用途，而加入了未建立的平衡目标。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,948,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q22-B-3"},{"section":"第三鸟 · 题目复盘","title":"C. to give voters more public figures to look up to","level":3,"raw":"### C. to give voters more public figures to look up to\n\n> 为了给选民更多可敬仰的公众人物\n\n**做题模式中的状态：** 第一轮直接排除C。做题模式已识别原文是让选民避免寻找的困难，选项却变成给选民更多可敬仰的公众人物。\n\n**错误类型：第一类——歪曲原意。**\n\nC保留 `voters`、`public figures` 及尊敬的语义，改变动作与数量：免去再找一个合适元首的困难，被改成增加一批供人仰望的人物。\n\n**命题人借用的原文材料：**\n\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已识别原文是让选民避免寻找的困难，选项却变成给选民更多可敬仰的公众人物。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C保留 <code>voters</code>、<code>public figures</code> 及尊敬的语义，改变动作与数量：免去再找一个合适元首的困难，被改成增加一批供人仰望的人物。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1036,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q22-C-0"},{"section":"第三鸟 · 题目复盘","title":"C. to give voters more public figures to look up to","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 欧洲大多保留君主作为国家元首，主要是为了给选民更多可敬仰的公众人物。\n\n`voters` 与 `public figures` 把C带回第三段末句。原文是单数 `a ... public figure`，前面的动作是 `avoid the difficult search`，两处必须一起看。\n\n君主让选民不必再艰难物色合适人选，说明既有职位已经能履行作用。句子关注选人这件事的困难是否可以省掉。\n\nC的 `give ... more` 要求保留王室能增加公众人物数量。原文没有比较前后有多少可敬仰的人。`look up to` 与 `respected` 在尊敬上相近，但局部接近救不了动作和数量的变化。\n\n由省去寻找一个合适人物，不能推出增加更多可仰望人物。C借用了正确名词和评价色彩，却把制度便利改成扩大人物供给。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已识别原文是让选民避免寻找的困难，选项却变成给选民更多可敬仰的公众人物。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C保留 <code>voters</code>、<code>public figures</code> 及尊敬的语义，改变动作与数量：免去再找一个合适元首的困难，被改成增加一批供人仰望的人物。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了给选民更多可敬仰的公众人物。</p>\n</blockquote>\n<p><code>voters</code> 与 <code>public figures</code> 把C带回第三段末句。原文是单数 <code>a ... public figure</code>，前面的动作是 <code>avoid the difficult search</code>，两处必须一起看。</p>\n<p>君主让选民不必再艰难物色合适人选，说明既有职位已经能履行作用。句子关注选人这件事的困难是否可以省掉。</p>\n<p>C的 <code>give ... more</code> 要求保留王室能增加公众人物数量。原文没有比较前后有多少可敬仰的人。<code>look up to</code> 与 <code>respected</code> 在尊敬上相近，但局部接近救不了动作和数量的变化。</p>\n<p>由省去寻找一个合适人物，不能推出增加更多可仰望人物。C借用了正确名词和评价色彩，却把制度便利改成扩大人物供给。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1036,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q22-C-1"},{"section":"第三鸟 · 题目复盘","title":"C. to give voters more public figures to look up to","level":4,"raw":"#### 写作视角法\n\n原文第3、7段是这样写的：\n\n> But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> 王室省去寻找少争议且受尊敬人选的困难，末段把存续条件概括为提供国家元首服务。\n\n作者继续检查王室能否胜任服务，并用查尔斯说明风险。判断标准是角色是否合适，不需要讨论公众能敬仰的人数。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Royal families are retained so that voters have more public figures to admire.\n>\n> 保留王室，是为了让选民拥有更多可以敬仰的公众人物。\n\n假设把数量增加写成保留目的，这才是C必需的写法。实际末句的 `a` 和 `avoid` 把叙述放在免去一次困难选择上，后面的服务要求没有发展出公众人物越多越好的理由。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>为了给选民更多可敬仰的公众人物</p>\n<
