/blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已识别原文是让选民避免寻找的困难，选项却变成给选民更多可敬仰的公众人物。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C保留 <code>voters</code>、<code>public figures</code> 及尊敬的语义，改变动作与数量：免去再找一个合适元首的困难，被改成增加一批供人仰望的人物。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了给选民更多可敬仰的公众人物。</p>\n</blockquote>\n<p><code>voters</code> 与 <code>public figures</code> 把C带回第三段末句。原文是单数 <code>a ... public figure</code>，前面的动作是 <code>avoid the difficult search</code>，两处必须一起看。</p>\n<p>君主让选民不必再艰难物色合适人选，说明既有职位已经能履行作用。句子关注选人这件事的困难是否可以省掉。</p>\n<p>C的 <code>give ... more</code> 要求保留王室能增加公众人物数量。原文没有比较前后有多少可敬仰的人。<code>look up to</code> 与 <code>respected</code> 在尊敬上相近，但局部接近救不了动作和数量的变化。</p>\n<p>由省去寻找一个合适人物，不能推出增加更多可仰望人物。C借用了正确名词和评价色彩，却把制度便利改成扩大人物供给。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-C-2\"><h3>写作视角法</h3>\n<p>原文第3、7段是这样写的：</p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>王室省去寻找少争议且受尊敬人选的困难，末段把存续条件概括为提供国家元首服务。</p>\n</blockquote>\n<p>作者继续检查王室能否胜任服务，并用查尔斯说明风险。判断标准是角色是否合适，不需要讨论公众能敬仰的人数。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Royal families are retained so that voters have more public figures to admire.</p>\n<p>保留王室，是为了让选民拥有更多可以敬仰的公众人物。</p>\n</blockquote>\n<p>假设把数量增加写成保留目的，这才是C必需的写法。实际末句的 <code>a</code> 和 <code>avoid</code> 把叙述放在免去一次困难选择上，后面的服务要求没有发展出公众人物越多越好的理由。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1036,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q22-C-2"},{"section":"第三鸟 · 题目复盘","title":"C. to give voters more public figures to look up to","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入22题题干：\n\n> 欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。\n\n但C实际说的是：\n\n> to give voters more public figures to look up to  \n> 为了给选民更多可敬仰的公众人物\n\n主旨引出的存续条件要回到王室能否承担受认可的角色。C说增加可敬仰人物数量，全篇没有用数量多少衡量王室是否值得留下。\n\n受尊敬确与文章相关，但要把整项放回制度功能中验证。C的 `more` 和增加人物的动作，与第三段省去寻找困难的关系对不上。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已识别原文是让选民避免寻找的困难，选项却变成给选民更多可敬仰的公众人物。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C保留 <code>voters</code>、<code>public figures</code> 及尊敬的语义，改变动作与数量：免去再找一个合适元首的困难，被改成增加一批供人仰望的人物。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了给选民更多可敬仰的公众人物。</p>\n</blockquote>\n<p><code>voters</code> 与 <code>public figures</code> 把C带回第三段末句。原文是单数 <code>a ... public figure</code>，前面的动作是 <code>avoid the difficult search</code>，两处必须一起看。</p>\n<p>君主让选民不必再艰难物色合适人选，说明既有职位已经能履行作用。句子关注选人这件事的困难是否可以省掉。</p>\n<p>C的 <code>give ... more</code> 要求保留王室能增加公众人物数量。原文没有比较前后有多少可敬仰的人。<code>look up to</code> 与 <code>respected</code> 在尊敬上相近，但局部接近救不了动作和数量的变化。</p>\n<p>由省去寻找一个合适人物，不能推出增加更多可仰望人物。C借用了正确名词和评价色彩，却把制度便利改成扩大人物供给。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-C-2\"><h3>写作视角法</h3>\n<p>原文第3、7段是这样写的：</p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>王室省去寻找少争议且受尊敬人选的困难，末段把存续条件概括为提供国家元首服务。</p>\n</blockquote>\n<p>作者继续检查王室能否胜任服务，并用查尔斯说明风险。判断标准是角色是否合适，不需要讨论公众能敬仰的人数。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Royal families are retained so that voters have more public figures to admire.</p>\n<p>保留王室，是为了让选民拥有更多可以敬仰的公众人物。</p>\n</blockquote>\n<p>假设把数量增加写成保留目的，这才是C必需的写法。实际末句的 <code>a</code> 和 <code>avoid</code> 把叙述放在免去一次困难选择上，后面的服务要求没有发展出公众人物越多越好的理由。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>to give voters more public figures to look up to<br>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p>主旨引出的存续条件要回到王室能否承担受认可的角色。C说增加可敬仰人物数量，全篇没有用数量多少衡量王室是否值得留下。</p>\n<p>受尊敬确与文章相关，但要把整项放回制度功能中验证。C的 <code>more</code> 和增加人物的动作，与第三段省去寻找困难的关系对不上。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1036,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q22-C-3"},{"section":"第三鸟 · 题目复盘","title":"D. due to their everlasting political embodiment","level":3,"raw":"### D. due to their everlasting political embodiment\n\n> 由于他们永久体现政治\n\n**做题模式中的状态：** 第一轮直接排除D。做题模式用第二段超越政治和第三段因果句核对，发现体现政治方向不合；`everlasting` 也没有对应依据。\n\n**错误类型：第一类——歪曲原意。**\n\nD借用 `politics`、`embody`、`continuing`，交换它们的关系：超越政治、体现国家团结，被改成永久体现政治。\n\n**命题人借用的原文材料：**\n\n> When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.\n>\n> It is this apparent transcendence of politics that explains monarchs' continuing popularity as heads of state.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>由于他们永久体现政治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式用第二段超越政治和第三段因果句核对，发现体现政治方向不合；<code>everlasting</code> 也没有对应依据。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用 <code>politics</code>、<code>embody</code>、<code>continuing</code>，交换它们的关系：超越政治、体现国家团结，被改成永久体现政治。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1124,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q22-D-0"},{"section":"第三鸟 · 题目复盘","title":"D. due to their everlasting political embodiment","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 欧洲大多保留君主作为国家元首，主要是由于他们永久体现政治。\n\n`political embodiment` 要对照第二段 `rise above ... politics`、`embody ... national unity`，再看第三段 `transcendence of politics`。政治是被超越的对象，国家团结才是被体现的对象。\n\n第三段首句明确说，解释持续受欢迎的是这种看似超越政治的性质。结尾又写 `non-political heads of state`，首尾都要求元首少卷入党派政治。\n\nD把分开的动词与对象重新配对，得到体现政治。此外，`continuing popularity` 只说持续受欢迎，不保证永久不变；`everlasting` 加入无限时间。\n\n这项同时改坏体现对象和时间程度。原文承认君主因超越政治而有用，又提醒他们可能损害制度；D把有条件存续写成永久政治代表。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>由于他们永久体现政治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式用第二段超越政治和第三段因果句核对，发现体现政治方向不合；<code>everlasting</code> 也没有对应依据。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用 <code>politics</code>、<code>embody</code>、<code>continuing</code>，交换它们的关系：超越政治、体现国家团结，被改成永久体现政治。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们永久体现政治。</p>\n</blockquote>\n<p><code>political embodiment</code> 要对照第二段 <code>rise above ... politics</code>、<code>embody ... national unity</code>，再看第三段 <code>transcendence of politics</code>。政治是被超越的对象，国家团结才是被体现的对象。</p>\n<p>第三段首句明确说，解释持续受欢迎的是这种看似超越政治的性质。结尾又写 <code>non-political heads of state</code>，首尾都要求元首少卷入党派政治。</p>\n<p>D把分开的动词与对象重新配对，得到体现政治。此外，<code>continuing popularity</code> 只说持续受欢迎，不保证永久不变；<code>everlasting</code> 加入无限时间。</p>\n<p>这项同时改坏体现对象和时间程度。原文承认君主因超越政治而有用，又提醒他们可能损害制度；D把有条件存续写成永久政治代表。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1124,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q22-D-1"},{"section":"第三鸟 · 题目复盘","title":"D. due to their everlasting political embodiment","level":4,"raw":"#### 写作视角法\n\n原文第2、3、7段是这样写的：\n\n> When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.\n>\n> It is this apparent transcendence of politics that explains monarchs' continuing popularity as heads of state.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> 第二段说超越日常政治、体现国家团结，第三段用超越解释受欢迎，末段要求非政治元首服务。\n\n作者沿着远离党争才有公共用途的理由向后写，再以查尔斯不理解角色作警告。非政治限制保留到结尾，没有中途撤回。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Monarchs remain popular as heads of state because they permanently embody political power.\n>\n> 君主作为国家元首持续受欢迎，因为他们永久体现政治权力。\n\nD成立时，政治代表性必须成为受欢迎的原因。实际写法把超越政治放在同一原因位置，结尾又重复非政治服务；再把持续性扩成永久，作者提出警示的余地也被抹掉。","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>由于他们永久体现政治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式用第二段超越政治和第三段因果句核对，发现体现政治方向不合；<code>everlasting</code> 也没有对应依据。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用 <code>politics</code>、<code>embody</code>、<code>continuing</code>，交换它们的关系：超越政治、体现国家团结，被改成永久体现政治。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们永久体现政治。</p>\n</blockquote>\n<p><code>political embodiment</code> 要对照第二段 <code>rise above ... politics</code>、<code>embody ... national unity</code>，再看第三段 <code>transcendence of politics</code>。政治是被超越的对象，国家团结才是被体现的对象。</p>\n<p>第三段首句明确说，解释持续受欢迎的是这种看似超越政治的性质。结尾又写 <code>non-political heads of state</code>，首尾都要求元首少卷入党派政治。</p>\n<p>D把分开的动词与对象重新配对，得到体现政治。此外，<code>continuing popularity</code> 只说持续受欢迎，不保证永久不变；<code>everlasting</code> 加入无限时间。</p>\n<p>这项同时改坏体现对象和时间程度。原文承认君主因超越政治而有用，又提醒他们可能损害制度；D把有条件存续写成永久政治代表。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-D-2\"><h3>写作视角法</h3>\n<p>原文第2、3、7段是这样写的：</p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>第二段说超越日常政治、体现国家团结，第三段用超越解释受欢迎，末段要求非政治元首服务。</p>\n</blockquote>\n<p>作者沿着远离党争才有公共用途的理由向后写，再以查尔斯不理解角色作警告。非政治限制保留到结尾，没有中途撤回。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Monarchs remain popular as heads of state because they permanently embody political power.</p>\n<p>君主作为国家元首持续受欢迎，因为他们永久体现政治权力。</p>\n</blockquote>\n<p>D成立时，政治代表性必须成为受欢迎的原因。实际写法把超越政治放在同一原因位置，结尾又重复非政治服务；再把持续性扩成永久，作者提出警示的余地也被抹掉。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1124,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q22-D-2"},{"section":"第三鸟 · 题目复盘","title":"D. due to their everlasting political embodiment","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入22题题干：\n\n> 欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。\n\n但D实际说的是：\n\n> due to their everlasting political embodiment  \n> 由于他们永久体现政治\n\n全文给欧洲君主的教训之一是理解制度延续的服务条件。D的永久政治代表性接不上结尾少争议、非政治元首的要求。\n\n第二、第三和第七段都把政治中立放在同一方向。D虽用了常见的政治词汇，对体现对象和时间程度的改写却破坏了贯穿全篇的理由。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>由于他们永久体现政治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式用第二段超越政治和第三段因果句核对，发现体现政治方向不合；<code>everlasting</code> 也没有对应依据。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用 <code>politics</code>、<code>embody</code>、<code>continuing</code>，交换它们的关系：超越政治、体现国家团结，被改成永久体现政治。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们永久体现政治。</p>\n</blockquote>\n<p><code>political embodiment</code> 要对照第二段 <code>rise above ... politics</code>、<code>embody ... national unity</code>，再看第三段 <code>transcendence of politics</code>。政治是被超越的对象，国家团结才是被体现的对象。</p>\n<p>第三段首句明确说，解释持续受欢迎的是这种看似超越政治的性质。结尾又写 <code>non-political heads of state</code>，首尾都要求元首少卷入党派政治。</p>\n<p>D把分开的动词与对象重新配对，得到体现政治。此外，<code>continuing popularity</code> 只说持续受欢迎，不保证永久不变；<code>everlasting</code> 加入无限时间。</p>\n<p>这项同时改坏体现对象和时间程度。原文承认君主因超越政治而有用，又提醒他们可能损害制度；D把有条件存续写成永久政治代表。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-D-2\"><h3>写作视角法</h3>\n<p>原文第2、3、7段是这样写的：</p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>第二段说超越日常政治、体现国家团结，第三段用超越解释受欢迎，末段要求非政治元首服务。</p>\n</blockquote>\n<p>作者沿着远离党争才有公共用途的理由向后写，再以查尔斯不理解角色作警告。非政治限制保留到结尾，没有中途撤回。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Monarchs remain popular as heads of state because they permanently embody political power.</p>\n<p>君主作为国家元首持续受欢迎，因为他们永久体现政治权力。</p>\n</blockquote>\n<p>D成立时，政治代表性必须成为受欢迎的原因。实际写法把超越政治放在同一原因位置，结尾又重复非政治服务；再把持续性扩成永久，作者提出警示的余地也被抹掉。</p>\n</section><section class=\"revealPart\" id=\"focus-q22-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>due to their everlasting political embodiment<br>由于他们永久体现政治</p>\n</blockquote>\n<p>全文给欧洲君主的教训之一是理解制度延续的服务条件。D的永久政治代表性接不上结尾少争议、非政治元首的要求。</p>\n<p>第二、第三和第七段都把政治中立放在同一方向。D虽用了常见的政治词汇，对体现对象和时间程度的改写却破坏了贯穿全篇的理由。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1124,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q22-D-3"},{"section":"第三鸟 · 题目复盘","title":"22题结论","level":2,"raw":"### 22题结论\n\n> **22. A. owing to their undoubted and respectable status**\n\nA保留少争议且受尊敬的人选条件；B新增平衡目的，C改成增加人物数量，D改坏政治方向与时间程度。","html":"<blockquote>\n<p><strong>22. A. owing to their undoubted and respectable status</strong></p>\n</blockquote>\n<p>A保留少争议且受尊敬的人选条件；B新增平衡目的，C改成增加人物数量，D改坏政治方向与时间程度。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,775,1500,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"22","questionConclusion":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"23题 · 题干、题型与核心出处","level":2,"raw":"## 23题\n\n> Which of the following is shown to be odd, according to Paragraph 4?  \n> 根据第四段，下面哪一项被认为很奇怪？\n\n### 题型\n\n具体细节题。题干已给第四段，`odd` 是对原文 `bizarre` 的同义改写。真正要找的是作者把哪件事评为奇怪；段中的特权、不平等和继承财富，可能只是评价的背景。先读 `it is bizarre that` 后的完整命题，再用前句说明这种评价为什么成立。\n\n### 核心出处\n\n> Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n\n上一句给特权背景，末句的评价从句明确指出反常的角色。","html":"<blockquote>\n<p>Which of the following is shown to be odd, according to Paragraph 4?<br>根据第四段，下面哪一项被认为很奇怪？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干已给第四段，<code>odd</code> 是对原文 <code>bizarre</code> 的同义改写。真正要找的是作者把哪件事评为奇怪；段中的特权、不平等和继承财富，可能只是评价的背景。先读 <code>it is bizarre that</code> 后的完整命题，再用前句说明这种评价为什么成立。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<p>上一句给特权背景，末句的评价从句明确指出反常的角色。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,1305,1600,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","questionIntro":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"A. Aristocrats' excessive reliance on inherited wealth.","level":3,"raw":"### A. Aristocrats' excessive reliance on inherited wealth.\n\n> 贵族过度依赖继承财富\n\n**做题模式中的状态：** 第一轮直接排除A。做题模式虽未认出部分财富相关词，仍看出后半句评价的是富有贵族家庭在现代民主国家里的象征地位，没有把它读成贵族依赖财富的方式。\n\n**错误类型：第三类——无中生有。**\n\nA把 `inherited wealth` 与 `aristocratic families` 拼成“贵族过度依赖继承财富”。文章说的是继承财富的力量增强，这种时代背景没有提供贵族主动依赖财富的动作，更没有给出过度依赖的程度。\n\n**命题人借用的原文材料：**\n\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>贵族过度依赖继承财富</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式虽未认出部分财富相关词，仍看出后半句评价的是富有贵族家庭在现代民主国家里的象征地位，没有把它读成贵族依赖财富的方式。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把 <code>inherited wealth</code> 与 <code>aristocratic families</code> 拼成“贵族过度依赖继承财富”。文章说的是继承财富的力量增强，这种时代背景没有提供贵族主动依赖财富的动作，更没有给出过度依赖的程度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1388,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q23-A-0"},{"section":"第三鸟 · 题目复盘","title":"A. Aristocrats' excessive reliance on inherited wealth.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第四段，贵族过度依赖继承财富这件事被认为很奇怪。\n\n`odd` 对应第四段末句 `bizarre`；`inherited wealth` 又在同句前半段出现。两者位置接近，尤其容易让人把前面的财富背景直接塞进后面的评价。\n\n整句先用 `At a time when` 交代不平等加剧、继承财富力量增强的时代，随后才用 `it is bizarre that` 评价富有贵族家庭仍是现代民主国家的象征核心。两部分各有作用，不能混在一起。\n\nA新增 `reliance`，说贵族依靠这种财富；又加 `excessive`，把依靠判为过度。原文的 `increasing power` 修饰继承财富的社会力量，没有说明贵族怎样取得生活来源或对遗产依赖多深。\n\n因此，A没有准确改写背景，还造出了一个新的评价对象。原文的“财富力量上升时，贵族却仍居国家象征中心”，被替换为“贵族过度依赖财富很奇怪”。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>贵族过度依赖继承财富</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式虽未认出部分财富相关词，仍看出后半句评价的是富有贵族家庭在现代民主国家里的象征地位，没有把它读成贵族依赖财富的方式。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把 <code>inherited wealth</code> 与 <code>aristocratic families</code> 拼成“贵族过度依赖继承财富”。文章说的是继承财富的力量增强，这种时代背景没有提供贵族主动依赖财富的动作，更没有给出过度依赖的程度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族过度依赖继承财富这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>odd</code> 对应第四段末句 <code>bizarre</code>；<code>inherited wealth</code> 又在同句前半段出现。两者位置接近，尤其容易让人把前面的财富背景直接塞进后面的评价。</p>\n<p>整句先用 <code>At a time when</code> 交代不平等加剧、继承财富力量增强的时代，随后才用 <code>it is bizarre that</code> 评价富有贵族家庭仍是现代民主国家的象征核心。两部分各有作用，不能混在一起。</p>\n<p>A新增 <code>reliance</code>，说贵族依靠这种财富；又加 <code>excessive</code>，把依靠判为过度。原文的 <code>increasing power</code> 修饰继承财富的社会力量，没有说明贵族怎样取得生活来源或对遗产依赖多深。</p>\n<p>因此，A没有准确改写背景，还造出了一个新的评价对象。原文的“财富力量上升时，贵族却仍居国家象征中心”，被替换为“贵族过度依赖财富很奇怪”。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1388,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q23-A-1"},{"section":"第三鸟 · 题目复盘","title":"A. Aristocrats' excessive reliance on inherited wealth.","level":4,"raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n>\n> The most successful monarchies strive to abandon or hide their old aristocratic ways.\n>\n> 作者评价贵族家庭仍处于民主国家象征核心，下一段顺着这种矛盾写王室如何放弃或掩饰贵族做派。\n\n第四段把财富问题接到制度角色上，第五段于是讨论王室形象怎样调整。这条后续路线关心王室如何面对公众，不需要分析贵族家庭的收入依赖程度。\n\n如果A真是作者的意思，文章至少得写成：\n\n> At a time of rising inequality, it is bizarre that aristocratic families should rely so excessively on inherited wealth.\n>\n> 在不平等加剧的时代，贵族家庭竟如此过度依赖继承财富，这很奇怪。\n\n假设把 `bizarre` 后的对象改成过度依赖财富，A才得到直接支持。实际句中的对象却是 `the symbolic heart of modern democratic states`；随后讨论形象调整，也没有补写遗产依赖。两个版本评价的事情不同。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>贵族过度依赖继承财富</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式虽未认出部分财富相关词，仍看出后半句评价的是富有贵族家庭在现代民主国家里的象征地位，没有把它读成贵族依赖财富的方式。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把 <code>inherited wealth</code> 与 <code>aristocratic families</code> 拼成“贵族过度依赖继承财富”。文章说的是继承财富的力量增强，这种时代背景没有提供贵族主动依赖财富的动作，更没有给出过度依赖的程度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族过度依赖继承财富这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>odd</code> 对应第四段末句 <code>bizarre</code>；<code>inherited wealth</code> 又在同句前半段出现。两者位置接近，尤其容易让人把前面的财富背景直接塞进后面的评价。</p>\n<p>整句先用 <code>At a time when</code> 交代不平等加剧、继承财富力量增强的时代，随后才用 <code>it is bizarre that</code> 评价富有贵族家庭仍是现代民主国家的象征核心。两部分各有作用，不能混在一起。</p>\n<p>A新增 <code>reliance</code>，说贵族依靠这种财富；又加 <code>excessive</code>，把依靠判为过度。原文的 <code>increasing power</code> 修饰继承财富的社会力量，没有说明贵族怎样取得生活来源或对遗产依赖多深。</p>\n<p>因此，A没有准确改写背景，还造出了一个新的评价对象。原文的“财富力量上升时，贵族却仍居国家象征中心”，被替换为“贵族过度依赖财富很奇怪”。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-A-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>作者评价贵族家庭仍处于民主国家象征核心，下一段顺着这种矛盾写王室如何放弃或掩饰贵族做派。</p>\n</blockquote>\n<p>第四段把财富问题接到制度角色上，第五段于是讨论王室形象怎样调整。这条后续路线关心王室如何面对公众，不需要分析贵族家庭的收入依赖程度。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>At a time of rising inequality, it is bizarre that aristocratic families should rely so excessively on inherited wealth.</p>\n<p>在不平等加剧的时代，贵族家庭竟如此过度依赖继承财富，这很奇怪。</p>\n</blockquote>\n<p>假设把 <code>bizarre</code> 后的对象改成过度依赖财富，A才得到直接支持。实际句中的对象却是 <code>the symbolic heart of modern democratic states</code>；随后讨论形象调整，也没有补写遗产依赖。两个版本评价的事情不同。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1388,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q23-A-2"},{"section":"第三鸟 · 题目复盘","title":"A. Aristocrats' excessive reliance on inherited wealth.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入23题题干：\n\n> 第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。\n\n但A实际说的是：\n\n> Aristocrats' excessive reliance on inherited wealth.  \n> 贵族过度依赖继承财富\n\nA与主旨共享王室、财富这些话题，却把制度是否适应现代社会，收窄成贵族家庭如何依赖财产。标题不能替它补出依赖程度。\n\n全文的继承特权批评固然涉及财富，第四段具体说奇怪的仍是贵族所占的象征角色。A新增的动作与程度没有局部证据，无法通过主旨验证。\n\n**复盘判断：A错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>贵族过度依赖继承财富</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式虽未认出部分财富相关词，仍看出后半句评价的是富有贵族家庭在现代民主国家里的象征地位，没有把它读成贵族依赖财富的方式。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把 <code>inherited wealth</code> 与 <code>aristocratic families</code> 拼成“贵族过度依赖继承财富”。文章说的是继承财富的力量增强，这种时代背景没有提供贵族主动依赖财富的动作，更没有给出过度依赖的程度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族过度依赖继承财富这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>odd</code> 对应第四段末句 <code>bizarre</code>；<code>inherited wealth</code> 又在同句前半段出现。两者位置接近，尤其容易让人把前面的财富背景直接塞进后面的评价。</p>\n<p>整句先用 <code>At a time when</code> 交代不平等加剧、继承财富力量增强的时代，随后才用 <code>it is bizarre that</code> 评价富有贵族家庭仍是现代民主国家的象征核心。两部分各有作用，不能混在一起。</p>\n<p>A新增 <code>reliance</code>，说贵族依靠这种财富；又加 <code>excessive</code>，把依靠判为过度。原文的 <code>increasing power</code> 修饰继承财富的社会力量，没有说明贵族怎样取得生活来源或对遗产依赖多深。</p>\n<p>因此，A没有准确改写背景，还造出了一个新的评价对象。原文的“财富力量上升时，贵族却仍居国家象征中心”，被替换为“贵族过度依赖财富很奇怪”。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-A-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>作者评价贵族家庭仍处于民主国家象征核心，下一段顺着这种矛盾写王室如何放弃或掩饰贵族做派。</p>\n</blockquote>\n<p>第四段把财富问题接到制度角色上，第五段于是讨论王室形象怎样调整。这条后续路线关心王室如何面对公众，不需要分析贵族家庭的收入依赖程度。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>At a time of rising inequality, it is bizarre that aristocratic families should rely so excessively on inherited wealth.</p>\n<p>在不平等加剧的时代，贵族家庭竟如此过度依赖继承财富，这很奇怪。</p>\n</blockquote>\n<p>假设把 <code>bizarre</code> 后的对象改成过度依赖财富，A才得到直接支持。实际句中的对象却是 <code>the symbolic heart of modern democratic states</code>；随后讨论形象调整，也没有补写遗产依赖。两个版本评价的事情不同。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-A-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>Aristocrats&#39; excessive reliance on inherited wealth.<br>贵族过度依赖继承财富</p>\n</blockquote>\n<p>A与主旨共享王室、财富这些话题，却把制度是否适应现代社会，收窄成贵族家庭如何依赖财产。标题不能替它补出依赖程度。</p>\n<p>全文的继承特权批评固然涉及财富，第四段具体说奇怪的仍是贵族所占的象征角色。A新增的动作与程度没有局部证据，无法通过主旨验证。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1388,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q23-A-3"},{"section":"第三鸟 · 题目复盘","title":"B. The role of the nobility in modern democracies.","level":3,"raw":"### B. The role of the nobility in modern democracies.\n\n> 贵族在现代民主制度中的角色\n\n**做题模式中的状态：** 第一轮保留并确定B。当时选项是 `The role of the [xxx] in modern democracies.`，`nobility` 被遮挡，但 `role`、`modern democracies` 与贵族家庭的民主国家象征地位能接上。\n\n**选项类型：正确同义概括。**\n\nB用 `nobility` 概括 `wealthy aristocratic families`，以 `role` 概括其充当 `symbolic heart` 的作用，以 `modern democracies` 对应 `modern democratic states`。词更短了，评价的主体、角色及制度环境都没有变。\n\n**出处：**\n\n> Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定B。当时选项是 <code>The role of the [xxx] in modern democracies.</code>，<code>nobility</code> 被遮挡，但 <code>role</code>、<code>modern democracies</code> 与贵族家庭的民主国家象征地位能接上。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>B用 <code>nobility</code> 概括 <code>wealthy aristocratic families</code>，以 <code>role</code> 概括其充当 <code>symbolic heart</code> 的作用，以 <code>modern democracies</code> 对应 <code>modern democratic states</code>。词更短了，评价的主体、角色及制度环境都没有变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1476,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q23-B-0"},{"section":"第三鸟 · 题目复盘","title":"B. The role of the nobility in modern democracies.","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据第四段，贵族在现代民主制度中的角色被认为很奇怪。\n\n用 `odd` 找到 `it is bizarre that`，再完整读出后面的内容。B中的 `modern democracies` 对应同句末尾 `modern democratic states`，因此不必凭贵族一词去别段兜圈。\n\n从句主体是 `wealthy aristocratic families`，它们 `should still be` 民主国家的 `symbolic heart`。这个表语说的是它们扮演什么公共角色，正是B的 `role` 所概括的部分。\n\n上一句说明它们的历史和部分当下行为体现过时特权与不平等；下一句把这种贵族身份放进现代民主制度，突出不协调。`still` 强调这种角色仍保留到现代，不能漏掉这个对照。\n\nB抽象了角色名称，却保留谁处在什么制度里这一组关系。读成贵族在民主国家里的象征作用，就能把背景批评与直接评价连起来，没有转成财富来源或生活方式。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定B。当时选项是 <code>The role of the [xxx] in modern democracies.</code>，<code>nobility</code> 被遮挡，但 <code>role</code>、<code>modern democracies</code> 与贵族家庭的民主国家象征地位能接上。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>B用 <code>nobility</code> 概括 <code>wealthy aristocratic families</code>，以 <code>role</code> 概括其充当 <code>symbolic heart</code> 的作用，以 <code>modern democracies</code> 对应 <code>modern democratic states</code>。词更短了，评价的主体、角色及制度环境都没有变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族在现代民主制度中的角色被认为很奇怪。</p>\n</blockquote>\n<p>用 <code>odd</code> 找到 <code>it is bizarre that</code>，再完整读出后面的内容。B中的 <code>modern democracies</code> 对应同句末尾 <code>modern democratic states</code>，因此不必凭贵族一词去别段兜圈。</p>\n<p>从句主体是 <code>wealthy aristocratic families</code>，它们 <code>should still be</code> 民主国家的 <code>symbolic heart</code>。这个表语说的是它们扮演什么公共角色，正是B的 <code>role</code> 所概括的部分。</p>\n<p>上一句说明它们的历史和部分当下行为体现过时特权与不平等；下一句把这种贵族身份放进现代民主制度，突出不协调。<code>still</code> 强调这种角色仍保留到现代，不能漏掉这个对照。</p>\n<p>B抽象了角色名称，却保留谁处在什么制度里这一组关系。读成贵族在民主国家里的象征作用，就能把背景批评与直接评价连起来，没有转成财富来源或生活方式。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1476,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q23-B-1"},{"section":"第三鸟 · 题目复盘","title":"B. The role of the nobility in modern democracies.","level":4,"raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n>\n> The most successful monarchies strive to abandon or hide their old aristocratic ways.\n>\n> 作者先批评历史特权，再质疑贵族家庭的民主国家象征角色，随后写王室努力淡化贵族做派。\n\n后一段的形象调整接着前一段的角色冲突：既要担任现代国家象征，又带着旧贵族身份，就需要让公众看到与传统特权不同的样子。这让第四段的评价对象更清楚。\n\n如果B真是作者的意思，文章至少得写成：\n\n> It is bizarre that the nobility should still occupy such a central symbolic role in modern democracies.\n>\n> 贵族在现代民主制度中竟仍占据如此核心的象征角色，这很奇怪。\n\n假设只把长表达收短：贵族家庭换成贵族，象征核心换成核心象征角色，现代民主国家换成现代民主制度。B需要的评价在原文已经出现，下一段的应对也继续围绕这个角色矛盾展开。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定B。当时选项是 <code>The role of the [xxx] in modern democracies.</code>，<code>nobility</code> 被遮挡，但 <code>role</code>、<code>modern democracies</code> 与贵族家庭的民主国家象征地位能接上。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>B用 <code>nobility</code> 概括 <code>wealthy aristocratic families</code>，以 <code>role</code> 概括其充当 <code>symbolic heart</code> 的作用，以 <code>modern democracies</code> 对应 <code>modern democratic states</code>。词更短了，评价的主体、角色及制度环境都没有变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族在现代民主制度中的角色被认为很奇怪。</p>\n</blockquote>\n<p>用 <code>odd</code> 找到 <code>it is bizarre that</code>，再完整读出后面的内容。B中的 <code>modern democracies</code> 对应同句末尾 <code>modern democratic states</code>，因此不必凭贵族一词去别段兜圈。</p>\n<p>从句主体是 <code>wealthy aristocratic families</code>，它们 <code>should still be</code> 民主国家的 <code>symbolic heart</code>。这个表语说的是它们扮演什么公共角色，正是B的 <code>role</code> 所概括的部分。</p>\n<p>上一句说明它们的历史和部分当下行为体现过时特权与不平等；下一句把这种贵族身份放进现代民主制度，突出不协调。<code>still</code> 强调这种角色仍保留到现代，不能漏掉这个对照。</p>\n<p>B抽象了角色名称，却保留谁处在什么制度里这一组关系。读成贵族在民主国家里的象征作用，就能把背景批评与直接评价连起来，没有转成财富来源或生活方式。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-B-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>作者先批评历史特权，再质疑贵族家庭的民主国家象征角色，随后写王室努力淡化贵族做派。</p>\n</blockquote>\n<p>后一段的形象调整接着前一段的角色冲突：既要担任现代国家象征，又带着旧贵族身份，就需要让公众看到与传统特权不同的样子。这让第四段的评价对象更清楚。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that the nobility should still occupy such a central symbolic role in modern democracies.</p>\n<p>贵族在现代民主制度中竟仍占据如此核心的象征角色，这很奇怪。</p>\n</blockquote>\n<p>假设只把长表达收短：贵族家庭换成贵族，象征核心换成核心象征角色，现代民主国家换成现代民主制度。B需要的评价在原文已经出现，下一段的应对也继续围绕这个角色矛盾展开。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1476,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q23-B-2"},{"section":"第三鸟 · 题目复盘","title":"B. The role of the nobility in modern democracies.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入23题题干：\n\n> 第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。\n\nB实际说的是：\n\n> The role of the nobility in modern democracies.  \n> 贵族在现代民主制度中的角色\n\nB把回答放在王室与现代制度的关系上，符合主旨要求找出的制度矛盾。西班牙事件之所以能给其他欧洲君主上课，正因为这种冲突并不限于卡洛斯个人。\n\n主旨只负责确认这层范围；第四段的 `bizarre` 从句才直接确认贵族的象征角色是评价对象。B在抽象时没有丢掉这一对象，因而能同时接上局部与全篇。\n\n**复盘判断：B正确。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定B。当时选项是 <code>The role of the [xxx] in modern democracies.</code>，<code>nobility</code> 被遮挡，但 <code>role</code>、<code>modern democracies</code> 与贵族家庭的民主国家象征地位能接上。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>B用 <code>nobility</code> 概括 <code>wealthy aristocratic families</code>，以 <code>role</code> 概括其充当 <code>symbolic heart</code> 的作用，以 <code>modern democracies</code> 对应 <code>modern democratic states</code>。词更短了，评价的主体、角色及制度环境都没有变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族在现代民主制度中的角色被认为很奇怪。</p>\n</blockquote>\n<p>用 <code>odd</code> 找到 <code>it is bizarre that</code>，再完整读出后面的内容。B中的 <code>modern democracies</code> 对应同句末尾 <code>modern democratic states</code>，因此不必凭贵族一词去别段兜圈。</p>\n<p>从句主体是 <code>wealthy aristocratic families</code>，它们 <code>should still be</code> 民主国家的 <code>symbolic heart</code>。这个表语说的是它们扮演什么公共角色，正是B的 <code>role</code> 所概括的部分。</p>\n<p>上一句说明它们的历史和部分当下行为体现过时特权与不平等；下一句把这种贵族身份放进现代民主制度，突出不协调。<code>still</code> 强调这种角色仍保留到现代，不能漏掉这个对照。</p>\n<p>B抽象了角色名称，却保留谁处在什么制度里这一组关系。读成贵族在民主国家里的象征作用，就能把背景批评与直接评价连起来，没有转成财富来源或生活方式。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-B-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>作者先批评历史特权，再质疑贵族家庭的民主国家象征角色，随后写王室努力淡化贵族做派。</p>\n</blockquote>\n<p>后一段的形象调整接着前一段的角色冲突：既要担任现代国家象征，又带着旧贵族身份，就需要让公众看到与传统特权不同的样子。这让第四段的评价对象更清楚。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that the nobility should still occupy such a central symbolic role in modern democracies.</p>\n<p>贵族在现代民主制度中竟仍占据如此核心的象征角色，这很奇怪。</p>\n</blockquote>\n<p>假设只把长表达收短：贵族家庭换成贵族，象征核心换成核心象征角色，现代民主国家换成现代民主制度。B需要的评价在原文已经出现，下一段的应对也继续围绕这个角色矛盾展开。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-B-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>B实际说的是：</p>\n<blockquote>\n<p>The role of the nobility in modern democracies.<br>贵族在现代民主制度中的角色</p>\n</blockquote>\n<p>B把回答放在王室与现代制度的关系上，符合主旨要求找出的制度矛盾。西班牙事件之所以能给其他欧洲君主上课，正因为这种冲突并不限于卡洛斯个人。</p>\n<p>主旨只负责确认这层范围；第四段的 <code>bizarre</code> 从句才直接确认贵族的象征角色是评价对象。B在抽象时没有丢掉这一对象，因而能同时接上局部与全篇。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1476,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q23-B-3"},{"section":"第三鸟 · 题目复盘","title":"C. The simple lifestyle of the aristocratic families.","level":3,"raw":"### C. The simple lifestyle of the aristocratic families.\n\n> 贵族家庭的简朴生活方式\n\n**做题模式中的状态：** 第一轮直接排除C。做题模式看到第四段写富有、特权与不平等，没有将王室的简朴形象当作该段明确说奇怪的内容。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nC容易借到第五段王子公主有日常工作、骑自行车的细节。那些细节确实展现了较普通的公共形象，但题干锁定第四段被评价为奇怪的事情；把下一段的生活细节搬来回答，换了范围和评价对象。\n\n**命题人借用的原文材料：**\n\n> Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式看到第四段写富有、特权与不平等，没有将王室的简朴形象当作该段明确说奇怪的内容。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>C容易借到第五段王子公主有日常工作、骑自行车的细节。那些细节确实展现了较普通的公共形象，但题干锁定第四段被评价为奇怪的事情；把下一段的生活细节搬来回答，换了范围和评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1564,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q23-C-0"},{"section":"第三鸟 · 题目复盘","title":"C. The simple lifestyle of the aristocratic families.","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据第四段，贵族家庭的简朴生活方式被认为很奇怪。\n\n`simple lifestyle` 最接近第五段的 `day-jobs`、`ride bicycles`。然而题干明确写 `according to Paragraph 4`，第四段的判断点是 `bizarre`，所以需要把这两个落点分开。\n\n第五段用工作、自行车说明王室努力淡化贵族做派。这可以支持一种较普通的外在生活形象，却没有说作者认为这种形象奇怪。\n\n第四段的评价从句谈 `wealthy aristocratic families` 仍处在 `modern democratic states` 的象征中心。它质疑一种制度角色，并未把“生活简朴”放在被评价的位置；`wealthy` 也提醒我们不可把形象直接当作全面生活事实。\n\nC抓到了后文可辨认的生活细节，却用它替换本段的制度评价。即便承认骑车和日常工作较朴素，也不能把“这些细节存在”再推成“第四段说它们奇怪”。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式看到第四段写富有、特权与不平等，没有将王室的简朴形象当作该段明确说奇怪的内容。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>C容易借到第五段王子公主有日常工作、骑自行车的细节。那些细节确实展现了较普通的公共形象，但题干锁定第四段被评价为奇怪的事情；把下一段的生活细节搬来回答，换了范围和评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族家庭的简朴生活方式被认为很奇怪。</p>\n</blockquote>\n<p><code>simple lifestyle</code> 最接近第五段的 <code>day-jobs</code>、<code>ride bicycles</code>。然而题干明确写 <code>according to Paragraph 4</code>，第四段的判断点是 <code>bizarre</code>，所以需要把这两个落点分开。</p>\n<p>第五段用工作、自行车说明王室努力淡化贵族做派。这可以支持一种较普通的外在生活形象，却没有说作者认为这种形象奇怪。</p>\n<p>第四段的评价从句谈 <code>wealthy aristocratic families</code> 仍处在 <code>modern democratic states</code> 的象征中心。它质疑一种制度角色，并未把“生活简朴”放在被评价的位置；<code>wealthy</code> 也提醒我们不可把形象直接当作全面生活事实。</p>\n<p>C抓到了后文可辨认的生活细节，却用它替换本段的制度评价。即便承认骑车和日常工作较朴素，也不能把“这些细节存在”再推成“第四段说它们奇怪”。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1564,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q23-C-1"},{"section":"第三鸟 · 题目复盘","title":"C. The simple lifestyle of the aristocratic families.","level":4,"raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n>\n> The most successful monarchies strive to abandon or hide their old aristocratic ways.\n>\n> Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).\n>\n> 第四段说贵族仍居民主国家象征中心很奇怪；下一段介绍放弃或隐藏旧贵族做派的努力，并举工作和骑车为例。\n\n文章由制度矛盾转向王室的应对，普通形象是针对矛盾作出的调整。段落位置决定了它在论证中的职责，不能把应对措施倒放进前一段的批评结论。\n\n如果C真是作者的意思，文章至少得写成：\n\n> It is bizarre that wealthy aristocratic families should lead such simple lives.\n>\n> 富有的贵族家庭竟过着如此简朴的生活，这很奇怪。\n\n这句假设必须让 `bizarre` 直接评价简朴生活。实际评价对象是象征核心，简朴形象到下一段才以应对方式出现。二者相邻，却承担不同功能；把段落顺序抹掉，才会误以为C也在回答同一件事。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式看到第四段写富有、特权与不平等，没有将王室的简朴形象当作该段明确说奇怪的内容。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>C容易借到第五段王子公主有日常工作、骑自行车的细节。那些细节确实展现了较普通的公共形象，但题干锁定第四段被评价为奇怪的事情；把下一段的生活细节搬来回答，换了范围和评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族家庭的简朴生活方式被认为很奇怪。</p>\n</blockquote>\n<p><code>simple lifestyle</code> 最接近第五段的 <code>day-jobs</code>、<code>ride bicycles</code>。然而题干明确写 <code>according to Paragraph 4</code>，第四段的判断点是 <code>bizarre</code>，所以需要把这两个落点分开。</p>\n<p>第五段用工作、自行车说明王室努力淡化贵族做派。这可以支持一种较普通的外在生活形象，却没有说作者认为这种形象奇怪。</p>\n<p>第四段的评价从句谈 <code>wealthy aristocratic families</code> 仍处在 <code>modern democratic states</code> 的象征中心。它质疑一种制度角色，并未把“生活简朴”放在被评价的位置；<code>wealthy</code> 也提醒我们不可把形象直接当作全面生活事实。</p>\n<p>C抓到了后文可辨认的生活细节，却用它替换本段的制度评价。即便承认骑车和日常工作较朴素，也不能把“这些细节存在”再推成“第四段说它们奇怪”。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-C-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>第四段说贵族仍居民主国家象征中心很奇怪；下一段介绍放弃或隐藏旧贵族做派的努力，并举工作和骑车为例。</p>\n</blockquote>\n<p>文章由制度矛盾转向王室的应对，普通形象是针对矛盾作出的调整。段落位置决定了它在论证中的职责，不能把应对措施倒放进前一段的批评结论。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that wealthy aristocratic families should lead such simple lives.</p>\n<p>富有的贵族家庭竟过着如此简朴的生活，这很奇怪。</p>\n</blockquote>\n<p>这句假设必须让 <code>bizarre</code> 直接评价简朴生活。实际评价对象是象征核心，简朴形象到下一段才以应对方式出现。二者相邻，却承担不同功能；把段落顺序抹掉，才会误以为C也在回答同一件事。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1564,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q23-C-2"},{"section":"第三鸟 · 题目复盘","title":"C. The simple lifestyle of the aristocratic families.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入23题题干：\n\n> 第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。\n\n但C实际说的是：\n\n> The simple lifestyle of the aristocratic families.  \n> 贵族家庭的简朴生活方式\n\n主旨中的教训要解释现代君主制的矛盾与应对。C选择的是后文一种应对形象，题干问的却是第四段所指出的矛盾本身。\n\n全文没有把简朴生活当作需要警惕的毛病。相反，作者承认王室在努力调整，又指出财富与媒体让形象难维持。C的细节有来处，回答的层次和位置却不对。\n\n**复盘判断：C错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式看到第四段写富有、特权与不平等，没有将王室的简朴形象当作该段明确说奇怪的内容。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>C容易借到第五段王子公主有日常工作、骑自行车的细节。那些细节确实展现了较普通的公共形象，但题干锁定第四段被评价为奇怪的事情；把下一段的生活细节搬来回答，换了范围和评价对象。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族家庭的简朴生活方式被认为很奇怪。</p>\n</blockquote>\n<p><code>simple lifestyle</code> 最接近第五段的 <code>day-jobs</code>、<code>ride bicycles</code>。然而题干明确写 <code>according to Paragraph 4</code>，第四段的判断点是 <code>bizarre</code>，所以需要把这两个落点分开。</p>\n<p>第五段用工作、自行车说明王室努力淡化贵族做派。这可以支持一种较普通的外在生活形象，却没有说作者认为这种形象奇怪。</p>\n<p>第四段的评价从句谈 <code>wealthy aristocratic families</code> 仍处在 <code>modern democratic states</code> 的象征中心。它质疑一种制度角色，并未把“生活简朴”放在被评价的位置；<code>wealthy</code> 也提醒我们不可把形象直接当作全面生活事实。</p>\n<p>C抓到了后文可辨认的生活细节，却用它替换本段的制度评价。即便承认骑车和日常工作较朴素，也不能把“这些细节存在”再推成“第四段说它们奇怪”。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-C-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters).</p>\n<p>第四段说贵族仍居民主国家象征中心很奇怪；下一段介绍放弃或隐藏旧贵族做派的努力，并举工作和骑车为例。</p>\n</blockquote>\n<p>文章由制度矛盾转向王室的应对，普通形象是针对矛盾作出的调整。段落位置决定了它在论证中的职责，不能把应对措施倒放进前一段的批评结论。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that wealthy aristocratic families should lead such simple lives.</p>\n<p>富有的贵族家庭竟过着如此简朴的生活，这很奇怪。</p>\n</blockquote>\n<p>这句假设必须让 <code>bizarre</code> 直接评价简朴生活。实际评价对象是象征核心，简朴形象到下一段才以应对方式出现。二者相邻，却承担不同功能；把段落顺序抹掉，才会误以为C也在回答同一件事。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-C-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>The simple lifestyle of the aristocratic families.<br>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p>主旨中的教训要解释现代君主制的矛盾与应对。C选择的是后文一种应对形象，题干问的却是第四段所指出的矛盾本身。</p>\n<p>全文没有把简朴生活当作需要警惕的毛病。相反，作者承认王室在努力调整，又指出财富与媒体让形象难维持。C的细节有来处，回答的层次和位置却不对。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1564,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q23-C-3"},{"section":"第三鸟 · 题目复盘","title":"D. The nobility's adherence to their privileges.","level":3,"raw":"### D. The nobility's adherence to their privileges.\n\n> 贵族坚持自己的特权\n\n**做题模式中的状态：** 第一轮直接排除D。做题模式虽在第四段找到 `privileges`，仍区分了体现特权的历史背景与末句真正评价的贵族角色，没有把前者直接当答案。\n\n**错误类型：第三类——无中生有。**\n\nD复用 `privileges`，把历史及行为“体现特权”写成贵族“坚持特权”，再把这一新动作放到奇怪的评价下。原文批评特权，却没有明说贵族拒绝放弃它的行动过程。\n\n**命题人借用的原文材料：**\n\n> Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>贵族坚持自己的特权</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式虽在第四段找到 <code>privileges</code>，仍区分了体现特权的历史背景与末句真正评价的贵族角色，没有把前者直接当答案。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D复用 <code>privileges</code>，把历史及行为“体现特权”写成贵族“坚持特权”，再把这一新动作放到奇怪的评价下。原文批评特权，却没有明说贵族拒绝放弃它的行动过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1653,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q23-D-0"},{"section":"第三鸟 · 题目复盘","title":"D. The nobility's adherence to their privileges.","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第四段，贵族坚持自己的特权这件事被认为很奇怪。\n\n`privileges` 对应第四段第二句，这是D最像原文的地方。题干问 `odd`，还必须继续读末句 `it is bizarre that`，看这个评价落在哪里。\n\n第二句的主语是王室的历史，有时也包括其当下行为；`embodies` 表示体现过时且站不住脚的特权与不平等。这里描述一种历史和行为的性质。\n\nD用 `adherence` 加入坚持、固守的动作，由贵族主动对特权表明态度。体现某种特权，与被告知应放弃后仍坚持，所需证据不同；不能只因都出现特权就互换。\n\n末句明确评价的又是贵族家庭仍作民主国家象征核心。D既把性质描述改成未写出的坚持动作，又替换了 `bizarre` 的对象，因此没有形成完整出处支持。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>贵族坚持自己的特权</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式虽在第四段找到 <code>privileges</code>，仍区分了体现特权的历史背景与末句真正评价的贵族角色，没有把前者直接当答案。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D复用 <code>privileges</code>，把历史及行为“体现特权”写成贵族“坚持特权”，再把这一新动作放到奇怪的评价下。原文批评特权，却没有明说贵族拒绝放弃它的行动过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族坚持自己的特权这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>privileges</code> 对应第四段第二句，这是D最像原文的地方。题干问 <code>odd</code>，还必须继续读末句 <code>it is bizarre that</code>，看这个评价落在哪里。</p>\n<p>第二句的主语是王室的历史，有时也包括其当下行为；<code>embodies</code> 表示体现过时且站不住脚的特权与不平等。这里描述一种历史和行为的性质。</p>\n<p>D用 <code>adherence</code> 加入坚持、固守的动作，由贵族主动对特权表明态度。体现某种特权，与被告知应放弃后仍坚持，所需证据不同；不能只因都出现特权就互换。</p>\n<p>末句明确评价的又是贵族家庭仍作民主国家象征核心。D既把性质描述改成未写出的坚持动作，又替换了 <code>bizarre</code> 的对象，因此没有形成完整出处支持。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1653,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q23-D-1"},{"section":"第三鸟 · 题目复盘","title":"D. The nobility's adherence to their privileges.","level":4,"raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.\n>\n> At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n>\n> The most successful monarchies strive to abandon or hide their old aristocratic ways.\n>\n> 历史及行为体现特权，贵族仍居民主国家象征中心显得反常；后面写成功王室努力放弃或掩饰旧做派。\n\n作者由历史遗留的特权转到现代角色，再写王室尝试调整形象。后文有的还是放弃或隐藏旧做派的努力，不能反过来补成贵族集体坚持特权的明示事实。\n\n如果D真是作者的意思，文章至少得写成：\n\n> It is bizarre that the nobility should insist on retaining their privileges.\n>\n> 贵族竟坚持保留自己的特权，这很奇怪。\n\nD需要 `insist on retaining` 这种主动坚持，并要让作者直接评价这个动作。原文用的是历史和行为 `embodies`，末句转向象征地位。后段虽未说实际特权都被消除，也没有提供D所要求的坚持过程。","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>贵族坚持自己的特权</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式虽在第四段找到 <code>privileges</code>，仍区分了体现特权的历史背景与末句真正评价的贵族角色，没有把前者直接当答案。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D复用 <code>privileges</code>，把历史及行为“体现特权”写成贵族“坚持特权”，再把这一新动作放到奇怪的评价下。原文批评特权，却没有明说贵族拒绝放弃它的行动过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族坚持自己的特权这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>privileges</code> 对应第四段第二句，这是D最像原文的地方。题干问 <code>odd</code>，还必须继续读末句 <code>it is bizarre that</code>，看这个评价落在哪里。</p>\n<p>第二句的主语是王室的历史，有时也包括其当下行为；<code>embodies</code> 表示体现过时且站不住脚的特权与不平等。这里描述一种历史和行为的性质。</p>\n<p>D用 <code>adherence</code> 加入坚持、固守的动作，由贵族主动对特权表明态度。体现某种特权，与被告知应放弃后仍坚持，所需证据不同；不能只因都出现特权就互换。</p>\n<p>末句明确评价的又是贵族家庭仍作民主国家象征核心。D既把性质描述改成未写出的坚持动作，又替换了 <code>bizarre</code> 的对象，因此没有形成完整出处支持。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-D-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>历史及行为体现特权，贵族仍居民主国家象征中心显得反常；后面写成功王室努力放弃或掩饰旧做派。</p>\n</blockquote>\n<p>作者由历史遗留的特权转到现代角色，再写王室尝试调整形象。后文有的还是放弃或隐藏旧做派的努力，不能反过来补成贵族集体坚持特权的明示事实。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that the nobility should insist on retaining their privileges.</p>\n<p>贵族竟坚持保留自己的特权，这很奇怪。</p>\n</blockquote>\n<p>D需要 <code>insist on retaining</code> 这种主动坚持，并要让作者直接评价这个动作。原文用的是历史和行为 <code>embodies</code>，末句转向象征地位。后段虽未说实际特权都被消除，也没有提供D所要求的坚持过程。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1653,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method"},"focusId":"focus-q23-D-2"},{"section":"第三鸟 · 题目复盘","title":"D. The nobility's adherence to their privileges.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Carlos, a Lesson for All European Monarchs  \n> 卡洛斯：给所有欧洲君主的一课\n\n把这个主旨直接代入23题题干：\n\n> 第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。\n\n但D实际说的是：\n\n> The nobility's adherence to their privileges.  \n> 贵族坚持自己的特权\n\n特权确实属于这堂课讨论的矛盾，D因此容易显得合题。可主旨只说明这个话题重要，不会把体现特权自动变成坚持特权。\n\n本题仍须回到第四段的明确评价：富有贵族家庭扮演现代民主国家象征核心。D把支撑评价的背景词加工成新动作，完整命题未获原文支持。\n\n**复盘判断：D错误。**","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>贵族坚持自己的特权</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式虽在第四段找到 <code>privileges</code>，仍区分了体现特权的历史背景与末句真正评价的贵族角色，没有把前者直接当答案。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>D复用 <code>privileges</code>，把历史及行为“体现特权”写成贵族“坚持特权”，再把这一新动作放到奇怪的评价下。原文批评特权，却没有明说贵族拒绝放弃它的行动过程。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据第四段，贵族坚持自己的特权这件事被认为很奇怪。</p>\n</blockquote>\n<p><code>privileges</code> 对应第四段第二句，这是D最像原文的地方。题干问 <code>odd</code>，还必须继续读末句 <code>it is bizarre that</code>，看这个评价落在哪里。</p>\n<p>第二句的主语是王室的历史，有时也包括其当下行为；<code>embodies</code> 表示体现过时且站不住脚的特权与不平等。这里描述一种历史和行为的性质。</p>\n<p>D用 <code>adherence</code> 加入坚持、固守的动作，由贵族主动对特权表明态度。体现某种特权，与被告知应放弃后仍坚持，所需证据不同；不能只因都出现特权就互换。</p>\n<p>末句明确评价的又是贵族家庭仍作民主国家象征核心。D既把性质描述改成未写出的坚持动作，又替换了 <code>bizarre</code> 的对象，因此没有形成完整出处支持。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-D-2\"><h3>写作视角法</h3>\n<p>原文第4、5段是这样写的：</p>\n<blockquote>\n<p>Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways.</p>\n<p>历史及行为体现特权，贵族仍居民主国家象征中心显得反常；后面写成功王室努力放弃或掩饰旧做派。</p>\n</blockquote>\n<p>作者由历史遗留的特权转到现代角色，再写王室尝试调整形象。后文有的还是放弃或隐藏旧做派的努力，不能反过来补成贵族集体坚持特权的明示事实。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>It is bizarre that the nobility should insist on retaining their privileges.</p>\n<p>贵族竟坚持保留自己的特权，这很奇怪。</p>\n</blockquote>\n<p>D需要 <code>insist on retaining</code> 这种主动坚持，并要让作者直接评价这个动作。原文用的是历史和行为 <code>embodies</code>，末句转向象征地位。后段虽未说实际特权都被消除，也没有提供D所要求的坚持过程。</p>\n</section><section class=\"revealPart\" id=\"focus-q23-D-3\"><h3>主旨交叉验证法</h3>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入23题题干：</p>\n<blockquote>\n<p>第四段认为奇怪的事情，应是欧洲君主制需要反思的一项问题，能够进入卡洛斯给其他君主的共同教训。主旨只能限定这一制度方向，究竟哪件事受到评价，须由第四段明确写出的判断确定。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>The nobility&#39;s adherence to their privileges.<br>贵族坚持自己的特权</p>\n</blockquote>\n<p>特权确实属于这堂课讨论的矛盾，D因此容易显得合题。可主旨只说明这个话题重要，不会把体现特权自动变成坚持特权。</p>\n<p>本题仍须回到第四段的明确评价：富有贵族家庭扮演现代民主国家象征核心。D把支撑评价的背景词加工成新动作，完整命题未获原文支持。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1653,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method"},"focusId":"focus-q23-D-3"},{"section":"第三鸟 · 题目复盘","title":"23题结论","level":2,"raw":"### 23题结论\n\n> **23. B. The role of the nobility in modern democracies.**\n\nA新增过度依赖，C挪用后段生活细节，D新增坚持特权的动作；B保留贵族在现代民主国家中的象征角色。","html":"<blockquote>\n<p><strong>23. B. The role of the nobility in modern democracies.</strong></p>\n</blockquote>\n<p>A新增过度依赖，C挪用后段生活细节，D新增坚持特权的动作；B保留贵族在现代民主国家中的象征角色。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,1305,1600,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"23","questionConclusion":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"24题 · 题干、题型与核心出处","level":2,"raw":"## 24题\n\n> The British royals “have most to fear” because Charles ______.  \n> 英国王室“最需要担心”，是因为查尔斯怎么样？\n\n### 题型\n\n因果细节题。题干引用第六段 `have most to fear`，再用 `because Charles` 要求解释英国为何特别值得担忧。第六段点出英国，第七段先以女王作对照，再描述查尔斯的品味、等级观念及对元首服务角色的误解；这是一条跨段原因链。\n\n### 核心出处\n\n> While Europe's monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.\n>\n> It is only the Queen who has preserved the monarchy's reputation with her rather ordinary (if well-heeled) granny style.\n>\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy's worst enemies.\n\n第六段提出英国风险，第七段以女王对照查尔斯，并明确服务要求；原因要跨句合起来。","html":"<blockquote>\n<p>The British royals “have most to fear” because Charles ______.<br>英国王室“最需要担心”，是因为查尔斯怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>因果细节题。题干引用第六段 <code>have most to fear</code>，再用 <code>because Charles</code> 要求解释英国为何特别值得担忧。第六段点出英国，第七段先以女王作对照，再描述查尔斯的品味、等级观念及对元首服务角色的误解；这是一条跨段原因链。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>It is only the Queen who has preserved the monarchy&#39;s reputation with her rather ordinary (if well-heeled) granny style.</p>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n</blockquote>\n<p>第六段提出英国风险，第七段以女王对照查尔斯，并明确服务要求；原因要跨句合起来。</p>\n","context":{"mode":"image","asset":"questions","focus":[280,1830,1500,440],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","questionIntro":true},"focusId":null},{"section":"第三鸟 · 题目复盘","title":"A. takes a tough line on political issues","level":3,"raw":"### A. takes a tough line on political issues\n\n> 在政治问题上采取强硬立场\n\n**做题模式中的状态：** 第一轮直接排除A。做题模式看到查尔斯的世界观和角色理解问题，未读到他在具体政治问题上采取强硬立场的行为。\n\n**错误类型：第三类——无中生有。**\n\nA借用 `hierarchical view` 与 `non-political`，把等级观念和对职责的误解变成已经采取强硬政治立场。原文提供思想与角色问题，却没有报告相应的政治议题或强硬态度。\n\n**命题人借用的原文材料：**\n\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>在政治问题上采取强硬立场</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式看到查尔斯的世界观和角色理解问题，未读到他在具体政治问题上采取强硬立场的行为。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借用 <code>hierarchical view</code> 与 <code>non-political</code>，把等级观念和对职责的误解变成已经采取强硬政治立场。原文提供思想与角色问题，却没有报告相应的政治议题或强硬态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1916,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option"},"focusId":"focus-q24-A-0"},{"section":"第三鸟 · 题目复盘","title":"A. takes a tough line on political issues","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 英国王室最需要担心，是因为查尔斯在政治问题上采取强硬立场。\n\n题干的 `Charles` 对应第七段 `The danger will come with Charles`。A的 `political issues` 容易让人想到下句 `non-political`，但还要找 `takes a tough line` 是否有对应。\n\n原文列两种特征：昂贵的生活品味与相当等级化的世界观。接着解释他未理解现代王室依靠少争议、非政治元首服务而存续。\n\n`hierarchical` 说他如何看社会等级，`tough line` 说他在政治问题上如何表态或处理。前者不能自动推出后者；对非政治角色理解不足，也不等于已经在某个议题上态度强硬。\n\nA缺的是具体行为和态度这一层，不能由同句出现政治二字补出。原文可以支持查尔斯不适应角色，却没有给出他采取强硬政治路线的事实。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>在政治问题上采取强硬立场</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式看到查尔斯的世界观和角色理解问题，未读到他在具体政治问题上采取强硬立场的行为。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借用 <code>hierarchical view</code> 与 <code>non-political</code>，把等级观念和对职责的误解变成已经采取强硬政治立场。原文提供思想与角色问题，却没有报告相应的政治议题或强硬态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯在政治问题上采取强硬立场。</p>\n</blockquote>\n<p>题干的 <code>Charles</code> 对应第七段 <code>The danger will come with Charles</code>。A的 <code>political issues</code> 容易让人想到下句 <code>non-political</code>，但还要找 <code>takes a tough line</code> 是否有对应。</p>\n<p>原文列两种特征：昂贵的生活品味与相当等级化的世界观。接着解释他未理解现代王室依靠少争议、非政治元首服务而存续。</p>\n<p><code>hierarchical</code> 说他如何看社会等级，<code>tough line</code> 说他在政治问题上如何表态或处理。前者不能自动推出后者；对非政治角色理解不足，也不等于已经在某个议题上态度强硬。</p>\n<p>A缺的是具体行为和态度这一层，不能由同句出现政治二字补出。原文可以支持查尔斯不适应角色，却没有给出他采取强硬政治路线的事实。</p>\n</section>","context":{"mode":"image","asset":"questions","focus":[270,1916,1650,82],"sourceW":2255,"sourceH":3141,"label":"2015英语一Text 1题目"},"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method"},"focusId":"focus-q24-A-1"},{"section":"第三鸟 · 题目复盘","title":"A. takes a tough line on political issues","level":4,"raw":"#### 写作视角法\n\n原文第7段是这样写的：\n\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.\n>\n> He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.\n>\n> Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy's worst enemies.\n>\n> 作者写查尔斯的昂贵品味、等级观念和角色误解，结尾据此提醒王室最大的危险可能来自君主本人。\n\n作者从个人特征进入服务条件，再总结内部风险，没有举查尔斯参与政治争议的事例。最后的警告仍停留在如何理解并履行君主角色这一条线上。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The danger will come with Charles, who takes a tough line on political issues rather than remaining politically neutral.\n>\n> 危险将随查尔斯而来：他在政治问题上立场强硬，未保持政治中立。\n\n假设需要直接写政治立场强硬，才能把A和危险连成因果。实际写法直接陈述的则是品味、世界观与未理解服务角色。两条路线可能在现实中相关，但原文未完成从观念到强硬政治行为的那一步。","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>在政治问题上采取强硬立场</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除A。做题模式看到查尔斯的世界观和角色理解问题，未读到他在具体政治问题上采取强硬立场的行为。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A借用 <code>hierarchical view</code> 与 <code>non-political</code>，把等级观念和对职责的误解变成已经采取强硬政治立场。原文提供思想与角色问题，却没有报告相应的政治议题或强硬态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国王室最需要担心，是因为查尔斯在政治问题上采取强硬立场。</p>\n</blockquote>\n<p>题干的 <code>Charles</code> 对应第七段 <code>The danger will come with Charles</code>。A的 <code>political issues</code> 容易让人想到下句 <code>non-political</code>，但还要找 <code>takes a tough line</code> 是否有对应。</p>\n<p>原文列两种特征：昂贵的生活品味与相当等级化的世界观。接着解释他未理解现代王室依靠少争议、非政治元首服务而存续。</p>\n<p><code>hierarchical</code> 说他如何看社会等级，<code>tough line</code> 说他在政治问题上如何表态或处理。前者不能自动推出后者；对非政治角色理解不足，也不等于已经在某个议题上态度强硬。</p>\n<p>A缺的是具体行为和态度这一层，不能由同句出现政治二字补出。原文可以支持查尔斯不适应角色，却没有给出他采取强硬政治路线的事实。</p>\n</section><section class=\"revealPart\" id=\"focus-q24-A-2\"><h3>写作视角法</h3>\n<p>原文第7段是这样写的：</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<p>作者写查尔斯的昂贵品味、等级观念和角色误解，结尾据此提醒王室最大的危险可能来自君主本人。</p>\n</blockquote>\n<p>作者从个人特征进入服务条件，再总结内部风险，没有举查尔斯参与政治争议的事例。最后的警告仍停留在如何理解并履行君主角色这一条线上。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The danger will come with Charles, who takes a tough line on political issues rather than remaining politically neutral.</p>\n<p>危险将随查尔斯而来：他在政治问题上立场强硬，未保持政治中立。</p>\n</blockquote>\n<p>假设需要直接写政治立场强硬，才能把A和危险连成因果。实际写法直接陈述的则是品味、世界观与未理解服务角色。两条路线可能在现实中相关，但原文未完成从观念到强硬政治行为的那一步。</p>\n</sect
