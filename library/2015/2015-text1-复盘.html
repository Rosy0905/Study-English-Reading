const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A Symbol Above Party Conflict</strong></p><p><strong>B. The Limits of Looking Ordinary</strong></p><p><strong>C. A Spanish Warning for Other Crowns</strong></p><p><strong>D. How Elections Choose Better Monarchs</strong></p><p><strong>E. Inherited Privilege in a Democratic Age</strong></p><p><strong>F. The Public Service Bargain</strong></p><p><strong>G. A Debate About Wealth Alone</strong></p><hr><section class=\"newtype-qblock\" data-q=\"41\"><p><strong>41.</strong> When a king who once insisted that kings did not abdicate was forced to step down, the embarrassment could hardly remain a private family matter. Juan Carlos's retreat followed scandals and the growing strength of the republican left. Yet the important question reached beyond the man who had lost his position. If a crown could no longer rely on past authority to protect its reputation, other European royal households had reason to examine their own conduct. Spain did not prove that every monarchy was about to disappear. It showed how one royal failure could expose a problem that neighbouring crowns also needed to consider.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><p><strong>42.</strong> There are reasons why those crowns have not simply vanished. In a society divided by party loyalties, the person who wins an election may remain unacceptable to a large part of the population. A monarch can sometimes offer a different kind of representation: continuity that is not identified with the victory of one party over another. This was one of the arguments for the institution in Spain after deep political division. The claim is limited. Royal birth does not guarantee wisdom or fairness. It may, however, allow a public figure to stand for the country while elected politicians argue over its government.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><p><strong>43.</strong> That position brings an obligation as well as an advantage. Citizens who accept a hereditary head of state are not necessarily inviting a royal family to govern according to personal preference. They may accept the arrangement because it saves another difficult search for a respected, relatively uncontroversial representative. In return, the monarch is expected to perform a public service with restraint. Private importance must not be mistaken for political authority. Once a royal figure treats the office as a personal entitlement, the exchange becomes harder to defend: the public is asked to accept the privileges while receiving less of the service that justified them.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><p><strong>44.</strong> Even a monarch who observes this restraint cannot remove every contradiction. The symbolic centre of a modern democracy is still occupied by a family whose position is inherited. Its wealth and history may embody inequalities that the political community claims to question. Concerns about inherited fortunes make that contrast more visible, but the argument does not end with the size of a bank account. It asks why birth should confer a special public role in a society that values equal standing. The difficulty therefore survives even when a particular king or queen is personally respected and careful to avoid political controversy.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><p><strong>45.</strong> Royal households have tried to make this distance less visible. Ordinary jobs, bicycles and informal appearances can suggest that princes and princesses share the lives of other citizens. Such gestures may help, but they do not erase wealth, elite friendships or assumptions about rank. Persistent media attention makes any gap between the presented image and private habits harder to conceal. An apparently ordinary style can protect a reputation only while conduct remains compatible with it. The danger comes when looking like a modest public servant is treated as a substitute for understanding the role. A carefully arranged photograph cannot settle that larger problem.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><section class=\"newtype-qblock\" data-letter=\"A\"><p><strong>A.</strong> King Juan Carlos's abdication turned a family embarrassment into a European question. Scandals and the advance of the republican left had forced him to abandon his old claim that kings did not step down. If one established crown could lose authority so quickly, was the problem merely Spanish, or did it reveal a danger shared by other monarchies?</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><p><strong>B.</strong> Many royal households responded to this conflict between inherited privilege and democratic equality by making royalty look less royal. Princes and princesses took ordinary jobs, rode bicycles and presented themselves as useful citizens. These gestures were attempts to show that service, rather than aristocratic distance, defined the modern crown.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><p><strong>C.</strong> Britain had been protected by a queen whose public manner appeared ordinary and dutiful. The greater risk lay with Charles: expensive tastes and a hierarchical outlook suggested that he had not fully accepted the limited, non-political service expected of a future king. His difficulty gave the Spanish warning a specific British target.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><p><strong>D.</strong> The answer was not that every crown had reached its final day. Spain itself showed why monarchy could still be useful: after a period of deep political division, a figure placed above ordinary party competition could represent national continuity. The institution retained a function even while a particular king had failed.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><p><strong>E.</strong> Yet this justification based on public service left a central contradiction unresolved. An office meant to symbolize a democratic nation was inherited by a wealthy family. At a time of concern about inequality and inherited fortunes, the old privileges attached to royalty could make the symbol look hostile to the values it was supposed to unite.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><p><strong>F.</strong> Image management nevertheless became harder under continuous media scrutiny. Wealthy families could not forever conceal elite friendships, costly tastes or private assumptions about rank. The fall of a carefully protected reputation in Spain therefore pointed directly toward the monarchy across the Channel.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><p><strong>G.</strong> That function, however, depended on restraint. Modern monarchs survived when citizens regarded them as respected and relatively non-political heads of state. Their place was justified as a service that saved voters from another divisive contest, not as a licence to rule according to personal preference.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><p><strong>H.</strong> The final lesson of this British comparison was therefore internal rather than revolutionary. Republicans might criticize a monarchy, but a monarch who ignored the bargain of restraint could damage it more effectively than any outside opponent. European crowns would survive only if their own members understood that fact.</p></section><p><strong>A　41. _____　42. _____　E　43. _____　44. _____　45. _____　H</strong></p>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><img src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\"></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><img src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\"></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><img src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\"></p>\n<p><img src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\"></p>\n<p><img src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\"></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><img src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\"></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><img src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\"></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><img src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\"></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<p><img src=\"\" data-asset=\"articleAnnotated\" class=\"embedded-asset\" alt=\"2015英语一Text 1重点词与语境标注\"></p>\n<h2>第1段</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>King</td>\n<td>n. 国王</td>\n<td>Spain</td>\n<td>n. 西班牙</td>\n<td>insist</td>\n<td>v. 坚持</td>\n</tr>\n<tr>\n<td>abdicate</td>\n<td>v. 退位</td>\n<td>die</td>\n<td>v. 死去</td>\n<td>in one’s sleep</td>\n<td>在睡梦中</td>\n</tr>\n<tr>\n<td>embarrassing</td>\n<td>a. 令人尴尬的</td>\n<td>scandal</td>\n<td>n. 丑闻</td>\n<td>popularity</td>\n<td>n. 受欢迎程度</td>\n</tr>\n<tr>\n<td>republican</td>\n<td>a./n. 共和派的；共和派</td>\n<td>Euro-elections</td>\n<td>n. 欧洲选举</td>\n<td>force</td>\n<td>v. 迫使</td>\n</tr>\n<tr>\n<td>eat one’s words</td>\n<td>收回前言；食言</td>\n<td>stand down</td>\n<td>退位；下台</td>\n<td>crisis</td>\n<td>n. 危机</td>\n</tr>\n<tr>\n<td>suggest</td>\n<td>v. 表明；暗示</td>\n<td>monarchy</td>\n<td>n. 君主制</td>\n<td>the writing is on the wall</td>\n<td>大限将至</td>\n</tr>\n<tr>\n<td>royals</td>\n<td>n. 王室成员</td>\n<td>magnificent</td>\n<td>a. 华丽的；壮丽的</td>\n<td>majestic lifestyle</td>\n<td>威严的生活方式</td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>case</td>\n<td>n. 案例；情况</td>\n<td>provide</td>\n<td>v. 提供</td>\n<td>argument</td>\n<td>n. 论点；论据</t y’s reputation</td>\n<td>王室声誉</td>\n<td>ordinary</td>\n<td>a. 普通的</td>\n</tr>\n<tr>\n<td>well-heeled</td>\n<td>a. 富有的</td>\n<td>granny style</td>\n<td>老奶奶风格</td>\n<td>danger</td>\n<td>n. 危险</td>\n</tr>\n<tr>\n<td>expensive taste</td>\n<td>昂贵品味</td>\n<td>hierarchical</td>\n<td>a. 等级制的</td>\n<td>fail to understand</td>\n<td>未能理解</td>\n</tr>\n<tr>\n<td>largely</td>\n<td>ad. 大体上</td>\n<td>provide a service</td>\n<td>提供服务</td>\n<td>non-political</td>\n<td>a. 非政治的</td>\n</tr>\n<tr>\n<td>ought to</td>\n<td>应该</td>\n<td>republican</td>\n<td>n. 共和主义者</td>\n<td>worst enemy</td>\n<td>最大的敌人</td>\n</tr>\n</tbody></table></div>\n<h1>2.一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<h2>逐句逐段分析</h2>\n<h3>完整原文 · 第1段</h3>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot; But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<h3>意群划分 · 第1段</h3>\n<p>King Juan Carlos of Spain / once insisted / &quot;kings don&#39;t abdicate, / they die in their sleep.&quot;</p>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n<p>So, / does the Spanish crisis suggest / that monarchy is seeing / its last days?</p>\n<p>Does that mean / the writing is on the wall / for all European royals, / with their magnificent uniforms / and majestic lifestyles?</p>\n<h3>意群翻译 · 第1段</h3>\n<p>西班牙国王胡安·卡洛斯 / 曾经坚持 / &quot;国王不会退位，/ 他们在睡梦中死去。&quot;</p>\n<p>但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。</p>\n<p>那么，/ 西班牙危机是否暗示 / 君主制正在经历 / 它的最后时光？</p>\n<p>这是否意味着 / 大限将至 / 对所有欧洲皇室来说，/ 带着他们华丽的制服 / 和威严的生活方式？</p>\n<h3>标准译文 · 第1段</h3>\n<p>西班牙国王胡安·卡洛斯曾经坚持&quot;国王不会退位，他们在睡梦中死去&quot;。但令人尴尬的丑闻和共和派左翼在最近欧洲选举中的受欢迎程度迫使他食言并退位。那么，西班牙危机是否暗示君主制正在走向终结？这是否意味着所有欧洲皇室及其华丽制服和威严生活方式都将走向末路？</p>\n<h3>完整原文 · 第2段</h3>\n<p>The Spanish case provides arguments both for and against monarchy. When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<h3>意群划分 · 第2段</h3>\n<p>The Spanish case / provides arguments / both for and against monarchy.</p>\n<p>When public opinion / is particularly polarised, / as it was / following the end / of the Franco regime, / monarchs can rise above / &quot;mere&quot; politics / and &quot;embody&quot; / a spirit of national unity.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>西班牙案例 / 提供了论据 / 既支持又反对君主制。</p>\n<p>当公众舆论 / 特别两极分化时，/ 正如它曾经 / 在结束之后 / 佛朗哥政权的，/ 君主可以超越 / &quot;纯粹的&quot;政治 / 并&quot;体现&quot; / 国家团结的精神。</p>\n<h3>标准译文 · 第2段</h3>\n<p>西班牙案例为君主制提供了正反两方面的论据。当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越&quot;纯粹的&quot;政治并&quot;体现&quot;国家团结的精神。</p>\n<h3>完整原文 · 第3段</h3>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state. And so, the Middle East excepted, Europe is the most monarch-infested region in the world, with 10 kingdoms (not counting Vatican city and Andorra). But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<h3>意群划分 · 第3段</h3>\n<p>It is this apparent transcendence / of politics / that explains / monarchs&#39; continuing popularity / as heads of state.</p>\n<p>And so, / the Middle East excepted, / Europe is / the most monarch-infested region / in the world, / with 10 kingdoms / (not counting Vatican city and Andorra).</p>\n<p>But unlike / their absolutist counterparts / in the Gulf and Asia, / most royal families / have survived / because they allow voters / to avoid the difficult search / for a non-controversial / but respected public figure.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>正是这种明显的超越性 / 对政治的 / 解释了 / 君主持续的受欢迎程度 / 作为国家元首。</p>\n<p>因此，/ 除了中东，/ 欧洲是 / 君主最多的地区 / 在世界上，/ 有10个王国 / （不算梵蒂冈城和安道尔）。</p>\n<p>但不像 / 他们的专制主义对应者 / 在海湾地区和亚洲，/ 大多数皇室家族 / 得以存续 / 因为他们让选民 / 避免了困难的寻找 / 一个无争议的 / 但受尊敬的公众人物。</p>\n<h3>标准译文 · 第3段</h3>\n<p>正是这种对政治的明显超越性解释了君主作为国家元首持续受欢迎的原因。因此，除中东外，欧洲是世界上君主最多的地区，有10个王国（不算梵蒂冈城和安道尔）。但与海湾地区和亚洲的专制君主不同，大多数皇室家族得以存续是因为他们让选民避免了寻找一个无争议但受尊敬的公众人物的困难。</p>\n<h3>完整原文 · 第4段</h3>\n<p>Even so, kings and queens undoubtedly have a downside. Symbolic of national unity as they claim to be, their very history – and sometimes the way they behave today – embodies outdated and indefensible privileges and inequalities. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Even so, / kings and queens / undoubtedly have / a downside.</p>\n<p>Symbolic of national unity / as they claim to be, / their very history – / and sometimes / the way they behave today – / embodies / outdated and indefensible / privileges and inequalities.</p>\n<p>At a time / when Thomas Piketty / and other economists / are warning / of rising inequality / and the increasing power / of inherited wealth, / it is bizarre / that wealthy aristocratic families / should still be / the symbolic heart / of modern democratic states.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>即便如此，/ 国王和女王 / 无疑有 / 缺点。</p>\n<p>象征国家团结 / 正如他们声称的那样，/ 他们的历史本身 – / 有时 / 他们今天的行为方式 – / 体现了 / 过时且站不住脚的 / 特权和不平等。</p>\n<p>在这样一个时代 / 当托马斯·皮凯蒂 / 和其他经济学家 / 正在警告 / 日益加剧的不平等 / 和不断增强的权力 / 继承财富的，/ 这很奇怪 / 富有的贵族家庭 / 仍然应该是 / 象征性的核心 / 现代民主国家的。</p>\n<h3>标准译文 · 第4段</h3>\n<p>即便如此，国王和女王无疑有其缺点。虽然他们声称象征国家团结，但他们的历史本身——有时还包括他们今天的行为方式——体现了过时且站不住脚的特权和不平等。在托马斯·皮凯蒂和其他经济学家警告不平等日益加剧和继承财富权力不断增强的时代，富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。</p>\n<h3>完整原文 · 第5段</h3>\n<p>The most successful monarchies strive to abandon or hide their old aristocratic ways. Princes and princesses have day-jobs and ride bicycles, not horses (or helicopters). Even so, these are wealthy families who party with the international 1%, and media intrusiveness makes it increasingly difficult to maintain the right image.</p>\n<h3>意群划分 · 第5段</h3>\n<p>The most successful monarchies / strive to abandon / or hide / their old aristocratic ways.</p>\n<p>Princes and princesses / have day-jobs / and ride bicycles, / not horses / (or helicopters).</p>\n<p>Even so, / these are wealthy families / who party / with the international 1%, / and media intrusiveness / makes it increasingly difficult / to maintain / the right image.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>最成功的君主制 / 努力放弃 / 或隐藏 / 他们旧的贵族方式。</p>\n<p>王子和公主们 / 有日常工作 / 并骑自行车，/ 而不是马 / （或直升机）。</p>\n<p>即便如此，/ 这些是富有的家庭 / 他们聚会 / 与国际1%精英，/ 媒体的侵扰 / 使得越来越困难 / 维持 / 正确的形象。</p>\n<h3>标准译文 · 第5段</h3>\n<p>最成功的君主制努力放弃或隐藏他们旧的贵族方式。王子和公主们有日常工作，骑自行车而不是马（或直升机）。即便如此，这些富有的家庭仍与国际1%精英聚会，媒体的侵扰使得维持正确的形象越来越困难。</p>\n<h3>完整原文 · 第6段</h3>\n<p>While Europe&#39;s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<h3>意群划分 · 第6段</h3>\n<p>While Europe&#39;s monarchies / will no doubt / be smart enough / to survive / for some time to come, / it is the British royals / who have most to fear / from the Spanish example.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>虽然欧洲的君主制 / 毫无疑问 / 会足够聪明 / 存续下去 / 在未来一段时间，/ 正是英国皇室 / 最应该担心 / 从西班牙的例子。</p>\n<h3>标准译文 · 第6段</h3>\n<p>虽然欧洲的君主制毫无疑问会足够聪明以在未来一段时间内存续下去，但英国皇室最应该从西班牙的例子中感到担忧。</p>\n<h3>完整原文 · 第7段</h3>\n<p>It is only the Queen who has preserved the monarchy&#39;s reputation with her rather ordinary (if well-heeled) granny style. The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world. He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state. Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy&#39;s worst enemies.</p>\n<h3>意群划分 · 第7段</h3>\n<p>It is only the Queen / who has preserved / the monarchy&#39;s reputation / with her rather ordinary / (if well-heeled) / granny style.</p>\n<p>The danger will come / with Charles, / who has both / an expensive taste of lifestyle / and a pretty hierarchical view / of the world.</p>\n<p>He has failed to understand / that monarchies / have largely survived / because they provide a service – / as non-controversial / and non-political / heads of state.</p>\n<p>Charles ought to know / that as English history shows, / it is kings, / not republicans, / who are the monarchy&#39;s / worst enemies.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>只有女王 / 保持了 / 君主制的声誉 / 以她相当普通的 / （尽管富有的）/ 老奶奶风格。</p>\n<p>危险将到来 / 随着查尔斯，/ 他既有 / 昂贵的生活品味 / 又有相当等级化的观点 / 对世界的。</p>\n<p>他未能理解 / 君主制 / 大部分得以存续 / 因为他们提供一种服务 – / 作为无争议的 / 和非政治的 / 国家元首。</p>\n<p>查尔斯应该知道 / 正如英国历史所显示的，/ 是国王们，/ 而非共和派，/ 才是君主制的 / 最大敌人。</p>\n<h3>标准译文 · 第7段</h3>\n<p>只有女王以她相当普通（尽管富有）的老奶奶风格保持了君主制的声誉。危险将随着查尔斯而来，他既有昂贵的生活品味，又对世界持有相当等级化的观点。他未能理解君主制大部分得以存续是因为他们提供一种服务——作为无争议和非政治的国家元首。查尔斯应该知道，正如英国历史所显示的，是国王们而非共和派才是君主制的最大敌人。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n<h3>句子逻辑梳理（选修，按照自身语法基础而定)</h3>\n<p><strong>第1段</strong></p>\n<p>Of all the changes：(that have taken place：(in English-language newspapers：(during the past quarter-century))) → perhaps the most far-reaching → has been → the inexorable decline：(in the scope and seriousness：(of their arts coverage))</p>\n<p><strong>第2段</strong></p>\n<p>It → is difficult：(to the point of impossibility) → for the average reader：(under the age of forty) → to imagine → a time：(when high-quality arts )).</p>\n<p>He → was knighted：(in 1967)，+ the first music critic：(to be so honored).</p>\n<p>Yet + only one of his books → is now in print，+ and his vast body of writings：(on music) → is unknown：(save to specialists).</p>\n<p><strong>第5段</strong></p>\n<p>Is there any chance：(that Cardus&#39;s criticism → will enjoy a revival)?</p>\n<p>The prospect → seems remote.</p>\n<p>Journalistic tastes → had changed：(long before his death)，+ and postmodern readers → have little use：(for the richly upholstered Vicwardian prose：(in which he specialized)).</p>\n<p>Moreover, the amateur tradition：(in music criticism) → has been：(in headlong retreat).</p>\n<h3>中文版句子逻辑（选修)</h3>\n<p><strong>第1段</strong></p>\n<p>在所有变化中：(这些变化已发生：(在英语报纸中：(在过去25年里))) → 或许最深远的变化 → 一直是 → 不可逆转的下降：(在范围和严肃性：(对其艺术报道))</p>\n<p><strong>第2段</strong></p>\n<p>这 → 很难：(几乎不可能) → 对于普通读者：(40岁以下的) → 去想象 → 一个时代：(当高质量的艺术评论 → 能够被找到 → 在大部分大城市的报纸里)。</p>\n<p>然而 + (相当多的数量：(最重要的选集之一：(评论的)) → 出版：(在20世纪) → 大部分由 → 报纸评论构成)。</p>\n<p>今天读这些书 → 就是惊叹 → 这个事实：(它们博学的内容 → 曾经被认为适合 → 出版：(在大众发行的日报上))。</p>\n<p><strong>第3段</strong></p>\n<p>我们 → 更加遥远了 → 从那些漫无边际的报纸评论：(发表在英国：(在20世纪初到二战前夕之间)，在一个时代：(当新闻纸非常廉价 + 风格化的艺术评论 → 被认为是一种装饰 → 对于这些出版物：(它们所出现的)))。</p>\n<p>在那些遥远的日子里：理所当然：(评论家们：(来自主要报纸的) → 会撰写：(详细且长篇地) → 关于这些事件：(他们所报道的))。</p>\n<p>他们的工作 → 是严肃的事业，+ 甚至那些评论家：(那些不炫耀自身学识的：(比如萧伯纳和欧内斯特·纽曼)) → 是可以信赖的 → 去了解：(他们所做的事)。</p>\n<p>这些人 → 相信：(新闻作为一种使命) + 并且以此为荣 → 被发表：(在日报上)。</p>\n<p>&quot;如此少的作家：(有足够智慧或文学天赋 → 能在新闻界立足)，&quot; → 纽曼写道，&quot;以至于我忍不住将&#39;新闻&#39;定义为：(&#39;一种蔑称：(由不被阅读的作家使用 → 对被广泛阅读的作家)&#39;)&quot;。</p>\n<p><strong>第4段</strong></p>\n<p>不幸的是，// 这些评论家 → 几乎被遗忘了。</p>\n<p>内维尔·卡达斯：(为《曼彻斯特卫报》撰稿：(自1917年 + 直到去世前不久：(在1975年))) → 现在仅仅被人们所知：(作为一名散文作家：(关于板球比赛的))。</p>\n<p>尽管在他的一生中，// 他 → 也曾是：(英国最杰出的古典音乐评论家之一)，+ 并且是一位文体家：(广受赞誉的：(以至于他的《自传》（1947年）→ 成为了一本畅销书))。</p>\n<p>他 → 被封为爵士：(于1967年)，+ 第一位音乐评论家：(获此殊荣的)。</p>\n<p>然而 + 现在他只有一本书 → 仍在印刷中，+ 他大量的著作：(关于音乐的) → 不为人所知：(除了专业人士以外)。</p>\n<p><strong>第5段</strong></p>\n<p>是否有任何可能性：(卡达斯的评论 → 会重新受到青睐)？</p>\n<p>这个前景 → 看起来渺茫。</p>\n<p>新闻品味 → 已经发生了改变：(在他去世前很久)，+ 并且后现代的读者 → 几乎不需要：(他所擅长的这种丰富华丽的维多利亚爱德华风格的散文)。</p>\n<p>此外，业余传统：(在音乐评论中) → 一直处于：(急速的衰退中)。</p>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)</h2>\n<h3>第1段</h3>\n<p>King Juan Carlos of Spain → once insisted：(&quot;kings don&#39;t abdicate → they die in their sleep&quot;).</p>\n<p>But embarrassing scandals + the popularity：(of the republican left)：(in the recent Euro-elections) → have forced him → to eat his words + stand down.</p>\n<p>So → does the Spanish crisis suggest：(that monarchy is seeing → its last days)?</p>\n<p>Does that mean → the writing is on the wall：(for all European royals)：(with their magnificent uniforms + majestic lifestyles)?</p>\n<h3>第2段</h3>\n<p>The Spanish case → provides arguments：(both for and against monarchy).</p>\n<p>When public opinion → is particularly polarised：(as it was：(following the end：(of the Franco regime))) → monarchs can rise above：(&quot;mere&quot; politics) + &quot;embody&quot;：(a spirit of national unity).</p>\n<h3>第3段</h3>\n<p>It is this apparent transcendence：(of politics) → that explains → monarchs&#39; continuing popularity：(as heads of state).</p>\n<p>And so：(the Middle East excepted) → Europe is → the most monarch-infested region：(in the world)：(with 10 kingdoms：(not counting Vatican city and Andorra)).</p>\n<p>But unlike：(their absolutist counterparts：(in the Gulf and Asia)) → most royal families → have survived：(because they allow voters → to avoid the difficult search：(for a non-controversial but respected public figure)).</p>\n<h3>第4段</h3>\n<p>Even so → kings and queens → undoubtedly have → a downside.</p>\n<p>Symbolic of national unity：(as they claim to be) // their very history – and sometimes：(the way they behave today) – → embodies：(outdated and indefensible：(privileges and inequalities)).</p>\n<p>At a time：(when Thomas Piketty + other economists → are warning：(of rising inequality + the increasing power：(of inherited wealth))) → it is bizarre：(that wealthy aristocratic families → should still be → the symbolic heart：(of modern democratic states)).</p>\n<h3>第5段</h3>\n<p>The most successful monarchies → strive to abandon or hide：(their old aristocratic ways).</p>\n<p>Princes and princesses → have day-jobs + ride bicycles // not horses (or helicopters).</p>\n<p>Even so → these are wealthy families：(who party：(with the international 1%)) + media intrusiveness → makes it increasingly difficult → to maintain：(the right image).</p>\n<h3>第6段</h3>\n<p>While Europe&#39;s monarchies → will no doubt → be smart enough → to survive：(for some time to come) // it is the British royals → who have most to fear：(from the Spanish example).</p>\n<h3>第7段</h3>\n<p>It is only the Queen → who has preserved → the monarchy&#39;s reputation：(with her rather ordinary (if well-heeled) granny style).</p>\n<p>The danger will come：(with Charles)：(who has both → an expensive taste of lifestyle + a pretty hierarchical view：(of the world)).</p>\n<p>He has failed to understand：(that monarchies → have largely survived：(because they provide a service – as non-controversial + non-political heads of state)).</p>\n<p>Charles ought to know：(that as English history shows → it is kings // not republicans → who are the monarchy&#39;s worst enemies).</p>\n<h2>中文版句子逻辑（选修)</h2>\n<h3>第1段</h3>\n<p>西班牙国王胡安·卡洛斯 → 曾经坚持：(&quot;国王不会退位 → 他们在睡梦中死去&quot;)。</p>\n<p>但令人尴尬的丑闻 + 受欢迎程度：(共和派左翼的)：(在最近的欧洲选举中) → 迫使他 → 食言 + 退位。</p>\n<p>那么 → 西班牙危机是否暗示：(君主制正在经历 → 它的最后时光)？</p>\n<p>这是否意味着 → 大限将至：(对所有欧洲皇室来说)：(带着他们华丽的制服 + 威严的生活方式)？</p>\n<h3>第2段</h3>\n<p>西班牙案例 → 提供了论据：(既支持又反对君主制)。</p>\n<p>当公众舆论 → 特别两极分化时：(正如它曾经：(在结束之后：(佛朗哥政权的))) → 君主可以超越：(&quot;纯粹的&quot;政治) + &quot;体现&quot;：(国家团结的精神)。</p>\n<h3>第3段</h3>\n<p>正是这种明显的超越性：(对政治的) → 解释了 → 君主持续的受欢迎程度：(作为国家元首)。</p>\n<p>因此：(除了中东) → 欧洲是 → 君主最多的地区：(在世界上)：(有10个王国：(不算梵蒂冈城和安道尔))。</p>\n<p>但不像：(他们的专制主义对应者：(在海湾地区和亚洲)) → 大多数皇室家族 → 得以存续：(因为他们让选民 → 避免了困难的寻找：(一个无争议但受尊敬的公众人物))。</p>\n<h3>第4段</h3>\n<p>即便如此 → 国王和女王 → 无疑有 → 缺点。</p>\n<p>象征国家团结：(正如他们声称的那样) // 他们的历史本身 – 有时：(他们今天的行为方式) – → 体现了：(过时且站不住脚的：(特权和不平等))。</p>\n<p>在这样一个时代：(当托马斯·皮凯蒂 + 其他经济学家 → 正在警告：(日益加剧的不平等 + 不断增强的权力：(继承财富的))) → 这很奇怪：(富有的贵族家庭 → 仍然应该是 → 象征性的核心：(现代民主国家的))。</p>\n<h3>第5段</h3>\n<p>最成功的君主制 → 努力放弃或隐藏：(他们旧的贵族方式)。</p>\n<p>王子和公主们 → 有日常工作 + 骑自行车 // 而不是马（或直升机）。</p>\n<p>即便如此 → 这些是富有的家庭：(他们聚会：(与国际1%精英)) + 媒体的侵扰 → 使得越来越困难 → 维持：(正确的形象)。</p>\n<h3>第6段</h3>\n<p>虽然欧洲的君主制 → 毫无疑问 → 会足够聪明 → 存续下去：(在未来一段时间) // 正是英国皇室 → 最应该担心：(从西班牙的例子)。</p>\n<h3>第7段</h3>\n<p>只有女王 → 保持了 → 君主制的声誉：(以她相当普通的（尽管富有的）老奶奶风格)。</p>\n<p>危险将到来：(随着查尔斯)：(他既有 → 昂贵的生活品味 + 相当等级化的观点：(对世界的))。</p>\n<p>他未能理解：(君主制 → 大部分得以存续：(因为他们提供一种服务 – 作为无争议的 + 非政治的国家元首))。</p>\n<p>查尔斯应该知道：(正如英国历史所显示的 → 是国王们 // 而非共和派 → 才是君主制的最大敌人)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并起来；</li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；</li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。</li>\n</ol>\n<h2>第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>But embarrassing scandals / and the popularity / of the republican left / in the recent Euro-elections / have forced him / to eat his words / and stand down.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但令人尴尬的丑闻 / 和受欢迎程度 / 共和派左翼的 / 在最近的欧洲选举中 / 迫使他 / 食言 / 并退位。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把两件带来压力的事情分别合在一起。</p>\n<blockquote>\n<p>令人尴尬的丑闻</p>\n</blockquote>\n<blockquote>\n<p>共和派左翼在最近欧洲选举中的受欢迎程度</p>\n</blockquote>\n<p>再把施加压力及其结果接起来。</p>\n<blockquote>\n<p>迫使他食言并退位</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>但令人尴尬的丑闻，以及共和派左翼在最近欧洲选举中的受欢迎程度，迫使他食言并退位。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>丑闻和共和派左翼的受欢迎程度，迫使他食言并退位。</p>\n</blockquote>\n<p>两项原因并列放在前面。共和派左翼是谁的受欢迎程度、发生在哪次选举，都收在第二项原因里；后面紧接被迫做出的两个动作。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但令人尴尬的丑闻和共和派左翼在最近欧洲选举中的受欢迎程度，迫使他食言并退位。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>两项原因较长，但仍共同支配“迫使”，保留并列关系，不改成卡洛斯自愿退位。</p>\n<p>“食言”照应前一句国王不会退位的断言；“并退位”交代最终动作，不能只译成改变想法。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但令人尴尬的丑闻和共和派左翼在最近欧洲选举中的受欢迎程度迫使他食言并退位。</p>\n</blockquote>\n<h2>第2段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>When public opinion / is particularly polarised, / as it was / following the end / of the Franco regime, / monarchs can rise above / &quot;mere&quot; politics / and &quot;embody&quot; / a spirit of national unity.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>当公众舆论 / 特别两极分化时，/ 正如它曾经 / 在结束之后 / 佛朗哥政权的，/ 君主可以超越 / &quot;纯粹的&quot;政治 / 并&quot;体现&quot; / 国家团结的精神。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把条件和说明条件的历史背景合起来。</p>\n<blockquote>\n<p>当公众舆论特别两极分化时</p>\n</blockquote>\n<blockquote>\n<p>就像佛朗哥政权结束后那样</p>\n</blockquote>\n<p>再把君主可以发挥的两个作用并列起来。</p>\n<blockquote>\n<p>君主可以超越“纯粹的”政治，并“体现”国家团结的精神</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越“纯粹的”政治，并“体现”国家团结的精神。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>君主可以超越政治并体现国家团结的精神。</p>\n</blockquote>\n<p>先放公众舆论分裂这一条件，历史例子紧随条件，避免读成君主在政权结束之后才首次具备这种作用。后面再说君主能做什么。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越“纯粹的”政治并“体现”国家团结的精神。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>“可以”保留作用的可能性，不能写成君主一定能团结所有人。</p>\n<p>保留“纯粹的”和“体现”的引号，让原文对这些说法的距离感不消失。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>当公众舆论特别两极分化时，就像佛朗哥政权结束后那样，君主可以超越&quot;纯粹的&quot;政治并&quot;体现&quot;国家团结的精神。</p>\n</blockquote>\n<h2>第3段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>But unlike / their absolutist counterparts / in the Gulf and Asia, / most royal families / have survived / because they allow voters / to avoid the difficult search / for a non-controversial / but respected public figure.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但不像 / 他们的专制主义对应者 / 在海湾地区和亚洲，/ 大多数皇室家族 / 得以存续 / 因为他们让选民 / 避免了困难的寻找 / 一个无争议的 / 但受尊敬的公众人物。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把对照的另一方收在一起。</p>\n<blockquote>\n<p>与海湾地区和亚洲的专制君主不同</p>\n</blockquote>\n<p>再把寻找的对象补全，接到选民获得的便利后面。</p>\n<blockquote>\n<p>让选民避免寻找一个无争议但受尊敬的公众人物的困难</p>\n</blockquote>\n<p>把存续结果与这项原因相连。</p>\n<blockquote>\n<p>大多数皇室家族得以存续，是因为他们让选民避免了这项困难</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>但与海湾地区和亚洲的专制君主不同，大多数皇室家族得以存续，是因为他们让选民避免了寻找一个无争议但受尊敬的公众人物的困难。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>大多数皇室家族得以存续，因为他们让选民免去寻找的困难。</p>\n</blockquote>\n<p>比较对象放句首，接着说谁得以存续，再给存续原因。寻找的完整对象放到“寻找”后面，避免把无争议但受尊敬误接成选民的特征。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但与海湾地区和亚洲的专制君主不同，大多数皇室家族得以存续是因为他们让选民避免了寻找一个无争议但受尊敬的公众人物的困难。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>保留“大多数”，不把欧洲所有王室都写进这一概括。</p>\n<p>“得以存续”交代结果，“是因为”接具体原因；受尊敬与无争议两项条件都不能漏。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但与海湾地区和亚洲的专制君主不同，大多数皇室家族得以存续是因为他们让选民避免了寻找一个无争议但受尊敬的公众人物的困难。</p>\n</blockquote>\n<h2>第4段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>At a time / when Thomas Piketty / and other economists / are warning / of rising inequality / and the increasing power / of inherited wealth, / it is bizarre / that wealthy aristocratic families / should still be / the symbolic heart / of modern democratic states.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在这样一个时代 / 当托马斯·皮凯蒂 / 和其他经济学家 / 正在警告 / 日益加剧的不平等 / 和不断增强的权力 / 继承财富的，/ 这很奇怪 / 富有的贵族家庭 / 仍然应该是 / 象征性的核心 / 现代民主国家的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把时代中的两项变化合成并列信息。</p>\n<blockquote>\n<p>不平等日益加剧，继承财富的权力不断增强</p>\n</blockquote>\n<p>再把发出警告的人与这两项变化接起来。</p>\n<blockquote>\n<p>托马斯·皮凯蒂和其他经济学家正在警告这些变化</p>\n</blockquote>\n<p>最后把被评为奇怪的事情合完整。</p>\n<blockquote>\n<p>富有的贵族家庭仍然是现代民主国家的象征性核心</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>在托马斯·皮凯蒂和其他经济学家警告不平等日益加剧和继承财富权力不断增强的时代，富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。</p>\n</blockquote>\n<p>时代背景放前面，让后面的事情在这个背景下显出反差。先说完整的怪事，再在句末落下评价，不把经济学家的警告本身当成奇怪的对象。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>在经济学家警告不平等日益加剧、继承财富权力不断增强的时代，富有的贵族家庭仍是现代民主国家的象征性核心，这很奇怪。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>参考译文恢复经济学家的具体姓名和“其他经济学家”，不让中间整理时的简写丢掉信息。</p>\n<p>“仍然”保留新旧制度的反差；“象征性核心”限制了角色，不改成实际统治全部民主国家。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>在托马斯·皮凯蒂和其他经济学家警告不平等日益加剧和继承财富权力不断增强的时代，富有的贵族家庭仍然是现代民主国家的象征性核心，这很奇怪。</p>\n</blockquote>\n<h2>第5段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Even so, these are wealthy families who party with the international 1%, and media intrusiveness makes it increasingly difficult to maintain the right image.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Even so, / these are wealthy families / who party / with the international 1%, / and media intrusiveness / makes it increasingly difficult / to maintain / the right image.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>即便如此，/ 这些是富有的家庭 / 他们聚会 / 与国际1%精英，/ 媒体的侵扰 / 使得越来越困难 / 维持 / 正确的形象。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把这些家庭仍在做的事合起来。</p>\n<blockquote>\n<p>这些富有的家庭仍与国际1%精英聚会</p>\n</blockquote>\n<p>再把媒体影响和受影响的事情接在一起。</p>\n<blockquote>\n<p>媒体的侵扰使得维持正确形象越来越困难</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>即便如此，这些富有的家庭仍与国际1%精英聚会，媒体的侵扰使得维持正确形象越来越困难。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这些家庭仍与精英聚会，媒体的侵扰使维持形象越来越困难。</p>\n</blockquote>\n<p>先承接前文的日常工作与自行车形象，用“即便如此”转回来，再说家庭交往的现实。后半句将媒体放在影响来源位置，把维持形象的难处完整放在后面。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>即便如此，这些富有的家庭仍与国际1%精英聚会，而媒体的侵扰使维持正确形象越来越困难。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>“即便如此”保留外观变化与现实财富之间的转折，不译成王室已经完全普通化。</p>\n<p>“越来越困难”表示难度增加，不扩大成完全不可能；两件事实相接，也不添加媒体导致富有的因果。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>即便如此，这些富有的家庭仍与国际1%精英聚会，媒体的侵扰使得维持正确的形象越来越困难。</p>\n</blockquote>\n<h2>第7段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>He has failed to understand / that monarchies / have largely survived / because they provide a service – / as non-controversial / and non-political / heads of state.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他未能理解 / 君主制 / 大部分得以存续 / 因为他们提供一种服务 – / 作为无争议的 / 和非政治的 / 国家元首。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把他未能理解的存续原因合起来。</p>\n<blockquote>\n<p>君主制大部分得以存续，是因为他们提供一种服务</p>\n</blockquote>\n<p>把服务的具体内容接在后面。</p>\n<blockquote>\n<p>作为无争议和非政治的国家元首</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>他未能理解，君主制大部分得以存续，是因为他们提供一种服务——作为无争议和非政治的国家元首。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>他未能理解君主制得以存续的原因。</p>\n</blockquote>\n<p>先说他没有理解，再把他不理解的内容完整展开；服务是什么放在破折号之后，紧接服务一词。这样不会把无争议和非政治误读成所有王室私人行为的特点。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他未能理解，君主制大部分得以存续，是因为他们作为无争议和非政治的国家元首提供服务。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>恢复破折号，把国家元首职责作为对服务的说明，句子层次更清楚。</p>\n<p>保留“大部分”及未能理解的否定，不改成君主只靠唯一原因存续，也不改成查尔斯已经理解。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>他未能理解君主制大部分得以存续是因为他们提供一种服务——作为无争议和非政治的国家元首。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。</li>\n</ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li>**定位比对：**检查选项有没有准确改写局部原文；</li>\n<li>**写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n<li>**全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>在本篇文章里，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。</p>\n<h2>25题</h2>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<p>下面哪一个是本文最佳标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Carlos, Glory and Disgrace Combined</strong></p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n<p>B. <strong>Charles, Anxious to Succeed to the Throne</strong></p>\n<p>查尔斯：急于继承王位</p>\n<p>C. <strong>Carlos, a Lesson for All European Monarchs</strong></p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n<p>D. <strong>Charles, Slow to React to the Coming Threats</strong></p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在说什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>写卡洛斯在丑闻和共和派声势上升后退位，并追问西班牙危机是否预示君主制衰亡</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明西班牙案例既能支持也能反对君主制，君主在公众分裂时可代表国家团结</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释欧洲王室仍能担任国家元首，是因为选民不必另找一个少争议且受尊敬的人物</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写君主制的缺点：历史特权、不平等与现代民主国家的象征位置发生冲突</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写成功王室努力淡化旧贵族形象，但财富和媒体介入使合适形象越来越难维持</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把西班牙案例转向英国，指出英国王室最应从中感到警惕</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>说明女王维持了声誉，而查尔斯不理解现代君主的服务角色；王室内部人物可能成为最大麻烦</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<h3>A. Carlos, Glory and Disgrace Combined</h3>\n<p>卡洛斯：荣耀与耻辱并存</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用卡洛斯因丑闻退位这一失去体面的例子开篇，提出同一国王为何会同时留下荣耀与耻辱。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认卡洛斯的国家团结作用曾有实际价值，使个人功绩成为评价他时必须保留的一面。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释这些已有功绩为何在退位之后仍能保住他的一部分声望，让荣耀没有随丑闻一起消失。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写卡洛斯的个人失误怎样损伤已有功绩，使公众无法只凭旧日荣耀原谅当前耻辱。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写王室如何在丑闻中突出卡洛斯的贡献、淡化负面消息，努力维持仍有荣耀的公共形象。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把卡洛斯功过并存的遭遇转给其他有功绩的君主作提醒：旧日荣耀也未必能抵消失德的代价。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>落回卡洛斯自身的选择，说明让他的荣耀最终与耻辱并存的决定性问题来自本人。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>A抓住了开头的难堪退位，却把整篇任务定成评价卡洛斯个人的荣耀与耻辱。若按表中路线写，第二、三段必须交代属于他的功绩及功绩为何仍有效；实际两段用的是一般的君主作用、欧洲元首人选，未铺开他的个人功绩。</p>\n<p>第四、五段讨论特权、不平等与王室形象，也没有追踪卡洛斯怎样把荣耀消耗掉。第六段明确换到英国，第七段以查尔斯及国王自身的制度危险收束。人物转换服务于一堂欧洲共同的课，结尾没有回来衡量卡洛斯的功过比例。</p>\n<p>判断：</p>\n<p><strong>A 不保留。</strong></p>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<h3>B. Charles, Anxious to Succeed to the Throne</h3>\n<p>查尔斯：急于继承王位</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>查尔斯：急于继承王位</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用查尔斯等待继位时急于接掌王位、因心急而处置失当的具体事件开篇，提出他的继位急切。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认查尔斯急于承担王位职责也能带来提前投入事务、推动继位准备的积极作用。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释现有继承安排和长期等待为何使这份继位期待持续存在，迟迟得不到消解。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写查尔斯的急切怎样干扰职责边界、给王室带来不必要的继位摩擦。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写查尔斯及身边人如何淡化急于登基的印象，维持耐心、负责的继承人形象。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把查尔斯心急引起的失误转给其他正在等待接班的人作提醒，说明急于上位会怎样损害准备。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>收束到查尔斯自己的继位欲望，说明麻烦源于他内心的急切，而不只来自外部等待。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>B的完整意思包含查尔斯、急切态度和继承王位三个部分。实际文章只到最后一段才集中讨论查尔斯，报告的是品味、等级观念和未理解角色，没有急于登基的心理、等待过程或失当催促。</p>\n<p>若B能统领全文，中间承认好处、解释延续、转写麻烦的段落都应围绕这份急切展开。实际第二至五段分别解释王室的团结功能、人选便利、特权矛盾与形象困难，讨论范围远大于查尔斯的个人继位愿望。首段西班牙事件和尾段内部威胁也没有组成心急接班的故事。</p>\n<p>判断：</p>\n<p><strong>B 不保留。</strong></p>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<h3>C. Carlos, a Lesson for All European Monarchs</h3>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用卡洛斯在丑闻和共和派压力中退位的案例，提出欧洲其他君主也需要面对的生存警告。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认王室在社会分裂时代表国家团结的用途，使卡洛斯教训包含如何发挥作用而不只是宣布终结。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释少争议且受尊敬的元首角色为何让欧洲王室继续存在，指出各国君主应守住的存续条件。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写贵族特权、财富不平等与现代民主的冲突，说明卡洛斯事件所暴露的风险具有制度共性。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写欧洲王室用普通工作与日常形象淡化贵族色彩，同时说明财富和媒体让维持这种外观愈发困难。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把西班牙的退位案例明确转成对英国王室的提醒，使一位国王的遭遇成为其他欧洲君主应学的一课。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>用查尔斯未理解元首服务角色说明内部风险，收束到欧洲王室成员本身最可能破坏制度的教训。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>C同时规定案例和范围：卡洛斯提供教训，欧洲君主是需要吸取教训的人。第一段确实以退位发问；第二、三段解释王室为何仍有用途、何以存续，给出教训的正面条件。第四、五段接着揭开特权与形象的困难，给出条件受到威胁的原因。</p>\n<p>第六段用 <code>the Spanish example</code> 将案例直接推向英国，第七段说明女王怎样维持声誉、查尔斯为何带来危险，再用国王自身是最大敌人收束。标题的教训涵盖这条完整推进，并没有把文章读成欧洲王室马上全部终结，也没有把共同问题缩成个人传记。</p>\n<p>判断：</p>\n<p><strong>C 保留。</strong></p>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<h3>D. Charles, Slow to React to the Coming Threats</h3>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果全文主旨真的是：</p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n<p>那文章7段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>用查尔斯在外界警报已经出现后仍未及时调整的事件开篇，具体展示他对将至威胁反应迟缓。</td>\n<td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n<td>2</td>\n<td>承认谨慎反应有避免草率行动、维持王室稳定的用途，为查尔斯的迟缓呈现可以理解的一面。</td>\n<td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释既有惯例和保护性环境如何让查尔斯延续等待反应的做法，未能及时摆脱迟缓状态。</td>\n<td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n<td>4</td>\n<td>转写威胁临近时继续拖延会怎样扩大损失，使原本的谨慎变成王室的负担。</td>\n<td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n<td>5</td>\n<td>写查尔斯身边人如何把迟缓包装成从容，让公众暂时看不出他尚未应对迫近危险。</td>\n<td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n<td>6</td>\n<td>把查尔斯延误应对的案例转给其他王室作提醒，要求他们在类似威胁逼近前及早调整。</td>\n<td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n<td>7</td>\n<td>指出迟缓的根源在查尔斯自身的观念与决策习惯，收束到内部反应能力比外部威胁更成问题。</td>\n<td>最后说问题其实来自内部</td>\n</tr>\n</tbody></table></div>\n<p>D比B更接近结尾的警告气氛，但它仍要求一条特定关系：威胁正在迫近，查尔斯本有反应机会，却反应迟缓。文章没有交代这样一个时序，只描述他的既有特征和角色认识缺口；不理解职责不能直接改成面对威胁时反应慢。</p>\n<p>范围也不相同。前六段主要讨论欧洲君主制的普遍用途和矛盾，只有末段以查尔斯落地。若按D的假想路线，第二、三段应解释谨慎的好处与迟缓为何延续，第五段应写反应迟缓的形象包装；实际内容均未围绕查尔斯的应对速度推进。</p>\n<p>判断：</p>\n<p><strong>D 不保留。</strong></p>\n<h3>25题结论</h3>\n<p><strong>25. C. Carlos, a Lesson for All European Monarchs</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Carlos, a Lesson for All European Monarchs / 卡洛斯：给所有欧洲君主的一课</strong></p>\n<h2>21题</h2>\n<blockquote>\n<p>According to the first two paragraphs, King Juan Carlos of Spain ______.<br>根据前两段，西班牙国王胡安·卡洛斯怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干用 <code>the first two paragraphs</code> 限定前两段，又点名 <code>King Juan Carlos of Spain</code>。咱们要找关于卡洛斯本人的事实，不能把君主制的一般作用或欧洲王室的整体处境直接安到他身上。第一段先写他过去关于退位的断言，再写丑闻和选举形势迫使他退位；第二段转入制度的正反作用，没有继续介绍他的个人声望史。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n<p>首句给先前断言，次句给压力与结果；第二段的制度功能要与个人事实区分。</p>\n<h3>A. used to enjoy high public support</h3>\n<blockquote>\n<p>过去享有很高的公众支持</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A。当时第二段的部分词语被遮挡，但君主可超越政治、代表国家团结这层作用能读出来，因此没有立即否定“过去得到支持”；读完全文后，做题模式以主旨交叉验证排除A，最终选择D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>A把第二段君主制在社会分裂时可能发挥的作用，转写成卡洛斯个人过去获得过很高的公众支持。原文给出了容易让人联想“受到拥护”的材料，但“这个人＋过去＋很高支持”三个限制没有同时出现。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯过去享有很高的公众支持。</p>\n</blockquote>\n<p>先对照 <code>public support</code> 和第二段的 <code>public opinion</code>、<code>national unity</code>。这些词都与公众和社会有关，所以A有一个看起来很像的落点；但 <code>public opinion</code> 描述的是舆论分裂，不能直接当作对卡洛斯的支持。</p>\n<p>出处说，当公众意见两极分化时，君主可以超越日常政治、体现国家团结。这里的 <code>monarchs can</code> 是君主可能发挥的制度作用；佛朗哥政权结束后，是说明舆论分裂的历史背景。</p>\n<p>A把主体缩成卡洛斯本人，把时间写成 <code>used to</code>，还增加 <code>high</code> 这个程度。一个职位能够代表国家团结，不能据此断言某位任职者过去个人支持很高。第一段的“受欢迎”属于共和派左翼，主体同样不能移给国王。</p>\n<p>A需要补入一段原文没有报告的个人声望事实。“君主能够起团结作用”可以解释为什么有人支持这一制度，却没有完成“卡洛斯过去广受公众拥护”这个命题。</p>\n<h4>写作视角法</h4>\n<p>原文第1、2段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>卡洛斯在压力中退位，引出君主制是否衰落的问题；随后作者承认君主在社会分裂时可能发挥团结作用。</p>\n</blockquote>\n<p>作者从一位国王的退位转到制度的两面性。后文接着解释欧洲王室为什么能够存续、又面临哪些矛盾，卡洛斯的个人支持变化没有成为这条叙述线的起点。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Juan Carlos had once enjoyed strong public support, but scandals and the rise of the republican left forced him to step down.</p>\n<p>胡安·卡洛斯曾得到公众的强烈支持，但丑闻和共和派左翼的崛起迫使他退位。</p>\n</blockquote>\n<p>这段假设只添入A必需的“曾享有高支持”，后面的退位可以照旧。这样文章才建立了“过去受拥护—如今难堪退位”的个人声望反差。实际第一句讲他不肯退位的断言，第二段讲制度作用，都不能填补这条缺少的前提。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>used to enjoy high public support<br>过去享有很高的公众支持</p>\n</blockquote>\n<p>A与全文有公众如何看待王室这一话题联系，但它给出的回答落在一段个人支持史上。主旨要求把卡洛斯当作警示案例，并不自动提供 <code>used to</code> 和 <code>high</code> 的事实。</p>\n<p>前两段能确认的是丑闻和政治压力下的退位。A在做题时可以暂留，复盘时却不能继续把“制度可能有用”当作“本人过去高支持”的证据。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. was unpopular among European royals</h3>\n<blockquote>\n<p>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式已分清：<code>popularity</code> 说共和派左翼受欢迎，<code>European royals</code> 是后面被追问前景的对象，没有写欧洲王室不喜欢卡洛斯。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人把同段的 <code>popularity</code> 与 <code>European royals</code> 拼接，让共和派左翼受欢迎、欧洲王室面临风险，变成卡洛斯在王室圈里不受欢迎。相同词出现了，人物间的评价关系却是新添的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在欧洲王室成员中不受欢迎。</p>\n</blockquote>\n<p><code>European royals</code> 能定位到首段末句，<code>unpopular</code> 容易让人联想到前面的 <code>popularity</code>。要把两处分别读清，不能看到这两个词都出现就连成一句。</p>\n<p>第一处写 <code>the popularity of the republican left</code>：得到欢迎的是共和派左翼。这股声势与丑闻一起迫使卡洛斯退位。第二处问所有欧洲王室是否面临末路：王室是可能受到影响的对象。</p>\n<p>B的 <code>among</code> 把欧洲王室放到评价者的位置，声称这一群体不喜欢卡洛斯。原文没有其他君主的评论，也没有他们疏远、反对或支持卡洛斯的行为；问句只关乎他们自己的制度前景。</p>\n<p>从共和派受欢迎跳到卡洛斯不受其他王室欢迎，既换了被评价者，又新造了评价群体。卡洛斯受到政治压力，无法说明欧洲王室对他的好恶。</p>\n<h4>写作视角法</h4>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<p>共和派左翼的声势参与构成退位压力，作者随后担心这一危机会不会波及所有欧洲王室。</p>\n</blockquote>\n<p>段落扩大的是危机范围：由西班牙一位国王，扩展到其他君主能否继续存在。后面承接制度利弊，所以“其他王室”承担被警示对象的作用。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Juan Carlos had become unpopular among his fellow European royals, who viewed him with disapproval.</p>\n<p>胡安·卡洛斯已不受其他欧洲王室成员欢迎，他们对他抱有不满。</p>\n</blockquote>\n<p>假设写法必须让其他王室表达对卡洛斯的态度，B才有出处。实际末句提出的是王室们自身的前途问题。把“别人可能也受影响”读成“别人不喜欢他”，文章的关系就从制度风险变成人际评价。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>was unpopular among European royals<br>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p>标题中 <code>for All European Monarchs</code> 指这堂课讲给谁听；B的 <code>among European royals</code> 把同一群人变成评价卡洛斯的人。群体相同，关系却不同。</p>\n<p>全篇也找不到其他王室对卡洛斯的好恶。首段起作用的是退位及其警示意义，不能用一个相同的人群名称补出另一件事。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. eased his relationship with his rivals</h3>\n<blockquote>\n<p>缓和了与对手的关系</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。当时虽有词被遮挡，仍能从 <code>forced</code>、<code>stand down</code> 看出共和派声势带来压力；做题模式没有把退位读成对手关系缓和。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>C借用退位和共和派左翼，再补上与对手关系改善的结果。压力下退出确实发生了，但退出之后是否和解，原文没有交代。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯缓和了与对手的关系。</p>\n</blockquote>\n<p><code>rivals</code> 最容易让人联想到首段 <code>republican left</code>；<code>eased his relationship</code> 需要一条关系变得不那么紧张的信息。找到共和派这个对象后，还得继续找这种变化是否出现。</p>\n<p>出处的动作是 <code>have forced him to eat his words and stand down</code>。丑闻和共和派声势共同构成压力，卡洛斯因此收回断言、结束统治。这句话到退位便结束了。</p>\n<p>退位是身份和统治状态的变化，缓和关系是双方相处状态的变化。一个人可以在持续对立中被迫退出，退出本身不保证对手态度改变。C也没有仅仅说向对手让步，它声称关系得到了缓和。</p>\n<p>这里不能从退位再多推一步，补成已经和解。原文支持受到压力后下台，C额外写出双方关系改善这一未报告的结果。</p>\n<h4>写作视角法</h4>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?</p>\n<p>卡洛斯在压力下退位，随后作者连续追问西班牙及欧洲君主制是否面临衰落。</p>\n</blockquote>\n<p>退位之后，作者继续放大危机，没有转向双方关系恢复平静。两句问句保持警告意味，也为后文讨论整个制度作准备。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>After stepping down, Juan Carlos eased his relationship with his republican rivals.</p>\n<p>退位之后，胡安·卡洛斯缓和了与共和派对手的关系。</p>\n</blockquote>\n<p>假设句只补上C要求的关系变化，不必假定退位自愿，也不必添加主动谈判。即便采用这样最小的写法，实际段落仍找不到关系缓和的后续信息；它继续谈危机可能扩散。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>eased his relationship with his rivals<br>缓和了与对手的关系</p>\n</blockquote>\n<p>卡洛斯给其他君主提供教训，要求我们抓住他遭遇的风险。C把回答写成关系修复的结果，全文没有用这条结果来解释这堂课。</p>\n<p>主旨不能排除现实中可能发生过和解；决定本题的是前两段只报告压力与退位，没有报告关系转好。把可能后果写成已经发生的事实，超出了出处。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. ended his reign in embarrassment</h3>\n<blockquote>\n<p>在难堪中结束了统治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D。选项当时为 <code>ended his reign in [xxx]</code>，末词不认识，但 <code>ended his reign</code> 能对上 <code>stand down</code>；与A二选一后，做题模式结合全文警示方向确定D。复盘恢复完整的 <code>embarrassment</code>。</p>\n<p><strong>选项类型：正确跨句概括。</strong></p>\n<p><code>ended his reign</code> 把国王 <code>stand down</code> 换成结束统治；<code>in embarrassment</code> 汇总丑闻及被迫食言的处境。首句断言与次句现实相撞，使难堪有具体依据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯在难堪中结束了统治。</p>\n</blockquote>\n<p>人名在第一句出现；D的 <code>ended his reign</code> 对应第二句 <code>stand down</code>。国王下台会结束其统治，这两个表达描述同一结果，不需要另找一个退位事件。</p>\n<p>再核对 <code>in embarrassment</code>。第二句直接有 <code>embarrassing scandals</code>；第一句写他曾坚称国王不会退位，第二句却写 <code>forced him to eat his words</code>。丑闻和被迫收回断言共同说明退位时的难堪。</p>\n<p>如果只读 <code>stand down</code>，只能确认结束统治，尚不能评价处境。连起先前断言与后面的丑闻、食言，D后半部分才有足够证据。这里无需推测他心里是否羞愧，选项概括的是公开处境。</p>\n<p>D保留同一个人、同一次退位及其不体面的背景。它没有增加支持率、他人好恶或和解结果，而是把相邻两句的信息压缩成一个完整事实。</p>\n<h4>写作视角法</h4>\n<p>原文第1段是这样写的：</p>\n<blockquote>\n<p>King Juan Carlos of Spain once insisted &quot;kings don&#39;t abdicate, they die in their sleep.&quot;</p>\n<p>But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n<p>So, does the Spanish crisis suggest that monarchy is seeing its last days?</p>\n<p>先说国王坚称不会退位，接着写压力迫使他食言、下台，再问这是否预示君主制危机。</p>\n</blockquote>\n<p>先前断言与后来的退位形成反差。作者用这种失去体面的结局引出制度问题，事件和后面的追问因而连在一起。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Forced to abandon his claim that kings never abdicate, Juan Carlos ended his reign amid embarrassing scandals.</p>\n<p>胡安·卡洛斯被迫放弃国王绝不退位的说法，在令人难堪的丑闻中结束了统治。</p>\n</blockquote>\n<p>D需要的写法可由原文两句直接合成：首句给说过什么，次句给为何收回、发生什么。假设句未补进第三件事。后面的欧洲问题也能接在这次不体面退位之后，作为教训的引子。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入21题题干：</p>\n<blockquote>\n<p>根据前两段，卡洛斯的遭遇构成一个需要其他欧洲君主吸取教训的警示案例，说明某种王室风险已经在具体人物身上显现。标题尚不能单独确定他的支持率或退位处境，仍须由前两段确认。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>ended his reign in embarrassment<br>在难堪中结束了统治</p>\n</blockquote>\n<p>D回答了主旨需要的具体案例：卡洛斯在难堪处境中退位，这值得其他欧洲君主警惕。它没有把标题扩写成未出现的生平或人际故事。</p>\n<p>难堪仍由 <code>embarrassing scandals</code> 和被迫食言确认，结束统治仍由 <code>stand down</code> 确认。局部事实先成立，全文警示方向再与它相互印证。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. D. ended his reign in embarrassment</strong></p>\n</blockquote>\n<p>A补入个人过去的高支持，B补入其他王室的好恶，C补入关系缓和；D把丑闻、被迫食言与退位准确合在一起。</p>\n<h2>22题</h2>\n<blockquote>\n<p>Monarchs are kept as heads of state in Europe mostly ______.<br>欧洲大多保留君主作为国家元首，主要是因为什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。这是原因细节题。<code>kept as heads of state</code> 对应第三段的 <code>continuing popularity as heads of state</code> 和 <code>have survived</code>，<code>mostly</code> 要抓主要理由。首句回指第二段的超越政治、国家团结，末句用 <code>because</code> 直接给出存续原因；中间王国数量只是现状，不能代替原因。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n<p>首句解释受欢迎，末句用原因从句解释存续；两句共同锁定国家元首的人选作用。</p>\n<h3>A. owing to their undoubted and respectable status</h3>\n<blockquote>\n<p>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留并确定A。当时选项为 <code>owing to their undoubted and [xxx] status</code>，第二个形容词被遮挡；做题模式仍从 <code>respected public figure</code> 和避免艰难寻找人选，看出它与现成、受认可的元首地位对应。</p>\n<p><strong>选项类型：正确同义概括。</strong></p>\n<p>A把现有君主使选民免于另找少争议且受尊敬人物，概括成保留他们的地位原因。<code>respectable</code> 对应 <code>respected</code>；<code>undoubted</code> 在这里概括人选较少引发争议、地位较受认可，不能扩大成所有君主永远无可质疑。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们无可置疑且受人尊敬的地位。</p>\n</blockquote>\n<p>题干的 <code>heads of state</code> 在第三段首句原词出现。再沿着为什么留下来，找到末句 <code>have survived because</code>；<code>owing to</code> 和 <code>because</code> 都是在给原因。</p>\n<p>末句说，保留王室使选民免于艰难寻找 <code>a non-controversial but respected public figure</code>。能省掉这次寻找，是因为现任君主已能承担这种少争议、受尊敬的公共人物角色。</p>\n<p><code>respectable status</code> 概括 <code>respected public figure</code> 的公共地位。<code>undoubted</code> 应结合 <code>non-controversial</code> 理解为人选的可接受性，不能读成道德上绝无问题；文章后面还会批评王室。</p>\n<p>两边的原因都落在君主作为元首的人选条件上。原文从选民免去选人困难解释，A从现有君主地位概括，没有换成传统价值、更多偶像或永恒政治权威。</p>\n<h4>写作视角法</h4>\n<p>原文第3、7段是这样写的：</p>\n<blockquote>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>作者以看似超越政治解释受欢迎，又写免去寻找合适人选的困难，结尾再次强调少争议、非政治的元首服务。</p>\n</blockquote>\n<p>第三段承接国家团结的正面作用，结尾又把这项作用作为查尔斯必须理解的存续条件。前后反复强调同一种公共角色，能够解释王室为何被保留。</p>\n<p>如果A真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Most European monarchs remain heads of state because they offer voters an established, broadly accepted and respected public figure.</p>\n<p>多数欧洲君主仍担任元首，因为他们为选民提供了一个地位已确立、较受认可和尊敬的公众人物。</p>\n</blockquote>\n<p>A需要的原因在实际推进中找得到：超越党争的形象、人选便利、非政治服务。这里的受认可始终有公共角色这一范围，不意味着每位王室成员的所有行为都获认可。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>A实际说的是：</p>\n<blockquote>\n<p>owing to their undoubted and respectable status<br>由于他们无可置疑且受人尊敬的地位</p>\n</blockquote>\n<p>A说的地位与主旨要求寻找的存续条件处于同一层次。全文一边承认公共用途，一边提醒王室：若行为损害认可，西班牙教训也会落到自己身上。</p>\n<p>具体对应仍由第三段完成：少争议、受尊敬的人选能够减少选民的寻找困难。主旨能验证方向，不能把 <code>undoubted</code> 变成对君主一切行为的绝对肯定。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. to achieve a balance between tradition and reality</h3>\n<blockquote>\n<p>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除B。做题模式能读出 <code>because</code> 后是避免艰难寻找公众人物，没有把这条具体理由换成平衡传统与现实。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>古老王室保留于现代欧洲，容易让人想到传统和现实之间的折中。B把读者可作的社会概括写成主要目的，原文没有建立这两个端点及平衡关系。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了在传统与现实之间取得平衡。</p>\n</blockquote>\n<p>问保留理由，定位点是第三段 <code>most royal families have survived because</code>。B的 <code>tradition</code>、<code>reality</code> 和 <code>balance</code> 没有对应的原因表达，不能凭王室古老、欧洲现代完成匹配。</p>\n<p>出处交代选民的人选难题：找到少争议而受尊敬的人不容易，现有君主免去了这项困难。它把具体角色与存续联系起来。</p>\n<p>B换成目的：保留王室是为了平衡两种抽象价值。原文没有先把传统与现实设成冲突两端，也没说君主调和二者；第四段反而会写继承特权与现代民主的矛盾。</p>\n<p>制度跨越古今是背景，为平衡古今而保留它则是新目的。B多出后者，不能拿听起来合理的概括替代明确的 <code>because</code>。</p>\n<h4>写作视角法</h4>\n<p>原文第3、4段是这样写的：</p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>第三段解释选择合适元首的困难；第四段质疑富有贵族仍处在现代民主国家的象征核心。</p>\n</blockquote>\n<p>文章先承认现实功能，再摆出尚未消除的制度矛盾。转折保留传统特权与民主价值的张力，没有宣布保留君主已经达到平衡。</p>\n<p>如果B真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Europeans retain monarchs as heads of state to balance inherited traditions with the realities of modern democracy.</p>\n<p>欧洲人保留君主担任元首，是为了平衡承袭的传统与现代民主的现实。</p>\n</blockquote>\n<p>B成立需要明确的“为平衡而保留”目的。实际原因始终落在人选便利上，随后又写王室与民主的冲突。所缺的一整条关系，无法靠给 <code>avoid the difficult search</code> 换几个词补出。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>to achieve a balance between tradition and reality<br>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p>主旨允许讨论古老王室如何面对现代社会，却不能证明平衡传统与现实就是保留原因。否则凡是符合文章背景的目的，都可被塞进题干。</p>\n<p>这堂课先立足王室能提供什么服务，再谈服务与行为是否相称。B没有回答第三段明确给出的用途，而加入了未建立的平衡目标。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. to give voters more public figures to look up to</h3>\n<blockquote>\n<p>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除C。做题模式已识别原文是让选民避免寻找的困难，选项却变成给选民更多可敬仰的公众人物。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>C保留 <code>voters</code>、<code>public figures</code> 及尊敬的语义，改变动作与数量：免去再找一个合适元首的困难，被改成增加一批供人仰望的人物。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是为了给选民更多可敬仰的公众人物。</p>\n</blockquote>\n<p><code>voters</code> 与 <code>public figures</code> 把C带回第三段末句。原文是单数 <code>a ... public figure</code>，前面的动作是 <code>avoid the difficult search</code>，两处必须一起看。</p>\n<p>君主让选民不必再艰难物色合适人选，说明既有职位已经能履行作用。句子关注选人这件事的困难是否可以省掉。</p>\n<p>C的 <code>give ... more</code> 要求保留王室能增加公众人物数量。原文没有比较前后有多少可敬仰的人。<code>look up to</code> 与 <code>respected</code> 在尊敬上相近，但局部接近救不了动作和数量的变化。</p>\n<p>由省去寻找一个合适人物，不能推出增加更多可仰望人物。C借用了正确名词和评价色彩，却把制度便利改成扩大人物供给。</p>\n<h4>写作视角法</h4>\n<p>原文第3、7段是这样写的：</p>\n<blockquote>\n<p>But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>王室省去寻找少争议且受尊敬人选的困难，末段把存续条件概括为提供国家元首服务。</p>\n</blockquote>\n<p>作者继续检查王室能否胜任服务，并用查尔斯说明风险。判断标准是角色是否合适，不需要讨论公众能敬仰的人数。</p>\n<p>如果C真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Royal families are retained so that voters have more public figures to admire.</p>\n<p>保留王室，是为了让选民拥有更多可以敬仰的公众人物。</p>\n</blockquote>\n<p>假设把数量增加写成保留目的，这才是C必需的写法。实际末句的 <code>a</code> 和 <code>avoid</code> 把叙述放在免去一次困难选择上，后面的服务要求没有发展出公众人物越多越好的理由。</p>\n<h4>主旨交叉验证法</h4>\n<p>25题的正确答案是：</p>\n<blockquote>\n<p>Carlos, a Lesson for All European Monarchs<br>卡洛斯：给所有欧洲君主的一课</p>\n</blockquote>\n<p>把这个主旨直接代入22题题干：</p>\n<blockquote>\n<p>欧洲保留君主作为国家元首，说明这类制度仍有让它延续的条件；卡洛斯这一课要求其他君主理解这些条件。标题不能独自给出保留的具体原因，第三段的原因解释必须继续核对。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>to give voters more public figures to look up to<br>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p>主旨引出的存续条件要回到王室能否承担受认可的角色。C说增加可敬仰人物数量，全篇没有用数量多少衡量王室是否值得留下。</p>\n<p>受尊敬确与文章相关，但要把整项放回制度功能中验证。C的 <code>more</code> 和增加人物的动作，与第三段省去寻找困难的关系对不上。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. due to their everlasting political embodiment</h3>\n<blockquote>\n<p>由于他们永久体现政治</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮直接排除D。做题模式用第二段超越政治和第三段因果句核对，发现体现政治方向不合；<code>everlasting</code> 也没有对应依据。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>D借用 <code>politics</code>、<code>embody</code>、<code>continuing</code>，交换它们的关系：超越政治、体现国家团结，被改成永久体现政治。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是由于他们永久体现政治。</p>\n</blockquote>\n<p><code>political embodiment</code> 要对照第二段 <code>rise above ... politics</code>、<code>embody ... national unity</code>，再看第三段 <code>transcendence of politics</code>。政治是被超越的对象，国家团结才是被体现的对象。</p>\n<p>第三段首句明确说，解释持续受欢迎的是这种看似超越政治的性质。结尾又写 <code>non-political heads of state</code>，首尾都要求元首少卷入党派政治。</p>\n<p>D把分开的动词与对象重新配对，得到体现政治。此外，<code>continuing popularity</code> 只说持续受欢迎，不保证永久不变；<code>everlasting</code> 加入无限时间。</p>\n<p>这项同时改坏体现对象和时间程度。原文承认君主因超越政治而有用，又提醒他们可能损害制度；D把有条件存续写成永久政治代表。</p>\n<h4>写作视角法</h4>\n<p>原文第2、3、7段是这样写的：</p>\n<blockquote>\n<p>When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.</p>\n<p>It is this apparent transcendence of politics that explains monarchs&#39; continuing popularity as heads of state.</p>\n<p>He has failed to understand that monarchies have largely survived because they provide a service – as non-controversial and non-political heads of state.</p>\n<p>第二段说超越日常政治、体现国家团结，第三段用超越解释受欢迎，末段要求非政治元首服务。</p>\n</blockquote>\n<p>作者沿着远离党争才有公共用途的理由向后写，再以查尔斯不理解角色作警告。非政治限制保留到结尾，没有中途撤回。</p>\n<p>如果D真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Monarchs remain popular as heads of state because they permanently embody political power.</p>\n<p>君主作为国家元首持续受欢迎，因为他们永久体现政治权力。</p>\n</blockquote>\n<p>D成立时，政治代表性必须成为受欢迎的原因。实际写法把超越政
