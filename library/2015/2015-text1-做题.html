靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> According to the first two paragraphs, King Juan Carlos of Spain ______.  \n> 根据前两段，西班牙国王胡安·卡洛斯怎么样？\n\n题干明确写着first two paragraphs，所以不需要靠模糊印象找位置。先把第一段和第二段依次完整读完，再看卡洛斯退位与君主制作用分别怎样出现。\n\n> 原文参考：\n>\n> King Juan Carlos of Spain once insisted “kings don’t **[xxx]**, they die in their sleep.” But **[xxx]** scandals and the popularity of the **[xxx]** left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their **[xxx]** uniforms and majestic lifestyles?\n>\n> 开始精读：\n>\n> King Juan Carlos of Spain once insisted / “kings don’t **[xxx]**, / they die in their sleep.” / But **[xxx]** scandals and the popularity of the **[xxx]** left / in the recent Euro-elections / have forced him to eat his words and stand down. / So, does the Spanish crisis suggest / that monarchy is seeing its last days? / Does that mean the writing is on the wall / for all European royals, / with their **[xxx]** uniforms and majestic lifestyles?\n>\n> 顺着英文顺序读：\n>\n> 西班牙国王胡安·卡洛斯曾坚持说 / “国王不会 **[xxx]** / 他们会在睡梦中死去” / 但是 **[xxx]** 丑闻和 **[xxx]** 左翼势力越来越受欢迎 / 在最近的欧洲选举中 / 已经迫使他收回自己的话并且下台 / 那么西班牙危机是否说明 / 君主制正在进入最后岁月 / 这是否意味着大势已定 / 对所有欧洲王室来说 / 包括他们 **[xxx]** 的制服和威严的生活方式\n\n> 原文参考：\n>\n> The Spanish case provides arguments both for and against monarchy. When public opinion is particularly **[xxx]**, as it was following the end of the Franco regime, monarchs can rise above “mere” politics and “**[xxx]**” a spirit of national unity.\n>\n> 开始精读：\n>\n> The Spanish case provides arguments / both for and against monarchy. / When public opinion is particularly **[xxx]**, / as it was following the end of the Franco regime, / monarchs can rise above “mere” politics / and “**[xxx]**” a spirit of national unity.\n>\n> 顺着英文顺序读：\n>\n> 西班牙案例提供了理由 / 既支持君主制也反对君主制 / 当公众意见格外 **[xxx]** 时 / 就像佛朗哥政权结束以后那样 / 君主可以超越所谓的政治 / 并且 **[xxx]** 国家团结的精神\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>21题</h2>\n<blockquote>\n<p>According to the first two paragraphs, King Juan Carlos of Spain ______.<br />\n根据前两段，西班牙国王胡安·卡洛斯怎么样？</p>\n</blockquote>\n<p>题干明确写着first two paragraphs，所以不需要靠模糊印象找位置。先把第一段和第二段依次完整读完，再看卡洛斯退位与君主制作用分别怎样出现。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>King Juan Carlos of Spain once insisted “kings don’t <span class=\"mask\">[xxx]</span>, they die in their sleep.” But <span class=\"mask\">[xxx]</span> scandals and the popularity of the <span class=\"mask\">[xxx]</span> left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their <span class=\"mask\">[xxx]</span> uniforms and majestic lifestyles?</p>\n<p>开始精读：</p>\n<p>King Juan Carlos of Spain once insisted / “kings don’t <span class=\"mask\">[xxx]</span>, / they die in their sleep.” / But <span class=\"mask\">[xxx]</span> scandals and the popularity of the <span class=\"mask\">[xxx]</span> left / in the recent Euro-elections / have forced him to eat his words and stand down. / So, does the Spanish crisis suggest / that monarchy is seeing its last days? / Does that mean the writing is on the wall / for all European royals, / with their <span class=\"mask\">[xxx]</span> uniforms and majestic lifestyles?</p>\n<p>顺着英文顺序读：</p>\n<p>西班牙国王胡安·卡洛斯曾坚持说 / “国王不会 <span class=\"mask\">[xxx]</span> / 他们会在睡梦中死去” / 但是 <span class=\"mask\">[xxx]</span> 丑闻和 <span class=\"mask\">[xxx]</span> 左翼势力越来越受欢迎 / 在最近的欧洲选举中 / 已经迫使他收回自己的话并且下台 / 那么西班牙危机是否说明 / 君主制正在进入最后岁月 / 这是否意味着大势已定 / 对所有欧洲王室来说 / 包括他们 <span class=\"mask\">[xxx]</span> 的制服和威严的生活方式</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The Spanish case provides arguments both for and against monarchy. When public opinion is particularly <span class=\"mask\">[xxx]</span>, as it was following the end of the Franco regime, monarchs can rise above “mere” politics and “<span class=\"mask\">[xxx]</span>” a spirit of national unity.</p>\n<p>开始精读：</p>\n<p>The Spanish case provides arguments / both for and against monarchy. / When public opinion is particularly <span class=\"mask\">[xxx]</span>, / as it was following the end of the Franco regime, / monarchs can rise above “mere” politics / and “<span class=\"mask\">[xxx]</span>” a spirit of national unity.</p>\n<p>顺着英文顺序读：</p>\n<p>西班牙案例提供了理由 / 既支持君主制也反对君主制 / 当公众意见格外 <span class=\"mask\">[xxx]</span> 时 / 就像佛朗哥政权结束以后那样 / 君主可以超越所谓的政治 / 并且 <span class=\"mask\">[xxx]</span> 国家团结的精神</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36]],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. used to enjoy high public support\n\n> 过去享有很高的公众支持\n\n把A接回题干，它说的是：卡洛斯过去享有很高的公众支持。\n\nA里的“used to enjoy high public support”和原文“arguments both for and against monarchy”都在谈西班牙王室与公众评价的关系，因为一个判断过去支持程度，一个说明这个案例有正反两面，所以回看第二段第一句。\n\n> The Spanish case provides arguments both for and against monarchy.\n\n原文“arguments both for and against monarchy”只说西班牙案例能同时提供支持与反对君主制的理由；A的“used to enjoy high public support”却进一步断定卡洛斯过去得到很高支持。两边都涉及公众评价，但原文没有直接给出过去支持度的高低。\n\n这里要分开两层：第二段谈的是“西班牙案例”对君主制这一制度有正反两面的意义，A却把制度层面的正面可能性落到卡洛斯个人过去的民意支持上。段中没有支持率、选民比例或某一时期的民调，也没有说公众曾普遍拥护他；因此A目前只能从君主在分裂时期可能代表国家团结这一点获得间接可能性，不能算已经被原句坐实。\n\n**既然第二段承认西班牙案例也能支持君主制，能不能立刻排除卡洛斯过去曾有高支持？**\n\n还不能。第二段留下了君主制在分裂时期代表团结的正面作用，A虽然没有被直接证明，但目前也没有出现与之冲突的过去支持信息。\n\n第一段也只写他过去的强硬断言以及后来被迫下台，并未补出他早年受欢迎或不受欢迎。把前两段合在一起，A缺的是“卡洛斯本人—过去—高支持度”这三层明确连接，但现有文字也没有给出相反结论，所以第一遍仍然留下。\n\n**第一轮判断：A保留。**","html":"<h3>A. used to enjoy high public support</h3>\n<blockquote>\n<p>过去享有很高的公众支持</p>\n</blockquote>\n<p>把A接回题干，它说的是：卡洛斯过去享有很高的公众支持。</p>\n<p>A里的“used to enjoy high public support”和原文“arguments both for and against monarchy”都在谈西班牙王室与公众评价的关系，因为一个判断过去支持程度，一个说明这个案例有正反两面，所以回看第二段第一句。</p>\n<blockquote>\n<p>The Spanish case provides arguments both for and against monarchy.</p>\n</blockquote>\n<p>原文“arguments both for and against monarchy”只说西班牙案例能同时提供支持与反对君主制的理由；A的“used to enjoy high public support”却进一步断定卡洛斯过去得到很高支持。两边都涉及公众评价，但原文没有直接给出过去支持度的高低。</p>\n<p>这里要分开两层：第二段谈的是“西班牙案例”对君主制这一制度有正反两面的意义，A却把制度层面的正面可能性落到卡洛斯个人过去的民意支持上。段中没有支持率、选民比例或某一时期的民调，也没有说公众曾普遍拥护他；因此A目前只能从君主在分裂时期可能代表国家团结这一点获得间接可能性，不能算已经被原句坐实。</p>\n<p><strong>既然第二段承认西班牙案例也能支持君主制，能不能立刻排除卡洛斯过去曾有高支持？</strong></p>\n<p>还不能。第二段留下了君主制在分裂时期代表团结的正面作用，A虽然没有被直接证明，但目前也没有出现与之冲突的过去支持信息。</p>\n<p>第一段也只写他过去的强硬断言以及后来被迫下台，并未补出他早年受欢迎或不受欢迎。把前两段合在一起，A缺的是“卡洛斯本人—过去—高支持度”这三层明确连接，但现有文字也没有给出相反结论，所以第一遍仍然留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36]],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"option","qid":"21","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“used to enjoy high public support”和原文“arguments both for and against monarchy”都在谈西班牙王室与公众评价的关系，因为一个判断过去支持程度，一个说明这个案例有正反两面，所以回看第二段第一句。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"arguments both for and against monarchy","visibleOptionAnchor":"used to enjoy high public support"}}}},{"section":"21题","raw":"### B. was unpopular among European royals\n\n> 在欧洲王室成员中不受欢迎\n\n把B接回题干，它说的是：卡洛斯在欧洲王室成员中不受欢迎。\n\nB里的“unpopular among European royals”和原文“forced him to eat his words and stand down”都在解释他为何退位，因为一个把压力归给欧洲王室同伴，一个写丑闻与选举后的国内压力，所以回看第一段第二句。\n\n> But **[xxx]** scandals and the popularity of the **[xxx]** left in the recent Euro-elections have forced him to eat his words and stand down.\n\n原文“forced him to eat his words and stand down”把退位压力连到丑闻和共和派左翼在选举中的声势；B的“unpopular among European royals”却把对象换成欧洲其他王室。压力来源和关系对象都不同。\n\n第一段末尾提到“all European royals”，只是作者把西班牙危机扩大成一个面向欧洲王室的问题。这里的European royals是可能受到警示的一群人，并没有被写成卡洛斯退位的推动者。B则要求出现“其他王室对卡洛斯评价负面”这一人际关系，和原句的“丑闻、共和派声势—迫使下台”不是同一条因果链。\n\n**国内丑闻和共和派声势迫使他下台，是否等于欧洲其他王室成员不喜欢他？**\n\n不等于。原句没有把欧洲王室写成施压者或评价者，B改变了关系对象。\n\n即使卡洛斯的处境会让欧洲王室担忧，也只能说明他的案例对他们有影响，不能反推他们过去就不喜欢他。B把受影响者写成评价者，再把国内政治压力换成王室圈内部的不受欢迎，两个关键位置都变了。\n\n**第一轮判断：B排除。**","html":"<h3>B. was unpopular among European royals</h3>\n<blockquote>\n<p>在欧洲王室成员中不受欢迎</p>\n</blockquote>\n<p>把B接回题干，它说的是：卡洛斯在欧洲王室成员中不受欢迎。</p>\n<p>B里的“unpopular among European royals”和原文“forced him to eat his words and stand down”都在解释他为何退位，因为一个把压力归给欧洲王室同伴，一个写丑闻与选举后的国内压力，所以回看第一段第二句。</p>\n<blockquote>\n<p>But <span class=\"mask\">[xxx]</span> scandals and the popularity of the <span class=\"mask\">[xxx]</span> left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n<p>原文“forced him to eat his words and stand down”把退位压力连到丑闻和共和派左翼在选举中的声势；B的“unpopular among European royals”却把对象换成欧洲其他王室。压力来源和关系对象都不同。</p>\n<p>第一段末尾提到“all European royals”，只是作者把西班牙危机扩大成一个面向欧洲王室的问题。这里的European royals是可能受到警示的一群人，并没有被写成卡洛斯退位的推动者。B则要求出现“其他王室对卡洛斯评价负面”这一人际关系，和原句的“丑闻、共和派声势—迫使下台”不是同一条因果链。</p>\n<p><strong>国内丑闻和共和派声势迫使他下台，是否等于欧洲其他王室成员不喜欢他？</strong></p>\n<p>不等于。原句没有把欧洲王室写成施压者或评价者，B改变了关系对象。</p>\n<p>即使卡洛斯的处境会让欧洲王室担忧，也只能说明他的案例对他们有影响，不能反推他们过去就不喜欢他。B把受影响者写成评价者，再把国内政治压力换成王室圈内部的不受欢迎，两个关键位置都变了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36]],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"option","qid":"21","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“unpopular among European royals”和原文“forced him to eat his words and stand down”都在解释他为何退位，因为一个把压力归给欧洲王室同伴，一个写丑闻与选举后的国内压力，所以回看第一段第二句。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"forced him to eat his words and stand down","visibleOptionAnchor":"unpopular among European royals"}}}},{"section":"21题","raw":"### C. eased his relationship with his rivals\n\n> 缓和了与对手的关系\n\n把C接回题干，它说的是：卡洛斯缓和了与对手的关系。\n\nC里的“eased his relationship with his rivals”和原文“forced him to eat his words and stand down”都涉及卡洛斯与反对力量的结果，因为一个说关系缓和，一个说压力迫使他退位，所以回看第一段第二句。\n\n> But **[xxx]** scandals and the popularity of the **[xxx]** left in the recent Euro-elections have forced him to eat his words and stand down.\n\n原文“forced him to eat his words and stand down”呈现的是反对力量上升后他被迫收回话并退位；C的“eased his relationship with his rivals”却把结果改成关系缓和。动作方向相反。\n\n“eat his words”与“stand down”都带着被迫让步的方向：前者是收回先前说法，后者是离开王位。若是“eased his relationship”，文章至少应出现双方紧张关系减弱、和解、妥协或对手态度改善；原句完全没有这些结果，只写压力最终作用到卡洛斯身上。\n\n**被对手一方的声势迫使退位，能不能写成他主动缓和了与对手的关系？**\n\n不能。原文是压力导致退位，不是双方关系得到缓和。\n\n退位在现实中也许会让冲突暂时降温，但题目问的是从前两段能够读到什么，不能把可能发生的后续效果补进原句。当前动作只支持“被迫退位”，不支持“改善与对手关系”。\n\n**第一轮判断：C排除。**","html":"<h3>C. eased his relationship with his rivals</h3>\n<blockquote>\n<p>缓和了与对手的关系</p>\n</blockquote>\n<p>把C接回题干，它说的是：卡洛斯缓和了与对手的关系。</p>\n<p>C里的“eased his relationship with his rivals”和原文“forced him to eat his words and stand down”都涉及卡洛斯与反对力量的结果，因为一个说关系缓和，一个说压力迫使他退位，所以回看第一段第二句。</p>\n<blockquote>\n<p>But <span class=\"mask\">[xxx]</span> scandals and the popularity of the <span class=\"mask\">[xxx]</span> left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n<p>原文“forced him to eat his words and stand down”呈现的是反对力量上升后他被迫收回话并退位；C的“eased his relationship with his rivals”却把结果改成关系缓和。动作方向相反。</p>\n<p>“eat his words”与“stand down”都带着被迫让步的方向：前者是收回先前说法，后者是离开王位。若是“eased his relationship”，文章至少应出现双方紧张关系减弱、和解、妥协或对手态度改善；原句完全没有这些结果，只写压力最终作用到卡洛斯身上。</p>\n<p><strong>被对手一方的声势迫使退位，能不能写成他主动缓和了与对手的关系？</strong></p>\n<p>不能。原文是压力导致退位，不是双方关系得到缓和。</p>\n<p>退位在现实中也许会让冲突暂时降温，但题目问的是从前两段能够读到什么，不能把可能发生的后续效果补进原句。当前动作只支持“被迫退位”，不支持“改善与对手关系”。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36]],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"option","qid":"21","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“eased his relationship with his rivals”和原文“forced him to eat his words and stand down”都涉及卡洛斯与反对力量的结果，因为一个说关系缓和，一个说压力迫使他退位，所以回看第一段第二句。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"forced him to eat his words and stand down","visibleOptionAnchor":"eased his relationship with his rivals"}}}},{"section":"21题","raw":"### D. ended his reign in **[xxx]**\n\n> 在 **[xxx]** 中结束了统治\n\n把D接回题干，它说的是：卡洛斯在某种难堪处境中结束了自己的统治。\n\nD里的“ended his reign”和原文“forced him to eat his words and stand down”都落在统治结束这件事上，因为stand down就是退位，而前面又写到丑闻，所以回看第一段第二句。\n\n> But **[xxx]** scandals and the popularity of the **[xxx]** left in the recent Euro-elections have forced him to eat his words and stand down.\n\n原文“forced him to eat his words and stand down”明确写他在丑闻和政治压力下被迫退位；D的“ended his reign”与退位动作一致。D中评价退位处境的词被遮住，但可见部分已经与原文事件接上。\n\n“ended his reign”把“stand down”换成了更概括的说法，主体和最终结果都没有变化。原句还写“forced”和“eat his words”，说明这不是从容主动的交接，而是在丑闻与政治压力下结束统治。D中间的评价词看不清，但它位于“in...”中，只是在给统治结束补一种处境，不会把“结束统治”改成别的动作。\n\n**丑闻之后被迫收回话并退位，能不能与“ended his reign”这条结果对应？**\n\n能。统治结束这一核心结果已经一致；被遮住的词只影响对处境的进一步评价，不会抹掉退位事实，因此D先保留。\n\n与A相比，D至少直接抓住了第一段明确发生的结果；A还需要另补过去的高民意支持。此时不能只因为D更直接就把A排掉，所以先把两项都留住，等全文方向形成后再拉开。\n\n**第一轮判断：D保留。**","html":"<h3>D. ended his reign in <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>在 <span class=\"mask\">[xxx]</span> 中结束了统治</p>\n</blockquote>\n<p>把D接回题干，它说的是：卡洛斯在某种难堪处境中结束了自己的统治。</p>\n<p>D里的“ended his reign”和原文“forced him to eat his words and stand down”都落在统治结束这件事上，因为stand down就是退位，而前面又写到丑闻，所以回看第一段第二句。</p>\n<blockquote>\n<p>But <span class=\"mask\">[xxx]</span> scandals and the popularity of the <span class=\"mask\">[xxx]</span> left in the recent Euro-elections have forced him to eat his words and stand down.</p>\n</blockquote>\n<p>原文“forced him to eat his words and stand down”明确写他在丑闻和政治压力下被迫退位；D的“ended his reign”与退位动作一致。D中评价退位处境的词被遮住，但可见部分已经与原文事件接上。</p>\n<p>“ended his reign”把“stand down”换成了更概括的说法，主体和最终结果都没有变化。原句还写“forced”和“eat his words”，说明这不是从容主动的交接，而是在丑闻与政治压力下结束统治。D中间的评价词看不清，但它位于“in...”中，只是在给统治结束补一种处境，不会把“结束统治”改成别的动作。</p>\n<p><strong>丑闻之后被迫收回话并退位，能不能与“ended his reign”这条结果对应？</strong></p>\n<p>能。统治结束这一核心结果已经一致；被遮住的词只影响对处境的进一步评价，不会抹掉退位事实，因此D先保留。</p>\n<p>与A相比，D至少直接抓住了第一段明确发生的结果；A还需要另补过去的高民意支持。此时不能只因为D更直接就把A排掉，所以先把两项都留住，等全文方向形成后再拉开。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36]],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"option","qid":"21","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“ended his reign”和原文“forced him to eat his words and stand down”都落在统治结束这件事上，因为stand down就是退位，而前面又写到丑闻，所以回看第一段第二句。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"forced him to eat his words and stand down","visibleOptionAnchor":"ended his reign"}}}},{"section":"21题","raw":"### 21题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。","html":"<h3>21题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36]],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"result","qid":"21"}},{"section":"22题","raw":"## 22题\n\n> Monarchs are kept as heads of state in Europe mostly ______.  \n> 欧洲大多保留君主作为国家元首，主要是因为什么？\n\n题干里的Monarchs直接给出对象坐标。第三段开头再次出现monarchs并接着解释它们为何继续担任国家元首，所以完整读第三段。\n\n> 原文参考：\n>\n> It is this apparent **[xxx]** of politics that explains monarchs’ continuing popularity as heads of state. And so, the Middle East excepted, Europe is the most monarch-infested region in the world, with 10 kingdoms (not counting Vatican City and Andorra). But unlike their **[xxx]** counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a **[xxx]** but respected public figure.\n>\n> 开始精读：\n>\n> It is this apparent **[xxx]** of politics / that explains monarchs’ continuing popularity / as heads of state. / And so, the Middle East excepted, / Europe is the most monarch-infested region in the world, / with 10 kingdoms (not counting Vatican City and Andorra). / But unlike their **[xxx]** counterparts in the Gulf and Asia, / most royal families have survived / because they allow voters to avoid / the difficult search for a **[xxx]** but respected public figure.\n>\n> 顺着英文顺序读：\n>\n> 正是这种对政治看似 **[xxx]** / 解释了君主持续受欢迎 / 作为国家元首 / 因此除中东以外 / 欧洲是世界上君主最多的地区 / 拥有十个王国而不算梵蒂冈和安道尔 / 但是不同于海湾和亚洲那些 **[xxx]** 的对应者 / 大多数王室得以存续 / 因为它们让选民可以避开 / 寻找一个 **[xxx]** 但受尊敬的公众人物这件难事\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>22题</h2>\n<blockquote>\n<p>Monarchs are kept as heads of state in Europe mostly ______.<br />\n欧洲大多保留君主作为国家元首，主要是因为什么？</p>\n</blockquote>\n<p>题干里的Monarchs直接给出对象坐标。第三段开头再次出现monarchs并接着解释它们为何继续担任国家元首，所以完整读第三段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It is this apparent <span class=\"mask\">[xxx]</span> of politics that explains monarchs’ continuing popularity as heads of state. And so, the Middle East excepted, Europe is the most monarch-infested region in the world, with 10 kingdoms (not counting Vatican City and Andorra). But unlike their <span class=\"mask\">[xxx]</span> counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a <span class=\"mask\">[xxx]</span> but respected public figure.</p>\n<p>开始精读：</p>\n<p>It is this apparent <span class=\"mask\">[xxx]</span> of politics / that explains monarchs’ continuing popularity / as heads of state. / And so, the Middle East excepted, / Europe is the most monarch-infested region in the world, / with 10 kingdoms (not counting Vatican City and Andorra). / But unlike their <span class=\"mask\">[xxx]</span> counterparts in the Gulf and Asia, / most royal families have survived / because they allow voters to avoid / the difficult search for a <span class=\"mask\">[xxx]</span> but respected public figure.</p>\n<p>顺着英文顺序读：</p>\n<p>正是这种对政治看似 <span class=\"mask\">[xxx]</span> / 解释了君主持续受欢迎 / 作为国家元首 / 因此除中东以外 / 欧洲是世界上君主最多的地区 / 拥有十个王国而不算梵蒂冈和安道尔 / 但是不同于海湾和亚洲那些 <span class=\"mask\">[xxx]</span> 的对应者 / 大多数王室得以存续 / 因为它们让选民可以避开 / 寻找一个 <span class=\"mask\">[xxx]</span> 但受尊敬的公众人物这件难事</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35]],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"question","qid":"22"}},{"section":"22题","raw":"### A. owing to their undoubted and **[xxx]** status\n\n> 由于他们无可置疑且 **[xxx]** 的地位\n\n把A接回题干，它说的是：欧洲保留君主作为国家元首，是由于他们无可置疑并具有某种正面地位。\n\nA里的“owing to their”和原文“non-controversial but respected public figure”都在回答君主为何能被保留，因为一个给出原因连接，另一个写选民想避开困难寻找，所以回看第三段最后一句。\n\n> But unlike their **[xxx]** counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a **[xxx]** but respected public figure.\n\n原文“non-controversial but respected public figure”说明君主能够提供无争议且受尊敬的国家象征；A用“owing to their”把保留原因放到君主自身地位上。虽然一个评价词被遮住，可见的respected与原因关系已经能接上。\n\n第三段给出的完整因果是：王室之所以能够继续存在，是因为它让选民不必艰难寻找一个少争议、又受尊敬的公众人物。A把这一功能压缩为君主具有某种无可置疑、正面的地位。A没有把原因改成财富、传统或血统，而仍然围绕“公众愿意接受这种国家元首身份”展开。\n\n**选民为了得到一个受尊敬且少争议的人物而保留君主，能不能支持A所说的保留原因？**\n\n能。A的原因方向与原文一致，遮挡只让具体评价词暂时不完整，不会把受尊敬的公共地位改成别的原因。\n\n这里的“owing to their”更像在说君主自身属性，原文则从选民得到的便利来解释，但二者仍可接成同一件事：正因为王室能稳定提供这种受尊敬的人物，选民才愿意保留它。中间那个评价词未读清前，没有出现足以把这条原因推翻的内容。\n\n**第一轮判断：A保留。**","html":"<h3>A. owing to their undoubted and <span class=\"mask\">[xxx]</span> status</h3>\n<blockquote>\n<p>由于他们无可置疑且 <span class=\"mask\">[xxx]</span> 的地位</p>\n</blockquote>\n<p>把A接回题干，它说的是：欧洲保留君主作为国家元首，是由于他们无可置疑并具有某种正面地位。</p>\n<p>A里的“owing to their”和原文“non-controversial but respected public figure”都在回答君主为何能被保留，因为一个给出原因连接，另一个写选民想避开困难寻找，所以回看第三段最后一句。</p>\n<blockquote>\n<p>But unlike their <span class=\"mask\">[xxx]</span> counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a <span class=\"mask\">[xxx]</span> but respected public figure.</p>\n</blockquote>\n<p>原文“non-controversial but respected public figure”说明君主能够提供无争议且受尊敬的国家象征；A用“owing to their”把保留原因放到君主自身地位上。虽然一个评价词被遮住，可见的respected与原因关系已经能接上。</p>\n<p>第三段给出的完整因果是：王室之所以能够继续存在，是因为它让选民不必艰难寻找一个少争议、又受尊敬的公众人物。A把这一功能压缩为君主具有某种无可置疑、正面的地位。A没有把原因改成财富、传统或血统，而仍然围绕“公众愿意接受这种国家元首身份”展开。</p>\n<p><strong>选民为了得到一个受尊敬且少争议的人物而保留君主，能不能支持A所说的保留原因？</strong></p>\n<p>能。A的原因方向与原文一致，遮挡只让具体评价词暂时不完整，不会把受尊敬的公共地位改成别的原因。</p>\n<p>这里的“owing to their”更像在说君主自身属性，原文则从选民得到的便利来解释，但二者仍可接成同一件事：正因为王室能稳定提供这种受尊敬的人物，选民才愿意保留它。中间那个评价词未读清前，没有出现足以把这条原因推翻的内容。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35]],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"option","qid":"22","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“owing to their”和原文“non-controversial but respected public figure”都在回答君主为何能被保留，因为一个给出原因连接，另一个写选民想避开困难寻找，所以回看第三段最后一句。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"but respected public figure","visibleOptionAnchor":"owing to their"}}}},{"section":"22题","raw":"### B. to achieve a balance between tradition and reality\n\n> 为了在传统与现实之间取得平衡\n\n把B接回题干，它说的是：欧洲保留君主，是为了平衡传统与现实。\n\nB里的“balance between tradition and reality”和原文“allow voters to avoid the difficult search”都在解释保留君主的作用，因为一个说平衡传统现实，一个说免去寻找公众人物，所以回看第三段最后一句。\n\n> Most royal families have survived because they allow voters to avoid the difficult search for a **[xxx]** but respected public figure.\n\n原文“allow voters to avoid the difficult search”说的是省去寻找非争议国家元首的困难；B的“balance between tradition and reality”却引入传统与现实两端的平衡。原文没有建立这两端。\n\n“tradition”和“reality”在这句中都没有成为两个需要调和的端点。原文没有说君主代表传统、民选政治代表现实，更没有写保留王室能让二者达到均衡；它只写找一个合适公共人物很困难，而现成的王室让选民免去这一步。B把具体的人选便利改造成抽象的价值平衡。\n\n**免去寻找合适国家元首的困难，是否就是平衡传统与现实？**\n\n不是。原文给的是人选便利，B换成了另一套目的关系。\n\n现代民主中保留君主看起来也许确实兼有传统与现实，但这只是读者可能想到的背景，不是这一段给出的主要原因。题干问“mostly”，必须对准because后的理由，B没有对上。\n\n**第一轮判断：B排除。**","html":"<h3>B. to achieve a balance between tradition and reality</h3>\n<blockquote>\n<p>为了在传统与现实之间取得平衡</p>\n</blockquote>\n<p>把B接回题干，它说的是：欧洲保留君主，是为了平衡传统与现实。</p>\n<p>B里的“balance between tradition and reality”和原文“allow voters to avoid the difficult search”都在解释保留君主的作用，因为一个说平衡传统现实，一个说免去寻找公众人物，所以回看第三段最后一句。</p>\n<blockquote>\n<p>Most royal families have survived because they allow voters to avoid the difficult search for a <span class=\"mask\">[xxx]</span> but respected public figure.</p>\n</blockquote>\n<p>原文“allow voters to avoid the difficult search”说的是省去寻找非争议国家元首的困难；B的“balance between tradition and reality”却引入传统与现实两端的平衡。原文没有建立这两端。</p>\n<p>“tradition”和“reality”在这句中都没有成为两个需要调和的端点。原文没有说君主代表传统、民选政治代表现实，更没有写保留王室能让二者达到均衡；它只写找一个合适公共人物很困难，而现成的王室让选民免去这一步。B把具体的人选便利改造成抽象的价值平衡。</p>\n<p><strong>免去寻找合适国家元首的困难，是否就是平衡传统与现实？</strong></p>\n<p>不是。原文给的是人选便利，B换成了另一套目的关系。</p>\n<p>现代民主中保留君主看起来也许确实兼有传统与现实，但这只是读者可能想到的背景，不是这一段给出的主要原因。题干问“mostly”，必须对准because后的理由，B没有对上。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35]],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"option","qid":"22","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“balance between tradition and reality”和原文“allow voters to avoid the difficult search”都在解释保留君主的作用，因为一个说平衡传统现实，一个说免去寻找公众人物，所以回看第三段最后一句。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"allow voters to avoid the difficult search","visibleOptionAnchor":"balance between tradition and reality"}}}},{"section":"22题","raw":"### C. to give voters more public figures to look up to\n\n> 为了给选民更多可敬仰的公众人物\n\n把C接回题干，它说的是：欧洲保留君主，是为了给选民更多可以敬仰的公众人物。\n\nC里的“more public figures to look up to”和原文“a non-controversial but respected public figure”都提到公众人物，因为一个强调更多且供人仰望，另一个强调找到一个合适人选，所以回看第三段最后一句。\n\n> Most royal families have survived because they allow voters to avoid the difficult search for a **[xxx]** but respected public figure.\n\n原文“a non-controversial but respected public figure”是单数，重点在避免艰难寻找；C的“more public figures to look up to”增加了数量并把尊敬改成仰望。范围与作用都扩大了。\n\n原文的重点是“avoid the difficult search”：选民本来需要寻找一个人，王室让这项寻找变得不必进行。C却写“give voters more public figures”，把“免去寻找一个合适人选”改成“额外提供许多人物”。“a public figure”与“more public figures”在数量上也直接不同。\n\n**原文说省去寻找一个合适人物，能不能改写成给选民更多可仰望人物？**\n\n不能。C同时增加数量和崇拜意味，原文都没有。\n\n“respected”说明这个人受到尊重，但“look up to”又加上了仰慕色彩。即使接受这层近义，C仍然同时改变了动作和数量：原文是省去一次困难寻找，C是增加人物供给，所以不能留下。\n\n**第一轮判断：C排除。**","html":"<h3>C. to give voters more public figures to look up to</h3>\n<blockquote>\n<p>为了给选民更多可敬仰的公众人物</p>\n</blockquote>\n<p>把C接回题干，它说的是：欧洲保留君主，是为了给选民更多可以敬仰的公众人物。</p>\n<p>C里的“more public figures to look up to”和原文“a non-controversial but respected public figure”都提到公众人物，因为一个强调更多且供人仰望，另一个强调找到一个合适人选，所以回看第三段最后一句。</p>\n<blockquote>\n<p>Most royal families have survived because they allow voters to avoid the difficult search for a <span class=\"mask\">[xxx]</span> but respected public figure.</p>\n</blockquote>\n<p>原文“a non-controversial but respected public figure”是单数，重点在避免艰难寻找；C的“more public figures to look up to”增加了数量并把尊敬改成仰望。范围与作用都扩大了。</p>\n<p>原文的重点是“avoid the difficult search”：选民本来需要寻找一个人，王室让这项寻找变得不必进行。C却写“give voters more public figures”，把“免去寻找一个合适人选”改成“额外提供许多人物”。“a public figure”与“more public figures”在数量上也直接不同。</p>\n<p><strong>原文说省去寻找一个合适人物，能不能改写成给选民更多可仰望人物？</strong></p>\n<p>不能。C同时增加数量和崇拜意味，原文都没有。</p>\n<p>“respected”说明这个人受到尊重，但“look up to”又加上了仰慕色彩。即使接受这层近义，C仍然同时改变了动作和数量：原文是省去一次困难寻找，C是增加人物供给，所以不能留下。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35]],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"option","qid":"22","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“more public figures to look up to”和原文“a non-controversial but respected public figure”都提到公众人物，因为一个强调更多且供人仰望，另一个强调找到一个合适人选，所以回看第三段最后一句。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"but respected public figure","visibleOptionAnchor":"more public figures to look up to"}}}},{"section":"22题","raw":"### D. due to their everlasting political embodiment\n\n> 由于他们永久体现政治\n\n把D接回题干，它说的是：欧洲保留君主，是因为他们永久体现政治。\n\nD里的“everlasting political embodiment”和原文“continuing popularity as heads of state”都在谈君主与政治及国家元首身份的关系，因为原文把持续受欢迎的原因接到前面被遮住的政治关系，而选项说永久体现政治，所以回看第三段第一句。\n\n> It is this apparent **[xxx]** of politics that explains monarchs’ continuing popularity as heads of state.\n\n原文“continuing popularity as heads of state”由前面的“apparent transcendence of politics”来解释，表示君主看似超越日常政治；D的“everlasting political embodiment”却说君主永久体现政治。关系方向相反。\n\n第三段开头的逻辑恰好是：君主看起来能够离开日常党争，因此才继续受欢迎。“transcendence of politics”强调与政治保持距离，D的“political embodiment”则说它长期把政治本身体现出来；一个是淡化政治性，一个是强化政治性。“everlasting”还把程度推到永久。\n\n**超越政治能不能等同于永久体现政治？**\n\n不能。一个把君主放在政治之上，另一个把君主写成政治本身的长期化身。\n\n这里不是某个模糊评价造成的不确定，核心名词与方向都读得出来。后文的“non-controversial”以及国家元首服务功能也继续支持远离争议政治，而不是永久体现政治。\n\n**第一轮判断：D排除。**","html":"<h3>D. due to their everlasting political embodiment</h3>\n<blockquote>\n<p>由于他们永久体现政治</p>\n</blockquote>\n<p>把D接回题干，它说的是：欧洲保留君主，是因为他们永久体现政治。</p>\n<p>D里的“everlasting political embodiment”和原文“continuing popularity as heads of state”都在谈君主与政治及国家元首身份的关系，因为原文把持续受欢迎的原因接到前面被遮住的政治关系，而选项说永久体现政治，所以回看第三段第一句。</p>\n<blockquote>\n<p>It is this apparent <span class=\"mask\">[xxx]</span> of politics that explains monarchs’ continuing popularity as heads of state.</p>\n</blockquote>\n<p>原文“continuing popularity as heads of state”由前面的“apparent transcendence of politics”来解释，表示君主看似超越日常政治；D的“everlasting political embodiment”却说君主永久体现政治。关系方向相反。</p>\n<p>第三段开头的逻辑恰好是：君主看起来能够离开日常党争，因此才继续受欢迎。“transcendence of politics”强调与政治保持距离，D的“political embodiment”则说它长期把政治本身体现出来；一个是淡化政治性，一个是强化政治性。“everlasting”还把程度推到永久。</p>\n<p><strong>超越政治能不能等同于永久体现政治？</strong></p>\n<p>不能。一个把君主放在政治之上，另一个把君主写成政治本身的长期化身。</p>\n<p>这里不是某个模糊评价造成的不确定，核心名词与方向都读得出来。后文的“non-controversial”以及国家元首服务功能也继续支持远离争议政治，而不是永久体现政治。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35]],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"option","qid":"22","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“everlasting political embodiment”和原文“continuing popularity as heads of state”都在谈君主与政治及国家元首身份的关系，因为原文把持续受欢迎的原因接到前面被遮住的政治关系，而选项说永久体现政治，所以回看第三段第一句。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","negation"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"continuing popularity as heads of state","visibleOptionAnchor":"everlasting political embodiment"}}}},{"section":"22题","raw":"### 22题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **22题选A。**","html":"<h3>22题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>22题选A。</strong></p>\n</blockquote>\n","articleRects":[[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35]],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> Which of the following is shown to be odd, according to Paragraph 4?  \n> 根据第四段，下面哪一项被认为很奇怪？\n\n题干已经指定Paragraph 4。第四段最后一句直接出现bizarre，所以从第四段开头完整读到结尾，确认奇怪的究竟是什么。\n\n> 原文参考：\n>\n> Even so, kings and queens undoubtedly have a **[xxx]**. Symbolic of national unity as they claim to be, their very history—and sometimes the way they behave today—embodies outdated and **[xxx]** privileges and **[xxx]**. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of **[xxx]** wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n>\n> 开始精读：\n>\n> Even so, kings and queens undoubtedly have a **[xxx]**. / Symbolic of national unity as they claim to be, / their very history—and sometimes the way they behave today— / embodies outdated and **[xxx]** privileges and **[xxx]**. / At a time when Thomas Piketty and other economists are warning / of rising inequality / and the increasing power of **[xxx]** wealth, / it is bizarre that wealthy aristocratic families / should still be the symbolic heart of modern democratic states.\n>\n> 顺着英文顺序读：\n>\n> 即便如此国王和王后无疑也有 **[xxx]** / 虽然他们声称自己象征国家团结 / 他们的历史以及有时今天的行为方式 / 体现着过时且 **[xxx]** 的特权和 **[xxx]** / 当托马斯·皮凯蒂和其他经济学家正在警告 / 不平等上升 / 以及 **[xxx]** 财富的力量增加时 / 富有的贵族家庭仍然存在显得奇怪 / 它们仍是现代民主国家的象征核心\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>23题</h2>\n<blockquote>\n<p>Which of the following is shown to be odd, according to Paragraph 4?<br />\n根据第四段，下面哪一项被认为很奇怪？</p>\n</blockquote>\n<p>题干已经指定Paragraph 4。第四段最后一句直接出现bizarre，所以从第四段开头完整读到结尾，确认奇怪的究竟是什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Even so, kings and queens undoubtedly have a <span class=\"mask\">[xxx]</span>. Symbolic of national unity as they claim to be, their very history—and sometimes the way they behave today—embodies outdated and <span class=\"mask\">[xxx]</span> privileges and <span class=\"mask\">[xxx]</span>. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of <span class=\"mask\">[xxx]</span> wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n<p>开始精读：</p>\n<p>Even so, kings and queens undoubtedly have a <span class=\"mask\">[xxx]</span>. / Symbolic of national unity as they claim to be, / their very history—and sometimes the way they behave today— / embodies outdated and <span class=\"mask\">[xxx]</span> privileges and <span class=\"mask\">[xxx]</span>. / At a time when Thomas Piketty and other economists are warning / of rising inequality / and the increasing power of <span class=\"mask\">[xxx]</span> wealth, / it is bizarre that wealthy aristocratic families / should still be the symbolic heart of modern democratic states.</p>\n<p>顺着英文顺序读：</p>\n<p>即便如此国王和王后无疑也有 <span class=\"mask\">[xxx]</span> / 虽然他们声称自己象征国家团结 / 他们的历史以及有时今天的行为方式 / 体现着过时且 <span class=\"mask\">[xxx]</span> 的特权和 <span class=\"mask\">[xxx]</span> / 当托马斯·皮凯蒂和其他经济学家正在警告 / 不平等上升 / 以及 <span class=\"mask\">[xxx]</span> 财富的力量增加时 / 富有的贵族家庭仍然存在显得奇怪 / 它们仍是现代民主国家的象征核心</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35]],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. Aristocrats’ excessive reliance on inherited wealth.\n\n> 贵族过度依赖继承财富\n\n把A接回题干，它说的是：奇怪的是贵族过度依赖继承财富。\n\nA里的“excessive reliance on inherited wealth”和原文“wealthy aristocratic families”都涉及贵族与财富，因为一个写主动依赖，一个写富有家庭仍处在象征中心，所以回看第四段最后一句。\n\n> It is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n\n原文“wealthy aristocratic families”描述这些家庭富有，并说它们仍是现代民主国家的象征核心；A的“excessive reliance on inherited wealth”却改成贵族主动过度依赖继承财富。奇怪对象和动作不同。\n\n这一段确实同时出现“inherited wealth”和“wealthy aristocratic families”，所以A第一眼会让人停一下。但语法上“it is bizarre that...”后面才是作者明确认定奇怪的整件事：富有贵族家庭仍然是现代民主国家的象征核心。前面的财富力量上升是时代背景，用来加强这种反差，不是被单独点名的怪事。\n\n**贵族家庭仍处在民主国家象征中心，是否等于贵族过度依赖继承财富？**\n\n不等于。原文批评的是其公共象征角色与现代民主不协调，并没有判断贵族怎样依赖财富。\n\n此外，“reliance on inherited wealth”还多出“贵族依赖继承财富”这一主动依赖关系。原文只说继承财富的力量上升，并没有判断这些家庭怎样依赖它。A既把背景当成结论，又补了一个动作。\n\n**第一轮判断：A排除。**","html":"<h3>A. Aristocrats’ excessive reliance on inherited wealth.</h3>\n<blockquote>\n<p>贵族过度依赖继承财富</p>\n</blockquote>\n<p>把A接回题干，它说的是：奇怪的是贵族过度依赖继承财富。</p>\n<p>A里的“excessive reliance on inherited wealth”和原文“wealthy aristocratic families”都涉及贵族与财富，因为一个写主动依赖，一个写富有家庭仍处在象征中心，所以回看第四段最后一句。</p>\n<blockquote>\n<p>It is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<p>原文“wealthy aristocratic families”描述这些家庭富有，并说它们仍是现代民主国家的象征核心；A的“excessive reliance on inherited wealth”却改成贵族主动过度依赖继承财富。奇怪对象和动作不同。</p>\n<p>这一段确实同时出现“inherited wealth”和“wealthy aristocratic families”，所以A第一眼会让人停一下。但语法上“it is bizarre that...”后面才是作者明确认定奇怪的整件事：富有贵族家庭仍然是现代民主国家的象征核心。前面的财富力量上升是时代背景，用来加强这种反差，不是被单独点名的怪事。</p>\n<p><strong>贵族家庭仍处在民主国家象征中心，是否等于贵族过度依赖继承财富？</strong></p>\n<p>不等于。原文批评的是其公共象征角色与现代民主不协调，并没有判断贵族怎样依赖财富。</p>\n<p>此外，“reliance on inherited wealth”还多出“贵族依赖继承财富”这一主动依赖关系。原文只说继承财富的力量上升，并没有判断这些家庭怎样依赖它。A既把背景当成结论，又补了一个动作。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35]],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"option","qid":"23","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“excessive reliance on inherited wealth”和原文“wealthy aristocratic families”都涉及贵族与财富，因为一个写主动依赖，一个写富有家庭仍处在象征中心，所以回看第四段最后一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"wealthy aristocratic families","visibleOptionAnchor":"excessive reliance on inherited wealth"}}}},{"section":"23题","raw":"### B. The role of the **[xxx]** in modern democracies.\n\n> **[xxx]** 在现代民主制度中的角色\n\n把B接回题干，它说的是：奇怪的是贵族在现代民主制度中的角色。\n\nB里的“modern democracies”和原文“symbolic heart of modern democratic states”都指向现代民主制度中的公共位置，因为一个概括角色，一个具体写成象征核心，所以回看第四段最后一句。\n\n> It is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n\n原文“symbolic heart of modern democratic states”明确把bizarre落在富有贵族家庭仍充当民主国家象征核心这件事上；B的“modern democracies”概括的正是这种制度环境，遮挡处所指对象也与贵族一致。\n\n把句子骨架抽出来就是：“it is bizarre that [wealthy aristocratic families] should still be [the symbolic heart] of [modern democratic states]”。B虽然把具体的“象征核心”概括成“role”，但主体、制度环境和作者的“bizarre”评价都保留了。中间那个名词未读清，也不影响它指向贵族群体。\n\n**贵族家庭仍然担当现代民主国家的象征核心，能不能概括为贵族在现代民主制度中的角色很奇怪？**\n\n能。B保留了奇怪对象、制度环境和公共角色三层关系，没有把重点换成财富来源或生活方式。\n\n题干问的是“shown to be odd”，并不要求逐字复现“symbolic heart”。B用“在现代民主中的角色”概括，正好抓住贵族家庭为何在这种制度中仍处于中心位置的反常性。\n\n**第一轮判断：B保留。**","html":"<h3>B. The role of the <span class=\"mask\">[xxx]</span> in modern democracies.</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 在现代民主制度中的角色</p>\n</blockquote>\n<p>把B接回题干，它说的是：奇怪的是贵族在现代民主制度中的角色。</p>\n<p>B里的“modern democracies”和原文“symbolic heart of modern democratic states”都指向现代民主制度中的公共位置，因为一个概括角色，一个具体写成象征核心，所以回看第四段最后一句。</p>\n<blockquote>\n<p>It is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<p>原文“symbolic heart of modern democratic states”明确把bizarre落在富有贵族家庭仍充当民主国家象征核心这件事上；B的“modern democracies”概括的正是这种制度环境，遮挡处所指对象也与贵族一致。</p>\n<p>把句子骨架抽出来就是：“it is bizarre that [wealthy aristocratic families] should still be [the symbolic heart] of [modern democratic states]”。B虽然把具体的“象征核心”概括成“role”，但主体、制度环境和作者的“bizarre”评价都保留了。中间那个名词未读清，也不影响它指向贵族群体。</p>\n<p><strong>贵族家庭仍然担当现代民主国家的象征核心，能不能概括为贵族在现代民主制度中的角色很奇怪？</strong></p>\n<p>能。B保留了奇怪对象、制度环境和公共角色三层关系，没有把重点换成财富来源或生活方式。</p>\n<p>题干问的是“shown to be odd”，并不要求逐字复现“symbolic heart”。B用“在现代民主中的角色”概括，正好抓住贵族家庭为何在这种制度中仍处于中心位置的反常性。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35]],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"option","qid":"23","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“modern democracies”和原文“symbolic heart of modern democratic states”都指向现代民主制度中的公共位置，因为一个概括角色，一个具体写成象征核心，所以回看第四段最后一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"symbolic heart of modern democratic states","visibleOptionAnchor":"modern democracies"}}}},{"section":"23题","raw":"### C. The simple lifestyle of the aristocratic families.\n\n> 贵族家庭的简朴生活方式\n\n把C接回题干，它说的是：奇怪的是贵族家庭生活方式简朴。\n\nC里的“simple lifestyle”和原文“wealthy aristocratic families”都描述贵族家庭的状态，因为一个说简朴，一个说富有并拥有特权，所以回看第四段最后两句。\n\n> Their very history—and sometimes the way they behave today—embodies outdated and **[xxx]** privileges and **[xxx]**. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of **[xxx]** wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.\n\n原文“wealthy aristocratic families”配合特权、不平等和财富力量，呈现的不是简朴；C的“simple lifestyle”在程度上正好反向。\n\n这一项把“wealthy aristocratic families”直接改成“simple lifestyle”，与段内的财富、特权和不平等背景冲突。第五段虽然写成功王室会骑自行车、做日常工作，但那是下一段谈形象管理，而且随后仍说他们是富有家庭；不能把下一段的外在亲民姿态倒灌成第四段的奇怪之处。\n\n**富有且与特权、不平等相连的贵族家庭，能不能说成生活方式简朴？**\n\n不能。C把财富和特权背景改成了简朴生活。\n\n就题干限定的Paragraph 4而言，作者没有称赞或惊讶于简朴生活。相反，反差来自“现代民主国家”与“富有贵族仍居象征中心”并存，C把反差两端都换掉了。\n\n**第一轮判断：C排除。**","html":"<h3>C. The simple lifestyle of the aristocratic families.</h3>\n<blockquote>\n<p>贵族家庭的简朴生活方式</p>\n</blockquote>\n<p>把C接回题干，它说的是：奇怪的是贵族家庭生活方式简朴。</p>\n<p>C里的“simple lifestyle”和原文“wealthy aristocratic families”都描述贵族家庭的状态，因为一个说简朴，一个说富有并拥有特权，所以回看第四段最后两句。</p>\n<blockquote>\n<p>Their very history—and sometimes the way they behave today—embodies outdated and <span class=\"mask\">[xxx]</span> privileges and <span class=\"mask\">[xxx]</span>. At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of <span class=\"mask\">[xxx]</span> wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.</p>\n</blockquote>\n<p>原文“wealthy aristocratic families”配合特权、不平等和财富力量，呈现的不是简朴；C的“simple lifestyle”在程度上正好反向。</p>\n<p>这一项把“wealthy aristocratic families”直接改成“simple lifestyle”，与段内的财富、特权和不平等背景冲突。第五段虽然写成功王室会骑自行车、做日常工作，但那是下一段谈形象管理，而且随后仍说他们是富有家庭；不能把下一段的外在亲民姿态倒灌成第四段的奇怪之处。</p>\n<p><strong>富有且与特权、不平等相连的贵族家庭，能不能说成生活方式简朴？</strong></p>\n<p>不能。C把财富和特权背景改成了简朴生活。</p>\n<p>就题干限定的Paragraph 4而言，作者没有称赞或惊讶于简朴生活。相反，反差来自“现代民主国家”与“富有贵族仍居象征中心”并存，C把反差两端都换掉了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35]],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"option","qid":"23","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“simple lifestyle”和原文“wealthy aristocratic families”都描述贵族家庭的状态，因为一个说简朴，一个说富有并拥有特权，所以回看第四段最后两句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"wealthy aristocratic families","visibleOptionAnchor":"simple lifestyle"}}}},{"section":"23题","raw":"### D. The nobility’s adherence to their privileges.\n\n> 贵族坚持自己的特权\n\n把D接回题干，它说的是：奇怪的是贵族坚持自己的特权。\n\nD里的“adherence to their privileges”和原文“Their very history”都涉及贵族与特权，因为一个说贵族主动坚持，一个说历史本身体现特权，所以回看第四段第二句。\n\n> Their very history—and sometimes the way they behave today—embodies outdated and **[xxx]** privileges and **[xxx]**.\n\n原文“Their very history”说王室历史和某些行为体现特权；D的“adherence to their privileges”却断言贵族主动坚持特权。体现与主动坚持不是同一个动作，而且bizarre最终落在公共象征角色上。\n\n“privileges”确实在段中出现，但主语是王室的历史和有时的行为，它们“embodies”这些特权与不平等。D要求的是贵族主动“adherence”，也就是明知如此仍坚持特权；原句没有写这种意志或选择。更重要的是，“bizarre”所在的最后一句把评价落到他们在民主国家中的象征地位。\n\n**历史体现特权，是否足以说明贵族主动坚持这些特权就是文中所说的奇怪之处？**\n\n不能。D补入了主动坚持的动作，也没有对到最后一句的民主国家象征角色。\n\n因此D只抓到了段内一个负面词，却没有保留它与作者最终评价之间的句法关系。若把D当答案，就会把“特权是问题背景”误成“坚持特权本身就是题干所问的odd”。\n\n**第一轮判断：D排除。**","html":"<h3>D. The nobility’s adherence to their privileges.</h3>\n<blockquote>\n<p>贵族坚持自己的特权</p>\n</blockquote>\n<p>把D接回题干，它说的是：奇怪的是贵族坚持自己的特权。</p>\n<p>D里的“adherence to their privileges”和原文“Their very history”都涉及贵族与特权，因为一个说贵族主动坚持，一个说历史本身体现特权，所以回看第四段第二句。</p>\n<blockquote>\n<p>Their very history—and sometimes the way they behave today—embodies outdated and <span class=\"mask\">[xxx]</span> privileges and <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>原文“Their very history”说王室历史和某些行为体现特权；D的“adherence to their privileges”却断言贵族主动坚持特权。体现与主动坚持不是同一个动作，而且bizarre最终落在公共象征角色上。</p>\n<p>“privileges”确实在段中出现，但主语是王室的历史和有时的行为，它们“embodies”这些特权与不平等。D要求的是贵族主动“adherence”，也就是明知如此仍坚持特权；原句没有写这种意志或选择。更重要的是，“bizarre”所在的最后一句把评价落到他们在民主国家中的象征地位。</p>\n<p><strong>历史体现特权，是否足以说明贵族主动坚持这些特权就是文中所说的奇怪之处？</strong></p>\n<p>不能。D补入了主动坚持的动作，也没有对到最后一句的民主国家象征角色。</p>\n<p>因此D只抓到了段内一个负面词，却没有保留它与作者最终评价之间的句法关系。若把D当答案，就会把“特权是问题背景”误成“坚持特权本身就是题干所问的odd”。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35]],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"option","qid":"23","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“adherence to their privileges”和原文“Their very history”都涉及贵族与特权，因为一个说贵族主动坚持，一个说历史本身体现特权，所以回看第四段第二句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Their very history","visibleOptionAnchor":"adherence to their privileges"}}}},{"section":"23题","raw":"### 23题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **23题选B。**","html":"<h3>23题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>23题选B。</strong></p>\n</blockquote>\n","articleRects":[[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35]],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"result","qid":"23"}},{"section":"24题","raw":"## 24题\n\n> The British royals “have most to fear” because Charles ______.  \n> 英国王室“最需要担心”，是因为查尔斯怎么样？\n\n题干同时给出British和Charles。第六段先说英国王室最需要担心，下一段马上解释查尔斯的问题；两段分别承接现象和原因，所以按顺序完整读第六、七段。\n\n> 原文参考：\n>\n> While Europe’s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.\n>\n> 开始精读：\n>\n> While Europe’s monarchies will no doubt be smart enough / to survive for some time to come, / it is the British royals / who have most to fear from the Spanish example.\n>\n> 顺着英文顺序读：\n>\n> 虽然欧洲君主制无疑会足够聪明 / 从而在未来一段时间继续存续 / 但真正是英国王室 / 最应该害怕西班牙这个例子\n\n> 原文参考：\n>\n> It is only the Queen who has **[xxx]** the monarchy’s reputation with her rather ordinary (if well-heeled) granny style. The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty **[xxx]** view of the world. He has failed to understand that monarchies have largely survived because they provide a service—as non-controversial and **[xxx]** heads of state. Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy’s worst enemies.\n>\n> 开始精读：\n>\n> It is only the Queen / who has **[xxx]** the monarchy’s reputation / with her rather ordinary (if well-heeled) granny style. / The danger will come with Charles, / who has both an expensive taste of lifestyle / and a pretty **[xxx]** view of the world. / He has failed to understand / that monarchies have largely survived / because they provide a service—as non-controversial and **[xxx]** heads of state. / Charles ought to know that as English history shows, / it is kings, not republicans, / who are the monarchy’s worst enemies.\n>\n> 顺着英文顺序读：\n>\n> 只有女王 / 用她相当普通的外祖母风格 **[xxx]** 王室声誉 / 虽然这种风格也很富足 / 危险将随着查尔斯到来 / 他既有昂贵的生活品味 / 也有一种相当 **[xxx]** 的世界观 / 他没有理解 / 君主制之所以大体得以存续 / 是因为它们作为无争议且 **[xxx]** 的国家元首提供服务 / 查尔斯应该从英国历史明白 / 王室的敌人是国王而不是共和派 / 他们才是王室最坏的敌人\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>24题</h2>\n<blockquote>\n<p>The British royals “have most to fear” because Charles ______.<br />\n英国王室“最需要担心”，是因为查尔斯怎么样？</p>\n</blockquote>\n<p>题干同时给出British和Charles。第六段先说英国王室最需要担心，下一段马上解释查尔斯的问题；两段分别承接现象和原因，所以按顺序完整读第六、七段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>While Europe’s monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.</p>\n<p>开始精读：</p>\n<p>While Europe’s monarchies will no doubt be smart enough / to survive for some time to come, / it is the British royals / who have most to fear from the Spanish example.</p>\n<p>顺着英文顺序读：</p>\n<p>虽然欧洲君主制无疑会足够聪明 / 从而在未来一段时间继续存续 / 但真正是英国王室 / 最应该害怕西班牙这个例子</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>It is only the Queen who has <span class=\"mask\">[xxx]</span> the monarchy’s reputation with her rather ordinary (if well-heeled) granny style. The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty <span class=\"mask\">[xxx]</span> view of the world. He has failed to understand that monarchies have largely survived because they provide a service—as non-controversial and <span class=\"mask\">[xxx]</span> heads of state. Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy’s worst enemies.</p>\n<p>开始精读：</p>\n<p>It is only the Queen / who has <span class=\"mask\">[xxx]</span> the monarchy’s reputation / with her rather ordinary (if well-heeled) granny style. / The danger will come with Charles, / who has both an expensive taste of lifestyle / and a pretty <span class=\"mask\">[xxx]</span> view of the world. / He has failed to understand / that monarchies have largely survived / because they provide a service—as non-controversial and <span class=\"mask\">[xxx]</span> heads of state. / Charles ought to know that as English history shows, / it is kings, not republicans, / who are the monarchy’s worst enemies.</p>\n<p>顺着英文顺序读：</p>\n<p>只有女王 / 用她相当普通的外祖母风格 <span class=\"mask\">[xxx]</span> 王室声誉 / 虽然这种风格也很富足 / 危险将随着查尔斯到来 / 他既有昂贵的生活品味 / 也有一种相当 <span class=\"mask\">[xxx]</span> 的世界观 / 他没有理解 / 君主制之所以大体得以存续 / 是因为它们作为无争议且 <span class=\"mask\">[xxx]</span> 的国家元首提供服务 / 查尔斯应该从英国历史明白 / 王室的敌人是国王而不是共和派 / 他们才是王室最坏的敌人</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"question","qid":"24"}},{"section":"24题","raw":"### A. takes a tough line on political issues\n\n> 在政治问题上采取强硬立场\n\n把A接回题干，它说的是：查尔斯在政治问题上采取强硬立场。\n\nA里的“takes a tough line on political issues”和原文“provide a service”都在说明未来君主应怎样处理政治关系，因为一个强调强硬介入，一个强调提供非争议服务，所以回看第七段第三句。\n\n> He has failed to understand that monarchies have largely survived because they provide a service—as non-controversial and **[xxx]** heads of state.\n\n原文“provide a service”把君主的存续理由写成担任非争议的国家元首；A的“takes a tough line on political issues”却把角色观念换成政治立场强硬。原文说他不理解角色，不是说他已经采取某条强硬政策。\n\n查尔斯有一种被评价为某种性质的“view of the world”，这可能让人联想到政治立场，但原文没有写他在任何具体议题上采取“tough line”。作者明确担心的是他没有理解现代君主应以“non-controversial”国家元首身份提供服务。A把一种世界观和角色误解，推进成了已经发生的强硬政治行动。\n\n**不理解君主应提供中立服务，是否就等于已经在政治议题上采取强硬路线？**\n\n不等于。A把角色观念问题改成了具体政治行动。\n\n如果A成立，至少要看到他公开介入某项政治争论、坚持某项政策或与反对者对抗。现有句子只交代生活品味、世界观和理解不足，动作层面没有到“takes a tough line”。\n\n**第一轮判断：A排除。**","html":"<h3>A. takes a tough line on political issues</h3>\n<blockquote>\n<p>在政治问题上采取强硬立场</p>\n</blockquote>\n<p>把A接回题干，它说的是：查尔斯在政治问题上采取强硬立场。</p>\n<p>A里的“takes a tough line on political issues”和原文“provide a service”都在说明未来君主应怎样处理政治关系，因为一个强调强硬介入，一个强调提供非争议服务，所以回看第七段第三句。</p>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service—as non-controversial and <span class=\"mask\">[xxx]</span> heads of state.</p>\n</blockquote>\n<p>原文“provide a service”把君主的存续理由写成担任非争议的国家元首；A的“takes a tough line on political issues”却把角色观念换成政治立场强硬。原文说他不理解角色，不是说他已经采取某条强硬政策。</p>\n<p>查尔斯有一种被评价为某种性质的“view of the world”，这可能让人联想到政治立场，但原文没有写他在任何具体议题上采取“tough line”。作者明确担心的是他没有理解现代君主应以“non-controversial”国家元首身份提供服务。A把一种世界观和角色误解，推进成了已经发生的强硬政治行动。</p>\n<p><strong>不理解君主应提供中立服务，是否就等于已经在政治议题上采取强硬路线？</strong></p>\n<p>不等于。A把角色观念问题改成了具体政治行动。</p>\n<p>如果A成立，至少要看到他公开介入某项政治争论、坚持某项政策或与反对者对抗。现有句子只交代生活品味、世界观和理解不足，动作层面没有到“takes a tough line”。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"option","qid":"24","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“takes a tough line on political issues”和原文“provide a service”都在说明未来君主应怎样处理政治关系，因为一个强调强硬介入，一个强调提供非争议服务，所以回看第七段第三句。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"provide a service","visibleOptionAnchor":"takes a tough line on political issues"}}}},{"section":"24题","raw":"### B. fails to change his lifestyle as advised\n\n> 没有按照建议改变生活方式\n\n把B接回题干，它说的是：查尔斯没有按照建议改变自己的生活方式。\n\nB里的“as advised”和原文“an expensive taste of lifestyle”都碰到生活方式，因为一个强调未听从建议改变，一个只是描述昂贵品味，所以回看第七段第二句。\n\n> The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty **[xxx]** view of the world.\n\n原文“an expensive taste of lifestyle”只是列出查尔斯的生活品味；B的“as advised”多了有人给过改变建议以及他拒绝执行。原文没有这条建议关系。\n\n“昂贵的生活品味”能和“lifestyle”对上，但B后半的“as advised”要求文中还出现一次明确建议：有人告诉查尔斯应怎样改变，而他没有照做。第七段没有这条劝告链；前一段写成功王室一般会隐藏旧式作风，也不是对查尔斯个人发出的具体建议。\n\n**拥有昂贵生活品味，是否等于有人劝他改变而他没有照做？**\n\n不能。B多加了一次建议和拒绝改变的过程。\n\n即使读者可以推测他应该学习女王或其他王室，也不能把这种推测写成已经被建议却拒绝改变。B把静态特征补成了一段“建议—不执行”的过程。\n\n**第一轮判断：B排除。**","html":"<h3>B. fails to change his lifestyle as advised</h3>\n<blockquote>\n<p>没有按照建议改变生活方式</p>\n</blockquote>\n<p>把B接回题干，它说的是：查尔斯没有按照建议改变自己的生活方式。</p>\n<p>B里的“as advised”和原文“an expensive taste of lifestyle”都碰到生活方式，因为一个强调未听从建议改变，一个只是描述昂贵品味，所以回看第七段第二句。</p>\n<blockquote>\n<p>The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty <span class=\"mask\">[xxx]</span> view of the world.</p>\n</blockquote>\n<p>原文“an expensive taste of lifestyle”只是列出查尔斯的生活品味；B的“as advised”多了有人给过改变建议以及他拒绝执行。原文没有这条建议关系。</p>\n<p>“昂贵的生活品味”能和“lifestyle”对上，但B后半的“as advised”要求文中还出现一次明确建议：有人告诉查尔斯应怎样改变，而他没有照做。第七段没有这条劝告链；前一段写成功王室一般会隐藏旧式作风，也不是对查尔斯个人发出的具体建议。</p>\n<p><strong>拥有昂贵生活品味，是否等于有人劝他改变而他没有照做？</strong></p>\n<p>不能。B多加了一次建议和拒绝改变的过程。</p>\n<p>即使读者可以推测他应该学习女王或其他王室，也不能把这种推测写成已经被建议却拒绝改变。B把静态特征补成了一段“建议—不执行”的过程。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"option","qid":"24","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“as advised”和原文“an expensive taste of lifestyle”都碰到生活方式，因为一个强调未听从建议改变，一个只是描述昂贵品味，所以回看第七段第二句。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"an expensive taste of lifestyle","visibleOptionAnchor":"as advised"}}}},{"section":"24题","raw":"### C. takes republicans as his potential allies\n\n> 把共和派视为潜在盟友\n\n把C接回题干，它说的是：查尔斯把共和派视为潜在盟友。\n\nC里的“potential allies”和原文“not republicans”都写共和派与王室的关系，因为一个说潜在盟友，一个明确把共和派排除在最大敌人之外，所以回看第七段最后一句。\n\n> Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy’s worst enemies.\n\n原文“not republicans”只说王室最坏的敌人不是共和派，而是国王自己；C的“potential allies”却把“不一定是最大敌人”推成“潜在盟友”。关系被过度反转。\n\n最后一句采用“kings, not republicans”的对照，只是在指出王室最大的危险可能来自国王自身行为，而不是共和派。这个判断削弱了共和派作为“worst enemies”的程度，却没有把关系翻成盟友，更没有说查尔斯主动把他们看作盟友。\n\n**不是王室最坏的敌人，能不能直接等于查尔斯把共和派当作潜在盟友？**\n\n不能。非最大敌人不自动成为盟友，原文也没有写查尔斯的盟友判断。\n\n“不是最坏敌人”中间还存在普通对手、中立者、批评者等多种可能。C一步跨到“potential allies”，同时补入查尔斯的主观认定，原文没有这两层信息。\n\n**第一轮判断：C排除。**","html":"<h3>C. takes republicans as his potential allies</h3>\n<blockquote>\n<p>把共和派视为潜在盟友</p>\n</blockquote>\n<p>把C接回题干，它说的是：查尔斯把共和派视为潜在盟友。</p>\n<p>C里的“potential allies”和原文“not republicans”都写共和派与王室的关系，因为一个说潜在盟友，一个明确把共和派排除在最大敌人之外，所以回看第七段最后一句。</p>\n<blockquote>\n<p>Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy’s worst enemies.</p>\n</blockquote>\n<p>原文“not republicans”只说王室最坏的敌人不是共和派，而是国王自己；C的“potential allies”却把“不一定是最大敌人”推成“潜在盟友”。关系被过度反转。</p>\n<p>最后一句采用“kings, not republicans”的对照，只是在指出王室最大的危险可能来自国王自身行为，而不是共和派。这个判断削弱了共和派作为“worst enemies”的程度，却没有把关系翻成盟友，更没有说查尔斯主动把他们看作盟友。</p>\n<p><strong>不是王室最坏的敌人，能不能直接等于查尔斯把共和派当作潜在盟友？</strong></p>\n<p>不能。非最大敌人不自动成为盟友，原文也没有写查尔斯的盟友判断。</p>\n<p>“不是最坏敌人”中间还存在普通对手、中立者、批评者等多种可能。C一步跨到“potential allies”，同时补入查尔斯的主观认定，原文没有这两层信息。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"option","qid":"24","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“potential allies”和原文“not republicans”都写共和派与王室的关系，因为一个说潜在盟友，一个明确把共和派排除在最大敌人之外，所以回看第七段最后一句。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"not republicans","visibleOptionAnchor":"potential allies"}}}},{"section":"24题","raw":"### D. fails to **[xxx]** himself to his future role\n\n> 没有使自己 **[xxx]** 未来角色\n\n把D接回题干，它说的是：查尔斯没有让自己适应未来要承担的角色。\n\nD里的“future role”和原文“failed to understand that monarchies have largely survived”都在谈查尔斯对未来君主职责的准备，因为一个概括适应角色，一个指出他不理解存续所需职责，所以回看第七段第三句。\n\n> He has failed to understand that monarchies have largely survived because they provide a service—as non-controversial and **[xxx]** heads of state.\n\n原文“failed to understand that monarchies have largely survived”说明查尔斯没有理解现代君主作为服务性国家元首的条件；D的“future role”正把这件事概括为他没有适应将来的君主角色。遮挡处是适应动作，但两端关系一致。\n\n第七段把查尔斯的问题连在一起：昂贵生活品味、某种世界观，以及“failed to understand”君主为何能存续。真正关键的是，他没有理解未来国王应当提供一种少争议、非政治化的公共服务。D用“future role”把这些具体问题收束为对即将承担角色的不适应，范围比单一生活方式更完整。\n\n**没有理解现代君主必须怎样履职，能不能归入没有适应未来角色？**\n\n能。D没有把原因缩成单一生活习惯，而是概括了查尔斯对整个君主职责的误解。\n\n中间的动作词虽然没读清，但句型“fails to ... himself to his future role”清楚表示自身与未来角色没有匹配好。这与原文的理解失败同向，也能解释为什么英国王室从他这里感到危险。\n\n**第一轮判断：D保留。**","html":"<h3>D. fails to <span class=\"mask\">[xxx]</span> himself to his future role</h3>\n<blockquote>\n<p>没有使自己 <span class=\"mask\">[xxx]</span> 未来角色</p>\n</blockquote>\n<p>把D接回题干，它说的是：查尔斯没有让自己适应未来要承担的角色。</p>\n<p>D里的“future role”和原文“failed to understand that monarchies have largely survived”都在谈查尔斯对未来君主职责的准备，因为一个概括适应角色，一个指出他不理解存续所需职责，所以回看第七段第三句。</p>\n<blockquote>\n<p>He has failed to understand that monarchies have largely survived because they provide a service—as non-controversial and <span class=\"mask\">[xxx]</span> heads of state.</p>\n</blockquote>\n<p>原文“failed to understand that monarchies have largely survived”说明查尔斯没有理解现代君主作为服务性国家元首的条件；D的“future role”正把这件事概括为他没有适应将来的君主角色。遮挡处是适应动作，但两端关系一致。</p>\n<p>第七段把查尔斯的问题连在一起：昂贵生活品味、某种世界观，以及“failed to understand”君主为何能存续。真正关键的是，他没有理解未来国王应当提供一种少争议、非政治化的公共服务。D用“future role”把这些具体问题收束为对即将承担角色的不适应，范围比单一生活方式更完整。</p>\n<p><strong>没有理解现代君主必须怎样履职，能不能归入没有适应未来角色？</strong></p>\n<p>能。D没有把原因缩成单一生活习惯，而是概括了查尔斯对整个君主职责的误解。</p>\n<p>中间的动作词虽然没读清，但句型“fails to ... himself to his future role”清楚表示自身与未来角色没有匹配好。这与原文的理解失败同向，也能解释为什么英国王室从他这里感到危险。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"option","qid":"24","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“future role”和原文“failed to understand that monarchies have largely survived”都在谈查尔斯对未来君主职责的准备，因为一个概括适应角色，一个指出他不理解存续所需职责，所以回看第七段第三句。"],"evidenceParagraphPids":[5,6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"failed to understand that monarchies have largely survived","visibleOptionAnchor":"future role"}}}},{"section":"24题","raw":"### 24题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **24题选D。**","html":"<h3>24题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>24题选D。</strong></p>\n</blockquote>\n","articleRects":[[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"result","qid":"24"}},{"section":"25题","raw":"## 25题\n\n**Which of the following is the best title of the text?**\n\n下面哪一个是本文最佳标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Carlos, Glory and Disgrace Combined**\n\n卡洛斯：荣耀与耻辱并存\n\nB. **Charles, Anxious to Succeed to the Throne**\n\n查尔斯：急于继承王位\n\nC. **Carlos, a Lesson for All European Monarchs**\n\n卡洛斯：给所有欧洲君主的一课\n\nD. **Charles, Slow to React to the Coming Threats**\n\n查尔斯：对即将到来的威胁反应迟缓","html":"<h2>25题</h2>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<p>下面哪一个是本文最佳标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Carlos, Glory and Disgrace Combined</strong></p>\n<p>卡洛斯：荣耀与耻辱并存</p>\n<p>B. <strong>Charles, Anxious to Succeed to the Throne</strong></p>\n<p>查尔斯：急于继承王位</p>\n<p>C. <strong>Carlos, a Lesson for All European Monarchs</strong></p>\n<p>卡洛斯：给所有欧洲君主的一课</p>\n<p>D. <strong>Charles, Slow to React to the Coming Threats</strong></p>\n<p>查尔斯：对即将到来的威胁反应迟缓</p>\n","articleRects":[],"questionRects":[[133,1480,751,35],[183,1539,573,35],[183,1597,638,35],[184,1656,659,35],[183,1715,682,35]],"meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 写卡洛斯在丑闻和共和派声势上升后退位，并追问西班牙危机是否预示君主制衰亡 | 先摆出一个出问题的具体例子 |\n| 2 | 说明西班牙案例既能支持也能反对君主制，君主在公众分裂时可代表国家团结 | 再承认这类东西也有它的用处 |\n| 3 | 解释欧洲王室仍能担任国家元首，是因为选民不必另找一个少争议且受尊敬的人物 | 接着解释它为什么还能留下来 |\n| 4 | 转写君主制的缺点：历史特权、不平等与现代民主国家的象征位置发生冲突 | 然后转过来写它带来的麻烦 |\n| 5 | 写成功王室努力淡化旧贵族形象，但财富和媒体介入使合适形象越来越难维持 | 再写人们怎样努力维持表面 |\n| 6 | 把西班牙案例转向英国，指出英国王室最应从中感到警惕 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 说明女王维持了声誉，而查尔斯不理解现代君主的服务角色；王室内部人物可能成为最大麻烦 | 最后说问题其实来自内部 |\n\n先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>写卡洛斯在丑闻和共和派声势上升后退位，并追问西班牙危机是否预示君主制衰亡</td>\n  <td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明西班牙案例既能支持也能反对君主制，君主在公众分裂时可代表国家团结</td>\n  <td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>解释欧洲王室仍能担任国家元首，是因为选民不必另找一个少争议且受尊敬的人物</td>\n  <td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>转写君主制的缺点：历史特权、不平等与现代民主国家的象征位置发生冲突</td>\n  <td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>写成功王室努力淡化旧贵族形象，但财富和媒体介入使合适形象越来越难维持</td>\n  <td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>把西班牙案例转向英国，指出英国王室最应从中感到警惕</td>\n  <td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>说明女王维持了声誉，而查尔斯不理解现代君主的服务角色；王室内部人物可能成为最大麻烦</td>\n  <td>最后说问题其实来自内部</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36],[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35],[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35],[177,1109,1042,28],[111,1151,1109,36],[111,1194,1106,37],[112,1239,1107,35],[111,1282,94,35],[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1480,751,35],[183,1539,573,35],[183,1597,638,35],[184,1656,659,35],[183,1715,682,35]],"meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"### A. Carlos, Glory and Disgrace Combined\n\n> 卡洛斯：荣耀与耻辱并存\n\n如果A是主旨，全文每一段都应当沿着A所规定的中心推进。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 详细回顾卡洛斯一生的荣耀与声望 | 先摆出一个出问题的具体例子 |\n| 2 | 继续列出他对西班牙国家团结的个人功绩 | 再承认这类东西也有它的用处 |\n| 3 | 解释他的荣耀怎样积累并达到高峰 | 接着解释它为什么还能留下来 |\n| 4 | 转写个人丑闻怎样毁掉这些荣耀 | 然后转过来写它带来的麻烦 |\n| 5 | 再比较荣耀与耻辱在他身上的比例 | 再写人们怎样努力维持表面 |\n| 6 | 继续回到卡洛斯本人承受的名誉损失 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 最后评价卡洛斯个人生涯的功过 | 最后说问题其实来自内部 |\n\n文章只在开头借卡洛斯退位引出问题，后面大部分篇幅转向君主制的一般作用、缺点和英国王室。A要求全文围绕卡洛斯个人荣耀与耻辱展开，覆盖不了中后段。\n\n再看篇幅分配，卡洛斯只在第一段承担引子功能，第二段以后作者几乎不再追踪他的个人经历。文章没有写他的早年荣耀、统治成就、丑闻细节或个人名誉起伏；如果标题以“Glory and Disgrace Combined”为中心，中间至少应有大量个人传记材料。\n\n结尾也没有回到卡洛斯作功过评判，而是把镜头转到英国王室和查尔斯。开头的人物与结尾的人物变化说明，作者借西班牙案例讨论的是更广泛的君主制问题，不是给卡洛斯写人物小传。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. Carlos, Glory and Disgrace Combined</h3>\n<blockquote>\n<p>卡洛斯：荣耀与耻辱并存</p>\n</blockquote>\n<p>如果A是主旨，全文每一段都应当沿着A所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>详细回顾卡洛斯一生的荣耀与声望</td>\n  <td>先摆出一个出问题的具体例子</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>继续列出他对西班牙国家团结的个人功绩</td>\n  <td>再承认这类东西也有它的用处</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>解释他的荣耀怎样积累并达到高峰</td>\n  <td>接着解释它为什么还能留下来</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>转写个人丑闻怎样毁掉这些荣耀</td>\n  <td>然后转过来写它带来的麻烦</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再比较荣耀与耻辱在他身上的比例</td>\n  <td>再写人们怎样努力维持表面</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>继续回到卡洛斯本人承受的名誉损失</td>\n  <td>再把前面的例子变成对另一边的提醒</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后评价卡洛斯个人生涯的功过</td>\n  <td>最后说问题其实来自内部</td>\n</tr>\n</tbody>\n</table>\n<p>文章只在开头借卡洛斯退位引出问题，后面大部分篇幅转向君主制的一般作用、缺点和英国王室。A要求全文围绕卡洛斯个人荣耀与耻辱展开，覆盖不了中后段。</p>\n<p>再看篇幅分配，卡洛斯只在第一段承担引子功能，第二段以后作者几乎不再追踪他的个人经历。文章没有写他的早年荣耀、统治成就、丑闻细节或个人名誉起伏；如果标题以“Glory and Disgrace Combined”为中心，中间至少应有大量个人传记材料。</p>\n<p>结尾也没有回到卡洛斯作功过评判，而是把镜头转到英国王室和查尔斯。开头的人物与结尾的人物变化说明，作者借西班牙案例讨论的是更广泛的君主制问题，不是给卡洛斯写人物小传。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36],[177,416,1042,36],[111,460,1108,35],[111,498,1110,45],[111,546,197,36],[188,590,1020,35],[111,633,1108,35],[111,675,1107,36],[111,718,1110,37],[111,763,1108,35],[111,806,954,35],[177,849,1044,35],[111,893,1108,35],[111,936,1100,35],[111,979,1108,35],[111,1022,1108,35],[112,1066,1099,35],[177,1109,1042,28],[111,1151,1109,36],[111,1194,1106,37],[112,1239,1107,35],[111,1282,94,35],[177,1325,1043,35],[112,1368,1108,36],[111,1412,124,35],[177,1455,1042,35],[110,1497,1108,37],[111,1541,1108,36],[111,1585,1108,35],[112,1628,1107,35],[111,1671,1103,36],[111,1714,771,36]],"questionRects":[[133,1480,751,35],[183,1539,573,35],[183,1597,638,35],[184,1656,659,35],[183,1715,682,35]],"meta":{"kind":"main_option","qid":"25","option":"A"}},{"section":"25题","raw":"### B. Charles, Anxious to Succeed to the Throne\n\n> 查尔斯：急于继承王位\n\n如果B是主旨，全文每一段都应当沿着B所规定的中心推进。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写查尔斯接近王位时的焦虑 | 先摆出一个出问题的具体例子 |\n| 2 | 再写他为什么急于成为国王 | 再承认这类东西也有它的用处 |\n| 3 | 接着解释继位计划怎样推进 | 接着解释它为什么还能留下来 |\n| 4 | 然后写竞争或阻力带来的麻烦 | 然后转过来写它带来的麻烦 |\n| 5 | 再写他怎样为继位塑造形象 | 再写人们怎样努力维持表面 |\n| 6 | 把西班牙案例当成加快继位的刺激 | 再把前面的例子变成对另一边的提醒 |\n| 7 | 最后写他是否成功登上王位 | 最后说问题其实来自内部 |\n\n全文没有讨论查尔斯急于继位，也没有继位竞争或焦虑过程。B把结尾出现
