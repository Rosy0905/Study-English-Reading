<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**According to the first two paragraphs, King Juan Carlos of Spain ______.**\n\n> 根据前两段，西班牙国王胡安·卡洛斯怎么样？\n\n题型：**具体细节题**。\n\n---","html":"<h2>21题题干</h2>\n<p><strong>According to the first two paragraphs, King Juan Carlos of Spain ______.</strong></p>\n<blockquote>\n<p>根据前两段，西班牙国王胡安·卡洛斯怎么样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,71,1065,36],[183,129,503,36],[183,188,570,36],[184,247,538,35],[183,306,503,35]],"meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**Monarchs are kept as heads of state in Europe mostly ______.**\n\n> 欧洲大多保留君主作为国家元首，主要是因为什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>22题题干</h2>\n<p><strong>Monarchs are kept as heads of state in Europe mostly ______.</strong></p>\n<blockquote>\n<p>欧洲大多保留君主作为国家元首，主要是因为什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,423,784,35],[183,482,692,35],[183,540,721,36],[183,599,695,36],[183,658,655,35]],"meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**Which of the following is shown to be odd, according to Paragraph 4?**\n\n> 根据第四段，下面哪一项被认为很奇怪？\n\n题型：**具体细节题**。\n\n---","html":"<h2>23题题干</h2>\n<p><strong>Which of the following is shown to be odd, according to Paragraph 4?</strong></p>\n<blockquote>\n<p>根据第四段，下面哪一项被认为很奇怪？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,775,1022,36],[183,834,733,29],[183,893,696,35],[184,952,686,35],[183,1010,638,36]],"meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**The British royals “have most to fear” because Charles ______.**\n\n> 英国王室“最需要担心”，是因为查尔斯怎么样？\n\n题型：**因果细节题**。\n\n---","html":"<h2>24题题干</h2>\n<p><strong>The British royals “have most to fear” because Charles ______.</strong></p>\n<blockquote>\n<p>英国王室“最需要担心”，是因为查尔斯怎么样？</p>\n</blockquote>\n<p>题型：<strong>因果细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,1126,812,37],[183,1186,542,36],[183,1245,563,35],[184,1304,572,35],[183,1363,574,35]],"meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**Which of the following is the best title of the text?**\n\n> 下面哪一个是本文最佳标题？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>25题题干</h2>\n<p><strong>Which of the following is the best title of the text?</strong></p>\n<blockquote>\n<p>下面哪一个是本文最佳标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[133,1480,751,35],[183,1539,573,35],[183,1597,638,35],[184,1656,659,35],[183,1715,682,35]],"meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, Even so, While |\n| 态度词 / 评价词 | 先抓个大概好坏 | bizarre, difficult, worst |\n| 动作词 | 先看谁做了什么 | stand down, survived, provide |\n| 结果词 | 看最后出了什么事 | forced, survived, fear |\n| 重复主题词 | 大概知道老在说什么 | monarchy, royals, public figure, Charles |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>But, Even so, While</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>bizarre, difficult, worst</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>stand down, survived, provide</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>forced, survived, fear</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>monarchy, royals, public figure, Charles</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"King Juan Carlos of Spain once insisted “kings don’t **[xxx]**, they die in their sleep.” But **[xxx]** scandals and the popularity of the **[xxx]** left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their **[xxx]** uniforms and majestic lifestyles?","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>King Juan Carlos of Spain once insisted “kings don’t <span class=\"mask\">[xxx]</span>, they die in their sleep.” But <span class=\"mask\">[xxx]</span> scandals and the popularity of the <span class=\"mask\">[xxx]</span> left in the recent Euro-elections have forced him to eat his words and stand down. So, does the Spanish crisis suggest that monarchy is seeing its last days? Does that mean the writing is on the wall for all European royals, with their <span class=\"mask\">[xxx]</span> uniforms and majestic lifestyles?</p>\n\n</div></div>","articleRects":[[178,156,1041,36],[111,199,1108,37],[111,243,1099,29],[112,287,1106,35],[111,330,1109,35],[111,373,448,36]],"questionRects":[],"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"King Juan Carlos of Spain once insisted / “kings don’t **[xxx]**, / they die in their sleep.” / But **[xxx]** scandals and the popularity of the **[xxx]** left / in the recent Euro-electi
