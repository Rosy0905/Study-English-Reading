<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**According to the first two paragraphs, alloparenting refers to the practice of ______.**\n\n> 根据前两段，alloparenting指什么做法？\n\n题型：**具体细节题**。\n\n---","html":"<h2>26题题干</h2>\n<p><strong>According to the first two paragraphs, alloparenting refers to the practice of ______.</strong></p>\n<blockquote>\n<p>根据前两段，alloparenting指什么做法？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,214,1322,36],[318,282,33,27]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**The scheme in Germany is mentioned to illustrate ______.**\n\n> 文中提到德国的这项计划，是为了说明什么？\n\n题型：**例子作用题**。\n\n---","html":"<h2>27题题干</h2>\n<p><strong>The scheme in Germany is mentioned to illustrate ______.</strong></p>\n<blockquote>\n<p>文中提到德国的这项计划，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,690,870,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**According to Paragraph 4, the “intensive mothering narrative” ______.**\n\n> 根据第4段，“密集母职叙述”有什么特点或后果？\n\n题型：**具体细节题**。\n\n---","html":"<h2>28题题干</h2>\n<p><strong>According to Paragraph 4, the “intensive mothering narrative” ______.</strong></p>\n<blockquote>\n<p>根据第4段，“密集母职叙述”有什么特点或后果？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1097,1080,37]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**What can be inferred about the nurseries in the UK?**\n\n> 关于英国的托儿所，可以推断出什么？\n\n题型：**局部推断题**。\n\n---","html":"<h2>29题题干</h2>\n<p><strong>What can be inferred about the nurseries in the UK?</strong></p>\n<blockquote>\n<p>关于英国的托儿所，可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1507,914,31]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**Which of the following would be the best title for the text?**\n\n> 下面哪一项最适合作为全文标题？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>30题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪一项最适合作为全文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,1027,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | According to, By contrast, but, While |\n| 态度词 / 评价词 | 先抓个大概好坏 | less anxiety, harmful, dangerous, benefit |\n| 动作词 | 先看谁做了什么 | look after, incorporate, reduce, enhance |\n| 结果词 | 看最后出了什么事 | exhaustion, consequences, depression |\n| 重复主题词 | 大概知道老在说什么 | children, parents, caregivers, alloparenting |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>According to, By contrast, but, While</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>less anxiety, harmful, dangerous, benefit</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>look after, incorporate, reduce, enhance</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>exhaustion, consequences, depression</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>children, parents, caregivers, alloparenting</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more **[xxx]** children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in **[xxx]**, is considered the norm.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more <strong>[xxx]</strong> children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</div></div>","articleRects":[[308,313,1240,35],[227,362,1320,35],[227,411,1321,36],[228,460,1320,36],[228,508,1319,37],[228,559,334,27]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more **[xxx]** children, / researchers have suggested. / The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for by many adults. / Kung children as young as four / will help t 孩子，养老院和托儿所怎样配合，母亲独自照顾孩子为什么有危险后果，英国照料者和孩子的数字应该怎样比较，这些还没有读清。粗读时只要能判断“这篇文章大概与孩子、父母和照料办法有关”，并知道这些信息大约出现在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住非洲、很多成年人、德国养老院和托儿所、母亲独自照顾孩子、英国的照料人数和社会发展；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和育儿建议有关，开头出现非洲、每个孩子和很多成年人，后来看到更少的焦虑；中间出现德国的养老院和托儿所、不同年级，接着有母亲独自照顾孩子、有害的和危险后果。后面还看到Efé、父母得到更少的支持、英国的一个照料者和四个孩子，结尾有坐着不动、帮助父母、社会发展。</p>\n<p>到这里还不能自然地说清楚：很多成年人怎么照顾孩子，养老院和托儿所怎样配合，母亲独自照顾孩子为什么有危险后果，英国照料者和孩子的数字应该怎样比较，这些还没有读清。粗读时只要能判断“这篇文章大概与孩子、父母和照料办法有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住非洲、很多成年人、德国养老院和托儿所、母亲独自照顾孩子、英国的照料人数和社会发展；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> According to the first two paragraphs, alloparenting refers to the practice of ______.  \n> 根据前两段，alloparenting指什么做法？\n\n题干明确指定 the first two paragraphs，还给出了要解释的 alloparenting。我们把第1、2段从开头读到结尾，看看 these practices 指前面的哪些做法。\n\n> 原文参考：\n>\n> Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more **[xxx]** children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in **[xxx]**, is considered the norm.\n>\n> 开始精读：\n>\n> Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more **[xxx]** children, / researchers have suggested. / The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for by many adults. / Kung children as young as four / will help to look after / younger ones / and “baby-wearing”, / in which infants are carried / in **[xxx]**, / is considered the norm.\n>\n> 育儿建议 / 从非洲狩猎采集者那里获得的 / 可能是关键 / 对于养育 / 更加 **[xxx]** 的孩子， / 研究人员已经提出。 / 这个想法是建立在 / 对群体的研究之上的 / 例如博茨瓦纳的Kung， / 在那里每一个孩子 / 被很多成年人照顾。 / Kung的孩子小到四岁 / 就会帮忙照顾 / 年幼的孩子 / 而且“把婴儿穿在身上”， / 在其中婴儿被携带 / 在 **[xxx]** 里， / 被认为是常态。\n\n> 原文参考：\n>\n> According to Dr Nikhil Chaudhary, an evolutionary **[xxx]** at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.\n>\n> 开始精读：\n>\n> According to Dr Nikhil Chaudhary, / an evolutionary **[xxx]** / at Cambridge University, / these practices, / known as alloparenting, / could lead to less anxiety / for children and parents.\n>\n> 根据Nikhil Chaudhary博士， / 一位演化方面的 **[xxx]** / 在剑桥大学， / 这些做法， / 被称作alloparenting， / 可能带来更少的焦虑 / 对于孩子和父母。\n\n第2段把前面这些做法叫作 alloparenting。第1段先说一个孩子由很多成年人照顾，又说四岁的孩子帮忙照顾更小的孩子。题目问这个名称所概括的做法，不能只拿其中一个动作当成整个名称。","html":"<h2>26题</h2>\n<blockquote>\n<p>According to the first two paragraphs, alloparenting refers to the practice of ______.<br>根据前两段，alloparenting指什么做法？</p>\n</blockquote>\n<p>题干明确指定 the first two paragraphs，还给出了要解释的 alloparenting。我们把第1、2段从开头读到结尾，看看 these practices 指前面的哪些做法。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more <strong>[xxx]</strong> children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n<p>开始精读：</p>\n<p>Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more <strong>[xxx]</strong> children, / researchers have suggested. / The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for by many adults. / Kung children as young as four / will help to look after / younger ones / and “baby-wearing”, / in which infants are carried / in <strong>[xxx]</strong>, / is considered the norm.</p>\n<p>育儿建议 / 从非洲狩猎采集者那里获得的 / 可能是关键 / 对于养育 / 更加 <strong>[xxx]</strong> 的孩子， / 研究人员已经提出。 / 这个想法是建立在 / 对群体的研究之上的 / 例如博茨瓦纳的Kung， / 在那里每一个孩子 / 被很多成年人照顾。 / Kung的孩子小到四岁 / 就会帮忙照顾 / 年幼的孩子 / 而且“把婴儿穿在身上”， / 在其中婴儿被携带 / 在 <strong>[xxx]</strong> 里， / 被认为是常态。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>According to Dr Nikhil Chaudhary, an evolutionary <strong>[xxx]</strong> at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.</p>\n<p>开始精读：</p>\n<p>According to Dr Nikhil Chaudhary, / an evolutionary <strong>[xxx]</strong> / at Cambridge University, / these practices, / known as alloparenting, / could lead to less anxiety / for children and parents.</p>\n<p>根据Nikhil Chaudhary博士， / 一位演化方面的 <strong>[xxx]</strong> / 在剑桥大学， / 这些做法， / 被称作alloparenting， / 可能带来更少的焦虑 / 对于孩子和父母。</p>\n</blockquote>\n<p>第2段把前面这些做法叫作 alloparenting。第1段先说一个孩子由很多成年人照顾，又说四岁的孩子帮忙照顾更小的孩子。题目问这个名称所概括的做法，不能只拿其中一个动作当成整个名称。</p>\n","articleRects":[[308,313,1240,35],[227,362,1320,35],[227,411,1321,36],[228,460,1320,36],[228,508,1319,37],[228,559,334,27],[308,609,1240,35],[228,654,1319,43],[228,707,521,35]],"questionRects":[[254,214,1322,36],[318,282,33,27]],"scrollTarget":"auto","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. sharing childcare among community members\n\n> 在群体成员之间分担育儿\n\n把A接回题干，它说的是：alloparenting是群体成员共同分担照料孩子。\n\nA的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。\n\n> studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in **[xxx]**, is considered the norm.\n\n原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。\n\n**一个孩子由多人照顾，能否叫作在群体成员之间分担育儿？**\n\n能。很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\n\n**第一轮判断：A保留。**","html":"<h3>A. sharing childcare among community members</h3>\n<blockquote>\n<p>在群体成员之间分担育儿</p>\n</blockquote>\n<p>把A接回题干，它说的是：alloparenting是群体成员共同分担照料孩子。</p>\n<p>A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。</p>\n<blockquote>\n<p>studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</blockquote>\n<p>原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。</p>\n<p><strong>一个孩子由多人照顾，能否叫作在群体成员之间分担育儿？</strong></p>\n<p>能。很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[227,411,1321,36],[228,460,1320,36],[228,508,1319,37],[228,559,334,27]],"questionRects":[[254,214,1322,36],[318,282,33,27],[317,350,789,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"is cared for by many adults","visibleOptionAnchor":"sharing childcare"}}}},{"section":"26题","raw":"### B. **[xxx]** babies to specific adult caregivers\n\n> 把婴儿 **[xxx]** 给特定的成年照料者\n\n把B接回题干，它说的是：alloparenting是把婴儿 **[xxx]** 给特定的成年照料者。\n\nB里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。\n\n> The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\n\n原文的 many adults 说明参与照料的人很多。B的 specific adult caregivers 把注意力放在特定的成年人身上，前面的动作又是 **[xxx]**。目前能读出婴儿和成人照料者之间有某种安排，却读不出具体怎样安排。特定的人不一定只指一个人，也可能指一批照料者，因此不能把 specific 直接翻成“仅有一个”。但B还没有把多人之间如何分担说明白，它和A不是同一种清楚程度。\n\n**many adults能让我们断定B中尚未读清的安排一定错误吗？**\n\n还不能。B并没有明说只许一人照顾，而它到底怎样安排这些成年人也没有读清，因此暂时把这个说法留下。\n\n**第一轮判断：B保留。**","html":"<h3>B. <strong>[xxx]</strong> babies to specific adult caregivers</h3>\n<blockquote>\n<p>把婴儿 <strong>[xxx]</strong> 给特定的成年照料者</p>\n</blockquote>\n<p>把B接回题干，它说的是：alloparenting是把婴儿 <strong>[xxx]</strong> 给特定的成年照料者。</p>\n<p>B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。</p>\n<blockquote>\n<p>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.</p>\n</blockquote>\n<p>原文的 many adults 说明参与照料的人很多。B的 specific adult caregivers 把注意力放在特定的成年人身上，前面的动作又是 <strong>[xxx]</strong>。目前能读出婴儿和成人照料者之间有某种安排，却读不出具体怎样安排。特定的人不一定只指一个人，也可能指一批照料者，因此不能把 specific 直接翻成“仅有一个”。但B还没有把多人之间如何分担说明白，它和A不是同一种清楚程度。</p>\n<p><strong>many adults能让我们断定B中尚未读清的安排一定错误吗？</strong></p>\n<p>还不能。B并没有明说只许一人照顾，而它到底怎样安排这些成年人也没有读清，因此暂时把这个说法留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[227,362,1320,35],[227,411,1321,36],[228,460,1320,36]],"questionRects":[[254,214,1322,36],[318,282,33,27],[318,418,752,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"many adults","visibleOptionAnchor":"specific adult caregivers"}}}},{"section":"26题","raw":"### C. teaching parenting skills to older children\n\n> 向年长的孩子教授育儿技能\n\n把C接回题干，它说的是：alloparenting指向年长孩子传授育儿技能。\n\nC中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。\n\n> Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in **[xxx]**, is considered the norm.\n\n原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。\n\n**年长孩子帮助照料，等不等于有人向他们教授育儿技能？**\n\n不等于。原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。\n\n**第一轮判断：C排除。**","html":"<h3>C. teaching parenting skills to older children</h3>\n<blockquote>\n<p>向年长的孩子教授育儿技能</p>\n</blockquote>\n<p>把C接回题干，它说的是：alloparenting指向年长孩子传授育儿技能。</p>\n<p>C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。</p>\n<blockquote>\n<p>Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</blockquote>\n<p>原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。</p>\n<p><strong>年长孩子帮助照料，等不等于有人向他们教授育儿技能？</strong></p>\n<p>不等于。原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[228,460,1320,36],[228,508,1319,37],[228,559,334,27]],"questionRects":[[254,214,1322,36],[318,282,33,27],[318,486,717,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","action_direction"],"visibleSourceAnchor":"Kung children as young as four","visibleOptionAnchor":"older children"}}}},{"section":"26题","raw":"### D. carrying infants around by their parents\n\n> 由父母带着婴儿到处走\n\n把D接回题干，它说的是：alloparenting就是父母带着婴儿到处走。\n\nD的 carrying infants 会让我们找到第1段 infants are carried，两处都写携带婴儿，所以回看 baby-wearing 所在的句子，并联系前面的 many adults。\n\n> studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in **[xxx]**, is considered the norm.\n\n原文的 infants are carried 确实介绍携带婴儿的一种方式，但它跟在年长孩子帮助照料后面，只是 these practices 中的一种表现。D用 carrying infants 概括整个名称，而且加上 by their parents，把承担照料的人收缩为父母。第1段明确写了很多成年人和四岁的孩子参与照料；把这种共同参与只解释成父母携带婴儿，丢掉了名称要概括的照料者范围。\n\n**只写父母携带婴儿，能否概括多人参与的这些做法？**\n\n不能。父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。\n\n**第一轮判断：D排除。**","html":"<h3>D. carrying infants around by their parents</h3>\n<blockquote>\n<p>由父母带着婴儿到处走</p>\n</blockquote>\n<p>把D接回题干，它说的是：alloparenting就是父母带着婴儿到处走。</p>\n<p>D的 carrying infants 会让我们找到第1段 infants are carried，两处都写携带婴儿，所以回看 baby-wearing 所在的句子，并联系前面的 many adults。</p>\n<blockquote>\n<p>studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</blockquote>\n<p>原文的 infants are carried 确实介绍携带婴儿的一种方式，但它跟在年长孩子帮助照料后面，只是 these practices 中的一种表现。D用 carrying infants 概括整个名称，而且加上 by their parents，把承担照料的人收缩为父母。第1段明确写了很多成年人和四岁的孩子参与照料；把这种共同参与只解释成父母携带婴儿，丢掉了名称要概括的照料者范围。</p>\n<p><strong>只写父母携带婴儿，能否概括多人参与的这些做法？</strong></p>\n<p>不能。父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,411,1321,36],[228,460,1320,36],[228,508,1319,37],[228,559,334,27]],"questionRects":[[254,214,1322,36],[318,282,33,27],[317,554,686,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 carrying infants 会让我们找到第1段 infants are carried，两处都写携带婴儿，所以回看 baby-wearing 所在的句子，并联系前面的 many adults。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","part_whole"],"visibleSourceAnchor":"infants are carried","visibleOptionAnchor":"carrying infants"}}}},{"section":"26题","raw":"### 26题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B保留；\n- C排除；\n- D排除。\n\nA清楚对应共同分担；B的安排动作尚未读清。C把帮忙者改成受教者，D把多人参与缩成父母携带，先留下A、B。\n\n> **26题暂时留下A和B。**","html":"<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A清楚对应共同分担；B的安排动作尚未读清。C把帮忙者改成受教者，D把多人参与缩成父母携带，先留下A、B。</p>\n<blockquote>\n<p><strong>26题暂时留下A和B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[254,214,1322,36],[318,282,33,27]],"scrollTarget":"auto","meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> The scheme in Germany is mentioned to illustrate ______.  \n> 文中提到德国的这项计划，是为了说明什么？\n\n题干给出了 The scheme in Germany。第3段明确出现 In Germany，例子前面还有 Swanepoel 对 western life 的判断。我们从第3段开头读完，看看这项计划用来说明哪句话。\n\n> 原文参考：\n>\n> Dr Annie Swanepoel, a child **[xxx]**, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement **[xxx]** to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the **[xxx]** mixed-age playgroups in hunter-gatherer communities.\n>\n> 开始精读：\n>\n> Dr Annie Swanepoel, / a child **[xxx]**, / believes that there are ways / to incorporate them / into western life. / In Germany, / one scheme has paired / an old people’s home / with a nursery. / The residents help / to look after the children, / an arrangement **[xxx]** to alloparenting. / Another measure could be / encouraging friendships / between children in different school years / to mirror the **[xxx]** mixed-age playgroups / in hunter-gatherer communities.\n>\n> Annie Swanepoel博士， / 一位儿童 **[xxx]**， / 相信存在办法 / 把它们融入 / 西方生活。 / 在德国， / 一项计划已经配对 / 一所养老院 / 和一所托儿所。 / 住在那里的人帮助 / 照看孩子， / 一种安排 **[xxx]** 于alloparenting。 / 另一项措施可能是 / 鼓励友谊 / 在不同年级的孩子之间 / 来模仿 **[xxx]** 的混龄玩耍小组 / 在狩猎采集者群体里。\n\n第3段先说可以把这些做法融入西方生活，再写德国的养老院与托儿所配对。空格问举这个计划的用意，需要把老人帮助照料孩子和例子前的主张接起来。","html":"<h2>27题</h2>\n<blockquote>\n<p>The scheme in Germany is mentioned to illustrate ______.<br>文中提到德国的这项计划，是为了说明什么？</p>\n</blockquote>\n<p>题干给出了 The scheme in Germany。第3段明确出现 In Germany，例子前面还有 Swanepoel 对 western life 的判断。我们从第3段开头读完，看看这项计划用来说明哪句话。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the <strong>[xxx]</strong> mixed-age playgroups in hunter-gatherer communities.</p>\n<p>开始精读：</p>\n<p>Dr Annie Swanepoel, / a child <strong>[xxx]</strong>, / believes that there are ways / to incorporate them / into western life. / In Germany, / one scheme has paired / an old people’s home / with a nursery. / The residents help / to look after the children, / an arrangement <strong>[xxx]</strong> to alloparenting. / Another measure could be / encouraging friendships / between children in different school years / to mirror the <strong>[xxx]</strong> mixed-age playgroups / in hunter-gatherer communities.</p>\n<p>Annie Swanepoel博士， / 一位儿童 <strong>[xxx]</strong>， / 相信存在办法 / 把它们融入 / 西方生活。 / 在德国， / 一项计划已经配对 / 一所养老院 / 和一所托儿所。 / 住在那里的人帮助 / 照看孩子， / 一种安排 <strong>[xxx]</strong> 于alloparenting。 / 另一项措施可能是 / 鼓励友谊 / 在不同年级的孩子之间 / 来模仿 <strong>[xxx]</strong> 的混龄玩耍小组 / 在狩猎采集者群体里。</p>\n</blockquote>\n<p>第3段先说可以把这些做法融入西方生活，再写德国的养老院与托儿所配对。空格问举这个计划的用意，需要把老人帮助照料孩子和例子前的主张接起来。</p>\n","articleRects":[[307,756,1241,36],[228,806,1320,35],[228,855,1320,35],[228,904,1320,36],[228,954,1320,35],[228,1003,877,35]],"questionRects":[[254,690,870,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. an attempt to facilitate **[xxx]** communication\n\n> 一次促进 **[xxx]** 交流的尝试\n\n把A接回题干，它说的是：提德国的计划，是说明一次促进 **[xxx]** 交流的尝试。\n\nA的 communication 指交流，会让我们想到第3段 paired an old people’s home with a nursery，把两个场所连在一起可能产生交往，所以回看配对之后住户做了什么。\n\n> In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement **[xxx]** to alloparenting.\n\n原文的 paired an old people’s home with a nursery 让老人和儿童接触，后一句则明确写居民帮助照顾孩子。A的 communication 可以涉及两边的交往，因此不是与这个安排完全无关。但作者实际写出的动作是 look after，不只是交流。communication 前面还有 **[xxx]**，暂时读不出具体是哪一种交流，也就不能把A直接改成某个明确的、与照料无关的活动。\n\n**老人和儿童共同参与一个安排，能否已经把A所说的交流彻底排除？**\n\n还不能。配对确实可能伴随交流，但文章更清楚写出的是照顾孩子；A是哪种交流尚未读清，先留下这项。\n\n**第一轮判断：A保留。**","html":"<h3>A. an attempt to facilitate <strong>[xxx]</strong> communication</h3>\n<blockquote>\n<p>一次促进 <strong>[xxx]</strong> 交流的尝试</p>\n</blockquote>\n<p>把A接回题干，它说的是：提德国的计划，是说明一次促进 <strong>[xxx]</strong> 交流的尝试。</p>\n<p>A的 communication 指交流，会让我们想到第3段 paired an old people’s home with a nursery，把两个场所连在一起可能产生交往，所以回看配对之后住户做了什么。</p>\n<blockquote>\n<p>In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>原文的 paired an old people’s home with a nursery 让老人和儿童接触，后一句则明确写居民帮助照顾孩子。A的 communication 可以涉及两边的交往，因此不是与这个安排完全无关。但作者实际写出的动作是 look after，不只是交流。communication 前面还有 <strong>[xxx]</strong>，暂时读不出具体是哪一种交流，也就不能把A直接改成某个明确的、与照料无关的活动。</p>\n<p><strong>老人和儿童共同参与一个安排，能否已经把A所说的交流彻底排除？</strong></p>\n<p>还不能。配对确实可能伴随交流，但文章更清楚写出的是照顾孩子；A是哪种交流尚未读清，先留下这项。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[228,806,1320,35],[228,855,1320,35],[228,904,1320,36]],"questionRects":[[254,690,870,36],[315,758,949,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 communication 指交流，会让我们想到第3段 paired an old people’s home with a nursery，把两个场所连在一起可能产生交往，所以回看配对之后住户做了什么。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"paired an old people’s home with a nursery","visibleOptionAnchor":"communication"}}}},{"section":"27题","raw":"### B. an approach to integrating alloparenting into western society\n\n> 一种把共同育儿融入西方社会的办法\n\n把B接回题干，它说的是：提德国的计划，是说明把alloparenting融入西方社会的一种办法。\n\nB的 integrating alloparenting into western society 对应第3段 incorporate them into western life，都是把前面那些做法带进西方生活，所以回看段首判断与紧随其后的德国例子。\n\n> Dr Annie Swanepoel, a child **[xxx]**, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement **[xxx]** to alloparenting.\n\n段首的 incorporate them into western life 先提出可以把这些做法带入西方生活。随后德国的老人帮助照顾托儿所孩子，照料便由父母以外的人一起参与。B的 integrating alloparenting into western society 既包含引入的内容，也包含引入的地方；它说 an approach，也只把德国计划当作一种办法，没有声称西方已经全面采用。B把例子前的判断和例子里的安排接上了。\n\n**B能否同时说明作者为什么先说融入西方生活、接着举德国计划？**\n\n能。前一句提出可以融入，后一句给出老人参与照料的实际做法，B把观点和例子都概括到了。\n\n**第一轮判断：B保留。**","html":"<h3>B. an approach to integrating alloparenting into western society</h3>\n<blockquote>\n<p>一种把共同育儿融入西方社会的办法</p>\n</blockquote>\n<p>把B接回题干，它说的是：提德国的计划，是说明把alloparenting融入西方社会的一种办法。</p>\n<p>B的 integrating alloparenting into western society 对应第3段 incorporate them into western life，都是把前面那些做法带进西方生活，所以回看段首判断与紧随其后的德国例子。</p>\n<blockquote>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>段首的 incorporate them into western life 先提出可以把这些做法带入西方生活。随后德国的老人帮助照顾托儿所孩子，照料便由父母以外的人一起参与。B的 integrating alloparenting into western society 既包含引入的内容，也包含引入的地方；它说 an approach，也只把德国计划当作一种办法，没有声称西方已经全面采用。B把例子前的判断和例子里的安排接上了。</p>\n<p><strong>B能否同时说明作者为什么先说融入西方生活、接着举德国计划？</strong></p>\n<p>能。前一句提出可以融入，后一句给出老人参与照料的实际做法，B把观点和例子都概括到了。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[307,756,1241,36],[228,806,1320,35],[228,855,1320,35],[228,904,1320,36]],"questionRects":[[254,690,870,36],[315,826,1022,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 integrating alloparenting into western society 对应第3段 incorporate them into western life，都是把前面那些做法带进西方生活，所以回看段首判断与紧随其后的德国例子。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"incorporate them into western life","visibleOptionAnchor":"integrating alloparenting into western society"}}}},{"section":"27题","raw":"### C. the conventional parenting style in western culture\n\n> 西方文化中传统的育儿方式\n\n把C接回题干，它说的是：德国计划用于说明西方文化里原有的传统育儿方式。\n\nC的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。\n\n> Dr Annie Swanepoel, a child **[xxx]**, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement **[xxx]** to alloparenting.\n\n原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方式。一个用来展示“怎样引入”的计划，不能被换成“已经沿用的传统”；两边对德国安排的新旧身份说得不同。\n\n**介绍一种引入办法，等不等于介绍西方原有的传统？**\n\n不等于。incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。\n\n**第一轮判断：C排除。**","html":"<h3>C. the conventional parenting style in western culture</h3>\n<blockquote>\n<p>西方文化中传统的育儿方式</p>\n</blockquote>\n<p>把C接回题干，它说的是：德国计划用于说明西方文化里原有的传统育儿方式。</p>\n<p>C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。</p>\n<blockquote>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方式。一个用来展示“怎样引入”的计划，不能被换成“已经沿用的传统”；两边对德国安排的新旧身份说得不同。</p>\n<p><strong>介绍一种引入办法，等不等于介绍西方原有的传统？</strong></p>\n<p>不等于。incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,756,1241,36],[228,806,1320,35],[228,855,1320,35],[228,904,1320,36]],"questionRects":[[254,690,870,36],[315,894,861,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","relationship_direction"],"visibleSourceAnchor":"there are ways to incorporate them","visibleOptionAnchor":"conventional parenting style"}}}},{"section":"27题","raw":"### D. the differences between western and African ways of living\n\n> 西方与非洲生活方式之间的差异\n\n把D接回题干，它说的是：德国计划是用来说明西方和非洲的生活方式有何不同。\n\nD的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。\n\n> Dr Annie Swanepoel, a child **[xxx]**, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement **[xxx]** to alloparenting.\n\n原文先提出 incorporate them into western life，德国例子接着给出如何实现：老人也帮忙照顾孩子。这样写是在展示两种环境中可以采用相近的多人照料办法。D的 differences 却要求作者用德国说明两边不能相同或怎样不同，而且 ways of living 的范围扩大到了生活方式整体。这个例子具体讲照料孩子的办法可以引入，没有列两地相对的生活习惯来完成差异比较。\n\n**拿德国说明一种办法可以引入，是否是在用它突出两地差异？**\n\n不是。作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\n\n**第一轮判断：D排除。**","html":"<h3>D. the differences between western and African ways of living</h3>\n<blockquote>\n<p>西方与非洲生活方式之间的差异</p>\n</blockquote>\n<p>把D接回题干，它说的是：德国计划是用来说明西方和非洲的生活方式有何不同。</p>\n<p>D的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。</p>\n<blockquote>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>原文先提出 incorporate them into western life，德国例子接着给出如何实现：老人也帮忙照顾孩子。这样写是在展示两种环境中可以采用相近的多人照料办法。D的 differences 却要求作者用德国说明两边不能相同或怎样不同，而且 ways of living 的范围扩大到了生活方式整体。这个例子具体讲照料孩子的办法可以引入，没有列两地相对的生活习惯来完成差异比较。</p>\n<p><strong>拿德国说明一种办法可以引入，是否是在用它突出两地差异？</strong></p>\n<p>不是。作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,756,1241,36],[228,806,1320,35],[228,855,1320,35],[228,904,1320,36]],"questionRects":[[254,690,870,36],[315,963,1011,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","scope"],"visibleSourceAnchor":"incorporate them into western life","visibleOptionAnchor":"differences"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B保留；\n- C排除；\n- D排除。\n\n德国例子清楚支持B；A谈交流，和老人儿童接触有联系，但修饰交流的部分没有读清。C说成原有传统，D说成强调差异，都没有接上例前判断，先留A、B。\n\n> **27题暂时留下A和B。**","html":"<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>德国例子清楚支持B；A谈交流，和老人儿童接触有联系，但修饰交流的部分没有读清。C说成原有传统，D说成强调差异，都没有接上例前判断，先留A、B。</p>\n<blockquote>\n<p><strong>27题暂时留下A和B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[254,690,870,36]],"scrollTarget":"auto","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> According to Paragraph 4, the “intensive mothering narrative” ______.  \n> 根据第4段，“密集母职叙述”有什么特点或后果？\n\n题干直接写 Paragraph 4，并给出 intensive mothering narrative。我们回到第4段完整精读，把这种主张的内容、出现的背景和后果放在一起读。\n\n> 原文参考：\n>\n> In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western **[xxx]** family was a recent invention which broke with evolutionary history. This **[xxx]** shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such **[xxx]** can lead to **[xxx]** exhaustion and have dangerous consequences,” they wrote.\n>\n> 开始精读：\n>\n> In a paper / published in the Journal of Child Psychology and Psychiatry, / researchers said / that the western **[xxx]** family / was a recent invention / which broke with evolutionary history. / This **[xxx]** shift / to an “intensive mothering narrative”, / which suggests / that mothers should manage childcare alone, / was likely to have been harmful. / “Such **[xxx]** / can lead to **[xxx]** exhaustion / and have dangerous consequences,” / they wrote.\n>\n> 在一篇论文中 / 发表在《儿童心理学与精神病学杂志》里的， / 研究人员说 / 西方的 **[xxx]** 家庭 / 是一种最近的发明 / 它与演化历史决裂。 / 这种 **[xxx]** 的转变 / 转向一种“密集母职叙述”， / 它提出 / 母亲应该独自负责照顾孩子， / 很可能已经是有害的。 / “这样的 **[xxx]** / 可能造成 **[xxx]** 的精疲力竭 / 并产生危险的后果，” / 他们写道。\n\n这种主张让母亲独自承担育儿；段首说这种最近才有的家庭安排与演化历史决裂，后面又写 harmful 和 dangerous consequences。题目要找的是这一主张实际具有的性质或作用。","html":"<h2>28题</h2>\n<blockquote>\n<p>According to Paragraph 4, the “intensive mothering narrative” ______.<br>根据第4段，“密集母职叙述”有什么特点或后果？</p>\n</blockquote>\n<p>题干直接写 Paragraph 4，并给出 intensive mothering narrative。我们回到第4段完整精读，把这种主张的内容、出现的背景和后果放在一起读。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western <strong>[xxx]</strong> family was a recent invention which broke with evolutionary history. This <strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n<p>开始精读：</p>\n<p>In a paper / published in the Journal of Child Psychology and Psychiatry, / researchers said / that the western <strong>[xxx]</strong> family / was a recent invention / which broke with evolutionary history. / This <strong>[xxx]</strong> shift / to an “intensive mothering narrative”, / which suggests / that mothers should manage childcare alone, / was likely to have been harmful. / “Such <strong>[xxx]</strong> / can lead to <strong>[xxx]</strong> exhaustion / and have dangerous consequences,” / they wrote.</p>\n<p>在一篇论文中 / 发表在《儿童心理学与精神病学杂志》里的， / 研究人员说 / 西方的 <strong>[xxx]</strong> 家庭 / 是一种最近的发明 / 它与演化历史决裂。 / 这种 <strong>[xxx]</strong> 的转变 / 转向一种“密集母职叙述”， / 它提出 / 母亲应该独自负责照顾孩子， / 很可能已经是有害的。 / “这样的 <strong>[xxx]</strong> / 可能造成 <strong>[xxx]</strong> 的精疲力竭 / 并产生危险的后果，” / 他们写道。</p>\n</blockquote>\n<p>这种主张让母亲独自承担育儿；段首说这种最近才有的家庭安排与演化历史决裂，后面又写 harmful 和 dangerous consequences。题目要找的是这一主张实际具有的性质或作用。</p>\n","articleRects":[[307,1052,1236,35],[228,1102,1319,35],[228,1150,1320,36],[228,1199,1319,37],[228,1248,1320,37],[228,1297,711,37]],"questionRects":[[254,1097,1080,37]],"scrollTarget":"auto","meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. alleviates parenting pressures\n\n> 减轻育儿压力\n\n把A接回题干，它说的是：密集母职叙述会减轻育儿压力。\n\nA的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。\n\n> **[xxx]** shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such **[xxx]** can lead to **[xxx]** exhaustion and have dangerous consequences,” they wrote.\n\n原文的 was likely to have been harmful 判断这种转变很可能有害，随后写 exhaustion 和 dangerous consequences，方向是母亲可能更疲惫、后果危险。A的 alleviates parenting pressures 却说压力得到减轻。虽然 exhaustion 前的程度或性质没有读清，疲惫这个名词和有害的判断仍在，不能把这种负担加重的后果改写成压力缓解。\n\n**有害、精疲力竭和危险后果，能支持“减轻育儿压力”吗？**\n\n不能。原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。\n\n**第一轮判断：A排除。**","html":"<h3>A. alleviates parenting pressures</h3>\n<blockquote>\n<p>减轻育儿压力</p>\n</blockquote>\n<p>把A接回题干，它说的是：密集母职叙述会减轻育儿压力。</p>\n<p>A的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。</p>\n<blockquote>\n<p><strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n</blockquote>\n<p>原文的 was likely to have been harmful 判断这种转变很可能有害，随后写 exhaustion 和 dangerous consequences，方向是母亲可能更疲惫、后果危险。A的 alleviates parenting pressures 却说压力得到减轻。虽然 exhaustion 前的程度或性质没有读清，疲惫这个名词和有害的判断仍在，不能把这种负担加重的后果改写成压力缓解。</p>\n<p><strong>有害、精疲力竭和危险后果，能支持“减轻育儿压力”吗？</strong></p>\n<p>不能。原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[228,1150,1320,36],[228,1199,1319,37],[228,1248,1320,37],[228,1297,711,37]],"questionRects":[[254,1097,1080,37],[315,1167,514,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"was likely to have been harmful","visibleOptionAnchor":"alleviates parenting pressures"}}}},{"section":"28题","raw":"### B. **[xxx]** family relationships\n\n> 对家庭关系进行 **[xxx]**\n\n把B接回题干，它说的是：密集母职叙述会 **[xxx]** 家庭关系。\n\nB的 family relationships 谈家庭关系，我们回看第4段 mothers should manage childcare alone：家庭中的照料责任只落在母亲身上，与家庭成员怎样分工有关，所以读这句及后面的后果。\n\n> **[xxx]** shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such **[xxx]** can lead to **[xxx]** exhaustion and have dangerous consequences,” they wrote.\n\n原文的 mothers should manage childcare alone 把育儿责任集中到母亲身上，后面评价这种转变可能有害。B的 family relationships 把讨论对象放在家庭关系上，前面却只有 **[xxx]**，究竟说改善、伤害还是别的影响，目前无法读出。原文的负面评价能说明这套安排存在问题，却不能让我们自行给B补上一个正面动词再排除它。\n\n**只看到family relationships，能否确定B与原文的负面评价相反？**\n\n还不能。相反与否由前面的动作决定，这个动作没有读清；家庭中的照料分工又确实是本段正在谈的内容，因此暂时保留B。\n\n**第一轮判断：B保留。**","html":"<h3>B. <strong>[xxx]</strong> family relationships</h3>\n<blockquote>\n<p>对家庭关系进行 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：密集母职叙述会 <strong>[xxx]</strong> 家庭关系。</p>\n<p>B的 family relationships 谈家庭关系，我们回看第4段 mothers should manage childcare alone：家庭中的照料责任只落在母亲身上，与家庭成员怎样分工有关，所以读这句及后面的后果。</p>\n<blockquote>\n<p><strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n</blockquote>\n<p>原文的 mothers should manage childcare alone 把育儿责任集中到母亲身上，后面评价这种转变可能有害。B的 family relationships 把讨论对象放在家庭关系上，前面却只有 <strong>[xxx]</strong>，究竟说改善、伤害还是别的影响，目前无法读出。原文的负面评价能说明这套安排存在问题，却不能让我们自行给B补上一个正面动词再排除它。</p>\n<p><strong>只看到family relationships，能否确定B与原文的负面评价相反？</strong></p>\n<p>还不能。相反与否由前面的动作决定，这个动作没有读清；家庭中的照料分工又确实是本段正在谈的内容，因此暂时保留B。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[228,1150,1320,36],[228,1199,1319,37],[228,1248,1320,37],[228,1297,711,37]],"questionRects":[[254,1097,1080,37],[315,1235,567,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 family relationships 谈家庭关系，我们回看第4段 mothers should manage childcare alone：家庭中的照料责任只落在母亲身上，与家庭成员怎样分工有关，所以读这句及后面的后果。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"mothers should manage childcare alone","visibleOptionAnchor":"family relationships"}}}},{"section":"28题","raw":"### C. results in the child-centered family\n\n> 导致以孩子为中心的家庭\n\n把C接回题干，它说的是：密集母职叙述造成了以孩子为中心的家庭。\n\nC的 child-centered family 说家庭以谁为中心，所以回看第4段 mothers should manage childcare alone，确认原句究竟规定了谁来照料，还是说明全家围着谁转。\n\n> **[xxx]** shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such **[xxx]** can lead to **[xxx]** exhaustion and have dangerous consequences,” they wrote.\n\n原文的 mothers should manage childcare alone 规定的是谁承担照顾责任：母亲一个人负责。C的 child-centered family 却规定整个家庭围绕谁组织，并把它说成这套叙述造成的结果。照料对象当然是孩子，但“由母亲独自做”与“全家以孩子为中心”不是同一个安排；前者强调照料者被压缩，后者强调家庭的中心。原句解释主张时明确落在母亲单独负责，C把解释的焦点换掉了。\n\n**把育儿责任集中给母亲，等不等于把全家的中心改成孩子？**\n\n不等于。原句回答谁来照顾，并且强调alone；C却把它改成全家围绕孩子组织的结果，没有接上这个主张的内容。\n\n**第一轮判断：C排除。**","html":"<h3>C. results in the child-centered family</h3>\n<blockquote>\n<p>导致以孩子为中心的家庭</p>\n</blockquote>\n<p>把C接回题干，它说的是：密集母职叙述造成了以孩子为中心的家庭。</p>\n<p>C的 child-centered family 说家庭以谁为中心，所以回看第4段 mothers should manage childcare alone，确认原句究竟规定了谁来照料，还是说明全家围着谁转。</p>\n<blockquote>\n<p><strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n</blockquote>\n<p>原文的 mothers should manage childcare alone 规定的是谁承担照顾责任：母亲一个人负责。C的 child-centered family 却规定整个家庭围绕谁组织，并把它说成这套叙述造成的结果。照料对象当然是孩子，但“由母亲独自做”与“全家以孩子为中心”不是同一个安排；前者强调照料者被压缩，后者强调家庭的中心。原句解释主张时明确落在母亲单独负责，C把解释的焦点换掉了。</p>\n<p><strong>把育儿责任集中给母亲，等不等于把全家的中心改成孩子？</strong></p>\n<p>不等于。原句回答谁来照顾，并且强调alone；C却把它改成全家围绕孩子组织的结果，没有接上这个主张的内容。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[228,1150,1320,36],[228,1199,1319,37],[228,1248,1320,37],[228,1297,711,37]],"questionRects":[[254,1097,1080,37],[315,1302,608,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 child-centered family 说家庭以谁为中心，所以回看第4段 mothers should manage childcare alone，确认原句究竟规定了谁来照料，还是说明全家围着谁转。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","visible_link"],"visibleSourceAnchor":"mothers should manage childcare alone","visibleOptionAnchor":"child-centered family"}}}},{"section":"28题","raw":"### D. departs from the course of evolution\n\n> 偏离演化的进程\n\n把D接回题干，它说的是：密集母职叙述偏离了人类演化的进程。\n\nD的 departs from the course of evolution 对应第4段 broke with evolutionary history，两处都涉及与演化历史分离，所以回看最近的家庭安排以及 This 指回它的那两句。\n\n> In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western **[xxx]** family was a recent invention which broke with evolutionary history. This **[xxx]** shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful.\n\n原文先说最近出现的家庭安排 broke with evolutionary history，再用 This 把这种转变接到母亲独自育儿的叙述上。D的 departs from the course of evolution 把 broke with 改说成 departs from，把 evolutionary history 改说成 course of evolution，仍然是在说这套近期安排与长期演化形成的做法分离。D没有把它说成自古如此，也没有把有害的后果换成好处。\n\n**broke with evolutionary history能否接上“偏离演化进程”？**\n\n能。原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。\n\n**第一轮判断：D保留。**","html":"<h3>D. departs from the course of evolution</h3>\n<blockquote>\n<p>偏离演化的进程</p>\n</blockquote>\n<p>把D接回题干，它说的是：密集母职叙述偏离了人类演化的进程。</p>\n<p>D的 departs from the course of evolution 对应第4段 broke with evolutionary history，两处都涉及与演化历史分离，所以回看最近的家庭安排以及 This 指回它的那两句。</p>\n<blockquote>\n<p>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western <strong>[xxx]</strong> family was a recent invention which broke with evolutionary history. This <strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful.</p>\n</blockquote>\n<p>原文先说最近出现的家庭安排 broke with evolutionary history，再用 This 把这种转变接到母亲独自育儿的叙述上。D的 departs from the course of evolution 把 broke with 改说成 departs from，把 evolutionary history 改说成 course of evolution，仍然是在说这套近期安排与长期演化形成的做法分离。D没有把它说成自古如此，也没有把有害的后果换成好处。</p>\n<p><strong>broke with evolutionary history能否接上“偏离演化进程”？</strong></p>\n<p>能。原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[307,1052,1236,35],[228,1102,1319,35],[228,1150,1320,36],[228,1199,1319,37],[228,1248,1320,37]],"questionRects":[[254,1097,1080,37],[315,1371,635,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 departs from the course of evolution 对应第4段 broke with evolutionary history，两处都涉及与演化历史分离，所以回看最近的家庭安排以及 This 指回它的那两句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"broke with evolutionary history","visibleOptionAnchor":"departs from the course of evolution"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D保留。\n\nA把负面后果说成减压，C把谁承担照料改成家庭围着谁转。D对应演化历史，B的家庭关系动作仍未知，因此留下B、D。\n\n> **28题暂时留下B和D。**","html":"<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A把负面后果说成减压，C把谁承担照料改成家庭围着谁转。D对应演化历史，B的家庭关系动作仍未知，因此留下B、D。</p>\n<blockquote>\n<p><strong>28题暂时留下B和D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[254,1097,1080,37]],"scrollTarget":"auto","meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> What can be inferred about the nurseries in the UK?  \n> 关于英国的托儿所，可以推断出什么？\n\n题干给出 the nurseries in the UK。第6段后半出现 nursery settings in the UK，所以先把第6段从头到尾读清，尤其看这组人数是在与什么比较。\n\n> 原文参考：\n>\n> Chaudhary said that parents now had less childcare support from family and social networks than during most of humans’ evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a “**[xxx]**” benefit to a child’s **[xxx]**. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts **[xxx]** to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\n>\n> 开始精读：\n>\n> Chaudhary said / that parents now had less childcare support / from family and social networks / than during most of humans’ evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have a “**[xxx]**” benefit / to a child’s **[xxx]**. / An infant born to a hunter-gatherer society / could have more than ten caregivers—this / contrasts **[xxx]** / to nursery settings in the UK / where regulations call for a ratio / of one carer to four children / aged two to three.\n>\n> Chaudhary说 / 父母现在得到更少的育儿支持 / 来自家庭与社会网络 / 比起人类演化历史的大多数时期， / 但是引入额外的照料者 / 可以减少压力和母亲的抑郁， / 这可能有一种“**[xxx]**”的好处 / 对孩子的 **[xxx]**。 / 一个出生在狩猎采集者社会的婴儿 / 可能有超过十个照料者——这 / 形成 **[xxx]** 的对比 / 与英国托儿所的设置 / 那里的规定要求一种比例 / 一个照料者对应四个孩子 / 年龄在两到三岁。\n\n第6段先说增加照料者能够减轻压力，又把狩猎采集者社会一个婴儿可有十多人照顾，与英国一个照料者对应四个孩子并排写。题目要推断英国托儿所怎样，不是单独再回答父母有什么情绪问题。","html":"<h2>29题</h2>\n<blockquote>\n<p>What can be inferred about the nurseries in the UK?<br>关于英国的托儿所，可以推断出什么？</p>\n</blockquote>\n<p>题干给出 the nurseries in the UK。第6段后半出现 nursery settings in the UK，所以先把第6段从头到尾读清，尤其看这组人数是在与什么比较。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans’ evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n<p>开始精读：</p>\n<p>Chaudhary said / that parents now had less childcare support / from family and social networks / than during most of humans’ evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have a “<strong>[xxx]</strong>” benefit / to a child’s <strong>[xxx]</strong>. / An infant born to a hunter-gatherer society / could have more than ten caregivers—this / contrasts <strong>[xxx]</strong> / to nursery settings in the UK / where regulations call for a ratio / of one carer to four children / aged two to three.</p>\n<p>Chaudhary说 / 父母现在得到更少的育儿支持 / 来自家庭与社会网络 / 比起人类演化历史的大多数时期， / 但是引入额外的照料者 / 可以减少压力和母亲的抑郁， / 这可能有一种“<strong>[xxx]</strong>”的好处 / 对孩子的 <strong>[xxx]</strong>。 / 一个出生在狩猎采集者社会的婴儿 / 可能有超过十个照料者——这 / 形成 <strong>[xxx]</strong> 的对比 / 与英国托儿所的设置 / 那里的规定要求一种比例 / 一个照料者对应四个孩子 / 年龄在两到三岁。</p>\n</blockquote>\n<p>第6段先说增加照料者能够减轻压力，又把狩猎采集者社会一个婴儿可有十多人照顾，与英国一个照料者对应四个孩子并排写。题目要推断英国托儿所怎样，不是单独再回答父母有什么情绪问题。</p>\n","articleRects":[[308,1594,1240,36],[229,1644,1319,35],[228,1693,1320,35],[228,1741,1320,37],[228,1792,1320,35],[228,1841,1321,35],[228,1890,433,36]],"questionRects":[[254,1507,914,31]],"scrollTarget":"auto","meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. They tend to fall short of **[xxx]** requirements.\n\n> 它们往往达不到 **[xxx]** 要求\n\n把A接回题干，它说的是：英国托儿所往往达不到某种 **[xxx]** 要求。\n\nA的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定的一个照料者对应四个孩子，以及前面的人数对比。\n\n> An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts **[xxx]** to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\n\n原文的 regulations call for a ratio 直接给出了英国的配比要求。A的 requirements 前面有 **[xxx]**，暂时不知道说的是哪一类要求。若把它理解成“没有达到刚才那条规定”，原文并没有提供违规人数；但如果它说的是照料孩子时某种更高的需要，就可能与前面的悬殊人数对比相关。我们不能先替这个词选定一种意思，再用自己补出的意思排除整项。\n\n**目前是否已经读清A究竟说未达到哪一种要求？**\n\n还不能。原句有明确的配比规定，A所说的要求性质却没有读清；它和照料标准相关，暂时与C一起留下。\n\n**第一轮判断：A保留。**","html":"<h3>A. They tend to fall short of <strong>[xxx]</strong> requirements.</h3>\n<blockquote>\n<p>它们往往达不到 <strong>[xxx]</strong> 要求</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国托儿所往往达不到某种 <strong>[xxx]</strong> 要求。</p>\n<p>A的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定的一个照料者对应四个孩子，以及前面的人数对比。</p>\n<blockquote>\n<p>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文的 regulations call for a ratio 直接给出了英国的配比要求。A的 requirements 前面有 <strong>[xxx]</strong>，暂时不知道说的是哪一类要求。若把它理解成“没有达到刚才那条规定”，原文并没有提供违规人数；但如果它说的是照料孩子时某种更高的需要，就可能与前面的悬殊人数对比相关。我们不能先替这个词选定一种意思，再用自己补出的意思排除整项。</p>\n<p><strong>目前是否已经读清A究竟说未达到哪一种要求？</strong></p>\n<p>还不能。原句有明确的配比规定，A所说的要求性质却没有读清；它和照料标准相关，暂时与C一起留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[228,1741,1320,37],[228,1792,1320,35],[228,1841,1321,35],[228,1890,433,36]],"questionRects":[[254,1507,914,31],[315,1575,812,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定的一个照料者对应四个孩子，以及前面的人数对比。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"regulations call for a ratio","visibleOptionAnchor":"requirements"}}}},{"section":"29题","raw":"### B. They have difficulty finding enough caregivers.\n\n> 它们难以找到足够的照料者\n\n把B接回题干，它说的是：英国托儿所很难招到足够的照料人员。\n\nB的 finding enough caregivers 把问题放在找人上，所以回看第6段 one carer to four children，确认这个人数是招聘结果还是规定允许的比例。\n\n> An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts **[xxx]** to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\n\n原文的 one carer to four children 跟在 regulations call for a ratio 后面，介绍的是英国制度所规定的人员配比。B的 finding enough caregivers 却把较少的照料者解释成招聘困难，等于换了这个数字的来由。一个规定允许一人照顾四个孩子的机构，即使把规定的人员全部招齐，仍然是这个比例；比例低本身不能写成招不到人。作者拿规定与另一种育儿安排比较，B把安排问题改成找人问题。\n\n**规定的照料比例，能否直接被解释成招不到足够的人？**\n\n不能。这里的人数由regulations引出，描述的是照料安排；B却把它换成招聘遇到困难所造成的结果。\n\n**第一轮判断：B排除。**","html":"<h3>B. They have difficulty finding enough caregivers.</h3>\n<blockquote>\n<p>它们难以找到足够的照料者</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国托儿所很难招到足够的照料人员。</p>\n<p>B的 finding enough caregivers 把问题放在找人上，所以回看第6段 one carer to four children，确认这个人数是招聘结果还是规定允许的比例。</p>\n<blockquote>\n<p>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文的 one carer to four children 跟在 regulations call for a ratio 后面，介绍的是英国制度所规定的人员配比。B的 finding enough caregivers 却把较少的照料者解释成招聘困难，等于换了这个数字的来由。一个规定允许一人照顾四个孩子的机构，即使把规定的人员全部招齐，仍然是这个比例；比例低本身不能写成招不到人。作者拿规定与另一种育儿安排比较，B把安排问题改成找人问题。</p>\n<p><strong>规定的照料比例，能否直接被解释成招不到足够的人？</strong></p>\n<p>不能。这里的人数由regulations引出，描述的是照料安排；B却把它换成招聘遇到困难所造成的结果。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[228,1741,1320,37],[228,1792,1320,35],[228,1841,1321,35],[228,1890,433,36]],"questionRects":[[254,1507,914,31],[315,1643,812,35]],"s *第一轮判断：C保留。**","html":"<h3>C. They ought to improve their carer-to-child ratio.</h3>\n<blockquote>\n<p>它们应该改善照料者与孩子的比例</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国托儿所应该改善每个孩子能得到多少照料者帮助的比例。</p>\n<p>C的 improve their carer-to-child ratio 指改善人员配比，对应第6段 more than ten caregivers 与 one carer to four children 的对照，所以把前面增加照料者的好处和这组数字一起回看。</p>\n<blockquote>\n<p>but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文先说增加照料者能够 reduce stress and maternal depression，随后用 more than ten caregivers 对照英国的一人四孩。C的 improve their carer-to-child ratio 把建议落在这组对照真正讨论的事情上：每个孩子能得到多少人的照顾。十多人照顾一个孩子和一人照顾四个孩子，差别显然在照料资源的分配；前面又刚说增加照料者有好处，因此从这里提出改善比例有具体依据。C只说应当改善，没有把“英国现在就违规”或“必须达到十比一”加进去。</p>\n<p><strong>照料者更多的好处加上人数对比，能否支持改善英国托儿所的人员配比？</strong></p>\n<p>能。好处说明为什么值得增加帮助，人数对比说明英国在这方面与多人照料相距很远，C正好把建议接到这个差别上。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[229,1644,1319,35],[228,1693,1320,35],[228,1741,1320,37],[228,1792,1320,35],[228,1841,1321,35],[228,1890,433,36]],"questionRects":[[254,1507,914,31],[315,1711,827,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 improve their carer-to-child ratio 指改善人员配比，对应第6段 more than ten caregivers 与 one carer to four children 的对照，所以把前面增加照料者的好处和这组数字一起回看。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"more than ten caregivers","visibleOptionAnchor":"improve their carer-to-child ratio"}}}},{"section":"29题","raw":"### D. They should try to prevent parental depression.\n\n> 它们应该设法预防父母抑郁\n\n把D接回题干，它说的是：英国托儿所应该把预防父母抑郁作为要做的事情。\n\nD的 prevent parental depression 会让我们找到第6段 reduce stress and maternal depression，两处都谈父母的情绪，所以回看是谁做什么才产生这一好处，以及英国托儿所出现在什么位置。\n\n> but introducing additional caregivers could reduce stress and maternal depression, which could have a “**[xxx]**” benefit to a child’s **[xxx]**. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts **[xxx]** to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\n\n原文的 reduce stress and maternal depression 是 introducing additional caregivers 带来的结果，做法是增加照料者，受益的是父母。D的 prevent parental depression 却把结果直接改成托儿所应承担的任务。后面的英国托儿所被拿来比较的是一个照料者与四个孩子的比例，并没有让它承担心理干预的职责。原文从照料安排谈到减轻母亲抑郁，D却把受益结果改写成英国托儿所的工作目标，跳过了文章正在比较的照料人数。\n\n**增加照料者可能减轻抑郁，等不等于托儿所本身被要求承担预防抑郁的任务？**\n\n不等于。原文把情绪好转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。\n\n**第一轮判断：D排除。**","html":"<h3>D. They should try to prevent parental depression.</h3>\n<blockquote>\n<p>它们应该设法预防父母抑郁</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国托儿所应该把预防父母抑郁作为要做的事情。</p>\n<p>D的 prevent parental depression 会让我们找到第6段 reduce stress and maternal depression，两处都谈父母的情绪，所以回看是谁做什么才产生这一好处，以及英国托儿所出现在什么位置。</p>\n<blockquote>\n<p>but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in
