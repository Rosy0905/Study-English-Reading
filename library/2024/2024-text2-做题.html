；</li>\n<li>D排除。</li>\n</ul>\n<p>C接上照料者数量及增加帮助的好处；A的要求性质还没有读清。B把比例规定说成招聘困难，D把受益结果改成机构任务，先留A、C。</p>\n<blockquote>\n<p><strong>29题暂时留下A和C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[254,1507,914,31]],"scrollTarget":"auto","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**Which of the following would be the best title for the text?**\n\n下面哪一项最适合作为全文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Instructive teaching: a dilemma for anxious parents**\n\n指令式教学：焦虑父母的一个难题\n\nB. **For a happier family, learn from the hunter-gatherers**\n\n为了更幸福的家庭，向狩猎采集者学习\n\nC. **Mixed-age playgroup, a better choice for lonely children**\n\n混龄玩耍小组：孤独孩子更好的选择\n\nD. **Tracing the history of parenting: from Africa to Europe**\n\n追溯育儿历史：从非洲到欧洲","html":"<h2>30题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪一项最适合作为全文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Instructive teaching: a dilemma for anxious parents</strong></p>\n<p>指令式教学：焦虑父母的一个难题</p>\n<p>B. <strong>For a happier family, learn from the hunter-gatherers</strong></p>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n<p>C. <strong>Mixed-age playgroup, a better choice for lonely children</strong></p>\n<p>混龄玩耍小组：孤独孩子更好的选择</p>\n<p>D. <strong>Tracing the history of parenting: from Africa to Europe</strong></p>\n<p>追溯育儿历史：从非洲到欧洲</p>\n","articleRects":[],"questionRects":[[255,1915,1027,35]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n> 原文参考：\n>\n> By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child’s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 **[xxx]** a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.\n>\n> 开始精读：\n>\n> By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half of a child’s care. / One previous study / looked at the Efé people / of the Democratic Republic of Congo. / It found / that infants had an average of 14 **[xxx]** a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.\n>\n> 相比之下， / 在狩猎采集者社会里 / 父母以外的成年人 / 可以提供 / 一个孩子的照料的几乎一半。 / 一项先前的研究 / 考察了Efé人 / 刚果民主共和国的。 / 它发现 / 婴儿平均每天有14个 **[xxx]** / 到他们18周大时 / 而且在照料者之间被传递 / 每小时八次。\n\n> 原文参考：\n>\n> While hunter-gatherer children learnt from observation and **[xxx]** in mixed-age playgroups, researchers said that western “**[xxx]** teaching”, where pupils are asked to sit still, may contribute to conditions such as attention deficit **[xxx]** disorder. Chaudhary said that Britain should explore the possibility that older **[xxx]** helping their parents “might also enhance their own social development.”\n>\n> 开始精读：\n>\n> While hunter-gatherer children learnt / from observation and **[xxx]** / in mixed-age playgroups, / researchers said / that western “**[xxx]** teaching”, / where pupils are asked to sit still, / may contribute to conditions / such as attention deficit **[xxx]** disorder. / Chaudhary said / that Britain should explore the possibility / that older **[xxx]** helping their parents / “might also enhance / their own social development.”\n>\n> 虽然狩猎采集者的孩子学习 / 通过观察和 **[xxx]** / 在混龄玩耍小组里， / 研究人员说 / 西方的“**[xxx]** 教学”， / 在其中学生被要求坐着不动， / 可能促成一些状况 / 例如注意缺陷 **[xxx]** 障碍。 / Chaudhary说 / 英国应该探索这种可能性 / 年长的 **[xxx]** 帮助他们的父母 / “也可能促进 / 他们自己的社会发展。”\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。 | 先说别处的做法可能值得学 |\n| 第2段 | 说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。 | 再说这样做可能带来好处 |\n| 第3段 | 提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。 | 再说可以用哪些办法来学 |\n| 第4段 | 指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 对照狩猎采集者群体由父母以外的人分担大量照料，并给出Efé的情况。 | 再说别处是怎样做的 |\n| 第6段 | 说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 将借鉴延伸到混龄学习与帮助父母可能带来的社会发展，建议英国探索。 | 最后说还可以试着改变什么 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child’s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 <strong>[xxx]</strong> a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.</p>\n<p>开始精读：</p>\n<p>By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half of a child’s care. / One previous study / looked at the Efé people / of the Democratic Republic of Congo. / It found / that infants had an average of 14 <strong>[xxx]</strong> a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.</p>\n<p>相比之下， / 在狩猎采集者社会里 / 父母以外的成年人 / 可以提供 / 一个孩子的照料的几乎一半。 / 一项先前的研究 / 考察了Efé人 / 刚果民主共和国的。 / 它发现 / 婴儿平均每天有14个 <strong>[xxx]</strong> / 到他们18周大时 / 而且在照料者之间被传递 / 每小时八次。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>While hunter-gatherer children learnt from observation and <strong>[xxx]</strong> in mixed-age playgroups, researchers said that western “<strong>[xxx]</strong> teaching”, where pupils are asked to sit still, may contribute to conditions such as attention deficit <strong>[xxx]</strong> disorder. Chaudhary said that Britain should explore the possibility that older <strong>[xxx]</strong> helping their parents “might also enhance their own social development.”</p>\n<p>开始精读：</p>\n<p>While hunter-gatherer children learnt / from observation and <strong>[xxx]</strong> / in mixed-age playgroups, / researchers said / that western “<strong>[xxx]</strong> teaching”, / where pupils are asked to sit still, / may contribute to conditions / such as attention deficit <strong>[xxx]</strong> disorder. / Chaudhary said / that Britain should explore the possibility / that older <strong>[xxx]</strong> helping their parents / “might also enhance / their own social development.”</p>\n<p>虽然狩猎采集者的孩子学习 / 通过观察和 <strong>[xxx]</strong> / 在混龄玩耍小组里， / 研究人员说 / 西方的“<strong>[xxx]</strong> 教学”， / 在其中学生被要求坐着不动， / 可能促成一些状况 / 例如注意缺陷 <strong>[xxx]</strong> 障碍。 / Chaudhary说 / 英国应该探索这种可能性 / 年长的 <strong>[xxx]</strong> 帮助他们的父母 / “也可能促进 / 他们自己的社会发展。”</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>对照狩猎采集者群体由父母以外的人分担大量照料，并给出Efé的情况。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>将借鉴延伸到混龄学习与帮助父母可能带来的社会发展，建议英国探索。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<hr>\n","articleRects":[[307,1348,1241,35],[227,1397,1321,36],[228,1447,1319,35],[228,1496,1320,35],[228,1545,496,36],[307,1940,1241,35],[228,1988,1315,36],[229,2038,1319,36],[228,2088,1320,35],[228,2136,1320,36],[229,2185,342,36]],"questionRects":[[255,1915,1027,35]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"**Which of the following would be the best title for the text?**\n\n### A. Instructive teaching: a dilemma for anxious parents\n\n指令式教学：焦虑父母的一个难题\n\n#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果A成立，全文中心应当是“指令式教学：焦虑父母的一个难题”。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先介绍别处的教学办法可能帮助解决父母焦虑。 | 先说别处的做法可能值得学 |\n| 第2段 | 说明改变教学能带来哪些情绪好处。 | 再说这样做可能带来好处 |\n| 第3段 | 举例怎样把更好的教学方式引入学校。 | 再说可以用哪些办法来学 |\n| 第4段 | 回头解释现有指令式教学有什么问题。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 摆出另一种课堂教学作为对照。 | 再说别处是怎样做的 |\n| 第6段 | 说明改变教学的好处与学校现状的差距。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 最后提出解决教学难题的办法。 | 最后说还可以试着改变什么 |\n\nA抓住了最后一段的teaching，也抓住前面的anxiety，但全文多数段落在写谁照顾孩子：很多成年人、老人帮忙、母亲单独负责、照料者人数。它们并不是围绕课堂指令式教学安排的。德国把养老院和托儿所配对，也是让老人参与照料，没有介绍如何改课堂讲授。把最后一段的一种教学问题升成总标题，会让前六段反复讨论共同照料显得偏离中心。\n\n**指令式教学能否解释老人帮忙、母亲独自照料以及照料人数这些主要内容？**\n\n不能。这些段落首先讨论育儿责任如何分担，教学只是结尾补充的一个可探索方向，A把末段的一部分扩大成全文。\n\n**判断：A排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. Instructive teaching: a dilemma for anxious parents</h3>\n<p>指令式教学：焦虑父母的一个难题</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A成立，全文中心应当是“指令式教学：焦虑父母的一个难题”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先介绍别处的教学办法可能帮助解决父母焦虑。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明改变教学能带来哪些情绪好处。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举例怎样把更好的教学方式引入学校。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释现有指令式教学有什么问题。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出另一种课堂教学作为对照。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明改变教学的好处与学校现状的差距。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后提出解决教学难题的办法。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>A抓住了最后一段的teaching，也抓住前面的anxiety，但全文多数段落在写谁照顾孩子：很多成年人、老人帮忙、母亲单独负责、照料者人数。它们并不是围绕课堂指令式教学安排的。德国把养老院和托儿所配对，也是让老人参与照料，没有介绍如何改课堂讲授。把最后一段的一种教学问题升成总标题，会让前六段反复讨论共同照料显得偏离中心。</p>\n<p><strong>指令式教学能否解释老人帮忙、母亲独自照料以及照料人数这些主要内容？</strong></p>\n<p>不能。这些段落首先讨论育儿责任如何分担，教学只是结尾补充的一个可探索方向，A把末段的一部分扩大成全文。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,1027,35],[315,1983,884,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"**Which of the following would be the best title for the text?**\n\n### B. For a happier family, learn from the hunter-gatherers\n\n为了更幸福的家庭，向狩猎采集者学习\n\n#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果B成立，全文中心应当是“为了更幸福的家庭，向狩猎采集者学习”。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说狩猎采集者的育儿办法可能值得其他家庭学习。 | 先说别处的做法可能值得学 |\n| 第2段 | 说明共同照料可能减少父母与孩子的焦虑。 | 再说这样做可能带来好处 |\n| 第3段 | 举德国与跨年级活动说明西方可以如何借鉴。 | 再说可以用哪些办法来学 |\n| 第4段 | 回头解释让母亲单独照料为什么可能有害。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 摆出其他成年人参与照料的情况作对照。 | 再说别处是怎样做的 |\n| 第6段 | 说明增加照料者的好处以及英国配比的差距。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 最后提出混龄学习、帮助父母等继续探索的方向。 | 最后说还可以试着改变什么 |\n\nB的learn from准确解释了全文为何从非洲群体讲到德国和英国：作者不是只介绍遥远风俗，而是在讨论可以怎样借鉴。happier family又能接上第2段less anxiety、第4段对有害负担的批评，以及第6段减少压力和母亲抑郁的好处。最后的社会发展也属于孩子与家庭可能得到的益处。标题没有把学习缩成一种课堂形式，也没有声称现代家庭必须原样复制所有做法。\n\n**向狩猎采集者学习以改善家庭生活，能否贯穿开头、具体例子、对比和结尾建议？**\n\n能。开头给出借鉴来源，中间说明做法、必要性和好处，结尾继续提出英国可以探索的方向，都在回答怎样让家庭获得更好的照料与支持。\n\n**判断：B保留。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. For a happier family, learn from the hunter-gatherers</h3>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B成立，全文中心应当是“为了更幸福的家庭，向狩猎采集者学习”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先说狩猎采集者的育儿办法可能值得其他家庭学习。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明共同照料可能减少父母与孩子的焦虑。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举德国与跨年级活动说明西方可以如何借鉴。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释让母亲单独照料为什么可能有害。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出其他成年人参与照料的情况作对照。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明增加照料者的好处以及英国配比的差距。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后提出混龄学习、帮助父母等继续探索的方向。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>B的learn from准确解释了全文为何从非洲群体讲到德国和英国：作者不是只介绍遥远风俗，而是在讨论可以怎样借鉴。happier family又能接上第2段less anxiety、第4段对有害负担的批评，以及第6段减少压力和母亲抑郁的好处。最后的社会发展也属于孩子与家庭可能得到的益处。标题没有把学习缩成一种课堂形式，也没有声称现代家庭必须原样复制所有做法。</p>\n<p><strong>向狩猎采集者学习以改善家庭生活，能否贯穿开头、具体例子、对比和结尾建议？</strong></p>\n<p>能。开头给出借鉴来源，中间说明做法、必要性和好处，结尾继续提出英国可以探索的方向，都在回答怎样让家庭获得更好的照料与支持。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,1027,35],[315,2051,913,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"**Which of the following would be the best title for the text?**\n\n### C. Mixed-age playgroup, a better choice for lonely children\n\n混龄玩耍小组：孤独孩子更好的选择\n\n#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果C成立，全文中心应当是“混龄玩耍小组：孤独孩子更好的选择”。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说混龄玩耍值得孤独孩子尝试。 | 先说别处的做法可能值得学 |\n| 第2段 | 说明混龄活动怎样减轻孤独。 | 再说这样做可能带来好处 |\n| 第3段 | 举例如何建立混龄玩耍小组。 | 再说可以用哪些办法来学 |\n| 第4段 | 回头解释孩子孤独的主要原因。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 摆出不孤独儿童的活动安排作对照。 | 再说别处是怎样做的 |\n| 第6段 | 说明参加小组的好处以及现实参与不足。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 最后继续建议孤独孩子加入混龄小组。 | 最后说还可以试着改变什么 |\n\nC确实用了mixed-age playgroup，能对应第3段后半和最后一段，却把范围限定为lonely children。全文没有围绕孤独儿童展开，反复出现的另一类受益者是父母。老人参与照料、母亲独自承担育儿的疲惫、托儿所人手比例，都不能只用孩子加入玩耍小组来解释。减少焦虑也不等于专门缓解孤独，标题把问题与对象都缩窄了。\n\n**只谈孤独孩子的混龄小组，能否包住父母负担和社会共同照料的大量内容？**\n\n不能。混龄活动只是借鉴办法的一部分，父母焦虑与多人分担同样贯穿全文，C遗漏这些中心内容，还增加了孤独这一特定问题。\n\n**判断：C排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. Mixed-age playgroup, a better choice for lonely children</h3>\n<p>混龄玩耍小组：孤独孩子更好的选择</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C成立，全文中心应当是“混龄玩耍小组：孤独孩子更好的选择”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先说混龄玩耍值得孤独孩子尝试。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明混龄活动怎样减轻孤独。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举例如何建立混龄玩耍小组。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释孩子孤独的主要原因。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出不孤独儿童的活动安排作对照。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明参加小组的好处以及现实参与不足。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后继续建议孤独孩子加入混龄小组。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>C确实用了mixed-age playgroup，能对应第3段后半和最后一段，却把范围限定为lonely children。全文没有围绕孤独儿童展开，反复出现的另一类受益者是父母。老人参与照料、母亲独自承担育儿的疲惫、托儿所人手比例，都不能只用孩子加入玩耍小组来解释。减少焦虑也不等于专门缓解孤独，标题把问题与对象都缩窄了。</p>\n<p><strong>只谈孤独孩子的混龄小组，能否包住父母负担和社会共同照料的大量内容？</strong></p>\n<p>不能。混龄活动只是借鉴办法的一部分，父母焦虑与多人分担同样贯穿全文，C遗漏这些中心内容，还增加了孤独这一特定问题。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,1027,35],[315,2119,972,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"**Which of the following would be the best title for the text?**\n\n### D. Tracing the history of parenting: from Africa to Europe\n\n追溯育儿历史：从非洲到欧洲\n\n#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果D成立，全文中心应当是“追溯育儿历史：从非洲到欧洲”。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出非洲育儿史值得追溯。 | 先说别处的做法可能值得学 |\n| 第2段 | 说明研究历史能带来哪些认识。 | 再说这样做可能带来好处 |\n| 第3段 | 举例说明育儿方式从非洲传到西方的过程。 | 再说可以用哪些办法来学 |\n| 第4段 | 回头解释某种历史阶段怎样形成。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 摆出另一阶段的育儿方式。 | 再说别处是怎样做的 |\n| 第6段 | 比较非洲与欧洲沿历史演进形成的差别。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 最后交代育儿方式传播到英国后的历史结果。 | 最后说还可以试着改变什么 |\n\nD能对应非洲、德国、英国和evolutionary history这些词，但它要求文章按历史传播过程组织。实际段落在问现在可以怎么做：第3段说融入西方的办法，第6段比较当下配比，第7段建议英国探索。文中没有写非洲育儿方式何时传到欧洲、经历了哪些阶段。演化历史在第4段只是用来解释让母亲单独承担为何是一种近期偏离，不是整篇历史叙述。\n\n**从非洲到欧洲追溯历史，能否解释文章反复给出的当下借鉴办法和未来探索建议？**\n\n不能。地名代表可借鉴的来源和可能采用的地方，没有构成历史传播路线；全文重在改善今天的育儿安排。\n\n**判断：D排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. Tracing the history of parenting: from Africa to Europe</h3>\n<p>追溯育儿历史：从非洲到欧洲</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D成立，全文中心应当是“追溯育儿历史：从非洲到欧洲”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出非洲育儿史值得追溯。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明研究历史能带来哪些认识。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举例说明育儿方式从非洲传到西方的过程。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释某种历史阶段怎样形成。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出另一阶段的育儿方式。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>比较非洲与欧洲沿历史演进形成的差别。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后交代育儿方式传播到英国后的历史结果。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>D能对应非洲、德国、英国和evolutionary history这些词，但它要求文章按历史传播过程组织。实际段落在问现在可以怎么做：第3段说融入西方的办法，第6段比较当下配比，第7段建议英国探索。文中没有写非洲育儿方式何时传到欧洲、经历了哪些阶段。演化历史在第4段只是用来解释让母亲单独承担为何是一种近期偏离，不是整篇历史叙述。</p>\n<p><strong>从非洲到欧洲追溯历史，能否解释文章反复给出的当下借鉴办法和未来探索建议？</strong></p>\n<p>不能。地名代表可借鉴的来源和可能采用的地方，没有构成历史传播路线；全文重在改善今天的育儿安排。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,1027,35],[315,2187,955,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题结论\n\n**30. B. For a happier family, learn from the hunter-gatherers**\n\n开头把非洲育儿做法当作可借鉴的资源，中间写如何融入西方并对照母亲单独照料的负担，结尾继续提出英国可以探索的办法。标题B同时包含借鉴对象和让家庭更好的目的。\n\n这句话就是本文后续做题的主旨底牌：\n\n**For a happier family, learn from the hunter-gatherers / 为了更幸福的家庭，向狩猎采集者学习**\n\n---","html":"<h3>30题结论</h3>\n<p><strong>30. B. For a happier family, learn from the hunter-gatherers</strong></p>\n<p>开头把非洲育儿做法当作可借鉴的资源，中间写如何融入西方并对照母亲单独照料的负担，结尾继续提出英国可以探索的办法。标题B同时包含借鉴对象和让家庭更好的目的。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>For a happier family, learn from the hunter-gatherers / 为了更幸福的家庭，向狩猎采集者学习</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,1027,35]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查26题：A还是B？\n\n第一遍留下：\n\n- A. sharing childcare among community members\n- B. **[xxx]** babies to specific adult caregivers\n\n主旨底牌是：\n\n> **For a happier family, learn from the hunter-gatherers**\n\n也就是：\n\n> 为了更幸福的家庭，向狩猎采集者学习\n\n第一遍留下A、B，是因为A清楚说共同分担，而B的动作没有读清；specific adult caregivers也不能简单理解成只有一个照料者。我们先把题干和两个选项接起来。A说alloparenting是群体成员分担育儿，B说把婴儿以某种方式安排给特定的成年人。两项都碰到了婴儿与照料者，但A直接讲清参与关系，B只让我们看到人选和一个没有读懂的动作。现在拿主旨来检查。全文要求为了更幸福的家庭向狩猎采集者学习，德国老人参与、父母以外的人分担照料、增加照料者减少压力，都在说明值得学的是让更多人承担照料。A的sharing把这个能产生好处的分担办法说出来，因此既能解释开头的名称，也能解释全文为什么反复扩大参与照料的人群。B里的specific只是特定人选，单独这层意思不能说明参与者是否增加、责任是否分担；若要把它也当作名称定义，还得给 **[xxx]** 加上目前没有读出的安排内容。回到第一遍的each child is cared for by many adults，A已有一条清楚的局部对应，如今全文又反复以共同照料作为可借鉴的办法。B没有获得同样明确的第二层支持。这里选A，不把B中看不懂的动作擅自翻成相反意思。\n\n> **26题选A。**\n\n---","html":"<h2>回查26题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. sharing childcare among community members</li>\n<li>B. <strong>[xxx]</strong> babies to specific adult caregivers</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\n<p>第一遍留下A、B，是因为A清楚说共同分担，而B的动作没有读清；specific adult caregivers也不能简单理解成只有一个照料者。我们先把题干和两个选项接起来。A说alloparenting是群体成员分担育儿，B说把婴儿以某种方式安排给特定的成年人。两项都碰到了婴儿与照料者，但A直接讲清参与关系，B只让我们看到人选和一个没有读懂的动作。现在拿主旨来检查。全文要求为了更幸福的家庭向狩猎采集者学习，德国老人参与、父母以外的人分担照料、增加照料者减少压力，都在说明值得学的是让更多人承担照料。A的sharing把这个能产生好处的分担办法说出来，因此既能解释开头的名称，也能解释全文为什么反复扩大参与照料的人群。B里的specific只是特定人选，单独这层意思不能说明参与者是否增加、责任是否分担；若要把它也当作名称定义，还得给 <strong>[xxx]</strong> 加上目前没有读出的安排内容。回到第一遍的each child is cared for by many adults，A已有一条清楚的局部对应，如今全文又反复以共同照料作为可借鉴的办法。B没有获得同样明确的第二层支持。这里选A，不把B中看不懂的动作擅自翻成相反意思。</p>\n<blockquote>\n<p><strong>26题选A。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[],"questionRects":[[254,214,1322,36],[318,282,33,27]],"scrollTarget":"auto","meta":{"kind":"review","qid":"26"}},{"section":"进阶回查","raw":"## 回查27题：A还是B？\n\n第一遍留下：\n\n- A. an attempt to facilitate **[xxx]** communication\n- B. an approach to integrating alloparenting into western society\n\n主旨底牌是：\n\n> **For a happier family, learn from the hunter-gatherers**\n\n也就是：\n\n> 为了更幸福的家庭，向狩猎采集者学习\n\n第一遍A和B都留下，是因为德国养老院与托儿所配对确实让老人儿童发生接触，而A说的交流种类没有读清；B则直接接上了例子前面融入西方生活的判断。我们先把题干和两个选项接起来。A说德国计划用来说明促进某种交流的尝试，B说它说明怎样把alloparenting带进西方社会。现在拿主旨来检查。标题的中心是为了更幸福的家庭，向狩猎采集者学习。把这个方向放回德国计划，老人帮助照顾孩子就是西方可以采用的多人照料办法，既说明学什么，也说明怎么在现有环境中实行，因此给B增加了全文目的上的支持。A的communication只抓到老人和儿童可能交往，还没有说明这种交往为什么被作者放进育儿借鉴文章。即使交流确实发生，也不能因此把它变成作者举例的主要目的。再接回第一遍读过的incorporate them into western life，例前观点已经明说要把做法融入西方，例中又写look after the children。B同时连接这两处局部安排和标题的借鉴目的；A只保留了活动可能伴随的一种现象，没有接上为什么要用德国来证明可借鉴。因此选B，仍不需要替A补出具体是哪一种交流。\n\n> **27题选B。**\n\n---","html":"<h2>回查27题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. an attempt to facilitate <strong>[xxx]</strong> communication</li>\n<li>B. an approach to integrating alloparenting into western society</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\n<p>第一遍A和B都留下，是因为德国养老院与托儿所配对确实让老人儿童发生接触，而A说的交流种类没有读清；B则直接接上了例子前面融入西方生活的判断。我们先把题干和两个选项接起来。A说德国计划用来说明促进某种交流的尝试，B说它说明怎样把alloparenting带进西方社会。现在拿主旨来检查。标题的中心是为了更幸福的家庭，向狩猎采集者学习。把这个方向放回德国计划，老人帮助照顾孩子就是西方可以采用的多人照料办法，既说明学什么，也说明怎么在现有环境中实行，因此给B增加了全文目的上的支持。A的communication只抓到老人和儿童可能交往，还没有说明这种交往为什么被作者放进育儿借鉴文章。即使交流确实发生，也不能因此把它变成作者举例的主要目的。再接回第一遍读过的incorporate them into western life，例前观点已经明说要把做法融入西方，例中又写look after the children。B同时连接这两处局部安排和标题的借鉴目的；A只保留了活动可能伴随的一种现象，没有接上为什么要用德国来证明可借鉴。因此选B，仍不需要替A补出具体是哪一种交流。</p>\n<blockquote>\n<p><strong>27题选B。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[],"questionRects":[[254,690,870,36]],"scrollTarget":"auto","meta":{"kind":"review","qid":"27"}},{"section":"进阶回查","raw":"## 回查28题：B还是D？\n\n第一遍留下：\n\n- B. **[xxx]** family relationships\n- D. departs from the course of evolution\n\n主旨底牌是：\n\n> **For a happier family, learn from the hunter-gatherers**\n\n也就是：\n\n> 为了更幸福的家庭，向狩猎采集者学习\n\n第一遍D直接接上broke with evolutionary history，但B说家庭关系前的动作没有读清，不能自行假定它是正面评价再排除。我们先把题干和两个选项接起来。B说密集母职叙述对家庭关系产生某种 **[xxx]** 作用，D说它偏离演化的进程。现在拿主旨来检查。标题提出向狩猎采集者学习以改善家庭生活，全文用多人分担的长期做法来对照母亲独自承担的近期安排。这个总体比较让第4段提到演化历史的用意更清楚：作者要解释为什么重新学习共同照料有必要，不能把母亲独自负责当作唯一自然而然的安排。D说偏离演化进程，既对应本段明确的broke with，也能说明这一段在全文借鉴建议中的作用。B谈family relationships，可能涉及家庭中的后果，但那个动作仍不清楚，单有“家庭关系”不能解释文章为什么专门区分recent invention与evolutionary history。回看第一遍，本段明确给出的历史判断是近期转变与演化历史分开，负面后果只是继续说明这种转变可能有害。D获得了局部明说和全文比较方向的双重支持；B没有读出的关系不能替它补齐这样的联系。最终选D，并不把标题当成翻译B的词典。\n\n> **28题选D。**\n\n---","html":"<h2>回查28题：B还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. <strong>[xxx]</strong> family relationships</li>\n<li>D. departs from the course of evolution</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\ 89NCfwJy8nVtrbDozza9I/FU7p/Oe//+n857///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///g8fRgA=","questionSize":{"w":1804,"h":2513},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>According to the first two paragraphs, alloparenting refers to the practice of ______.</strong></p>\n<blockquote>\n<p>根据前两段，alloparenting指什么做法？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>27题题干</h2>\n<p><strong>The scheme in Germany is mentioned to illustrate ______.</strong></p>\n<blockquote>\n<p>文中提到德国的这项计划，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n<h2>28题题干</h2>\n<p><strong>According to Paragraph 4, the “intensive mothering narrative” ______.</strong></p>\n<blockquote>\n<p>根据第4段，“密集母职叙述”有什么特点或后果？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>29题题干</h2>\n<p><strong>What can be inferred about the nurseries in the UK?</strong></p>\n<blockquote>\n<p>关于英国的托儿所，可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr>\n<h2>30题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪一项最适合作为全文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>According to, By contrast, but, While</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>less anxiety, harmful, dangerous, benefit</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>look after, incorporate, reduce, enhance</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>exhaustion, consequences, depression</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>children, parents, caregivers, alloparenting</td>\n</tr>\n</tbody></table>\n<h3>第1段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more <strong>[xxx]</strong> children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more <strong>[xxx]</strong> children, / researchers have suggested. / The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for by many adults. / Kung children as young as four / will help to look after / younger ones / and “baby-wearing”, / in which infants are carried / in <strong>[xxx]</strong>, / is considered the norm.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>育儿建议 / obtained from hunter-gatherers 在非洲 / may be the key / to 养育 / more <strong>[xxx]</strong> 孩子， / researchers have suggested. / 这个想法 is based on / 对群体的研究 / such as the Kung of Botswana, / where 每个孩子 / is cared for by 很多成年人. / Kung children 小到四岁 / will help to look after / 年幼的孩子 / and “baby-wearing”, / in which 婴儿被携带 / in <strong>[xxx]</strong>, / 被认为是常态.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>1、育儿建议、在非洲、养育、孩子；每个孩子、很多成年人；小到四岁、年幼的孩子；婴儿被携带、<strong>[xxx]</strong>、常态。</p>\n<h3>第2段</h3>\n<p><strong>原文参考：</strong></p>\n<p>According to Dr Nikhil Chaudhary, an evolutionary <strong>[xxx]</strong> at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.</p>\n<p><strong>开始粗读：</strong></p>\n<p>According to Dr Nikhil Chaudhary, / an evolutionary <strong>[xxx]</strong> / at Cambridge University, / these practices, / known as alloparenting, / could lead to less anxiety / for children and parents.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>According to Dr Nikhil Chaudhary, / an evolutionary <strong>[xxx]</strong> / at Cambridge University, / 这些做法, / known as alloparenting, / could lead to 更少的焦虑 / for 孩子和父母.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>2、Nikhil Chaudhary、这些做法；更少的焦虑、孩子和父母。</p>\n<h3>第3段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the <strong>[xxx]</strong> mixed-age playgroups in hunter-gatherer communities.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Dr Annie Swanepoel, / a child <strong>[xxx]</strong>, / believes that there are ways / to incorporate them / into western life. / In Germany, / one scheme has paired / an old people’s home / with a nursery. / The residents help / to look after the children, / an arrangement <strong>[xxx]</strong> to alloparenting. / Another measure could be / encouraging friendships / between children in different school years / to mirror the <strong>[xxx]</strong> mixed-age playgroups / in hunter-gatherer communities.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>Dr Annie Swanepoel, / a child <strong>[xxx]</strong>, / believes that there are ways / to incorporate them / 融入西方生活. / 在德国, / one scheme has paired / 一所养老院 / with 一所托儿所. / The residents help / to look after the children, / an arrangement <strong>[xxx]</strong> to alloparenting. / Another measure could be / 鼓励友谊 / between children in 不同年级 / to mirror the <strong>[xxx]</strong> mixed-age playgroups / in hunter-gatherer communities.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>3、Annie Swanepoel、融入西方生活；在德国、一所养老院、一所托儿所；鼓励友谊、不同年级。</p>\n<h3>第4段</h3>\n<p><strong>原文参考：</strong></p>\n<p>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western <strong>[xxx]</strong> family was a recent invention which broke with evolutionary history. This <strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n<p><strong>开始粗读：</strong></p>\n<p>In a paper / published in the Journal of Child Psychology and Psychiatry, / researchers said / that the western <strong>[xxx]</strong> family / was a recent invention / which broke with evolutionary history. / This <strong>[xxx]</strong> shift / to an “intensive mothering narrative”, / which suggests / that mothers should manage childcare alone, / was likely to have been harmful. / “Such <strong>[xxx]</strong> / can lead to <strong>[xxx]</strong> exhaustion / and have dangerous consequences,” / they wrote.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>In a paper / published in the Journal of Child Psychology and Psychiatry, / 研究人员说 / that the western <strong>[xxx]</strong> family / was 一种最近的发明 / which broke with evolutionary history. / This <strong>[xxx]</strong> shift / to an “intensive mothering narrative”, / which suggests / that 母亲 should manage 独自照顾孩子, / was likely to have been 有害的. / “Such <strong>[xxx]</strong> / can lead to <strong>[xxx]</strong> exhaustion / and have 危险的后果,” / 他们写道.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>4、研究人员说、一种最近的发明；母亲、独自照顾孩子、有害的；危险的后果。</p>\n<h3>第5段</h3>\n<p><strong>原文参考：</strong></p>\n<p>By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child’s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 <strong>[xxx]</strong> a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.</p>\n<p><strong>开始粗读：</strong></p>\n<p>By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half of a child’s care. / One previous study / looked at the Efé people / of the Democratic Republic of Congo. / It found / that infants had an average of 14 <strong>[xxx]</strong> a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>By contrast, / in hunter-gatherer societies / adults 父母以外的 / can provide / 几乎一半 of a child’s care. / 一项先前的研究 / looked at the Efé people / of the Democratic Republic of Congo. / It found / that infants had an average of 14 <strong>[xxx]</strong> a day / by the time they were 18周大 / and were passed between caregivers / 每小时八次.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>5、父母以外的、几乎一半；Efé；18周大、每小时八次。</p>\n<h3>第6段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans’ evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Chaudhary said / that parents now had less childcare support / from family and social networks / than during most of humans’ evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have a “<strong>[xxx]</strong>” benefit / to a child’s <strong>[xxx]</strong>. / An infant born to a hunter-gatherer society / could have more than ten caregivers—this / contrasts <strong>[xxx]</strong> / to nursery settings in the UK / where regulations call for a ratio / of one carer to four children / aged two to three.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>Chaudhary said / that 父母现在 had 更少的育儿支持 / from 家庭与社会网络 / than during most of humans’ evolutionary history, / but introducing additional caregivers / could 减少压力 and maternal depression, / which could have a “<strong>[xxx]</strong>” benefit / to a child’s <strong>[xxx]</strong>. / An infant born to a hunter-gatherer society / could have 超过十个 caregivers—this / contrasts <strong>[xxx]</strong> / to nursery settings 在英国 / where regulations call for a ratio / of 一个照料者 to 四个孩子 / aged two to three.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>6、父母现在、更少的育儿支持、家庭与社会网络；减少压力；超过十个；在英国、一个照料者、四个孩子。</p>\n<h3>第7段</h3>\n<p><strong>原文参考：</strong></p>\n<p>While hunter-gatherer children learnt from observation and <strong>[xxx]</strong> in mixed-age playgroups, researchers said that western “<strong>[xxx]</strong> teaching”, where pupils are asked to sit still, may contribute to conditions such as attention deficit <strong>[xxx]</strong> disorder. Chaudhary said that Britain should explore the possibility that older <strong>[xxx]</strong> helping their parents “might also enhance their own social development.”</p>\n<p><strong>开始粗读：</strong></p>\n<p>While hunter-gatherer children learnt / from observation and <strong>[xxx]</strong> / in mixed-age playgroups, / researchers said / that western “<strong>[xxx]</strong> teaching”, / where pupils are asked to sit still, / may contribute to conditions / such as attention deficit <strong>[xxx]</strong> disorder. / Chaudhary said / that Britain should explore the possibility / that older <strong>[xxx]</strong> helping their parents / “might also enhance / their own social development.”</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>While hunter-gatherer 孩子学习 / from 观察 and <strong>[xxx]</strong> / 在混龄玩耍小组里, / 研究人员说 / that western “<strong>[xxx]</strong> teaching”, / where 学生被要求 坐着不动, / may contribute to conditions / such as attention deficit <strong>[xxx]</strong> disorder. / Chaudhary said / that 英国应该探索 the possibility / that older <strong>[xxx]</strong> 帮助他们的父母 / “might also enhance / 他们自己的社会发展.”</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>7、孩子学习、观察、在混龄玩耍小组里；学生被要求、坐着不动；英国应该探索、帮助他们的父母、他们自己的社会发展。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和育儿建议有关，开头出现非洲、每个孩子和很多成年人，后来看到更少的焦虑；中间出现德国的养老院和托儿所、不同年级，接着有母亲独自照顾孩子、有害的和危险后果。后面还看到Efé、父母得到更少的支持、英国的一个照料者和四个孩子，结尾有坐着不动、帮助父母、社会发展。</p>\n<p>到这里还不能自然地说清楚：很多成年人怎么照顾孩子，养老院和托儿所怎样配合，母亲独自照顾孩子为什么有危险后果，英国照料者和孩子的数字应该怎样比较，这些还没有读清。粗读时只要能判断“这篇文章大概与孩子、父母和照料办法有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住非洲、很多成年人、德国养老院和托儿所、母亲独自照顾孩子、英国的照料人数和社会发展；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n<h2>26题</h2>\n<blockquote>\n<p>According to the first two paragraphs, alloparenting refers to the practice of ______.<br>根据前两段，alloparenting指什么做法？</p>\n</blockquote>\n<p>题干明确指定 the first two paragraphs，还给出了要解释的 alloparenting。我们把第1、2段从开头读到结尾，看看 these practices 指前面的哪些做法。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more <strong>[xxx]</strong> children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n<p>开始精读：</p>\n<p>Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more <strong>[xxx]</strong> children, / researchers have suggested. / The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for by many adults. / Kung children as young as four / will help to look after / younger ones / and “baby-wearing”, / in which infants are carried / in <strong>[xxx]</strong>, / is considered the norm.</p>\n<p>育儿建议 / 从非洲狩猎采集者那里获得的 / 可能是关键 / 对于养育 / 更加 <strong>[xxx]</strong> 的孩子， / 研究人员已经提出。 / 这个想法是建立在 / 对群体的研究之上的 / 例如博茨瓦纳的Kung， / 在那里每一个孩子 / 被很多成年人照顾。 / Kung的孩子小到四岁 / 就会帮忙照顾 / 年幼的孩子 / 而且“把婴儿穿在身上”， / 在其中婴儿被携带 / 在 <strong>[xxx]</strong> 里， / 被认为是常态。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>According to Dr Nikhil Chaudhary, an evolutionary <strong>[xxx]</strong> at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.</p>\n<p>开始精读：</p>\n<p>According to Dr Nikhil Chaudhary, / an evolutionary <strong>[xxx]</strong> / at Cambridge University, / these practices, / known as alloparenting, / could lead to less anxiety / for children and parents.</p>\n<p>根据Nikhil Chaudhary博士， / 一位演化方面的 <strong>[xxx]</strong> / 在剑桥大学， / 这些做法， / 被称作alloparenting， / 可能带来更少的焦虑 / 对于孩子和父母。</p>\n</blockquote>\n<p>第2段把前面这些做法叫作 alloparenting。第1段先说一个孩子由很多成年人照顾，又说四岁的孩子帮忙照顾更小的孩子。题目问这个名称所概括的做法，不能只拿其中一个动作当成整个名称。</p>\n<h3>A. sharing childcare among community members</h3>\n<blockquote>\n<p>在群体成员之间分担育儿</p>\n</blockquote>\n<p>把A接回题干，它说的是：alloparenting是群体成员共同分担照料孩子。</p>\n<p>A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。</p>\n<blockquote>\n<p>studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</blockquote>\n<p>原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。</p>\n<p><strong>一个孩子由多人照顾，能否叫作在群体成员之间分担育儿？</strong></p>\n<p>能。很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. <strong>[xxx]</strong> babies to specific adult caregivers</h3>\n<blockquote>\n<p>把婴儿 <strong>[xxx]</strong> 给特定的成年照料者</p>\n</blockquote>\n<p>把B接回题干，它说的是：alloparenting是把婴儿 <strong>[xxx]</strong> 给特定的成年照料者。</p>\n<p>B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。</p>\n<blockquote>\n<p>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.</p>\n</blockquote>\n<p>原文的 many adults 说明参与照料的人很多。B的 specific adult caregivers 把注意力放在特定的成年人身上，前面的动作又是 <strong>[xxx]</strong>。目前能读出婴儿和成人照料者之间有某种安排，却读不出具体怎样安排。特定的人不一定只指一个人，也可能指一批照料者，因此不能把 specific 直接翻成“仅有一个”。但B还没有把多人之间如何分担说明白，它和A不是同一种清楚程度。</p>\n<p><strong>many adults能让我们断定B中尚未读清的安排一定错误吗？</strong></p>\n<p>还不能。B并没有明说只许一人照顾，而它到底怎样安排这些成年人也没有读清，因此暂时把这个说法留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. teaching parenting skills to older children</h3>\n<blockquote>\n<p>向年长的孩子教授育儿技能</p>\n</blockquote>\n<p>把C接回题干，它说的是：alloparenting指向年长孩子传授育儿技能。</p>\n<p>C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。</p>\n<blockquote>\n<p>Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</blockquote>\n<p>原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。</p>\n<p><strong>年长孩子帮助照料，等不等于有人向他们教授育儿技能？</strong></p>\n<p>不等于。原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. carrying infants around by their parents</h3>\n<blockquote>\n<p>由父母带着婴儿到处走</p>\n</blockquote>\n<p>把D接回题干，它说的是：alloparenting就是父母带着婴儿到处走。</p>\n<p>D的 carrying infants 会让我们找到第1段 infants are carried，两处都写携带婴儿，所以回看 baby-wearing 所在的句子，并联系前面的 many adults。</p>\n<blockquote>\n<p>studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in <strong>[xxx]</strong>, is considered the norm.</p>\n</blockquote>\n<p>原文的 infants are carried 确实介绍携带婴儿的一种方式，但它跟在年长孩子帮助照料后面，只是 these practices 中的一种表现。D用 carrying infants 概括整个名称，而且加上 by their parents，把承担照料的人收缩为父母。第1段明确写了很多成年人和四岁的孩子参与照料；把这种共同参与只解释成父母携带婴儿，丢掉了名称要概括的照料者范围。</p>\n<p><strong>只写父母携带婴儿，能否概括多人参与的这些做法？</strong></p>\n<p>不能。父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A清楚对应共同分担；B的安排动作尚未读清。C把帮忙者改成受教者，D把多人参与缩成父母携带，先留下A、B。</p>\n<blockquote>\n<p><strong>26题暂时留下A和B。</strong></p>\n</blockquote>\n<h2>27题</h2>\n<blockquote>\n<p>The scheme in Germany is mentioned to illustrate ______.<br>文中提到德国的这项计划，是为了说明什么？</p>\n</blockquote>\n<p>题干给出了 The scheme in Germany。第3段明确出现 In Germany，例子前面还有 Swanepoel 对 western life 的判断。我们从第3段开头读完，看看这项计划用来说明哪句话。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the <strong>[xxx]</strong> mixed-age playgroups in hunter-gatherer communities.</p>\n<p>开始精读：</p>\n<p>Dr Annie Swanepoel, / a child <strong>[xxx]</strong>, / believes that there are ways / to incorporate them / into western life. / In Germany, / one scheme has paired / an old people’s home / with a nursery. / The residents help / to look after the children, / an arrangement <strong>[xxx]</strong> to alloparenting. / Another measure could be / encouraging friendships / between children in different school years / to mirror the <strong>[xxx]</strong> mixed-age playgroups / in hunter-gatherer communities.</p>\n<p>Annie Swanepoel博士， / 一位儿童 <strong>[xxx]</strong>， / 相信存在办法 / 把它们融入 / 西方生活。 / 在德国， / 一项计划已经配对 / 一所养老院 / 和一所托儿所。 / 住在那里的人帮助 / 照看孩子， / 一种安排 <strong>[xxx]</strong> 于alloparenting。 / 另一项措施可能是 / 鼓励友谊 / 在不同年级的孩子之间 / 来模仿 <strong>[xxx]</strong> 的混龄玩耍小组 / 在狩猎采集者群体里。</p>\n</blockquote>\n<p>第3段先说可以把这些做法融入西方生活，再写德国的养老院与托儿所配对。空格问举这个计划的用意，需要把老人帮助照料孩子和例子前的主张接起来。</p>\n<h3>A. an attempt to facilitate <strong>[xxx]</strong> communication</h3>\n<blockquote>\n<p>一次促进 <strong>[xxx]</strong> 交流的尝试</p>\n</blockquote>\n<p>把A接回题干，它说的是：提德国的计划，是说明一次促进 <strong>[xxx]</strong> 交流的尝试。</p>\n<p>A的 communication 指交流，会让我们想到第3段 paired an old people’s home with a nursery，把两个场所连在一起可能产生交往，所以回看配对之后住户做了什么。</p>\n<blockquote>\n<p>In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>原文的 paired an old people’s home with a nursery 让老人和儿童接触，后一句则明确写居民帮助照顾孩子。A的 communication 可以涉及两边的交往，因此不是与这个安排完全无关。但作者实际写出的动作是 look after，不只是交流。communication 前面还有 <strong>[xxx]</strong>，暂时读不出具体是哪一种交流，也就不能把A直接改成某个明确的、与照料无关的活动。</p>\n<p><strong>老人和儿童共同参与一个安排，能否已经把A所说的交流彻底排除？</strong></p>\n<p>还不能。配对确实可能伴随交流，但文章更清楚写出的是照顾孩子；A是哪种交流尚未读清，先留下这项。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. an approach to integrating alloparenting into western society</h3>\n<blockquote>\n<p>一种把共同育儿融入西方社会的办法</p>\n</blockquote>\n<p>把B接回题干，它说的是：提德国的计划，是说明把alloparenting融入西方社会的一种办法。</p>\n<p>B的 integrating alloparenting into western society 对应第3段 incorporate them into western life，都是把前面那些做法带进西方生活，所以回看段首判断与紧随其后的德国例子。</p>\n<blockquote>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>段首的 incorporate them into western life 先提出可以把这些做法带入西方生活。随后德国的老人帮助照顾托儿所孩子，照料便由父母以外的人一起参与。B的 integrating alloparenting into western society 既包含引入的内容，也包含引入的地方；它说 an approach，也只把德国计划当作一种办法，没有声称西方已经全面采用。B把例子前的判断和例子里的安排接上了。</p>\n<p><strong>B能否同时说明作者为什么先说融入西方生活、接着举德国计划？</strong></p>\n<p>能。前一句提出可以融入，后一句给出老人参与照料的实际做法，B把观点和例子都概括到了。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. the conventional parenting style in western culture</h3>\n<blockquote>\n<p>西方文化中传统的育儿方式</p>\n</blockquote>\n<p>把C接回题干，它说的是：德国计划用于说明西方文化里原有的传统育儿方式。</p>\n<p>C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。</p>\n<blockquote>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方式。一个用来展示“怎样引入”的计划，不能被换成“已经沿用的传统”；两边对德国安排的新旧身份说得不同。</p>\n<p><strong>介绍一种引入办法，等不等于介绍西方原有的传统？</strong></p>\n<p>不等于。incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. the differences between western and African ways of living</h3>\n<blockquote>\n<p>西方与非洲生活方式之间的差异</p>\n</blockquote>\n<p>把D接回题干，它说的是：德国计划是用来说明西方和非洲的生活方式有何不同。</p>\n<p>D的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。</p>\n<blockquote>\n<p>Dr Annie Swanepoel, a child <strong>[xxx]</strong>, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people’s home with a nursery. The residents help to look after the children, an arrangement <strong>[xxx]</strong> to alloparenting.</p>\n</blockquote>\n<p>原文先提出 incorporate them into western life，德国例子接着给出如何实现：老人也帮忙照顾孩子。这样写是在展示两种环境中可以采用相近的多人照料办法。D的 differences 却要求作者用德国说明两边不能相同或怎样不同，而且 ways of living 的范围扩大到了生活方式整体。这个例子具体讲照料孩子的办法可以引入，没有列两地相对的生活习惯来完成差异比较。</p>\n<p><strong>拿德国说明一种办法可以引入，是否是在用它突出两地差异？</strong></p>\n<p>不是。作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>德国例子清楚支持B；A谈交流，和老人儿童接触有联系，但修饰交流的部分没有读清。C说成原有传统，D说成强调差异，都没有接上例前判断，先留A、B。</p>\n<blockquote>\n<p><strong>27题暂时留下A和B。</strong></p>\n</blockquote>\n<h2>28题</h2>\n<blockquote>\n<p>According to Paragraph 4, the “intensive mothering narrative” ______.<br>根据第4段，“密集母职叙述”有什么特点或后果？</p>\n</blockquote>\n<p>题干直接写 Paragraph 4，并给出 intensive mothering narrative。我们回到第4段完整精读，把这种主张的内容、出现的背景和后果放在一起读。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western <strong>[xxx]</strong> family was a recent invention which broke with evolutionary history. This <strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n<p>开始精读：</p>\n<p>In a paper / published in the Journal of Child Psychology and Psychiatry, / researchers said / that the western <strong>[xxx]</strong> family / was a recent invention / which broke with evolutionary history. / This <strong>[xxx]</strong> shift / to an “intensive mothering narrative”, / which suggests / that mothers should manage childcare alone, / was likely to have been harmful. / “Such <strong>[xxx]</strong> / can lead to <strong>[xxx]</strong> exhaustion / and have dangerous consequences,” / they wrote.</p>\n<p>在一篇论文中 / 发表在《儿童心理学与精神病学杂志》里的， / 研究人员说 / 西方的 <strong>[xxx]</strong> 家庭 / 是一种最近的发明 / 它与演化历史决裂。 / 这种 <strong>[xxx]</strong> 的转变 / 转向一种“密集母职叙述”， / 它提出 / 母亲应该独自负责照顾孩子， / 很可能已经是有害的。 / “这样的 <strong>[xxx]</strong> / 可能造成 <strong>[xxx]</strong> 的精疲力竭 / 并产生危险的后果，” / 他们写道。</p>\n</blockquote>\n<p>这种主张让母亲独自承担育儿；段首说这种最近才有的家庭安排与演化历史决裂，后面又写 harmful 和 dangerous consequences。题目要找的是这一主张实际具有的性质或作用。</p>\n<h3>A. alleviates parenting pressures</h3>\n<blockquote>\n<p>减轻育儿压力</p>\n</blockquote>\n<p>把A接回题干，它说的是：密集母职叙述会减轻育儿压力。</p>\n<p>A的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。</p>\n<blockquote>\n<p><strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n</blockquote>\n<p>原文的 was likely to have been harmful 判断这种转变很可能有害，随后写 exhaustion 和 dangerous consequences，方向是母亲可能更疲惫、后果危险。A的 alleviates parenting pressures 却说压力得到减轻。虽然 exhaustion 前的程度或性质没有读清，疲惫这个名词和有害的判断仍在，不能把这种负担加重的后果改写成压力缓解。</p>\n<p><strong>有害、精疲力竭和危险后果，能支持“减轻育儿压力”吗？</strong></p>\n<p>不能。原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. <strong>[xxx]</strong> family relationships</h3>\n<blockquote>\n<p>对家庭关系进行 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：密集母职叙述会 <strong>[xxx]</strong> 家庭关系。</p>\n<p>B的 family relationships 谈家庭关系，我们回看第4段 mothers should manage childcare alone：家庭中的照料责任只落在母亲身上，与家庭成员怎样分工有关，所以读这句及后面的后果。</p>\n<blockquote>\n<p><strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n</blockquote>\n<p>原文的 mothers should manage childcare alone 把育儿责任集中到母亲身上，后面评价这种转变可能有害。B的 family relationships 把讨论对象放在家庭关系上，前面却只有 <strong>[xxx]</strong>，究竟说改善、伤害还是别的影响，目前无法读出。原文的负面评价能说明这套安排存在问题，却不能让我们自行给B补上一个正面动词再排除它。</p>\n<p><strong>只看到family relationships，能否确定B与原文的负面评价相反？</strong></p>\n<p>还不能。相反与否由前面的动作决定，这个动作没有读清；家庭中的照料分工又确实是本段正在谈的内容，因此暂时保留B。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. results in the child-centered family</h3>\n<blockquote>\n<p>导致以孩子为中心的家庭</p>\n</blockquote>\n<p>把C接回题干，它说的是：密集母职叙述造成了以孩子为中心的家庭。</p>\n<p>C的 child-centered family 说家庭以谁为中心，所以回看第4段 mothers should manage childcare alone，确认原句究竟规定了谁来照料，还是说明全家围着谁转。</p>\n<blockquote>\n<p><strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful. “Such <strong>[xxx]</strong> can lead to <strong>[xxx]</strong> exhaustion and have dangerous consequences,” they wrote.</p>\n</blockquote>\n<p>原文的 mothers should manage childcare alone 规定的是谁承担照顾责任：母亲一个人负责。C的 child-centered family 却规定整个家庭围绕谁组织，并把它说成这套叙述造成的结果。照料对象当然是孩子，但“由母亲独自做”与“全家以孩子为中心”不是同一个安排；前者强调照料者被压缩，后者强调家庭的中心。原句解释主张时明确落在母亲单独负责，C把解释的焦点换掉了。</p>\n<p><strong>把育儿责任集中给母亲，等不等于把全家的中心改成孩子？</strong></p>\n<p>不等于。原句回答谁来照顾，并且强调alone；C却把它改成全家围绕孩子组织的结果，没有接上这个主张的内容。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. departs from the course of evolution</h3>\n<blockquote>\n<p>偏离演化的进程</p>\n</blockquote>\n<p>把D接回题干，它说的是：密集母职叙述偏离了人类演化的进程。</p>\n<p>D的 departs from the course of evolution 对应第4段 broke with evolutionary history，两处都涉及与演化历史分离，所以回看最近的家庭安排以及 This 指回它的那两句。</p>\n<blockquote>\n<p>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western <strong>[xxx]</strong> family was a recent invention which broke with evolutionary history. This <strong>[xxx]</strong> shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful.</p>\n</blockquote>\n<p>原文先说最近出现的家庭安排 broke with evolutionary history，再用 This 把这种转变接到母亲独自育儿的叙述上。D的 departs from the course of evolution 把 broke with 改说成 departs from，把 evolutionary history 改说成 course of evolution，仍然是在说这套近期安排与长期演化形成的做法分离。D没有把它说成自古如此，也没有把有害的后果换成好处。</p>\n<p><strong>broke with evolutionary history能否接上“偏离演化进程”？</strong></p>\n<p>能。原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A把负面后果说成减压，C把谁承担照料改成家庭围着谁转。D对应演化历史，B的家庭关系动作仍未知，因此留下B、D。</p>\n<blockquote>\n<p><strong>28题暂时留下B和D。</strong></p>\n</blockquote>\n<h2>29题</h2>\n<blockquote>\n<p>What can be inferred about the nurseries in the UK?<br>关于英国的托儿所，可以推断出什么？</p>\n</blockquote>\n<p>题干给出 the nurseries in the UK。第6段后半出现 nursery settings in the UK，所以先把第6段从头到尾读清，尤其看这组人数是在与什么比较。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans’ evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n<p>开始精读：</p>\n<p>Chaudhary said / that parents now had less childcare support / from family and social networks / than during most of humans’ evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have a “<strong>[xxx]</strong>” benefit / to a child’s <strong>[xxx]</strong>. / An infant born to a hunter-gatherer society / could have more than ten caregivers—this / contrasts <strong>[xxx]</strong> / to nursery settings in the UK / where regulations call for a ratio / of one carer to four children / aged two to three.</p>\n<p>Chaudhary说 / 父母现在得到更少的育儿支持 / 来自家庭与社会网络 / 比起人类演化历史的大多数时期， / 但是引入额外的照料者 / 可以减少压力和母亲的抑郁， / 这可能有一种“<strong>[xxx]</strong>”的好处 / 对孩子的 <strong>[xxx]</strong>。 / 一个出生在狩猎采集者社会的婴儿 / 可能有超过十个照料者——这 / 形成 <strong>[xxx]</strong> 的对比 / 与英国托儿所的设置 / 那里的规定要求一种比例 / 一个照料者对应四个孩子 / 年龄在两到三岁。</p>\n</blockquote>\n<p>第6段先说增加照料者能够减轻压力，又把狩猎采集者社会一个婴儿可有十多人照顾，与英国一个照料者对应四个孩子并排写。题目要推断英国托儿所怎样，不是单独再回答父母有什么情绪问题。</p>\n<h3>A. They tend to fall short of <strong>[xxx]</strong> requirements.</h3>\n<blockquote>\n<p>它们往往达不到 <strong>[xxx]</strong> 要求</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国托儿所往往达不到某种 <strong>[xxx]</strong> 要求。</p>\n<p>A的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定的一个照料者对应四个孩子，以及前面的人数对比。</p>\n<blockquote>\n<p>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文的 regulations call for a ratio 直接给出了英国的配比要求。A的 requirements 前面有 <strong>[xxx]</strong>，暂时不知道说的是哪一类要求。若把它理解成“没有达到刚才那条规定”，原文并没有提供违规人数；但如果它说的是照料孩子时某种更高的需要，就可能与前面的悬殊人数对比相关。我们不能先替这个词选定一种意思，再用自己补出的意思排除整项。</p>\n<p><strong>目前是否已经读清A究竟说未达到哪一种要求？</strong></p>\n<p>还不能。原句有明确的配比规定，A所说的要求性质却没有读清；它和照料标准相关，暂时与C一起留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. They have difficulty finding enough caregivers.</h3>\n<blockquote>\n<p>它们难以找到足够的照料者</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国托儿所很难招到足够的照料人员。</p>\n<p>B的 finding enough caregivers 把问题放在找人上，所以回看第6段 one carer to four children，确认这个人数是招聘结果还是规定允许的比例。</p>\n<blockquote>\n<p>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文的 one carer to four children 跟在 regulations call for a ratio 后面，介绍的是英国制度所规定的人员配比。B的 finding enough caregivers 却把较少的照料者解释成招聘困难，等于换了这个数字的来由。一个规定允许一人照顾四个孩子的机构，即使把规定的人员全部招齐，仍然是这个比例；比例低本身不能写成招不到人。作者拿规定与另一种育儿安排比较，B把安排问题改成找人问题。</p>\n<p><strong>规定的照料比例，能否直接被解释成招不到足够的人？</strong></p>\n<p>不能。这里的人数由regulations引出，描述的是照料安排；B却把它换成招聘遇到困难所造成的结果。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. They ought to improve their carer-to-child ratio.</h3>\n<blockquote>\n<p>它们应该改善照料者与孩子的比例</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国托儿所应该改善每个孩子能得到多少照料者帮助的比例。</p>\n<p>C的 improve their carer-to-child ratio 指改善人员配比，对应第6段 more than ten caregivers 与 one carer to four children 的对照，所以把前面增加照料者的好处和这组数字一起回看。</p>\n<blockquote>\n<p>but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文先说增加照料者能够 reduce stress and maternal depression，随后用 more than ten caregivers 对照英国的一人四孩。C的 improve their carer-to-child ratio 把建议落在这组对照真正讨论的事情上：每个孩子能得到多少人的照顾。十多人照顾一个孩子和一人照顾四个孩子，差别显然在照料资源的分配；前面又刚说增加照料者有好处，因此从这里提出改善比例有具体依据。C只说应当改善，没有把“英国现在就违规”或“必须达到十比一”加进去。</p>\n<p><strong>照料者更多的好处加上人数对比，能否支持改善英国托儿所的人员配比？</strong></p>\n<p>能。好处说明为什么值得增加帮助，人数对比说明英国在这方面与多人照料相距很远，C正好把建议接到这个差别上。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. They should try to prevent parental depression.</h3>\n<blockquote>\n<p>它们应该设法预防父母抑郁</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国托儿所应该把预防父母抑郁作为要做的事情。</p>\n<p>D的 prevent parental depression 会让我们找到第6段 reduce stress and maternal depression，两处都谈父母的情绪，所以回看是谁做什么才产生这一好处，以及英国托儿所出现在什么位置。</p>\n<blockquote>\n<p>but introducing additional caregivers could reduce stress and maternal depression, which could have a “<strong>[xxx]</strong>” benefit to a child’s <strong>[xxx]</strong>. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts <strong>[xxx]</strong> to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.</p>\n</blockquote>\n<p>原文的 reduce stress and maternal depression 是 introducing additional caregivers 带来的结果，做法是增加照料者，受益的是父母。D的 prevent parental depression 却把结果直接改成托儿所应承担的任务。后面的英国托儿所被拿来比较的是一个照料者与四个孩子的比例，并没有让它承担心理干预的职责。原文从照料安排谈到减轻母亲抑郁，D却把受益结果改写成英国托儿所的工作目标，跳过了文章正在比较的照料人数。</p>\n<p><strong>增加照料者可能减轻抑郁，等不等于托儿所本身被要求承担预防抑郁的任务？</strong></p>\n<p>不等于。原文把情绪好转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C接上照料者数量及增加帮助的好处；A的要求性质还没有读清。B把比例规定说成招聘困难，D把受益结果改成机构任务，先留A、C。</p>\n<blockquote>\n<p><strong>29题暂时留下A和C。</strong></p>\n</blockquote>\n<h2>30题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪一项最适合作为全文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Instructive teaching: a dilemma for anxious parents</strong></p>\n<p>指令式教学：焦虑父母的一个难题</p>\n<p>B. <strong>For a happier family, learn from the hunter-gatherers</strong></p>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n<p>C. <strong>Mixed-age playgroup, a better choice for lonely children</strong></p>\n<p>混龄玩耍小组：孤独孩子更好的选择</p>\n<p>D. <strong>Tracing the history of parenting: from Africa to Europe</strong></p>\n<p>追溯育儿历史：从非洲到欧洲</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child’s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 <strong>[xxx]</strong> a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.</p>\n<p>开始精读：</p>\n<p>By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half of a child’s care. / One previous study / looked at the Efé people / of the Democratic Republic of Congo. / It found / that infants had an average of 14 <strong>[xxx]</strong> a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.</p>\n<p>相比之下， / 在狩猎采集者社会里 / 父母以外的成年人 / 可以提供 / 一个孩子的照料的几乎一半。 / 一项先前的研究 / 考察了Efé人 / 刚果民主共和国的。 / 它发现 / 婴儿平均每天有14个 <strong>[xxx]</strong> / 到他们18周大时 / 而且在照料者之间被传递 / 每小时八次。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>While hunter-gatherer children learnt from observation and <strong>[xxx]</strong> in mixed-age playgroups, researchers said that western “<strong>[xxx]</strong> teaching”, where pupils are asked to sit still, may contribute to conditions such as attention deficit <strong>[xxx]</strong> disorder. Chaudhary said that Britain should explore the possibility that older <strong>[xxx]</strong> helping their parents “might also enhance their own social development.”</p>\n<p>开始精读：</p>\n<p>While hunter-gatherer children learnt / from observation and <strong>[xxx]</strong> / in mixed-age playgroups, / researchers said / that western “<strong>[xxx]</strong> teaching”, / where pupils are asked to sit still, / may contribute to conditions / such as attention deficit <strong>[xxx]</strong> disorder. / Chaudhary said / that Britain should explore the possibility / that older <strong>[xxx]</strong> helping their parents / “might also enhance / their own social development.”</p>\n<p>虽然狩猎采集者的孩子学习 / 通过观察和 <strong>[xxx]</strong> / 在混龄玩耍小组里， / 研究人员说 / 西方的“<strong>[xxx]</strong> 教学”， / 在其中学生被要求坐着不动， / 可能促成一些状况 / 例如注意缺陷 <strong>[xxx]</strong> 障碍。 / Chaudhary说 / 英国应该探索这种可能性 / 年长的 <strong>[xxx]</strong> 帮助他们的父母 / “也可能促进 / 他们自己的社会发展。”</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>对照狩猎采集者群体由父母以外的人分担大量照料，并给出Efé的情况。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>将借鉴延伸到混龄学习与帮助父母可能带来的社会发展，建议英国探索。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. Instructive teaching: a dilemma for anxious parents</h3>\n<p>指令式教学：焦虑父母的一个难题</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A成立，全文中心应当是“指令式教学：焦虑父母的一个难题”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先介绍别处的教学办法可能帮助解决父母焦虑。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明改变教学能带来哪些情绪好处。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举例怎样把更好的教学方式引入学校。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释现有指令式教学有什么问题。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出另一种课堂教学作为对照。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明改变教学的好处与学校现状的差距。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后提出解决教学难题的办法。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>A抓住了最后一段的teaching，也抓住前面的anxiety，但全文多数段落在写谁照顾孩子：很多成年人、老人帮忙、母亲单独负责、照料者人数。它们并不是围绕课堂指令式教学安排的。德国把养老院和托儿所配对，也是让老人参与照料，没有介绍如何改课堂讲授。把最后一段的一种教学问题升成总标题，会让前六段反复讨论共同照料显得偏离中心。</p>\n<p><strong>指令式教学能否解释老人帮忙、母亲独自照料以及照料人数这些主要内容？</strong></p>\n<p>不能。这些段落首先讨论育儿责任如何分担，教学只是结尾补充的一个可探索方向，A把末段的一部分扩大成全文。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. For a happier family, learn from the hunter-gatherers</h3>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B成立，全文中心应当是“为了更幸福的家庭，向狩猎采集者学习”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先说狩猎采集者的育儿办法可能值得其他家庭学习。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明共同照料可能减少父母与孩子的焦虑。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举德国与跨年级活动说明西方可以如何借鉴。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释让母亲单独照料为什么可能有害。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出其他成年人参与照料的情况作对照。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明增加照料者的好处以及英国配比的差距。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后提出混龄学习、帮助父母等继续探索的方向。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>B的learn from准确解释了全文为何从非洲群体讲到德国和英国：作者不是只介绍遥远风俗，而是在讨论可以怎样借鉴。happier family又能接上第2段less anxiety、第4段对有害负担的批评，以及第6段减少压力和母亲抑郁的好处。最后的社会发展也属于孩子与家庭可能得到的益处。标题没有把学习缩成一种课堂形式，也没有声称现代家庭必须原样复制所有做法。</p>\n<p><strong>向狩猎采集者学习以改善家庭生活，能否贯穿开头、具体例子、对比和结尾建议？</strong></p>\n<p>能。开头给出借鉴来源，中间说明做法、必要性和好处，结尾继续提出英国可以探索的方向，都在回答怎样让家庭获得更好的照料与支持。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. Mixed-age playgroup, a better choice for lonely children</h3>\n<p>混龄玩耍小组：孤独孩子更好的选择</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C成立，全文中心应当是“混龄玩耍小组：孤独孩子更好的选择”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先说混龄玩耍值得孤独孩子尝试。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明混龄活动怎样减轻孤独。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举例如何建立混龄玩耍小组。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释孩子孤独的主要原因。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出不孤独儿童的活动安排作对照。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明参加小组的好处以及现实参与不足。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后继续建议孤独孩子加入混龄小组。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>C确实用了mixed-age playgroup，能对应第3段后半和最后一段，却把范围限定为lonely children。全文没有围绕孤独儿童展开，反复出现的另一类受益者是父母。老人参与照料、母亲独自承担育儿的疲惫、托儿所人手比例，都不能只用孩子加入玩耍小组来解释。减少焦虑也不等于专门缓解孤独，标题把问题与对象都缩窄了。</p>\n<p><strong>只谈孤独孩子的混龄小组，能否包住父母负担和社会共同照料的大量内容？</strong></p>\n<p>不能。混龄活动只是借鉴办法的一部分，父母焦虑与多人分担同样贯穿全文，C遗漏这些中心内容，还增加了孤独这一特定问题。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. Tracing the history of parenting: from Africa to Europe</h3>\n<p>追溯育儿历史：从非洲到欧洲</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D成立，全文中心应当是“追溯育儿历史：从非洲到欧洲”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出非洲育儿史值得追溯。</td>\n<td>先说别处的做法可能值得学</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明研究历史能带来哪些认识。</td>\n<td>再说这样做可能带来好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>举例说明育儿方式从非洲传到西方的过程。</td>\n<td>再说可以用哪些办法来学</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>回头解释某种历史阶段怎样形成。</td>\n<td>回头解释原来的办法哪里不好</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>摆出另一阶段的育儿方式。</td>\n<td>再说别处是怎样做的</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>比较非洲与欧洲沿历史演进形成的差别。</td>\n<td>再说改变的好处和眼前的差距</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后交代育儿方式传播到英国后的历史结果。</td>\n<td>最后说还可以试着改变什么</td>\n</tr>\n</tbody></table>\n<p>D能对应非洲、德国、英国和evolutionary history这些词，但它要求文章按历史传播过程组织。实际段落在问现在可以怎么做：第3段说融入西方的办法，第6段比较当下配比，第7段建议英国探索。文中没有写非洲育儿方式何时传到欧洲、经历了哪些阶段。演化历史在第4段只是用来解释让母亲单独承担为何是一种近期偏离，不是整篇历史叙述。</p>\n<p><strong>从非洲到欧洲追溯历史，能否解释文章反复给出的当下借鉴办法和未来探索建议？</strong></p>\n<p>不能。地名代表可借鉴的来源和可能采用的地方，没有构成历史传播路线；全文重在改善今天的育儿安排。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<h3>30题结论</h3>\n<p><strong>30. B. For a happier family, learn from the hunter-gatherers</strong></p>\n<p>开头把非洲育儿做法当作可借鉴的资源，中间写如何融入西方并对照母亲单独照料的负担，结尾继续提出英国可以探索的办法。标题B同时包含借鉴对象和让家庭更好的目的。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>For a happier family, learn from the hunter-gatherers / 为了更幸福的家庭，向狩猎采集者学习</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查26题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. sharing childcare among community members</li>\n<li>B. <strong>[xxx]</strong> babies to specific adult caregivers</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\n<p>第一遍留下A、B，是因为A清楚说共同分担，而B的动作没有读清；specific adult caregivers也不能简单理解成只有一个照料者。我们先把题干和两个选项接起来。A说alloparenting是群体成员分担育儿，B说把婴儿以某种方式安排给特定的成年人。两项都碰到了婴儿与照料者，但A直接讲清参与关系，B只让我们看到人选和一个没有读懂的动作。现在拿主旨来检查。全文要求为了更幸福的家庭向狩猎采集者学习，德国老人参与、父母以外的人分担照料、增加照料者减少压力，都在说明值得学的是让更多人承担照料。A的sharing把这个能产生好处的分担办法说出来，因此既能解释开头的名称，也能解释全文为什么反复扩大参与照料的人群。B里的specific只是特定人选，单独这层意思不能说明参与者是否增加、责任是否分担；若要把它也当作名称定义，还得给 <strong>[xxx]</strong> 加上目前没有读出的安排内容。回到第一遍的each child is cared for by many adults，A已有一条清楚的局部对应，如今全文又反复以共同照料作为可借鉴的办法。B没有获得同样明确的第二层支持。这里选A，不把B中看不懂的动作擅自翻成相反意思。</p>\n<blockquote>\n<p><strong>26题选A。</strong></p>\n</blockquote>\n<hr>\n<h2>回查27题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. an attempt to facilitate <strong>[xxx]</strong> communication</li>\n<li>B. an approach to integrating alloparenting into western society</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\n<p>第一遍A和B都留下，是因为德国养老院与托儿所配对确实让老人儿童发生接触，而A说的交流种类没有读清；B则直接接上了例子前面融入西方生活的判断。我们先把题干和两个选项接起来。A说德国计划用来说明促进某种交流的尝试，B说它说明怎样把alloparenting带进西方社会。现在拿主旨来检查。标题的中心是为了更幸福的家庭，向狩猎采集者学习。把这个方向放回德国计划，老人帮助照顾孩子就是西方可以采用的多人照料办法，既说明学什么，也说明怎么在现有环境中实行，因此给B增加了全文目的上的支持。A的communication只抓到老人和儿童可能交往，还没有说明这种交往为什么被作者放进育儿借鉴文章。即使交流确实发生，也不能因此把它变成作者举例的主要目的。再接回第一遍读过的incorporate them into western life，例前观点已经明说要把做法融入西方，例中又写look after the children。B同时连接这两处局部安排和标题的借鉴目的；A只保留了活动可能伴随的一种现象，没有接上为什么要用德国来证明可借鉴。因此选B，仍不需要替A补出具体是哪一种交流。</p>\n<blockquote>\n<p><strong>27题选B。</strong></p>\n</blockquote>\n<hr>\n<h2>回查28题：B还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. <strong>[xxx]</strong> family relationships</li>\n<li>D. departs from the course of evolution</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\n<p>第一遍D直接接上broke with evolutionary history，但B说家庭关系前的动作没有读清，不能自行假定它是正面评价再排除。我们先把题干和两个选项接起来。B说密集母职叙述对家庭关系产生某种 <strong>[xxx]</strong> 作用，D说它偏离演化的进程。现在拿主旨来检查。标题提出向狩猎采集者学习以改善家庭生活，全文用多人分担的长期做法来对照母亲独自承担的近期安排。这个总体比较让第4段提到演化历史的用意更清楚：作者要解释为什么重新学习共同照料有必要，不能把母亲独自负责当作唯一自然而然的安排。D说偏离演化进程，既对应本段明确的broke with，也能说明这一段在全文借鉴建议中的作用。B谈family relationships，可能涉及家庭中的后果，但那个动作仍不清楚，单有“家庭关系”不能解释文章为什么专门区分recent invention与evolutionary history。回看第一遍，本段明确给出的历史判断是近期转变与演化历史分开，负面后果只是继续说明这种转变可能有害。D获得了局部明说和全文比较方向的双重支持；B没有读出的关系不能替它补齐这样的联系。最终选D，并不把标题当成翻译B的词典。</p>\n<blockquote>\n<p><strong>28题选D。</strong></p>\n</blockquote>\n<hr>\n<h2>回查29题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. They tend to fall short of <strong>[xxx]</strong> requirements.</li>\n<li>C. They ought to improve their carer-to-child ratio.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>For a happier family, learn from the hunter-gatherers</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>为了更幸福的家庭，向狩猎采集者学习</p>\n</blockquote>\n<p>第一遍C接上照料人数的对比，A的requirements却缺少种类说明；不能先把它补成某一种要求，然后说英国一定违反或者一定没有违反。我们先把题干和两个选项接起来。A说英国托儿所往往达不到某种要求，C说应该改善照料者与孩子的比例。现在拿主旨来检查。全文建议为了更幸福的家庭向狩猎采集者学习，重点在借鉴多人分担照料的做法。把这个建议放回英国托儿所，最直接可改变的正是每个孩子得到多少照料者的帮助。C既指出英国该改哪里，也保留了“应当改善”的建议语气，能接上标题的学习方向。A说“往往未达要求”，需要先知道要求是什么，再有实际达到情况的比较；标题的借鉴建议并没有补出这些事实，也没有把另一种育儿做法宣布为英国已经必须遵守的标准。回到第一遍，第6段明说增加照料者可以减少压力，然后拿一个婴儿十多人照顾与一人四孩比较。它给C的是为什么值得改善配比的具体依据。A虽然与标准有词语联系，却没有得到同样清楚的现状判定。C同时得到本段人数关系和全文借鉴方向的支持，所以选C，不猜A中要求的具体类别。</p>\n<blockquote>\n<p><strong>29题选C。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>26. A</strong></p>\n<p><strong>27. B</strong></p>\n<p><strong>28. D</strong></p>\n<p><strong>29. C</strong></p>\n<p><strong>30. B</strong></p>\n","analysisStartIndex":38,"maskInventory":{"token":"[xxx]","count":160},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"ordinaryFirstRoundCandidates":{"26":["A","B"],"27":["A","B"],"28":["B","D"],"29":["A","C"]},"maskAdjustmentState":"not_needed","mainIdeaQid":"30"},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlow function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h);if(!baseW||!baseH)return;const pw=wrap.querySelector('.pageWrap')||wrap;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=(a[0]/baseW*100)+'%';d.style.top=(a[1]/baseH*100)+'%';d.style.width=(a[2]/baseW*100)+'%';d.style.height=(a[3]/baseH*100)+'%';pw.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,behavior:'smooth'})}
