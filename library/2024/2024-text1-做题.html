<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 21题题干\n\n**The Romans buried the nails probably for the sake of ______.**\n\n> 罗马人埋下钉子，很可能是为了什么？\n\n题型：**原因细节题**。","articleRects":[],"questionRects":[[226,186,883,46]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"},"html":"<h2>21题题干</h2>\n<p><strong>The Romans buried the nails probably for the sake of ______.</strong></p>\n<blockquote><p>罗马人埋下钉子，很可能是为了什么？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 22题题干\n\n**The example of early 17th-century Virginians is used to ______.**\n\n> 十七世纪初弗吉尼亚人的例子用来说明什么？\n\n题型：**例证作用题**。","articleRects":[],"questionRects":[[226,570,998,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"},"html":"<h2>22题题干</h2>\n<p><strong>The example of early 17th-century Virginians is used to ______.</strong></p>\n<blockquote><p>十七世纪初弗吉尼亚人的例子用来说明什么？</p>\n</blockquote>\n<p>题型：<strong>例证作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 23题题干\n\n**What played the major role in lowering the price of nails after the late 1700s?**\n\n> 1700年代后期以后，什么在降低钉子价格方面发挥了主要作用？\n\n题型：**原因细节题**。","articleRects":[],"questionRects":[[226,951,1194,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"},"html":"<h2>23题题干</h2>\n<p><strong>What played the major role in lowering the price of nails after the late 1700s?</strong></p>\n<blockquote><p>1700年代后期以后，什么在降低钉子价格方面发挥了主要作用？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 24题题干\n\n**It can be learned from Paragraph 5 that nails ______.**\n\n> 从第5段可以得知，钉子具有怎样的特点？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,1331,835,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"},"html":"<h2>24题题干</h2>\n<p><strong>It can be learned from Paragraph 5 that nails ______.</strong></p>\n<blockquote><p>从第5段可以得知，钉子具有怎样的特点？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 25题题干\n\n**Which of the following best summarises the last two paragraphs?**\n\n> 下面哪一项最能概括最后两段？\n\n题型：**局部主旨题**。","articleRects":[],"questionRects":[[226,1712,1013,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"},"html":"<h2>25题题干</h2>\n<p><strong>Which of the following best summarises the last two paragraphs?</strong></p>\n<blockquote><p>下面哪一项最能概括最后两段？</p>\n</blockquote>\n<p>题型：<strong>局部主旨题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, although, without |\n| 态度词／评价词 | 先抓个大概好坏 | valuable, scarce, cheap |\n| 动作词 | 先看谁做了什么 | recover, turn, transformed |\n| 结果词 | 看最后出了什么事 | price, cost, change |\n| 重复主题词 | 大概知道老在说什么 | nails, technology, price |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, although, without</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>valuable, scarce, cheap</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>recover, turn, transformed</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>price, cost, change</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>nails, technology, price</td></tr></tbody></table>\n"},{"section":"读文章","raw":"Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things. The nail **[xxx]** was discovered in 1960 in a four-metre-deep pit covered by two metres of **[xxx]**.","articleRects":[[273,288,1123,38],[202,337,1184,38],[202,387,1194,38],[202,436,249,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things. The nail <strong>[xxx]</strong> was discovered in 1960 in a four-metre-deep pit covered by two metres of <strong>[xxx]</strong>.</p>\n</div></div>"},{"section":"读文章","raw":"Nearly 2,000 years ago, / as the Romans began to pull out of Scotland, / they left behind a curious treasure: / 10 tons of nails, / nearly a million of the things. / The nail **[xxx]** was discovered in 1960 in a four-metre-deep pit covered by two metres of **[xxx]**.","articleRects":[[273,288,1123,38],[202,337,1184,38],[202,387,1194,38],[202,436,249,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Nearly 2,000 years ago, / as the Romans began to pull out of Scotland, / they left behind a curious treasure: / 10 tons of nails, / nearly a million of the things. / The nail <strong>[xxx]</strong> was discovered in 1960 in a four-metre-deep pit covered by two metres of <strong>[xxx]</strong>.</p>\n</div></div>"},{"section":"读文章", 子显然仍是钉子、完全说得通。</p>\n</div><div class=\"coarseDone\"><p>6、日常物品的一个特定特征、我是一名经济学家、廉价技术。</p>\n</div><div class=\"currentFocus\"><p>7、古腾堡印刷机、改变了文明、改变书写的性质、改变其成本、常被忽视的名为纸的技术、直到它们变得便宜、全球能源系统。</p>\n</div></div>"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到撤出苏格兰、一笔奇特的宝藏、近一百万、发现于1960年；中间又出现埋下一百万枚钉子、撤离很仓促、撤离很仓促、不会被发现；熟练铁匠的劳动、原材料、取回贵重的钉子、昂贵而有价值；钉子的价格、下降90%、更便宜的铁和能源、更高效的方法；它们变化不大、罗马钉子显然仍是钉子、罗马钉子显然仍是钉子、完全说得通；日常物品的一个特定特征、我是一名经济学家、我是一名经济学家、廉价技术；结尾还有古腾堡印刷机、改变了文明、直到它们变得便宜、全球能源系统。\n\n到这里还不能自然地说清楚：埋藏、回收和降价分别说明钉子的什么特点，研究钉子价格与后面的印刷、能源例子怎样相接。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到撤出苏格兰、一笔奇特的宝藏、近一百万、发现于1960年；中间又出现埋下一百万枚钉子、撤离很仓促、撤离很仓促、不会被发现；熟练铁匠的劳动、原材料、取回贵重的钉子、昂贵而有价值；钉子的价格、下降90%、更便宜的铁和能源、更高效的方法；它们变化不大、罗马钉子显然仍是钉子、罗马钉子显然仍是钉子、完全说得通；日常物品的一个特定特征、我是一名经济学家、我是一名经济学家、廉价技术；结尾还有古腾堡印刷机、改变了文明、直到它们变得便宜、全球能源系统。</p>\n<p>到这里还不能自然地说清楚：埋藏、回收和降价分别说明钉子的什么特点，研究钉子价格与后面的印刷、能源例子怎样相接。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"21题","raw":"## 21题\n\n> The Romans buried the nails probably for the sake of ______.  \n> 罗马人埋下钉子，很可能是为了什么？\n\n题干给出Romans和buried the nails，第2段正以Why had the Romans buried a million nails?发问。先把第2段完整读完，找作者对埋钉子原因的解释。\n\n> 原文参考：\n> \n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of **[xxx]** iron. The Romans buried the nails so deep that they would not be discovered for almost two **[xxx]**.\n> \n> 开始精读：\n> \n> Why had the Romans buried a million nails? / The likely explanation is that the withdrawal was rushed, / and they didn’t want the local Caledonians / getting their hands on 10 tons of **[xxx]** iron. / The Romans buried the nails so deep / that they would not be discovered / for almost two **[xxx]**.\n> \n> 罗马人为什么埋下了一百万枚钉子？ / 可能的解释是，撤离很仓促， / 而且他们不希望当地的卡利多尼亚人 / 得到10吨**[xxx]**铁。 / 罗马人把钉子埋得如此之深， / 以至于它们不会被发现， / 持续了将近两**[xxx]**。\n\n题干的for the sake of要接罗马人埋钉子想达到的目的。第2段把撤离、当地卡利多尼亚人和埋藏的做法连起来，要检查选项能否说明其中的目的。\n\n接下来按A—D逐项看。","articleRects":[[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37]],"questionRects":[[226,186,883,46],[280,253,432,38],[280,317,432,37],[280,380,433,38],[280,443,453,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"21","initialReadingPids":[1]},"html":"<h2>21题</h2>\n<blockquote><p>The Romans buried the nails probably for the sake of ______.<br />\n罗马人埋下钉子，很可能是为了什么？</p>\n</blockquote>\n<p>题干给出Romans和buried the nails，第2段正以Why had the Romans buried a million nails?发问。先把第2段完整读完，找作者对埋钉子原因的解释。</p>\n<blockquote><p>原文参考：</p>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of <strong>[xxx]</strong> iron. The Romans buried the nails so deep that they would not be discovered for almost two <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>Why had the Romans buried a million nails? / The likely explanation is that the withdrawal was rushed, / and they didn’t want the local Caledonians / getting their hands on 10 tons of <strong>[xxx]</strong> iron. / The Romans buried the nails so deep / that they would not be discovered / for almost two <strong>[xxx]</strong>.</p>\n<p>罗马人为什么埋下了一百万枚钉子？ / 可能的解释是，撤离很仓促， / 而且他们不希望当地的卡利多尼亚人 / 得到10吨<strong>[xxx]</strong>铁。 / 罗马人把钉子埋得如此之深， / 以至于它们不会被发现， / 持续了将近两<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>题干的for the sake of要接罗马人埋钉子想达到的目的。第2段把撤离、当地卡利多尼亚人和埋藏的做法连起来，要检查选项能否说明其中的目的。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"21题","raw":"### A. saving them for future use\n\n> 把它们存起来供将来使用\n\n把A接回题干，它说的是：罗马人埋下钉子，很可能是为了把它们存起来供将来使用。\n\nA说留待以后使用，回第2段看埋藏原因中他们不想让谁拿到钉子。\n\n> they didn’t want the local Caledonians getting their hands on 10 tons of **[xxx]** iron.\n\n> The Romans buried the nails so deep that they would not be discovered for almost two **[xxx]**.\n\n撤退很匆忙，他们不想让当地人拿到这批铁，于是深埋。这里直接交代了防止别人取得的想法。\n\n如果是为自己未来使用，还应有以后回来取、另找机会使用的打算。原文没有交代这种计划，深埋本身也不能证明准备取回。\n\n**不让别人得到，就一定是在给自己储备将来用品吗？**\n\n不一定。A把拒绝留给当地人的目的换成了未来使用计划。\n\n**第一轮判断：A排除。**","articleRects":[[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37]],"questionRects":[[280,253,432,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>A. saving them for future use</h3>\n<blockquote><p>把它们存起来供将来使用</p>\n</blockquote>\n<p>把A接回题干，它说的是：罗马人埋下钉子，很可能是为了把它们存起来供将来使用。</p>\n<p>A说留待以后使用，回第2段看埋藏原因中他们不想让谁拿到钉子。</p>\n<blockquote><p>they didn’t want the local Caledonians getting their hands on 10 tons of <strong>[xxx]</strong> iron.</p>\n</blockquote>\n<blockquote><p>The Romans buried the nails so deep that they would not be discovered for almost two <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>撤退很匆忙，他们不想让当地人拿到这批铁，于是深埋。这里直接交代了防止别人取得的想法。</p>\n<p>如果是为自己未来使用，还应有以后回来取、另找机会使用的打算。原文没有交代这种计划，深埋本身也不能证明准备取回。</p>\n<p><strong>不让别人得到，就一定是在给自己储备将来用品吗？</strong></p>\n<p>不一定。A把拒绝留给当地人的目的换成了未来使用计划。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"21题","raw":"### B. keeping them from rusting\n\n> 防止它们生锈\n\n把B接回题干，它说的是：罗马人埋下钉子，很可能是为了防止它们生锈。\n\nB说防锈，回第2段看埋得深之后的结果。\n\n> they didn’t want the local Caledonians getting their hands on 10 tons of **[xxx]** iron.\n\n作者说埋得太深，近两千年都没被发现。这里强调的是人发现不了它，而不是空气、水或土壤怎样影响铁。\n\n哪怕钉子后来保存下来，也不能用发现后的状态替换当时明确说出的意图。\n\n**深埋后不易被发现，能直接说明埋藏是为了防锈吗？**\n\n不能。原文的解释围绕防止当地人获取，B添了材料保存的目的。\n\n**第一轮判断：B排除。**","articleRects":[[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37]],"questionRects":[[280,317,432,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>B. keeping them from rusting</h3>\n<blockquote><p>防止它们生锈</p>\n</blockquote>\n<p>把B接回题干，它说的是：罗马人埋下钉子，很可能是为了防止它们生锈。</p>\n<p>B说防锈，回第2段看埋得深之后的结果。</p>\n<blockquote><p>they didn’t want the local Caledonians getting their hands on 10 tons of <strong>[xxx]</strong> iron.</p>\n</blockquote>\n<p>作者说埋得太深，近两千年都没被发现。这里强调的是人发现不了它，而不是空气、水或土壤怎样影响铁。</p>\n<p>哪怕钉子后来保存下来，也不能用发现后的状态替换当时明确说出的意图。</p>\n<p><strong>深埋后不易被发现，能直接说明埋藏是为了防锈吗？</strong></p>\n<p>不能。原文的解释围绕防止当地人获取，B添了材料保存的目的。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"21题","raw":"### C. letting them grow in value\n\n> 让它们增值\n\n把C接回题干，它说的是：罗马人埋下钉子，很可能是为了让它们增值。\n\nC说让钉子增值，回第2段找关于价格将变化的判断。\n\n> The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of **[xxx]** iron.\n\n他们匆忙撤离，担心当地人得到铁，所以掩埋。这一段没有预测铁价或钉子价格会上涨。\n\n钉子值得藏，并不意味着藏一段时间会变得更值钱。“已经有价值”与“通过掩埋增加价值”仍是两件事。\n\n**作者有没有把埋藏和以后涨价连在一起？**\n\n没有。C把珍惜物品改成了使物品增值。\n\n**第一轮判断：C排除。**","articleRects":[[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37]],"questionRects":[[280,380,433,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>C. letting them grow in value</h3>\n<blockquote><p>让它们增值</p>\n</blockquote>\n<p>把C接回题干，它说的是：罗马人埋下钉子，很可能是为了让它们增值。</p>\n<p>C说让钉子增值，回第2段找关于价格将变化的判断。</p>\n<blockquote><p>The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of <strong>[xxx]</strong> iron.</p>\n</blockquote>\n<p>他们匆忙撤离，担心当地人得到铁，所以掩埋。这一段没有预测铁价或钉子价格会上涨。</p>\n<p>钉子值得藏，并不意味着藏一段时间会变得更值钱。“已经有价值”与“通过掩埋增加价值”仍是两件事。</p>\n<p><strong>作者有没有把埋藏和以后涨价连在一起？</strong></p>\n<p>没有。C把珍惜物品改成了使物品增值。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"21题","raw":"### D. hiding them from the locals\n\n> 把它们藏起来，不让当地人发现\n\n把D接回题干，它说的是：罗马人埋下钉子，很可能是为了把它们藏起来，不让当地人发现。\n\nD说藏起来不让当地人发现，回第2段看didn’t want the local Caledonians getting their hands on。\n\n> they didn’t want the local Caledonians getting their hands on 10 tons of **[xxx]** iron.\n\n> The Romans buried the nails so deep that they would not be discovered for almost two **[xxx]**.\n\nlocal Caledonians就是当地人，getting their hands on是拿到这批铁。罗马人不愿出现这种情况，接着把钉子埋得很深。\n\n“藏起来”正是让当地人拿不到的办法，后来长期没被发现也符合这种做法。\n\n**D的藏匿对象与原文不想让谁得到钉子是否一致？**\n\n一致，都是当地人。D能接上文章给出的可能原因。\n\n**第一轮判断：D保留。**","articleRects":[[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37]],"questionRects":[[280,443,453,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"21","paragraphPids":[1]},"html":"<h3>D. hiding them from the locals</h3>\n<blockquote><p>把它们藏起来，不让当地人发现</p>\n</blockquote>\n<p>把D接回题干，它说的是：罗马人埋下钉子，很可能是为了把它们藏起来，不让当地人发现。</p>\n<p>D说藏起来不让当地人发现，回第2段看didn’t want the local Caledonians getting their hands on。</p>\n<blockquote><p>they didn’t want the local Caledonians getting their hands on 10 tons of <strong>[xxx]</strong> iron.</p>\n</blockquote>\n<blockquote><p>The Romans buried the nails so deep that they would not be discovered for almost two <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>local Caledonians就是当地人，getting their hands on是拿到这批铁。罗马人不愿出现这种情况，接着把钉子埋得很深。</p>\n<p>“藏起来”正是让当地人拿不到的办法，后来长期没被发现也符合这种做法。</p>\n<p><strong>D的藏匿对象与原文不想让谁得到钉子是否一致？</strong></p>\n<p>一致，都是当地人。D能接上文章给出的可能原因。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"21题","raw":"### 21题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。罗马人不希望当地人得到这批铁，深埋的作用是使钉子不被发现。","articleRects":[],"questionRects":[[226,186,883,46],[280,253,432,38],[280,317,432,37],[280,380,433,38],[280,443,453,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"21"},"html":"<h3>21题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。罗马人不希望当地人得到这批铁，深埋的作用是使钉子不被发现。</p>\n"},{"section":"22题","raw":"## 22题\n\n> The example of early 17th-century Virginians is used to ______.  \n> 十七世纪初弗吉尼亚人的例子用来说明什么？\n\n题干直接点出early 17th-century Virginians，第3段出现同一群人。先完整精读第3段，把例子前面的评价、例子中的做法和段末说明连起来。\n\n> 原文参考：\n> \n> Later civilisations would value the skilled blacksmith’s labour in a nail even more than the raw material. As Roma Agrawal explains in her new **[xxx]** book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to **[xxx]**. This was an attempt to recover the valuable nails, which could be reused after **[xxx]** the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the **[xxx]** technology was.\n> \n> 开始精读：\n> \n> Later civilisations would value the skilled blacksmith’s labour in a nail / even more than the raw material. / As Roma Agrawal explains in her new **[xxx]** book Nuts and Bolts, / early 17th-century Virginians would sometimes burn down their homes / if they were planning to **[xxx]**. / This was an attempt to recover the valuable nails, / which could be reused / after **[xxx]** the ashes. / The idea that one might burn down an entire house / just to reclaim the nails / underlines how scarce, costly and valuable the **[xxx]** technology was.\n> \n> 后来的文明会看重一枚钉子中熟练铁匠付出的劳动， / 甚至超过对原材料的重视。 / 正如罗玛·阿格拉瓦尔在她的新**[xxx]**著作《螺母与螺栓》中所解释的， / 17世纪初的弗吉尼亚人有时会烧掉自己的房屋， / 如果他们计划**[xxx]**。 / 这是为了设法取回那些贵重的钉子， / 这些钉子可以再次使用， / 在**[xxx]**灰烬之后。 / 一个人可能烧掉整栋房子的这种想法， / 仅仅为了取回钉子， / 凸显了这种**[xxx]**技术是多么稀缺、昂贵而有价值。\n\n本题问这个例子被用来做什么，不能只复述弗吉尼亚人烧房子。要看原文怎样把这一做法接到铁匠劳动、钉子和技术的价值上。\n\n接下来按A—D逐项看。","articleRects":[[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38]],"questionRects":[[226,570,998,38],[280,634,798,37],[280,697,825,38],[280,760,907,31],[280,824,944,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"22","initialReadingPids":[2]},"html":"<h2>22题</h2>\n<blockquote><p>The example of early 17th-century Virginians is used to ______.<br />\n十七世纪初弗吉尼亚人的例子用来说明什么？</p>\n</blockquote>\n<p>题干直接点出early 17th-century Virginians，第3段出现同一群人。先完整精读第3段，把例子前面的评价、例子中的做法和段末说明连起来。</p>\n<blockquote><p>原文参考：</p>\n<p>Later civilisations would value the skilled blacksmith’s labour in a nail even more than the raw material. As Roma Agrawal explains in her new <strong>[xxx]</strong> book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to <strong>[xxx]</strong>. This was an attempt to recover the valuable nails, which could be reused after <strong>[xxx]</strong> the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the <strong>[xxx]</strong> technology was.</p>\n<p>开始精读：</p>\n<p>Later civilisations would value the skilled blacksmith’s labour in a nail / even more than the raw material. / As Roma Agrawal explains in her new <strong>[xxx]</strong> book Nuts and Bolts, / early 17th-century Virginians would sometimes burn down their homes / if they were planning to <strong>[xxx]</strong>. / This was an attempt to recover the valuable nails, / which could be reused / after <strong>[xxx]</strong> the ashes. / The idea that one might burn down an entire house / just to reclaim the nails / underlines how scarce, costly and valuable the <strong>[xxx]</strong> technology was.</p>\n<p>后来的文明会看重一枚钉子中熟练铁匠付出的劳动， / 甚至超过对原材料的重视。 / 正如罗玛·阿格拉瓦尔在她的新<strong>[xxx]</strong>著作《螺母与螺栓》中所解释的， / 17世纪初的弗吉尼亚人有时会烧掉自己的房屋， / 如果他们计划<strong>[xxx]</strong>。 / 这是为了设法取回那些贵重的钉子， / 这些钉子可以再次使用， / 在<strong>[xxx]</strong>灰烬之后。 / 一个人可能烧掉整栋房子的这种想法， / 仅仅为了取回钉子， / 凸显了这种<strong>[xxx]</strong>技术是多么稀缺、昂贵而有价值。</p>\n</blockquote>\n<p>本题问这个例子被用来做什么，不能只复述弗吉尼亚人烧房子。要看原文怎样把这一做法接到铁匠劳动、钉子和技术的价值上。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"22题","raw":"### A. highlight the thriftiness of early American colonists\n\n> 突出早期美洲殖民者的节俭\n\n把A接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。\n\nA说殖民者节俭，回第3段看烧房取钉后作者怎样收束。\n\n> This was an attempt to recover the valuable nails\n\n> underlines how scarce, costly and valuable the **[xxx]** technology was.\n\n把钉子取回重复使用，表面上确实像节省。但这个故事最特别的是为取钉子竟然愿意烧掉整栋房子，代价很大。\n\n作者随后明说这凸显技术scarce、costly、valuable，并没有转去评价殖民者如何节约其他东西。\n\n**烧掉整栋房子这一细节，主要让我们看到节俭品格，还是钉子贵到值得这样做？**\n\n是后者。A把对物品价值的说明换成了对人物性格的评价。\n\n**第一轮判断：A排除。**","articleRects":[[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38]],"questionRects":[[280,634,798,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"22","paragraphPids":[2]},"html":"<h3>A. highlight the thriftiness of early American colonists</h3>\n<blockquote><p>突出早期美洲殖民者的节俭</p>\n</blockquote>\n<p>把A接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。</p>\n<p>A说殖民者节俭，回第3段看烧房取钉后作者怎样收束。</p>\n<blockquote><p>This was an attempt to recover the valuable nails</p>\n</blockquote>\n<blockquote><p>underlines how scarce, costly and valuable the <strong>[xxx]</strong> technology was.</p>\n</blockquote>\n<p>把钉子取回重复使用，表面上确实像节省。但这个故事最特别的是为取钉子竟然愿意烧掉整栋房子，代价很大。</p>\n<p>作者随后明说这凸显技术scarce、costly、valuable，并没有转去评价殖民者如何节约其他东西。</p>\n<p><strong>烧掉整栋房子这一细节，主要让我们看到节俭品格，还是钉子贵到值得这样做？</strong></p>\n<p>是后者。A把对物品价值的说明换成了对人物性格的评价。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"22题","raw":"### B. illustrate the high status of blacksmiths in that period\n\n> 说明那个时期铁匠的崇高地位\n\n把B接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来说明那个时期铁匠的崇高地位。\n\nB说铁匠地位高，回第3段看skilled blacksmith’s labour的重点。\n\n> value the skilled blacksmith’s labour in a nail even more than the raw material.\n\n> underlines how scarce, costly and valuable the **[xxx]** technology was.\n\n被重视的是铁匠凝结在一枚钉子里的熟练劳动，甚至比铁原料更值钱。随后烧房取钉，是为把这份已经做成的价值拿回来。\n\n劳动成果昂贵，不等于铁匠在社会等级中地位高；作者没有介绍铁匠得到何种身份或待遇。\n\n**珍惜铁匠做成的钉子，就直接证明铁匠社会地位崇高吗？**\n\n不能。B把劳动及产品的价值换成了人的社会地位。\n\n**第一轮判断：B排除。**","articleRects":[[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38]],"questionRects":[[280,697,825,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"22","paragraphPids":[2]},"html":"<h3>B. illustrate the high status of blacksmiths in that period</h3>\n<blockquote><p>说明那个时期铁匠的崇高地位</p>\n</blockquote>\n<p>把B接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来说明那个时期铁匠的崇高地位。</p>\n<p>B说铁匠地位高，回第3段看skilled blacksmith’s labour的重点。</p>\n<blockquote><p>value the skilled blacksmith’s labour in a nail even more than the raw material.</p>\n</blockquote>\n<blockquote><p>underlines how scarce, costly and valuable the <strong>[xxx]</strong> technology was.</p>\n</blockquote>\n<p>被重视的是铁匠凝结在一枚钉子里的熟练劳动，甚至比铁原料更值钱。随后烧房取钉，是为把这份已经做成的价值拿回来。</p>\n<p>劳动成果昂贵，不等于铁匠在社会等级中地位高；作者没有介绍铁匠得到何种身份或待遇。</p>\n<p><strong>珍惜铁匠做成的钉子，就直接证明铁匠社会地位崇高吗？</strong></p>\n<p>不能。B把劳动及产品的价值换成了人的社会地位。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"22题","raw":"### C. contrast the attitudes of different civilisations towards nails\n\n> 对比不同文明对钉子的态度\n\n把C接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来对比不同文明对钉子的态度。\n\nC说比较不同文明态度，把第2段的铁与第3段的熟练劳动相连。\n\n> they didn’t want the local Caledonians getting their hands on 10 tons of **[xxx]** iron.\n\n> Later civilisations would value the skilled blacksmith’s labour in a nail even more than the raw material.\n\n> underlines how scarce, costly and valuable the **[xxx]** technology was.\n\n罗马人不想把铁留给当地人，后来文明更看重钉子里的铁匠劳动。Later civilisations和even more确实使我们看见重视内容的变化。\n\n不过烧房子的故事后面又直接总结技术稀缺、昂贵、珍贵。两种文明之间有比较，是否就是这个具体例子的主要用途，还需要看后文怎样继续。\n\n**从罗马人转到弗吉尼亚人，能否先看出不同着眼点的对比？**\n\n能。C先留下，但还要与D比较：作者强调的是态度差异，还是旧时制钉技术的价值。\n\n**第一轮判断：C保留。**","articleRects":[[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37],[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38]],"questionRects":[[280,760,907,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"22","paragraphPids":[1,2]},"html":"<h3>C. contrast the attitudes of different civilisations towards nails</h3>\n<blockquote><p>对比不同文明对钉子的态度</p>\n</blockquote>\n<p>把C接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来对比不同文明对钉子的态度。</p>\n<p>C说比较不同文明态度，把第2段的铁与第3段的熟练劳动相连。</p>\n<blockquote><p>they didn’t want the local Caledonians getting their hands on 10 tons of <strong>[xxx]</strong> iron.</p>\n</blockquote>\n<blockquote><p>Later civilisations would value the skilled blacksmith’s labour in a nail even more than the raw material.</p>\n</blockquote>\n<blockquote><p>underlines how scarce, costly and valuable the <strong>[xxx]</strong> technology was.</p>\n</blockquote>\n<p>罗马人不想把铁留给当地人，后来文明更看重钉子里的铁匠劳动。Later civilisations和even more确实使我们看见重视内容的变化。</p>\n<p>不过烧房子的故事后面又直接总结技术稀缺、昂贵、珍贵。两种文明之间有比较，是否就是这个具体例子的主要用途，还需要看后文怎样继续。</p>\n<p><strong>从罗马人转到弗吉尼亚人，能否先看出不同着眼点的对比？</strong></p>\n<p>能。C先留下，但还要与D比较：作者强调的是态度差异，还是旧时制钉技术的价值。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"22题","raw":"### D. show the preciousness of nail-making technology at that time\n\n> 表明当时制钉技术的珍贵\n\n把D接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来表明当时制钉技术的珍贵。\n\nD说制钉技术珍贵，回第3段看例子后的underlines。\n\n> the skilled blacksmith’s labour in a nail even more than the raw material.\n\n> This was an attempt to recover the valuable nails\n\n> underlines how scarce, costly and valuable the **[xxx]** technology was.\n\n房子烧掉之后，钉子能被回收再用。人们愿意付出烧房子的代价来取钉子，说明钉子当时十分值钱。\n\n作者先解释价值中包含熟练铁匠的劳动，最后又明确说这个故事凸显技术稀缺、昂贵而珍贵，正好把例子收回制钉技术。\n\n**故事后的scarce、costly、valuable是否直接支持技术珍贵？**\n\n支持。D有段末明确总结作为依据，先保留。\n\n**第一轮判断：D保留。**","articleRects":[[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38]],"questionRects":[[280,824,944,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"22","paragraphPids":[2]},"html":"<h3>D. show the preciousness of nail-making technology at that time</h3>\n<blockquote><p>表明当时制钉技术的珍贵</p>\n</blockquote>\n<p>把D接回题干，它说的是：十七世纪初弗吉尼亚人的例子用来表明当时制钉技术的珍贵。</p>\n<p>D说制钉技术珍贵，回第3段看例子后的underlines。</p>\n<blockquote><p>the skilled blacksmith’s labour in a nail even more than the raw material.</p>\n</blockquote>\n<blockquote><p>This was an attempt to recover the valuable nails</p>\n</blockquote>\n<blockquote><p>underlines how scarce, costly and valuable the <strong>[xxx]</strong> technology was.</p>\n</blockquote>\n<p>房子烧掉之后，钉子能被回收再用。人们愿意付出烧房子的代价来取钉子，说明钉子当时十分值钱。</p>\n<p>作者先解释价值中包含熟练铁匠的劳动，最后又明确说这个故事凸显技术稀缺、昂贵而珍贵，正好把例子收回制钉技术。</p>\n<p><strong>故事后的scarce、costly、valuable是否直接支持技术珍贵？</strong></p>\n<p>支持。D有段末明确总结作为依据，先保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"22题","raw":"### 22题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一遍留下C、D。C可以宽泛概括罗马人与后来的文明在钉子问题上的不同着眼点；D对应烧房取钉后明确写出的技术稀缺、昂贵和价值。","articleRects":[],"questionRects":[[226,570,998,38],[280,634,798,37],[280,697,825,38],[280,760,907,31],[280,824,944,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"22"},"html":"<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一遍留下C、D。C可以宽泛概括罗马人与后来的文明在钉子问题上的不同着眼点；D对应烧房取钉后明确写出的技术稀缺、昂贵和价值。</p>\n"},{"section":"23题","raw":"## 23题\n\n> What played the major role in lowering the price of nails after the late 1700s?  \n> 1700年代后期以后，什么在降低钉子价格方面发挥了主要作用？\n\n题干的lowering the price of nails和after the late 1700s直接对应第4段开头的The price of nails fell by 90%及时间范围。完整精读第4段，尤其注意各项因素在降价中承担多大作用。\n\n> 原文参考：\n> \n> The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n> \n> 开始精读：\n> \n> The price of nails fell by 90% / between the late 1700s and mid-1900s, / as economist Daniel Sichel points out in a research paper. / According to Sichel, / although the falling price of nails was driven partly / by cheaper iron and cheaper energy, / most of the credit goes to nail manufacturers / who simply found more efficient ways / to turn steel into nails.\n> \n> 钉子的价格下降了90%， / 时间在1700年代后期到1900年代中期之间， / 正如经济学家丹尼尔·西歇尔在一篇研究论文中指出的。 / 据西歇尔所说， / 尽管钉子价格的下降有一部分是由以下因素推动的： / 更便宜的铁和更便宜的能源， / 但大部分功劳应归于钉子制造商， / 他们只是找到了更高效的方法， / 把钢变成钉子。\n\n题干问major role，要找推动钉子降价的主要因素。第4段既提到部分原因，也说明大部分功劳归给谁，选项需要回答这层主次关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38]],"questionRects":[[226,951,1194,37],[281,1014,375,38],[281,1078,444,37],[281,1141,445,37],[281,1204,497,31]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"23","initialReadingPids":[3]},"html":"<h2>23题</h2>\n<blockquote><p>What played the major role in lowering the price of nails after the late 1700s?<br />\n1700年代后期以后，什么在降低钉子价格方面发挥了主要作用？</p>\n</blockquote>\n<p>题干的lowering the price of nails和after the late 1700s直接对应第4段开头的The price of nails fell by 90%及时间范围。完整精读第4段，尤其注意各项因素在降价中承担多大作用。</p>\n<blockquote><p>原文参考：</p>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n<p>开始精读：</p>\n<p>The price of nails fell by 90% / between the late 1700s and mid-1900s, / as economist Daniel Sichel points out in a research paper. / According to Sichel, / although the falling price of nails was driven partly / by cheaper iron and cheaper energy, / most of the credit goes to nail manufacturers / who simply found more efficient ways / to turn steel into nails.</p>\n<p>钉子的价格下降了90%， / 时间在1700年代后期到1900年代中期之间， / 正如经济学家丹尼尔·西歇尔在一篇研究论文中指出的。 / 据西歇尔所说， / 尽管钉子价格的下降有一部分是由以下因素推动的： / 更便宜的铁和更便宜的能源， / 但大部分功劳应归于钉子制造商， / 他们只是找到了更高效的方法， / 把钢变成钉子。</p>\n</blockquote>\n<p>题干问major role，要找推动钉子降价的主要因素。第4段既提到部分原因，也说明大部分功劳归给谁，选项需要回答这层主次关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"23题","raw":"### A. Increased productivity.\n\n> 生产率提高。\n\n把A接回题干，它说的是：1700年代后期以后，生产率提高在降低钉子价格方面发挥了主要作用。\n\nA说生产率提高，回第4段看most of the credit后面的原因。\n\n> most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n\n铁和能源变便宜只贡献了一部分，主要功劳归于制造商找到更高效的方法，把钢制成钉子。\n\n同样是在制造钉子，办法更高效就能降低每枚钉子的生产耗费。A的increased productivity对应的就是这项生产效率变化。\n\n**more efficient ways to turn steel into nails能不能改写成生产率提高？**\n\n能。A还保留了most所强调的主要作用，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38]],"questionRects":[[281,1014,375,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"23","paragraphPids":[3]},"html":"<h3>A. Increased productivity.</h3>\n<blockquote><p>生产率提高。</p>\n</blockquote>\n<p>把A接回题干，它说的是：1700年代后期以后，生产率提高在降低钉子价格方面发挥了主要作用。</p>\n<p>A说生产率提高，回第4段看most of the credit后面的原因。</p>\n<blockquote><p>most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n<p>铁和能源变便宜只贡献了一部分，主要功劳归于制造商找到更高效的方法，把钢制成钉子。</p>\n<p>同样是在制造钉子，办法更高效就能降低每枚钉子的生产耗费。A的increased productivity对应的就是这项生产效率变化。</p>\n<p><strong>more efficient ways to turn steel into nails能不能改写成生产率提高？</strong></p>\n<p>能。A还保留了most所强调的主要作用，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"23题","raw":"### B. Wider use of new energies.\n\n> 新能源的更广泛使用。\n\n把B接回题干，它说的是：1700年代后期以后，新能源的更广泛使用在降低钉子价格方面发挥了主要作用。\n\nB说新能源用得更广，回第4段看energy前面写的是什么。\n\n> although the falling price of nails was driven partly by cheaper iron and cheaper energy\n\n> most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n\n原文是cheaper energy，能源价格更便宜，并没有说能源种类更新，也没有比较新能源使用比例。\n\n而且能源价格只是partly的一部分原因，后面most把主要功劳给了制造方法。B既改了能源变化的内容，也没有满足题干的主要作用。\n\n**更便宜的能源，就等于新能源更广泛使用并起主要作用吗？**\n\n不是。B的两层意思都没有对应原文。\n\n**第一轮判断：B排除。**","articleRects":[[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38]],"questionRects":[[281,1078,444,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>B. Wider use of new energies.</h3>\n<blockquote><p>新能源的更广泛使用。</p>\n</blockquote>\n<p>把B接回题干，它说的是：1700年代后期以后，新能源的更广泛使用在降低钉子价格方面发挥了主要作用。</p>\n<p>B说新能源用得更广，回第4段看energy前面写的是什么。</p>\n<blockquote><p>although the falling price of nails was driven partly by cheaper iron and cheaper energy</p>\n</blockquote>\n<blockquote><p>most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n<p>原文是cheaper energy，能源价格更便宜，并没有说能源种类更新，也没有比较新能源使用比例。</p>\n<p>而且能源价格只是partly的一部分原因，后面most把主要功劳给了制造方法。B既改了能源变化的内容，也没有满足题干的主要作用。</p>\n<p><strong>更便宜的能源，就等于新能源更广泛使用并起主要作用吗？</strong></p>\n<p>不是。B的两层意思都没有对应原文。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"23题","raw":"### C. Fiercer market competition.\n\n> 更激烈的市场竞争。\n\n把C接回题干，它说的是：1700年代后期以后，更激烈的市场竞争在降低钉子价格方面发挥了主要作用。\n\nC说市场竞争更激烈，回第4段看制造商被表扬的是哪一种行动。\n\n> most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n\n制造商找到更有效率的制钉办法，这能解释成本下降。原文没有介绍厂商数量、争夺顾客或价格战。\n\n现实中竞争可能促使改进，但作者没有给出这条前因，不能把我们猜想的推动因素换成文中明确的主要原因。\n\n**文章把降价的主要功劳给了竞争，还是给了制钉效率？**\n\n给了制钉效率。C加进了未交代的市场竞争。\n\n**第一轮判断：C排除。**","articleRects":[[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38]],"questionRects":[[281,1141,445,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>C. Fiercer market competition.</h3>\n<blockquote><p>更激烈的市场竞争。</p>\n</blockquote>\n<p>把C接回题干，它说的是：1700年代后期以后，更激烈的市场竞争在降低钉子价格方面发挥了主要作用。</p>\n<p>C说市场竞争更激烈，回第4段看制造商被表扬的是哪一种行动。</p>\n<blockquote><p>most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n<p>制造商找到更有效率的制钉办法，这能解释成本下降。原文没有介绍厂商数量、争夺顾客或价格战。</p>\n<p>现实中竞争可能促使改进，但作者没有给出这条前因，不能把我们猜想的推动因素换成文中明确的主要原因。</p>\n<p><strong>文章把降价的主要功劳给了竞争，还是给了制钉效率？</strong></p>\n<p>给了制钉效率。C加进了未交代的市场竞争。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"23题","raw":"### D. Reduced cost of raw materials.\n\n> 原材料成本降低。\n\n把D接回题干，它说的是：1700年代后期以后，原材料成本降低在降低钉子价格方面发挥了主要作用。\n\nD说原材料成本降低，回第4段看cheaper iron前后的限定。\n\n> although the falling price of nails was driven partly by cheaper iron and cheaper energy\n\n> most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n\n便宜的铁确实在原文中，作者也承认它推动了价格下降。但这部分被放在although和partly后面。\n\n随后说most of the credit归于更高效的制造方式。题干问major role，不能把已承认的次要部分直接当主要部分。\n\n**原材料便宜参与了降价，就能成为文中说的主要原因吗？**\n\n不能。D有事实出处，却不符合主要作用这个限定。\n\n**第一轮判断：D排除。**","articleRects":[[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38]],"questionRects":[[281,1204,497,31]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>D. Reduced cost of raw materials.</h3>\n<blockquote><p>原材料成本降低。</p>\n</blockquote>\n<p>把D接回题干，它说的是：1700年代后期以后，原材料成本降低在降低钉子价格方面发挥了主要作用。</p>\n<p>D说原材料成本降低，回第4段看cheaper iron前后的限定。</p>\n<blockquote><p>although the falling price of nails was driven partly by cheaper iron and cheaper energy</p>\n</blockquote>\n<blockquote><p>most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n<p>便宜的铁确实在原文中，作者也承认它推动了价格下降。但这部分被放在although和partly后面。</p>\n<p>随后说most of the credit归于更高效的制造方式。题干问major role，不能把已承认的次要部分直接当主要部分。</p>\n<p><strong>原材料便宜参与了降价，就能成为文中说的主要原因吗？</strong></p>\n<p>不能。D有事实出处，却不符合主要作用这个限定。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"23题","raw":"### 23题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。原文把大部分降价功劳归于制造商找到更高效的制钉方法，原材料和能源变便宜只是部分原因。","articleRects":[],"questionRects":[[226,951,1194,37],[281,1014,375,38],[281,1078,444,37],[281,1141,445,37],[281,1204,497,31]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"23"},"html":"<h3>23题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。原文把大部分降价功劳归于制造商找到更高效的制钉方法，原材料和能源变便宜只是部分原因。</p>\n"},{"section":"24题","raw":"## 24题\n\n> It can be learned from Paragraph 5 that nails ______.  \n> 从第5段可以得知，钉子具有怎样的特点？\n\n题干直接指定Paragraph 5，完整精读第5段，注意作者用罗马时代的物品与现代物品比较，是怎样解释研究钉子的原因。\n\n> 原文参考：\n> \n> Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much. Roman lamps and Roman **[xxx]** are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.\n> \n> 开始精读：\n> \n> Nails themselves have changed over the years, / but Sichel studied them / because they haven’t changed much. / Roman lamps and Roman **[xxx]** / are very different from LED strips and sports cars, / but Roman nails are still clearly nails. / It would be absurd / to try to track the changing price of sports cars since 1695, / but to ask the same question of nails / makes perfect sense.\n> \n> 这些年来，钉子本身发生了变化， / 但西歇尔研究它们， / 是因为它们变化不大。 / 罗马时代的灯具和罗马时代的**[xxx]**， / 与发光二极管灯带和跑车很不相同， / 但罗马时代的钉子显然仍是钉子。 / 这会很荒唐： / 试图追踪自1695年以来跑车的价格变化， / 但对钉子提出同样的问题， / 就完全说得通。\n\n空格要补第5段能够推出的钉子特点。原文把钉子这些年的变化程度与追踪价格的问题连起来，选项要与这条联系相符。\n\n接下来按A—D逐项看。","articleRects":[[274,1275,1122,37],[202,1324,1194,38],[202,1373,1184,38],[202,1423,1194,38],[1324,1444,12,15],[202,1472,794,38]],"questionRects":[[226,1331,835,38],[280,1395,782,37],[280,1458,824,37],[280,1521,702,38],[280,1585,773,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"24","initialReadingPids":[4]},"html":"<h2>24题</h2>\n<blockquote><p>It can be learned from Paragraph 5 that nails ______.<br />\n从第5段可以得知，钉子具有怎样的特点？</p>\n</blockquote>\n<p>题干直接指定Paragraph 5，完整精读第5段，注意作者用罗马时代的物品与现代物品比较，是怎样解释研究钉子的原因。</p>\n<blockquote><p>原文参考：</p>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much. Roman lamps and Roman <strong>[xxx]</strong> are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n<p>开始精读：</p>\n<p>Nails themselves have changed over the years, / but Sichel studied them / because they haven’t changed much. / Roman lamps and Roman <strong>[xxx]</strong> / are very different from LED strips and sports cars, / but Roman nails are still clearly nails. / It would be absurd / to try to track the changing price of sports cars since 1695, / but to ask the same question of nails / makes perfect sense.</p>\n<p>这些年来，钉子本身发生了变化， / 但西歇尔研究它们， / 是因为它们变化不大。 / 罗马时代的灯具和罗马时代的<strong>[xxx]</strong>， / 与发光二极管灯带和跑车很不相同， / 但罗马时代的钉子显然仍是钉子。 / 这会很荒唐： / 试图追踪自1695年以来跑车的价格变化， / 但对钉子提出同样的问题， / 就完全说得通。</p>\n</blockquote>\n<p>空格要补第5段能够推出的钉子特点。原文把钉子这些年的变化程度与追踪价格的问题连起来，选项要与这条联系相符。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"24题","raw":"### A. have undergone many technological improvements\n\n> 经历了许多技术改进\n\n把A接回题干，它说的是：从第5段可以得知，钉子经历了许多技术改进。\n\nA说经历许多技术改进，回第5段看changed后面的but。\n\n> Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much.\n\n> but Roman nails are still clearly nails.\n\n作者先承认钉子这些年有变化，但立刻说研究它们是因为haven’t changed much。罗马钉子至今仍明显是钉子。\n\n前段制造方法更高效，并不等于这一段认定钉子本身发生了很多技术改变。A把承认的有限变化放大了。\n\n**这一段强调钉子改变很多，还是强调变化不大？**\n\n强调变化不大。A没有接住but后面的说明。\n\n**第一轮判断：A排除。**","articleRects":[[274,1275,1122,37],[202,1324,1194,38],[202,1373,1184,38],[202,1423,1194,38],[1324,1444,12,15],[202,1472,794,38]],"questionRects":[[280,1395,782,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"24","paragraphPids":[4]},"html":"<h3>A. have undergone many technological improvements</h3>\n<blockquote><p>经历了许多技术改进</p>\n</blockquote>\n<p>把A接回题干，它说的是：从第5段可以得知，钉子经历了许多技术改进。</p>\n<p>A说经历许多技术改进，回第5段看changed后面的but。</p>\n<blockquote><p>Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much.</p>\n</blockquote>\n<blockquote><p>but Roman nails are still clearly nails.</p>\n</blockquote>\n<p>作者先承认钉子这些年有变化，但立刻说研究它们是因为haven’t changed much。罗马钉子至今仍明显是钉子。</p>\n<p>前段制造方法更高效，并不等于这一段认定钉子本身发生了很多技术改变。A把承认的有限变化放大了。</p>\n<p><strong>这一段强调钉子改变很多，还是强调变化不大？</strong></p>\n<p>强调变化不大。A没有接住but后面的说明。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"24题","raw":"### B. have remained basically the same since Roman times\n\n> 自罗马时代以来基本保持原样\n\n把B接回题干，它说的是：从第5段可以得知，钉子自罗马时代以来基本保持原样。\n\nB说基本保持原样，回第5段看Roman nails are still clearly nails。\n\n> Sichel studied them because they haven’t changed much.\n\n> but Roman nails are still clearly nails.\n\n罗马的灯与今天的灯、当年的交通工具与跑车差别很大，钉子却仍能直接被认作钉子。作者因此认为跨时期比较钉价有意义。\n\nB有basically，并不是说完全一丝未变，能够容纳开头承认的少量变化。\n\n**基本不变，是否能同时接上“有过变化”和“变化不大”？**\n\n能。B的程度与原文一致，可以保留。\n\n**第一轮判断：B保留。**","articleRects":[[274,1275,1122,37],[202,1324,1194,38],[202,1373,1184,38],[202,1423,1194,38],[1324,1444,12,15],[202,1472,794,38]],"questionRects":[[280,1458,824,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"24","paragraphPids":[4]},"html":"<h3>B. have remained basically the same since Roman times</h3>\n<blockquote><p>自罗马时代以来基本保持原样</p>\n</blockquote>\n<p>把B接回题干，它说的是：从第5段可以得知，钉子自罗马时代以来基本保持原样。</p>\n<p>B说基本保持原样，回第5段看Roman nails are still clearly nails。</p>\n<blockquote><p>Sichel studied them because they haven’t changed much.</p>\n</blockquote>\n<blockquote><p>but Roman nails are still clearly nails.</p>\n</blockquote>\n<p>罗马的灯与今天的灯、当年的交通工具与跑车差别很大，钉子却仍能直接被认作钉子。作者因此认为跨时期比较钉价有意义。</p>\n<p>B有basically，并不是说完全一丝未变，能够容纳开头承认的少量变化。</p>\n<p><strong>基本不变，是否能同时接上“有过变化”和“变化不大”？</strong></p>\n<p>能。B的程度与原文一致，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"24题","raw":"### C. are less studied than other everyday products\n\n> 受到的研究比其他日常产品少\n\n把C接回题干，它说的是：从第5段可以得知，钉子受到的研究比其他日常产品少。\n\nC说研究比其他物品少，回第5段看灯和车用来比什么。\n\n> Sichel studied them because they haven’t changed much.\n\n> It would be absurd to try to track the changing price of sports cars since 1695\n\n> but to ask the same question of nails makes perfect sense.\n\n灯和车被拿来比较的是古今形态变化，随后说明为什么不能像钉子那样追溯同一种产品的价格。\n\n这里只交代Sichel选择钉子的理由，没有统计研究钉子的人或论文有多少，更没有与其他日用品的研究数量相比。\n\n**钉子与灯、车的比较，是在比较研究多少吗？**\n\n不是。C把物品变化程度换成了研究数量。\n\n**第一轮判断：C排除。**","articleRects":[[274,1275,1122,37],[202,1324,1194,38],[202,1373,1184,38],[202,1423,1194,38],[1324,1444,12,15],[202,1472,794,38]],"questionRects":[[280,1521,702,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"24","paragraphPids":[4]},"html":"<h3>C. are less studied than other everyday products</h3>\n<blockquote><p>受到的研究比其他日常产品少</p>\n</blockquote>\n<p>把C接回题干，它说的是：从第5段可以得知，钉子受到的研究比其他日常产品少。</p>\n<p>C说研究比其他物品少，回第5段看灯和车用来比什么。</p>\n<blockquote><p>Sichel studied them because they haven’t changed much.</p>\n</blockquote>\n<blockquote><p>It would be absurd to try to track the changing price of sports cars since 1695</p>\n</blockquote>\n<blockquote><p>but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n<p>灯和车被拿来比较的是古今形态变化，随后说明为什么不能像钉子那样追溯同一种产品的价格。</p>\n<p>这里只交代Sichel选择钉子的理由，没有统计研究钉子的人或论文有多少，更没有与其他日用品的研究数量相比。</p>\n<p><strong>钉子与灯、车的比较，是在比较研究多少吗？</strong></p>\n<p>不是。C把物品变化程度换成了研究数量。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"24题","raw":"### D. are one of the world’s most significant inventions\n\n> 是世界上最重要的发明之一\n\n把D接回题干，它说的是：从第5段可以得知，钉子是世界上最重要的发明之一。\n\nD说最重要的发明之一，回第5段看选择研究钉子的理由。\n\n> Sichel studied them because they haven’t changed much.\n\n> but to ask the same question of nails makes perfect sense.\n\n理由是钉子变化不大，古今价格能作相对合理的对照。作者没有给发明排重要性，也没有说钉子比哪些发明更关键。\n\n适合研究价格是一项特点，不能直接把它换成世界最重要发明的地位。\n\n**被选作长期价格研究对象，就说明它属于最重要的发明吗？**\n\n不能这样推出。D超出了本段给出的理由。\n\n**第一轮判断：D排除。**","articleRects":[[274,1275,1122,37],[202,1324,1194,38],[202,1373,1184,38],[202,1423,1194,38],[1324,1444,12,15],[202,1472,794,38]],"questionRects":[[280,1585,773,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"24","paragraphPids":[4]},"html":"<h3>D. are one of the world’s most significant inventions</h3>\n<blockquote><p>是世界上最重要的发明之一</p>\n</blockquote>\n<p>把D接回题干，它说的是：从第5段可以得知，钉子是世界上最重要的发明之一。</p>\n<p>D说最重要的发明之一，回第5段看选择研究钉子的理由。</p>\n<blockquote><p>Sichel studied them because they haven’t changed much.</p>\n</blockquote>\n<blockquote><p>but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n<p>理由是钉子变化不大，古今价格能作相对合理的对照。作者没有给发明排重要性，也没有说钉子比哪些发明更关键。</p>\n<p>适合研究价格是一项特点，不能直接把它换成世界最重要发明的地位。</p>\n<p><strong>被选作长期价格研究对象，就说明它属于最重要的发明吗？</strong></p>\n<p>不能这样推出。D超出了本段给出的理由。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"24题","raw":"### 24题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一遍留下B。第5段明确说钉子变化不大，并以罗马时代的钉子仍明显是钉子说明基本延续。","articleRects": eved little / without a **[xxx]** collapse in the price of surfaces to write on, / thanks to an often-overlooked technology called paper. / Solar panels had a few **[xxx]** uses / until they became cheap; / now they are transforming the global energy system.\n> \n> 古腾堡印刷机改变了文明， / 不是通过改变书写的性质， / 而是通过改变书写的成本——而它本来不会取得多大成就， / 如果没有可供书写的表面材料价格出现**[xxx]**暴跌， / 这要归功于一种常被忽视的、名叫纸的技术。 / 太阳能板原先有少数**[xxx]**用途， / 直到它们变得便宜； / 如今它们正在改变全球能源系统。\n\nbest summarises要求用一句话概括两段共同说明的内容。需要把第6段对技术与价格的判断，和第7段价格变化怎样连到文明、能源系统的变化接起来。\n\n接下来按A—D逐项看。","articleRects":[[274,1522,1121,37],[202,1571,1194,38],[202,1620,1194,38],[203,1670,1193,37],[202,1719,262,37],[273,1768,1123,38],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1194,38],[202,1965,1004,38]],"questionRects":[[226,1712,1013,37],[280,1775,828,37],[280,1838,883,38],[280,1902,871,37],[280,1965,889,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5,6],"qid":"25","initialReadingPids":[5,6]},"html":"<h2>25题</h2>\n<blockquote><p>Which of the following best summarises the last two paragraphs?<br />\n下面哪一项最能概括最后两段？</p>\n</blockquote>\n<p>题干限定the last two paragraphs，即第6、7段。先把两段都完整精读：第6段从日常物品的价格引出判断，第7段用印刷、纸和太阳能板展开说明。</p>\n<blockquote><p>原文参考：</p>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I’ve learnt is that while it is the <strong>[xxx]</strong> sophisticated technologies that get all the <strong>[xxx]</strong>, it’s the cheap technologies that change the world.</p>\n<p>开始精读：</p>\n<p>I make no apology / for being obsessed by a particular feature of everyday objects: / their price. / I am an economist, after all. / After writing two books about the history of inventions, / one thing I’ve learnt is that / while it is the <strong>[xxx]</strong> sophisticated technologies / that get all the <strong>[xxx]</strong>, / it’s the cheap technologies that change the world.</p>\n<p>我并不感到抱歉， / 对于自己痴迷于日常物品的一个特定特征： / 它们的价格。 / 毕竟，我是一名经济学家。 / 在写了两本关于发明史的书之后， / 我学到的一件事是， / 虽然是那些<strong>[xxx]</strong>复杂技术， / 得到了所有的<strong>[xxx]</strong>， / 但改变世界的是廉价技术。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost—and it would have achieved little without a <strong>[xxx]</strong> collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few <strong>[xxx]</strong> uses until they became cheap; now they are transforming the global energy system.</p>\n<p>开始精读：</p>\n<p>The Gutenberg printing press transformed civilisation / not by changing the nature of writing / but by changing its cost—and it would have achieved little / without a <strong>[xxx]</strong> collapse in the price of surfaces to write on, / thanks to an often-overlooked technology called paper. / Solar panels had a few <strong>[xxx]</strong> uses / until they became cheap; / now they are transforming the global energy system.</p>\n<p>古腾堡印刷机改变了文明， / 不是通过改变书写的性质， / 而是通过改变书写的成本——而它本来不会取得多大成就， / 如果没有可供书写的表面材料价格出现<strong>[xxx]</strong>暴跌， / 这要归功于一种常被忽视的、名叫纸的技术。 / 太阳能板原先有少数<strong>[xxx]</strong>用途， / 直到它们变得便宜； / 如今它们正在改变全球能源系统。</p>\n</blockquote>\n<p>best summarises要求用一句话概括两段共同说明的内容。需要把第6段对技术与价格的判断，和第7段价格变化怎样连到文明、能源系统的变化接起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"25题","raw":"### A. Cheap technologies bring about revolutionary change.\n\n> 廉价技术带来革命性的变化。\n\n把A接回题干，它说的是：最后两段最适合概括为廉价技术带来革命性的变化。\n\nA说廉价技术带来大变化，先看第6段的cheap technologies，再看两个例子何时改变世界。\n\n> it’s the cheap technologies that change the world.\n\n> The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost\n\n> until they became cheap; now they are transforming the global energy system.\n\n第6段直接说便宜的技术改变世界。接着印刷机通过降低书写成本改变文明，还需要便宜的纸；太阳能板也在变便宜之后开始改变全球能源系统。\n\n两个例子都不是只强调技术新，而是把价格降低与广泛作用接起来。\n\n**最后两段反复出现的共同条件，是不是技术变得便宜？**\n\n是。A同时概括观点和印刷、太阳能的例子，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1522,1121,37],[202,1571,1194,38],[202,1620,1194,38],[203,1670,1193,37],[202,1719,262,37],[273,1768,1123,38],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1194,38],[202,1965,1004,38]],"questionRects":[[280,1775,828,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"25","paragraphPids":[5,6]},"html":"<h3>A. Cheap technologies bring about revolutionary change.</h3>\n<blockquote><p>廉价技术带来革命性的变化。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最后两段最适合概括为廉价技术带来革命性的变化。</p>\n<p>A说廉价技术带来大变化，先看第6段的cheap technologies，再看两个例子何时改变世界。</p>\n<blockquote><p>it’s the cheap technologies that change the world.</p>\n</blockquote>\n<blockquote><p>The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost</p>\n</blockquote>\n<blockquote><p>until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<p>第6段直接说便宜的技术改变世界。接着印刷机通过降低书写成本改变文明，还需要便宜的纸；太阳能板也在变便宜之后开始改变全球能源系统。</p>\n<p>两个例子都不是只强调技术新，而是把价格降低与广泛作用接起来。</p>\n<p><strong>最后两段反复出现的共同条件，是不是技术变得便宜？</strong></p>\n<p>是。A同时概括观点和印刷、太阳能的例子，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"25题","raw":"### B. Technological innovation is integral to economic success.\n\n> 技术创新是经济成功不可或缺的一部分。\n\n把B接回题干，它说的是：最后两段最适合概括为技术创新是经济成功不可或缺的一部分。\n\nB说创新不可缺于经济成功，回最后两段看作者始终盯着哪个特点。\n\n> it’s the cheap technologies that change the world.\n\n> not by changing the nature of writing but by changing its cost\n\n> now they are transforming the global energy system.\n\n作者承认自己特别关注日常物品的price，随后例子也反复落在cost和cheap。具体改变包括文明传播与能源系统，并不只是经济成功。\n\nB把创新的重要性说出来了，却没有说技术为什么在这里能产生广泛影响，关键的价格降低被漏掉了。\n\n**只说技术创新重要，能否概括作者反复说明的降价作用？**\n\n不能完整概括。B换成了较泛的创新与经济关系。\n\n**第一轮判断：B排除。**","articleRects":[[274,1522,1121,37],[202,1571,1194,38],[202,1620,1194,38],[203,1670,1193,37],[202,1719,262,37],[273,1768,1123,38],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1194,38],[202,1965,1004,38]] the cheap technologies that change the world.</p>\n</blockquote>\n<blockquote><p>The Gutenberg printing press transformed civilisation</p>\n</blockquote>\n<blockquote><p>now they are transforming the global energy system.</p>\n</blockquote>\n<p>印刷机改变书写成本并推动文明，太阳能板改变能源系统。文章写的是使用成本降低之后的实际作用。</p>\n<p>这些改变可能影响人们想法，但作者没有把两个例子都收束到人们如何理解世界。C把可见的成本和应用换成了认识。</p>\n<p><strong>两例明确共同说明的是理解方式，还是便宜之后产生的大范围改变？</strong></p>\n<p>是后者。C没有接住反复出现的价格条件。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"25题","raw":"### D. Sophisticated technologies develop from small inventions.\n\n> 复杂技术由小发明发展而来。\n\n把D接回题干，它说的是：最后两段最适合概括为复杂技术由小发明发展而来。\n\nD说复杂技术由小发明发展，回最后两段看sophisticated与cheap是什么关系。\n\n> while it is the **[xxx]** sophisticated technologies that get all the **[xxx]**, it’s the cheap technologies that change the world.\n\n> it would have achieved little without a **[xxx]** collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper.\n\n第6段把受关注的复杂技术与真正改变世界的廉价技术对照，后面解释便宜的纸帮助印刷机发挥作用、太阳能板降价后扩大作用。\n\n纸与印刷机配合，并不意味着印刷机由纸演化出来；太阳能板的例子也没讲从小发明变复杂的过程。\n\n**这里是在追溯技术由小变复杂，还是在比较技术价格改变后的作用？**\n\n是在说明后者。D把价格与作用的联系换成了技术演化关系。\n\n**第一轮判断：D排除。**","articleRects":[[274,1522,1121,37],[202,1571,1194,38],[202,1620,1194,38],[203,1670,1193,37],[202,1719,262,37],[273,1768,1123,38],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1194,38],[202,1965,1004,38]],"questionRects":[[280,1965,889,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"25","paragraphPids":[5,6]},"html":"<h3>D. Sophisticated technologies develop from small inventions.</h3>\n<blockquote><p>复杂技术由小发明发展而来。</p>\n</blockquote>\n<p>把D接回题干，它说的是：最后两段最适合概括为复杂技术由小发明发展而来。</p>\n<p>D说复杂技术由小发明发展，回最后两段看sophisticated与cheap是什么关系。</p>\n<blockquote><p>while it is the <strong>[xxx]</strong> sophisticated technologies that get all the <strong>[xxx]</strong>, it’s the cheap technologies that change the world.</p>\n</blockquote>\n<blockquote><p>it would have achieved little without a <strong>[xxx]</strong> collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper.</p>\n</blockquote>\n<p>第6段把受关注的复杂技术与真正改变世界的廉价技术对照，后面解释便宜的纸帮助印刷机发挥作用、太阳能板降价后扩大作用。</p>\n<p>纸与印刷机配合，并不意味着印刷机由纸演化出来；太阳能板的例子也没讲从小发明变复杂的过程。</p>\n<p><strong>这里是在追溯技术由小变复杂，还是在比较技术价格改变后的作用？</strong></p>\n<p>是在说明后者。D把价格与作用的联系换成了技术演化关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"25题","raw":"### 25题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。第6段明确说廉价技术改变世界，第7段把成本下降与文明、全球能源系统的变化连在一起。","articleRects":[],"questionRects":[[226,1712,1013,37],[280,1775,828,37],[280,1838,883,38],[280,1902,871,37],[280,1965,889,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"25"},"html":"<h3>25题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。第6段明确说廉价技术改变世界，第7段把成本下降与文明、全球能源系统的变化连在一起。</p>\n"},{"section":"进阶方法","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things. The nail **[xxx]** was discovered in 1960 in a four-metre-deep pit covered by two metres of **[xxx]**.\n> \n> 开始精读：\n> \n> Nearly 2,000 years ago, / as the Romans began to pull out of Scotland, / they left behind a curious treasure: / 10 tons of nails, / nearly a million of the things. / The nail **[xxx]** was discovered in 1960 / in a four-metre-deep pit / covered by two metres of **[xxx]**.\n> \n> 将近2,000年前， / 当罗马人开始撤出苏格兰时， / 他们留下了一笔奇特的宝藏： / 10吨钉子， / 数量将近一百万枚。 / 这些钉子的**[xxx]**于1960年被发现， / 位于一个四米深的坑中， / 上面覆盖着两米厚的**[xxx]**。","articleRects":[[273,288,1123,38],[202,337,1184,38],[202,387,1194,38],[202,436,249,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[1],"role":"whole_text_precision","paragraphPids":[0]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things. The nail <strong>[xxx]</strong> was discovered in 1960 in a four-metre-deep pit covered by two metres of <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>Nearly 2,000 years ago, / as the Romans began to pull out of Scotland, / they left behind a curious treasure: / 10 tons of nails, / nearly a million of the things. / The nail <strong>[xxx]</strong> was discovered in 1960 / in a four-metre-deep pit / covered by two metres of <strong>[xxx]</strong>.</p>\n<p>将近2,000年前， / 当罗马人开始撤出苏格兰时， / 他们留下了一笔奇特的宝藏： / 10吨钉子， / 数量将近一百万枚。 / 这些钉子的<strong>[xxx]</strong>于1960年被发现， / 位于一个四米深的坑中， / 上面覆盖着两米厚的<strong>[xxx]</strong>。</p>\n</blockquote>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | a curious treasure；10 tons of nails | 以“a curious treasure”和“10 tons of nails”开篇：罗马人撤离时留下大量钉子，后来在深坑中被发现。这个看似普通却被当作宝藏的物品，引出下段为什么要埋藏的疑问。 | 用被埋藏的大量钉子引出其价值问题。 |\n| 第2段 | the withdrawal was rushed；getting their hands on | 用“the withdrawal was rushed”与“getting their hands on”解释：撤离仓促，罗马人不愿当地卡利多尼亚人拿到这批铁，所以把钉子深埋。这把首段发现的物品接到当时人们如何处理它的背景上，随后转向后来的文明如何看重钉子。 | 解释埋藏的背景，再引向后来的文明如何看待钉子。 |\n| 第3段 | the skilled blacksmith’s labour；scarce, costly and valuable | 的“the skilled blacksmith’s labour”把重视的对象推进到钉子里凝结的熟练劳动；弗吉尼亚人烧房取钉的做法，凸显“scarce, costly and valuable”所说的技术稀缺、昂贵和价值。它把前两段的古代故事延伸为钉子曾经很贵重的说明，为下一段价格大幅下降作铺垫。 | 说明钉子曾凝结稀缺劳动、价格高昂，为后面的降价形成对照。 |\n| 第4段 | fell by 90%；more efficient ways | 以“fell by 90%”呈现钉子价格的长期下降，并用“more efficient ways”解释主要功劳来自更高效的制钉方法，铁和能源变便宜只贡献了一部分。这将前文的贵重转入后来为何变便宜，开始把物品的价格与生产技术相连。 | 将贵重物品接到长期降价，说明生产效率提高的作用。 |\n| 第5段 | haven’t changed much；makes perfect sense | 的“haven’t changed much”解释为何用钉子研究价格：钉子虽有变化，古今仍基本可比；与跑车相比，对钉子追踪长期价格“makes perfect sense”。本段说明上一段价格研究为何可以成立，再引向作者对日常物品价格的普遍关注。 | 解释为何钉子适合用来追踪价格变化，为这一实例提供依据。 |\n| 第6段 | their price；the cheap technologies；change the world | 从“their price”说起，明确作者关注日常物品的价格，并提出“the cheap technologies”能够“change the world”。钉子的故事由此进入更广的判断：技术的影响要放在其价格条件下理解。 | 从钉子扩展到日常技术，明确价格与技术影响之间的关系。 |\n| 第7段 | by changing its cost；until they became cheap | 用“by changing its cost”解释印刷机怎样改变文明，再以“until they became cheap”连接太阳能板价格变低与全球能源系统的改变。纸所带来的书写材料降价也构成印刷机发挥作用的重要条件，两个例子具体展开上一段廉价技术改变世界的判断。 | 用印刷与太阳能的例子展开廉价技术能够改变世界的判断。 |\n\n全文从钉子曾被深埋、甚至值得烧房回收，写到生产效率提高使价格下降，再解释为何可以借钉子追踪价格变化。作者由此归纳：廉价技术能够改变世界，理解技术的作用不能忽略成本降低这一条件。","articleRects":[[273,288,1123,38],[202,337,1184,38],[202,387,1194,38],[202,436,249,38],[273,486,1123,37],[202,535,1194,38],[202,584,1194,38],[202,634,958,37],[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38],[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38],[274,1275,1122,37],[202,1324,1194,38],[202,1373,1184,38],[202,1423,1194,38],[1324,1444,12,15],[202,1472,794,38],[274,1522,1121,37],[202,1571,1194,38],[202,1620,1194,38],[203,1670,1193,37],[202,1719,262,37],[273,1768,1123,38],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1194,38],[202,1965,1004,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>a curious treasure；10 tons of nails</td><td>以“a curious treasure”和“10 tons of nails”开篇：罗马人撤离时留下大量钉子，后来在深坑中被发现。这个看似普通却被当作宝藏的物品，引出下段为什么要埋藏的疑问。</td><td>用被埋藏的大量钉子引出其价值问题。</td></tr><tr><td>第2段</td><td>the withdrawal was rushed；getting their hands on</td><td>用“the withdrawal was rushed”与“getting their hands on”解释：撤离仓促，罗马人不愿当地卡利多尼亚人拿到这批铁，所以把钉子深埋。这把首段发现的物品接到当时人们如何处理它的背景上，随后转向后来的文明如何看重钉子。</td><td>解释埋藏的背景，再引向后来的文明如何看待钉子。</td></tr><tr><td>第3段</td><td>the skilled blacksmith’s labour；scarce, costly and valuable</td><td>的“the skilled blacksmith’s labour”把重视的对象推进到钉子里凝结的熟练劳动；弗吉尼亚人烧房取钉的做法，凸显“scarce, costly and valuable”所说的技术稀缺、昂贵和价值。它把前两段的古代故事延伸为钉子曾经很贵重的说明，为下一段价格大幅下降作铺垫。</td><td>说明钉子曾凝结稀缺劳动、价格高昂，为后面的降价形成对照。</td></tr><tr><td>第4段</td><td>fell by 90%；more efficient ways</td><td>以“fell by 90%”呈现钉子价格的长期下降，并用“more efficient ways”解释主要功劳来自更高效的制钉方法，铁和能源变便宜只贡献了一部分。这将前文的贵重转入后来为何变便宜，开始把物品的价格与生产技术相连。</td><td>将贵重物品接到长期降价，说明生产效率提高的作用。</td></tr><tr><td>第5段</td><td>haven’t changed much；makes perfect sense</td><td>的“haven’t changed much”解释为何用钉子研究价格：钉子虽有变化，古今仍基本可比；与跑车相比，对钉子追踪长期价格“makes perfect sense”。本段说明上一段价格研究为何可以成立，再引向作者对日常物品价格的普遍关注。</td><td>解释为何钉子适合用来追踪价格变化，为这一实例提供依据。</td></tr><tr><td>第6段</td><td>their price；the cheap technologies；change the world</td><td>从“their price”说起，明确作者关注日常物品的价格，并提出“the cheap technologies”能够“change the world”。钉子的故事由此进入更广的判断：技术的影响要放在其价格条件下理解。</td><td>从钉子扩展到日常技术，明确价格与技术影响之间的关系。</td></tr><tr><td>第7段</td><td>by changing its cost；until they became cheap</td><td>用“by changing its cost”解释印刷机怎样改变文明，再以“until they became cheap”连接太阳能板价格变低与全球能源系统的改变。纸所带来的书写材料降价也构成印刷机发挥作用的重要条件，两个例子具体展开上一段廉价技术改变世界的判断。</td><td>用印刷与太阳能的例子展开廉价技术能够改变世界的判断。</td></tr></tbody></table>\n<p>全文从钉子曾被深埋、甚至值得烧房回收，写到生产效率提高使价格下降，再解释为何可以借钉子追踪价格变化。作者由此归纳：廉价技术能够改变世界，理解技术的作用不能忽略成本降低这一条件。</p>\n"},{"section":"进阶回查","raw":"## 回查22题：C还是D？\n\nThe example of early 17th-century Virginians is used to ______.\n\nC. contrast the attitudes of different civilisations towards nails\n\nD. show the preciousness of nail-making technology at that time\n\n第一轮把C留下，是因为罗马人看重铁，后来的人更看重钉子里的熟练劳动，前后确实有不同的着眼点。再看弗吉尼亚人这个故事写得最重的一笔：不是普通地把钉子收起来，而是烧掉整栋房子也要把钉子取回。\n\n> The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the [xxx] technology was.\n\n作者自己已经把这个代价很大的举动解释成技术稀缺、昂贵而珍贵。第4段接着说钉价后来下降90%，主要因为制钉效率提高。前面先让我们感到旧时钉子很贵重，后面才看得出生产效率提高、价格降低带来的变化。\n\n末两段又落到廉价技术改变世界：印刷的成本下降，太阳能板变便宜后改变能源系统。整条叙述持续追问的是技术值多少钱、降价后能做什么。\n\n**C虽然说出了前后文明的一处比较，能解释为什么偏偏要写“烧掉整栋房子”吗？**\n\nD解释得更直接。愿意付出这种代价，正因为钉子与制钉劳动在当时非常贵重。C没有说出这个故事突出的大代价，也没有接住段末的明确总结和后文的价格变化。\n\n**22题选D。**","articleRects":[[273,683,1123,30],[203,732,1191,38],[202,782,1194,37],[202,831,1194,38],[202,880,1194,38],[202,930,1189,37],[202,979,820,38],[274,1028,1122,38],[202,1078,1189,37],[203,1127,1194,38],[202,1176,1194,38],[202,1225,548,38],[274,1522,1121,37],[202,1571,1194,38],[202,1620,1194,38],[203,1670,1193,37],[202,1719,262,37],[273,1768,1123,38],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1194,38],[202,1965,1004,38]],"questionRects":[[226,570,998,38],[280,634,798,37],[280,697,825,38],[280,760,907,31],[280,824,944,37]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[4,6,7],"finalChoice":"D","qid":"22","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查22题：C还是D？</h2>\n<p>The example of early 17th-century Virginians is used to ______.</p>\n<p>C. contrast the attitudes of different civilisations towards nails</p>\n<p>D. show the preciousness of nail-making technology at that time</p>\n<p>第一轮把C留下，是因为罗马人看重铁，后来的人更看重钉子里的熟练劳动，前后确实有不同的着眼点。再看弗吉尼亚人这个故事写得最重的一笔：不是普通地把钉子收起来，而是烧掉整栋房子也要把钉子取回。</p>\n<blockquote><p>The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the [xxx] technology was.</p>\n</blockquote>\n<p>作者自己已经把这个代价很大的举动解释成技术稀缺、昂贵而珍贵。第4段接着说钉价后来下降90%，主要因为制钉效率提高。前面先让我们感到旧时钉子很贵重，后面才看得出生产效率提高、价格降低带来的变化。</p>\n<p>末两段又落到廉价技术改变世界：印刷的成本下降，太阳能板变便宜后改变能源系统。整条叙述持续追问的是技术值多少钱、降价后能做什么。</p>\n<p><strong>C虽然说出了前后文明的一处比较，能解释为什么偏偏要写“烧掉整栋房子”吗？</strong></p>\n<p>D解释得更直接。愿意付出这种代价，正因为钉子与制钉劳动在当时非常贵重。C没有说出这个故事突出的大代价，也没有接住段末的明确总结和后文的价格变化。</p>\n<p><strong>22题选D。</strong></p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**21. D**\n\n**22. D**\n\n**23. A**\n\n**24. B**\n\n**25. A**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>21. D</strong></p>\n<p><strong>22. D</strong></p>\n<p><strong>23. A</strong></p>\n<p><strong>24. B</strong></p>\n<p><strong>25. A</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRtJyBQBXRUJQVlA4TMZyBQAvV0Y1As34liTJkiTJtoCp6g
