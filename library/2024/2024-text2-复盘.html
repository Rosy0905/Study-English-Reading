h evolutionary history，两处都涉及与演化历史分离，所以回看最近的家庭安排以及 This 指回它的那两句。\n\n**选项类型：正确同义改写。**\n\n原文先说最近出现的家庭安排 broke with evolutionary history，再用 This 把这种转变接到母亲独自育儿的叙述上。D的 departs from the course of evolution 把 broke with 改说成 departs from，把 evolutionary history 改说成 course of evolution，仍然是在说这套近期安排与长期演化形成的做法分离。D没有把它说成自古如此，也没有把有害的后果换成好处。\n\n原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。\n\n**出处：**\n\n> In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history.\n>\n> This abrupt shift to an \"intensive mothering narrative\", which suggests that mothers should manage childcare alone, was likely to have been harmful.","context":{"mode":"image","asset":"questions","focus":[250,1698,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"28","option":"D"},"focusId":"focus-q28-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-D-0\">\u003cblockquote>\n\u003cp>偏离了演化的进程\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 departs from the course of evolution 对应第4段 broke with evolutionary history，两处都涉及与演化历史分离，所以回看最近的家庭安排以及 This 指回它的那两句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文先说最近出现的家庭安排 broke with evolutionary history，再用 This 把这种转变接到母亲独自育儿的叙述上。D的 departs from the course of evolution 把 broke with 改说成 departs from，把 evolutionary history 改说成 course of evolution，仍然是在说这套近期安排与长期演化形成的做法分离。D没有把它说成自古如此，也没有把有害的后果换成好处。\u003c/p>\n\u003cp>原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history  Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history.\u003c/p>\n\u003cp>This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful.\u003c/p>\n\u003cp>研究者称西方核心家庭是近期发明，与演化历史断开；要求母亲独力负责育儿的叙事可能有害，会使她们筋疲力尽。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Expecting mothers to provide care alone breaks with the longer history of shared child-rearing.\u003c/p>\n\u003cp>期待母亲独自育儿，偏离了更长久的共同照料历史。\u003c/p>\n\u003c/blockquote>\n\u003cp>这同时接住recent invention和broke with evolutionary history，把批评落在责任分配方式的历史变化。它不要求证明每个古代家庭都完全相同。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q28-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认现有育儿安排有可改善之处，不能自动推出某种母职叙事改善或损害了哪一类关系；应核对第4段对历史变化及后果的明确评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>departs from the course of evolution\u003cbr>偏离了演化的进程\u003c/p>\n\u003c/blockquote>\n\u003cp>原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。\u003c/p>\n\u003cp>本项最终仍要根据“broke with evolutionary history”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"28题结论","level":2,"raw":"### 28题结论\n\n> **28. D. departs from the course of evolution**\n\nA：独自照料被评为可能有害并造成耗竭，不能反写成减压。\n\nB：讨论家庭分工不等于证明家庭关系得到巩固。\n\nC：谁负责照料与家庭是否以孩子为中心是不同命题。\n\nD：近期安排与演化历史脱离，正对应departs from的同义改写。","context":{"mode":"image","asset":"questions","focus":[250,1348,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"28","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>28. D. departs from the course of evolution\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：独自照料被评为可能有害并造成耗竭，不能反写成减压。\u003c/p>\n\u003cp>B：讨论家庭分工不等于证明家庭关系得到巩固。\u003c/p>\n\u003cp>C：谁负责照料与家庭是否以孩子为中心是不同命题。\u003c/p>\n\u003cp>D：近期安排与演化历史脱离，正对应departs from的同义改写。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"29题 · 题干、题型与核心出处","level":2,"raw":"## 29题\n\n> What can be inferred about the nurseries in the UK?  \n> 关于英国的托儿所，可以推断出什么？\n\n### 题型\n\n比较推断题。题干要求判断“关于英国的托儿所，可以推断出什么？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Chaudhary said that parents now had less childcare support from family and social networks than during most of humans' evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a \"knock-on\" benefit to a child's wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\n\n本段先说增加照料者可能减轻父母负担、让孩子受益，再对照狩猎采集群体一个孩子有十余人照料和英国一名照料者负责四个两三岁孩子的许可配比。","context":{"mode":"image","asset":"questions","focus":[250,1859,1800,438],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"29","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What can be inferred about the nurseries in the UK?\u003cbr>关于英国的托儿所，可以推断出什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>比较推断题。题干要求判断“关于英国的托儿所，可以推断出什么？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段先说增加照料者可能减轻父母负担、让孩子受益，再对照狩猎采集群体一个孩子有十余人照料和英国一名照料者负责四个两三岁孩子的许可配比。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. They tend to fall short of official requirements.","level":3,"raw":"### A. They tend to fall short of official requirements.\n\n> 它们往往达不到官方要求。\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“They tend to fall short of [xxx] requirements.”，保留了相应遮挡。当时的定位线索是：A的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定的一个照料者对应四个孩子，以及前面的人数对比。读完全文后，做题模式再经交叉验证排除A，最终选择C。\n\n**错误类型：第一类——歪曲原意。**\n\nofficial requirements是“官方要求”，fall short of指没有达到它。第6段的regulations call for给出规定本身：一名照料者负责四个两三岁孩子。文中没有调查托儿所实际人数，更没有说机构普遍低于规定。\n\n作者用狩猎采集者的多人照料反衬这一规定下的支持程度，能导向改善配比，却不能导向违规指控。“标准本身还可以更好”和“机构没做到现行标准”是两种不同判断，A将它们混为一谈。\n\n**命题人借用的原文材料：**\n\n> An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.","context":{"mode":"image","asset":"questions","focus":[250,1953,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"29","option":"A"},"focusId":"focus-q29-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>它们往往达不到官方要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“They tend to fall short of [xxx] requirements.”，保留了相应遮挡。当时的定位线索是：A的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定 转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003cp>本段先说增加照料者可能减轻父母负担、让孩子受益，再对照狩猎采集群体一个孩子有十余人照料和英国一名照料者负责四个两三岁孩子的许可配比。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The central task assigned to British nurseries is to prevent parental depression.\u003c/p>\n\u003cp>赋予英国托儿所的核心任务是预防父母抑郁。\u003c/p>\n\u003c/blockquote>\n\u003cp>父母压力下降是额外支持的可能收益，而题目针对nurseries的具体推断落在紧邻的配比对照。把总体家庭收益写成托儿所应承担的特定预防任务，超出了该对比所能支持的范围。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认更多育儿支持值得考虑，不能证明英国托儿所违规、招聘困难或承担特定预防任务；具体建议要由照料人数与现行配比的比较支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>They should try to prevent parental depression.\u003cbr>它们应该尝试防止父母抑郁。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文把情绪好转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。\u003c/p>\n\u003cp>本项最终仍要根据“one carer to four children”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"29题结论","level":2,"raw":"### 29题结论\n\n> **29. C. They ought to improve their carer-to-child ratio.**\n\nA：列出官方配比规定不能证明机构实际违反了规定。\n\nB：配比较低不自动证明照料者招聘困难这一原因。\n\nC：更多支持的潜在益处与鲜明人数对照支持改善配比的建议。\n\nD：父母抑郁可能缓解是总体收益，不能替代针对托儿所配比的推断。","context":{"mode":"image","asset":"questions","focus":[250,1859,1800,438],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"29","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>29. C. They ought to improve their carer-to-child ratio.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：列出官方配比规定不能证明机构实际违反了规定。\u003c/p>\n\u003cp>B：配比较低不自动证明照料者招聘困难这一原因。\u003c/p>\n\u003cp>C：更多支持的潜在益处与鲜明人数对照支持改善配比的建议。\u003c/p>\n\u003cp>D：父母抑郁可能缓解是总体收益，不能替代针对托儿所配比的推断。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：狩猎采集者育儿方式的价值**（段落1-2核心观点） 研究发现：非洲狩猎采集者的育儿技巧可能是养育更满足孩子的关键 → 具体例子：昆族（每个孩子由多个成年人照顾 + 4岁孩子照顾更小的 + 婴儿背带是常态）→ 定义：这些做法称为\"异亲养育\"（alloparenting）→ 好处：减少孩子和父母的焦虑\n\n↓（西方借鉴的可能性）\n\n**逻辑层次2：将异亲养育融入西方社会**（段落3实践探索） 专家观点：可以将这些做法融入西方生活 → 实践案例：【德国：养老院与托儿所配对（居民帮助照顾孩子）】+ 建议措施：【鼓励不同年级儿童友谊（反映混龄游戏小组）】\n\n↓（理论背景分析）\n\n**逻辑层次3：西方育儿模式的问题**（段落4批判分析） 历史断裂：西方核心家庭是打破进化历史的近代发明 → \"密集母亲叙事\"：（母亲独自管理育儿）→ 后果：可能有害（导致母亲疲惫 + 危险后果）\n\n//（对比分析）\n\n**逻辑层次4：狩猎采集社会vs西方社会的育儿差异**（段落5-6对比论证） 狩猎采集社会：【父母外的成年人提供近一半照顾 + 埃费人案例：（18周大婴儿每天14个异亲父母 + 每小时传递8次）】// 现代西方：【父母获得更少支持 + 英国托儿所：（1个照顾者对4个2-3岁孩子）】→ 潜在好处：额外照顾者可减少压力和抑郁，对孩子福祉有连锁好处\n\n↓（教育方式的影响）\n\n**逻辑层次5：教育方式的反思与建议**（段落7深层思考） 学习方式对比：【狩猎采集者：观察和模仿（混龄游戏小组）// 西方：教导式教学（要求坐着不动）→ 可能导致ADHD】→ 建议：英国应探索年长兄弟姐妹帮助父母（可能增强其社会发展）\n\n↑（全文主旨）\n\n全文核心观点：从非洲狩猎采集者的异亲养育方式中学习，通过增加照顾者、鼓励混龄互动等方式，可以减少现代西方\"密集母亲叙事\"带来的压力，培养更满足、更健康的孩子。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可 ear Family对应other than the parents和across the community；Care对应share tasks而非单纯共同居住。Can保留一种可能组织形式，不宣称所有社区已经这样安排。\n\n再看最强干扰项F：Supporting Parents without Replacing Them。\n\n支持父母的标题与总体方向相容，但本段没有讨论支持会不会取代父母，也未分配最终决定权。它主要在扩展照料网络的描述单位，选该标题会把尚未展开的责任边界问题提前带入。\n\n**41题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. Care Can Extend Beyond the Nuclear Family\u003c/p>\n\u003cblockquote>\n\u003cp>照料可以超出核心家庭\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分用其他成人和较大孩子实际分担任务，说明照料网络不能只按核心家庭描述。\u003c/p>\n\u003cp>首句先把照料来源作何改变：\u003c/p>\n\u003cblockquote>\n\u003cp>from a network rather than from one parent acting alone\u003c/p>\n\u003c/blockquote>\n\u003cp>network与独自负责的父母形成对照，讨论的是照料支持由谁构成，而不是家庭成员住得多近。\u003c/p>\n\u003cp>随后明确“多人在附近”为什么还不够：\u003c/p>\n\u003cblockquote>\n\u003cp>They actually share tasks\u003c/p>\n\u003c/blockquote>\n\u003cp>实际分担任务才把旁观的邻近者变成支持者。otherwise说明这些事本来会集中到更少的人身上。\u003c/p>\n\u003cp>结尾要求观察哪个范围：\u003c/p>\n\u003cblockquote>\n\u003cp>who participates in care across the community\u003c/p>\n\u003c/blockquote>\n\u003cp>核心家庭不足以描述全部支持，要追踪整个社区中谁在参与。母亲是否独力应付不再是唯一尺度。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>照料可来自网络 → 其他成人与较大孩子参与 → 关键是实际分担任务 → 以社区参与者而非孤立母亲描述支持\u003c/p>\n\u003c/blockquote>\n\u003cp>Beyond the Nuclear Family对应other than the parents和across the community；Care对应share tasks而非单纯共同居住。Can保留一种可能组织形式，不宣称所有社区已经这样安排。\u003c/p>\n\u003cp>再看最强干扰项F：Supporting Parents without Replacing Them。\u003c/p>\n\u003cp>支持父母的标题与总体方向相容，但本段没有讨论支持会不会取代父母，也未分配最终决定权。它主要在扩展照料网络的描述单位，选该标题会把尚未展开的责任边界问题提前带入。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】C. Adapting a Principle to Different Institutions\n\n> 让原则适应不同机构\n\n这一部分以已有机构的合作说明如何保留共同参与的原则，而不照搬对方整套生活。\n\n先看作者排除的是哪种学习方式：\n\n> rebuilding its entire way of life\n\n借鉴不要求重建对方全部生活，因此城镇制度与原有社区不同，并不自动说明借鉴失败。\n\n中间的机构实例保留了什么原则：\n\n> additional adults to help with children\n\n老人院与托儿所相连，使父母以外成人有机会加入照料。这是原则的功能对应，不是建筑形态的模仿。\n\n结尾给出评价改编效果的尺度：\n\n> the support it actually provides\n\n应看实际增加了多少支持，而非建筑像不像传统村落。其价值来自照料责任可被分担的效果。\n\n这一部分的推进关系是：\n\n> 借鉴无需复制整套生活 → 利用已有机构 → 让额外成人参与照料 → 按实际支持而非外形相似评价\n\nPrinciple对应care need not be confined to parents，Different Institutions对应欧洲城镇的nursery与home for older people。Adapting概括保留功能、改变组织形式的关系，而不是原样移植。\n\n再看最强干扰项D：One Universal Recipe for Raising Children。\n\n统一育儿配方意味着各处采用同一套安排，但开头明确不必重建entire way of life，后面还认可arrangement differs。作者提倡按当地机构实现分担原则，恰恰允许形式随环境变化。\n\n**42题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. Adapting a Principle to Different Institutions\u003c/p>\n\u003cblockquote>\n\u003cp>让原则适应不同机构\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分以已有机构的合作说明如何保留共同参与的原则，而不照搬对方整套生活。\u003c/p>\n\u003cp>先看作者排除的是哪种学习方式：\u003c/p>\n\u003cblockquote>\n\u003cp>rebuilding its entire way of life\u003c/p>\n\u003c/blockquote>\n\u003cp>借鉴不要求重建对方全部生活，因此城镇制度与原有社区不同，并不自动说明借鉴失败。\u003c/p>\n\u003cp>中间的机构实例保留了什么原则：\u003c/p>\n\u003cblockquote>\n\u003cp>additional adults to help with children\u003c/p>\n\u003c/blockquote>\n\u003cp>老人院与托儿所相连，使父母以外成人有机会加入照料。这是原则的功能对应，不是建筑形态的模仿。\u003c/p>\n\u003cp>结尾给出评价改编效果的尺度：\u003c/p>\n\u003cblockquote>\n\u003cp>the support it actually provides\u003c/p>\n\u003c/blockquote>\n\u003cp>应看实际增加了多少支持，而非建筑像不像传统村落。其价值来自照料责任可被分担的效果。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>借鉴无需复制整套生活 → 利用已有机构 → 让额外成人参与照料 → 按实际支持而非外形相似评价\u003c/p>\n\u003c/blockquote>\n\u003cp>Principle对应care need not be confined to parents，Different Institutions对应欧洲城镇的nursery与home for older people。Adapting概括保留功能、改变组织形式的关系，而不是原样移植。\u003c/p>\n\u003cp>再看最强干扰项D：One Universal Recipe for Raising Children。\u003c/p>\n\u003cp>统一育儿配方意味着各处采用同一套安排，但开头明确不必重建entire way of life，后面还认可arrangement differs。作者提倡按当地机构实现分担原则，恰恰允许形式随环境变化。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】A. A Standard Is Not Evidence of a Violation\n\n> 规定本身不是违规证据\n\n这一部分区分照料配比标准与实际人手证据，说明倡议提高标准不等于指控机构违规。\n\n先承认人数对比能告诉我们什么：\n\n> how differently support is organized\n\n多人照料一人与一人负责多人，确实显示支持组织方式不同；这项比较本身有价值。\n\nYet之后区分哪两种判断：\n\n> quoting an official ratio does not show that a nursery has broken the rule\n\n给出现行规定，不等于报告某机构未遵守。违规还需要实际人手与要求下限两份信息。\n\n末句说明达标与改进能否同时成立：\n\n> meet today’s requirement and still leave room\n\n一项服务可以达到今天标准，又有进一步增加照料支持的空间。作者讨论改标准与指控机构违反标准的证据不同。\n\n这一部分的推进关系是：\n\n> 配比对比显示支持差异 → 规定不等于实际违规记录 → 判断违规还需真实人手 → 达标同时仍可讨论提高标准\n\nStandard对应official ratio及required minimum；Evidence of a Violation对应actual staffing与broken the rule。Is Not精确表达“规定本身不能证明违规”，并不否认所有违规的可能。\n\n再看最强干扰项D：One Universal Recipe for Raising Children。\n\n一套统一配方会从不同配比跳到所有地方必须同样配置。原段既没指定唯一正确人数，也没要求照搬多人照料一孩，只在厘清比较能支持何种结论，核心是证据与推断的边界。\n\n**43题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. A Standard Is Not Evidence of a Violation\u003c/p>\n\u003cblockquote>\n\u003cp>规定本身不是违规证据\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分照料配比标准与实际人手证据，说明倡议提高标准不等于指控机构违规。\u003c/p>\n\u003cp>先承认人数对比能告诉我们什么：\u003c/p>\n\u003cblockquote>\n\u003cp>how differently support is organized\u003c/p>\n\u003c/blockquote>\n\u003cp>多人照料一人与一人负责多人，确实显示支持组织方式不同；这项比较本身有价值。\u003c/p>\n\u003cp>Yet之后区分哪两种判断：\u003c/p>\n\u003cblockquote>\n\u003cp>quoting an official ratio does not show that a nursery has broken the rule\u003c/p>\n\u003c/blockquote>\n\u003cp>给出现行规定，不等于报告某机构未遵守。违规还需要实际人手与要求下限两份信息。\u003c/p>\n\u003cp>末句说明达标与改进能否同时成立：\u003c/p>\n\u003cblockquote>\n\u003cp>meet today’s requirement and still leave room\u003c/p>\n\u003c/blockquote>\n\u003cp>一项服务可以达到今天标准，又有进一步增加照料支持的空间。作者讨论改标准与指控机构违反标准的证据不同。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>配比对比显示支持差异 → 规定不等于实际违规记录 → 判断违规还需真实人手 → 达标同时仍可讨论提高标准\u003c/p>\n\u003c/blockquote>\n\u003cp>Standard对应official ratio及required minimum；Evidence of a Violation对应actual staffing与broken the rule。Is Not精确表达“规定本身不能证明违规”，并不否认所有违规的可能。\u003c/p>\n\u003cp>再看最强干扰项D：One Universal Recipe for Raising Children。\u003c/p>\n\u003cp>一套统一配方会从不同配比跳到所有地方必须同样配置。原段既没指定唯一正确人数，也没要求照搬多人照料一孩，只在厘清比较能支持何种结论，核心是证据与推断的边界。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】E. Learning through Helping Someone Younger\n\n> 通过帮助年幼者学习\n\n这一部分解释较大孩子在帮助中能学习什么，同时保留年龄、成人支持和责任范围的界限。\n\n先看“好处不只一个方向”指谁：\n\n> the benefit need not travel in only one direction\n\n幼童得到帮助，较大孩子也可能有收获，随后三项动作专门说明帮助者要练习什么。\n\n帮助者面对哪些具体任务：\n\n> notice another person’s difficulty, explain an action and adjust to a slower pace\n\n观察他人的困难、解释步骤、适应更慢速度，都要求考虑别人的状态，为social learning提供具体内容。\n\n但这种学习有什么界限：\n\n> different from making a child the sole carer\n\n小规模且有支持的参与不等于独自接管成人职责。结尾的appropriate to the helper’s age继续限定参与程度。\n\n这一部分的推进关系是：\n\n> 幼童获帮助 → 帮助者也练习观察与解释 → 产生社会学习机会 → 参与须有支持且适合年龄\n\nLearning对应social learning与consideration for others，Helping Someone Younger对应older child帮助younger one。Through说明学习来自帮助中的具体任务，不是成人专门讲授育儿课程。\n\n再看最强干扰项G：Leaving Children Entirely on Their Own。\n\n让儿童完全独处删去了supported和非sole carer的限制。文中有older child与younger child的共同活动，也保留成人责任；自主参与学习不能被改写成没有任何人支持或监督。\n\n**44题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. Learning through Helping Someone Younger\u003c/p>\n\u003cblockquote>\n\u003cp>通过帮助年幼者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释较大孩子在帮助中能学习什么，同时保留年龄、成人支持和责任范围的界限。\u003c/p>\n\u003cp>先看“好处不只一个方向”指谁：\u003c/p>\n\u003cblockquote>\n\u003cp>the benefit need not travel in only one direction\u003c/p>\n\u003c/blockquote>\n\u003cp>幼童得到帮助，较大孩子也可能有收获，随后三项动作专门说明帮助者要练习什么。\u003c/p>\n\u003cp>帮助者面对哪些具体任务：\u003c/p>\n\u003cblockquote>\n\u003cp>notice another person’s difficulty, explain an action and adjust to a slower pace\u003c/p>\n\u003c/blockquote>\n\u003cp>观察他人的困难、解释步骤、适应更慢速度，都要求考虑别人的状态，为social learning提供具体内容。\u003c/p>\n\u003cp>但这种学习有什么界限：\u003c/p>\n\u003cblockquote>\n\u003cp>different from making a child the sole carer\u003c/p>\n\u003c/blockquote>\n\u003cp>小规模且有支持的参与不等于独自接管成人职责。结尾的appropriate to the helper’s age继续限定参与程度。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>幼童获帮助 → 帮助者也练习观察与解释 → 产生社会学习机会 → 参与须有支持且适合年龄\u003c/p>\n\u003c/blockquote>\n\u003cp>Learning对应social learning与consideration for others，Helping Someone Younger对应older child帮助younger one。Through说明学习来自帮助中的具体任务，不是成人专门讲授育儿课程。\u003c/p>\n\u003cp>再看最强干扰项G：Leaving Children Entirely on Their Own。\u003c/p>\n\u003cp>让儿童完全独处删去了supported和非sole carer的限制。文中有older child与younger child的共同活动，也保留成人责任；自主参与学习不能被改写成没有任何人支持或监督。\u003c/p>\n\u003cp>\u003cstrong>44题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】F. Supporting Parents without Replacing Them\n\n> 支持父母而非替代父母\n\n这一部分把共同照料定位为父母的支持，要求更多参与者有沟通和清楚分工。\n\n首句首先限定共同照料不是哪种主张：\n\n> not a declaration that parents no longer matter\n\n增加支持不意味着父母不再重要，后文因此继续要求参与者围绕孩子需求可靠沟通。\n\n父母得到支持的具体表现是什么：\n\n> rest or ask for help without feeling that they have failed\n\n父母可以休息或求助，而不必把未能独力包办视为失败。减轻的正是manage everything alone的压力。\n\n结尾用什么检验网络是否成功：\n\n> know how to cooperate with the family\n\n合作方式要清楚，不能把人数增多变成责任模糊。最后who is doing what要求实际分工能够说明白。\n\n这一部分的推进关系是：\n\n> 共同照料增加父母支持 → 更多人提供时间与关注 → 父母可休息和求助 → 成功网络仍需沟通与清楚分工\n\nSupporting对应addition、relief与ask for help，without Replacing对应parents no longer matter被否定，以及cooperate with the family的正面要求。标题同时保留增援与责任边界两端。\n\n再看最强干扰项B：Care Can Extend Beyond the Nuclear Family。\n\n照料超出核心家庭是本段背景，但作者不再主要列网络包括哪些人，而在说明扩展以后父母地位和分工如何保持。只强调范围扩大，会漏掉首尾反复限定的支持不等于责任消散。\n\n**45题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. Supporting Parents without Replacing Them\u003c/p>\n\u003cblockquote>\n\u003cp>支持父母而非替代父母\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把共同照料定位为父母的支持，要求更多参与者有沟通和清楚分工。\u003c/p>\n\u003 n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从父母负担转问谁能分担照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>说明帮助者也能学习，同时给参与加年龄与成人支持限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明支持父母可能间接帮助孩子，转问西方如何安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>介绍多人参与的共同育儿，与小家庭独自负责形成对照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>以历史对照质疑独立母职，提出增加支持的作用问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>由参与限制收束为因地安排、有清楚责任的共同支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从父母负担转问谁能分担照料 → 介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题 → 说明支持父母可能间接帮助孩子，转问西方如何安排 → 以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能 → 说明帮助者也能学习，同时给参与加年龄与成人支持限制 → 由参与限制收束为因地安排、有清楚责任的共同支持\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → F → G → E → B → D → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：F、G、B、D、C。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → F → G的关系。\n\n先看前段A的结尾：\n\n> Before adding one more instruction, it may help to examine who is available to share the care.\n\n再看候选F的开头：\n\n> In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones.\n\n开篇结尾问who is available to share the care，本段the answer逐项列父母之外的成人与较大孩子。参与者名单直接回答可找谁分担，随后才给这种广泛参与命名，定义有例子作基础。\n\n由多人实际参与概括为network，进而与one isolated mother对照。最后small household must manage alone把这项对照收束成一种既有观念，给后段评价观念留下明确对象。\n\nF段最终落在：\n\n> It offers a useful contrast to the idea that a small household must manage alone.\n\n后段G的开头是：\n\n> That contrast challenges the assumption that solitary mothering is the only natural arrangement.\n\n后段That contrast回指网络与独立小家庭，进一步质疑独自母职是唯一天然安排。先有观察到的另一种组织形式，才能说明目前分工是社会选择，而非唯一可能。\n\n这三段的局部推进是：\n\n> 从父母负担转问谁能分担照料 → 介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题\n\n再检验容易混淆的候选B。它的开头是：\n\n> Existing institutions can provide one route to those arrangements.\n\nExisting institutions也能谈谁加入照料，但those arrangements需要前文已有西方具体安排的任务。开篇还没有解释共同育儿的原则及其意义，直接进入机构会缺少参照，也无法建立后段所指的天然母职对照。\n\n**41题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → F → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Before adding one more instruction, it may help to examine who is available to share the care.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones.\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇结尾问who is available to share the care，本段the answer逐项列父母之外的成人与较大孩子。参与者名单直接回答可找谁分担，随后才给这种广泛参与命名，定义有例子作基础。\u003c/p>\n\u003cp>由多人实际参与概括为network，进而与one isolated mother对照。最后small household must manage alone把这项对照收束成一种既有观念，给后段评价观念留下明确对象。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>It offers a useful contrast to the idea that a small household must manage alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段That contrast回指网络与独立小家庭，进一步质疑独自母职是唯一天然安排。先有观察到的另一种组织形式，才能说明目前分工是社会选择，而非唯一可能。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从父母负担转问谁能分担照料 → 介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing institutions can provide one route to those arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>Existing institutions也能谈谁加入照料，但those arrangements需要前文已有西方具体安排的任务。开篇还没有解释共同育儿的原则及其意义，直接进入机构会缺少参照，也无法建立后段所指的天然母职对照。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成F → G → E的关系。\n\n先看前段F的结尾：\n\n> It offers a useful contrast to the idea that a small household must manage alone.\n\n再看候选G的开头：\n\n> That contrast challenges the assumption that solitary mothering is the only natural arrangement.\n\n前段最后把多人参与与small household must manage alone相对，本段That contrast承接后，将表面的分工差异推进成对only natural的质疑。反驳依据是另一种可观察安排，而非凭空否定父母责任。\n\nif care has often involved a wider group说明为什么把全部任务集中于一人可被视为特定选择。段末拒绝浪漫回到过去，改问增加支持会怎样改变今天父母的处境。\n\nG段最终落在：\n\n> The comparison invites a practical question rather than a romantic return to the past: what might additional support change for today’s parents?\n\n后段E的开头是：\n\n> Additional support could give parents more opportunities to rest and share difficult moments.\n\n已知后段Additional support could give parents正面回答这一问题：先使父母能休息，再可能间接让孩子受益。支持对象与问题中的today’s parents一致，因果说明也接在提问之后。\n\n这三段的局部推进是：\n\n> 介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题 → 说明支持父母可能间接帮助孩子，转问西方如何安排\n\n再检验容易混淆的候选C。它的开头是：\n\n> Such help may support the older child’s own social development.\n\nSuch help一段的帮助者特指older child，讨论其年龄与成人责任边界；当前刚介绍整个照料网络，尚未聚焦较大孩子的帮忙。它不能替代对父母增加支持的总体提问，也会把后段的受益主体接错。\n\n**42题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成F → G → E的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It offers a useful contrast to the idea that a small household must manage alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后把多人参与与small household must manage alone相对，本段That contrast承接后，将表面的分工差异推进成对only natural的质疑。反驳依据是另一种可观察安排，而非凭空否定父母责任。\u003c/p>\n\u003cp>if care has often involved a wider group说明为什么把全部任务集中于一人可被视为特定选择。段末拒绝浪漫回到过去，改问增加支持会怎样改变今天父母的处境。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The comparison invites a practical question rather than a romantic return to the past: what might additional support change for today’s parents?\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Additional support could give parents more opportunities to rest and share difficult moments.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段Additional support could give parents正面回答这一问题：先使父母能休息，再可能间接让孩子受益。支持对象与问题中的today’s parents一致，因果说明也接在提问之后。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题 → 说明支持父母可能间接帮助孩子，转问西方如何安排\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such help may support the older child’s own social development.\u003c/p>\n\u003c/blockquote>\n\u003cp>Such help一段的帮助者特指older child，讨论其年龄与成人责任边界；当前刚介绍整个照料网络，尚未聚焦较大孩子的帮忙。它不能替代对父母增加支持的总体提问，也会把后段的受益主体接错。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → D的关系。\n\n先看前段E的结尾：\n\n> To make use of it, however, a western community needs workable arrangements of its own.\n\n再看候选B的开头：\n\n> Existing institutions can provide one route to those arrangements.\n\n已知前段末尾要求western community找workable arrangements，本段those arrangements原词承接，并用Existing institutions给出实现路径。问题从支持是否有价值转到当地通过什么组织来实现。\n\n老人院与托儿所合作提供成人参与的具体形式，随后preserve a principle without copying说明借鉴尺度。段尾再把共享经验的探索从adult care延伸到children’s play，准备切换参与者关系。\n\nB段最终落在：\n\n> A similar search for shared experience can extend beyond adult care to children’s play.\n\n后段D的开头是：\n\n> Mixed-age play is one setting for that shared experience.\n\n后段Mixed-age play立刻接children’s play，并以that shared experience保留本段shared experience的对象。成人机构安排先举一例，再将同一参与原则应用到儿童之间，扩展有桥接句。\n\n这三段的局部推进是：\n\n> 说明支持父母可能间接帮助孩子，转问西方如何安排 → 以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能\n\n再检验容易混淆的候选F。它的开头是：\n\n> In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones.\n\n介绍alloparenting的段落停在狩猎采集者是谁参与及概念定义，还未给西方workable arrangements的实例。放在这里会重讲已知背景，也不会像children’s play那样为后段混龄游戏提供直接入口。\n\n**43题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → D的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To make use of it, however, a western community needs workable arrangements of its own.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing institutions can provide one route to those arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段末尾要求western community找workable arrangements，本段those arrangements原词承接，并用Existing institutions给出实现路径。问题从支持是否有价值转到当地通过什么组织来实现。\u003c/p>\n\u003cp>老人院与托儿所合作提供成人参与的具体形式，随后preserve a principle without copying说明借鉴尺度。段尾再把共享经验的探索从adult care延伸到children’s play，准备切换参与者关系。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A similar search for shared experience can extend beyond adult care to children’s play.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Mixed-age play is one setting for that shared experience.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Mixed-age play立刻接children’s play，并以that shared experience保留本段shared experience的对象。成人机构安排先举一例，再将同一参与原则应用到儿童之间，扩展有桥接句。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明支持父母可能间接帮助孩子，转问西方如何安排 → 以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones.\u003c/p>\n\u003c/blockquote>\n\u003cp>介绍alloparenting的段落停在狩猎采集者是谁参与及概念定义，还未给西方workable arrangements的实例。放在这里会重讲已知背景，也不会像children’s play那样为后段混龄游戏提供直接入口。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → D → C的关系。\n\n先看前段B的结尾：\n\n> A similar search for shared experience can extend beyond adult care to children’s play.\n\n再看候选D的开头：\n\n> Mixed-age play is one setting for that shared experience.\n\n前段结尾已把讨论从成人照料推向children’s play，本段Mixed-age play给这一范围一个具体形式。that shared experience还保留多方互动的共同原则，衔接不只靠play重复。\n\n年轻者观察较有能力的同伴，年长者调整行为，说明学习可以通过互动双向发生。最后把年长者的contribution推进到帮助幼童日常需求，使游戏中的学习进一步连接实际照料参与。\n\nD段最终落在：\n\n> This raises a further possibility: an older child’s contribution may involve helping with younger children’s everyday needs.\n\n后段C的开头是：\n\n> Such help may support the older child’s own social development.\n\n后段Such help回指刚提出的帮助幼童，而older child’s own social development讨论帮助者所得。先说明年长孩子做什么，再说明帮助本身可能怎样发展他的能力，受益方向清晰。\n\n这三段的局部推进是：\n\n> 以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能 → 说明帮助者也能学习，同时给参与加年龄与成人支持限制\n\n再检验容易混淆的候选C。它的开头是：\n\n> Such help may support the older child’s own social development.\n\nSuch help段若直接接成人机构段，前面只有children’s play，尚没有年长孩子帮助幼童日常需求的具体行动。它会把“帮助”的内容和帮助者的身份都省掉，失去社会发展这一结论的行为基础。\n\n**44题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → D → C的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A similar search for shared experience can extend beyond adult care to children’s play.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Mixed-age play is one setting for that shared experience. 何有分寸的收束。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **shared responsibility for childcare** | **共同承担育儿责任** | **人生哲理类：责任感、奉献精神** | **宏观主题** |\n| community cooperation | 社区合作 | 人生哲理类：团结合作 | 宏观主题 |\n| support for parents | 对父母的支持 | 社会生活类：生活质量 | 宏观主题 |\n| **children’s wellbeing** | **儿童福祉** | **社会生活类：生活质量** | **宏观主题** |\n| learning through observation | 通过观察学习 | 教育文化类：学习生活 | 个人主题 |\n| social development | 社会交往能力的发展 | 教育文化类：学习生活 | 个人主题 |\n| **mutual help across generations** | **代际互助** | **人生哲理类：团结合作** | **宏观主题** |\n| a readiness to learn from others | 向他人学习的意愿 | 人生哲理类：谦虚、承认不足 | 个人主题 |\n| flexible approaches to learning | 灵活的学习方式 | 人生哲理类：创新、开拓、与时俱进 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>shared responsibility for childcare\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>共同承担育儿责任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>community cooperation\u003c/td>\n\u003ctd>社区合作\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>support for parents\u003c/td>\n\u003ctd>对父母的支持\u003c/td>\n\u003ctd>社会生活类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>children’s wellbeing\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>儿童福祉\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：生活质量\u003c/stron rns what one community can learn from another. | 问题涉及一个社区能向另一个社区学习什么。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows several people sharing responsibility for X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示几个人共同分担X的责任。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, older children are helping younger ones with X.\u003c/td>\n\u003ctd>图中较大的孩子正在帮助年幼孩子完成X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene illustrates how support from others can ease a burden.\u003c/td>\n\u003ctd>这一场景展示他人的支持如何减轻负担。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The ratio of X to Y differs sharply between the two groups.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>两组中X与Y的比例明显不同。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>On average, each X receives support from Y people.\u003c/td>\n\u003ctd>平均每个X得到Y个人的支持。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures suggest that a larger number of X is associated with Y.\u003c/td>\n\u003ctd>数据表明更多X与Y相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage explores ways to incorporate X into everyday life.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章探索把X融入日常生活的办法。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text contrasts a recent arrangement with a longer history of shared responsibility.\u003c/td>\n\u003ctd>文章把一种近期安排与更久远的共同分担历史作对照。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns what one community can learn from another.\u003c/td>\n\u003ctd>问题涉及一个社区能向另一个社区学习什么。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. A Standard Is Not Evidence of a Violation\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Care Can Extend Beyond the Nuclear Family\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Adapting a Principle to Different Institutions\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. One Universal Recipe for Raising Children\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Learning through Helping Someone Younger\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Supporting Parents without Replacing Them\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Leaving Children Entirely on Their Own\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A child can receive care from a network rather than from one parent acting alone. In some hunter-gatherer communities, adults other than the parents and older children take part in everyday care. The significance is not simply that many people live nearby. They actually share tasks that would otherwise fall on a smaller number of shoulders. This makes the nuclear household an incomplete unit for describing the child’s support. The useful question becomes who participates in care across the community, rather than whether one mother is managing every demand by herself.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>Learning from a hunter-gatherer community does not require rebuilding its entire way of life in a European town. A principle can be adapted through institutions that already exist. Pairing a nursery with a home for older people, for example, can create opportunities for additional adults to help with children. The arrangement differs from life in a small foraging community, but it preserves the idea that care need not be confined to parents. Its value should be judged by the support it actually provides, not by how closely the buildings resemble an imagined traditional village.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>A comparison between childcare ratios can reveal how differently support is organized. Several people sharing the care of one infant is plainly unlike one worker caring for several children. Yet quoting an official ratio does not show that a nursery has broken the rule. To establish a violation, one would need information about its actual staffing as well as the required minimum. The comparison may instead support a discussion about improving the standard itself. A service can meet today’s requirement and still leave room for a more generous level of care.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>When an older child helps a younger one, the benefit need not travel in only one direction. The younger child receives assistance, while the helper has to notice another person’s difficulty, explain an action and adjust to a slower pace. Such experiences can provide occasions for social learning. This does not mean that children should take over an adult’s continuing responsibilities. Small, supported opportunities to help are different from making a child the sole carer. The educational interest lies in participation that develops consideration for others while remaining appropriate to the helper’s age.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Shared care is best understood as an addition to parental support, not a declaration that parents no longer matter. More participants can offer time, attention and relief, but the arrangement still needs reliable communication about a child’s needs. Parents may benefit when they can rest or ask for help without feeling that they have failed. The point is to reduce the pressure to manage everything alone. A network succeeds when its members know how to cooperate with the family, rather than when responsibility becomes so diffuse that nobody can say who is doing what.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Advice about raising children often addresses a parent as if every task belonged to that individual. When demands multiply, even careful advice can sound like another obligation. A different starting point is to ask how the work is distributed. Before adding one more instruction, it may help to examine who is available to share the care.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Existing institutions can provide one route to those arrangements. A nursery linked with a home for older people can make room for additional adults in children’s daily lives. The aim is to preserve a principle of participation without copying an entire society. A similar search for shared experience can extend beyond adult care to children’s play.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Such help may support the older child’s own social development. Noticing a younger person’s needs can create opportunities to practise patience and explanation. It should nevertheless remain help, rather than the transfer of an adult’s full responsibility to a child. Participation has to be limited by the helper’s age and backed by appropriate adult support.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Mixed-age play is one setting for that shared experience. Younger children can watch more capable companions, while older participants learn to adapt their actions to others. Learning occurs through observation and interaction as well as through direct instruction. This raises a further possibility: an older child’s contribution may involve helping with younger children’s everyday needs.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>Additional support could give parents more opportunities to rest and share difficult moments. A child may benefit indirectly when the adults providing care are less overwhelmed. The proposed connection runs from a broader support network through the parent’s experience to the child’s wellbeing. To make use of it, however, a western community needs workable arrangements of its own.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones. Care is therefore a network of participation, not simply a duty carried by one isolated mother. The term alloparenting describes this wider involvement. It offers a useful contrast to the idea that a small household must manage alone.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement. If care has often involved a wider group, concentrating every task on one person is a particular social choice. The comparison invites a practical question rather than a romantic return to the past: what might additional support change for today’s parents?\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That limit illustrates the larger task of adaptation. Learning from shared care means asking which relationships can reduce isolation without creating new burdens for those least able to carry them. A useful network supports parents and children together. It needs clear responsibilities and local judgement, rather than a single arrangement copied unchanged into every family.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2024英语一Text 2重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>parenting tip\u003c/td>\n\u003ctd>n.育儿建议\u003c/td>\n\u003ctd>obtain\u003c/td>\n\u003ctd>v.获得\u003c/td>\n\u003ctd
