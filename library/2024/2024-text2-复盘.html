const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| parenting tip | n.育儿建议 | obtain | v.获得 | hunter-gatherer | n.狩猎采集者 |\n| the key to | phr.……的关键 | bring up | phr.养育 | contented | adj.满足的；愉快的 |\n| researcher | n.研究人员 | suggest | v.提出 | idea | n.想法 |\n| be based on | phr.以……为依据 | community | n.群体；社区 | such as | phr.例如 |\n| child | n.孩子 | as young as | phr.小至……岁 | look after | phr.照顾 |\n| younger | adj.年纪更小的 | baby-wearing | n.用背带将婴儿贴身携带 | infant | n.婴儿 |\n| sling | n.婴儿背带 | consider | v.认为 | norm | n.常态 |","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 2重点词与语境","focus":[85,140,925,576],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003c sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-1-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more contented children, / researchers have suggested.\u003c/p>\n\u003cp>The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for / by many adults.\u003c/p>\n\u003cp>Kung children / as young as four / will help to look after / younger ones / and &quot;baby-wearing&quot;, / in which infants are carried in slings, / is considered the norm.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>育儿技巧 / 从非洲狩猎采集者那里获得的 / 可能是关键 / 养育 / 更满足的孩子，/ 研究人员建议道。\u003c/p>\n\u003cp>这个想法基于 / 对社区的研究 / 比如博茨瓦纳的昆族，/ 在那里每个孩子 / 被照顾 / 由许多成年人。\u003c/p>\n\u003cp>昆族儿童 / 年仅四岁的 / 会帮助照顾 / 更小的孩子 / 而&quot;婴儿背带&quot;，/ 即婴儿被背带携带，/ 被认为是常态。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 标准译文 · 第1段\n\n研究人员建议，从非洲狩猎采集者那里学到的育儿技巧可能是养育更满足孩子的关键。这个想法基于对博茨瓦纳昆族等社区的研究，在那里每个孩子都由许多成年人照顾。年仅四岁的昆族儿童就会帮助照顾更小的孩子，而用背带携带婴儿的\"婴儿背带\"方式被认为是常态。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,140,925,576],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more contented children, / researchers have suggested.\u003c/p>\n\u003cp>The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for / by many adults.\u003c/p>\n\u003cp>Kung children / as young as four / will help to look after / younger ones / and &quot;baby-wearing&quot;, / in which infants are carried in slings, / is considered the norm.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>育儿技巧 / 从非洲狩猎采集者那里获得的 / 可能是关键 / 养育 / 更满足的孩子，/ 研究人员建议道。\u003c/p>\n\u003cp>这个想法基于 / 对社区的研究 / 比如博茨瓦纳的昆族，/ 在那里每个孩子 / 被照顾 / 由许多成年人。\u003c/p>\n\u003cp>昆族儿童 / 年仅四岁的 / 会帮助照顾 / 更小的孩子 / 而&quot;婴儿背带&quot;，/ 即婴儿被背带携带，/ 被认为是常态。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-3\">\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>研究人员建议，从非洲狩猎采集者那里学到的育儿技巧可能是养育更满足孩子的关键。这个想法基于对博茨瓦纳昆族等社区的研究，在那里每个孩子都由许多成年人照顾。年仅四岁的昆族儿童就会帮助照顾更小的孩子，而用背带携带婴儿的&quot;婴儿背带&quot;方式被认为是常态。\u003c/p>\n\u003c/ d were passed between caregivers / eight times an hour.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 意群翻译 · 第5段\n\n相比之下，/ 在狩猎采集社会中 / 父母以外的成年人 / 可以提供 / 几乎一半 / 孩子的照顾。\n\n一项先前的研究 / 观察了 / 埃费人 / 刚果民主共和国的。\n\n它发现 / 婴儿有 / 平均每天14个异亲父母 / 到他们18周大时 / 并在照顾者之间传递 / 每小时八次。","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2489,925,477],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-5-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child&#39;s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 alloparents a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-1\">\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half / of a child&#39;s care.\u003c/p>\n\u003cp>One previous study / looked at / the Efé people / of the Democratic Republic of Congo.\u003c/p>\n\u003cp>It found that / infants had / an average of 14 alloparents a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-2\">\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>相比之下，/ 在狩猎采集社会中 / 父母以外的成年人 / 可以提供 / 几乎一半 / 孩子的照顾。\u003c/p>\n\u003cp>一项先前的研究 / 观察了 / 埃费人 / 刚果民主共和国的。\u003c/p>\n\u003cp>它发现 / 婴儿有 / 平均每天14个异亲父母 / 到他们18周大时 / 并在照顾者之间传递 / 每小时八次。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 标准译文 · 第5段\n\n相比之下，在狩猎采集社会中，父母以外的成年人可以提供几乎一半的儿童照顾。一项关于刚果民主共和国埃费人的研究发现，婴儿到18周大时平均每天有14个异亲父母，并且每小时在照顾者之间传递八次。","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2489,925,477],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-5-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child&#39;s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 alloparents a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-1\">\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half / of a child&#39;s care.\u003c/p>\n\u003cp>One previous study / looked at / the Efé people / of the Democratic Republic of Congo.\u003c/p>\n\u003cp>It found that / infants had / an average of 14 alloparents a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-2\">\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>相比之下，/ 在狩猎采集社会中 / 父母以外的成年人 / 可以提供 / 几乎一半 / 孩子的照顾。\u003c/p>\n\u003cp>一项先前的研究 / 观察了 / 埃费人 / 刚果民主共和国的。\u003c/p>\n\u003cp>它发现 / 婴儿有 / 平均每天14个异亲父母 / 到他们18周大时 / 并在照顾者之间传递 / 每小时八次。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-3\">\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>相比之下，在狩猎采集社会中，父母以外的成年人可以提供几乎一半的儿童照顾。一项关于刚果民主共和国埃费人的研究发现，婴儿到18周大时平均每天有14个异亲父母，并且每小时在照顾者之间传递八次。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 完整原文 · 第6段\n\nChaudhary said that parents now had less childcare support from family and social networks than during most of humans' evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a \"knock-on\" benefit to a child's wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3128,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-6-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 意群划分 · 第6段\n\nChaudhary said that / parents now had / less childcare support / from family and social networks / than during most of humans' evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have / a \"knock-on\" benefit / to a child's wellbeing.\n\nAn infant / born to a hunter-gatherer society / could have / 少压力和母亲抑郁，/ 这可能有 / 一个\"连锁\"好处 / 对孩子的福祉。\n\n一个婴儿 / 出生在狩猎采集社会 / 可能有 / 超过十个照顾者— / 这形成鲜明对比 / 与英国的托儿所环境 / 那里的规定要求 / 一个照顾者的比例 / 对四个孩子 / 两到三岁的。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3128,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-6-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that / parents now had / less childcare support / from family and social networks / than during most of humans&#39; evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have / a &quot;knock-on&quot; benefit / to a child&#39;s wellbeing.\u003c/p>\n\u003cp>An infant / born to a hunter-gatherer society / could have / more than ten caregivers— / this contrasts starkly / to nursery settings in the UK / where regulations call for / a ratio of one carer / to four children / aged two to three.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-2\">\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>乔杜里说 / 父母现在有 / 更少的育儿支持 / 来自家庭和社会网络 / 比人类进化史的大部分时间，/ 但引入额外的照顾者 / 可以减少压力和母亲抑郁，/ 这可能有 / 一个&quot;连锁&quot;好处 / 对孩子的福祉。\u003c/p>\n\u003cp>一个婴儿 / 出生在狩猎采集社会 / 可能有 / 超过十个照顾者— / 这形成鲜明对比 / 与英国的托儿所环境 / 那里的规定要求 / 一个照顾者的比例 / 对四个孩子 / 两到三岁的。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 标准译文 · 第6段\n\n乔杜里说，与人类进化史的大部分时间相比，现在的父母从家庭和社会网络获得的育儿支持更少，但引入额外的照顾者可以减少压力和母亲抑郁，这可能对孩子的福祉产生\"连锁\"好处。在狩猎采集社会中出生的婴儿可能有超过十个照顾者——这与英国托儿所的情况形成鲜明对比，那里的规定要求一个照顾者照顾四个两到三岁的孩子。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3128,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-6-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that / parents now had / less childcare support / from family and social networks / than during most of humans&#39; evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have / a &quot;knock-on&quot; benefit / to a child&#39;s wellbeing.\u003c/p>\n\u003cp>An infant / born to a hunter-gatherer society / could have / more than ten caregivers— / this contrasts starkly / to nursery settings in the UK / where regulations call for / a ratio of one carer / to four children / aged two to three.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-2\">\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>乔杜里说 / 父母现在有 / 更少的育儿支持 / 来自家庭和社会网络 / 比人类进化史的大部分时间，/ 但引入额外的照顾者 / 可以减少压力和母亲抑郁，/ 这可能有 / 一个&quot;连锁&quot;好处 / 对孩子的福祉。\u003c/p>\n\u003cp>一个婴儿 / 出生在狩猎采集社会 / 可能有 / 超过十个照顾者— / 这形成鲜明对比 / 与英国的托儿所环境 / 那里的规定要求 / 一个照顾者的比例 / 对四个孩子 / 两到三岁的。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-3\">\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>乔杜里说，与人类进化史的大部分时间相比，现在的父母从家庭和社会网络获得的育儿支持更少，但引入额外的照顾者可以减少压力和母亲抑郁，这可能对孩子的福祉产生&quot;连锁&quot;好处。在狩猎采集社会中出生的婴儿可能有超过十个照顾者——这与英国托儿所的情况形成鲜明对比，那里的规定要求一个照顾者照顾四个两到三岁的孩子。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第7段","level":3,"raw":"### 完整原文 · 第7段\n\nWhile hunter-gatherer children learnt from observation and imitation in mixed-age playgroups, researchers said that western \"instructive teaching\", where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder. Chaudhary said that Britain should explore the possibility that older siblings helping their parents \"might also enhance their own social development\".","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[85,3816,925,580],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-7-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-7-0\">\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>While hunter-gatherer children learnt from observation and imitation in mixed-age playgroups, researchers said that western &quot;instructive teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder. Chaudhary said that Britain should explore the possibility that older siblings hel heir parents → &quot;might also enhance → their own social development&quot;).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n育儿技巧：(从非洲狩猎采集者那里获得的) → 可能是关键：(养育 → 更满足的孩子) → 研究人员建议道。\n\n这个想法基于 → 对社区的研究：(比如博茨瓦纳的昆族)：(在那里每个孩子 → 被照顾 → 由许多成年人)。\n\n昆族儿童：(年仅四岁的) → 会帮助照顾 → 更小的孩子 + \"婴儿背带\"：(即婴儿被背带携带) → 被认为是常态。\n\n### 第2段\n\n根据尼基尔·乔杜里博士：(一位进化人类学家：(在剑桥大学)) → 这些做法：(被称为异亲养育) → 可能导致 → 更少的焦虑：(对孩子和父母来说)。\n\n### 第3段\n\n安妮·斯瓦内普尔博士：(一位儿童精神科医生) → 相信 → 有方法：(将它们融入 → 西方生活)。\n\n在德国 → 一个计划 → 已经配对了 → 一个养老院 → 与一个托儿所。\n\n居民们 → 帮助照顾 → 孩子们 → 一种安排：(类似于异亲养育)。\n\n另一个措施 → 可能是鼓励友谊：(在儿童之间：(不同学年的)) → 来反映 → 无人监督的混龄游戏小组：(在狩猎采集社区中)。\n\n### 第4段\n\n在一篇论文中：(发表在《儿童心理学与精神病学杂志》上) → 研究人员说 → 西方核心家庭 → 是一个近代发明：(打破了 → 进化历史)。\n\n这种突然转变：(到\"密集母亲叙事\"：(它暗示 → 母亲应该独自管理育儿)) → 可能是有害的。\n\n\"这样的叙事 → 可能导致 → 母亲疲惫 + 有危险的后果\" → 他们写道。\n\n### 第5段\n\n相比之下 // 在狩猎采集社会中 → 父母以外的成年人 → 可以提供 → 几乎一半：(孩子的照顾)。\n\n一项先前的研究 → 观察了 → 埃费人：(刚果民主共和国的)。\n\n它发现 → 婴儿有 → 平均每天14个异亲父母：(到他们18周大时) + 在照顾者之间传递 → 每小时八次。\n\n### 第6段\n\n乔杜里说 → 父母现在有 → 更少的育儿支持：(来自家庭和社会网络)：(比人类进化史的大部分时间) // 但引入额外的照顾者 → 可以减少压力和母亲抑郁：(这可能有 → 一个\"连锁\"好处：(对孩子的福祉))。\n\n一个婴儿：(出生在狩猎采集社会) → 可能有 → 超过十个照顾者— // 这形成鲜明对比 → 与英国的托儿所环境：(那里的规定要求 → 一个照顾者的比例 → 对四个孩子：(两到三岁的))。\n\n### 第7段\n\n当狩猎采集者的孩子 → 通过观察和模仿学习：(在混龄游戏小组中) // 研究人员说 → 西方\"教导式教学\"：(学生被要求坐着不动) → 可能导致 → 病症：(比如注意缺陷多动障碍)。\n\n乔杜里说 → 英国应该探索 → 这种可能性：(年长的兄弟姐妹帮助他们的父母 → \"也可能增强 → 他们自己的社会发展\")。","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>育儿技巧：(从非洲狩猎采集者那里获得的) → 可能是关键：(养育 → 更满足的孩子) → 研究人员建议道。\u003c/p>\n\u003cp>这个想法基于 → 对社区的研究：(比如博茨瓦纳的昆族)：(在那里每个孩子 → 被照顾 → 由许多成年人)。\u003c/p>\n\u003cp>昆族儿童：(年仅四岁的) → 会帮助照顾 → 更小的孩子 + &quot;婴儿背带&quot;：(即婴儿被背带携带) → 被认为是常态。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>根据尼基尔·乔杜里博士：(一位进化人类学家：(在剑桥大学)) → 这些做法：(被称为异亲养育) → 可能导致 → 更少的焦虑：(对孩子和父母来说)。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>安妮·斯瓦内普尔博士：(一位 陷多动障碍等情况。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>instructive teaching按文中与观察模仿相对的用法译为“指令式教学”。sit still是安坐不动，不是坐得稳定。\u003c/p>\n\u003cp>may contribute to只能译为“可能促成、可能是影响因素”，不可强化成已证明的直接病因；such as表明ADHD只是举例。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>狩猎采集者的孩子在混龄游戏小组中通过观察和模仿学习，而研究人员指出，西方要求学生坐着不动的&quot;教导式教学&quot;可能导致注意缺陷多动障碍等病症。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"30题 · 题干、题型与核心出处","level":2,"raw":"## 30题\n\n**Which of the following would be the best title for the text?**\n\n下面哪一项最适合作为全文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Instructive teaching: a dilemma for anxious parents**\n\n指令式教学：焦虑父母的一个难题\n\nB. **For a happier family, learn from the hunter-gatherers**\n\n为了更幸福的家庭，向狩猎采集者学习\n\nC. **Mixed-age playgroup, a better choice for lonely children**\n\n混龄玩耍小组：孤独孩子更好的选择\n\nD. **Tracing the history of parenting: from Africa to Europe**\n\n追溯育儿历史：从非洲到欧洲\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。 | 先说别处的做法可能值得学 |\n| 第2段 | 说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。 | 再说这样做可能带来好处 |\n| 第3段 | 提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。 | 再说可以用哪些办法来学 |\n| 第4段 | 指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 对照狩猎采集者群体由父母以外的人分担大量照料，并给出Efé的情况。 | 再说别处是怎样做的 |\n| 第6段 | 说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 将借鉴延伸到混龄学习与帮助父母可能带来的社会发展，建议英国探索。 | 最后说还可以试着改变什么 |","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"30","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项最适合作为全文标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Instructive teaching: a dilemma for anxious parents\u003c/strong>\u003c/p>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003cp>B. \u003cstrong>For a happier family, learn from the hunter-gatherers\u003c/strong>\u003c/p>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003cp>C. \u003cstrong>Mixed-age playgroup, a better choice for lonely children\u003c/strong>\u003c/p>\n\u003cp>混龄玩耍小组：孤独孩子更好的选择\u003c/p>\n\u003cp>D. \u003cstrong>Tracing the history of parenting: from Africa to Europe\u003c/strong>\u003c/p>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>对照狩猎采集者群体由父母以外的人分担大量照料，并给出Efé的情况。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>将借鉴延伸到混龄学习与帮助父母可能带来的社会发展，建议英国探索。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Instructive teaching: a dilemma for anxious parents","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. Instructive teaching: a dilemma for anxious parents\n\n指令式教学：焦虑父母的一个难题","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Instructive teaching: a dilemma for anxious parents","level":3,"raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n指令式教学：焦虑父母的一个难题\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从另一社会的观察式学习提出启示，说明焦虑父母可能需要重新考虑指令式教学。 | 先说别处的做法可能值得学 |\n| 第2段 | 解释减少连续指令和强制静坐可能给家庭与儿童带来的好处。 | 再说这样做可能带来好处 |\n| 第3段 | 列出在西方课堂与家庭中减少直接命令、增加自主观察的可行办法。 | 再说可以用哪些办法来学 |\n| 第4段 | 回头分析成人把每一步学习都交由自己指挥的观念为何增加压力。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 展示狩猎采集者儿童通过同伴活动、模仿和尝试完成学习的日常。 | 再说别处是怎样做的 |\n| 第6段 | 比较两种教学安排给家长和儿童的负担，指出现有教学实践与替代方式的差距。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 提出父母如何在指导与自主之间试验平衡，回应不指导又担心学不会的困境。 | 最后说还可以试着改变什么 |\n\nA抓住了最后一段的teaching，也抓住前面的anxiety，但全文多数段落在写谁照顾孩子：很多成年人、老人帮忙、母亲单独负责、照料者人数。它们并不是围绕课堂指令式教学安排的。德国把养老院和托儿所配对，也是让老人参与照料，没有介绍如何改课堂讲授。把最后一段的一种教学问题升成总标题，会让前六段反复讨论共同照料显得偏离中心。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-A-1\">\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从另一社会的观察式学习提出启示，说明焦虑父母可能需要重新考虑指令式教学。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释减少连续指令和强制静坐可能给家庭与儿童带来的好处。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列出在西方课堂与家庭中减少直接命令、增加自主观察的可行办法。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回头分析成人把每一步学习都交由自己指挥的观念为何增加压力。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>展示狩猎采集者儿童通过同伴活动、模仿和尝试完成学习的日常。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较两种教学安排给家长和儿童的负担，指出现有教学实践与替代方式的差距。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>提出父母如何在指导与自主之间试验平衡，回应不指导又担心学不会的困境。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A抓住了最后一段的teaching，也抓住前面的anxiety，但全文多数段落在写谁照顾孩子：很多成年人、老人帮忙、母亲单独负责、照料者人数。它们并不是围绕课堂指令式教学安排的。德国把养老院和托儿所配对，也是让老人参与照料，没有介绍如何改课堂讲授。把最后一段的一种教学问题升成总标题，会让前六段反复讨论共同照料显得偏离中心。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. For a happier family, learn from the hunter-gatherers","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### B. For a happier family, learn from the hunter-gatherers\n\n为了更幸福的家庭，向狩猎采集者学习","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. For a happier family, learn from the hunter-gatherers","level":3,"raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n为了更幸福的家庭，向狩猎采集者学习\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从狩猎采集群体多人照顾孩子的做法出发，提出它可能有助于家庭幸福。 | 先说别处的做法可能值得学 |\n| 第2段 | 命名共同育儿，并说明儿童与父母可能因更多支持而减轻焦虑。 | 再说这样做可能带来好处 |\n| 第3段 | 用老人参与照料、跨年级交往等例子说明在西方社会如何借鉴。 | 再说可以用哪些办法来学 |\n| 第4段 | 回头批评母亲独自承担育儿的近期叙事，解释它与长期支持网络的脱离。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 呈现其他成人大量分担照料的生活事实，给替代安排提供具体参照。 | 再说别处是怎样做的 |\n| 第6段 | 解释增加照料者对家庭的潜在好处，并指出英国现行照料配比的差距。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 将借鉴延伸到混龄学习与年长孩子参与，提出可继续探索的改变。 | 最后说还可以试着改变什么 |\n\nB的learn from准确解释了全文为何从非洲群体讲到德国和英国：作者不是只介绍遥远风俗，而是在讨论可以怎样借鉴。happier family又能接上第2段less anxiety、第4段对有害负担的批评，以及第6段减少压力和母亲抑郁的好处。最后的社会发展也属于孩子与家庭可能得到的益处。标题没有把学习缩成一种课堂形式，也没有声称现代家庭必须原样复制所有做法。\n\n判断：\n\n**B 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-B-1\">\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从狩猎采集群体多人照顾孩子的做法出发，提出它可能有助于家庭幸福。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>命名共同育儿，并说明儿童与父母可能因更多支持而减轻焦虑。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>用老人参与照料、跨年级交往等例子说明在西方社会如何借鉴。\u003c/td>\n\u003ctd>再说可以用哪些办法来学 。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较西方儿童现有玩伴资源与混龄群体，说明改进交往机会的收益和差距。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>提出进一步试行混龄小组的安排，并考察年长孩子自身的社会发展。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C确实用了mixed-age playgroup，能对应第3段后半和最后一段，却把范围限定为lonely children。全文没有围绕孤独儿童展开，反复出现的另一类受益者是父母。老人参与照料、母亲独自承担育儿的疲惫、托儿所人手比例，都不能只用孩子加入玩耍小组来解释。减少焦虑也不等于专门缓解孤独，标题把问题与对象都缩窄了。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Tracing the history of parenting: from Africa to Europe","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### D. Tracing the history of parenting: from Africa to Europe\n\n追溯育儿历史：从非洲到欧洲","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Tracing the history of parenting: from Africa to Europe","level":3,"raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n追溯育儿历史：从非洲到欧洲\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从非洲育儿方式提出值得追踪的历史线索，说明其可能帮助理解欧洲育儿实践。 | 先说别处的做法可能值得学 |\n| 第2段 | 概括这种做法在早期社区中承担的社会功能，为传播叙述建立起点。 | 再说这样做可能带来好处 |\n| 第3段 | 说明后来的移民、机构或观念交流怎样将非洲照料方式带入欧洲。 | 再说可以用哪些办法来学 |\n| 第4段 | 回顾欧洲原有的家庭安排及其不足，解释外来做法进入时遇到的背景。 | 回头解释原来的办法哪里不好 |\n| 第5段 | 返回非洲，详述相应做法在原生社会中的组织形式及早期记录。 | 再说别处是怎样做的 |\n| 第6段 | 比较传播前后的变化、收益和欧洲现存实践与非洲源头的差异。 | 再说改变的好处和眼前的差距 |\n| 第7段 | 追踪近来的混龄学习等新一轮变体，说明这一历史传播还在怎样延续。 | 最后说还可以试着改变什么 |\n\nD能对应非洲、德国、英国和evolutionary history这些词，但它要求文章按历史传播过程组织。实际段落在问现在可以怎么做：第3段说融入西方的办法，第6段比较当下配比，第7段建议英国探索。文中没有写非洲育儿方式何时传到欧洲、经历了哪些阶段。演化历史在第4段只是用来解释让母亲单独承担为何是一种近期偏离，不是整篇历史叙述。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-D-1\">\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从非洲育儿方式提出值得追踪的历史线索，说明其可能帮助理解欧洲育儿实践。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>概括这种做法在早期社区中承担的社会功能，为传播叙述建立起点。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明后来的移民、机构或观念交流怎样将非洲照料方式带入欧洲。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾欧洲原有的家庭安排及其不足，解释外来做法进入时遇到的背景。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>返回非洲，详述相应做法在原生社会中的组织形式及早期记录。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较传播前后的变化、收益和欧洲现存实践与非洲源头的差异。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>追踪近来的混龄学习等新一轮变体，说明这一历史传播还在怎样延续。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D能对应非洲、德国、英国和evolutionary history这些词，但它要求文章按历史传播过程组织。实际段落在问现在可以怎么做：第3段说融入西方的办法，第6段比较当下配比，第7段建议英国探索。文中没有写非洲育儿方式何时传到欧洲、经历了哪些阶段。演化历史在第4段只是用来解释让母亲单独承担为何是一种近期偏离，不是整篇历史叙述。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"30题结论","level":2,"raw":"### 30题结论\n\n**30. B. For a happier family, learn from the hunter-gatherers**\n\n这句话就是本文后续做题的主旨底牌：\n\n**For a happier family, learn from the hunter-gatherers / 为了更幸福的家庭，向狩猎采集者学习**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"30","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>30. B. For a happier family, learn from the hunter-gatherers\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>For a happier family, learn from the hunter-gatherers / 为了更幸福的家庭，向狩猎采集者学习\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"26题 · 题干、题型与核心出处","level":2,"raw":"## 26题\n\n> According to the first two paragraphs, alloparenting refers to the practice of ______.  \n> 根据前两段，alloparenting指什么做法？\n\n### 题型\n\n概念定义题。题干要求判断“根据前两段，alloparenting指什么做法？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and \"baby-wearing\", in which infants are carried in slings, is considered the norm.\n>\n> According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.\n\n首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,524],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"26","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to the first two paragraphs, alloparenting refers to the practice of ______.\u003cbr>根据前两段，alloparenting指什么做法？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>概念定义题。题干要求判断“根据前两段，alloparenting指什么做法？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003cp>According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. sharing childcare among community members","level":3,"raw":"### A. sharing childcare among community members\n\n> 社区成员共同分担育儿\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。\n\n**选项类型：正确同义改写。**\n\n原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。\n\n很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\n\n**出处：**\n\n> The idea is based on l":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> For a happier family, learn from the hunter-gatherers  \n> 为了更幸福的家庭，向狩猎采集者学习\n\n把这个主旨直接代入26题题干：\n\n> 全文主旨只能确认可以借鉴狩猎采集者来改善家庭生活，不能单凭标题定义具体照料方式；须看首两段中究竟由谁参与、怎样分担。\n\nA实际说的是：\n\n> sharing childcare among community members  \n> 社区成员共同分担育儿\n\n很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\n\n从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\n\n本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\n\n**复盘判断：A正确。**","context":{"mode":"image","asset":"questions","focus":[250,422,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"26","option":"A"},"focusId":"focus-q26-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>社区成员共同分担育儿\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。\u003c/p>\n\u003cp>很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>all /p>\n\u003c/blockquote>\n\u003cp>很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. assigning babies to specific adult caregivers","level":3,"raw":"### B. assigning babies to specific adult caregivers\n\n> 把婴儿分配给特定的成年照料者\n\n**做题模式中的状态：** 第一轮B保留。当时选项呈现为“[xxx] babies to specific adult caregivers”，保留了相应遮挡。当时的定位线索是：B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。读完全文后，做题模式再经交叉验证排除B，最终选择A。\n\n**错误类型：第一类——歪曲原意。**\n\nassigning表示“分派”，B强调将婴儿交由特定的成年照料者。specific不必机械理解成只有一个人；问题在于原文并没有介绍指定人选的分派规则，而是用many adults和年长孩子帮忙说明照料由多人分担。\n\n给孩子安排照料者与社区共同育儿不是同一个定义：前者可能仍是固定人选独立负责，后者强调父母以外多人的参与。B还把参与者限定为成年人，不能涵盖首段明确写出的较大孩子。A直接概括全部例子的共同特征。\n\n**命题人借用的原文材料：**\n\n> The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.","context":{"mode":"image","asset":"questions","focus":[250,508,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"B"},"focusId":"focus-q26-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-B-0\">\u003cblockquote>\n\u003cp>把婴儿分配给特定的成年照料者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“[xxx] babies to specific adult caregivers”，保留了相应遮挡。当时的定位线索是：B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。读完全文后，做题模式再经交叉验证排除B，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>assigning表示“分派”，B强调将婴儿交由特定的成年照料者。specific不必机械理解成只有一个人；问题在于原文并没有介绍指定人选的分派规则，而是用many adults和年长孩子帮忙说明照料由多人分担。\u003 的较大孩子。A直接概括全部例子的共同特征。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. teaching parenting skills to older children","level":3,"raw":"### C. teaching parenting skills to older children\n\n> 向较大的孩子教授育儿技能\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。\n\n原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。\n\n**命题人借用的原文材料：**\n\n> Kung children as young as four will help to look after younger ones and \"baby-wearing\", in which infants are carried in slings, is considered the norm.","context":{"mode":"image","asset":"questions","focus":[250,592,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"C"},"focusId":"focus-q26-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-C-0\">\u003cblockquote>\n\u003cp>向较大的孩子教授育儿技能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。\u003c/p>\n\u003cp>原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。\u003c/p>\n\ 多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Alloparenting consists of parents carrying their own infants around.\u003c/p>\n\u003cp>共同育儿就是父母抱着自己的婴儿活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文babies are held by many people的照料者是多人，父母单独抱娃不足以解释allo这一共同分担特征。选项保留抱的动作，却把主体收窄回父母。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认可以借鉴狩猎采集者来改善家庭生活，不能单凭标题定义具体照料方式；须看首两段中究竟由谁参与、怎样分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>carrying infants around by their parents\u003cbr>由婴儿的父母抱着他们四处走动\u003c/p>\n\u003c/blockquote>\n\u003cp>父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"26题结论","level":2,"raw":"### 26题结论\n\n> **26. A. sharing childcare among community members**\n\nA：其他成人及较大孩子共同参与，支持社区成员分担育儿的定义。\n\nB：原文没有指定成人分派婴儿的规则，而且参与者不只成年人。\n\nC：较大孩子实际帮忙，不是成人开设育儿技能课程。\n\nD：由多人照料不能缩成只有父母抱着自己的婴儿。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,524],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"26","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>26. A. sharing childcare among community members\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：其他成人及较大孩子共同参与，支持社区成员分担育儿的定义。\u003c/p>\n\u003cp>B：原文没有指定成人分派婴儿的规则，而且参与者不只成年人。\u003c/p>\n\u003cp>C：较大孩子实际帮忙，不是成人开设育儿技能课程。\u003c/p>\n\u003cp>D：由多人照料不能缩成只有父母抱着自己的婴儿。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"27题 · 题干、题型与核心出处","level":2,"raw":"## 27题\n\n> The scheme in Germany is mentioned to illustrate ______.  \n> 文中提到德国的这项计划，是为了说明什么？\n\n### 题型\n\n实践例子作用题。题干要求判断“文中提到德国的这项计划，是为了说明什么？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people's home with a nursery. The residents help to look after the children, an arrangement akin to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the unsupervised mixed-age playgroups in hunter-gatherer communities.\n\n段首先提出把alloparenting融入西方生活，随后列老人院与托儿所相连、老人参与照料的德国方案，再补跨年级友谊与混龄玩耍建议。","context":{"mode":"image","asset":"questions","focus":[250,838,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"27","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The scheme in Germany is mentioned to illustrate ______.\u003cbr>文中提到德国的这项计划，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>实践例子作用题。题干要求判断“文中提到德国的这项计划，是为了说明什么？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people&#39;s home with a nursery. The residents help to look after the children, an arrangement akin to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the unsupervised mixed-age playgroups in hunter-gatherer communities.\u003c/p>\n\u003c/blockquote>\n\u003cp>段首先提出把alloparenting融入西方生活， hat has traditionally prevailed in the West.\n>\n> 德国方案代表西方传统上占主导的育儿方式。\n\n原文在提出可作的改变，后文又批评西方核心家庭的孤立照料。把创新借鉴写成传统常态，改动了方案相对于既有制度的位置。","context":{"mode":"image","asset":"questions","focus":[250,1102,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"27","option":"C"},"focusId":"focus-q27-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-C-0\">\u003cblockquote>\n\u003cp>西方文化中传统的育儿方式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方式。一个用来展示“怎样引入”的计划，不能被换成“已经沿用的传统”；两边对德国安排的新旧身份说得不同。\u003c/p>\n\u003cp>incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q27-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>德国的做法被用来说明西方文化中传统的育儿方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。\u003c/p>\n\u003cp>原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方 ockquote>\n\u003cp>The German case is used mainly to catalogue differences between European and African living arrangements.\u003c/p>\n\u003cp>德国案例主要用于列举欧洲与非洲的生活差异。\u003c/p>\n\u003c/blockquote>\n\u003cp>若重在比较差异，应逐项对照两地如何不同。该段先倡议整合，再列具体办法，论证任务是怎样学习，而不是停在描述差异。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the differences between western and African ways of living","level":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> For a happier family, learn from the hunter-gatherers  \n> 为了更幸福的家庭，向狩猎采集者学习\n\n把这个主旨直接代入27题题干：\n\n> 全文主旨倡导借鉴狩猎采集者，德国例子应说明这种借鉴怎样进入西方生活；具体借鉴的是照料、交流还是其他安排，仍要由例子前后明确。\n\n但D实际说的是：\n\n> the differences between western and African ways of living  \n> 西方与非洲生活方式的差异\n\n作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\n\n从全文推进看，这一处的作用是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\n\n本项最终仍要根据“incorporate them into western life”这处局部原文判断。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,1188,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"27","option":"D"},"focusId":"focus-q27-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-D-0\">\u003cblockquote>\n\u003cp>西方与非洲生活方式的差异\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文先提出 incorporate them into western life，德国例子接着给出如何实现：老人也帮忙照顾孩子。这样写是在展示两种环境中可以采用相近的多人照料办法。D的 differences 却要求作者用德国说明两边不能相同或怎样不同，而且 ways of living 的范围扩大到了生活方式整体。这个例子具体讲照料孩子的办法可以引入，没有列两地相对的生活习惯来完成差异比较。\u003c/p>\n\u003cp>作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are 03c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨倡导借鉴狩猎采集者，德国例子应说明这种借鉴怎样进入西方生活；具体借鉴的是照料、交流还是其他安排，仍要由例子前后明确。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the differences between western and African ways of living\u003cbr>西方与非洲生活方式的差异\u003c/p>\n\u003c/blockquote>\n\u003cp>作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/p>\n\u003cp>本项最终仍要根据“incorporate them into western life”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"27题结论","level":2,"raw":"### 27题结论\n\n> **27. B. an approach to integrating alloparenting into western society**\n\nA：跨代接触是细节，作者用例子说明的是共同照料如何融入西方。\n\nB：老人参与照料具体落实了总领句提出的融入西方生活。\n\nC：借鉴的新方案不能被写成西方一直沿用的传统常态。\n\nD：此段提出怎样借鉴，不是为列举非洲与西方差异而举例。","context":{"mode":"image","asset":"questions","focus":[250,838,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"27","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>27. B. an approach to integrating alloparenting into western society\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：跨代接触是细节，作者用例子说明的是共同照料如何融入西方。\u003c/p>\n\u003cp>B：老人参与照料具体落实了总领句提出的融入西方生活。\u003c/p>\n\u003cp>C：借鉴的新方案不能被写成西方一直沿用的传统常态。\u003c/p>\n\u003cp>D：此段提出怎样借鉴，不是为列举非洲与西方差异而举例。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"28题 · 题干、题型与核心出处","level":2,"raw":"## 28题\n\n> According to Paragraph 4, the “intensive mothering narrative” ______.  \n> 根据第4段，“密集母职叙述”有什么特点或后果？\n\n### 题型\n\n观点细节题。题干要求判断“根据第4段，“密集母职叙述”有什么特点或后果？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history. This abrupt shift to an \"intensive mothering narrative\", which suggests that mothers should manage childcare alone, was likely to have been harmful. \"Such narratives can lead to maternal exhaustion and have dangerous consequences,\" they wrote.\n\n研究者称西方核心家庭是近期发明，与演化历史断开；要求母亲独力负责育儿的叙事可能有害，会使她们筋疲力尽。","context":{"mode":"image","asset":"questions","focus":[250,1348,1800,439],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 2题目"},"meta":{"question":"28","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Paragraph 4, the “intensive mothering narrative” ______.\u003cbr>根据第4段，“密集母职叙述”有什么特点或后果？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>观点细节题。题干要求判断“根据第4段，“密集母职叙述”有什么特点或后果？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history. This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful. &quot;Such narratives can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.\u003c/p>\n\u003c/blockquote>\n\u003cp>研究者称西方核心家庭是近期发明，与演化历史断开；要求母亲独力负责育儿的叙事可能有害，会使她们筋疲力尽。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. alleviates parenting pressures","level":3,"raw":"### A. alleviates parenting pressures\n\n> 缓解育儿压力\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 was likely to have been harmful 判断这种转变很可能有害，随后写 exhaustion 和 dangerous consequences，方向是母亲可能更疲惫、后果危险。A的 alleviates parenting pressures 却说压力得到减轻。虽然 exhaustion 前的程度或性质没有读清，疲惫这个名词和有害的判断仍在，不能把这种负担加重的后果改写成压力缓解。\n\n原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。\n\n**命
