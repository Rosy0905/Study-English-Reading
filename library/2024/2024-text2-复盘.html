hr.形成鲜明对比\u003c/td>\n\u003ctd>nursery setting\u003c/td>\n\u003ctd>n.托儿所环境\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>regulation\u003c/td>\n\u003ctd>n.规定\u003c/td>\n\u003ctd>call for\u003c/td>\n\u003ctd>phr.要求\u003c/td>\n\u003ctd>ratio\u003c/td>\n\u003ctd>n.比例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>carer\u003c/td>\n\u003ctd>n.照料者\u003c/td>\n\u003ctd>aged two to three\u003c/td>\n\u003ctd>phr.年龄在两至三岁的\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第7段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>learn\u003c/td>\n\u003ctd>v.学习\u003c/td>\n\u003ctd>observation\u003c/td>\n\u003ctd>n.观察\u003c/td>\n\u003ctd>imitation\u003c/td>\n\u003ctd>n.模仿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mixed-age playgroup\u003c/td>\n\u003ctd>n.混龄游戏小组\u003c/td>\n\u003ctd>instructive teaching\u003c/td>\n\u003ctd>n.指令式教学\u003c/td>\n\u003ctd>pupil\u003c/td>\n\u003ctd>n.学生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sit still\u003c/td>\n\u003ctd>phr.坐着不动\u003c/td>\n\u003ctd>contribute to\u003c/td>\n\u003ctd>phr.促成；导致\u003c/td>\n\u003ctd>condition\u003c/td>\n\u003ctd>n.状况；疾病\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attention deficit hyperactivity disorder\u003c/td>\n\u003ctd>n.注意缺陷多动障碍\u003c/td>\n\u003ctd>explore\u003c/td>\n\u003ctd>v.探索\u003c/td>\n\u003ctd>possibility\u003c/td>\n\u003ctd>n.可能性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>older sibling\u003c/td>\n\u003ctd>n.年长的兄弟姐妹\u003c/td>\n\u003ctd>enhance\u003c/td>\n\u003ctd>v.促进；增强\u003c/td>\n\u003ctd>social development\u003c/td>\n\u003ctd>n.社会性发展\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Parenting tips / obtained from hunter-gatherers in Africa / may be the key / to bringing up / more contented children, / researchers have suggested.\u003c/p>\n\u003cp>The idea is based on / studies of communities / such as the Kung of Botswana, / where each child / is cared for / by many adults.\u003c/p>\n\u003cp>Kung children / as young as four / will help to look after / younger ones / and &quot;baby-wearing&quot;, / in which infants are carried in slings, / is considered the norm.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>育儿技巧 / 从非洲狩猎采集者那里获得的 / 可能是关键 / 养育 / 更满足的孩子，/ 研究人员建议道。\u003c/p>\n\u003cp>这个想法基于 / 对社区的研究 / 比如博茨瓦纳的昆族，/ 在那里每个孩子 / 被照顾 / 由许多成年人。\u003c/p>\n\u003cp>昆族儿童 / 年仅四岁的 / 会帮助照顾 / 更小的孩子 / 而&quot;婴儿背带&quot;，/ 即婴儿被背带携带，/ 被认为是常态。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>研究人员建议，从非洲狩猎采集者那里学到的育儿技巧可能是养育更满足孩子的关键。这个想法基于对博茨瓦纳昆族等社区的研究，在那里每个孩子都由许多成年人照顾。年仅四岁的昆族儿童就会帮助照顾更小的孩子，而用背带携带婴儿的&quot;婴儿背带&quot;方式被认为是常态。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>According to Dr Nikhil Chaudhary, / an evolutionary anthropologist / at Cambridge University, / these practices, / known as alloparenting, / could lead to / less anxiety / for children and parents.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>根据尼基尔·乔杜里博士，/ 一位进化人类学家 / 在剑桥大学，/ 这些做法，/ 被称为异亲养育，/ 可能导致 / 更少的焦虑 / 对孩子和父母来说。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>剑桥大学的进化人类学家尼基尔·乔杜里博士认为，这些被称为&quot;异亲养育&quot;的做法可能会减少孩子和父母的焦虑。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people&#39;s home with a nursery. The residents help to look after the children, an arrangement akin to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the unsupervised mixed-age playgroups in hunter-gatherer communities.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Dr Annie Swanepoel, / a child psychiatrist, / believes that / there are ways / to incorporate them / into western life.\u003c/p>\n\u003cp>In Germany, / one scheme / has paired / an old people&#39;s home / with a nursery.\u003c/p>\n\u003cp>The residents / help to look after / the children, / an arrangement / akin to alloparenting.\u003c/p>\n\u003cp>Another measure / could be encouraging friendships / between children / in different school years / to mirror / the unsupervised mixed-age playgroups / in hunter-gatherer communities.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>安妮·斯瓦内普尔博士，/ 一位儿童精神科医生，/ 相信 / 有方法 / 将它们融入 / 西方生活。\u003c/p>\n\u003cp>在德国，/ 一个计划 / 已经配对了 / 一个养老院 / 与一个托儿所。\u003c/p>\n\u003cp>居民们 / 帮助照顾 / 孩子们，/ 一种安排 / 类似于异亲养育。\u003c/p>\n\u003cp>另一个措施 / 可能是鼓励友谊 / 在儿童之间 / 不同学年的 / 来反映 / 无人监督的混龄游戏小组 / 在狩猎采集社区中。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>儿童精神科医生安妮·斯瓦内普尔博士相信，有方法将这些做法融入西方生活。在德国，有一个计划将养老院与托儿所配对。养老院的居民帮助照顾孩子，这种安排类似于异亲养育。另一个措施可能是鼓励不同学年儿童之间的友谊，以反映狩猎采集社区中无人监督的混龄游戏小组。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history. This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful. &quot;Such narratives can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>In a paper / published in the Journal of Child Psychology and Psychiatry, / researchers said that / the western nuclear family / was a recent invention / which broke with / evolutionary history.\u003c/p>\n\u003cp>This abrupt shift / to an &quot;intensive mothering narrative&quot;, / which suggests that / mothers should manage childcare alone, / was likely to have been harmful.\u003c/p>\n\u003cp>&quot;Such narratives / can lead to / maternal exhaustion / and have dangerous consequences,&quot; / they wrote.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>在一篇论文中 / 发表在《儿童心理学与精神病学杂志》上，/ 研究人员说 / 西方核心家庭 / 是一个近代发明 / 打破了 / 进化历史。\u003c/p>\n\u003cp>这种突然转变 / 到&quot;密集母亲叙事&quot;，/ 它暗示 / 母亲应该独自管理育儿，/ 可能是有害的。\u003c/p>\n\u003cp>&quot;这样的叙事 / 可能导致 / 母亲疲惫 / 并有危险的后果，&quot; / 他们写道。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>在《儿童心理学与精神病学杂志》上发表的一篇论文中，研究人员指出，西方核心家庭是一个打破进化历史的近代发明。这种突然转变到&quot;密集母亲叙事&quot;——暗示母亲应该独自管理育儿——可能是有害的。他们写道：&quot;这样的叙事可能导致母亲疲惫并产生危险的后果。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>By contrast, in hunter-gatherer societies adults other than the parents can provide almost half of a child&#39;s care. One previous study looked at the Efé people of the Democratic Republic of Congo. It found that infants had an average of 14 alloparents a day by the time they were 18 weeks old and were passed between caregivers eight times an hour.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>By contrast, / in hunter-gatherer societies / adults other than the parents / can provide / almost half / of a child&#39;s care.\u003c/p>\n\u003cp>One previous study / looked at / the Efé people / of the Democratic Republic of Congo.\u003c/p>\n\u003cp>It found that / infants had / an average of 14 alloparents a day / by the time they were 18 weeks old / and were passed between caregivers / eight times an hour.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>相比之下，/ 在狩猎采集社会中 / 父母以外的成年人 / 可以提供 / 几乎一半 / 孩子的照顾。\u003c/p>\n\u003cp>一项先前的研究 / 观察了 / 埃费人 / 刚果民主共和国的。\u003c/p>\n\u003cp>它发现 / 婴儿有 / 平均每天14个异亲父母 / 到他们18周大时 / 并在照顾者之间传递 / 每小时八次。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>相比之下，在狩猎采集社会中，父母以外的成年人可以提供几乎一半的儿童照顾。一项关于刚果民主共和国埃费人的研究发现，婴儿到18周大时平均每天有14个异亲父母，并且每小时在照顾者之间传递八次。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Chaudhary said that / parents now had / less childcare support / from family and social networks / than during most of humans&#39; evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have / a &quot;knock-on&quot; benefit / to a child&#39;s wellbeing.\u003c/p>\n\u003cp>An infant / born to a hunter-gatherer society / could have / more than ten caregivers— / this contrasts starkly / to nursery settings in the UK / where regulations call for / a ratio of one carer / to four children / aged two to three.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>乔杜里说 / 父母现在有 / 更少的育儿支持 / 来自家庭和社会网络 / 比人类进化史的大部分时间，/ 但引入额外的照顾者 / 可以减少压力和母亲抑郁，/ 这可能有 / 一个&quot;连锁&quot;好处 / 对孩子的福祉。\u003c/p>\n\u003cp>一个婴儿 / 出生在狩猎采集社会 / 可能有 / 超过十个照顾者— / 这形成鲜明对比 / 与英国的托儿所环境 / 那里的规定要求 / 一个照顾者的比例 / 对四个孩子 / 两到三岁的。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>乔杜里说，与人类进化史的大部分时间相比，现在的父母从家庭和社会网络获得的育儿支持更少，但引入额外的照顾者可以减少压力和母亲抑郁，这可能对孩子的福祉产生&quot;连锁&quot;好处。在狩猎采集社会中出生的婴儿可能有超过十个照顾者——这与英国托儿所的情况形成鲜明对比，那里的规定要求一个照顾者照顾四个两到三岁的孩子。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>While hunter-gatherer children learnt from observation and imitation in mixed-age playgroups, researchers said that western &quot;instructive teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder. Chaudhary said that Britain should explore the possibility that older siblings helping their parents &quot;might also enhance their own social development&quot;.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>While hunter-gatherer children / learnt from observation and imitation / in mixed-age playgroups, / researchers said that / western &quot;instructive teaching&quot;, / where pupils are asked to sit still, / may contribute to / conditions such as / attention deficit hyperactivity disorder.\u003c/p>\n\u003cp>Chaudhary said that / Britain should explore / the possibility that / older siblings helping their parents / &quot;might also enhance / their own social development&quot;.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>当狩猎采集者的孩子 / 通过观察和模仿学习 / 在混龄游戏小组中，/ 研究人员说 / 西方&quot;教导式教学&quot;，/ 学生被要求坐着不动，/ 可能导致 / 病症比如 / 注意缺陷多动障碍。\u003c/p>\n\u003cp>乔杜里说 / 英国应该探索 / 这种可能性 / 年长的兄弟姐妹帮助他们的父母 / &quot;也可能增强 / 他们自己的社会发展&quot;。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>狩猎采集者的孩子在混龄游戏小组中通过观察和模仿学习，而研究人员指出，西方要求学生坐着不动的&quot;教导式教学&quot;可能导致注意缺陷多动障碍等病症。乔杜里说，英国应该探索年长的兄弟姐妹帮助父母&quot;也可能增强他们自己的社会发展&quot;的可能性。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Parenting tips：(obtained from hunter-gatherers in Africa) → may be the key：(to bringing up → more contented children) → researchers have suggested.\u003c/p>\n\u003cp>The idea is based on → studies of communities：(such as the Kung of Botswana)：(where each child → is cared for → by many adults).\u003c/p>\n\u003cp>Kung children：(as young as four) → will help to look after → younger ones + &quot;baby-wearing&quot;：(in which infants are carried in slings) → is considered the norm.\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>According to Dr Nikhil Chaudhary：(an evolutionary anthropologist：(at Cambridge University)) → these practices：(known as alloparenting) → could lead to → less anxiety：(for children and parents).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Dr Annie Swanepoel：(a child psychiatrist) → believes that → there are ways：(to incorporate them → into western life).\u003c/p>\n\u003cp>In Germany → one scheme → has paired → an old people&#39;s home → with a nursery.\u003c/p>\n\u003cp>The residents → help to look after → the children → an arrangement：(akin to alloparenting).\u003c/p>\n\u003cp>Another measure → could be encouraging friendships：(between children：(in different school years)) → to mirror → the unsupervised mixed-age playgroups：(in hunter-gatherer communities).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>In a paper：(published in the Journal of Child Psychology and Psychiatry) → researchers said that → the western nuclear family → was a recent invention：(which broke with → evolutionary history).\u003c/p>\n\u003cp>This abrupt shift：(to an &quot;intensive mothering narrative&quot;：(which suggests that → mothers should manage childcare alone)) → was likely to have been harmful.\u003c/p>\n\u003cp>&quot;Such narratives → can lead to → maternal exhaustion + have dangerous consequences&quot; → they wrote.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>By contrast // in hunter-gatherer societies → adults other than the parents → can provide → almost half：(of a child&#39;s care).\u003c/p>\n\u003cp>One previous study → looked at → the Efé people：(of the Democratic Republic of Congo).\u003c/p>\n\u003cp>It found that → infants had → an average of 14 alloparents a day：(by the time they were 18 weeks old) + were passed between caregivers → eight times an hour.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Chaudhary said that → parents now had → less childcare support：(from family and social networks)：(than during most of humans&#39; evolutionary history) // but introducing additional caregivers → could reduce stress and maternal depression：(which could have → a &quot;knock-on&quot; benefit：(to a child&#39;s wellbeing)).\u003c/p>\n\u003cp>An infant：(born to a hunter-gatherer society) → could have → more than ten caregivers— // this contrasts starkly → to nursery settings in the UK：(where regulations call for → a ratio of one carer → to four children：(aged two to three)).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>While hunter-gatherer children → learnt from observation and imitation：(in mixed-age playgroups) // researchers said that → western &quot;instructive teaching&quot;：(where pupils are asked to sit still) → may contribute to → conditions：(such as attention deficit hyperactivity disorder).\u003c/p>\n\u003cp>Chaudhary said that → Britain should explore → the possibility：(that older siblings helping their parents → &quot;might also enhance → their own social development&quot;).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>育儿技巧：(从非洲狩猎采集者那里获得的) → 可能是关键：(养育 → 更满足的孩子) → 研究人员建议道。\u003c/p>\n\u003cp>这个想法基于 → 对社区的研究：(比如博茨瓦纳的昆族)：(在那里每个孩子 → 被照顾 → 由许多成年人)。\u003c/p>\n\u003cp>昆族儿童：(年仅四岁的) → 会帮助照顾 → 更小的孩子 + &quot;婴儿背带&quot;：(即婴儿被背带携带) → 被认为是常态。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>根据尼基尔·乔杜里博士：(一位进化人类学家：(在剑桥大学)) → 这些做法：(被称为异亲养育) → 可能导致 → 更少的焦虑：(对孩子和父母来说)。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>安妮·斯瓦内普尔博士：(一位儿童精神科医生) → 相信 → 有方法：(将它们融入 → 西方生活)。\u003c/p>\n\u003cp>在德国 → 一个计划 → 已经配对了 → 一个养老院 → 与一个托儿所。\u003c/p>\n\u003cp>居民们 → 帮助照顾 → 孩子们 → 一种安排：(类似于异亲养育)。\u003c/p>\n\u003cp>另一个措施 → 可能是鼓励友谊：(在儿童之间：(不同学年的)) → 来反映 → 无人监督的混龄游戏小组：(在狩猎采集社区中)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>在一篇论文中：(发表在《儿童心理学与精神病学杂志》上) → 研究人员说 → 西方核心家庭 → 是一个近代发明：(打破了 → 进化历史)。\u003c/p>\n\u003cp>这种突然转变：(到&quot;密集母亲叙事&quot;：(它暗示 → 母亲应该独自管理育儿)) → 可能是有害的。\u003c/p>\n\u003cp>&quot;这样的叙事 → 可能导致 → 母亲疲惫 + 有危险的后果&quot; → 他们写道。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>相比之下 // 在狩猎采集社会中 → 父母以外的成年人 → 可以提供 → 几乎一半：(孩子的照顾)。\u003c/p>\n\u003cp>一项先前的研究 → 观察了 → 埃费人：(刚果民主共和国的)。\u003c/p>\n\u003cp>它发现 → 婴儿有 → 平均每天14个异亲父母：(到他们18周大时) + 在照顾者之间传递 → 每小时八次。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>乔杜里说 → 父母现在有 → 更少的育儿支持：(来自家庭和社会网络)：(比人类进化史的大部分时间) // 但引入额外的照顾者 → 可以减少压力和母亲抑郁：(这可能有 → 一个&quot;连锁&quot;好处：(对孩子的福祉))。\u003c/p>\n\u003cp>一个婴儿：(出生在狩猎采集社会) → 可能有 → 超过十个照顾者— // 这形成鲜明对比 → 与英国的托儿所环境：(那里的规定要求 → 一个照顾者的比例 → 对四个孩子：(两到三岁的))。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>当狩猎采集者的孩子 → 通过观察和模仿学习：(在混龄游戏小组中) // 研究人员说 → 西方&quot;教导式教学&quot;：(学生被要求坐着不动) → 可能导致 → 病症：(比如注意缺陷多动障碍)。\u003c/p>\n\u003cp>乔杜里说 → 英国应该探索 → 这种可能性：(年长的兄弟姐妹帮助他们的父母 → &quot;也可能增强 → 他们自己的社会发展&quot;)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第4段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>In a paper / published in the Journal of Child Psychology and Psychiatry, / researchers said that / the western nuclear family / was a recent invention / which broke with / evolutionary history.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在一篇论文中 / 发表在《儿童心理学与精神病学杂志》上，/ 研究人员说 / 西方核心家庭 / 是一个近代发明 / 打破了 / 进化历史。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先交代研究发表的载体和研究者的判断：\u003c/p>\n\u003cblockquote>\n\u003cp>研究人员在《儿童心理学与精神病学杂志》发表的论文中指出，西方核心家庭是近来才出现的产物\u003c/p>\n\u003c/blockquote>\n\u003cp>再接上这一产物与历史的关系：\u003c/p>\n\u003cblockquote>\n\u003cp>它与人类的演化历史发生了脱离\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>研究人员在《儿童心理学与精神病学杂志》发表的论文中指出，西方核心家庭是近来才出现的产物；它与人类的演化历史发生了脱离。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>研究人员说，西方核心家庭是近期出现、偏离演化历史的产物。\u003c/p>\n\u003c/blockquote>\n\u003cp>句首In…是发表背景，不是主语；主干researchers said that后接完整观点。which修饰recent invention，指这种家庭形式与演化历史不连续。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>研究人员在《儿童心理学与精神病学杂志》发表的论文中指出，西方核心家庭是近来出现的产物，背离了人类的演化历史。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>nuclear family是父母和孩子组成的核心家庭，不能译成带核技术含义的家庭。recent相对于漫长演化史而言，并不指定某一个近期年份。\u003c/p>\n\u003cp>broke with译为“背离”或“脱离”，不是历史本身断裂；保留said的观点归属，不把研究者判断改成独立的政策结论。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>在《儿童心理学与精神病学杂志》上发表的一篇论文中，研究人员指出，西方核心家庭是一个打破进化历史的近代发明。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Chaudhary said that / parents now had / less childcare support / from family and social networks / than during most of humans&#39; evolutionary history, / but introducing additional caregivers / could reduce stress and maternal depression, / which could have / a &quot;knock-on&quot; benefit / to a child&#39;s wellbeing.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>乔杜里说 / 父母现在有 / 更少的育儿支持 / 来自家庭和社会网络 / 比人类进化史的大部分时间，/ 但引入额外的照顾者 / 可以减少压力和母亲抑郁，/ 这可能有 / 一个&quot;连锁&quot;好处 / 对孩子的福祉。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并当下支持不足与可能的改变：\u003c/p>\n\u003cblockquote>\n\u003cp>乔杜里说，现在父母得到的家庭和社会网络支持比人类演化史的大部分时期更少，但增加照料者能减轻压力和产妇抑郁\u003c/p>\n\u003c/blockquote>\n\u003cp>再接上对孩子的间接作用：\u003c/p>\n\u003cblockquote>\n\u003cp>这种改善还可能进一步有益于儿童的身心健康\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>乔杜里说，现在父母得到的家庭和社会网络支持比人类演化史的大部分时期更少，但增加照料者能减轻压力和产妇抑郁；这种改善还可能进一步有益于儿童的身心健康。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持减少；增加照料者可减轻父母负担，并可能使孩子受益。\u003c/p>\n\u003c/blockquote>\n\u003cp>than限定比较对象是演化史的大部分时期，不能接成家庭支持少于社会支持。but转到可行改变；which回指父母压力和抑郁减轻这一改善，译成后续影响。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>乔杜里说，相比人类演化史的大部分时期，如今父母得到的家庭和社会网络育儿支持更少；不过，增加照料者可能减轻压力和母亲的抑郁问题，并进而有益于孩子的身心健康。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>could两次出现都保留可能性，不译成一定治愈或必然改善。maternal depression是母亲的抑郁问题，不要把承受者换成孩子。\u003c/p>\n\u003cp>knock-on突出效果传递：照料者增多先减轻父母负担，再可能改善孩子福祉；拆成两个层次比笼统说“全家受益”更准确。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>乔杜里说，与人类进化史的大部分时间相比，现在的父母从家庭和社会网络获得的育儿支持更少，但引入额外的照顾者可以减少压力和母亲抑郁，这可能对孩子的福祉产生&quot;连锁&quot;好处。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第7段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>While hunter-gatherer children learnt from observation and imitation in mixed-age playgroups, researchers said that western &quot;instructive teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>While hunter-gatherer children / learnt from observation and imitation / in mixed-age playgroups, / researchers said that / western &quot;instructive teaching&quot;, / where pupils are asked to sit still, / may contribute to / conditions such as / attention deficit hyperactivity disorder.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>当狩猎采集者的孩子 / 通过观察和模仿学习 / 在混龄游戏小组中，/ 研究人员说 / 西方&quot;教导式教学&quot;，/ 学生被要求坐着不动，/ 可能导致 / 病症比如 / 注意缺陷多动障碍。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把两种学习方式摆出来：\u003c/p>\n\u003cblockquote>\n\u003cp>狩猎采集者的孩子在混龄玩耍群体中通过观察和模仿学习，而西方采用要求学生安坐不动的指令式教学\u003c/p>\n\u003c/blockquote>\n\u003cp>再接上研究者提出的可能影响：\u003c/p>\n\u003cblockquote>\n\u003cp>研究者说，这种西方教学方式可能促成注意缺陷多动障碍等情况\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>狩猎采集者的孩子在混龄玩耍群体中通过观察和模仿学习，而西方采用要求学生安坐不动的指令式教学；研究者说，这种西方教学方式可能促成注意缺陷多动障碍等情况。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>研究者对照两种学习方式，指出指令式教学可能带来问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>While在这里形成对照，而不是单纯表示同时发生。researchers said统领后面的观点；where从句解释指令式教学的情境，may contribute to才是需要保留的判断强度。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>狩猎采集者的孩子通过混龄玩耍中的观察和模仿来学习；研究人员说，与此相对，要求学生安坐不动的西方指令式教学可能促成注意缺陷多动障碍等情况。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>instructive teaching按文中与观察模仿相对的用法译为“指令式教学”。sit still是安坐不动，不是坐得稳定。\u003c/p>\n\u003cp>may contribute to只能译为“可能促成、可能是影响因素”，不可强化成已证明的直接病因；such as表明ADHD只是举例。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>狩猎采集者的孩子在混龄游戏小组中通过观察和模仿学习，而研究人员指出，西方要求学生坐着不动的&quot;教导式教学&quot;可能导致注意缺陷多动障碍等病症。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>30题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项最适合作为全文标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Instructive teaching: a dilemma for anxious parents\u003c/strong>\u003c/p>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003cp>B. \u003cstrong>For a happier family, learn from the hunter-gatherers\u003c/strong>\u003c/p>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003cp>C. \u003cstrong>Mixed-age playgroup, a better choice for lonely children\u003c/strong>\u003c/p>\n\u003cp>混龄玩耍小组：孤独孩子更好的选择\u003c/p>\n\u003cp>D. \u003cstrong>Tracing the history of parenting: from Africa to Europe\u003c/strong>\u003c/p>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>对照狩猎采集者群体由父母以外的人分担大量照料，并给出Efé的情况。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>将借鉴延伸到混龄学习与帮助父母可能带来的社会发展，建议英国探索。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Instructive teaching: a dilemma for anxious parents\u003c/h3>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>指令式教学：焦虑父母的一个难题\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从另一社会的观察式学习提出启示，说明焦虑父母可能需要重新考虑指令式教学。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释减少连续指令和强制静坐可能给家庭与儿童带来的好处。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列出在西方课堂与家庭中减少直接命令、增加自主观察的可行办法。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回头分析成人把每一步学习都交由自己指挥的观念为何增加压力。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>展示狩猎采集者儿童通过同伴活动、模仿和尝试完成学习的日常。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较两种教学安排给家长和儿童的负担，指出现有教学实践与替代方式的差距。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>提出父母如何在指导与自主之间试验平衡，回应不指导又担心学不会的困境。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A抓住了最后一段的teaching，也抓住前面的anxiety，但全文多数段落在写谁照顾孩子：很多成年人、老人帮忙、母亲单独负责、照料者人数。它们并不是围绕课堂指令式教学安排的。德国把养老院和托儿所配对，也是让老人参与照料，没有介绍如何改课堂讲授。把最后一段的一种教学问题升成总标题，会让前六段反复讨论共同照料显得偏离中心。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. For a happier family, learn from the hunter-gatherers\u003c/h3>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从狩猎采集群体多人照顾孩子的做法出发，提出它可能有助于家庭幸福。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>命名共同育儿，并说明儿童与父母可能因更多支持而减轻焦虑。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>用老人参与照料、跨年级交往等例子说明在西方社会如何借鉴。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回头批评母亲独自承担育儿的近期叙事，解释它与长期支持网络的脱离。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>呈现其他成人大量分担照料的生活事实，给替代安排提供具体参照。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>解释增加照料者对家庭的潜在好处，并指出英国现行照料配比的差距。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>将借鉴延伸到混龄学习与年长孩子参与，提出可继续探索的改变。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的learn from准确解释了全文为何从非洲群体讲到德国和英国：作者不是只介绍遥远风俗，而是在讨论可以怎样借鉴。happier family又能接上第2段less anxiety、第4段对有害负担的批评，以及第6段减少压力和母亲抑郁的好处。最后的社会发展也属于孩子与家庭可能得到的益处。标题没有把学习缩成一种课堂形式，也没有声称现代家庭必须原样复制所有做法。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Mixed-age playgroup, a better choice for lonely children\u003c/h3>\n\u003cp>混龄玩耍小组：孤独孩子更好的选择\u003c/p>\n\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>混龄玩耍小组：孤独孩子更好的选择\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从狩猎采集者的混龄玩耍切入，提出孤独儿童可以借这种群体获得伙伴。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明不同年龄儿童共同游戏可能怎样缓解孤独、形成持续关系。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>介绍西方学校或社区建立跨年级玩伴小组的具体路径。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回头分析只与同龄人或父母活动的安排为何可能限制儿童交往。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>细写他处混龄游戏中年长者与年幼者如何互相帮助、建立归属感。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较西方儿童现有玩伴资源与混龄群体，说明改进交往机会的收益和差距。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>提出进一步试行混龄小组的安排，并考察年长孩子自身的社会发展。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C确实用了mixed-age playgroup，能对应第3段后半和最后一段，却把范围限定为lonely children。全文没有围绕孤独儿童展开，反复出现的另一类受益者是父母。老人参与照料、母亲独自承担育儿的疲惫、托儿所人手比例，都不能只用孩子加入玩耍小组来解释。减少焦虑也不等于专门缓解孤独，标题把问题与对象都缩窄了。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Tracing the history of parenting: from Africa to Europe\u003c/h3>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>追溯育儿历史：从非洲到欧洲\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从非洲育儿方式提出值得追踪的历史线索，说明其可能帮助理解欧洲育儿实践。\u003c/td>\n\u003ctd>先说别处的做法可能值得学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>概括这种做法在早期社区中承担的社会功能，为传播叙述建立起点。\u003c/td>\n\u003ctd>再说这样做可能带来好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明后来的移民、机构或观念交流怎样将非洲照料方式带入欧洲。\u003c/td>\n\u003ctd>再说可以用哪些办法来学\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾欧洲原有的家庭安排及其不足，解释外来做法进入时遇到的背景。\u003c/td>\n\u003ctd>回头解释原来的办法哪里不好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>返回非洲，详述相应做法在原生社会中的组织形式及早期记录。\u003c/td>\n\u003ctd>再说别处是怎样做的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较传播前后的变化、收益和欧洲现存实践与非洲源头的差异。\u003c/td>\n\u003ctd>再说改变的好处和眼前的差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>追踪近来的混龄学习等新一轮变体，说明这一历史传播还在怎样延续。\u003c/td>\n\u003ctd>最后说还可以试着改变什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D能对应非洲、德国、英国和evolutionary history这些词，但它要求文章按历史传播过程组织。实际段落在问现在可以怎么做：第3段说融入西方的办法，第6段比较当下配比，第7段建议英国探索。文中没有写非洲育儿方式何时传到欧洲、经历了哪些阶段。演化历史在第4段只是用来解释让母亲单独承担为何是一种近期偏离，不是整篇历史叙述。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>30题结论\u003c/h3>\n\u003cp>\u003cstrong>30. B. For a happier family, learn from the hunter-gatherers\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>For a happier family, learn from the hunter-gatherers / 为了更幸福的家庭，向狩猎采集者学习\u003c/strong>\u003c/p>\n\u003ch2>26题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to the first two paragraphs, alloparenting refers to the practice of ______.\u003cbr>根据前两段，alloparenting指什么做法？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>概念定义题。题干要求判断“根据前两段，alloparenting指什么做法？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested. The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults. Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003cp>According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n\u003ch3>A. sharing childcare among community members\u003c/h3>\n\u003cblockquote>\n\u003cp>社区成员共同分担育儿\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。\u003c/p>\n\u003cp>很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>alloparenting指的是社区成员共同分担育儿。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 sharing childcare 是分担育儿，对应第1段 is cared for by many adults，一个孩子接受多人照顾，所以回看这一句以及后面年长孩子帮忙的句子。\u003c/p>\n\u003cp>原文用 is cared for by many adults 写一个孩子由很多成年人照顾，A的 sharing childcare 写育儿由多人分担，这两种说法的中心都是不只由一个人承担照料。随后连四岁儿童也会帮助更小的孩子，参与者并不限于母亲。community members 概括这些共同生活的人，照顾对象仍然是孩子，并没有把帮助改成专门开课或只让父母携带婴儿。\u003c/p>\n\u003cp>很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003cp>首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Alloparenting means that childcare is shared by parents and other community members.\u003c/p>\n\u003cp>共同育儿指父母与社区其他成员一起分担照料。\u003c/p>\n\u003c/blockquote>\n\u003cp>many people及older children都表明参与者超出父母，sharing概括的是照料责任的分散。它同时覆盖成人抱孩子和较大儿童帮忙两项例子。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认可以借鉴狩猎采集者来改善家庭生活，不能单凭标题定义具体照料方式；须看首两段中究竟由谁参与、怎样分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>sharing childcare among community members\u003cbr>社区成员共同分担育儿\u003c/p>\n\u003c/blockquote>\n\u003cp>很多成年人和较大的孩子都参与照料，sharing恰好说出这种分担，不是把照料全部交给某一位父母。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. assigning babies to specific adult caregivers\u003c/h3>\n\u003cblockquote>\n\u003cp>把婴儿分配给特定的成年照料者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“[xxx] babies to specific adult caregivers”，保留了相应遮挡。当时的定位线索是：B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。读完全文后，做题模式再经交叉验证排除B，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>assigning表示“分派”，B强调将婴儿交由特定的成年照料者。specific不必机械理解成只有一个人；问题在于原文并没有介绍指定人选的分派规则，而是用many adults和年长孩子帮忙说明照料由多人分担。\u003c/p>\n\u003cp>给孩子安排照料者与社区共同育儿不是同一个定义：前者可能仍是固定人选独立负责，后者强调父母以外多人的参与。B还把参与者限定为成年人，不能涵盖首段明确写出的较大孩子。A直接概括全部例子的共同特征。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>alloparenting指的是把婴儿分配给特定的成年照料者。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的 specific adult caregivers 指特定成年人，会让我们回看第1段的 many adults；两者都在说谁照顾孩子，但B多出特定人选，所以读 each child 所在的整句。\u003c/p>\n\u003cp>assigning表示“分派”，B强调将婴儿交由特定的成年照料者。specific不必机械理解成只有一个人；问题在于原文并没有介绍指定人选的分派规则，而是用many adults和年长孩子帮忙说明照料由多人分担。\u003c/p>\n\u003cp>给孩子安排照料者与社区共同育儿不是同一个定义：前者可能仍是固定人选独立负责，后者强调父母以外多人的参与。B还把参与者限定为成年人，不能涵盖首段明确写出的较大孩子。A直接概括全部例子的共同特征。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003cp>首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Alloparenting consists of assigning babies to designated adult caregivers.\u003c/p>\n\u003cp>共同育儿指把婴儿分派给指定的成年照料者。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文强调多人分担，没有描述指定成人的分派规则；还明确包括较大孩子。即使specific可以指一组人，B所强调的安排程序仍缺少依据，adult也未覆盖全部参与者。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认可以借鉴狩猎采集者来改善家庭生活，不能单凭标题定义具体照料方式；须看首两段中究竟由谁参与、怎样分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>assigning babies to specific adult caregivers\u003cbr>把婴儿分配给特定的成年照料者\u003c/p>\n\u003c/blockquote>\n\u003cp>给孩子安排照料者与社区共同育儿不是同一个定义：前者可能仍是固定人选独立负责，后者强调父母以外多人的参与。B还把参与者限定为成年人，不能涵盖首段明确写出的较大孩子。A直接概括全部例子的共同特征。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. teaching parenting skills to older children\u003c/h3>\n\u003cblockquote>\n\u003cp>向较大的孩子教授育儿技能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。\u003c/p>\n\u003cp>原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>alloparenting指的是向较大的孩子教授育儿技能。\u003c/p>\n\u003c/blockquote>\n\u003cp>C中的 older children 对应第1段 Kung children as young as four，都是在说参与照料的孩子，所以回看他们会 help to look after younger ones 的那一句。\u003c/p>\n\u003cp>原文中的 Kung children as young as four 是帮助者，他们做的动作是照看更小的孩子。C的 older children 却成了被教的人，动作也换成 teaching parenting skills。参加照料可能让孩子学会一些东西，但这句话介绍的是他们已经帮助别人，并不是成年人向他们教授育儿课程。把帮助照料改写成向帮助者授课，人物在动作中的位置也换了。\u003c/p>\n\u003cp>原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003cp>首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Alloparenting is a program in which adults teach older children formal parenting skills.\u003c/p>\n\u003cp>共同育儿是成人向较大儿童正式教授育儿技能的项目。\u003c/p>\n\u003c/blockquote>\n\u003cp>首段older children participate说较大孩子实际帮忙，不是被成人开课培训。参与照料可能有学习收益，但不能把参与行为改写成教授技能的制度。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认可以借鉴狩猎采集者来改善家庭生活，不能单凭标题定义具体照料方式；须看首两段中究竟由谁参与、怎样分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>teaching parenting skills to older children\u003cbr>向较大的孩子教授育儿技能\u003c/p>\n\u003c/blockquote>\n\u003cp>原句让年长孩子去帮助年幼孩子，C却让年长孩子接受教学，没有接上所介绍的照料做法。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. carrying infants around by their parents\u003c/h3>\n\u003cblockquote>\n\u003cp>由婴儿的父母抱着他们四处走动\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 carrying infants 会让我们找到第1段 infants are carried，两处都写携带婴儿，所以回看 baby-wearing 所在的句子，并联系前面的 many adults。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 infants are carried 确实介绍携带婴儿的一种方式，但它跟在年长孩子帮助照料后面，只是 these practices 中的一种表现。D用 carrying infants 概括整个名称，而且加上 by their parents，把承担照料的人收缩为父母。第1段明确写了很多成年人和四岁的孩子参与照料；把这种共同参与只解释成父母携带婴儿，丢掉了名称要概括的照料者范围。\u003c/p>\n\u003cp>父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>alloparenting指的是由婴儿的父母抱着他们四处走动。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 carrying infants 会让我们找到第1段 infants are carried，两处都写携带婴儿，所以回看 baby-wearing 所在的句子，并联系前面的 many adults。\u003c/p>\n\u003cp>原文的 infants are carried 确实介绍携带婴儿的一种方式，但它跟在年长孩子帮助照料后面，只是 these practices 中的一种表现。D用 carrying infants 概括整个名称，而且加上 by their parents，把承担照料的人收缩为父母。第1段明确写了很多成年人和四岁的孩子参与照料；把这种共同参与只解释成父母携带婴儿，丢掉了名称要概括的照料者范围。\u003c/p>\n\u003cp>父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.\u003c/p>\n\u003cp>Kung children as young as four will help to look after younger ones and &quot;baby-wearing&quot;, in which infants are carried in slings, is considered the norm.\u003c/p>\n\u003cp>首段写婴儿由多人抱着，较大孩子也参与照料；第2段把这些多人参与的做法统一命名为alloparenting，重点是父母以外的人共同分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Alloparenting consists of parents carrying their own infants around.\u003c/p>\n\u003cp>共同育儿就是父母抱着自己的婴儿活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文babies are held by many people的照料者是多人，父母单独抱娃不足以解释allo这一共同分担特征。选项保留抱的动作，却把主体收窄回父母。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认可以借鉴狩猎采集者来改善家庭生活，不能单凭标题定义具体照料方式；须看首两段中究竟由谁参与、怎样分担。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>carrying infants around by their parents\u003cbr>由婴儿的父母抱着他们四处走动\u003c/p>\n\u003c/blockquote>\n\u003cp>父母携带婴儿只谈一种动作，还把很多成年人和帮忙的孩子排在了定义外面。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用非洲群体的多人照料和较大孩子帮忙提出可借鉴的育儿做法。说明这些做法称为alloparenting，可能减少孩子与父母的焦虑。\u003c/p>\n\u003cp>本项最终仍要根据“each child is cared for by many adults”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>26题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>26. A. sharing childcare among community members\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：其他成人及较大孩子共同参与，支持社区成员分担育儿的定义。\u003c/p>\n\u003cp>B：原文没有指定成人分派婴儿的规则，而且参与者不只成年人。\u003c/p>\n\u003cp>C：较大孩子实际帮忙，不是成人开设育儿技能课程。\u003c/p>\n\u003cp>D：由多人照料不能缩成只有父母抱着自己的婴儿。\u003c/p>\n\u003ch2>27题\u003c/h2>\n\u003cblockquote>\n\u003cp>The scheme in Germany is mentioned to illustrate ______.\u003cbr>文中提到德国的这项计划，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>实践例子作用题。题干要求判断“文中提到德国的这项计划，是为了说明什么？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life. In Germany, one scheme has paired an old people&#39;s home with a nursery. The residents help to look after the children, an arrangement akin to alloparenting. Another measure could be encouraging friendships between children in different school years to mirror the unsupervised mixed-age playgroups in hunter-gatherer communities.\u003c/p>\n\u003c/blockquote>\n\u003cp>段首先提出把alloparenting融入西方生活，随后列老人院与托儿所相连、老人参与照料的德国方案，再补跨年级友谊与混龄玩耍建议。\u003c/p>\n\u003ch3>A. an attempt to facilitate intergenerational communication\u003c/h3>\n\u003cblockquote>\n\u003cp>促进代际交流的一次尝试\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“an attempt to facilitate [xxx] communication”，保留了相应遮挡。当时的定位线索是：A的 communication 指交流，会让我们想到第3段 paired an old people’s home with a nursery，把两个场所连在一起可能产生交往，所以回看配对之后住户做了什么。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>intergenerational是“代际的”，老人院与托儿所相连确实会使不同年龄的人接触。但题干问is mentioned to illustrate，必须回到例子前的incorporate them into western life，明确作者用这件事来证明什么。\u003c/p>\n\u003cp>例子里的关键动作是老人help to look after the children，后面还直称akin to alloparenting。A只说促进交流，弱化了照料责任由非父母分担的安排；B则把总领句、实际动作及例后说明完整串起。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>德国的做法被用来说明促进代际交流的一次尝试。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 communication 指交流，会让我们想到第3段 paired an old people’s home with a nursery，把两个场所连在一起可能产生交往，所以回看配对之后住户做了什么。\u003c/p>\n\u003cp>intergenerational是“代际的”，老人院与托儿所相连确实会使不同年龄的人接触。但题干问is mentioned to illustrate，必须回到例子前的incorporate them into western life，明确作者用这件事来证明什么。\u003c/p>\n\u003cp>例子里的关键动作是老人help to look after the children，后面还直称akin to alloparenting。A只说促进交流，弱化了照料责任由非父母分担的安排；B则把总领句、实际动作及例后说明完整串起。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003cp>段首先提出把alloparenting融入西方生活，随后列老人院与托儿所相连、老人参与照料的德国方案，再补跨年级友谊与混龄玩耍建议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The German scheme is introduced chiefly as a project for communication between generations.\u003c/p>\n\u003cp>德国方案主要被作为代际交流项目介绍。\u003c/p>\n\u003c/blockquote>\n\u003cp>老人和儿童确实跨代接触，但该段的总领句要求integrate alloparenting，后面的动作也落在help look after children。交流是可见细节，不能替代多人分担育儿这一例证目的。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨倡导借鉴狩猎采集者，德国例子应说明这种借鉴怎样进入西方生活；具体借鉴的是照料、交流还是其他安排，仍要由例子前后明确。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>an attempt to facilitate intergenerational communication\u003cbr>促进代际交流的一次尝试\u003c/p>\n\u003c/blockquote>\n\u003cp>例子里的关键动作是老人help to look after the children，后面还直称akin to alloparenting。A只说促进交流，弱化了照料责任由非父母分担的安排；B则把总领句、实际动作及例后说明完整串起。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/p>\n\u003cp>本项最终仍要根据“incorporate them into western life”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. an approach to integrating alloparenting into western society\u003c/h3>\n\u003cblockquote>\n\u003cp>把共同育儿融入西方社会的一种途径\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 integrating alloparenting into western society 对应第3段 incorporate them into western life，都是把前面那些做法带进西方生活，所以回看段首判断与紧随其后的德国例子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>段首的 incorporate them into western life 先提出可以把这些做法带入西方生活。随后德国的老人帮助照顾托儿所孩子，照料便由父母以外的人一起参与。B的 integrating alloparenting into western society 既包含引入的内容，也包含引入的地方；它说 an approach，也只把德国计划当作一种办法，没有声称西方已经全面采用。B把例子前的判断和例子里的安排接上了。\u003c/p>\n\u003cp>前一句提出可以融入，后一句给出老人参与照料的实际做法，B把观点和例子都概括到了。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>德国的做法被用来说明把共同育儿融入西方社会的一种途径。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 integrating alloparenting into western society 对应第3段 incorporate them into western life，都是把前面那些做法带进西方生活，所以回看段首判断与紧随其后的德国例子。\u003c/p>\n\u003cp>段首的 incorporate them into western life 先提出可以把这些做法带入西方生活。随后德国的老人帮助照顾托儿所孩子，照料便由父母以外的人一起参与。B的 integrating alloparenting into western society 既包含引入的内容，也包含引入的地方；它说 an approach，也只把德国计划当作一种办法，没有声称西方已经全面采用。B把例子前的判断和例子里的安排接上了。\u003c/p>\n\u003cp>前一句提出可以融入，后一句给出老人参与照料的实际做法，B把观点和例子都概括到了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003cp>段首先提出把alloparenting融入西方生活，随后列老人院与托儿所相连、老人参与照料的德国方案，再补跨年级友谊与混龄玩耍建议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The German arrangement shows one way to adapt shared childcare to western institutions.\u003c/p>\n\u003cp>德国安排展示如何借西方现有机构实行共同育儿。\u003c/p>\n\u003c/blockquote>\n\u003cp>老人院与托儿所结合，把非父母照料者纳入孩子日常，具体落实前面的integrate。它并未声称德国完全复制狩猎采集者生活，而是提供一种可用路径。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨倡导借鉴狩猎采集者，德国例子应说明这种借鉴怎样进入西方生活；具体借鉴的是照料、交流还是其他安排，仍要由例子前后明确。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>an approach to integrating alloparenting into western society\u003cbr>把共同育儿融入西方社会的一种途径\u003c/p>\n\u003c/blockquote>\n\u003cp>前一句提出可以融入，后一句给出老人参与照料的实际做法，B把观点和例子都概括到了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/p>\n\u003cp>本项最终仍要根据“incorporate them into western life”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. the conventional parenting style in western culture\u003c/h3>\n\u003cblockquote>\n\u003cp>西方文化中传统的育儿方式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方式。一个用来展示“怎样引入”的计划，不能被换成“已经沿用的传统”；两边对德国安排的新旧身份说得不同。\u003c/p>\n\u003cp>incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>德国的做法被用来说明西方文化中传统的育儿方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 conventional parenting style 要看这是原有习惯还是新办法，因此回到第3段的 there are ways to incorporate them，尤其看 incorporate 和随后 one scheme 的安排。\u003c/p>\n\u003cp>原文的 there are ways to incorporate them 是在谈怎样把前面介绍的做法融入西方生活，然后拿一项计划来说明可以这样做。C的 conventional parenting style 则把它说成西方原有的惯常方式。一个用来展示“怎样引入”的计划，不能被换成“已经沿用的传统”；两边对德国安排的新旧身份说得不同。\u003c/p>\n\u003cp>incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003cp>段首先提出把alloparenting融入西方生活，随后列老人院与托儿所相连、老人参与照料的德国方案，再补跨年级友谊与混龄玩耍建议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The German scheme represents the parenting style that has traditionally prevailed in the West.\u003c/p>\n\u003cp>德国方案代表西方传统上占主导的育儿方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文在提出可作的改变，后文又批评西方核心家庭的孤立照料。把创新借鉴写成传统常态，改动了方案相对于既有制度的位置。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨倡导借鉴狩猎采集者，德国例子应说明这种借鉴怎样进入西方生活；具体借鉴的是照料、交流还是其他安排，仍要由例子前后明确。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the conventional parenting style in western culture\u003cbr>西方文化中传统的育儿方式\u003c/p>\n\u003c/blockquote>\n\u003cp>incorporate说的是把这些做法带进西方，C却把要引入的做法当成西方本来就有的传统。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/p>\n\u003cp>本项最终仍要根据“incorporate them into western life”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. the differences between western and African ways of living\u003c/h3>\n\u003cblockquote>\n\u003cp>西方与非洲生活方式的差异\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文先提出 incorporate them into western life，德国例子接着给出如何实现：老人也帮忙照顾孩子。这样写是在展示两种环境中可以采用相近的多人照料办法。D的 differences 却要求作者用德国说明两边不能相同或怎样不同，而且 ways of living 的范围扩大到了生活方式整体。这个例子具体讲照料孩子的办法可以引入，没有列两地相对的生活习惯来完成差异比较。\u003c/p>\n\u003cp>作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>德国的做法被用来说明西方与非洲生活方式的差异。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 differences 要求例子比较两地不同，但段首的 incorporate them into western life 是把一种做法带进另一种生活，所以回看这句和德国老人照看孩子的安排。\u003c/p>\n\u003cp>原文先提出 incorporate them into western life，德国例子接着给出如何实现：老人也帮忙照顾孩子。这样写是在展示两种环境中可以采用相近的多人照料办法。D的 differences 却要求作者用德国说明两边不能相同或怎样不同，而且 ways of living 的范围扩大到了生活方式整体。这个例子具体讲照料孩子的办法可以引入，没有列两地相对的生活习惯来完成差异比较。\u003c/p>\n\u003cp>作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.\u003c/p>\n\u003cp>In Germany, one scheme has paired an old people&#39;s home with a nursery.\u003c/p>\n\u003cp>The residents help to look after the children, an arrangement akin to alloparenting.\u003c/p>\n\u003cp>段首先提出把alloparenting融入西方生活，随后列老人院与托儿所相连、老人参与照料的德国方案，再补跨年级友谊与混龄玩耍建议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The German case is used mainly to catalogue differences between European and African living arrangements.\u003c/p>\n\u003cp>德国案例主要用于列举欧洲与非洲的生活差异。\u003c/p>\n\u003c/blockquote>\n\u003cp>若重在比较差异，应逐项对照两地如何不同。该段先倡议整合，再列具体办法，论证任务是怎样学习，而不是停在描述差异。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨倡导借鉴狩猎采集者，德国例子应说明这种借鉴怎样进入西方生活；具体借鉴的是照料、交流还是其他安排，仍要由例子前后明确。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the differences between western and African ways of living\u003cbr>西方与非洲生活方式的差异\u003c/p>\n\u003c/blockquote>\n\u003cp>作者用德国把前面的共同照料办法接到西方生活里，D却把建立联系的例子改成区分两地生活方式。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出把做法融入西方生活，德国老人帮忙照料和跨年级友谊给出具体路径。\u003c/p>\n\u003cp>本项最终仍要根据“incorporate them into western life”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>27题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>27. B. an approach to integrating alloparenting into western society\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：跨代接触是细节，作者用例子说明的是共同照料如何融入西方。\u003c/p>\n\u003cp>B：老人参与照料具体落实了总领句提出的融入西方生活。\u003c/p>\n\u003cp>C：借鉴的新方案不能被写成西方一直沿用的传统常态。\u003c/p>\n\u003cp>D：此段提出怎样借鉴，不是为列举非洲与西方差异而举例。\u003c/p>\n\u003ch2>28题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 4, the “intensive mothering narrative” ______.\u003cbr>根据第4段，“密集母职叙述”有什么特点或后果？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>观点细节题。题干要求判断“根据第4段，“密集母职叙述”有什么特点或后果？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history. This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful. &quot;Such narratives can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.\u003c/p>\n\u003c/blockquote>\n\u003cp>研究者称西方核心家庭是近期发明，与演化历史断开；要求母亲独力负责育儿的叙事可能有害，会使她们筋疲力尽。\u003c/p>\n\u003ch3>A. alleviates parenting pressures\u003c/h3>\n\u003cblockquote>\n\u003cp>缓解育儿压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 was likely to have been harmful 判断这种转变很可能有害，随后写 exhaustion 和 dangerous consequences，方向是母亲可能更疲惫、后果危险。A的 alleviates parenting pressures 却说压力得到减轻。虽然 exhaustion 前的程度或性质没有读清，疲惫这个名词和有害的判断仍在，不能把这种负担加重的后果改写成压力缓解。\u003c/p>\n\u003cp>原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful.\u003c/p>\n\u003cp>&quot;Such narratives can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>intensive mothering narrative这一密集母职观念缓解育儿压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 alleviates parenting pressures 指减轻压力，应该对应第4段对母亲独自照料的后果判断，所以回看 was likely to have been harmful 和后面的 exhaustion。\u003c/p>\n\u003cp>原文的 was likely to have been harmful 判断这种转变很可能有害，随后写 exhaustion 和 dangerous consequences，方向是母亲可能更疲惫、后果危险。A的 alleviates parenting pressures 却说压力得到减轻。虽然 exhaustion 前的程度或性质没有读清，疲惫这个名词和有害的判断仍在，不能把这种负担加重的后果改写成压力缓解。\u003c/p>\n\u003cp>原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful.\u003c/p>\n\u003cp>&quot;Such narratives can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.\u003c/p>\n\u003cp>研究者称西方核心家庭是近期发明，与演化历史断开；要求母亲独力负责育儿的叙事可能有害，会使她们筋疲力尽。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The intensive mothering narrative eases the pressures faced by parents.\u003c/p>\n\u003cp>密集母职叙事减轻父母面临的压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文harmful与exhaustion描述的是负担加重。若要支持alleviates，应该出现分担或休息机会，实际却把责任集中于母亲一人，作用方向相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认现有育儿安排有可改善之处，不能自动推出某种母职叙事改善或损害了哪一类关系；应核对第4段对历史变化及后果的明确评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>alleviates parenting pressures\u003cbr>缓解育儿压力\u003c/p>\n\u003c/blockquote>\n\u003cp>原文写的是独自照料可能带来的负担和伤害，A把后果转成了减压。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。\u003c/p>\n\u003cp>本项最终仍要根据“broke with evolutionary history”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. consolidates family relationships\u003c/h3>\n\u003cblockquote>\n\u003cp>巩固家庭关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“[xxx] family relationships”，保留了相应遮挡。当时的定位线索是：B的 family relationships 谈家庭关系，我们回看第4段 mothers should manage childcare alone：家庭中的照料责任只落在母亲身上，与家庭成员怎样分工有关，所以读这句及后面的后果。读完全文后，做题模式再经交叉验证排除B，最终选择D。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>consolidates是“巩固”，因此B不是泛指家庭关系受到影响，而是声称关系得到加强。原文的alone、harmful和maternal exhaustion写母亲独自承担照料及其代价，没有写家庭关系变紧密。\u003c/p>\n\u003cp>家庭成员分工确实是讨论背景，但不能从“发生在家庭内部”推出“巩固家庭关系”。选项所需的正面结果没有证据；本段明确成立的是近期独立照料方式与演化史脱离，对应D。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This abrupt shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful.\u003c/p>\n\u003cp>&quot;Such narratives can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>intensive mothering narrative这一密集母职观念巩固家庭关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 family relationships 谈家庭关系，我们回看第4段 mothers should 案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认现有育儿安排有可改善之处，不能自动推出某种母职叙事改善或损害了哪一类关系；应核对第4段对历史变化及后果的明确评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>departs from the course of evolution\u003cbr>偏离了演化的进程\u003c/p>\n\u003c/blockquote>\n\u003cp>原文明确把这种近期转变与演化历史分开，D说的也是它没有顺着长期演化形成的安排延续。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出母亲独自承担育儿是一种近期转变，与演化历史分离，而且可能有害。\u003c/p>\n\u003cp>本项最终仍要根据“broke with evolutionary history”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>28题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>28. D. departs from the course of evolution\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：独自照料被评为可能有害并造成耗竭，不能反写成减压。\u003c/p>\n\u003cp>B：讨论家庭分工不等于证明家庭关系得到巩固。\u003c/p>\n\u003cp>C：谁负责照料与家庭是否以孩子为中心是不同命题。\u003c/p>\n\u003cp>D：近期安排与演化历史脱离，正对应departs from的同义改写。\u003c/p>\n\u003ch2>29题\u003c/h2>\n\u003cblockquote>\n\u003cp>What can be inferred about the nurseries in the UK?\u003cbr>关于英国的托儿所，可以推断出什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>比较推断题。题干要求判断“关于英国的托儿所，可以推断出什么？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#39; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#39;s wellbeing. An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段先说增加照料者可能减轻父母负担、让孩子受益，再对照狩猎采集群体一个孩子有十余人照料和英国一名照料者负责四个两三岁孩子的许可配比。\u003c/p>\n\u003ch3>A. They tend to fall short of official requirements.\u003c/h3>\n\u003cblockquote>\n\u003cp>它们往往达不到官方要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“They tend to fall short of [xxx] requirements.”，保留了相应遮挡。当时的定位线索是：A的 requirements 对应第6段 regulations call for a ratio，都是标准或要求方面的说法，所以回看英国规定的一个照料者对应四个孩子，以及前面的人数对比。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>official requirements是“官方要求”，fall short of指没有达到它。第6段的regulations call for给出规定本身：一名照料者负责四个两三岁孩子。文中没有调查托儿所实际人数，更没有说机构普遍低于规定。\u003c/p>\n\u003cp>作者用狩猎采集者的多人照料反衬这一规定下的支持程度，能导向改善配比，却不能导向违规指控。“标准本身还可以更好”和“机构没做到现行标准”是两种不同判断，A将它们混为一谈。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从文中可以推知，英国托儿所它们往往达不到官方要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>official requirements对应第6段regulations call for，但对应上“规定”一词还不够：必须再核对原文是否报告了机构实际没有达标。该句只给规定配比。\u003c/p>\n\u003cp>official requirements是“官方要求”，fall short of指没有达到它。第6段的regulations call for给出规定本身：一名照料者负责四个两三岁孩子。文中没有调查托儿所实际人数，更没有说机构普遍低于规定。\u003c/p>\n\u003cp>作者用狩猎采集者的多人照料反衬这一规定下的支持程度，能导向改善配比，却不能导向违规指控。“标准本身还可以更好”和“机构没做到现行标准”是两种不同判断，A将它们混为一谈。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003cp>本段先说增加照料者可能减轻父母负担、让孩子受益，再对照狩猎采集群体一个孩子有十余人照料和英国一名照料者负责四个两三岁孩子的许可配比。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>British nurseries commonly fail to meet the staffing standards required by the government.\u003c/p>\n\u003cp>英国托儿所通常没有达到政府规定的人手标准。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文给的是政府允许的一对四要求，不是实际运营低于要求的调查。批评标准相较共同照料仍显不足，与指控机构违规有明确区别。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认更多育儿支持值得考虑，不能证明英国托儿所违规、招聘困难或承担特定预防任务；具体建议要由照料人数与现行配比的比较支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>They tend to fall short of official requirements.\u003cbr>它们往往达不到官方要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者用狩猎采集者的多人照料反衬这一规定下的支持程度，能导向改善配比，却不能导向违规指控。“标准本身还可以更好”和“机构没做到现行标准”是两种不同判断，A将它们混为一谈。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。\u003c/p>\n\u003cp>本项最终仍要根据“one carer to four children”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. They have difficulty finding enough caregivers.\u003c/h3>\n\u003cblockquote>\n\u003cp>它们很难找到足够的照料者。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 finding enough caregivers 把问题放在找人上，所以回看第6段 one carer to four children，确认这个人数是招聘结果还是规定允许的比例。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 one carer to four children 跟在 regulations call for a ratio 后面，介绍的是英国制度所规定的人员配比。B的 finding enough caregivers 却把较少的照料者解释成招聘困难，等于换了这个数字的来由。一个规定允许一人照顾四个孩子的机构，即使把规定的人员全部招齐，仍然是这个比例；比例低本身不能写成招不到人。作者拿规定与另一种育儿安排比较，B把安排问题改成找人问题。\u003c/p>\n\u003cp>这里的人数由regulations引出，描述的是照料安排；B却把它换成招聘遇到困难所造成的结果。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten 们很难找到足够的照料者。\u003c/p>\n\u003c/blockquote>\n\u003cp>这里的人数由regulations引出，描述的是照料安排；B却把它换成招聘遇到困难所造成的结果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。\u003c/p>\n\u003cp>本项最终仍要根据“one carer to four children”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. They ought to improve their carer-to-child ratio.\u003c/h3>\n\u003cblockquote>\n\u003cp>它们应该改善照料者与儿童的比例。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 improve their carer-to-child ratio 指改善人员配比，对应第6段 more than ten caregivers 与 one carer to four children 的对照，所以把前面增加照料者的好处和这组数字一起回看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文先说增加照料者能够 reduce stress and maternal depression，随后用 more than ten caregivers 对照英国的一人四孩。C的 improve their carer-to-child ratio 把建议落在这组对照真正讨论的事情上：每个孩子能得到多少人的照顾。十多人照顾一个孩子和一人照顾四个孩子，差别显然在照料资源的分配；前面又刚说增加照料者有好处，因此从这里提出改善比例有具体依据。C只说应当改善，没有把“英国现在就违规”或“必须达到十比一”加进去。\u003c/p>\n\u003cp>好处说明为什么值得增加帮助，人数对比说明英国在这方面与多人照料相距很远，C正好把建议接到这个差别上。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从文中可以推知，英国托儿所它们应该改善照料者与儿童的比例。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 improve their carer-to-child ratio 指改善人员配比，对应第6段 more than ten caregivers 与 one carer to four children 的对照，所以把前面增加照料者的好处和这组数字一起回看。\u003c/p>\n\u003cp>原文先说增加照料者能够 reduce stress and maternal depression，随后用 more than ten caregivers 对照英国的一人四孩。C的 improve their carer-to-child ratio 把建议落在这组对照真正讨论的事情上：每个孩子能得到多少人的照顾。十多人照顾一个孩子和一人照顾四个孩子，差别显然在照料资源的分配；前面又刚说增加照料者有好处，因此从这里提出改善比例有具体依据。C只说应当改善，没有把“英国现在就违规”或“必须达到十比一”加进去。\u003c/p>\n\u003cp>好处说明为什么值得增加帮助，人数对比说明英国在这方面与多人照料相距很远，C正好把建议接到这
