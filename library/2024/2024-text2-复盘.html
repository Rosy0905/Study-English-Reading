的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文的 reduce stress and maternal depression 是 introducing additional caregivers 带来的结果，做法是增加照料者，受益的是父母。D的 prevent parental depression 却把结果直接改成托儿所应承担的任务。后面的英国托儿所被拿来比较的是一个照料者与四个孩子的比例，并没有让它承担心理干预的职责。原文从照料安排谈到减轻母亲抑郁，D却把受益结果改写成英国托儿所的工作目标，跳过了文章正在比较的照料人数。\u003c/p>\n\u003cp>原文把情绪好转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从文中可以推知，英国托儿所它们应该尝试防止父母抑郁。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 prevent parental depression 会让我们找到第6段 reduce stress and maternal depression，两处都谈父母的情绪，所以回看是谁做什么才产生这一好处，以及英国托儿所出现在什么位置。\u003c/p>\n\u003cp>原文的 reduce stress and maternal depression 是 introducing additional caregivers 带来的结果，做法是增加照料者，受益的是父母。D的 prevent parental depression 却把结果直接改成托儿所应承担的任务。后面的英国托儿所被拿来比较的是一个照料者与四个孩子的比例，并没有让它承担心理干预的职责。原文从照料安排谈到减轻母亲抑郁，D却把受益结果改写成英国托儿所的工作目标，跳过了文章正在比较的照料人数。\u003c/p>\n\u003cp>原文把情绪好转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>An infant born to a hunter-gatherer society could have more than ten caregivers—this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.\u003c/p>\n\u003cp>本段先说增加照料者可能减轻父母负担、让孩子受益，再对照狩猎采集群体一个孩子有十余人照料和英国一名照料者负责四个两三岁孩子的许可配比。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The central task assigned to British nurseries is to prevent parental depression.\u003c/p>\n\u003cp>赋予英国托儿所的核心任务是预防父母抑郁。\u003c/p>\n\u003c/blockquote>\n\u003cp>父母压力下降是额外支持的可能收益，而题目针对nurseries的具体推断落在紧邻的配比对照。把总体家庭收益写成托儿所应承担的特定预防任务，超出了该对比所能支持的范围。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a happier family, learn from the hunter-gatherers\u003cbr>为了更幸福的家庭，向狩猎采集者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认更多育儿支持值得考虑，不能证明英国托儿所违规、招聘困难或承担特定预防任务；具体建议要由照料人数与现行配比的比较支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>They should try to prevent parental depression.\u003cbr>它们应该尝试防止父母抑郁。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文把情绪好转作为增加照料帮助的结果，D把结果改成机构职责，所回答的已不是这组托儿所人数对比。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明增加照料者可减少父母压力，并把多人照料与英国托儿所配比相比较。\u003c/p>\n\u003cp>本项最终仍要根据“one carer to four children”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. C. They ought to improve their carer-to-child ratio.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：列出官方配比规定不能证明机构实际违反了规定。\u003c/p>\n\u003cp>B：配比较低不自动证明照料者招聘困难这一原因。\u003c/p>\n\u003cp>C：更多支持的潜在益处与鲜明人数对照支持改善配比的建议。\u003c/p>\n\u003cp>D：父母抑郁可能缓解是总体收益，不能替代针对托儿所配比的推断。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：狩猎采集者育儿方式的价值\u003c/strong>（段落1-2核心观点） 研究发现：非洲狩猎采集者的育儿技巧可能是养育更满足孩子的关键 → 具体例子：昆族（每个孩子由多个成年人照顾 + 4岁孩子照顾更小的 + 婴儿背带是常态）→ 定义：这些做法称为&quot;异亲养育&quot;（alloparenting）→ 好处：减少孩子和父母的焦虑\u003c/p>\n\u003cp>↓（西方借鉴的可能性）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：将异亲养育融入西方社会\u003c/strong>（段落3实践探索） 专家观点：可以将这些做法融入西方生活 → 实践案例：【德国：养老院与托儿所配对（居民帮助照顾孩子）】+ 建议措施：【鼓励不同年级儿童友谊（反映混龄游戏小组）】\u003c/p>\n\u003cp>↓（理论背景分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：西方育儿模式的问题\u003c/strong>（段落4批判分析） 历史断裂：西方核心家庭是打破进化历史的近代发明 → &quot;密集母亲叙事&quot;：（母亲独自管理育儿）→ 后果：可能有害（导致母亲疲惫 + 危险后果）\u003c/p>\n\u003cp>//（对比分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：狩猎采集社会vs西方社会的育儿差异\u003c/strong>（段落5-6对比论证） 狩猎采集社会：【父母外的成年人提供近一半照顾 + 埃费人案例：（18周大婴儿每天14个异亲父母 + 每小时传递8次）】// 现代西方：【父母获得更少支持 + 英国托儿所：（1个照顾者对4个2-3岁孩子）】→ 潜在好处：额外照顾者可减少压力和抑郁，对孩子福祉有连锁好处\u003c/p>\n\u003cp>↓（教育方式的影响）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：教育方式的反思与建议\u003c/strong>（段落7深层思考） 学习方式对比：【狩猎采集者：观察和模仿（混龄游戏小组）// 西方：教导式教学（要求坐着不动）→ 可能导致ADHD】→ 建议：英国应探索年长兄弟姐妹帮助父母（可能增强其社会发展）\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：从非洲狩猎采集者的异亲养育方式中学习，通过增加照顾者、鼓励混龄互动等方式，可以减少现代西方&quot;密集母亲叙事&quot;带来的压力，培养更满足、更健康的孩子。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. A Standard Is Not Evidence of a Violation\u003c/p>\n\u003cp>B. Care Can Extend Beyond the Nuclear Family\u003c/p>\n\u003cp>C. Adapting a Principle to Different Institutions\u003c/p>\n\u003cp>D. One Universal Recipe for Raising Children\u003c/p>\n\u003cp>E. Learning through Helping Someone Younger\u003c/p>\n\u003cp>F. Supporting Parents without Replacing Them\u003c/p>\n\u003cp>G. Leaving Children Entirely on Their Own\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A child can receive care from a network rather than from one parent acting alone. In some hunter-gatherer communities, adults other than the parents and older children take part in everyday care. The significance is not simply that many people live nearby. They actually share tasks that would otherwise fall on a smaller number of shoulders. This makes the nuclear household an incomplete unit for describing the child’s support. The useful question becomes who participates in care across the community, rather than whether one mother is managing every demand by herself.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>Learning from a hunter-gatherer community does not require rebuilding its entire way of life in a European town. A principle can be adapted through institutions that already exist. Pairing a nursery with a home for older people, for example, can create opportunities for additional adults to help with children. The arrangement differs from life in a small foraging community, but it preserves the idea that care need not be confined to parents. Its value should be judged by the support it actually provides, not by how closely the buildings resemble an imagined traditional village.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A comparison between childcare ratios can reveal how differently support is organized. Several people sharing the care of one infant is plainly unlike one worker caring for several children. Yet quoting an official ratio does not show that a nursery has broken the rule. To establish a violation, one would need information about its actual staffing as well as the required minimum. The comparison may instead support a discussion about improving the standard itself. A service can meet today’s requirement and still leave room for a more generous level of care.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>When an older child helps a younger one, the benefit need not travel in only one direction. The younger child receives assistance, while the helper has to notice another person’s difficulty, explain an action and adjust to a slower pace. Such experiences can provide occasions for social learning. This does not mean that children should take over an adult’s continuing responsibilities. Small, supported opportunities to help are different from making a child the sole carer. The educational interest lies in participation that develops consideration for others while remaining appropriate to the helper’s age.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>Shared care is best understood as an addition to parental support, not a declaration that parents no longer matter. More participants can offer time, attention and relief, but the arrangement still needs reliable communication about a child’s needs. Parents may benefit when they can rest or ask for help without feeling that they have failed. The point is to reduce the pressure to manage everything alone. A network succeeds when its members know how to cooperate with the family, rather than when responsibility becomes so diffuse that nobody can say who is doing what.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】B. Care Can Extend Beyond the Nuclear Family\u003c/p>\n\u003cblockquote>\n\u003cp>照料可以超出核心家庭\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分用其他成人和较大孩子实际分担任务，说明照料网络不能只按核心家庭描述。\u003c/p>\n\u003cp>首句先把照料来源作何改变：\u003c/p>\n\u003cblockquote>\n\u003cp>from a network rather than from one parent acting alone\u003c/p>\n\u003c/blockquote>\n\u003cp>network与独自负责的父母形成对照，讨论的是照料支持由谁构成，而不是家庭成员住得多近。\u003c/p>\n\u003cp>随后明确“多人在附近”为什么还不够：\u003c/p>\n\u003cblockquote>\n\u003cp>They actually share tasks\u003c/p>\n\u003c/blockquote>\n\u003cp>实际分担任务才把旁观的邻近者变成支持者。otherwise说明这些事本来会集中到更少的人身上。\u003c/p>\n\u003cp>结尾要求观察哪个范围：\u003c/p>\n\u003cblockquote>\n\u003cp>who participates in care across the community\u003c/p>\n\u003c/blockquote>\n\u003cp>核心家庭不足以描述全部支持，要追踪整个社区中谁在参与。母亲是否独力应付不再是唯一尺度。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>照料可来自网络 → 其他成人与较大孩子参与 → 关键是实际分担任务 → 以社区参与者而非孤立母亲描述支持\u003c/p>\n\u003c/blockquote>\n\u003cp>Beyond the Nuclear Family对应other than the parents和across the community；Care对应share tasks而非单纯共同居住。Can保留一种可能组织形式，不宣称所有社区已经这样安排。\u003c/p>\n\u003cp>再看最强干扰项F：Supporting Parents without Replacing Them。\u003c/p>\n\u003cp>支持父母的标题与总体方向相容，但本段没有讨论支持会不会取代父母，也未分配最终决定权。它主要在扩展照料网络的描述单位，选该标题会把尚未展开的责任边界问题提前带入。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】C. Adapting a Principle to Different Institutions\u003c/p>\n\u003cblockquote>\n\u003cp>让原则适应不同机构\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分以已有机构的合作说明如何保留共同参与的原则，而不照搬对方整套生活。\u003c/p>\n\u003cp>先看作者排除的是哪种学习方式：\u003c/p>\n\u003cblockquote>\n\u003cp>rebuilding its entire way of life\u003c/p>\n\u003c/blockquote>\n\u003cp>借鉴不要求重建对方全部生活，因此城镇制度与原有社区不同，并不自动说明借鉴失败。\u003c/p>\n\u003cp>中间的机构实例保留了什么原则：\u003c/p>\n\u003cblockquote>\n\u003cp>additional adults to help with children\u003c/p>\n\u003c/blockquote>\n\u003cp>老人院与托儿所相连，使父母以外成人有机会加入照料。这是原则的功能对应，不是建筑形态的模仿。\u003c/p>\n\u003cp>结尾给出评价改编效果的尺度：\u003c/p>\n\u003cblockquote>\n\u003cp>the support it actually provides\u003c/p>\n\u003c/blockquote>\n\u003cp>应看实际增加了多少支持，而非建筑像不像传统村落。其价值来自照料责任可被分担的效果。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>借鉴无需复制整套生活 → 利用已有机构 → 让额外成人参与照料 → 按实际支持而非外形相似评价\u003c/p>\n\u003c/blockquote>\n\u003cp>Principle对应care need not be confined to parents，Different Institutions对应欧洲城镇的nursery与home for older people。Adapting概括保留功能、改变组织形式的关系，而不是原样移植。\u003c/p>\n\u003cp>再看最强干扰项D：One Universal Recipe for Raising Children。\u003c/p>\n\u003cp>统一育儿配方意味着各处采用同一套安排，但开头明确不必重建entire way of life，后面还认可arrangement differs。作者提倡按当地机构实现分担原则，恰恰允许形式随环境变化。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】A. A Standard Is Not Evidence of a Violation\u003c/p>\n\u003cblockquote>\n\u003cp>规定本身不是违规证据\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分照料配比标准与实际人手证据，说明倡议提高标准不等于指控机构违规。\u003c/p>\n\u003cp>先承认人数对比能告诉我们什么：\u003c/p>\n\u003cblockquote>\n\u003cp>how differently support is organized\u003c/p>\n\u003c/blockquote>\n\u003cp>多人照料一人与一人负责多人，确实显示支持组织方式不同；这项比较本身有价值。\u003c/p>\n\u003cp>Yet之后区分哪两种判断：\u003c/p>\n\u003cblockquote>\n\u003cp>quoting an official ratio does not show that a nursery has broken the rule\u003c/p>\n\u003c/blockquote>\n\u003cp>给出现行规定，不等于报告某机构未遵守。违规还需要实际人手与要求下限两份信息。\u003c/p>\n\u003cp>末句说明达标与改进能否同时成立：\u003c/p>\n\u003cblockquote>\n\u003cp>meet today’s requirement and still leave room\u003c/p>\n\u003c/blockquote>\n\u003cp>一项服务可以达到今天标准，又有进一步增加照料支持的空间。作者讨论改标准与指控机构违反标准的证据不同。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>配比对比显示支持差异 → 规定不等于实际违规记录 → 判断违规还需真实人手 → 达标同时仍可讨论提高标准\u003c/p>\n\u003c/blockquote>\n\u003cp>Standard对应official ratio及required minimum；Evidence of a Violation对应actual staffing与broken the rule。Is Not精确表达“规定本身不能证明违规”，并不否认所有违规的可能。\u003c/p>\n\u003cp>再看最强干扰项D：One Universal Recipe for Raising Children。\u003c/p>\n\u003cp>一套统一配方会从不同配比跳到所有地方必须同样配置。原段既没指定唯一正确人数，也没要求照搬多人照料一孩，只在厘清比较能支持何种结论，核心是证据与推断的边界。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】E. Learning through Helping Someone Younger\u003c/p>\n\u003cblockquote>\n\u003cp>通过帮助年幼者学习\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释较大孩子在帮助中能学习什么，同时保留年龄、成人支持和责任范围的界限。\u003c/p>\n\u003cp>先看“好处不只一个方向”指谁：\u003c/p>\n\u003cblockquote>\n\u003cp>the benefit need not travel in only one direction\u003c/p>\n\u003c/blockquote>\n\u003cp>幼童得到帮助，较大孩子也可能有收获，随后三项动作专门说明帮助者要练习什么。\u003c/p>\n\u003cp>帮助者面对哪些具体任务：\u003c/p>\n\u003cblockquote>\n\u003cp>notice another person’s difficulty, explain an action and adjust to a slower pace\u003c/p>\n\u003c/blockquote>\n\u003cp>观察他人的困难、解释步骤、适应更慢速度，都要求考虑别人的状态，为social learning提供具体内容。\u003c/p>\n\u003cp>但这种学习有什么界限：\u003c/p>\n\u003cblockquote>\n\u003cp>different from making a child the sole carer\u003c/p>\n\u003c/blockquote>\n\u003cp>小规模且有支持的参与不等于独自接管成人职责。结尾的appropriate to the helper’s age继续限定参与程度。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>幼童获帮助 → 帮助者也练习观察与解释 → 产生社会学习机会 → 参与须有支持且适合年龄\u003c/p>\n\u003c/blockquote>\n\u003cp>Learning对应social learning与consideration for others，Helping Someone Younger对应older child帮助younger one。Through说明学习来自帮助中的具体任务，不是成人专门讲授育儿课程。\u003c/p>\n\u003cp>再看最强干扰项G：Leaving Children Entirely on Their Own。\u003c/p>\n\u003cp>让儿童完全独处删去了supported和非sole carer的限制。文中有older child与younger child的共同活动，也保留成人责任；自主参与学习不能被改写成没有任何人支持或监督。\u003c/p>\n\u003cp>\u003cstrong>44题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】F. Supporting Parents without Replacing Them\u003c/p>\n\u003cblockquote>\n\u003cp>支持父母而非替代父母\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把共同照料定位为父母的支持，要求更多参与者有沟通和清楚分工。\u003c/p>\n\u003cp>首句首先限定共同照料不是哪种主张：\u003c/p>\n\u003cblockquote>\n\u003cp>not a declaration that parents no longer matter\u003c/p>\n\u003c/blockquote>\n\u003cp>增加支持不意味着父母不再重要，后文因此继续要求参与者围绕孩子需求可靠沟通。\u003c/p>\n\u003cp>父母得到支持的具体表现是什么：\u003c/p>\n\u003cblockquote>\n\u003cp>rest or ask for help without feeling that they have failed\u003c/p>\n\u003c/blockquote>\n\u003cp>父母可以休息或求助，而不必把未能独力包办视为失败。减轻的正是manage everything alone的压力。\u003c/p>\n\u003cp>结尾用什么检验网络是否成功：\u003c/p>\n\u003cblockquote>\n\u003cp>know how to cooperate with the family\u003c/p>\n\u003c/blockquote>\n\u003cp>合作方式要清楚，不能把人数增多变成责任模糊。最后who is doing what要求实际分工能够说明白。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>共同照料增加父母支持 → 更多人提供时间与关注 → 父母可休息和求助 → 成功网络仍需沟通与清楚分工\u003c/p>\n\u003c/blockquote>\n\u003cp>Supporting对应addition、relief与ask for help，without Replacing对应parents no longer matter被否定，以及cooperate with the family的正面要求。标题同时保留增援与责任边界两端。\u003c/p>\n\u003cp>再看最强干扰项B：Care Can Extend Beyond the Nuclear Family。\u003c/p>\n\u003cp>照料超出核心家庭是本段背景，但作者不再主要列网络包括哪些人，而在说明扩展以后父母地位和分工如何保持。只强调范围扩大，会漏掉首尾反复限定的支持不等于责任消散。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Advice about raising children often addresses a parent as if every task belonged to that individual. When demands multiply, even careful advice can sound like another obligation. A different starting point is to ask how the work is distributed. Before adding one more instruction, it may help to examine who is available to share the care.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Existing institutions can provide one route to those arrangements. A nursery linked with a home for older people can make room for additional adults in children’s daily lives. The aim is to preserve a principle of participation without copying an entire society. A similar search for shared experience can extend beyond adult care to children’s play.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Such help may support the older child’s own social development. Noticing a younger person’s needs can create opportunities to practise patience and explanation. It should nevertheless remain help, rather than the transfer of an adult’s full responsibility to a child. Participation has to be limited by the helper’s age and backed by appropriate adult support.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Mixed-age play is one setting for that shared experience. Younger children can watch more capable companions, while older participants learn to adapt their actions to others. Learning occurs through observation and interaction as well as through direct instruction. This raises a further possibility: an older child’s contribution may involve helping with younger children’s everyday needs.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Additional support could give parents more opportunities to rest and share difficult moments. A child may benefit indirectly when the adults providing care are less overwhelmed. The proposed connection runs from a broader support network through the parent’s experience to the child’s wellbeing. To make use of it, however, a western community needs workable arrangements of its own.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones. Care is therefore a network of participation, not simply a duty carried by one isolated mother. The term alloparenting describes this wider involvement. It offers a useful contrast to the idea that a small household must manage alone.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement. If care has often involved a wider group, concentrating every task on one person is a particular social choice. The comparison invites a practical question rather than a romantic return to the past: what might additional support change for today’s parents?\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That limit illustrates the larger task of adaptation. Learning from shared care means asking which relationships can reduce isolation without creating new burdens for those least able to carry them. A useful network supports parents and children together. It needs clear responsibilities and local judgement, rather than a single arrangement copied unchanged into every family.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从父母负担转问谁能分担照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>说明帮助者也能学习，同时给参与加年龄与成人支持限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明支持父母可能间接帮助孩子，转问西方如何安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>介绍多人参与的共同育儿，与小家庭独自负责形成对照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>以历史对照质疑独立母职，提出增加支持的作用问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>由参与限制收束为因地安排、有清楚责任的共同支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从父母负担转问谁能分担照料 → 介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题 → 说明支持父母可能间接帮助孩子，转问西方如何安排 → 以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能 → 说明帮助者也能学习，同时给参与加年龄与成人支持限制 → 由参与限制收束为因地安排、有清楚责任的共同支持\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → F → G → E → B → D → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：F、G、B、D、C。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → F → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Before adding one more instruction, it may help to examine who is available to share the care.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones.\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇结尾问who is available to share the care，本段the answer逐项列父母之外的成人与较大孩子。参与者名单直接回答可找谁分担，随后才给这种广泛参与命名，定义有例子作基础。\u003c/p>\n\u003cp>由多人实际参与概括为network，进而与one isolated mother对照。最后small household must manage alone把这项对照收束成一种既有观念，给后段评价观念留下明确对象。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>It offers a useful contrast to the idea that a small household must manage alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段That contrast回指网络与独立小家庭，进一步质疑独自母职是唯一天然安排。先有观察到的另一种组织形式，才能说明目前分工是社会选择，而非唯一可能。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从父母负担转问谁能分担照料 → 介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing institutions can provide one route to those arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>Existing institutions也能谈谁加入照料，但those arrangements需要前文已有西方具体安排的任务。开篇还没有解释共同育儿的原则及其意义，直接进入机构会缺少参照，也无法建立后段所指的天然母职对照。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成F → G → E的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It offers a useful contrast to the idea that a small household must manage alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后把多人参与与small household must manage alone相对，本段That contrast承接后，将表面的分工差异推进成对only natural的质疑。反驳依据是另一种可观察安排，而非凭空否定父母责任。\u003c/p>\n\u003cp>if care has often involved a wider group说明为什么把全部任务集中于一人可被视为特定选择。段末拒绝浪漫回到过去，改问增加支持会怎样改变今天父母的处境。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The comparison invites a practical question rather than a romantic return to the past: what might additional support change for today’s parents?\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Additional support could give parents more opportunities to rest and share difficult moments.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段Additional support could give parents正面回答这一问题：先使父母能休息，再可能间接让孩子受益。支持对象与问题中的today’s parents一致，因果说明也接在提问之后。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍多人参与的共同育儿，与小家庭独自负责形成对照 → 以历史对照质疑独立母职，提出增加支持的作用问题 → 说明支持父母可能间接帮助孩子，转问西方如何安排\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such help may support the older child’s own social development.\u003c/p>\n\u003c/blockquote>\n\u003cp>Such help一段的帮助者特指older child，讨论其年龄与成人责任边界；当前刚介绍整个照料网络，尚未聚焦较大孩子的帮忙。它不能替代对父母增加支持的总体提问，也会把后段的受益主体接错。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → D的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To make use of it, however, a western community needs workable arrangements of its own.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing institutions can provide one route to those arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段末尾要求western community找workable arrangements，本段those arrangements原词承接，并用Existing institutions给出实现路径。问题从支持是否有价值转到当地通过什么组织来实现。\u003c/p>\n\u003cp>老人院与托儿所合作提供成人参与的具体形式，随后preserve a principle without copying说明借鉴尺度。段尾再把共享经验的探索从adult care延伸到children’s play，准备切换参与者关系。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A similar search for shared experience can extend beyond adult care to children’s play.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Mixed-age play is one setting for that shared experience.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Mixed-age play立刻接children’s play，并以that shared experience保留本段shared experience的对象。成人机构安排先举一例，再将同一参与原则应用到儿童之间，扩展有桥接句。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明支持父母可能间接帮助孩子，转问西方如何安排 → 以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>In some hunter-gatherer communities, the answer includes adults beyond the parents and children old enough to help younger ones.\u003c/p>\n\u003c/blockquote>\n\u003cp>介绍alloparenting的段落停在狩猎采集者是谁参与及概念定义，还未给西方workable arrangements的实例。放在这里会重讲已知背景，也不会像children’s play那样为后段混龄游戏提供直接入口。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → D → C的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A similar search for shared experience can extend beyond adult care to children’s play.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Mixed-age play is one setting for that shared experience.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾已把讨论从成人照料推向children’s play，本段Mixed-age play给这一范围一个具体形式。that shared experience还保留多方互动的共同原则，衔接不只靠play重复。\u003c/p>\n\u003cp>年轻者观察较有能力的同伴，年长者调整行为，说明学习可以通过互动双向发生。最后把年长者的contribution推进到帮助幼童日常需求，使游戏中的学习进一步连接实际照料参与。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This raises a further possibility: an older child’s contribution may involve helping with younger children’s everyday needs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such help may support the older child’s own social development.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Such help回指刚提出的帮助幼童，而older child’s own social development讨论帮助者所得。先说明年长孩子做什么，再说明帮助本身可能怎样发展他的能力，受益方向清晰。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>以老人院和托儿所合作适应共同照料原则，再扩展到儿童游戏 → 从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能 → 说明帮助者也能学习，同时给参与加年龄与成人支持限制\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such help may support the older child’s own social development.\u003c/p>\n\u003c/blockquote>\n\u003cp>Such help段若直接接成人机构段，前面只有children’s play，尚没有年长孩子帮助幼童日常需求的具体行动。它会把“帮助”的内容和帮助者的身份都省掉，失去社会发展这一结论的行为基础。\u003c/p>\n\u003cp>\u003cstrong>44题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成D → C → H的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This raises a further possibility: an older child’s contribution may involve helping with younger children’s everyday needs.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Such help may support the older child’s own social development.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾明确提出older child帮助younger children’s everyday needs，本段Such help完整回指这一行动。own强调受益者也包括年长帮助者，与前文互动学习的双向性质一致。\u003c/p>\n\u003cp>注意需求、练习耐心和解释给社会发展提供了具体路径。nevertheless随后划线：参与仍是帮助，不是接管成人全部责任；最后以年龄和成人支持把这条界限说清。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Participation has to be limited by the helper’s age and backed by appropriate adult support.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That limit illustrates the larger task of adaptation.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That limit接的就是年龄与成人支持这一限制，再扩大到学习共同照料时不能给承受能力较弱者增加负担。局部儿童参与界限因而成为整体改编原则的例子。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从混龄游戏说明观察互动学习，再提出较大儿童帮忙的可能 → 说明帮助者也能学习，同时给参与加年龄与成人支持限制 → 由参与限制收束为因地安排、有清楚责任的共同支持\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That contrast challenges the assumption that solitary mothering is the only natural arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>That contrast段末问的是额外支持会改变父母什么，既没有年长儿童的责任边界，也没有可供That limit指代的明确限制。它处在总体价值的提问阶段，不能替代末尾对安排如何有分寸的收束。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>shared responsibility for childcare\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>共同承担育儿责任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>community cooperation\u003c/td>\n\u003ctd>社区合作\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>support for parents\u003c/td>\n\u003ctd>对父母的支持\u003c/td>\n\u003ctd>社会生活类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>children’s wellbeing\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>儿童福祉\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>learning through observation\u003c/td>\n\u003ctd>通过观察学习\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>social development\u003c/td>\n\u003ctd>社会交往能力的发展\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>mutual help across generations\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>代际互助\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a readiness to learn from others\u003c/td>\n\u003ctd>向他人学习的意愿\u003c/td>\n\u003ctd>人生哲理类：谦虚、承认不足\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>flexible approaches to learning\u003c/td>\n\u003ctd>灵活的学习方式\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows several people sharing responsibility for X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示几个人共同分担X的责任。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, older children are helping younger ones with X.\u003c/td>\n\u003ctd>图中较大的孩子正在帮助年幼孩子完成X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene illustrates how support from others can ease a burden.\u003c/td>\n\u003ctd>这一场景展示他人的支持如何减轻负担。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The ratio of X to Y differs sharply between the two groups.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>两组中X与Y的比例明显不同。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>On average, each X receives support from Y people.\u003c/td>\n\u003ctd>平均每个X得到Y个人的支持。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures suggest that a larger number of X is associated with Y.\u003c/td>\n\u003ctd>数据表明更多X与Y相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage explores ways to incorporate X into everyday life.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章探索把X融入日常生活的办法。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text contrasts a recent arrangement with a longer history of shared responsibility.\u003c/td>\n\u003ctd>文章把一种近期安排与更久远的共同分担历史作对照。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns what one community can learn from another.\u003c/td>\n\u003ctd>问题涉及一个社区能向另一个社区学习什么。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";

function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}

 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';

  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}

 }

 jump.value='';lastRenderedIdx=idx;
