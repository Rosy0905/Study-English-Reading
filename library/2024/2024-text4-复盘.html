const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Why protection cannot stop at a state boundary</strong></p><p><strong>B. A direct appeal to review wetland safeguards</strong></p><p><strong>C. Natural complexity with benefits for life and communities</strong></p><p><strong>D. The federal role in overcoming narrow local interests</strong></p><p><strong>E. A court decision that narrows environmental authority</strong></p><p><strong>F. A guarantee that every state will adopt the same rules</strong></p><p><strong>G. A proposal to expand all wildlife refuges</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh observed.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>In Maryland, the good news is that there are many state laws in place that provide wetlands protections. But that&#x27;s a very shortsighted view, particularly when it comes to the Chesapeake Bay. The reality is that water, and the pollutants that so often come with it, don&#x27;t respect state boundaries. The Chesapeake draws from a 64,000-square-mile watershed that extends into Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware. Will those jurisdictions extend the same protections now denied under Sackett v. EPA? Perhaps some, but all? That seems unlikely.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#x27;s a reminder that the EPA&#x27;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#x27;t thinking about next year&#x27;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It&#x27;s worth the scenic drive.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>The value of a shallow bay can lie in the complexity of its natural connections. Fresh and saline waters meet, while land and water interact. These relationships support many species and help neighbouring communities by storing floodwater, filtering pollution and reducing damage from storms.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>State lawmakers should therefore review the protection they themselves provide and recognise what is at stake. Seeing a wetland directly can help them understand the value hidden in apparently shallow water. The purpose of such a visit is to inform their judgment about safeguards, not to announce a different construction project.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>That connection helps explain the importance of federal involvement in the bay programme. A wider coordinating role can transcend the influence of well-funded local interests. Without such a perspective, separate decisions may fail to account for the shared water system through which their effects travel.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>A state with its own wetland laws might initially appear well placed to answer those questions. Yet that reassurance is limited when the bay receives water from a watershed spanning several jurisdictions. Pollution carried across a boundary is not stopped by the existence of a law on only one side.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The limitation matters because all the neighbouring jurisdictions may not provide equivalent safeguards. Some may act, while others may leave gaps. Treating the federal decision simply as a victory for landowners can thus obscure consequences borne by people elsewhere.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>People elsewhere include those whose livelihoods depend on downstream waters. A farmer spreading animal waste in one state may give little thought to a crab harvest in another. Runoff nevertheless connects the decision on the field with conditions far beyond it.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Those benefits depend in part on protection that extends beyond the water visible at one location. A Supreme Court decision narrowed the federal agency’s authority by requiring a continuous surface connection for protected wetlands. The restriction therefore raises questions about water quality and flood control.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>At a wildlife refuge, tidal marshes too shallow for a boat can still be full of aquatic life. This visible richness brings the argument back to the bay’s natural complexity. Protecting that complexity requires attention both to local decisions and to the connections extending beyond each locality.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>miracle</td>\n<td>n.奇迹</td>\n<td>complexity</td>\n<td>n.复杂性</td>\n<td>interaction</td>\n<td>n.相互作用</td>\n</tr>\n<tr>\n<td>saline</td>\n<td>adj.含盐的</td>\n<td>shallows</td>\n<td>n.浅水区域</td>\n<td>species</td>\n<td>n.物种</td>\n</tr>\n<tr>\n<td>filtering</td>\n<td>v.过滤</td>\n<td>pollutants</td>\n<td>n.污染物</td>\n<td>storm surges</td>\n<td>风暴潮</td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>ruling</td>\n<td>n.裁决</td>\n<td>authority</td>\n<td>n.权力</td>\n<td>regulate</td>\n<td>v.监管</td>\n</tr>\n<tr>\n<td>wetlands</td>\n<td>n.湿地</td>\n<td>continuous</td>\n<td>adj.连续的</td>\n<td>regulatory scope</td>\n<td>监管范围</td>\n</tr>\n<tr>\n<td>commercial interests</td>\n<td>商业利益</td>\n<td>at odds with</td>\n<td>与……冲突</td>\n<td>repercussions</td>\n<td>n.深远影响</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>in place</td>\n<td>已存在并起作用</td>\n<td>shortsighted</td>\n<td>adj.目光短浅的</td>\n<td>boundaries</td>\n<td>n.边界</td>\n</tr>\n<tr>\n<td>watershed</td>\n<td>n.流域</td>\n<td>extends into</td>\n<td>延伸至</td>\n<td>jurisdictions</td>\n<td>n.辖区</td>\n</tr>\n<tr>\n<td>denied</td>\n<td>v.不再给予</td>\n<td>unlikely</td>\n<td>adj.不太可能的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第4段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>misleading</td>\n<td>adj.误导性的</td>\n<td>standing up for</td>\n<td>维护</td>\n<td>dire</td>\n<td>adj.严重的</td>\n</tr>\n<tr>\n<td>crucial</td>\n<td>adj.至关重要的</td>\n<td>transcend</td>\n<td>v.超越</td>\n<td>deep-pocketed</td>\n<td>adj.财力雄厚的</td>\n</tr>\n<tr>\n<td>special interests</td>\n<td>特殊利益群体</td>\n<td>runoff</td>\n<td>n.地表径流</td>\n<td>downstream</td>\n<td>adv.向下游</td>\n</tr>\n</tbody></table></div>\n<h2>第5段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>call on</td>\n<td>呼吁</td>\n<td>lawmakers</td>\n<td>n.立法者</td>\n<td>reviewing</td>\n<td>v.审视</td>\n</tr>\n<tr>\n<td>stakes</td>\n<td>n.利害关系</td>\n<td>refuge</td>\n<td>n.保护区</td>\n<td>tidal marshes</td>\n<td>潮汐沼泽</td>\n</tr>\n<tr>\n<td>paddle</td>\n<td>v.划桨</td>\n<td>teeming with</td>\n<td>充满；富含</td>\n<td>aquatic life</td>\n<td>水生生命</td>\n</tr>\n<tr>\n<td>scenic</td>\n<td>adj.景色优美的</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n<h3>意群划分 · 第1段</h3>\n<p>The miracle of the Chesapeake Bay / lies not in its depths, / but in the complexity / of its natural construction, / the interaction / of fresh and saline waters, / and the mix / of land and water.</p>\n<p>The shallows provide homes / for hundreds of species / while storing floodwaters, / filtering pollutants from water, / and protecting nearby communities / from potentially destructive storm surges.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>切萨皮克湾的奇迹 / 不在于它的深度，/ 而在于复杂性 / 它的自然构造的，/ 相互作用 / 淡水和咸水的，/ 以及混合 / 陆地和水的。</p>\n<p>浅滩提供家园 / 给数百种物种 / 同时储存洪水，/ 过滤水中的污染物，/ 并保护附近社区 / 免受潜在破坏性风暴潮的侵袭。</p>\n<h3>标准译文 · 第1段</h3>\n<p>切萨皮克湾的奇迹不在于它的深度，而在于其自然构造的复杂性、淡水与咸水的相互作用，以及陆地与水的混合。浅滩为数百种物种提供栖息地，同时储存洪水、过滤水中污染物，并保护附近社区免受潜在破坏性风暴潮的侵袭。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh observed.</p>\n<h3>意群划分 · 第2段</h3>\n<p>All this was put at great risk / late last month, / when the U.S. Supreme Court issued a ruling / in an Idaho case / that provides the U.S. Environmental Protection Agency (EPA) / far less authority / to regulate wetlands and waterways.</p>\n<p>Specifically, / a 5-4 majority decided / that wetlands protected by the EPA / under its Clean Water Act authority / must have a &quot;continuous surface connection&quot; / to bodies of water.</p>\n<p>This narrowing of the regulatory scope / was a victory / for builders, mining operators / and other commercial interests / often at odds with environmental rules.</p>\n<p>And it carries / &quot;significant repercussions / for water quality and flood control / throughout the United States,&quot; / as Justice Brett Kavanaugh observed.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>所有这些都被置于巨大风险之中 / 上个月底，/ 当美国最高法院发布了一项裁决 / 在一个爱达荷州案件中 / 给予美国环境保护署（EPA）/ 远远更少的权力 / 来监管湿地和水道。</p>\n<p>具体来说，/ 5比4的多数决定 / EPA保护的湿地 / 在其清洁水法权限下 / 必须有&quot;连续的表面连接&quot; / 与水体。</p>\n<p>这种监管范围的缩小 / 是一个胜利 / 对建筑商、采矿经营者 / 和其他商业利益集团 / 经常与环境规则相冲突的。</p>\n<p>而且它带来 / &quot;重大影响 / 对水质和洪水控制 / 在整个美国，&quot; / 正如大法官布雷特·卡瓦诺所观察到的。</p>\n<h3>标准译文 · 第2段</h3>\n<p>上个月底，美国最高法院在一个爱达荷州案件中作出裁决，大幅削减了美国环境保护署（EPA）监管湿地和水道的权力，这让所有这些都面临巨大风险。具体来说，5比4的多数裁定，EPA根据《清洁水法》权限保护的湿地必须与水体有&quot;连续的表面连接&quot;。这种监管范围的缩小对经常与环境规则相冲突的建筑商、采矿经营者和其他商业利益集团来说是一个胜利。正如大法官布雷特·卡瓦诺所观察到的，这对全美的水质和洪水控制带来了&quot;重大影响&quot;。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>In Maryland, the good news is that there are many state laws in place that provide wetlands protections. But that&#39;s a very shortsighted view, particularly when it comes to the Chesapeake Bay. The reality is that water, and the pollutants that so often come with it, don&#39;t respect state boundaries. The Chesapeake draws from a 64,000-square-mile watershed that extends into Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware. Will those jurisdictions extend the same protections now denied under Sackett v. EPA? Perhaps some, but all? That seems unlikely.</p>\n<h3>意群划分 · 第3段</h3>\n<p>In Maryland, / the good news is / that there are many state laws in place / that provide wetlands protections.</p>\n<p>But that&#39;s a very shortsighted view, / particularly when it comes to / the Chesapeake Bay.</p>\n<p>The reality is / that water, / and the pollutants / that so often come with it, / don&#39;t respect state boundaries.</p>\n<p>The Chesapeake draws / from a 64,000-square-mile watershed / that extends into / Virginia, Pennsylvania, New York, / West Virginia, the District of Columbia and Delaware.</p>\n<p>Will those jurisdictions extend / the same protections / now denied under Sackett v. EPA?</p>\n<p>Perhaps some, / but all? / That seems unlikely.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>在马里兰州，/ 好消息是 / 有许多州法律已经到位 / 提供湿地保护。</p>\n<p>但这是一个非常短视的观点，/ 特别是当涉及到 / 切萨皮克湾时。</p>\n<p>现实是 / 水，/ 以及污染物 / 经常随之而来的，/ 不尊重州界。</p>\n<p>切萨皮克湾汲取 / 来自64,000平方英里的流域 / 延伸到 / 弗吉尼亚州、宾夕法尼亚州、纽约州、/ 西弗吉尼亚州、哥伦比亚特区和特拉华州。</p>\n<p>这些司法管辖区会提供 / 同样的保护 / 现在在萨克特诉EPA案中被否定的吗？</p>\n<p>也许一些会，/ 但全部会吗？/ 这似乎不太可能。</p>\n<h3>标准译文 · 第3段</h3>\n<p>在马里兰州，好消息是有许多州法律已经到位，提供湿地保护。但这是一个非常短视的观点，特别是涉及到切萨皮克湾时。现实是，水以及经常随之而来的污染物不尊重州界。切萨皮克湾汲取自一个64,000平方英里的流域，延伸到弗吉尼亚州、宾夕法尼亚州、纽约州、西弗吉尼亚州、哥伦比亚特区和特拉华州。这些司法管辖区会提供现在在萨克特诉EPA案中被否定的同样保护吗？也许一些会，但全部会吗？这似乎不太可能。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n<h3>意群划分 · 第4段</h3>\n<p>It is too easy, / and misleading, / to see such court rulings / as merely standing up / for the rights of land owners / when the consequences can be so dire / for their neighbors.</p>\n<p>And it&#39;s a reminder / that the EPA&#39;s involvement / in the Chesapeake Bay Program / has long been crucial / as the means to transcend / the influence of deep-pocketed special interests / in neighboring states.</p>\n<p>Pennsylvania farmers, / to use one telling example, / aren&#39;t thinking about / next year&#39;s blue crab harvest in Maryland / when they decide / whether to spread animal waste / on their fields, / yet the runoff into nearby creeks / can have enormous impact downstream.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>太容易了，/ 而且具有误导性，/ 把这样的法院裁决看作 / 仅仅是站出来维护 / 土地所有者的权利 / 当后果可能如此可怕 / 对他们的邻居来说。</p>\n<p>这是一个提醒 / EPA的参与 / 在切萨皮克湾计划中 / 长期以来一直至关重要 / 作为超越的手段 / 财力雄厚的特殊利益集团的影响 / 在邻近州。</p>\n<p>宾夕法尼亚州的农民，/ 举一个说明性的例子，/ 不会考虑 / 明年马里兰州的蓝蟹收获 / 当他们决定 / 是否在田地上撒播动物粪便时，/ 然而流入附近小溪的径流 / 可能对下游产生巨大影响。</p>\n<h3>标准译文 · 第4段</h3>\n<p>把这样的法院裁决仅仅看作是维护土地所有者权利是太容易且具有误导性的，因为这可能给他们的邻居带来可怕的后果。这提醒我们，EPA在切萨皮克湾计划中的参与长期以来一直至关重要，它是超越邻近州财力雄厚的特殊利益集团影响的手段。举一个说明性的例子，宾夕法尼亚州的农民在决定是否在田地上撒播动物粪便时，不会考虑明年马里兰州的蓝蟹收获，然而流入附近小溪的径流可能对下游产生巨大影响。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It&#39;s worth the scenic drive.</p>\n<h3>意群划分 · 第5段</h3>\n<p>And so we would call on / state lawmakers / from Richmond to Albany / to consider reviewing / their own wetlands protections / and see for themselves / the enormous stakes involved.</p>\n<p>We can offer them a visit / to Blackwater National Wildlife Refuge / in Dorchester County / where bald eagles fly / over tidal marshes / so shallow / you could not paddle a boat across them / but teeming with aquatic life.</p>\n<p>It&#39;s worth the scenic drive.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>因此我们呼吁 / 州立法者 / 从里士满到奥尔巴尼 / 考虑审查 / 他们自己的湿地保护 / 并亲自看看 / 涉及的巨大利害关系。</p>\n<p>我们可以为他们提供一次参观 / 到黑水国家野生动物保护区 / 在多切斯特县 / 那里白头鹰飞翔 / 在潮汐沼泽上空 / 如此浅 / 你无法划船穿过它们 / 但充满了水生生物。</p>\n<p>这值得风景优美的车程。</p>\n<h3>标准译文 · 第5段</h3>\n<p>因此，我们呼吁从里士满到奥尔巴尼的州立法者考虑审查他们自己的湿地保护法规，并亲自看看其中涉及的巨大利害关系。我们可以邀请他们参观多切斯特县的黑水国家野生动物保护区，那里白头鹰在潮汐沼泽上空飞翔，这些沼泽虽然浅到无法划船穿过，却充满了水生生物。这趟风景优美的车程是值得的。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>The miracle of the Chesapeake Bay → lies not in its depths // but in the complexity：(of its natural construction) + the interaction：(of fresh and saline waters) + the mix：(of land and water).</p>\n<p>The shallows provide homes：(for hundreds of species) + while storing floodwaters + filtering pollutants from water + protecting nearby communities：(from potentially destructive storm surges).</p>\n<p><strong>第2段</strong></p>\n<p>All this was put at great risk：(late last month)：(when the U.S. Supreme Court issued a ruling：(in an Idaho case)：(that provides the U.S. Environmental Protection Agency (EPA) → far less authority：(to regulate wetlands and waterways))).</p>\n<p>Specifically → a 5-4 majority decided：(that wetlands protected by the EPA：(under its Clean Water Act authority) → must have a &quot;continuous surface connection&quot;：(to bodies of water)).</p>\n<p>This narrowing of the regulatory scope → was a victory：(for builders, mining operators + other commercial interests：(often at odds with environmental rules)).</p>\n<p>And it carries → &quot;significant repercussions：(for water quality and flood control：(throughout the United States))&quot; → as Justice Brett Kavanaugh observed.</p>\n<p><strong>第3段</strong></p>\n<p>In Maryland → the good news is：(that there are many state laws in place：(that provide wetlands protections)).</p>\n<p>But that&#39;s a very shortsighted view // particularly when it comes to：(the Chesapeake Bay).</p>\n<p>The reality is：(that water + the pollutants：(that so often come with it) → don&#39;t respect state boundaries).</p>\n<p>The Chesapeake draws：(from a 64,000-square-mile watershed：(that extends into：(Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware))).</p>\n<p>Will those jurisdictions extend → the same protections：(now denied under Sackett v. EPA)?</p>\n<p>Perhaps some // but all? → That seems unlikely.</p>\n<p><strong>第4段</strong></p>\n<p>It is too easy + misleading → to see such court rulings：(as merely standing up：(for the rights of land owners))：(when the consequences can be so dire：(for their neighbors)).</p>\n<p>And it&#39;s a reminder：(that the EPA&#39;s involvement：(in the Chesapeake Bay Program) → has long been crucial：(as the means to transcend：(the influence of deep-pocketed special interests：(in neighboring states)))).</p>\n<p>Pennsylvania farmers：(to use one telling example) → aren&#39;t thinking about：(next year&#39;s blue crab harvest in Maryland)：(when they decide：(whether to spread animal waste：(on their fields))) // yet the runoff into nearby creeks → can have enormous impact downstream.</p>\n<p><strong>第5段</strong></p>\n<p>And so we would call on → state lawmakers：(from Richmond to Albany) → to consider reviewing：(their own wetlands protections) + see for themselves：(the enormous stakes involved).</p>\n<p>We can offer them a visit：(to Blackwater National Wildlife Refuge：(in Dorchester County))：(where bald eagles fly：(over tidal marshes：(so shallow：(you could not paddle a boat across them) // but teeming with aquatic life))).</p>\n<p>It&#39;s worth the scenic drive.</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>切萨皮克湾的奇迹 → 不在于它的深度 // 而在于复杂性：(它的自然构造的) + 相互作用：(淡水和咸水的) + 混合：(陆地和水的)。</p>\n<p>浅滩提供家园：(给数百种物种) + 同时储存洪水 + 过滤水中的污染物 + 保护附近社区：(免受潜在破坏性风暴潮的侵袭)。</p>\n<p><strong>第2段</strong></p>\n<p>所有这些都被置于巨大风险之中：(上个月底)：(当美国最高法院发布了一项裁决：(在一个爱达荷州案件中)：(给予美国环境保护署（EPA）→ 远远更少的权力：(来监管湿地和水道)))。</p>\n<p>具体来说 → 5比4的多数决定：(EPA保护的湿地：(在其清洁水法权限下) → 必须有&quot;连续的表面连接&quot;：(与水体))。</p>\n<p>这种监管范围的缩小 → 是一个胜利：(对建筑商、采矿经营者 + 其他商业利益集团：(经常与环境规则相冲突的))。</p>\n<p>而且它带来 → &quot;重大影响：(对水质和洪水控制：(在整个美国))&quot; → 正如大法官布雷特·卡瓦诺所观察到的。</p>\n<p><strong>第3段</strong></p>\n<p>在马里兰州 → 好消息是：(有许多州法律已经到位：(提供湿地保护))。</p>\n<p>但这是一个非常短视的观点 // 特别是当涉及到：(切萨皮克湾时)。</p>\n<p>现实是：(水 + 污染物：(经常随之而来的) → 不尊重州界)。</p>\n<p>切萨皮克湾汲取：(来自64,000平方英里的流域：(延伸到：(弗吉尼亚州、宾夕法尼亚州、纽约州、西弗吉尼亚州、哥伦比亚特区和特拉华州)))。</p>\n<p>这些司法管辖区会提供 → 同样的保护：(现在在萨克特诉EPA案中被否定的)吗？</p>\n<p>也许一些会 // 但全部会吗？→ 这似乎不太可能。</p>\n<p><strong>第4段</strong></p>\n<p>太容易了 + 具有误导性 → 把这样的法院裁决看作：(仅仅是站出来维护：(土地所有者的权利))：(当后果可能如此可怕：(对他们的邻居来说))。</p>\n<p>这是一个提醒：(EPA的参与：(在切萨皮克湾计划中) → 长期以来一直至关重要：(作为超越的手段：(财力雄厚的特殊利益集团的影响：(在邻近州))))。</p>\n<p>宾夕法尼亚州的农民：(举一个说明性的例子) → 不会考虑：(明年马里兰州的蓝蟹收获)：(当他们决定：(是否在田地上撒播动物粪便)) // 然而流入附近小溪的径流 → 可能对下游产生巨大影响。</p>\n<p><strong>第5段</strong></p>\n<p>因此我们呼吁 → 州立法者：(从里士满到奥尔巴尼) → 考虑审查：(他们自己的湿地保护) + 亲自看看：(涉及的巨大利害关系)。</p>\n<p>我们可以为他们提供一次参观：(到黑水国家野生动物保护区：(在多切斯特县))：(那里白头鹰飞翔：(在潮汐沼泽上空：(如此浅：(你无法划船穿过它们) // 但充满了水生生物)))。</p>\n<p>这值得风景优美的车程。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第2段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>All this was put at great risk / late last month, / when the U.S. Supreme Court issued a ruling / in an Idaho case / that provides the U.S. Environmental Protection Agency (EPA) / far less authority / to regulate wetlands and waterways.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>所有这些都被置于巨大风险之中 / 上个月底，/ 当美国最高法院发布了一项裁决 / 在一个爱达荷州案件中 / 给予美国环境保护署（EPA）/ 远远更少的权力 / 来监管湿地和水道。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>All this回指首段自然功能；when引出时间与事件，that修饰Idaho case并交代裁决影响。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>所有这些都被置于巨大风险之中  上个月底， 当美国最高法院发布了一项裁决  在一个爱达荷州案件中  给予美国环境保护署（EPA） 远远更少的权力  来监管湿地和水道。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>法院裁决削弱EPA监管权，使前述自然价值面临风险。</p>\n</blockquote>\n<p>先说价值受威胁，再说明何时发生什么裁决以及权力如何变化。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>上个月末，美国最高法院对爱达荷州的一起案件作出裁决，大幅缩小美国环境保护署监管湿地和水道的权力，前述一切因而面临巨大风险。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>far less明确程度显著下降，不能误解为更多监管权。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>上个月末，美国最高法院对爱达荷州的一起案件作出裁决，大幅缩小美国环境保护署监管湿地和水道的权力，前述一切因而面临巨大风险。</p>\n</blockquote>\n<h2>2. 第4段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>It is too easy, / and misleading, / to see such court rulings / as merely standing up / for the rights of land owners / when the consequences can be so dire / for their neighbors.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>太容易了，/ 而且具有误导性，/ 把这样的法院裁决看作 / 仅仅是站出来维护 / 土地所有者的权利 / 当后果可能如此可怕 / 对他们的邻居来说。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>It是形式主语，to see为实际评价内容，as说明把裁决看作什么；when引出不应忽视的后果。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>太容易了， 而且具有误导性， 把这样的法院裁决看作  仅仅是站出来维护  土地所有者的权利  当后果可能如此可怕  对他们的邻居来说。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>仅把裁决看作维护土地所有者权利，容易且有误导性。</p>\n</blockquote>\n<p>先保留作者对这种解读的评价，再说明邻居可能承受严重后果这一理由。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>当裁决可能给邻居造成如此严重的后果时，仅仅把这类法院裁决看成是在维护土地所有者的权利，是一种过于轻率且有误导性的解读。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>merely限定单一视角，批评的是忽略跨界后果，而非否认所有土地权利。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>当裁决可能给邻居造成如此严重的后果时，仅仅把这类法院裁决看成是在维护土地所有者的权利，是一种过于轻率且有误导性的解读。</p>\n</blockquote>\n<h2>3. 第4段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Pennsylvania farmers, / to use one telling example, / aren&#39;t thinking about / next year&#39;s blue crab harvest in Maryland / when they decide / whether to spread animal waste / on their fields, / yet the runoff into nearby creeks / can have enormous impact downstream.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>宾夕法尼亚州的农民，/ 举一个说明性的例子，/ 不会考虑 / 明年马里兰州的蓝蟹收获 / 当他们决定 / 是否在田地上撒播动物粪便时，/ 然而流入附近小溪的径流 / 可能对下游产生巨大影响。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>to use one telling example是插入语；when交代决策时点，yet连接未考虑与实际有影响的反差。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>宾夕法尼亚州的农民， 举一个说明性的例子， 不会考虑  明年马里兰州的蓝蟹收获  当他们决定  是否在田地上撒播动物粪便时， 然而流入附近小溪的径流  可能对下游产生巨大影响。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>农民未必考虑邻州收成，但径流会强烈影响下游。</p>\n</blockquote>\n<p>先给出上游农民的决策，再指出其忽视的下游利益，最后写径流造成的联系。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>举一个有说服力的例子：宾夕法尼亚州的农民决定是否向田地撒施动物粪肥时，并没有考虑马里兰州来年的蓝蟹收成，然而流入附近溪流的径流却会对下游产生巨大影响。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>没有把蓝蟹渔业写成改革对象；它是用于说明跨区域影响的例子。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>举一个有说服力的例子：宾夕法尼亚州的农民决定是否向田地撒施动物粪肥时，并没有考虑马里兰州来年的蓝蟹收成，然而流入附近溪流的径流却会对下游产生巨大影响。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>The Chesapeake Bay is described in Paragraph 1 as ______.</p>\n<p>第1段把切萨皮克湾描述为______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落信息概括题：从栖息地、蓄洪、滤污和保护社区概括海湾的自然价值。</p>\n<p>题干明确写了Paragraph 1，直接从第1段开头读到结尾，看作者怎样描述切萨皮克湾。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities</p>\n<p>the complexity of its natural construction</p>\n<p>The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water</p>\n</blockquote>\n<h3>A. a valuable natural environment</h3>\n<blockquote>\n<p>第1段把切萨皮克湾描述为一个宝贵的自然环境。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>栖息地、蓄洪、滤污和抵御风暴潮分别使物种与附近居民受益，A用宝贵的自然环境概括这些功能。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1段把切萨皮克湾描述为一个宝贵的自然环境。</p>\n</blockquote>\n<p><code>A</code>的<code>a valuable natural environment</code>要由海湾提供的实际作用来说明；第1段后一句的<code>provide homes for hundreds of species</code>写了它为生物提供什么，接着又列出蓄洪、滤污和保护社区，回看这一句。</p>\n<p>原文先说浅水区<code>provide homes for hundreds of species</code>，即为数百个物种提供栖息地，同时还蓄存洪水、过滤污染物、保护附近社区。<code>A</code>用<code>a valuable natural environment</code>概括这些生物与社区从中受益的作用。这里的“宝贵”并非另加价格，而是对这些自然作用的概括；原句列出的具体作用能够支撑这一评价。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n<p>切萨皮克湾的奇妙不在深度，而在天然构造的复杂、淡水与咸水的相互作用以及水陆交融。浅水区为数百种生物提供家园，同时蓄洪、过滤水中污染物，并保护邻近社区免受可能造成破坏的风暴潮影响。</p>\n</blockquote>\n<p>第一句说明自然构造及水陆交融，第二句从这种构造落到多项生态与社区保护作用。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Chesapeake Bay is a valuable natural environment.</p>\n<p>第1段把切萨皮克湾描述为一个宝贵的自然环境。</p>\n</blockquote>\n<p>valuable评价自然功能，不必理解为市场价格；它能覆盖全段列出的生物与人类受益关系。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. a controversial conservation area</h3>\n<blockquote>\n<p>第1段把切萨皮克湾描述为一个有争议的保护区域。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>天然构造complexity是自然关系复杂，不等于人们对保护区有争议；第一段没有介绍保护安排的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1段把切萨皮克湾描述为一个有争议的保护区域。</p>\n</blockquote>\n<p><code>B</code>的<code>controversial conservation area</code>把重点放在保护区域引发争议上；回看第1段的<code>complexity of its natural construction</code>及浅水区的作用，确认这里的复杂是在讲天然构造，还是在讲人们对保护安排的分歧。</p>\n<p>原文的<code>complexity of its natural construction</code>指天然构造复杂，后面把这种构造展开为水体相互作用以及陆地与水交融；另一句接着列举浅水区提供栖息地、蓄洪和滤污的作用。<code>B</code>的<code>controversial conservation area</code>则说这里是一个因保护而有争议的区域，把自然构成的复杂改成了人们对保护区域的争议。第1段建立的是自然构成与实际作用的描述，没有建立保护安排与意见冲突这层关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n<p>切萨皮克湾的奇妙不在深度，而在天然构造的复杂、淡水与咸水的相互作用以及水陆交融。浅水区为数百种生物提供家园，同时蓄洪、过滤水中污染物，并保护邻近社区免受可能造成破坏的风暴潮影响。</p>\n</blockquote>\n<p>海湾之奇先落在淡咸水与水陆相互作用，再以实际功能支撑赞许。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Chesapeake Bay is a controversial conservation area.</p>\n<p>第1段把切萨皮克湾描述为一个有争议的保护区域。</p>\n</blockquote>\n<p>B需要不同人对保护区域的分歧。后文裁决争议也不能倒过来替代题干限定的第一段描写。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. a place with commercial potential</h3>\n<blockquote>\n<p>第1段把切萨皮克湾描述为一个具有商业潜力的地方。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>首段列自然保护功能，未说明商业经营或开发机会，C把生态与社区收益转成商业潜力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1段把切萨皮克湾描述为一个具有商业潜力的地方。</p>\n</blockquote>\n<p><code>C</code>的<code>commercial potential</code>要求看到海湾怎样能够用于商业；第1段的<code>storing floodwaters</code>和<code>filtering pollutants from water</code>确实在讲海湾的用途，因此回看列举这些作用的后一句，分清作者说的是哪一种用途。</p>\n<p>原文说浅水区为物种提供栖息地，并通过<code>storing floodwaters</code>和<code>filtering pollutants from water</code>发挥蓄洪、净水作用，还保护附近社区。<code>C</code>的<code>commercial potential</code>把这些作用概括为可供商业开发的潜力。</p>\n<p>原句写出的受益对象是物种和社区，动作是自然庇护与环境保护；没有把这些动作进一步连接到经营、交易或商业开发。</p>\n<p>把自然功能直接转为商业前景，增加了原段未建立的利用方式。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n<p>切萨皮克湾的奇妙不在深度，而在天然构造的复杂、淡水与咸水的相互作用以及水陆交融。浅水区为数百种生物提供家园，同时蓄洪、过滤水中污染物，并保护邻近社区免受可能造成破坏的风暴潮影响。</p>\n</blockquote>\n<p>为物种提供家园、为居民挡风暴属于自然系统的作用，段落未转向这些作用如何变成交易。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Chesapeake Bay is a place with commercial potential.</p>\n<p>第1段把切萨皮克湾描述为一个具有商业潜力的地方。</p>\n</blockquote>\n<p>C需要商业用途与市场前景的连接。有用途、有价值，不等于作者已经论证有商业开发潜力。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. a headache for nearby communities</h3>\n<blockquote>\n<p>第1段把切萨皮克湾描述为附近社区的一件头疼事。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>protecting说明海湾保护社区，造成破坏的是storm surges风暴潮；D把保护者变成社区的麻烦来源。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第1段把切萨皮克湾描述为附近社区的一件头疼事。</p>\n</blockquote>\n<p>protecting说明海湾保护社区，造成破坏的是storm surges风暴潮；D把保护者变成社区的麻烦来源。</p>\n<p>列举栖息、蓄洪和滤污后，句子以保护邻近居民免受风暴潮影响收尾。</p>\n<p>D需要海湾本身给社区带来困扰的内容。原句明确把自然威胁与提供保护的浅水区分开，不能调换角色。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n<p>切萨皮克湾的奇妙不在深度，而在天然构造的复杂、淡水与咸水的相互作用以及水陆交融。浅水区为数百种生物提供家园，同时蓄洪、过滤水中污染物，并保护邻近社区免受可能造成破坏的风暴潮影响。</p>\n</blockquote>\n<p>列举栖息、蓄洪和滤污后，句子以保护邻近居民免受风暴潮影响收尾。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Chesapeake Bay is a headache for nearby communities.</p>\n<p>第1段把切萨皮克湾描述为附近社区的一件头疼事。</p>\n</blockquote>\n<p>D需要海湾本身给社区带来困扰的内容。原句明确把自然威胁与提供保护的浅水区分开，不能调换角色。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. A</strong></p>\n</blockquote>\n<ul>\n<li>A：栖息地、蓄洪、滤污和抵御风暴潮分别使物种与附近居民受益，A用宝贵的自然环境概括这些功能。</li>\n<li>B：天然构造complexity是自然关系复杂，不等于人们对保护区有争议；第一段没有介绍保护安排的冲突。</li>\n<li>C：首段列自然保护功能，未说明商业经营或开发机会，C把生态与社区收益转成商业潜力。</li>\n<li>D：protecting说明海湾保护社区，造成破坏的是storm surges风暴潮；D把保护者变成社区的麻烦来源。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>The U.S. Supreme Court’s ruling in the Idaho case ______.</p>\n<p>美国最高法院在爱达荷州案件中的裁决______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解题：核对裁决使EPA权力怎样改变，并区分商业利益冲突的对象。</p>\n<p>题干给出Supreme Court、ruling和Idaho case，第2段开头正是在说最高法院对爱达荷州案件的裁决。把第2段完整读一遍，了解裁决的内容及作者写出的影响。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways</p>\n<p>This narrowing of the regulatory scope</p>\n<p>must have a “continuous surface connection” to bodies of water</p>\n</blockquote>\n<h3>A. reinforces water pollution control</h3>\n<blockquote>\n<p>最高法院在爱达荷州案件中的裁决加强了水污染控制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>far less authority与narrowing都说明监管削弱，A却说加强水污染控制，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh observed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最高法院在爱达荷州案件中的裁决加强了水污染控制。</p>\n</blockquote>\n<p><code>A</code>的<code>reinforces water pollution control</code>要核对裁决使监管增强还是减弱；第2段开头的<code>far less authority</code>写出了环境保护署监管权的变化，后面的<code>narrowing of the regulatory scope</code>又说明了范围变化，回看这两处。</p>\n<p>原文先说裁决使环境保护署监管湿地和水道的权力变得<code>far less authority</code>，又把结果称为<code>narrowing of the regulatory scope</code>，即监管范围收窄。<code>A</code>的<code>reinforces water pollution control</code>却说这项裁决加强了水污染控制。原句明确写出的制度变化是削减监管权与缩小监管范围，<code>A</code>把这个变化改成了强化管控，方向相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh observed.</p>\n<p>上月底最高法院对爱达荷州案件的裁决使这些价值面临重大风险，因为EPA监管湿地与水道的权力大幅减少。法院以5比4裁定，受EPA依据《清洁水法》保护的湿地必须与水体有连续的地表连接。监管范围收窄使常与环境规则冲突的建筑商、采矿经营者及其他商业利益方获胜。法官Brett Kavanaugh指出，这会对全美水质与防洪产生重大影响。</p>\n</blockquote>\n<p>裁决先被写为使自然价值面临风险，再以地表连接要求具体解释保护范围怎样收窄。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The ruling reinforces water pollution control.</p>\n<p>最高法院在爱达荷州案件中的裁决加强了水污染控制。</p>\n</blockquote>\n<p>A需要裁决扩展或强化控制的依据。实际对商业利益是胜利，恰与环境监管受限的叙述相连。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. weakens the EPA’s regulatory power</h3>\n<blockquote>\n<p>最高法院在爱达荷州案件中的裁决削弱了EPA的监管权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>EPA监管权少得多，保护湿地还需连续地表连接，B的weakens概括权限与范围的收窄。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh observed.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>最高法院在爱达
