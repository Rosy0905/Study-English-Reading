uote>\n<p>先让步承认一州好消息，再用更大流域纠正过度乐观的看法。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>“Encouraged” describes the author’s attitude to the bay’s future.</p>\n<p>作者对海湾未来感到受到鼓舞。</p>\n</blockquote>\n<p>D需要鼓励作者相信海湾前景改善的依据。结尾unlikely针对全部提供保护，支持的是担心而非信心增强。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. A**\n\n- A：污染跨州流动，而所有相关辖区都提供同等保护似乎不可能，这使海湾整体前景存在缺口，A概括作者担忧。\n- B：作者用反问区分部分辖区与全部辖区，并用unlikely作出判断，未表现为弄不懂问题的困惑。\n- C：good news只是马里兰局部情况，接着就被指出视野短浅，结尾又否定全域保护的可靠性，不能概括为放心。\n- D：作者没有从州法增加未来信心，而是指出污染跨界、各州保护未必同步；D把疑虑写成受到鼓舞。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,892,1344,368],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. A</strong></p>\n</blockquote>\n<ul>\n<li>A：污染跨州流动，而所有相关辖区都提供同等保护似乎不可能，这使海湾整体前景存在缺口，A概括作者担忧。</li>\n<li>B：作者用反问区分部分辖区与全部辖区，并用unlikely作出判断，未表现为弄不懂问题的困惑。</li>\n<li>C：good news只是马里兰局部情况，接着就被指出视野短浅，结尾又否定全域保护的可靠性，不能概括为放心。</li>\n<li>D：作者没有从州法增加未来信心，而是指出污染跨界、各州保护未必同步；D把疑虑写成受到鼓舞。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?\n>\n> 关于环境保护署参与切萨皮克湾项目，可以推断出什么？\n\n### 题型\n\n推断题：用上游决定影响下游的例子，理解EPA超越局部利益的跨区域作用。\n\n题干明确给出the EPA’s involvement in the Chesapeake Bay Program，第4段中间原样出现这项参与。把第4段完整读完，看作者先怎样评价法院裁决，再怎样解释该署参与的重要性及农民的例子。\n\n### 核心出处\n\n> the means to transcend the influence of deep-pocketed special interests in neighboring states\n>\n> aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields\n>\n> aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?</p>\n<p>关于环境保护署参与切萨皮克湾项目，可以推断出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>推断题：用上游决定影响下游的例子，理解EPA超越局部利益的跨区域作用。</p>\n<p>题干明确给出the EPA’s involvement in the Chesapeake Bay Program，第4段中间原样出现这项参与。把第4段完整读完，看作者先怎样评价法院裁决，再怎样解释该署参与的重要性及农民的例子。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>the means to transcend the influence of deep-pocketed special interests in neighboring states</p>\n<p>aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields</p>\n<p>aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream</p>\n</blockquote>\n"},{"title":"A. It has restored the balance among neighboring jurisdictions.","raw":"### A. It has restored the balance among neighboring jurisdictions.\n\n> EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nEPA超越邻州财力雄厚群体的影响，原文没有说已恢复辖区间的某种平衡，A改变了作用对象与结果。\n\n**出处：**\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>EPA超越邻州财力雄厚群体的影响，原文没有说已恢复辖区间的某种平衡，A改变了作用对象与结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section>"},{"title":"A. It has restored the balance among neighboring jurisdictions.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。\n\n`A`的`restored the balance among neighboring jurisdictions`要核对这种参与带来的结果；第4段用`transcend the influence`说明其作用，并把影响连接到邻州的`special interests`，回看这一句及后面的跨州影响例子。\n\n原文说环境保护署的参与是`transcend the influence`的一种手段，它所要超越的是邻州某些特殊利益的影响；例子说明宾夕法尼亚农民作决定时不考虑马里兰的蓝蟹收成。`A`的`restored the balance among neighboring jurisdictions`却把这项作用改为已经恢复各辖区之间的平衡。原句谈的是怎样超越特殊利益的影响，`A`增加了辖区此前失衡、现在已经恢复平衡的结果，也把特殊利益的影响换成辖区彼此的平衡关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>EPA超越邻州财力雄厚群体的影响，原文没有说已恢复辖区间的某种平衡，A改变了作用对象与结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。</p>\n</blockquote>\n<p><code>A</code>的<code>restored the balance among neighboring jurisdictions</code>要核对这种参与带来的结果；第4段用<code>transcend the influence</code>说明其作用，并把影响连接到邻州的<code>special interests</code>，回看这一句及后面的跨州影响例子。</p>\n<p>原文说环境保护署的参与是<code>transcend the influence</code>的一种手段，它所要超越的是邻州某些特殊利益的影响；例子说明宾夕法尼亚农民作决定时不考虑马里兰的蓝蟹收成。<code>A</code>的<code>restored the balance among neighboring jurisdictions</code>却把这项作用改为已经恢复各辖区之间的平衡。原句谈的是怎样超越特殊利益的影响，<code>A</code>增加了辖区此前失衡、现在已经恢复平衡的结果，也把特殊利益的影响换成辖区彼此的平衡关系。</p>\n</section>"},{"title":"A. It has restored the balance among neighboring jurisdictions.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n>\n> 仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。\n\n第四段先说明土地所有者的邻居也承受后果，再用跨州径流说明保护视野须超出地方利益。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> It has restored the balance among neighboring jurisdictions.\n>\n> EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。\n\nA需要失衡状态及恢复结果。能够越过狭窄利益发挥作用，不等于已完成各辖区的平衡恢复。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>EPA超越邻州财力雄厚群体的影响，原文没有说已恢复辖区间的某种平衡，A改变了作用对象与结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。</p>\n</blockquote>\n<p><code>A</code>的<code>restored the balance among neighboring jurisdictions</code>要核对这种参与带来的结果；第4段用<code>transcend the influence</code>说明其作用，并把影响连接到邻州的<code>special interests</code>，回看这一句及后面的跨州影响例子。</p>\n<p>原文说环境保护署的参与是<code>transcend the influence</code>的一种手段，它所要超越的是邻州某些特殊利益的影响；例子说明宾夕法尼亚农民作决定时不考虑马里兰的蓝蟹收成。<code>A</code>的<code>restored the balance among neighboring jurisdictions</code>却把这项作用改为已经恢复各辖区之间的平衡。原句谈的是怎样超越特殊利益的影响，<code>A</code>增加了辖区此前失衡、现在已经恢复平衡的结果，也把特殊利益的影响换成辖区彼此的平衡关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n<p>仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。</p>\n</blockquote>\n<p>第四段先说明土地所有者的邻居也承受后果，再用跨州径流说明保护视野须超出地方利益。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has restored the balance among neighboring jurisdictions.</p>\n<p>EPA参与切萨皮克湾项目已恢复相邻辖区之间的平衡。</p>\n</blockquote>\n<p>A需要失衡状态及恢复结果。能够越过狭窄利益发挥作用，不等于已完成各辖区的平衡恢复。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. It has triggered a radical reform in commercial fisheries.","raw":"### B. It has triggered a radical reform in commercial fisheries.\n\n> EPA参与切萨皮克湾项目引发商业渔业的彻底改革。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n蓝蟹收成是上游施肥可能损害的下游利益，B却把它改成EPA引发商业渔业彻底改革。\n\n**出处：**\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目引发商业渔业的彻底改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>蓝蟹收成是上游施肥可能损害的下游利益，B却把它改成EPA引发商业渔业彻底改革。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section>"},{"title":"B. It has triggered a radical reform in commercial fisheries.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> EPA参与切萨皮克湾项目引发商业渔业的彻底改革。\n\n`B`的`radical reform in commercial fisheries`指向渔业的改变；第4段与渔获有关的表述是`next year’s blue crab harvest in Maryland`，因此回看农民作决定与下游蓝蟹收成之间的关系，再连着前一句环境保护署的作用读。\n\n原文把环境保护署的参与写成超越邻州特殊利益影响的手段，例子中的`next year’s blue crab harvest in Maryland`是上游农民作决定时没有考虑的下游收成；径流却会影响下游。`B`的`radical reform in commercial fisheries`则说这种参与已经引发商业渔业的彻底改革。原句的作用链是农民施用粪便可能影响下游，渔获用来说明下游利益受到牵连；`B`把受影响的渔获改成被改革的行业，又把环境保护署的参与接成改革的原因。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目引发商业渔业的彻底改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>蓝蟹收成是上游施肥可能损害的下游利益，B却把它改成EPA引发商业渔业彻底改革。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目引发商业渔业的彻底改革。</p>\n</blockquote>\n<p><code>B</code>的<code>radical reform in commercial fisheries</code>指向渔业的改变；第4段与渔获有关的表述是<code>next year’s blue crab harvest in Maryland</code>，因此回看农民作决定与下游蓝蟹收成之间的关系，再连着前一句环境保护署的作用读。</p>\n<p>原文把环境保护署的参与写成超越邻州特殊利益影响的手段，例子中的<code>next year’s blue crab harvest in Maryland</code>是上游农民作决定时没有考虑的下游收成；径流却会影响下游。<code>B</code>的<code>radical reform in commercial fisheries</code>则说这种参与已经引发商业渔业的彻底改革。原句的作用链是农民施用粪便可能影响下游，渔获用来说明下游利益受到牵连；<code>B</code>把受影响的渔获改成被改革的行业，又把环境保护署的参与接成改革的原因。</p>\n</section>"},{"title":"B. It has triggered a radical reform in commercial fisheries.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n>\n> 仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。\n\n农民不考虑另一州蓝蟹的例子用来说明外部影响，以及更广协调的必要。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> It has triggered a radical reform in commercial fisheries.\n>\n> EPA参与切萨皮克湾项目引发商业渔业的彻底改革。\n\nB需要渔业制度改革及EPA促成改革的证据。行业受到污染影响与行业已经彻底改革是不同事件。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目引发商业渔业的彻底改革。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>蓝蟹收成是上游施肥可能损害的下游利益，B却把它改成EPA引发商业渔业彻底改革。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目引发商业渔业的彻底改革。</p>\n</blockquote>\n<p><code>B</code>的<code>radical reform in commercial fisheries</code>指向渔业的改变；第4段与渔获有关的表述是<code>next year’s blue crab harvest in Maryland</code>，因此回看农民作决定与下游蓝蟹收成之间的关系，再连着前一句环境保护署的作用读。</p>\n<p>原文把环境保护署的参与写成超越邻州特殊利益影响的手段，例子中的<code>next year’s blue crab harvest in Maryland</code>是上游农民作决定时没有考虑的下游收成；径流却会影响下游。<code>B</code>的<code>radical reform in commercial fisheries</code>则说这种参与已经引发商业渔业的彻底改革。原句的作用链是农民施用粪便可能影响下游，渔获用来说明下游利益受到牵连；<code>B</code>把受影响的渔获改成被改革的行业，又把环境保护署的参与接成改革的原因。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n<p>仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。</p>\n</blockquote>\n<p>农民不考虑另一州蓝蟹的例子用来说明外部影响，以及更广协调的必要。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has triggered a radical reform in commercial fisheries.</p>\n<p>EPA参与切萨皮克湾项目引发商业渔业的彻底改革。</p>\n</blockquote>\n<p>B需要渔业制度改革及EPA促成改革的证据。行业受到污染影响与行业已经彻底改革是不同事件。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. It has set a fine example of respecting state authorities.","raw":"### C. It has set a fine example of respecting state authorities.\n\n> EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\nspecial interests指邻州特殊利益群体，不等于州当局；transcend其影响也不能改成尊重州权的榜样。\n\n**出处：**\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>special interests指邻州特殊利益群体，不等于州当局；transcend其影响也不能改成尊重州权的榜样。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section>"},{"title":"C. It has set a fine example of respecting state authorities.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。\n\n`C`的`respecting state authorities`把参与的意义放在怎样对待州当局；第4段说这种参与能`transcend the influence`，并把影响归于邻州的特殊利益，回看对这项参与作解释的整句。\n\n原文说环境保护署的参与长期以来至关重要，因为它提供了`transcend the influence`的手段，所针对的是邻州特殊利益的影响。`C`的`respecting state authorities`却把它解释为尊重州当局，并进一步说它树立了良好榜样。原句没有把`special interests`等同于州当局，也没有把“超越这些利益的影响”写成“尊重当局”；`C`改变了这项参与的对象与作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>special interests指邻州特殊利益群体，不等于州当局；transcend其影响也不能改成尊重州权的榜样。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。</p>\n</blockquote>\n<p><code>C</code>的<code>respecting state authorities</code>把参与的意义放在怎样对待州当局；第4段说这种参与能<code>transcend the influence</code>，并把影响归于邻州的特殊利益，回看对这项参与作解释的整句。</p>\n<p>原文说环境保护署的参与长期以来至关重要，因为它提供了<code>transcend the influence</code>的手段，所针对的是邻州特殊利益的影响。<code>C</code>的<code>respecting state authorities</code>却把它解释为尊重州当局，并进一步说它树立了良好榜样。原句没有把<code>special interests</code>等同于州当局，也没有把“超越这些利益的影响”写成“尊重当局”；<code>C</code>改变了这项参与的对象与作用。</p>\n</section>"},{"title":"C. It has set a fine example of respecting state authorities.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n>\n> 仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。\n\n作者肯定EPA，是因为它能越过财力雄厚群体的局部利益，兼顾下游后果。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> It has set a fine example of respecting state authorities.\n>\n> EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。\n\nC需要怎样尊重州当局的内容。原段强调更广保护视野，未把这种参与作为服从或尊重地方当局的示范。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>special interests指邻州特殊利益群体，不等于州当局；transcend其影响也不能改成尊重州权的榜样。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。</p>\n</blockquote>\n<p><code>C</code>的<code>respecting state authorities</code>把参与的意义放在怎样对待州当局；第4段说这种参与能<code>transcend the influence</code>，并把影响归于邻州的特殊利益，回看对这项参与作解释的整句。</p>\n<p>原文说环境保护署的参与长期以来至关重要，因为它提供了<code>transcend the influence</code>的手段，所针对的是邻州特殊利益的影响。<code>C</code>的<code>respecting state authorities</code>却把它解释为尊重州当局，并进一步说它树立了良好榜样。原句没有把<code>special interests</code>等同于州当局，也没有把“超越这些利益的影响”写成“尊重当局”；<code>C</code>改变了这项参与的对象与作用。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n<p>仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。</p>\n</blockquote>\n<p>作者肯定EPA，是因为它能越过财力雄厚群体的局部利益，兼顾下游后果。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has set a fine example of respecting state authorities.</p>\n<p>EPA参与切萨皮克湾项目树立尊重州当局的良好榜样。</p>\n</blockquote>\n<p>C需要怎样尊重州当局的内容。原段强调更广保护视野，未把这种参与作为服从或尊重地方当局的示范。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. It has ensured the coordination of protection efforts.","raw":"### D. It has ensured the coordination of protection efforts.\n\n> EPA参与切萨皮克湾项目保障保护行动之间的协调。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n上游决定影响另一州下游，EPA能超越地方特殊利益，D据此概括它对跨地区保护协调的保障作用。\n\n**出处：**\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目保障保护行动之间的协调。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>上游决定影响另一州下游，EPA能超越地方特殊利益，D据此概括它对跨地区保护协调的保障作用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section>"},{"title":"D. It has ensured the coordination of protection efforts.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> EPA参与切萨皮克湾项目保障保护行动之间的协调。\n\n`D`的`coordination of protection efforts`涉及不同地方的保护怎样兼顾彼此；第4段的`transcend the influence`说明这种参与为何重要，后面的`have enormous impact downstream`解释上游选择为什么不能只顾当地，合看这两句。\n\n原文说环境保护署的参与一直至关重要，理由是它能`transcend the influence`，超越邻州特殊利益的影响。随后举例：上游农民决定是否撒动物粪便时，不考虑另一个州的蓝蟹收成，但径流会对下游产生巨大影响。\n\n`D`的`coordination of protection efforts`把这种跨地方兼顾影响的作用概括为协调保护行动。\n\n原文没有直接使用“协调”这个词，但它把各地只考虑自身的做法与环境保护署超越这些影响的作用并列起来，能够推知该署的参与为保护行动之间的协调提供保障。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>EPA参与切萨皮克湾项目保障保护行动之间的协调。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>上游决定影响另一州下游，EPA能超越地方特殊利益，D据此概括它对跨地区保护协调的保障作用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>EPA参与切萨皮克湾项目保障保护行动之间的协调。</p>\n</blockquote>\n<p><code>D</code>的<code>coordination of protection efforts</code>涉及不同地方的保护怎样兼顾彼此；第4段的<code>transcend the influence</code>说明这种参与为何重要，后面的<code>have enormous impact downstream</code>解释上游选择为什么不能只顾当地，合看这两句。</p>\n<p>原文说环境保护署的参与一直至关重要，理由是它能<code>transcend the influence</code>，超越邻州特殊利益的影响。随后举例：上游农民决定是否撒动物粪便时，不考虑另一个州的蓝蟹收成，但径流会对下游产生巨大影响。</p>\n<p><code>D</code>的<code>coordination of protection efforts</code>把这种跨地方兼顾影响的作用概括为协调保护行动。</p>\n<p>原文没有直接使用“协调”这个词，但它把各地只考虑自身的做法与环境保护署超越这些影响的作用并列起来，能够推知该署的参与为保护行动之间的协调提供保障。</p>\n</section>"},{"title":"D. It has ensured the coordination of protection efforts.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n>\n> 仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。\n\n农田与蓝蟹例子揭示单地决策的盲点，正说明为什么EPA长期参与至关重要。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> It has ensured the coordination of protection efforts.\n>\n> EPA参与切萨皮克湾项目保障保护行动之间的协调。\n\ncoordination虽未原词出现，却承接跨州影响与超越局部利益的关系；不应再扩大成所有矛盾已消失或各州措施完全一致。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘", tion class=\"revealPart\" id=\"focus-question-39-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n<p>仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。</p>\n</blockquote>\n<p>农田与蓝蟹例子揭示单地决策的盲点，正说明为什么EPA长期参与至关重要。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has ensured the coordination of protection efforts.</p>\n<p>EPA参与切萨皮克湾项目保障保护行动之间的协调。</p>\n</blockquote>\n<p>coordination虽未原词出现，却承接跨州影响与超越局部利益的关系；不应再扩大成所有矛盾已消失或各州措施完全一致。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. D**\n\n- A：EPA超越邻州财力雄厚群体的影响，原文没有说已恢复辖区间的某种平衡，A改变了作用对象与结果。\n- B：蓝蟹收成是上游施肥可能损害的下游利益，B却把它改成EPA引发商业渔业彻底改革。\n- C：special interests指邻州特殊利益群体，不等于州当局；transcend其影响也不能改成尊重州权的榜样。\n- D：上游决定影响另一州下游，EPA能超越地方特殊利益，D据此概括它对跨地区保护协调的保障作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1260,1344,428],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"39","questionConclusion":true},"html":"<blockquote>\n<p><strong>39. D</strong></p>\n</blockquote>\n<ul>\n<li>A：EPA超越邻州财力雄厚群体的影响，原文没有说已恢复辖区间的某种平衡，A改变了作用对象与结果。</li>\n<li>B：蓝蟹收成是上游施肥可能损害的下游利益，B却把它改成EPA引发商业渔业彻底改革。</li>\n<li>C：special interests指邻州特殊利益群体，不等于州当局；transcend其影响也不能改成尊重州权的榜样。</li>\n<li>D：上游决定影响另一州下游，EPA能超越地方特殊利益，D据此概括它对跨地区保护协调的保障作用。</li>\n</ul>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n> The author holds that the state lawmakers should ______.\n>\n> 作者认为州立法者应当______。\n\n### 题型\n\n建议理解题：抓call on之后的行动对象，再用参观保护区解释为何这样呼吁。\n\n题干中的state lawmakers直接出现在第5段开头，作者在那里用call on提出呼吁。把末段完整读一遍，看他要求立法者做什么，以及随后为什么邀请他们去参观。\n\n### 核心出处\n\n> to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.\n>\n> transcend the influence of deep-pocketed special interests in neighboring states\n>\n> call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"40","questionIntro":true},"html":"<blockquote>\n<p>The author holds that the state lawmakers should ______.</p>\n<p>作者认为州立法者应当______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>建议理解题：抓call on之后的行动对象，再用参观保护区解释为何这样呼吁。</p>\n<p>题干中的state lawmakers直接出现在第5段开头，作者在那里用call on提出呼吁。把末段完整读一遍，看他要求立法者做什么，以及随后为什么邀请他们去参观。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.</p>\n<p>transcend the influence of deep-pocketed special interests in neighboring states</p>\n<p>call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections</p>\n</blockquote>\n"},{"title":"A. be cautious about the influence of landowners","raw":"### A. be cautious about the influence of landowners\n\n> 作者认为州立法者应当警惕土地所有者的影响。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。\n\n**出处：**\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n> And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It's worth the scenic drive.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>作者认为州立法者应当警惕土地所有者的影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\nAnd so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It&#39;s worth the scenic drive.</p>\n</blockquote>\n</section>"},{"title":"A. be cautious about the influence of landowners","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为州立法者应当警惕土地所有者的影响。\n\n土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。\n\nAnd so承接跨州保护不足，作者随即呼吁检查各州保障并认识重大利害。\n\nA在避免狭窄利益这一背景上有关联，但不能替代更完整、明确的湿地保护行动要求；B更贴近call on之后的内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>作者认为州立法者应当警惕土地所有者的影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\nAnd so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It&#39;s worth the scenic drive.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为州立法者应当警惕土地所有者的影响。</p>\n</blockquote>\n<p>土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。</p>\n<p>And so承接跨州保护不足，作者随即呼吁检查各州保障并认识重大利害。</p>\n<p>A在避免狭窄利益这一背景上有关联，但不能替代更完整、明确的湿地保护行动要求；B更贴近call on之后的内容。</p>\n</section>"},{"title":"A. be cautious about the influence of landowners","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n> And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It's worth the scenic drive.\n>\n> 仅把这类裁决看成维护土地所有者权利，很容易也很误导，因为邻居可能承受严重后果。这也提醒我们，EPA参与切萨皮克湾项目一直至关重要，是超越邻州财力雄厚特殊利益影响的手段。一个有说服力的例子是：宾夕法尼亚农民决定是否向地里撒动物粪便时，不会想着次年马里兰蓝蟹收成，但流入附近溪流的径流会对下游产生巨大影响。\n>\n> 因此我们呼吁从里士满到奥尔巴尼的州立法者考虑重新审视各自湿地保护，亲自认识其中的重大利害。可以邀请他们参观多切斯特县的黑水国家野生动物保护区，白头鹰飞过潮汐沼泽，水浅到划不了船，却充满水生生命。这趟景色优美的车程值得一走。\n\nAnd so承接跨州保护不足，作者随即呼吁检查各州保障并认识重大利害。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> State lawmakers should be cautious about the influence of landowners.\n>\n> 作者认为州立法者应当警惕土地所有者的影响。\n\nA在避免狭窄利益这一背景上有关联，但不能替代更完整、明确的湿地保护行动要求；B更贴近call on之后的内容。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>作者认为州立法者应当警惕土地所有者的影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states. Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\nAnd so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands oss them but teeming with aquatic life. It&#39;s worth the scenic drive.</p>\n<p>因此我们呼吁从里士满到奥尔巴尼的州立法者考虑重新审视各自湿地保护，亲自认识其中的重大利害。可以邀请他们参观多切斯特县的黑水国家野生动物保护区，白头鹰飞过潮汐沼泽，水浅到划不了船，却充满水生生命。这趟景色优美的车程值得一走。</p>\n</blockquote>\n<p>作者先直接提出审视保护的呼吁，再邀请看保护区，用真实生态价值说明利害。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State lawmakers should attach due importance to wetlands protections.</p>\n<p>作者认为州立法者应当给予湿地保护应有的重视。</p>\n</blockquote>\n<p>attach due importance不只是口头赞扬，也能涵盖重新审视措施的认真态度；与末段行动及理由均相合。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. recognize the need to expand wildlife refuges","raw":"### C. recognize the need to expand wildlife refuges\n\n> 作者认为州立法者应当认识到扩建野生动物保护区的必要性。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n邀请参观现有保护区，是让立法者认识湿地价值；C换成扩大保护区面积这一建设或划界计划。\n\n**出处：**\n\n> And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It's worth the scenic drive.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>作者认为州立法者应当认识到扩建野生动物保护区的必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>邀请参观现有保护区，是让立法者认识湿地价值；C换成扩大保护区面积这一建设或划界计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for 是这样写的：\n\n> And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It's worth the scenic drive.\n>\n> 因此我们呼吁从里士满到奥尔巴尼的州立法者考虑重新审视各自湿地保护，亲自认识其中的重大利害。可以邀请他们参观多切斯特县的黑水国家野生动物保护区，白头鹰飞过潮汐沼泽，水浅到划不了船，却充满水生生命。这趟景色优美的车程值得一走。\n\n作者用潮汐沼泽里的丰富生命展示生态价值，服务于前句审视湿地保护的呼吁。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> State lawmakers should improve the wellbeing of endangered species.\n>\n> 作者认为州立法者应当改善濒危物种的生存状况。\n\nD既另加濒危状态，也把综合保护范围缩为特定物种。不能因生物需要保护就假定文中它们都是濒危的。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>作者认为州立法者应当改善濒危物种的生存状况。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、D，此时D尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>aquatic life指水生生命，不等于endangered species濒危物种；末段要求重视整体湿地保障，没有另设濒危物种改善计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It&#39;s worth the scenic drive.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为州立法者应当改善濒危物种的生存状况。</p>\n</blockquote>\n<p>aquatic life指水生生命，不等于endangered species濒危物种；末段要求重视整体湿地保障，没有另设濒危物种改善计划。</p>\n<p>作者用潮汐沼泽里的丰富生命展示生态价值，服务于前句审视湿地保护的呼吁。</p>\n<p>D既另加濒危状态，也把综合保护范围缩为特定物种。不能因生物需要保护就假定文中它们都是濒危的。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life. It&#39;s worth the scenic drive.</p>\n<p>因此我们呼吁从里士满到奥尔巴尼的州立法者考虑重新审视各自湿地保护，亲自认识其中的重大利害。可以邀请他们参观多切斯特县的黑水国家野生动物保护区，白头鹰飞过潮汐沼泽，水浅到划不了船，却充满水生生命。这趟景色优美的车程值得一走。</p>\n</blockquote>\n<p>作者用潮汐沼泽里的丰富生命展示生态价值，服务于前句审视湿地保护的呼吁。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State lawmakers should improve the wellbeing of endangered species.</p>\n<p>作者认为州立法者应当改善濒危物种的生存状况。</p>\n</blockquote>\n<p>D既另加濒危状态，也把综合保护范围缩为特定物种。不能因生物需要保护就假定文中它们都是濒危的。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. B**\n\n- A：土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。\n- B：reviewing their own wetlands protections与认识enormous stakes共同要求认真对待湿地保护，B完整概括对象与态度。\n- C：邀请参观现有保护区，是让立法者认识湿地价值；C换成扩大保护区面积这一建设或划界计划。\n- D：aquatic life指水生生命，不等于endangered species濒危物种；末段要求重视整体湿地保障，没有另设濒危物种改善计划。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. B</strong></p>\n</blockquote>\n<ul>\n<li>A：土地所有者权利与特殊利益影响是前段解释背景，末段对立法者的直接要求是审视湿地保护，A只抓住其中一类利益。</li>\n<li>B：reviewing their own wetlands protections与认识enormous stakes共同要求认真对待湿地保护，B完整概括对象与态度。</li>\n<li>C：邀请参观现有保护区，是让立法者认识湿地价值；C换成扩大保护区面积这一建设或划界计划。</li>\n<li>D：aquatic life指水生生命，不等于endangered species濒危物种；末段要求重视整体湿地保障，没有另设濒危物种改善计划。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：切萨皮克湾的生态价值**（段落1生态描述） 切萨皮克湾的奇迹：【不在深度 // 而在于：（自然构造的复杂性 + 淡咸水相互作用 + 陆水混合）】→ 浅滩的多重功能：（为数百物种提供栖息地 + 储存洪水 + 过滤污染物 + 保护社区免受风暴潮）\n\n↓（威胁出现）\n\n**逻辑层次2：最高法院裁决带来的威胁**（段落2法律变化） 上月底最高法院裁决：【爱达荷州案件 → EPA监管权力大幅削减：（湿地必须与水体有\"连续表面连接\"才受保护）】→ 影响：（监管范围缩小 = 商业利益集团的胜利）→ 后果：对全美水质和洪水控制产生重大影响\n\n↓（地方层面的问题）\n\n**逻辑层次3：跨州界的环境挑战**（段落3区域困境） 马里兰州的短视：（虽有州法保护 // 但水和污染物不尊重州界）→ 切萨皮克湾的现实：【流域涵盖64,000平方英里（涉及6个州和特区）】→ 关键问题：其他司法管辖区会提供同样保护吗？→ 答案：不太可能\n\n↓（深层影响）\n\n**逻辑层次4：EPA作用的重要性**（段落4协调机制） 法院裁决的误导性：（不仅是维护土地所有者权利）→ EPA在切萨皮克湾计划中的关键作用：【超越邻州特殊利益集团影响的手段】→ 具体例子：宾州农民施肥不考虑马里兰蓝蟹 // 但径流影响巨大\n\n↓（行动呼吁）\n\n**逻辑层次5：对立法者的呼吁**（段落5解决方案） 呼吁各州立法者：（审查湿地保护法规 + 认识利害关系的重要性）→ 邀请参观黑水野生动物保护区：【浅滩虽浅却生机勃勃（白头鹰飞翔 + 水生生物丰富）】→ 结论：值得为保护付出努力\n\n↑（全文主旨）\n\n全文核心观点：最高法院削弱EPA监管权力的裁决威胁到切萨皮克湾的生态系统，由于水污染跨州界的特性，需要各州立法者认识到湿地保护的重要性并采取协调一致的行动。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：切萨皮克湾的生态价值</strong>（段落1生态描述） 切萨皮克湾的奇迹：【不在深度 // 而在于：（自然构造的复杂性 + 淡咸水相互作用 + 陆水混合）】→ 浅滩的多重功能：（为数百物种提供栖息地 + 储存洪水 + 过滤污染物 + 保护社区免受风暴潮）</p>\n<p>↓（威胁出现）</p>\n<p><strong>逻辑层次2：最高法院裁决带来的威胁</strong>（段落2法律变化） 上月底最高法院裁决：【爱达荷州案件 → EPA监管权力大幅削减：（湿地必须与水体有&quot;连续表面连接&quot;才受保护）】→ 影响：（监管范围缩小 = 商业利益集团的胜利）→ 后果：对全美水质和洪水控制产生重大影响</p>\n<p>↓（地方层面的问题）</p>\n<p><strong>逻辑层次3：跨州界的环境挑战</strong>（段落3区域困境） 马里兰州的短视：（虽有州法保护 // 但水和污染物不尊重州界）→ 切萨皮克湾的现实：【流域涵盖64,000平方英里（涉及6个州和特区）】→ 关键问题：其他司法管辖区会提供同样保护吗？→ 答案：不太可能</p>\n<p>↓（深层影响）</p>\n<p><strong>逻辑层次4：EPA作用的重要性</strong>（段落4协调机制） 法院裁决的误导性：（不仅是维护土地所有者权利）→ EPA在切萨皮克湾计划中的关键作用：【超越邻州特殊利益集团影响的手段】→ 具体例子：宾州农民施肥不考虑马里兰蓝蟹 // 但径流影响巨大</p>\n<p>↓（行动呼吁）</p>\n<p><strong>逻辑层次5：对立法者的呼吁</strong>（段落5解决方案） 呼吁各州立法者：（审查湿地保护法规 + 认识利害关系的重要性）→ 邀请参观黑水野生动物保护区：【浅滩虽浅却生机勃勃（白头鹰飞翔 + 水生生物丰富）】→ 结论：值得为保护付出努力</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：最高法院削弱EPA监管权力的裁决威胁到切萨皮克湾的生态系统，由于水污染跨州界的特性，需要各州立法者认识到湿地保护的重要性并采取协调一致的行动。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Natural complexity with benefits for life and communities\n\n> 有益于生物和社区的自然复杂性\n\n海湾价值来自淡咸水、陆水相互作用，浅滩为生物提供栖息地并减洪、净水和保护社区。\n\n> The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water.\n\nnot in...but in将奇妙之处从深度转到水陆和淡咸水交融，浅并不意味着价值低。\n\n> The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.\n\n生物栖息、蓄洪、滤污和保护社区具体展开价值，标题要兼顾生态与居民受益。\n\n这一部分的推进关系是：\n\n> 自然关系复杂 → 浅水发挥多项作用 → 物种与社区共同受益\n\nnatural complexity对应构造与相互作用，benefits覆盖生态与社区两类作用。\n\n再看最强干扰项G：A proposal to expand all wildlife refuges。\n\n此段展示已有自然价值，没有提出扩建保护区。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Natural complexity with benefits for life and communities</p>\n<blockquote>\n<p>有益于生物和社区的自然复杂性</p>\n</blockquote>\n<p>海湾价值来自淡咸水、陆水相互作用，浅滩为生物提供栖息地并减洪、净水和保护社区。</p>\n<blockquote>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water.</p>\n</blockquote>\n<p>not in...but in将奇妙之处从深度转到水陆和淡咸水交融，浅并不意味着价值低。</p>\n<blockquote>\n<p>The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.</p>\n</blockquote>\n<p>生物栖息、蓄洪、滤污和保护社区具体展开价值，标题要兼顾生态与居民受益。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>自然关系复杂 → 浅水发挥多项作用 → 物种与社区共同受益</p>\n</blockquote>\n<p>natural complexity对应构造与相互作用，benefits覆盖生态与社区两类作用。</p>\n<p>再看最强干扰项G：A proposal to expand all wildlife refuges。</p>\n<p>此段展示已有自然价值，没有提出扩建保护区。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. A court decision that narrows environmental authority\n\n> 缩小环境监管权的法院裁决\n\n法院裁决要求连续地表水连接，使EPA权力与保护范围收窄，对商业利益有利却影响水质防洪。\n\n> All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways.\n\nAll this回指首段自然价值，法院裁决减少监管权使这些价值面临风险。\n\n> Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a \"continuous surface connection\" to bodies of water.\n\ncontinuous surface connection成为受保护的条件，具体解释范围为何收窄。\n\n> And it carries \"significant repercussions for water quality and flood control throughout the United States,\" as Justice Brett Kavanaugh observed.\n\n水质与防洪的重大后果说明收窄不仅涉及法律边界，也影响现实保护。\n\n这一部分的推进关系是：\n\n> 裁决削减EPA权力 → 湿地保护条件变窄 → 水质与防洪面临后果\n\nnarrows environmental authority直接概括far less authority及narrowing，保留裁决方向。\n\n再看最强干扰项F：A guarantee that every state will adopt the same rules。\n\n这里是联邦监管被限制，不是各州达成统一规则。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. A court decision that narrows environmental authority</p>\n<blockquote>\n<p>缩小环境监管权的法院裁决</p>\n</blockquote>\n<p>法院裁决要求连续地表水连接，使EPA权力与保护范围收窄，对商业利益有利却影响水质防洪。</p>\n<blockquote>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways.</p>\n</blockquote>\n<p>All this回指首段自然价值，法院裁决减少监管权使这些价值面临风险。</p>\n<blockquote>\n<p>Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water.</p>\n</blockquote>\n<p>continuous surface connection成为受保护的条件，具体解释范围为何收窄。</p>\n<blockquote>\n<p>And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh observed.</p>\n</blockquote>\n<p>水质与防洪的重大后果说明收窄不仅涉及法律边界，也影响现实保护。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>裁决削减EPA权力 → 湿地保护条件变窄 → 水质与防洪面临后果</p>\n</blockquote>\n<p>narrows environmental authority直接概括far less authority及narrowing，保留裁决方向。</p>\n<p>再看最强干扰项F：A guarantee that every state will adopt the same rules。</p>\n<p>这里是联邦监管被限制，不是各州达成统一规则。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. Why protection cannot stop at a state boundary\n\n> 保护为何不能止步于州界\n\n马里兰州法只是局部利好，水及污染跨州流动，其他辖区未必都补上同等保护。\n\n> In Maryland, the good news is that there are many state laws in place that provide wetlands protections.\n\n州法利好只覆盖马里兰，But随后以水和污染跨州纠正局部看法。\n\n> Will those jurisdictions extend the same protections now denied under Sackett v. EPA?\n\n问题追问其他辖区能否补上同等保障，要求把全流域放在一起看。\n\n> That seems unlikely.\n\nunlikely否定的是全部都提供同等保护的乐观预期，标题应突出州界不足以隔断风险。\n\n这一部分的推进关系是：\n\n> 一州有法 → 流域与污染跨界 → 全部辖区保护无法保证\n\ncannot stop对应自然流域跨越行政边界，解释为何单州已有法律仍不足。\n\n再看最强干扰项F：A guarantee that every state will adopt the same rules。\n\n作者以Perhaps some, but all?明确怀疑所有辖区都会落实。\n\n**43题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. Why protection cannot stop at a state boundary</p>\n<blockquote>\n<p>保护为何不能止步于州界</p>\n</blockquote>\n<p>马里兰州法只是局部利好，水及污染跨州流动，其他辖区未必都补上同等保护。</p>\n<blockquote>\n<p>In Maryland, the good news is that there are many state laws in place that provide wetlands protections.</p>\n</blockquote>\n<p>州法利好只覆盖马里兰，But随后以水和污染跨州纠正局部看法。</p>\n<blockquote>\n<p>Will those jurisdictions extend the same protections now denied under Sackett v. EPA?</p>\n</blockquote>\n<p>问题追问其他辖区能否补上同等保障，要求把全流域放在一起看。</p>\n<blockquote>\n<p>That seems unlikely.</p>\n</blockquote>\n<p>unlikely否定的是全部都提供同等保护的乐观预期，标题应突出州界不足以隔断风险。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>一州有法 → 流域与污染跨界 → 全部辖区保护无法保证</p>\n</blockquote>\n<p>cannot stop对应自然流域跨越行政边界，解释为何单州已有法律仍不足。</p>\n<p>再看最强干扰项F：A guarantee that every state will adopt the same rules。</p>\n<p>作者以Perhaps some, but all?明确怀疑所有辖区都会落实。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】D. The federal role in overcoming narrow local interests\n\n> 联邦参与超越狭窄地方利益的作用\n\n仅从土地所有者权利看裁决会忽视邻州后果，EPA参与有助超越特殊利益，农田径流就是例子。\n\n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.\n\n土地权利视角忽视邻居的严重后果，作者先指出这种解释的局限。\n\n> And it's a reminder that the EPA's involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states.\n\nEPA可以超越财力雄厚的地方利益，说明跨区域参与的必要。\n\n> Pennsylvania farmers, to use one telling example, aren't thinking about next year's blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.\n\n农民不考虑另一州蓝蟹而径流仍影响下游，具体展示需要协调的利益联系。\n\n这一部分的推进关系是：\n\n> 只顾土地权利有局限 → EPA超越地方利益 → 农田与蓝蟹说明跨州影响\n\nfederal role对接EPA参与，narrow local interests对接农民不顾下游蓝蟹收成的行为。\n\n再看最强干扰项A：Why protection cannot stop at a state boundary。\n\nA概括上一段跨界问题，本段进一步解释协调保护所需的EPA作用。\n\n**44题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】D. The federal role in overcoming narrow local interests</p>\n<blockquote>\n<p>联邦参与超越狭窄地方利益的作用</p>\n</blockquote>\n<p>仅从土地所有者权利看裁决会忽视邻州后果，EPA参与有助超越特殊利益，农田径流就是例子。</p>\n<blockquote>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.</p>\n</blockquote>\n<p>土地权利视角忽视邻居的严重后果，作者先指出这种解释的局限。</p>\n<blockquote>\n<p>And it&#39;s a reminder that the EPA&#39;s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states.</p>\n</blockquote>\n<p>EPA可以超越财力雄厚的地方利益，说明跨区域参与的必要。</p>\n<blockquote>\n<p>Pennsylvania farmers, to use one telling example, aren&#39;t thinking about next year&#39;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.</p>\n</blockquote>\n<p>农民不考虑另一州蓝蟹而径流仍影响下游，具体展示需要协调的利益联系。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>只顾土地权利有局限 → EPA超越地方利益 → 农田与蓝蟹说明跨州影响</p>\n</blockquote>\n<p>federal role对接EPA参与，narrow local interests对接农民不顾下游蓝蟹收成的行为。</p>\n<p>再看最强干扰项A：Why protection cannot stop at a state boundary。</p>\n<p>A概括上一段跨界问题，本段进一步解释协调保护所需的EPA作用。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. A direct appeal to review wetland safeguards\n\n> 直接呼吁审视湿地保障措施\n\n作者呼吁多个州的立法者审视保护措施，并邀请他们亲看潮汐沼泽及其丰富生命。\n\n> And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.\n\nAnd so由前文风险推出审视本州保护的呼吁，enormous stakes强调重大利害。\n\n> We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life.\n\n邀请参观丰富生命的浅沼泽，让立法者直接理解保护价值，不是新增扩建方案。\n\n> It's worth the scenic drive.\n\nworth将现场认识价值写成值得采取的行动，收束劝说。\n\n这一部分的推进关系是：\n\n> 呼吁审视湿地保障 → 邀请现场了解生态 → 推动认真认识利害\n\ndirect appeal对应call on，review保留明确行动，不把参观改成扩建。\n\n再看最强干扰项G：A proposal to expand all wildlife refuges。\n\n参观现有保护区服务于认识价值，没有提面积不足或扩建任务。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. A direct appeal to review wetland safeguards</p>\n<blockquote>\n<p>直接呼吁审视湿地保障措施</p>\n</blockquote>\n<p>作者呼吁多个州的立法者审视保护措施，并邀请他们亲看潮汐沼泽及其丰富生命。</p>\n<blockquote>\n<p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.</p>\n</blockquote>\n<p>And so由前文风险推出审视本州保护的呼吁，enormous stakes强调重大利害。</p>\n<blockquote>\n<p>We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teeming with aquatic life.</p>\n</blockquote>\n<p>邀请参观丰富生命的浅沼泽，让立法者直接理解保护价值，不是新增扩建方案。</p>\n<blockquote>\n<p>It&#39;s worth the scenic drive.</p>\n</blockquote>\n<p>worth将现场认识价值写成值得采取的行动，收束劝说。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>呼吁审视湿地保障 → 邀请现场了解生态 → 推动认真认识利害</p>\n</blockquote>\n<p>direct appeal对应call on，review保留明确行动，不把参观改成扩建。</p>\n<p>再看最强干扰项G：A proposal to expand all wildlife refuges。</p>\n<p>参观现有保护区服务于认识价值，没有提面积不足或扩建任务。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 介绍海湾自然联系及生态社区价值 |\n| B | 转向州立法者审视保护并现场认识价值 |\n| C | 阐释EPA跨越地方特殊利益的协调价值 |\n| D | 指出单州法律无法阻断跨界污染 |\n| E | 说明保护不齐与单看土地权利的局限 |\n| F | 用农田径流与下游收成解释外部影响 |\n| G | 用保护范围引入裁决带来的监管收窄 |\n| H |  might initially appear well placed to answer those questions.\n\nthose questions接水质和防洪疑问，下一段先引入州法看似可应对的情况。\n\n这三段的推进关系：\n\n> 介绍海湾自然联系及生态社区价值 → 用保护范围引入裁决带来的监管收窄 → 指出单州法律无法阻断跨界污染\n\n再检验候选F：\n\n> People elsewhere include those whose livelihoods depend on downstream waters.\n\nPeople elsewhere需要先引出权利与外地后果，此时前文只有生态收益，无法接上这个人群指代。\n\n**41题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>41题是全文第2段，局部关系为A → G → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>These relationships support many species and help neighbouring communities by storing floodwater, filtering pollution and reducing damage from storms.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Those benefits depend in part on protection that extends beyond the water visible at one location.</p>\n</blockquote>\n<p>Those benefits指前文栖息、蓄洪和保护居民的收益，转而提出保障这些收益的条件。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A Supreme Court decision narrowed the federal agency’s authority by requiring a continuous surface connection for protected wetlands. The restriction therefore raises questions about water quality and flood control.</p>\n</blockquote>\n<p>裁决要求连续地表连接，从保护条件解释权力收窄及其水质防洪问题。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>A state with its own wetland laws might initially appear well placed to answer those questions.</p>\n</blockquote>\n<p>those questions接水质和防洪疑问，下一段先引入州法看似可应对的情况。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍海湾自然联系及生态社区价值 → 用保护范围引入裁决带来的监管收窄 → 指出单州法律无法阻断跨界污染</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>People elsewhere include those whose livelihoods depend on downstream waters.</p>\n</blockquote>\n<p>People elsewhere需要先引出权利与外地后果，此时前文只有生态收益，无法接上这个人群指代。</p>\n<p><strong>41题选G。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为G → D → E。\n\n先看前段G的结尾：\n\n> The restriction therefore raises questions about water quality and flood control.\n\n再看D段开头：\n\n> A state with its own wetland laws might initially appear well placed to answer those questions.\n\nthose questions回指上一段水质防洪问题，州法提供看似可靠的答复。\n\n本段内部继续写道：\n\n> Yet that reassurance is limited when the bay receives water from a watershed spanning several jurisdictions. Pollution carried across a boundary is not stopped by the existence of a law on only one side.\n\nYet限制这种安心感，多辖区流域和跨界污染解释单边法律为何不足。\n\n后段E开头是：\n\n> The limitation matters because all the neighbouring jurisdictions may not provide equivalent safeguards.\n\nThe limitation回指局部法不能阻断污染，进一步转向各州保障未必齐全。\n\n这三段的推进关系：\n\n> 用保护范围引入裁决带来的监管收窄 → 指出单州法律无法阻断跨界污染 → 说明保护不齐与单看土地权利的局限\n\n再检验候选F：\n\n> People elsewhere include those whose livelihoods depend on downstream waters.\n\n外地人的生计例子属于后面具体展示跨州后果，此处先要说明州法保障为何有限。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为G → D → E。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The restriction therefore raises questions about water quality and flood control.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>A state with its own wetland laws might initially appear well placed to answer those questions.</p>\n</blockquote>\n<p>those questions回指上一段水质防洪问题，州法提供看似可靠的答复。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Yet that reassurance is limited when the bay receives water from a watershed spanning several jurisdictions. Pollution carried across a boundary is not stopped by the existence of a law on only one side.</p>\n</blockquote>\n<p>Yet限制这种安心感，多辖区流域和跨界污染解释单边法律为何不足。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The limitation matters because all the neighbouring jurisdictions may not provide equivalent safeguards.</p>\n</blockquote>\n<p>The limitation回指局部法不能阻断污染，进一步转向各州保障未必齐全。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用保护范围引入裁决带来的监管收窄 → 指出单州法律无法阻断跨界污染 → 说明保护不齐与单看土地权利的局限</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>People elsewhere include those whose livelihoods depend on downstream waters.</p>\n</blockquote>\n<p>外地人的生计例子属于后面具体展示跨州后果，此处先要说明州法保障为何有限。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → F → C。\n\n先看前段E的结尾：\n\n> Treating the federal decision simply as a victory for landowners can thus obscure consequences borne by people elsewhere.\n\n再看F段开头：\n\n> People elsewhere include those whose livelihoods depend on downstream waters.\n\nPeople elsewhere原词复现前句承受后果的外地人，随后具体到依赖下游水域谋生者。\n\n本段内部继续写道：\n\n> A farmer spreading animal waste in one state may give little thought to a crab harvest in another. Runoff nevertheless connects the decision on the field with conditions far beyond it.\n\n一州农民决策与另一州蓝蟹收成由径流相连，将抽象外部后果具体化。\n\n后段C开头是：\n\n> That connection helps explain the importance of federal involvement in the bay programme.\n\nThat connection回指径流把上游决定连到下游，成为解释联邦参与的理由。\n\n这三段的推进关系：\n\n> 说明保护不齐与单看土地权利的局限 → 用农田径流与下游收成解释外部影响 → 阐释EPA跨越地方特殊利益的协调价值\n\n再检验候选B：\n\n> State lawmakers should therefore review the protection they themselves provide and recognise what is at stake.\n\n直接呼吁立法者会越过待展开的外地后果，也使后句That connection失去具体连接。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>43题是全文第5段，局部关系为E → F → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Treating the federal decision simply as a victory for landowners can thus obscure consequences borne by people elsewhere.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>People elsewhere include those whose livelihoods depend on downstream waters.</p>\n</blockquote>\n<p>People elsewhere原词复现前句承受后果的外地人，随后具体到依赖下游水域谋生者。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A farmer spreading animal waste in one state may give little thought to a crab harvest in another. Runoff nevertheless connects the decision on the field with conditions far beyond it.</p>\n</blockquote>\n<p>一州农民决策与另一州蓝蟹收成由径流相连，将抽象外部后果具体化。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That connection helps explain the importance of federal involvement in the bay programme.</p>\n</blockquote>\n<p>That connection回指径流把上游决定连到下游，成为解释联邦参与的理由。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明保护不齐与单看土地权利的局限 → 用农田径流与下游收成解释外部影响 → 阐释EPA跨越地方特殊利益的协调价值</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>State lawmakers should therefore review the protection they themselves provide and recognise what is at stake.</p>\n</blockquote>\n<p>直接呼吁立法者会越过待展开的外地后果，也使后句That connection失去具体连接。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为F → C → B。\n\n先看前段F的结尾：\n\n> Runoff nevertheless connects the decision on the field with conditions far beyond it.\n\n再看C段开头：\n\n> That connection helps explain the importance of federal involvement in the bay programme.\n\nThat connection接农田径流与下游情况之间的联系，从例子转回联邦作用。\n\n本段内部继续写道：\n\n> A wider coordinating role can transcend the influence of well-funded local interests. Without such a perspective, separate decisions may fail to account for the shared water system through which their effects travel.\n\nwider coordinating role对照local interests，解释为何分散决策不足以照顾共同水系。\n\n后段B开头是：\n\n> State lawmakers should therefore review the protection they themselves provide and recognise what is at stake.\n\ntherefore由这种跨区需要推出州立法者审视保护的行动。\n\n这三段的推进关系：\n\n> 用农田径流与下游收成解释外部影响 → 阐释EPA跨越地方特殊利益的协调价值 → 转向州立法者审视保护并现场认识价值\n\n再检验候选G：\n\n> Those benefits depend in part on protection that extends beyond the water visible at one location.\n\nThose benefits属于首段功能到保护条件的过渡，放这里会重新开始已完成的裁决介绍。\n\n**44题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>44题是全文第6段，局部关系为F → C → B。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Runoff nevertheless connects the decision on the field with conditions far beyond it.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That connection helps explain the importance of federal involvement in the bay programme.</p>\n</blockquote>\n<p>That connection接农田径流与下游情况之间的联系，从例子转
