<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**The Chesapeake Bay is described in Paragraph 1 as ______.**\n\n> 第1段把切萨皮克湾描述为______。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,190,933,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>The Chesapeake Bay is described in Paragraph 1 as ______.</strong></p>\n<blockquote><p>第1段把切萨皮克湾描述为______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**The U.S. Supreme Court’s ruling in the Idaho case ______.**\n\n> 美国最高法院在爱达荷州案件中的裁决______。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,557,941,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>The U.S. Supreme Court’s ruling in the Idaho case ______.</strong></p>\n<blockquote><p>美国最高法院在爱达荷州案件中的裁决______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**How does the author feel about the future of the Chesapeake Bay?**\n\n> 作者怎样看待切萨皮克湾的未来？\n\n题型：**态度题**。","articleRects":[],"questionRects":[[226,924,1035,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>How does the author feel about the future of the Chesapeake Bay?</strong></p>\n<blockquote><p>作者怎样看待切萨皮克湾的未来？</p>\n</blockquote>\n<p>题型：<strong>态度题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?**\n\n> 关于环境保护署参与切萨皮克湾项目，可以推断出什么？\n\n题型：**推断题**。","articleRects":[],"questionRects":[[226,1292,1195,38],[281,1354,141,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?</strong></p>\n<blockquote><p>关于环境保护署参与切萨皮克湾项目，可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**The author holds that the state lawmakers should ______.**\n\n> 作者认为州立法者应当______。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[225,1720,776,31],[1008,1749,112,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>The author holds that the state lawmakers should ______.</strong></p>\n<blockquote><p>作者认为州立法者应当______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, yet, And so |\n| 态度词／评价词 | 先抓个大概好坏 | destructive, shortsighted, crucial |\n| 动作词 | 先看谁做了什么 | protecting, regulate, reviewing |\n| 结果词 | 看最后出了什么事 | risk, impact, consequences |\n| 重复主题词 | 大概知道老在说什么 | water, wetlands, protections |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, yet, And so</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>destructive, shortsighted, crucial</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>protecting, regulate, reviewing</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>risk, impact, consequences</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>water, wetlands, protections</td></tr></tbody></table>\n"},{"section":"读文章","raw":"The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and **[xxx]** waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm **[xxx]**.","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and <strong>[xxx]</strong> waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm <strong>[xxx]</strong>.</p>\n</div></div>"},{"section":"读文章","raw":"The miracle of the Chesapeake Bay lies not in its depths, / but in the complexity of its natural construction, / the interaction of fresh and **[xxx]** waters, / and the mix of land and water. / The shallows provide homes for hundreds of species while storing floodwaters, / filtering pollutants from water, / and protecting nearby communities from potentially destructive storm **[xxx]**.","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCover 、天然构造、过滤水中的污染物、保护附近社区；中间又出现面临巨大风险、少得多的权力、监管范围的收窄、建筑商的胜利；许多州法律、很短视的看法、给予同样的保护、那似乎不太可能；土地所有者的权利、后果可能很严重、田地上的动物粪便、对下游的巨大影响；结尾还有州立法者、审视本州的湿地保护、白头海雕飞过、如此浅的沼泽。</p>\n<p>到这里还不能自然地说清楚：浅水区、法院裁定与各州规定怎样联系，上游的做法会带来哪些影响，结尾希望谁做什么。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"36题","raw":"## 36题\n\n> The Chesapeake Bay is described in Paragraph 1 as ______.  \n> 第1段把切萨皮克湾描述为______。\n\n题干明确写了Paragraph 1，直接从第1段开头读到结尾，看作者怎样描述切萨皮克湾。\n\n> 原文参考：\n> \n> The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and **[xxx]** waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm **[xxx]**.\n> \n> 开始精读：\n> \n> The miracle of the Chesapeake Bay lies not in its depths, / but in the complexity of its natural construction, / the interaction of fresh and **[xxx]** waters, / and the mix of land and water. / The shallows provide homes for hundreds of species / while storing floodwaters, / filtering pollutants from water, / and protecting nearby communities from potentially destructive storm **[xxx]**.\n> \n> 切萨皮克湾的奇妙之处不在于它的深度， / 而在于其天然构造的复杂性， / 淡水与**[xxx]**水体之间的相互作用， / 以及陆地和水的交融。 / 浅水区为数百个物种提供栖息地， / 同时蓄存洪水， / 过滤水中的污染物， / 并保护附近社区免受可能具有破坏性的风暴**[xxx]**的影响。\n\n题干的is described要求概括第1段给切萨皮克湾写出的特点。前一句讲它的天然构造，后一句讲浅水区为物种和附近社区做了什么；空格要能接住这些实际描述。\n\n接下来按A—D逐项看。","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[[226,190,933,38],[280,251,497,31],[280,312,523,31],[280,373,538,38],[280,435,564,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"36","initialReadingPids":[0]},"html":"<h2>36题</h2>\n<blockquote><p>The Chesapeake Bay is described in Paragraph 1 as ______.<br />\n第1段把切萨皮克湾描述为______。</p>\n</blockquote>\n<p>题干明确写了Paragraph 1，直接从第1段开头读到结尾，看作者怎样描述切萨皮克湾。</p>\n<blockquote><p>原文参考：</p>\n<p>The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and <strong>[xxx]</strong> waters, and the mix of land and water. The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>The miracle of the Chesapeake Bay lies not in its depths, / but in the complexity of its natural construction, / the interaction of fresh and <strong>[xxx]</strong> waters, / and the mix of land and water. / The shallows provide homes for hundreds of species / while storing floodwaters, / filtering pollutants from water, / and protecting nearby communities from potentially destructive storm <strong>[xxx]</strong>.</p>\n<p>切萨皮克湾的奇妙之处不在于它的深度， / 而在于其天然构造的复杂性， / 淡水与<strong>[xxx]</strong>水体之间的相互作用， / 以及陆地和水的交融。 / 浅水区为数百个物种提供栖息地， / 同时蓄存洪水， / 过滤水中的污染物， / 并保护附近社区免受可能具有破坏性的风暴<strong>[xxx]</strong>的影响。</p>\n</blockquote>\n<p>题干的is described要求概括第1段给切萨皮克湾写出的特点。前一句讲它的天然构造，后一句讲浅水区为物种和附近社区做了什么；空格要能接住这些实际描述。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. a valuable natural environment\n\n> 一个宝贵的自然环境\n\n把A接回题干，它说的是：第1段把切萨皮克湾描述为一个宝贵的自然环境。\n\nA说宝贵的自然环境，回第1段看海湾给物种和人们带来什么。\n\n> The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities\n\n浅水区为数百种生物提供家园，还能储存洪水、过滤污染物、保护附近社区。作者开头还用miracle描述它的自然构造。\n\n这几项作用既关乎栖息环境，也关乎人类安全。valuable概括这些好处，natural environment则接住陆地与水体的组合。\n\n**提供栖息地、净水并保护社区，是否足以说明这个自然环境宝贵？**\n\n足以。A与第1段整体介绍一致，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[[280,251,497,31]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"36","paragraphPids":[0]},"html":"<h3>A. a valuable natural environment</h3>\n<blockquote><p>一个宝贵的自然环境</p>\n</blockquote>\n<p>把A接回题干，它说的是：第1段把切萨皮克湾描述为一个宝贵的自然环境。</p>\n<p>A说宝贵的自然环境，回第1段看海湾给物种和人们带来什么。</p>\n<blockquote><p>The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities</p>\n</blockquote>\n<p>浅水区为数百种生物提供家园，还能储存洪水、过滤污染物、保护附近社区。作者开头还用miracle描述它的自然构造。</p>\n<p>这几项作用既关乎栖息环境，也关乎人类安全。valuable概括这些好处，natural environment则接住陆地与水体的组合。</p>\n<p><strong>提供栖息地、净水并保护社区，是否足以说明这个自然环境宝贵？</strong></p>\n<p>足以。A与第1段整体介绍一致，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"36题","raw":"### B. a controversial conservation area\n\n> 一个有争议的保护区域\n\n把B接回题干，它说的是：第1段把切萨皮克湾描述为一个有争议的保护区域。\n\nB说有争议的保护区，回第1段看有没有不同意见。\n\n> the complexity of its natural construction\n\n> The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water\n\n这一段连续介绍自然构造和浅水区的好处，没有列出支持保护和反对保护的双方。也没有在这里把海湾作为某个法定保护区来定义。\n\n“很宝贵”可以从作用推出，“有争议”则还需要观点冲突。题干限定第1段，不能用后面的法律争论替换它的描写。\n\n**第1段本身展示了对这个区域的争议吗？**\n\n没有。B没有对应本段给出的描述。\n\n**第一轮判断：B排除。**","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[[280,312,523,31]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>B. a controversial conservation area</h3>\n<blockquote><p>一个有争议的保护区域</p>\n</blockquote>\n<p>把B接回题干，它说的是：第1段把切萨皮克湾描述为一个有争议的保护区域。</p>\n<p>B说有争议的保护区，回第1段看有没有不同意见。</p>\n<blockquote><p>the complexity of its natural construction</p>\n</blockquote>\n<blockquote><p>The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water</p>\n</blockquote>\n<p>这一段连续介绍自然构造和浅水区的好处，没有列出支持保护和反对保护的双方。也没有在这里把海湾作为某个法定保护区来定义。</p>\n<p>“很宝贵”可以从作用推出，“有争议”则还需要观点冲突。题干限定第1段，不能用后面的法律争论替换它的描写。</p>\n<p><strong>第1段本身展示了对这个区域的争议吗？</strong></p>\n<p>没有。B没有对应本段给出的描述。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. a place with commercial potential\n\n> 一个具有商业潜力的地方\n\n把C接回题干，它说的是：第1段把切萨皮克湾描述为一个具有商业潜力的地方。\n\nC说商业潜力，回第1段看列出的作用有没有经营收益。\n\n> provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities\n\n物种的家园、蓄洪、净水和社区保护，都是自然环境的作用。作者没有说能开发旅游、销售资源或获得利润。\n\n有价值不一定是在讲商业价值。A的valuable可以包住这些环境益处，C却把价值限定成了商机。\n\n**本段把海湾的好处换算成商业开发潜力了吗？**\n\n没有。C给自然益处加上了未提的商业方向。\n\n**第一轮判断：C排除。**","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[[280,373,538,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>C. a place with commercial potential</h3>\n<blockquote><p>一个具有商业潜力的地方</p>\n</blockquote>\n<p>把C接回题干，它说的是：第1段把切萨皮克湾描述为一个具有商业潜力的地方。</p>\n<p>C说商业潜力，回第1段看列出的作用有没有经营收益。</p>\n<blockquote><p>provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities</p>\n</blockquote>\n<p>物种的家园、蓄洪、净水和社区保护，都是自然环境的作用。作者没有说能开发旅游、销售资源或获得利润。</p>\n<p>有价值不一定是在讲商业价值。A的valuable可以包住这些环境益处，C却把价值限定成了商机。</p>\n<p><strong>本段把海湾的好处换算成商业开发潜力了吗？</strong></p>\n<p>没有。C给自然益处加上了未提的商业方向。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"36题","raw":"### D. a headache for nearby communities\n\n> 附近社区的一件头疼事\n\n把D接回题干，它说的是：第1段把切萨皮克湾描述为附近社区的一件头疼事。\n\nD说附近社区头疼，回第1段看communities前面的动作。\n\n> protecting nearby communities from potentially destructive storm **[xxx]**\n\n浅水区protecting nearby communities，使社区免受可能具有破坏性的风暴影响。造成风险的是风暴，海湾在这里起保护作用。\n\nD把保护社区的环境说成让社区烦恼的来源，和句子里的作用正好不同。\n\n**海湾在本段是给社区制造麻烦，还是帮助社区挡住风险？**\n\n是帮助抵挡风险。D说反了。\n\n**第一轮判断：D排除。**","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38]],"questionRects":[[280,435,564,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>D. a headache for nearby communities</h3>\n<blockquote><p>附近社区的一件头疼事</p>\n</blockquote>\n<p>把D接回题干，它说的是：第1段把切萨皮克湾描述为附近社区的一件头疼事。</p>\n<p>D说附近社区头疼，回第1段看communities前面的动作。</p>\n<blockquote><p>protecting nearby communities from potentially destructive storm <strong>[xxx]</strong></p>\n</blockquote>\n<p>浅水区protecting nearby communities，使社区免受可能具有破坏性的风暴影响。造成风险的是风暴，海湾在这里起保护作用。</p>\n<p>D把保护社区的环境说成让社区烦恼的来源，和句子里的作用正好不同。</p>\n<p><strong>海湾在本段是给社区制造麻烦，还是帮助社区挡住风险？</strong></p>\n<p>是帮助抵挡风险。D说反了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。第1段写出的栖息地、蓄洪、滤污和社区保护作用，可以概括为一个宝贵的自然环境。","articleRects":[],"questionRects":[[226,190,933,38],[280,251,497,31],[280,312,523,31],[280,373,538,38],[280,435,564,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。第1段写出的栖息地、蓄洪、滤污和社区保护作用，可以概括为一个宝贵的自然环境。</p>\n"},{"section":"37题","raw":"## 37题\n\n> The U.S. Supreme Court’s ruling in the Idaho case ______.  \n> 美国最高法院在爱达荷州案件中的裁决______。\n\n题干给出Supreme Court、ruling和Idaho case，第2段开头正是在说最高法院对爱达荷州案件的裁决。把第2段完整读一遍，了解裁决的内容及作者写出的影响。\n\n> 原文参考：\n> \n> All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a “continuous surface connection” to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries “significant **[xxx]** for water quality and flood control throughout the United States,” as Justice Brett Kavanaugh observed.\n> \n> 开始精读：\n> \n> All this was put at great risk late last month, / when the U.S. Supreme Court issued a ruling in an Idaho case / that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. / Specifically, / a 5-4 majority decided / that wetlands protected by the EPA under its Clean Water Act authority / must have a “continuous surface connection” to bodies of water. / This narrowing of the regulatory scope was a victory for builders, / mining operators and other commercial interests often at odds with environmental rules. / And it carries “significant **[xxx]** for water quality and flood control throughout the United States,” / as Justice Brett Kavanaugh observed.\n> \n> 所有这一切在上个月末都面临巨大风险， / 当时美国最高法院就爱达荷州的一起案件作出裁决， / 这项裁决使美国环境保护署监管湿地和水道的权力大为减少。 / 具体来说， / 以5-4形成的多数意见决定， / 由环境保护署依据《清洁水法》所赋予的权力保护的湿地， / 必须与水体存在“连续的地表连接”。 / 监管范围的这种收窄对建筑商而言是一场胜利， / 对采矿经营者和其他经常与环境规定相冲突的商业利益方也是如此。 / 而且它带来了“对美国全国水质与洪水控制而言重大的**[xxx]**”， / 正如布雷特·卡瓦诺大法官所指出的。\n\n题干要补的是这项ruling做了什么或带来了什么。第2段先说明环境保护署权力受到怎样的改变，接着写湿地必须满足的连接条件、监管范围和受到影响的利益方；要逐项核对这些具体关系。\n\n接下来按A—D逐项看。","articleRects":[[274,525,1122,38],[202,573,1193,38],[202,620,1184,39],[203,665,1193,46],[202,716,1194,39],[202,765,1189,38],[202,813,1192,38],[202,860,1192,39],[202,908,1011,39]],"questionRects":[[226,557,941,38],[280,618,531,38],[280,680,585,37],[280,741,626,37],[280,802,677,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"37","initialReadingPids":[1]},"html":"<h2>37题</h2>\n<blockquote><p>The U.S. Supreme Court’s ruling in the Idaho case ______.<br />\n美国最高法院在爱达荷州案件中的裁决______。</p>\n</blockquote>\n<p>题干给出Supreme Court、ruling和Idaho case，第2段开头正是在说最高法院对爱达荷州案件的裁决。把第2段完整读一遍，了解裁决的内容及作者写出的影响。</p>\n<blockquote><p>原文参考：</p>\n<p>All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a “continuous surface connection” to bodies of water. This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules. And it carries “significant <strong>[xxx]</strong> for water quality and flood control throughout the United States,” as Justice Brett Kavanaugh observed.</p>\n<p>开始精读：</p>\n<p>All this was put at great risk late last month, / when the U.S. Supreme Court issued a ruling in an Idaho case / that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways. / Specifically, / a 5-4 majority decided / that wetlands protected by the EPA under its Clean Water Act authority / must have a “continuous surface connection” to bodies of water. / This narrowing of the regulatory scope was a victory for builders, / mining operators and other commercia tions. / But that’s a very shortsighted view, / particularly when it comes to the Chesapeake Bay. / The reality is that water, / and the pollutants that so often come with it, / don’t respect state boundaries. / The Chesapeake draws from a 64,000-square-mile **[xxx]** / that extends into Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware. / Will those jurisdictions extend the same protections now denied under Sackett v. EPA? / Perhaps some, but all? / That seems unlikely.\n> \n> 在马里兰州， / 好消息是已经有许多州法律为湿地提供保护。 / 但这是一种非常短视的看法， / 尤其是涉及切萨皮克湾时。 / 实际情况是，水， / 以及常常随之而来的污染物， / 并不受州界约束。 / 切萨皮克湾从一片64,000平方英里的**[xxx]**获得来水， / 它延伸至弗吉尼亚州、宾夕法尼亚州、纽约州、西弗吉尼亚州、哥伦比亚特区和特拉华州。 / 这些辖区会提供在萨克特诉环境保护署一案中如今被否定的同样保护吗？ / 也许有些会，但全部都会吗？ / 那似乎不太可能。\n\n题干问作者对海湾未来的感受，不能只取第3段开头的good news。要连着看作者怎样评价马里兰已有保护、为什么谈到水和污染物跨州流动，以及他怎样回答各辖区能否一起提供保护。\n\n接下来按A—D逐项看。","articleRects":[[273,957,1123,38],[202,1005,1194,38],[202,1053,1194,38],[202,1101,1194,38],[202,1149,1194,38],[202,1197,1194,38],[202,1245,1195,38],[203,1293,915,38]],"questionRects":[[226,924,1035,38],[280,986,173,30],[280,1047,166,30],[280,1108,180,31],[280,1169,224,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"38","initialReadingPids":[2]},"html":"<h2>38题</h2>\n<blockquote><p>How does the author feel about the future of the Chesapeake Bay?<br />\n作者怎样看待切萨皮克湾的未来？</p>\n</blockquote>\n<p>题干问future of the Chesapeake Bay，粗读第3段时读到extend the same protections和That seems unlikely，那里正在追问接下来各辖区会不会继续提供保护。先把第3段从头读到尾，弄清作者是在什么情况下作出这个判断。</p>\n<blockquote><p>原文参考：</p>\n<p>In Maryland, the good news is that there are many state laws in place that provide wetlands protections. But that’s a very shortsighted view, particularly when it comes to the Chesapeake Bay. The reality is that water, and the pollutants that so often come with it, don’t respect state boundaries. The Chesapeake draws from a 64,000-square-mile <strong>[xxx]</strong> that extends into Virginia, Pennsylvania, New York, West Virgi 38","paragraphPids":[2]},"html":"<h3>D. Encouraged.</h3>\n<blockquote><p>受到鼓舞。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对切萨皮克湾的未来感到鼓舞。</p>\n<p>D说受鼓舞，回第3段看作者对其他辖区的预期。</p>\n<blockquote><p>the good news is that there are many state laws in place that provide wetlands protections. But that’s a very shortsighted view</p>\n</blockquote>\n<blockquote><p>Perhaps some, but all? That seems unlikely.</p>\n</blockquote>\n<p>作者没有预测各州会积极补上保护，相反认为所有辖区都提供同等保护不太可能。现有州法也被指出不足以让人安心。</p>\n<p>这不是看到进展而信心增加，而是看到现有措施覆盖不到的地方。</p>\n<p><strong>unlikely这样的判断是在增加作者对未来的信心吗？</strong></p>\n<p>不是。D与他指出的保护缺口不相合。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。污染物跨州流动，而作者不相信所有相关辖区都会给予同样保护，因此对海湾未来感到担忧。","articleRects":[],"questionRects":[[226,924,1035,38],[280,986,173,30],[280,1047,166,30],[280,1108,180,31],[280,1169,224,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。污染物跨州流动，而作者不相信所有相关辖区都会给予同样保护，因此对海湾未来感到担忧。</p>\n"},{"section":"39题","raw":"## 39题\n\n> What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?  \n> 关于环境保护署参与切萨皮克湾项目，可以推断出什么？\n\n题干明确给出the EPA’s involvement in the Chesapeake Bay Program，第4段中间原样出现这项参与。把第4段完整读完，看作者先怎样评价法院裁决，再怎样解释该署参与的重要性及农民的例子。\n\n> 原文参考：\n> \n> It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it’s a reminder that the EPA’s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of **[xxx]** special interests in neighboring states. Pennsylvania farmers, to use one **[xxx]** example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby **[xxx]** can have enormous impact downstream.\n> \n> 开始精读：\n> \n> It is too easy, and misleading, / to see such court rulings as merely standing up for the rights of land owners / when the consequences can be so dire for their neighbors. / And it’s a reminder / that the EPA’s involvement in the Chesapeake Bay Program has long been crucial / as the means to transcend the influence of **[xxx]** special interests in neighboring states. / Pennsylvania farmers, / to use one **[xxx]** example, / aren’t thinking about next year’s blue crab harvest in Maryland / when they decide whether to spread animal waste on their fields, / yet the runoff into nearby **[xxx]** can have enormous impact downstream.\n> \n> 这种看法过于简单，而且具有误导性， / 即认为这类法院裁决仅仅是在维护土地所有者的权利， / 而这些裁决对他们的邻居可能造成如此严重的后果。 / 而且这提醒了我们， / 环境保护署参与切萨皮克湾项目长期以来一直至关重要， / 因为这是一种超越邻州**[xxx]**特殊利益影响的手段。 / 宾夕法尼亚州的农民， / 拿一个**[xxx]**例子来说， / 并没有考虑马里兰州明年的蓝蟹收成， / 当他们决定是否在田地上撒动物粪便时， / 然而流入附近**[xxx]**的径流可能对下游产生巨大影响。\n\n题干要推断的是环境保护署参与这个项目的意义。第4段用has long been crucial评价这项参与，随后说明它与邻州特殊利益影响的关系，并用上游农田和下游蓝蟹收成说明为什么邻州的选择会牵涉海湾。\n\n接下来按A—D逐项看。","articleRects":[[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38]],"questionRects":[[226,1292,1195,38],[281,1354,141,37],[281,1414,916,38],[280,1476,872,37],[281,1537,853,37],[281,1598,806,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"39","initialReadingPids":[3]},"html":"<h2>39题</h2>\n<blockquote><p>What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?<br />\n关于环境保护署参与切萨皮克湾项目，可以推断出什么？</p>\n</blockquote>\n<p>题干明确给出the EPA’s involvement in the Chesapeake Bay Program，第4段中间原样出现这项参与。把第4段完整读完，看作者先怎样评价法院裁决，再怎样解释该署参与的重要性及农民的例子。</p>\n<blockquote><p>原文参考：</p>\n<p>It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors. And it’s a reminder that the EPA’s involvement in the nEPA参与的重要性在于超越邻州特殊利益的影响，处理一州行动给下游造成的后果。这里需要共同保护，不让各地只顾自己。\n\n原文没有交代辖区此前什么失衡，也没有宣布现在已恢复到某种平衡状态。协调作用不能直接替换成一个已完成的结果。\n\n**EPA能跨越地方利益，就证明各辖区间已恢复平衡吗？**\n\n不能。A加出了文中没有报告的完成结果。\n\n**第一轮判断：A排除。**","articleRects":[[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38]],"questionRects":[[281,1414,916,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>A. It has restored the balance among neighboring jurisdictions.</h3>\n<blockquote><p>它已使相邻辖区之间恢复了平衡。</p>\n</blockquote>\n<p>把A接回题干，它说的是：环境保护署参与切萨皮克湾项目，已经使相邻辖区之间恢复了平衡。</p>\n<p>A说辖区间已恢复平衡，回第4段看EPA作用的具体描述。</p>\n<blockquote><p>the means to transcend the influence of <strong>[xxx]</strong> special interests in neighboring states</p>\n</blockquote>\n<blockquote><p>aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields</p>\n</blockquote>\n<p>EPA参与的重要性在于超越邻州特殊利益的影响，处理一州行动给下游造成的后果。这里需要共同保护，不让各地只顾自己。</p>\n<p>原文没有交代辖区此前什么失衡，也没有宣布现在已恢复到某种平衡状态。协调作用不能直接替换成一个已完成的结果。</p>\n<p><strong>EPA能跨越地方利益，就证明各辖区间已恢复平衡吗？</strong></p>\n<p>不能。A加出了文中没有报告的完成结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"39题","raw":"### B. It has triggered a radical reform in commercial fisheries.\n\n> 它引发了商业渔业的彻底改革。\n\n把B接回题干，它说的是：环境保护署参与切萨皮克湾项目，引发了商业渔业的彻底改革。\n\nB说商业渔业彻底改革，回第4段看blue crab harvest在例子中有什么作用。\n\n> the means to transcend the influence of **[xxx]** special interests in neighboring states\n\n> aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby **[xxx]** can have enormous impact downstream.\n\n宾夕法尼亚农民考虑田地施肥时，不会想着下一年马里兰的蓝蟹收成，但上游流下去的污染会影响下游。\n\n蓝蟹让我们具体看到跨州影响，并没有引出渔业制度怎样改革。文中也没说EPA已经推动这种改革。\n\n**蓝蟹收成这个例子是在介绍渔业改革吗？**\n\n不是。B把受影响的一项收成换成了行业发生彻底改革。\n\n**第一轮判断：B排除。**","articleRects":[[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38]],"questionRects":[[280,1476,872,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>B. It has triggered a radical reform in commercial fisheries.</h3>\n<blockquote><p>它引发了商业渔业的彻底改革。</p>\n</blockquote>\n<p>把B接回题干，它说的是：环境保护署参与切萨皮克湾项目，引发了商业渔业的彻底改革。</p>\n<p>B说商业渔业彻底改革，回第4段看blue crab harvest在例子中有什么作用。</p>\n<blockquote><p>the means to transcend the influence of <strong>[xxx]</strong> special interests in neighboring states</p>\n</blockquote>\n<blockquote><p>aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby <strong>[xxx]</strong> can have enormous impact downstream.</p>\n</blockquote>\n<p>宾夕法尼亚农民考虑田地施肥时，不会想着下一年马里兰的蓝蟹收成，但上游流下去的污染会影响下游。</p>\n<p>蓝蟹让我们具体看到跨州影响，并没有引出渔业制度怎样改革。文中也没说EPA已经推动这种改革。</p>\n<p><strong>蓝蟹收成这个例子是在介绍渔业改革吗？</strong></p>\n<p>不是。B把受影响的一项收成换成了行业发生彻底改革。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"39题","raw":"### C. It has set a fine example of respecting state authorities.\n\n> 它树立了尊重州当局的良好榜样。\n\n把C接回题干，它说的是：环境保护署参与切萨皮克湾项目，树立了尊重州当局的良好榜样。\n\nC说尊重州权榜样，回第4段看transcend地方特殊利益的意思。\n\n> the EPA’s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of **[xxx]** special interests in neighboring states.\n\n作者强调EPA能够跨越邻州局部利益的限制。上游决策者不考虑下游后果，正需要跨州层面的参与。\n\n这段没有把EPA说成顺从各州独立决定的榜样，更没有评价它如何尊重州权。论述关注的是不能让保护止于州界。\n\n**作者赞许的是只按各州自己的考虑办，还是协调超出一州的后果？**\n\n是后者。C把跨州保护的作用换成了尊重州权的表率。\n\n**第一轮判断：C排除。**","articleRects":[[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38]],"questionRects":[[281,1537,853,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>C. It has set a fine example of respecting state authorities.</h3>\n<blockquote><p>它树立了尊重州当局的良好榜样。</p>\n</blockquote>\n<p>把C接回题干，它说的是：环境保护署参与切萨皮克湾项目，树立了尊重州当局的良好榜样。</p>\n<p>C说尊重州权榜样，回第4段看transcend地方特殊利益的意思。</p>\n<blockquote><p>the EPA’s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of <strong>[xxx]</strong> special interests in neighboring states.</p>\n</blockquote>\n<p>作者强调EPA能够跨越邻州局部利益的限制。上游决策者不考虑下游后果，正需要跨州层面的参与。</p>\n<p>这段没有把EPA说成顺从各州独立决定的榜样，更没有评价它如何尊重州权。论述关注的是不能让保护止于州界。</p>\n<p><strong>作者赞许的是只按各州自己的考虑办，还是协调超出一州的后果？</strong></p>\n<p>是后者。C把跨州保护的作用换成了尊重州权的表率。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"39题","raw":"### D. It has ensured the coordination of protection efforts.\n\n> 它保障了保护行动之间的协调。\n\n把D接回题干，它说的是：环境保护署参与切萨皮克湾项目，保障了保护行动之间的协调。\n\nD说保障保护行动协调，回第4段看EPA与农民例子之间的联系。\n\n> has long been crucial as the means to transcend the influence of **[xxx]** special interests in neighboring states\n\n> aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby **[xxx]** can have enormous impact downstream.\n\n农民施用动物废物时先考虑自己的田，却会通过水流影响别州收成。若每处只管本地利益，就无法照顾整个海湾。\n\nEPA的参与能超越这些地方利益，把相互牵连的地区放在同一个保护问题中考虑，正是为什么作者称它长期至关重要。\n\n**跨州后果不能靠各州各顾各，EPA的作用是否在于把保护协调起来？**\n\n是。D能接上前面的判断与后面的具体例子。\n\n**第一轮判断：D保留。**","articleRects":[[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38]],"questionRects":[[281,1598,806,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"39","paragraphPids":[3]},"html":"<h3>D. It has ensured the coordination of protection efforts.</h3>\n<blockquote><p>它保障了保护行动之间的协调。</p>\n</blockquote>\n<p>把D接回题干，它说的是：环境保护署参与切萨皮克湾项目，保障了保护行动之间的协调。</p>\n<p>D说保障保护行动协调，回第4段看EPA与农民例子之间的联系。</p>\n<blockquote><p>has long been crucial as the means to transcend the influence of <strong>[xxx]</strong> special interests in neighboring states</p>\n</blockquote>\n<blockquote><p>aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby <strong>[xxx]</strong> can have enormous impact downstream.</p>\n</blockquote>\n<p>农民施用动物废物时先考虑自己的田，却会通过水流影响别州收成。若每处只管本地利益，就无法照顾整个海湾。</p>\n<p>EPA的参与能超越这些地方利益，把相互牵连的地区放在同一个保护问题中考虑，正是为什么作者称它长期至关重要。</p>\n<p><strong>跨州后果不能靠各州各顾各，EPA的作用是否在于把保护协调起来？</strong></p>\n<p>是。D能接上前面的判断与后面的具体例子。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。上游行为会影响下游，而环境保护署的参与能超越邻州特殊利益的影响，可以推断它保障了保护行动之间的协调。","articleRects":[],"questionRects":[[226,1292,1195,38],[281,1354,141,37],[281,1414,916,38],[280,1476,872,37],[281,1537,853,37],[281,1598,806,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。上游行为会影响下游，而环境保护署的参与能超越邻州特殊利益的影响，可以推断它保障了保护行动之间的协调。</p>\n"},{"section":"40题","raw":"## 40题\n\n> The author holds that the state lawmakers should ______.  \n> 作者认为州立法者应当______。\n\n题干中的state lawmakers直接出现在第5段开头，作者在那里用call on提出呼吁。把末段完整读一遍，看他要求立法者做什么，以及随后为什么邀请他们去参观。\n\n> 原文参考：\n> \n> And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over **[xxx]** marshes so shallow you could not **[xxx]** a boat across them but teeming with **[xxx]** life. It’s worth the **[xxx]** drive.\n> \n> 开始精读：\n> \n> And so we would call on state lawmakers from Richmond to Albany / to consider reviewing their own wetlands protections / and see for themselves the enormous stakes involved. / We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County / where bald eagles fly over **[xxx]** marshes / so shallow you could not **[xxx]** a boat across them / but teeming with **[xxx]** life. / It’s worth the **[xxx]** drive.\n> \n> 因此，我们呼吁从里士满到奥尔巴尼的州立法者， / 考虑审视各自的湿地保护措施， / 并亲自了解其中涉及的重大利害。 / 我们可以邀请他们参观多切斯特县的黑水国家野生动物保护区， / 那里白头海雕飞过**[xxx]**的沼泽， / 这些沼泽如此浅，以至于你无法**[xxx]**一艘船穿过它们， / 但那里充满了**[xxx]**生命。 / 这值得进行这趟**[xxx]**的驾车之旅。\n\n题干的should要补出作者给州立法者的建议。第5段先说审视各自的湿地保护措施、亲自了解涉及的重大利害，再邀请他们到野生动物保护区；要分清提出的任务和帮助他们认识这项任务的参观。\n\n接下来按A—D逐项看。","articleRects":[[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31]],"questionRects":[[225,1720,776,31],[1008,1749,112,7],[280,1781,718,31],[280,1843,712,37],[280,1904,711,38],[280,1965,703,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"40","initialReadingPids":[4]},"html":"<h2>40题</h2>\n<blockquote><p>The author holds that the state lawmakers should ______.<br />\n作者认为州立法者应当______。</p>\n</blockquote>\n<p>题干中的state lawmakers直接出现在第5段开头，作者在那里用call on提出呼吁。把末段完整读一遍，看他要求立法者做什么，以及随后为什么邀请他们去参观。</p>\n<blockquote><p>原文参考：</p>\n<p>And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved. We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over <strong>[xxx]</strong> marshes so shallow you could not <strong>[xxx]</strong> a boat across them but teeming with <strong>[xxx]</strong> life. It’s worth the <strong>[xxx]</strong> drive.</p>\n<p>开始精读：</p>\n<p>And so we would call on state lawmakers from Richmond to Albany / to consider reviewing their own wetlands protections / and see for themselves the enormous stakes involved. / We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County / where bald eagles fly over <strong>[xxx]</strong> marshes / so shallow you could not <strong>[xxx]</strong> a boat across them / but teeming with <strong>[xxx]</strong> life. / It’s worth the <strong>[xxx]</strong> drive.</p>\n<p>因此，我们呼吁从里士满到奥尔巴尼的州立法者， / 考虑审视各自的湿地保护措施， / 并亲自了解其中涉及的重大利害。 / 我们可以邀请他们参观多切斯特县的黑水国家野生动物保护区， / 那里白头海雕飞过<strong>[xxx]</strong>的沼泽， / 这些沼泽如此浅，以至于你无法<strong>[xxx]</strong>一艘船穿过它们， / 但那里充满了<strong>[xxx]</strong>生命。 / 这值得进行这趟<strong>[xxx]</strong>的驾车之旅。</p>\n</blockquote>\n<p>题干的should要补出作者给州立法者的建议。第5段先说审视各自的湿地保护措施、亲自了解涉及的重大利害，再邀请他们到野生动物保护区；要分清提出的任务和帮助他们认识这项任务的参观。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. be cautious about the influence of landowners\n\n> 对土地所有者的影响保持谨慎\n\n把A接回题干，它说的是：作者认为州立法者应当对土地所有者的影响保持谨慎。\n\nA说警惕土地所有者影响，回第4、5段分清批评与明确呼吁。\n\n> to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.\n\n> transcend the influence of **[xxx]** special interests in neighboring states\n\n> call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections\n\n作者批评把裁决只看成维护土地所有者权利，因为邻居可能付出严重代价。接着向州立法者提出的是审查本州湿地保护，认识重大利害。\n\nA取了前段的土地所有者，却没有写出末段对立法工作的要求。文中也没有具体讲土地所有者如何影响立法者。\n\n**末段明确要求立法者采取的行动，是防范土地所有者影响吗？**\n\n不是。要求落在审查和重视湿地保护上，A换了行动重点。\n\n**第一轮判断：A排除。**","articleRects":[[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38],[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31]],"questionRects":[[280,1781,718,31]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"40","paragraphPids":[3,4]},"html":"<h3>A. be cautious about the influence of landowners</h3>\n<blockquote><p>对土地所有者的影响保持谨慎</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为州立法者应当对土地所有者的影响保持谨慎。</p>\n<p>A说警惕土地所有者影响，回第4、5段分清批评与明确呼吁。</p>\n<blockquote><p>to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.</p>\n</blockquote>\n<blockquote><p>transcend the influence of <strong>[xxx]</strong> special interests in neighboring states</p>\n</blockquote>\n<blockquote><p>call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections</p>\n</blockquote>\n<p>作者批评把裁决只看成维护土地所有者权利，因为邻居可能付出严重代价。接着向州立法者提出的是审查本州湿地保护，认识重大利害。</p>\n<p>A取了前段的土地所有者，却没有写出末段对立法工作的要求。文中也没有具体讲土地所有者如何影响立法者。</p>\n<p><strong>末段明确要求立法者采取的行动，是防范土地所有者影响吗？</strong></p>\n<p>不是。要求落在审查和重视湿地保护上，A换了行动重点。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"40题","raw":"### B. attach due importance to wetlands protections\n\n> 给予湿地保护应有的重视\n\n把B接回题干，它说的是：作者认为州立法者应当给予湿地保护应有的重视。\n\nB说给予湿地保护应有重视，回末段看call on与reviewing。\n\n> to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved\n\n作者呼吁各州立法者审查自己的湿地保护措施，亲自认识其中的重大利害，又邀请他们到湿地看看。\n\n审查保护措施并理解为什么重要，正好对应attach due importance。参观不是单独旅游，而是帮助他们看到保护的价值。\n\n**审视现有保护并认识重大利害，是不是要求立法者认真重视湿地保护？**\n\n是。B直接接住明确呼吁，先保留。\n\n**第一轮判断：B保留。**","articleRects":[[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31]],"questionRects":[[280,1843,712,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"40","paragraphPids":[4]},"html":"<h3>B. attach due importance to wetlands protections</h3>\n<blockquote><p>给予湿地保护应有的重视</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为州立法者应当给予湿地保护应有的重视。</p>\n<p>B说给予湿地保护应有重视，回末段看call on与reviewing。</p>\n<blockquote><p>to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved</p>\n</blockquote>\n<p>作者呼吁各州立法者审查自己的湿地保护措施，亲自认识其中的重大利害，又邀请他们到湿地看看。</p>\n<p>审查保护措施并理解为什么重要，正好对应attach due importance。参观不是单独旅游，而是帮助他们看到保护的价值。</p>\n<p><strong>审视现有保护并认识重大利害，是不是要求立法者认真重视湿地保护？</strong></p>\n<p>是。B直接接住明确呼吁，先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"40题","raw":"### C. recognize the need to expand wildlife refuges\n\n> 认识到扩建野生动物保护区的必要性\n\n把C接回题干，它说的是：作者认为州立法者应当认识到扩建野生动物保护区的必要性。\n\nC说扩建保护区，回末段看邀请访问的目的。\n\n> see for themselves the enormous stakes involved\n\n> a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over **[xxx]** marshes\n\n作者说可以带立法者去Blackwater看湿地，那里虽然浅，仍有鹰和丰富生命。这个地点让保护价值变得具体可见。\n\n文中没有说保护区面积不足，也没有提出扩大边界或新征土地。邀请去看现有保护区，不是要求扩建它。\n\n**到保护区参观认识湿地价值，是否就等于扩大保护区？**\n\n不等于。C把用来说明的地点变成了新增建设任务。\n\n**第一轮判断：C排除。**","articleRects":[[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31]],"questionRects":[[280,1904,711,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"40","paragraphPids":[4]},"html":"<h3>C. recognize the need to expand wildlife refuges</h3>\n<blockquote><p>认识到扩建野生动物保护区的必要性</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为州立法者应当认识到扩建野生动物保护区的必要性。</p>\n<p>C说扩建保护区，回末段看邀请访问的目的。</p>\n<blockquote><p>see for themselves the enormous stakes involved</p>\n</blockquote>\n<blockquote><p>a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over <strong>[xxx]</strong> marshes</p>\n</blockquote>\n<p>作者说可以带立法者去Blackwater看湿地，那里虽然浅，仍有鹰和丰富生命。这个地点让保护价值变得具体可见。</p>\n<p>文中没有说保护区面积不足，也没有提出扩大边界或新征土地。邀请去看现有保护区，不是要求扩建它。</p>\n<p><strong>到保护区参观认识湿地价值，是否就等于扩大保护区？</strong></p>\n<p>不等于。C把用来说明的地点变成了新增建设任务。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"40题","raw":"### D. improve the wellbeing of endangered species\n\n> 改善濒危物种的生存状况\n\n把D接回题干，它说的是：作者认为州立法者应当改善濒危物种的生存状况。\n\nD说改善濒危物种处境，回末段看湿地中的生命描写。\n\n> consider reviewing their own wetlands protections and see for themselves the enormous stakes involved\n\n> but teeming with **[xxx]** life\n\n作者写白头鹰飞过，还有[xxx] life。修饰life的词暂时不认识，所以眼下不能确定这部分具体是不是在指濒危物种。\n\n不过保护湿地确实与其中生命有关，D不是毫无联系。还要看立法者被直接要求审查的是某种动物的生存状况，还是湿地整体的保护措施。\n\n**只凭目前读到的生命描写，能马上否定D所指的保护关切吗？**\n\n还不能。先把D与B留下，等连回前文再确定作者完整的要求。\n\n**第一轮判断：D保留。**","articleRects":[[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31]],"questionRects":[[280,1965,703,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"40","paragraphPids":[4]},"html":"<h3>D. improve the wellbeing of endangered species</h3>\n<blockquote><p>改善濒危物种的生存状况</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为州立法者应当改善濒危物种的生存状况。</p>\n<p>D说改善濒危物种处境，回末段看湿地中的生命描写。</p>\n<blockquote><p>consider reviewing their own wetlands protections and see for themselves the enormous stakes involved</p>\n</blockquote>\n<blockquote><p>but teeming with <strong>[xxx]</strong> life</p>\n</blockquote>\n<p>作者写白头鹰飞过，还有[xxx] life。修饰life的词暂时不认识，所以眼下不能确定这部分具体是不是在指濒危物种。</p>\n<p>不过保护湿地确实与其中生命有关，D不是毫无联系。还要看立法者被直接要求审查的是某种动物的生存状况，还是湿地整体的保护措施。</p>\n<p><strong>只凭目前读到的生命描写，能马上否定D所指的保护关切吗？</strong></p>\n<p>还不能。先把D与B留下，等连回前文再确定作者完整的要求。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D保留。\n\n暂时保留：B、D。\n\n第一遍留下B、D。B对应审视湿地保护并认识重大利害；D涉及保护区中的生命，但**[xxx]** life所说的具体类型尚不清楚，暂时不能确定它限定的濒危物种能否与这一描写相接。","articleRects":[],"questionRects":[[225,1720,776,31],[1008,1749,112,7],[280,1781,718,31],[280,1843,712,37],[280,1904,711,38],[280,1965,703,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：B、D。</p>\n<p>第一遍留下B、D。B对应审视湿地保护并认识重大利害；D涉及保护区中的生命，但<strong>[xxx]</strong> life所说的具体类型尚不清楚，暂时不能确定它限定的濒危物种能否与这一描写相接。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | provide homes for hundreds of species | 用“provide homes for hundreds of species”写出浅水区为数百个物种提供栖息地，又列举蓄洪、滤污和保护附近社区的作用；开篇先说明海湾值得保护的多重价值。 | 先交代海湾对物种、水体和社区的多重价值。 |\n| 第2段 | far less authority | 的“far less authority”说明法院裁决减少环境保护署监管湿地和水道的权力，并将受保护湿地限定为须与水体存在连续地表连接；它接住第1段的自然价值，指出这些作用如今面临保护范围收窄的风险。 | 指出法院裁决收窄保护范围，使前段价值面临风险。 |\n| 第3段 | don’t respect state boundaries | 以“don’t respect state boundaries”说明水和污染物不会停在州界，马里兰已有保护法律并不意味着海湾可以放心；作者怀疑所有相关辖区都会给予同样保护，把监管收窄的问题推进到跨州保护可能不齐的问题。 | 说明水与污染跨州流动，单个州已有保护仍不够。 |\n| 第4段 | transcend the influence | 的“transcend the influence”解释环境保护署参与的重要性：它能超越邻州特殊利益的影响。农民不考虑另一州蓝蟹收成、径流却会影响下游的例子，具体说明第3段为何不能只看单个辖区，也说明单从土地所有者权利理解裁决会遗漏邻居承受的后果。 | 用上下游例子解释联邦机构参与的重要性，补足跨州保护的理由。 |\n| 第5段 | reviewing their own wetlands protections | 通过“reviewing their own wetlands protections”呼吁各州立法者审视本州湿地保护，并亲自认识其中的重大利害；参观保护区的邀请把开头的湿地价值重新带回眼前，为前面指出的保护缺口提出行动要求。 | 由保护缺口转向州立法者的行动，重新接回开头的湿地价值。 |\n\n全文围绕湿地保护展开：海湾同时服务于物种、水体和社区，法院裁决收窄监管后，跨州的水和污染物使单个州已有的法律难以独自解决问题，因此作者要求相关州的立法者认真审视湿地保护，认识其牵涉的广泛利益。","articleRects":[[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38],[274,525,1122,38],[202,573,1193,38],[202,620,1184,39],[203,665,1193,46],[202,716,1194,39],[202,765,1189,38],[202,813,1192,38],[202,860,1192,39],[202,908,1011,39],[273,957,1123,38],[202,1005,1194,38],[202,1053,1194,38],[202,1101,1194,38],[202,1149,1194,38],[202,1197,1194,38],[202,1245,1195,38],[203,1293,915,38],[273,1341,1123,38],[202,1389,1195,38],[202,1437,1194,38],[202,1485,1196,38],[202,1533,1194,38],[202,1581,1193,38],[202,1629,1194,38],[202,1677,1018,38],[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>provide homes for hundreds of species</td><td>用“provide homes for hundreds of species”写出浅水区为数百个物种提供栖息地，又列举蓄洪、滤污和保护附近社区的作用；开篇先说明海湾值得保护的多重价值。</td><td>先交代海湾对物种、水体和社区的多重价值。</td></tr><tr><td>第2段</td><td>far less authority</td><td>的“far less authority”说明法院裁决减少环境保护署监管湿地和水道的权力，并将受保护湿地限定为须与水体存在连续地表连接；它接住第1段的自然价值，指出这些作用如今面临保护范围收窄的风险。</td><td>指出法院裁决收窄保护范围，使前段价值面临风险。</td></tr><tr><td>第3段</td><td>don’t respect state boundaries</td><td>以“don’t respect state boundaries”说明水和污染物不会停在州界，马里兰已有保护法律并不意味着海湾可以放心；作者怀疑所有相关辖区都会给予同样保护，把监管收窄的问题推进到跨州保护可能不齐的问题。</td><td>说明水与污染跨州流动，单个州已有保护仍不够。</td></tr><tr><td>第4段</td><td>transcend the influence</td><td>的“transcend the influence”解释环境保护署参与的重要性：它能超越邻州特殊利益的影响。农民不考虑另一州蓝蟹收成、径流却会影响下游的例子，具体说明第3段为何不能只看单个辖区，也说明单从土地所有者权利理解裁决会遗漏邻居承受的后果。</td><td>用上下游例子解释联邦机构参与的重要性，补足跨州保护的理由。</td></tr><tr><td>第5段</td><td>reviewing their own wetlands protections</td><td>通过“reviewing their own wetlands protections”呼吁各州立法者审视本州湿地保护，并亲自认识其中的重大利害；参观保护区的邀请把开头的湿地价值重新带回眼前，为前面指出的保护缺口提出行动要求。</td><td>由保护缺口转向州立法者的行动，重新接回开头的湿地价值。</td></tr></tbody></table>\n<p>全文围绕湿地保护展开：海湾同时服务于物种、水体和社区，法院裁决收窄监管后，跨州的水和污染物使单个州已有的法律难以独自解决问题，因此作者要求相关州的立法者认真审视湿地保护，认识其牵涉的广泛利益。</p>\n"},{"section":"进阶回查","raw":"## 回查40题：B还是D？\n\nThe author holds that the state lawmakers should ______.\n\nB. attach due importance to wetlands protections\n\nD. improve the wellbeing of endangered species\n\n第一轮看到鹰和[xxx] life，知道湿地与生物有关，D因此也留下了。但前面介绍湿地时，并不只写了生物：\n\n> The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm [xxx].\n\n还有蓄洪、净水和保护社区。第2段担心EPA监管权减少，第3段又解释水与污染不认州界，各个相关地区未必都会提供同样保护。作者要解决的是这些地方怎样共同守住湿地的多项作用。\n\n回到末段，向立法者提出的动作写得很清楚：\n\n> consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.\n\n要求审查的是自己的湿地保护措施。邀请去看鹰和湿地中的生命，是让立法者亲眼认识这些措施为什么重要。\n\n**D只写改善某类物种的处境，能否接住蓄洪、净水、社区与跨州保护这些要求？**\n\n不能完整接住。即使仍不认识life前面的词，我们也能看出物种只是湿地价值的一部分。B把审查保护措施、认识重大利害一起概括进来，符合作者直接对州立法者提出的要求。\n\n**40题选B。**","articleRects":[[274,1725,1122,38],[202,1773,1194,38],[202,1821,1192,31],[201,1869,1195,38],[203,1917,1183,38],[202,1965,395,31],[273,285,1123,38],[202,329,1191,47],[202,381,1197,38],[203,429,1193,38],[202,477,908,38],[274,525,1122,38],[202,573,1193,38],[202,620,1184,39],[203,665,1193,46],[202,716,1194,39],[202,765,1189,38],[202,813,1192,38],[202,860,1192,39],[202,908,1011,39],[273,957,1123,38],[202,1005,1194,38],[202,1053,1194,38],[202,1101,1194,38],[202,1149,1194,38],[202,1197,1194,38],[202,1245,1195,38],[203,1293,915,38]],"questionRects":[[225,1720,776,31],[1008,1749,112,7],[280,1781,718,31],[280,1843,712,37],[280,1904,711,38],[280,1965,703,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","D"],"newEvidencePids":[1,2,3],"finalChoice":"B","qid":"40","paragraphPids":[0,1,2,3,4]},"html":"<h2>回查40题：B还是D？</h2>\n<p>The author holds that the state lawmakers should ______.</p>\n<p>B. attach due importance to wetlands protections</p>\n<p>D. improve the wellbeing of endangered species</p>\n<p>第一轮看到鹰和[xxx] life，知道湿地与生物有关，D因此也留下了。但前面介绍湿地时，并不只写了生物：</p>\n<blockquote><p>The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm [xxx].</p>\n</blockquote>\n<p>还有蓄洪、净水和保护社区。第2段担心EPA监管权减少，第3段又解释水与污染不认州界，各个相关地区未必都会提供同样保护。作者要解决的是这些地方怎样共同守住湿地的多项作用。</p>\n<p>回到末段，向立法者提出的动作写得很清楚：</p>\n<blockquote><p>consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.</p>\n</blockquote>\n<p>要求审查的是自己的湿地保护措施。邀请去看鹰和湿地中的生命，是让立法者亲眼认识这些措施为什么重要。</p>\n<p><strong>D只写改善某类物种的处境，能否接住蓄洪、净水、社区与跨州保护这些要求？</strong></p>\n<p>不能完整接住。即使仍不认识life前面的词，我们也能看出物种只是湿地价值的一部分。B把审查保护措施、认识重大利害一起概括进来，符合作者直接对州立法者提出的要求。</p>\n<p><strong>40题选B。</strong></p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**36. A**\n\n**37. B**\n\n**38. A**\n\n**39. D**\n\n**40. B**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>36. A</strong></p>\n<p><strong>37. B</strong></p>\n<p><strong>38. A</strong></p>\n<p><strong>39. D</strong></p>\n<p><strong>40. B</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRhRrBABXRUJQVlA4TAdrBAAvV0Y1AlUTg7aNJCXDn/Xs07k9ABExAfjPVQXc8Vlr59W020SXuGpEibuOzNpDL7oOMas57jy96hPrjJ2/FGOAy4hLsgszwIlxDgd8laUX6P/vT/3wpk3TQ5omPeRu0pzupmmaNOmd9m6a3E3vpnfSpHeaHnI+3ElPd09pm2OPaZumaQ493G2TNHcOTXOn
