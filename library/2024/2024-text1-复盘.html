code>连接钉子中凝结的铁匠劳动。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n<p>后来的文明更看重钉子中熟练铁匠的劳动，甚至超过原材料。Roma Agrawal在新书《螺母与螺栓》中解释，十七世纪初的弗吉尼亚人计划迁居时，有时会烧掉房子，试图收回珍贵的钉子；筛过灰烬后，钉子还能再用。为取回钉子而烧掉整座房屋，凸显看似简单的技术多么稀缺、昂贵而有价值。</p>\n</blockquote>\n<p>烧整屋只为取钉的行为制造鲜明价值反差，underlines随后点明这种反差说明简单技术的珍贵。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The example of the Virginians is used to show the preciousness of nail-making technology at that time.</p>\n<p>弗吉尼亚人的例子用来表明当时制钉技术的珍贵。</p>\n</blockquote>\n<p>D解释了为什么作者要讲付出整屋代价的例子，也覆盖首句劳动价值与末句技术评价。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. D**\n\n- A：回收旧钉可以表现节省，但段末underlines明确强调技术稀缺、昂贵且有价值，未把重点放在殖民者节俭品格。\n- B：首句强调铁匠劳动凝结在钉子里的价值，B改成铁匠本人的社会地位。\n- C：Later civilisations与前文罗马藏铁确有不同着眼点，但题干问弗吉尼亚例子的具体作用，段末已落在制钉技术的珍贵。\n- D：scarce、costly、valuable与preciousness同向，前面的熟练铁匠劳动又把价值接到制钉技术，D概括段末明确判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"22","questionConclusion":true},"html":"<blockquote>\n<p><strong>22. D</strong></p>\n</blockquote>\n<ul>\n<li>A：回收旧钉可以表现节省，但段末underlines明确强调技术稀缺、昂贵且有价值，未把重点放在殖民者节俭品格。</li>\n<li>B：首句强调铁匠劳动凝结在钉子里的价值，B改成铁匠本人的社会地位。</li>\n<li>C：Later civilisations与前文罗马藏铁确有不同着眼点，但题干问弗吉尼亚例子的具体作用，段末已落在制钉技术的珍贵。</li>\n<li>D：scarce、costly、valuable与preciousness同向，前面的熟练铁匠劳动又把价值接到制钉技术，D概括段末明确判断。</li>\n</ul>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> What played the major role in lowering the price of nails after the late 1700s?\n>\n> 1700年代后期以后，什么在降低钉子价格方面发挥了主要作用？\n\n### 题型\n\n细节理解题：先核对原因内容，再用partly和most区分辅助因素与主要贡献。\n\n题干的lowering the price of nails和after the late 1700s直接对应第4段开头的The price of nails fell by 90%及时间范围。完整精读第4段，尤其注意各项因素在降价中承担多大作用。\n\n### 核心出处\n\n> most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n>\n> although the falling price of nails was driven partly by cheaper iron and cheaper energy","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"23","questionIntro":true},"html":"<blockquote>\n<p>What played the major role in lowering the price of nails after the late 1700s?</p>\n<p>1700年代后期以后，什么在降低钉子价格方面发挥了主要作用？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解题：先核对原因内容，再用partly和most区分辅助因素与主要贡献。</p>\n<p>题干的lowering the price of nails和after the late 1700s直接对应第4段开头的The price of nails fell by 90%及时间范围。完整精读第4段，尤其注意各项因素在降价中承担多大作用。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n<p>although the falling price of nails was driven partly by cheaper iron and cheaper energy</p>\n</blockquote>\n"},{"title":"A. Increased productivity.","raw":"### A. Increased productivity.\n\n> 钉子降价的主要原因是生产率提高。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nmore efficient ways to turn steel into nails说明制造效率提高，most of the credit又把它定为降价主因，A两方面都对应。\n\n**出处：**\n\n> The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>钉子降价的主要原因是生产率提高。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more efficient ways to turn steel into nails说明制造效率提高，most of the credit又把它定为降价主因，A两方面都对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section>"},{"title":"A. Increased productivity.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 钉子降价的主要原因是生产率提高。\n\n`Increased productivity`说同样的生产活动变得更高效；第4段的`more efficient ways to turn steel into nails`说明制造商提高了把钢制成钉子的效率，回看第2句对主要功劳的归属。\n\n原文将大部分降价功劳归给制造商，具体做法是找到`more efficient ways to turn steel into nails`。`A`的`Increased productivity`就是把生产活动的效率提高概括为生产率提高；它不仅对应制造方法的变化，也对应`most of the credit`规定的主要作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>钉子降价的主要原因是生产率提高。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more efficient ways to turn steel into nails说明制造效率提高，most of the credit又把它定为降价主因，A两方面都对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子降价的主要原因是生产率提高。</p>\n</blockquote>\n<p><code>Increased productivity</code>说同样的生产活动变得更高效；第4段的<code>more efficient ways to turn steel into nails</code>说明制造商提高了把钢制成钉子的效率，回看第2句对主要功劳的归属。</p>\n<p>原文将大部分降价功劳归给制造商，具体做法是找到<code>more efficient ways to turn steel into nails</code>。<code>A</code>的<code>Increased productivity</code>就是把生产活动的效率提高概括为生产率提高；它不仅对应制造方法的变化，也对应<code>most of the credit</code>规定的主要作用。</p>\n</section>"},{"title":"A. Increased productivity.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n>\n> 经济学家Daniel Sichel的论文指出，从十八世纪后期到二十世纪中期，钉子价格下降了90%。铁与能源更便宜贡献了部分降幅，但主要功劳属于制钉商，他们找到了把钢制成钉子的更高效方法。\n\n段首给长期降价幅度，第二句用although承认辅助因素，再将主要功劳归于生产方法改进。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The major factor was increased productivity.\n>\n> 钉子降价的主要原因是生产率提高。\n\nA不仅说与降价相关，还准确回答major role；提高生产率与同样生产活动变高效是同一关系的概括。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>钉子降价的主要原因是生产率提高。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more efficient ways to turn steel into nails说明制造效率提高，most of the credit又把它定为降价主因，A两方面都对应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子降价的主要原因是生产率提高。</p>\n</blockquote>\n<p><code>Increased productivity</code>说同样的生产活动变得更高效；第4段的<code>more efficient ways to turn steel into nails</code>说明制造商提高了把钢制成钉子的效率，回看第2句对主要功劳的归属。</p>\n<p>原文将大部分降价功劳归给制造商，具体做法是找到<code>more efficient ways to turn steel into nails</code>。<code>A</code>的<code>Increased productivity</code>就是把生产活动的效率提高概括为生产率提高；它不仅对应制造方法的变化，也对应<code>most of the credit</code>规定的主要作用。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel in urn steel into nails.</p>\n</blockquote>\n</section>"},{"title":"B. Wider use of new energies.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 钉子降价的主要原因是新能源的更广泛使用。\n\n`Wider use of new energies`提到能源；第4段也有`cheaper energy`，但说的是能源价格，需要回看第2句中能源与主要功劳的关系。\n\n原文写的是`cheaper energy`，能源更便宜只是降价的一部分推动因素；大部分功劳归给制造商提高制钉效率。`B`的`Wider use of new energies`既把能源价格下降改成新能源使用范围扩大，又把它放到了主要作用的位置。原文没有从更便宜连出更新的能源或更广泛使用，而且已经明确分开部分贡献与主要贡献。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>钉子降价的主要原因是新能源的更广泛使用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>cheaper energy是能源便宜，不是新能源更广泛使用；它还仅贡献一部分，B同时换了变化内容与作用大小。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子降价的主要原因是新能源的更广泛使用。</p>\n</blockquote>\n<p><code>Wider use of new energies</code>提到能源；第4段也有<code>cheaper energy</code>，但说的是能源价格，需要回看第2句中能源与主要功劳的关系。</p>\n<p>原文写的是<code>cheaper energy</code>，能源更便宜只是降价的一部分推动因素；大部分功劳归给制造商提高制钉效率。<code>B</code>的<code>Wider use of new energies</code>既把能源价格下降改成新能源使用范围扩大，又把它放到了主要作用的位置。原文没有从更便宜连出更新的能源或更广泛使用，而且已经明确分开部分贡献与主要贡献。</p>\n</section>"},{"title":"B. Wider use of new energies.","raw":"## il manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子降价的主要原因是更激烈的市场竞争。</p>\n</blockquote>\n<p><code>Fiercer market competition</code>是在解释制造商为什么降价；第4段把主要功劳给了<code>nail manufacturers</code>，并具体接<code>more efficient ways</code>，所以回看第2句写制造商靠什么带来降价。</p>\n<p>原文虽然也谈制造商，但明确给出的变化是<code>more efficient ways</code>，即找到更高效的制钉方法，降价的主要原因落在生产过程。<code>C</code>的<code>Fiercer market competition</code>则把它改成制造商之间的市场竞争加剧。企业采用高效方法与企业竞争变激烈不是同一事实，原句也没有把前者解释为后者的结果；<code>C</code>替换了题干要找的主要原因。</p>\n</section>"},{"title":"C. Fiercer market competition.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n>\n> 经济学家Daniel Sichel的论文指出，从十八世纪后期到二十世纪中期，钉子价格下降了90%。铁与能源更便宜贡献了部分降幅，但主要功劳属于制钉商，他们找到了把钢制成钉子的更高效方法。\n\n作者解释价格下降时把关注点放到怎样把钢变成钉子这一生产环节。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The major factor was fiercer market competition.\n>\n> 钉子降价的主要原因是更激烈的市场竞争。\n\nC需要竞争状况和降价之间的因果依据。企业改进方法可能有多种背景，不能把未写的竞争压力补成主要原因。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>钉子降价的主要原因是更激烈的市场竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文说制造商找到更高效制法，并未说制造商之间竞争加剧；C另添市场竞争 * 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\ncheaper iron确实是原料成本降低，D有原文依据，但partly限定贡献，题干所问主要作用属于制造效率。\n\n**出处：**\n\n> The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>钉子降价的主要原因是原材料成本降低。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>cheaper iron确实是原料成本降低，D有原文依据，但partly限定贡献，题干所问主要作用属于制造效率。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section>"},{"title":"D. Reduced cost of raw materials.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 钉子降价的主要原因是原材料成本降低。\n\n`Reduced cost of raw materials`可接第4段的`cheaper iron`，铁更便宜属于原材料成本下降；回看第2句中`partly`与`most of the credit`怎样区分贡献。\n\n原文承认`cheaper iron`推动了钉子降价，这与`D`的`Reduced cost of raw materials`有实际重合。但原文用`partly`限定这方面的贡献，再把`most of the credit`归给制造商的高效制钉方法。题干问的是主要作用，`D`因此把原文的部分原因提升成主要原因，改动了两者的贡献大小。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344, %。铁与能源更便宜贡献了部分降幅，但主要功劳属于制钉商，他们找到了把钢制成钉子的更高效方法。\n\n第二句先承认成本因素，再用most of the credit安排原因的主次。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The major factor was reduced cost of raw materials.\n>\n> 钉子降价的主要原因是原材料成本降低。\n\nD的错误不在原材料没变便宜，而在把部分原因放到major role的位置；A才保留原文的贡献大小。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>钉子降价的主要原因是原材料成本降低。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>cheaper iron确实是原料成本降低，D有原文依据，但partly限定贡献，题干所问主要作用属于制造效率。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子降价的主要原因是原材料成本降低。</p>\n</blockquote>\n<p><code>Reduced cost of raw materials</code>可接第4段的<code>cheaper iron</code>，铁更便宜属于原材料成本下降；回看第2句中<code>partly</code>与<code>most of the credit</code>怎样区分贡献。</p>\n<p>原文承认<code>cheaper iron</code>推动了钉子降价，这与<code>D</code>的<code>Reduced cost of raw materials</code>有实际重合。但原文用<code>partly</code>限定这方面的贡献，再把<code>most of the credit</code>归给制造商的高效制钉方法。题干问的是主要作用，<code>D</code>因此把原文的部分原因提升成主要原因，改动了两者的贡献大小。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n<p>经济学家Daniel Sichel的论文指出，从十八世纪后期到二十世纪中期，钉子价格下降了90%。铁与能源更便宜贡献了部分降幅，但主要功劳属于制钉商，他们找到了把钢制成钉子的更高效方法。</p>\n</blockquote>\n<p>第二句先承认成本因素，再用most of the credit安排原因的主次。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The major factor was reduced cost of raw materials.</p>\n<p>钉子降价的主要原因是原材料成本降低。</p>\n</blockquote>\n<p>D的错误不在原材料没变便宜，而在把部分原因放到major role的位置；A才保留原文的贡献大小。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. A**\n\n- A：more efficient ways to turn steel into nails说明制造效率提高，most of the credit又把它定为降价主因，A两方面都对应。\n- B：cheaper energy是能源便宜，不是新能源更广泛使用；它还仅贡献一部分，B同时换了变化内容与作用大小。\n- C：原文说制造商找到更高效制法，并未说制造商之间竞争加剧；C另添市场竞争作为原因。\n- D：cheaper iron确实是原料成本降低，D有原文依据，但partly限定贡献，题干所问主要作用属于制造效率。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"23","questionConclusion":true},"html":"<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：more efficient ways to turn steel into nails说明制造效率提高，most of the credit又把它定为降价主因，A两方面都对应。</li>\n<li>B：cheaper energy是能源便宜，不是新能源更广泛使用；它还仅贡献一部分，B同时换了变化内容与作用大小。</li>\n<li>C：原文说制造商找到更高效制法，并未说制造商之间竞争加剧；C另添市场竞争作为原因。</li>\n<li>D：cheaper iron确实是原料成本降低，D有原文依据，但partly限定贡献，题干所问主要作用属于制造效率。</li>\n</ul>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> It can be learned from Paragraph 5 that nails ______.\n>\n> 从第5段可以得知，钉子具有怎样的特点？\n\n### 题型\n\n段落推断题：由古今变化程度理解研究的可比性，不添研究数量或发明排名。\n\n题干直接指定Paragraph 5，完整精读第5段，注意作者用罗马时代的物品与现代物品比较，是怎样解释研究钉子的原因。\n\n### 核心出处\n\n> Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much.\n>\n> but Roman nails are still clearly nails.\n>\n> Sichel studied them because they haven’t changed much.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"24","questionIntro":true},"html":"<blockquote>\n<p>It can be learned from Paragraph 5 that nails ______.</p>\n<p>从第5段可以得知，钉子具有怎样的特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：由古今变化程度理解研究的可比性，不添研究数量或发明排名。</p>\n<p>题干直接指定Paragraph 5，完整精读第5段，注意作者用罗马时代的物品与现代物品比较，是怎样解释研究钉子的原因。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much.</p>\n<p>but Roman nails are still clearly nails.</p>\n<p>Sichel studied them because they haven’t changed much.</p>\n</blockquote>\n"},{"title":"A. have undergone many technological improvements","raw":"### A. have undergone many technological improvements\n\n> 钉子经历了许多技术改进。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nhave changed承认变化，haven't changed much限定总体程度，不能据此断言经历了许多技术改进。\n\n**出处：**\n\n> Nails themselves have changed over the years, but Sichel studied them because they haven't changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>钉子经历了许多技术改进。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>have changed承认变化，haven&#39;t changed much限定总体程度，不能据此断言经历了许多技术改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n</section>"},{"title":"A. have undergone many technological improvements","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 钉子经历了许多技术改进。\n\n`many technological improvements`是在描述钉子的变化过程；第5段首句虽说`have changed`，却马上以`haven’t changed much`说明西歇尔选它们研究的理由，回看这句并核对后面的古今比较。\n\n原文承认钉子有变化，但`haven’t changed much`明确说变化程度有限，后面用罗马时代的钉子仍明显是钉子来解释这种延续。`A`的`many technological improvements`进一步断定钉子经历了许多技术改进：既把一般的变化写成改良，也加入了改良次数多的判断。变化不大并不说明改进次数究竟多少，而第5段要建立的是古今钉子可以相比，不能由此推出许多次技术改进。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>钉子经历了许多技术改进。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>have changed承认变化，haven&#39;t changed much限定总体程度，不能据此断言经历了许多技术改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子经历了许多技术改进。</p>\n</blockquote>\n<p><code>many technological improvements</code>是在描述钉子的变化过程；第5段首句虽说<code>have changed</code>，却马上以<code>haven’t changed much</code>说明西歇尔选它们研究的理由，回看这句并核对后面的古今比较。</p>\n<p>原文承认钉子有变化，但<code>haven’t changed much</code>明确说变化程度有限，后面用罗马时代的钉子仍明显是钉子来解释这种延续。<code>A</code>的<code>many technological improvements</code>进一步断定钉子经历了许多技术改进：既把一般的变化写成改良，也加入了改良次数多的判断。变化不大并不说明改进次数究竟多少，而第5段要建立的是古今钉子可以相比，不能由此推出许多次技术改进。</p>\n</section>"},{"title":"A. have undergone many technological improvements","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Nails themselves have changed over the years, but Sichel studied them because they haven't changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.\n>\n> 钉子这些年有所变化，但Sichel研究它们正因为变化不大。罗马灯具和战车与现代灯带、跑车差别很大，罗马钉子却仍明显是钉子。追踪跑车从1695年以来的价格变化会很荒谬，对钉子问同样问题却很合理。\n\n作者解释选钉子作研究对象，随后用古今钉子仍可辨认来说明连续性。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Nails have undergone many technological improvements.\n>\n> 钉子经历了许多技术改进。\n\nA需要许多改进及其技术性质的具体证据。变化不大也不能反证改进次数一定少，但本段没有支持A的次数判断。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>钉子经历了许多技术改进。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>have changed承认变化，haven&#39;t changed much限定总体程度，不能据此断言经历了许多技术改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>钉子经历了许多技术改进。</p>\n</blockquote>\n<p><code>many technological improvements</code>是在描述钉子的变化过程；第5段首句虽说<code>have changed</code>，却马上以<code>haven’t changed much</code>说明西歇尔选它们研究的理由，回看这句并核对后面的古今比较。</p>\n<p>原文承认钉子有变化，但<code>haven’t changed much</code>明确说变化程度有限，后面用罗马时代的钉子仍明显是钉子来解释这种延续。<code>A</code>的<code>many technological improvements</code>进一步断定钉子经历了许多技术改进：既把一般的变化写成改良，也加入了改良次数多的判断。变化不大并不说明改进次数究竟多少，而第5段要建立的是古今钉子可以相比，不能由此推出许多次技术改进。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n<p>钉子这些年有所变化，但Sichel研究它们正因为变化不大。罗马灯具和战车与现代灯带、跑车差别很大，罗马钉子却仍明显是钉子。追踪跑车从1695年以来的价格变化会很荒谬，对钉子问同样问题却很合理。</p>\n</blockquote>\n<p>作者解释选钉子作研究对象，随后用古今钉子仍可辨认来说明连续性。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Nails have undergone many technological improvements.</p>\n<p>钉子经历了许多技术改进。</p>\n</blockquote>\n<p>A需要许多改进及其技术性质的具体证据。变化不大也不能反证改进次数一定少，但本段没有支持A的次数判断。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n< 肯定的是追踪钉子长期价格，D改成钉子在世界发明中的重要性排名。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> Which of the following best summarises the last two paragraphs?\n>\n> 下面哪一项最能概括最后两段？\n\n### 题型\n\n段落主旨题：概括最后两段共同的判断，并用印刷、纸张和太阳能板的例子核对概括是否覆盖且准确。\n\n题干限定the last two paragraphs，即第6、7段。先把两段都完整精读：第6段从日常物品的价格引出判断，第7段用印刷、纸和太阳能板展开说明。\n\n### 核心出处\n\n> it’s the cheap technologies that change the world.\n>\n> The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost\n>\n> until they became cheap; now they are transforming the global energy system.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>Which of the following best summarises the last two paragraphs?</p>\n<p>下面哪一项最能概括最后两段？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落主旨题：概括最后两段共同的判断，并用印刷、纸张和太阳能板的例子核对概括是否覆盖且准确。</p>\n<p>题干限定the last two paragraphs，即第6、7段。先把两段都完整精读：第6段从日常物品的价格引出判断，第7段用印刷、纸和太阳能板展开说明。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it’s the cheap technologies that change the world.</p>\n<p>The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost</p>\n<p>until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n"},{"title":"A. Cheap technologies bring about revolutionary change.","raw":"### A. Cheap technologies bring about revolutionary change.\n\n> 最后两段主要说明：廉价技术带来革命性的变化。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。\n\n**出处：**\n\n> I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I've learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it's the cheap technologies that change the world.\n> The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n</section>"},{"title":"A. Cheap technologies bring about revolutionary change.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 最后两段主要说明：廉价技术带来革命性的变化。\n\n第6段明确把`change the world`归给廉价技术；第7段说印刷机通过改变书写成本改变文明，又说太阳能板变便宜后正在改变全球能源系统。`A`用`Cheap technologies`点出共同条件，用`revolutionary change`概括改变世界、文明和能源系统这样的大幅影响。它把两段的判断与例证连成了技术便宜之后带来深刻变化的关系。\n\n`Cheap technologies`对应第6段的`the cheap technologies`，`revolutionary change`则要接`change the world`与第7段的`transformed civilisation`、`transforming the global energy system`，因而合看第6段末句和第7段两个例子。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p>第6段明确把<code>change the world</code>归给廉价技术；第7段说印刷机通过改变书写成本改变文明，又说太阳能板变便宜后正在改变全球能源系统。<code>A</code>用<code>Cheap technologies</code>点出共同条件，用<code>revolutionary change</code>概括改变世界、文明和能源系统这样的大幅影响。它把两段的判断与例证连成了技术便宜之后带来深刻变化的关系。</p>\n<p><code>Cheap technologies</code>对应第6段的<code>the cheap technologies</code>，<code>revolutionary change</code>则要接<code>change the world</code>与第7段的<code>transformed civilisation</code>、<code>transforming the global energy system</code>，因而合看第6段末句和第7段两个例子。</p>\n</section>"},{"title":"A. Cheap technologies bring about revolutionary change.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I've learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it's the cheap technologies that change the world.\n> The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.\n>\n> 我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。\n>\n> 古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。\n\n作者由价格兴趣提出总判断，再用文明与能源系统两个领域的变化支撑。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Cheap technologies bring about revolutionary change.\n>\n> 最后两段主要说明：廉价技术带来革命性的变化。\n\nrevolutionary change概括深刻社会变化，cheap technologies保留反复强调的成本条件，能够同时覆盖两段。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p>第6段明确把<code>change the world</code>归给廉价技术；第7段说印刷机通过改变书写成本改变文明，又说太阳能板变便宜后正在改变全球能源系统。<code>A</code>用<code>Cheap technologies</code>点出共同条件，用<code>revolutionary change</code>概括改变世界、文明和能源系统这样的大幅影响。它把两段的判断与例证连成了技术便宜之后带来深刻变化的关系。</p>\n<p><code>Cheap technologies</code>对应第6段的<code>the cheap technologies</code>，<code>revolutionary change</code>则要接<code>change the world</code>与第7段的<code>transformed civilisation</code>、<code>transforming the global energy system</code>，因而合看第6段末句和第7段两个例子。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>I make no apology for being obsess chnologies`与`change the world`相连，第7段也强调书写成本变化、太阳能板变便宜后带来文明和能源系统的变化。`B`的`Technological innovation`把关注点移到创新本身，`economic success`又把结果改成经济上的成功，并用`integral`说创新是这种成功不可或缺的组成部分。两段具体论述的是技术成本降低如何扩大改变世界的力量，没有建立经济成功必须包含技术创新的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-B-0\"><blockquote>\n<p>最后两段主要说明：技术创新是经济成功不可或缺的一部分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>两段写廉价技术改变文明和能源系统，B改成技术创新是经济成功的必要组成部分，条件、结果与必需性均不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：技术创新是经济成功不可或缺的一部分。</p>\n</blockquote>\n<p><code>Technological innovation</code>指向第6段的<code>technologies</code>与第7段的印刷机、纸、太阳能板；<code>economic success</code>则要与第6段的<code>change the world</code>及第7段的具体变化核对，因此回看第6段末句和第7段对成本与改变的说明。</p>\n<p>原文把<code>cheap technologies</code>与<code>change the world</code>相连，第7段也强调书写成本变化、太阳能板变便宜后带来文明和能源系统的变化。<code>B</code>的<code>Technological innovation</code>把关注点移到创新本身，<code>economic success</code>又把结果改成经济上的成功，并用<code>integral</code>说创新是这种成功不可或缺的组成部分。两段具体论述的是技术成本降低如何扩大改变世界的力量，没有建立经济成功必须包含技术创新的关系。</p>\n</section>"},{"title":"B. Technological innovation is integral to economic success.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I've learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it's the cheap technologies that change the world.\n> The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.\n>\n> 我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。\n>\n> 古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。\n\n第六段对照复杂技术的宣传与廉价技术的作用，第七段重点仍是成本怎样影响应用。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Technological innovation is integral to economic success.\n>\n> 最后两段主要说明：技术创新是经济成功不可或缺的一部分。\n\nB需要经济成功及创新不可或缺的关系。价格属于经济因素，并不让全文结果自动等于economic success。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-questi cheap; now they are transforming the global energy system.\n>\n> 我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。\n>\n> 古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。\n\nwhile连接两类技术获得的不同结果，印刷与纸张例子进一步说明作用取决于配套成本。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Sophisticated technologies develop from small inventions.\n>\n> 最后两段主要说明：复杂技术由小发明发展而来。\n\nD需要技术起源链条。印刷作用离不开便宜纸张，不等于印刷由纸发展而来；廉价也不等于小发明。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>最后两段主要说明：复杂技术由小发明发展而来。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：复杂技术由小发明发展而来。</p>\n</blockquote>\n<p>复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。</p>\n<p>while连接两类技术获得的不同结果，印刷与纸张例子进一步说明作用取决于配套成本。</p>\n<p>D需要技术起源链条。印刷作用离不开便宜纸张，不等于印刷由纸发展而来；廉价也不等于小发明。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n<p>我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。</p>\n<p>古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。</p>\n</blockquote>\n<p>while连接两类技术获得的不同结果，印刷与纸张例子进一步说明作用取决于配套成本。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Sophisticated technologies develop from small inventions.</p>\n<p>最后两段主要说明：复杂技术由小发明发展而来。</p>\n</blockquote>\n<p>D需要技术起源链条。印刷作用离不开便宜纸张，不等于印刷由纸发展而来；廉价也不等于小发明。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. A**\n\n- A：第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。\n- B：两段写廉价技术改变文明和能源系统，B改成技术创新是经济成功的必要组成部分，条件、结果与必需性均不同。\n- C：change the world的对象是现实世界，具体落实为文明与能源系统；C改成人们对世界的理解。\n- D：复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. A</strong></p>\n</blockquote>\n<ul>\n<li>A：第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。</li>\n<li>B：两段写廉价技术改变文明和能源系统，B改成技术创新是经济成功的必要组成部分，条件、结果与必需性均不同。</li>\n<li>C：change the world的对象是现实世界，具体落实为文明与能源系统；C改成人们对世界的理解。</li>\n<li>D：复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：罗马钉子的神秘埋藏**（段落1-2历史背景） 历史事件：罗马人撤出苏格兰时留下10吨钉子（约100万个）→ 埋藏原因：【撤退匆忙 + 不想让当地喀里多尼亚人得到武器级铁】→ 埋藏之深：近2000年后才被发现\n\n↓（价值演变）\n\n**逻辑层次2：钉子的历史价值**（段落3价值体现） 价值转变：后来文明更重视铁匠劳动而非原材料 → 极端例证：17世纪弗吉尼亚人烧房取钉（搬迁时为回收钉子而烧毁房屋）→ 意义：凸显看似简单的技术实则稀缺、昂贵、有价值\n\n↓（价格变化）\n\n**逻辑层次3：钉子价格的大幅下降**（段落4经济分析） 价格变化：18世纪晚期到20世纪中期下降90% → 原因分析：【部分原因：铁和能源更便宜 // 主要原因：制造商找到更有效的生产方法】\n\n↓（研究价值）\n\n**逻辑层次4：钉子作为研究对象的独特性**（段落5研究意义） 钉子的特点：虽有变化但基本保持不变（罗马钉子仍是钉子）// 对比：其他物品变化太大（罗马灯具vs LED灯带）→ 研究优势：可以追踪长期价格变化（vs跑车无法追踪）\n\n↓（核心观点）\n\n**逻辑层次5：廉价技术改变世界**（段落6-7作者论点） 作者立场：经济学家关注价格不必道歉 → 核心洞察：【精密技术获得炒作 // 廉价技术改变世界】→ 实例证明：（古腾堡印刷机：改变成本而非本质 + 需要廉价纸张配合）+（太阳能板：便宜后改变全球能源系统）\n\n↑（全文主旨）\n\n全文核心观点：通过钉子这一看似简单却历史悠久的技术产品，展示了技术进步的真正动力不在于复杂性，而在于成本的降低——真正改变世界的是那些变得廉价可及的技术。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：罗马钉子的神秘埋藏</strong>（段落1-2历史背景） 历史事件：罗马人撤出苏格兰时留下10吨钉子（约100万个）→ 埋藏原因：【撤退匆忙 + 不想让当地喀里多尼亚人得到武器级铁】→ 埋藏之深：近2000年后才被发现</p>\n<p>↓（价值演变）</p>\n<p><strong>逻辑层次2：钉子的历史价值</strong>（段落3价值体现） 价值转变：后来文明更重视铁匠劳动而非原材料 → 极端例证：17世纪弗吉尼亚人烧房取钉（搬迁时为回收钉子而烧毁房屋）→ 意义：凸显看似简单的技术实则稀缺、昂贵、有价值</p>\n<p>↓（价格变化）</p>\n<p><strong>逻辑层次3：钉子价格的大幅下降</strong>（段落4经济分析） 价格变化：18世纪晚期到20世纪中期下降90% → 原因分析：【部分原因：铁和能源更便宜 // 主要原因：制造商找到更有效的生产方法】</p>\n<p>↓（研究价值）</p>\n<p><strong>逻辑层次4：钉子作为研究对象的独特性</strong>（段落5研究意义） 钉子的特点：虽有变化但基本保持不变（罗马钉子仍是钉子）// 对比：其他物品变化太大（罗马灯具vs LED灯带）→ 研究优势：可以追踪长期价格变化（vs跑车无法追踪）</p>\n<p>↓（核心观点）</p>\n<p><strong>逻辑层次5：廉价技术改变世界</strong>（段落6-7作者论点） 作者立场：经济学家关注价格不必道歉 → 核心洞察：【精密技术获得炒作 // 廉价技术改变世界】→ 实例证明：（古腾堡印刷机：改变成本而非本质 + 需要廉价纸张配合）+（太阳能板：便宜后改变全球能源系统）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：通过钉子这一看似简单却历史悠久的技术产品，展示了技术进步的真正动力不在于复杂性，而在于成本的降低——真正改变世界的是那些变得廉价可及的技术。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】B. A recovered treasure hidden from local people\n\n> 为避开当地人而埋藏的宝物\n\n介绍罗马人留下的大量钉子，并解释匆忙撤离时不愿当地人得到可造武器的铁，所以深埋。\n\n> Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.\n\n十吨、近百万枚钉子以反常宝藏引出故事，需要后文回答为何留下。\n\n> Why had the Romans buried a million nails?\n\nWhy明确把阅读方向转到埋藏目的，撤退仓促和当地人可能得到铁提供答案。\n\n> The Romans buried the nails so deep that they would not be discovered for almost two millennia.\n\n深埋使两千年未发现，是藏匿做法的效果，标题应连到防止当地人取得。\n\n这一部分的推进关系是：\n\n> 大量钉子被留下 → 追问藏匿原因 → 防止当地人得到武器级铁\n\nhidden from local people对应不愿当地人取得与深埋行为；不是为等待未来获利。\n\n再看最强干扰项F：A plan to preserve nails until their market price rose。\n\n原文没有提出等涨价出售或取回的计划。\n\n**41题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】B. A recovered treasure hidden from local people</p>\n<blockquote>\n<p>为避开当地人而埋藏的宝物</p>\n</blockquote>\n<p>介绍罗马人留下的大量钉子，并解释匆忙撤离时不愿当地人得到可造武器的铁，所以深埋。</p>\n<blockquote>\n<p>Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.</p>\n</blockquote>\n<p>十吨、近百万枚钉子以反常宝藏引出故事，需要后文回答为何留下。</p>\n<blockquote>\n<p>Why had the Romans buried a million nails?</p>\n</blockquote>\n<p>Why明确把阅读方向转到埋藏目的，撤退仓促和当地人可能得到铁提供答案。</p>\n<blockquote>\n<p>The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n<p>深埋使两千年未发现，是藏匿做法的效果，标题应连到防止当地人取得。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>大量钉子被留下 → 追问藏匿原因 → 防止当地人得到武器级铁</p>\n</blockquote>\n<p>hidden from local people对应不愿当地人取得与深埋行为；不是为等待未来获利。</p>\n<p>再看最强干扰项F：A plan to preserve nails until their market price rose。</p>\n<p>原文没有提出等涨价出售或取回的计划。</p>\n<p><strong>41题选B。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. Burning houses to recover valuable workmanship\n\n> 为回收有价值的工艺劳动而烧房\n\n后世看重凝结在钉子里的熟练劳动，迁居者甚至烧房取钉，段末直接强调简单技术的稀缺和价值。\n\n> Later civilisations would value the skilled blacksmith's labour in a nail even more than the raw material.\n\nLater与前文时代衔接，even more说明钉子中的熟练劳动比原料更受重视。\n\n> This was an attempt to recover the valuable nails, which could be reused after sifting the ashes.\n\n回收后还能使用，解释人们为何从灰烬中取钉。\n\n> The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.\n\nunderlines把烧整屋的例子直接收束到技术的稀缺和价值，而不是殖民者品格。\n\n这一部分的推进关系是：\n\n> 熟练劳动珍贵 → 烧房回收钉子 → 技术稀缺昂贵得到凸显\n\nvaluable workmanship接住铁匠劳动，烧房是用极端代价显示这项技术珍贵。\n\n再看最强干扰项B：A recovered treasure hidden from local people。\n\n本段已转向后世与制钉技术，不再解释罗马人的军事材料保护。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. Burning houses to recover valuable workmanship</p>\n<blockquote>\n<p>为回收有价值的工艺劳动而烧房</p>\n</blockquote>\n<p>后世看重凝结在钉子里的熟练劳动，迁居者甚至烧房取钉，段末直接强调简单技术的稀缺和价值。</p>\n<blockquote>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material.</p>\n</blockquote>\n<p>Later与前文时代衔接，even more说明钉子中的熟练劳动比原料更受重视。</p>\n<blockquote>\n<p>This was an attempt to recover the valuable nails, which could be reused after sifting the ashes.</p>\n</blockquote>\n<p>回收后还能使用，解释人们为何从灰烬中取钉。</p>\n<blockquote>\n<p>The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n</blockquote>\n<p>underlines把烧整屋的例子直接收束到技术的稀缺和价值，而不是殖民者品格。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>熟练劳动珍贵 → 烧房回收钉子 → 技术稀缺昂贵得到凸显</p>\n</blockquote>\n<p>valuable workmanship接住铁匠劳动，烧房是用极端代价显示这项技术珍贵。</p>\n<p>再看最强干扰项B：A recovered treasure hidden from local people。</p>\n<p>本段已转向后世与制钉技术，不再解释罗马人的军事材料保护。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】C. The productive improvements behind cheaper nails\n\n> 钉子变便宜背后的生产改进\n\n价格大跌部分来自铁和能源变便宜，但主要功劳属于制造商提高钢转化为钉子的效率。\n\n> The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper.\n\n长时间90%的降幅提出需要解释的变化。\n\n> According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.\n\nalthough与most区分廉价投入的部分贡献和高效制法的主要贡献，标题应突出生产改进。\n\n这一部分的推进关系是：\n\n> 长期价格大降 → 原料与能源部分贡献 → 生产效率是主因\n\nproductive improvements保留most of the credit强调的主因，而不是把部分原因写成全部。\n\n再看最强干扰项G：A claim that technological complexity always matters most。\n\n这段讲更高生产效率带来的低成本，未把复杂程度列为决定因素。\n\n**43题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】C. The productive improvements behind cheaper nails</p>\n<blockquote>\n<p>钉子变便宜背后的生产改进</p>\n</blockquote>\n<p>价格大跌部分来自铁和能源变便宜，但主要功劳属于制造商提高钢转化为钉子的效率。</p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper.</p>\n</blockquote>\n<p>长时间90%的降幅提出需要解释的变化。</p>\n<blockquote>\n<p>According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n<p>although与most区分廉价投入的部分贡献和高效制法的主要贡献，标题应突出生产改进。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>长期价格大降 → 原料与能源部分贡献 → 生产效率是主因</p>\n</blockquote>\n<p>productive improvements保留most of the credit强调的主因，而不是把部分原因写成全部。</p>\n<p>再看最强干扰项G：A claim that technological complexity always matters most。</p>\n<p>这段讲更高生产效率带来的低成本，未把复杂程度列为决定因素。</p>\n<p><strong>43题选C。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】A. Why an almost unchanged object makes a useful comparison\n\n> 变化不大的物品为何便于比较\n\n灯具和车辆今昔差别大，钉子却仍基本是钉子，因此适合追踪长时期价格。\n\n> Nails themselves have changed over the years, but Sichel studied them because they haven't changed much.\n\n变化不大解释研究对象为何被选择，而不是说完全没变化。\n\n> Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails.\n\n古今灯车差异大，钉子却基本相同，用对照建立可比性。\n\n> It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.\n\n跑车不适合从1695年追踪，钉子则适合，将稳定性落实为价格研究的条件。\n\n这一部分的推进关系是：\n\n> 钉子基本延续 → 与灯车变化形成对照 → 适合长期价格比较\n\nalmost unchanged保留haven’t changed much的程度，comparison指同类物品价格可比。\n\n再看最强干扰项E：Burning houses to recover valuable workmanship。\n\n这是研究对象选择的理由，不是在继续讲烧房回收。\n\n**44题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】A. Why an almost unchanged object makes a useful comparison</p>\n<blockquote>\n<p>变化不大的物品为何便于比较</p>\n</blockquote>\n<p>灯具和车辆今昔差别大，钉子却仍基本是钉子，因此适合追踪长时期价格。</p>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much.</p>\n</blockquote>\n<p>变化不大解释研究对象为何被选择，而不是说完全没变化。</p>\n<blockquote>\n<p>Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails.</p>\n</blockquote>\n<p>古今灯车差异大，钉子却基本相同，用对照建立可比性。</p>\n<blockquote>\n<p>It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n<p>跑车不适合从1695年追踪，钉子则适合，将稳定性落实为价格研究的条件。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>钉子基本延续 → 与灯车变化形成对照 → 适合长期价格比较</p>\n</blockquote>\n<p>almost unchanged保留haven’t changed much的程度，comparison指同类物品价格可比。</p>\n<p>再看最强干扰项E：Burning houses to recover valuable workmanship。</p>\n<p>这是研究对象选择的理由，不是在继续讲烧房回收。</p>\n<p><strong>44题选A。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】D. Low costs that allow technologies to transform society\n\n> 让技术改变社会的低成本\n\n作者关注日常物品的价格，提出廉价技术改变世界，并以印刷配合便宜纸张、太阳能板降价论证。\n\n> I make no apology for being obsessed by a particular feature of everyday objects: their price.\n\n经济学家关注价格，为后文从物品史提炼成本意义铺路。\n\n> After writing two books about the history of inventions, one thing I've learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it's the cheap technologies that change the world.\n\n复杂技术的宣传热度与廉价技术的世界影响形成对照，中心落在低成本的力量。\n\n> Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.\n\n太阳能板从小众用途到改变能源系统，具体证明价格改变应用与社会影响。\n\n这一部分的推进关系是：\n\n> 研究价格 → 提出廉价技术改变世界 → 印刷与太阳能验证\n\nlow costs是诸例共有条件，transform society覆盖文明与能源系统的变化。\n\n再看最强干扰项G：A claim that technological complexity always matters most。\n\n文章把受到追捧的复杂技术与真正起作用的廉价技术作对照，不能倒转重点。\n\n**45题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】D. Low costs that allow technologies to transform society</p>\n<blockquote>\n<p>让技术改变社会的低成本</p>\n</blockquote>\n<p>作者关注日常物品的价格，提出廉价技术改变世界，并以印刷配合便宜纸张、太阳能板降价论证。</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price.</p>\n</blockquote>\n<p>经济学家关注价格，为后文从物品史提炼成本意义铺路。</p>\n<blockquote>\n<p>After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.</p>\n</blockquote>\n<p>复杂技术的宣传热度与廉价技术的世界影响形成对照，中心落在低成本的力量。</p>\n<blockquote>\n<p>Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<p>太阳能板从小众用途到改变能源系统，具体证明价格改变应用与社会影响。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>研究价格 → 提出廉价技术改变世界 → 印刷与太阳能验证</p>\n</blockquote>\n<p>low costs是诸例共有条件，transform society覆盖文明与能源系统的变化。</p>\n<p>再看最强干扰项G：A claim that technological complexity always matters most。</p>\n<p>文章把受到追捧的复杂技术与真正起作用的廉价技术作对照，不能倒转重点。</p>\n<p><strong>45题选D。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从罗马藏钉引出普通物品的价值 |\n| B | 以太阳能板说明降价扩大作用范围 |\n| C | 转向熟练劳动价值与烧房取钉 |\n| D | 用印刷与廉价纸张说明共同成本条件 |\n| E | 解释钉子适合长期价格比较的原因 |\n| F | 从价格研究提炼低成本的意义 |\n| G | 说明生产效率推动钉子降价 |\n| H | 总结效率和降价促成广泛社会影响 |\n\n全文推进：\n\n> 从罗马藏钉引出普通物品的价值 → 转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价 → 解释钉子适合长期价格比较的原因 → 从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围 → 总结效率和降价促成广泛社会影响\n\n完整顺序：\n\n**A → C → G → E → F → D → B → H**\n\n41—45：C、G、F、D、B。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从罗马藏钉引出普通物品的价值</td>\n</tr>\n<tr>\n<td>B</td>\n<td>以太阳能板说明降价扩大作用范围</td>\n</tr>\n<tr>\n<td>C</td>\n<td>转向熟练劳动价值与烧房取钉</td>\n</tr>\n<tr>\n<td>D</td>\n<td>用印刷与廉价纸张说明共同成本条件</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释钉子适合长期价格比较的原因</td>\n</tr>\ illed labour embodied in each nail could matter even more than the iron. Some settlers planning to move would burn a house and recover its nails from the ashes, demonstrating how precious the technology had once been.</p>\n</blockquote>\n<p>Skilled labour说明另一部分价值，烧房取钉再提供例子。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>That preciousness did not remain unchanged as production developed.</p>\n</blockquote>\n<p>That preciousness回指段末precious，转向生产发展后价值和价格的改变。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从罗马藏钉引出普通物品的价值 → 转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost.</p>\n</blockquote>\n<p>The comparison需要前面完成古今对象可比性的说明，此处还只是罗马藏钉，不能提前跳到比较结论。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为C → G → E。\n\n先看前段C的结尾：\n\n> Some settlers planning to move would burn a house and recover its nails from the ashes, demonstrating how precious the technology had once been.\n\n再看G段开头：\n\n> That preciousness did not remain unchanged as production developed.\n\nThat preciousness复现前段烧房取钉体现的珍贵，did not remain unchanged开启历史变化。\n\n本段内部继续写道：\n\n> Over a long period, nail prices fell dramatically. Cheaper iron and energy contributed, but the main explanation was that manufacturers found more efficient ways to turn steel into finished nails.\n\n价格大跌由廉价投入和生产效率解释，but the main明确主次。\n\n后段E开头是：\n\n> Tracking this fall is possible because the object has remained recognisably similar.\n\nthis fall接价格下降，下一段转问为什么能够追踪这一长时期变化。\n\n这三段的推进关系：\n\n> 转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价 → 解释钉子适合长期价格比较的原因\n\n再检验候选F：\n\n> The comparison directs attention to a feature of technology that publicity can obscure: cost.\n\ncomparison尚未解释，先讲它引向成本会遗漏当前期待的价格变化及其原因。\n\n**42题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>42题是全文第3段，局部关系为C → G → E。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>Some settlers planning to move would burn a house and recover its nails from the ashes, demonstrating how precious the technology had once been.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>That preciousness did not remain unchanged as production developed.</p>\n</blockquote>\n<p>That preciousness复现前段烧房取钉体现的珍贵，did not remain unchanged开启历史变化。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Over a long period, nail prices fell dramatically. Cheaper iron and energy contributed, but the main explanation was that manufacturers found more efficient ways to turn steel into finished nails.</p>\n</blockquote>\n<p>价格大跌由廉价投入和生产效率解释，but the main明确主次。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Tracking this fall is possible because the object has remained recognisably similar.</p>\n</blockquote>\n<p>this fall接价格下降，下一段转问为什么能够追踪这一长时期变化。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价 → 解释钉子适合长期价格比较的原因</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost.</p>\n</blockquote>\n<p>comparison尚未解释，先讲它引向成本会遗漏当前期待的价格变化及其原因。</p>\n<p><strong>42题选G。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → F → D。\n\n先看前段E的结尾：\n\n> Roman nails, unlike ancient vehicles and modern sports cars, provide a relatively stable basis for comparison.\n\n再看F段开头：\n\n> The comparison directs attention to a feature of technology that publicity can obscure: cost.\n\nThe comparison紧接古今钉子与车辆的可比性对照，将具体研究引向成本。\n\n本段内部继续写道：\n\n> Elaborate inventions often attract the most excitement. Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.\n\n复杂发明吸引宣传，普通人负担得起却可带来更大影响，Yet建立关键对照。\n\n后段D开头是：\n\n> Printing illustrates this wider effect.\n\nthis wider effect接far wider effect，Printing开始提供第一个例子。\n\n这三段的推进关系：\n\n> 解释钉子适合长期价格比较的原因 → 从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件\n\n再检验候选B：\n\n> Solar panels provide another illustration of the same principle.\n\nanother illustration预设已有例子，太阳能板应在印刷之后，不能先于第一个例子。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>43题是全文第5段，局部关系为E → F → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Roman nails, unlike ancient vehicles and modern sports cars, provide a relatively stable basis for comparison.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost.</p>\n</blockquote>\n<p>The comparison紧接古今钉子与车辆的可比性对照，将具体研究引向成本。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Elaborate inventions often attract the most excitement. Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.</p>\n</blockquote>\n<p>复杂发明吸引宣传，普通人负担得起却可带来更大影响，Yet建立关键对照。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Printing illustrates this wider effect.</p>\n</blockquote>\n<p>this wider effect接far wider effect，Printing开始提供第一个例子。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释钉子适合长期价格比较的原因 → 从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Solar panels provide another illustration of the same principle.</p>\n</blockquote>\n<p>another illustration预设已有例子，太阳能板应在印刷之后，不能先于第一个例子。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为F → D → B。\n\n先看前段F的结尾：\n\n> Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.\n\n再看D段开头：\n\n> Printing illustrates this wider effect.\n\nthis wider effect接前段可负担技术影响更广的判断，印刷被标为论据。\n\n本段内部继续写道：\n\n> The press transformed civilisation by changing the cost of writing, but its achievement also depended on cheaper surfaces on which to write. Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.\n\n印刷与便宜纸张共同改变成本，解释为什么不能只归功于显眼的发明。\n\n后段B开头是：\n\n> Solar panels provide another illustration of the same principle.\n\nanother illustration与same principle衔接同一成本原则的第二个例子。\n\n这三段的推进关系：\n\n> 从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围\n\n再检验候选C：\n\n> The material was only part of that value in later societies.\n\nThe material与later societies回到早先藏钉和劳动价值，放此处不能解释印刷这个已点出的例子。\n\n**44题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>44题是全文第6段，局部关系为F → D → B。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Printing illustrates this wider effect.</p>\n</blockquote>\n<p>this wider effect接前段可负担技术影响更广的判断，印刷被标为论据。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The press transformed civilisation by changing the cost of writing, but its achievement also depended on cheaper surfaces on which to write. Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.</p>\n</blockquote>\n<p>印刷与便宜纸张共同改变成本，解释为什么不能只归功于显眼的发明。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Solar panels provide another illustration of the same principle.</p>\n</blockquote>\n<p>another illustration与same principle衔接同一成本原则的第二个例子。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>The material was only part of that value in later societies.</p>\n</blockquote>\n<p>The material与later societies回到早先藏钉和劳动价值，放此处不能解释印刷这个已点出的例子。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为D → B → H。\n\n先看前段D的结尾：\n\n> Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.\n\n再看B段开头：\n\n> Solar panels provide another illustration of the same principle.\n\nanother illustration承接已有印刷案例，same principle沿用成本下降扩大影响的判断。\n\n本段内部继续写道：\n\n> Their early applications were limited, whereas falling prices allowed them to reshape the energy system on a much larger scale. What changed was not simply the existence of the technology, but its economic accessibility.\n\n有限早期用途与较大规模能源影响对照，economic accessibility说明变化关键。\n\n后段H开头是：\n\n> These examples explain why the price of an everyday object deserves serious attention.\n\nThese examples复数收拢印刷和太阳能两例，回到为何值得研究价格。\n\n这三段的推进关系：\n\n> 用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围 → 总结效率和降价促成广泛社会影响\n\n再检验候选C：\n\n> The material was only part of that value in later societies.\n\n原料只占部分价值属于前面钉子故事，不能接纸张后再引出这些现代技术例子的总结。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>45题是全文第7段，局部关系为D → B → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Solar panels provide another illustration of the same principle.</p>\n</blockquote>\n<p>another illustration承接已有印刷案例，same principle沿用成本下降扩大影响的判断。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Their early applications were limited, whereas falling prices allowed them to reshape the energy system on a much larger scale. What changed was not simply the existence of the technology, but its economic accessibility.</p>\n</blockquote>\n<p>有限早期用途与较大规模能源影响对照，economic accessibility说明变化关键。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>These examples explain why the price of an everyday object deserves serious attention.</p>\n</blockquote>\n<p>These examples复数收拢印刷和太阳能两例，回到为何值得研究价格。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围 → 总结效率和降价促成广泛社会影响</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>The material was only part of that value in later societies.</p>\n</blockquote>\n<p>原料只占部分价值属于前面钉子故事，不能接纸张后再引出这些现代技术例子的总结。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述
