提供从罗马时代比较的依据。</li>\n<li>C：Sichel studied them说明选择这个对象的理由，并未统计钉子比其他产品研究得少。</li>\n<li>D：makes perfect sense肯定的是追踪钉子长期价格，D改成钉子在世界发明中的重要性排名。</li>\n</ul>\n<h2>25题</h2>\n<blockquote>\n<p>Which of the following best summarises the last two paragraphs?</p>\n<p>下面哪一项最能概括最后两段？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落主旨题：概括最后两段共同的判断，并用印刷、纸张和太阳能板的例子核对概括是否覆盖且准确。</p>\n<p>题干限定the last two paragraphs，即第6、7段。先把两段都完整精读：第6段从日常物品的价格引出判断，第7段用印刷、纸和太阳能板展开说明。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it’s the cheap technologies that change the world.</p>\n<p>The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost</p>\n<p>until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<h3>A. Cheap technologies bring about revolutionary change.</h3>\n<blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p>第6段明确把<code>change the world</code>归给廉价技术；第7段说印刷机通过改变书写成本改变文明，又说太阳能板变便宜后正在改变全球能源系统。<code>A</code>用<code>Cheap technologies</code>点出共同条件，用<code>revolutionary change</code>概括改变世界、文明和能源系统这样的大幅影响。它把两段的判断与例证连成了技术便宜之后带来深刻变化的关系。</p>\n<p><code>Cheap technologies</code>对应第6段的<code>the cheap technologies</code>，<code>revolutionary change</code>则要接<code>change the world</code>与第7段的<code>transformed civilisation</code>、<code>transforming the global energy system</code>，因而合看第6段末句和第7段两个例子。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n<p>我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。</p>\n<p>古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。</p>\n</blockquote>\n<p>作者由价格兴趣提出总判断，再用文明与能源系统两个领域的变化支撑。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Cheap technologies bring about revolutionary change.</p>\n<p>最后两段主要说明：廉价技术带来革命性的变化。</p>\n</blockquote>\n<p>revolutionary change概括深刻社会变化，cheap technologies保留反复强调的成本条件，能够同时覆盖两段。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. Technological innovation is integral to economic success.</h3>\n<blockquote>\n<p>最后两段主要说明：技术创新是经济成功不可或缺的一部分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>两段写廉价技术改变文明和能源系统，B改成技术创新是经济成功的必要组成部分，条件、结果与必需性均不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：技术创新是经济成功不可或缺的一部分。</p>\n</blockquote>\n<p><code>Technological innovation</code>指向第6段的<code>technologies</code>与第7段的印刷机、纸、太阳能板；<code>economic success</code>则要与第6段的<code>change the world</code>及第7段的具体变化核对，因此回看第6段末句和第7段对成本与改变的说明。</p>\n<p>原文把<code>cheap technologies</code>与<code>change the world</code>相连，第7段也强调书写成本变化、太阳能板变便宜后带来文明和能源系统的变化。<code>B</code>的<code>Technological innovation</code>把关注点移到创新本身，<code>economic success</code>又把结果改成经济上的成功，并用<code>integral</code>说创新是这种成功不可或缺的组成部分。两段具体论述的是技术成本降低如何扩大改变世界的力量，没有建立经济成功必须包含技术创新的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n<p>我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。</p>\n<p>古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。</p>\n</blockquote>\n<p>第六段对照复杂技术的宣传与廉价技术的作用，第七段重点仍是成本怎样影响应用。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Technological innovation is integral to economic success.</p>\n<p>最后两段主要说明：技术创新是经济成功不可或缺的一部分。</p>\n</blockquote>\n<p>B需要经济成功及创新不可或缺的关系。价格属于经济因素，并不让全文结果自动等于economic success。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Technology defines people’s understanding of the world.</h3>\n<blockquote>\n<p>最后两段主要说明：技术界定人们对世界的理解。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>change the world的对象是现实世界，具体落实为文明与能源系统；C改成人们对世界的理解。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：技术界定人们对世界的理解。</p>\n</blockquote>\n<p><code>people’s understanding of the world</code>说技术怎样影响人的认识；第6段写<code>change the world</code>，第7段写<code>transformed civilisation</code>和<code>transforming the global energy system</code>，要核对这里变化的是人的理解还是文明、能源系统本身。</p>\n<p>原文的<code>change the world</code>指向世界发生变化，后面具体落实为文明改变和全球能源系统改变。<code>C</code>的<code>people’s understanding of the world</code>则把对象换成人对世界的理解，主张技术界定这种认识。两段举例说明的是成本下降后技术在社会与能源方面产生的实际作用，并没有把这些变化进一步接到人们怎样理解世界。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n<p>我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。</p>\n<p>古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。</p>\n</blockquote>\n<p>作者用成本变化带来的实际社会作用展开总判断，没有讨论人的观念怎样被技术界定。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Technology defines people’s understanding of the world.</p>\n<p>最后两段主要说明：技术界定人们对世界的理解。</p>\n</blockquote>\n<p>C需要理解、认知变化的证据。改变世界可以影响认识，但本文没有建立这一额外关系。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Sophisticated technologies develop from small inventions.</h3>\n<blockquote>\n<p>最后两段主要说明：复杂技术由小发明发展而来。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后两段主要说明：复杂技术由小发明发展而来。</p>\n</blockquote>\n<p>复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。</p>\n<p>while连接两类技术获得的不同结果，印刷与纸张例子进一步说明作用取决于配套成本。</p>\n<p>D需要技术起源链条。印刷作用离不开便宜纸张，不等于印刷由纸发展而来；廉价也不等于小发明。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.\nThe Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n<p>我对日常物品的某个特征——价格——着迷，并不为此道歉，毕竟我是经济学家。写了两本发明史书后，我认识到：吸引人而复杂精巧的技术受到大肆宣传，但改变世界的是廉价技术。</p>\n<p>古腾堡印刷机改变文明，靠的不是改变书写本质，而是改变成本；如果没有书写材料价格同步大跌，它也成就不了多少，这得益于常被忽视的纸张技术。太阳能板变便宜之前用途仅限少数特定领域，如今却正在改变全球能源系统。</p>\n</blockquote>\n<p>while连接两类技术获得的不同结果，印刷与纸张例子进一步说明作用取决于配套成本。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Sophisticated technologies develop from small inventions.</p>\n<p>最后两段主要说明：复杂技术由小发明发展而来。</p>\n</blockquote>\n<p>D需要技术起源链条。印刷作用离不开便宜纸张，不等于印刷由纸发展而来；廉价也不等于小发明。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>25题结论</h3>\n<blockquote>\n<p><strong>25. A</strong></p>\n</blockquote>\n<ul>\n<li>A：第六段说廉价技术改变世界，第七段以印刷、便宜纸和太阳能板说明成本下降后扩大影响，A概括共同关系。</li>\n<li>B：两段写廉价技术改变文明和能源系统，B改成技术创新是经济成功的必要组成部分，条件、结果与必需性均不同。</li>\n<li>C：change the world的对象是现实世界，具体落实为文明与能源系统；C改成人们对世界的理解。</li>\n<li>D：复杂技术得到宣传而廉价技术改变世界，是宣传与实际作用的对照，并非复杂技术由小发明发展而来。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：罗马钉子的神秘埋藏</strong>（段落1-2历史背景） 历史事件：罗马人撤出苏格兰时留下10吨钉子（约100万个）→ 埋藏原因：【撤退匆忙 + 不想让当地喀里多尼亚人得到武器级铁】→ 埋藏之深：近2000年后才被发现</p>\n<p>↓（价值演变）</p>\n<p><strong>逻辑层次2：钉子的历史价值</strong>（段落3价值体现） 价值转变：后来文明更重视铁匠劳动而非原材料 → 极端例证：17世纪弗吉尼亚人烧房取钉（搬迁时为回收钉子而烧毁房屋）→ 意义：凸显看似简单的技术实则稀缺、昂贵、有价值</p>\n<p>↓（价格变化）</p>\n<p><strong>逻辑层次3：钉子价格的大幅下降</strong>（段落4经济分析） 价格变化：18世纪晚期到20世纪中期下降90% → 原因分析：【部分原因：铁和能源更便宜 // 主要原因：制造商找到更有效的生产方法】</p>\n<p>↓（研究价值）</p>\n<p><strong>逻辑层次4：钉子作为研究对象的独特性</strong>（段落5研究意义） 钉子的特点：虽有变化但基本保持不变（罗马钉子仍是钉子）// 对比：其他物品变化太大（罗马灯具vs LED灯带）→ 研究优势：可以追踪长期价格变化（vs跑车无法追踪）</p>\n<p>↓（核心观点）</p>\n<p><strong>逻辑层次5：廉价技术改变世界</strong>（段落6-7作者论点） 作者立场：经济学家关注价格不必道歉 → 核心洞察：【精密技术获得炒作 // 廉价技术改变世界】→ 实例证明：（古腾堡印刷机：改变成本而非本质 + 需要廉价纸张配合）+（太阳能板：便宜后改变全球能源系统）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：通过钉子这一看似简单却历史悠久的技术产品，展示了技术进步的真正动力不在于复杂性，而在于成本的降低——真正改变世界的是那些变得廉价可及的技术。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Why an almost unchanged object makes a useful comparison</p>\n<p>B. A recovered treasure hidden from local people</p>\n<p>C. The productive improvements behind cheaper nails</p>\n<p>D. Low costs that allow technologies to transform society</p>\n<p>E. Burning houses to recover valuable workmanship</p>\n<p>F. A plan to preserve nails until their market price rose</p>\n<p>G. A claim that technological complexity always matters most</p>\n<p><strong>41.</strong></p>\n<p>Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things. The nail hoard was discovered in 1960 in a four-metre-deep pit covered by two metres of gravel. Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n<p><strong>42.</strong></p>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n<p><strong>43.</strong></p>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper. According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n<p><strong>44.</strong></p>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much. Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails. It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n<p><strong>45.</strong></p>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price. I am an economist, after all. After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world. The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost— and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper. Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】B. A recovered treasure hidden from local people</p>\n<blockquote>\n<p>为避开当地人而埋藏的宝物</p>\n</blockquote>\n<p>介绍罗马人留下的大量钉子，并解释匆忙撤离时不愿当地人得到可造武器的铁，所以深埋。</p>\n<blockquote>\n<p>Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.</p>\n</blockquote>\n<p>十吨、近百万枚钉子以反常宝藏引出故事，需要后文回答为何留下。</p>\n<blockquote>\n<p>Why had the Romans buried a million nails?</p>\n</blockquote>\n<p>Why明确把阅读方向转到埋藏目的，撤退仓促和当地人可能得到铁提供答案。</p>\n<blockquote>\n<p>The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n<p>深埋使两千年未发现，是藏匿做法的效果，标题应连到防止当地人取得。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>大量钉子被留下 → 追问藏匿原因 → 防止当地人得到武器级铁</p>\n</blockquote>\n<p>hidden from local people对应不愿当地人取得与深埋行为；不是为等待未来获利。</p>\n<p>再看最强干扰项F：A plan to preserve nails until their market price rose。</p>\n<p>原文没有提出等涨价出售或取回的计划。</p>\n<p><strong>41题选B。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】E. Burning houses to recover valuable workmanship</p>\n<blockquote>\n<p>为回收有价值的工艺劳动而烧房</p>\n</blockquote>\n<p>后世看重凝结在钉子里的熟练劳动，迁居者甚至烧房取钉，段末直接强调简单技术的稀缺和价值。</p>\n<blockquote>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material.</p>\n</blockquote>\n<p>Later与前文时代衔接，even more说明钉子中的熟练劳动比原料更受重视。</p>\n<blockquote>\n<p>This was an attempt to recover the valuable nails, which could be reused after sifting the ashes.</p>\n</blockquote>\n<p>回收后还能使用，解释人们为何从灰烬中取钉。</p>\n<blockquote>\n<p>The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n</blockquote>\n<p>underlines把烧整屋的例子直接收束到技术的稀缺和价值，而不是殖民者品格。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>熟练劳动珍贵 → 烧房回收钉子 → 技术稀缺昂贵得到凸显</p>\n</blockquote>\n<p>valuable workmanship接住铁匠劳动，烧房是用极端代价显示这项技术珍贵。</p>\n<p>再看最强干扰项B：A recovered treasure hidden from local people。</p>\n<p>本段已转向后世与制钉技术，不再解释罗马人的军事材料保护。</p>\n<p><strong>42题选E。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】C. The productive improvements behind cheaper nails</p>\n<blockquote>\n<p>钉子变便宜背后的生产改进</p>\n</blockquote>\n<p>价格大跌部分来自铁和能源变便宜，但主要功劳属于制造商提高钢转化为钉子的效率。</p>\n<blockquote>\n<p>The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper.</p>\n</blockquote>\n<p>长时间90%的降幅提出需要解释的变化。</p>\n<blockquote>\n<p>According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.</p>\n</blockquote>\n<p>although与most区分廉价投入的部分贡献和高效制法的主要贡献，标题应突出生产改进。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>长期价格大降 → 原料与能源部分贡献 → 生产效率是主因</p>\n</blockquote>\n<p>productive improvements保留most of the credit强调的主因，而不是把部分原因写成全部。</p>\n<p>再看最强干扰项G：A claim that technological complexity always matters most。</p>\n<p>这段讲更高生产效率带来的低成本，未把复杂程度列为决定因素。</p>\n<p><strong>43题选C。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】A. Why an almost unchanged object makes a useful comparison</p>\n<blockquote>\n<p>变化不大的物品为何便于比较</p>\n</blockquote>\n<p>灯具和车辆今昔差别大，钉子却仍基本是钉子，因此适合追踪长时期价格。</p>\n<blockquote>\n<p>Nails themselves have changed over the years, but Sichel studied them because they haven&#39;t changed much.</p>\n</blockquote>\n<p>变化不大解释研究对象为何被选择，而不是说完全没变化。</p>\n<blockquote>\n<p>Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails.</p>\n</blockquote>\n<p>古今灯车差异大，钉子却基本相同，用对照建立可比性。</p>\n<blockquote>\n<p>It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.</p>\n</blockquote>\n<p>跑车不适合从1695年追踪，钉子则适合，将稳定性落实为价格研究的条件。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>钉子基本延续 → 与灯车变化形成对照 → 适合长期价格比较</p>\n</blockquote>\n<p>almost unchanged保留haven’t changed much的程度，comparison指同类物品价格可比。</p>\n<p>再看最强干扰项E：Burning houses to recover valuable workmanship。</p>\n<p>这是研究对象选择的理由，不是在继续讲烧房回收。</p>\n<p><strong>44题选A。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】D. Low costs that allow technologies to transform society</p>\n<blockquote>\n<p>让技术改变社会的低成本</p>\n</blockquote>\n<p>作者关注日常物品的价格，提出廉价技术改变世界，并以印刷配合便宜纸张、太阳能板降价论证。</p>\n<blockquote>\n<p>I make no apology for being obsessed by a particular feature of everyday objects: their price.</p>\n</blockquote>\n<p>经济学家关注价格，为后文从物品史提炼成本意义铺路。</p>\n<blockquote>\n<p>After writing two books about the history of inventions, one thing I&#39;ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it&#39;s the cheap technologies that change the world.</p>\n</blockquote>\n<p>复杂技术的宣传热度与廉价技术的世界影响形成对照，中心落在低成本的力量。</p>\n<blockquote>\n<p>Solar panels had a few niche uses until they became cheap; now they are transforming the global energy system.</p>\n</blockquote>\n<p>太阳能板从小众用途到改变能源系统，具体证明价格改变应用与社会影响。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>研究价格 → 提出廉价技术改变世界 → 印刷与太阳能验证</p>\n</blockquote>\n<p>low costs是诸例共有条件，transform society覆盖文明与能源系统的变化。</p>\n<p>再看最强干扰项G：A claim that technological complexity always matters most。</p>\n<p>文章把受到追捧的复杂技术与真正起作用的廉价技术作对照，不能倒转重点。</p>\n<p><strong>45题选D。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>A hoard of nearly a million Roman nails raises a question about the value of an ordinary object. The nails were buried deeply during a withdrawal from Scotland. Their concealment suggests that even a simple item could represent a material worth keeping out of other people’s hands.</p>\n<p><strong>B.</strong></p>\n<p>Solar panels provide another illustration of the same principle. Their early applications were limited, whereas falling prices allowed them to reshape the energy system on a much larger scale. What changed was not simply the existence of the technology, but its economic accessibility.</p>\n<p><strong>C.</strong></p>\n<p>The material was only part of that value in later societies. Skilled labour embodied in each nail could matter even more than the iron. Some settlers planning to move would burn a house and recover its nails from the ashes, demonstrating how precious the technology had once been.</p>\n<p><strong>D.</strong></p>\n<p>Printing illustrates this wider effect. The press transformed civilisation by changing the cost of writing, but its achievement also depended on cheaper surfaces on which to write. Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.</p>\n<p><strong>E.</strong></p>\n<p>Tracking this fall is possible because the object has remained recognisably similar. Many other technologies have changed so much that their prices cannot be compared meaningfully across centuries. Roman nails, unlike ancient vehicles and modern sports cars, provide a relatively stable basis for comparison.</p>\n<p><strong>F.</strong></p>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost. Elaborate inventions often attract the most excitement. Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.</p>\n<p><strong>G.</strong></p>\n<p>That preciousness did not remain unchanged as production developed. Over a long period, nail prices fell dramatically. Cheaper iron and energy contributed, but the main explanation was that manufacturers found more efficient ways to turn steel into finished nails.</p>\n<p><strong>H.</strong></p>\n<p>These examples explain why the price of an everyday object deserves serious attention. Improving efficiency and reducing cost can carry a technology beyond a narrow range of uses. A modest-looking invention may consequently change more lives than one celebrated mainly for its complexity.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从罗马藏钉引出普通物品的价值</td>\n</tr>\n<tr>\n<td>B</td>\n<td>以太阳能板说明降价扩大作用范围</td>\n</tr>\n<tr>\n<td>C</td>\n<td>转向熟练劳动价值与烧房取钉</td>\n</tr>\n<tr>\n<td>D</td>\n<td>用印刷与廉价纸张说明共同成本条件</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释钉子适合长期价格比较的原因</td>\n</tr>\n<tr>\n<td>F</td>\n<td>从价格研究提炼低成本的意义</td>\n</tr>\n<tr>\n<td>G</td>\n<td>说明生产效率推动钉子降价</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结效率和降价促成广泛社会影响</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从罗马藏钉引出普通物品的价值 → 转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价 → 解释钉子适合长期价格比较的原因 → 从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围 → 总结效率和降价促成广泛社会影响</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → C → G → E → F → D → B → H</strong></p>\n<p>41—45：C、G、F、D、B。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → C → G。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their concealment suggests that even a simple item could represent a material worth keeping out of other people’s hands.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The material was only part of that value in later societies.</p>\n</blockquote>\n<p>The material回接前文被藏起来的铁，only part将价值从原料扩展到劳动。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Skilled labour embodied in each nail could matter even more than the iron. Some settlers planning to move would burn a house and recover its nails from the ashes, demonstrating how precious the technology had once been.</p>\n</blockquote>\n<p>Skilled labour说明另一部分价值，烧房取钉再提供例子。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>That preciousness did not remain unchanged as production developed.</p>\n</blockquote>\n<p>That preciousness回指段末precious，转向生产发展后价值和价格的改变。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从罗马藏钉引出普通物品的价值 → 转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost.</p>\n</blockquote>\n<p>The comparison需要前面完成古今对象可比性的说明，此处还只是罗马藏钉，不能提前跳到比较结论。</p>\n<p><strong>41题选C。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为C → G → E。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>Some settlers planning to move would burn a house and recover its nails from the ashes, demonstrating how precious the technology had once been.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>That preciousness did not remain unchanged as production developed.</p>\n</blockquote>\n<p>That preciousness复现前段烧房取钉体现的珍贵，did not remain unchanged开启历史变化。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Over a long period, nail prices fell dramatically. Cheaper iron and energy contributed, but the main explanation was that manufacturers found more efficient ways to turn steel into finished nails.</p>\n</blockquote>\n<p>价格大跌由廉价投入和生产效率解释，but the main明确主次。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Tracking this fall is possible because the object has remained recognisably similar.</p>\n</blockquote>\n<p>this fall接价格下降，下一段转问为什么能够追踪这一长时期变化。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转向熟练劳动价值与烧房取钉 → 说明生产效率推动钉子降价 → 解释钉子适合长期价格比较的原因</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost.</p>\n</blockquote>\n<p>comparison尚未解释，先讲它引向成本会遗漏当前期待的价格变化及其原因。</p>\n<p><strong>42题选G。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → F → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Roman nails, unlike ancient vehicles and modern sports cars, provide a relatively stable basis for comparison.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The comparison directs attention to a feature of technology that publicity can obscure: cost.</p>\n</blockquote>\n<p>The comparison紧接古今钉子与车辆的可比性对照，将具体研究引向成本。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Elaborate inventions often attract the most excitement. Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.</p>\n</blockquote>\n<p>复杂发明吸引宣传，普通人负担得起却可带来更大影响，Yet建立关键对照。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Printing illustrates this wider effect.</p>\n</blockquote>\n<p>this wider effect接far wider effect，Printing开始提供第一个例子。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释钉子适合长期价格比较的原因 → 从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>Solar panels provide another illustration of the same principle.</p>\n</blockquote>\n<p>another illustration预设已有例子，太阳能板应在印刷之后，不能先于第一个例子。</p>\n<p><strong>43题选F。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为F → D → B。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Yet a technology can have a far wider effect when ordinary people can afford to obtain and use it.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Printing illustrates this wider effect.</p>\n</blockquote>\n<p>this wider effect接前段可负担技术影响更广的判断，印刷被标为论据。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The press transformed civilisation by changing the cost of writing, but its achievement also depended on cheaper surfaces on which to write. Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.</p>\n</blockquote>\n<p>印刷与便宜纸张共同改变成本，解释为什么不能只归功于显眼的发明。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Solar panels provide another illustration of the same principle.</p>\n</blockquote>\n<p>another illustration与same principle衔接同一成本原则的第二个例子。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从价格研究提炼低成本的意义 → 用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>The material was only part of that value in later societies.</p>\n</blockquote>\n<p>The material与later societies回到早先藏钉和劳动价值，放此处不能解释印刷这个已点出的例子。</p>\n<p><strong>44题选D。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为D → B → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>Paper therefore formed an essential part of a change often attributed to the more conspicuous invention alone.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Solar panels provide another illustration of the same principle.</p>\n</blockquote>\n<p>another illustration承接已有印刷案例，same principle沿用成本下降扩大影响的判断。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Their early applications were limited, whereas falling prices allowed them to reshape the energy system on a much larger scale. What changed was not simply the existence of the technology, but its economic accessibility.</p>\n</blockquote>\n<p>有限早期用途与较大规模能源影响对照，economic accessibility说明变化关键。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>These examples explain why the price of an everyday object deserves serious attention.</p>\n</blockquote>\n<p>These examples复数收拢印刷和太阳能两例，回到为何值得研究价格。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用印刷与廉价纸张说明共同成本条件 → 以太阳能板说明降价扩大作用范围 → 总结效率和降价促成广泛社会影响</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>The material was only part of that value in later societies.</p>\n</blockquote>\n<p>原料只占部分价值属于前面钉子故事，不能接纸张后再引出这些现代技术例子的总结。</p>\n<p><strong>45题选B。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>technological progress</strong></td>\n<td><strong>技术进步</strong></td>\n<td><strong>社会现象｜科技经济</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>productive efficiency</td>\n<td>生产效率</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>affordable innovation</td>\n<td>可负担的创新</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>practical value</strong></td>\n<td><strong>实用价值</strong></td>\n<td><strong>人生哲理｜实践能力</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>resource conservation</td>\n<td>资源节约</td>\n<td>社会现象｜社会生活：节约资源</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>social transformation</td>\n<td>社会变革</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>historical perspective</td>\n<td>历史视角</td>\n<td>人生哲理｜全局思维</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>everyday ingenuity</td>\n<td>日常巧思</td>\n<td>人生哲理｜创新意识</td>\n<td>个人主题</td>\n</tr>\n</tbody></table></div>\n<h2>2. 大作文第一段描述题目信息时可积累的表达</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The ordinary object contains the value of skilled labour.</strong></td>\n<td><strong>这件普通物品凝结着熟练劳动的价值。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene shows people finding a more efficient way to complete a familiar task.</td>\n<td>场景展示人们寻找完成熟悉任务的更高效方法。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture draws attention to an often-overlooked technology in everyday life.</td>\n<td>图画引导人们关注日常生活中常被忽视的技术。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The price fell by ninety percent over the period shown.</strong></td>\n<td><strong>价格在图示时期内下降了百分之九十。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Most of the reduction is associated with improvements in production efficiency.</td>\n<td>下降的大部分与生产效率改进有关。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>As the cost declined, the range of applications expanded.</td>\n<td>随着成本下降，应用范围不断扩大。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement suggests that affordability can matter more than complexity.</td>\n<td>这句话表明可负担性可能比复杂程度更重要。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage explains how a seemingly simple technology can transform society.</td>\n<td>这段文字解释看似简单的技术如何改变社会。</td>\n</tr>\n</tbody></table></div>\n";
