<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| pull out of | 撤离 | left behind | 留下 | curious | adj.奇特的 |\n| treasure | n.宝藏 | tons | n.吨 | hoard | n.囤藏物 |\n| pit | n.坑 | gravel | n.砾石 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,139,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>pull out of</td>\n<td>撤离</td>\n<td>left behind</td>\n<td>留下</td>\n<td>curious</td>\n<td>adj.奇特的</td>\n</tr>\n<tr>\n<td>treasure</td>\n<td>n.宝藏</td>\n<td>tons</td>\n<td>n.吨</td>\n<td>hoard</td>\n<td>n.囤藏物</td>\n</tr>\n<tr>\n<td>pit</td>\n<td>n.坑</td>\n<td>gravel</td>\n<td>n.砾石</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| likely | adj.可能的 | withdrawal | n.撤离 | rushed | adj.仓促的 |\n| getting their hands on | 获得；拿到 | weapon-grade | adj.可用于制造武器的 | buried | v.埋藏 |\n| discovered | v.发现 | millennia | n.千年（复数） |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,565,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>likely</td>\n<td>adj.可能的</td>\n<td>withdrawal</td>\n<td>n.撤离</td>\n<td>rushed</td>\n<td>adj.仓促的</td>\n</tr>\n<tr>\n<td>getting their hands on</td>\n<td>获得；拿到</td>\n<td>weapon-grade</td>\n<td>adj.可用于制造武器的</td>\n<td>b  id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things. The nail hoard was discovered in 1960 in a four-metre-deep pit covered by two metres of gravel.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>Nearly 2,000 years ago, / as the Romans began to pull out of Scotland, / they left behind / a curious treasure: / 10 tons of nails, / nearly a million of the things.</p>\n<p>The nail hoard / was discovered / in 1960 / in a four-metre-deep pit / covered by two metres of gravel.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段</h3>\n<p>将近2000年前，/ 当罗马人开始撤出苏格兰时，/ 他们留下了 / 一个奇特的宝藏：/ 10吨钉子，/ 将近一百万个。</p>\n<p>这批钉子 / 被发现 / 在1960年 / 在一个四米深的坑里 / 被两米厚的砾石覆盖着。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段</h3>\n<p>大约2000年前，当罗马人开始从苏格兰撤军时，他们留下了一个奇特的宝藏：10吨钉子，将近一百万个。这批钉子于1960年在一个四米深、被两米厚砾石覆盖的坑中被发现。</p>\n</section>"},{"title":"第2段","raw":"### 完整原文 · 第2段\n\nWhy had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</section>"},{"title":"第2段","raw":"### 意群划分 · 第2段\n\nWhy had the Romans / buried a million nails?\n\nThe likely explanation is / that the withdrawal was rushed, / and they didn't want / the local Caledonians / getting their hands on / 10 tons of weapon-grade iron.\n\nThe Romans buried the nails / so deep / that they would not be discovered / for almost two millennia.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Why had the Romans / buried a million nails?</p>\n<p>The likely explanation is / that the withdrawal was rushed, / and they didn&#39;t want / the local Caledonians / getting their hands on / 10 tons of weapon-grade iron.</p>\n<p>The Romans buried the nails / so deep / that they would not be discovered / for almost two millennia.</p>\n</section>"},{"title":"第2段","raw":"### 意群翻译 · 第2段\n\n为什么罗马人 / 埋葬了一百万个钉子？\n\n可能的解释是 / 撤退很匆忙，/ 而且他们不想要 / 当地的喀里多尼亚人 / 得到 / 10吨武器级的铁。\n\n罗马人把钉子埋得 / 如此之深 / 以至于它们不会被发现 / 将近两千年。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Why had the Romans / buried a million nails?</p>\n<p>The likely explanation is / that the withdrawal was rushed, / and they didn&#39;t want / the local Caledonians / getting their hands on / 10 tons of weapon-grade iron.</p>\n<p>The Romans buried the nails / so deep / that they would not be discovered / for almost two millennia.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>为什么罗马人 / 埋葬了一百万个钉子？</p>\n<p>可能的解释是 / 撤退很匆忙，/ 而且他们不想要 / 当地的喀里多尼亚人 / 得到 / 10吨武器级的铁。</p>\n<p>罗马人把钉子埋得 / 如此之深 / 以至于它们不会被发现 / 将近两千年。</p>\n</section>"},{"title":"第2段","raw":"### 标准译文 · 第2段\n\n罗马人为什么要埋葬一百万个钉子？可能的解释是撤退很匆忙，他们不想让当地的喀里多尼亚人得到10吨武器级的铁。罗马人把钉子埋得如此之深，以至于它们将近两千年都没有被发现。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[95,565,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true},"focusId":"focus-paragraph-2-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3>\n<p>Why had the Romans / buried a million nails?</p>\n<p>The likely explanation is / that the withdrawal was rushed, / and they didn&#39;t want / the local Caledonians / getting their hands on / 10 tons of weapon-grade iron.</p>\n<p>The Romans buried the nails / so deep / that they would not be discovered / for almost two millennia.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段</h3>\n<p>为什么罗马人 / 埋葬了一百万个钉子？</p>\n<p>可能的解释是 / 撤退很匆忙，/ 而且他们不想要 / 当地的喀里多尼亚人 / 得到 / 10吨武器级的铁。</p>\n<p>罗马人把钉子埋得 / 如此之深 / 以至于它们不会被发现 / 将近两千年。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-2-3\"><h3>标准译文 · 第2段</h3>\n<p>罗马人为什么要埋葬一百万个钉子？可能的解释是撤退很匆忙，他们不想让当地的喀里多尼亚人得到10吨武器级的铁。罗马人把钉子埋得如此之深，以至于它们将近两千年都没有被发现。</p>\n</section>"},{"title":"第3段","raw":"### 完整原文 · 第3段\n\nLater civilisations would value the skilled blacksmith's labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1024,900,668],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material. As Roma Agrawal explains on class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>Later civilisations / would value / the skilled blacksmith&#39;s labour in a nail / even more than / the raw material.</p>\n<p>As Roma Agrawal explains / in her new delightful book / Nuts and Bolts, / early 17th-century Virginians / would sometimes burn down their homes / if they were planning to relocate.</p>\n<p>This was an attempt / to recover the valuable nails, / which could be reused / after sifting the ashes.</p>\n<p>The idea / that one might burn down an entire house / just to reclaim the nails / underlines / how scarce, costly and valuable / the simple-seeming technology was.</p>\n</section>"},{"title":"第3段","raw":"### 意群翻译 · 第3段\n\n后来的文明 / 会重视 / 熟练铁匠在钉子上的劳动 / 甚至超过 / 原材料。\n\n正如罗马·阿格拉瓦尔解释的 / 在她令人愉快的新书中 / 《螺母和螺栓》，/ 17世纪早期的弗吉尼亚人 / 有时会烧毁他们的房屋 / 如果他们计划搬迁。\n\n这是一种尝试 / 回收有价值的钉子，/ 这些钉子可以重复使用 / 在筛选灰烬之后。\n\n这个想法 / 一个人可能烧毁整座房子 / 只是为了回收钉子 / 凸显了 / 多么稀缺、昂贵和有价值 / 这种看似简单的技术。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1024,900,668],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p ice of nails → was driven partly：(by cheaper iron and cheaper energy) // most of the credit → goes to nail manufacturers：(who simply found → more efficient ways：(to turn steel into nails)).\n\n**第5段**\n\nNails themselves → have changed：(over the years) // but Sichel studied them：(because they haven't changed much).\n\nRoman lamps and Roman chariots → are very different from → LED strips and sports cars // but Roman nails → are still clearly nails.\n\nIt would be absurd → to try to track → the changing price of sports cars：(since 1695) // but to ask the same question：(of nails) → makes perfect sense.\n\n**第6段**\n\nI make no apology → for being obsessed：(by a particular feature：(of everyday objects))：their price.\n\nI am an economist → after all.\n\nAfter writing two books：(about the history of inventions) → one thing I've learnt is：(that while it is → the enchantingly sophisticated technologies：(that get all the hype) // it's the cheap technologies：(that change the world)).\n\n**第7段**\n\nThe Gutenberg printing press → transformed civilisation → not by changing：(the nature of writing) // but by changing its cost— + it would have achieved little：(without a parallel collapse：(in the price of surfaces：(to write on)))：(thanks to → an often-overlooked technology：(called paper)).\n\nSolar panels → had a few niche uses：(until they became cheap); // now they are transforming → the global energy system.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>Nearly 2,000 years ago：(as the Romans began to pull out of Scotland) → they left behind → a curious treasure：(10 tons of nails：(nearly a million of the things)).</p>\n<p>The nail hoard → was discovered：(in 1960)：(in a four-metre-deep pit：(covered by two metres of gravel)).</p>\n<p><strong>第2段</strong></p>\n<p>Why had the Romans → buried a million nails?</p>\n<p>The likely explanation is：(that the withdrawal was rushed) + (they didn&#39;t want → the local Caledonians → getting their hands on → 10 tons of weapon-grade iron).</p>\n<p>The Romans buried the nails → so deep：(that they would not be discovered：(for almost two millennia)).</p>\n<p><strong>第3段</strong></p>\n<p>Later civilisations → would value → the skilled blacksmith&#39;s labour in a nail → even more than → the raw material.</p>\n<p>As Roma Agrawal explains：(in her new delightful book Nuts and Bolts) → early 17th-century Virginians → would sometimes burn down their homes：(if they were planning to relocate).</p>\n<p>This was an attempt → to recover the valuable nails：(which could be reused：(after sifting the ashes)).</p>\n<p>The idea：(that one might burn down an entire house：(just to reclaim the nails)) → underlines：(how scarce, costly and valuable → the simple-seeming technology was).</p>\n<p><strong>第4段</strong></p>\n<p>The price of nails → fell by 90%：(between the late 1700s and mid-1900s) → as economist Daniel Sichel → points out：(in a research paper).</p>\n<p>According to Sichel → although the falling price of nails → was driven partly：(by cheaper iron and cheaper energy) // most of the credit → goes to nail manufacturers：(who simply found → more efficient ways：(to turn steel into nails)).</p>\n<p><strong>第5段</strong></p>\n<p>Nails themselves → have changed：(over the years) // but Sichel studied them：(because they haven&#39;t changed much).</p>\n<p>Roman lamps and Roman chariots → are very different from → LED strips and sports cars // but Roman nails → are still clearly nails.</p>\n<p>It would be absurd → to try to track → the changing price of sports cars：(since 1695) // but to ask the same question：(of nails) → makes perfect sense.</p>\n<p><strong>第6段</strong></p>\n<p>I make no apology → for being obsessed：(by a particular feature：(of everyday objects))：their price.</p>\n<p>I am an economist → after all.</p>\n<p>After writing two books：(about the history of inventions) → one thing I&#39;ve learnt is：(that while it is → the enchantingly sophisticated technologies：(that get all the hype) // it&#39;s the cheap technologies：(that change the world)).</p>\n<p><strong>第7段</strong></p>\n<p>The Gutenberg printing press → transformed civilisation → not by changing：(the nature of writing) // but by changing its cost— + it would have achieved little：(without a parallel collapse：(in the price of surfaces：(to write on)))：(thanks to → an often-overlooked technology：(called paper)).</p>\n<p>Solar panels → had a few niche uses：(until they became cheap); // now they are transforming → the global energy system.</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n将近2000年前：(当罗马人开始撤出苏格兰时) → 他们留下了 → 一个奇特的宝藏：(10吨钉子：(将近一百万个))。\n\n这批钉子 → 被发现：(在1960年)：(在一个四米深的坑里：(被两米厚的砾石覆盖着))。\n\n**第2段**\n\n为什么罗马人 → 埋葬了一百万个钉子？\n\n可能的解释是：(撤退很匆忙) + (他们不想要 → 当地的喀里多尼亚人 → 得到 → 10吨武器级的铁)。\n\n罗马人把钉子埋得 → 如此之深：(以至于它们不会被发现：(将近两千年))。\n\n**第3段**\n\n后来的文明 → 会重视 → 熟练铁匠在钉子上的劳动 → 甚至超过 → 原材料。\n\n正如罗马·阿格拉瓦尔解释的：(在她令人愉快的新书《螺母和螺栓》中) → 17世纪早期的弗吉尼亚人 → 有时会烧毁他们的房屋：(如果他们计划搬迁)。\n\n这是一种尝试 → 回收有价值的钉子：(这些钉子可以重复使用：(在筛选灰烬之后))。\n\n这个想法：(一个人可能烧毁整座房子：(只是为了回收钉子)) → 凸显了：(多么稀缺、昂贵和有价值 → 这种看似简单的技术)。\n\n**第4段**\n\n钉子的价格 → 下降了90%：(在18世纪晚期到20世纪中期之间) → 正如经济学家丹尼尔·西歇尔 → 指出的：(在一篇研究论文中)。\n\n根据西歇尔的说法 → 尽管钉子价格的下降 → 部分是由于：(更便宜的铁和更便宜的能源) // 大部分功劳 → 归于钉子制造商：(他们只是找到了 → 更有效的方法：(把钢铁变成钉子))。\n\n**第5段**\n\n钉子本身 → 已经改变了：(这些年来) // 但西歇尔研究它们：(因为它们没有改变太多)。\n\n罗马灯具和罗马战车 → 与...非常不同 → LED灯带和跑车 // 但罗马钉子 → 仍然明显是钉子。\n\n这将是荒谬的 → 试图追踪 → 跑车价格的变化：(自1695年以来) // 但问同样的问题：(关于钉子) → 完全合理。\n\n**第6段**\n\n我不道歉 → 对于痴迷：(于一个特定特征：(日常物品的))：它们的价格。\n\n我是一个经济学家 → 毕竟。\n\n在写了两本书之后：(关于发明的历史) → 我学到的一件事是：(虽然是 → 迷人的精密技术：(得到所有的炒作) // 是廉价的技术：(改变世界))。\n\n**第7段**\n\n古腾堡印刷机 → 改变了文明 → 不是通过改变：(书写的本质) // 而是通过改变其成本— + 它将几乎无所成就：(如果没有同时崩溃：(在书写表面的价格上：(用于书写)))：(多亏了 → 一个经常被忽视的技术：(叫做纸张))。\n\n太阳能电池板 → 有一些小众用途：(直到它们变得便宜)；// 现在它们正在改变 → 全球能源系统。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6 lockquote>\n<p>先说印刷改变成本，再说若无书写载体降价就成效有限，最后落到纸张。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>古登堡印刷机改变文明，靠的是改变书写成本，而非书写的性质；如果没有书写载体价格同时大幅下降，它也难有多大成就，而这种降价得益于纸张这项常被忽视的技术。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>parallel是同时相伴的成本下降，不能把纸张从条件关系中省略。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>古登堡印刷机改变文明，靠的是改变书写成本，而非书写的性质；如果没有书写载体价格同时大幅下降，它也难有多大成就，而这种降价得益于纸张这项常被忽视的技术。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> The Romans buried the nails probably for the sake of ______.\n>\n> 罗马人埋下钉子，很可能是为了什么？\n\n### 题型\n\n原因理解题：从Why设问后的解释区分藏钉行为与它要实现的目的。\n\n题干给出Romans和buried the nails，第2段正以Why had the Romans buried a million nails?发问。先把第2段完整读完，找作者对埋钉子原因的解释。\n\n### 核心出处\n\n> they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron\n>\n> The Romans buried the nails so deep that they would not be discovered for almost two millennia\n>\n> The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"21","questionIntro":true},"html":"<blockquote>\n<p>The Romans buried the nails probably for the sake of ______.</p>\n<p>罗马人埋下钉子，很可能是为了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>原因理解题：从Why设问后的解释区分藏钉行为与它要实现的目的。</p>\n<p>题干给出Romans和buried the nails，第2段正以Why had the Romans buried a million nails?发问。先把第2段完整读完，找作者对埋钉子原因的解释。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron</p>\n<p>The Romans buried the nails so deep that they would not be discovered for almost two millennia</p>\n<p>The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron</p>\n</blockquote>\n"},{"title":"A. saving them for future use","raw":"### A. saving them for future use\n\n> 罗马人埋钉子可能是为了把钉子留到将来使用。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n撤离者不愿当地人得到可造武器的铁，所以深埋。A把防止别人取得改成留待自己以后用，原文没有取回计划。\n\n**出处：**\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>罗马人埋钉子可能是为了把钉子留到将来使用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>撤离者不愿当地人得到可造武器的铁，所以深埋。A把防止别人取得改成留待自己以后用，原文没有取回计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section>"},{"title":"A. saving them for future use","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 罗马人埋钉子可能是为了把钉子留到将来使用。\n\n`saving them for future use`把埋藏解释为以后再用；第2段的`didn’t want the local Caledonians getting their hands on`说明他们想阻止谁得到这些东西，因此回看第2句的目的说明及第3句的深埋做法。\n\n原文给出的动机是`didn’t want the local Caledonians getting their hands on`，即不希望当地卡利多尼亚人得到这批铁；深埋的结果是钉子不会被发现。`A`的`saving them for future use`则把目的改成罗马人保存下来，以便将来使用。把东西埋住这一做法相同，但防止当地人取得，并没有建立罗马人今后取回使用的安排；深埋句谈的也是不被发现，而不是再取出。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>罗马人埋钉子可能是为了把钉子留到将来使用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>撤离者不愿当地人得到可造武器的铁，所以深埋。A把防止别人取得改成留待自己以后用，原文没有取回计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了把钉子留到将来使用。</p>\n</blockquote>\n<p><code>saving them for future use</code>把埋藏解释为以后再用；第2段的<code>didn’t want the local Caledonians getting their hands on</code>说明他们想阻止谁得到这些东西，因此回看第2句的目的说明及第3句的深埋做法。</p>\n<p>原文给出的动机是<code>didn’t want the local Caledonians getting their hands on</code>，即不希望当地卡利多尼亚人得到这批铁；深埋的结果是钉子不会被发现。<code>A</code>的<code>saving them for future use</code>则把目的改成罗马人保存下来，以便将来使用。把东西埋住这一做法相同，但防止当地人取得，并没有建立罗马人今后取回使用的安排；深埋句谈的也是不被发现，而不是再取出。</p>\n</section>"},{"title":"A. saving them for future use","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.\n>\n> 罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。\n\nWhy设问之后，仓促撤离与不让当地人得到铁共同解释藏钉行为；深度则说明藏得难以发现。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The Romans buried the nails for the sake of saving them for future use.\n>\n> 罗马人埋钉子可能是为了把钉子留到将来使用。\n\nA需要未来再取回使用这一目的。埋藏既可能保存也可能阻止他人取得，但这里已有后者的明确说明，不能仅凭埋起来就选A。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>罗马人埋钉子可能是为了把钉子留到将来使用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>撤离者不愿当地人得到可造武器的铁，所以深埋。A把防止别人取得改成留待自己以后用，原文没有取回计划。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了把钉子留到将来使用。</p>\n</blockquote>\n<p><code>saving them for future use</code>把埋藏解释为以后再用；第2段的<code>didn’t want the local Caledonians getting their hands on</code>说明他们想阻止谁得到这些东西，因此回看第2句的目的说明及第3句的深埋做法。</p>\n<p>原文给出的动机是<code>didn’t want the local Caledonians getting their hands on</code>，即不希望当地卡利多尼亚人得到这批铁；深埋的结果是钉子不会被发现。<code>A</code>的<code>saving them for future use</code>则把目的改成罗马人保存下来，以便将来使用。把东西埋住这一做法相同，但防止当地人取得，并没有建立罗马人今后取回使用的安排；深埋句谈的也是不被发现，而不是再取出。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n<p>罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。</p>\n</blockquote>\n<p>Why设问之后，仓促撤离与不让当地人得到铁共同解释藏钉行为；深度则说明藏得难以发现。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Romans buried the nails for the sake of saving them for future use.</p>\n<p>罗马人埋钉子可能是为了把钉子留到将来使用。</p>\n</blockquote>\n<p>A需要未来再取回使用这一目的。埋藏既可能保存也可能阻止他人取得，但这里已有后者的明确说明，不能仅凭埋起来就选A。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. keeping them from rusting","raw":"### B. keeping them from rusting\n\n> 罗马人埋钉子可能是为了防止钉子生锈。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n不希望当地人拿到铁，防范的是人的取得行为；B的rusting是金属生锈，换了要防止的事情。\n\n**出处：**\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-B-0\"><blockquote>\n<p>罗马人埋钉子可能是为了防止钉子生锈。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>不希望当地人拿到铁，防范的是人的取得行为；B的rusting是金属生锈，换了要防止的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section>"},{"title":"B. keeping them from rusting","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 罗马人埋钉子可能是为了防止钉子生锈。\n\n`keeping them from rusting`谈钉子自身的变化；第2段以`didn’t want the local Caledonians getting their hands on`交代埋藏的动机，要回看这句究竟要防止什么。\n\n原文的`didn’t want the local Caledonians getting their hands on`指向当地人得到铁这一行为，罗马人想防止的是铁落入他们手里。`B`的`keeping them from rusting`说的则是防止钉子生锈，把对当地人取得物品的顾虑改成对金属保存状态的顾虑。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-B-0\"><blockquote>\n<p>罗马人埋钉子可能是为了防止钉子生锈。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>不希望当地人拿到铁，防范的是人的取得行为；B的rusting是金属生锈，换了要防止的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了防止钉子生锈。</p>\n</blockquote>\n<p><code>keeping them from rusting</code>谈钉子自身的变化；第2段以<code>didn’t want the local Caledonians getting their hands on</code>交代埋藏的动机，要回看这句究竟要防止什么。</p>\n<p>原文的<code>didn’t want the local Caledonians getting their hands on</code>指向当地人得到铁这一行为，罗马人想防止的是铁落入他们手里。<code>B</code>的<code>keeping them from rusting</code>说的则是防止钉子生锈，把对当地人取得物品的顾虑改成对金属保存状态的顾虑。</p>\n</section>"},{"title":"B. keeping them from rusting","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.\n>\n> 罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。\n\n作者追问为什么埋，回答围绕撤退局势、当地人和武器级铁，没有转向物品养护。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The Romans buried the nails for the sake of keeping them from rusting.\n>\n> 罗马人埋钉子可能是为了防止钉子生锈。\n\nB需要防锈与埋藏之间的解释。深埋只说明不易被发现，不能自动证明采用该方法是为了防锈。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-B-0\"><blockquote>\n<p>罗马人埋钉子可能是为了防止钉子生锈。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>不希望当地人拿到铁，防范的是人的取得行为；B的rusting是金属生锈，换了要防止的事情。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了防止钉子生锈。</p>\n</blockquote>\n<p><code>keeping them from rusting</code>谈钉子自身的变化；第2段以<code>didn’t want the local Caledonians getting their hands on</code>交代埋藏的动机，要回看这句究竟要防止什么。</p>\n<p>原文的<code>didn’t want the local Caledonians getting their hands on</code>指向当地人得到铁这一行为，罗马人想防止的是铁落入他们手里。<code>B</code>的<code>keeping them from rusting</code>说的则是防止钉子生锈，把对当地人取得物品的顾虑改成对金属保存状态的顾虑。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n<p>罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。</p>\n</blockquote>\n<p>作者追问为什么埋，回答围绕撤退局势、当地人和武器级铁，没有转向物品养护。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Romans buried the nails for the sake of keeping them from rusting.</p>\n<p>罗马人埋钉子可能是为了防止钉子生锈。</p>\n</blockquote>\n<p>B需要防锈与埋藏之间的解释。深埋只说明不易被发现，不能自动证明采用该方法是为了防锈。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. letting them grow in value","raw":"### C. letting them grow in value\n\n> 罗马人埋钉子可能是为了让钉子增值。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n十吨钉子有价值是故事背景，但埋藏理由是不让当地人得到，原段没有等待价格或价值上涨的安排。\n\n**出处：**\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-C-0\"><blockquote>\n<p>罗马人埋钉子可能是为了让钉子增值。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>十吨钉子有价值是故事背景，但埋藏理由是不让当地人得到，原段没有等待价格或价值上涨的安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section>"},{"title":"C. letting them grow in value","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 罗马人埋钉子可能是为了让钉子增值。\n\n`letting them grow in value`主张埋藏是为了提高价值；第2段的`getting their hands on`谈的是这批铁由谁取得，回看第2句给出的埋藏理由。\n\n原文先交代撤离仓促，再说罗马人不愿当地人`getting their hands on`这批铁，解释的是撤离时为何要把东西藏起来。`C`的`letting them grow in value`则说，他们用埋藏来等待或促成钉子升值。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-C-0\"><blockquote>\n<p>罗马人埋钉子可能是为了让钉子增值。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>十吨钉子有价值是故事背景，但埋藏理由是不让当地人得到，原段没有等待价格或价值上涨的安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了让钉子增值。</p>\n</blockquote>\n<p><code>letting them grow in value</code>主张埋藏是为了提高价值；第2段的<code>getting their hands on</code>谈的是这批铁由谁取得，回看第2句给出的埋藏理由。</p>\n<p>原文先交代撤离仓促，再说罗马人不愿当地人<code>getting their hands on</code>这批铁，解释的是撤离时为何要把东西藏起来。<code>C</code>的<code>letting them grow in value</code>则说，他们用埋藏来等待或促成钉子升值。</p>\n</section>"},{"title":"C. letting them grow in value","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.\n>\n> 罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。\n\n原因句先交代仓促撤离，再给出不愿当地人获得铁的意图，末句说明隐藏效果。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The Romans buried the nails for the sake of letting them grow in value.\n>\n> 罗马人埋钉子可能是为了让钉子增值。\n\nC需要通过埋藏让价值增长的预期。有价值与为了增值是两个命题，前者不能直接推出后者。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-C-0\"><blockquote>\n<p>罗马人埋钉子可能是为了让钉子增值。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>十吨钉子有价值是故事背景，但埋藏理由是不让当地人得到，原段没有等待价格或价值上涨的安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了让钉子增值。</p>\n</blockquote>\n<p><code>letting them grow in value</code>主张埋藏是为了提高价值；第2段的<code>getting their hands on</code>谈的是这批铁由谁取得，回看第2句给出的埋藏理由。</p>\n<p>原文先交代撤离仓促，再说罗马人不愿当地人<code>getting their hands on</code>这批铁，解释的是撤离时为何要把东西藏起来。<code>C</code>的<code>letting them grow in value</code>则说，他们用埋藏来等待或促成钉子升值。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n<p>罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。</p>\n</blockquote>\n<p>原因句先交代仓促撤离，再给出不愿当地人获得铁的意图，末句说明隐藏效果。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Romans buried the nails for the sake of letting them grow in value.</p>\n<p>罗马人埋钉子可能是为了让钉子增值。</p>\n</blockquote>\n<p>C需要通过埋藏让价值增长的预期。有价值与为了增值是两个命题，前者不能直接推出后者。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. hiding them from the locals","raw":"### D. hiding them from the locals\n\n> 罗马人埋钉子可能是为了藏起钉子，不让当地人发现。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nthe local Caledonians就是当地人，深埋使钉子不被发现，D把对象和做法连成藏起来不让当地人得到。\n\n**出处：**\n\n> Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn't want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>罗马人埋钉子可能是为了藏起钉子，不让当地人发现。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一  weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>罗马人埋钉子可能是为了藏起钉子，不让当地人发现。</p>\n</blockquote>\n<p><code>hiding them from the locals</code>中的<code>locals</code>对应第2段的<code>the local Caledonians</code>，<code>hiding</code>则要结合<code>buried the nails so deep</code>与<code>would not be discovered</code>，所以回看第2、3句。</p>\n<p>原文说，罗马人不希望<code>the local Caledonians</code>拿到这批铁，于是钉子被埋得很深，不会被发现。<code>D</code>的<code>hiding them from the locals</code>把这两层连在一起：藏起钉子，让当地人找不到、拿不到。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Why had the Romans buried a million nails? The likely explanation is that the withdrawal was rushed, and they didn&#39;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron. The Romans buried the nails so deep that they would not be discovered for almost two millennia.</p>\n<p>罗马人为什么埋下一百万枚钉子？可能的解释是撤离仓促，他们不愿当地卡利多尼亚人得到十吨能用于制造武器的铁。他们把钉子埋得很深，以至于近两千年都未被发现。</p>\n</blockquote>\n<p>设问引出撤离原因，否定当地人取得的愿望随后落实为深埋这一行动。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Romans buried the nails for the sake of hiding them from the locals.</p>\n<p>罗马人埋钉子可能是为了藏起钉子，不让当地人发现。</p>\n</blockquote>\n<p>D既保留locals的对象，也保留hiding的行为，与原文解释相合；不必额外推测日后是否打算回来。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. D**\n\n- A：撤离者不愿当地人得到可造武器的铁，所以深埋。A把防止别人取得改成留待自己以后用，原文没有取回计划。\n- B：不希望当地人拿到铁，防范的是人的取得行为；B的rusting是金属生锈，换了要防止的事情。\n- C：十吨钉子有价值是故事背景，但埋藏理由是不让当地人得到，原段没有等待价格或价值上涨的安排。\n- D：the local Caledonians就是当地人，深埋使钉子不被发现，D把对象和做法连成藏起来不让当地人得到。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"21","questionConclusion":true},"html":"<blockquote>\n<p><strong>21. D</strong></p>\n</blockquote>\n<ul>\n<li>A：撤离者不愿当地人得到可造武器的铁，所以深埋。A把防止别人取得改成留待自己以后用，原文没有取回计划。</li>\n<li>B：不希望当地人拿到铁，防范的是人的取得行为；B的rusting是金属生锈，换了要防止的事情。</li>\n<li>C：十吨钉子有价值是故事背景，但埋藏理由是不让当地人得到，原段没有等待价格或价值上涨的安排。</li>\n<li>D：the local Caledonians就是当地人，深埋使钉子不被发现，D把对象和做法连成藏起来不让当地人得到。</li>\n</ul>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> The example of early 17th-century Virginians is used to ______.\n>\n> 十七世纪初弗吉尼亚人的例子用来说明什么？\n\n### 题型\n\n例证作用题：回到例子前后的评价，区分人们具体做了什么与作者借此强调什么。\n\n题干直接点出early 17th-century Virginians，第3段出现同一群人。先完整精读第3段，把例子前面的评价、例子中的做法和段末说明连起来。\n\n### 核心出处\n\n> This was an attempt to recover the valuable nails\n>\n> underlines how scarce, costly and valuable the simple-seeming technology was\n>\n> value the skilled blacksmith’s labour in a nail even more than the raw material.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"22","questionIntro":true},"html":"<blockquote>\n<p>The example of early 17th-century Virginians is used to ______.</p>\n<p>十七世纪初弗吉尼亚人的例子用来说明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：回到例子前后的评价，区分人们具体做了什么与作者借此强调什么。</p>\n<p>题干直接点出early 17th-century Virginians，第3段出现同一群人。先完整精读第3段，把例子前面的评价、例子中的做法和段末说明连起来。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>This was an attempt to recover the valuable nails</p>\n<p>underlines how scarce, costly and valuable the simple-seeming technology was</p>\n<p>value the skilled blacksmith’s labour in a nail even more than the raw material.</p>\n</blockquote>\n"},{"title":"A. highlight the thriftiness of early American colonists","raw":"### A. highlight the thriftiness of early American colonists\n\n> 弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n回收旧钉可以表现节省，但段末underlines明确强调技术稀缺、昂贵且有价值，未把重点放在殖民者节俭品格。\n\n**出处：**\n\n> Later civilisations would value the skilled blacksmith's labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>回收旧钉可以表现节省，但段末underlines明确强调技术稀缺、昂贵且有价值，未把重点放在殖民者节俭品格。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n</blockquote>\n</section>"},{"title":"A. highlight the thriftiness of early American colonists","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。\n\n`thriftiness`把评价落在人身上；第3段的`recover the valuable nails`说明烧房子的目的，段末的`scarce`, `costly and valuable`说明作者从例子中强调什么，需合看第3、4句。\n\n原文先说人们试图取回贵重的钉子，继而明确用`underlines`引出结论：这种技术`scarce`, `costly and valuable`。`A`的`thriftiness`则把例子的用处写成赞扬殖民者的节俭品质。回收钉子确实有保留可用物品这一面，但段末说明的对象是技术的稀缺、成本和价值，并非这些人的生活作风；为了钉子烧掉整栋房子，原文正借付出的代价来凸显钉子的价值。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>回收旧钉可以表现节省，但段末underlines明确强调技术稀缺、昂贵且有价值，未把重点放在殖民者节俭品格。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Later civilisations would value the skilled blacksmith&#39;s labour in a nail even more than the raw material. As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate. This was an attempt to recover the valuable nails, which could be reused after sifting the ashes. The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>弗吉尼亚人的例子用来突出早期美洲殖民者的节俭。</p>\n</blockquote>\n<p><code>thriftiness</code>把评价落在人身上；第3段的<code>recover the valuable nails</code>说明烧房子的目的，段末的<code>scarce</code>, <code>costly and valuable</code>说明作者从例子中强调什么，需合看第3、4句。</p>\n<p>原文先说人们试图取回贵重的钉子，继而明确用<code>underlines</code>引出结论：这种技术<code>scarce</code>, <code>costly and valuable</code>。<code>A</code>的<code>thriftiness</code>则把例子的用处写成赞扬殖民者的节俭品质。回收钉子确实有保留可用物品这一面，但段末说明的对象是技术的稀缺、成本和价值
