const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| Polish | adj.波兰的 | digital artist | n.数字艺术家 | classical painting style | n.古典绘画风格 |\n| create | v.创造 | dreamy | adj.梦幻般的 | fantasy landscape | n.幻想风景 |\n| illustration | n.插画 | game | n.游戏 | such as | phr.例如 |\n| sudden hit | n.突然走红的人或事物 | text-to-image | adj.文字生成图像的 | AI generation | n.人工智能生成 |","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 3重点词与语境","focus":[85,124,925,509],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Polish\u003c/td>\n\u003ctd>adj.波兰的\u003c/td>\n\u003ctd>digital artist\u003c/td>\n\u003ctd>n.数字艺术家\u003c/td>\n\u003ctd>classical painting 03c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 完整原文 · 第2段\n\nHis distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in \"Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,\" and the system will produce something that looks not a million miles away from works in Rutkowski's style.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,644,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-2-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群划分 · 第2段\n\nHis distinctive style / is now one of the most commonly used prompts / in the new open-source AI art generator / Stable Diffusion.\n\nThe tool, / along with other popular image-generation AI models, / allows anyone / to create impressive images / based on text prompts.\n\nFor example, / type in / \"Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,\" / and the system will produce something / that looks not a million miles away / from works in Rutkowski's style.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,644,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-2-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>His distinctive style / is now one of the most commonly used prompts / in the new open-source AI art generator / Stable Diffusion.\u003c/p>\n\u003cp>The tool, / along with other popular image-generation AI models, / allows anyone / to create impressive images / based on text prompts.\u003c/p>\n\u003cp>For example, / type in / &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; / and the system will produce something / that looks not a million miles away / from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群翻译 · 第2段\n\n他独特的风格 / 现在是最常用的提示词之一 / 在新的开源AI艺术生成器中 / Stable Diffusion。\n\n这个工具，/ 与其他流行的图像生成AI模型一起，/ 允许任何人 / 创建令人印象深刻的图像 / 基于文本提示。\n\n例如，/ 输入 / \"持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基\"，/ 系统将生成某些东西 / 看起来相差不远 / 从鲁特科夫斯基风格的作品。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,644,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-2-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>His distinctive style / is now one of the most commonly used prompts / in the new open-source AI art generator / Stable Diffusion.\u003c/p>\n\u003cp>The tool, / along with other popular image-generation AI models, / allows anyone / to create impressive images / based on text prompts.\u003c/p>\n\u003cp>For example, / type in / &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; / and the system will produce something / that looks not a million miles away / from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>他独特的风格 / 现在是最常用的提示词之一 / 在新的开源AI艺术生成器中 / Stable Diffusion。\u003c/p>\n\u003cp>这个工具，/ 与其他流行的图像生成AI模型一起，/ 允许任何人 / 创建令人印象深刻的图像 / 基于文本提示。\u003c/p>\n\u003cp>例如，/ 输入 / &quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot;，/ 系统将生成某些东西 / 看起来相差不远 / 从鲁特科夫斯基风格的作品。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 标准译文 · 第2段\n\n他独特的风格现在是开源AI艺术生成器Stable Diffusion中最常用的提示词之一。这个工具和其他流行的图像生成AI模型一样，允许任何人基于文本提示创建令人印象深刻的图像。例如，输入\"持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基\"，系统就会生成与鲁特科夫斯基风格非常相似的作品。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,644,925,678],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-2-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>His distinctive style / is now one of the most commonly used prompts / in the new open-source AI art generator / Stable Diffusion.\u003c/p>\n\u003cp>The tool, / along with other popular image-generation AI models, / allows anyone / to create impressive images / based on text prompts.\u003c/p>\n\u003cp>For example, / type in / &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; / and the system will produce something / that looks not a million miles away / from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>他独特的风格 / 现在是最常用的提示词之一 / 在新的开源AI艺术生成器中 / Stable Diffusion。\u003c/p>\n\u003cp>这个工具，/ 与其他流行的图像生成AI模型一起，/ 允许任何人 / 创建令人印象深刻的图像 / 基于文本提示。\u003c/p>\n\u003cp>例如，/ 输入 / &quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot;，/ 系统将生成某些东西 / 看起来相差不远 / 从鲁特科夫斯基风格的作品。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-3\">\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>他独特的风格现在是开源AI艺术生成器Stable Diffusion中最常用的提示词之一。这个工具和其他流行的图像生成AI模型一样，允许任何人基于文本提示创建令人印象深刻的图像。例如，输入&quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot;，系统就会生成与鲁特科夫斯基风格非常相似的作品。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 完整原文 · 第3段\n\nBut these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1364,925,570],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-3-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群划分 · 第3段\n\nBut these open-source programs / are built by scraping images / from the Internet, / often without permission / and proper attribution to artists.\n\nAs a result, / they are raising tricky questions / about ethics and copyright.\n\nAnd artists like Rutkowski / have had enough.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1364,925,570],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-3-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>But these open-source programs / are built by scraping images / from the Internet, / often without permission / and proper attribution to artists.\u003c/p>\n\u003cp>As a result, / they are raising tricky questions / about ethics and copyright.\u003c/p>\n\u003cp>And artists like Rutkowski / have had enough.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群翻译 · 第3段\n\n但这些开源程序 / 是通过抓取图像建立的 / 从互联网上，/ 经常没有许可 / 和对艺术家的适当署名。\n\n因此，/ 它们正在引发棘手的问题 / 关于伦理和版权。\n\n而像鲁特科夫斯基这样的艺术家 / 已经受够了。","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1364,925,570],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-3-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>But these open-source programs / are built by scraping images / from the Internet, / often without permission / and proper attribution to artists.\u003c/p>\n\u003cp>As a result, / they are raising tricky questions / about ethics and copyright.\u003c/p>\n\u003cp>And artists like Rutkowski / have had enough.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-2\">\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>但这些开源程序 / 是通过抓取图像建立的 / 从互联网上，/ 经常没有许可 / 和对艺术家的适当署名。\u003c/p>\n\u003cp>因此，/ 它们正在引发棘手的问题 / 关于伦理和版权。\u003c/p>\n\u003cp>而像鲁特科夫斯基这样的艺术家 / 已经受够了。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 标准译文 · 第3段\n\n但这些开源程序是通过从互联网抓取图像建立的，经常未经许可且没有对艺术家进行适当署名。因此，它们引发了关于伦理和版权的棘手问题。像鲁特科夫斯基这样的艺术家已经受够了。","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1364,925,570],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-3-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>But these open-source programs / are built by scraping images / from the Internet, / often without permission / and proper attribution to artists.\u003c/p>\n\u003cp>As a result, / they are raising tricky questions / about ethics and copyright.\u003c/p>\n\u003cp>And artists like Rutkowski / have had enough.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-2\">\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>但这些开源程序 / 是通过抓取图像建立的 / 从互联网上，/ 经常没有许可 / 和对艺术家的适当署名。\u003c/p>\n\u003cp>因此，/ 它们正在引发棘手的问题 / 关于伦理和版权。\u003c/p>\n\u003cp>而像鲁特科夫斯基这样的艺术家 / 已经受够了。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-3\">\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>但这些开源程序是通过从互联网抓取图像建立的，经常未经许可且没有对艺术家进行适当署名。因此，它们引发了关于伦理和版权的棘手问题。像鲁特科夫斯基这样的艺术家已经受够了。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 完整原文 · 第4段\n\nAccording to the website Lexica, which tracks over 10 million Stable Diffusion images and prompts, Rutkowski's name has been used as a prompt around 93,000 times. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn't his.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1948,925,607],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-4-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, which tracks over 10 million Stable Diffusion images and prompts, Rutkowski&#39;s name has been used as a prompt around 93,000 times. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn&#39;t his.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nAccording to the website Lexica, / which tracks over 10 million Stable Diffusion images and prompts, / Rutkowski's name / has been used as a prompt / around 93,000 times.\n\nRutkowski was initially surprised / but thought it might be / a good way to reach new audiences.\n\nThen he tried searching for his name / to see if a piece he had worked on / had been published.\n\nThe online search brought back work / that had his name attached to it / but wasn't his.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1948,925,607],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-4-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, which tracks over 10 million Stable Diffusion images and prompts, Rutkowski&#39;s name has been used as a prompt around 93,000 times. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn&#39;t his.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, / which tracks over 10 million Stable Diffusion images and prompts, / Rutkowski&#39;s name / has been used as a prompt / around 93,000 times.\u003c/p>\n\u003cp>Rutkowski was initially surprised / but thought it might be / a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name / to see if a piece he had worked on / had been published.\u003c/p>\n\u003cp>The online search brought back work / that had his name attached to it / but wasn&#39;t his.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群翻译 · 第4段\n\n根据网站Lexica，/ 追踪超过1000万Stable Diffusion图像和提示词的，/ 鲁特科夫斯基的名字 / 已被用作提示词 / 大约93,000次。\n\n鲁特科夫斯基最初很惊讶 / 但认为这可能是 / 接触新受众的好方法。\n\n然后他尝试搜索他的名字 / 看看他创作的作品 / 是否已经发布。\n\n在线搜索返回了作品 / 附有他的名字 / 但不是他的。","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1948,925,607],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-4-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, which tracks over 10 million Stable Diffusion images and prompts, Rutkowski&#39;s name has been used as a prompt around 93,000 times. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn&#39;t his.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, / which tracks over 10 million Stable Diffusion images and prompts, / Rutkowski&#39;s name / has been used as a prompt / around 93,000 times.\u003c/p>\n\u003cp>Rutkowski was initially surprised / but thought it might be / a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name / to see if a piece he had worked on / had been published.\u003c/p>\n\u003cp>The online search brought back work / that had his name attached to it / but wasn&#39;t his.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>根据网站Lexica，/ 追踪超过1000万Stable Diffusion图像和提示词的，/ 鲁特科夫斯基的名字 / 已被用作提示词 / 大约93,000次。\u003c/p>\n\u003cp>鲁特科夫斯基最初很惊讶 / 但认为这可能是 / 接触新受众的好方法。\u003c/p>\n\u003cp>然后他尝试搜索他的名字 / 看看他创作的作品 / 是否已经发布。\u003c/p>\n\u003cp>在线搜索返回了作品 / 附有他的名字 / 但不是他的。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 标准译文 · 第4段\n\n根据追踪超过1000万Stable Diffusion图像和提示词的网站Lexica，鲁特科夫斯基的名字已被用作提示词约93,000次。鲁特科夫斯基最初很惊讶，但认为这可能是接触新受众的好方法。然后他尝试搜索自己的名字，看看他创作的作品是否已经发布。在线搜索返回了带有他名字的作品，但这些作品并非出自他手。","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1948,925,607],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-4-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, which tracks over 10 million Stable Diffusion images and prompts, Rutkowski&#39;s name has been used as a prompt around 93,000 times. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn&#39;t his.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, / which tracks over 10 million Stable Diffusion images and prompts, / Rutkowski&#39;s name / has been used as a prompt / around 93,000 times.\u003c/p>\n\u003cp>Rutkowski was initially surprised / but thought it might be / a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name / to see if a piece he had worked on / had been published.\u003c/p>\n\u003cp>The online search brought back work / that had his name attached to it / but wasn&#39;t his.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>根据网站Lexica，/ 追踪超过1000万Stable Diffusion图像和提示词的，/ 鲁特科夫斯基的名字 / 已被用作提示词 / 大约93,000次。\u003c/p>\n\u003cp>鲁特科夫斯基最初很惊讶 / 但认为这可能是 / 接触新受众的好方法。\u003c/p>\n\u003cp>然后他尝试搜索他的名字 / 看看他创作的作品 / 是否已经发布。\u003c/p>\n\u003cp>在线搜索返回了作品 / 附有他的名字 / 但不是他的。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-3\">\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>根据追踪超过1000万Stable Diffusion图像和提示词的网站Lexica，鲁特科夫斯基的名字已被用作提示词约93,000次。鲁特科夫斯基最初很惊讶，但认为这可能是接触新受众的好方法。然后他尝试搜索自己的名字，看看他创作的作品是否已经发布。在线搜索返回了带有他名字的作品，但这些作品并非出自他手。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 完整原文 · 第5段\n\n\"It's been just a month. What about in a year? I probably won't be able to find my work out there because the Internet will be flooded with AI art,\" Rutkowski said. \"That's concerning.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2565,925,319],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-5-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>&quot;It&#39;s been just a month. What about in a year? I probably won&#39;t be able to find my work out there because the Internet will be flooded with AI art,&quot; Rutkowski said. &quot;That&#39;s concerning.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 意群划分 · 第5段\n\n\"It's been just a month. / What about in a year? / I probably won't be able to find my work out there / because the Internet will be flooded with AI art,\" / Rutkowski said.\n\n\"That's concerning.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2565,925,319],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus  奥尔蒂斯说。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第8段","level":3,"raw":"### 标准译文 · 第8段\n\n\"艺术家行业内正在形成一个联盟，来弄清楚如何解决或缓解这个问题，\"奥尔蒂斯说。该团体处于动员的早期阶段，可能会推动新政策或法规的制定。奥尔蒂斯说，一个建议是AI模型可以使用公共领域的图像进行训练，AI公司可以与博物馆和艺术家建立合作关系。","context":{"mode":"image","asset":"articleAnnotated","label":"第8段精读与翻译","focus":[85,4100,925,663],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-8","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-8-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-8-0\">\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-1\">\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>&quot;There is a coalition growing / within artist industries / to figure out how to tackle or mitigate this,&quot; / says Ortiz.\u003c/p>\n\u003cp>The group is in its early days of mobilization, / which could involve / pushing for new policies or regulation.\u003c/p>\n\u003cp>One suggestion is that / AI models could be trained / on images in the public domain, / and AI companies could forge partnerships / with museums and artists, / Ortiz says.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-2\">\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>&quot;有一个联盟正在形成 / 在艺术家行业内 / 来弄清楚如何解决或缓解这个问题，&quot; / 奥尔蒂斯说。\u003c/p>\n\u003cp>该团体处于动员的早期阶段，/ 这可能涉及 / 推动新政策或法规。\u003c/p>\n\u003cp>一个建议是 / AI模型可以被训练 / 使用公共领域的图像，/ 并且AI公司可以建立合作关系 / 与博物馆和艺术家，/ 奥尔蒂斯说。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-3\">\u003ch3>标准译文 · 第8段\u003c/h3>\n\u003cp>&quot;艺术家行业内正在形成一个联盟，来弄清楚如何解决或缓解这个问题，&quot;奥尔蒂斯说。该团体处于动员的早期阶段，可能会推动新政策或法规的制定。奥尔蒂斯说，一个建议是AI模型可以使用公共领域的图像进行训练，AI公司可以与博物馆和艺术家建立合作关系。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"文章的句内逻辑（大家自行根据需求阅读)","level":2,"raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\n\n符号的作用：\n\n- `→`：主要叙述继续向下推进；\n- `+`：并列；\n- `：`：解释、修饰或补充；\n- `//`：转折或对比；\n- 括号：把同一层的信息捆成一个整体。","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nA Polish digital artist：(who uses classical painting styles：(to create dreamy fantasy landscapes)) → Greg Rutkowski has made illustrations：(for games：(such as Dungeons & Dragons and Magic: The Gathering)).\n\nAnd he's become a sudden hit：(in the new world：(of text-to-image AI generation)).\n\n### 第2段\n\nHis distinctive style → is now one of the most commonly used prompts：(in the new open-source AI art generator：(Stable Diffusion)).\n\nThe tool：(along with other popular image-generation AI models) → allows anyone → to create impressive images：(based on text prompts).\n\nFor example → type in：\"Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski\" → and the system will produce something：(that looks not a million miles away：(from works in Rutkowski's style)).\n\n### 第3段\n\nBut these open-source programs → are built by scraping images：(from the Internet)：(often without permission + proper attribution to artists).\n\nAs a result → they are raising tricky questions：(about ethics and copyright).\n\nAnd artists like Rutkowski → have had enough.\n\n### 第4段\n\nAccording to the website Lexica：(which tracks over 10 million Stable Diffusion images and prompts) → Rutkowski's name → has been used as a prompt：(around 93,000 times).\n\nRutkowski was initially surprised // but thought it might be：(a good way to reach new audiences).\n\nThen he tried searching for his name：(to see if a piece he had worked on → had been published).\n\nThe online search brought back work：(that had his name attached to it // but wasn't his).\n\n### 第5段\n\n\"It's been just a month. → What about in a year? → I probably won't be able to find my work out there：(because the Internet will be flooded with AI art)\" → Rutkowski said.\n\n\"That's concerning.\"\n\n### 第6段\n\nOther artists besides Rutkowski → have been surprised：(by the apparent popularity of their work：(in text-to-image generators)) — and some are now fighting back.\n\nKarla Ortiz：(an illustrator based in San Francisco：(who found her work：(in Stable Diffusion's data set))) → has been raising awareness：(about the issues around AI art and copyright).\n\n### 第7段\n\nArtists say → they risk losing income：(as people start using AI-generated images：(based on copyrighted material)：(for commercial purposes)).\n\nBut it's also a lot more personal → Ortiz says → arguing：(that because art is so closely linked to a person → it could raise data protection and privacy problems).\n\n### 第8段\n\n\"There is a coalition growing：(within artist industries)：(to figure out how to tackle or mitigate this)\" → says Ortiz.\n\nThe group is in its early days of mobilization：(which could involve：(pushing for new policies or regulation)).\n\nOne suggestion is：(that AI models could be trained：(on images in the public domain)) + (AI companies could forge partnerships：(with museums and artists)) → Ortiz says.","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>A Polish digital artist：(who uses classical painting styles：(to create dreamy fantasy landscapes)) → Greg Rutkowski has made illustrations：(for games：(such as Dungeons &amp; Dragons and Magic: The Gathering)).\u003c/p>\n\u003cp>And he&#39;s become a sudden hit：(in the new world：(of text-to-image AI generation)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>His distinctive style → is now one of the most commonly used prompts：(in the new open-source AI art generator：(Stable Diffusion)).\u003c/p>\n\u003cp>The tool：(along with other popular image-generation AI models) → allows anyone → to create impressive images：(based on text prompts).\u003c/p>\n\u003cp>For example → type in：&quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski&quot; → and the system will produce something：(that looks not a million miles away：(from works in Rutkowski&#39;s style)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>But these open-source programs → are built by scraping images：(from the Internet)：(often without permission + proper attribution to artists).\u003c/p>\n\u003cp>As a result → they are raising tricky questions：(about ethics and copyright).\u003c/p>\n\u003cp>And artists like Rutkowski → have had enough.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>According to the website Lexica：(which tracks over 10 million Stable Diffusion images and prompts) → Rutkowski&#39;s name → has been used as a prompt：(around 93,000 times).\u003c/p>\n\u003cp>Rutkowski was initially surprised // but thought it might be：(a good way to reach new audiences).\u003c/p>\n\u003cp>Then he tried searching for his name：(to see if a piece he had worked on → had been published).\u003c/p>\n\u003cp>The online search brought back work：(that had his name attached to it // but wasn&#39;t his).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>&quot;It&#39;s been just a month. → What about in a year? → I probably won&#39;t be able to find my work out there：(because the Internet will be flooded with AI art)&quot; → Rutkowski said.\u003c/p>\n\u003cp>&quot;That&#39;s concerning.&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Other artists besides Rutkowski → have been surprised：(by the apparent popularity of their work：(in text-to-image generators)) — and some are now fighting back.\u003c/p>\n\u003cp>Karla Ortiz：(an illustrator based in San Francisco：(who found her work：(in Stable Diffusion&#39;s data set))) → has been raising awareness：(about the issues around AI art and copyright).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Artists say → they risk losing income：(as people start using AI-generated images：(based on copyrighted material)：(for commercial purposes)).\u003c/p>\n\u003cp>But it&#39;s also a lot more personal → Ortiz says → arguing：(that because art is so closely linked to a person → it could raise data protection and privacy problems).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>&quot;There is a coalition growing：(within artist industries)：(to figure out how to tackle or mitigate this)&quot; → says Ortiz.\u003c/p>\n\u003cp>The group is in its early days of mobilization：(which could involve：(pushing for new policies or regulation)).\u003c/p>\n\u003cp>One suggestion is：(that AI models could be trained：(on images in the public domain)) + (AI companies could forge partnerships：(with museums and artists)) → Ortiz says.\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n一位波兰数字艺术家：(使用古典绘画风格：(创作梦幻奇幻风景画)) → 格雷格·鲁特科夫斯基已经创作了插画：(为游戏：(比如《龙与地下城》和《万智牌》))。\n\n并且他已成为突然的热门：(在新世界中：(文本到图像AI生成的))。\n\n### 第2段\n\n他独特的风格 → 现在是最常用的提示词之一：(在新的开源AI艺术生成器中：(Stable Diffusion))。\n\n这个工具：(与其他流行的图像生成AI模型一起) → 允许任何人 → 创建令人印象深刻的图像：(基于文本提示)。\n\n例如 → 输入：\"持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基\" → 系统将生成某些东西：(看起来相差不远：(从鲁特科夫斯基风格的作品))。\n\n### 第3段\n\n但这些开源程序 → 是通过抓取图像建立的：(从互联网上)：(经常没有许可 + 对艺术家的适当署名)。\n\n因此 → 它们正在引发棘手的问题：(关于伦理和版权)。\n\n而像鲁特科夫斯基这样的艺术家 → 已经受够了。\n\n### 第4段\n\n根据网站Lexica：(追踪超过1000万Stable Diffusion图像和提示词的) → 鲁特科夫斯基的名字 → 已被用作提示词：(大约93,000次)。\n\n鲁特科夫斯基最初很惊讶 // 但认为这可能是：(接触新受众的好方法)。\n\n然后他尝试搜索他的名字：(看看他创作的作品 → 是否已经发布)。\n\n在线搜索返回了作品：(附有他的名字 // 但不是他的)。\n\n### 第5段\n\n\"才过了一个月。→ 一年后会怎样？→ 我可能无法在那里找到我的作品：(因为互联网将充斥着AI艺术)\" → 鲁特科夫斯基说。\n\n\"这令人担忧。\"\n\n### 第6段\n\n除了鲁特科夫斯基之外的其他艺术家 → 已经感到惊讶：(对他们作品的明显受欢迎程度：(在文本到图像生成器中)) — 而一些人现在正在反击。\n\n卡拉·奥尔蒂斯：(一位旧金山的插画家：(发现了她的作品：(在Stable Diffusion的数据集中))) → 一直在提高认识：(关于AI艺术和版权问题)。\n\n### 第7段\n\n艺术家们说 → 他们面临失去收入的风险：(当人们开始使用AI生成的图像：(基于受版权保护的材料)：(用于商业目的))。\n\n但这也更加个人化 → 奥尔蒂斯说 → 认为：(因为艺术与个人如此紧密相连 → 它可能引发数据保护和隐私问题)。\n\n### 第8段\n\n\"有一个联盟正在形成：(在艺术家行业内)：(来弄清楚如何解决或缓解这个问题)\" → 奥尔蒂斯说。\n\n该团体处于动员的早期阶段：(这可能涉及：(推动新政策或法规))。\n\n一个建议是：(AI模型可以被训练：(使用公共领域的图像)) + (AI公司可以建立合作关系：(与博物馆和艺术家)) → 奥尔蒂斯说。","context":{"mode":"image","asset":"articleAnnotated","label":"2024英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>一位波兰数字艺术家：(使用古典绘画风格：(创作梦幻奇幻风景画)) → 格雷格·鲁特科夫斯基已经创作了插画：(为游戏：(比如《龙与地下城》和《万智牌》))。\u003c/p>\n\u003cp>并且他已成为突然的热门：(在新世界中：(文本到图像AI生成的))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>他独特的风格 → 现在是最常用的提示词之一：(在新的开源AI艺术生成器中：(Stable Diffusion))。\u003c/p>\n\u003cp>这个工具：(与其他流行的图像生成AI模型一起) → 允许任何人 → 创建令人印象深刻的图像：(基于文本提示)。\u003c/p>\n\u003cp>例如 → 输入：&quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot; → 系统将生成某些东西：(看起来相差不远：(从鲁特科夫斯基风格的作品))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>但这些开源程序 → 是通过抓取图像建立的：(从互联网上)：(经常没有许可 + 对艺术家的适当署名)。\u003c/p>\n\u003cp>因此 → 它们正在引发棘手的问题：(关于伦理和版权)。\u003c/p>\n\u003cp>而像鲁特科夫斯基这样的艺术家 → 已经受够了。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>根据网站Lexica：(追踪超过1000万Stable Diffusion图像和提示词的) → 鲁特科夫斯基的名字 → 已被用作提示词：(大约93,000次)。\u003c/p>\n\u003cp>鲁特科夫斯基最初很惊讶 // 但认为这可能是：(接触新受众的好方法)。\u003c/p>\n\u003cp>然后他尝试搜索他的名字：(看看他创作的作品 → 是否 面；Ortiz says是引述来源。arguing引出她的解释，that之内包含because原因从句和it could主句，不要把because后的内容单独悬空。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>不过奥尔蒂斯表示，这还涉及更深的个人层面；她认为，艺术与个人联系如此紧密，因此也可能引发数据保护和隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>a lot more personal比“很私人”具体，是说作品与身份、个人联系密切；这里不是指作品只供私人欣赏。\u003c/p>\n\u003cp>could raise保留提出潜在问题的谨慎程度，不译成已被裁定违反隐私法；同样不把这项局部担忧扩大为全文唯一主题。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>但奥尔蒂斯说，这也涉及更多个人层面的问题，她认为由于艺术与个人如此紧密相连，可能会引发数据保护和隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"35题 · 题干、题型与核心出处","level":2,"raw":"## 35题\n\n**What is the text mainly about?**\n\n本文主要讲什么？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Artists’ responses to AI art generation.**\n\n艺术家对人工智能艺术生成的反应。\n\nB. **AI’s expanded role in artistic creation.**\n\n人工智能在艺术创作中扩大的作用。\n\nC. **Privacy issues in the application of AI.**\n\n人工智能应用中的隐私问题。\n\nD. **Opposing views on AI development.**\n\n对于人工智能发展的相反观点。\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍Rutkowski及其突然在AI图像生成领域走红。 | 先写人物碰到的新现象 |\n| 第2段 | 说明用户输入文字和艺术家名字即可生成相近风格图像。 | 再说现象怎样发生 |\n| 第3段 | 转向未经许可抓图带来的版权问题及艺术家的不满。 | 接着写由此引发的不满 |\n| 第4段 | 通过使用量和搜索遭遇写他从期待到发现署名错配。 | 接着展开个人经历 |\n| 第5段 | 引述他担心未来无法在网上找到自己的作品。 | 然后写当事人具体的担忧 |\n| 第6段 | 说明其他艺术家也惊讶并开始反击。 | 再把个人遭遇扩展到更多人 |\n| 第7段 | 以Ortiz说明收入、版权和个人隐私方面的顾虑。 | 再说更多人的具体顾虑 |\n| 第8段 | 写艺术行业组织行动并提出训练材料和合作建议。 | 最后说可以怎样应对 |","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"35","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>本文主要讲什么？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Artists’ responses to AI art generation.\u003c/strong>\u003c/p>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003cp>B. \u003cstrong>AI’s expanded role in artistic creation.\u003c/strong>\u003c/p>\n\u003cp>人工智能在艺术创作中扩大的作用。\u003c/p>\n\u003cp>C. \u003cstrong>Privacy issues in the application of AI.\u003c/strong>\u003c/p>\n\u003cp>人工智能应用中的隐私问题。\u003c/p>\n\u003cp>D. \u003cstrong>Opposing views on AI development.\u003c/strong>\u003c/p>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>介绍Rutkowski及其突然在AI图像生成领域走红。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明用户输入文字和艺术家名字即可生成相近风格图像。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转向未经许可抓图带来的版权问题及艺术家的不满。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>通过使用量和搜索遭遇写他从期待到发现署名错配。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>引述他担心未来无法在网上找到自己的作品。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明其他艺术家也惊讶并开始反击。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以Ortiz说明收入、版权和个人隐私方面的顾虑。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>写艺术行业组织行动并提出训练材料和合作建议。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Artists’ responses to AI art generation.","level":3,"raw":"**What is the text mainly about?**\n\n### A. Artists’ responses to AI art generation.\n\n艺术家对人工智能艺术生成的反应。","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Artists’ responses to AI art generation.","level":3,"raw":"#### 如果 A 是主旨，文章8段应该怎么写？\n\n如果全文主旨真的是：\n\n艺术家对人工智能艺术生成的反应。\n\n那文章8段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以鲁特科夫斯基突然成为AI热门风格来源，介绍艺术家遭遇的新局面。 | 先写人物碰到的新现象 |\n| 第2段 | 说明名字和风格怎样被提示词调用，让后续反应有明确的技术对象。 | 再说现象怎样发生 |\n| 第3段 | 转入未经许可取图所带来的争议，交代艺术家不满的原因。 | 接着写由此引发的不满 |\n| 第4段 | 展开个人从期待曝光到搜索发现非本人作品挂名的经历，写态度转变。 | 接着展开个人经历 |\n| 第5段 | 引述他担心原创作品被大量生成图像淹没，具体化个人焦虑。 | 然后写当事人具体的担忧 |\n| 第6段 | 说明相似经历还发生在其他艺术家身上，并出现反击行动。 | 再把个人遭遇扩展到更多人 |\n| 第7段 | 用另一位艺术家解释收入、版权和个人身份方面的多重关切。 | 再说更多人的具体顾虑 |\n| 第8段 | 呈现组织倡议及对训练材料、合作方式的建议，说明艺术家如何应对。 | 最后说可以怎样应对 |\n\nA中的 Artists’ responses 既能装下惊讶、短暂期待和担心，也能装下反击与提出建议。文章不是只写一句反对意见：第1、2段先交代人和技术接触，第3段把许可问题带出，第4、5段写具体艺术家的遭遇，第6段把视线扩大，第7、8段继续写顾虑和行动。AI art generation 是这些反应共同针对的事情；A把叙述主体与对象都保留下来。\n\n判断：\n\n**A 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-A-1\">\u003ch4>如果 A 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以鲁特科夫斯基突然成为AI热门风格来源，介绍艺术家遭遇的新局面。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明名字和风格怎样被提示词调用，让后续反应有明确的技术对象。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c 数字艺术家的风格成为热门生成对象写起，提出AI在创作中新的应用。 | 先写人物碰到的新现象 |\n| 第2段 | 解释文字提示怎样转为图像，展示AI承担具体创作任务的机制。 | 再说现象怎样发生 |\n| 第3段 | 说明AI角色扩展触发素材使用争议，成为技术进入艺术领域的阻力。 | 接着写由此引发的不满 |\n| 第4段 | 以该艺术家经历展示AI从参考灵感进一步介入作品生成与传播。 | 接着展开个人经历 |\n| 第5段 | 写当事人担心机器产出挤占人工作品空间，凸显角色扩大的程度。 | 然后写当事人具体的担忧 |\n| 第6段 | 将案例扩大到游戏、出版等其他艺术实践，展示AI承担的新任务。 | 再把个人遭遇扩展到更多人 |\n| 第7段 | 讨论更广泛创作角色对职业分工、收入和身份的影响。 | 再说更多人的具体顾虑 |\n| 第8段 | 提出训练与合作安排，使扩大的AI创作角色在明确条件下运行。 | 最后说可以怎样应对 |\n\nB的 expanded role 看中了文字生成图像的能力，也能勉强装进提示语使用频繁这个事实。但实际第3段以后追问的是作品未经许可使用时艺术家受到什么影响、作出什么反应。第8段用公共领域图像和合作限制材料取得方式，是回应版权等问题，而非为扩展AI在创作中的作用设计路线。B将作为事件起因的技术能力抬成中心，后面个人担忧和集体反击就成了难以解释的大量旁枝。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>人工智能在艺术创作中扩大的作用。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-B-1\">\u003ch4>如果 B 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能在艺术创作中扩大的作用。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一位数字艺术家的风格成为热门生成对象写起，提出AI在创作中新的应用。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释文字提示怎样转为图像，展示AI承担具体创作任务的机制。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明AI角色扩展触发素材使用争议，成为技术进入艺术领域的阻力。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>以该艺术家经历展示AI从参考灵感进一步介入作品生成与传播。\u003c/td>\n\u003ctd>接着展开个 着展开个人经历 |\n| 第5段 | 引述当事人对未来失去身份呈现控制权的担忧。 | 然后写当事人具体的担忧 |\n| 第6段 | 说明其他创作者也遭遇相似个人信息问题，开始共同采取行动。 | 再把个人遭遇扩展到更多人 |\n| 第7段 | 集中分析作品与个人联系使隐私、数据保护和控制权怎样发生冲突。 | 再说更多人的具体顾虑 |\n| 第8段 | 提出数据来源、授权以及纠正机制等建议，回应AI应用中的隐私问题。 | 最后说可以怎样应对 |\n\nC的 Privacy issues 确实出现在第7段末尾，Ortiz说艺术与个人紧密相连，可能引发数据保护和隐私问题。但开头谈的是画风被用于提示语，随后是未经许可抓图、署名错配、作品检索困难与收入风险，这些内容不能全部收缩为隐私。第8段建议选择公共领域图像和与艺术家合作，也面向许可和版权问题。C拿艺术家众多顾虑中的一项覆盖了整篇。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>人工智能应用中的隐私问题。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-C-1\">\u003ch4>如果 C 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能应用中的隐私问题。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从艺术家姓名被AI工具频繁调用切入，提出个人身份如何进入技术系统的问题。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明提示词、图像和姓名信息怎样在系统中被收集、关联和输出。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出未经许可收集个人相关材料引起不满，引出隐私处理争议。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>通过搜索姓名返回非本人作品的经历，展示个人身份被错配的具体过程。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>引述当事人对未来失去身份呈现控制权的担忧。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明其他创作者也遭遇相似个人信息问题，开始共同采取行动。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>集中分析作品与个人联系使隐私、数据保护和控制权怎样发生冲突。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>提出数据来源、授权以及纠正机制等建议，回应AI应用中的隐私问题。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的 Privacy issues 确实出现在第7段末尾，Ortiz说艺术与个人紧密相连，可能引发数据保护和隐私问题。但开头谈的是画风被用于提示语，随后是未经许可抓图、署名错配、作品检索困难与收入风险，这些内容不能全部收缩为隐私。第8段建议选择公共领域图像和与艺术家合作，也面向许可和版权问题。C拿艺术家众多顾虑中的一项覆盖了整篇。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Opposing views on AI development.","level":3,"raw":"**What is the text mainly about?**\n\n### D. Opposing views on AI development.\n\n对于人工智能发展的相反观点。","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Opposing views on AI development.","level":3,"raw":"#### 如果 D 是主旨，文章8段应该怎么写？\n\n如果全文主旨真的是：\n\n对于人工智能发展的相反观点。\n\n那文章8段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从一位艺术家的风格被AI利用引出新现象，呈现支持和反对AI发展的起点。 | 先写人物碰到的新现象 |\n| 第2段 | 先说明工具怎样运作，为两方针对同一技术展开争论建立背景。 | 再说现象怎样发生 |\n| 第3段 | 交代反对方对未经许可训练材料的批评以及支持方对此的回应。 | 接着写由此引发的不满 |\n| 第4段 | 通过一位艺术家从期待到担忧的经历，展开双方观点在个人层面的碰撞。 | 接着展开个人经历 |\n| 第5段 | 具体呈现反对者对机器淹没原创作品的担心及支持者的不同预期。 | 然后写当事人具体的担忧 |\n| 第6段 | 把个体意见扩展为创作行业内外的不同阵营，展示立场分布。 | 再把个人遭遇扩展到更多人 |\n| 第7段 | 逐项比较双方对收入、版权、个人身份的判断及各自依据。 | 再说更多人的具体顾虑 |\n| 第8段 | 讨论分歧下可能达成的训练与合作安排，说明两方如何寻求妥协。 | 最后说可以怎样应对 |\n\nD的 Opposing views 要求全文持续呈现对立的观点或双方论证。Rutkowski起初觉得可能接触新观众，确实与后来的担忧不同，但这是同一人的经历变化。文章没有随后请支持AI发展的阵营回应艺术家，也没有比较两方论据；后半段始终沿着艺术家的不满、风险和应对推进。把一个人初期的想法当成整派支持立场，会把经历叙述改造成双方辩论。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-D-1\">\u003ch4>如果 D 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一位艺术家的风格被AI利用引出新现象，呈现支持和反对AI发展的起点。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>先说明工具怎样运作，为两方针对同一技术展开争论建立背景。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>交代反对方对未经许可训练材料的批评以及支持方对此的回应。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>通过一位艺术家从期待到担忧的经历，展开双方观点在个人层面的碰撞。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>具体呈现反对者对机器淹没原创作品的担心及支持者的不同预期。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>把个体意见扩展为创作行业内外的不同阵营，展示立场分布。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>逐项比较双方对收入、版权、个人身份的判断及各自依据。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>讨论分歧下可能达成的训练与合作安排，说明两方如何寻求妥协。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的 Opposing views 要求全文持续呈现对立的观点或双方论证。Rutkowski起初觉得可能接触新观众，确实与后来的担忧不同，但这是同一人的经历变化。文章没有随后请支持AI发展的阵营回应艺术家，也没有比较两方论据；后半段始终沿着艺术家的不满、风险和应对推进。把一个人初期的想法当成整派支持立场，会把经历叙述改造成双方辩论。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"35题结论","level":2,"raw":"### 35题结论\n\n**35. A. Artists’ responses to AI art generation.**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Artists’ responses to AI art generation. / 艺术家对人工智能艺术生成的反应。**","context":{"mode":"image","asset":"questions","focus":[250,2356,1800,452],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"35","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>35. A. Artists’ responses to AI art generation.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Artists’ responses to AI art generation. / 艺术家对人工智能艺术生成的反应。\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"31题 · 题干、题型与核心出处","level":2,"raw":"## 31题\n\n> What can be learned about Rutkowski from the first two paragraphs?  \n> 从前两段可以了解到关于Rutkowski的什么？\n\n### 题型\n\n人物信息题。题干要求判断“从前两段可以了解到关于Rutkowski的什么？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons & Dragons and Magic: The Gathering. And he's become a sudden hit in the new world of text-to-image AI generation.\n>\n> His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in \"Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,\" and the system will produce something that looks not a million miles away from works in Rutkowski's style.\n\n他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,451],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"31","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What can be learned about Rutkowski from the first two paragraphs?\u003cbr>从前两段可以了解到关于Rutkowski的什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物信息题。题干要求判断“从前两段可以了解到关于Rutkowski的什么？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering. And he&#39;s become a sudden hit in the new world of text-to-image AI generation.\u003c/p>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/blockquote>\n\u003cp>他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. He is enthusiastic about using AI models.","level":3,"raw":"### A. He is enthusiastic about using AI models.\n\n> 他热衷于使用AI模型。\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 He is enthusiastic 把使用者写成Rutkowski本人；第2段的 allows anyone 讲模型允许人们做什么，两处都涉及使用模型，所以回看允许使
