种画风创作新的幻想风景，与转换已有画作不是同一个创作对象，digital artist 也只是他的身份，并不等于“负责古画数字化”。\u003c/p>\n\u003cp>前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. He specializes in classical painting digitalization.","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从前两段可以得知，鲁特科夫斯基他专门从事古典绘画的数字化。\n\nD的 classical painting digitalization 与第1段的 uses classical painting styles 都提到古典绘画，但前者是处理画作，后者是使用画风，因此回到第1段第一句看他实际创造什么。\n\n原文的 uses classical painting styles 后面紧跟 to create，创造的是 fantasy landscapes，继而说他为游戏制作东西。D的 classical painting digitalization 把工作改成将古典画作转换成数字形式。使用一种画风创作新的幻想风景，与转换已有画作不是同一个创作对象，digital artist 也只是他的身份，并不等于“负责古画数字化”。\n\n前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。","context":{"mode":"image","asset":"questions","focus":[250,605,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"31","option":"D"},"focusId":"focus-q31-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-D-0\">\u003cblockquote>\n\u003cp>他专门从事古典绘画的数字化。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 classical painting digitalization 与第1段的 uses classical painting styles 都提到古典绘画，但前者是处理画作，后者是使用画风，因此回到第1段第一句看他实际创造什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 uses classical painting styles 后面紧跟 to create，创造的是 fantasy landscapes，继而说他为游戏制作东西。D的 classical painting digitalization 把工作改成将古典画作转换成数字形式。使用一种画风创作新的幻想风景，与转换已有画作不是同一个创作对象，digital artist 也只是他的身份，并不等于“负责古画数字化”。\u003c/p>\n\u003cp>前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。\u003c \u003c/blockquote>\n\u003cp>uses classical painting styles to create写借风格创作新奇景，digitalization写复制或转换既有画作。保留classical与digital两个词不能掩盖创作动作被替换。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章讨论艺术家对AI生成的反应，不能单独判断谁使用工具、谁欣赏这位艺术家；前两段对提示词使用者的介绍决定人物关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>He specializes in classical painting digitalization.\u003cbr>他专门从事古典绘画的数字化。\u003c/p>\n\u003c/blockquote>\n\u003cp>前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。\u003c/p>\n\u003cp>本项最终仍要根据“most commonly used prompts”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"31题结论","level":2,"raw":"### 31题结论\n\n> **31. B. He is popular with users of an AI art generator.**\n\nA：名字被用户调用不等于艺术家本人热衷使用AI。\n\nB：风格作为常用提示词，说明其受到生成器用户的欢迎。\n\nC：原文的用户不能被替换成赞赏他的其他职业插画家。\n\nD：借古典风格创作新作品不等于将现成古典画作数字化。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,451],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"31","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>31. B. He is popular with users of an AI art generator.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：名字被用户调用不等于艺术家本人热衷使用AI。\u003c/p>\n\u003cp>B：风格作为常用提示词，说明其受到生成器用户的欢迎。\u003c/p>\n\u003cp>C：原文的用户不能被替换成赞赏他的其他职业插画家。\u003c/p>\n\u003cp>D：借古典风格创作新作品不等于将现成古典画作数字化。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"32题 · 题干、题型与核心出处","level":2,"raw":"## 32题\n\n> The problem with open-source AI art generators is that they ______.  \n> 开源人工智能艺术生成器的问题在于它们怎样？\n\n### 题型\n\n问题细节题。题干要求判断“开源人工智能艺术生成器的问题在于它们怎样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\n\n工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。","context":{"mode":"image","asset":"questions","focus":[250,771,1800,441],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"32","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The problem with open-source AI art generators is that they ______.\u003cbr>开源人工智能艺术生成器的问题在于它们怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>问题细节题。题干要求判断“开源人工智能艺术生成器的问题在于它们怎样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/blockquote>\n\u003cp>工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. lack flexibility in responding to prompts","level":3,"raw":"### A. lack flexibility in responding to prompts\n\n> 在回应提示词时缺乏灵活性\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“lack [xxx] in responding to prompts”，保留了相应遮挡。当时的定位线索是：A的 responding to prompts 指程序根据文字生成图像的过程；第3段的 without permission 写程序所使用图像的许可问题，两者同属生成图像所用的程序，所以回看抓取图像这一句，同时联系刚才第2段已读的文字提示语功能。读完全文后，做题模式再经交叉验证排除A，最终选择C。\n\n**错误类型：第三类——无中生有。**\n\nflexibility是“灵活性”，A完整声称生成器不能灵活回应提示词。第2段展示输入文字描述及艺术家名字即可生成相似图像，第3段则转向训练图像未经许可的问题，没有报告响应提示词的灵活程度不足。\n\n作品能否灵活生成与素材是否获准是两个层面。without permission约束的是抓取和使用网上图像，不能把这一缺失移成工具的功能缺陷；C保留了未经许可及图像来源这两个直接证据。\n\n**命题人借用的原文材料：**\n\n> But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"A"},"focusId":"focus-q32-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>在回应提示词时缺乏灵活性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“lack [xxx] in responding to prompts”，保留了相应遮挡。当时的定位线索是：A的 responding to prompts 指程序根据文字生成图像的过程；第3段的 without permission 写程序所使用图像的许可问题，两者同属生成图像所用的程序，所以回看抓取图像这一句，同时联系刚才第2段已读的文字提示语功能。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>flexibility是“灵活性”，A完整声称生成器不能灵活回应提示词。第2段展示输入文字描述及艺术家名字即可生成相似图像，第3段则转向训练图像未经许可的问题，没有报告响应提示词的灵活程度不足。\u003c/p>\n\u003cp>作品能否灵活生成与素材是否获准是两个层面。without permission约束的是抓取和使用网上图像，不能把这一缺失移成工具的功能缺陷；C保留了未经许可及图像来源这两个直接证据。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. lack flexibility in responding to prompts","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 开源AI艺术生成器存在的问题是它们在回应提示词时缺乏灵活性。\n\n题干问开源生成器存在什么问题。第3段明确限定在网络图像的取得及许可，A的responding to prompts则需要关于系统响应能力的证据，须与第2段的提示词生成机制区分。\n\nflexibility是“灵活性”，A完整声称生成器不能灵活回应提示词。第2段展示输入文字描述及艺术家名字即可生成相似图像，第3段则转向训练图像未经许可的问题，没有报告响应提示词的灵活程度不足。\n\n作品能否灵活生成与素材是否获准是两个层面。without permission约束的是抓取和使用网上图像，不能把这一缺失移成工具的功能缺陷；C保留了未经许可及图像来源这两个直接证据。","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option- 格可得相似图像，不支持风格不可预测的判断。\n\nC：抓取网上图像并常未经许可，正是未经授权使用图像。\n\nD：艺术家作品与用户个人数据不是同一种被取得的材料。","context":{"mode":"image","asset":"questions","focus":[250,771,1800,441],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"32","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>32. C. make unauthorized use of online images\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：未经许可是素材取得问题，不能换成响应提示词不够灵活。\u003c/p>\n\u003cp>B：输入艺术家风格可得相似图像，不支持风格不可预测的判断。\u003c/p>\n\u003cp>C：抓取网上图像并常未经许可，正是未经授权使用图像。\u003c/p>\n\u003cp>D：艺术家作品与用户个人数据不是同一种被取得的材料。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"33题 · 题干、题型与核心出处","level":2,"raw":"## 33题\n\n> After searching online, Rutkowski found ______.  \n> 在线搜索后，Rutkowski发现了什么？\n\n### 题型\n\n经历结果题。题干要求判断“在线搜索后，Rutkowski发现了什么？”，先按第4、5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> According to the website Lexica, which tracks over 10 million images and prompts generated by Stable Diffusion, Rutkowski’s name has been used as a prompt around 93,000 times. Some of the world’s most famous artists, such as Michelangelo, Pablo Picasso, and Leonardo da Vinci, brought up around 2,000 prompts each or less. Rutkowski’s name also features as a prompt thousands of times in the Discord of another text-to-image generator, Midjourney. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn’t his.\n>\n> \"It's been just a month. What about in a year? I probably won't be able to find my work out there because the Internet will be flooded with AI art,\" Rutkowski says. \"That's concerning.\"\n\n他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,451],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"33","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>After searching online, Rutkowski found ______.\u003cbr>在线搜索后，Rutkowski发现了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>经历结果题。题干要求判断“在线搜索后，Rutkowski发现了什么？”，先按第4、5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>According to the website Lexica, which tracks over 10 million images and prompts generated by Stable Diffusion, Rutkowski’s name has been used as a prompt around 93,000 times. Some of the world’s most famous artists, such as Michelangelo, Pablo Picasso, and Leonardo da Vinci, brought up around 2,000 prompts each or less. Rutkowski’s name also features as a prompt thousands of times in the Discord of another text-to-image generator, Midjourney. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003cp>&quot;It&#39;s been just a month. What about in a year? I probably won&#39;t be able to find my work out there because the Internet will be flooded with AI art,&quot; Rutkowski says. &quot;That&#39;s concerning.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. a unique way to reach audiences","level":3,"raw":"### A. a unique way to reach audiences\n\n> 一种接触受众的独特方式\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 a unique way 与第4段 thought it might be a good way 都写某种好办法，后面还都连着观众，因此回看这个想法和紧接着的 Then，确认想法发生在搜索前还是搜索后。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 thought it might be a good way 是他搜索之前的想法，而且 might 只是可能。后面的 Then 才开始写他试着搜索自己的名字。A的 a unique way 不但把可能的好处说成已经找到独特方式，还把搜索前的猜想移到 after searching 之后，时间顺序与题干不合。\n\nThen已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\n\n**命题人借用的原文材料：**\n\n> Rutk or his name to see if a piece he had worked on had been published.\n>\n> 他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\n\n把这一处放回全文，它承担的写作任务是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> His search revealed a unique new route for reaching an audience with his own work.\n>\n> 搜索让他发现向受众传播自己作品的独特新渠道。\n\nreach audiences是他最初以为会获得的好处，But后的实际搜索却发现不是自己画的图。把期待当成发现，会把态度从正面转向担忧的转折抹去。","context":{"mode":"image","asset":"questions","focus":[250,1397,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>一种接触受众的独特方式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 a unique way 与第4段 thought it might be a good way 都写某种好办法，后面还都连着观众，因此回看这个想法和紧接着的 Then，确认想法发生在搜索前还是搜索后。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 thought it might be a good way 是他搜索之前的想法，而且 might 只是可能。后面的 Then 才开始写他试着搜索自己的名字。A的 a unique way 不但把可能的好处说成已经找到独特方式，还把搜索前的猜想移到 after searching 之后，时间顺序与题干不合。\u003c/p>\n\u003cp>Then已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski was initially surprised but thought it might be a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name to see if a piece he had worked on had been published.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在线搜索之后，鲁特科夫斯基发现一种接触受众的独特方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 a unique way 与第4段 thought it might be a good way 都写某种好办法，后面还都连着观众，因此回看这个想法和紧接着的 Then，确认想法发生在搜索前还是搜索后。\u003c/p>\n\u003cp>原文的 thought it might be a good way 是他搜索之前的想法，而且 might 只是可能。后面的 Then 才开始写他试着搜索自己的名字。A的 a unique way 不但把可能的好处说成已经找到独特方式，还把搜索前的猜想移到 after searching 之后，时间顺序与题干不合。\u003c/p>\n\u003cp>Then已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski was initially surprised but thought it might be a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name to see if a piece he had worked on had been published.\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>His search revealed a unique new route for reaching an audience with his own work.\u003c/p>\n\u003cp>搜索让他发现向受众传播自己作品的独特新渠道。\u003c/p>\n\u003c/blockquote>\n\u003cp>reach audiences是他最初以为会获得的好处，But后的实际搜索却发现不是自己画的图。把期待当成发现，会把态度从正面转向担忧的转折抹去。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. a unique way to reach audiences","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Artists’ responses to AI art generation.  \n> 艺术家对人工智能艺术生成的反应。\n\n把这个主旨直接代入33题题干：\n\n> 全文主旨只能确认个人经历与艺术家反应有关，不能替代搜索结果本身；须区分搜索前的期待、搜索实际返回的内容及后续担忧。\n\n但A实际说的是：\n\n> a unique way to reach audiences  \n> 一种接触受众的独特方式\n\nThen已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\n\n从全文推进看，这一处的作用是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。\n\n本项最终仍要根据“had his name attached”这处局部原文判断。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,1397,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A t back work 写搜索返回的东西；两者都被放在搜索结果的位置，所以回看最后一句实际返回的对象。\u003c/p>\n\u003cp>原文的 brought back work 明确把搜索结果写成作品，随后解释作品挂了他的名字却不是他的。\u003c/p>\n\u003cp>D把作品和署名这个具体发现改成了围绕版权展开的另一类内容；原句的返回对象已经写清。\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003cp>版权争议是第3段及后面集体反应的大背景，个人搜索段具体写的是出现了什么图像。没有争论帖子或双方交锋的描述，不能用全文议题替代局部经历。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The search chiefly brought him into a heated public dispute about his copyright.\u003c/p>\n\u003cp>搜索主要让他卷入关于自己版权的激烈公共争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>版权争议是第3段及后面集体反应的大背景，个人搜索段具体写的是出现了什么图像。没有争论帖子或双方交锋的描述，不能用全文议题替代局部经历。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认个人经历与艺术家反应有关，不能替代搜索结果本身；须区分搜索前的期待、搜索实际返回的内容及后续担忧。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>heated disputes regarding his copyright\u003cbr>围绕其版权的激烈争论\u003c/p>\n\u003c/blockquote>\n\u003cp>D把作品和署名这个具体发现改成了围绕版权展开的另一类内容；原句的返回对象已经写清。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。\u003c/p>\n\u003cp>本项最终仍要根据“had his name attached”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"33题结论","level":2,"raw":"### 33题结论\n\n> **33. C. AI-generated work bearing his name**\n\nA：免费曝光是搜索前的期待，不能当作搜索后的实际发现。\n\nB：认出作品不是自己画的，不等于发现通用AI鉴别方法。\n\nC：搜索返回带本人名字却非本人创作的生成作品，三项关系相合。\n\nD：全文的版权争议不能替代局部搜索返回了什么这一问题。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,451],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"33","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>33. C. AI-generated work bearing his name\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：免费曝光是搜索前的期待，不能当作搜索后的实际发现。\u003c/p>\n\u003cp>B：认出作品不是自己画的，不等于发现通用AI鉴别方法。\u003c/p>\n\u003cp>C：搜索返回带本人名字却非本人创作的生成作品，三项关系相合。\u003c/p>\n\u003cp>D：全文的版权争议不能替代局部搜索返回了什么这一问题。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"34题 · 题干、题型与核心出处","level":2,"raw":"## 34题\n\n> According to Ortiz, AI companies are advised to ______.  \n> 根据Ortiz，人工智能公司被建议做什么？\n\n### 题型\n\n建议内容题。题干要求判断“根据Ortiz，人工智能公司被建议做什么？”，先按第8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> \"There is a coalition growing within artist industries to figure out how to tackle or mitigate this,\" says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\n\n她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。","context":{"mode":"image","asset":"questions","focus":[250,1828,1800,451],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"34","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Ortiz, AI companies are advised to ______.\u003cbr>根据Ortiz，人工智能公司被建议做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>建议内容题。题干要求判断“根据Ortiz，人工智能公司被建议做什么？”，先按第8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. campaign for new policies or regulation","level":3,"raw":"### A. campaign for new policies or regulation\n\n> 为新政策或监管开展倡议活动\n\n**做题模式中的状态：** 第一轮A排除。当时选项呈现为“[xxx] for new policies or regulation”，保留了相应遮挡。当时的定位线索是：A的 new policies or regulation 与第8段原词相同，但前一句主语是 The group；要判断动作是否属于公司，因此回看说群体早期活动的整句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 The group 承接艺术行业内部出现的群体，其行动可能包括推动 new policies or regulation。A接回题干后却把主体换成人工智能公司。\n\nA取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\n\n**命题人借用的原文材料：**\n\n> The group is in its early days of mobilization, which could involve pushing for new policies or regulation.","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"A"},"focusId":"focus-q34-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>为新政策或监管开展倡议活动\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“[xxx] for new policies or regulation”，保留了相应遮挡。当时的定位线索是：A的 new policies or regulation 与第8段原词相同，但前一句主语是 The group；要判断动作是否属于公司，因此回看说群体早期活动的整句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 The group 承接艺术行业内部出现的群体，其行动可能包括推动 new policies or regulation。A接回题干后却把主体换成人工智能公司。\u003c/p>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p> 管开展倡议活动\n\nA取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\n\n从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\n\n本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"34","option":"A"},"focusId":"focus-q34-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>为新政策或监管开展倡议活动\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“[xxx] for new policies or regulation”，保留了相应遮挡。当时的定位线索是：A的 new policies or regulation 与第8段原词相同，但前一句主语是 The group；要判断动作是否属于公司，因此回看说群体早期活动的整句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 The group 承接艺术行业内部出现的群体，其行动可能包括推动 new policies or regulation。A接回题干后却把主体换成人工智能公司。\u003c/p>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The group is in its early days of mobilization, which could involve pushing for new policies or regulation.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司为新政策或监管开展倡议活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 new policies or regulation 与第8段原词相同，但前一句主语是 The group；要判断动作是否属于公司，因此回看说群体早期活动的整句。\u003c/p>\n\u003cp>原文的 The group 承接艺术行业内部出现的群体，其行动可能包括推动 new policies or regulation。A接回题干后却把主体换成人工智能公司。\u003c/p>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003cp>campaign由艺术行业联盟推动，题干问公司被建议做什么。原文先写艺术家的政策行动，再写公司训练选择；混合两句会调换行动主体。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The group is in its early days of mobilization, which could involve pushing for new policies or regulation.\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写艺术行业组织行动并提出训练材料和合作建议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>AI companies should organize the artists’ campaign for new rules and regulations.\u003c/p>\n\u003cp>AI公司应该组织艺术家争取新规则的行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>campaign由艺术行业联盟推动，题干问公司被建议做什么。原文先写艺术家的政策行动，再写公司训练选择；混合两句会调换行动主体。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家会提出应对办法，不能把各方行动混给同一主体；题干限定AI公司，应从结尾逐项确认公司被建议改变什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>campaign for new policies or regulation\u003cbr>为新政策或监管开展倡议活动\u003c/p>\n\u003c/blockquote>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\u003c/p>\n\u003cp>本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. offer their services to public institutions","level":3,"raw":"### B. offer their services to public institutions\n\n> 向公共机构提供服务\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\n\n图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\n\n**命题人借用的原文材料：**\n\n> One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.","context":{"mode":"image","asset":"questions","focus":[250,2014,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"B"},"focusId":"focus-q34-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>向公共机构提供服务\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\u003c/p>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. offer their services to public institutions","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 奥尔蒂斯建议AI公司向公共机构提供服务。\n\nB的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\n\n原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\n\n图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。","context":{"mode":"image","asset":"questions","focus":[250,2014,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>向公共机构提供服务\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\u003c/p>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司向公共机构提供服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\u003c/p>\n\u003cp>原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\u003c/p>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. offer their services to public institutions","level":4,"raw":"#### 写作视角法\n\n原文第8段是这样写的：\n\n> One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\n>\n> 她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\n\n把这一处放回全文，它承担的写作任务是：写艺术行业组织行动并提出训练材料和合作建议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> AI companies should primarily provide their services to public institutions.\n>\n> AI公司主要应该向公共机构提供服务。\n\n博物馆在原文是可协商训练素材合作的伙伴，不是需要购买AI服务的客户。offer services还把public-domain works误牵到public institutions，动作与宾语都变了。","context":{"mode":"image","asset":"questions","focus":[250,2014,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>向公共机构提供服务\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\u003c/p>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司向公共机构提供服务。\u00 arly days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.","context":{"mode":"image","asset":"questions","focus":[250,2101,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"C"},"focusId":"focus-q34-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-C-0\">\u003cblockquote>\n\u003cp>加强与AI用户的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 AI users 是公司要联系的对象，末段的 museums and artists 同样位于合作关系的另一端，因此回到 AI companies 所在的分句，比较对象具体是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 museums and artists 明确点出博物馆与艺术家；C的 AI users 则改为模型使用者。博物馆、艺术家在这里以作品相关方的身份出现，不能因为他们也可能使用工具，就把这条合作建议概括成加强用户关系。\u003c/p>\n\u003cp>对象不是一个宽泛标签下随意可换的身份；Ortiz专门点出的作品相关方被C换成了使用模型的用户。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. strengthen their relationships with AI users","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 奥尔蒂斯建议AI公司加强与AI用户的关系。\n\nC的 AI users 是公司要联系的对象，末段的 museums and artists 同样位于合作关系的另一端，因此回到 AI companies 所在的分句，比较对象具体是谁。\n\n原文的 museums and artists 明确点出博物馆与艺术家；C的 AI users 则改为模型使用者。博物馆、艺术家在这里以作品相关方的身份出现，不能因为他们也可能使用工具，就把这条合作建议概括成加强用户关系。\n\n对象不是一个宽泛标签下随意可换的身份；Ortiz专门点出的作品相关方被C换成了使用模型的用户。\n\n她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\n\n原文列出的伙伴是museums and artists，目的是妥善使用训练作品。将其替换成用户，无法解决作品创作者的许可及利益关切。","context":{"mode":"image","asset":"questions","focus":[250,2101,1800,85],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"34","option":"C"},"focusId":"focus-q34-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-C-0\">\u003cblockquote>\n\u003cp>加强与AI用户的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 AI users 是公司要联系的对象，末段的 museums and artists 同样位于合作关系的另一端，因此回到 AI companies 所在的分句，比较对象具体是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 museums and artists 明确点出博物馆与艺术家；C的 AI users 则改为模型使用者。博物馆、艺术家在这里以作品相关方的身份出现，不能因为他们也可能使用工具，就把这条合作建议概括成加强用户关系。\u003c/p>\n\u003cp>对象不是一个宽泛标签下随意可换的身份；Ortiz专门点出的作品相关方被C换成了使用模型的用户。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司加强与AI用户的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 AI users 是公司要联系的对象，末段的 museums and artists 同样位于合作关系的另一端，因此回到 AI companies 所在的分句，比较对象具体是谁。\u003c/p>\n\u003cp>原文的 museums and artists 明确点出博物馆与艺术家；C的 AI users 则改为模型使用者。博物馆、艺术家在这里以作品相关方的身份出现，不能因为他们也 blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家会提出应对办法，不能把各方行动混给同一主体；题干限定AI公司，应从结尾逐项确认公司被建议改变什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>adopt a different strategy for AI model training\u003cbr>采取不同的AI模型训练策略\u003c/p>\n\u003c/blockquote>\n\u003cp>原先怎样得到图像和现在建议怎样选图像都已写出，D概括了建议实际改变的训练做法。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\u003c/p>\n\u003cp>本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"34题结论","level":2,"raw":"### 34题结论\n\n> **34. D. adopt a different strategy for AI model training**\n\nA：推动政策是艺术家联盟的行动，不是对AI公司的同一项建议。\n\nB：博物馆是素材合作伙伴，不是原文所称的AI服务客户。\n\nC：建议的伙伴是博物馆和艺术家，不是生成器用户。\n\nD：公共领域作品与协商合作共同改变训练材料的取得策略。","context":{"mode":"image","asset":"questions","focus":[250,1828,1800,451],"sourceW":2255,"sourceH":3141,"label":"2024英语一Text 3题目"},"meta":{"question":"34","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>34. D. adopt a different strategy for AI model training\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：推动政策是艺术家联盟的行动，不是对AI公司的同一项建议。\u003c/p>\n\u003cp>B：博物馆是素材合作伙伴，不是原文所称的AI服务客户。\u003c/p>\n\u003cp>C：建议的伙伴是博物馆和艺术家，不是生成器用户。\u003c/p>\n\u003cp>D：公共领域作品与协商合作共同改变训练材料的取得策略。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：艺术家在AI时代的意外走红**（段落1-2背景介绍） 鲁特科夫斯基背景：波兰数字艺术家（古典风格+奇幻风景+游戏插画）→ 在AI生成世界突然走红 → 具体表现：【他的风格成为Stable Diffusion最常用提示词之一 → 用户输入带他名字的提示词就能生成类似风格作品】\n\n↓（问题揭示）\n\n**逻辑层次2：AI生成器的版权问题**（段落3核心问题） 问题根源：开源程序通过抓取网络图像建立（经常未经许可+无适当署名）→ 引发的问题：伦理和版权的棘手问题 → 艺术家态度：已经受够了\n\n↓（具体影响）\n\n**逻辑层次3：鲁特科夫斯基的个人经历**（段落4-5具体案例） 数据：名字被用作提示词93,000次 → 态度转变：【最初：惊讶但认为可接触新受众 → 后来：搜索发现带他名字但非他创作的作品】→ 担忧：\"一年后可能找不到自己的作品（互联网将充斥AI艺术）\"\n\n→（扩展到其他艺术家）\n\n**逻辑层次4：艺术家群体的反击行动**（段落6-7集体响应） 其他艺术家反应：同样惊讶+开始反击 → 代表人物：卡拉·奥尔蒂斯（发现作品在数据集中→提高版权意识）→ 两层担忧：【经济层面：失去收入（AI图像用于商业）+ 个人层面：数据保护和隐私问题（艺术与个人紧密相连）】\n\n↓（解决方案）\n\n**逻辑层次5：应对策略和建议**（段落8未来方向） 组织行动：艺术家行业内联盟形成（早期动员阶段）→ 可能措施：推动新政策或法规 → 具体建议：【AI模型使用公共领域图像训练 + AI公司与博物馆和艺术家建立合作】\n\n↑（全文主旨）\n\n全文核心观点：AI艺术生成器在未经许可使用艺术家作品的情况下快速发展，引发了版权、经济利益和个人权益等多重问题，促使艺术家群体组织起来寻求政策和合作层面的解决方案。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：艺术家在AI时代的意外走红\u003c/strong>（段落1-2背景介绍） 鲁特科夫斯基背景：波兰数字艺术家（古典风格+奇幻风景+游戏插画）→ 在AI生成世界突然走红 → 具体表现：【他的风格成为Stable Diffusion最常用提示词之一 → 用户输入带他名字的提示词就能生成类似风格作品】\u003c/p>\n\u003cp>↓（问题揭示）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：AI生成器的版权问题\u003c/strong>（段落3核心问题） 问题根源：开源程序通过抓取网络图像建立（经常未经许可+无适当署名）→ 引发的问题：伦理和版权的棘手问题 → 艺术家态度：已经受够了\u003c/p>\n\u003cp>↓（具体影响）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：鲁特科夫斯基的个人经历\u003c/strong>（段落4-5具体案例） 数据：名字被用作提示词93,000次 → 态度转变：【最初：惊讶但认为可接触新受众 → 后来：搜索发现带他名字但非他创作的作品】→ 担忧：&quot;一年后可能找不到自己的作品（互联网将充斥AI艺术）&quot;\u003c/p>\n\u003cp>→（扩展到其他艺术家）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：艺术家群体的反击行动\u003c/strong>（段落6-7集体响应） 其他艺术家反应：同样惊讶+开始反击 → 代表人物：卡拉·奥尔蒂斯（发现作品在数据集中→提高版权意识）→ 两层担忧：【经济层面：失去收入（AI图像用于商业）+ 个人层面：数据保护和隐私问题（艺术与个人紧密相连）】\u003c/p>\n\u003cp>↓（解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：应对策略和建议\u003c/strong>（段落8未来方向） 组织行动：艺术家行业内联盟形成（早期动员阶段）→ 可能措施：推动新政策或法规 → 具体建议：【AI模型使用公共领域图像训练 + AI公司与博物馆和艺术家建立合作】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：AI艺术生成器在未经许可使用艺术家作品的情况下快速发展，引发了版权、经济利益和个人权益等多重问题，促使艺术家群体组织起来寻求政策和合作层面的解决方案。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】E. Popularity Is Not Permission\n\n> 受欢迎不等于许可\n\n这一部分区分用户欣赏风格与创作者许可材料使用，说明热度不能替代授权关系。\n\n首先明确受欢迎是谁的选择：\n\n> without the artist choosing to take part\n\n是用户把艺术家名字用作指令，艺术家本人未必选择参与。热度不能自动变成主动合作的证据。\n\n然后把两种关系直接拆开：\n\n> Approval from an audience and permission from a source\n\n观众喜欢效果，与作品来源方允许使用，主体及行为都不同。前者不能替后者作决定。\n\n结尾把注意力由热度转向什么：\n\n> how the underlying material entered the system\n\n调用越多，越需要追问背后训练材料怎样进入系统。文章并非只庆祝走红，而是由走红引出许可问题。\n\n这一部分的推进关系是：\n\n> 艺术家名字被用户频繁调用 → 受欢迎可能并非自愿参与 → 观众欣赏与来源许可不同 → 热度使训练材料来源更值得追问\n\nPopularity对应popular instruction与frequently requested；Permission对应creator agreed以及材料来源。Is Not保留两个主体关系的区分，准确概括从表面欢迎转向授权疑问的推进。\n\n再看最强干扰项F：Teaching Artists to Use Every New Tool。\n\n教艺术家使用工具假定艺术家需要学会操作，段中却只写用户用名字发出请求。without the artist choosing to take part已明确艺术家未必是使用者，全文焦点是许可而不是操作技能。\n\n**41题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. Popularity Is Not Permission\u003c/p>\n\u003cblockquote>\n\u003cp>受欢迎不等于许可\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分用户欣赏风格与创作者许可材料使用，说明热度不能替代授权关系。\u003c/p>\n\u003cp>首先明确受欢迎是谁的选择：\u003c/p>\n\u003cblockquote>\n\u003cp>without the artist choosing to take part\u003c/p>\n\u003c/blockquote>\n\u003cp>是用户把艺术家名字用作指令，艺术家本人未必选择参与。热度不能自动变成主动合作的证据。\u003c/p>\n\u003cp>然后把两种关系直接拆开：\u003c/p>\n\u003cblockquote>\n\u003cp>Approval from an audience and permission from a source\u003c/p>\n\u003c/blockquote>\n\u003cp>观众喜欢效果，与作品来源方允许使用，主体及行为都不同。前者不能替后者作决定。\u003c/p>\n\u003cp>结尾把注意力由热度转向什么：\u003c/p>\n\u003cblockquote>\n\u003cp>how the underlying material entered the system\u003c/p>\n\u003c/blockquote>\n\u003cp>调用越多，越需要追问背后训练材料怎样进入系统。文章并非只庆祝走红，而是由走红引出许可问题。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>艺术家名字被用户频繁调用 → 受欢迎可能并非自愿参与 → 观众欣赏与来源许可不同 → 热度使训练材料来源更值得追问\u003c/p>\n\u003c/blockquote>\n\u003cp>Popularity对应popular instruction与frequently requested；Permission对应creator agreed以及材料来源。Is Not保留两个主体关系的区分，准确概括从表面欢迎转向授权疑问的推进。\u003c/p>\n\u003cp>再看最强干扰项F：Teaching Artists to Use Every New Tool。\u003c/p>\n\u003cp>教艺术家使用工具假定艺术家需要学会操作，段中却只写用户用名字发出请求。without the artist choosing to take part已明确艺术家未必是使用者，全文焦点是许可而不是操作技能。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】G. When a Name Points to Someone Else’s Image\n\n> 名字指向他人图像时\n\n这一部分追踪免费曝光预期如何因搜索发现署名错配转为原作可见性与归属担忧。\n\n先看最初的正面期待是什么：\n\n> may look like free publicity\n\n名字传播一开始可能被看成免费曝光，may与look like都只是初步认识，后面马上写搜索怎样使它改变。\n\n搜索真正带来的错配是什么：\n\n> pictures bearing the name but made by somebody else\n\n同一个名字被挂到其他人借生成器制作的图像上，名字与真实创作来源不再一致，而非艺术家原作简单增加受众。\n\n结尾把担忧落到观看者的哪种能力：\n\n> tell what the named person actually created\n\n问题是还能不能分清署名者实际创作了什么。生成量继续增加会使真作更难找到，因此重点在归属与可见性。\n\n这一部分的推进关系是：\n\n> 起初期待免费曝光 → 搜索发现别人生成的图挂着自己名字 → 名字与作品关系模糊 → 真作可能被淹没、归属难以辨别\n\na Name对应bearing the name和named person；Someone Else’s Image对应made by somebody else。When抓住造成态度变化的具体搜索遭遇，同时覆盖其后归属与发现原作的担忧。\n\n再看最强干扰项E：Popularity Is Not Permission。\n\n受欢迎不等于许可是相关背景，但本段没有追查训练作品是否同意被用。这里的中心是输出图像的署名错配与搜索结果挤压真作，用许可标题会漏掉最具体的发现和后果。\n\n**42题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. When a Name Points to Someone Else’s Image\u003c/p>\n\u003cblockquote>\n\u003cp>名字指向他人图像时\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分追踪免费曝光预期如何因搜索发现署名错配转为原作可见性与归属担忧。\u003c/p>\n\u003cp>先看最初的正面期待是什么：\u003c/p>\n\u003cblockquote>\n\u003cp>may look like free publicity\u003c/p>\n\u003c/blockquote>\n\u003cp>名字传播一开始可能被看成免费曝光，may与look like都只是初步认识，后面马上写搜索怎样使它改变。\u003c/p>\n\u003cp>搜索真正带来的错配是什么：\u003c/p>\n\u003cblockquote>\n\u003cp>pictures bearing the name but made by somebody else\u003c/p>\n\u003c/blockquote>\n\u003cp>同一个名字被挂到其他人借生成器制作的图像上，名字与真实创作来源不再一致，而非艺术家原作简单增加受众。\u003c/p>\n\u003cp>结尾把担忧落到观看者的哪种能力：\u003c/p>\n\u003cblockquote>\n\u003cp>tell what the named person actually created\u003c/p>\n\u003c/blockquote>\n\u003cp>问题是还能不能分清署名者实际创作了什么。生成量继续增加会使真作更难找到，因此重点在归属与可见性。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>起初期待免费曝光 → 搜索发现别人生成的图挂着自己名字 → 名字与作品关系模糊 → 真作可能被淹没、归属难以辨别\u003c/p>\n\u003c/blockquote>\n\u003cp>a Name对应bearing the name和named person；Someone Else’s Image对应made by somebody else。When抓住造成态度变化的具体搜索遭遇，同时覆盖其后归属与发现原作的担忧。\u003c/p>\n\u003cp>再看最强干扰项E：Popularity Is Not Permission。\u003c/p>\n\u003cp>受欢迎不等于许可是相关背景，但本段没有追查训练作品是否同意被用。这里的中心是输出图像的署名错配与搜索结果挤压真作，用许可标题会漏掉最具体的发现和后果。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】B. More Is at Stake than an Income\n\n> 涉及的不只是收入\n\n这一部分先承认委托收入的竞争，再说明风格与个人身份使争议超出金钱。\n\n先承认争议中的经济部分：\n\n> compete with commissioned work\n\n廉价生成图像可能与委托创作竞争，收入顾虑确实存在，作者没有否定它。\n\nYet之后增加了哪个层面：\n\n> closely tied to a person’s career and public identity\n\n风格还联系职业经历与公众身份，所以出现在陌生场景时，问题不只是少一笔交易。\n\n最后说明只谈钱会漏掉什么：\n\n> leave the question of identity unresolved\n\n即使讨论支付，也未说明哪些图反映艺术家自己的选择。收入与身份可相互关联，却不能因此被当成同一个问题。\n\n这一部分的推进关系是：\n\n> 生成图像可能竞争委托工作 → 风格还联系个人职业身份 → 陌生图像未必代表本人选择 → 金钱回应不能自动解决身份问题\n\nIncome对应earnings、sale与payment；More Is at Stake对应second concern及public identity。标题保留先承认经济风险、再增加个人层面的转折，而不是将两者排成互不相关的争议。\n\n再看最强干扰项G：When a Name Points to Someone Else’s Image。\n\n名字错配可以引起个人困扰，但本段并未叙述在线搜索或谁给图像挂名。作者在比较经济利益与个人身份两类关切；只写名字指错作品，会把这个更广的二层分析缩成单一经历。\n\n**43题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. More Is at Stake than an Income\u003c/p>\n\u003cblockquote>\n\u003cp>涉及的不只是收入\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分先承认委托收入的竞争，再说明风格与个人身份使争议超出金钱。\u003c/p>\n\u003cp>先承认争议中的经济部分：\u003c/p>\n\u003cblockquote>\n\u003cp>compete with commissioned work\u003c/p>\n\u003c/blockquote>\n\u003cp>廉价生成图像可能与委托创作竞争，收入顾虑确实存在，作者没有否定它。\u003c/p>\n\u003cp>Yet之后增加了哪个层面：\u003c/p>\n\u003cblockquote>\n\u003cp>closely tied to a person’s career and public identity\u003c/p>\n\u003c/blockquote>\n\u003cp>风格还联系职业经历与公众身份，所以出现在陌生场景时，问题不只是少一笔交易。\u003c/p>\n\u003cp>最后说明只谈钱会漏掉什么：\u003c/p>\n\u003cblockquote>\n\u003cp>leave the question of identity unresolved\u003c/p>\n\u003c/blockquote>\n\u003cp>即使讨论支付，也未说明哪些图反映艺术家自己的选择。收入与身份可相互关联，却不能因此被当成同一个问题。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>生成图像可能竞争委托工作 → 风格还联系个人职业身份 → 陌生图像未必代表本人选择 → 金钱回应不能自动解决身份问题\u003c/p>\n\u003c/blockquote>\n\u003cp>Income对应earnings、sale与payment；More Is at Stake对应second concern及public identity。标题保留先承认经济风险、再增加个人层面的转折，而不是将两者排成互不相关的争议。\u003c/p>\n\u003cp>再看最强干扰项G：When a Name Points to Someone Else’s Image。\u003c/p>\n\u003cp>名字错配可以引起个人困扰，但本段并未叙述在线搜索或谁给图像挂名。作者在比较经济利益与个人身份两类关切；只写名字指错作品，会把这个更广的二层分析缩成单一经历。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】C. Turning Individual Objections into Collective Action\n\n> 把个人异议转为集体行动\n\n这一部分说明艺术家怎样把重复的个人遭遇整理成共同诉求，以及不同动机如何支持同一行动。\n\n开头为什么将单独投诉与合作相对：\n\n> repeated problems become harder to describe as one person’s misunderstanding\n\n比对经历后问题具有重复性，便不能轻易解释成一人的误会。合作因此增加了异议的可见度和说服力。\n\n中间列出的共同动作有哪些：\n\n> collect examples, formulate shared requests and seek a discussion\n\n收集实例、形成共同诉求、寻找制度对话，都把零散抱怨变成可以交给有关机构回应的问题。\n\n成员是否必须有完全相同动机：\n\n> does not require every member to object to technology for the same reason\n\n收入、署名、控制权可以各有侧重；一致的是组织提问和要求回应的行动，不是统一个人理由。\n\n这一部分的推进关系是：\n\n> 个人投诉容易被忽视 → 比对经历显示重复问题 → 收集证据并形成共同请求 → 不同动机可以汇成共同问责行动\n\nIndividual Objections对应isolated complaint与separate experiences；Collective Action对应group收集、组织和对话。Turning概括从孤立经历到可由公司及公共机构回应的诉求这一变化。\n\n再看最强干扰项A：Stopping All Forms of Digital Art。\n\n停止全部数字艺术把合作的目标扩大为全面禁绝。段中成员可能只关注署名或收入，且明确不必以同样理由反对技术；共同请求是要求回应具体问题，没有停止所有数字创作的宣言。\n\n**44题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. Turning Individual Objections into Collective Action\u003c/p>\n\u003cblockquote>\n\u003cp>把个人异议转为集体行动\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分说明艺术家怎样把重复的个人遭遇整理成共同诉求，以及不同动机如何支持同一行动。\u003c/p>\n\u003cp>开头为什么将单独投诉与合作相对：\u003c/p>\n\u003cblockquote>\n\u003cp>repeated problems become harder to describe as one person’s misunderstanding\u003c/p>\n\u003c/blockquote>\n\u003cp>比对经历后问题具有重复性，便不能轻易解释成一人的误会。合作因此增加了异议的可见度和说服力。\u003c/p>\n\u003cp>中间列出的共同动作有哪些：\u003c/p>\n\u003cblockquote>\n\u003cp>collect examples, formulate shared requests and seek a discussion\u003c/p>\n\u003c/blockquote>\n\u003cp>收集实例、形成共同诉求、寻找制度对话，都把零散抱怨变成可以交给有关机构回应的问题。\u003c/p>\n\u003cp>成员是否必须有完全相同动机：\u003c/p>\n\u003cblockquote>\n\u003cp>does not require every member to object to technology for the same reason\u003c/p>\n\u003c/blockquote>\n\u003cp>收入、署名、控制权可以各有侧重；一致的是组织提问和要求回应的行动，不是统一个人理由。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>个人投诉容易被忽视 → 比对经历显示重复问题 → 收集证据并形成共同请求 → 不同动机可以汇成共同问责行动\u003c/p>\n\u003c/blockquote>\n\u003cp>Individual Objections对应isolated complaint与separate experiences；Collective Action对应group收集、组织和对话。Turning概括从孤立经历到可由公司及公共机构回应的诉求这一变化。\u003c/p>\n\u003cp>再看最强干扰项A：Stopping All Forms of Digital Art。\u003c/p>\n\u003cp>停止全部数字艺术把合作的目标扩大为全面禁绝。段中成员可能只关注署名或收入，且明确不必以同样理由反对技术；共同请求是要求回应具体问题，没有停止所有数字创作的宣言。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】D. Changing the Sources Used for Training\n\n> 改变训练材料的来源\n\n这一部分把回应落实到训练材料的来源与协商取得，说明可以改变开发条件而非停止生成。\n\n首句先排除何种极端理解：\n\n> need not be a demand to end image generation\n\n提出换训练材料不必意味着停止生成，下一句给出可以继续建模的材料与合作方式。\n\n改变发生在生成流程的哪个时点：\n\n> before a user enters a prompt\n\n与艺术家或机构协商、使用合适公共领域资料，都在训练材料取得阶段起作用，而非输出后加一句安抚说明。\n\n末句用什么概括方案原则：\n\n> Cooperation at the source becomes part of the design\n\nsource强调材料源头，design表示将合作嵌入系统形成过程。重点不是工具够不够新奇，而是依赖的作品如何正当地进入。\n\n这一部分的推进关系是：\n\n> 改变材料不等于停止生成 → 提出协商作品与公共领域资料 → 在提示输入前改变素材取得 → 将源头合作纳入设计\n\nSources Used for Training对应different training material及works、collections；Changing对应change how material is obtained。标题覆盖材料选择和合作取得两项，而不缩成输出后署名提醒。\n\n再看最强干扰项A：Stopping All Forms of Digital Art。\n\n停止所有数字艺术与首句need not…end image generation直接相反，且比停止图像生成还扩大到全部数字创作。作者正在说明继续开发时可改变的材料路线，不是取消创作工具。\n\n**45题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】D. Changing the Sources Used for Training\u003c/p>\n\u003cblockquote>\n\u003cp>改变训练材料的来源\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把回应落实到训练材料的来源与协商取得，说明可以改变开发条件而非停止生成。\u003c/p>\n\u003cp>首句先排除何种极端理解：\u003c/p>\n\u003cblockquote>\n\u003cp>need not be a demand to end image generation\u003c/p>\n\u003c/blockquote>\n\u003cp>提出换训练材料不必意味着停止生成，下一句给出可以继续建模的材料与合作方式。\u003c/p>\n\u003cp>改变发生在生成流程的哪个时点：\u003c/p>\n\u003cblockquote>\n\u003cp>before a user enters a prompt\u003c/p>\n\u003c/blockquote>\n\u003cp>与艺术家或机构协商、使用合适公共领域资料，都在训练材料取得阶段起作用，而非输出后加一句安抚说明。\u003c/p>\n\u003cp>末句用什么概括方案原则：\u003c/p>\n\u003cblockquote>\n\u003cp>Cooperation at the source becomes part of the design\u003c/p>\n\u003c/blockquote>\n\u003cp>source强调材料源头，design表示将合作嵌入系统形成过程。重点不是工具够不够新奇，而是依赖的作品如何正当地进入。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>改变材料不等于停止生成 → 提出协商作品与公共领域资料 → 在提示输入前改变素材取得 → 将源头合作纳入设计\u003c/p>\n\u003c/blockquote>\n\u003cp>Sources Used for Training对应different training material及works、collections；Changing对应change how material is obtained。标题覆盖材料选择和合作取得两项，而不缩成输出后署名提醒。\u003c/p>\n\u003cp>再看最强干扰项A：Stopping All Forms of Digital Art。\u003c/p>\n\u003cp>停止所有数字艺术与首句need not…end image generation直接相反，且比停止图像生成还扩大到全部数字创作。作者正在说明继续开发时可改变的材料路线，不是取消创作工具。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从艺术家意外走红提出用户怎样使用其名字的问题 |\n| B | 区分生计与个人身份关切，将回应转向素材取得 |\n| C | 呈现搜索中的署名错配及真作可见性、身份呈现担忧 |\n| D | 提出通过协商与公共领域材料改变训练来源 |\n| E | 指出热度不能解释艺术家反应，转向搜索本人作品的经历 |\n| F | 由训练材料来源引出许可问题，解释用户喜欢而艺术家反对 |\n| G | 说明名字作为提示词生成相似风格，并转向训练材料 |\n| H | 以源头合作收束，理解艺术家对技术发展条件的要求 |\n\n全文推进：\n\n> 从艺术家意外走红提出用户怎样使用其名字的问题 → 说明名字作为提示词生成相似风格，并转向训练材料 → 由训练材料来源引出许可问题，解释用户喜欢而艺术家反对 → 指出热度不能解释艺术家反应，转向搜索本人作品的经历 → 呈现搜索中的署名错配及真作可见性、身份呈现担忧 → 区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源 → 以源头合作收束，理解艺术家对技术发展条件的要求\n\n完整顺序：\n\n**A → G → F → E → C → B → D → H**\n\n41—45：G、F、C、B、D。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从艺术家意外走红提出用户怎样使用其名字的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>区分生计与个人身份关切，将回应转向素材取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>呈现搜索中的署名错配及真作可见性、身份呈现担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>提出通过协商与公共领域材料改变训练来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>指出热度不能解释艺术家反应，转向搜索本人作品的经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由训练材料来源引出许可问题，解释用户喜欢而艺术家反对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明名字作为提示词生成相似风格，并转向训练材料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以源头合作收束，理解艺术家对技术发展条件的要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从艺术家意外走红提出用户怎样使用其名字的问题 → 说明名字作为提示词生成相似风格，并转向训练材料 → 由训练材料来源引出许可问题，解释用户喜欢而艺术家反对 → 指出热度不能解释艺术家反应，转向搜索本人作品的经历 → 呈现搜索中的署名错配及真作可见性、身份呈现担忧 → 区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源 → 以源头合作收束，理解艺术家对技术发展条件的要求\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → G → F → E → C → B → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：G、F、C、B、D。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → G → F的关系。\n\n先看前段A的结尾：\n\n> Understandi eration begins.\n\n后段H的开头是：\n\n> That cooperation would not answer every question raised by generated art, but it would change the starting point of the discussion.\n\n已知末段That cooperation回指源头合作，同时用not every question限定方案作用。先有可执行的合作方向，末段才有条件讨论它怎样改变技术发展争论的起点。\n\n这三段的局部推进是：\n\n> 区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源 → 以源头合作收束，理解艺术家对技术发展条件的要求\n\n再检验容易混淆的候选G。它的开头是：\n\n> They are entering it as part of a written prompt for an image generator.\n\n提示词段末尾虽然出现training material，但只是解释模型能力依赖什么，没有形成任何cooperation。若放在此处，已知末段的That cooperation无先行安排，还会让全文在提出回应后退回工具使用说明。\n\n**45题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成B → D → H的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A useful response must address the way the material enters the system.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One proposed response changes the sources used for training.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后要求回应how the material enters the system，本段One proposed response以changes the sources直接接住这一任务。它回答的是材料取得方式，不是教用户换一种提示词。\u003c/p>\n\u003cp>协商艺术家与机构、使用合适公共领域资料是两种可考虑路线；后面把创作者视为关系参与者，与仅作可输入名字对照。段尾将cooperation明确放在生成开始之前。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>It places cooperation before generation begins.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That cooperation would not answer every question raised by generated art, but it would change the starting point of the discussion.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That cooperation回指源头合作，同时用not every question限定方案作用。先有可执行的合作方向，末段才有条件讨论它怎样改变技术发展争论的起点。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源 → 以源头合作收束，理解艺术家对技术发展条件的要求\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>They are entering it as part of a writ const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Stopping All Forms of Digital Art\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. More Is at Stake than an Income\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Turning Individual Objections into Collective Action\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Changing the Sources Used for Training\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Popularity Is Not Permission\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Teaching Artists to Use Every New Tool\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. When a Name Points to Someone Else’s Image\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>An artist’s name can become a popular instruction for an image generator without the artist choosing to take part. Users may request a style because they admire its effects, and the system may respond with a convincing imitation. Neither fact shows that the creator agreed to the use of the work behind that response. Approval from an audience and permission from a source are different relationships. Confusing them makes an ethical question disappear inside a story about popularity. The more frequently a name is requested, the more important it becomes to ask how the underlying material entered the system.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>At first, seeing one’s name spread across the internet may look like free publicity. That impression can change when a search returns pictures bearing the name but made by somebody else with a generator. The artist is no longer simply gaining an audience for existing work. The connection between the name and the work is becoming uncertain. If the results multiply, genuine illustrations may be harder to find among the imitations. The concern is therefore not just whether a generated image looks impressive, but whether viewers can still tell what the named person actually created.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>Artists may worry that inexpensive generated images will compete with commissioned work. Yet reducing the dispute to earnings misses a second concern. A recognizable style can be closely tied to a person’s career and public identity. Seeing that style attached to unfamiliar scenes may feel different from losing one particular sale. The artist may ask how to explain which images reflect their own choices and which do not. Financial and personal interests can therefore overlap without being identical. A response that discusses only payment may leave the question of identity unresolved.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>An isolated complaint can be easy for a large technology company to overlook. When artists compare experiences, however, repeated problems become harder to describe as one person’s misunderstanding. A group can collect examples, formulate shared requests and seek a discussion with institutions that shape industry practice. Cooperation does not require every member to object to technology for the same reason. Some may focus on income, others on attribution or control of their work. What joins them is an effort to turn separate experiences into questions that companies and public bodies can be asked to answer.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>A proposal for different training material need not be a demand to end image generation. A company could build a model around works whose use has been agreed with artists or institutions, and around suitable public-domain collections. Such choices would change how material is obtained before a user enters a prompt. They would not merely add a reassuring notice after an image appears. The proposal moves the discussion from whether a tool is exciting to whether its foundations are acceptable to the people whose work makes it possible. Cooperation at the source becomes part of the design.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>A digital artist may discover that a familiar career has acquired an unfamiliar audience. People who never commissioned a picture can suddenly be using the artist’s name in large numbers. The popularity may initially sound welcome. Understanding the artist’s reaction, however, requires first understanding what those users are actually doing with the name.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Those two concerns show why money alone cannot settle every objection. Lost commissions would affect a livelihood, but an unfamiliar image associated with a recognizable style may also affect personal identity. Artists can therefore ask both who benefits financially and who controls the connection between a person and their work. A useful response must address the way the material enters the system.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>A search may return pictures carrying the artist’s name that the artist never made. Instead of simply drawing attention to genuine work, the growing flow can make authorship harder to identify. An illustrator may then fear that commissioned pieces will disappear beneath imitations. The problem involves both access to an audience and control over how the creator is represented.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>One proposed response changes the sources used for training. Instead of relying on unexamined collections from the web, companies could seek agreed arrangements with artists and institutions and use suitable public-domain material. This approach treats creators as participants in a relationship, not merely as names a user can type. It places cooperation before generation begins.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>Their objections are not always obvious from a count of how often a name appears. The same number can look like welcome exposure to a user and an unwelcome appropriation to its owner. To understand the difference, it helps to follow what happens when an artist tries to find their own work in that expanding flow of images.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>The origin of that training material is where a separate problem begins. If images have been gathered online without the creators agreeing to their use, an impressive result does not remove the question of permission. Technical capability and acceptable sourcing must be considered separately. This distinction helps explain why artists can object to a tool that many users admire.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>They are entering it as part of a written prompt for an image generator. Alongside a description of a scene, the name can ask the system for effects resembling a particular style. The resulting picture is newly generated, rather than simply a link to the artist’s existing work. This ability depends on material used earlier in training the model.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That cooperation would not answer every question raised by generated art, but it would change the starting point of the discussion. Artists’ reactions can then be understood as demands about the conditions of development, rather than as proof that creativity and technology must be enemies. The aim is a process whose participants can explain how the work behind it is being used.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2024英语一Text 3重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Polish\u003c/td>\n\u003ctd>adj.波兰的\u003c/td>\n\u003ctd>digital artist\u003c/td>\n\u003ctd>n.数字艺术家\u003c/td>\n\u0
