版权的激烈争论\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“heated [xxx] regarding his copyright”，保留了相应遮挡。当时的定位线索是：D的 regarding his copyright 说关于版权的内容，第4段的 brought back work 写搜索返回的东西；两者都被放在搜索结果的位置，所以回看最后一句实际返回的对象。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文的 brought back work 明确把搜索结果写成作品，随后解释作品挂了他的名字却不是他的。\u003c/p>\n\u003cp>D把作品和署名这个具体发现改成了围绕版权展开的另一类内容；原句的返回对象已经写清。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在线搜索之后，鲁特科夫斯基发现围绕其版权的激烈争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 regarding his copyright 说关于版权的内容，第4段的 brought back work 写搜索返回的东西；两者都被放在搜索结果的位置，所以回看最后一句实际返回的对象。\u003c/p>\n\u003cp>原文的 brought back work 明确把搜索结果写成作品，随后解释作品挂了他的名字却不是他的。\u003c/p>\n\u003cp>D把作品和署名这个具体发现改成了围绕版权展开的另一类内容；原句的返回对象已经写清。\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003cp>版权争议是第3段及后面集体反应的大背景，个人搜索段具体写的是出现了什么图像。没有争论帖子或双方交锋的描述，不能用全文议题替代局部经历。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The search chiefly brought him into a heated public dispute about his copyright.\u003c/p>\n\u003cp>搜索主要让他卷入关于自己版权的激烈公共争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>版权争议是第3段及后面集体反应的大背景，个人搜索段具体写的是出现了什么图像。没有争论帖子或双方交锋的描述，不能用全文议题替代局部经历。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认个人经历与艺术家反应有关，不能替代搜索结果本身；须区分搜索前的期待、搜索实际返回的内容及后续担忧。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>heated disputes regarding his copyright\u003cbr>围绕其版权的激烈争论\u003c/p>\n\u003c/blockquote>\n\u003cp>D把作品和署名这个具体发现改成了围绕版权展开的另一类内容；原句的返回对象已经写清。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。\u003c/p>\n\u003cp>本项最终仍要根据“had his name attached”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. C. AI-generated work bearing his name\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：免费曝光是搜索前的期待，不能当作搜索后的实际发现。\u003c/p>\n\u003cp>B：认出作品不是自己画的，不等于发现通用AI鉴别方法。\u003c/p>\n\u003cp>C：搜索返回带本人名字却非本人创作的生成作品，三项关系相合。\u003c/p>\n\u003cp>D：全文的版权争议不能替代局部搜索返回了什么这一问题。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Ortiz, AI companies are advised to ______.\u003cbr>根据Ortiz，人工智能公司被建议做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>建议内容题。题干要求判断“根据Ortiz，人工智能公司被建议做什么？”，先按第8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003ch3>A. campaign for new policies or regulation\u003c/h3>\n\u003cblockquote>\n\u003cp>为新政策或监管开展倡议活动\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“[xxx] for new policies or regulation”，保留了相应遮挡。当时的定位线索是：A的 new policies or regulation 与第8段原词相同，但前一句主语是 The group；要判断动作是否属于公司，因此回看说群体早期活动的整句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 The group 承接艺术行业内部出现的群体，其行动可能包括推动 new policies or regulation。A接回题干后却把主体换成人工智能公司。\u003c/p>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The group is in its early days of mobilization, which could involve pushing for new policies or regulation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司为新政策或监管开展倡议活动。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 new policies or regulation 与第8段原词相同，但前一句主语是 The group；要判断动作是否属于公司，因此回看说群体早期活动的整句。\u003c/p>\n\u003cp>原文的 The group 承接艺术行业内部出现的群体，其行动可能包括推动 new policies or regulation。A接回题干后却把主体换成人工智能公司。\u003c/p>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003cp>campaign由艺术行业联盟推动，题干问公司被建议做什么。原文先写艺术家的政策行动，再写公司训练选择；混合两句会调换行动主体。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The group is in its early days of mobilization, which could involve pushing for new policies or regulation.\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写艺术行业组织行动并提出训练材料和合作建议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>AI companies should organize the artists’ campaign for new rules and regulations.\u003c/p>\n\u003cp>AI公司应该组织艺术家争取新规则的行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>campaign由艺术行业联盟推动，题干问公司被建议做什么。原文先写艺术家的政策行动，再写公司训练选择；混合两句会调换行动主体。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家会提出应对办法，不能把各方行动混给同一主体；题干限定AI公司，应从结尾逐项确认公司被建议改变什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>campaign for new policies or regulation\u003cbr>为新政策或监管开展倡议活动\u003c/p>\n\u003c/blockquote>\n\u003cp>A取用了群体行动的对象，却移给题干中的公司；段内明写的两个主体承担不同动作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\u003c/p>\n\u003cp>本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. offer their services to public institutions\u003c/h3>\n\u003cblockquote>\n\u003cp>向公共机构提供服务\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\u003c/p>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司向公共机构提供服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 public institutions 提到公共机构，末段的 images in the public domain 也有public，不过这里修饰图像的使用领域；因此回到建议模型训练的句子，确认public说的是什么。\u003c/p>\n\u003cp>原文的 images in the public domain 指处于公共领域的图像，是模型接受训练的材料。B的 public institutions 指机构，是公司提供服务的对象。随后虽有 museums，但它与 artists 共同成为 partnerships 的对象，而非被写成服务接收者；B把训练素材的公共属性换成机构性质，又把合作关系换成提供服务。\u003c/p>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写艺术行业组织行动并提出训练材料和合作建议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>AI companies should primarily provide their services to public institutions.\u003c/p>\n\u003cp>AI公司主要应该向公共机构提供服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>博物馆在原文是可协商训练素材合作的伙伴，不是需要购买AI服务的客户。offer services还把public-domain works误牵到public institutions，动作与宾语都变了。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家会提出应对办法，不能把各方行动混给同一主体；题干限定AI公司，应从结尾逐项确认公司被建议改变什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>offer their services to public institutions\u003cbr>向公共机构提供服务\u003c/p>\n\u003c/blockquote>\n\u003cp>图像是训练输入，机构是服务对象，两者不是同一位置；博物馆也在合作建议中，不能代替原句写出服务关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\u003c/p>\n\u003cp>本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. strengthen their relationships with AI users\u003c/h3>\n\u003cblockquote>\n\u003cp>加强与AI用户的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 AI users 是公司要联系的对象，末段的 museums and artists 同样位于合作关系的另一端，因此回到 AI companies 所在的分句，比较对象具体是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 museums and artists 明确点出博物馆与艺术家；C的 AI users 则改为模型使用者。博物馆、艺术家在这里以作品相关方的身份出现，不能因为他们也可能使用工具，就把这条合作建议概括成加强用户关系。\u003c/p>\n\u003cp>对象不是一个宽泛标签下随意可换的身份；Ortiz专门点出的作品相关方被C换成了使用模型的用户。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司加强与AI用户的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 AI users 是公司要联系的对象，末段的 museums and artists 同样位于合作关系的另一端，因此回到 AI companies 所在的分句，比较对象具体是谁。\u003c/p>\n\u003cp>原文的 museums and artists 明确点出博物馆与艺术家；C的 AI users 则改为模型使用者。博物馆、艺术家在这里以作品相关方的身份出现，不能因为他们也可能使用工具，就把这条合作建议概括成加强用户关系。\u003c/p>\n\u003cp>对象不是一个宽泛标签下随意可换的身份；Ortiz专门点出的作品相关方被C换成了使用模型的用户。\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003cp>原文列出的伙伴是museums and artists，目的是妥善使用训练作品。将其替换成用户，无法解决作品创作者的许可及利益关切。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写艺术行业组织行动并提出训练材料和合作建议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>AI companies should strengthen partnerships with the users of their generators.\u003c/p>\n\u003cp>AI公司应该加强与生成器用户的合作关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文列出的伙伴是museums and artists，目的是妥善使用训练作品。将其替换成用户，无法解决作品创作者的许可及利益关切。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家会提出应对办法，不能把各方行动混给同一主体；题干限定AI公司，应从结尾逐项确认公司被建议改变什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>strengthen their relationships with AI users\u003cbr>加强与AI用户的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>对象不是一个宽泛标签下随意可换的身份；Ortiz专门点出的作品相关方被C换成了使用模型的用户。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\u003c/p>\n\u003cp>本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. adopt a different strategy for AI model training\u003c/h3>\n\u003cblockquote>\n\u003cp>采取不同的AI模型训练策略\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 a different strategy 指训练策略的改变，末段 trained on images in the public domain 提供的正是一种训练用图像的选择，因此回看这个建议，并与第3段已读的网络抓图方式比较。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>末段的 trained on images in the public domain 指定公共领域图像作为训练材料；第3段原来的方法是抓取网上图像且常常未经许可。D的 a different strategy 不是随意声称“换一种方式”，而是由随意抓取转向选择公共领域材料，并考虑与作品相关方合作。两段合在一起，不同的是模型训练所用图像及取得图像的安排。\u003c/p>\n\u003cp>原先怎样得到图像和现在建议怎样选图像都已写出，D概括了建议实际改变的训练做法。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯建议AI公司采取不同的AI模型训练策略。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 a different strategy 指训练策略的改变，末段 trained on images in the public domain 提供的正是一种训练用图像的选择，因此回看这个建议，并与第3段已读的网络抓图方式比较。\u003c/p>\n\u003cp>末段的 trained on images in the public domain 指定公共领域图像作为训练材料；第3段原来的方法是抓取网上图像且常常未经许可。D的 a different strategy 不是随意声称“换一种方式”，而是由随意抓取转向选择公共领域材料，并考虑与作品相关方合作。两段合在一起，不同的是模型训练所用图像及取得图像的安排。\u003c/p>\n\u003cp>原先怎样得到图像和现在建议怎样选图像都已写出，D概括了建议实际改变的训练做法。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003cp>她一面与艺术家组织共同争取政策改变，一面向公司提出建议：使用公共领域作品训练，并与博物馆、艺术家建立合作。主体不同，行动也必须分开。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写艺术行业组织行动并提出训练材料和合作建议。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>AI firms should change their training approach by using public-domain work and agreed partnerships.\u003c/p>\n\u003cp>AI公司应使用公共领域作品并通过协商合作来调整训练方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>两项具体建议都作用于训练材料来源和取得方式，different strategy正好统摄它们。它不是要求停止所有AI开发，而是给出回应艺术家关切的操作方向。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家会提出应对办法，不能把各方行动混给同一主体；题干限定AI公司，应从结尾逐项确认公司被建议改变什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>adopt a different strategy for AI model training\u003cbr>采取不同的AI模型训练策略\u003c/p>\n\u003c/blockquote>\n\u003cp>原先怎样得到图像和现在建议怎样选图像都已写出，D概括了建议实际改变的训练做法。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写艺术行业组织行动并提出训练材料和合作建议。\u003c/p>\n\u003cp>本项最终仍要根据“trained on images in the public domain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>34题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>34. D. adopt a different strategy for AI model training\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：推动政策是艺术家联盟的行动，不是对AI公司的同一项建议。\u003c/p>\n\u003cp>B：博物馆是素材合作伙伴，不是原文所称的AI服务客户。\u003c/p>\n\u003cp>C：建议的伙伴是博物馆和艺术家，不是生成器用户。\u003c/p>\n\u003cp>D：公共领域作品与协商合作共同改变训练材料的取得策略。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：艺术家在AI时代的意外走红\u003c/strong>（段落1-2背景介绍） 鲁特科夫斯基背景：波兰数字艺术家（古典风格+奇幻风景+游戏插画）→ 在AI生成世界突然走红 → 具体表现：【他的风格成为Stable Diffusion最常用提示词之一 → 用户输入带他名字的提示词就能生成类似风格作品】\u003c/p>\n\u003cp>↓（问题揭示）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：AI生成器的版权问题\u003c/strong>（段落3核心问题） 问题根源：开源程序通过抓取网络图像建立（经常未经许可+无适当署名）→ 引发的问题：伦理和版权的棘手问题 → 艺术家态度：已经受够了\u003c/p>\n\u003cp>↓（具体影响）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：鲁特科夫斯基的个人经历\u003c/strong>（段落4-5具体案例） 数据：名字被用作提示词93,000次 → 态度转变：【最初：惊讶但认为可接触新受众 → 后来：搜索发现带他名字但非他创作的作品】→ 担忧：&quot;一年后可能找不到自己的作品（互联网将充斥AI艺术）&quot;\u003c/p>\n\u003cp>→（扩展到其他艺术家）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：艺术家群体的反击行动\u003c/strong>（段落6-7集体响应） 其他艺术家反应：同样惊讶+开始反击 → 代表人物：卡拉·奥尔蒂斯（发现作品在数据集中→提高版权意识）→ 两层担忧：【经济层面：失去收入（AI图像用于商业）+ 个人层面：数据保护和隐私问题（艺术与个人紧密相连）】\u003c/p>\n\u003cp>↓（解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：应对策略和建议\u003c/strong>（段落8未来方向） 组织行动：艺术家行业内联盟形成（早期动员阶段）→ 可能措施：推动新政策或法规 → 具体建议：【AI模型使用公共领域图像训练 + AI公司与博物馆和艺术家建立合作】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：AI艺术生成器在未经许可使用艺术家作品的情况下快速发展，引发了版权、经济利益和个人权益等多重问题，促使艺术家群体组织起来寻求政策和合作层面的解决方案。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Stopping All Forms of Digital Art\u003c/p>\n\u003cp>B. More Is at Stake than an Income\u003c/p>\n\u003cp>C. Turning Individual Objections into Collective Action\u003c/p>\n\u003cp>D. Changing the Sources Used for Training\u003c/p>\n\u003cp>E. Popularity Is Not Permission\u003c/p>\n\u003cp>F. Teaching Artists to Use Every New Tool\u003c/p>\n\u003cp>G. When a Name Points to Someone Else’s Image\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>An artist’s name can become a popular instruction for an image generator without the artist choosing to take part. Users may request a style because they admire its effects, and the system may respond with a convincing imitation. Neither fact shows that the creator agreed to the use of the work behind that response. Approval from an audience and permission from a source are different relationships. Confusing them makes an ethical question disappear inside a story about popularity. The more frequently a name is requested, the more important it becomes to ask how the underlying material entered the system.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>At first, seeing one’s name spread across the internet may look like free publicity. That impression can change when a search returns pictures bearing the name but made by somebody else with a generator. The artist is no longer simply gaining an audience for existing work. The connection between the name and the work is becoming uncertain. If the results multiply, genuine illustrations may be harder to find among the imitations. The concern is therefore not just whether a generated image looks impressive, but whether viewers can still tell what the named person actually created.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Artists may worry that inexpensive generated images will compete with commissioned work. Yet reducing the dispute to earnings misses a second concern. A recognizable style can be closely tied to a person’s career and public identity. Seeing that style attached to unfamiliar scenes may feel different from losing one particular sale. The artist may ask how to explain which images reflect their own choices and which do not. Financial and personal interests can therefore overlap without being identical. A response that discusses only payment may leave the question of identity unresolved.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>An isolated complaint can be easy for a large technology company to overlook. When artists compare experiences, however, repeated problems become harder to describe as one person’s misunderstanding. A group can collect examples, formulate shared requests and seek a discussion with institutions that shape industry practice. Cooperation does not require every member to object to technology for the same reason. Some may focus on income, others on attribution or control of their work. What joins them is an effort to turn separate experiences into questions that companies and public bodies can be asked to answer.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>A proposal for different training material need not be a demand to end image generation. A company could build a model around works whose use has been agreed with artists or institutions, and around suitable public-domain collections. Such choices would change how material is obtained before a user enters a prompt. They would not merely add a reassuring notice after an image appears. The proposal moves the discussion from whether a tool is exciting to whether its foundations are acceptable to the people whose work makes it possible. Cooperation at the source becomes part of the design.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】E. Popularity Is Not Permission\u003c/p>\n\u003cblockquote>\n\u003cp>受欢迎不等于许可\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分用户欣赏风格与创作者许可材料使用，说明热度不能替代授权关系。\u003c/p>\n\u003cp>首先明确受欢迎是谁的选择：\u003c/p>\n\u003cblockquote>\n\u003cp>without the artist choosing to take part\u003c/p>\n\u003c/blockquote>\n\u003cp>是用户把艺术家名字用作指令，艺术家本人未必选择参与。热度不能自动变成主动合作的证据。\u003c/p>\n\u003cp>然后把两种关系直接拆开：\u003c/p>\n\u003cblockquote>\n\u003cp>Approval from an audience and permission from a source\u003c/p>\n\u003c/blockquote>\n\u003cp>观众喜欢效果，与作品来源方允许使用，主体及行为都不同。前者不能替后者作决定。\u003c/p>\n\u003cp>结尾把注意力由热度转向什么：\u003c/p>\n\u003cblockquote>\n\u003cp>how the underlying material entered the system\u003c/p>\n\u003c/blockquote>\n\u003cp>调用越多，越需要追问背后训练材料怎样进入系统。文章并非只庆祝走红，而是由走红引出许可问题。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>艺术家名字被用户频繁调用 → 受欢迎可能并非自愿参与 → 观众欣赏与来源许可不同 → 热度使训练材料来源更值得追问\u003c/p>\n\u003c/blockquote>\n\u003cp>Popularity对应popular instruction与frequently requested；Permission对应creator agreed以及材料来源。Is Not保留两个主体关系的区分，准确概括从表面欢迎转向授权疑问的推进。\u003c/p>\n\u003cp>再看最强干扰项F：Teaching Artists to Use Every New Tool。\u003c/p>\n\u003cp>教艺术家使用工具假定艺术家需要学会操作，段中却只写用户用名字发出请求。without the artist choosing to take part已明确艺术家未必是使用者，全文焦点是许可而不是操作技能。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】G. When a Name Points to Someone Else’s Image\u003c/p>\n\u003cblockquote>\n\u003cp>名字指向他人图像时\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分追踪免费曝光预期如何因搜索发现署名错配转为原作可见性与归属担忧。\u003c/p>\n\u003cp>先看最初的正面期待是什么：\u003c/p>\n\u003cblockquote>\n\u003cp>may look like free publicity\u003c/p>\n\u003c/blockquote>\n\u003cp>名字传播一开始可能被看成免费曝光，may与look like都只是初步认识，后面马上写搜索怎样使它改变。\u003c/p>\n\u003cp>搜索真正带来的错配是什么：\u003c/p>\n\u003cblockquote>\n\u003cp>pictures bearing the name but made by somebody else\u003c/p>\n\u003c/blockquote>\n\u003cp>同一个名字被挂到其他人借生成器制作的图像上，名字与真实创作来源不再一致，而非艺术家原作简单增加受众。\u003c/p>\n\u003cp>结尾把担忧落到观看者的哪种能力：\u003c/p>\n\u003cblockquote>\n\u003cp>tell what the named person actually created\u003c/p>\n\u003c/blockquote>\n\u003cp>问题是还能不能分清署名者实际创作了什么。生成量继续增加会使真作更难找到，因此重点在归属与可见性。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>起初期待免费曝光 → 搜索发现别人生成的图挂着自己名字 → 名字与作品关系模糊 → 真作可能被淹没、归属难以辨别\u003c/p>\n\u003c/blockquote>\n\u003cp>a Name对应bearing the name和named person；Someone Else’s Image对应made by somebody else。When抓住造成态度变化的具体搜索遭遇，同时覆盖其后归属与发现原作的担忧。\u003c/p>\n\u003cp>再看最强干扰项E：Popularity Is Not Permission。\u003c/p>\n\u003cp>受欢迎不等于许可是相关背景，但本段没有追查训练作品是否同意被用。这里的中心是输出图像的署名错配与搜索结果挤压真作，用许可标题会漏掉最具体的发现和后果。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】B. More Is at Stake than an Income\u003c/p>\n\u003cblockquote>\n\u003cp>涉及的不只是收入\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分先承认委托收入的竞争，再说明风格与个人身份使争议超出金钱。\u003c/p>\n\u003cp>先承认争议中的经济部分：\u003c/p>\n\u003cblockquote>\n\u003cp>compete with commissioned work\u003c/p>\n\u003c/blockquote>\n\u003cp>廉价生成图像可能与委托创作竞争，收入顾虑确实存在，作者没有否定它。\u003c/p>\n\u003cp>Yet之后增加了哪个层面：\u003c/p>\n\u003cblockquote>\n\u003cp>closely tied to a person’s career and public identity\u003c/p>\n\u003c/blockquote>\n\u003cp>风格还联系职业经历与公众身份，所以出现在陌生场景时，问题不只是少一笔交易。\u003c/p>\n\u003cp>最后说明只谈钱会漏掉什么：\u003c/p>\n\u003cblockquote>\n\u003cp>leave the question of identity unresolved\u003c/p>\n\u003c/blockquote>\n\u003cp>即使讨论支付，也未说明哪些图反映艺术家自己的选择。收入与身份可相互关联，却不能因此被当成同一个问题。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>生成图像可能竞争委托工作 → 风格还联系个人职业身份 → 陌生图像未必代表本人选择 → 金钱回应不能自动解决身份问题\u003c/p>\n\u003c/blockquote>\n\u003cp>Income对应earnings、sale与payment；More Is at Stake对应second concern及public identity。标题保留先承认经济风险、再增加个人层面的转折，而不是将两者排成互不相关的争议。\u003c/p>\n\u003cp>再看最强干扰项G：When a Name Points to Someone Else’s Image。\u003c/p>\n\u003cp>名字错配可以引起个人困扰，但本段并未叙述在线搜索或谁给图像挂名。作者在比较经济利益与个人身份两类关切；只写名字指错作品，会把这个更广的二层分析缩成单一经历。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】C. Turning Individual Objections into Collective Action\u003c/p>\n\u003cblockquote>\n\u003cp>把个人异议转为集体行动\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分说明艺术家怎样把重复的个人遭遇整理成共同诉求，以及不同动机如何支持同一行动。\u003c/p>\n\u003cp>开头为什么将单独投诉与合作相对：\u003c/p>\n\u003cblockquote>\n\u003cp>repeated problems become harder to describe as one person’s misunderstanding\u003c/p>\n\u003c/blockquote>\n\u003cp>比对经历后问题具有重复性，便不能轻易解释成一人的误会。合作因此增加了异议的可见度和说服力。\u003c/p>\n\u003cp>中间列出的共同动作有哪些：\u003c/p>\n\u003cblockquote>\n\u003cp>collect examples, formulate shared requests and seek a discussion\u003c/p>\n\u003c/blockquote>\n\u003cp>收集实例、形成共同诉求、寻找制度对话，都把零散抱怨变成可以交给有关机构回应的问题。\u003c/p>\n\u003cp>成员是否必须有完全相同动机：\u003c/p>\n\u003cblockquote>\n\u003cp>does not require every member to object to technology for the same reason\u003c/p>\n\u003c/blockquote>\n\u003cp>收入、署名、控制权可以各有侧重；一致的是组织提问和要求回应的行动，不是统一个人理由。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>个人投诉容易被忽视 → 比对经历显示重复问题 → 收集证据并形成共同请求 → 不同动机可以汇成共同问责行动\u003c/p>\n\u003c/blockquote>\n\u003cp>Individual Objections对应isolated complaint与separate experiences；Collective Action对应group收集、组织和对话。Turning概括从孤立经历到可由公司及公共机构回应的诉求这一变化。\u003c/p>\n\u003cp>再看最强干扰项A：Stopping All Forms of Digital Art。\u003c/p>\n\u003cp>停止全部数字艺术把合作的目标扩大为全面禁绝。段中成员可能只关注署名或收入，且明确不必以同样理由反对技术；共同请求是要求回应具体问题，没有停止所有数字创作的宣言。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】D. Changing the Sources Used for Training\u003c/p>\n\u003cblockquote>\n\u003cp>改变训练材料的来源\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把回应落实到训练材料的来源与协商取得，说明可以改变开发条件而非停止生成。\u003c/p>\n\u003cp>首句先排除何种极端理解：\u003c/p>\n\u003cblockquote>\n\u003cp>need not be a demand to end image generation\u003c/p>\n\u003c/blockquote>\n\u003cp>提出换训练材料不必意味着停止生成，下一句给出可以继续建模的材料与合作方式。\u003c/p>\n\u003cp>改变发生在生成流程的哪个时点：\u003c/p>\n\u003cblockquote>\n\u003cp>before a user enters a prompt\u003c/p>\n\u003c/blockquote>\n\u003cp>与艺术家或机构协商、使用合适公共领域资料，都在训练材料取得阶段起作用，而非输出后加一句安抚说明。\u003c/p>\n\u003cp>末句用什么概括方案原则：\u003c/p>\n\u003cblockquote>\n\u003cp>Cooperation at the source becomes part of the design\u003c/p>\n\u003c/blockquote>\n\u003cp>source强调材料源头，design表示将合作嵌入系统形成过程。重点不是工具够不够新奇，而是依赖的作品如何正当地进入。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>改变材料不等于停止生成 → 提出协商作品与公共领域资料 → 在提示输入前改变素材取得 → 将源头合作纳入设计\u003c/p>\n\u003c/blockquote>\n\u003cp>Sources Used for Training对应different training material及works、collections；Changing对应change how material is obtained。标题覆盖材料选择和合作取得两项，而不缩成输出后署名提醒。\u003c/p>\n\u003cp>再看最强干扰项A：Stopping All Forms of Digital Art。\u003c/p>\n\u003cp>停止所有数字艺术与首句need not…end image generation直接相反，且比停止图像生成还扩大到全部数字创作。作者正在说明继续开发时可改变的材料路线，不是取消创作工具。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>A digital artist may discover that a familiar career has acquired an unfamiliar audience. People who never commissioned a picture can suddenly be using the artist’s name in large numbers. The popularity may initially sound welcome. Understanding the artist’s reaction, however, requires first understanding what those users are actually doing with the name.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Those two concerns show why money alone cannot settle every objection. Lost commissions would affect a livelihood, but an unfamiliar image associated with a recognizable style may also affect personal identity. Artists can therefore ask both who benefits financially and who controls the connection between a person and their work. A useful response must address the way the material enters the system.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>A search may return pictures carrying the artist’s name that the artist never made. Instead of simply drawing attention to genuine work, the growing flow can make authorship harder to identify. An illustrator may then fear that commissioned pieces will disappear beneath imitations. The problem involves both access to an audience and control over how the creator is represented.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>One proposed response changes the sources used for training. Instead of relying on unexamined collections from the web, companies could seek agreed arrangements with artists and institutions and use suitable public-domain material. This approach treats creators as participants in a relationship, not merely as names a user can type. It places cooperation before generation begins.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Their objections are not always obvious from a count of how often a name appears. The same number can look like welcome exposure to a user and an unwelcome appropriation to its owner. To understand the difference, it helps to follow what happens when an artist tries to find their own work in that expanding flow of images.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>The origin of that training material is where a separate problem begins. If images have been gathered online without the creators agreeing to their use, an impressive result does not remove the question of permission. Technical capability and acceptable sourcing must be considered separately. This distinction helps explain why artists can object to a tool that many users admire.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>They are entering it as part of a written prompt for an image generator. Alongside a description of a scene, the name can ask the system for effects resembling a particular style. The resulting picture is newly generated, rather than simply a link to the artist’s existing work. This ability depends on material used earlier in training the model.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That cooperation would not answer every question raised by generated art, but it would change the starting point of the discussion. Artists’ reactions can then be understood as demands about the conditions of development, rather than as proof that creativity and technology must be enemies. The aim is a process whose participants can explain how the work behind it is being used.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从艺术家意外走红提出用户怎样使用其名字的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>区分生计与个人身份关切，将回应转向素材取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>呈现搜索中的署名错配及真作可见性、身份呈现担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>提出通过协商与公共领域材料改变训练来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>指出热度不能解释艺术家反应，转向搜索本人作品的经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由训练材料来源引出许可问题，解释用户喜欢而艺术家反对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明名字作为提示词生成相似风格，并转向训练材料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以源头合作收束，理解艺术家对技术发展条件的要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从艺术家意外走红提出用户怎样使用其名字的问题 → 说明名字作为提示词生成相似风格，并转向训练材料 → 由训练材料来源引出许可问题，解释用户喜欢而艺术家反对 → 指出热度不能解释艺术家反应，转向搜索本人作品的经历 → 呈现搜索中的署名错配及真作可见性、身份呈现担忧 → 区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源 → 以源头合作收束，理解艺术家对技术发展条件的要求\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → G → F → E → C → B → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：G、F、C、B、D。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → G → F的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Understanding the artist’s reaction, however, requires first understanding what those users are actually doing with the name.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>They are entering it as part of a written prompt for an image generator.\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇结尾问用户doing with the name，本段They指users，entering it中的it指name，两个指代同时有明确来源。written prompt直接回答使用方式，而非重复说名字受欢迎。\u003c/p>\n\u003cp>先把名字与场景描述一起作为生成指令，再区分生成新图与链接原作，说明用户得到什么。最后转向used earlier in training的素材，使讨论由输出功能进入模型形成的前提。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This ability depends on material used earlier in training the model.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The origin of that training material is where a separate problem begins.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段The origin of that training material原词承接，接着问创作者有没有同意。只有先解释模型依赖训练素材，才能把许可争议定位在材料取得，而非误当输出风格不够好。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从艺术家意外走红提出用户怎样使用其名字的问题 → 说明名字作为提示词生成相似风格，并转向训练材料 → 由训练材料来源引出许可问题，解释用户喜欢而艺术家反对\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A search may return pictures carrying the artist’s name that the artist never made.\u003c/p>\n\u003c/blockquote>\n\u003cp>搜索段同样出现名字和图像，却回答艺术家找原作时发现什么。开篇问的是用户怎样把名字交给工具，搜索结果不能代替提示词机制；它的末尾也没有为后段that training material提供训练来源。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成G → F → E的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This ability depends on material used earlier in training the model.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The origin of that training material is where a separate problem begins.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后说生成能力依赖earlier in training使用的材料，本段that training material准确回接，origin把问题限定为素材从哪里、以什么方式进入。随后without…agreeing具体提出许可缺失。\u003c/p>\n\u003cp>即便输出impressive，也不消除permission疑问，作者因此把技术能力与acceptable sourcing分开。末句用这项区分解释用户赞赏与艺术家异议为什么能同时存在。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This distinction helps explain why artists can object to a tool that many users admire.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Their objections are not always obvious from a count of how often a name appears.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段Their objections承接artists can object，再说调用次数看不出这些异议。先给异议的理由，再解释热度为何不足以刻画反应，避免将受欢迎和同意使用合并。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明名字作为提示词生成相似风格，并转向训练材料 → 由训练材料来源引出许可问题，解释用户喜欢而艺术家反对 → 指出热度不能解释艺术家反应，转向搜索本人作品的经历\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One proposed response changes the sources used for training.\u003c/p>\n\u003c/blockquote>\n\u003cp>提出训练来源改革的段落也有sources，但One proposed response需要前面已经建立问题及要回应的利益。本处尚在解释机制；直接给方案会跳过许可争议，并使已知后段Their objections缺少刚引出的艺术家异议。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → C → B的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand the difference, it helps to follow what happens when an artist tries to find their own work in that expanding flow of images.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A search may return pictures carrying the artist’s name that the artist never made.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段结尾让读者跟随艺术家find their own work的行动，本段A search立即给出所见：名字还在，图却不是本人画的。它将welcome exposure与unwelcome appropriation的差别落实到具体结果。\u003c/p>\n\u003cp>不是原作得到更多注意，而是authorship更难辨认，甚至委托作品可能被仿制图淹没。段尾再将担忧分成access to an audience与control over representation，为下一段的两类关切建立明确成分。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The problem involves both access to an audience and control over how the creator is represented.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those two concerns show why money alone cannot settle every objection.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Those two concerns回指这两项，一项沿受众通向委托生计，另一项沿形象呈现通向个人身份。两段由搜索经历推进到利益分析，不是只重复“艺术家担心”。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出热度不能解释艺术家反应，转向搜索本人作品的经历 → 呈现搜索中的署名错配及真作可见性、身份呈现担忧 → 区分生计与个人身份关切，将回应转向素材取得\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those two concerns show why money alone cannot settle every objection.\u003c/p>\n\u003c/blockquote>\n\u003cp>Those two concerns段本身需要前段已有两个可区分的关切。已知段只有热度与异议的视角差异，还未呈现原作可见性与形象控制；直接放它会让two找不到对应的两项，并跳过受邀跟随的搜索经历。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成C → B → D的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The problem involves both access to an audience and control over how the creator is represented.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those two concerns show why money alone cannot settle every objection.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末句并列受众接触与创作者呈现控制，本段Those two concerns保留二分，并用money alone cannot settle说明为什么不能全部折成报酬。它不是否认经济风险，而是增加个人层面。\u003c/p>\n\u003cp>Lost commissions落实生计，unfamiliar image associated with style落实身份；随后who benefits与who controls把两项诉求分别说出。末句要求回应材料怎样进入系统，将利益问题导向下一步操作。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A useful response must address the way the material enters the system.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One proposed response changes the sources used for training.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段One proposed response回答刚提出的A useful response，changes the sources used for training具体落实material enters的环节。先明确为何需要改变，再列可协商来源，建议有针对对象。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>呈现搜索中的署名错配及真作可见性、身份呈现担忧 → 区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The origin of that training material is where a separate problem begins.\u003c/p>\n\u003c/blockquote>\n\u003cp>origin段也谈素材进入，但它的功能是首次解释许可争议与艺术家反对，结尾引出objections。当前位置需要承接已列出的两类后果并为回应方案铺路；倒退重讲起因会失去two concerns的展开。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成B → D → H的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A useful response must address the way the material enters the system.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One proposed response changes the sources used for training.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后要求回应how the material enters the system，本段One proposed response以changes the sources直接接住这一任务。它回答的是材料取得方式，不是教用户换一种提示词。\u003c/p>\n\u003cp>协商艺术家与机构、使用合适公共领域资料是两种可考虑路线；后面把创作者视为关系参与者，与仅作可输入名字对照。段尾将cooperation明确放在生成开始之前。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>It places cooperation before generation begins.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That cooperation would not answer every question raised by generated art, but it would change the starting point of the discussion.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That cooperation回指源头合作，同时用not every question限定方案作用。先有可执行的合作方向，末段才有条件讨论它怎样改变技术发展争论的起点。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>区分生计与个人身份关切，将回应转向素材取得 → 提出通过协商与公共领域材料改变训练来源 → 以源头合作收束，理解艺术家对技术发展条件的要求\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>They are entering it as part of a written prompt for an image generator.\u003c/p>\n\u003c/blockquote>\n\u003cp>提示词段末尾虽然出现training material，但只是解释模型能力依赖什么，没有形成任何cooperation。若放在此处，已知末段的That cooperation无先行安排，还会让全文在提出回应后退回工具使用说明。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>respect for creative work\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>尊重创作劳动\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible innovation\u003c/td>\n\u003ctd>负责任的创新\u003c/td>\n\u003ctd>经济消费类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>artistic creativity\u003c/td>\n\u003ctd>艺术创造力\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation with creators\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>与创作者合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a sustainable creative livelihood\u003c/td>\n\u003ctd>可持续的创作生计\u003c/td>\n\u003ctd>经济消费类：经济收入\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>clear attribution\u003c/td>\n\u003ctd>明确署名\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>public awareness of creative rights\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>对创作权益的公众认识\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育文化类：文化交流\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>informed choices about technology\u003c/td>\n\u003ctd>对技术作出知情选择\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constructive responses to change\u003c/td>\n\u003ctd>建设性地应对变化\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A responding to an unexpected use of X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A应对X被意外使用的情况。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, a name is attached to work that its owner did not create.\u003c/td>\n\u003ctd>图中一个名字被放在并非本人创作的作品上。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast highlights a tension between technical capability and creative interests.\u003c/td>\n\u003ctd>这一对比凸显技术能力与创作利益之间的张力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X has become one of the most frequently used forms of Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X已成为最常用的Y形式之一。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The number of X has increased far beyond that of Y.\u003c/td>\n\u003ctd>X的数量增长到远超Y的水平。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate a rapid expansion in the use of X.\u003c/td>\n\u003ctd>数据表明X的使用快速扩大。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The text follows an artist’s response from initial interest to growing concern.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章追踪一位艺术家从最初感兴趣到越来越担忧的反应。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage discusses how X may affect both livelihoods and personal identity.\u003c/td>\n\u003ctd>文章讨论X可能如何同时影响生计与个人身份。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns how to develop X through cooperation with those affected.\u003c/td>\n\u003ctd>问题涉及如何与受影响的人合作来发展X。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";

const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{

 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
