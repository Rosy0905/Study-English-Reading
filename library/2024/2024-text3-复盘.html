u003ctd>privacy problem\u003c/td>\n\u003ctd>n.隐私问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第8段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>coalition\u003c/td>\n\u003ctd>n.联盟\u003c/td>\n\u003ctd>industry\u003c/td>\n\u003ctd>n.行业\u003c/td>\n\u003ctd>figure out\u003c/td>\n\u003ctd>phr.弄清；想出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tackle\u003c/td>\n\u003ctd>v.处理；应对\u003c/td>\n\u003ctd>mitigate\u003c/td>\n\u003ctd>v.缓解\u003c/td>\n\u003ctd>in its early days\u003c/td>\n\u003ctd>phr.处于初期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mobilization\u003c/td>\n\u003ctd>n.动员\u003c/td>\n\u003ctd>involve\u003c/td>\n\u003ctd>v.涉及；包括\u003c/td>\n\u003ctd>push for\u003c/td>\n\u003ctd>phr.推动；争取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>policy\u003c/td>\n\u003ctd>n.政策\u003c/td>\n\u003ctd>regulation\u003c/td>\n\u003ctd>n.监管；规定\u003c/td>\n\u003ctd>suggestion\u003c/td>\n\u003ctd>n.建议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI model\u003c/td>\n\u003ctd>n.AI模型\u003c/td>\n\u003ctd>train\u003c/td>\n\u003ctd>v.训练\u003c/td>\n\u003ctd>public domain\u003c/td>\n\u003ctd>n.公有领域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>forge partnerships\u003c/td>\n\u003ctd>phr.建立合作关系\u003c/td>\n\u003ctd>museum\u003c/td>\n\u003ctd>n.博物馆\u003c/td>\n\u003ctd>artist\u003c/td>\n\u003ctd>n.艺术家\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering. And he&#39;s become a sudden hit in the new world of text-to-image AI generation.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>A Polish digital artist / who uses classical painting styles / to create dreamy fantasy landscapes, / Greg Rutkowski has made illustrations / for games / such as Dungeons &amp; Dragons and Magic: The Gathering.\u003c/p>\n\u003cp>And he&#39;s become a sudden hit / in the new world / of text-to-image AI generation.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>一位波兰数字艺术家 / 使用古典绘画风格 / 创作梦幻奇幻风景画，/ 格雷格·鲁特科夫斯基已经创作了插画 / 为游戏 / 比如《龙与地下城》和《万智牌》。\u003c/p>\n\u003cp>并且他已成为突然的热门 / 在新世界中 / 文本到图像AI生成的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>格雷格·鲁特科夫斯基是一位波兰数字艺术家，他运用古典绘画风格创作梦幻奇幻风景画，曾为《龙与地下城》和《万智牌》等游戏创作插画。他在文本转图像AI生成的新世界中突然走红。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>His distinctive style / is now one of the most commonly used prompts / in the new open-source AI art generator / Stable Diffusion.\u003c/p>\n\u003cp>The tool, / along with other popular image-generation AI models, / allows anyone / to create impressive images / based on text prompts.\u003c/p>\n\u003cp>For example, / type in / &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; / and the system will produce something / that looks not a million miles away / from works in Rutkowski&#39;s style.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>他独特的风格 / 现在是最常用的提示词之一 / 在新的开源AI艺术生成器中 / Stable Diffusion。\u003c/p>\n\u003cp>这个工具，/ 与其他流行的图像生成AI模型一起，/ 允许任何人 / 创建令人印象深刻的图像 / 基于文本提示。\u003c/p>\n\u003cp>例如，/ 输入 / &quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot;，/ 系统将生成某些东西 / 看起来相差不远 / 从鲁特科夫斯基风格的作品。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>他独特的风格现在是开源AI艺术生成器Stable Diffusion中最常用的提示词之一。这个工具和其他流行的图像生成AI模型一样，允许任何人基于文本提示创建令人印象深刻的图像。例如，输入&quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot;，系统就会生成与鲁特科夫斯基风格非常相似的作品。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>But these open-source programs / are built by scraping images / from the Internet, / often without permission / and proper attribution to artists.\u003c/p>\n\u003cp>As a result, / they are raising tricky questions / about ethics and copyright.\u003c/p>\n\u003cp>And artists like Rutkowski / have had enough.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>但这些开源程序 / 是通过抓取图像建立的 / 从互联网上，/ 经常没有许可 / 和对艺术家的适当署名。\u003c/p>\n\u003cp>因此，/ 它们正在引发棘手的问题 / 关于伦理和版权。\u003c/p>\n\u003cp>而像鲁特科夫斯基这样的艺术家 / 已经受够了。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>但这些开源程序是通过从互联网抓取图像建立的，经常未经许可且没有对艺术家进行适当署名。因此，它们引发了关于伦理和版权的棘手问题。像鲁特科夫斯基这样的艺术家已经受够了。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, which tracks over 10 million Stable Diffusion images and prompts, Rutkowski&#39;s name has been used as a prompt around 93,000 times. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn&#39;t his.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>According to the website Lexica, / which tracks over 10 million Stable Diffusion images and prompts, / Rutkowski&#39;s name / has been used as a prompt / around 93,000 times.\u003c/p>\n\u003cp>Rutkowski was initially surprised / but thought it might be / a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name / to see if a piece he had worked on / had been published.\u003c/p>\n\u003cp>The online search brought back work / that had his name attached to it / but wasn&#39;t his.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>根据网站Lexica，/ 追踪超过1000万Stable Diffusion图像和提示词的，/ 鲁特科夫斯基的名字 / 已被用作提示词 / 大约93,000次。\u003c/p>\n\u003cp>鲁特科夫斯基最初很惊讶 / 但认为这可能是 / 接触新受众的好方法。\u003c/p>\n\u003cp>然后他尝试搜索他的名字 / 看看他创作的作品 / 是否已经发布。\u003c/p>\n\u003cp>在线搜索返回了作品 / 附有他的名字 / 但不是他的。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>根据追踪超过1000万Stable Diffusion图像和提示词的网站Lexica，鲁特科夫斯基的名字已被用作提示词约93,000次。鲁特科夫斯基最初很惊讶，但认为这可能是接触新受众的好方法。然后他尝试搜索自己的名字，看看他创作的作品是否已经发布。在线搜索返回了带有他名字的作品，但这些作品并非出自他手。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>&quot;It&#39;s been just a month. What about in a year? I probably won&#39;t be able to find my work out there because the Internet will be flooded with AI art,&quot; Rutkowski said. &quot;That&#39;s concerning.&quot;\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>&quot;It&#39;s been just a month. / What about in a year? / I probably won&#39;t be able to find my work out there / because the Internet will be flooded with AI art,&quot; / Rutkowski said.\u003c/p>\n\u003cp>&quot;That&#39;s concerning.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>&quot;才过了一个月。/ 一年后会怎样？/ 我可能无法在那里找到我的作品 / 因为互联网将充斥着AI艺术，&quot; / 鲁特科夫斯基说。\u003c/p>\n\u003cp>&quot;这令人担忧。&quot;\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>&quot;才过了一个月。一年后会怎样？我可能无法在网上找到我的作品了，因为互联网将充斥着AI艺术，&quot;鲁特科夫斯基说。&quot;这令人担忧。&quot;\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Other artists besides Rutkowski have been surprised by the apparent popularity of their work in text-to-image generators — and some are now fighting back. Karla Ortiz, an illustrator based in San Francisco who found her work in Stable Diffusion&#39;s data set, has been raising awareness about the issues around AI art and copyright.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Other artists besides Rutkowski / have been surprised / by the apparent popularity of their work / in text-to-image generators — / and some are now fighting back.\u003c/p>\n\u003cp>Karla Ortiz, / an illustrator based in San Francisco / who found her work / in Stable Diffusion&#39;s data set, / has been raising awareness / about the issues around AI art and copyright.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>除了鲁特科夫斯基之外的其他艺术家 / 已经感到惊讶 / 对他们作品的明显受欢迎程度 / 在文本到图像生成器中 — / 而一些人现在正在反击。\u003c/p>\n\u003cp>卡拉·奥尔蒂斯，/ 一位旧金山的插画家 / 发现了她的作品 / 在Stable Diffusion的数据集中，/ 一直在提高认识 / 关于AI艺术和版权问题。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>除了鲁特科夫斯基，其他艺术家也对他们的作品在文本转图像生成器中的明显受欢迎程度感到惊讶——一些人现在正在反击。旧金山插画家卡拉·奥尔蒂斯在Stable Diffusion的数据集中发现了自己的作品，她一直在提高人们对AI艺术和版权问题的认识。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>Artists say they risk losing income as people start using AI-generated images based on copyrighted material for commercial purposes. But it&#39;s also a lot more personal, Ortiz says, arguing that because art is so closely linked to a person, it could raise data protection and privacy problems.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>Artists say / they risk losing income / as people start using AI-generated images / based on copyrighted material / for commercial purposes.\u003c/p>\n\u003cp>But it&#39;s also a lot more personal, / Ortiz says, / arguing that because art is so closely linked to a person, / it could raise data protection and privacy problems.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>艺术家们说 / 他们面临失去收入的风险 / 当人们开始使用AI生成的图像 / 基于受版权保护的材料 / 用于商业目的。\u003c/p>\n\u003cp>但这也更加个人化，/ 奥尔蒂斯说，/ 认为因为艺术与个人如此紧密相连，/ 它可能引发数据保护和隐私问题。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>艺术家们表示，当人们开始将基于受版权保护材料的AI生成图像用于商业目的时，他们面临失去收入的风险。但奥尔蒂斯说，这也涉及更多个人层面的问题，她认为由于艺术与个人如此紧密相连，可能会引发数据保护和隐私问题。\u003c/p>\n\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>&quot;There is a coalition growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz. The group is in its early days of mobilization, which could involve pushing for new policies or regulation. One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.\u003c/p>\n\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>&quot;There is a coalition growing / within artist industries / to figure out how to tackle or mitigate this,&quot; / says Ortiz.\u003c/p>\n\u003cp>The group is in its early days of mobilization, / which could involve / pushing for new policies or regulation.\u003c/p>\n\u003cp>One suggestion is that / AI models could be trained / on images in the public domain, / and AI companies could forge partnerships / with museums and artists, / Ortiz says.\u003c/p>\n\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>&quot;有一个联盟正在形成 / 在艺术家行业内 / 来弄清楚如何解决或缓解这个问题，&quot; / 奥尔蒂斯说。\u003c/p>\n\u003cp>该团体处于动员的早期阶段，/ 这可能涉及 / 推动新政策或法规。\u003c/p>\n\u003cp>一个建议是 / AI模型可以被训练 / 使用公共领域的图像，/ 并且AI公司可以建立合作关系 / 与博物馆和艺术家，/ 奥尔蒂斯说。\u003c/p>\n\u003ch3>标准译文 · 第8段\u003c/h3>\n\u003cp>&quot;艺术家行业内正在形成一个联盟，来弄清楚如何解决或缓解这个问题，&quot;奥尔蒂斯说。该团体处于动员的早期阶段，可能会推动新政策或法规的制定。奥尔蒂斯说，一个建议是AI模型可以使用公共领域的图像进行训练，AI公司可以与博物馆和艺术家建立合作关系。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>A Polish digital artist：(who uses classical painting styles：(to create dreamy fantasy landscapes)) → Greg Rutkowski has made illustrations：(for games：(such as Dungeons &amp; Dragons and Magic: The Gathering)).\u003c/p>\n\u003cp>And he&#39;s become a sudden hit：(in the new world：(of text-to-image AI generation)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>His distinctive style → is now one of the most commonly used prompts：(in the new open-source AI art generator：(Stable Diffusion)).\u003c/p>\n\u003cp>The tool：(along with other popular image-generation AI models) → allows anyone → to create impressive images：(based on text prompts).\u003c/p>\n\u003cp>For example → type in：&quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski&quot; → and the system will produce something：(that looks not a million miles away：(from works in Rutkowski&#39;s style)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>But these open-source programs → are built by scraping images：(from the Internet)：(often without permission + proper attribution to artists).\u003c/p>\n\u003cp>As a result → they are raising tricky questions：(about ethics and copyright).\u003c/p>\n\u003cp>And artists like Rutkowski → have had enough.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>According to the website Lexica：(which tracks over 10 million Stable Diffusion images and prompts) → Rutkowski&#39;s name → has been used as a prompt：(around 93,000 times).\u003c/p>\n\u003cp>Rutkowski was initially surprised // but thought it might be：(a good way to reach new audiences).\u003c/p>\n\u003cp>Then he tried searching for his name：(to see if a piece he had worked on → had been published).\u003c/p>\n\u003cp>The online search brought back work：(that had his name attached to it // but wasn&#39;t his).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>&quot;It&#39;s been just a month. → What about in a year? → I probably won&#39;t be able to find my work out there：(because the Internet will be flooded with AI art)&quot; → Rutkowski said.\u003c/p>\n\u003cp>&quot;That&#39;s concerning.&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Other artists besides Rutkowski → have been surprised：(by the apparent popularity of their work：(in text-to-image generators)) — and some are now fighting back.\u003c/p>\n\u003cp>Karla Ortiz：(an illustrator based in San Francisco：(who found her work：(in Stable Diffusion&#39;s data set))) → has been raising awareness：(about the issues around AI art and copyright).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Artists say → they risk losing income：(as people start using AI-generated images：(based on copyrighted material)：(for commercial purposes)).\u003c/p>\n\u003cp>But it&#39;s also a lot more personal → Ortiz says → arguing：(that because art is so closely linked to a person → it could raise data protection and privacy problems).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>&quot;There is a coalition growing：(within artist industries)：(to figure out how to tackle or mitigate this)&quot; → says Ortiz.\u003c/p>\n\u003cp>The group is in its early days of mobilization：(which could involve：(pushing for new policies or regulation)).\u003c/p>\n\u003cp>One suggestion is：(that AI models could be trained：(on images in the public domain)) + (AI companies could forge partnerships：(with museums and artists)) → Ortiz says.\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>一位波兰数字艺术家：(使用古典绘画风格：(创作梦幻奇幻风景画)) → 格雷格·鲁特科夫斯基已经创作了插画：(为游戏：(比如《龙与地下城》和《万智牌》))。\u003c/p>\n\u003cp>并且他已成为突然的热门：(在新世界中：(文本到图像AI生成的))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>他独特的风格 → 现在是最常用的提示词之一：(在新的开源AI艺术生成器中：(Stable Diffusion))。\u003c/p>\n\u003cp>这个工具：(与其他流行的图像生成AI模型一起) → 允许任何人 → 创建令人印象深刻的图像：(基于文本提示)。\u003c/p>\n\u003cp>例如 → 输入：&quot;持剑巫师和发光的魔法火球与凶猛的龙战斗 格雷格·鲁特科夫斯基&quot; → 系统将生成某些东西：(看起来相差不远：(从鲁特科夫斯基风格的作品))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>但这些开源程序 → 是通过抓取图像建立的：(从互联网上)：(经常没有许可 + 对艺术家的适当署名)。\u003c/p>\n\u003cp>因此 → 它们正在引发棘手的问题：(关于伦理和版权)。\u003c/p>\n\u003cp>而像鲁特科夫斯基这样的艺术家 → 已经受够了。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>根据网站Lexica：(追踪超过1000万Stable Diffusion图像和提示词的) → 鲁特科夫斯基的名字 → 已被用作提示词：(大约93,000次)。\u003c/p>\n\u003cp>鲁特科夫斯基最初很惊讶 // 但认为这可能是：(接触新受众的好方法)。\u003c/p>\n\u003cp>然后他尝试搜索他的名字：(看看他创作的作品 → 是否已经发布)。\u003c/p>\n\u003cp>在线搜索返回了作品：(附有他的名字 // 但不是他的)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>&quot;才过了一个月。→ 一年后会怎样？→ 我可能无法在那里找到我的作品：(因为互联网将充斥着AI艺术)&quot; → 鲁特科夫斯基说。\u003c/p>\n\u003cp>&quot;这令人担忧。&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>除了鲁特科夫斯基之外的其他艺术家 → 已经感到惊讶：(对他们作品的明显受欢迎程度：(在文本到图像生成器中)) — 而一些人现在正在反击。\u003c/p>\n\u003cp>卡拉·奥尔蒂斯：(一位旧金山的插画家：(发现了她的作品：(在Stable Diffusion的数据集中))) → 一直在提高认识：(关于AI艺术和版权问题)。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>艺术家们说 → 他们面临失去收入的风险：(当人们开始使用AI生成的图像：(基于受版权保护的材料)：(用于商业目的))。\u003c/p>\n\u003cp>但这也更加个人化 → 奥尔蒂斯说 → 认为：(因为艺术与个人如此紧密相连 → 它可能引发数据保护和隐私问题)。\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>&quot;有一个联盟正在形成：(在艺术家行业内)：(来弄清楚如何解决或缓解这个问题)&quot; → 奥尔蒂斯说。\u003c/p>\n\u003cp>该团体处于动员的早期阶段：(这可能涉及：(推动新政策或法规))。\u003c/p>\n\u003cp>一个建议是：(AI模型可以被训练：(使用公共领域的图像)) + (AI公司可以建立合作关系：(与博物馆和艺术家)) → 奥尔蒂斯说。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>A Polish digital artist / who uses classical painting styles / to create dreamy fantasy landscapes, / Greg Rutkowski has made illustrations / for games / such as Dungeons &amp; Dragons and Magic: The Gathering.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>一位波兰数字艺术家 / 使用古典绘画风格 / 创作梦幻奇幻风景画，/ 格雷格·鲁特科夫斯基已经创作了插画 / 为游戏 / 比如《龙与地下城》和《万智牌》。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把前置身份和创作方式合并：\u003c/p>\n\u003cblockquote>\n\u003cp>作为一名使用古典绘画风格创作梦幻奇景的波兰数字艺术家，格雷格·鲁特科夫斯基\u003c/p>\n\u003c/blockquote>\n\u003cp>再补齐主句中的创作经历：\u003c/p>\n\u003cblockquote>\n\u003cp>曾为《龙与地下城》和《万智牌》等游戏绘制插画\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>作为一名使用古典绘画风格创作梦幻奇景的波兰数字艺术家，格雷格·鲁特科夫斯基；曾为《龙与地下城》和《万智牌》等游戏绘制插画。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>格雷格·鲁特科夫斯基曾为多款游戏绘制插画。\u003c/p>\n\u003c/blockquote>\n\u003cp>句首A Polish digital artist与后面的姓名是同位关系，who只修饰artist；不要把前置身份读成另一个人。such as引出games的例子，Magic中的冒号属于作品名称。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>波兰数字艺术家格雷格·鲁特科夫斯基用古典绘画风格创作梦幻奇景，曾为《龙与地下城》和《万智牌》等游戏绘制插画。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>uses classical painting styles表示借鉴古典绘画风格来创作新作品，不等于把已有古典画作扫描成数字版本。\u003c/p>\n\u003cp>dreamy fantasy landscapes可译为“梦幻奇景”，has made写已经有过的职业经历；末尾游戏名只作例证，不能译成他主要制作游戏程序。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>格雷格·鲁特科夫斯基是一位波兰数字艺术家，他运用古典绘画风格创作梦幻奇幻风景画，曾为《龙与地下城》和《万智牌》等游戏创作插画。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Karla Ortiz, an illustrator based in San Francisco who found her work in Stable Diffusion&#39;s data set, has been raising awareness about the issues around AI art and copyright.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Karla Ortiz, / an illustrator based in San Francisco / who found her work / in Stable Diffusion&#39;s data set, / has been raising awareness / about the issues around AI art and copyright.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>卡拉·奥尔蒂斯，/ 一位旧金山的插画家 / 发现了她的作品 / 在Stable Diffusion的数据集中，/ 一直在提高认识 / 关于AI艺术和版权问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并姓名、职业、所在地和发现：\u003c/p>\n\u003cblockquote>\n\u003cp>卡拉·奥尔蒂斯是一位常驻旧金山的插画家，她发现自己的作品进入了Stable Diffusion的数据集\u003c/p>\n\u003c/blockquote>\n\u003cp>再接上持续采取的行动：\u003c/p>\n\u003cblockquote>\n\u003cp>她一直在提高人们对AI艺术与版权相关问题的认识\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>卡拉·奥尔蒂斯是一位常驻旧金山的插画家，她发现自己的作品进入了Stable Diffusion的数据集；她一直在提高人们对AI艺术与版权相关问题的认识。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>卡拉·奥尔蒂斯一直在唤起人们对AI艺术版权问题的关注。\u003c/p>\n\u003c/blockquote>\n\u003cp>an illustrator是姓名的同位语，based与who先后说明这位艺术家。主干到has been raising awareness才完整，不能把found误当整句最终谓语而漏掉后续行动。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>常驻旧金山的插画家卡拉·奥尔蒂斯发现自己的作品进入了Stable Diffusion的数据集，此后一直在唤起公众对AI艺术与版权问题的关注。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>data set是模型使用的数据集合；found只说明她发现作品在其中，不能凭这一句再补出她主动提交作品。\u003c/p>\n\u003cp>has been raising用“一直在”体现行动持续；awareness是公众对问题的认识，不是她刚开始具有版权意识。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>旧金山插画家卡拉·奥尔蒂斯在Stable Diffusion的数据集中发现了自己的作品，她一直在提高人们对AI艺术和版权问题的认识。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第7段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>But it&#39;s also a lot more personal, Ortiz says, arguing that because art is so closely linked to a person, it could raise data protection and privacy problems.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>But it&#39;s also a lot more personal, / Ortiz says, / arguing that because art is so closely linked to a person, / it could raise data protection and privacy problems.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>但这也更加个人化，/ 奥尔蒂斯说，/ 认为因为艺术与个人如此紧密相连，/ 它可能引发数据保护和隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把转折和个人层面的判断合并：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯说，这件事还远不止如此，它与个人有更深的关联\u003c/p>\n\u003c/blockquote>\n\u003cp>再将理由与可能后果接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>因为艺术与创作者个人如此紧密相连，所以它可能引发数据保护和隐私问题\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>奥尔蒂斯说，这件事还远不止如此，它与个人有更深的关联；因为艺术与创作者个人如此紧密相连，所以它可能引发数据保护和隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>艺术与个人紧密相连，因此还可能引出隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>But把经济利益推进到个人层面；Ortiz says是引述来源。arguing引出她的解释，that之内包含because原因从句和it could主句，不要把because后的内容单独悬空。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>不过奥尔蒂斯表示，这还涉及更深的个人层面；她认为，艺术与个人联系如此紧密，因此也可能引发数据保护和隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>a lot more personal比“很私人”具体，是说作品与身份、个人联系密切；这里不是指作品只供私人欣赏。\u003c/p>\n\u003cp>could raise保留提出潜在问题的谨慎程度，不译成已被裁定违反隐私法；同样不把这项局部担忧扩大为全文唯一主题。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>但奥尔蒂斯说，这也涉及更多个人层面的问题，她认为由于艺术与个人如此紧密相连，可能会引发数据保护和隐私问题。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>35题\u003c/h2>\n\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003cp>本文主要讲什么？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Artists’ responses to AI art generation.\u003c/strong>\u003c/p>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003cp>B. \u003cstrong>AI’s expanded role in artistic creation.\u003c/strong>\u003c/p>\n\u003cp>人工智能在艺术创作中扩大的作用。\u003c/p>\n\u003cp>C. \u003cstrong>Privacy issues in the application of AI.\u003c/strong>\u003c/p>\n\u003cp>人工智能应用中的隐私问题。\u003c/p>\n\u003cp>D. \u003cstrong>Opposing views on AI development.\u003c/strong>\u003c/p>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>介绍Rutkowski及其突然在AI图像生成领域走红。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明用户输入文字和艺术家名字即可生成相近风格图像。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转向未经许可抓图带来的版权问题及艺术家的不满。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>通过使用量和搜索遭遇写他从期待到发现署名错配。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>引述他担心未来无法在网上找到自己的作品。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明其他艺术家也惊讶并开始反击。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以Ortiz说明收入、版权和个人隐私方面的顾虑。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>写艺术行业组织行动并提出训练材料和合作建议。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003ch3>A. Artists’ responses to AI art generation.\u003c/h3>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003ch4>如果 A 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以鲁特科夫斯基突然成为AI热门风格来源，介绍艺术家遭遇的新局面。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明名字和风格怎样被提示词调用，让后续反应有明确的技术对象。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转入未经许可取图所带来的争议，交代艺术家不满的原因。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>展开个人从期待曝光到搜索发现非本人作品挂名的经历，写态度转变。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>引述他担心原创作品被大量生成图像淹没，具体化个人焦虑。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明相似经历还发生在其他艺术家身上，并出现反击行动。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>用另一位艺术家解释收入、版权和个人身份方面的多重关切。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>呈现组织倡议及对训练材料、合作方式的建议，说明艺术家如何应对。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A中的 Artists’ responses 既能装下惊讶、短暂期待和担心，也能装下反击与提出建议。文章不是只写一句反对意见：第1、2段先交代人和技术接触，第3段把许可问题带出，第4、5段写具体艺术家的遭遇，第6段把视线扩大，第7、8段继续写顾虑和行动。AI art generation 是这些反应共同针对的事情；A把叙述主体与对象都保留下来。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003ch3>B. AI’s expanded role in artistic creation.\u003c/h3>\n\u003cp>人工智能在艺术创作中扩大的作用。\u003c/p>\n\u003ch4>如果 B 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能在艺术创作中扩大的作用。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一位数字艺术家的风格成为热门生成对象写起，提出AI在创作中新的应用。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释文字提示怎样转为图像，展示AI承担具体创作任务的机制。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明AI角色扩展触发素材使用争议，成为技术进入艺术领域的阻力。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>以该艺术家经历展示AI从参考灵感进一步介入作品生成与传播。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>写当事人担心机器产出挤占人工作品空间，凸显角色扩大的程度。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>将案例扩大到游戏、出版等其他艺术实践，展示AI承担的新任务。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>讨论更广泛创作角色对职业分工、收入和身份的影响。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>提出训练与合作安排，使扩大的AI创作角色在明确条件下运行。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的 expanded role 看中了文字生成图像的能力，也能勉强装进提示语使用频繁这个事实。但实际第3段以后追问的是作品未经许可使用时艺术家受到什么影响、作出什么反应。第8段用公共领域图像和合作限制材料取得方式，是回应版权等问题，而非为扩展AI在创作中的作用设计路线。B将作为事件起因的技术能力抬成中心，后面个人担忧和集体反击就成了难以解释的大量旁枝。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003ch3>C. Privacy issues in the application of AI.\u003c/h3>\n\u003cp>人工智能应用中的隐私问题。\u003c/p>\n\u003ch4>如果 C 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能应用中的隐私问题。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从艺术家姓名被AI工具频繁调用切入，提出个人身份如何进入技术系统的问题。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明提示词、图像和姓名信息怎样在系统中被收集、关联和输出。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出未经许可收集个人相关材料引起不满，引出隐私处理争议。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>通过搜索姓名返回非本人作品的经历，展示个人身份被错配的具体过程。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>引述当事人对未来失去身份呈现控制权的担忧。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明其他创作者也遭遇相似个人信息问题，开始共同采取行动。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>集中分析作品与个人联系使隐私、数据保护和控制权怎样发生冲突。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>提出数据来源、授权以及纠正机制等建议，回应AI应用中的隐私问题。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的 Privacy issues 确实出现在第7段末尾，Ortiz说艺术与个人紧密相连，可能引发数据保护和隐私问题。但开头谈的是画风被用于提示语，随后是未经许可抓图、署名错配、作品检索困难与收入风险，这些内容不能全部收缩为隐私。第8段建议选择公共领域图像和与艺术家合作，也面向许可和版权问题。C拿艺术家众多顾虑中的一项覆盖了整篇。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the text mainly about?\u003c/strong>\u003c/p>\n\u003ch3>D. Opposing views on AI development.\u003c/h3>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003ch4>如果 D 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对于人工智能发展的相反观点。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一位艺术家的风格被AI利用引出新现象，呈现支持和反对AI发展的起点。\u003c/td>\n\u003ctd>先写人物碰到的新现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>先说明工具怎样运作，为两方针对同一技术展开争论建立背景。\u003c/td>\n\u003ctd>再说现象怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>交代反对方对未经许可训练材料的批评以及支持方对此的回应。\u003c/td>\n\u003ctd>接着写由此引发的不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>通过一位艺术家从期待到担忧的经历，展开双方观点在个人层面的碰撞。\u003c/td>\n\u003ctd>接着展开个人经历\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>具体呈现反对者对机器淹没原创作品的担心及支持者的不同预期。\u003c/td>\n\u003ctd>然后写当事人具体的担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>把个体意见扩展为创作行业内外的不同阵营，展示立场分布。\u003c/td>\n\u003ctd>再把个人遭遇扩展到更多人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>逐项比较双方对收入、版权、个人身份的判断及各自依据。\u003c/td>\n\u003ctd>再说更多人的具体顾虑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>讨论分歧下可能达成的训练与合作安排，说明两方如何寻求妥协。\u003c/td>\n\u003ctd>最后说可以怎样应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的 Opposing views 要求全文持续呈现对立的观点或双方论证。Rutkowski起初觉得可能接触新观众，确实与后来的担忧不同，但这是同一人的经历变化。文章没有随后请支持AI发展的阵营回应艺术家，也没有比较两方论据；后半段始终沿着艺术家的不满、风险和应对推进。把一个人初期的想法当成整派支持立场，会把经历叙述改造成双方辩论。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. A. Artists’ responses to AI art generation.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Artists’ responses to AI art generation. / 艺术家对人工智能艺术生成的反应。\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>What can be learned about Rutkowski from the first two paragraphs?\u003cbr>从前两段可以了解到关于Rutkowski的什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物信息题。题干要求判断“从前两段可以了解到关于Rutkowski的什么？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering. And he&#39;s become a sudden hit in the new world of text-to-image AI generation.\u003c/p>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month. The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts. For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#39;s style.\u003c/p>\n\u003c/blockquote>\n\u003cp>他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。\u003c/p>\n\u003ch3>A. He is enthusiastic about using AI models.\u003c/h3>\n\u003cblockquote>\n\u003cp>他热衷于使用AI模型。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 He is enthusiastic 把使用者写成Rutkowski本人；第2段的 allows anyone 讲模型允许人们做什么，两处都涉及使用模型，所以回看允许使用者生成图像的这句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 allows anyone 是工具向任何使用者提供功能，随后举的是输入Rutkowski名字的例子。A的 He is enthusiastic 却把被输入名字的艺术家变成热心使用工具的人。作品风格被别人调用，与创作者本人使用模型，是两种不同的动作；第1段交代他创作游戏相关作品，也没有把该创作过程写成人工智能生成。\u003c/p>\n\u003cp>模型使用者输入他的名字，他的风格成为模仿对象；A把模仿对象换成了积极使用模型的人。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从前两段可以得知，鲁特科夫斯基他热衷于使用AI模型。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 He is enthusiastic 把使用者写成Rutkowski本人；第2段的 allows anyone 讲模型允许人们做什么，两处都涉及使用模型，所以回看允许使用者生成图像的这句。\u003c/p>\n\u003cp>原文的 allows anyone 是工具向任何使用者提供功能，随后举的是输入Rutkowski名字的例子。A的 He is enthusiastic 却把被输入名字的艺术家变成热心使用工具的人。作品风格被别人调用，与创作者本人使用模型，是两种不同的动作；第1段交代他创作游戏相关作品，也没有把该创作过程写成人工智能生成。\u003c/p>\n\u003cp>模型使用者输入他的名字，他的风格成为模仿对象；A把模仿对象换成了积极使用模型的人。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts.\u003c/p>\n\u003cp>他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski himself is an enthusiastic user of AI image-generation models.\u003c/p>\n\u003cp>鲁特科夫斯基本人是AI图像生成模型的热衷使用者。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文popularity落在他的名字及风格被用户选用，热衷调用工具的是用户。主客体调换后，选项还会与后文艺术家的不满发生冲突。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章讨论艺术家对AI生成的反应，不能单独判断谁使用工具、谁欣赏这位艺术家；前两段对提示词使用者的介绍决定人物关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>He is enthusiastic about using AI models.\u003cbr>他热衷于使用AI模型。\u003c/p>\n\u003c/blockquote>\n\u003cp>模型使用者输入他的名字，他的风格成为模仿对象；A把模仿对象换成了积极使用模型的人。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。\u003c/p>\n\u003cp>本项最终仍要根据“most commonly used prompts”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. He is popular with users of an AI art generator.\u003c/h3>\n\u003cblockquote>\n\u003cp>他受到某AI艺术生成器用户的欢迎。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 popular with users 说使用者欢迎他；第2段的 most commonly used prompts 说他的风格是最常被使用的提示语之一，使用频率能说明这群人的选择，因此回看段首整句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 most commonly used prompts 把他的风格放进最常被使用的一组提示语中，B的 popular with users 说的正是这种使用者层面的欢迎，两边能接上。这里不需要把“风格被使用”说成他本人亲自使用工具；用户选择他的名字或风格来生成图像，已经说明他在这个群体中很受欢迎。第1段的 sudden hit 也与这个具体情形吻合。\u003c/p>\n\u003cp>频繁选择的是他的创作风格，欢迎他的群体是生成器的使用者，人物、群体和受欢迎的表现都能接上。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从前两段可以得知，鲁特科夫斯基他受到某AI艺术生成器用户的欢迎。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 popular with users 说使用者欢迎他；第2段的 most commonly used prompts 说他的风格是最常被使用的提示语之一，使用频率能说明这群人的选择，因此回看段首整句。\u003c/p>\n\u003cp>原文的 most commonly used prompts 把他的风格放进最常被使用的一组提示语中，B的 popular with users 说的正是这种使用者层面的欢迎，两边能接上。这里不需要把“风格被使用”说成他本人亲自使用工具；用户选择他的名字或风格来生成图像，已经说明他在这个群体中很受欢迎。第1段的 sudden hit 也与这个具体情形吻合。\u003c/p>\n\u003cp>频繁选择的是他的创作风格，欢迎他的群体是生成器的使用者，人物、群体和受欢迎的表现都能接上。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month.\u003c/p>\n\u003cp>他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Users of an AI image generator often request images in Rutkowski’s style.\u003c/p>\n\u003cp>AI图像生成器的用户经常要求生成鲁特科夫斯基风格的图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>the most popular names与输入其名字的具体操作共同支持popular with users。这里的欢迎是调用风格的频繁程度，不需要额外证明用户都欣赏他的原创职业。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章讨论艺术家对AI生成的反应，不能单独判断谁使用工具、谁欣赏这位艺术家；前两段对提示词使用者的介绍决定人物关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>He is popular with users of an AI art generator.\u003cbr>他受到某AI艺术生成器用户的欢 h4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion, which was launched late last month.\u003c/p>\n\u003cp>The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts.\u003c/p>\n\u003cp>他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski’s illustrations have won the admiration of other professional illustrators.\u003c/p>\n\u003cp>鲁特科夫斯基的插画赢得其他专业插画家的赞赏。\u003c/p>\n\u003c/blockquote>\n\u003cp>艺术家职业和AI用户不是同一群体，前两段没有其他插画家评价。把users改成illustrators，改变了受欢迎所对应的对象。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章讨论艺术家对AI生成的反应，不能单独判断谁使用工具、谁欣赏这位艺术家；前两段对提示词使用者的介绍决定人物关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>He attracts admiration from other illustrators.\u003cbr>他吸引了其他插画家的钦佩。\u003c/p>\n\u003c/blockquote>\n\u003cp>前两段讨论的是艺术家作品与生成器使用者的联系，C另换成艺术家与同行的联系；反应词是什么都不能替两个人群画上等号。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。\u003c/p>\n\u003cp>本项最终仍要根据“most commonly used prompts”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. He specializes in classical painting digitalization.\u003c/h3>\n\u003cblockquote>\n\u003cp>他专门从事古典绘画的数字化。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 classical painting digitalization 与第1段的 uses classical painting styles 都提到古典绘画，但前者是处理画作，后者是使用画风，因此回到第1段第一句看他实际创造什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 uses classical painting styles 后面紧跟 to create，创造的是 fantasy landscapes，继而说他为游戏制作东西。D的 classical painting digitalization 把工作改成将古典画作转换成数字形式。使用一种画风创作新的幻想风景，与转换已有画作不是同一个创作对象，digital artist 也只是他的身份，并不等于“负责古画数字化”。\u003c/p>\n\u003cp>前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从前两段可以得知，鲁特科夫斯基他专门从事古典绘画的数字化。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 classical painting digitalization 与第1段的 uses classical painting styles 都提到古典绘画，但前者是处理画作，后者是使用画风，因此回到第1段第一句看他实际创造什么。\u003c/p>\n\u003cp>原文的 uses classical painting styles 后面紧跟 to create，创造的是 fantasy landscapes，继而说他为游戏制作东西。D的 classical painting digitalization 把工作改成将古典画作转换成数字形式。使用一种画风创作新的幻想风景，与转换已有画作不是同一个创作对象，digital artist 也只是他的身份，并不等于“负责古画数字化”。\u003c/p>\n\u003cp>前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering.\u003c/p>\n\u003cp>他是用古典绘画风格创作幻想场景的数字艺术家，而如今其名字成为Stable Diffusion用户常用的风格提示词；用户输入名字，工具就能生成相近图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski specializes in converting existing classical paintings into digital files.\u003c/p>\n\u003cp>鲁特科夫斯基专门将已有古典画作转为数字文件。\u003c/p>\n\u003c/blockquote>\n\u003cp>uses classical painting styles to create写借风格创作新奇景，digitalization写复制或转换既有画作。保留classical与digital两个词不能掩盖创作动作被替换。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章讨论艺术家对AI生成的反应，不能单独判断谁使用工具、谁欣赏这位艺术家；前两段对提示词使用者的介绍决定人物关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>He specializes in classical painting digitalization.\u003cbr>他专门从事古典绘画的数字化。\u003c/p>\n\u003c/blockquote>\n\u003cp>前者借助风格创造新内容，后者转换原有画作的形式；D改变了他具体从事的工作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍Rutkowski及其突然在AI图像生成领域走红。说明用户输入文字和艺术家名字即可生成相近风格图像。\u003c/p>\n\u003cp>本项最终仍要根据“most commonly used prompts”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. B. He is popular with users of an AI art generator.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：名字被用户调用不等于艺术家本人热衷使用AI。\u003c/p>\n\u003cp>B：风格作为常用提示词，说明其受到生成器用户的欢迎。\u003c/p>\n\u003cp>C：原文的用户不能被替换成赞赏他的其他职业插画家。\u003c/p>\n\u003cp>D：借古典风格创作新作品不等于将现成古典画作数字化。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>The problem with open-source AI art generators is that they ______.\u003cbr>开源人工智能艺术生成器的问题在于它们怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>问题细节题。题干要求判断“开源人工智能艺术生成器的问题在于它们怎样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/blockquote>\n\u003cp>工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。\u003c/p>\n\u003ch3>A. lack flexibility in responding to prompts\u003c/h3>\n\u003cblockquote>\n\u003cp>在回应提示词时缺乏灵活性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“lack [xxx] in responding to prompts”，保留了相应遮挡。当时的定位线索是：A的 responding to prompts 指程序根据文字生成图像的过程；第3段的 without permission 写程序所使用图像的许可问题，两者同属生成图像所用的程序，所以回看抓取图像这一句，同时联系刚才第2段已读的文字提示语功能。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>flexibility是“灵活性”，A完整声称生成器不能灵活回应提示词。第2段展示输入文字描述及艺术家名字即可生成相似图像，第3段则转向训练图像未经许可的问题，没有报告响应提示词的灵活程度不足。\u003c/p>\n\u003cp>作品能否灵活生成与素材是否获准是两个层面。without permission约束的是抓取和使用网上图像，不能把这一缺失移成工具的功能缺陷；C保留了未经许可及图像来源这两个直接证据。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>开源AI艺术生成器存在的问题是它们在回应提示词时缺乏灵活性。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干问开源生成器存在什么问题。第3段明确限定在网络图像的取得及许可，A的responding to prompts则需要关于系统响应能力的证据，须与第2段的提示词生成机制区分。\u003c/p>\n\u003cp>flexibility是“灵活性”，A完整声称生成器不能灵活回应提示词。第2段展示输入文字描述及艺术家名字即可生成相似图像，第3段则转向训练图像未经许可的问题，没有报告响应提示词的灵活程度不足。\u003c/p>\n\u003cp>作品能否灵活生成与素材是否获准是两个层面。without permission约束的是抓取和使用网上图像，不能把这一缺失移成工具的功能缺陷；C保留了未经许可及图像来源这两个直接证据。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003cp>工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向未经许可抓图带来的版权问题及艺术家的不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The generators cannot respond flexibly to a range of user prompts.\u003c/p>\n\u003cp>生成器无法灵活回应各种用户提示。\u003c/p>\n\u003c/blockquote>\n\u003cp>前段介绍输入不同描述即可生成风格图像，没有能力受限的评价。第3段的问题是授权与署名，不能将不被允许使用素材改为技术不够灵活。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家对生成工具有反应，不能将所有AI常见缺点都归给本文工具；本题须按第3段说出的材料、主体与许可关系确定问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>lack flexibility in responding to prompts\u003cbr>在回应提示词时缺乏灵活性\u003c/p>\n\u003c/blockquote>\n\u003cp>作品能否灵活生成与素材是否获准是两个层面。without permission约束的是抓取和使用网上图像，不能把这一缺失移成工具的功能缺陷；C保留了未经许可及图像来源这两个直接证据。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向未经许可抓图带来的版权问题及艺术家的不满。\u003c/p>\n\u003cp>本项最终仍要根据“without permission”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. produce artworks in unpredictable styles\u003c/h3>\n\u003cblockquote>\n\u003cp>生成风格无法预测的艺术作品\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 unpredictable styles 关心生成作品的风格，第2段的 not a million miles away 正好描述输入例子后作品与Rutkowski风格的距离，前面已经读完整段，所以回到例子最后一句作比较。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 not a million miles away 是否定“相差很远”，意思是生成结果与Rutkowski风格颇为接近。输入的文字中也包含他的名字，风格由提示语指向一个具体对象。B的 unpredictable styles 却说结果风格不可预测，把原文展示的“按提示接近特定风格”改成“风格无法预料”；这不是第3段所转入的未经许可的问题。\u003c/p>\n\u003cp>提示语点出Rutkowski，生成结果也与他的风格接近，B把已写出的对应关系改掉了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists. As a result, they are raising tricky questions about ethics and copyright. And artists like Rutkowski have had enough.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>开源AI艺术生成器存在的问题是 ne images\u003c/h3>\n\u003cblockquote>\n\u003cp>未经授权使用网上图像\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 unauthorized use 是未经授权使用，对应第3段的 without permission；两处说的都是有没有获得允许，因此回到 scraping images 所在的完整句子看所使用的对象。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文用 scraping images from the internet 交代取得的是网上图像，用 without permission 交代常常未经许可。C的 unauthorized use 把这两个部分合成“未经授权使用网上图像”。这里的 use 对应程序靠这些图像建立，online images 对应互联网图像；它没有把艺术家的作品改成使用者的个人信息。\u003c/p>\n\u003cp>使用对象和缺少许可这两点都在同一句里，C准确接回了题干所问的问题。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>开源AI艺术生成器存在的问题是它们未经授权使用网上图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 unauthorized use 是未经授权使用，对应第3段的 without permission；两处说的都是有没有获得允许，因此回到 scraping images 所在的完整句子看所使用的对象。\u003c/p>\n\u003cp>原文用 scraping images from the internet 交代取得的是网上图像，用 without permission 交代常常未经许可。C的 unauthorized use 把这两个部分合成“未经授权使用网上图像”。这里的 use 对应程序靠这些图像建立，online images 对应互联网图像；它没有把艺术家的作品改成使用者的个人信息。\u003c/p>\n\u003cp>使用对象和缺少许可这两点都在同一句里，C准确接回了题干所问的问题。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003cp>工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向未经许可抓图带来的版权问题及艺术家的不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The systems use images collected online without securing the artists’ permission.\u003c/p>\n\u003cp>这些系统使用网上收集的图像，却未先获得艺术家许可。\u003c/p>\n\u003c/blockquote>\n\u003cp>scraping images对应获取方式，without consent对应授权缺失，两项结合准确概括问题。它没有把所有网上图片都说成未经许可，而保留文中often的背景限制。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家对生成工具有反应，不能将所有AI常见缺点都归给本文工具；本题须按第3段说出的材料、主体与许可关系确定问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>make unauthorized use of online images\u003cbr>未经授权使用网上图像\u003c/p>\n\u003c/blockquote>\n\u003cp>使用对象和缺少许可这两点都在同一句里，C准确接回了题干所问的问题。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向未经许可抓图带来的版权问题及艺术家的不满。\u003c/p>\n\u003cp>本项最终仍要根据“without permission”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. collect user information without consent\u003c/h3>\n\u003cblockquote>\n\u003cp>未经同意收集用户信息\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 user information 指用户信息，第3段的 images from the internet 指网上图像，两者都可以成为程序收集的材料，因此回看抓取图像的句子，确认被拿走的究竟是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>D的 user information 将对象换成使用者信息，并把同意的主体也换成用户。虽然 without consent 与 without permission 都有未经允许的意思，但相同的许可表达不能让作品图像和用户信息成为同一对象。\u003c/p>\n\u003cp>原文投诉针对艺术作品被抓取，D转成对工具用户个人信息的收集，许可相似而对象不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>开源AI艺术生成器存在的问题是它们未经同意收集用户信息。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 user information 指用户信息，第3段的 images from the internet 指网上图像，两者都可以成为程序收集的材料，因此回看抓取图像的句子，确认被拿走的究竟是什么。\u003c/p>\n\u003cp>D的 user information 将对象换成使用者信息，并把同意的主体也换成用户。虽然 without consent 与 without permission 都有未经允许的意思，但相同的许可表达不能让作品图像和用户信息成为同一对象。\u003c/p>\n\u003cp>原文投诉针对艺术作品被抓取，D转成对工具用户个人信息的收集，许可相似而对象不同。\u003c/p>\n\u003cp>工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。\u003c/p>\n\u003cp>被抓取的是艺术家图像，许可主体是作品创作者；选项改成用户个人数据，材料类型和权利相关者都变了。后文隐私担忧也不能反过来替换第3段明确的素材。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But these open-source programs are built by scraping images from the Internet, often without permission and proper attribution to artists.\u003c/p>\n\u003cp>工具抓取网络图像来训练，往往没有取得许可，也没有给艺术家应有署名；由此产生伦理、版权问题，艺术家开始厌烦。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向未经许可抓图带来的版权问题及艺术家的不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The systems gather private information about their users without asking them.\u003c/p>\n\u003cp>系统未经询问就收集用户的私人信息。\u003c/p>\n\u003c/blockquote>\n\u003cp>被抓取的是艺术家图像，许可主体是作品创作者；选项改成用户个人数据，材料类型和权利相关者都变了。后文隐私担忧也不能反过来替换第3段明确的素材。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认艺术家对生成工具有反应，不能将所有AI常见缺点都归给本文工具；本题须按第3段说出的材料、主体与许可关系确定问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>collect user information without consent\u003cbr>未经同意收集用户信息\u003c/p>\n\u003c/blockquote>\n\u003cp>原文投诉针对艺术作品被抓取，D转成对工具用户个人信息的收集，许可相似而对象不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向未经许可抓图带来的版权问题及艺术家的不满。\u003c/p>\n\u003cp>本项最终仍要根据“without permission”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>32题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>32. C. make unauthorized use of online images\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：未经许可是素材取得问题，不能换成响应提示词不够灵活。\u003c/p>\n\u003cp>B：输入艺术家风格可得相似图像，不支持风格不可预测的判断。\u003c/p>\n\u003cp>C：抓取网上图像并常未经许可，正是未经授权使用图像。\u003c/p>\n\u003cp>D：艺术家作品与用户个人数据不是同一种被取得的材料。\u003c/p>\n\u003ch2>33题\u003c/h2>\n\u003cblockquote>\n\u003cp>After searching online, Rutkowski found ______.\u003cbr>在线搜索后，Rutkowski发现了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>经历结果题。题干要求判断“在线搜索后，Rutkowski发现了什么？”，先按第4、5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>According to the website Lexica, which tracks over 10 million images and prompts generated by Stable Diffusion, Rutkowski’s name has been used as a prompt around 93,000 times. Some of the world’s most famous artists, such as Michelangelo, Pablo Picasso, and Leonardo da Vinci, brought up around 2,000 prompts each or less. Rutkowski’s name also features as a prompt thousands of times in the Discord of another text-to-image generator, Midjourney. Rutkowski was initially surprised but thought it might be a good way to reach new audiences. Then he tried searching for his name to see if a piece he had worked on had been published. The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003cp>&quot;It&#39;s been just a month. What about in a year? I probably won&#39;t be able to find my work out there because the Internet will be flooded with AI art,&quot; Rutkowski says. &quot;That&#39;s concerning.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003ch3>A. a unique way to reach audiences\u003c/h3>\n\u003cblockquote>\n\u003cp>一种接触受众的独特方式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 a unique way 与第4段 thought it might be a good way 都写某种好办法，后面还都连着观众，因此回看这个想法和紧接着的 Then，确认想法发生在搜索前还是搜索后。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 thought it might be a good way 是他搜索之前的想法，而且 might 只是可能。后面的 Then 才开始写他试着搜索自己的名字。A的 a unique way 不但把可能的好处说成已经找到独特方式，还把搜索前的猜想移到 after searching 之后，时间顺序与题干不合。\u003c/p>\n\u003cp>Then已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski was initially surprised but thought it might be a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name to see if a piece he had worked on had been published.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在线搜索之后，鲁特科夫斯基发现一种接触受众的独特方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 a unique way 与第4段 thought it might be a good way 都写某种好办法，后面还都连着观众，因此回看这个想法和紧接着的 Then，确认想法发生在搜索前还是搜索后。\u003c/p>\n\u003cp>原文的 thought it might be a good way 是他搜索之前的想法，而且 might 只是可能。后面的 Then 才开始写他试着搜索自己的名字。A的 a unique way 不但把可能的好处说成已经找到独特方式，还把搜索前的猜想移到 after searching 之后，时间顺序与题干不合。\u003c/p>\n\u003cp>Then已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Rutkowski was initially surprised but thought it might be a good way to reach new audiences.\u003c/p>\n\u003cp>Then he tried searching for his name to see if a piece he had worked on had been published.\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>His search revealed a unique new route for reaching an audience with his own work.\u003c/p>\n\u003cp>搜索让他发现向受众传播自己作品的独特新渠道。\u003c/p>\n\u003c/blockquote>\n\u003cp>reach audiences是他最初以为会获得的好处，But后的实际搜索却发现不是自己画的图。把期待当成发现，会把态度从正面转向担忧的转折抹去。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认个人经历与艺术家反应有关，不能替代搜索结果本身；须区分搜索前的期待、搜索实际返回的内容及后续担忧。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a unique way to reach audiences\u003cbr>一种接触受众的独特方式\u003c/p>\n\u003c/blockquote>\n\u003cp>Then已经把先前想法和随后搜索分开，题干要的是后一个动作的结果，A移用了前面的想法。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。\u003c/p>\n\u003cp>本项最终仍要根据“had his name attached”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. a new method to identify AI images\u003c/h3>\n\u003cblockquote>\n\u003cp>一种辨认AI图像的新方法\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 a new method 强调识别办法，第4段的 had his name attached 讲他搜索后看到的作品标注；都涉及他认出搜到的作品，因此回到段末搜索结果这句，看看它陈述的是办法还是具体结果。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 had his name attached 只是说返回的作品带着他的名字，but wasn’t his 说明署名与真正作者不符。B的 a new method 则要求这一发现被用作识别所有人工智能图像的新办法。一个人知道眼前的作品不是自己画的，与他发现一套新的识图方法是两件事；原句中的宾语是 work，B换成 method。\u003c/p>\n\u003cp>他确认的是具体作品与自己的创作不相符；B把发现的作品改成了方法，也把一次搜索的结果扩成识别工具。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在线搜索之后，鲁特科夫斯基发现一种辨认AI图像的新方法。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 a new method 强调识别办法，第4段的 had his name attached 讲他搜索后看到的作品标注；都涉及他认出搜到的作品，因此回到段末搜索结果这句，看看它陈述的是办法还是具体结果。\u003c/p>\n\u003cp>原文的 had his name attached 只是说返回的作品带着他的名字，but wasn’t his 说明署名与真正作者不符。B的 a new method 则要求这一发现被用作识别所有人工智能图像的新办法。一个人知道眼前的作品不是自己画的，与他发现一套新的识图方法是两件事；原句中的宾语是 work，B换成 method。\u003c/p>\n\u003cp>他确认的是具体作品与自己的创作不相符；B把发现的作品改成了方法，也把一次搜索的结果扩成识别工具。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003cp>他起初认为名字传播能带来曝光，但搜索自己名字时，出现了带着其名字却不是他创作的作品；这种归属混乱使他担忧未来真正作品被淹没。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>His online search produced a new technique for distinguishing AI images from human-made ones.\u003c/p>\n\u003cp>搜索让他获得区分AI与人工图像的新技术。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文仅说他认出那些图不是自己的作品，没有开发识别算法、规则或方法。知道某作品非本人所作不等于掌握通用AI鉴别方法。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Artists’ responses to AI art generation.\u003cbr>艺术家对人工智能艺术生成的反应。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认个人经历与艺术家反应有关，不能替代搜索结果本身；须区分搜索前的期待、搜索实际返回的内容及后续担忧。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a new method to identify AI images\u003cbr>一种辨认AI图像的新方法\u003c/p>\n\u003c/blockquote>\n\u003cp>他确认的是具体作品与自己的创作不相符；B把发现的作品改成了方法，也把一次搜索的结果扩成识别工具。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：通过使用量和搜索遭遇写他从期待到发现署名错配。引述他担心未来无法在网上找到自己的作品。\u003c/p>\n\u003cp>本项最终仍要根据“had his name attached”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. AI-generated work bearing his name\u003c/h3>\n\u003cblockquote>\n\u003cp>带有他名字的AI生成作品\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 bearing his name 表示带着他的名字，对应段末的 had his name attached；这两个表达讲同一种署名现象，所以回到搜索返回结果的整句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 had his name attached 与C的 bearing his name 说的是相同的署名情况；but wasn’t his 又排除了“这确实是他的画作”的理解。前面本段一直在统计其名字成为图像生成提示语的情形，因此这里返回的署名作品就在人工智能生成的环境中。C保留了搜索结果的作品、姓名和非本人创作这三个部分，没有将搜索前的好处或某种新方法搬过来。\u003c/p>\n\u003cp>本段从名字被用作生成提示语写到搜索结果，C接住的正是最终看到的错配作品。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The online search brought back work that had his name attached to it but wasn’t his.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句
