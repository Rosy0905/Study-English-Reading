const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| Thursday | n.星期四 | French Senate | 法国参议院 | pass | v.通过 |\n| digital services tax | 数字服务税 | impose | v.征收 | entirely | ad.完全地 |\n| multinational | n.跨国公司 | provide digital services | 提供数字服务 | consumer | n.消费者 |\n| user | n.用户 | platform | n.平台 | goods and services | 商品与服务 |\n| online | ad.在网上 | targeting advertising | 定向广告 | be based on | 基于 |\n| apply to | 适用于 | gross revenue | 总营收 | politician | n.政治人物 |\n| media outlet | 媒体机构 | refer to ... as | 将……称为 | tax | n.税 |\n| primarily | ad.主要地 | company | n.公司 | multinational tech company | 跨国科技公司 |\n| be based in | 总部位于 |  |  |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2020英语一Text 4重点词与语境","focus":[85,132,925,780],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u0 03c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>burdensome\u003c/td>\n\u003ctd>a.负担沉重的\u003c/td>\n\u003ctd>costly\u003c/td>\n\u003ctd>a.昂贵的\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 完整原文 · 第1段\n\nLast Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,132,925,780],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-1-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群划分 · 第1段\n\nLast Thursday, / the French Senate passed / a digital services tax, / which would impose / an entirely new tax / on large multinationals / that provide digital services / to consumers or users / in France.\n\nDigital services include / everything from providing a platform / for selling goods and services online / to targeting advertising / based on user data, / and the tax applies / to gross revenue / from such services.\n\nMany French politicians and media outlets / have referred to this / as a \"GAFA tax,\" / meaning that / it is designed to apply primarily / to companies such as / Google, Apple, Facebook and Amazon— / in other words, / multinational tech companies / based in the United States.","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,132,925,780],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-1-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003c/section>\u003csection class= ations → are likely to follow suit + American companies → will face a cascade：(of different taxes：(from dozens of nations))：(that will prove → burdensome and costly).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n上周四 → 法国参议院通过了 → 一项数字服务税：(它将征收 → 一种全新的税：(对大型跨国公司：(那些提供数字服务的：(给消费者或用户：(在法国)))))。\n\n数字服务包括 → 一切：(从提供平台：(用于在线销售商品和服务) → 到定向广告投放：(基于用户数据))，+ 该税适用于：(总收入：(来自此类服务的))。\n\n许多法国政客和媒体机构 → 称之为：(\"GAFA税\")：(意思是 → 它主要设计用于适用：(于这样的公司：(谷歌、苹果、脸书和亚马逊)))：(换句话说 → 跨国科技公司：(总部位于美国的))。\n\n### 第2段\n\n数字服务税 → 现在等待 → 埃马纽埃尔·马克龙总统的签名：(他已经表达了支持：(对该措施))，+ 它可能生效：(在接下来的几周内)。\n\n但它已经引发了 → 重大争议：(美国贸易代表 → 启动了一项调查：(关于该税是否歧视：(美国公司)))：(这进而可能导致 → 贸易制裁：(针对法国))。\n\n### 第3段\n\n法国税 → 不仅仅是 → 一个单边行动：(由一个国家：(需要收入的))。\n\n相反 → 数字服务税 → 是一部分 → 一个更大趋势的：(各国：(在过去几年里) → 提议或实施 → 一大堆：(新的国际税收条款))。\n\n它们包括 → 英国的DPT（转移利润税）+ 澳大利亚的MAAL（跨国反避税法）+ 印度的SEP（重要经济存在）测试 → 仅举几例。\n\n与此同时 → 欧盟、西班牙、英国 + 其他几个国家 → 都认真考虑过 → 数字服务税。\n\n### 第4段\n\n这些单边发展 → 在具体细节上有所不同 // 但它们都旨在 → 对跨国公司征税：(基于收入和营收：(各国认为 → 他们应该有权征税的))：(即使国际税收规则 → 没有授予他们这种权利)。\n\n换句话说 → 它们都共享一个观点：(即国际税收体系 → 未能跟上：(当前经济))。\n\n### 第5段\n\n作为回应：(这些许多单边措施) → 经济合作与发展组织（OECD）→ 目前正在与：(131个国家合作) → 达成共识：(在2020年底前)：(关于一个国际解决方案)。\n\n法国和美国都 → 参与了：(该组织的工作) // 但法国的数字服务税 + 美国的回应 → 引发了问题：(关于未来会怎样：(对国际税收体系))。\n\n### 第6段\n\n法国计划的税收 → 是一个明确的警告：除非广泛的共识 → 能够达成：(关于改革国际税收体系) → 其他国家 → 很可能效仿 + 美国公司 → 将面临一连串：(不同的税收：(来自几十个国家))：(这将证明是 → 繁重且昂贵的)。","context":{"mode":"image","asset":"articleAnnotated","label":"2020英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>上周四 → 法国参议院通过了 → 一项数字服务税：(它将征收 → 一种全新的税：(对大型跨国公司：(那些提供数字服务的：(给消费者或用户：(在法国)))))。\u003c/p>\n\u003cp>数字服务包括 → 一切：(从提供平台：(用于在线销售商品和服务) → 到定向广告投放：(基于用户数据))，+ 该税适用于：(总收入：(来自此类服务的))。\u003c/p>\n\u003cp>许多法国政客和媒体机构 → 称之为：(&quot;GAFA税&quot;)：(意思是 → 它主要设计用于适用：(于这样的公司：(谷歌、苹果、脸书和亚马逊)))：(换句话说 → 跨国科技公司：(总部位于美国的))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>数字服务税 → 现在等待 → 埃马纽埃尔·马克龙总统的签名：(他已经表达了支持：(对该 ing: / Unless a broad consensus / can be reached / on reforming the international tax system, / other nations / are likely to follow suit, / and American companies / will face a cascade / of different taxes / from dozens of nations / that will prove / burdensome and costly.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>法国计划的税收 / 是一个明确的警告：/ 除非广泛的共识 / 能够达成 / 关于改革国际税收体系，/ 其他国家 / 很可能效仿，/ 并且美国公司 / 将面临一连串 / 不同的税收 / 来自几十个国家 / 这将证明是 / 繁重且昂贵的。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把改革共识与其他国家的行动接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能就国际税制改革达成广泛共识，其他国家很可能效仿法国\u003c/p>\n\u003c/blockquote>\n\u003cp>再把美国公司将面对的负担接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>美国公司将面对来自几十个国家的一连串不同税收，这些税收负担沉重且成本高昂\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能就国际税制改革达成广泛共识，其他国家很可能效仿法国；美国公司将面对来自几十个国家的一连串不同税收，这些税收负担沉重且成本高昂。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的税收计划发出警告，公司可能面临多重税负。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写法国税收计划是一项警告，冒号后展开警告内容。“除非”引出达成共识这一例外条件，再用“否则”接效仿与公司负担；几十个国家修饰税收来源，不能变成几十家美国公司。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的税收计划是一个明确警告：除非就改革国际税收体系形成广泛共识，否则其他国家很可能跟着这样做，美国公司将面对几十个国家征收的一连串不同税款，负担沉重且成本高昂。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段第1句","level":3,"raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n把“将面临一连串不同的税收来自几十个国家”改成“将面临来自几十个国家的一连串不同税收”，使来源靠近所修饰对象。\n\n保留“很可能”这一预测语气；“繁重且昂贵”表达的是负担与成本，不要改成改革已经完全失败。\n\n参考译文：\n\n> 法国计划的税收是一个明确的警告：除非能就改革国际税收体系达成广泛共识，否则其他国家很可能效仿，美国公司将面临来自几十个国家的一连串不同税收，这将被证明是繁重且昂贵的负担。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段第1句","focus":[85,3717,92 四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的税收计划发出警告，公司可能面临多重税负。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写法国税收计划是一项警告，冒号后展开警告内容。“除非”引出达成共识这一例外条件，再用“否则”接效仿与公司负担；几十个国家修饰税收来源，不能变成几十家美国公司。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的税收计划是一个明确警告：除非就改革国际税收体系形成广泛共识，否则其他国家很可能跟着这样做，美国公司将面对几十个国家征收的一连串不同税款，负担沉重且成本高昂。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“将面临一连串不同的税收来自几十个国家”改成“将面临来自几十个国家的一连串不同税收”，使来源靠近所修饰对象。\u003c/p>\n\u003cp>保留“很可能”这一预测语气；“繁重且昂贵”表达的是负担与成本，不要改成改革已经完全失败。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>法国计划的税收是一个明确的警告：除非能就改革国际税收体系达成广泛共识，否则其他国家很可能效仿，美国公司将面临来自几十个国家的一连串不同税收，这将被证明是繁重且昂贵的负担。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"40题 · 题干、题型与核心出处","level":2,"raw":"## 40题\n\n**Which of the following might be the best title for this text?**\n\n下面哪一项最适合做这篇文章的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **France Leads the Charge on Digital Tax**\n\n法国带头推动数字税\n\nB. **France Is Confronted with Trade Sanctions**\n\n法国面临贸易制裁\n\nC. **France Demands a Role in the Digital Economy**\n\n法国要求在数字经济中发挥作用\n\nD. **France Says “No” to Tech Multinationals**\n\n法国对科技跨国公司说“不”\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写税可能很快生效，但美国已启动调查，可能对法国制裁。 | 接着写另一方对此不满 |\n| 第3段 | 把法国措施放进多国改变国际税收做法的更大趋势。 | 再说类似变化其实还有很多 |\n| 第4段 | 说明这些国家都认为国际税制没有跟上当前经济。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 以法国税为警告：若税制改革不能形成广泛共识，多国效仿会让公司面对多种昂贵税款。 | 最后说不一起改会更麻烦 |","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"40","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项最适合做这篇文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>France Leads the Charge on Digital Tax\u003c/strong>\u003c/p>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003cp>B. \u003cstrong>France Is Confronted with Trade Sanctions\u003c/strong>\u003c/p>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003cp>C. \u003cstrong>France Demands a Role in the Digital Economy\u003c/strong>\u003c/p>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003cp>D. \u003cstrong>France Says “No” to Tech Multinationals\u003c/strong>\u003c/p>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写税可能很快生效，但美国已启动调查，可能对法国制裁。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>把法国措施放进多国改变国际税收做法的更大趋势。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明这些国家都认为国际税制没有跟上当前经济。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>以法国税为警告：若税制改革不能形成广泛共识，多国效仿会让公司面对多种昂贵税款。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. France Leads the Charge on Digital Tax","level":3,"raw":"**Which of the following might be the best title for this text?**\n\n### A. France Leads the Charge on Digital Tax\n\n法国带头推动数字税","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. France Leads the Charge on Digital Tax","level":3,"raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n法国带头推动数字税\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国通过数字服务税，明确率先推进的具体行动与适用企业。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写美国对法国推动的新税不满，并说明调查可能怎样转为反制。 | 接着写另一方对此不满 |\n| 第3段 | 介绍其他国家已采取或考虑的税收变化，把法国行动放到更大的改革潮流中。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释各国都认为旧国际税制跟不上数字经济，所以法国的先行不是孤立举动。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 介绍国际协调，同时说明法美对抗如何使共同方案的前景出现疑问。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 以别国可能效仿法国造成税负叠加收尾，说明先行行动为何要求更快形成国际改革共识。 | 最后说不一起改会更麻烦 |\n\nA能把六段按原来的次序接起来：法国先通过税，接着出现美国反应，再进入更大的多国税收趋势，最后回到法国措施对国际合作的压力。Leads the Charge 在这里是带头推动、走到前面，并不要求文章证明法国是历史上第一个研究任何跨国税的国家。正文明确说 other nations are likely to follow suit，把法国的行动与别国可能跟进相连；税收这个对象从第一段一直延伸到结尾，也没有扩大为法国整个数字产业的发展。\n\n判断：\n\n**A 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国通过数字服务税，明确率先推进的具体行动与适用企业。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写美国对法国推动的新税不满，并说明调查可能怎样转为反制。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>介绍其他国家已采取或考虑的税收变化，把法国行动放到更大的改革潮流中。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释各国都认为旧国际税制跟不上数字经济，所以法国的先行不是孤立举动。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍国际协调，同时说明法美对抗如何使共同方案的前景出现疑问。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>以别国可能效仿法国造成税负叠加收尾，说明先行行动为何要求更快形成国际改革共识。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A能把六段按原来的次序接起来：法国先通过税，接着出现美国反应，再进入更大的多国税收趋势，最后回到法国措施对国际合作的压力。Leads the Charge 在这里是带头推动、走到前面，并不要求文章证明法国是历史上第一个研究任何跨国税的国家。正文明确说 other nations are likely to follow suit，把法国的行动与别国可能跟进相连；税收这个对象从第一段一直延伸到结尾，也没有扩大为法国整个数字产业的发展。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. France Is Confronted with Trade Sanctions","level":3,"raw":"**Which of the following might be the best title for this text?**\n\n### B. France Is Confronted with Trade Sanctions\n\n法国面临贸易制裁","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. France Is Confronted with Trade Sanctions","level":3,"raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n法国面临贸易制裁\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国开始面对具体贸易制裁，说明制裁状态发生了怎样的变化。 | 先摆出一个已经发生的变化 |\n| 第2段 | 交代制裁方对法国行为的不满，使读者理解惩罚措施的直接触发点。 | 接着写另一方对此不满 |\n| 第3段 | 补充其他国家也遭遇类似贸易制裁的情况，把法国处境放到更大的制裁潮流中。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释这些制裁为何集中出现，明确各方冲突背后的共同机制。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 介绍共同化解对法制裁的协商，说明各方分歧如何阻碍达成方案。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 警告若不能共同改变引发制裁的安排，法国的贸易成本和连锁损失将进一步上升。 | 最后说不一起改会更麻烦 |\n\n第2段确实出现trade sanctions against France，因此B与一个具体后果相连。但那里是could lead to，制裁仍只是美国调查可能造成的结果；第3、4段转入的不是多国制裁法国，而是多国各自调整跨国征税办法，第5段的合作也在寻找税制解决方案。末段costly形容美国公司将面对的各种税款，不能变成法国已经承担的制裁损失。把制裁当标题中心，会把中后四段围绕税制的展开全部改换对象。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国开始面对具体贸易制裁，说明制裁状态发生了怎样的变化。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>交代制裁方对法国行为的不满，使读者理解惩罚措施的直接触发点。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>补充其他国家也遭遇类似贸易制裁的情况，把法国处境放到更大的制裁潮流中。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释这些制裁为何集中出现，明确各方冲突背后的共同机制。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍共同化解对法制裁的协商，说明各方分歧如何阻碍达成方案。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>警告若不能共同改变引发制裁的安排，法国的贸易成本和连锁损失将进一步上升。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第2段确实出现trade sanctions against France，因此B与一个具体后果相连。但那里是could lead to，制裁仍只是美国调查可能造成的结果；第3、4段转入的不是多国制裁法国，而是多国各自调整跨国征税办法，第5段的合作也在寻找税制解决方案。末段costly形容美国公司将面对的各种税款，不能变成法国已经承担的制裁损失。把制裁当标题中心，会把中后四段围绕税制的展开全部改换对象。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. France Demands a Role in the Digital Economy","level":3,"raw":"**Which of the following might be the best title for this text?**\n\n### C. France Demands a Role in the Digital Economy\n\n法国要求在数字经济中发挥作用","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. France Demands a Role in the Digital Economy","level":3,"raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n法国要求在数字经济中发挥作用\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国提出扩大自身数字经济角色的新要求，说明它要争取的产业位置。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写其他国家对法国争取新角色的不满，说明既有参与者为什么感到利益受影响。 | 接着写另一方对此不满 |\n| 第3段 | 列出更多国家也在争取数字经济影响力的行动，呈现重新分配产业角色的趋势。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释各国为何同时要求更大角色，指出旧产业格局无法满足新的参与需求。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 写协调各国数字产业角色的谈判受到阻力，法国诉求与其他国家安排难以统一。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 提醒若不共同调整参与和分工规则，角色争夺会带来更大市场分裂与成本。 | 最后说不一起改会更麻烦 |\n\nC中的Digital Economy与文章的数字服务有联系，但Demands a Role要解释的是法国想取得什么产业位置或影响。正文介绍的却是对服务营收征税、现行税制是否适应经济，以及国际规则如何协调。即使税会影响数字企业，也不能把国家有权对某些收入征税等同于要求成为数字产业的重要角色。尤其第4段的failed to keep up指税制没跟上经济，缺少的不是法国在产业中的一席之地。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国提出扩大自身数字经济角色的新要求，说明它要争取的产业位置。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写其他国家对法国争取新角色的不满，说明既有参与者为什么感到利益受影响。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列出更多国家也在争取数字经济影响力的行动，呈现重新分配产业角色的趋势。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释各国为何同时要求更大角色，指出旧产业格局无法满足新的参与需求。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>写协调各国数字产业角色的谈判受到阻力，法国诉求与其他国家安排难以统一。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>提醒若不共同调整参与和分工规则，角色争夺会带来更大市场分裂与成本。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C中的Digital Economy与文章的数字服务有联系，但Demands a Role要解释的是法国想取得什么产业位置或影响。正文介绍的却是对服务营收征税、现行税制是否适应经济，以及国际规则如何协调。即使税会影响数字企业，也不能把国家有权对某些收入征税等同于要求成为数字产业的重要角色。尤其第4段的failed to keep up指税制没跟上经济，缺少的不是法国在产业中的一席之地。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. France Says “No” to Tech Multinationals","level":3,"raw":"**Which of the following might be the best title for this text?**\n\n### D. France Says “No” to Tech Multinationals\n\n法国对科技跨国公司说“不”","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. France Says “No” to Tech Multinationals","level":3,"raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n法国对科技跨国公司说“不”\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国采取拒绝科技跨国公司进入或继续扩张的行动，明确说不的对象。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写美国对法国排斥本国科技公司的不满，并交代相应反应。 | 接着写另一方对此不满 |\n| 第3段 | 列出其他国家也在限制或拒绝这些公司的行动，说明排斥并非孤例。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释多国为何同时反对科技跨国公司的经营方式，为说不提供共同原因。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 介绍协调跨国公司经营边界的国际努力，以及继续排斥与共同规则之间的阻力。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 警告若各方不一起调整接纳企业的规则，持续相互排斥将增加企业成本和市场割裂。 | 最后说不一起改会更麻烦 |\n\n第1段点名谷歌、苹果等公司，第2段又有美国反应，D因此容易把征税读成全面拒绝公司。但全文没有要求这些企业退出法国，数字服务仍被当作面向法国用户提供的服务，只是营收涉及征税。第4段批评的是现有国际税制跟不上经济，而不是说这些公司不应存在；结尾同样警告多种税制给美国公司增加成本，主张通过改革共识处理问题，并非号召对企业一概说不。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国采取拒绝科技跨国公司进入或继续扩张的行动，明确说不的对象。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写美国对法国排斥本国科技公司的不满，并交代相应反应。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列出其他国家也在限制或拒绝这些公司的行动，说明排斥并非孤例。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释多国为何同时反对科技跨国公司的经营方式，为说不提供共同原因。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍协调跨国公司经营边界的国际努力，以及继续排斥与共同规则之间的阻力。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>警告若各方不一起调整接纳企业的规则，持续相互排斥将增加企业成本和市场割裂。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第1段点名谷歌、苹果等公司，第2段又有美国反应，D因此容易把征税读成全面拒绝公司。但全文没有要求这些企业退出法国，数字服务仍被当作面向法国用户提供的服务，只是营收涉及征税。第4段批评的是现有国际税制跟不上经济，而不是说这些公司不应存在；结尾同样警告多种税制给美国公司增加成本，主张通过改革共识处理问题，并非号召对企业一概说不。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"40题结论","level":2,"raw":"### 40题结论\n\n**40. A. France Leads the Charge on Digital Tax**\n\n这句话就是本文后续做题的主旨底牌：\n\n**France Leads the Charge on Digital Tax / 法国带头推动数字税**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"40","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>40. A. France Leads the Charge on Digital Tax\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>France Leads the Charge on Digital Tax / 法国带头推动数字税\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"36题 · 题干、题型与核心出处","level":2,"raw":"## 36题\n\n> The French Senate has passed a bill to ______.  \n> 法国参议院已通过一项法案，来做什么？\n\n### 题型\n\n法案内容题。题干要求判断“法国参议院已通过一项法案，来做什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\n\n首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"36","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The French Senate has passed a bill to ______.\u003cbr>法国参议院已通过一项法案，来做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>法案内容题。题干要求判断“法国参议院已通过一项法案，来做什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003c/blockquote>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. regulate digital services platforms","level":3,"raw":"### A. regulate digital services platforms\n\n> 监管数字服务平台\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\n\n**错误类型：第一类——歪曲原意。**\n\n原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\n\n第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\n\n**命题人借用的原文材料：**\n\n> Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.","context":{"mode":"image","asset":"questions","focus":[250,340,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"A"},"focusId":"focus-q36-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>监管数字服务平台\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. regulate digital services platforms","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 法国参议院通过法案，要监管数字服务平台。\n\nA的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\n\n原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\n\n第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。","context":{"mode":"image","asset":"questions","focus":[250,340,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"36","option":"A"},"focusId":"focus-q36-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>监管数字服务平台\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国参议院通过法案，要监管数字服务平台。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\u003c/p>\n\u003cp>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. regulate digital services platforms","level":4,"raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\n>\n> 首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\n\n把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The bill regulates how digital service platforms operate.\n>\n> 这项法案监管数字服务平台怎样运营。\n\n平台在原文中属于产生应税收入的服务形式。若假设成立，作者应写运营标准和管理要求，实际继续解释服务营收及被征收公司，动作中心是征税。","context":{"mode":"image","asset":"questions","focus":[250,340,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4 ms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国参议院通过法案，要监管数字服务平台。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\u003c/p>\n\u003cp>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill regulates how digital service platforms operate.\u003c/p>\n\u003cp>这项法案监管数字服务平台怎样运营。\u003c/p>\n\u003c/blockquote>\n\u003cp>平台在原文中属于产生应税收入的服务形式。若假设成立，作者应写运营标准和管理要求，实际继续解释服务营收及被征收公司，动作中心是征税。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>regulate digital services platforms\u003cbr>监管数字服务平台\u003c/p>\n\u003c/blockquote>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. impose a levy on tech multinationals","level":3,"raw":"### B. impose a levy on tech multinationals\n\n> 对科技跨国公司征税\n\n**做题模式中的状态：** 第一轮B保留。当时选项呈现为“impose a [xxx] on tech multinationals”，保留了相应遮挡。当时的定位线索是：B的 tech multinationals 指向第1段 large multinationals，都是大型跨国企业；impose 说征收，因此回看 an entirely new tax 那句，再看末尾说明这些公司身份的话。\n\n**选项类型：正确同义改写。**\n\nlevy在这里是税款。第1句说an entirely new tax on large multinationals，先给出征税与大型跨国企业的关系；段尾再以谷歌等公司解释multinational tech companies的具体身份。\n\nB的impose a levy把新税动作说清，tech multinationals把前后两个名词范围合起来。法国境内的消费者是服务接收者，不是这项选项中的被征税公司；B没有把这两类对象混在一起。\n\n**出处：**\n\n> Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.\n>\n> Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.","context":{"mode":"image","asset":"questions","focus":[250,429,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"qu als。C的 French companies’ interests 却把“法国境内的用户”换成“法国公司的利益”，又加上保护这层动作。首句建立的是服务提供者向法国用户提供服务、由此适用新税的关系；法国不是在这里标记一家需要被保护的本土企业。\u003c/p>\n\u003cp>消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.\u003c/p>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill is intended to protect the interests of French companies.\u003c/p>\n\u003cp>法案旨在保护法国公司的利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文France限定的是接受服务的消费者或用户所在地点，并未提出本国公司的利益受损。征税对象与法国用户相连，不自动形成保护法国企业的目的。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. protect French companies’ interests","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> France Leads the Charge on Digital Tax  \n> 法国带头推动数字税\n\n把这个主旨直接代入36题题干：\n\n> 标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\n\nC实际说的是：\n\n> protect French companies’ interests  \n> 保护法国公司的利益\n\n消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\n\n从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,516,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"36","option":"C"},"focusId":"focus-q36-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-C-0\">\u003cblockquote>\n\u003cp>保护法国公司的利益\ 公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill is intended to protect the interests of French companies.\u003c/p>\n\u003cp>法案旨在保护法国公司的利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文France限定的是接受服务的消费者或用户所在地点，并未提出本国公司的利益受损。征税对象与法国用户相连，不自动形成保护法国企业的目的。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>protect French companies’ interests\u003cbr>保护法国公司的利益\u003c/p>\n\u003c/blockquote>\n\u003cp>消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. curb the influence of advertising","level":3,"raw":"### D. curb the influence of advertising\n\n> 限制广告的影响\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的 curb the influence 把广告影响变小当成目标；第1段关于广告写的是 based on user data，讲投放方式，所以回看 targeting advertising 所在的服务列举句，确认税和广告怎样相连。\n\n**错误类型：第一类——歪曲原意。**\n\n原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。D的 curb the influence 则把对象换成广告的传播效果，要让广告更少影响用户。前者介绍一种数字服务及其收入，后者要改变广告的传播效果；based on user data 并没有把税的目标转成限制广告影响。\n\n税适用于这类服务带来的营收，而不是对广告影响力设定上限。D把服务的种类改写成整项法案的目的。\n\n**命题人借用的原文材料：**\n\n> Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.","context":{"mode":"image","asset":"questions","foc roviding a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。\u003c/p>\n\u003cp>B：levy在这里是税款。\u003c/p>\n\u003cp>C：原文中的 consumers or users in France 是数字服务的消费者或用户，提供服务的是 large multinationals。\u003c/p>\n\u003cp>D：原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"37题 · 题干、题型与核心出处","level":2,"raw":"## 37题\n\n> It can be learned from Paragraph 2 that the digital services tax ______.  \n> 从第2段可以知道，数字服务税怎么样？\n\n### 题型\n\n可能后果推断题。题干要求判断“从第2段可以知道，数字服务税怎么样？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks. But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\n\n法国总统表示支持，税尚待签署；美国已启动是否歧视本国公司的调查，调查继而可能导致对法国的贸易制裁。","context":{"mode":"image","asset":"questions","focus":[250,771,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"37","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be learned from Paragraph 2 that the digital services tax ______.\u003cbr>从第2段可以知道，数字服务税怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>可能后果推断题。题干要求判断“从第2段可以知道，数字服务税怎么样？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks. But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003c/blockquote>\n\u003cp>法国总统表示支持，税尚待签署；美国已启动是否歧视本国公司的调查，调查继而可能导致对法国的贸易制裁。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. will prompt the tech giants to quit France","level":3,"raw":"### A. will prompt the tech giants to quit France\n\n> 将促使科技巨头退出法国\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\n\n**错误类型：第三类——无中生有。**\n\n原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\n\n企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\n\n**命题人借用的原文材料：**\n\n> But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"A"},"focusId":"focus-q37-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>将促使科技巨头退出法国\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\u003c/p>\n\u003cp>企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. will prompt the tech giants to quit France","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 数字服务税将促使科技巨头退出法国。\n\nA的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\n\n原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\n\n企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"37","option":"A"},"focusId":"focus-q37-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>将促使科技巨头退出法国\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\u003c/p>\n\u003cp>企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>数字服务税将促使科技巨头退出法国。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\u003c/p>\n\u003cp>原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\u003c/p>\n\u003cp>企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. will prompt the tech giants to quit France","level":4,"raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\n>\n> 法国总统表示支持，税尚待签署；美国已启动是否歧视本国公司的调查，调查继而可能导致对法国的贸易制裁。\n\n把这一处放回全文，它承担的写作任务是：写税可能很快生效，但美国已启动调查，可能对法国制裁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The tax will cause American technology companies to leave France.\n>\n> 这项税将让美国科技公司退出法国。\n\n原文的行动者是美国贸易代表，可能动作是制裁。企业退出需要公司决策的另一条事实，且will比could语气更强，不能由政府调查直接推出。","context":{"mode":"image","asset":"questions","focus":[250,869,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"37","option":"A"},"focusId":"focus-q37-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>将促使科技巨头退出法国\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\u003c/p>\n\u003cp>\u00 5,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"38","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The countries adopting the unilateral measures share the opinion that ______.\u003cbr>采取这些单方面措施的国家共同认为什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>共同观点题。题干要求判断“采取这些单方面措施的国家共同认为什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right. In other words, they all share a view that the international tax system has failed to keep up with the current economy.\u003c/p>\n\u003c/blockquote>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the current international tax system needs upgrading","level":3,"raw":"### A. the current international tax system needs upgrading\n\n> 现行国际税收制度需要更新\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 needs upgrading 要找“旧办法跟不上新情况”这一理由；第4段正有 failed to keep up，所以回看 In other words 后面把各国共同看法说出来的那一句。\n\n**选项类型：正确同义改写。**\n\n原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。A的 needs upgrading 把这种落差转成更新要求，更新的对象仍是 current international tax system。它没有改成给公司增加技术，也没有把某国单独的税当成全球已经统一的新制度，而是在说共同认为旧体系需要改。\n\n原文直接指出旧体系跟不上，A接的是对这个体系进行更新，两边谈论的对象和变化方向一致。\n\n**出处：**\n\n> In other words, they all share a view that the international tax system has failed to keep up with the current economy.","context":{"mode":"image","asset":"questions","focus":[250,1397,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"A"},"focusId":"focus-q38-A-0","html":"\u003csection class=\"reveal 未能跟上当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Technology companies’ revenues must be redistributed among countries.\u003c/p>\n\u003cp>科技公司的营收必须在各国之间重新分配。\u003c/p>\n\u003c/blockquote>\n\u003cp>收入是征税对象，不等于营收本身要重新分配。假设必须写分配比例、参与者或重新配置要求；原文只说明各国主张对某些收入有征税权。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>redistribution of tech giants’ revenue must be ensured\u003cbr>必须确保科技巨头营收的重新分配\u003c/p>\n\u003c/blockquote>\n\u003cp>In other words, they all share a view后面已经给出共同看法：国际税收制度未能跟上当前经济。B借revenue换入重新分配的要求，A则把failed to keep up准确转成needs upgrading。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. tech multinationals’ monopoly should be prevented","level":3,"raw":"### C. tech multinationals’ monopoly should be prevented\n\n> 应当阻止科技跨国公司的垄断\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。\n\n**错误类型：第三类——无中生有。**\n\n原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。C的 monopoly should be prevented 说的却是阻止公司垄断市场。二者虽然都涉及跨国企业，一个围绕国家的征税权，一个围绕公司的竞争地位；原文说税制没跟上经济，不等于把问题说明为企业垄断，也没有把措施的目标改成限制市场份额。\n\n第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。\n\n**命题人借用的原文材料：**\n\n> These unilateral developments differ in their specifics, but
