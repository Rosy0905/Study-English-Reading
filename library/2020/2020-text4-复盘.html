,{"section":"第三鸟 · 题目复盘","title":"C. tech multinationals’ monopoly should be prevented","level":4,"raw":"#### 写作视角法\n\n原文第4段是这样写的：\n\n> These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\n>\n> 各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\n\n把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The chief shared objective is to prevent technology companies from monopolising markets.\n>\n> 这些国家的共同目标是阻止科技公司垄断市场。\n\n反垄断需要市场支配地位和限制竞争的讨论。正文的multinationals指跨国经营身份，税权与经济脱节才是共同理由，不能由公司规模补出垄断。","context":{"mode":"image","asset":"questions","focus":[250,1573,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"38","option":"C"},"focusId":"focus-q38-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-C-0\">\u003cblockquote>\n\u003cp>应当阻止科技跨国公司的垄断\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。C的 monopoly should be prevented 说的却是阻止公司垄断市场。二者虽然都涉及跨国企业，一个围绕国家的征税权，一个围绕公司的竞争地位；原文说税制没跟上经济，不等于把问题说明为企业垄断，也没有把措施的目标改成限制市场份额。\u003c/p>\n\u003cp>第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if inter 03c/p>\n\u003c/blockquote>\n\u003cp>believe they should have a right to tax是对特定收入的权利主张，没有在国与国之间比较权利是否相等。假设多出all countries与equal，超出共同制度诊断。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. all countries ought to enjoy equal taxing rights","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> France Leads the Charge on Digital Tax  \n> 法国带头推动数字税\n\n把这个主旨直接代入38题题干：\n\n> 全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\n\nD实际说的是：\n\n> all countries ought to enjoy equal taxing rights  \n> 所有国家都应享有平等征税权\n\n原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\n\n从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,1662,1800,85],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"38","option":"D"},"focusId":"focus-q38-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-D-0\">\u003cblockquote>\n\u003cp>所有国家都应享有平等征税权\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。D的 equal taxing rights 把这个要求改成所有国家彼此权利完全相同，all countries 又超过了这里采取措施的这些国家。自己认为某项收入应当由自己征税，并不等于主张每一个国家都对任何收入享有同等权利。\u003c/p>\n\u003cp>原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>采取单边措施的国家共同认为所有国家都应享有平等征税权。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。\u003c/p>\n\u003cp>原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。D的 equal taxing rights 把这个要求改成所有国家彼此权利完全相同，all countries 又超过了这里采取措施的这些国家。自己认为某项收入应当由自己征税，并不等于主张每一个国家都对任何收入享有同等权利。\u003c/p>\n\u003cp>原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Every country should possess exactly equal taxing rights.\u003c/p>\n\u003cp>每个国家都应拥有完全平等的征税权。\u003c/p>\n\u003c/blockquote>\n\u003cp>believe they should have a right to tax是对特定收入的权利主张，没有在国与国之间比较权利是否相等。假设多出all countries与equal，超出共同制度诊断。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>all countries ought to enjoy equal taxing rights\u003cbr>所有国家都应享有平等征税权\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"38题结论","level":2,"raw":"### 38题结论\n\n> **38. A. the current international tax system needs upgrading**\n\nA：原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。\n\nB：redistribution是重新分配。\n\nC：原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。\n\nD：原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"38","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>38. A. the current international tax system needs upgrading\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。\u003c/p>\n\u003cp>B：redistribution是重新分配。\u003c/p>\n\u003cp>C：原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。\u003c/p>\n\u003cp>D：原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"39题 · 题干、题型与核心出处","level":2,"raw":"## 39题\n\n> It can be learned from Paragraph 5 that the OECD’s current work ______.  \n> 从第5段可以知道，OECD目前的工作怎么样？\n\n### 题型\n\n工作前景推断题。题干要求判断“从第5段可以知道，OECD目前的工作怎么样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consensus by the end of 2020 on an international solution. Both France and the United States are involved in the organization's work, but France's digital services tax and the American response raise questions about what the future holds for the international tax system.\n\nOECD正与131国寻求国际方案，法国和美国都参与；转折指出双方单边征税与回应又使国际税制未来出现疑问。","context":{"mode":"image","asset":"questions","focus":[250,1828,1800,470],"sourceW":2255,"sourceH":3141,"label":"2020英语一Text 4题目"},"meta":{"question":"39","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be learned from Paragraph 5 that the OECD’s current work ______.\u003cbr>从第5段可以知道，OECD目前的工作怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>工作前景推断题。题干要求判断“从第5段可以知道，OECD目前的工作怎么样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consensus by the end of 2020 on an international solution. Both France and the United States are involved in the organization&#39;s work, but France&#39;s digital services tax and the American response raise questions about what the future holds for the international tax system.\u003c/p>\n\u003c/blockquote>\n\u003cp>OECD正与131国寻求国际方案，法国和美国都参与；转折指出双方单边征税与回应又使国际税制未来出现疑问。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. is being resisted by US companies","level":3,"raw":"### A. is being resisted by US companies\n\n> 正在遭到美国公司的抵制\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 resisted by US companies 把抵制者写成美国公司；第5段相近的是 the American response，所以回看法美参与合作以及美国回应的那句，分清美国一方与美国公司。\n\n**错误类型：第一类——歪曲原意。**\n\n原文 the American response 与法国的税并列，指美国一方对法国措施的回应；这句话前面又明确说美国参与组织的工作。A的 resisted by US companies 把回应者换成了美国企业，并把回应的对象从法国数字税换成OECD的工作。即使两者都会影响国际税制的前景，也不能把美国对法国税的反应写成美国公司抵制合作工作。\n\n参与者、回应者和回应对象都有具体区分；A把国家层面的回应改成公司对组织工作的抵制。\n\n**命题人借用的原文材料：**\n\n> Both France and the United States are involved in the organization's work, but Fra 于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：法国通过数字服务税法案**（段落1核心事件） 法国参议院通过数字服务税 → 针对大型跨国公司的数字服务征收新税 → 主要目标：\"GAFA\"（谷歌、苹果、脸书、亚马逊等美国科技巨头）\n\n↓（引发的反应）\n\n**逻辑层次2：美国的对抗性回应**（段落2后果与冲突） 等待马克龙签署（支持该措施）→ 可能几周内生效 // 但已引发争议：美国贸易代表调查是否歧视美国公司 → 可能导致对法国的贸易制裁\n\n↓（更大的背景）\n\n**逻辑层次3：全球税收改革趋势**（段落3-4国际背景） 不仅是法国单边行动 → 更大趋势的一部分：【各国纷纷实施新税收条款：英国DPT + 澳大利亚MAAL + 印度SEP测试 + 欧盟等国考虑数字服务税】→ 共同观点：国际税收体系未能跟上当前经济发展\n\n↓（国际协调努力）\n\n**逻辑层次4：OECD的协调与挑战**（段落5国际合作困境） OECD与131国合作寻求共识（2020年底前）→ 法美都参与 // 但法国数字税和美国回应引发对国际税收体系未来的质疑\n\n↓（警示与展望）\n\n**逻辑层次5：对未来的警告**（段落6结论与警示） 法国税是明确警告：【如果无法就改革达成共识 → 其他国家将效仿 → 美国公司将面临来自几十个国家的不同税收（繁重且昂贵）】\n\n↑（全文主旨）\n\n全文核心观点：法国数字服务税代表了全球对现行国际税收体系不满的趋势，如果无法通过多边协商达成共识，将导致各国纷纷采取单边措施，最终使跨国公司（尤其是美国科技巨头）面临复杂且昂贵的多重税收负担。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：法国通过数字服务税法案\u003c/strong>（段落1核心事件） 法国参议院通过数字服务税 → 针对大型跨国公司的数字服务征收新税 → 主要目标：&quot;GAFA&quot;（谷歌、苹果、脸书、亚马逊等美国科技巨头）\u003c/p>\n\u003cp>↓（引发的反应）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：美国的对抗性回应\u003c/strong>（段落2后果与冲突） 等待马克龙签署（支持该措施）→ 可能几周内生效 // 但已引发争议：美国贸易代表调查是否歧视美国公司 → 可能导致对法国的贸易制裁\u003c/p>\n\u003cp>↓（更大的背景）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：全球税收改革趋势\u003c/strong>（段落3-4国际背景） 不仅是法国单边行动 → 更大趋势的一部分：【各国纷纷实施新税收条款：英国DPT + 澳大利亚MAAL + 印度SEP测试 + 欧盟等国考虑数字服务税】→ 共同观点：国际税收体系未能跟上当前经济发展\u003c/p>\n\u003cp>↓（国际协调努力）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：OECD的协调与挑战\u003c/strong>（段落5国际合作困境） OECD与131国合作寻求共识（2020年底前）→ 法美都参与 // 但法国数字税和美国回应引发对国际税收体系未来的质疑\u003c/p>\n\u003cp>↓（警示与展望）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：对未来的警告\u003c/strong>（段落6结论与警示） 法国税是明确警告：【如果无法就改革达成共识 → 其他国家将效仿 → 美国公司将面临来自几十个国家的不同税收（繁重且昂贵）】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：法国数字服务税代表了全球对现行国际税收体系不满的趋势，如果无法通过多边协商达成共识，将导致各国纷纷采取单边措施，最终使跨国公司（尤其是美国科技巨头）面临复杂且昂贵的多重税收负担。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】E. Business without Borders Meets Location-based Tax Rules\n\n> 跨境业务遇上依赖地点的税收规则\n\n这一部分解释数字业务与旧地点标准的错位，将争议限定为征税归属问题。\n\n第一句同时交代新业务与旧规则的条件：\n\n> A digital business can reach users and earn revenue in a country without maintaining the kind of local presence assumed by older tax arrangements.\n\n企业在一国获得用户与收入，却未必有旧制度假设的本地实体。问题在于创造业务联系的方式变了，不是说收入本身消失。\n\n作者随后限制容易被扩大的一步：\n\n> This does not mean that digital companies have no tax obligations anywhere.\n\n缺少某种本地存在，并不能推出企业在任何地方都无纳税义务。后句将真实问题限定为如何分配用户所在地应征的部分。\n\n结尾把争议概括为经济活动与地点规则的错位：\n\n> Governments are trying to connect economic activity in a market to a tax system developed for businesses whose location was easier to identify.\n\n旧制度建立在企业地点较易辨识的情形下，如今要重新连接市场活动和税收归属。标题应同时包括数字业务与地点标准。\n\n这一部分的推进关系是：\n\n> 无传统本地存在也能取得用户收入 → 旧地点标准难确定用户市场税收归属 → 并非企业任何地方都不纳税 → 需要重新连接活动与税制\n\n`Business without Borders`对应跨境触达用户并赚取收入；`Location-based Tax Rules`对应旧制度依赖可辨认企业地点。`Meets`表现两者相遇产生的制度不适配。\n\n再看最强干扰项D：Why Digital Companies Have No Tax Obligations。\n\n干扰标题把规则难分配税收扩大成数字企业根本没有义务，恰被`does not mean...no tax obligations anywhere`排除。原文讨论税收权利如何分配，不是在为全面免税解释理由。\n\n**41题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. Business without Borders Meets Location-based Tax Rules\u003c/p>\n\u003cblockquote>\n\u003cp>跨境业务遇上依赖地点的税收规则\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释数字业务与旧地点标准的错位，将争议限定为征税归属问题。\u003c/p>\n\u003cp>第一句同时交代新业务与旧规则的条件：\u003c/p>\n\u003cblockquote>\n\u003cp>A digital business can reach users and earn revenue in a country without maintaining the kind of local presence assumed by older tax arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>企业在一国获得用户与收入，却未必有旧制度假设的本地实体。问题在于创造业务联系的方式变了，不是说收入本身消失。\u003c/p>\n\u003cp>作者随后限制容易被扩大的一步：\u003c/p>\n\u003cblockquote>\n\u003cp>This does not mean that digital companies have no tax obligations anywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>缺少某种本地存在，并不能推出企业在任何地方都无纳税义务。后句将真实问题限定为如何分配用户所在地应征的部分。\u003c/p>\n\u003cp>结尾把争议概括为经济活动与地点规则的错位：\u003c/p>\n\u003cblockquote>\n\u003cp>Governments are trying to connect economic activity in a market to a tax system developed for businesses whose location was easier to identify.\u003c/p>\n\u003c/blockquote>\n\u003cp>旧制度建立在企业地点较易辨识的情形下，如今要重新连接市场活动和税收归属。标题应同时包括数字业务与地点标准。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>无传统本地存在也能取得用户收入 → 旧地点标准难确定用户市场税收归属 → 并非企业任何地方都不纳税 → 需要重新连接活动与税制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Business without Borders\u003c/code>对应跨境触达用户并赚取收入；\u003ccode>Location-based Tax Rules\u003c/code>对应旧制度依赖可辨认企业地点。\u003ccode>Meets\u003c/code>表现两者相遇产生的制度不适配。\u003c/p>\n\u003cp>再看最强干扰项D：Why Digital Companies Have No Tax Obligations。\u003c/p>\n\u003cp>干扰标题把规则难分配税收扩大成数字企业根本没有义务，恰被\u003ccode>does not mean...no tax obligations anywhere\u003c/code>排除。原文讨论税收权利如何分配，不是在为全面免税解释理由。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】C. A National Tax Becomes a Trade Dispute\n\n> 一国税收措施引发贸易争议\n\n这一部分沿法国措施、美国质疑和潜在贸易回应，展示税收争议如何变为政府间紧张。\n\n法国措施首先回应用户市场征税问题：\n\n> A tax aimed at revenue from large digital businesses could reach companies serving French users even without the traditional taxable presence.\n\n对象是服务法国用户的大型数字企业收入；这种办法试图绕开旧实体存在标准带来的覆盖困难。\n\n美国的反应使问题多了一层：\n\n> Many prominent firms affected by such a measure were American, and Washington questioned whether the proposal treated them unfairly.\n\n受影响的大企业中有美国公司，美国因而质疑待遇是否公平。作者在转述这一质疑，并没有在此证明歧视指控必然成立。\n\n末段把变化从技术问题提升到政府冲突：\n\n> The possibility of a trade response made the disagreement larger than a technical debate among tax specialists.\n\n潜在贸易回应使争议不止于怎么算税；法国国内财政办法引发政府间紧张，就是本段的事件推进。\n\n这一部分的推进关系是：\n\n> 法国设计数字收入税 → 美国企业受影响 → 美国质疑公平待遇 → 税收技术争议扩展为贸易及政府间冲突\n\n`A National Tax`对应法国提出的收入征税措施；`Becomes a Trade Dispute`对应美国质疑以及可能的`trade response`。标题概括事件如何升级，不替任何一方预先判定合法或违法。\n\n再看最强干扰项G：Acting Alone while Seeking Agreement Together。\n\n本段确实有国家单独行动，但没有展开共同谈判和单边行动并存的两条路径；所有细节都围绕法国措施引发美国反应。以协调困境概括会遗漏本段特有的贸易争议。\n\n**42题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. A National Tax Becomes a Trade Dispute\u003c/p>\n\u003cblockquote>\n\u003cp>一国税收措施引发贸易争议\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分沿法国措施、美国质疑和潜在贸易回应，展示税收争议如何变为政府间紧张。\u003c/p>\n\u003cp>法国措施首先回应用户市场征税问题：\u003c/p>\n\u003cblockquote>\n\u003cp>A tax aimed at revenue from large digital businesses could reach companies serving French users even without the traditional taxable presence.\u003c/p>\n\u003c/blockquote>\n\u003cp>对象是服务法国用户的大型数字企业收入；这种办法试图绕开旧实体存在标准带来的覆盖困难。\u003c/p>\n\u003cp>美国的反应使问题多了一层：\u003c/p>\n\u003cblockquote>\n\u003cp>Many prominent firms affected by such a measure were American, and Washington questioned whether the proposal treated them unfairly.\u003c/p>\n\u003c/blockquote>\n\u003cp>受影响的大企业中有美国公司，美国因而质疑待遇是否公平。作者在转述这一质疑，并没有在此证明歧视指控必然成立。\u003c/p>\n\u003cp>末段把变化从技术问题提升到政府冲突：\u003c/p>\n\u003cblockquote>\n\u003cp>The possibility of a trade response made the disagreement larger than a technical debate among tax specialists.\u003c/p>\n\u003c/blockquote>\n\u003cp>潜在贸易回应使争议不止于怎么算税；法国国内财政办法引发政府间紧张，就是本段的事件推进。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国设计数字收入税 → 美国企业受影响 → 美国质疑公平待遇 → 税收技术争议扩展为贸易及政府间冲突\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A National Tax\u003c/code>对应法国提出的收入征税措施；\u003ccode>Becomes a Trade Dispute\u003c/code>对应美国质疑以及可能的\u003ccode>trade response\u003c/code>。标题概括事件如何升级，不替任何一方预先判定合法或违法。\u003c/p>\n\u003cp>再看最强干扰项G：Acting Alone while Seeking Agreement Together。\u003c/p>\n\u003cp>本段确实有国家单独行动，但没有展开共同谈判和单边行动并存的两条路径；所有细节都围绕法国措施引发美国反应。以协调困境概括会遗漏本段特有的贸易争议。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】B. Different Countries Respond to the Same Gap\n\n> 不同国家回应同一制度缺口\n\n这一部分把法国放回多国改革背景，从不同措施中归纳旧规则落后于商业实践的共同压力。\n\n段首用“不止法国”扩大观察范围：\n\n> France was not alone in searching for a way around the limits of older arrangements.\n\n接下来其他国家的措施并非离题例子，而是要检验法国争议背后是否存在更广泛的共同压力。\n\n作者先承认不同国家手段不相同：\n\n> That variation matters: these were not copies of one uniform digital tax.\n\n不同工具覆盖的活动和公司有差异，不能把多个改革都说成相同数字税。承认差异后，`Nevertheless`才引出共同来源。\n\n共同点落在旧规则跟不上商业实践：\n\n> Governments believed that business practices had moved beyond rules built for an earlier economy.\n\n这解释为何各国会分别尝试调整；末句据此将法国事件放回国际制度适应问题，而非归结为单一国家偏好。\n\n这一部分的推进关系是：\n\n> 法国不是唯一行动者 → 各国工具与覆盖对象不同 → 差异背后有共同压力 → 旧规则落后于商业实践构成国际调整问题\n\n`Different Countries`既指多个国家也保留工具差异；`the Same Gap`对应商业实践超出旧规则能力的共同问题。标题同时覆盖差异与共性，而非错误宣称各国已统一税制。\n\n再看最强干扰项F：A Global Tax Agreement Already Completed。\n\n多个国家都有行动不等于已达成全球协议。原文强调`not copies of one uniform digital tax`，描述的是分散且不同的回应，恰不能用“协议已经完成”概括。\n\n**43题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. Different Countries Respond to the Same Gap\u003c/p>\n\u003cblockquote>\n\u003cp>不同国家回应同一制度缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把法国放回多国改革背景，从不同措施中归纳旧规则落后于商业实践的共同压力。\u003c/p>\n\u003cp>段首用“不止法国”扩大观察范围：\u003c/p>\n\u003cblockquote>\n\u003cp>France was not alone in searching for a way around the limits of older arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>接下来其他国家的措施并非离题例子，而是要检验法国争议背后是否存在更广泛的共同压力。\u003c/p>\n\u003cp>作者先承认不同国家手段不相同：\u003c/p>\n\u003cblockquote>\n\u003cp>That variation matters: these were not copies of one uniform digital tax.\u003c/p>\n\u003c/blockquote>\n\u003cp>不同工具覆盖的活动和公司有差异，不能把多个改革都说成相同数字税。承认差异后，\u003ccode>Nevertheless\u003c/code>才引出共同来源。\u003c/p>\n\u003cp>共同点落在旧规则跟不上商业实践：\u003c/p>\n\u003cblockquote>\n\u003cp>Governments believed that business practices had moved beyond rules built for an earlier economy.\u003c/p>\n\u003c/blockquote>\n\u003cp>这解释为何各国会分别尝试调整；末句据此将法国事件放回国际制度适应问题，而非归结为单一国家偏好。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国不是唯一行动者 → 各国工具与覆盖对象不同 → 差异背后有共同压力 → 旧规则落后于商业实践构成国际调整问题\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Different Countries\u003c/code>既指多个国家也保留工具差异；\u003ccode>the Same Gap\u003c/code>对应商业实践超出旧规则能力的共同问题。标题同时覆盖差异与共性，而非错误宣称各国已统一税制。\u003c/p>\n\u003cp>再看最强干扰项F：A Global Tax Agreement Already Completed。\u003c/p>\n\u003cp>多个国家都有行动不等于已达成全球协议。原文强调\u003ccode>not copies of one uniform digital tax\u003c/code>，描述的是分散且不同的回应，恰不能用“协议已经完成”概括。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】G. Acting Alone while Seeking Agreement Together\n\n> 寻求共同协议时仍采取单边行动\n\n这一部分解释国际合作与国内单边行动为何可能并存，而非把参与谈判等同于停止争执。\n\n首句同时提出合作理由与国内压力：\n\n> A shared problem creates a reason to negotiate a shared response, but it does not remove the pressure to act nationally.\n\n共同制度问题使协商有必要，但国家认为收入正在流失时，仍可能希望先采取本国措施。两种动机不是前后替代关系。\n\n段中解释为何不能把参与谈判视为停止单边行动：\n\n> It may introduce a domestic measure before the negotiations are finished.\n\n协议完成之前就可推出国内办法；时间先后导致谈判未停而争执已起，不代表共同方案已经落地。\n\n核心归纳直接点明并存：\n\n> Participation in talks and unilateral action can therefore occur together.\n\n末句解释这种并存为何使合作与批评、报复威胁同时出现。标题要保留这组看似矛盾但可同时成立的事实。\n\n这一部分的推进关系是：\n\n> 共同问题推动国际谈判 → 国内收入压力使政府不愿等待 → 协议完成前推出本国措施 → 合作与单边冲突可能同时存在\n\n`Seeking Agreement Together`对应国际谈判；`Acting Alone`对应提前出台国内措施；`while`对应`occur together`，准确表达并行而非先完成合作后再行动。\n\n再看最强干扰项F：A Global Tax Agreement Already Completed。\n\n本段反复强调`before the negotiations are finished`，讨论的正是协议尚未完成时的选择。出现国际谈判不能证明全球协议已经达成，干扰项把过程偷换成完成状态。\n\n**44题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. Acting Alone while Seeking Agreement Together\u003c/p>\n\u003cblockquote>\n\u003cp>寻求共同协议时仍采取单边行动\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释国际合作与国内单边行动为何可能并存，而非把参与谈判等同于停止争执。\u003c/p>\n\u003cp>首句同时提出合作理由与国内压力：\u003c/p>\n\u003cblockquote>\n\u003cp>A shared problem creates a reason to negotiate a shared response, but it does not remove the pressure to act nationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>共同制度问题使协商有必要，但国家认为收入正在流失时，仍可能希望先采取本国措施。两种动机不是前后替代关系。\u003c/p>\n\u003cp>段中解释为何不能把参与谈判视为停止单边行动：\u003c/p>\n\u003cblockquote>\n\u003cp>It may introduce a domestic measure before the negotiations are finished.\u003c/p>\n\u003c/blockquote>\n\u003cp>协议完成之前就可推出国内办法；时间先后导致谈判未停而争执已起，不代表共同方案已经落地。\u003c/p>\n\u003cp>核心归纳直接点明并存：\u003c/p>\n\u003cblockquote>\n\u003cp>Participation in talks and unilateral action can therefore occur together.\u003c/p>\n\u003c/blockquote>\n\u003cp>末句解释这种并存为何使合作与批评、报复威胁同时出现。标题要保留这组看似矛盾但可同时成立的事实。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>共同问题推动国际谈判 → 国内收入压力使政府不愿等待 → 协议完成前推出本国措施 → 合作与单边冲突可能同时存在\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Seeking Agreement Together\u003c/code>对应国际谈判；\u003ccode>Acting Alone\u003c/code>对应提前出台国内措施；\u003ccode>while\u003c/code>对应\u003ccode>occur together\u003c/code>，准确表达并行而非先完成合作后再行动。\u003c/p>\n\u003cp>再看最强干扰项F：A Global Tax Agreement Already Completed。\u003c/p>\n\u003cp>本段反复强调\u003ccode>before the negotiations are finished\u003c/code>，讨论的正是协议尚未完成时的选择。出现国际谈判不能证明全球协议已经达成，干扰项把过程偷换成完成状态。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】A. The Cost of Letting Separate Rules Multiply\n\n> 放任各自规则增多的代价\n\n这一部分推演缺乏共同方案时规则不断叠加的成本，说明协调对跨境经营的实际意义。\n\n开头把预警限定在协商缺乏共同基础的情形：\n\n> If negotiation fails to produce enough common ground, the likely difficulty is not simply one additional tax bill.\n\n`If`表明这是风险情景，而非宣称协调已经失败；`not simply`又提示后果不止多付某一笔税。\n\n具体成本来自规则差异叠加：\n\n> Businesses could face a growing collection of national measures with different definitions, thresholds and reporting demands.\n\n定义、门槛和申报要求各异，使跨辖区规划和遵从更困难；更多国家跟进还会增加规则层次。\n\n结尾解释协调的实际用途：\n\n> Agreement would not merely reduce diplomatic tension; it could also prevent a fragmented set of responses from becoming an expanding burden on cross-border business.\n\n协议既可能缓和外交冲突，也可防止分散措施不断增加企业负担。重心落在不协调行动的累积成本。\n\n这一部分的推进关系是：\n\n> 缺少共同方案 → 多国各设定义和程序 → 更多国家跟进使层次增加 → 跨境企业负担扩大 → 协调具有实际经营价值\n\n`Separate Rules Multiply`对应各国措施持续增加及差异层层叠加；`Cost`对应规划、申报和遵从负担，不仅是一张税单。标题概括风险机制及其后果。\n\n再看最强干扰项C：A National Tax Becomes a Trade Dispute。\n\n外交紧张在本段只是协调可解决的一类问题，主要证据是多国规则差异如何增加企业经营负担。只用一国税收引发贸易冲突，会把范围缩回法国与美国，漏掉规则连锁扩散的核心预警。\n\n**45题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. The Cost of Letting Separate Rules Multiply\u003c/p>\n\u003cblockquote>\n\u003cp>放任各自规则增多的代价\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分推演缺乏共同方案时规则不断叠加的成本，说明协调对跨境经营的实际意义。\u003c/p>\n\u003cp>开头把预警限定在协商缺乏共同基础的情形：\u003c/p>\n\u003cblockquote>\n\u003cp>If negotiation fails to produce enough common ground, the likely difficulty is not simply one additional tax bill.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>If\u003c/code>表明这是风险情景，而非宣称协调已经失败；\u003ccode>not simply\u003c/code>又提示后果不止多付某一笔税。\u003c/p>\n\u003cp>具体成本来自规则差异叠加：\u003c/p>\n\u003cblockquote>\n\u003cp>Businesses could face a growing collection of national measures with different definitions, thresholds and reporting demands.\u003c/p>\n\u003c/blockquote>\n\u003cp>定义、门槛和申报要求各异，使跨辖区规划和遵从更困难；更多国家跟进还会增加规则层次。\u003c/p>\n\u003cp>结尾解释协调的实际用途：\u003c/p>\n\u003cblockquote>\n\u003cp>Agreement would not merely reduce diplomatic tension; it could also prevent a fragmented set of responses from becoming an expanding burden on cross-border business.\u003c/p>\n\u003c/blockquote>\n\u003cp>协议既可能缓和外交冲突，也可防止分散措施不断增加企业负担。重心落在不协调行动的累积成本。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>缺少共同方案 → 多国各设定义和程序 → 更多国家跟进使层次增加 → 跨境企业负担扩大 → 协调具有实际经营价值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Separate Rules Multiply\u003c/code>对应各国措施持续增加及差异层层叠加；\u003ccode>Cost\u003c/code>对应规划、申报和遵从负担，不仅是一张税单。标题概括风险机制及其后果。\u003c/p>\n\u003cp>再看最强干扰项C：A National Tax Becomes a Trade Dispute。\u003c/p>\n\u003cp>外交紧张在本段只是协调可解决的一类问题，主要证据是多国规则差异如何增加企业经营负担。只用一国税收引发贸易冲突，会把范围缩回法国与美国，漏掉规则连锁扩散的核心预警。\u003c/p>\n\u003cp>\u003cstrong>45题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出数字经营活动与旧地点税制的错位 |\n| B | 用其他国家不同措施证明存在共同制度压力 |\n| C | 解释错位引发税收归属问题，并引出新的收入征税措施 |\n| D | 推演单边行动扩散导致多重规则和跨境企业负担 |\n| E | 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 |\n| F | 由共同动机引出国际谈判，同时保留单边行动压力 |\n| G | 以法国措施为例，提示美国企业受影响及美国关注 |\n| H | 以避免碎片化收束，强调共同方案对修补旧制度的意义 |\n\n全文推进：\n\n> 提出数字经营活动与旧地点税制的错位 → 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注 → 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 → 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担 → 以避免碎片化收束，强调共同方案对修补旧制度的意义\n\n完整顺序：\n\n**A → C → G → E → B → F → D → H**\n\n41—45：C、G、B、F、D。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出数字经营活动与旧地点税制的错位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用其他国家不同措施证明存在共同制度压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>解释错位引发税收归属问题，并引出新的收入征税措施\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>推演单边行动扩散导致多重规则和跨境企业负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>介绍美国公平性质疑及贸易回应，转问更广泛的改革来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由共同动机引出国际谈判，同时保留单边行动压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>以法国措施为例，提示美国企业受影响及美国关注\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以避免碎片化收束，强调共同方案对修补旧制度的意义\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出数字经营活动与旧地点税制的错位 → 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注 → 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 → 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担 → 以避免碎片化收束，强调共同方案对修补旧制度的意义\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → C → G → E → B → F → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：C、G、B、F、D。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → C → G的关系。\n\n先看前段A的结尾：\n\n> This is a mismatch between commercial activity and the legal map used to tax it.\n\n再看候选C的开头：\n\n> This mismatch leaves governments asking how to claim a share of revenue generated through their markets.\n\nA最后给出`a mismatch between commercial activity and the legal map used to tax it`。本段首词`This mismatch`完整回指数字活动能跨境、旧税制仍依赖地点的错位，随后说明政府由此追问自己市场产生的收入怎样分配征税权。\n\n第二句限制推论：这并非企业在任何地方都不纳税，而是某类活动应该归于哪里。`therefore`再由这一归属困难推出可能的新办法，即不依赖传统本地实体也能触及数字收入。\n\nC段最终落在：\n\n> Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\n\n后段G的开头是：\n\n> France supplied a prominent example of such a measure.\n\n后段用`France supplied a prominent example of such a measure`进入法国案例；`such a measure`指本段末句的新收入征税措施。先说明措施类别，再给具体国家实例。\n\n这三段的局部推进是：\n\n> 提出数字经营活动与旧地点税制的错位 → 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注\n\n再检验容易混淆的候选F。它的开头是：\n\n> That common motive provides a reason for seeking agreement internationally.\n\n国际谈判段也回应制度问题，但开头`That common motive`需要先证明多国具有共同动机。A只说明一般错位，尚未展示各国回应，也没有为法国下一段的`such a measure`定义措施类别。\n\n**41题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → C → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This is a mismatch between commercial activity and the legal map used to tax it.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>This mismatch leaves governments asking how to claim a share of revenue generated through their markets.\u003c/p>\n\u003c/blockquote>\n\u003cp>A最后给出\u003ccode>a mismatch between commercial activity and the legal map used to tax it\u003c/code>。本段首词\u003ccode>This mismatch\u003c/code>完整回指数字活动能跨境、旧税制仍依赖地点的错位，随后说明政府由此追问自己市场产生的收入怎样分配征税权。\u003c/p>\n\u003cp>第二句限制推论：这并非企业在任何地方都不纳税，而是某类活动应该归于哪里。\u003ccode>therefore\u003c/code>再由这一归属困难推出可能的新办法，即不依赖传统本地实体也能触及数字收入。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>France supplied a prominent example of such a measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段用\u003ccode>France supplied a prominent example of such a measure\u003c/code>进入法国案例；\u003ccode>such a measure\u003c/code>指本段末句的新收入征税措施。先说明措施类别，再给具体国家实例。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出数字经营活动与旧地点税制的错位 → 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>国际谈判段也回应制度问题，但开头\u003ccode>That common motive\u003c/code>需要先证明多国具有共同动机。A只说明一般错位，尚未展示各国回应，也没有为法国下一段的\u003ccode>such a measure\u003c/code>定义措施类别。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成C → G → E的关系。\n\n先看前段C的结尾：\n\n> Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\n\n再看候选G的开头：\n\n> France supplied a prominent example of such a measure.\n\n前段末句提出触及数字收入的新措施，本段`such a measure`将其落实为法国数字服务税，形成“政策类型 → 具体实例”。法国用户、外国科技企业等细节才首次建立该事件。\n\n因为受影响的显眼公司中有美国企业，段末将视角转向`across the Atlantic`。这不是另起地域闲笔，而是为法国国内方案为何引起美国政治关注准备原因。\n\nG段最终落在：\n\n> Because many visible companies affected were American, the initiative was quickly viewed across the Atlantic as more than a domestic revenue proposal.\n\n后段E的开头是：\n\n> The American response sharpened that political interpretation.\n\n已知E首句`The American response sharpened that political interpretation`接住跨大西洋的政治解读，再讲美方歧视质疑和贸易反应。必须先知道法国措施影响了谁，才能理解美国为何反应。\n\n这三段的局部推进是：\n\n> 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注 → 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源\n\n再检验容易混淆的候选B。它的开头是：\n\n> Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\n\n其他国家措施段以`Beyond France`起头，需要法国事件已经交代；而且它并不说明美国企业受到何种影响。若放在E前，美国的`that political interpretation`既无直接来源，法国案例也被省略。\n\n**42题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成C → G → E的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>France supplied a prominent example of such a measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末句提出触及数字收入的新措施，本段\u003ccode>such a measure\u003c/code>将其落实为法国数字服务税，形成“政策类型 → 具体实例”。法国用户、外国科技企业等细节才首次建立该事件。\u003c/p>\n\u003cp>因为受影响的显眼公司中有美国企业，段末将视角转向\u003ccode>across the Atlantic\u003c/code>。这不是另起地域闲笔，而是为法国国内方案为何引起美国政治关注准备原因。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Because many visible companies affected were American, the initiative was quickly viewed across the Atlantic as more than a domestic revenue proposal.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The American response sharpened that political interpretation.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E首句\u003ccode>The American response sharpened that political interpretation\u003c/code>接住跨大西洋的政治解读，再讲美方歧视质疑和贸易反应。必须先知道法国措施影响了谁，才能理解美国为何反应。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注 → 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\u003c/p>\n\u003c/blockquote>\n\u003cp>其他国家措施段以\u003ccode>Beyond France\u003c/code>起头，需要法国事件已经交代；而且它并不说明美国企业受到何种影响。若放在E前，美国的\u003ccode>that political interpretation\u003c/code>既无直接来源，法国案例也被省略。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → F的关系。\n\n先看前段E的结尾：\n\n> France was responding to a concern found beyond its own borders.\n\n再看候选B的开头：\n\n> Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\n\nE末句说法国回应的是`a concern found beyond its own borders`。本段以`Beyond France`立即扩展范围，列出其他政府也在寻找更有效征税办法，回答“国界之外是否也有同样担忧”。\n\n先承认各国做法不同，再用`nevertheless`从反复出现的改革尝试归纳共同动机：旧安排落后于现代经营。这不是把不同办法说成同一税种，而是从不同回应看共同起因。\n\nB段最终落在：\n\n> Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\n\n后段F的开头是：\n\n> That common motive provides a reason for seeking agreement internationally.\n\n后段`That common motive provides a reason for seeking agreement internationally`回指本段末尾刚明确的共同动机。先证明问题共有，再推出共同谈判的理由，论证顺序不能倒置。\n\n这三段的局部推进是：\n\n> 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 → 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力\n\n再检验容易混淆的候选F。它的开头是：\n\n> That common motive provides a reason for seeking agreement internationally.\n\n谈判段看起来也能承接E的跨国关切，但其`That common motive`预设不同国家的动机已作归纳。E只说关切不止法国，仍缺少多国尝试及其共同起因的展开。\n\n**43题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>France was responding to a concern found beyond its own borders.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\u003c/p>\n\u003c/blockquote>\n\u003cp>E末句说法国回应的是\u003ccode>a concern found beyond its own borders\u003c/code>。本段以\u003ccode>Beyond France\u003c/code>立即扩展范围，列出其他政府也在寻找更有效征税办法，回答“国界之外是否也有同样担忧”。\u003c/p>\n\u003cp>先承认各国做法不同，再用\u003ccode>nevertheless\u003c/code>从反复出现的改革尝试归纳共同动机：旧安排落后于现代经营。这不是把不同办法说成同一税种，而是从不同回应看共同起因。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>That common motive provides a reason for seeking agreement internationally\u003c/code>回指本段末尾刚明确的共同动机。先证明问题共有，再推出共同谈判的理由，论证顺序不能倒置。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 → 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>谈判段看起来也能承接E的跨国关切，但其\u003ccode>That common motive\u003c/code>预设不同国家的动机已作归纳。E只说关切不止法国，仍缺少多国尝试及其共同起因的展开。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → F → D的关系。\n\n先看前段B的结尾：\n\n> Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\n\n再看候选F的开头：\n\n> That common motive provides a reason for seeking agreement internationally.\n\n前段归纳`a common motive`：各国都认为规则落后于商业实践。本段`That common motive`直接接住这一结论，并说明国际谈判可分配征税权，不必让每国独自划线。\n\n即便政府之间公开争执，仍可参与同一谈判；`But`随后指出参与不能消除立即采取国内措施保护收入的诱因。结尾因此留下“共同协商”与“眼前单边行动”的张力。\n\nF段最终落在：\n\n> But participation does not remove the temptation to protect revenue through an immediate national measure.\n\n后段D的开头是：\n\n> If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\n\n后段`If that temptation repeatedly prevails before agreement is reached`中的`that temptation`就是本段末句的单边保护收入诱因。它将前段尚存的压力推演为反复抢先行动的风险。\n\n这三段的局部推进是：\n\n> 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担\n\n再检验容易混淆的候选D。它的开头是：\n\n> If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\n\n规则累积段一开头需要`that temptation`作为条件，但多国共同动机段尚未说谈判中仍有立即单边行动的诱惑。把风险直接接上去会漏掉国际协商与国内压力并存的中间关系。\n\n**44题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → F → D的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段归纳\u003ccode>a common motive\u003c/code>：各国都认为规则落后于商业实践。本段\u003ccode>That common motive\u003c/code>直接接住这一结论，并说明国际谈判可分配征税权，不必让每国独自划线。\u003c/p>\n\u003cp>即便政府之间公开争执，仍可参与同一谈判；\u003ccode>But\u003c/code>随后指出参与不能消除立即采取国内措施保护收入的诱因。结尾因此留下“共同协商”与“眼前单边行动”的张力。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>But participation does not remove the temptation to protect revenue through an immediate national measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>If that temptation repeatedly prevails before agreement is reached\u003c/code>中的\u003ccode>that temptation\u003c/code>就是本段末句的单边保护收入诱因。它将前段尚存的压力推演为反复抢先行动的风险。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则累积段一开头需要\u003ccode>that temptation\u003c/code>作为条件，但多国共同动机段尚未说谈判中仍有立即单边行动的诱惑。把风险直接接上去会漏掉国际协商与国内压力并存的中间关系。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → D → H的关系。\n\n先看前段F的结尾：\n\n> But participation does not remove the temptation to protect revenue through an immediate national measure.\n\n再看候选D的开头：\n\n> If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\n\n前段结尾保留`the temptation to protect revenue through an immediate national measure`。本段的`that temptation`指这项国内行动诱因，`before agreement is reached`又限定其发生在共同方案完成之前。\n\n如果这种选择不断胜出，各国措施累积，企业就要面对不同定义和程序，后来者还可能加新要求。末句的`a fragmented collection of burdens`是这条连锁过程的结果，不是某一国税额的简单增加。\n\nD段最终落在：\n\n> What begins as one country’s response could become a fragmented collection of burdens for cross-border business.\n\n后段H的开头是：\n\n> Avoiding that fragmentation is a practical reason to continue negotiating, even when a quick settlement is unlikely.\n\nH首句`Avoiding that fragmentation`回指刚描述的规则碎片化，以此说明即使短期协议困难也要继续谈判。局部顺序为“单边诱因 → 多重规则累积 → 用避免碎片化解释合作价值”。\n\n这三段的局部推进是：\n\n> 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担 → 以避免碎片化收束，强调共同方案对修补旧制度的意义\n\n再检验容易混淆的候选B。它的开头是：\n\n> Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\n\n多国措施段虽然也描述差异，却停留在旧规则落后的共同动机，没有推演新要求层层增加的经营负担。H的`that fragmentation`应承接本段已经展开的结果，而非把任何国家政策差异都直接等同于这一风险结论。\n\n**45题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → D → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But participation does not remove the temptation to protect revenue through an immediate national measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾保留\u003ccode>the temptation to protect revenue through an immediate national measure\u003c/code>。本段的\u003ccode>that temptation\u003c/code>指这项国内行动诱因，\u003ccode>before agreement is reached\u003c/code>又限定其发生在共同方案完成之前。\u003c/p>\n\u003cp>如果这种选择不断胜出，各国措施累积，企业就要面对不同定义和程序，后来者还可能加新要求。末句的\u003ccode>a fragmented collection of burdens\u003c/code>是这条连锁过程的结果，不是某一国税额的简单增加。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>What begins as one country’s response could become a fragmented collection of burdens for cross-border business.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Avoiding that fragmentation is a practical reason to continue negotiating, even when a quick settlement is unlikely.\u003c/p>\n\u003c/blockquote>\n\u003cp>H首句\u003ccode>Avoiding that fragmentation\u003c/code>回指刚描述的规则碎片化，以此说明即使短期协议困难也要继续谈判。局部顺序为“单边诱因 → 多重规则累积 → 用避免碎片化解释合作价值”。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担 → 以避免碎片化收束，强调共同方案对修补旧制度的意义\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\u003c/p>\n\u003c/blockquote>\n\u003cp>多国措施段虽然也描述差异，却停留在旧规则落后的共同动机，没有推演新要求层层增加的经营负担。H的\u003ccode>that fragmentation\u003c/code>应承接本段已经展开的结果，而非把任何国家政策差异都直接等同于这一风险结论。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **international cooperation** | **国际合作** | **人生哲理类：团结合作** | **宏观主题** |\n| a shared understanding | 共同理解 | 人生哲理类：理解、信任、宽容 | 宏观主题 |\n| institutional adaptability | 制度适应性 | 人生哲理类：创新、开拓、与时俱进 | 宏观主题 |\n| **constructive dialogue** | **建设性对话** | **人生哲理类：团结合作** | **宏观主题** |\n| responsible digital development | 负责任的数字发展 | 经济消费类：科技发展 | 宏观主题 |\n| fair allocation of responsibilities | 责任的公平分担 | 人生哲理类：责任感、奉献精神 | 宏观主题 |\n| **a broad consensus** | **广泛共识** | **人生哲理类：团结合作** | **宏观主题** |\n| a global perspective | 全球视野 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| balanced economic development | 均衡的经济发展 | 经济消费类：经济收入 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2020英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>international cooperation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>国际合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a shared understanding\u003c/td>\n\u0 al groups have followed the same pattern. | 数字显示几个群体呈现相同模式。 |\n| 图表题 | The scale of X differs across the countries shown in the chart. | 图中各国的X规模存在差异。 |\n| **文本评论题** | **The text presents X as part of a much larger trend.** | **文章把X呈现为一种更大趋势的一部分。** |\n| 文本评论题 | The passage discusses efforts to reach a broad consensus on X. | 文章讨论了就X达成广泛共识的努力。 |\n| 文本评论题 | The issue raises questions about what the future holds for X. | 这一问题引出对X未来前景的疑问。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2020英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A and B seeking a shared solution to X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A与B为X寻求共同方案。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, different participants are responding to the same change.\u003c/td>\n\u003ctd>图中不同参与者正对同一变化作出反应。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene highlights the need to keep X in step with Y.\u003c/td>\n\u003ctd>这一场景强调让X与Y同步的必要。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart shows a growing trend towards X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示转向X的趋势正在增强。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures reveal that several groups have followed the same pattern.\u003c/td>\n\u003ctd>数字显示几个群体呈现相同模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The scale of X differs across the countries shown in the chart.\u003c/td>\n\u003ctd>图中各国的X规模存在差异。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The text presents X as part of a much larger trend.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章把X呈现为一种更大趋势的一部分。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage discusses efforts to reach a broad consensus on X.\u003c/td>\n\u003ctd>文章讨论了就X达成广泛共识的努力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue raises questions about what the future holds for X.\u003c/td>\n\u003ctd>这一问题引出对X未来前景的疑问。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. The Cost of Letting Separate Rules Multiply\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Different Countries Respond to the Same Gap\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. A National Tax Becomes a Trade Dispute\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Why Digital Companies Have No Tax Obligations\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Business without Borders Meets Location-based Tax Rules\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. A Global Tax Agreement Already Completed\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Acting Alone while Seeking Agreement Together\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A digital business can reach users and earn revenue in a country without maintaining the kind of local presence assumed by older tax arrangements. Advertising, data and online services make the connection between a market and a physical establishment less straightforward. This does not mean that digital companies have no tax obligations anywhere. It means that existing rules may struggle to determine how much of the business should be taxed where its users are located. The dispute begins with that mismatch. Governments are trying to connect economic activity in a market to a tax system developed for businesses whose location was easier to identify.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>France’s proposed response to this difficulty brought the issue into a sharper political form. A tax aimed at revenue from large digital businesses could reach companies serving French users even without the traditional taxable presence. Many prominent firms affected by such a measure were American, and Washington questioned whether the proposal treated them unfairly. The French initiative thus raised two disputes at once: how digital activity should be taxed, and whether a national measure discriminated against foreign companies. The possibility of a trade response made the disagreement larger than a technical debate among tax specialists. A domestic revenue policy had become a source of tension between governments.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>France was not alone in searching for a way around the limits of older arrangements. Other countries had introduced or considered measures intended to bring multinational activity more effectively within their tax systems. Their instruments differed, as did the precise activities and companies they covered. That variation matters: these were not copies of one uniform digital tax. Nevertheless, the repeated attempts point to a common source of pressure. Governments believed that business practices had moved beyond rules built for an earlier economy. Reading the French case alongside these responses reveals an international adjustment problem rather than an isolated disagreement generated by one country’s preferences.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>A shared problem creates a reason to negotiate a shared response, but it does not remove the pressure to act nationally. International talks seek agreement on how taxing rights should be allocated, and countries involved in public disputes may still take part in that effort. At the same time, a government can be unwilling to wait while it believes revenue is escaping its existing rules. It may introduce a domestic measure before the negotiations are finished. Participation in talks and unilateral action can therefore occur together. Their coexistence explains why cooperation may continue even while particular national taxes generate sharp criticism and threats of retaliation.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>If negotiation fails to produce enough common ground, the likely difficulty is not simply one additional tax bill. Businesses could face a growing collection of national measures with different definitions, thresholds and reporting demands. An activity might be treated differently as it crossed jurisdictions, making planning and compliance harder. More governments could follow those that acted first, adding further layers to the problem. This prospect gives coordination a practical purpose. Agreement would not merely reduce diplomatic tension; it could also prevent a fragmented set of responses from becoming an expanding burden on cross-border business. The warning concerns the cumulative effects of uncoordinated action.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Older tax systems often assumed that a company’s important business locations could be identified through a physical presence. Digital services complicate that assumption. A firm can reach users and obtain revenue in a market without establishing the kind of local operation that the older rules expected. This is a mismatch between commercial activity and the legal map used to tax it.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively. These approaches varied rather than forming one identical policy. Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>This mismatch leaves governments asking how to claim a share of revenue generated through their markets. It does not establish that the companies pay no tax anywhere; it raises a question about where particular activity should count. Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate. Companies would then have to navigate different definitions and procedures across markets, while further governments might add new requirements of their own. What begins as one country’s response could become a fragmented collection of burdens for cross-border business.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>The American response sharpened that political interpretation. Officials questioned whether the French measure unfairly targeted American firms, and the possibility of a trade response added pressure to the dispute. Yet a bilateral confrontation did not fully explain why the tax proposal had appeared. France was responding to a concern found beyond its own borders.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>That common motive provides a reason for seeking agreement internationally. Negotiations can address how taxing rights should be shared instead of leaving every country to draw its own boundary. Governments engaged in public disputes may still participate in the same talks. But participation does not remove the temptation to protect revenue through an immediate national measure.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>France supplied a prominent example of such a measure. Its proposed digital-services tax sought to reach revenue connected with French users, including revenue earned by major foreign technology firms. Because many visible companies affected were American, the initiative was quickly viewed across the Atlantic as more than a domestic revenue proposal.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>Avoiding that fragmentation is a practical reason to continue negotiating, even when a quick settlement is unlikely. The objective is not merely to end a diplomatic argument but to make taxation more coherent with the business it seeks to reach. Without sufficient common ground, each attempt to repair the old mismatch risks creating another layer of uncertainty.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2020英语一Text 4重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Thursday\u003c/td>\n\u003ctd>n.星期四\u003c/td>\n\u003ctd>French Senate\u003c/td>\n\u003ctd>法国参议院\u003c/td>\n\u003c
