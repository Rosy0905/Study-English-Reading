ctr>\n\u003ctd>follow suit\u003c/td>\n\u003ctd>效仿\u003c/td>\n\u003ctd>face\u003c/td>\n\u003ctd>v.面对\u003c/td>\n\u003ctd>a cascade of\u003c/td>\n\u003ctd>一连串\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>different taxes\u003c/td>\n\u003ctd>不同税种\u003c/td>\n\u003ctd>dozens of nations\u003c/td>\n\u003ctd>数十个国家\u003c/td>\n\u003ctd>prove\u003c/td>\n\u003ctd>v.证明是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>burdensome\u003c/td>\n\u003ctd>a.负担沉重的\u003c/td>\n\u003ctd>costly\u003c/td>\n\u003ctd>a.昂贵的\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Last Thursday, / the French Senate passed / a digital services tax, / which would impose / an entirely new tax / on large multinationals / that provide digital services / to consumers or users / in France.\u003c/p>\n\u003cp>Digital services include / everything from providing a platform / for selling goods and services online / to targeting advertising / based on user data, / and the tax applies / to gross revenue / from such services.\u003c/p>\n\u003cp>Many French politicians and media outlets / have referred to this / as a &quot;GAFA tax,&quot; / meaning that / it is designed to apply primarily / to companies such as / Google, Apple, Facebook and Amazon— / in other words, / multinational tech companies / based in the United States.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>上周四，/ 法国参议院通过了 / 一项数字服务税，/ 它将征收 / 一种全新的税 / 对大型跨国公司 / 那些提供数字服务的 / 给消费者或用户 / 在法国。\u003c/p>\n\u003cp>数字服务包括 / 从提供平台的一切 / 用于在线销售商品和服务 / 到定向广告投放 / 基于用户数据，/ 并且该税适用于 / 总收入 / 来自此类服务的。\u003c/p>\n\u003cp>许多法国政客和媒体机构 / 称之为 / &quot;GAFA税&quot;，/ 意思是 / 它主要设计用于适用 / 于这样的公司 / 谷歌、苹果、脸书和亚马逊—— / 换句话说，/ 跨国科技公司 / 总部位于美国的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>上周四，法国参议院通过了一项数字服务税，将对在法国向消费者或用户提供数字服务的大型跨国公司征收全新的税收。数字服务包括从提供在线销售商品和服务的平台到基于用户数据的定向广告投放等一切服务，该税针对这些服务的总收入征收。许多法国政客和媒体称之为&quot;GAFA税&quot;，意思是它主要针对谷歌、苹果、脸书和亚马逊等公司——换句话说，就是总部位于美国的跨国科技公司。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks. But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>The digital services tax / now awaits / the signature of President Emmanuel Macron, / who has expressed support / for the measure, / and it could go into effect / within the next few weeks.\u003c/p>\n\u003cp>But it has already sparked / significant controversy, / with the United States trade representative / opening an investigation / into whether the tax discriminates / against American companies, / which in turn could lead to / trade sanctions / against France.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>数字服务税 / 现在等待 / 埃马纽埃尔·马克龙总统的签名，/ 他已经表达了支持 / 对该措施，/ 并且它可能生效 / 在接下来的几周内。\u003c/p>\n\u003cp>但它已经引发了 / 重大争议，/ 美国贸易代表 / 启动了一项调查 / 关于该税是否歧视 / 美国公司，/ 这进而可能导致 / 贸易制裁 / 针对法国。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>数字服务税现在等待已表示支持该措施的埃马纽埃尔·马克龙总统签署，可能在未来几周内生效。但它已经引发了重大争议，美国贸易代表已启动调查，审查该税是否歧视美国公司，这可能导致对法国的贸易制裁。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The French tax is not just a unilateral move by one country in need of revenue. Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an alphabet soup of new international tax provisions. They have included Britain&#39;s DPT (diverted profits tax), Australia&#39;s MAAL (multinational anti-avoidance law), and India&#39;s SEP (significant economic presence) test, to name but a few. At the same time, the European Union, Spain, Britain and several other countries have all seriously contemplated digital services taxes.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The French tax / is not just / a unilateral move / by one country / in need of revenue.\u003c/p>\n\u003cp>Instead, / the digital services tax / is part of / a much larger trend, / with countries / over the past few years / proposing or putting in place / an alphabet soup / of new international tax provisions.\u003c/p>\n\u003cp>They have included / Britain&#39;s DPT (diverted profits tax), / Australia&#39;s MAAL (multinational anti-avoidance law), / and India&#39;s SEP (significant economic presence) test, / to name but a few.\u003c/p>\n\u003cp>At the same time, / the European Union, Spain, Britain / and several other countries / have all seriously contemplated / digital services taxes.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>法国税 / 不仅仅是 / 一个单边行动 / 由一个国家 / 需要收入的。\u003c/p>\n\u003cp>相反，/ 数字服务税 / 是一部分 / 一个更大趋势的，/ 各国 / 在过去几年里 / 提议或实施 / 一大堆 / 新的国际税收条款。\u003c/p>\n\u003cp>它们包括 / 英国的DPT（转移利润税），/ 澳大利亚的MAAL（跨国反避税法），/ 和印度的SEP（重要经济存在）测试，/ 仅举几例。\u003c/p>\n\u003cp>与此同时，/ 欧盟、西班牙、英国 / 和其他几个国家 / 都认真考虑过 / 数字服务税。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>法国税不仅仅是一个需要收入的国家的单边行动。相反，数字服务税是一个更大趋势的一部分，过去几年里，各国纷纷提议或实施了一系列新的国际税收条款。其中包括英国的转移利润税（DPT）、澳大利亚的跨国反避税法（MAAL）和印度的重要经济存在（SEP）测试等等。与此同时，欧盟、西班牙、英国和其他几个国家都认真考虑过数字服务税。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right. In other words, they all share a view that the international tax system has failed to keep up with the current economy.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>These unilateral developments / differ in their specifics, / but they are all designed / to tax multinationals / on income and revenue / that countries believe / they should have a right to tax, / even if international tax rules / do not grant them that right.\u003c/p>\n\u003cp>In other words, / they all share a view / that the international tax system / has failed to keep up / with the current economy.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>这些单边发展 / 在具体细节上有所不同，/ 但它们都旨在 / 对跨国公司征税 / 基于收入和营收 / 各国认为的 / 他们应该有权征税的，/ 即使国际税收规则 / 没有授予他们这种权利。\u003c/p>\n\u003cp>换句话说，/ 它们都共享一个观点 / 即国际税收体系 / 未能跟上 / 当前经济。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>这些单边措施虽然在具体细节上有所不同，但都旨在对跨国公司的收入和营收征税，各国认为他们应该有权征收这些税，即使国际税收规则没有授予他们这种权利。换句话说，它们都认为国际税收体系未能跟上当前经济的发展。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consensus by the end of 2020 on an international solution. Both France and the United States are involved in the organization&#39;s work, but France&#39;s digital services tax and the American response raise questions about what the future holds for the international tax system.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>In response to / these many unilateral measures, / the Organization for Economic Cooperation and Development (OECD) / is currently working with / 131 countries / to reach a consensus / by the end of 2020 / on an international solution.\u003c/p>\n\u003cp>Both France and the United States / are involved in / the organization&#39;s work, / but France&#39;s digital services tax / and the American response / raise questions about / what the future holds / for the international tax system.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>作为回应 / 这些许多单边措施，/ 经济合作与发展组织（OECD）/ 目前正在与 / 131个国家合作 / 达成共识 / 在2020年底前 / 关于一个国际解决方案。\u003c/p>\n\u003cp>法国和美国都 / 参与了 / 该组织的工作，/ 但法国的数字服务税 / 和美国的回应 / 引发了问题 / 关于未来会怎样 / 对国际税收体系。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>作为对这些单边措施的回应，经济合作与发展组织（OECD）目前正与131个国家合作，力求在2020年底前就国际解决方案达成共识。法国和美国都参与了该组织的工作，但法国的数字服务税和美国的回应引发了人们对国际税收体系未来的质疑。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>France&#39;s planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and American companies will face a cascade of different taxes from dozens of nations that will prove burdensome and costly.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>France&#39;s planned tax / is a clear warning: / Unless a broad consensus / can be reached / on reforming the international tax system, / other nations / are likely to follow suit, / and American companies / will face a cascade / of different taxes / from dozens of nations / that will prove / burdensome and costly.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>法国计划的税收 / 是一个明确的警告：/ 除非广泛的共识 / 能够达成 / 关于改革国际税收体系，/ 其他国家 / 很可能效仿，/ 并且美国公司 / 将面临一连串 / 不同的税收 / 来自几十个国家 / 这将证明是 / 繁重且昂贵的。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>法国计划的税收是一个明确的警告：除非能就改革国际税收体系达成广泛共识，否则其他国家很可能效仿，美国公司将面临来自几十个国家的一连串不同税收，这将被证明是繁重且昂贵的负担。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Last Thursday → the French Senate passed → a digital services tax：(which would impose → an entirely new tax：(on large multinationals：(that provide digital services：(to consumers or users：(in France))))).\u003c/p>\n\u003cp>Digital services include → everything：(from providing a platform：(for selling goods and services online) → to targeting advertising：(based on user data))，+ the tax applies：(to gross revenue：(from such services)).\u003c/p>\n\u003cp>Many French politicians and media outlets → have referred to this：(as a &quot;GAFA tax&quot;)：(meaning that → it is designed to apply primarily：(to companies such as：(Google, Apple, Facebook and Amazon)))：(in other words → multinational tech companies：(based in the United States)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>The digital services tax → now awaits → the signature of President Emmanuel Macron：(who has expressed support：(for the measure))，+ it could go into effect：(within the next few weeks).\u003c/p>\n\u003cp>But it has already sparked → significant controversy：(with the United States trade representative → opening an investigation：(into whether the tax discriminates：(against American companies)))：(which in turn could lead to → trade sanctions：(against France)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The French tax → is not just → a unilateral move：(by one country：(in need of revenue)).\u003c/p>\n\u003cp>Instead → the digital services tax → is part of → a much larger trend：(with countries：(over the past few years) → proposing or putting in place → an alphabet soup：(of new international tax provisions)).\u003c/p>\n\u003cp>They have included → Britain&#39;s DPT (diverted profits tax) + Australia&#39;s MAAL (multinational anti-avoidance law) + India&#39;s SEP (significant economic presence) test → to name but a few.\u003c/p>\n\u003cp>At the same time → the European Union, Spain, Britain + several other countries → have all seriously contemplated → digital services taxes.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>These unilateral developments → differ in their specifics // but they are all designed → to tax multinationals：(on income and revenue：(that countries believe → they should have a right to tax))：(even if international tax rules → do not grant them that right).\u003c/p>\n\u003cp>In other words → they all share a view：(that the international tax system → has failed to keep up：(with the current economy)).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>In response to：(these many unilateral measures) → the Organization for Economic Cooperation and Development (OECD) → is currently working with：(131 countries) → to reach a consensus：(by the end of 2020)：(on an international solution).\u003c/p>\n\u003cp>Both France and the United States → are involved in：(the organization&#39;s work) // but France&#39;s digital services tax + the American response → raise questions about：(what the future holds：(for the international tax system)).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>France&#39;s planned tax → is a clear warning：Unless a broad consensus → can be reached：(on reforming the international tax system) → other nations → are likely to follow suit + American companies → will face a cascade：(of different taxes：(from dozens of nations))：(that will prove → burdensome and costly).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>上周四 → 法国参议院通过了 → 一项数字服务税：(它将征收 → 一种全新的税：(对大型跨国公司：(那些提供数字服务的：(给消费者或用户：(在法国)))))。\u003c/p>\n\u003cp>数字服务包括 → 一切：(从提供平台：(用于在线销售商品和服务) → 到定向广告投放：(基于用户数据))，+ 该税适用于：(总收入：(来自此类服务的))。\u003c/p>\n\u003cp>许多法国政客和媒体机构 → 称之为：(&quot;GAFA税&quot;)：(意思是 → 它主要设计用于适用：(于这样的公司：(谷歌、苹果、脸书和亚马逊)))：(换句话说 → 跨国科技公司：(总部位于美国的))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>数字服务税 → 现在等待 → 埃马纽埃尔·马克龙总统的签名：(他已经表达了支持：(对该措施))，+ 它可能生效：(在接下来的几周内)。\u003c/p>\n\u003cp>但它已经引发了 → 重大争议：(美国贸易代表 → 启动了一项调查：(关于该税是否歧视：(美国公司)))：(这进而可能导致 → 贸易制裁：(针对法国))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>法国税 → 不仅仅是 → 一个单边行动：(由一个国家：(需要收入的))。\u003c/p>\n\u003cp>相反 → 数字服务税 → 是一部分 → 一个更大趋势的：(各国：(在过去几年里) → 提议或实施 → 一大堆：(新的国际税收条款))。\u003c/p>\n\u003cp>它们包括 → 英国的DPT（转移利润税）+ 澳大利亚的MAAL（跨国反避税法）+ 印度的SEP（重要经济存在）测试 → 仅举几例。\u003c/p>\n\u003cp>与此同时 → 欧盟、西班牙、英国 + 其他几个国家 → 都认真考虑过 → 数字服务税。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>这些单边发展 → 在具体细节上有所不同 // 但它们都旨在 → 对跨国公司征税：(基于收入和营收：(各国认为 → 他们应该有权征税的))：(即使国际税收规则 → 没有授予他们这种权利)。\u003c/p>\n\u003cp>换句话说 → 它们都共享一个观点：(即国际税收体系 → 未能跟上：(当前经济))。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>作为回应：(这些许多单边措施) → 经济合作与发展组织（OECD）→ 目前正在与：(131个国家合作) → 达成共识：(在2020年底前)：(关于一个国际解决方案)。\u003c/p>\n\u003cp>法国和美国都 → 参与了：(该组织的工作) // 但法国的数字服务税 + 美国的回应 → 引发了问题：(关于未来会怎样：(对国际税收体系))。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>法国计划的税收 → 是一个明确的警告：除非广泛的共识 → 能够达成：(关于改革国际税收体系) → 其他国家 → 很可能效仿 + 美国公司 → 将面临一连串：(不同的税收：(来自几十个国家))：(这将证明是 → 繁重且昂贵的)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon— in other words, multinational tech companies based in the United States.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Many French politicians and media outlets / have referred to this / as a &quot;GAFA tax,&quot; / meaning that / it is designed to apply primarily / to companies such as / Google, Apple, Facebook and Amazon— / in other words, / multinational tech companies / based in the United States.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>许多法国政客和媒体机构 / 称之为 / &quot;GAFA税&quot;，/ 意思是 / 它主要设计用于适用 / 于这样的公司 / 谷歌、苹果、脸书和亚马逊—— / 换句话说，/ 跨国科技公司 / 总部位于美国的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把命名者、名称和所指对象接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>许多法国政客和媒体把这项税称为GAFA税，主要指向谷歌、苹果、脸书和亚马逊等公司\u003c/p>\n\u003c/blockquote>\n\u003cp>再把这些公司的共同身份合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>换句话说，所针对的是总部位于美国的跨国科技公司\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>许多法国政客和媒体把这项税称为GAFA税，主要指向谷歌、苹果、脸书和亚马逊等公司；换句话说，所针对的是总部位于美国的跨国科技公司。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>政客和媒体称这项税为GAFA税。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写谁作出这个称呼，接着写名称，再用“意思是”解释名称涵盖的公司；“主要”保留在适用对象之前。破折号后重述这些公司的共同身份，总部所在地紧靠跨国科技公司。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>许多法国政客和媒体机构把这项税称为GAFA税，表示它主要设计用于谷歌、苹果、脸书和亚马逊等公司，也就是总部在美国的跨国科技公司。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“主要设计用于适用”整理成“主要针对”，消除重复而不扩大为只针对这四家公司。\u003c/p>\n\u003cp>把“媒体机构”顺成“媒体”，并用“等公司”保留举例性质；美国是公司总部所在地，不是税收服务对象的所在地。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>许多法国政客和媒体称之为&quot;GAFA税&quot;，意思是它主要针对谷歌、苹果、脸书和亚马逊等公司——换句话说，就是总部位于美国的跨国科技公司。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>These unilateral developments / differ in their specifics, / but they are all designed / to tax multinationals / on income and revenue / that countries believe / they should have a right to tax, / even if international tax rules / do not grant them that right.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>这些单边发展 / 在具体细节上有所不同，/ 但它们都旨在 / 对跨国公司征税 / 基于收入和营收 / 各国认为的 / 他们应该有权征税的，/ 即使国际税收规则 / 没有授予他们这种权利。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把不同措施的差异与共同目标接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>这些单边措施细节不同，但都要对跨国公司的收入和营收征税\u003c/p>\n\u003c/blockquote>\n\u003cp>再把各国的主张与国际规则的限制接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>各国认为自己对这些收入应有征税权，即使现行国际规则没有授予这种权利\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这些单边措施细节不同，但都要对跨国公司的收入和营收征税；各国认为自己对这些收入应有征税权，即使现行国际规则没有授予这种权利。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>这些措施虽有差异，却都旨在对跨国公司征税。\u003c/p>\n\u003c/blockquote>\n\u003cp>用“虽然……但……”先建立差异与共同点。随后明确应税对象，再放各国对征税权的主张；“即使”引出国际规则没有授权的让步，不能改成国际规则已经同意征税。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>这些单边措施在细节上不同，但都想对跨国公司的收入和营收征税，各国认为自己应该有这样的权利，即使国际税收规则没有给它们这种权利。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“基于收入和营收各国认为的”整理成先说征税对象、再说各国的权利主张，让两个层次各自完整。\u003c/p>\n\u003cp>“授予他们这种权利”中的他们指各国；不能改成给跨国公司授予纳税权，也不把各国的看法改写成已经获得认可的法律结论。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>这些单边措施虽然在具体细节上有所不同，但都旨在对跨国公司的收入和营收征税，各国认为他们应该有权征收这些税，即使国际税收规则没有授予他们这种权利。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>France&#39;s planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and American companies will face a cascade of different taxes from dozens of nations that will prove burdensome and costly.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>France&#39;s planned tax / is a clear warning: / Unless a broad consensus / can be reached / on reforming the international tax system, / other nations / are likely to follow suit, / and American companies / will face a cascade / of different taxes / from dozens of nations / that will prove / burdensome and costly.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>法国计划的税收 / 是一个明确的警告：/ 除非广泛的共识 / 能够达成 / 关于改革国际税收体系，/ 其他国家 / 很可能效仿，/ 并且美国公司 / 将面临一连串 / 不同的税收 / 来自几十个国家 / 这将证明是 / 繁重且昂贵的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把改革共识与其他国家的行动接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能就国际税制改革达成广泛共识，其他国家很可能效仿法国\u003c/p>\n\u003c/blockquote>\n\u003cp>再把美国公司将面对的负担接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>美国公司将面对来自几十个国家的一连串不同税收，这些税收负担沉重且成本高昂\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能就国际税制改革达成广泛共识，其他国家很可能效仿法国；美国公司将面对来自几十个国家的一连串不同税收，这些税收负担沉重且成本高昂。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的税收计划发出警告，公司可能面临多重税负。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写法国税收计划是一项警告，冒号后展开警告内容。“除非”引出达成共识这一例外条件，再用“否则”接效仿与公司负担；几十个国家修饰税收来源，不能变成几十家美国公司。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的税收计划是一个明确警告：除非就改革国际税收体系形成广泛共识，否则其他国家很可能跟着这样做，美国公司将面对几十个国家征收的一连串不同税款，负担沉重且成本高昂。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“将面临一连串不同的税收来自几十个国家”改成“将面临来自几十个国家的一连串不同税收”，使来源靠近所修饰对象。\u003c/p>\n\u003cp>保留“很可能”这一预测语气；“繁重且昂贵”表达的是负担与成本，不要改成改革已经完全失败。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>法国计划的税收是一个明确的警告：除非能就改革国际税收体系达成广泛共识，否则其他国家很可能效仿，美国公司将面临来自几十个国家的一连串不同税收，这将被证明是繁重且昂贵的负担。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>40题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项最适合做这篇文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>France Leads the Charge on Digital Tax\u003c/strong>\u003c/p>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003cp>B. \u003cstrong>France Is Confronted with Trade Sanctions\u003c/strong>\u003c/p>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003cp>C. \u003cstrong>France Demands a Role in the Digital Economy\u003c/strong>\u003c/p>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003cp>D. \u003cstrong>France Says “No” to Tech Multinationals\u003c/strong>\u003c/p>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写税可能很快生效，但美国已启动调查，可能对法国制裁。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>把法国措施放进多国改变国际税收做法的更大趋势。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明这些国家都认为国际税制没有跟上当前经济。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>以法国税为警告：若税制改革不能形成广泛共识，多国效仿会让公司面对多种昂贵税款。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003ch3>A. France Leads the Charge on Digital Tax\u003c/h3>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国带头推动数字税\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国通过数字服务税，明确率先推进的具体行动与适用企业。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写美国对法国推动的新税不满，并说明调查可能怎样转为反制。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>介绍其他国家已采取或考虑的税收变化，把法国行动放到更大的改革潮流中。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释各国都认为旧国际税制跟不上数字经济，所以法国的先行不是孤立举动。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍国际协调，同时说明法美对抗如何使共同方案的前景出现疑问。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>以别国可能效仿法国造成税负叠加收尾，说明先行行动为何要求更快形成国际改革共识。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A能把六段按原来的次序接起来：法国先通过税，接着出现美国反应，再进入更大的多国税收趋势，最后回到法国措施对国际合作的压力。Leads the Charge 在这里是带头推动、走到前面，并不要求文章证明法国是历史上第一个研究任何跨国税的国家。正文明确说 other nations are likely to follow suit，把法国的行动与别国可能跟进相连；税收这个对象从第一段一直延伸到结尾，也没有扩大为法国整个数字产业的发展。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003ch3>B. France Is Confronted with Trade Sanctions\u003c/h3>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国面临贸易制裁\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国开始面对具体贸易制裁，说明制裁状态发生了怎样的变化。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>交代制裁方对法国行为的不满，使读者理解惩罚措施的直接触发点。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>补充其他国家也遭遇类似贸易制裁的情况，把法国处境放到更大的制裁潮流中。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释这些制裁为何集中出现，明确各方冲突背后的共同机制。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍共同化解对法制裁的协商，说明各方分歧如何阻碍达成方案。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>警告若不能共同改变引发制裁的安排，法国的贸易成本和连锁损失将进一步上升。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第2段确实出现trade sanctions against France，因此B与一个具体后果相连。但那里是could lead to，制裁仍只是美国调查可能造成的结果；第3、4段转入的不是多国制裁法国，而是多国各自调整跨国征税办法，第5段的合作也在寻找税制解决方案。末段costly形容美国公司将面对的各种税款，不能变成法国已经承担的制裁损失。把制裁当标题中心，会把中后四段围绕税制的展开全部改换对象。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003ch3>C. France Demands a Role in the Digital Economy\u003c/h3>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国要求在数字经济中发挥作用\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国提出扩大自身数字经济角色的新要求，说明它要争取的产业位置。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写其他国家对法国争取新角色的不满，说明既有参与者为什么感到利益受影响。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列出更多国家也在争取数字经济影响力的行动，呈现重新分配产业角色的趋势。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释各国为何同时要求更大角色，指出旧产业格局无法满足新的参与需求。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>写协调各国数字产业角色的谈判受到阻力，法国诉求与其他国家安排难以统一。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>提醒若不共同调整参与和分工规则，角色争夺会带来更大市场分裂与成本。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C中的Digital Economy与文章的数字服务有联系，但Demands a Role要解释的是法国想取得什么产业位置或影响。正文介绍的却是对服务营收征税、现行税制是否适应经济，以及国际规则如何协调。即使税会影响数字企业，也不能把国家有权对某些收入征税等同于要求成为数字产业的重要角色。尤其第4段的failed to keep up指税制没跟上经济，缺少的不是法国在产业中的一席之地。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following might be the best title for this text?\u003c/strong>\u003c/p>\n\u003ch3>D. France Says “No” to Tech Multinationals\u003c/h3>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国对科技跨国公司说“不”\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道法国采取拒绝科技跨国公司进入或继续扩张的行动，明确说不的对象。\u003c/td>\n\u003ctd>先摆出一个已经发生的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>写美国对法国排斥本国科技公司的不满，并交代相应反应。\u003c/td>\n\u003ctd>接着写另一方对此不满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列出其他国家也在限制或拒绝这些公司的行动，说明排斥并非孤例。\u003c/td>\n\u003ctd>再说类似变化其实还有很多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释多国为何同时反对科技跨国公司的经营方式，为说不提供共同原因。\u003c/td>\n\u003ctd>回头解释这些做法为何一起出现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍协调跨国公司经营边界的国际努力，以及继续排斥与共同规则之间的阻力。\u003c/td>\n\u003ctd>再说一起解决也遇到了阻力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>警告若各方不一起调整接纳企业的规则，持续相互排斥将增加企业成本和市场割裂。\u003c/td>\n\u003ctd>最后说不一起改会更麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第1段点名谷歌、苹果等公司，第2段又有美国反应，D因此容易把征税读成全面拒绝公司。但全文没有要求这些企业退出法国，数字服务仍被当作面向法国用户提供的服务，只是营收涉及征税。第4段批评的是现有国际税制跟不上经济，而不是说这些公司不应存在；结尾同样警告多种税制给美国公司增加成本，主张通过改革共识处理问题，并非号召对企业一概说不。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>40题结论\u003c/h3>\n\u003cp>\u003cstrong>40. A. France Leads the Charge on Digital Tax\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>France Leads the Charge on Digital Tax / 法国带头推动数字税\u003c/strong>\u003c/p>\n\u003ch2>36题\u003c/h2>\n\u003cblockquote>\n\u003cp>The French Senate has passed a bill to ______.\u003cbr>法国参议院已通过一项法案，来做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>法案内容题。题干要求判断“法国参议院已通过一项法案，来做什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services. Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003c/blockquote>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003ch3>A. regulate digital services platforms\u003c/h3>\n\u003cblockquote>\n\u003cp>监管数字服务平台\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国参议院通过法案，要监管数字服务平台。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\u003c/p>\n\u003cp>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\u003c/p>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill regulates how digital service platforms operate.\u003c/p>\n\u003cp>这项法案监管数字服务平台怎样运营。\u003c/p>\n\u003c/blockquote>\n\u003cp>平台在原文中属于产生应税收入的服务形式。若假设成立，作者应写运营标准和管理要求，实际继续解释服务营收及被征收公司，动作中心是征税。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>regulate digital services platforms\u003cbr>监管数字服务平台\u003c/p>\n\u003c/blockquote>\n\u003cp>第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. impose a levy on tech multinationals\u003c/h3>\n\u003cblockquote>\n\u003cp>对科技跨国公司征税\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“impose a [xxx] on tech multinationals”，保留了相应遮挡。当时的定位线索是：B的 tech multinationals 指向第1段 large multinationals，都是大型跨国企业；impose 说征收，因此回看 an entirely new tax 那句，再看末尾说明这些公司身份的话。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>levy在这里是税款。第1句说an entirely new tax on large multinationals，先给出征税与大型跨国企业的关系；段尾再以谷歌等公司解释multinational tech companies的具体身份。\u003c/p>\n\u003cp>B的impose a levy把新税动作说清，tech multinationals把前后两个名词范围合起来。法国境内的消费者是服务接收者，不是这项选项中的被征税公司；B没有把这两类对象混在一起。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.\u003c/p>\n\u003cp>Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国参议院通过法案，要对科技跨国公司征税。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 tech multinationals 指向第1段 large multinationals，都是大型跨国企业；impose 说征收，因此回看 an entirely new tax 那句，再看末尾说明这些公司身份的话。\u003c/p>\n\u003cp>levy在这里是税款。第1句说an entirely new tax on large multinationals，先给出征税与大型跨国企业的关系；段尾再以谷歌等公司解释multinational tech companies的具体身份。\u003c/p>\n\u003cp>B的impose a levy把新税动作说清，tech multinationals把前后两个名词范围合起来。法国境内的消费者是服务接收者，不是这项选项中的被征税公司；B没有把这两类对象混在一起。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.\u003c/p>\n\u003cp>Many French politicians and media outlets have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\u003c/p>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill imposes a new tax on multinational technology companies.\u003c/p>\n\u003cp>这项法案对跨国科技公司征收新税。\u003c/p>\n\u003c/blockquote>\n\u003cp>levy在这里就是税，tech multinationals概括末句的美国跨国科技公司。两句合起来提供征收动作和公司身份，不把法国用户误当缴税企业。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>impose a levy on tech multinationals\u003cbr>对科技跨国公司征税\u003c/p>\n\u003c/blockquote>\n\u003cp>B的impose a levy把新税动作说清，tech multinationals把前后两个名词范围合起来。法国境内的消费者是服务接收者，不是这项选项中的被征税公司；B没有把这两类对象混在一起。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. protect French companies’ interests\u003c/h3>\n\u003cblockquote>\n\u003cp>保护法国公司的利益\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 French companies’ interests 把法国公司放在受保护的位置；原文提法国时写的是 consumers or users in France，都是与法国相关的对象，因此回看首句具体是谁接受服务、谁被征税。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文中的 consumers or users in France 是数字服务的消费者或用户，提供服务的是 large multinationals。C的 French companies’ interests 却把“法国境内的用户”换成“法国公司的利益”，又加上保护这层动作。首句建立的是服务提供者向法国用户提供服务、由此适用新税的关系；法国不是在这里标记一家需要被保护的本土企业。\u003c/p>\n\u003cp>消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国参议院通过法案，要保护法国公司的利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 French companies’ interests 把法国公司放在受保护的位置；原文提法国时写的是 consumers or users in France，都是与法国相关的对象，因此回看首句具体是谁接受服务、谁被征税。\u003c/p>\n\u003cp>原文中的 consumers or users in France 是数字服务的消费者或用户，提供服务的是 large multinationals。C的 French companies’ interests 却把“法国境内的用户”换成“法国公司的利益”，又加上保护这层动作。首句建立的是服务提供者向法国用户提供服务、由此适用新税的关系；法国不是在这里标记一家需要被保护的本土企业。\u003c/p>\n\u003cp>消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.\u003c/p>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill is intended to protect the interests of French companies.\u003c/p>\n\u003cp>法案旨在保护法国公司的利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文France限定的是接受服务的消费者或用户所在地点，并未提出本国公司的利益受损。征税对象与法国用户相连，不自动形成保护法国企业的目的。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>protect French companies’ interests\u003cbr>保护法国公司的利益\u003c/p>\n\u003c/blockquote>\n\u003cp>消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. curb the influence of advertising\u003c/h3>\n\u003cblockquote>\n\u003cp>限制广告的影响\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 curb the influence 把广告影响变小当成目标；第1段关于广告写的是 based on user data，讲投放方式，所以回看 targeting advertising 所在的服务列举句，确认税和广告怎样相连。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。D的 curb the influence 则把对象换成广告的传播效果，要让广告更少影响用户。前者介绍一种数字服务及其收入，后者要改变广告的传播效果；based on user data 并没有把税的目标转成限制广告影响。\u003c/p>\n\u003cp>税适用于这类服务带来的营收，而不是对广告影响力设定上限。D把服务的种类改写成整项法案的目的。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国参议院通过法案，要限制广告的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 curb the influence 把广告影响变小当成目标；第1段关于广告写的是 based on user data，讲投放方式，所以回看 targeting advertising 所在的服务列举句，确认税和广告怎样相连。\u003c/p>\n\u003cp>原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。D的 curb the influence 则把对象换成广告的传播效果，要让广告更少影响用户。前者介绍一种数字服务及其收入，后者要改变广告的传播效果；based on user data 并没有把税的目标转成限制广告影响。\u003c/p>\n\u003cp>税适用于这类服务带来的营收，而不是对广告影响力设定上限。D把服务的种类改写成整项法案的目的。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.\u003c/p>\n\u003cp>首句给出对提供数字服务的大型跨国公司的新税，随后列平台与定向广告以限定服务，并将主要适用者解释为美国科技跨国公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The bill aims to reduce the influence of advertising on users.\u003c/p>\n\u003cp>法案旨在削弱广告对用户的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设应说明减少投放或限制广告作用。原文targeting advertising说明数字服务的一类收入来源，税针对gross revenue，不是对广告影响力设上限。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题把法国的数字税行动作为主线，题干应回答征什么、向谁征；平台和广告是服务例子，不能据此改成整部法案的运营监管目的。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>curb the influence of advertising\u003cbr>限制广告的影响\u003c/p>\n\u003c/blockquote>\n\u003cp>税适用于这类服务带来的营收，而不是对广告影响力设定上限。D把服务的种类改写成整项法案的目的。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>36题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>36. B. impose a levy on tech multinationals\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。\u003c/p>\n\u003cp>B：levy在这里是税款。\u003c/p>\n\u003cp>C：原文中的 consumers or users in France 是数字服务的消费者或用户，提供服务的是 large multinationals。\u003c/p>\n\u003cp>D：原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。\u003c/p>\n\u003ch2>37题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be learned from Paragraph 2 that the digital services tax ______.\u003cbr>从第2段可以知道，数字服务税怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>可能后果推断题。题干要求判断“从第2段可以知道，数字服务税怎么样？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks. But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003c/blockquote>\n\u003cp>法国总统表示支持，税尚待签署；美国已启动是否歧视本国公司的调查，调查继而可能导致对法国的贸易制裁。\u003c/p>\n\u003ch3>A. will prompt the tech giants to quit France\u003c/h3>\n\u003cblockquote>\n\u003cp>将促使科技巨头退出法国\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\u003c/p>\n\u003cp>企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>数字服务税将促使科技巨头退出法国。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\u003c/p>\n\u003cp>原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\u003c/p>\n\u003cp>企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003cp>法国总统表示支持，税尚待签署；美国已启动是否歧视本国公司的调查，调查继而可能导致对法国的贸易制裁。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写税可能很快生效，但美国已启动调查，可能对法国制裁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The tax will cause American technology companies to leave France.\u003c/p>\n\u003cp>这项税将让美国科技公司退出法国。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的行动者是美国贸易代表，可能动作是制裁。企业退出需要公司决策的另一条事实，且will比could语气更强，不能由政府调查直接推出。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>法国行动引出跨国税制摩擦，但本题须区分已启动的调查与可能发生的反制；不能把未来可能后果说成科技企业必定撤离或法国国内已广泛反对。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>will prompt the tech giants to quit France\u003cbr>将促使科技巨头退出法国\u003c/p>\n\u003c/blockquote>\n\u003cp>企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写税可能很快生效，但美国已启动调查，可能对法国制裁。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. aims to ease international trade tensions\u003c/h3>\n\u003cblockquote>\n\u003cp>旨在缓和国际贸易紧张关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“aims to ease international trade [xxx]”，保留了相应遮挡。当时的定位线索是：B的 aims to ease 指向政策的目的，第2段关于国际贸易的连接却是 could lead to trade sanctions，表示可能引出的后果；因此回看已经读过的第1段征税对象，再看第2段调查的后续结果，不能把后果写成目的。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>B把法案目的说成缓和国际贸易紧张。第2段写的却是税案已经引发争议，美国正调查它是否歧视美国企业，并可能因此对法国实施贸易制裁；这一连串内容表现的是紧张关系被触发，而非缓和。\u003c/p>\n\u003cp>还要区分目的与后果。第1段说明法案对数字服务营收征税，第2段补充美国反应；\u003ccode>aims to ease\u003c/code>把后续国际反应改成法案原先要达到的目标，并把可能加剧摩擦的方向反转。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whet ance 连成前后关系：税已引起调查，调查又可能导致对法国的制裁。D的 countermeasures against France 把具体的贸易制裁概括为应对措施；may 与 could 都只表达可能，没有说制裁已经实施。对象仍是法国，行动仍是对这项税的回应，时间和程度也都接得上。\u003c/p>\n\u003cp>制裁正是一种具体应对，could 和 may 也都保留了“可能”的语气；D没有把调查可能造成的结果说成已经发生。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>数字服务税可能引发针对法国的反制措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 countermeasures against France 与第2段 trade sanctions against France 都是针对法国采取行动，贸易制裁是一种具体应对，因此回看 which in turn could lead to 后面写出的后果。\u003c/p>\n\u003cp>原文把税、美国调查和 trade sanctions against France 连成前后关系：税已引起调查，调查又可能导致对法国的制裁。D的 countermeasures against France 把具体的贸易制裁概括为应对措施；may 与 could 都只表达可能，没有说制裁已经实施。对象仍是法国，行动仍是对这项税的回应，时间和程度也都接得上。\u003c/p>\n\u003cp>制裁正是一种具体应对，could 和 may 也都保留了“可能”的语气；D没有把调查可能造成的结果说成已经发生。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.\u003c/p>\n\u003cp>法国总统表示支持，税尚待签署；美国已启动是否歧视本国公司的调查，调查继而可能导致对法国的贸易制裁。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写税可能很快生效，但美国已启动调查，可能对法国制裁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The American investigation could lead to retaliatory measures against France.\u003c/p>\n\u003cp>美国的调查可能导致针对法国的反制措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>could lead to trade sanctions给出后果及可能性，may trigger countermeasures以较宽的措施名概括制裁，同时保留may，没有宣布制裁已经实施。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>法国行动引出跨国税制摩擦，但本题须区分已启动的调查与可能发生的反制；不能把未来可能后果说成科技企业必定撤离或法国国内已广泛反对。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>may trigger countermeasures against France\u003cbr>可能引发针对法国的反制措施\u003c/p>\n\u003c/blockquote>\n\u003cp>制裁正是一种具体应对，could 和 may 也都保留了“可能”的语气；D没有把调查可能造成的结果说成已经发生。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写税可能很快生效，但美国已启动调查，可能对法国制裁。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>37题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>37. D. may trigger countermeasures against France\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。\u003c/p>\n\u003cp>B：B把法案目的说成缓和国际贸易紧张。\u003c/p>\n\u003cp>C：at home and abroad同时限定国内与国外。\u003c/p>\n\u003cp>D：原文把税、美国调查和 trade sanctions against France 连成前后关系：税已引起调查，调查又可能导致对法国的制裁。\u003c/p>\n\u003ch2>38题\u003c/h2>\n\u003cblockquote>\n\u003cp>The countries adopting the unilateral measures share the opinion that ______.\u003cbr>采取这些单方面措施的国家共同认为什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>共同观点题。题干要求判断“采取这些单方面措施的国家共同认为什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right. In other words, they all share a view that the international tax system has failed to keep up with the current economy.\u003c/p>\n\u003c/blockquote>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n\u003ch3>A. the current international tax system needs upgrading\u003c/h3>\n\u003cblockquote>\n\u003cp>现行国际税收制度需要更新\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 needs upgrading 要找“旧办法跟不上新情况”这一理由；第4段正有 failed to keep up，所以回看 In other words 后面把各国共同看法说出来的那一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。A的 needs upgrading 把这种落差转成更新要求，更新的对象仍是 current international tax system。它没有改成给公司增加技术，也没有把某国单独的税当成全球已经统一的新制度，而是在说共同认为旧体系需要改。\u003c/p>\n\u003cp>原文直接指出旧体系跟不上，A接的是对这个体系进行更新，两边谈论的对象和变化方向一致。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In other words, they all share a view that the international tax system has failed to keep up with the current economy.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>采取单边措施的国家共同认为现行国际税收制度需要更新。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 needs upgrading 要找“旧办法跟不上新情况”这一理由；第4段正有 failed to keep up，所以回看 In other words 后面把各国共同看法说出来的那一句。\u003c/p>\n\u003cp>原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。A的 needs upgrading 把这种落差转成更新要求，更新的对象仍是 current international tax system。它没有改成给公司增加技术，也没有把某国单独的税当成全球已经统一的新制度，而是在说共同认为旧体系需要改。\u003c/p>\n\u003cp>原文直接指出旧体系跟不上，A接的是对这个体系进行更新，两边谈论的对象和变化方向一致。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In other words, they all share a view that the international tax system has failed to keep up with the current economy.\u003c/p>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The international tax system must be updated to reflect the present economy.\u003c/p>\n\u003cp>国际税收制度必须更新，以反映当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>needs upgrading对应failed to keep up，而current对应current economy。各国虽有不同办法，共同诊断仍是旧制度落后，假设不额外规定更新的具体方案。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the current international tax system needs upgrading\u003cbr>现行国际税收制度需要更新\u003c/p>\n\u003c/blockquote>\n\u003cp>原文直接指出旧体系跟不上，A接的是对这个体系进行更新，两边谈论的对象和变化方向一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. redistribution of tech giants’ revenue must be ensured\u003c/h3>\n\u003cblockquote>\n\u003cp>必须确保科技巨头营收的重新分配\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“[xxx] of tech giants’ revenue must be ensured”，保留了相应遮挡。当时的定位线索是：B的 must be ensured 是要求确保某件事，营收又指向第4段 income and revenue；二者都围绕企业收入，所以回看各国认为自己有权征税的那句，看看想确保的究竟是收入的什么方面。读完全文后，做题模式再经交叉验证排除B，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>redistribution是重新分配。原文income and revenue是各国认为自己有权征税的对象，句子没有要求把科技巨头营收本身重新分给不同国家。税收可以影响利益分配，但这不是同一个已被表达的命题。\u003c/p>\n\u003cp>In other words, they all share a view后面已经给出共同看法：国际税收制度未能跟上当前经济。B借revenue换入重新分配的要求，A则把failed to keep up准确转成needs upgrading。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>采取单边措施的国家共同认为必须确保科技巨头营收的重新分配。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 must be ensured 是要求确保某件事，营收又指向第4段 income and revenue；二者都围绕企业收入，所以回看各国认为自己有权征税的那句，看看想确保的究竟是收入的什么方面。\u003c/p>\n\u003cp>redistribution是重新分配。原文income and revenue是各国认为自己有权征税的对象，句子没有要求把科技巨头营收本身重新分给不同国家。税收可以影响利益分配，但这不是同一个已被表达的命题。\u003c/p>\n\u003cp>In other words, they all share a view后面已经给出共同看法：国际税收制度未能跟上当前经济。B借revenue换入重新分配的要求，A则把failed to keep up准确转成needs upgrading。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Technology companies’ revenues must be redistributed among countries.\u003c/p>\n\u003cp>科技公司的营收必须在各国之间重新分配。\u003c/p>\n\u003c/blockquote>\n\u003cp>收入是征税对象，不等于营收本身要重新分配。假设必须写分配比例、参与者或重新配置要求；原文只说明各国主张对某些收入有征税权。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>redistribution of tech giants’ revenue must be ensured\u003cbr>必须确保科技巨头营收的重新分配\u003c/p>\n\u003c/blockquote>\n\u003cp>In other words, they all share a view后面已经给出共同看法：国际税收制度未能跟上当前经济。B借revenue换入重新分配的要求，A则把failed to keep up准确转成needs upgrading。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. tech multinationals’ monopoly should be prevented\u003c/h3>\n\u003cblockquote>\n\u003cp>应当阻止科技跨国公司的垄断\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。C的 monopoly should be prevented 说的却是阻止公司垄断市场。二者虽然都涉及跨国企业，一个围绕国家的征税权，一个围绕公司的竞争地位；原文说税制没跟上经济，不等于把问题说明为企业垄断，也没有把措施的目标改成限制市场份额。\u003c/p>\n\u003cp>第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>采取单边措施的国家共同认为应当阻止科技跨国公司的垄断。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。\u003c/p>\n\u003cp>原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。C的 monopoly should be prevented 说的却是阻止公司垄断市场。二者虽然都涉及跨国企业，一个围绕国家的征税权，一个围绕公司的竞争地位；原文说税制没跟上经济，不等于把问题说明为企业垄断，也没有把措施的目标改成限制市场份额。\u003c/p>\n\u003cp>第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The chief shared objective is to prevent technology companies from monopolising markets.\u003c/p>\n\u003cp>这些国家的共同目标是阻止科技公司垄断市场。\u003c/p>\n\u003c/blockquote>\n\u003cp>反垄断需要市场支配地位和限制竞争的讨论。正文的multinationals指跨国经营身份，税权与经济脱节才是共同理由，不能由公司规模补出垄断。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>tech multinationals’ monopoly should be prevented\u003cbr>应当阻止科技跨国公司的垄断\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. all countries ought to enjoy equal taxing rights\u003c/h3>\n\u003cblockquote>\n\u003cp>所有国家都应享有平等征税权\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。D的 equal taxing rights 把这个要求改成所有国家彼此权利完全相同，all countries 又超过了这里采取措施的这些国家。自己认为某项收入应当由自己征税，并不等于主张每一个国家都对任何收入享有同等权利。\u003c/p>\n\u003cp>原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>采取单边措施的国家共同认为所有国家都应享有平等征税权。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。\u003c/p>\n\u003cp>原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。D的 equal taxing rights 把这个要求改成所有国家彼此权利完全相同，all countries 又超过了这里采取措施的这些国家。自己认为某项收入应当由自己征税，并不等于主张每一个国家都对任何收入享有同等权利。\u003c/p>\n\u003cp>原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.\u003c/p>\n\u003cp>各措施细节不同，但都试图征收它们认为有权征的跨国收入；In other words把共同看法明确概括为国际税制未能跟上当前经济。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明这些国家都认为国际税制没有跟上当前经济。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Every country should possess exactly equal taxing rights.\u003c/p>\n\u003cp>每个国家都应拥有完全平等的征税权。\u003c/p>\n\u003c/blockquote>\n\u003cp>believe they should have a right to tax是对特定收入的权利主张，没有在国与国之间比较权利是否相等。假设多出all countries与equal，超出共同制度诊断。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以法国行动显示税制与数字经济不匹配，本题应回答制度需要更新；至于营收重新分配、反垄断和各国完全平等的征税权，均需专门证据。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>all countries ought to enjoy equal taxing rights\u003cbr>所有国家都应享有平等征税权\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明这些国家都认为国际税制没有跟上当前经济。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>38题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>38. A. the current international tax system needs upgrading\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。\u003c/p>\n\u003cp>B：redistribution是重新分配。\u003c/p>\n\u003cp>C：原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。\u003c/p>\n\u003cp>D：原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。\u003c/p>\n\u003ch2>39题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be learned from Paragraph 5 that the OECD’s current work ______.\u003cbr>从第5段可以知道，OECD目前的工作怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>工作前景推断题。题干要求判断“从第5段可以知道，OECD目前的工作怎么样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consensus by the end of 2020 on an international solution. Both France and the United States are involved in the organization&#39;s work, but France&#39;s digital services tax and the American response raise questions about what the future holds for the international tax system.\u003c/p>\n\u003c/blockquote>\n\u003cp>OECD正与131国寻求国际方案，法国和美国都参与；转折指出双方单边征税与回应又使国际税制未来出现疑问。\u003c/p>\n\u003ch3>A. is being resisted by US companies\u003c/h3>\n\u003cblockquote>\n\u003cp>正在遭到美国公司的抵制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 resisted by US companies 把抵制者写成美国公司；第5段相近的是 the American response，所以回看法美参与合作以及美国回应的那句，分清美国一方与美国公司。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 the American response 与法国的税并列，指美国一方对法国措施的回应；这句话前面又明确说美国参与组织的工作。A的 resisted by US companies 把回应者换成了美国企业，并把回应的对象从法国数字税换成OECD的工作。即使两者都会影响国际税制的前景，也不能把美国对法国税的反应写成美国公司抵制合作工作。\u003c/p>\n\u003cp>参与者、回应者和回应对象都有具体区分；A把国家层面的回应改成公司对组织工作的抵制。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Both France and the United States are involved in the organization&#39;s work, but France&#39;s digital services tax and the American response raise questions about what the future holds for the international tax system.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>OECD目前的协调工作正在遭到美国公司的抵制。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 resisted by US companies 把抵制者写成美国公司；第5段相近的是 the American response，所以回看法美参与合作以及美国回应的那句，分清美国一方与美国公司。\u003c/p>\n\u003cp>原文 the American response 与法国的税并列，指美国一方对法国措施的回应；这句话前面又明确说美国参与组织的工作。A的 resisted by US companies 把回应者换成了美国企业，并把回应的对象从法国数字税换成OECD的工作。即使两者都会影响国际税制的前景，也不能把美国对法国税的反应写成美国公司抵制合作工作。\u003c/p>\n\u003cp>参与者、回应者和回应对象都有具体区分；A把国家层面的回应改成公司对组织工作的抵制。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Both France and the United States are involved in the organization&#39;s work, but France&#39;s digital services tax and the American response raise questions about what the future holds for the international tax system.\u003c/p>\n\u003cp>OECD正与131国寻求国际方案，法国和美国都参与；转折指出双方单边征税与回应又使国际税制未来出现疑问。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>American companies are resisting the OECD’s current negotiations.\u003c/p>\n\u003cp>美国公司正在抵制OECD当前的谈判。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段写the United States参与协调，American response回指国家对法国税的回应。假设把国家换成公司，又把单边反应移成对OECD工作的明确抵制。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>France Leads the Charge on Digital Tax\u003cbr>法国带头推动数字税\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>法国措施推动也扰动国际协调，所以本题应保留前景的不确定性；主旨不能据此指定企业抵制、立即调整或增加参与国这些具体方案。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is being resisted by US companies\u003cbr>正在遭到美国公司的抵制\u003c/p>\n\u003c/blockquote>\n\u003cp>参与者、回应者和回应对象都有具体区分；A把国家层面的回应改成公司对组织工作的抵制。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. is faced with uncertain prospects\u003c/h3>\n\u003cblockquote>\n\u003cp>面临不确定的前景\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 uncertain prospects 说未来尚难确定，第5段的 raise questions about what the future holds 也在问未来会怎样，所以回看but之后法国税与美国回应带来的疑问。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>OECD正与131国合作，法美也在其中，说明国际协调确实进行中；但转折之后，法国税和美国回应raise questions about what the future holds，表明参与不保证顺利达成共同方案。\u003c/p>\n\u003cp>uncertain prospects就是前景仍有疑问的概括。B没有否认合作存在，也没有宣布工作注定失败，而是同时容纳已开展的合作和相冲突的单边行动。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Both France and the United States are involved in the organization&#39;s work, but France&#39;s digital services tax and the American response raise questions about what the future holds for the international tax system.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>OECD目前的协调工作面临不确定的前景。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 uncertain prospects 说未来尚难确定，第5段的 raise questions about what the future holds 也在问未来会怎样，所以回看but之
