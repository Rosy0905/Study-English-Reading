 American response 与法国的税并列，指美国一方对法国措施的回应；这句话前面又明确说美国参与组织的工作。\u003c/p>\n\u003cp>B：OECD正与131国合作，法美也在其中，说明国际协调确实进行中；但转折之后，法国税和美国回应raise questions about what the future holds，表明参与不保证顺利达成共同方案。\u003c/p>\n\u003cp>C：readjusted表示重新调整，immediately又加上必须立刻行动的时间要求。\u003c/p>\n\u003cp>D：131 countries显示合作规模，文章没有把人数不足列为难点。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：法国通过数字服务税法案\u003c/strong>（段落1核心事件） 法国参议院通过数字服务税 → 针对大型跨国公司的数字服务征收新税 → 主要目标：&quot;GAFA&quot;（谷歌、苹果、脸书、亚马逊等美国科技巨头）\u003c/p>\n\u003cp>↓（引发的反应）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：美国的对抗性回应\u003c/strong>（段落2后果与冲突） 等待马克龙签署（支持该措施）→ 可能几周内生效 // 但已引发争议：美国贸易代表调查是否歧视美国公司 → 可能导致对法国的贸易制裁\u003c/p>\n\u003cp>↓（更大的背景）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：全球税收改革趋势\u003c/strong>（段落3-4国际背景） 不仅是法国单边行动 → 更大趋势的一部分：【各国纷纷实施新税收条款：英国DPT + 澳大利亚MAAL + 印度SEP测试 + 欧盟等国考虑数字服务税】→ 共同观点：国际税收体系未能跟上当前经济发展\u003c/p>\n\u003cp>↓（国际协调努力）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：OECD的协调与挑战\u003c/strong>（段落5国际合作困境） OECD与131国合作寻求共识（2020年底前）→ 法美都参与 // 但法国数字税和美国回应引发对国际税收体系未来的质疑\u003c/p>\n\u003cp>↓（警示与展望）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：对未来的警告\u003c/strong>（段落6结论与警示） 法国税是明确警告：【如果无法就改革达成共识 → 其他国家将效仿 → 美国公司将面临来自几十个国家的不同税收（繁重且昂贵）】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：法国数字服务税代表了全球对现行国际税收体系不满的趋势，如果无法通过多边协商达成共识，将导致各国纷纷采取单边措施，最终使跨国公司（尤其是美国科技巨头）面临复杂且昂贵的多重税收负担。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. The Cost of Letting Separate Rules Multiply\u003c/p>\n\u003cp>B. Different Countries Respond to the Same Gap\u003c/p>\n\u003cp>C. A National Tax Becomes a Trade Dispute\u003c/p>\n\u003cp>D. Why Digital Companies Have No Tax Obligations\u003c/p>\n\u003cp>E. Business without Borders Meets Location-based Tax Rules\u003c/p>\n\u003cp>F. A Global Tax Agreement Already Completed\u003c/p>\n\u003cp>G. Acting Alone while Seeking Agreement Together\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A digital business can reach users and earn revenue in a country without maintaining the kind of local presence assumed by older tax arrangements. Advertising, data and online services make the connection between a market and a physical establishment less straightforward. This does not mean that digital companies have no tax obligations anywhere. It means that existing rules may struggle to determine how much of the business should be taxed where its users are located. The dispute begins with that mismatch. Governments are trying to connect economic activity in a market to a tax system developed for businesses whose location was easier to identify.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>France’s proposed response to this difficulty brought the issue into a sharper political form. A tax aimed at revenue from large digital businesses could reach companies serving French users even without the traditional taxable presence. Many prominent firms affected by such a measure were American, and Washington questioned whether the proposal treated them unfairly. The French initiative thus raised two disputes at once: how digital activity should be taxed, and whether a national measure discriminated against foreign companies. The possibility of a trade response made the disagreement larger than a technical debate among tax specialists. A domestic revenue policy had become a source of tension between governments.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>France was not alone in searching for a way around the limits of older arrangements. Other countries had introduced or considered measures intended to bring multinational activity more effectively within their tax systems. Their instruments differed, as did the precise activities and companies they covered. That variation matters: these were not copies of one uniform digital tax. Nevertheless, the repeated attempts point to a common source of pressure. Governments believed that business practices had moved beyond rules built for an earlier economy. Reading the French case alongside these responses reveals an international adjustment problem rather than an isolated disagreement generated by one country’s preferences.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>A shared problem creates a reason to negotiate a shared response, but it does not remove the pressure to act nationally. International talks seek agreement on how taxing rights should be allocated, and countries involved in public disputes may still take part in that effort. At the same time, a government can be unwilling to wait while it believes revenue is escaping its existing rules. It may introduce a domestic measure before the negotiations are finished. Participation in talks and unilateral action can therefore occur together. Their coexistence explains why cooperation may continue even while particular national taxes generate sharp criticism and threats of retaliation.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>If negotiation fails to produce enough common ground, the likely difficulty is not simply one additional tax bill. Businesses could face a growing collection of national measures with different definitions, thresholds and reporting demands. An activity might be treated differently as it crossed jurisdictions, making planning and compliance harder. More governments could follow those that acted first, adding further layers to the problem. This prospect gives coordination a practical purpose. Agreement would not merely reduce diplomatic tension; it could also prevent a fragmented set of responses from becoming an expanding burden on cross-border business. The warning concerns the cumulative effects of uncoordinated action.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】E. Business without Borders Meets Location-based Tax Rules\u003c/p>\n\u003cblockquote>\n\u003cp>跨境业务遇上依赖地点的税收规则\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释数字业务与旧地点标准的错位，将争议限定为征税归属问题。\u003c/p>\n\u003cp>第一句同时交代新业务与旧规则的条件：\u003c/p>\n\u003cblockquote>\n\u003cp>A digital business can reach users and earn revenue in a country without maintaining the kind of local presence assumed by older tax arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>企业在一国获得用户与收入，却未必有旧制度假设的本地实体。问题在于创造业务联系的方式变了，不是说收入本身消失。\u003c/p>\n\u003cp>作者随后限制容易被扩大的一步：\u003c/p>\n\u003cblockquote>\n\u003cp>This does not mean that digital companies have no tax obligations anywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>缺少某种本地存在，并不能推出企业在任何地方都无纳税义务。后句将真实问题限定为如何分配用户所在地应征的部分。\u003c/p>\n\u003cp>结尾把争议概括为经济活动与地点规则的错位：\u003c/p>\n\u003cblockquote>\n\u003cp>Governments are trying to connect economic activity in a market to a tax system developed for businesses whose location was easier to identify.\u003c/p>\n\u003c/blockquote>\n\u003cp>旧制度建立在企业地点较易辨识的情形下，如今要重新连接市场活动和税收归属。标题应同时包括数字业务与地点标准。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>无传统本地存在也能取得用户收入 → 旧地点标准难确定用户市场税收归属 → 并非企业任何地方都不纳税 → 需要重新连接活动与税制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Business without Borders\u003c/code>对应跨境触达用户并赚取收入；\u003ccode>Location-based Tax Rules\u003c/code>对应旧制度依赖可辨认企业地点。\u003ccode>Meets\u003c/code>表现两者相遇产生的制度不适配。\u003c/p>\n\u003cp>再看最强干扰项D：Why Digital Companies Have No Tax Obligations。\u003c/p>\n\u003cp>干扰标题把规则难分配税收扩大成数字企业根本没有义务，恰被\u003ccode>does not mean...no tax obligations anywhere\u003c/code>排除。原文讨论税收权利如何分配，不是在为全面免税解释理由。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】C. A National Tax Becomes a Trade Dispute\u003c/p>\n\u003cblockquote>\n\u003cp>一国税收措施引发贸易争议\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分沿法国措施、美国质疑和潜在贸易回应，展示税收争议如何变为政府间紧张。\u003c/p>\n\u003cp>法国措施首先回应用户市场征税问题：\u003c/p>\n\u003cblockquote>\n\u003cp>A tax aimed at revenue from large digital businesses could reach companies serving French users even without the traditional taxable presence.\u003c/p>\n\u003c/blockquote>\n\u003cp>对象是服务法国用户的大型数字企业收入；这种办法试图绕开旧实体存在标准带来的覆盖困难。\u003c/p>\n\u003cp>美国的反应使问题多了一层：\u003c/p>\n\u003cblockquote>\n\u003cp>Many prominent firms affected by such a measure were American, and Washington questioned whether the proposal treated them unfairly.\u003c/p>\n\u003c/blockquote>\n\u003cp>受影响的大企业中有美国公司，美国因而质疑待遇是否公平。作者在转述这一质疑，并没有在此证明歧视指控必然成立。\u003c/p>\n\u003cp>末段把变化从技术问题提升到政府冲突：\u003c/p>\n\u003cblockquote>\n\u003cp>The possibility of a trade response made the disagreement larger than a technical debate among tax specialists.\u003c/p>\n\u003c/blockquote>\n\u003cp>潜在贸易回应使争议不止于怎么算税；法国国内财政办法引发政府间紧张，就是本段的事件推进。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国设计数字收入税 → 美国企业受影响 → 美国质疑公平待遇 → 税收技术争议扩展为贸易及政府间冲突\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A National Tax\u003c/code>对应法国提出的收入征税措施；\u003ccode>Becomes a Trade Dispute\u003c/code>对应美国质疑以及可能的\u003ccode>trade response\u003c/code>。标题概括事件如何升级，不替任何一方预先判定合法或违法。\u003c/p>\n\u003cp>再看最强干扰项G：Acting Alone while Seeking Agreement Together。\u003c/p>\n\u003cp>本段确实有国家单独行动，但没有展开共同谈判和单边行动并存的两条路径；所有细节都围绕法国措施引发美国反应。以协调困境概括会遗漏本段特有的贸易争议。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】B. Different Countries Respond to the Same Gap\u003c/p>\n\u003cblockquote>\n\u003cp>不同国家回应同一制度缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把法国放回多国改革背景，从不同措施中归纳旧规则落后于商业实践的共同压力。\u003c/p>\n\u003cp>段首用“不止法国”扩大观察范围：\u003c/p>\n\u003cblockquote>\n\u003cp>France was not alone in searching for a way around the limits of older arrangements.\u003c/p>\n\u003c/blockquote>\n\u003cp>接下来其他国家的措施并非离题例子，而是要检验法国争议背后是否存在更广泛的共同压力。\u003c/p>\n\u003cp>作者先承认不同国家手段不相同：\u003c/p>\n\u003cblockquote>\n\u003cp>That variation matters: these were not copies of one uniform digital tax.\u003c/p>\n\u003c/blockquote>\n\u003cp>不同工具覆盖的活动和公司有差异，不能把多个改革都说成相同数字税。承认差异后，\u003ccode>Nevertheless\u003c/code>才引出共同来源。\u003c/p>\n\u003cp>共同点落在旧规则跟不上商业实践：\u003c/p>\n\u003cblockquote>\n\u003cp>Governments believed that business practices had moved beyond rules built for an earlier economy.\u003c/p>\n\u003c/blockquote>\n\u003cp>这解释为何各国会分别尝试调整；末句据此将法国事件放回国际制度适应问题，而非归结为单一国家偏好。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>法国不是唯一行动者 → 各国工具与覆盖对象不同 → 差异背后有共同压力 → 旧规则落后于商业实践构成国际调整问题\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Different Countries\u003c/code>既指多个国家也保留工具差异；\u003ccode>the Same Gap\u003c/code>对应商业实践超出旧规则能力的共同问题。标题同时覆盖差异与共性，而非错误宣称各国已统一税制。\u003c/p>\n\u003cp>再看最强干扰项F：A Global Tax Agreement Already Completed。\u003c/p>\n\u003cp>多个国家都有行动不等于已达成全球协议。原文强调\u003ccode>not copies of one uniform digital tax\u003c/code>，描述的是分散且不同的回应，恰不能用“协议已经完成”概括。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】G. Acting Alone while Seeking Agreement Together\u003c/p>\n\u003cblockquote>\n\u003cp>寻求共同协议时仍采取单边行动\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释国际合作与国内单边行动为何可能并存，而非把参与谈判等同于停止争执。\u003c/p>\n\u003cp>首句同时提出合作理由与国内压力：\u003c/p>\n\u003cblockquote>\n\u003cp>A shared problem creates a reason to negotiate a shared response, but it does not remove the pressure to act nationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>共同制度问题使协商有必要，但国家认为收入正在流失时，仍可能希望先采取本国措施。两种动机不是前后替代关系。\u003c/p>\n\u003cp>段中解释为何不能把参与谈判视为停止单边行动：\u003c/p>\n\u003cblockquote>\n\u003cp>It may introduce a domestic measure before the negotiations are finished.\u003c/p>\n\u003c/blockquote>\n\u003cp>协议完成之前就可推出国内办法；时间先后导致谈判未停而争执已起，不代表共同方案已经落地。\u003c/p>\n\u003cp>核心归纳直接点明并存：\u003c/p>\n\u003cblockquote>\n\u003cp>Participation in talks and unilateral action can therefore occur together.\u003c/p>\n\u003c/blockquote>\n\u003cp>末句解释这种并存为何使合作与批评、报复威胁同时出现。标题要保留这组看似矛盾但可同时成立的事实。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>共同问题推动国际谈判 → 国内收入压力使政府不愿等待 → 协议完成前推出本国措施 → 合作与单边冲突可能同时存在\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Seeking Agreement Together\u003c/code>对应国际谈判；\u003ccode>Acting Alone\u003c/code>对应提前出台国内措施；\u003ccode>while\u003c/code>对应\u003ccode>occur together\u003c/code>，准确表达并行而非先完成合作后再行动。\u003c/p>\n\u003cp>再看最强干扰项F：A Global Tax Agreement Already Completed。\u003c/p>\n\u003cp>本段反复强调\u003ccode>before the negotiations are finished\u003c/code>，讨论的正是协议尚未完成时的选择。出现国际谈判不能证明全球协议已经达成，干扰项把过程偷换成完成状态。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】A. The Cost of Letting Separate Rules Multiply\u003c/p>\n\u003cblockquote>\n\u003cp>放任各自规则增多的代价\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分推演缺乏共同方案时规则不断叠加的成本，说明协调对跨境经营的实际意义。\u003c/p>\n\u003cp>开头把预警限定在协商缺乏共同基础的情形：\u003c/p>\n\u003cblockquote>\n\u003cp>If negotiation fails to produce enough common ground, the likely difficulty is not simply one additional tax bill.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>If\u003c/code>表明这是风险情景，而非宣称协调已经失败；\u003ccode>not simply\u003c/code>又提示后果不止多付某一笔税。\u003c/p>\n\u003cp>具体成本来自规则差异叠加：\u003c/p>\n\u003cblockquote>\n\u003cp>Businesses could face a growing collection of national measures with different definitions, thresholds and reporting demands.\u003c/p>\n\u003c/blockquote>\n\u003cp>定义、门槛和申报要求各异，使跨辖区规划和遵从更困难；更多国家跟进还会增加规则层次。\u003c/p>\n\u003cp>结尾解释协调的实际用途：\u003c/p>\n\u003cblockquote>\n\u003cp>Agreement would not merely reduce diplomatic tension; it could also prevent a fragmented set of responses from becoming an expanding burden on cross-border business.\u003c/p>\n\u003c/blockquote>\n\u003cp>协议既可能缓和外交冲突，也可防止分散措施不断增加企业负担。重心落在不协调行动的累积成本。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>缺少共同方案 → 多国各设定义和程序 → 更多国家跟进使层次增加 → 跨境企业负担扩大 → 协调具有实际经营价值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Separate Rules Multiply\u003c/code>对应各国措施持续增加及差异层层叠加；\u003ccode>Cost\u003c/code>对应规划、申报和遵从负担，不仅是一张税单。标题概括风险机制及其后果。\u003c/p>\n\u003cp>再看最强干扰项C：A National Tax Becomes a Trade Dispute。\u003c/p>\n\u003cp>外交紧张在本段只是协调可解决的一类问题，主要证据是多国规则差异如何增加企业经营负担。只用一国税收引发贸易冲突，会把范围缩回法国与美国，漏掉规则连锁扩散的核心预警。\u003c/p>\n\u003cp>\u003cstrong>45题选A。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Older tax systems often assumed that a company’s important business locations could be identified through a physical presence. Digital services complicate that assumption. A firm can reach users and obtain revenue in a market without establishing the kind of local operation that the older rules expected. This is a mismatch between commercial activity and the legal map used to tax it.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively. These approaches varied rather than forming one identical policy. Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>This mismatch leaves governments asking how to claim a share of revenue generated through their markets. It does not establish that the companies pay no tax anywhere; it raises a question about where particular activity should count. Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate. Companies would then have to navigate different definitions and procedures across markets, while further governments might add new requirements of their own. What begins as one country’s response could become a fragmented collection of burdens for cross-border business.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>The American response sharpened that political interpretation. Officials questioned whether the French measure unfairly targeted American firms, and the possibility of a trade response added pressure to the dispute. Yet a bilateral confrontation did not fully explain why the tax proposal had appeared. France was responding to a concern found beyond its own borders.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>That common motive provides a reason for seeking agreement internationally. Negotiations can address how taxing rights should be shared instead of leaving every country to draw its own boundary. Governments engaged in public disputes may still participate in the same talks. But participation does not remove the temptation to protect revenue through an immediate national measure.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>France supplied a prominent example of such a measure. Its proposed digital-services tax sought to reach revenue connected with French users, including revenue earned by major foreign technology firms. Because many visible companies affected were American, the initiative was quickly viewed across the Atlantic as more than a domestic revenue proposal.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Avoiding that fragmentation is a practical reason to continue negotiating, even when a quick settlement is unlikely. The objective is not merely to end a diplomatic argument but to make taxation more coherent with the business it seeks to reach. Without sufficient common ground, each attempt to repair the old mismatch risks creating another layer of uncertainty.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出数字经营活动与旧地点税制的错位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用其他国家不同措施证明存在共同制度压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>解释错位引发税收归属问题，并引出新的收入征税措施\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>推演单边行动扩散导致多重规则和跨境企业负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>介绍美国公平性质疑及贸易回应，转问更广泛的改革来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由共同动机引出国际谈判，同时保留单边行动压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>以法国措施为例，提示美国企业受影响及美国关注\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以避免碎片化收束，强调共同方案对修补旧制度的意义\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出数字经营活动与旧地点税制的错位 → 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注 → 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 → 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担 → 以避免碎片化收束，强调共同方案对修补旧制度的意义\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → C → G → E → B → F → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：C、G、B、F、D。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → C → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This is a mismatch between commercial activity and the legal map used to tax it.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>This mismatch leaves governments asking how to claim a share of revenue generated through their markets.\u003c/p>\n\u003c/blockquote>\n\u003cp>A最后给出\u003ccode>a mismatch between commercial activity and the legal map used to tax it\u003c/code>。本段首词\u003ccode>This mismatch\u003c/code>完整回指数字活动能跨境、旧税制仍依赖地点的错位，随后说明政府由此追问自己市场产生的收入怎样分配征税权。\u003c/p>\n\u003cp>第二句限制推论：这并非企业在任何地方都不纳税，而是某类活动应该归于哪里。\u003ccode>therefore\u003c/code>再由这一归属困难推出可能的新办法，即不依赖传统本地实体也能触及数字收入。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>France supplied a prominent example of such a measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段用\u003ccode>France supplied a prominent example of such a measure\u003c/code>进入法国案例；\u003ccode>such a measure\u003c/code>指本段末句的新收入征税措施。先说明措施类别，再给具体国家实例。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出数字经营活动与旧地点税制的错位 → 解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>国际谈判段也回应制度问题，但开头\u003ccode>That common motive\u003c/code>需要先证明多国具有共同动机。A只说明一般错位，尚未展示各国回应，也没有为法国下一段的\u003ccode>such a measure\u003c/code>定义措施类别。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成C → G → E的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Some governments have therefore considered measures that reach digital revenue despite the absence of a traditional local establishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>France supplied a prominent example of such a measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末句提出触及数字收入的新措施，本段\u003ccode>such a measure\u003c/code>将其落实为法国数字服务税，形成“政策类型 → 具体实例”。法国用户、外国科技企业等细节才首次建立该事件。\u003c/p>\n\u003cp>因为受影响的显眼公司中有美国企业，段末将视角转向\u003ccode>across the Atlantic\u003c/code>。这不是另起地域闲笔，而是为法国国内方案为何引起美国政治关注准备原因。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Because many visible companies affected were American, the initiative was quickly viewed across the Atlantic as more than a domestic revenue proposal.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The American response sharpened that political interpretation.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E首句\u003ccode>The American response sharpened that political interpretation\u003c/code>接住跨大西洋的政治解读，再讲美方歧视质疑和贸易反应。必须先知道法国措施影响了谁，才能理解美国为何反应。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释错位引发税收归属问题，并引出新的收入征税措施 → 以法国措施为例，提示美国企业受影响及美国关注 → 介绍美国公平性质疑及贸易回应，转问更广泛的改革来源\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\u003c/p>\n\u003c/blockquote>\n\u003cp>其他国家措施段以\u003ccode>Beyond France\u003c/code>起头，需要法国事件已经交代；而且它并不说明美国企业受到何种影响。若放在E前，美国的\u003ccode>that political interpretation\u003c/code>既无直接来源，法国案例也被省略。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>France was responding to a concern found beyond its own borders.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\u003c/p>\n\u003c/blockquote>\n\u003cp>E末句说法国回应的是\u003ccode>a concern found beyond its own borders\u003c/code>。本段以\u003ccode>Beyond France\u003c/code>立即扩展范围，列出其他政府也在寻找更有效征税办法，回答“国界之外是否也有同样担忧”。\u003c/p>\n\u003cp>先承认各国做法不同，再用\u003ccode>nevertheless\u003c/code>从反复出现的改革尝试归纳共同动机：旧安排落后于现代经营。这不是把不同办法说成同一税种，而是从不同回应看共同起因。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>That common motive provides a reason for seeking agreement internationally\u003c/code>回指本段末尾刚明确的共同动机。先证明问题共有，再推出共同谈判的理由，论证顺序不能倒置。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍美国公平性质疑及贸易回应，转问更广泛的改革来源 → 用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>谈判段看起来也能承接E的跨国关切，但其\u003ccode>That common motive\u003c/code>预设不同国家的动机已作归纳。E只说关切不止法国，仍缺少多国尝试及其共同起因的展开。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → F → D的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Their recurrence nevertheless suggested a common motive: officials in different countries believed that existing arrangements had fallen behind the way modern businesses operated.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That common motive provides a reason for seeking agreement internationally.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段归纳\u003ccode>a common motive\u003c/code>：各国都认为规则落后于商业实践。本段\u003ccode>That common motive\u003c/code>直接接住这一结论，并说明国际谈判可分配征税权，不必让每国独自划线。\u003c/p>\n\u003cp>即便政府之间公开争执，仍可参与同一谈判；\u003ccode>But\u003c/code>随后指出参与不能消除立即采取国内措施保护收入的诱因。结尾因此留下“共同协商”与“眼前单边行动”的张力。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>But participation does not remove the temptation to protect revenue through an immediate national measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>If that temptation repeatedly prevails before agreement is reached\u003c/code>中的\u003ccode>that temptation\u003c/code>就是本段末句的单边保护收入诱因。它将前段尚存的压力推演为反复抢先行动的风险。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用其他国家不同措施证明存在共同制度压力 → 由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则累积段一开头需要\u003ccode>that temptation\u003c/code>作为条件，但多国共同动机段尚未说谈判中仍有立即单边行动的诱惑。把风险直接接上去会漏掉国际协商与国内压力并存的中间关系。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → D → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But participation does not remove the temptation to protect revenue through an immediate national measure.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>If that temptation repeatedly prevails before agreement is reached, national measures may accumulate.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾保留\u003ccode>the temptation to protect revenue through an immediate national measure\u003c/code>。本段的\u003ccode>that temptation\u003c/code>指这项国内行动诱因，\u003ccode>before agreement is reached\u003c/code>又限定其发生在共同方案完成之前。\u003c/p>\n\u003cp>如果这种选择不断胜出，各国措施累积，企业就要面对不同定义和程序，后来者还可能加新要求。末句的\u003ccode>a fragmented collection of burdens\u003c/code>是这条连锁过程的结果，不是某一国税额的简单增加。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>What begins as one country’s response could become a fragmented collection of burdens for cross-border business.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Avoiding that fragmentation is a practical reason to continue negotiating, even when a quick settlement is unlikely.\u003c/p>\n\u003c/blockquote>\n\u003cp>H首句\u003ccode>Avoiding that fragmentation\u003c/code>回指刚描述的规则碎片化，以此说明即使短期协议困难也要继续谈判。局部顺序为“单边诱因 → 多重规则累积 → 用避免碎片化解释合作价值”。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由共同动机引出国际谈判，同时保留单边行动压力 → 推演单边行动扩散导致多重规则和跨境企业负担 → 以避免碎片化收束，强调共同方案对修补旧制度的意义\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond France, other governments had also introduced or considered ways to tax multinational activity more effectively.\u003c/p>\n\u003c/blockquote>\n\u003cp>多国措施段虽然也描述差异，却停留在旧规则落后的共同动机，没有推演新要求层层增加的经营负担。H的\u003ccode>that fragmentation\u003c/code>应承接本段已经展开的结果，而非把任何国家政策差异都直接等同于这一风险结论。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>international cooperation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>国际合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a shared understanding\u003c/td>\n\u003ctd>共同理解\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>institutional adaptability\u003c/td>\n\u003ctd>制度适应性\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>constructive dialogue\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>建设性对话\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible digital development\u003c/td>\n\u003ctd>负责任的数字发展\u003c/td>\n\u003ctd>经济消费类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fair allocation of responsibilities\u003c/td>\n\u003ctd>责任的公平分担\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>a broad consensus\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>广泛共识\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a global perspective\u003c/td>\n\u003ctd>全球视野\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>balanced economic development\u003c/td>\n\u003ctd>均衡的经济发展\u003c/td>\n\u003ctd>经济消费类：经济收入\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A and B seeking a shared solution to X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A与B为X寻求共同方案。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, different participants are responding to the same change.\u003c/td>\n\u003ctd>图中不同参与者正对同一变化作出反应。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene highlights the need to keep X in step with Y.\u003c/td>\n\u003ctd>这一场景强调让X与Y同步的必要。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart shows a growing trend towards X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示转向X的趋势正在增强。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures reveal that several groups have followed the same pattern.\u003c/td>\n\u003ctd>数字显示几个群体呈现相同模式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The scale of X differs across the countries shown in the chart.\u003c/td>\n\u003ctd>图中各国的X规模存在差异。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The text presents X as part of a much larger trend.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章把X呈现为一种更大趋势的一部分。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage discusses efforts to reach a broad consensus on X.\u003c/td>\n\u003ctd>文章讨论了就X达成广泛共识的努力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue raises questions about what the future holds for X.\u003c/td>\n\u003ctd>这一问题引出对X未来前景的疑问。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
