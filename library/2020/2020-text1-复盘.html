const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A title alone cannot guarantee lasting benefits</strong></p><p><strong>B. Recognition that supports a town’s people and character</strong></p><p><strong>C. Extending cultural and economic opportunities beyond cities</strong></p><p><strong>D. A national ban on every town’s application</strong></p><p><strong>E. The deeper changes that make a cultural year succeed</strong></p><p><strong>F. A cynical reading of a post-Brexit proposal</strong></p><p><strong>G. Filling hotels as the only measure of cultural achievement</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#x27;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow —village of culture? Suburb of culture? Hamlet of culture?</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#x27;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#x27;s peculiarities —helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>A proposed town-of-culture award would extend recognition beyond the cities that already compete for major cultural titles. Its supporters point to the investment and arts activity generated by earlier winners. Smaller towns, they argue, should have an opportunity to gain similar benefits.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Achieving such changes depends on vision and cooperation among local authorities, businesses, community groups and cultural organisations. Glasgow’s development as a lasting centre of the arts shows that it can be done. Its experience supplies support for the possibility, not a guarantee that every title holder will succeed.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme. Recognition could help sustain local shops, facilities and the people who use them. A cultural award then becomes a means of supporting the community instead of merely advertising it.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Not everyone reads the proposal in this practical way. Some see it as consolation for Britain’s loss of access to a more prestigious European title. From that perspective, a new award risks becoming another episode of self-celebration rather than a source of genuine local improvement.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The risk of an empty celebration is real enough to require caution. A badly managed cultural year can arrive and depart like a tide, creating brief attention without lasting gains. Possessing a title is therefore not, by itself, evidence that the community will become stronger.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>The opportunity is uneven under the existing competition because towns generally have fewer resources for a successful bid. A separate award could attract funding and create jobs. The proposal therefore responds to a practical difference in competitive capacity rather than a formal ban on towns taking part.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>A stronger community requires changes that survive the year of events. Successful places reshape residents’ ambitions and develop a more confident image of themselves. Filling hotels and attracting favourable headlines may help, but neither is an adequate substitute for those deeper changes.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Seen in this way, the proposal deserves a constructive welcome. The proper response is neither automatic celebration nor automatic dismissal, but action directed at lasting local benefits. An award gains value when it serves a town’s future rather than becoming an end in itself.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>institute</td>\n<td>v.设立</td>\n<td>award</td>\n<td>n.奖项</td>\n<td>proposal</td>\n<td>n.提议</td>\n</tr>\n<tr>\n<td>sit alongside</td>\n<td>与……并列</td>\n<td>investment</td>\n<td>n.投资</td>\n<td>avalanche</td>\n<td>n.大量涌入</td>\n</tr>\n<tr>\n<td>confined to</td>\n<td>局限于</td>\n<td>resources</td>\n<td>n.资源</td>\n<td>bid</td>\n<td>n.申报；竞标</td>\n</tr>\n<tr>\n<td>funding</td>\n<td>n.资金</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>booby prize</td>\n<td>安慰奖</td>\n<td>prestigious</td>\n<td>adj.声望高的</td>\n<td>sought-after</td>\n<td>adj.抢手的</td>\n</tr>\n<tr>\n<td>bag</td>\n<td>v.获得</td>\n<td>cynic</td>\n<td>n.愤世嫉俗者</td>\n<td>speculate</td>\n<td>v.推测</td>\n</tr>\n<tr>\n<td>on the verge of</td>\n<td>濒临</td>\n<td>desperation</td>\n<td>n.绝望</td>\n<td>reinvent</td>\n<td>v.重塑</td>\n</tr>\n<tr>\n<td>hamlet</td>\n<td>n.小村庄</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>cure-all</td>\n<td>n.万能药</td>\n<td>prominence</td>\n<td>n.显著地位</td>\n<td>for a spell</td>\n<td>短时间</td>\n</tr>\n<tr>\n<td>lasting benefits</td>\n<td>持久益处</td>\n<td>high-profile</td>\n<td>adj.备受关注的</td>\n<td>aspirations</td>\n<td>n.抱负</td>\n</tr>\n<tr>\n<td>nudge</td>\n<td>v.推动</td>\n<td>self-image</td>\n<td>n.自我形象</td>\n<td>vision</td>\n<td>n.远见</td>\n</tr>\n<tr>\n<td>powerhouse</td>\n<td>n.强大的中心</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第4段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>honour</td>\n<td>v.尊重</td>\n<td>peculiarities</td>\n<td>n.特色</td>\n<td>sustain</td>\n<td>v.维持</td>\n</tr>\n<tr>\n<td>high street</td>\n<td>商业主街</td>\n<td>facilities</td>\n<td>n.设施</td>\n<td>above all</td>\n<td>最重要的是</td>\n</tr>\n<tr>\n<td>hope-filled</td>\n<td>adj.充满希望的</td>\n<td>turn into action</td>\n<td>付诸行动</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<h3>意群划分 · 第1段</h3>\n<p>A group of Labour MPs, / among them Yvette Cooper, / are bringing in the new year / with a call / to institute / a UK &quot;town of culture&quot; award.</p>\n<p>The proposal is / that it should sit alongside / the existing city of culture title, / which was held by Hull in 2017, / and has been awarded to Coventry for 2021.</p>\n<p>Cooper and her colleagues argue / that the success of the crown / for Hull, / where it brought in £220m of investment / and an avalanche of arts, / ought not to be confined to cities.</p>\n<p>Britain&#39;s towns, / it is true, / are not prevented from applying, / but they generally lack the resources / to put together a bid / to beat their bigger competitors.</p>\n<p>A town of culture award could, / it is argued, / become an annual event, / attracting funding / and creating jobs.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>一群工党议员，/ 其中包括伊薇特·库珀，/ 正在新年伊始带来 / 一个呼吁 / 设立 / 英国&quot;文化小镇&quot;奖。</p>\n<p>这个提议是 / 它应该与 / 现有的文化城市称号并列，/ 该称号在2017年由赫尔获得，/ 并已授予考文垂2021年。</p>\n<p>库珀和她的同事们认为 / 这个桂冠的成功 / 对赫尔来说，/ 在那里它带来了2.2亿英镑的投资 / 和大量的艺术活动，/ 不应该仅限于城市。</p>\n<p>英国的小镇，/ 确实，/ 并未被阻止申请，/ 但它们通常缺乏资源 / 来整合一个申请 / 以击败更大的竞争对手。</p>\n<p>文化小镇奖可以，/ 有人认为，/ 成为一个年度活动，/ 吸引资金 / 并创造就业。</p>\n<h3>标准译文 · 第1段</h3>\n<p>一群工党议员，包括伊薇特·库珀在内，在新年伊始呼吁设立英国&quot;文化小镇&quot;奖。该提议是让这个奖项与现有的文化城市称号并列——2017年赫尔获得了该称号，2021年已授予考文垂。库珀和她的同事们认为，赫尔获得这个桂冠的成功（带来了2.2亿英镑的投资和大量艺术活动）不应该仅限于城市。确实，英国的小镇并未被禁止申请，但它们通常缺乏资源来准备一个能击败更大竞争对手的申请。有人认为，文化小镇奖可以成为一个年度活动，吸引资金并创造就业。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n<h3>意群划分 · 第2段</h3>\n<p>Some might see the proposal / as a booby prize / for the fact / that Britain is no longer able to apply / for the much more prestigious title / of European capital of culture, / a sought-after award / bagged by Glasgow in 1990 / and Liverpool in 2008.</p>\n<p>A cynic might speculate / that the UK is on the verge / of disappearing / into an endless fever of self-celebration / in its desperation / to reinvent itself / for the post-Brexit world: / after town of culture, / who knows what will follow / —village of culture? / Suburb of culture? / Hamlet of culture?</p>\n<h3>意群翻译 · 第2段</h3>\n<p>有些人可能视这个提议 / 为一个安慰奖 / 对于这个事实 / 英国不再能够申请 / 更有声望的称号 / 欧洲文化之都，/ 一个备受追捧的奖项 / 由格拉斯哥在1990年获得 / 以及利物浦在2008年。</p>\n<p>一个愤世嫉俗者可能推测 / 英国正处于边缘 / 消失 / 进入无休止的自我庆祝狂热中 / 在其绝望中 / 重新塑造自己 / 为脱欧后的世界：/ 在文化小镇之后，/ 谁知道会接着什么 / —文化村庄？/ 文化郊区？/ 文化小村？</p>\n<h3>标准译文 · 第2段</h3>\n<p>有些人可能将这个提议视为一个安慰奖，因为英国已经不能再申请更有声望的欧洲文化之都称号了——这个备受追捧的奖项曾在1990年被格拉斯哥获得，2008年被利物浦获得。愤世嫉俗者可能会推测，英国正处于陷入无休止自我庆祝狂热的边缘，绝望地想要为脱欧后的世界重新塑造自己：在文化小镇之后，谁知道接下来会是什么——文化村庄？文化郊区？文化小村？</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n<h3>意群划分 · 第3段</h3>\n<p>It is also wise to recall / that such titles are not a cure-all.</p>\n<p>A badly run &quot;year of culture&quot; / washes in and washes out / of a place / like the tide, / bringing prominence for a spell / but leaving no lasting benefits / to the community.</p>\n<p>The really successful holders / of such titles / are those / that do a great deal more / than fill hotel bedrooms / and bring in high-profile arts events / and good press for a year.</p>\n<p>They transform the aspirations / of the people who live there; / they nudge the self-image of the city / into a bolder and more optimistic light.</p>\n<p>It is hard to get right, / and requires a remarkable degree of vision, / as well as cooperation / between city authorities, / the private sector, / community groups / and cultural organisations.</p>\n<p>But it can be done: / Glasgow&#39;s year / as European capital of culture / can certainly be seen / as one of a complex series of factors / that have turned the city / into the powerhouse / of art, music and theatre / that it remains today.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>明智的做法是记住 / 这样的称号不是万能药。</p>\n<p>一个运作不善的&quot;文化年&quot; / 涌入又涌出 / 一个地方 / 像潮水一样，/ 带来短暂的突出地位 / 但没有留下持久的益处 / 给社区。</p>\n<p>真正成功的持有者 / 这些称号的 / 是那些 / 做了更多事情的 / 而不仅仅是填满酒店房间 / 引进高调的艺术活动 / 和一年的好新闻。</p>\n<p>他们改变抱负 / 住在那里的人们的；/ 他们推动城市的自我形象 / 进入更大胆和更乐观的光芒。</p>\n<p>这很难做对，/ 需要非凡程度的远见，/ 以及合作 / 在市政当局之间，/ 私营部门，/ 社区团体 / 和文化组织。</p>\n<p>但这是可以做到的：/ 格拉斯哥的一年 / 作为欧洲文化之都 / 当然可以被看作 / 一系列复杂因素之一 / 已经将这座城市转变 / 成为强大的中心 / 艺术、音乐和戏剧的 / 它今天仍然保持着。</p>\n<h3>标准译文 · 第3段</h3>\n<p>明智的做法是记住，这样的称号并非万能药。一个运作不善的&quot;文化年&quot;就像潮水一样涌入又涌出一个地方，带来短暂的突出地位，但没有给社区留下持久的益处。真正成功的称号持有者是那些做了远不止填满酒店房间、引进高调艺术活动和获得一年好新闻的地方。他们改变了当地居民的抱负；他们将城市的自我形象推向更大胆、更乐观的方向。这很难做对，需要非凡的远见，以及市政当局、私营部门、社区团体和文化组织之间的合作。但这是可以做到的：格拉斯哥作为欧洲文化之都的那一年，当然可以被看作是将这座城市转变为今天仍然保持的艺术、音乐和戏剧强大中心的一系列复杂因素之一。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n<h3>意群划分 · 第4段</h3>\n<p>A &quot;town of culture&quot; / could be not just about the arts / but about honouring a town&#39;s peculiarities / —helping sustain its high street, / supporting local facilities / and above all / celebrating its people.</p>\n<p>Jeremy Wright, / the culture secretary, / should welcome / this positive, hope-filled proposal, / and turn it into action.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>一个&quot;文化小镇&quot; / 可以不仅仅关于艺术 / 而是关于尊重小镇的特色 / —帮助维持其主街道，/ 支持当地设施 / 最重要的是 / 庆祝它的人民。</p>\n<p>杰里米·赖特，/ 文化大臣，/ 应该欢迎 / 这个积极的、充满希望的提议，/ 并将其付诸行动。</p>\n<h3>标准译文 · 第4段</h3>\n<p>&quot;文化小镇&quot;可以不仅仅关于艺术，而是关于尊重小镇的特色——帮助维持其主街道，支持当地设施，最重要的是庆祝它的人民。文化大臣杰里米·赖特应该欢迎这个积极的、充满希望的提议，并将其付诸行动。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>A group of Labour MPs：(among them Yvette Cooper) → are bringing in the new year：(with a call：(to institute → a UK &quot;town of culture&quot; award)).</p>\n<p>The proposal is：(that it should sit alongside → the existing city of culture title：(which was held by Hull in 2017 + has been awarded to Coventry for 2021)).</p>\n<p>Cooper and her colleagues argue：(that the success of the crown：(for Hull：(where it brought in £220m of investment + an avalanche of arts)) → ought not to be confined to cities).</p>\n<p>Britain&#39;s towns：(it is true) → are not prevented from applying // but they generally lack the resources：(to put together a bid：(to beat their bigger competitors)).</p>\n<p>A town of culture award could：(it is argued) → become an annual event：(attracting funding + creating jobs).</p>\n<p><strong>第2段</strong></p>\n<p>Some might see the proposal → as a booby prize：(for the fact：(that Britain is no longer able to apply → for the much more prestigious title：(of European capital of culture：(a sought-after award：(bagged by Glasgow in 1990 + Liverpool in 2008))))).</p>\n<p>A cynic might speculate：(that the UK is on the verge：(of disappearing → into an endless fever of self-celebration：(in its desperation：(to reinvent itself：(for the post-Brexit world)))))：after town of culture → who knows what will follow — (village of culture? + Suburb of culture? + Hamlet of culture?)</p>\n<p><strong>第3段</strong></p>\n<p>It is also wise to recall：(that such titles are not a cure-all).</p>\n<p>A badly run &quot;year of culture&quot; → washes in and washes out：(of a place)：(like the tide) → bringing prominence for a spell // but leaving no lasting benefits：(to the community).</p>\n<p>The really successful holders：(of such titles) → are those：(that do a great deal more：(than fill hotel bedrooms + bring in high-profile arts events + good press for a year)).</p>\n<p>They transform the aspirations：(of the people who live there) + they nudge the self-image of the city：(into a bolder and more optimistic light).</p>\n<p>It is hard to get right + requires a remarkable degree of vision + cooperation：(between city authorities + the private sector + community groups + cultural organisations).</p>\n<p>But it can be done：Glasgow&#39;s year：(as European capital of culture) → can certainly be seen：(as one of a complex series of factors：(that have turned the city → into the powerhouse：(of art, music and theatre)：(that it remains today))).</p>\n<p><strong>第4段</strong></p>\n<p>A &quot;town of culture&quot; → could be not just about the arts // but about honouring a town&#39;s peculiarities：(helping sustain its high street + supporting local facilities + above all celebrating its people).</p>\n<p>Jeremy Wright：(the culture secretary) → should welcome：(this positive, hope-filled proposal) + turn it into action.</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>一群工党议员：(其中包括伊薇特·库珀) → 正在新年伊始带来：(一个呼吁：(设立 → 英国&quot;文化小镇&quot;奖))。</p>\n<p>这个提议是：(它应该与 → 现有的文化城市称号并列：(该称号在2017年由赫尔获得 + 已授予考文垂2021年))。</p>\n<p>库珀和她的同事们认为：(这个桂冠的成功：(对赫尔来说：(在那里它带来了2.2亿英镑的投资 + 大量的艺术活动)) → 不应该仅限于城市)。</p>\n<p>英国的小镇：(确实) → 并未被阻止申请 // 但它们通常缺乏资源：(来整合一个申请：(以击败更大的竞争对手))。</p>\n<p>文化小镇奖可以：(有人认为) → 成为一个年度活动：(吸引资金 + 创造就业)。</p>\n<p><strong>第2段</strong></p>\n<p>有些人可能视这个提议 → 为一个安慰奖：(对于这个事实：(英国不再能够申请 → 更有声望的称号：(欧洲文化之都：(一个备受追捧的奖项：(由格拉斯哥在1990年获得 + 利物浦在2008年)))))。</p>\n<p>一个愤世嫉俗者可能推测：(英国正处于边缘：(消失 → 进入无休止的自我庆祝狂热中：(在其绝望中：(重新塑造自己：(为脱欧后的世界)))))：在文化小镇之后 → 谁知道会接着什么 — (文化村庄？+ 文化郊区？+ 文化小村？)</p>\n<p><strong>第3段</strong></p>\n<p>明智的做法是记住：(这样的称号不是万能药)。</p>\n<p>一个运作不善的&quot;文化年&quot; → 涌入又涌出：(一个地方)：(像潮水一样) → 带来短暂的突出地位 // 但没有留下持久的益处：(给社区)。</p>\n<p>真正成功的持有者：(这些称号的) → 是那些：(做了更多事情的：(而不仅仅是填满酒店房间 + 引进高调的艺术活动 + 一年的好新闻))。</p>\n<p>他们改变抱负：(住在那里的人们的) + 他们推动城市的自我形象：(进入更大胆和更乐观的光芒)。</p>\n<p>这很难做对 + 需要非凡程度的远见 + 合作：(在市政当局 + 私营部门 + 社区团体 + 文化组织之间)。</p>\n<p>但这是可以做到的：格拉斯哥的一年：(作为欧洲文化之都) → 当然可以被看作：(一系列复杂因素之一：(已经将这座城市转变 → 成为强大的中心：(艺术、音乐和戏剧的)：(它今天仍然保持着)))。</p>\n<p><strong>第4段</strong></p>\n<p>一个&quot;文化小镇&quot; → 可以不仅仅关于艺术 // 而是关于尊重小镇的特色：(帮助维持其主街道 + 支持当地设施 + 最重要的是庆祝它的人民)。</p>\n<p>杰里米·赖特：(文化大臣) → 应该欢迎：(这个积极的、充满希望的提议) + 将其付诸行动。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Cooper and her colleagues argue / that the success of the crown / for Hull, / where it brought in £220m of investment / and an avalanche of arts, / ought not to be confined to cities.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>库珀和她的同事们认为 / 这个桂冠的成功 / 对赫尔来说，/ 在那里它带来了2.2亿英镑的投资 / 和大量的艺术活动，/ 不应该仅限于城市。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>where引导对Hull成功的具体解释，将投资和艺术活动并列；主句判断在ought not后。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>库珀和她的同事们认为  这个桂冠的成功  对赫尔来说， 在那里它带来了2.2亿英镑的投资  和大量的艺术活动， 不应该仅限于城市。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>议员们认为Hull获得的成功不应仅限于城市。</p>\n</blockquote>\n<p>先交代谁的主张，再补成功例子的收益，最后落到不应局限于城市。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>库珀和她的同事们认为，赫尔获得这个桂冠的成功（带来了2.2亿英镑的投资和大量艺术活动）不应该仅限于城市。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>ought not to是应然主张，不是说所有城镇已经获得相同投资。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>库珀和她的同事们认为，赫尔获得这个桂冠的成功（带来了2.2亿英镑的投资和大量艺术活动）不应该仅限于城市。</p>\n</blockquote>\n<h2>2. 第3段第5句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>It is hard to get right, / and requires a remarkable degree of vision, / as well as cooperation / between city authorities, / the private sector, / community groups / and cultural organisations.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>这很难做对，/ 需要非凡程度的远见，/ 以及合作 / 在市政当局之间，/ 私营部门，/ 社区团体 / 和文化组织。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把vision与as well as cooperation看成并列条件，between列出的四类主体同属合作一层。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>这很难做对， 需要非凡程度的远见， 以及合作  在市政当局之间， 私营部门， 社区团体  和文化组织。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>成功需要远见以及各方合作。</p>\n</blockquote>\n<p>先说难以做对，再分别说明远见与合作两项要求。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>这很难做对，需要非凡的远见，以及市政当局、私营部门、社区团体和文化组织之间的合作。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>remarkable degree强调要求较高，不能改成获得称号后自然成功。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>这很难做对，需要非凡的远见，以及市政当局、私营部门、社区团体和文化组织之间的合作。</p>\n</blockquote>\n<h2>3. 第4段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities —helping sustain its high street, supporting local facilities and above all celebrating its people.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>A &quot;town of culture&quot; / could be not just about the arts / but about honouring a town&#39;s peculiarities / —helping sustain its high street, / supporting local facilities / and above all / celebrating its people.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>一个&quot;文化小镇&quot; / 可以不仅仅关于艺术 / 而是关于尊重小镇的特色 / —帮助维持其主街道，/ 支持当地设施 / 最重要的是 / 庆祝它的人民。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>not just ... but ...不是否定艺术，而是超越艺术；破折号后用三个动作具体解释。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>一个&quot;文化小镇&quot;  可以不仅仅关于艺术  而是关于尊重小镇的特色  —帮助维持其主街道， 支持当地设施  最重要的是  庆祝它的人民。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>文化小镇应重视地方特色与居民。</p>\n</blockquote>\n<p>先保留不仅仅关于艺术，再说尊重特色，最后依次列主街、设施、居民。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>&quot;文化小镇&quot;可以不仅仅关于艺术，而是关于尊重小镇的特色——帮助维持其主街道，支持当地设施，最重要的是庆祝它的人民。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>above all让居民居于最重要位置；peculiarities在此是特色，不是缺陷。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>&quot;文化小镇&quot;可以不仅仅关于艺术，而是关于尊重小镇的特色——帮助维持其主街道，支持当地设施，最重要的是庆祝它的人民。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>21题</h2>\n<blockquote>\n<p>Cooper and her colleagues argue that a “town of culture” award could ______.</p>\n<p>库珀和她的同事们认为，“文化城镇”奖可以______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：区分提议为何提出与它预期带来的作用，重点看吸引资金和创造就业的归纳。</p>\n<p>题干直接给出Cooper and her colleagues，第1段第3句出现同样的人物。先从第1段开头读到结尾，弄清他们为何提出文化城镇奖，以及他们期待这项奖带来什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it should sit alongside the existing city of culture title</p>\n<p>Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors</p>\n<p>but they generally lack the resources to put together a bid to beat their bigger competitors</p>\n</blockquote>\n<h3>A. consolidate the town-city ties in Britain</h3>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><code>consolidate the town-city ties</code>说的是两类地方之间的关系，第1段的<code>sit alongside</code>说的是文化城镇奖与文化之城称号并列，因此回看第2句，再结合第4句中城镇与较大竞争者的关系。</p>\n<p><code>A</code>的<code>consolidate the town-city ties</code>把设立并列奖项改成加强城镇与城市的联系。奖项之间的并列，以及申请者之间的竞争，都没有建立设奖使两类地方联系更紧密的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>提议先与现有称号并列，再说明城镇资源少、难赢大城市，最后期待设奖吸引资金与岗位。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could consolidate the town-city ties in Britain.</p>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p>A需要共同活动或往来使town-city ties更紧。并列奖项和竞争资源差异都不能自动产生这项合作联系。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. promote cooperation among Britain’s towns</h3>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能促进英国各城镇合作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>资金与就业是设奖预期带给城镇的收益，B却说英国各城镇互相合作，原段没有把共同办事接到这项奖上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能促进英国各城镇合作。</p>\n</blockquote>\n<p><code>promote cooperation</code>把设奖的作用放在城镇共同做事上，第1段末句的<code>attracting funding and creating jobs</code>直接列出设奖的预期作用，所以回看末句，并联系前一句城镇缺乏资源的处境。</p>\n<p><code>B</code>的<code>promote cooperation</code>则说这项活动让英国各城镇彼此合作，把资金和就业的收益改接成城镇之间共同做事的关系。原文这两句没有把城镇联合行动设为获得这些收益的做法。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>Cooper等人希望城市已享有的文化经济机会延伸到城镇，理由在于各城镇竞标能力不足。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could promote cooperation among Britain’s towns.</p>\n<p>Cooper等认为文化城镇奖可能促进英国各城镇合作。</p>\n</blockquote>\n<p>B需要towns之间合作的行动。后文确实提多方合作，但那是同一地方办好文化年的条件，不能挪成首段所说城镇彼此合作的设奖效果。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. increase the economic strength of Britain’s towns</h3>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能增强英国城镇经济实力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>吸引资金、创造岗位都改善地方经济，C的economic strength概括这两项作用，could保持提议的预期性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能增强英国城镇经济实力。</p>\n</blockquote>\n<p><code>economic strength</code>说的是城镇的经济状况，第1段末句的<code>attracting funding and creating jobs</code>正是资金和就业方面的作用，因此回看这句对文化城镇奖的预期。</p>\n<p>原文说这项奖可以成为年度活动，并通过<code>attracting funding and creating jobs</code>为城镇吸引资金、创造岗位。<code>C</code>的<code>increase the economic strength</code>把这两项具体作用概括为增强经济实力，作用的承担者仍是设奖所面向的城镇，<code>could</code>也保持了可能性，没有把预期改成已经实现的结果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>Hull的投资与艺术活动先示范已有收益，城镇较弱的竞标资源随后解释为什么需单设机会，末句明确列资金和就业。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could increase the economic strength of Britain’s towns.</p>\n<p>Cooper等认为文化城镇奖可能增强英国城镇经济实力。</p>\n</blockquote>\n<p>C没有声称奖项已实现全部经济收益，而是将可能吸引的资源和岗位合为经济实力的增强，受益对象仍是城镇。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. focus Britain’s limited resources on cultural events</h3>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能把英国有限资源集中到文化活动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>lack resources指城镇难以组织能击败大城市的竞标，D却变成全国资源有限并应集中投向文化，改变了范围和配置方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能把英国有限资源集中到文化活动。</p>\n</blockquote>\n<p><code>Britain’s limited resources</code>让人回到第1段第4句的<code>they generally lack the resources</code>；要判断设奖后资源如何变化，还要看末句的<code>attracting funding</code>。前一句说明谁缺资源，后一句说明奖项怎样影响资金。</p>\n<p><code>D</code>的<code>Britain’s limited resources</code>把城镇在竞争中的资源不足扩大成整个英国资源有限，又把吸引资金改成把全国资源集中用于文化活动。原文没有作出这项全国资源配置安排。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>作者先交代申请资格没有受阻，再说实际竞标资源不足，奖项所期待的动作是attracting funding。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could focus Britain’s limited resources on cultural events.</p>\n<p>Cooper等认为文化城镇奖可能把英国有限资源集中到文化活动。</p>\n</blockquote>\n<p>D需要全国资源如何集中分配的安排。吸引新资金不等于把既有有限资源集中到文化活动，城镇资源不足也不等于英国整体资源不足。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. C</strong></p>\n</blockquote>\n<ul>\n<li>A：sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。</li>\n<li>B：资金与就业是设奖预期带给城镇的收益，B却说英国各城镇互相合作，原段没有把共同办事接到这项奖上。</li>\n<li>C：吸引资金、创造岗位都改善地方经济，C的economic strength概括这两项作用，could保持提议的预期性质。</li>\n<li>D：lack resources指城镇难以组织能击败大城市的竞标，D却变成全国资源有限并应集中投向文化，改变了范围和配置方式。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>According to Paragraph 2, the proposal might be regarded by some as ______.</p>\n<p>根据第2段，有些人可能把这项提议看作______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点细节题：some限定为部分人的看法，须分清他们的讥讽与作者自己的最终立场。</p>\n<p>题干直接指定Paragraph 2，且might be regarded by some与该段开头Some might see相接。把第2段从头读到尾，区分有些人的看法和随后冷嘲热讽者的猜测。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply</p>\n<p>an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world</p>\n<p>as a booby prize for the fact that Britain is no longer able to apply</p>\n</blockquote>\n<h3>A. a sensible compromise</h3>\n<blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>booby prize带有失利后的安慰、讥讽意味，随后自我庆祝热潮又加强轻视态度。sensible compromise却肯定它是明智折中。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><code>sensible</code>是在肯定提议明智，而段首的<code>a booby prize</code>是对同一提议的评价，因此回看第1句；后一句又以<code>an endless fever of self-celebration</code>描写冷嘲热讽者所猜测的情形，可以一并看清这里的评价方向。</p>\n<p>原文把提议称为<code>a booby prize</code>，指英国失去申请另一称号的机会后给自己的一种安慰；接着把自我庆祝写成<code>endless fever</code>，并放在<code>desperation</code>之中。这是在交代轻视、讥讽的看法。<code>A</code>的<code>sensible</code>却把这种评价改为提议明智。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n<p>有些人可能把提议看成安慰奖，因为英国已不能再申请更有声望的欧洲文化之都称号；Glasgow与Liverpool分别曾在1990年和2008年获得它。冷嘲者或会猜测：英国急于在脱欧后重新塑造自己，正陷入无尽自我庆祝。文化城镇之后还会有什么——文化村、文化郊区、文化小村落？</p>\n</blockquote>\n<p>段首先将提议连到失去欧洲奖项资格，再以cynic的口吻猜测各种国内文化名号会不断增加。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Some regard the proposal as a sensible compromise.</p>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p>A需要不同利益经过协调形成合理方案的肯定。原段转述的是安慰自己与徒增庆祝名目的质疑，不是作者末段的积极评价。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. a self-deceiving attempt</h3>\n<blockquote>\n<p>有些人可能把这项提议看作一种自欺的尝试。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>失去申请更有声望称号的机会，却不断另设文化名目庆祝自己，B用自欺尝试概括这些人眼中的安慰方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>有些人可能把这项提议看作一种自欺的尝试。</p>\n</blockquote>\n<p><code>self-deceiving attempt</code>指靠某种做法安慰自己，第1句的<code>a booby prize</code>把提议与英国不能再申请欧洲文化之都相连，第2句的<code>self-celebration</code>又说到自我庆祝，因此把这两句合起来看。</p>\n<p>原文先把提议写成英国失去另一称号申请机会后的<code>a booby prize</code>，再描写在急切重塑自己的心情中不断<code>self-celebration</code>，并用文化城镇之后还可能有文化村庄来讥讽奖项继续增多。<code>B</code>的<code>self-deceiving attempt</code>把这种做法概括成自我欺骗：失去原有机会，却通过继续设立自己的名目来安慰自己。这是对两句相连意思的推断，并没有把英国写成欺骗其他国家。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n<p>有些人可能把提议看成安慰奖，因为英国已不能再申请更有声望的欧洲文化之都称号；Glasgow与Liverpool分别曾在1990年和2008年获得它。冷嘲者或会猜测：英国急于在脱欧后重新塑造自己，正陷入无尽自我庆祝。文化城镇之后还会有什么——文化村、文化郊区、文化小村落？</p>\n</blockquote>\n<p>booby prize先写失落后的替代品，self-celebration与desperation接着渲染重塑自身时的自我安慰，连续反问加强讥讽。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Some regard the proposal as a self-deceiving attempt.</p>\n<p>有些人可能把这项提议看作一种自欺的尝试。</p>\n</blockquote>\n<p>B说的是some或cynic可能怎样看，不是作者最后也这样定论。它将两句共同的自我安慰意味连起来，没有改成英国欺骗其他国家。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. an eye-catching bonus</h3>\n<blockquote>\n<p>有些人可能把这项提议看作引人注目的额外奖励。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>bonus是额外得到的好处，booby prize则是失去原机会后的安慰。C把损失背景改成获得一项显眼的额外奖励。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>有些人可能把这项提议看作引人注目的额外奖励。</p>\n</blockquote>\n<p><code>bonus</code>将它说成额外得到的好处，第2段第1句的<code>a booby prize</code>也在给这项提议定性，所以回看该句如何把它与<code>no longer able to apply</code>相连。</p>\n<p>原文的<code>a booby prize</code>针对的是英国<code>no longer able to apply</code>这一损失：不能再争取原来的称号，就用这项提议作安慰。<code>C</code>的<code>an eye-catching bonus</code>则把它写成吸引眼球的额外奖励，把失去机会后的安慰改成又多得到一份好处，同时增加了引人注目的评价。原句建立的是损失与安慰的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n<p>有些人可能把提议看成安慰奖，因为英国已不能再申请更有声望的欧洲文化之都称号；Glasgow与Liverpool分别曾在1990年和2008年获得它。冷嘲者或会猜测：英国急于在脱欧后重新塑造自己，正陷入无尽自我庆祝。文化城镇之后还会有什么——文化村、文化郊区、文化小村落？</p>\n</blockquote>\n<p>no longer able to apply先建立缺失，后面的国内称号增生被描写为self-celebration，评价方向并非惊喜获奖。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Some regard the proposal as an eye-catching bonus.</p>\n<p>有些人可能把这项提议看作引人注目的额外奖励。</p>\n</blockquote>\n<p>C需要在既有好处之外又多得一份奖励的关系。实际是用另一名目补偿不能申请欧洲头衔的处境，不能只因两者都是prize就忽略语气和背景。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. an inaccessible target</h3>\n<blockquote>\n<p>有些人可能把这项提议看作无法实现的目标。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>不能再申请的对象是European capital of culture，国内town of culture是拟设的替代项目。D把不可及性转给提议本身。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>有些人可能把这项提议看作无法实现的目标。</p>\n</blockquote>\n<p><code>inaccessible target</code>让人回到第1句的<code>no longer able to apply</code>，那里确实有一个英国不能再申请的称号；要看清不能申请的对象，须把<code>for</code>之后的<code>European capital of culture</code>一起读完。</p>\n<p>原文的<code>no longer able to apply</code>指向欧洲文化之都称号，文化城镇奖的<code>proposal</code>则被说成面对这种处境的安慰奖。<code>D</code>的<code>inaccessible target</code>把不能取得的目标改成文化城镇奖提议本身。两个对象不同：英国不能再申请欧洲称号，不等于它提出的国内城镇奖无法实现。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n<p>有些人可能把提议看成安慰奖，因为英国已不能再申请更有声望的欧洲文化之都称号；Glasgow与Liverpool分别曾在1990年和2008年获得它。冷嘲者或会猜测：英国急于在脱欧后重新塑造自己，正陷入无尽自我庆祝。文化城镇之后还会有什么——文化村、文化郊区、文化小村落？</p>\n</blockquote>\n<p>作者转述有人因英国失去欧洲奖项资格而把国内提议看作安慰，两项名称在句中分属原因与应对。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Some regard the proposal as an inaccessible target.</p>\n<p>有些人可能把这项提议看作无法实现的目标。</p>\n</blockquote>\n<p>D需要国内奖项不能实现的依据。欧洲资格丧失不等于国内设奖不可能，恰因前者受限才有人讥讽后者是安慰奖。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. B</strong></p>\n</blockquote>\n<ul>\n<li>A：booby prize带有失利后的安慰、讥讽意味，随后自我庆祝热潮又加强轻视态度。sensible compromise却肯定它是明智折中。</li>\n<li>B：失去申请更有声望称号的机会，却不断另设文化名目庆祝自己，B用自欺尝试概括这些人眼中的安慰方式。</li>\n<li>C：bonus是额外得到的好处，booby prize则是失去原机会后的安慰。C把损失背景改成获得一项显眼的额外奖励。</li>\n<li>D：不能再申请的对象是European capital of culture，国内town of culture是拟设的替代项目。D把不可及性转给提议本身。</li>\n</ul>\n<h2>23题</h2>\n<blockquote>\n<p>The author suggests that a title holder is successful only if it ______.</p>\n<p>作者认为，一个称号获得者只有在______时才算成功。</p>\n</blockquote>\n<h3>题型</h3>\n<p>成功条件推断题：保留only if，综合反例、真正成功者的表现及持续成果，比较何者概括完整。</p>\n<p>题干中的a title holder和successful与粗读第3段时见到的such titles、They transform the aspirations相接。第3段直接出现The really successful holders of such titles，先把这一整段读完，查看作者怎样区分短暂热闹和真正成功。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>They transform the aspirations of the people who live there;</p>\n<p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n</blockquote>\n<h3>A. endeavours to maintain its image</h3>\n<blockquote>\n<p>称号获得者只有努力维持自身形象，才算成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>nudge ... into a bolder and more optimistic light要求自我形象向更大胆乐观的方向转变，maintain却是维持已有形象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有努力维持自身形象，才算成功。</p>\n</blockquote>\n<p><code>maintain its image</code>与第3段第4句的<code>the self-image of the city</code>指向同一类城市形象，因此回看这句，看作者要求城市怎样对待这种形象。</p>\n<p>原文让成功的城市<code>nudge the self-image</code>，方向是<code>into a bolder and more optimistic light</code>，即把自我形象推向更大胆、更乐观的状态。<code>A</code>的<code>maintain its image</code>却把动作写成努力维持已有形象。题干问成功所要求的表现，原文要求向更积极的方向改变，不能把它改成保持现状。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>值得记住，这些称号不是万能药。办得糟糕的文化年像潮水般来去，带来一时声望，却不给社区留下持久收益。真正成功者做的远超填满旅馆、举办高调艺术活动和获得一年好报道；它们改变当地人的抱负，使城市自我形象更大胆、更乐观。</p>\n</blockquote>\n<p>作者先否定一时声望，继而用transform和nudge描述居民抱负与城市自我认识的变化。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A successful title holder endeavours to maintain its image.</p>\n<p>称号获得者只有努力维持自身形象，才算成功。</p>\n</blockquote>\n<p>A需要将保持原样作为成功标准。实际强调改变方向，不能把有益的形象提升概括成维护既有状态。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. meets the aspirations of its people</h3>\n<blockquote>\n<p>称号获得者只有满足本地人的抱负，才算成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>transform aspirations是改变居民抱负，meet aspirations是满足原有愿望。对象相同，动作却不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有满足本地人的抱负，才算成功。</p>\n</blockquote>\n<p><code>meets the aspirations</code>与第3段第4句的<code>transform the aspirations</code>谈到同一对象，都是当地人的志向或愿望，因此回看这句对居民发生的变化。</p>\n<p>原文说成功的称号获得者<code>transform the aspirations</code>，改变生活在当地的人的志向，变化发生在这些志向本身。<code>B</code>说<code>meets the aspirations</code>，意思是实现或满足居民的愿望，变化成了愿望得到兑现。改变人们追求什么与把他们追求的事情办成，并不是同一个动作；原句把前者作为成功者的表现。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>值得记住，这些称号不是万能药。办得糟糕的文化年像潮水般来去，带来一时声望，却不给社区留下持久收益。真正成功者做的远超填满旅馆、举办高调艺术活动和获得一年好报道；它们改变当地人的抱负，使城市自我形象更大胆、更乐观。</p>\n</blockquote>\n<p>成功文化年使人们重新形成更积极的追求和城市自我认识，并非仅列原有愿望逐项兑现。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A successful title holder meets the aspirations of its people.</p>\n<p>称号获得者只有满足本地人的抱负，才算成功。</p>\n</blockquote>\n<p>B需要居民已经抱有某些目标而活动满足它们。实际目标与期待本身也发生转变，不能凭共同的aspirations省去动词差别。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. brings its local arts to prominence</h3>\n<blockquote>\n<p>称号获得者只有使本地艺术受到瞩目，才算成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>艺术受到瞩目可能是成功表现，C也没有限定短期；但成功标准在于do a great deal more及lasting benefits，不能只截取艺术地位提升。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有使本地艺术受到瞩目，才算成功。</p>\n</blockquote>\n<p>C的<code>brings its local arts to prominence</code>是让本地艺术受到瞩目，它没有写短期，也没有说仅凭艺术出名就足够成功。因此不能将它直接等同于前面受批评的<code>prominence for a spell</code>。</p>\n<p>不过，题干要概括作者明确设定的成功条件。本段说真正成功者<code>do a great deal more than</code>举办高调艺术活动和获得一年好报道，随后具体要求居民抱负与城市自我形象的转变。这把标准从艺术曝光推进到社区的持续改变。</p>\n<p>格拉斯哥的艺术地位也被<code>remains today</code>限定为持续成果。C抓到可能存在的一面，却没有概括整组标准；D的long-term growth将持久收益、社区抱负和城市形象共同纳入，所以更完整。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>值得记住，这些称号不是万能药。办得糟糕的文化年像潮水般来去，带来一时声望，却不给社区留下持久收益。真正成功者做的远超填满旅馆、举办高调艺术活动和获得一年好报道；它们改变当地人的抱负，使城市自我形象更大胆、更乐观。</p>\n</blockquote>\n<p>作者将活动、宣传的一年热闹与居民抱负、自我形象的长期改变相对，末尾再用格拉斯哥持续艺术发展支持。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A successful title holder brings its local arts to prominence.</p>\n<p>称号获得者只有使本地艺术受到瞩目，才算成功。</p>\n</blockquote>\n<p>不能把C擅改成“只求短期出名”，也不能忽略only if。问题是本段明确给出的综合标准并不止艺术突出，D更完整概括持久社区收益与深层改变。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. commits to its long-term growth</h3>\n<blockquote>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>无持久收益是失败反例，居民抱负和城市形象转变是成功标准，格拉斯哥持续至今的成果又作支持。D将这些连为长期发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquote>\n<p><code>long-term growth</code>与第3段第2句的<code>lasting benefits</code>谈的都是持续的效果；第4句又写居民志向和城市自我形象的改变，因此把这两句连起来看长期发展具体落在哪里。</p>\n<p>原文以没有<code>lasting benefits</code>说明办得糟糕的文化年的问题，再用改变居民志向、使城市更大胆乐观来说明成功者带来的变化。<code>D</code>的<code>long-term growth</code>概括的是称号获得者持续发展，<code>commits to</code>则表示它为这种发展投入努力。这里的<code>growth</code>没有限定为经济数字增长，能够包括居民和城市形象的改善，与原文从一时声望转向持续收益的要求一致。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>值得记住，这些称号不是万能药。办得糟糕的文化年像潮水般来去，带来一时声望，却不给社区留下持久收益。真正成功者做的远超填满旅馆、举办高调艺术活动和获得一年好报道；它们改变当地人的抱负，使城市自我形象更大胆、更乐观。</p>\n</blockquote>\n<p>先以潮水比喻短暂热闹，再用真正成功者说明长期改变，最后交代远见与合作才能推动这种转变。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A successful title holder commits to its long-term growth.</p>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquote>\n<p>growth不限于经济数字，也包括社区期待和地方认同的改善。commits to对应为长期改变投入努力，能覆盖作者的完整评价标准。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. D</strong></p>\n</blockquote>\n<ul>\n<li>A：nudge ... into a bolder and more optimistic light要求自我形象向更大胆乐观的方向转变，maintain却是维持已有形象。</li>\n<li>B：transform aspirations是改变居民抱负，meet aspirations是满足原有愿望。对象相同，动作却不同。</li>\n<li>C：艺术受到瞩目可能是成功表现，C也没有限定短期；但成功标准在于do a great deal more及lasting benefits，不能只截取艺术地位提升。</li>\n<li>D：无持久收益是失败反例，居民抱负和城市形象转变是成功标准，格拉斯哥持续至今的成果又作支持。D将这些连为长期发展。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>Glasgow is mentioned in Paragraph 3 to present ______.</p>\n<p>第3段提到格拉斯哥，是为了呈现______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干明确指定Paragraph 3和Glasgow，直接定位第3段末句。第3段已经完整读过，这里连着例子前的It is hard to get right和引出例子的But it can be done一起看，判断格拉斯哥这件事用来说明什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n<p>But it can be done:</p>\n<p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<h3>A. a contrasting case</h3>\n<blockquote>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>格拉斯哥可与前面失败文化年对照，因此A并非毫无联系；但例子直接跟在But it can be done后，首要作用是证明成功可实现。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p>若将格拉斯哥的持久艺术成就与前面的失败文化年相比，确实能形成短暂热闹和长期收益的对照。不能把A排成“全文没有任何对照”。</p>\n<p>但是，题目问此处提它做什么。紧邻例子的上一句说办好很难、需要远见和合作，随后作者写<code>But it can be done:</code>，冒号后正是格拉斯哥。直接需要支持的判断是：尽管有难度，持续转变可以实现。</p>\n<p>B的supporting example将这条判断与事实联系说出来；A的contrasting case只概括它与较远的失败情形的关系，未落到本处最直接的举例目的。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n<p>这很难办好，需要卓越远见，以及地方政府、私营部门、社区团体、文化机构合作。但它能做到：Glasgow担任欧洲文化之都的一年，可视为促使它成为并至今保持艺术、音乐、戏剧重镇的一系列复杂因素之一。</p>\n</blockquote>\n<p>作者先说明实现深层改变很难，需要远见与合作，再用冒号引出格拉斯哥已形成持续成果的经历。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Glasgow is presented as a contrasting case.</p>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p>A泛指与失败形成差别，未说清这里要证明什么。B能具体接住it can be done这一判断，所以比只说对照更准确。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. a supporting example</h3>\n<blockquote>\n<p>格拉斯哥在该处用作支持判断的例子。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>But it can be done先说困难的长期转变可以做到，格拉斯哥的实际成果随后证明这一点。B对应判断与证据的直接连接。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>格拉斯哥在该处用作支持判断的例子。</p>\n</blockquote>\n<p><code>supporting example</code>要看例子支持哪一句，格拉斯哥前面直接有<code>But it can be done</code>；它承接<code>It is hard to get right</code>所说的困难，因此回看本段第5句和末句，连起困难、可以做到及实际成果。</p>\n<p>原文先说把文化称号的作用发挥好很难，需要远见等条件，随后用<code>But it can be done</code>明确说这种成果能够实现。格拉斯哥的文化之都年被列为使城市成为并持续保持艺术重镇的一项因素，给“可以做到”补上实际经历。<code>B</code>的<code>supporting example</code>正是这一连接：格拉斯哥为困难但可实现的成功提供支持，并未把文化称号说成城市转变的唯一原因。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n<p>这很难办好，需要卓越远见，以及地方政府、私营部门、社区团体、文化机构合作。但它能做到：Glasgow担任欧洲文化之都的一年，可视为促使它成为并至今保持艺术、音乐、戏剧重镇的一系列复杂因素之一。</p>\n</blockquote>\n<p>成功需要远见和多方合作，作者随后列一座已经成为并保持艺术重镇的城市，给可行性以实例支持。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Glasgow is presented as a supporting example.</p>\n<p>格拉斯哥在该处用作支持判断的例子。</p>\n</blockquote>\n<p>one of a complex series of factors还限定文化称号只是一项因素，B无需把它当成唯一原因，也无需承诺每个获得者都成功。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. a background story</h3>\n<blockquote>\n<p>格拉斯哥在该处用作背景故事。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>格拉斯哥虽是过去经历，但并非仅交代背景；它在可以做到之后出现，证明称号能参与推动持续改变。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<block
