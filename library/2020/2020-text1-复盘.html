<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| institute | v.设立 | award | n.奖项 | proposal | n.提议 |\n| sit alongside | 与……并列 | investment | n.投资 | avalanche | n.大量涌入 |\n| confined to | 局限于 | resources | n.资源 | bid | n.申报；竞标 |\n| funding | n.资金 |  |  |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,136,900,612],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>institute</td>\n<td>v.设立</td>\n<td>award</td>\n<td>n.奖项</td>\n<td>proposal</td>\n<td>n.提议</td>\n</tr>\n<tr>\n<td>sit alongside</td>\n<td>与……并列</td>\n<td>investment</td>\n<td>n.投资</td>\n<td>avalanche</td>\n<td>n.大量涌入</td>\n</tr>\n<tr>\n<td>confined to</td>\n<td>局限于</td>\n<td>resources</td>\n<td>n.资源</td>\n<td>bid</td>\n<td>n.申报；竞标</td>\n</tr>\n<tr>\n<td>funding</td>\n<td>n.资金</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| booby prize | 安慰奖 | prestigious | adj.声望高的 | sought-after | adj.抢手的 |\n| bag | v.获得 | cynic | n.愤世嫉俗者 | speculate | v.推测 |\n| on the verge of | 濒临 | desperation | n.绝望 | reinvent | v.重塑 |\n| hamlet | n.小村庄 |  |  |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,1020,900,663],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<t on | 付诸行动 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第4段重点词语境","focus":[95,3226,900,286],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>honour</td>\n<td>v.尊重</td>\n<td>peculiarities</td>\n<td>n.特色</td>\n<td>sustain</td>\n<td>v.维持</td>\n</tr>\n<tr>\n<td>high street</td>\n<td>商业主街</td>\n<td>facilities</td>\n<td>n.设施</td>\n<td>above all</td>\n<td>最重要的是</td>\n</tr>\n<tr>\n<td>hope-filled</td>\n<td>adj.充满希望的</td>\n<td>turn into action</td>\n<td>付诸行动</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第1段","raw":"### 完整原文 · 第1段\n\nA group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK \"town of culture\" award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain's towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[95,136,900,612],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</section>"},{"title":"第1段","raw":"### 意群划分 · 第1段\n\nA group of Labour MPs, / among them Yvette Cooper, / are bringing in the new year / with a call / to institute / a UK \"town of culture\" award.\n\nThe proposal is / that it should sit alongside / the existing city of culture title, / which was held by Hull in 2017, / and has been awarded to Coventry for 2021.\n\nCooper and her colleagues argue / that the success of the crown / for Hull, / where it brought in £220m of investment / and an avalanche of arts, / ought not to be confined to cities.\n\nBritain's towns, / it is true, / are not prevented from applying, / but they generally lack the resources / to put together a bid / to beat their bigger competitors.\n\nA town of culture award could, / it is argued, / become an annual event, / attracting funding / and creating jobs.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[95,136,900,612],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段</h3>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段</h3>\n<p>A group of Labour MPs, / among them Yvette Cooper, / are bringing in the new year / with a call / to institute / a UK &quot;town of culture&quot; award.</p>\n<p>The proposal is / that it should sit alongside / the existing city of culture title, / which was held by Hull in 2017, / and has been awarded to Coventry for 2021.</p>\n<p>Cooper and her colleagues argue / that the success of the crown / for Hull, / where it brought in £220m of investment / and an avalanche of arts, / ought not to be confined to cities.</p>\n<p>Britain&#39;s towns, / it is true, / are not prevented from applying, / but they generally lack the resources / to put together a bid / to beat their bigger competitors.</p>\n<p>A town of culture award could, / it is argued, / become an annual event, / attracting funding / and creating jobs.</p>\n</section>"},{"title":"第1段","raw":"### 意群翻译 · 第1段\n\n一群工党议员，/ 其中包括伊薇特·库珀，/ 正在新年伊始带来 / 一个呼吁 / 设立 / 英国\"文化小镇\"奖。\n\n这个提议是 / 它应该与 / 现有的文化城市称号并列，/ 该称号在2017年由赫尔获得，/ 并已授予考文垂2021年。\n\n库珀和她的同事们认为 / 这个桂冠的成功 / 对赫尔来说，/ 在那里它带来了2.2亿英镑的投资 / 和大量的艺术活动，/ 不应该仅限于城市。\n\n英国的小镇，/ 确实，/ 并未被阻止申请，/ 但它们通常缺乏资源 / 来整合一个申请 / 以击败更大的竞争对手。\n\n文化小镇奖可以，/ 有人认为，/ 成为一个年度活动，/ 吸引资金 / 并创造就业 are not a cure-all. A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1894,900,809],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector,  really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>It is also wise to recall / that such titles are not a cure-all.</p>\n<p>A badly run &quot;year of culture&quot; / washes in and washes out / of a place / like the tide, / bringing prominence for a spell / but leaving no lasting benefits / to the community.</p>\n<p>The really successful holders / of such titles / are those / that do a great deal more / than fill hotel bedrooms / and bring in high-profile arts events / and good press for a year.</p>\n<p>They transform the aspirations / of the people who live there; / they nudge the self-image of the city / into a bolder and more optimistic light.</p>\n<p>It is hard to get right, / and requires a remarkable degree of vision, / as well as cooperation / between city authorities, / the private sector, / community groups / and cultural organisations.</p>\n<p>But it can be done: / Glasgow&#39;s year / as European capital of culture / can certainly be seen / as one of a complex series of factors / that have turned the city / into the powerhouse / of art, music and theatre / that it remains today.</p>\n</section>"},{"title":"第3段","raw":"### 意群翻译 · 第3段\n\n明智的做法是记住 / 这样的称号不是万能药。\n\n一个运作不善的\"文化年\" / 涌入又涌出 / 一个地方 / 像潮水一样，/ 带来短暂的突出地位 / 但没有留下持久的益处 / 给社区。\n\n真正成功的持有者 / 这些称号的 / 是那些 / 做了更多事情的 / 而不仅仅是填满酒店房间 / 引进高调的艺术活动 / 和一年的好新闻。\n\n他们改变抱负 / 住在那里的人们的；/ 他们推动城市的自我形象 / 进入更大胆和更乐观的光芒。\n\n这很难做对，/ 需要非凡程度的远见，/ 以及合作 / 在市政当局之间，/ 私营部门，/ 社区团体 / 和文化组织。\n\n但这是可以做到的：/ 格拉斯哥的一年 / 作为欧洲文化之都 / 当然可以被看作 / 一系列复杂因素之一 / 已经将这座城市转变 / 成为强大的中心 / 艺术、音乐和戏剧的 / 它今天仍然保持着。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1894,900,809],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>It is also wise to recall / that such titles are not a cure-all.</p>\n<p>A badly run &quot;year of culture&quot; / washes in and washes out / of a place / like the tide, / bringing prominence for a spell / but leaving no lasting benefits / to the community.</p>\n<p>The really successful holders / of such titles / are those / that do a great deal more / than fill hotel bedrooms / and bring in high-profile arts events / and good press for a year.</p>\n<p>They transform the aspirations / of the people who live there; / they nudge the self-image of the city / into a bolder and more optimistic light.</p>\n<p>It is hard to get right, / and requires a remarkable degree of vision, / as well as cooperation / between city authorities, / the private sector, / community groups / and cultural organisations.</p>\n<p>But it can be done: / Glasgow&#39;s year / as European capital of culture / can certainly be seen / as one of a complex series of factors / that have turned the city / into the powerhouse / of art, music and theatre / that it remains today.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>明智的做法是记住 / 这样的称号不是万能药。</p>\n<p>一个运作不善的&quot;文化年&quot; / 涌入又涌出 / 一个地方 / 像潮水一样，/ 带来短暂的突出地位 / 但没有留下持久的益处 / 给社区。</p>\n<p>真正成功的持有者 / 这些称号的 / 是那些 / 做了更多事情的 / 而不仅仅是填满酒店房间 / 引进高调的艺术活动 / 和一年的好新闻。</p>\n<p>他们改变抱负 / 住在那里的人们的；/ 他们推动城市的自我形象 / 进入更大胆和更乐观的光芒。</p>\n<p>这很难做对，/ 需要非凡程度的远见，/ 以及合作 / 在市政当局之间，/ 私营部门，/ 社区团体 / 和文化组织。</p>\n<p>但这是可以做到的：/ 格拉斯哥的一年 / 作为欧洲文化之都 / 当然可以被看作 / 一系列复杂因素之一 / 已经将这座城市转变 / 成为强大的中心 / 艺术、音乐和戏剧的 / 它今天仍然保持着。</p>\n</section>"},{"title":"第3段","raw":"### 标准译文 · 第3段\n\n明智的做法是记住，这样的称号并非万能药。一个运作不善的\"文化年\"就像潮水一样涌入又涌出一个地方，带来短暂的突出地位，但没有给社区留下持久的益处。真正成功的称号持有者是那些做了远不止填满酒店房间、引进高调艺术活动和获得一年好新闻的地方。他们改变了当地居民的抱负；他们将城市的自我形象推向更大胆、更乐观的方向。这很难做对，需要非凡的远见，以及市政当局、私营部门、社区团体和文化组织之间的合作。但这是可以做到的：格拉斯哥作为欧洲文化之都的那一年，当然可以被看作是将这座城市转变为今天仍然保持的艺术、音乐和戏剧强大中心的一系列复杂因素之一。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1894,900,809],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true},"focusId":"focus-paragraph-3-3","html":"< capital of culture / can certainly be seen / as one of a complex series of factors / that have turned the city / into the powerhouse / of art, music and theatre / that it remains today.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>明智的做法是记住 / 这样的称号不是万能药。</p>\n<p>一个运作不善的&quot;文化年&quot; / 涌入又涌出 / 一个地方 / 像潮水一样，/ 带来短暂的突出地位 / 但没有留下持久的益处 / 给社区。</p>\n<p>真正成功的持有者 / 这些称号的 / 是那些 / 做了更多事情的 / 而不仅仅是填满酒店房间 / 引进高调的艺术活动 / 和一年的好新闻。</p>\n<p>他们改变抱负 / 住在那里的人们的；/ 他们推动城市的自我形象 / 进入更大胆和更乐观的光芒。</p>\n<p>这很难做对，/ 需要非凡程度的远见，/ 以及合作 / 在市政当局之间，/ 私营部门，/ 社区团体 / 和文化组织。</p>\n<p>但这是可以做到的：/ 格拉斯哥的一年 / 作为欧洲文化之都 / 当然可以被看作 / 一系列复杂因素之一 / 已经将这座城市转变 / 成为强大的中心 / 艺术、音乐和戏剧的 / 它今天仍然保持着。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-3\"><h3>标准译文 · 第3段</h3>\n<p>明智的做法是记住，这样的称号并非万能药。一个运作不善的&quot;文化年&quot;就像潮水一样涌入又涌出一个地方，带来短暂的突出地位，但没有给社区留下持久的益处。真正成功的称号持有者是那些做了远不止填满酒店房间、引进高调艺术活动和获得一年好新闻的地方。他们改变了当地居民的抱负；他们将城市的自我形象推向更大胆、更乐观的方向。这很难做对，需要非凡的远见，以及市政当局、私营部门、社区团体和文化组织之间的合作。但这是可以做到的：格拉斯哥作为欧洲文化之都的那一年，当然可以被看作是将这座城市转变为今天仍然保持的艺术、音乐和戏剧强大中心的一系列复杂因素之一。</p>\n</section>"},{"title":"第4段","raw":"### 完整原文 · 第4段\n\nA \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,3226,900,286],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</section>"},{"title":"第4段","raw":"### 意群划分 · 第4段\n\nA \"town of culture\" / could be not just about the arts / but about honouring a town's peculiarities / —helping sustain its high street, / supporting local facilities / and above all / celebrating its people.\n\nJeremy Wright, / the culture secretary, / should welcome / this positive, hope-filled proposal, / and turn it into action.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,3226,900,286],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>A &quot;town of culture&quot; / could be not just about the arts / but about honouring a town&#39;s peculiarities / —helping sustain its high street, / supporting local facilities / and above all / celebrating its people.</p>\n<p>Jeremy Wright, / the culture secretary, / should welcome / this positive, hope-filled proposal, / and turn it into action.</p>\n</section>"},{"title":"第4段","raw":"### 意群翻译 · 第4段\n\n一个\"文化小镇\" / 可以不仅仅关于艺术 / 而是关于尊重小镇的特色 / —帮助维持其主街道，/ 支持当地设施 / 最重要的是 / 庆祝它的人民。\n\n杰里米·赖特，/ 文化大臣，/ 应该欢迎 / 这个积极的、充满希望的提议，/ 并将其付诸行动。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","as Ps：(among them Yvette Cooper) → are bringing in the new year：(with a call：(to institute → a UK \"town of culture\" award)).\n\nThe proposal is：(that it should sit alongside → the existing city of culture title：(which was held by Hull in 2017 + has been awarded to Coventry for 2021)).\n\nCooper and her colleagues argue：(that the success of the crown：(for Hull：(where it brought in £220m of investment + an avalanche of arts)) → ought not to be confined to cities).\n\nBritain's towns：(it is true) → are not prevented from applying // but they generally lack the resources：(to put together a bid：(to beat their bigger competitors)).\n\nA town of culture award could：(it is argued) → become an annual event：(attracting funding + creating jobs).\n\n**第2段**\n\nSome might see the proposal → as a booby prize：(for the fact：(that Britain is no longer able to apply → for the much more prestigious title：(of European capital of culture：(a sought-after award：(bagged by Glasgow in 1990 + Liverpool in 2008))))).\n\nA cynic might speculate：(that the UK is on the verge：(of disappearing → into an endless fever of self-celebration：(in its desperation：(to reinvent itself：(for the post-Brexit world)))))：after town of culture → who knows what will follow — (village of culture? + Suburb of culture? + Hamlet of culture?)\n\n**第3段**\n\nIt is also wise to recall：(that such titles are not a cure-all).\n\nA badly run \"year of culture\" → washes in and washes out：(of a place)：(like the tide) → bringing prominence for a spell // but leaving no lasting benefits：(to the community).\n\nThe really successful holders：(of such titles) → are those：(that do a great deal more：(than fill hotel bedrooms + bring in high-profile arts events + good press for a year)).\n\nThey transform the aspirations：(of the people who live there) + they nudge the self-image of the city：(into a bolder and more optimistic light).\n\nIt is hard to get right + requires a remarkable degree of vision + cooperation：(between city authorities + the private sector + community groups + cultural organisations).\n\nBut it can be done：Glasgow's year：(as European capital of culture) → can certainly be seen：(as one of a complex series of factors：(that have turned the city → into the powerhouse：(of art, music and theatre)：(that it remains today))).\n\n**第4段**\n\nA \"town of culture\" → could be not just about the arts // but about honouring a town's peculiarities：(helping sustain its high street + supporting local facilities + above all celebrating its people).\n\nJeremy Wright：(the culture secretary) → should welcome：(this positive, hope-filled proposal) + turn it into action.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>A group of Labour MPs：(among them Yvette Cooper) → are bringing in the new year：(with a call：(to institute → a UK &quot;town of culture&quot; award)).</p>\n<p>The proposal is：(that it should sit alongside → the existing city of culture title：(which was held by Hull in 2017 + has been awarded to Coventry for 2021)).</p>\n<p>Cooper and her colleagues argue：(that the success of the crown：(for Hull：(where it brought in £220m of investment + an avalanche of arts)) → ought not to be confined to cities).</p>\n<p>Britain&#39;s towns：(it is true) → are not prevented from applying // but they generally lack the resources：(to put together a bid：(to beat their bigger competitors)).</p>\n<p>A town of culture award could：(it is argued) → become an annual event：(attracting funding + creating jobs).</p>\n<p><strong>第2段</strong></p>\n<p>Some might see the proposal → as a booby prize：(for the fact：(that Britain is no longer able to apply → for the much more prestigious title：(of European capital of culture：(a sought-after award：(bagged by Glasgow in 1990 + Liverpool in 2008))))).</p>\n<p>A cynic might speculate：(that the UK is on the verge：(of disappearing → into an endless fever of self-celebration：(in its desperation：(to reinvent itself：(for the post-Brexit world)))))：after town of culture → who knows what will follow — (village of culture? + Suburb of culture? + Hamlet of culture?)</p>\n<p><strong>第3段</strong></p>\n<p>It is also wise to recall：(that such titles are not a cure-all).</p>\n<p>A badly run &quot;year of culture&quot; → washes in and washes out：(of a place)：(like the tide) → bringing prominence for a spell // but leaving no lasting benefits：(to the community).</p>\n<p>The really successful holders：(of such titles) → are those：(that do a great deal more：(than fill hotel bedrooms + bring in high-profile arts events + good press for a year)).</p>\n<p>They transform the aspirations：(of the people who live there) + they nudge the self-image of the city：(into a bolder and more optimistic light).</p>\n<p>It is hard to get right + requires a remarkable degree of vision + cooperation：(between city authorities + the private sector + community groups + cultural organisations).</p>\n<p>But it can be done：Glasgow&#39;s year：(as European capital of culture) → can certainly be seen：(as one of a complex series of factors：(that have turned the city → into the powerhouse：(of art, music and theatre)：(that it remains today))).</p>\n<p><strong>第4段</strong></p>\n<p>A &quot;town of culture&quot; → could be not just about the arts // but about honouring a town&#39;s peculiarities：(helping sustain its high street + supporting local facilities + above all celebrating its people).</p>\n<p>Jeremy Wright：(the culture secretary) → should welcome：(this positive, hope-filled proposal) + turn it into action.</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n一群工党议员：(其中包括伊薇特·库珀) → 正在新年伊始带来：(一个呼吁：(设立 → 英国\"文化小镇\"奖))。\n\n这个提议是：(它应该与 → 现有的文化城市称号并列：(该称号在2017年由赫尔获得 + 已授予考文垂2021年))。\n\n库珀和她的同事们认为：(这个桂冠的成功：(对赫尔来说：(在那里它带来了2.2亿英镑的投资 + 大量的艺术活动)) → 不应该仅限于城市)。\n\n英国的小镇：(确实) → 并未被阻止申请 // 但它们通常缺乏资源：(来整合一个申请：(以击败更大的竞争对手))。\n\n文化小镇奖可以：(有人认为) → 成为一个年度活动：(吸引资金 + 创造就业)。\n\n**第2段**\n\n有些人可能视这个提议 → 为一个安慰奖：(对于这个事实：(英国不再能够申请 → 更有声望的称号：(欧洲文化之都：(一个备受追捧的奖项：(由格拉斯哥在1990年获得 + 利物浦在2008年)))))。\n\n一个愤世嫉俗者可能推测：(英国正处于边缘：(消失 → 进入无休止的自我庆祝狂热中：(在其绝望中：(重新塑造自己：(为脱欧后的世界)))))：在文化小镇之后 → 谁知道会接着什么 — (文化村庄？+ 文化郊区？+ 文化小村？)\n\n**第3段**\n\n明智的做法是记住：(这样的称号不是万能药)。\n\n一个运作不善的\"文化年\" → 涌入又涌出：(一个地方)：(像潮水一样) → 带来短暂的突出地位 // 但没有留下持久的益处：(给社区)。\n\n真正成功的持有者：(这些称号的) → 是那些：(做了更多事情的：(而不仅仅是填满酒店房间 + 引进高调的艺术活动 + 一年的好新闻))。\n\n他们改变抱负：(住在那里的人们的) + 他们推动城市的自我形象：(进入更大胆和更乐观的光芒)。\n\n这很难做对 + 需要非凡程度的远见 + 合作：(在市政当局 + 私营部门 + 社区团体 + 文化组织之间)。\n\n但这是可以做到的：格拉斯哥的一年：(作为欧洲文化之都) → 当然可以被看作：(一系列复杂因素之一：(已经将这座城市转变 → 成为强大的中心：(艺术、音乐和戏剧的)：(它今天仍然保持着)))。\n\n**第4段**\n\n一个\"文化小镇\" → 可以不仅仅关于艺术 // 而是关于尊重小镇的特色：(帮助维持其主街道 + 支持当地设施 + 最重要的是庆祝它的人民)。\n\n杰里米·赖特：(文化大臣) → 应该欢迎：(这个积极的、充满希望的提议) + 将其付诸行动。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>一群工党议员：(其中包括伊薇特·库珀) → 正在新年伊始带来：(一个呼吁：(设立 → 英国&quot;文化小镇&quot;奖))。</p>\n<p>这个提议是：(它应该与 → 现有的文化城市称号并列：(该称号在2017年由赫尔获得 + 已授予考文垂2021年))。</p>\n<p>库珀和她的同事们认为：(这个桂冠的成功：(对赫尔来说：(在那里它带来了2.2亿英镑的投资 + 大量的艺术活动)) → 不应该仅限于城市)。</p>\n<p>英国的小镇：(确实) → 并未被阻止申请 // 但它们通常缺乏资源：(来整合一个申请：(以击败更大的竞争对手))。</p>\n<p>文化小镇奖可以：(有人认为) → 成为一个年度活动：(吸引资金 + 创造就业)。</p>\n<p><strong>第2段</strong></p>\n<p>有些人可能视这个提议 → 为一个安慰奖：(对于这个事实：(英国不再能够申请 → 更有声望的称号：(欧洲文化之都：(一个备受追捧的奖项：(由格拉斯哥在1990年获得 + 利物浦在2008年)))))。</p>\n<p>一个愤世嫉俗者可能推测：(英国正处于边缘：(消失 → 进入无休止的自我庆祝狂热中：(在其绝望中：(重新塑造自己：(为脱欧后的世界)))))：在文化小镇之后 → 谁知道会接着什么 — (文化村庄？+ 文化郊区？+ 文化小村？)</p>\n<p><strong>第3段</strong></p>\n<p>明智的做法是记住：(这样的称号不是万能药)。</p>\n<p>一个运作不善的&quot;文化年&quot; → 涌入又涌出：(一个地方)：(像潮水一样) → 带来短暂的突出地位 // 但没有留下持久的益处：(给社区)。</p>\n<p>真正成功的持有者：(这些称号的) → 是那些：(做了更多事情的：(而不仅仅是填满酒店房间 + 引进高调的艺术活动 + 一年的好新闻))。</p>\n<p>他们改变抱负：(住在那里的人们的) + 他们推动城市的自我形象：(进入更大胆和更乐观的光芒)。</p>\n<p>这很难做对 + 需要非凡程度的远见 + 合作：(在市政当局 + 私营部门 + 社区团体 + 文化组织之间)。</p>\n<p>但这是可以做到的：格拉斯哥的一年：(作为欧洲文化之都) → 当然可以被看作：(一系列复杂因素之一：(已经将这座城市转变 → 成为强大的中心：(艺术 ction class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities —helping sustain its high street, supporting local facilities and above all celebrating its people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>A &quot;town of culture&quot; / could be not just about the arts / but about honouring a town&#39;s peculiarities / —helping sustain its high street, / supporting local facilities / and above all / celebrating its people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>一个&quot;文化小镇&quot; / 可以不仅仅关于艺术 / 而是关于尊重小镇的特色 / —帮助维持其主街道，/ 支持当地设施 / 最重要的是 / 庆祝它的人民。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>not just ... but ...不是否定艺术，而是超越艺术；破折号后用三个动作具体解释。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>一个&quot;文化小镇&quot;  可以不仅仅关于艺术  而是关于尊重小镇的特色  —帮助维持其主街道， 支持当地设施  最重要的是  庆祝它的人民。</p>\n</blockquote>\n</section>"},{"title":"3. 第4段第1句","raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 文化小镇应重视地方特色与居民。\n\n先保留不仅仅关于艺术，再说尊重特色，最后依次列主街、设施、居民。\n\n按照中文语序调整后是：\n\n> \"文化小镇\"可以不仅仅关于艺术，而是关于尊重小镇的特色——帮助维持其主街道，支持当地设施，最重要的是庆祝它的人民。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段第1句","focus":[95,3226,900,221],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false},"focusId":"focus-long-3-4","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities —helping sustain its high street, supporting local facilities and above all celebrating its people.</p>\n</blockquote>\n</section><section 1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>A &quot;town of culture&quot; / could be not just about the arts / but about honouring a town&#39;s peculiarities / —helping sustain its high street, / supporting local facilities / and above all / celebrating its people.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>一个&quot;文化小镇&quot; / 可以不仅仅关于艺术 / 而是关于尊重小镇的特色 / —帮助维持其主街道，/ 支持当地设施 / 最重要的是 / 庆祝它的人民。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>not just ... but ...不是否定艺术，而是超越艺术；破折号后用三个动作具体解释。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>一个&quot;文化小镇&quot;  可以不仅仅关于艺术  而是关于尊重小镇的特色  —帮助维持其主街道， 支持当地设施  最重要的是  庆祝它的人民。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>文化小镇应重视地方特色与居民。</p>\n</blockquote>\n<p>先保留不仅仅关于艺术，再说尊重特色，最后依次列主街、设施、居民。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>&quot;文化小镇&quot;可以不仅仅关于艺术，而是关于尊重小镇的特色——帮助维持其主街道，支持当地设施，最重要的是庆祝它的人民。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>above all让居民居于最重要位置；peculiarities在此是特色，不是缺陷。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>&quot;文化小镇&quot;可以不仅仅关于艺术，而是关于尊重小镇的特色——帮助维持其主街道，支持当地设施，最重要的是庆祝它的人民。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此， 义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> Cooper and her colleagues argue that a “town of culture” award could ______.\n>\n> 库珀和她的同事们认为，“文化城镇”奖可以______。\n\n### 题型\n\n细节题：区分提议为何提出与它预期带来的作用，重点看吸引资金和创造就业的归纳。\n\n题干直接给出Cooper and her colleagues，第1段第3句出现同样的人物。先从第1段开头读到结尾，弄清他们为何提出文化城镇奖，以及他们期待这项奖带来什么。\n\n### 核心出处\n\n> it should sit alongside the existing city of culture title\n>\n> Britain's towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors\n>\n> but they generally lack the resources to put together a bid to beat their bigger competitors","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"21","questionIntro":true},"html":"<blockquote>\n<p>Cooper and her colleagues argue that a “town of culture” award could ______.</p>\n<p>库珀和她的同事们认为，“文化城镇”奖可以______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：区分提议为何提出与它预期带来的作用，重点看吸引资金和创造就业的归纳。</p>\n<p>题干直接给出Cooper and her colleagues，第1段第3句出现同样的人物。先从第1段开头读到结尾，弄清他们为何提出文化城镇奖，以及他们期待这项奖带来什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it should sit alongside the existing city of culture title</p>\n<p>Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors</p>\n<p>but they generally lack the resources to put together a bid to beat their bigger competitors</p>\n</blockquote>\n"},{"title":"A. consolidate the town-city ties in Britain","raw":"### A. consolidate the town-city ties in Britain\n\n> Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nsit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。\n\n**出处：**\n\n> A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK \"town of culture\" award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain's towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n</section>"},{"title":"A. consolidate the town-city ties in Britain","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。\n\n`consolidate the town-city ties`说的是两类地方之间的关系，第1段的`sit alongside`说的是文化城镇奖与文化之城称号并列，因此回看第2句，再结合第4句中城镇与较大竞争者的关系。\n\n`A`的`consolidate the town-city ties`把设立并列奖项改成加强城镇与城市的联系。奖项之间的并列，以及申请者之间的竞争，都没有建立设奖使两类地方联系更紧密的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><code>consolidate the town-city ties</code>说的是两类地方之间的关系，第1段的<code>sit alongside</code>说的是文化城镇奖与文化之城称号并列，因此回看第2句，再结合第4句中城镇与较大竞争者的关系。</p>\n<p><code>A</code>的<code>consolidate the town-city ties</code>把设立并列奖项改成加强城镇与城市的联系。奖项之间的并列，以及申请者之间的竞争，都没有建立设奖使两类地方联系更紧密的关系。</p>\n</section>"},{"title":"A. consolidate the town-city ties in Britain","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK \"town of culture\" award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain's towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.\n>\n> 包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。\n\n提议先与现有称号并列，再说明城镇资源少、难赢大城市，最后期待设奖吸引资金与岗位。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> A town-of-culture award could consolidate the town-city ties in Britain.\n>\n> Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。\n\nA需要共同活动或往来使town-city ties更紧。并列奖项和竞争资源差异都不能自动产生这项合作联系。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p><code>consolidate the town-city ties</code>说的是两类地方之间的关系，第1段的<code>sit alongside</code>说的是文化城镇奖与文化之城称号并列，因此回看第2句，再结合第4句中城镇与较大竞争者的关系。</p>\n<p><code>A</code>的<code>consolidate the town-city ties</code>把设立并列奖项改成加强城镇与城市的联系。奖项之间的并列，以及申请者之间的竞争，都没有建立设奖使两类地方联系更紧密的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>提议先与现有称号并列，再说明城镇资源少、难赢大城市，最后期待设奖吸引资金与岗位。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could consolidate the town-city ties in Britain.</p>\n<p>Cooper等认为文化城镇奖可能巩固英国城镇与城市联系。</p>\n</blockquote>\n<p>A需要共同活动或往来使town-city ties更紧。并列奖项和竞争资源差异都不能自动产生这项合作联系。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. promote cooperation among Britain’s towns","raw":"### B. promote cooperation among Britain’s towns\n\n> Cooper等认为文化城镇奖可能促进英国各城镇合作。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\  they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n</section>"},{"title":"B. promote cooperation among Britain’s towns","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Cooper等认为文化城镇奖可能促进英国各城镇合作。\n\n`promote cooperation`把设奖的作用放在城镇共同做事上，第1段末句的`attracting funding and creating jobs`直接列出设奖的预期作用，所以回看末句，并联系前一句城镇缺乏资源的处境。\n\n`B`的`promote cooperation`则说这项活动让英国各城镇彼此合作，把资金和就业的收益改接成城镇之间共同做事的关系。原文这两句没有把城镇联合行动设为获得这些收益的做法。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-B-0\"><blockquote>\n<p>Cooper等认为文化城镇奖可能促进英国各城镇合作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>资金与就业是设奖预期带给城镇的收益，B却说英国各城镇互相合作，原段没有把共同办事接到这项奖上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n</s t is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>Hull的投资与艺术活动先示范已有收益，城镇较弱的竞标资源随后解释为什么需单设机会，末句明确列资金和就业。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could increase the economic strength of Britain’s towns.</p>\n<p>Cooper等认为文化城镇奖可能增强英国城镇经济实力。</p>\n</blockquote>\n<p>C没有声称奖项已实现全部经济收益，而是将可能吸引的资源和岗位合为经济实力的增强，受益对象仍是城镇。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. focus Britain’s limited resources on cultural events","raw":"### D. focus Britain’s limited resources on cultural events\n\n> Cooper等认为文化城镇奖可能把英国有限资源集中到文化活动。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\nlack resources指城镇难以组织能击败大城市的竞标，D却变成全国资源有限并应集中投向文化，改变了范围和配置方式。\n\n**出处：**\n\n> A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK \"town of culture\" award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain's towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-D-0","html"
