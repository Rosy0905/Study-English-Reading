nerally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Cooper等认为文化城镇奖可能把英国有限资源集中到文化活动。</p>\n</blockquote>\n<p><code>Britain’s limited resources</code>让人回到第1段第4句的<code>they generally lack the resources</code>；要判断设奖后资源如何变化，还要看末句的<code>attracting funding</code>。前一句说明谁缺资源，后一句说明奖项怎样影响资金。</p>\n<p><code>D</code>的<code>Britain’s limited resources</code>把城镇在竞争中的资源不足扩大成整个英国资源有限，又把吸引资金改成把全国资源集中用于文化活动。原文没有作出这项全国资源配置安排。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities. Britain&#39;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>包括Cooper在内的工党议员以设立英国文化城镇奖的呼吁迎接新年，提议让它与已有文化之城称号并列；后者2017年由Hull持有，2021年已授予Coventry。他们认为，Hull获得称号带来的2.2亿英镑投资和大量艺术活动，不应只限于城市。城镇并未被禁止申请，却通常没有足够资源组织能击败更大竞争者的竞标。据提议，文化城镇奖可成为年度活动，吸引资金并创造就业。</p>\n</blockquote>\n<p>作者先交代申请资格没有受阻，再说实际竞标资源不足，奖项所期待的动作是attracting funding。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A town-of-culture award could focus Britain’s limited resources on cultural events.</p>\n<p>Cooper等认为文化城镇奖可能把英国有限资源集中到文化活动。</p>\n</blockquote>\n<p>D需要全国资源如何集中分配的安排。吸引新资金不等于把既有有限资源集中到文化活动，城镇资源不足也不等于英国整体资源不足。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. C**\n\n- A：sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。\n- B：资金与就业是设奖预期带给城镇的收益，B却说英国各城镇互相合作，原段没有把共同办事接到这项奖上。\n- C：吸引资金、创造岗位都改善地方经济，C的economic strength概括这两项作用，could保持提议的预期性质。\n- D：lack resources指城镇难以组织能击败大城市的竞标，D却变成全国资源有限并应集中投向文化，改变了范围和配置方式。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,156,1344,382],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"21","questionConclusion":true},"html":"<blockquote>\n<p><strong>21. C</strong></p>\n</blockquote>\n<ul>\n<li>A：sit alongside说文化城镇奖与文化之城称号并列，未说城镇和城市之间加强联系。A把奖项安排改成地方之间的关系。</li>\n<li>B：资金与就业是设奖预期带给城镇的收益，B却说英国各城镇互相合作，原段没有把共同办事接到这项奖上。</li>\n<li>C：吸引资金、创造岗位都改善地方经济，C的economic strength概括这两项作用，could保持提议的预期性质。</li>\n<li>D：lack resources指城镇难以组织能击败大城市的竞标，D却变成全国资源有限并应集中投向文化，改变了范围和配置方式。</li>\n</ul>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> According to Paragraph 2, the proposal might be regarded by some as ______.\n>\n> 根据第2段，有些人可能把这项提议看作______。\n\n### 题型\n\n观点细节题：some限定为部分人的看法，须分清他们的讥讽与作者自己的最终立场。\n\n题干直接指定Paragraph 2，且might be regarded by some与该段开头Some might see相接。把第2段从头读到尾，区分有些人的看法和随后冷嘲热讽者的猜测。\n\n### 核心出处\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply\n>\n> an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world\n>\n> as a booby prize for the fact that Britain is no longer able to apply","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"22","questionIntro":true},"html":"<blockquote>\n<p>According to Paragraph 2, the proposal might be regarded by some as ______.</p>\n<p>根据第2段，有些人可能把这项提议看作______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点细节题：some限定为部分人的看法，须分清他们的讥讽与作者自己的最终立场。</p>\n<p>题干直接指定Paragraph 2，且might be regarded by some与该段开头Some might see相接。把第2段从头读到尾，区分有些人的看法和随后冷嘲热讽者的猜测。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply</p>\n<p>an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world</p>\n<p>as a booby prize for the fact that Britain is no longer able to apply</p>\n</blockquote>\n"},{"title":"A. a sensible compromise","raw":"### A. a sensible compromise\n\n> 有些人可能把这项提议看作明智的折中方案。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nbooby prize带有失利后的安慰、讥讽意味，随后自我庆祝热潮又加强轻视态度。sensible compromise却肯定它是明智折中。\n\n**出处：**\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>booby prize带有失利后的安慰、讥讽意味，随后自我庆祝热潮又加强轻视态度。sensible compromise却肯定它是明智折中。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n</section>"},{"title":"A. a sensible compromise","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 有些人可能把这项提议看作明智的折中方案。\n\n`sensible`是在肯定提议明智，而段首的`a booby prize`是对同一提议的评价，因此回看第1句；后一句又以`an endless fever of self-celebration`描写冷嘲热讽者所猜测的情形，可以一并看清这里的评价方向。\n\n原文把提议称为`a booby prize`，指英国失去申请另一称号的机会后给自己的一种安慰；接着把自我庆祝写成`endless fever`，并放在`desperation`之中。这是在交代轻视、讥讽的看法。`A`的`sensible`却把这种评价改为提议明智。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>booby prize带有失利后的安慰、讥讽意味，随后自我庆祝热潮又加强轻视态度。sensible compromise却肯定它是明智折中。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><code>sensible</code>是在肯定提议明智，而段首的<code>a booby prize</code>是对同一提议的评价，因此回看第1句；后一句又以<code>an endless fever of self-celebration</code>描写冷嘲热讽者所猜测的情形，可以一并看清这里的评价方向。</p>\n<p>原文把提议称为<code>a booby prize</code>，指英国失去申请另一称号的机会后给自己的一种安慰；接着把自我庆祝写成<code>endless fever</code>，并放在<code>desperation</code>之中。这是在交代轻视、讥讽的看法。<code>A</code>的<code>sensible</code>却把这种评价改为提议明智。</p>\n</section>"},{"title":"A. a sensible compromise","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?\n>\n> 有些人可能把提议看成安慰奖，因为英国已不能再申请更有声望的欧洲文化之都称号；Glasgow与Liverpool分别曾在1990年和2008年获得它。冷嘲者或会猜测：英国急于在脱欧后重新塑造自己，正陷入无尽自我庆祝。文化城镇之后还会有什么——文化村、文化郊区、文化小村落？\n\n段首先将提议连到失去欧洲奖项资格，再以cynic的口吻猜测各种国内文化名号会不断增加。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Some regard the proposal as a sensible compromise.\n>\n> 有些人可能把这项提议看作明智的折中方案。\n\nA需要不同利益经过协调形成合理方案的肯定。原段转述的是安慰自己与徒增庆祝名目的质疑，不是作者末段的积极评价。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>booby prize带有失利后的安慰、讥讽意味，随后自我庆祝热潮又加强轻视态度。sensible compromise却肯定它是明智折中。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p><code>sensible</code>是在肯定提议明智，而段首的<code>a booby prize</code>是对同一提议的评价，因此回看第1句；后一句又以<code>an endless fever of self-celebration</code>描写冷嘲热讽者所猜测的情形，可以一并看清这里的评价方向。</p>\n<p>原文把提议称为<code>a booby prize</code>，指英国失去申请另一称号的机会后给自己的一种安慰；接着把自我庆祝写成<code>endless fever</code>，并放在<code>desperation</code>之中。这是在交代轻视、讥讽的看法。<code>A</code>的<code>sensible</code>却把这种评价改为提议明智。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?</p>\n<p>有些人可能把提议看成安慰奖，因为英国已不能再申请更有声望的欧洲文化之都称号；Glasgow与Liverpool分别曾在1990年和2008年获得它。冷嘲者或会猜测：英国急于在脱欧后重新塑造自己，正陷入无尽自我庆祝。文化城镇之后还会有什么——文化村、文化郊区、文化小村落？</p>\n</blockquote>\n<p>段首先将提议连到失去欧洲奖项资格，再以cynic的口吻猜测各种国内文化名号会不断增加。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Some regard the proposal as a sensible compromise.</p>\n<p>有些人可能把这项提议看作明智的折中方案。</p>\n</blockquote>\n<p>A需要不同利益经过协调形成合理方案的肯定。原段转述的是安慰自己与徒增庆祝名目的质疑，不是作者末段的积极评价。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. a self-deceiving attempt","raw":"### B. a self-deceiving attempt\n\n> 有些人可能把这项提议看作一种自欺的尝试。\n\n**做题模式中的状态：** 第一轮保留B，此时B尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n失去申请更有声望称号的机会，却不断另设文化名目庆祝自己，B用自欺尝试概括这些人眼中的安慰方式。\n\n**出处：**\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture? Suburb of culture? Hamlet of culture?","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-B-0\"><blockquote>\n<p>有些人可能把这项提议看作一种自欺的尝试。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>失去申请更有声望称号的机会，却不断另设文化名目庆祝自己，B用自欺尝试概括这些人眼中的安慰方式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able t > they nudge the self-image of the city into a bolder and more optimistic light.\n>\n> They transform the aspirations of the people who live there;\n>\n> bringing prominence for a spell but leaving no lasting benefits to the community.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"23","questionIntro":true},"html":"<blockquote>\n<p>The author suggests that a title holder is successful only if it ______.</p>\n<p>作者认为，一个称号获得者只有在______时才算成功。</p>\n</blockquote>\n<h3>题型</h3>\n<p>成功条件推断题：保留only if，综合反例、真正成功者的表现及持续成果，比较何者概括完整。</p>\n<p>题干中的a title holder和successful与粗读第3段时见到的such titles、They transform the aspirations相接。第3段直接出现The really successful holders of such titles，先把这一整段读完，查看作者怎样区分短暂热闹和真正成功。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>They transform the aspirations of the people who live there;</p>\n<p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n</blockquote>\n"},{"title":"A. endeavours to maintain its image","raw":"### A. endeavours to maintain its image\n\n> 称号获得者只有努力维持自身形象，才算成功。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nnudge ... into a bolder and more optimistic light要求自我形象向更大胆乐观的方向转变，maintain却是维持已有形象。\n\n**出处：**\n\n> It is also wise to recall that such titles are not a cure-all. A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.","section":"第三鸟 · 题目复盘","context":{"mode":"image"  and more optimistic light.\n>\n> 值得记住，这些称号不是万能药。办得糟糕的文化年像潮水般来去，带来一时声望，却不给社区留下持久收益。真正成功者做的远超填满旅馆、举办高调艺术活动和获得一年好报道；它们改变当地人的抱负，使城市自我形象更大胆、更乐观。\n\n作者先否定一时声望，继而用transform和nudge描述居民抱负与城市自我认识的变化。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> A successful title holder endeavours to maintain its image.\n>\n> 称号获得者只有努力维持自身形象，才算成功。\n\nA需要将保持原样作为成功标准。实际强调改变方向，不能把有益的形象提升概括成维护既有状态。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>称号获得者只有努力维持自身形象，才算成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>nudge ... into a bolder and more optimistic light要求自我形象向更大胆乐观的方向转变，maintain却是维持已有形象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有努力维持自身形象，才算成功。</p>\n</blockquote>\n<p><code>maintain its image</code>与第3段第4句的<code>the self-image of the city</code>指向同一类城市形象，因此回看这句，看作者要求城市怎样对待这种形象。</p>\n<p>原文让成功的城市<code>nudge the self-image</code>，方向是<code>into a bolder an ons of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n</section>"},{"title":"D. commits to its long-term growth","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 称号获得者只有致力于长期发展，才算成功。\n\n`long-term growth`与第3段第2句的`lasting benefits`谈的都是持续的效果；第4句又写居民志向和城市自我形象的改变，因此把这两句连起来看长期发展具体落在哪里。\n\n原文以没有`lasting benefits`说明办得糟糕的文化年的问题，再用改变居民志向、使城市更大胆乐观来说明成功者带来的变化。`D`的`long-term growth`概括的是称号获得者持续发展，`commits to`则表示它为这种发展投入努力。这里的`growth`没有限定为经济数字增长，能够包括居民和城市形象的改善，与原文从一时声望转向持续收益的要求一致。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>无持久收益是失败反例，居民抱负和城市形象转变是成功标准，格拉斯哥持续至今的成果又作支持。D将这些连为长期发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquot 居民抱负和城市形象转变是成功标准，格拉斯哥持续至今的成果又作支持。D将这些连为长期发展。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquote>\n<p><code>long-term growth</code>与第3段第2句的<code>lasting benefits</code>谈的都是持续的效果；第4句又写居民志向和城市自我形象的改变，因此把这两句连起来看长期发展具体落在哪里。</p>\n<p>原文以没有<code>lasting benefits</code>说明办得糟糕的文化年的问题，再用改变居民志向、使城市更大胆乐观来说明成功者带来的变化。<code>D</code>的<code>long-term growth</code>概括的是称号获得者持续发展，<code>commits to</code>则表示它为这种发展投入努力。这里的<code>growth</code>没有限定为经济数字增长，能够包括居民和城市形象的改善，与原文从一时声望转向持续收益的要求一致。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n<p>值得记住，这些称号不是万能药。办得糟糕的文化年像潮水般来去，带来一时声望，却不给社区留下持久收益。真正成功者做的远超填满旅馆、举办高调艺术活动和获得一年好报道；它们改变当地人的抱负，使城市自我形象更大胆、更乐观。</p>\n</blockquote>\n<p>先以潮水比喻短暂热闹，再用真正成功者说明长期改变，最后交代远见与合作才能推动这种转变。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A successful title holder commits to its long-term growth.</p>\n<p>称号获得者只有致力于长期发展，才算成功。</p>\n</blockquote>\n<p>growth不限于经济数字，也包括社区期待和地方认同的改善。commits to对应为长期改变投入努力，能覆盖作者的完整评价标准。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. D**\n\n- A：nudge ... into a bolder and more optimistic light要求自我形象向更大胆乐观的方向转变，maintain却是维持已有形象。\n- B：transform aspirations是改变居民抱负，meet aspirations是满足原有愿望。对象相同，动作却不同。\n- C：艺术受到瞩目可能是成功表现，C也没有限定短期；但成功标准在于do a great deal more及lasting benefits，不能只截取艺术地位提升。\n- D：无持久收益是失败反例，居民抱负和城市形象转变是成功标准，格拉斯哥持续至今的成果又作支持。D将这些连为长期发展。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"23","questionConclusion":true},"html":"<blockquote>\n<p><strong>23. D</strong></p>\n</blockquote>\n<ul>\n<li>A：nudge ... into a bolder and more optimistic light要求自我形象向更大胆乐观的方向转变，maintain却是维持已有形象。</li>\n<li>B：transform aspirations是改变居民抱负，meet aspirations是满足原有愿望。对象相同，动作却不同。</li>\n<li>C：艺术受到瞩目可能是成功表现，C也没有限定短期；但成功标准在于do a great deal more及lasting benefits，不能只截取艺术地位提升。</li>\n<li>D：无持久收益是失败反例，居民抱负和城市形象转变是成功标准，格拉斯哥持续至今的成果又作支持。D将这些连为长期发展。</li>\n</ul>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> Glasgow is mentioned in Paragraph 3 to present ______.\n>\n> 第3段提到格拉斯哥，是为了呈现______。\n\n### 题型\n\n例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。\n\n题干明确指定Paragraph 3和Glasgow，直接定位第3段末句。第3段已经完整读过，这里连着例子前的It is hard to get right和引出例子的But it can be done一起看，判断格拉斯哥这件事用来说明什么。\n\n### 核心出处\n\n> bringing prominence for a spell but leaving no lasting benefits to the community.\n>\n> But it can be done:\n>\n> have turned the city into the powerhouse of art, music and theatre that it remains today.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"24","questionIntro":true},"html":"<blockquote>\n<p>Glasgow is mentioned in Paragraph 3 to present ______.</p>\n<p>第3段提到格拉斯哥，是为了呈现______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干明确指定Paragraph 3和Glasgow，直接定位第3段末句。第3段已经完整读过，这里连着例子前的It is hard to get right和引出例子的But it can be done一起看，判断格拉斯哥这件事用来说明什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n<p>But it can be done:</p>\n<p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n"},{"title":"A. a contrasting case","raw":"### A. a contrasting case\n\n> 格拉斯哥在该处用作形成对照的例子。\n\n**做题模式中的状态：** 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n格拉斯哥可与前面失败文化年对照，因此A并非毫无联系；但例子直接跟在But it can be done后，首要作用是证明成功可实现。\n\n**出处：**\n\n> It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>格拉斯哥可与前面失败文化年对照，因此A并非毫无联系；但例子直接跟在But it can be done后，首要作用是证明成功可实现。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n</section>"},{"title":"A. a contrasting case","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 格拉斯哥在该处用作形成对照的例子。\n\n若将格拉斯哥的持久艺术成就与前面的失败文化年相比，确实能形成短暂热闹和长期收益的对照。不能把A排成“全文没有任何对照”。\n\n但是，题目问此处提它做什么。紧邻例子的上一句说办好很难、需要远见和合作，随后作者写`But it can be done:`，冒号后正是格拉斯哥。直接需要支持的判断是：尽管有难度，持续转变可以实现。\n\nB的supporting example将这条判断与事实联系说出来；A的contrasting case只概括它与较远的失败情形的关系，未落到本处最直接的举例目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>格拉斯哥可与前面失败文化年对照，因此A并非毫无联系；但例子直接跟在But it can be done后，首要作用是证明成功可实现。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p>若将格拉斯哥的持久艺术成就与前面的失败文化年相比，确实能形成短暂热闹和长期收益的对照。不能把A排成“全文没有任何对照”。</p>\n<p>但是，题目问此处提它做什么。紧邻例子的上一句说办好很难、需要远见和合作，随后作者写<code>But it can be done:</code>，冒号后正是格拉斯哥。直接需要支持的判断是：尽管有难度，持续转变可以实现。</p>\n<p>B的supporting example将这条判断与事实联系说出来；A的contrasting case只概括它与较远的失败情形的关系，未落到本处最直接的举例目的。</p>\n</section>"},{"title":"A. a contrasting case","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.\n>\n> 这很难办好，需要卓越远见，以及地方政府、私营部门、社区团体、文化机构合作。但它能做到：Glasgow担任欧洲文化之都的一年，可视为促使它成为并至今保持艺术、音乐、戏剧重镇的一系列复杂因素之一。\n\n作者先说明实现深层改变很难，需要远见与合作，再用冒号引出格拉斯哥已形成持续成果的经历。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Glasgow is presented as a contrasting case.\n>\n> 格拉斯哥在该处用作形成对照的例子。\n\nA泛指与失败形成差别，未说清这里要证明什么。B能具体接住it can be done这一判断，所以比只说对照更准确。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>格拉斯哥在该处用作形成对照的例子。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>格拉斯哥可与前面失败文  organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n<p>这很难办好，需要卓越远见，以及地方政府、私营部门、社区团体、文化机构合作。但它能做到：Glasgow担任欧洲文化之都的一年，可视为促使它成为并至今保持艺术、音乐、戏剧重镇的一系列复杂因素之一。</p>\n</blockquote>\n<p>作者没有从这段历史引出待解释问题，而是在论证后段用已有结果支持前面的可行性主张。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Glasgow is presented as a background story.</p>\n<p>格拉斯哥在该处用作背景故事。</p>\n</blockquote>\n<p>C需要往事承担情境铺垫的作用。实际冒号将主张与实现它的事实接起，不能因材料涉及过去就忽略证明功能。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. a related topic","raw":"### D. a related topic\n\n> 格拉斯哥在该处用作相关话题。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n与文化称号有关只是内容上的联系，作者此处具体用格拉斯哥支持成功能够实现。D没有说明它的论证作用。\n\n**出处：**\n\n> It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>格拉斯哥在该处用作相关话题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>与文化称号有关只是内容上的联系，作者此处具体用格拉斯哥支持成功能够实现。D没有说明它的论证作用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remar \n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>格拉斯哥在该处用作相关话题。</p>\n</blockquote>\n<p><code>related topic</code>把这里的作用说成提出与文化称号有关的话题，但格拉斯哥紧接<code>But it can be done</code>出现；回看这句和后面文化之都年作为<code>one of a complex series of factors</code>的判断，确定作者具体用它做什么。</p>\n<p>原文以<code>But it can be done</code>提出可以实现的判断，紧接着把格拉斯哥文化之都年与城市持续成为艺术重镇的结果连接起来，用这项具体经历说明判断成立。<code>D</code>的<code>related topic</code>把作者提及它的目的写成呈现相关话题，改变了这里以事实证明前一句的作用。格拉斯哥当然与文化称号有关，但“有关”是内容联系，作者在这一处实际建立的是判断与例证之间的联系。</p>\n</section>"},{"title":"D. a related topic","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.\n>\n> 这很难办好，需要卓越远见，以及地方政府、私营部门、社区团体、文化机构合作。但它能做到：Glasgow担任欧洲文化之都的一年，可视为促使它成为并至今保持艺术、音乐、戏剧重镇的一系列复杂因素之一。\n\nit can be done之后紧接城市保持艺术重镇地位，篇章没有另起一项相关议题。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Glasgow is presented as a related topic.\n>\n> 格拉斯哥在该处用作相关话题。\n\nD若只是转到相关话题，前面的可行性判断就得不到落地解释。实际例子正为那句话提供根据，B比一般的相关性更切题。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>格拉斯哥在该处用作相关话题。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>与文化称号有关只是内容上的联系，作者此处具体用格拉斯哥支持成功能够实现。D没有说明它的论证作用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>格拉斯哥在该处用作相关话题。</p>\n</blockquote>\n<p><code>related topic</code>把这里的作用说成提出与文化称号有关的话题，但格拉斯哥紧接<code>But it can be done</code>出现；回看这句和后面文化之都年作为<code>one of a complex series of factors</code>的判断，确定作者具体用它做什么。</p>\n<p>原文以<code>But it can be done</code>提出可以实现的判断，紧接着把格拉斯哥文化之都年与城市持续成为艺术重镇的结果连接起来，用这项具体经历说明判断成立。<code>D</code>的<code>related topic</code>把作者提及它的目的写成呈现相关话题，改变了这里以事实证明前一句的作用。格拉斯哥当然与文化称号有关，但“有关”是内容联系，作者在这一处实际建立的是判断与例证之间的联系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations. But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n<p>这很难办好，需要卓越远见，以及地方政府、私营部门、社区团体、文化机构合作。但它能做到：Glasgow担任欧洲文化之都的一年，可视为促使它成为并至今保持艺术、音乐、戏剧重镇的一系列复杂因素之一。</p>\n</blockquote>\n<p>it can be done之后紧接城市保持艺术重镇地位，篇章没有另起一项相关议题。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Glasgow is presented as a related topic.</p>\n<p>格拉斯哥在该处用作相关话题。</p>\n</blockquote>\n<p>D若只是转到相关话题，前面的可行性判断就得不到落地解释。实际例子正为那句话提供根据，B比一般的相关性更切题。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. B**\n\n- A：格拉斯哥可与前面失败文化年对照，因此A并非毫无联系；但例子直接跟在But it can be done后，首要作用是证明成功可实现。\n- B：But it can be done先说困难的长期转变可以做到，格拉斯哥的实际成果随后证明这一点。B对应判断与证据的直接连接。\n- C：格拉斯哥虽是过去经历，但并非仅交代背景；它在可以做到之后出现，证明称号能参与推动持续改变。\n- D：与文化称号有关只是内容上的联系，作者此处具体用格拉斯哥支持成功能够实现。D没有说明它的论证作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"24","questionConclusion":true},"html":"<blockquote>\n<p><strong>24. B</strong></p>\n</blockquote>\n<ul>\n<li>A：格拉斯哥可与前面失败文化年对照，因此A并非毫无联系；但例子直接跟在But it can be done后，首要作用是证明成功可实现。</li>\n<li>B：But it can be done先说困难的长期转变可以做到，格拉斯哥的实际成果随后证明这一点。B对应判断与证据的直接连接。</li>\n<li>C：格拉斯哥虽是过去经历，但并非仅交代背景；它在可以做到之后出现，证明称号能参与推动持续改变。</li>\n<li>D：与文化称号有关只是内容上的联系，作者此处具体用格拉斯哥支持成功能够实现。D没有说明它的论证作用。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> What is the author’s attitude towards the proposal?\n>\n> 作者对这项提议持什么态度？\n\n### 题型\n\n态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。\n\n题干问author’s attitude towards the proposal，粗读最后一段时读到and turn it into action，提到把提议付诸行动。回到第4段完整阅读，核对作者本人怎样评价文化城镇奖，以及他希望文化大臣如何对待这项提议。\n\n### 核心出处\n\n> should welcome this positive, hope-filled proposal, and turn it into action.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>What is the author’s attitude towards the proposal?</p>\n<p>作者对这项提议持什么态度？</p>\n</blockquote>\n<h3>题型</h3>\n<p>态度题：确定题干所指对象和评价者，再核对评价词的方向与程度。</p>\n<p>题干问author’s attitude towards the proposal，粗读最后一段时读到and turn it into action，提到把提议付诸行动。回到第4段完整阅读，核对作者本人怎样评价文化城镇奖，以及他希望文化大臣如何对待这项提议。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n"},{"title":"A. Skeptical.","raw":"### A. Skeptical.\n\n> 作者对提议持怀疑态度。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\npositive、hope-filled是明确肯定，should welcome并turn it into action要求积极推进，A的怀疑与末段立场不符。\n\n**出处：**\n\n> A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者对提议持怀疑态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>positive、hope-filled是明确肯定，should welcome并turn it into action要求积极推进，A的怀疑与末段立场不符。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n</section>"},{"title":"A. Skeptical.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者对提议持怀疑态度。\n\n`Skeptical`表示不确信提议值得认可，第4段末句的`should welcome`直接说明作者希望文化大臣怎样对待提议，因此回看这句的评价和行动要求。\n\n原文用`positive`、`hope-filled`肯定提议，并说文化大臣`should welcome`它、将它付诸行动。`A`的`Skeptical`把作者的态度写成怀疑，改变了这句明确的赞许和推进要求。这里不是在揣测别人会否支持，而是作者本人提出应该欢迎的主张。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者对提议持怀疑态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>positive、hope-filled是明确肯定，should welcome并turn it into action要求积极推进，A的怀疑与末段立场不符。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对提议持怀疑态度。</p>\n</blockquote>\n<p><code>Skeptical</code>表示不确信提议值得认可，第4段末句的<code>should welcome</code>直接说明作者希望文化大臣怎样对待提议，因此回看这句的评价和行动要求。</p>\n<p>原文用<code>positive</code>、<code>hope-filled</code>肯定提议，并说文化大臣<code>should welcome</code>它、将它付诸行动。<code>A</code>的<code>Skeptical</code>把作者的态度写成怀疑，改变了这句明确的赞许和推进要求。这里不是在揣测别人会否支持，而是作者本人提出应该欢迎的主张。</p>\n</section>"},{"title":"A. Skeptical.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.\n>\n> 文化城镇奖不仅可以关乎艺术，也可尊重城镇特色，帮助维持其商业主街、支持本地设施，尤其是赞颂当地居民。文化大臣应欢迎这项积极、充满希望的提议，并将其付诸行动。\n\n作者经历条件与风险分析后，仍以赞许评价和行动建议结束提议讨论，没有停在some人的讥讽。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The author is Skeptical toward the proposal.\n>\n> 作者对提议持怀疑态度。\n\nA需要作者不确信提议值得实施。实际他主张实施，不能将第二段别人的怀疑直接转成作者态度。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624 lled proposal, and turn it into action.\n>\n> 文化城镇奖不仅可以关乎艺术，也可尊重城镇特色，帮助维持其商业主街、支持本地设施，尤其是赞颂当地居民。文化大臣应欢迎这项积极、充满希望的提议，并将其付诸行动。\n\n末段先说文化奖可尊重地方特色、支持主街与设施、重视居民，再据这些潜在益处提出实施建议。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The author is Favourable toward the proposal.\n>\n> 作者对提议持赞成态度。\n\nC没有将支持扩大成无条件保证成功。前面的风险提示是在说明怎样办好，而非取消末段对提议的认可。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-C-0\"><blockquote>\n<p>作者对提议持赞成态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>作者称提议积极且充满希望，并要求欢迎、落实。Favourable能同时概括正面评价与支持行动。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对提议持赞成态度。</p>\n</blockquote>\n<p><code>Favourable</code>表示认可、支持，第4段末句的<code>should welcome</code>和<code>turn it into action</code>都说明作者希望提议得到积极对待，因此回看末句。</p>\n<p>原文称提议<code>positive</code>、<code>hope-filled</code>，并要求文化大臣<code>should welcome</code>它、将其转化为行动。<code>C</code>的<code>Favourable</code>把这种肯定评价和支持实施概括为赞成，评价对象仍是文化城镇奖提议，方向也一致。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n<p>文化城镇奖不仅可以关乎艺术，也可尊重城镇特色，帮助维持其商业主街、支持本地设施，尤其是赞颂当地居民。文化大臣应欢迎这项积极、充满希望的提议，并将其付诸行动。</p>\n</blockquote>\n<p>末段先说文化奖可尊重地方特色、支持主街与设施、重视居民，再据这些潜在益处提出实施建议。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is Favourable toward the proposal.</p>\n<p>作者对提议持赞成态度。</p>\n</blockquote>\n<p>C没有将支持扩大成无条件保证成功。前面的风险提示是在说明怎样办好，而非取消末段对提议的认可。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. Critical.","raw":"### D. Critical.\n\n> 作者对提议持批评态度。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n对办坏的文化年有批评，不等于反对当前提议。末段将提议称为positive、hope-filled并要求落实，方向是支持。\n\n**出处：**\n\n> A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者对提议持批评态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>对办坏的文化年有批评，不等于反对当前提议。末段将提议称为positive、hope-filled并要求落实，方向是支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n</section>"},{"title":"D. Critical.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者对提议持批评态度。\n\n`Critical`表示对提议作负面评价，第4段末句的`positive`, `hope-filled`却是在直接评价同一提议，因此回看这句，并连着作者要求的`turn it into action`一起判断。\n\n原文把提议称为`positive`, `hope-filled`，并主张欢迎和实施，表达的是认可。`D`的`Critical`把这种认可改成对提议的批评。末句没有把行动要求说成拒绝或纠正这项提议，而是要把这项被肯定的提议变成实际行动。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者对提议持批评态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>对办坏的文化年有批评，不等于反对当前提议。末段将提议称为positive、hope-filled并要求落实，方向是支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对提议持批评态度。</p>\n</blockquote>\n<p><code>Critical</code>表示对提议作负面评价，第4段末句的<code>positive</code>, <code>hope-filled</code>却是在直接评价同一提议，因此回看这句，并连着作者要求的<code>turn it into action</code>一起判断。</p>\n<p>原文把提议称为<code>positive</code>, <code>hope-filled</code>，并主张欢迎和实施，表达的是认可。<code>D</code>的<code>Critical</code>把这种认可改成对提议的批评。末句没有把行动要求说成拒绝或纠正这项提议，而是要把这项被肯定的提议变成实际行动。</p>\n</section>"},{"title":"D. Critical.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.\n>\n> 文化城镇奖不仅可以关乎艺术，也可尊重城镇特色，帮助维持其商业主街、支持本地设施，尤其是赞颂当地居民。文化大臣应欢迎这项积极、充满希望的提议，并将其付诸行动。\n\n作者先分清空有头衔与持久收益，再把经验用于城镇特色与居民，最后主张将提议转成行动。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The author is Critical toward the proposal.\n>\n> 作者对提议持批评态度。\n\nD需要对提议本身给出负面取舍。不能将他对执行风险或别人讥讽的转述，移作对整个方案的拒绝。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者对提议持批评态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>对办坏的文化年有批评，不等于反对当前提议。末段将提议称为positive、hope-filled并要求落实，方向是支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对提议持批评态度。</p>\n</blockquote>\n<p><code>Critical</code>表示对提议作负面评价，第4段末句的<code>positive</code>, <code>hope-filled</code>却是在直接评价同一提议，因此回看这句，并连着作者要求的<code>turn it into action</code>一起判断。</p>\n<p>原文把提议称为<code>positive</code>, <code>hope-filled</code>，并主张欢迎和实施，表达的是认可。<code>D</code>的<code>Critical</code>把这种认可改成对提议的批评。末句没有把行动要求说成拒绝或纠正这项提议，而是要把这项被肯定的提议变成实际行动。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n<p>文化城镇奖不仅可以关乎艺术，也可尊重城镇特色，帮助维持其商业主街、支持本地设施，尤其是赞颂当地居民。文化大臣应欢迎这项积极、充满希望的提议，并将其付诸行动。</p>\n</blockquote>\n<p>作者先分清空有头衔与持久收益，再把经验用于城镇特色与居民，最后主张将提议转成行动。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is Critical toward the proposal.</p>\n<p>作者对提议持批评态度。</p>\n</blockquote>\n<p>D需要对提议本身给出负面取舍。不能将他对执行风险或别人讥讽的转述，移作对整个方案的拒绝。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. C**\n\n- A：positive、hope-filled是明确肯定，should welcome并turn it into action要求积极推进，A的怀疑与末段立场不符。\n- B：作者讨论风险和条件可以保持理性，但题干问对提议的立场；末句明确赞许并主张实施，单说objective未概括这种支持。\n- C：作者称提议积极且充满希望，并要求欢迎、落实。Favourable能同时概括正面评价与支持行动。\n- D：对办坏的文化年有批评，不等于反对当前提议。末段将提议称为positive、hope-filled并要求落实，方向是支持。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. C</strong></p>\n</blockquote>\n<ul>\n<li>A：positive、hope-filled是明确肯定，should welcome并turn it into action要求积极推进，A的怀疑与末段立场不符。</li>\n<li>B：作者讨论风险和条件可以保持理性，但题干问对提议的立场；末句明确赞许并主张实施，单说objective未概括这种支持。</li>\n<li>C：作者称提议积极且充满希望，并要求欢迎、落实。Favourable能同时概括正面评价与支持行动。</li>\n<li>D：对办坏的文化年有批评，不等于反对当前提议。末段将提议称为positive、hope-filled并要求落实，方向是支持。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：提议的提出与理由**（段落1核心论点） 工党议员提议设立\"文化小镇\"奖 → 与现有文化城市称号并列 → 理由：【赫尔的成功（2.2亿英镑投资+大量艺术活动）不应仅限于城市】→ 现实问题：（小镇可以申请 // 但缺乏资源竞争）→ 预期效果：（年度活动+吸引资金+创造就业）\n\n↓（可能的质疑）\n\n**逻辑层次2：对提议的负面看法**（段落2反面观点） 两种质疑：【1.安慰奖：英国失去申请欧洲文化之都资格（格拉斯哥1990、利物浦2008曾获得）+ 2.自我庆祝狂热：脱欧后绝望地重塑自己（讽刺：文化村庄？文化郊区？文化小村？）】\n\n//（转折：理性分析）\n\n**逻辑层次3：成功的关键要素**（段落3深入分析） 警示：称号不是万能药 → 失败案例：（像潮水般来去，只带来短暂突出，无持久益处）// 成功案例：【不仅仅是（填满酒店+高调艺术活动+好新闻）→ 而是（改变居民抱负+推动城市自我形象）】→ 成功要求：（非凡远见+多方合作）→ 格拉斯哥例证：（欧洲文化之都帮助其成为艺术强大中心）\n\n↓（具体建议）\n\n**逻辑层次4：提议的积极意义与呼吁**（段落4作者态度） \"文化小镇\"的独特价值：【不仅关于艺术 → 更是（尊重小镇特色+维持主街道+支持当地设施+庆祝人民）】→ 呼吁：文化大臣应欢迎并付诸行动\n\n↑（全文主旨）\n\n全文核心观点：尽管\"文化小镇\"提议可能被视为脱欧后的自我安慰，但如果运作得当，它能够带来真正的长期益处，不仅促进经济发展，更能改变当地社区的精神面貌。关键在于避免流于形式，而要真正关注小镇特色和居民需求。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：提议的提出与理由</strong>（段落1核心论点） 工党议员提议设立&quot;文化小镇&quot;奖 → 与现有文化城市称号并列 → 理由：【赫尔的成功（2.2亿英镑投资+大量艺术活动）不应仅限于城市】→ 现实问题：（小镇可以申请 // 但缺乏资源竞争）→ 预期效果：（年度活动+吸引资金+创造就业）</p>\n<p>↓（可能的质疑）</p>\n<p><strong>逻辑层次2：对提议的负面看法</strong>（段落2反面观点） 两种质疑：【1.安慰奖：英国失去申请欧洲文化之都资格（格拉斯哥1990、利物浦2008曾获得）+ 2.自我庆祝狂热：脱欧后绝望地重塑自己（讽刺：文化村庄？文化郊区？文化小村？）】</p>\n<p>//（转折：理性分析）</p>\n<p><strong>逻辑层次3：成功的关键要素</strong>（段落3深入分析） 警示：称号不是万能药 → 失败案例：（像潮水般来去，只带来短暂突出，无持久益处）// 成功案例：【不仅仅是（填满酒店+高调艺术活动+好新闻）→ 而是（改变居民抱负+推动城市自我形象）】→ 成功要求：（非凡远见+多方合作）→ 格拉斯哥例证：（欧洲文化之都帮助其成为艺术强大中心）</p>\n<p>↓（具体建议）</p>\n<p><strong>逻辑层次4：提议的积极意义与呼吁</strong>（段落4作者态度） &quot;文化小镇&quot;的独特价值：【不仅关于艺术 → 更是（尊重小镇特色+维持主街道+支持当地设施+庆祝人民）】→ 呼吁：文化大臣应欢迎并付诸行动</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：尽管&quot;文化小镇&quot;提议可能被视为脱欧后的自我安慰，但如果运作得当，它能够带来真正的长期益处，不仅促进经济发展，更能改变当地社区的精神面貌。关键在于避免流于形式，而要真正关注小镇特色和居民需求。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Extending cultural and economic opportunities beyond cities\n\n> 把文化与经济机会拓展到城市之外\n\n介绍文化小镇提议，再用Hull成功、城镇竞争资源不足和资金就业预期说明理由。\n\n> A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK \"town of culture\" award.\n\n设文化城镇奖与城市称号并列，目的是为城镇提供文化机会，而非将两个地方行政合并。\n\n> Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities.\n\nHull的投资与艺术收益说明城市已得到什么，ought not to be confined to cities再提出应将这些机会向城镇拓展。\n\n> A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.\n\n资金和就业是提议期待的实际收益，与城镇竞标资源不足的理由相接，标题应同时体现文化与地方经济机会。\n\n这一部分的推进关系是：\n\n> 已有城市文化称号及收益 → 城镇竞标资源不足 → 独立设奖拓展资金就业机会\n\nbeyond cities对应ought not to be confined，opportunities兼顾艺术活动和经济收益。\n\n再看最强干扰项D：A national ban on every town’s application。\n\n原文明确城镇并非被禁止申请，问题是竞争资源不足。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Extending cultural and economic opportunities beyond cities</p>\n<blockquote>\n<p>把文化与经济机会拓展到城市之外</p>\n</blockquote>\n<p>介绍文化小镇提议，再用Hull成功、城镇竞争资源不足和资金就业预期说明理由。</p>\n<blockquote>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK &quot;town of culture&quot; award.</p>\n</blockquote>\n<p>设文化城镇奖与城市称号并列，目的是为城镇提供文化机会，而非将两个地方行政合并。</p>\n<blockquote>\n<p>Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities.</p>\n</blockquote>\n<p>Hull的投资与艺术收益说明城市已得到什么，ought not to be confined to cities再提出应将这些机会向城镇拓展。</p>\n<blockquote>\n<p>A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<p>资金和就业是提议期待的实际收益，与城镇竞标资源不足的理由相接，标题应同时体现文化与地方经济机会。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>已有城市文化称号及收益 → 城镇竞标资源不足 → 独立设奖拓展资金就业机会</p>\n</blockquote>\n<p>beyond cities对应ought not to be confined，opportunities兼顾艺术活动和经济收益。</p>\n<p>再看最强干扰项D：A national ban on every town’s application。</p>\n<p>原文明确城镇并非被禁止申请，问题是竞争资源不足。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】F. A cynical reading of a post-Brexit proposal\n\n> 对脱欧后提议的讥讽解读\n\n有人把提议当失去欧洲文化之都资格后的安慰奖，讽刺未来可能无限增设文化头衔。\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008.\n\nSome might see引入部分人的讥讽，booby prize把国内提议说成失去欧洲称号资格后的安慰。\n\n> Suburb of culture?\n\n连续追问文化城镇后是否还会有文化郊区等称号，接着self-celebration，夸张表现不断自设名目的可能。\n\n> Hamlet of culture?\n\nHamlet of culture仍是这一连续反问的末项，没有转成作者确实主张再办小村奖，标题必须保留讥讽转述的性质。\n\n这一部分的推进关系是：\n\n> 失去欧洲奖项资格 → 国内奖被讥为安慰 → 连续增设文化名号的自我庆祝猜测\n\ncynical reading对应A cynic与self-celebration；不是作者最后的支持态度。\n\n再看最强干扰项C：Extending cultural and economic opportunities beyond cities。\n\n本段不是继续列正面收益，而是在转述负面解读。\n\n**42题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】F. A cynical reading of a post-Brexit proposal</p>\n<blockquote>\n<p>对脱欧后提议的讥讽解读</p>\n</blockquote>\n<p>有人把提议当失去欧洲文化之都资格后的安慰奖，讽刺未来可能无限增设文化头衔。</p>\n<blockquote>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008.</p>\n</blockquote>\n<p>Some might see引入部分人的讥讽，booby prize把国内提议说成失去欧洲称号资格后的安慰。</p>\n<blockquote>\n<p>Suburb of culture?</p>\n</blockquote>\n<p>连续追问文化城镇后是否还会有文化郊区等称号，接着self-celebration，夸张表现不断自设名目的可能。</p>\n<blockquote>\n<p>Hamlet of culture?</p>\n</blockquote>\n<p>Hamlet of culture仍是这一连续反问的末项，没有转成作者确实主张再办小村奖，标题必须保留讥讽转述的性质。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>失去欧洲奖项资格 → 国内奖被讥为安慰 → 连续增设文化名号的自我庆祝猜测</p>\n</blockquote>\n<p>cynical reading对应A cynic与self-celebration；不是作者最后的支持态度。</p>\n<p>再看最强干扰项C：Extending cultural and economic opportunities beyond cities。</p>\n<p>本段不是继续列正面收益，而是在转述负面解读。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. A title alone cannot guarantee lasting benefits\n\n> 仅靠称号不能保证持久益处\n\n先警告头衔不是万能药，再以潮水比喻只带来短期声望、没有长期益处的文化年。\n\n> It is also wise to recall that such titles are not a cure-all.\n\nnot a cure-all直接限制称号的作用：拥有荣誉不等于自动解决地方发展问题。\n\n> A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.\n\n潮水来去与for a spell说明热度短暂，but leaving no lasting benefits才点出失败关键。标题应概括称号不足以保证持久收益。\n\n这一部分的推进关系是：\n\n> 称号非万能药 → 文化年可只带来短暂声望 → 社区无持久收益即未真正成功\n\nalone cannot guarantee保留not a cure-all，lasting benefits对应失败案例真正缺少的结果。\n\n再看最强干扰项G：Filling hotels as the only measure of cultural achievement。\n\n没有把酒店入住率设成唯一标准，后文还要超越这一层。\n\n**43题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. A title alone cannot guarantee lasting benefits</p>\n<blockquote>\n<p>仅靠称号不能保证持久益处</p>\n</blockquote>\n<p>先警告头衔不是万能药，再以潮水比喻只带来短期声望、没有长期益处的文化年。</p>\n<blockquote>\n<p>It is also wise to recall that such titles are not a cure-all.</p>\n</blockquote>\n<p>not a cure-all直接限制称号的作用：拥有荣誉不等于自动解决地方发展问题。</p>\n<blockquote>\n<p>A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n</blockquote>\n<p>潮水来去与for a spell说明热度短暂，but leaving no lasting benefits才点出失败关键。标题应概括称号不足以保证持久收益。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>称号非万能药 → 文化年可只带来短暂声望 → 社区无持久收益即未真正成功</p>\n</blockquote>\n<p>alone cannot guarantee保留not a cure-all，lasting benefits对应失败案例真正缺少的结果。</p>\n<p>再看最强干扰项G：Filling hotels as the only measure of cultural achievement。</p>\n<p>没有把酒店入住率设成唯一标准，后文还要超越这一层。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】E. The deeper changes that make a cultural year succeed\n\n> 使文化年成功的深层改变\n\n真正成功的地方做得远超过活动和宣传，改变居民抱负及城市形象，并依靠远见和多方合作；格拉斯哥证明其可行。\n\n> The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.\n\ndo a great deal more than要求超越酒店入住、艺术活动和宣传热度，后续抱负与自我形象才是更深的改变。\n\n> It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations.\n\n远见与政府、企业、社区、文化组织的合作说明改变怎样实现，重点由目标转入条件。\n\n> But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.\n\nBut it can be done引出Glasgow作为可行性证据，remains today保留成果持续性，未承诺每一获得者自动成功。\n\n这一部分的推进关系是：\n\n> 超越短期活动 → 居民抱负与城市形象改变 → 远见合作推动持续成果并有实例\n\ndeeper changes覆盖人的抱负与城市自我认识，succeed由长期保持的成果支持。\n\n再看最强干扰项G：Filling hotels as the only measure of cultural achievement。\n\n本段明确说do a great deal more than fill hotel bedrooms，与只看住满相反。\n\n**44题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】E. The deeper changes that make a cultural year succeed</p>\n<blockquote>\n<p>使文化年成功的深层改变</p>\n</blockquote>\n<p>真正成功的地方做得远超过活动和宣传，改变居民抱负及城市形象，并依靠远见和多方合作；格拉斯哥证明其可行。</p>\n<blockquote>\n<p>The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.</p>\n</blockquote>\n<p>do a great deal more than要求超越酒店入住、艺术活动和宣传热度，后续抱负与自我形象才是更深的改变。</p>\n<blockquote>\n<p>It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations.</p>\n</blockquote>\n<p>远见与政府、企业、社区、文化组织的合作说明改变怎样实现，重点由目标转入条件。</p>\n<blockquote>\n<p>But it can be done: Glasgow&#39;s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<p>But it can be done引出Glasgow作为可行性证据，remains today保留成果持续性，未承诺每一获得者自动成功。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>超越短期活动 → 居民抱负与城市形象改变 → 远见合作推动持续成果并有实例</p>\n</blockquote>\n<p>deeper changes覆盖人的抱负与城市自我认识，succeed由长期保持的成果支持。</p>\n<p>再看最强干扰项G：Filling hotels as the only measure of cultural achievement。</p>\n<p>本段明确说do a great deal more than fill hotel bedrooms，与只看住满相反。</p>\n<p><strong>44题选E。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Recognition that supports a town’s people and character\n\n> 支持小镇居民与特色的认可\n\n作者提出文化小镇应尊重地方特色、维持主街和设施，尤其重视居民，并呼吁落实提议。\n\n> A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities —helping sustain its high street, supporting local facilities and above all celebrating its people.\n\nnot just ... but把文化从艺术活动扩展到地方特色，主街、设施和居民具体说明社区可以怎样受益。\n\n> Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.\n\npositive、hope-filled与should welcome给出明确赞许，turn it into action把前面社区收益推成实施主张。\n\n这一部分的推进关系是：\n\n> 尊重城镇特色 → 支持日常设施与居民 → 欢迎并落实文化城镇提议\n\npeople and character对应celebrating its people与honouring peculiarities，recognition体现称号服务地方。\n\n再看最强干扰项D：A national ban on every town’s application。\n\n最后主张欢迎并实施，没有禁止申请。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Recognition that supports a town’s people and character</p>\n<blockquote>\n<p>支持小镇居民与特色的认可</p>\n</blockquote>\n<p>作者提出文化小镇应尊重地方特色、维持主街和设施，尤其重视居民，并呼吁落实提议。</p>\n<blockquote>\n<p>A &quot;town of culture&quot; could be not just about the arts but about honouring a town&#39;s peculiarities —helping sustain its high street, supporting local facilities and above all celebrating its people.</p>\n</blockquote>\n<p>not just ... but把文化从艺术活动扩展到地方特色，主街、设施和居民具体说明社区可以怎样受益。</p>\n<blockquote>\n<p>Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n<p>positive、hope-filled与should welcome给出明确赞许，turn it into action把前面社区收益推成实施主张。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>尊重城镇特色 → 支持日常设施与居民 → 欢迎并落实文化城镇提议</p>\n</blockquote>\n<p>people and character对应celebrating its people与honouring peculiarities，recognition体现称号服务地方。</p>\n<p>再看最强干扰项D：A national ban on every town’s application。</p>\n<p>最后主张欢迎并实施，没有禁止申请。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出把文化机会拓展到城镇 |\n| B | 说明远见合作条件并以格拉斯哥支持 |\n| C | 把经验落实为尊重城镇特色与居民 |\n| D | 转述安慰奖和自我庆祝的质疑 |\n| E | 承认形式化风险并用潮水说明 |\n| F | 解释资源不足与单独设奖的作用 |\n| G | 提出超越短期活动的长期成功标准 |\n| H | 支持以长期地方益处为目标落实提议 |\n\n全文推进：\n\n> 提出把文化机会拓展到城镇 → 解释资源不足与单独设奖的作用 → 转述安慰奖和自我庆祝的质疑 → 承认形式化风险并用潮水说明 → 提出超越短期活动的长期成功标准 → 说明远见合作条件并以格拉斯哥支持 → 把经验落实为尊重城镇特色与居民 → 支持以长期地方益处为目标落实提议\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th> gue, should have an opportunity to gain similar benefits.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The opportunity is uneven under the existing competition because towns generally have fewer resources for a successful bid.</p>\n</blockquote>\n<p>A末句要求小城镇获得similar benefits的机会，F的The opportunity承接这项机会，解释现有竞标中为何不均等。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A separate award could attract funding and create jobs. The proposal therefore responds to a practical difference in competitive capacity rather than a formal ban on towns taking part.</p>\n</blockquote>\n<p>城镇较少的竞标资源，而非形式上的禁令，造成实际竞争能力差异；独立奖项可能补充资金与就业机会。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Not everyone reads the proposal in this practical way.</p>\n</blockquote>\n<p>D的in this practical way指F刚说明的实际竞标问题，Not everyone随后引入另一种解读。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出把文化机会拓展到城镇 → 解释资源不足与单独设奖的作用 → 转述安慰奖和自我庆祝的质疑</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>A stronger community requires changes that survive the year of events.</p>\n</blockquote>\n<p>G的A stronger community需要前面已经讨论社区改善标准，A此时只提出机会，先接G既未解释竞标困难，也不能给D的practical way提供具体所指。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> The proposal therefore responds to a practical difference in competitive capacity rather than a formal ban on towns taking part.\n\n再看D段开头：\n\n> Not everyone reads the proposal in this practical way.\n\nF把提议解释为回应实际竞争能力差异，D用Not everyone reads ... in this practical way转向部分人的另一种看法。\n\n本段内部继续写道：\n\n> Some see it as consolation for Britain’s loss of access to a more prestigious European title. From that perspective, a new award risks becoming another episode of self-celebration rather than a source of genuine local improvement.\n\n这些人将提议视为失去欧洲奖项的安慰，继而担心只是自我庆祝而非地方改善，末句留下empty celebration的风险。\n\n后段E开头是：\n\n> The risk of an empty celebration is real enough to require caution.\n\nE的The risk of an empty celebration接住D的担心，开始由转述质疑走向作者自己的谨慎检验。\n\n这三段的推进关系：\n\n> 解释资源不足与单独设奖的作用 → 转述安慰奖和自我庆祝的质疑 → 承认形式化风险并用潮水说明\n\n再检验候选G：\n\n> A stronger community requires changes that survive the year of events.\n\nG直接提出更强社区需要持久改变，但F还未交代空洞庆祝风险，先放G会跳过E开头risk的来源。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The proposal therefore responds to a practical difference in competitive capacity rather than a formal ban on towns taking part.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Not everyone reads the proposal in this practical way.</p>\n</blockquote>\n<p>F把提议解释为回应实际竞争能力差异，D用Not everyone reads ... in this practical way转向部分人的另一种看法。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Some see it as consolation for Britain’s loss of access to a more prestigious European title. From that perspective, a new award risks becoming another episode of self-celebration rather than a source of genuine local improvement.</p>\n</blockquote>\n<p>这些人将提议视为失去欧洲奖项的安慰，继而担心只是自我庆祝而非地方改善，末句留下empty celebration的风险。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The risk of an empty celebration is real enough to require caution.</p>\n</blockquote>\n<p>E的The risk of an empty celebration接住D的担心，开始由转述质疑走向作者自己的谨慎检验。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释资源不足与单独设奖的作用 → 转述安慰奖和自我庆祝的质疑 → 承认形式化风险并用潮水说明</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>A stronger community requires changes that survive the year of events.</p>\n</blockquote>\n<p>G直接提出更强社区需要持久改变，但F还未交代空洞庆祝风险，先放G会跳过E开头risk的来源。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> Possessing a title is therefore not, by itself, evidence that the community will become stronger.\n\n再看G段开头：\n\n> A stronger community requires changes that survive the year of events.\n\nE末句说拥有头衔本身不证明community will become stronger，G以A stronger community承接，回答真正变强需要什么。\n\n本段内部继续写道：\n\n> Successful places reshape residents’ ambitions and develop a more confident image of themselves. Filling hotels and attracting favourable headlines may help, but neither is an adequate substitute for those deeper changes.\n\n居民抱负与自信形象的改变要超越活动年份，酒店和报道可以有帮助，却不能代替这些deeper changes。\n\n后段B开头是：\n\n> Achieving such changes depends on vision and cooperation among local authorities, businesses, community groups and cultural organisations.\n\nB的Achieving such changes接G末句深层改变，再说明远见和四类主体合作是实现条件。\n\n这三段的推进关系：\n\n> 承认形式化风险并用潮水说明 → 提出超越短期活动的长期成功标准 → 说明远见合作条件并以格拉斯哥支持\n\n再检验候选C：\n\n> The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme.\n\nC的The lesson for a smaller town需要前面已有成功经验，E仍在提出称号不足的警告；直接接C无法为B的such changes先定义具体改变。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Possessing a title is therefore not, by itself, evidence that the community will become stronger.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>A stronger community requires changes that survive the year of events.</p>\n</blockquote>\n<p>E末句说拥有头衔本身不证明community will become stronger，G以A stronger community承接，回答真正变强需要什么。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Successful places reshape residents’ ambitions and develop a more confident image of themselves. Filling hotels and attracting favourable headlines may help, but neither is an adequate substitute for those deeper changes.</p>\n</blockquote>\n<p>居民抱负与自信形象的改变要超越活动年份，酒店和报道可以有帮助，却不能代替这些deeper changes。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Achieving such changes depends on vision and cooperation among local authorities, businesses, community groups and cultural organisations.</p>\n</blockquote>\n<p>B的Achieving such changes接G末句深层改变，再说明远见和四类主体合作是实现条件。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>承认形式化风险并用潮水说明 → 提出超越短期活动的长期成功标准 → 说明远见合作条件并以格拉斯哥支持</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme.</p>\n</blockquote>\n<p>C的The lesson for a smaller town需要前面已有成功经验，E仍在提出称号不足的警告；直接接C无法为B的such changes先定义具体改变。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> Filling hotels and attracting favourable headlines may help, but neither is an adequate substitute for those deeper changes.\n\n再看B段开头：\n\n> Achieving such changes depends on vision and cooperation among local authorities, businesses, community groups and cultural organisations.\n\nG末句说短期入住与报道不能替代deeper changes，B的Achieving such changes承接这些目标，转入实现条件。\n\n本段内部继续写道：\n\n> Glasgow’s development as a lasting centre of the arts shows that it can be done. Its experience supplies support for the possibility, not a guarantee that every title holder will succeed.\n\nGlasgow保持艺术重镇地位支持it can be done，但不保证每个获得者成功，B保留经验的可借鉴性与边界。\n\n后段C开头是：\n\n> The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme.\n\nC的The lesson接B的experience，从大城市实例转向小城镇怎样根据自身特色吸收经验。\n\n这三段的推进关系：\n\n> 提出超越短期活动的长期成功标准 → 说明远见合作条件并以格拉斯哥支持 → 把经验落实为尊重城镇特色与居民\n\n再检验候选F：\n\n> The opportunity is uneven under the existing competition because towns generally have fewer resources for a successful bid.\n\nF回到竞标资源不足，与深层改变如何实现不属同一环节；它也不提供C开头The lesson所需的成功经验。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Filling hotels and attracting favourable headlines may help, but neither is an adequate substitute for those deeper changes.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Achieving such changes depends on vision and cooperation among local authorities, businesses, community groups and cultural organisations.</p>\n</blockquote>\n<p>G末句说短期入住与报道不能替代deeper changes，B的Achieving such changes承接这些目标，转入实现条件。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Glasgow’s development as a lasting centre of the arts shows that it can be done. Its experience supplies support for the possibility, not a guarantee that every title holder will succeed.</p>\n</blockquote>\n<p>Glasgow保持艺术重镇地位支持it can be done，但不保证每个获得者成功，B保留经验的可借鉴性与边界。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme.</p>\n</blockquote>\n<p>C的The lesson接B的experience，从大城市实例转向小城镇怎样根据自身特色吸收经验。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出超越短期活动的长期成功标准 → 说明远见合作条件并以格拉斯哥支持 → 把经验落实为尊重城镇特色与居民</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The opportunity is uneven under the existing competition because towns generally have fewer resources for a successful bid.</p>\n</blockquote>\n<p>F回到竞标资源不足，与深层改变如何实现不属同一环节；它也不提供C开头The lesson所需的成功经验。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Its experience supplies support for the possibility, not a guarantee that every title holder will succeed.\n\n再看C段开头：\n\n> The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme.\n\nB说Glasgow经验支持可能性却不是普遍保证，C的The lesson据此强调小城镇应立足自身特色，不照搬大城市方案。\n\n本段内部继续写道：\n\n> Recognition could help sustain local shops, facilities and the people who use them. A cultural award then becomes a means of supporting the community instead of merely advertising it.\n\n支持商店、设施和使用它们的人，把文化认可变成服务社区的办法，区别于只替社区做宣传。\n\n后段H开头是：\n\n> Seen in this way, the proposal deserves a constructive welcome.\n\nH的Seen in this way概括C刚给出的社区受益方向，再形成建设性欢迎的态度。\n\n这三段的推进关系：\n\n> 说明远见合作条件并以格拉斯哥支持 → 把经验落实为尊重城镇特色与居民 → 支持以长期地方益处为目标落实提议\n\n再检验候选F：\n\n> The opportunity is uneven under the existing competition because towns generally have fewer resources for a successful bid.\n\nF只解释竞标资源差异，尚未说明文化奖如何真正服务社区；放这里会把结论拉回提议初因，使H的this way缺少具体实施方向。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Its experience supplies support for the possibility, not a guarantee that every title holder will succeed.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The lesson for a smaller town is to build on its own characteristics rather than imitate a large city’s programme.</p>\n</blockquote>\n<p>B说Glasgow经验支持可能性却不是普遍保证，C的The lesson据此强调小城镇应立足自身特色，不照搬大城市方案。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Recognition could help sustain local shops, facilities and the people who use them. A cultural award then becomes a means of supporting the community instead of merely advertising it.</p>\n</blockquote>\n<p>支持商店、设施和使用它们的人，把文化认可变成服务社区的办法，区别于只替社区做宣传。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Seen in this way, the proposal deserves a constructive welcome.</p>\n</blockquote>\n<p>H的Seen in this way概括C刚给出的社区受益方向，再形成建设性欢迎的态度。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明远见合作条件并以格拉斯哥支持 → 把经验落实为尊重城镇特色与居民 → 支持以长期地方益处为目标落实提议</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The opportunity is uneven under the existing competition because towns generally have fewer resources for a successful bid.</p>\n</blockquote>\n<p>F只解释竞标资源差异，尚未说明文化奖如何真正服务社区；放这里会把结论拉回提议初因，使H的this way缺少具体实施方向。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **cultural development** | **文化发展** | **社会现象类｜文化教育** | **宏观主题** |\n| community participation | 社区参与 | 社会现象类｜社会生活 | 宏观主题 |\n| long-term development | 长期发展 | 社会现象类｜社会生活 | 宏观主题 |\n| **local identity** | **地方认同** | **社会现象类｜文化教育** | **宏观主题** |\n| public facilities | 公共设施 | 社会现象类｜社会生活 | 宏观主题 |\n| shared aspirations | 共同抱负 | 人生哲理类｜理想与抱负 | 个人主题 |\n| cons
