5///ffff//9999///3333///ffff//9999///3333///ffff//9999///33P9Q4AA==","articleSize":{"w":1624,"h":2262},"questionSize":{"w":1624,"h":2262},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>31题题干</h2>\n<p><strong>The author believes that the bills sponsored by Lewis and Haddad will ______.</strong></p>\n<blockquote><p>作者认为，刘易斯和哈达德提出的法案将会______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>32题题干</h2>\n<p><strong>Which of the following is true of the California measure?</strong></p>\n<blockquote><p>关于加利福尼亚州的这项措施，以下哪项说法正确？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>33题题干</h2>\n<p><strong>The author mentions the study by Catalyst to illustrate ______.</strong></p>\n<blockquote><p>作者提到卡特利斯特的研究，是为了说明______。</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n\n<hr />\n<h2>34题题干</h2>\n<p><strong>Norway’s adoption of a nationwide corporate gender quota has led to ______.</strong></p>\n<blockquote><p>挪威实施全国性的企业性别配额，已经导致______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>35题题干</h2>\n<p><strong>Which of the following can be inferred from the text?</strong></p>\n<blockquote><p>以下哪项可以从文章中推断出来？</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, Because, unless</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>insincere, unconstitutional, self-serving</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>require, increasing, help</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>opportunities, equality, seats</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>women, boards, quotas</td></tr></tbody></table>\n\n<hr />\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of <strong>[xxx]</strong> that benefits only the most privileged and does little to help average people.</p>\n\n<hr />\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. / But all too often such policies are an insincere form of <strong>[xxx]</strong> that benefits only the most privileged and does little to help average people.</p>\n\n<hr />\n<p>进步派常支持多样性规定 as 通向平等的道路 and a way to level the playing field. / But all too often such policies are an insincere form of <strong>[xxx]</strong> that 只惠及最享特权者 and does little to help 普通人.</p>\n\n<hr />\n<p>1、进步派常支持多样性规定、通向平等的道路、只惠及最享特权者、普通人。</p>\n\n<hr />\n<p>A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure “gender <strong>[xxx]</strong>” on boards and <strong>[xxx]</strong>, provide a case in point.</p>\n\n<hr />\n<p>A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, / to ensure “gender <strong>[xxx]</strong>” on boards and <strong>[xxx]</strong>, / provide a case in point.</p>\n\n<hr />\n<p>两项法案 sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, / to ensure “gender <strong>[xxx]</strong>” on boards and <strong>[xxx]</strong>, / 提供一个恰当例子.</p>\n\n<hr />\n<p>2、两项法案、提供一个恰当例子。</p>\n\n<hr />\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and <strong>[xxx]</strong> will be required to set aside 50 percent of board seats for women by 2022.</p>\n\n<hr />\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. / In order to ensure that elite women have more such opportunities, / they have proposed imposing government quotas. / If the bills become law, / state boards and <strong>[xxx]</strong> will be required to set aside 50 percent of board seats for women by 2022.</p>\n\n<hr />\n<p>Haddad and Lewis are concerned that 超过一半 the state-government boards are 女性不足40%. / In order to ensure that elite women have more such opportunities, / they have 提议实施政府配额. / If the bills become law, / state boards and <strong>[xxx]</strong> will be required to set aside 50 percent of 给女性的董事会席位 by 2022.</p>\n\n<hr />\n<p>3、超过一半、女性不足40%、提议实施政府配额、给女性的董事会席位。</p>\n\n<hr />\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which <strong>[xxx]</strong> classifies people on the basis of sex, is probably unconstitutional.</p>\n\n<hr />\n<p>The bills are similar to a measure recently adopted in California, / which last year became the first state to require gender quotas for private companies. / In signing the measure, / California Governor Jerry Brown admitted that the law, / which <strong>[xxx]</strong> classifies people on the basis of sex, / is probably unconstitutional.</p>\n\n<hr />\n<p>The bills are similar to 加州最近通过的一项措施, / which last year became the first state to require gender quotas for private companies. / In signing the measure, / California Governor Jerry Brown admitted that the law, / which <strong>[xxx]</strong> classifies people 根据性别, / 很可能违宪.</p>\n\n<hr />\n<p>4、加州最近通过的一项措施、根据性别、很可能违宪。</p>\n\n<hr />\n<p>The US Supreme Court frowns on sex-based <strong>[xxx]</strong> unless they are designed to address an “important” policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n\n<hr />\n<p>The US Supreme Court frowns on sex-based <strong>[xxx]</strong> unless they are designed to address an “important” policy interest. / Because the California law applies to all boards, / even where there is no history of prior discrimination, / courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n\n<hr />\n<p>美国最高法院不赞成 sex-based <strong>[xxx]</strong> unless they are designed to address an “important” policy interest. / Because the California law 适用于所有董事会, / even where there is 此前没有歧视历史, / courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n\n<hr />\n<p>5、美国最高法院不赞成、适用于所有董事会、此前没有歧视历史。</p>\n\n<hr />\n<p>But are such government mandates even necessary? Female <strong>[xxx]</strong> on corporate boards may not currently mirror the percentage of women in the general population, but so what?</p>\n\n<hr />\n<p>But are such government mandates even necessary? / Female <strong>[xxx]</strong> on corporate boards may not currently mirror the percentage of women in the general population, / but so what?</p>\n\n<hr />\n<p>But are 这种政府强制规定 even necessary? / Female <strong>[xxx]</strong> on corporate boards may not currently mirror the percentage of women in the general population, / 但那又怎样?</p>\n\n<hr />\n<p>6、这种政府强制规定、但那又怎样。</p>\n\n<hr />\n<p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n\n<hr />\n<p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference. / According to a study by Catalyst, / between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n\n<hr />\n<p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing 没有政府干预. / 根据卡特利斯特的一项研究, / between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n\n<hr />\n<p>7、没有政府干预、根据卡特利斯特的一项研究。</p>\n\n<hr />\n<p>Requiring companies to make gender the primary qualification for board <strong>[xxx]</strong> will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n\n<hr />\n<p>Requiring companies to make gender the primary qualification for board <strong>[xxx]</strong> will inevitably lead to less experienced private sector boards. / That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n\n<hr />\n<p>Requiring companies to make gender the primary qualification for board <strong>[xxx]</strong> will inevitably lead to 经验较少的私营部门董事会. / That is exactly what happened when Norway adopted a 全国企业性别配额.</p>\n\n<hr />\n<p>8、经验较少的私营部门董事会、全国企业性别配额。</p>\n\n<hr />\n<p>Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the <strong>[xxx]</strong> of qualified women to serve on such boards has led to a “golden <strong>[xxx]</strong>” <strong>[xxx]</strong>, where the same elite women scoop up multiple seats on a variety of boards.</p>\n\n<hr />\n<p>Writing in The New Republic, / Alice Lee notes that increasing the number of opportunities for board membership without increasing the <strong>[xxx]</strong> of qualified women to serve on such boards has led to a “golden <strong>[xxx]</strong>” <strong>[xxx]</strong>, / where the same elite women scoop up multiple seats on a variety of boards.</p>\n\n<hr />\n<p>Writing in The New Republic, / Alice Lee notes that increasing the number of 担任董事的机会 without increasing the <strong>[xxx]</strong> of qualified women to serve on such boards has led to a “golden <strong>[xxx]</strong>” <strong>[xxx]</strong>, / where 同一批精英女性 scoop up 多个席位 on 各种董事会.</p>\n\n<hr />\n<p>9、担任董事的机会、同一批精英女性、多个席位、各种董事会。</p>\n\n<hr />\n<p>Next time somebody pushes corporate quotas as a way to promote gender <strong>[xxx]</strong>, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n\n<hr />\n<p>Next time somebody pushes corporate quotas as a way to promote gender <strong>[xxx]</strong>, / remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n\n<hr />\n<p>Next time somebody pushes corporate quotas as a way to promote gender <strong>[xxx]</strong>, / remember that 这类政策大多服务自身利益 that 让发起者感觉良好 but do little to 帮助普通女性.</p>\n\n<hr />\n<p>10、这类政策大多服务自身利益、让发起者感觉良好、帮助普通女性。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到进步派常支持多样性规定、通向平等的道路、只惠及最享特权者、普通人；中间又出现两项法案、提供一个恰当例子、两项法案、提供一个恰当例子；超过一半、女性不足40%、提议实施政府配额、给女性的董事会席位；加州最近通过的一项措施、根据性别、根据性别、很可能违宪；美国最高法院不赞成、适用于所有董事会、适用于所有董事会、此前没有歧视历史；这种政府强制规定、但那又怎样、这种政府强制规定、但那又怎样；没有政府干预、根据卡特利斯特的一项研究、没有政府干预、根据卡特利斯特的一项研究；经验较少的私营部门董事会、全国企业性别配额、经验较少的私营部门董事会、全国企业性别配额；担任董事的机会、同一批精英女性、多个席位、各种董事会；结尾还有这类政策大多服务自身利益、让发起者感觉良好、让发起者感觉良好、帮助普通女性。</p>\n<p>到这里还不能自然地说清楚：女性席位、政策和法院判断怎样联系，已有增长与后面的经验各说明什么，普通女性得到哪些帮助。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n\n<hr />\n<h2>31题</h2>\n<blockquote><p>The author believes that the bills sponsored by Lewis and Haddad will ______.<br />\n作者认为，刘易斯和哈达德提出的法案将会______。</p>\n</blockquote>\n<p>题干直接给出Lewis和Haddad，第2段出现这两位提案人，第3段继续说明他们的担忧和法案安排。第2段说这些法案provide a case in point，要知道它们例示什么，还需回读第1段。因此先完整读第1—3段，连起作者评价、具体法案和预期作用。</p>\n<blockquote><p>原文参考：</p>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of <strong>[xxx]</strong> that benefits only the most privileged and does little to help average people.</p>\n<p>开始精读：</p>\n<p>Progressives often support diversity mandates / as a path to equality / and a way to level the playing field. / But all too often such policies are an insincere form of <strong>[xxx]</strong> / that benefits only the most privileged / and does little to help average people.</p>\n<p>进步派常常支持多样性强制规定， / 把它看作通向平等的一条路， / 以及创造公平竞争条件的一种方式。 / 但这类政策往往是一种并不真诚的<strong>[xxx]</strong>， / 只让最享特权的人受益， / 对普通人却几乎没有帮助。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure “gender <strong>[xxx]</strong>” on boards and <strong>[xxx]</strong>, provide a case in point.</p>\n<p>开始精读：</p>\n<p>A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, / to ensure “gender <strong>[xxx]</strong>” on boards and <strong>[xxx]</strong>, / provide a case in point.</p>\n<p>马萨诸塞州参议员杰森·刘易斯和州众议院临时议长帕特里夏·哈达德提出了两项法案， / 旨在确保董事会及<strong>[xxx]</strong>中的“性别<strong>[xxx]</strong>”， / 就是一个恰当的例子。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and <strong>[xxx]</strong> will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>开始精读：</p>\n<p>Haddad and Lewis are concerned / that more than half the state-government boards are less than 40 percent female. / In order to ensure that elite women have more such opportunities, / they have proposed imposing government quotas. / If the bills become law, / state boards and <strong>[xxx]</strong> will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>哈达德和刘易斯担忧， / 该州超过一半的州政府董事会中，女性比例不足40%。 / 为了确保精英女性拥有更多此类机会， / 他们提议实施政府配额。 / 如果这些法案成为法律， / 到2022年，州董事会和<strong>[xxx]</strong>将被要求为女性预留50%的董事会席位。</p>\n</blockquote>\n<p>空格要补的是作者认为这些法案会带来的结果。要把第3段预留董事会席位的安排，与第1段对政策受益者的判断、以及第2段将法案作为例子的连接一起核对。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. help little to reduce gender bias</h3>\n<blockquote><p>对减少性别偏见帮助不大</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为，刘易斯和哈达德提出的法案对减少性别偏见帮助不大。</p>\n<p>A说减少性别偏见的帮助不大。第2段将这两项法案称为<code>a case in point</code>，我们先往前看它在举哪种情况的例子。</p>\n<blockquote><p>benefits only the most privileged and does little to help average people.</p>\n</blockquote>\n<blockquote><p>provide a case in point.</p>\n</blockquote>\n<blockquote><p>In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.</p>\n</blockquote>\n<p>开头说这些政策常被宣传为通向平等的办法，但实际只让最有优势的人受益，普通人得到的帮助很少。</p>\n<p>随后<code>a case in point</code>把两项法案接到这份批评上。第3段又明确说它们给精英女性更多机会，要求预留一半席位。</p>\n<p>因此，增加部分女性的席位，不等于作者认可它已经广泛减少性别不平等。A的帮助不大能接上作者对实际受益范围的保留。</p>\n<p><strong>两项法案被举作只帮助优势群体、少帮普通人的例子，作者是否认为它们能广泛消除性别偏见？</strong></p>\n<p>并没有。A说帮助不大，和这一批评相合。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. pose a threat to the state government</h3>\n<blockquote><p>对州政府构成威胁</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为，刘易斯和哈达德提出的法案将对州政府构成威胁。</p>\n<p>B说对州政府构成威胁。第3段提到<code>state-government boards</code>，我们看州政府在这里是被威胁的对象，还是需要调整席位的机构。</p>\n<blockquote><p>more than half the state-government boards are less than 40 percent female.</p>\n</blockquote>\n<blockquote><p>state boards and <strong>[xxx]</strong> will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<p>原文说州政府很多委员会的女性比例不到40%，法案要把这类席位中的一半留给女性。</p>\n<p>这说明哪些机构受规定约束，并没有说政府因此不能运转、权力受到攻击或面临某种危险。</p>\n<p>B把调整席位的要求写成对州政府的威胁。规定一个机构应如何配置人员，不足以自动证明这个机构被威胁。</p>\n<p><strong>州政府机构要按法案调整女性席位，等于作者说州政府受到威胁吗？</strong></p>\n<p>不等于。原段没有交代这样的危险。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. raise women’s position in politics</h3>\n<blockquote><p>提高女性在政治中的地位</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为，刘易斯和哈达德提出的法案将提高女性在政治中的地位。</p>\n<p>C说提高女性政治地位。原文确实计划增加女性席位，我们要看作者怎样限制了受益者。</p>\n<blockquote><p>more than half the state-government boards are less than 40 percent female.</p>\n</blockquote>\n<blockquote><p>In order to ensure that elite women have more such opportunities</p>\n</blockquote>\n<blockquote><p>set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<p>法案提出者担心女性比例不足，希望给精英女性更多这类机会。这里写的是特定委员会席位，不是女性在政治生活各方面的整体地位。</p>\n<p>更前面作者已经把它作为只让最有优势者得益、少帮普通人的例子。题干问作者的判断，不能只拿提出者期待的席位增加回答。</p>\n<p>C把有限的一批精英获得机会，概括成女性政治地位提升，略掉了作者恰恰强调的受益限制。</p>\n<p><strong>作者强调机会落在精英女性、普通人帮助不多，能直接概括成他认为女性整体政治地位将提升吗？</strong></p>\n<p>不能。C放大了受益范围，也没有保留作者的批评。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. greatly broaden career options</h3>\n<blockquote><p>大幅拓宽职业选择</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，刘易斯和哈达德提出的法案将大幅拓宽职业选择。</p>\n<p>D说大幅拓宽职业选择。第3段的<code>more such opportunities</code>中，<code>such</code>指向前面什么机会，我们先接清楚。</p>\n<blockquote><p>In order to ensure that elite women have more such opportunities</p>\n</blockquote>\n<blockquote><p>set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<p>这些机会是州政府委员会中的席位。法案规定预留比例，使更多席位给女性，并没有介绍新的职业种类。</p>\n<p>更多同一种席位，与职业选择变得更宽是两回事。即使获得某个职位的机会增加，也不意味着可选的行业和职业大幅增加。</p>\n<p>D又用了<code>greatly</code>，把这项特定安排写成广泛的职业扩展，原段没有这样的结果。</p>\n<p><strong>法案增加的是某类委员会席位，还是许多不同职业的选择？</strong></p>\n<p>是特定席位。D把机会数量改成职业选择范围，还扩大了程度。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>31题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一次判断：留下A。法案的机会集中于精英女性、对普通人帮助有限，可以支持其减轻性别偏见的作用不大这一推测。</p>\n\n<hr />\n<h2>32题</h2>\n<blockquote><p>Which of the following is true of the California measure?<br />\n关于加利福尼亚州的这项措施，以下哪项说法正确？</p>\n</blockquote>\n<p>题干直接给出the California measure，第4段出现a measure recently adopted in California并交代州长的评价，第5段继续用the California law解释法院可能怎样看待它。先完整读第4、5段，把措施内容、实施对象和法律评价连在一起。</p>\n<blockquote><p>原文参考：</p>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which <strong>[xxx]</strong> classifies people on the basis of sex, is probably unconstitutional.</p>\n<p>开始精读：</p>\n<p>The bills are similar to a measure recently adopted in California, / which last year became the first state to require gender quotas for private companies. / In signing the measure, / California Governor Jerry Brown admitted that the law, / which <strong>[xxx]</strong> classifies people on the basis of sex, / is probably unconstitutional.</p>\n<p>这些法案与加利福尼亚州最近通过的一项措施相似， / 该州去年成为第一个要求私营企业实行性别配额的州。 / 在签署这项措施时， / 加利福尼亚州州长杰里·布朗承认，这项法律， / 它<strong>[xxx]</strong>根据性别给人分类， / 很可能违宪。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The US Supreme Court frowns on sex-based <strong>[xxx]</strong> unless they are designed to address an “important” policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n<p>开始精读：</p>\n<p>The US Supreme Court frowns on sex-based <strong>[xxx]</strong> / unless they are designed to address an “important” policy interest. / Because the California law applies to all boards, / even where there is no history of prior discrimination, / courts are likely to rule / that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n<p>美国最高法院不赞成基于性别的<strong>[xxx]</strong>， / 除非它们旨在解决一项“重要”的政策利益问题。 / 因为加利福尼亚州的法律适用于所有董事会， / 即使是过去没有歧视历史的董事会也不例外， / 法院很可能会裁定， / 该法律违反了宪法中“平等保护”的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>本题要核对加州这项措施的具体事实。第4段写要求私营企业实行性别配额及州长的判断，第5段写法律适用范围和法院可能作出的裁定，要区分已经发生的措施与尚属可能的判断。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. It has irritated private business owners.</h3>\n<blockquote><p>它已经激怒了私营企业主</p>\n</blockquote>\n<p>把A接回题干，它说的是：加州的这项措施已经激怒了私营企业主。</p>\n<p>A说已激怒私营企业主。第4段提到私人公司，我们看跟在这项措施后面的是企业主反应，还是州长的说明。</p>\n<blockquote><p>require gender quotas for private companies.</p>\n</blockquote>\n<blockquote><p>California Governor Jerry Brown admitted that the law</p>\n</blockquote>\n<blockquote><p>is probably unconstitutional.</p>\n</blockquote>\n<p>加州首次要求私人公司实行性别配额，这说明措施适用谁。下一句写的是州长签署时承认它可能违宪。</p>\n<p>原段没有采访企业主，也没有描述他们生气、反对或抗议。被规定约束，不一定就已经被激怒。</p>\n<p>A把适用对象变成作出情绪反应的人，原文并没有给出这一步。</p>\n<p><strong>措施要求私人公司实行配额，是否已经说明企业主对此愤怒？</strong></p>\n<p>没有。A添加了未被描述的企业主反应。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. It is welcomed by the Supreme Court.</h3>\n<blockquote><p>它受到最高法院欢迎</p>\n</blockquote>\n<p>把B接回题干，它说的是：加州的这项措施受到最高法院欢迎。</p>\n<p>B说最高法院欢迎。第5段的<code>frowns on</code>已经给出法院对按性别区分的态度，我们再看后面的例外。</p>\n<blockquote><p>The US Supreme Court frowns on sex-based <strong>[xxx]</strong> unless they are designed to address an “important” policy interest.</p>\n</blockquote>\n<blockquote><p>courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n</blockquote>\n<p>法院一般不赞同按性别作这种区分，除非是为处理重要政策利益。原文列出例外，并不等于当前加州法已符合例外。</p>\n<p>后面恰恰说它适用于所有董事会，包括没有既往歧视历史的，法院很可能认定违反平等保护。</p>\n<p>B把这种保留和可能的否定，写成欢迎。单独拿“重要政策利益”的例外，也不能抹掉作者随后对这部法的具体判断。</p>\n<p><strong>原文说法院可能认定这部法违反平等保护，能用欢迎来概括吗？</strong></p>\n<p>不能。B和文中的具体判断相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. It may go against the Constitution.</h3>\n<blockquote><p>它可能违反宪法</p>\n</blockquote>\n<p>把C接回题干，它说的是：加州的这项措施可能违反宪法。</p>\n<p>C说可能违反宪法。第4段州长承认<code>probably unconstitutional</code>，第5段又有<code>courts are likely to rule</code>，我们把两处接上。</p>\n<blockquote><p>is probably unconstitutional.</p>\n</blockquote>\n<blockquote><p>courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n</blockquote>\n<p>州长签署时承认它可能违宪；作者随后解释，法适用于所有董事会，甚至没有既往歧视的地方，也一律按性别设配额。</p>\n<p>由此原文判断法院很可能认为它违反平等保护。C用<code>may go against</code>，同样保留了可能性，没有说最终判决已经作出。</p>\n<p>题目是在核对文中说法，C对应两处明确的法律疑虑。</p>\n<p><strong>州长说可能违宪，作者又说法院很可能这样认定，是否支持C的可能违反宪法？</strong></p>\n<p>支持。C的内容和可能程度都与原文相合。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. It will settle the prior controversies.</h3>\n<blockquote><p>它将解决先前的争议</p>\n</blockquote>\n<p>把D接回题干，它说的是：加州的这项措施将解决先前的争议。</p>\n<p>D说解决先前争议。第5段有<code>prior discrimination</code>，我们先分清它与争议是什么关系。</p>\n<blockquote><p>Because the California law applies to all boards, even where there is no history of prior discrimination</p>\n</blockquote>\n<blockquote><p>courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n</blockquote>\n<p>原文说有些董事会没有过往歧视历史，法却仍然一律适用。作者用这点说明措施可能受到违宪质疑。</p>\n<p><code>prior discrimination</code>是过去的歧视，不是“先前的争议”。而且没有歧视历史的地方也被覆盖，不能因此说旧争议将得到解决。</p>\n<p>段落的推进反而是这种一律要求可能带来新的法律问题，D的解决结果没有被写出。</p>\n<p><strong>原文提既往歧视，是为了说明法案解决旧争议，还是说明它一律适用可能有法律问题？</strong></p>\n<p>是后者。D把这项问题改成了已经预期的解决效果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次判断：留下C。州长承认法律很可能违宪，作者也预计法院可能作出不利裁定，支持它可能违反宪法。</p>\n\n<hr />\n<h2>33题</h2>\n<blockquote><p>The author mentions the study by Catalyst to illustrate ______.<br />\n作者提到卡特利斯特的研究，是为了说明______。</p>\n</blockquote>\n<p>题干直接给出the study by Catalyst，第7段出现同样的研究机构并列出2010年至2015年的数据。要判断研究说明什么，还要读上一段关于government mandates是否必要的问题，因此完整读第6、7段，连起提问、趋势判断和研究数据。</p>\n<blockquote><p>原文参考：</p>\n<p>But are such government mandates even necessary? Female <strong>[xxx]</strong> on corporate boards may not currently mirror the percentage of women in the general population, but so what?</p>\n<p>开始精读：</p>\n<p>But are such government mandates even necessary? / Female <strong>[xxx]</strong> on corporate boards may not currently mirror the percentage of women in the general population, / but so what?</p>\n<p>但是，这样的政府强制规定果真有必要吗？ / 公司董事会中的女性<strong>[xxx]</strong>目前或许没有反映女性在总人口中的比例， / 但那又怎样呢？</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n<p>开始精读：</p>\n<p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference. / According to a study by Catalyst, / between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n<p>在没有政府干预的情况下，公司董事会中的女性人数一直在<strong>[xxx]</strong>增加。 / 根据卡特利斯特的一项研究， / 在2010年至2015年间，全球<strong>[xxx]</strong>董事会中女性所占的份额增加了54%。</p>\n</blockquote>\n<p>本题要查这项研究在论述中的作用。第6段问政府强制规定是否有必要，第7段先写没有政府干预时女性董事人数的变化，再引研究给出女性占比变化的数据，要核对数据支持的是哪一种判断。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. the harm from <strong>[xxx]</strong> board decisions</h3>\n<blockquote><p>来自<strong>[xxx]</strong>董事会决策的危害</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者提到卡特利斯特的研究，是为了说明来自<strong>[xxx]</strong>董事会决策的危害。</p>\n<p>A说董事会决策造成的危害。Catalyst研究给出女性席位增长54%，我们看这个数字在统计什么。</p>\n<blockquote><p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference.</p>\n</blockquote>\n<blockquote><p>between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n</blockquote>\n<p>研究比较2010至2015年女性在董事会的份额，报告这一份额增加。它没有列举董事会作过什么决定，更没有计算那些决定的损害。</p>\n<p>A的修饰词虽被挡住，但<code>board decisions</code>和<code>harm</code>已表明它要讨论决策与危害，和人数份额增长不是同一件事。</p>\n<p>不能因为数据都涉及董事会，就把任职人数的变化挪去说明决策后果。</p>\n<p><strong>女性董事份额增长54%，统计的是任职情况，还是董事会决策造成的损害？</strong></p>\n<p>是任职情况。A换了研究所说明的事情。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. the importance of constitutional guarantees</h3>\n<blockquote><p>宪法保障的重要性</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者提到卡特利斯特的研究，是为了说明宪法保障的重要性。</p>\n<p>B说宪法保障重要。前面确实讨论宪法，但研究前已经换成<code>are such government mandates even necessary</code>，我们看这次数据回答哪句。</p>\n<blockquote><p>the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n</blockquote>\n<blockquote><p>But are such government mandates even necessary?</p>\n</blockquote>\n<blockquote><p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference.</p>\n</blockquote>\n<blockquote><p>increased by 54 percent.</p>\n</blockquote>\n<p>第5段处理可能违宪的问题，第6段接着问政府强制要求是否有必要。随后说没有政府干预，女性董事人数也在增长。</p>\n<p>Catalyst的数据正把这种增长具体化。它没有对比有宪法保障与没有保障时的结果，也没证明增长由宪法保障造成。</p>\n<p>B把前一部分的法律话题接到后面的增长研究上，漏掉了研究紧前面的必要性问题。</p>\n<p><strong>增长数据紧接“没有政府干预也在增加”，是在证明宪法保障重要吗？</strong></p>\n<p>不是。它在帮助判断是否需要政府配额干预。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. the pressure on women in global corporations</h3>\n<blockquote><p>全球企业中的女性所承受的压力</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者提到卡特利斯特的研究，是为了说明全球企业中的女性所承受的压力。</p>\n<p>C说全球企业中女性的压力。原文的女性份额增加容易让人想到更多工作，但我们要看研究实际报告了什么。</p>\n<blockquote><p>between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n</blockquote>\n<p>研究报告的是女性董事占比在五年间增加54%。它没有调查工作负担、情绪、竞争压力或任职者是否感到辛苦。</p>\n<p>人数增加可以发生在压力较大或较小的情况下，单凭占比并不能判断压力如何。</p>\n<p>C把“多少女性进入董事会”换成“女性承受多少压力”，研究数字本身不提供这项信息。</p>\n<p><strong>女性董事份额增加，就能知道这些女性承受了什么压力吗？</strong></p>\n<p>不能。人数或占比变化不等于压力测量，C没有依据。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. the needlessness of government interventions</h3>\n<blockquote><p>政府干预的不必要性</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者提到卡特利斯特的研究，是为了说明政府干预没有必要。</p>\n<p>D说政府干预没必要。先看研究前的提问，再看<code>without government interference</code>和增长数据怎样相接。</p>\n<blockquote><p>But are such government mandates even necessary?</p>\n</blockquote>\n<blockquote><p>The number of women on corporate boards has been <strong>[xxx]</strong> increasing without government interference.</p>\n</blockquote>\n<blockquote><p>between 2010 and 2015 the share of women on the boards of global <strong>[xxx]</strong> increased by 54 percent.</p>\n</blockquote>\n<p>作者先问这种强制配额是否必要，紧接着说女性董事已经在没有政府干预时增加。Catalyst用五年增长54%把这件事落实为数据。</p>\n<p>如果不用配额也有明显增长，就可以质疑是否非用政府强制才能改善女性任职比例。研究在文中正被作者用来支持这种质疑。</p>\n<p>这不是在断言任何地方、任何平等政策都没必要；题干问的是这里提研究的用途，D对应当前配额干预的必要性。</p>\n<p><strong>作者先问配额是否必要，再举没有干预仍增长的数据，是不是在说明这种强制未必需要？</strong></p>\n<p>是。D接住了提问与数据之间的直接关系。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>33题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一次判断：留下D。研究数据支持没有政府干预时女性董事占比仍会增长，用来回应这类强制规定是否必要。</p>\n\n<hr />\n<h2>34题</h2>\n<blockquote><p>Norway’s adoption of a nationwide corporate gender quota has led to ______.<br />\n挪威实施全国性的企业性别配额，已经导致______。</p>\n</blockquote>\n<p>题干明确给出Norway和nationwide corporate gender quota，第8段末句出现同样的国家与措施，并用That回指前一句的结果。第9段紧接着继续说明董事会任职机会增加后的情况，因此把第8、9段完整读完，核对配额与实际结果之间的联系。</p>\n<blockquote><p>原文参考：</p>\n<p>Requiring companies to make gender the primary qualification for board <strong>[xxx]</strong> will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n<p>开始精读：</p>\n<p>Requiring companies to make gender the primary qualification for board <strong>[xxx]</strong> / will inevitably lead to less experienced private sector boards. / That is exactly what happened / when Norway adopted a nationwide corporate gender quota.</p>\n<p>要求企业把性别作为董事会<strong>[xxx]</strong>的首要资格， / 将不可避免地导致私营部门的董事会经验更少。 / 这正是所发生的情况， / 当挪威在全国范围内实施企业性别配额时。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the <strong>[xxx]</strong> of qualified women to serve on such boards has led to a “golden <strong>[xxx]</strong>” <strong>[xxx]</strong>, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>开始精读：</p>\n<p>Writing in The New Republic, / Alice Lee notes / that increasing the number of opportunities for board membership / without increasing the <strong>[xxx]</strong> of qualified women to serve on such boards / has led to a “golden <strong>[xxx]</strong>” <strong>[xxx]</strong>, / where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>艾丽斯·李在《新共和》撰文， / 她指出， / 增加担任董事会成员的机会数量， / 却没有增加能够胜任此类董事会职务的女性的<strong>[xxx]</strong>， / 已经导致一种“金色<strong>[xxx]</strong>”<strong>[xxx]</strong>， / 在这种情况下，同一批精英女性包揽了多个不同董事会的多个席位。</p>\n</blockquote>\n<p>空格要补的是挪威实行企业性别配额后产生的结果。第8段先说把性别作为主要资格会造成什么，再说挪威正发生了这种情况；第9段补充增加任职机会与同一批女性取得多个席位之间的联系。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. the underestimation of elite women’s role</h3>\n<blockquote><p>精英女性的作用被低估</p>\n</blockquote>\n<p>把A接回题干，它说的是：挪威实施全国性的企业性别配额，已经导致精英女性的作用被低估。</p>\n<p>A说精英女性作用被低估。第8、9段既写经验不足，也写同一批女性占多个席位，我们看有没有对她们作用作低估判断。</p>\n<blockquote><p>will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<blockquote><p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n</blockquote>\n<blockquote><p>where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<p>挪威的例子先说明以性别作主要任职资格后，董事会经验减少。后面又说机会增加，却集中到相同的精英女性手里。</p>\n<p>这些话在讨论选人办法和席位分配，没有说人们给这些精英女性的能力评价低于实际。</p>\n<p>A要“被低估”，需要把实际作用与别人的评价作比较；原文没有这一比较。少数人得到很多席位也不能自动等于其作用被低估。</p>\n<p><strong>同一批精英女性获得多个席位，是否说明别人把她们的实际作用估得太低？</strong></p>\n<p>没有。原文讨论席位集中，不是对她们作用的评价失准。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. the objection to female participation on boards</h3>\n<blockquote><p>对女性参与董事会的反对</p>\n</blockquote>\n<p>把B接回题干，它说的是：挪威实施全国性的企业性别配额，已经导致人们反对女性参与董事会。</p>\n<p>B说配额导致反对女性参与董事会。原文批评把性别放在主要资格位置，我们看被批评的是女性任职本身，还是选人的条件。</p>\n<blockquote><p>make gender the primary qualification for board <strong>[xxx]</strong> will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<blockquote><p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n</blockquote>\n<blockquote><p>increasing the number of opportunities for board membership</p>\n</blockquote>\n<p>作者认为，把性别放在主要资格位置会使董事会经验不足，挪威正发生了这种结果。</p>\n<p>这句话要求注意任职经验，并没有说女性不该参与董事会。后面同一批精英占多个席位，也是在批评机会没有惠及更广泛的人。</p>\n<p>B把对配额后果的批评扩大成对女性参与的反对。原文没有报告公众因此反对女性任职，也没有把作者自己的批评写成这种全面排斥。</p>\n<p><strong>作者质疑以性别优先的选人方式，就等于反对女性参与董事会吗？</strong></p>\n<p>不等于。B把政策和资格问题扩大成了对女性任职本身的反对。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. the entry of unqualified candidates into the board</h3>\n<blockquote><p>不合格的候选人进入董事会</p>\n</blockquote>\n<p>把C接回题干，它说的是：挪威实施全国性的企业性别配额，已经导致不合格的候选人进入董事会。</p>\n<p>C说不合资格者进入董事会。第8段将<code>gender the primary qualification</code>与<code>less experienced ... boards</code>直接相连，我们看任职条件怎样被改变。</p>\n<blockquote><p>make gender the primary qualification for board <strong>[xxx]</strong> will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<blockquote><p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n</blockquote>\n<p>若性别成为首要筛选条件，原本要考虑的任职经验就可能被放到后面。作者接着明确说结果是董事会经验更不足，挪威就是这样的情况。</p>\n<p>C中的不合资格，应放在这项选人结果里理解：有人未具备职位所需的经验条件，却因满足性别配额进入。不是说所有女性都不合资格，也不是经验略少在任何情况下都等于不合格。</p>\n<p>原文把配额优先与经验下降作为因果相接，C正概括它对任职资格的影响。</p>\n<p><strong>作者将性别优先选人和董事会经验不足连起来，是否说明配额可能让任职条件不足者进入？</strong></p>\n<p>是。C按本段对配额后果的叙述能够接上，范围限于这里的选人问题。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. the growing tension between labor and management</h3>\n<blockquote><p>劳资双方之间日益加剧的紧张关系</p>\n</blockquote>\n<p>把D接回题干，它说的是：挪威实施全国性的企业性别配额，已经导致劳资双方之间日益加剧的紧张关系。</p>\n<p>D说劳资关系日益紧张。第8、9段出现的是董事会经验和精英女性席位，我们检查有没有劳动者与管理者双方的争执。</p>\n<blockquote><p>will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<blockquote><p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n</blockquote>\n<blockquote><p>where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<p>配额导致的结果在原文中是董事会经验减少，以及同一批精英取得多份席位。这里没有写普通员工与管理层谈判、对抗或关系恶化。</p>\n<p>D要判断劳资紧张增加，还需要看到这两方的互动与前后变化，不能仅因董事会属于管理层就推出劳资问题。</p>\n<p>这项结果不是原文描述的配额后果。</p>\n<p><strong>文中批评董事会经验与席位分配，有没有说明劳动者和管理层的紧张关系增加？</strong></p>\n<p>没有。D加入了未被讨论的双方关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次判断：留下C。以性别为主要资格后董事会经验变少，可以支持任职者胜任程度不足这一推断；不能把unqualified额外限定为缺少法定证书。</p>\n\n<hr />\n<h2>35题</h2>\n<blockquote><p>Which of the following can be inferred from the text?<br />\n以下哪项可以从文章中推断出来？</p>\n</blockquote>\n<p>题干没有指定人物或段落，给出的范围是from the text。前面各题已经读过第1—9段，现在把第10段完整读完，再连同前面有关配额安排、女性董事变化和实际受益者的内容核对选项；本题不预先把推断限定为某一项法案或某个国家。</p>\n<blockquote><p>原文参考：</p>\n<p>Next time somebody pushes corporate quotas as a way to promote gender <strong>[xxx]</strong>, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>开始精读：</p>\n<p>Next time somebody pushes corporate quotas as a way to promote gender <strong>[xxx]</strong>, / remember that such policies are largely self-serving measures / that make their sponsors feel good / but do little to help average women.</p>\n<p>下次有人把企业配额作为促进性别<strong>[xxx]</strong>的办法来推行时， / 请记住，这类政策在很大程度上是服务于自身利益的措施， / 让它们的发起者感觉良好， / 却几乎无法帮助普通女性。</p>\n</blockquote>\n<p>本题要找能够由文中事实推出的说法。需要看清政府配额怎样安排女性席位、没有干预时席位如何变化，以及经验和受益群体的具体情况，推断应保持原文各句对这些对象的限定。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. Women’s needs in employment should be considered.</h3>\n<blockquote><p>应当考虑女性在就业中的需求</p>\n</blockquote>\n<p>把A接回题干，它说的是：从文章可以推断，应当考虑女性在就业中的需求。</p>\n<p>A说应考虑女性就业需求。文章确实批评配额少帮普通女性，我们先看这是否能支持A这项一般建议。</p>\n<blockquote><p>In order to ensure that elite women have more such opportunities</p>\n</blockquote>\n<blockquote><p>set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<blockquote><p>such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<p>法案说要给女性更多机会，末段却强调普通女性并没有得到多少帮助。这样读，可以想到政策不该只让少数精英获益，也应顾及更普通女性的需要。</p>\n<p>所以A并非完全没有根据。但作者还用很长篇幅查法律障碍、是否必要、经验与席位后果，讨论不只停在有没有考虑女性。</p>\n<p>先把A留下，再与B比较，哪项更能接住作者一层层检验配额的做法。</p>\n<p><strong>作者批评普通女性没得到多少帮助，能否先考虑应关注她们就业需求的建议？</strong></p>\n<p>可以先考虑。A有这个宽泛落点，但仍要与全文对具体政策的检查一起看。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. Feasibility should be a prime concern in policymaking.</h3>\n<blockquote><p>可行性应是制定政策时的一项重要考量</p>\n</blockquote>\n<p>把B接回题干，它说的是：从文章可以推断，可行性应是制定政策时的一项重要考量。</p>\n<p>B说制定政策要重视可行性。我们回看作者对配额的几个具体检查，看看它有没有只停在善意目的上。</p>\n<blockquote><p>is probably unconstitutional.</p>\n</blockquote>\n<blockquote><p>will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<blockquote><p>where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<p>作者先指出措施可能违宪，说明推行有法律障碍；再说明女性席位本来就在增长，追问是否需要强制。</p>\n<p>接着用挪威和多重任职的例子，看实施后经验够不够、机会究竟落到谁手里。这些都在检验一个看似促进平等的办法实际能否达到目的。</p>\n<p>B的可行性可以具体接到这些法律条件与实际结果上。它说是一项重要考量，没有要求政策只考虑可行性而不考虑平等。</p>\n<p><strong>检验法案能否合法推行、选到合适的人、帮助预期群体，是否就是制定政策时应重视它能否行得通？</strong></p>\n<p>是。B能接上文章对措施的连续检查，先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. Everyone should try hard to promote social justice.</h3>\n<blockquote><p>每个人都应该努力促进社会正义</p>\n</blockquote>\n<p>把C接回题干，它说的是：从文章可以推断，每个人都应该努力促进社会正义。</p>\n<p>C说每个人都要努力促进社会正义。首尾都提到平等和普通人，我们看作者究竟在向谁提出什么问题。</p>\n<blockquote><p>Progressives often support diversity mandates as a path to equality and a way to level the playing field.</p>\n</blockquote>\n<blockquote><p>benefits only the most privileged and does little to help average people.</p>\n</blockquote>\n<blockquote><p>such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<p>开头介绍进步人士以平等为理由支持配额，结尾则提醒下次听到这种主张，要想一想它到底帮助了谁。</p>\n<p>作者持续检查的是一种政策办法，并没有给每个人布置同一项促进正义的行动。</p>\n<p>C可以是一句一般号召，但它不包含作者这篇的具体提醒：善意目的不能替代对实际效果的检查。不能只因原文说平等，就把任何正义口号都当成文章推断。</p>\n<p><strong>作者在检验配额有没有实际帮助，是否已经转成要求每个人都努力促进社会正义的号召？</strong></p>\n<p>没有。C换成了全文未提出的一般行动要求。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. Major social issues should be the focus of legislation.</h3>\n<blockquote><p>重大社会问题应成为立法的重点</p>\n</blockquote>\n<p>把D接回题干，它说的是：从文章可以推断，重大社会问题应成为立法的重点。</p>\n<p>D说重大社会问题应成为立法重点。第5段有<code>important policy interest</code>，我们看它是在排列立法重点，还是限制一种特殊做法。</p>\n<blockquote><p>unless they are designed to address an “important” policy interest.</p>\n</blockquote>\n<blockquote><p>Because the California law applies to all boards, even where there is no history of prior discrimination</p>\n</blockquote>\n<blockquote><p>courts are likely to rule that the law violates the constitutional <strong>[xxx]</strong> of “equal protection.”</p>\n</blockquote>\n<p>原句说法院不赞同按性别作区分，除非是为了处理重要政策利益。这是某类性别分类可能获得认可的条件。</p>\n<p>D把它改成所有立法应重点关注重大社会问题，范围从一种分类的允许条件扩大到整个立法议程。</p>\n<p>原文没有比较哪些问题该优先立法，也没有要求把其他问题排到后面。不能只凭<code>important</code>就引出立法重点排序。</p>\n<p><strong>重要政策利益作为性别分类的例外条件，等于全文要求重大社会问题成为立法重点吗？</strong></p>\n<p>不等于。D把具体例外条件扩大成了没有讨论的立法排序。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>35题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一次判断：留下A、B。作者对很少帮助普通女性的批评，可以支持应考虑实际就业需求；对法律障碍和执行结果的检查，也支持制定政策应重视可行性。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>a path to equality；benefits only the most privileged</td><td>从“a path to equality”写进步派支持多样性规定的理由，随即用“benefits only the most privileged”与“average people”对照，提出这类政策常使特权者受益、很少帮助普通人的批评。</td><td>提出强制多样性政策可能只惠及少数精英的质疑。</td></tr><tr><td>第2段</td><td>provide a case in point；A pair of bills</td><td>以“provide a case in point”引入刘易斯和哈达德提出的两项法案，把第1段的一般批评落实到具体提案；法案目标中的“gender <strong>[xxx]</strong>”仍只能读到性别这一部分。</td><td>以具体法案承接开头的判断。</td></tr><tr><td>第3段</td><td>proposed imposing government quotas；elite women</td><td>用“proposed imposing government quotas”说明两位提案人的办法：他们担心州政府董事会女性占比不足，提出到2022年为女性预留50%的席位；“elite women”点明作者关注的实际机会获得者，承接前段的案例。</td><td>展开法案要求，指出其直接惠及的对象。</td></tr><tr><td>第4段</td><td>a measure recently adopted；probably unconstitutional</td><td>以“a measure recently adopted in California”引入相似做法，并用“is probably unconstitutional”交代州长承认的法律疑虑，从法案内容转向能否合宪的问题。</td><td>用加州同类规定作参照，把讨论推进到合法性。</td></tr><tr><td>第5段</td><td>applies to all boards；no history of prior discrimination</td><td>用“applies to all boards”和“no history of prior discrimination”说明适用范围的问题，继而以“courts are likely to rule”写作者预计的裁定，解释前段为什么会有违宪疑虑。</td><td>解释前段的法律判断，说明普遍配额与既往歧视证据的关系。</td></tr><tr><td>第6段</td><td>are such government mandates even necessary；but so what</td><td>以“are such government mandates even necessary”转问政府强制规定是否必要，并以“but so what”质疑必须与总人口女性比例相符的想法，把讨论从合宪性推进到必要性。</td><td>从是否合法转向是否必要，质疑人数差异本身足以支持强制要求。</td></tr><tr><td>第7段</td><td>without government interference；increased by 54 percent</td><td>用“without government interference”说明没有政府干预时女性董事人数也在增加，再以“increased by 54 percent”提供2010年至2015年的女性董事占比增长数据，承接并回应前段的必要性疑问。</td><td>以已经发生的变化回应必要性问题。</td></tr><tr><td>第8段</td><td>less experienced private sector boards；That is exactly what happened</td><td>指出把性别作为主要资格会带来“less experienced private sector boards”，并以“That is exactly what happened”引出挪威的经历，继续检查配额在实际运行中的后果。</td><td>进一步讨论强制要求的可能后果，并以挪威经验支撑。</td></tr><tr><td>第9段</td><td>the same elite women；multiple seats</td><td>以“the same elite women”和“multiple seats”说明席位机会增加后，同一批精英女性在多个董事会取得席位；它具体展开前段的实施后果，也呼应开头对受益群体的关注。</td><td>继续展开挪威经验，说明席位可能集中在同一批精英手中。</td></tr><tr><td>第10段</td><td>self-serving measures；do little to help average women</td><td>用“self-serving measures”收束评价：这类措施使发起者感觉良好，却“do little to help average women”，回到首段对普通人所得有限的批评。</td><td>回到受益范围，收束对这些政策难以帮助普通女性的批评。</td></tr></tbody></table>\n<p>全文批评以多样性或性别目标为理由推动配额时，忽略了法律能否成立、政府强制是否必要以及实施后经验和受益分配的问题。作者认为这些措施往往集中惠及精英并使发起者自我满足，给普通女性带来的实际帮助很少。</p>\n\n<hr />\n<h2>回查35题：A还是B？</h2>\n<p>A. Women’s needs in employment should be considered.</p>\n<p>B. Feasibility should be a prime concern in policymaking.</p>\n<p>A说考虑女性就业需求，B说政策制定要重视可行性。作者批评普通女性没有得到帮助，A能从这里得到一般意义上的支持，但我们还要把中间的具体检查接起来。</p>\n<p>第4、5段先看法律上能否成立：</p>\n<blockquote><p>is probably unconstitutional</p>\n<p>even where there is no history of prior discrimination</p>\n</blockquote>\n<p>配额一律适用，可能遇到宪法障碍。第6、7段又看是否非干预不可：</p>\n<blockquote><p>are such government mandates even necessary?</p>\n<p>increasing without government interference</p>\n</blockquote>\n<p>女性董事已在增加，强制措施是否必要还需要说明。随后第8、9段检查实行后的结果：</p>\n<blockquote><p>less experienced private sector boards</p>\n<p>the same elite women scoop up multiple seats on a variety of boards</p>\n</blockquote>\n<p>任职经验不足，新增机会又集中到同一批精英手中。最后才回到普通女性并没有得到多少帮助。</p>\n<p>这套政策当然已经“考虑了女性需要机会”，提出者的目的就是提高女性席位。但仅有这个目的，仍回答不了是否合法、是否必要、选到的人是否适合、机会有没有真正扩散。</p>\n<p><strong>作者逐项检查这些条件和结果，是只要求想到女性需要工作机会，还是要求提出的政策确实能按目标行得通？</strong></p>\n<p>是后者。A的建议可以成立，但B更完整地接上全文如何审视这一办法。可行性是一项重要考量，并不是唯一考量。</p>\n<blockquote><p><strong>35题选B。</strong></p>\n</blockquote>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>31. A</strong></p>\n<p><strong>32. C</strong></p>\n<p><strong>33. D</strong></p>\n<p><strong>34. C</strong></p>\n<p><strong>35. B</strong></p>\n","analysisStartIndex":49,"maskInventory":{"token":"[xxx]","count":16},"questionFlowPlan":[{"qid":"31","initialParagraphPids":[1,2,3],"paragraphPids":[1,2,3],"entry":50,"options":{"A":51,"B":52,"C":53,"D":54},"initialReadingMode":"full_paragraph"},{"qid":"32","initialParagraphPids":[4,5],"paragraphPids":[4,5],"entry function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const img=wrap.querySelector('img'),baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h),rw=img.getBoundingClientRect();if(!rw.width||!rw.height)return;const sx=rw.width/baseW,sy=rw.height/baseH;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=a[0]*sx+'px';d.style.top=a[1]*sy+'px';d.style.width=a[2]*sx+'px';d.style.height=a[3]*sy+'px';wrap.appendChild(d)})}
