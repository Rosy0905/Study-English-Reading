<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| scientific publishing | 科学出版 | licence | n.许可 | monetary reward | 金钱报酬 |\n| specialised | adj.专业的 | peer review | 同行评审 | acquisition | n.获得 |\n| status | n.地位 | knowledge | n.知识 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,141,900,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>scientific publishing</td>\n<td>科学出版</td>\n<td>licence</td>\n<td>n.许可</td>\n<td>monetary reward</td>\n<td>金钱报酬</td>\n</tr>\n<tr>\n<td>specialised</td>\n<td>adj.专业的</td>\n<td>peer review</td>\n<td>同行评审</td>\n<td>acquisition</td>\n<td>n.获得</td>\n</tr>\n<tr>\n<td>status</td>\n<td>n.地位</td>\n<td>knowledge</td>\n<td>n.知识</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| secured | adj.已获得的 | publisher | n.出版商 | market | n.市场 |\n| university libraries | 大学图书馆 | price sensitive | 对价格敏感的 | profit margins | 利润率 |\n| operations | n.经营 | existential crisis | 生存危机 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,632,900,345],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>secured</td>\n<td>adj.已获得的</td>\n<td>publisher</td>\n<td>n.出版商</td>\n<td>market</td>\n<td>n.市场</td>\n</tr>\n<tr>\n<td>universit c research / is now published / under open access terms: / either freely available / from the moment of publication, / or paywalled / for a year or more / so that the publishers can make a profit / before being placed on general release.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>在英国 / 向开放获取出版的转变 / 已经被推动 / 由资助机构。</p>\n<p>在某些方面 / 它已经非常成功。</p>\n<p>超过一半 / 所有英国科学研究的 / 现在被发表 / 在开放获取条款下：/ 要么免费可用 / 从发表的那一刻起，/ 或设置付费墙 / 一年或更长时间 / 以便出版商可以获利 / 在被放到一般发布之前。</p>\n</section>"},{"title":"第5段","raw":"### 标准译文 · 第5段\n\n在英国，向开放获取出版的转变已经被资助机构推动。在某些方面，它已经非常成功。超过一半的英国科学研究现在在开放获取条款下发表：要么从发表的那一刻起就免费可用，要么设置付费墙一年或更长时间，以便出版商可以在作品被放到一般发布之前获利。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,2490,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true},"focusId":"focus-paragraph-5-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3>\n<p>In Britain / the move towards open access publishing / has been driven / by funding bodies.</p>\n<p>In some ways / it has been very successful.</p>\n<p>More than half / of all British scientific research / is now published / under open access terms: / either freely available / from the moment of publication, / or paywalled / for a year or more / so that the publishers can make a profit / before being placed on general release.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3>\n<p>在英国 / 向开放获取出版的转变 / 已经被推动 / 由资助机构。</p>\n<p>在某些方面 / 它已经非常成功。</p>\n<p>超过一半 / 所有英国科学研究的 / 现在被发表 / 在开放获取条款下：/ 要么免费可用 / 从发表的那一刻起，/ 或设置付费墙 / 一年或更长时间 / 以便出版商可以获利 / 在被放到一般发布之前。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段</h3>\n<p>在英国，向开放获取出版的转变已经被资助机构推动。在某些方面，它已经非常成功。超过一半的英国科学研究现在在开放获取条款下发表：要么从发表的那一刻起就免费可用，要么设置付费墙一年或更长时间，以便出版商可以在作品被放到一般发布之前获利。</p>\n</section>"},{"title":"第6段","raw":"### 完整原文 · 第6段\n\nYet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[95,3204,900,607],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from aroun erms)：(either freely available：(from the moment of publication) // or paywalled：(for a year or more)：(so that the publishers can make a profit：(before being placed on general release))).</p>\n<p><strong>第6段</strong></p>\n<p>Yet the new system → has not yet worked out → any cheaper：(for the universities).</p>\n<p>Publishers have responded：(to the demand：(that they make their product free to readers)) → by charging their writers fees：(to cover the costs：(of preparing an article)).</p>\n<p>These range：(from around £500 to $5,000) + apparently the work gets more expensive：(the more that publishers do it).</p>\n<p>A report last year → pointed out：(that the costs：(both of subscriptions + of these &quot;article preparation costs&quot;) → had been steadily rising：(at a rate above inflation)).</p>\n<p>In some ways → the scientific publishing model → resembles the economy：(of the social internet)：(labour is provided free：(in exchange for the hope of status)) // while huge profits are made：(by a few big firms：(who run the market places)).</p>\n<p>In both cases → we need → a rebalancing of power.</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n科学出版 → 长期以来一直是 → 印钞许可证。\n\n科学家需要期刊：(来发表他们的研究) → 所以他们会提供文章：(没有金钱报酬)。\n\n其他科学家执行 → 同行评审的专门工作 → 也是免费的 → 因为它是核心要素：(在获得地位 + 科学知识生产中)。\n\n**第2段**\n\n有了论文内容：(免费获得) → 出版商只需要 → 找到市场：(为其期刊)。\n\n直到本世纪 → 大学图书馆 → 对价格不太敏感。\n\n科学出版商 → 常规地报告 → 接近40%的利润率：(在他们的运营上) → 在这样一个时期：(其他出版业 → 正处于生存危机中)。\n\n**第3段**\n\n荷兰巨头爱思唯尔：(声称出版 → 25%的科学论文：(世界上生产的)) → 获得利润：(超过9亿英镑去年) // 而仅英国大学 → 在2016年花费超过2.1亿英镑：(使研究人员能够 → 访问他们自己的公共资助研究)；→ 两个数字似乎势不可挡地上升：(尽管越来越绝望的努力：(来改变它们))。\n\n**第4段**\n\n最激烈的 + 彻底非法的 → 反应是 → Sci-Hub的出现：(一种全球复印机：(针对科学论文的))：(建立于2012年)：(现在声称提供访问：(每一篇付费墙文章：(自2015年以来发表的)))。\n\nSci-Hub的成功：(依赖于研究人员 → 传递副本：(他们自己合法访问的)) → 表明：(法律生态系统 → 已经失去合法性：(在其用户中)) + 必须被改造：(以便它能够运作：(为所有参与者))。\n\n**第5段**\n\n在英国 → 向开放获取出版的转变 → 已经被推动：(由资助机构)。\n\n在某些方面 → 它已经非常成功。\n\n超过一半：(所有英国科学研究的) → 现在被发表：(在开放获取条款下)：(要么免费可用：(从发表的那一刻起) // 或设置付费墙：(一年或更长时间)：(以便出版商可以获利：(在被放到一般发布之前)))。\n\n**第6段**\n\n然而新系统 → 还没有产生 → 任何更便宜的结果：(对大学来说)。\n\n出版商已经回应：(这个要求：(让他们的产品对读者免费)) → 通过向作者收费：(来覆盖成本：(准备一篇文章的))。\n\n这些费用范围：(从大约500英镑到5000美元) + 显然工作变得更昂贵：(出版商做得越多)。\n\n去年的一份报告 → 指出：(成本：(订阅的 + 这些\"文章准备成本\"的) → 一直在稳步上升：(以高于通货膨胀的速度))。\n\n在某些方面 → 科学出版模式 → 类似于经济：(社交互联网的)：(劳动力被免费提供：(以换取地位的希望)) // 而巨额利润被赚取：(由少数大公司：(运营市场的))。\n\n在两种情况下 → 我们需要 → 权力的再平衡。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>科学出版 → 长期以来一直是 → 印钞许可证。</p>\n<p>科学家需要期刊：(来发表他们的研究) → 所以他们会提供文章：(没有金钱报酬)。</p>\n<p>其他科学家执行 → 同行评审的专门工作 → 也是免费的 → 因为它是核心要素：(在获得地位 + 科学知识生产中)。</p>\n<p><strong>第2段</strong></p>\n<p>有了论文内容：(免费获得) → 出版商只需要 → 找到市场：(为其期刊)。</p>\n<p>直到本世纪 → 大学图书馆 → 对价格不太敏感。</p>\n<p>科学出版商 → 常规地报告 → 接近40%的利润率：(在他们的运营上) → 在这样一个时期：(其他出版业 → 正处于生存危机中)。</p>\n<p><strong>第3段</strong></p>\n<p>荷兰巨头爱思唯尔：(声称出版 → 25%的科学论文：(世界上生产的)) → 获得利润：(超过9亿英镑去年) // 而仅英国大学 → 在2016年花费超过2.1亿英镑：(使研究人员能够 → 访问他们自己的公共资助研究)；→ 两个数字似乎势不可挡地上升：(尽管越来越绝望的努力：(来改变它们))。</p>\n<p><strong>第4段</strong></p>\n<p>最激烈的 + 彻底非法的 → 反应是 → Sci-Hub的出现：(一种全球复印机：(针对科学论文的))：(建立于2012年)：(现在声称提供访问：(每一篇付费墙文章：(自2015年以来发表的)))。</p>\n<p>Sci-Hub的成功：(依赖于研究人员 → 传递副本：(他们自己合法访问的)) → 表明：(法律生态系统 → 已经失去合法性：(在其用户中)) + 必须被改造：(以便它能够运作：(为所有参与者))。</p>\n<p><strong>第5段</strong></p>\n<p>在英国 → 向开放获取出版的转变 → 已经被推动：(由资助机构)。</p>\n<p>在某些方面 → 它已经非常成功。</p>\n<p>超过一半：(所有英国科学研究的) → 现在被发表：(在开放获取条款下)：(要么免费可用：(从发表的那一刻起) // 或设置付费墙：(一年或更长时间)：(以便出版商可以获利：(在被放到一般发布之前)))。</p>\n<p><strong>第6段</strong></p>\n<p>然而新系统 → 还没有产生 → 任何更便宜的结果：(对大学来说)。</p>\n<p>出版商已经回应：(这个要求：(让他们的产品对读者免费)) → 通过向作者收费：(来覆盖成本：(准备一篇文章的))。</p>\n<p>这些费用范围：(从大约500英镑到5000美元) + 显然工作变得更昂贵：(出版商做得越多)。</p>\n<p>去年的一份报告 → 指出：(成本：(订阅的 + 这些&quot;文章准备成本&quot;的) → 一直在稳步上升：(以高于通货膨胀的速度))。</p>\n<p>在某些方面 → 科学出版模式 → 类似于经济：(社交互联网的)：(劳动力被免费提供：(以换取地位的希望)) // 而巨额利润被赚取：(由少数大公司：(运营市场的))。</p>\n<p>在两种情况下 → 我们需要 → 权力的再平衡。</p>\n"},{"title":"长难句翻译练习（英一必修，英二选修）","raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群 临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> Scientific publishing is seen as “a licence to print money” partly because ______.\n>\n> 科学出版被视为“印钞许可证”，部分原因是______。\n\n### 题型\n\n原因细节题：从印钞比喻后的免费供稿与评审，核对高利润的具体条件。\n\n题干的“a licence to print money”直接出现在第1段首句。先从头读完第1段，看看这句话后面怎样解释科学家供稿和同行评审。\n\n### 核心出处\n\n> Scientists need journals in which to publish their research, so they will supply the articles without monetary reward\n>\n> Other scientists perform the specialised work of peer review also for free\n>\n> Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"26","questionIntro":true},"html":"<blockquote>\n<p>Scientific publishing is seen as “a licence to print money” partly because ______.</p>\n<p>科学出版被视为“印钞许可证”，部分原因是______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>原因细节题：从印钞比喻后的免费供稿与评审，核对高利润的具体条件。</p>\n<p>题干的“a licence to print money”直接出现在第1段首句。先从头读完第1段，看看这句话后面怎样解释科学家供稿和同行评审。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Scientists need journals in which to publish their research, so they will supply the articles without monetary reward</p>\n<p>Other scientists perform the specialised work of peer review also for free</p>\n<p>Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n"},{"title":"A. its funding has enjoyed a steady increase","raw":"### A. its funding has enjoyed a steady increase\n\n> 科学出版容易获利，部分原因是其资助稳步增加。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n科学家为发表和学术地位免费供稿、评审，解释的是内容劳动为何无需付费。A把这一盈利条件换成资助金额持续增加。\n\n**出处：**\n\n> Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\n> With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其资助稳步增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>科学家为发表和学术地位免费供稿、评审，解释的是内容劳动为何无需付费。A把这一盈利条件换成资助金额持续增加。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section>"},{"title":"A. its funding has enjoyed a steady increase","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 科学出版容易获利，部分原因是其资助稳步增加。\n\n`A`的`funding`和`steady increase`要求找出版业收入资金持续增加的原因；第1段解释这张“`licence to print money`”时，具体写的是科学家供稿以及同行评审`also for free`，因此回看第1段后两句。\n\n原文把科学家需要发表研究与提供文章相连，又明确说同行评审`also for free`，即免费进行。这里列出的赚钱条件是有人提供文章和免费评审劳动。`A`却把这段原因改写成出版业的`funding`出现`steady increase`，把投入的劳动换成了不断增加的资助金额；原句并未建立资助金额的变化关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其资助稳步增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>科学家为发表和学术地位免费供稿、评审，解释的是内容劳动为何无需付费。A把这一盈利条件换成资助金额持续增加。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版容易获利，部分原因是其资助稳步增加。</p>\n</blockquote>\n<p><code>A</code>的<code>funding</code>和<code>steady increase</code>要求找出版业收入资金持续增加的原因；第1段解释这张“<code>licence to print money</code>”时，具体写的是科学家供稿以及同行评审<code>also for free</code>，因此回看第1段后两句。</p>\n<p>原文把科学家需要发表研究与提供文章相连，又明确说同行评审<code>also for free</code>，即免费进行。这里列出的赚钱条件是有人提供文章和免费评审劳动。<code>A</code>却把这段原因改写成出版业的<code>funding</code>出现<code>steady increase</code>，把投入的劳动换成了不断增加的资助金额；原句并未建立资助金额的变化关系。</p>\n</section>"},{"title":"A. its funding has enjoyed a steady increase","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\n> With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.\n>\n> 科学出版长期以来就像一张印钞许可证。科学家需要期刊发表研究，因此会无偿提供文章。其他科学家也免费进行专业同行评审，因为这是获得地位和生产科学知识的核心环节。\n>\n> 免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。\n\n首段从研究者需要发表推出免费供稿，再补充免费同行评审；第二段承接免费内容，说明出版商只需寻找市场。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Scientific publishing is profitable partly because its funding has enjoyed a steady increase.\n>\n> 科学出版容易获利，部分原因是其资助稳步增加。\n\nA需要资助者向出版业投入的金额及其增长。论文由公共资金支持，也不等于出版商收到的资助持续增加；不能把研究资助移作出版利润的原因。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其资助稳步增加。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>科学家为发表和学术地位免费供稿、评审，解释的是内容劳动为何无需付费。A把这一盈利条件换成资助金额持续增加。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版容易获利，部分原因是其资助稳步增加。</p>\n</blockquote>\n<p><code>A</code>的<code>funding</code>和<code>steady increase</code>要求找出版业收入资金持续增加的原因；第1段解释这张“<code>licence to print money</code>”时，具体写的是科学家供稿以及同行评审<code>also for free</code>，因此回看第1段后两句。</p>\n<p>原文把科学家需要发表研究与提供文章相连，又明确说同行评审<code>also for free</code>，即免费进行。这里列出的赚钱条件是有人提供文章和免费评审劳动。<code>A</code>却把这段原因改写成出版业的<code>funding</code>出现<code>steady increase</code>，把投入的劳动换成了不断增加的资助金额；原句并未建立资助金额的变化关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n<p>科学出版长期以来就像一张印钞许可证。科学家需要期刊发表研究，因此会无偿提供文章。其他科学家也免费进行专业同行评审，因为这是获得地位和生产科学知识的核心环节。</p>\n<p>免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。</p>\n</blockquote>\n<p>首段从研究者需要发表推出免费供稿，再补充免费同行评审；第二段承接免费内容，说明出版商只需寻找市场。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientific publishing is profitable partly because its funding has enjoyed a steady increase.</p>\n<p>科学出版容易获利，部分原因是其资助稳步增加。</p>\n</blockquote>\n<p>A需要资助者向出版业投入的金额及其增长。论文由公共资金支持，也不等于出版商收到的资助持续增加；不能把研究资助移作出版利润的原因。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. its marketing strategy has been successful","raw":"### B. its marketing strategy has been successful\n\n> 科学出版容易获利，部分原因是其营销策略成功。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n寻找市场是出版商的任务，图书馆不敏感是买方特点，两者都没有说明某套营销策略取得成功。\n\n**出处：**\n\n> Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\n> With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其营销策略成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>寻找市场是出版商的任务，图书馆不敏感是买方特点，两者都没有说明某套营销策略取得成功。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section>"},{"title":"B. its marketing strategy has been successful","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 科学出版容易获利，部分原因是其营销策略成功。\n\n`marketing strategy`涉及怎样把期刊卖出去，第2段的`find a market`正接着谈期刊市场，先读完第2段，再核对它怎样解释销售条件。\n\n原文说论文内容已经免费取得，出版商剩下的任务是`find a market`；随后说大学图书馆曾对价格不很敏感，讲的是买方的价格反应。`B`的`marketing strategy has been successful`则把赚钱归于出版商制定的营销策略取得成功。找到销售对象这一任务和买方不敏感的特点，不能合并成某套营销策略的成功。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其营销策略成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>寻找市场是出版商的任务，图书馆不敏感是买方特点，两者都没有说明某套营销策略取得成功。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been .\n>\n> 科学出版长期以来就像一张印钞许可证。科学家需要期刊发表研究，因此会无偿提供文章。其他科学家也免费进行专业同行评审，因为这是获得地位和生产科学知识的核心环节。\n>\n> 免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。\n\n作者先确定内容免费，再写大学图书馆过去对价格不很敏感，以此解释高利润所依赖的市场条件。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Scientific publishing is profitable partly because its marketing strategy has been successful.\n>\n> 科学出版容易获利，部分原因是其营销策略成功。\n\nB需要策略怎样吸引购买并奏效的过程。现有文字写的是无需支付内容劳动报酬和买方不敏感，不能用营销成功替代这两项条件。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-B-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其营销策略成功。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>寻找市场是出版商的任务，图书馆不敏感是买方特点，两者都没有说明某套营销策略取得成功。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版容易获利，部分原因是其营销策略成功。</p>\n</b he rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section>"},{"title":"C. its payment for peer review is reduced","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 科学出版容易获利，部分原因是其同行评审费用减少。\n\n`peer review`直接指向第1段最后一句，`payment is reduced`要求核对评审费用的变化，而原句写的是`also for free`。\n\n原文明确说同行评审`also for free`，说明科学家免费做这项工作。`C`说`payment for peer review is reduced`，说明支付的评审费用发生了减少。\n\n免费是这里的服务提供方式；减少则需要比较此前与此后的支付，原句没有建立这种费用变化。\n\n不能把免费直接翻译成减少了费用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-C-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其同行评审费用减少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>for free是评审者免费提供劳动，reduced却要求费用由较高降到较低。原文没有建立前后费用的变化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版容易获利 n of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n<p>科学出版长期以来就像一张印钞许可证。科学家需要期刊发表研究，因此会无偿提供文章。其他科学家也免费进行专业同行评审，因为这是获得地位和生产科学知识的核心环节。</p>\n<p>免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。</p>\n</blockquote>\n<p>同行评审接在免费供稿之后，also让两种无报酬劳动并列，共同解释出版商如何低成本获得内容。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientific publishing is profitable partly because its payment for peer review is reduced.</p>\n<p>科学出版容易获利，部分原因是其同行评审费用减少。</p>\n</blockquote>\n<p>C需要此前付费、后来减少的比较。原文只说免费提供，不能因免费比付费便宜，就自行补出费用已经下降的历史。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. its content acquisition costs nothing","raw":"### D. its content acquisition costs nothing\n\n> 科学出版容易获利，部分原因是其内容获取无需付费。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\ncontent acquisition是内容获取，costs nothing对应secured for free；供稿和评审均免费，确实解释容易获利的条件。\n\n**出处：**\n\n> Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\n> With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26 ee, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.\n>\n> 科学出版长期以来就像一张印钞许可证。科学家需要期刊发表研究，因此会无偿提供文章。其他科学家也免费进行专业同行评审，因为这是获得地位和生产科学知识的核心环节。\n>\n> 免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。\n\n首段列出免费学术劳动，第二段以With the content of papers secured for free承接，再转到销售市场。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Scientific publishing is profitable partly because its content acquisition costs nothing.\n>\n> 科学出版容易获利，部分原因是其内容获取无需付费。\n\nD把两类免费劳动归为内容获取无需付费，没有说印刷、运营等所有出版环节都没有成本，范围与原句相合。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>科学出版容易获利，部分原因是其内容获取无需付费。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>content acquisition是内容获取，costs nothing对应secured for free；供稿和评审均免费，确实解释容易获利的条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版容易获利，部分原因是其内容获取无需付费。</p>\n</blockquote>\n<p><code>content</code>与第2段的<code>content of papers</code>指向同一批论文内容，<code>costs nothing</code>与<code>secured for free</code>都涉及取得内容时的费用，因此回看第2段首句。</p>\n<p>原文明确把论文内容<code>secured for free</code>作为出版商只需寻找市场的前提，免费取得内容确实能解释它为什么容易挣钱。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.\nWith the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n<p>科学出版长期以来就像一张印钞许可证。科学家需要期刊发表研究，因此会无偿提供文章。其他科学家也免费进行专业同行评审，因为这是获得地位和生产科学知识的核心环节。</p>\n<p>免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。</p>\n</blockquote>\n<p>首段列出免费学术劳动，第二段以With the content of papers secured for free承接，再转到销售市场。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientific publishing is profitable partly because its content acquisition costs nothing.</p>\n<p>科学出版容易获利，部分原因是其内容获取无需付费。</p>\n</blockquote>\n<p>D把两类免费劳动归为内容获取无需付费，没有说印刷、运营等所有出版环节都没有成本，范围与原句相合。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. D**\n\n- A：科学家为发表和学术地位免费供稿、评审，解释的是内容劳动为何无需付费。A把这一盈利条件换成资助金额持续增加。\n- B：寻找市场是出版商的任务，图书馆不敏感是买方特点，两者都没有说明某套营销策略取得成功。\n- C：for free是评审者免费提供劳动，reduced却要求费用由较高降到较低。原文没有建立前后费用的变化。\n- D：content acquisition是内容获取，costs nothing对应secured for free；供稿和评审均免费，确实解释容易获利的条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,156,1344,369],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"26","questionConclusion":true},"html":"<blockquote>\n<p><strong>26. D</strong></p>\n</blockquote>\n<ul>\n<li>A：科学家为发表和学术地位免费供稿、评审，解释的是内容劳动为何无需付费。A把这一盈利条件换成资助金额持续增加。</li>\n<li>B：寻找市场是出版商的任务，图书馆不敏感是买方特点，两者都没有说明某套营销策略取得成功。</li>\n<li>C：for free是评审者免费提供劳动，reduced却要求费用由较高降到较低。原文没有建立前后费用的变化。</li>\n<li>D：content acquisition是内容获取，costs nothing对应secured for free；供稿和评审均免费，确实解释容易获利的条件。</li>\n</ul>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> According to Paragraphs 2 and 3, scientific publishers like Elsevier have ______.\n>\n> 根据第2、3段，像爱思唯尔这样的科学出版商已经______。\n\n### 题型\n\n段落推断题：将图书馆市场、出版商利润和大学支出连起来，归纳经营依托。\n\n题干明确指定Paragraphs 2 and 3，直接回到第2、3段。第2段已经完整读过，再把第3段从荷兰出版商的介绍一直读到两项数字的变化。\n\n### 核心出处\n\n> Until this century, university libraries were not very price sensitive.\n>\n> Scientific publishers routinely report profit margins approaching 40% on their operations\n>\n> made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"27","questionIntro":true},"html":"<blockquote>\n<p>According to Paragraphs 2 and 3, scientific publishers like Elsevier have ______.</p>\n<p>根据第2、3段，像爱思唯尔这样的科学出版商已经______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：将图书馆市场、出版商利润和大学支出连起来，归纳经营依托。</p>\n<p>题干明确指定Paragraphs 2 and 3，直接回到第2、3段。第2段已经完整读过，再把第3段从荷兰出版商的介绍一直读到两项数字的变化。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Until this century, university libraries were not very price sensitive.</p>\n<p>Scientific publishers routinely report profit margins approaching 40% on their operations</p>\n<p>made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research</p>\n</blockquote>\n"},{"title":"A. thrived mainly on university libraries","raw":"### A. thrived mainly on university libraries\n\n> 像Elsevier这样的科学出版商已经主要依靠大学图书馆而兴旺发展。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n大学图书馆对价格不敏感，大学为读取自己受公共资助的研究仍支付高额费用；这正是两段着重呈现的出版商盈利依托。\n\n**出处：**\n\n> With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.\n> The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>像Elsevier这样的科学出版商已经主要依靠大学图书馆而兴旺发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>大学图书馆对价格不敏感，大学为读取自己受公共资助的研究仍支付高额费用；这正是两段着重呈现的出版商盈利依托。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.\nThe Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.</p>\n</blockquote>\n</section>"},{"title":"A. thrived mainly on university libraries","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 像Elsevier这样的科学出版商已经主要依靠大学图书馆而兴旺发展。\n\n大学图书馆对价格不敏感，大学为读取自己受公共资助的研究仍支付高额费用；这正是两段着重呈现的出版商盈利依托。\n\n第二段把图书馆的价格反应接在寻找市场之后，第三段并列Elsevier利润与英国大学账单，具体展开买卖双方的关系。\n\nmainly在此归纳这两段强调的主要经营支撑，并非要求从两笔不同口径金额计算收入占比。原文没有说出版商只服务大学，A也没有only。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>像Elsevier这样的科学出版商已经主要依靠大学图书馆而兴旺发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>大学图书馆对价格不敏感，大学为读取自己受公共资助的研究仍支付高额费用；这正是两段着重呈现的出版商盈利依托。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>With the content of papers secured for free, the publisher needs only find a market for its journal. Until this ode>D</code>的<code>financed researchers generously</code>则说科学出版商出钱资助研究者。原句中的花钱者是大学，资助研究的资金被明确写为公共资金，取得论文的支出也不能换成出版商向研究者发放资助。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.\nThe Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.</p>\n<p>免费取得论文内容后，出版商只需为期刊寻找市场。直到本世纪，大学图书馆对价格都不很敏感。科学出版商常报告接近40%的业务利润率，与此同时，出版业其余部分却面临生存危机。</p>\n<p>荷兰巨头Elsevier称其发表了全球25%的科学论文，去年获利超过9亿英镑；仅英国大学2016年就花费超过2.1亿英镑，让研究者读取他们自己由公共资金支持的研究。尽管人们越来越急切地尝试改变，两项数字似乎仍不可阻挡地上升。</p>\n</blockquote>\n<p>第三段先列出版商利润，再用while引出大学的支出，大学付钱是让研究者读取自己的研究。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Publishers like Elsevier have financed researchers generously.</p>\n<p>像Elsevier这样的科学出版商已经慷慨资助研究者。</p>\n</blockquote>\n<p>D需要出版商向研究者提供资金；实际资金由大学付向获取渠道。publicly funded说明研究经费来源，也不能被归到出版商名下。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. A**\n\n- A：大学图书馆对价格不敏感，大学为读取自己受公共资助的研究仍支付高额费用；这正是两段着重呈现的出版商盈利依托。\n- B：处于生存危机的是the rest of the publishing industry，科学出版商则仍报告接近40%的利润率。B把对照另一方的处境移给它们。\n- C：高利润与其他出版业危机同时存在，原文没有说科学出版商促使整个行业复苏。C将对照改成了带动复苏的因果。\n- D：大学支付获取论文的费用，研究本身由公共资金支持。D反过来说出版商慷慨资助研究者，改了付款方和资金用途。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"27","questionConclusion":true},"html":"<blockquote>\n<p><strong>27. A</strong></p>\n</blockquote>\n<ul>\n<li>A：大学图书馆对价格不敏感，大学为读取自己受公共资助的研究仍支付高额费用；这正是两段着重呈现的出版商盈利依托。</li>\n<li>B：处于生存危机的是the rest of the publishing industry，科学出版商则仍报告接近40%的利润率。B把对照另一方的处境移给它们。</li>\n<li>C：高利润与其他出版业危机同时存在，原文没有说科学出版商促使整个行业复苏。C将对照改成了带动复苏的因果。</li>\n<li>D：大学支付获取论文的费用，研究本身由公共资金支持。D反过来说出版商慷慨资助研究者，改了付款方和资金用途。</li>\n</ul>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> How does the author feel about the success of Sci-Hub?\n>\n> 作者如何看待Sci-Hub的成功？\n\n### 题型\n\n作者态度题：区分Sci-Hub取得成功的事实与作者据此作出的评价，重点看shows之后的问题和改革要求。\n\n题干点名Sci-Hub及其success，第4段同时出现这个名称和The success of Sci-Hub。先完整精读第4段，区分对这一做法的描述与作者从它的成功得到的判断。\n\n### 核心出处\n\n> shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n>\n> The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users\n>\n> The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"28","questionIntro":true},"html":"<blockquote>\n<p>How does the author feel about the success of Sci-Hub?</p>\n<p>作者如何看待Sci-Hub的成功？</p>\n</blockquote>\n<h3>题型</h3>\n<p>作者态度题：区分Sci-Hub取得成功的事实与作者据此作出的评价，重点看shows之后的问题和改革要求。</p>\n<p>题干点名Sci-Hub及其success，第4段同时出现这个名称和The success of Sci-Hub。先完整精读第4段，区分对这一做法的描述与作者从它的成功得到的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n<p>The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users</p>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub</p>\n</blockquote>\n"},{"title":"A. Relieved.","raw":"### A. Relieved.\n\n> 作者对Sci-Hub的成功感到宽慰。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n作者从Sci-Hub成功看到合法体系失去用户认可，并要求改造，问题仍待解决，未写成让他松一口气的结果。\n\n**出处：**\n\n> The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>作者对Sci-Hub的成功感到宽慰。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者从Sci-Hub成功看到合法体系失去用户认可，并要求改造，问题仍待解决，未写成让他松一口气的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section>"},{"title":"A. Relieved.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者对Sci-Hub的成功感到宽慰。\n\n`Relieved`要求看作者是否把这次成功当作令人松一口气的结果；第4段末句用`shows`接出他的判断，并以`must be transformed`结束，因此回看这句。\n\n原文从`Sci-Hub`成功读出的结果是合法体系在用户中失去了正当性，继而提出`must be transformed`，要求改造这个体系使其服务所有参与者。`A`的`Relieved`把作者态度写成问题得到缓解后的宽慰；但原句把成功作为揭示体系失去认可、还须改造的信号，并没有把它写成使作者放下担忧的结果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>作者对Sci-Hub的成功感到宽慰。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者从Sci-Hub成功看到合法体系失去用户认可，并要求改造，问题仍待解决，未写成让他松一口气的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Sci-Hub的成功感到宽慰。</p>\n</blockquote>\n<p><code>Relieved</code>要求看作者是否把这次成功当作令人松一口气的结果；第4段末句用<code>shows</code>接出他的判断，并以<code>must be transformed</code>结束，因此回看这句。</p>\n<p>原文从<code>Sci-Hub</code>成功读出的结果是合法体系在用户中失去了正当性，继而提出<code>must be transformed</code>，要求改造这个体系使其服务所有参与者。<code>A</code>的<code>Relieved</code>把作者态度写成问题得到缓解后的宽慰；但原句把成功作为揭示体系失去认可、还须改造的信号，并没有把它写成使作者放下担忧的结果。</p>\n</section>"},{"title":"A. Relieved.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n>\n> 最激烈且完全违法的回应是Sci-Hub的出现。它像科学论文的全球复印机，于2012年建立，现声称可提供2015年以来每篇付费墙内文章的获取途径。Sci-Hub依靠研究者转交自己合法取得的副本；它的成功表明，合法体系在用户中已失去正当性，必须改造以服务所有参与者。\n\ndrastic、thoroughly illegal先评价应对方式，随后成功被用作现有体系失去正当性的证据，并引出must be transformed。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The author is relieved about Sci-Hub’s success.\n>\n> 作者对Sci-Hub的成功感到宽慰。\n\nA需要作者因成功而减轻担忧的评价。实际成功暴露深层失衡，呼吁改革并不等于他已感宽慰。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>作者对Sci-Hub的成功感到宽慰。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者从Sci-Hub成功看到合法体系失去用户认可，并要求改造，问题仍待解决，未写成让他松一口气的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Sci-Hub的成功感到宽慰。</p>\n</blockquote>\n<p><code>Relieved</code>要求看作者是否把这次成功当作令人松一口气的结果；第4段末句用<code>shows</code>接出他的判断，并以<code>must be transformed</code>结束，因此回看这句。</p>\n<p>原文从<code>Sci-Hub</code>成功读出的结果是合法体系在用户中失去了正当性，继而提出<code>must be transformed</code>，要求改造这个体系使其服务所有参与者。<code>A</code>的<code>Relieved</code>把作者态度写成问题得到缓解后的宽慰；但原句把成功作为揭示体系失去认可、还须改造的信号，并没有把它写成使作者放下担忧的结果。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n<p>最激烈且完全违法的回应是Sci-Hub的出现。它像科学论文的全球复印机，于2012年建立，现声称可提供2015年以来每篇付费墙内文章的获取途径。Sci-Hub依靠研究者转交自己合法取得的副本；它的成功表明，合法体系在用户中已失去正当性，必须改造以服务所有参与者。</p>\n</blockquote>\n<p>drastic、thoroughly illegal先评价应对方式，随后成功被用作现有体系失去正当性的证据，并引出must be transformed。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is relieved about Sci-Hub’s success.</p>\n<p>作者对Sci-Hub的成功感到宽慰。</p>\n</blockquote>\n<p>A需要作者因成功而减轻担忧的评价。实际成功暴露深层失衡，呼吁改革并不等于他已感宽慰。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Puzzled.","raw":"### B. Puzzled.\n\n> 作者对Sci-Hub的成功感到困惑。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n作者说明Sci-Hub依靠研究者传递副本，又明确解释成功意味着什么。他没有把它写成自己无法理解的现象。\n\n**出处：**\n\n> The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-B-0\"><blockquote>\n<p>作者对Sci-Hub的成功感到困惑。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者说明Sci-Hub依靠研究者传递副本，又明确解释成功意味着什么。他没有把它写成自己无法理解的现象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section>"},{"title":"B. Puzzled.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者对Sci-Hub的成功感到困惑。\n\n`Puzzled`要核对作者是否不明白这种成功；第4段第二句先用`relies on`解释它依靠什么，再用`shows`说明它表明什么，回看这两层解释。\n\n原文用`relies on researchers passing on copies`解释`Sci-Hub`运作所依靠的行为，并从成功得到现有合法体系失去用户认可的明确判断。`B`的`Puzzled`则把作者写成对这个成功困惑不解。原句正在说明成功的支撑以及含义，没有把作者对成功的认识写成无法理解。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":f 。Sci-Hub依靠研究者转交自己合法取得的副本；它的成功表明，合法体系在用户中已失去正当性，必须改造以服务所有参与者。\n\nrelies on交代运作支撑，shows接出判断，末尾给出改造方向，认识和建议都明确。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The author is puzzled about Sci-Hub’s success.\n>\n> 作者对Sci-Hub的成功感到困惑。\n\nB需要疑惑成功缘由或含义的表达。原文不仅给出解释，还提出必须采取的行动，不支持困惑不解。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-B-0\"><blockquote>\n<p>作者对Sci-Hub的成功感到困惑。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者说明Sci-Hub依靠研究者传递副本，又明确解释成功意味着什么。他没有把它写成自己无法理解的现象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Sci-Hub的成功感到困惑。</p>\n</blockquote>\n<p><code>Puzzled</code>要核对作者是否不明白这种成功；第4段第二句先用<code>relies on</code>解释它依靠什么，再用<code>shows</code>说明它表明什么，回看这两层解释。</p>\n<p>原文用<code>relies on researchers passing on copies</code>解释<code>Sci-Hub</code>运作所依靠的行为，并从成功得到现有合法体系失去用户认可的明确判断。<code>B</code>的<code>Puzzled</code>则把作者写成对这个成功困惑不解。原句正在说明成功的支撑以及含义，没有把作者对成功的认识写成无法理解。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-B-2\"><h3>写
