code>和<code>status</code>在第6段同一句出现，<code>triumphs over</code>要求核对两者是胜负关系还是别的关系，回看连接它们的<code>in exchange for</code>。</p>\n<p>原文说劳动免费提供，是为了<code>in exchange for the hope of status</code>，即换取获得地位的希望。这里地位是提供劳动者希望获得的东西。<code>B</code>的<code>Labour triumphs over status</code>却把劳动与地位写成胜负双方，并声称劳动胜过地位，将交换目的换成竞争结果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n<p>然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。</p>\n</blockquote>\n<p>作者先写劳动者投入与声望期待，再用while把它与少数大企业的巨额利润相对照。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Labour triumphs over status.</p>\n<p>科学出版模式的特点是劳动战胜地位。</p>\n</blockquote>\n<p>B需要劳动胜过地位的比较。实际两者是投入与所求回报，真正被对照的是劳动提供者和利润获取者。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Costs are well controlled.</h3>\n<blockquote>\n<p>科学出版模式的特点是成本得到良好控制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>费用增速高于通胀，大学未因新制度省钱，作者把这些作为问题提出。C概括成控制良好，与这组具体事实不符。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版模式的特点是成本得到良好控制。</p>\n</blockquote>\n<p>费用增速高于通胀，大学未因新制度省钱，作者把这些作为问题提出。C概括成控制良好，与这组具体事实不符。</p>\n<p>收费变化在前半段展开，后半段将免费劳动和集中利润相接，最终要求重新平衡权力。</p>\n<p>C需要费用受到有效约束的结果。持续上涨本身未必在任何场景都等于失控，但本文还明确比较通胀并强调未更便宜，不能忽略作者的评价语境。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n<p>然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。</p>\n</blockquote>\n<p>收费变化在前半段展开，后半段将免费劳动和集中利润相接，最终要求重新平衡权力。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Costs are well controlled.</p>\n<p>科学出版模式的特点是成本得到良好控制。</p>\n</blockquote>\n<p>C需要费用受到有效约束的结果。持续上涨本身未必在任何场景都等于失控，但本文还明确比较通胀并强调未更便宜，不能忽略作者的评价语境。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. The few feed on the many.</h3>\n<blockquote>\n<p>科学出版模式的特点是少数人靠多数人的劳动获利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>大量研究者免费提供论文和评审，少数经营市场的大企业赚取巨额利润。D概括了贡献分散、收益集中的依赖关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学出版模式的特点是少数人靠多数人的劳动获利。</p>\n</blockquote>\n<p><code>The few</code>对应第6段的<code>a few big firms</code>，<code>feed on the many</code>则要求看这些公司的利润与提供劳动者是什么关系，因此回看段末对两方的对照及其后一句。</p>\n<p>原文把两方并列：劳动者免费提供劳动，只期待获得地位；<code>a few big firms</code>经营市场并赚取巨额利润，随后作者要求重新平衡权力。<code>D</code>的<code>The few feed on the many</code>把这幅分配图概括为少数获利者依靠广泛的劳动提供者获益。“靠……获利”在这里不是说劳动者直接送钱，而是说其劳动构成出版活动的投入，收益却集中到少数经营者。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n<p>然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。</p>\n</blockquote>\n<p>首段交代免费学术劳动，末段重提劳动换声望、少数企业获利，随后以重新平衡权力收束。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The few feed on the many.</p>\n<p>科学出版模式的特点是少数人靠多数人的劳动获利。</p>\n</blockquote>\n<p>feed on在这里是靠多数人的劳动获利，并非说研究者直接向企业赠钱。D保留两方的投入收益差异，能接住结尾的改革要求。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>30题结论</h3>\n<blockquote>\n<p><strong>30. D</strong></p>\n</blockquote>\n<ul>\n<li>A：论文从发表时免费或收费一段时间后开放，是公开获取安排；trial subscription则是试用订阅，原文没有这种试用关系。</li>\n<li>B：in exchange for表示提供免费劳动以求获得地位，地位是期待回报。triumphs over却把劳动与地位改成胜负双方。</li>\n<li>C：费用增速高于通胀，大学未因新制度省钱，作者把这些作为问题提出。C概括成控制良好，与这组具体事实不符。</li>\n<li>D：大量研究者免费提供论文和评审，少数经营市场的大企业赚取巨额利润。D概括了贡献分散、收益集中的依赖关系。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：科学出版业的暴利模式</strong>（段落1-2核心问题） 暴利基础：【科学家免费提供文章（需要期刊发表）+ 同行评审免费（为获得地位）】→ 出版商零成本获得内容 → 只需找到市场（大学图书馆不敏感于价格）→ 结果：40%利润率 // 其他出版业生存危机</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次2：爱思唯尔的垄断与暴利</strong>（段落3实例说明） 垄断地位：爱思唯尔出版全球25%科学论文 → 暴利现实：【年利润超9亿英镑 // 英国大学年支出超2.1亿英镑（访问自己的研究）】→ 恶性循环：两个数字都在势不可挡地上升</p>\n<p>↓（极端反应）</p>\n<p><strong>逻辑层次3：Sci-Hub的非法反抗</strong>（段落4系统崩溃） 极端反应：Sci-Hub出现（2012年，全球论文复印机）→ 声称提供所有付费墙文章（2015年后）→ 深层意义：【依赖研究人员传递合法副本 → 表明法律生态系统失去用户合法性 → 需要系统改造】</p>\n<p>↓（改革尝试）</p>\n<p><strong>逻辑层次4：开放获取的改革尝试</strong>（段落5英国实践） 英国模式：资助机构推动开放获取 → 部分成功：超过50%研究开放获取发表 → 两种形式：【立即免费 // 延迟一年（让出版商先获利）】</p>\n<p>↓（改革困境）</p>\n<p><strong>逻辑层次5：新系统的失败与权力失衡</strong>（段落6问题本质） 成本未降：大学支出没有减少 → 新的收费模式：【向作者收费（500-5000英镑/美元）+ 费用随规模上升】→ 通胀问题：订阅费和准备费都高于通胀上升 → 本质问题：【类似社交互联网（免费劳动换地位希望 // 少数大公司获巨利）→ 需要权力再平衡】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：科学出版业通过获取免费内容和垄断市场获得暴利，导致系统失去合法性（Sci-Hub出现），虽有开放获取改革，但未能解决成本问题，本质是少数大公司剥削多数科学家的权力失衡。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. High profits built on free scholarly labour</p>\n<p>B. Open access without a cheaper system</p>\n<p>C. An illegal response that exposes a loss of legitimacy</p>\n<p>D. The complete removal of every publication fee</p>\n<p>E. The financial contrast between a publisher and universities</p>\n<p>F. How funded research is being opened to readers</p>\n<p>G. A revival of the whole publishing industry</p>\n<p><strong>41.</strong></p>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without monetary reward. Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge. With the content of papers secured for free, the publisher needs only find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n<p><strong>42.</strong></p>\n<p>The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.</p>\n<p><strong>43.</strong></p>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n<p><strong>44.</strong></p>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.</p>\n<p><strong>45.</strong></p>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】A. High profits built on free scholarly labour</p>\n<blockquote>\n<p>建立在免费学术劳动之上的高利润</p>\n</blockquote>\n<p>研究者免费提供论文和评审，出版商取得内容后向图书馆出售，利润率与行业危机形成反差。</p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money.</p>\n</blockquote>\n<p>印钞许可证的比喻提出高盈利现象，后面的免费供稿与评审解释利润条件。</p>\n<blockquote>\n<p>With the content of papers secured for free, the publisher needs only find a market for its journal.</p>\n</blockquote>\n<p>With将免费内容接到出版商寻找市场的任务，买方是对价格不敏感的大学图书馆。</p>\n<blockquote>\n<p>Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n<p>接近40%的利润率与其他出版业危机形成反差，标题须同时涵盖免费投入和高额回报。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>免费供稿及评审 → 图书馆付费市场 → 科学出版高利润</p>\n</blockquote>\n<p>free scholarly labour对应两类免费劳动，high profits对应40%左右利润率。</p>\n<p>再看最强干扰项G：A revival of the whole publishing industry。</p>\n<p>危机属于其余出版行业，科学出版商赚钱不证明全行业复苏。</p>\n<p><strong>41题选A。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】E. The financial contrast between a publisher and universities</p>\n<blockquote>\n<p>出版商与大学之间的财务反差</p>\n</blockquote>\n<p>用Elsevier的论文份额与利润、英国大学付费获取公共资助研究的开支，展示两端金额同时上升。</p>\n<blockquote>\n<p>The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.</p>\n</blockquote>\n<p>Elsevier的利润和英国大学的支出由while并列，一端收入可观，另一端为自己的公共资助研究付费。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>出版商高利润 → 大学高额获取费用 → 两项金额持续增长、改变困难</p>\n</blockquote>\n<p>financial contrast保留谁盈利、谁支付，不能将大学开支误作出版商资助。</p>\n<p>再看最强干扰项D：The complete removal of every publication fee。</p>\n<p>这里费用在上涨，未取消发表或获取费用。</p>\n<p><strong>42题选E。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】C. An illegal response that exposes a loss of legitimacy</p>\n<blockquote>\n<p>暴露正当性流失的非法回应</p>\n</blockquote>\n<p>先说明Sci-Hub的违法方式与覆盖面，再由其成功判断合法体系失去用户认可。</p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015.</p>\n</blockquote>\n<p>drastic和illegal限定Sci-Hub是对现有收费体系的激烈非法回应，不能只抓全球复印机这个形象。</p>\n<blockquote>\n<p>The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n<p>第二句从研究者转交副本的参与行为，推到现有合法体系失去用户认可并必须改革。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>非法获取渠道出现 → 用户参与使其成功 → 合法体系正当性流失、需要改造</p>\n</blockquote>\n<p>illegal response对应thoroughly illegal，loss of legitimacy对应作者由成功得出的诊断。</p>\n<p>再看最强干扰项F：How funded research is being opened to readers。</p>\n<p>Sci-Hub的运作和资助机构推动的合法开放获取是两条不同路径。</p>\n<p><strong>43题选C。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. How funded research is being opened to readers</p>\n<blockquote>\n<p>资助研究如何向读者开放</p>\n</blockquote>\n<p>英国资助机构推动开放获取，研究既可即时免费，也可先收费一段时间再公开。</p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies.</p>\n</blockquote>\n<p>funding bodies指明推动开放获取的是科研资助机构，讨论转入合法改变途径。</p>\n<blockquote>\n<p>In some ways it has been very successful.</p>\n</blockquote>\n<p>very successful的成功随后由超过半数研究按开放条款发表加以说明，主要是可获取程度。</p>\n<blockquote>\n<p>More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.</p>\n</blockquote>\n<p>either...or列出立即免费与先收费后公开两种路径，不能把开放获取一律理解为出版即免费。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>资助机构推动 → 开放发表覆盖扩大 → 即时免费或延迟开放</p>\n</blockquote>\n<p>how ... opened概括两种时间安排，funded research对应funding bodies的推动。</p>\n<p>再看最强干扰项D：The complete removal of every publication fee。</p>\n<p>延迟开放允许出版商先赚钱，不能概括成所有费用取消。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Open access without a cheaper system</p>\n<blockquote>\n<p>开放获取并未带来更低成本的体系</p>\n</blockquote>\n<p>Yet转入大学仍未省钱，作者收费及订阅费持续上升，最后把免费劳动与少数企业获利相对照。</p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities.</p>\n</blockquote>\n<p>Yet接住前段的成功而转向大学成本，获取扩大并不自动带来支出下降。</p>\n<blockquote>\n<p>A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation.</p>\n</blockquote>\n<p>订阅费与文章准备费都涨得比通胀快，说明向作者收费没有解决成本问题。</p>\n<blockquote>\n<p>In both cases, we need a rebalancing of power.</p>\n</blockquote>\n<p>结尾的rebalancing把具体收费问题提升到劳动贡献者与利润获取者的权力分配，标题要覆盖未解决的体系成本。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>开放扩大但大学未省钱 → 收费转移且持续上涨 → 需要重新平衡权力</p>\n</blockquote>\n<p>without a cheaper system对应not any cheaper；标题保留开放制度与成本结果的反差。</p>\n<p>再看最强干扰项G：A revival of the whole publishing industry。</p>\n<p>本段关注科研成本与权力失衡，没有证明整个出版业复苏。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Scientific journals occupy an unusual position in publishing because the people who provide their content usually receive no payment for doing so. Researchers need publication and professional recognition, while reviewers contribute specialist labour. These incentives allow publishers to obtain valuable material without paying its producers.</p>\n<p><strong>B.</strong></p>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges. The pattern resembles online platforms where many people supply labour for recognition while a small number of firms capture large profits. Access reform alone does not settle this imbalance between contributors and market operators.</p>\n<p><strong>C.</strong></p>\n<p>Once the material has been obtained, the publisher must find institutions willing to buy access to it. University libraries have traditionally been relatively insensitive to price. That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.</p>\n<p><strong>D.</strong></p>\n<p>Wider availability, however, has not necessarily lowered universities’ costs. Publishers can charge authors for preparing articles even when readers do not pay for access. The expense is shifted to another point in the publishing process rather than simply disappearing.</p>\n<p><strong>E.</strong></p>\n<p>One particularly drastic response is the illegal distribution of papers through Sci-Hub. Its success depends partly on researchers passing along copies they can access lawfully. The popularity of this unauthorised route suggests that the legal system has lost legitimacy among some of the people it is meant to serve.</p>\n<p><strong>F.</strong></p>\n<p>A lawful route to change has been promoted by research funders through open-access publishing. Papers may become freely available immediately or after a period behind a paywall. In the second arrangement publishers can still earn money before the work is released more widely.</p>\n<p><strong>G.</strong></p>\n<p>The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills. Institutions can pay substantial sums to read research that public money supported in the first place. Efforts to change this arrangement have therefore intensified as both profits and institutional costs continue to grow.</p>\n<p><strong>H.</strong></p>\n<p>A durable response must therefore reconsider the distribution of power within the system. Researchers, universities, readers and publishers all participate, but their bargaining positions differ greatly. Making the system work for them requires more than changing the moment at which an article becomes free to read.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从科研声望解释免费内容供给</td>\n</tr>\n<tr>\n<td>B</td>\n<td>把收费上涨接到平台利益失衡</td>\n</tr>\n<tr>\n<td>C</td>\n<td>把免费供给接到图书馆付费市场</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明向读者免费不等于成本消失</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释非法回应及用户认可流失</td>\n</tr>\n<tr>\n<td>F</td>\n<td>转入资助机构推动的合法开放路径</td>\n</tr>\n<tr>\n<td>G</td>\n<td>用盈利及大学账单说明改变压力</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结改革还需重新平衡参与者权力</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从科研声望解释免费内容供给 → 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力 → 解释非法回应及用户认可流失 → 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡 → 总结改革还需重新平衡参与者权力</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → C → G → E → F → D → B → H</strong></p>\n<p>41—45：C、G、F、D、B。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → C → G。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>These incentives allow publishers to obtain valuable material without paying its producers.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Once the material has been obtained, the publisher must find institutions willing to buy access to it.</p>\n</blockquote>\n<p>前段的These incentives说明声望激励使免费内容成为可能，当前Once the material has been obtained从内容已到手推进到销售。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>University libraries have traditionally been relatively insensitive to price. That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.</p>\n</blockquote>\n<p>先找愿意付费的机构，再落到图书馆不敏感，That combination回指免费内容与稳定买方，共同解释利润。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills.</p>\n</blockquote>\n<p>The contrast becomes concrete承接当前利润与行业危机的对照，下一段将它落实到出版商与大学账单。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从科研声望解释免费内容供给 → 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>A lawful route to change has been promoted by research funders through open-access publishing.</p>\n</blockquote>\n<p>合法开放路径应在收费压力和非法回应之后。此处仍需补从免费生产到付费销售的环节，直接转改革会让材料如何形成高利润缺一段。</p>\n<p><strong>41题选C。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为C → G → E。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills.</p>\n</blockquote>\n<p>前段已建立免费内容和可靠买方带来的高利润，The contrast承接这种反差并转成双方金额的具体比较。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Institutions can pay substantial sums to read research that public money supported in the first place. Efforts to change this arrangement have therefore intensified as both profits and institutional costs continue to grow.</p>\n</blockquote>\n<p>大学为公共资助的研究再付获取费用，therefore将这项安排与越来越强的改革努力相接，金额同时上升加重压力。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>One particularly drastic response is the illegal distribution of papers through Sci-Hub.</p>\n</blockquote>\n<p>One particularly drastic response中的response承接当前efforts to change，并把一般改变努力推进到Sci-Hub实例。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力 → 解释非法回应及用户认可流失</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>A lawful route to change has been promoted by research funders through open-access publishing.</p>\n</blockquote>\n<p>若先放合法开放路径，后面的特别激烈回应就失去其紧邻的改变压力背景；本段先说明为何越来越急于改变。</p>\n<p><strong>42题选G。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → F → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The popularity of this unauthorised route suggests that the legal system has lost legitimacy among some of the people it is meant to serve.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>A lawful route to change has been promoted by research funders through open-access publishing.</p>\n</blockquote>\n<p>前段this unauthorised route指Sci-Hub非法分发，当前A lawful route以合法对非法，继续讨论改变途径。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Papers may become freely available immediately or after a period behind a paywall. In the second arrangement publishers can still earn money before the work is released more widely.</p>\n</blockquote>\n<p>开放获取分立即公开与延迟公开，In the second arrangement回指后者，并解释出版商仍有获利期。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Wider availability, however, has not necessarily lowered universities’ costs.</p>\n</blockquote>\n<p>Wider availability承接开放获取的结果，however引出范围扩大未必降低大学成本的转折。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释非法回应及用户认可流失 → 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges.</p>\n</blockquote>\n<p>收费持续上涨应接在解释费用转向作者之后；这里先介绍开放路径，才能使后文的wider availability有清楚来源。</p>\n<p><strong>43题选F。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为F → D → B。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>In the second arrangement publishers can still earn money before the work is released more widely.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Wider availability, however, has not necessarily lowered universities’ costs.</p>\n</blockquote>\n<p>前段讲延迟开放期仍可盈利，当前however进一步限制开放的效果：可获取扩大并不等于大学省钱。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Publishers can charge authors for preparing articles even when readers do not pay for access. The expense is shifted to another point in the publishing process rather than simply disappearing.</p>\n</blockquote>\n<p>读者不付费时作者仍可能缴准备费，rather than说明费用换了承担环节而没有消失。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges.</p>\n</blockquote>\n<p>This shift直接回指当前expense is shifted，后段再将这种转移与两类收费上涨联系起来。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Once the material has been obtained, the publisher must find institutions willing to buy access to it.</p>\n</blockquote>\n<p>寻找购买机构属于旧模式如何赚钱的说明，不能接在开放路径后代替作者付费机制，否则This shift没有费用转移可回指。</p>\n<p><strong>44题选D。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为D → B → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>The expense is shifted to another point in the publishing process rather than simply disappearing.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges.</p>\n</blockquote>\n<p>前段以expense is shifted结束，当前This shift立即承接，再增加订阅费和准备费同步上涨的信息。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The pattern resembles online platforms where many people supply labour for recognition while a small number of firms capture large profits. Access reform alone does not settle this imbalance between contributors and market operators.</p>\n</blockquote>\n<p>The pattern把收费安排扩展为平台模式：多数人提供劳动，少数企业获利；Access reform alone说明开放本身未解决失衡。</p>\n<p>后段H开头是：</p>\n<
