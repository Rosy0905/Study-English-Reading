cus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-C-0\"><blockquote>\n<p>作者对Sci-Hub的成功感到担忧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>非法渠道取得成功，反映合法体系失去用户认可；作者认为必须改造，这种对问题及后果的关切对应Concerned。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Sci-Hub的成功感到担忧。</p>\n</blockquote>\n<p><code>Concerned</code>涉及作者是否把成功看成值得忧虑的现象，第4段末句的<code>has lost legitimacy</code>和<code>must be transformed</code>正是他对这一成功的解释，回看这句。</p>\n<p>原文说<code>Sci-Hub</code>的成功表明合法体系<code>has lost legitimacy</code>，用户已不认可它的正当性；作者随即要求改造这个体系，让所有参与者受益。<code>C</code>的<code>Concerned</code>可以概括这种态度：作者关心的是成功背后暴露的出版体系问题，并把它视为必须处理的事情。这里的担忧对象可以由完整的后半句说明，不必给成功本身另加褒贬词。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n<p>最激烈且完全违法的回应是Sci-Hub的出现。它像科学论文的全球复印机，于2012年建立，现声称可提供2015年以来每篇付费墙内文章的获取途径。Sci-Hub依靠研究者转交自己合法取得的副本；它的成功表明，合法体系在用户中已失去正当性，必须改造以服务所有参与者。</p>\n</blockquote>\n<p>先描述激烈且违法的反应，再从它的成功追溯出版体系的问题，而后要求体系服务所有参与者。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author is concerned about Sci-Hub’s success.</p>\n<p>作者对Sci-Hub的成功感到担忧。</p>\n</blockquote>\n<p>C并非简单讨厌Sci-Hub，也没有把作者写成只担心出版商利润。担忧来自合法体系不能有效服务用户、需要改革的现状。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. Encouraged.","raw":"### D. Encouraged.\n\n> 作者对Sci-Hub的成功受到鼓舞。\n\n**做题模式中的状态：** 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第一类——歪曲原意。**\n\n改革压力可能随Sci-Hub成功而增加，但作者明确写的是违法反应、正当性流失和改革必要性，未表示因此受到鼓舞。\n\n**出处：**\n\n> The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>作者对Sci-Hub的成功受到鼓舞。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>改革压力可能随Sci-Hub成功而增加，但作者明确写的是违法反应、正当性流失和改革必要性，未表示因此受到鼓舞。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n</section>"},{"title":"D. Encouraged.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者对Sci-Hub的成功受到鼓舞。\n\n改革压力可能随Sci-Hub成功而增加，但作者明确写的是违法反应、正当性流失和改革必要性，未表示因此受到鼓舞。\n\nsuccess在句中是待解释的现象；shows之后没有转入改革成效，而是指出合法体系的问题仍须处理。\n\nD需要积极希望或振奋的评价，不必非要改革已经完成；但原段没有给出这种态度。不能将success这个名词本身当作作者赞许它的证据。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>作者对Sci-Hub的成功受到鼓舞。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>改革压力可能随Sci-Hub成功而增加，但作者明确写的是违法反应、正当性流失和改革必要性，未表示因此受到鼓舞。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the le 给出这种态度。不能将success这个名词本身当作作者赞许它的证据。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. C**\n\n- A：作者从Sci-Hub成功看到合法体系失去用户认可，并要求改造，问题仍待解决，未写成让他松一口气的结果。\n- B：作者说明Sci-Hub依靠研究者传递副本，又明确解释成功意味着什么。他没有把它写成自己无法理解的现象。\n- C：非法渠道取得成功，反映合法体系失去用户认可；作者认为必须改造，这种对问题及后果的关切对应Concerned。\n- D：改革压力可能随Sci-Hub成功而增加，但作者明确写的是违法反应、正当性流失和改革必要性，未表示因此受到鼓舞。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"28","questionConclusion":true},"html":"<blockquote>\n<p><strong>28. C</strong></p>\n</blockquote>\n<ul>\n<li>A：作者从Sci-Hub成功看到合法体系失去用户认可，并要求改造，问题仍待解决，未写成让他松一口气的结果。</li>\n<li>B：作者说明Sci-Hub依靠研究者传递副本，又明确解释成功意味着什么。他没有把它写成自己无法理解的现象。</li>\n<li>C：非法渠道取得成功，反映合法体系失去用户认可；作者认为必须改造，这种对问题及后果的关切对应Concerned。</li>\n<li>D：改革压力可能随Sci-Hub成功而增加，但作者明确写的是违法反应、正当性流失和改革必要性，未表示因此受到鼓舞。</li>\n</ul>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> It can be learned from Paragraphs 5 and 6 that open access terms ______.\n>\n> 从第5、6段可以得知，开放获取条款______。\n\n### 题型\n\n细节推断题：分清读者、作者、大学与出版商，追踪免费获取之后费用由谁承担。\n\n题干明确给出Paragraphs 5 and 6，并点出open access terms。直接完整读第5、6段，看开放获取怎样实行，以及读者、作者和大学的费用怎样变化。\n\n### 核心出处\n\n> so that the publishers can make a profit before being placed on general release.\n>\n> Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.\n>\n> either freely available from the moment of publication","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"29","questionIntro":true},"html":"<blockquote>\n<p>It can be learned from Paragraphs 5 and 6 that open access terms ______.</p>\n<p>从第5、6段可以得知，开放获取条款______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节推断题：分清读者、作者、大学与出版商，追踪免费获取之后费用由谁承担。</p>\n<p>题干明确给出Paragraphs 5 and 6，并点出open access terms。直接完整读第5、6段，看开放获取怎样实行，以及读者、作者和大学的费用怎样变化。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>so that the publishers can make a profit before being placed on general release.</p>\n<p>Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.</p>\n<p>either freely available from the moment of publication</p>\n</blockquote>\n"},{"title":"A. allow publishers some room to make money","raw":"### A. allow publishers some room to make money\n\n> 开放获取条款给出版商留有一些赚钱空间。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n先设收费期再公开可让出版商盈利，向作者收文章准备费又提供收入渠道。A说仍有一些赚钱空间，与两段一致。\n\n**出处：**\n\n> In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\n> Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>开放获取条款给出版商留有一些赚钱空间。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>先设收费期再公开可让出版商盈利，向作者收文章准备费又提供收入渠道。A说仍有一些赚钱空间，与两段一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\nYet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n</blockquote>\n</section>"},{"title":"A. allow publishers some room to make money","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 开放获取条款给出版商留有一些赚钱空间。\n\n`some room to make money`对应第5段的`publishers can make a profit`，第6段的`charging their writers fees`则具体说明另一种收费安排，因此合看这两处。\n\n第5段明确说条款包含让出版商在公众发布前`make a profit`的安排；第6段又说出版商面对向读者免费的要求，转而向作者收取文章准备费用。`A`的`some room to make money`只是说还有一些盈利空间，与前一句直接写出的盈利目的相合。后一段的收费也说明读者免费并未消除出版商收取收入的途径。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>开放获取条款给出版商留有一些赚钱空间。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>先设收费期再公开可让出版商盈利，向作者收文章准备费又提供收入渠道。A说仍有一些赚钱空间，与两段一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\nYet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>开放获取条款给出版商留有一些赚钱空间。</p>\n</blockquote>\n<p><code>some room to make money</code>对应第5段的<code>publishers can make a profit</code>，第6段的<code>charging their writers fees</code>则具体说明另一种收费安排，因此合看这两处。</p>\n<p>第5段明确说条款包含让出版商在公众发布前<code>make a profit</code>的安排；第6段又说出版商面对向读者免费的要求，转而向作者收取文章准备费用。<code>A</code>的<code>some room to make money</code>只是说还有一些盈利空间，与前一句直接写出的盈利目的相合。后一段的收费也说明读者免费并未消除出版商收取收入的途径。</p>\n</section>"},{"title":"A. allow publishers some room to make money","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\n> Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.\n>\n> 英国开放获取出版的推进由资助机构带动。在某些方面，它很成功。现在英国超过半数科学研究按开放获取条款发表：或从发表起就免费可得，或先设置一年及以上付费期，让出版商在向公众开放前取得利润。\n>\n> 然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。\n\n开放获取扩大读者接触范围，第六段却用Yet指出大学未省钱，并说明出版商将收费转到作者端。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Open-access terms allow publishers some room to make money.\n>\n> 开放获取条款给出版商留有一些赚钱空间。\n\nA没有把开放获取说成完全免费，也没有承诺利润上升；它只保留仍能收费获利这一由原文直接说明的条件。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>开放获取条款给出版商留有一些赚钱空间。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>先设收费期再公开可让出版商盈利，向作者收文章准备费又提供收入渠道。A说仍有一些赚钱空间，与两段一致。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\nYet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific p need a rebalancing of power.</p>\n</blockquote>\n</section>"},{"title":"B. render publishing much easier for scientists","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 开放获取条款使科学家发表研究容易得多。\n\n`publishing much easier`涉及科学家把论文发表出去的难易；第5段的`freely available`谈论文怎样供人获取，第6段的`charging their writers fees`谈作者端的安排，需要分别核对。\n\n第5段的`freely available from the moment of publication`说明研究发表后可供读者免费获取，第6段明确把`free to readers`与`charging their writers fees`分开：读者免费，作者被收费。`B`的`publishing much easier`却把读者获得论文的便利改接到科学家发表论文的难易上，又加上“容易得多”的程度。这两段没有把免费获取与投稿、审稿或发表手续变容易连接起来。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>开放获取条款使科学家发表研究容易得多。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>免费获取是读者取得已发表论文的安排，容易发表是作者投稿、获准刊登的难易。原文还说作者需缴费，不能将二者合并。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\nYet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>开放获取条款使科学家发表研究容易得多。</p>\n</blockquote>\n<p><code>publishing much easier</code>涉及科学家把论文发表出去的难易；第5段的<code>freely available</code>谈论文怎样供人获取，第6段的<code>charging their writers fees</code>谈作者端的安排，需要分别核对。</p>\n<p>第5段的<code>freely available from the moment of publication</code>说明研究发表后可供读者免费获取，第6段明确把<code>free to readers</code>与<code>charging their writers fees</code>分开：读者免费，作者被收费。<code>B</code>的<code>publishing much easier</code>却把读者获得论文的便利改接到科学家发表论文的难易上，又加上“容易得多”的程度。这两段没有把免费获取与投稿、审稿或发表手续变容易连接起来。</p>\n</section>"},{"title":"B. render publishing much easier for scientists","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\n> Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.\n>\n> 英国开放获取出版的推进由资助机构带动。在某些方面，它很成功。现在英国超过半数科学研究按开放获取条款发表：或从发表起就免费可得，或先设置一年及以上付费期，让出版商在向公众开放前取得利润。\n>\n> 然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。\n\n第五段列立即免费或收费一段时间后公开，第六段分清free to readers和charging their writers fees两端。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Open-access terms render publishing much easier for scientists.\n>\n> 开放获取条款使科学家发表研究容易得多。\n\nB需要投稿或发表流程明显变容易的证据。读者少付费不等于研究者更容易发表，much easier的程度也未获支持。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>开放获取条款使科学家发表研究容易得多。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>免费获取是读者取得已发表论文的安排，容易发表是作者投稿、获准刊登的难易。原文还说作者需缴费，不能将二者合并。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\nYet the new system has not yet worked out any chea \nYet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n<p>英国开放获取出版的推进由资助机构带动。在某些方面，它很成功。现在英国超过半数科学研究按开放获取条款发表：或从发表起就免费可得，或先设置一年及以上付费期，让出版商在向公众开放前取得利润。</p>\n<p>然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。</p>\n</blockquote>\n<p>作者先肯定开放程度，再转向大学成本未降；向作者收费是费用转移的一种方式，并非成本消失。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Open-access terms free universities from financial burdens.</p>\n<p>开放获取条款使大学摆脱经济负担。</p>\n</blockquote>\n<p>D需要大学不再承担这些经济负担。实际原文仍以大学支出为问题，不能把部分读者免费推广为大学无需付费。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"29题结论","raw":"### 29题结论\n\n> **29. A**\n\n- A：先设收费期再公开可让出版商盈利，向作者收文章准备费又提供收入渠道。A说仍有一些赚钱空间，与两段一致。\n- B：免费获取是读者取得已发表论文的安排，容易发表是作者投稿、获准刊登的难易。原文还说作者需缴费，不能将二者合并。\n- C：大学没有更省钱，订阅费和文章准备费还以高于通胀的速度上涨，C的大幅降低与实际方向相反。\n- D：for the universities限定新制度没有变便宜的受影响者就是大学。D却说大学摆脱经济负担，改变了直接写出的结果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"29","questionConclusion":true},"html":"<blockquote>\n<p><strong>29. A</strong></p>\n</blockquote>\n<ul>\n<li>A：先设收费期再公开可让出版商盈利，向作者收文章准备费又提供收入渠道。A说仍有一些赚钱空间，与两段一致。</li>\n<li>B：免费获取是读者取得已发表论文的安排，容易发表是作者投稿、获准刊登的难易。原文还说作者需缴费，不能将二者合并。</li>\n<li>C：大学没有更省钱，订阅费和文章准备费还以高于通胀的速度上涨，C的大幅降低与实际方向相反。</li>\n<li>D：for the universities限定新制度没有变便宜的受影响者就是大学。D却说大学摆脱经济负担，改变了直接写出的结果。</li>\n</ul>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n> Which of the following characterises the scientific publishing model?\n>\n> 下列哪一项体现了科学出版模式的特点？\n\n### 题型\n\n模式概括题：对照劳动投入、声望回报与企业利润，找末段真正强调的分配关系。\n\n题干中的scientific publishing model在第6段后半部分原样出现，那里把它与社交互联网的经济相比。复读已完整读过的第6段，确认作者怎样概括这个模式。\n\n### 核心出处\n\n> either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release\n>\n> Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.\n>\n> labour is provided free in exchange for the hope of status","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"30","questionIntro":true},"html":"<blockquote>\n<p>Which of the following characterises the scientific publishing model?</p>\n<p>下列哪一项体现了科学出版模式的特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>模式概括题：对照劳动投入、声望回报与企业利润，找末段真正强调的分配关系。</p>\n<p>题干中的scientific publishing model在第6段后半部分原样出现，那里把它与社交互联网的经济相比。复读已完整读过的第6段，确认作者怎样概括这个模式。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release</p>\n<p>Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.</p>\n<p>labour is provided free in exchange for the hope of status</p>\n</blockquote>\n"},{"title":"A. Trial subscription is offered.","raw":"### A. > Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it. A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.\n>\n> 然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。\n\n首段交代免费学术劳动，末段重提劳动换声望、少数企业获利，随后以重新平衡权力收束。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The few feed on the many.\n>\n> 科学出版模式的特点是少数人靠多数人的劳动获利。\n\nfeed on在这里是靠多数人的劳动获利，并非说研究者直接向企业赠钱。D保留两方的投入收益差异，能接住结尾的改革要求。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>科学出版模式的特点是少数人靠多数人的劳动获利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>大量研究者免费提供论文和评审，少数经营市场的大企业赚取巨额利润。D概括了贡献分散、收益集中的依赖关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities. Publishers have responded to the demand that they make their f status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.</p>\n<p>然而，新制度并未使大学更省钱。面对产品应向读者免费的要求，出版商转而向作者收费，以支付文章准备成本。费用约从500英镑到5000美元，而且似乎出版商做得越多，工作越昂贵。去年的报告指出，订阅费和文章准备费均以高于通胀的速度持续上涨。从某些方面看，科学出版模式类似社交互联网经济：人们免费劳动以求获得地位，少数经营市场的大企业却赚取巨额利润。两种情况都需要重新平衡权力。</p>\n</blockquote>\n<p>首段交代免费学术劳动，末段重提劳动换声望、少数企业获利，随后以重新平衡权力收束。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The few feed on the many.</p>\n<p>科学出版模式的特点是少数人靠多数人的劳动获利。</p>\n</blockquote>\n<p>feed on在这里是靠多数人的劳动获利，并非说研究者直接向企业赠钱。D保留两方的投入收益差异，能接住结尾的改革要求。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"30题结论","raw":"### 30题结论\n\n> **30. D**\n\n- A：论文从发表时免费或收费一段时间后开放，是公开获取安排；trial subscription则是试用订阅，原文没有这种试用关系。\n- B：in exchange for表示提供免费劳动以求获得地位，地位是期待回报。triumphs over却把劳动与地位改成胜负双方。\n- C：费用增速高于通胀，大学未因新制度省钱，作者把这些作为问题提出。C概括成控制良好，与这组具体事实不符。\n- D：大量研究者免费提供论文和评审，少数经营市场的大企业赚取巨额利润。D概括了贡献分散、收益集中的依赖关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"30","questionConclusion":true},"html":"<blockquote>\n<p><strong>30. D</strong></p>\n</blockquote>\n<ul>\n<li>A：论文从发表时免费或收费一段时间后开放，是公开获取安排；trial subscription则是试用订阅，原文没有这种试用关系。</li>\n<li>B：in exchange for表示提供免费劳动以求获得地位，地位是期待回报。triumphs over却把劳动与地位改成胜负双方。</li>\n<li>C：费用增速高于通胀，大学未因新制度省钱，作者把这些作为问题提出。C概括成控制良好，与这组具体事实不符。</li>\n<li>D：大量研究者免费提供论文和评审，少数经营市场的大企业赚取巨额利润。D概括了贡献分散、收益集中的依赖关系。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：科学出版业的暴利模式**（段落1-2核心问题） 暴利基础：【科学家免费提供文章（需要期刊发表）+ 同行评审免费（为获得地位）】→ 出版商零成本获得内容 → 只需找到市场（大学图书馆不敏感于价格）→ 结果：40%利润率 // 其他出版业生存危机\n\n↓（具体案例）\n\n**逻辑层次2：爱思唯尔的垄断与暴利**（段落3实例说明） 垄断地位：爱思唯尔出版全球25%科学论文 → 暴利现实：【年利润超9亿英镑 // 英国大学年支出超2.1亿英镑（访问自己的研究）】→ 恶性循环：两个数字都在势不可挡地上升\n\n↓（极端反应）\n\n**逻辑层次3：Sci-Hub的非法反抗**（段落4系统崩溃） 极端反应：Sci-Hub出现（2012年，全球论文复印机）→ 声称提供所有付费墙文章（2015年后）→ 深层意义：【依赖研究人员传递合法副本 → 表明法律生态系统失去用户合法性 → 需要系统改造】\n\n↓（改革尝试）\n\n**逻辑层次4：开放获取的改革尝试**（段落5英国实践） 英国模式：资助机构推动开放获取 → 部分成功：超过50%研究开放获取发表 → 两种形式：【立即免费 // 延迟一年（让出版商先获利）】\n\n↓（改革困境）\n\n**逻辑层次5：新系统的失败与权力失衡**（段落6问题本质） 成本未降：大学支出没有减少 → 新的收费模式：【向作者收费（500-5000英镑/美元）+ 费用随规模上升】→ 通胀问题：订阅费和准备费都高于通胀上升 → 本质问题：【类似社交互联网（免费劳动换地位希望 // 少数大公司获巨利）→ 需要权力再平衡】\n\n↑（全文主旨）\n\n全文核心观点：科学出版业通过获取免费内容和垄断市场获得暴利，导致系统失去合法性（Sci-Hub出现），虽有开放获取改革，但未能解决成本问题，本质是少数大公司剥削多数科学家的权力失衡。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：科学出版业的暴利模式</strong>（段落1-2核心问题） 暴利基础：【科学家免费提供文章（需要期刊发表）+ 同行评审免费（为获得地位）】→ 出版商零成本获得内容 → 只需找到市场（大学图书馆不敏感于价格）→ 结果：40%利润率 // 其他出版业生存危机</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次2：爱思唯尔的垄断与暴利</strong>（段落3实例说明） 垄断地位：爱思唯尔出版全球25%科学论文 → 暴利现实：【年利润超9亿英镑 // 英国大学年支出超2.1亿英镑（访问自己的研究）】→ 恶性循环：两个数字都在势不可挡地上升</p>\n<p>↓（极端反应）</p>\n<p><strong>逻辑层次3：Sci-Hub的非法反抗</strong>（段落4系统崩溃） 极端反应：Sci-Hub出现（2012年，全球论文复印机）→ 声称提供所有付费墙文章（2015年后）→ 深层意义：【依赖研究人员传递合法副本 → 表明法律生态系统失去用户合法性 → 需要系统改造】</p>\n<p>↓（改革尝试）</p>\n<p><strong>逻辑层次4：开放获取的改革尝试</strong>（段落5英国实践） 英国模式：资助机构推动开放获取 → 部分成功：超过50%研究开放获取发表 → 两种形式：【立即免费 // 延迟一年（让出版商先获利）】</p>\n<p>↓（改革困境）</p>\n<p><strong>逻辑层次5：新系统的失败与权力失衡</strong>（段落6问题本质） 成本未降：大学支出没有减少 → 新的收费模式：【向作者收费（500-5000英镑/美元）+ 费用随规模上升】→ 通胀问题：订阅费和准备费都高于通胀上升 → 本质问题：【类似社交互联网（免费劳动换地位希望 // 少数大公司获巨利）→ 需要权力再平衡】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：科学出版业通过获取免费内容和垄断市场获得暴利，导致系统失去合法性（Sci-Hub出现），虽有开放获取改革，但未能解决成本问题，本质是少数大公司剥削多数科学家的权力失衡。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】A. High profits built on free scholarly labour\n\n> 建立在免费学术劳动之上的高利润\n\n研究者免费提供论文和评审，出版商取得内容后向图书馆出售，利润率与行业危机形成反差。\n\n> Scientific publishing has long been a licence to print money.\n\n印钞许可证的比喻提出高盈利现象，后面的免费供稿与评审解释利润条件。\n\n> With the content of papers secured for free, the publisher needs only find a market for its journal.\n\nWith将免费内容接到出版商寻找市场的任务，买方是对价格不敏感的大学图书馆。\n\n> Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.\n\n接近40%的利润率与其他出版业危机形成反差，标题须同时涵盖免费投入和高额回报。\n\n这一部分的推进关系是：\n\n> 免费供稿及评审 → 图书馆付费市场 → 科学出版高利润\n\nfree scholarly labour对应两类免费劳动，high profits对应40%左右利润率。\n\n再看最强干扰项G：A revival of the whole publishing industry。\n\n危机属于其余出版行业，科学出版商赚钱不证明全行业复苏。\n\n**41题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】A. High profits built on free scholarly labour</p>\n<blockquote>\n<p>建立在免费学术劳动之上的高利润</p>\n</blockquote>\n<p>研究者免费提供论文和评审，出版商取得内容后向图书馆出售，利润率与行业危机形成反差。</p>\n<blockquote>\n<p>Scientific publishing has long been a licence to print money.</p>\n</blockquote>\n<p>印钞许可证的比喻提出高盈利现象，后面的免费供稿与评审解释利润条件。</p>\n<blockquote>\n<p>With the content of papers secured for free, the publisher needs only find a market for its journal.</p>\n</blockquote>\n<p>With将免费内容接到出版商寻找市场的任务，买方是对价格不敏感的大学图书馆。</p>\n<blockquote>\n<p>Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.</p>\n</blockquote>\n<p>接近40%的利润率与其他出版业危机形成反差，标题须同时涵盖免费投入和高额回报。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>免费供稿及评审 → 图书馆付费市场 → 科学出版高利润</p>\n</blockquote>\n<p>free scholarly labour对应两类免费劳动，high profits对应40%左右利润率。</p>\n<p>再看最强干扰项G：A revival of the whole publishing industry。</p>\n<p>危机属于其余出版行业，科学出版商赚钱不证明全行业复苏。</p>\n<p><strong>41题选A。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. The financial contrast between a publisher and universities\n\n> 出版商与大学之间的财务反差\n\n用Elsevier的论文份额与利润、英国大学付费获取公共资助研究的开支，展示两端金额同时上升。\n\n> The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.\n\nElsevier的利润和英国大学的支出由while并列，一端收入可观，另一端为自己的公共资助研究付费。\n\n这一部分的推进关系是：\n\n> 出版商高利润 → 大学高额获取费用 → 两项金额持续增长、改变困难\n\nfinancial contrast保留谁盈利、谁支付，不能将大学开支误作出版商资助。\n\n再看最强干扰项D：The complete removal of every publication fee。\n\n这里费用在上涨，未取消发表或获取费用。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. The financial contrast between a publisher and universities</p>\n<blockquote>\n<p>出版商与大学之间的财务反差</p>\n</blockquote>\n<p>用Elsevier的论文份额与利润、英国大学付费获取公共资助研究的开支，展示两端金额同时上升。</p>\n<blockquote>\n<p>The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.</p>\n</blockquote>\n<p>Elsevier的利润和英国大学的支出由while并列，一端收入可观，另一端为自己的公共资助研究付费。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>出版商高利润 → 大学高额获取费用 → 两项金额持续增长、改变困难</p>\n</blockquote>\n<p>financial contrast保留谁盈利、谁支付，不能将大学开支误作出版商资助。</p>\n<p>再看最强干扰项D：The complete removal of every publication fee。</p>\n<p>这里费用在上涨，未取消发表或获取费用。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】C. An illegal response that exposes a loss of legitimacy\n\n> 暴露正当性流失的非法回应\n\n先说明Sci-Hub的违法方式与覆盖面，再由其成功判断合法体系失去用户认可。\n\n> The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015.\n\ndrastic和illegal限定Sci-Hub是对现有收费体系的激烈非法回应，不能只抓全球复印机这个形象。\n\n> The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n\n第二句从研究者转交副本的参与行为，推到现有合法体系失去用户认可并必须改革。\n\n这一部分的推进关系是：\n\n> 非法获取渠道出现 → 用户参与使其成功 → 合法体系正当性流失、需要改造\n\nillegal response对应thoroughly illegal，loss of legitimacy对应作者由成功得出的诊断。\n\n再看最强干扰项F：How funded research is being opened to readers。\n\nSci-Hub的运作和资助机构推动的合法开放获取是两条不同路径。\n\n**43题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】C. An illegal response that exposes a loss of legitimacy</p>\n<blockquote>\n<p>暴露正当性流失的非法回应</p>\n</blockquote>\n<p>先说明Sci-Hub的违法方式与覆盖面，再由其成功判断合法体系失去用户认可。</p>\n<blockquote>\n<p>The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015.</p>\n</blockquote>\n<p>drastic和illegal限定Sci-Hub是对现有收费体系的激烈非法回应，不能只抓全球复印机这个形象。</p>\n<blockquote>\n<p>The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n<p>第二句从研究者转交副本的参与行为，推到现有合法体系失去用户认可并必须改革。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>非法获取渠道出现 → 用户参与使其成功 → 合法体系正当性流失、需要改造</p>\n</blockquote>\n<p>illegal response对应thoroughly illegal，loss of legitimacy对应作者由成功得出的诊断。</p>\n<p>再看最强干扰项F：How funded research is being opened to readers。</p>\n<p>Sci-Hub的运作和资助机构推动的合法开放获取是两条不同路径。</p>\n<p><strong>43题选C。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. How funded research is being opened to readers\n\n> 资助研究如何向读者开放\n\n英国资助机构推动开放获取，研究既可即时免费，也可先收费一段时间再公开。\n\n> In Britain the move towards open access publishing has been driven by funding bodies.\n\nfunding bodies指明推动开放获取的是科研资助机构，讨论转入合法改变途径。\n\n> In some ways it has been very successful.\n\nvery successful的成功随后由超过半数研究按开放条款发表加以说明，主要是可获取程度。\n\n> More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.\n\neither...or列出立即免费与先收费后公开两种路径，不能把开放获取一律理解为出版即免费。\n\n这一部分的推进关系是：\n\n> 资助机构推动 → 开放发表覆盖扩大 → 即时免费或延迟开放\n\nhow ... opened概括两种时间安排，funded research对应funding bodies的推动。\n\n再看最强干扰项D：The complete removal of every publication fee。\n\n延迟开放允许出版商先赚钱，不能概括成所有费用取消。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. How funded research is being opened to readers</p>\n<blockquote>\n<p>资助研究如何向读者开放</p>\n</blockquote>\n<p>英国资助机构推动开放获取，研究既可即时免费，也可先收费一段时间再公开。</p>\n<blockquote>\n<p>In Britain the move towards open access publishing has been driven by funding bodies.</p>\n</blockquote>\n<p>funding bodies指明推动开放获取的是科研资助机构，讨论转入合法改变途径。</p>\n<blockquote>\n<p>In some ways it has been very successful.</p>\n</blockquote>\n<p>very successful的成功随后由超过半数研究按开放条款发表加以说明，主要是可获取程度。</p>\n<blockquote>\n<p>More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.</p>\n</blockquote>\n<p>either...or列出立即免费与先收费后公开两种路径，不能把开放获取一律理解为出版即免费。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>资助机构推动 → 开放发表覆盖扩大 → 即时免费或延迟开放</p>\n</blockquote>\n<p>how ... opened概括两种时间安排，funded research对应funding bodies的推动。</p>\n<p>再看最强干扰项D：The complete removal of every publication fee。</p>\n<p>延迟开放允许出版商先赚钱，不能概括成所有费用取消。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Open access without a cheaper system\n\n> 开放获取并未带来更低成本的体系\n\nYet转入大学仍未省钱，作者收费及订阅费持续上升，最后把免费劳动与少数企业获利相对照。\n\n> Yet the new system has not yet worked out any cheaper for the universities.\n\nYet接住前段的成功而转向大学成本，获取扩大并不自动带来支出下降。\n\n> A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation.\n\n订阅费与文章准备费都涨得比通胀快，说明向作者收费没有解决成本问题。\n\n> In both cases, we need a rebalancing of power.\n\n结尾的rebalancing把具体收费问题提升到劳动贡献者与利润获取者的权力分配，标题要覆盖未解决的体系成本。\n\n这一部分的推进关系是：\n\n> 开放扩大但大学未省钱 → 收费转移且持续上涨 → 需要重新平衡权力\n\nwithout a cheaper system对应not any cheaper；标题保留开放制度与成本结果的反差。\n\n再看最强干扰项G：A revival of the whole publishing industry。\n\n本段关注科研成本与权力失衡，没有证明整个出版业复苏。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Open access without a cheaper system</p>\n<blockquote>\n<p>开放获取并未带来更低成本的体系</p>\n</blockquote>\n<p>Yet转入大学仍未省钱，作者收费及订阅费持续上升，最后把免费劳动与少数企业获利相对照。</p>\n<blockquote>\n<p>Yet the new system has not yet worked out any cheaper for the universities.</p>\n</blockquote>\n<p>Yet接住前段的成功而转向大学成本，获取扩大并不自动带来支出下降。</p>\n<blockquote>\n<p>A report last year pointed out that the costs both of subscriptions and of these &quot;article preparation costs&quot; had been steadily rising at a rate above inflation.</p>\n</blockquote>\n<p>订阅费与文章准备费都涨得比通胀快，说明向作者收费没有解决成本问题。</p>\n<blockquote>\n<p>In both cases, we need a rebalancing of power.</p>\n</blockquote>\n<p>结尾的rebalancing把具体收费问题提升到劳动贡献者与利润获取者的权力分配，标题要覆盖未解决的体系成本。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>开放扩大但大学未省钱 → 收费转移且持续上涨 → 需要重新平衡权力</p>\n</blockquote>\n<p>without a cheaper system对应not any cheaper；标题保留开放制度与成本结果的反差。</p>\n<p>再看最强干扰项G：A revival of the whole publishing industry。</p>\n<p>本段关注科研成本与权力失衡，没有证明整个出版业复苏。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从科研声望解释免费内容供给 |\n| B | 把收费上涨接到平台利益失衡 |\n| C | 把免费供给接到图书馆付费市场 |\n| D | 说明向读者免费不等于成本消失 |\n| E | 解释非法回应及用户认可流失 |\n| F | 转入资助机构推动的合法开放路径 |\n| G | 用盈利及大学账单说明改变压力 |\n| H | 总结改革还需重新平衡参与者权力 |\n\n全文推进：\n\n> 从科研声望解释免费内容供给 → 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力 → 解释非法回应及用户认可流失 → 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡 → 总结改革还需重新平衡参与者权力\n\n完整顺序：\n\n**A → C → G → E → F → D → B → H**\n\n41—45：C、G、F、D、B。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从科研声望解释免费内容供给</td>\n</tr>\n<tr>\n<td>B</td>\n<td>把收费上涨接到平台利益失衡</td>\n</tr>\n<tr>\n<td>C</td>\n<td>把免费供给接到图书馆付费市场</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明向读者免费不等于成本消失</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释非法回应及用户认可流失</td>\n</tr>\n<tr>\n<td>F</td>\n<td>转入资助机构推动的合法开放路径</td>\n</tr>\n<tr>\n<td>G</td>\n<td>用盈利及大学账单说明改变压力</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结改革还需重新平衡参与者权力</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从科研声望解释免费内容供给 → 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力 → 解释非法回应及用户认可流失 → 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡 → 总结改革还需重新平衡参与者权力</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → C → G → E → F → D → B → H</strong></p>\n<p>41—45：C、G、F、D、B。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → C → G。\n\n先看前段A的结尾：\n\n> These incentives allow publishers to obtain valuable material without paying its producers.\n\n再看C段开头：\n\n> Once the material has been obtained, the publisher must find institutions willing to buy access to it.\n\n前段的These incentives说明声望激励使免费内容成为可能，当前Once the material has been obtained从内容已到手推进到销售。\n\n本段内部继续写道：\n\n> University libraries have traditionally been relatively insensitive to price. That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.\n\n先找愿意付费的机构，再落到图书馆不敏感，That combination回指免费内容与稳定买方，共同解释利润。\n\n后段G开头是：\n\n> The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills.\n\nThe contrast becomes concrete承接当前利润与行业危机的对照，下一段将它落实到出版商与大学账单。\n\n这三段的推进关系：\n\n> 从科研声望解释免费内容供给 → 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力\n\n再检验候选F：\n\n> A lawful route to change has been promoted by research funders through open-access publishing.\n\n合法开放路径应在收费压力和非法回应之后。此处仍需补从免费生产到付费销售的环节，直接转改革会让材料如何形成高利润缺一段。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>41题是全文第2段，局部关系为A → C → G。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>These incentives allow publishers to obtain valuable material without paying its producers.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Once the material has been obtained, the publisher must find institutions willing to buy access to it.</p>\n</blockquote>\n<p>前段的These incentives说明声望激励使免费内容成为可能，当前Once the material has been obtained从内容已到手推进到销售。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>University libraries have traditionally been relatively insensitive to price. That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.</p>\n</blockquote>\n<p>先找愿意付费的机构，再落到图书馆不敏感，That combination回指免费内容与稳定买方，共同解释利润。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills.</p>\n</blockquote>\n<p>The contrast becomes concrete承接当前利润与行业危机的对照，下一段将它落实到出版商与大学账单。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从科研声望解释免费内容供给 → 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>A lawful route to change has been promoted by research funders through open-access publishing.</p>\n</blockquote>\n<p>合法开放路径应在收费压力和非法回应之后。此处仍需补从免费生产到付费销售的环节，直接转改革会让材料如何形成高利润缺一段。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为C → G → E。\n\n先看前段C的结尾：\n\n> That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.\n\n再看G段开头：\n\n> The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills.\n\n前段已建立免费内容和可靠买方带来的高利润，The contrast承接这种反差并转成双方金额的具体比较。\n\n本段内部继续写道：\n\n> Institutions can pay substantial sums to read research that public money supported in the first place. Efforts to change this arrangement have therefore intensified as both profits and institutional costs continue to grow.\n\n大学为公共资助的研究再付获取费用，therefore将这项安排与越来越强的改革努力相接，金额同时上升加重压力。\n\n后段E开头是：\n\n> One particularly drastic response is the illegal distribution of papers through Sci-Hub.\n\nOne particularly drastic response中的response承接当前efforts to change，并把一般改变努力推进到Sci-Hub实例。\n\n这三段的推进关系：\n\n> 把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力 → 解释非法回应及用户认可流失\n\n再检验候选F：\n\n> A lawful route to change has been promoted by research funders through open-access publishing.\n\n若先放合法开放路径，后面的特别激烈回应就失去其紧邻的改变压力背景；本段先说明为何越来越急于改变。\n\n**42题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>42题是全文第3段，局部关系为C → G → E。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>That combination of free content and dependable buyers helps explain profit margins that contrast sharply with difficulties elsewhere in publishing.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The contrast becomes concrete when a large publisher’s profits are set beside universities’ access bills.</p>\n</blockquote>\n<p>前段已建立免费内容和可靠买方带来的高利润，The contrast承接这种反差并转成双方金额的具体比较。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Institutions can pay substantial sums to read research that public money supported in the first place. Efforts to change this arrangement have therefore intensified as both profits and institutional costs continue to grow.</p>\n</blockquote>\n<p>大学为公共资助的研究再付获取费用，therefore将这项安排与越来越强的改革努力相接，金额同时上升加重压力。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>One particularly drastic response is the illegal distribution of papers through Sci-Hub.</p>\n</blockquote>\n<p>One particularly drastic response中的response承接当前efforts to change，并把一般改变努力推进到Sci-Hub实例。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把免费供给接到图书馆付费市场 → 用盈利及大学账单说明改变压力 → 解释非法回应及用户认可流失</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>A lawful route to change has been promoted by research funders through open-access publishing.</p>\n</blockquote>\n<p>若先放合法开放路径，后面的特别激烈回应就失去其紧邻的改变压力背景；本段先说明为何越来越急于改变。</p>\n<p><strong>42题选G。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → F → D。\n\n先看前段E的结尾：\n\n> The popularity of this unauthorised route suggests that the legal system has lost legitimacy among some of the people it is meant to serve.\n\n再看F段开头：\n\n> A lawful route to change has been promoted by research funders through open-access publishing.\n\n前段this unauthorised route指Sci-Hub非法分发，当前A lawful route以合法对非法，继续讨论改变途径。\n\n本段内部继续写道：\n\n> Papers may become freely available immediately or after a period behind a paywall. In the second arrangement publishers can still earn money before the work is released more widely.\n\n开放获取分立即公开与延迟公开，In the second arrangement回指后者，并解释出版商仍有获利期。\n\n后段D开头是：\n\n> Wider availability, however, has not necessarily lowered universities’ costs.\n\nWider availability承接开放获取的结果，however引出范围扩大未必降低大学成本的转折。\n\n这三段的推进关系：\n\n> 解释非法回应及用户认可流失 → 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失\n\n再检验候选B：\n\n> This shift has occurred alongside continuing increases in subscription and preparation charges.\n\n收费持续上涨应接在解释费用转向作者之后；这里先介绍开放路径，才能使后文的wider availability有清楚来源。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>43题是全文第5段，局部关系为E → F → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The popularity of this unauthorised route suggests that the legal system has lost legitimacy among some of the people it is meant to serve.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>A lawful route to change has been promoted by research funders through open-access publishing.</p>\n</blockquote>\n<p>前段this unauthorised route指Sci-Hub非法分发，当前A lawful route以合法对非法，继续讨论改变途径。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Papers may become freely available immediately or after a period behind a paywall. In the second arrangement publishers can still earn money before the work is released more widely.</p>\n</blockquote>\n<p>开放获取分立即公开与延迟公开，In the second arrangement回指后者，并解释出版商仍有获利期。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Wider availability, however, has not necessarily lowered universities’ costs.</p>\n</blockquote>\n<p>Wider availability承接开放获取的结果，however引出范围扩大未必降低大学成本的转折。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释非法回应及用户认可流失 → 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges.</p>\n</blockquote>\n<p>收费持续上涨应接在解释费用转向作者之后；这里先介绍开放路径，才能使后文的wider availability有清楚来源。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为F → D → B。\n\n先看前段F的结尾：\n\n> In the second arrangement publishers can still earn money before the work is released more widely.\n\n再看D段开头：\n\n> Wider availability, however, has not necessarily lowered universities’ costs.\n\n前段讲延迟开放期仍可盈利，当前however进一步限制开放的效果：可获取扩大并不等于大学省钱。\n\n本段内部继续写道：\n\n> Publishers can charge authors for preparing articles even when readers do not pay for access. The expense is shifted to another point in the publishing process rather than simply disappearing.\n\n读者不付费时作者仍可能缴准备费，rather than说明费用换了承担环节而没有消失。\n\n后段B开头是：\n\n> This shift has occurred alongside continuing increases in subscription and preparation charges.\n\nThis shift直接回指当前expense is shifted，后段再将这种转移与两类收费上涨联系起来。\n\n这三段的推进关系：\n\n> 转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡\n\n再检验候选C：\n\n> Once the material has been obtained, the publisher must find institutions willing to buy access to it.\n\n寻找购买机构属于旧模式如何赚钱的说明，不能接在开放路径后代替作者付费机制，否则This shift没有费用转移可回指。\n\n**44题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>44题是全文第6段，局部关系为F → D → B。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>In the second arrangement publishers can still earn money before the work is released more widely.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Wider availability, however, has not necessarily lowered universities’ costs.</p>\n</blockquote>\n<p>前段讲延迟开放期仍可盈利，当前however进一步限制开放的效果：可获取扩大并不等于大学省钱。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Publishers can charge authors for preparing articles even when readers do not pay for access. The expense is shifted to another point in the publishing process rather than simply disappearing.</p>\n</blockquote>\n<p>读者不付费时作者仍可能缴准备费，rather than说明费用换了承担环节而没有消失。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges.</p>\n</blockquote>\n<p>This shift直接回指当前expense is shifted，后段再将这种转移与两类收费上涨联系起来。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转入资助机构推动的合法开放路径 → 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Once the material has been obtained, the publisher must find institutions willing to buy access to it.</p>\n</blockquote>\n<p>寻找购买机构属于旧模式如何赚钱的说明，不能接在开放路径后代替作者付费机制，否则This shift没有费用转移可回指。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为D → B → H。\n\n先看前段D的结尾：\n\n> The expense is shifted to another point in the publishing process rather than simply disappearing.\n\n再看B段开头：\n\n> This shift has occurred alongside continuing increases in subscription and preparation charges.\n\n前段以expense is shifted结束，当前This shift立即承接，再增加订阅费和准备费同步上涨的信息。\n\n本段内部继续写道：\n\n> The pattern resembles online platforms where many people supply labour for recognition while a small number of firms capture large profits. Access reform alone does not settle this imbalance between contributors and market operators.\n\nThe pattern把收费安排扩展为平台模式：多数人提供劳动，少数企业获利；Access reform alone说明开放本身未解决失衡。\n\n后段H开头是：\n\n> A durable response must therefore reconsider the distribution of power within the system.\n\nA durable response中的therefore承接仍未解决的imbalance，将结尾推进到参与者权力的重新分配。\n\n这三段的推进关系：\n\n> 说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡 → 总结改革还需重新平衡参与者权力\n\n再检验候选C：\n\n> Once the material has been obtained, the publisher must find institutions willing to buy access to it.\n\n取得免费材料后寻找买方是前文旧模式的起点，此处已讨论改革仍存的失衡，回到那个起点会中断通向权力改革的收束。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>45题是全文第7段，局部关系为D → B → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>The expense is shifted to another point in the publishing process rather than simply disappearing.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>This shift has occurred alongside continuing increases in subscription and preparation charges.</p>\n</blockquote>\n<p>前段以expense is shifted结束，当前This shift立即承接，再增加订阅费和准备费同步上涨的信息。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The pattern resembles online platforms where many people supply labour for recognition while a small number of firms capture large profits. Access reform alone does not settle this imbalance between contributors and market operators.</p>\n</blockquote>\n<p>The pattern把收费安排扩展为平台模式：多数人提供劳动，少数企业获利；Access reform alone说明开放本身未解决失衡。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>A durable response must therefore reconsider the distribution of power within the system.</p>\n</blockquote>\n<p>A durable response中的therefore承接仍未解决的imbalance，将结尾推进到参与者权力的重新分配。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明向读者免费不等于成本消失 → 把收费上涨接到平台利益失衡 → 总结改革还需重新平衡参与者权力</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Once the material has been obtained, the publisher must find institutions willing to buy access to it.</p>\n</blockquote>\n<p>取得免费材料后寻找买方是前文旧模式的起点，此处已讨论改革仍存的失衡，回到那个起点会中断通向权力改革的收束。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **knowledge sharing** | **知识共享** | **社会现象｜文化教育** | **宏观主题** |\n| equal access to knowledge | 平等获取知识 | 社会现象｜文化教育 | 宏观主题 |\n| research cooperation | 科研合作 | 人生哲理｜合作 | 个人主题 |\n| **a fair distribution of benefits** | **公平的利益分配** | **社会现象｜科技经济** | **宏观主题** |\n| the public value of research | 科研的公共价值 | 社会现象｜科技经济 | 宏观主题 |\n| professional dedication | 敬业精神 | 人生哲理｜责任与奉献 | 个人主题 |\n| institutional reform | 制度改革 | 社会现象｜科技经济 | 宏观主题 |\n| responsible participation | 负责任的参与 | 人生哲理｜责任与奉献 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>knowledge sharing</strong></td>\n<td><strong>知识共享</strong></td>\n<td><strong>社会现象｜文化教育</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>equal access to knowledge</td>\n<td>平等获取知识</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>research cooperation</td>\n<td>科研合作</td>\n<td>人生哲理｜合作</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td><strong>a fair distribution of benefits</strong></td>\n<td><strong>公平的利益分配</strong></td>\n<td><strong>社会现象｜科技经济</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>the public value of research</td>\n<td>科研的公共价值</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>professional dedication</td>\n<td>敬业精神</td>\n<td>人生哲理｜责任与奉献</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>institutional reform</td>\n<td>制度改革</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>responsible participation</td>\n<td>负责任的参与</td>\n<td>人生哲理｜责任与奉献</td>\n<td>个人主题</td>\n</tr>\n</tbody></table></div>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画** | **The picture contrasts the work supplied by many with the gains received by a few.** | **图画对比了多数人提供的劳动和少数人得到的收益。** |\n| 图画 | The participants exchange their time and expertise for the hope of recognition. | 参与者以时间和专业能力换取获得认可的希望。 |\n| 图画 | The scene draws attention to unequal positions within a shared system. | 场景引导人们关注同一体系中的地位不平等。 |\n| **图表** | **Both figures continue to rise despite efforts to change the trend.** | **尽管有人努力改变趋势，两项数字仍持续上升。** |\n| 图表 | The cost has been increasing at a rate above inflation. | 成本增速一直高于通胀水平。 |\n| 图表 | Greater access has not been accompanied by an equally large fall in expense. | 获取机会扩大并未伴随费用的同等下降。 |\n| 文本评论 | The statement calls for a system that works for all participants. | 这句话呼吁建立对所有参与者都有益的体系。 |\n| 文本评论 | The passage stresses the need to rebalance power between contributors and operators. | 这段文字强调重新平衡贡献者与经营者之间权力的必要性。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The picture contrasts the work supplied by many with the gains received by a few.</strong></td>\n<td><strong>图画对比了多数人提供的劳动和少数人得到的收益。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The participants exchange their time and expertise for the hope of recognition.</td>\n<td>参与者以时间和专业能力换取获得认可的希望。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene draws attention to unequal positions within a shared system.</td>\n<td>场景引导人们关注同一体系中的地位不平等。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>Both figures continue to rise despite efforts to change the trend.</strong></td>\n<td><strong>尽管有人努力改变趋势，两项数字仍持续上升。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The cost has been increasing at a rate above inflation.</td>\n<td>成本增速一直高于通胀水平。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Greater access has not been accompanied by an equally large fall in expense.</td>\n<td>获取机会扩大并未伴随费用的同等下降。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement calls for a system that works for all participants.</td>\n<td>这句话呼吁建立对所有参与者都有益的体系。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage stresses the need to rebalance power between contributors and operators.</td>\n<td>这段文字强调重新平衡贡献者与经营者之间权力的必要性。</td>\n</tr>\n</tbody></table></div>\n"}];
