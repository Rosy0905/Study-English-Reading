<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 36题题干\n\n**The French Senate has passed a bill to ______.**\n\n> 法国参议院已通过一项法案，来做什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>36题题干</h2>\n<p><strong>The French Senate has passed a bill to ______.</strong></p>\n<blockquote>\n<p>法国参议院已通过一项法案，来做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,214,686,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**It can be learned from Paragraph 2 that the digital services tax ______.**\n\n> 从第2段可以知道，数字服务税怎么样？\n\n题型：**段落推断题**。\n\n---","html":"<h2>37题题干</h2>\n<p><strong>It can be learned from Paragraph 2 that the digital services tax ______.</strong></p>\n<blockquote>\n<p>从第2段可以知道，数字服务税怎么样？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,637,1077,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**The countries adopting the unilateral measures share the opinion that ______.**\n\n> 采取这些单方面措施的国家共同认为什么？\n\n题型：**共同观点细节题**。\n\n---","html":"<h2>38题题干</h2>\n<p><strong>The countries adopting the unilateral measures share the opinion that ______.</strong></p>\n<blockquote>\n<p>采取这些单方面措施的国家共同认为什么？</p>\n</blockquote>\n<p>题型：<strong>共同观点细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1060,1310,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**It can be learned from Paragraph 5 that the OECD’s current work ______.**\n\n> 从第5段可以知道，OECD目前的工作怎么样？\n\n题型：**段落推断题**。\n\n---","html":"<h2>39题题干</h2>\n<p><strong>It can be learned from Paragraph 5 that the OECD’s current work ______.</strong></p>\n<blockquote>\n<p>从第5段可以知道，OECD目前的工作怎么样？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1482,1128,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**Which of the following might be the best title for this text?**\n\n> 下面哪一项最适合做这篇文章的标题？\n\n题型：**最佳标题题**。\n\n---","html":"<h2>40题题干</h2>\n<p><strong>Which of the following might be the best title for this text?</strong></p>\n<blockquote>\n<p>下面哪一项最适合做这篇文章的标题？</p>\n</blockquote>\n<p>题型：<strong>最佳标题题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[253,1905,1031,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But、Instead、even if、Unless |\n| 态度词 / 评价词 | 先抓个大概好坏 | clear、costly |\n| 动作词 | 先看谁做了什么 | passed、provide、face |\n| 结果词 | 看最后出了什么事 | trade sanctions、taxes |\n| 重复主题词 | 大概知道老在说什么 | tax、digital services、countries |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>But、Instead、even if、Unless</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>clear、costly</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>passed、provide、face</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>trade sanctions、taxes</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>tax、digital services、countries</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Last Thursday, the French Senate passed a digital services tax, which would **[xxx]** an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to **[xxx]** revenue from such services. Many French politicians and media **[xxx]** have referred to this as a “GAFA tax,” meaning that it is designed to apply **[xxx]** to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Last Thursday, the French Senate passed a digital services tax, which would <strong>[xxx]</strong> an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to <strong>[xxx]</strong> revenue from such services. Many French politicians and media <strong>[xxx]</strong> have referred to this as a “GAFA tax,” meaning that it is designed to apply <strong>[xxx]</strong> to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.</p>\n</div></div>","articleRects":[[307,314,1241,43],[228,370,1320,35],[228,422,1320,35],[228,474,1320,35],[229,525,1319,36],[227,576,1322,37],[228,629,1321,36],[228,681,1291,36]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"sec 的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> The French Senate has passed a bill to ______.  \n> 法国参议院已通过一项法案，来做什么？\n\n题干直接给出 The French Senate。第1段开头就是法国参议院通过一项税的消息，回到这一段，看法案针对什么活动、什么公司。\n\n> 原文参考：\n>\n> Last Thursday, the French Senate passed a digital services tax, which would **[xxx]** an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to **[xxx]** revenue from such services. Many French politicians and media **[xxx]** have referred to this as a “GAFA tax,” meaning that it is designed to apply **[xxx]** to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\n>\n> 开始精读：\n>\n> Last Thursday, / the French Senate / passed a digital services tax, / which would **[xxx]** / an entirely new tax / on large multinationals / that provide digital services / to consumers or users in France. / Digital services include everything / from providing a platform / for selling goods and services online / to targeting advertising / based on user data, / and the tax applies to **[xxx]** revenue / from such services. / Many French politicians and media **[xxx]** / have referred to this as a “GAFA tax,” / meaning that it is designed to apply **[xxx]** / to companies such as Google, Apple, Facebook and Amazon—/ in other words, / multinational tech companies based in the United States.\n>\n> 上周四，/ 法国参议院 / 通过了一项数字服务税，/ 它将会 **[xxx]** / 一项全新的税 / 对大型跨国公司 / 它们提供数字服务 / 给消费者或用户在法国。/ 数字服务包括所有东西 / 从提供一个平台 / 用来销售商品和服务在网上 / 到定向投放广告 / 根据用户数据，/ 并且这个税适用于 **[xxx]** 收入 / 来自这些服务。/ 许多法国政界人士和媒体 **[xxx]** / 已经把这个称为一个“GAFA税”，/ 意味着它被设计去适用 **[xxx]** / 于公司比如谷歌、苹果、脸书和亚马逊——/ 换句话说，/ 跨国科技公司总部设在美国。\n\npassed 后面接的是 a digital services tax。下面的数字服务、营收和公司名单都在说明这项税的适用对象。题干空格要接法案要做的事，不能把其中一种服务当成整项法案的目的。","html":"<h2>36题</h2>\n<blockquote>\n<p>The French Senate has passed a bill to ______.<br>法国参议院已通过一项法案，来做什么？</p>\n</blockquote>\n<p>题干直接给出 The French Senate。第1段开头就是法国参议院通过一项税的消息，回到这一段，看法案针对什么活动、什么公司。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Last Thursday, the French Senate passed a digital services tax, which would <strong>[xxx]</strong> an entirely new tax on large multinationals that provide digital services to consumers or users in France. Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to <strong>[xxx]</strong> revenue from such services. Many French politicians and media <strong>[xxx]</strong> have referred to this as a “GAFA tax,” meaning that it is designed to apply <strong>[xxx]</strong> to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.</p>\n<p>开始精读：</p>\n<p>Last Thursday, / the French Senate / passed a digital services tax, / which would <strong>[xxx]</strong> / an entirely new tax / on large multinationals / that provide digital services / to consumers or users in France. / Digital services include everything / from providing a platform / for selling goods and services online / to targeting advertising / based on user data, / and the tax applies to <strong>[xxx]</strong> revenue / from such services. / Many French politicians and media <strong>[xxx]</strong> / have referred to this as a “GAFA tax,” / meaning that it is designed to apply <strong>[xxx]</strong> / to companies such as Google, Apple, Facebook and Amazon—/ in other words, / multinational tech companies based in the United States.</p>\n<p>上周四，/ 法国参议院 / 通过了一项数字服务税，/ 它将会 <strong>[xxx]</strong> / 一项全新的税 / 对大型跨国公司 / 它们提供数字服务 / 给消费者或用户在法国。/ 数字服务包括所有东西 / 从提供一个平台 / 用来销售商品和服务在网上 / 到定向投放广告 / 根据用户数据，/ 并且这个税适用于 <strong>[xxx]</strong> 收入 / 来自这些服务。/ 许多法国政界人士和媒体 <strong>[xxx]</strong> / 已经把这个称为一个“GAFA税”，/ 意味着它被设计去适用 <strong>[xxx]</strong> / 于公司比如谷歌、苹果、脸书和亚马逊——/ 换句话说，/ 跨国科技公司总部设在美国。</p>\n</blockquote>\n<p>passed 后面接的是 a digital services tax。下面的数字服务、营收和公司名单都在说明这项税的适用对象。题干空格要接法案要做的事，不能把其中一种服务当成整项法案的目的。</p>\n","articleRects":[[307,314,1241,43],[228,370,1320,35],[228,422,1320,35],[228,474,1320,35],[229,525,1319,36],[227,576,1322,37],[228,629,1321,36],[228,681,1291,36]],"questionRects":[[255,214,686,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"36"}},{"section":"36题","raw":"### A. regulate digital services platforms\n\n> 监管数字服务平台\n\n把A接回题干，它说的是：法国参议院通过法案，是为了监管数字服务平台。\n\nA的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。\n\n> Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to **[xxx]** revenue from such services.\n\n原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。\n\n**列举平台服务作为征税范围，等于制定平台运营监管规则吗？**\n\n不等于。第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。\n\n**第一轮判断：A排除。**","html":"<h3>A. regulate digital services platforms</h3>\n<blockquote>\n<p>监管数字服务平台</p>\n</blockquote>\n<p>把A接回题干，它说的是：法国参议院通过法案，是为了监管数字服务平台。</p>\n<p>A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。</p>\n<blockquote>\n<p>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to <strong>[xxx]</strong> revenue from such services.</p>\n</blockquote>\n<p>原文把 providing a platform 放在 Digital services include 后面，和定向广告一起列举数字服务，随后说税适用于这些服务的营收。A的 regulate digital services platforms 却把法案的动作改成管理平台本身。列出一种可以产生应税营收的服务，和给平台制定运营管理规则是两件事；这里平台是被列举的服务形式，征税才是法案的动作。</p>\n<p><strong>列举平台服务作为征税范围，等于制定平台运营监管规则吗？</strong></p>\n<p>不等于。第1段围绕税、服务营收和适用公司展开；平台只是范围中的一例，A把这个例子改成了法案要监管的对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[228,422,1320,35],[228,474,1320,35],[229,525,1319,36]],"questionRects":[[255,214,686,36],[315,285,594,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 regulate digital services platforms 让我们回看第1段 providing a platform 那句；两边说的是同一种数字服务平台，因此要看原文是在规定平台如何运行，还是用平台说明征税的服务范围。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"visibleSourceAnchor":"providing a platform","visibleOptionAnchor":"regulate digital services platforms"}}}},{"section":"36题","raw":"### B. impose a **[xxx]** on tech multinationals\n\n> 对科技跨国公司征收一项 **[xxx]**\n\n把B接回题干，它说的是：法国参议院通过法案，要对科技跨国公司征收一项 **[xxx]**。\n\nB的 tech multinationals 指向第1段 large multinationals，都是大型跨国企业；impose 说征收，因此回看 an entirely new tax 那句，再看末尾说明这些公司身份的话。\n\n> Last Thursday, the French Senate passed a digital services tax, which would **[xxx]** an entirely new tax on large multinationals that provide digital services to consumers or users in France.\n\n> meaning that it is designed to apply **[xxx]** to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.\n\n原文先写 an entirely new tax，接着写 on large multinationals，末尾再把谷歌等公司说明为美国的科技跨国公司。B的 tech multinationals 正好承接这些被征收的公司，impose 也与税收动作接近。B中 a 后面的 **[xxx]** 仍不认识，但它的位置是“征收一项什么”；原文已经把征收对象和一项新税接在一起，现有内容没有把公司、动作或对象换掉。\n\n**B中被征收的公司，与原文这项新税针对的公司能接上吗？**\n\n能。两边都指提供数字服务的大型科技跨国公司；尚未读懂的是所征项目的那个名词，不能把它先补成中文，但这项应当留下。\n\n**第一轮判断：B保留。**","html":"<h3>B. impose a <strong>[xxx]</strong> on tech multinationals</h3>\n<blockquote>\n<p>对科技跨国公司征收一项 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：法国参议院通过法案，要对科技跨国公司征收一项 <strong>[xxx]</strong>。</p>\n<p>B的 tech multinationals 指向第1段 large multinationals，都是大型跨国企业；impose 说征收，因此回看 an entirely new tax 那句，再看末尾说明这些公司身份的话。</p>\n<blockquote>\n<p>Last Thursday, the French Senate passed a digital services tax, which would <strong>[xxx]</strong> an entirely new tax on large multinationals that provide digital services to consumers or users in France.</p>\n</blockquote>\n<blockquote>\n<p>meaning that it is designed to apply <strong>[xxx]</strong> to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.</p>\n</blockquote>\n<p>原文先写 an entirely new tax，接着写 on large multinationals，末尾再把谷歌等公司说明为美国的科技跨国公司。B的 tech multinationals 正好承接这些被征收的公司，impose 也与税收动作接近。B中 a 后面的 <strong>[xxx]</strong> 仍不认识，但它的位置是“征收一项什么”；原文已经把征收对象和一项新税接在一起，现有内容没有把公司、动作或对象换掉。</p>\n<p><strong>B中被征收的公司，与原文这项新税针对的公司能接上吗？</strong></p>\n<p>能。两边都指提供数字服务的大型科技跨国公司；尚未读懂的是所征项目的那个名词，不能把它先补成中文，但这项应当留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[307,314,1241,43],[228,370,1320,35],[228,422,1320,35],[227,576,1322,37],[228,629,1321,36],[228,681,1291,36]],"questionRects":[[255,214,686,36],[315,355,645,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 tech multinationals 指向第1段 large multinationals，都是大型跨国企业；impose 说征收，因此回看 an entirely new tax 那句，再看末尾说明这些公司身份的话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"an entirely new tax","visibleOptionAnchor":"tech multinationals"}}}},{"section":"36题","raw":"### C. protect French companies’ interests\n\n> 保护法国公司的利益\n\n把C接回题干，它说的是：法国参议院通过法案，是为了保护法国公司的利益。\n\nC的 French companies’ interests 把法国公司放在受保护的位置；原文提法国时写的是 consumers or users in France，都是与法国相关的对象，因此回看首句具体是谁接受服务、谁被征税。\n\n> Last Thursday, the French Senate passed a digital services tax, which would **[xxx]** an entirely new tax on large multinationals that provide digital services to consumers or users in France.\n\n原文中的 consumers or users in France 是数字服务的消费者或用户，提供服务的是 large multinationals。C的 French companies’ interests 却把“法国境内的用户”换成“法国公司的利益”，又加上保护这层动作。首句建立的是服务提供者向法国用户提供服务、由此适用新税的关系；法国不是在这里标记一家需要被保护的本土企业。\n\n**首句的法国用户，可以直接换成得到法案保护的法国公司吗？**\n\n不能。消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。\n\n**第一轮判断：C排除。**","html":"<h3>C. protect French companies’ interests</h3>\n<blockquote>\n<p>保护法国公司的利益</p>\n</blockquote>\n<p>把C接回题干，它说的是：法国参议院通过法案，是为了保护法国公司的利益。</p>\n<p>C的 French companies’ interests 把法国公司放在受保护的位置；原文提法国时写的是 consumers or users in France，都是与法国相关的对象，因此回看首句具体是谁接受服务、谁被征税。</p>\n<blockquote>\n<p>Last Thursday, the French Senate passed a digital services tax, which would <strong>[xxx]</strong> an entirely new tax on large multinationals that provide digital services to consumers or users in France.</p>\n</blockquote>\n<p>原文中的 consumers or users in France 是数字服务的消费者或用户，提供服务的是 large multinationals。C的 French companies’ interests 却把“法国境内的用户”换成“法国公司的利益”，又加上保护这层动作。首句建立的是服务提供者向法国用户提供服务、由此适用新税的关系；法国不是在这里标记一家需要被保护的本土企业。</p>\n<p><strong>首句的法国用户，可以直接换成得到法案保护的法国公司吗？</strong></p>\n<p>不能。消费者或用户是接受数字服务的一方，大型跨国公司是新税针对的一方；C把接受服务的人换成公司，并把征税改成利益保护。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,314,1241,43],[228,370,1320,35],[228,422,1320,35]],"questionRects":[[255,214,686,36],[315,426,617,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 French companies’ interests 把法国公司放在受保护的位置；原文提法国时写的是 consumers or users in France，都是与法国相关的对象，因此回看首句具体是谁接受服务、谁被征税。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","object","action_direction"],"visibleSourceAnchor":"consumers or users in France","visibleOptionAnchor":"French companies’ interests"}}}},{"section":"36题","raw":"### D. curb the influence of advertising\n\n> 限制广告的影响\n\n把D接回题干，它说的是：法国参议院通过法案，是为了限制广告的影响。\n\nD的 curb the influence 把广告影响变小当成目标；第1段关于广告写的是 based on user data，讲投放方式，所以回看 targeting advertising 所在的服务列举句，确认税和广告怎样相连。\n\n> Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to **[xxx]** revenue from such services.\n\n原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。D的 curb the influence 则把对象换成广告的传播效果，要让广告更少影响用户。前者介绍一种数字服务及其收入，后者要改变广告的传播效果；based on user data 并没有把税的目标转成限制广告影响。\n\n**广告在这里是被列举的数字服务，还是法案要压低的影响力？**\n\n前者。税适用于这类服务带来的营收，而不是对广告影响力设定上限。D把服务的种类改写成整项法案的目的。\n\n**第一轮判断：D排除。**","html":"<h3>D. curb the influence of advertising</h3>\n<blockquote>\n<p>限制广告的影响</p>\n</blockquote>\n<p>把D接回题干，它说的是：法国参议院通过法案，是为了限制广告的影响。</p>\n<p>D的 curb the influence 把广告影响变小当成目标；第1段关于广告写的是 based on user data，讲投放方式，所以回看 targeting advertising 所在的服务列举句，确认税和广告怎样相连。</p>\n<blockquote>\n<p>Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to <strong>[xxx]</strong> revenue from such services.</p>\n</blockquote>\n<p>原文写 targeting advertising based on user data，表示依用户数据定向投放广告；它与网上交易平台并列，随后共同接到服务营收征税。D的 curb the influence 则把对象换成广告的传播效果，要让广告更少影响用户。前者介绍一种数字服务及其收入，后者要改变广告的传播效果；based on user data 并没有把税的目标转成限制广告影响。</p>\n<p><strong>广告在这里是被列举的数字服务，还是法案要压低的影响力？</strong></p>\n<p>前者。税适用于这类服务带来的营收，而不是对广告影响力设定上限。D把服务的种类改写成整项法案的目的。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[228,422,1320,35],[228,474,1320,35],[229,525,1319,36]],"questionRects":[[255,214,686,36],[315,496,575,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","sin trong>[xxx]</strong>，/ 随着美国贸易 <strong>[xxx]</strong> / 开始一项调查 / 关于是否这个税 <strong>[xxx]</strong> 针对美国公司，/ 这又可能导致对法国的贸易制裁。</p>\n</blockquote>\n<p>马克龙表示支持，这项税可能在几周内生效；美国方面已经开始调查，而 which in turn could lead to 接的是接下来可能出现的结果。空格要补第2段能推出的一种情况。</p>\n","articleRects":[[307,733,1240,35],[228,785,1320,36],[228,833,1319,43],[228,889,1321,35],[228,941,1320,35],[228,993,490,35]],"questionRects":[[255,637,1077,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"37"}},{"section":"37题","raw":"### A. will prompt the tech giants to quit France\n\n> 将促使科技巨头退出法国\n\n把A接回题干，它说的是：数字服务税将促使科技巨头退出法国。\n\nA的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。\n\n> But it has already sparked significant **[xxx]**, with the United States trade **[xxx]** opening an investigation into whether the tax **[xxx]** against American companies, which in turn could lead to trade sanctions against France.\n\n原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。\n\n**美国可能对法国制裁，能换成科技公司一定退出法国吗？**\n\n不能。企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。\n\n**第一轮判断：A排除。**","html":"<h3>A. will prompt the tech giants to quit France</h3>\n<blockquote>\n<p>将促使科技巨头退出法国</p>\n</blockquote>\n<p>把A接回题干，它说的是：数字服务税将促使科技巨头退出法国。</p>\n<p>A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。</p>\n<blockquote>\n<p>But it has already sparked significant <strong>[xxx]</strong>, with the United States trade <strong>[xxx]</strong> opening an investigation into whether the tax <strong>[xxx]</strong> against American companies, which in turn could lead to trade sanctions against France.</p>\n</blockquote>\n<p>原文 trade sanctions against France 接在美国贸易方面启动调查之后，说的是美国可能对法国采取贸易制裁。A的 quit France 则说科技巨头将离开法国。行动者从调查的美国一方变成公司，动作从制裁一个国家变成企业退出市场；而且原文用 could，A用 will，把可能性也写成了确定结果。</p>\n<p><strong>美国可能对法国制裁，能换成科技公司一定退出法国吗？</strong></p>\n<p>不能。企业离开市场既不是原文中的行动主体，也不是制裁法国这个动作，will 又比 could 更确定。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[228,833,1319,43],[228,889,1321,35],[228,941,1320,35],[228,993,490,35]],"questionRects":[[255,637,1077,35],[315,707,727,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 quit France 说企业离开法国；第2段涉及后续行动时写的是 trade sanctions against France，都是税之后可能出现的变化，因此回看美国调查到制裁这一句，分清采取行动的是谁。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","action_direction","degree"],"visibleSourceAnchor":"trade sanctions against France","visibleOptionAnchor":"quit France"}}}},{"section":"37题","raw":"### B. aims to ease international trade **[xxx]**\n\n> 旨在缓解国际贸易 **[xxx]**\n\n把B接回题干，它说的是：数字服务税的目标，是缓解国际贸易方面的 **[xxx]**。\n\nB的 aims to ease 指向政策的目的，第2段关于国际贸易的连接却是 could lead to trade sanctions，表示可能引出的后果；因此回看已经读过的第1段征税对象，再看第2段调查的后续结果，不能把后果写成目的。\n\n> Last Thursday, the French Senate passed a digital services tax, which would **[xxx]** an entirely new tax on large multinationals that provide digital services to consumers or users in France.\n\n> But it has already sparked significant **[xxx]**, with the United States trade **[xxx]** opening an investigation into whether the tax **[xxx]** against American companies, which in turn could lead to trade sanctions against France.\n\n第1段已把这项措施说明为针对数字服务公司的新税；第2段的 could lead to trade sa mmediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 aims to ease 指向政策的目的，第2段关于国际贸易的连接却是 could lead to trade sanctions，表示可能引出的后果；因此回看已经读过的第1段征税对象，再看第2段调查的后续结果，不能把后果写成目的。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","object"],"visibleSourceAnchor":"could lead to trade sanctions","visibleOptionAnchor":"aims to ease"}}}},{"section":"37题","raw":"### C. is apt to arouse criticism at home and abroad\n\n> 很可能在国内外引起批评\n\n把C接回题干，它说的是：数字服务税可能招来国内和国外的批评。\n\nC的 arouse criticism 与第2段 sparked significant 后面谈到的反应相近；二者都问这项税引起什么态度，所以回看马克龙表示支持以及美国启动调查的两句，分别看法国国内和美国方面。\n\n> who has expressed support for the measure\n\n> But it has already sparked significant **[xxx]**, with the United States trade **[xxx]** opening an investigation into whether the tax **[xxx]** against American companies, which in turn could lead to trade sanctions against France.\n\n原文说法国总统 expressed support，随后用 But 转到 sparked significant **[xxx]** 和美国的调查。C的 arouse criticism 同样在说税引发的负面反应，美国调查确实提示了国外的不满；但 sparked significant 后面那种反应还没有读懂，也不能仅凭总统支持就断定法国国内所有人都支持。C额外写了 at home and abroad，目前国内批评究竟如何仍不清楚，不能把这个范围直接说成已经发生，也还不能断言不可能。\n\n**总统支持这项税，是否就足以断定国内不会有人批评它？**\n\n不能。总统的态度与国内其他人的态度不是一回事；美国的调查已经表现出另一方的异议，而整体反应的那个词还不清楚，所以C暂时留下。\n\n**第一轮判断：C保留。**","html":"<h3>C. is apt to arouse criticism at home and abroad</h3>\n<blockquote>\n<p>很可能在国内外引起批评</p>\n</blockquote>\n<p>把C接回题干，它说的是：数字服务税可能招来国内和国外的批评。</p>\n<p>C的 arouse criticism 与第2段 sparked significant 后面谈到的反应相近；二者都问这项税引起什么态度，所以回看马克龙表示支持以及美国启动调查的两句，分别看法国国内和美国方面。</p>\n<blockquote>\n<p>who has expressed support for the measure</p>\n</blockquote>\n<blockquote>\n<p>But it has already sparked significant <strong>[xxx]</strong>, with the United States trade <strong>[xxx]</strong> opening an investigation into whether the tax <strong>[xxx]</strong> against American companies, which in turn could lead to trade sanctions against France.</p>\n</blockquote>\n<p>原文说法国总统 expressed support，随后用 But 转到 sparked significant <strong>[xxx]</strong> 和美国的调查。C的 arouse criticism 同样在说税引发的负面反应，美国调查确实提示了国外的不满；但 sparked significant 后面那种反应还没有读懂，也不能仅凭总统支持就断定法国国内所有人都支持。C额外写了 at home and abroad，目前国内批评究竟如何仍不清楚，不能把这个范围直接说成已经发生，也还不能断言不可能。</p>\n<p><strong>总统支持这项税，是否就足以断定国内不会有人批评它？</strong></p>\n<p>不能。总统的态度与国内其他人的态度不是一回事；美国的调查已经表现出另一方的异议，而整体反应的那个词还不清楚，所以C暂时留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[228,785,1320,36],[228,833,1319,43],[228,889,1321,35],[228,941,1320,35],[228,993,490,35]],"questionRects":[[255,637,1077,35],[315,848,783,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 arouse criticism 与第2段 sparked significant 后面谈到的反应相近；二者都问这项税引起什么态度，所以回看马克龙表示支持以及美国启动调查的两句，分别看法国国内和美国方面。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"visibleSourceAnchor":"sparked significant","visibleOptionAnchor":"arouse criticism"}}}},{"section":"37题","raw":"### D. may trigger countermeasures against France\n\n> 可能引发针对法国的应对措施\n\n把D接回题干，它说的是：数字服务税可能引来针对法国的应对措施。\n\nD的 countermeasures against France 与第2段 trade sanctions against France 都是针对法国采取行动，贸易制裁是一种具体应对，因此回看 which in turn could lead to 后面写出的后果。\n\n> But it has already sparked significant **[xxx]**, with the United States trade **[xxx]** opening an investigation into whether the tax **[xxx]** against American companies, which in turn could lead to trade sanctions against France.\n\n原文把税、美国调查和 trade sanctions against France 连成前后关系：税已引起调查，调查又可能导致对法国的制裁。D的 countermeasures against France 把具体的贸易制裁概括为应对措施；may 与 could 都只表达可能，没有说制裁已经实施。对象仍是法国，行动仍是对这项税的回应，时间和程度也都接得上。\n\n**原文的贸易制裁，可以作为D所说的针对法国的应对措施吗？**\n\n能。制裁正是一种具体应对，could 和 may 也都保留了“可能”的语气；D没有把调查可能造成的结果说成已经发生。\n\n**第一轮判断：D保留。**","html":"<h3>D. may trigger countermeasures against France</h3>\n<blockquote>\n<p>可能引发针对法国的应对措施</p>\n</blockquote>\n<p>把D接回题干，它说的是：数字服务税可能引来针对法国的应对措施。</p>\n<p>D的 countermeasures against France 与第2段 trade sanctions against France 都是针对法国采取行动，贸易制裁是一种具体应对，因此回看 which in turn could lead to 后面写出的后果。</p>\n<blockquote>\n<p>But it has already sparked significant <strong>[xxx]</strong>, with the United States trade <strong>[xxx]</strong> opening an investigation into whether the tax <strong>[xxx]</strong> against American companies, which in turn could lead to trade sanctions against France.</p>\n</blockquote>\n<p>原文把税、美国调查和 trade sanctions against France 连成前后关系：税已引起调查，调查又可能导致对法国的制裁。D的 countermeasures against France 把具体的贸易制裁概括为应对措施；may 与 could 都只表达可能，没有说制裁已经实施。对象仍是法国，行动仍是对这项税的回应，时间和程度也都接得上。</p>\n<p><strong>原文的贸易制裁，可以作为D所说的针对法国的应对措施吗？</strong></p>\n<p>能。制裁正是一种具体应对，could 和 may 也都保留了“可能”的语气；D没有把调查可能造成的结果说成已经发生。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[228,833,1319,43],[228,889,1321,35],[228,941,1320,35],[228,993,490,35]],"questionRects":[[255,637,1077,35],[315,919,757,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_ *[xxx]**, / but they are all designed / to tax multinationals / on income and revenue / that countries believe they should have a right to tax, / even if international tax rules / do not **[xxx]** them that right. / In other words, they all share a view / that the international tax system / has failed to keep up / with the current economy.\n>\n> 这些单方面的发展 / 在它们的 **[xxx]** 方面不同，/ 但它们都被设计 / 去向跨国公司征税 / 针对收入和营收 / 各国相信它们应当有权征税的，/ 即使国际税收规则 / 不 **[xxx]** 它们那项权利。/ 换句话说，它们都持有一种看法 / 国际税收体系 / 未能跟上 / 当前的经济。\n\n这一段先写各国都想对某些收入征税，再用 In other words 把共同看法说出来：国际税收体系与当前经济之间出了跟不上的问题。题干要的是国家共同的判断，不是某一家公司的经营状况。","html":"<h2>38题</h2>\n<blockquote>\n<p>The countries adopting the unilateral measures share the opinion that ______.<br>采取这些单方面措施的国家共同认为什么？</p>\n</blockquote>\n<p>题干给出 the unilateral measures，第4段以 These unilateral developments 开头，末尾又出现 they all share a view，直接回到这一段找这些国家共同相信的事。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>These unilateral developments differ in their <strong>[xxx]</strong>, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not <strong>[xxx]</strong> them that right. In other words, they all share a view that the international tax system has failed to keep up with the current economy.</p>\n<p>开始精读：</p>\n<p>These unilateral developments / differ in their <strong>[xxx]</strong>, / but they are all designed / to tax multinationals / on income and revenue / that countries believe they should have a right to tax, / even if international tax rules / do not <strong>[xxx]</strong> them that right. / In other words, they all share a view / that the international tax system / has failed to keep up / with the current economy.</p>\n<p>这些单方面的发展 / 在它们的 <strong>[xxx]</strong> 方面不同，/ 但它们都被设计 / 去向跨国公司征税 / 针对收入和营收 / 各国相信它们应当有权征税的，/ 即使国际税收规则 / 不 <strong>[xxx]</strong> 它们那项权利。/ 换句话说，它们都持有一种看法 / 国际税收体系 / 未能跟上 / 当前的经济。</p>\n</blockquote>\n<p>这一段先写各国都想对某些收入征税，再用 In other words 把共同看法说出来：国际税收体系与当前经济之间出了跟不上的问题。题干要的是国家共同的判断，不是某一家公司的经营状况。</p>\n","articleRects":[[307,1460,1240,35],[228,1512,1320,35],[229,1564,1319,35],[227,1616,1320,35],[228,1668,710,35]],"questionRects":[[255,1060,1310,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"38"}},{"section":"38题","raw":"### A. the current international tax system needs upgrading\n\n> 当前国际税收体系需要升级\n\n把A接回题干，它说的是：采取单方面措施的国家共同认为，现行国际税收体系需要更新。\n\nA的 needs upgrading 要找“旧办法跟不上新情况”这一理由；第4段正有 failed to keep up，所以回看 In other words 后面把各国共同看法说出来的那一句。\n\n> In other words, they all share a view that the international tax system has failed to keep up with the current economy.\n\n原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。A的 needs upgrading 把这种落差转成更新要求，更新的对象仍是 current international tax system。它没有改成给公司增加技术，也没有把某国单独的税当成全球已经统一的新制度，而是在说共同认为旧体系需要改。\n\n**一个未能跟上当前经济的税收体系，是否支持“需要更新”这一判断？**\n\n能。原文直接指出旧体系跟不上，A接的是对这个体系进行更新，两边谈论的对象和变化方向一致。\n\n**第一轮判断：A保留。**","html":"<h3>A. the current international tax system needs upgrading</h3>\n<blockquote>\n<p>当前国际税收体系需要升级</p>\n</blockquote>\n<p>把A接回题干，它说的是：采取单方面措施的国家共同认为，现行国际税收体系需要更新。</p>\n<p>A的 needs upgrading 要找“旧办法跟不上新情况”这一理由；第4段正有 failed to keep up，所以回看 In other words 后面把各国共同看法说出来的那一句。</p>\n<blockquote>\n<p>In other words, they all share a view that the international tax system has failed to keep up with the current economy.</p>\n</blockquote>\n<p>原文的 failed to keep up 把国际税收体系与 current economy 对比：经济已经是现在这个样子，体系却没跟上。A的 needs upgrading 把这种落差转成更新要求，更新的对象仍是 current international tax system。它没有改成给公司增加技术，也没有把某国单独的税当成全球已经统一的新制度，而是在说共同认为旧体系需要改。</p>\n<p><strong>一个未能跟上当前经济的税收体系，是否支持“需要更新”这一判断？</strong></p>\n<p>能。原文直接指出旧体系跟不上，A接的是对这个体系进行更新，两边谈论的对象和变化方向一致。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[227,1616,1320,35],[228,1668,710,35]],"questionRects":[[255,1060,1310,36],[315,1130,894,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 needs upgrading 要找“旧办法跟不上新情况”这一理由；第4段正有 failed to keep up，所以回看 In other words 后面把各国共同看法说出来的那一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"failed to keep up","visibleOptionAnchor":"needs upgrading"}}}},{"section":"38题","raw":"### B. **[xxx]** of tech giants’ revenue must be ensured\n\n> 科技巨头营收的 **[xxx]** 必须得到确保\n\n把B接回题干，它说的是：这些国家共同认为，科技巨头营收的某种 **[xxx]** 必须得到确保。\n\nB的 must be ensured 是要求确保某件事，营收又指向第4段 income and revenue；二者都围绕企业收入，所以回看各国认为自己有权征税的那句，看看想确保的究竟是收入的什么方面。\n\n> These unilateral developments differ in their **[xxx]**, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not **[xxx]** them that right.\n\n原文的 income and revenue 是各国想征税的收入对象，后面说明它们认为自己应当有征税权，即使国际规则未 **[xxx]** 它们那项权利。B的 must be ensured 也提出一种要求，但真正要确保的内容在营收前的 **[xxx]** 里。若只看“科技巨头的营收”，只能确认它与征税对象相近，还不知道B到底要求确保哪件事；这个名词决定它是否能接上各国的征税权诉求。\n\n**看清“营收必须确保某件事”，就已经知道要确保的是哪件事了吗？**\n\n不能。B的要求落在未读懂的名词上；原文确实谈企业营收和国家征税权，目前不能把B补成某种具体主张，也不能仅凭这个词不认识就排除。\n\n**第一轮判断：B保留。**","html":"<h3>B. <strong>[xxx]</strong> of tech giants’ revenue must be ensured</h3>\n<blockquote>\n<p>科技巨头营收的 <strong>[xxx]</strong> 必须得到确保</p>\n</blockquote>\n<p>把B接回题干，它说的是：这些国家共同认为，科技巨头营收的某种 <strong>[xxx]</strong> 必须得到确保。</p>\n<p>B的 must be ensured 是要求确保某件事，营收又指向第4段 income and revenue；二者都围绕企业收入，所以回看各国认为自己有权征税的那句，看看想确保的究竟是收入的什么方面。</p>\n<blockquote>\n<p>These unilateral developments differ in their <strong>[xxx]</strong>, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not <strong>[xxx]</strong> them that right.</p>\n</blockquote>\n<p>原文的 income and revenue 是各国想征税的收入对象，后面说明它们认为自己应当有征税权，即使国际规则未 <strong>[xxx]</strong> 它们那项权利。B的 must be ensured 也提出一种要求，但真正要确保的内容在营收前的 <strong>[xxx]</strong> 里。若只看“科技巨头的营收”，只能确认它与征税对象相近，还不知道B到底要求确保哪件事；这个名词决定它是否能接上各国的征税权诉求。</p>\n<p><strong>看清“营收必须确保某件事”，就已经知道要确保的是哪件事了吗？</strong></p>\n<p>不能。B的要求落在未读懂的名词上；原文确实谈企业营收和国家征税权，目前不能把B补成某种具体主张，也不能仅凭这个词不认识就排除。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[307,1460,1240,35],[228,1512,1320,35],[229,1564,1319,35],[227,1616,1320,35]],"questionRects":[[255,1060,1310,36],[315,1201,920,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 must be ensured 是要求确保某件事，营收又指向第4段 income and revenue；二者都围绕企业收入，所以回看各国认为自己有权征税的那句，看看想确保的究竟是收入的什么方面。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"income and revenue","visibleOptionAnchor":"must be ensured"}}}},{"section":"38题","raw":"### C. tech multinationals’ monopoly should be prevented\n\n> 应当阻止科技跨国公司的垄断\n\n把C接回题干，它说的是：这些国家共同认为，应当防止科技跨国公司形成垄断。\n\nC的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。\n\n> These unilateral developments differ in their **[xxx]**, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not **[xxx]** them that right.\n\n原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。C的 monopoly should be prevented 说的却是阻止公司垄断市场。二者虽然都涉及跨国企业，一个围绕国家的征税权，一个围绕公司的竞争地位；原文说税制没跟上经济，不等于把问题说明为企业垄断，也没有把措施的目标改成限制市场份额。\n\n**争取对跨国公司收入征税，等于把阻止垄断当成共同目标吗？**\n\n不等于。第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。\n\n**第一轮判断：C排除。**","html":"<h3>C. tech multinationals’ monopoly should be prevented</h3>\n<blockquote>\n<p>应当阻止科技跨国公司的垄断</p>\n</blockquote>\n<p>把C接回题干，它说的是：这些国家共同认为，应当防止科技跨国公司形成垄断。</p>\n<p>C的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。</p>\n<blockquote>\n<p>These unilateral developments differ in their <strong>[xxx]</strong>, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not <strong>[xxx]</strong> them that right.</p>\n</blockquote>\n<p>原文 to tax multinationals 后面接 income and revenue，国家争的是能否对这些收入征税。C的 monopoly should be prevented 说的却是阻止公司垄断市场。二者虽然都涉及跨国企业，一个围绕国家的征税权，一个围绕公司的竞争地位；原文说税制没跟上经济，不等于把问题说明为企业垄断，也没有把措施的目标改成限制市场份额。</p>\n<p><strong>争取对跨国公司收入征税，等于把阻止垄断当成共同目标吗？</strong></p>\n<p>不等于。第4段明确连接的是国家、营收和征税权，C把措施处理的对象换成公司的市场垄断。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,1460,1240,35],[228,1512,1320,35],[229,1564,1319,35],[227,1616,1320,35]],"questionRects":[[255,1060,1310,36],[315,1271,874,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 monopoly should be prevented 把公司的市场支配变成要处理的问题；原文的 to tax multinationals 同样涉及跨国公司，但动作是征税，因此回看第4段说明这些措施被设计来做什么的第一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"visibleSourceAnchor":"to tax multinationals","visibleOptionAnchor":"monopoly should be prevented"}}}},{"section":"38题","raw":"### D. all countries ought to enjoy equal taxing rights\n\n> 所有国家都应享有平等的征税权\n\n把D接回题干，它说的是：采取这些措施的国家共同认为，所有国家应该享有完全平等的征税权。\n\nD的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。\n\n> These unilateral developments differ in their **[xxx]**, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not **[xxx]** them that right.\n\n原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。D的 equal taxing rights 把这个要求改成所有国家彼此权利完全相同，all countries 又超过了这里采取措施的这些国家。自己认为某项收入应当由自己征税，并不等于主张每一个国家都对任何收入享有同等权利。\n\n**“我有权对这些收入征税”与“所有国家征税权完全平等”是同一主张吗？**\n\n不等于。原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。\n\n**第一轮判断：D排除。**","html":"<h3>D. all countries ought to enjoy equal taxing rights</h3>\n<blockquote>\n<p>所有国家都应享有平等的征税权</p>\n</blockquote>\n<p>把D接回题干，它说的是：采取这些措施的国家共同认为，所有国家应该享有完全平等的征税权。</p>\n<p>D的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。</p>\n<blockquote>\n<p>These unilateral developments differ in their <strong>[xxx]</strong>, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not <strong>[xxx]</strong> them that right.</p>\n</blockquote>\n<p>原文 have a right to tax 中的权利，限定在这些国家认为自己有权征税的 income and revenue 上；它讲各国对特定企业收入提出征税要求，与现行规则之间有落差。D的 equal taxing rights 把这个要求改成所有国家彼此权利完全相同，all countries 又超过了这里采取措施的这些国家。自己认为某项收入应当由自己征税，并不等于主张每一个国家都对任何收入享有同等权利。</p>\n<p><strong>“我有权对这些收入征税”与“所有国家征税权完全平等”是同一主张吗？</strong></p>\n<p>不等于。原文的权利带着特定收入对象，D换成全部国家之间的平等关系，比较对象和范围都改变了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,1460,1240,35],[228,1512,1320,35],[229,1564,1319,35],[227,1616,1320,35]],"questionRects":[[255,1060,1310,36],[315,1341,809,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 equal taxing rights 让我们回看第4段 have a right to tax，两边都提征税权，但equal需要国家之间的比较，所以看原句的right具体连着哪些收入。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","relationship_direction"],"visibleSourceAnchor":"have a right to tax","visibleOptionAnchor":"equal taxing rights"}}}},{"section":"38题","raw":"### 38题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B保留；\n- C排除；\n- D排除。\n\nA把税制跟不上经济接成需要更新；B关于营收的关键名词还不清楚；C把征税改成反垄断，D把具体收入上的征税权换成所有国家的平等权利。先留下A和B。\n\n> **38题暂时留下A和B。**","html":"<h3>38题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A把税制跟不上经济接成需要更新；B关于营收的关键名词还不清楚；C把征税改成反垄断，D把具体收入上的征税权换成所有国家的平等权利。先留下A和B。</p>\n<blockquote>\n<p><strong>38题暂时留下A和B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[255,1060,1310,36]],"scrollTarget":"auto","meta":{"kind":"result","qid":"38"}},{"section":"39题","raw":"## 39题\n\n> It can be learned from Paragraph 5 that the OECD’s current work ______.  \n> 从第5段可以知道，OECD目前的工作怎么样？\n\n题干直接限定 Paragraph 5，并给出 OECD，回到第5段读这个组织正与哪些国家合作、希望什么时候取得进展，以及法国和美国的行动带来什么变化。\n\n> 原文参考：\n>\n> In response to these many **[xxx]** measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a **[xxx]** by the end of 2020 on an international solution. Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.\n>\n> 开始精读：\n>\n> In response to these many **[xxx]** measures, / the Organization for Economic Cooperation and Development (OECD) / is currently working / with 131 countries / to reach a **[xxx]** / by the end of 2020 / on an international solution. / Both France and the United States / are involved in the organization’s work, / but France’s digital services tax and the American response / raise questions / about what the future holds / for the international tax system.\n>\n> 回应这些许多 **[xxx]** 的措施，/ 经济合作与发展组织（OECD）/ 目前正在合作 / 与131个国家 / 去达成一个 **[xxx]** / 到2020年末 / 关于一个国际解决办法。/ 法国和美国两国 / 都参与这个组织的工作，/ 但法国的数字服务税和美国的回应 / 提出了问题 / 关于未来会带来什么 / 对国际税收体系来说。\n\nOECD已经在与131个国家合作，法美两国也参与其中；转折but之后却说法国的税和美国的回应让税制未来出现疑问。空格要补的是这项正在开展的工作的情况。","html":"<h2>39题</h2>\n<blockquote>\n<p>It can be learned from Paragraph 5 that the OECD’s current work ______.<br>从第5段可以知道，OECD目前的工作怎么样？</p>\n</blockquote>\n<p>题干直接限定 Paragraph 5，并给出 OECD，回到第5段读这个组织正与哪些国家合作、希望什么时候取得进展，以及法国和美国的行动带来什么变化。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In response to these many <strong>[xxx]</strong> measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a <strong>[xxx]</strong> by the end of 2020 on an international solution. Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.</p>\n<p>开始精读：</p>\n<p>In response to these many <strong>[xxx]</strong> measures, / the Organization for Economic Cooperation and Development (OECD) / is currently working / with 131 countries / to reach a <strong>[xxx]</strong> / by the end of 2020 / on an international solution. / Both France and the United States / are involved in the organization’s work, / but France’s digital services tax and the American response / raise questions / about what the future holds / for the international tax system.</p>\n<p>回应这些许多 <strong>[xxx]</strong> 的措施，/ 经济合作与发展组织（OECD）/ 目前正在合作 / 与131个国家 / 去达成一个 <strong>[xxx]</strong> / 到2020年末 / 关于一个国际解决办法。/ 法国和美国两国 / 都参与这个组织的工作，/ 但法国的数字服务税和美国的回应 / 提出了问题 / 关于未来会带来什么 / 对国际税收体系来说。</p>\n</blockquote>\n<p>OECD已经在与131个国家合作，法美两国也参与其中；转折but之后却说法国的税和美国的回应让税制未来出现疑问。空格要补的是这项正在开展的工作的情况。</p>\n","articleRects":[[308,1720,1239,35],[228,1770,1319,37],[228,1824,1320,35],[228,1875,1319,36],[229,1927,1318,36],[228,1979,511,35]],"questionRects":[[255,1482,1128,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. is being resisted by US companies\n\n> 正遭到美国公司的抵制\n\n把A接回题干，它说的是：OECD当前的工作正被美国公司抵制。\n\nA的 resisted by US companies 把抵制者写成美国公司；第5段相近的是 the American response，所以回看法美参与合作以及美国回应的那句，分清美国一方与美国公司。\n\n> Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.\n\n原文 the American response 与法国的税并列，指美国一方对法国措施的回应；这句话前面又明确说美国参与组织的工作。A的 resisted by US companies 把回应者换成了美国企业，并把回应的对象从法国数字税换成OECD的工作。即使两者都会影响国际税制的前景，也不能把美国对法国税的反应写成美国公司抵制合作工作。\n\n**原文里的美国回应，能直接改写成美国公司抵制OECD吗？**\n\n不能。参与者、回应者和回应对象都有具体区分；A把国家层面的回应改成公司对组织工作的抵制。\n\n**第一轮判断：A排除。**","html":"<h3>A. is being resisted by US companies</h3>\n<blockquote>\n<p>正遭到美国公司的抵制</p>\n</blockquote>\n<p>把A接回题干，它说的是：OECD当前的工作正被美国公司抵制。</p>\n<p>A的 resisted by US companies 把抵制者写成美国公司；第5段相近的是 the American response，所以回看法美参与合作以及美国回应的那句，分清美国一方与美国公司。</p>\n<blockquote>\n<p>Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.</p>\n</blockquote>\n<p>原文 the American response 与法国的税并列，指美国一方对法国措施的回应；这句话前面又明确说美国参与组织的工作。A的 resisted by US companies 把回应者换成了美国企业，并把回应的对象从法国数字税换成OECD的工作。即使两者都会影响国际税制的前景，也不能把美国对法国税的反应写成美国公司抵制合作工作。</p>\n<p><strong>原文里的美国回应，能直接改写成美国公司抵制OECD吗？</strong></p>\n<p>不能。参与者、回应者和回应对象都有具体区分；A把国家层面的回应改成公司对组织工作的抵制。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[228,1824,1320,35],[228,1875,1319,36],[229,1927,1318,36],[228,1979,511,35]],"questionRects":[[255,1482,1128,36],[315,1553,608,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 resisted by US companies 把抵制者写成美国公司；第5段相近的是 the American response，所以回看法美参与合作以及美国回应的那句，分清美国一方与美国公司。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","object"],"visibleSourceAnchor":"the American response","visibleOptionAnchor":"resisted by US companies"}}}},{"section":"39题","raw":"### B. is faced with uncertain prospects\n\n> 面临不确定的前景\n\n把B接回题干，它说的是：OECD目前的工作面临不确定的前景。\n\nB的 uncertain prospects 说未来尚难确定，第5段的 raise questions about what the future holds 也在问未来会怎样，所以回看but之后法国税与美国回应带来的疑问。\n\n> Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.\n\n原文先说法美参与OECD工作，再说二者之间的税与回应会 raise questions about what the future holds。B的 uncertain prospects 正好把这种未来疑问写成前景不确定。它没有说131国合作已经失败，也没有说两国退出组织，只指出正在进行的工作面临变数；这一点保留了原文的疑问语气。\n\n**能否用“前景不确定”表达这些未来疑问，同时不把它扩大成合作必然失败？**\n\n能。B只说uncertain，与原文提出疑问的程度一致，能解释为什么参与合作之后还要接一个but。\n\n**第一轮判断：B保留。**","html":"<h3>B. is faced with uncertain prospects</h3>\n<blockquote>\n<p>面临不确定的前景</p>\n</blockquote>\n<p>把B接回题干，它说的是：OECD目前的工作面临不确定的前景。</p>\n<p>B的 uncertain prospects 说未来尚难确定，第5段的 raise questions about what the future holds 也在问未来会怎样，所以回看but之后法国税与美国回应带来的疑问。</p>\n<blockquote>\n<p>Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.</p>\n</blockquote>\n<p>原文先说法美参与OECD工作，再说二者之间的税与回应会 raise questions about what the future holds。B的 uncertain prospects 正好把这种未来疑问写成前景不确定。它没有说131国合作已经失败，也没有说两国退出组织，只指出正在进行的工作面临变数；这一点保留了原文的疑问语气。</p>\n<p><strong>能否用“前景不确定”表达这些未来疑问，同时不把它扩大成合作必然失败？</strong></p>\n<p>能。B只说uncertain，与原文提出疑问的程度一致，能解释为什么参与合作之后还要接一个but。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[228,1824,1320,35],[228,1875,1319,36],[229,1927,1318,36],[228,1979,511,35]],"questionRects":[[255,1482,1128,36],[315,1623,577,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_ques 都在说参与国数量，因此先看131国合作的介绍，再看but之后究竟把困难放在人数还是已有参与方的行动上。\n\n> is currently working with 131 countries to reach a **[xxx]** by the end of 2020 on an international solution.\n\n> Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.\n\n原文 with 131 countries 介绍现有合作规模，之后还专门说法美两国都在其中；转折出现的原因却是这些已经参与的国家各自行动，给国际税制未来带来疑问。D的 more countries 把工作需要改成扩大参与国数目。段内的难处并不是法美没有加入，而是已经加入也仍出现分歧；增加参与者与处理已有参与者之间的分歧，解决的不是同一件事。\n\n**第5段转折针对的是参与国家太少，还是已经参与的法美仍在各自行动？**\n\n后者。131国和法美参与先交代合作已有规模，后面的疑问来自行动之间的冲突，D却把需要处理的事情换成继续扩充名单。\n\n**第一轮判断：D排除。**","html":"<h3>D. needs to involve more countries</h3>\n<blockquote>\n<p>需要让更多国家参与</p>\n</blockquote>\n<p>把D接回题干，它说的是：OECD目前的工作需要增加参与国家的数量。</p>\n<p>D的 more countries 让我们回看第5段 with 131 countries，两边都在说参与国数量，因此先看131国合作的介绍，再看but之后究竟把困难放在人数还是已有参与方的行动上。</p>\n<blockquote>\n<p>is currently working with 131 countries to reach a <strong>[xxx]</strong> by the end of 2020 on an international solution.</p>\n</blockquote>\n<blockquote>\n<p>Both France and the United States are involved in the organization’s work, but France’s digital services tax and the American response raise questions about what the future holds for the international tax system.</p>\n</blockquote>\n<p>原文 with 131 countries 介绍现有合作规模，之后还专门说法美两国都在其中；转折出现的原因却是这些已经参与的国家各自行动，给国际税制未来带来疑问。D的 more countries 把工作需要改成扩大参与国数目。段内的难处并不是法美没有加入，而是已经加入也仍出现分歧；增加参与者与处理已有参与者之间的分歧，解决的不是同一件事。</p>\n<p><strong>第5段转折针对的是参与国家太少，还是已经参与的法美仍在各自行动？</strong></p>\n<p>后者。131国和法美参与先交代合作已有规模，后面的疑问来自行动之间的冲突，D却把需要处理的事情换成继续扩充名单。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[228,1770,1319,37],[228,1824,1320,35],[228,1875,1319,36],[229,1927,1318,36],[228,1979,511,35]],"questionRects":[[255,1482,1128,36],[315,1764,566,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_  / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>France Leads the Charge on Digital Tax</strong></p>\n<p>法国带头推动数字税</p>\n<p>B. <strong>France Is Confronted with Trade Sanctions</strong></p>\n<p>法国面临贸易制裁</p>\n<p>C. <strong>France Demands a Role in the Digital Economy</strong></p>\n<p>法国要求在数字经济中发挥作用</p>\n<p>D. <strong>France Says “No” to Tech Multinationals</strong></p>\n<p>法国对科技跨国公司说“不”</p>\n","articleRects":[],"questionRects":[[253,1905,1031,35]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n> 原文参考：\n>\n> The French tax is not just a **[xxx]** move by one country in need of revenue. Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an **[xxx]** soup of new international tax **[xxx]**. These have included Britain’s DPT (diverted profits tax), Australia’s MAAL (multinational anti-avoidance law), and India’s SEP (significant economic presence) test, to name but a few. At the same time, the European Union, Spain, Britain and several other countries have all seriously **[xxx]** digital services taxes.\n>\n> 开始精读：\n>\n> The French tax / is not just a **[xxx]** move / by one country in need of revenue. / Instead, the digital services tax / is part of a much larger trend, / with countries over the past few years / proposing or putting in place an **[xxx]** soup of new international tax **[xxx]**. / These have included Britain’s DPT (diverted profits tax), / Australia’s MAAL (multinational anti-avoidance law), / and India’s SEP (significant economic presence) test, / to name but a few. / At the same time, the European Union, Spain, Britain and several other countries / have all seriously **[xxx]** digital services taxes.\n>\n> 法国的税 / 不仅是一个 **[xxx]** 的行动 / 由一个需要收入的国家作出。/ 而是，数字服务税 / 是一个大得多的趋势的一部分，/ 随着各国在过去几年里 / 提出或实行一锅 **[xxx]** 汤般的新的国际税收 **[xxx]**。/ 这些已包括英国的DPT（转移利润税），/ 澳大利亚的MAAL（跨国反避税法），/ 和印度的SEP（显著经济存在）测试，/ 仅列举几项。/ 同时，欧盟、西班牙、英国和其他几个国家 / 都已认真地 **[xxx]** 数字服务税。\n\n> 原文参考：\n>\n> France’s planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and American companies will face a **[xxx]** of different taxes from dozens of nations that will prove **[xxx]** and costly.\n>\n> 开始精读：\n>\n> France’s planned tax / is a clear warning: / Unless a broad consensus / can be reached / on reforming the international tax system, / other nations are likely to follow suit, / and American companies / will face a **[xxx]** / of different taxes / from dozens of nations / that will prove **[xxx]** and costly.\n>\n> 法国计划中的税 / 是一个清楚的警告：/ 除非广泛共识 / 能够被达成 / 在改革国际税收体系方面，/ 其他国家很可能仿效，/ 并且美国公司 / 将面临一个 **[xxx]** / 不同税款的 / 来自几十个国家 / 那将被证明 **[xxx]** 而且昂贵。\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写税可能很快生效，但美国已启动调查，可能对法国制裁。 | 接着写另一方对此不满 |\n| 第3段 | 把法国措施放进多国改变国际税收做法的更大趋势。 | 再说类似变化其实还有很多 |\n| 第4段 | 说明这些国家都认为国际税制没有跟上当前经济。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 以法国税为警告：若税制改革不能形成广泛共识，多国效仿会让公司面对多种昂贵税款。 | 最后说不一起改会更麻烦 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The French tax is not just a <strong>[xxx]</strong> move by one country in need of revenue. Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting ace a <strong>[xxx]</strong> / of different taxes / from dozens of nations / that will prove <strong>[xxx]</strong> and costly.</p>\n<p>法国计划中的税 / 是一个清楚的警告：/ 除非广泛共识 / 能够被达成 / 在改革国际税收体系方面，/ 其他国家很可能仿效，/ 并且美国公司 / 将面临一个 <strong>[xxx]</strong> / 不同税款的 / 来自几十个国家 / 那将被证明 <strong>[xxx]</strong> 而且昂贵。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道法国通过数字服务税，说明征税的服务和跨国科技公司范围。</td>\n<td>先摆出一个已经发生的变化</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>写税可能很快生效，但美国已启动调查，可能对法国制裁。</td>\n<td>接着写另一方对此不满</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把法国措施放进多国改变国际税收做法的更大趋势。</td>\n<td>再说类似变化其实还有很多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明这些国家都认为国际税制没有跟上当前经济。</td>\n<td>回头解释这些做法为何一起出现</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>介绍OECD与131国合作求国际解决办法，同时法美行动使前景出现疑问。</td>\n<td>再说一起解决也遇到了阻力</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>以法国税为警告：若税制改革不能形成广泛共识，多国效仿会让公司面对多种昂贵税款。</td>\n<td>最后说不一起改会更麻烦</td>\n</tr>\n</tbody></table>\n<hr>\n","articleRects":[[307,1045,1244,35],[228,1097,1320,35],[228,1148,1323,36],[228,1199,1320,37],[228,1251,1319,37],[229,1303,1314,37],[228,1356,1320,35],[228,1408,567,36],[307,2031,1240,36],[227,2083,1321,35],[228,2135,1320,35],[228,2187,922,35]],"questionRects":[[253,1905,1031,35]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"40","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"40题","raw":"**Which of the following might be the best title for this text?**\n\n### A. France Leads the Charge on Digital Tax\n\n法国带头推动数字税\n\n#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果A是标题，法国推动数字税应当是文章的起点；它还应牵动其他国家、既有税制和国际协商。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写法国已经采取数字税行动，说明税针对谁。 | 先摆出一个已经发生的变化 |\n| 第2段 | 说明这项行动引出美国方面的反应。 | 接着写另一方对此不满 |\n| 第3段 | 说明法国不是孤立行动，数字税处于跨国税制变化中。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释各国为什么认为现有制度需要变化。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 写法国行动与国际协调工作的相互影响。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 提醒法国示范可能被更多国家跟随，协调失败会增加负担。 | 最后说不一起改会更麻烦 |\n\nA能把六段按原来的次序接起来：法国先通过税，接着出现美国反应，再进入更大的多国税收趋势，最后回到法国措施对国际合作的压力。Leads the Charge 在这里是带头推动、走到前面，并不要求文章证明法国是历史上第一个研究任何跨国税的国家。正文明确说 other nations are likely to follow suit，把法国的行动与别国可能跟进相连；税收这个对象从第一段一直延伸到结尾，也没有扩大为法国整个数字产业的发展。\n\n**“法国推动数字税”能同时解释开头的行动、各国税制趋势与末尾的效仿警告吗？**\n\n能。开头写行动本身，中间说明它属于更大趋势，末尾写可能由此发生的连锁税收变化；A保留了法国这个切入口，也保留了贯穿全文的数字税对象。\n\n**判断：A保留。**\n\n---","html":"<p><strong>Which of the following might be the best title for this text?</strong></p>\n<h3>A. France Leads the Charge on Digital Tax</h3>\n<p>法国带头推动数字税</p>\n<h4>如果 A 是主旨，文章6段应该怎么写？</h4>\n<p>如果A是标题，法国推动数字税应当是文章的起点；它还应牵动其他国家、既有税制和国际协商。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先写法国已经采取数字税行动，说明税针对谁。</td>\n<td>先摆出一个已经发生的变化</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明这项行动引出美国方面的反应。</td>\n<td>接着写另一方对此不满</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>说明法国不是孤立行动，数字税处于跨国税制变化中。</td>\n<td>再说类似变化其实还有很多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>解释各国为什么认为现有制度需要变化。</td>\n<td>回头解释这些做法为何一起出现</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>写法国行动与国际协调工作的相互影响。</td>\n<td>再说一起解决也遇到了阻力</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>提醒法国示范可能被更多国家跟随，协调失败会增加负担。</td>\n<td>最后说不一起改会更麻烦</td>\n</tr>\n</tbody></table>\n<p>A能把六段按原来的次序接起来：法国先通过税，接着出现美国反应，再进入更大的多国税收趋势，最后回到法国措施对国际合作的压力。Leads the Charge 在这里是带头推动、走到前面，并不要求文章证明法国是历史上第一个研究任何跨国税的国家。正文明确说 other nations are likely to follow suit，把法国的行动与别国可能跟进相连；税收这个对象从第一段一直延伸到结尾，也没有扩大为法国整个数字产业的发展。</p>\n<p><strong>“法国推动数字税”能同时解释开头的行动、各国税制趋势与末尾的效仿警告吗？</strong></p>\n<p>能。开头写行动本身，中间说明它属于更大趋势，末尾写可能由此发生的连锁税收变化；A保留了法国这个切入口，也保留了贯穿全文的数字税对象。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1905,1031,35],[315,1976,703,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"A"}},{"section":"40题","raw":"**Which of the following might be the best title for this text?**\n\n### B. France Is Confronted with Trade Sanctions\n\n法国面临贸易制裁\n\n#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果B是标题，文章应围绕法国受到何种贸易制裁、制裁如何发展以及法国如何应对来展开。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国遭遇贸易制裁这一变化。 | 先摆出一个已经发生的变化 |\n| 第2段 | 介绍制裁方的不满和实际措施。 | 接着写另一方对此不满 |\n| 第3段 | 把制裁放进更大的国际制裁趋势。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释多国为何共同对法国制裁。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 写协调各方以解决法国制裁问题的困难。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 提醒制裁若不能化解会带来更大代价。 | 最后说不一起改会更麻烦 |\n\n第2段确实出现trade sanctions against France，因此B与一个具体后果相连。但那里是could lead to，制裁仍只是美国调查可能造成的结果；第3、4段转入的不是多国制裁法国，而是多国各自调整跨国征税办法，第5段的合作也在寻找税制解决方案。末段costly形容美国公司将面对的各种税款，不能变成法国已经承担的制裁损失。把制裁当标题中心，会把中后四段围绕税制的展开全部改换对象。\n\n**第3至6段是在展开对法国的贸易制裁，还是在展开各国征税与国际协调的问题？**\n\n后者。贸易制裁只是法国税引出的一种可能回应；后文的多国措施、共同看法、国际合作和负担警告都落在税制变化上，B只盖住了一处后果。\n\n**判断：B排除。**\n\n---","html":"<p><strong>Which of the following might be the best title for this text?</strong></p>\n<h3>B. France Is Confronted with Trade Sanctions</h3>\n<p>法国面临贸易制裁</p>\n<h4>如果 B 是主旨，文章6段应该怎么写？</h4>\n<p>如果B是标题，文章应围绕法国受到何种贸易制裁、制裁如何发展以及法国如何应对来展开。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道法国遭遇贸易制裁这一变化。</td>\n<td>先摆出一个已经发生的变化</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍制裁方的不满和实际措施。</td>\n<td>接着写另一方对此不满</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把制裁放进更大的国际制裁趋势。</td>\n<td>再说类似变化其实还有很多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>解释多国为何共同对法国制裁。</td>\n<td>回头解释这些做法为何一起出现</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>写协调各方以解决法国制裁问题的困难。</td>\n<td>再说一起解决也遇到了阻力</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>提醒制裁若不能化解会带来更大代价。</td>\n<td>最后说不一起改会更麻烦</td>\n</tr>\n</tbody></table>\n<p>第2段确实出现trade sanctions against France，因此B与一个具体后果相连。但那里是could lead to，制裁仍只是美国调查可能造成的结果；第3、4段转入的不是多国制裁法国，而是多国各自调整跨国征税办法，第5段的合作也在寻找税制解决方案。末段costly形容美国公司将面对的各种税款，不能变成法国已经承担的制裁损失。把制裁当标题中心，会把中后四段围绕税制的展开全部改换对象。</p>\n<p><strong>第3至6段是在展开对法国的贸易制裁，还是在展开各国征税与国际协调的问题？</strong></p>\n<p>后者。贸易制裁只是法国税引出的一种可能回应；后文的多国措施、共同看法、国际合作和负担警告都落在税制变化上，B只盖住了一处后果。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1905,1031,35],[315,2046,742,27]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"B"}},{"section":"40题","raw":"**Which of the following might be the best title for this text?**\n\n### C. France Demands a Role in the Digital Economy\n\n法国要求在数字经济中发挥作用\n\n#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果C是标题，全文应说明法国要求取得什么数字经济地位，以及别国如何看待法国的这种角色要求。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道法国要求在数字经济中获得新的角色。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写其他国家对法国角色要求的反应。 | 接着写另一方对此不满 |\n| 第3段 | 把法国角色诉求放进各国争取数字产业地位的趋势。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释各国为何要求扩大数字经济影响。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 写协调各国数字产业角色遇到的困难。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 提醒角色分配不协调会造成什么后果。 | 最后说不一起改会更麻烦 |\n\nC中的Digital Economy与文章的数字服务有联系，但Demands a Role要解释的是法国想取得什么产业位置或影响。正文介绍的却是对服务营收征税、现行税制是否适应经济，以及国际规则如何协调。即使税会影响数字企业，也不能把国家有权对某些收入征税等同于要求成为数字产业的重要角色。尤其第4段的failed to keep up指税制没跟上经济，缺少的不是法国在产业中的一席之地。\n\n**各国争论“怎样对收入征税”，等于法国要求“在数字经济中占一个角色”吗？**\n\n不等于。征税权和税制改革是全文连续展开的事情，C转成法国在产业中的角色要求，既接不住各国税法，也解释不了结尾不同税款造成的负担。\n\n**判断：C排除。**\n\n---","html":"<p><strong>Which of the following might be the best title for this text?</strong></p>\n<h3>C. France Demands a Role in the Digital Economy</h3>\n<p>法国要求在数字经济中发挥作用</p>\n<h4>如果 C 是主旨，文章6段应该怎么写？</h4>\n<p>如果C是标题，全文应说明法国要求取得什么数字经济地位，以及别国如何看待法国的这种角色要求。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道法国要求在数字经济中获得新的角色。</td>\n<td>先摆出一个已经发生的变化</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>写其他国家对法国角色要求的反应。</td>\n<td>接着写另一方对此不满</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把法国角色诉求放进各国争取数字产业地位的趋势。</td>\n<td>再说类似变化其实还有很多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>解释各国为何要求扩大数字经济影响。</td>\n<td>回头解释这些做法为何一起出现</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>写协调各国数字产业角色遇到的困难。</td>\n<td>再说一起解决也遇到了阻力</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>提醒角色分配不协调会造成什么后果。</td>\n<td>最后说不一起改会更麻烦</td>\n</tr>\n</tbody></table>\n<p>C中的Digital Economy与文章的数字服务有联系，但Demands a Role要解释的是法国想取得什么产业位置或影响。正文介绍的却是对服务营收征税、现行税制是否适应经济，以及国际规则如何协调。即使税会影响数字企业，也不能把国家有权对某些收入征税等同于要求成为数字产业的重要角色。尤其第4段的failed to keep up指税制没跟上经济，缺少的不是法国在产业中的一席之地。</p>\n<p><strong>各国争论“怎样对收入征税”，等于法国要求“在数字经济中占一个角色”吗？</strong></p>\n<p>不等于。征税权和税制改革是全文连续展开的事情，C转成法国在产业中的角色要求，既接不住各国税法，也解释不了结尾不同税款造成的负担。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1905,1031,35],[315,2116,828,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"C"}},{"section":"40题","raw":"**Which of the following might be the best title for this text?**\n\n### D. France Says “No” to Tech Multinationals\n\n法国对科技跨国公司说“不”\n\n#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果D是标题，法国对科技跨国公司的态度应是整体拒绝，后文应围绕抵制这些公司的行为与后果展开。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写法国拒绝科技跨国公司。 | 先摆出一个已经发生的变化 |\n| 第2段 | 写这一拒绝引起美国不满。 | 接着写另一方对此不满 |\n| 第3段 | 把法国行动放进多国抵制科技企业的趋势。 | 再说类似变化其实还有很多 |\n| 第4段 | 解释各国共同拒绝这些企业的原因。 | 回头解释这些做法为何一起出现 |\n| 第5段 | 写国际协调抵制或接纳科技公司的困难。 | 再说一起解决也遇到了阻力 |\n| 第6段 | 警告多国继续拒绝企业会有什么代价。 | 最后说不一起改会更麻烦 |\n\n第1段点名谷歌、苹果等公司，第2段又有美国反应，D因此容易把征税读成全面拒绝公司。但全文没有要求这些企业退出法国，数字服务仍被当作面向法国用户提供的服务，只是营收涉及征税。第4段批评的是现有国际税制跟不上经济，而不是说这些公司不应存在；结尾同样警告多种税制给美国公司增加成本，主张通过改革共识处理问题，并非号召对企业一概说不。\n\n**对公司提供的数字服务征税，能扩大成法国整体拒绝这些公司吗？**\n\n不能。税收对象与拒绝对象不能混在一起；D把具体税制行动写成全面排斥企业，后面关于协调税制的内容也无法围绕这种全面拒绝成立。\n\n**判断：D排除。**\n\n---","html":"<p><strong>Which of the following might be the best title for this text?</strong></p>\n<h3>D. France Says “No” to Tech Multinationals</h3>\n<p>法国对科技跨国公司说“不”</p>\n<h4>如果 D 是主旨，文章6段应该怎么写？</h4>\n<p>如果D是标题，法国对科技跨国公司的态度应是整体拒绝，后文应围绕抵制这些公司的行为与后果展开。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先写法国拒绝科技跨国公司。</td>\n<td>先摆出一个已经发生的变化</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>写这一拒绝引起美国不满。</td>\n<td>接着写另一方对此不满</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把法国行动放进多国抵制科技企业的趋势。</td>\n<td>再说类似变化其实还有很多</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>解释各国共同拒绝这些企业的原因。</td>\n<td>回头解释这些做法为何一起出现</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>写国际协调抵制或接纳科技公司的困难。</td>\n<td>再说一起解决也遇到了阻力</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>警告多国继续拒绝企业会有什么代价。</td>\n<td>最后说不一起改会更麻烦</td>\n</tr>\n</tbody></table>\n<p>第1段点名谷歌、苹果等公司，第2段又有美国反应，D因此容易把征税读成全面拒绝公司。但全文没有要求这些企业退出法国，数字服务仍被当作面向法国用户提供的服务，只是营收涉及征税。第4段批评的是现有国际税制跟不上经济，而不是说这些公司不应存在；结尾同样警告多种税制给美国公司增加成本，主张通过改革共识处理问题，并非号召对企业一概说不。</p>\n<p><strong>对公司提供的数字服务征税，能扩大成法国整体拒绝这些公司吗？</strong></p>\n<p>不能。税收对象与拒绝对象不能混在一起；D把具体税制行动写成全面排斥企业，后面关于协调税制的内容也无法围绕这种全面拒绝成立。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1905,1031,35],[315,2185,732,37]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"D"}},{"section":"40题","raw":"### 40题结论\n\n**40. A. France Leads the Charge on Digital Tax**\n\n六段从法国数字税行动开始，再写美国反应、多国趋势、共同的税制问题和协调压力，最后提醒别国可能跟进。A能覆盖这条连续展开。\n\n这句话就是本文后续做题的主旨底牌：\n\n**France Leads the Charge on Digital Tax / 法国带头推动数字税**\n\n---","html":"<h3>40题结论</h3>\n<p><strong>40. A. France Leads the Charge on Digital Tax</strong></p>\n<p>六段从法国数字税行动开始，再写美国反应、多国趋势、共同的税制问题和协调压力，最后提醒别国可能跟进。A能覆盖这条连续展开。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>France Leads the Charge on Digital Tax / 法国带头推动数字税</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1905,1031,35]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"40"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查37题：C还是D？\n\n第一遍留下：\n\n- C. is apt to arouse criticism at home and abroad\n- D. may trigger countermeasures against France\n\n主旨底牌是：\n\n> **France Leads the Charge on Digital Tax**\n\n也就是：\n\n> 法国带头推动数字税\n\n我们先把题干和两个选项接起来。C说这项税可能在法国国内和国外引起批评；D说这项税可能引发针对法国的应对措施。第一遍没有把C排除，是因为 sparked significant 后面的反应还没有读清，法国总统支持也不能代表国内所有人的态度。D则能接上美国调查可能导致对法贸易制裁这一句，但当时我们没有把“国内还没说清”直接写成“国内不可能批评”。\n\n现在拿主旨来检查。全文中心是法国带头推动数字税。第2段接在法国通过新税之后，是把法国采取行动以后另一国可能怎样回应写出来；这个回应又与后面的国际协调问题相连。D的“针对法国的应对措施”可以承担这个连接：先有法国的税，再有美国调查，进而可能出现贸易制裁。它既回答了第2段的具体情况，也说明为什么法国的行动会牵动更大的国际税制讨论。\n\nC要同时判断国内和国外两类批评。主旨强调法国措施向外引起的连锁反应，并没有给“法国国内批评”增加一条确定联系。总统之外的人可能批评，这种可能性仍不能代替文中实际铺开的跨国反应。再回到第一遍读过的 which in turn could lead to trade sanctions against France，D的may、countermeasures和against France都各有着落。我们据此选同时得到局部因果链和全文推进方向支持的D，并不把C中尚未交代的国内态度擅自补成一致支持或一致反对。\n\n> **37题选D。**\n\n---","html":"<h2>回查37题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. is apt to arouse criticism at home and abroad</li>\n<li>D. may trigger countermeasures against France</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>France Leads the Charge on Digital Tax</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>法国带头推动数字税</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。C说这项税可能在法国国内和国外引起批评；D说这项税可能引发针对法国的应对措施。第一遍没有把C排除，是因为 sparked significant 后面的反应还没有读清，法国总统支持也不能代表国内所有人的态度。D则能接上美国调查可能导致对法贸易制裁这一句，但当时我们没有把“国内还没说清”直接写成“国内不可能批评”。</p>\n<p>现在拿主旨来检查。全文中心是法国带头推动数字税。第2段接在法国通过新税之后，是把法国采取行动以后另一国可能怎样回应写出来；这个回应又与后面的国际协调问题相连。D的“针对法国的应对措施”可以承担这个连接：先有法国的税，再有美国调查，进而可能出现贸易制裁。它既回答了第2段的具体情况，也说明为什么法国的行动会牵动更大的国际税制讨论。</p>\n<p>C要同时判断国内和国外两类批评。主旨强调法国措施向外引起的连锁反应，并没有给“法国国内批评”增加一条确定联系。总统之外的人可能批评，这种可能性仍不能代替文中实际铺开的跨国反应。再回到第一遍读过的 which in turn could lead to trade sanctions against France，D的may、countermeasures和against France都各有着落。我们据此选同时得到局部因果链和全文推进方向支持的D，并不把C中尚未交代的国内态度擅自补成一致支持或一致反对。</p>\n<blockquote>\n<p><strong>37题选D。</strong></p>\n</b
