<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| progressives | n.进步派 | diversity mandates | 多样性强制规定 | equality | n.平等 |\n| level the playing field | 创造公平条件 | insincere | adj.不真诚的 | virtue-signaling | n.道德姿态展示 |\n| privileged | adj.享特权的 | average people | 普通人 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,159,900,286],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>progressives</td>\n<td>n.进步派</td>\n<td>diversity mandates</td>\n<td>多样性强制规定</td>\n<td>equality</td>\n<td>n.平等</td>\n</tr>\n<tr>\n<td>level the playing field</td>\n<td>创造公平条件</td>\n<td>insincere</td>\n<td>adj.不真诚的</td>\n<td>virtue-signaling</td>\n<td>n.道德姿态展示</td>\n</tr>\n<tr>\n<td>privileged</td>\n<td>adj.享特权的</td>\n<td>average people</td>\n<td>普通人</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| bills | n.法案 | sponsored | v.发起 | senator | n.参议员 |\n| ensure | v.确保 | gender parity | 性别均衡 | boards | n.董事会；委员会 |\n| commissions | n.委员会 | case in point | 恰当例证 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,585,900,220],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>bills</td>\n<td>n.法案</td>\n<td>sponsored</td>\n<td>v.发起</td>\n<td>senator</td>\n<td>n.参议员< ards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</section>"},{"title":"第3段","raw":"### 意群划分 · 第3段\n\nHaddad and Lewis / are concerned that / more than half / the state-government boards / are less than 40 percent female.\n\nIn order to ensure / that elite women / have more such opportunities, / they have proposed / imposing government quotas.\n\nIf the bills become law, / state boards and commissions / will be required / to set aside / 50 percent of board seats / for women / by 2022.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,946,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false},"focusId":"focus-paragraph-3-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>Haddad and Lewis / are concerned that / more than half / the state-government boards / are less than 40 percent female.</p>\n<p>In order to ensure / that elite women / have more such opportunities, / they have proposed / imposing government quotas.</p>\n<p>If the bills become law, / state boards and commissions / will be required / to set aside / 50 percent of board seats / for women / by 2022.</p>\n</secti  last year / became the first state / to require gender quotas / for private companies.</p>\n<p>In signing the measure, / California Governor Jerry Brown / admitted that / the law, / which expressly classifies / people on the basis of sex, / is probably unconstitutional.</p>\n</section>"},{"title":"第4段","raw":"### 意群翻译 · 第4段\n\n这些法案类似于 / 最近通过的一项措施 / 在加利福尼亚州，/ 该州去年 / 成为第一个州 / 要求性别配额 / 对私营公司。\n\n在签署该措施时，/ 加州州长杰里·布朗 / 承认 / 这项法律，/ 明确地分类 / 人们基于性别，/ 可能是违宪的。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,1623,900,286],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>The bills are similar to / a measure recently adopted / in California, / which last year / became the first state / to require gender quotas / for private companies.</p>\n<p>In signing the measure, / California Governor Jerry Brown / admitted that / the law, / which expressly classifies / people on the basis of sex, / is probably unconstitutional.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段</h3>\n<p>这些法案类似于 / 最近通过的一项措施 / 在加利福尼亚州，/ 该州去年 / 成为第一个州 / 要求性别配额 / 对私营公司。</p>\n<p>在签署该措施时，/ 加州州长杰里·布朗 / 承认 / 这项法律，/ 明确地分类 / 人们基于性别，/ 可能是违宪的。</p>\n</section>"},{"title":"第4段","raw":"### 标准译文 · 第4段\n\n这些法案类似于加利福尼亚州最近通过的一项措施，该州去年成为第一个要求私营公司实行性别配额的州。在签署该措施时，加州州长杰里·布朗承认，这项明确基于性别对人进行分 section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,2049,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":3,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</section>"},{"title":"第5段","raw":"### 意群划分 · 第5段\n\nThe US Supreme Court / frowns on / sex-based classifications / unless they are designed / to address / an \"important\" policy interest.\n\nBecause the California law / applies to all boards, / even where / there is no history / of prior discrimination, / courts are likely to rule / that the law violates / the constitutional guarantee / of \"equal protection\".","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[95,2049,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</section><section class=\"revealPart\" id= s → the constitutional guarantee：(of \"equal protection\")).\n\n**第6段**\n\nBut are such government mandates → even necessary?\n\nFemale participation：(on corporate boards) → may not currently mirror → the percentage of women：(in the general population) // but so what?\n\n**第7段**\n\nThe number of women：(on corporate boards) → has been steadily increasing：(without government interference).\n\nAccording to a study：(by Catalyst) → between 2010 and 2015 → the share of women：(on the boards：(of global corporations)) → increased by 54 percent.\n\n**第8段**\n\nRequiring companies → to make gender → the primary qualification：(for board membership) → will inevitably lead to → less experienced：(private sector boards).\n\nThat is exactly → what happened：(when Norway adopted → a nationwide corporate gender quota).\n\n**第9段**\n\nWriting in The New Republic → Alice Lee notes：(that increasing the number：(of opportunities：(for board membership))：(without increasing → the pool of qualified women：(to serve on such boards)) → has led to → a \"golden skirt\" phenomenon：(where the same elite women → scoop up multiple seats：(on a variety of boards))).\n\n**第10段**\n\nNext time：(somebody pushes → corporate quotas：(as a way → to promote gender equity)) → remember：(that such policies are → largely self-serving measures：(that make their sponsors → feel good // but do little → to help average women)).","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>Progressives often support → diversity mandates：(as a path to equality + a way to level the playing field).</p>\n<p>But all too often → such policies are → an insincere form：(of virtue-signaling)：(that benefits only → the most privileged + does little → to help average people).</p>\n<p><strong>第2段</strong></p>\n<p>A pair of bills：(sponsored by：(Massachusetts state Senator Jason Lewis + House Speaker Pro (for board membership) → will inevitably lead to → less experienced：(private sector boards).</p>\n<p>That is exactly → what happened：(when Norway adopted → a nationwide corporate gender quota).</p>\n<p><strong>第9段</strong></p>\n<p>Writing in The New Republic → Alice Lee notes：(that increasing the number：(of opportunities：(for board membership))：(without increasing → the pool of qualified women：(to serve on such boards)) → has led to → a &quot;golden skirt&quot; phenomenon：(where the same elite women → scoop up multiple seats：(on a variety of boards))).</p>\n<p><strong>第10段</strong></p>\n<p>Next time：(somebody pushes → corporate quotas：(as a way → to promote gender equity)) → remember：(that such policies are → largely self-serving measures：(that make their sponsors → feel good // but do little → to help average women)).</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n进步派经常支持 → 多元化强制规定：(作为通往平等的道路 + 一种拉平竞争环境的方式)。\n\n但往往 → 这些政策是 → 一种不真诚的形式：(美德信号的)：(只惠及 → 最有特权的人 + 很少 → 帮助普通人)。\n\n**第2段**\n\n一对法案：(由...发起的：(马萨诸塞州参议员杰森·刘易斯 + 众议院临时议长帕特里夏·哈达德))：(为了确保\"性别平等\"：(在董事会和委员会)) → 提供了一个恰当的例子。\n\n**第3段**\n\n哈达德和刘易斯 → 担心：(超过一半：(州政府董事会) → 女性比例不足40%)。\n\n为了确保：(精英女性 → 有更多这样的机会) → 他们提议 → 实施政府配额。\n\n如果法案成为法律 → 州董事会和委员会 → 将被要求 → 预留：(50%的董事会席位：(给女性))：(到2022年)。\n\n**第4段**\n\n这些法案类似于 → 一项措施：(最近通过的：(在加利福尼亚州))：(该州去年 → 成为第一个州 → 要求性别配额：(对私营公司))。\n\n在签署该措施时 → 加州州长杰里·布朗 → 承认：(这项法律：(明确地分类 → 人们：(基于性别)) → 可能是违宪的)。\n\n**第5段**\n\n美国最高法院 → 不赞成 → 基于性别的分类 // 除非它们被设计 → 来解决 → 一个\"重要的\"政策利益。\n\n因为加州法律 → 适用于所有董事会：(即使在 → 没有历史：(先前歧视的地方)) → 法院很可能裁定：(该法律违反 → 宪法保障：(\"平等保护\"的))。\n\n**第6段**\n\n但这样的政府强制规定 → 真的有必要吗？\n\n女性参与：(在公司董事会) → 可能目前没有反映 → 女性的百分比：(在总人口中) // 但那又怎样？\n\n**第7段**\n\n女性的数量：(在公司董事会) → 一直在稳步增长：(没有政府干预)。\n\n根据一项研究：(由Catalyst进行的) → 在2010年到2015年之间 → 女性的份额：(在董事会：(全球公司的)) → 增长了54%。\n\n**第8段**\n\n要求公司 → 把性别作为 → 主要资格：(对于董事会成员资格) → 将不可避免地导致 → 经验较少的：(私营部门董事会)。\n\n这正是 → 发生的事情：(当挪威采用了 → 全国性的公司性别配额)。\n\n**第9段**\n\n在《新共和》撰文时 → 爱丽丝·李指出：(增加数量：(机会的：(对于董事会成员资格))：(而不增加 → 合格女性的储备池：(在这些董事会任职的)) → 已经导致了 → 一个\"金裙\"现象：(同样的精英女性 → 抢占多个席位：(在各种董事会)))。\n\n**第10段**\n\n下次：(有人推动 → 公司配额：(作为一种方式 → 促进性别平等)) → 记住：(这些政策是 → 主要是自我服务的措施：(让他们的发起人 → 感觉良好 // 但很少 → 帮助普通女性))。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>进步派经常支持 → 多元化强制规定：(作为通往平等的道路 + 一种拉平竞争环境的方式)。</p>\n<p>但往往 → 这些政策是 → 一种不真诚的形式：(美德信号的)：(只惠及 → 最有特权的人 + 很少 → 帮助普通人)。</p>\n<p><strong>第2段</strong></p>\n<p>一对法案：(由...发起的：(马萨诸塞州参议员杰森·刘易斯 + 众议院临时议长帕特里夏·哈达德))：(为了确保&quot;性别平等&quot;：(在董事会和委员会)) → 提供了一个恰当的例子。</p>\n<p><strong>第3段</strong></p>\n<p>哈达德和刘易斯 → 担心：(超过一半：(州政府董事会) → 女性比例不足40%)。</p>\n<p>为了确保：(精英女性 → 有更多这样的机会) → 他们提议 → 实施政府配额。</p>\n<p>如果法案成为法律 → 州董事会和委员会 → 将被要求 → 预留：(50%的董事会席位：(给女性))：(到2022年)。</p>\n<p><strong>第4段</strong></p>\n<p>这些法案类似于 → 一项措施：(最近通过的：(在加利福尼亚州))：(该州去年 → 成为第一个州 → 要求性别配额：(对私营公司))。</p>\n<p>在签署该措施时 → 加州州长杰里·布朗 → 承认：(这项法律：(明确地分类 → 人们：(基于性别)) → 可能是违宪的)。</p>\n<p><strong>第5段</strong></p>\n<p>美国最高法院 → 不赞成 → 基于性别的分类 // 除非它们被设计 → 来解决 → 一个&quot;重要的&quot;政策利益。</p>\n<p>因为加州法律 → 适用于所有董事会：(即使在 → 没有历史：(先前歧视的地方)) → 法院很可能裁定：(该法律违反 → 宪法保障：(&quot;平等保护&quot;的))。</p>\n<p><strong>第6段</strong></p>\n<p>但这样的政府强制规定 → 真的有必要吗？</p>\n<p>女性参与：(在公司董事会) → 可能目前没有反映 → 女性的百分比：(在总人口中) // 但那又怎样？</p>\n<p><strong>第7段</strong></p>\n<p>女性的数量：(在公司董事会) → 一直在稳步增长：(没有政府干预)。</p>\n<p>根据一项研究：(由Catalyst进行的) → 在2010年到2015年之间 → 女性的份额：(在董事会：(全球公司的)) → 增长了54%。</p>\n<p><strong>第8段</strong></p>\n<p>要求公司 → 把性别作为 → 主要资格：(对于董事会成员资格) → 将不可避免地导致 → 经验较少的：(私营部门董事会)。</p>\n<p>这正是 → 发生的事情：(当挪威采用了 → 全国性的公司性别配额)。</p>\n<p><strong>第9段</strong></p>\n<p>在《新共和》撰文时 → 爱丽丝·李指出：(增加数量：(机会的：(对于董事会成员资格))：(而不增加 → 合格女性的储备池：(在这些董事会任职的)) → 已经导致了 → 一个&quot;金裙&quot;现象：(同样的精英女性 → 抢占多个席位：(在各种董事会)))。</p>\n<p><strong>第10段</strong></p>\n<p>下次：(有人推动 → 公司配额：(作为一种方式 → 促进性别平等)) → 记住：(这些政策是 → 主要是自我服务的措施：(让他们的发起人 → 感觉良好 // 但很少 → 帮助普通女性))。</p>\n"},{"title":"长难句翻译练习（英一必修，英二选修）","raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感， "focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>把increasing ... without increasing看作主语内部的数量错配，where解释golden skirt现象。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>在《新共和》撰文时， 爱丽丝·李指出  增加数量  机会的  对于董事会成员资格  而不增加  合格女性的储备池  在这些董事会任职的  已经导致了  一个&quot;金裙&quot;现象， 同样的精英女性  抢占多个席位  在各种董事会。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>增加席位而不增加合格人选导致少数精英兼任多个职位。</p>\n</blockquote>\n<p>先说两种增长不同步，再说由此出现的席位集中。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>爱丽丝·李在《新共和》撰文指出，增加董事会成员机会的数量，而不增加合格女性的储备池，已经导致了&quot;金裙&quot;现象，即同样的精英女性在各种董事会抢占多个席位。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>qualified限定人选池；不能把该论证扩大成对所有女性能力的判断。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>爱丽丝·李在《新共和》撰文指出，增加董事会成员机会的数量，而不增加合格女性的储备池，已经导致了&quot;金裙&quot;现象，即同样的精英女性在各种董事会抢占多个席位。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据 quote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"31题 · 题干、题型与核心出处","raw":"## 31题\n\n> The author believes that the bills sponsored by Lewis and Haddad will ______.\n>\n> 作者认为，刘易斯和哈达德提出的法案将会______。\n\n### 题型\n\n法案效果推断题：以case in point把两项法案接回作者对受益范围的评价。\n\n题干直接给出Lewis和Haddad，第2段出现这两位提案人，第3段继续说明他们的担忧和法案安排。第2段说这些法案provide a case in point，要知道它们例示什么，还需回读第1段。因此先完整读第1—3段，连起作者评价、具体法案和预期作用。\n\n### 核心出处\n\n> benefits only the most privileged and does little to help average people.\n>\n> provide a case in point.\n>\n> In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"31","questionIntro":true},"html":"<blockquote>\n<p>The author believes that the bills sponsored by Lewis and Haddad will ______.</p>\n<p>作者认为，刘易斯和哈达德提出的法案将会______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>法案效果推断题：以case in point把两项法案接回作者对受益范围的评价。</p>\n<p>题干直接给出Lewis和Haddad，第2段出现这两位提案人，第3段继续说明他们的担忧和法案安排。第2段说这些法案provide a case in point，要知道它们例示什么，还需回读第1段。因此先完整读第1—3段，连起作者评价、具体法案和预期作用。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>benefits only the most privileged and does little to help average people.</p>\n<p>provide a case in point.</p>\n<p>In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.</p>\n</blockquote>\n"},{"title":"A. help little to reduce gender bias","raw":"### A. help little to reduce gender bias\n\n> 作者认为两项法案将对减少性别偏见帮助有限。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。\n\n**出处：**\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, provide a case in point.\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-31-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-A-0\"><blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section>"},{"title":"A. help little to reduce gender bias","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为两项法案将对减少性别偏见帮助有限。\n\n法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。\n\n作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。\n\nA不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-31-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-A-0\"><blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p>作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。</p>\n<p>A不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。</p>\n</section>"},{"title":"A. help little to reduce gender bias","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, provide a case in point.\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\n>\n> 进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。\n>\n> 马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。\n>\n> Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。\n\n作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The bills will help little to reduce gender bias.\n>\n> 作者认为两项法案将对减少性别偏见帮助有限。\n\nA不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-31-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-A-0\"><blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p>作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。</p>\n<p>A不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。</p>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will help little to reduce gender bias.</p>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p>A不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. pose a threat to the state government","raw":"### B. pose a threat to the state government\n\n> 作者认为两项法案将对州政府构成威胁。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。\n\n**出处：**\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, provide a case in point.\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"31","option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-31-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-B-0\"><blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section>"},{"title":"B. pose a threat to the state government","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为两项法案将对州政府构成威胁。\n\n`a threat to the state government`把影响落在州政府本身，第3段的`state-government boards`与`state boards`确实涉及州政府机构，所以回看这段具体规定机构要做什么。\n\n原文的`state-government boards`指女性占比不足40%的州政府董事会，法案要求这些机构为女性预留50%的董事会席位。`B`的`a threat to the state government`却把董事会席位分配的变化改写成对州政府的威胁。原句把州董事会放在承担席位配额义务的位置，并没有把州政府的安全或存续当成受到损害的对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-31-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-B-0\"><blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><code>a threat to the state government</code>把影响落在州政府本身，第3段的<code>state-government boards</code>与<code>state boards</code>确实涉及州政府机构，所以回看这段具体规定机构要做什么。</p>\n<p>原文的<code>state-government boards</code>指女性占比不足40%的州政府董事会，法案要求这些机构为女性预留50%的董事会席位。<code>B</code>的<code>a threat to the state government</code>却把董事会席位分配的变化改写成对州政府的威胁。原句把州董事会放在承担席位配额义务的位置，并没有把州政府的安全或存续当成受到损害的对象。</p>\n</section>"},{"title":"B. pose a threat to the state government","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, provide a case in point.\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\n>\n> 进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。\n>\n> 马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。\n>\n> Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。\n\n第三段先给现有女性比例，再介绍提案的50%席位安排，讨论一直围绕谁能获得任职机会。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The bills will pose a threat to the state government.\n>\n> 作者认为两项法案将对州政府构成威胁。\n\nB需要州政府受到损害的结果。可能违宪涉及法案的法律障碍，也不能直接转成州政府受到威胁。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-31-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-B-0\"><blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><code>a threat to the state government</code>把影响落在州政府本身，第3段的<code>state-government boards</code>与<code>state boards</code>确实涉及州政府机构，所以回看这段具体规定机构要做什么。</p>\n<p>原文的<code>state-government boards</code>指女性占比不足40%的州政府董事会，法案要求这些机构为女性预留50%的董事会席位。<code>B</code>的<code>a threat to the state government</code>却把董事会席位分配的变化改写成对州政府的威胁。原句把州董事会放在承担席位配额义务的位置，并没有把州政府的安全或存续当成受到损害的对象。</p>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>第三段先给现有女性比例，再介绍提案的50%席位安排，讨论一直围绕谁能获得任职机会。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will pose a threat to the state government.</p>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p>B需要州政府受到损害的结果。可能违宪涉及法案的法律障碍，也不能直接转成州政府受到威胁。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. raise women’s position in politics","raw":"### C. raise women’s position in politics\n\n> 作者认为两项法案将提高女性的政治地位。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n更多董事会席位可能与政治参与有关，但作者强调机会集中于精英、普通女性帮助有限，不能据此概括女性整体政治地位提高。\n\n**出处：**\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing fi -option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-31-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-D-0\"><blockquote>\n<p>作者认为两项法案将大幅拓宽职业选择。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>增加的是同一类董事会席位机会，拓宽职业选择则涉及更多职业种类或路径，greatly还要求很大的扩展程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将大幅拓宽职业选择。</p>\n</blockquote>\n<p><code>broaden career options</code>说的是可选择的职业范围，第3段的<code>more such opportunities</code>也谈机会增加，因此回看这句话中<code>such</code>所指的机会，以及末句明确写出的<code>board seats</code>。</p>\n<p>原文的<code>more such opportunities</code>指精英女性获得更多董事会任职机会，末句用<code>board seats</code>说明所增加的是这一类位置的名额。<code>D</code>的<code>greatly broaden career options</code>却说职业选择范围会大幅拓宽，把某一类席位中女性机会的增加改成可选职业种类或路径的扩展。预留董事会名额没有建立跨职业的选择扩展，更没有给出这种扩展很大的判断。</p>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>such opportunities回指前面的董事会任职，最后用board seats落实配额内容，没有转到不同职业领域。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will greatly broaden career options.</p>\n<p>作者认为两项法案将大幅拓宽职业选择。</p>\n</blockquote>\n<p>D需要多种就业路径得到显著扩展。更多同类席位不直接等于职业选择更广，也未说明普通女性因而有更多可选职业。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. A**\n\n- A：法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。\n- B：州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。\n- C：更多董事会席位可能与政治参与有关，但作者强调机会集中于精英、普通女性帮助有限，不能据此概括女性整体政治地位提高。\n- D：增加的是同一类董事会席位机会，拓宽职业选择则涉及更多职业种类或路径，greatly还要求很大的扩展程度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"31","questionConclusion":true},"html":"<blockquote>\n<p><strong>31. A</strong></p>\n</blockquote>\n<ul>\n<li>A：法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</li>\n<li>B：州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。</li>\n<li>C：更多董事会席位可能与政治参与有关，但作者强调机会集中于精英、普通女性帮助有限，不能据此概括女性整体政治地位提高。</li>\n<li>D：增加的是同一类董事会席位机会，拓宽职业选择则涉及更多职业种类或路径，greatly还要求很大的扩展程度。</li>\n</ul>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> Which of the following is true of the California measure?\n>\n> 关于加利福尼亚州的这项措施，以下哪项说法正确？\n\n### 题型\n\n细节题：分清措施内容、州长判断与法院可能的裁定，保留probably和likely。\n\n题干直接给出the California measure，第4段出现a measure recently adopted in California并交代州长的评价，第5段继续用the California law解释法院可能怎样看待它。先完整读第4、5段，把措施内容、实施对象和法律评价连在一起。\n\n### 核心出处\n\n> require gender quotas for private companies.\n>\n> California Governor Jerry Brown admitted that the law\n>\n> is probably unconstitutional.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"32","questionIntro":true},"html":"<blockquote>\n<p>Which of the following is true of the California measure?</p>\n<p>关于加利福尼亚州的这项措施，以下哪项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：分清措施内容、州长判断与法院可能的裁定，保留probably和likely。</p>\n<p>题干直接给出the California measure，第4段出现a measure recently adopted in California并交代州长的评价，第5段继续用the California law解释法院可能怎样看待它。先完整读第4、5段，把措施内容、实施对象和法律评价连在一起。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>require gender quotas for private companies.</p>\n<p>California Governor Jerry Brown admitted that the law</p>\n<p>is probably unconstitutional.</p>\n</blockquote>\n"},{"title":"A. It has irritated private business owners.","raw":"### A. It has irritated private business owners.\n\n> 加州措施已激怒私营企业主。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。\n\n**出处：**\n\n> The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-32-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section>"},{"title":"A. It has irritated private business owners.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 加州措施已激怒私营企业主。\n\n`irritated private business owners`把企业主写成产生不满的人，第4段的`require gender quotas for private companies`说明这项措施确实针对私营企业，因此回看这句要求以及随后谁表达了什么看法。\n\n原文的`require gender quotas for private companies`规定私营企业要遵守性别配额，随后表达看法的是州长杰里·布朗，他承认法律很可能违宪。`A`的`irritated private business owners`却把企业的受约束关系改成企业主已经愤怒的反应，还把表达态度的主体换成企业主。被规定要做什么与对规定有什么情绪，是两件不同的事。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-32-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><code>irritated private business owners</code>把企业主写成产生不满的人，第4段的<code>require gender quotas for private companies</code>说明这项措施确实针对私营企业，因此回看这句要求以及随后谁表达了什么看法。</p>\n<p>原文的<code>require gender quotas for private companies</code>规定私营企业要遵守性别配额，随后表达看法的是州长杰里·布朗，他承认法律很可能违宪。<code>A</code>的<code>irritated private business owners</code>却把企业的受约束关系改成企业主已经愤怒的反应，还把表达态度的主体换成企业主。被规定要做什么与对规定有什么情绪，是两件不同的事。</p>\n</section>"},{"title":"A. It has irritated private business owners.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n>\n> 这些法案类似于加州最近通过的一项措施；加州去年成为首个要求私营企业实施性别配额的州。州长Jerry Brown签署时承认，这项明确按性别划分人群的法律很可能违宪。\n>\n> 美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。\n\n介绍加州对私营企业的要求后，作者紧接Jerry Brown admitted，说明州长明知法律可能违宪仍签署。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> It has irritated private business owners.\n>\n> 加州措施已激怒私营企业主。\n\nA需要企业主表达不满的材料。企业受规定约束并不能代替他们实际态度，州长承认法律风险也不能移给企业主。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-32-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><code>irritated private business owners</code>把企业主写成产生不满的人，第4段的<code>require gender quotas for private companies</code>说明这项措施确实针对私营企业，因此回看这句要求以及随后谁表达了什么看法。</p>\n<p>原文的<code>require gender quotas for private companies</code>规定私营企业要遵守性别配额，随后表达看法的是州长杰里·布朗，他承认法律很可能违宪。<code>A</code>的<code>irritated private business owners</code>却把企业的受约束关系改成企业主已经愤怒的反应，还把表达态度的主体换成企业主。被规定要做什么与对规定有什么情绪，是两件不同的事。</p>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<p>这些法案类似于加州最近通过的一项措施；加州去年成为首个要求私营企业实施性别配额的州。州长Jerry Brown签署时承认，这项明确按性别划分人群的法律很可能违宪。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n</blockquote>\n<p>介绍加州对私营企业的要求后，作者紧接Jerry Brown admitted，说明州长明知法律可能违宪仍签署。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has irritated private business owners.</p>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p>A需要企业主表达不满的材料。企业受规定约束并不能代替他们实际态度，州长承认法律风险也不能移给企业主。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. It is welcomed by the Supreme Court.","raw":"### B. It is welcomed by the Supreme Court.\n\n> 加州措施受到最高法院欢迎。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\nfrowns on是不赞成，法院可能判其违反平等保护。B的受到最高法院欢迎，与文章所写的司法态度和预期相反。\n\n**出处：**\n\n> The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-32-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-B-0\"><blockquote>\n<p>加州措施受到最高法院欢迎。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>frowns on是不赞成，法院可能判其违反平等保护。B的受到
