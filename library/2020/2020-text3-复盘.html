性工作负担、心理压力或外部要求的材料。研究对象是女性，不足以使关于她们的任何处境都成为研究结论。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. the needlessness of government interventions</h3>\n<blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><code>needlessness of government interventions</code>与第6段的<code>are such government mandates even necessary</code>直接相接，第7段的<code>without government interference</code>又明确写没有干预的情形，因此回看这个问题及随后趋势和研究数据。</p>\n<p>原文先问这种强制规定是否必要，再指出女性董事人数在<code>without government interference</code>的情况下增加，研究进一步给出女性占比增长54%的事实。<code>D</code>的<code>needlessness of government interventions</code>概括的正是这项数据所支持的判断：既然没有政府强制配额也在增长，就没有因此要求政府介入的必要。这里的<code>interventions</code>接着文中的董事会性别配额来理解，并不扩大到政府对所有事项的干预。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>第六段问是否需要强制，第七段先作无干预仍增长的判断，再以研究数字佐证。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the needlessness of government interventions.</p>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p>D的政府干预在本题中指这些董事会性别配额。不能将它扩大为任何政府干预都无用，也不必把自然增长说成已经消除所有不平等。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>33题结论</h3>\n<blockquote>\n<p><strong>33. D</strong></p>\n</blockquote>\n<ul>\n<li>A：Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</li>\n<li>B：宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。</li>\n<li>C：global corporations是全球企业，研究测量其中女性董事占比。比例增加不等于女性承受的压力被测量或说明。</li>\n<li>D：研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。</li>\n</ul>\n<h2>34题</h2>\n<blockquote>\n<p>Norway’s adoption of a nationwide corporate gender quota has led to ______.</p>\n<p>挪威实施全国性的企业性别配额，已经导致______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>因果细节题：沿That回指挪威发生的结果，再用合格人选池解释资格与席位之间的脱节。</p>\n<p>题干明确给出Norway和nationwide corporate gender quota，第8段末句出现同样的国家与措施，并用That回指前一句的结果。第9段紧接着继续说明董事会任职机会增加后的情况，因此把第8、9段完整读完，核对配额与实际结果之间的联系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>will inevitably lead to less experienced private sector boards.</p>\n<p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n<p>where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<h3>A. the underestimation of elite women’s role</h3>\n<blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><code>the underestimation of elite women’s role</code>以精英女性受到怎样的评价为结果，第9段的<code>the same elite women</code>也谈到这一群体，因此回看她们实际获得了什么，并连着第8段的<code>less experienced private sector boards</code>核对作者所写的后果。</p>\n<p>原文先把结果写成私营部门董事会经验较少，再说明<code>the same elite women</code>在不同董事会取得多个席位。这里描述的是董事会整体经验和席位集中到谁手里。</p>\n<p><code>A</code>的<code>the underestimation of elite women’s role</code>则把结果换成他人低估精英女性的作用，是对评价过程的判断。</p>\n<p>董事会经验减少并不是说精英女性的作用被人看轻，多个席位集中于她们也没有建立这种低估关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n</blockquote>\n<p>第八段介绍性别优先造成的经验问题，第九段说明合格人选池不变却增加席位，结果集中兼任。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quota has led to the underestimation of elite women’s role.</p>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p>A需要精英作用没有获得应有认可的判断。多个席位集中在她们身上，并不能证明别人把她们的作用看低。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. the objection to female participation on boards</h3>\n<blockquote>\n<p>挪威实行全国企业性别配额导致人们反对女性参与董事会。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者批评的是把性别作为首要资格的强制安排，未说挪威因此出现反对女性参与董事会的后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致人们反对女性参与董事会。</p>\n</blockquote>\n<p>作者批评的是把性别作为首要资格的强制安排，未说挪威因此出现反对女性参与董事会的后果。</p>\n<p>批评先落到经验，再落到合格人选与席位数量的不匹配，下一段还关注普通女性能否真正受益。</p>\n<p>B需要反对女性任职这一态度的出现。不能将反对配额做法改成反对女性本身参与，二者的对象不同。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n</blockquote>\n<p>批评先落到经验，再落到合格人选与席位数量的不匹配，下一段还关注普通女性能否真正受益。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quota has led to the objection to female participation on boards.</p>\n<p>挪威实行全国企业性别配额导致人们反对女性参与董事会。</p>\n</blockquote>\n<p>B需要反对女性任职这一态度的出现。不能将反对配额做法改成反对女性本身参与，二者的对象不同。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. the entry of unqualified candidates into the board</h3>\n<blockquote>\n<p>挪威实行全国企业性别配额导致不够胜任的候选人进入董事会。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>性别成为首要资格、合格人选池未同步扩大，却增加任职机会，文中据此指出经验减少。C概括部分进入者任职条件不足这一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致不够胜任的候选人进入董事会。</p>\n</blockquote>\n<p>性别成为首要资格、合格人选池未同步扩大，却增加任职机会，文中据此指出经验减少。C概括部分进入者任职条件不足这一后果。</p>\n<p>less experienced提出问题，That明确说挪威发生了这一情况，下一段再补人选池与席位扩张脱节的原因。</p>\n<p>unqualified在这里接任职能力与经验，不能解释成所有女性都不合格，也不必补成缺某种法定证书。按作者的推理，C比其他三个无关后果贴合。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n</blockquote>\n<p>less experienced提出问题，That明确说挪威发生了这一情况，下一段再补人选池与席位扩张脱节的原因。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quota has led to the entry of unqualified candidates into the board.</p>\n<p>挪威实行全国企业性别配额导致不够胜任的候选人进入董事会。</p>\n</blockquote>\n<p>unqualified在这里接任职能力与经验，不能解释成所有女性都不合格，也不必补成缺某种法定证书。按作者的推理，C比其他三个无关后果贴合。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. the growing tension between labor and management</h3>\n<blockquote>\n<p>挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>经验较少的是董事会，多个席位集中的是精英女性，文章没有把变化连接到员工与管理层的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。</p>\n</blockquote>\n<p><code>tension between labor and management</code>要求看到劳资双方的关系变化，第8段的<code>less experienced private sector boards</code>和第9段的<code>multiple seats</code>却分别描述董事会经验与席位分配，因此回看这两处政策后果，核对涉及哪些主体。</p>\n<p>原文写配额后果时，主体是经验较少的私营部门董事会以及取得多个席位的同一批精英女性。<code>D</code>的<code>tension between labor and management</code>则把后果改成劳方与资方之间关系紧张。董事会属于企业管理结构，并不使董事会经验或女性席位变化自动成为劳资冲突；原文这两处没有建立劳方与资方彼此对抗、且对抗加剧的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n</blockquote>\n<p>挪威实例先支持经验下降，再引出同一批女性兼任多席，后果仍在董事会资格和席位分配层面。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quota has led to the growing tension between labor and management.</p>\n<p>挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。</p>\n</blockquote>\n<p>D需要劳方与管理层对立并加剧的材料。董事会属于管理结构，只能说明有管理主体，不能据此补出另一方及紧张关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>34题结论</h3>\n<blockquote>\n<p><strong>34. C</strong></p>\n</blockquote>\n<ul>\n<li>A：原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。</li>\n<li>B：作者批评的是把性别作为首要资格的强制安排，未说挪威因此出现反对女性参与董事会的后果。</li>\n<li>C：性别成为首要资格、合格人选池未同步扩大，却增加任职机会，文中据此指出经验减少。C概括部分进入者任职条件不足这一后果。</li>\n<li>D：经验较少的是董事会，多个席位集中的是精英女性，文章没有把变化连接到员工与管理层的冲突。</li>\n</ul>\n<h2>35题</h2>\n<blockquote>\n<p>Which of the following can be inferred from the text?</p>\n<p>以下哪项可以从文章中推断出来？</p>\n</blockquote>\n<h3>题型</h3>\n<p>全文推断题：综合合法性、必要性、任职条件与实际受益者，选择覆盖整条政策检验的结论。</p>\n<p>题干没有指定人物或段落，给出的范围是from the text。前面各题已经读过第1—9段，现在把第10段完整读完，再连同前面有关配额安排、女性董事变化和实际受益者的内容核对选项；本题不预先把推断限定为某一项法案或某个国家。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In order to ensure that elite women have more such opportunities</p>\n<p>set aside 50 percent of board seats for women by 2022.</p>\n<p>such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<h3>A. Women’s needs in employment should be considered.</h3>\n<blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p>全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。</p>\n<p>不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n<p>下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。</p>\n</blockquote>\n<p>全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Women’s needs in employment should be considered.</p>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p>不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Feasibility should be a prime concern in policymaking.</h3>\n<blockquote>\n<p>从文章可以推断，政策可行性应是制定政策的重要考量。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法律障碍、无干预时已有进展、合格人选不足与受益集中，都是检验政策能否达到设想的具体条件。B将其归为可行性考量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，政策可行性应是制定政策的重要考量。</p>\n</blockquote>\n<p><code>Feasibility</code>谈政策能否实际推行并实现设想，第4段的<code>is probably unconstitutional</code>涉及推行的法律障碍，第8段的<code>less experienced private sector boards</code>涉及实施后的实际结果，因此回看这两处，再联系第9段同一批女性取得多个席位的具体情形。</p>\n<p>原文一方面说配额法律<code>is probably unconstitutional</code>，另一方面指出实行性别优先的安排会使董事会经验减少，并出现同一批精英女性取得多个席位的结果。这些都是从纸面规定走到实际推行时需要面对的条件和后果。</p>\n<p><code>B</code>用<code>Feasibility</code>概括能否行得通，并说它应是<code>a prime concern</code>，即制定政策时的重要考量之一；它没有声称可行性是唯一考量，也不要求所有政策事项作严格的先后排名。</p>\n<p>作者反复检查法律能否成立、席位安排会带来什么实际结果，可以支持这种推断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n<p>下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。</p>\n</blockquote>\n<p>作者逐项检查配额措施，而不是仅凭促进平等的口号认可它；末段再比较发起者满足与普通女性所得。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Feasibility should be a prime concern in policymaking.</p>\n<p>从文章可以推断，政策可行性应是制定政策的重要考量。</p>\n</blockquote>\n<p>a prime concern说重要考量，不是唯一标准。B没有否定平等目标，只要求制定政策时检验现实条件与实施效果。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. Everyone should try hard to promote social justice.</h3>\n<blockquote>\n<p>从文章可以推断，每个人都应努力促进社会正义。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>文章批评具体政策是否达到公平目标，未向每个人提出努力促进社会正义的普遍行动要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，每个人都应努力促进社会正义。</p>\n</blockquote>\n<p><code>Everyone should try hard</code>把要求施加给所有人，第1段的<code>Progressives often support diversity mandates</code>写的是一部分人怎样支持政策，末段的<code>self-serving measures</code>则评价这类政策的结果，因此回看首尾两段，确认作者有没有把讨论扩展为所有人的行动义务。</p>\n<p>原文先交代进步派以平等和公平竞争支持多样性规定，再批评政策实际只惠及最享特权者；末段仍围绕<code>self-serving measures</code>与普通女性得到的帮助来评价政策。<code>C</code>的<code>Everyone should try hard</code>把对特定政策及其发起者的评价扩大成所有人促进社会正义的义务，又把关注点从措施实际效果换成人人努力的要求。作者讨论的是这些规定是否实现其目的，不是在向每个人发出努力行动的号召。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n<p>下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。</p>\n</blockquote>\n<p>开头转述进步派支持配额的理由，结尾仍评价配额发起者及实际受益者，中间分析政策实施的障碍与结果。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Everyone should try hard to promote social justice.</p>\n<p>从文章可以推断，每个人都应努力促进社会正义。</p>\n</blockquote>\n<p>C需要everyone为主体的行动倡议。赞成公平并不自动等于本文在号召所有人努力，不能将政策效果问题换成个人道德义务。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Major social issues should be the focus of legislation.</h3>\n<blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p>法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。</p>\n<p>D需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n</blockquote>\n<p>法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Major social issues should be the focus of legislation.</p>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p>D需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>35题结论</h3>\n<blockquote>\n<p><strong>35. B</strong></p>\n</blockquote>\n<ul>\n<li>A：关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</li>\n<li>B：法律障碍、无干预时已有进展、合格人选不足与受益集中，都是检验政策能否达到设想的具体条件。B将其归为可行性考量。</li>\n<li>C：文章批评具体政策是否达到公平目标，未向每个人提出努力促进社会正义的普遍行动要求。</li>\n<li>D：important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：总体批判观点</strong>（段落1核心论点） 进步派支持多元化强制规定（认为是通往平等的道路）// 但实际上：这些政策是不真诚的美德信号（只惠及特权阶层 + 不帮助普通人）</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次2：马萨诸塞州法案案例</strong>（段落2-3具体实例） 法案背景：刘易斯和哈达德发起法案确保性别平等 → 原因：超过一半州政府董事会女性不足40% → 解决方案：【要求到2022年预留50%席位给女性】→ 真实目的：确保精英女性有更多机会</p>\n<p>↓（类似先例）</p>\n<p><strong>逻辑层次3：加州先例及其法律问题</strong>（段落4-5法律分析） 加州案例：（第一个要求私营公司性别配额的州）→ 州长承认：（基于性别分类可能违宪）→ 法律标准：【最高法院不赞成性别分类 // 除非解决&quot;重要&quot;政策利益】→ 问题：加州法律适用所有董事会（包括无歧视历史的）→ 可能违反&quot;平等保护&quot;</p>\n<p>↓（质疑必要性）</p>\n<p><strong>逻辑层次4：政府干预的不必要性</strong>（段落6-7数据论证） 反问：政府强制真的必要吗？→ 现状：（女性董事会参与度未反映人口比例 // 但那又怎样？）→ 事实证据：【没有政府干预下女性数量稳步增长 + Catalyst研究：2010-2015年增长54%】</p>\n<p>↓（负面后果）</p>\n<p><strong>逻辑层次5：配额制度的负面影响</strong>（段落8-9实际后果） 理论后果：性别作为主要资格 → 导致董事会经验不足 → 挪威案例证明 → &quot;金裙&quot;现象：【增加机会但不增加合格人才池 → 同样的精英女性占据多个席位】</p>\n<p>↑（最终结论）</p>\n<p><strong>逻辑层次6：政策的真实本质</strong>（段落10总结） 这些政策的本质：自我服务的措施（让发起人感觉良好 // 但不帮助普通女性）</p>\n<p>全文核心观点：性别配额政策表面上促进平等，实际上是精英阶层的自我服务工具，不仅可能违宪，而且会导致能力不足和资源集中，对普通女性毫无帮助。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A policy may serve its sponsors more than ordinary women</p>\n<p>B. Testing whether intervention is necessary</p>\n<p>C. Equal opportunities already guaranteed for every person</p>\n<p>D. A proposed quota presented as an example of limited benefits</p>\n<p>E. Legal doubts about classifying people by sex</p>\n<p>F. More seats without a larger pool of qualified candidates</p>\n<p>G. A proven end to all gender discrimination</p>\n<p><strong>41.</strong></p>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people. A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point. Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p><strong>42.</strong></p>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional. The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<p><strong>43.</strong></p>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what? The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p><strong>44.</strong></p>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota. Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p><strong>45.</strong></p>\n<p>Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】D. A proposed quota presented as an example of limited benefits</p>\n<blockquote>\n<p>以受益有限为评价的配额提案例子</p>\n</blockquote>\n<p>先提出表面平等政策受益有限的批评，再介绍两项确保性别均衡的法案及席位目标。</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field.</p>\n</blockquote>\n<p>开头转述以多样性规定促进平等的目标，But随即指出真实受益范围与目标不一致。</p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female.</p>\n</blockquote>\n<p>两位提案人以女性比例不足为理由提出配额；作者用elite women说明更多机会将集中于哪类人。</p>\n<blockquote>\n<p>If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<p>50%是席位安排的具体目标，不直接证明普通女性受益扩大。标题须将法案例子接回首段的政策批评。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>平等目标与实际受益的差距 → 法案作为实例 → 预留席位主要增加精英机会</p>\n</blockquote>\n<p>presented as an example对应case in point，limited benefits对应首段对普通人帮助不大的判断。</p>\n<p>再看最强干扰项G：A proven end to all gender discrimination。</p>\n<p>这是质疑政策效果的引入，没有宣布所有歧视结束。</p>\n<p><strong>41题选D。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】E. Legal doubts about classifying people by sex</p>\n<blockquote>\n<p>按性别分类引发的法律疑问</p>\n</blockquote>\n<p>州长承认法律可能违宪，随后解释不考虑既往歧视而统一按性别分类可能违反平等保护。</p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies.</p>\n</blockquote>\n<p>similar将马萨诸塞提案接到加州已采用的配额措施，随后州长的承认引出合宪性问题。</p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest.</p>\n</blockquote>\n<p>unless给出性别分类可以被接受的特定条件，并不是法院对所有配额无条件认可。</p>\n<blockquote>\n<p>Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n<p>法律连无歧视历史的董事会也覆盖，because据此推出可能违反平等保护，标题应概括法律限制。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>类似配额措施 → 按性别分类受法律限制 → 一律适用引发违宪风险</p>\n</blockquote>\n<p>legal doubts对应probably unconstitutional与courts are likely；保留可能性而非已作最终裁决。</p>\n<p>再看最强干扰项C：Equal opportunities already guaranteed for every person。</p>\n<p>分类措施的法律争议不能概括成每个人机会已受保证。</p>\n<p><strong>42题选E。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】B. Testing whether intervention is necessary</p>\n<blockquote>\n<p>检验干预是否必要</p>\n</blockquote>\n<p>先直接问强制要求是否必要，再用无政府干预情况下女性席位增长的数据作答。</p>\n<blockquote>\n<p>But are such government mandates even necessary?</p>\n</blockquote>\n<p>But...necessary把问题从是否合法推进到是否需要强制规定，后文应回答必要性。</p>\n<blockquote>\n<p>The number of women on corporate boards has been steadily increasing without government interference.</p>\n</blockquote>\n<p>without government interference限定已有增长发生在无政府干预的情况下。</p>\n<blockquote>\n<p>According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n<p>54%的增长数据具体支持前一句趋势，用于质疑强制配额的必要性，不能改成研究证明歧视已全部消失。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>质疑强制必要性 → 无干预也增长 → 研究数据支持</p>\n</blockquote>\n<p>testing necessity对应necessary，增长数据支持作者对强制干预必要性的质疑。</p>\n<p>再看最强干扰项E：Legal doubts about classifying people by sex。</p>\n<p>这部分已由合宪性转向现实趋势，数字不是检验宪法保证。</p>\n<p><strong>43题选B。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. More seats without a larger pool of qualified candidates</p>\n<blockquote>\n<p>席位增加但合格人选池未扩大</p>\n</blockquote>\n<p>把性别作为首要资格可能减少经验，挪威案例接着说明人选池没扩大却增加席位导致少数精英兼任。</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<p>首句把性别当作首要资格与经验减少相连，讨论的是任职条件而不是反对女性任职。</p>\n<blockquote>\n<p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n</blockquote>\n<p>That回指经验减少的后果，挪威是这一政策后果的实例。</p>\n<blockquote>\n<p>Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<p>without increasing the pool解释席位与人选供给不匹配，golden skirt进一步显示同一批精英兼任，标题需保留这种脱节。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>性别优先可能削弱经验 → 挪威实例 → 席位增加而合格人选池未扩</p>\n</blockquote>\n<p>more seats与qualified pool的不同步贯通经验问题与golden skirt现象。</p>\n<p>再看最强干扰项G：A proven end to all gender discrimination。</p>\n<p>原文列出的是政策后果和受益集中，完全消除歧视没有依据。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】A. A policy may serve its sponsors more than ordinary women</p>\n<blockquote>\n<p>政策可能更服务于发起者而非普通女性</p>\n</blockquote>\n<p>结尾要求记住这类配额往往让发起者满意，却对普通女性帮助不大。</p>\n<blockquote>\n<p>Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<p>结尾将发起者feel good与普通女性获益很少对照，self-serving概括目标与实际受益的反差。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>以性别公平推动配额 → 发起者自我满足 → 普通女性获益有限</p>\n</blockquote>\n<p>serve sponsors对应self-serving与feel good，ordinary women对应average women。</p>\n<p>再看最强干扰项C：Equal opportunities already guaranteed for every person。</p>\n<p>作者恰恰质疑实际帮助，不能改写成机会已保证。</p>\n<p><strong>45题选A。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>A diversity requirement may be promoted as a path to equality without delivering equal benefits in practice. The author argues that some such measures mainly help people who are already privileged. A proposal to reserve seats on government boards provides a concrete case through which to examine that concern.</p>\n<p><strong>B.</strong></p>\n<p>A similar target for private-company boards raises an additional question about legality. Rules that classify people by sex face constitutional limits, especially when they apply regardless of a history of discrimination. A policy may therefore encounter legal barriers before its practical effects can be assessed.</p>\n<p><strong>C.</strong></p>\n<p>That gap helps explain the concern raised by the Norwegian experience. More board opportunities were created without a corresponding expansion in the pool of qualified women. Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.</p>\n<p><strong>D.</strong></p>\n<p>Under the proposal, a fixed share of board seats would be set aside for women. Supporters point to existing female representation as evidence of a problem. The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.</p>\n<p><strong>E.</strong></p>\n<p>Practical assessment must also ask whether compulsory intervention is needed. Female representation on corporate boards has already increased without such a requirement. The trend does not establish that every inequality has vanished, but it challenges the claim that a mandate is the only route to improvement.</p>\n<p><strong>F.</strong></p>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important. Reserving more seats does not automatically enlarge the pool of people prepared to fill them. Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.</p>\n<p><strong>G.</strong></p>\n<p>The concentration of positions brings the argument back to ordinary women. A measure can increase the visibility of a small elite while doing little for people outside it. Feeling satisfied with a numerical achievement is therefore different from demonstrating that a policy has broadened meaningful opportunities.</p>\n<p><strong>H.</strong></p>\n<p>The broader lesson is to examine feasibility alongside intention. Legal authority, the need for intervention, the supply of qualified candidates and the distribution of benefits all matter. Good intentions and favourable headline numbers cannot replace evidence about how a policy will work.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出政策表面目标与受益范围的差距</td>\n</tr>\n<tr>\n<td>B</td>\n<td>从配额目标转向合宪性限制</td>\n</tr>\n<tr>\n<td>C</td>\n<td>用挪威说明精英反复兼任的结果</td>\n</tr>\n<tr>\n<td>D</td>\n<td>介绍席位目标并区分数量与受益范围</td>\n</tr>\n<tr>\n<td>E</td>\n<td>以自然增长检验强制干预必要性</td>\n</tr>\n<tr>\n<td>F</td>\n<td>指出增加席位不等于扩大合格人选池</td>\n</tr>\n<tr>\n<td>G</td>\n<td>把受益集中接回普通女性的实际需要</td>\n</tr>\n<tr>\n<td>H</td>\n<td>归纳政策应同时检验合法性必要性和效果</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出政策表面目标与受益范围的差距 → 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制 → 以自然增长检验强制干预必要性 → 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要 → 归纳政策应同时检验合法性必要性和效果</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → B → E → F → C → G → H</strong></p>\n<p>41—45：D、B、F、C、G。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → D → B。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>A proposal to reserve seats on government boards provides a concrete case through which to examine that concern.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Under the proposal, a fixed share of board seats would be set aside for women.</p>\n</blockquote>\n<p>前段以reserve seats的proposal作为具体例子，当前Under the proposal直接接住该提案并介绍席位比例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Supporters point to existing female representation as evidence of a problem. The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.</p>\n</blockquote>\n<p>先说支持者看到女性代表不足，再用but区分名额增加与究竟谁受益，数量目标不能自动证明受益广泛。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>A similar target for private-company boards raises an additional question about legality.</p>\n</blockquote>\n<p>A similar target承接当前配额目标，从政府机构转到私营公司，并增加合法性这一检验。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出政策表面目标与受益范围的差距 → 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important.</p>\n</blockquote>\n<p>合格人选供给是后面的实施条件，这里还需先交代提案具体安排；否则similar target缺少明确可比较的目标。</p>\n<p><strong>41题选D。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为D → B → E。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>A similar target for private-company boards raises an additional question about legality.</p>\n</blockquote>\n<p>前段指出数字目标未说明受益范围，当前additional question表示在效果之外增加合法性检查。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Rules that classify people by sex face constitutional limits, especially when they apply regardless of a history of discrimination. A policy may therefore encounter legal barriers before its practical effects can be assessed.</p>\n</blockquote>\n<p>按性别分类有宪法限制，especially解释不分既往歧视一律适用的风险，therefore收束为法律障碍。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Practical assessment must also ask whether compulsory intervention is needed.</p>\n</blockquote>\n<p>Practical assessment...also承接法律检验，再问强制干预是否必要，形成合法性到必要性的推进。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制 → 以自然增长检验强制干预必要性</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important.</p>\n</blockquote>\n<p>适任人选供给应在必要性之后讨论实际实施；直接放它会跳过后句also所承接的法律与现实检验之间的过渡。</p>\n<p><strong>42题选B。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → F → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The trend does not establish that every inequality has vanished, but it challenges the claim that a mandate is the only route to improvement.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important.</p>\n</blockquote>\n<p>前段已用无强制也改善的趋势质疑唯一途径，Even where让步承接：即使配额改变数量，仍需合格人选。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Reserving more seats does not automatically enlarge the pool of people prepared to fill them. Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.</p>\n</blockquote>\n<p>更多席位不自动扩大适任者群体，单一资格优先由此留下数字目标与所需经验之间的缺口。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That gap helps explain the concern raised by the Norwegian experience.</p>\n</blockquote>\n<p>That gap准确回指当前a gap，挪威经历随后将抽象的人选不足落实到实例。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以自然增长检验强制干预必要性 → 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The concentration of positions brings the argument back to ordinary women.</p>\n</blockquote>\n<p>岗位集中应在挪威实例出现同一批人兼任之后才有依据，此处先解释缺口，不能提前把concentration当作已交代事实。</p>\n<p><strong>43题选F。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为F → C → G。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That gap helps explain the concern raised by the Norwegian experience.</p>\n</blockquote>\n<p>前段刚指出目标与经验需求的gap，当前That gap立即回指，并引出挪威作为例证。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>More board opportunities were created without a corresponding expansion in the pool of qualified women. Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.</p>\n</blockquote>\n<p>机会增加但合格女性群体未扩，consequently接出同一批精英累积多席，golden-skirt为这一结果命名。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The concentration of positions brings the argument back to ordinary women.</p>\n</blockquote>\n<p>The concentration of positions承接multiple positions，将后果转向普通女性是否受益。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Under the proposal, a fixed share of board seats would be set aside for women.</p>\n</blockquote>\n<p>提案预留席位在前面已介绍，这里要解释挪威经验及兼任结果，回到提案概况会使下一句的岗位集中无从承接。</p>\n<p><strong>44题选C。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为C → G → H。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The concentration of positions brings the argument back to ordinary women.</p>\n</blockquote>\n<p>前段同一批精英取得多席，当前The concentration概括该结果，brings...back再把讨论拉回普通女性。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A measure can increase the visibility of a small elite while doing little for people outside it. Feeling satisfied with a numerical achievement is therefore different from demonstrating that a policy has broadened meaningful opportunities.</p>\n</blockquote>\n<p>小群体更显眼不代表圈外人受益，therefore区分完成数字目标的满足感与机会真正扩大的证据。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The broader lesson is to examine feasibility alongside intention.</p>\n</blockquote>\n<p>The broader lesson将当前具体受益问题同前面法律、必要性、人选条件合并，收
