\n<td>largely</td>\n<td>adv.在很大程度上</td>\n</tr>\n<tr>\n<td>self-serving</td>\n<td>adj.为自身谋利的</td>\n<td>measures</td>\n<td>n.措施</td>\n<td>sponsors</td>\n<td>n.发起人</td>\n</tr>\n<tr>\n<td>feel good</td>\n<td>自我感觉良好</td>\n<td>average women</td>\n<td>普通女性</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Progressives often support / diversity mandates / as a path to equality / and a way to level / the playing field.</p>\n<p>But all too often / such policies are / an insincere form / of virtue-signaling / that benefits only / the most privileged / and does little / to help average people.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>进步派经常支持 / 多元化强制规定 / 作为通往平等的道路 / 以及一种方式来拉平 / 竞争环境。</p>\n<p>但往往 / 这些政策是 / 一种不真诚的形式 / 美德信号的 / 只惠及 / 最有特权的人 / 而很少 / 帮助普通人。</p>\n<h3>标准译文 · 第1段</h3>\n<p>进步派经常支持多元化强制规定，认为这是通往平等的道路和拉平竞争环境的方式。但这些政策往往是一种不真诚的美德信号，只惠及最有特权的人，而很少帮助普通人。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.</p>\n<h3>意群划分 · 第2段</h3>\n<p>A pair of bills / sponsored by / Massachusetts state Senator Jason Lewis / and House Speaker Pro Tempore Patricia Haddad, / to ensure &quot;gender parity&quot; / on boards and commissions, / provide a case in point.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>一对法案 / 由...发起的 / 马萨诸塞州参议员杰森·刘易斯 / 和众议院临时议长帕特里夏·哈达德，/ 为了确保&quot;性别平等&quot; / 在董事会和委员会，/ 提供了一个恰当的例子。</p>\n<h3>标准译文 · 第2段</h3>\n<p>马萨诸塞州参议员杰森·刘易斯和众议院临时议长帕特里夏·哈达德发起的一对法案，旨在确保董事会和委员会的&quot;性别平等&quot;，为此提供了一个恰当的例子。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<h3>意群划分 · 第3段</h3>\n<p>Haddad and Lewis / are concerned that / more than half / the state-government boards / are less than 40 percent female.</p>\n<p>In order to ensure / that elite women / have more such opportunities, / they have proposed / imposing government quotas.</p>\n<p>If the bills become law, / state boards and commissions / will be required / to set aside / 50 percent of board seats / for women / by 2022.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>哈达德和刘易斯 / 担心 / 超过一半 / 州政府董事会 / 女性比例不足40%。</p>\n<p>为了确保 / 精英女性 / 有更多这样的机会，/ 他们提议 / 实施政府配额。</p>\n<p>如果法案成为法律，/ 州董事会和委员会 / 将被要求 / 预留 / 50%的董事会席位 / 给女性 / 到2022年。</p>\n<h3>标准译文 · 第3段</h3>\n<p>哈达德和刘易斯担心超过一半的州政府董事会女性比例不足40%。为了确保精英女性有更多这样的机会，他们提议实施政府配额。如果法案成为法律，州董事会和委员会将被要求到2022年为女性预留50%的董事会席位。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.</p>\n<h3>意群划分 · 第4段</h3>\n<p>The bills are similar to / a measure recently adopted / in California, / which last year / became the first state / to require gender quotas / for private companies.</p>\n<p>In signing the measure, / California Governor Jerry Brown / admitted that / the law, / which expressly classifies / people on the basis of sex, / is probably unconstitutional.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>这些法案类似于 / 最近通过的一项措施 / 在加利福尼亚州，/ 该州去年 / 成为第一个州 / 要求性别配额 / 对私营公司。</p>\n<p>在签署该措施时，/ 加州州长杰里·布朗 / 承认 / 这项法律，/ 明确地分类 / 人们基于性别，/ 可能是违宪的。</p>\n<h3>标准译文 · 第4段</h3>\n<p>这些法案类似于加利福尼亚州最近通过的一项措施，该州去年成为第一个要求私营公司实行性别配额的州。在签署该措施时，加州州长杰里·布朗承认，这项明确基于性别对人进行分类的法律可能是违宪的。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<h3>意群划分 · 第5段</h3>\n<p>The US Supreme Court / frowns on / sex-based classifications / unless they are designed / to address / an &quot;important&quot; policy interest.</p>\n<p>Because the California law / applies to all boards, / even where / there is no history / of prior discrimination, / courts are likely to rule / that the law violates / the constitutional guarantee / of &quot;equal protection&quot;.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>美国最高法院 / 不赞成 / 基于性别的分类 / 除非它们被设计 / 来解决 / 一个&quot;重要的&quot;政策利益。</p>\n<p>因为加州法律 / 适用于所有董事会，/ 即使在 / 没有历史 / 先前歧视的地方，/ 法院很可能裁定 / 该法律违反 / 宪法保障 / &quot;平等保护&quot;的。</p>\n<h3>标准译文 · 第5段</h3>\n<p>美国最高法院不赞成基于性别的分类，除非它们是为了解决&quot;重要的&quot;政策利益而设计的。因为加州法律适用于所有董事会，即使在没有先前歧视历史的地方也是如此，法院很可能裁定该法律违反了&quot;平等保护&quot;的宪法保障。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?</p>\n<h3>意群划分 · 第6段</h3>\n<p>But are such government mandates / even necessary?</p>\n<p>Female participation / on corporate boards / may not currently mirror / the percentage of women / in the general population, / but so what?</p>\n<h3>意群翻译 · 第6段</h3>\n<p>但这样的政府强制规定 / 真的有必要吗？</p>\n<p>女性参与 / 在公司董事会 / 可能目前没有反映 / 女性的百分比 / 在总人口中，/ 但那又怎样？</p>\n<h3>标准译文 · 第6段</h3>\n<p>但这样的政府强制规定真的有必要吗？女性在公司董事会的参与度可能目前没有反映出女性在总人口中的比例，但那又怎样？</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<h3>意群划分 · 第7段</h3>\n<p>The number of women / on corporate boards / has been steadily increasing / without government interference.</p>\n<p>According to a study / by Catalyst, / between 2010 and 2015 / the share of women / on the boards / of global corporations / increased by 54 percent.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>女性的数量 / 在公司董事会 / 一直在稳步增长 / 没有政府干预。</p>\n<p>根据一项研究 / 由Catalyst进行的，/ 在2010年到2015年之间 / 女性的份额 / 在董事会 / 全球公司的 / 增长了54%。</p>\n<h3>标准译文 · 第7段</h3>\n<p>在没有政府干预的情况下，公司董事会中的女性数量一直在稳步增长。根据Catalyst的一项研究，2010年到2015年之间，全球公司董事会中女性的份额增长了54%。</p>\n<h2>第8段</h2>\n<h3>完整原文 · 第8段</h3>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n<h3>意群划分 · 第8段</h3>\n<p>Requiring companies / to make gender / the primary qualification / for board membership / will inevitably lead to / less experienced / private sector boards.</p>\n<p>That is exactly / what happened / when Norway adopted / a nationwide corporate gender quota.</p>\n<h3>意群翻译 · 第8段</h3>\n<p>要求公司 / 把性别作为 / 主要资格 / 对于董事会成员资格 / 将不可避免地导致 / 经验较少的 / 私营部门董事会。</p>\n<p>这正是 / 发生的事情 / 当挪威采用了 / 全国性的公司性别配额。</p>\n<h3>标准译文 · 第8段</h3>\n<p>要求公司把性别作为董事会成员资格的主要标准，将不可避免地导致私营部门董事会经验不足。这正是挪威采用全国性公司性别配额时发生的情况。</p>\n<h2>第9段</h2>\n<h3>完整原文 · 第9段</h3>\n<p>Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<h3>意群划分 · 第9段</h3>\n<p>Writing in The New Republic, / Alice Lee notes that / increasing the number / of opportunities / for board membership / without increasing / the pool of qualified women / to serve on such boards / has led to / a &quot;golden skirt&quot; phenomenon, / where the same elite women / scoop up multiple seats / on a variety of boards.</p>\n<h3>意群翻译 · 第9段</h3>\n<p>在《新共和》撰文时，/ 爱丽丝·李指出 / 增加数量 / 机会的 / 对于董事会成员资格 / 而不增加 / 合格女性的储备池 / 在这些董事会任职的 / 已经导致了 / 一个&quot;金裙&quot;现象，/ 同样的精英女性 / 抢占多个席位 / 在各种董事会。</p>\n<h3>标准译文 · 第9段</h3>\n<p>爱丽丝·李在《新共和》撰文指出，增加董事会成员机会的数量，而不增加合格女性的储备池，已经导致了&quot;金裙&quot;现象，即同样的精英女性在各种董事会抢占多个席位。</p>\n<h2>第10段</h2>\n<h3>完整原文 · 第10段</h3>\n<p>Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<h3>意群划分 · 第10段</h3>\n<p>Next time / somebody pushes / corporate quotas / as a way / to promote gender equity, / remember that / such policies are / largely self-serving measures / that make their sponsors / feel good / but do little / to help average women.</p>\n<h3>意群翻译 · 第10段</h3>\n<p>下次 / 有人推动 / 公司配额 / 作为一种方式 / 促进性别平等，/ 记住 / 这些政策是 / 主要是自我服务的措施 / 让他们的发起人 / 感觉良好 / 但很少 / 帮助普通女性。</p>\n<h3>标准译文 · 第10段</h3>\n<p>下次有人把公司配额作为促进性别平等的方式来推动时，记住这些政策主要是自我服务的措施，让发起人感觉良好，但很少帮助普通女性。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Progressives often support → diversity mandates：(as a path to equality + a way to level the playing field).</p>\n<p>But all too often → such policies are → an insincere form：(of virtue-signaling)：(that benefits only → the most privileged + does little → to help average people).</p>\n<p><strong>第2段</strong></p>\n<p>A pair of bills：(sponsored by：(Massachusetts state Senator Jason Lewis + House Speaker Pro Tempore Patricia Haddad))：(to ensure &quot;gender parity&quot;：(on boards and commissions)) → provide a case in point.</p>\n<p><strong>第3段</strong></p>\n<p>Haddad and Lewis → are concerned：(that more than half：(the state-government boards) → are less than 40 percent female).</p>\n<p>In order to ensure：(that elite women → have more such opportunities) → they have proposed → imposing government quotas.</p>\n<p>If the bills become law → state boards and commissions → will be required → to set aside：(50 percent of board seats：(for women))：(by 2022).</p>\n<p><strong>第4段</strong></p>\n<p>The bills are similar to → a measure：(recently adopted：(in California))：(which last year → became the first state → to require gender quotas：(for private companies)).</p>\n<p>In signing the measure → California Governor Jerry Brown → admitted：(that the law：(which expressly classifies → people：(on the basis of sex)) → is probably unconstitutional).</p>\n<p><strong>第5段</strong></p>\n<p>The US Supreme Court → frowns on → sex-based classifications // unless they are designed → to address → an &quot;important&quot; policy interest.</p>\n<p>Because the California law → applies to all boards：(even where → there is no history：(of prior discrimination)) → courts are likely to rule：(that the law violates → the constitutional guarantee：(of &quot;equal protection&quot;)).</p>\n<p><strong>第6段</strong></p>\n<p>But are such government mandates → even necessary?</p>\n<p>Female participation：(on corporate boards) → may not currently mirror → the percentage of women：(in the general population) // but so what?</p>\n<p><strong>第7段</strong></p>\n<p>The number of women：(on corporate boards) → has been steadily increasing：(without government interference).</p>\n<p>According to a study：(by Catalyst) → between 2010 and 2015 → the share of women：(on the boards：(of global corporations)) → increased by 54 percent.</p>\n<p><strong>第8段</strong></p>\n<p>Requiring companies → to make gender → the primary qualification：(for board membership) → will inevitably lead to → less experienced：(private sector boards).</p>\n<p>That is exactly → what happened：(when Norway adopted → a nationwide corporate gender quota).</p>\n<p><strong>第9段</strong></p>\n<p>Writing in The New Republic → Alice Lee notes：(that increasing the number：(of opportunities：(for board membership))：(without increasing → the pool of qualified women：(to serve on such boards)) → has led to → a &quot;golden skirt&quot; phenomenon：(where the same elite women → scoop up multiple seats：(on a variety of boards))).</p>\n<p><strong>第10段</strong></p>\n<p>Next time：(somebody pushes → corporate quotas：(as a way → to promote gender equity)) → remember：(that such policies are → largely self-serving measures：(that make their sponsors → feel good // but do little → to help average women)).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>进步派经常支持 → 多元化强制规定：(作为通往平等的道路 + 一种拉平竞争环境的方式)。</p>\n<p>但往往 → 这些政策是 → 一种不真诚的形式：(美德信号的)：(只惠及 → 最有特权的人 + 很少 → 帮助普通人)。</p>\n<p><strong>第2段</strong></p>\n<p>一对法案：(由...发起的：(马萨诸塞州参议员杰森·刘易斯 + 众议院临时议长帕特里夏·哈达德))：(为了确保&quot;性别平等&quot;：(在董事会和委员会)) → 提供了一个恰当的例子。</p>\n<p><strong>第3段</strong></p>\n<p>哈达德和刘易斯 → 担心：(超过一半：(州政府董事会) → 女性比例不足40%)。</p>\n<p>为了确保：(精英女性 → 有更多这样的机会) → 他们提议 → 实施政府配额。</p>\n<p>如果法案成为法律 → 州董事会和委员会 → 将被要求 → 预留：(50%的董事会席位：(给女性))：(到2022年)。</p>\n<p><strong>第4段</strong></p>\n<p>这些法案类似于 → 一项措施：(最近通过的：(在加利福尼亚州))：(该州去年 → 成为第一个州 → 要求性别配额：(对私营公司))。</p>\n<p>在签署该措施时 → 加州州长杰里·布朗 → 承认：(这项法律：(明确地分类 → 人们：(基于性别)) → 可能是违宪的)。</p>\n<p><strong>第5段</strong></p>\n<p>美国最高法院 → 不赞成 → 基于性别的分类 // 除非它们被设计 → 来解决 → 一个&quot;重要的&quot;政策利益。</p>\n<p>因为加州法律 → 适用于所有董事会：(即使在 → 没有历史：(先前歧视的地方)) → 法院很可能裁定：(该法律违反 → 宪法保障：(&quot;平等保护&quot;的))。</p>\n<p><strong>第6段</strong></p>\n<p>但这样的政府强制规定 → 真的有必要吗？</p>\n<p>女性参与：(在公司董事会) → 可能目前没有反映 → 女性的百分比：(在总人口中) // 但那又怎样？</p>\n<p><strong>第7段</strong></p>\n<p>女性的数量：(在公司董事会) → 一直在稳步增长：(没有政府干预)。</p>\n<p>根据一项研究：(由Catalyst进行的) → 在2010年到2015年之间 → 女性的份额：(在董事会：(全球公司的)) → 增长了54%。</p>\n<p><strong>第8段</strong></p>\n<p>要求公司 → 把性别作为 → 主要资格：(对于董事会成员资格) → 将不可避免地导致 → 经验较少的：(私营部门董事会)。</p>\n<p>这正是 → 发生的事情：(当挪威采用了 → 全国性的公司性别配额)。</p>\n<p><strong>第9段</strong></p>\n<p>在《新共和》撰文时 → 爱丽丝·李指出：(增加数量：(机会的：(对于董事会成员资格))：(而不增加 → 合格女性的储备池：(在这些董事会任职的)) → 已经导致了 → 一个&quot;金裙&quot;现象：(同样的精英女性 → 抢占多个席位：(在各种董事会)))。</p>\n<p><strong>第10段</strong></p>\n<p>下次：(有人推动 → 公司配额：(作为一种方式 → 促进性别平等)) → 记住：(这些政策是 → 主要是自我服务的措施：(让他们的发起人 → 感觉良好 // 但很少 → 帮助普通女性))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第3段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>If the bills become law, / state boards and commissions / will be required / to set aside / 50 percent of board seats / for women / by 2022.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>如果法案成为法律，/ 州董事会和委员会 / 将被要求 / 预留 / 50%的董事会席位 / 给女性 / 到2022年。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>If限定提案生效的条件，be required to说明后续法律要求，by标明期限。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>如果法案成为法律， 州董事会和委员会  将被要求  预留  50%的董事会席位  给女性  到2022年。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>法案若成为法律，到2022年需为女性预留一半席位。</p>\n</blockquote>\n<p>先说明条件，再说机构需做什么，最后交代比例与时间。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>如果法案成为法律，州董事会和委员会将被要求到2022年为女性预留50%的董事会席位。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>不得把假设中的will be required译成已经实施。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>如果法案成为法律，州董事会和委员会将被要求到2022年为女性预留50%的董事会席位。</p>\n</blockquote>\n<h2>2. 第5段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Because the California law / applies to all boards, / even where / there is no history / of prior discrimination, / courts are likely to rule / that the law violates / the constitutional guarantee / of &quot;equal protection&quot;.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>因为加州法律 / 适用于所有董事会，/ 即使在 / 没有历史 / 先前歧视的地方，/ 法院很可能裁定 / 该法律违反 / 宪法保障 / &quot;平等保护&quot;的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>Because说明法律适用范围过宽的原因，even where补出没有此前歧视的情形。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>因为加州法律  适用于所有董事会， 即使在  没有历史  先前歧视的地方， 法院很可能裁定  该法律违反  宪法保障  &quot;平等保护&quot;的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>法院可能认定该法违反平等保护保证。</p>\n</blockquote>\n<p>先说不问有无既往歧视都适用，再给出可能的裁决方向。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>因为加州法律适用于所有董事会，即使在没有先前歧视历史的地方也是如此，法院很可能裁定该法律违反了&quot;平等保护&quot;的宪法保障。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>likely保留预测语气，不应写成法院已经作出裁决。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>因为加州法律适用于所有董事会，即使在没有先前歧视历史的地方也是如此，法院很可能裁定该法律违反了&quot;平等保护&quot;的宪法保障。</p>\n</blockquote>\n<h2>3. 第9段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Writing in The New Republic, / Alice Lee notes that / increasing the number / of opportunities / for board membership / without increasing / the pool of qualified women / to serve on such boards / has led to / a &quot;golden skirt&quot; phenomenon, / where the same elite women / scoop up multiple seats / on a variety of boards.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在《新共和》撰文时，/ 爱丽丝·李指出 / 增加数量 / 机会的 / 对于董事会成员资格 / 而不增加 / 合格女性的储备池 / 在这些董事会任职的 / 已经导致了 / 一个&quot;金裙&quot;现象，/ 同样的精英女性 / 抢占多个席位 / 在各种董事会。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把increasing ... without increasing看作主语内部的数量错配，where解释golden skirt现象。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>在《新共和》撰文时， 爱丽丝·李指出  增加数量  机会的  对于董事会成员资格  而不增加  合格女性的储备池  在这些董事会任职的  已经导致了  一个&quot;金裙&quot;现象， 同样的精英女性  抢占多个席位  在各种董事会。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>增加席位而不增加合格人选导致少数精英兼任多个职位。</p>\n</blockquote>\n<p>先说两种增长不同步，再说由此出现的席位集中。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>爱丽丝·李在《新共和》撰文指出，增加董事会成员机会的数量，而不增加合格女性的储备池，已经导致了&quot;金裙&quot;现象，即同样的精英女性在各种董事会抢占多个席位。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>qualified限定人选池；不能把该论证扩大成对所有女性能力的判断。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>爱丽丝·李在《新共和》撰文指出，增加董事会成员机会的数量，而不增加合格女性的储备池，已经导致了&quot;金裙&quot;现象，即同样的精英女性在各种董事会抢占多个席位。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>31题</h2>\n<blockquote>\n<p>The author believes that the bills sponsored by Lewis and Haddad will ______.</p>\n<p>作者认为，刘易斯和哈达德提出的法案将会______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>法案效果推断题：以case in point把两项法案接回作者对受益范围的评价。</p>\n<p>题干直接给出Lewis和Haddad，第2段出现这两位提案人，第3段继续说明他们的担忧和法案安排。第2段说这些法案provide a case in point，要知道它们例示什么，还需回读第1段。因此先完整读第1—3段，连起作者评价、具体法案和预期作用。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>benefits only the most privileged and does little to help average people.</p>\n<p>provide a case in point.</p>\n<p>In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.</p>\n</blockquote>\n<h3>A. help little to reduce gender bias</h3>\n<blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p>法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</p>\n<p>作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。</p>\n<p>A不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>作者先比较平等目标与特权群体受益，再用case in point引出法案，末段又回到普通女性帮助有限。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will help little to reduce gender bias.</p>\n<p>作者认为两项法案将对减少性别偏见帮助有限。</p>\n</blockquote>\n<p>A不是逐字复述席位数量，而是沿着目标与实际受益范围作推断。help little保留有限作用，并没有夸成任何性别偏见都无法改变。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. pose a threat to the state government</h3>\n<blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p><code>a threat to the state government</code>把影响落在州政府本身，第3段的<code>state-government boards</code>与<code>state boards</code>确实涉及州政府机构，所以回看这段具体规定机构要做什么。</p>\n<p>原文的<code>state-government boards</code>指女性占比不足40%的州政府董事会，法案要求这些机构为女性预留50%的董事会席位。<code>B</code>的<code>a threat to the state government</code>却把董事会席位分配的变化改写成对州政府的威胁。原句把州董事会放在承担席位配额义务的位置，并没有把州政府的安全或存续当成受到损害的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>第三段先给现有女性比例，再介绍提案的50%席位安排，讨论一直围绕谁能获得任职机会。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will pose a threat to the state government.</p>\n<p>作者认为两项法案将对州政府构成威胁。</p>\n</blockquote>\n<p>B需要州政府受到损害的结果。可能违宪涉及法案的法律障碍，也不能直接转成州政府受到威胁。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. raise women’s position in politics</h3>\n<blockquote>\n<p>作者认为两项法案将提高女性的政治地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>更多董事会席位可能与政治参与有关，但作者强调机会集中于精英、普通女性帮助有限，不能据此概括女性整体政治地位提高。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将提高女性的政治地位。</p>\n</blockquote>\n<p>更多董事会席位可能与政治参与有关，但作者强调机会集中于精英、普通女性帮助有限，不能据此概括女性整体政治地位提高。</p>\n<p>作者没有从预留席位推到政治权力提升，而是把精英机会增多放进只惠及特权者的批评之中。</p>\n<p>C需要说明这些机会怎样提高女性政治地位。不能仅凭state-government便将某类任职名额扩大为一般政治地位的改善，也不能略去受益范围的限制。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>作者没有从预留席位推到政治权力提升，而是把精英机会增多放进只惠及特权者的批评之中。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will raise women’s position in politics.</p>\n<p>作者认为两项法案将提高女性的政治地位。</p>\n</blockquote>\n<p>C需要说明这些机会怎样提高女性政治地位。不能仅凭state-government便将某类任职名额扩大为一般政治地位的改善，也不能略去受益范围的限制。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. greatly broaden career options</h3>\n<blockquote>\n<p>作者认为两项法案将大幅拓宽职业选择。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>增加的是同一类董事会席位机会，拓宽职业选择则涉及更多职业种类或路径，greatly还要求很大的扩展程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为两项法案将大幅拓宽职业选择。</p>\n</blockquote>\n<p><code>broaden career options</code>说的是可选择的职业范围，第3段的<code>more such opportunities</code>也谈机会增加，因此回看这句话中<code>such</code>所指的机会，以及末句明确写出的<code>board seats</code>。</p>\n<p>原文的<code>more such opportunities</code>指精英女性获得更多董事会任职机会，末句用<code>board seats</code>说明所增加的是这一类位置的名额。<code>D</code>的<code>greatly broaden career options</code>却说职业选择范围会大幅拓宽，把某一类席位中女性机会的增加改成可选职业种类或路径的扩展。预留董事会名额没有建立跨职业的选择扩展，更没有给出这种扩展很大的判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nA pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point.\nHaddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>马萨诸塞州参议员Jason Lewis和众议院临时议长Patricia Haddad提出的两项法案，旨在确保董事会及委员会的性别均衡，正好提供了一个实例。</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n</blockquote>\n<p>such opportunities回指前面的董事会任职，最后用board seats落实配额内容，没有转到不同职业领域。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bills will greatly broaden career options.</p>\n<p>作者认为两项法案将大幅拓宽职业选择。</p>\n</blockquote>\n<p>D需要多种就业路径得到显著扩展。更多同类席位不直接等于职业选择更广，也未说明普通女性因而有更多可选职业。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>31题结论</h3>\n<blockquote>\n<p><strong>31. A</strong></p>\n</blockquote>\n<ul>\n<li>A：法案是首段批评的实例：平等之名下，机会主要落到精英女性，普通人获益很少。A概括它对缓解普遍性别偏见作用有限。</li>\n<li>B：州政府董事会承担预留席位的要求，不等于州政府本身受到威胁。原文没有把其安全或存续列为后果。</li>\n<li>C：更多董事会席位可能与政治参与有关，但作者强调机会集中于精英、普通女性帮助有限，不能据此概括女性整体政治地位提高。</li>\n<li>D：增加的是同一类董事会席位机会，拓宽职业选择则涉及更多职业种类或路径，greatly还要求很大的扩展程度。</li>\n</ul>\n<h2>32题</h2>\n<blockquote>\n<p>Which of the following is true of the California measure?</p>\n<p>关于加利福尼亚州的这项措施，以下哪项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：分清措施内容、州长判断与法院可能的裁定，保留probably和likely。</p>\n<p>题干直接给出the California measure，第4段出现a measure recently adopted in California并交代州长的评价，第5段继续用the California law解释法院可能怎样看待它。先完整读第4、5段，把措施内容、实施对象和法律评价连在一起。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>require gender quotas for private companies.</p>\n<p>California Governor Jerry Brown admitted that the law</p>\n<p>is probably unconstitutional.</p>\n</blockquote>\n<h3>A. It has irritated private business owners.</h3>\n<blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>加州措施已激怒私营企业主。</p>\n</blockquote>\n<p><code>irritated private business owners</code>把企业主写成产生不满的人，第4段的<code>require gender quotas for private companies</code>说明这项措施确实针对私营企业，因此回看这句要求以及随后谁表达了什么看法。</p>\n<p>原文的<code>require gender quotas for private companies</code>规定私营企业要遵守性别配额，随后表达看法的是州长杰里·布朗，他承认法律很可能违宪。<code>A</code>的<code>irritated private business owners</code>却把企业的受约束关系改成企业主已经愤怒的反应，还把表达态度的主体换成企业主。被规定要做什么与对规定有什么情绪，是两件不同的事。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<p>这些法案类似于加州最近通过的一项措施；加州去年成为首个要求私营企业实施性别配额的州。州长Jerry Brown签署时承认，这项明确按性别划分人群的法律很可能违宪。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内， on同说可能违宪；州长承认和作者对法院的预期互相衔接。</li>\n<li>D：prior修饰discrimination，指既往歧视；原文说连没有这种历史的董事会也受约束，未说措施将解决先前争议。</li>\n</ul>\n<h2>33题</h2>\n<blockquote>\n<p>The author mentions the study by Catalyst to illustrate ______.</p>\n<p>作者提到卡特利斯特的研究，是为了说明______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干直接给出the study by Catalyst，第7段出现同样的研究机构并列出2010年至2015年的数据。要判断研究说明什么，还要读上一段关于government mandates是否必要的问题，因此完整读第6、7段，连起提问、趋势判断和研究数据。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?</p>\n<p>The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n<h3>A. the harm from arbitrary board decisions</h3>\n<blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p>必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。</p>\n<p>A需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the harm from arbitrary board decisions.</p>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p>A需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. the importance of constitutional guarantees</h3>\n<blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nBut are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><code>constitutional guarantees</code>使人回到已经读过的第5段，其中谈到宪法里的<code>equal protection</code>；但研究出现在第7段的<code>without government interference</code>之后。把第5段的法律判断与第6、7段的问题和数据连起来，检查研究到底服务于哪一项讨论。</p>\n<p>第5段以<code>equal protection</code>讨论加州法律是否可能违宪；随后第6段改问政府强制规定是否必要，第7段用没有政府干预时女性董事仍在增加以及增长54%的数据回应这个问题。<code>B</code>的<code>the importance of constitutional guarantees</code>把研究的作用改接到宪法保障的重要性上。宪法问题确实在前面出现，但研究测量的是女性席位占比的变化，并未比较有无宪法保障会造成什么结果，不能把这份数据当成宪法保障重要性的证明。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nBut are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>But are such government mandates even necessary转了问题层次，从是否合法转到是否有必要，再接趋势与数据。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the importance of constitutional guarantees.</p>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p>B需要比较宪法保障对结果的作用。研究没有测量这种作用，不能因前段出现equal protection就把两种论证连错。</p>\n<p><strong>复盘判断：B错误
