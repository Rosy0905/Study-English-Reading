y mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n<p>下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。</p>\n</blockquote>\n<p>开头转述进步派支持配额的理由，结尾仍评价配额发起者及实际受益者，中间分析政策实施的障碍与结果。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Everyone should try hard to promote social justice.</p>\n<p>从文章可以推断，每个人都应努力促进社会正义。</p>\n</blockquote>\n<p>C需要everyone为主体的行动倡议。赞成公平并不自动等于本文在号召所有人努力，不能将政策效果问题换成个人道德义务。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. Major social issues should be the focus of legislation.","raw":"### D. Major social issues should be the focus of legislation.\n\n> 从文章可以推断，重大社会议题应成为立法重点。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nimportant policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。\n\n**出处：**\n\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-35-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section>"},{"title":"D. Major social issues should be the focus of legislation.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从文章可以推断，重大社会议题应成为立法重点。\n\nimportant policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。\n\n法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。\n\nD需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p>法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。</p>\n<p>D需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。</p>\n</section>"},{"title":"D. Major social issues should be the focus of legislation.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n>\n> 美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。\n\n法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Major social issues should be the focus of legislation.\n>\n> 从文章可以推断，重大社会议题应成为立法重点。\n\nD需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p>important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</p>\n<p>法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。</p>\n<p>D需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。</p>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n</blockquote>\n<p>法院态度后接unless，限定某种分类必须服务重要政策利益；作者用覆盖无歧视历史者说明此措施可能越界。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Major social issues should be the focus of legislation.</p>\n<p>从文章可以推断，重大社会议题应成为立法重点。</p>\n</blockquote>\n<p>D需要立法议题轻重的主张。实际讨论怎样分类及覆盖谁是否合法，不能把特定司法条件改成立法的一般重点安排。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"35题结论","raw":"### 35题结论\n\n> **35. B**\n\n- A：关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。\n- B：法律障碍、无干预时已有进展、合格人选不足与受益集中，都是检验政策能否达到设想的具体条件。B将其归为可行性考量。\n- C：文章批评具体政策是否达到公平目标，未向每个人提出努力促进社会正义的普遍行动要求。\n- D：important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"35","questionConclusion":true},"html":"<blockquote>\n<p><strong>35. B</strong></p>\n</blockquote>\n<ul>\n<li>A：关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</li>\n<li>B：法律障碍、无干预时已有进展、合格人选不足与受益集中，都是检验政策能否达到设想的具体条件。B将其归为可行性考量。</li>\n<li>C：文章批评具体政策是否达到公平目标，未向每个人提出努力促进社会正义的普遍行动要求。</li>\n<li>D：important policy interest是性别分类可能被允许的例外条件，D却把它推广成一般立法应优先选择重大社会议题。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：总体批判观点**（段落1核心论点） 进步派支持多元化强制规定（认为是通往平等的道路）// 但实际上：这些政策是不真诚的美德信号（只惠及特权阶层 + 不帮助普通人）\n\n↓（具体案例）\n\n**逻辑层次2：马萨诸塞州法案案例**（段落2-3具体实例） 法案背景：刘易斯和哈达德发起法案确保性别平等 → 原因：超过一半州政府董事会女性不足40% → 解决方案：【要求到2022年预留50%席位给女性】→ 真实目的：确保精英女性有更多机会\n\n↓（类似先例）\n\n**逻辑层次3：加州先例及其法律问题**（段落4-5法律分析） 加州案例：（第一个要求私营公司性别配额的州）→ 州长承认：（基于性别分类可能违宪）→ 法律标准：【最高法院不赞成性别分类 // 除非解决\"重要\"政策利益】→ 问题：加州法律适用所有董事会（包括无歧视历史的）→ 可能违反\"平等保护\"\n\n↓（质疑必要性）\n\n**逻辑层次4：政府干预的不必要性**（段落6-7数据论证） 反问：政府强制真的必要吗？→ 现状：（女性董事会参与度未反映人口比例 // 但那又怎样？）→ 事实证据：【没有政府干预下女性数量稳步增长 + Catalyst研究：2010-2015年增长54%】\n\n↓（负面后果）\n\n**逻辑层次5：配额制度的负面影响**（段落8-9实际后果） 理论后果：性别作为主要资格 → 导致董事会经验不足 → 挪威案例证明 → \"金裙\"现象：【增加机会但不增加合格人才池 → 同样的精英女性占据多个席位】\n\n↑（最终结论）\n\n**逻辑层次6：政策的真实本质**（段落10总结） 这些政策的本质：自我服务的措施（让发起人感觉良好 // 但不帮助普通女性）\n\n全文核心观点：性别配额政策表面上促进平等，实际上是精英阶层的自我服务工具，不仅可能违宪，而且会导致能力不足和资源集中，对普通女性毫无帮助。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：总体批判观点</strong>（段落1核心论点） 进步派支持多元化强制规定（认为是通往平等的道路）// 但实际上：这些政策是不真诚的美德信号（只惠及特权阶层 + 不帮助普通人）</p>\n<p>↓（具体案例）</p>\n<p><strong>逻辑层次2：马萨诸塞州法案案例</strong>（段落2-3具体实例） 法案背景：刘易斯和哈达德发起法案确保性别平等 → 原因：超过一半州政府董事会女性不足40% → 解决方案：【要求到2022年预留50%席位给女性】→ 真实目的：确保精英女性有更多机会</p>\n<p>↓（类似先例）</p>\n<p><strong>逻辑层次3：加州先例及其法律问题</strong>（段落4-5法律分析） 加州案例：（第一个要求私营公司性别配额的州）→ 州长承认：（基于性别分类可能违宪）→ 法律标准：【最高法院不赞成性别分类 // 除非解决&quot;重要&quot;政策利益】→ 问题：加州法律适用所有董事会（包括无歧视历史的）→ 可能违反&quot;平等保护&quot;</p>\n<p>↓（质疑必要性）</p>\n<p><strong>逻辑层次4：政府干预的不必要性</strong>（段落6-7数据论证） 反问：政府强制真的必要吗？→ 现状：（女性董事会参与度未反映人口比例 // 但那又怎样？）→ 事实证据：【没有政府干预下女性数量稳步增长 + Catalyst研究：2010-2015年增长54%】</p>\n<p>↓（负面后果）</p>\n<p><strong>逻辑层次5：配额制度的负面影响</strong>（段落8-9实际后果） 理论后果：性别作为主要资格 → 导致董事会经验不足 → 挪威案例证明 → &quot;金裙&quot;现象：【增加机会但不增加合格人才池 → 同样的精英女性占据多个席位】</p>\n<p>↑（最终结论）</p>\n<p><strong>逻辑层次6：政策的真实本质</strong>（段落10总结） 这些政策的本质：自我服务的措施（让发起人感觉良好 // 但不帮助普通女性）</p>\n<p>全文核心观点：性别配额政策表面上促进平等，实际上是精英阶层的自我服务工具，不仅可能违宪，而且会导致能力不足和资源集中，对普通女性毫无帮助。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】D. A proposed quota presented as an example of limited benefits\n\n> 以受益有限为评价的配额提案例子\n\n先提出表面平等政策受益有限的批评，再介绍两项确保性别均衡的法案及席位目标。\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field.\n\n开头转述以多样性规定促进平等的目标，But随即指出真实受益范围与目标不一致。\n\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female.\n\n两位提案人以女性比例不足为理由提出配额；作者用elite women说明更多机会将集中于哪类人。\n\n> If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\n\n50%是席位安排的具体目标，不直接证明普通女性受益扩大。标题须将法案例子接回首段的政策批评。\n\n这一部分的推进关系是：\n\n> 平等目标与实际受益的差距 → 法案作为实例 → 预留席位主要增加精英机会\n\npresented as an example对应case in point，limited benefits对应首段对普通人帮助不大的判断。\n\n再看最强干扰项G：A proven end to all gender discrimination。\n\n这是质疑政策效果的引入，没有宣布所有歧视结束。\n\n**41题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】D. A proposed quota presented as an example of limited benefits</p>\n<blockquote>\n<p>以受益有限为评价的配额提案例子</p>\n</blockquote>\n<p>先提出表面平等政策受益有限的批评，再介绍两项确保性别均衡的法案及席位目标。</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field.</p>\n</blockquote>\n<p>开头转述以多样性规定促进平等的目标，But随即指出真实受益范围与目标不一致。</p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female.</p>\n</blockquote>\n<p>两位提案人以女性比例不足为理由提出配额；作者用elite women说明更多机会将集中于哪类人。</p>\n<blockquote>\n<p>If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p>\n</blockquote>\n<p>50%是席位安排的具体目标，不直接证明普通女性受益扩大。标题须将法案例子接回首段的政策批评。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>平等目标与实际受益的差距 → 法案作为实例 → 预留席位主要增加精英机会</p>\n</blockquote>\n<p>presented as an example对应case in point，limited benefits对应首段对普通人帮助不大的判断。</p>\n<p>再看最强干扰项G：A proven end to all gender discrimination。</p>\n<p>这是质疑政策效果的引入，没有宣布所有歧视结束。</p>\n<p><strong>41题选D。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. Legal doubts about classifying people by sex\n\n> 按性别分类引发的法律疑问\n\n州长承认法律可能违宪，随后解释不考虑既往歧视而统一按性别分类可能违反平等保护。\n\n> The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies.\n\nsimilar将马萨诸塞提案接到加州已采用的配额措施，随后州长的承认引出合宪性问题。\n\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest.\n\nunless给出性别分类可以被接受的特定条件，并不是法院对所有配额无条件认可。\n\n> Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n\n法律连无歧视历史的董事会也覆盖，because据此推出可能违反平等保护，标题应概括法律限制。\n\n这一部分的推进关系是：\n\n> 类似配额措施 → 按性别分类受法律限制 → 一律适用引发违宪风险\n\nlegal doubts对应probably unconstitutional与courts are likely；保留可能性而非已作最终裁决。\n\n再看最强干扰项C：Equal opportunities already guaranteed for every person。\n\n分类措施的法律争议不能概括成每个人机会已受保证。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. Legal doubts about classifying people by sex</p>\n<blockquote>\n<p>按性别分类引发的法律疑问</p>\n</blockquote>\n<p>州长承认法律可能违宪，随后解释不考虑既往歧视而统一按性别分类可能违反平等保护。</p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies.</p>\n</blockquote>\n<p>similar将马萨诸塞提案接到加州已采用的配额措施，随后州长的承认引出合宪性问题。</p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest.</p>\n</blockquote>\n<p>unless给出性别分类可以被接受的特定条件，并不是法院对所有配额无条件认可。</p>\n<blockquote>\n<p>Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n<p>法律连无歧视历史的董事会也覆盖，because据此推出可能违反平等保护，标题应概括法律限制。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>类似配额措施 → 按性别分类受法律限制 → 一律适用引发违宪风险</p>\n</blockquote>\n<p>legal doubts对应probably unconstitutional与courts are likely；保留可能性而非已作最终裁决。</p>\n<p>再看最强干扰项C：Equal opportunities already guaranteed for every person。</p>\n<p>分类措施的法律争议不能概括成每个人机会已受保证。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】B. Testing whether intervention is necessary\n\n> 检验干预是否必要\n\n先直接问强制要求是否必要，再用无政府干预情况下女性席位增长的数据作答。\n\n> But are such government mandates even necessary?\n\nBut...necessary把问题从是否合法推进到是否需要强制规定，后文应回答必要性。\n\n> The number of women on corporate boards has been steadily increasing without government interference.\n\nwithout government interference限定已有增长发生在无政府干预的情况下。\n\n> According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.\n\n54%的增长数据具体支持前一句趋势，用于质疑强制配额的必要性，不能改成研究证明歧视已全部消失。\n\n这一部分的推进关系是：\n\n> 质疑强制必要性 → 无干预也增长 → 研究数据支持\n\ntesting necessity对应necessary，增长数据支持作者对强制干预必要性的质疑。\n\n再看最强干扰项E：Legal doubts about classifying people by sex。\n\n这部分已由合宪性转向现实趋势，数字不是检验宪法保证。\n\n**43题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】B. Testing whether intervention is necessary</p>\n<blockquote>\n<p>检验干预是否必要</p>\n</blockquote>\n<p>先直接问强制要求是否必要，再用无政府干预情况下女性席位增长的数据作答。</p>\n<blockquote>\n<p>But are such government mandates even necessary?</p>\n</blockquote>\n<p>But...necessary把问题从是否合法推进到是否需要强制规定，后文应回答必要性。</p>\n<blockquote>\n<p>The number of women on corporate boards has been steadily increasing without government interference.</p>\n</blockquote>\n<p>without government interference限定已有增长发生在无政府干预的情况下。</p>\n<blockquote>\n<p>According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n<p>54%的增长数据具体支持前一句趋势，用于质疑强制配额的必要性，不能改成研究证明歧视已全部消失。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>质疑强制必要性 → 无干预也增长 → 研究数据支持</p>\n</blockquote>\n<p>testing necessity对应necessary，增长数据支持作者对强制干预必要性的质疑。</p>\n<p>再看最强干扰项E：Legal doubts about classifying people by sex。</p>\n<p>这部分已由合宪性转向现实趋势，数字不是检验宪法保证。</p>\n<p><strong>43题选B。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. More seats without a larger pool of qualified candidates\n\n> 席位增加但合格人选池未扩大\n\n把性别作为首要资格可能减少经验，挪威案例接着说明人选池没扩大却增加席位导致少数精英兼任。\n\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.\n\n首句把性别当作首要资格与经验减少相连，讨论的是任职条件而不是反对女性任职。\n\n> That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n\nThat回指经验减少的后果，挪威是这一政策后果的实例。\n\n> Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\n\nwithout increasing the pool解释席位与人选供给不匹配，golden skirt进一步显示同一批精英兼任，标题需保留这种脱节。\n\n这一部分的推进关系是：\n\n> 性别优先可能削弱经验 → 挪威实例 → 席位增加而合格人选池未扩\n\nmore seats与qualified pool的不同步贯通经验问题与golden skirt现象。\n\n再看最强干扰项G：A proven end to all gender discrimination。\n\n原文列出的是政策后果和受益集中，完全消除歧视没有依据。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. More seats without a larger pool of qualified candidates</p>\n<blockquote>\n<p>席位增加但合格人选池未扩大</p>\n</blockquote>\n<p>把性别作为首要资格可能减少经验，挪威案例接着说明人选池没扩大却增加席位导致少数精英兼任。</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.</p>\n</blockquote>\n<p>首句把性别当作首要资格与经验减少相连，讨论的是任职条件而不是反对女性任职。</p>\n<blockquote>\n<p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n</blockquote>\n<p>That回指经验减少的后果，挪威是这一政策后果的实例。</p>\n<blockquote>\n<p>Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n<p>without increasing the pool解释席位与人选供给不匹配，golden skirt进一步显示同一批精英兼任，标题需保留这种脱节。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>性别优先可能削弱经验 → 挪威实例 → 席位增加而合格人选池未扩</p>\n</blockquote>\n<p>more seats与qualified pool的不同步贯通经验问题与golden skirt现象。</p>\n<p>再看最强干扰项G：A proven end to all gender discrimination。</p>\n<p>原文列出的是政策后果和受益集中，完全消除歧视没有依据。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】A. A policy may serve its sponsors more than ordinary women\n\n> 政策可能更服务于发起者而非普通女性\n\n结尾要求记住这类配额往往让发起者满意，却对普通女性帮助不大。\n\n> Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.\n\n结尾将发起者feel good与普通女性获益很少对照，self-serving概括目标与实际受益的反差。\n\n这一部分的推进关系是：\n\n> 以性别公平推动配额 → 发起者自我满足 → 普通女性获益有限\n\nserve sponsors对应self-serving与feel good，ordinary women对应average women。\n\n再看最强干扰项C：Equal opportunities already guaranteed for every person。\n\n作者恰恰质疑实际帮助，不能改写成机会已保证。\n\n**45题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】A. A policy may serve its sponsors more than ordinary women</p>\n<blockquote>\n<p>政策可能更服务于发起者而非普通女性</p>\n</blockquote>\n<p>结尾要求记住这类配额往往让发起者满意，却对普通女性帮助不大。</p>\n<blockquote>\n<p>Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n<p>结尾将发起者feel good与普通女性获益很少对照，self-serving概括目标与实际受益的反差。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>以性别公平推动配额 → 发起者自我满足 → 普通女性获益有限</p>\n</blockquote>\n<p>serve sponsors对应self-serving与feel good，ordinary women对应average women。</p>\n<p>再看最强干扰项C：Equal opportunities already guaranteed for every person。</p>\n<p>作者恰恰质疑实际帮助，不能改写成机会已保证。</p>\n<p><strong>45题选A。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出政策表面目标与受益范围的差距 |\n| B | 从配额目标转向合宪性限制 |\n| C | 用挪威说明精英反复兼任的结果 |\n| D | 介绍席位目标并区分数量与受益范围 |\n| E | 以自然增长检验强制干预必要性 |\n| F | 指出增加席位不等于扩大合格人选池 |\n| G | 把受益集中接回普通女性的实际需要 |\n| H | 归纳政策应同时检验合法性必要性和效果 |\n\n全文推进：\n\n> 提出政策表面目标与受益范围的差距 → 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制 → 以自然增长检验强制干预必要性 → 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要 → 归纳政策应同时检验合法性必要性和效果\n\n完整顺序：\n\n**A → D → B → E → F → C → G → H**\n\n41—45：D、B、F、C、G。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出政策表面目标与受益范围的差距</td>\n</tr>\n<tr>\n<td>B</td>\n<td>从配额目标转向合宪性限制</td>\n</tr>\n<tr>\n<td>C</td>\n<td>用挪威说明精英反复兼任的结果</td>\n</tr>\n<tr>\n<td>D</td>\n<td>介绍席位目标并区分数量与受益范围</td>\n</tr>\n<tr>\n<td>E</td>\n<td>以自然增长检验强制干预必要性</td>\n</tr>\n<tr>\n<td>F</td>\n<td>指出增加席位不等于扩大合格人选池</td>\n</tr>\n<tr>\n<td>G</td>\n<td>把受益集中接回普通女性的实际需要</td>\n</tr>\n<tr>\n<td>H</td>\n<td>归纳政策应同时检验合法性必要性和效果</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出政策表面目标与受益范围的差距 → 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制 → 以自然增长检验强制干预必要性 → 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要 → 归纳政策应同时检验合法性必要性和效果</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → D → B → E → F → C → G → H</strong></p>\n<p>41—45：D、B、F、C、G。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → D → B。\n\n先看前段A的结尾：\n\n> A proposal to reserve seats on government boards provides a concrete case through which to examine that concern.\n\n再看D段开头：\n\n> Under the proposal, a fixed share of board seats would be set aside for women.\n\n前段以reserve seats的proposal作为具体例子，当前Under the proposal直接接住该提案并介绍席位比例。\n\n本段内部继续写道：\n\n> Supporters point to existing female representation as evidence of a problem. The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.\n\n先说支持者看到女性代表不足，再用but区分名额增加与究竟谁受益，数量目标不能自动证明受益广泛。\n\n后段B开头是：\n\n> A similar target for private-company boards raises an additional question about legality.\n\nA similar target承接当前配额目标，从政府机构转到私营公司，并增加合法性这一检验。\n\n这三段的推进关系：\n\n> 提出政策表面目标与受益范围的差距 → 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制\n\n再检验候选F：\n\n> Even where a mandate changes the numbers, the supply of suitable candidates remains important.\n\n合格人选供给是后面的实施条件，这里还需先交代提案具体安排；否则similar target缺少明确可比较的目标。\n\n**41题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>41题是全文第2段，局部关系为A → D → B。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>A proposal to reserve seats on government boards provides a concrete case through which to examine that concern.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Under the proposal, a fixed share of board seats would be set aside for women.</p>\n</blockquote>\n<p>前段以reserve seats的proposal作为具体例子，当前Under the proposal直接接住该提案并介绍席位比例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Supporters point to existing female representation as evidence of a problem. The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.</p>\n</blockquote>\n<p>先说支持者看到女性代表不足，再用but区分名额增加与究竟谁受益，数量目标不能自动证明受益广泛。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>A similar target for private-company boards raises an additional question about legality.</p>\n</blockquote>\n<p>A similar target承接当前配额目标，从政府机构转到私营公司，并增加合法性这一检验。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出政策表面目标与受益范围的差距 → 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important.</p>\n</blockquote>\n<p>合格人选供给是后面的实施条件，这里还需先交代提案具体安排；否则similar target缺少明确可比较的目标。</p>\n<p><strong>41题选D。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为D → B → E。\n\n先看前段D的结尾：\n\n> The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.\n\n再看B段开头：\n\n> A similar target for private-company boards raises an additional question about legality.\n\n前段指出数字目标未说明受益范围，当前additional question表示在效果之外增加合法性检查。\n\n本段内部继续写道：\n\n> Rules that classify people by sex face constitutional limits, especially when they apply regardless of a history of discrimination. A policy may therefore encounter legal barriers before its practical effects can be assessed.\n\n按性别分类有宪法限制，especially解释不分既往歧视一律适用的风险，therefore收束为法律障碍。\n\n后段E开头是：\n\n> Practical assessment must also ask whether compulsory intervention is needed.\n\nPractical assessment...also承接法律检验，再问强制干预是否必要，形成合法性到必要性的推进。\n\n这三段的推进关系：\n\n> 介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制 → 以自然增长检验强制干预必要性\n\n再检验候选F：\n\n> Even where a mandate changes the numbers, the supply of suitable candidates remains important.\n\n适任人选供给应在必要性之后讨论实际实施；直接放它会跳过后句also所承接的法律与现实检验之间的过渡。\n\n**42题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>42题是全文第3段，局部关系为D → B → E。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>A similar target for private-company boards raises an additional question about legality.</p>\n</blockquote>\n<p>前段指出数字目标未说明受益范围，当前additional question表示在效果之外增加合法性检查。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Rules that classify people by sex face constitutional limits, especially when they apply regardless of a history of discrimination. A policy may therefore encounter legal barriers before its practical effects can be assessed.</p>\n</blockquote>\n<p>按性别分类有宪法限制，especially解释不分既往歧视一律适用的风险，therefore收束为法律障碍。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Practical assessment must also ask whether compulsory intervention is needed.</p>\n</blockquote>\n<p>Practical assessment...also承接法律检验，再问强制干预是否必要，形成合法性到必要性的推进。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍席位目标并区分数量与受益范围 → 从配额目标转向合宪性限制 → 以自然增长检验强制干预必要性</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important.</p>\n</blockquote>\n<p>适任人选供给应在必要性之后讨论实际实施；直接放它会跳过后句also所承接的法律与现实检验之间的过渡。</p>\n<p><strong>42题选B。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → F → C。\n\n先看前段E的结尾：\n\n> The trend does not establish that every inequality has vanished, but it challenges the claim that a mandate is the only route to improvement.\n\n再看F段开头：\n\n> Even where a mandate changes the numbers, the supply of suitable candidates remains important.\n\n前段已用无强制也改善的趋势质疑唯一途径，Even where让步承接：即使配额改变数量，仍需合格人选。\n\n本段内部继续写道：\n\n> Reserving more seats does not automatically enlarge the pool of people prepared to fill them. Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.\n\n更多席位不自动扩大适任者群体，单一资格优先由此留下数字目标与所需经验之间的缺口。\n\n后段C开头是：\n\n> That gap helps explain the concern raised by the Norwegian experience.\n\nThat gap准确回指当前a gap，挪威经历随后将抽象的人选不足落实到实例。\n\n这三段的推进关系：\n\n> 以自然增长检验强制干预必要性 → 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果\n\n再检验候选G：\n\n> The concentration of positions brings the argument back to ordinary women.\n\n岗位集中应在挪威实例出现同一批人兼任之后才有依据，此处先解释缺口，不能提前把concentration当作已交代事实。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>43题是全文第5段，局部关系为E → F → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The trend does not establish that every inequality has vanished, but it challenges the claim that a mandate is the only route to improvement.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Even where a mandate changes the numbers, the supply of suitable candidates remains important.</p>\n</blockquote>\n<p>前段已用无强制也改善的趋势质疑唯一途径，Even where让步承接：即使配额改变数量，仍需合格人选。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Reserving more seats does not automatically enlarge the pool of people prepared to fill them. Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.</p>\n</blockquote>\n<p>更多席位不自动扩大适任者群体，单一资格优先由此留下数字目标与所需经验之间的缺口。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That gap helps explain the concern raised by the Norwegian experience.</p>\n</blockquote>\n<p>That gap准确回指当前a gap，挪威经历随后将抽象的人选不足落实到实例。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以自然增长检验强制干预必要性 → 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The concentration of positions brings the argument back to ordinary women.</p>\n</blockquote>\n<p>岗位集中应在挪威实例出现同一批人兼任之后才有依据，此处先解释缺口，不能提前把concentration当作已交代事实。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为F → C → G。\n\n先看前段F的结尾：\n\n> Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.\n\n再看C段开头：\n\n> That gap helps explain the concern raised by the Norwegian experience.\n\n前段刚指出目标与经验需求的gap，当前That gap立即回指，并引出挪威作为例证。\n\n本段内部继续写道：\n\n> More board opportunities were created without a corresponding expansion in the pool of qualified women. Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.\n\n机会增加但合格女性群体未扩，consequently接出同一批精英累积多席，golden-skirt为这一结果命名。\n\n后段G开头是：\n\n> The concentration of positions brings the argument back to ordinary women.\n\nThe concentration of positions承接multiple positions，将后果转向普通女性是否受益。\n\n这三段的推进关系：\n\n> 指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要\n\n再检验候选D：\n\n> Under the proposal, a fixed share of board seats would be set aside for women.\n\n提案预留席位在前面已介绍，这里要解释挪威经验及兼任结果，回到提案概况会使下一句的岗位集中无从承接。\n\n**44题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>44题是全文第6段，局部关系为F → C → G。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That gap helps explain the concern raised by the Norwegian experience.</p>\n</blockquote>\n<p>前段刚指出目标与经验需求的gap，当前That gap立即回指，并引出挪威作为例证。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>More board opportunities were created without a corresponding expansion in the pool of qualified women. Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.</p>\n</blockquote>\n<p>机会增加但合格女性群体未扩，consequently接出同一批精英累积多席，golden-skirt为这一结果命名。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The concentration of positions brings the argument back to ordinary women.</p>\n</blockquote>\n<p>The concentration of positions承接multiple positions，将后果转向普通女性是否受益。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>指出增加席位不等于扩大合格人选池 → 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Under the proposal, a fixed share of board seats would be set aside for women.</p>\n</blockquote>\n<p>提案预留席位在前面已介绍，这里要解释挪威经验及兼任结果，回到提案概况会使下一句的岗位集中无从承接。</p>\n<p><strong>44题选C。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为C → G → H。\n\n先看前段C的结尾：\n\n> Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.\n\n再看G段开头：\n\n> The concentration of positions brings the argument back to ordinary women.\n\n前段同一批精英取得多席，当前The concentration概括该结果，brings...back再把讨论拉回普通女性。\n\n本段内部继续写道：\n\n> A measure can increase the visibility of a small elite while doing little for people outside it. Feeling satisfied with a numerical achievement is therefore different from demonstrating that a policy has broadened meaningful opportunities.\n\n小群体更显眼不代表圈外人受益，therefore区分完成数字目标的满足感与机会真正扩大的证据。\n\n后段H开头是：\n\n> The broader lesson is to examine feasibility alongside intention.\n\nThe broader lesson将当前具体受益问题同前面法律、必要性、人选条件合并，收束为意图之外还要检验可行性。\n\n这三段的推进关系：\n\n> 用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要 → 归纳政策应同时检验合法性必要性和效果\n\n再检验候选D：\n\n> Under the proposal, a fixed share of board seats would be set aside for women.\n\n固定席位的提案是论证起点，不能替代这里由精英集中到普通女性再到普遍政策教训的收束。\n\n**45题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>45题是全文第7段，局部关系为C → G → H。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The concentration of positions brings the argument back to ordinary women.</p>\n</blockquote>\n<p>前段同一批精英取得多席，当前The concentration概括该结果，brings...back再把讨论拉回普通女性。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A measure can increase the visibility of a small elite while doing little for people outside it. Feeling satisfied with a numerical achievement is therefore different from demonstrating that a policy has broadened meaningful opportunities.</p>\n</blockquote>\n<p>小群体更显眼不代表圈外人受益，therefore区分完成数字目标的满足感与机会真正扩大的证据。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The broader lesson is to examine feasibility alongside intention.</p>\n</blockquote>\n<p>The broader lesson将当前具体受益问题同前面法律、必要性、人选条件合并，收束为意图之外还要检验可行性。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用挪威说明精英反复兼任的结果 → 把受益集中接回普通女性的实际需要 → 归纳政策应同时检验合法性必要性和效果</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Under the proposal, a fixed share of board seats would be set aside for women.</p>\n</blockquote>\n<p>固定席位的提案是论证起点，不能替代这里由精英集中到普通女性再到普遍政策教训的收束。</p>\n<p><strong>45题选G。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **equal opportunities** | **平等机会** | **社会现象｜社会生活** | **宏观主题** |\n| policy feasibility | 政策可行性 | 社会现象｜社会生活 | 宏观主题 |\n| fair participation | 公平参与 | 社会现象｜社会生活 | 宏观主题 |\n| **practical evaluation** | **实际评估** | **人生哲理｜理性选择** | **个人主题** |\n| professional competence | 专业能力 | 社会现象｜社会生活｜提升竞争力 | 个人主题 |\n| balanced representation | 均衡的代表性 | 社会现象｜社会生活 | 宏观主题 |\n| broad social benefits | 广泛的社会收益 | 社会现象｜社会生活 | 宏观主题 |\n| responsible policymaking | 负责任的政策制定 | 社会现象｜社会生活 | 宏观主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>equal opportunities</strong></td>\n<td><strong>平等机会</strong></td>\n<td><strong>社会现象｜社会生活</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>policy feasibility</td>\n<td>政策可行性</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>fair participation</td>\n<td>公平参与</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>practical evaluation</strong></td>\n<td><strong>实际评估</strong></td>\n<td><strong>人生哲理｜理性选择</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>professional competence</td>\n<td>专业能力</td>\n<td>社会现象｜社会生活｜提升竞争力</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>balanced representation</td>\n<td>均衡的代表性</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>broad social benefits</td>\n<td>广泛的社会收益</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>responsible policymaking</td>\n<td>负责任的政策制定</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n</tbody></table></div>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画** | **The picture contrasts a stated intention with the people who actually benefit.** | **图画对比了宣称的意图与实际受益者。** |\n| 图画 | A small group occupies several positions while others remain outside. | 一小群人占据多个位置，而其他人仍在外面。 |\n| 图画 | The scene highlights the difference between meeting a target and solving a problem. | 场景凸显了达到指标与解决问题的区别。 |\n| **图表** | **The proportion has increased steadily without direct intervention.** | **这一比例在没有直接干预的情况下稳定增加。** |\n| 图表 | The number of places has risen faster than the pool of qualified applicants. | 名额数量增长快于合格申请人群体的扩张。 |\n| 图表 | The gains are concentrated among a relatively small group. | 收益集中在相对较小的群体中。 |\n| 文本评论 | The statement asks whether a well-intentioned policy is feasible in practice. | 这句话追问善意政策在实践中是否可行。 |\n| 文本评论 | The passage stresses the need to examine who benefits from an institutional change. | 这段文字强调检查制度变化使谁受益的必要性。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The picture contrasts a stated intention with the people who actually benefit.</strong></td>\n<td><strong>图画对比了宣称的意图与实际受益者。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>A small group occupies several positions while others remain outside.</td>\n<td>一小群人占据多个位置，而其他人仍在外面。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene highlights the difference between meeting a target and solving a problem.</td>\n<td>场景凸显了达到指标与解决问题的区别。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The proportion has increased steadily without direct intervention.</strong></td>\n<td><strong>这一比例在没有直接干预的情况下稳定增加。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The number of places has risen faster than the pool of qualified applicants.</td>\n<td>名额数量增长快于合格申请人群体的扩张。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The gains are concentrated among a relatively small group.</td>\n<td>收益集中在相对较小的群体中。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement asks whether a well-intentioned policy is feasible in practice.</td>\n<td>这句话追问善意政策在实践中是否可行。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage stresses the need to examine who benefits from an institutional change.</td>\n<td>这段文字强调检查制度变化使谁受益的必要性。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A policy may serve its sponsors more than ordinary women</strong></p><p><strong>B. Testing whether intervention is necessary</strong></p><p><strong>C. Equal opportunities already guaranteed for every person</strong></p><p><strong>D. A proposed quota presented as an example of limited benefits</strong></p><p><strong>E. Legal doubts about classifying people by sex</strong></p><p><strong>F. More seats without a larger pool of qualified candidates</strong></p><p><strong>G. A proven end to all gender discrimination</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people. A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provide a case in point. Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional. The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what? The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota. Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>A diversity requirement may be promoted as a path to equality without delivering equal benefits in practice. The author argues that some such measures mainly help people who are already privileged. A proposal to reserve seats on government boards provides a concrete case through which to examine that concern.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>A similar target for private-company boards raises an additional question about legality. Rules that classify people by sex face constitutional limits, especially when they apply regardless of a history of discrimination. A policy may therefore encounter legal barriers before its practical effects can be assessed.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>That gap helps explain the concern raised by the Norwegian experience. More board opportunities were created without a corresponding expansion in the pool of qualified women. Some of the same elite candidates consequently accumulated several positions, producing what was described as a golden-skirt phenomenon.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Under the proposal, a fixed share of board seats would be set aside for women. Supporters point to existing female representation as evidence of a problem. The measure would increase opportunities for board membership, but that numerical target alone does not show who would benefit or how broadly.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>Practical assessment must also ask whether compulsory intervention is needed. Female representation on corporate boards has already increased without such a requirement. The trend does not establish that every inequality has vanished, but it challenges the claim that a mandate is the only route to improvement.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Even where a mandate changes the numbers, the supply of suitable candidates remains important. Reserving more seats does not automatically enlarge the pool of people prepared to fill them. Making a single characteristic the primary qualification can therefore leave a gap between the target and the experience a board needs.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>The concentration of positions brings the argument back to ordinary women. A measure can increase the visibility of a small elite while doing little for people outside it. Feeling satisfied with a numerical achievement is therefore different from demonstrating that a policy has broadened meaningful opportunities.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>The broader lesson is to examine feasibility alongside intention. Legal authority, the need for intervention, the supply of qualified candidates and the distribution of benefits all matter. Good intentions and favourable headline numbers cannot replace evidence about how a policy will work.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>progressives</td>\n<td>n.进步派</td>\n<td>diversity mandates</td>\n<td>多样性强制规定</td>\n<td>equality</td>\n<td>n.平等</td>\n</tr>\n<tr>\n<td>level the playing field</td>\n<td>创造公平条件</td>\n<td>insincere</td>\n<td>adj.不真诚的</td>\n<td>virtue-signaling</td>\n<td>n.道德姿态展示</td>\n</tr>\n<tr>\n<td>privileged</td>\n<td>adj.享特权的</td>\n<td>average people</td>\n<td>普通人</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>bills</td>\n<td>n.法案</td>\n<td>sponsored</td>\n<td>v.发起</td>\n<td>senator</td>\n<td>n.参议员</td>\n</tr>\n<tr>\n<td>ensure</td>\n<td>v.确保</td>\n<td>gender parity</td>\n<td>性别均衡</td>\n<td>boards</td>\n<td>n.董事会；委员会</td>\n</tr>\n<tr>\n<td>commissions</td>\n<td>n.委员会</td>\n<td>case in point</td>\n<td>恰当例证</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</
