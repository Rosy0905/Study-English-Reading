ikely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>加州措施将解决先前争议。</p>\n</blockquote>\n<p>prior修饰discrimination，指既往歧视；原文说连没有这种历史的董事会也受约束，未说措施将解决先前争议。</p>\n<p>作者以适用范围过广说明法律风险，推进到可能违反平等保护，而非推进到争议得到解决。</p>\n<p>D需要过去争议被措施消除的结果。将歧视改成争议、把可能引发违宪判断改成解决争议，都改变了原句关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies. In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.</p>\n<p>这些法案类似于加州最近通过的一项措施；加州去年成为首个要求私营企业实施性别配额的州。州长Jerry Brown签署时承认，这项明确按性别划分人群的法律很可能违宪。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n</blockquote>\n<p>作者以适用范围过广说明法律风险，推进到可能违反平等保护，而非推进到争议得到解决。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It will settle the prior controversies.</p>\n<p>加州措施将解决先前争议。</p>\n</blockquote>\n<p>D需要过去争议被措施消除的结果。将歧视改成争议、把可能引发违宪判断改成解决争议，都改变了原句关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. C**\n\n- A：企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。\n- B：frowns on是不赞成，法院可能判其违反平等保护。B的受到最高法院欢迎，与文章所写的司法态度和预期相反。\n- C：probably unconstitutional与may go against the Constitution同说可能违宪；州长承认和作者对法院的预期互相衔接。\n- D：prior修饰discrimination，指既往歧视；原文说连没有这种历史的董事会也受约束，未说措施将解决先前争议。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,500],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"32","questionConclusion":true},"html":"<blockquote>\n<p><strong>32. C</strong></p>\n</blockquote>\n<ul>\n<li>A：企业被要求遵守性别配额是制度约束，企业主已被激怒是情绪反应。该处实际转述的是州长对合宪性的担忧。</li>\n<li>B：frowns on是不赞成，法院可能判其违反平等保护。B的受到最高法院欢迎，与文章所写的司法态度和预期相反。</li>\n<li>C：probably unconstitutional与may go against the Constitution同说可能违宪；州长承认和作者对法院的预期互相衔接。</li>\n<li>D：prior修饰discrimination，指既往歧视；原文说连没有这种历史的董事会也受约束，未说措施将解决先前争议。</li>\n</ul>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> The author mentions the study by Catalyst to illustrate ______.\n>\n> 作者提到卡特利斯特的研究，是为了说明______。\n\n### 题型\n\n例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。\n\n题干直接给出the study by Catalyst，第7段出现同样的研究机构并列出2010年至2015年的数据。要判断研究说明什么，还要读上一段关于government mandates是否必要的问题，因此完整读第6、7段，连起提问、趋势判断和研究数据。\n\n### 核心出处\n\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n>\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"33","questionIntro":true},"html":"<blockquote>\n<p>The author mentions the study by Catalyst to illustrate ______.</p>\n<p>作者提到卡特利斯特的研究，是为了说明______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干直接给出the study by Catalyst，第7段出现同样的研究机构并列出2010年至2015年的数据。要判断研究说明什么，还要读上一段关于government mandates是否必要的问题，因此完整读第6、7段，连起提问、趋势判断和研究数据。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?</p>\n<p>The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n"},{"title":"A. the harm from arbitrary board decisions","raw":"### A. the harm from arbitrary board decisions\n\n> 作者用Catalyst研究说明武断董事会决策的危害。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nCatalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。\n\n**出处：**\n\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section>"},{"title":"A. the harm from arbitrary board decisions","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者用Catalyst研究说明武断董事会决策的危害。\n\nCatalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。\n\n必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。\n\nA需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p>必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。</p>\n<p>A需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。</p>\n</section>"},{"title":"A. the harm from arbitrary board decisions","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.\n>\n> 但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？\n>\n> 没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。\n\n必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The Catalyst study illustrates the harm from arbitrary board decisions.\n>\n> 作者用Catalyst研究说明武断董事会决策的危害。\n\nA需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p>Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</p>\n<p>必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。</p>\n<p>A需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>必要性反问之后，先说无政府干预仍持续增长，再以2010—2015年增长54%的数据作支持。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the harm from arbitrary board decisions.</p>\n<p>作者用Catalyst研究说明武断董事会决策的危害。</p>\n</blockquote>\n<p>A需要决策及其有害后果的证据。董事会是统计对象，不等于研究在评价它们作了怎样的决策。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. the importance of constitutional guarantees","raw":"### B. the importance of constitutional guarantees\n\n> 作者用Catalyst研究说明宪法保障的重要性。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。\n\n**出处：**\n\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-B-0\"><blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nBut are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section>"},{"title":"B. the importance of constitutional guarantees","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者用Catalyst研究说明宪法保障的重要性。\n\n`constitutional guarantees`使人回到已经读过的第5段，其中谈到宪法里的`equal protection`；但研究出现在第7段的`without government interference`之后。把第5段的法律判断与第6、7段的问题和数据连起来，检查研究到底服务于哪一项讨论。\n\n第5段以`equal protection`讨论加州法律是否可能违宪；随后第6段改问政府强制规定是否必要，第7段用没有政府干预时女性董事仍在增加以及增长54%的数据回应这个问题。`B`的`the importance of constitutional guarantees`把研究的作用改接到宪法保障的重要性上。宪法问题确实在前面出现，但研究测量的是女性席位占比的变化，并未比较有无宪法保障会造成什么结果，不能把这份数据当成宪法保障重要性的证明。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-B-0\"><blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nBut are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><code>constitutional guarantees</code>使人回到已经读过的第5段，其中谈到宪法里的<code>equal protection</code>；但研究出现在第7段的<code>without government interference</code>之后。把第5段的法律判断与第6、7段的问题和数据连起来，检查研究到底服务于哪一项讨论。</p>\n<p>第5段以<code>equal protection</code>讨论加州法律是否可能违宪；随后第6段改问政府强制规定是否必要，第7段用没有政府干预时女性董事仍在增加以及增长54%的数据回应这个问题。<code>B</code>的<code>the importance of constitutional guarantees</code>把研究的作用改接到宪法保障的重要性上。宪法问题确实在前面出现，但研究测量的是女性席位占比的变化，并未比较有无宪法保障会造成什么结果，不能把这份数据当成宪法保障重要性的证明。</p>\n</section>"},{"title":"B. the importance of constitutional guarantees","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.\n>\n> 美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。\n>\n> 但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？\n>\n> 没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。\n\nBut are such government mandates even necessary转了问题层次，从是否合法转到是否有必要，再接趋势与数据。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The Catalyst study illustrates the importance of constitutional guarantees.\n>\n> 作者用Catalyst研究说明宪法保障的重要性。\n\nB需要比较宪法保障对结果的作用。研究没有测量这种作用，不能因前段出现equal protection就把两种论证连错。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-B-0\"><blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nBut are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p><code>constitutional guarantees</code>使人回到已经读过的第5段，其中谈到宪法里的<code>equal protection</code>；但研究出现在第7段的<code>without government interference</code>之后。把第5段的法律判断与第6、7段的问题和数据连起来，检查研究到底服务于哪一项讨论。</p>\n<p>第5段以<code>equal protection</code>讨论加州法律是否可能违宪；随后第6段改问政府强制规定是否必要，第7段用没有政府干预时女性董事仍在增加以及增长54%的数据回应这个问题。<code>B</code>的<code>the importance of constitutional guarantees</code>把研究的作用改接到宪法保障的重要性上。宪法问题确实在前面出现，但研究测量的是女性席位占比的变化，并未比较有无宪法保障会造成什么结果，不能把这份数据当成宪法保障重要性的证明。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nBut are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>But are such government mandates even necessary转了问题层次，从是否合法转到是否有必要，再接趋势与数据。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the importance of constitutional guarantees.</p>\n<p>作者用Catalyst研究说明宪法保障的重要性。</p>\n</blockquote>\n<p>B需要比较宪法保障对结果的作用。研究没有测量这种作用，不能因前段出现equal protection就把两种论证连错。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. the pressure on women in global corporations","raw":"### C. the pressure on women in global corporations\n\n> 作者用Catalyst研究说明全球企业中女性承受的压力。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nglobal corporations是全球企业，研究测量其中女性董事占比。比例增加不等于女性承受的压力被测量或说明。\n\n**出处：**\n\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the gen opulation, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>without government interference先界定增长背景，54 percent量化女性董事比例的变化，以此回应强制配额是否必要。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the pressure on women in global corporations.</p>\n<p>作者用Catalyst研究说明全球企业中女性承受的压力。</p>\n</blockquote>\n<p>C需要女性工作负担、心理压力或外部要求的材料。研究对象是女性，不足以使关于她们的任何处境都成为研究结论。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. the needlessness of government interventions","raw":"### D. the needlessness of government interventions\n\n> 作者用Catalyst研究说明此类政府干预的不必要性。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。\n\n**出处：**\n\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section>"},{"title":"D. the needlessness of government interventions","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者用Catalyst研究说明此类政府干预的不必要性。\n\n`needlessness of government interventions`与第6段的`are such government mandates even necessary`直接相接，第7段的`without government interference`又明确写没有干预的情形，因此回看这个问题及随后趋势和研究数据。\n\n原文先问这种强制规定是否必要，再指出女性董事人数在`without government interference`的情况下增加，研究进一步给出女性占比增长54%的事实。`D`的`needlessness of government interventions`概括的正是这项数据所支持的判断：既然没有政府强制配额也在增长，就没有因此要求政府介入的必要。这里的`interventions`接着文中的董事会性别配额来理解，并不扩大到政府对所有事项的干预。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><code>needlessness of government interventions</code>与第6段的<code>are such government mandates even necessary</code>直接相接，第7段的<code>without government interference</code>又明确写没有干预的情形，因此回看这个问题及随后趋势和研究数据。</p>\n<p>原文先问这种强制规定是否必要，再指出女性董事人数在<code>without government interference</code>的情况下增加，研究进一步给出女性占比增长54%的事实。<code>D</code>的<code>needlessness of government interventions</code>概括的正是这项数据所支持的判断：既然没有政府强制配额也在增长，就没有因此要求政府介入的必要。这里的<code>interventions</code>接着文中的董事会性别配额来理解，并不扩大到政府对所有事项的干预。</p>\n</section>"},{"title":"D. the needlessness of government interventions","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\n> The number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.\n>\n> 但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？\n>\n> 没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。\n\n第六段问是否需要强制，第七段先作无干预仍增长的判断，再以研究数字佐证。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The Catalyst study illustrates the needlessness of government interventions.\n>\n> 作者用Catalyst研究说明此类政府干预的不必要性。\n\nD的政府干预在本题中指这些董事会性别配额。不能将它扩大为任何政府干预都无用，也不必把自然增长说成已经消除所有不平等。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p><code>needlessness of government interventions</code>与第6段的<code>are such government mandates even necessary</code>直接相接，第7段的<code>without government interference</code>又明确写没有干预的情形，因此回看这个问题及随后趋势和研究数据。</p>\n<p>原文先问这种强制规定是否必要，再指出女性董事人数在<code>without government interference</code>的情况下增加，研究进一步给出女性占比增长54%的事实。<code>D</code>的<code>needlessness of government interventions</code>概括的正是这项数据所支持的判断：既然没有政府强制配额也在增长，就没有因此要求政府介入的必要。这里的<code>interventions</code>接着文中的董事会性别配额来理解，并不扩大到政府对所有事项的干预。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But are such government mandates even necessary? Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?\nThe number of women on corporate boards has been steadily increasing without government interference. According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.</p>\n<p>但这样的政府强制规定真的必要吗？企业董事会中女性参与比例目前或许没有对应女性在总人口中的比例，但那又如何？</p>\n<p>没有政府干预，企业董事会中的女性人数也在持续增加。Catalyst的一项研究显示，2010—2015年全球企业董事会中的女性占比增长了54%。</p>\n</blockquote>\n<p>第六段问是否需要强制，第七段先作无干预仍增长的判断，再以研究数字佐证。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Catalyst study illustrates the needlessness of government interventions.</p>\n<p>作者用Catalyst研究说明此类政府干预的不必要性。</p>\n</blockquote>\n<p>D的政府干预在本题中指这些董事会性别配额。不能将它扩大为任何政府干预都无用，也不必把自然增长说成已经消除所有不平等。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. D**\n\n- A：Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。\n- B：宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。\n- C：global corporations是全球企业，研究测量其中女性董事占比。比例增加不等于女性承受的压力被测量或说明。\n- D：研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,1215,1344,84],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"33","questionConclusion":true},"html":"<blockquote>\n<p><strong>33. D</strong></p>\n</blockquote>\n<ul>\n<li>A：Catalyst统计的是女性董事占比增长，作者用来回应是否需要政府强制，未测量武断董事会决策造成的危害。</li>\n<li>B：宪法保障是前面合宪性讨论的内容；研究紧接无干预也增长的判断，支持的是干预必要性之问。</li>\n<li>C：global corporations是全球企业，研究测量其中女性董事占比。比例增加不等于女性承受的压力被测量或说明。</li>\n<li>D：研究证明作者所说无政府干预时女性董事占比也在增长，用于质疑强制配额的必要性，D接住前一段的直接问题。</li>\n</ul>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> Norway’s adoption of a nationwide corporate gender quota has led to ______.\n>\n> 挪威实施全国性的企业性别配额，已经导致______。\n\n### 题型\n\n因果细节题：沿That回指挪威发生的结果，再用合格人选池解释资格与席位之间的脱节。\n\n题干明确给出Norway和nationwide corporate gender quota，第8段末句出现同样的国家与措施，并用That回指前一句的结果。第9段紧接着继续说明董事会任职机会增加后的情况，因此把第8、9段完整读完，核对配额与实际结果之间的联系。\n\n### 核心出处\n\n> will inevitably lead to less experienced private sector boards.\n>\n> That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n>\n> where the same elite women scoop up multiple seats on a variety of boards.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"34","questionIntro":true},"html":"<blockquote>\n<p>Norway’s adoption of a nationwide corporate gender quota has led to ______.</p>\n<p>挪威实施全国性的企业性别配额，已经导致______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>因果细节题：沿That回指挪威发生的结果，再用合格人选池解释资格与席位之间的脱节。</p>\n<p>题干明确给出Norway和nationwide corporate gender quota，第8段末句出现同样的国家与措施，并用That回指前一句的结果。第9段紧接着继续说明董事会任职机会增加后的情况，因此把第8、9段完整读完，核对配额与实际结果之间的联系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>will inevitably lead to less experienced private sector boards.</p>\n<p>That is exactly what happened when Norway adopted a nationwide corporate gender quota.</p>\n<p>where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n"},{"title":"A. the underestimation of elite women’s role","raw":"### A. the underestimation of elite women’s role\n\n> 挪威实行全国企业性别配额导致精英女性的作用被低估。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。\n\n**出处：**\n\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n> Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n</section>"},{"title":"A. the underestimation of elite women’s role","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 挪威实行全国企业性别配额导致精英女性的作用被低估。\n\n`the underestimation of elite women’s role`以精英女性受到怎样的评价为结果，第9段的`the same elite women`也谈到这一群体，因此回看她们实际获得了什么，并连着第8段的`less experienced private sector boards`核对作者所写的后果。\n\n原文先把结果写成私营部门董事会经验较少，再说明`the same elite women`在不同董事会取得多个席位。这里描述的是董事会整体经验和席位集中到谁手里。\n\n`A`的`the underestimation of elite women’s role`则把结果换成他人低估精英女性的作用，是对评价过程的判断。\n\n董事会经验减少并不是说精英女性的作用被人看轻，多个席位集中于她们也没有建立这种低估关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><code>the underestimation of elite women’s role</code>以精英女性受到怎样的评价为结果，第9段的<code>the same elite women</code>也谈到这一群体，因此回看她们实际获得了什么，并连着第8段的<code>less experienced private sector boards</code>核对作者所写的后果。</p>\n<p>原文先把结果写成私营部门董事会经验较少，再说明<code>the same elite women</code>在不同董事会取得多个席位。这里描述的是董事会整体经验和席位集中到谁手里。</p>\n<p><code>A</code>的<code>the underestimation of elite women’s role</code>则把结果换成他人低估精英女性的作用，是对评价过程的判断。</p>\n<p>董事会经验减少并不是说精英女性的作用被人看轻，多个席位集中于她们也没有建立这种低估关系。</p>\n</section>"},{"title":"A. the underestimation of elite women’s role","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n> Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\n>\n> 要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。\n>\n> Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。\n\n第八段介绍性别优先造成的经验问题，第九段说明合格人选池不变却增加席位，结果集中兼任。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The quota has led to the underestimation of elite women’s role.\n>\n> 挪威实行全国企业性别配额导致精英女性的作用被低估。\n\nA需要精英作用没有获得应有认可的判断。多个席位集中在她们身上，并不能证明别人把她们的作用看低。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p><code>the underestimation of elite women’s role</code>以精英女性受到怎样的评价为结果，第9段的<code>the same elite women</code>也谈到这一群体，因此回看她们实际获得了什么，并连着第8段的<code>less experienced private sector boards</code>核对作者所写的后果。</p>\n<p>原文先把结果写成私营部门董事会经验较少，再说明<code>the same elite women</code>在不同董事会取得多个席位。这里描述的是董事会整体经验和席位集中到谁手里。</p>\n<p><code>A</code>的<code>the underestimation of elite women’s role</code>则把结果换成他人低估精英女性的作用，是对评价过程的判断。</p>\n<p>董事会经验减少并不是说精英女性的作用被人看轻，多个席位集中于她们也没有建立这种低估关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n</blockquote>\n<p>第八段介绍性别优先造成的经验问题，第九段说明合格人选池不变却增加席位，结果集中兼任。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quota has led to the underestimation of elite women’s role.</p>\n<p>挪威实行全国企业性别配额导致精英女性的作用被低估。</p>\n</blockquote>\n<p>A需要精英作用没有获得应有认可的判断。多个席位集中在她们身上，并不能证明别人把她们的作用看低。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. the objection to female participation on boards","raw":"### B. the objection to female participation on boards\n\n> 挪威实行全国企业性别配额导致人们反对女性参与董事会。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n作者批评的是把性别作为首要资格的强制安排，未说挪威因此出现反对女性参与董事会的后果。\n\n**出处：**\n\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n> Writing in e elite women scoop up multiple seats on a variety of boards.\n>\n> 要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。\n>\n> Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。\n\n挪威实例先支持经验下降，再引出同一批女性兼任多席，后果仍在董事会资格和席位分配层面。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The quota has led to the growing tension between labor and management.\n>\n> 挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。\n\nD需要劳方与管理层对立并加剧的材料。董事会属于管理结构，只能说明有管理主体，不能据此补出另一方及紧张关系。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>经验较少的是董事会，多个席位集中的是精英女性，文章没有把变化连接到员工与管理层的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。</p>\n</blockquote>\n<p><code>tension between labor and management</code>要求看到劳资双方的关系变化，第8段的<code>less experienced private sector boards</code>和第9段的<code>multiple seats</code>却分别描述董事会经验与席位分配，因此回看这两处政策后果，核对涉及哪些主体。</p>\n<p>原文写配额后果时，主体是经验较少的私营部门董事会以及取得多个席位的同一批精英女性。<code>D</code>的<code>tension between labor and management</code>则把后果改成劳方与资方之间关系紧张。董事会属于企业管理结构，并不使董事会经验或女性席位变化自动成为劳资冲突；原文这两处没有建立劳方与资方彼此对抗、且对抗加剧的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n</blockquote>\n<p>挪威实例先支持经验下降，再引出同一批女性兼任多席，后果仍在董事会资格和席位分配层面。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The quota has led to the growing tension between labor and management.</p>\n<p>挪威实行全国企业性别配额导致劳方与管理层之间紧张加剧。</p>\n</blockquote>\n<p>D需要劳方与管理层对立并加剧的材料。董事会属于管理结构，只能说明有管理主体，不能据此补出另一方及紧张关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. C**\n\n- A：原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。\n- B：作者批评的是把性别作为首要资格的强制安排，未说挪威因此出现反对女性参与董事会的后果。\n- C：性别成为首要资格、合格人选池未同步扩大，却增加任职机会，文中据此指出经验减少。C概括部分进入者任职条件不足这一后果。\n- D：经验较少的是董事会，多个席位集中的是精英女性，文章没有把变化连接到员工与管理层的冲突。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"34","questionConclusion":true},"html":"<blockquote>\n<p><strong>34. C</strong></p>\n</blockquote>\n<ul>\n<li>A：原文写经验减少、同一批精英女性取得多个席位，未写他人低估她们的作用。客观安排与外界评价不是同一后果。</li>\n<li>B：作者批评的是把性别作为首要资格的强制安排，未说挪威因此出现反对女性参与董事会的后果。</li>\n<li>C：性别成为首要资格、合格人选池未同步扩大，却增加任职机会，文中据此指出经验减少。C概括部分进入者任职条件不足这一后果。</li>\n<li>D：经验较少的是董事会，多个席位集中的是精英女性，文章没有把变化连接到员工与管理层的冲突。</li>\n</ul>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n> Which of the following can be inferred from the text?\n>\n> 以下哪项可以从文章中推断出来？\n\n### 题型\n\n全文推断题：综合合法性、必要性、任职条件与实际受益者，选择覆盖整条政策检验的结论。\n\n题干没有指定人物或段落，给出的范围是from the text。前面各题已经读过第1—9段，现在把第10段完整读完，再连同前面有关配额安排、女性董事变化和实际受益者的内容核对选项；本题不预先把推断限定为某一项法案或某个国家。\n\n### 核心出处\n\n> In order to ensure that elite women have more such opportunities\n>\n> set aside 50 percent of board seats for women by 2022.\n>\n> such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"35","questionIntro":true},"html":"<blockquote>\n<p>Which of the following can be inferred from the text?</p>\n<p>以下哪项可以从文章中推断出来？</p>\n</blockquote>\n<h3>题型</h3>\n<p>全文推断题：综合合法性、必要性、任职条件与实际受益者，选择覆盖整条政策检验的结论。</p>\n<p>题干没有指定人物或段落，给出的范围是from the text。前面各题已经读过第1—9段，现在把第10段完整读完，再连同前面有关配额安排、女性董事变化和实际受益者的内容核对选项；本题不预先把推断限定为某一项法案或某个国家。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In order to ensure that elite women have more such opportunities</p>\n<p>set aside 50 percent of board seats for women by 2022.</p>\n<p>such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n"},{"title":"A. Women’s needs in employment should be considered.","raw":"### A. Women’s needs in employment should be considered.\n\n> 从文章可以推断，应考虑女性就业中的需求。\n\n**做题模式中的状态：** 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。\n\n**出处：**\n\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\n> Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-35-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n</section>"},{"title":"A. Women’s needs in employment should be considered.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 从文章可以推断，应考虑女性就业中的需求。\n\n关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。\n\n全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。\n\n不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p>全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。</p>\n<p>不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。</p>\n</section>"},{"title":"A. Women’s needs in employment should be considered.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\n> Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.\n>\n> Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。\n>\n> 下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。\n\n全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Women’s needs in employment should be considered.\n>\n> 从文章可以推断，应考虑女性就业中的需求。\n\n不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p>关注普通女性实际受益与A有联系；但作者不仅谈就业需求，还连续检验法律、必要性、经验和人选条件，B概括的政策可行性更完整。</p>\n<p>全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。</p>\n<p>不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。</p>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female. In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas. If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>Haddad和Lewis担心，超过半数州政府董事会中的女性占比不足40%。为确保精英女性获得更多这类机会，他们提议政府实施配额。若法案成法，州董事会和委员会将须在2022年前为女性预留50%的席位。</p>\n<p>下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。</p>\n</blockquote>\n<p>全文先比较平等目标和受益者，再问能否合法实施、是否需要强制、席位扩张是否有足够合格人选支持。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Women’s needs in employment should be considered.</p>\n<p>从文章可以推断，应考虑女性就业中的需求。</p>\n</blockquote>\n<p>不能把A说成违背关注普通女性的立场。它触及一个方面，B则把这些不同检验共同归为政策能否落实目标，更能回应整篇推断。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Feasibility should be a prime concern in policymaking.","raw":"### B. Feasibility should be a prime concern in policymaking.\n\n> 从文章可以推断，政策可行性应是制定政策的重要考量。\n\n**做题模式中的状态：** 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n法律障碍、无干预时已有进展、合格人选不足与受益集中，都是检验政策能否达到设想的具体条件。B将其归为可行性考量。\n\n**出处：**\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n> Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\n> Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-35-option-B-0","html":"<section class=\"revealPart optionLead\" id n Norway adopted a nationwide corporate gender quota.\n> Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\n> Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.\n>\n> 进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。\n>\n> 美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。\n>\n> 要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。\n>\n> Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。\n>\n> 下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。\n\n作者逐项检查配额措施，而不是仅凭促进平等的口号认可它；末段再比较发起者满足与普通女性所得。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Feasibility should be a prime concern in policymaking.\n>\n> 从文章可以推断，政策可行性应是制定政策的重要考量。\n\na prime concern说重要考量，不是唯一标准。B没有否定平等目标，只要求制定政策时检验现实条件与实施效果。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-B-0\"><blockquote>\n<p>从文章可以推断，政策可行性应是制定政策的重要考量。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法律障碍、无干预时已有进展、合格人选不足与受益集中，都是检验政策能否达到设想的具体条件。B将其归为可行性考量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to section><section class=\"revealPart\" id=\"focus-question-35-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n<p>进步派常支持强制多样性规定，将其视为通向平等和公平竞争的道路。但这些政策太多时候只是不真诚地展示美德，只让最有特权者受益，对普通人帮助很少。</p>\n<p>美国最高法院不赞成基于性别的分类，除非其目的是服务一项重要政策利益。由于加州法律适用于所有董事会，连没有既往歧视历史的也包括在内，法院很可能裁定它违反宪法的平等保护保障。</p>\n<p>要求企业把性别作为董事会任职的首要资格，必然会使私营部门董事会经验较少。挪威实行全国企业性别配额时，恰好发生了这种情况。</p>\n<p>Alice Lee在《新共和》撰文指出，增加董事会任职机会却没有扩大合格女性人选的群体，导致一种金裙现象：同一批精英女性在不同董事会获得多个席位。</p>\n<p>下次有人将企业配额说成促进性别公平的方式时，要记住：这类政策大体是自利措施，让发起者感觉良好，却对普通女性帮助很少。</p>\n</blockquote>\n<p>作者逐项检查配额措施，而不是仅凭促进平等的口号认可它；末段再比较发起者满足与普通女性所得。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Feasibility should be a prime concern in policymaking.</p>\n<p>从文章可以推断，政策可行性应是制定政策的重要考量。</p>\n</blockquote>\n<p>a prime concern说重要考量，不是唯一标准。B没有否定平等目标，只要求制定政策时检验现实条件与实施效果。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. Everyone should try hard to promote social justice.","raw":"### C. Everyone should try hard to promote social justice.\n\n> 从文章可以推断，每个人都应努力促进社会正义。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n文章批评具体政策是否达到公平目标，未向每个人提出努力促进社会正义的普遍行动要求。\n\n**出处：**\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\n> Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\n> Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"m \n\n> 从文章可以推断，每个人都应努力促进社会正义。\n\n`Everyone should try hard`把要求施加给所有人，第1段的`Progressives often support diversity mandates`写的是一部分人怎样支持政策，末段的`self-serving measures`则评价这类政策的结果，因此回看首尾两段，确认作者有没有把讨论扩展为所有人的行动义务。\n\n原文先交代进步派以平等和公平竞争支持多样性规定，再批评政策实际只惠及最享特权者；末段仍围绕`self-serving measures`与普通女性得到的帮助来评价政策。`C`的`Everyone should try hard`把对特定政策及其发起者的评价扩大成所有人促进社会正义的义务，又把关注点从措施实际效果换成人人努力的要求。作者讨论的是这些规定是否实现其目的，不是在向每个人发出努力行动的号召。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-C-0\"><blockquote>\n<p>从文章可以推断，每个人都应努力促进社会正义。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>文章批评具体政策是否达到公平目标，未向每个人提出努力促进社会正义的普遍行动要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\nThe US Supreme Court frowns on sex-based classifications unless they are designed to address an &quot;important&quot; policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;.\nRequiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationwide corporate gender quota.\nWriting in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards.\nNext time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从文章可以推断，每个人都应努力促进社会正义。</p>\n</blockquote>\n<p><code>Everyone should try hard</code>把要求施加给所有人，第1段的<code>Progressives often support diversity mandates</code>写的是一部分人怎样支持政策，末段的<code>self-serving measures</code>则评价这类政策的结果，因此回看首尾两段，确认作者有没有把讨论扩展为所有人的行动义务。</p>\n<p>原文先交代进步派以平等和公平竞争支持多样性规定，再批评政策实际只惠及最享特权者；末段仍围绕<code>self-serving measures</code>与普通女性得到的帮助来评价政策。<code>C</code>的<code>Everyone should try hard</code>把对特定政策及其发起者的评价扩大成所有人促进社会正义的义务，又把关注点从措施实际效果换成人人努力的要求。作者讨论的是这些规定是否实现其目的，不是在向每个人发出努力行动的号召。</p>\n</section>"},{"title":"C. Everyone should try hard to promote social justice.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Progressives often support diversity mandates as a path to equality and a way to level the playing field. But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.\n> The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest. Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".\n> Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards. That is exactly what happened when Norway adopted a nationw
