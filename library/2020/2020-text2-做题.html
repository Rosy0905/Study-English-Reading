<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 26题题干\n\n**Scientific publishing is seen as “a licence to print money” partly because ______.**\n\n> 科学出版被视为“印钞许可证”，部分原因是______。\n\n题型：**原因细节题**。","articleRects":[],"questionRects":[[226,188,1180,41]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"},"html":"<h2>26题题干</h2>\n<p><strong>Scientific publishing is seen as “a licence to print money” partly because ______.</strong></p>\n<blockquote><p>科学出版被视为“印钞许可证”，部分原因是______。</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 27题题干\n\n**According to Paragraphs 2 and 3, scientific publishers like Elsevier have ______.**\n\n> 根据第2、3段，像爱思唯尔这样的科学出版商已经______。\n\n题型：**细节判断题**。","articleRects":[],"questionRects":[[226,557,1196,38],[280,619,74,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"},"html":"<h2>27题题干</h2>\n<p><strong>According to Paragraphs 2 and 3, scientific publishers like Elsevier have ______.</strong></p>\n<blockquote><p>根据第2、3段，像爱思唯尔这样的科学出版商已经______。</p>\n</blockquote>\n<p>题型：<strong>细节判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 28题题干\n\n**How does the author feel about the success of Sci-Hub?**\n\n> 作者如何看待Sci-Hub的成功？\n\n题型：**作者态度题**。","articleRects":[],"questionRects":[[226,986,881,34]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"},"html":"<h2>28题题干</h2>\n<p><strong>How does the author feel about the success of Sci-Hub?</strong></p>\n<blockquote><p>作者如何看待Sci-Hub的成功？</p>\n</blockquote>\n<p>题型：<strong>作者态度题</strong>。</p>\n"},{"section":"先读题干","raw":"## 29题题干\n\n**It can be learned from Paragraphs 5 and 6 that open access terms ______.**\n\n> 从第5、6段可以得知，开放获取条款______。\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,1353,1016,38],[1251,1385,104,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"},"html":"<h2>29题题干</h2>\n<p><strong>It can be learned from Paragraphs 5 and 6 that open access terms ______.</strong></p>\n<blockquote><p>从第5、6段可以得知，开放获取条款______。</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 30题题干\n\n**Which of the following characterises the scientific publishing model?**\n\n> 下列哪一项体现了科学出版模式的特点？\n\n题型：**模式特点概括题**。","articleRects":[],"questionRects":[[226,1720,1070,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"},"html":"<h2>30题题干</h2>\n<p><strong>Which of the following characterises the scientific publishing model?</strong></p>\n<blockquote><p>下列哪一项体现了科学出版模式的特点？</p>\n</blockquote>\n<p>题型：<strong>模式特点概括题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | while, either, Yet |\n| 态度词／评价词 | 先抓个大概好坏 | illegal, successful, cheaper |\n| 动作词 | 先看谁做了什么 | supply, publish, charging |\n| 结果词 | 看最后出了什么事 | profits, costs, status |\n| 重复主题词 | 大概知道老在说什么 | publishing, scientists, universities |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>while, either, Yet</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>illegal, successful, cheaper</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>supply, publish, charging</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>profits, costs, status</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>publishing, scientists, universities</td></tr></tbody></table>\n"},{"section":"读文章","raw":"Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without **[xxx]** reward. Other scientists perform the **[xxx]** work of peer review also for free, because it is a central element in the **[xxx]** of status and the production of scientific knowledge.","articleRects":[[274,284,1122,47],[199,338,1197,37],[202,387,1194,38],[202,436,1194,38],[202,486,515,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without <strong>[xxx]</strong> reward. Other scientists perform the <strong>[xxx]</strong> work of peer review also for free, because it is a central element in the <strong>[xxx]</strong> of status and the production of scientific knowledge.</p>\n</div></div>"},{"section":"读文章","raw":"Scientific publishing has long been a licence to print money. / Scientists need journals in which to publish their research, / so they will supply the articles without **[xxx]** reward. / Other scientists perform the **[xxx]** work of peer review also for free, / because it is a central element in the **[xxx]** of status and the production of scientific knowledge.","articleRects":[[274,284,1122,47],[199,338,1197,37],[202,387,1194,38],[202,436,1194,38],[202,486,515,37]],"questionRects":[],"scrollTarget":"article","meta" 成功、合法获取、在用户中失去正当性、所有参与者。\n\n5、在英国、开放获取出版、非常成功、超过一半、可以免费获取、获得利润。","html":"<div class=\"coarseStack\"><div class=\"coarseDone\"><p>1、科学出版、印钞的许可证、科学家需要期刊、发表他们的研究、其他科学家进行、同行评审、也免费、科学知识。</p>\n</div><div class=\"coarseDone\"><p>2、论文的内容、免费取得、对价格不很敏感、接近40%。</p>\n</div><div class=\"coarseDone\"><p>3、荷兰巨头爱思唯尔、世界上产出的科学论文、获得利润、仅英国大学。</p>\n</div><div class=\"coarseDone\"><p>4、完全非法、科学论文、于2012年建立、这项成功、合法获取、在用户中失去正当性、所有参与者。</p>\n</div><div class=\"coarseDone\"><p>5、在英国、开放获取出版、非常成功、超过一半、可以免费获取、获得利润。</p>\n</div><div class=\"currentFocus\"><p>6、新制度、对大学更便宜一些、对读者免费、向作者收费、准备一篇文章、一直稳步上涨、科学出版模式、社交互联网的经济、劳动被免费提供、获得地位的希望、少数大公司、权力的重新平衡。</p>\n</div></div>"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到科学出版、印钞的许可证、也免费、科学知识；中间又出现论文的内容、免费取得、对价格不很敏感、接近40%；荷兰巨头爱思唯尔、世界上产出的科学论文、获得利润、仅英国大学；完全非法、科学论文、在用户中失去正当性、所有参与者；在英国、开放获取出版、可以免费获取、获得利润；结尾还有新制度、对大学更便宜一些、少数大公司、权力的重新平衡。\n\n到这里还不能自然地说清楚：论文、审稿和获取研究的费用分别由谁承担，新出版方式改变了什么，结尾为何又谈到权力。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到科学出版、印钞的许可证、也免费、科学知识；中间又出现论文的内容、免费取得、对价格不很敏感、接近40%；荷兰巨头爱思唯尔、世界上产出的科学论文、获得利润、仅英国大学；完全非法、科学论文、在用户中失去正当性、所有参与者；在英国、开放获取出版、可以免费获取、获得利润；结尾还有新制度、对大学更便宜一些、少数大公司、权力的重新平衡。</p>\n<p>到这里还不能自然地说清楚：论文、审稿和获取研究的费用分别由谁承担，新出版方式改变了什么，结尾为何又谈到权力。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"26题","raw":"## 26题\n\n> Scientific publishing is seen as “a licence to print money” partly because ______.  \n> 科学出版被视为“印钞许可证”，部分原因是______。\n\n题干的“a licence to print money”直接出现在第1段首句。先从头读完第1段，看看这句话后面怎样解释科学家供稿和同行评审。\n\n> 原文参考：\n> \n> Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without **[xxx]** reward. Other scientists perform the **[xxx]** work of peer review also for free, because it is a central element in the **[xxx]** of status and the production of scientific knowledge.\n> \n> 开始精读：\n> \n> Scientific publishing has long been a licence to print money. / Scientists need journals in which to publish their research, / so they will supply the articles without **[xxx]** reward. / Other scientists perform the **[xxx]** work of peer review also for free, / because it is a central element in the **[xxx]** of status and the production of scientific knowledge.\n> \n> 科学出版长期以来就是一张印钞许可证。 / 科学家需要可以发表自己研究的期刊， / 因此他们会提供文章而不获得**[xxx]**回报。 / 其他科学家也免费进行同行评审的**[xxx]**工作， / 因为它是地位的**[xxx]**以及科学知识生产中的一个核心要素。\n\n题干问科学出版容易赚钱的部分原因。要核对后面科学家为期刊提供什么、获得什么，以及这些做法怎样与出版联系起来。\n\n接下来按A—D逐项看。","articleRects":[[274,284,1122,47],[199,338,1197,37],[202,387,1194,38],[202,436,1194,38],[202,486,515,37]],"questionRects":[[226,188,1180,41],[281,251,648,38],[281,312,656,38],[281,373,612,38],[281,435,571,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"26","initialReadingPids":[0]},"html":"<h2>26题</h2>\n<blockquote><p>Scientific publishing is seen as “a licence to print money” partly because ______.<br />\n科学出版被视为“印钞许可证”，部分原因是______。</p>\n</blockquote>\n<p>题干的“a licence to print money”直接出现在第1段首句。先从头读完第1段，看看这句话后面怎样解释科学家供稿和同行评审。</p>\n<blockquote><p>原文参考：</p>\n<p>Scientific publishing has long been a licence to print money. Scientists need journals in which to publish their research, so they will supply the articles without <strong>[xxx]</strong> reward. Other scientists perform the <strong>[xxx]</strong> work of peer review also for free, because it is a central element in the <strong>[xxx]</strong> of status and the production of scientific knowledge.</p>\n<p>开始精读：</p>\n<p>Scientific publishing has long been a licence to print money. / Scientists need journals in which to publish their research, / so they will supply the articles without <strong>[xxx]</strong> reward. / Other scientists perform the <strong>[xxx]</strong> work of peer review also for free, / because it is a central element in the <strong>[xxx]</strong> of status and the production of scientific knowledge.</p>\n<p>科学出版长期以来就是一张印钞许可证。 / 科学家需要可以发表自己研究的期刊， / 因此他们会提供文章而不获得<strong>[xxx]</strong>回报。 / 其他科学家也免费进行同行评审的<strong>[xxx]</strong>工作， / 因为它是地位的<strong>[xxx]</strong>以及科学知识生产中的一个核心要素。</p>\n</blockquote>\n<p>题干问科学出版容易赚钱的部分原因。要核对后面科学家为期刊提供什么、获得什么，以及这些做法怎样与出版联系起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"26题","raw":"### A. its funding has enjoyed a steady increase\n\n> 它获得的资助一直稳步增加。\n\n把A接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它获得的资助一直稳步增加。\n\nA说资助稳步增加。第1段解释科学出版为何好赚钱，写的是科学家怎样提供论文和评审，我们先看有没有外来的资助。\n\n> Scientists need journals in which to publish their research, so they will supply the articles without **[xxx]** reward.\n\n> Other scientists perform the **[xxx]** work of peer review also for free\n\n科学家需要发表研究，因此提供文章；其他科学家做同行评审也不收钱。这使出版商能够取得论文及评审劳动而不用为它们支付报酬。\n\nA却说出版业得到的资助越来越多。要这样解释赚钱，原文应交代谁提供资金、金额怎样增长；这里写的却是哪些工作免费完成。\n\n不用花钱和得到更多资助都可能使财务有利，但它们不是同一个原因，不能互相替代。\n\n**原段解释的是有人不断增加资助，还是文章与评审劳动免费提供？**\n\n是免费提供。A增加了没有写出的资助及其增长。\n\n**第一轮判断：A排除。**","articleRects":[[274,284,1122,47],[199,338,1197,37],[202,387,1194,38],[202,436,1194,38],[202,486,515,37]],"questionRects":[[281,251,648,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>A. its funding has enjoyed a steady increase</h3>\n<blockquote><p>它获得的资助一直稳步增加。</p>\n</blockquote>\n<p>把A接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它获得的资助一直稳步增加。</p>\n<p>A说资助稳步增加。第1段解释科学出版为何好赚钱，写的是科学家怎样提供论文和评审，我们先看有没有外来的资助。</p>\n<blockquote><p>Scientists need journals in which to publish their research, so they will supply the articles without <strong>[xxx]</strong> reward.</p>\n</blockquote>\n<blockquote><p>Other scientists perform the <strong>[xxx]</strong> work of peer review also for free</p>\n</blockquote>\n<p>科学家需要发表研究，因此提供文章；其他科学家做同行评审也不收钱。这使出版商能够取得论文及评审劳动而不用为它们支付报酬。</p>\n<p>A却说出版业得到的资助越来越多。要这样解释赚钱，原文应交代谁提供资金、金额怎样增长；这里写的却是哪些工作免费完成。</p>\n<p>不用花钱和得到更多资助都可能使财务有利，但它们不是同一个原因，不能互相替代。</p>\n<p><strong>原段解释的是有人不断增加资助，还是文章与评审劳动免费提供？</strong></p>\n<p>是免费提供。A增加了没有写出的资助及其增长。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"26题","raw":"### B. its marketing strategy has been successful\n\n> 它的营销策略很成功。\n\n把B接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它的营销策略很成功。\n\nB说营销策略成功。第2段确实写出版商需要找市场，我们把它放回`With the content ... for free`后面读。\n\n> 原文参考：\n> \n> With the content of papers secured for free, the publisher needs only to find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers **[xxx]** report profit **[xxx]** approaching 40% on their operations, at a time when the rest of the publishing industry is in an **[xxx]** crisis.\n> \n> 开始精读：\n> \n> With the content of papers secured for free, / the publisher needs only to find a market for its journal. / Until this century, / university libraries were not very price sensitive. / Scientific publishers **[xxx]** report profit **[xxx]** approaching 40% on their operations, / at a time when the rest of the publishing industry is in an **[xxx]** crisis.\n> \n> 论文内容已经免费取得， / 出版商只需要为自己的期刊找到市场。 / 直到本世纪以前， / 大学图书馆对价格不太敏感。 / 科学出版商**[xxx]**报告，其经营的利润**[xxx]**接近40%， / 而此时出版业的其余部分正陷入一场**[xxx]**危机。\n\n> With the content of papers secured for free, the publisher needs only to find a market for its journal.\n\n> Until this century, university libraries were not very price sensitive.\n\n先免费拿到论文内容，出版商才只需为期刊寻找市场。作者把“只需”写在这里，是突出前面的生产劳动不必自己付费。\n\n随后说大学图书馆对价格不太敏感，说明买方愿意承受价格。它没有介绍出版商使用了哪项广告、推销或市场策略。\n\n找到愿意付费的买方，并不等于文中已经把成功归功于高明营销。B把买方的需求和价格态度换成了卖方的营销功劳。\n\n**原文说有不太在意价格的图书馆买方，就等于证明出版商的营销策略成功吗？**\n\n不等于。作者没有给出这种策略，明确说出的有利条件是免费内容和买方需求。\n\n**第一轮判断：B排除。**","articleRects":[[274,535,1122,38],[202,584,1193,38],[202,634,1194,37],[200,683,1196,38],[202,732,290,31]],"questionRects":[[281,312,656,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"26","initialReadingPids":[1],"paragraphPids":[1]},"html":"<h3>B. its marketing strategy has been successful</h3>\n<blockquote><p>它的营销策略很成功。</p>\n</blockquote>\n<p>把B接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它的营销策略很成功。</p>\n<p>B说营销策略成功。第2段确实写出版商需要找市场，我们把它放回<code>With the content ... for free</code>后面读。</p>\n<blockquote><p>原文参考：</p>\n<p>With the content of papers secured for free, the publisher needs only to find a market for its journal. Until this century, university libraries were not very price sensitive. Scientific publishers <strong>[xxx]</strong> report profit <strong>[xxx]</strong> approaching 40% on their operations, at a time when the rest of the publishing industry is in an <strong>[xxx]</strong> crisis.</p>\n<p>开始精读：</p>\n<p>With the content of papers secured for free, / the publisher needs only to find a market for its journal. / Until this century, / university libraries were not very price sensitive. / Scientific publishers <strong>[xxx]</strong> report profit <strong>[xxx]</strong> approaching 40% on their operations, / at a time when the rest of the publishing industry is in an <strong>[xxx]</strong> crisis.</p>\n<p>论文内容已经免费取得， / 出版商只需要为自己的期刊找到市场。 / 直到本世纪以前， / 大学图书馆对价格不太敏感。 / 科学出版商<strong>[xxx]</strong>报告，其经营的利润<strong>[xxx]</strong>接近40%， / 而此时出版业的其余部分正陷入一场<strong>[xxx]</strong>危机。</p>\n</blockquote>\n<blockquote><p>With the content of papers secured for free, the publisher needs only to find a market for its journal.</p>\n</blockquote>\n<blockquote><p>Until this century, university libraries were not very price sensitive.</p>\n</blockquote>\n<p>先免费拿到论文内容，出版商才只需为期刊寻找市场。作者把“只需”写在这里，是突出前面的生产劳动不必自己付费。</p>\n<p>随后说大学图书馆对价格不太敏感，说明买方愿意承受价格。它没有介绍出版商使用了哪项广告、推销或市场策略。</p>\n<p>找到愿意付费的买方，并不等于文中已经把成功归功于高明营销。B把买方的需求和价格态度换成了卖方的营销功劳。</p>\n<p><strong>原文说有不太在意价格的图书馆买方，就等于证明出版商的营销策略成功吗？</strong></p>\n<p>不等于。作者没有给出这种策略，明确说出的有利条件是免费内容和买方需求。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"26题","raw":"### C. its payment for peer review is reduced\n\n> 它为同行评审支付的费用减少了。\n\n把C接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它为同行评审支付的费用减少了。\n\nC说同行评审费用减少。原文有`also for free`，我们看它写的是当前不用付钱，还是从原来较高费用降下来。\n\n> Other scientists perform the **[xxx]** work of peer review also for free\n\n科学家做同行评审也是免费的。这里没有先给一个过去的收费标准，再说出版商后来压低了它。\n\nC的`is reduced`说费用被减少，包含前后变化；`for free`只说评审劳动不收取报酬。\n\n而且，作者解释的是论文和评审都由科学家免费供给的运作方式。不能替这套方式加上曾经付费、如今减少的过程。\n\n**同行评审本来就在这里被说成免费，是否等于原文交代了评审费用下降？**\n\n不等于。C把免费状态改成了未出现的费用变化。\n\n**第一轮判断：C排除。**","articleRects":[[274,284,1122,47],[199,338,1197,37],[202,387,1194,38],[202,436,1194,38],[202,486,515,37]],"questionRects":[[281,373,612,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>C. its payment for peer review is reduced</h3>\n<blockquote><p>它为同行评审支付的费用减少了。</p>\n</blockquote>\n<p>把C接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它为同行评审支付的费用减少了。</p>\n<p>C说同行评审费用减少。原文有<code>also for free</code>，我们看它写的是当前不用付钱，还是从原来较高费用降下来。</p>\n<blockquote><p>Other scientists perform the <strong>[xxx]</strong> work of peer review also for free</p>\n</blockquote>\n<p>科学家做同行评审也是免费的。这里没有先给一个过去的收费标准，再说出版商后来压低了它。</p>\n<p>C的<code>is reduced</code>说费用被减少，包含前后变化；<code>for free</code>只说评审劳动不收取报酬。</p>\n<p>而且，作者解释的是论文和评审都由科学家免费供给的运作方式。不能替这套方式加上曾经付费、如今减少的过程。</p>\n<p><strong>同行评审本来就在这里被说成免费，是否等于原文交代了评审费用下降？</strong></p>\n<p>不等于。C把免费状态改成了未出现的费用变化。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"26题","raw":"### D. its content **[xxx]** costs nothing\n\n> 它的内容**[xxx]**不花钱。\n\n把D接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它的内容**[xxx]**不花钱。\n\nD的内容后有词未读懂，但`costs nothing`清楚。第2段直接有`content of papers secured for free`，我们先把这一已知部分对上。\n\n> With the content of papers secured for free, the publisher needs only to find a market for its journal.\n\n出版商获得论文内容是免费的。第1段已经解释原因：科学家为了发表而提供论文，同行科学家又免费评审。\n\n所以，期刊最主要的内容与审查劳动不是像普通商品那样由出版商付钱采购。再有市场愿意为期刊付费，就形成了作者说的赚钱条件。\n\nD中那个**[xxx]**仍不必猜，但“内容这一环不花钱”有原句直接支撑，能作为印钞般获利的原因。\n\n**原文明说论文内容免费取得，能否支持D已知的`content ... costs nothing`？**\n\n能。D的核心说法与免费的内容来源一致，先保留，不补译遮挡词。\n\n**第一轮判断：D保留。**","articleRects":[[274,535,1122,38],[202,584,1193,38],[202,634,1194,37],[200,683,1196,38],[202,732,290,31]],"questionRects":[[281,435,571,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"26","paragraphPids":[1]},"html":"<h3>D. its content <strong>[xxx]</strong> costs nothing</h3>\n<blockquote><p>它的内容<strong>[xxx]</strong>不花钱。</p>\n</blockquote>\n<p>把D接回题干，它说的是：科学出版被视为“印钞许可证”，部分原因是它的内容<strong>[xxx]</strong>不花钱。</p>\n<p>D的内容后有词未读懂，但<code>costs nothing</code>清楚。第2段直接有<code>content of papers secured for free</code>，我们先把这一已知部分对上。</p>\n<blockquote><p>With the content of papers secured for free, the publisher needs only to find a market for its journal.</p>\n</blockquote>\n<p>出版商获得论文内容是免费的。第1段已经解释原因：科学家为了发表而提供论文，同行科学家又免费评审。</p>\n<p>所以，期刊最主要的内容与审查劳动不是像普通商品那样由出版商付钱采购。再有市场愿意为期刊付费，就形成了作者说的赚钱条件。</p>\n<p>D中那个<strong>[xxx]</strong>仍不必猜，但“内容这一环不花钱”有原句直接支撑，能作为印钞般获利的原因。</p>\n<p><strong>原文明说论文内容免费取得，能否支持D已知的<code>content ... costs nothing</code>？</strong></p>\n<p>能。D的核心说法与免费的内容来源一致，先保留，不补译遮挡词。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"26题","raw":"### 26题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。原文直接说论文内容免费取得，并以此解释出版商只需寻找市场。","articleRects":[],"questionRects":[[226,188,1180,41],[281,251,648,38],[281,312,656,38],[281,373,612,38],[281,435,571,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"26"},"html":"<h3>26题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。原文直接说论文内容免费取得，并以此解释出版商只需寻找市场。</p>\n"},{"section":"27题","raw":"## 27题\n\n> According to Paragraphs 2 and 3, scientific publishers like Elsevier have ______.  \n> 根据第2、3段，像爱思唯尔这样的科学出版商已经______。\n\n题干明确指定Paragraphs 2 and 3，直接回到第2、3段。第2段已经完整读过，再把第3段从荷兰出版商的介绍一直读到两项数字的变化。\n\n> 原文参考：\n> \n> The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise **[xxx]** despite increasingly **[xxx]** efforts to change them.\n> \n> 开始精读：\n> \n> The Dutch giant Elsevier, / which claims to publish 25% of the scientific papers produced in the world, / made profits of more than £900m last year, / while UK universities alone spent more than £210m in 2016 / to enable researchers to access their own publicly funded research; / both figures seem to rise **[xxx]** / despite increasingly **[xxx]** efforts to change them.\n> \n> 荷兰巨头爱思唯尔， / 自称出版了世界上产出的科学论文的25%， / 去年获得了超过£900m的利润， / 而仅英国大学在2016年就花费了超过£210m， / 使研究者能够获取他们自己的、由公共资金资助的研究； / 这两个数字似乎都在**[xxx]**地上升， / 尽管为改变它们所做的努力越来越**[xxx]**。\n\n题干以科学出版商为主语，要求把第2、3段关于它们的经营、利润及大学支出的事实接成一个成立的判断。\n\n接下来按A—D逐项看。","articleRects":[[273,781,1122,38],[202,831,1194,38],[202,880,1194,38],[202,930,1194,37],[202,979,782,38]],"questionRects":[[226,557,1196,38],[280,619,74,30],[280,680,591,37],[280,741,530,37],[280,802,499,38],[280,863,510,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"27","initialReadingPids":[2]},"html":"<h2>27题</h2>\n<blockquote><p>According to Paragraphs 2 and 3, scientific publishers like Elsevier have ______.<br />\n根据第2、3段，像爱思唯尔这样的科学出版商已经______。</p>\n</blockquote>\n<p>题干明确指定Paragraphs 2 and 3，直接回到第2、3段。第2段已经完整读过，再把第3段从荷兰出版商的介绍一直读到两项数字的变化。</p>\n<blockquote><p>原文参考：</p>\n<p>The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise <strong>[xxx]</strong> despite increasingly <strong>[xxx]</strong> efforts to change them.</p>\n<p>开始精读：</p>\n<p>The Dutch giant Elsevier, / which claims to publish 25% of the scientific papers produced in the world, / made profits of more than £900m last year, / while UK universities alone spent more than £210m in 2016 / to enable researchers to access their own publicly funded research; / both figures seem to rise <strong>[xxx]</strong> / despite increasingly <strong>[xxx]</strong> efforts to change them.</p>\n<p>荷兰巨头爱思唯尔， / 自称出版了世界上产出的科学论文的25%， / 去年获得了超过£900m的利润， / 而仅英国大学在2016年就花费了超过£210m， / 使研究者能够获取他们自己的、由公共资金资助的研究； / 这两个数字似乎都在<strong>[xxx]</strong>地上升， / 尽管为改变它们所做的努力越来越<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>题干以科学出版商为主语，要求把第2、3段关于它们的经营、利润及大学支出的事实接成一个成立的判断。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"27题","raw":"### A. thrived mainly on university libraries\n\n> 主要依靠大学图书馆而兴旺发展。\n\n把A接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商主要依靠大学图书馆而兴旺发展。\n\nA说主要靠大学图书馆兴旺。第2段说买方不敏感，第3段紧接大学付款与出版商利润，我们把钱从谁那里到谁那里看清。\n\n> Until this century, university libraries were not very price sensitive.\n\n> Scientific publishers **[xxx]** report profit **[xxx]** approaching 40% on their operations\n\n> made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research\n\n出版商有免费内容，市场的一方是大学图书馆，它们过去对价格不太敏感。出版商因此能在别的出版行业陷入危机时仍有很高利润。\n\n第3段又将爱思唯尔超过9亿英镑利润，与英国大学为访问自身资助的研究支付超过2.1亿英镑并列。\n\n这两段不是随便各报一个数字，而是在说明大学为访问研究持续付费，出版商从这种需求中获利。A所说大学图书馆是重要生意来源，可以接上。\n\n**大学及其图书馆不断为访问研究支付费用，与出版商的高利润能否接成A说的依靠关系？**\n\n能。两段共同说明了大学这一市场如何支持出版商获利。\n\n**第一轮判断：A保留。**","articleRects":[[274,535,1122,38],[202,584,1193,38],[202,634,1194,37],[200,683,1196,38],[202,732,290,31],[273,781,1122,38],[202,831,1194,38],[202,880,1194,38],[202,930,1194,37],[202,979,782,38]],"questionRects":[[280,680,591,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"27","paragraphPids":[1,2]},"html":"<h3>A. thrived mainly on university libraries</h3>\n<blockquote><p>主要依靠大学图书馆而兴旺发展。</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商主要依靠大学图书馆而兴旺发展。</p>\n<p>A说主要靠大学图书馆兴旺。第2段说买方不敏感，第3段紧接大学付款与出版商利润，我们把钱从谁那里到谁那里看清。</p>\n<blockquote><p>Until this century, university libraries were not very price sensitive.</p>\n</blockquote>\n<blockquote><p>Scientific publishers <strong>[xxx]</strong> report profit <strong>[xxx]</strong> approaching 40% on their operations</p>\n</blockquote>\n<blockquote><p>made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research</p>\n</blockquote>\n<p>出版商有免费内容，市场的一方是大学图书馆，它们过去对价格不太敏感。出版商因此能在别的出版行业陷入危机时仍有很高利润。</p>\n<p>第3段又将爱思唯尔超过9亿英镑利润，与英国大学为访问自身资助的研究支付超过2.1亿英镑并列。</p>\n<p>这两段不是随便各报一个数字，而是在说明大学为访问研究持续付费，出版商从这种需求中获利。A所说大学图书馆是重要生意来源，可以接上。</p>\n<p><strong>大学及其图书馆不断为访问研究支付费用，与出版商的高利润能否接成A说的依靠关系？</strong></p>\n<p>能。两段共同说明了大学这一市场如何支持出版商获利。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"27题","raw":"### B. gone through an **[xxx]** crisis\n\n> 经历了一场**[xxx]**危机。\n\n把B接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商经历了一场**[xxx]**危机。\n\nB说这些科学出版商经历危机。第2段末也有`crisis`，我们先读它前面的`the rest of the publishing industry`。\n\n> Scientific publishers **[xxx]** report profit **[xxx]** approaching 40% on their operations, at a time when the rest of the publishing industry is in an **[xxx]** crisis.\n\n危机属于出版行业的其他部分，科学出版商则在同一时期报告接近40%的利润。\n\n`at a time when`把二者并列，是让我们看出同处一个时代，科学出版商与其他出版行业的处境不同。\n\nB虽然有个修饰词未认识，但已知的“这些科学出版商经历危机”就接错了主语，不能因为原文出现危机就选。\n\n**陷入危机的是科学出版商这一方，还是出版行业的其他部分？**\n\n是其他部分。B把对照中的另一方的处境挪了过来。\n\n**第一轮判断：B排除。**","articleRects":[[274,535,1122,38],[202,584,1193,38],[202,634,1194,37],[200,683,1196,38],[202,732,290,31]],"questionRects":[[280,741,530,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>B. gone through an <strong>[xxx]</strong> crisis</h3>\n<blockquote><p>经历了一场<strong>[xxx]</strong>危机。</p>\n</blockquote>\n<p>把B接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商经历了一场<strong>[xxx]</strong>危机。</p>\n<p>B说这些科学出版商经历危机。第2段末也有<code>crisis</code>，我们先读它前面的<code>the rest of the publishing industry</code>。</p>\n<blockquote><p>Scientific publishers <strong>[xxx]</strong> report profit <strong>[xxx]</strong> approaching 40% on their operations, at a time when the rest of the publishing industry is in an <strong>[xxx]</strong> crisis.</p>\n</blockquote>\n<p>危机属于出版行业的其他部分，科学出版商则在同一时期报告接近40%的利润。</p>\n<p><code>at a time when</code>把二者并列，是让我们看出同处一个时代，科学出版商与其他出版行业的处境不同。</p>\n<p>B虽然有个修饰词未认识，但已知的“这些科学出版商经历危机”就接错了主语，不能因为原文出现危机就选。</p>\n<p><strong>陷入危机的是科学出版商这一方，还是出版行业的其他部分？</strong></p>\n<p>是其他部分。B把对照中的另一方的处境挪了过来。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"27题","raw":"### C. revived the publishing industry\n\n> 使出版业复苏了。\n\n把C接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商使出版业复苏了。\n\nC说科学出版商让整个出版业复苏。原文只将它们的高利润与其他出版业危机对照，我们看有没有写带动其他行业。\n\n> Scientific publishers **[xxx]** report profit **[xxx]** approaching 40% on their operations, at a time when the rest of the publishing industry is in an **[xxx]** crisis.\n\n科学出版商的利润很高，其他出版行业却在危机中。这两个事实可以同时存在，不要求其中一个已改变另一个。\n\nC加入`revived`，要科学出版商使整个行业从危机中恢复。原文没有出现这种作用或后来的复苏结果。\n\n一部分出版商赚钱，不等于其他出版商也被它们带好，更不能把原来仍存在的危机读成已被解决。\n\n**科学出版商自己利润高，就能说明它们已经使其他出版业复苏吗？**\n\n不能。原文没有这样的带动关系，还明确写着其他部分处于危机。\n\n**第一轮判断：C排除。**","articleRects":[[274,535,1122,38],[202,584,1193,38],[202,634,1194,37],[200,683,1196,38],[202,732,290,31]],"questionRects":[[280,802,499,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>C. revived the publishing industry</h3>\n<blockquote><p>使出版业复苏了。</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商使出版业复苏了。</p>\n<p>C说科学出版商让整个出版业复苏。原文只将它们的高利润与其他出版业危机对照，我们看有没有写带动其他行业。</p>\n<blockquote><p>Scientific publishers <strong>[xxx]</strong> report profit <strong>[xxx]</strong> approaching 40% on their operations, at a time when the rest of the publishing industry is in an <strong>[xxx]</strong> crisis.</p>\n</blockquote>\n<p>科学出版商的利润很高，其他出版行业却在危机中。这两个事实可以同时存在，不要求其中一个已改变另一个。</p>\n<p>C加入<code>revived</code>，要科学出版商使整个行业从危机中恢复。原文没有出现这种作用或后来的复苏结果。</p>\n<p>一部分出版商赚钱，不等于其他出版商也被它们带好，更不能把原来仍存在的危机读成已被解决。</p>\n<p><strong>科学出版商自己利润高，就能说明它们已经使其他出版业复苏吗？</strong></p>\n<p>不能。原文没有这样的带动关系，还明确写着其他部分处于危机。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"27题","raw":"### D. financed researchers generously\n\n> 慷慨地资助了研究者。\n\n把D接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商慷慨地资助了研究者。\n\nD说出版商慷慨资助研究者。第3段有`spent ... to enable researchers to access`，我们先找出付款者。\n\n> while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research\n\n支付超过2.1亿英镑的是英国大学，目的是让研究者访问自己公共资金资助的研究。出版商一侧则取得高额利润。\n\n所以，这里不是出版商拿钱支持研究者，而是大学要为研究者获得阅读权限付款。\n\nD把收钱和付钱的方向倒过来。`publicly funded research`也不能读成由出版商出钱的研究。\n\n**第3段为研究者访问论文付钱的是大学，还是出版商在资助研究者？**\n\n是大学。D把资金方向说反了。\n\n**第一轮判断：D排除。**","articleRects":[[273,781,1122,38],[202,831,1194,38],[202,880,1194,38],[202,930,1194,37],[202,979,782,38]],"questionRects":[[280,863,510,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"27","paragraphPids":[2]},"html":"<h3>D. financed researchers generously</h3>\n<blockquote><p>慷慨地资助了研究者。</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第2、3段，像爱思唯尔这样的科学出版商慷慨地资助了研究者。</p>\n<p>D说出版商慷慨资助研究者。第3段有<code>spent ... to enable researchers to access</code>，我们先找出付款者。</p>\n<blockquote><p>while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research</p>\n</blockquote>\n<p>支付超过2.1亿英镑的是英国大学，目的是让研究者访问自己公共资金资助的研究。出版商一侧则取得高额利润。</p>\n<p>所以，这里不是出版商拿钱支持研究者，而是大学要为研究者获得阅读权限付款。</p>\n<p>D把收钱和付钱的方向倒过来。<code>publicly funded research</code>也不能读成由出版商出钱的研究。</p>\n<p><strong>第3段为研究者访问论文付钱的是大学，还是出版商在资助研究者？</strong></p>\n<p>是大学。D把资金方向说反了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"27题","raw":"### 27题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。大学图书馆的价格态度与大学购买研究的支出，支持它们是出版商盈利的重要购买方；“主要依靠”仍带有推断。","articleRects":[],"questionRects":[[226,557,1196,38],[280,619,74,30],[280,680,591,37],[280,741,530,37],[280,802,499,38],[280,863,510,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"27"},"html":"<h3>27题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。大学图书馆的价格态度与大学购买研究的支出，支持它们是出版商盈利的重要购买方；“主要依靠”仍带有推断。</p>\n"},{"section":"28题","raw":"## 28题\n\n> How does the author feel about the success of Sci-Hub?  \n> 作者如何看待Sci-Hub的成功？\n\n题干点名Sci-Hub及其success，第4段同时出现这个名称和The success of Sci-Hub。先完整精读第4段，区分对这一做法的描述与作者从它的成功得到的判断。\n\n> 原文参考：\n> \n> The most drastic, and thoroughly illegal, reaction has been the **[xxx]** of Sci-Hub, a kind of global **[xxx]** for scientific papers, set up in 2012, which now claims to offer access to every **[xxx]** article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n> \n> 开始精读：\n> \n> The most drastic, and thoroughly illegal, reaction has been the **[xxx]** of Sci-Hub, / a kind of global **[xxx]** for scientific papers, / set up in 2012, / which now claims to offer access to every **[xxx]** article published since 2015. / The success of Sci-Hub, / which relies on researchers passing on copies they have themselves legally accessed, / shows the legal ecosystem has lost legitimacy among its users / and must be transformed so that it works for all participants.\n> \n> 最激烈且完全非法的反应，是Sci-Hub的**[xxx]**， / 它是一种供科学论文使用的全球性**[xxx]**， / 于2012年建立， / 现在自称能让人获取2015年以来发表的每一篇**[xxx]**文章。 / Sci-Hub的成功， / 依靠的是研究者传递他们自己合法获取的副本， / 表明合法的生态体系在其用户中已经失去正当性， / 而且必须经过改造，使它为所有参与者发挥作用。\n\n本题问作者看待Sci-Hub成功时的态度，需要检查他怎样评价这项反应，又怎样解释成功所反映的问题。\n\n接下来按A—D逐项看。","articleRects":[[273,1028,1125,38],[203,1078,1188,37],[202,1127,1184,38],[202,1176,1194,38],[202,1226,1194,37],[202,1275,1021,37]],"questionRects":[[226,986,881,34],[280,1047,185,30],[280,1108,169,31],[280,1169,210,31],[280,1231,228,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"28","initialReadingPids":[3]},"html":"<h2>28题</h2>\n<blockquote><p>How does the author feel about the success of Sci-Hub?<br />\n作者如何看待Sci-Hub的成功？</p>\n</blockquote>\n<p>题干点名Sci-Hub及其success，第4段同时出现这个名称和The success of Sci-Hub。先完整精读第4段，区分对这一做法的描述与作者从它的成功得到的判断。</p>\n<blockquote><p>原文参考：</p>\n<p>The most drastic, and thoroughly illegal, reaction has been the <strong>[xxx]</strong> of Sci-Hub, a kind of global <strong>[xxx]</strong> for scientific papers, set up in 2012, which now claims to offer access to every <strong>[xxx]</strong> article published since 2015. The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n<p>开始精读：</p>\n<p>The most drastic, and thoroughly illegal, reaction has been the <strong>[xxx]</strong> of Sci-Hub, / a kind of global <strong>[xxx]</strong> for scientific papers, / set up in 2012, / which now claims to offer access to every <strong>[xxx]</strong> article published since 2015. / The success of Sci-Hub, / which relies on researchers passing on copies they have themselves legally accessed, / shows the legal ecosystem has lost legitimacy among its users / and must be transformed so that it works for all participants.</p>\n<p>最激烈且完全非法的反应，是Sci-Hub的<strong>[xxx]</strong>， / 它是一种供科学论文使用的全球性<strong>[xxx]</strong>， / 于2012年建立， / 现在自称能让人获取2015年以来发表的每一篇<strong>[xxx]</strong>文章。 / Sci-Hub的成功， / 依靠的是研究者传递他们自己合法获取的副本， / 表明合法的生态体系在其用户中已经失去正当性， / 而且必须经过改造，使它为所有参与者发挥作用。</p>\n</blockquote>\n<p>本题问作者看待Sci-Hub成功时的态度，需要检查他怎样评价这项反应，又怎样解释成功所反映的问题。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"28题","raw":"### A. Relieved.\n\n> 感到宽慰。\n\n把A接回题干，它说的是：作者对Sci-Hub的成功感到宽慰。\n\nA说作者宽慰。第4段说Sci-Hub成功后，紧跟的是体系失去认可、必须改变，我们看问题是否因此已被解决。\n\n> shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n\n作者先明确说这种反应彻底违法，再指出它的成功表明合法体系在用户中失去正当性。这里成功暴露了用户与现行体系的裂缝。\n\n接着要求体系必须改造，才能为各参与者服务。`must be transformed`说明该做的改变还在前面。\n\nA的宽慰通常需要问题缓和、压力解除；作者这里却从成功中看出更迫切的制度问题，没有写自己因此放心。\n\n**Sci-Hub成功让作者看到合法体系失去认可、亟须改变，这是问题已经缓解而让人宽慰吗？**\n\n不是。作者强调的是仍未解决、必须改造的问题。\n\n**第一轮判断：A排除。**","articleRects":[[273,1028,1125,38],[203,1078,1188,37],[202,1127,1184,38],[202,1176,1194,38],[202,1226,1194,37],[202,1275,1021,37]],"questionRects":[[280,1047,185,30]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>A. Relieved.</h3>\n<blockquote><p>感到宽慰。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对Sci-Hub的成功感到宽慰。</p>\n<p>A说作者宽慰。第4段说Sci-Hub成功后，紧跟的是体系失去认可、必须改变，我们看问题是否因此已被解决。</p>\n<blockquote><p>shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n<p>作者先明确说这种反应彻底违法，再指出它的成功表明合法体系在用户中失去正当性。这里成功暴露了用户与现行体系的裂缝。</p>\n<p>接着要求体系必须改造，才能为各参与者服务。<code>must be transformed</code>说明该做的改变还在前面。</p>\n<p>A的宽慰通常需要问题缓和、压力解除；作者这里却从成功中看出更迫切的制度问题，没有写自己因此放心。</p>\n<p><strong>Sci-Hub成功让作者看到合法体系失去认可、亟须改变，这是问题已经缓解而让人宽慰吗？</strong></p>\n<p>不是。作者强调的是仍未解决、必须改造的问题。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"28题","raw":"### B. Puzzled.\n\n> 感到困惑。\n\n把B接回题干，它说的是：作者对Sci-Hub的成功感到困惑。\n\nB说作者困惑。原文直接用`shows`解释Sci-Hub成功意味着什么，我们看作者是否不明白这种成功。\n\n> The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users\n\nSci-Hub依靠研究者转交他们合法获得的副本，作者先说明它怎样运作，再判断其成功显示合法体系失去用户认可。\n\n他不仅给了原因和含义，还提出应把体系改到能够服务所有参与者。这里没有说自己无法理解成功为何出现。\n\nB把严肃的担忧误当成困惑。一个人认为现状有问题，并不等于他不知道问题在何处。\n\n**作者已经解释成功如何发生、说明了什么，还能概括成困惑不解吗？**\n\n不能。原段有明确解释和改革要求，B不合适。\n\n**第一轮判断：B排除。**","articleRects":[[273,1028,1125,38],[203,1078,1188,37],[202,1127,1184,38],[202,1176,1194,38],[202,1226,1194,37],[202,1275,1021,37]],"questionRects":[[280,1108,169,31]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>B. Puzzled.</h3>\n<blockquote><p>感到困惑。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对Sci-Hub的成功感到困惑。</p>\n<p>B说作者困惑。原文直接用<code>shows</code>解释Sci-Hub成功意味着什么，我们看作者是否不明白这种成功。</p>\n<blockquote><p>The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users</p>\n</blockquote>\n<p>Sci-Hub依靠研究者转交他们合法获得的副本，作者先说明它怎样运作，再判断其成功显示合法体系失去用户认可。</p>\n<p>他不仅给了原因和含义，还提出应把体系改到能够服务所有参与者。这里没有说自己无法理解成功为何出现。</p>\n<p>B把严肃的担忧误当成困惑。一个人认为现状有问题，并不等于他不知道问题在何处。</p>\n<p><strong>作者已经解释成功如何发生、说明了什么，还能概括成困惑不解吗？</strong></p>\n<p>不能。原段有明确解释和改革要求，B不合适。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"28题","raw":"### C. Concerned.\n\n> 感到担忧。\n\n把C接回题干，它说的是：作者对Sci-Hub的成功感到担忧。\n\nC说担忧。我们回到成功后面的`has lost legitimacy`和`must be transformed`，看作者关注的是什么。\n\n> shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n\n用户大量通过非法途径获得论文，说明合法体系虽然存在，却已经不再被这些用户视为合理。作者把Sci-Hub成功当成这个问题的信号。\n\n他进一步要求改造体系，使它为所有参与者服务，说明目前利益安排还没有做到这一点。\n\nC的担忧落在这种成功所暴露的失衡上，并不是担心读者读到知识太多。这样才接得上作者明说的体系问题。\n\n**作者由成功指出合法体系失去用户认可、必须改变，能否看出他对这个问题的担忧？**\n\n能。C对应作者明确点出的严重问题，先留下。\n\n**第一轮判断：C保留。**","articleRects":[[273,1028,1125,38],[203,1078,1188,37],[202,1127,1184,38],[202,1176,1194,38],[202,1226,1194,37],[202,1275,1021,37]],"questionRects":[[280,1169,210,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"28","paragraphPids":[3]},"html":"<h3>C. Concerned.</h3>\n<blockquote><p>感到担忧。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者对Sci-Hub的成功感到担忧。</p>\n<p>C说担忧。我们回到成功后面的<code>has lost legitimacy</code>和<code>must be transformed</code>，看作者关注的是什么。</p>\n<blockquote><p>shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n<p>用户大量通过非法途径获得论文，说明合法体系虽然存在，却已经不再被这些用户视为合理。作者把Sci-Hub成功当成这个问题的信号。</p>\n<p>他进一步要求改造体系，使它为所有参与者服务，说明目前利益安排还没有做到这一点。</p>\n<p>C的担忧落在这种成功所暴露的失衡上，并不是担心读者读到知识太多。这样才接得上作者明说的体系问题。</p>\n<p><strong>作者由成功指出合法体系失去用户认可、必须改变，能否看出他对这个问题的担忧？</strong></p>\n<p>能。C对应作者明确点出的严重问题，先留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"28题","raw":"### D. Encouraged.\n\n> 受到鼓舞。\n\n把D接回题干，它说的是：作者对Sci-Hub的成功受到鼓舞。\n\nD说受到鼓舞。第4段既有用户对旧体系的反应，也有必须改革的要求，我们先看这能否理解成改变的机会。\n\n> The most drastic, and thoroughly illegal, reaction has been the **[xxx]** of Sci-Hub\n\n> shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.\n\nSci-Hub的成功说明许多用户不再接受旧体系，作者也认为体系必须改造。从这个角度，用户的反应可能给改革形成压力。\n\n但形成压力与作者因此振奋还隔着一步：作者是否把这种成功看成已经带来更公平的安排，原段没有直接说。\n\n现在先把D与C留下。后面还会谈开放获取，我们继续看作者对新做法的成功，是强调它解决了问题，还是仍担心原来的利益关系。\n\n**成功可能形成改革压力，但作者是否已经由此感到问题有希望解决，当前这一段说清了吗？**\n\n还没完全说清。D先保留，再与C核对后面的费用和权力问题。\n\n**第一轮判断：D保留。**","articleRects":[[273,1028,1125,38],[203,1078,1188,37],[202,1127,1184,38],[202,1176,1194,38],[202,1226,1194,37],[202,1275,1021,37]],"questionRects":[[280,1231,228,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"28","paragraphPids":[3]},"html":"<h3>D. Encouraged.</h3>\n<blockquote><p>受到鼓舞。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对Sci-Hub的成功受到鼓舞。</p>\n<p>D说受到鼓舞。第4段既有用户对旧体系的反应，也有必须改革的要求，我们先看这能否理解成改变的机会。</p>\n<blockquote><p>The most drastic, and thoroughly illegal, reaction has been the <strong>[xxx]</strong> of Sci-Hub</p>\n</blockquote>\n<blockquote><p>shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.</p>\n</blockquote>\n<p>Sci-Hub的成功说明许多用户不再接受旧体系，作者也认为体系必须改造。从这个角度，用户的反应可能给改革形成压力。</p>\n<p>但形成压力与作者因此振奋还隔着一步：作者是否把这种成功看成已经带来更公平的安排，原段没有直接说。</p>\n<p>现在先把D与C留下。后面还会谈开放获取，我们继续看作者对新做法的成功，是强调它解决了问题，还是仍担心原来的利益关系。</p>\n<p><strong>成功可能形成改革压力，但作者是否已经由此感到问题有希望解决，当前这一段说清了吗？</strong></p>\n<p>还没完全说清。D先保留，再与C核对后面的费用和权力问题。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一遍留下C、D。作者由成功看出体系的问题并要求改变，能支持担忧；若把这次反应的成功理解为促使改变的压力，也暂时容许受到鼓舞的理解。","articleRects":[],"questionRects":[[226,986,881,34],[280,1047,185,30],[280,1108,169,31],[280,1169,210,31],[280,1231,228,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"28"},"html":"<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一遍留下C、D。作者由成功看出体系的问题并要求改变，能支持担忧；若把这次反应的成功理解为促使改变的压力，也暂时容许受到鼓舞的理解。</p>\n"},{"section":"29题","raw":"## 29题\n\n> It can be learned from Paragraphs 5 and 6 that open access terms ______.  \n> 从第5、6段可以得知，开放获取条款______。\n\n题干明确给出Paragraphs 5 and 6，并点出open access terms。直接完整读第5、6段，看开放获取怎样实行，以及读者、作者和大学的费用怎样变化。\n\n> 原文参考：\n> \n> In Britain the move towards open access publishing has been driven by funding **[xxx]**. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or **[xxx]** for a year or more so that the publishers can make a profit before being placed on general release.\n> \n> 开始精读：\n> \n> In Britain the move towards open access publishing has been driven by funding **[xxx]**. / In some ways it has been very successful. / More than half of all British scientific research is now published under open access terms: / either freely available from the moment of publication, / or **[xxx]** for a year or more / so that the publishers can make a profit before being placed on general release.\n> \n> 在英国，走向开放获取出版的行动由资助**[xxx]**推动。 / 在某些方面，这一行动非常成功。 / 现在，英国全部科学研究中超过一半按照开放获取条款发表： / 要么从发表之时起就可以免费获取， / 要么**[xxx]**一年或更长时间， / 以便出版商能在其面向公众发布之前获得利润。\n\n> 原文参考：\n> \n> Yet the new system has not worked out any cheaper for the universities. Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article. These range from around £500 to $5,000. A report last year pointed out that the costs both of **[xxx]** and of these “article preparation costs” had been steadily rising at a rate above **[xxx]**. In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places. In both cases, we need a rebalancing of power.\n> \n> 开始精读：\n> \n> Yet the new system has not worked out any cheaper for the universities. / Publishers have responded to the demand that they make their product free to readers / by charging their writers fees to cover the costs of preparing an article. / These range from around £500 to $5,000. / A report last year pointed out that the costs both of **[xxx]** and of these “article preparation costs” / had been steadily rising at a rate above **[xxx]**. / In some ways the scientific publishing model resembles the economy of the social internet: / labour is provided free in exchange for the hope of status, / while huge profits are made by a few big firms who run the market places. / In both cases, / we need a rebalancing of power.\n> \n> 然而，新制度对大学来说并没有变得更便宜。 / 出版商回应让其产品对读者免费的要求， / 其做法是向作者收费，以支付准备一篇文章的成本。 / 这些费用从约£500到$5,000不等。 / 去年的一份报告指出，**[xxx]**的成本和这些“文章准备成本”， / 都一直以高于**[xxx]**的速度稳步上涨。 / 在某些方面，科学出版模式类似于社交互联网的经济： / 人们免费提供劳动，以换取获得地位的希望， / 而巨额利润则由少数经营交易市场的大公司赚取。 / 在这两种情况下， / 我们都需要重新平衡权力。\n\n空格要补开放获取条款所产生的安排或后果。需要把第5段的获取方式与第6段出版商的收费回应连起来核对。\n\n接下来按A—D逐项看。","articleRects":[[274,1324,1122,38],[202,1373,1193,38],[202,1423,1194,38],[202,1472,1194,38],[202,1518,1055,45],[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[226,1353,1016,38],[1251,1385,104,7],[281,1414,696,38],[280,1475,681,38],[280,1537,672,37],[280,1598,621,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4,5],"qid":"29","initialReadingPids":[4,5]},"html":"<h2>29题</h2>\n<blockquote><p>It can be learned from Paragraphs 5 and 6 that open access terms ______.<br />\n从第5、6段可以得知，开放获取条款______。</p>\n</blockquote>\n<p>题干明确给出Paragraphs 5 and 6，并点出open access terms。直接完整读第5、6段，看开放获取怎样实行，以及读者、作者和大学的费用怎样变化。</p>\n<blockquote><p>原文参考：</p>\n<p>In Britain the move towards open access publishing has been driven by funding <strong>[xxx]</strong>. In some ways it has been very successful. More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or <strong>[xxx]</strong> for a year or more so that the publishers can make a profit before being placed on general release.</p>\n<p>开始精读：</p>\n<p>In Britain the move towards open access publishing has been driven by funding <strong>[xxx]</strong>. / In some ways it has been very successful. / More than half of all British scientific research is now ts of preparing an article.</p>\n</blockquote>\n<p>有的开放获取论文并不是发表后马上公开，而是先留出一年或更久，让出版商先获利再普遍开放。</p>\n<p>另外，产品对读者免费后，出版商又向写作者收取准备文章的费用。所以“开放”并没有让出版商所有收费机会消失。</p>\n<p>A说留有一些空间，既能接先赚钱再公开，也能接读者不付、作者付的方式，并没有断言每篇都用同一种收费办法。</p>\n<p><strong>既允许公开前先获利，又存在作者付费，能否说明开放获取仍给出版商留下赚钱空间？</strong></p>\n<p>能。两段都给了具体方式，A留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"29题","raw":"### B. render publishing much easier for scientists\n\n> 使科学家发表研究容易得多。\n\n把B接回题干，它说的是：从第5、6段可以得知，开放获取条款使科学家发表研究容易得多。\n\nB说科学家发表容易得多。第5段说论文何时对读者免费，第6段说出版商向谁收费，我们看有没有讲发表门槛。\n\n> either freely available from the moment of publication\n\n> Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.\n\n开放获取改变的是读者怎样拿到论文：立即免费，或过一段时间再开放。它不等于稿件更容易被期刊接受。\n\n第6段又说写作者需要支付准备费用，没有写审稿更宽松、申请更简单或成功发表的机会更高。\n\nB把获得论文的方便换成发表论文更容易。读和发是两件事，不能只因文章更开放就把它们混起来。\n\n**论文对读者更开放，就说明科学家投稿并发表更容易了吗？**\n\n不说明。原文没有给出发表门槛降低的变化。\n\n**第一轮判断：B排除。**","articleRects":[[274,1324,1122,38],[202,1373,1193,38],[202,1423,1194,38],[202,1472,1194,38],[202,1518,1055,45],[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1475,681,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"29","paragraphPids":[4,5]},"html":"<h3>B. render publishing much easier for scientists</h3>\n<blockquote><p>使科学家发表研究容易得多。</p>\n</blockquote>\n<p>把B接回题干，它说的是：从第5、6段可以得知，开放获取条款使科学家发表研究容易得多。</p>\n<p>B说科学家发表容易得多。第5段说论文何时对读者免费，第6段说出版商向谁收费，我们看有没有讲发表门槛。</p>\n<blockquote><p>either freely available from the moment of publication</p>\n</blockquote>\n<blockquote><p>Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.</p>\n</blockquote>\n<p>开放获取改变的是读者怎样拿到论文：立即免费，或过一段时间再开放。它不等于稿件更容易被期刊接受。</p>\n<p>第6段又说写作者需要支付准备费用，没有写审稿更宽松、申请更简单或成功发表的机会更高。</p>\n<p>B把获得论文的方便换成发表论文更容易。读和发是两件事，不能只因文章更开放就把它们混起来。</p>\n<p><strong>论文对读者更开放，就说明科学家投稿并发表更容易了吗？</strong></p>\n<p>不说明。原文没有给出发表门槛降低的变化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"29题","raw":"### C. reduce the cost of publication **[xxx]**\n\n> **[xxx]**降低出版成本。\n\n把C接回题干，它说的是：从第5、6段可以得知，开放获取条款**[xxx]**降低出版成本。\n\nC说出版成本降低，后面的词虽被挡住，`reduce`仍然清楚。我们回到第6段开头和费用变化。\n\n> Yet the new system has not worked out any cheaper for the universities.\n\n> A report last year pointed out that the costs both of **[xxx]** and of these “article preparation costs” had been steadily rising at a rate above **[xxx]**.\n\n新体系并没有让大学更省钱，出版商又向作者收准备费，相关成本还在持续上升。\n\n因此，原文不是说读者免费后，整体费用就少了，而是说费用转了地方，大学仍没有省下钱。\n\nC后面的修饰词尚未读懂，也不能使前面的降低与持续上升相同。至少已知的变化方向不合。\n\n**原文明说大学并未更省钱、费用还在上升，能接成成本降低吗？**\n\n不能。C已知的`reduce`与费用变化方向不符。\n\n**第一轮判断：C排除。**","articleRects":[[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1537,672,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"29","paragraphPids":[5]},"html":"<h3>C. reduce the cost of publication <strong>[xxx]</strong></h3>\n<blockquote><p><strong>[xxx]</strong>降低出版成本。</p>\n</blockquote>\n<p>把C接回题干，它说的是：从第5、6段可以得知，开放获取条款<strong>[xxx]</strong>降低出版成本。</p>\n<p>C说出版成本降低，后面的词虽被挡住，<code>reduce</code>仍然清楚。我们回到第6段开头和费用变化。</p>\n<blockquote><p>Yet the new system has not worked out any cheaper for the universities.</p>\n</blockquote>\n<blockquote><p>A report last year pointed out that the costs both of <strong>[xxx]</strong> and of these “article preparation costs” had been steadily rising at a rate above <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>新体系并没有让大学更省钱，出版商又向作者收准备费，相关成本还在持续上升。</p>\n<p>因此，原文不是说读者免费后，整体费用就少了，而是说费用转了地方，大学仍没有省下钱。</p>\n<p>C后面的修饰词尚未读懂，也不能使前面的降低与持续上升相同。至少已知的变化方向不合。</p>\n<p><strong>原文明说大学并未更省钱、费用还在上升，能接成成本降低吗？</strong></p>\n<p>不能。C已知的<code>reduce</code>与费用变化方向不符。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"29题","raw":"### D. free universities from financial burdens\n\n> 使大学摆脱经济负担。\n\n把D接回题干，它说的是：从第5、6段可以得知，开放获取条款使大学摆脱经济负担。\n\nD说大学摆脱经济负担。第6段第一句直接提大学是否更省钱，我们把它与后面的收费连着读。\n\n> Yet the new system has not worked out any cheaper for the universities.\n\n作者明确说新体系没有给大学带来更便宜的结果。出版商虽让读者免费，却向写作者收取费用。\n\n这种收费转移没有把大学从财务负担中解放出来，相关费用还在增加。免费的是某个阅读环节，不能推成大学不再承担成本。\n\nD的`free ... from financial burdens`比“更省钱”还进一步，原文连更省钱都没有成立。\n\n**对读者免费但大学没有更省钱，能说明大学已摆脱经济负担吗？**\n\n不能。原文正是在指出负担仍然存在。\n\n**第一轮判断：D排除。**","articleRects":[[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1598,621,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"29","paragraphPids":[5]},"html":"<h3>D. free universities from financial burdens</h3>\n<blockquote><p>使大学摆脱经济负担。</p>\n</blockquote>\n<p>把D接回题干，它说的是：从第5、6段可以得知，开放获取条款使大学摆脱经济负担。</p>\n<p>D说大学摆脱经济负担。第6段第一句直接提大学是否更省钱，我们把它与后面的收费连着读。</p>\n<blockquote><p>Yet the new system has not worked out any cheaper for the universities.</p>\n</blockquote>\n<p>作者明确说新体系没有给大学带来更便宜的结果。出版商虽让读者免费，却向写作者收取费用。</p>\n<p>这种收费转移没有把大学从财务负担中解放出来，相关费用还在增加。免费的是某个阅读环节，不能推成大学不再承担成本。</p>\n<p>D的<code>free ... from financial burdens</code>比“更省钱”还进一步，原文连更省钱都没有成立。</p>\n<p><strong>对读者免费但大学没有更省钱，能说明大学已摆脱经济负担吗？</strong></p>\n<p>不能。原文正是在指出负担仍然存在。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"29题","raw":"### 29题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。开放获取的安排仍允许出版商盈利，向读者免费也伴随向作者收费。","articleRects":[],"questionRects":[[226,1353,1016,38],[1251,1385,104,7],[281,1414,696,38],[280,1475,681,38],[280,1537,672,37],[280,1598,621,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"29"},"html":"<h3>29题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。开放获取的安排仍允许出版商盈利，向读者免费也伴随向作者收费。</p>\n"},{"section":"30题","raw":"## 30题\n\n> Which of the following characterises the scientific publishing model?  \n> 下列哪一项体现了科学出版模式的特点？\n\n题干中的scientific publishing model在第6段后半部分原样出现，那里把它与社交互联网的经济相比。复读已完整读过的第6段，确认作者怎样概括这个模式。\n\n题干要的是科学出版模式的特点，需对照作者概括的劳动提供者、获利者以及两者之间的分配关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[226,1720,1070,38],[280,1782,463,37],[280,1843,465,38],[280,1904,420,31],[280,1965,448,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"30","initialReadingPids":[]},"html":"<h2>30题</h2>\n<blockquote><p>Which of the following characterises the scientific publishing model?<br />\n下列哪一项体现了科学出版模式的特点？</p>\n</blockquote>\n<p>题干中的scientific publishing model在第6段后半部分原样出现，那里把它与社交互联网的经济相比。复读已完整读过的第6段，确认作者怎样概括这个模式。</p>\n<p>题干要的是科学出版模式的特点，需对照作者概括的劳动提供者、获利者以及两者之间的分配关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"30题","raw":"### A. Trial subscription is offered.\n\n> 提供试用订阅。\n\n把A接回题干，它说的是：科学出版模式的特点是提供试用订阅。\n\nA说提供试用订阅。第5段有先等待再公开，第6段也谈费用，我们看有没有规定一个先试用的订阅期。\n\n> either freely available from the moment of publication, or **[xxx]** for a year or more so that the publishers can make a profit before being placed on general release.\n\n> Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.\n\n等待一年或更久后再普遍公开，是让出版商先有赚钱的时间。它不是给读者先免费试用、试完再付费。\n\n论文从发表就公开，或者延后公开，都在安排获取时间。原文没有介绍试订服务。\n\nA把某一段时间的安排想成试用订阅，但免费开放与试订的先后、目的都没有这样对应。\n\n**先让出版商获利，再公开论文，这就是提供试用订阅吗？**\n\n不是。原文讲开放时间，没有讲读者试订。\n\n**第一轮判断：A排除。**","articleRects":[[274,1324,1122,38],[202,1373,1193,38],[202,1423,1194,38],[202,1472,1194,38],[202,1518,1055,45],[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1782,463,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"30","paragraphPids":[4,5]},"html":"<h3>A. Trial subscription is offered.</h3>\n<blockquote><p>提供试用订阅。</p>\n</blockquote>\n<p>把A接回题干，它说的是：科学出版模式的特点是提供试用订阅。</p>\n<p>A说提供试用订阅。第5段有先等待再公开，第6段也谈费用，我们看有没有规定一个先试用的订阅期。</p>\n<blockquote><p>either freely available from the moment of publication, or <strong>[xxx]</strong> for a year or more so that the publishers can make a profit before being placed on general release.</p>\n</blockquote>\n<blockquote><p>Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.</p>\n</blockquote>\n<p>等待一年或更久后再普遍公开，是让出版商先有赚钱的时间。它不是给读者先免费试用、试完再付费。</p>\n<p>论文从发表就公开，或者延后公开，都在安排获取时间。原文没有介绍试订服务。</p>\n<p>A把某一段时间的安排想成试用订阅，但免费开放与试订的先后、目的都没有这样对应。</p>\n<p><strong>先让出版商获利，再公开论文，这就是提供试用订阅吗？</strong></p>\n<p>不是。原文讲开放时间，没有讲读者试订。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"30题","raw":"### B. Labour triumphs over status.\n\n> 劳动战胜了地位。\n\n把B接回题干，它说的是：科学出版模式的特点是劳动战胜了地位。\n\nB说劳动战胜地位。末段把`labour`与`status`放在`in exchange for the hope of`两边，我们把这个连接读清。\n\n> labour is provided free in exchange for the hope of status\n\n劳动是免费提供的，提供劳动的人希望因此得到学术地位。两者不是正在竞争谁更重要，而是劳动者用免费劳动换取获得地位的希望。\n\nB的`triumphs over`要其中一方胜过另一方，原句并没有这种胜负比较。\n\n而且，巨额利润由少数大公司获得，作者强调的也是谁付出、谁获利，而不是劳动是否超过地位。\n\n**免费劳动换取获得地位的希望，说的是劳动战胜地位吗？**\n\n不是。原文是交换关系，B改成了胜负关系。\n\n**第一轮判断：B排除。**","articleRects":[[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1843,465,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>B. Labour triumphs over status.</h3>\n<blockquote><p>劳动战胜了地位。</p>\n</blockquote>\n<p>把B接回题干，它说的是：科学出版模式的特点是劳动战胜了地位。</p>\n<p>B说劳动战胜地位。末段把<code>labour</code>与<code>status</code>放在<code>in exchange for the hope of</code>两边，我们把这个连接读清。</p>\n<blockquote><p>labour is provided free in exchange for the hope of status</p>\n</blockquote>\n<p>劳动是免费提供的，提供劳动的人希望因此得到学术地位。两者不是正在竞争谁更重要，而是劳动者用免费劳动换取获得地位的希望。</p>\n<p>B的<code>triumphs over</code>要其中一方胜过另一方，原句并没有这种胜负比较。</p>\n<p>而且，巨额利润由少数大公司获得，作者强调的也是谁付出、谁获利，而不是劳动是否超过地位。</p>\n<p><strong>免费劳动换取获得地位的希望，说的是劳动战胜地位吗？</strong></p>\n<p>不是。原文是交换关系，B改成了胜负关系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"30题","raw":"### C. Costs are well controlled.\n\n> 成本得到了良好控制。\n\n把C接回题干，它说的是：科学出版模式的特点是成本得到了良好控制。\n\nC说成本控制得好。末段刚提到费用一直增长，我们回看增长的速度和后面的权力要求。\n\n> Yet the new system has not worked out any cheaper for the universities.\n\n> A report last year pointed out that the costs both of **[xxx]** and of these “article preparation costs” had been steadily rising at a rate above **[xxx]**.\n\n报告指出相关费用持续增长，速度还超过某个被遮挡的参照。即使暂时不知道参照是什么，`steadily rising`已经说明费用在不断增加。\n\n大学也并未因为新体系而省钱。作者因此继续追问免费劳动与少数企业巨额利润之间的不平衡。\n\nC把这种费用压力写成良好控制，没有任何具体措施或结果支撑，也与大学没有减负的情况接不上。\n\n**费用持续上升、大学没有更省钱，是作者在展示成本已被良好控制吗？**\n\n不是。C没有接上作者明确指出的成本问题。\n\n**第一轮判断：C排除。**","articleRects":[[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1904,420,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>C. Costs are well controlled.</h3>\n<blockquote><p>成本得到了良好控制。</p>\n</blockquote>\n<p>把C接回题干，它说的是：科学出版模式的特点是成本得到了良好控制。</p>\n<p>C说成本控制得好。末段刚提到费用一直增长，我们回看增长的速度和后面的权力要求。</p>\n<blockquote><p>Yet the new system has not worked out any cheaper for the universities.</p>\n</blockquote>\n<blockquote><p>A report last year pointed out that the costs both of <strong>[xxx]</strong> and of these “article preparation costs” had been steadily rising at a rate above <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>报告指出相关费用持续增长，速度还超过某个被遮挡的参照。即使暂时不知道参照是什么，<code>steadily rising</code>已经说明费用在不断增加。</p>\n<p>大学也并未因为新体系而省钱。作者因此继续追问免费劳动与少数企业巨额利润之间的不平衡。</p>\n<p>C把这种费用压力写成良好控制，没有任何具体措施或结果支撑，也与大学没有减负的情况接不上。</p>\n<p><strong>费用持续上升、大学没有更省钱，是作者在展示成本已被良好控制吗？</strong></p>\n<p>不是。C没有接上作者明确指出的成本问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"30题","raw":"### D. The few feed on the many.\n\n> 少数人靠多数人获利。\n\n把D接回题干，它说的是：科学出版模式的特点是少数人靠多数人获利。\n\nD说少数靠多数获利。末段直接把免费劳动与`a few big firms`的利润对照，我们找清各方。\n\n> labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places.\n\n> In both cases, we need a rebalancing of power.\n\n研究者提供论文、评审等劳动，希望获得学术地位；经营市场的少数大公司则拿到巨额利润。\n\n所以付出内容与劳动的人很多，掌握收费市场并取得主要利润的公司很少。D的`feed on`在这里是靠别人的付出来获利，不是字面上的吃。\n\n作者随后要求重新平衡权力，正说明他要指出这种收益与付出没有对等分配的模式。\n\n**多数人免费提供劳动，少数经营市场的公司取得巨额利润，是否就是D说的少数靠多数获利？**\n\n是。D同时保留了谁付出和谁取得利润。\n\n**第一轮判断：D保留。**","articleRects":[[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[280,1965,448,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"30","paragraphPids":[5]},"html":"<h3>D. The few feed on the many.</h3>\n<blockquote><p>少数人靠多数人获利。</p>\n</blockquote>\n<p>把D接回题干，它说的是：科学出版模式的特点是少数人靠多数人获利。</p>\n<p>D说少数靠多数获利。末段直接把免费劳动与<code>a few big firms</code>的利润对照，我们找清各方。</p>\n<blockquote><p>labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places.</p>\n</blockquote>\n<blockquote><p>In both cases, we need a rebalancing of power.</p>\n</blockquote>\n<p>研究者提供论文、评审等劳动，希望获得学术地位；经营市场的少数大公司则拿到巨额利润。</p>\n<p>所以付出内容与劳动的人很多，掌握收费市场并取得主要利润的公司很少。D的<code>feed on</code>在这里是靠别人的付出来获利，不是字面上的吃。</p>\n<p>作者随后要求重新平衡权力，正说明他要指出这种收益与付出没有对等分配的模式。</p>\n<p><strong>多数人免费提供劳动，少数经营市场的公司取得巨额利润，是否就是D说的少数靠多数获利？</strong></p>\n<p>是。D同时保留了谁付出和谁取得利润。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"30题","raw":"### 30题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。劳动免费提供，巨额利润由少数经营市场的大公司获得，构成了这项模式的分配特点。","articleRects":[],"questionRects":[[226,1720,1070,38],[280,1782,463,37],[280,1843,465,38],[280,1904,420,31],[280,1965,448,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"30"},"html":"<h3>30题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。劳动免费提供，巨额利润由少数经营市场的大公司获得，构成了这项模式的分配特点。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | a licence to print money；also for free | 以“a licence to print money”提出科学出版很容易获利，随后写科学家需要发表研究、同行评审“also for free”，把劳动与知识的供给作为开篇解释。 | 提出科学出版容易获利，并说明免费劳动与内容从何而来。 |\n| 第2段 | secured for free；not very price sensitive | 承接这些投入，用“secured for free”说明论文内容免费取得，再用“not very price sensitive”写大学图书馆的购买态度，并把科学出版商的利润与其余出版业的危机并置。 | 把免费供给接到购买端，解释出版商的经营优势。 |\n| 第3段 | made profits；UK universities alone spent | 通过“made profits”和“UK universities alone spent”给出出版商利润、大学获取研究支出的具体数额，将第2段的经营关系落实为两方的金钱结果；末尾仍写数字上升及改变它们的努力。 | 用利润与支出数额落实前段所述关系，引出改变现状的需求。 |\n| 第4段 | thoroughly illegal；lost legitimacy among its users | 转入对这一局面的反应，以“thoroughly illegal”描述Sci-Hub相关行动，并由“lost legitimacy among its users”指出它的成功反映现有体系失去用户认可，因而必须改造体系以服务所有参与者。 | 以非法网站的成功显示用户对现有体系的不满，转向改革问题。 |\n| 第5段 | very successful；publishers can make a profit | 转到开放获取这一改变，先说“very successful”，再以“More than half”说明英国研究采用该安排的范围；同时保留“publishers can make a profit”，表明获取方式改变仍留有出版商获利的安排。 | 介绍开放获取的进展，也保留出版商仍可获利这一条件。 |\n| 第6段 | not worked out any cheaper；a rebalancing of power | 以“not worked out any cheaper”转折，指出大学费用并未更低，出版商通过向作者收费回应读者免费要求；最后以“labour is provided free”与“a few big firms”的巨额利润相对照，归结为“a rebalancing of power”。 | 指出费用问题仍在，回到免费劳动与利润分配的不平衡。 |\n\n全文观点：科学出版依靠免费提供的劳动和内容运转，巨额利润却集中于少数经营者；用户的反应及开放获取的进展并没有消除大学的费用问题，因此需要重新平衡参与各方的权力。","articleRects":[[274,284,1122,47],[199,338,1197,37],[202,387,1194,38],[202,436,1 ked out any cheaper；a rebalancing of power</td><td>以“not worked out any cheaper”转折，指出大学费用并未更低，出版商通过向作者收费回应读者免费要求；最后以“labour is provided free”与“a few big firms”的巨额利润相对照，归结为“a rebalancing of power”。</td><td>指出费用问题仍在，回到免费劳动与利润分配的不平衡。</td></tr></tbody></table>\n<p>全文观点：科学出版依靠免费提供的劳动和内容运转，巨额利润却集中于少数经营者；用户的反应及开放获取的进展并没有消除大学的费用问题，因此需要重新平衡参与各方的权力。</p>\n"},{"section":"进阶回查","raw":"## 回查28题：C还是D？\n\nC. Concerned.\n\nD. Encouraged.\n\nC说作者担忧Sci-Hub成功暴露的问题，D说这种成功使作者受到鼓舞。第一遍我们能看到它给旧体系造成压力，但还要分清作者有没有把压力当作改革已经见效。\n\n先回到第4段对成功的直接说明：\n\n> the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants\n\n它说明旧体系失去用户认可，必须改变。作者没有接着说Sci-Hub已经建立了对所有人公平的新安排。\n\n第5段讨论另一个新做法——开放获取，作者承认它有成功的一面，超过一半英国研究已采用这种安排。但第6段马上转折：\n\n> Yet the new system has not worked out any cheaper for the universities.\n>\n> by charging their writers fees\n\n读者免费了，大学却没有省钱，因为出版商改向作者收费。这里作者同样没有因一项新做法取得成功就放心，而是继续核对它有没有解决真正的费用问题。\n\n最后又说：\n\n> labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms\n>\n> we need a rebalancing of power\n\n作者关心的是研究者付出劳动、少数公司收取利润这一安排还未改变。\n\n**Sci-Hub的成功被作者写成改革已经使各方受益，还是写成现行体系已严重失去用户认可、非改不可的信号？**\n\n是后者。D所想到的改革压力确实可能存在，但作者没有把这种压力进一步写成鼓舞。他直接表达的是必须解决的体系问题，后文仍追问收费与权力，因此选C。\n\n> **28题选C。**","articleRects":[[273,1028,1125,38],[203,1078,1188,37],[202,1127,1184,38],[202,1176,1194,38],[202,1226,1194,37],[202,1275,1021,37],[274,1324,1122,38],[202,1373,1193,38],[202,1423,1194,38],[202,1472,1194,38],[202,1518,1055,45],[274,1571,1112,38],[202,1620,1194,38],[202,1669,1184,38],[202,1719,1194,37],[202,1767,1193,39],[203,1817,1193,38],[202,1867,1194,38],[202,1916,1193,38],[202,1965,1118,38]],"questionRects":[[226,986,881,34],[280,1047,185,30],[280,1108,169,31],[280,1169,210,31],[280,1231,228,37]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[5,6],"finalChoice":"C","qid":"28","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查28题：C还是D？</h2>\n<p>C. Concerned.</p>\n<p>D. Encouraged.</p>\n<p>C说作者担忧Sci-Hub成功暴露的问题，D说这种成功使作者受到鼓舞。第一遍我们能看到它给旧体系造成压力，但还要分清作者有没有把压力当作改革已经见效。</p>\n<p>先回到第4段对成功的直接说明：</p>\n<blockquote><p>the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants</p>\n</blockquote>\n<p>它说明旧体系失去用户认可，必须改变。作者没有接着说Sci-Hub已经建立了对所有人公平的新安排。</p>\n<p>第5段讨论另一个新做法——开放获取，作者承认它有成功的一面，超过一半英国研究已采用这种安排。但第6段马上转折：</p>\n<blockquote><p>Yet the new system has not worked out any cheaper for the universities.</p>\n<p>by charging their writers fees</p>\n</blockquote>\n<p>读者免费了，大学却没有省钱，因为出版商改向作者收费。这里作者同样没有因一项新做法取得成功就放心，而是继续核对它有没有解决真正的费用问题。</p>\n<p>最后又说：</p>\n<blockquote><p>labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms</p>\n<p>we need a rebalancing of power</p>\n</blockquote>\n<p>作者关心的是研究者付出劳动、少数公司收取利润这一安排还未改变。</p>\n<p><strong>Sci-Hub的成功被作者写成改革已经使各方受益，还是写成现行体系已严重失去用户认可、非改不可的信号？</strong></p>\n<p>是后者。D所想到的改革压力确实可能存在，但作者没有把这种压力进一步写成鼓舞。他直接表达的是必须解决的体系问题，后文仍追问收费与权力，因此选C。</p>\n<blockquote><p><strong>28题选C。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**26. D**\n\n**27. A**\n\n**28. C**\n\n**29. A**\n\n**30. D**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>26. D</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. A</strong></p>\n<p><strong>30. D</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRrxpBQBXRUJQVlA4TLBpBQAvV0Y1As34liTJkiTJtoCp4g2l/v+DzT0sofr6GNH/Cdj/j8/98+zuH/cPjfIsjUywRdaL67KuVK36WdudctXKi0iQ51AKGcsr97ekiPLs7tYHpleo2lTRE3dVVG8uLEWN+XidSPCir/ror/0DbZv9urutrba1uuvFVgjS8jyIlePNXfqqrkjVdYp6Nft4GMwum7PZbu1esGULKt3fEnFS2cvrSl39dBLuQ1F19cLd4UbFfIzLs8Mbe+jr/plHKnatj9fz/jq67l7h8ozoFOxOFr0oSkg+5nMU2Uv3+Lq6pVx3VdfHF0Fivh6cguFdiyqJqaKNTHd/4Hpa97g+rn2ne8OInGf5+Is/evRbWU+1rNN6UWxmMXe3j7evZ/byh4pO6Q6FSxXuetFv9f2oTyVvzmyz397Otpk9b2/JMhSUoZLM5A9cKvmpkNJTddUr283t6cbsgowde1OifCypE1F/7Y+KUvqo9F2
