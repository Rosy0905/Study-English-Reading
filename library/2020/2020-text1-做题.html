<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 21题题干\n\n**Cooper and her colleagues argue that a “town of culture” award could ______.**\n\n> 库珀和她的同事们认为，“文化城镇”奖可以______。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,188,1067,40],[1300,222,105,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"},"html":"<h2>21题题干</h2>\n<p><strong>Cooper and her colleagues argue that a “town of culture” award could ______.</strong></p>\n<blockquote><p>库珀和她的同事们认为，“文化城镇”奖可以______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 22题题干\n\n**According to Paragraph 2, the proposal might be regarded by some as ______.**\n\n> 根据第2段，有些人可能把这项提议看作______。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,570,1178,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"},"html":"<h2>22题题干</h2>\n<p><strong>According to Paragraph 2, the proposal might be regarded by some as ______.</strong></p>\n<blockquote><p>根据第2段，有些人可能把这项提议看作______。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 23题题干\n\n**The author suggests that a title holder is successful only if it ______.**\n\n> 作者认为，一个称号获得者只有在______时才算成功。\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,951,947,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"},"html":"<h2>23题题干</h2>\n<p><strong>The author suggests that a title holder is successful only if it ______.</strong></p>\n<blockquote><p>作者认为，一个称号获得者只有在______时才算成功。</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 24题题干\n\n**Glasgow is mentioned in Paragraph 3 to present ______.**\n\n> 第3段提到格拉斯哥，是为了呈现______。\n\n题型：**例子作用题**。","articleRects":[],"questionRects":[[226,1331,759,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"},"html":"<h2>24题题干</h2>\n<p><strong>Glasgow is mentioned in Paragraph 3 to present ______.</strong></p>\n<blockquote><p>第3段提到格拉斯哥，是为了呈现______。</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 25题题干\n\n**What is the author’s attitude towards the proposal?**\n\n> 作者对这项提议持什么态度？\n\n题型：**态度题**。","articleRects":[],"questionRects":[[226,1712,803,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"},"html":"<h2>25题题干</h2>\n<p><strong>What is the author’s attitude towards the proposal?</strong></p>\n<blockquote><p>作者对这项提议持什么态度？</p>\n</blockquote>\n<p>题型：<strong>态度题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, not just, as well as |\n| 态度词／评价词 | 先抓个大概好坏 | successful, optimistic, positive |\n| 动作词 | 先看谁做了什么 | attracting, creating, transform |\n| 结果词 | 看最后出了什么事 | investment, jobs, benefits |\n| 重复主题词 | 大概知道老在说什么 | towns, culture, people |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, not just, as well as</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>successful, optimistic, positive</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>attracting, creating, transform</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>investment, jobs, benefits</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>towns, culture, people</td></tr></tbody></table>\n"},{"section":"读文章","raw":"A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK “town of culture” award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the **[xxx]** for Hull, where it brought in £220m of investment and an **[xxx]** of arts, ought not to be confined to cities. Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a **[xxx]** to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK “town of culture” award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the <strong>[xxx]</strong> for Hull, where it brought in £220m of investment and an <strong>[xxx]</strong> of arts, ought not to be confined to cities. Britain’s towns, it is true, are not prevented from applying, but they generally lack the resou 在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到一群工党议员、其中包括库珀、成为年度活动、吸引资金并创造就业；中间又出现有些人可能看待该提议、当作安慰奖、无休止的自我庆祝狂热、文化城镇之后；这些称号并非万灵药、带来一时的知名度、但这可以做到、复杂系列中的一个；结尾还有可以是、不仅关乎艺术、帮助维持其商业街、并将其付诸行动。</p>\n<p>到这里还不能自然地说清楚：文化称号与城镇发展怎样联系，过去的例子能说明什么，作者对城镇的期待具体是什么。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"21题","raw":"## 21题\n\n> Cooper and her colleagues argue that a “town of culture” award could ______.  \n> 库珀和她的同事们认为，“文化城镇”奖可以______。\n\n题干直接给出Cooper and her colleagues，第1段第3句出现同样的人物。先从第1段开头读到结尾，弄清他们为何提出文化城镇奖，以及他们期待这项奖带来什么。\n\n> 原文参考：\n> \n> A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK “town of culture” award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the **[xxx]** for Hull, where it brought in £220m of investment and an **[xxx]** of arts, ought not to be confined to cities. Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a **[xxx]** to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.\n> \n> 开始精读：\n> \n> A group of Labour MPs, / among them Yvette Cooper, / are bringing in the new year / with a call to institute a UK “town of culture” award. / The proposal is that / it should sit alongside the existing city of culture title, / which was held by Hull in 2017, / and has been awarded to Coventry for 2021. / Cooper and her colleagues argue that / the success of the **[xxx]** for Hull, / where it brought in £220m of investment / and an **[xxx]** of arts, / ought not to be confined to cities. / Britain’s towns, / it is true, / are not prevented from applying, / but they generally lack the resources / to put together a **[xxx]** / to beat their bigger competitors. / A town of culture award could, / it is argued, / become an annual event, / attracting funding and creating jobs.\n> \n> 一群工党议员， / 其中包括伊薇特·库珀， / 正迎来新年， / 同时呼吁设立一个英国“文化城镇”奖。 / 这项提议是， / 它应与现有的文化之城称号并列， / 这个称号在2017年由赫尔获得， / 并已授予考文垂，作为2021年的获奖城市。 / 库珀和她的同事们认为， / **[xxx]**为赫尔带来的成功， / 在那里它引入了£220m的投资， / 以及艺术的一个**[xxx]**， / 不应局限于城市。 / 英国的城镇， / 诚然， / 并未被禁止申请， / 但它们通常缺乏资源， / 来准备一个**[xxx]**， / 以击败比它们更大的竞争者。 / 文化城镇奖可以， / 有人主张， / 成为一项年度活动， / 吸引资金并创造就业机会。\n\n题干的could要补的是文化城镇奖可能带来的作用。第1段把赫尔的经历、城镇参与评选的条件和设奖后的预期连在一起，要核对库珀及同事如何把这些事情联系起来。\n\n接下来按A—D逐项看。","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38]],"questionRects":[[226,188,1067,40],[1300,222,105,7],[281,253,628,38],[280,317,686,37],[281,380,769,38],[280,443,792,31]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"21","initialReadingPids":[0]},"html":"<h2>21题</h2>\n<blockquote><p>Cooper and her colleagues argue that a “town of culture” award could ______.<br />\n库珀和她的同事们认为，“文化城镇”奖可以______。</p>\n</blockquote>\n<p>题干直接给出Cooper and her colleagues，第1段第3句出现同样的人物。先从第1段开头读到结尾，弄清他们为何提出文化城镇奖，以及他们期待这项奖带来什么。</p>\n<blockquote><p>原文参考：</p>\n<p>A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK “town of culture” award. The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021. Cooper and her colleagues argue that the success of the <strong>[xxx]</strong> for Hull, where it brought in £220m of investment and an <strong>[xxx]</strong> of arts, ought not to be confined to cities. Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a <strong>[xxx]</strong> to beat their bigger competitors. A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n<p>开始精读：</p>\n<p>A group of Labour MPs, / among them Yvette Cooper, / are bringing in the new year / with a call to institute a UK “town of culture” award. / The proposal is that / it should sit alongside the existing city of culture title, / which was held by Hull in 2017, / and has been awarded to Coventry for 2021. / Cooper and her colleagues argue that / the success of the <strong>[xxx]</strong> for Hull, / where it brought in £220m of investment / and an <strong>[xxx]</strong> of arts, / ought not to be confined to cities. / Britain’s towns, / it is true, / are not prevented from applying, / but they generally lack the resources / to put together a <strong>[xxx]</strong> / to beat their bigger competitors. / A town of culture award could, / it is argued, / become an annual event, / attracting funding and creating jobs.</p>\n<p>一群工党议员， / 其中包括伊薇特·库珀， / 正迎来新年， / 同时呼吁设立一个英国“文化城镇”奖。 / 这项提议是， / 它应与现有的文化之城称号并列， / 这个称号在2017年由赫尔获得， / 并已授予考文垂，作为2021年的获奖城市。 / 库珀和她的同事们认为， / <strong>[xxx]</strong>为赫尔带来的成功， / 在那里它引入了£220m的投资， / 以及艺术的一个<strong>[xxx]</strong>， / 不应局限于城市。 / 英国的城镇， / 诚然， / 并未被禁止申请， / 但它们通常缺乏资源， / 来准备一个<strong>[xxx]</strong>， / 以击败比它们更大的竞争者。 / 文化城镇奖可以， / 有人主张， / 成为一项年度活动， / 吸引资金并创造就业机会。</p>\n</blockquote>\n<p>题干的could要补的是文化城镇奖可能带来的作用。第1段把赫尔的经历、城镇参与评选的条件和设奖后的预期连在一起，要核对库珀及同事如何把这些事情联系起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"21题","raw":"### A. consolidate the town-city ties in Britain\n\n> 巩固英国城镇与城市之间的联系\n\n把A接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以巩固英国城镇与城市之间的联系。\n\nA说加强城镇与城市的联系。原文有`alongside the existing city ... title`，我们看并列的是地方之间的合作，还是两项称号。\n\n> it should sit alongside the existing city of culture title\n\n> Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a **[xxx]** to beat their bigger competitors.\n\n提议让文化城镇奖与现有文化之城称号并列。`alongside`连接的是两项奖，并没有说获奖城镇要和城市建立新联系。\n\n后面还解释城镇资源不足，难赢过更大的竞争者，这是另设奖项的理由。它在解决城镇参与竞争的机会，不是在安排城镇和城市怎样往来。\n\nA把奖项并存改成地方关系加强。原文需要给出合作或联系方面的动作，才能接出A，但这里没有。\n\n**两项称号并列存在，就等于城镇与城市之间的联系被巩固了吗？**\n\n不等于。原句说奖项怎样设置，没有说两个地方怎样加强联系。\n\n**第一轮判断：A排除。**","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38]],"questionRects":[[281,253,628,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>A. consolidate the town-city ties in Britain</h3>\n<blockquote><p>巩固英国城镇与城市之间的联系</p>\n</blockquote>\n<p>把A接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以巩固英国城镇与城市之间的联系。</p>\n<p>A说加强城镇与城市的联系。原文有<code>alongside the existing city ... title</code>，我们看并列的是地方之间的合作，还是两项称号。</p>\n<blockquote><p>it should sit alongside the existing city of culture title</p>\n</blockquote>\n<blockquote><p>Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a <strong>[xxx]</strong> to beat their bigger competitors.</p>\n</blockquote>\n<p>提议让文化城镇奖与现有文化之城称号并列。<code>alongside</code>连接的是两项奖，并没有说获奖城镇要和城市建立新联系。</p>\n<p>后面还解释城镇资源不足，难赢过更大的竞争者，这是另设奖项的理由。它在解决城镇参与竞争的机会，不是在安排城镇和城市怎样往来。</p>\n<p>A把奖项并存改成地方关系加强。原文需要给出合作或联系方面的动作，才能接出A，但这里没有。</p>\n<p><strong>两项称号并列存在，就等于城镇与城市之间的联系被巩固了吗？</strong></p>\n<p>不等于。原句说奖项怎样设置，没有说两个地方怎样加强联系。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"21题","raw":"### B. promote cooperation among Britain’s towns\n\n> 促进英国各城镇之间的合作\n\n把B接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以促进英国各城镇之间的合作。\n\nB说城镇之间合作。第1段先谈城镇竞争资源不足，末句说吸引资金、创造岗位，我们看有没有让不同城镇联手。\n\n> but they generally lack the resources to put together a **[xxx]** to beat their bigger competitors.\n\n> A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.\n\n城镇缺少足够资源，难以击败更大的竞争者，因此议员希望给它们单独的获奖机会。\n\n末句写奖项可以吸引资金、创造就业。这些是设奖给城镇带来的好处，没有写城镇互相提供资源或共同办事。\n\nB的合作要有多个城镇之间的行动。不能因为一个奖面向许多城镇，就自动认定它会让这些城镇合作。\n\n**奖项面向城镇并带来资金岗位，是否已经说明城镇之间会互相合作？**\n\n没有。B添加了原段没有写出的城镇之间的合作。\n\n**第一轮判断：B排除。**","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38]],"questionRects":[[280,317,686,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>B. promote cooperation among Britain’s towns</h3>\n<blockquote><p>促进英国各城镇之间的合作</p>\n</blockquote>\n<p>把B接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以促进英国各城镇之间的合作。</p>\n<p>B说城镇之间合作。第1段先谈城镇竞争资源不足，末句说吸引资金、创造岗位，我们看有没有让不同城镇联手。</p>\n<blockquote><p>but they generally lack the resources to put together a <strong>[xxx]</strong> to beat their bigger competitors.</p>\n</blockquote>\n<blockquote><p>A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<p>城镇缺少足够资源，难以击败更大的竞争者，因此议员希望给它们单独的获奖机会。</p>\n<p>末句写奖项可以吸引资金、创造就业。这些是设奖给城镇带来的好处，没有写城镇互相提供资源或共同办事。</p>\n<p>B的合作要有多个城镇之间的行动。不能因为一个奖面向许多城镇，就自动认定它会让这些城镇合作。</p>\n<p><strong>奖项面向城镇并带来资金岗位，是否已经说明城镇之间会互相合作？</strong></p>\n<p>没有。B添加了原段没有写出的城镇之间的合作。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"21题","raw":"### C. increase the economic strength of Britain’s towns\n\n> 增强英国城镇的经济实力\n\n把C接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以增强英国城镇的经济实力。\n\nC说增强城镇经济实力。段末直接列了`attracting funding and creating jobs`，我们看这两项好处具体是什么。\n\n> A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.\n\n吸引资金让地方得到更多投入，创造岗位让居民有更多就业机会。这两项都直接关系城镇的经济活动。\n\n前面赫尔已经吸引了大量投资，议员认为这种成功不应只限于城市，末句就把同样的期待放到城镇奖上。\n\nC把资金和就业概括为经济实力增强，没有把它换成单纯名声提高，也没有要求一定得到与赫尔完全一样的金额。\n\n**城镇能吸引资金并增加岗位，能否说明奖项可以帮助增强它的经济实力？**\n\n能。C有这两项明确的经济作用可接。\n\n**第一轮判断：C保留。**","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38]],"questionRects":[[281,380,769,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"21","paragraphPids":[0]},"html":"<h3>C. increase the economic strength of Britain’s towns</h3>\n<blockquote><p>增强英国城镇的经济实力</p>\n</blockquote>\n<p>把C接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以增强英国城镇的经济实力。</p>\n<p>C说增强城镇经济实力。段末直接列了<code>attracting funding and creating jobs</code>，我们看这两项好处具体是什么。</p>\n<blockquote><p>A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<p>吸引资金让地方得到更多投入，创造岗位让居民有更多就业机会。这两项都直接关系城镇的经济活动。</p>\n<p>前面赫尔已经吸引了大量投资，议员认为这种成功不应只限于城市，末句就把同样的期待放到城镇奖上。</p>\n<p>C把资金和就业概括为经济实力增强，没有把它换成单纯名声提高，也没有要求一定得到与赫尔完全一样的金额。</p>\n<p><strong>城镇能吸引资金并增加岗位，能否说明奖项可以帮助增强它的经济实力？</strong></p>\n<p>能。C有这两项明确的经济作用可接。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"21题","raw":"### D. focus Britain’s limited resources on cultural events\n\n> 把英国有限的资源集中到文化活动上\n\n把D接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以把英国有限的资源集中到文化活动上。\n\nD说把英国有限资源集中到文化活动。原文的`lack the resources`也谈资源，我们先找出缺资源的是谁。\n\n> Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a **[xxx]** to beat their bigger competitors.\n\n> become an annual event, attracting funding and creating jobs.\n\n资源不足的是英国的城镇，相比更大的城市，它们难以准备足够有竞争力的申请。\n\nD却把这句话改成整个英国资源有限，并说要把这些资源集中投入文化活动。原文没有把城镇的竞争劣势扩大成全国的资源安排。\n\n末句的吸引资金，是奖项可能带来更多资金；不是宣布把其他方面的有限资源全部向文化集中。两处方向也不同。\n\n**城镇缺少竞争资源，能直接改成国家要把有限资源集中给文化活动吗？**\n\n不能。D换了资源所属的对象，又加了集中分配的做法。\n\n**第一轮判断：D排除。**","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38]],"questionRects":[[280,443,792,31]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>D. focus Britain’s limited resources on cultural events</h3>\n<blockquote><p>把英国有限的资源集中到文化活动上</p>\n</blockquote>\n<p>把D接回题干，它说的是：库珀和她的同事们认为，“文化城镇”奖可以把英国有限的资源集中到文化活动上。</p>\n<p>D说把英国有限资源集中到文化活动。原文的<code>lack the resources</code>也谈资源，我们先找出缺资源的是谁。</p>\n<blockquote><p>Britain’s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a <strong>[xxx]</strong> to beat their bigger competitors.</p>\n</blockquote>\n<blockquote><p>become an annual event, attracting funding and creating jobs.</p>\n</blockquote>\n<p>资源不足的是英国的城镇，相比更大的城市，它们难以准备足够有竞争力的申请。</p>\n<p>D却把这句话改成整个英国资源有限，并说要把这些资源集中投入文化活动。原文没有把城镇的竞争劣势扩大成全国的资源安排。</p>\n<p>末句的吸引资金，是奖项可能带来更多资金；不是宣布把其他方面的有限资源全部向文化集中。两处方向也不同。</p>\n<p><strong>城镇缺少竞争资源，能直接改成国家要把有限资源集中给文化活动吗？</strong></p>\n<p>不能。D换了资源所属的对象，又加了集中分配的做法。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"21题","raw":"### 21题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一次判断：留下C。设奖可吸引资金并创造就业，支持城镇经济实力可能增强。","articleRects":[],"questionRects":[[226,188,1067,40],[1300,222,105,7],[281,253,628,38],[280,317,686,37],[281,380,769,38],[280,443,792,31]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"21"},"html":"<h3>21题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次判断：留下C。设奖可吸引资金并创造就业，支持城镇经济实力可能增强。</p>\n"},{"section":"22题","raw":"## 22题\n\n> According to Paragraph 2, the proposal might be regarded by some as ______.  \n> 根据第2段，有些人可能把这项提议看作______。\n\n题干直接指定Paragraph 2，且might be regarded by some与该段开头Some might see相接。把第2段从头读到尾，区分有些人的看法和随后冷嘲热讽者的猜测。\n\n> 原文参考：\n> \n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more **[xxx]** title of European capital of culture, a **[xxx]** award **[xxx]** by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the **[xxx]** of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow—village of culture? **[xxx]** of culture? **[xxx]** of culture?\n> \n> 开始精读：\n> \n> Some might see the proposal / as a booby prize for the fact / that Britain is no longer able to apply / for the much more **[xxx]** title of European capital of culture, / a **[xxx]** award / **[xxx]** by Glasgow in 1990 and Liverpool in 2008. / A cynic might speculate / that the UK is on the **[xxx]** / of disappearing into an endless fever of self-celebration / in its desperation to reinvent itself / for the post-Brexit world: / after town of culture, / who knows what will follow—village of culture? / **[xxx]** of culture? / **[xxx]** of culture?\n> \n> 有些人可能会看待这项提议， / 把它当作一种安慰奖，针对这个事实： / 英国已不能再申请， / 那个要**[xxx]**得多的欧洲文化之都称号， / 一个**[xxx]**奖项， / 由1990年的格拉斯哥和2008年的利物浦**[xxx]**。 / 一个冷嘲热讽的人可能会猜测， / 英国正处于**[xxx]**， / 即消失在一种无休止的自我庆祝狂热中， / 因为它急切地想重塑自己， / 以适应脱欧后的世界： / 文化城镇之后， / 谁知道接下来会是什么——文化村庄？ / 文化**[xxx]**？ / 文化**[xxx]**？\n\n空格要补的是第2段中有些人如何评价文化城镇奖提议，以及这种评价与英国不能再申请欧洲文化之都称号之间的联系。\n\n接下来按A—D逐项看。","articleRects":[[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35]],"questionRects":[[226,570,1178,39],[281,634,379,37],[281,693,398,46],[281,761,372,37],[281,824,361,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"22","initialReadingPids":[1]},"html":"<h2>22题</h2>\n<blockquote><p>According to Paragraph 2, the proposal might be regarded by some as ______.<br />\n根据第2段，有些人可能把这项提议看作______。</p>\n</blockquote>\n<p>题干直接指定Paragraph 2，且might be regarded by some与该段开头Some might see相接。把第2段从头读到尾，区分有些人的看法和随后冷嘲热讽者的猜测。</p>\n<blockquote><p>原文参考：</p>\n<p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more <strong>[xxx]</strong> title of European capital of culture, a <strong>[xxx]</strong> award <strong>[xxx]</strong> by Glasgow in 1990 and Liverpool in 2008. A cynic might speculate that the UK is on the <strong>[xxx]</strong> of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow—village of culture? <strong>[xxx]</strong> of culture? <strong>[xxx]</strong> of culture?</p>\n<p>开始精读：</p>\n<p>Some might see the proposal / as a booby prize for the fact / that Britain is no longer able to apply / for the much more <strong>[xxx]</strong> title of European capital of culture, / a <strong>[xxx]</strong> award / <strong>[xxx]</strong> by Glasgow in 1990 and Liverpool in 2008. / A cynic might speculate / that the UK is on the <strong>[xxx]</strong> / of disappearing into an endless fever of self-celebration / in its desperation to reinvent itself / for the post-Brexit world: / after town of culture, / who knows what will follow—village of culture? / <strong>[xxx]</strong> of culture? / <strong>[xxx]</strong> of culture?</p>\n<p>有些人可能会看待这项提议， / 把它当作一种安慰奖，针对这个事实： / 英国已不能再申请， / 那个要<strong>[xxx]</strong>得多的欧洲文化之都称号， / 一个<strong>[xxx]</strong>奖项， / 由1990年的格拉斯哥和2008年的利物浦<strong>[xxx]</strong>。 / 一个冷嘲热讽的人可能会猜测， / 英国正处于<strong>[xxx]</strong>， / 即消失在一种无休止的自我庆祝狂热中， / 因为它急切地想重塑自己， / 以适应脱欧后的世界： / 文化城镇之后， / 谁知道接下来会是什么——文化村庄？ / 文化<strong>[xxx]</strong>？ / 文化<strong>[xxx]</strong>？</p>\n</blockquote>\n<p>空格要补的是第2段中有些人如何评价文化城镇奖提议，以及这种评价与英国不能再申请欧洲文化之都称号之间的联系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"22题","raw":"### A. a sensible **[xxx]**\n\n> 一种明智的**[xxx]**\n\n把A接回题干，它说的是：根据第2段，有些人可能把这项提议看作一种明智的**[xxx]**。\n\nA虽有词被遮住，但`sensible`明确说这是一种明智的做法。我们回看`booby prize`以及随后自我庆祝的讥讽。\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply\n\n> an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world\n\n有些人把新奖看作英国失去申请欧洲文化之都机会后给自己的安慰。后面又嘲讽文化城镇之后是否还要不断设文化村庄等称号。\n\n这不是在认真称赞提议高明，而是在怀疑它只是不断给自己找庆祝的理由。\n\nA后面的名词没读懂，也不能抹掉前面的肯定评价。`sensible`和这一段的安慰奖、自我庆祝语气接不上。\n\n**这段把提议讥为安慰奖、不断自我庆祝，是在说它明智吗？**\n\n不是。A已知的肯定评价与本段说法不符。\n\n**第一轮判断：A排除。**","articleRects":[[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35]],"questionRects":[[281,634,379,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"22","paragraphPids":[1]},"html":"<h3>A. a sensible <strong>[xxx]</strong></h3>\n<blockquote><p>一种明智的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第2段，有些人可能把这项提议看作一种明智的<strong>[xxx]</strong>。</p>\n<p>A虽有词被遮住，但<code>sensible</code>明确说这是一种明智的做法。我们回看<code>booby prize</code>以及随后自我庆祝的讥讽。</p>\n<blockquote><p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply</p>\n</blockquote>\n<blockquote><p>an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world</p>\n</blockquote>\n<p>有些人把新奖看作英国失去申请欧洲文化之都机会后给自己的安慰。后面又嘲讽文化城镇之后是否还要不断设文化村庄等称号。</p>\n<p>这不是在认真称赞提议高明，而是在怀疑它只是不断给自己找庆祝的理由。</p>\n<p>A后面的名词没读懂，也不能抹掉前面的肯定评价。<code>sensible</code>和这一段的安慰奖、自我庆祝语气接不上。</p>\n<p><strong>这段把提议讥为安慰奖、不断自我庆祝，是在说它明智吗？</strong></p>\n<p>不是。A已知的肯定评价与本段说法不符。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"22题","raw":"### B. a self-deceiving attempt\n\n> 一种自欺欺人的尝试\n\n把B接回题干，它说的是：根据第2段，有些人可能把这项提议看作一种自欺欺人的尝试。\n\nB说自欺的尝试。原文把不能再申请的事实，与`booby prize`和`self-celebration`放在一起，我们看这项提议在这种人眼中是为了什么。\n\n> as a booby prize for the fact that Britain is no longer able to apply\n\n> an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world\n\n> after town of culture, who knows what will follow—village of culture?\n\n英国失去申请欧洲称号的机会，却开始另设自己的文化奖。有人因此认为它在用新的称号安慰自己。\n\n后面把自我庆祝写成无休止的热潮，还设想称号会一路增到村庄等层级。这些疑问不是在讨论实际资金和岗位，而是在讥讽自己给自己制造值得庆祝的事。\n\nB的自欺概括了这种看法：用自己的新奖遮掩失去原有机会的处境。题干问有些人的看法，不是作者最终态度。\n\n**把新奖当作失去机会后给自己的安慰，又讥讽不断自我庆祝，能否概括成自欺的尝试？**\n\n能。B接住本段这些人的讥讽，先按题干所问的人来判断。\n\n**第一轮判断：B保留。**","articleRects":[[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35]],"questionRects":[[281,693,398,46]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"22","paragraphPids":[1]},"html":"<h3>B. a self-deceiving attempt</h3>\n<blockquote><p>一种自欺欺人的尝试</p>\n</blockquote>\n<p>把B接回题干，它说的是：根据第2段，有些人可能把这项提议看作一种自欺欺人的尝试。</p>\n<p>B说自欺的尝试。原文把不能再申请的事实，与<code>booby prize</code>和<code>self-celebration</code>放在一起，我们看这项提议在这种人眼中是为了什么。</p>\n<blockquote><p>as a booby prize for the fact that Britain is no longer able to apply</p>\n</blockquote>\n<blockquote><p>an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world</p>\n</blockquote>\n<blockquote><p>after town of culture, who knows what will follow—village of culture?</p>\n</blockquote>\n<p>英国失去申请欧洲称号的机会，却开始另设自己的文化奖。有人因此认为它在用新的称号安慰自己。</p>\n<p>后面把自我庆祝写成无休止的热潮，还设想称号会一路增到村庄等层级。这些疑问不是在讨论实际资金和岗位，而是在讥讽自己给自己制造值得庆祝的事。</p>\n<p>B的自欺概括了这种看法：用自己的新奖遮掩失去原有机会的处境。题干问有些人的看法，不是作者最终态度。</p>\n<p><strong>把新奖当作失去机会后给自己的安慰，又讥讽不断自我庆祝，能否概括成自欺的尝试？</strong></p>\n<p>能。B接住本段这些人的讥讽，先按题干所问的人来判断。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"22题","raw":"### C. an eye-catching bonus\n\n> 一项引人注目的额外奖励\n\n把C接回题干，它说的是：根据第2段，有些人可能把这项提议看作一项引人注目的额外奖励。\n\nC说引人注目的额外奖励。原文称它`booby prize`，紧接`for the fact that Britain is no longer able to apply`，我们看奖与失去机会怎样相连。\n\n> Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply\n\n这项奖被看成安慰，是因为英国不能再申请另一个欧洲称号。它在弥补一种失落感。\n\nC的`bonus`说额外得到的奖励，还用`eye-catching`给它正面的吸引力。原文没有把它写成获得原有奖励之外的惊喜，而是在原有机会消失后设一个安慰。\n\n两边虽然都是奖，但奖在这段里为什么出现、带什么语气不同，不能见到`prize`就接成C。\n\n**不能申请原来的称号后给自己的安慰奖，是原文所说引人注目的额外奖励吗？**\n\n不是。C把讥讽中的安慰改成了正面的额外收获。\n\n**第一轮判断：C排除。**","articleRects":[[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35]],"questionRects":[[281,761,372,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"22","paragraphPids":[1]},"html":"<h3>C. an eye-catching bonus</h3>\n<blockquote><p>一项引人注目的额外奖励</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第2段，有些人可能把这项提议看作一项引人注目的额外奖励。</p>\n<p>C说引人注目的额外奖励。原文称它<code>booby prize</code>，紧接<code>for the fact that Britain is no longer able to apply</code>，我们看奖与失去机会怎样相连。</p>\n<blockquote><p>Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply</p>\n</blockquote>\n<p>这项奖被看成安慰，是因为英国不能再申请另一个欧洲称号。它在弥补一种失落感。</p>\n<p>C的<code>bonus</code>说额外得到的奖励，还用<code>eye-catching</code>给它正面的吸引力。原文没有把它写成获得原有奖励之外的惊喜，而是在原有机会消失后设一个安慰。</p>\n<p>两边虽然都是奖，但奖在这段里为什么出现、带什么语气不同，不能见到<code>prize</code>就接成C。</p>\n<p><strong>不能申请原来的称号后给自己的安慰奖，是原文所说引人注目的额外奖励吗？</strong></p>\n<p>不是。C把讥讽中的安慰改成了正面的额外收获。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"22题","raw":"### D. an inaccessible target\n\n> 一个无法实现的目标\n\n把D接回题干，它说的是：根据第2段，有些人可能把这项提议看作一个无法实现的目标。\n\nD说提议是无法实现的目标。段中`no longer able to apply`确实有不能做到，我们看它接的是哪个称号。\n\n> the proposal as a booby prize\n\n> Britain is no longer able to apply for the much more **[xxx]** title of European capital of culture\n\n不能再申请的是`European capital of culture`，欧洲文化之都。题干的提议则是另设英国自己的文化城镇奖。\n\n有些人说这个新奖是安慰奖，原因是旧的欧洲机会没了，并不是说新奖本身也无法设立。\n\nD把不能申请的限制从欧洲称号挪到了城镇奖提议上。两项名称必须分清，不能都当作同一个奖。\n\n**原文说不能申请的是欧洲文化之都，还是拟设的英国文化城镇奖？**\n\n是欧洲文化之都。D把限制接错了对象。\n\n**第一轮判断：D排除。**","articleRects":[[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35]],"questionRects":[[281,824,361,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"22","paragraphPids":[1]},"html":"<h3>D. an inaccessible target</h3>\n<blockquote><p>一个无法实现的目标</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第2段，有些人可能把这项提议看作一个无法实现的目标。</p>\n<p>D说提议是无法实现的目标。段中<code>no longer able to apply</code>确实有不能做到，我们看它接的是哪个称号。</p>\n<blockquote><p>the proposal as a booby prize</p>\n</blockquote>\n<blockquote><p>Britain is no longer able to apply for the much more <strong>[xxx]</strong> title of European capital of culture</p>\n</blockquote>\n<p>不能再申请的是<code>European capital of culture</code>，欧洲文化之都。题干的提议则是另设英国自己的文化城镇奖。</p>\n<p>有些人说这个新奖是安慰奖，原因是旧的欧洲机会没了，并不是说新奖本身也无法设立。</p>\n<p>D把不能申请的限制从欧洲称号挪到了城镇奖提议上。两项名称必须分清，不能都当作同一个奖。</p>\n<p><strong>原文说不能申请的是欧洲文化之都，还是拟设的英国文化城镇奖？</strong></p>\n<p>是欧洲文化之都。D把限制接错了对象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"22题","raw":"### 22题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一次判断：留下B。第2段把提议看成失去申请机会后的安慰，并讥讽不断自我庆祝，可以概括为自欺欺人的尝试。","articleRects":[],"questionRects":[[226,570,1178,39],[281,634,379,37],[281,693,398,46],[281,761,372,37],[281,824,361,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"22"},"html":"<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一次判断：留下B。第2段把提议看成失去申请机会后的安慰，并讥讽不断自我庆祝，可以概括为自欺欺人的尝试。</p>\n"},{"section":"23题","raw":"## 23题\n\n> The author suggests that a title holder is successful only if it ______.  \n> 作者认为，一个称号获得者只有在______时才算成功。\n\n题干中的a title holder和successful与粗读第3段时见到的such titles、They transform the aspirations相接。第3段直接出现The really successful holders of such titles，先把这一整段读完，查看作者怎样区分短暂热闹和真正成功。\n\n> 原文参考：\n> \n> It is also wise to recall that such titles are not a cure-all. A badly run “year of culture” washes in and out of a place like the **[xxx]**, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in **[xxx]** arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a **[xxx]** degree of vision, as well as cooperation between city authorities, the private **[xxx]**, community groups and cultural organisations. But it can be done: Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.\n> \n> 开始精读：\n> \n> It is also wise to recall / that such titles are not a cure-all. / A badly run “year of culture” / washes in and out of a place like the **[xxx]**, / bringing prominence for a spell / but leaving no lasting benefits to the community. / The really successful holders of such titles / are those that do a great deal more / than fill hotel bedrooms / and bring in **[xxx]** arts events / and good press for a year. / They transform the aspirations of the people who live there; / they nudge the self-image of the city / into a bolder and more optimistic light. / It is hard to get right, / and requires a **[xxx]** degree of vision, / as well as cooperation between city authorities, / the private **[xxx]**, / community groups and cultural organisations. / But it can be done: / Glasgow’s year as European capital of culture / can certainly be seen / as one of a complex series of factors / that have turned the city / into the powerhouse of art, music and theatre / that it remains today.\n> \n> 同时，明智的做法是记得， / 这些称号并非万灵药。 / 一个办得糟糕的“文化年”， / 像**[xxx]**一样涌入又退出一个地方， / 带来一时的知名度， / 却没有给当地社区留下长久的益处。 / 这些称号中真正成功的获得者， / 是那些做得多得多的地方， / 远不止填满酒店客房， / 以及引入**[xxx]**艺术活动， / 还有带来一年的正面报道。 / 它们改变居住在那里的人的志向； / 它们推动这座城市的自我形象， / 向着更加大胆、更加乐观的方向变化。 / 要把这件事做好很困难， / 而且需要**[xxx]**程度的远见， / 也需要以下各方之间的合作：城市管理部门， / 私人**[xxx]**， / 社区团体和文化组织。 / 但这可以做到： / 格拉斯哥作为欧洲文化之都的那一年， / 当然可以被看作， / 一系列复杂因素中的一个， / 这些因素已使这座城市变成， / 艺术、音乐和戏剧的重镇， / 直到今天它仍然如此。\n\nonly if要补的是作者判断称号获得者成功所要求的表现。第3段先写办得糟糕的文化年，再写真正成功者做了什么，并交代把这件事做好的条件，要按各句所说的对象和作用来核对。\n\n接下来按A—D逐项看。","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[226,951,947,37],[280,1014,532,38],[280,1077,547,38],[280,1141,547,37],[280,1204,523,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"23","initialReadingPids":[2]},"html":"<h2>23题</h2>\n<blockquote><p>The author suggests that a title holder is successful only if it ______.<br />\n作者认为，一个称号获得者只有在______时才算成功。</p>\n</blockquote>\n<p>题干中的a title holder和successful与粗读第3段时见到的such titles、They transform the aspirations相接。第3段直接出现The really successful holders of such titles，先把这一整段读完，查看作者怎样区分短暂热闹和真正成功。</p>\n<blockquote><p>原文参考：</p>\n<p>It is also wise to recall that such titles are not a cure-all. A badly run “year of culture” washes in and out of a place like the <strong>[xxx]</strong>, bringing prominence for a spell but leaving no lasting benefits to the community. The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in <strong>[xxx]</strong> arts events and good press for a year. They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light. It is hard to get right, and requires a <strong>[xxx]</strong> degree of vision, as well as cooperation between city authorities, the private <strong>[xxx]</strong>, community groups and cultural organisations. But it can be done: Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n<p>开始精读：</p>\n<p>It is also wise to recall / that such titles are not a cure-all. / A badly run “year of culture” / washes in and out of a place like the <strong>[xxx]</strong>, / bringing prominence for a spell / but leaving no lasting benefits to the community. / The really successful holders of such titles / are those that do a great deal more / than fill hotel bedrooms / and bring in <strong>[xxx]</strong> arts events / and good press for a year. / They transform the aspirations of the people who live there; / they nudge the self-image of the city / into a bolder and more optimistic light. / It is hard to get right, / and requires a <strong>[xxx]</strong> degree of vision, / as well as cooperation between city authorities, / the private <strong>[xxx]</strong>, / community groups and cultural organisations. / But it can be done: / Glasgow’s year as European capital of culture / can certainly be seen / as one of a complex series of factors / that have turned the city / into the powerhouse of art, music and theatre / that it remains today.</p>\n<p>同时，明智的做法是记得， / 这些称号并非万灵药。 / 一个办得糟糕的“文化年”， / 像<strong>[xxx]</strong>一样涌入又退出一个地方， / 带来一时的知名度， / 却没有给当地社区留下长久的益处。 / 这些称号中真正成功的获得者， / 是那些做得多得多的地方， / 远不止填满酒店客房， / 以及引入<strong>[xxx]</strong>艺术活动， / 还有带来一年的正面报道。 / 它们改变居住在那里的人的志向； / 它们推动这座城市的自我形象， / 向着更加大胆、更加乐观的方向变化。 / 要把这件事做好很困难， / 而且需要<strong>[xxx]</strong>程度的远见， / 也需要以下各方之间的合作：城市管理部门， / 私人<strong>[xxx]</strong>， / 社区团体和文化组织。 / 但这可以做到： / 格拉斯哥作为欧洲文化之都的那一年， / 当然可以被看作， / 一系列复杂因素中的一个， / 这些因素已使这座城市变成， / 艺术、音乐和戏剧的重镇， / 直到今天它仍然如此。</p>\n</blockquote>\n<p>only if要补的是作者判断称号获得者成功所要求的表现。第3段先写办得糟糕的文化年，再写真正成功者做了什么，并交代把这件事做好的条件，要按各句所说的对象和作用来核对。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"23题","raw":"### A. endeavours to maintain its image\n\n> 努力维持自身的形象\n\n把A接回题干，它说的是：作者认为，一个称号获得者只有努力维持自身形象时才算成功。\n\nA说维持自身形象。第3段也有`self-image`，但它前后的动作是`nudge ... into a bolder and more optimistic light`，我们读清变化方向。\n\n> they nudge the self-image of the city into a bolder and more optimistic light.\n\n作者说要把城市自我形象推向更大胆、更乐观的状态。比较级`bolder`、`more optimistic`表明它要比原先有所变化。\n\nA的`maintain`则是维持已有形象，不让它变掉。努力维持不等于推动提升。\n\n两边都写形象，但成功要求落在怎样改变居民与城市的看法，不只是把原来的样子守住。\n\n**作者要城市形象变得更大胆、乐观，能用维持原有形象来替代吗？**\n\n不能。A把改变提升写成了维持。\n\n**第一轮判断：A排除。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1014,532,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"23","paragraphPids":[2]},"html":"<h3>A. endeavours to maintain its image</h3>\n<blockquote><p>努力维持自身的形象</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为，一个称号获得者只有努力维持自身形象时才算成功。</p>\n<p>A说维持自身形象。第3段也有<code>self-image</code>，但它前后的动作是<code>nudge ... into a bolder and more optimistic light</code>，我们读清变化方向。</p>\n<blockquote><p>they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n<p>作者说要把城市自我形象推向更大胆、更乐观的状态。比较级<code>bolder</code>、<code>more optimistic</code>表明它要比原先有所变化。</p>\n<p>A的<code>maintain</code>则是维持已有形象，不让它变掉。努力维持不等于推动提升。</p>\n<p>两边都写形象，但成功要求落在怎样改变居民与城市的看法，不只是把原来的样子守住。</p>\n<p><strong>作者要城市形象变得更大胆、乐观，能用维持原有形象来替代吗？</strong></p>\n<p>不能。A把改变提升写成了维持。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"23题","raw":"### B. meets the aspirations of its people\n\n> 满足当地居民的愿望\n\n把B接回题干，它说的是：作者认为，一个称号获得者只有满足当地居民的愿望时才算成功。\n\nB说满足居民愿望。原文直接写`transform the aspirations`，我们看是实现原有愿望，还是使愿望本身变化。\n\n> They transform the aspirations of the people who live there;\n\n`transform`让居民的志向发生改变，例如对地方与未来有更大胆的期待。后面的城市形象更乐观，也在写这种改变。\n\nB的`meets`是满足已有愿望：居民原来想要什么，后来得到了什么。这并不是把他们的志向本身改变。\n\n作者没有说所有旧愿望都得到满足。B把直接作用在志向上的“改变”，换成了实现这些志向所要求的事情。\n\n**让居民的志向发生变化，等于原来的愿望已经得到满足吗？**\n\n不等于。原句说改变志向，B说实现愿望，动作不同。\n\n**第一轮判断：B排除。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1077,547,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"23","paragraphPids":[2]},"html":"<h3>B. meets the aspirations of its people</h3>\n<blockquote><p>满足当地居民的愿望</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为，一个称号获得者只有满足当地居民的愿望时才算成功。</p>\n<p>B说满足居民愿望。原文直接写<code>transform the aspirations</code>，我们看是实现原有愿望，还是使愿望本身变化。</p>\n<blockquote><p>They transform the aspirations of the people who live there;</p>\n</blockquote>\n<p><code>transform</code>让居民的志向发生改变，例如对地方与未来有更大胆的期待。后面的城市形象更乐观，也在写这种改变。</p>\n<p>B的<code>meets</code>是满足已有愿望：居民原来想要什么，后来得到了什么。这并不是把他们的志向本身改变。</p>\n<p>作者没有说所有旧愿望都得到满足。B把直接作用在志向上的“改变”，换成了实现这些志向所要求的事情。</p>\n<p><strong>让居民的志向发生变化，等于原来的愿望已经得到满足吗？</strong></p>\n<p>不等于。原句说改变志向，B说实现愿望，动作不同。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"23题","raw":"### C. brings its local arts to prominence\n\n> 使本地艺术受到瞩目\n\n把C接回题干，它说的是：作者认为，一个称号获得者只有使本地艺术受到瞩目时才算成功。\n\nC说本地艺术受到瞩目。第3段前面批评一时出名，末尾却写格拉斯哥直到今天仍是艺术重镇，我们两处一起看。\n\n> bringing prominence for a spell but leaving no lasting benefits to the community.\n\n> have turned the city into the powerhouse of art, music and theatre that it remains today.\n\n文化年只带来短暂知名度却不留下收益，被作者明确批评。若C只指这一种短暂出名，就不够。\n\n不过C没有写短暂，格拉斯哥保持至今的艺术、音乐和戏剧地位，也可以包含本地艺术受到瞩目。因此不能擅自给C加上“一时”再排除。\n\n先把C留下，随后与D比较：作者给所有称号获得者提出的成功要求，究竟是艺术名声，还是更长久的地方改善。\n\n**C没有说艺术只红一阵，而格拉斯哥艺术地位持续至今，现在能仅凭“一时出名不好”就排除C吗？**\n\n不能。C先保留，再看它能否概括作者完整的成功条件。\n\n**第一轮判断：C保留。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1141,547,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"23","paragraphPids":[2]},"html":"<h3>C. brings its local arts to prominence</h3>\n<blockquote><p>使本地艺术受到瞩目</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为，一个称号获得者只有使本地艺术受到瞩目时才算成功。</p>\n<p>C说本地艺术受到瞩目。第3段前面批评一时出名，末尾却写格拉斯哥直到今天仍是艺术重镇，我们两处一起看。</p>\n<blockquote><p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n</blockquote>\n<blockquote><p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<p>文化年只带来短暂知名度却不留下收益，被作者明确批评。若C只指这一种短暂出名，就不够。</p>\n<p>不过C没有写短暂，格拉斯哥保持至今的艺术、音乐和戏剧地位，也可以包含本地艺术受到瞩目。因此不能擅自给C加上“一时”再排除。</p>\n<p>先把C留下，随后与D比较：作者给所有称号获得者提出的成功要求，究竟是艺术名声，还是更长久的地方改善。</p>\n<p><strong>C没有说艺术只红一阵，而格拉斯哥艺术地位持续至今，现在能仅凭“一时出名不好”就排除C吗？</strong></p>\n<p>不能。C先保留，再看它能否概括作者完整的成功条件。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"23题","raw":"### D. commits to its long-term growth\n\n> 致力于自身的长期发展\n\n把D接回题干，它说的是：作者认为，一个称号获得者只有致力于自身的长期发展时才算成功。\n\nD说致力于长期发展。第3段先批评`no lasting benefits`，再写居民志向与城市形象的变化，我们顺着这个区别读。\n\n> bringing prominence for a spell but leaving no lasting benefits to the community.\n\n> They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.\n\n办得糟糕的文化年只有短暂热闹，没有持续收益。成功者做得更多，改变居民的期待，推动城市更大胆、更乐观。\n\n这些变化不是一年酒店住满、媒体报道多就自然完成，而是要求地方在活动后仍有所改善。\n\nD的长期发展正把这种持续性写出来。它不把成功缩成单场艺术活动，而是关注城镇今后能否继续得到帮助。\n\n**作者把无持久收益当作失败，再要求居民与城市持续改善，能否对应致力于长期发展？**\n\n能。D接住了成功与一时热闹之间的区别。\n\n**第一轮判断：D保留。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1204,523,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"23","paragraphPids":[2]},"html":"<h3>D. commits to its long-term growth</h3>\n<blockquote><p>致力于自身的长期发展</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，一个称号获得者只有致力于自身的长期发展时才算成功。</p>\n<p>D说致力于长期发展。第3段先批评<code>no lasting benefits</code>，再写居民志向与城市形象的变化，我们顺着这个区别读。</p>\n<blockquote><p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n</blockquote>\n<blockquote><p>They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.</p>\n</blockquote>\n<p>办得糟糕的文化年只有短暂热闹，没有持续收益。成功者做得更多，改变居民的期待，推动城市更大胆、更乐观。</p>\n<p>这些变化不是一年酒店住满、媒体报道多就自然完成，而是要求地方在活动后仍有所改善。</p>\n<p>D的长期发展正把这种持续性写出来。它不把成功缩成单场艺术活动，而是关注城镇今后能否继续得到帮助。</p>\n<p><strong>作者把无持久收益当作失败，再要求居民与城市持续改善，能否对应致力于长期发展？</strong></p>\n<p>能。D接住了成功与一时热闹之间的区别。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"23题","raw":"### 23题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一次判断：留下C、D。格拉斯哥持续的艺术地位可以支持本地艺术受到瞩目的宽泛表述；作者对持续收益、居民志向和城市形象的要求，也支持致力于长期发展。","articleRects":[],"questionRects":[[226,951,947,37],[280,1014,532,38],[280,1077,547,38],[280,1141,547,37],[280,1204,523,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"23"},"html":"<h3>23题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一次判断：留下C、D。格拉斯哥持续的艺术地位可以支持本地艺术受到瞩目的宽泛表述；作者对持续收益、居民志向和城市形象的要求，也支持致力于长期发展。</p>\n"},{"section":"24题","raw":"## 24题\n\n> Glasgow is mentioned in Paragraph 3 to present ______.  \n> 第3段提到格拉斯哥，是为了呈现______。\n\n题干明确指定Paragraph 3和Glasgow，直接定位第3段末句。第3段已经完整读过，这里连着例子前的It is hard to get right和引出例子的But it can be done一起看，判断格拉斯哥这件事用来说明什么。\n\n题干不是只问格拉斯哥发生了什么，而是问作者为什么在这里提到它。要把本段对文化称号作用的要求、实现的困难和格拉斯哥的结果连起来，核对例子承接的观点。\n\n接下来按A—D逐项看。","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[226,1331,759,38],[280,1395,310,37],[280,1458,360,37],[280,1521,326,38],[280,1581,259,45]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"24","initialReadingPids":[]},"html":"<h2>24题</h2>\n<blockquote><p>Glasgow is mentioned in Paragraph 3 to present ______.<br />\n第3段提到格拉斯哥，是为了呈现______。</p>\n</blockquote>\n<p>题干明确指定Paragraph 3和Glasgow，直接定位第3段末句。第3段已经完整读过，这里连着例子前的It is hard to get right和引出例子的But it can be done一起看，判断格拉斯哥这件事用来说明什么。</p>\n<p>题干不是只问格拉斯哥发生了什么，而是问作者为什么在这里提到它。要把本段对文化称号作用的要求、实现的困难和格拉斯哥的结果连起来，核对例子承接的观点。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"24题","raw":"### A. a contrasting case\n\n> 一个形成对照的例子\n\n把A接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一个形成对照的例子。\n\nA说形成对照的例子。第3段开头有只红一阵的文化年，末尾有格拉斯哥至今的艺术成果，我们先看这份对照确实存在吗。\n\n> bringing prominence for a spell but leaving no lasting benefits to the community.\n\n> But it can be done:\n\n> have turned the city into the powerhouse of art, music and theatre that it remains today.\n\n前面的坏例子只有一时知名度，没有长期收益；格拉斯哥则因多种因素改变成艺术重镇，地位保持到今天。二者确实能对照。\n\n所以不能说A完全不沾边。不过格拉斯哥前面还有一句`But it can be done`，它不只是把两个结果放在一起，还在回答能不能做好。\n\n先留A，再和B看直接引例的这句话。题目问为什么提格拉斯哥，要找这份对照在帮助作者说明什么。\n\n**格拉斯哥的持续成果与前面的一时热闹，能不能形成对照？**\n\n能。A先保留，但还要检查直接引出例子的句子要证明什么。\n\n**第一轮判断：A保留。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1395,310,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"24","paragraphPids":[2]},"html":"<h3>A. a contrasting case</h3>\n<blockquote><p>一个形成对照的例子</p>\n</blockquote>\n<p>把A接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一个形成对照的例子。</p>\n<p>A说形成对照的例子。第3段开头有只红一阵的文化年，末尾有格拉斯哥至今的艺术成果，我们先看这份对照确实存在吗。</p>\n<blockquote><p>bringing prominence for a spell but leaving no lasting benefits to the community.</p>\n</blockquote>\n<blockquote><p>But it can be done:</p>\n</blockquote>\n<blockquote><p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<p>前面的坏例子只有一时知名度，没有长期收益；格拉斯哥则因多种因素改变成艺术重镇，地位保持到今天。二者确实能对照。</p>\n<p>所以不能说A完全不沾边。不过格拉斯哥前面还有一句<code>But it can be done</code>，它不只是把两个结果放在一起，还在回答能不能做好。</p>\n<p>先留A，再和B看直接引例的这句话。题目问为什么提格拉斯哥，要找这份对照在帮助作者说明什么。</p>\n<p><strong>格拉斯哥的持续成果与前面的一时热闹，能不能形成对照？</strong></p>\n<p>能。A先保留，但还要检查直接引出例子的句子要证明什么。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"24题","raw":"### B. a supporting example\n\n> 一个起支持作用的例子\n\n把B接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一个起支持作用的例子。\n\nB说支持性例子。格拉斯哥紧跟在`But it can be done`和冒号后面，我们把这句话与前面的困难连起来。\n\n> It is hard to get right, and requires a **[xxx]** degree of vision\n\n> But it can be done:\n\n> Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors\n\n> have turned the city into the powerhouse of art, music and theatre that it remains today.\n\n作者先说做好很难，需要远见和多方合作；但接着说它能做到。冒号后就拿格拉斯哥说明现实中确实有这样的成果。\n\n格拉斯哥成为艺术重镇并保持至今，证明文化称号不一定只有短暂热闹，也能参与地方持续改变。\n\n作者还说它是复杂因素中的一个，没有把整座城市的变化全归功于奖项。B只说例子支持前面的可行判断，恰好保留这个作用。\n\n**作者说“虽然难，但能做到”，马上举出持续成功的格拉斯哥，是不是在支持这个判断？**\n\n是。B直接接上了引例前的判断，先留下。\n\n**第一轮判断：B保留。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1458,360,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"24","paragraphPids":[2]},"html":"<h3>B. a supporting example</h3>\n<blockquote><p>一个起支持作用的例子</p>\n</blockquote>\n<p>把B接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一个起支持作用的例子。</p>\n<p>B说支持性例子。格拉斯哥紧跟在<code>But it can be done</code>和冒号后面，我们把这句话与前面的困难连起来。</p>\n<blockquote><p>It is hard to get right, and requires a <strong>[xxx]</strong> degree of vision</p>\n</blockquote>\n<blockquote><p>But it can be done:</p>\n</blockquote>\n<blockquote><p>Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors</p>\n</blockquote>\n<blockquote><p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<p>作者先说做好很难，需要远见和多方合作；但接着说它能做到。冒号后就拿格拉斯哥说明现实中确实有这样的成果。</p>\n<p>格拉斯哥成为艺术重镇并保持至今，证明文化称号不一定只有短暂热闹，也能参与地方持续改变。</p>\n<p>作者还说它是复杂因素中的一个，没有把整座城市的变化全归功于奖项。B只说例子支持前面的可行判断，恰好保留这个作用。</p>\n<p><strong>作者说“虽然难，但能做到”，马上举出持续成功的格拉斯哥，是不是在支持这个判断？</strong></p>\n<p>是。B直接接上了引例前的判断，先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"24题","raw":"### C. a background story\n\n> 一段背景故事\n\n把C接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一段背景故事。\n\nC说背景故事。例子前的`But it can be done`已经有一个明确判断，我们看格拉斯哥的过去是拿来交代背景，还是验证它。\n\n> But it can be done:\n\n> Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors\n\n> have turned the city into the powerhouse of art, music and theatre that it remains today.\n\n虽然格拉斯哥获称号发生在过去，但作者强调的是成果一直保持到今天。这个持续结果用于说明文化年可以真正做出成效。\n\n如果只交代背景，主要会介绍这项奖怎么产生、此前发生过什么。这里却在说“可以做到”之后给出做到了的事实。\n\n因此，过去发生的事情并不自动就是背景故事。要看它在这一句中帮忙回答什么，格拉斯哥在回答可否取得长期成效。\n\n**格拉斯哥的经历放在“可以做到”后面，是单纯介绍旧事，还是给这句判断一个实际依据？**\n\n是给实际依据。C把它说明可行性的作用漏掉了。\n\n**第一轮判断：C排除。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1521,326,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"24","paragraphPids":[2]},"html":"<h3>C. a background story</h3>\n<blockquote><p>一段背景故事</p>\n</blockquote>\n<p>把C接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一段背景故事。</p>\n<p>C说背景故事。例子前的<code>But it can be done</code>已经有一个明确判断，我们看格拉斯哥的过去是拿来交代背景，还是验证它。</p>\n<blockquote><p>But it can be done:</p>\n</blockquote>\n<blockquote><p>Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors</p>\n</blockquote>\n<blockquote><p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<p>虽然格拉斯哥获称号发生在过去，但作者强调的是成果一直保持到今天。这个持续结果用于说明文化年可以真正做出成效。</p>\n<p>如果只交代背景，主要会介绍这项奖怎么产生、此前发生过什么。这里却在说“可以做到”之后给出做到了的事实。</p>\n<p>因此，过去发生的事情并不自动就是背景故事。要看它在这一句中帮忙回答什么，格拉斯哥在回答可否取得长期成效。</p>\n<p><strong>格拉斯哥的经历放在“可以做到”后面，是单纯介绍旧事，还是给这句判断一个实际依据？</strong></p>\n<p>是给实际依据。C把它说明可行性的作用漏掉了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"24题","raw":"### D. a related topic\n\n> 一个相关话题\n\n把D接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一个相关话题。\n\nD说一个相关话题。我们看格拉斯哥是否使段落离开原来问题，还是继续回答文化称号能不能有效。\n\n> But it can be done:\n\n> Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors\n\n> have turned the city into the powerhouse of art, music and theatre that it remains today.\n\n前面已经在谈文化年怎样才算成功，格拉斯哥仍是文化称号获得者，其成果仍用来检验长期收益。\n\n它没有把讨论转到另一个问题上，反而紧接`it can be done`说明这件事已经在某地做到。\n\nD虽然可以笼统说格拉斯哥与文化有关，却不能解释作者为何用冒号把它接在可行判断之后。这里是同一论述里的证据，不是另开话题。\n\n**提到格拉斯哥后，作者换了讨论题目，还是继续证明文化称号能取得长期成效？**\n\n是继续证明原来的判断。D没有说出这处紧接关系。\n\n**第一轮判断：D排除。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37]],"questionRects":[[280,1581,259,45]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"24","paragraphPids":[2]},"html":"<h3>D. a related topic</h3>\n<blockquote><p>一个相关话题</p>\n</blockquote>\n<p>把D接回题干，它说的是：第3段提到格拉斯哥，是为了呈现一个相关话题。</p>\n<p>D说一个相关话题。我们看格拉斯哥是否使段落离开原来问题，还是继续回答文化称号能不能有效。</p>\n<blockquote><p>But it can be done:</p>\n</blockquote>\n<blockquote><p>Glasgow’s year as European capital of culture can certainly be seen as one of a complex series of factors</p>\n</blockquote>\n<blockquote><p>have turned the city into the powerhouse of art, music and theatre that it remains today.</p>\n</blockquote>\n<p>前面已经在谈文化年怎样才算成功，格拉斯哥仍是文化称号获得者，其成果仍用来检验长期收益。</p>\n<p>它没有把讨论转到另一个问题上，反而紧接<code>it can be done</code>说明这件事已经在某地做到。</p>\n<p>D虽然可以笼统说格拉斯哥与文化有关，却不能解释作者为何用冒号把它接在可行判断之后。这里是同一论述里的证据，不是另开话题。</p>\n<p><strong>提到格拉斯哥后，作者换了讨论题目，还是继续证明文化称号能取得长期成效？</strong></p>\n<p>是继续证明原来的判断。D没有说出这处紧接关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"24题","raw":"### 24题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n暂时保留：A、B。\n\n第一次判断：留下A、B。格拉斯哥的持续成果能与前面一时出名的情形形成对照；它又直接承接But it can be done，为文化称号能够取得成效提供例证。","articleRects":[],"questionRects":[[226,1331,759,38],[280,1395,310,37],[280,1458,360,37],[280,1521,326,38],[280,1581,259,45]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"24"},"html":"<h3>24题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一次判断：留下A、B。格拉斯哥的持续成果能与前面一时出名的情形形成对照；它又直接承接But it can be done，为文化称号能够取得成效提供例证。</p>\n"},{"section":"25题","raw":"## 25题\n\n> What is the author’s attitude towards the proposal?  \n> 作者对这项提议持什么态度？\n\n题干问author’s attitude towards the proposal，粗读最后一段时读到and turn it into action，提到把提议付诸行动。回到第4段完整阅读，核对作者本人怎样评价文化城镇奖，以及他希望文化大臣如何对待这项提议。\n\n> 原文参考：\n> \n> A “town of culture” could be not just about the arts but about honouring a town’s **[xxx]**—helping sustain its high street, supporting local **[xxx]** and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.\n> \n> 开始精读：\n> \n> A “town of culture” could be / not just about the arts / but about honouring a town’s **[xxx]**—helping sustain its high street, / supporting local **[xxx]** / and above all celebrating its people. / Jeremy Wright, / the culture secretary, / should welcome this positive, hope-filled proposal, / and turn it into action.\n> \n> 一个“文化城镇”可以是， / 不仅关乎艺术， / 还关乎赞颂一个城镇的**[xxx]**——帮助维持它的商业街， / 支持本地**[xxx]**， / 而最重要的是赞美这里的人们。 / 杰里米·赖特， / 这位文化大臣， / 应该欢迎这个积极、充满希望的提议， / 并将其付诸行动。\n\n要判断的是作者对文化城镇奖提议的态度。第4段先写它可以包含哪些事情，末句直接评价这项提议并要求采取行动，选项要与作者本人的评价和主张相合。\n\n接下来按A—D逐项看。","articleRects":[[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[226,1712,803,37],[280,1775,191,37],[280,1838,195,38],[280,1902,216,30],[280,1965,166,31],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"25","initialReadingPids":[3]},"html":"<h2>25题</h2>\n<blockquote><p>What is the author’s attitude towards the proposal?<br />\n作者对这项提议持什么态度？</p>\n</blockquote>\n<p>题干问author’s attitude towards the proposal，粗读最后一段时读到and turn it into action，提到把提议付诸行动。回到第4段完整阅读，核对作者本人怎样评价文化城镇奖，以及他希望文化大臣如何对待这项提议。</p>\n<blockquote><p>原文参考：</p>\n<p>A “town of culture” could be not just about the arts but about honouring a town’s <strong>[xxx]</strong>—helping sustain its high street, supporting local <strong>[xxx]</strong> and above all celebrating its people. Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.</p>\n<p>开始精读：</p>\n<p>A “town of culture” could be / not just about the arts / but about honouring a town’s <strong>[xxx]</strong>—helping sustain its high street, / supporting local <strong>[xxx]</strong> / and above all celebrating its people. / Jeremy Wright, / the culture secretary, / should welcome this positive, hope-filled proposal, / and turn it into action.</p>\n<p>一个“文化城镇”可以是， / 不仅关乎艺术， / 还关乎赞颂一个城镇的<strong>[xxx]</strong>——帮助维持它的商业街， / 支持本地<strong>[xxx]</strong>， / 而最重要的是赞美这里的人们。 / 杰里米·赖特， / 这位文化大臣， / 应该欢迎这个积极、充满希望的提议， / 并将其付诸行动。</p>\n</blockquote>\n<p>要判断的是作者对文化城镇奖提议的态度。第4段先写它可以包含哪些事情，末句直接评价这项提议并要求采取行动，选项要与作者本人的评价和主张相合。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"25题","raw":"### A. Skeptical.\n\n> 怀疑的\n\n把A接回题干，它说的是：作者对文化城镇奖提议持怀疑态度。\n\nA说作者怀疑提议。末段直接叫它`positive, hope-filled`，并要求`turn it into action`，我们看作者本人的最后判断。\n\n> should welcome this positive, hope-filled proposal, and turn it into action.\n\n作者说提议积极、充满希望，而且文化大臣应该欢迎并实施。这是肯定后继续提出行动要求。\n\n前面有些人的讥讽不能直接算到作者头上；第三段承认难度，也没有让他停止支持。\n\nA若只记得安慰奖或实现困难，会漏掉末段作者明确作出的取舍。\n\n**作者把提议称为积极、充满希望，并要求实施，最后表现的是怀疑吗？**\n\n不是。这里已经明确肯定并支持落实。\n\n**第一轮判断：A排除。**","articleRects":[[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[280,1775,191,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"25","paragraphPids":[3]},"html":"<h3>A. Skeptical.</h3>\n<blockquote><p>怀疑的</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对文化城镇奖提议持怀疑态度。</p>\n<p>A说作者怀疑提议。末段直接叫它<code>positive, hope-filled</code>，并要求<code>turn it into action</code>，我们看作者本人的最后判断。</p>\n<blockquote><p>should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n<p>作者说提议积极、充满希望，而且文化大臣应该欢迎并实施。这是肯定后继续提出行动要求。</p>\n<p>前面有些人的讥讽不能直接算到作者头上；第三段承认难度，也没有让他停止支持。</p>\n<p>A若只记得安慰奖或实现困难，会漏掉末段作者明确作出的取舍。</p>\n<p><strong>作者把提议称为积极、充满希望，并要求实施，最后表现的是怀疑吗？</strong></p>\n<p>不是。这里已经明确肯定并支持落实。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"25题","raw":"### B. Objective.\n\n> 客观的\n\n把B接回题干，它说的是：作者对文化城镇奖提议持客观态度。\n\nB说客观。文章确实交代了质疑和困难，但题干问态度，我们看末句有没有自己的赞成或反对。\n\n> should welcome this positive, hope-filled proposal, and turn it into action.\n\n`positive`和`hope-filled`都是作者直接加给提议的好评，`should welcome`又让文化大臣欢迎它。\n\n这说明作者并未停在不表态地罗列各方意见，而是选定了支持的一边。\n\n承认困难可以使分析更周全，但不妨碍作者有明确态度。B不能因前文写了不同说法，就抹去结尾的肯定与实施要求。\n\n**把不同看法都写过之后，作者是否仍然没有表达赞成或反对？**\n\n不是。他最后明确要求欢迎和落实，B的客观中立概括不准。\n\n**第一轮判断：B排除。**","articleRects":[[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[280,1838,195,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"25","paragraphPids":[3]},"html":"<h3>B. Objective.</h3>\n<blockquote><p>客观的</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对文化城镇奖提议持客观态度。</p>\n<p>B说客观。文章确实交代了质疑和困难，但题干问态度，我们看末句有没有自己的赞成或反对。</p>\n<blockquote><p>should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n<p><code>positive</code>和<code>hope-filled</code>都是作者直接加给提议的好评，<code>should welcome</code>又让文化大臣欢迎它。</p>\n<p>这说明作者并未停在不表态地罗列各方意见，而是选定了支持的一边。</p>\n<p>承认困难可以使分析更周全，但不妨碍作者有明确态度。B不能因前文写了不同说法，就抹去结尾的肯定与实施要求。</p>\n<p><strong>把不同看法都写过之后，作者是否仍然没有表达赞成或反对？</strong></p>\n<p>不是。他最后明确要求欢迎和落实，B的客观中立概括不准。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"25题","raw":"### C. Favourable.\n\n> 赞成的\n\n把C接回题干，它说的是：作者对文化城镇奖提议持赞成态度。\n\nC说赞成。末句有评价词，也有行动建议，我们把两种表达接在一起。\n\n> should welcome this positive, hope-filled proposal, and turn it into action.\n\n作者把提议称为积极、充满希望，先说明自己怎么看它。随后要求文化大臣欢迎，再把它变成行动，说明自己希望它被怎样处理。\n\n好评和实施要求朝同一个方向，都支持提议。\n\nC只概括赞成，不声称作者觉得它无需规划、一定成功，因此与前面承认困难也不冲突。\n\n**积极、充满希望的评价，加上欢迎并实施的要求，是否明确表示赞成？**\n\n是。C准确概括了作者本人给出的态度。\n\n**第一轮判断：C保留。**","articleRects":[[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[280,1902,216,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"25","paragraphPids":[3]},"html":"<h3>C. Favourable.</h3>\n<blockquote><p>赞成的</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者对文化城镇奖提议持赞成态度。</p>\n<p>C说赞成。末句有评价词，也有行动建议，我们把两种表达接在一起。</p>\n<blockquote><p>should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n<p>作者把提议称为积极、充满希望，先说明自己怎么看它。随后要求文化大臣欢迎，再把它变成行动，说明自己希望它被怎样处理。</p>\n<p>好评和实施要求朝同一个方向，都支持提议。</p>\n<p>C只概括赞成，不声称作者觉得它无需规划、一定成功，因此与前面承认困难也不冲突。</p>\n<p><strong>积极、充满希望的评价，加上欢迎并实施的要求，是否明确表示赞成？</strong></p>\n<p>是。C准确概括了作者本人给出的态度。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"25题","raw":"### D. Critical.\n\n> 批评的\n\n把D接回题干，它说的是：作者对文化城镇奖提议持批评态度。\n\nD说批评提议。我们回到末句，分清作者有没有要求放弃它，或指出它本身不可取。\n\n> should welcome this positive, hope-filled proposal, and turn it into action.\n\n作者恰恰要求文化大臣欢迎并执行，还用积极、充满希望评价它。这里没有否定提议。\n\n前面批评办得糟糕的文化年，只是提醒称号本身不能保证好结果。指出怎样办才有效，不等于批评设文化城镇奖这项提议。\n\nD把对糟糕实施方式的提醒，当成了对提议整体的否定，与最后的实施要求接不上。\n\n**提醒称号不是万能的，同时仍要求实施提议，能把总体态度说成批评提议吗？**\n\n不能。作者仍然支持提议，只要求把它办好。\n\n**第一轮判断：D排除。**","articleRects":[[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[280,1965,166,31],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"25","paragraphPids":[3]},"html":"<h3>D. Critical.</h3>\n<blockquote><p>批评的</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对文化城镇奖提议持批评态度。</p>\n<p>D说批评提议。我们回到末句，分清作者有没有要求放弃它，或指出它本身不可取。</p>\n<blockquote><p>should welcome this positive, hope-filled proposal, and turn it into action.</p>\n</blockquote>\n<p>作者恰恰要求文化大臣欢迎并执行，还用积极、充满希望评价它。这里没有否定提议。</p>\n<p>前面批评办得糟糕的文化年，只是提醒称号本身不能保证好结果。指出怎样办才有效，不等于批评设文化城镇奖这项提议。</p>\n<p>D把对糟糕实施方式的提醒，当成了对提议整体的否定，与最后的实施要求接不上。</p>\n<p><strong>提醒称号不是万能的，同时仍要求实施提议，能把总体态度说成批评提议吗？</strong></p>\n<p>不能。作者仍然支持提议，只要求把它办好。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"25题","raw":"### 25题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一次判断：留下C。作者把提议评价为积极、充满希望，并要求文化大臣欢迎和实施，态度是赞成。","articleRects":[],"questionRects":[[226,1712,803,37],[280,1775,191,37],[280,1838,195,38],[280,1902,216,30],[280,1965,166,31],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"25"},"html":"<h3>25题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次判断：留下C。作者把提议评价为积极、充满希望，并要求文化大臣欢迎和实施，态度是赞成。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | a call to institute；attracting funding and creating jobs | 以“a call to institute”提出文化城镇奖，并用“attracting funding and creating jobs”说明预期作用：城镇虽能参评，却在与较大对手竞争时缺乏资源，另设奖项希望使城市已有的收益也能惠及城镇，为全文立下提议及其理由。 | 介绍文化城镇奖的倡议与城镇需求。 |\n| 第2段 | a booby prize；an endless fever of self-celebration | 以“a booby prize”转述一些人的轻视，再用“an endless fever of self-celebration”呈现冷嘲热讽者的猜测：英国不能再申请欧洲文化之都，国内接连设奖可能被看作自我安慰；这一段提出对前段提议的质疑。 | 写可能的质疑，为下文判断这一称号的实际价值作铺垫。 |\n| 第3段 | such titles are not a cure-all；But it can be done | 从“such titles are not a cure-all”承认称号并非万能，用“no lasting benefits”说明短暂热闹的问题，再用“transform the aspirations”写成功者改变居民和城市状态的表现。段末“But it can be done”带出格拉斯哥持续的艺术成果，说明困难之下仍能实现长久改善，回应前面的顾虑。 | 用效果不一的实例限定收益，同时说明称号能够推动改变。 |\n| 第4段 | not just about the arts；turn it into action | 以“not just about the arts”扩展提议的意义，具体提到“helping sustain its high street”和“celebrating its people”，把关注点落到城镇生活和居民；最后用“turn it into action”明确要求实施，形成对提议的赞许。 | 将文化扩展到城镇生活与居民参与，落到如何把支持变为行动。 |\n\n全文认为文化城镇奖值得推进：它可以给城镇带来资金、就业及更广的居民收益，但有价值的文化称号应促成持续的发展，不能停在短暂声望或自我庆祝。","articleRects":[[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38],[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35],[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37],[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>a call to institute；attracting funding and creating jobs</td><td>以“a call to institute”提出文化城镇奖，并用“attracting funding and creating jobs”说明预期作用：城镇虽能参评，却在与较大对手竞争时缺乏资源，另设奖项希望使城市已有的收益也能惠及城镇，为全文立下提议及其理由。</td><td>介绍文化城镇奖的倡议与城镇需求。</td></tr><tr><td>第2段</td><td>a booby prize；an endless fever of self-celebration</td><td>以“a booby prize”转述一些人的轻视，再用“an endless fever of self-celebration”呈现冷嘲热讽者的猜测：英国不能再申请欧洲文化之都，国内接连设奖可能被看作自我安慰；这一段提出对前段提议的质疑。</td><td>写可能的质疑，为下文判断这一称号的实际价值作铺垫。</td></tr><tr><td>第3段</td><td>such titles are not a cure-all；But it can be done</td><td>从“such titles are not a cure-all”承认称号并非万能，用“no lasting benefits”说明短暂热闹的问题，再用“transform the aspirations”写成功者改变居民和城市状态的表现。段末“But it can be done”带出格拉斯哥持续的艺术成果，说明困难之下仍能实现长久改善，回应前面的顾虑。</td><td>用效果不一的实例限定收益，同时说明称号能够推动改变。</td></tr><tr><td>第4段</td><td>not just about the arts；turn it into action</td><td>以“not just about the arts”扩展提议的意义，具体提到“helping sustain its high street”和“celebrating its people”，把关注点落到城镇生活和居民；最后用“turn it into action”明确要求实施，形成对提议的赞许。</td><td>将文化扩展到城镇生活与居民参与，落到如何把支持变为行动。</td></tr></tbody></table>\n<p>全文认为文化城镇奖值得推进：它可以给城镇带来资金、就业及更广的居民收益，但有价值的文化称号应促成持续的发展，不能停在短暂声望或自我庆祝。</p>\n"},{"section":"进阶回查","raw":"## 回查23题：C还是D？\n\nC. brings its local arts to prominence\n\nD. commits to its long-term growth\n\nC说让本地艺术受到瞩目，D说致力于长期发展。格拉斯哥艺术地位保持至今，所以不能给C加上“只是短暂出名”再排除。\n\n现在回到作者对所有称号获得者提出的要求。第3段先把失败写成：\n\n> bringing prominence for a spell but leaving no lasting benefits to the community\n\n问题不只在名声有多大，而在没有给社区留下长久收益。成功者则改变居民志向，推动城市更大胆、更乐观。\n\n第1段为什么设奖？因为城镇也希望：\n\n> attracting funding and creating jobs\n\n末段又明确说：\n\n> not just about the arts\n>\n> helping sustain its high street\n>\n> above all celebrating its people\n\n作者要帮助的是当地整体：资金、岗位、商业街、居民，以及他们对未来的期待。艺术当然重要，但不能用艺术名声代替这些持续改善。\n\n**题干问称号获得者怎样才算成功，作者给出的要求只落在艺术是否出名吗？**\n\n不只。C可以描述格拉斯哥的一项成果，D却能把作者要求的持久收益、居民变化和地方发展同时接上。因此成功条件应选D。\n\n> **23题选D。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37],[274,295,1122,38],[202,346,1194,39],[202,399,1194,38],[202,452,1195,37],[202,504,1194,37],[202,556,1194,38],[202,608,1194,38],[202,660,1184,38],[202,712,1194,38],[202,765,382,38],[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[226,951,947,37],[280,1014,532,38],[280,1077,547,38],[280,1141,547,37],[280,1204,523,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[1,4],"finalChoice":"D","qid":"23","paragraphPids":[0,1,2,3]},"html":"<h2>回查23题：C还是D？</h2>\n<p>C. brings its local arts to prominence</p>\n<p>D. commits to its long-term growth</p>\n<p>C说让本地艺术受到瞩目，D说致力于长期发展。格拉斯哥艺术地位保持至今，所以不能给C加上“只是短暂出名”再排除。</p>\n<p>现在回到作者对所有称号获得者提出的要求。第3段先把失败写成：</p>\n<blockquote><p>bringing prominence for a spell but leaving no lasting benefits to the community</p>\n</blockquote>\n<p>问题不只在名声有多大，而在没有给社区留下长久收益。成功者则改变居民志向，推动城市更大胆、更乐观。</p>\n<p>第1段为什么设奖？因为城镇也希望：</p>\n<blockquote><p>attracting funding and creating jobs</p>\n</blockquote>\n<p>末段又明确说：</p>\n<blockquote><p>not just about the arts</p>\n<p>helping sustain its high street</p>\n<p>above all celebrating its people</p>\n</blockquote>\n<p>作者要帮助的是当地整体：资金、岗位、商业街、居民，以及他们对未来的期待。艺术当然重要，但不能用艺术名声代替这些持续改善。</p>\n<p><strong>题干问称号获得者怎样才算成功，作者给出的要求只落在艺术是否出名吗？</strong></p>\n<p>不只。C可以描述格拉斯哥的一项成果，D却能把作者要求的持久收益、居民变化和地方发展同时接上。因此成功条件应选D。</p>\n<blockquote><p><strong>23题选D。</strong></p>\n</blockquote>\n"},{"section":"进阶回查","raw":"## 回查24题：A还是B？\n\nA. a contrasting case\n\nB. a supporting example\n\nA说格拉斯哥用于对照，B说它用来支持判断。前面有一时热闹，后面有持续成果，确实存在对照。现在要看作者为什么安排这份对照。\n\n第2段有人质疑新奖不过是安慰与自我庆祝。第3段作者也先承认称号不是万灵药，办得不好可能没有长久收益。\n\n接着他说成功需要改变居民和城市，也需要合作，最后转到：\n\n> It is hard to get right ...\n>\n> But it can be done:\n\n这时要回答的是：即使很难，真的能办好吗？冒号后马上接格拉斯哥：\n\n> one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today\n\n它已有持续成果，而且称号是促成变化的一项因素。这为“可以做到”提供了实际例子。随后末段才接到作者要求欢迎并实施提议。\n\n**格拉斯哥的长期成果，直接帮助前面“但这可以做到”这句话完成了什么？**\n\n使这句判断有现实依据。A指出了结果的对照，却没有说出作者借对照要证明的可行性。B更直接回答提到格拉斯哥的用意。\n\n> **24题选B。**","articleRects":[[274,1182,1123,38],[202,1233,1195,39],[203,1287,1193,37],[202,1339,1194,38],[203,1391,1193,38],[203,1443,1193,38],[202,1496,1195,37],[202,1548,1194,38],[202,1600,1185,38],[202,1652,1195,38],[202,1704,1189,38],[202,1757,582,37],[274,817,1122,38],[202,869,1197,38],[202,921,1184,38],[202,973,1194,38],[202,1026,1195,37],[202,1078,1193,38],[203,1130,560,35],[274,1807,1123,40],[202,1861,1195,38],[203,1913,1193,38],[203,1966,995,37]],"questionRects":[[226,1331,759,38],[280,1395,310,37],[280,1458,360,37],[280,1521,326,38],[280,1581,259,45]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","B"],"newEvidencePids":[2,4],"finalChoice":"B","qid":"24","paragraphPids":[0,1,2,3]},"html":"<h2>回查24题：A还是B？</h2>\n<p>A. a contrasting case</p>\n<p>B. a supporting example</p>\n<p>A说格拉斯哥用于对照，B说它用来支持判断。前面有一时热闹，后面有持续成果，确实存在对照。现在要看作者为什么安排这份对照。</p>\n<p>第2段有人质疑新奖不过是安慰与自我庆祝。第3段作者也先承认称号不是万灵药，办得不好可能没有长久收益。</p>\n<p>接着他说成功需要改变居民和城市，也需要合作，最后转到：</p>\n<blockquote><p>It is hard to get right ...</p>\n<p>But it can be done:</p>\n</blockquote>\n<p>这时要回答的是：即使很难，真的能办好吗？冒号后马上接格拉斯哥：</p>\n<blockquote><p>one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today</p>\n</blockquote>\n<p>它已有持续成果，而且称号是促成变化的一项因素。这为“可以做到”提供了实际例子。随后末段才接到作者要求欢迎并实施提议。</p>\n<p><strong>格拉斯哥的长期成果，直接帮助前面“但这可以做到”这句话完成了什么？</strong></p>\n<p>使这句判断有现实依据。A指出了结果的对照，却没有说出作者借对照要证明的可行性。B更直接回答提到格拉斯哥的用意。</p>\n<blockquote><p><strong>24题选B。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**21. C**\n\n**22. B**\n\n**23. D**\n\n**24. B**\n\n**25. C**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>21. C</strong></p>\n<p><strong>22. B</strong></p>\n<p><strong>23. D</strong></p>\n<p><strong>24. B</strong></p>\n<p><strong>25. C</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRiIBBQBXRUJQVlA4TBUBBQAvV0Y1As34liTJkiTJtoAp4w2l/v+DzSKt5j6PEf2fgP3/8en+09n5T/ef83peqR8Vl8rRq0/bzl7d/tb+detEEu5KcAmVPlwVvVvVXamSS+0jQud1kBih0DfnSlGponsWch9WbVt/1l7bXTtoY9WHUIi1YvcPcTkKH1wl6fUu9Lt79GF3YrhOmKtwudE3g54ik3kt5Fulx/78qet516trVfcFOZZFcPK6Qj5cr/SqqJKYqD5ss81+ZZs9zV7tI1yOevzn/Sm7tp4/7e5Koq6fb0GD9PR+eaYPpfSu97tq6fcPv97ZNseMvdtmnzF1R7p/SIuSCX3pekIdqt256nrq+rCd55zXcIc8gy92chTSVel6pNiXrff701Ov67lSfYooYklFaFniPvzcFZ07xfWX+7dxN85h/zk2Vi2jQh7HKjoffo7u+lP
