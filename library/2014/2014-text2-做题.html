<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**A lot of students take up law as their profession due to ______.**\n\n> 许多学生选择法律作为职业，是因为______。\n\n题型：**原因细节题**。\n\n---","html":"<h2>26题题干</h2>\n<p><strong>A lot of students take up law as their profession due to ______.</strong></p>\n<blockquote>\n<p>许多学生选择法律作为职业，是因为______。</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[248,208,1111,48],[308,274,599,47],[310,340,619,47],[309,405,649,48],[309,471,607,39]],"scrollTarget":null,"meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**Which of the following adds to the costs of legal education in most American states?**\n\n> 在美国多数州，以下哪一项增加了法律教育成本？\n\n题型：**具体细节题**。\n\n---","html":"<h2>27题题干</h2>\n<p><strong>Which of the following adds to the costs of legal education in most American states?</strong></p>\n<blockquote>\n<p>在美国多数州，以下哪一项增加了法律教育成本？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[310,672,114,40],[309,734,792,48],[309,800,816,47],[309,866,807,47],[309,932,826,47],[248,1063,1181,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**Hindrance to the reform of the legal system originates from ______.**\n\n> 法律体系改革的阻力来自哪里？\n\n题型：**原因细节题**。\n\n---","html":"<h2>28题题干</h2>\n<p><strong>Hindrance to the reform of the legal system originates from ______.</strong></p>\n<blockquote>\n<p>法律体系改革的阻力来自哪里？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[309,1195,674,47],[309,1260,723,47],[309,1326,656,47],[248,1456,1335,49]],"scrollTarget":null,"meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**The guild-like ownership structure is considered “restrictive” partly because it ______.**\n\n> 行会式所有权结构之所以被认为“限制性强”，部分原因是它______。\n\n题型：**原因细节题**。\n\n---","html":"<h2>29题题干</h2>\n<p><strong>The guild-like ownership structure is considered “restrictive” partly because it ______.</strong></p>\n<blockquote>\n<p>行会式所有权结构之所以被认为“限制性强”，部分原因是它______。</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[309,1589,737,47],[309,1655,771,47],[309,1721,757,47],[309,1786,794,47],[249,1918,864,47],[308,1984,973,47],[309,2049,1002,40]],"scrollTarget":null,"meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**In this text, the author mainly discusses ______.**\n\n> 本文主要讨论什么？\n\n题型：**全文作者观点 / 全文主旨题**。\n\n---","html":"<h2>30题题干</h2>\n<p><strong>In this text, the author mainly discusses ______.</strong></p>\n<blockquote>\n<p>本文主要讨论什么？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点 / 全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[309,2115,1017,47],[309,2181,1070,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, One is, In fact |\n| 态度词 / 评价词 | 先抓个大概好坏 | hostility, costly, sensible |\n| 动作词 | 先看谁做了什么 | spending, allow, own shares |\n| 结果词 | 看最后出了什么事 | debt, high fees, efficiency |\n| 重复主题词 | 大概知道老在说什么 | lawyers, law schools, costs, reform |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>But, One is, In fact</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>hostility, costly, sensible</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>spending, allow, own shares</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>debt, high fees, efficiency</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>lawyers, law schools, costs, reform</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[301,322,1255,47],[222,378,1332,47],[222,434,1197,47]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"All around the world, lawyers generate more **[xxx]** than the members of any other profession—with the possible exception of journalism. But there are few places where clients have more grounds for complaint than America.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>All around the world, lawyers generate more <span class=\"mask\">[xxx]</span> than the members of any other profession—with the possible exception of journalism. But there are few places where clients have more grounds for complaint than America.</p>\n</div></div>","articleRects":[[301,322,1255,47],[222,378,1332,47],[222,434,1197,47]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"All around the world, lawyers generate more **[xxx]** than the members of any other profession—with the possible exception of journalism. / But there are few places where clients have more grounds for complaint than America.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>All around the world, lawyers generate more <span class=\"mask\">[xxx]</span> than the members of any other profession—wi 能形成一个很松的印象：开头在说美国客户抱怨律师、法律服务开支和学生涌入法学院；中间出现本科学位、法学学位、债务、州级机构、资格考试；后面又有行会式所有权、非律师持股、技术、专业经理以及其他国家。\n\n到这里还不能自然地说清楚：律师为什么招人反感，学生为何仍然选择法律职业，教育路径和高收费之间怎样连接，州级机构到底阻碍了哪些变化，非律师持股会不会伤害职业伦理，以及作者最想解决的是教育、所有权还是整个法律服务体系。粗读时只要能判断“这篇文章大概和美国法律职业的高成本及改革有关”，并知道这些信息大约出现在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住法律服务开支、法学院债务、州级机构、行会式所有权和结尾的非律师持股；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到法学院成本、改革阻力或律所所有权时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头在说美国客户抱怨律师、法律服务开支和学生涌入法学院；中间出现本科学位、法学学位、债务、州级机构、资格考试；后面又有行会式所有权、非律师持股、技术、专业经理以及其他国家。</p>\n<p>到这里还不能自然地说清楚：律师为什么招人反感，学生为何仍然选择法律职业，教育路径和高收费之间怎样连接，州级机构到底阻碍了哪些变化，非律师持股会不会伤害职业伦理，以及作者最想解决的是教育、所有权还是整个法律服务体系。粗读时只要能判断“这篇文章大概和美国法律职业的高成本及改革有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住法律服务开支、法学院债务、州级机构、行会式所有权和结尾的非律师持股；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> A lot of students take up law as their profession due to ______.  \n> 许多学生选择法律作为职业，是因为______。\n\n粗读时我大概记得第2段留下过“学生”这个碎片，题干也出现“学生”，所以回到第2段完整读一遍。\n\n> 原文参考：\n>\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as **[xxx]**. The best lawyers made **[xxx]** of money, **[xxx]** ever more students to pile into law schools. But most law graduates **[xxx]** get a big-firm job. Many of them instead become the kind of **[xxx]** filer that makes the **[xxx]** system a costly nightmare.\n>\n> 开始精读：\n>\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as **[xxx]**. / The best lawyers made **[xxx]** of money, **[xxx]** ever more students to pile into law schools. / But most law graduates **[xxx]** get a big-firm job. / Many of them instead become the kind of **[xxx]** filer that makes the **[xxx]** system a costly nightmare.\n>\n> 顺着英文顺序读：\n>\n> 在经济危机前的十年里，美国法律服务支出的增长速度是[xxx]的两倍。 / 最优秀的律师赚得盆满钵满，这[xxx]越来越多学生涌入法学院。 / 但大多数法学院毕业生[xxx]得到大所工作。 / 其中许多人反而成了提起[xxx]诉讼的人，使[xxx]制度变成代价高昂的噩梦。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>26题</h2>\n<blockquote>\n<p>A lot of students take up law as their profession due to <strong><strong><strong>.<br />\n许多学生选择法律作为职业，是因为</strong></strong></strong>。</p>\n</blockquote>\n<p>粗读时我大概记得第2段留下过“学生”这个碎片，题干也出现“学生”，所以回到第2段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>During the decade before the economic crisis, spending on legal services in America grew twice as fast as <span class=\"mask\">[xxx]</span>. The best lawyers made <span class=\"mask\">[xxx]</span> of money, <span class=\"mask\">[xxx]</span> ever more students to pile into law schools. But most law graduates <span class=\"mask\">[xxx]</span> get a big-firm job. Many of them instead become the kind of <span class=\"mask\">[xxx]</span> filer that makes the <span class=\"mask\">[xxx]</span> system a costly nightmare.</p>\n<p>开始精读：</p>\n<p>During the decade before the economic crisis, spending on legal services in America grew twice as fast as <span class=\"mask\">[xxx]</span>. / The best lawyers made <span class=\"mask\">[xxx]</span> of money, <span class=\"mask\">[xxx]</span> ever more students to pile into law schools. / But most law graduates <span class=\"mask\">[xxx]</span> get a big-firm job. / Many of them instead become the kind of <span class=\"mask\">[xxx]</span> filer that makes the <span class=\"mask\">[xxx]</span> system a costly nightmare.</p>\n<p>顺着英文顺序读：</p>\n<p>在经济危机前的十年里，美国法律服务支出的增长速度是[xxx]的两倍。 / 最优秀的律师赚得盆满钵满，这[xxx]越来越多学生涌入法学院。 / 但大多数法学院毕业生[xxx]得到大所工作。 / 其中许多人反而成了提起[xxx]诉讼的人，使[xxx]制度变成代价高昂的噩梦。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[301,490,1253,48],[222,547,1331,47],[222,603,1332,47],[222,660,1334,47],[222,716,1114,47]],"questionRects":[[248,208,1111,48],[308,274,599,47],[310,340,619,47],[309,405,649,48],[309,471,607,39]],"scrollTarget":null,"meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. the growing demand from clients\n\n> 客户不断增长的需求\n\n把A接回题干，它说的是：学生选择法律是因为客户需求增长。\n\nA里的“growing demand from clients”和原文“students to pile into law schools”都在回答什么因素直接吸引学生进入法学院，因为选项和原文都在说明学生选择法律的原因，所以回看第2段这句话。\n\n> The best lawyers made **[xxx]** of money, **[xxx]** ever more students to pile into law schools.\n\n“growing demand from clients”要求客户需求先增长，而“students to pile into law schools”前面的直接刺激是顶尖律师赚大钱。 因此“growing demand from clients”与“students to pile into law schools”在这里仍有具体差别。\n\n**原文把学生涌入法学院接在哪个原因后面，是客户需求还是律师收入？**\n\n不能，句子没有写客户需求增长，A换掉了因果起点。\n\n**第一轮判断：A排除。**","html":"<h3>A. the growing demand from clients</h3>\n<blockquote>\n<p>客户不断增长的需求</p>\n</blockquote>\n<p>把A接回题干，它说的是：学生选择法律是因为客户需求增长。</p> ney”都在回答inflation在段落里承担什么作用，因为inflation和money都在学生涌入前出现，需要分清哪一个是直接原因，所以回看第2段这句话。\n\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as **[xxx]**. The best lawyers made **[xxx]** of money, **[xxx]** ever more students to pile into law schools.\n\n“pressure of inflation”把inflation当成学生动机，而原文只是用它比较法律服务支出的增速；真正紧接学生的是“money”。 因此“pressure of inflation”与“money”在这里仍有具体差别。\n\n**inflation只是增长基准，能直接解释学生为什么学法律吗？**\n\n不能，B把背景比较项误写成了行为原因。\n\n**第一轮判断：B排除。**","html":"<h3>B. the increasing pressure of inflation</h3>\n<blockquote>\n<p>通货膨胀压力增加</p>\n</blockquote>\n<p>把B接回题干，它说的是：学生选择法律是因为通胀压力加大。</p>\n<p>B里的“pressure of inflation”和原文“money”都在回答inflation在段落里承担什么作用，因为inflation和money都在学生涌入前出现，需要分清哪一个是直接原因，所以回看第2段这句话。</p>\n<blockquote>\n<p>During the decade before the economic crisis, spending on legal services in America grew twice as fast as <span class=\"mask\">[xxx]</span>. The best lawyers made <span class=\"mask\">[xxx]</span> of money, <span class=\"mask\">[xxx]</span> ever more students to pile into law schools.</p>\n</blockquote>\n<p>“pressure of inflation”把inflation当成学生动机，而原文只是用它比较法律服务支出的增速；真正紧接学生的是“money”。 因此“pressure of inflation”与“money”在这里仍有具体差别。</p>\n<p><strong>inflation只是增长基准，能直接解释学生为什么学法律吗？</strong></p>\n<p>不能，B把背景比较项误写成了行为原因。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[301,490,1253,48],[222,547,1331,47],[222,603,1332,47],[222,660,1334,47],[222,716,1114,47]],"questionRects":[[248,208,1111,48],[308,274,599,47],[310,340,619,47],[309,405,649,48],[309,471,607,39]],"scrollTarget":null,"meta":{"kind":"option","qid":"26","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“pressure of inflation”和原文“money”都在回答inflation在段落里承担什么作用，因为inflation和money都在学生涌入前出现，需要分清哪一个是直接 ld help both lawyers and their customers. / Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too **[xxx]** to **[xxx]** them. / One idea is to allow people to study law as an undergraduate degree. / Another is to let students sit for the bar after only two years of law school. / If the bar exam is truly a **[xxx]** enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. / Students who do not need the extra training could cut their debt mountain by a third.\n>\n> 顺着英文顺序读：\n>\n> 改革这一体系会同时帮助律师和客户。 / 合理的想法早已存在，但管理该职业的州级机构过于[xxx]，不愿[xxx]这些想法。 / 一种办法是允许人们在本科阶段学习法律。 / 另一种办法是让学生只读两年法学院就参加律师资格考试。 / 如果律师资格考试确实足够[xxx]，能够检验准律师，那么能提前参加的人就应当被允许这样做。 / 不需要额外训练的学生可以把债务大山削减三分之一。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>28题</h2>\n<blockquote>\n<p>Hindrance to the reform of the legal system originates from ______.<br />\n法律体系改革的阻力来自哪里？</p>\n</blockquote>\n<p>粗读时我大概记得第4段留下过“改革”这个碎片，题干也出现“改革”，所以回到第4段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a <span class=\"mask\">[xxx]</span> enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.</p>\n<p>开始精读：</p>\n<p>Reforming the system would help both lawyers and their customers. / Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> them. / One idea is to allow people to study law as an undergraduate degree. / Another is to let students sit for the bar after only two years of law school. / If the bar exam is truly a <span class=\"mask\">[xxx]</span> enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. / Students who do not need the extra training could cut their debt mountain by a third.</p>\n<p>顺着英文顺序读：</p>\n<p>改革这一体系会同时帮助律师和客户。 / 合理的想法早已存在，但管理该职业的州级机构过于[xxx]，不愿[xxx]这些想法。 / 一种办法是允许人们在本科阶段学习法律。 / 另一种办法是让学生只读两年法学院就参加律师资格考试。 / 如果律师资格考试确实足够[xxx]，能够检验准律师，那么能提前参加的人就应当被允许这样做。 / 不需要额外训练的学生可以把债务大山削减三分之一。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[303,1167,1251,47],[222,1223,1332,48],[221,1280,1333,47],[221,1336,1334,47],[222,1392,1332,47],[222,1449,1332,47]],"questionRects":[[309,1195,674,47],[309,1260,723,47],[309,1326,656,47],[248,1456,1335,49]],"scrollTarget":null,"meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. non-professionals’ sharp criticism\n\n> 非专业人士的尖锐批评\n\n把A接回题干，它说的是：改革阻力来自非专业人士的尖锐批评。\n\nA里的“sharp criticism”和原文“state-level bodies”都在回答是谁没有实施已有的合理方案，因为选项和原文都在寻找改革受阻的来源，所以回看第4段这句话。\n\n> Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too **[xxx]** to **[xxx]** them.\n\n“non-professionals’ criticism”指行业外人士发声，而“state-level bodies”明确是管理职业的州级机构没有实施方案。 因此“sharp criticism”与“state-level bodies”在这里仍有具体差别。\n\n**原文把阻力放在行业外批评者身上了吗？**\n\n不能，A更换了主体，段落说的是职业监管机构。\n\n**第一轮判断：A排除。**","html":"<h3>A. non-professionals’ sharp criticism</h3>\n<blockquote>\n<p>非专业人士的尖锐批评</p>\n</blockquote>\n<p>把A接回题干，它说的是：改革阻力来自非专业人士的尖锐批评。</p>\n<p>A里的“sharp criticism”和原文“state-level bodies”都在回答是谁没有实施已有的合理方案，因为选项和原文都在寻找改革受阻的来源，所以回看第4段这句话。</p>\n<blockquote>\n<p>Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> them.</p>\n</blockquote>\n<p>“non-professionals’ criticism”指行业外人士发声，而“state-level bodies”明确是管理职业的州级机构没有实施方案。 因此“sharp criticism”与“state-level bodies”在这里仍有具体差别。</p>\n<p><strong>原文把阻力放在行业外批评者身上了吗？</strong></p>\n<p>不能，A更换了主体，段落说的是职业监管机构。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[303,1167,1251,47],[222,1223,1332,48],[221,1280,1333,47],[221,1336,1334,47],[222,1392,1332,47],[222,1449,1332,47]],"questionRects":[[309,1195,674,47],[309,1260,723,47],[309,1326,656,47],[248,1456,1335,49]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“sharp criticism”和原文“state-level bodies”都在回答是谁没有实施已有的合理方案，因为选项和原文都在寻找改革受阻的来源，所以回看第4段这句话。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"state-level bodies","visibleOptionAnchor":"sharp criticism"}}}},{"section":"28题","raw":"### B. lawyers’ and clients’ strong resistance\n\n> 律师和客户的强烈抵制\n\n把B接回题干，它说的是：改革阻力来自律师和客户强烈反对。\n\nB里的“strong resistance”和原文“help both lawyers and their customers”都在回答律师和客户是改革受益者还是反对者，因为选项和原文都提到律师、客户与改革的关系，所以回看第4段这句话。\n\n> Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too **[xxx]** to **[xxx]** them.\n\n“lawyers’ and clients’ resistance”把两者写成阻力，而“help both lawyers and their customers”把两者写成受益者；真正没实施的是州级机构。 因此“strong resistance”与“help both lawyers and their customers”在这里仍有具体差别。\n\n**既然改革会帮助律师和客户，能说阻力来自他们的强烈抵制吗？**\n\n不能，B把受益者改成了反对者。\n\n**第一轮判断：B排除。**","html":"<h3>B. lawyers’ and clients’ strong resistance</h3>\n<blockquote>\n<p>律师和客户的强烈抵制</p>\n</blockquote>\n<p>把B接回题干，它说的是：改革阻力来自律师和客户强烈反对。</p>\n<p>B里的“strong resistance”和原文“help both lawyers and their customers”都在回答律师和客户是改革受益者还是反对者，因为选项和原文都提到律师、客户与改革的关系，所以回看第4段这句话。</p>\n<blockquote>\n<p>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> them.</p>\n</blockquote>\n<p>“lawyers’ and clients’ resistance”把两者写成阻力，而“help both lawyers and their customers”把两者写成受益者；真正没实施的是州级机构。 因此“strong resistance”与“help both lawyers and their customers”在这里仍有具体差别。</p>\n<p><strong>既然改革会帮助律师和客户，能说阻力来自他们的强烈抵制吗？</strong></p>\n<p>不能，B把受益者改成了反对者。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[303,1167,1251,47],[222,1223,1332,48],[221,1280,1333,47],[221,1336,1334,47],[222,1392,1332,47],[222,1449,1332,47]],"questionRects":[[309,1195,674,47],[309,1260,723,47],[309,1326,656,47],[248,1456,1335,49]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“strong resistance”和原文“help both lawyers and their customers”都在回答律师和客户是改革受益者还是反对者，因为选项和原文都提到律师、客户与改革的关系，所以回看第4段这句话。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","subject"],"deci 是利用严格考试来支持改革？</strong></p>\n<p>不能，D把改革方案的检验工具误写成改革阻力。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[303,1167,1251,47],[222,1223,1332,48],[221,1280,1333,47],[221,1336,1334,47],[222,1392,1332,47],[222,1449,1332,47]],"questionRects":[[309,1195,674,47],[309,1260,723,47],[309,1326,656,47],[248,1456,1335,49]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“stern exam”和原文“allowed to do so”都在回答资格考试在作者方案中是阻力还是工具，因为stern exam与原句相同，但要看它承担的逻辑作用，所以回看第4段这句话。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"allowed to do so","visibleOptionAnchor":"stern exam"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **28题选C。**","html":"<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>28题选C。</strong></p>\n</blockquote>\n","articleRects":[[303,1167,1251,47],[222,1223,1332,48],[221,1280,1333,47],[221,1336,1334,47],[222,1392,1332,47],[222,1449,1332,47]],"questionRects":[[309,1195,674,47],[309,1260,723,47],[309,1326,656,47],[248,1456,1335,49]],"scrollTarget":null,"meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> The guild-like ownership structure is considered “restrictive” partly because it ______.  \n> 行会式所有权结构之所以被认为“限制性强”，部分原因是它______。\n\n题干已经给出guild-like ownership structure这个人物或对象，第5段也出现guild-like ownership structure，所以把第5段从头到尾读完。\n\n> 原文参考：\n>\n> The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm **[xxx]** lawyers from the pressure to make money rather than serve clients **[xxx]**.\n>\n> 开始精读：\n>\n> The other reason why costs are so high is the restrictive guild-like ownership structure of the business. / Except in the District of Columbia, non-lawyers may not own any share of a law firm. / This keeps fees high and innovation slow. / There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm **[xxx]** lawyers from the pressure to make money rather than serve clients **[xxx]**.\n>\n> 顺着英文顺序读：\n>\n> 成本如此高的另一个原因，是行业中限制性的行会式所有权结构。 / 除哥伦比亚特区外，非律师不得持有律所任何股份。 / 这使收费居高，也让创新缓慢。 / 行业内部存在改革压力，但监管者中的反对者坚持认为，把外部人士挡在律所之外，能使律师免受赚钱压力的[xxx]，从而不是为了赚钱而是[xxx]服务客户。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>29题</h2>\n<blockquote>\n<p>The guild-like ownership structure is considered “restrictive” partly because it <strong><strong><strong>.<br />\n行会式所有权结构之所以被认为“限制性强”，部分原因是它</strong></strong></strong>。</p>\n</blockquote>\n<p>题干已经给出guild-like ownership structure这个人物或对象，第5段也出现guild-like ownership structure，所以把第5段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm <span class=\"mask\">[xxx]</span> lawyers from the pressure to make money rather than serve clients <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. / Except in the District of Columbia, non-lawyers may not own any share of a law firm. / This keeps fees high and innovation slow. / There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm <span class=\"mask\">[xxx]</span> lawyers from the pressure to make money rather than serve clients <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>成本如此高的另一个原因，是行业中限制性的行会式所有权结构。 / 除哥伦比亚特区外，非律师不得持有律所任何股份。 / 这使收费居高，也让创新缓慢。 / 行业内部存在改革压力，但监管者中的反对者坚持认为，把外部人士挡在律所之外，能使律师免受赚钱压力的[xxx]，从而不是为了赚钱而是[xxx]服务客户。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[223,1505,1331,47],[222,1561,124,39],[301,1618,1253,47],[223,1674,1331,47],[222,1730,1321,48],[222,1787,1332,47],[223,1843,1330,47],[222,1899,1249,47]],"questionRects":[[309,1589,737,47],[309,1655,771,47],[309,1721,757,47],[309,1786,794,47],[249,1918,864,47],[308,1984,973,47],[309,2049,1002,40]],"scrollTarget":null,"meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. prevents lawyers from gaining due profits\n\n> 阻止律师获得应有利润\n\n把A接回题干，它说的是：这种结构限制律师获得合理利润。\n\nA里的“gaining due profits”和原文“keeps fees high”都在回答限制结构对收费和利润的实际影响是什么，因为profits与fees都涉及金钱，但方向需要核对，所以回看第5段这句话。\n\n> This keeps fees high and innovation slow.\n\n“prevents lawyers from gaining profits”说律师赚不到钱，而“keeps fees high”说明收费被维持在高位，并没有压低律师收益。 因此“gaining due profits”与“keeps fees high”在这里仍有具体差别。\n\n**收费居高能证明律师被阻止获得利润吗？**\n\n不能，A把高收费的结果反向写成利润受阻。\n\n**第一轮判断：A排除。**","html":"<h3>A. prevents lawyers from gaining due profits</h3>\n<blockquote>\n<p>阻止律师获得应有利润</p>\n</blockquote>\n<p>把A接回题干，它说的是：这种结构限制律师获得合理利润。</p>\n<p>A里的“gaining due profits”和原文“keeps fees high”都在回答限制结构对收费和利润的实际影响是什么，因为profits与fees都涉及金钱，但方向需要核对，所以回看第5段这句话。</p>\n<blockquote>\n<p>This keeps fees high and innovation slow.</p>\n</blockquote>\n<p>“prevents lawyers from gaining profits”说律师赚不到钱，而“keeps fees high”说明收费被维持在高位，并没有压低律师收益。 因此“gaining due profits”与“keeps fees high”在这里仍有具体差别。</p>\n<p><strong>收费居高能证明律师被阻止获得利润吗？</strong></p>\n<p>不能，A把高收费的结果反向写成利润受阻。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[223,1505,1331,47],[222,1561,124,39],[301,1618,1253,47],[223,1674,1331,47],[222,1730,1321,48],[222,1787,1332,47],[223,1843,1330,47],[222,1899,1249,47]],"questionRects":[[309,1589,737,47],[309,1655,771,47],[309,1721,757,47],[309,1786,794,47],[249,1918,864,47],[308,1984,973,47],[309,2049,1002,40]],"scrollTarget":null,"meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“gaining due profits”和原文“keeps fees high”都在回答限制结构对收费和利润的实际影响是什么，因为profits与fees都涉及金钱，但方向需要核对，所以回看第5段这句话。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"keeps fees high","visibleOptionAnchor":"gaining due profits"}}}},{"section":"29题","raw":"### B. keeps lawyers from holding law-firm shares\n\n> 禁止律师持有律所股份\n\n把B接回题干，它说的是：这种结构不让律师持有律所股份。\n\nB里的“holding law-firm shares”和原文“non-lawyers may not own”都在回答被禁止持股的是律师还是非律师，因为选项和原文都在说律所股份的持有资格，所以回看第5段这句话。\n\n> Except in the District of Columbia, non-lawyers may not own any share of a law firm.\n\n“lawyers from holding shares”把受限者写成律师，而“non-lawyers may not own”明确受限的是非律师。 因此“holding law-firm shares”与“non-lawyers may not own”在这里仍有具体差别。\n\n**原文能把non-lawyers换成lawyers吗？**\n\n不能，B改换了限制对象。\n\n**第一轮判断：B排除。**","html":"<h3>B. keeps lawyers from holding law-firm shares</h3>\n<blockquote>\n<p>禁止律师持有律所股份</p>\n</blockquote>\n<p>把B接回题干，它说的是：这种结构不让律师持有律所股份。</p>\n<p>B里的“holding law-firm shares”和原文“non-lawyers may not own”都在回答被禁止持股的是律师还是非律师，因为选项和原文都在说律所股份的持有资格，所以回看第5段这句话。</p>\n<blockquote>\n<p>Except in the District of Columbia, non-lawyers may not own any share of a law firm.</p>\n</blockquote>\n<p>“lawyers from holding shares”把受限者写成律师，而“non-lawyers may not own”明确受限的是非律师。 因此“holding law-firm shares”与“non-lawyers may not own”在这里仍有具体差别。</p>\n<p><strong>原文能把non-lawyers换成lawyers吗？</strong></p>\n<p>不能，B改换了限制对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[223,1505,1331,47],[222,1561,124,39],[301,1618,1253,47],[223,1674,1331,47],[222,1730,1321,48],[222,1787,1332,47],[223,1843,1330,47],[222,1899,1249,47]],"questionRects":[[309,1589,737,47],[309,1655,771,47],[309,1721,757,47],[309,1786,794,47],[249,1918,864,47],[308,1984,973,47],[309,2049,1002,40]],"scrollTarget":null,"meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“holding law-firm shares”和原文“non-lawyers may not own”都在回答被禁止持股的是律师还是非律师，因为选项和原文都在说律所股份的持有资格，所以回看第5段这句话。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanC </li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>29题选D。</strong></p>\n</blockquote>\n","articleRects":[[223,1505,1331,47],[222,1561,124,39],[301,1618,1253,47],[223,1674,1331,47],[222,1730,1321,48],[222,1787,1332,47],[223,1843,1330,47],[222,1899,1249,47]],"questionRects":[[309,1589,737,47],[309,1655,771,47],[309,1721,757,47],[309,1786,794,47],[249,1918,864,47],[308,1984,973,47],[309,2049,1002,40]],"scrollTarget":null,"meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**In this text, the author mainly discusses ______.**\n\n本文主要讨论什么？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **flawed ownership of America’s law firms and its causes**\n\n美国律所所有权的缺陷及其原因\n\nB. **the factors that help make a successful lawyer in America**\n\n在美国成为成功律师的因素\n\nC. **a problem in America’s legal profession and solutions to it**\n\n美国法律职业中的一个问题及其解决办法\n\nD. **the role of undergraduate studies in America’s legal education**\n\n本科教育在美国法律教育中的作用","html":"<h2>30题</h2>\n<p><strong>In this text, the author mainly discusses ______.</strong></p>\n<p>本文主要讨论什么？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>flawed ownership of America’s law firms and its causes</strong></p>\n<p>美国律所所有权的缺陷及其原因</p>\n<p>B. <strong>the factors that help make a successful lawyer in America</strong></p>\n<p>在美国成为成功律师的因素</p>\n<p>C. <strong>a problem in America’s legal profession and solutions to it</strong></p>\n<p>美国法律职业中的一个问题及其解决办法</p>\n<p>D. <strong>the role of undergraduate studies in America’s legal education</strong></p>\n<p>本科教育在美国法律教育中的作用</p>\n","articleRects":[[301,322,1255,47],[222,378,1332,47],[222,434,1197,47],[301,490,1253,48],[222,547,1331,47],[222,603,1332,47],[222,660,1334,47],[222,716,1114,47],[301,772,1252,48],[222,829,1333,47],[221,885,1334,47],[222,941,1333,47],[221,998,1333,47],[222,1052,1331,49],[222,1110,657,48],[303,1167,1251,47],[222,1223,1332,48],[221,1280,1333,47],[221,1336,1334,47],[222,1392,1332,47],[222,1449,1332,47],[223,1505,1331,47],[222,1561,124,39],[301,1618,1253,47],[223,1674,1331,47],[222,1730,1321,48],[222,1787,1332,47],[223,1843,1330,47],[222,1899,1249,47],[302,1956,1251,47],[222,2012,1332,47],[222,2068,1321,48],[222,2125,1332,47],[222,2181,774,48]],"questionRects":[[309,2115,1017,47],[309,2181,1070,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 指出律师普遍招人反感，而美国客户尤其有理由抱怨 | 先说一个广泛存在的麻烦 |\n| 2 | 写法律服务支出猛增、顶尖律师高收入、学生涌入以及多数毕业生就业不佳 | 再写这个麻烦怎样变得更重 |\n| 3 | 解释单一路径造成高昂教育成本和巨额债务 | 接着拆开第一层成因 |\n| 4 | 建议本科直接学法、两年后参加资格考试，从而削减债务 | 然后提出对应的改法 |\n| 5 | 说明行会式所有权排除非律师，维持高收费并拖慢创新 | 再补一个背景：还有另一层成因 |\n| 6 | 主张允许非律师持股、使用技术和专业经理，并让美国跟进其他国家 | 最后说另一种改法 |\n\n先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>指出律师普遍招人反感，而美国客户尤其有理由抱怨</td>\n<td>先说一个广泛存在的麻烦</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写法律服务支出猛增、顶尖律师高收入、学生涌入以及多数毕业生就业不佳</td>\n<td>再写这个麻烦怎样变得更重</td>\n</tr>\n<tr>\n<td>3</td>\n<td>解释单一路径造成高昂教育成本和巨额债务</td>\n<td>接着拆开第一层成因</td>\n</tr>\n<tr>\n<td>4</td>\n<td>建议本科直接学法、两年后参加资格考试，从而削减债务</td>\n<td>然后提出对应的改法</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明行会式所有权排除非律师，维持高收费并拖慢创新</td>\n<td>再补一个背景：还有另一层成因</td 那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查26题：C还是D？\n\n第一遍留下：\n\n- C. the prospect of working in big firms\n- D. the attraction of financial rewards\n\n主旨底牌是：\n\n> **a problem in America’s legal profession and solutions to it / 美国法律职业中的一个问题及其解决办法**\n\n也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。\n\n第一遍读第二段时，C和D都能找到原文词。C有big-firm job，D有money和tempting ever more students。问题在于，决定C方向的never被遮住，而D里的financial也被遮住；只看剩余内容，一个像是大所前景，一个像是回报吸引，都可能解释学生为什么涌入法学院，因此第一遍保留两项。\n\n我们先把题干和两个选项接起来。\n\n题干问学生选择法律职业的原因。C说他们被进入大律所的前景吸引，D说他们被经济回报吸引。C把原因放在一种未来职位上，D把原因放在律师收入上。局部原文的顺序是：顶尖律师赚大钱——吸引更多学生——多数毕业生是否获得大所工作。也就是说，两项分别抓住因果链前端和后端。\n\n现在拿主旨来检查。\n\n先看C。主旨是“美国法律职业存在一个问题，并需要解决办法”。全文随后要解释学生过量进入、教育债务和高成本，因此第二段中的big-firm job承担的是揭示问题的作用：学生涌入后，多数人并没有得到想象中的大所职位。若C是入行原因，文章应把大所机会写成真实而普遍的吸引物；但全文用它制造“期待与结果不符”的落差，正好服务于问题诊断。\n\n再看D。D落在因果链前端。顶尖律师“made ... money”之后紧接“tempting ever more students to pile into law schools”，收入就是吸引学生的明示原因。这也与主旨推进一致：高额回报吸引过多学生，而单一路径和巨额债务又迫使毕业生拼命工作，最终加重法律服务成本。D不仅解释一句话，还能接上后文为什么要改革教育路径。\n\n第一遍C之所以留下，是因为big-firm job确实出现且关键否定被遮住；主旨确定后，它只能作为“很多毕业生得不到理想职位”的问题表现，而不是学生涌入的起因。D同时通过局部因果和全文问题链。\n\n> **26题选D。**","html":"<h2>回查26题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. the prospect of working in big firms</li>\n<li>D. the attraction of financial rewards</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>a problem in America’s legal profession and solutions to it / 美国法律职业中的一个问题及其解决办法</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍读第二段时，C和D都能找到原文词。C有big-firm job，D有money和tempting ever more students。问题在于，决定C方向的never被遮住，而D里的financial也被遮住；只看剩余内容，一个像是大所前景，一个像是回报吸引，都可能解释学生为什么涌入法学院，因此第一遍保留两项。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问学生选择法律职业的原因。C说他们被进入大律所的前景吸引，D说他们被经济回报吸引。C把原因放在一种未来职位上，D把原因放在律师收入上。局部原文的顺序是：顶尖律师赚大钱——吸引更多学生——多数毕业生是否获得大所工作。也就是说，两项分别抓住因果链前端和后端。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看C。主旨是“美国法律职业存在一个问题，并需要解决办法”。全文随后要解释学生过量进入、教育债务和高成本，因此第二段中的big-firm job承担的是揭示问题的作用：学生涌入后，多数人并没有得到想象中的大所职位。若C是入行原因，文章应把大所机会写成真实而普遍的吸引物；但全文用它制造“期待与结果不符”的落差，正好服务于问题诊断。</p>\n<p>再看D。D落在因果链前端。顶尖律师“made ... money”之后紧接“tempting ever more students to pile into law schools”，收入就是吸引学生的明示原因。这也与主旨推进一致：高额回报吸引过多学生，而单一路径和巨额债务又迫使毕业生拼命工作，最终加重法律服务成本。D不仅解释一句话，还能接上后文为什么要改革教育路径。</p>\n<p>第一遍C之所以留下，是因为big-firm job确实出现且关键否定被遮住；主旨确定后，它只能作为“很多毕业生得不到理想职位”的问题表现，而不是学生涌入的起因。D同时通过局部因果和全文问题链。</p>\n<blockquote>\n<p><strong>26题选D。</strong></p>\n</blockquote>\n","articleRects":[[301,490,1253,48],[222,547,1331,47],[222,603,1332,47],[222,660,1334,47],[222,716,1114,47]],"questionRects":[[248,208,1111,48],[308,274,599,47],[310,340,619,47],[309,405,649,48],[309,471,607,39],[309,2115,1017,47],[309,2181,1070,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"review","qid":"26"}},{"section":"最终答案","raw":"# 5. 最终答案\n\n- **26题：D** — the attraction of [xxx] rewards（金钱回报的吸引力）\n- **27题：B** — Pursuing a bachelor’s degree in [xxx] major.（先攻读另一个专业的学士学位）\n- **28题：C** — the [xxx] bodies governing the profession（管理该职业的僵化机构）\n- **29题：D** — bans [xxx] involvement in the profession（禁止行业外人士参与法律职业）\n- **30题：C** — a problem in America’s legal profession and solutions to it（美国法律职业中的一个问题及其解决办法）\n\n本篇答案：**DBCDC**。","html":"<h1>5. 最终答案</h1>\n<ul>\n<li><strong>26题：D</strong> — the attraction of [xxx] rewards（金钱回报的吸引力）</li>\n<li><strong>27题：B</strong> — Pursuing a bachelor’s degree in [xxx] major.（先攻读另一个专业的学士学位）</li>\n<li><strong>28题：C</strong> — the [xxx] bodies governing t
