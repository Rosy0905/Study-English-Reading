<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 36题题干\n\n**According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?**\n\n> 根据第一段，作者对AAAS报告持什么态度？\n\n题型：**作者态度题**。\n\n---","html":"<h2>36题题干</h2>\n<p><strong>According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?</strong></p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持什么态度？</p>\n</blockquote>\n<p>题型：<strong>作者态度题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**Influential figures in the Congress required that the AAAS report on how to ______.**\n\n> 国会中的重要人物要求AAAS报告如何______。\n\n题型：**具体细节题**。\n\n---","html":"<h2>37题题干</h2>\n<p><strong>Influential figures in the Congress required that the AAAS report on how to ______.</strong></p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何______。</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[249,669,1332,47],[308,739,191,44],[309,800,728,47],[309,866,734,47],[309,932,751,47],[308,997,764,48]],"scrollTarget":null,"meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**According to Paragraph 3, the report suggests ______.**\n\n> 根据第三段，这份报告建议什么？\n\n题型：**段落细节题**。\n\n---","html":"<h2>38题题干</h2>\n<p><strong>According to Paragraph 3, the report suggests ______.</strong></p>\n<blockquote>\n<p>根据第三段，这份报告建议什么？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[249,1129,960,49],[309,1195,696,47],[309,1260,732,47],[309,1326,716,47],[309,1392,746,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**The author implies in Paragraph 5 that professors are ______.**\n\n> 作者在第五段暗示，教授们______。\n\n题型：**推断题**。\n\n---","html":"<h2>39题题干</h2>\n<p><strong>The author implies in Paragraph 5 that professors are ______.</strong></p>\n<blockquote>\n<p>作者在第五段暗示，教授们______。</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[249,1523,1074,49],[308,1589,487,47],[309,1655,640,47],[309,1721,697,47],[309,1786,584,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**Which of the following would be the best title for the text?**\n\n> 以下哪一项最适合作为本文标题？\n\n题型：**全文作者观点 / 全文主旨题**。\n\n---","html":"<h2>40题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>以下哪一项最适合作为本文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点 / 全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[248,1918,1040,47],[309,1982,875,41],[309,2050,827,39],[309,2114,745,48],[309,2181,726,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | however, Because, Yet |\n| 态度词 / 评价词 | 先抓个大概好坏 | deserves praise, admirable, harm |\n| 动作词 | 先看谁做了什么 | identify, supports, ignores |\n| 结果词 | 看最后出了什么事 | benefits, propaganda, set back reform |\n| 重复主题词 | 大概知道老在说什么 | report, liberal education, humanities, AAAS |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>however, Because, Yet</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>deserves praise, admirable, harm</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>identify, supports, ignores</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>benefits, propaganda, set back reform</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>report, liberal education, humanities, AAAS</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"“The Heart of the Matter,” the **[xxx]** report by the American Academy of Arts and Sciences (AAAS), deserves praise for **[xxx]** the importance of the humanities and social sciences to the **[xxx]** and security of liberal democracy in America. Regrettably, however, the report’s **[xxx]** to address the true nature of the **[xxx]** facing liberal education may cause more harm than good.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n</div></div>","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[30 段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住AAAS报告、国会任务、报告目标、大学里的问题和结尾的改革风险；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做36至39题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导 deserves praise for **[xxx]** the importance of the humanities and social sciences to the **[xxx]** and security of liberal democracy in America. / Regrettably, however, the report’s **[xxx]** to address the true nature of the **[xxx]** facing liberal education may cause more harm than good.\n>\n> 顺着英文顺序读：\n>\n> 美国艺术与科学学会发布的[xxx]报告《问题的核心》，因为[xxx]人文与社会科学对美国自由民主的[xxx]与安全非常重要而值得赞扬。 / 然而令人遗憾的是，这份报告没有处理博雅教育所面临[xxx]的真实性质，这种[xxx]可能弊大于利。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>36题</h2>\n<blockquote>\n<p>According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?<br />\n根据第一段，作者对AAAS报告持什么态度？</p>\n</blockquote>\n<p>题干已经明确写出Paragraph 1，所以直接回到第1段，把这一自然段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n<p>开始精读：</p>\n<p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. / Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n<p>顺着英文顺序读：</p>\n<p>美国艺术与科学学会发布的[xxx]报告《问题的核心》，因为[xxx]人文与社会科学对美国自由民主的[xxx]与安全非常重要而值得赞扬。 / 然而令人遗憾的是，这份报告没有处理博雅教育所面临[xxx]的真实性质，这种[xxx]可能弊大于利。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"question","qid":"36"}},{"section":"36题","raw":"### A. Critical.\n\n> 批评的\n\n把A接回题干，它说的是：作者对AAAS报告持批评态度。\n\nA里的“Critical”和原文“more harm than good”都在回答作者最终怎样评价报告的影响，因为Critical与more harm than good都指向负面评价，所以回看第1段这句话。\n\n> Regrettably, however, the report’s **[xxx]** to address the true nature of the **[xxx]** facing liberal education may cause more harm than good.\n\n“Critical”能覆盖“more harm than good”和报告未处理真实问题；但本段开头又有deserves praise，所以第一遍需要判断哪一面更代表总体态度。 因此“Critical”与“more harm than good”在这里能接上。\n\n**一段中既有赞扬又有弊大于利，Critical能否代表作者的主导判断？**\n\n还不能立即唯一确定，负面结论很强，但开头的明确赞扬也让Appreciative暂时有依据。\n\n**第一轮判断：A保留。**","html":"<h3>A. Critical.</h3>\n<blockquote>\n<p>批评的</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对AAAS报告持批评态度。</p>\n<p>A里的“Critical”和原文“more harm than good”都在回答作者最终怎样评价报告的影响，因为Critical与more harm than good都指向负面评价，所以回看第1段这句话。</p>\n<blockquote>\n<p>Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n</blockquote>\n<p>“Critical”能覆盖“more harm than good”和报告未处理真实问题；但本段开头又有deserves praise，所以第一遍需要判断哪一面更代表总体态度。 因此“Critical”与“more harm than good”在这里能接上。</p>\n<p><strong>一段中既有赞扬又有弊大于利，Critical能否代表作者的主导判断？</strong></p>\n<p>还不能立即唯一确定，负面结论很强，但开头的明确赞扬也让Appreciative暂时有依据。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"option","qid":"36","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“Critical”和原文“more harm than good”都在回答作者最终怎样评价报告的影响，因为Critical与more harm than good都指向负面评价，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"more harm than good","visibleOptionAnchor":"Critical"}}}},{"section":"36题","raw":"### B. Appreciative.\n\n> 赞赏的\n\n把B接回题干，它说的是：作者对AAAS报告持赞赏态度。\n\nB里的“Appreciative”和原文“deserves praise”都在回答作者是否明确肯定报告的一部分，因为Appreciative与deserves praise在字面上直接对应，所以回看第1段这句话。\n\n> deserves praise for **[xxx]** the importance of the humanities and social sciences\n\n“Appreciative”与“deserves praise”完全接得上；但后一句转入Regrettably和more harm than good，赞赏可能只是让步。 因此“Appreciative”与“deserves praise”在这里能接上。\n\n**只看deserves praise，能否把作者整体态度定成Appreciative？**\n\n还不能，B抓住了真实的正面评价，但尚需用全文判断这是不是作者最终重心。\n\n**第一轮判断：B保留。**","html":"<h3>B. Appreciative.</h3>\n<blockquote>\n<p>赞赏的</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对AAAS报告持赞赏态度。</p>\n<p>B里的“Appreciative”和原文“deserves praise”都在回答作者是否明确肯定报告的一部分，因为Appreciative与deserves praise在字面上直接对应，所以回看第1段这句话。</p>\n<blockquote>\n<p>deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences</p>\n</blockquote>\n<p>“Appreciative”与“deserves praise”完全接得上；但后一句转入Regrettably和more harm than good，赞赏可能只是让步。 因此“Appreciative”与“deserves praise”在这里能接上。</p>\n<p><strong>只看deserves praise，能否把作者整体态度定成Appreciative？</strong></p>\n<p>还不能，B抓住了真实的正面评价，但尚需用全文判断这是不是作者最终重心。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"option","qid":"36","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“Appreciative”和原文“deserves praise”都在回答作者是否明确肯定报告的一部分，因为Appreciative与deserves praise在字面上直接对应，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"deserves praise","visibleOptionAnchor":"Appreciative"}}}},{"section":"36题","raw":"### C. Contemptuous.\n\n> 轻蔑的\n\n把C接回题干，它说的是：作者对AAAS报告持轻蔑态度。\n\nC里的“Contemptuous”和原文“deserves praise”都在回答批评是否达到轻蔑和不屑的程度，因为态度词必须与开头明确的肯定同时兼容，所以回看第1段这句话。\n\n> deserves praise for **[xxx]** the importance of the humanities and social sciences\n\n“Contemptuous”意味着彻底蔑视，而“deserves praise”明确承认报告有值得肯定的部分，程度不相容。 因此“Contemptuous”与“deserves praise”在这里仍有具体差别。\n\n**一个被作者说deserves praise的报告，能同时被整体轻蔑吗？**\n\n不能，C把有保留的批评夸大成全盘鄙视。\n\n**第一轮判断：C排除。**","html":"<h3>C. Contemptuous.</h3>\n<blockquote>\n<p>轻蔑的</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者对AAAS报告持轻蔑态度。</p>\n<p>C里的“Contemptuous”和原文“deserves praise”都在回答批评是否达到轻蔑和不屑的程度，因为态度词必须与开头明确的肯定同时兼容，所以回看第1段这句话。</p>\n<blockquote>\n<p>deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences</p>\n</blockquote>\n<p>“Contemptuous”意味着彻底蔑视，而“deserves praise”明确承认报告有值得肯定的部分，程度不相容。 因此“Contemptuous”与“deserves praise”在这里仍有具体差别。</p>\n<p><strong>一个被作者说deserves praise的报告，能同时被整体轻蔑吗？</strong></p>\n<p>不能，C把有保留的批评夸大成全盘鄙视。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"option","qid":"36","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“Contemptuous”和原文“deserves praise”都在回答批评是否达到轻蔑和不屑的程度，因为态度词必须与开头明确的肯定同时兼容，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"deserves praise","visibleOptionAnchor":"Contemptuous"}}}},{"section":"36题","raw":"### D. Tolerant.\n\n> 宽容的\n\n把D接回题干，它说的是：作者对AAAS报告持宽容态度。\n\nD里的“Tolerant”和原文“more harm than good”都在回答作者是在容忍缺点还是警告其危害，因为Tolerant与more harm than good对缺陷的处理强度不同，所以回看第1段这句话。\n\n> the report’s **[xxx]** to address the true nature of the **[xxx]** facing liberal education may cause more harm than good.\n\n“Tolerant”意味着接受或包容不足，而“more harm than good”是在警告报告可能造成严重反效果。 因此“Tolerant”与“more harm than good”在这里仍有具体差别。\n\n**明确说弊大于利，还是一种宽容态度吗？**\n\n不能，D弱化了作者的负面判断。\n\n**第一轮判断：D排除。**","html":"<h3>D. Tolerant.</h3>\n<blockquote>\n<p>宽容的</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对AAAS报告持宽容态度。</p>\n<p>D里的“Tolerant”和原文“more harm than good”都在回答作者是在容忍缺点还是警告其危害，因为Tolerant与more harm than good对缺陷的处理强度不同，所以回看第1段这句话。</p>\n<blockquote>\n<p>the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n</blockquote>\n<p>“Tolerant”意味着接受或包容不足，而“more harm than good”是在警告报告可能造成严重反效果。 因此“Tolerant”与“more harm than good”在这里仍有具体差别。</p>\n<p><strong>明确说弊大于利，还是一种宽容态度吗？</strong></p>\n<p>不能，D弱化了作者的负面判断。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"option","qid":"36","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“Tolerant”和原文“more harm than good”都在回答作者是在容忍缺点还是警告其危害，因为Tolerant与more harm than good对缺陷的处理强度不同，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"more harm than good","visibleOptionAnchor":"Tolerant"}}}},{"section":"36题","raw":"### 36题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n这一轮留下A和B。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。","html":"<h3>36题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下A和B。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39]],"questionRects":[[249,208,1333,48],[308,277,123,44],[309,340,189,39],[309,406,271,47],[309,472,296,47],[309,537,204,39]],"scrollTarget":null,"meta":{"kind":"result","qid":"36"}},{"section":"37题","raw":"## 37题\n\n> Influential figures in the Congress required that the AAAS report on how to ______.  \n> 国会中的重要人物要求AAAS报告如何______。\n\n题干已经给出AAAS、Congress这个人物或对象，第2段也出现AAAS、Congress，所以把第2段从头到尾读完。\n\n> 原文参考：\n>\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual **[xxx]** and others” to “maintain national excellence in humanities and social scientific scholarship and education.” In response, the American Academy formed the **[xxx]** on the Humanities and Social Sciences. Among the commission’s 51 members are **[xxx]** presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.\n>\n> 开始精读：\n>\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual **[xxx]** and others” to “maintain national excellence in humanities and social scientific scholarship and education.” / In response, the American Academy formed the **[xxx]** on the Humanities and Social Sciences. / Among the commission’s 51 members are **[xxx]** presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.\n>\n> 顺着英文顺序读：\n>\n> 2010年，国会中有影响力的民主党人与共和党人致信AAAS，要求它找出“联邦、州和地方政府，大学、基金会、教育者、个人[xxx]及其他人”可以采取的行动，以“保持人文与社会科学研究和教育的全国领先地位”。 / 作为回应，美国学术院成立了人文与社会科学[xxx]。 / 该委员会51名成员包括[xxx]校长、学者、律师、法官和企业高管，以及外交、电影、音乐和新闻领域的知名人物。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>37题</h2>\n<blockquote>\n<p>Influential figures in the Congress required that the AAAS report on how to <strong><strong><strong>.<br />\n国会中的重要人物要求AAAS报告如何</strong></strong></strong>。</p>\n</blockquote>\n<p>题干已经给出AAAS、Congress这个人物或对象，第2段也出现AAAS、Congress，所以把第2段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others” to “maintain national excellence in humanities and social scientific scholarship and education.” In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>开始精读：</p>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others” to “maintain national excellence in humanities and social scientific scholarship and education.” / In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. / Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>顺着英文顺序读：</p>\n<p>2010年，国会中有影响力的民主党人与共和党人致信AAAS，要求它找出“联邦、州和地方政府，大学、基金会、教育者、个人[xxx]及其他人”可以采取的行动，以“保持人文与社会科学研究和教育的全国领先地位”。 / 作为回应，美国学术院成立了人文与社会科学[xxx]。 / 该委员会51名成员包括[xxx]校长、学者、律师、法官和企业高管，以及外交、电影、音乐和新闻领域的知名人物。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[222,592,1332,49],[222,642,1331,47],[222,688,1331,41],[223,736,1331,49],[222,786,1327,47],[222,834,1331,47],[222,878,1332,55],[218,930,190,47],[325,978,1228,48]],"questionRects":[[249,669,1332,47],[308,739,191,44],[309,800,728,47],[309,866,734,47],[309,932,751,47],[308,997,764,48]],"scrollTarget":null,"meta":{"kind":"question","qid":"37"}},{"section":"37题","raw":"### A. safeguard individuals’ rights to education\n\n> 保障个人受教育权\n\n把A接回题干，它说的是：国会要求AAAS说明如何保障个人受教育权。\n\nA里的“rights to education”和原文“maintain national excellence”都在回答国会要求解决的是个人权利还是国家水平，因为两处都涉及education，但目标对象不同，所以回看第2段这句话。\n\n> to “maintain national excellence in humanities and social scientific scholarship and education.”\n\n“rights to education”把目标放在个人权利，“maintain national excellence”明确放在国家层面的学术与教育领先。 因此“rights to education”与“maintain national excellence”在这里仍有具体差别。\n\n**保持全国领先能直接改写成保障个人受教育权吗？**\n\n不能，A改变了目标层级和对象。\n\n**第一轮判断：A排除。**","html":"<h3>A. safeguard individuals’ rights to education</h3>\n<blockquote>\n<p>保障个人受教育权</p>\n</blockquote>\n<p>把A接回题干，它说的是：国会要求AAAS说明如何保障个人受教育权。</p>\n<p>A里的“rights to education”和原文“maintain national excellence”都在回答国会要求解决的是个人权利还是国家水平，因为两处都涉及education，但目标对象不同，所以回看第2段这句话。</p>\n<blockquote>\n<p>to “maintain national excellence in humanities and social scientific scholarship and education.”</p>\n</blockquote>\n<p>“rights to education”把目标放在个人权利，“maintain national excellence”明确放在国家层面的学术与教育领先。 因此“rights to education”与“maintain national excellence”在这里仍有具体差别。</p>\n<p><strong>保持全国领先能直接改写成保障个人受教育权吗？</strong></p>\n<p>不能，A改变了目标层级和对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[222,592,1332,49],[222,642,1331,47],[222,688,1331,41],[223,736,1331,49],[222,786,1327,47],[222,834,1331,47],[222,878,1332,55],[218,930,190,47],[325,978,1228,48]],"questionRects":[[249 ]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study / while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n<p>顺着英文顺序读：</p>\n<p>如今，教授们[xxx]把进步主义的历史解释和进步主义公共政策视为适当研究对象 / 同时把保守主义或古典自由主义思想——如自由市场和自立——[xxx]成处在常规、有时甚至正当的学术研究边界之外。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[301,1892,1253,48],[221,1941,1334,47],[222,1989,1332,47],[222,2037,1265,47]],"questionRects":[[249,1523,1074,49],[308,1589,487,47],[309,1655,640,47],[309,1721,697,47],[309,1786,584,47]],"scrollTarget":null,"meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. supportive of **[xxx]** markets\n\n> 支持自由市场\n\n把A接回题干，它说的是：教授们支持自由市场。\n\nA里的“supportive of”和原文“outside the boundaries”都在回答教授如何对待自由市场这类思想，因为markets在选项和原文中相同，态度关系可以比较，所以回看第5段这句话。\n\n> professors **[xxx]** treat the progressive interpretation of history and progressive public policy as the proper subject of study while **[xxx]** conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n\n“supportive of markets”说教授支持它，而“outside the boundaries”说明他们把自由市场归到正常甚至正当研究之外。 因此“supportive of”与“outside the boundaries”在这里仍有具体差别。\n\n**把自由市场排除在正当研究边界外，能叫支持吗？**\n\n不能，A与原文态度方向相反。\n\n**第一轮判断：A排除。**","html":"<h3>A. supportive of <span class=\"mask\">[xxx]</span> markets</h3>\n<blockquote>\n<p>支持自由市场</p>\n</blockquote>\n<p>把A接回题干，它说的是：教授们支持自由市场。</p>\n<p>A里的“supportive of”和原文“outside the boundaries”都在回答教授如何对待自由市场这类思想，因为markets在选项和原文中相同，态度关系可以比较，所以回看第5段这句话。</p>\n<blockquote>\n<p>professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study while <span class=\"mask\">[xxx]</span> conservative o  policy</h3>\n<blockquote>\n<p>在公共政策上保守</p>\n</blockquote>\n<p>把D接回题干，它说的是：教授们对公共政策持保守立场。</p>\n<p>D里的“conservative about public policy”和原文“progressive public policy”都在回答教授认可哪一种公共政策取向，因为conservative与progressive在同一政策维度上方向相反，所以回看第5段这句话。</p>\n<blockquote>\n<p>professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study.</p>\n</blockquote>\n<p>“conservative about public policy”说教授偏保守，而原文明确把“progressive public policy”视为proper subject。 因此“conservative about public policy”与“progressive public policy”在这里仍有具体差别。</p>\n<p><strong>把进步主义政策当正当研究对象，能推出教授在政策上保守吗？</strong></p>\n<p>不能，D把政治方向写反了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[301,1892,1253,48],[221,1941,1334,47],[222,1989,1332,47],[222,2037,1265,47]],"questionRects":[[249,1523,1074,49],[308,1589,487,47],[309,1655,640,47],[309,1721,697,47],[309,1786,584,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"39","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“conservative about public policy”和原文“progressive public policy”都在回答教授认可哪一种公共政策取向，因为conservative与progressive在同一政策维度上方向相反，所以回看第5段这句话。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"progressive public policy","visibleOptionAnchor":"conservative about public policy"}}}},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **39题选B。**","html":"<h3>39题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>39题选B。</strong></p>\n</blockquote>\n","articleRects":[[301,1892,1253,48],[221,1941,1334,47],[222,1989,1332,47],[222,2037,1265,47]],"questionRects":[[249,1523,1074,49],[308,1589,487,47],[309,1655,640,47],[309,1721,697,47],[309,1786,584,47]],"scrollTarget":null,"meta":{"kind":"result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n**Which of the following would be the best title for the text?**\n\n以下哪一项最适合作为本文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Illiberal Education and “The Heart of the Matter”**\n\n不自由的教育与《问题的核心》\n\nB. **The AAAS’s Contribution to Liberal Education**\n\nAAAS对博雅教育的贡献\n\nC. **Ways to Grasp “The Heart of the Matter”**\n\n把握《问题的核心》的方法\n\nD. **Progressive Policy vs. Liberal Education**\n\n进步主义政策与博雅教育的对立","html":"<h2>40题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>以下哪一项最适合作为本文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Illiberal Education and “The Heart of the Matter”</strong></p>\n<p>不自由的教育与《问题的核心》</p>\n<p>B. <strong>The AAAS’s Contribution to Liberal Education</strong></p>\n<p>AAAS对博雅教育的贡献</p>\n<p>C. <strong>Ways to Grasp “The Heart of the Matter”</strong></p>\n<p>把握《问题的核心》的方法</p>\n<p>D. <strong>Progressive Policy vs. Liberal Education</strong></p>\n<p>进步主义政策与博雅教育的对立</p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39],[222,592,1332,49],[222,642,1331,47],[222,688,1331,41],[223,736,1331,49],[222,786,1327,47],[222,834,1331,47],[222,878,1332,55],[218,930,190,47],[325,978,1228,48],[221,1027,1332,47],[222,1074,1332,48],[221,1123,1332,47],[222,1171,1333,47],[222,1219,1331,47],[223,1267,1331,47],[222,1315,1332,47],[222,1363,1331,47],[222,1411,1331,48],[222,1459,286,47],[301,1506,1247,49],[222,1556,1333,47],[222,1604,1331,47],[222,1652,1332,47],[222,1700,1321,47],[223,1748,1331,47],[222,1795,1333,49],[222,1844,382,47],[301,1892,1253,48],[221,1941,1334,47],[222,1989,1332,47],[222,2037,1265,47],[301,2085,1253,47],[222,2133,1332,47],[222,2181,520,47]],"questionRects":[[248,1918,1040,47],[309,1982,875,41],[309,2050,827,39],[309,2114,745,48],[309,2181,726,47]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先肯定AAAS报告重视人文社科，随即批评它没有处理博雅教育危机的真实性质，可能弊大于利 | 先承认一部分价值再指出缺口 |\n| 2 | 交代国会要求AAAS提出维持国家领先的行动以及委员会成员构成 | 再说任务来源和参与者 |\n| 3 | 列出报告支持识字、历史政府、数字技术、研究投入、教师经费、外语与海外学习等目标 | 接着列出材料提出的目标 |\n| 4 | 指出报告没有触及顶尖高校博雅教育中“不自由”的核心，毕业生不了解博雅教育，校园探究被宣传取代 | 然后指出它回避了核心问题 |\n| 5 | 说明教授把进步主义视为正当研究，却把保守主义和古典自由主义排除在正常研究边界外 | 再说问题在现实中的表现 |\n| 6 | 总结AAAS虽热情高涨，其报告却可能掩盖挑战并阻碍改革 | 最后下结论：前面缺口会带来后果 |\n\n先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先肯定AAAS报告重视人文社科，随即批评它没有处理博雅教育危机的真实性质，可能弊大于利</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>交代国会要求AAAS提出维持国家领先的行动以及委员会成员构成</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>列出报告支持识字、历史政府、数字技术、研究投入、教师经费、外语与海外学习等目标</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>指出报告没有触及顶尖高校博雅教育中“不自由”的核心，毕业生不了解博雅教育，校园探究被宣传取代</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明教授把进步主义视为正当研究，却把保守主义和古典自由主义排除在正常研究边界外</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>总结AAAS虽热情高涨，其报告却可能掩盖挑战并阻碍改革</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39],[222,592,1332,49],[222,642,1331,47],[222,688,1331,41],[223,736,1331,49],[222,786,1327,47],[222,834,1331,47],[222,878,1332,55],[218,930,190,47],[325,978,1228,48],[221,1027,1332,47],[222,1074,1332,48],[221,1123,1332,47],[222,1171,1333,47],[222,1219,1331,47],[223,1267,1331,47],[222,1315,1332,47],[222,1363,1331,47],[222,1411,1331,48],[222,1459,286,47],[301,1506,1247,49],[222,1556,1333,47],[222,1604,1331,47],[222,1652,1332,47],[222,1700,1321,47],[223,1748,1331,47],[222,1795,1333,49],[222,1844,382,47],[301,1892,1253,48],[221,1941,1334,47],[222,1989,1332,47],[222,2037,1265,47],[301,2085,1253,47],[222,2133,1332,47],[222,2181,520,47]],"questionRects":[[248,1918,1040,47],[309,1982,875,41],[309,2050,827,39],[309,2114,745,48],[309,2181,726,47]],"scrollTarget":null,"meta":{"kind":"main_method","qid":"40","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"40题","raw":"### A. Illiberal Education and “The Heart of the Matter”\n\n> 不自由的教育与《问题的核心》\n\n如果A是主旨，全文应当围绕“不自由的教育与《问题的核心》”展开，并让每一段都服务于这一中心。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先评价《问题的核心》报告的优点与根本缺口 | 先承认一部分价值再指出缺口 |\n| 2 | 再交代报告的政策任务和委员会背景 | 再说任务来源和参与者 |\n| 3 | 接着承认报告列出的多项目标值得肯定 | 接着列出材料提出的目标 |\n| 4 | 然后指出报告未处理博雅教育中的不自由问题 | 然后指出它回避了核心问题 |\n| 5 | 再展示进步主义偏向怎样排斥古典自由思想 | 再说问题在现实中的表现 |\n| 6 | 最后批评报告可能掩盖危机并阻碍改革 | 最后下结论：前面缺口会带来后果 |\n\nA与全文推进完全一致：全文先承认报告的价值，再交代其来源和建议，随后连续指出它没有触及高校博雅教育中的不自由及思想偏向，结尾回到“报告可能阻碍改革”的总体批评。它能够覆盖每一段，而不是只覆盖一个局部例子。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. Illiberal Education and “The Heart of the Matter”</h3>\n<blockquote>\n<p>不自由的教育与《问题的核心》</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕“不自由的教育与《问题的核心》”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先评价《问题的核心》报告的优点与根本缺口</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再交代报告的政策任务和委员会背景</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着承认报告列出的多项目标值得肯定</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后指出报告未处理博雅教育中的不自由问题</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>再展示进步主义偏向怎样排斥古典自由思想</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后批评报告可能掩盖危机并阻碍改革</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>A与全文推进完全一致：全文先承认报告的价值，再交代其来源和建议，随后连续指出它没有触及高校博雅教育中的不自由及思想偏向，结尾回到“报告可能阻碍改革”的总体批评。它能够覆盖每一段，而不是只覆盖一个局部例子。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[304,303,1250,49],[222,351,1334,49],[222,401,1332,47],[222,449,1331,48],[222,497,1321,47],[301,545,1252,39],[222,592,1332,49],[222,642,1331,47],[222,688,1331,41],[223,736,1331,49],[222,786,1327,47],[222,834,1331,47],[222,878,1332,55],[218,930,190,47],[325,978,1228,48],[221,1027,1332,47],[222,1074,1332,48],[221,1123,1332,47],[222,1171,1333,47],[222,1219,1331,47],[223,1267,1331,47],[222,1315,1332,47],[222,1363,1331,47],[222,1411,1331,48],[222,1459,286,47],[301,1506,1247,49],[222,1556,1333,47],[222,1604,1331,47],[222,1652,1332,47],[222,1700,1321,47],[223,1748,1331,47],[222,1795,1333,49],[222,1844,382,47],[301,1892,1253,48],[221,1941,1334,47],[222,1989,1332,47],[222,2037,1265,47],[301,2085,1253,47],[222,2133,1332,47],[222,2181,520,47]],"questionRects":[[248,1918,1040,47],[309,1982,875,41],[309,2050,827,39],[309,2114,745,48],[309,2181,726,47]],"scrollTarget":null,"meta": 一次没有拉开的两项。\n\n第一段本身就故意把A和B同时摆到眼前。作者先说报告deserves praise，明显带有赞赏；紧接着又用Regrettably, however转折，说它没有处理危机的真实性质，甚至可能more harm than good，明显带有批评。只读这一段，A和B都有直接词句支撑，所以第一遍保留二选一。\n\n我们先把题干和两个选项接起来。\n\n题干问作者对整份AAAS报告的态度。A说总体是批评，B说总体是赞赏。这里不能简单数正面词和负面词，而要判断哪一部分是让步、哪一部分是作者真正要展开的判断。首句的赞扬限定在报告affirming人文社科重要性，第二句的批评却落在报告是否处理核心危机以及可能造成的后果上。\n\n现在拿主旨来检查。\n\n先看B。若作者总体赞赏报告，后文应当主要展开它对博雅教育的贡献。第三段确实完整列出许多值得肯定的目标，但第四段用Unfortunately重新转向“never gets to the heart of the matter”，第五段具体说明教授如何排斥古典自由主义思想，末段又说报告可能set back reform。正面内容只是在承认报告有哪些好目标，并没有成为全文终点。\n\n再看A。最佳标题是“不自由的教育与《问题的核心》”，它把报告名称和作者认定的真正问题绑在一起。全文的写作任务不是介绍报告，而是批评报告没有识别高校博雅教育中的不自由，甚至掩盖挑战。首段的deserves praise构成让步，使批评更有分寸；more harm than good则提前给出全文主导态度。\n\n第一遍B留下，是因为作者确实真诚认可报告的一部分；主旨确定后可以看到，这一认可服务于“即便目标可敬，仍然遗漏核心”的批评结构。A能够解释开头转折、第四至第六段的连续展开和结尾判断，B只能解释让步部分。\n\n> **36题选A。**","html":"<h2>回查36题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. Critical.</li>\n<li>B. Appreciative.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Illiberal Education and “The Heart of the Matter” / 不自由的教育与《问题的核心》</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一段本身就故意把A和B同时摆到眼前。作者先说报告deserves praise，明显带有赞赏；紧接着又用Regrettably, however转折，说它没有处理危机的真实性质，甚至可能more harm than good，明显带有批评。只读这一段，A和B都有直接词句支撑，所以第一遍保留二选一。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问作者对整份AAAS报告的态度。A说总体是批评，B说总体是赞赏。这里不能简单数正面词和负面词，而要判断哪一部分是让步、哪一部分是作者真正要展开的判断。首句的赞扬限定在报告affirming人文社科重要性，第二句的批评却落在报告是否处理核心危机以及可能造成的后果上。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。若作者总体赞赏报告，后文应当主要展开它对博雅教育的贡献。第三段确实完整列出许多值得肯定的目标，但第四段用Unfortunately重新转向“never gets to the heart of the matter”，第五段具体说明教授如何排斥古典自由主义思想，末段又说报告可能set back reform。正面内容只是在承认报告有哪些好目标，并没有成为全文终点。</p>\n<p>再看A。最佳标题是“不自由的教育与《问题的核心》”，它把报告名称和作者认定的真正问题绑在一起。全文的写作任务不是介绍报告，而是批评报告没有识别高校博雅教育中的不自由，甚至掩盖挑战。首段的deserves praise构成让步，使批评更有分寸；more harm than good则提前给出全文主导态度。</p>\n<p>第一遍B留下，是因为作者确实真诚认可报告的一部分；主旨确定后可以看到，这一认可服务于“即便目标可敬，仍然遗漏核心”的批评结构。A能够解释开头转折、第四至第六段的连续展开和结尾判断，B只能解释让步部分。</p>\n<blockquote>\n<p><strong>36题选A。</strong></p>\n</blockquote>\n","articleRects":[[304 以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>36题题干</h2>\n<p><strong>According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?</strong></p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持什么态度？</p>\n</blockquote>\n<p>题型：<strong>作者态度题</strong>。</p>\n<hr />\n<h2>37题题干</h2>\n<p><strong>Influential figures in the Congress required that the AAAS report on how to ______.</strong></p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何______。</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>38题题干</h2>\n<p><strong>According to Paragraph 3, the report suggests ______.</strong></p>\n<blockquote>\n<p>根据第三段，这份报告建议什么？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n<hr />\n<h2>39题题干</h2>\n<p><strong>The author implies in Paragraph 5 that professors are ______.</strong></p>\n<blockquote>\n<p>作者在第五段暗示，教授们______。</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n<hr />\n<h2>40题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>以下哪一项最适合作为本文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点 / 全文主旨题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>however, Because, Yet</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>deserves praise, admirable, harm</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>identify, supports, ignores</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>benefits, propaganda, set back reform</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>report, liberal education, humanities, AAAS</td>\n</tr>\n</tbody>\n</table>\n<p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n<p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. / Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n<p>“《问题的核心》,” the <span class=\"mask\">[xxx]</span> 美国学术院的报告 of Arts and Sciences (AAAS), 值得赞扬 for <span class=\"mask\">[xxx]</span> the 人文学科的重要性 and 社会科学 to the <span class=\"mask\">[xxx]</span> and security of 美国自由民主. / 令人遗憾的是, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing 博雅教育 may cause more harm than good.</p>\n<p>1、《问题的核心》、美国学术院的报告、值得赞扬、人文学科的重要性、社会科学、美国自由民主、令人遗憾的是、博雅教育。</p>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others” to “maintain national excellence in humanities and social scientific scholarship and education.” In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others” to “maintain national excellence in humanities and social scientific scholarship and education.” / In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. / Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>In 2010, 国会两党领袖 sent letters to the AAAS asking that it identify actions that could be taken by “联邦州和地方政府, 大学基金会和教育者, individual <span class=\"mask\">[xxx]</span> and others” to “保持国家领先 in 人文与社会科学学术 and education.” / In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. / Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>2、国会两党领袖、联邦州和地方政府、大学基金会和教育者、保持国家领先、人文与社会科学学术。</p>\n<p>The goals identified in the report are generally admirable. Because representative government <span class=\"mask\
