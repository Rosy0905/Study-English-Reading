he 使用新数字技术. / To 鼓励创新与竞争, the report calls for 增加研究投入, the crafting of <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> that 提高学生能力 to 解决问题 and communicate <span class=\"mask\">[xxx]</span> in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. / The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.</p>\n<p>3、总体值得赞赏、代议制政府、知情公民、报告支持、历史与政府研究、使用新数字技术、鼓励创新与竞争、增加研究投入、提高学生能力、解决问题。</p>\n<p>Unfortunately, despite 2½ years in the making, “The Heart of the Matter” never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities. The commission ignores that for several decades America’s colleges and universities have produced graduates who don’t know the content and character of liberal education and are thus <span class=\"mask\">[xxx]</span> of its benefits. Sadly, the spirit of <span class=\"mask\">[xxx]</span> once at home on campus has been replaced by the use of the humanities and social sciences as <span class=\"mask\">[xxx]</span> for publicizing “progressive,” or left-liberal propaganda.</p>\n<p>Unfortunately, despite 2½ years in the making, “The Heart of the Matter” never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities. / The commission ignores that for several decades America’s colleges and universities have produced graduates who don’t know the content and character of liberal education and are thus <span class=\"mask\">[xxx]</span> of its benefits. / Sadly, the spirit of <span class=\"mask\">[xxx]</span> once at home on campus has been replaced by the use of the humanities and social sciences as <span class=\"mask\">[xxx]</span> for publicizing “progressive,” or left-liberal propaganda.</p>\n<p>不幸的是, despite 2½ years in the making, “《问题的核心》” 从未触及核心 of the matter: the 博雅教育的不自由性质 at our 顶尖高校. / The commission ignores that for 几十年来 美国高校 have produced graduates who don’t know the content and character of liberal education and are thus <span class=\"mask\">[xxx]</span> of its benefits. / Sadly, the spirit of <span class=\"mask\">[xxx]</span> once at home on campus has been replaced by the use of the humanities and social sciences as <span class=\"mask\">[xxx]</span> for publicizing “progressive,” or left-liberal propaganda.</p>\n<p>4、不幸的是、《问题的核心》、从未触及核心、博雅教育的不自由性质、顶尖高校、几十年来、美国高校。</p>\n<p>Today, professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n<p>Today, professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study / while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n<p>如今教授们 <span class=\"mask\">[xxx]</span> treat the 进步主义历史解释 and 进步主义公共政策 as the 适当研究对象 / while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n<p>5、如今教授们、进步主义历史解释、进步主义公共政策、适当研究对象。</p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by <span class=\"mask\">[xxx]</span> the depth and breadth of the challenge that Congress asked it to illuminate.</p>\n<p>The AAAS displays great enthusiasm for liberal education. / Yet its report may well set back reform by <span class=\"mask\">[xxx]</span> the depth and breadth of the challenge that Congress asked it to illuminate.</p>\n<p>The AAAS displays 极大热情 对博雅教育. / Yet 其报告很可能 阻碍改革 by <span class=\"mask\">[xxx]</span> the depth and breadth of the challenge that Congress asked it to illuminate.</p>\n<p>6、极大热情、对博雅教育、其报告很可能、阻碍改革。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到AAAS报告、国会要求或大学教授时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现《问题的核心》、人文与社会科学、自由民主以及弊大于利；中间有国会来信、AAAS、委员会、识字、历史、数字技术、研究投入和外语；后面又有顶尖高校、毕业生、进步主义、古典自由主义以及改革倒退。</p>\n<p>到这里还不能自然地说清楚：作者为什么一边赞扬报告一边担心它，国会交给AAAS的具体任务是什么，报告列出的目标与作者认为的真正危机有什么差别，教授的教学取向如何影响博雅教育，以及最末一句为什么说热情反而可能妨碍改革。粗读时只要能判断“这篇文章大概在评价一份关于博雅教育的报告”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住AAAS报告、国会任务、报告目标、大学里的问题和结尾的改革风险；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>36题</h2>\n<blockquote>\n<p>According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?<br />\n根据第一段，作者对AAAS报告持什么态度？</p>\n</blockquote>\n<p>题干已经明确写出Paragraph 1，所以直接回到第1段，把这一自然段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n<p>开始精读：</p>\n<p>“The Heart of the Matter,” the <span class=\"mask\">[xxx]</span> report by the American Academy of Arts and Sciences (AAAS), deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences to the <span class=\"mask\">[xxx]</span> and security of liberal democracy in America. / Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n<p>顺着英文顺序读：</p>\n<p>美国艺术与科学学会发布的[xxx]报告《问题的核心》，因为[xxx]人文与社会科学对美国自由民主的[xxx]与安全非常重要而值得赞扬。 / 然而令人遗憾的是，这份报告没有处理博雅教育所面临[xxx]的真实性质，这种[xxx]可能弊大于利。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. Critical.</h3>\n<blockquote>\n<p>批评的</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对AAAS报告持批评态度。</p>\n<p>A里的“Critical”和原文“more harm than good”都在回答作者最终怎样评价报告的影响，因为Critical与more harm than good都指向负面评价，所以回看第1段这句话。</p>\n<blockquote>\n<p>Regrettably, however, the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n</blockquote>\n<p>“Critical”能覆盖“more harm than good”和报告未处理真实问题；但本段开头又有deserves praise，所以第一遍需要判断哪一面更代表总体态度。 因此“Critical”与“more harm than good”在这里能接上。</p>\n<p><strong>一段中既有赞扬又有弊大于利，Critical能否代表作者的主导判断？</strong></p>\n<p>还不能立即唯一确定，负面结论很强，但开头的明确赞扬也让Appreciative暂时有依据。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. Appreciative.</h3>\n<blockquote>\n<p>赞赏的</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对AAAS报告持赞赏态度。</p>\n<p>B里的“Appreciative”和原文“deserves praise”都在回答作者是否明确肯定报告的一部分，因为Appreciative与deserves praise在字面上直接对应，所以回看第1段这句话。</p>\n<blockquote>\n<p>deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences</p>\n</blockquote>\n<p>“Appreciative”与“deserves praise”完全接得上；但后一句转入Regrettably和more harm than good，赞赏可能只是让步。 因此“Appreciative”与“deserves praise”在这里能接上。</p>\n<p><strong>只看deserves praise，能否把作者整体态度定成Appreciative？</strong></p>\n<p>还不能，B抓住了真实的正面评价，但尚需用全文判断这是不是作者最终重心。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. Contemptuous.</h3>\n<blockquote>\n<p>轻蔑的</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者对AAAS报告持轻蔑态度。</p>\n<p>C里的“Contemptuous”和原文“deserves praise”都在回答批评是否达到轻蔑和不屑的程度，因为态度词必须与开头明确的肯定同时兼容，所以回看第1段这句话。</p>\n<blockquote>\n<p>deserves praise for <span class=\"mask\">[xxx]</span> the importance of the humanities and social sciences</p>\n</blockquote>\n<p>“Contemptuous”意味着彻底蔑视，而“deserves praise”明确承认报告有值得肯定的部分，程度不相容。 因此“Contemptuous”与“deserves praise”在这里仍有具体差别。</p>\n<p><strong>一个被作者说deserves praise的报告，能同时被整体轻蔑吗？</strong></p>\n<p>不能，C把有保留的批评夸大成全盘鄙视。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. Tolerant.</h3>\n<blockquote>\n<p>宽容的</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对AAAS报告持宽容态度。</p>\n<p>D里的“Tolerant”和原文“more harm than good”都在回答作者是在容忍缺点还是警告其危害，因为Tolerant与more harm than good对缺陷的处理强度不同，所以回看第1段这句话。</p>\n<blockquote>\n<p>the report’s <span class=\"mask\">[xxx]</span> to address the true nature of the <span class=\"mask\">[xxx]</span> facing liberal education may cause more harm than good.</p>\n</blockquote>\n<p>“Tolerant”意味着接受或包容不足，而“more harm than good”是在警告报告可能造成严重反效果。 因此“Tolerant”与“more harm than good”在这里仍有具体差别。</p>\n<p><strong>明确说弊大于利，还是一种宽容态度吗？</strong></p>\n<p>不能，D弱化了作者的负面判断。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>36题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下A和B。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>37题</h2>\n<blockquote>\n<p>Influential figures in the Congress required that the AAAS report on how to <strong><strong><strong>.<br />\n国会中的重要人物要求AAAS报告如何</strong></strong></strong>。</p>\n</blockquote>\n<p>题干已经给出AAAS、Congress这个人物或对象，第2段也出现AAAS、Congress，所以把第2段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others” to “maintain national excellence in humanities and social scientific scholarship and education.” In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>开始精读：</p>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others” to “maintain national excellence in humanities and social scientific scholarship and education.” / In response, the American Academy formed the <span class=\"mask\">[xxx]</span> on the Humanities and Social Sciences. / Among the commission’s 51 members are <span class=\"mask\">[xxx]</span> presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.</p>\n<p>顺着英文顺序读：</p>\n<p>2010年，国会中有影响力的民主党人与共和党人致信AAAS，要求它找出“联邦、州和地方政府，大学、基金会、教育者、个人[xxx]及其他人”可以采取的行动，以“保持人文与社会科学研究和教育的全国领先地位”。 / 作为回应，美国学术院成立了人文与社会科学[xxx]。 / 该委员会51名成员包括[xxx]校长、学者、律师、法官和企业高管，以及外交、电影、音乐和新闻领域的知名人物。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. safeguard individuals’ rights to education</h3>\n<blockquote>\n<p>保障个人受教育权</p>\n</blockquote>\n<p>把A接回题干，它说的是：国会要求AAAS说明如何保障个人受教育权。</p>\n<p>A里的“rights to education”和原文“maintain national excellence”都在回答国会要求解决的是个人权利还是国家水平，因为两处都涉及education，但目标对象不同，所以回看第2段这句话。</p>\n<blockquote>\n<p>to “maintain national excellence in humanities and social scientific scholarship and education.”</p>\n</blockquote>\n<p>“rights to education”把目标放在个人权利，“maintain national excellence”明确放在国家层面的学术与教育领先。 因此“rights to education”与“maintain national excellence”在这里仍有具体差别。</p>\n<p><strong>保持全国领先能直接改写成保障个人受教育权吗？</strong></p>\n<p>不能，A改变了目标层级和对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. define the <span class=\"mask\">[xxx]</span> role in education</h3>\n<blockquote>\n<p>界定政府在教育中的角色</p>\n</blockquote>\n<p>把B接回题干，它说的是：国会要求AAAS界定政府的教育角色。</p>\n<p>B里的“role in education”和原文“identify actions”都在回答报告任务是界定角色还是列出行动，因为role与actions都涉及各方如何参与，但任务动词需要核对，所以回看第2段这句话。</p>\n<blockquote>\n<p>asking that it identify actions that could be taken by “federal, state and local governments, universities, foundations, educators, individual <span class=\"mask\">[xxx]</span> and others”</p>\n</blockquote>\n<p>“define the role”要求给政府划定职责边界，而“identify actions”要求找出多个主体可以采取的行动，且主体不只政府。 因此“role in education”与“identify actions”在这里仍有具体差别。</p>\n<p><strong>列举各方可采取的行动，等于界定政府角色吗？</strong></p>\n<p>不能，B把行动清单改成了制度分工。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. retain people’s interest in liberal education</h3>\n<blockquote>\n<p>保持人们对博雅教育的兴趣</p>\n</blockquote>\n<p>把C接回题干，它说的是：国会要求AAAS保持公众对博雅教育的兴趣。</p>\n<p>C里的“people’s interest”和原文“national excellence”都在回答maintain修饰的对象是什么，因为选项和原文都像在说保持，但名词对象不同，所以回看第2段这句话。</p>\n<blockquote>\n<p>to “maintain national excellence in humanities and social scientific scholarship and education.”</p>\n</blockquote>\n<p>“people’s interest”是公众兴趣，“national excellence”是国家在人文与社会科学研究教育中的领先水平。 因此“people’s interest”与“national excellence”在这里仍有具体差别。</p>\n<p><strong>原文的maintain后面是interest吗？</strong></p>\n<p>不能，C替换了被维持的对象。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. keep a leading position in liberal education</h3>\n<blockquote>\n<p>保持博雅教育的领先地位</p>\n</blockquote>\n<p>把D接回题干，它说的是：国会要求AAAS说明如何保持博雅教育领先。</p>\n<p>D里的“leading position”和原文“national excellence”都在回答国会任务的最终目标是什么，因为leading position是national excellence的直接概括，所以回看第2段这句话。</p>\n<blockquote>\n<p>to “maintain national excellence in humanities and social scientific scholarship and education.”</p>\n</blockquote>\n<p>“keep a leading position”对应“maintain national excellence”，liberal education在全文语境中概括人文与社会科学教育。 因此“leading position”与“national excellence”在这里能接上。</p>\n<p><strong>保持国家卓越是否就是维持领先地位？</strong></p>\n<p>能，D保留了maintain和national excellence两个核心关系。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>37题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>37题选D。</strong></p>\n</blockquote>\n<h2>38题</h2>\n<blockquote>\n<p>According to Paragraph 3, the report suggests ______.<br />\n根据第三段，这份报告建议什么？</p>\n</blockquote>\n<p>题干已经明确写出Paragraph 3，所以直接回到第3段，把这一自然段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The goals identified in the report are generally admirable. Because representative government <span class=\"mask\">[xxx]</span> an informed citizenry, the report supports full <span class=\"mask\">[xxx]</span>; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies. To encourage innovation and competition, the report calls for increased investment in research, the crafting of <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> that improve students’ ability to solve problems and communicate <span class=\"mask\">[xxx]</span> in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.</p>\n<p>开始精读：</p>\n<p>The goals identified in the report are generally admirable. / Because representative government <span class=\"mask\">[xxx]</span> an informed citizenry, the report supports full <span class=\"mask\">[xxx]</span>; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies. / To encourage innovation and competition, the report calls for increased investment in research, the crafting of <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> that improve students’ ability to solve problems and communicate <span class=\"mask\">[xxx]</span> in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. / The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.</p>\n<p>顺着英文顺序读：</p>\n<p>报告确定的目标总体值得赞赏。 / 由于代议制政府[xxx]公民充分知情，报告支持全面[xxx]；强调历史与政府研究，尤其是美国历史和美国政府；并鼓励使用新数字技术。 / 为鼓励创新和竞争，报告呼吁增加研究投资，设计[xxx]的[xxx]以提高学生解决问题并在21世纪[xxx]沟通的能力，增加教师经费，并鼓励学者把知识用于当今重大挑战。 / 报告还主张加强外语、国际事务学习，并扩大海外学习项目。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. an exclusive study of American history</h3>\n<blockquote>\n<p>只研究美国历史</p>\n</blockquote>\n<p>把A接回题干，它说的是：报告建议只研究美国历史。</p>\n<p>A里的“exclusive study”和原文“particularly American history”都在回答报告对美国历史的强调是否具有排他性，因为exclusive和particularly都在限定美国历史的地位，所以回看第3段这句话。</p>\n<blockquote>\n<p>the report supports full <span class=\"mask\">[xxx]</span>; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.</p>\n</blockquote>\n<p>“exclusive study”说只能研究美国历史，而“particularly American history”只是尤其强调，旁边还并列政府、识字和数字技术。 因此“exclusive study”与“particularly American history”在这里仍有具体差别。</p>\n<p><strong>particularly能改写成exclusive吗？</strong></p>\n<p>不能，A把重点强调扩大成排他要求。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. a <span class=\"mask\">[xxx]</span> emphasis on theoretical subjects</h3>\n<blockquote>\n<p>更加重视理论学科</p>\n</blockquote>\n<p>把B接回题干，它说的是：报告建议更多强调理论学科。</p>\n<p>B里的“emphasis on theoretical subjects”和原文“use of new digital technologies”都在回答报告强调的是抽象理论还是多种实际能力与技术，因为选项的emphasis需要与段落列举的内容比较，所以回看第3段这句话。</p>\n<blockquote>\n<p>the report supports full <span class=\"mask\">[xxx]</span>; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.</p>\n</blockquote>\n<p>“emphasis on theoretical subjects”把方向收窄到理论学科，而“use of new digital technologies”以及后文解决问题、沟通能力都不是这一单一方向。 因此“emphasis on theoretical subjects”与“use of new digital technologies”在这里仍有具体差别。</p>\n<p><strong>第三段的建议能被概括成更重理论吗？</strong></p>\n<p>不能，B遗漏并反向处理了数字技术和实践能力。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the application of emerging technologies</h3>\n<blockquote>\n<p>应用新兴技术</p>\n</blockquote>\n<p>把C接回题干，它说的是：报告建议应用新兴技术。</p>\n<p>C里的“application of emerging technologies”和原文“use of new digital technologies”都在回答报告是否鼓励使用新技术，因为application与use、emerging与new形成直接对应，所以回看第3段这句话。</p>\n<blockquote>\n<p>the report supports full <span class=\"mask\">[xxx]</span>; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.</p>\n</blockquote>\n<p>“application of emerging technologies”就是“use of new digital technologies”的概括，没有改变动作和对象。 因此“application of emerging technologies”与“use of new digital technologies”在这里能接上。</p>\n<p><strong>鼓励使用新数字技术，是否等于建议应用新兴技术？</strong></p>\n<p>能，C与原文关系完整对应。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. funding for the <span class=\"mask\">[xxx]</span> of foreign languages</h3>\n<blockquote>\n<p>为外语学习提供资金</p>\n</blockquote>\n<p>把D接回题干，它说的是：报告建议资助外语学习。</p>\n<p>D里的“foreign languages”和原文“increased funding for teachers”都在回答资金增加具体给了谁，因为funding与foreign languages都在段落出现，但是否在同一搭配要核对，所以回看第3段这句话。</p>\n<blockquote>\n<p>increased funding for teachers ... greater study of foreign languages</p>\n</blockquote>\n<p>“funding for foreign languages”把两处信息合并，而原文是“funding for teachers”和另一句“study of foreign languages”，两者没有直接修饰关系。 因此“foreign languages”与“increased funding for teachers”在这里仍有具体差别。</p>\n<p><strong>教师经费与外语学习并列出现，就能合成外语学习经费吗？</strong></p>\n<p>不能，D把两个不同建议拼成了一个新关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>38题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>38题选C。</strong></p>\n</blockquote>\n<h2>39题</h2>\n<blockquote>\n<p>The author implies in Paragraph 5 that professors are <strong><strong><strong>.<br />\n作者在第五段暗示，教授们</strong></strong></strong>。</p>\n</blockquote>\n<p>题干已经明确写出Paragraph 5，所以直接回到第5段，把这一自然段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Today, professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n<p>开始精读：</p>\n<p>Today, professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study / while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n<p>顺着英文顺序读：</p>\n<p>如今，教授们[xxx]把进步主义的历史解释和进步主义公共政策视为适当研究对象 / 同时把保守主义或古典自由主义思想——如自由市场和自立——[xxx]成处在常规、有时甚至正当的学术研究边界之外。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. supportive of <span class=\"mask\">[xxx]</span> markets</h3>\n<blockquote>\n<p>支持自由市场</p>\n</blockquote>\n<p>把A接回题干，它说的是：教授们支持自由市场。</p>\n<p>A里的“supportive of”和原文“outside the boundaries”都在回答教授如何对待自由市场这类思想，因为markets在选项和原文中相同，态度关系可以比较，所以回看第5段这句话。</p>\n<blockquote>\n<p>professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n</blockquote>\n<p>“supportive of markets”说教授支持它，而“outside the boundaries”说明他们把自由市场归到正常甚至正当研究之外。 因此“supportive of”与“outside the boundaries”在这里仍有具体差别。</p>\n<p><strong>把自由市场排除在正当研究边界外，能叫支持吗？</strong></p>\n<p>不能，A与原文态度方向相反。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. biased against classical liberal ideas</h3>\n<blockquote>\n<p>对古典自由主义思想有偏见</p>\n</blockquote>\n<p>把B接回题干，它说的是：教授们对古典自由主义思想抱有偏见。</p>\n<p>B里的“biased against classical liberal ideas”和原文“conservative or classical liberal ideas”都在回答教授对进步主义与古典自由主义是否采用同一标准，因为biased against与一边视为proper、一边排除在boundaries外的对照相符，所以回看第5段这句话。</p>\n<blockquote>\n<p>professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study while <span class=\"mask\">[xxx]</span> conservative or classical liberal ideas—such as free markets and self-reliance—as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n</blockquote>\n<p>“biased against classical liberal ideas”概括了原句的双重标准：进步主义是proper subject，古典自由主义却被[xxx]为边界之外。 因此“biased against classical liberal ideas”与“conservative or classical liberal ideas”在这里能接上。</p>\n<p><strong>同一课堂标准只认可一边、排斥另一边，是否构成偏见？</strong></p>\n<p>能，B准确概括了段落的对比关系。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. cautious about intellectual investigation</h3>\n<blockquote>\n<p>对学术研究很谨慎</p>\n</blockquote>\n<p>把C接回题干，它说的是：教授们对学术研究持谨慎态度。</p>\n<p>C里的“cautious about”和原文“intellectual investigation”都在回答作者是在说谨慎还是说排斥某类思想，因为cautious和legitimate investigation都涉及研究态度，但强度不同，所以回看第5段这句话。</p>\n<blockquote>\n<p>as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.</p>\n</blockquote>\n<p>“cautious about investigation”是一般性的审慎，而原文说某些思想被放到routine甚至legitimate investigation之外，是选择性排除。 因此“cautious about”与“intellectual investigation”在这里仍有具体差别。</p>\n<p><strong>把某类思想排除在正当研究之外，只是谨慎吗？</strong></p>\n<p>不能，C弱化了作者指出的偏向，也把特定对象扩成一般态度。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. conservative about public policy</h3>\n<blockquote>\n<p>在公共政策上保守</p>\n</blockquote>\n<p>把D接回题干，它说的是：教授们对公共政策持保守立场。</p>\n<p>D里的“conservative about public policy”和原文“progressive public policy”都在回答教授认可哪一种公共政策取向，因为conservative与progressive在同一政策维度上方向相反，所以回看第5段这句话。</p>\n<blockquote>\n<p>professors <span class=\"mask\">[xxx]</span> treat the progressive interpretation of history and progressive public policy as the proper subject of study.</p>\n</blockquote>\n<p>“conservative about public policy”说教授偏保守，而原文明确把“progressive public policy”视为proper subject。 因此“conservative about public policy”与“progressive public policy”在这里仍有具体差别。</p>\n<p><strong>把进步主义政策当正当研究对象，能推出教授在政策上保守吗？</strong></p>\n<p>不能，D把政治方向写反了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>39题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>39题选B。</strong></p>\n</blockquote>\n<h2>40题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>以下哪一项最适合作为本文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Illiberal Education and “The Heart of the Matter”</strong></p>\n<p>不自由的教育与《问题的核心》</p>\n<p>B. <strong>The AAAS’s Contribution to Liberal Education</strong></p>\n<p>AAAS对博雅教育的贡献</p>\n<p>C. <strong>Ways to Grasp “The Heart of the Matter”</strong></p>\n<p>把握《问题的核心》的方法</p>\n<p>D. <strong>Progressive Policy vs. Liberal Education</strong></p>\n<p>进步主义政策与博雅教育的对立</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先肯定AAAS报告重视人文社科，随即批评它没有处理博雅教育危机的真实性质，可能弊大于利</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>交代国会要求AAAS提出维持国家领先的行动以及委员会成员构成</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>列出报告支持识字、历史政府、数字技术、研究投入、教师经费、外语与海外学习等目标</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>指出报告没有触及顶尖高校博雅教育中“不自由”的核心，毕业生不了解博雅教育，校园探究被宣传取代</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明教授把进步主义视为正当研究，却把保守主义和古典自由主义排除在正常研究边界外</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>总结AAAS虽热情高涨，其报告却可能掩盖挑战并阻碍改革</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. Illiberal Education and “The Heart of the Matter”</h3>\n<blockquote>\n<p>不自由的教育与《问题的核心》</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕“不自由的教育与《问题的核心》”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先评价《问题的核心》报告的优点与根本缺口</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再交代报告的政策任务和委员会背景</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着承认报告列出的多项目标值得肯定</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后指出报告未处理博雅教育中的不自由问题</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>再展示进步主义偏向怎样排斥古典自由思想</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后批评报告可能掩盖危机并阻碍改革</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>A与全文推进完全一致：全文先承认报告的价值，再交代其来源和建议，随后连续指出它没有触及高校博雅教育中的不自由及思想偏向，结尾回到“报告可能阻碍改革”的总体批评。它能够覆盖每一段，而不是只覆盖一个局部例子。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. The AAAS’s Contribution to Liberal Education</h3>\n<blockquote>\n<p>AAAS对博雅教育的贡献</p>\n</blockquote>\n<p>如果B是主旨，全文应当围绕“AAAS对博雅教育的贡献”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先赞扬AAAS推动博雅教育</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再列出它组织委员会的贡献</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着详细展示报告的优秀建议</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后说明这些建议已经改善大学教育</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>再补充教授与学生的积极回应</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后肯定AAAS促进改革的成果</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>把B代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“AAAS对博雅教育的贡献”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. Ways to Grasp “The Heart of the Matter”</h3>\n<blockquote>\n<p>把握《问题的核心》的方法</p>\n</blockquote>\n<p>如果C是主旨，全文应当围绕“把握《问题的核心》的方法”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先提出理解报告的方法问题</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再介绍阅读报告的几个步骤</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着教读者怎样分析各项目标</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后说明如何识别教育危机</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>再给出评价大学课程的工具</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后总结把握报告核心的技巧</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>把C代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“把握《问题的核心》的方法”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. Progressive Policy vs. Liberal Education</h3>\n<blockquote>\n<p>进步主义政策与博雅教育的对立</p>\n</blockquote>\n<p>如果D是主旨，全文应当围绕“进步主义政策与博雅教育的对立”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先把进步主义政策与博雅教育并列</td>\n<td>先承认一部分价值再指出缺口</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再追溯两者历史冲突</td>\n<td>再说任务来源和参与者</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着分析多项进步主义政策</td>\n<td>接着列出材料提出的目标</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后展示这些政策全面破坏教育</td>\n<td>然后指出它回避了核心问题</td>\n</tr>\n<tr>\n<td>5</td>\n<td>再提出古典自由主义替代方案</td>\n<td>再说问题在现实中的表现</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后主张取消进步主义政策</td>\n<td>最后下结论：前面缺口会带来后果</td>\n</tr>\n</tbody>\n</table>\n<p>把D代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“进步主义政策与博雅教育的对立”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>40题主旨结果</h3>\n<p>四个选项全部代入后，A能够覆盖开头、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。</p>\n<p>A同时抓住被评论的报告和作者认定的真正危机——博雅教育中的不自由；B只写正面贡献，C把评论文章误成方法指南，D则把第五段的一个表现扩大成全文唯一主题。</p>\n<blockquote>\n<p><strong>40题选A。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Illiberal Education and “The Heart of the Matter” / 不自由的教育与《问题的核心》</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查36题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. Critical.</li>\n<li>B. Appreciative.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Illiberal Education and “The Heart of the Matter” / 不自由的教育与《问题的核心》</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一段本身就故意把A和B同时摆到眼前。作者先说报告deserves praise，明显带有赞赏；紧接着又用Regrettably, however转折，说它没有处理危机的真实性质，甚至可能more harm than good，明显带有批评。只读这一段，A和B都有直接词句支撑，所以第一遍保留二选一。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问作者对整份AAAS报告的态度。A说总体是批评，B说总体是赞赏。这里不能简单数正面词和负面词，而要判断哪一部分是让步、哪一部分是作者真正要展开的判断。首句的赞扬限定在报告affirming人文社科重要性，第二句的批评却落在报告是否处理核心危机以及可能造成的后果上。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。若作者总体赞赏报告，后文应当主要展开它对博雅教育的贡献。第三段确实完整列出许多值得肯定的目标，但第四段用Unfortunately重新转向“never gets to the heart of the matter”，第五段具体说明教授如何排斥古典自由主义思想，末段又说报告可能set back reform。正面内容只是在承认报告有哪些好目标，并没有成为全文终点。</p>\n<p>再看A。最佳标题是“不自由的教育与《问题的核心》”，它把报告名称和作者认定的真正问题绑在一起。全文的写作任务不是介绍报告，而是批评报告没有识别高校博雅教育中的不自由，甚至掩盖挑战。首段的deserves praise构成让步，使批评更有分寸；more harm than good则提前给出全文主导态度。</p>\n<p>第一遍B留下，是因为作者确实真诚认可报告的一部分；主旨确定后可以看到，这一认可服务于“即便目标可敬，仍然遗漏核心”的批评结构。A能够解释开头转折、第四至第六段的连续展开和结尾判断，B只能解释让步部分。</p>\n<blockquote>\n<p><strong>36题选A。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>36题：A</strong> — Critical.（批评的）</li>\n<li><strong>37题：D</strong> — keep a leading position in liberal education（保持博雅教育的领先地位）</li>\n<li><strong>38题：C</strong> — the application of emerging technologies（应用新兴技术）</li>\n<li><strong>39题：B</strong> — biased against classical liberal ideas（对古典自由主义思想有偏见）</li>\n<li><strong>40题：A</strong> — Illiberal Education and “The Heart of the Matter”（不自由的教育与《问题的核心》）</li>\n</ul>\n<p>本篇答案：<strong>ADCBA</strong>。</p>\n","analysisStartIndex":34,"maskInventory":{"token":"[xxx]","count":122},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_dir
