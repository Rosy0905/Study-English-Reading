const NEWTYPE={"smallTitle":"<h2>小标题题<\/h2><h3>Directions<\/h3><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)<\/p><div class=\"newtype-options\"><p><strong>A. Evidence of Hardship behind the Political Gamble<\/strong><\/p><p><strong>B. A Welfare Reform Promoted as Help<\/strong><\/p><p><strong>C. A Lasting Consensus on a Smaller State<\/strong><\/p><p><strong>D. A Different Course and the Possibility of Opposition<\/strong><\/p><p><strong>E. Joblessness and the Reality of Conditional Support<\/strong><\/p><p><strong>F. Political Advantage beneath the Language of Help<\/strong><\/p><p><strong>G. Replacing Welfare with Unconditional Insurance<\/strong><\/p><\/div><h2>Help, Hardship and the Politics of Welfare<\/h2><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. __________<\/h3><p>George Osborne presented his new welfare measures in the language of reform, fairness and helpfulness. To qualify for benefit, the unemployed would have to bring a CV to the jobcentre, register for online job searches and begin looking for work. They would report weekly rather than fortnightly and wait seven days for the jobseeker&#x27;s allowance. The first days, he argued, should be spent finding work rather than signing on. These changes were said to reduce dependency, protect taxpayers and ensure that support reached only the most deserving claimants. On the surface, the package sounded like a reasonable attempt to improve lives.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. __________<\/h3><p>The reality of unemployment is far less comfortable than this language suggests. Losing a job removes income, company and the structure of daily life; the newly unemployed generally want work as quickly as possible. Nor can they simply choose generous, permanent support. Two decades of reform have already tied benefits to active job searches. Claimants receive a time-limited allowance rather than unconditional insurance payments, and the weekly sum is among the least generous in the European Union. A seven-day delay therefore withholds modest help at a moment of crisis, while the supposedly new search requirement repeats the system&#x27;s existing principle.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. __________<\/h3><p>Calling the restrictions help serves a political purpose. Osborne seeks to present the Conservatives as friends of taxpayers and Labour as the welfare party, while making further cuts appear normal. His gamble assumes that those bearing the costs will remain voiceless and that most voters will accept welfare as a burden and a smaller state as a necessity. Success would also require people to avoid difficult questions about the management of the economy and the consequences for society. Behind the reassuring vocabulary lies an attempt to define the terms of political debate.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. __________<\/h3><p>That gamble is difficult to square with the evidence of hardship. The Children&#x27;s Commissioner projected a rise in child poverty, millions depended on payday loans, insecure contracts were spreading and food banks were increasingly used. Families also faced rising housing, energy and transport costs while benefits were being cut in real terms. Local services were shrinking just as need became more acute. Even a Conservative local-government leader warned that further budget reductions could push services to breaking point. Such criticism, alongside the personal stories of displaced tenants, suggested that civil society was beginning to resist.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. __________<\/h3><p>A different approach is possible: slower cuts, a wider tax base, a new social settlement, a recast relationship between central and local government and a more innovative, productive economy. Osborne expects critics to remain too divided to form a coalition broad enough to include both unions and business. Yet cruelty presented as help offers no reliable foundation for a lasting majority either. Its social consequences may instead bring opponents together. A speech that scores an immediate political victory can therefore become the starting point of an effective opposition, rather than a successful long-term strategy.<\/p><\/section>","sorting":"<h2>排序题<\/h2><h3>Directions<\/h3><p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)<\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A<\/h3><p>That new reporting rule was followed by another restriction: a seven-day wait for the jobseeker&#x27;s allowance. Osborne said the first days should be spent finding work, not signing on. He presented the changes as a way to reduce dependency and speed a return to employment, while protecting taxpayers and ensuring that only the most deserving claimants received benefits.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B<\/h3><p>Calling these restrictions help therefore serves political rather than practical ends. Osborne wants the Conservatives to appear as friends of taxpayers and Labour as the welfare party. His gamble is that those punished will remain voiceless, while most voters accept welfare as a burden and a smaller state as unavoidable. It depends on the public asking few questions about the economy or the social consequences.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C<\/h3><p>Against that mounting hardship and unrest, a plausible alternative exists: slower cuts, a broader tax base, a new social settlement and a more innovative economy. Relations between central and local government could also be recast. Osborne nevertheless believes no broad coalition can unite around such a programme. He expects unions, business and the other critics to remain unable to argue together for change.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D<\/h3><p>George Osborne introduced new welfare measures with promises of reform, fairness and help. Under his upfront work search scheme, the unemployed would have to bring a CV to the jobcentre, register for online searches and begin looking for work before receiving benefit. They would then have to report weekly rather than fortnightly.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E<\/h3><p>The newly unemployed are nevertheless pictured as eager to settle into permanent dependency. That ignores two decades of increasingly strict reform: benefits already depend on active job searches, last for a limited time and provide one of the least generous weekly allowances in the European Union. Delaying this modest support for seven days hardly helps someone in crisis, and presenting the existing search requirement as a new transformation is equally misleading.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F<\/h3><p>His confidence in a divided opposition may be misplaced. Cruelty disguised as help, with no promise beyond more of the same, cannot reliably build a majority either. Its desperate social consequences may instead create an effective opposition coalition. A spending speech can win a day&#x27;s political contest without becoming a lasting strategy; the chancellor may have gone a step too far.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G<\/h3><p>Yet losing a job is a traumatic experience, not an attractive route to support. It removes income, daily structure and the company of colleagues, while leaving people frightened and embarrassed. The money needed to feed a family and pay the bills disappears, and the available help is small and difficult to obtain. Ask the newly unemployed what they want, and the answer is a job.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H<\/h3><p>That gamble looks less secure when set against growing hardship. Child poverty was projected to rise, payday borrowing and insecure work were widespread, and food banks were expanding. Housing, energy and transport costs rose while benefits and local services were cut. Even a Conservative local-government leader warned that further reductions would push services to breaking point. Civil society was beginning to stir.<\/p><\/section><p class=\"sorting-boxes\"><strong>41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____<\/strong><\/p>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>in order to<\/td>\n<td>为了<\/td>\n<td>change lives for the better<\/td>\n<td>改善生活<\/td>\n<td>reduce<\/td>\n<td>v. 减少<\/td>\n<\/tr>\n<tr>\n<td>dependency<\/td>\n<td>n. 依赖<\/td>\n<td>Chancellor of the Exchequer<\/td>\n<td>n. 财政大臣<\/td>\n<td>introduce<\/td>\n<td>v. 引入<\/td>\n<\/tr>\n<tr>\n<td>upfront<\/td>\n<td>a. 前期的<\/td>\n<td>work search<\/td>\n<td>n. 求职；找工作<\/td>\n<td>scheme<\/td>\n<td>n. 方案<\/td>\n<\/tr>\n<tr>\n<td>the jobless<\/td>\n<td>n. 失业者<\/td>\n<td>arrive<\/td>\n<td>v. 到达<\/td>\n<td>jobcentre<\/td>\n<td>n. 就业中心<\/td>\n<\/tr>\n<tr>\n<td>CV<\/td>\n<td>n. 简历<\/td>\n<td>register<\/td>\n<td>v. 注册；登记<\/td>\n<td>online<\/td>\n<td>ad. 在线<\/td>\n<\/tr>\n<tr>\n<td>look for work<\/td>\n<td>寻找工作<\/td>\n<td>eligible for<\/td>\n<td>有资格获得……<\/td>\n<td>benef n<tr>\n<td>entitlement<\/td>\n<td>n. 应享权利<\/td>\n<td>insurance<\/td>\n<td>n. 保险；保障<\/td>\n<td>week<\/td>\n<td>n. 周<\/td>\n<\/tr>\n<tr>\n<td>least generous<\/td>\n<td>最不优厚的<\/td>\n<td>EU<\/td>\n<td>n. 欧盟<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h1>\n<h2>逐句逐段分析<\/h2>\n<h2>第1段<\/h2>\n<h3>完整原文 · 第1段<\/h3>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly. What could be more reasonable?<\/p>\n<h3>意群划分 · 第1段<\/h3>\n<p>In order to / &quot;change lives for the better&quot; / and reduce &quot;dependency&quot;, / George Osborne, / Chancellor of the Exchequer, / introduced / the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.<\/p>\n<p>What could be more reasonable?<\/p>\n<h3>意群翻译 · 第1段<\/h3>\n<p>为了 / &quot;让生活变得更好&quot; / 并减少&quot;依赖性&quot;，/ 乔治·奥斯本，/ 财政大臣，/ 引入了 / &quot;前期工作搜寻&quot;计划。<\/p>\n<p>只有当失业者 / 到达就业中心 / 带着简历，/ 注册在线求职，/ 并开始找工作 / 他们才有资格 / 获得救济金 – / 然后他们应该汇报 / 每周 / 而不是每两周。<\/p>\n<p>还有什么能更合理呢？<\/p>\n<h3>标准译文 · 第1段<\/h3>\n<p>为了&quot;让生活变得更好&quot;并减少&quot;依赖性&quot;，财政大臣乔治·奥斯本引入了&quot;前期工作搜寻&quot;计划。失业者只有带着简历到就业中心、注册在线求职并开始找工作，才有资格获得救济金——而且他们必须每周而非每两周汇报一次。还有什么能更合理呢？<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>More apparent reasonableness followed. There will now be a seven-day wait for the jobseeker&#39;s allowance. &quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed. &quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot; Help? Really? On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness. What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>More apparent reasonableness / followed.<\/p>\n<p>There will now be / a seven-day wait / for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days / should be spent / looking for work, / not looking to sign on,&quot; / he claimed.<\/p>\n<p>&quot;We&#39;re doing these things / because we know / they help people / stay off benefits / and help those on benefits / get into work faster.&quot;<\/p>\n<p>Help? / Really?<\/p>\n<p>On first hearing, / this was the socially concerned chancellor, / trying to change lives / for the better, / complete with &quot;reforms&quot; / to an obviously indulgent system / that demands too little effort / from the newly unemployed / to find work, / and subsidises laziness.<\/p>\n<p>What motivated him, / we were to understand, / was his zeal / for &quot;fundamental fairness&quot; – / protecting the taxpayer, / controlling spending / and ensuring / that only the most deserving claimants / received their benefits.<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>更多表面上的合理性 / 随之而来。<\/p>\n<p>现在将有 / 七天的等待期 / 对于求职者津贴。<\/p>\n<p>&quot;最初的几天 / 应该用来 / 找工作，/ 而不是寻求登记领取救济，&quot; / 他声称。<\/p>\n<p>&quot;我们做这些事情 / 因为我们知道 / 它们帮助人们 / 远离救济 / 并帮助那些领取救济的人 / 更快找到工作。&quot;<\/p>\n<p>帮助？/ 真的吗？<\/p>\n<p>乍一听，/ 这是一位关心社会的大臣，/ 试图改变生活 / 使其变得更好，/ 配合&quot;改革&quot; / 对一个明显纵容的系统 / 该系统要求太少努力 / 从新失业者 / 去找工作，/ 并补贴懒惰。<\/p>\n<p>激励他的，/ 我们要理解的是，/ 是他的热情 / 对于&quot;根本的公平&quot; – / 保护纳税人，/ 控制支出 / 并确保 / 只有最值得的申请者 / 获得他们的救济金。<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>更多表面上的合理性随之而来。现在求职者津贴将有七天的等待期。&quot;最初的几天应该用来找工作，而不是寻求登记领取救济，&quot;他声称。&quot;我们做这些事情是因为我们知道它们帮助人们远离救济，并帮助那些领取救济的人更快找到工作。&quot;帮助？真的吗？乍一听，这是一位关心社会的大臣，试图让生活变得更好，配合对一个明显纵容的系统进行&quot;改革&quot;——该系统要求新失业者付出的努力太少，还补贴懒惰。我们要理解的是，激励他的是对&quot;根本公平&quot;的热情——保护纳税人、控制支出并确保只有最值得的申请者获得救济金。<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>Losing a job is hurting: you don&#39;t skip down to the jobcentre with a song in your heart, delighted at the prospect of doubling your income from the generous state. It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get. You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life. Worse, the crucial income to feed yourself and your family and pay the bills has disappeared. Ask anyone newly unemployed what they want and the answer is always: a job.<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>Losing a job / is hurting: / you don&#39;t skip down / to the jobcentre / with a song in your heart, / delighted / at the prospect / of doubling your income / from the generous state.<\/p>\n<p>It is financially terrifying, / psychologically embarrassing / and you know / that support is minimal / and extraordinarily hard to get.<\/p>\n<p>You are now not wanted; / you are now excluded / from the work environment / that offers purpose and structure / in your life.<\/p>\n<p>Worse, / the crucial income / to feed yourself and your family / and pay the bills / has disappeared.<\/p>\n<p>Ask anyone / newly unemployed / what they want / and the answer is always: / a job.<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>失去工作 / 是痛苦的：/ 你不会欢快地跳着 / 去就业中心 / 心中唱着歌，/ 高兴 / 于前景 / 让你的收入翻倍 / 从慷慨的国家。<\/p>\n<p>这在经济上令人恐惧，/ 心理上令人尴尬 / 而且你知道 / 支持是最少的 / 并且极其难以获得。<\/p>\n<p>你现在不被需要；/ 你现在被排除在外 / 从工作环境 / 那提供目标和结构 / 在你的生活中。<\/p>\n<p>更糟的是，/ 关键的收入 / 养活你自己和家人 / 以及支付账单 / 已经消失了。<\/p>\n<p>问任何人 / 新近失业的 / 他们想要什么 / 答案总是：/ 一份工作。<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>失去工作是痛苦的：你不会心中唱着歌欢快地跳着去就业中心，为从慷慨的国家那里让收入翻倍的前景而高兴。这在经济上令人恐惧，心理上令人尴尬，而且你知道支持是最少的，极其难以获得。你现在不被需要；你现在被排除在提供生活目标和结构的工作环境之外。更糟的是，用来养活自己和家人、支付账单的关键收入已经消失了。问任何新近失业的人想要什么，答案总是：一份工作。<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>But in Osborneland, your first instinct is to fall into dependency – permanent dependency if you can get it – supported by a state only too ready to indulge your falsehood. It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens. Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions. Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>But in Osborneland, / your first instinct / is to fall into dependency – / permanent dependency / if you can get it – / supported by a state / only too ready / to indulge your falsehood.<\/p>\n<p>It is as though / 20 years / of ever-tougher reforms / of the job search and benefit administration system / never happened.<\/p>\n<p>The principle / of British welfare / is no longer / that you can insure yourself / against the risk of unemployment / and receive unconditional payments / if the disaster happens.<\/p>\n<p>Even the very phrase / &quot;jobseeker&#39;s allowance&quot; / is about redefining / the unemployed / as a &quot;jobseeker&quot; / who had no fundamental right / to a benefit / he or she has earned / through making national insurance contributions.<\/p>\n<p>Instead, / the claimant receives / a time-limited &quot;allowance,&quot; / conditional on actively seeking a job; / no entitlement / and no insurance, / at £71.70 a week, / one of the least generous / in the EU.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>但在奥斯本的世界里，/ 你的第一本能 / 是陷入依赖 – / 永久的依赖 / 如果你能得到的话 – / 被一个国家支持 / 只是太愿意 / 纵容你的虚假。<\/p>\n<p>就好像 / 20年 / 越来越严格的改革 / 对求职和救济管理系统的 / 从未发生过。<\/p>\n<p>原则 / 英国福利的 / 不再是 / 你可以为自己投保 / 对抗失业风险 / 并获得无条件支付 / 如果灾难发生。<\/p>\n<p>甚至这个短语本身 / &quot;求职者津贴&quot; / 就是关于重新定义 / 失业者 / 作为一个&quot;求职者&quot; / 他没有基本权利 / 对救济金 / 他或她已经赚取的 / 通过缴纳国民保险。<\/p>\n<p>相反，/ 申请者获得 / 一个有时间限制的&quot;津贴&quot;，/ 以积极求职为条件；/ 没有权利 / 也没有保险，/ 每周71.70英镑，/ 最不慷慨之一 / 在欧盟。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>但在奥斯本的世界里，你的第一本能是陷入依赖——如果可能的话是永久依赖——被一个只太愿意纵容你虚假的国家所支持。就好像20年来对求职和救济管理系统越来越严格的改革从未发生过。英国福利的原则不再是你可以为自己投保对抗失业风险，并在灾难发生时获得无条件支付。甚至&quot;求职者津贴&quot;这个短语本身就是要重新定义失业者为&quot;求职者&quot;，他对通过缴纳国民保险而赚取的救济金没有基本权利。相反，申请者获得的是一个有时间限制的&quot;津贴&quot;，以积极求职为条件；没有权利，也没有保险，每周71.70英镑，是欧盟最不慷慨的之一。<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>In order to：(&quot;change lives for the better&quot; + reduce &quot;dependency&quot;) → George Osborne：(Chancellor of the Exchequer) → introduced → the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless：(arrive at the jobcentre：(with a CV) + register for online job search + start looking for work) → will they be eligible：(for benefit) – and then they should report：(weekly // rather than fortnightly).<\/p>\n<p>What could be more reasonable?<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>More apparent reasonableness → followed.<\/p>\n<p>There will now be → a seven-day wait：(for the jobseeker&#39;s allowance).<\/p>\n<p>&quot;Those first few days → should be spent：(looking for work) // not looking to sign on&quot; → he claimed.<\/p>\n<p>&quot;We&#39;re doing these things → because we know：(they help people → stay off benefits + help those on benefits → get into work faster).&quot;<\/p>\n<p>Help? // Really?<\/p>\n<p>On first hearing → this was the socially concerned chancellor：(trying to change lives：(for the better))：(complete with &quot;reforms&quot;：(to an obviously indulgent system：(that demands too little effort：(from the newly unemployed)：(to find work) + subsidises laziness))).<\/p>\n<p>What motivated him：(we were to understand) → was his zeal：(for &quot;fundamental fairness&quot;)：(protecting the taxpayer + controlling spending + ensuring：(that only the most deserving claimants → received their benefits)).<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>Losing a job → is hurting：you don&#39;t skip down：(to the jobcentre)：(with a song in your heart)：(delighted：(at the prospect：(of doubling your income：(from the generous state)))).<\/p>\n<p>It is financially terrifying + psychologically embarrassing + you know：(that support is minimal + extraordinarily hard to get).<\/p>\n<p>You are now not wanted; // you are now excluded：(from the work environment：(that offers purpose and structure：(in your life))).<\/p>\n<p>Worse → the crucial income：(to feed yourself and your family + pay the bills) → has disappeared.<\/p>\n<p>Ask anyone：(newly unemployed)：(what they want) → and the answer is always：a job.<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>But in Osborneland → your first instinct → is to fall into dependency：(permanent dependency：(if you can get it))：(supported by a state：(only too ready：(to indulge your falsehood))).<\/p>\n<p>It is as though：(20 years：(of ever-tougher reforms：(of the job search and benefit administration system))) → never happened.<\/p>\n<p>The principle：(of British welfare) → is no longer：(that you can insure yourself：(against the risk of unemployment) + receive unconditional payments：(if the disaster happens)).<\/p>\n<p>Even the very phrase：&quot;jobseeker&#39;s allowance&quot; → is about redefining：(the unemployed)：(as a &quot;jobseeker&quot;：(who had no fundamental right：(to a benefit：(he or she has earned：(through making national insurance contributions))))).<\/p>\n<p>Instead → the claimant receives → a time-limited &quot;allowance&quot;：(conditional on actively seeking a job); // no entitlement + no insurance：(at £71.70 a week)：(one of the least generous：(in the EU)).<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>为了：(&quot;让生活变得更好&quot; + 减少&quot;依赖性&quot;) → 乔治·奥斯本：(财政大臣) → 引入了 → &quot;前期工作搜寻&quot;计划。<\/p>\n<p>只有当失业者：(到达就业中心：(带着简历) + 注册在线求职 + 开始找工作) → 他们才有资格：(获得救济金) – 然后他们应该汇报：(每周 // 而不是每两周)。<\/p>\n<p>还有什么能更合理呢？<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>更多表面上的合理性 → 随之而来。<\/p>\n<p>现在将有 → 七天的等待期：(对于求职者津贴)。<\/p>\n<p>&quot;最初的几天 → 应该用来：(找工作) // 而不是寻求登记领取救济&quot; → 他声称。<\/p>\n<p>&quot;我们做这些事情 → 因为我们知道：(它们帮助人们 → 远离救济 + 帮助那些领取救济的人 → 更快找到工作)。&quot;<\/p>\n<p>帮助？// 真的吗？<\/p>\n<p>乍一听 → 这是一位关心社会的大臣：(试图改变生活：(使其变得更好))：(配合&quot;改革&quot;：(对一个明显纵容的系统：(该系统要求太少努力：(从新失业者)：(去找工作) + 补贴懒惰)))。<\/p>\n<p>激励他的：(我们要理解的是) → 是他的热情：(对于&quot;根本的公平&quot;)：(保护纳税人 + 控制支出 + 确保：(只有最值得的申请者 → 获得他们的救济金))。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>失去工作 → 是痛苦的：你不会欢快地跳着：(去就业中心)：(心中唱着歌)：(高兴：(于前景：(让你的收入翻倍：(从慷慨的国家))))。<\/p>\n<p>这在经济上令人恐惧 + 心理上令人尴尬 + 你知道：(支持是最少的 + 极其难以获得)。<\/p>\n<p>你现在不被需要；// 你现在被排除在外：(从工作环境：(那提供目标和结构：(在你的生活中)))。<\/p>\n<p>更糟的是 → 关键的收入：(养活你自己和家人 + 支付账单) → 已经消失了。<\/p>\n<p>问任何人：(新近失业的)：(他们想要什么) → 答案总是：一份工作。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>但在奥斯本的世界里 → 你的第一本能 → 是陷入依赖：(永久的依赖：(如果你能得到的话))：(被一个国家支持：(只是太愿意：(纵容你的虚假)))。<\/p>\n<p>就好像：(20年：(越来越严格的改革：(对求职和救济管理系统的))) → 从未发生过。<\/p>\n<p>原则：(英国福利的) → 不再是：(你可以为自己投保：(对抗失业风险) + 获得无条件支付：(如果灾难发生))。<\/p>\n<p>甚至这个短语本身：&quot;求职者津贴&quot; → 就是关于重新定义：(失业者)：(作为一个&quot;求职者&quot;：(他没有基本权利：(对救济金：(他或她已经赚取的：(通过缴纳国民保险)))))。<\/p>\n<p>相反 → 申请者获得 → 一个有时间限制的&quot;津贴&quot;：(以积极求职为条件)；// 没有权利 + 也没有保险：(每周71.70英镑)：(最不慷慨之一：(在欧盟))。<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h2>长难句1 · 第1段第2句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>只有当失业者 / 到达就业中心 / 带着简历，/ 注册在线求职，/ 并开始找工作 / 他们才有资格 / 获得救济金 – / 然后他们应该汇报 / 每周 / 而不是每两周。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把失业者必须完成的三件事并列放在一起：<\/p>\n<blockquote>\n<p>失业者带着简历到就业中心、注册在线求职并开始找工作<\/p>\n<\/blockquote>\n<p>把资格与前面的条件接起来，保留“只有……才……”的限制：<\/p>\n<blockquote>\n<p>只有完成这些事情，才有资格获得救济金<\/p>\n<\/blockquote>\n<p>后半句是在补充领取之后的汇报频率，单独收成一块：<\/p>\n<blockquote>\n<p>然后应该每周汇报，而不是每两周汇报<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>失业者带着简历到就业中心、注册在线求职并开始找工作<br>只有这样才有资格获得救济金<br>然后应该每周而不是每两周汇报<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>失业者只有完成规定的求职行动，才有资格获得救济金；随后还应该按规定汇报。<\/p>\n<\/blockquote>\n<p>先将三项求职行动全部放进“只有”与“才”之间，再把汇报时间接在后面。“每周”与“每两周”必须同时保留，才能看出要求怎样收紧。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>失业者只有带着简历到就业中心、注册在线求职并开始找工作，才有资格获得救济金；然后他们应该每周汇报，而不是每两周汇报。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“然后他们应该”容易读成普通建议，结合已经明确的资格要求，整理成“而且他们必须”。<\/li>\n<li>“每周汇报，而不是每两周汇报”有重复，用“每周而非每两周汇报一次”压缩表达。<\/li>\n<li>三项求职行动不合并删减，“只有……才……”也保留，以免丢掉政策限制。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>失业者只有带着简历到就业中心、注册在线求职并开始找工作，才有资格获得救济金——而且他们必须每周而非每两周汇报一次。<\/p>\n<\/blockquote>\n<h2>长难句2 · 第2段第6句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>On first hearing, / this was the socially concerned chancellor, / trying to change lives / for the better, / complete with &quot;reforms&quot; / to an obviously indulgent system / that demands too little effort / from the newly unemployed / to find work, / and subsidises laziness.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>乍一听，/ 这是一位关心社会的大臣，/ 试图改变生活 / 使其变得更好，/ 配合&quot;改革&quot; / 对一个明显纵容的系统 / 该系统要求太少努力 / 从新失业者 / 去找工作，/ 并补贴懒惰。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把评价发生的阶段与被评价的人说清楚：<\/p>\n<blockquote>\n<p>乍一听，这是一位关心社会的大臣，试图让生活变得更好<\/p>\n<\/blockquote>\n<p>把“改革”接到它针对的对象上：<\/p>\n<blockquote>\n<p>配合对一个明显纵容的系统进行“改革”<\/p>\n<\/blockquote>\n<p>后面两件事都解释系统怎样纵容，放在同一块：<\/p>\n<blockquote>\n<p>这个系统要求新失业者为找工作付出的努力太少，并且补贴懒惰<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>乍一听，这是一位关心社会、试图让生活变得更好的大臣<br>配合对一个明显纵容的系统进行“改革”<br>这个系统要求新失业者为找工作付出的努力太少，并且补贴懒惰<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>乍一听，这位大臣在改善生活，并改革一个纵容的系统。<\/p>\n<\/blockquote>\n<p>开头保留“乍一听”，限定这一评价只是初听时的印象。先说大臣的形象和行动，再补充系统的问题；不要把“要求太少努力”误接成大臣对自己的要求。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>乍一听，这是一位关心社会、试图让生活变得更好的大臣，并配合对一个明显纵容的系统进行“改革”；这个系统要求新失业者为找工作付出的努力太少，并补贴懒惰。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>把较长的“大臣”前说明拆到后面，读者先认清人物，再理解他宣称的行动。<\/li>\n<li>系统的两项问题用破折号引出，明确它们是在解释前面的“纵容”。<\/li>\n<li>“改革”的引号继续保留，不把初听时的表面印象写成作者无保留的赞扬。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>乍一听，这是一位关心社会的大臣，试图让生活变得更好，配合对一个明显纵容的系统进行&quot;改革&quot;——该系统要求新失业者付出的努力太少，还补贴懒惰。<\/p>\n<\/blockquote>\n<h2>长难句3 · 第2段第7句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>What motivated him, / we were to understand, / was his zeal / for &quot;fundamental fairness&quot; – / protecting the taxpayer, / controlling spending / and ensuring / that only the most deserving claimants / received their benefits.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>激励他的，/ 我们要理解的是，/ 是他的热情 / 对于&quot;根本的公平&quot; – / 保护纳税人，/ 控制支出 / 并确保 / 只有最值得的申请者 / 获得他们的救济金。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把中间的提醒放到前面：<\/p>\n<blockquote>\n<p>我们要理解的是<\/p>\n<\/blockquote>\n<p>将“热情”与它指向的原则接起来：<\/p>\n<blockquote>\n<p>激励他的是对“根本公平”的热情<\/p>\n<\/blockquote>\n<p>后面的三项行动都在说明这种公平，按并列关系合并：<\/p>\n<blockquote>\n<p>保护纳税人、控制支出，并确保只有最值得的申请者获得救济金<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>我们要理解的是<br>激励他的是对“根本公平”的热情<br>保护纳税人、控制支出，并确保只有最值得的申请者获得救济金<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>激励他的是对“根本公平”的热情。<\/p>\n<\/blockquote>\n<p>把“我们要理解的是”放在整句前，表示这是在转述被要求接受的解释；再说动机，最后接三项具体内容。“只有”留在救济金领取者前，不能扩展成所有申请者都能领取。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>我们要理解的是，激励他的是对“根本公平”的热情，这种热情体现在保护纳税人、控制支出，以及确保只有最值得的申请者获得救济金。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“这种热情体现在”解释过长，用破折号直接引出三项具体内容。<\/li>\n<li>“以及确保”整理为“并确保”，与前面两项行动连接更紧凑。<\/li>\n<li>保留“根本公平”的引号和开头的转述口气，避免把人物自述写成作者的直接认同。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>我们要理解的是，激励他的是对&quot;根本公平&quot;的热情——保护纳税人、控制支出并确保只有最值得的申请者获得救济金。<\/p>\n<\/blockquote>\n<h2>长难句4 · 第3段第1句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>Losing a job is hurting: you don&#39;t skip down to the jobcentre with a song in your heart, delighted at the prospect of doubling your income from the generous state.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Losing a job / is hurting: / you don&#39;t skip down / to the jobcentre / with a song in your heart, / delighted / at the prospect / of doubling your income / from the generous state.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>失去工作 / 是痛苦的：/ 你不会欢快地跳着 / 去就业中心 / 心中唱着歌，/ 高兴 / 于前景 / 让你的收入翻倍 / 从慷慨的国家。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把“失去工作”的感受说完整：<\/p>\n<blockquote>\n<p>失去工作是痛苦的<\/p>\n<\/blockquote>\n<p>“心中唱着歌”与“欢快地跳着”都描写去就业中心的状态，放在动作前后一起读：<\/p>\n<blockquote>\n<p>你不会心中唱着歌、欢快地跳着去就业中心<\/p>\n<\/blockquote>\n<p>把高兴的原因接成一块，仍放在否定范围里：<\/p>\n<blockquote>\n<p>为从慷慨的国家那里让收入翻倍的前景而高兴<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>失去工作是痛苦的<br>你不会心中唱着歌、欢快地跳着去就业中心<br>为从慷慨的国家那里让收入翻倍的前景而高兴<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>失去工作是痛苦的，你不会高高兴兴地去就业中心。<\/p>\n<\/blockquote>\n<p>先下判断，再用不可能出现的快乐场景解释这一判断。去就业中心的动作、快乐的状态和快乐的原因共同受“不会”限制，不能把后半句另写成失业者真的因收入翻倍而高兴。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>失去工作是痛苦的：你不会心中唱着歌、欢快地跳着去就业中心，并因为想到从慷慨的国家那里让收入翻倍的前景而感到高兴。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“并因为想到……而感到高兴”较拖沓，压缩为“为……的前景而高兴”。<\/li>\n<li>“心中唱着歌欢快地跳着”连写，使动作和心情自然相接。<\/li>\n<li>保留“你不会”以及夸张的快乐场景，准确传达对“失业者乐于领福利”想象的反驳。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>失去工作是痛苦的：你不会心中唱着歌欢快地跳着去就业中心，为从慷慨的国家那里让收入翻倍的前景而高兴。<\/p>\n<\/blockquote>\n<h2>长难句5 · 第4段第1句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>But in Osborneland, your first instinct is to fall into dependency – permanent dependency if you can get it – supported by a state only too ready to indulge your falsehood.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>But in Osborneland, / your first instinct / is to fall into dependency – / permanent dependency / if you can get it – / supported by a state / only too ready / to indulge your falsehood.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>但在奥斯本的世界里，/ 你的第一本能 / 是陷入依赖 – / 永久的依赖 / 如果你能得到的话 – / 被一个国家支持 / 只是太愿意 / 纵容你的虚假。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先限定这是谁想象中的世界，再说其中的失业者：<\/p>\n<blockquote>\n<p>但在奥斯本的世界里，你的第一本能是陷入依赖<\/p>\n<\/blockquote>\n<p>“永久的依赖”是在补充想获得的依赖程度，把可能性限制也放进去：<\/p>\n<blockquote>\n<p>如果可能的话，是永久依赖<\/p>\n<\/blockquote>\n<p>最后说谁支持这种依赖，并把国家的特点放到“国家”前：<\/p>\n<blockquote>\n<p>得到一个太愿意纵容你虚假的国家的支持<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>但在奥斯本的世界里，你的第一本能是陷入依赖<br>如果可能的话，是永久依赖<br>得到一个太愿意纵容你虚假的国家的支持<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>在奥斯本的世界里，你会陷入由国家支持的依赖。<\/p>\n<\/blockquote>\n<p>开头的世界范围必须先交代，防止把这种设想当成作者对失业者的事实判断。再说第一本能，把“如果可能的话，是永久依赖”作为插入说明，最后补充国家怎样支持。这里的条件限定想获得永久依赖的可能性，不能写成一旦陷入依赖就必然永久化。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>但在奥斯本的世界里，你的第一本能是陷入依赖（如果可能的话，是永久依赖），并得到一个只太愿意纵容你虚假的国家的支持。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>将括号中的永久依赖说明改用两道破折号隔开，主线更容易接续。<\/li>\n<li>“如果可能的话，是永久依赖”省去中间逗号，使插入说明读起来更连贯，仍保留可能性限制。<\/li>\n<li>“得到……的支持”调整为“被……所支持”，使末尾继续围绕被描写的失业者展开。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>但在奥斯本的世界里，你的第一本能是陷入依赖——如果可能的话是永久依赖——被一个只太愿意纵容你虚假的国家所支持。<\/p>\n<\/blockquote>\n<h2>长难句6 · 第4段第4句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Even the very phrase / &quot;jobseeker&#39;s allowance&quot; / is about redefining / the unemployed / as a &quot;jobseeker&quot; / who had no fundamental right / to a benefit / he or she has earned / through making national insurance contributions.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>甚至这个短语本身 / &quot;求职者津贴&quot; / 就是关于重新定义 / 失业者 / 作为一个&quot;求职者&quot; / 他没有基本权利 / 对救济金 / 他或她已经赚取的 / 通过缴纳国民保险。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把短语名称与“短语本身”合并：<\/p>\n<blockquote>\n<p>甚至“求职者津贴”这个短语本身<\/p>\n<\/blockquote>\n<p>把重新定义的对象和新身份接起来：<\/p>\n<blockquote>\n<p>要把失业者重新定义为“求职者”<\/p>\n<\/blockquote>\n<p>后半句先说救济金怎样得到，再说这种新身份没有什么权利：<\/p>\n<blockquote>\n<p>他对通过缴纳国民保险而赚取的救济金没有基本权利<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>甚至“求职者津贴”这个短语本身<br>要把失业者重新定义为“求职者”<br>他对通过缴纳国民保险而赚取的救济金没有基本权利<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>这个短语把失业者重新定义为没有基本救济权利的“求职者”。<\/p>\n<\/blockquote>\n<p>先说明名称在重新定义身份，再接这种身份的权利变化。把“通过缴纳国民保险而赚取的”放在“救济金”前，明确以前的缴费与现在失去的权利指向同一笔保障。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>甚至“求职者津贴”这个短语本身，就是要把失业者重新定义为“求职者”；这个求职者对自己通过缴纳国民保险而赚取的救济金没有基本权利。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“要把失业者重新定义为”整理为“要重新定义失业者为”，保持短语层次紧凑。<\/li>\n<li>后半句的“这个求职者”换成“他”，减少身份名称的重复。<\/li>\n<li>保留“没有基本权利”与此前缴费取得救济金的对照，不能淡化成暂时不方便领取。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>甚至&quot;求职者津贴&quot;这个短语本身就是要重新定义失业者为&quot;求职者&quot;，他对通过缴纳国民保险而赚取的救济金没有基本权利。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>25题<\/h2>\n<p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>作者最可能同意以下哪一项？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Unemployment benefits should not be made conditional.<\/strong><\/p>\n<p>失业补助不应附加条件。<\/p>\n<p>B. <strong>The British welfare system indulges jobseekers’ laziness.<\/strong><\/p>\n<p>英国福利制度纵容求职者懒惰。<\/p>\n<p>C. <strong>The jobseekers’ allowance has met their actual needs.<\/strong><\/p>\n<p>求职者补助已经满足了他们的实际需要。<\/p>\n<p>D. <strong>Osborne’s reforms will reduce the risk of unemployment.<\/strong><\/p>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍奥斯本的求职计划：领补助前必须带简历、网上登记并开始求职，之后每周报到<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>继续列出七天等待和“帮助就业”的说法，随后转而追问其动机并落到纳税人和开支<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>详细写失业带来的经济恐惧、心理难堪、工作身份丧失以及基本收入消失<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>批评奥斯本把失业者想成依赖者，并指出福利从保险权利变成附条件、限时且很低的补助<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<h3>A. Unemployment benefits should not be made conditional.<\/h3>\n<p>失业补助不应附加条件。<\/p>\n<h4>如果 A 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>失业补助不应附加条件。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍把提交简历、开始求职设为领补助前提，并要求领取后定期报到的新安排，呈现其鼓励就业的合理外观，为讨论这些附加条件是否正当提出具体对象。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“帮助失业者”的说法，说明增设等待期和申领门槛主要方便控制给付，却不能据此取消失业者原本享有的保险保障。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>把收入骤失、维持家庭开支的压力和领取支持的困难放在这些门槛旁边，说明真正需要保障的人不应先证明自己足够值得帮助。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>归结为福利性质的变化：原先为失业风险提供保障的保险权利，已经被改成附条件给付；因此应反对把失业补助这样条件化。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>第一段确实先列出领取补助的求职条件；第二段的<code>Help? Really?<\/code>和纳税人、开支说明，又拆开了“帮助失业者”的外观。第三段写收入消失、支持少且难拿，让读者看到这些条件落在怎样的人身上。结尾更直接把<code>unconditional payments<\/code>与<code>conditional on actively seeking a job<\/code>相对照，批评保险权利被改成限时、附条件的补助。A的主张正好落在这条由政策外观走向权利变化的推进上。<\/p>\n<p>这里的“不应附加条件”针对文中把原有失业保险权利变成求职表现前提的做法；不需要再推成作者否认任何申请资格或行政程序。<\/p>\n<p>判断：<\/p>\n<p><strong>A 保留。<\/strong><\/p>\n<p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<h3>B. The British welfare system indulges jobseekers’ laziness.<\/h3>\n<p>英国福利制度纵容求职者懒惰。<\/p>\n<h4>如果 B 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>英国福利制度纵容求职者懒惰。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍一项以补助配合求职登记、看似能够促人就业的新安排，让读者看到福利制度对外宣称鼓励求职的面貌。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“补助促人就业”的表面说法，说明制度仍让持续领取补助比努力求职更有吸引力，从而把保障生活变成了纵容懒惰。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>用有合适岗位却不愿申请、靠补助维持闲居的求职者处境，对照制度宣称的就业激励，具体呈现福利纵容不求职行为的结果。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>总结原先所说的临时帮助人重返工作，已经变成对长期不愿求职的容忍；制度虽然仍称鼓励就业，其实际作用却是纵容懒惰。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>B需要第三段真的写出求职者不愿工作、领取补助很舒适，末段再由作者认定福利鼓励懒惰。实际第三段却否认失业者会高高兴兴去领钱，写出的是经济恐惧、心理难堪和“想要一份工作”。第四段把“本能就是依赖”的想象放在<code>Osborneland<\/code>中，随即批评无条件保险权利消失。第二段确实有<code>subsidises laziness<\/code>，但它属于作者正在拆解的政府说法。B把被质疑的说法当成了作者要维护的判断。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<h3>C. The jobseekers’ allowance has met their actual needs.<\/h3>\n<p>求职者补助已经满足了他们的实际需要。<\/p>\n<h4>如果 C 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>求职者补助已经满足了他们的实际需要。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍一项重新安排求职者补助额度与发放流程的措施，呈现其既管理求职又保障基本生活的合理外观。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“补助足以生活”的表面说法，逐项核对金额、到账时间与开支项目，说明充足保障具体落实在食品、住房和家庭账单上。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>把失业者真实的食宿、赡养和日常支出与实际收到的补助并列，展示这些需求已由给付覆盖，而非只看名义上的补助金额。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>总结补助从过去只能缓解部分压力，变成现已覆盖求职者实际需要的保障；对补助不足的旧判断应随着这种变化修正。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>C的关键不是补助有没有存在，而是它已经满足实际需要。实际第三段说<code>support is minimal and extraordinarily hard to get<\/code>，随后又写维持家庭生活的收入已经消失；结尾还说每周71.70英镑是欧盟最不慷慨的给付之一。这些段落共同解释现有保障为什么不足以让人安心，不能支持“已经满足”的结论。第一、二段谈条件和等待期，也不是在证明这些安排已经覆盖全部现实需求。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<h3>D. Osborne’s reforms will reduce the risk of unemployment.<\/h3>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<h4>如果 D 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍奥斯本把求职辅导、岗位匹配和就业跟踪结合起来的新安排，呈现改革能够让劳动者更不容易陷入失业的合理设想。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“改革会降低失业风险”的口号，说明岗位匹配和就业跟踪如何提前识别工作不稳定的环节，并减少劳动者随后失去工作的可能。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>把接受改革服务和未接受服务的相似劳动者就业稳定性作对照，呈现前者随后失去工作的概率较低，以现实结果支撑风险下降。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>总结制度由失业发生后的被动给付，变成能够在事前降低失业概率的就业支持；原先只补偿失业后果的做法已变成预防风险。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D要求文章追踪改革对失业风险的影响，关键证据应是求职支持怎样减少失业及其实际效果。第一、二段虽然引用政府“更快就业”的理由，却马上用<code>Help? Really?<\/code>质疑；第三段写的是失业者眼下的痛苦，没有比较改革前后的风险。结尾的<code>insure yourself against the risk of unemployment<\/code>说的是为失业后果提供保险，不是让失业本身更少发生。作者最终批评保障权利被收紧，并未预测奥斯本的改革会降低失业风险。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<h3>25题结论<\/h3>\n<p><strong>25. A. Unemployment benefits should not be made conditional.<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Unemployment benefits should not be made conditional. / 失业补助不应附加条件。<\/strong><\/p>\n<h2>21题<\/h2>\n<blockquote>\n<p>George Osborne’s scheme was intended to ______.<\/p>\n<p>乔治·奥斯本的计划旨在做什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部目的题。题干锁定奥斯本的计划，问政策打算推动失业者做什么；需要区分政策的行动目标、具体执行手续，以及作者对政策是否合理的评价。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<p>第一句的<code>In order to<\/code>交代宣称的目的，第二句列出带简历、网上登记、开始求职和定期报到等具体要求。它们一起说明方案如何促使求职者采取行动，但没有证明方案已经产生就业效果。<\/p>\n<h3>A. motivate the unemployed to report voluntarily<\/h3>\n<blockquote>\n<p>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>report voluntarily<\/code>完整可见，原文也能读到<code>Only if<\/code>列出的求职条件和<code>report weekly<\/code>；虽然<code>fortnightly<\/code>显示为<code>[xxx]<\/code>，仍能看出报到是要求，第一轮就排除了A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的<code>report<\/code>，把政策规定的后续报到改成了<code>report voluntarily<\/code>，即自愿报到。计划借补助资格推动求职，不能用其中一项必须履行的报到手续，改写成鼓励自愿报到的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在促使失业者自愿报到。<\/p>\n<\/blockquote>\n<p>题干的<code>scheme<\/code>指第一段的<code>upfront work search<\/code>计划；A中的<code>report<\/code>对应第二句后半部分的<code>they should report weekly rather than fortnightly<\/code>。这里要比较的是报到怎样被安排，而不是只看两处有没有同一个动词。<\/p>\n<p>前半句先用<code>Only if<\/code>列出获得补助资格的必要条件，后半句用<code>and then<\/code>接上每周报到要求。主语始终是申请补助的失业者，报到频率由计划规定；<code>should<\/code>在这项政策描述里表达他们应当履行的事项。<\/p>\n<p>A增加的<code>voluntarily<\/code>改变了行为的性质。原文要求申请者按规定报到，没有把自愿到场设为政策目的；重复<code>report<\/code>不能保留这层区别。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>领补助先要满足求职要求，之后还应按每周一次的频率报到。<\/p>\n<\/blockquote>\n<p>作者从资格条件接着写办理者必须遵守的频率，呈现的是一套连续的政策约束。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme encourages the unemployed to report voluntarily, without making regular reports a condition of receiving benefit.<\/p>\n<p>这项计划鼓励失业者自愿报到，而不把定期报到作为领取补助的条件。<\/p>\n<\/blockquote>\n<p>A成立时需要把“规定应怎样报到”改成“鼓励但由本人自愿报到”。实际句子用<code>should report weekly rather than fortnightly<\/code>收紧频率，没有转向自愿选择。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>motivate the unemployed to report voluntarily<br>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p>主旨批评补助被条件化，与第一段所列的要求能够衔接；A却把其中的报到要求说成自愿行为。本项最终仍要根据<code>they should report weekly rather than fortnightly<\/code>判断行为性质，主旨本身不能告诉我们规定的报到频率。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. provide the unemployed with easier access to benefits<\/h3>\n<blockquote>\n<p>让失业者更容易获得补助<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时能读到带简历、网上登记、开始求职以及每周报到这一组条件；把它们与<code>easier access to benefits<\/code>相比，发现不是领取更容易，第一轮就排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B保留了补助这个对象，却把政策设置求职前提的方向改成让人更容易领取。第一段的<code>Only if<\/code>在限定资格，不是在承诺简化申领或扩大可领取范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在让失业者更容易获得补助。<\/p>\n<\/blockquote>\n<p>B的<code>access to benefits<\/code>对应原文<code>eligible for benefit<\/code>，两处都涉及能否领取补助；决定方向的是原文放在它前面的<code>Only if<\/code>及其控制的一组行为。<\/p>\n<p>失业者必须先带简历到就业中心、网上登记并开始找工作，才有资格；之后还要每周而非每两周报到。句子没有说只需少做手续，也没有承诺更多人因此获得补助。<\/p>\n<p>因此，B把“满足前置要求才有资格”换成“更容易进入补助体系”。<code>easier<\/code>需要门槛降低或办理简化的依据，这组原句给出的却是资格约束。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>第二段继续列出七天等待期，并要求最初几天找工作，不要忙着申领补助。<\/p>\n<\/blockquote>\n<p>第一段的前置求职要求之后，作者再列出推迟申领的安排，补助入口继续受限。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme removes preliminary requirements and shortens the wait so that the unemployed can obtain benefits more easily.<\/p>\n<p>这项计划取消前置要求、缩短等待，让失业者能够更容易拿到补助。<\/p>\n<\/blockquote>\n<p>B所需的后文应呈现获取补助变容易的具体措施。实际后文选择七天等待和先找工作的要求，说明政策优先推动求职，没有沿着方便领钱的路线推进。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>provide the unemployed with easier access to benefits<br>让失业者更容易获得补助<\/p>\n<\/blockquote>\n<p>作者反对补助被设更多前提，B却把这项政策描述成方便失业者获取补助，政策方向不一致。具体条件仍须看<code>Only if<\/code>和七天等待期；不能仅凭作者反对改革，就推断改革的任何一个细节都更严。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. encourage jobseekers’ active engagement in job seeking<\/h3>\n<blockquote>\n<p>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>engagement<\/code>显示为<code>[xxx]<\/code>，但<code>active<\/code>和<code>job seeking<\/code>可见，原文<code>start looking for work<\/code>也能读懂。做题材料据此把C理解为推动积极求职，第一轮留下C，其他三项排除后确定了C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>engagement in<\/code>表示参与，<code>active engagement in job seeking<\/code>就是积极投入求职。它把带简历、登记网上求职和开始找工作这一组要求概括为主动参与求职，没有把计划的目标扩大为保证就业成功。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在鼓励求职者积极参与求职。<\/p>\n<\/blockquote>\n<p>题干问计划的目的，第一句的<code>In order to<\/code>先给出改善生活、减少依赖的宣称，第二句的<code>start looking for work<\/code>说明计划打算让求职者采取怎样的具体行动。C的<code>job seeking<\/code>与这个动作相对应。<\/p>\n<p>第一句确定政策想减少对补助的依赖，第二句把实际求职放在领补助之前，并辅以简历、网上登记和定期报到。把这两句接起来，措施是在促使申请者投入寻找工作的过程。<\/p>\n<p>C准确概括这项行动目标。<code>encourage<\/code>在这里说政策推动人去做什么，不表示参加完全自愿，也不表示作者赞成这些手段；<code>job seeking<\/code>同样不等于已经找到工作。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>前文把求职设为条件，后文又引用政府希望领补助者更快就业的说明。<\/p>\n<\/blockquote>\n<p>政策的具体做法和政府解释，都把申请者由领取补助引向实际寻找工作；作者随后质疑的是这种安排能否算帮助。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By requiring a CV, online registration and an active search for work, the scheme aims to increase jobseekers’ participation in job seeking.<\/p>\n<p>通过要求提交简历、网上登记和实际找工作，这项计划旨在提高求职者参与求职的程度。<\/p>\n<\/blockquote>\n<p>C需要的写法与原文措施能够接上：用前置求职要求推动行动，再以更快就业解释目标。承认政策有这一目标，并不等于认定它已实现目标或值得支持。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>encourage jobseekers’ active engagement in job seeking<br>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p>主旨针对的是把积极求职变成领补助前提这件事；C说政府借这套安排推动求职，能说明作者批评的条件是什么。本项具体目的由<code>start looking for work<\/code>及政府的就业说明支持，不能把“作者反对手段”误读成“政府没有推动求职的意图”。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<h3>D. guarantee jobseekers’ legitimate right to benefits<\/h3>\n<blockquote>\n<p>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>legitimate right to benefits<\/code>与<code>eligible for benefit<\/code>相比，读到<code>Only if<\/code>限制资格，判断该计划在要求申请者满足条件，而不是保障既有补助权利，第一轮排除了D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了领取补助资格这个话题，将对资格施加要求写成保障求职者的正当权利。<code>legitimate right<\/code>本身并不等于“无条件权利”；本项的问题在于，作者描述的这套改革正在收紧和改变既有权利，而不是以保障它为目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在保障求职者获得补助的正当权利。<\/p>\n<\/blockquote>\n<p>D的<code>right to benefits<\/code>与第一段<code>eligible for benefit<\/code>都涉及补助领取，但它们所说的关系不同：前者强调得到权利保障，后者在<code>Only if<\/code>后说明满足条件才取得资格。末段则明确讨论这种权利发生了什么变化。<\/p>\n<p>第一段的主体是接受条件约束的失业者。末段从<code>unconditional payments<\/code>转到<code>conditional on actively seeking a job<\/code>，再用<code>no entitlement and no insurance<\/code>评价变化，说明作者认为原有保障被削弱。<\/p>\n<p>D把“限制并重定义补助资格”改写成“保障正当权利”，政策作用方向发生了变化。不是看到<code>benefit<\/code>与<code>right<\/code>属于同一话题就能认为两句话同义。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<p>末段从失业保险的无条件给付，写到附条件、限时且没有保险权利保障的补助。<\/p>\n<\/blockquote>\n<p>作者在结尾解释改革怎样改变福利的性质，评价落点是权利的退缩。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme preserves the unemployed’s entitlement to benefits and protects the insurance rights they have earned through their contributions.<\/p>\n<p>这项计划保留失业者领取补助的权利，并保障他们缴费取得的保险权利。<\/p>\n<\/blockquote>\n<p>D成立时，结尾应说明既有权利如何被保留；实际却写<code>no entitlement and no insurance<\/code>。这里对比的是改革怎样对待既有保障，不需要把任何“正当权利”一概解释成没有资格条件。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>guarantee jobseekers’ legitimate right to benefits<br>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p>作者主张不应把失业补助条件化，正是因为文中改革把原有保险权利改成需要不断满足要求的给付。D将作者所批评的权利变化，写成政策主动保障权利；末段的<code>no entitlement and no insurance<\/code>进一步否定这种描述。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>21题结论<\/h3>\n<blockquote>\n<p><strong>21. C. encourage jobseekers’ active engagement in job seeking<\/strong><\/p>\n<\/blockquote>\n<p>A借用报到要求，却把政策规定的行为换成自愿报到。<\/p>\n<p>B借用补助资格，却把设置求职门槛写成领取更容易。<\/p>\n<p>C把简历、登记和实际找工作的要求概括为推动积极求职。<\/p>\n<p>D借用补助权利话题，却把文中收紧和重定义资格的改革写成保障权利。<\/p>\n<h2>22题<\/h2>\n<blockquote>\n<p>The phrase “to sign on” (Para. 2) most probably means ______.<\/p>\n<p>第二段中的“to sign on”最可能是什么意思？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道语义理解题。题干已限定第二段，要根据短语前后的对象和对照关系，判断<code>to sign on<\/code>在这里表示哪种办理行为；不能只套用一般的登记或签字含义。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<\/blockquote>\n<p>前一句提供求职者补助这一对象，<code>Those first few days<\/code>承接七天等待期，引语把找工作与<code>sign on<\/code>区分；后一句又回到<code>benefits<\/code>和就业。这几句共同限定了短语的意思。<\/p>\n<h3>A. to register for an allowance from the government<\/h3>\n<blockquote>\n<p>向政府登记申领补助<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项里的<code>allowance<\/code>显示为<code>[xxx]<\/code>，但<code>register for<\/code>可见，前一句也完整出现<code>jobseeker’s allowance<\/code>。做题时把登记动作与紧邻的补助话题接起来，第一轮留下A，排除其余三项后确定A。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>A把语境中的<code>sign on<\/code>展开成登记申领政府补助。前一句提供申领对象，后一句把这项行为与寻找工作相对照；这里不是泛指在任何地方登记姓名。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是指向政府登记申领补助。<\/p>\n<\/blockquote>\n<p>题干锁定第二段的<code>to sign on<\/code>。短语前一句是<code>a seven-day wait for the jobseeker’s allowance<\/code>，接着<code>Those first few days<\/code>沿用这段等待时间，因此要在补助申领的语境里理解它。<\/p>\n<p>前一句交代现在领求职者补助要等七天；引语要求这几天用于<code>looking for work<\/code>，而不是<code>looking to sign on<\/code>。后一句再对举不领补助与领补助者就业，继续围绕补助领取和求职两件事展开。<\/p>\n<p>A的<code>register for an allowance<\/code>准确说明了后一项行为。<code>from the government<\/code>也与国家福利语境一致；它没有把“登记申领”夸大成登记后马上拿到钱。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>作者先交代补助等待期，再引出“先找工作，不要忙着登记”，随后仍谈减少领补助和更快就业。<\/p>\n<\/blockquote>\n<p>这几句沿着补助申领与寻找工作的对照推进，登记的对象并未换成岗位或培训。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Those first few days should be spent looking for work, not registering to claim the jobseeker’s allowance.<\/p>\n<p>最初几天应该用来找工作，而不是登记申领求职者补助。<\/p>\n<\/blockquote>\n<p>把<code>sign on<\/code>换成A以后，七天等待的补助对象、政府要求暂缓的行为和随后谈到的<code>benefits<\/code>都能自然接上，前后关系保持不变。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>to register for an allowance from the government<br>向政府登记申领补助<\/p>\n<\/blockquote>\n<p>本项最终仍要根据<code>a seven-day wait for the jobseeker’s allowance<\/code>与<code>not looking to sign on<\/code>这处局部原文判断。主旨能解释作者为什么在意申领限制，却不能凭空给出短语的词义；相邻句中补助与登记的联系支持A。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<h3>B. to accept the government’s restrictions on the allowance<\/h3>\n<blockquote>\n<p>接受政府对补助的限制<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整可见。做题时比较了<code>accept the government’s restrictions<\/code>与最初几天准备去<code>sign on<\/code>的具体办理动作，认为前者换成接受规则，第一轮排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了本文确实存在的补助限制，把申领补助这一动作改成接受限制。有人办理申领可能需要遵守规则，但“办理申领”的词义不因此等于“接受政府的限制”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是指接受政府对补助的限制。<\/p>\n<\/blockquote>\n<p>B的<code>restrictions on the allowance<\/code>能让人想到前一句的七天等待期；但题干问的不是这项政策有什么要求，而是<code>to sign on<\/code>在“最初几天该做什么”的句子里表示哪种行为。<\/p>\n<p>原文先说补助有等待期，再说应该花时间找工作，不要忙着<code>sign on<\/code>。前者是政策规则，后者是被要求暂缓的申领动作。限制作用于申领者，不是申领动作本身的同义解释。<\/p>\n<p>B将“登记申领这项补助”换成“接受针对这项补助的限制”，改变了动词所表达的关系。规则与办理有关，仍不能互换为同一个意思。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>引语把最初几天用于找工作与用于申领补助分开，下一句仍谈怎样让人减少领补助、加快就业。<\/p>\n<\/blockquote>\n<p>这段在安排求职和领补助的先后，并没有把问题转向失业者是否同意政府的规则。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Those first few days should be spent looking for work, not deciding whether to accept the government’s restrictions on the allowance.<\/p>\n<p>最初几天应该用来找工作，而不是决定是否接受政府对补助的限制。<\/p>\n<\/blockquote>\n<p>B代入后，句子的第二项变成对规则作出接受与否的决定，后文便需要围绕这种态度或承诺解释。实际后文继续写领取补助与就业，没有发生这个转向。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>to accept the government’s restrictions on the allowance<br>接受政府对补助的限制<\/p>\n<\/blockquote>\n<p>全文确实反对给补助附条件，所以B的“限制”很贴近文章话题；但主旨不能把任何相关行为都解释成接受限制。本项最终仍要根据<code>not looking to sign on<\/code>前后的补助申领对照判断，B把动作本身换成了对规则的接受。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. to check on the availability of jobs at the jobcentre<\/h3>\n<blockquote>\n<p>到就业中心查询有没有工作岗位<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时能读出<code>looking for work, not looking to sign on<\/code>的对照。做题材料将C的查岗位归入找工作一边，认为它不能再解释被对举的另一件事，第一轮排除了C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了第一段的就业中心与第二段的求职话题，却把<code>sign on<\/code>解释成查找岗位。原句正在区分求职与办理补助，C把两件事重新混在一起。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是指到就业中心查询有没有工作岗位。<\/p>\n<\/blockquote>\n<p><code>availability of jobs<\/code>指有没有可供申请的岗位，属于<code>looking for work<\/code>的活动；题干的<code>sign on<\/code>却出现在<code>not<\/code>之后，与前面的求职活动形成对照。<\/p>\n<p>相邻句先给出求职者补助这一对象，再要求最初几天去找工作而不要申领补助。<code>jobcentre<\/code>出现在前一段，只说明失业者办理事务的地点，不会自动把这个地点内的每种行为都变成查岗位。<\/p>\n<p>C把原文对举中的“办理补助”改成“查找工作”。若这样解释，作者区分求职与领补助的关系就被抹掉，七天补助等待期也失去对短语的解释作用。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>原文以补助等待期为背景，让最初几天先用于求职，暂不用于申领补助。<\/p>\n<\/blockquote>\n<p>句子的重点是两种用途不同：寻找工作与办理给付。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Those first few days should be spent looking for work, including checking the availability of jobs at the jobcentre.<\/p>\n<p>最初几天应该用来找工作，其中包括到就业中心查询岗位。<\/p>\n<\/blockquote>\n<p>若C是这里的含义，查岗位本应作为求职的具体方式接在后面。实际句子用<code>not<\/code>排开另一项行为，又以前一句的补助限定它，写法与“包括查岗位”不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>to check on the availability of jobs at the jobcentre<br>到就业中心查询有没有工作岗位<\/p>\n<\/blockquote>\n<p>主旨只能提示我们关注求职要求与补助权利的关系，不能直接解释<code>sign on<\/code>。本项最终仍要根据<code>looking for work, not looking to sign on<\/code>和紧邻的补助名词判断；C所说查岗位属于前一活动，不能替代后一活动。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. to attend a governmental job-training program<\/h3>\n<blockquote>\n<p>参加政府就业培训项目<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可见。原文这一处讲求职、等待期和补助，做题时没有找到就业培训项目的依据，因此第一轮就排除了D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D利用政府、就业中心和找工作这些背景，引出常见的就业培训联想。可是这几句没有写培训课程或参与项目，不能把同属就业服务的活动补进<code>sign on<\/code>的含义。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是指参加政府就业培训项目。<\/p>\n<\/blockquote>\n<p>D中决定含义的是<code>attend<\/code>与<code>job-training program<\/code>。第二段定位句前后的具体对象则是<code>jobseeker’s allowance<\/code>和<code>work<\/code>，没有项目名称或训练内容。<\/p>\n<p>七天是申领补助的等待时间，不是培训的学时；最初几天被要求用于找工作，也没有说等待者要参加课程。政府提供就业服务这一背景，不能补出一个正在组织的培训项目。<\/p>\n<p>D在原文现有的申领与求职之外，增加了“参加政府培训”的完整动作。缺少的不是某个同义词，而是整项活动的依据。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>段落谈等待补助、先去求职以及政府宣称这能加快就业，始终没有转向培训安排。<\/p>\n<\/blockquote>\n<p>后文用领取补助者更快就业解释政策，没有用参加课程来解释短语。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Here, signing on means attending a government job-training course during the first few days of unemployment.<\/p>\n<p>这里的signing on指在刚失业的几天参加政府就业培训课程。<\/p>\n<\/blockquote>\n<p>D成立至少需要把培训课程明确设为短语指代的活动。实际句子提供的最近对象是补助，随后也持续围绕补助与工作，不能从政策背景补出一门课程。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>to attend a governmental job-training program<br>参加政府就业培训项目<\/p>\n<\/blockquote>\n<p>主旨并不负责规定政府提供哪一种就业服务。本项最终仍要根据<code>jobseeker’s allowance<\/code>与<code>sign on<\/code>的邻接语境判断；D中的培训项目既不是主旨提供的信息，也不是这几句所写的活动。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>22题结论<\/h3>\n<blockquote>\n<p><strong>22. A. to register for an allowance from the government<\/strong><\/p>\n<\/blockquote>\n<p>A结合补助等待期与前后对照，准确把短语解释为登记申领政府补助。<\/p>\n<p>B把具体申领动作改成接受政府限制。<\/p>\n<p>C把与求职对举的申领补助，重新解释成求职中的查岗位。<\/p>\n<p>D借用就业服务背景，补出了文中没有的培训项目。<\/p>\n<h2>23题<\/h2>\n<blockquote>\n<p>What prompted the chancellor to develop his scheme?<\/p>\n<p>是什么促使财政大臣制定这一计划？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部原因题，问财政大臣制定方案的推动力。<code>What motivated him<\/code>是直接的动机说明，但前面还有“改善生活”的表面理由，需要连同<code>On first hearing<\/code>及作者的质疑一起读，区分政府形象、政策理由和作者立场。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Help? Really?<\/p>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<p>前一长句是初听政策时产生的关心社会的印象；动机句则用破折号说明<code>fundamental fairness<\/code>具体保护谁、控制什么。题干问的是大臣为何制定方案，不是作者为什么反对方案。<\/p>\n<h3>A. A desire to secure a better life for all.<\/h3>\n<blockquote>\n<p>希望让所有人过上更好的生活。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>better<\/code>显示为<code>[xxx]<\/code>，但<code>life for all<\/code>与原文<code>change lives for the better<\/code>能够接上。做题材料注意到<code>On first hearing<\/code>可能只是在写表面印象，却没有马上排除A，第一轮留下A、D；25题主旨确定后，才把改善生活的宣传与后面的动机说明分开，排除A、选择D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A不是凭空编造“改善生活”：这句话确实出现在政策宣传和<code>On first hearing<\/code>引出的形象中。命题人把作者暂时转述的表面理由，改成题干要找的政策推动力，还将其对象概括成<code>for all<\/code>。决定性问题是这层话语身份被换掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants re
