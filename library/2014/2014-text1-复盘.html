ceived their benefits.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>促使财政大臣制定这项计划的是让所有人过上更好生活的愿望。<\/p>\n<\/blockquote>\n<p>题干<code>prompted<\/code>与第二段<code>What motivated him<\/code>直接对应。A的<code>a better life<\/code>又与更前面的<code>change lives for the better<\/code>相似，因此需要比较这两处各自承担的作用。<\/p>\n<p><code>On first hearing<\/code>限定了前一幅形象：初听时，大臣仿佛关心社会、要改善生活。段内的<code>Help? Really?<\/code>已经发出质疑；后面的动机句再把<code>fundamental fairness<\/code>解释为保护纳税人、控制开支和筛选申请者。<\/p>\n<p>A取了前面的改善生活说法，却没有保留作者对它的距离，把表面宣传当作此处最终交代的动机。后句所解释的利益对象是纳税人，不是A所说的所有人。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>作者交代纳税人公平与控制开支的理由后，转而写失业者经济恐惧、心理难堪及支持少又难拿。<\/p>\n<\/blockquote>\n<p>这个转向是在用失业者的实际处境检验“改善生活”的外观，而不是继续证明政策让所有人过得更好。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>What motivated him was a desire to improve life for everyone, with the scheme easing hardship for the newly unemployed.<\/p>\n<p>推动他的是改善每个人生活的愿望，这项计划也在减轻新失业者的困难。<\/p>\n<\/blockquote>\n<p>A所需的推进应把普遍改善生活认定为动机，再说明它怎样落到失业者身上。实际动机句指向保护纳税人，随后呈现的是失业者困境；这正是做题时A、D需要进一步分开的地方。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把失业补助条件化，不能单凭这一点认定财政大臣的具体动机；还要区分文中的公开形象与明确的动机说明。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>A desire to secure a better life for all.<br>希望让所有人过上更好的生活。<\/p>\n<\/blockquote>\n<p>主旨不能单独读出一个人的动机，但它解释了作者为什么先摆出“关心失业者”的形象，再揭示政策的另一套理由。本项最终仍要根据<code>On first hearing<\/code>与<code>What motivated him<\/code>判断：前者引出的改善生活说法是被质疑的外观，后者才明确落到纳税人公平。A把两者的层次合并了。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. An eagerness to protect the unemployed.<\/h3>\n<blockquote>\n<p>热切希望保护失业者。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>protect the unemployed<\/code>和原文<code>protecting the taxpayer<\/code>都能完整读到。做题时核对保护对象，发现B换成了失业者，第一轮排除B，后来A、D回查没有改变这一状态。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用<code>protecting<\/code>这一动作，把原文的对象<code>the taxpayer<\/code>替换成<code>the unemployed<\/code>。两类人现实中可以有身份重叠，但在本段的政策解释中分别承担出资者与补助申请者的角色，不能互换。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>促使财政大臣制定这项计划的是热切保护失业者的愿望。<\/p>\n<\/blockquote>\n<p><code>prompted the chancellor<\/code>对应<code>What motivated him<\/code>，B的<code>protect<\/code>则对应破折号后的<code>protecting<\/code>。同一个动作出现时，更要追着它的宾语看是谁受到保护。<\/p>\n<p>动机句先说对根本公平的热情，再用保护纳税人、控制开支、限定领取者说明这份公平的内容。原句没有在此把保护失业者列为动机。<\/p>\n<p>B保留了“保护”的动作，却改换了该动作的政策对象。问题不在于失业者是否值得保护，而在于题干问大臣的动机，必须沿用原句明确写出的对象。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<p>文章先写保护纳税人、控制开支，随后写失业者养家和支付账单的收入消失。<\/p>\n<\/blockquote>\n<p>作者将政策强调的纳税人利益与失业者遭遇并置，让读者看到后者需要的保障没有成为这套解释的中心。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>What motivated him was an eagerness to protect the unemployed by securing the income they need after losing their jobs.<\/p>\n<p>推动他的是保护失业者的热切愿望，具体做法是保障他们失去工作后所需的收入。<\/p>\n<\/blockquote>\n<p>若B成立，动机解释应围绕怎样保护失业者免受收入骤失的冲击展开。实际解释围绕纳税人和开支，下一段的收入消失又作为批评依据出现，两条路线的保护对象不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把失业补助条件化，不能单凭这一点认定财政大臣的具体动机；还要区分文中的公开形象与明确的动机说明。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>An eagerness to protect the unemployed.<br>热切希望保护失业者。<\/p>\n<\/blockquote>\n<p>作者主张失业者的保险权利不应被条件化，不等于大臣推出方案时也在以保护失业者为动机。本项最终仍要根据<code>protecting the taxpayer<\/code>判断；B把作者关切的人群，移到了政策动机的保护对象上。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. An urge to be generous to the claimants.<\/h3>\n<blockquote>\n<p>迫切希望对补助申请者慷慨一些。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时看到原文<code>controlling spending<\/code>和<code>only the most [xxx] claimants<\/code>，虽然<code>deserving<\/code>被遮挡，仍能读出控制开支并限定领取者。做题时认为这与对申请者更慷慨的方向不同，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C保留了补助申请者这个对象，却把控制开支、只让特定申请者领取的动机改成对申请者慷慨。原文第三段的<code>generous state<\/code>也在被否定的“失业后高兴领钱”图景中，不是大臣要增加给付的证据。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<p>Losing a job is hurting: you don&#39;t skip down to the jobcentre with a song in your heart, delighted at the prospect of doubling your income from the generous state.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>促使财政大臣制定这项计划的是迫切希望对补助申请者慷慨一些。<\/p>\n<\/blockquote>\n<p>C的<code>claimants<\/code>在动机句末尾原样出现；但它受<code>only the most deserving<\/code>限定，前面还有<code>controlling spending<\/code>。这些限制决定大臣打算如何对待申请者。<\/p>\n<p>原文把控制支出与限定获得补助的人并列，用来说明所谓根本公平。第三段虽然出现慷慨的国家，却用<code>you don’t<\/code>否定失业者欣喜于收入翻倍的想象，不能抽出<code>generous<\/code>当肯定依据。<\/p>\n<p>C将控制给付与筛选领取者写成愿意慷慨给付，改变了政策方向。它不能只凭文章里有申请者或慷慨的词，就越过动机句的具体限制。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<p>动机句写控制开支与限定领取者，末段再写限时、有求职条件且在欧盟中较低的给付。<\/p>\n<\/blockquote>\n<p>文章从控制支出的理由走向保障薄弱的结果，批评的是给付受到收紧。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>His scheme was driven by a wish to offer claimants more generous financial support when they lost their jobs.<\/p>\n<p>他的计划出于这样的愿望：在申请者失去工作时，给他们更慷慨的经济支持。<\/p>\n<\/blockquote>\n<p>C成立时，后文应解释更慷慨的支持怎样体现这份愿望。实际文章选择限时、附条件和低额给付作结，不能把这种批评方向改成增加援助的动机。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把失业补助条件化，不能单凭这一点认定财政大臣的具体动机；还要区分文中的公开形象与明确的动机说明。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>An urge to be generous to the claimants.<br>迫切希望对补助申请者慷慨一些。<\/p>\n<\/blockquote>\n<p>作者希望保留不被条件化的失业保障，恰恰不代表他认为改革正对申请者更慷慨。本项最终仍要根据<code>controlling spending<\/code>以及<code>only the most deserving claimants<\/code>判断；C把被限制的给付说成主动扩大援助的愿望。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. A passion to ensure fairness for taxpayers.<\/h3>\n<blockquote>\n<p>热衷于确保纳税人的公平。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>fairness<\/code>和<code>taxpayer<\/code>均完整可见，D能接上<code>fundamental fairness<\/code>与<code>protecting the taxpayer<\/code>，第一轮与A一起保留。25题确定全文反对补助条件化后，回查区分了A的表面改善生活说法和D所对应的明确动机，最终选D。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>D把<code>zeal<\/code>换成<code>passion<\/code>，将<code>fundamental fairness<\/code>及其解释<code>protecting the taxpayer<\/code>合成确保纳税人公平。它概括的是文中归给大臣的动机，不是说作者赞成这种公平观或确认改革已经实现公平。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>促使财政大臣制定这项计划的是确保纳税人公平的热情。<\/p>\n<\/blockquote>\n<p>题干的<code>prompted<\/code>对应<code>motivated<\/code>，<code>chancellor<\/code>指代奥斯本。D中的<code>passion<\/code>对应<code>zeal<\/code>，而<code>fairness for taxpayers<\/code>需将破折号前后的两部分一起读。<\/p>\n<p>破折号前说对根本公平的热情，后面立即把这种公平具体化为保护纳税人、控制支出、限定受助者。D保留了热情这一动机及纳税人这一指向，没有把对象扩大成所有人。<\/p>\n<p>因此，D是对原句动机与解释内容的准确合并。句中的<code>we were to understand<\/code>保留作者的讽刺距离，不妨碍我们识别被呈现出来的政策理由，也不要求把它当作作者自己的价值判断。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>政策理由强调纳税人公平，接着文章转向失业者的恐惧与难堪。<\/p>\n<\/blockquote>\n<p>作者先交代改革怎样以纳税人和支出为重，再从受助者处境展示这种理由的代价。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>His zeal for fairness centred on protecting taxpayers and controlling what was paid out in benefits.<\/p>\n<p>他对公平的热情以保护纳税人、控制补助支出为中心。<\/p>\n<\/blockquote>\n<p>D所需的写法已在动机句的解释部分出现，也能接上随后作者换到失业者一侧的批评。它不需要把那段批评改成作者支持奥斯本，双方立场可以区分。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把失业补助条件化，不能单凭这一点认定财政大臣的具体动机；还要区分文中的公开形象与明确的动机说明。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>A passion to ensure fairness for taxpayers.<br>热衷于确保纳税人的公平。<\/p>\n<\/blockquote>\n<p>主旨说明作者为何要质疑纳税人公平这套理由，却不能仅凭“不应附条件”独立推出大臣的全部动机。本项最终仍要根据<code>his zeal for “fundamental fairness”<\/code>及<code>protecting the taxpayer<\/code>判断；两处内容正好支持D，而作者的反对立场没有改变题干所问的人。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>23题结论<\/h3>\n<blockquote>\n<p><strong>23. D. A passion to ensure fairness for taxpayers.<\/strong><\/p>\n<\/blockquote>\n<p>A借用了改善生活的表面说法，却把它当成作者此处明确交代的动机。<\/p>\n<p>B保留保护动作，把对象从纳税人换成失业者。<\/p>\n<p>C保留补助申请者，却把控制开支和限定给付改成慷慨援助。<\/p>\n<p>D准确合并对公平的热情与保护纳税人的具体解释。<\/p>\n<h2>24题<\/h2>\n<blockquote>\n<p>According to Paragraph 3, being unemployed makes one feel ______.<\/p>\n<p>根据第三段，失业会让人产生什么感受？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道段落细节概括题。题干明确限定第三段，问处于失业状态的人有什么感受；需要把直接情绪词与造成压力的生活处境一起概括，不能把作者批评政府的语气当成失业者的情绪。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<\/blockquote>\n<p>第一句直接写经济恐惧、心理难堪和支持难得，后面两句补出失去生活结构与收入的原因。要选择能概括这组压力的感受词，不往其中添加未写明的受辱、怒气或道德自责。<\/p>\n<h3>A. insulted<\/h3>\n<blockquote>\n<p>感到受侮辱<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整可见，原文<code>financially terrifying<\/code>可读，但<code>embarrassing<\/code>等词显示为<code>[xxx]<\/code>。做题材料把整段痛苦、不安与“受侮辱”区分，第一轮排除A；没有等到恢复被遮词才作这个判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A容易借<code>psychologically embarrassing<\/code>及“不再被需要”的处境，让人把难堪理解成受侮辱。原文强调收入失去、支持不足造成的恐惧和心理不适；<code>insulted<\/code>却把感受具体改成尊严遭到冒犯。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，失业会使人感到受侮辱。<\/p>\n<\/blockquote>\n<p>题干限定第三段的失业感受，A应与<code>financially terrifying, psychologically embarrassing<\/code>比较，而不能因为它也是负面词就与原文等同。后两句说明这些感受来自什么处境。<\/p>\n<p><code>embarrassing<\/code>写心理上的尴尬、难堪，<code>terrifying<\/code>写对经济处境的恐惧。失去工作还意味着离开提供目标的环境、没有收入支付生活费用，这些信息共同指向焦虑不安。<\/p>\n<p>感到受侮辱可能出现在某些失业经历中，但文中没有把尊严遭冒犯作为这一段的感受判断。A把难堪和失落具体化为受侮辱，超过了原句所支持的含义。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<p>作者从离开提供生活目标的工作环境，接着写养家和付账单的收入消失。<\/p>\n<\/blockquote>\n<p>后文把心理压力落实在身份和生计的丧失上，没有进一步把它定性为人格受到冒犯。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Losing work makes you feel insulted, as though your dignity has been affronted.<\/p>\n<p>失去工作让你感到受侮辱，仿佛自己的尊严受到冒犯。<\/p>\n<\/blockquote>\n<p>A需要作者明确把伤害集中到受辱感。实际文章继续展开生计和生活结构的压力，<code>embarrassing<\/code>不能替代这种更具体的尊严受冒犯判断。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者重视失业者需要保障的处境，不能单凭这一点判断某个具体情绪词；第三段怎样描述他们的感受仍须由本段原句决定。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>insulted<br>感到受侮辱<\/p>\n<\/blockquote>\n<p>主旨要求我们正视失业者需要保障的处境，却不能据此认定他们具体感到受侮辱。本项最终仍要根据<code>financially terrifying, psychologically embarrassing<\/code>及后文收入消失判断：这些内容支持不安，不能把受辱感当作既定事实。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. uneasy<\/h3>\n<blockquote>\n<p>感到不安<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B整个单词显示为<code>[xxx]<\/code>。做题材料先留下它，认为未知词可能概括原文的恐惧和压力；在A、C、D排除后才确定B，并没有声称当时已经读出了<code>uneasy<\/code>。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p><code>uneasy<\/code>在这里是不安、忧虑。它概括了经济上的恐惧、心理上的难堪，以及收入和工作带来的生活秩序消失，能够包住整段写出的压力，而不补出原文没有的特定情绪对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，失业会使人感到不安。<\/p>\n<\/blockquote>\n<p>题干的<code>being unemployed<\/code>对应第三段开头<code>Losing a job<\/code>，<code>feel<\/code>要求概括后面的感受。原文最直接的情绪词是<code>terrifying<\/code>与<code>embarrassing<\/code>，后续句子补足它们的生活原因。<\/p>\n<p>经济上令人恐惧，心理上令人难堪，支持还很少且难以得到；接着又失去工作提供的生活目标和养家的收入。前一句给出感受，后两句给出不安持续存在的具体来源。<\/p>\n<p>B用<code>uneasy<\/code>作上位概括，保留了担忧和不安这一方向。它没有把人写成愉快依赖福利，也没有另加愤怒或内疚的心理原因。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<p>Ask anyone newly unemployed what they want and the answer is always: a job.<\/p>\n<p>失去维持生活的收入后，作者用“刚失业的人想要的是一份工作”收束本段。<\/p>\n<\/blockquote>\n<p>人们想要工作，是因为工作与生活收入、目的和秩序相连；这个收束延续了前面的不安。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Without the income and structure that work provides, the newly unemployed feel anxious and uneasy about their lives.<\/p>\n<p>失去工作提供的收入和生活秩序，刚失业的人会对自己的生活焦虑不安。<\/p>\n<\/blockquote>\n<p>B所需的写法与原文的收入消失、生活结构受损相吻合。结尾渴望工作也承接这种压力，没有把失业写成舒适的领钱生活。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者重视失业者需要保障的处境，不能单凭这一点判断某个具体情绪词；第三段怎样描述他们的感受仍须由本段原句决定。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>uneasy<br>感到不安<\/p>\n<\/blockquote>\n<p>作者反对给补助附条件，第三段正用失业者的现实压力说明保障为何重要。主旨只给出这一方向，具体感受仍由<code>terrifying<\/code>、<code>embarrassing<\/code>和收入消失支持；B用不安概括它们，没有增加另一种情绪原因。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. enraged<\/h3>\n<blockquote>\n<p>感到愤怒<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>enraged<\/code>完整可见，原文可读到经济恐惧、支持少以及收入消失。做题材料比较后认为愤怒与这一组压力的方向不同，第一轮就排除了C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C利用整段都在写负面感受这一点，将恐惧、难堪改为强烈愤怒。情绪都不愉快，并不等于表达同一种反应；原文没有把失业者的心理写成发怒。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，失业会使人感到愤怒。<\/p>\n<\/blockquote>\n<p>题干把范围限在第三段，C的<code>enraged<\/code>要对应这一段关于感受的措辞。真正出现的是<code>financially terrifying<\/code>和<code>psychologically embarrassing<\/code>，并非表示发怒的表达。<\/p>\n<p>后文解释收入消失、账单仍需支付，使人担心生活如何继续。作者可能在全文中愤愤不平地批评改革，但题干这里问的是被描述的失业者感受，不能把作者的批评语气移给他们。<\/p>\n<p>C把经济恐惧与心理难堪概括成怒气，改变了情绪的性质。原文有压力，不等于原文已经断言这些人感到愤怒。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.<\/p>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<p>Ask anyone newly unemployed what they want and the answer is always: a job.<\/p>\n<p>段落写失去工作环境与收入，再以刚失业的人想要工作结束。<\/p>\n<\/blockquote>\n<p>作者沿着生活受损与渴望恢复工作推进，没有把结尾写成失业者表达愤怒。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The newly unemployed are enraged by their situation and respond with anger to the loss of their jobs.<\/p>\n<p>刚失业的人对自己的处境感到愤怒，对失去工作作出愤怒的反应。<\/p>\n<\/blockquote>\n<p>C所需的后文应把怒气作为明确心理反应写出来；实际后文用生计担忧和求职愿望解释不安。愤怒在现实中并非不可能，但它不是这段给出的判断。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者重视失业者需要保障的处境，不能单凭这一点判断某个具体情绪词；第三段怎样描述他们的感受仍须由本段原句决定。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>enraged<br>感到愤怒<\/p>\n<\/blockquote>\n<p>不能从作者反对政策，就推出文中失业者的感受也是愤怒。本项最终仍要根据第三段<code>terrifying<\/code>、<code>embarrassing<\/code>及收入消失判断；它们支撑担忧和不适，C却换成了怒气。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. guilty<\/h3>\n<blockquote>\n<p>感到内疚<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>guilty<\/code>完整可见。做题时读到支持不足和经济压力，却没有读到失业者认为自己做错了事，因此第一轮排除D，最终留下B。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D利用失业、需要补助和心理难受这些背景，引导人补出“认为自己有过错”的内疚感。原文的困难与保障不足不是道德过错，作者也没有说失业者因此自责。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，失业会使人感到内疚。<\/p>\n<\/blockquote>\n<p>D的<code>guilty<\/code>需要一种觉得自己有错、对他人负有亏欠的心理关系。第三段最接近的<code>psychologically embarrassing<\/code>只表明难堪，必须继续看其原因有没有指向自责。<\/p>\n<p>原文给出的原因是经济恐惧、支持难得、不再被工作环境需要以及收入消失，没有说失业者造成了某种过失。难堪可以来自处境的变化，不能自动改成承认自身过错。<\/p>\n<p>D补进了文中没有建立的道德自责关系。它不是把某个原词作宽泛概括，而是在不愉快的感受之外增加了一种特定心理成因。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.<\/p>\n<p>Ask anyone newly unemployed what they want and the answer is always: a job.<\/p>\n<p>文章最后写维持家庭生活的收入消失，以及失业者希望得到一份工作。<\/p>\n<\/blockquote>\n<p>作者以现实需要和求职愿望收束，没有让失业者反省自己做了什么错事。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>After losing their jobs, they blame themselves and feel guilty about having failed their families.<\/p>\n<p>失去工作后，他们责怪自己，并因认为自己辜负了家人而感到内疚。<\/p>\n<\/blockquote>\n<p>D成立时至少要出现自责或亏欠感的说明。实际句子说收入承担养家的用途，并没有让失业者把收入消失归咎于自身过错，不能替他们补上这种反应。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者重视失业者需要保障的处境，不能单凭这一点判断某个具体情绪词；第三段怎样描述他们的感受仍须由本段原句决定。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>guilty<br>感到内疚<\/p>\n<\/blockquote>\n<p>主旨强调失业保障不应被条件化，并不会由此推出失业者自认有错。本项最终仍要根据第三段关于感受和生计的文字判断；D把需要帮助的处境进一步写成内疚，增加了原文没有的心理关系。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>24题结论<\/h3>\n<blockquote>\n<p><strong>24. B. uneasy<\/strong><\/p>\n<\/blockquote>\n<p>A借用了心理难堪与身份失落，却把感受具体化为受侮辱。<\/p>\n<p>B用不安概括经济恐惧、心理难堪以及生计压力。<\/p>\n<p>C把原文的恐惧和难堪改成愤怒。<\/p>\n<p>D从困境与不适补出原文没有的道德自责。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：奥斯本改革的表面合理性<\/strong>（段落1-2上层） 改革内容：【&quot;前期工作搜寻&quot;计划：（必须带简历+注册在线求职+开始找工作→才能获得救济）+（每周汇报vs每两周）】+ 七天等待期 → 表面理由：帮助人们远离救济+更快找到工作 → 深层动机：[&quot;根本公平&quot;：保护纳税人+控制支出+确保只有最值得者获得救济]<\/p>\n<p>//（转折：揭示真相）<\/p>\n<p><strong>逻辑层次2：失业的真实痛苦<\/strong>（段落3失业者视角） 失业现实：【经济上令人恐惧+心理上令人尴尬+支持极少且难获得】→ 被排斥感：（不被需要+失去提供生活目标和结构的工作环境）→ 经济困境：失去养家糊口的收入 → 核心诉求：失业者想要的总是一份工作<\/p>\n<p>//（对比批判）<\/p>\n<p><strong>逻辑层次3：奥斯本世界观vs现实<\/strong>（段落4批判分析） 奥斯本的假设：失业者第一本能是陷入依赖+国家纵容虚假 // 现实：20年改革已使系统越来越严格 → 福利原则的转变：【过去：失业保险+无条件支付 → 现在：&quot;求职者津贴&quot;（重新定义失业者+取消基本权利+有条件+时限+每周71.70英镑=欧盟最不慷慨）】<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：奥斯本的改革表面上以&quot;帮助&quot;和&quot;公平&quot;为名，实际上基于对失业者的错误假设（认为他们倾向于依赖），忽视了失业的真实痛苦和失业者的真实需求，将原本的失业保险权利转变为严苛的有条件救济。<\/p>\n<h2>小标题题<\/h2>\n<h3>题目<\/h3>\n<p><strong>Directions:<\/strong><\/p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)<\/p>\n<p><strong>A. Evidence of Hardship behind the Political Gamble<\/strong><\/p>\n<p><strong>B. A Welfare Reform Promoted as Help<\/strong><\/p>\n<p><strong>C. A Lasting Consensus on a Smaller State<\/strong><\/p>\n<p><strong>D. A Different Course and the Possibility of Opposition<\/strong><\/p>\n<p><strong>E. Joblessness and the Reality of Conditional Support<\/strong><\/p>\n<p><strong>F. Political Advantage beneath the Language of Help<\/strong><\/p>\n<p><strong>G. Replacing Welfare with Unconditional Insurance<\/strong><\/p>\n<h2>Help, Hardship and the Politics of Welfare<\/h2>\n<h3>41. __________<\/h3>\n<p>George Osborne presented his new welfare measures in the language of reform, fairness and helpfulness. To qualify for benefit, the unemployed would have to bring a CV to the jobcentre, register for online job searches and begin looking for work. They would report weekly rather than fortnightly and wait seven days for the jobseeker&#39;s allowance. The first days, he argued, should be spent finding work rather than signing on. These changes were said to reduce dependency, protect taxpayers and ensure that support reached only the most deserving claimants. On the surface, the package sounded like a reasonable attempt to improve lives.<\/p>\n<h3>42. __________<\/h3>\n<p>The reality of unemployment is far less comfortable than this language suggests. Losing a job removes income, company and the structure of daily life; the newly unemployed generally want work as quickly as possible. Nor can they simply choose generous, permanent support. Two decades of reform have already tied benefits to active job searches. Claimants receive a time-limited allowance rather than unconditional insurance payments, and the weekly sum is among the least generous in the European Union. A seven-day delay therefore withholds modest help at a moment of crisis, while the supposedly new search requirement repeats the system&#39;s existing principle.<\/p>\n<h3>43. __________<\/h3>\n<p>Calling the restrictions help serves a political purpose. Osborne seeks to present the Conservatives as friends of taxpayers and Labour as the welfare party, while making further cuts appear normal. His gamble assumes that those bearing the costs will remain voiceless and that most voters will accept welfare as a burden and a smaller state as a necessity. Success would also require people to avoid difficult questions about the management of the economy and the consequences for society. Behind the reassuring vocabulary lies an attempt to define the terms of political debate.<\/p>\n<h3>44. __________<\/h3>\n<p>That gamble is difficult to square with the evidence of hardship. The Children&#39;s Commissioner projected a rise in child poverty, millions depended on payday loans, insecure contracts were spreading and food banks were increasingly used. Families also faced rising housing, energy and transport costs while benefits were being cut in real terms. Local services were shrinking just as need became more acute. Even a Conservative local-government leader warned that further budget reductions could push services to breaking point. Such criticism, alongside the personal stories of displaced tenants, suggested that civil society was beginning to resist.<\/p>\n<h3>45. __________<\/h3>\n<p>A different approach is possible: slower cuts, a wider tax base, a new social settlement, a recast relationship between central and local government and a more innovative, productive economy. Osborne expects critics to remain too divided to form a coalition broad enough to include both unions and business. Yet cruelty presented as help offers no reliable foundation for a lasting majority either. Its social consequences may instead bring opponents together. A speech that scores an immediate political victory can therefore become the starting point of an effective opposition, rather than a successful long-term strategy.<\/p>\n<h4>41题<\/h4>\n<p>【答案】B. A Welfare Reform Promoted as Help<\/p>\n<blockquote>\n<p>被包装成帮助的福利改革<\/p>\n<\/blockquote>\n<p>这一部分完整介绍新措施以及政府怎样为它们辩护，重点是“措施如何被说成是在帮助人”，不是已经证明措施有帮助。<\/p>\n<p>开头直接给出包装方式，结尾回扣表面效果：<\/p>\n<blockquote>\n<p>presented ... in the language of reform, fairness and helpfulness<br>On the surface, the package sounded like a reasonable attempt to improve lives.<\/p>\n<\/blockquote>\n<p>中间列举带简历、网上求职、每周汇报和七天等待，再写减少依赖、保护纳税人等理由，推进链是：<\/p>\n<blockquote>\n<p>宣布福利措施 → 列出领取条件与等待要求 → 给出公平、帮助的正当化理由 → 概括表面上的合理性。<\/p>\n<\/blockquote>\n<p>B的<code>Welfare Reform<\/code>对应这些领取规则，<code>Promoted as Help<\/code>对应政府宣称的目的和整段的表面包装。<\/p>\n<p>最强干扰是F。F已经判断隐藏着政治获利的目的，需要“党派定位、选民、政治议程”等内容作支撑；本段只展示公开说法，并未展开这些隐含动机。后文才专门揭示它们，不能把后文标题提前挪过来。<\/p>\n<blockquote>\n<p><strong>41. B<\/strong><\/p>\n<\/blockquote>\n<h4>42题<\/h4>\n<p>【答案】E. Joblessness and the Reality of Conditional Support<\/p>\n<blockquote>\n<p>失业处境与附条件救济的真实状况<\/p>\n<\/blockquote>\n<p>这一部分用失业者处境和现行制度共同反驳“失业者可以轻松依赖福利”的想象。<\/p>\n<p>开头写：<\/p>\n<blockquote>\n<p>Losing a job removes income, company and the structure of daily life<\/p>\n<\/blockquote>\n<p>转入制度时又写：<\/p>\n<blockquote>\n<p>Nor can they simply choose generous, permanent support.<br>Claimants receive a time-limited allowance rather than unconditional insurance payments<\/p>\n<\/blockquote>\n<p>失去工作意味着经济和心理损失，而救济原本就有求职条件、时间限制且金额不高。段尾据此判断，延迟发放会加重危机，“新”求职条件也没有改变原有原则。<\/p>\n<blockquote>\n<p>失业本已痛苦 → 救济本已有严格条件 → 金额有限 → 延迟发放难称帮助，求职要求也并非新创。<\/p>\n<\/blockquote>\n<p>E的<code>Joblessness<\/code>覆盖个人处境，<code>Reality of Conditional Support<\/code>覆盖制度条件、金额和政策实际作用，两半缺一不可。<\/p>\n<p>最强干扰是G。G说要用无条件保险替换福利，本段却用<code>rather than<\/code>明确说明现状不是无条件保险，也没有提出恢复这种制度的方案。它把用于对照的旧原则改成了正在推行的政策。<\/p>\n<blockquote>\n<p><strong>42. E<\/strong><\/p>\n<\/blockquote>\n<h4>43题<\/h4>\n<p>【答案】F. Political Advantage beneath the Language of Help<\/p>\n<blockquote>\n<p>“帮助”话语之下的政治利益<\/p>\n<\/blockquote>\n<p>这一部分解释措施服务于怎样的党派定位，以及这种政治计算依赖哪些假设。<\/p>\n<p>开头直说：<\/p>\n<blockquote>\n<p>Calling the restrictions help serves a political purpose.<\/p>\n<\/blockquote>\n<p>接着分别安排保守党与工党的形象，并列出政治赌博成立的条件：承担代价的人保持失声，多数选民接受削减福利，也不追问经济管理及社会后果。<\/p>\n<p>段尾把这些细节收束为：<\/p>\n<blockquote>\n<p>an attempt to define the terms of political debate<\/p>\n<\/blockquote>\n<p>完整推进是：<\/p>\n<blockquote>\n<p>揭示政治目的 → 区分两党形象 → 列出政策获支持的前提 → 指出其试图控制政治讨论的方向。<\/p>\n<\/blockquote>\n<p>F的<code>beneath the Language of Help<\/code>对应公开措辞与真实目的的反差，<code>Political Advantage<\/code>覆盖党派形象、选民接受和议题控制。<\/p>\n<p>最强干扰是C。段中<code>His gamble assumes<\/code>与<code>would ... require<\/code>说明这只是一套尚待实现的政治设想，并不是已经形成、更不是能够持久的社会共识。C把赌注和前提升级成了确定结果。<\/p>\n<blockquote>\n<p><strong>43. F<\/strong><\/p>\n<\/blockquote>\n<h4>44题<\/h4>\n<p>【答案】A. Evidence of Hardship behind the Political Gamble<\/p>\n<blockquote>\n<p>政治赌博背后的民生困境证据<\/p>\n<\/blockquote>\n<p>这一部分用社会事实检验前面的政治假设，随后写这些后果怎样开始引发抵抗。<\/p>\n<p>开头先把段落接回上一部分：<\/p>\n<blockquote>\n<p>That gamble is difficult to square with the evidence of hardship.<\/p>\n<\/blockquote>\n<p>中间依次列出儿童贫困、借贷、就业不稳定、食物银行和生活成本；再用<code>while<\/code>、<code>just as<\/code>凸显需求增加与福利、服务削减之间的矛盾。<\/p>\n<p>结尾进一步指出：<\/p>\n<blockquote>\n<p>civil society was beginning to resist<\/p>\n<\/blockquote>\n<p>因此推进链是：<\/p>\n<blockquote>\n<p>提出赌博与现实的冲突 → 罗列生活压力 → 显示公共支持反而收缩 → 引出来自社会与地方政府的反对。<\/p>\n<\/blockquote>\n<p>A的<code>Evidence of Hardship<\/code>对应多种生活压力及服务困境，<code>behind the Political Gamble<\/code>把这些事实与政策的政治计算联系起来。<\/p>\n<p>最强干扰是D。段尾确实出现抵抗的迹象，但这一段还没有提出另一套经济、财政方案，也没有完整讨论反对联盟的形成可能；把D放这里，会用末尾的一个发展方向盖过整段的证据主体。<\/p>\n<blockquote>\n<p><strong>44. A<\/strong><\/p>\n<\/blockquote>\n<h4>45题<\/h4>\n<p>【答案】D. A Different Course and the Possibility of Opposition<\/p>\n<blockquote>\n<p>另一条政策道路与形成反对力量的可能<\/p>\n<\/blockquote>\n<p>这一部分先给出替代方向，再判断现行政治策略可能产生相反的联盟效果，承担全文收束功能。<\/p>\n<p>开头明确说：<\/p>\n<blockquote>\n<p>A different approach is possible<\/p>\n<\/blockquote>\n<p>随后列出削减速度、税基、社会安排和经济创新等方向。中间用<code>Yet<\/code>反驳奥斯本对反对者无法联合的判断，结尾把短期得分与长期战略区分开：<\/p>\n<blockquote>\n<p>the starting point of an effective opposition, rather than a successful long-term strategy<\/p>\n<\/blockquote>\n<p>推进链是：<\/p>\n<blockquote>\n<p>提出可行替代方向 → 交代执政者对反对力量分裂的判断 → 说明政策伤害也可能促成联合 → 警惕短期政治胜利转成长期代价。<\/p>\n<\/blockquote>\n<p>D的<code>Different Course<\/code>覆盖政策替代，<code>Possibility of Opposition<\/code>覆盖社会后果促成联合的可能性，没有把“可能”说成已经成功。<\/p>\n<p>最强干扰是C。全文结尾恰恰质疑现有策略能否维持长期多数，并提出它可能催生有效反对力量；“持久共识”与这个判断方向相反。<\/p>\n<blockquote>\n<p><strong>45. D<\/strong><\/p>\n<\/blockquote>\n<h2>排序题<\/h2>\n<h3>题目<\/h3>\n<p><strong>Directions:<\/strong><\/p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)<\/p>\n<p><strong>A.<\/strong> That new reporting rule was followed by another restriction: a seven-day wait for the jobseeker&#39;s allowance. Osborne said the first days should be spent finding work, not signing on. He presented the changes as a way to reduce dependency and speed a return to employment, while protecting taxpayers and ensuring that only the most deserving claimants received benefits.<\/p>\n<p><strong>B.<\/strong> Calling these restrictions help therefore serves political rather than practical ends. Osborne wants the Conservatives to appear as friends of taxpayers and Labour as the welfare party. His gamble is that those punished will remain voiceless, while most voters accept welfare as a burden and a smaller state as unavoidable. It depends on the public asking few questions about the economy or the social consequences.<\/p>\n<p><strong>C.<\/strong> Against that mounting hardship and unrest, a plausible alternative exists: slower cuts, a broader tax base, a new social settlement and a more innovative economy. Relations between central and local government could also be recast. Osborne nevertheless believes no broad coalition can unite around such a programme. He expects unions, business and the other critics to remain unable to argue together for change.<\/p>\n<p><strong>D.<\/strong> George Osborne introduced new welfare measures with promises of reform, fairness and help. Under his upfront work search scheme, the unemployed would have to bring a CV to the jobcentre, register for online searches and begin looking for work before receiving benefit. They would then have to report weekly rather than fortnightly.<\/p>\n<p><strong>E.<\/strong> The newly unemployed are nevertheless pictured as eager to settle into permanent dependency. That ignores two decades of increasingly strict reform: benefits already depend on active job searches, last for a limited time and provide one of the least generous weekly allowances in the European Union. Delaying this modest support for seven days hardly helps someone in crisis, and presenting the existing search requirement as a new transformation is equally misleading.<\/p>\n<p><strong>F.<\/strong> His confidence in a divided opposition may be misplaced. Cruelty disguised as help, with no promise beyond more of the same, cannot reliably build a majority either. Its desperate social consequences may instead create an effective opposition coalition. A spending speech can win a day&#39;s political contest without becoming a lasting strategy; the chancellor may have gone a step too far.<\/p>\n<p><strong>G.<\/strong> Yet losing a job is a traumatic experience, not an attractive route to support. It removes income, daily structure and the company of colleagues, while leaving people frightened and embarrassed. The money needed to feed a family and pay the bills disappears, and the available help is small and difficult to obtain. Ask the newly unemployed what they want, and the answer is a job.<\/p>\n<p><strong>H.<\/strong> That gamble looks less secure when set against growing hardship. Child poverty was projected to rise, payday borrowing and insecure work were widespread, and food banks were expanding. Housing, energy and transport costs rose while benefits and local services were cut. Even a Conservative local-government leader warned that further reductions would push services to breaking point. Civil society was beginning to stir.<\/p>\n<p><strong>41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____<\/strong><\/p>\n<h2>排序题全局解析<\/h2>\n<p>先明确八段各自承担的功能，再用前后的对象与论证关系确定位置：<\/p>\n<ul>\n<li>A：补充七天等待措施，并交代政府公开声称的帮助与公平目的。<\/li>\n<li>B：揭示政治定位，并说明整套政治赌博赖以成立的公众反应。<\/li>\n<li>C：在困境与反抗基础上提出替代方向，交代奥斯本对反对力量分裂的判断。<\/li>\n<li>D：首次介绍人物、新求职制度及每周汇报要求。<\/li>\n<li>E：说明现行救济早已严格附条件，反驳轻松依赖福利及“全新帮助”的说法。<\/li>\n<li>F：质疑前段的联盟判断，指出短期政治获利可能促成长期反对力量。<\/li>\n<li>G：回到失业者的真实体验，说明他们想尽快工作而非安享救济。<\/li>\n<li>H：用民生与服务压力检验政治赌博，并写出社会开始反抗的迹象。<\/li>\n<\/ul>\n<p>全文推进链是：<\/p>\n<blockquote>\n<p>政策首次介绍 → 补充限制与公开理由 → 失业者的真实处境 → 现行救济制度反证 → 揭示政治赌注 → 生活困境检验赌注 → 替代道路及联合的难题 → 反对力量可能形成的结论<\/p>\n<\/blockquote>\n<p>完整顺序为：<\/p>\n<blockquote>\n<p><strong>D → A → G → E → B → H → C → F<\/strong><\/p>\n<\/blockquote>\n<p>A、E、H分别位于第2、第4和第6个位置，其余五段依次填入41—45。<\/p>\n<h4>41题<\/h4>\n<p>【答案】D<\/p>\n<p>41位于已知A段之前，是全文首段；前面没有其他段落，必须先把人物与政策对象引进来。<\/p>\n<p>D先给出<code>George Osborne<\/code>和<code>upfront work search scheme<\/code>，段尾明确规定：<\/p>\n<blockquote>\n<p>report weekly rather than fortnightly<\/p>\n<\/blockquote>\n<p>后面的A开头紧接着说：<\/p>\n<blockquote>\n<p>That new reporting rule was followed by another restriction<\/p>\n<\/blockquote>\n<p><code>That new reporting rule<\/code>有了唯一明确的先行内容；<code>another restriction<\/code>再把每周汇报扩展到七天等待。局部链为：<\/p>\n<blockquote>\n<p>D：首次介绍新规则，并落在汇报频率上 → A：承接这一汇报规则，追加等待限制及公开理由。<\/p>\n<\/blockquote>\n<p>最强候选G也谈失业，看起来可以充当背景，但它一开始就用<code>Yet<\/code>反驳某种既有描述，既没有完成政策介绍，段尾也没有汇报规则，无法让A的<code>That<\/code>落地。B则已经分析<code>these restrictions<\/code>的政治目的，更不能先于限制本身。<\/p>\n<blockquote>\n<p><strong>41. D<\/strong><\/p>\n<\/blockquote>\n<h4>42题<\/h4>\n<p>【答案】G<\/p>\n<p>42位于已知A和E之间。A段刚把措施说成帮助求职者、减少依赖，E段则要揭示把失业者描绘为长期依赖者的失真。<\/p>\n<p>A的关键说法是：<\/p>\n<blockquote>\n<p>reduce dependency and speed a return to employment<\/p>\n<\/blockquote>\n<p>G用<code>Yet losing a job is a traumatic experience<\/code>转回人的真实体验，段尾明确：<\/p>\n<blockquote>\n<p>the answer is a job<\/p>\n<\/blockquote>\n<p>E再接：<\/p>\n<blockquote>\n<p>The newly unemployed are nevertheless pictured as eager to settle into permanent dependency.<\/p>\n<\/blockquote>\n<p><code>nevertheless<\/code>把“他们实际渴望工作”与“他们却被描绘为渴望依赖”正面对照，不只是形式上有一个转折词。<\/p>\n<blockquote>\n<p>A：官方称措施帮助失业者 → G：失业者本已承受损失并希望就业 → E：政治描绘却颠倒这种意愿，而且忽略既有制度。<\/p>\n<\/blockquote>\n<p>最强候选B也会批评官方说法，但B立即跳到党派利益，没有给E的“失业者仍被这样描绘”提供关于其真实愿望的具体反面。它还用<code>therefore<\/code>承接尚未出现的制度反证，分析次序提前了。<\/p>\n<blockquote>\n<p><strong>42. G<\/strong><\/p>\n<\/blockquote>\n<h4>43题<\/h4>\n<p>【答案】B<\/p>\n<p>43位于已知E与H之间。E已证明求职条件早就存在、待遇并不优厚，因此等待政策难称帮助；H要检验一个具体的政治赌博。<\/p>\n<p>前段尾强调：<\/p>\n<blockquote>\n<p>presenting the existing search requirement as a new transformation is equally misleading<\/p>\n<\/blockquote>\n<p>B开头顺势推论：<\/p>\n<blockquote>\n<p>Calling these restrictions help therefore serves political rather than practical ends.<\/p>\n<\/blockquote>\n<p>B随即明确<code>His gamble is that ...<\/code>，交代受损者失声、多数人接受缩小国家的假设。已知H再从同一对象出发：<\/p>\n<blockquote>\n<p>That gamble looks less secure when set against growing hardship.<\/p>\n<\/blockquote>\n<p>双边关系是：<\/p>\n<blockquote>\n<p>E：帮助的实际依据站不住 → B：转而解释其政治目的及成功前提 → H：拿困境与社会反应检验这些前提。<\/p>\n<\/blockquote>\n<p>最强候选C也讨论政策选择和联盟，但它开头的<code>that mounting hardship and unrest<\/code>需要H先给出民生证据和社会动向。放在这里既倒置证据，也不能像B一样明确提出让H检验的政治赌注。<\/p>\n<blockquote>\n<p><strong>43. B<\/strong><\/p>\n<\/blockquote>\n<h4>44题<\/h4>\n<p>【答案】C<\/p>\n<p>44紧接已知H，后面是最后一空45。结合末段F的开头，需要在这里交代奥斯本怎样判断反对力量。<\/p>\n<p>H以社会困境和地方政府的批评收束：<\/p>\n<blockquote>\n<p>Civil society was beginning to stir.<\/p>\n<\/blockquote>\n<p>C开头的<code>Against that mounting hardship and unrest<\/code>同时承接“生活困难”和“开始反抗”，再提出政策替代，并在末尾写：<\/p>\n<blockquote>\n<p>He expects unions, business and the other critics to remain unable to argue together for change.<\/p>\n<\/blockquote>\n<p>这样F开头的<code>His confidence in a divided opposition<\/code>才有完整出处。局部推进是：<\/p>\n<blockquote>\n<p>H：困境积累，社会开始反抗 → C：替代道路存在，但奥斯本押注各方无法联合 → F：质疑这一分裂判断，评估可能形成的反对联盟。<\/p>\n<\/blockquote>\n<p>最强候选F也适合接“社会反抗”，但若直接放在H后面，<code>His confidence in a divided opposition<\/code>还没有具体内容；H讨论的是服务压力，不是他对联盟的判断。C必须先补齐这层，F才能在结尾回应。<\/p>\n<blockquote>\n<p><strong>44. C<\/strong><\/p>\n<\/blockquote>\n<h4>45题<\/h4>\n<p>【答案】F<\/p>\n<p>45是全文最后一段，前面已确定为C。没有后继段，所以除了向前衔接，还要检查是否完成全文收束。<\/p>\n<p>C末尾说：<\/p>\n<blockquote>\n<p>critics ... remain unable to argue together for change<\/p>\n<\/blockquote>\n<p>F开头立即判断：<\/p>\n<blockquote>\n<p>His confidence in a divided opposition may be misplaced.<\/p>\n<\/blockquote>\n<p>后文不再另起制度细节，而是解释社会后果怎样可能促成反对联盟，最后区分短期得分与长期战略：<\/p>\n<blockquote>\n<p>win a day&#39;s political contest without becoming a lasting strategy<\/p>\n<\/blockquote>\n<blockquote>\n<p>C：他认为反对者不能联合 → F：这种信心可能错误，政策伤害可能促成联合 → 收束为对整个政治策略的判断。<\/p>\n<\/blockquote>\n<p>最强候选B同样谈政治，但它负责首次提出党派定位和赌注，应该在民生证据之前；放在结尾会倒退重讲动机，无法回应C具体提出的“反对者能否联合”。F才把这层判断及全文政策批评一并收住。<\/p>\n<blockquote>\n<p><strong>45. F<\/strong><\/p>\n<\/blockquote>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>social fairness<\/strong><\/td>\n<td><strong>社会公平<\/strong><\/td>\n<td><strong>公正｜社会公平<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>equal employment opportunities<\/td>\n<td>平等就业机会<\/td>\n<td>平等｜机会平等<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td><strong>employment support<\/strong><\/td>\n<td><strong>就业支持<\/strong><\/td>\n<td><strong>和谐｜民生保障<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>public welfare<\/td>\n<td>公共福利<\/td>\n<td>和谐｜民生保障<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>the dignity of work<\/td>\n<td>劳动的尊严<\/td>\n<td>敬业｜职业精神<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>social responsibility<\/td>\n<td>社会责任<\/td>\n<td>敬业｜责任担当<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>compassion for people in need<\/td>\n<td>对困难群体的关怀<\/td>\n<td>友善｜关爱他人<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>financial security<\/td>\n<td>经济保障<\/td>\n<td>和谐｜生活保障<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td><strong>career development<\/strong><\/td>\n<td><strong>职业发展<\/strong><\/td>\n<td><strong>敬业｜职业成长<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>a commitment to fairness<\/td>\n<td>对公平的坚守<\/td>\n<td>公正｜公平意识<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>responsible public spending<\/td>\n<td>负责任的公共支出<\/td>\n<td>公正｜公共资源<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>a sound social insurance system<\/td>\n<td>健全的社会保险制度<\/td>\n<td>和谐｜社会保障<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>2. 大作文第一段描述题目信息时可积累的表达<\/h2>\n<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In order to change their lives for the better, A and B are doing X.<\/strong><\/td>\n<td><strong>为了改善生活，A和B正在做X。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A is spending time doing X rather than doing Y.<\/td>\n<td>A正在花时间做X，而不是做Y。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A looks delighted at the prospect of X.<\/td>\n<td>想到X的前景，A显得很高兴。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A offers B both support and a sense of purpose.<\/td>\n<td>A既给予B支持，也让B获得目标感。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart shows a reduction in A over the past X years.<\/strong><\/td>\n<td><strong>图表显示，过去X年间A有所减少。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The income of A doubled from X to Y during the period.<\/td>\n<td>在此期间，A的收入从X翻倍至Y。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The figures show that support for A remains minimal.<\/td>\n<td>这些数据表明，对A的支持仍然很少。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>A received more support than B during the period shown.<\/td>\n<td>在图示期间，A获得的支持比B更多。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The passage discusses a scheme intended to change people’s lives for the better.<\/strong><\/td>\n<td><strong>短文讨论了一项旨在改善人们生活的方案。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The author questions whether A can truly help people achieve B.<\/td>\n<td>作者质疑A能否真正帮助人们实现B。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage contrasts the apparent reasonableness of A with its actual effects.<\/td>\n<td>短文将A表面上的合理性与其实际效果进行对照。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage explains that access to A is conditional on B.<\/td>\n<td>短文说明，获得A以B为条件。<\/td>\n<\/tr>\n<\/tbody><\/table>\n";

 },epoch));
