<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset:method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset:method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset:method_newtype_overview)\n\n![新题型考纲表格](asset:method_newtype_table)\n\n![七选五题型说明](asset:method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset:method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset:method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset:method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","level":1,"section":"第一鸟 · 词汇","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| in order to | 为了 | change lives for the better | 改善生活 | reduce | v. 减少 |\n| dependency | n. 依赖 | Chancellor of the Exchequer | n. 财政大臣 | introduce | v. 引入 |\n| upfront | a. 前期的 | work search | n. 求职；找工作 | scheme | n. 方案 |\n| the jobless | n. 失业者 | arrive | v. 到达 | jobcentre | n. 就业中心 |\n| CV | n. 简历 | register | v. 注册；登记 | online | ad. 在线 |\n| look for work | 寻找工作 | eligible for | 有资格获得…… | benefit | n. 救济金；福利 |\n| report | v. 汇报 | weekly | ad. 每周 | rather than | 而不是 |\n| fortnightly | ad. 每两周一次 | reasonable | a. 合理的 |  |  |","context":{"focus":[94,131,892,512],"mode":"image","asset":"articleAnnotated","sourceW":1080,"sourceH":6116,"label":"第1段重点词语境","includeTitle":true},"meta":{"bird":1,"paragraph":1},"html":"<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>in order to<\/td>\n<td>为了<\/td>\n<td>change lives for the better<\/td>\n<td>改善生活<\/td>\n<td>reduce<\/td>\n<td>v. 减少<\/td>\n<\/tr>\n<tr>\n<td>dependency<\/td>\n<td>n. 依赖<\/td>\n<td>Chancellor of the Exchequer<\/td>\n<td>n. 财政大臣<\/td>\n<td>introduce<\/td>\n<td>v. 引入<\/td>\n<\/tr>\n<tr>\n<td>upfront<\/td>\n<td>a. 前期的<\/td>\n<td>work search<\/td>\n<td>n. 求职；找工作<\/td>\n<td>scheme<\/td>\n<td>n. 方案<\/td>\n<\/tr>\n<tr>\n<td>the jobless<\/td>\n<td>n. 失业者<\/td>\n<td>arrive<\/td>\n<td>v. 到达<\/td>\n<td>jobcentre<\/td>\n<td>n. 就业中心<\/td>\n<\/tr>\n<tr>\n<td>CV<\/td>\n<td>n. 简历<\/td>\n<td>register<\/td>\n<td>v. 注册；登记<\/td>\n<td>online<\/td>\n<td>ad. 在线<\/td>\n<\/tr>\n<tr>\n<td>look for work<\/td>\n<td>寻找工作<\/td>\n<td>eligible for<\/td>\n<td>有资格获得……<\/td>\n<td <\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"title":"第1段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第1段\n\nIn order to \"change lives for the better\" and reduce \"dependency\", George Osborne, Chancellor of the Exchequer, introduced the \"upfront work search\" scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly. What could be more reasonable?","context":{"focus":[94,131,892,512],"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-1"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段<\/h3>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly. What could be more reasonable?<\/p>\n<\/section>"},{"title":"第1段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第1段\n\nIn order to / \"change lives for the better\" / and reduce \"dependency\", / George Osborne, / Chancellor of the Exchequer, / introduced / the \"upfront work search\" scheme.\n\nOnly if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.\n\nWhat could be more reasonable?","context":{"focus":[94,131,892,512],"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-1"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段<\/h3>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly. What could be more reasonable?<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段<\/h3>\n<p>In order to / &quot;change lives for the better&quot; / and reduce &quot;dependency&quot;, / George Osborne, / Chancellor of the Exchequer, / introduced / the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.<\/p>\n<p>What could be more reasonable?<\/p>\n<\/section>"},{"title":"第1段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第1段\n\n为了 / \"让生活变得更好\" / 并减少\"依赖性\"，/ 乔治·奥斯本，/ 财政大臣，/ 引入了 / \"前期工作搜寻\"计划。\n\n只有当失业者 / 到达就业中心 / 带着简历，/ 注册在线求职，/ 并开始找工作 / 他们才有资格 / 获得救济金 – / 然后他们应该汇报 / 每周 / 而不是每两周。\n\n还有什么能更合理呢？","context":{"focus":[94,131,892,512],"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-1"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段<\/h3>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly. What could be more reasonable?<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段<\/h3>\n<p>In order to / &quot;change lives for the better&quot; / and reduce &quot;dependency&quot;, / George Osborne, / Chancellor of the Exchequer, / introduced / the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.<\/p>\n<p>What could be more reasonable?<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段<\/h3>\n<p>为了 / &quot;让生活变得更好&quot; / 并减少&quot;依赖性&quot;，/ 乔治·奥斯本，/ 财政大臣，/ 引入了 / &quot;前期工作搜寻&quot;计划。<\/p>\n<p>只有当失业者 / 到达就业中心 / 带着简历，/ 注册在线求职，/ 并开始找工作 / 他们才有资格 / 获得救济金 – / 然后他们应该汇报 / 每周 / 而不是每两周。<\/p>\n<p>还有什么能更合理呢？<\/p>\n<\/section>"},{"title":"第1段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第1段\n\n为了\"让生活变得更好\"并减少\"依赖性\"，财政大臣乔治·奥斯本引入了\"前期工作搜寻\"计划。失业者只有带着简历到就业中心、注册在线求职并开始找工作，才有资格获得救济金——而且他们必须每周而非每两周汇报一次。还有什么能更合理呢？","context":{"focus":[94,131,892,512],"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-1"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true},"focusId":"focus-paragraph-1-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段<\/h3>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly. What could be more reasonable?<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段<\/h3>\n<p>In order to / &quot;change lives for the better&quot; / and reduce &quot;dependency&quot;, / George Osborne, / Chancellor of the Exchequer, / introduced / the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.<\/p>\n<p>What could be more reasonable?<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段<\/h3>\n<p>为了 / &quot;让生活变得更好&quot; / 并减少&quot;依赖性&quot;，/ 乔治·奥斯本，/ 财政大臣，/ 引入了 / &quot;前期工作搜寻&quot;计划。<\/p>\n<p>只有当失业者 / 到达就业中心 / 带着简历，/ 注册在线求职，/ 并开始找工作 / 他们才有资格 / 获得救济金 – / 然后他们应该汇报 / 每周 / 而不是每两周。<\/p>\n<p>还有什么能更合理呢？<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段<\/h3>\n<p>为了&quot;让生活变得更好&quot;并减少&quot;依赖性&quot;，财政大臣乔治·奥斯本引入了&quot;前期工作搜寻&quot;计划。失业者只有带着简历到就业中心、注册在线求职并开始找工作，才有资格获得救济金——而且他们必须每周而非每两周汇报一次。还有什么能更合理呢？<\/p>\n<\/section>"},{"title":"第2段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第2段\n\nMore apparent reasonableness followed. There will now be a seven-day wait for the jobseeker's allowance. \"Those first few days should be spent looking for work, not looking to sign on,\" he claimed. \"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\" Help? Really? On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with \"reforms\" to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness. What motivated him, we were to understand, was his zeal for \"fundamental fairness\" – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.","context":{"focus":[94,655,892,1191],"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-2"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段<\/h3>\n<p>More apparent reasonableness followed. There will now be a seven-day wait for the jobseeker&#39;s allowance. &quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed. &quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot; Help? Really? On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness. What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/section>"},{"title":"第2段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第2段\n\nMore apparent reasonableness / followed.\n\nThere will now be / a seven-day wait / for the jobseeker's allowance.\n\n\"Those first few days / should be spent / looking for work, / not looking to sign on,\" / he claimed.\n\n\"We're doing these things / because we know / they help people / stay off benefits / an the least generous in the EU.","context":{"focus":[94,2644,892,1189],"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-4"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>But in Osborneland, your first instinct is to fall into dependency – permanent dependency if you can get it – supported by a state only too ready to indulge your falsehood. It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens. Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions. Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/section>"},{"title":"第4段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第4段\n\nBut in Osborneland, / your first instinct / is to fall into dependency – / permanent dependency / if you can get it – / supported by a state / only too ready / to indulge your falsehood.\n\nIt is as though / 20 years / of ever-tougher reforms / of the job search and benefit administration system / never happened.\n\nThe principle / of British welfare / is no longer / that you can insure yourself / against the risk of unemployment / and receive unconditional payments / if the disaster happens.\n\nEven the very phrase / \"jobseeker's allowance\" / is about redefining / the unemployed / as a \"jobseeker\" / who had no fundamental right / to a benefit / he or she has earned / through making national insurance contributions.\n\nInstead, / the claimant receives / a time-limited \"allowance,\" / conditional on actively seeking a job; / no entitlement / and no insurance, / at £71.70 a week, / one of the least generous / in the EU.","context":{"focus":[94,2644,892,1189],"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-4"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>But in Osborneland, your first instinct is to fall into dependency – permanent dependency if you can get it – supported by a state only too ready to indulge your falsehood. It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens. Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions. Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>But in Osborneland, / your first instinct / is to fall into dependency – / permanent dependency / if you can get it – / supported by a state / only too ready / to indulge your falsehood.<\/p>\n<p>It is as though / 20 years / of ever-tougher reforms / of the job search and benefit administration system / never happened.<\/p>\n<p>The principle / of British welfare / is no longer / that you can insure yourself / against the risk of unemployment / and receive unconditional payments / if the disaster happens.<\/p>\n<p>Even the very phrase / &quot;jobseeker&#39;s allowance&quot; / is about redefining / the unemployed / as a &quot;jobseeker&quot; / who had no fundamental right / to a benefit / he or she has earned / through making national insurance contributions.<\/p>\n<p>Instead, / the claimant receives / a time-limited &quot;allowance,&quot; / conditional on actively seeking a job; / no entitlement / and no insurance, / at £71.70 a week, / one of the least generous / in the EU.<\/p>\n<\/section>"},{"title":"第4段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第4段\n\n但在奥斯本的世界里，/ 你的第一本能 / 是陷入依赖 – / 永久的依赖 / 如果你能得到的话 – / 被一个国家支持 / 只是太愿意 / 纵容你的虚假。\n\n就好像 / 20年 / 越来越严格的改革 / 对求职和救济管理系统的 / 从未发生过。\n\n原则 / 英国福利的 / 不再是 / 你可以为自己投保 / 对抗失业风险 / 并获得无条件支付 / 如果灾难发生。\n\n甚至这个短语本身 / \"求职者津贴\" / 就是关于重新定义 / 失业者 / 作为一个\"求职者\" / 他没有基本权利 / 对救济金 / 他或她已经赚取的 / 通过缴纳国民保险。\n\n相反，/ 申请者获得 / 一个有时间限制的\"津贴\"，/ 以积极求职为条件；/ 没有权利 / 也没有保险，/ 每周71.70英镑，/ 最不慷慨之一 / 在欧盟。","context":{"focus":[94,2644,892,1189],"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-4"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>But in Osborneland, your first instinct is to fall into dependency – permanent dependency if you can get it – supported by a state only too ready to indulge your falsehood. It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens. Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions. Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>But in Osborneland, / your first instinct / is to fall into dependency – / permanent dependency / if you can get it – / supported by a state / only too ready / to indulge your falsehood.<\/p>\n<p>It is as though / 20 years / of ever-tougher reforms / of the job search and benefit administration system / never happened.<\/p>\n<p>The principle / of British welfare / is no longer / that you can insure yourself / against the risk of unemployment / and receive unconditional payments / if the disaster happens.<\/p>\n<p>Even the very phrase / &quot;jobseeker&#39;s allowance&quot; / is about redefining / the unemployed / as a &quot;jobseeker&quot; / who had no fundamental right / to a benefit / he or she has earned / through making national insurance contributions.<\/p>\n<p>Instead, / the claimant receives / a time-limited &quot;allowance,&quot; / conditional on actively seeking a job; / no entitlement / and no insurance, / at £71.70 a week, / one of the least generous / in the EU.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段<\/h3>\n<p>但在奥斯本的世界里，/ 你的第一本能 / 是陷入依赖 – / 永久的依赖 / 如果你能得到的话 – / 被一个国家支持 / 只是太愿意 / 纵容你的虚假。<\/p>\n<p>就好像 / 20年 / 越来越严格的改革 / 对求职和救济管理系统的 / 从未发生过。<\/p>\n<p>原则 / 英国福利的 / 不再是 / 你可以为自己投保 / 对抗失业风险 / 并获得无条件支付 / 如果灾难发生。<\/p>\n<p>甚至这个短语本身 / &quot;求职者津贴&quot; / 就是关于重新定义 / 失业者 / 作为一个&quot;求职者&quot; / 他没有基本权利 / 对救济金 / 他或她已经赚取的 / 通过缴纳国民保险。<\/p>\n<p>相反，/ 申请者获得 / 一个有时间限制的&quot;津贴&quot;，/ 以积极求职为条件；/ 没有权利 / 也没有保险，/ 每周71.70英镑，/ 最不慷慨之一 / 在欧盟。<\/p>\n<\/section>"},{"title":"第4段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第4段\n\n但在奥斯本的世界里，你的第一本能是陷入依赖——如果可能的话是永久依赖——被一个只太愿意纵容你虚假的国家所支持。就好像20年来对求职和救济管理系统越来越严格的改革从未发生过。英国福利的原则不再是你可以为自己投保对抗失业风险，并在灾难发生时获得无条件支付。甚至\"求职者津贴\"这个短语本身就是要重新定义失业者为\"求职者\"，他对通过缴纳国民保险而赚取的救济金没有基本权利。相反，申请者获得的是一个有时间限制的\"津贴\"，以积极求职为条件；没有权利，也没有保险，每周71.70英镑，是欧盟最不慷慨的之一。","context":{"focus":[94,2644,892,1189],"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-4"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true},"focusId":"focus-paragraph-4-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>But in Osborneland, your first instinct is to fall into dependency – permanent dependency if you can get it – supported by a state only too ready to indulge your falsehood. It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens. Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions. Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>But in Osborneland, / your first instinct / is to fall into dependency – / permanent dependency / if you can get it – / supported by a state / only too ready / to indulg focus":null,"mode":"image","asset":"articleAnnotated","label":"全文句内逻辑"},"meta":{},"html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n"},{"title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"section":"第二鸟 · 精读与翻译","raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n**第1段**\n\nIn order to：(\"change lives for the better\" + reduce \"dependency\") → George Osborne：(Chancellor of the Exchequer) → introduced → the \"upfront work search\" scheme.\n\nOnly if the jobless：(arrive at the jobcentre：(with a CV) + register for online job search + start looking for work) → will they be eligible：(for benefit) – and then they should report：(weekly // rather than fortnightly).\n\nWhat could be more reasonable?\n\n**第2段**\n\nMore apparent reasonableness → followed.\n\nThere will now be → a seven-day wait：(for the jobseeker's allowance).\n\n\"Those first few days → should be spent：(looking for work) // not looking to sign on\" → he claimed.\n\n\"We're doing these things → because we know：(they help people → stay off benefits + help those on benefits → get into work faster).\"\n\nHelp? // Really?\n\nOn first hearing → this was the socially concerned chancellor：(trying to change lives：(for the better))：(complete with \"reforms\"：(to an obviously indulgent system：(that demands too little effort：(from the newly unemployed)：(to find work) + subsidises laziness))).\n\nWhat motivated him：(we were to understand) → was his zeal：(for \"fundamental fairness\")：(protecting the taxpayer + controlling spending + ensuring：(that only the most deserving claimants → received their benefits)).\n\n**第3段**\n\nLosing a job → is hurting：you don't skip down：(to the jobcentre)：(with a song in your heart)：(delighted：(at the prospect：(of doubling your income：(from the generous state)))).\n\nIt is financially terrifying + psychologically embarrassing + you know：(that support is minimal + extraordinarily hard to get).\n\nYou are now not wanted; // you are now excluded：(from the work environment：(that offers purpose and structure：(in your life))).\n\nWorse → the crucial income：(to feed yourself and your family + pay the bills) → has disappeared.\n\nAsk anyone：(newly unemployed)：(what they want) → and the answer is always：a job.\n\n**第4段**\n\nBut in Osborneland → your first instinct → is to fall into dependency：(permanent dependency：(if you can get it))：(supported by a state：(only too ready：(to indulge your falsehood))).\n\nIt is as though：(20 years：(of ever-tougher reforms：(of the job search and benefit administration system))) → never happened.\n\nThe principle：(of British welfare) → is no longer：(that you can insure yourself：(against the risk of unemployment) + receive unconditional payments：(if the disaster happens)).\n\nEven the very phrase：\"jobseeker's allowance\" → is about redefining：(the unemployed)：(as a \"jobseeker\"：(who had no fundamental right：(to a benefit：(he or she has earned：(through making national insurance contributions))))).\n\nInstead → the claimant receives → a time-limited \"allowance\"：(conditional on actively seeking a job); // no entitlement + no insurance：(at £71.70 a week)：(one of the least generous：(in the EU)).","context":{"focus":null,"mode":"image","asset":"articleAnnotated","label":"全文句内逻辑"},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>In order to：(&quot;change lives for the better&quot; + reduce &quot;dependency&quot;) → George Osborne：(Chancellor of the Exchequer) → introduced → the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless：(arrive at the jobcentre：(with a CV) + register for online job search + start looking for work) → will they be eligible：(for benefit) – and then they should report：(weekly // rather than fortnightly).<\/p>\n<p>What could be more reasonable?<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>More apparent reasonableness → followed.<\/p>\n<p>There will now be → a seven-day wait：(for the jobseeker&#39;s allowance).<\/p>\n<p>&quot;Those first few days → should be spent：(looking for work) // not looking to sign on&quot; → he claimed.<\/p>\n<p>&quot;We&#39;re doing these things → because we know：(they help people → stay off benefits + help those on benefits → get into work faster).&quot;<\/p>\n<p>Help? // Really?<\/p>\n<p>On first hearing → this was the socially concerned chancellor：(trying to change lives：(for the better))：(complete with &quot;reforms&quot;：(to an obviously indulgent system：(that demands too little effort：(from the newly unemployed)：(to find work) + subsidises laziness))).<\/p>\n<p>What motivated him：(we were to understand) → was his zeal：(for &quot;fundamental fairness&quot;)：(protecting the taxpayer + controlling spending + ensuring：(that only the most deserving claimants → received their benefits)).<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>Losing a job → is hurting：you don&#39;t skip down：(to the jobcentre)：(with a song in your heart)：(delighted：(at the prospect：(of doubling your income：(from the generous state)))).<\/p>\n<p>It is financially terrifying + psychologically embarrassing + you know：(that support is minimal + extraordinarily hard to get).<\/p>\n<p>You are now not wanted; // you are now excluded：(from the work environment：(that offers purpose and structure：(in your life))).<\/p>\n<p>Worse → the crucial income：(to feed yourself and your family + pay the bills) → has disappeared.<\/p>\n<p>Ask anyone：(newly unemployed)：(what they want) → and the answer is always：a job.<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>But in Osborneland → your first instinct → is to fall into dependency：(permanent dependency：(if you can get it))：(supported by a state：(only too ready：(to indulge your falsehood))).<\/p>\n<p>It is as though：(20 years：(of ever-tougher reforms：(of the job search and benefit administration system))) → never happened.<\/p>\n<p>The principle：(of British welfare) → is no longer：(that you can insure yourself：(against the risk of unemployment) + receive unconditional payments：(if the disaster happens)).<\/p>\n<p>Even the very phrase：&quot;jobseeker&#39;s allowance&quot; → is about redefining：(the unemployed)：(as a &quot;jobseeker&quot;：(who had no fundamental right：(to a benefit：(he or she has earned：(through making national insurance contributions))))).<\/p>\n<p>Instead → the claimant receives → a time-limited &quot;allowance&quot;：(conditional on actively seeking a job); // no entitlement + no insurance：(at £71.70 a week)：(one of the least generous：(in the EU)).<\/p>\n"},{"title":"中文版句子逻辑（选修)","level":2,"section":"第二鸟 · 精读与翻译","raw":"## 中文版句子逻辑（选修)\n\n**第1段**\n\n为了：(\"让生活变得更好\" + 减少\"依赖性\") → 乔治·奥斯本：(财政大臣) → 引入了 → \"前期工作搜寻\"计划。\n\n只有当失业者：(到达就业中心：(带着简历) + 注册在线求职 + 开始找工作) → 他们才有资格：(获得救济金) – 然后他们应该汇报：(每周 // 而不是每两周)。\n\n还有什么能更合理呢？\n\n**第2段**\n\n更多表面上的合理性 → 随之而来。\n\n现在将有 → 七天的等待期：(对于求职者津贴)。\n\n\"最初的几天 → 应该用来：(找工作) // 而不是寻求登记领取救济\" → 他声称。\n\n\"我们做这些事情 → 因为我们知道：(它们帮助人们 → 远离救济 + 帮助那些领取救济的人 → 更快找到工作)。\"\n\n帮助？// 真的吗？\n\n乍一听 → 这是一位关心社会的大臣：(试图改变生活：(使其变得更好))：(配合\"改革\"：(对一个明显纵容的系统：(该系统要求太少努力：(从新失业者)：(去找工作) + 补贴懒惰)))。\n\n激励他的：(我们要理解的是) → 是他的热情：(对于\"根本的公平\")：(保护纳税人 + 控制支出 + 确保：(只有最值得的申请者 → 获得他们的救济金))。\n\n**第3段**\n\n失去工作 → 是痛苦的：你不会欢快地跳着：(去就业中心)：(心中唱着歌)：(高兴：(于前景：(让你的收入翻倍：(从慷慨的国家))))。\n\n这在经济上令人恐惧 + 心理上令人尴尬 + 你知道：(支持是最少的 + 极其难以获得)。\n\n你现在不被需要；// 你现在被排除在外：(从工作环境：(那提供目标和结构：(在你的生活中)))。\n\n更糟的是 → 关键的收入：(养活你自己和家人 + 支付账单) → 已经消失了。\n\n问任何人：(新近失业的)：(他们想要什么) → 答案总是：一份工作。\n\n**第4段**\n\n但在奥斯本的世界里 → 你的第一本能 → 是陷入依赖：(永久的依赖：(如果你能得到的话))：(被一个国家支持：(只是太愿意：(纵容你的虚假)))。\n\n就好像：(20年：(越来越严格的改革：(对求职和救济管理系统的))) → 从未发生过。\n\n原则：(英国福利的) → 不再是：(你可以为自己投保：(对抗失业风险) + 获得无条件支付：(如果灾难发生))。\n\n甚至这个短语本身：\"求职者津贴\" → 就是关于重新定义：(失业者)：(作为一个\"求职者\"：(他没有基本权利：(对救济金：(他或她已经赚取的：(通过缴纳国民保险)))))。\n\n相反 → 申请者获得 → 一个有时间限制的\"津贴\"：(以积极求职为条件)；// 没有权利 + 也没有保险：(每周71.70英镑)：(最不慷慨之一：(在欧盟))。","context":{"focus":null,"mode":"image","asset":"articleAnnotated","label":"全文句内逻辑"},"me 答案水平的译文。<\/li>\n<\/ol>\n"},{"title":"第1段第2句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 原文\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.","context":{"focus":[99,270,854,198],"mode":"image","asset":"articleAnnotated","label":"第1段第2句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-1"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-0","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第1段第2句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第一步：划分意群\n\n> Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.","context":{"focus":[99,270,854,198],"mode":"image","asset":"articleAnnotated","label":"第1段第2句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-1"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-1","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Only if the jobless / arrive at the ,"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-1"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-3","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Only if the jobless / arrive at the jobcentre / with a CV, / register for online job search, / and start looking for work / will they be eligible / for benefit – / and then they should report / weekly / rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>只有当失业者 / 到达就业中心 / 带着简历，/ 注册在线求职，/ 并开始找工作 / 他们才有资格 / 获得救济金 – / 然后他们应该汇报 / 每周 / 而不是每两周。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把失业者必须完成的三件事并列放在一起：<\/p>\n<blockquote>\n<p>失业者带着简历到就业中心、注册在线求职并开始找工作<\/p>\n<\/blockquote>\n<p>把资格与前面的条件接起来，保留“只有……才……”的限制：<\/p>\n<blockquote>\n<p>只有完成这些事情，才有资格获得救济金<\/p>\n<\/blockquote>\n<p>后半句是在补充领取之后的汇报频率，单独收成一块：<\/p>\n<blockquote>\n<p>然后应该每周汇报，而不是每两周汇报<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>失业者带着简历到就业中心、注册在线求职并开始找工作<br>只有这样才有资格获得救济金<br>然后应该每周而不是每两周汇报<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第1段第2句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 失业者只有完成规定的求职行动，才有资格获得救济金；随后还应该按规定汇报。\n\n先将三项求职行动全部放进“只有”与“才”之间，再把汇报时间接在后面。“每周”与“每两周”必须同时保留，才能看出要求怎样收紧。\n\n按照中文语序调整后是：\n\n> 失业者只有带着简历到就业中心、注册在线求职并开始找工作，才有资格获得救济金；然后他们应该每周汇报，而不是每两周汇报。","context":{"focus":[99,270,854,198],"mode":"image","asset":"articleAnnotated","label":"第1段第2句","sourceW":1080,"sourceH":6116,"focus 平”的热情，这种热情体现在保护纳税人、控制支出，以及确保只有最值得的申请者获得救济金。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第2段第7句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- “这种热情体现在”解释过长，用破折号直接引出三项具体内容。\n- “以及确保”整理为“并确保”，与前面两项行动连接更紧凑。\n- 保留“根本公平”的引号和开头的转述口气，避免把人物自述写成作者的直接认同。\n\n参考译文：\n\n> 我们要理解的是，激励他的是对\"根本公平\"的热情——保护纳税人、控制支出并确保只有最值得的申请者获得救济金。","context":{"focus":[99,1121,854,265],"mode":"image","asset":"articleAnnotated","label":"第2段第7句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-3"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":true},"focusId":"focus-long-3-5","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文<\/h3>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>What motivated him, / we were to understand, / was his zeal / for &quot;fundamental fairness&quot; – / protecting the taxpayer, / controlling spending / and ensuring / that only the most deserving claimants / received their benefits.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>激励他的，/ 我们要理解的是，/ 是他的热情 / 对于&quot;根本的公平&quot; – / 保护纳税人，/ 控制支出 / 并确保 / 只有最值得的申请者 / 获得他们的救济金。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把中间的提醒放到前面：<\/p>\n<blockquote>\n<p>我们要理解的是<\/p>\n<\/blockquote>\n<p>将“热情”与它指向的原则接起来：<\/p>\n<blockquote>\n<p>激励他的是对“根本公平”的热情<\/p>\n<\/blockquote>\n<p>后面的三项行动都在说明这种公平，按并列关系合并：<\/p>\n<blockquote>\n<p>保护纳税人、控制支出，并确保只有最值得的申请者获得救济金<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>我们要理解的是<br>激励他的是对“根本公平”的热情<br>保护纳税人、控制支出，并确保只有最值得的申请者获得救济金<\/p>\n<\/ n<blockquote>\n<p>甚至这个短语本身 / &quot;求职者津贴&quot; / 就是关于重新定义 / 失业者 / 作为一个&quot;求职者&quot; / 他没有基本权利 / 对救济金 / 他或她已经赚取的 / 通过缴纳国民保险。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把短语名称与“短语本身”合并：<\/p>\n<blockquote>\n<p>甚至“求职者津贴”这个短语本身<\/p>\n<\/blockquote>\n<p>把重新定义的对象和新身份接起来：<\/p>\n<blockquote>\n<p>要把失业者重新定义为“求职者”<\/p>\n<\/blockquote>\n<p>后半句先说救济金怎样得到，再说这种新身份没有什么权利：<\/p>\n<blockquote>\n<p>他对通过缴纳国民保险而赚取的救济金没有基本权利<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>甚至“求职者津贴”这个短语本身<br>要把失业者重新定义为“求职者”<br>他对通过缴纳国民保险而赚取的救济金没有基本权利<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>这个短语把失业者重新定义为没有基本救济权利的“求职者”。<\/p>\n<\/blockquote>\n<p>先说明名称在重新定义身份，再接这种身份的权利变化。把“通过缴纳国民保险而赚取的”放在“救济金”前，明确以前的缴费与现在失去的权利指向同一笔保障。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>甚至“求职者津贴”这个短语本身，就是要把失业者重新定义为“求职者”；这个求职者对自己通过缴纳国民保险而赚取的救济金没有基本权利。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第4段第4句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- “要把失业者重新定义为”整理为“要重新定义失业者为”，保持短语层次紧凑。\n- 后半句的“这个求职者”换成“他”，减少身份名称的重复。\n- 保留“没有基本权利”与此前缴费取得救济金的对照，不能淡化成暂时不方便领取。\n\n参考译文：\n\n> 甚至\"求职者津贴\"这个短语本身就是要重新定义失业者为\"求职者\"，他对通过缴纳国民保险而赚取的救济金没有基本权利。","context":{"focus":[99,3132,870,265],"mode":"image","asset":"articleAnnotated","label":"第4段第4句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":true},"focusId":"focus-long-6-5","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Even the very phrase &quot;jobseeker&#39;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance contributions.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"fo 词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1532,"sourceH":2542},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n**To which of the following would the author most probably agree?**\n\n作者最可能同意以下哪一项？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Unemployment benefits should not be made conditional.**\n\n失业补助不应附加条件。\n\nB. **The British welfare system indulges jobseekers’ laziness.**\n\n英国福利制度纵容求职者懒惰。\n\nC. **The jobseekers’ allowance has met their actual needs.**\n\n求职者补助已经满足了他们的实际需要。\n\nD. **Osborne’s reforms will reduce the risk of unemployment.**\n\n奥斯本的改革将降低失业风险。\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍奥斯本的求职计划：领补助前必须带简历、网上登记并开始求职，之后每周报到 | 先摆出一项看似合理的新安排 |\n| 2 | 继续列出七天等待和“帮助就业”的说法，随后转而追问其动机并落到纳税人和开支 | 再把表面说法拆开来看 |\n| 3 | 详细写失业带来的经济恐惧、心理难堪、工作身份丧失以及基本收入消失 | 接着放入现实处境作对照 |\n| 4 | 批评奥斯本把失业者想成依赖者，并指出福利从保险权利变成附条件、限时且很低的补助 | 最后下结论：原先说法已经变了 |","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[4,2117,1441,421],"sourceW":1532,"sourceH":2542},"meta":{"kind":"question","question":25},"level":2,"html":"<p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>作者最可能同意以下哪一项？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Unemployment benefits should not be made conditional.<\/strong><\/p>\n<p>失业补助不应附加条件。<\/p>\n<p>B. <strong>The British welfare system indulges jobseekers’ laziness.<\/strong><\/p>\n<p>英国福利制度纵容求职者懒惰。<\/p>\n<p>C. <strong>The jobseekers’ allowance has met their actual needs.<\/strong><\/p>\n<p>求职者补助已经满足了他们的实际需要。<\/p>\n<p>D. <strong>Osborne’s reforms will reduce the risk of unemployment.<\/strong><\/p>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍奥斯本的求职计划：领补助前必须带简历、网上登记并开始求职，之后每周报到<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>继续列出七天等待和“帮助就业”的说法，随后转而追问其动机并落到纳税人和开支<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>详细写失业带来的经济恐惧、心理难堪、工作身份丧失以及基本收入消失<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>批评奥斯本把失业者想成依赖者，并指出福利从保险权利变成附条件、限时且很低的补助<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n"},{"title":"A. Unemployment benefits should not be made conditional.","raw":"**To which of the following would the author most probably agree?**\n\n### A. Unemployment benefits should not be made conditional.\n\n失业补助不应附加条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 A选项","focus":[84,2209,1219,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":25,"option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q25-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-A-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>失业补助不应附加条件。<\/p>\n<\/section>"},{"title":"A. Unemployment benefits should not be made conditional.","raw":"#### 如果 A 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n失业补助不应附加条件。\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍把提交简历、开始求职设为领补助前提，并要求领取后定期报到的新安排，呈现其鼓励就业的合理外观，为讨论这些附加条件是否正当提出具体对象。 | 先摆出一项看似合理的新安排 |\n| 2 | 拆开“帮助失业者”的说法，说明增设等待期和申领门槛主要方便控制给付，却不能据此取消失业者原本享有的保险保障。 | 再把表面说法拆开来看 |\n| 3 | 把收入骤失、维持家庭开支的压力和领取支持的困难放在这些门槛旁边，说明真正需要保障的人不应先证明自己足够值得帮助。 | 接着放入现实处境作对照 |\n| 4 | 归结为福利性质的变化：原先为失业风险提供保障的保险权利，已经被改成附条件给付；因此应反对把失业补助这样条件化。 | 最后下结论：原先说法已经变了 |\n\n第一段确实先列出领取补助的求职条件；第二段的`Help? Really?`和纳税人、开支说明，又拆开了“帮助失业者”的外观。第三段写收入消失、支持少且难拿，让读者看到这些条件落在怎样的人身上。结尾更直接把`unconditional payments`与`conditional on actively seeking a job`相对照，批评保险权利被改成限时、附条件的补助。A的主张正好落在这条由政策外观走向权利变化的推进上。\n\n这里的“不应附加条件”针对文中把原有失业保险权利变成求职表现前提的做法；不需要再推成作者否认任何申请资格或行政程序。\n\n判断：\n\n**A 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 A选项","focus":[84,2209,1219,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":25,"option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q25-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-A-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>失业补助不应附加条件。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-A-1\"><h3>如果 A 是主旨，文章4段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>失业补助不应附加条件。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍把提交简历、开始求职设为领补助前提，并要求领取后定期报到的新安排，呈现其鼓励就业的合理外观，为讨论这些附加条件是否正当提出具体对象。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“帮助失业者”的说法，说明增设等待期和申领门槛主要方便控制给付，却不能据此取消失业者原本享有的保险保障。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>把收入骤失、维持家庭开支的压力和领取支持的困难放在这些门槛旁边，说明真正需要保障的人不应先证明自己足够值得帮助。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>归结为福利性质的变化：原先为失业风险提供保障的保险权利，已经被改成附条件给付；因此应反对把失业补助这样条件化。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>第一段确实先列出领取补助的求职条件；第二段的<code>Help? Really?<\/code>和纳税人、开支说明，又拆开了“帮助失业者”的外观。第三段写收入消失、支持少且难拿，让读者看到这些条件落在怎样的人身上。结尾更直接把<code>unconditional payments<\/code>与<code>conditional on actively seeking a job<\/code>相对照，批评保险权利被改成限时、附条件的补助。A的主张正好落在这条由政策外观走向权利变化的推进上。<\/p>\n<p>这里的“不应附加条件”针对文中把原有失业保险权利变成求职表现前提的做法；不需要再推成作者否认任何申请资格或行政程序。<\/p>\n<p>判断：<\/p>\n<p><strong>A 保留。<\/strong><\/p>\n<\/section>"},{"title":"B. The British welfare system indulges jobseekers’ laziness.","raw":"**To which of the following would the author most probably agree?**\n\n### B. The British welfare system indulges jobseekers’ laziness.\n\n英国福利制度纵容求职者懒惰。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 B选项","focus":[84,2297,1227,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":25,"option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q25-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-B-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>英国福利制度纵容求职者懒惰。<\/p>\n<\/section>"},{"title":"B. The British welfare system indulges jobseekers’ laziness.","raw":"#### 如果 B 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n英国福利制度纵容求职者懒惰。\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍一项以补助配合求职登记、看似能够促人就业的新安排，让读者看到福利制度对外宣称鼓励求职的面貌。 | 先摆出一项看似合理的新安排 |\n| 2 | 拆开“补助促人就业”的表面说法，说明制度仍让持续领取补助比努力求职更有吸引力，从而把保障生活变成了纵容懒惰。 | 再把表面说法拆开来看 |\n| 3 | 用有合适岗位却不愿申请、靠补助维持闲居的求职者处境，对照制度宣称的就业激励，具体呈现福利纵容不求职行为的结果。 | 接着放入现实处境作对照 |\n| 4 | 总结原先所说的临时帮助人重返工作，已经变成对长期不愿求职的容忍；制度虽然仍称鼓励就业，其实际作用却是纵容懒惰。 | 最后下结论：原先说法已经变了 |\n\nB需要第三段真的写出求职者不愿工作、领取补助很舒适，末段再由作者认定福利鼓励懒惰。实际第三段却否认失业者会高高兴兴去领钱，写出的是经济恐惧、心理难堪和“想要一份工作”。第四段把“本能就是依赖”的想象放在`Osborneland`中，随即批评无条件保险权利消失。第二段确实有`subsidises laziness`，但它属于作者正在拆解的政府说法。B把被质疑的说法当成了作者要维护的判断。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 B选项","focus":[84,2297,1227,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":25,"option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q25-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-B-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>英国福利制度纵容求职者懒惰。<\/p>\n<\/section><section clas
