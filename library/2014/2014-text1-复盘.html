 |\n| 1 | 先介绍一项重新安排求职者补助额度与发放流程的措施，呈现其既管理求职又保障基本生活的合理外观。 | 先摆出一项看似合理的新安排 |\n| 2 | 拆开“补助足以生活”的表面说法，逐项核对金额、到账时间与开支项目，说明充足保障具体落实在食品、住房和家庭账单上。 | 再把表面说法拆开来看 |\n| 3 | 把失业者真实的食宿、赡养和日常支出与实际收到的补助并列，展示这些需求已由给付覆盖，而非只看名义上的补助金额。 | 接着放入现实处境作对照 |\n| 4 | 总结补助从过去只能缓解部分压力，变成现已覆盖求职者实际需要的保障；对补助不足的旧判断应随着这种变化修正。 | 最后下结论：原先说法已经变了 |\n\nC的关键不是补助有没有存在，而是它已经满足实际需要。实际第三段说`support is minimal and extraordinarily hard to get`，随后又写维持家庭生活的收入已经消失；结尾还说每周71.70英镑是欧盟最不慷慨的给付之一。这些段落共同解释现有保障为什么不足以让人安心，不能支持“已经满足”的结论。第一、二段谈条件和等待期，也不是在证明这些安排已经覆盖全部现实需求。\n\n判断：\n\n**C 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 C选项","focus":[84,2385,1165,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":25,"option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q25-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-C-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>求职者补助已经满足了他们的实际需要。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-C-1\"><h3>如果 C 是主旨，文章4段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>求职者补助已经满足了他们的实际需要。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍一项重新安排求职者补助额度与发放流程的措施，呈现其既管理求职又保障基本生活的合理外观。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“补助足以生活”的表面说法，逐项核对金额、到账时间与开支项目，说明充足保障具体落实在食品、住房和家庭账单上。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>把失业者真实的食宿、赡养和日常支出与实际收到的补助并列，展示这些需求已由给付覆盖，而非只看名义上的补助金额。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>总结补助从过去只能缓解部分压力，变成现已覆盖求职者实际需要的保障；对补助不足的旧判断应随着这种变化修正。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>C的关键不是补助有没有存在，而是它已经满足实际需要。实际第三段说<code>support is minimal and extraordinarily hard to get<\/code>，随后又写维持家庭生活的收入已经消失；结尾还说每周71.70英镑是欧盟最不慷慨的给付之一。这些段落共同解释现有保障为什么不足以让人安心，不能支持“已经满足”的结论。第一、二段谈条件和等待期，也不是在证明这些安排已经覆盖全部现实需求。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<\/section>"},{"title":"D. Osborne’s reforms will reduce the risk of unemployment.","raw":"**To which of the following would the author most probably agree?**\n\n### D. Osborne’s reforms will reduce the risk of unemployment.\n\n奥斯本的改革将降低失业风险。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 D选项","focus":[84,2473,1238,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":25,"option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q25-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-D-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<\/section>"},{"title":"D. Osborne’s reforms will reduce the risk of unemployment.","raw":"#### 如果 D 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n奥斯本的改革将降低失业风险。\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍奥斯本把求职辅导、岗位匹配和就业跟踪结合起来的新安排，呈现改革能够让劳动者更不容易陷入失业的合理设想。 | 先摆出一项看似合理的新安排 |\n| 2 | 拆开“改革会降低失业风险”的口号，说明岗位匹配和就业跟踪如何提前识别工作不稳定的环节，并减少劳动者随后失去工作的可能。 | 再把表面说法拆开来看 |\n| 3 | 把接受改革服务和未接受服务的相似劳动者就业稳定性作对照，呈现前者随后失去工作的概率较低，以现实结果支撑风险下降。 | 接着放入现实处境作对照 |\n| 4 | 总结制度由失业发生后的被动给付，变成能够在事前降低失业概率的就业支持；原先只补偿失业后果的做法已变成预防风险。 | 最后下结论：原先说法已经变了 |\n\nD要求文章追踪改革对失业风险的影响，关键证据应是求职支持怎样减少失业及其实际效果。第一、二段虽然引用政府“更快就业”的理由，却马上用`Help? Really?`质疑；第三段写的是失业者眼下的痛苦，没有比较改革前后的风险。结尾的`insure yourself against the risk of unemployment`说的是为失业后果提供保险，不是让失业本身更少发生。作者最终批评保障权利被收紧，并未预测奥斯本的改革会降低失业风险。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 D选项","focus":[84,2473,1238,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":25,"option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q25-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-D-0\"><p><strong>To which of the following would the author most probably agree?<\/strong><\/p>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-D-1\"><h3>如果 D 是主旨，文章4段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>奥斯本的改革将降低失业风险。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍奥斯本把求职辅导、岗位匹配和就业跟踪结合起来的新安排，呈现改革能够让劳动者更不容易陷入失业的合理设想。<\/td>\n<td>先摆出一项看似合理的新安排<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>拆开“改革会降低失业风险”的口号，说明岗位匹配和就业跟踪如何提前识别工作不稳定的环节，并减少劳动者随后失去工作的可能。<\/td>\n<td>再把表面说法拆开来看<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>把接受改革服务和未接受服务的相似劳动者就业稳定性作对照，呈现前者随后失去工作的概率较低，以现实结果支撑风险下降。<\/td>\n<td>接着放入现实处境作对照<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>总结制度由失业发生后的被动给付，变成能够在事前降低失业概率的就业支持；原先只补偿失业后果的做法已变成预防风险。<\/td>\n<td>最后下结论：原先说法已经变了<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>D要求文章追踪改革对失业风险的影响，关键证据应是求职支持怎样减少失业及其实际效果。第一、二段虽然引用政府“更快就业”的理由，却马上用<code>Help? Really?<\/code>质疑；第三段写的是失业者眼下的痛苦，没有比较改革前后的风险。结尾的<code>insure yourself against the risk of unemployment<\/code>说的是为失业后果提供保险，不是让失业本身更少发生。作者最终批评保障权利被收紧，并未预测奥斯本的改革会降低失业风险。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<\/section>"},{"title":"25题结论","raw":"### 25题结论\n\n**25. A. Unemployment benefits should not be made conditional.**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Unemployment benefits should not be made conditional. / 失业补助不应附加条件。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[4,2117,1441,421],"sourceW":1532,"sourceH":2542},"meta":{"kind":"conclusion","question":25},"level":3,"html":"<p><strong>25. A. Unemployment benefits should not be made conditional.<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Unemployment benefits should not be made conditional. / 失业补助不应附加条件。<\/strong><\/p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> George Osborne’s scheme was intended to ______.\n>\n> 乔治·奥斯本的计划旨在做什么？\n\n### 题型\n\n这是一道局部目的题。题干锁定奥斯本的计划，问政策打算推动失业者做什么；需要区分政策的行动目标、具体执行手续，以及作者对政策是否合理的评价。\n\n### 核心出处\n\n> In order to \"change lives for the better\" and reduce \"dependency\", George Osborne, Chancellor of the Exchequer, introduced the \"upfront work search\" scheme.\n>\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.\n\n第一句的`In order to`交代宣称的目的，第二句列出带简历、网上登记、开始求职和定期报到等具体要求。它们一起说明方案如何促使求职者采取行动，但没有证明方案已经产生就业效果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[4,4,1293,421],"sourceW":1532,"sourceH":2542},"meta":{"kind":"question","question":21},"level":2,"html":"<blockquote>\n<p>George Osborne’s scheme was intended to ______.<\/p>\n<p>乔治·奥斯本的计划旨在做什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部目的题。题干锁定奥斯本的计划，问政策打算推动失业者做什么；需要区分政策的行动目标、具体执行手续，以及作者对政策是否合理的评价。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<p>第一句的<code>In order to<\/code>交代宣称的目的，第二句列出带简历、网上登记、开始求职和定期报到等具体要求。它们一起说明方案如何促使求职者采取行动，但没有证明方案已经产生就业效果。<\/p>\n"},{"title":"A. motivate the unemployed to report voluntarily","raw":"### A. motivate the unemployed to report voluntarily\n\n> 促使失业者自愿报到\n\n**做题模式中的状态：** 当时`report voluntarily`完整可见，原文也能读到`Only if`列出的求职条件和`report weekly`；虽然`fortnightly`显示为`[xxx]`，仍能看出报到是要求，第一轮就排除了A。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用了原文的`report`，把政策规定的后续报到改成了`report voluntarily`，即自愿报到。计划借补助资格推动求职，不能用其中一项必须履行的报到手续，改写成鼓励自愿报到的目的。\n\n**出处：**\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[84,95,1010,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q21-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>report voluntarily<\/code>完整可见，原文也能读到<code>Only if<\/code>列出的求职条件和<code>report weekly<\/code>；虽然<code>fortnightly<\/code>显示为<code>[xxx]<\/code>，仍能看出报到是要求，第一轮就排除了A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的<code>report<\/code>，把政策规定的后续报到改成了<code>report voluntarily<\/code>，即自愿报到。计划借补助资格推动求职，不能用其中一项必须履行的报到手续，改写成鼓励自愿报到的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. motivate the unemployed to report voluntarily","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 乔治·奥斯本的计划旨在促使失业者自愿报到。\n\n题干的`scheme`指第一段的`upfront work search`计划；A中的`report`对应第二句后半部分的`they should report weekly rather than fortnightly`。这里要比较的是报到怎样被安排，而不是只看两处有没有同一个动词。\n\n前半句先用`Only if`列出获得补助资格的必要条件，后半句用`and then`接上每周报到要求。主语始终是申请补助的失业者，报到频率由计划规定；`should`在这项政策描述里表达他们应当履行的事项。\n\nA增加的`voluntarily`改变了行为的性质。原文要求申请者按规定报到，没有把自愿到场设为政策目的；重复`report`不能保留这层区别。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[84,95,1010,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q21-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>report voluntarily<\/code>完整可见，原文也能读到<code>Only if<\/code>列出的求职条件和<code>report weekly<\/code>；虽然<code>fortnightly<\/code>显示为<code>[xxx]<\/code>，仍能看出报到是要求，第一轮就排除了A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的<code>report<\/code>，把政策规定的后续报到改成了<code>report voluntarily<\/code>，即自愿报到。计划借补助资格推动求职，不能用其中一项必须履行的报到手续，改写成鼓励自愿报到的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在促使失业者自愿报到。<\/p>\n<\/blockquote>\n<p>题干的<code>scheme<\/code>指第一段的<code>upfront work search<\/code>计划；A中的<code>report<\/code>对应第二句后半部分的<code>they should report weekly rather than fortnightly<\/code>。这里要比较的是报到怎样被安排，而不是只看两处有没有同一个动词。<\/p>\n<p>前半句先用<code>Only if<\/code>列出获得补助资格的必要条件，后半句用<code>and then<\/code>接上每周报到要求。主语始终是申请补助的失业者，报到频率由计划规定；<code>should<\/code>在这项政策描述里表达他们应当履行的事项。<\/p>\n<p>A增加的<code>voluntarily<\/code>改变了行为的性质。原文要求申请者按规定报到，没有把自愿到场设为政策目的；重复<code>report<\/code>不能保留这层区别。<\/p>\n<\/section>"},{"title":"A. motivate the unemployed to report voluntarily","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.\n>\n> 领补助先要满足求职要求，之后还应按每周一次的频率报到。\n\n作者从资格条件接着写办理者必须遵守的频率，呈现的是一套连续的政策约束。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The scheme encourages the unemployed to report voluntarily, without making regular reports a condition of receiving benefit.\n>\n> 这项计划鼓励失业者自愿报到，而不把定期报到作为领取补助的条件。\n\nA成立时需要把“规定应怎样报到”改成“鼓励但由本人自愿报到”。实际句子用`should report weekly rather than fortnightly`收紧频率，没有转向自愿选择。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[84,95,1010,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q21-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>report voluntarily<\/code>完整可见，原文也能读到<code>Only if<\/code>列出的求职条件和<code>report weekly<\/code>；虽然<code>fortnightly<\/code>显示为<code>[xxx]<\/code>，仍能看出报到是要求，第一轮就排除了A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的<code>report<\/code>，把政策规定的后续报到改成了<code>report voluntarily<\/code>，即自愿报到。计划借补助资格推动求职，不能用其中一项必须履行的报到手续，改写成鼓励自愿报到的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在促使失业者自愿报到。<\/p>\n<\/blockquote>\n<p>题干的<code>scheme<\/code>指第一段的<code>upfront work search<\/code>计划；A中的<code>report<\/code>对应第二句后半部分的<code>they should report weekly rather than fortnightly<\/code>。这里要比较的是报到怎样被安排，而不是只看两处有没有同一个动词。<\/p>\n<p>前半句先用<code>Only if<\/code>列出获得补助资格的必要条件，后半句用<code>and then<\/code>接上每周报到要求。主语始终是申请补助的失业者，报到频率由计划规定；<code>should<\/code>在这项政策描述里表达他们应当履行的事项。<\/p>\n<p>A增加的<code>voluntarily<\/code>改变了行为的性质。原文要求申请者按规定报到，没有把自愿到场设为政策目的；重复<code>report<\/code>不能保留这层区别。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>领补助先要满足求职要求，之后还应按每周一次的频率报到。<\/p>\n<\/blockquote>\n<p>作者从资格条件接着写办理者必须遵守的频率，呈现的是一套连续的政策约束。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme encourages the unemployed to report voluntarily, without making regular reports a condition of receiving benefit.<\/p>\n<p>这项计划鼓励失业者自愿报到，而不把定期报到作为领取补助的条件。<\/p>\n<\/blockquote>\n<p>A成立时需要把“规定应怎样报到”改成“鼓励但由本人自愿报到”。实际句子用<code>should report weekly rather than fortnightly<\/code>收紧频率，没有转向自愿选择。<\/p>\n<\/section>"},{"title":"A. motivate the unemployed to report voluntarily","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。\n\n但A实际说的是：\n\n> motivate the unemployed to report voluntarily  \n> 促使失业者自愿报到\n\n主旨批评补助被条件化，与第一段所列的要求能够衔接；A却把其中的报到要求说成自愿行为。本项最终仍要根据`they should report weekly rather than fortnightly`判断行为性质，主旨本身不能告诉我们规定的报到频率。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[84,95,1010,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q21-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>report voluntarily<\/code>完整可见，原文也能读到<code>Only if<\/code>列出的求职条件和<code>report weekly<\/code>；虽然<code>fortnightly<\/code>显示为<code>[xxx]<\/code>，仍能看出报到是要求，第一轮就排除了A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的<code>report<\/code>，把政策规定的后续报到改成了<code>report voluntarily<\/code>，即自愿报到。计划借补助资格推动求职，不能用其中一项必须履行的报到手续，改写成鼓励自愿报到的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在促使失业者自愿报到。<\/p>\n<\/blockquote>\n<p>题干的<code>scheme<\/code>指第一段的<code>upfront work search<\/code>计划；A中的<code>report<\/code>对应第二句后半部分的<code>they should report weekly rather than fortnightly<\/code>。这里要比较的是报到怎样被安排，而不是只看两处有没有同一个动词。<\/p>\n<p>前半句先用<code>Only if<\/code>列出获得补助资格的必要条件，后半句用<code>and then<\/code>接上每周报到要求。主语始终是申请补助的失业者，报到频率由计划规定；<code>should<\/code>在这项政策描述里表达他们应当履行的事项。<\/p>\n<p>A增加的<code>voluntarily<\/code>改变了行为的性质。原文要求申请者按规定报到，没有把自愿到场设为政策目的；重复<code>report<\/code>不能保留这层区别。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>领补助先要满足求职要求，之后还应按每周一次的频率报到。<\/p>\n<\/blockquote>\n<p>作者从资格条件接着写办理者必须遵守的频率，呈现的是一套连续的政策约束。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme encourages the unemployed to report voluntarily, without making regular reports a condition of receiving benefit.<\/p>\n<p>这项计划鼓励失业者自愿报到，而不把定期报到作为领取补助的条件。<\/p>\n<\/blockquote>\n<p>A成立时需要把“规定应怎样报到”改成“鼓励但由本人自愿报到”。实际句子用<code>should report weekly rather than fortnightly<\/code>收紧频率，没有转向自愿选择。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>motivate the unemployed to report voluntarily<br>促使失业者自愿报到<\/p>\n<\/blockquote>\n<p>主旨批评补助被条件化，与第一段所列的要求能够衔接；A却把其中的报到要求说成自愿行为。本项最终仍要根据<code>they should report weekly rather than fortnightly<\/code>判断行为性质，主旨本身不能告诉我们规定的报到频率。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. provide the unemployed with easier access to benefits","raw":"### B. provide the unemployed with easier access to benefits\n\n> 让失业者更容易获得补助\n\n**做题模式中的状态：** 当时能读到带简历、网上登记、开始求职以及每周报到这一组条件；把它们与`easier access to benefits`相比，发现不是领取更容易，第一轮就排除了B。\n\n**错误类型：第一类——歪曲原意。**\n\nB保留了补助这个对象，却把政策设置求职前提的方向改成让人更容易领取。第一段的`Only if`在限定资格，不是在承诺简化申领或扩大可领取范围。\n\n**出处：**\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 B选项","focus":[84,183,1169,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q21-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>让失业者更容易获得补助<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时能读到带简历、网上登记、开始求职以及每周报到这一组条件；把它们与<code>easier access to benefits<\/code>相比，发现不是领取更容易，第一轮就排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B保留了补助这个对象，却把政策设置求职前提的方向改成让人更容易领取。第一段的<code>Only if<\/code>在限定资格，不是在承诺简化申领或扩大可领取范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. provide the unemployed with easier access to benefits","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 乔治·奥斯本的计划旨在让失业者更容易获得补助。\n\nB的`access to benefits`对应原文`eligibl  looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>第二段继续列出七天等待期，并要求最初几天找工作，不要忙着申领补助。<\/p>\n<\/blockquote>\n<p>第一段的前置求职要求之后，作者再列出推迟申领的安排，补助入口继续受限。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme removes preliminary requirements and shortens the wait so that the unemployed can obtain benefits more easily.<\/p>\n<p>这项计划取消前置要求、缩短等待，让失业者能够更容易拿到补助。<\/p>\n<\/blockquote>\n<p>B所需的后文应呈现获取补助变容易的具体措施。实际后文选择七天等待和先找工作的要求，说明政策优先推动求职，没有沿着方便领钱的路线推进。<\/p>\n<\/section>"},{"title":"B. provide the unemployed with easier access to benefits","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。\n\n但B实际说的是：\n\n> provide the unemployed with easier access to benefits  \n> 让失业者更容易获得补助\n\n作者反对补助被设更多前提，B却把这项政策描述成方便失业者获取补助，政策方向不一致。具体条件仍须看`Only if`和七天等待期；不能仅凭作者反对改革，就推断改革的任何一个细节都更严。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 B选项","focus":[84,183,1169,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q21-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>让失业者更容易获得补助<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时能读到带简历、网上登记、开始求职以及每周报到这一组条件；把它们与<code>easier access to benefits<\/code>相比，发现不是领取更容易，第一轮就排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B保留了补助这个对象，却把政策设置求职前提的方向改成让人更容易领取。第一段的<code>Only if<\/code>在限定资格，不是在承诺简化申领或扩大可领取范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-1\" or work`也能读懂。做题材料据此把C理解为推动积极求职，第一轮留下C，其他三项排除后确定了C。\n\n**选项类型：正确同义改写。**\n\n`engagement in`表示参与，`active engagement in job seeking`就是积极投入求职。它把带简历、登记网上求职和开始找工作这一组要求概括为主动参与求职，没有把计划的目标扩大为保证就业成功。\n\n**出处：**\n\n> In order to \"change lives for the better\" and reduce \"dependency\", George Osborne, Chancellor of the Exchequer, introduced the \"upfront work search\" scheme.\n>\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[84,272,1209,60],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q21-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>engagement<\/code>显示为<code>[xxx]<\/code>，但<code>active<\/code>和<code>job seeking<\/code>可见，原文<code>start looking for work<\/code>也能读懂。做题材料据此把C理解为推动积极求职，第一轮留下C，其他三项排除后确定了C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>engagement in<\/code>表示参与，<code>active engagement in job seeking<\/code>就是积极投入求职。它把带简历、登记网上求职和开始找工作这一组要求概括为主动参与求职，没有把计划的目标扩大为保证就业成功。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. encourage jobseekers’ active engagement in job seeking","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 乔治·奥斯本的计划旨在鼓励求职者积极参与求职。\n\n题干问计划的目的，第一句的`In order to`先给出改善生活、减少依赖的宣称，第二句的`start looking for work`说明计划打算让求职者采取怎样的具体行动。C的`job seeking`与这个动作相对应。\n\n第一句确定政策想减少对补助的依赖，第二句把实际求职放在领补助之前，并辅以简历、网上登记和定期报到。把这两句接起来，措施是在促使申请者投入寻找工作的过程。\n\nC准确概括这项行动目标。`encourage`在这里说政策推动人去做什么，不表示参加完全自愿，也不表示作者赞成这些手段；`job seeking`同样不等于已经找到工作。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[84,272,1209,60],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q21-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>engagement<\/code>显示为<code>[xxx]<\/code>，但<code>active<\/code>和<code>job seeking<\/code>可见，原文<code>start looking for work<\/code>也能读懂。做题材料据此把C理解为推动积极求职，第一轮留下C，其他三项排除后确定了C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>engagement in<\/code>表示参与，<code>active engagement in job seeking<\/code>就是积极投入求职。它把带简历、登记网上求职和开始找工作这一组要求概括为主动参与求职，没有把计划的目标扩大为保证就业成功。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在鼓励求职者积极参与求职。<\/p>\n<\/blockquote>\n<p>题干问计划的目的，第一句的<code>In order to<\/code>先给出改善生活、减少依赖的宣称，第二句的<code>start looking for work<\/code>说明计划打算让求职者采取怎样的具体行动。C的<code>job seeking<\/code>与这个动作相对应。<\/p>\n<p>第一句确定政策想减少对补助的依赖，第二句把实际求职放在领补助之前，并辅以简历、网上登记和定期报到。把这两句接起来，措施是在促使申请者投入寻找工作的过程。<\/p>\n<p>C准确概括这项行动目标。<code>encourage<\/code>在这里说政策推动人去做什么，不表示参加完全自愿，也不表示作者赞成这些手段；<code>job seeking<\/code>同样不等于已经找到工作。<\/p>\n<\/section>"},{"title":"C. encourage jobseekers’ active engagement in job seeking","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.\n>\n> \"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\"\n>\n> 前文把求职设为条件，后文又引用政府希望领补助者更快就业的说明。\n\n政策的具体做法和政府解释，都把申请者由领取补助引向实际寻找工作；作者随后质疑的是这种安排能否算帮助。\n\n如果C真是作者的意思，文章至少得写成：\n\n> By requiring a CV, online registration and an active search for work, the scheme aims to increase jobseekers’ participation in job seeking.\n>\n> 通过要求提交简历、网上登记和实际找工作，这项计划旨在提高求职者参与求职的程度。\n\nC需要的写法与原文措施能够接上：用前置求职要求推动行动，再以更快就业解释目标。承认政策有这一目标，并不等于认定它已实现目标或值得支持。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[84,272,1209,60],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q21-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>engagement<\/code>显示为<code>[xxx]<\/code>，但<code>active<\/code>和<code>job seeking<\/code>可见，原文<code>start looking for work<\/code>也能读懂。做题材料据此把C理解为推动积极求职，第一轮留下C，其他三项排除后确定了C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>engagement in<\/code>表示参与，<code>active engagement in job seeking<\/code>就是积极投入求职。它把带简历、登记网上求职和开始找工作这一组要求概括为主动参与求职，没有把计划的目标扩大为保证就业成功。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在鼓励求职者积极参与求职。<\/p>\n<\/blockquote>\n<p>题干问计划的目的，第一句的<code>In order to<\/code>先给出改善生活、减少依赖的宣称，第二句的<code>start looking for work<\/code>说明计划打算让求职者采取怎样的具体行动。C的<code>job seeking<\/code>与这个动作相对应。<\/p>\n<p>第一句确定政策想减少对补助的依赖，第二句把实际求职放在领补助之前，并辅以简历、网上登记和定期报到。把这两句接起来，措施是在促使申请者投入寻找工作的过程。<\/p>\n<p>C准确概括这项行动目标。<code>encourage<\/code>在这里说政策推动人去做什么，不表示参加完全自愿，也不表示作者赞成这些手段；<code>job seeking<\/code>同样不等于已经找到工作。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>前文把求职设为条件，后文又引用政府希望领补助者更快就业的说明。<\/p>\n<\/blockquote>\n<p>政策的具体做法和政府解释，都把申请者由领取补助引向实际寻找工作；作者随后质疑的是这种安排能否算帮助。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By requiring a CV, online registration and an active search for work, the scheme aims to increase jobseekers’ participation in job seeking.<\/p>\n<p>通过要求提交简历、网上登记和实际找工作，这项计划旨在提高求职者参与求职的程度。<\/p>\n<\/blockquote>\n<p>C需要的写法与原文措施能够接上：用前置求职要求推动行动，再以更快就业解释目标。承认政策有这一目标，并不等于认定它已实现目标或值得支持。<\/p>\n<\/section>"},{"title":"C. encourage jobseekers’ active engagement in job seeking","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。\n\nC实际说的是：\n\n> encourage jobseekers’ active engagement in job seeking  \n> 鼓励求职者积极参与求职\n\n主旨针对的是把积极求职变成领补助前提这件事；C说政府借这套安排推动求职，能说明作者批评的条件是什么。本项具体目的由`start looking for work`及政府的就业说明支持，不能把“作者反对手段”误读成“政府没有推动求职的意图”。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[84,272,1209,60],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q21-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>engagement<\/code>显示为<code>[xxx]<\/code>，但<code>active<\/code>和<code>job seeking<\/code>可见，原文<code>start looking for work<\/code>也能读懂。做题材料据此把C理解为推动积极求职，第一轮留下C，其他三项排除后确定了C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>engagement in<\/code>表示参与，<code>active engagement in job seeking<\/code>就是积极投入求职。它把带简历、登记网上求职和开始找工作这一组要求概括为主动参与求职，没有把计划的目标扩大为保证就业成功。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In order to &quot;change lives for the better&quot; and reduce &quot;dependency&quot;, George Osborne, Chancellor of the Exchequer, introduced the &quot;upfront work search&quot; scheme.<\/p>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在鼓励求职者积极参与求职。<\/p>\n<\/blockquote>\n<p>题干问计划的目的，第一句的<code>In order to<\/code>先给出改善生活、减少依赖的宣称，第二句的<code>start looking for work<\/code>说明计划打算让求职者采取怎样的具体行动。C的<code>job seeking<\/code>与这个动作相对应。<\/p>\n<p>第一句确定政策想减少对补助的依赖，第二句把实际求职放在领补助之前，并辅以简历、网上登记和定期报到。把这两句接起来，措施是在促使申请者投入寻找工作的过程。<\/p>\n<p>C准确概括这项行动目标。<code>encourage<\/code>在这里说政策推动人去做什么，不表示参加完全自愿，也不表示作者赞成这些手段；<code>job seeking<\/code>同样不等于已经找到工作。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>前文把求职设为条件，后文又引用政府希望领补助者更快就业的说明。<\/p>\n<\/blockquote>\n<p>政策的具体做法和政府解释，都把申请者由领取补助引向实际寻找工作；作者随后质疑的是这种安排能否算帮助。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By requiring a CV, online registration and an active search for work, the scheme aims to increase jobseekers’ participation in job seeking.<\/p>\n<p>通过要求提交简历、网上登记和实际找工作，这项计划旨在提高求职者参与求职的程度。<\/p>\n<\/blockquote>\n<p>C需要的写法与原文措施能够接上：用前置求职要求推动行动，再以更快就业解释目标。承认政策有这一目标，并不等于认定它已实现目标或值得支持。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>encourage jobseekers’ active engagement in job seeking<br>鼓励求职者积极参与求职<\/p>\n<\/blockquote>\n<p>主旨针对的是把积极求职变成领补助前提这件事；C说政府借这套安排推动求职，能说明作者批评的条件是什么。本项具体目的由<code>start looking for work<\/code>及政府的就业说明支持，不能把“作者反对手段”误读成“政府没有推动求职的意图”。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<\/section>"},{"title":"D. guarantee jobseekers’ legitimate right to benefits","raw":"### D. guarantee jobseekers’ legitimate right to benefits\n\n> 保障求职者获得补助的正当权利\n\n**做题模式中的状态：** 当时把`legitimate right to benefits`与`eligible for benefit`相比，读到`Only if`限制资格，判断该计划在要求申请者满足条件，而不是保障既有补助权利，第一轮排除了D。\n\n**错误类型：第一类——歪曲原意。**\n\nD借用了领取补助资格这个话题，将对资格施加要求写成保障求职者的正当权利。`legitimate right`本身并不等于“无条件权利”；本项的问题在于，作者描述的这套改革正在收紧和改变既有权利，而不是以保障它为目的。\n\n**出处：**\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.\n>\n> The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.\n>\n> Instead, the claimant receives a time-limited \"allowance,\" conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[84,360,1061,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q21-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>legitimate right to benefits<\/code>与<code>eligible for benefit<\/code>相比，读到<code>Only if<\/code>限制资格，判断该计划在要求申请者满足条件，而不是保障既有补助权利，第一轮排除了D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了领取补助资格这个话题，将对资格施加要求写成保障求职者的正当权利。<code>legitimate right<\/code>本身并不等于“无条件权利”；本项的问题在于，作者描述的这套改革正在收紧和改变既有权利，而不是以保障它为目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. guarantee jobseekers’ legitimate right to benefits","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 乔治·奥斯本的计划旨在保障求职者获得补助的正当权利。\n\nD的`right to benefits`与第一段`eligible for benefit`都涉及补助领取，但它们所说的关系不同：前者强调得到权利保障，后者在`Only if`后说明满足条件才取得资格。末段则明确讨论这种权利发生了什么变化。\n\n第一段的主体是接受条件约束的失业者。末段从`unconditional payments`转到`conditional on actively seeking a job`，再用`no entitlement and no insurance`评价变化，说明作者认为原有保障被削弱。\n\nD把“限制并重定义补助资格”改写成“保障正当权利”，政策作用方向发生了变化。不是看到`benefit`与`right`属于同一话题就能认为两句话同义。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[84,360,1061,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q21-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>legitimate right to benefits<\/code>与<code>eligible for benefit<\/code>相比，读到<code>Only if<\/code>限制资格，判断该计划在要求申请者满足条件，而不是保障既有补助权利，第一轮排除了D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了领取补助资格这个话题，将对资格施加要求写成保障求职者的正当权利。<code>legitimate right<\/code>本身并不等于“无条件权利”；本项的问题在于，作者描述的这套改革正在收紧和改变既有权利，而不是以保障它为目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在保障求职者获得补助的正当权利。<\/p>\n<\/blockquote>\n<p>D的<code>right to benefits<\/code>与第一段<code>eligible for benefit<\/code>都涉及补助领取，但它们所说的关系不同：前者强调得到权利保障，后者在<code>Only if<\/code>后说明满足条件才取得资格。末段则明确讨论这种权利发生了什么变化。<\/p>\n<p>第一段的主体是接受条件约束的失业者。末段从<code>unconditional payments<\/code>转到<code>conditional on actively seeking a job<\/code>，再用<code>no entitlement and no insurance<\/code>评价变化，说明作者认为原有保障被削弱。<\/p>\n<p>D把“限制并重定义补助资格”改写成“保障正当权利”，政策作用方向发生了变化。不是看到<code>benefit<\/code>与<code>right<\/code>属于同一话题就能认为两句话同义。<\/p>\n<\/section>"},{"title":"D. guarantee jobseekers’ legitimate right to benefits","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.\n>\n> Instead, the claimant receives a time-limited \"allowance,\" conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.\n>\n> 末段从失业保险的无条件给付，写到附条件、限时且没有保险权利保障的补助。\n\n作者在结尾解释改革怎样改变福利的性质，评价落点是权利的退缩。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The scheme preserves the unemployed’s entitlement to benefits and protects the insurance rights they have earned through their contributions.\n>\n> 这项计划保留失业者领取补助的权利，并保障他们缴费取得的保险权利。\n\nD成立时，结尾应说明既有权利如何被保留；实际却写`no entitlement and no insurance`。这里对比的是改革怎样对待既有保障，不需要把任何“正当权利”一概解释成没有资格条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[84,360,1061,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q21-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>legitimate right to benefits<\/code>与<code>eligible for benefit<\/code>相比，读到<code>Only if<\/code>限制资格，判断该计划在要求申请者满足条件，而不是保障既有补助权利，第一轮排除了D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了领取补助资格这个话题，将对资格施加要求写成保障求职者的正当权利。<code>legitimate right<\/code>本身并不等于“无条件权利”；本项的问题在于，作者描述的这套改革正在收紧和改变既有权利，而不是以保障它为目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在保障求职者获得补助的正当权利。<\/p>\n<\/blockquote>\n<p>D的<code>right to benefits<\/code>与第一段<code>eligible for benefit<\/code>都涉及补助领取，但它们所说的关系不同：前者强调得到权利保障，后者在<code>Only if<\/code>后说明满足条件才取得资格。末段则明确讨论这种权利发生了什么变化。<\/p>\n<p>第一段的主体是接受条件约束的失业者。末段从<code>unconditional payments<\/code>转到<code>conditional on actively seeking a job<\/code>，再用<code>no entitlement and no insurance<\/code>评价变化，说明作者认为原有保障被削弱。<\/p>\n<p>D把“限制并重定义补助资格”改写成“保障正当权利”，政策作用方向发生了变化。不是看到<code>benefit<\/code>与<code>right<\/code>属于同一话题就能认为两句话同义。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<p>末段从失业保险的无条件给付，写到附条件、限时且没有保险权利保障的补助。<\/p>\n<\/blockquote>\n<p>作者在结尾解释改革怎样改变福利的性质，评价落点是权利的退缩。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme preserves the unemployed’s entitlement to benefits and protects the insurance rights they have earned through their contributions.<\/p>\n<p>这项计划保留失业者领取补助的权利，并保障他们缴费取得的保险权利。<\/p>\n<\/blockquote>\n<p>D成立时，结尾应说明既有权利如何被保留；实际却写<code>no entitlement and no insurance<\/code>。这里对比的是改革怎样对待既有保障，不需要把任何“正当权利”一概解释成没有资格条件。<\/p>\n<\/section>"},{"title":"D. guarantee jobseekers’ legitimate right to benefits","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。\n\n但D实际说的是：\n\n> guarantee jobseekers’ legitimate right to benefits  \n> 保障求职者获得补助的正当权利\n\n作者主张不应把失业补助条件化，正是因为文中改革把原有保险权利改成需要不断满足要求的给付。D将作者所批评的权利变化，写成政策主动保障权利；末段的`no entitlement and no insurance`进一步否定这种描述。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[84,360,1061,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q21-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>legitimate right to benefits<\/code>与<code>eligible for benefit<\/code>相比，读到<code>Only if<\/code>限制资格，判断该计划在要求申请者满足条件，而不是保障既有补助权利，第一轮排除了D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了领取补助资格这个话题，将对资格施加要求写成保障求职者的正当权利。<code>legitimate right<\/code>本身并不等于“无条件权利”；本项的问题在于，作者描述的这套改革正在收紧和改变既有权利，而不是以保障它为目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit – and then they should report weekly rather than fortnightly.<\/p>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在保障求职者获得补助的正当权利。<\/p>\n<\/blockquote>\n<p>D的<code>right to benefits<\/code>与第一段<code>eligible for benefit<\/code>都涉及补助领取，但它们所说的关系不同：前者强调得到权利保障，后者在<code>Only if<\/code>后说明满足条件才取得资格。末段则明确讨论这种权利发生了什么变化。<\/p>\n<p>第一段的主体是接受条件约束的失业者。末段从<code>unconditional payments<\/code>转到<code>conditional on actively seeking a job<\/code>，再用<code>no entitlement and no insurance<\/code>评价变化，说明作者认为原有保障被削弱。<\/p>\n<p>D把“限制并重定义补助资格”改写成“保障正当权利”，政策作用方向发生了变化。不是看到<code>benefit<\/code>与<code>right<\/code>属于同一话题就能认为两句话同义。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.<\/p>\n<p>Instead, the claimant receives a time-limited &quot;allowance,&quot; conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.<\/p>\n<p>末段从失业保险的无条件给付，写到附条件、限时且没有保险权利保障的补助。<\/p>\n<\/blockquote>\n<p>作者在结尾解释改革怎样改变福利的性质，评价落点是权利的退缩。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The scheme preserves the unemployed’s entitlement to benefits and protects the insurance rights they have earned through their contributions.<\/p>\n<p>这项计划保留失业者领取补助的权利，并保障他们缴费取得的保险权利。<\/p>\n<\/blockquote>\n<p>D成立时，结尾应说明既有权利如何被保留；实际却写<code>no entitlement and no insurance<\/code>。这里对比的是改革怎样对待既有保障，不需要把任何“正当权利”一概解释成没有资格条件。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者反对把补助变成满足求职条件后的给付，不能单凭这一点判断方案具体鼓励哪种动作，或怎样规定报到与领取资格。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>guarantee jobseekers’ legitimate right to benefits<br>保障求职者获得补助的正当权利<\/p>\n<\/blockquote>\n<p>作者主张不应把失业补助条件化，正是因为文中改革把原有保险权利改成需要不断满足要求的给付。D将作者所批评的权利变化，写成政策主动保障权利；末段的<code>no entitlement and no insurance<\/code>进一步否定这种描述。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. C. encourage jobseekers’ active engagement in job seeking**\n\nA借用报到要求，却把政策规定的行为换成自愿报到。\n\nB借用补助资格，却把设置求职门槛写成领取更容易。\n\nC把简历、登记和实际找工作的要求概括为推动积极求职。\n\nD借用补助权利话题，却把文中收紧和重定义资格的改革写成保障权利。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[4,4,1293,421],"sourceW":1532,"sourceH":2542},"meta":{"kind":"conclusion","question":21},"level":3,"html":"<blockquote>\n<p><strong>21. C. encourage jobseekers’ active engagement in job seeking<\/strong><\/p>\n<\/blockquote>\n<p>A借用报到要求，却把政策规定的行为换成自愿报到。<\/p>\n<p>B借用补助资格，却把设置求职门槛写成领取更容易。<\/p>\n<p>C把简历、登记和实际找工作的要求概括为推动积极求职。<\/p>\n<p>D借用补助权利话题，却把文中收紧和重定义资格的改革写成保障权利。<\/p>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> The phrase “to sign on” (Para. 2) most probably means ______.\n>\n> 第二段中的“to sign on”最可能是什么意思？\n\n### 题型\n\n这是一道语义理解题。题干已限定第二段，要根据短语前后的对象和对照关系，判断`to sign on`在这里表示哪种办理行为；不能只套用一般的登记或签字含义。\n\n### 核心出处\n\n> There will now be a seven-day wait for the jobseeker's allowance.\n>\n> \"Those first few days should be spent looking for work, not looking to sign on,\" he claimed.\n>\n> \"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\"\n\n前一句提供求职者补助这一对象，`Those first few days`承接七天等待期，引语把找工作与`sign on`区分；后一句又回到`benefits`和就业。这几句共同限定了短语的意思。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[4,529,1417,424],"sourceW":1532,"sourceH":2542},"meta":{"kind":"question","question":22},"level":2,"html":"<blockquote>\n<p>The phrase “to sign on” (Para. 2) most probably means ______.<\/p>\n<p>第二段中的“to sign on”最可能是什么意思？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道语义理解题。题干已限定第二段，要根据短语前后的对象和对照关系，判断<code>to sign on<\/code>在这里表示哪种办理行为；不能只套用一般的登记或签字含义。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<\/blockquote>\n<p>前一句提供求职者补助这一对象，<code>Those first few days<\/code>承接七天等待期，引语把找工作与<code>sign on<\/code>区分；后一句又回到<code>benefits<\/code>和就业。这几句共同限定了短语的意思。<\/p>\n"},{"title":"A. to register for an allowance from the government","raw":"### A. to register for an allowance from the government\n\n> 向政府登记申领补助\n\n**做题模式中的状态：** 当时选项里的`allowance`显示为`[xxx]`，但`register for`可见，前一句也完整出现`jobseeker’s allowance`。做题时把登记动作与紧邻的补助话题接起来，第一轮留下A，排除其余三项后确定A。\n\n**选项类型：正确同义改写。**\n\nA把语境中的`sign on`展开成登记申领政府补助。前一句提供申领对象，后一句把这项行为与寻找工作相对照；这里不是泛指在任何地方登记姓名。\n\n**出处：**\n\n> There will now be a seven-day wait for the jobseeker's allowance.\n>\n> \"Those first few days should be spent looking for work, not looking to sign on,\" he claimed.\n>\n> \"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\"","section":"第三鸟 · 题目复盘","con p>\n<p>B将“登记申领这项补助”换成“接受针对这项补助的限制”，改变了动词所表达的关系。规则与办理有关，仍不能互换为同一个意思。<\/p>\n<\/section>"},{"title":"B. to accept the government’s restrictions on the allowance","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> \"Those first few days should be spent looking for work, not looking to sign on,\" he claimed.\n>\n> \"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\"\n>\n> 引语把最初几天用于找工作与用于申领补助分开，下一句仍谈怎样让人减少领补助、加快就业。\n\n这段在安排求职和领补助的先后，并没有把问题转向失业者是否同意政府的规则。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Those first few days should be spent looking for work, not deciding whether to accept the government’s restrictions on the allowance.\n>\n> 最初几天应该用来找工作，而不是决定是否接受政府对补助的限制。\n\nB代入后，句子的第二项变成对规则作出接受与否的决定，后文便需要围绕这种态度或承诺解释。实际后文继续写领取补助与就业，没有发生这个转向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 B选项","focus":[84,712,1216,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":22,"option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q22-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>接受政府对补助的限制<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整可见。做题时比较了<code>accept the government’s restrictions<\/code>与最初几天准备去<code>sign on<\/code>的具体办理动作，认为前者换成接受规则，第一轮排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了本文确实存在的补助限制，把申领补助这一动作改成接受限制。有人办理申领可能需要遵守规则，但“办理申领”的词义不因此等于“接受政府的限制”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q22-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是指接受政府对补助的限制。<\/p>\n<\/blockquote>\n<p>B的<code>restrictions on the allowance<\/code>能让人想到前一句的七天等待期；但题干问的不是这项政策有什么要求，而是<code>to sign on<\/code>在“最初几天该做什么”的句子里表示哪种行为。<\/p>\n<p>原文先说补助有等待期，再说应该花时间找工作，不要忙着<code>sign on<\/code>。前者是政策规则，后者是被要求暂缓的申领动作。限制作用于申领者，不是申领动作本身的同义解释。<\/p>\n<p>B将“登记申领这项补助”换成“接受针对这项补助的限制”，改变了动词所表达的关系。规则与办理有关，仍不能互换为同一个意思。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q22-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>引语把最初几天用于找工作与用于申领补助分开，下一句仍谈怎样让人减少领补助、加快就业。<\/p>\n<\/blockquote>\n<p>这段在安排求职和领补助的先后，并没有把问题转向失业者是否同意政府的规则。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Those first few days should be spent looking for work, not deciding whether to accept the government’s restrictions on the allowance.<\/p>\n<p>最初几天应该用来找工作，而不是决定是否接受政府对补助的限制。<\/p>\n<\/blockquote>\n<p>B代入后，句子的第二项变成对规则作出接受与否的决定，后文便需要围绕这种态度或承诺解释。实际后文继续写领取补助与就业，没有发生这个转向。<\/p>\n<\/section>"},{"title":"B. to accept the government’s restrictions on the allowance","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入22题题干：\n\n> 全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。\n\n但B实际说的是：\n\n> to accept the government’s restrictions on the allowance  \n> 接受政府对补助的限制\n\n全文确实反对给补助附条件，所以B的“限制”很贴近文章话题；但主旨不能把任何相关行为都解释成接受限制。本项最终仍要根据`not looking to sign on`前后的补助申领对照判断，B把动作本身换成了对规则的接受。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 B选项","focus":[84,712,1216,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":22,"option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q22-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-B-0\"><blockquote>\n<p>接受政府对补助的限制<\/p>\n<\/blockquote>\n<p><stro 助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>to accept the government’s restrictions on the allowance<br>接受政府对补助的限制<\/p>\n<\/blockquote>\n<p>全文确实反对给补助附条件，所以B的“限制”很贴近文章话题；但主旨不能把任何相关行为都解释成接受限制。本项最终仍要根据<code>not looking to sign on<\/code>前后的补助申领对照判断，B把动作本身换成了对规则的接受。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. to check on the availability of jobs at the jobcentre","raw":"### C. to check on the availability of jobs at the jobcentre\n\n> 到就业中心查询有没有工作岗位\n\n**做题模式中的状态：** 当时能读出`looking for work, not looking to sign on`的对照。做题材料将C的查岗位归入找工作一边，认为它不能再解释被对举的另一件事，第一轮排除了C。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用了第一段的就业中心与第二段的求职话题，却把`sign on`解释成查找岗位。原句正在区分求职与办理补助，C把两件事重新混在一起。\n\n**出处：**\n\n> There will now be a seven-day wait for the jobseeker's allowance.\n>\n> \"Those first few days should be spent looking for work, not looking to sign on,\" he claimed.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 C选项","focus":[84,800,1118,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":22,"option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q22-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>到就业中心查询有没有工作岗位<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时能读出<code>looking for work, not looking to sign on<\/code>的对照。做题材料将C的查岗位归入找工作一边，认为它不能再解释被对举的另一件事，第一轮排除了C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了第一段的就业中心与第二段的求职话题，却把<code>sign on<\/code>解释成查找岗位。原句正在区分求职与办理补助，C把两件事重新混在一起。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<\/blockquote>\n<\/section>"},{" 用参加课程来解释短语。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Here, signing on means attending a government job-training course during the first few days of unemployment.<\/p>\n<p>这里的signing on指在刚失业的几天参加政府就业培训课程。<\/p>\n<\/blockquote>\n<p>D成立至少需要把培训课程明确设为短语指代的活动。实际句子提供的最近对象是补助，随后也持续围绕补助与工作，不能从政策背景补出一门课程。<\/p>\n<\/section>"},{"title":"D. to attend a governmental job-training program","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入22题题干：\n\n> 全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。\n\n但D实际说的是：\n\n> to attend a governmental job-training program  \n> 参加政府就业培训项目\n\n主旨并不负责规定政府提供哪一种就业服务。本项最终仍要根据`jobseeker’s allowance`与`sign on`的邻接语境判断；D中的培训项目既不是主旨提供的信息，也不是这几句所写的活动。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 D选项","focus":[84,888,1015,61],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":22,"option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q22-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>参加政府就业培训项目<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可见。原文这一处讲求职、等待期和补助，做题时没有找到就业培训项目的依据，因此第一轮就排除了D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D利用政府、就业中心和找工作这些背景，引出常见的就业培训联想。可是这几句没有写培训课程或参与项目，不能把同属就业服务的活动补进<code>sign on<\/code>的含义。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q22-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是指参加政府就业培训项目。<\/p>\n<\/blockquote>\n<p>D中决定含义的是<code>attend<\/code>与<code>job-training program<\/code>。第二段定位句前后的具体对象则是<code>jobseeker’s allowance<\/code>和<code>work<\/code>，没有项目名称或训练内容。<\/p>\n<p>七天是申领补助的等待时间，不是培训的学时；最初几天被要求用于找工作，也没有说等待者要参加课程。政府提供就业服务这一背景，不能补出一个正在组织的培训项目。<\/p>\n<p>D在原文现有的申领与求职之外，增加了“参加政府培训”的完整动作。缺少的不是某个同义词，而是整项活动的依据。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q22-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker&#39;s allowance.<\/p>\n<p>&quot;Those first few days should be spent looking for work, not looking to sign on,&quot; he claimed.<\/p>\n<p>&quot;We&#39;re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.&quot;<\/p>\n<p>段落谈等待补助、先去求职以及政府宣称这能加快就业，始终没有转向培训安排。<\/p>\n<\/blockquote>\n<p>后文用领取补助者更快就业解释政策，没有用参加课程来解释短语。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Here, signing on means attending a government job-training course during the first few days of unemployment.<\/p>\n<p>这里的signing on指在刚失业的几天参加政府就业培训课程。<\/p>\n<\/blockquote>\n<p>D成立至少需要把培训课程明确设为短语指代的活动。实际句子提供的最近对象是补助，随后也持续围绕补助与工作，不能从政策背景补出一门课程。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q22-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Unemployment benefits should not be made conditional.<br>失业补助不应附加条件。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认这段在讨论补助申领条件，不能单凭这一点判断“to sign on”这个短语的具体含义；它表示哪项行为仍要看相邻句。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>to attend a governmental job-training program<br>参加政府就业培训项目<\/p>\n<\/blockquote>\n<p>主旨并不负责规定政府提供哪一种就业服务。本项最终仍要根据<code>jobseeker’s allowance<\/code>与<code>sign on<\/code>的邻接语境判断；D中的培训项目既不是主旨提供的信息，也不是这几句所写的活动。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. A. to register for an allowance from the government**\n\nA结合补助等待期与前后对照，准确把短语解释为登记申领政府补助。\n\nB把具体申领动作改成接受政府限制。\n\nC把与求职对举的申领补助，重新解释成求职中的查岗位。\n\nD借用就业服务背景，补出了文中没有的培训项目。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[4,529,1417,424],"sourceW":1532,"sourceH":2542},"meta":{"kind":"conclusion","question":22},"level":3,"html":"<blockquote>\n<p><strong>22. A. to register for an allowance from the government<\/strong><\/p>\n<\/blockquote>\n<p>A结合补助等待期与前后对照，准确把短语解释为登记申领政府补助。<\/p>\n<p>B把具体申领动作改成接受政府限制。<\/p>\n<p>C把与求职对举的申领补助，重新解释成求职中的查岗位。<\/p>\n<p>D借用就业服务背景，补出了文中没有的培训项目。<\/p>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> What prompted the chancellor to develop his scheme?\n>\n> 是什么促使财政大臣制定这一计划？\n\n### 题型\n\n这是一道局部原因题，问财政大臣制定方案的推动力。`What motivated him`是直接的动机说明，但前面还有“改善生活”的表面理由，需要连同`On first hearing`及作者的质疑一起读，区分政府形象、政策理由和作者立场。\n\n### 核心出处\n\n> Help? Really?\n>\n> On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with \"reforms\" to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.\n>\n> What motivated him, we were to understand, was his zeal for \"fundamental fairness\" – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.\n\n前一长句是初听政策时产生的关心社会的印象；动机句则用破折号说明`fundamental fairness`具体保护谁、控制什么。题干问的是大臣为何制定方案，不是作者为什么反对方案。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[4,1060,1198,421],"sourceW":1532,"sourceH":2542},"meta":{"kind":"question","question":23},"level":2,"html":"<blockquote>\n<p>What prompted the chancellor to develop his scheme?<\/p>\n<p>是什么促使财政大臣制定这一计划？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部原因题，问财政大臣制定方案的推动力。<code>What motivated him<\/code>是直接的动机说明，但前面还有“改善生活”的表面理由，需要连同<code>On first hearing<\/code>及作者的质疑一起读，区分政府形象、政策理由和作者立场。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Help? Really?<\/p>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<p>前一长句是初听政策时产生的关心社会的印象；动机句则用破折号说明<code>fundamental fairness<\/code>具体保护谁、控制什么。题干问的是大臣为何制定方案，不是作者为什么反对方案。<\/p>\n"},{"title":"A. A desire to secure a better life for all.","raw":"### A. A desire to secure a better life for all.\n\n> 希望让所有人过上更好的生活。\n\n**做题模式中的状态：** 当时`better`显示为`[xxx]`，但`life for all`与原文`change lives for the better`能够接上。做题材料注意到`On first hearing`可能只是在写表面印象，却没有马上排除A，第一轮留下A、D；25题主旨确定后，才把改善生活的宣传与后面的动机说明分开，排除A、选择D。\n\n**错误类型：第一类——歪曲原意。**\n\nA不是凭空编造“改善生活”：这句话确实出现在政策宣传和`On first hearing`引出的形象中。命题人把作者暂时转述的表面理由，改成题干要找的政策推动力，还将其对象概括成`for all`。决定性问题是这层话语身份被换掉。\n\n**出处：**\n\n> On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with \"reforms\" to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.\n>\n> What motivated him, we were to understand, was his zeal for \"fundamental fairness\" – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[84,1152,852,51],"sourceW":1532,"sourceH":2542},"meta":{"kind":"option","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q23-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>希望让所有人过上更好的生活。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>better<\/code>显示为<code>[xxx]<\/code>，但<code>life for all<\/code>与原文<code>change lives for the better<\/code>能够接上。做题材料注意到<code>On first hearing<\/code>可能只是在写表面印象，却没有马上排除A，第一轮留下A、D；25题主旨确定后，才把改善生活的宣传与后面的动机说明分开，排除A、选择D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A不是凭空编造“改善生活”：这句话确实出现在政策宣传和<code>On first hearing<\/code>引出的形象中。命题人把作者暂时转述的表面理由，改成题干要找的政策推动力，还将其对象概括成<code>for all<\/code>。决定性问题是这层话语身份被换掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. A desire to secure a better life for all.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 促使财政大臣制定这项计划的是让所有人过上更好生活的愿望。\n\n题干`prompted`与第二段`What motivated him`直接对应。A的`a better life`又与更前面的`change lives for the better`相似，因此需要比较这两处各自承担的作用。\n\n`On first hearing`限定了前一幅形象：初听时，大臣仿佛关心社会、要改善生活。段内的`Help? Really?`已经发出质疑；后面的动机句再把`fundamental fairness`解释为保护纳税人、控制开支和筛选申请者。\n\nA取了前面的改善生活说法，却没有保留作者对它的距离，把表面宣传当作此处最终交代的动机。后句所解释的利益对象是纳税人，不是A所说的所有人。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[84,1152,852,51],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q23-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>希望让所有人过上更好的生活。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>better<\/code>显示为<code>[xxx]<\/code>，但<code>life for all<\/code>与原文<code>change lives for the better<\/code>能够接上。做题材料注意到<code>On first hearing<\/code>可能只是在写表面印象，却没有马上排除A，第一轮留下A、D；25题主旨确定后，才把改善生活的宣传与后面的动机说明分开，排除A、选择D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A不是凭空编造“改善生活”：这句话确实出现在政策宣传和<code>On first hearing<\/code>引出的形象中。命题人把作者暂时转述的表面理由，改成题干要找的政策推动力，还将其对象概括成<code>for all<\/code>。决定性问题是这层话语身份被换掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>促使财政大臣制定这项计划的是让所有人过上更好生活的愿望。<\/p>\n<\/blockquote>\n<p>题干<code>prompted<\/code>与第二段<code>What motivated him<\/code>直接对应。A的<code>a better life<\/code>又与更前面的<code>change lives for the better<\/code>相似，因此需要比较这两处各自承担的作用。<\/p>\n<p><code>On first hearing<\/code>限定了前一幅形象：初听时，大臣仿佛关心社会、要改善生活。段内的<code>Help? Really?<\/code>已经发出质疑；后面的动机句再把<code>fundamental fairness<\/code>解释为保护纳税人、控制开支和筛选申请者。<\/p>\n<p>A取了前面的改善生活说法，却没有保留作者对它的距离，把表面宣传当作此处最终交代的动机。后句所解释的利益对象是纳税人，不是A所说的所有人。<\/p>\n<\/section>"},{"title":"A. A desire to secure a better life for all.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> What motivated him, we were to understand, was his zeal for \"fundamental fairness\" – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.\n>\n> It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.\n>\n> 作者交代纳税人公平与控制开支的理由后，转而写失业者经济恐惧、心理难堪及支持少又难拿。\n\n这个转向是在用失业者的实际处境检验“改善生活”的外观，而不是继续证明政策让所有人过得更好。\n\n如果A真是作者的意思，文章至少得写成：\n\n> What motivated him was a desire to improve life for everyone, with the scheme easing hardship for the newly unemployed.\n>\n> 推动他的是改善每个人生活的愿望，这项计划也在减轻新失业者的困难。\n\nA所需的推进应把普遍改善生活认定为动机，再说明它怎样落到失业者身上。实际动机句指向保护纳税人，随后呈现的是失业者困境；这正是做题时A、D需要进一步分开的地方。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[84,1152,852,51],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q23-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>希望让所有人过上更好的生活。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>better<\/code>显示为<code>[xxx]<\/code>，但<code>life for all<\/code>与原文<code>change lives for the better<\/code>能够接上。做题材料注意到<code>On first hearing<\/code>可能只是在写表面印象，却没有马上排除A，第一轮留下A、D；25题主旨确定后，才把改善生活的宣传与后面的动机说明分开，排除A、选择D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A不是凭空编造“改善生活”：这句话确实出现在政策宣传和<code>On first hearing<\/code>引出的形象中。命题人把作者暂时转述的表面理由，改成题干要找的政策推动力，还将其对象概括成<code>for all<\/code>。决定性问题是这层话语身份被换掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with &quot;reforms&quot; to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.<\/p>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>促使财政大臣制定这项计划的是让所有人过上更好生活的愿望。<\/p>\n<\/blockquote>\n<p>题干<code>prompted<\/code>与第二段<code>What motivated him<\/code>直接对应。A的<code>a better life<\/code>又与更前面的<code>change lives for the better<\/code>相似，因此需要比较这两处各自承担的作用。<\/p>\n<p><code>On first hearing<\/code>限定了前一幅形象：初听时，大臣仿佛关心社会、要改善生活。段内的<code>Help? Really?<\/code>已经发出质疑；后面的动机句再把<code>fundamental fairness<\/code>解释为保护纳税人、控制开支和筛选申请者。<\/p>\n<p>A取了前面的改善生活说法，却没有保留作者对它的距离，把表面宣传当作此处最终交代的动机。后句所解释的利益对象是纳税人，不是A所说的所有人。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for &quot;fundamental fairness&quot; – protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.<\/p>\n<p>It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.<\/p>\n<p>作者交代纳税人公平与控制开支的理由后，转而写失业者经济恐惧、心理难堪及支持少又难拿。<\/p>\n<\/blockquote>\n<p>这个转向是在用失业者的实际处境检验“改善生活”的外观，而不是继续证明政策让所有人过得更好。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>What motivated him was a desire to improve life for everyone, with the scheme easing hardship for the newly unemployed.<\/p>\n<p>推动他的是改善每个人生活的愿望，这项计划也在减轻新失业者的困难。<\/p>\n<\/blockquote>\n<p>A所需的推进应把普遍改善生活认定为动机，再说明它怎样落到失业者身上。实际动机句指向保护纳税人，随后呈现的是失业者困境；这正是做题时A、D需要进一步分开的地方。<\/p>\n<\/section>"},{"title":"A. A desire to secure a better life for all.","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Unemployment benefits should not be made conditional.  \n> 失业补助不应附加条件。\n\n把这个主旨直接代入23题题干：\n\n> 全文主旨只能确认作者反对把失业补助条件化，不能单凭这一点认定财政大臣的具体动机；还要区分文中的公开形象与明确的动机说明。\n\n但A实际说的是：\n\n> A desire to secure a better life for all.  \n> 希望让所有人过上更好的生活。\n\n主旨不能单独读出一个人的动机，但它解释了作者为什么先摆出“关心失业者”的形象，再揭示政策的另一套理由。本项最终仍要根据`On first hearing`与`What motivated him`判断：前者引出的改善生活说法是被质疑的外观，后者才明确落到纳税人公平。A把两者的层次合并了。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[84,1152,852,51],"sourceW":1532,"sourceH":2542},"meta":{"kind":"method","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q23-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>希望让所有人过上更好的生活。<\/p>\n<\/blockqu
