会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍基础物理学奖和其他高额科学奖，说明它们多由互联网企业家出资并想让科学成功者得到关注<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>集中列出科学家的批评：缺少诺贝尔声望、服务出资者宣传、可能扭曲同行评审并强化孤独天才神话<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明颁奖者的目标并不统一，有人想制造震动、吸引人进入科学或更好奖励研究者<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>承认新旧科学奖分配都有问题，并用合作研究、希格斯玻色子和诺贝尔奖的历史合法性作比较<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>认为批评机制是合理的，但金钱与关注流向科学是好事，研究者也会接受，因此应有礼地接受<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<h3>A. harmful to the culture of research<\/h3>\n<p>有害于研究文化<\/p>\n<h4>如果 A 是主旨，文章五段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>有害于研究文化<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍一种由富豪出资的新科学奖项，它将个人财富带进原本依靠同行评价的科研奖励领域，引出对研究文化的影响。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出批评者对新奖的反对意见：出资者追求自我宣传、独立评价受到挤压、集体合作被个人英雄叙事掩盖，这些意见共同指向研究文化受损。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明出资者追求个人影响、获奖者追求奖金、研究共同体维护专业评价，各方目的不同，怎样使奖项的运行偏离共同的研究规范。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把这种新奖与其他私人资助方式比较，说明接受私人资源时将个人名望置于专业规则之上，会在不同制度中造成同一种文化伤害。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>在继续承认新奖伤害研究文化的前提下，说明科研资源的现实需要使研究者仍可接受它，但这种实际接受不等于取消对其文化后果的负面判断。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>A说的是新奖项对研究文化造成伤害，不能把它直接缩成“有人批评新奖”。按照这条假想路线，作者即使最后容许接受，也应始终把文化伤害当作自己的中心判断，并交代为何要承受这一代价。实际第2段把相关意见交给批评者，第3段展开不同的设奖目标，第4段把问题扩展到新旧奖项，而不是为“新奖整体有害”集中举证。第5段还把批评和质疑机制称为研究文化的一部分，随后肯定资源流向科学，建议感激地接受。因此，文章承认可以批评机制，却没有把A的负面判断作为全文立场。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<hr>\n<p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<h3>B. acceptable despite the criticism<\/h3>\n<p>尽管受到批评，仍然可以接受<\/p>\n<h4>如果 B 是主旨，文章五段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>尽管受到批评，仍然可以接受<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍新近出现的高额科学奖及企业家出资的背景，明确接下来要评价的是这些进入科学领域的新奖励。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出对新奖的反对意见，包括声望不足、出资者自我宣传及对科研评价的影响，使“尽管受到批评”有具体内容。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明设奖者分别追求震动效应、吸引人从事科学和奖励研究生涯，不能把不同目的都归结为一种不值得接受的动机。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把新奖与诺贝尔奖放在共同的分配问题和私人设奖历史中比较，说明机制并非完美以及初衷受质疑，都不必然取消奖项的可接受性。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认质疑机制是合理的，同时指出研究者愿意接受、金钱和关注流向科学有益，据此得出受到批评的新奖仍然可以接受。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>B保留了两个同时存在的判断：批评可以成立，奖项仍可接受。第2段没有被省略，第3段说明目标各异，第4段承认新旧奖项都有问题，并用诺贝尔奖随时间获得认可补充比较。最后一段的两点理由分别是研究者会接受奖项，以及科学能够获得金钱和关注；随后又明确认可质疑机制。这些段落共同推进到“可以批评，也可以接受”，与B的让步关系一致。<\/p>\n<p>判断：<\/p>\n<p><strong>B 保留。<\/strong><\/p>\n<hr>\n<p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<h3>C. subject to undesirable changes<\/h3>\n<p>容易发生不良变化<\/p>\n<h4>如果 C 是主旨，文章五段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>容易发生不良变化<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍刚进入科研奖励领域的新奖项及其尚未稳定的运行方式，把奖项会怎样变化作为后续评价的对象。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出反对者对变化方向的质疑：奖励标准逐步偏离科研贡献、资助用途渐被宣传需求支配，说明所担心的是奖项发生不良变化。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明出资者扩大影响、获奖者争取利益和科研共同体维护标准这些不同目的，怎样推动新奖的规则向不良方向变化。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>比较不同科学奖项从创立到成熟的制度演变，指出缺乏稳定约束时，新奖同样容易经历标准和用途的恶化。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认新奖仍容易发生不良变化，但说明在持续限制这种变化的条件下，其科研资源价值仍使它可以被接受。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>C不仅是“有问题”，还提出了奖项容易发生不良变化这一判断，所以假想文章必须交代变化前后、推动变化的力量及不良方向。实际第2段主要呈现对现有机制的批评，第3段讨论不同目标，第4段比较新旧奖项如何分配，并没有追踪新奖从一种状态变成另一种状态。段末提到时间，也是为了说明诺贝尔奖已经获得认可，不是在预测新奖会恶化。结尾接受新奖的理由是资源和关注流向科学，而不是在提出防止不良变化的条件之后才允许接受。C增添了全文没有建立的变化主线。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<hr>\n<p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<h3>D. unworthy of public attention<\/h3>\n<p>不值得公众关注<\/p>\n<h4>如果 D 是主旨，文章五段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>不值得公众关注<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍新出现并得到媒体报道的高额科学奖，引出公众是否值得为这些奖项投入注意力的问题。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出反对者对公众关注新奖的批评：报道集中于奖金和富豪形象，难以增进公众对科学工作的理解。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明出资者想得到曝光、研究者想得到支持、公众希望了解科学，各自目的并不相同，奖项宣传不能满足公众了解科学的需要。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>将围绕奖项和个人的宣传与直接介绍研究过程的科学传播比较，说明公众注意力用于后者更有价值。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>说明研究者仍可接受私人提供的奖励，但私人收下资助不使奖项成为值得公众关注的对象，最终保留对公众传播价值的否定。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D判断的是公众关注新奖有没有价值，不等于研究者能不能私下收下奖金。即使按这一区分构造出最后仍接受奖励的文章，前面也应持续比较宣传与科学传播的价值。实际第1段把让科学成功者受到关注列为设奖目的，末段又将<code>money and attention<\/code>并列，肯定两者流向科学。作者没有要求研究者收钱的同时排斥公众关注，而是把科学得到关注作为接受新奖的一项理由。D的否定方向与这一收束相反。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<hr>\n<h3>35题结论<\/h3>\n<p><strong>35. B. acceptable despite the criticism<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>acceptable despite the criticism / 尽管受到批评，仍然可以接受<\/strong><\/p>\n<h2>31题<\/h2>\n<blockquote>\n<p>The Fundamental Physics Prize is seen as ______.<br>基础物理学奖被视为什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道具体细节题，问基础物理学奖被看作什么性质的奖项。题干给出奖名，先回到第1段的同名对象，再结合这一段对整类新奖的介绍作答。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>The US $3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March.<\/p>\n<p>As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.<\/p>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<p>第一句给出三百万美元的金额，第三句把基础物理学奖所在的这一类奖称为给研究人员的丰厚奖励，后两句说明企业家的出资来源及吸引人们关注科学成功者的目的。题干问奖项性质，不能把资金来源改成奖项定义，也不能仅凭新旧奖出现在同一句就推断替代关系。<\/p>\n<h3>A. a symbol of the entrepreneurs’ wealth<\/h3>\n<blockquote>\n<p>企业家财富的象征<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到了<code>funded from<\/code>、<code>bank accounts<\/code>和<code>Internet entrepreneurs<\/code>，认为它们只交代资金来源，不能把奖项定义为财富象征，第一轮就排除了A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用企业家的巨额账户，把“由这些财富资助”改成“象征这些财富”。出资者有钱是设奖的背景，奖项被如何看待是另一条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为企业家财富的象征。<\/p>\n<\/blockquote>\n<p>A中的<code>entrepreneurs’ wealth<\/code>对应第1段的企业家账户和使用财富的表述，因此要比较<code>funded from<\/code>与<code>a symbol of<\/code>各自在说什么。<\/p>\n<p>第一处说奖项的钱来自互联网企业家；下一句继续交代这些赞助人的自述目的，是让在科学上取得成功的人获得关注。财富在这里承担资金来源的角色，科学成功者才是他们想要引起关注的对象。<\/p>\n<p>A却用<code>symbol<\/code>给奖项本身下定义，把“出资靠什么”换成“奖项代表什么”。金额巨大可以使人联想到炫耀财富，但这仍不是第1段给出的身份判断。<\/p>\n<p>因此，A利用相同的出资者和财富信息，补上了从资助关系到财富象征的变化，不能作为这项奖的性质概括。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<p>赞助人说自己要用财富吸引人们关注科学领域的成功者。<\/p>\n<\/blockquote>\n<p>介绍账户之后，作者顺着出资目的转向科学家，关注点没有停在富豪财力的展示上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Fundamental Physics Prize is regarded as a symbol of its founders’ wealth, drawing attention to how rich they are.<\/p>\n<p>基础物理学奖被视为设立者财富的象征，吸引人们注意他们多么富有。<\/p>\n<\/blockquote>\n<p>假设写法需要把奖项所引起的注意落在企业家的富有程度上；实际下一句把注意力落在科学成就者身上。二者都有财富，但财富在文章中的作用不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>a symbol of the entrepreneurs’ wealth<br>企业家财富的象征<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“are funded from”及“draw attention to those who have succeeded in science”判断。接受科研资源这一主旨能容纳企业家出资，却不把资金来源变成财富象征；A多出的正是这层定义。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. a possible replacement of the Nobel Prizes<\/h3>\n<blockquote>\n<p>诺贝尔奖可能的替代品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>joined the Nobel Prizes<\/code>与<code>replacement<\/code>联系起来，认为仅凭首段还不能完全否定以后替代的可能，第一轮留下B和C。后来读出35题主旨，再结合声望及新旧奖项的比较，排除B，保留C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B从新奖加入诺贝尔奖所在的奖项行列，推想出它将来可能取代诺贝尔奖。<code>possible<\/code>把语气放弱了，却没有补出原文缺少的替代关系。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.<\/p>\n<p>You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为诺贝尔奖可能的替代品。<\/p>\n<\/blockquote>\n<p>B点名<code>Nobel Prizes<\/code>，第1段的<code>joined the Nobel Prizes<\/code>正好说明新旧奖项的关系；第2段又补充两者声望的差异。<\/p>\n<p><code>joined<\/code>说新奖近年来加入奖项行列，已有诺贝尔奖之外又出现了这些奖励。它没有写新奖将接管旧奖的功能，也没有写任何人把它视为替代者。<\/p>\n<p>B中的<code>possible<\/code>并非断言已经取代，但整句仍然要求文章支持“它被看作可能的替代品”。仅仅并列出现，不足以给出这个可能性的具体依据。第2段说钱买不到诺贝尔奖的声望，也没有进一步讨论这种声望以后会被新奖取代。<\/p>\n<p>B把“新增了同类奖项”继续推演成“被当作旧奖的潜在替代品”，增加了原文未提出的新旧更替判断。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<p>Second, it is surely a good thing that the money and attention come to science rather than go elsewhere.<\/p>\n<p>作者先回顾诺贝尔奖的私人设奖背景和随时间取得的认可，再肯定新奖为科学带来金钱与关注。<\/p>\n<\/blockquote>\n<p>这一比较用旧奖的经历帮助评价新奖是否值得接受，并没有以旧奖被取代为结尾。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The new prizes may take the place of the Nobels as the principal rewards for scientific achievement.<\/p>\n<p>这些新奖可能取代诺贝尔奖，成为科学成就的主要奖励。<\/p>\n<\/blockquote>\n<p>若B成立，比较新旧奖时至少要提出取代的功能或地位。实际比较落在设奖、认可和接受上；新奖带来额外资源，与新奖可能接替诺贝尔奖不是同一个判断。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>a possible replacement of the Nobel Prizes<br>诺贝尔奖可能的替代品<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“have joined the Nobel Prizes”及后面对新旧奖的比较判断。主旨讨论的是争议中如何看待新奖，并未把接受新奖写成更换既有奖项。B的替代判断无法从这一整体方向中补出来。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. a handsome reward for researchers<\/h3>\n<blockquote>\n<p>给研究人员的丰厚奖励<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C写成<code>a [xxx] reward for researchers<\/code>，第1段<code>lucrative<\/code>也被遮住，但仍读到了三百万美元和<code>awards for researchers<\/code>，第一轮保留C，同时留下B。回查时将研究奖励的性质与全文的接受态度相连，最终选择C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>handsome<\/code>在金额或奖励语境中表示可观、丰厚，与原文的<code>lucrative<\/code>相对应；<code>reward for researchers<\/code>保留了奖励的对象和功能，首句的三百万美元使这个概括更具体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The US $3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March.<\/p>\n<p>As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为给研究人员的丰厚奖励。<\/p>\n<\/blockquote>\n<p>题干奖名在第1句出现，C的<code>reward for researchers<\/code>对应第3句的<code>awards for researchers<\/code>，<code>handsome<\/code>则对应金额和<code>lucrative<\/code>。<\/p>\n<p>第1句提供该奖的金额：三百万美元。接下来的<code>far from the only one of its type<\/code>将它接到同类奖项，第3句再说明这是一系列面向研究人员的丰厚奖励。<\/p>\n<p>C没有更换出资者或把奖项移到别的领域；它用<code>reward<\/code>概括<code>award<\/code>的奖励性质，用<code>for researchers<\/code>保留受奖对象。<code>handsome<\/code>在这里形容报酬可观，不是在夸奖研究者外貌。<\/p>\n<p>几句话合起来支持“给研究人员的丰厚奖励”，C准确保留了金额特征、奖项功能和面向的群体。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The goals of the prize-givers seem as scattered as the criticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.<\/p>\n<p>First, most researchers would accept such a prize if they were offered one.<\/p>\n<p>设奖目标包括更好地奖励研究生涯，最后又说大多数研究人员若获奖会接受。<\/p>\n<\/blockquote>\n<p>文章从奖项的奖励性质继续讨论奖励目标和研究者是否接受，始终围绕科学奖的实际用途展开。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The prize offers researchers a substantial financial reward for their scientific achievements.<\/p>\n<p>这项奖为研究人员的科学成就提供可观的金钱奖励。<\/p>\n<\/blockquote>\n<p>C所需的是科研成就获得丰厚奖励，这在首段金额、第三段奖励研究生涯和末段研究者愿意接受之间都能接上。原文并没有要求把这一功能改写成替代诺贝尔奖。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>a handsome reward for researchers<br>给研究人员的丰厚奖励<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“US $3-million”及“lucrative awards for researchers”确定具体性质。全文肯定资金来到科学，能够容纳C所概括的科研奖励；局部出处则坐实“丰厚”和“给研究人员”，两者没有改变对象。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<h3>D. an example of bankers’ investments<\/h3>\n<blockquote>\n<p>银行家投资的一个例子<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了<code>bank accounts<\/code>的持有人是<code>Internet entrepreneurs<\/code>，认为银行账户不能把出资者变成银行家，也不能自动把资助变成投资，第一轮排除D，之后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D抓住<code>bank accounts<\/code>中的<code>bank<\/code>，把互联网企业家的账户改成银行家的投资。它同时换掉了账户持有人和出资行为的性质。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为银行家投资的一个例子。<\/p>\n<\/blockquote>\n<p>D中的<code>bankers<\/code>容易使人联想到第1段的<code>bank accounts<\/code>，但必须连同后面的<code>of Internet entrepreneurs<\/code>一起读，核对账户是谁的。<\/p>\n<p>原文的主体是互联网企业家，银行账户只是他们存放资金的地方；用自己的账户出资并不会使账户主人变成银行家。接下来的<code>benefactors<\/code>也继续指这些出资的赞助人。<\/p>\n<p>资金的用途是资助奖项，使科学成就者受到关注。D改成<code>investments<\/code>，需要额外的投资关系，文章没有把这笔钱写成银行家为获取投资回报而安排的资本。<\/p>\n<p>所以D把“企业家出资奖励科学家”改成“银行家投资”，不是对同一事实的不同说法。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<p>后文用赞助人指代出资者，并说明其财富用于引起对科学成功者的关注。<\/p>\n<\/blockquote>\n<p>资金来源之后接的是赞助目的，文章没有转向银行家的投资项目。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Bankers finance the Fundamental Physics Prize as one of their investments.<\/p>\n<p>银行家把资助基础物理学奖当作他们的一项投资。<\/p>\n<\/blockquote>\n<p>D成立至少要让出资主体变成银行家，并说明资助属于投资。实际作者沿用企业家及赞助人的身份，接着讲关注科学的目的；两处所需改变都不在原文推进之中。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>an example of bankers’ investments<br>银行家投资的一个例子<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“bank accounts of Internet entrepreneurs”判断出资主体。主旨欢迎资源流向科学，不会把资源的拥有者改成银行家；D提出的主体和投资性质都要由局部文字承担，而原文给出的关系不同。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>31题结论<\/h3>\n<blockquote>\n<p><strong>31. C. a handsome reward for researchers<\/strong><\/p>\n<\/blockquote>\n<p>A借用出资者的财富，将资金来源换成奖项象征。<\/p>\n<p>B从新奖加入同类奖项行列，补出可能取代诺贝尔奖的判断。<\/p>\n<p>C将丰厚金额与面向研究者的奖励性质合在一起，准确概括首段。<\/p>\n<p>D把企业家的银行账户改成银行家投资，更换了主体和资金关系。<\/p>\n<h2>32题<\/h2>\n<blockquote>\n<p>The critics think that the new awards will most benefit ______.<br>批评者认为，新奖项最让谁受益？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道观点细节题。题干限定说话人是批评者，要求找出他们认为的主要受益者，不能拿作者最后的总体态度替换批评者的意见。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<p>题干中的<code>critics<\/code>对应第2段发出质疑的科学家。<code>say scientists<\/code>标明是谁作出判断，<code>self-promotion for those behind them<\/code>给出他们认定的收益及受益者；后面几句则补充他们对科研评价和研究资助的批评。<\/p>\n<h3>A. the profit-oriented scientists<\/h3>\n<blockquote>\n<p>以利润为导向的科学家<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A中的修饰语写成<code>[xxx]<\/code>，但<code>scientists<\/code>可见。做题时区分了句尾发言的科学家与<code>those behind them<\/code>所指的幕后设奖者，认为A把批评者放到了受益者的位置，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A利用句尾的<code>scientists<\/code>及高额奖金让人联想到逐利科学家，但这句话把自我宣传的收益归给<code>those behind them<\/code>。科学家在此处是陈述批评意见的人，不是该短语的指代对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最让以利润为导向的科学家受益。<\/p>\n<\/blockquote>\n<p>题干要求批评者的看法，<code>say scientists<\/code>标明第2段这句话正是他们的发言；判断受益者则要看<code>self-promotion for those behind them<\/code>。<\/p>\n<p>句子先说新奖是一种自我宣传活动，<code>for those behind them<\/code>把这项好处归给奖项背后的设立者。句末才补上“科学家们说”，交代整句话是谁说的。<\/p>\n<p>A把句末说话人换到主要受益者的位置，还用<code>profit-oriented<\/code>将这些科学家限定为逐利者。巨额奖金可以引起这种联想，但这一句没有把宣传收益归给逐利科学家。这里并不需要断言科学家从奖项中毫无收益，只需核对批评者认为谁在借设奖宣传自己。<\/p>\n<p>A将“科学家批评设奖者进行自我宣传”改成“科学家认为逐利科学家最受益”，错换了批评意见中的受益对象。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<p>The goals of the prize-givers seem as scattered as the criticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.<\/p>\n<p>批评者把奖项称作幕后人的自我宣传，作者接着转向奖项设立者各不相同的目标。<\/p>\n<\/blockquote>\n<p>这段争论的承接对象是设奖者及其目标，没有继续追查哪一类科学家最能逐利。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Critics say that the new awards chiefly serve scientists who put financial profit first.<\/p>\n<p>批评者说，这些新奖主要服务于把金钱利益放在首位的科学家。<\/p>\n<\/blockquote>\n<p>如果A是批评者的判断，文章需要把主要收益明确归给逐利科学家；实际却把自我宣传归给幕后设奖者，并在下一段讨论这些人的目标。两条路线的获益群体不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>the profit-oriented scientists<br>以利润为导向的科学家<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“self-promotion for those behind them, say scientists”判断。主旨中的接受态度是作者的结论，既不能替批评者指定受益者，也不能把发言者变成受益者；A需要的逐利科学家不是局部原句所指的人。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. the founders of the new awards<\/h3>\n<blockquote>\n<p>新奖项的设立者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>self-promotion<\/code>位置显示为<code>[xxx]<\/code>，做题分析仍把<code>those behind them<\/code>理解为新奖的幕后设立者，并把这一句解释为出资者的自我宣传。第一轮保留B，其余三项排除，最终选B。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>B将代词性表述<code>those behind them<\/code>换成明确身份<code>the founders of the new awards<\/code>。原句中的<code>self-promotion<\/code>说明为何这些幕后设奖者被批评者看作主要受益者：奖项为他们带来宣传。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最让这些奖项的设立者受益。<\/p>\n<\/blockquote>\n<p>第2段直接用<code>self-promotion<\/code>说明批评者眼中的收益，用<code>those behind them<\/code>说明这项收益归谁；第1段的企业家出资背景帮助确认这些幕后人是谁。<\/p>\n<p><code>them<\/code>承接<code>the new awards<\/code>，所以<code>those behind them<\/code>指在新奖背后发起、支持它们的人。<code>for<\/code>把自我宣传的用途落在这些人身上，而不是落在句尾的发言者身上。<\/p>\n<p>题干中的<code>most benefit<\/code>要求找批评意见着重指出的受益方，并不要求证明其他群体绝无收益。把新奖整体说成幕后人的自我宣传，正是在批评其主要服务于设奖者的形象。<\/p>\n<p>B把原文的幕后身份明确为奖项设立者，保留了批评者、宣传收益及受益对象之间的关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<p>The goals of the prize-givers seem as scattered as the criticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.<\/p>\n<p>批评者认为奖项为幕后人宣传，下一段继续区分设奖者制造震动、吸引人学科学和奖励研究者等目的。<\/p>\n<\/blockquote>\n<p>作者先报告对设奖者动机的批评，再把这些动机展开，随后才形成自己的总体评价。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>In the critics’ view, the founders use the awards to promote themselves and are the chief beneficiaries.<\/p>\n<p>在批评者看来，设奖者借奖项宣传自己，是主要受益者。<\/p>\n<\/blockquote>\n<p>B要求的写法就是把自我宣传归到设奖者身上。原文已经这样报告批评意见；下一段对目标的补充是在展开与衡量这一意见，并没有更换它所指的幕后人。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>the founders of the new awards<br>新奖项的设立者<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“self-promotion for those behind them”判断。作者最后接受新奖，不表示他从未报告过出资者自我宣传的批评；B回答的是批评者的说法，与全文先呈现质疑再作总体判断的顺序相容。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. the achievement-based system<\/h3>\n<blockquote>\n<p>以成就为基础的体系<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项的体系名称完整可见，原句动作位置显示为<code>[xxx]<\/code>。做题分析把那一处解释为可能扭曲体系，并据此将它与题干的获益方向比较，第一轮排除C，没有后续改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C完整保留了原文中的体系名称，却省略了决定关系的<code>could distort<\/code>。接回题干之后，“可能被扭曲的体系”就变成了“最受益的体系”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最有利于以成就为基础的体系。<\/p>\n<\/blockquote>\n<p>C几乎原样出现于第2段的<code>the achievement-based system<\/code>，所以定位到这句话之后，重点要比较前面的动作，而不能仅凭名词相同作答。<\/p>\n<p>原句的动作是<code>could distort<\/code>：批评者担心新奖可能扭曲同行评审主导的、以成就为基础的体系。下一句继续提出对现有研究状态被固化的担忧，仍是机制方面的质疑。<\/p>\n<p><code>could<\/code>保留了风险语气，作者并未声称破坏已经发生；但这也不是说体系最能获益。C接回<code>will most benefit<\/code>后，把批评意见的负面风险改成主要好处。<\/p>\n<p>因此，相同的体系名词不能挽救被改反的作用方向：原文担心它受到扭曲，C却把它列为新奖最主要的受益方。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<p>批评者先担心评价体系被扭曲、研究现状被固化，又指出新奖并不资助同行评审研究。<\/p>\n<\/blockquote>\n<p>后面的批评继续补充新奖与既有研究体系之间的问题，并没有转向赞扬它改善成就评价。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The new awards will strengthen the achievement-based system of peer-review-led research.<\/p>\n<p>新奖项将加强同行评审主导的、以成就为基础的体系。<\/p>\n<\/blockquote>\n<p>C成立至少需要批评者把新奖写成帮助这种体系。实际的<code>distort<\/code>和对现状固化的担忧都没有提供这种积极推进；不能把“涉及同一体系”当成“使该体系获益”。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>the achievement-based system<br>以成就为基础的体系<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“could distort the achievement-based system”判断。作者认为资源流向科学是好事，是他在末段给出的接受理由，不能倒放到批评者嘴里，改写他们对评价体系可能受损的意见。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. peer-review-led research<\/h3>\n<blockquote>\n<p>同行评审主导的研究<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>They do not fund peer-reviewed research<\/code>完整可见，做题时据此认为同行评审研究不是批评者认定的主要受益方，第一轮排除D，最后保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用第2段反复出现的研究名称，却把批评者指出的资助缺失及制度风险，改成了这类研究最受益。要判断的是批评者如何评价，不是凭常识推想奖项能间接带来哪些好处。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最有利于同行评审主导的研究。<\/p>\n<\/blockquote>\n<p>D的<code>peer-review-led research<\/code>在第2段直接出现，后面的<code>peer-reviewed research<\/code>继续指向同行评审研究，需把相邻几句的评价连起来读。<\/p>\n<p>批评者担心新奖扭曲以成就为基础的体系、固化研究现状，随后明确指出它们不资助同行评审研究。这组话给出的是对新奖支持研究方式的质疑。<\/p>\n<p>单凭“不资助”不能推出“绝对没有任何间接好处”，但题干也没有问有没有一丁点间接作用，而是在问批评者认定的主要受益对象。原段将自我宣传归给幕后人，并没有把同行评审研究列为主要获益者。<\/p>\n<p>D把被指出缺少资助、面临制度风险的一方，写成批评者认为最受益的一方，改变了这组批评的评价方向。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>They do not fund peer-reviewed research.<\/p>\n<p>They perpetuate the myth of the lone genius.<\/p>\n<p>批评者说新奖并不资助同行评审研究，并延续孤独天才的神话。<\/p>\n<\/blockquote>\n<p>说完资助问题，批评继续进入对个人英雄叙事的质疑，仍没有转成对同行评审研究获益的肯定。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Critics acknowledge that peer-review-led research gains the greatest support from the new awards.<\/p>\n<p>批评者承认，同行评审主导的研究从新奖项获得了最大的支持。<\/p>\n<\/blockquote>\n<p>D所需的推进应让批评者肯定这类研究获得主要支持；实际却接连指出研究资助缺失和研究叙事的问题。两条路线对同一研究方式的评价不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>peer-review-led research<br>同行评审主导的研究<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“They do not fund peer-reviewed research”及同段对幕后人自我宣传的评价判断。末段作者欢迎金钱流向科学，不等于批评者承认同行评审研究最受益，D混淆了说话人及具体受益范围。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>32题结论<\/h3>\n<blockquote>\n<p><strong>32. B. the founders of the new awards<\/strong><\/p>\n<\/blockquote>\n<p>A把发出批评的科学家放到主要受益者的位置，并加上逐利限定。<\/p>\n<p>B将幕后设奖者的自我宣传准确概括为设立者受益。<\/p>\n<p>C借用体系名称，把可能被扭曲改成最能获益。<\/p>\n<p>D把批评者指出资助缺失及制度风险的研究，改成他们认定的主要受益方。<\/p>\n<h2>33题<\/h2>\n<blockquote>\n<p>The discovery of the Higgs boson is a typical case which involves ______.<br>希格斯玻色子的发现是一个典型案例，它涉及什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道例子作用与细节相结合的题。题干以希格斯玻色子的发现为案例，要求识别它体现的研究特点；应把这个案例放回第4段关于获奖人数限制和现代研究合作性的整句中读。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<p>段首先提出新旧奖项如何分配都值得讨论。包含希格斯玻色子的长句先说明三人名额限制已不适应现代合作研究，再以授奖时谁被遗漏的争执来说明这一矛盾。例后，文章转向诺贝尔奖的私人设立背景和时间带来的认可，没有展开获奖者个人地位或成果展示的讨论。<\/p>\n<h3>A. the joint effort of modern researchers<\/h3>\n<blockquote>\n<p>现代研究者的共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了<code>collaborative nature of modern research<\/code>，虽然预示争执的修饰词被遮挡，仍把<code>joint effort<\/code>与合作性质对应起来，第一轮保留A，其余三项排除，最终选A。<\/p>\n<p><strong>选项类型：正确概括例子作用。<\/strong><\/p>\n<p>A将<code>collaborative nature of modern research<\/code>改写为<code>the joint effort of modern researchers<\/code>，从研究具有合作性质转成研究者共同努力。希格斯玻色子发现是用来说明这种合作特点与三人获奖限制的冲突。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及现代研究者共同努力的典型案例。<\/p>\n<\/blockquote>\n<p>题干中的<code>the discovery of the Higgs boson<\/code>在第4段长句后半部出现，要向前接到<code>the collaborative nature of modern research<\/code>，看这个案例在说明什么。<\/p>\n<p>长句的主干说诺贝尔奖最多三人且必须在世的限制，已经不适应现代研究的合作性质。破折号后的<code>as will be demonstrated<\/code>继续说明，承认希格斯玻色子发现时围绕谁被遗漏的争执，会展示这种不适应。<\/p>\n<p>因此，前半句给出研究特点，后半句提供与该特点有关的授奖困境。只有研究成就涉及多位研究者的共同工作，获奖名额限制才会产生这里所说的遗漏问题；无需另行补出具体团队人数。<\/p>\n<p>A用“研究者共同努力”概括原文明确提出的合作性质，保留了案例所依赖的研究方式。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>文章以合作研究和三人获奖限制的冲突引出希格斯案例，随后转而回顾诺贝尔奖的私人创立背景。<\/p>\n<\/blockquote>\n<p>这一例子完成的是对诺贝尔奖分配规则的说明，例后作者没有进入发现成果本身的技术解释。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The discovery of the Higgs boson reflects the joint work of many researchers, which a three-person prize limit cannot fully recognize.<\/p>\n<p>希格斯玻色子的发现体现多位研究者的共同工作，三人的获奖限制难以完整认可这种贡献。<\/p>\n<\/blockquote>\n<p>A所需的写法将共同工作接到奖励人数的局限上，正是原长句从合作性质推进到遗漏争执的关系。它没有把例子改成介绍获奖者地位或展示研究技术。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>the joint effort of modern researchers<br>现代研究者的共同努力<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the collaborative nature of modern research”判断。A说明为什么科学奖的分配机制值得讨论，能够放进全文承认质疑仍接受奖项的主线；具体的共同努力则由这处局部词句坐实。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<h3>B. controversies over the recipients’ status<\/h3>\n<blockquote>\n<p>围绕获奖者身份或地位的争议<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B写成<code>controversies over the [xxx] status<\/code>，做题分析把它理解为获奖者身份争议；随后将它与<code>who is ignored<\/code>比较，认为原文重点在合作成果中谁被遗漏，第一轮排除B，后面没有改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了原句确实预期会出现的授奖争执，却将争议对象从“共同作出贡献的人中谁被遗漏”改成“获奖者的身份或地位”。两处都涉及科学奖的认可，但未获充分认可的贡献者与获奖者不是同一对象，遗漏问题也不等于对获奖者身份地位的争议。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及获奖者身份或地位争议的典型案例。<\/p>\n<\/blockquote>\n<p>B的<code>controversies<\/code>对应原句的<code>row<\/code>，<code>recipients’ status<\/code>又使人联想到同句的<code>recipients<\/code>。这里不能只找到两个相近词，还要看作者把它们怎样连接到这个发现上。<\/p>\n<p>原句确实预期承认希格斯发现时会为“谁被遗漏”发生争执。前面的合作性质与三人限制解释了这个对象：研究由多人共同完成，但奖项名额不足以容纳所有应受认可的贡献者。<\/p>\n<p>B中的<code>recipients’ status<\/code>说的是获奖者的身份或地位，原句的<code>who is ignored<\/code>却在追问有贡献而未被纳入认可范围的人。原文没有进一步说获奖者本身的身份或地位受到争议，不能把“谁没有得到认可”改成“获奖者的地位是否有问题”。<\/p>\n<p>因此，B把有关遗漏贡献者的争执改成获奖者身份或地位争议，改变了原句的对象。合作研究的背景进一步帮助我们看清，这里的争执由贡献者被遗漏而来。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>作者先把合作性质与三人名额相对照，再提对哪些贡献者会被遗漏的争执；下一句转向诺贝尔奖的创立背景。<\/p>\n<\/blockquote>\n<p>这条实际路线将争执落在共同贡献的认可不足上，没有转为怀疑获奖者本身的身份或地位。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The dispute surrounding recognition of the Higgs boson discovery concerns the status of those receiving the prize, rather than which contributors are left out.<\/p>\n<p>围绕希格斯玻色子发现的认可所发生的争执，涉及获奖者的身份或地位，而不是哪些贡献者被遗漏。<\/p>\n<\/blockquote>\n<p>B成立至少需要把争执对象写成获奖者的身份或地位；实际则明确写<code>who is ignored<\/code>，并用合作研究与人数限制解释为何有人被漏掉。两条路线都可以包含争执，但争执围绕的人和问题不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>controversies over the recipients’ status<br>围绕获奖者身份或地位的争议<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the inevitable row over who is ignored”判断。全文承认奖项可以受到批评，却不能据此认定任何一种具体争议都存在；B写的是获奖者的身份或地位，而这处原文写的是共同贡献者被遗漏，主旨不能替它补上被换掉的对象。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. the demonstration of research findings<\/h3>\n<blockquote>\n<p>研究成果的展示<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项与原文的<code>demonstrated<\/code>都能读到，做题时追问被展示的是成果还是现代研究的合作性质，认为C错接了这个动作所说明的内容，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C利用<code>will be demonstrated<\/code>和<code>discovery<\/code>，把“案例说明获奖限制不适应合作研究”改成“展示研究成果”。它保留了展示这个动作，却换掉了动作所证明的内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及研究成果展示的典型案例。<\/p>\n<\/blockquote>\n<p>C中的<code>demonstration<\/code>与原文<code>demonstrated<\/code>词形相近，<code>research findings<\/code>又容易与<code>discovery<\/code>相连，因此要核对<code>as will be demonstrated<\/code>承接的是前面哪一个判断。<\/p>\n<p>破折号前的判断是：诺贝尔奖三人限制已经被现代合作研究的发展超越。后面的争执会说明这一点，原句没有将研究成果设为被展示的对象。<\/p>\n<p><code>by the inevitable row<\/code>还指出这种说明通过什么实现：通过承认共同成果时谁被遗漏的争论。它不是通过发布数据、呈现发现过程或展示成果来解释物理学发现。<\/p>\n<p>C把“以授奖争执说明制度与合作研究的冲突”改成“展示研究成果”，对<code>demonstrated<\/code>前后关系的理解发生了变化。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<p>作者先借希格斯案例说明获奖名额的问题，随后把讨论引向诺贝尔奖随时间取得认可。<\/p>\n<\/blockquote>\n<p>相关段落一直评价科学奖项的规则和历史地位，没有转向教读者理解希格斯发现的研究结果。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The case of the Higgs boson illustrates how researchers present and demonstrate their scientific findings.<\/p>\n<p>希格斯玻色子的案例说明研究者如何呈现和展示自己的科学发现。<\/p>\n<\/blockquote>\n<p>C成立需要文章至少把展示过程或研究结果作为说明对象；实际展示的是三人限额与合作研究不相适应。相同的动词词根不能使两种说明对象相同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>the demonstration of research findings<br>研究成果的展示<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the Nobel Foundation’s limit”与“as will be demonstrated by the inevitable row”的连接判断。全文关注奖项的可接受性，C却把这一段变成研究成果展示；局部句义也没有提供这种技术介绍。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. legitimate concerns over the new prizes<\/h3>\n<blockquote>\n<p>对新奖项的合理担忧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了段首的新旧奖范围以及例子前的<code>Nobel Foundation’s limit<\/code>，做题时认为D只写新奖，改换了希格斯案例直接针对的对象，第一轮排除D，最后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D取用了段首<code>legitimate concerns<\/code>，却把范围缩到<code>the new prizes<\/code>。希格斯发现所在的长句具体讨论的是诺贝尔奖的三人限制，不能把对旧奖分配规则的说明改挂到新奖上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及对新奖项合理担忧的典型案例。<\/p>\n<\/blockquote>\n<p>D的<code>legitimate concerns<\/code>在第4段首句出现，但题干给出的希格斯发现位于后面的长句；两处之间还有新奖与诺贝尔奖的对象转换。<\/p>\n<p>段首用<code>both new and old<\/code>统领科学奖的分配问题。随后先讨论新设的生命科学突破奖，再用<code>But<\/code>转入诺贝尔奖限制，希格斯例子紧接在这一旧奖问题后。<\/p>\n<p>因此，段首承认对新奖存在合理担忧，并不表示本段每个例子都针对新奖。D的<code>new<\/code>限定了范围，而这个案例直接说明诺贝尔奖的获奖人数规则与现代研究不匹配。<\/p>\n<p>D将统领新旧奖的担忧截取成只针对新奖，又把旧奖限制下的案例放了进去，改变了例子的指向。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>作者先指出生命科学突破奖覆盖范围不具代表性，再转向诺贝尔奖三人限制，随后才提希格斯案例。<\/p>\n<\/blockquote>\n<p>两种奖项的问题分别展开，<code>But<\/code>已经将后半部分的讨论对象换成诺贝尔奖。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The new prizes’ rules fail to recognize collaborative discoveries, as the case of the Higgs boson shows.<\/p>\n<p>新奖项的规则未能认可合作完成的发现，希格斯玻色子的案例说明了这一点。<\/p>\n<\/blockquote>\n<p>D所需的写法要让新奖项规则成为案例的前提；实际前提明确是诺贝尔基金会的限制。即使二者都属于科学奖，也不能省略这次对象转换。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>legitimate concerns over the new prizes<br>对新奖项的合理担忧<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the Nobel Foundation’s limit of three recipients per prize”判断。全文既谈新奖也拿旧奖作比较，主旨承认新奖受批评不使所有例子都只属于新奖；D缩小范围后放错了案例。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>33题结论<\/h3>\n<blockquote>\n<p><strong>33. A. the joint effort of modern researchers<\/strong><\/p>\n<\/blockquote>\n<p>A概括现代研究的合作性质，保留希格斯案例与获奖人数限制的关系。<\/p>\n<p>B把共同贡献者中谁被遗漏的争执，改成围绕获奖者身份或地位的争议。<\/p>\n<p>C利用demonstrated，将被说明的制度局限改成研究成果展示。<\/p>\n<p>D把直接说明诺贝尔奖限制的案例，改指向新奖项。<\/p>\n<h2>34题<\/h2>\n<blockquote>\n<p>According to Paragraph 4, which of the following is true of the Nobels?<br>根据第4段，关于诺贝尔奖，下面哪项说法正确？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道限定段落的细节题。题干把范围限定在第4段，判断对象是诺贝尔奖；应分别核对其分配规则、创立背景和后来获得认可的原因。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<p>第4段先指出新旧奖的分配都有可讨论之处，再说明诺贝尔奖的三人限制已不适应现代合作研究。段末从规则转向历史：它同样由富人设立，而给予它认可的是时间，不是设立者的初衷。<\/p>\n<h3>A. History has never cast doubt on them.<\/h3>\n<blockquote>\n<p>历史从未对诺贝尔奖提出过怀疑。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>History<\/code>与段末<code>Time<\/code>相连，认为“后来由时间取得认可”不支持“历史从未怀疑”，第一轮排除A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用时间和认可的关系，把“经历时间获得正当性”扩大成“历史上从无怀疑”。段首已经将诺贝尔奖包括在新旧奖的合理担忧中，后面也具体质疑其三人限制。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第4段，历史从未对诺贝尔奖提出过怀疑。<\/p>\n<\/blockquote>\n<p>题干限定第4段，A的<code>History<\/code>对应段末的<code>Time<\/code>，但<code>never cast doubt<\/code>还要求回看同段作者有没有提出疑问，不能只读最后一句。<\/p>\n<p><code>Time ... has given them legitimacy<\/code>说明时间带来了认可。仅靠这一句，不能反推诺贝尔奖过去必然遭到怀疑；同样，也不能把它扩写成过去从未被怀疑。<\/p>\n<p>判断A还要接上段首的<code>legitimate concerns<\/code>与<code>both new and old<\/code>，以及后面明确指出的三人规则不适应现代合作研究。文章在肯定其正当性的同时仍对它的分配机制提出具体疑问。<\/p>\n<p>A的<code>never<\/code>把任何怀疑都排除，原文却允许长期认可与现实质疑并存，A将这种并存关系改成了从无疑问。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<p>作者既批评三人名额已落后于合作研究，又说时间赋予诺贝尔奖认可。<\/p>\n<\/blockquote>\n<p>这两处一起说明有认可的奖项仍可受到批评，作者没有把获得正当性等同于一贯免于质疑。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Throughout their history, the Nobels have remained free from doubt about their rules and standing.<\/p>\n<p>在整个历史中，诺贝尔奖的规则和地位始终没有受到怀疑。<\/p>\n<\/blockquote>\n<p>A所需的写法必须抹去历史中的质疑；实际这一段就列出旧奖的具体规则问题。结尾关于时间的肯定没有取消前面的担忧，二者可以同时成立。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认新奖受到批评仍可接受，不能直接判断诺贝尔奖历史上是否遭到怀疑、代表性最高与否，或其认可究竟从何而来。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>History has never cast doubt on them.<br>历史从未对诺贝尔奖提出过怀疑。<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“legitimate concerns ... both new and old”及对三人限制的批评判断。作者接受一个奖项并不要求它从未受质疑，正如新奖可在批评中被接受；A把认可扩大为免于任何怀疑。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. They are the most representative honor.<\/h3>\n<blockquote>\n<p>它们是最具代表性的荣誉。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时将<code>most representative<\/code>与诺贝尔奖三人限制比较，认为原文指出覆盖不足，不能据此称它最具代表性，第一轮排除B，没有发生后续改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B让人从诺贝尔奖的声望和认可联想到代表性最高。第4段既没有给科学荣誉作代表性排名，也没有把诺贝尔奖的历史认可等同于最高代表性。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第4段，诺贝尔奖是最具代表性的荣誉。<\/p>\n<\/blockquote>\n<p>B的<code>representative<\/code>容易与第4段<code>unrepresentative view<\/code>相连，但那句话的主体是生命科学突破奖。题干问诺贝尔奖，必须接着看后面的三人限制与时间带来的认可。<\/p>\n<p>原文批评新奖的涵盖范围，不等于下一句就在称赞旧奖最全面；<code>But<\/code>后指出诺贝尔奖人数限制也已不适应合作研究。<\/p>\n<p>同时，“存在代表不足”本身还不能计算它与所有其他奖项相比谁最好。B中的<code>most<\/code>需要比较范围和最高程度的依据，而段落没有进行这种排序；段末<code>legitimacy<\/code>也只说明获得认可。<\/p>\n<p>B将“有长期声望和认可”推成“代表性在各种荣誉中最高”，添加了原文未建立的评价维度与最高级判断。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>新奖对生命科学的理解不具代表性，诺贝尔奖也存在三人名额不能覆盖现代合作研究的问题。<\/p>\n<\/blockquote>\n<p>作者在并列指出新旧奖各自的分配局限，并非从新奖的问题转向给旧奖排第一。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Among scientific honors, the Nobels represent researchers’ contributions more fully than any other prize.<\/p>\n<p>在科学荣誉中，诺贝尔奖比任何其他奖项都更全面地代表研究者的贡献。<\/p>\n<\/blockquote>\n<p>B成立至少需要这样的比较和最高级评价。实际后文补充的是旧奖也有规则局限，没有引入足以决定谁最有代表性的比较。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认新奖受到批评仍可接受，不能直接判断诺贝尔奖历史上是否遭到怀疑、代表性最高与否，或其认可究竟从何而来。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>They are the most representative honor.<br>它们是最具代表性的荣誉。<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“has long been outgrown by the collaborative nature of modern research”及段末的时间评价判断。全文接受新奖的态度并没有给旧奖作代表性排名；B要求的最高级结论不能由“奖项可接受”推出。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. Their legitimacy has long been in dispute.<\/h3>\n<blockquote>\n<p>它们的正当性长期处于争议之中。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C末尾的<code>dispute<\/code>及原句<code>legitimacy<\/code>位置被遮挡，做题分析将C理解为正当性长期未定，再与“时间赋予认可”的结果比较，第一轮排除C，之后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C保留<code>legitimacy<\/code>及长时间这一线索，却把时间累积得到的认可改成持续处于争议。它还容易把同段对分配规则的批评，扩大为对奖项整体正当性的长期争论。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第4段，诺贝尔奖的正当性长期处于争议之中。<\/p>\n<\/blockquote>\n<p>C直接出现<code>legitimacy<\/code>，对应第4段末句；<code>has long been in dispute<\/code>则要与原文的<code>has given them<\/code>比较，看时间带来的是什么状态。<\/p>\n<p>原句的主语是<code>Time<\/code>，动作是<code>has given<\/code>，给予的对象是诺贝尔奖，所给予的是<code>legitimacy<\/code>。这里的重点是它随时间获得了认可，不是认可一直悬而未决。<\/p>\n<p>C把完成的认可过程写成持续的争议状态。同段确实允许质疑科学奖的分配机制，但“规则仍有问题”与“奖项正当性长期处于争议”不是同一范围；原文没有用前者否定段末的认可。<\/p>\n<p>C将“时间已经赋予正当性”改成“长期仍在争论正当性”，改变了时间与认可之间的关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<p>诺贝尔奖同样由富人依自己的意愿创立，但作者说给予它正当性的是时间。<\/p>\n<\/blockquote>\n<p>这一历史比较以获得认可收束，为如何看待新设奖项提供参照，而不是以长期无法获得认可收束。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Even after all these years, the legitimacy of the Nobels remains in dispute.<\/p>\n<p>即使过了这么多年，诺贝尔奖的正当性仍处于争议之中。<\/p>\n<\/blockquote>\n<p>C需要把多年之后的状态写成仍在争议，实际句子却写成时间已经给予认可。规则可被质疑并不使这两种对正当性的总结相同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认新奖受到批评仍可接受，不能直接判断诺贝尔奖历史上是否遭到怀疑、代表性最高与否，或其认可究竟从何而来。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>Their legitimacy has long been in dispute.<br>它们的正当性长期处于争议之中。<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“Time, rather than intention, has given them legitimacy”判断。全文把争议与接受并置，所以不能只因看见批评就认定奖项始终缺少认可；C错写了作者用旧奖历史所提供的参照。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. Their endurance has done justice to them.<\/h3>\n<blockquote>\n<p>它们经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>endurance<\/code>与原文<code>Time<\/code>相连，将<code>done justice to them<\/code>理解为经过时间获得应有评价，第一轮保留D，并作为本题唯一保留项选出。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>endurance<\/code>概括奖项长期存在、经受时间的过程，<code>done justice to them<\/code>概括其后来得到应有认可。D用另一种表达保留了原文“时间赋予正当性”的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第4段，诺贝尔奖经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p>D中的<code>endurance<\/code>与第4段的<code>Time<\/code>相接，<code>done justice to them<\/code>则对应<code>has given them legitimacy<\/code>。两处都在回答诺贝尔奖怎样取得认可。<\/p>\n<p>前一句提醒读者：诺贝尔奖本身也出自一个富人的个人决定。下一句再把<code>Time<\/code>与<code>intention<\/code>对照，说明正当性来自时间检验，不是仅靠初衷自动取得。<\/p>\n<p>D的<code>done justice to<\/code>在这里表示作出应有或公正的评价，不是指法庭审判。它也没有说时间使奖项规则变得完美，只说长期存在让奖项获得应有认可。<\/p>\n<p>D保留了奖项、时间积累和认可结果三者的关系，准确改写了段末的历史评价。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<p>As much as some scientists may complain about the new awards, two things seem clear.<\/p>\n<p>文章回顾旧奖由富人设立、随时间获得认可，接着回到虽有科学家抱怨但新奖仍可接受的问题。<\/p>\n<\/blockquote>\n<p>诺贝尔奖的经历让比较落在奖项如何被看待上，为结尾不因争议就拒绝新奖作铺垫。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Nobels have earned due recognition through their long existence, rather than through their founder’s intentions alone.<\/p>\n<p>诺贝尔奖通过长期存在获得了应有认可，而不是仅凭设立者的初衷。<\/p>\n<\/blockquote>\n<p>D要求的时间与认可关系在原文已经具备。用这种历史评价回到新奖的接受问题，也与实际从第4段向第5段的推进相接，没有把认可扩成毫无缺陷。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认新奖受到批评仍可接受，不能直接判断诺贝尔奖历史上是否遭到怀疑、代表性最高与否，或其认可究竟从何而来。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>Their endurance has done justice to them.<br>它们经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“Time, rather than intention, has given them legitimacy”确定。D使旧奖的长期认可成为比较依据，与作者不因批评就拒绝新奖的总体态度相容；具体的时间因果来自段末这句话。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>34题结论<\/h3>\n<blockquote>\n<p><strong>34. D. Their endurance has done justice to them.<\/strong><\/p>\n<\/blockquote>\n<p>A把长期认可扩大为从未有怀疑，忽略同段对旧奖的具体质疑。<\/p>\n<p>B由声望和认可补出代表性最高的比较，段落没有作这种排名。<\/p>\n<p>C把时间已经赋予认可改成正当性长期处于争议。<\/p>\n<p>D以长期存在和应有认可，准确改写时间赋予正当性的关系。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：新科学奖项的兴起<\/strong>（段落1背景介绍） 基础物理学奖（300万美元）→ 并非唯一：近年来一系列丰厚奖项加入诺贝尔奖行列 → 资金来源：互联网企业家的巨额财富 → 动机：成功人士想用财富吸引关注科学领域的成功者<\/p>\n<p>↓（批评声音）<\/p>\n<p><strong>逻辑层次2：对新奖项的批评<\/strong>（段落2批评观点） 核心批评：【&quot;买不到品位&quot;：暴发户企业家买不到诺贝尔奖的声望】→ 具体批评：（1.自我推销行为 + 2.扭曲基于成就的同行评议体系 + 3.巩固现状 + 4.不资助同行评议研究 + 5.延续孤独天才神话）<\/p>\n<p>→（目标分析）<\/p>\n<p><strong>逻辑层次3：奖项设立者的多样目标<\/strong>（段落3目标说明） 目标分散如批评：（震撼 + 吸引人进入科学 + 更好奖励研究者）<\/p>\n<p>↓（理性分析）<\/p>\n<p><strong>逻辑层次4：新旧奖项都存在问题<\/strong>（段落4问题剖析） 合理担忧：【新奖项问题：（生命科学突破奖视角不具代表性）// 诺贝尔奖问题：（限制3人且须在世，不适应现代合作研究）→ 希格斯玻色子发现将引发争议】→ 历史视角：诺贝尔奖也是富人设立 → 时间赋予合法性<\/p>\n<p>↓（理性结论）<\/p>\n<p><strong>逻辑层次5：应以感激接受新奖项<\/strong>（段落5作者观点） 两个清楚事实：（1.大多数研究人员会接受奖项 + 2.资金流向科学是好事）→ 平衡观点：【批评机制是研究文化 // 但这是设立者的钱】→ 结论：应以感激和优雅接受<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：尽管新科学奖项受到诸多批评（缺乏声望、自我推销、可能扭曲研究体系），但考虑到资金流向科学领域的积极意义，以及这是奖项设立者的自由选择，科学界应该以感激和优雅的态度接受这些奖项。<\/p>\n<h2>小标题题<\/h2>\n<h3>题目<\/h3>\n<p><strong>Directions:<\/strong><\/p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)<\/p>\n<p><strong>A. Different Motives for Rewarding Scientists<\/strong><\/p>\n<p><strong>B. Why Scientists Should Refuse Private Prizes<\/strong><\/p>\n<p><strong>C. Private Wealth Brings Glamour to Science<\/strong><\/p>\n<p><strong>D. A Qualified Welcome for Money and Attention<\/strong><\/p>\n<p><strong>E. Old and New Prizes under the Same Scrutiny<\/strong><\/p>\n<p><strong>F. Criticism of Prestige, Promotion and Research Effects<\/strong><\/p>\n<p><strong>G. The Nobel Rules as a Model for All Awards<\/strong><\/p>\n<h2>New Prizes and the Rewards of Science<\/h2>\n<h3>41. __________<\/h3>\n<p>An Oscars-style ceremony and enormous cash awards are bringing a little Hollywood glamour to physics. Alexander Polyakov called the US$3-million Fundamental Physics Prize an interesting experiment when he accepted it. Nor is it alone: a string of lucrative research awards has recently joined the Nobel Prizes. Many are financed by Internet entrepreneurs with enormous fortunes. Having succeeded in their own fields, these benefactors say they want to use their wealth to attract attention to people who have succeeded in science.<\/p>\n<h3>42. __________<\/h3>\n<p>Not all scientists welcome the new awards. Critics argue that money cannot purchase the prestige accumulated by the Nobels and that some prizes are exercises in self-promotion for their founders. Other objections concern research itself: prizes might distort the meritocracy of peer review, reinforce the existing order or fail to support peer-reviewed work. By celebrating exceptional individuals, they may also perpetuate the myth of the lone genius. The objections therefore extend from the reputation of the awards and their founders to their possible influence on scientific work.<\/p>\n<h3>43. __________<\/h3>\n<p>The prize-givers&#39; ambitions are no more uniform than the criticism directed at them. Some want to shock the public, some to attract people into science, and others to reward researchers more generously for their careers. Several want to demonstrate that leading scientists can enjoy the lifestyles of financiers and footballers. A large cash award may thus serve publicity, recruitment, recognition or an image of material success. These aims differ even when the outward form of the reward looks similar.<\/p>\n<h3>44. __________<\/h3>\n<p>There are legitimate questions about how both new and established prizes recognize achievement. The new Breakthrough Prize in Life Sciences takes an unrepresentative view of the subjects it covers. Yet the Nobel Foundation&#39;s rule limiting each award to three living recipients has also been overtaken by the collaborative nature of modern research, a problem likely to surface in disputes over recognition for the Higgs boson. Moreover, the Nobels themselves began with a wealthy individual&#39;s decisions about his own money. Their legitimacy developed with time, rather than following automatically from a nobler original intention.<\/p>\n<h3>45. __________<\/h3>\n<p>Despite the complaints about large financial rewards and the goals behind them, two considerations remain clear. Most researchers would accept such a prize if offered one, and money and attention reaching science are preferable to their going elsewhere. Questioning the mechanism is entirely consistent with research culture, but the funds also belong to the people who choose to give them. Scientists can therefore scrutinize the arrangements without rejecting the gift. A response combining gratitude with critical judgment is wiser than treating imperfections as a reason to turn support away.<\/p>\n<h4>41题<\/h4>\n<p>【答案】C. Private Wealth Brings Glamour to Science<\/p>\n<blockquote>\n<p>私人财富为科学带来耀眼光环<\/p>\n<\/blockquote>\n<p>这一部分介绍新的科学奖项长什么样、钱从哪里来，以及出资者声称希望产生怎样的关注效果。<\/p>\n<p>开头的两个细节确立新现象：<\/p>\n<blockquote>\n<p>An Oscars-style ceremony and enormous cash awards<br>bringing a little Hollywood glamour to physics<\/p>\n<\/blockquote>\n<p>随后用基础物理学奖作实例，再扩大到一系列新奖项，最后交代资助者：<\/p>\n<blockquote>\n<p>financed by Internet entrepreneurs with enormous fortunes<\/p>\n<\/blockquote>\n<p>推进链为：<\/p>\n<blockquote>\n<p>盛大典礼与巨额奖金 → 一个代表性奖项 → 同类奖项增多 → 私人企业家出资并希望吸引关注。<\/p>\n<\/blockquote>\n<p>C的<code>Private Wealth<\/code>对应企业家的财富，<code>Brings Glamour to Science<\/code>对应典礼、奖金和公众关注，覆盖了整段的现象与来源。<\/p>\n<p>最强干扰是A。本段末尾确实出现一个资助目的，但尚未比较不同出资者的多种目标；A要求的<code>Different Motives<\/code>在43部分才具体展开。用A会把来源和颁奖形式这些主体内容压成一个末尾细节。<\/p>\n<blockquote>\n<p><strong>41. C<\/strong><\/p>\n<\/blockquote>\n<h4>42题<\/h4>\n<p>【答案】F. Criticism of Prestige, Promotion and Research Effects<\/p>\n<blockquote>\n<p>对声望、自我宣传和科研影响的批评<\/p>\n<\/blockquote>\n<p>这一部分集中列举科学家对新奖项的反对意见，并把意见分成奖项声望、设奖者获益和科研机制几组。<\/p>\n<p>开头的<code>Not all scientists welcome<\/code>先提示立场变化；接下来的证据分别是：<\/p>\n<blockquote>\n<p>money cannot purchase the prestige accumulated by the Nobels<br>exercises in self-promotion for their founders<br>distort the meritocracy of peer review<\/p>\n<\/blockquote>\n<p>之后还补充固化现状、未支持同行评议研究，以及延续“孤独天才”神话。结尾明确把这些不同对象重新合拢。<\/p>\n<blockquote>\n<p>质疑能否买来声望 → 质疑设奖者是否自我宣传 → 列出对科研评价与研究形象的担忧 → 归纳批评覆盖面。<\/p>\n<\/blockquote>\n<p>F中的三个并列部分依次对应这些内容，没有把全部批评缩成一种动机。<\/p>\n<p>最强干扰是B。列举批评不等于要求科学家拒绝奖金；本段并没有给出<code>should refuse<\/code>这样的行动结论。B把对机制的质疑推成拒收一切私人奖项，范围和判断强度都超出了这一部分。<\/p>\n<blockquote>\n<p><strong>42. F<\/strong><\/p>\n<\/blockquote>\n<h4>43题<\/h4>\n<p>【答案】A. Different Motives for Rewarding Scientists<\/p>\n<blockquote>\n<p>奖励科学家的不同动机<\/p>\n<\/blockquote>\n<p>这一部分由批评者转向奖项设立者，把看似相同的高额奖励拆成几种不同目标。<\/p>\n<p>开头直接指出：<\/p>\n<blockquote>\n<p>The prize-givers&#39; ambitions are no more uniform than the criticism directed at them.<\/p>\n<\/blockquote>\n<p>随后<code>Some ... some ... others ... Several ...<\/code>并列展示制造轰动、吸引人才、回报科研生涯和展示富裕生活。结尾再次提醒：<\/p>\n<blockquote>\n<p>These aims differ even when the outward form of the reward looks similar.<\/p>\n<\/blockquote>\n<p>推进链为：<\/p>\n<blockquote>\n<p>指出目标不统一 → 逐一列出不同目标 → 归纳相似奖励形式背后的目的差异。<\/p>\n<\/blockquote>\n<p>A的<code>Different Motives<\/code>对应上述并列目标，<code>for Rewarding Scientists<\/code>限定这些差异都发生在科学奖项的设立动机上。<\/p>\n<p>最强干扰是C。让科学家像金融家、球星一样生活，确实与财富和光环有关，但它只是其中一种目标；招揽人才、承认长期贡献并不都等同于制造豪华形象。C会用一项动机代替整个比较。<\/p>\n<blockquote>\n<p><strong>43. A<\/strong><\/p>\n<\/blockquote>\n<h4>44题<\/h4>\n<p>【答案】E. Old and New Prizes under the Same Scrutiny<\/p>\n<blockquote>\n<p>用同样的审视标准看待新旧奖项<\/p>\n<\/blockquote>\n<p>这一部分承认新奖有问题，同时拿老奖的规则和历史检验“老奖天然更正当”的假定。<\/p>\n<p>开头先定下共同范围：<\/p>\n<blockquote>\n<p>both new and established prizes<\/p>\n<\/blockquote>\n<p>随后先说新生命科学奖的学科代表性不足，再用<code>Yet<\/code>转向诺奖的三位在世获奖者限制。合作科研的发展使这一规则也会遗漏贡献者。<\/p>\n<p>末尾又补充：<\/p>\n<blockquote>\n<p>the Nobels themselves began with a wealthy individual&#39;s decisions<br>Their legitimacy developed with time<\/p>\n<\/blockquote>\n<p>推进链是：<\/p>\n<blockquote>\n<p>新旧奖都应接受检验 → 新奖存在代表性问题 → 老奖规则同样落后于科研实际 → 老奖也出自私人决定，其认可经历了时间积累。<\/p>\n<\/blockquote>\n<p>E的<code>Old and New<\/code>完整覆盖两类奖项，<code>Same Scrutiny<\/code>对应不以新旧身份自动判定合理与否的比较方式。<\/p>\n<p>最强干扰是G。文中明确说诺奖规则已被合作研究现实超越，并不是要所有奖项效仿；最后的历史认可也不能抹掉前面的制度局限。G把批评的对象改成了推广的样板。<\/p>\n<blockquote>\n<p><strong>44. E<\/strong><\/p>\n<\/blockquote>\n<h4>45题<\/h4>\n<p>【答案】D. A Qualified Welcome for Money and Attention<\/p>\n<blockquote>\n<p>有保留地欢迎资金与关注<\/p>\n<\/blockquote>\n<p>这一部分在承认争议之后给出作者最终建议：可以审视机制，也应承认资金和关注进入科学的价值。<\/p>\n<p>开头<code>Despite the complaints<\/code>接住前文质疑，随后列出两点：多数研究者会接受奖项，资金与关注流入科学总比流向别处好。<\/p>\n<p>关键的边界在这里：<\/p>\n<blockquote>\n<p>Scientists can therefore scrutinize the arrangements without rejecting the gift.<\/p>\n<\/blockquote>\n<p>段尾把感激与批判判断放在一起，而没有要求放弃其中任何一项。<\/p>\n<blockquote>\n<p>承认抱怨 → 提出接受意愿和科研收益 → 保留质疑机制的权利 → 倡议带着判断力感谢支持。<\/p>\n<\/blockquote>\n<p>D的<code>Welcome<\/code>对应接受资助的总体倾向，<code>Qualified<\/code>对应仍然审视机制的保留，<code>Money and Attention<\/code>则准确限定作者肯定的具体收益。<\/p>\n<p>最强干扰是B。B要求拒绝私人奖项，本段却明确反对因不完美而把支持拒之门外。批评存在于接受之中，不能把批评抽出来改成相反的行动建议。<\/p>\n<blockquote>\n<p><strong>45. D<\/strong><\/p>\n<\/blockquote>\n<h2>排序题<\/h2>\n<h3>题目<\/h3>\n<p><strong>Directions:<\/strong><\/p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)<\/p>\n<p><strong>A.<\/strong> That experiment took concrete form in the US$3-million Fundamental Physics Prize accepted by Alexander Polyakov. It is only one of a string of lucrative research awards that have recently joined the Nobels. Many are funded by Internet entrepreneurs with enormous fortunes. These benefactors say they want to use success in their own fields to attract attention to success in science.<\/p>\n<p><strong>B.<\/strong> Whatever their motives, prize-givers still face a legitimate question: how should scientific achievement be recognized? The newly launched Breakthrough Prize in Life Sciences takes an unrepresentative view of the subjects it covers. Yet established awards deserve scrutiny as well. A long history does not automatically make their rules suitable for the way research is now conducted.<\/p>\n<p><strong>C.<\/strong> The younger prizes deserve a similarly measured response. Most researchers would accept such an award, and money and attention reaching science are preferable to their going elsewhere. Criticism of the mechanism remains a proper part of research culture, but the funds belong to those who choose to give them. It is wise to question the arrangements while accepting the gifts with gratitude and grace.<\/p>\n<p><strong>D.<\/strong> An unusual experiment is bringing Hollywood glamour to physics: an Oscars-style ceremony combined with gigantic cash prizes. When a theoretical physicist known for work on quantum field and string theory draws attention to such an experiment, it deserves notice. This time, the experiment concerns how scientists are rewarded rather than a result produced in the laboratory.<\/p>\n<p><strong>E.<\/strong> These objections about prestige, founders&#39; self-promotion and research effects are varied. So are the prize-givers&#39; goals. Some want to shock, others to attract people into science or better reward careers spent in research. Several want to show that leading scientists can live like financiers and footballers. Similar-looking cash awards can therefore serve very different ambitions.<\/p>\n<p><strong>F.<\/strong> But critics see no guarantee that private wealth will bring scientific value. They argue that money cannot buy the prestige of the Nobels and that the awards may mainly promote their founders. Other complaints concern distorted peer review, a reinforced status quo, a failure to fund peer-reviewed work and the perpetuation of the lone-genius myth.<\/p>\n<p><strong>G.<\/strong> The same established prizes also share the newcomers&#39; private origin. The Nobels were set up by a wealthy individual who decided what he wanted to do with his own money. Their accepted position did not follow automatically from a superior intention. Time, rather than intention, gave them legitimacy; private origins alone cannot settle the merits of a prize.<\/p>\n<p><strong>H.<\/strong> That problem of established rules failing to fit modern research is clear in the Nobel Foundation&#39;s limit of three recipients per prize, all of whom must still be living. Modern research is collaborative, and that restriction has long been outgrown. The expected dispute over who receives credit for discovering the Higgs boson highlights the risk that contributors will be left out. Even a celebrated award can therefore struggle to recognize collective achievement fairly.<\/p>\n<p><strong>41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____<\/strong><\/p>\n<h2>排序题全局解析<\/h2>\n<p>先明确八段各自承担的功能，再用前后的对象与论证关系确定位置：<\/p>\n<ul>\n<li>A：落实“实验”的代表奖项，扩展到同类奖并交代企业家资助来源。<\/li>\n<li>B：从多种设奖目标转到新旧奖共同面对的合理评价问题，先举新奖再引向老奖。<\/li>\n<li>C：综合此前比较，给新奖有保留的欢迎，并保留质疑机制的权利。<\/li>\n<li>D：用盛典和巨额奖金引入奖励科学家的新“实验”。<\/li>\n<li>E：接住多种批评，转而并列展示设奖者各不相同的目标。<\/li>\n<li>F：反驳私人财富必然带来科研价值，列出声望、宣传和研究方面的担忧。<\/li>\n<li>G：补充诺奖与新奖共有私人起源，说明认可需要时间而不能只看初衷。<\/li>\n<li>H：展开老奖的规则局限，以合作科研与希格斯发现的认可问题作证。<\/li>\n<\/ul>\n<p>全文推进链是：<\/p>\n<blockquote>\n<p>颁奖新实验 → 具体奖项与私人资金 → 科学家的批评 → 出资者的不同目标 → 新旧奖共同的评价问题 → 老奖规则的具体局限 → 共同私人起源与时间认可 → 对新奖有保留的接受<\/p>\n<\/blockquote>\n<p>完整顺序为：<\/p>\n<blockquote>\n<p><strong>D → A → F → E → B → H → G → C<\/strong><\/p>\n<\/blockquote>\n<p>A、E、H分别位于第2、第4和第6个位置，其余五段依次填入41—45。<\/p>\n<h4>41题<\/h4>\n<p>【答案】D<\/p>\n<p>41位于已知A之前，是全文首段。这里没有前段可接，需要先引出A所说的实验。<\/p>\n<p>D用<code>An unusual experiment<\/code>首次引入奥斯卡式典礼与巨额奖金，末句说明这是怎样奖励科学家的尝试。A随后说：<\/p>\n<blockquote>\n<p>That experiment took concrete form in the US$3-million Fundamental Physics Prize<\/p>\n<\/blockquote>\n<p><code>That experiment<\/code>明确回指前面的颁奖尝试，A再把概念落到奖项名称和私人资金上。<\/p>\n<blockquote>\n<p>D：先引入一项奖励科学家的新实验 → A：给出这个实验的具体代表，并扩大到同类私人奖项。<\/p>\n<\/blockquote>\n<p>最强候选B也是概括性讨论，但以<code>Whatever their motives<\/code>起头，预设设奖者与其动机已经出现；它还讨论新旧奖评价标准，不能为A的<code>That experiment<\/code>提供具体前项。C是综合建议，<code>similarly<\/code>同样需要此前比较，更不具备首段功能。<\/p>\n<blockquote>\n<p><strong>41. D<\/strong><\/p>\n<\/blockquote>\n<h4>42题<\/h4>\n<p>【答案】F<\/p>\n<p>42夹在已知A和E之间。A以企业家声称想让科学受到关注收尾；E则要承接已经列出的多种反对意见。<\/p>\n<p>A的末尾是：<\/p>\n<blockquote>\n<p>attract attention to success in science<\/p>\n<\/blockquote>\n<p>F开头用<code>But critics see no guarantee<\/code>对这种积极说法作限制，随后列出声望、自我宣传、同行评议和孤独天才等批评。E再接：<\/p>\n<blockquote>\n<p>These objections about prestige, founders&#39; self-promotion and research effects are varied. So are the prize-givers&#39; goals.<\/p>\n<\/blockquote>\n<p>E的开头明确复指<code>prestige<\/code>、<code>founders&#39; self-promotion<\/code>和<code>research effects<\/code>三组对象：F先说买不来诺奖声望，再说设奖者自我宣传，最后列科研方面的后果。<code>So are<\/code>才从这三组异议平行转到动机的多样性，不是泛泛地承接任意一种批评。<\/p>\n<blockquote>\n<p>A：资助者声称支持科学 → F：批评者提出多方面异议 → E：以异议的分散引出动机同样分散。<\/p>\n<\/blockquote>\n<p>最强候选B也能用<code>Whatever their motives<\/code>接住A末尾资助者希望吸引关注的目的，所以只看A—B不能排除它。真正排除点在后端：B写的是新奖学科代表性和老奖规则的适用性，没有写声望能否买来、创办者自我宣传这两组内容，接不上E明确列出的三组既有异议。F同时满足两边，B只满足前边。<\/p>\n<blockquote>\n<p><strong>42. F<\/strong><\/p>\n<\/blockquote>\n<h4>43题<\/h4>\n<p>【答案】B<\/p>\n<p>43位于已知E和H之间。E刚结束多种设奖目标的列举，H将具体批评诺奖规则。<\/p>\n<p>E段尾总结：<\/p>\n<blockquote>\n<p>very different ambitions<\/p>\n<\/blockquote>\n<p>B开头的<code>Whatever their motives<\/code>把这些目标接回来，再提出怎样合理认可科研成就的共同问题。它先举新生命科学奖的代表性不足，随后说：<\/p>\n<blockquote>\n<p>Yet established awards deserve scrutiny as well.<\/p>\n<\/blockquote>\n<p>B末尾继续明确：<\/p>\n<blockquote>\n<p>A long history does not automatically make their rules suitable for the way research is now conducted.<\/p>\n<\/blockquote>\n<p>H的开头随即把“老奖规则是否适应现代科研”这个问题复指出来：<\/p>\n<blockquote>\n<p>That problem of established rules failing to fit modern research is clear in the Nobel Foundation&#39;s limit of three recipients per prize<\/p>\n<\/blockquote>\n<p>所以双边推进为：<\/p>\n<blockquote>\n<p>E：设奖动机各异 → B：不论动机如何，新旧奖都应接受合理性检验 → H：具体展开老奖规则不适应合作研究的问题。<\/p>\n<\/blockquote>\n<p>最强候选G也谈老奖，但它论述私人起源与历史认可，无法为H的<code>That problem of established rules failing to fit modern research<\/code>提供所指的规则适应性问题。F虽有“孤独天才”的批评，讨论的仍是新奖对科研形象的影响，并未提出既有老奖规则的适用性；不能仅凭都涉及个人与合作就跳过对象差异。B才同时接得住E的目标分析并引得出H对老奖规则的具体检验。<\/p>\n<blockquote>\n<p><strong>43. B<\/strong><\/p>\n<\/blockquote>\n<h4>44题<\/h4>\n<p>【答案】G<\/p>\n<p>44位于已知H之后、末段45之前。H已证明诺奖对共同成就的认可存在局限；接下来要为对新奖的综合态度再提供一项公平比较。<\/p>\n<p>H段尾说：<\/p>\n<blockquote>\n<p>struggle to recognize collective achievement fairly<\/p>\n<\/blockquote>\n<p>G开头的<code>The same established prizes also share the newcomers&#39; private origin<\/code>继续谈同一老奖，同时用<code>also<\/code>从规则局限补入起源相似性。段尾指出：<\/p>\n<blockquote>\n<p>private origins alone cannot settle the merits of a prize<\/p>\n<\/blockquote>\n<p>后面的C于是能说：<\/p>\n<blockquote>\n<p>The younger prizes deserve a similarly measured response.<\/p>\n<\/blockquote>\n<p>这里<code>similarly measured<\/code>承接的是“不因私人起源自动下结论、让时间形成认可”的审慎标准。<\/p>\n<blockquote>\n<p>H：老奖也有制度问题 → G：老奖同样出自私人决定，认可是在时间中形成的 → C：因此也应审慎而开放地看新奖。<\/p>\n<\/blockquote>\n<p>最强候选C确实像结尾，但若直接接H，尚未补上新旧奖私人起源和时间认可的比较；把G放在C后又会让文章在综合建议后倒退到一个历史论据。因此G先完成比较，C再收束全篇。<\/p>\n<blockquote>\n<p><strong>44. G<\/strong><\/p>\n<\/blockquote>\n<h4>45题<\/h4>\n<p>【答案】C<\/p>\n<p>45是最后一段，前面已经确定为G。这里没有下一段，需同时检查向前承接与总结功能。<\/p>\n<p>G先说：<\/p>\n<blockquote>\n<p>Time, rather than intention, gave them legitimacy<\/p>\n<\/blockquote>\n<p>并据此反对只凭私人起源判定奖项优劣。C开头以<code>a similarly measured response<\/code>把这一标准用于新奖，随后列出研究者愿意接受、资金与关注有益两条理由。<\/p>\n<p>段尾形成完整建议：<\/p>\n<blockquote>\n<p>question the arrangements while accepting the gifts with gratitude and grace<\/p>\n<\/blockquote>\n<blockquote>\n<p>G：评价私人奖项不能只看起源，应考虑时间与实际价值 → C：对新奖保持批判能力，同时接受对科学有益的支持。<\/p>\n<\/blockquote>\n<p>最强候选F同样谈评价，但它只是批评者提出的一组异议，应该在作者比较和综合判断之前。放在最后会让全文从经过检验的立场倒回单方面反对，也无法回应G所要求的审慎标准。C才能完成正反权衡并给出结论。<\/p>\n<blockquote>\n<p><strong>45. C<\/strong><\/p>\n<\/blockquote>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/
