\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[83,95,847,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q31-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>企业家财富的象征<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到了<code>funded from<\/code>、<code>bank accounts<\/code>和<code>Internet entrepreneurs<\/code>，认为它们只交代资金来源，不能把奖项定义为财富象征，第一轮就排除了A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用企业家的巨额账户，把“由这些财富资助”改成“象征这些财富”。出资者有钱是设奖的背景，奖项被如何看待是另一条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为企业家财富的象征。<\/p>\n<\/blockquote>\n<p>A中的<code>entrepreneurs’ wealth<\/code>对应第1段的企业家账户和使用财富的表述，因此要比较<code>funded from<\/code>与<code>a symbol of<\/code>各自在说什么。<\/p>\n<p>第一处说奖项的钱来自互联网企业家；下一句继续交代这些赞助人的自述目的，是让在科学上取得成功的人获得关注。财富在这里承担资金来源的角色，科学成功者才是他们想要引起关注的对象。<\/p>\n<p>A却用<code>symbol<\/code>给奖项本身下定义，把“出资靠什么”换成“奖项代表什么”。金额巨大可以使人联想到炫耀财富，但这仍不是第1段给出的身份判断。<\/p>\n<p>因此，A利用相同的出资者和财富信息，补上了从资助关系到财富象征的变化，不能作为这项奖的性质概括。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<p>赞助人说自己要用财富吸引人们关注科学领域的成功者。<\/p>\n<\/blockquote>\n<p>介绍账户之后，作者顺着出资目的转向科学家，关注点没有停在富豪财力的展示上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Fundamental Physics Prize is regarded as a symbol of its founders’ wealth, drawing attention to how rich they are.<\/p>\n<p>基础物理学奖被视为设立者财富的象征，吸引人们注意他们多么富有。<\/p>\n<\/blockquote>\n<p>假设写法需要把奖项所引起的注意落在企业家的富有程度上；实际下一句把注意力落在科学成就者身上。二者都有财富，但财富在文章中的作用不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>a symbol of the entrepreneurs’ wealth<br>企业家财富的象征<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“are funded from”及“draw attention to those who have succeeded in science”判断。接受科研资源这一主旨能容纳企业家出资，却不把资金来源变成财富象征；A多出的正是这层定义。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. a possible replacement of the Nobel Prizes","raw":"### B. a possible replacement of the Nobel Prizes\n\n> 诺贝尔奖可能的替代品\n\n**做题模式中的状态：** 当时把`joined the Nobel Prizes`与`replacement`联系起来，认为仅凭首段还不能完全否定以后替代的可能，第一轮留下B和C。后来读出35题主旨，再结合声望及新旧奖项的比较，排除B，保留C。\n\n**错误类型：第三类——无中生有。**\n\nB从新奖加入诺贝尔奖所在的奖项行列，推想出它将来可能取代诺贝尔奖。`possible`把语气放弱了，却没有补出原文缺少的替代关系。\n\n**命题人借用的原文材料：**\n\n> As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.\n>\n> You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[83,183,943,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q31-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>诺贝尔奖可能的替代品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>joined the Nobel Prizes<\/code>与<code>replacement<\/code>联系起来，认为仅凭首段还不能完全否定以后替代的可能，第一轮留下B和C。后来读出35题主旨，再结合声望及新旧奖项的比较，排除B，保留C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B从新奖加入诺贝尔奖所在的奖项行列，推想出它将来可能取代诺贝尔奖。<code>possible<\/code>把语气放弱了，却没有补出原文缺少的替代关系。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.<\/p>\n<p>You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. a possible replacement of the Nobel Prizes","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 基础物理学奖被视为诺贝尔奖可能的替代品。\n\nB点名`Nobel Prizes`，第1段的`joined the Nobel Prizes`正好说明新旧奖项的关系；第2段又补充两者声望的差异。\n\n`joined`说新奖近年来加入奖项行列，已有诺贝尔奖之外又出现了这些奖励。它没有写新奖将接管旧奖的功能，也没有写任何人把它视为替代者。\n\nB中的`possible`并非断言已经取代，但整句仍然要求文章支持“它被看作可能的替代品”。仅仅并列出现，不足以给出这个可能性的具体依据。第2段说钱买不到诺贝尔奖的声望，也没有进一步讨论这种声望以后会被新奖取代。\n\nB把“新增了同类奖项”继续推演成“被当作旧奖的潜在替代品”，增加了原文未提出的新旧更替判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[83,183,943,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q31-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>诺贝尔奖可能的替代品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>joined the Nobel Prizes<\/code>与<code>replacement<\/code>联系起来，认为仅凭首段还不能完全否定以后替代的可能，第一轮留下B和C。后来读出35题主旨，再结合声望及新旧奖项的比较，排除B，保留C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B从新奖加入诺贝尔奖所在的奖项行列，推想出它将来可能取代诺贝尔奖。<code>possible<\/code>把语气放弱了，却没有补出原文缺少的替代关系。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.<\/p>\n<p>You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为诺贝尔奖可能的替代品。<\/p>\n<\/blockquote>\n<p>B点名<code>Nobel Prizes<\/code>，第1段的<code>joined the Nobel Prizes<\/code>正好说明新旧奖项的关系；第2段又补充两者声望的差异。<\/p>\n<p><code>joined<\/code>说新奖近年来加入奖项行列，已有诺贝尔奖之外又出现了这些奖励。它没有写新奖将接管旧奖的功能，也没有写任何人把它视为替代者。<\/p>\n<p>B中的<code>possible<\/code>并非断言已经取代，但整句仍然要求文章支持“它被看作可能的替代品”。仅仅并列出现，不足以给出这个可能性的具体依据。第2段说钱买不到诺贝尔奖的声望，也没有进一步讨论这种声望以后会被新奖取代。<\/p>\n<p>B把“新增了同类奖项”继续推演成“被当作旧奖的潜在替代品”，增加了原文未提出的新旧更替判断。<\/p>\n<\/section>"},{"title":"B. a possible replacement of the Nobel Prizes","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.\n>\n> Time, rather than intention, has given them legitimacy.\n>\n> Second, it is surely a good thing that the money and attention come to science rather than go elsewhere.\n>\n> 作者先回顾诺贝尔奖的私人设奖背景和随时间取得的认可，再肯定新奖为科学带来金钱与关注。\n\n这一比较用旧奖的经历帮助评价新奖是否值得接受，并没有以旧奖被取代为结尾。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The new prizes may take the place of the Nobels as the principal rewards for scientific achievement.\n>\n> 这些新奖可能取代诺贝尔奖，成为科学成就的主要奖励。\n\n若B成立，比较新旧奖时至少要提出取代的功能或地位。实际比较落在设奖、认可和接受上；新奖带来额外资源，与新奖可能接替诺贝尔奖不是同一个判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[83,183,943,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q31-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>诺贝尔奖可能的替代品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>joined the Nobel Prizes<\/code>与<code>repla 这一功能改写成替代诺贝尔奖。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>a handsome reward for researchers<br>给研究人员的丰厚奖励<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“US $3-million”及“lucrative awards for researchers”确定具体性质。全文肯定资金来到科学，能够容纳C所概括的科研奖励；局部出处则坐实“丰厚”和“给研究人员”，两者没有改变对象。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<\/section>"},{"title":"D. an example of bankers’ investments","raw":"### D. an example of bankers’ investments\n\n> 银行家投资的一个例子\n\n**做题模式中的状态：** 当时认出了`bank accounts`的持有人是`Internet entrepreneurs`，认为银行账户不能把出资者变成银行家，也不能自动把资助变成投资，第一轮排除D，之后没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nD抓住`bank accounts`中的`bank`，把互联网企业家的账户改成银行家的投资。它同时换掉了账户持有人和出资行为的性质。\n\n**出处：**\n\n> Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.\n>\n> These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[83,360,803,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q31-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>银行家投资的一个例子<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了<code>bank accounts<\/code>的持有人是<code>Internet entrepreneurs<\/code>，认为银行账户不能把出资者变成银行家，也不能自动把资助变成投资，第一轮排除D，之后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D抓住<code>bank accounts<\/code>中的<code>bank<\/code>，把互联网企业家的账户改成银行家的投资。它同时换掉了账户持有人和出资行为的性质。<\/p>\n<p><strong>出处：<\/stro  class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>银行家投资的一个例子<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了<code>bank accounts<\/code>的持有人是<code>Internet entrepreneurs<\/code>，认为银行账户不能把出资者变成银行家，也不能自动把资助变成投资，第一轮排除D，之后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D抓住<code>bank accounts<\/code>中的<code>bank<\/code>，把互联网企业家的账户改成银行家的投资。它同时换掉了账户持有人和出资行为的性质。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为银行家投资的一个例子。<\/p>\n<\/blockquote>\n<p>D中的<code>bankers<\/code>容易使人联想到第1段的<code>bank accounts<\/code>，但必须连同后面的<code>of Internet entrepreneurs<\/code>一起读，核对账户是谁的。<\/p>\n<p>原文的主体是互联网企业家，银行账户只是他们存放资金的地方；用自己的账户出资并不会使账户主人变成银行家。接下来的<code>benefactors<\/code>也继续指这些出资的赞助人。<\/p>\n<p>资金的用途是资助奖项，使科学成就者受到关注。D改成<code>investments<\/code>，需要额外的投资关系，文章没有把这笔钱写成银行家为获取投资回报而安排的资本。<\/p>\n<p>所以D把“企业家出资奖励科学家”改成“银行家投资”，不是对同一事实的不同说法。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<p>后文用赞助人指代出资者，并说明其财富用于引起对科学成功者的关注。<\/p>\n<\/blockquote>\n<p>资金来源之后接的是赞助目的，文章没有转向银行家的投资项目。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Bankers finance the Fundamental Physics Prize as one of their investments.<\/p>\n<p>银行家把资助基础物理学奖当作他们的一项投资。<\/p>\n<\/blockquote>\n<p>D成立至少要让出资主体变成银行家，并说明资助属于投资。实际作者沿用企业家及赞助人的身份，接着讲关注科学的目的；两处所需改变都不在原文推进之中。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为这些新科学奖可以接受，不能单独判断基础物理学奖的奖金多少、奖励对象及它与诺贝尔奖的具体关系。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>an example of bankers’ investments<br>银行家投资的一个例子<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“bank accounts of Internet entrepreneurs”判断出资主体。主旨欢迎资源流向科学，不会把资源的拥有者改成银行家；D提出的主体和投资性质都要由局部文字承担，而原文给出的关系不同。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. C. a handsome reward for researchers**\n\nA借用出资者的财富，将资金来源换成奖项象征。\n\nB从新奖加入同类奖项行列，补出可能取代诺贝尔奖的判断。\n\nC将丰厚金额与面向研究者的奖励性质合在一起，准确概括首段。\n\nD把企业家的银行账户改成银行家投资，更换了主体和资金关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[4,4,1120,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"conclusion","question":31},"level":3,"html":"<blockquote>\n<p><strong>31. C. a handsome reward for researchers<\/strong><\/p>\n<\/blockquote>\n<p>A借用出资者的财富，将资金来源换成奖项象征。<\/p>\n<p>B从新奖加入同类奖项行列，补出可能取代诺贝尔奖的判断。<\/p>\n<p>C将丰厚金额与面向研究者的奖励性质合在一起，准确概括首段。<\/p>\n<p>D把企业家的银行账户改成银行家投资，更换了主体和资金关系。<\/p>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> The critics think that the new awards will most benefit ______.  \n> 批评者认为，新奖项最让谁受益？\n\n### 题型\n\n这是一道观点细节题。题干限定说话人是批评者，要求找出他们认为的主要受益者，不能拿作者最后的总体态度替换批评者的意见。\n\n### 核心出处\n\n> The new awards are an exercise in self-promotion for those behind them, say scientists.\n>\n> They could distort the achievement-based system of peer-review-led research.\n>\n> They could cement the status quo of peer-reviewed research.\n>\n> They do not fund peer-reviewed research.\n\n题干中的`critics`对应第2段发出质疑的科学家。`say scientists`标明是谁作出判断，`self-promotion for those behind them`给出他们认定的收益及受益者；后面几句则补充他们对科研评价和研究资助的批评。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[4,532,1389,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"question","question":32},"level":2,"html":"<blockquote>\n<p>The critics think that the new awards will most benefit ______.<br>批评者认为，新奖项最让谁受益？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道观点细节题。题干限定说话人是批评者，要求找出他们认为的主要受益者，不能拿作者最后的总体态度替换批评者的意见。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<p>题干中的<code>critics<\/code>对应第2段发出质疑的科学家。<code>say scientists<\/code>标明是谁作出判断，<code>self-promotion for those behind them<\/code>给出他们认定的收益及受益者；后面几句则补充他们对科研评价和研究资助的批评。<\/p>\n"},{"title":"A. the profit-oriented scientists","raw":"### A. the profit-oriented scientists\n\n> 以利润为导向的科学家\n\n**做题模式中的状态：** 当时A中的修饰语写成`[xxx]`，但`scientists`可见。做题时区分了句尾发言的科学家与`those behind them`所指的幕后设奖者，认为A把批评者放到了受益者的位置，第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nA利用句尾的`scientists`及高额奖金让人联想到逐利科学家，但这句话把自我宣传的收益归给`those behind them`。科学家在此处是陈述批评意见的人，不是该短语的指代对象。\n\n**出处：**\n\n> The new awards are an exercise in self-promotion for those behind them, say scientists.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[83,624,640,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q32-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>以利润为导向的科学家<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A中的修饰语写成<code>[xxx]<\/code>，但<code>scientists<\/code>可见。做题时区分了句尾发言的科学家与<code>those behind them<\/code>所指的幕后设奖者，认为A把批评者放到了受益者的位置，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A利用句尾的<code>scientists<\/code>及高额奖金让人联想到逐利科学家，但这句话把自我宣传的收益归给<code>those behind them<\/code>。科学家在此处是陈述批评意见的人，不是该短语的指代对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. the profit-oriented scientists","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 批评者认为，新奖项最让以利润为导向的科学家受益。\n\n题干要求批评者的看法，`say scientists`标明第2段这句话正是他们的发言；判断受益者则要看`self-promotion for those behind them`。\n\n句子先说新奖是一种自我宣传活动，`for those behind them`把这项好处归给奖项背后的设立者。句末才补上“科学家们说”，交代整句话是谁说的。\n\nA把句末说话人换到主要受益者的位置，还用`profit-oriented`将这些科学家限定为逐利者。巨额奖金可以引起这种联想，但这一句没有把宣传收益归给逐利科学家。这里并不需要断言科学家从奖项中毫无收益，只需核对批评者认为谁在借设奖宣传自己。\n\nA将“科学家批评设奖者进行自我宣传”改成“科学家认为逐利科学家最受益”，错换了批评意见中的受益对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[83,624,640,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>以利润为导向的科学家<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A中的修饰语写成<code>[xxx]<\/code>，但<code>scientists<\/code>可见。做题时区分了句尾发言的科学家与<code>those behind them<\/code>所指的幕后设奖者，认为A把批评者放到了受益者的位置，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A利用句尾的<code>scientists<\/code>及高额奖金让人联想到逐利科学家，但这句话把自我宣传的收益归给<code>those behind them<\/code>。科学家在此处是陈述批评意见的人，不是该短语的指代对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最让以利润为导向的科学家受益。<\/p>\n<\/blockquote>\n<p>题干要求批评者的看法，<code>say scientists<\/code>标明第2段这句话正是他们的发言；判断受益者则要看<code>self-promotion for those behind them<\/code>。<\/p>\n<p>句子先说新奖是一种自我宣传活动，<code>for those behind them<\/code>把这项好处归给奖项背后的设立者。句末才补上“科学家们说”，交代整句话是谁说的。<\/p>\n<p>A把句末说话人换到主要受益者的位置，还用<code>profit-oriented<\/code>将这些科学家限定为逐利者。巨额奖金可以引起这种联想，但这一句没有把宣传收益归给逐利科学家。这里并不需要断言科学家从奖项中毫无收益，只需核对批评者认为谁在借设奖宣传自己。<\/p>\n<p>A将“科学家批评设奖者进行自我宣传”改成“科学家认为逐利科学家最受益”，错换了批评意见中的受益对象。<\/p>\n<\/section>"},{"title":"A. the profit-oriented scientists","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The new awards are an exercise in self-promotion for those behind them, say scientists.\n>\n> The goals of the prize-givers seem as scattered as the criticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.\n>\n> 批评者把奖项称作幕后人的自我宣传，作者接着转向奖项设立者各不相同的目标。\n\n这段争论的承接对象是设奖者及其目标，没有继续追查哪一类科学家最能逐利。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Critics say that the new awards chiefly serve scientists who put financial profit first.\n>\n> 批评者说，这些新奖主要服务于把金钱利益放在首位的科学家。\n\n如果A是批评者的判断，文章需要把主要收益明确归给逐利科学家；实际却把自我宣传归给幕后设奖者，并在下一段讨论这些人的目标。两条路线的获益群体不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[83,624,640,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>以利润为导向的科学家<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A中的修饰语写成<code>[xxx]<\/code>，但<code>scientists<\/code>可见。做题时区分了句尾发言的科学家与<code>those behind them<\/code>所指的幕后设奖者，认为A把批评者放到了受益者的位置，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A利用句尾的<code>scientists<\/code>及高额奖金让人联想到逐利科学家，但这句话把自我宣传的收益归给<code>those behind them<\/code>。科学家在此处是陈述批评意见的人，不是该短语的指代对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最让以利润为导向的科学家受益。<\/p>\n<\/blockquote>\n<p>题干要求批评者的看法，<code>say scientists<\/code>标明第2段这句话正是他们的发言；判断受益者则要看<code>self-promotion for those behind them<\/code>。<\/p>\n<p>句子先说新奖是一种自我宣传活动，<code>for those behind them<\/code>把这项好处归给奖项背后的设立者。句末才补上“科学家们说”，交代整句话是谁说的。<\/p>\n<p>A把句末说话人换到主要受益者的位置，还用<code>profit-oriented<\/code>将这些科学家限定为逐利者。巨额奖金可以引起这种联想，但这一句没有把宣传收益归给逐利科学家。这里并不需要断言科学家从奖项中毫无收益，只需核对批评者认为谁在借设奖宣传自己。<\/p>\n<p>A将“科学家批评设奖者进行自我宣传”改成“科学家认为逐利科学家最受益”，错换了批评意见中的受益对象。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The new awards are an exercise in self-promotion for those behind them, say scientists.<\/p>\n<p>The goals of the prize-givers seem as scattered as the criticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.<\/p>\n<p>批评者把奖项称作幕后人的自我宣传，作者接着转向奖项设立者各不相同的目标。<\/p>\n<\/blockquote>\n<p>这段争论的承接对象是设奖者及其目标，没有继续追查哪一类科学家最能逐利。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Critics say that the new awards chiefly serve scientists who put financial profit first.<\/p>\n<p>批评者说，这些新奖主要服务于把金钱利益放在首位的科学家。<\/p>\n<\/blockquote>\n<p>如果A是批评者的判断，文章需要把主要收益明确归给逐利科学家；实际却把自我宣传归给幕后设奖者，并在下一段讨论这些人的目标。两条路线的获益群体不同。<\/p>\n<\/section>"},{"title":"A. the profit-oriented scientists","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> acceptable despite the criticism  \n> 尽管受到批评，仍然可以接受\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。\n\n但A实际说的是：\n\n> the profit-oriented scientists  \n> 以利润为导向的科学家\n\n本项最终仍要根据“self-promotion for those behind them, say scientists”判断。主旨中的接受态度是作者的结论，既不能替批评者指定受益者，也不能把发言者变成受益者；A需要的逐利科学家不是局部原句所指的人。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[83,624,640,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q32-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><bloc ticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.<\/p>\n<p>批评者认为奖项为幕后人宣传，下一段继续区分设奖者制造震动、吸引人学科学和奖励研究者等目的。<\/p>\n<\/blockquote>\n<p>作者先报告对设奖者动机的批评，再把这些动机展开，随后才形成自己的总体评价。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>In the critics’ view, the founders use the awards to promote themselves and are the chief beneficiaries.<\/p>\n<p>在批评者看来，设奖者借奖项宣传自己，是主要受益者。<\/p>\n<\/blockquote>\n<p>B要求的写法就是把自我宣传归到设奖者身上。原文已经这样报告批评意见；下一段对目标的补充是在展开与衡量这一意见，并没有更换它所指的幕后人。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>the founders of the new awards<br>新奖项的设立者<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“self-promotion for those behind them”判断。作者最后接受新奖，不表示他从未报告过出资者自我宣传的批评；B回答的是批评者的说法，与全文先呈现质疑再作总体判断的顺序相容。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<\/section>"},{"title":"C. the achievement-based system","raw":"### C. the achievement-based system\n\n> 以成就为基础的体系\n\n**做题模式中的状态：** 当时选项的体系名称完整可见，原句动作位置显示为`[xxx]`。做题分析把那一处解释为可能扭曲体系，并据此将它与题干的获益方向比较，第一轮排除C，没有后续改判。\n\n**错误类型：第一类——歪曲原意。**\n\nC完整保留了原文中的体系名称，却省略了决定关系的`could distort`。接回题干之后，“可能被扭曲的体系”就变成了“最受益的体系”。\n\n**出处：**\n\n> They could distort the achievement-based system of peer-review-led research.\n>\n> They could cement the status quo of peer-reviewed research.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[83,800,685,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q32-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>以成就为基础的体系<\/p>\n<\/blockquote>\n<p><str 态：<\/strong> 当时选项的体系名称完整可见，原句动作位置显示为<code>[xxx]<\/code>。做题分析把那一处解释为可能扭曲体系，并据此将它与题干的获益方向比较，第一轮排除C，没有后续改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C完整保留了原文中的体系名称，却省略了决定关系的<code>could distort<\/code>。接回题干之后，“可能被扭曲的体系”就变成了“最受益的体系”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最有利于以成就为基础的体系。<\/p>\n<\/blockquote>\n<p>C几乎原样出现于第2段的<code>the achievement-based system<\/code>，所以定位到这句话之后，重点要比较前面的动作，而不能仅凭名词相同作答。<\/p>\n<p>原句的动作是<code>could distort<\/code>：批评者担心新奖可能扭曲同行评审主导的、以成就为基础的体系。下一句继续提出对现有研究状态被固化的担忧，仍是机制方面的质疑。<\/p>\n<p><code>could<\/code>保留了风险语气，作者并未声称破坏已经发生；但这也不是说体系最能获益。C接回<code>will most benefit<\/code>后，把批评意见的负面风险改成主要好处。<\/p>\n<p>因此，相同的体系名词不能挽救被改反的作用方向：原文担心它受到扭曲，C却把它列为新奖最主要的受益方。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<p>批评者先担心评价体系被扭曲、研究现状被固化，又指出新奖并不资助同行评审研究。<\/p>\n<\/blockquote>\n<p>后面的批评继续补充新奖与既有研究体系之间的问题，并没有转向赞扬它改善成就评价。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The new awards will strengthen the achievement-based system of peer-review-led research.<\/p>\n<p>新奖项将加强同行评审主导的、以成就为基础的体系。<\/p>\n<\/blockquote>\n<p>C成立至少需要批评者把新奖写成帮助这种体系。实际的<code>distort<\/code>和对现状固化的担忧都没有提供这种积极推进；不能把“涉及同一体系”当成“使该体系获益”。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>the achievement-based system<br>以成就为基础的体系<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“could distort the achievement-based system”判断。作者认为资源流向科学是好事，是他在末段给出的接受理由，不能倒放到批评者嘴里，改写他们对评价体系可能受损的意见。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. peer-review-led research","raw":"### D. peer-review-led research\n\n> 同行评审主导的研究\n\n**做题模式中的状态：** 当时`They do not fund peer-reviewed research`完整可见，做题时据此认为同行评审研究不是批评者认定的主要受益方，第一轮排除D，最后保持这一结果。\n\n**错误类型：第一类——歪曲原意。**\n\nD借用第2段反复出现的研究名称，却把批评者指出的资助缺失及制度风险，改成了这类研究最受益。要判断的是批评者如何评价，不是凭常识推想奖项能间接带来哪些好处。\n\n**出处：**\n\n> They could distort the achievement-based system of peer-review-led research.\n>\n> They could cement the status quo of peer-reviewed research.\n>\n> They do not fund peer-reviewed research.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[83,888,573,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q32-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>同行评审主导的研究<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>They do not fund peer-reviewed research<\/code>完整可见，做题时据此认为同行评审研究不是批评者认定的主要受益方，第一轮排除D，最后保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用第2段反复出现的研究名称，却把批评者指出的资助缺失及制度风险，改成了这类研究最受益。要判断的是批评者如何评价，不是凭常识推想奖项能间接带来哪些好处。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. peer-review-led research","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 批评者认为，新奖项最有利于同行评审主导的研究。\n\nD的`peer-review-led research`在第2段直接出现，后面的`peer-reviewed research`继续指向同行评审研究，需把相邻几句的评价连起来读。\n\n批评者担心新奖扭曲以成就为基础的体系、固化研究现状，随后明确指出它们不资助同行评审研究。这组话给出的是对新奖支持研究方式的质疑。\n\n单凭“不资助”不能推出“绝对没有任何间接好处”，但题干也没有问有没有一丁点间接作用，而是在问批评者认定的主要受益对象。原段将自我宣传归给幕后人，并没有把同行评审研究列为主要获益者。\n\nD把被指出缺少资助、面临制度风险的一方，写成批评者认为最受益的一方，改变了这组批评的评价方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[83,888,573,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q32-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>同行评审主导的研究<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>They do not fund peer-reviewed research<\/code>完整可见，做题时据此认为同行评审研究不是批评者认定的主要受益方，第一轮排除D，最后保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用第2段反复出现的研究名称，却把批评者指出的资助缺失及制度风险，改成了这类研究最受益。要判断的是批评者如何评价，不是凭常识推想奖项能间接带来哪些好处。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最有利于同行评审主导的研究。<\/p>\n<\/blockquote>\n<p>D的<code>peer-review-led research<\/code>在第2段直接出现，后面的<code>peer-reviewed research<\/code>继续指向同行评审研究，需把相邻几句的评价连起来读。<\/p>\n<p>批评者担心新奖扭曲以成就为基础的体系、固化研究现状，随后明确指出它们不资助同行评审研究。这组话给出的是对新奖支持研究方式的质疑。<\/p>\n<p>单凭“不资助”不能推出“绝对没有任何间接好处”，但题干也没有问有没有一丁点间接作用，而是在问批评者认定的主要受益对象。原段将自我宣传归给幕后人，并没有把同行评审研究列为主要获益者。<\/p>\n<p>D把被指出缺少资助、面临制度风险的一方，写成批评者认为最受益的一方，改变了这组批评的评价方向。<\/p>\n<\/section>"},{"title":"D. peer-review-led research","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> They do not fund peer-reviewed research.\n>\n> They perpetuate the myth of the lone genius.\n>\n> 批评者说新奖并不资助同行评审研究，并延续孤独天才的神话。\n\n说完资助问题，批评继续进入对个人英雄叙事的质疑，仍没有转成对同行评审研究获益的肯定。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Critics acknowledge that peer-review-led research gains the greatest support from the new awards.\n>\n> 批评者承认，同行评审主导的研究从新奖项获得了最大的支持。\n\nD所需的推进应让批评者肯定这类研究获得主要支持；实际却接连指出研究资助缺失和研究叙事的问题。两条路线对同一研究方式的评价不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[83,888,573,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q32-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>同行评审主导的研究<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>They do not fund peer-reviewed research<\/code>完整可见，做题时据此认为同行评审研究不是批评者认定的主要受益方，第一轮排除D，最后保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用第2段反复出现的研究名称，却把批评者指出的资助缺失及制度风险，改成了这类研究最受益。要判断的是批评者如何评价，不是凭常识推想奖项能间接带来哪些好处。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最有利于同行评审主导的研究。<\/p>\n<\/blockquote>\n<p>D的<code>peer-review-led research<\/code>在第2段直接出现，后面的<code>peer-reviewed research<\/code>继续指向同行评审研究，需把相邻几句的评价连起来读。<\/p>\n<p>批评者担心新奖扭曲以成就为基础的体系、固化研究现状，随后明确指出它们不资助同行评审研究。这组话给出的是对新奖支持研究方式的质疑。<\/p>\n<p>单凭“不资助”不能推出“绝对没有任何间接好处”，但题干也没有问有没有一丁点间接作用，而是在问批评者认定的主要受益对象。原段将自我宣传归给幕后人，并没有把同行评审研究列为主要获益者。<\/p>\n<p>D把被指出缺少资助、面临制度风险的一方，写成批评者认为最受益的一方，改变了这组批评的评价方向。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>They do not fund peer-reviewed research.<\/p>\n<p>They perpetuate the myth of the lone genius.<\/p>\n<p>批评者说新奖并不资助同行评审研究，并延续孤独天才的神话。<\/p>\n<\/blockquote>\n<p>说完资助问题，批评继续进入对个人英雄叙事的质疑，仍没有转成对同行评审研究获益的肯定。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Critics acknowledge that peer-review-led research gains the greatest support from the new awards.<\/p>\n<p>批评者承认，同行评审主导的研究从新奖项获得了最大的支持。<\/p>\n<\/blockquote>\n<p>D所需的推进应让批评者肯定这类研究获得主要支持；实际却接连指出研究资助缺失和研究叙事的问题。两条路线对同一研究方式的评价不同。<\/p>\n<\/section>"},{"title":"D. peer-review-led research","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> acceptable despite the criticism  \n> 尽管受到批评，仍然可以接受\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。\n\n但D实际说的是：\n\n> peer-review-led research  \n> 同行评审主导的研究\n\n本项最终仍要根据“They do not fund peer-reviewed research”及同段对幕后人自我宣传的评价判断。末段作者欢迎金钱流向科学，不等于批评者承认同行评审研究最受益，D混淆了说话人及具体受益范围。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[83,888,573,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q32-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>同行评审主导的研究<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>They do not fund peer-reviewed research<\/code>完整可见，做题时据此认为同行评审研究不是批评者认定的主要受益方，第一轮排除D，最后保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用第2段反复出现的研究名称，却把批评者指出的资助缺失及制度风险，改成了这类研究最受益。要判断的是批评者如何评价，不是凭常识推想奖项能间接带来哪些好处。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>They could distort the achievement-based system of peer-review-led research.<\/p>\n<p>They could cement the status quo of peer-reviewed research.<\/p>\n<p>They do not fund peer-reviewed research.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>批评者认为，新奖项最有利于同行评审主导的研究。<\/p>\n<\/blockquote>\n<p>D的<code>peer-review-led research<\/code>在第2段直接出现，后面的<code>peer-reviewed research<\/code>继续指向同行评审研究，需把相邻几句的评价连起来读。<\/p>\n<p>批评者担心新奖扭曲以成就为基础的体系、固化研究现状，随后明确指出它们不资助同行评审研究。这组话给出的是对新奖支持研究方式的质疑。<\/p>\n<p>单凭“不资助”不能推出“绝对没有任何间接好处”，但题干也没有问有没有一丁点间接作用，而是在问批评者认定的主要受益对象。原段将自我宣传归给幕后人，并没有把同行评审研究列为主要获益者。<\/p>\n<p>D把被指出缺少资助、面临制度风险的一方，写成批评者认为最受益的一方，改变了这组批评的评价方向。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>They do not fund peer-reviewed research.<\/p>\n<p>They perpetuate the myth of the lone genius.<\/p>\n<p>批评者说新奖并不资助同行评审研究，并延续孤独天才的神话。<\/p>\n<\/blockquote>\n<p>说完资助问题，批评继续进入对个人英雄叙事的质疑，仍没有转成对同行评审研究获益的肯定。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Critics acknowledge that peer-review-led research gains the greatest support from the new awards.<\/p>\n<p>批评者承认，同行评审主导的研究从新奖项获得了最大的支持。<\/p>\n<\/blockquote>\n<p>D所需的推进应让批评者肯定这类研究获得主要支持；实际却接连指出研究资助缺失和研究叙事的问题。两条路线对同一研究方式的评价不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在承认批评之后仍接受新奖，不能判断批评者把最大的好处归给了谁。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>peer-review-led research<br>同行评审主导的研究<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“They do not fund peer-reviewed research”及同段对幕后人自我宣传的评价判断。末段作者欢迎金钱流向科学，不等于批评者承认同行评审研究最受益，D混淆了说话人及具体受益范围。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. B. the founders of the new awards**\n\nA把发出批评的科学家放到主要受益者的位置，并加上逐利限定。\n\nB将幕后设奖者的自我宣传准确概括为设立者受益。\n\nC借用体系名称，把可能被扭曲改成最能获益。\n\nD把批评者指出资助缺失及制度风险的研究，改成他们认定的主要受益方。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[4,532,1389,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"conclusion","question":32},"level":3,"html":"<blockquote>\n<p><strong>32. B. the founders of the new awards<\/strong><\/p>\n<\/blockquote>\n<p>A把发出批评的科学家放到主要受益者的位置，并加上逐利限定。<\/p>\n<p>B将幕后设奖者的自我宣传准确概括为设立者受益。<\/p>\n<p>C借用体系名称，把可能被扭曲改成最能获益。<\/p>\n<p>D把批评者指出资助缺失及制度风险的研究，改成他们认定的主要受益方。<\/p>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> The discovery of the Higgs boson is a typical case which involves ______.  \n> 希格斯玻色子的发现是一个典型案例，它涉及什么？\n\n### 题型\n\n这是一道例子作用与细节相结合的题。题干以希格斯玻色子的发现为案例，要求识别它体现的研究特点；应把这个案例放回第4段关于获奖人数限制和现代研究合作性的整句中读。\n\n### 核心出处\n\n> As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.\n>\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.\n>\n> The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.\n>\n> Time, rather than intention, has given them legitimacy.\n\n段首先提出新旧奖项如何分配都值得讨论。包含希格斯玻色子的长句先说明三人名额限制已不适应现代合作研究，再以授奖时谁被遗漏的争执来说明这一矛盾。例后，文章转向诺贝尔奖的私人设立背景和时间带来的认可，没有展开获奖者个人地位或成果展示的讨论。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[4,1060,1623,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"question","question":33},"level":2,"html":"<blockquote>\n<p>The discovery of the Higgs boson is a typical case which involves ______.<br>希格斯玻色子的发现是一个典型案例，它涉及什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道例子作用与细节相结合的题。题干以希格斯玻色子的发现为案例，要求识别它体现的研究特点；应把这个案例放回第4段关于获奖人数限制和现代研究合作性的整句中读。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<p>段首先提出新旧奖项如何分配都值得讨论。包含希格斯玻色子的长句先说明三人名额限制已不适应现代合作研究，再以授奖时谁被遗漏的争执来说明这一矛盾。例后，文章转向诺贝尔奖的私人设立背景和时间带来的认可，没有展开获奖者个人地位或成果展示的讨论。<\/p>\n"},{"title":"A. the joint effort of modern researchers","raw":"### A. the joint effort of modern researchers\n\n> 现代研究者的共同努力\n\n**做题模式中的状态：** 当时认出了`collaborative nature of modern research`，虽然预示争执的修饰词被遮挡，仍把`joint effort`与合作性质对应起来，第一轮保留A，其余三项排除，最终选A。\n\n**选项类型：正确概括例子作用。**\n\nA将`collaborative nature of modern research`改写为`the joint effort of modern researchers`，从研究具有合作性质转成研究者共同努力。希格斯玻色子发现是用来说明这种合作特点与三人获奖限制的冲突。\n\n**出处：**\n\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[83,1152,835,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q33-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>现代研究者的共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了<code>collaborative nature of modern research<\/code>，虽然预示争执的修饰词被遮挡，仍把<code>joint effort<\/code>与合作性质对应起来，第一轮保留A，其余三项排除，最终选A。<\/p>\n<p><strong>选项类型：正确概括例子作用。<\/strong><\/p>\n<p>A将<code>collaborative nature of modern research<\/code>改写为<code>the joint effort of modern researchers<\/code>，从研究具有合作性质转成研究者共同努力。希格斯玻色子发现是用来说明这种合作特点与三人获奖限制的冲突。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. the joint effort of modern researchers","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 希格斯玻色子的发现是一个涉及现代研究者共同努力的典型案例。\n\n题干中的`the discovery of the Higgs boson`在第4段长句后半部出现，要向前接到`the collaborative nature of modern research`，看这个案例在说明什么。\n\n长句的主干说诺贝尔奖最多三人且必须在世的限制，已经不适应现代研究的合作性质。破折号后的`as will be demonstrated`继续说明，承认希格斯玻色子发现时围绕谁被遗漏的争执，会展示这种不适应。\n\n因此，前半句给出研究特点，后半句提供与该特点有关的授奖困境。只有研究成就涉及多位研究者的共同工作，获奖名额限制才会产生这里所说的遗漏问题；无需另行补出具体团队人数。\n\nA用“研究者共同努力”概括原文明确提出的合作性质，保留了案例所依赖的研究方式。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[83,1152,835,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>现代研究者的共同努力<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了<code>collaborative nature of modern research<\/code>，虽然预示争执的修饰词被遮挡，仍把<code>joint effort<\/code>与合作性质对应起来，第一轮保留A，其余三项排除，最终选A。<\/p>\n<p><strong>选项类型：正确概括例子作用。<\/strong><\/p>\n<p>A将<code>collaborative nature of modern research<\/code>改写为<code>the joint effort of modern researchers<\/code>，从研究具有合作性质转成研究者共同努力。希格斯玻色子发现是用来说明这种合作特点与三人获奖限制的冲突。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及现代研究者共同努力的典型案例。< <code>collaborative nature of modern research<\/code>改写为<code>the joint effort of modern researchers<\/code>，从研究具有合作性质转成研究者共同努力。希格斯玻色子发现是用来说明这种合作特点与三人获奖限制的冲突。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及现代研究者共同努力的典型案例。<\/p>\n<\/blockquote>\n<p>题干中的<code>the discovery of the Higgs boson<\/code>在第4段长句后半部出现，要向前接到<code>the collaborative nature of modern research<\/code>，看这个案例在说明什么。<\/p>\n<p>长句的主干说诺贝尔奖最多三人且必须在世的限制，已经不适应现代研究的合作性质。破折号后的<code>as will be demonstrated<\/code>继续说明，承认希格斯玻色子发现时围绕谁被遗漏的争执，会展示这种不适应。<\/p>\n<p>因此，前半句给出研究特点，后半句提供与该特点有关的授奖困境。只有研究成就涉及多位研究者的共同工作，获奖名额限制才会产生这里所说的遗漏问题；无需另行补出具体团队人数。<\/p>\n<p>A用“研究者共同努力”概括原文明确提出的合作性质，保留了案例所依赖的研究方式。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>文章以合作研究和三人获奖限制的冲突引出希格斯案例，随后转而回顾诺贝尔奖的私人创立背景。<\/p>\n<\/blockquote>\n<p>这一例子完成的是对诺贝尔奖分配规则的说明，例后作者没有进入发现成果本身的技术解释。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The discovery of the Higgs boson reflects the joint work of many researchers, which a three-person prize limit cannot fully recognize.<\/p>\n<p>希格斯玻色子的发  status`又使人联想到同句的`recipients`。这里不能只找到两个相近词，还要看作者把它们怎样连接到这个发现上。\n\n原句确实预期承认希格斯发现时会为“谁被遗漏”发生争执。前面的合作性质与三人限制解释了这个对象：研究由多人共同完成，但奖项名额不足以容纳所有应受认可的贡献者。\n\nB中的`recipients’ status`说的是获奖者的身份或地位，原句的`who is ignored`却在追问有贡献而未被纳入认可范围的人。原文没有进一步说获奖者本身的身份或地位受到争议，不能把“谁没有得到认可”改成“获奖者的地位是否有问题”。\n\n因此，B把有关遗漏贡献者的争执改成获奖者身份或地位争议，改变了原句的对象。合作研究的背景进一步帮助我们看清，这里的争执由贡献者被遗漏而来。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[83,1240,871,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q33-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>围绕获奖者身份或地位的争议<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B写成<code>controversies over the [xxx] status<\/code>，做题分析把它理解为获奖者身份争议；随后将它与<code>who is ignored<\/code>比较，认为原文重点在合作成果中谁被遗漏，第一轮排除B，后面没有改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了原句确实预期会出现的授奖争执，却将争议对象从“共同作出贡献的人中谁被遗漏”改成“获奖者的身份或地位”。两处都涉及科学奖的认可，但未获充分认可的贡献者与获奖者不是同一对象，遗漏问题也不等于对获奖者身份地位的争议。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及获奖者身份或地位争议的典型案例。<\/p>\n<\/blockquote>\n<p>B的<code>controversies<\/code>对应原句的<code>row<\/code>，<code>recipients’ status<\/code>又使人联想到同句的<code>recipients<\/code>。这里不能只找到两个相近词，还要看作者把它们怎样连接到这个发现上。<\/p>\n<p>原句确实预期承认希格斯发现时会为“谁被遗漏”发生争执。前面的合作性质与三人限制解释了这个对象：研究由多人共同完成，但奖项名额不足以容纳所有应受认可的贡献者。<\/p>\n<p>B中的<code>recipients’ status<\/code>说的是获奖者的身份或地位，原句的<code>who is ignored<\/code>却 e recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及获奖者身份或地位争议的典型案例。<\/p>\n<\/blockquote>\n<p>B的<code>controversies<\/code>对应原句的<code>row<\/code>，<code>recipients’ status<\/code>又使人联想到同句的<code>recipients<\/code>。这里不能只找到两个相近词，还要看作者把它们怎样连接到这个发现上。<\/p>\n<p>原句确实预期承认希格斯发现时会为“谁被遗漏”发生争执。前面的合作性质与三人限制解释了这个对象：研究由多人共同完成，但奖项名额不足以容纳所有应受认可的贡献者。<\/p>\n<p>B中的<code>recipients’ status<\/code>说的是获奖者的身份或地位，原句的<code>who is ignored<\/code>却在追问有贡献而未被纳入认可范围的人。原文没有进一步说获奖者本身的身份或地位受到争议，不能把“谁没有得到认可”改成“获奖者的地位是否有问题”。<\/p>\n<p>因此，B把有关遗漏贡献者的争执改成获奖者身份或地位争议，改变了原句的对象。合作研究的背景进一步帮助我们看清，这里的争执由贡献者被遗漏而来。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>作者先把合作性质与三人名额相对照，再提对哪些贡献者会被遗漏的争执；下一句转向诺贝尔奖的创立背景。<\/p>\n<\/blockquote>\n<p>这条实际路线将争执落在共同贡献的认可不足上，没有转为怀疑获奖者本身的身份或地位。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The dispute surrounding recognition of the Higgs boson discovery concerns the status of those receiving the prize, rather than which contributors are left out.<\/p>\n<p>围绕希格斯玻色子发现的认可所发生的争执，涉及获奖者的身份或地位，而不是哪些贡献者被遗漏。<\/p>\n<\/blockquote>\n<p>B成立至少需要把争执对象写成获奖者的身份或地位；实际则明确写<code>who is ignored<\/code>，并用合作研究与人数限制解释为何有人被漏掉。两条路线都可 遗漏”发生争执。前面的合作性质与三人限制解释了这个对象：研究由多人共同完成，但奖项名额不足以容纳所有应受认可的贡献者。<\/p>\n<p>B中的<code>recipients’ status<\/code>说的是获奖者的身份或地位，原句的<code>who is ignored<\/code>却在追问有贡献而未被纳入认可范围的人。原文没有进一步说获奖者本身的身份或地位受到争议，不能把“谁没有得到认可”改成“获奖者的地位是否有问题”。<\/p>\n<p>因此，B把有关遗漏贡献者的争执改成获奖者身份或地位争议，改变了原句的对象。合作研究的背景进一步帮助我们看清，这里的争执由贡献者被遗漏而来。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>作者先把合作性质与三人名额相对照，再提对哪些贡献者会被遗漏的争执；下一句转向诺贝尔奖的创立背景。<\/p>\n<\/blockquote>\n<p>这条实际路线将争执落在共同贡献的认可不足上，没有转为怀疑获奖者本身的身份或地位。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The dispute surrounding recognition of the Higgs boson discovery concerns the status of those receiving the prize, rather than which contributors are left out.<\/p>\n<p>围绕希格斯玻色子发现的认可所发生的争执，涉及获奖者的身份或地位，而不是哪些贡献者被遗漏。<\/p>\n<\/blockquote>\n<p>B成立至少需要把争执对象写成获奖者的身份或地位；实际则明确写<code>who is ignored<\/code>，并用合作研究与人数限制解释为何有人被漏掉。两条路线都可以包含争执，但争执围绕的人和问题不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>controversies over the recipients’ status<br>围绕获奖者身份或地位的争议<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the inevitable row over who is ignored”判断。全文承认奖项可以受到批评，却不能据此认定任何一种具体争议都存在；B写的是获奖者的身份或地位，而这处原文写的是共同贡献者被遗漏，主旨不能替它补上被换掉的对象。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. the demonstration of research findings","raw":"### C. the demonstration of research findings\n\n> 研究成果的展示\n\n**做题模式中的状态：** 当时选项与原文的`demonstrated`都能读到，做题时追问被展示的是成果还是现代研究的合作性质，认为C错接了这个动作所说明的内容，第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC利用`will be demonstrated`和`discovery`，把“案例说明获奖限制不适应合作研究”改成“展示研究成果”。它保留了展示这个动作，却换掉了动作所证明的内容。\n\n**出处：**\n\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[83,1328,850,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q33-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>研究成果的展示<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项与原文的<code>demonstrated<\/code>都能读到，做题时追问被展示的是成果还是现代研究的合作性质，认为C错接了这个动作所说明的内容，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C利用<code>will be demonstrated<\/code>和<code>discovery<\/code>，把“案例说明获奖限制不适应合作研究”改成“展示研究成果”。它保留了展示这个动作，却换掉了动作所证明的内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. the demonstration of research findings","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 希格斯玻色子的发现是一个涉及研究成果展示的典型案例。\n\nC中的`demonstration`与原文`demonstrated`词形相近，`research findings`又容易与`discovery`相连，因此要核对`as will be demonstrated`承接的是前面哪一个判断。\n\n破折号前的判断是：诺贝尔奖三人限制已经被现代合作研究的发展超越。后面的争执会说明这一点，原句没有将研究成果设为被展示的对象。\n\n`by the inevitable row`还指出这种说明通过什么实现：通过承认共同成果时谁被遗漏的争论。它不是通过发布数据、呈现发现过程或展示成果来解释物理学发现。\n\nC把“以授奖争执说明制度与合作研究的冲突”改成“展示研究成果”，对`demonstrated`前后关系的理解发生了变化。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[83,1328,850,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q33-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>研究成果的展示<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项与原文的<code>demonstrated<\/code>都能读到，做题时追问被展示的是成果还是现代研究的合作性质，认为C错接了这个动作所说明的内容，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C利用<code>will be demonstrated<\/code>和<code>discovery<\/code>，把“案例说明获奖限制不适应合作研究”改成“展示研究成果”。它保留了展示这个动作，却换掉了动作所证明的内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及研究成果展示的典型案例。<\/p>\n<\/blockquote>\n<p>C中的<code>demonstration<\/code>与原文<code>demonstrated<\/code>词形相近，<code>research findings<\/code>又容易与<code>discovery<\/code>相连，因此要核对<code>as will be demonstrated<\/code>承接的是前面哪一个判断。<\/p>\n<p>破折号前的判断是：诺贝尔奖三人限制已经被现代合作研究的发展超越。后面的争执会说明这一点，原句没有将研究成果设为被展示的对象。<\/p>\n<p><code>by the inevitable row<\/code>还指出这种说明通过什么实现：通过承认共同成果时谁被遗漏的争论。它不是通过发布数据、呈现发现过程或展示成果来解释物理学发现。<\/p>\n<p>C把“以授奖争执说明制度与合作研究的冲突”改成“展示研究成果”，对<code>demonstrated<\/code>前后关系的理解发生了变化。<\/p>\n<\/section>"},{"title":"C. the demonstration of research findings","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.\n>\n> Time, rather than intention, has given them legitimacy.\n>\n> 作者先借希格斯案例说明获奖名额的问题，随后把讨论引向诺贝尔奖随时间取得认可。\n\n相关段落一直评价科学奖项的规则和历史地位，没有转向教读者理解希格斯发现的研究结果。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The case of the Higgs boson illustrates how researchers present and demonstrate their scientific findings.\n>\n> 希格斯玻色子的案例说明研究者如何呈现和展示自己的科学发现。\n\nC成立需要文章至少把展示过程或研究结果作为说明对象；实际展示的是三人限额与合作研究不相适应。相同的动词词根不能使两种说明对象相同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[83,1328,850,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q33-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>研究成果的展示<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项与原文的<code>demonstrated<\/code>都能读到，做题时追问被展示的是成果还是现代研究的合作性质，认为C错接了这个动作所说明的内容，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C利用<code>will be demonstrated<\/code>和<code>discovery<\/code>，把“案例说明获奖限制不适应合作研究”改成“展示研究成果”。它保留了展示这个动作，却换掉了动作所证明的内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及研究成果展示的典型案例。<\/p>\n<\/blockquote> macy.<\/p>\n<p>作者先借希格斯案例说明获奖名额的问题，随后把讨论引向诺贝尔奖随时间取得认可。<\/p>\n<\/blockquote>\n<p>相关段落一直评价科学奖项的规则和历史地位，没有转向教读者理解希格斯发现的研究结果。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The case of the Higgs boson illustrates how researchers present and demonstrate their scientific findings.<\/p>\n<p>希格斯玻色子的案例说明研究者如何呈现和展示自己的科学发现。<\/p>\n<\/blockquote>\n<p>C成立需要文章至少把展示过程或研究结果作为说明对象；实际展示的是三人限额与合作研究不相适应。相同的动词词根不能使两种说明对象相同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>the demonstration of research findings<br>研究成果的展示<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the Nobel Foundation’s limit”与“as will be demonstrated by the inevitable row”的连接判断。全文关注奖项的可接受性，C却把这一段变成研究成果展示；局部句义也没有提供这种技术介绍。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. legitimate concerns over the new prizes","raw":"### D. legitimate concerns over the new prizes\n\n> 对新奖项的合理担忧\n\n**做题模式中的状态：** 当时认出了段首的新旧奖范围以及例子前的`Nobel Foundation’s limit`，做题时认为D只写新奖，改换了希格斯案例直接针对的对象，第一轮排除D，最后没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nD取用了段首`legitimate concerns`，却把范围缩到`the new prizes`。希格斯发现所在的长句具体讨论的是诺贝尔奖的三人限制，不能把对旧奖分配规则的说明改挂到新奖上。\n\n**出处：**\n\n> As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.\n>\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[83,1416,882,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q33-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>对新奖项的合理担忧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了段首的新旧奖范围以及例子前的<code>Nobel Foundation’s limit<\/code>，做题时认为D只写新奖，改换了希格斯案例直接针对的对象，第一轮排除D，最后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D取用了段首<code>legitimate concerns<\/code>，却把范围缩到<code>the new prizes<\/code>。希格斯发现所在的长句具体讨论的是诺贝尔奖的三人限制，不能把对旧奖分配规则的说明改挂到新奖上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. legitimate concerns over the new prizes","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 希格斯玻色子的发现是一个涉及对新奖项合理担忧的典型案例。\n\nD的`legitimate concerns`在第4段首句出现，但题干给出的希格斯发现位于后面的长句；两处之间还有新奖与诺贝尔奖的对象转换。\n\n段首用`both new and old`统领科学奖的分配问题。随后先讨论新设的生命科学突破奖，再用`But`转入诺贝尔奖限制，希格斯例子紧接在这一旧奖问题后。\n\n因此，段首承认对新奖存在合理担忧，并不表示本段每个例子都针对新奖。D的`new`限定了范围，而这个案例直接说明诺贝尔奖的获奖人数规则与现代研究不匹配。\n\nD将统领新旧奖的担忧截取成只针对新奖，又把旧奖限制下的案例放了进去，改变了例子的指向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[83,1416,882,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>对新奖项的合理担忧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了段首的新旧奖范围以及例子前的<code>Nobel Foundation’s limit<\/code>，做题时认为D只写新奖，改换了希格斯案例直接针对的对象，第一轮排除D，最后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D取用了段首<code>legitimate concerns<\/code>，却把范围缩到<code>the new prizes<\/code>。希格斯发现所在的长句具体讨论的是诺贝尔奖的三人限制，不能把对旧奖分配规则的说明改挂到新奖上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及对新奖项合理担忧的典型案例。<\/p>\n<\/blockquote>\n<p>D的<code>legitimate concerns<\/code>在第4段首句出现，但题干给出的希格斯发现位于后面的长句；两处之间还有新奖与诺贝尔奖的对象转换。<\/p>\n<p>段首用<code>both new and old<\/code>统领科学奖的分配问题。随后先讨论新设的生命科学突破奖，再用<code>But<\/code>转入诺贝尔奖限制，希格斯例子紧接在这一旧奖问题后。<\/p>\n<p>因此，段首承认对新奖存在合理担忧，并不表示本段每个例子都针对新奖。D的<code>new<\/code>限定了范围，而这个案例直接说明诺贝尔奖的获奖人数规则与现代研究不匹配。<\/p>\n<p>D将统领新旧奖的担忧截取成只针对新奖，又把旧奖限制下的案例放了进去，改变了例子的指向。<\/p>\n<\/section>"},{"title":"D. legitimate concerns over the new prizes","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.\n>\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.\n>\n> 作者先指出生命科学突破奖覆盖范围不具代表性，再转向诺贝尔奖三人限制，随后才提希格斯案例。\n\n两种奖项的问题分别展开，`But`已经将后半部分的讨论对象换成诺贝尔奖。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The new prizes’ rules fail to recognize collaborative discoveries, as the case of the Higgs boson shows.\n>\n> 新奖项的规则未能认可合作完成的发现，希格斯玻色子的案例说明了这一点。\n\nD所需的写法要让新奖项规则成为案例的前提；实际前提明确是诺贝尔基金会的限制。即使二者都属于科学奖，也不能省略这次对象转换。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[83,1416,882,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>对新奖项的合理担忧<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认出了段首的新旧奖范围以及例子前的<code>Nobel Foundation’s limit<\/code>，做题时认为D只写新奖，改换了希格斯案例直接针对的对象，第一轮排除D，最后没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D取用了段首<code>legitimate concerns<\/code>，却把范围缩到<code>the new prizes<\/code>。希格斯发现所在的长句具体讨论的是诺贝尔奖的三人限制，不能把对旧奖分配规则的说明改挂到新奖上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及对新奖项合理担忧的典型案例。<\/p>\n<\/blockquote>\n<p>D的<code>legitimate concerns<\/code>在第4段首句出现，但题干给出的希格斯发现位于后面的长句；两处之间还有新奖与诺贝尔奖的对象转换。<\/p>\n<p>段首用<code>both new and old<\/code>统领科学奖的分配问题。随后先讨论新设的生命科学突破奖，再用<code>But<\/code>转入诺贝尔奖限制，希格斯例子紧接在这一旧奖问题后。<\/p>\n<p>因此，段首承认对新奖存在合理担忧，并不表示本段每个例子都针对新奖。D的<code>new<\/code>限定了范围，而这个案例直接说明诺贝尔奖的获奖人数规则与现代研究不匹配。<\/p>\n<p>D将统领新旧奖的担忧截取成只针对新奖，又把旧奖限制下的案例放了进去，改变了例子的指向。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-2\" itimate concerns<\/code>，却把范围缩到<code>the new prizes<\/code>。希格斯发现所在的长句具体讨论的是诺贝尔奖的三人限制，不能把对旧奖分配规则的说明改挂到新奖上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>希格斯玻色子的发现是一个涉及对新奖项合理担忧的典型案例。<\/p>\n<\/blockquote>\n<p>D的<code>legitimate concerns<\/code>在第4段首句出现，但题干给出的希格斯发现位于后面的长句；两处之间还有新奖与诺贝尔奖的对象转换。<\/p>\n<p>段首用<code>both new and old<\/code>统领科学奖的分配问题。随后先讨论新设的生命科学突破奖，再用<code>But<\/code>转入诺贝尔奖限制，希格斯例子紧接在这一旧奖问题后。<\/p>\n<p>因此，段首承认对新奖存在合理担忧，并不表示本段每个例子都针对新奖。D的<code>new<\/code>限定了范围，而这个案例直接说明诺贝尔奖的获奖人数规则与现代研究不匹配。<\/p>\n<p>D将统领新旧奖的担忧截取成只针对新奖，又把旧奖限制下的案例放了进去，改变了例子的指向。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关部分是这样写的：<\/p>\n<blockquote>\n<p>The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>作者先指出生命科学突破奖覆盖范围不具代表性，再转向诺贝尔奖三人限制，随后才提希格斯案例。<\/p>\n<\/blockquote>\n<p>两种奖项的问题分别展开，<code>But<\/code>已经将后半部分的讨论对象换成诺贝尔奖。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The new prizes’ rules fail to recognize collaborative discoveries, as the case of the Higgs boson shows.<\/p>\n<p>新奖项的规则未能认可合作完成的发现，希格斯玻色子的案例说明了这一点。<\/p>\n<\/blockquote>\n<p>D所需的写法要让新奖项规则成为案例的前提；实际前提明确是诺贝尔基金会的限制。即使二者都属于科学奖，也不能省略这次对象转换。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者将奖项争议与其可接受性放在一起讨论，不能单独判断希格斯玻色子的发现涉及怎样的研究方式或获奖争议。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>legitimate concerns over the new prizes<br>对新奖项的合理担忧<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“the Nobel Foundation’s limit of three recipients per prize”判断。全文既谈新奖也拿旧奖作比较，主旨承认新奖受批评不使所有例子都只属于新奖；D缩小范围后放错了案例。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. A. the joint effort of modern researchers**\n\nA概括现代研究的合作性质，保留希格斯案例与获奖人数限制的关系。\n\nB把共同贡献者中谁被遗漏的争执，改成围绕获奖者身份或地位的争议。\n\nC利用demonstrated，将被说明的制度局限改成研究成果展示。\n\nD把直接说明诺贝尔奖限制的案例，改指向新奖项。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[4,1060,1623,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"conclusion","question":33},"level":3,"html":"<blockquote>\n<p><strong>33. A. the joint effort of modern researchers<\/strong><\/p>\n<\/blockquote>\n<p>A概括现代研究的合作性质，保留希格斯案例与获奖人数限制的关系。<\/p>\n<p>B把共同贡献者中谁被遗漏的争执，改成围绕获奖者身份或地位的争议。<\/p>\n<p>C利用demonstrated，将被说明的制度局限改成研究成果展示。<\/p>\n<p>D把直接说明诺贝尔奖限制的案例，改指向新奖项。<\/p>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> According to Paragraph 4, which of the following is true of the Nobels?  \n> 根据第4段，关于诺贝尔奖，下面哪项说法正确？\n\n### 题型\n\n这是一道限定段落的细节题。题干把范围限定在第4段，判断对象是诺贝尔奖；应分别核对其分配规则、创立背景和后来获得认可的原因。\n\n### 核心出处\n\n> As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.\n>\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.\n>\n> The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.\n>\n> Time, rather than intention, has given them legitimacy.\n\n第4段先指出新旧奖的分配都有可讨论之处，再说明诺贝尔奖的三人限制已不适应现代合作研究。段末从规则转向历史：它同样由富人设立，而给予它认可的是时间，不是设立者的初衷。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[4,1588,1577,422],"sourceW":1631,"sourceH":2542},"meta":{"kind":"question","question":34},"level":2,"html":"<blockquote>\n<p>According to Paragraph 4, which of the following is true of the Nobels?<br>根据第4段，关于诺贝尔奖，下面哪项说法正确？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道限定段落的细节题。题干把范围限定在第4段，判断对象是诺贝尔奖；应分别核对其分配规则、创立背景和后来获得认可的原因。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<p>第4段先指出新旧奖的分配都有可讨论之处，再说明诺贝尔奖的三人限制已不适应现代合作研究。段末从规则转向历史：它同样由富人设立，而给予它认可的是时间，不是设立者的初衷。<\/p>\n"},{"title":"A. History has never cast doubt on them.","raw":"### A. History has never cast doubt on them.\n\n> 历史从未对诺贝尔奖提出过怀疑。\n\n**做题模式中的状态：** 当时把`History`与段末`Time`相连，认为“后来由时间取得认可”不支持“历史从未怀疑”，第一轮排除A，后面没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用时间和认可的关系，把“经历时间获得正当性”扩大成“历史上从无怀疑”。段首已经将诺贝尔奖包括在新旧奖的合理担忧中，后面也具体质疑其三人限制。\n\n**出处：**\n\n> As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.\n>\n> But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.\n>\n> Time, rather than intention, has given them legitimacy.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[83,1681,850,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q34-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>历史从未对诺贝尔奖提出过怀疑。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>History<\/code>与段末<code>Time<\/code>相连，认为“后来由时间取得认可”不支持“历史从未怀疑”，第一轮排除A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用时间和认可的关系，把“经历时间获得正当性”扩大成“历史上从无怀疑”。段首已经将诺贝尔奖包括在新旧奖的合理担忧中，后面也具体质疑其三人限制。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes—both new and old—are distributed.<\/p>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. History has never cast doubt on them.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第4段，历史从未对诺贝尔奖提出过怀疑。\n\n题干限定第4段，A的`History`对应段末的`Time`，但`never cast doubt`还要求回看同段作者有没有提出疑问，不能只读最后一句。\n\n`Time ... has given them legitimacy`说明时间带来了认可。仅靠这一句，不能反推诺贝尔奖过去必然遭到怀疑；同样，也不能把它扩写成过去从未被怀疑。\n\n判断A还要接上段首的`legitimate concer 长期存在、经受时间的过程，<code>done justice to them<\/code>概括其后来得到应有认可。D用另一种表达保留了原文“时间赋予正当性”的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. Their endurance has done justice to them.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第4段，诺贝尔奖经受时间后获得了应有的认可。\n\nD中的`endurance`与第4段的`Time`相接，`done justice to them`则对应`has given them legitimacy`。两处都在回答诺贝尔奖怎样取得认可。\n\n前一句提醒读者：诺贝尔奖本身也出自一个富人的个人决定。下一句再把`Time`与`intention`对照，说明正当性来自时间检验，不是仅靠初衷自动取得。\n\nD的`done justice to`在这里表示作出应有或公正的评价，不是指法庭审判。它也没有说时间使奖项规则变得完美，只说长期存在让奖项获得应有认可。\n\nD保留了奖项、时间积累和认可结果三者的关系，准确改写了段末的历史评价。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[83,1945,927,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q34-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>它们经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>endurance<\/code>与原文<code>Time<\/code>相连，将<code>done justice to them<\/code>理解为经过时间获得应有评价，第一轮保留D，并作为本题唯一保留项选出。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>endurance<\/code>概括奖项长期存在、经受时间的过程，<code>done justice to them<\/code>概括其后来得到应有认可。D用另一种表达保留了原文“时间赋予正当性”的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<p>Time, rather than intention, has given them legitimacy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第4段，诺贝尔奖经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p>D中的<code>endurance<\/code>与第4段的<code>Time<\/code>相接，<code>done justice to them<\/code>则对应<code>has given them legitimacy<\/code>。两处都在回答诺贝尔奖怎样取得认可。<\/p>\n<p>前一句提醒读者：诺贝尔奖本身也出自一个富人的个人决定。下一句再把<code>Time<\/code>与<code>intention<\/code>对照，说明正当性来自时间检验，不是仅靠初衷自动取得。<\/p>\n<p>D的<code>done justice to<\/code>在这里表示作出应有或公正的评价，不是指法庭审判。它也没有说时间使奖项规则变得完美，只说长期存在让奖项获得应有认可。<\/p>\n<p>D保留了奖项、时间积累和认可结果三者的关系，准确改写了段末的历史评价。<\/p>\n<\/section>"},{"title":"D. Their endurance has done justice to them.","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.\n>\n> Time, rather than intention, has given them legitimacy.\n>\n> As much as some scientists may complain about the new awards, two things seem clear.\n>\n> 文章回顾旧奖由富人设立、随时间获得认可，接着回到虽有科学家抱怨但新奖仍可接受的问题。\n\n诺贝尔奖的经历让比较落在奖项如何被看待上，为结尾不因争议就拒绝新奖作铺垫。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The Nobels have earned due recognition through their long existence, rather than through their founder’s intentions alone.\n>\n> 诺贝尔奖通过长期存在获得了应有认可，而不是仅凭设立者的初衷。\n\nD要求的时间与认可关系在原文已经具备。用这种历史评价回到新奖的接受问题，也与实际从第4段向第5段的推进相接，没有把认可扩成毫无缺陷。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[83,1945,927,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q34-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>它们经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时把<code>endurance<\/code>与原文<code>Time<\/code>相连，将<code>done justice to them<\/code>理解为经过时间获得应有评价，第一轮保留D，并作为本题唯一保留项选出。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>endurance<\/code>概括奖项长期存在、经受时间的过程，<code>done justice to them<\/code>概括其后来得到应有认可。D用另一种表达保留了原文“时间赋予正当性”的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich
