<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset:method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset:method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset:method_newtype_overview)\n\n![新题型考纲表格](asset:method_newtype_table)\n\n![七选五题型说明](asset:method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset:method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset:method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset:method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","level":1,"section":"第一鸟 · 词汇","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| million | n. 百万 | Fundamental Physics Prize | n. 基础物理学奖 | interesting | a. 有趣的 |\n| experiment | n. 实验 | accept | v. 接受 | award | n. 奖项 |\n| March | n. 三月 | type | n. 类型 | News Feature article | n. 新闻特稿 |\n| discuss | v. 讨论 | a string of | 一系列 | lucrative | a. 奖金丰厚的 |\n| researcher | n. 研究人员 | join | v. 加入 | recent | a. 最近的 |\n| fund | v. 资助 | telephone-number-sized bank accounts | n. 余额位数堪比电话号码的巨额银行账户 | Internet entrepreneur | n. 互联网企业家 |\n| benefactor | n. 捐助者 | succeed | v. 取得成功 | chosen field | n. 所选择的领域 |\n| wealth | n. 财富 | draw attention to | 吸引人们关注…… | science | n. 科学 |","context":{"focus":[94,131,892,807],"mode":"image","asset":"articleAnnotated","sourceW":1080,"sourceH":6116,"label":"第1段重点词语境","includeTitle":true},"meta":{"bird":1,"paragraph":1},"html":"<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>million<\/td>\n<td>n. 百万<\/td>\n<td>Fundamental Physics Prize<\/td>\n<td>n. 基础物理学奖<\/td>\n<td>interesting<\/td>\n<td>a. 有趣的<\/td>\n<\/tr>\n<tr>\n<td>experiment<\/td>\n<td>n. 实验<\/td>\n<td>accept<\/td>\n<td>v. 接受<\/td>\n<td>award<\/td>\n<td>n. 奖项<\/td>\n<\/tr>\n<tr>\n<td>March<\/td>\n<td>n. 三月<\/td>\n<td>type<\/td>\n<td>n. 类型<\/td>\n<td>News Feature article<\/td>\n<td>n. 新闻特稿<\/td>\n<\/tr>\n<tr>\n<td>discuss<\/td>\n<td>v. 讨论<\/td>\n<td>a string of<\/td>\n<td>一系列<\/td>\n<td>lucrative<\/td>\n<td>a. 奖金丰厚的<\/td>\n<\/tr>\n<tr>\n<td>researcher<\/td>\n<td>n. 研究人员<\/td>\n<td>join<\/td>\n<td>v. 加入<\/td>\n<td>recent<\/td>\n<td>a. 最近的<\/td>\n<\/tr>\n<tr>\n<td>fund<\/td>\n<td>v. 资助<\/td>\n<td>telephone-n arch. They could cement the status quo of peer-reviewed research. They do not fund peer-reviewed research. They perpetuate the myth of the lone genius.","context":{"focus":[94,945,892,872],"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-2"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false},"focusId":"focus-paragraph-2-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段<\/h3>\n<p>What&#39;s not to like? Quite a lot, according to a handful of scientists quoted in the News Feature. You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels. The new awards are an exercise in self-promotion for those behind them, say scientists. They could distort the achievement-based system of peer-review-led research. They could cement the status quo of peer-reviewed research. They do not fund peer-reviewed research. They perpetuate the myth of the lone genius.<\/p>\n<\/section>"},{"title":"第2段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第2段\n\nWhat's not to like?\n\nQuite a lot, / according to a handful of scientists / quoted in the News Feature.\n\nYou cannot buy class, / as the old saying goes, / and these upstart entrepreneurs / cannot buy their prizes / the prestige of the Nobels.\n\nThe new awards / are an exercise in self-promotion / for those behind them, / say scientists.\n\nThey could distort / the achievement-based system / of peer-review-led research.\n\nThey could cement / the status quo / of peer-reviewed research.\n\nThey do not fund / peer-reviewed research.\n\nThey perpetuate / the myth of the lone genius.","context":{"focus":[94,945,892,872],"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-2"},"meta":{"cumulat ery of the Higgs boson.<\/p>\n<p>The Nobels were, / of course, / themselves set up / by a very rich individual / who had decided / what he wanted to do / with his own money.<\/p>\n<p>Time, / rather than intention, / has given them legitimacy.<\/p>\n<\/section>"},{"title":"第4段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第4段\n\n正如《自然》之前指出的，/ 存在一些合理的担忧 / 关于科学奖项如何 – / 包括新的和旧的 – / 被分配。\n\n生命科学突破奖，/ 今年推出的，/ 采取了一个不具代表性的观点 / 关于生命科学包括什么。\n\n但诺贝尔基金会的限制 / 每个奖项三个获奖者，/ 每个人必须仍然在世，/ 早已被超越 / 被合作性质 / 现代研究的 – / 正如将被证明的 / 通过不可避免的争议 / 关于谁被忽视了 / 当涉及到承认 / 希格斯玻色子的发现。\n\n诺贝尔奖，/ 当然，/ 本身就是建立的 / 由一个非常富有的个人 / 他已经决定了 / 他想要做什么 / 用他自己的钱。\n\n时间，/ 而不是意图，/ 赋予了它们合法性。","context":{"focus":[94,2152,892,1091],"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-4"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes – both new and old – are distributed. The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include. But the Nobel Foundation&#39;s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research – as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. Time, rather than intention, has given them legitimacy.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>As Nature has pointed out before, / there are some legitimate concerns / about how science prizes – / both new and old – / are distributed.<\/p>\n<p>The Breakthrough Prize in Life Sciences, / launched this year, / takes an unrepresentative view / of what the life sciences include.<\/p>\n<p>But the Nobel Foundation&#39;s limit / of three recipients per prize, / each of whom must still be living, / has long been outgrown / by the collaborative nature / of modern research – / as will be demonstrated / by the inevitable row / over who is ignored / when it comes to acknowledging / the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, / of course, / themselves set up / by a very rich individual / who had decided / what he wanted to do / with his own money.<\/p>\n<p>Time, / rather than intention, / has given them legitimacy.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段<\/h3>\n<p>正如《自然》之前指出的，/ 存在一些合理的担忧 / 关于科学奖项如何 – / 包括新的和旧的 – / 被分配。<\/p>\n<p>生命科学突破奖，/ 今年推出的，/ 采取了一个不具代表性的观点 / 关于生命科学包括什么。<\/p>\n<p>但诺贝尔基金会的限制 / 每个奖项三个获奖者，/ 每个人必须仍然在世，/ 早已被超越 / 被合作性质 / 现代研究的 – / 正如将被证明的 / 通过不可避免的争议 / 关于谁被忽视了 / 当涉及到承认 / 希格斯玻色子的发现。<\/p>\n<p>诺贝尔奖，/ 当然，/ 本身就是建立的 / 由一个非常富有的个人 / 他已经决定了 / 他想要做什么 / 用他自己的钱。<\/p>\n<p>时间，/ 而不是意图，/ 赋予了它们合法性。<\/p>\n<\/section>"},{"title":"第4段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 标准译文 · 第4段\n\n正如《自然》之前指出的，关于科学奖项（包括新旧奖项）如何分配存在一些合理的担忧。今年推出的生命科学突破奖对生命科学的涵盖范围采取了不具代表性的观点。但诺贝尔基金会限制每个奖项最多三个获奖者，且必须在世，这早已不适应现代研究的合作性质——这一点将在承认希格斯玻色子发现时不可避免地出现的关于谁被忽视的争议中得到证明。当然，诺贝尔奖本身也是由一个非常富有的个人建立的，他决定了如何使用自己的钱。是时间，而非意图，赋予了它们合法性。","context":{"focus":[94,2152,892,1091],"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-4"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true},"focusId":"focus-paragraph-4-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段<\/h3>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes – both new and old – are distributed. The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include. But the Nobel Foundation&#39;s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research – as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. Time, rather than intention, has given them legitimacy.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段<\/h3>\n<p>As Nature has pointed out before, / there are some legitimate concerns / about how science prizes – / both new and old – / are distributed.<\/p>\n<p>The Breakthrough Prize in Life Sciences, / launched this year, / takes an unrepresentative view / of what the life sciences include.<\/p>\n<p>But the Nobel Foundation&#39;s limit / of three recipients per prize, / each of whom must still be living, / has long been outgrown / by the collaborative nature / of modern research – / as will be demonstrated / by the inevitable row / over who is ignored / when it comes to acknowledging / the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, / of course, / themselves set up / by a very rich individual / who had decided / what he wanted to do / with his own money.<\/p>\n<p>Time, / rather than intention, / has given them legitimacy.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段<\/h3>\n<p>正如《自然》之前指出的，/ 存在一些合理的担忧 / 关于科学奖项如何 – / 包括新的和旧的 – / 被分配。<\/p>\n<p>生命科学突破奖，/ 今年推出的，/ 采取了一个不具代表性的观点 / 关于生命科学包括什么。<\/p>\n<p>但诺贝尔基金会的限制 / 每个奖项三个获奖者，/ 每个人必须仍然在世，/ 早已被超越 / 被合作性质 / 现代研究的 – / 正如将被证明的 / 通过不可避免的争议 / 关于谁被忽视了 / 当涉及到承认 / 希格斯玻色子的发现。<\/p>\n<p>诺贝尔奖，/ 当然，/ 本身就是建立的 / 由一个非常富有的个人 / 他已经决定了 / 他想要做什么 / 用他自己的钱。<\/p>\n<p>时间，/ 而不是意图，/ 赋予了它们合法性。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-3\"><h3>标准译文 · 第4段<\/h3>\n<p>正如《自然》之前指出的，关于科学奖项（包括新旧奖项）如何分配存在一些合理的担忧。今年推出的生命科学突破奖对生命科学的涵盖范围采取了不具代表性的观点。但诺贝尔基金会限制每个奖项最多三个获奖者，且必须在世，这早已不适应现代研究的合作性质——这一点将在承认希格斯玻色子发现时不可避免地出现的关于谁被忽视的争议中得到证明。当然，诺贝尔奖本身也是由一个非常富有的个人建立的，他决定了如何使用自己的钱。是时间，而非意图，赋予了它们合法性。<\/p>\n<\/section>"},{"title":"第5段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 完整原文 · 第5段\n\nAs much as some scientists may complain about the new awards, two things seem clear. First, most researchers would accept such a prize if they were offered one. Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers' money to do with as they please. It is wise to take such gifts with gratitude and grace.","context":{"focus":[94,3255,892,643],"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-5"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段<\/h3>\n<p>As much as some scientists may complain about the new awards, two things seem clear. First, most researchers would accept such a prize if they were offered one. Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please. It is wise to take such gifts with gratitude and grace.<\/p>\n<\/section>"},{"title":"第5段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群划分 · 第5段\n\nAs much as some scientists / may complain / about the new awards, / two things seem clear.\n\nFirst, / most researchers / would accept such a prize / if they were offered one.\n\nSecond, / it is surely a good thing / that the money and attention / come to science / rather than go elsewhere.\n\nIt is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers' money / to do with as they please.\n\nIt is wise / to take such gifts / with gratitude and grace.","context":{"focus":[94,3255,892,643],"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-5"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段<\/h3>\n<p>As much as some scientists may complain about the new awards, two things seem clear. First, most researchers would accept such a prize if they were offered one. Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please. It is wise to take such gifts with gratitude and grace.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段<\/h3>\n<p>As much as some scientists / may complain / about the new awards, / two things seem clear.<\/p>\n<p>First, / most researchers / would accept such a prize / if they were offered one.<\/p>\n<p>Second, / it is surely a good thing / that the money and attention / come to science / rather than go elsewhere.<\/p>\n<p>It is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers&#39; money / to do with as they please.<\/p>\n<p>It is wise / to take such gifts / with gratitude and grace.<\/p>\n<\/section>"},{"title":"第5段","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 意群翻译 · 第5段\n\n尽管一些科学家 / 可能抱怨 / 关于新奖项，/ 两件事看起来很清楚。\n\n第一，/ 大多数研究人员 / 会接受这样的奖项 / 如果他们被提供一个。\n\n第二，/ 这肯定是件好事 / 金钱和关注 / 来到科学领域 / 而不是去别处。\n\n批评和质疑是公平的 / 机制 – / 这是研究的文化，/ 毕竟 – / 但这是奖项设立者的钱 / 按他们的意愿处理。\n\n明智的做法是 / 接受这些礼物 / 带着感激和优雅。","context":{"focus":[94,3255,892,643],"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","focusId":"paragraph-5"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段<\/h3>\n<p>As much as some scientists may complain about the new awards, two things seem clear. First, most researchers would accept such a prize if they were offered one. Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please. It is wise to take such gifts with gratitude and grace.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段<\/h3>\n<p>As much as some scientists / may complain / about the new awards, / two things seem clear.<\/p>\n<p>First, / most researchers / would accept such a prize / if they were offered one.<\/p>\n<p>Second, / it is surely a good thing / that the money and attention / come to science / rather than go elsewhere.<\/p>\n<p>It is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers&#39; money / to do with as they please.<\/p>\n<p>It is wise / to take such gifts / with gratitude and grace.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段<\/h3>\n<p>尽管一些科学家 / 可能抱怨 / 关于新奖项，/ 两件事看起来很清楚。<\/p>\n<p>第一，/ 大多数研究人员 / 会接受这样的奖项 / 如果他们被提供一个。<\/p>\ cus-paragraph-5-2\"><h3>意群翻译 · 第5段<\/h3>\n<p>尽管一些科学家 / 可能抱怨 / 关于新奖项，/ 两件事看起来很清楚。<\/p>\n<p>第一，/ 大多数研究人员 / 会接受这样的奖项 / 如果他们被提供一个。<\/p>\n<p>第二，/ 这肯定是件好事 / 金钱和关注 / 来到科学领域 / 而不是去别处。<\/p>\n<p>批评和质疑是公平的 / 机制 – / 这是研究的文化，/ 毕竟 – / 但这是奖项设立者的钱 / 按他们的意愿处理。<\/p>\n<p>明智的做法是 / 接受这些礼物 / 带着感激和优雅。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段<\/h3>\n<p>尽管一些科学家可能对新奖项有所抱怨，但有两件事看起来很清楚。第一，如果获得提名，大多数研究人员都会接受这样的奖项。第二，金钱和关注流向科学而非其他领域，这肯定是件好事。批评和质疑这种机制是公平的——毕竟这是研究文化的一部分——但这是奖项设立者的钱，他们有权按自己的意愿处理。明智的做法是带着感激和优雅接受这些礼物。<\/p>\n<\/section>"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","level":2,"section":"第二鸟 · 精读与翻译","raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\n\n符号的作用：\n\n- `→`：主要叙述继续向下推进；\n- `+`：并列；\n- `：`：解释、修饰或补充；\n- `//`：转折或对比；\n- 括号：把同一层的信息捆成一个整体。","context":{"focus":null,"mode":"image","asset":"articleAnnotated","label":"全文句内逻辑"},"meta":{},"html":"<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n"},{"title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"section":"第二鸟 · 精读与翻译","raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n**第1段**\n\nThe US$3-million Fundamental Physics Prize → is indeed an interesting experiment：(as Alexander Polyakov said：(when he accepted this year's award：(in March))).\n\nAnd it is far from → the only one of its type.\n\nAs a News Feature article：(in Nature) discusses → a string of lucrative awards：(for researchers) → have joined the Nobel Prizes：(in recent years).\n\nMany：(like the Fundamental Physics Prize) → are funded：(from the telephone-number-sized bank accounts：(of Internet entrepreneurs)).\n\nThese benefactors → have succeeded：(in their chosen fields) → they say + they want to use their wealth → to draw attention：(to those who have succeeded：(in science)).\n\n**第2段**\n\nWhat's not to like?\n\nQuite a lot → according to a handful of scientists：(quoted in the News Feature).\n\nYou cannot buy class：(as the old saying goes) + these upstart entrepreneurs → cannot buy their prizes → the prestige of the Nobels.\n\nThe new awards → are an exercise in self-promotion：(for those behind them) → say scientists.\n\nThey could distort → the achievement-based system：(of peer-review-led research).\n\nThey could cement → the status quo：(of peer-reviewed research).\n\nThey do not fund → peer-reviewed research.\n\nThey perpetuate → the myth of the lone genius.\n\n**第3段**\n\nThe goals of the prize-givers → seem as scattered → as the criticism.\n\nSome want to shock + others to draw people：(into science) + or to better reward those：(who have made their careers：(in research)).\n\n**第4段**\n\nAs Nature has pointed out before → there are some legitimate concerns：(about how science prizes – both new and old – are distributed).\n\nThe Breakthrough Prize in Life Sciences：(launched this year) → takes an unrepresentative view：(of what the life sciences include).\n\nBut the Nobel Foundation's limit：(of three recipients per prize：(each of whom must still be living)) → has long been outgrown：(by the collaborative nature：(of modern research)) – as will be demonstrated：(by the inevitable row：(over who is ignored：(when it comes to acknowledging：(the discovery of the Higgs boson)))).\n\nThe Nobels were：(of course) → themselves set up：(by a very rich individual：(who had decided：(what he wanted to do：(with his own money)))).\n\nTime：(rather than intention) → has given them legitimacy.\n\n**第5段**\n\nAs much as some scientists → may complain：(about the new awards) → two things seem clear.\n\nFirst → most researchers → would accept such a prize：(if they were offered one).\n\nSecond → it is surely a good thing：(that the money and attention → come to science → rather than go elsewhere).\n\nIt is fair → to criticize and question → the mechanism – (that is the culture of research：(after all)) – but it is the prize-givers' money：(to do with as they please).\n\nIt is wise → to take such gifts：(with gratitude and grace).","context":{"focus":null,"mode":"image","asset":"articleAnnotated","label":"全文句内逻辑"},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>The US$3-million Fundamental Physics Prize → is indeed an interesting experiment：(as Alexander Polyakov said：(when he accepted this year&#39;s award：(in March))).<\/p>\n<p>And it is far from → the only one of its type.<\/p>\n<p>As a News Feature article：(in Nature) discusses → a string of lucrative awards：(for researchers) → have joined the Nobel Prizes：(in recent years).<\/p>\n<p>Many：(like the Fundamental Physics Prize) → are funded：(from the telephone-number-sized bank accounts：(of Internet entrepreneurs)).<\/p>\n<p>These benefactors → have succeeded：(in their chosen fields) → they say + they want to use their wealth → to draw attention：(to those who have succeeded：(in science)).<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>What&#39;s not to like?<\/p>\n<p>Quite a lot → according to a handful of scientists：(quoted in the News Feature).<\/p>\n<p>You cannot buy class：(as the old saying goes) + these upstart entrepreneurs → cannot buy their prizes → the prestige of the Nobels.<\/p>\n<p>The new awards → are an exercise in self-promotion：(for those behind them) → say scientists.<\/p>\n<p>They could distort → the achievement-based system：(of peer-review-led research).<\/p>\n<p>They could cement → the status quo：(of peer-reviewed research).<\/p>\n<p>They do not fund → peer-reviewed research.<\/p>\n<p>They perpetuate → the myth of the lone genius.<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>The goals of the prize-givers → seem as scattered → as the criticism.<\/p>\n<p>Some want to shock + others to draw people：(into science) + or to better reward those：(who have made their careers：(in research)).<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>As Nature has pointed out before → there are some legitimate concerns：(about how science prizes – both new and old – are distributed).<\/p>\n<p>The Breakthrough Prize in Life Sciences：(launched this year) → takes an unrepresentative view：(of what the life sciences include).<\/p>\n<p>But the Nobel Foundation&#39;s limit：(of three recipients per prize：(each of whom must still be living)) → has long been outgrown：(by the collaborative nature：(of modern research)) – as will be demonstrated：(by the inevitable row：(over who is ignored：(when it comes to acknowledging：(the discovery of the Higgs boson)))).<\/p>\n<p>The Nobels were：(of course) → themselves set up：(by a very rich individual：(who had decided：(what he wanted to do：(with his own money)))).<\/p>\n<p>Time：(rather than intention) → has given them legitimacy.<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>As much as some scientists → may complain：(about the new awards) → two things seem clear.<\/p>\n<p>First → most researchers → would accept such a prize：(if they were offered one).<\/p>\n<p>Second → it is surely a good thing：(that the money and attention → come to science → rather than go elsewhere).<\/p>\n<p>It is fair → to criticize and question → the mechanism – (that is the culture of research：(after all)) – but it is the prize-givers&#39; money：(to do with as they please).<\/p>\n<p>It is wise → to take such gifts：(with gratitude and grace).<\/p>\n"},{"title":"中文版句子逻辑（选修)","level":2,"section":"第二鸟 · 精读与翻译","raw":"## 中文版句子逻辑（选修)\n\n**第1段**\n\n这个300万美元的基础物理学奖 → 确实是一个有趣的实验：(正如亚历山大·波利亚科夫所说：(当他接受今年的奖项时：(在三月)))。\n\n而且它远不是 → 此类奖项中唯一的。\n\n正如一篇新闻特稿文章：(在《自然》杂志上)讨论 → 一系列丰厚的奖项：(为研究人员的) → 已经加入诺贝尔奖行列：(在最近几年)。\n\n许多：(像基础物理学奖一样) → 由...资助：(从电话号码般大小的银行账户：(互联网企业家的))。\n\n这些赞助人 → 已经成功：(在他们选择的领域) → 他们说 + 他们想要使用他们的财富 → 来吸引注意力：(对那些已经成功的人：(在科学领域))。\n\n**第2段**\n\n有什么不喜欢的呢？\n\n相当多 → 根据少数科学家：(在新闻特稿中被引用的)。\n\n你买不到品位：(正如老话所说) + 这些暴发户企业家 → 不能为他们的奖项买到 → 诺贝尔奖的声望。\n\n这些新奖项 → 是一种自我推销的行为：(对于背后的人来说) → 科学家们说。\n\n它们可能扭曲 → 基于成就的体系：(同行评议主导的研究)。\n\n它们可能巩固 → 现状：(同行评议研究的)。\n\n它们不资助 → 同行评议的研究。\n\n它们延续 → 孤独天才的神话。\n\n**第3段**\n\n奖项设立者的目标 → 看起来和...一样分散 → 和批评一样。\n\n一些人想要震撼 + 其他人想吸引人们：(进入科学) + 或者更好地奖励那些人：(已经在职业生涯中：(在研究领域))。\n\n**第4段**\n\n正如《自然》之前指出的 → 存在一些合理的担忧：(关于科学奖项如何 – 包括新的和旧的 – 被分配)。\n\n生命科学突破奖：(今年推出的) → 采取了一个不具代表性的观点：(关于生命科学包括什么)。\n\n但诺贝尔基金会的限制：(每个奖项三个获奖者：(每个人必须仍然在世)) → 早已被超越：(被合作性质：(现代研究的)) – 正如将被证明的：(通过不可避免的争议：(关于谁被忽视了：(当涉及到承认：(希格斯玻色子的发现))))。\n\n诺贝尔奖：(当然) → 本身就是建立的：(由一个非常富有的个人：(他已经决定了：(他想要做什么：(用他自己的钱))))。\n\n时间：(而不是意图) → 赋予了它们合法性。\n\n**第5段**\n\n尽管一些科学家 → 可能抱怨：(关于新奖项) → 两件事看起来很清楚。\n\n第一 → 大多数研究人员 → 会接受这样的奖项：(如果他们被提供一个)。\n\n第二 → 这肯定是件好事：(金钱和关注 → 来到科学领域 → 而不是去别处)。\n\n批评和质疑是公平的 → 机制 – (这是研究的文化：(毕竟)) – 但这是奖项设立者的钱：(按他们的意愿处理)。\n\n明智的做法是 → 接受这些礼物：(带着感激和优雅)。","context":{"focus":null,"mode":"image","asset":"articleAnnotated","label":"全文句内逻辑"},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>这个300万美元的基础物理学奖 → 确实是一个有趣的实验：(正如亚历山大·波利亚科夫所说：(当他接受今年的奖项时：(在三月)))。<\/p>\n<p>而且它远不是 → 此类奖项中唯一的。<\/p>\n<p>正如一篇新闻特稿文章：(在《自然》杂志上)讨论 → 一系列丰厚的奖项：(为研究人员的) → 已经加入诺贝尔奖行列：(在最近几年)。<\/p>\n<p>许多：(像基础物理学奖一样) → 由...资助：(从电话号码般大小的银行账户：(互联网企业家的))。<\/p>\n<p>这些赞助人 → 已经成功：(在他们选择的领域) → 他们说 + 他们想要使用他们的财富 → 来吸引注意力：(对那些已经成功的人：(在科学领域))。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>有什么不喜欢的呢？<\/p>\n<p>相当多 → 根据少数科学家：(在新闻特稿中被引用的)。<\/p>\n<p>你买不到品位：(正如老话所说) + 这些暴发户企业家 → 不能为他们的奖项买到 → 诺贝尔奖的声望。<\/p>\n<p>这些新奖项 → 是一种自我推销的行为：(对于背后的人来说) → 科学家们说。<\/p>\n<p>它们可能扭曲 → 基于成就的体系：(同行评议主导的研究)。<\/p>\n<p>它们可能巩固 → 现状：(同行评议研究的)。<\/p>\n<p>它们不资助 → 同行评议的研究。<\/p>\n<p>它们延续 → 孤独天才的神话。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>奖项设立者的目标 → 看起来和...一样分散 → 和批评一样。<\/p>\n<p>一些人想要震撼 + 其他人想吸引人们：(进入科学) + 或者更好地奖励那些人：(已经在职业生涯中：(在研究领域))。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>正如《自然》之前指出的 → 存在一些合理的担忧：(关于科学奖项如何 – 包括新的和旧的 – 被分配)。<\/p>\n<p>生命科学突破奖：(今年推出的) → 采取了一个不具代表性的观点：(关于生命科学包括什么)。<\/p>\n<p>但诺贝尔基金会的限制：(每个奖项三个获奖者：(每个人必须仍然在世)) → 早已被超越：(被合作性质：(现代研究的)) – 正如将被证明的：(通过不可避免的争议：(关于谁被忽视了：(当涉及到承认：(希格斯玻色子的发现))))。<\/p>\n<p>诺贝尔奖：(当然) → 本身就是建立的：(由一个非常富有的个人：(他已经决定了：(他想要做什么：(用他自己的钱))))。<\/p>\n<p>时间：(而不是意图) → 赋予了它们合法性。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>尽管一些科学家 → 可能抱怨：(关于新奖项) → 两件事看起来很清楚。<\/p>\n<p>第一 → 大多数研究人员 → 会接受这样的奖项：(如果他们被提供一个)。<\/p>\n<p>第二 → 这肯定是件好事：(金钱和关注 → 来到科学领域 → 而不是去别处)。<\/p>\n<p>批评和质疑是公平的 → 机制 – (这是研究的文化：(毕竟)) – 但这是奖项设立者的钱：(按他们的意愿处理)。<\/p>\n<p>明智的做法是 → 接受这些礼物：(带着感激和优雅)。<\/p>\n"},{"title":"长难句翻译练习（英一必修，英二选修)","level":2,"section":"第二鸟 · 精读与翻译","raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感，把应该放在一起的意群合并起来；\n4. 找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\n5. 对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。","context":{"focus":null,"mode":"image","asset":"articleAnnotated","label":"全文长难句翻译练习"},"meta":{},"html":"<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n"},{"title":"第1段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 原文\n\n> The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year's award in March.","context":{"focus":[98,139,827,194],"mode":"image","asset":"articleAnnotated","label":"第1段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-1"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-0","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文<\/h3>\n<blockquote>\n<p>The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year&#39;s award in March.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第1段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第一步：划分意群\n\n> The US$3-million Fundamental Physics Prize / is indeed an interesting experiment, / as Alexander Polyakov said / when he accepted this year's award / in March.","context":{"focus":[98,139,827,194],"mode":"image","asset":"articleAnnotated","label":"第1段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-1"},"meta":{"cumulative":true,"cumulativeGroup":"lo 愿处理。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把批评和质疑的对象接好：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<\/p>\n<\/blockquote>\n<p>将中间的解释合成一句：<\/p>\n<blockquote>\n<p>毕竟，这是研究文化的一部分<\/p>\n<\/blockquote>\n<p>后半句先说钱属于谁，再说钱怎么处理：<\/p>\n<blockquote>\n<p>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<br>毕竟，这是研究文化的一部分<br>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第4句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 可以批评机制，但设立者可以自行决定钱的用途。\n\n先承认批评合理，把研究文化作为简短解释插在中间，再用“但”转向资金所有者的决定空间。两边都要成立，不能只保留赞成奖项或只保留批评。\n\n按照中文语序调整后是：\n\n> 批评和质疑这种机制是公平的，毕竟这是研究的文化；但这笔钱是奖项设立者的钱，他们可以按照自己喜欢的方式处理。","context":{"focus":[99,3460,883,201],"mode":"image","asset":"articleAnnotated","label":"第5段第4句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-4","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>It is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers&#39; money / to do with as they please.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>批评和质疑是公平的 / 机制 – / 这是研究的文化，/ 毕竟 – / 但这是奖项设立者的钱 / 按他们的意愿处理。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把批评和质疑的对象接好：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<\/p>\n<\/blockquote>\n<p>将中间的解释合成一句：<\/p>\n<blockquote>\n<p>毕竟，这是研究文化的一部分<\/p>\n<\/blockquote>\n<p>后半句先说钱属于谁，再说钱怎么处理：<\/p>\n<blockquote>\n<p>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<br>毕竟，这是研究文化的一部分<br>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>可以批评机制，但设立者可以自行决定钱的用途。<\/p>\n<\/blockquote>\n<p>先承认批评合理，把研究文化作为简短解释插在中间，再用“但”转向资金所有者的决定空间。两边都要成立，不能只保留赞成奖项或只保留批评。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的，毕竟这是研究的文化；但这笔钱是奖项设立者的钱，他们可以按照自己喜欢的方式处理。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第4句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- 将“这是研究的文化”整理成“这是研究文化的一部分”，中文搭配更完整。\n- 把解释放在两道破折号之间，让“公平的——但……”的主线清楚。\n- “按照自己喜欢的方式”整理成“按自己的意愿”，并用“有权”表达所有者的处置权限。\n\n参考译文：\n\n> 批评和质疑这种机制是公平的——毕竟这是研究文化的一部分——但这是奖项设立者的钱，他们有权按自己的意愿处理。","context":{"focus":[99,3460,883,201],"mode":"image","asset":"articleAnnotated","label":"第5段第4句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":true},"focusId":"focus-long-6-5","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>It is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers&#39; money / to do with as they please.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>批评和质疑是公平的 / 机制 – / 这是研究的文化，/ 毕竟 – / 但这是奖项设立者的钱 / 按他们的意愿处理。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把批评和质疑的对象接好：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<\/p>\n<\/blockquote>\n<p>将中间的解释合成一句：<\/p>\n<blockquote>\n<p>毕竟，这是研究文化的一部分<\/p>\n<\/blockquote>\n<p>后半句先说钱属于谁，再说钱怎么处理：<\/p>\n<blockquote>\n<p>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<br>毕竟，这是研究文化的一部分<br>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>可以批评机制，但设立者可以自行决定钱的用途。<\/p>\n<\/blockquote>\n<p>先承认批评合理，把研究文化作为简短解释插在中间，再用“但”转向资金所有者的决定空间。两边都要成立，不能只保留赞成奖项或只保留批评。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的，毕竟这是研究的文化；但这笔钱是奖项设立者的钱，他们可以按照自己喜欢的方式处理。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>将“这是研究的文化”整理成“这是研究文化的一部分”，中文搭配更完整。<\/li>\n<li>把解释放在两道破折号之间，让“公平的——但……”的主线清楚。<\/li>\n<li>“按照自己喜欢的方式”整理成“按自己的意愿”，并用“有权”表达所有者的处置权限。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的——毕竟这是研究文化的一部分——但这是奖项设立者的钱，他们有权按自己的意愿处理。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1631,"sourceH":2542},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n**The author believes that the new awards are ______.**\n\n作者认为这些新奖项______。\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **harmful to the culture of research**\n\n有害于研究文化\n\nB. **acceptable despite the criticism**\n\n尽管受到批评，仍然可以接受\n\nC. **subject to undesirable changes**\n\n容易发生不良变化\n\nD. **unworthy of public attention**\n\n不值得公众关注\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍基础物理学奖和其他高额科学奖，说明它们多由互联网企业家出资并想让科学成功者得到关注 | 先说一个新出现的对象 |\n| 2 | 集中列出科学家的批评：缺少诺贝尔声望、服务出资者宣传、可能扭曲同行评审并强化孤独天才神话 | 再说一批反对意见 |\n| 3 | 说明颁奖者的目标并不统一，有人想制造震动、吸引人进入科学或更好奖励研究者 | 接着补充参与者各有目的 |\n| 4 | 承认新旧科学奖分配都有问题，并用合作研究、希格斯玻色子和诺贝尔奖的历史合法性作比较 | 然后放到更大背景中比较 |\n| 5 | 认为批评机制是合理的，但金钱与关注流向科学是好事，研究者也会接受，因此应有礼地接受 | 最后说仍可接受这个对象 |\n\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[4,2117,1171,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"question","question":35},"level":2,"html":"<p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>作者认为这些新奖项______。<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>harmful to the culture of research<\/strong><\/p>\n<p>有害于研究文化<\/p>\n<p>B. <strong>acceptable despite the criticism<\/strong><\/p>\n<p>尽管受到批评，仍然可以接受<\/p>\n<p>C. <strong>subject to undesirable changes<\/strong><\/p>\n<p>容易发生不良变化<\/p>\n<p>D. <strong>unworthy of public attention<\/strong><\/p>\n<p>不值得公众关注<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍基础物理学奖和其他高额科学奖，说明它们多由互联网企业家出资并想让科学成功者得到关注<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>集中列出科学家的批评：缺少诺贝尔声望、服务出资者宣传、可能扭曲同行评审并强化孤独天才神话<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明颁奖者的目标并不统一，有人想制造震动、吸引人进入科学或更好奖励研究者<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>承认新旧科学奖分配都有问题，并用合作研究、希格斯玻色子和诺贝尔奖的历史合法性作比较<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>认为批评机制是合理的，但金钱与关注流向科学是好事，研究者也会接受，因此应有礼地接受<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n"},{"title":"A. harmful to the culture of research","raw":"**The author believes that the new awards are ______.**\n\n### A. harmful to the culture of research\n\n有害于研究文化","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 A选项","focus":[83,2209,761,51],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":35,"option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q35-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>有害于研究文化<\/p>\n<\/section>"},{"title":"A. harmful to the culture of research","raw":"#### 如果 A 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是：\n\n有害于研究文化\n\n那文章五段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍一种由富豪出资的新科学奖项，它将个人财富带进原本依靠同行评价的科研奖励领域，引出对研究文化的影响。 | 先说一个新出现的对象 |\n| 2 | 列出批评者对新奖的反对意见：出资者追求自我宣传、独立评价受到挤压、集体合作被个人英雄叙事掩盖，这些意见共同指向研究文化受损。 | 再说一批反对意见 |\n| 3 | 说明出资者追求个人影响、获奖者追求奖金、研究共同体维护专业评价，各方目的不同，怎样使奖项的运行偏离共同的研究规范。 | 接着补充参与者各有目的 |\n| 4 | 把这种新奖与其他私人资助方式比较，说明接受私人资源时将个人名望置于专业规则之上，会在不同制度中造成同一种文化伤害。 | 然后放到更大背景中比较 |\n| 5 | 在继续承认新奖伤害研究文化的前提下，说明科研资源的现实需要使研究者仍可接受它，但这种实际接受不等于取消对其文化后果的负面判断。 | 最后说仍可接受这个对象 |\n\nA说的是新奖项对研究文化造成伤害，不能把它直接缩成“有人批评新奖”。按照这条假想路线，作者即使最后容许接受，也应始终把文化伤害当作自己的中心判断，并交代为何要承受这一代价。实际第2段把相关意见交给批评者，第3段展开不同的设奖目标，第4段把问题扩展到新旧奖项，而不是为“新奖整体有害”集中举证。第5段还把批评和质疑机制称为研究文化的一部分，随后肯定资源流向科学，建议感激地接受。因此，文章承认可以批评机制，却没有把A的负面判断作为全文立场。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 A选项","focus":[83,2209,761,51],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":35,"option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q35-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>有害于研究文化<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-A-1\"><h3>如果 A 是主旨，文章五段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>有害于研究文化<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍一种由富豪出资的新科学奖项，它将个人财富带进原本依靠同行评价的科研奖励领域，引出对研究文化的影响。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出批评者对新奖的反对意见：出资者追求自我宣传、独立评价受到挤压、集体合作被个人英雄叙事掩盖，这些意见共同指向研究文化受损。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明出资者追求个人影响、获奖者追求奖金、研究共同体维护专业评价，各方目的不同，怎样使奖项的运行偏离共同的研究规范。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把这种新奖与其他私人资助方式比较，说明接受私人资源时将个人名望置于专业规则之上，会在不同制度中造成同一种文化伤害。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>在继续承认新奖伤害研究文化的前提下，说明科研资源的现实需要使研究者仍可接受它，但这种实际接受不等于取消对其文化后果的负面判断。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A说的是新奖项对研究文化造成伤害，不能把它直接缩成“有人批评新奖”。按照这条假想路线，作者即使最后容许接受，也应始终把文化伤害当作自己的中心判断，并交代为何要承受这一代价。实际第2段把相关意见交给批评者，第3段展开不同的设奖目标，第4段把问题扩展到新旧奖项，而不是为“新奖整体有害”集中举证。第5段还把批评和质疑机制称为研究文化的一部分，随后肯定资源流向科学，建议感激地接受。因此，文章承认可以批评机制，却没有把A的负面判断作为全文立场。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<\/section>"},{"title":"B. acceptable despite the criticism","raw":"**The author believes that the new awards are ______.**\n\n### B. acceptable despite the criticism\n\n尽管受到批评，仍然可以接受","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 B选项","focus":[83,2297,709,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":35,"option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q35-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>尽管受到批评，仍然可以接受<\/p>\n<\/section>"},{"title":"B. acceptable despite the criticism","raw":"#### 如果 B 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是：\n\n尽管受到批评，仍然可以接受\n\n那文章五段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍新近出现的高额科学奖及企业家出资的背景，明确接下来要评价的是这些进入科学领域的新奖励。 | 先说一个新出现的对象 |\n| 2 | 列出对新奖的反对意见，包括声望不足、出资者自我宣传及对科研评价的影响，使“尽管受到批评”有具体内容。 | 再说一批反对意见 |\n| 3 | 说明设奖者分别追求震动效应、吸引人从事科学和奖励研究生涯，不能把不同目的都归结为一种不值得接受的动机。 | 接着补充参与者各有目的 |\n| 4 | 把新奖与诺贝尔奖放在共同的分配问题和私人设奖历史中比较，说明机制并非完美以及初衷受质疑，都不必然取消奖项的可接受性。 | 然后放到更大背景中比较 |\n| 5 | 承认质疑机制是合理的，同时指出研究者愿意接受、金钱和关注流向科学有益，据此得出受到批评的新奖仍然可以接受。 | 最后说仍可接受这个对象 |\n\nB保留了两个同时存在的判断：批评可以成立，奖项仍可接受。第2段没有被省略，第3段说明目标各异，第4段承认新旧奖项都有问题，并用诺贝尔奖随时间获得认可补充比较。最后一段的两点理由分别是研究者会接受奖项，以及科学能够获得金钱和关注；随后又明确认可质疑机制。这些段落共同推进到“可以批评，也可以接受”，与B的让步关系一致。\n\n判断：\n\n**B 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 B选项","focus":[83,2297,709,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":35,"option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q35-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>尽管受到批评，仍然可以接受<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-B-1\"><h3>如果 B 是主旨，文章五段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>尽管受到批评，仍然可以接受<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍新近出现的高额科学奖及企业家出资的背景，明确接下来要评价的是这些进入科学领域的新奖励。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出对新奖的反对意见，包括声望不足、出资者自我宣传及对科研评价的影响，使“尽管受到批评”有具体内容。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明设奖者分别追求震动效应、吸引人从事科学和奖励研究生涯，不能把不同目的都归结为一种不值得接受的动机。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把新奖与诺贝尔奖放在共同的分配问题和私人设奖历史中比较，说明机制并非完美以及初衷受质疑，都不必然取消奖项的可接受性。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认质疑机制是合理的，同时指出研究者愿意接受、金钱和关注流向科学有益，据此得出受到批评的新奖仍然可以接受。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>B保留了两个同时存在的判断：批评可以成立，奖项仍可接受。第2段没有被省略，第3段说明目标各异，第4段承认新旧奖项都有问题，并用诺贝尔奖随时间获得认可补充比较。最后一段的两点理由分别是研究者会接受奖项，以及科学能够获得金钱和关注；随后又明确认可质疑机制。这些段落共同推进到“可以批评，也可以接受”，与B的让步关系一致。<\/p>\n<p>判断：<\/p>\n<p><strong>B 保留。<\/strong><\/p>\n<\/section>"},{"title":"C. subject to undesirable changes","raw":"**The author believes that the new awards are ______.**\n\n### C. subject to undesirable changes\n\n容易发生不良变化","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 C选项","focus":[83,2385,689,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":35,"option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q35-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>容易发生不良变化<\/p>\n<\/section>"},{"title":"C. subject to undesirable changes","raw":"#### 如果 C 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是：\n\n容易发生不良变化\n\n那文章五段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍刚进入科研奖励领域的新奖项及其尚未稳定的运行方式，把奖项会怎样变化作为后续评价的对象。 | 先说一个新出现的对象 |\n| 2 | 列出反对者对变化方向的质疑：奖励标准逐步偏离科研贡献、资助用途渐被宣传需求支配，说明所担心的是奖项发生不良变化。 | 再说一批反对意见 |\n| 3 | 说明出资者扩大影响、获奖者争取利益和科研共同体维护标准这些不同目的，怎样推动新奖的规则向不良方向变化。 | 接着补充参与者各有目的 |\n| 4 | 比较不同科学奖项从创立到成熟的制度演变，指出缺乏稳定约束时，新奖同样容易经历标准和用途的恶化。 | 然后放到更大背景中比较 |\n| 5 | 承认新奖仍容易发生不良变化，但说明在持续限制这种变化的条件下，其科研资源价值仍使它可以被接受。 | 最后说仍可接受这个对象 |\n\nC不仅是“有问题”，还提出了奖项容易发生不良变化这一判断，所以假想文章必须交代变化前后、推动变化的力量及不良方向。实际第2段主要呈现对现有机制的批评，第3段讨论不同目标，第4段比较新旧奖项如何分配，并没有追踪新奖从一种状态变成另一种状态。段末提到时间，也是为了说明诺贝尔奖已经获得认可，不是在预测新奖会恶化。结尾接受新奖的理由是资源和关注流向科学，而不是在提出防止不良变化的条件之后才允许接受。C增添了全文没有建立的变化主线。\n\n判断：\n\n**C 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 C选项","focus":[83,2385,689,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":35,"option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q35-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>容易发生不良变化<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-C-1\"><h3>如果 C 是主旨，文章五段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>容易发生不良变化<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍刚进入科研奖励领域的新奖项及其尚未稳定的运行方式，把奖项会怎样变化作为后续评价的对象。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出反对者对变化方向的质疑：奖励标准逐步偏离科研贡献、资助用途渐被宣传需求支配，说明所担心的是奖项发生不良变化。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明出资者扩大影响、获奖者争取利益和科研共同体维护标准这些不同目的，怎样推动新奖的规则向不良方向变化。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>比较不同科学奖项从创立到成熟的制度演变，指出缺乏稳定约束时，新奖同样容易经历标准和用途的恶化。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认新奖仍容易发生不良变化，但说明在持续限制这种变化的条件下，其科研资源价值仍使它可以被接受。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>C不仅是“有问题”，还提出了奖项容易发生不良变化这一判断，所以假想文章必须交代变化前后、推动变化的力量及不良方向。实际第2段主要呈现对现有机制的批评，第3段讨论不同目标，第4段比较新旧奖项如何分配，并没有追踪新奖从一种状态变成另一种状态。段末提到时间，也是为了说明诺贝尔奖已经获得认可，不是在预测新奖会恶化。结尾接受新奖的理由是资源和关注流向科学，而不是在提出防止不良变化的条件之后才允许接受。C增添了全文没有建立的变化主线。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<\/section>"},{"title":"D. unworthy of public attention","raw":"**The author believes that the new awards are ______.**\n\n### D. unworthy of public attention\n\n不值得公众关注","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 D选项","focus":[83,2473,654,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":35,"option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q35-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>不值得公众关注<\/p>\n<\/section>"},{"title":"D. unworthy of public attention","raw":"#### 如果 D 是主旨，文章五段应该怎么写？\n\n如果全文主旨真的是：\n\n不值得公众关注\n\n那文章五段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍新出现并得到媒体报道的高额科学奖，引出公众是否值得为这些奖项投入注意力的问题。 | 先说一个新出现的对象 |\n| 2 | 列出反对者对公众关注新奖的批评：报道集中于奖金和富豪形象，难以增进公众对科学工作的理解。 | 再说一批反对意见 |\n| 3 | 说明出资者想得到曝光、研究者想得到支持、公众希望了解科学，各自目的并不相同，奖项宣传不能满足公众了解科学的需要。 | 接着补充参与者各有目的 |\n| 4 | 将围绕奖项和个人的宣传与直接介绍研究过程的科学传播比较，说明公众注意力用于后者更有价值。 | 然后放到更大背景中比较 |\n| 5 | 说明研究者仍可接受私人提供的奖励，但私人收下资助不使奖项成为值得公众关注的对象，最终保留对公众传播价值的否定。 | 最后说仍可接受这个对象 |\n\nD判断的是公众关注新奖有没有价值，不等于研究者能不能私下收下奖金。即使按这一区分构造出最后仍接受奖励的文章，前面也应持续比较宣传与科学传播的价值。实际第1段把让科学成功者受到关注列为设奖目的，末段又将`money and attention`并列，肯定两者流向科学。作者没有要求研究者收钱的同时排斥公众关注，而是把科学得到关注作为接受新奖的一项理由。D的否定方向与这一收束相反。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 D选项","focus":[83,2473,654,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":35,"option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q35-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>不值得公众关注<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-D-1\"><h3>如果 D 是主旨，文章五段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>不值得公众关注<\/p>\n<p>那文章五段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>介绍新出现并得到媒体报道的高额科学奖，引出公众是否值得为这些奖项投入注意力的问题。<\/td>\n<td>先说一个新出现的对象<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>列出反对者对公众关注新奖的批评：报道集中于奖金和富豪形象，难以增进公众对科学工作的理解。<\/td>\n<td>再说一批反对意见<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>说明出资者想得到曝光、研究者想得到支持、公众希望了解科学，各自目的并不相同，奖项宣传不能满足公众了解科学的需要。<\/td>\n<td>接着补充参与者各有目的<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>将围绕奖项和个人的宣传与直接介绍研究过程的科学传播比较，说明公众注意力用于后者更有价值。<\/td>\n<td>然后放到更大背景中比较<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>说明研究者仍可接受私人提供的奖励，但私人收下资助不使奖项成为值得公众关注的对象，最终保留对公众传播价值的否定。<\/td>\n<td>最后说仍可接受这个对象<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>D判断的是公众关注新奖有没有价值，不等于研究者能不能私下收下奖金。即使按这一区分构造出最后仍接受奖励的文章，前面也应持续比较宣传与科学传播的价值。实际第1段把让科学成功者受到关注列为设奖目的，末段又将<code>money and attention<\/code>并列，肯定两者流向科学。作者没有要求研究者收钱的同时排斥公众关注，而是把科学得到关注作为接受新奖的一项理由。D的否定方向与这一收束相反。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<\/section>"},{"title":"35题结论","raw":"### 35题结论\n\n**35. B. acceptable despite the criticism**\n\n这句话就是本文后续做题的主旨底牌：\n\n**acceptable despite the criticism / 尽管受到批评，仍然可以接受**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[4,2117,1171,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"conclusion","question":35},"level":3,"html":"<p><strong>35. B. acceptable despite the criticism<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>acceptable despite the criticism / 尽管受到批评，仍然可以接受<\/strong><\/p>\n"},{"title":"31题 · 题干、题型与核心出处","raw":"## 31题\n\n> The Fundamental Physics Prize is seen as ______.  \n> 基础物理学奖被视为什么？\n\n### 题型\n\n这是一道具体细节题，问基础物理学奖被看作什么性质的奖项。题干给出奖名，先回到第1段的同名对象，再结合这一段对整类新奖的介绍作答。\n\n### 核心出处\n\n> The US $3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March.\n>\n> As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.\n>\n> Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.\n>\n> These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.\n\n第一句给出三百万美元的金额，第三句把基础物理学奖所在的这一类奖称为给研究人员的丰厚奖励，后两句说明企业家的出资来源及吸引人们关注科学成功者的目的。题干问奖项性质，不能把资金来源改成奖项定义，也不能仅凭新旧奖出现在同一句就推断替代关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[4,4,1120,421],"sourceW":1631,"sourceH":2542},"meta":{"kind":"question","question":31},"level":2,"html":"<blockquote>\n<p>The Fundamental Physics Prize is seen as ______.<br>基础物理学奖被视为什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道具体细节题，问基础物理学奖被看作什么性质的奖项。题干给出奖名，先回到第1段的同名对象，再结合这一段对整类新奖的介绍作答。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>The US $3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March.<\/p>\n<p>As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.<\/p>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<p>第一句给出三百万美元的金额，第三句把基础物理学奖所在的这一类奖称为给研究人员的丰厚奖励，后两句说明企业家的出资来源及吸引人们关注科学成功者的目的。题干问奖项性质，不能把资金来源改成奖项定义，也不能仅凭新旧奖出现在同一句就推断替代关系。<\/p>\n"},{"title":"A. a symbol of the entrepreneurs’ wealth","raw":"### A. a symbol of the entrepreneurs’ wealth\n\n> 企业家财富的象征\n\n**做题模式中的状态：** 当时读到了`funded from`、`bank accounts`和`Internet entrepreneurs`，认为它们只交代资金来源，不能把奖项定义为财富象征，第一轮就排除了A，后面没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用企业家的巨额账户，把“由这些财富资助”改成“象征这些财富”。出资者有钱是设奖的背景，奖项被如何看待是另一条关系。\n\n**出处：**\n\n> Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.\n>\n> These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[83,95,847,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"option","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q31-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>企业家财富的象征<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到了<code>funded from<\/code>、<code>bank accounts<\/code>和<code>Internet entrepreneurs<\/code>，认为它们只交代资金来源，不能把奖项定义为财富象征，第一轮就排除了A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用企业家的巨额账户，把“由这些财富资助”改成“象征这些财富”。出资者有钱是设奖的背景，奖项被如何看待是另一条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. a symbol of the entrepreneurs’ wealth","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 基础物理学奖被视为企业家财富的象征。\n\nA中的`entrepreneurs’ wealth`对应第1段的企业家账户和使用财富的表述，因此要比较`funded from`与`a symbol of`各自在说什么。\n\n第一处说奖项的钱来自互联网企业家；下一句继续交代这些赞助人的自述目的，是让在科学上取得成功的人获得关注。财富在这里承担资金来源的角色，科学成功者才是他们想要引起关注的对象。\n\nA却用`symbol`给奖项本身下定义，把“出资靠什么”换成“奖项代表什么”。金额巨大可以使人联想到炫耀财富，但这仍不是第1段给出的身份判断。\n\n因此，A利用相同的出资者和财富信息，补上了从资助关系到财富象征的变化，不能作为这项奖的性质概括。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[83,95,847,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q31-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>企业家财富的象征<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到了<code>funded from<\/code>、<code>bank accounts<\/code>和<code>Internet entrepreneurs<\/code>，认为它们只交代资金来源，不能把奖项定义为财富象征，第一轮就排除了A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用企业家的巨额账户，把“由这些财富资助”改成“象征这些财富”。出资者有钱是设奖的背景，奖项被如何看待是另一条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.<\/p>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>基础物理学奖被视为企业家财富的象征。<\/p>\n<\/blockquote>\n<p>A中的<code>entrepreneurs’ wealth<\/code>对应第1段的企业家账户和使用财富的表述，因此要比较<code>funded from<\/code>与<code>a symbol of<\/code>各自在说什么。<\/p>\n<p>第一处说奖项的钱来自互联网企业家；下一句继续交代这些赞助人的自述目的，是让在科学上取得成功的人获得关注。财富在这里承担资金来源的角色，科学成功者才是他们想要引起关注的对象。<\/p>\n<p>A却用<code>symbol<\/code>给奖项本身下定义，把“出资靠什么”换成“奖项代表什么”。金额巨大可以使人联想到炫耀财富，但这仍不是第1段给出的身份判断。<\/p>\n<p>因此，A利用相同的出资者和财富信息，补上了从资助关系到财富象征的变化，不能作为这项奖的性质概括。<\/p>\n<\/section>"},{"title":"A. a symbol of the entrepreneurs’ wealth","raw":"#### 写作视角法\n\n原文相关部分是这样写的：\n\n> These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.\n>\n> 赞助人说自己要用财富吸引人们关注科学领域的成功者。\n\n介绍账户之后，作者顺着出资目的转向科学家，关注点没有停在富豪财力的展示上。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The Fundamental Physics Prize is regarded as a symbol of its founders’ wealth, drawing attention to how rich they are.\n>\n> 基础物理学奖被视为设立者财富的象征，吸引人们注意他们多么富有。\n\n假设写法需要把奖项所引起的注意落在企业家的富有程度上；实际下一句把注意力落在科学成就者身上。二者都有财富，但财富在文章中的作用不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[83,95,847,61],"sourceW":1631,"sourceH":2542},"meta":{"kind":"method","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q31-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>企业家财富的象征<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时读到了<code>funded from<\/code>、<code>bank accounts<\/code>和<code>Internet entrepreneurs<\/code>，认为它们只交代资金来源，不能把奖项定义为财富象征，第一轮就排除了A，后面没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用企业家的巨额账户，把“由这些财富资助”改成“象征这些财富”。出资者有钱是设奖的背景，奖项被如何看待是另一条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>
