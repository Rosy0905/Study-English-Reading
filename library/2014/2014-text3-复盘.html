ew awards, two things seem clear.<\/p>\n<p>文章回顾旧奖由富人设立、随时间获得认可，接着回到虽有科学家抱怨但新奖仍可接受的问题。<\/p>\n<\/blockquote>\n<p>诺贝尔奖的经历让比较落在奖项如何被看待上，为结尾不因争议就拒绝新奖作铺垫。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Nobels have earned due recognition through their long existence, rather than through their founder’s intentions alone.<\/p>\n<p>诺贝尔奖通过长期存在获得了应有认可，而不是仅凭设立者的初衷。<\/p>\n<\/blockquote>\n<p>D要求的时间与认可关系在原文已经具备。用这种历史评价回到新奖的接受问题，也与实际从第4段向第5段的推进相接，没有把认可扩成毫无缺陷。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>acceptable despite the criticism<br>尽管受到批评，仍然可以接受<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认新奖受到批评仍可接受，不能直接判断诺贝尔奖历史上是否遭到怀疑、代表性最高与否，或其认可究竟从何而来。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>Their endurance has done justice to them.<br>它们经受时间后获得了应有的认可。<\/p>\n<\/blockquote>\n<p>本项最终仍要根据“Time, rather than intention, has given them legitimacy”确定。D使旧奖的长期认可成为比较依据，与作者不因批评就拒绝新奖的总体态度相容；具体的时间因果来自段末这句话。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. D. Their endurance has done justice to them.**\n\nA把长期认可扩大为从未有怀疑，忽略同段对旧奖的具体质疑。\n\nB由声望和认可补出代表性最高的比较，段落没有作这种排名。\n\nC把时间已经赋予认可改成正当性长期处于争议。\n\nD以长期存在和应有认可，准确改写时间赋予正当性的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[4,1588,1577,422],"sourceW":1631,"sourceH":2542},"meta":{"kind":"conclusion","question":34},"level":3,"html":"<blockquote>\n<p><strong>34. D. Their endurance has done justice to them.<\/strong><\/p>\n<\/blockquote>\n<p>A把长期认可扩大为从未有怀疑，忽略同段对旧奖的具体质疑。<\/p>\n<p>B由声望和认可补出代表性最高的比较，段落没有作这种排名。<\/p>\n<p>C把时间已经赋予认可改成正当性长期处于争议。<\/p>\n<p>D以长期存在和应有认可，准确改写时间赋予正当性的关系。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：新科学奖项的兴起**（段落1背景介绍） 基础物理学奖（300万美元）→ 并非唯一：近年来一系列丰厚奖项加入诺贝尔奖行列 → 资金来源：互联网企业家的巨额财富 → 动机：成功人士想用财富吸引关注科学领域的成功者\n\n↓（批评声音）\n\n**逻辑层次2：对新奖项的批评**（段落2批评观点） 核心批评：【\"买不到品位\"：暴发户企业家买不到诺贝尔奖的声望】→ 具体批评：（1.自我推销行为 + 2.扭曲基于成就的同行评议体系 + 3.巩固现状 + 4.不资助同行评议研究 + 5.延续孤独天才神话）\n\n→（目标分析）\n\n**逻辑层次3：奖项设立者的多样目标**（段落3目标说明） 目标分散如批评：（震撼 + 吸引人进入科学 + 更好奖励研究者）\n\n↓（理性分析）\n\n**逻辑层次4：新旧奖项都存在问题**（段落4问题剖析） 合理担忧：【新奖项问题：（生命科学突破奖视角不具代表性）// 诺贝尔奖问题：（限制3人且须在世，不适应现代合作研究）→ 希格斯玻色子发现将引发争议】→ 历史视角：诺贝尔奖也是富人设立 → 时间赋予合法性\n\n↓（理性结论）\n\n**逻辑层次5：应以感激接受新奖项**（段落5作者观点） 两个清楚事实：（1.大多数研究人员会接受奖项 + 2.资金流向科学是好事）→ 平衡观点：【批评机制是研究文化 // 但这是设立者的钱】→ 结论：应以感激和优雅接受\n\n↑（全文主旨）\n\n全文核心观点：尽管新科学奖项受到诸多批评（缺乏声望、自我推销、可能扭曲研究体系），但考虑到资金流向科学领域的积极意义，以及这是奖项设立者的自由选择，科学界应该以感激和优雅的态度接受这些奖项。\n\n## 小标题题\n\n### 题目\n\n**Directions:**\n\nRead the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\n\n**A. Different Motives for Rewarding Scientists**\n\n**B. Why Scientists Should Refuse Private Prizes**\n\n**C. Private Wealth Brings Glamour to Science**\n\n**D. A Qualified Welcome for Money and Attention**\n\n**E. Old and New Prizes under the Same Scrutiny**\n\n**F. Criticism of Prestige, Promotion and Research Effects**\n\n**G. The Nobel Rules as a Model for All Awards**\n\n## New Prizes and the Rewards of Science\n\n### 41. __________\n\nAn Oscars-style ceremony and enormous cash awards are bringing a little Hollywood glamour to physics. Alexander Polyakov called the US$3-million Fundamental Physics Prize an interesting experiment when he accepted it. Nor is it alone: a string of lucrative research awards has recently joined the Nobel Prizes. Many are financed by Internet entrepreneurs with enormous fortunes. Having succeeded in their own fields, these benefactors say they want to use their wealth to attract attention to people who have succeeded in science.\n\n### 42. __________\n\nNot all scientists welcome the new awards. Critics argue that money cannot purchase the prestige accumulated by the Nobels and that some prizes are exercises in self-promotion for their founders. Other objections concern research itself: prizes might distort the meritocracy of peer review, reinforce the existing order or fail to support peer-reviewed work. By celebrating exceptional individuals, they may also perpetuate the myth of the lone genius. The objections therefore extend from the reputation of the awards and their founders to their possible influence on scientific work.\n\n### 43. __________\n\nThe prize-givers' ambitions are no more uniform than the criticism directed at them. Some want to shock the public, some to attract people into science, and others to reward researchers more generously for their careers. Several want to demonstrate that leading scientists can enjoy the lifestyles of financiers and footballers. A large cash award may thus serve publicity, recruitment, recognition or an image of material success. These aims differ even when the outward form of the reward looks similar.\n\n### 44. __________\n\nThere are legitimate questions about how both new and established prizes recognize achievement. The new Breakthrough Prize in Life Sciences takes an unrepresentative view of the subjects it covers. Yet the Nobel Foundation's rule limiting each award to three living recipients has also been overtaken by the collaborative nature of modern research, a problem likely to surface in disputes over recognition for the Higgs boson. Moreover, the Nobels themselves began with a wealthy individual's decisions about his own money. Their legitimacy developed with time, rather than following automatically from a nobler original intention.\n\n### 45. __________\n\nDespite the complaints about large financial rewards and the goals behind them, two considerations remain clear. Most researchers would accept such a prize if offered one, and money and attention reaching science are preferable to their going elsewhere. Questioning the mechanism is entirely consistent with research culture, but the funds also belong to the people who choose to give them. Scientists can therefore scrutinize the arrangements without rejecting the gift. A response combining gratitude with critical judgment is wiser than treating imperfections as a reason to turn support away.","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{"kind":"standard"},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：新科学奖项的兴起<\/strong>（段落1背景介绍） 基础物理学奖（300万美元）→ 并非唯一：近年来一系列丰厚奖项加入诺贝尔奖行列 → 资金来源：互联网企业家的巨额财富 → 动机：成功人士想用财富吸引关注科学领域的成功者<\/p>\n<p>↓（批评声音）<\/p>\n<p><strong>逻辑层次2：对新奖项的批评<\/strong>（段落2批评观点） 核心批评：【&quot;买不到品位&quot;：暴发户企业家买不到诺贝尔奖的声望】→ 具体批评：（1.自我推销行为 + 2.扭曲基于成就的同行评议体系 + 3.巩固现状 + 4.不资助同行评议研究 + 5.延续孤独天才神话）<\/p>\n<p>→（目标分析）<\/p>\n<p><strong>逻辑层次3：奖项设立者的多样目标<\/strong>（段落3目标说明） 目标分散如批评：（震撼 + 吸引人进入科学 + 更好奖励研究者）<\/p>\n<p>↓（理性分析）<\/p>\n<p><strong>逻辑层次4：新旧奖项都存在问题<\/strong>（段落4问题剖析） 合理担忧：【新奖项问题：（生命科学突破奖视角不具代表性）// 诺贝尔奖问题：（限制3人且须在世，不适应现代合作研究）→ 希格斯玻色子发现将引发争议】→ 历史视角：诺贝尔奖也是富人设立 → 时间赋予合法性<\/p>\n<p>↓（理性结论）<\/p>\n<p><strong>逻辑层次5：应以感激接受新奖项<\/strong>（段落5作者观点） 两个清楚事实：（1.大多数研究人员会接受奖项 + 2.资金流向科学是好事）→ 平衡观点：【批评机制是研究文化 // 但这是设立者的钱】→ 结论：应以感激和优雅接受<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：尽管新科学奖项受到诸多批评（缺乏声望、自我推销、可能扭曲研究体系），但考虑到资金流向科学领域的积极意义，以及这是奖项设立者的自由选择，科学界应该以感激和优雅的态度接受这些奖项。<\/p>\n"},{"title":"小标题41题","level":2,"section":"第四鸟 · 新题型","raw":"#### 41题\n\n【答案】C. Private Wealth Brings Glamour to Science\n\n> 私人财富为科学带来耀眼光环\n\n这一部分介绍新的科学奖项长什么样、钱从哪里来，以及出资者声称希望产生怎样的关注效果。\n\n开头的两个细节确立新现象：\n\n> An Oscars-style ceremony and enormous cash awards  \n> bringing a little Hollywood glamour to physics\n\n随后用基础物理学奖作实例，再扩大到一系列新奖项，最后交代资助者：\n\n> financed by Internet entrepreneurs with enormous fortunes\n\n推进链为：\n\n> 盛大典礼与巨额奖金 → 一个代表性奖项 → 同类奖项增多 → 私人企业家出资并希望吸引关注。\n\nC的`Private Wealth`对应企业家的财富，`Brings Glamour to Science`对应典礼、奖金和公众关注，覆盖了整段的现象与来源。\n\n最强干扰是A。本段末尾确实出现一个资助目的，但尚未比较不同出资者的多种目标；A要求的`Different Motives`在43部分才具体展开。用A会把来源和颁奖形式这些主体内容压成一个末尾细节。\n\n> **41. C**","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{"kind":"standard"},"html":"<h4>41题<\/h4>\n<p>【答案】C. Private Wealth Brings Glamour to Science<\/p>\n<blockquote>\n<p>私人财富为科学带来耀眼光环<\/p>\n<\/blockquote>\n<p>这一部分介绍新的科学奖项长什么样、钱从哪里来，以及出资者声称希望产生怎样的关注效果。<\/p>\n<p>开头的两个细节确立新现象：<\/p>\n<blockquote>\n<p>An Oscars-style ceremony and enormous cash awards<br>bringing a little Hollywood glamour to physics<\/p>\n<\/blockquote>\n<p>随后用基础物理学奖作实例，再扩大到一系列新奖项，最后交代资助者：<\/p>\n<blockquote>\n<p>financed by Internet entrepreneurs with enormous fortunes<\/p>\n<\/blockquote>\n<p>推进链为：<\/p>\n<blockquote>\n<p>盛大典礼与巨额奖金 → 一个代表性奖项 → 同类奖项增多 → 私人企业家出资并希望吸引关注。<\/p>\n<\/blockquote>\n<p>C的<code>Private Wealth<\/code>对应企业家的财富，<code>Brings Glamour to Science<\/code>对应典礼、奖金和公众关注，覆盖了整段的现象与来源。<\/p>\n<p>最强干扰是A。本段末尾确实出现一个资助目的，但尚未比较不同出资者的多种目标；A要求的<code>Different Motives<\/code>在43部分才具体展开。用A会把来源和颁奖形式这些主体内容压成一个末尾细节。<\/p>\n<blockquote>\n<p><strong>41. C<\/strong><\/p>\n<\/blockquote>\n"},{"title":"小标题42题","level":2,"section":"第四鸟 · 新题型","raw":"#### 42题\n\n【答案】F. Criticism of Prestige, Promotion and Research Effects\n\n> 对声望、自我宣传和科研影响的批评\n\n这一部分集中列举科学家对新奖项的反对意见，并把意见分成奖项声望、设奖者获益和科研机制几组。\n\n开头的`Not all scientists welcome`先提示立场变化；接下来的证据分别是：\n\n> money cannot purchase the prestige accumulated by the Nobels  \n> exercises in self-promotion for their founders  \n> distort the meritocracy of peer review\n\n之后还补充固化现状、未支持同行评议研究，以及延续“孤独天才”神话。结尾明确把这些不同对象重新合拢。\n\n> 质疑能否买来声望 → 质疑设奖者是否自我宣传 → 列出对科研评价与研究形象的担忧 → 归纳批评覆盖面。\n\nF中的三个并列部分依次对应这些内容，没有把全部批评缩成一种动机。\n\n最强干扰是B。列举批评不等于要求科学家拒绝奖金；本段并没有给出`should refuse`这样的行动结论。B把对机制的质疑推成拒收一切私人奖项，范围和判断强度都超出了这一部分。\n\n> **42. F**","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{"kind":"standard"},"html":"<h4>42题<\/h4>\n<p>【答案】F. Criticism of Prestige, Promotion and Research Effects<\/p>\n<blockquote>\n<p>对声望、自我宣传和科研影响的批评<\/p>\n<\/blockquote>\n<p>这一部分集中列举科学家对新奖项的反对意见，并把意见分成奖项声望、设奖者获益和科研机制几组。<\/p>\n<p>开头的<code>Not all scientists welcome<\/code>先提示立场变化；接下来的证据分别是：<\/p>\n<blockquote>\n<p>money cannot purchase the prestige accumulated by the Nobels<br>exercises in self-promotion for their founders<br>distort the meritocracy of peer review<\/p>\n<\/blockquote>\n<p>之后还补充固化现状、未支持同行评议研究，以及延续“孤独天才”神话。结尾明确把这些不同对象重新合拢。<\/p>\n<blockquote>\n<p>质疑能否买来声望 → 质疑设奖者是否自我宣传 → 列出对科研评价与研究形象的担忧 → 归纳批评覆盖面。<\/p>\n<\/blockquote>\n<p>F中的三个并列部分依次对应这些内容，没有把全部批评缩成一种动机。<\/p>\n<p>最强干扰是B。列举批评不等于要求科学家拒绝奖金；本段并没有给出<code>should refuse<\/code>这样的行动结论。B把对机制的质疑推成拒收一切私人奖项，范围和判断强度都超出了这一部分。<\/p>\n<blockquote>\n<p><strong>42. F<\/strong><\/p>\n<\/blockquote>\n"},{"title":"小标题43题","level":2,"section":"第四鸟 · 新题型","raw":"#### 43题\n\n【答案】A. Different Motives for Rewarding Scientists\n\n> 奖励科学家的不同动机\n\n这一部分由批评者转向奖项设立者，把看似相同的高额奖励拆成几种不同目标。\n\n开头直接指出：\n\n> The prize-givers' ambitions are no more uniform than the criticism directed at them.\n\n随后`Some ... some ... others ... Several ...`并列展示制造轰动、吸引人才、回报科研生涯和展示富裕生活。结尾再次提醒：\n\n> These aims differ even when the outward form of the reward looks similar.\n\n推进链为：\n\n> 指出目标不统一 → 逐一列出不同目标 → 归纳相似奖励形式背后的目的差异。\n\nA的`Different Motives`对应上述并列目标，`for Rewarding Scientists`限定这些差异都发生在科学奖项的设立动机上。\n\n最强干扰是C。让科学家像金融家、球星一样生活，确实与财富和光环有关，但它只是其中一种目标；招揽人才、承认长期贡献并不都等同于制造豪华形象。C会用一项动机代替整个比较。\n\n> **43. A**","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{"kind":"standard"},"html":"<h4>43题<\/h4>\n<p>【答案】A. Different Motives for Rewarding Scientists<\/p>\n<blockquote>\n<p>奖励科学家的不同动机<\/p>\n<\/blockquote>\n<p>这一部分由批评者转向奖项设立者，把看似相同的高额奖励拆成几种不同目标。<\/p>\n<p>开头直接指出：<\/p>\n<blockquote>\n<p>The prize-givers&#39; ambitions are no more uniform than the criticism directed at them.<\/p>\n<\/blockquote>\n<p>随后<code>Some ... some ... others ... Several ...<\/code>并列展示制造轰动、吸引人才、回报科研生涯和展示富裕生活。结尾再次提醒：<\/p>\n<blockquote>\n<p>These aims differ even when the outward form of the reward looks similar.<\/p>\n<\/blockquote>\n<p>推进链为：<\/p>\n<blockquote>\n<p>指出目标不统一 → 逐一列出不同目标 → 归纳相似奖励形式背后的目的差异。<\/p>\n<\/blockquote>\n<p>A的<code>Different Motives<\/code>对应上述并列目标，<code>for Rewarding Scientists<\/code>限定这些差异都发生在科学奖项的设立动机上。<\/p>\n<p>最强干扰是C。让科学家像金融家、球星一样生活，确实与财富和光环有关，但它只是其中一种目标；招揽人才、承认长期贡献并不都等同于制造豪华形象。C会用一项动机代替整个比较。<\/p>\n<blockquote>\n<p><strong>43. A<\/strong><\/p>\n<\/blockquote>\n"},{"title":"小标题44题","level":2,"section":"第四鸟 · 新题型","raw":"#### 44题\n\n【答案】E. Old and New Prizes under the Same Scrutiny\n\n> 用同样的审视标准看待新旧奖项\n\n这一部分承认新奖有问题，同时拿老奖的规则和历史检验“老奖天然更正当”的假定。\n\n开头先定下共同范围：\n\n> both new and established prizes\n\n随后先说新生命科学奖的学科代表性不足，再用`Yet`转向诺奖的三位在世获奖者限制。合作科研的发展使这一规则也会遗漏贡献者。\n\n末尾又补充：\n\n> the Nobels themselves began with a wealthy individual's decisions  \n> Their legitimacy developed with time\n\n推进链是：\n\n> 新旧奖都应接受检验 → 新奖存在代表性问题 → 老奖规则同样落后于科研实际 → 老奖也出自私人决定，其认可经历了时间积累。\n\nE的`Old and New`完整覆盖两类奖项，`Same Scrutiny`对应不以新旧身份自动判定合理与否的比较方式。\n\n最强干扰是G。文中明确说诺奖规则已被合作研究现实超越，并不是要所有奖项效仿；最后的历史认可也不能抹掉前面的制度局限。G把批评的对象改成了推广的样板。\n\n> **44. E**","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{"kind":"standard"},"html":"<h4>44题<\/h4>\n<p>【答案】E. Old and New Prizes under the Same Scrutiny<\/p>\n<blockquote>\n<p>用同样的审视标准看待新旧奖项<\/p>\n<\/blockquote>\n<p>这一部分承认新奖有问题，同时拿老奖的规则和历史检验“老奖天然更正当”的假定。<\/p>\n<p>开头先定下共同范围：<\/p>\n<blockquote>\n<p>both new and established prizes<\/p>\n<\/blockquote>\n<p>随后先说新生命科学奖的学科代表性不足，再用<code>Yet<\/code>转向诺奖的三位在世获奖者限制。合作科研的发展使这一规则也会遗漏贡献者。<\/p>\n<p>末尾又补充：<\/p>\n<blockquote>\n<p>the Nobels themselves began with a wealthy individual&#39;s decisions<br>Their legitimacy developed with time<\/p>\n<\/blockquote>\n<p>推进链是：<\/p>\n<blockquote>\n<p>新旧奖都应接受检验 → 新奖存在代表性问题 → 老奖规则同样落后于科研实际 → 老奖也出自私人决定，其认可经历了时间积累。<\/p>\n<\/blockquote>\n<p>E的<code>Old and New<\/code>完整覆盖两类奖项，<code>Same Scrutiny<\/code>对应不以新旧身份自动判定合理与否的比较方式。<\/p>\n<p>最强干扰是G。文中明确说诺奖规则已被合作研究现实超越，并不是要所有奖项效仿；最后的历史认可也不能抹掉前面的制度局限。G把批评的对象改成了推广的样板。<\/p>\n<blockquote>\n<p><strong>44. E<\/strong><\/p>\n<\/blockquote>\n"},{"title":"小标题45题","level":2,"section":"第四鸟 · 新题型","raw":"#### 45题\n\n【答案】D. A Qualified Welcome for Money and Attention\n\n> 有保留地欢迎资金与关注\n\n这一部分在承认争议之后给出作者最终建议：可以审视机制，也应承认资金和关注进入科学的价值。\n\n开头`Despite the complaints`接住前文质疑，随后列出两点：多数研究者会接受奖项，资金与关注流入科学总比流向别处好。\n\n关键的边界在这里：\n\n> Scientists can therefore scrutinize the arrangements without rejecting the gift.\n\n段尾把感激与批判判断放在一起，而没有要求放弃其中任何一项。\n\n> 承认抱怨 → 提出接受意愿和科研收益 → 保留质疑机制的权利 → 倡议带着判断力感谢支持。\n\nD的`Welcome`对应接受资助的总体倾向，`Qualified`对应仍然审视机制的保留，`Money and Attention`则准确限定作者肯定的具体收益。\n\n最强干扰是B。B要求拒绝私人奖项，本段却明确反对因不完美而把支持拒之门外。批评存在于接受之中，不能把批评抽出来改成相反的行动建议。\n\n> **45. D**","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{"kind":"standard"},"html":"<h4>45题<\/h4>\n<p>【答案】D. A Qualified Welcome for Money and Attention<\/p>\n<blockquote>\n<p>有保留地欢迎资金与关注<\/p>\n<\/blockquote>\n<p>这一部分在承认争议之后给出作者最终建议：可以审视机制，也应承认资金和关注进入科学的价值。<\/p>\n<p>开头<code>Despite the complaints<\/code>接住前文质疑，随后列出两点：多数研究者会接受奖项，资金与关注流入科学总比流向别处好。<\/p>\n<p>关键的边界在这里：<\/p>\n<blockquote>\n<p>Scientists can therefore scrutinize the arrangements without rejecting the gift.<\/p>\n<\/blockquote>\n<p>段尾把感激与批判判断放在一起，而没有要求放弃其中任何一项。<\/p>\n<blockquote>\n<p>承认抱怨 → 提出接受意愿和科研收益 → 保留质疑机制的权利 → 倡议带着判断力感谢支持。<\/p>\n<\/blockquote>\n<p>D的<code>Welcome<\/code>对应接受资助的总体倾向，<code>Qualified<\/code>对应仍然审视机制的保留，<code>Money and Attention<\/code>则准确限定作者肯定的具体收益。<\/p>\n<p>最强干扰是B。B要求拒绝私人奖项，本段却明确反对因不完美而把支持拒之门外。批评存在于接受之中，不能把批评抽出来改成相反的行动建议。<\/p>\n<blockquote>\n<p><strong>45. D<\/strong><\/p>\n<\/blockquote>\n"},{"title":"排序题 · 全局解析","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\n### 题目\n\n**Directions:**\n\nThe following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\n\n**A.** That experiment took concrete form in the US$3-million Fundamental Physics Prize accepted by Alexander Polyakov. It is only one of a string of lucrative research awards that have recently joined the Nobels. Many are funded by Internet entrepreneurs with enormous fortunes. These benefactors say they want to use success in their own fields to attract attention to success in science.\n\n**B.** Whatever their motives, prize-givers still face a legitimate question: how should scientific achievement be recognized? The newly launched Breakthrough Prize in Life Sciences takes an unrepresentative view of the subjects it covers. Yet established awards deserve scrutiny as well. A long history does not automatically make their rules suitable for the way research is now conducted.\n\n**C.** The younger prizes deserve a similarly measured response. Most researchers would accept such an award, and money and attention reaching science are preferable to their going elsewhere. Criticism of the mechanism remains a proper part of research culture, but the funds belong to those who choose to give them. It is wise to question the arrangements while accepting the gifts with gratitude and grace.\n\n**D.** An unusual experiment is bringing Hollywood glamour to physics: an Oscars-style ceremony combined with gigantic cash prizes. When a theoretical physicist known for work on quantum field and string theory draws attention to such an experiment, it deserves notice. This time, the experiment concerns how scientists are rewarded rather than a result produced in the laboratory.\n\n**E.** These objections about prestige, founders' self-promotion and research effects are varied. So are the prize-givers' goals. Some want to shock, others to attract people into science or better reward careers spent in research. Several want to show that leading scientists can live like financiers and footballers. Similar-looking cash awards can therefore serve very different ambitions.\n\n**F.** But critics see no guarantee that private wealth will bring scientific value. They argue that money cannot buy the prestige of the Nobels and that the awards may mainly promote their founders. Other complaints concern distorted peer review, a reinforced status quo, a failure to fund peer-reviewed work and the perpetuation of the lone-genius myth.\n\n**G.** The same established prizes also share the newcomers' private origin. The Nobels were set up by a wealthy individual who decided what he wanted to do with his own money. Their accepted position did not follow automatically from a superior intention. Time, rather than intention, gave them legitimacy; private origins alone cannot settle the merits of a prize.\n\n**H.** That problem of established rules failing to fit modern research is clear in the Nobel Foundation's limit of three recipients per prize, all of whom must still be living. Modern research is collaborative, and that restriction has long been outgrown. The expected dispute over who receives credit for discovering the Higgs boson highlights the risk that contributors will be left out. Even a celebrated award can therefore struggle to recognize collective achievement fairly.\n\n**41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____**\n\n## 排序题全局解析\n\n先明确八段各自承担的功能，再用前后的对象与论证关系确定位置：\n\n- A：落实“实验”的代表奖项，扩展到同类奖并交代企业家资助来源。\n- B：从多种设奖目标转到新旧奖共同面对的合理评价问题，先举新奖再引向老奖。\n- C：综合此前比较，给新奖有保留的欢迎，并保留质疑机制的权利。\n- D：用盛典和巨额奖金引入奖励科学家的新“实验”。\n- E：接住多种批评，转而并列展示设奖者各不相同的目标。\n- F：反驳私人财富必然带来科研价值，列出声望、宣传和研究方面的担忧。\n- G：补充诺奖与新奖共有私人起源，说明认可需要时间而不能只看初衷。\n- H：展开老奖的规则局限，以合作科研与希格斯发现的认可问题作证。\n\n全文推进链是：\n\n> 颁奖新实验 → 具体奖项与私人资金 → 科学家的批评 → 出资者的不同目标 → 新旧奖共同的评价问题 → 老奖规则的具体局限 → 共同私人起源与时间认可 → 对新奖有保留的接受\n\n完整顺序为：\n\n> **D → A → F → E → B → H → G → C**\n\nA、E、H分别位于第2、第4和第6个位置，其余五段依次填入41—45。","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{"kind":"standard"},"html":"<h2>排序题全局解析<\/h2>\n<p>先明确八段各自承担的功能，再用前后的对象与论证关系确定位置：<\/p>\n<ul>\n<li>A：落实“实验”的代表奖项，扩展到同类奖并交代企业家资助来源。<\/li>\n<li>B：从多种设奖目标转到新旧奖共同面对的合理评价问题，先举新奖再引向老奖。<\/li>\n<li>C：综合此前比较，给新奖有保留的欢迎，并保留质疑机制的权利。<\/li>\n<li>D：用盛典和巨额奖金引入奖励科学家的新“实验”。<\/li>\n<li>E：接住多种批评，转而并列展示设奖者各不相同的目标。<\/li>\n<li>F：反驳私人财富必然带来科研价值，列出声望、宣传和研究方面的担忧。<\/li>\n<li>G：补充诺奖与新奖共有私人起源，说明认可需要时间而不能只看初衷。<\/li>\n<li>H：展开老奖的规则局限，以合作科研与希格斯发现的认可问题作证。<\/li>\n<\/ul>\n<p>全文推进链是：<\/p>\n<blockquote>\n<p>颁奖新实验 → 具体奖项与私人资金 → 科学家的批评 → 出资者的不同目标 → 新旧奖共同的评价问题 → 老奖规则的具体局限 → 共同私人起源与时间认可 → 对新奖有保留的接受<\/p>\n<\/blockquote>\n<p>完整顺序为：<\/p>\n<blockquote>\n<p><strong>D → A → F → E → B → H → G → C<\/strong><\/p>\n<\/blockquote>\n<p>A、E、H分别位于第2、第4和第6个位置，其余五段依次填入41—45。<\/p>\n"},{"title":"排序41题","level":2,"section":"第四鸟 · 新题型","raw":"#### 41题\n\n【答案】D\n\n41位于已知A之前，是全文首段。这里没有前段可接，需要先引出A所说的实验。\n\nD用`An unusual experiment`首次引入奥斯卡式典礼与巨额奖金，末句说明这是怎样奖励科学家的尝试。A随后说：\n\n> That experiment took concrete form in the US$3-million Fundamental Physics Prize\n\n`That experiment`明确回指前面的颁奖尝试，A再把概念落到奖项名称和私人资金上。\n\n> D：先引入一项奖励科学家的新实验 → A：给出这个实验的具体代表，并扩大到同类私人奖项。\n\n最强候选B也是概括性讨论，但以`Whatever their motives`起头，预设设奖者与其动机已经出现；它还讨论新旧奖评价标准，不能为A的`That experiment`提供具体前项。C是综合建议，`similarly`同样需要此前比较，更不具备首段功能。\n\n> **41. D**","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{"kind":"standard"},"html":"<h4>41题<\/h4>\n<p>【答案】D<\/p>\n<p>41位于已知A之前，是全文首段。这里没有前段可接，需要先引出A所说的实验。<\/p>\n<p>D用<code>An unusual experiment<\/code>首次引入奥斯卡式典礼与巨额奖金，末句说明这是怎样奖励科学家的尝试。A随后说：<\/p>\n<blockquote>\n<p>That experiment took concrete form in the US$3-million Fundamental Physics Prize<\/p>\n<\/blockquote>\n<p><code>That experiment<\/code>明确回指前面的颁奖尝试，A再把概念落到奖项名称和私人资金上。<\/p>\n<blockquote>\n<p>D：先引入一项奖励科学家的新实验 → A：给出这个实验的具体代表，并扩大到同类私人奖项。<\/p>\n<\/blockquote>\n<p>最强候选B也是概括性讨论，但以<code>Whatever their motives<\/code>起头，预设设奖者与其动机已经出现；它还讨论新旧奖评价标准，不能为A的<code>That experiment<\/code>提供具体前项。C是综合建议，<code>similarly<\/code>同样需要此前比较，更不具备首段功能。<\/p>\n<blockquote>\n<p><strong>41. D<\/strong><\/p>\n<\/blockquote>\n"},{"title":"排序42题","level":2,"section":"第四鸟 · 新题型","raw":"#### 42题\n\n【答案】F\n\n42夹在已知A和E之间。A以企业家声称想让科学受到关注收尾；E则要承接已经列出的多种反对意见。\n\nA的末尾是：\n\n> attract attention to success in science\n\nF开头用`But critics see no guarantee`对这种积极说法作限制，随后列出声望、自我宣传、同行评议和孤独天才等批评。E再接：\n\n> These objections about prestige, founders' self-promotion and research effects are varied. So are the prize-givers' goals.\n\nE的开头明确复指`prestige`、`founders' self-promotion`和`research effects`三组对象：F先说买不来诺奖声望，再说设奖者自我宣传，最后列科研方面的后果。`So are`才从这三组异议平行转到动机的多样性，不是泛泛地承接任意一种批评。\n\n> A：资助者声称支持科学 → F：批评者提出多方面异议 → E：以异议的分散引出动机同样分散。\n\n最强候选B也能用`Whatever their motives`接住A末尾资助者希望吸引关注的目的，所以只看A—B不能排除它。真正排除点在后端：B写的是新奖学科代表性和老奖规则的适用性，没有写声望能否买来、创办者自我宣传这两组内容，接不上E明确列出的三组既有异议。F同时满足两边，B只满足前边。\n\n> **42. F**","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{"kind":"standard"},"html":"<h4>42题<\/h4>\n<p>【答案】F<\/p>\n<p>42夹在已知A和E之间。A以企业家声称想让科学受到关注收尾；E则要承接已经列出的多种反对意见。<\/p>\n<p>A的末尾是：<\/p>\n<blockquote>\n<p>attract attention to success in science<\/p>\n<\/blockquote>\n<p>F开头用<code>But critics see no guarantee<\/code>对这种积极说法作限制，随后列出声望、自我宣传、同行评议和孤独天才等批评。E再接：<\/p>\n<blockquote>\n<p>These objections about prestige, founders&#39; self-promotion and research effects are varied. So are the prize-givers&#39; goals.<\/p>\n<\/blockquote>\n<p>E的开头明确复指<code>prestige<\/code>、<code>founders&#39; self-promotion<\/code>和<code>research effects<\/code>三组对象：F先说买不来诺奖声望，再说设奖者自我宣传，最后列科研方面的后果。<code>So are<\/code>才从这三组异议平行转到动机的多样性，不是泛泛地承接任意一种批评。<\/p>\n<blockquote>\n<p>A：资助者声称支持科学 → F：批评者提出多方面异议 → E：以异议的分散引出动机同样分散。<\/p>\n<\/blockquote>\n<p>最强候选B也能用<code>Whatever their motives<\/code>接住A末尾资助者希望吸引关注的目的，所以只看A—B不能排除它。真正排除点在后端：B写的是新奖学科代表性和老奖规则的适用性，没有写声望能否买来、创办者自我宣传这两组内容，接不上E明确列出的三组既有异议。F同时满足两边，B只满足前边。<\/p>\n<blockquote>\n<p><strong>42. F<\/strong><\/p>\n<\/blockquote>\n"},{"title":"排序43题","level":2,"section":"第四鸟 · 新题型","raw":"#### 43题\n\n【答案】B\n\n43位于已知E和H之间。E刚结束多种设奖目标的列举，H将具体批评诺奖规则。\n\nE段尾总结：\n\n> very different ambitions\n\nB开头的`Whatever their motives`把这些目标接回来，再提出怎样合理认可科研成就的共同问题。它先举新生命科学奖的代表性不足，随后说：\n\n> Yet established awards deserve scrutiny as well.\n\nB末尾继续明确：\n\n> A long history does not automatically make their rules suitable for the way research is now conducted.\n\nH的开头随即把“老奖规则是否适应现代科研”这个问题复指出来：\n\n> That problem of established rules failing to fit modern research is clear in the Nobel Foundation's limit of three recipients per prize\n\n所以双边推进为：\n\n> E：设奖动机各异 → B：不论动机如何，新旧奖都应接受合理性检验 → H：具体展开老奖规则不适应合作研究的问题。\n\n最强候选G也谈老奖，但它论述私人起源与历史认可，无法为H的`That problem of established rules failing to fit modern research`提供所指的规则适应性问题。F虽有“孤独天才”的批评，讨论的仍是新奖对科研形象的影响，并未提出既有老奖规则的适用性；不能仅凭都涉及个人与合作就跳过对象差异。B才同时接得住E的目标分析并引得出H对老奖规则的具体检验。\n\n> **43. B**","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{"kind":"standard"},"html":"<h4>43题<\/h4>\n<p>【答案】B<\/p>\n<p>43位于已知E和H之间。E刚结束多种设奖目标的列举，H将具体批评诺奖规则。<\/p>\n<p>E段尾总结：<\/p>\n<blockquote>\n<p>very different ambitions<\/p>\n<\/blockquote>\n<p>B开头的<code>Whatever their motives<\/code>把这些目标接回来，再提出怎样合理认可科研成就的共同问题。它先举新生命科学奖的代表性不足，随后说：<\/p>\n<blockquote>\n<p>Yet established awards deserve scrutiny as well.<\/p>\n<\/blockquote>\n<p>B末尾继续明确：<\/p>\n<blockquote>\n<p>A long history does not automatically make their rules suitable for the way research is now conducted.<\/p>\n<\/blockquote>\n<p>H的开头随即把“老奖规则是否适应现代科研”这个问题复指出来：<\/p>\n<blockquote>\n<p>That problem of established rules failing to fit modern research is clear in the Nobel Foundation&#39;s limit of three recipients per prize<\/p>\n<\/blockquote>\n<p>所以双边推进为：<\/p>\n<blockquote>\n<p>E：设奖动机各异 → B：不论动机如何，新旧奖都应接受合理性检验 → H：具体展开老奖规则不适应合作研究的问题。<\/p>\n<\/blockquote>\n<p>最强候选G也谈老奖，但它论述私人起源与历史认可，无法为H的<code>That problem of established rules failing to fit modern research<\/code>提供所指的规则适应性问题。F虽有“孤独天才”的批评，讨论的仍是新奖对科研形象的影响，并未提出既有老奖规则的适用性；不能仅凭都涉及个人与合作就跳过对象差异。B才同时接得住E的目标分析并引得出H对老奖规则的具体检验。<\/p>\n<blockquote>\n<p><strong>43. B<\/strong><\/p>\n<\/blockquote>\n"},{"title":"排序44题","level":2,"section":"第四鸟 · 新题型","raw":"#### 44题\n\n【答案】G\n\n44位于已知H之后、末段45之前。H已证明诺奖对共同成就的认可存在局限；接下来要为对新奖的综合态度再提供一项公平比较。\n\nH段尾说：\n\n> struggle to recognize collective achievement fairly\n\nG开头的`The same established prizes also share the newcomers' private origin`继续谈同一老奖，同时用`also`从规则局限补入起源相似性。段尾指出：\n\n> private origins alone cannot settle the merits of a prize\n\n后面的C于是能说：\n\n> The younger prizes deserve a similarly measured response.\n\n这里`similarly measured`承接的是“不因私人起源自动下结论、让时间形成认可”的审慎标准。\n\n> H：老奖也有制度问题 → G：老奖同样出自私人决定，认可是在时间中形成的 → C：因此也应审慎而开放地看新奖。\n\n最强候选C确实像结尾，但若直接接H，尚未补上新旧奖私人起源和时间认可的比较；把G放在C后又会让文章在综合建议后倒退到一个历史论据。因此G先完成比较，C再收束全篇。\n\n> **44. G**","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{"kind":"standard"},"html":"<h4>44题<\/h4>\n<p>【答案】G<\/p>\n<p>44位于已知H之后、末段45之前。H已证明诺奖对共同成就的认可存在局限；接下来要为对新奖的综合态度再提供一项公平比较。<\/p>\n<p>H段尾说：<\/p>\n<blockquote>\n<p>struggle to recognize collective achievement fairly<\/p>\n<\/blockquote>\n<p>G开头的<code>The same established prizes also share the newcomers&#39; private origin<\/code>继续谈同一老奖，同时用<code>also<\/code>从规则局限补入起源相似性。段尾指出：<\/p>\n<blockquote>\n<p>private origins alone cannot settle the merits of a prize<\/p>\n<\/blockquote>\n<p>后面的C于是能说：<\/p>\n<blockquote>\n<p>The younger prizes deserve a similarly measured response.<\/p>\n<\/blockquote>\n<p>这里<code>similarly measured<\/code>承接的是“不因私人起源自动下结论、让时间形成认可”的审慎标准。<\/p>\n<blockquote>\n<p>H：老奖也有制度问题 → G：老奖同样出自私人决定，认可是在时间中形成的 → C：因此也应审慎而开放地看新奖。<\/p>\n<\/blockquote>\n<p>最强候选C确实像结尾，但若直接接H，尚未补上新旧奖私人起源和时间认可的比较；把G放在C后又会让文章在综合建议后倒退到一个历史论据。因此G先完成比较，C再收束全篇。<\/p>\n<blockquote>\n<p><strong>44. G<\/strong><\/p>\n<\/blockquote>\n"},{"title":"排序45题","level":2,"section":"第四鸟 · 新题型","raw":"#### 45题\n\n【答案】C\n\n45是最后一段，前面已经确定为G。这里没有下一段，需同时检查向前承接与总结功能。\n\nG先说：\n\n> Time, rather than intention, gave them legitimacy\n\n并据此反对只凭私人起源判定奖项优劣。C开头以`a similarly measured response`把这一标准用于新奖，随后列出研究者愿意接受、资金与关注有益两条理由。\n\n段尾形成完整建议：\n\n> question the arrangements while accepting the gifts with gratitude and grace\n\n> G：评价私人奖项不能只看起源，应考虑时间与实际价值 → C：对新奖保持批判能力，同时接受对科学有益的支持。\n\n最强候选F同样谈评价，但它只是批评者提出的一组异议，应该在作者比较和综合判断之前。放在最后会让全文从经过检验的立场倒回单方面反对，也无法回应G所要求的审慎标准。C才能完成正反权衡并给出结论。\n\n> **45. C**","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{"kind":"standard"},"html":"<h4>45题<\/h4>\n<p>【答案】C<\/p>\n<p>45是最后一段，前面已经确定为G。这里没有下一段，需同时检查向前承接与总结功能。<\/p>\n<p>G先说：<\/p>\n<blockquote>\n<p>Time, rather than intention, gave them legitimacy<\/p>\n<\/blockquote>\n<p>并据此反对只凭私人起源判定奖项优劣。C开头以<code>a similarly measured response<\/code>把这一标准用于新奖，随后列出研究者愿意接受、资金与关注有益两条理由。<\/p>\n<p>段尾形成完整建议：<\/p>\n<blockquote>\n<p>question the arrangements while accepting the gifts with gratitude and grace<\/p>\n<\/blockquote>\n<blockquote>\n<p>G：评价私人奖项不能只看起源，应考虑时间与实际价值 → C：对新奖保持批判能力，同时接受对科学有益的支持。<\/p>\n<\/blockquote>\n<p>最强候选F同样谈评价，但它只是批评者提出的一组异议，应该在作者比较和综合判断之前。放在最后会让全文从经过检验的立场倒回单方面反对，也无法回应G所要求的审慎标准。C才能完成正反权衡并给出结论。<\/p>\n<blockquote>\n<p><strong>45. C<\/strong><\/p>\n<\/blockquote>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"section":"第五鸟 · 写作积累","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **scientific progress** | **科学进步** | **富强｜科技发展** | **宏观主题** |\n| respect for scientific talent | 对科研人才的尊重 | 友善｜尊重贡献 | 个人主题 |\n| **research collaboration** | **科研合作** | **和谐｜团结协作** | **宏观主题** |\n| public support for science | 公众对科学的支持 | 富强｜科技发展 | 宏观主题 |\n| a commitment to excellence | 追求卓越的精神 | 敬业｜工匠精神 | 个人主题 |\n| professional dedication | 敬业精神 | 敬业｜职业精神 | 个人主题 |\n| research integrity | 科研诚信 | 诚信｜职业诚信 | 个人主题 |\n| fair recognition of achievement | 对成就的公平认可 | 公正｜评价公平 | 宏观主题 |\n| **gratitude for others’ contributions** | **对他人贡献的感激** | **友善｜尊重贡献** | **个人主题** |\n| social responsibility ,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **In the picture, A uses X to draw attention to B.** | **图中，A用X来吸引人们关注B。** |\n| 图画题 | A offers support to B, who has succeeded in X. | A向在X方面取得成功的B提供支持。 |\n| 图画题 | A accepts B’s help with gratitude. | A满怀感激地接受B的帮助。 |\n| 图画题 | The scene shows people working together rather than relying on a lone individual. | 画面展示了人们共同协作，而不是依靠某个孤立的个人。 |\n| **图表题** | **The chart shows a string of increases in A over the past X years.** | **图表显示，在过去X年中A连续增长。** |\n| 图表题 | Most of the funding for A comes from B. | A的大部分资金来自B。 |\n| 图表题 | The chart shows how A is distributed among B, C and D. | 图表展示了A如何在B、C和D之间分配。 |\n| 图表题 | A receives more funding than the other fields shown in the chart. | A获得的资助超过了图中其他领域。 |\n| **文本评论题** | **The article discusses a new way of rewarding achievement in A.** | **文章讨论了一种奖励A领域成就的新方式。** |\n| 文本评论题 | The author acknowledges concerns about A but welcomes its contribution to B. | 作者承认人们对A的担忧，同时肯定它对B的贡献。 |\n| 文本评论题 | The passage points out that time, rather than intention alone, gives A public recognition. | 短文指出，使A获得公众认可的是时间，而不只是初衷。 |\n| 文本评论题 | The author argues that it is wise to accept support for A while questioning how it works. | 作者认为，在质疑相关机制的同时接受对A的支持是明智的。 |","context":{"focus":[0,0,1080,6116],"mode":"image","asset":"articleAnnotated","sourceW":1080,"sourceH":6116,"label":"从阅读中积累写作表达","includeTitle":true},"meta":{"bird":5,"part":2},"html":"<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In the picture, A uses X to draw attention to B.<\/strong><\/td>\n<td><strong>图中，A用X来吸引人们关注B。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A offers support to B, who has succeeded in X.<\/td>\n<td>A向在X方面取得成功的B提供支持。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A accepts B’s help with gratitude.<\/td>\n<td>A满怀感激地接受B的帮助。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The scene shows people working together rather than relying on a lone individual.<\/td>\n<td>画面展示了人们共同协作，而不是依靠某个孤立的个人。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart shows a string of increases in A over the past X years.<\/strong><\/td>\n<td><strong>图表显示，在过去X年中A连续增长。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>Most of the funding for A comes from B.<\/td>\n<td>A的大部分资金来自B。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart shows how A is distributed among B, C and D.<\/td>\n<td>图表展示了A如何在B、C和D之间分配。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>A receives more funding than the other fields shown in the chart.<\/td>\n<td>A获得的资助超过了图中其他领域。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The article discusses a new way of rewarding achievement in A.<\/strong><\/td>\n<td><strong>文章讨论了一种奖励A领域成就的新方式。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The author acknowledges concerns about A but welcomes its contribution to B.<\/td>\n<td>作者承认人们对A的担忧，同时肯定它对B的贡献。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage points out that time, rather than intention alone, gives A public recognition.<\/td>\n<td>短文指出，使A获得公众认可的是时间，而不只是初衷。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The author argues that it is wise to accept support for A while questioning how it works.<\/td>\n<td>作者认为，在质疑相关机制的同时接受对A的支持是明智的。<\/td>\n<\/tr>\n<\/tbody><\/table>\n"}];

const NEWTYPE={"smallTitle":"<h2>小标题题<\/h2><h3>Directions<\/h3><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)<\/p><div class=\"newtype-options\"><p><strong>A. Different Motives for Rewarding Scientists<\/strong><\/p><p><strong>B. Why Scientists Should Refuse Private Prizes<\/strong><\/p><p><strong>C. Private Wealth Brings Glamour to Science<\/strong><\/p><p><strong>D. A Qualified Welcome for Money and Attention<\/strong><\/p><p><strong>E. Old and New Prizes under the Same Scrutiny<\/strong><\/p><p><strong>F. Criticism of Prestige, Promotion and Research Effects<\/strong><\/p><p><strong>G. The Nobel Rules as a Model for All Awards<\/strong><\/p><\/div><h2>New Prizes and the Rewards of Science<\/h2><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. __________<\/h3><p>An Oscars-style ceremony and enormous cash awards are bringing a little Hollywood glamour to physics. Alexander Polyakov called the US$3-million Fundamental Physics Prize an interesting experiment when he accepted it. Nor is it alone: a string of lucrative research awards has recently joined the Nobel Prizes. Many are financed by Internet entrepreneurs with enormous fortunes. Having succeeded in their own fields, these benefactors say they want to use their wealth to attract attention to people who have succeeded in science.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. __________<\/h3><p>Not all scientists welcome the new awards. Critics argue that money cannot purchase the prestige accumulated by the Nobels and that some prizes are exercises in self-promotion for their founders. Other objections concern research itself: prizes might distort the meritocracy of peer review, reinforce the existing order or fail to support peer-reviewed work. By celebrating exceptional individuals, they may also perpetuate the myth of the lone genius. The objections therefore extend from the reputation of the awards and their founders to their possible influence on scientific work.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. __________<\/h3><p>The prize-givers&#x27; ambitions are no more uniform than the criticism directed at them. Some want to shock the public, some to attract people into science, and others to reward researchers more generously for their careers. Several want to demonstrate that leading scientists can enjoy the lifestyles of financiers and footballers. A large cash award may thus serve publicity, recruitment, recognition or an image of material success. These aims differ even when the outward form of the reward looks similar.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. __________<\/h3><p>There are legitimate questions about how both new and established prizes recognize achievement. The new Breakthrough Prize in Life Sciences takes an unrepresentative view of the subjects it covers. Yet the Nobel Foundation&#x27;s rule limiting each award to three living recipients has also been overtaken by the collaborative nature of modern research, a problem likely to surface in disputes over recognition for the Higgs boson. Moreover, the Nobels themselves began with a wealthy individual&#x27;s decisions about his own money. Their legitimacy developed with time, rather than following automatically from a nobler original intention.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. __________<\/h3><p>Despite the complaints about large financial rewards and the goals behind them, two considerations remain clear. Most researchers would accept such a prize if offered one, and money and attention reaching science are preferable to their going elsewhere. Questioning the mechanism is entirely consistent with research culture, but the funds also belong to the people who choose to give them. Scientists can therefore scrutinize the arrangements without rejecting the gift. A response combining gratitude with critical judgment is wiser than treating imperfections as a reason to turn support away.<\/p><\/section>","sorting":"<h2>排序题<\/h2><h3>Directions<\/h3><p>The following paragraphs are given in a wrong order. For questions 41–45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A–H and filling them into the numbered boxes. Paragraphs A, E, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)<\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A<\/h3><p>That experiment took concrete form in the US$3-million Fundamental Physics Prize accepted by Alexander Polyakov. It is only one of a string of lucrative research awards that have recently joined the Nobels. Many are funded by Internet entrepreneurs with enormous fortunes. These benefactors say they want to use success in their own fields to attract attention to success in science.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B<\/h3><p>Whatever their motives, prize-givers still face a legitimate question: how should scientific achievement be recognized? The newly launched Breakthrough Prize in Life Sciences takes an unrepresentative view of the subjects it covers. Yet established awards deserve scrutiny as well. A long history does not automatically make their rules suitable for the way research is now conducted.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C<\/h3><p>The younger prizes deserve a similarly measured response. Most researchers would accept such an award, and money and attention reaching science are preferable to their going elsewhere. Criticism of the mechanism remains a proper part of research culture, but the funds belong to those who choose to give them. It is wise to question the arrangements while accepting the gifts with gratitude and grace.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D<\/h3><p>An unusual experiment is bringing Hollywood glamour to physics: an Oscars-style ceremony combined with gigantic cash prizes. When a theoretical physicist known for work on quantum field and string theory draws attention to such an experiment, it deserves notice. This time, the experiment concerns how scientists are rewarded rather than a result produced in the laboratory.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E<\/h3><p>These objections about prestige, founders&#x27; self-promotion and research effects are varied. So are the prize-givers&#x27; goals. Some want to shock, others to attract people into science or better reward careers spent in research. Several want to show that leading scientists can live like financiers and footballers. Similar-looking cash awards can therefore serve very different ambitions.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F<\/h3><p>But critics see no guarantee that private wealth will bring scientific value. They argue that money cannot buy the prestige of the Nobels and that the awards may mainly promote their founders. Other complaints concern distorted peer review, a reinforced status quo, a failure to fund peer-reviewed work and the perpetuation of the lone-genius myth.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G<\/h3><p>The same established prizes also share the newcomers&#x27; private origin. The Nobels were set up by a wealthy individual who decided what he wanted to do with his own money. Their accepted position did not follow automatically from a superior intention. Time, rather than intention, gave them legitimacy; private origins alone cannot settle the merits of a prize.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H<\/h3><p>That problem of established rules failing to fit modern research is clear in the Nobel Foundation&#x27;s limit of three recipients per prize, all of whom must still be living. Modern research is collaborative, and that restriction has long been outgrown. The expected dispute over who receives credit for discovering the Higgs boson highlights the risk that contributors will be left out. Even a celebrated award can therefore struggle to recognize collective achievement fairly.<\/p><\/section><p class=\"sorting-boxes\"><strong>41. _____　A　42. _____　E　43. _____　H　44. _____　45. _____<\/strong><\/p>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>million<\/td>\n<td>n. 百万<\/td>\n<td>Fundamental Physics Prize<\/td>\n<td>n. 基础物理学奖<\/td>\n<td>interesting<\/td>\n<td>a. 有趣的<\/td>\n<\/tr>\n<tr>\n<td>experiment<\/td>\n<td>n. 实验<\/td>\n<td>accept<\/td>\n<td>v. 接受<\/td>\n<td>award<\/td>\n<td>n. 奖项<\/td>\n<\/tr>\n<tr>\n<td>March<\/td>\n<td>n. 三月<\/td>\n<td>type<\/td>\n<td>n. 类型<\/td>\n<td>News Feature article<\/td>\n<td>n. 新闻特稿<\/td>\n<\/tr>\n<tr>\n<td>discuss<\/td>\n<td>v. 讨论<\/td>\n<td>a string of<\/td>\n<td>一系列<\/td>\n<td>lucrative<\/td>\n<td>a. 奖金丰厚的<\/td>\n<\/tr>\n<tr>\n<td>researcher<\/td>\n<td>n. 研究人员<\/td>\n<td>join<\/td>\n<td>v. 加入<\/td>\n<td>recent<\/td>\n<td>a. 最近的<\/td>\n<\/tr>\n<tr>\n<td>fund<\/td>\n<td>v. 资助<\/td>\n<td>telephone-number-sized bank accounts<\/td>\n<td>n. 余额位数堪比电话号码的巨额银行账户<\/ \n<\/tr>\n<tr>\n<td>second<\/td>\n<td>ad. 其次<\/td>\n<td>surely<\/td>\n<td>ad. 确实<\/td>\n<td>attention<\/td>\n<td>n. 关注<\/td>\n<\/tr>\n<tr>\n<td>science<\/td>\n<td>n. 科学<\/td>\n<td>elsewhere<\/td>\n<td>ad. 其他地方<\/td>\n<td>fair<\/td>\n<td>a. 合理的<\/td>\n<\/tr>\n<tr>\n<td>criticize<\/td>\n<td>v. 批评<\/td>\n<td>question<\/td>\n<td>v. 质疑<\/td>\n<td>mechanism<\/td>\n<td>n. 机制<\/td>\n<\/tr>\n<tr>\n<td>culture<\/td>\n<td>n. 文化<\/td>\n<td>please<\/td>\n<td>v. 愿意<\/td>\n<td>wise<\/td>\n<td>a. 明智的<\/td>\n<\/tr>\n<tr>\n<td>gratitude<\/td>\n<td>n. 感激<\/td>\n<td>grace<\/td>\n<td>n. 风度；雅量<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h1>\n<h2>逐句逐段分析<\/h2>\n<h2>第1段<\/h2>\n<h3>完整原文 · 第1段<\/h3>\n<p>The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year&#39;s award in March. And it is far from the only one of its type. As a News Feature article in Nature discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years. Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs. These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<h3>意群划分 · 第1段<\/h3>\n<p>The US$3-million Fundamental Physics Prize / is indeed an interesting experiment, / as Alexander Polyakov said / when he accepted this year&#39;s award / in March.<\/p>\n<p>And it is far from / the only one of its type.<\/p>\n<p>As a News Feature article / in Nature discusses, / a string of lucrative awards / for researchers / have joined the Nobel Prizes / in recent years.<\/p>\n<p>Many, / like the Fundamental Physics Prize, / are funded / from the telephone-number-sized bank accounts / of Internet entrepreneurs.<\/p>\n<p>These benefactors / have succeeded / in their chosen fields, / they say, / and they want to use their wealth / to draw attention / to those who have succeeded / in science.<\/p>\n<h3>意群翻译 · 第1段<\/h3>\n<p>这个300万美元的基础物理学奖 / 确实是一个有趣的实验，/ 正如亚历山大·波利亚科夫所说 / 当他接受今年的奖项时 / 在三月。<\/p>\n<p>而且它远不是 / 此类奖项中唯一的。<\/p>\n<p>正如一篇新闻特稿文章 / 在《自然》杂志上讨论的，/ 一系列丰厚的奖项 / 为研究人员的 / 已经加入诺贝尔奖行列 / 在最近几年。<\/p>\n<p>许多，/ 像基础物理学奖一样，/ 由...资助 / 从电话号码般大小的银行账户 / 互联网企业家的。<\/p>\n<p>这些赞助人 / 已经成功 / 在他们选择的领域，/ 他们说，/ 他们想要使用他们的财富 / 来吸引注意力 / 对那些已经成功的人 / 在科学领域。<\/p>\n<h3>标准译文 · 第1段<\/h3>\n<p>300万美元的基础物理学奖确实是一个有趣的实验，正如亚历山大·波利亚科夫在三月接受今年奖项时所说。而且它远不是此类奖项中唯一的。正如《自然》杂志的一篇新闻特稿所讨论的，近年来一系列为研究人员设立的丰厚奖项已经加入了诺贝尔奖的行列。许多奖项，像基础物理学奖一样，由互联网企业家的巨额银行账户资助。这些赞助人表示，他们在自己选择的领域取得了成功，现在想要用自己的财富来吸引人们关注那些在科学领域取得成功的人。<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>What&#39;s not to like? Quite a lot, according to a handful of scientists quoted in the News Feature. You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels. The new awards are an exercise in self-promotion for those behind them, say scientists. They could distort the achievement-based system of peer-review-led research. They could cement the status quo of peer-reviewed research. They do not fund peer-reviewed research. They perpetuate the myth of the lone genius.<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>What&#39;s not to like?<\/p>\n<p>Quite a lot, / according to a handful of scientists / quoted in the News Feature.<\/p>\n<p>You cannot buy class, / as the old saying goes, / and these upstart entrepreneurs / cannot buy their prizes / the prestige of the Nobels.<\/p>\n<p>The new awards / are an exercise in self-promotion / for those behind them, / say scientists.<\/p>\n<p>They could distort / the achievement-based system / of peer-review-led research.<\/p>\n<p>They could cement / the status quo / of peer-reviewed research.<\/p>\n<p>They do not fund / peer-reviewed research.<\/p>\n<p>They perpetuate / the myth of the lone genius.<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>有什么不喜欢的呢？<\/p>\n<p>相当多，/ 根据少数科学家 / 在新闻特稿中被引用的。<\/p>\n<p>你买不到品位，/ 正如老话所说，/ 这些暴发户企业家 / 不能为他们的奖项买到 / 诺贝尔奖的声望。<\/p>\n<p>这些新奖项 / 是一种自我推销的行为 / 对于背后的人来说，/ 科学家们说。<\/p>\n<p>它们可能扭曲 / 基于成就的体系 / 同行评议主导的研究。<\/p>\n<p>它们可能巩固 / 现状 / 同行评议研究的。<\/p>\n<p>它们不资助 / 同行评议的研究。<\/p>\n<p>它们延续 / 孤独天才的神话。<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>有什么不喜欢的呢？根据新闻特稿中引用的少数科学家的说法，问题相当多。正如老话所说，你买不到品位，这些暴发户企业家也不能为他们的奖项买到诺贝尔奖的声望。科学家们说，这些新奖项是背后推动者的自我推销行为。它们可能扭曲同行评议主导的、基于成就的研究体系。它们可能使同行评议研究的现状停滞不前。它们不资助同行评议的研究。它们延续孤独天才的神话。<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>The goals of the prize-givers seem as scattered as the criticism. Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>The goals of the prize-givers / seem as scattered / as the criticism.<\/p>\n<p>Some want to shock, / others to draw people / into science, / or to better reward those / who have made their careers / in research.<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>奖项设立者的目标 / 看起来和...一样分散 / 和批评一样。<\/p>\n<p>一些人想要震撼，/ 其他人想吸引人们 / 进入科学，/ 或者更好地奖励那些人 / 已经在职业生涯中 / 在研究领域。<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>奖项设立者的目标看起来和批评一样分散。一些人想要震撼，其他人想吸引人们进入科学领域，或者更好地奖励那些在研究领域建立中取得成就的人。<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>As Nature has pointed out before, there are some legitimate concerns about how science prizes – both new and old – are distributed. The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include. But the Nobel Foundation&#39;s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research – as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. Time, rather than intention, has given them legitimacy.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>As Nature has pointed out before, / there are some legitimate concerns / about how science prizes – / both new and old – / are distributed.<\/p>\n<p>The Breakthrough Prize in Life Sciences, / launched this year, / takes an unrepresentative view / of what the life sciences include.<\/p>\n<p>But the Nobel Foundation&#39;s limit / of three recipients per prize, / each of whom must still be living, / has long been outgrown / by the collaborative nature / of modern research – / as will be demonstrated / by the inevitable row / over who is ignored / when it comes to acknowledging / the discovery of the Higgs boson.<\/p>\n<p>The Nobels were, / of course, / themselves set up / by a very rich individual / who had decided / what he wanted to do / with his own money.<\/p>\n<p>Time, / rather than intention, / has given them legitimacy.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>正如《自然》之前指出的，/ 存在一些合理的担忧 / 关于科学奖项如何 – / 包括新的和旧的 – / 被分配。<\/p>\n<p>生命科学突破奖，/ 今年推出的，/ 采取了一个不具代表性的观点 / 关于生命科学包括什么。<\/p>\n<p>但诺贝尔基金会的限制 / 每个奖项三个获奖者，/ 每个人必须仍然在世，/ 早已被超越 / 被合作性质 / 现代研究的 – / 正如将被证明的 / 通过不可避免的争议 / 关于谁被忽视了 / 当涉及到承认 / 希格斯玻色子的发现。<\/p>\n<p>诺贝尔奖，/ 当然，/ 本身就是建立的 / 由一个非常富有的个人 / 他已经决定了 / 他想要做什么 / 用他自己的钱。<\/p>\n<p>时间，/ 而不是意图，/ 赋予了它们合法性。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>正如《自然》之前指出的，关于科学奖项（包括新旧奖项）如何分配存在一些合理的担忧。今年推出的生命科学突破奖对生命科学的涵盖范围采取了不具代表性的观点。但诺贝尔基金会限制每个奖项最多三个获奖者，且必须在世，这早已不适应现代研究的合作性质——这一点将在承认希格斯玻色子发现时不可避免地出现的关于谁被忽视的争议中得到证明。当然，诺贝尔奖本身也是由一个非常富有的个人建立的，他决定了如何使用自己的钱。是时间，而非意图，赋予了它们合法性。<\/p>\n<h2>第5段<\/h2>\n<h3>完整原文 · 第5段<\/h3>\n<p>As much as some scientists may complain about the new awards, two things seem clear. First, most researchers would accept such a prize if they were offered one. Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please. It is wise to take such gifts with gratitude and grace.<\/p>\n<h3>意群划分 · 第5段<\/h3>\n<p>As much as some scientists / may complain / about the new awards, / two things seem clear.<\/p>\n<p>First, / most researchers / would accept such a prize / if they were offered one.<\/p>\n<p>Second, / it is surely a good thing / that the money and attention / come to science / rather than go elsewhere.<\/p>\n<p>It is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers&#39; money / to do with as they please.<\/p>\n<p>It is wise / to take such gifts / with gratitude and grace.<\/p>\n<h3>意群翻译 · 第5段<\/h3>\n<p>尽管一些科学家 / 可能抱怨 / 关于新奖项，/ 两件事看起来很清楚。<\/p>\n<p>第一，/ 大多数研究人员 / 会接受这样的奖项 / 如果他们被提供一个。<\/p>\n<p>第二，/ 这肯定是件好事 / 金钱和关注 / 来到科学领域 / 而不是去别处。<\/p>\n<p>批评和质疑是公平的 / 机制 – / 这是研究的文化，/ 毕竟 – / 但这是奖项设立者的钱 / 按他们的意愿处理。<\/p>\n<p>明智的做法是 / 接受这些礼物 / 带着感激和优雅。<\/p>\n<h3>标准译文 · 第5段<\/h3>\n<p>尽管一些科学家可能对新奖项有所抱怨，但有两件事看起来很清楚。第一，如果获得提名，大多数研究人员都会接受这样的奖项。第二，金钱和关注流向科学而非其他领域，这肯定是件好事。批评和质疑这种机制是公平的——毕竟这是研究文化的一部分——但这是奖项设立者的钱，他们有权按自己的意愿处理。明智的做法是带着感激和优雅接受这些礼物。<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>The US$3-million Fundamental Physics Prize → is indeed an interesting experiment：(as Alexander Polyakov said：(when he accepted this year&#39;s award：(in March))).<\/p>\n<p>And it is far from → the only one of its type.<\/p>\n<p>As a News Feature article：(in Nature) discusses → a string of lucrative awards：(for researchers) → have joined the Nobel Prizes：(in recent years).<\/p>\n<p>Many：(like the Fundamental Physics Prize) → are funded：(from the telephone-number-sized bank accounts：(of Internet entrepreneurs)).<\/p>\n<p>These benefactors → have succeeded：(in their chosen fields) → they say + they want to use their wealth → to draw attention：(to those who have succeeded：(in science)).<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>What&#39;s not to like?<\/p>\n<p>Quite a lot → according to a handful of scientists：(quoted in the News Feature).<\/p>\n<p>You cannot buy class：(as the old saying goes) + these upstart entrepreneurs → cannot buy their prizes → the prestige of the Nobels.<\/p>\n<p>The new awards → are an exercise in self-promotion：(for those behind them) → say scientists.<\/p>\n<p>They could distort → the achievement-based system：(of peer-review-led research).<\/p>\n<p>They could cement → the status quo：(of peer-reviewed research).<\/p>\n<p>They do not fund → peer-reviewed research.<\/p>\n<p>They perpetuate → the myth of the lone genius.<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>The goals of the prize-givers → seem as scattered → as the criticism.<\/p>\n<p>Some want to shock + others to draw people：(into science) + or to better reward those：(who have made their careers：(in research)).<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>As Nature has pointed out before → there are some legitimate concerns：(about how science prizes – both new and old – are distributed).<\/p>\n<p>The Breakthrough Prize in Life Sciences：(launched this year) → takes an unrepresentative view：(of what the life sciences include).<\/p>\n<p>But the Nobel Foundation&#39;s limit：(of three recipients per prize：(each of whom must still be living)) → has long been outgrown：(by the collaborative nature：(of modern research)) – as will be demonstrated：(by the inevitable row：(over who is ignored：(when it comes to acknowledging：(the discovery of the Higgs boson)))).<\/p>\n<p>The Nobels were：(of course) → themselves set up：(by a very rich individual：(who had decided：(what he wanted to do：(with his own money)))).<\/p>\n<p>Time：(rather than intention) → has given them legitimacy.<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>As much as some scientists → may complain：(about the new awards) → two things seem clear.<\/p>\n<p>First → most researchers → would accept such a prize：(if they were offered one).<\/p>\n<p>Second → it is surely a good thing：(that the money and attention → come to science → rather than go elsewhere).<\/p>\n<p>It is fair → to criticize and question → the mechanism – (that is the culture of research：(after all)) – but it is the prize-givers&#39; money：(to do with as they please).<\/p>\n<p>It is wise → to take such gifts：(with gratitude and grace).<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>这个300万美元的基础物理学奖 → 确实是一个有趣的实验：(正如亚历山大·波利亚科夫所说：(当他接受今年的奖项时：(在三月)))。<\/p>\n<p>而且它远不是 → 此类奖项中唯一的。<\/p>\n<p>正如一篇新闻特稿文章：(在《自然》杂志上)讨论 → 一系列丰厚的奖项：(为研究人员的) → 已经加入诺贝尔奖行列：(在最近几年)。<\/p>\n<p>许多：(像基础物理学奖一样) → 由...资助：(从电话号码般大小的银行账户：(互联网企业家的))。<\/p>\n<p>这些赞助人 → 已经成功：(在他们选择的领域) → 他们说 + 他们想要使用他们的财富 → 来吸引注意力：(对那些已经成功的人：(在科学领域))。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>有什么不喜欢的呢？<\/p>\n<p>相当多 → 根据少数科学家：(在新闻特稿中被引用的)。<\/p>\n<p>你买不到品位：(正如老话所说) + 这些暴发户企业家 → 不能为他们的奖项买到 → 诺贝尔奖的声望。<\/p>\n<p>这些新奖项 → 是一种自我推销的行为：(对于背后的人来说) → 科学家们说。<\/p>\n<p>它们可能扭曲 → 基于成就的体系：(同行评议主导的研究)。<\/p>\n<p>它们可能巩固 → 现状：(同行评议研究的)。<\/p>\n<p>它们不资助 → 同行评议的研究。<\/p>\n<p>它们延续 → 孤独天才的神话。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>奖项设立者的目标 → 看起来和...一样分散 → 和批评一样。<\/p>\n<p>一些人想要震撼 + 其他人想吸引人们：(进入科学) + 或者更好地奖励那些人：(已经在职业生涯中：(在研究领域))。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>正如《自然》之前指出的 → 存在一些合理的担忧：(关于科学奖项如何 – 包括新的和旧的 – 被分配)。<\/p>\n<p>生命科学突破奖：(今年推出的) → 采取了一个不具代表性的观点：(关于生命科学包括什么)。<\/p>\n<p>但诺贝尔基金会的限制：(每个奖项三个获奖者：(每个人必须仍然在世)) → 早已被超越：(被合作性质：(现代研究的)) – 正如将被证明的：(通过不可避免的争议：(关于谁被忽视了：(当涉及到承认：(希格斯玻色子的发现))))。<\/p>\n<p>诺贝尔奖：(当然) → 本身就是建立的：(由一个非常富有的个人：(他已经决定了：(他想要做什么：(用他自己的钱))))。<\/p>\n<p>时间：(而不是意图) → 赋予了它们合法性。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>尽管一些科学家 → 可能抱怨：(关于新奖项) → 两件事看起来很清楚。<\/p>\n<p>第一 → 大多数研究人员 → 会接受这样的奖项：(如果他们被提供一个)。<\/p>\n<p>第二 → 这肯定是件好事：(金钱和关注 → 来到科学领域 → 而不是去别处)。<\/p>\n<p>批评和质疑是公平的 → 机制 – (这是研究的文化：(毕竟)) – 但这是奖项设立者的钱：(按他们的意愿处理)。<\/p>\n<p>明智的做法是 → 接受这些礼物：(带着感激和优雅)。<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h2>长难句1 · 第1段第1句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year&#39;s award in March.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>The US$3-million Fundamental Physics Prize / is indeed an interesting experiment, / as Alexander Polyakov said / when he accepted this year&#39;s award / in March.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>这个300万美元的基础物理学奖 / 确实是一个有趣的实验，/ 正如亚历山大·波利亚科夫所说 / 当他接受今年的奖项时 / 在三月。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把金额接到奖项名称前：<\/p>\n<blockquote>\n<p>300万美元的基础物理学奖确实是一个有趣的实验<\/p>\n<\/blockquote>\n<p>把两层时间放到“接受奖项”这件事上：<\/p>\n<blockquote>\n<p>亚历山大·波利亚科夫在三月接受今年奖项时所说<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>300万美元的基础物理学奖确实是一个有趣的实验<br>正如亚历山大·波利亚科夫在三月接受今年奖项时所说<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>这个奖确实是一个有趣的实验。<\/p>\n<\/blockquote>\n<p>先完整说出评价，再用“正如”接评价的出处。姓名后面放获奖时间，“三月”限定接受奖项的时点，“今年”限定是哪一届奖项。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>这个300万美元的基础物理学奖确实是一个有趣的实验，正如亚历山大·波利亚科夫在三月接受今年的奖项时说的那样。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>金额和奖项名称已足够明确，去掉句首多余的“这个”。<\/li>\n<li>“时说的那样”压缩为“时所说”，使引用出处的表达更凝练。<\/li>\n<li>保留“确实”和“有趣的实验”，不把试验性评价改成已经证明成功。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>300万美元的基础物理学奖确实是一个有趣的实验，正如亚历山大·波利亚科夫在三月接受今年奖项时所说。<\/p>\n<\/blockquote>\n<h2>长难句2 · 第1段第5句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>These benefactors / have succeeded / in their chosen fields, / they say, / and they want to use their wealth / to draw attention / to those who have succeeded / in science.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>这些赞助人 / 已经成功 / 在他们选择的领域，/ 他们说，/ 他们想要使用他们的财富 / 来吸引注意力 / 对那些已经成功的人 / 在科学领域。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把“他们说”放到最前面，明确整句是谁的解释：<\/p>\n<blockquote>\n<p>这些赞助人说，他们在自己选择的领域取得了成功<\/p>\n<\/blockquote>\n<p>将财富的用途接到“想要”后：<\/p>\n<blockquote>\n<p>他们想要用自己的财富吸引人们的注意<\/p>\n<\/blockquote>\n<p>把成功发生的领域放到被关注的人前：<\/p>\n<blockquote>\n<p>那些在科学领域取得成功的人<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>这些赞助人说，他们在自己选择的领域取得了成功<br>他们想要用自己的财富吸引人们关注<br>那些在科学领域取得成功的人<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>赞助人说，他们取得了成功，并想用财富让科学家受到关注。<\/p>\n<\/blockquote>\n<p>先交代赞助人的发言和自身经历，再说财富的用途，最后接被关注的人。“自己选择的领域”属于赞助人，“科学领域”属于被资助、被关注的人，不能交换。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>这些赞助人说，他们在自己选择的领域已经取得成功，而他们想用自己的财富，把人们的注意力吸引到那些在科学领域取得成功的人身上。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“说”换成转述语气更顺的“表示”，连接人物与整句自我说明。<\/li>\n<li>“把人们的注意力吸引到……身上”整理成“吸引人们关注……”，减少层层介词。<\/li>\n<li>前后两类人的“成功”都保留，以对应捐助动机与受关注对象。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>这些赞助人表示，他们在自己选择的领域取得了成功，现在想要用自己的财富来吸引人们关注那些在科学领域取得成功的人。<\/p>\n<\/blockquote>\n<h2>长难句3 · 第2段第3句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>You cannot buy class, / as the old saying goes, / and these upstart entrepreneurs / cannot buy their prizes / the prestige of the Nobels.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>你买不到品位，/ 正如老话所说，/ 这些暴发户企业家 / 不能为他们的奖项买到 / 诺贝尔奖的声望。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把引用老话的提示放在前面：<\/p>\n<blockquote>\n<p>正如老话所说，你买不到品位<\/p>\n<\/blockquote>\n<p>把“给谁买什么”说完整：<\/p>\n<blockquote>\n<p>这些暴发户企业家不能为他们的奖项买到诺贝尔奖的声望<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>正如老话所说，你买不到品位<br>这些暴发户企业家也不能为他们的奖项买到诺贝尔奖的声望<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>金钱买不到品位，企业家也买不到奖项的声望。<\/p>\n<\/blockquote>\n<p>先说老话，再把同样的判断应用到企业家设立的奖项上。“他们的奖项”是声望的获得对象，“诺贝尔奖”用来说明期望买到哪一种声望，不能译成购买诺贝尔奖本身。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>正如老话所说，你无法买到品位，而这些暴发户企业家也无法为自己的奖项买来诺贝尔奖所拥有的声望。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“无法买到”简化成“买不到”，与老话的口吻一致。<\/li>\n<li>“所拥有的声望”压缩为“的声望”，并保持比较对象清楚。<\/li>\n<li>保留“也”连接老话与具体批评，让类比关系直接可见。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>正如老话所说，你买不到品位，这些暴发户企业家也不能为他们的奖项买到诺贝尔奖的声望。<\/p>\n<\/blockquote>\n<h2>长难句4 · 第4段第3句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>But the Nobel Foundation&#39;s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research – as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>But the Nobel Foundation&#39;s limit / of three recipients per prize, / each of whom must still be living, / has long been outgrown / by the collaborative nature / of modern research – / as will be demonstrated / by the inevitable row / over who is ignored / when it comes to acknowledging / the discovery of the Higgs boson.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>但诺贝尔基金会的限制 / 每个奖项三个获奖者，/ 每个人必须仍然在世，/ 早已被超越 / 被合作性质 / 现代研究的 – / 正如将被证明的 / 通过不可避免的争议 / 关于谁被忽视了 / 当涉及到承认 / 希格斯玻色子的发现。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先将人数上限与在世要求合并：“限制三个”要说清是最多三位：<\/p>\n<blockquote>\n<p>诺贝尔基金会限制每个奖项最多三位获奖者，而且每人都必须在世<\/p>\n<\/blockquote>\n<p>将现代研究的特点接到“不适应”后：<\/p>\n<blockquote>\n<p>这些限制早已不适应现代研究的合作性质<\/p>\n<\/blockquote>\n<p>后半句先说会发生什么争议，再补它发生的场合：<\/p>\n<blockquote>\n<p>承认希格斯玻色子发现时，必然出现关于谁被忽视的争议<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>诺贝尔基金会限制每个奖项最多三位获奖者，而且每人都必须在世<br>这些限制早已不适应现代研究的合作性质<br>承认希格斯玻色子发现时，必然出现关于谁被忽视的争议，并证明这一点<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>获奖限制已经不适应现代研究，今后的争议将证明这一点。<\/p>\n<\/blockquote>\n<p>先把限制内容说全，再判断它与合作研究的关系。破折号后的证明部分从具体事件出发，说确认发现时会遗漏谁、因而发生争议；不能将“必然发生”误加到发现本身上。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>但诺贝尔基金会规定每个奖项最多三位获奖者，而且都必须在世，这些限制早已不适应现代研究的合作性质；在承认希格斯玻色子发现时，关于谁被忽视的不可避免的争议将证明这一点。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“规定每个奖项最多三位获奖者”收紧为“限制每个奖项最多三个获奖者”，保留前一步已经确定的人数上限。<\/li>\n<li>用破折号连接总判断和即将出现的具体证明，层次更清楚。<\/li>\n<li>“这一点将在……争议中得到证明”让证明对象直接承接前半句，保留对争议必然出现的判断。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>但诺贝尔基金会限制每个奖项最多三个获奖者，且必须在世，这早已不适应现代研究的合作性质——这一点将在承认希格斯玻色子发现时不可避免地出现的关于谁被忽视的争议中得到证明。<\/p>\n<\/blockquote>\n<h2>长难句5 · 第4段第4句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>The Nobels were, / of course, / themselves set up / by a very rich individual / who had decided / what he wanted to do / with his own money.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>诺贝尔奖，/ 当然，/ 本身就是建立的 / 由一个非常富有的个人 / 他已经决定了 / 他想要做什么 / 用他自己的钱。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把插入的语气提示移到句首：<\/p>\n<blockquote>\n<p>当然，诺贝尔奖本身也是由一个非常富有的个人建立的<\/p>\n<\/blockquote>\n<p>后面的决定是在补充这个人的做法，另收一块：<\/p>\n<blockquote>\n<p>他决定了如何使用自己的钱<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>当然，诺贝尔奖本身也是由一个非常富有的个人建立的<br>他决定了如何使用自己的钱<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>诺贝尔奖也是富人设立的，他自己决定钱的用途。<\/p>\n<\/blockquote>\n<p>先说奖项的设立者，再补充这个人如何处理自己的资金。“本身”和“也”放在诺贝尔奖旁，保留作者把老奖项与新奖项作比较的意味。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>当然，诺贝尔奖本身也是由一个非常富有的个人设立的，这个人已经决定他想要怎样使用他自己的钱。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>第二次出现的“这个人”换成“他”，减轻重复。<\/li>\n<li>“已经决定他想要怎样使用他自己的钱”收束为“决定了如何使用自己的钱”。<\/li>\n<li>不删掉“本身也是”，因为这正是新旧奖项共同来源的比较重点。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>当然，诺贝尔奖本身也是由一个非常富有的个人建立的，他决定了如何使用自己的钱。<\/p>\n<\/blockquote>\n<h2>长难句6 · 第5段第4句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>It is fair to criticize and question the mechanism – that is the culture of research, after all – but it is the prize-givers&#39; money to do with as they please.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>It is fair / to criticize and question / the mechanism – / that is the culture of research, / after all – / but it is the prize-givers&#39; money / to do with as they please.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>批评和质疑是公平的 / 机制 – / 这是研究的文化，/ 毕竟 – / 但这是奖项设立者的钱 / 按他们的意愿处理。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把批评和质疑的对象接好：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<\/p>\n<\/blockquote>\n<p>将中间的解释合成一句：<\/p>\n<blockquote>\n<p>毕竟，这是研究文化的一部分<\/p>\n<\/blockquote>\n<p>后半句先说钱属于谁，再说钱怎么处理：<\/p>\n<blockquote>\n<p>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的<br>毕竟，这是研究文化的一部分<br>但这是奖项设立者的钱，他们可以按自己的意愿处理<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>可以批评机制，但设立者可以自行决定钱的用途。<\/p>\n<\/blockquote>\n<p>先承认批评合理，把研究文化作为简短解释插在中间，再用“但”转向资金所有者的决定空间。两边都要成立，不能只保留赞成奖项或只保留批评。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的，毕竟这是研究的文化；但这笔钱是奖项设立者的钱，他们可以按照自己喜欢的方式处理。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>将“这是研究的文化”整理成“这是研究文化的一部分”，中文搭配更完整。<\/li>\n<li>把解释放在两道破折号之间，让“公平的——但……”的主线清楚。<\/li>\n<li>“按照自己喜欢的方式”整理成“按自己的意愿”，并用“有权”表达所有者的处置权限。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>批评和质疑这种机制是公平的——毕竟这是研究文化的一部分——但这是奖项设立者的钱，他们有权按自己的意愿处理。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>35题<\/h2>\n<p><strong>The author believes that the new awards are ______.<\/strong><\/p>\n<p>作者认为这些新奖项______。<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>harmful to the culture of research<\/strong><\/p>\n<p>有害于研究文化<\/p>\n<p>B. <strong>acceptable despite the criticism<\/strong><\/p>\n<p>尽管受到批评，仍然可以接受<\/p>\n<p>C. <strong>subject to undesirable changes<\/strong><\/p>\n<p>容易发生不良变化<\/p>\n<p>D. <strong>unworthy of public attention<\/strong><\/p>\n<p>不值得公众关注<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们
