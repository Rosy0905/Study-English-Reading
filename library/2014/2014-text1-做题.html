\n<h2>21题题干</h2>\n<p><strong>George Osborne’s scheme was intended to ______.</strong></p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>22题题干</h2>\n<p><strong>The phrase “to sign on” (Para. 2) most probably means ______.</strong></p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是什么意思？</p>\n</blockquote>\n<p>题型：<strong>词义猜测题</strong>。</p>\n<hr />\n<h2>23题题干</h2>\n<p><strong>What prompted the chancellor to develop his scheme?</strong></p>\n<blockquote>\n<p>是什么促使财政大臣制定这一计划？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n<hr />\n<h2>24题题干</h2>\n<p><strong>According to Paragraph 3, being unemployed makes one feel ______.</strong></p>\n<blockquote>\n<p>根据第三段，失业会让人产生什么感受？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n<hr />\n<h2>25题题干</h2>\n<p><strong>To which of the following would the author most probably agree?</strong></p>\n<blockquote>\n<p>作者最可能同意以下哪一项？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点 / 全文主旨题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Only if, But, Instead</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>reasonable, hurting, least generous</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>introduced, protect, insure</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>benefit, dependency, no entitlement</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>jobseeker, allowance, work, welfare</td>\n</tr>\n</tbody>\n</table>\n<p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. What could be more reasonable?</p>\n<p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. / Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. / What could be more reasonable?</p>\n<p>为了 “让生活变得更好” and reduce “dependency,” 乔治奥斯本, 财政大臣, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. / Only if 失业者来到就业中心 with a CV, 登记网上求职, and start looking for work will they be 有资格领取补助—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. / What could be more reasonable?</p>\n<p>1、为了、让生活变得更好、乔治奥斯本、财政大臣、失业者来到就业中心、登记网上求职、有资格领取补助。</p>\n<p>More <span class=\"mask\">[xxx]</span> reasonableness followed. There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed. “We’re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.” Help? Really? On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system that demands too little effort from the newly unemployed to find work, and <span class=\"mask\">[xxx]</span> laziness. What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n<p>More <span class=\"mask\">[xxx]</span> reasonableness followed. / There will now be a seven-day wait for the jobseeker’s allowance. / “Those first few days should be spent looking for work, not looking to sign on,” he claimed. / “We’re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.” / Help? Really? / On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system that demands too little effort from the newly unemployed to find work, and <span class=\"mask\">[xxx]</span> laziness. / What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n<p>更多 <span class=\"mask\">[xxx]</span> 合理性随之出现. / There will now be 七天等待期 for the jobseeker’s allowance. / “最初几天 should be 用来找工作, not looking to sign on,” he claimed. / “We’re doing these things because we know they 帮助人们不领补助 and help those on benefits 更快进入工作.” / Help? Really? / On first hearing, this was the 关心社会的财政大臣, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system that demands too little effort from the newly unemployed to find work, and <span class=\"mask\">[xxx]</span> laziness. / What motivated him, we were to understand, was his zeal for “根本公平”—保护纳税人, 控制开支 and ensuring that only the 最 <span class=\"mask\">[xxx]</span> 申请者 received their benefits.</p>\n<p>2、更多、合理性随之出现、七天等待期、最初几天、用来找工作、帮助人们不领补助、更快进入工作、关心社会的财政大臣、根本公平、保护纳税人、控制开支、最、申请者。</p>\n<p>Losing a job is hurting: you don’t skip down to the jobcentre with a song in your heart, delighted at the <span class=\"mask\">[xxx]</span> of doubling your income from the generous state. It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get. You are now not wanted; you are now <span class=\"mask\">[xxx]</span> from the work environment that offers purpose and structure in your life. Worse, the <span class=\"mask\">[xxx]</span> income to feed yourself and your family and pay the bills has disappeared. Ask anyone newly unemployed what they want and the answer is always: a job.</p>\n<p>Losing a job is hurting: you don’t skip down to the jobcentre with a song in your heart, delighted at the <span class=\"mask\">[xxx]</span> of doubling your income from the generous state. / It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get. / You are now not wanted; you are now <span class=\"mask\">[xxx]</span> from the work environment that offers purpose and structure in your life. / Worse, the <span class=\"mask\">[xxx]</span> income to feed yourself and your family and pay the bills has disappeared. / Ask anyone newly unemployed what they want and the answer is always: a job.</p>\n<p>失业令人痛苦: you don’t skip down to the jobcentre with a song in your heart, delighted at the <span class=\"mask\">[xxx]</span> of doubling your income from the generous state. / It is 经济上可怕, psychologically <span class=\"mask\">[xxx]</span> and you know that 支持很少 and <span class=\"mask\">[xxx]</span> hard to get. / You are now 不再被需要; you are now <span class=\"mask\">[xxx]</span> from 工作环境 that offers 目标与秩序 in your life. / Worse, the <span class=\"mask\">[xxx]</span> income to 养活自己和家人 and pay the bills has disappeared. / Ask anyone newly unemployed what they want and 答案总是: a job.</p>\n<p>3、失业令人痛苦、经济上可怕、支持很少、不再被需要、工作环境、目标与秩序、养活自己和家人、答案总是。</p>\n<p>But in Osborneland, your first <span class=\"mask\">[xxx]</span> is to fall into dependency—permanent dependency if you can get it—supported by a state only too ready to <span class=\"mask\">[xxx]</span> your <span class=\"mask\">[xxx]</span>. It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive <span class=\"mask\">[xxx]</span> payments if the disaster happens. Even the very phrase “jobseeker’s allowance” is about <span class=\"mask\">[xxx]</span> the unemployed as a “jobseeker” who had no fundamental right to a benefit he or she has earned through making national insurance <span class=\"mask\">[xxx]</span>. Instead, the claimant receives a time-limited “allowance,” conditional on actively seeking a job; no <span class=\"mask\">[xxx]</span> and no insurance, at £71.70 a week, one of the least generous in the EU.</p>\n<p>But in Osborneland, your first <span class=\"mask\">[xxx]</span> is to fall into dependency—permanent dependency if you can get it—supported by a state only too ready to <span class=\"mask\">[xxx]</span> your <span class=\"mask\">[xxx]</span>. / It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened. / The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive <span class=\"mask\">[xxx]</span> payments if the disaster happens. / Even the very phrase “jobseeker’s allowance” is about <span class=\"mask\">[xxx]</span> the unemployed as a “jobseeker” who had no fundamental right to a benefit he or she has earned through making national insurance <span class=\"mask\">[xxx]</span>. / Instead, the claimant receives a time-limited “allowance,” conditional on actively seeking a job; no <span class=\"mask\">[xxx]</span> and no insurance, at £71.70 a week, one of the least generous in the EU.</p>\n<p>在奥斯本世界里, your first <span class=\"mask\">[xxx]</span> is to 陷入依赖—永久依赖 if you can get it—由国家供养 only too ready to <span class=\"mask\">[xxx]</span> your <span class=\"mask\">[xxx]</span>. / It is as though 二十年 of ever-tougher reforms of the 求职与补助管理体系 never happened. / The 英国福利原则 is no longer that you can 给自己投保防范 the 失业风险 and receive <span class=\"mask\">[xxx]</span> 灾难发生时的款项. / Even the “求职者补助”这一说法 is about <span class=\"mask\">[xxx]</span> the unemployed as a “jobseeker” who had no 领取补助的基本权利 he or she has earned through making 国民保险 <span class=\"mask\">[xxx]</span>. / Instead, the 申请者获得有时限的 “allowance,” 以积极求职为条件; no <span class=\"mask\">[xxx]</span> and no insurance, at £71.70 a week, 最不慷慨者之一 in the EU.</p>\n<p>4、在奥斯本世界里、陷入依赖、永久依赖、由国家供养、二十年、求职与补助管理体系、英国福利原则、给自己投保防范、失业风险、灾难发生时的款项、“求职者补助”这一说法、领取补助的基本权利、国民保险、申请者获得有时限的、以积极求职为条件、最不慷慨者之一。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某项新安排、失业后的感受或福利规则时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现财政大臣、求职计划、就业中心和补助；中间又有七天等待、找工作、纳税人、失业后的恐惧与工作环境；结尾反复出现依赖、英国福利、保险、条件和每周补助。</p>\n<p>到这里还不能自然地说清楚：这些安排到底在帮助谁，财政大臣口中的公平和失业者的处境怎样连接，七天等待会不会真的让人更快就业，福利为什么从保险变成有条件的补助，以及作者最终是在支持改革还是反对它。粗读时只要能判断“这篇文章大概和求职补助、失业处境以及福利规则有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住财政大臣、求职补助、纳税人、失业后的处境和结尾的保险条件；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>21题</h2>\n<blockquote>\n<p>George Osborne’s scheme was intended to ______.<br />\n乔治·奥斯本的计划旨在做什么？</p>\n</blockquote>\n<p>题干已经给出George Osborne这个人物或对象，第1段也出现George Osborne，所以把第1段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. What could be more reasonable?</p>\n<p>开始精读：</p>\n<p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. / Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. / What could be more reasonable?</p>\n<p>顺着英文顺序读：</p>\n<p>为了“让生活变得更好”并减少“依赖”，乔治·奥斯本这位财政大臣推出了“[xxx]求职”计划。 / 只有失业者带着简历到就业中心、登记网上求职并开始找工作，他们才有资格领取补助；之后还要每周而不是每两周报到。 / 还有什么能比这更合理呢？</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. motivate the unemployed to report voluntarily</h3>\n<blockquote>\n<p>促使失业者自愿报到</p>\n</blockquote>\n<p>把A接回题干，它说的是：该计划旨在促使失业者自愿报到。</p>\n<p>A里的“report voluntarily”和原文“start looking for work”都在回答这项计划要求失业者采取什么行动，因为两处都涉及失业者到就业中心后的行为，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“report voluntarily”把报到写成自愿行为，而“start looking for work”是领取补助前必须满足的求职条件；两者动作目的不同。 因此“report voluntarily”与“start looking for work”在这里仍有具体差别。</p>\n<p><strong>这里的报到是计划想鼓励的自愿行为，还是附在求职条件后的强制要求？</strong></p>\n<p>不能，原文用Only if把求职、登记和领取补助绑在一起，weekly report也是后续要求；它没有把report写成voluntarily。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. provide the unemployed with easier access to benefits</h3>\n<blockquote>\n<p>让失业者更容易获得补助</p>\n</blockquote>\n<p>把B接回题干，它说的是：该计划旨在让失业者更容易获得补助。</p>\n<p>B里的“easier access to benefits”和原文“Only if the jobless arrive”都在回答领取补助的条件是否变得更容易，因为Only if直接限定了获得补助前必须完成的事项，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“easier access to benefits”说门槛降低，而“Only if the jobless arrive”后面列出一串前置条件，方向是增加条件，不是简化入口。 因此“easier access to benefits”与“Only if the jobless arrive”在这里仍有具体差别。</p>\n<p><strong>列出简历、网上登记、开始求职和每周报到，能叫作更容易获得补助吗？</strong></p>\n<p>不能，这些是新增或收紧的资格条件，原文没有说失业者可以更容易进入补助体系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. encourage jobseekers’ active <span class=\"mask\">[xxx]</span> in job seeking</h3>\n<blockquote>\n<p>鼓励求职者积极参与求职</p>\n</blockquote>\n<p>把C接回题干，它说的是：该计划旨在鼓励求职者更主动地求职。</p>\n<p>C里的“job seeking”和原文“start looking for work”都在回答计划是否把主动求职设为核心条件，因为题干的scheme和原文的求职步骤说的是同一套安排，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“job seeking”与“start looking for work”说的是同一动作，原文还把它放在获得补助的必要条件中，说明计划确实要推动求职者行动起来。 因此“job seeking”与“start looking for work”在这里能接上。</p>\n<p><strong>把开始找工作设为领取补助的条件，是否就是在鼓励积极求职？</strong></p>\n<p>能，简历、网上登记、开始找工作和每周报告共同构成主动求职要求，C概括了这一目的。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. guarantee jobseekers’ legitimate right to benefits</h3>\n<blockquote>\n<p>保障求职者获得补助的正当权利</p>\n</blockquote>\n<p>把D接回题干，它说的是：该计划旨在保障求职者获得补助的正当权利。</p>\n<p>D里的“legitimate right to benefits”和原文“eligible for benefit”都在回答计划是在保障权利还是限定资格，因为eligible for benefit与right to benefits都涉及领取补助，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“legitimate right to benefits”强调无条件保障一项权利，而“eligible for benefit”前面由Only if控制，强调满足条件后才有资格。 因此“legitimate right to benefits”与“eligible for benefit”在这里仍有具体差别。</p>\n<p><strong>只有完成一系列要求才有资格，能等同于保障既有权利吗？</strong></p>\n<p>不能，原文把补助变成有条件的资格，并没有承诺保证求职者的正当权利。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>21题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>21题选C。</strong></p>\n</blockquote>\n<h2>22题</h2>\n<blockquote>\n<p>The phrase “to sign on” (Para. 2) most probably means ______.<br />\n第二段中的“to sign on”最可能是什么意思？</p>\n</blockquote>\n<p>题干已经明确写出Para. 2，所以直接回到第2段，把这一自然段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>More <span class=\"mask\">[xxx]</span> reasonableness followed. There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed. “We’re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.” Help? Really? On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system that demands too little effort from the newly unemployed to find work, and <span class=\"mask\">[xxx]</span> laziness. What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n<p>开始精读：</p>\n<p>More <span class=\"mask\">[xxx]</span> reasonableness followed. / There will now be a seven-day wait for the jobseeker’s allowance. / “Those first few days should be spent looking for work, not looking to sign on,” he claimed. / “We’re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.” / Help? Really? / On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system that demands too little effort from the newly unemployed to find work, and <span class=\"mask\">[xxx]</span> laziness. / What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n<p>顺着英文顺序读：</p>\n<p>随后又有更多看起来合理的做法。 / 现在，申领求职者补助要等待七天。 / 他声称：“最初几天应该用来找工作，而不是去登记领取补助。” / “我们这样做，是因为我们知道这能帮助人们不再依赖补助，也能帮助正在领补助的人更快找到工作。” / 帮助？真的吗？ / 乍一听，这似乎是一位关心社会的财政大臣，想让生活变得更好，还配上一套针对明显[xxx]制度的“改革”；在这种说法里，制度要求新失业者付出的求职努力太少，甚至会[xxx]懒惰。 / 我们被要求相信，真正推动他的是对“根本公平”的热情——保护纳税人、控制开支，并确保只有最[xxx]的申请者拿到补助。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. to register for an <span class=\"mask\">[xxx]</span> from the government</h3>\n<blockquote>\n<p>向政府登记领取某项补助</p>\n</blockquote>\n<p>把A接回题干，它说的是：“to sign on”是向政府登记领取补助。</p>\n<p>A里的“register for”和原文“jobseeker’s allowance”都在回答sign on在这一制度里对应什么办理动作，因为前一句先给出jobseeker’s allowance，后一句把sign on和最初几天联系起来，所以回看第2段这句话。</p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“register for”是办理登记，“jobseeker’s allowance”是紧邻的政府补助；放回语境就是去登记申领这项补助。 因此“register for”与“jobseeker’s allowance”在这里能接上。</p>\n<p><strong>在刚提到求职者补助后，sign on最自然地指向登记申领它吗？</strong></p>\n<p>能，前后句连续谈七天等待和最初几天不要去sign on，A把这一办理动作说清楚。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. to accept the government’s restrictions on the allowance</h3>\n<blockquote>\n<p>接受政府对补助的限制</p>\n</blockquote>\n<p>把B接回题干，它说的是：“to sign on”是接受政府对补助的限制。</p>\n<p>B里的“government’s restrictions”和原文“looking to sign on”都在回答sign on描述的是办理动作还是接受规则，因为同一句把looking to sign on与looking for work并列为两种动作，所以回看第2段这句话。</p>\n<blockquote>\n<p>“Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“accept the restrictions”是一种态度或同意关系，而“looking to sign on”是人准备去做的一项具体行为，动作性质不同。 因此“government’s restrictions”与“looking to sign on”在这里仍有具体差别。</p>\n<p><strong>一个人去sign on，原文是在说他同意限制，还是去办理某件事？</strong></p>\n<p>不能，句子比较的是最初几天去找工作还是去sign on，没有出现接受政府限制的意思。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. to check on the availability of jobs at the jobcentre</h3>\n<blockquote>\n<p>到就业中心查看有没有工作</p>\n</blockquote>\n<p>把C接回题干，它说的是：“to sign on”是到就业中心查询岗位。</p>\n<p>C里的“availability of jobs”和原文“jobseeker’s allowance”都在回答sign on是否等于查找工作机会，因为前一句的jobseeker’s allowance限定了后一句的制度语境，所以回看第2段这句话。</p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“check on jobs”属于looking for work，而“jobseeker’s allowance”对应的是另一项办理补助的活动；原句正把二者分开。 因此“availability of jobs”与“jobseeker’s allowance”在这里仍有具体差别。</p>\n<p><strong>原文已经把looking for work和looking to sign on对举，sign on还能再等于找工作吗？</strong></p>\n<p>不能，若sign on就是查岗位，句中的“找工作，而不是sign on”会变成同一动作自我对立。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. to attend a governmental job-training program</h3>\n<blockquote>\n<p>参加政府就业培训项目</p>\n</blockquote>\n<p>把D接回题干，它说的是：“to sign on”是参加政府就业培训。</p>\n<p>D里的“job-training program”和原文“looking to sign on”都在回答这一短语是否指向培训项目，因为题干问具体含义，而原文只把sign on写成与求职相对的办理动作，所以回看第2段这句话。</p>\n<blockquote>\n<p>“Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“job-training program”需要出现培训、课程或参加项目的信息，“looking to sign on”周围只有补助等待与求职，没有培训对象。 因此“job-training program”与“looking to sign on”在这里仍有具体差别。</p>\n<p><strong>没有任何training或program信息，能把sign on解释成参加培训吗？</strong></p>\n<p>不能，D增加了原文没有出现的项目和培训内容。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>22题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>22题选A。</strong></p>\n</blockquote>\n<h2>23题</h2>\n<blockquote>\n<p>What prompted the chancellor to develop his scheme?<br />\n是什么促使财政大臣制定这一计划？</p>\n</blockquote>\n<p>题干已经给出chancellor这个人物或对象，第2段也出现chancellor，所以把第2段从头到尾读完。</p>\n<p>第2段前面已经完整读过，这里直接沿用刚才读清的整段关系，再进入A—D逐项比较。</p>\n<h3>A. A desire to secure a <span class=\"mask\">[xxx]</span> life for all.</h3>\n<blockquote>\n<p>希望让所有人过上更好的生活</p>\n</blockquote>\n<p>把A接回题干，它说的是：推动财政大臣的是让所有人生活更好的愿望。</p>\n<p>A里的“life for all”和原文“change lives for the better”都在回答财政大臣公开呈现的动机是什么，因为选项和原文都出现改善生活这一说法，所以回看第2段这句话。</p>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system.</p>\n</blockquote>\n<p>“secure a life for all”与“change lives for the better”方向接近；但原文用On first hearing把它放在表面印象里，后面还要继续解释真正动机。 因此“life for all”与“change lives for the better”在这里能接上。</p>\n<p><strong>第一遍只读到“change lives for the better”，能否立刻判断这就是作者认定的真实推动力？</strong></p>\n<p>还不能，这一说法确实出现在原文并与A接得上，但On first hearing提示它可能只是表面形象，局部还没有把表面与真实完全拉开。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. An eagerness to protect the unemployed.</h3>\n<blockquote>\n<p>急于保护失业者</p>\n</blockquote>\n<p>把B接回题干，它说的是：推动财政大臣的是保护失业者的热切愿望。</p>\n<p>B里的“protect the unemployed”和原文“protecting the taxpayer”都在回答他要保护的对象是谁，因为protect在选项和原文中都出现，但对象需要核对，所以回看第2段这句话。</p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n</blockquote>\n<p>“protect the unemployed”把保护对象写成失业者，而“protecting the taxpayer”明确写成纳税人，主体动作相似、对象却相反。 因此“protect the unemployed”与“protecting the taxpayer”在这里仍有具体差别。</p>\n<p><strong>原文明确说protecting the taxpayer，B能把对象换成the unemployed吗？</strong></p>\n<p>不能，关键对象已经完整可见，B改换了被保护的人。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. An urge to be generous to the claimants.</h3>\n<blockquote>\n<p>想对申请者慷慨一些</p>\n</blockquote>\n<p>把C接回题干，它说的是：推动财政大臣的是对补助申请者更慷慨。</p>\n<p>C里的“generous to the claimants”和原文“controlling spending”都在回答计划动机是扩大给付还是控制给付，因为claimants在两处相同，真正差别在对他们采取的方向，所以回看第2段这句话。</p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n</blockquote>\n<p>“generous to the claimants”要求放宽和多给，而“controlling spending”并且只让most deserving claimants领取，方向是收紧。 因此“generous to the claimants”与“controlling spending”在这里仍有具体差别。</p>\n<p><strong>控制开支并限定最值得的人领取，能叫作对申请者慷慨吗？</strong></p>\n<p>不能，原文的动作方向与generous相反。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. A passion to ensure fairness for taxpayers.</h3>\n<blockquote>\n<p>热衷于确保纳税人的公平</p>\n</blockquote>\n<p>把D接回题干，它说的是：推动财政大臣的是确保纳税人公平的热情。</p>\n<p>D里的“fairness for taxpayers”和原文“fundamental fairness”都在回答原文给出的直接动机是什么，因为fairness与taxpayer在同一句中组成明确解释，所以回看第2段这句话。</p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n</blockquote>\n<p>“fairness for taxpayers”把“fundamental fairness”和“protecting the taxpayer”合在一起，正好对应原文用was说明的动机。 因此“fairness for taxpayers”与“fundamental fairness”在这里能接上。</p>\n<p><strong>作者把motivate后面的内容直接写成fundamental fairness和保护纳税人，D是否完整接上？</strong></p>\n<p>能，D没有改换对象，也没有补出新的目的，直接概括了原句。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>23题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>24题</h2>\n<blockquote>\n<p>According to Paragraph 3, being unemployed makes one feel ______.<br />\n根据第三段，失业会让人产生什么感受？</p>\n</blockquote>\n<p>题干已经明确写出Paragraph 3，所以直接回到第3段，把这一自然段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Losing a job is hurting: you don’t skip down to the jobcentre with a song in your heart, delighted at the <span class=\"mask\">[xxx]</span> of doubling your income from the generous state. It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get. You are now not wanted; you are now <span class=\"mask\">[xxx]</span> from the work environment that offers purpose and structure in your life. Worse, the <span class=\"mask\">[xxx]</span> income to feed yourself and your family and pay the bills has disappeared. Ask anyone newly unemployed what they want and the answer is always: a job.</p>\n<p>开始精读：</p>\n<p>Losing a job is hurting: you don’t skip down to the jobcentre with a song in your heart, delighted at the <span class=\"mask\">[xxx]</span> of doubling your income from the generous state. / It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get. / You are now not wanted; you are now <span class=\"mask\">[xxx]</span> from the work environment that offers purpose and structure in your life. / Worse, the <span class=\"mask\">[xxx]</span> income to feed yourself and your family and pay the bills has disappeared. / Ask anyone newly unemployed what they want and the answer is always: a job.</p>\n<p>顺着英文顺序读：</p>\n<p>失去工作令人痛苦：你不会心里唱着歌蹦跳着去就业中心，也不会因为有机会从慷慨的国家那里把收入翻倍而高兴。 / 它在经济上令人恐惧，在心理上令人[xxx]；而且你知道能得到的支持很少，又[xxx]难以取得。 / 现在你不再被需要；你也被[xxx]在那个能给生活提供目标和结构的工作环境之外。 / 更糟的是，用来养活自己和家人、支付账单的[xxx]收入消失了。 / 问任何一个刚失业的人想要什么，答案总是：一份工作。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. insulted</h3>\n<blockquote>\n<p>受侮辱</p>\n</blockquote>\n<p>把A接回题干，它说的是：失业使人感到受侮辱。</p>\n<p>A里的“insulted”和原文“financially terrifying”都在回答第三段描写的核心心理感受是什么，因为选项和原文都在给失业后的感受定性，所以回看第3段这句话。</p>\n<blockquote>\n<p>It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get.</p>\n</blockquote>\n<p>“insulted”要求有人实施侮辱，而“financially terrifying”与psychologically embarrassing写的是恐惧和难堪，没有施辱者。 因此“insulted”与“financially terrifying”在这里仍有具体差别。</p>\n<p><strong>第三段是在说别人侮辱失业者，还是失业本身带来恐惧和难堪？</strong></p>\n<p>不能，A改变了感受产生的关系，把困境造成的不安写成遭人侮辱。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>[xxx]</p>\n</blockquote>\n<p>把B接回题干，它说的是：失业使人产生B所指的那种不舒服感受。</p>\n<p>B里的“B所指的感受”和原文“financially terrifying”都在回答未知词是否可能概括恐惧、难堪和难以获得支持，因为B的具体词被遮住，但题干位置与整段负面感受对应，所以回看第3段这句话。</p>\n<blockquote>\n<p>It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get.</p>\n</blockquote>\n<p>“B所指的感受”目前读不清，而“financially terrifying”明确是持续的不安和压力；其余三项若被排除，B仍可能概括这一组感受。 因此“B所指的感受”与“financially terrifying”在这里能接上。</p>\n<p><strong>B虽然看不清，但它有没有可能是对恐惧、尴尬和压力的上位概括？</strong></p>\n<p>还不能否定，遮挡词可能正是在概括这一整组不安感，因此先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. enraged</h3>\n<blockquote>\n<p>愤怒</p>\n</blockquote>\n<p>把C接回题干，它说的是：失业使人感到愤怒。</p>\n<p>C里的“enraged”和原文“financially terrifying”都在回答原文的负面情绪是不是愤怒，因为两者都是情绪词，但要比较具体方向，所以回看第3段这句话。</p>\n<blockquote>\n<p>It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get.</p>\n</blockquote>\n<p>“enraged”是愤怒，“psychologically embarrassing”是难堪，旁边还有terrifying；原文没有出现发火或愤怒对象。 因此“enraged”与“financially terrifying”在这里仍有具体差别。</p>\n<p><strong>恐惧与尴尬能直接改写成愤怒吗？</strong></p>\n<p>不能，情绪方向不同，C把压力和难堪改成了怒气。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. guilty</h3>\n<blockquote>\n<p>内疚</p>\n</blockquote>\n<p>把D接回题干，它说的是：失业使人感到内疚。</p>\n<p>D里的“guilty”和原文“support is minimal”都在回答第三段是否在写道德上的自责，因为guilty与原文的负面感受都属于心理状态，需要看成因，所以回看第3段这句话。</p>\n<blockquote>\n<p>It is financially terrifying, psychologically <span class=\"mask\">[xxx]</span> and you know that support is minimal and <span class=\"mask\">[xxx]</span> hard to get.</p>\n</blockquote>\n<p>“guilty”要求因做错事而自责，而“support is minimal”连同经济恐惧写的是失业处境和保障不足，没有道德过错。 因此“guilty”与“support is minimal”在这里仍有具体差别。</p>\n<p><strong>段落有没有说失业者认为自己做错了事？</strong></p>\n<p>不能，D补进了原文没有的道德责任和自责关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>24题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>24题选B。</strong></p>\n</blockquote>\n<h2>25题</h2>\n<p><strong>To which of the following would the author most probably agree?</strong></p>\n<p>作者最可能同意以下哪一项？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Unemployment benefits should not be made conditional.</strong></p>\n<p>失业补助不应附加条件。</p>\n<p>B. <strong>The British welfare system indulges jobseekers’ laziness.</strong></p>\n<p>英国福利制度纵容求职者懒惰。</p>\n<p>C. <strong>The jobseekers’ allowance has met their actual needs.</strong></p>\n<p>求职者补助已经满足了他们的实际需要。</p>\n<p>D. <strong>Osborne’s reforms will reduce the risk of unemployment.</strong></p>\n<p>奥斯本的改革将降低失业风险。</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>介绍奥斯本的求职计划：领补助前必须带简历、网上登记、开始求职并每周报到</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>继续列出七天等待和“帮助就业”的说法，随后转而追问其动机并落到纳税人和开支</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>详细写失业带来的经济恐惧、心理难堪、工作身份丧失以及基本收入消失</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>批评奥斯本把失业者想成依赖者，并指出福利从保险权利变成附条件、限时且很低的补助</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. Unemployment benefits should not be made conditional.</h3>\n<blockquote>\n<p>失业补助不应附加条件。</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕“失业补助不应附加条件”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍附条件补助带来的新限制</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明政府为这些限制给出的理由</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>写失业者的现实困难说明限制不合理</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后主张恢复失业保险式的无条件权利</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>A与全文推进完全一致：全文先摆出奥斯本方案的合理外观，再揭开保护纳税人和控制开支的动机，随后写失业者的真实痛苦，最后批评补助从保险权利变成有条件的限时给付。它能够覆盖每一段，而不是只覆盖一个局部例子。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. The British welfare system indulges jobseekers’ laziness.</h3>\n<blockquote>\n<p>英国福利制度纵容求职者懒惰。</p>\n</blockquote>\n<p>如果B是主旨，全文应当围绕“英国福利制度纵容求职者懒惰”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先写英国福利怎样让失业者轻易拿钱</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再证明求职者因此缺少主动性</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着列出懒惰和长期依赖的现实结果</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后赞成奥斯本继续收紧制度</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>把B代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“英国福利制度纵容求职者懒惰”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. The jobseekers’ allowance has met their actual needs.</h3>\n<blockquote>\n<p>求职者补助已经满足了他们的实际需要。</p>\n</blockquote>\n<p>如果C是主旨，全文应当围绕“求职者补助已经满足了他们的实际需要”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先写求职者补助提供了充分保障</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再说明等待和求职条件并不妨碍领取</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着写失业者的生活需求已经得到覆盖</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后肯定现行金额和制度安排</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>把C代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“求职者补助已经满足了他们的实际需要”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. Osborne’s reforms will reduce the risk of unemployment.</h3>\n<blockquote>\n<p>奥斯本的改革将降低失业风险。</p>\n</blockquote>\n<p>如果D是主旨，全文应当围绕“奥斯本的改革将降低失业风险”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先提出改革可以预防失业</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再解释求职要求怎样降低失业发生概率</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着给出失业风险下降的现实证据</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后预测改革将持续减少失业</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>把D代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“奥斯本的改革将降低失业风险”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>25题主旨结果</h3>\n<p>四个选项全部代入后，A能够覆盖开头、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。</p>\n<p>A能够覆盖作者从表面合理性转向现实伤害、再到福利权利被条件化的批评；B是作者讽刺的奥斯本式假设，C与“支持很少、欧盟最不慷慨之一”冲突，D则把求职管理误写成降低失业风险。</p>\n<blockquote>\n<p><strong>25题选A。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Unemployment benefits should not be made conditional / 失业补助不应附加条件</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查23题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. A desire to secure a better life for all.</li>\n<li>D. A passion to ensure fairness for taxpayers.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Unemployment benefits should not be made conditional / 失业补助不应附加条件</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍看第二段时，A和D都有明确抓手。A能接上“change lives for the better”，而D能接上“fundamental fairness—protecting the taxpayer”。麻烦在于，这一段先用On first hearing摆出一个关心失业者的财政大臣形象，随后才用What motivated him重新说明动机；如果快速读，两个说法都像答案，所以第一遍把A和D同时留下。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问的是“什么促使财政大臣制定计划”。A把原因写成改善所有人的生活，D把原因写成确保纳税人的公平。两项都不是凭空出现：A来自前面的公开说法，D来自后面的明确解释。真正需要解决的不是哪个词在原文出现，而是哪一句承担作者最终认定的motivation。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。主旨题已经把全文固定为“失业补助不应附加条件”。为了完成这一批评，作者必须先展示政府如何把收紧补助包装成关心失业者。A正好属于这种包装：change lives for the better出现在On first hearing之后，作者马上用Help? Really?拆掉这一表面形象。若A是真正动机，后文应继续证明改革如何让所有人生活更好；实际却转向纳税人、开支和“最值得”的申请者，并用整段现实痛苦反驳政府的假设。</p>\n<p>再看D。D对应What motivated him was his zeal for “fundamental fairness”这一直接判断，后面的protecting the taxpayer又把fairness的对象说清楚。它也能解释全文为什么要写失业者的恐惧和福利权利被条件化：作者正是在比较政府口中的纳税人公平，与失业者实际失去的保险权利。D既接回局部语法，也与主旨中的批评方向一致。</p>\n<p>第一遍保留A，是因为它复现了政府的口号；主旨确定后，口号和作者认可的动机被分开了。A只能解释表面宣传，D才能解释方案为什么收紧补助以及全文为何要反驳它。</p>\n<blockquote>\n<p><strong>23题选D。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>21题：C</strong> — encourage jobseekers’ active [xxx] in job seeking（鼓励求职者积极参与求职）</li>\n<li><strong>22题：A</strong> — to register for an [xxx] from the government（向政府登记领取某项补助）</li>\n<li><strong>23题：D</strong> — A passion to ensure fairness for taxpayers.（热衷于确保纳税人的公平）</li>\n<li><strong>24题：B</strong> — [xxx]（[xxx]）</li>\n<li><strong>25题：A</strong> — Unemployment benefits should not be made conditional.（失业补助不应附加条件。）</li>\n</ul>\n<p>本篇答案：<strong>CADBA</strong>。</p>\n","analysisStartIndex":26,"maskInventory":{"token":"[xxx]","count":109},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"25","ordinaryFirstRoundCandidates":{"21":["C"],"22":["A"],"23":["A","D"],"24":["B"]}},"questionOptionFlowVersion": function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h);if(!baseW||!baseH)return;const pw=wrap.querySelector('.pageWrap')||wrap;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=(a[0]/baseW*100)+'%';d.style.top=(a[1]/baseH*100)+'%';d.style.width=(a[2]/baseW*100)+'%';d.style.height=(a[3]/baseH*100)+'%';pw.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,behavior})}
