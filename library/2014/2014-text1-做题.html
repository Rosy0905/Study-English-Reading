<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**George Osborne’s scheme was intended to ______.**\n\n> 乔治·奥斯本的计划旨在做什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>21题题干</h2>\n<p><strong>George Osborne’s scheme was intended to ______.</strong></p>\n<blockquote>\n<p>乔治·奥斯本的计划旨在做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[248,208,900,49],[309,279,806,47],[309,349,933,47],[309,420,965,47],[309,490,847,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**The phrase “to sign on” (Para. 2) most probably means ______.**\n\n> 第二段中的“to sign on”最可能是什么意思？\n\n题型：**词义猜测题**。\n\n---","html":"<h2>22题题干</h2>\n<p><strong>The phrase “to sign on” (Para. 2) most probably means ______.</strong></p>\n<blockquote>\n<p>第二段中的“to sign on”最可能是什么意思？</p>\n</blockquote>\n<p>题型：<strong>词义猜测题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**What prompted the chancellor to develop his scheme?**\n\n> 是什么促使财政大臣制定这一计划？\n\n题型：**原因细节题**。\n\n---","html":"<h2>23题题干</h2>\n<p><strong>What prompted the chancellor to develop his scheme?</strong></p>\n<blockquote>\n<p>是什么促使财政大臣制定这一计划？</p>\n</blockquote>\n<p>题型：<strong>原因细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[308,1124,681,39],[309,1195,719,47],[309,1265,721,47],[309,1335,749,48],[248,1476,1211,49]],"scrollTarget":null,"meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**According to Paragraph 3, being unemployed makes one feel ______.**\n\n> 根据第三段，失业会让人产生什么感受？\n\n题型：**段落细节题**。\n\n---","html":"<h2>24题题干</h2>\n<p><strong>According to Paragraph 3, being unemployed makes one feel ______.</strong></p>\n<blockquote>\n<p>根据第三段，失业会让人产生什么感受？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[309,1547,187,39],[309,1618,168,47],[309,1688,185,47],[309,1758,154,47],[248,1899,1145,47],[309,1970,974,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**To which of the following would the author most probably agree?**\n\n> 作者最可能同意以下哪一项？\n\n题型：**全文作者观点 / 全文主旨题**。\n\n---","html":"<h2>25题题干</h2>\n<p><strong>To which of the following would the author most probably agree?</strong></p>\n<blockquote>\n<p>作者最可能同意以下哪一项？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点 / 全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[309,2040,980,47],[309,2110,930,47],[309,2181,988,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Only if, But, Instead |\n| 态度词 / 评价词 | 先抓个大概好坏 | reasonable, hurting, least generous |\n| 动作词 | 先看谁做了什么 | introduced, protect, insure |\n| 结果词 | 看最后出了什么事 | benefit, dependency, no entitlement |\n| 重复主题词 | 大概知道老在说什么 | jobseeker, allowance, work, welfare |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Only if, But, Instead</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>reasonable, hurting, least generous</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>introduced, protect, insure</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>benefit, dependency, no entitlement</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>jobseeker, allowance, work, welfare</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “**[xxx]** work search” scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**. What could be more reasonable?","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. What could be more reasonable?</p>\n</div></div>","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancell 者。</p>\n</div><div class=\"coarsePara coarseDone\"><p>3、失业令人痛苦、经济上可怕、支持很少、不再被需要、工作环境、目标与秩序、养活自己和家人、答案总是。</p>\n</div><div class=\"coarsePara currentFocus\"><p>4、在奥斯本世界里、陷入依赖、永久依赖、由国家供养、二十年、求职与补助管理体系、英国福利原则、给自己投保防范、失业风险、灾难发生时的款项、“求职者补助”这一说法、领取补助的基本权利、国民保险、申请者获得有时限的、以积极求职为条件、最不慷慨者之一。</p>\n</div></div>","articleRects":[[301,1633,1253,47],[222,1684,1333,55],[222,1743,1332,47],[221,1797,1332,47],[222,1852,1332,48],[221,1907,1333,47],[224,1960,1330,49],[221,2017,1332,47],[222,2070,1329,48],[222,2126,1331,48],[223,2181,744,47]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse","coarse":true,"pid":3,"form":3},"contextRaw":"1、为了、让生活变得更好、乔治奥斯本、财政大臣、失业者来到就业中心、登记网上求职、有资格领取补助。\n\n2、更多、合理性随之出现、七天等待期、最初几天、用来找工作、帮助人们不领补助、更快进入工作、关心社会的财政大臣、根本公平、保护纳税人、控制开支、最、申请者。\n\n3、失业令人痛苦、经济上可怕、支持很少、不再被需要、工作环境、目标与秩序、养活自己和家人、答案总是。"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某项新安排、失业后的感受或福利规则时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现财政大臣、求职计划、就业中心和补助；中间又有七天等待、找工作、纳税人、失业后的恐惧与工作环境；结尾反复出现依赖、英国福利、保险、条件和每周补助。\n\n到这里还不能自然地说清楚：这些安排到底在帮助谁，财政大臣口中的公平和失业者的处境怎样连接，七天等待会不会真的让人更快就业，福利为什么从保险变成有条件的补助，以及作者最终是在支持改革还是反对它。粗读时只要能判断“这篇文章大概和求职补助、失业处境以及福利规则有关”，并知道这些信息大约出现在哪几段，就已经够用了。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住财政大臣、求职补助、纳税人、失业后的处境和结尾的保险条件；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某项新安排、失业后的感受或福利规则时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现财政大臣、求职计划、就业中心和补助；中间又有七天等待、找工作、纳税人、失业后的恐惧与工作环境；结尾反复出现依赖、英国福利、保险、条件和每周补助。</p>\n<p>到这里还不能自然地说清楚：这些安排到底在帮助谁，财政大臣口中的公平和失业者的处境怎样连接，七天等待会不会真的让人更快就业，福利为什么从保险变成有条件的补助，以及作者最终是在支持改革还是反对它。粗读时只要能判断“这篇文章大概和求职补助、失业处境以及福利规则有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住财政大臣、求职补助、纳税人、失业后的处境和结尾的保险条件；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> George Osborne’s scheme was intended to ______.  \n> 乔治·奥斯本的计划旨在做什么？\n\n题干已经给出George Osborne这个人物或对象，第1段也出现George Osborne，所以把第1段从头到尾读完。\n\n> 原文参考：\n>\n> In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “**[xxx]** work search” scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**. What could be more reasonable?\n>\n> 开始精读：\n>\n> In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “**[xxx]** work search” scheme. / Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**. / What could be more reasonable?\n>\n> 顺着英文顺序读：\n>\n> 为了“让生活变得更好”并减少“依赖”，乔治·奥斯本这位财政大臣推出了“[xxx]求职”计划。 / 只有失业者带着简历到就业中心、登记网上求职并开始找工作，他们才有资格领取补助；之后还要每周而不是每两周报到。 / 还有什么能比这更合理呢？\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>21题</h2>\n<blockquote>\n<p>George Osborne’s scheme was intended to ______.<br />\n乔治·奥斯本的计划旨在做什么？</p>\n</blockquote>\n<p>题干已经给出George Osborne这个人物或对象，第1段也出现George Osborne，所以把第1段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. What could be more reasonable?</p>\n<p>开始精读：</p>\n<p>In order to “change lives for the better” and reduce “dependency,” George Osborne, Chancellor of the Exchequer, introduced the “<span class=\"mask\">[xxx]</span> work search” scheme. / Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>. / What could be more reasonable?</p>\n<p>顺着英文顺序读：</p>\n<p>为了“让生活变得更好”并减少“依赖”，乔治·奥斯本这位财政大臣推出了“[xxx]求职”计划。 / 只有失业者带着简历到就业中心、登记网上求职并开始找工作，他们才有资格领取补助；之后还要每周而不是每两周报到。 / 还有什么能比这更合理呢？</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[[248,208,900,49],[309,279,806,47],[309,349,933,47],[309,420,965,47],[309,490,847,47]],"scrollTarget":null,"meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. motivate the unemployed to report voluntarily\n\n> 促使失业者自愿报到\n\n把A接回题干，它说的是：该计划旨在促使失业者自愿报到。\n\nA里的“report voluntarily”和原文“start looking for work”都在回答这项计划要求失业者采取什么行动，因为两处都涉及失业者到就业中心后的行为，所以回看第1段这句话。\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**.\n\n“report voluntarily”把报到写成自愿行为，而“start looking for work”是领取补助前必须满足的求职条件；两者动作目的不同。 因此“report voluntarily”与“start looking for work”在这里仍有具体差别。\n\n**这里的报到是计划想鼓励的自愿行为，还是附在求职条件后的强制要求？**\n\n不能，原文用Only if把求职、登记和领取补助绑在一起，weekly report也是后续要求；它没有把report写成voluntarily。\n\n**第一轮判断：A排除。**","html":"<h3>A. motivate the unemployed to report voluntarily</h3>\n<blockquote>\n<p>促使失业者自愿报到</p>\n</blockquote>\n<p>把A接回题干，它说的是：该计划旨在促使失业者自愿报到。</p>\n<p>A里的“report voluntarily”和原文“start looking for work”都在回答这项计划要求失业者采取什么行动，因为两处都涉及失业者到就业中心后的行为，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“report voluntarily”把报到写成自愿行为，而“start looking for work”是领取补助前必须满足的求职条件；两者动作目的不同。 因此“report voluntarily”与“start looking for work”在这里仍有具体差别。</p>\n<p><strong>这里的报到是计划想鼓励的自愿行为，还是附在求职条件后的强制要求？</strong></p>\n<p>不能，原文用Only if把求职、登记和领取补助绑在一起，weekly report也是后续要求；它没有把report写成voluntarily。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[[248,208,900,49],[309,279,806,47],[309,349,933,47],[309,420,965,47],[309,490,847,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"21","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“report voluntarily”和原文“start looking for work”都在回答这项计划要求失业者采取什么行动，因为两处都涉及失业者到就业中心后的行为，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","modifier_attachment"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"start looking for work","visibleOptionAnchor":"report voluntarily"}}}},{"section":"21题","raw":"### B. provide the unemployed with easier access to benefits\n\n> 让失业者更容易获得补助\n\n把B接回题干，它说的是：该计划旨在让失业者更容易获得补助。\n\nB里的“easier access to benefits”和原文“Only if the jobless arrive”都在回答领取补助的条件是否变得更容易，因为Only if直接限定了获得补助前必须完成的事项，所以回看第1段这句话。\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**.\n\n“easier access to benefits”说门槛降低，而“Only if the jobless arrive”后面列出一串前置条件，方向是增加条件，不是简化入口。 因此“easier access to benefits”与“Only if the jobless arrive”在这里仍有具体差别。\n\n**列出简历、网上登记、开始求职和每周报到，能叫作更容易获得补助吗？**\n\n不能，这些是新增或收紧的资格条件，原文没有说失业者可以更容易进入补助体系。\n\n**第一轮判断：B排除。**","html":"<h3>B. provide the unemployed with easier access to benefits</h3>\n<blockquote>\n<p>让失业者更容易获得补助</p>\n</blockquote>\n<p>把B接回题干，它说的是：该计划旨在让失业者更容易获得补助。</p>\n<p>B里的“easier access to benefits”和原文“Only if the jobless arrive”都在回答领取补助的条件是否变得更容易，因为Only if直接限定了获得补助前必须完成的事项，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“easier access to benefits”说门槛降低，而“Only if the jobless arrive”后面列出一串前置条件，方向是增加条件，不是简化入口。 因此“easier access to benefits”与“Only if the jobless arrive”在这里仍有具体差别。</p>\n<p><strong>列出简历、网上登记、开始求职和每周报到，能叫作更容易获得补助吗？</strong></p>\n<p>不能，这些是新增或收紧的资格条件，原文没有说失业者可以更容易进入补助体系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[[248,208,900,49],[309,279,806,47],[309,349,933,47],[309,420,965,47],[309,490,847,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"21","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“easier access to benefits”和原文“Only if the jobless arrive”都在回答领取补助的条件是否变得更容易，因为Only if直接限定了获得补助前必须完成的事项，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Only if the jobless arrive","visibleOptionAnchor":"easier access to benefits"}}}},{"section":"21题","raw":"### C. encourage jobseekers’ active **[xxx]** in job seeking\n\n> 鼓励求职者积极参与求职\n\n把C接回题干，它说的是：该计划旨在鼓励求职者更主动地求职。\n\nC里的“job seeking”和原文“start looking for work”都在回答计划是否把主动求职设为核心条件，因为题干的scheme和原文的求职步骤说的是同一套安排，所以回看第1段这句话。\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**.\n\n“job seeking”与“start looking for work”说的是同一动作，原文还把它放在获得补助的必要条件中，说明计划确实要推动求职者行动起来。 因此“job seeking”与“start looking for work”在这里能接上。\n\n**把开始找工作设为领取补助的条件，是否就是在鼓励积极求职？**\n\n能，简历、网上登记、开始找工作和每周报告共同构成主动求职要求，C概括了这一目的。\n\n**第一轮判断：C保留。**","html":"<h3>C. encourage jobseekers’ active <span class=\"mask\">[xxx]</span> in job seeking</h3>\n<blockquote>\n<p>鼓励求职者积极参与求职</p>\n</blockquote>\n<p>把C接回题干，它说的是：该计划旨在鼓励求职者更主动地求职。</p>\n<p>C里的“job seeking”和原文“start looking for work”都在回答计划是否把主动求职设为核心条件，因为题干的scheme和原文的求职步骤说的是同一套安排，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“job seeking”与“start looking for work”说的是同一动作，原文还把它放在获得补助的必要条件中，说明计划确实要推动求职者行动起来。 因此“job seeking”与“start looking for work”在这里能接上。</p>\n<p><strong>把开始找工作设为领取补助的条件，是否就是在鼓励积极求职？</strong></p>\n<p>能，简历、网上登记、开始找工作和每周报告共同构成主动求职要求，C概括了这一目的。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[[248,208,900,49],[309,279,806,47],[309,349,933,47],[309,420,965,47],[309,490,847,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"21","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“job seeking”和原文“start looking for work”都在回答计划是否把主动求职设为核心条件，因为题干的scheme和原文的求职步骤说的是同一套安排，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"start looking for work","visibleOptionAnchor":"job seeking"}}}},{"section":"21题","raw":"### D. guarantee jobseekers’ legitimate right to benefits\n\n> 保障求职者获得补助的正当权利\n\n把D接回题干，它说的是：该计划旨在保障求职者获得补助的正当权利。\n\nD里的“legitimate right to benefits”和原文“eligible for benefit”都在回答计划是在保障权利还是限定资格，因为eligible for benefit与right to benefits都涉及领取补助，所以回看第1段这句话。\n\n> Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than **[xxx]**.\n\n“legitimate right to benefits”强调无条件保障一项权利，而“eligible for benefit”前面由Only if控制，强调满足条件后才有资格。 因此“legitimate right to benefits”与“eligible for benefit”在这里仍有具体差别。\n\n**只有完成一系列要求才有资格，能等同于保障既有权利吗？**\n\n不能，原文把补助变成有条件的资格，并没有承诺保证求职者的正当权利。\n\n**第一轮判断：D排除。**","html":"<h3>D. guarantee jobseekers’ legitimate right to benefits</h3>\n<blockquote>\n<p>保障求职者获得补助的正当权利</p>\n</blockquote>\n<p>把D接回题干，它说的是：该计划旨在保障求职者获得补助的正当权利。</p>\n<p>D里的“legitimate right to benefits”和原文“eligible for benefit”都在回答计划是在保障权利还是限定资格，因为eligible for benefit与right to benefits都涉及领取补助，所以回看第1段这句话。</p>\n<blockquote>\n<p>Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit—and then they should report weekly rather than <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“legitimate right to benefits”强调无条件保障一项权利，而“eligible for benefit”前面由Only if控制，强调满足条件后才有资格。 因此“legitimate right to benefits”与“eligible for benefit”在这里仍有具体差别。</p>\n<p><strong>只有完成一系列要求才有资格，能等同于保障既有权利吗？</strong></p>\n<p>不能，原文把补助变成有条件的资格，并没有承诺保证求职者的正当权利。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47]],"questionRects":[[248,208,900,49],[309,279,806,47],[309,349,  “Those first few days should be spent looking for work, not looking to sign on,” he claimed. “We’re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.” Help? Really? On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously **[xxx]** system that demands too little effort from the newly unemployed to find work, and **[xxx]** laziness. What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most **[xxx]** claimants received their benefits.\n>\n> 开始精读：\n>\n> More **[xxx]** reasonableness followed. / There will now be a seven-day wait for the jobseeker’s allowance. / “Those first few days should be spent looking for work, not looking to sign on,” he claimed. / “We’re doing these things because we know they help people stay off benefits and help those on benefits get into work faster.” / Help? Really? / On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously **[xxx]** system that demands too little effort from the newly unemployed to find work, and **[xxx]** laziness. / What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most **[xxx]** claimants received their benefits.\n>\n> 顺着英文顺序读：\n>\n> 随后又有更多看起来合理的做法。 / 现在，申领求职者补助要等待七天。 / 他声称：“最初几天应该用来找工作，而不是去登记领取补助。” / “我们这样做，是因为我们知道这能帮助人们不再依赖补助，也能帮助正在领补助的人更快找到工作。” / 帮助？真的吗？ / 乍一听，这似乎是一位关心社会的财政大臣，想让生活变得更好，还配上一套针对明显[xxx]制度的“改革”；在这种说法里，制度要求新失业者付出的求职努力太少，甚至会[xxx]懒惰。 / 我们被要求相信，真正推动他的是对“根本公平”的热情——保护纳税人、控制开支，并确保只有最[xxx]的申请者拿到补助。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>22题</h2>\n<blockquote>\n<p>The phrase “to sign on” (Para. 2) most probably means ______.<br />\n第二段中的“to sign on”最可能是什么意思？</p>\n</blockquote>\n 这样做，是因为我们知道这能帮助人们不再依赖补助，也能帮助正在领补助的人更快找到工作。” / 帮助？真的吗？ / 乍一听，这似乎是一位关心社会的财政大臣，想让生活变得更好，还配上一套针对明显[xxx]制度的“改革”；在这种说法里，制度要求新失业者付出的求职努力太少，甚至会[xxx]懒惰。 / 我们被要求相信，真正推动他的是对“根本公平”的热情——保护纳税人、控制开支，并确保只有最[xxx]的申请者拿到补助。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"question","qid":"22"}},{"section":"22题","raw":"### A. to register for an **[xxx]** from the government\n\n> 向政府登记领取某项补助\n\n把A接回题干，它说的是：“to sign on”是向政府登记领取补助。\n\nA里的“register for”和原文“jobseeker’s allowance”都在回答sign on在这一制度里对应什么办理动作，因为前一句先给出jobseeker’s allowance，后一句把sign on和最初几天联系起来，所以回看第2段这句话。\n\n> There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed.\n\n“register for”是办理登记，“jobseeker’s allowance”是紧邻的政府补助；放回语境就是去登记申领这项补助。 因此“register for”与“jobseeker’s allowance”在这里能接上。\n\n**在刚提到求职者补助后，sign on最自然地指向登记申领它吗？**\n\n能，前后句连续谈七天等待和最初几天不要去sign on，A把这一办理动作说清楚。\n\n**第一轮判断：A保留。**","html":"<h3>A. to register for an <span class=\"mask\">[xxx]</span> from the government</h3>\n<blockquote>\n<p>向政府登记领取某项补助</p>\n</blockquote>\n<p>把A接回题干，它说的是：“to sign on”是向政府登记领取补助。</p>\n<p>A里的“register for”和原文“jobseeker’s allowance”都在回答sign on在这一制度里对应什么办理动作，因为前一句先给出jobseeker’s allowance，后一句把sign on和最初几天联系起来，所以回看第2段这句话。</p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“register for”是办理登记，“jobseeker’s allowance”是紧邻的政府补助；放回语境就是去登记申领这项补助。 因此“register for”与“jobseeker’s allowance”在这里能接上。</p>\n<p><strong>在刚提到求职者补助后，sign on最自然地指向登记申领它吗？</strong></p>\n<p>能，前后句连续谈七天等待和最初几天不要去sign on，A把这一办理动作说清楚。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"22","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“register for”和原文“jobseeker’s allowance”都在回答sign on在这一制度里对应什么办理动作，因为前一句先给出jobseeker’s allowance，后一句把sign on和最初几天联系起来，所以回看第2段这句话。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"jobseeker’s allowance","visibleOptionAnchor":"register for"}}}},{"section":"22题","raw":"### B. to accept the government’s restrictions on the allowance\n\n> 接受政府对补助的限制\n\n把B接回题干，它说的是：“to sign on”是接受政府对补助的限制。\n\nB里的“government’s restrictions”和原文“looking to sign on”都在回答sign on描述的是办理动作还是接受规则，因为同一句把looking to sign on与looking for work并列为两种动作，所以回看第2段这句话。\n\n> “Those first few days should be spent looking for work, not looking to sign on,” he claimed.\n\n“accept the restrictions”是一种态度或同意关系，而“looking to sign on”是人准备去做的一项具体行为，动作性质不同。 因此“government’s restrictions”与“looking to sign on”在这里仍有具体差别。\n\n**一个人去sign on，原文是在说他同意限制，还是去办理某件事？**\n\n不能，句子比较的是最初几天去找工作还是去sign on，没有出现接受政府限制的意思。\n\n**第一轮判断：B排除。**","html":"<h3>B. to accept the government’s restrictions on the allowance</h3>\n<blockquote>\n<p>接受政府对补助的限制</p>\n</blockquote>\n<p>把B接回题干，它说的是：“to sign on”是接受政府对补助的限制。</p>\n<p>B里的“government’s restrictions”和原文“looking to sign on”都在回答sign on描述的是办理动作还是接受规则，因为同一句把looking to sign on与looking for work并列为两种动作，所以回看第2段这句话。</p>\n<blockquote>\n<p>“Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“accept the restrictions”是一种态度或同意关系，而“looking to sign on”是人准备去做的一项具体行为，动作性质不同。 因此“government’s restrictions”与“looking to sign on”在这里仍有具体差别。</p>\n<p><strong>一个人去sign on，原文是在说他同意限制，还是去办理某件事？</strong></p>\n<p>不能，句子比较的是最初几天去找工作还是去sign on，没有出现接受政府限制的意思。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"22","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“government’s restrictions”和原文“looking to sign on”都在回答sign on描述的是办理动作还是接受规则，因为同一句把looking to sign on与looking for work并列为两种动作，所以回看第2段这句话。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"looking to sign on","visibleOptionAnchor":"government’s restrictions"}}}},{"section":"22题","raw":"### C. to check on the availability of jobs at the jobcentre\n\n> 到就业中心查看有没有工作\n\n把C接回题干，它说的是：“to sign on”是到就业中心查询岗位。\n\nC里的“availability of jobs”和原文“jobseeker’s allowance”都在回答sign on是否等于查找工作机会，因为前一句的jobseeker’s allowance限定了后一句的制度语境，所以回看第2段这句话。\n\n> There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed.\n\n“check on jobs”属于looking for work，而“jobseeker’s allowance”对应的是另一项办理补助的活动；原句正把二者分开。 因此“availability of jobs”与“jobseeker’s allowance”在这里仍有具体差别。\n\n**原文已经把looking for work和looking to sign on对举，sign on还能再等于找工作吗？**\n\n不能，若sign on就是查岗位，句中的“找工作，而不是sign on”会变成同一动作自我对立。\n\n**第一轮判断：C排除。**","html":"<h3>C. to check on the availability of jobs at the jobcentre</h3>\n<blockquote>\n<p>到就业中心查看有没有工作</p>\n</blockquote>\n<p>把C接回题干，它说的是：“to sign on”是到就业中心查询岗位。</p>\n<p>C里的“availability of jobs”和原文“jobseeker’s allowance”都在回答sign on是否等于查找工作机会，因为前一句的jobseeker’s allowance限定了后一句的制度语境，所以回看第2段这句话。</p>\n<blockquote>\n<p>There will now be a seven-day wait for the jobseeker’s allowance. “Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“check on jobs”属于looking for work，而“jobseeker’s allowance”对应的是另一项办理补助的活动；原句正把二者分开。 因此“availability of jobs”与“jobseeker’s allowance”在这里仍有具体差别。</p>\n<p><strong>原文已经把looking for work和looking to sign on对举，sign on还能再等于找工作吗？</strong></p>\n<p>不能，若sign on就是查岗位，句中的“找工作，而不是sign on”会变成同一动作自我对立。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"22","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“availability of jobs”和原文“jobseeker’s allowance”都在回答sign on是否等于查找工作机会，因为前一句的jobseeker’s allowance限定了后一句的制度语境，所以回看第2段这句话。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","visible_link"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"jobseeker’s allowance","visibleOptionAnchor":"availability of jobs"}}}},{"section":"22题","raw":"### D. to attend a governmental job-training program\n\n> 参加政府就业培训项目\n\n把D接回题干，它说的是：“to sign on”是参加政府就业培训。\n\nD里的“job-training program”和原文“looking to sign on”都在回答这一短语是否指向培训项目，因为题干问具体含义，而原文只把sign on写成与求职相对的办理动作，所以回看第2段这句话。\n\n> “Those first few days should be spent looking for work, not looking to sign on,” he claimed.\n\n“job-training program”需要出现培训、课程或参加项目的信息，“looking to sign on”周围只有补助等待与求职，没有培训对象。 因此“job-training program”与“looking to sign on”在这里仍有具体差别。\n\n**没有任何training或program信息，能把sign on解释成参加培训吗？**\n\n不能，D增加了原文没有出现的项目和培训内容。\n\n**第一轮判断：D排除。**","html":"<h3>D. to attend a governmental job-training program</h3>\n<blockquote>\n<p>参加政府就业培训项目</p>\n</blockquote>\n<p>把D接回题干，它说的是：“to sign on”是参加政府就业培训。</p>\n<p>D里的“job-training program”和原文“looking to sign on”都在回答这一短语是否指向培训项目，因为题干问具体含义，而原文只把sign on写成与求职相对的办理动作，所以回看第2段这句话。</p>\n<blockquote>\n<p>“Those first few days should be spent looking for work, not looking to sign on,” he claimed.</p>\n</blockquote>\n<p>“job-training program”需要出现培训、课程或参加项目的信息，“looking to sign on”周围只有补助等待与求职，没有培训对象。 因此“job-training program”与“looking to sign on”在这里仍有具体差别。</p>\n<p><strong>没有任何training或program信息，能把sign on解释成参加培训吗？</strong></p>\n<p>不能，D增加了原文没有出现的项目和培训内容。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"22","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“job-training program”和原文“looking to sign on”都在回答这一短语是否指向培训项目，因为题干问具体含义，而原文只把sign on写成与求职相对的办理动作，所以回看第2段这句话。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"looking to sign on","visibleOptionAnchor":"job-training program"}}}},{"section":"22题","raw":"### 22题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **22题选A。**","html":"<h3>22题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>22题选A。</strong></p>\n</blockquote>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[248,629,1126,50],[308,701,862,48],[309,772,971,47],[309,842,892,48],[309,913,810,47],[248,1054,950,47]],"scrollTarget":null,"meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> What prompted the chancellor to develop his scheme?  \n> 是什么促使财政大臣制定这一计划？\n\n题干已经给出chancellor这个人物或对象，第2段也出现chancellor，所以把第2段从头到尾读完。\n\n第2段前面已经完整读过，这里直接沿用刚才读清的整段关系，再进入A—D逐项比较。","html":"<h2>23题</h2>\n<blockquote>\n<p>What prompted the chancellor to develop his scheme?<br />\n是什么促使财政大臣制定这一计划？</p>\n</blockquote>\n<p>题干已经给出chancellor这个人物或对象，第2段也出现chancellor，所以把第2段从头到尾读完。</p>\n<p>第2段前面已经完整读过，这里直接沿用刚才读清的整段关系，再进入A—D逐项比较。</p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[308,1124,681,39],[309,1195,719,47],[309,1265,721,47],[309,1335,749,48],[248,1476,1211,49]],"scrollTarget":null,"meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. A desire to secure a **[xxx]** life for all.\n\n> 希望让所有人过上更好的生活\n\n把A接回题干，它说的是：推动财政大臣的是让所有人生活更好的愿望。\n\nA里的“life for all”和原文“change lives for the better”都在回答财政大臣公开呈现的动机是什么，因为选项和原文都出现改善生活这一说法，所以回看第2段这句话。\n\n> On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously **[xxx]** system.\n\n“secure a life for all”与“change lives for the better”方向接近；但原文用On first hearing把它放在表面印象里，后面还要继续解释真正动机。 因此“life for all”与“change lives for the better”在这里能接上。\n\n**第一遍只读到“change lives for the better”，能否立刻判断这就是作者认定的真实推动力？**\n\n还不能，这一说法确实出现在原文并与A接得上，但On first hearing提示它可能只是表面形象，局部还没有把表面与真实完全拉开。\n\n**第一轮判断：A保留。**","html":"<h3>A. A desire to secure a <span class=\"mask\">[xxx]</span> life for all.</h3>\n<blockquote>\n<p>希望让所有人过上更好的生活</p>\n</blockquote>\n<p>把A接回题干，它说的是：推动财政大臣的是让所有人生活更好的愿望。</p>\n<p>A里的“life for all”和原文“change lives for the better”都在回答财政大臣公开呈现的动机是什么，因为选项和原文都出现改善生活这一说法，所以回看第2段这句话。</p>\n<blockquote>\n<p>On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with “reforms” to an obviously <span class=\"mask\">[xxx]</span> system.</p>\n</blockquote>\n<p>“secure a life for all”与“change lives for the better”方向接近；但原文用On first hearing把它放在表面印象里，后面还要继续解释真正动机。 因此“life for all”与“change lives for the better”在这里能接上。</p>\n<p><strong>第一遍只读到“change lives for the better”，能否立刻判断这就是作者认定的真实推动力？</strong></p>\n<p>还不能，这一说法确实出现在原文并与A接得上，但On first hearing提示它可能只是表面形象，局部还没有把表面与真实完全拉开。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[308,1124,681,39],[309,1195,719,47],[309,1265,721,47],[309,1335,749,48],[248,1476,1211,49]],"scrollTarget":null,"meta":{"kind":"option","qid":"23","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“life for all”和原文“change lives for the better”都在回答财政大臣公开呈现的动机是什么，因为选项和原文都出现改善生活这一说法，所以回看第2段这句话。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"change lives for the better","visibleOptionAnchor":"life for all"}}}},{"section":"23题","raw":"### B. An eagerness to protect the unemployed.\n\n> 急于保护失业者\n\n把B接回题干，它说的是：推动财政大臣的是保护失业者的热切愿望。\n\nB里的“protect the unemployed”和原文“protecting the taxpayer”都在回答他要保护的对象是谁，因为protect在选项和原文中都出现，但对象需要核对，所以回看第2段这句话。\n\n> What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most **[xxx]** claimants received their benefits.\n\n“protect the unemployed”把保护对象写成失业者，而“protecting the taxpayer”明确写成纳税人，主体动作相似、对象却相反。 因此“protect the unemployed”与“protecting the taxpayer”在这里仍有具体差别。\n\n**原文明确说protecting the taxpayer，B能把对象换成the unemployed吗？**\n\n不能，关键对象已经完整可见，B改换了被保护的人。\n\n**第一轮判断：B排除。**","html":"<h3>B. An eagerness to protect the unemployed.</h3>\n<blockquote>\n<p>急于保护失业者</p>\n</blockquote>\n<p>把B接回题干，它说的是：推动财政大臣的是保护失业者的热切愿望。</p>\n<p>B里的“protect the unemployed”和原文“protecting the taxpayer”都在回答他要保护的对象是谁，因为protect在选项和原文中都出现，但对象需要核对，所以回看第2段这句话。</p>\n<blockquote>\n<p>What motivated him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n</blockquote>\n<p>“protect the unemployed”把保护对象写成失业者，而“protecting the taxpayer”明确写成纳税人，主体动作相似、对象却相反。 因此“protect the unemployed”与“protecting the taxpayer”在这里仍有具体差别。</p>\n<p><strong>原文明确说protecting the taxpayer，B能把对象换成the unemployed吗？</strong></p>\n<p>不能，关键对象已经完整可见，B改换了被保护的人。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[308,1124,681,39],[309,1195,719,47],[309,1265,721,47],[309,1335,749 ed him, we were to understand, was his zeal for “fundamental fairness”—protecting the taxpayer, controlling spending and ensuring that only the most <span class=\"mask\">[xxx]</span> claimants received their benefits.</p>\n</blockquote>\n<p>“generous to the claimants”要求放宽和多给，而“controlling spending”并且只让most deserving claimants领取，方向是收紧。 因此“generous to the claimants”与“controlling spending”在这里仍有具体差别。</p>\n<p><strong>控制开支并限定最值得的人领取，能叫作对申请者慷慨吗？</strong></p>\n<p>不能，原文的动作方向与generous相反。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[308,1124,681,39],[309,1195,719,47],[309,1265,721,47],[309,1335,749,48],[248,1476,1211,49]],"scrollTarget":null,"meta":{"kind":"option","qid":"23","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“generous to the claimants”和原文“controlling spending”都在回答计划动机是扩大给付还是控制给付，因为claimants在两处相同，真正差别在对他们采取的方向，所以回看第2段这句话。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"controlling spending","visibleOptionAnchor":"generous to the claimants"}}}},{"section":"23题","raw":"### D. A passion to ensure fairness for taxpayers.\n\n> 热衷于确保纳税人的公平\n\n把D接回题干，它说的是：推动财政大臣的是确保纳税人公平的热情。\n\nD里的“fairness employment benefits should not be made conditional.**\n\n失业补助不应附加条件。\n\nB. **The British welfare system indulges jobseekers’ laziness.**\n\n英国福利制度纵容求职者懒惰。\n\nC. **The jobseekers’ allowance has met their actual needs.**\n\n求职者补助已经满足了他们的实际需要。\n\nD. **Osborne’s reforms will reduce the risk of unemployment.**\n\n奥斯本的改革将降低失业风险。","html":"<h2>25题</h2>\n<p><strong>To which of the following would the author most probably agree?</strong></p>\n<p>作者最可能同意以下哪一项？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Unemployment benefits should not be made conditional.</strong></p>\n<p>失业补助不应附加条件。</p>\n<p>B. <strong>The British welfare system indulges jobseekers’ laziness.</strong></p>\n<p>英国福利制度纵容求职者懒惰。</p>\n<p>C. <strong>The jobseekers’ allowance has met their actual needs.</strong></p>\n<p>求职者补助已经满足了他们的实际需要。</p>\n<p>D. <strong>Osborne’s reforms will reduce the risk of unemployment.</strong></p>\n<p>奥斯本的改革将降低失业风险。</p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47],[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39],[302,1195,1252,47],[222,1249,1331,48],[223,1304,1331,48],[223,1359,1330,47],[222,1414,1332,47],[222,1469,1332,47],[221,1523,1332,48],[222,1578,407,47],[301,1633,1253,47],[222,1684,1333,55],[222,1743,1332,47],[221,1797,1332,47],[222,1852,1332,48],[221,1907,1333,47],[224,1960,1330,49],[221,2017,1332,47],[222,2070,1329,48],[222,2126,1331,48],[223,2181,744,47]],"questionRects":[[309,2040,980,47],[309,2110,930,47],[309,2181,988,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍奥斯本的求职计划：领补助前必须带简历、网上登记、开始求职并每周报到 | 先摆出一项看似合理的新安排 |\n| 2 | 继续列出七天等待和“帮助就业”的说法，随后转而追问其动机并落到纳税人和开支 | 再把表面说法拆开来看 |\n| 3 | 详细写失业带来的经济恐惧、心理难堪、工作身份丧失以及基本收入消失 | 接着放入现实处境作对照 |\n| 4 | 批评奥斯本把失业者想成依赖者，并指出福利从保险权利变成附条件、限时且很低的补助 | 最后下结论：原先说法已经变了 |\n\n先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>介绍奥斯本的求职计划：领补助前必须带简历、网上登记、开始求职并每周报到</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>继续列出七天等待和“帮助就业”的说法，随后转而追问其动机并落到纳税人和开支</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>详细写失业带来的经济恐惧、心理难堪、工作身份丧失以及基本收入消失</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>批评奥斯本把失业者想成依赖者，并指出福利从保险权利变成附条件、限时且很低的补助</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47],[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39],[302,1195,1252,47],[222,1249,1331,48],[223,1304,1331,48],[223,1359,1330,47],[222,1414,1332,47],[222,1469,1332,47],[221,1523,1332,48],[222,1578,407,47],[301,1633,1253,47],[222,1684,1333,55],[222,1743,1332,47],[221,1797,1332,47],[222,1852,1332,48],[221,1907,1333,47],[224,1960,1330,49],[221,2017,1332,47],[222,2070,1329,48],[222,2126,1331,48],[223,2181,744,47]],"questionRects":[[309,2040,980,47],[309,2110,930,47],[309,2181,988,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"### A. Unemployment benefits should not be made conditional.\n\n> 失业补助不应附加条件。\n\n如果A是主旨，全文应当围绕“失业补助不应附加条件”展开，并让每一段都服务于这一中心。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍附条件补助带来的新限制 | 先摆出一项看似合理的新安排 |\n| 2 | 说明政府为这些限制给出的理由 | 再把表面说法拆开来看 |\n| 3 | 写失业者的现实困难说明限制不合理 | 接着放入现实处境作对照 |\n| 4 | 最后主张恢复失业保险式的无条件权利 | 最后下结论：原先说法已经变了 |\n\nA与全文推进完全一致：全文先摆出奥斯本方案的合理外观，再揭开保护纳税人和控制开支的动机，随后写失业者的真实痛苦，最后批评补助从保险权利变成有条件的限时给付。它能够覆盖每一段，而不是只覆盖一个局部例子。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. Unemployment benefits should not be made conditional.</h3>\n<blockquote>\n<p>失业补助不应附加条件。</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕“失业补助不应附加条件”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍附条件补助带来的新限制</td>\n<td>先摆出一项看似合理的新安排</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明政府为这些限制给出的理由</td>\n<td>再把表面说法拆开来看</td>\n</tr>\n<tr>\n<td>3</td>\n<td>写失业者的现实困难说明限制不合理</td>\n<td>接着放入现实处境作对照</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后主张恢复失业保险式的无条件权利</td>\n<td>最后下结论：原先说法已经变了</td>\n</tr>\n</tbody>\n</table>\n<p>A与全文推进完全一致：全文先摆出奥斯本方案的合理外观，再揭开保护纳税人和控制开支的动机，随后写失业者的真实痛苦，最后批评补助从保险权利变成有条件的限时给付。它能够覆盖每一段，而不是只覆盖一个局部例子。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[303,316,1251,49],[222,371,1326,49],[223,427,1330,48],[218,482,1336,47],[222,537,1331,47],[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39],[302,1195,1252,47],[222,1249,1331,48],[223,1304,1331,48],[223,1359,1330,47],[222,1414,1332,47],[222,1469,1332,47],[221 estionRects":[[309,2040,980,47],[309,2110,930,47],[309,2181,988,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_result","qid":"25"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查23题：A还是D？\n\n第一遍留下：\n\n- A. A desire to secure a better life for all.\n- D. A passion to ensure fairness for taxpayers.\n\n主旨底牌是：\n\n> **Unemployment benefits should not be made conditional / 失业补助不应附加条件**\n\n也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。\n\n第一遍看第二段时，A和D都有明确抓手。A能接上“change lives for the better”，而D能接上“fundamental fairness—protecting the taxpayer”。麻烦在于，这一段先用On first hearing摆出一个关心失业者的财政大臣形象，随后才用What motivated him重新说明动机；如果快速读，两个说法都像答案，所以第一遍把A和D同时留下。\n\n我们先把题干和两个选项接起来。\n\n题干问的是“什么促使财政大臣制定计划”。A把原因写成改善所有人的生活，D把原因写成确保纳税人的公平。两项都不是凭空出现：A来自前面的公开说法，D来自后面的明确解释。真正需要解决的不是哪个词在原文出现，而是哪一句承担作者最终认定的motivation。\n\n现在拿主旨来检查。\n\n先看A。主旨题已经把全文固定为“失业补助不应附加条件”。为了完成这一批评，作者必须先展示政府如何把收紧补助包装成关心失业者。A正好属于这种包装：change lives for the better出现在On first hearing之后，作者马上用Help? Really?拆掉这一表面形象。若A是真正动机，后文应继续证明改革如何让所有人生活更好；实际却转向纳税人、开支和“最值得”的申请者，并用整段现实痛苦反驳政府的假设。\n\n再看D。D对应What motivated him was his zeal for “fundamental fairness”这一直接判断，后面的protecting the taxpayer又把fairness的对象说清楚。它也能解释全文为什么要写失业者的恐惧和福利权利被条件化：作者正是在比较政府口中的纳税人公平，与失业者实际失去的保险权利。D既接回局部语法，也与主旨中的批评方向一致。\n\n第一遍保留A，是因为它复现了政府的口号；主旨确定后，口号和作者认可的动机被分开了。A只能解释表面宣传，D才能解释方案为什么收紧补助以及全文为何要反驳它。\n\n> **23题选D。**","html":"<h2>回查23题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. A desire to secure a better life for all.</li>\n<li>D. A passion to ensure fairness for taxpayers.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Unemployment benefits should not be made conditional / 失业补助不应附加条件</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍看第二段时，A和D都有明确抓手。A能接上“change lives for the better”，而D能接上“fundamental fairness—protecting the taxpayer”。麻烦在于，这一段先用On first hearing摆出一个关心失业者的财政大臣形象，随后才用What motivated him重新说明动机；如果快速读，两个说法都像答案，所以第一遍把A和D同时留下。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问的是“什么促使财政大臣制定计划”。A把原因写成改善所有人的生活，D把原因写成确保纳税人的公平。两项都不是凭空出现：A来自前面的公开说法，D来自后面的明确解释。真正需要解决的不是哪个词在原文出现，而是哪一句承担作者最终认定的motivation。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。主旨题已经把全文固定为“失业补助不应附加条件”。为了完成这一批评，作者必须先展示政府如何把收紧补助包装成关心失业者。A正好属于这种包装：change lives for the better出现在On first hearing之后，作者马上用Help? Really?拆掉这一表面形象。若A是真正动机，后文应继续证明改革如何让所有人生活更好；实际却转向纳税人、开支和“最值得”的申请者，并用整段现实痛苦反驳政府的假设。</p>\n<p>再看D。D对应What motivated him was his zeal for “fundamental fairness”这一直接判断，后面的protecting the taxpayer又把fairness的对象说清楚。它也能解释全文为什么要写失业者的恐惧和福利权利被条件化：作者正是在比较政府口中的纳税人公平，与失业者实际失去的保险权利。D既接回局部语法，也与主旨中的批评方向一致。</p>\n<p>第一遍保留A，是因为它复现了政府的口号；主旨确定后，口号和作者认可的动机被分开了。A只能解释表面宣传，D才能解释方案为什么收紧补助以及全文为何要反驳它。</p>\n<blockquote>\n<p><strong>23题选D。</strong></p>\n</blockquote>\n","articleRects":[[302,592,1252,47],[222,645,1333,49],[222,700,1332,50],[222,756,1332,47],[222,809,1332,49],[222,864,1332,49],[222,921,1332,47],[222,975,1332,48],[222,1025,1328,57],[222,1085,1332,47],[222,1140,228,39]],"questionRects":[[308,1124,681,39],[309,1195,719,47],[30
