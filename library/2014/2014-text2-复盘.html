c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把一个增速比较项改成择业的直接推动力，改变了\u003ccode>inflation\u003c/code>在段落中的关系。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把后文用来揭示落差的就业结果改成前面的入行动因，错接了因果链的前后位置。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>保持了“高收入—吸引学生入行”的因果，并不保证所有毕业生后来都能得到相同回报。\u003c/p>\n\u003ch2>27题\u003c/h2>\n\u003cblockquote>\n\u003cp>Which of the following adds to the costs of legal education in most American states?\u003cbr>在美国多数州，以下哪一项增加了法律教育成本？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>教育成本细节题。第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\u003c/p>\n\u003ch3>A. Higher tuition fees for undergraduate studies.\u003c/h3>\n\u003cblockquote>\n\u003cp>本科阶段更高的学费\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>A\u003c/code>改变了成本来源，把额外阶段写成了价格上涨”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>Higher tuition fees\u003c/code>需要一个比较：本科的学费比过去或其他教育阶段更高。原文只给\u003ccode>four-year undergraduate degree\u003c/code>的学制及先修要求，没有学费上涨或本科更贵的比较。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>在教育成本话题中增加了学费高低的比较，未准确概括原文的额外学历要求。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国多数州，增加法律教育成本的因素是本科阶段更高的学费。\u003c/p>\n\u003c/blockquote>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>Higher tuition fees\u003c/code>需要一个比较：本科的学费比过去或其他教育阶段更高。原文只给\u003ccode>four-year undergraduate degree\u003c/code>的学制及先修要求，没有学费上涨或本科更贵的比较。\u003c/p>\n\u003cp>本科会产生费用，不能直接推出费用“更高”。下一段提出本科直接学法，针对的是重复或额外的教育年限，并不要求先证明本科收费水平上涨。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>在教育成本话题中增加了学费高低的比较，未准确概括原文的额外学历要求。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Higher tuition fees charged for undergraduate studies increase the cost of legal education.\u003c/p>\n\u003cp>本科阶段收取更高的学费，使法律教育成本增加。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，应说明本科收费的比较对象或涨幅，并使降低本科收费成为对应办法。实际先列四年无关专业、再三年法律的顺序，改革也从改变学习路径入手；文章诊断的是多读一段教育，未报告收费水平变高。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文把法律教育成本视作行业问题的一项成因。本题应找制度额外要求学生完成的教育环节；主旨本身不能辨别学费比较、批准对象或培训提供者，仍需核对第3段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Higher tuition fees for undergraduate studies.\u003cbr>本科阶段更高的学费\u003c/p>\n\u003c/blockquote>\n\u003cp>高成本主旨不能为\u003ccode>Higher\u003c/code>自动提供证据。作者提出缩短或整合教育路径可以减债，与“本科收费比别处高”是不同诊断；\u003ccode>A\u003c/code>虽然同谈费用，却没有第3段所需的比较依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. Pursuing a bachelor’s degree in another major.\u003c/h3>\n\u003cblockquote>\n\u003cp>先攻读另一个专业的学士学位\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>保留。当时选项显示为“\u003ccode>Pursuing a bachelor’s degree in\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>major\u003c/code>.”。当时的判断依据是：“能，\u003ccode>B\u003c/code>准确概括了额外的本科路径”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>bachelor’s degree\u003c/code>对应\u003ccode>four-year undergraduate degree\u003c/code>，\u003ccode>another major\u003c/code>对应\u003ccode>in some unrelated subject\u003c/code>。原文先列这一学位，再列法律学位，明确多了一段无关专业的本科教育。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了“先完成另一个专业的学位，再读法律”的顺序和成本来源。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国多数州，增加法律教育成本的因素是先攻读另一个专业的学士学位。\u003c/p>\n\u003c/blockquote>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>bachelor’s degree\u003c/code>对应\u003ccode>four-year undergraduate degree\u003c/code>，\u003ccode>another major\u003c/code>对应\u003ccode>in some unrelated subject\u003c/code>。原文先列这一学位，再列法律学位，明确多了一段无关专业的本科教育。\u003c/p>\n\u003cp>\u003ccode>just one path\u003c/code>说明这不是学生自愿选择的额外兴趣课程，而是在多数州取得律师资格的既定路径。它增加时间与费用，随后\u003ccode>on top of undergraduate debts\u003c/code>又将本科债务算入总负担。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了“先完成另一个专业的学位，再读法律”的顺序和成本来源。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Students must first obtain a bachelor’s degree in another major before beginning their law degree.\u003c/p>\n\u003cp>学生必须先取得另一个专业的学士学位，才能开始攻读法律学位。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>要求先有其他专业学位、后有法律学位，原文\u003ccode>then\u003c/code>正连接两段教育。下一段允许本科直接学法的建议，也正好消除这一先修环节；原因与改法能够前后对应。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文把法律教育成本视作行业问题的一项成因。本题应找制度额外要求学生完成的教育环节；主旨本身不能辨别学费比较、批准对象或培训提供者，仍需核对第3段。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Pursuing a bachelor’s degree in another major.\u003cbr>先攻读另一个专业的学士学位\u003c/p>\n\u003c/blockquote>\n\u003cp>全文需要用教育路径解释高债务，\u003ccode>B\u003c/code>所指出的先修本科既在第3段被列入唯一路径，也在第4段得到针对性改革。它不是泛称“教育很贵”，而是找到主旨问题下可减少的一项制度负担。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. Admissions approval from the bar association.\u003c/h3>\n\u003cblockquote>\n\u003cp>由律师协会批准个人入学\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>C\u003c/code>把修饰对象从学校换成了申请人”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>Admissions approval\u003c/code>指协会批准个人入学。原文\u003ccode>authorized by the American Bar Association\u003c/code>修饰的是200 \u003ccode>law schools\u003c/code>，意思是协会授权或认可这些法学院。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留了协会和授权两个词，却把授权对象从学校换成学生的入学。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国多数州，增加法律教育成本的因素是由律师协会批准个人入学。\u003c/p>\n\u003c/blockquote>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>Admissions approval\u003c/code>指协会批准个人入学。原文\u003ccode>authorized by the American Bar Association\u003c/code>修饰的是200 \u003ccode>law schools\u003c/code>，意思是协会授权或认可这些法学院。\u003c/p>\n\u003cp>学生在这些学校取得法律学位，与学生自己要向协会申请入学批准不是同一程序。句中没有个人获批的申请费或审批支出。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留了协会和授权两个词，却把授权对象从学校换成学生的入学。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Students must obtain admissions approval from the bar association before entering law school.\u003c/p>\n\u003cp>学生进入法学院之前必须取得律师协会的入学批准。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>C\u003c/code>成立，路径中应出现学生向协会申请并获准入学的环节。实际作者列的是在被协会授权的学校读学位，下一段讨论本科直接学法与提前考试，也没有提出取消个人审批；假设新增了程序及对象。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文把法律教育成本视作行业问题的一项成因。本题应找制度额外要求学生完成的教育环节；主旨本身不能辨别学费比较、批准对象或培训提供者，仍需核对第3段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Admissions approval from the bar association.\u003cbr>由律师协会批准个人入学\u003c/p>\n\u003c/blockquote>\n\u003cp>教育改革主旨允许讨论制度成本，但不能据此将学校授权扩大为个人入学审批。全文明确改动的是教育年限和考试资格，\u003ccode>C\u003c/code>把另一种未被报告的程序加进了问题诊断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. Receiving training by professional associations.\u003c/h3>\n\u003cblockquote>\n\u003cp>接受专业协会培训\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>D\u003c/code>把考试准备的实施者补成了专业协会”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>by professional associations\u003c/code>指定培训由职业协会提供。原文只有\u003ccode>an expensive preparation for the bar exam\u003c/code>，说明为考试做昂贵准备，并没有说明由谁开班。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将相邻的协会与备考信息拼成“接受协会培训”，补出了原文缺失的施教主体。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国多数州，增加法律教育成本的因素是接受专业协会培训。\u003c/p>\n\u003c/blockquote>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>by professional associations\u003c/code>指定培训由职业协会提供。原文只有\u003ccode>an expensive preparation for the bar exam\u003c/code>，说明为考试做昂贵准备，并没有说明由谁开班。\u003c/p>\n\u003cp>协会名称出现在前面的学校授权关系中，不能越过句内对象，把协会改作备考培训的提供者。准备考试本身也未被说成协会组织的必修培训。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将相邻的协会与备考信息拼成“接受协会培训”，补出了原文缺失的施教主体。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003cp>第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Receiving training provided by professional associations adds to students’ legal education costs.\u003c/p>\n\u003cp>接受由职业协会提供的培训增加了学生的法律教育成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>成立时应交代协会开设培训、学生参加并承担费用。文章实际区分授权学校和准备考试两件事，改革段也只谈更早参加考试；把协会作为培训提供者，会改写作者列出的教育路径。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文把法律教育成本视作行业问题的一项成因。本题应找制度额外要求学生完成的教育环节；主旨本身不能辨别学费比较、批准对象或培训提供者，仍需核对第3段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Receiving training by professional associations.\u003cbr>接受专业协会培训\u003c/p>\n\u003c/blockquote>\n\u003cp>高成本主旨只说明需要寻找负担来源，不能证明哪家机构提供培训。\u003ccode>D\u003c/code>的\u003ccode>professional associations\u003c/code>是决定真假的新增信息；最终仍须依据\u003ccode>for the bar exam\u003c/code>只表备考目的来排除。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>27题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>27. B. Pursuing a bachelor’s degree in another major.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>在教育成本话题中增加了学费高低的比较，未准确概括原文的额外学历要求。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了“先完成另一个专业的学位，再读法律”的顺序和成本来源。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留了协会和授权两个词，却把授权对象从学校换成学生的入学。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将相邻的协会与备考信息拼成“接受协会培训”，补出了原文缺失的施教主体。\u003c/p>\n\u003ch2>28题\u003c/h2>\n\u003cblockquote>\n\u003cp>Hindrance to the reform of the legal system originates from ______.\u003cbr>法律体系改革的阻力来自哪里？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>改革阻力原因题。第4段先肯定改革会帮助律师和客户，再以\u003ccode>but\u003c/code>指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的顺序是改革有益、方案早已有之、管理机构保守，随后给本科直接学法和提前考试两项措施。考试若足够严格，反而可以作为减少不必要学习年限的理由。\u003c/p>\n\u003ch3>A. non-professionals’ sharp criticism\u003c/h3>\n\u003cblockquote>\n\u003cp>非专业人士的尖锐批评\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>A\u003c/code>更换了主体，段落说的是职业监管机构”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>提出非业内人士的尖锐批评。第4段所说的阻力主体是\u003ccode>state-level bodies that govern the profession\u003c/code>，即管理法律职业的州级机构，并不是行业外评论者。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>新增了批评者身份、批评行为和阻碍改革的因果，不能由文章开头客户抱怨补成。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法律体系改革的阻力来自非专业人士的尖锐批评。\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以\u003ccode>but\u003c/code>指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>提出非业内人士的尖锐批评。第4段所说的阻力主体是\u003ccode>state-level bodies that govern the profession\u003c/code>，即管理法律职业的州级机构，并不是行业外评论者。\u003c/p>\n\u003cp>\u003ccode>customers\u003c/code>是改革的受益者之一，文中没有说他们或其他外行发表\u003ccode>sharp criticism\u003c/code>，更没有把这样的批评接成方案不能执行的原因。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>新增了批评者身份、批评行为和阻碍改革的因果，不能由文章开头客户抱怨补成。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以but指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的顺序是改革有益、方案早已有之、管理机构保守，随后给本科直接学法和提前考试两项措施。考试若足够严格，反而可以作为减少不必要学习年限的理由。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Sharp criticism from non-professionals has prevented reforms from being implemented.\u003c/p>\n\u003cp>非业内人士的尖锐批评阻止了改革措施的实施。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设应写外部批评怎样影响决策，或如何使机构撤回方案。实际作者在\u003ccode>but\u003c/code>后直接归因于监管机构的保守，接着继续展示合理措施，没有进入外部批评的故事线。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主张改革行业的高成本，本题应找谁阻止有益改法被执行。主旨只能确定存在改革障碍，具体主体由第4段的state-level bodies及too conservative to implement落实。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>non-professionals’ sharp criticism\u003cbr>非专业人士的尖锐批评\u003c/p>\n\u003c/blockquote>\n\u003cp>客户有理由抱怨是改革的背景，不是抵制改革的证据。\u003ccode>A\u003c/code>将行业之外的人设为阻力来源，无法与全文鼓励开放、改善客户服务的推进及第4段明示主体相接。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. lawyers’ and clients’ strong resistance\u003c/h3>\n\u003cblockquote>\n\u003cp>律师和客户的强烈抵制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>B\u003c/code>把受益者改成了反对者”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把律师和客户合在一起，说他们强烈抵制改革。原文\u003ccode>help both lawyers and their customers\u003c/code>将这两类人列为改革受益者，并未说他们共同反对。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将受益对象移成阻碍主体，并增加\u003ccode>strong resistance\u003c/code>这一未报告的态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法律体系改革的阻力来自律师和客户的强烈抵制。\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以\u003ccode>but\u003c/code>指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把律师和客户合在一起，说他们强烈抵制改革。原文\u003ccode>help both lawyers and their customers\u003c/code>将这两类人列为改革受益者，并未说他们共同反对。\u003c/p>\n\u003cp>真正被\u003ccode>too conservative to implement\u003c/code>限定的是州级管理机构；即使管理者也可能具有律师身份，也不能把特定机构扩大为律师与客户整体。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将受益对象移成阻碍主体，并增加\u003ccode>strong resistance\u003c/code>这一未报告的态度。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以but指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的顺序是改革有益、方案早已有之、管理机构保守，随后给本科直接学法和提前考试两项措施。考试若足够严格，反而可以作为减少不必要学习年限的理由。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Strong resistance from both lawyers and their customers has blocked reform.\u003c/p>\n\u003cp>律师和客户双方的强烈抵制阻碍了改革。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>成立时，作者应解释为什么两类受益者反对改变，随后讨论如何说服他们。实际作者用首句说明改革值得做，再指向州级机构的不作为；双方的利益与阻力的归属是两条不同关系。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主张改革行业的高成本，本题应找谁阻止有益改法被执行。主旨只能确定存在改革障碍，具体主体由第4段的state-level bodies及too conservative to implement落实。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>lawyers’ and clients’ strong resistance\u003cbr>律师和客户的强烈抵制\u003c/p>\n\u003c/blockquote>\n\u003cp>全文认为降成本、改善服务对律师和客户都有益。它批评的是保守制度和监管者，不是将两类人整体描写成反改革力量；\u003ccode>B\u003c/code>抹去了这组主体区分，改变了问题应向谁追责。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the rigid bodies governing the profession\u003c/h3>\n\u003cblockquote>\n\u003cp>管理该职业的僵化机构\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>保留。当时选项显示为“\u003ccode>the\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>bodies governing the profession\u003c/code>”。当时的判断依据是：“能，\u003ccode>C\u003c/code>准确落在段落点名的主体上”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>bodies governing the profession\u003c/code>直接对应\u003ccode>the state-level bodies that govern the profession\u003c/code>；\u003ccode>rigid\u003c/code>概括\u003ccode>too conservative\u003c/code>，保留机构不愿变通的性质。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>准确回答改革为什么受阻：已有合理方案，管理机构却僵化保守而未执行。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法律体系改革的阻力来自管理该职业的僵化机构。\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以\u003ccode>but\u003c/code>指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>bodies governing the profession\u003c/code>直接对应\u003ccode>the state-level bodies that govern the profession\u003c/code>；\u003ccode>rigid\u003c/code>概括\u003ccode>too conservative\u003c/code>，保留机构不愿变通的性质。\u003c/p>\n\u003cp>\u003ccode>Sensible ideas have been around for a long time\u003c/code>说明并非没人提出办法，\u003ccode>but\u003c/code>之后才给未能实施的原因。\u003ccode>C\u003c/code>把这一转折中的具体主体及其保守性都保留下来。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>准确回答改革为什么受阻：已有合理方案，管理机构却僵化保守而未执行。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以but指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的顺序是改革有益、方案早已有之、管理机构保守，随后给本科直接学法和提前考试两项措施。考试若足够严格，反而可以作为减少不必要学习年限的理由。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The rigid bodies governing the profession have been too conservative to implement sensible reforms.\u003c/p>\n\u003cp>管理该职业的僵化机构过于保守，没有实施合理改革。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>需要“有方案而机构不执行”的对照，原文恰先说\u003ccode>ideas\u003c/code>早已有之，后说机构\u003ccode>too conservative\u003c/code>。接着列出可以具体推行的措施，进一步表明障碍在实施者的态度，而非完全没有办法。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主张改革行业的高成本，本题应找谁阻止有益改法被执行。主旨只能确定存在改革障碍，具体主体由第4段的state-level bodies及too conservative to implement落实。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the rigid bodies governing the profession\u003cbr>管理该职业的僵化机构\u003c/p>\n\u003c/blockquote>\n\u003cp>全文将高成本追到制度，并主张松动限制；\u003ccode>C\u003c/code>指出维持旧制度、不实施改法的管理者。它把改革需要与改革受阻接在同一主体上，同时有第4段的直接词句依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. the stern exam for would-be lawyers\u003c/h3>\n\u003cblockquote>\n\u003cp>针对准律师的严格考试\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>D\u003c/code>把改革方案的检验工具误写成改革阻力”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>stern exam\u003c/code>确实出现在段内，但作者用了\u003ccode>If\u003c/code> ... \u003ccode>truly\u003c/code> ... \u003ccode>enough\u003c/code>的条件：如果资格考试已经足够严格，能更早参加者就应获准参加。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把用来支持改革的考试条件，反过来改成改革的障碍。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法律体系改革的阻力来自针对准律师的严格考试。\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以\u003ccode>but\u003c/code>指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>stern exam\u003c/code>确实出现在段内，但作者用了\u003ccode>If\u003c/code> ... \u003ccode>truly\u003c/code> ... \u003ccode>enough\u003c/code>的条件：如果资格考试已经足够严格，能更早参加者就应获准参加。\u003c/p>\n\u003cp>这一论证把考试当成能力检验，可以支持缩短不必要的培训。它没有说考试太难造成改革停滞；实际阻力已在前面归到保守机构。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把用来支持改革的考试条件，反过来改成改革的障碍。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003cp>第4段先肯定改革会帮助律师和客户，再以but指出管理这个职业的州级机构太保守，以至没有实施已有的合理方案。资格考试出现在方案论证中，不能与阻力来源混为一谈。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的顺序是改革有益、方案早已有之、管理机构保守，随后给本科直接学法和提前考试两项措施。考试若足够严格，反而可以作为减少不必要学习年限的理由。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The stern bar examination has prevented the legal education system from being reformed.\u003c/p>\n\u003cp>严格的律师资格考试阻碍了法律教育制度改革。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，改革措施应先降低考试难度或取消考试。实际建议保留考试检验，并让有能力者更早参加；考试的严格性是减少额外教育的理由，假设与作者的论证用途相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主张改革行业的高成本，本题应找谁阻止有益改法被执行。主旨只能确定存在改革障碍，具体主体由第4段的state-level bodies及too conservative to implement落实。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the stern exam for would-be lawyers\u003cbr>针对准律师的严格考试\u003c/p>\n\u003c/blockquote>\n\u003cp>文章追求降低不必要成本，同时保留对能力的检验。\u003ccode>D\u003c/code>误把保障资格、支持提前考试的条件写成改革阻力，无法解释作者为何利用这个条件提出缩短学习路径的办法。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>28题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>28. C. the rigid bodies governing the profession\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>新增了批评者身份、批评行为和阻碍改革的因果，不能由文章开头客户抱怨补成。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将受益对象移成阻碍主体，并增加\u003ccode>strong resistance\u003c/code>这一未报告的态度。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>准确回答改革为什么受阻：已有合理方案，管理机构却僵化保守而未执行。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把用来支持改革的考试条件，反过来改成改革的障碍。\u003c/p>\n\u003ch2>29题\u003c/h2>\n\u003cblockquote>\n\u003cp>The guild-like ownership structure is considered “restrictive” partly because it \u003cstrong>\u003cstrong>\u003cstrong>.\u003cbr>行会式所有权结构之所以被认为“限制性强”，部分原因是它\u003c/strong>\u003c/strong>\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>制度限制细节题。第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003c/blockquote>\n\u003cp>先写持股资格的边界与实际弊端，再呈现监管者维护边界的理由，最后用\u003ccode>In fact\u003c/code>反驳并提出开放办法。读\u003ccode>ethical\u003c/code>必须识别它是监管者的辩护，而非作者报告行业伦理已经恶化。\u003c/p>\n\u003ch3>A. prevents lawyers from gaining due profits\u003c/h3>\n\u003cblockquote>\n\u003cp>阻止律师获得应有利润\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>A\u003c/code>把高收费的结果反向写成利润受阻”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>说这种结构妨碍律师取得应有利润。原文\u003ccode>This keeps fees high\u003c/code>说它维持高收费，作者批评的是客户成本和创新受限，没有把它诊断为律师收入受压。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将“让服务收费居高”改写为“阻碍律师获得利润”，变换了受影响者和金钱关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>行会式所有权结构被认为具有限制性，部分原因在于它阻止律师获得应有利润。\u003c/p>\n\u003c/blockquote>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>说这种结构妨碍律师取得应有利润。原文\u003ccode>This keeps fees high\u003c/code>说它维持高收费，作者批评的是客户成本和创新受限，没有把它诊断为律师收入受压。\u003c/p>\n\u003cp>收费高也不等于每位律师利润都必然高，但它更不能直接证明阻止获取\u003ccode>due profits\u003c/code>。第6段的改法关注降低客户成本和提高效率，不是补发律师应得收入。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将“让服务收费居高”改写为“阻碍律师获得利润”，变换了受影响者和金钱关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写持股资格的边界与实际弊端，再呈现监管者维护边界的理由，最后用\u003ccode>In fact\u003c/code>反驳并提出开放办法。读\u003ccode>ethical\u003c/code>必须识别它是监管者的辩护，而非作者报告行业伦理已经恶化。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ownership structure prevents lawyers from earning the profits they deserve.\u003c/p>\n\u003cp>这种所有权结构使律师无法获得应得的利润。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，作者应说明哪些收入受到限制，以及开放持股如何补足律师利润。实际先写\u003ccode>fees high\u003c/code>，再写改革\u003ccode>reduce costs\u003c/code>并改善客户服务，推进目标是减轻服务负担，没有围绕律师利润被扣住展开。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要求改革造成高成本的制度。本题问所有权的限制内容，答案应指向排除了某类外部参与；具体排除谁、限制何种参与，仍须以第5段non-lawyers may not own shares为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>prevents lawyers from gaining due profits\u003cbr>阻止律师获得应有利润\u003c/p>\n\u003c/blockquote>\n\u003cp>全文的主要问题是服务高成本及相关制度，\u003ccode>A\u003c/code>却转向律师得不到应有收益。这种新的受损关系既不能由\u003ccode>fees high\u003c/code>推出，也不能解释结尾为什么把降成本和客户服务作为改革效果。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. keeps lawyers from holding law-firm shares\u003c/h3>\n\u003cblockquote>\n\u003cp>禁止律师持有律所股份\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>B\u003c/code>改换了限制对象”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>keeps lawyers from holding shares\u003c/code>把被禁止者写成律师。原文\u003ccode>non-lawyers may not own any share\u003c/code>中的\u003ccode>non-\u003c/code>恰好划出相反人群，即不具备律师身份的外部人。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>删掉否定前缀，直接把受限主体从非律师换成律师。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>行会式所有权结构被认为具有限制性，部分原因在于它禁止律师持有律所股份。\u003c/p>\n\u003c/blockquote>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>keeps lawyers from holding shares\u003c/code>把被禁止者写成律师。原文\u003ccode>non-lawyers may not own any share\u003c/code>中的\u003ccode>non-\u003c/code>恰好划出相反人群，即不具备律师身份的外部人。\u003c/p>\n\u003cp>这是持股资格的主体限制，不是禁止律所所有成员拥有股份。除哥伦比亚特区外的范围限定也要保留，不能从规则推成任何地方的所有人都不得持股。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>删掉否定前缀，直接把受限主体从非律师换成律师。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写持股资格的边界与实际弊端，再呈现监管者维护边界的理由，最后用\u003ccode>In fact\u003c/code>反驳并提出开放办法。读\u003ccode>ethical\u003c/code>必须识别它是监管者的辩护，而非作者报告行业伦理已经恶化。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Lawyers themselves are prohibited from holding shares in law firms.\u003c/p>\n\u003cp>律师本人被禁止持有律师事务所股份。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>需要解释谁在律师不得持股时拥有律所，后文改革也应允许律师成为股东。实际第6段仍围绕\u003ccode>allowing non-lawyers\u003c/code>，说明被讨论的始终是行业外持股资格；前后两段主体都与\u003ccode>B\u003c/code>相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要求改革造成高成本的制度。本题问所有权的限制内容，答案应指向排除了某类外部参与；具体排除谁、限制何种参与，仍须以第5段non-lawyers may not own shares为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>keeps lawyers from holding law-firm shares\u003cbr>禁止律师持有律所股份\u003c/p>\n\u003c/blockquote>\n\u003cp>全文用开放外部持股来打破行会限制。\u003ccode>B\u003c/code>把内部律师设为被排除者，将“谁可以进入”的边界翻转，导致作者的允许非律师持股建议无法对应它诊断的问题。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. aggravates the ethical situation in the trade\u003c/h3>\n\u003cblockquote>\n\u003cp>使行业伦理状况恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>C\u003c/code>把辩护理由直接翻成了相反结论”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>aggravates the ethical situation\u003c/code>断言该结构恶化行业伦理。原文\u003ccode>ethically\u003c/code>出现于监管者的说法：他们声称排除外人可减少逐利压力、让律师合乎伦理地服务客户。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>既把辩护者的伦理说法换成作者结论，又将所谓保护伦理改成恶化伦理。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>行会式所有权结构被认为具有限制性，部分原因在于它使行业伦理状况恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>aggravates the ethical situation\u003c/code>断言该结构恶化行业伦理。原文\u003ccode>ethically\u003c/code>出现于监管者的说法：他们声称排除外人可减少逐利压力、让律师合乎伦理地服务客户。\u003c/p>\n\u003cp>作者并不接受这种辩护，但他给出的反驳是开放持股可降低成本、提高效率和服务，并没有报告现行结构已经导致伦理状况恶化。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>既把辩护者的伦理说法换成作者结论，又将所谓保护伦理改成恶化伦理。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写持股资格的边界与实际弊端，再呈现监管者维护边界的理由，最后用\u003ccode>In fact\u003c/code>反驳并提出开放办法。读\u003ccode>ethical\u003c/code>必须识别它是监管者的辩护，而非作者报告行业伦理已经恶化。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ownership restriction has worsened ethical standards in the legal profession.\u003c/p>\n\u003cp>所有权限制使法律职业的伦理标准恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>C\u003c/code>成立，文章应列举限制怎样导致失德，并由伦理损害推出取消限制。实际先让监管者声称它能保护伦理，作者再以成本和服务效果回应；反对一项辩护不等于证明该辩护的相反伦理结果。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要求改革造成高成本的制度。本题问所有权的限制内容，答案应指向排除了某类外部参与；具体排除谁、限制何种参与，仍须以第5段non-lawyers may not own shares为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>aggravates the ethical situation in the trade\u003cbr>使行业伦理状况恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>主旨是问题与改革，不能据此认定任何负面评价都正确。本文明确举出的弊端是收费与创新，\u003ccode>C\u003c/code>新增伦理恶化并混淆观点归属，因此仍须由第5段\u003ccode>opponents\u003c/code> ... \u003ccode>insist\u003c/code>的发言者来判别。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. bans outsiders’ involvement in the profession\u003c/h3>\n\u003cblockquote>\n\u003cp>禁止行业外人士参与法律职业\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>保留。当时选项显示为“\u003ccode>bans\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>involvement in the profession\u003c/code>”。当时的判断依据是：“能，\u003ccode>D\u003c/code>概括了现行所有权结构排除外部人士的核心限制”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>outsiders\u003c/code>对应\u003ccode>non-lawyers\u003c/code>，\u003ccode>involvement\u003c/code>在此由上下文限定为持股进入律所的参与。原文\u003ccode>may not own any share\u003c/code>明确给出禁令，而不是一般不鼓励。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>以行业外参与概括非律师持股受禁，保留了限制对象和所有权层面的参与方式。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>行会式所有权结构被认为具有限制性，部分原因在于它禁止行业外人士参与法律职业。\u003c/p>\n\u003c/blockquote>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>outsiders\u003c/code>对应\u003ccode>non-lawyers\u003c/code>，\u003ccode>involvement\u003c/code>在此由上下文限定为持股进入律所的参与。原文\u003ccode>may not own any share\u003c/code>明确给出禁令，而不是一般不鼓励。\u003c/p>\n\u003cp>\u003ccode>Except in the District of Columbia\u003c/code>保留一处例外，不影响文章对多数地区制度特征的概括。\u003ccode>D\u003c/code>也没有说非律师不能作为客户接受法律服务。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>以行业外参与概括非律师持股受禁，保留了限制对象和所有权层面的参与方式。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The other reason why costs are so high is the restrictive guild-like ownership structure of the business. Except in the District of Columbia, non-lawyers may not own any share of a law firm. This keeps fees high and innovation slow. There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.\u003c/p>\n\u003cp>In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms&#39; efficiency. After all, other countries, such as Australia and Britain, have started liberalizing their legal professions. America should follow.\u003c/p>\n\u003cp>第5段在哥伦比亚特区之外禁止非律师持有律所股份，并说明这使收费高、创新慢；监管者随后提出伦理辩护。第6段作者则主张允许非律师持股，借技术与专业管理改善效率和服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写持股资格的边界与实际弊端，再呈现监管者维护边界的理由，最后用\u003ccode>In fact\u003c/code>反驳并提出开放办法。读\u003ccode>ethical\u003c/code>必须识别它是监管者的辩护，而非作者报告行业伦理已经恶化。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Except in the District of Columbia, the rules bar outsiders from owning shares in law firms.\u003c/p>\n\u003cp>除哥伦比亚特区外，规则禁止行业外人士持有律师事务所股份。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>需要外部人被排除，原文先明说\u003ccode>non-lawyers\u003c/code>不得持股，结尾再建议允许他们持股。诊断与方案都围绕同一边界展开；开放技术和专业管理也说明外部参与并非抽象口号。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要求改革造成高成本的制度。本题问所有权的限制内容，答案应指向排除了某类外部参与；具体排除谁、限制何种参与，仍须以第5段non-lawyers may not own shares为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>bans outsiders’ involvement in the profession\u003cbr>禁止行业外人士参与法律职业\u003c/p>\n\u003c/blockquote>\n\u003cp>将行业外人士挡在所有权之外，能够解释全文为何主张开放律所并引入技术和专业管理。\u003ccode>D\u003c/code>准确抓住需要松动的制度边界，同时应按原文理解为持股参与，避免扩大为外行不得以任何形式接触法律职业。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. D. bans outsiders’ involvement in the profession\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>将“让服务收费居高”改写为“阻碍律师获得利润”，变换了受影响者和金钱关系。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>删掉否定前缀，直接把受限主体从非律师换成律师。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>既把辩护者的伦理说法换成作者结论，又将所谓保护伦理改成恶化伦理。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>以行业外参与概括非律师持股受禁，保留了限制对象和所有权层面的参与方式。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：美国法律行业的问题现状\u003c/strong>（段落1-2问题呈现） 全球现象：律师招人反感（仅次于记者）→ 美国尤甚：客户投诉理由最多 → 具体表现：【法律服务支出增长是通胀两倍 + 顶尖律师收入极高吸引学生 // 但大多数毕业生进不了大所 → 成为骚扰性诉讼提起者】\u003c/p>\n\u003cp>↓（原因分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：法律教育成本过高\u003c/strong>（段落3成本分析） 教育路径单一：【本科4年（无关专业）+ 法学院3年（200所授权学校）+ 昂贵的考试准备】→ 结果：平均负债10万美元（加上本科债务）→ 影响：必须拼命工作\u003c/p>\n\u003cp>↓（改革方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：教育体系改革建议\u003c/strong>（段落4改革提议） 改革必要性：有助于律师和客户双方 // 但州级管理机构太保守 → 具体建议：【1.允许本科直接学法律 + 2.允许两年后参加律师考试】→ 潜在效果：减少三分之一债务\u003c/p>\n\u003cp>→（另一原因）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：行会式所有权结构问题\u003c/strong>（段落5结构分析） 限制性规定：非律师不得拥有律所股份（除哥伦比亚特区）→ 后果：【费用高 + 创新慢】→ 改革阻力：监管者认为排除外人可使律师免受赚钱压力，更道德地服务客户\u003c/p>\n\u003cp>↓（解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：开放所有权的益处\u003c/strong>（段落6国际对比） 允许非律师持股的好处：【降低成本 + 改善服务】（通过使用技术和专业管理）→ 国际趋势：澳大利亚和英国已开始自由化 → 建议：美国应该跟进\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：美国法律行业存在严重问题（高成本、低效率），主要原因是教育成本过高和行会式所有权结构，需要通过教育改革和开放所有权来解决。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Choose the most suitable heading from the list A–G for each paragraph. There are two extra headings.\u003c/p>\n\u003cp>A. Testing ability without demanding unnecessary years\u003c/p>\n\u003cp>B. Abolishing examinations to make lawyers cheaper\u003c/p>\n\u003cp>C. Opening ownership while retaining professional safeguards\u003c/p>\n\u003cp>D. A costly system behind an attractive career\u003c/p>\n\u003cp>E. Keeping firms closed to protect professional standards\u003c/p>\n\u003cp>F. The long and expensive route into legal practice\u003c/p>\n\u003cp>G. A separate barrier at the ownership door\u003c/p>\n\u003ch4>41. ______\u003c/h4>\n\u003cp>A successful lawyer’s income can make the profession look like an excellent investment. Yet the earnings of a few celebrated practitioners are a poor guide to what most graduates will experience. Many begin working life with large debts, while their clients face bills that are difficult to understand and harder to pay. Complaining that lawyers are greedy does little to explain why this situation persists. The more useful question concerns the rules under which legal services are produced. Those rules shape the expense of entering the profession and the ways in which firms can operate. An appealing career thus sits inside a system whose costs deserve closer examination.\u003c/p>\n\u003ch4>42. ______\u003c/h4>\n\u003cp>For many prospective lawyers, the first bill arrives before legal training has even begun. They must complete an undergraduate degree, often in a subject unrelated to the law, and then spend further years at law school. Examination preparation adds another expense. Each stage may have a defensible purpose in isolation, but the combined route demands substantial time and borrowing. Graduates cannot recover those years, and interest does not stop accumulating while they search for suitable employment. Describing the resulting debt as a failure of personal budgeting misses the design of the pathway itself. The length of the required sequence is part of the cost.\u003c/p>\n\u003ch4>43. ______\u003c/h4>\n\u003cp>One response is to separate the test of professional ability from the number of years spent in a classroom. A demanding licensing examination should establish whether a candidate is ready to practise. If an able student can satisfy that test earlier, requiring another year of study needs an independent justification. Undergraduate legal study and earlier access to the examination could therefore reduce debt without automatically reducing competence. This is not an argument for granting everyone a licence or for abandoning assessment. It is an argument for using assessment seriously: once the required ability has been demonstrated, additional compulsory time should not be treated as an end in itself.\u003c/p>\n\u003ch4>44. ______\u003c/h4>\n\u003cp>Education, however, is not the only place where restrictive rules raise the price of legal work. In many jurisdictions, ownership of a law firm is reserved for lawyers. A person with expertise in technology or business management cannot simply become an investor and help redesign its operations. Defenders of this boundary say that outside investors would demand profits at the expense of professional duties. The boundary may therefore sound like a protection for clients. But it also limits the money and skills available for improving services. Before judging the defence, it is necessary to see that this is a second restriction, distinct from the requirements imposed on students.\u003c/p>\n\u003ch4>45. ______\u003c/h4>\n\u003cp>Keeping a professional duty does not require keeping every source of outside expertise away. A firm that can attract investment may use better technology and employ managers whose job is to improve efficiency. Lawyers would still be responsible for legal judgments and for the standards of their advice. The important distinction is between opening the ownership of a business and removing the obligations attached to professional work. Reform can do the former without accepting the latter. Careful oversight would need to address conflicts of interest, but an absolute ban avoids that task by preventing useful arrangements as well. A better system would permit new participation while making duties clear and enforceable.\u003c/p>\n\u003ch2>小标题题 41\u003c/h2>\n\u003cp>\u003cstrong>D. A costly system behind an attractive career\u003c/strong>\u003c/p>\n\u003cp>诱人职业背后的高成本制度\u003c/p>\n\u003cp>用收入的吸引力引入，再把关注点从少数人的成功转向毕业生债务、客户账单及其制度背景。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>the earnings of a few celebrated practitioners are a poor guide\u003c/p>\n\u003c/blockquote>\n\u003cp>少数明星的收入不能代表多数人的经历，开头就在限制“高收入”的代表性。\u003c/p>\n\u003cblockquote>\n\u003cp>Complaining that lawyers are greedy does little to explain why this situation persists.\u003c/p>\n\u003c/blockquote>\n\u003cp>从对人的责怪转到为什么制度持续制造高成本。\u003c/p>\n\u003cblockquote>\n\u003cp>An appealing career thus sits inside a system whose costs deserve closer examination.\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾把职业吸引力与制度成本并置，给出整段的概括。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>高收入显得诱人 → 多数毕业生和客户承受费用 → 单骂律师无法解释 → 转查生产法律服务的规则。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>attractive career\u003c/code>对应开头的收入诱惑，\u003ccode>costly system\u003c/code>对应债务、账单以及规则，两半共同覆盖这一转向。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>也谈成本，但只覆盖入行教育路径；本段还谈客户账单和律所运作，尚未逐项展开学制。把教育成本这个后文分支当作整段标题，会缩小此处提出的制度问题。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 D。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 42\u003c/h2>\n\u003cp>\u003cstrong>F. The long and expensive route into legal practice\u003c/strong>\u003c/p>\n\u003cp>漫长而昂贵的法律执业路径\u003c/p>\n\u003cp>按先后拆开入行教育链，说明成本不仅是个人预算问题，也来自被要求经历的漫长路径。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>before legal training has even begun\u003c/p>\n\u003c/blockquote>\n\u003cp>成本在专业法律训练之前就出现，定位到先修本科。\u003c/p>\n\u003cblockquote>\n\u003cp>complete an undergraduate degree\u003c/p>\n\u003c/blockquote>\n\u003cp>与后续\u003ccode>law school\u003c/code>和\u003ccode>Examination preparation\u003c/code>组成累加的教育阶段。\u003c/p>\n\u003cblockquote>\n\u003cp>The length of the required sequence is part of the cost.\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾明确将学制顺序本身归入成本来源。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>无关专业本科 → 法学院多年训练 → 考试准备 → 时间和借贷累积 → 债务不能只归咎个人预算。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>F\u003c/code>的\u003ccode>route\u003c/code>对应必经的连续阶段，\u003ccode>long\u003c/code>对应多年学习，\u003ccode>expensive\u003c/code>对应借款、备考支出和累积利息。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的成本制度太宽泛，而且要求同时概括职业吸引力；本段没有再讨论少数高收入者，而是具体拆教育路线。\u003ccode>F\u003c/code>保留了这一段相对上一段新增的内容。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 F。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 43\u003c/h2>\n\u003cp>\u003cstrong>A. Testing ability without demanding unnecessary years\u003c/strong>\u003c/p>\n\u003cp>检验能力，而不强求不必要的学年\u003c/p>\n\u003cp>提出以能力检验代替机械延长学年的改革，同时明确保留资格考试。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>separate the test of professional ability from the number of years\u003c/p>\n\u003c/blockquote>\n\u003cp>先区分能力是否合格与上了几年学，说明改革针对何种绑定。\u003c/p>\n\u003cblockquote>\n\u003cp>without automatically reducing competence\u003c/p>\n\u003c/blockquote>\n\u003cp>减少债务不自动等于降低能力，接住可能的质量反驳。\u003c/p>\n\u003cblockquote>\n\u003cp>not an argument for granting everyone a licence or for abandoning assessment\u003c/p>\n\u003c/blockquote>\n\u003cp>直接排除无条件发证和取消考试的理解。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>分开能力与学年 → 严格考试负责把关 → 合格者可提前参加 → 省下强制时间与债务 → 保留评估而非取消门槛。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>Testing ability\u003c/code>对应\u003ccode>licensing examination\u003c/code>，\u003ccode>without demanding unnecessary years\u003c/code>对应通过检验后不再强制多读，完整保留改革与保障两面。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>也包含降成本，却把手段改成\u003ccode>Abolishing examinations\u003c/code>。段中明确说\u003ccode>not\u003c/code> ... \u003ccode>abandoning assessment\u003c/code>，考试恰是能够提前结束训练的保障，不能改成被取消的对象。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 A。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 44\u003c/h2>\n\u003cp>\u003cstrong>G. A separate barrier at the ownership door\u003c/strong>\u003c/p>\n\u003cp>所有权门口的另一道障碍\u003c/p>\n\u003cp>从教育转向持股资格，先界定另一道限制，再呈现其辩护及被忽略的成本。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>Education, however, is not the only place\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>however\u003c/code>和\u003ccode>not the only\u003c/code>标明从前一问题转入第二问题。\u003c/p>\n\u003cblockquote>\n\u003cp>ownership of a law firm is reserved for lawyers\u003c/p>\n\u003c/blockquote>\n\u003cp>清楚规定新限制发生在持股资格，而非上学或考试。\u003c/p>\n\u003cblockquote>\n\u003cp>this is a second restriction, distinct from the requirements imposed on students\u003c/p>\n\u003c/blockquote>\n\u003cp>末句重新区分两类制度，强调本段的换题功能。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>教育不是唯一限制 → 所有权只给律师 → 外部资金与技能受挡 → 监管者用伦理辩护 → 先确认这是独立的第二障碍。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>separate\u003c/code>、\u003ccode>second restriction\u003c/code>和\u003ccode>distinct\u003c/code>对应；\u003ccode>ownership door\u003c/code>形象地概括外部投资人被挡在持股资格之外。\u003c/p>\n\u003cp>\u003ccode>E\u003c/code>抓到保护职业义务的辩护，但这是\u003ccode>Defenders\u003c/code>的说法，后面的\u003ccode>But\u003c/code>已指出限制外部技能的代价。作者在界定并审视这道门槛，没有以维护封闭作为本段结论。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 G。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 45\u003c/h2>\n\u003cp>\u003cstrong>C. Opening ownership while retaining professional safeguards\u003c/strong>\u003c/p>\n\u003cp>开放所有权，同时保留职业保障\u003c/p>\n\u003cp>回应前段的伦理担忧：开放股权不等于取消职业义务，可以用可执行的监管处理风险。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>Keeping a professional duty does not require keeping every source of outside expertise away.\u003c/p>\n\u003c/blockquote>\n\u003cp>开头否定“保护义务必须封闭”的必然联系。\u003c/p>\n\u003cblockquote>\n\u003cp>opening the ownership of a business and removing the obligations\u003c/p>\n\u003c/blockquote>\n\u003cp>把持股开放与职责取消拆成两个不同动作。\u003c/p>\n\u003cblockquote>\n\u003cp>permit new participation while making duties clear and enforceable\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾同时要求开放参与及明确可执行的义务。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>驳斥封闭与伦理的捆绑 → 外部技术和管理提升效率 → 律师责任仍在 → 监管具体利益冲突 → 开放与保障并行。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>Opening ownership\u003c/code>对应允许投资与专业管理，\u003ccode>retaining safeguards\u003c/code>对应\u003ccode>legal judgments\u003c/code>、\u003ccode>oversight\u003c/code>以及\u003ccode>enforceable duties\u003c/code>，不能只保留其中一半。\u003c/p>\n\u003cp>\u003ccode>E\u003c/code>把结论拉回封闭，但本段认为绝对禁令会一并挡住有用安排。提及利益冲突是说明如何监管开放后的风险，不是要求维持全面禁止。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 C。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Arrange paragraphs A–H into a coherent text. A, E and H are already in position.\u003c/p>\n\u003cp>\u003cstrong>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/strong>\u003c/p>\n\u003ch4>[A]\u003c/h4>\n\u003cp>Legal bills can be painful for clients even when many new lawyers struggle to make a living. These two facts are compatible if the system consumes too much money before useful work is done. The expense can burden a new practitioner before clients have received any benefit, and individual effort cannot by itself change a compulsory requirement. To understand that waste, it helps to follow the route by which a student becomes qualified. The first question is how much education this route requires.\u003c/p>\n\u003ch4>[B]\u003c/h4>\n\u003cp>At that ownership boundary, non-lawyers are often kept outside. Technology specialists and professional managers cannot easily bring capital into a firm by taking a share in it. The restriction narrows the options for reorganising services. Its defenders nevertheless offer a powerful-sounding justification: outsiders would press lawyers to pursue profits rather than honour duties to clients.\u003c/p>\n\u003ch4>[C]\u003c/h4>\n\u003cp>Supervising those conflicts would require clear responsibilities, transparent decisions and penalties for interference with legal judgment. An outright ban is simpler, but it also excludes beneficial arrangements without examining them. Regulation should distinguish an investment that improves delivery from one that compromises advice. With that distinction in place, opening ownership need not mean leaving clients unprotected.\u003c/p>\n\u003ch4>[D]\u003c/h4>\n\u003cp>That educational route often begins with a degree in an unrelated subject. Several years of law school follow, and examination preparation adds further expense. The stages accumulate rather than replace one another. By the time graduates can offer legal services, their borrowing may already constrain the jobs they can afford to accept. The immediate result is a large education debt.\u003c/p>\n\u003ch4>[E]\u003c/h4>\n\u003cp>Those institutions can be slow to surrender familiar arrangements. Their reluctance explains why proposals to shorten training may remain proposals for years. But overcoming this resistance would solve only one part of the cost problem. A qualified lawyer still enters a business whose ownership is tightly restricted. The argument must therefore move from the student’s route to the firm’s shareholders.\u003c/p>\n\u003ch4>[F]\u003c/h4>\n\u003cp>This defence confuses the identity of an owner with the duties of a professional. Outside investment could fund better systems and management without giving investors authority to alter legal advice. The possibility does not prove that every new arrangement will work well. It does, however, turn the issue into a more precise question: how should conflicts between investment and professional duty be supervised?\u003c/p>\n\u003ch4>[G]\u003c/h4>\n\u003cp>Such debt suggests a practical test for reform: which compulsory stages actually demonstrate competence? A rigorous licensing examination could allow able students to qualify earlier, while undergraduate legal study could reduce repetition. Neither proposal requires abandoning standards. Yet a sensible proposal does not implement itself. Both ideas must pass through institutions that decide who is allowed to enter the profession.\u003c/p>\n\u003ch4>[H]\u003c/h4>\n\u003cp>The two reforms consequently belong together without being identical. One reduces unnecessary expense on the path into legal work; the other widens the resources available once a firm is operating. Both replace a rigid barrier with a more direct test of the public interest. The aim is not cheapness at any price, but capable professionals delivering useful services at a cost clients can bear.\u003c/p>\n\u003ch3>全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>在全文中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出费用矛盾，转向入行教育\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>描述股权限制，提出伦理辩护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>回答监督问题，区分有益投资与干预\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>展开教育顺序及债务结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明实施阻力，转向股权限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>反驳伦理辩护，转问具体监督\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>由债务提出两项教育改革，指向实施机构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>并收教育与所有权两条改革\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cp>提出费用矛盾，转向入行教育 → 展开教育顺序及债务结果 → 由债务提出两项教育改革，指向实施机构 → 说明实施阻力，转向股权限制 → 描述股权限制，提出伦理辩护 → 反驳伦理辩护，转问具体监督 → 回答监督问题，区分有益投资与干预 → 并收教育与所有权两条改革\u003c/p>\n\u003cp>\u003cstrong>完整顺序：A—D—G—E—B—F—C—H。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>41—45：D、G、B、F、C。\u003c/strong>\u003c/p>\n\u003ch2>排序题 41\u003c/h2>\n\u003cp>这是全文第2个位置。先承接前段A，再接后段G；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段A末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The first question is how much education this route requires.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That educational route\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The immediate result is a large education debt.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Such debt suggests a practical test for reform:\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>末尾把问题收在教育路径，\u003ccode>D\u003c/code>的\u003ccode>That educational route\u003c/code>有唯一现成对象；\u003ccode>D\u003c/code>再列累加阶段并产出债务，\u003ccode>G\u003c/code>的\u003ccode>Such debt\u003c/code>才能接住。\u003c/p>\n\u003cp>局部推进：提出费用矛盾，转向入行教育 → 展开教育顺序及债务结果 → 由债务提出两项教育改革，指向实施机构。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>G段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such debt\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>G\u003c/code>不能直接接\u003ccode>A\u003c/code>，因为\u003ccode>A\u003c/code>只提出教育所需程度，尚未形成可供\u003ccode>Such debt\u003c/code>回指的具体债务结果。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 D。\u003c/strong>\u003c/p>\n\u003ch2>排序题 42\u003c/h2>\n\u003cp>这是全文第3个位置。先承接前段D，再接后段E；后面的E是题面已给定的固定位置。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The immediate result is a large education debt.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Such debt suggests a practical test for reform:\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Both ideas must pass through institutions\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those institutions\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>从\u003ccode>D\u003c/code>的教育债务提出能力考试与本科法律学习两项办法，末尾把两项办法交给实施机构；\u003ccode>E\u003c/code>的\u003ccode>Those institutions\u003c/code>接机构，解释方案为何迟迟不落地。\u003c/p>\n\u003cp>局部推进：展开教育顺序及债务结果 → 由债务提出两项教育改革，指向实施机构 → 说明实施阻力，转向股权限制。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>C段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Supervising those conflicts\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>需要投资与职业义务之间的冲突作为前件，这一阶段尚未进入股权话题。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 G。\u003c/strong>\u003c/p>\n\u003ch2>排序题 43\u003c/h2>\n\u003cp>这是全文第5个位置。先承接前段E，再接后段F；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段E末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the firm’s shareholders\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>At that ownership boundary\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>outsiders would press lawyers to pursue profits rather than honour duties to clients.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>This defence\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>明确从学生转向股东，\u003ccode>B\u003c/code>才具体说明非律师被挡在外，并交出监管者的伦理理由。\u003ccode>F\u003c/code>的\u003ccode>This defence\u003c/code>需要的正是\u003ccode>B\u003c/code>末尾完整辩护，不是泛指成本问题。\u003c/p>\n\u003cp>局部推进：说明实施阻力，转向股权限制 → 描述股权限制，提出伦理辩护 → 反驳伦理辩护，转问具体监督。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That educational route\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>重新回教育顺序，会逆转\u003ccode>E\u003c/code>刚完成的从学生到股东的换题，并使\u003ccode>F\u003c/code>无辩护可驳。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 B。\u003c/strong>\u003c/p>\n\u003ch2>排序题 44\u003c/h2>\n\u003cp>这是全文第6个位置。先承接前段B，再接后段C；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段B末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Its defenders nevertheless offer a powerful-sounding justification:\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>This defence confuses\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>how should conflicts between investment and professional duty be supervised?\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Supervising those conflicts\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>F\u003c/code>承接\u003ccode>B\u003c/code>的伦理辩护，先分开所有者身份与职业职责，再把争论收成如何监督冲突的问题。\u003ccode>C\u003c/code>直接回答监督职责、透明度及干预处罚，所以\u003ccode>F\u003c/code>必须在二者之间。\u003c/p>\n\u003cp>局部推进：描述股权限制，提出伦理辩护 → 反驳伦理辩护，转问具体监督 → 回答监督问题，区分有益投资与干预。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>G段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such debt\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>G\u003c/code>围绕学费债务提出考试改革，既不回应\u003ccode>B\u003c/code>的职业伦理辩护，也不能为\u003ccode>C\u003c/code>提供投资冲突。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 F。\u003c/strong>\u003c/p>\n\u003ch2>排序题 45\u003c/h2>\n\u003cp>这是全文第7个位置。先承接前段F，再接后段H；后面的H是题面已给定的固定结尾。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>how should conflicts between investment and professional duty be supervised?\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Supervising those conflicts\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>opening ownership need not mean leaving clients unprotected.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The two reforms consequently belong together\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>C\u003c/code>逐项回答\u003ccode>F\u003c/code>的监督问题，再得出开放与客户保护可并存，完成第二条改革。\u003ccode>H\u003c/code>才能把已完成的教育改革与所有权改革并收，\u003ccode>two reforms\u003c/code>有两个完整对象。\u003c/p>\n\u003cp>局部推进：反驳伦理辩护，转问具体监督 → 回答监督问题，区分有益投资与干预 → 并收教育与所有权两条改革。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>At that ownership boundary\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>只是重新介绍限制并提出辩护，放此处会倒退到问题提出，\u003ccode>F\u003c/code>的监督问题仍无人回答，结尾也缺少第二项方案的完成。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 C。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>rational career choices\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>理性择业\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lifelong learning\u003c/td>\n\u003ctd>终身学习\u003c/td>\n\u003ctd>社会现象类·文化教育\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>interdisciplinary learning\u003c/td>\n\u003ctd>跨学科学习\u003c/td>\n\u003ctd>社会现象类·文化教育\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>innovation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>创新\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a sense of responsibility\u003c/td>\n\u003ctd>责任感\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>professional competence\u003c/td>\n\u003ctd>专业胜任力\u003c/td>\n\u003ctd>社会现象类·社会生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>technological progress\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>技术进步\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·科技经济\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>efficient corporate operations\u003c/td>\n\u003ctd>高效企业经营\u003c/td>\n\u003ctd>经济消费类\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>quality education\u003c/td>\n\u003ctd>优质教育\u003c/td>\n\u003ctd>社会现象类·文化教育\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A has grounds for complaint about B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A有理由对B表示不满。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene shows A working hard under the pressure of B.\u003c/td>\n\u003ctd>画面展示A在B的压力下努力工作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast suggests that changing A would help both B and C.\u003c/td>\n\u003ctd>这一对比表明，改变A将同时有益于B和C。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Spending on A grew twice as fast as spending on B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A方面支出的增速是B方面的两倍。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figure for A fell by a third during this period.\u003c/td>\n\u003ctd>这一时期，A的数值下降了三分之一。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The chart shows an increase in A alongside a reduction in B.\u003c/td>\n\u003ctd>图表显示A增加，同时B减少。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage argues that allowing A to do B would improve C.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文认为，允许A做B将改善C。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>One reason for A is the high cost of B.\u003c/td>\n\u003ctd>A的一个原因是B的成本高昂。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion focuses on how A can reduce costs and improve B.\u003c/td>\n\u003ctd>讨论聚焦于A如何降低成本并改善B。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
