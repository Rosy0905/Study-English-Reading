<script>
const DATA = [{"title":"史上最强阅读复盘法：一石五鸟法","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","section":"方法总览","level":2,"context":null,"meta":{"bird":0},"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| world | n.世界 | lawyer | n.律师 | generate | v.引起 |\n| hostility | n.敌意 | member | n.成员 | profession | n.职业 |\n| possible | a.可能的 | exception | n.例外 | journalism | n.新闻业 |\n| client | n.客户 | grounds | n.理由 | complaint | n.抱怨 |","section":"第一鸟 · 词汇","level":1,"context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[85,123,925,324],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":1,"kind":"vocabulary","paragraph":1},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>world\u003c/td>\n\u003ctd>n.世界\u003c/td>\n\u003ctd>lawyer\u003c/td>\n\u003ctd>n.律师\u003c/td>\n\u003ctd>generate\u003c/td>\n\u003ctd>v.引起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hostility\u003c/td>\n\u003ctd>n.敌意\u003c/td>\n\u003ctd>member\u003c/td>\n\u003ctd>n.成员\u003c/ ng could cut their debt mountain by a third.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段完整原文与译文","focus":[85,1850,925,778],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"center"},"meta":{"bird":2,"kind":"paragraph","paragraph":4,"cumulative":true,"cumulativeGroup":"paragraph-4","partIndex":0,"cumulativeFinal":false},"focusId":"focus-paragraph-4-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/section>"},{"title":"第4段","raw":"### 意群划分 · 第4段\n\nReforming the system / would help / both lawyers and their customers.\n\nSensible ideas / have been around / for a long time, / but the state-level bodies / that govern the profession / have been too conservative / to implement them.\n\nOne idea is / to allow people / to study law / as an undergraduate degree.\n\nAnother is / to let students / sit for the bar / after only two years / of law school.\n\nIf the bar exam / is truly a stern enough test / for a would-be lawyer, / those who can sit it earlier / should be allowed to do so.\n\nStudents who do not need / the extra training / could cut their debt mountain / by a third.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段完整原文与译文","focus":[85,1850,925,778],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph" 做。\n\n不需要的学生 / 额外培训的 / 可以削减他们的债务大山 / 三分之一。","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段完整原文与译文","focus":[85,1850,925,778],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"center"},"meta":{"bird":2,"kind":"paragraph","paragraph":4,"cumulative":true,"cumulativeGroup":"paragraph-4","partIndex":2,"cumulativeFinal":false},"focusId":"focus-paragraph-4-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Reforming the system / would help / both lawyers and their customers.\u003c/p>\n\u003cp>Sensible ideas / have been around / for a long time, / but the state-level bodies / that govern the profession / have been too conservative / to implement them.\u003c/p>\n\u003cp>One idea is / to allow people / to study law / as an undergraduate degree.\u003c/p>\n\u003cp>Another is / to let students / sit for the bar / after only two years / of law school.\u003c/p>\n\u003cp>If the bar exam / is truly a stern enough test / for a would-be lawyer, / those who can sit it earlier / should be allowed to do so.\u003c/p>\n\u003cp>Students who do not need / the extra training / could cut their debt mountain / by a third.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>改革这个系统 / 将有助于 / 律师和他们的客户双方。\u003c/p>\n\u003cp>明智的想法 / 已经存在 / 很长时间了，/ 但州级机构 / 管理这个职业的 / 一直太保守 / 无法实施它们。\u003c/p>\n\u003cp>一个想法是 / 允许人们 / 学习法律 / 作为本科学位。\u003c/p>\n\u003cp>另一个是 / 让学生们 / 参加律师资格考试 / 仅仅两年后 / 法学院的。\u003c/p>\n\u003cp>如果律师资格考试 / 真的是足够严格的测试 / 对于准律师，/ 那些能够更早参加考试的人 / 应该被允许这样做。\u003c/p>\n\u003cp>不需要的学生 / 额外培训的 / 可以削减他们的债务大山 / 三分之一。\u003c/p>\n\u003c/section>"},{"title":"第4段","raw":"### 标准译文 · 第4段\n\n改革这个系统将有助于律师和客户双方。明智的改革想法已经存在很长时间了，但管理这个职业的州级机构太保守，无法实施这些想法。一个想法是允许人们将法律作为本科学位来学习。另一个是让学生在法学院学习两年后就可以参加律师资格考试。如果律师资格考试真的是对准律师足够严格的测试，那些能够更早参加考试的人应该被允许这样做。不需要额外培训的学生可以将债务减少三分之一。","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第4段完整原文与译文","focus":[85,1850,925,778],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"center"},"meta":{"bird":2,"kind":"paragraph","paragraph":4,"cumulative":true,"cumulativeGroup":"paragraph-4","partIndex":3,"cumulativeFinal":true},"focusId":"focus-paragraph-4-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Reforming the system would help both lawyers and their customers. Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them. One idea is to allow people to study law as an undergraduate degree. Another is to let students sit for the bar after only two years of law school. If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so. Students who do not need the extra training could cut their debt mountain by a third.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Reforming the system / would help / both lawyers and their customers.\u003c/p>\n\u003cp>Sensible ideas / have been around / for a long time, / but the state- n the members：(of any other profession)) – with the possible exception：(of journalism).\n\nBut there are few places：(where clients have more grounds：(for complaint))：(than America).\n\n### 第2段\n\nDuring the decade：(before the economic crisis) → spending on legal services：(in America) → grew twice as fast：(as inflation).\n\nThe best lawyers → made skyscrapers-full of money → tempting ever more students：(to pile into law schools).\n\nBut most law graduates → never get a big-firm job.\n\nMany of them instead → become the kind of nuisance-lawsuit filer：(that makes the tort system → a costly nightmare).\n\n### 第3段\n\nThere are many reasons：(for this).\n\nOne is the excessive costs：(of a legal education).\n\nThere is just one path：(for a lawyer)：(in most American states)：(a four-year undergraduate degree：(in some unrelated subject) + then a three-year law degree：(at one of 200 law schools：(authorized by the American Bar Association)) + an expensive preparation：(for the bar exam)).\n\nThis leaves → today's average law-school graduate：(with $100,000 of debt)：(on top of undergraduate debts).\n\nLaw-school debt means：(that they have to work → fearsomely hard).\n\n### 第4段\n\nReforming the system → would help：(both lawyers and their customers).\n\nSensible ideas → have been around：(for a long time) // but the state-level bodies：(that govern the profession) → have been too conservative：(to implement them).\n\nOne idea is → to allow people → to study law：(as an undergraduate degree).\n\nAnother is → to let students → sit for the bar：(after only two years：(of law school)).\n\nIf the bar exam → is truly a stern enough test：(for a would-be lawyer) → those who can sit it earlier → should be allowed to do so.\n\nStudents：(who do not need → the extra training) → could cut their debt mountain：(by a third).\n\n### 第5段\n\nThe other reason：(why costs are so high) → is the restrictive guild-like ownership structure：(of the business).\n\nExcept in the District of Columbia → non-lawyers may n 三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","level":1,"context":{"mode":"image","asset":"questions","label":"30题","focus":[250,2380,1800,490],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"section-cover","mergedIntro":true},"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n**In this text, the author mainly discusses ______.**\n\n本文主要讨论什么？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **flawed ownership of America’s law firms and its causes**\n\n美国律所所有权的缺陷及其原因\n\nB. **the factors that help make a successful lawyer in America**\n\n在美国成为成功律师的因素\n\nC. **a problem in America’s legal profession and solutions to it**\n\n美国法律职业中的一个问题及其解决办法\n\nD. **the role of undergraduate studies in America’s legal education**\n\n本科教育在美国法律教育中的作用\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 指出律师普遍招人反感，而美国客户尤其有理由抱怨 | 先说一个广泛存在的麻烦 |\n| 2 | 写法律服务支出猛增、顶尖律师高收入、学生涌入以及多数毕业生就业不佳 | 再写这个麻烦怎样变得更重 |\n| 3 | 解释单一路径造成高昂教育成本和巨额债务 | 接着拆开第一层成因 |\n| 4 | 建议本科直接学法、两年后参加资格考试，从而削减债务 | 然后提出对应的改法 |\n| 5 | 说明行会式所有权排除非律师，维持高收费并拖慢创新 | 再补一个背景：还有另一层成因 |\n| 6 | 主张允许非律师持股、使用技术和专业经理，并让美国跟进其他国家 | 最后说另一种改法 |","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"30题","focus":[250,2380,1800,490],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":30},"html":"\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>本文主要讨论什么？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>flawed ownership of America’s law firms and its causes\u003c/strong>\u003c/p>\n\u003cp>美国律所所有权的缺陷及其原因\u003c/p>\n\u003cp>B. \u003cstrong>the factors that help make a successful lawyer in America\u003c/strong>\u003c/p>\n\u003cp>在美国成为成功律师的因素\u003c/p>\n\u003cp>C. \u003cstrong>a problem in America’s legal profession and solutions to it\u003c/strong>\u003c/p>\n\u003cp>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003cp>D. \u003cstrong>the role of undergraduate studies in America’s legal education\u003c/strong>\u003c/p>\n\u003cp>本科教育在美国法律教育中的作用\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>指出律师普遍招人反感，而美国客户尤其有理由抱怨\u003c/td>\n\u003ctd>先说一个广泛存在的麻烦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写法律服务支出猛增、顶尖律师高收入、学生涌入以及多数毕业生就业不佳\u003c/td>\n\u003ctd>再写这个麻烦怎样变得更重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释单一路径造成高昂教育成本和巨额债务\u003c/td>\n\u003ctd>接着拆开第一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>建议本科直接学法、两年后参加资格考试，从而削减债务\u003c/td>\n\u003ctd>然后提出对应的改法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>说明行会式所有权排除非律师，维持高收费并拖慢创新\u003c/td>\n\u003ctd>再补一个背景：还有另一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>主张允许非律师持股、使用技术和专业经理，并让美国跟进其他国家\u003c/td>\n\u003ctd>最后说另一种改法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"title":"A. flawed ownership of America’s law firms and its causes","raw":"**In this text, the author mainly discusses ______.**\n\n### A. flawed ownership of America’s law firms and its causes\n\n美国律所所有权的缺陷及其原因","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题A选项","focus":[250,2473,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":30,"option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>美国律所所有权的缺陷及其原因\u003c/p>\n\u003c/section>"},{"title":"A. flawed ownership of America’s law firms and its causes","raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n美国律所所有权的缺陷及其原因\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先指出美国律所的所有权安排普遍引发客户不满，把批评对象锁定为谁能拥有律所。 | 先说一个广泛存在的麻烦 |\n| 2 | 说明这种持股制度怎样使客户支出持续增加、外部参与更难进入，缺陷因而不断加重。 | 再写这个麻烦怎样变得更重 |\n| 3 | 追溯第一层成因：职业资格与股东资格被捆绑，使所有权封闭成为制度惯性。 | 接着拆开第一层成因 |\n| 4 | 针对资格绑定提出拆开职业执业权和出资权的改法，以修补所有权缺陷。 | 然后提出对应的改法 |\n| 5 | 再追溯另一层成因：内部股东希望保留收费与管理控制，形成维持封闭的利益动机。 | 再补一个背景：还有另一层成因 |\n| 6 | 提出引入独立治理和外部股东的另一种改法，回应内部利益保护造成的所有权缺陷。 | 最后说另一种改法 |\n\n`A`抓住第5、6段的所有权议题，但第3段的四年本科、三年法律学位和备考成本，是取得律师资格的教育负担，并非解释律所股权如何形成。第4段缩短学习路径也不改变谁能持股。全文用两组“成因—改法”解释高成本，所有权只是其中一组；`A`不足以统领前一组教育改革。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题A选项","focus":[250,2473,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>美国律所所有权的缺陷及其原因\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>美国律所所有权的缺陷及其原因\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>先指出美国律所的所有权安排普遍引发客户不满，把批评对象锁定为谁能拥有律所。\u003c/td>\n\u003ctd>先说一个广泛存在的麻烦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明这种持股制度怎样使客户支出持续增加、外部参与更难进入，缺陷因而不断加重。\u003c/td>\n\u003ctd>再写这个麻烦怎样变得更重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追溯第一层成因：职业资格与股东资格被捆绑，使所有权封闭成为制度惯性。\u003c/td>\n\u003ctd>接着拆开第一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>针对资格绑定提出拆开职业执业权和出资权的改法，以修补所有权缺陷。\u003c/td>\n\u003ctd>然后提出对应的改法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>再追溯另一层成因：内部股东希望保留收费与管理控制，形成维持封闭的利益动机。\u003c/td>\n\u003ctd>再补一个背景：还有另一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出引入独立治理和外部股东的另一种改法，回应内部利益保护造成的所有权缺陷。\u003c/td>\n\u003ctd>最后说另一种改法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>A\u003c/code>抓住第5、6段的所有权议题，但第3段的四年本科、三年法律学位和备考成本，是取得律师资格的教育负担，并非解释律所股权如何形成。第4段缩短学习路径也不改变谁能持股。全文用两组“成因—改法”解释高成本，所有权只是其中一组；\u003ccode>A\u003c/code>不足以统领前一组教育改革。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"B. the factors that help make a successful lawyer in America","raw":"**In this text, the author mainly discusses ______.**\n\n### B. the factors that help make a successful lawyer in America\n\n在美国成为成功律师的因素","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题B选项","focus":[250,2556,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":30,"option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>在美国成为成功律师的因素\u003c/p>\n\u003c/section>"},{"title":"B. the factors that help make a successful lawyer in America","raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n在美国成为成功律师的因素\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 指出美国律师难以取得持续职业成功的普遍困境，明确后文要寻找成功所需条件。 | 先说一个广泛存在的麻烦 |\n| 2 | 说明竞争加剧、客户要求提高，使单靠学历取得成功更加困难。 | 再写这个麻烦怎样变得更重 |\n| 3 | 分析失败的第一层原因是训练与实际能力脱节，从反面推出成功需要有效专业训练。 | 接着拆开第一层成因 |\n| 4 | 提出调整学习和实践安排的办法，具体说明怎样培养成功所需的能力。 | 然后提出对应的改法 |\n| 5 | 再说明经营与协作能力不足，是成功受阻的另一层原因，专业知识本身不够。 | 再补一个背景：还有另一层成因 |\n| 6 | 提出借助技术与管理合作改善职业表现，将训练能力和经营能力归纳为成功条件。 | 最后说另一种改法 |\n\n`B`应以律师如何成功为中心，把教育与管理都写成个人成功条件。实际第2段写高收入吸引与多数毕业生就业落差，第3段批评教育债务，第5段批评所有权限制带来的高收费；结尾的衡量标准也是降成本、改善客户服务。本文主要解释行业哪里有问题、制度应怎样改，并未提供成为成功律师的个人能力清单。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题B选项","focus":[250,2556,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>在美国成为成功律师的因素\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>在美国成为成功律师的因素\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>指出美国律师难以取得持续职业成功的普遍困境，明确后文要寻找成功所需条件。\u003c/td>\n\u003ctd>先说一个广泛存在的麻烦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明竞争加剧、客户要求提高，使单靠学历取得成功更加困难。\u003c/td>\n\u003ctd>再写这个麻烦怎样变得更重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>分析失败的第一层原因是训练与实际能力脱节，从反面推出成功需要有效专业训练。\u003c/td>\n\u003ctd>接着拆开第一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出调整学习和实践安排的办法，具体说明怎样培养成功所需的能力。\u003c/td>\n\u003ctd>然后提出对应的改法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>再说明经营与协作能力不足，是成功受阻的另一层原因，专业知识本身不够。\u003c/td>\n\u003ctd>再补一个背景：还有另一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出借助技术与管理合作改善职业表现，将训练能力和经营能力归纳为成功条件。\u003c/td>\n\u003ctd>最后说另一种改法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>B\u003c/code>应以律师如何成功为中心，把教育与管理都写成个人成功条件。实际第2段写高收入吸引与多数毕业生就业落差，第3段批评教育债务，第5段批评所有权限制带来的高收费；结尾的衡量标准也是降成本、改善客户服务。本文主要解释行业哪里有问题、制度应怎样改，并未提供成为成功律师的个人能力清单。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"C. a problem in America’s legal profession and solutions to it","raw":"**In this text, the author mainly discusses ______.**\n\n### C. a problem in America’s legal profession and solutions to it\n\n美国法律职业中的一个问题及其解决办法","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题C选项","focus":[250,2638,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":30,"option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/section>"},{"title":"C. a problem in America’s legal profession and solutions to it","raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n美国法律职业中的一个问题及其解决办法\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 指出美国法律职业引发客户抱怨，提出行业存在需要解决的问题。 | 先说一个广泛存在的麻烦 |\n| 2 | 展示服务支出过快增长、收入吸引大量学生而多数就业不佳，使问题具体化。 | 再写这个麻烦怎样变得更重 |\n| 3 | 分析第一层成因：单一而漫长的教育路径产生高额学费与债务。 | 接着拆开第一层成因 |\n| 4 | 提出本科直接学法、允许合格者提前考试等改法，减少教育负担。 | 然后提出对应的改法 |\n| 5 | 补充第二层成因：行会式所有权排除非律师，维持高收费并压慢创新。 | 再补一个背景：还有另一层成因 |\n| 6 | 提出开放非律师持股、引入技术与管理，提高效率、降低成本并改善服务。 | 最后说另一种改法 |\n\n`C`把高成本及其制度原因作为一个相互关联的问题。第1、2段提出并展开矛盾，第3、4段处理教育成本，第5、6段处理所有权限制；两组都落到具体解决办法。它既容纳客户处境和毕业生债务，也解释结尾为何倡议美国跟进改革，没有遗漏文章的另一半。\n\n判断：\n\n**C 保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题C选项","focus":[250,2638,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>指出美国法律职业引发客户抱怨，提出行业存在需要解决的问题。\u003c/td>\n\u003ctd>先说一个广泛存在的麻烦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>展示服务支出过快增长、收入吸引大量学生而多数就业不佳，使问题具体化。\u003c/td>\n\u003ctd>再写这个麻烦怎样变得更重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>分析第一层成因：单一而漫长的教育路径产生高额学费与债务。\u003c/td>\n\u003ctd>接着拆开第一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出本科直接学法、允许合格者提前考试等改法，减少教育负担。\u003c/td>\n\u003ctd>然后提出对应的改法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>补充第二层成因：行会式所有权排除非律师，维持高收费并压慢创新。\u003c/td>\n\u003ctd>再补一个背景：还有另一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出开放非律师持股、引入技术与管理，提高效率、降低成本并改善服务。\u003c/td>\n\u003ctd>最后说另一种改法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>C\u003c/code>把高成本及其制度原因作为一个相互关联的问题。第1、2段提出并展开矛盾，第3、4段处理教育成本，第5、6段处理所有权限制；两组都落到具体解决办法。它既容纳客户处境和毕业生债务，也解释结尾为何倡议美国跟进改革，没有遗漏文章的另一半。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"D. the role of undergraduate studies in America’s legal education","raw":"**In this text, the author mainly discusses ______.**\n\n### D. the role of undergraduate studies in America’s legal education\n\n本科教育在美国法律教育中的作用","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题D选项","focus":[250,2720,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":30,"option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>本科教育在美国法律教育中的作用\u003c/p>\n\u003c/section>"},{"title":"D. the role of undergraduate studies in America’s legal education","raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n本科教育在美国法律教育中的作用\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 指出美国本科阶段在法律人才培养中作用不清，造成教育路径上的普遍困扰。 | 先说一个广泛存在的麻烦 |\n| 2 | 说明本科与后续学法衔接不良，使学生时间和金钱负担继续加重。 | 再写这个麻烦怎样变得更重 |\n| 3 | 分析第一层成因：本科课程缺少法学基础，只能把全部专业训练推到研究生阶段。 | 接着拆开第一层成因 |\n| 4 | 提出本科直接承担基础法学训练的办法，明确其应有的教育作用。 | 然后提出对应的改法 |\n| 5 | 再解释另一层成因：本科课程与执业能力要求不衔接，学过的内容难被资格制度承认。 | 再补一个背景：还有另一层成因 |\n| 6 | 提出本科课程与资格考核互认的另一种办法，让本科教育切实分担法律职业准备。 | 最后说另一种改法 |\n\n`D`确实能覆盖第3、4段有关本科直接学法的建议，但第5段转入的是律所谁能持股，不是课程衔接；第6段使用技术和专业经理，也在说明经营效率而非本科培养作用。若本科教育是全文中心，后两段应继续围绕培养或资格衔接展开，实际却开始第二种独立的制度改革。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题D选项","focus":[250,2720,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>In this text, the author mainly discusses ______.\u003c/strong>\u003c/p>\n\u003cp>本科教育在美国法律教育中的作用\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>本科教育在美国法律教育中的作用\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>指出美国本科阶段在法律人才培养中作用不清，造成教育路径上的普遍困扰。\u003c/td>\n\u003ctd>先说一个广泛存在的麻烦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明本科与后续学法衔接不良，使学生时间和金钱负担继续加重。\u003c/td>\n\u003ctd>再写这个麻烦怎样变得更重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>分析第一层成因：本科课程缺少法学基础，只能把全部专业训练推到研究生阶段。\u003c/td>\n\u003ctd>接着拆开第一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出本科直接承担基础法学训练的办法，明确其应有的教育作用。\u003c/td>\n\u003ctd>然后提出对应的改法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>再解释另一层成因：本科课程与执业能力要求不衔接，学过的内容难被资格制度承认。\u003c/td>\n\u003ctd>再补一个背景：还有另一层成因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出本科课程与资格考核互认的另一种办法，让本科教育切实分担法律职业准备。\u003c/td>\n\u003ctd>最后说另一种改法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>D\u003c/code>确实能覆盖第3、4段有关本科直接学法的建议，但第5段转入的是律所谁能持股，不是课程衔接；第6段使用技术和专业经理，也在说明经营效率而非本科培养作用。若本科教育是全文中心，后两段应继续围绕培养或资格衔接展开，实际却开始第二种独立的制度改革。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"30题结论","raw":"### 30题结论\n\n**30. C. a problem in America’s legal profession and solutions to it**\n\n这句话就是本文后续做题的主旨底牌：\n\n**a problem in America’s legal profession and solutions to it / 美国法律职业中的一个问题及其解决办法**","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题结论","focus":[250,2380,1800,490],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":30},"html":"\u003cp>\u003cstrong>30. C. a problem in America’s legal profession and solutions to it\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>a problem in America’s legal profession and solutions to it / 美国法律职业中的一个问题及其解决办法\u003c/strong>\u003c/p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> A lot of students take up law as their profession due to ______.  \n> 许多学生选择法律作为职业，是因为______。\n\n### 题型\n\n原因细节题。第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，`tempting`直接接出学生涌入法学院的结果。`But`后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\n\n### 核心出处\n\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\n\n这段从服务成本升高写到顶尖律师的高收入，再由收入吸引学生，最后转到多数毕业生的失落和诉讼负担。它为后文教育债务及改革的必要性铺垫，而不是给入行者保证大所前景。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"26题","focus":[250,243,1800,488],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":26},"html":"\u003cblockquote>\n\u003cp>A lot of students take up law as their profession due to \u003cstrong>\u003cstrong>\u003cstrong>.\u003cbr>许多学生选择法律作为职业，是因为\u003c/strong>\u003c/strong>\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，\u003ccode>tempting\u003c/code>直接接出学生涌入法学院的结果。\u003ccode>But\u003c/code>后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003cp>这段从服务成本升高写到顶尖律师的高收入，再由收入吸引学生，最后转到多数毕业生的失落和诉讼负担。它为后文教育债务及改革的必要性铺垫，而不是给入行者保证大所前景。\u003c/p>\n"},{"title":"A. the growing demand from clients","raw":"### A. the growing demand from clients\n\n> 客户不断增长的需求\n\n**做题模式中的状态：**第一轮`A`排除。当时的判断依据是：“不能，句子没有写客户需求增长，`A`换掉了因果起点”。\n\n**错误类型：第三类——无中生有。**\n\n`A`的`growing demand from clients`说客户需求增长；原文`spending on legal services`说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\n\n`A`把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\n\n**命题人借用的原文材料：**\n\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"26题A选项","focus":[250,254,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q26-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>客户不断增长的需求\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，句子没有写客户需求增长，\u003ccode>A\u003c/code>换掉了因果起点”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>growing demand from clients\u003c/code>说客户需求增长；原文\u003ccode>spending on legal services\u003c/code>说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"A. the growing demand from clients","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 许多学生选择法律作为职业，是因为客户不断增长的需求。\n\n第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，`tempting`直接接出学生涌入法学院的结果。`But`后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\n\n`A`的`growing demand from clients`说客户需求增长；原文`spending on legal services`说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\n\n`students to pile into law schools`前面的直接连接是顶尖律师`made` ... `money`，`tempting`把学生的选择接到收入上。段内没有“客户需要更多律师，因此学生入行”这条关系。\n\n`A`把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"26题A选项","focus":[250,254,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","partIndex":1,"cumulativeFinal":false},"focusId":"focus-q26-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>客户不断增长的需求\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，句子没有写客户需求增长，\u003ccode>A\u003c/code>换掉了因果起点”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>growing demand from clients\u003c/code>说客户需求增长；原文\u003ccode>spending on legal services\u003c/code>说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多学生选择法律作为职业，是因为客户不断增长的需求。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，\u003ccode>tempting\u003c/code>直接接出学生涌入法学院的结果。\u003ccode>But\u003c/code>后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>growing demand from clients\u003c/code>说客户需求增长；原文\u003ccode>spending on legal services\u003c/code>说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\u003c/p>\n\u003cp>\u003ccode>students to pile into law schools\u003c/code>前面的直接连接是顶尖律师\u003ccode>made\u003c/code> ... \u003ccode>money\u003c/code>，\u003ccode>tempting\u003c/code>把学生的选择接到收入上。段内没有“客户需要更多律师，因此学生入行”这条关系。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003c/section>"},{"title":"A. the growing demand from clients","raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\n>\n> 第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，tempting直接接出学生涌入法学院的结果。But后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\n\n这段从服务成本升高写到顶尖律师的高收入，再由收入吸引学生，最后转到多数毕业生的失落和诉讼负担。它为后文教育债务及改革的必要性铺垫，而不是给入行者保证大所前景。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Growing demand from clients attracted more students to law schools.\n>\n> 不断增长的客户需求吸引更多学生进入法学院。\n\n若`A`成立，作者应说明客户业务量增加、律师需求扩大，再写学生因这些机会进入法学院。实际作者把高收入放在`tempting`前面，后面反而写多数人进不了大所；假设需要的市场需求链在这条推进中没有出现。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"26题A选项","focus":[250,254,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","partIndex":2,"cumulativeFinal":false},"focusId":"focus-q26-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>客户不断增长的需求\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，句子没有写客户需求增长，\u003ccode>A\u003c/code>换掉了因果起点”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>growing demand from clients\u003c/code>说客户需求增长；原文\u003ccode>spending on legal services\u003c/code>说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多学生选择法律作为职业，是因为客户不断增长的需求。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，\u003ccode>tempting\u003c/code>直接接出学生涌入法学院的结果。\u003ccode>But\u003c/code>后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>growing demand from clients\u003c/code>说客户需求增长；原文\u003ccode>spending on legal services\u003c/code>说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\u003c/p>\n\u003cp>\u003ccode>students to pile into law schools\u003c/code>前面的直接连接是顶尖律师\u003ccode>made\u003c/code> ... \u003ccode>money\u003c/code>，\u003ccode>tempting\u003c/code>把学生的选择接到收入上。段内没有“客户需要更多律师，因此学生入行”这条关系。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003cp>第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，tempting直接接出学生涌入法学院的结果。But后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\u003c/p>\n\u003c/blockquote>\n\u003cp>这段从服务成本升高写到顶尖律师的高收入，再由收入吸引学生，最后转到多数毕业生的失落和诉讼负担。它为后文教育债务及改革的必要性铺垫，而不是给入行者保证大所前景。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Growing demand from clients attracted more students to law schools.\u003c/p>\n\u003cp>不断增长的客户需求吸引更多学生进入法学院。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，作者应说明客户业务量增加、律师需求扩大，再写学生因这些机会进入法学院。实际作者把高收入放在\u003ccode>tempting\u003c/code>前面，后面反而写多数人进不了大所；假设需要的市场需求链在这条推进中没有出现。\u003c/p>\n\u003c/section>"},{"title":"A. the growing demand from clients","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> a problem in America’s legal profession and solutions to it  \n> 美国法律职业中的一个问题及其解决办法\n\n把这个主旨直接代入26题题干：\n\n> 全文讨论美国法律职业的问题与改革。本题的原因应是促成学生涌入、进而加重后续矛盾的吸引因素；具体是哪种吸引仍须由第2段money与tempting之间的因果确定。\n\n但A实际说的是：\n\n> the growing demand from clients  \n> 客户不断增长的需求\n\n主旨容许作者讨论行业的供需，但不能凭“行业有问题”推出需求增长。全文随后解释教育成本与所有权限制，未把扩大客户需求列为学生入行的驱动力；本题须回到`money`这一明确的因果起点。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"26题A选项","focus":[250,254,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","partIndex":3,"cumulativeFinal":true},"focusId":"focus-q26-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>客户不断增长的需求\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，句子没有写客户需求增长，\u003ccode>A\u003c/code>换掉了因果起点”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>growing demand from clients\u003c/code>说客户需求增长；原文\u003ccode>spending on legal services\u003c/code>说法律服务支出的增长。支出增加可以由价格提高等因素造成，不能直接当成客户需求量上升。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，  to it  \n> 美国法律职业中的一个问题及其解决办法\n\n把这个主旨直接代入26题题干：\n\n> 全文讨论美国法律职业的问题与改革。本题的原因应是促成学生涌入、进而加重后续矛盾的吸引因素；具体是哪种吸引仍须由第2段money与tempting之间的因果确定。\n\n但B实际说的是：\n\n> the increasing pressure of inflation  \n> 通货膨胀压力增加\n\n作者对高成本的诊断需要分清成本现象与入行原因。通胀只是用来凸显法律服务增长更快，全文并没有把它当成改革教育路径即可解决的择业压力；`B`不能替代高额回报的吸引。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"26题B选项","focus":[250,419,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":26,"option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","partIndex":3,"cumulativeFinal":true},"focusId":"focus-q26-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-B-0\">\u003cblockquote>\n\u003cp>通货膨胀压力增加\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>B\u003c/code>把背景比较项误写成了行为原因”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>inflation\u003c/code>确实出现在首句，却位于\u003ccode>twice as fast as inflation\u003c/code>之中，是比较法律服务支出增速的基准。原文没有将它写成学生必须选择法律职业的压力。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把一个增速比较项改成择业的直接推动力，改变了\u003ccode>inflation\u003c/code>在段落中的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多学生选择法律作为职业，是因为通货膨胀压力增加。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段先将法律服务支出增速与通胀作比较，再写 题的原因应是促成学生涌入、进而加重后续矛盾的吸引因素；具体是哪种吸引仍须由第2段money与tempting之间的因果确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the increasing pressure of inflation\u003cbr>通货膨胀压力增加\u003c/p>\n\u003c/blockquote>\n\u003cp>作者对高成本的诊断需要分清成本现象与入行原因。通胀只是用来凸显法律服务增长更快，全文并没有把它当成改革教育路径即可解决的择业压力；\u003ccode>B\u003c/code>不能替代高额回报的吸引。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"C. the prospect of working in big firms","raw":"### C. the prospect of working in big firms\n\n> 进入大律所工作的前景\n\n**做题模式中的状态：**第一轮保留`C`。当时原文的`never`被遮挡，`big-firm job`仍可见，因此“大所前景”暂时能接到职业选择。`D`中的`financial`也被遮挡，两项先并存；确定全文问题与改革的主旨后，回查将大所就业识别为期待与结果的落差，排除`C`，选择`D`。\n\n**错误类型：第一类——歪曲原意。**\n\n`C`的`big firms`与原文`a big-firm job`相同，但原句的完整关系是`most law graduates never get`这样的工作。它说毕业后的结果，未直接陈述学生进入法学院前的动机。\n\n`C`把后文用来揭示落差的就业结果改成前面的入行动因，错接了因果链的前后位置。\n\n**命题人借用的原文材料：**\n\n> During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"26题C选项","focus":[250,501,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":26,"option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q26-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-C-0\">\u003cblockquote>\n\u003cp>进入大律所工作的前景\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮保留\u003ccode>C\u003c/code>。当时原文的\u003ccode>never\u003c/code>被遮挡，\u003ccode>big-firm job\u003c/code>仍可见，因此“大所前景”暂时能接到职业选择。\u003ccode>D\u003c/code>中的\u003ccode>financial\u003c/code>也被遮挡，两项先并存；确定全文问题与改革的主旨后，回查将大所就业识别为期待与结果的落差，排除\u003ccode>C\u003c/code>，选择\u003ccode>D\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>big firms\u003c/code>与原文\u003ccode>a big-firm job\u003c/code>相同，但原句的完整关系是\u003ccode>most law graduates never get\u003c/code>这样的工作。它说毕业后的结果，未直接陈述学生进入法学院前的动机。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把后文用来揭示落差的就业结果改成前面的入行动因，错接了因果链的前后位置。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"C. the prospect of working in big firms","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 许多学生选择法律作为职业，是因为进入大律所工作的前景。\n\n第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，`tempting`直接接出学生涌入法学院的结果。`But`后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\n\n`C`的`big firms`与原文`a big-firm job`相同，但原句的完整关系是`most law graduates never get`这样的工作。它说毕业后的结果，未直接陈述学生进入法学院前的动机。\n\n前一句已经用`tempting`指明高收入吸引学生，`But`后才用就业落差限制这种期待。人可能向往大所，是一种合理猜想；本段明说的吸引物仍是收入，不能把猜想替换为直接证据。\n\n`C`把后文用来揭示落差的就业结果改成前面的入行动因，错接了因果链的前后位置。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"26题C选项","focus":[250,501,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":26,"option":"C","cumulative":true,"cumulativeGroup":"question-26-option-C","partIndex":1,"cumulativeFinal":false},"focusId":"focus-q26-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-C-0\">\u003cblockquote>\n\u003cp>进入大律所工作的前景\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮保留\u003ccode>C\u003c/code>。当时原文的\u003ccode>never\u00 /code>保持了“高收入—吸引学生入行”的因果，并不保证所有毕业生后来都能得到相同回报。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation. The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools. But most law graduates never get a big-firm job. Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.\u003c/p>\n\u003cp>第2段先将法律服务支出增速与通胀作比较，再写顶尖律师收入丰厚，tempting直接接出学生涌入法学院的结果。But后改写多数毕业生得不到大所工作的落差，不能把这个结果倒装为前面的明示动因。\u003c/p>\n\u003c/blockquote>\n\u003cp>这段从服务成本升高写到顶尖律师的高收入，再由收入吸引学生，最后转到多数毕业生的失落和诉讼负担。它为后文教育债务及改革的必要性铺垫，而不是给入行者保证大所前景。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The financial rewards earned by top lawyers attracted more students to law schools.\u003c/p>\n\u003cp>顶尖律师得到的经济回报吸引更多学生进入法学院。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>所需的推进恰好已有：先写顶尖律师收入，再写学生被吸引，最后写多数人没有得到理想职位。高额回报可以构成吸引而不成为每个人的实际结果，因此假设与\u003ccode>But\u003c/code>后的就业落差并不矛盾。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>a problem in America’s legal profession and solutions to it\u003cbr>美国法律职业中的一个问题及其解决办法\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论美国法律职业的问题与改革。本题的原因应是促成学生涌入、进而加重后续矛盾的吸引因素；具体是哪种吸引仍须由第2段money与tempting之间的因果确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the attraction of financial rewards\u003cbr>金钱回报的吸引力\u003c/p>\n\u003c/blockquote>\n\u003cp>高回报的吸引解释了学生为何大量入行，也使后文教育债务和就业落差有了起点。\u003ccode>D\u003c/code>能接上全文对行业问题的诊断，且有\u003ccode>money\u003c/code>与\u003ccode>tempting\u003c/code>的局部因果支撑，无须把“所有律师都高收入”加进去。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. D. the attraction of financial rewards**\n\n`A`把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\n\n`B`把一个增速比较项改成择业的直接推动力，改变了`inflation`在段落中的关系。\n\n`C`把后文用来揭示落差的就业结果改成前面的入行动因，错接了因果链的前后位置。\n\n`D`保持了“高收入—吸引学生入行”的因果，并不保证所有毕业生后来都能得到相同回报。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"26题","focus":[250,243,1800,488],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":26},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>26. D. the attraction of financial rewards\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把费用增长的背景拼成需求增长，再把它设为择业原因，新增了两步原文没有建立的推断。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把一个增速比较项改成择业的直接推动力，改变了\u003ccode>inflation\u003c/code>在段落中的关系。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把后文用来揭示落差的就业结果改成前面的入行动因，错接了因果链的前后位置。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>保持了“高收入—吸引学生入行”的因果，并不保证所有毕业生后来都能得到相同回报。\u003c/p>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> Which of the following adds to the costs of legal education in most American states?  \n> 在美国多数州，以下哪一项增加了法律教育成本？\n\n### 题型\n\n教育成本细节题。第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\n\n### 核心出处\n\n> There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today's average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\n\n先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"27题","focus":[250,736,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":27},"html":"\u003cblockquote>\n\u003cp>Which of the following adds to the costs of legal education in most American states?\u003cbr>在美国多数州，以下哪一项增加了法律教育成本？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>教育成本细节题。第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today&#39;s average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\u003c/p>\n"},{"title":"A. Higher tuition fees for undergraduate studies.","raw":"### A. Higher tuition fees for undergraduate studies.\n\n> 本科阶段更高的学费\n\n**做题模式中的状态：**第一轮`A`排除。当时的判断依据是：“不能，`A`改变了成本来源，把额外阶段写成了价格上涨”。\n\n**错误类型：第三类——无中生有。**\n\n`A`的`Higher tuition fees`需要一个比较：本科的学费比过去或其他教育阶段更高。原文只给`four-year undergraduate degree`的学制及先修要求，没有学费上涨或本科更贵的比较。\n\n`A`在教育成本话题中增加了学费高低的比较，未准确概括原文的额外学历要求。\n\n**命题人借用的原文材料：**\n\n> There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today's average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode" ergraduate degree\u003c/code>的学制及先修要求，没有学费上涨或本科更贵的比较。\u003c/p>\n\u003cp>本科会产生费用，不能直接推出费用“更高”。下一段提出本科直接学法，针对的是重复或额外的教育年限，并不要求先证明本科收费水平上涨。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>在教育成本话题中增加了学费高低的比较，未准确概括原文的额外学历要求。\u003c/p>\n\u003c/section>"},{"title":"A. Higher tuition fees for undergraduate studies.","raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> There are many reasons for this. One is the excessive costs of a legal education. There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam. This leaves today's average law-school graduate with $100,000 of debt on top of undergraduate debts. Law-school debt means that they have to work fearsomely hard.\n>\n> 第3段明确只有一条路径：先读无关专业的四年本科，再读三年法律学位并准备资格考试。协会授权的是法学院，昂贵的是教育与备考；这些修饰对象不能互换。\n\n先交代冗长且单一的教育路径，再量化法学院债务，最后指出债务迫使毕业生拼命工作。下一段本科直接学法或提前考试的建议，正是针对路径长度。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Higher tuition fees charged for undergraduate studies increase the cost of legal education.\n>\n> 本科阶段收取更高的学费，使法律教育成本增加。\n\n若`A`成立，应说明本科收费的比较对象或涨幅，并使降低本科收费成为对应办法。实际先列四年无关专业、再三年法律的顺序，改革也从改变学习路径入手；文章诊断的是多读一段教育，未报告收费水平变高。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"27题A选项","focus":[250,912,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":27,"option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","partIndex":2,"cumulativeFinal":false},"focusId":"focus-q27-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-A-0\">\u003cblockquote>\n\u003cp>本科阶段更高的学费\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不能，\u003ccode>A\u003c/code>改变了成本来源，把额外阶段写成了价格上涨”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>Higher tuition fees\u003
