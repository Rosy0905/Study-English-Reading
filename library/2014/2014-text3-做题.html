<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**The Fundamental Physics Prize is seen as ______.**\n\n> 基础物理学奖被视为什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>31题题干</h2>\n<p><strong>The Fundamental Physics Prize is seen as ______.</strong></p>\n<blockquote>\n<p>基础物理学奖被视为什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[249,208,746,48],[309,279,675,47],[309,349,752,47],[309,420,621,39],[309,490,641,47]],"scrollTarget":null,"meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**The critics think that the new awards will most benefit ______.**\n\n> 批评者认为，新奖项最让谁受益？\n\n题型：**观点细节题**。\n\n---","html":"<h2>32题题干</h2>\n<p><strong>The critics think that the new awards will most benefit ______.</strong></p>\n<blockquote>\n<p>批评者认为，新奖项最让谁受益？</p>\n</blockquote>\n<p>题型：<strong>观点细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[249,631,1103,48],[308,701,511,47],[309,772,570,39],[309,843,546,47],[309,913,457,47],[249,1054,1290,48]],"scrollTarget":null,"meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**The discovery of the Higgs boson is a typical case which involves ______.**\n\n> 希格斯玻色子的发现是一个典型案例，它涉及______。\n\n题型：**例子作用／细节题**。\n\n---","html":"<h2>33题题干</h2>\n<p><strong>The discovery of the Higgs boson is a typical case which involves ______.</strong></p>\n<blockquote>\n<p>希格斯玻色子的发现是一个典型案例，它涉及______。</p>\n</blockquote>\n<p>题型：<strong>例子作用／细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[308,1124,667,47],[309,1195,695,47],[309,12 学奖、三名获奖者、希格斯玻色子、时间、金钱与关注。</p>\n<p>到这里还不能自然地说清楚：新奖项到底是在奖励研究者还是宣传出资者，批评意见中哪些最关键，诺贝尔奖为什么可以作为比较对象，希格斯玻色子的例子说明了什么，时间怎样改变奖项地位，以及作者最后是接受还是拒绝这些新奖项。粗读时只要能判断“这篇文章大概在讨论新科学奖项及其争议”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住新科学奖项、企业家、批评、同行评审、诺贝尔奖和结尾的金钱与关注；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> The Fundamental Physics Prize is seen as ______.  \n> 基础物理学奖被视为什么？\n\n题干已经给出Fundamental Physics Prize这个人物或对象，第1段也出现Fundamental Physics Prize，所以把第1段从头到尾读完。\n\n> 原文参考：\n>\n> The US $3-million Fundamental Physics Prize is **[xxx]** an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. And it is far from the only one of its type. As a News Feature article in Nature discusses, a string of **[xxx]** awards for researchers have joined the Nobel Prizes in recent years. Many, like the Fundamental Physics Prize, are funded from the **[xxx]** bank accounts of Internet entrepreneurs. These **[xxx]** have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.\n>\n> 开始精读：\n>\n> The US $3-million Fundamental Physics Prize is **[xxx]** an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. / And it is far from the only one of its type. / As a News Feature article in Nature discusses, a string of **[xxx]** awards for researchers have joined the Nobel Prizes in recent years. / Many, like the Fundamental Physics Prize, are funded from the **[xxx]** bank accounts of Internet entrepreneurs. / These **[xxx]** have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.\n>\n> 顺着英文顺序读：\n>\n> 美国三百万美元的基础物理学奖[xxx]是一次有趣实验，正如亚历山大·波利亚科夫今年三月领奖时所说。 / 而且它远不是同类中唯一的奖项。 / 正如《自然》的一篇新闻特写所讨论的，近几年一连串给研究人员的[xxx]奖项加入了诺贝尔奖的行列。 / 很多奖项像基础物理学奖一样，由互联网企业家那种[xxx]银行账户提供资金。 / 这些[xxx]说，他们在自己选择的领域已经成功，现在想用财富让在科学上取得成功的人得到关注。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>31题</h2>\n<blockquote>\n<p>The Fundamental Physics Prize is seen as ______.<br />\n基础物理学奖被视为什么？</p>\n</blockquote>\n<p>题干已经给出Fundamental Physics Prize这个人物或对象，第1段也出现Fundamental Physics Prize，所以把第1段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The US $3-million Fundamental Physics Prize is <span class=\"mask\">[xxx]</span> an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. And it is far from the only one of its type. As a News Feature article in Nature discusses, a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years. Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs. These <span class= 成了象征关系。\n\n**第一轮判断：A排除。**","html":"<h3>A. a symbol of the entrepreneurs’ wealth</h3>\n<blockquote>\n<p>企业家财富的象征</p>\n</blockquote>\n<p>把A接回题干，它说的是：基础物理学奖被看作企业家财富的象征。</p>\n<p>A里的“entrepreneurs’ wealth”和原文“funded from”都在回答企业家财富是奖项的身份还是资金来源，因为wealth与bank accounts共同涉及出资者的钱，所以回看第1段这句话。</p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs.</p>\n</blockquote>\n<p>“symbol of wealth”把奖项本身定义为财富象征，而“funded from”只说明资金从企业家账户而来，资金来源不等于奖项性质。 因此“entrepreneurs’ wealth”与“funded from”在这里仍有具体差别。</p>\n<p><strong>由富豪出资，能直接推出这个奖就是财富象征吗？</strong></p>\n<p>不能，A把来源关系改成了象征关系。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47]],"questionRects":[[249,208,746,48],[309,279,675,47],[309,349,752,47],[309,420,621,39],[309,490,641,47]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“entrepreneurs’ wealth”和原文“funded from”都在回答企业家财富是奖项的身份还是资金来源，因为wealth与bank accounts共同涉及出资者的钱，所以回看第1段这句话。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"funded from","visibleOptionAnchor":"entrepreneurs’ wealth"}}}},{"section":"31题","raw":"### B. a possible replacement of the Nobel Priz \n<p>选项：</p>\n<p>A. <strong>harmful to the culture of research</strong></p>\n<p>有害于研究文化</p>\n<p>B. <strong>acceptable despite the criticism</strong></p>\n<p>尽管受到批评，仍然可以接受</p>\n<p>C. <strong>subject to undesirable changes</strong></p>\n<p>容易发生不良变化</p>\n<p>D. <strong>unworthy of public attention</strong></p>\n<p>不值得公众关注</p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47],[222,701,1266,39],[301,756,1253,47],[222,811,1331,47],[222,866,1332,47],[222,921,1321,47],[222,975,1321,48],[222,1030,1332,48],[221,1085,1143,47],[301,1140,1253,47],[222,1195,1332,47],[222,1249,504,39],[301,1304,1254,48],[222,1359,1332,47],[222,1414,1332,47],[222,1469,1329,47],[222,1523,1332,48],[222,1578,1333,48],[222,1633,1331,47],[222,1688,1331,47],[222,1743,1331,47],[222,1797,617,48],[301,1852,1252,48],[223,1903,1331,55],[222,1962,1332,47],[223,2017,1331,47],[222,2072,1328,47],[222,2126,1332,48],[222,2190,104,38]],"questionRects":[[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 介绍基础物理学奖和其他高额科学奖，说明它们多由互联网企业家出资并想让科学成功者得到关注 | 先说一个新出现的对象 |\n| 2 | 集中列出科学家的批评：缺少诺贝尔声望、服务出资者宣传、可能扭曲同行评审并强化孤独天才神话 | 再说一批反对意见 |\n| 3 | 说明颁奖者的目标并不统一，有人想制造震动、吸引人进入科学或更好奖励研究者 | 接着补充参与者各有目的 |\n| 4 | 承认新旧科学奖分配都有问题，并用合作研究、希格斯玻色子和诺贝尔奖的历史合法性作比较 | 然后放到更大背景中比较 |\n| 5 | 认为批评机制是合理的，但金钱与关注流向科学是好事，研究者也会接受，因此应有礼地接受 | 最后说仍可接受这个对象 |\n\n先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>介绍基础物理学奖和其他高额科学奖，说明它们多由互联网企业家出资并想让科学成功者得到关注</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>集中列出科学家的批评：缺少诺贝尔声望、服务出资者宣传、可能扭曲同行评审并强化孤独天才神话</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>说明颁奖者的目标并不统一，有人想制造震动、吸引人进入科学或更好奖励研究者</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>承认新旧科学奖分配都有问题，并用合作研究、希格斯玻色子和诺贝尔奖的历史合法性作比较</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>认为批评机制是合理的，但金钱与关注流向科学是好事，研究者也会接受，因此应有礼地接受</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47],[222,701,1266,39],[301,756,1253,47],[222,811,1331,47],[222,866,1332,47],[222,921,1321,47],[222,975,1321,48],[222,1030,1332,48],[221,1085,1143,47],[301,1140,1253,47],[222,1195,1332,47],[222,1249,504,39],[301,1304,1254,48],[222,1359,1332,47],[222,1414,1332,47],[222,1469,1329,47],[222,1523,1332,48],[222,1578,1333,48],[222,1633,1331,47],[222,1688,1331,47],[222,1743,1331,47],[222,1797,617,48],[301,1852,1252,48],[223,1903,1331,55],[222,1962,1332,47],[223,2017,1331,47],[222,2072,1328,47],[222,2126,1332,48],[222,2190,104,38]],"questionRects":[[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"### A. harmful to the culture of research\n\n> 有害于研究文化\n\n如果A是主旨，全文应当围绕“有害于研究文化”展开，并让每一段都服务于这一中心。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍新奖项进入科学领域 | 先说一个新出现的对象 |\n| 2 | 再说明它们破坏同行评审 | 再说一批反对意见 |\n| 3 | 接着展示对研究合作和评价体系的伤害 | 接着补充参与者各有目的 |\n| 4 | 然后证明旧奖并不存在类似问题 | 然后放到更大背景中比较 |\n| 5 | 最后要求拒绝或停止这些奖项 | 最后说仍可接受这个对象 |\n\n把A代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“有害于研究文化”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. harmful to the culture of research</h3>\n<blockquote>\n<p>有害于研究文化</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕“有害于研究文化”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍新奖项进入科学领域</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再说明它们破坏同行评审</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着展示对研究合作和评价体系的伤害</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后证明旧奖并不存在类似问题</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后要求拒绝或停止这些奖项</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>把A代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“有害于研究文化”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47],[222,701,1266,39],[301,756,1253,47],[222,811,1331,47],[222,866,1332,47],[222,921,1321,47],[222,975,1321,48],[222,1030,1332,48],[221,1085,1143,47],[301,1140,1253,47],[222,1195,1332,47],[222,1249,504,39],[301,1304,1254,48],[222,1359,1332,47],[222,1414,1332,47],[222,1469,1329,47],[222,1523,1332,48],[222,1578,1333,48],[222,1633,1331,47],[222,1688,1331,47],[222,1743,1331,47],[222,1797,617,48],[301,1852,1252,48],[223,1903,1331,55],[222,1962,1332,47],[223,2017,1331,47],[222,2072,1328,47],[222,2126,1332,48],[222,2190,104,38]],"questionRects":[[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_option","qid":"35","option":"A"}},{"section":"35题","raw":"### B. acceptable despite the criticism\n\n> 尽管受到批评，仍然可以接受\n\n如果B是主旨，全文应当围绕“尽管受到批评，仍然可以接受”展开，并让每一段都服务于这一中心。\ ind":"main_option","qid":"35","option":"B"}},{"section":"35题","raw":"### C. subject to undesirable changes\n\n> 容易发生不良变化\n\n如果C是主旨，全文应当围绕“容易发生不良变化”展开，并让每一段都服务于这一中心。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说明新奖项正在发生变化 | 先说一个新出现的对象 |\n| 2 | 再列出这些变化的具体方向 | 再说一批反对意见 |\n| 3 | 接着解释变化为何令人担忧 | 接着补充参与者各有目的 |\n| 4 | 然后比较变化前后的制度 | 然后放到更大背景中比较 |\n| 5 | 最后预测奖项还会继续恶化 | 最后说仍可接受这个对象 |\n\n把C代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“容易发生不良变化”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>C. subject to undesirable changes</h3>\n<blockquote>\n<p>容易发生不良变化</p>\n</blockquote>\n<p>如果C是主旨，全文应当围绕“容易发生不良变化”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先说明新奖项正在发生变化</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再列出这些变化的具体方向</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着解释变化为何令人担忧</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后比较变化前后的制度</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后预测奖项还会继续恶化</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>把C代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“容易发生不良变化”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47],[222,701,1266,39],[301,756,1253,47],[222,811,1331,47],[222,866,1332,47],[222,921,1321,47],[222,975,1321,48],[222,1030,1332,48],[221,1085,1143,47],[301,1140,1253,47],[222,1195,1332,47],[222,1249,504,39],[301,1304,1254,48],[222,1359,1332,47],[222,1414,1332,47],[222,1469,1329,47],[222,1523,1332,48],[222,1578,1333,48],[222,1633,1331,47],[222,1688,1331,47],[222,1743,1331,47],[222,1797,617,48],[301,1852,1252,48],[223,1903,1331,55],[222,1962,1332,47],[223,2017,1331,47],[222,2072,1328,47],[222,2126,1332,48],[222,2190,104,38]],"questionRects":[[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_option","qid":"35","option":"C"}},{"section":"35题","raw":"### D. unworthy of public attention\n\n> 不值得公众关注\n\n如果D是主旨，全文应当围绕“不值得公众关注”展开，并让每一段都服务于这一中心。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说新奖项不值得社会关注 | 先说一个新出现的对象 |\n| 2 | 再说明媒体关注造成负面影响 | 再说一批反对意见 |\n| 3 | 接着主张把金钱投向别处 | 接着补充参与者各有目的 |\n| 4 | 然后否定科学家接受奖项的合理性 | 然后放到更大背景中比较 |\n| 5 | 最后要求公众停止关注 | 最后说仍可接受这个对象 |\n\n把D代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“不值得公众关注”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>D. unworthy of public attention</h3>\n<blockquote>\n<p>不值得公众关注</p>\n</blockquote>\n<p>如果D是主旨，全文应当围绕“不值得公众关注”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先说新奖项不值得社会关注</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再说明媒体关注造成负面影响</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着主张把金钱投向别处</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后否定科学家接受奖项的合理性</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后要求公众停止关注</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>把D代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“不值得公众关注”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47],[222,701,1266,39],[301,756,1253,47],[222,811,1331,47],[222,866,1332,47],[222,921,1321,47],[222,975,1321,48],[222,1030,1332,48],[221,1085,1143,47],[301,1140,1253,47],[222,1195,1332,47],[222,1249,504,39],[301,1304,1254,48],[222,1359,1332,47],[222,1414,1332,47],[222,1469,1329,47],[222,1523,1332,48],[222,1578,1333,48],[222,1633,1331,47],[222,1688,1331,47],[222,1743,1331,47],[222,1797,617,48],[301,1852,1252,48],[223,1903,1331,55],[222,1962,1332,47],[223,2017,1331,47],[222,2072,1328,47],[222,2126,1332,48],[222,2190,104,38]],"questionRects":[[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_option","qid":"35","option":"D"}},{"section":"35题","raw":"### 35题主旨结果\n\n四个选项全部代入后，B能够覆盖开头、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。\n\nB既容纳第二段的大量批评，也保留结尾“金钱和关注来到科学是好事、应带着感激接受”的总判断；A把机制批评扩大为整体有害，C没有对应的变化主线，D与作者欢迎关注科学相反。\n\n> **35题选B。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**acceptable despite the criticism / 尽管受到批评，仍然可以接受**","html":"<h3>35题主旨结果</h3>\n<p>四个选项全部代入后，B能够覆盖开头、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。</p>\n<p>B既容纳第二段的大量批评，也保留结尾“金钱和关注来到科学是好事、应带着感激接受”的总判断；A把机制批评扩大为整体有害，C没有对应的变化主线，D与作者欢迎关注科学相反。</p>\n<blockquote>\n<p><strong>35题选B。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>acceptable despite the criticism / 尽管受到批评，仍然可以接受</strong></p>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47],[222,701,1266,39],[301,756,1253,47],[222,811,1331,47],[222,866,1332,47],[222,921,1321,47],[222,975,1321,48],[222,1030,1332,48],[221,1085,1143,47],[301,1140,1253,47],[222,1195,1332,47],[222,1249,504,39],[301,1304,1254,48],[222,1359,1332,47],[222,1414,1332,47],[222,1469,1329,47],[222,1523,1332,48],[222,1578,1333,48],[222,1633,1331,47],[222,1688,1331,47],[222,1743,1331,47],[222,1797,617,48],[301,1852,1252,48],[223,1903,1331,55],[222,1962,1332,47],[223,2017,1331,47],[222,2072,1328,47],[222,2126,1332,48],[222,2190,104,38]],"questionRects":[[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"main_result","qid":"35"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查31题：B还是C？\n\n第一遍留下：\n\n- B. a possible replacement of the Nobel Prizes\n- C. a handsome reward for researchers\n\n主旨底牌是：\n\n> **acceptable despite the criticism / 尽管受到批评，仍然可以接受**\n\n也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。\n\n第一遍只读首段时，B和C都能接上。C对应awards for researchers，B则抓住新奖“joined the Nobel Prizes”这一并列关系。首段只是介绍现象，没有说明新奖与诺贝尔奖究竟是补充、竞争还是替代，因此当时不能只凭一个joined把B彻底排掉。\n\n我们先把题干和两个选项接起来。\n\n题干问基础物理学奖被看作什么。B把它定义为诺贝尔奖可能的替代品，C把它定义为给研究者的丰厚奖励。B关心新旧奖项的关系，C关心奖项的直接功能。第一遍的局部材料对C有直接名词对应，对B只有“加入同一行列”的弱联系。\n\n现在拿主旨来检查。\n\n先看B。主旨题说明作者最终认为新奖“尽管受到批评，仍可以接受”。全文第二段还明确说这些企业家不能为自己的奖买到诺贝尔奖的声望，第四段则把新旧奖都放进分配机制的争议中比较。若新奖被看作诺贝尔奖的替代品，文章应讨论它如何取代诺贝尔的功能或地位；实际文章反复强调二者声望不同，并把新奖作为额外进入科学的金钱与关注。\n\n再看C。首段直接把它放进“a string of lucrative awards for researchers”之中，说明它首先是一项高额研究奖励。这个身份也能贯穿全文：批评者质疑奖项如何分配和服务谁，作者最后仍说大多数研究者会接受，而且金钱和关注来到科学是好事。所有争议都围绕“这项奖励该怎样看待”，而不是“它会不会取代诺贝尔”。\n\n第一遍B留下，是因为joined the Nobel Prizes让两类奖靠得很近；主旨与后文把关系说清后，靠近不等于替代。C既是首段的直接定义，也是全文争论和结尾态度所共同依赖的对象。\n\n> **31题选C。**","html":"<h2>回查31题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. a possible replacement of the Nobel Prizes</li>\n<li>C. a handsome reward for researchers</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>acceptable despite the criticism / 尽管受到批评，仍然可以接受</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍只读首段时，B和C都能接上。C对应awards for researchers，B则抓住新奖“joined the Nobel Prizes”这一并列关系。首段只是介绍现象，没有说明新奖与诺贝尔奖究竟是补充、竞争还是替代，因此当时不能只凭一个joined把B彻底排掉。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问基础物理学奖被看作什么。B把它定义为诺贝尔奖可能的替代品，C把它定义为给研究者的丰厚奖励。B关心新旧奖项的关系，C关心奖项的直接功能。第一遍的局部材料对C有直接名词对应，对B只有“加入同一行列”的弱联系。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。主旨题说明作者最终认为新奖“尽管受到批评，仍可以接受”。全文第二段还明确说这些企业家不能为自己的奖买到诺贝尔奖的声望，第四段则把新旧奖都放进分配机制的争议中比较。若新奖被看作诺贝尔奖的替代品，文章应讨论它如何取代诺贝尔的功能或地位；实际文章反复强调二者声望不同，并把新奖作为额外进入科学的金钱与关注。</p>\n<p>再看C。首段直接把它放进“a string of lucrative awards for researchers”之中，说明它首先是一项高额研究奖励。这个身份也能贯穿全文：批评者质疑奖项如何分配和服务谁，作者最后仍说大多数研究者会接受，而且金钱和关注来到科学是好事。所有争议都围绕“这项奖励该怎样看待”，而不是“它会不会取代诺贝尔”。</p>\n<p>第一遍B留下，是因为joined the Nobel Prizes让两类奖靠得很近；主旨与后文把关系说清后，靠近不等于替代。C既是首段的直接定义，也是全文争论和结尾态度所共同依赖的对象。</p>\n<blockquote>\n<p><strong>31题选C。</strong></p>\n</blockquote>\n","articleRects":[[301,316,1254,49],[222,372,1332,48],[222,427,1332,48],[220,482,1333,47],[222,537,1332,47],[222,592,1321,47],[222,647,1332,47]],"questionRects":[[249,208,746,48],[309,279,675,47],[309,349,752,47],[309,420,621,39],[309,490,641,47],[309,2040,565,47],[309,2110,549,47],[309,2181,521,47],[651,2322,526,44]],"scrollTarget":null,"meta":{"kind":"review","qid":"31"}},{"section":"最终答案","raw":"# 5. 最终答案\n\n- **31题：C** — a [xxx] reward for researchers（给研究人员的丰厚奖励）\n- **32题：B** — the founders of the new awards（新奖项的设立者）\n- **33题：A** — the joint effort of modern researchers（现代研究者的共同努力）\n- **34题：D** — Their endurance has done justice to them.（它们经受时间后获得了应有评价）\n- **35题：B** — acceptable despite the criticism（尽管受到批评，仍然可以接受）\n\n本篇答案：**CBADB**。","html":"<h1>5. 最终答案</h1>\n<ul>\n<li><strong>31题：C</strong> — a [xxx] reward for researchers（给研究人员的丰厚奖励）</li>\n<li><strong>32题：B</strong> — the founders of the new awards（新奖项的设立者）</li>\n<li><strong>33题：A</strong> — the joint effort of modern researchers（现代研究者的共同努力）</li>\n<li><strong>34题：D</strong> — Their endurance has done justice to them.（它们经受时间后获得了应有评价）</li>\n<li><strong>35题：B</strong> — acceptable despite the criticism（尽管受到批评， 读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>31题题干</h2>\n<p><strong>The Fundamental Physics Prize is seen as ______.</strong></p>\n<blockquote>\n<p>基础物理学奖被视为什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>32题题干</h2>\n<p><strong>The critics think that the new awards will most benefit ______.</strong></p>\n<blockquote>\n<p>批评者认为，新奖项最让谁受益？</p>\n</blockquote>\n<p>题型：<strong>观点细节题</strong>。</p>\n<hr />\n<h2>33题题干</h2>\n<p><strong>The discovery of the Higgs boson is a typical case which involves ______.</strong></p>\n<blockquote>\n<p>希格斯玻色子的发现是一个典型案例，它涉及______。</p>\n</blockquote>\n<p>题型：<strong>例子作用／细节题</strong>。</p>\n<hr />\n<h2>34题题干</h2>\n<p><strong>According to Paragraph 4, which of the following is true of the Nobels?</strong></p>\n<blockquote>\n<p>根据第四段，关于诺贝尔奖哪一项正确？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n<hr />\n<h2>35题题干</h2>\n<p><strong>The author believes that the new awards are ______.</strong></p>\n<blockquote>\n<p>作者认为这些新奖项______。</p>\n</blockquote>\n<p>题型：<strong>全文作者观点 / 全文主旨题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>But, First, Second</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>interesting, concerns, wise</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>fund, criticize, accept</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>prestige, legitimacy, attention</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>prizes, awards, science, researchers</td>\n</tr>\n</tbody>\n</table>\n<p>The US $3-million Fundamental Physics Prize is <span class=\"mask\">[xxx]</span> an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. And it is far from the only one of its type. As a News Feature article in Nature discusses, a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years. Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs. These <span class=\"mask\">[xxx]</span> have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.</p>\n<p>The US $3-million Fundamental Physics Prize is <span class=\"mask\">[xxx]</span> an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. / And it is far from the only one of its type. / As a News Feature article in Nature discusses, a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years. / Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs. / These <span class=\"mask\">[xxx]</span> have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.</p>\n<p>美国三百万美元基础物理学奖 is <span class=\"mask\">[xxx]</span> an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. / And it is 远非唯一 of its type. / As a 自然杂志新闻特写 discusses, 一连串 <span class=\"mask\">[xxx]</span> 研究人员奖项 have 加入诺贝尔奖行列 in recent years. / Many, like the 基础物理学奖, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of 互联网企业家. / These <span class=\"mask\">[xxx]</span> have 在各自领域成功, they say, and they want to 使用他们的财富 to 吸引注意 to those who have 在科学上成功.</p>\n<p>1、美国三百万美元基础物理学奖、远非唯一、自然杂志新闻特写、一连串、研究人员奖项、加入诺贝尔奖行列、基础物理学奖、互联网企业家、在各自领域成功、使用他们的财富、吸引注意、在科学上成功。</p>\n<p>What’s not to like? Quit y <span class=\"mask\">[xxx]</span> the myth of the lone genius.</p>\n<p>2、有什么不讨喜、相当多、少数批评者、买到格调、诺贝尔奖的声望、这些新奖项、以成就为基础的体系、同行评审主导的研究。</p>\n<p>The goals of the prize-givers seem as <span class=\"mask\">[xxx]</span> as the criticism. Some want to <span class=\"mask\">[xxx]</span>, others to draw people into science, or to better reward those who have made their careers in research.</p>\n<p>The goals of the prize-givers seem as <span class=\"mask\">[xxx]</span> as the criticism. / Some want to <span class=\"mask\">[xxx]</span>, others to draw people into science, or to better reward those who have made their careers in research.</p>\n<p>The 颁奖者的目标 seem as <span class=\"mask\">[xxx]</span> as the criticism. / Some want to <span class=\"mask\">[xxx]</span>, others to 吸引人们进入科学, or to better reward those who have made their careers in research.</p>\n<p>3、颁奖者的目标、吸引人们进入科学。</p>\n<p>As Nature has pointed out before, there are some <span class=\"mask\">[xxx]</span> concerns about how science prizes—both new and old—are distributed. The Breakthrough Prize in Life Sciences, launched this year, takes an <span class=\"mask\">[xxx]</span> view of what the life sciences include. But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n<p>As Nature has pointed out before, there are some <span class=\"mask\">[xxx]</span> concerns about how science prizes—both new and old—are distributed. / The Breakthrough Prize in Life Sciences, launched this year, takes an <span class=\"mask\">[xxx]</span> view of what the life sciences include. / But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. / The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. / Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n<p>As Nature has pointed out before, there are some <span class=\"mask\">[xxx]</span> concerns about how 科学奖项—无论新旧—如何分配. / The 生命科学突破奖, 今年创立, takes an <span class=\"mask\">[xxx]</span> view of what the 生命科学包含什么. / But the 诺贝尔基金会的限制 of 每奖三名获奖者, each of whom must still be living, has long been outgrown by the 现代研究的合作性质—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the 希格斯玻色子的发现. / The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. / Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n<p>4、科学奖项、无论新旧、如何分配、生命科学突破奖、今年创立、生命科学包含什么、诺贝尔基金会的限制、每奖三名获奖者、现代研究的合作性质、希格斯玻色子的发现。</p>\n<p>As much as some scientists may complain about the new awards, two things seem clear. First, most researchers would accept such a prize if they were offered one. Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. It is fair to criticize and question the mechanism—that is the culture of research, after all—but it is the prize-givers’ money to do with as they please. It is wise to take such gifts with <span class=\"mask\">[xxx]</span> and <span class=\"mask\">[xxx]</span>.</p>\n<p>As much as some scientists may complain about the new awards, two things seem clear. / First, most researchers would accept such a prize if they were offered one. / Second, it is surely a good thing that the money and attention come to science rather than go elsewhere. / It is fair to criticize and question the mechanism—that is the culture of research, after all—but it is the prize-givers’ money to do with as they please. / It is wise to take such gifts with <span class=\"mask\">[xxx]</span> and <span class=\"mask\">[xxx]</span>.</p>\n<p>尽管有些科学家 may 抱怨这些新奖项, two things seem clear. / First, 大多数研究人员 would 接受这样的奖 如果有人授予. / Second, it is surely 一件好事 that the 金钱与关注 流向科学 而不是别处. / It is fair to criticize and question the mechanism—that is the 研究文化, after all—but it is the prize-givers’ money to do with as they please. / It is wise to take such gifts with <span class=\"mask\">[xxx]</span> and <span class=\"mask\">[xxx]</span>.</p>\n<p>5、尽管有些科学家、抱怨这些新奖项、大多数研究人员、接受这样的奖、如果有人授予、一件好事、金钱与关注、流向科学、而不是别处、研究文化。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到新奖项、批评者或诺贝尔奖时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现三百万美元的物理学奖、互联网企业家和诺贝尔奖；中间有科学家的批评、声望、同行评审、孤独天才和不同目标；后面又出现生命科学奖、三名获奖者、希格斯玻色子、时间、金钱与关注。</p>\n<p>到这里还不能自然地说清楚：新奖项到底是在奖励研究者还是宣传出资者，批评意见中哪些最关键，诺贝尔奖为什么可以作为比较对象，希格斯玻色子的例子说明了什么，时间怎样改变奖项地位，以及作者最后是接受还是拒绝这些新奖项。粗读时只要能判断“这篇文章大概在讨论新科学奖项及其争议”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住新科学奖项、企业家、批评、同行评审、诺贝尔奖和结尾的金钱与关注；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>31题</h2>\n<blockquote>\n<p>The Fundamental Physics Prize is seen as ______.<br />\n基础物理学奖被视为什么？</p>\n</blockquote>\n<p>题干已经给出Fundamental Physics Prize这个人物或对象，第1段也出现Fundamental Physics Prize，所以把第1段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The US $3-million Fundamental Physics Prize is <span class=\"mask\">[xxx]</span> an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. And it is far from the only one of its type. As a News Feature article in Nature discusses, a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years. Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs. These <span class=\"mask\">[xxx]</span> have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.</p>\n<p>开始精读：</p>\n<p>The US $3-million Fundamental Physics Prize is <span class=\"mask\">[xxx]</span> an interesting experiment, as Alexander Polyakov said when he accepted this year’s award in March. / And it is far from the only one of its type. / As a News Feature article in Nature discusses, a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years. / Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs. / These <span class=\"mask\">[xxx]</span> have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.</p>\n<p>顺着英文顺序读：</p>\n<p>美国三百万美元的基础物理学奖[xxx]是一次有趣实验，正如亚历山大·波利亚科夫今年三月领奖时所说。 / 而且它远不是同类中唯一的奖项。 / 正如《自然》的一篇新闻特写所讨论的，近几年一连串给研究人员的[xxx]奖项加入了诺贝尔奖的行列。 / 很多奖项像基础物理学奖一样，由互联网企业家那种[xxx]银行账户提供资金。 / 这些[xxx]说，他们在自己选择的领域已经成功，现在想用财富让在科学上取得成功的人得到关注。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. a symbol of the entrepreneurs’ wealth</h3>\n<blockquote>\n<p>企业家财富的象征</p>\n</blockquote>\n<p>把A接回题干，它说的是：基础物理学奖被看作企业家财富的象征。</p>\n<p>A里的“entrepreneurs’ wealth”和原文“funded from”都在回答企业家财富是奖项的身份还是资金来源，因为wealth与bank accounts共同涉及出资者的钱，所以回看第1段这句话。</p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs.</p>\n</blockquote>\n<p>“symbol of wealth”把奖项本身定义为财富象征，而“funded from”只说明资金从企业家账户而来，资金来源不等于奖项性质。 因此“entrepreneurs’ wealth”与“funded from”在这里仍有具体差别。</p>\n<p><strong>由富豪出资，能直接推出这个奖就是财富象征吗？</strong></p>\n<p>不能，A把来源关系改成了象征关系。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. a possible replacement of the Nobel Prizes</h3>\n<blockquote>\n<p>诺贝尔奖可能的替代品</p>\n</blockquote>\n<p>把B接回题干，它说的是：基础物理学奖可能替代诺贝尔奖。</p>\n<p>B里的“replacement of the Nobel Prizes”和原文“joined the Nobel Prizes”都在回答新奖与诺贝尔奖是什么关系，因为replacement与joined都在描述新奖和诺贝尔奖的并列关系，所以回看第1段这句话。</p>\n<blockquote>\n<p>a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years.</p>\n</blockquote>\n<p>“replacement of the Nobel Prizes”说新奖可能取代旧奖，而“joined the Nobel Prizes”只说明它们加入同一奖项版图；第一段没有把二者关系彻底说死。 因此“replacement of the Nobel Prizes”与“joined the Nobel Prizes”在这里能接上。</p>\n<p><strong>joined究竟只是并列出现，还是暗示将来取代，第一段能完全排除replacement吗？</strong></p>\n<p>还不能，局部只知道新奖加入了诺贝尔奖所在的奖项体系，尚未读到后文对声望和替代关系的评价。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. a <span class=\"mask\">[xxx]</span> reward for researchers</h3>\n<blockquote>\n<p>给研究人员的丰厚奖励</p>\n</blockquote>\n<p>把C接回题干，它说的是：基础物理学奖是给研究人员的奖励。</p>\n<p>C里的“reward for researchers”和原文“awards for researchers”都在回答该奖直接奖励谁，因为reward for researchers与awards for researchers表达同一对象关系，所以回看第1段这句话。</p>\n<blockquote>\n<p>a string of <span class=\"mask\">[xxx]</span> awards for researchers have joined the Nobel Prizes in recent years.</p>\n</blockquote>\n<p>“reward for researchers”与“awards for researchers”主体、对象和功能一致；遮挡的修饰词不影响它是一项研究奖励。 因此“reward for researchers”与“awards for researchers”在这里能接上。</p>\n<p><strong>文章直接把这类奖称作awards for researchers，C是否准确概括？</strong></p>\n<p>能，C保留了奖项面向研究人员这一核心性质。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. an example of bankers’ investments</h3>\n<blockquote>\n<p>银行家投资的例子</p>\n</blockquote>\n<p>把D接回题干，它说的是：基础物理学奖是银行家投资的例子。</p>\n<p>D里的“bankers’ investments”和原文“Internet entrepreneurs”都在回答出资者是谁以及资金是什么性质，因为bank accounts容易让人联想到bankers，但原文明确写了账户持有人，所以回看第1段这句话。</p>\n<blockquote>\n<p>Many, like the Fundamental Physics Prize, are funded from the <span class=\"mask\">[xxx]</span> bank accounts of Internet entrepreneurs.</p>\n</blockquote>\n<p>“bankers’ investments”把主体写成银行家并把出资写成投资，而“Internet entrepreneurs”是互联网企业家，原文也只说funded。 因此“bankers’ investments”与“Internet entrepreneurs”在这里仍有具体差别。</p>\n<p><strong>银行账户里的钱来自企业家，能改写成银行家的投资吗？</strong></p>\n<p>不能，D同时改换了出资主体和资金关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>31题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下B和C。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>32题</h2>\n<blockquote>\n<p>The critics think that the new awards will most benefit ______.<br />\n批评者认为，新奖项最让谁受益？</p>\n</blockquote>\n<p>粗读时我大概记得第2段留下过“批评者”这个碎片，题干也出现“批评者”，所以回到第2段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>What’s not to like? Quite a lot, according to a handful of scientists quoted in the News Feature. You <span class=\"mask\">[xxx]</span> buy class, as the old saying goes, and these <span class=\"mask\">[xxx]</span> entrepreneurs <span class=\"mask\">[xxx]</span> buy their prizes the prestige of the Nobels. The new awards are an exercise in <span class=\"mask\">[xxx]</span> for those behind them, say scientists. They could <span class=\"mask\">[xxx]</span> the achievement-based system of peer-review-led research. They could <span class=\"mask\">[xxx]</span> the status quo of peer-reviewed research. They do not fund peer-reviewed research. They <span class=\"mask\">[xxx]</span> the myth of the lone genius.</p>\n<p>开始精读：</p>\n<p>What’s not to like? / Quite a lot, according to a handful of scientists quoted in the News Feature. / You <span class=\"mask\">[xxx]</span> buy class, as the old saying goes, and these <span class=\"mask\">[xxx]</span> entrepreneurs <span class=\"mask\">[xxx]</span> buy their prizes the prestige of the Nobels. / The new awards are an exercise in <span class=\"mask\">[xxx]</span> for those behind them, say scientists. / They could <span class=\"mask\">[xxx]</span> the achievement-based system of peer-review-led research. / They could <span class=\"mask\">[xxx]</span> the status quo of peer-reviewed research. / They do not fund peer-reviewed research. / They <span class=\"mask\">[xxx]</span> the myth of the lone genius.</p>\n<p>顺着英文顺序读：</p>\n<p>有什么不值得喜欢的吗？ / 根据新闻特写中引用的少数科学家，问题相当多。 / 老话说，格调是[xxx]买来的；这些[xxx]企业家也[xxx]为自己的奖买来诺贝尔奖的声望。 / 科学家说，新奖项是幕后出资者进行[xxx]的一种方式。 / 它们可能[xxx]由同行评审研究构成的、以成就为基础的体系。 / 它们可能把同行评审研究的现状[xxx]下来。 / 它们并不资助同行评审研究。 / 它们会[xxx]孤独天才的神话。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. the <span class=\"mask\">[xxx]</span> scientists</h3>\n<blockquote>\n<p>以利润为导向的科学家</p>\n</blockquote>\n<p>把A接回题干，它说的是：批评者认为新奖项最有利于某类科学家。</p>\n<p>A里的“scientists”和原文“those behind them”都在回答批评者把直接收益落在科学家还是幕后出资者，因为scientists和those behind them分别处在说话者与受益者位置，所以回看第2段这句话。</p>\n<blockquote>\n<p>The new awards are an exercise in <span class=\"mask\">[xxx]</span> for those behind them, say scientists.</p>\n</blockquote>\n<p>“scientists”在句尾是发出批评的人，而“those behind them”才是通过奖项宣传自己的人，A把说话者当成受益者。 因此“scientists”与“those behind them”在这里仍有具体差别。</p>\n<p><strong>说这句话的scientists就是从奖项中受益的人吗？</strong></p>\n<p>不能，句法位置已经把批评者和幕后受益者分开。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. the founders of the new awards</h3>\n<blockquote>\n<p>新奖项的设立者</p>\n</blockquote>\n<p>把B接回题干，它说的是：批评者认为新奖项最有利于奖项设立者。</p>\n<p>B里的“founders of the new awards”和原文“those behind them”都在回答谁通过新奖项进行自我宣传，因为founders与those behind the awards都指向幕后设立者，所以回看第2段这句话。</p>\n<blockquote>\n<p>The new awards are an exercise in <span class=\"mask\">[xxx]</span> for those behind them, say scientists.</p>\n</blockquote>\n<p>“founders of the new awards”对应“those behind them”，而self-promotion说明奖项首先给幕后人带来宣传收益。 因此“founders of the new awards”与“those behind them”在这里能接上。</p>\n<p><strong>新奖是幕后人的自我宣传活动，最受益者是否就是设立者？</strong></p>\n<p>能，B准确保留了批评者的主体判断。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. the achievement-based system</h3>\n<blockquote>\n<p>以成就为基础的体系</p>\n</blockquote>\n<p>把C接回题干，它说的是：批评者认为新奖项最有利于成就评价体系。</p>\n<p>C里的“the achievement-based system”和原文“achievement-based system”都在回答新奖对成就评价体系是帮助还是破坏，因为选项和原文都指向同一体系，动作方向正好可以比较，所以回看第2段这句话。</p>\n<blockquote>\n<p>They could <span class=\"mask\">[xxx]</span> the achievement-based system of peer-review-led research.</p>\n</blockquote>\n<p>“benefit the achievement-based system”说体系获益，而“distort the achievement-based system”说它可能被扭曲。 因此“the achievement-based system”与“achievement-based system”在这里仍有具体差别。</p>\n<p><strong>distort能解释成benefit吗？</strong></p>\n<p>不能，动作方向完全相反。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. peer-review-led research</h3>\n<blockquote>\n<p>同行评审主导的研究</p>\n</blockquote>\n<p>把D接回题干，它说的是：批评者认为新奖项最有利于同行评审研究。</p>\n<p>D里的“peer-review-led research”和原文“do not fund peer-reviewed research”都在回答新奖是否给同行评审研究带来直接资源，因为两处都谈新奖和同行评审研究的关系，所以回看第2段这句话。</p>\n<blockquote>\n<p>They do not fund peer-reviewed research.</p>\n</blockquote>\n<p>“benefit peer-review-led research”要求研究得到好处，而“do not fund peer-reviewed research”明确说连资金都不给。 因此“peer-review-led research”与“do not fund peer-reviewed research”在这里仍有具体差别。</p>\n<p><strong>不资助同行评审研究，能说它最受益吗？</strong></p>\n<p>不能，D与可见否定关系直接冲突。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>32题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>32题选B。</strong></p>\n</blockquote>\n<h2>33题</h2>\n<blockquote>\n<p>The discovery of the Higgs boson is a typical case which involves <strong><strong><strong>.<br />\n希格斯玻色子的发现是一个典型案例，它涉及</strong></strong></strong>。</p>\n</blockquote>\n<p>题干已经给出Higgs boson这个人物或对象，第4段也出现Higgs boson，所以把第4段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>As Nature has pointed out before, there are some <span class=\"mask\">[xxx]</span> concerns about how science prizes—both new and old—are distributed. The Breakthrough Prize in Life Sciences, launched this year, takes an <span class=\"mask\">[xxx]</span> view of what the life sciences include. But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>As Nature has pointed out before, there are some <span class=\"mask\">[xxx]</span> concerns about how science prizes—both new and old—are distributed. / The Breakthrough Prize in Life Sciences, launched this year, takes an <span class=\"mask\">[xxx]</span> view of what the life sciences include. / But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson. / The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money. / Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>正如《自然》以前指出的，对于科学奖项——无论新旧——如何分配，确实存在一些[xxx]关切。 / 今年创立的生命科学突破奖，对生命科学包含什么采取了[xxx]看法。 / 但诺贝尔基金会规定每个奖最多三名获奖者且每人必须仍然在世，这一限制早已被现代研究的合作性质超越；围绕承认希格斯玻色子发现时谁会被忽略而出现的[xxx]争执，将证明这一点。 / 当然，诺贝尔奖本身也是由一个非常富有的人设立的，他决定如何使用自己的钱。 / 赋予它[xxx]的是时间，而不是初衷。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. the joint effort of modern researchers</h3>\n<blockquote>\n<p>现代研究者的共同努力</p>\n</blockquote>\n<p>把A接回题干，它说的是：希格斯玻色子发现涉及现代研究者的共同努力。</p>\n<p>A里的“joint effort”和原文“collaborative nature”都在回答希格斯例子要证明现代研究有什么特征，因为joint effort与collaborative nature都是合作完成，所以回看第4段这句话。</p>\n<blockquote>\n<p>the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.</p>\n</blockquote>\n<p>“joint effort”正是“collaborative nature”的直白改写，希格斯发现被用来展示单个奖项最多三人的限制已跟不上合作研究。 因此“joint effort”与“collaborative nature”在这里能接上。</p>\n<p><strong>collaborative nature由希格斯发现来展示，是否就是共同努力？</strong></p>\n<p>能，A抓住了这个例子承担的核心关系。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. controversies over the <span class=\"mask\">[xxx]</span> status</h3>\n<blockquote>\n<p>围绕获奖者身份的争议</p>\n</blockquote>\n<p>把B接回题干，它说的是：希格斯玻色子发现涉及获奖者身份争议。</p>\n<p>B里的“controversies over”和原文“who is ignored”都在回答争议的焦点是发现者地位还是多人合作下谁被漏掉，因为controversies与row相近，但具体对象需要核对，所以回看第4段这句话。</p>\n<blockquote>\n<p>the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.</p>\n</blockquote>\n<p>“controversies over status”把争议中心写成身份地位，而“who is ignored”说的是合作成果中谁没被列入承认范围。 因此“controversies over”与“who is ignored”在这里仍有具体差别。</p>\n<p><strong>谁被遗漏的名额争议，能直接等同于身份地位争议吗？</strong></p>\n<p>不能，B把多人合作与获奖人数限制造成的遗漏，改写成一般身份争议。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the demonstration of research findings</h3>\n<blockquote>\n<p>研究成果的展示</p>\n</blockquote>\n<p>把C接回题干，它说的是：希格斯玻色子发现涉及展示研究成果。</p>\n<p>C里的“research findings”和原文“will be demonstrated”都在回答demonstrated的对象究竟是什么，因为选项抓住demonstrated这个词，但要看它后面指向的内容，所以回看第4段这句话。</p>\n<blockquote>\n<p>the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.</p>\n</blockquote>\n<p>“demonstration of findings”说展示研究成果，而“will be demonstrated”承接的是modern research的collaborative nature，不是成果展示。 因此“research findings”与“will be demonstrated”在这里仍有具体差别。</p>\n<p><strong>被demonstrated的是研究发现本身，还是现代研究的合作性质？</strong></p>\n<p>不能，C错接了demonstrated的宾语。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. legitimate concerns over the new prizes</h3>\n<blockquote>\n<p>对新奖项的合理担忧</p>\n</blockquote>\n<p>把D接回题干，它说的是：希格斯玻色子发现涉及对新奖项的合理担忧。</p>\n<p>D里的“concerns over the new prizes”和原文“Nobel Foundation’s limit”都在回答希格斯例子具体针对新奖还是诺贝尔奖限制，因为concerns出现在段首，但例子前的直接对象是诺贝尔基金会规则，所以回看第4段这句话。</p>\n<blockquote>\n<p>But the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research—as will be demonstrated by the <span class=\"mask\">[xxx]</span> row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.</p>\n</blockquote>\n<p>“concerns over the new prizes”把范围限定为新奖，而“Nobel Foundation’s limit”明确是旧奖诺贝尔奖的三人限制。 因此“concerns over the new prizes”与“Nobel Foundation’s limit”在这里仍有具体差别。</p>\n<p><strong>这个例子是在批评新奖项，还是说明诺贝尔奖人数规则落后？</strong></p>\n<p>不能，D改换了被说明的对象和范围。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>33题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>33题选A。</strong></p>\n</blockquote>\n<h2>34题</h2>\n<blockquote>\n<p>According to Paragraph 4, which of the following is true of the Nobels?<br />\n根据第四段，关于诺贝尔奖哪一项正确？</p>\n</blockquote>\n<p>题干已经明确写出Paragraph 4，所以直接回到第4段，把这一自然段从头到尾读完。</p>\n<p>第4段前面已经完整读过，这里直接沿用刚才读清的整段关系，再进入A—D逐项比较。</p>\n<h3>A. History has never cast doubt on them.</h3>\n<blockquote>\n<p>历史从未让人怀疑诺贝尔奖</p>\n</blockquote>\n<p>把A接回题干，它说的是：历史从未质疑诺贝尔奖。</p>\n<p>A里的“never cast doubt”和原文“Time, rather than intention”都在回答时间与诺贝尔奖的合法性是什么关系，因为history与Time都在说明长期过程，但never需要核对，所以回看第4段这句话。</p>\n<blockquote>\n<p>Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“never cast doubt”说从一开始就没有疑问，而“Time has given them”说明合法性是后来由时间赋予的，并非天然存在。 因此“never cast doubt”与“Time, rather than intention”在这里仍有具体差别。</p>\n<p><strong>如果合法性需要时间赋予，还能说历史从未产生怀疑吗？</strong></p>\n<p>不能，A的绝对否定与“后来获得合法性”的时间关系冲突。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. They are the most representative honor.</h3>\n<blockquote>\n<p>它们是最具代表性的荣誉</p>\n</blockquote>\n<p>把B接回题干，它说的是：诺贝尔奖是最具代表性的荣誉。</p>\n<p>B里的“most representative honor”和原文“limit of three recipients”都在回答段落是否赞扬诺贝尔奖最具代表性，因为representative与三人限制的覆盖范围可以直接比较，所以回看第4段这句话。</p>\n<blockquote>\n<p>the Nobel Foundation’s limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research.</p>\n</blockquote>\n<p>“most representative honor”强调代表性最高，而“limit of three recipients”被说成已经落后于合作研究，反而暴露代表不足。 因此“most representative honor”与“limit of three recipients”在这里仍有具体差别。</p>\n<p><strong>人数限制已经跟不上现代合作研究，能证明它最有代表性吗？</strong></p>\n<p>不能，B与段落指出的代表性缺陷相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. Their legitimacy has long been in <span class=\"mask\">[xxx]</span>.</h3>\n<blockquote>\n<p>它们的合法性长期处于争议之中</p>\n</blockquote>\n<p>把C接回题干，它说的是：诺贝尔奖的合法性长期受到争议。</p>\n<p>C里的“legitimacy has long been”和原文“Time, rather than intention”都在回答段落把合法性写成稳定结果还是长期争议，因为两处都直接谈legitimacy，谓语关系决定答案，所以回看第4段这句话。</p>\n<blockquote>\n<p>Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“legitimacy has long been”接一个被遮住的状态，而“Time has given them legitimacy”明确给出时间使其获得合法性；原文没有说长期失去认可。 因此“legitimacy has long been”与“Time, rather than intention”在这里仍有具体差别。</p>\n<p><strong>既然时间已经赋予合法性，C所说的长期未定状态还能成立吗？</strong></p>\n<p>不能，C与原句完成式的认可结果不符。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. Their endurance has done justice to them.</h3>\n<blockquote>\n<p>它们经受时间后获得了应有评价</p>\n</blockquote>\n<p>把D接回题干，它说的是：诺贝尔奖因长期存在而得到公正评价。</p>\n<p>D里的“endurance”和原文“Time, rather than intention”都在回答诺贝尔奖的认可来自初衷还是时间积累，因为endurance与Time都指向长期存在这一因素，所以回看第4段这句话。</p>\n<blockquote>\n<p>Time, rather than intention, has given them <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>“endurance”概括了奖项经受时间，“Time has given them legitimacy”说明正是这种时间积累让它得到认可。 因此“endurance”与“Time, rather than intention”在这里能接上。</p>\n<p><strong>把时间赋予合法性改写成经受时间后得到应有评价，是否接得上？</strong></p>\n<p>能，D保留了原文的时间因果。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>34题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>34题选D。</strong></p>\n</blockquote>\n<h2>35题</h2>\n<p><strong>The author believes that the new awards are ______.</strong></p>\n<p>作者认为这些新奖项______。</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>harmful to the culture of research</strong></p>\n<p>有害于研究文化</p>\n<p>B. <strong>acceptable despite the criticism</strong></p>\n<p>尽管受到批评，仍然可以接受</p>\n<p>C. <strong>subject to undesirable changes</strong></p>\n<p>容易发生不良变化</p>\n<p>D. <strong>unworthy of public attention</strong></p>\n<p>不值得公众关注</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>介绍基础物理学奖和其他高额科学奖，说明它们多由互联网企业家出资并想让科学成功者得到关注</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>集中列出科学家的批评：缺少诺贝尔声望、服务出资者宣传、可能扭曲同行评审并强化孤独天才神话</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>说明颁奖者的目标并不统一，有人想制造震动、吸引人进入科学或更好奖励研究者</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>承认新旧科学奖分配都有问题，并用合作研究、希格斯玻色子和诺贝尔奖的历史合法性作比较</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>认为批评机制是合理的，但金钱与关注流向科学是好事，研究者也会接受，因此应有礼地接受</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个选项。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后变化中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. harmful to the culture of research</h3>\n<blockquote>\n<p>有害于研究文化</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕“有害于研究文化”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍新奖项进入科学领域</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再说明它们破坏同行评审</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着展示对研究合作和评价体系的伤害</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后证明旧奖并不存在类似问题</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后要求拒绝或停止这些奖项</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>把A代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“有害于研究文化”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. acceptable despite the criticism</h3>\n<blockquote>\n<p>尽管受到批评，仍然可以接受</p>\n</blockquote>\n<p>如果B是主旨，全文应当围绕“尽管受到批评，仍然可以接受”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍新奖项及其资金来源</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再完整呈现批评者的质疑</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着说明设奖目的并不一致</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后承认新旧奖项机制都可被批评</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后认为资金关注流向科学仍值得接受</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>B与全文推进完全一致：全文先介绍企业家资助的新科学奖，再充分呈现质疑，随后把新奖与诺贝尔奖都放入奖项机制问题中比较，最后明确表示可以批评机制，但总体应接受这些馈赠。它能够覆盖每一段，而不是只覆盖一个局部例子。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. subject to undesirable changes</h3>\n<blockquote>\n<p>容易发生不良变化</p>\n</blockquote>\n<p>如果C是主旨，全文应当围绕“容易发生不良变化”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先说明新奖项正在发生变化</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再列出这些变化的具体方向</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着解释变化为何令人担忧</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后比较变化前后的制度</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后预测奖项还会继续恶化</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>把C代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“容易发生不良变化”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. unworthy of public attention</h3>\n<blockquote>\n<p>不值得公众关注</p>\n</blockquote>\n<p>如果D是主旨，全文应当围绕“不值得公众关注”展开，并让每一段都服务于这一中心。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先说新奖项不值得社会关注</td>\n<td>先说一个新出现的对象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>再说明媒体关注造成负面影响</td>\n<td>再说一批反对意见</td>\n</tr>\n<tr>\n<td>3</td>\n<td>接着主张把金钱投向别处</td>\n<td>接着补充参与者各有目的</td>\n</tr>\n<tr>\n<td>4</td>\n<td>然后否定科学家接受奖项的合理性</td>\n<td>然后放到更大背景中比较</td>\n</tr>\n<tr>\n<td>5</td>\n<td>最后要求公众停止关注</td>\n<td>最后说仍可接受这个对象</td>\n</tr>\n</tbody>\n</table>\n<p>把D代入后，虽然个别段落可以勉强沾上，但它要求全文围绕“不值得公众关注”持续展开；实际文章的多段内容和结尾并没有共同完成这个方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是各段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>35题主旨结果</h3>\n<p>四个选项全部代入后，B能够覆盖开头、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。</p>\n<p>B既容纳第二段的大量批评，也保留结尾“金钱和关注来到科学是好事、应带着感激接受”的总判断；A把机制批评扩大为整体有害，C没有对应的变化主线，D与作者欢迎关注科学相反。</p>\n<blockquote>\n<p><strong>35题选B。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>acceptable despite the criticism / 尽管受到批评，仍然可以接受</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查31题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. a possible replacement of the Nobel Prizes</li>\n<li>C. a handsome reward for researchers</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>acceptable despite the criticism / 尽管受到批评，仍然可以接受</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍只读首段时，B和C都能接上。C对应awards for researchers，B则抓住新奖“joined the Nobel Prizes”这一并列关系。首段只是介绍现象，没有说明新奖与诺贝尔奖究竟是补充、竞争还是替代，因此当时不能只凭一个joined把B彻底排掉。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问基础物理学奖被看作什么。B把它定义为诺贝尔奖可能的替代品，C把它定义为给研究者的丰厚奖励。B关心新旧奖项的关系，C关心奖项的直接功能。第一遍的局部材料对C有直接名词对应，对B只有“加入同一行列”的弱联系。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。主旨题说明作者最终认为新奖“尽管受到批评，仍可以接受”。全文第二段还明确说这些企业家不能为自己的奖买到诺贝尔奖的声望，第四段则把新旧奖都放进分配机制的争议中比较。若新奖被看作诺贝尔奖的替代品，文章应讨论它如何取代诺贝尔的功能或地位；实际文章反复强调二者声望不同，并把新奖作为额外进入科学的金钱与关注。</p>\n<p>再看C。首段直接把它放进“a string of lucrative awards for researchers”之中，说明它首先是一项高额研究奖励。这个身份也能贯穿全文：批评者质疑奖项如何分配和服务谁，作者最后仍说大多数研究者会接受，而且金钱和关注来到科学是好事。所有争议都围绕“这项奖励该怎样看待”，而不是“它会不会取代诺贝尔”。</p>\n<p>第一遍B留下，是因为joined the Nobel Prizes让两类奖靠得很近；主旨与后文把关系说清后，靠近不等于替代。C既是首段的直接定义，也是全文争论和结尾态度所共同依赖的对象。</p>\n<blockquote>\n<p><strong>31题选C。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>31题：C</strong> — a [xxx] reward for researchers（给研究人员的丰厚奖励）</li>\n<li><strong>32题：B</strong> — the founders of the new awards（新奖项的设立者）</li>\n<li><strong>33题：A</strong> — the joint effort of modern researchers（现代研究者的共同努力）</li>\n<li><strong>34题：D</strong> — Their endurance has done justice to them.（它们经受时间后获得了应有评价）</li>\n<li><strong>35题：B</strong> — acceptable despite the criticism（尽管受到批评，仍然可以接受）</li>\n</ul>\n<p>本篇答案：<strong>CBADB</strong>。</p>\n","analysisStartIndex":30,"maskInventory":{"token":"[xxx]","count":121},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"35","ordinaryFirstRoundCandidates":{"31":["B","C"],"32":["B"],"33":["A"],"34":["D"]}},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlowPlan":[{"schema":"question-flow-plan-v3","qid":"31","questionType":"ordinary","paragraphPids":[0],"locator":{"basis":"stem_entity","anchors":["Fundamental Physics Prize"],"paragraphPids":[0]},"initialReadingMode":"new","initialParagraphPids":[0],"initialContextParagraphPids":[],"questionEntryStepIndexes":[30],"initialPrecisionStepIndexes" function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h);if(!baseW||!baseH)return;const pw=wrap.querySelector('.pageWrap')||wrap;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=(a[0]/baseW*100)+'%';d.style.top=(a[1]/baseH*100)+'%';d.style.width=(a[2]/baseW*100)+'%';d.style.height=(a[3]/baseH*100)+'%';pw.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,behavior:'smooth'})}
function scrollToWrap(wrapId,behavior='smooth'){const wrap=document.getElementById(wrapId);if(!wrap)return;const sr=leftPane.getBoundingClientRect(),r=wrap.getBoundingClientRect();const top=leftPane.scrollTop+r.top-sr.top;const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,top));leftPane.scrollTo({top:target,behavior})}
