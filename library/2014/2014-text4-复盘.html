liberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者在后文继续追究报告不触及核心的问题，最后警告它可能使改革倒退。<\/p>\n<\/blockquote>\n<p>实际文章将首段提出的不足越说越具体，没有在指出问题后表示谅解或认为它无伤大雅。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report leaves the central crisis unaddressed, but this omission is understandable and should not count heavily against it.<\/p>\n<p>报告没有处理核心危机，但这一遗漏可以理解，不应因此过多责备它。<\/p>\n<\/blockquote>\n<p>D成立至少需要这种接受遗漏、减轻追责的推进。原文结尾反而解释遗漏怎样遮蔽挑战、妨碍改革，处理缺陷的方向不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>作者应当把报告回避教育中的不自由当作需要批评的问题，而不是因目标良好就接受这一核心遗漏。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>Tolerant.<br>宽容的<\/p>\n<\/blockquote>\n<p>D把报告的不足放在可以包容的位置，主旨却围绕这个不足组织整篇评论。第1段的可能弊大于利和第6段的改革风险进一步说明，作者并未淡化其影响。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"36题结论","raw":"### 36题结论\n\n> **36. A. Critical.**\n\nA把有限赞扬后的核心缺陷和后果评价概括为批评。\n\nB借用真实赞扬，却用局部认可替代整份报告的主导评价。\n\nC把针对内容和后果的批评加重成了轻蔑。\n\nD把承认报告有优点误成了对核心遗漏的宽容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[6,4,1676,470],"sourceW":1686,"sourceH":2543},"meta":{"kind":"conclusion","question":36},"level":3,"html":"<blockquote>\n<p><strong>36. A. Critical.<\/strong><\/p>\n<\/blockquote>\n<p>A把有限赞扬后的核心缺陷和后果评价概括为批评。<\/p>\n<p>B借用真实赞扬，却用局部认可替代整份报告的主导评价。<\/p>\n<p>C把针对内容和后果的批评加重成了轻蔑。<\/p>\n<p>D把承认报告有优点误成了对核心遗漏的宽容。<\/p>\n"},{"title":"37题 · 题干、题型与核心出处","raw":"## 37题\n\n> Influential figures in the Congress required that the AAAS report on how to ______.  \n> 国会中的重要人物要求AAAS报告如何______。\n\n### 题型\n\n这是一道具体细节题。题干中的国会重要人物对应第2段的两党国会议员，问的是他们给AAAS的任务最终要达到什么目的。要区分提出要求的人、可以采取行动的人以及采取行动的目标。\n\n### 核心出处\n\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"\n\n`Influential figures in the Congress`对应`leading congressional Democrats and Republicans`，`required`对应来信中的`asking`。先由`identify actions`给出报告要研究的行动，再由`to maintain national excellence`给出这些行动服务的目标。空格要回答后者。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[6,580,1675,480],"sourceW":1686,"sourceH":2543},"meta":{"kind":"question","question":37},"level":2,"html":"<blockquote>\n<p>Influential figures in the Congress required that the AAAS report on how to <strong><strong><strong>.<br>国会中的重要人物要求AAAS报告如何<\/strong><\/strong><\/strong>。<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道具体细节题。题干中的国会重要人物对应第2段的两党国会议员，问的是他们给AAAS的任务最终要达到什么目的。要区分提出要求的人、可以采取行动的人以及采取行动的目标。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<p><code>Influential figures in the Congress<\/code>对应<code>leading congressional Democrats and Republicans<\/code>，<code>required<\/code>对应来信中的<code>asking<\/code>。先由<code>identify actions<\/code>给出报告要研究的行动，再由<code>to maintain national excellence<\/code>给出这些行动服务的目标。空格要回答后者。<\/p>\n"},{"title":"A. safeguard individuals’ rights to education","raw":"### A. safeguard individuals’ rights to education\n\n> 保障个人的受教育权\n\n**做题模式中的状态：** 当时A没有遮挡，虽然原文的`benefactors`等词显示为`[xxx]`，仍读到了`maintain national excellence`。做题时把个人受教育权与国家层面的学术教育水平分开，第一轮排除A，后续未变。\n\n**错误类型：第一类——歪曲原意。**\n\nA沿用了教育这一话题，却把国会要求维持国家学术与教育卓越的任务，换成了保障个人受教育权。原句中的个人捐助者只是可采取行动的主体之一，也不是等待权利保障的对象。\n\n**出处：**\n\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 A选项","focus":[85,748,913,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":37,"option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q37-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>保障个人的受教育权<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，虽然原文的<code>benefactors<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>maintain national excellence<\/code>。做题时把个人受教育权与国家层面的学术教育水平分开，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A沿用了教育这一话题，却把国会要求维持国家学术与教育卓越的任务，换成了保障个人受教育权。原句中的个人捐助者只是可采取行动的主体之一，也不是等待权利保障的对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. safeguard individuals’ rights to education","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 国会中的重要人物要求AAAS报告如何保障个人的受教育权。\n\n题干的国会要求在第2段由`asking that it identify actions`引出。A中的`rights to education`要与目的从句`to maintain national excellence`比较，而不能仅凭双方都有`education`就接上。\n\n原句先列各方可以采取的行动，再说明行动服务于国家在人文和社会科学研究及教育领域的卓越水平。它没有把入学权、教育机会或权利保障作为这项任务的目标。\n\n`individual benefactors`中的个人是捐助者，与政府、大学等并列，属于行动主体。把这一处的个人搬到“受教育权”前，会同时改换其身份和关系。\n\nA把国家层面的学术教育目标改成个人权利保障，回答的不是国会这次委托的目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 A选项","focus":[85,748,913,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q37-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>保障个人的受教育权<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，虽然原文的<code>benefactors<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>maintain national excellence<\/code>。做题时把个人受教育权与国家层面的学术教育水平分开，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A沿用了教育这一话题，却把国会要求维持国家学术与教育卓越的任务，换成了保障个人受教育权。原句中的个人捐助者只是可采取行动的主体之一，也不是等待权利保障的对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保障个人的受教育权。<\/p>\n<\/blockquote>\n<p>题干的国会要求在第2段由<code>asking that it identify actions<\/code>引出。A中的<code>rights to education<\/code>要与目的从句<code>to maintain national excellence<\/code>比较，而不能仅凭双方都有<code>education<\/code>就接上。<\/p>\n<p>原句先列各方可以采取的行动，再说明行动服务于国家在人文和社会科学研究及教育领域的卓越水平。它没有把入学权、教育机会或权利保障作为这项任务的目标。<\/p>\n<p><code>individual benefactors<\/code>中的个人是捐助者，与政府、大学等并列，属于行动主体。把这一处的个人搬到“受教育权”前，会同时改换其身份和关系。<\/p>\n<p>A把国家层面的学术教育目标改成个人权利保障，回答的不是国会这次委托的目的。<\/p>\n<\/section>"},{"title":"A. safeguard individuals’ rights to education","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"\n>\n> In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission's 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.\n>\n> 国会要求研究各方可以采取哪些行动来维持学术与教育卓越，AAAS随后成立相应的人文社科委员会。\n\n委员会的设立是回应这项教育研究任务；后面的成员名单介绍谁参与研究，没有把任务转向个人教育权保障。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The letters asked the AAAS to identify actions that would safeguard individuals’ rights to education.\n>\n> 来信要求AAAS找出能够保障个人受教育权的行动。\n\nA成立只需把国会目标改成教育权保障，但原文同一位置写的是维持国家学术和教育卓越。两种写法的行动目的不同，参与主体中有个人也填补不了这个差别。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 A选项","focus":[85,748,913,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q37-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>保障个人的受教育权<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，虽然原文的<code>benefactors<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>maintain national excellence<\/code>。做题时把个人受教育权与国家层面的学术教育水平分开，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A沿用了教育这一话题，却把国会要求维持国家学术与教育卓越的任务，换成了保障个人受教育权。原句中的个人捐助者只是可采取行动的主体之一，也不是等待权利保障的对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保障个人的受教育权。<\/p>\n<\/blockquote>\n<p>题干的国会要求在第2段由<code>asking that it identify actions<\/code>引出。A中的<code>rights to education<\/code>要与目的从句<code>to maintain national excellence<\/code>比较，而不能仅凭双方都有<code>education<\/code>就接上。<\/p>\n<p>原句先列各方可以采取的行动，再说明行动服务于国家在人文和社会科学研究及教育领域的卓越水平。它没有把入学权、教育机会或权利保障作为这项任务的目标。<\/p>\n<p><code>individual benefactors<\/code>中的个人是捐助者，与政府、大学等并列，属于行动主体。把这一处的个人搬到“受教育权”前，会同时改换其身份和关系。<\/p>\n<p>A把国家层面的学术教育目标改成个人权利保障，回答的不是国会这次委托的目的。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<p>国会要求研究各方可以采取哪些行动来维持学术与教育卓越，AAAS随后成立相应的人文社科委员会。<\/p>\n<\/blockquote>\n<p>委员会的设立是回应这项教育研究任务；后面的成员名单介绍谁参与研究，没有把任务转向个人教育权保障。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The letters asked the AAAS to identify actions that would safeguard individuals’ rights to education.<\/p>\n<p>来信要求AAAS找出能够保障个人受教育权的行动。<\/p>\n<\/blockquote>\n<p>A成立只需把国会目标改成教育权保障，但原文同一位置写的是维持国家学术和教育卓越。两种写法的行动目的不同，参与主体中有个人也填补不了这个差别。<\/p>\n<\/section>"},{"title":"A. safeguard individuals’ rights to education","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入37题题干：\n\n> 全文主旨只能确认国会委托与博雅教育面临的问题及改革有关，不能仅凭标题判断国会要求保障个人权利还是维持教育水平。\n\n但A实际说的是：\n\n> safeguard individuals’ rights to education  \n> 保障个人的受教育权\n\nA需要“保障个人受教育权”这一具体任务，主旨没有给出它。本项最终仍要根据`maintain national excellence`这处局部原文判断：原文目标是维持国家学术和教育卓越，A改换了目标对象。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 A选项","focus":[85,748,913,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q37-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>保障个人的受教育权<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，虽然原文的<code>benefactors<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>maintain national excellence<\/code>。做题时把个人受教育权与国家层面的学术教育水平分开，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A沿用了教育这一话题，却把国会要求维持国家学术与教育卓越的任务，换成了保障个人受教育权。原句中的个人捐助者只是可采取行动的主体之一，也不是等待权利保障的对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保障个人的受教育权。<\/p>\n<\/blockquote>\n<p>题干的国会要求在第2段由<code>asking that it identify actions<\/code>引出。A中的<code>rights to education<\/code>要与目的从句<code>to maintain national excellence<\/code>比较，而不能仅凭双方都有<code>education<\/code>就接上。<\/p>\n<p>原句先列各方可以采取的行动，再说明行动服务于国家在人文和社会科学研究及教育领域的卓越水平。它没有把入学权、教育机会或权利保障作为这项任务的目标。<\/p>\n<p><code>individual benefactors<\/code>中的个人是捐助者，与政府、大学等并列，属于行动主体。把这一处的个人搬到“受教育权”前，会同时改换其身份和关系。<\/p>\n<p>A把国家层面的学术教育目标改成个人权利保障，回答的不是国会这次委托的目的。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<p>国会要求研究各方可以采取哪些行动来维持学术与教育卓越，AAAS随后成立相应的人文社科委员会。<\/p>\n<\/blockquote>\n<p>委员会的设立是回应这项教育研究任务；后面的成员名单介绍谁参与研究，没有把任务转向个人教育权保障。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The letters asked the AAAS to identify actions that would safeguard individuals’ rights to education.<\/p>\n<p>来信要求AAAS找出能够保障个人受教育权的行动。<\/p>\n<\/blockquote>\n<p>A成立只需把国会目标改成教育权保障，但原文同一位置写的是维持国家学术和教育卓越。两种写法的行动目的不同，参与主体中有个人也填补不了这个差别。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认国会委托与博雅教育面临的问题及改革有关，不能仅凭标题判断国会要求保障个人权利还是维持教育水平。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>safeguard individuals’ rights to education<br>保障个人的受教育权<\/p>\n<\/blockquote>\n<p>A需要“保障个人受教育权”这一具体任务，主旨没有给出它。本项最终仍要根据<code>maintain national excellence<\/code>这处局部原文判断：原文目标是维持国家学术和教育卓越，A改换了目标对象。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. define the government’s role in education","raw":"### B. define the government’s role in education\n\n> 界定政府在教育中的角色\n\n**做题模式中的状态：** 当时B中的`government’s`显示为`[xxx]`，但`define`和`role in education`可读。原文里`identify actions`以及联邦、州和地方政府等行动主体也可读，因此已能分清“界定角色”与“找出各方可采取的行动”，第一轮排除B，后续未变。\n\n**错误类型：第一类——歪曲原意。**\n\nB借用了原句列出的政府，却把政府与其他机构可以采取哪些行动，改成界定政府的职责角色。原文中的政府只是并列行动者之一，报告的最终目标也不是划定政府的权责边界。\n\n**出处：**\n\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 B选项","focus":[85,830,921,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":37,"option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q37-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>界定政府在教育中的角色<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B中的<code>government’s<\/code>显示为<code>[xxx]<\/code>，但<code>define<\/code>和<code>role in education<\/code>可读。原文里<code>identify actions<\/code>以及联邦、州和地方政府等行动主体也可读，因此已能分清“界定角色”与“找出各方可采取的行动”，第一轮排除B，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了原句列出的政府，却把政府与其他机构可以采取哪些行动，改成界定政府的职责角色。原文中的政府只是并列行动者之一，报告的最终目标也不是划定政府的权责边界。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. define the government’s role in education","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 国会中的重要人物要求AAAS报告如何界定政府在教育中的角色。\n\n`the government’s`对应原文的`federal, state and local governments`，而`define ... role`需要与`identify actions`核对。共同提到政府，不代表两处给政府安排的关系相同。\n\n原文的问题是“哪些行动可以由这些主体采取”，主体包括政府、大学、基金会、教育者和个人捐助者。来信希望这些行动维持人文社科的研究与教育卓越。\n\n选项的问题变成“政府在教育中是什么角色”，既把多个主体收窄成政府，又把寻找行动方案改成职责界定。行动研究涉及政府，并不自动等于重新划定政府角色。\n\nB同时改变了任务动词和主体范围，不能概括这次国会委托。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 B选项","focus":[85,830,921,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q37-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>界定政府在教育中的角色<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B中的<code>government’s<\/code>显示为<code>[xxx]<\/code>，但<code>define<\/code>和<code>role in education<\/code>可读。原文里<code>identify actions<\/code>以及联邦、州和地方政府等行动主体也可读，因此已能分清“界定角色”与“找出各方可采取的行动”，第一轮排除B，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了原句列出的政府，却把政府与其他机构可以采取哪些行动，改成界定政府的职责角色。原文中的政府只是并列行动者之一，报告的最终目标也不是划定政府的权责边界。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何界定政府在教育中的角色。<\/p>\n<\/blockquote>\n<p><code>the government’s<\/code>对应原文的<code>federal, state and local governments<\/code>，而<code>define ... role<\/code>需要与<code>identify actions<\/code>核对。共同提到政府，不代表两处给政府安排的关系相同。<\/p>\n<p>原文的问题是“哪些行动可以由这些主体采取”，主体包括政府、大学、基金会、教育者和个人捐助者。来信希望这些行动维持人文社科的研究与教育卓越。<\/p>\n<p>选项的问题变成“政府在教育中是什么角色”，既把多个主体收窄成政府，又把寻找行动方案改成职责界定。行动研究涉及政府，并不自动等于重新划定政府角色。<\/p>\n<p>B同时改变了任务动词和主体范围，不能概括这次国会委托。<\/p>\n<\/section>"},{"title":"B. define the government’s role in education","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"\n>\n> To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.\n>\n> 国会要求寻找多方可采取的行动，报告继而提出研究投入、课程设计、教师经费和学者参与等措施。\n\n建议沿着如何改进学术与教育展开，没有把政府、大学和个人的权责边界作为讨论中心。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The AAAS was asked to define the government’s role in education and distinguish it from the roles of universities and private benefactors.\n>\n> AAAS被要求界定政府在教育中的角色，并将它与大学和私人捐助者的角色区分开。\n\nB所需的写法要讨论谁负责什么及角色边界。实际原文列各方能做的行动与共同目标，没有完成这一步职责界定。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 B选项","focus":[85,830,921,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q37-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquo o keep people interested in liberal education.\n>\n> 来信要求AAAS找出让人们继续对博雅教育感兴趣的办法。\n\nC成立需要在国会目标中明确出现公众兴趣。原文相应位置给的是国家卓越；后文对教育能力和资源的讨论也没有把这个目标改成兴趣维持。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 C选项","focus":[85,913,941,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q37-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>保持人们对博雅教育的兴趣<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>maintain national excellence<\/code>也可读。做题时已比较出<code>retain<\/code>和<code>maintain<\/code>虽相近，后面的公众兴趣与国家卓越却不同，所以第一轮排除C，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C保留了“保持”这个动作，却把原文要保持的国家学术教育卓越替换成了人们的兴趣。两个命题同谈博雅教育，但一个关乎研究和教育水平，另一个关乎公众是否感兴趣。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保持人们对博雅教育的兴趣。<\/p>\n<\/blockquote>\n<p><code>retain<\/code>容易让人联想到目的从句里的<code>maintain<\/code>。真正需要继续核对的是两个动词后面的宾语：选项是<code>people’s interest<\/code>，原文是<code>national excellence<\/code>。<\/p>\n<p>原句用<code>in humanities and social scientific scholarship and education<\/code>限定国家卓越所属的领域；它没有把卓越解释为公众热情或关注度。<\/p>\n<p>即使社会兴趣有助于教育发展，这也是我们另加的一种可能联系。国会来信在此明说的目标仍是维持学术与教育水平，而非维持兴趣。<\/p>\n<p>C只对应了“保持”这个动作，替换了被保持的对象，完整命题因此改变。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>国会把目标定为维持学术与教育卓越，报告据此列出研究投入、课程能力和师资等方面的建议。<\/p>\n<\/blockquote>\n<p>实际展开关注教育研究怎样得到支持，未把吸引和留住公众兴趣作为国会任务的主线。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The letters asked the AAAS to identify ways to keep people interested in liberal education.<\/p>\n<p>来信要求AAAS找出让人们继续对博雅教育感兴趣的办法。<\/p>\n<\/blockquote>\n<p>C成立需要在国会目标中明确出现公众兴趣。原文相应位置给的是国家卓越；后文对教育能力和资源的讨论也没有把这个目标改成兴趣维持。<\/p>\n<\/section>"},{"title":"C. retain people’s interest in liberal education","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入37题题干：\n\n> 主旨只能确认这是一份应当面对博雅教育危机的报告，不能判断国会要求保持的是公众兴趣还是教育卓越。\n\n但C实际说的是：\n\n> retain people’s interest in liberal education  \n> 保持人们对博雅教育的兴趣\n\nC中的公众兴趣不是标题可以推出的具体任务。本项仍要比较`maintain national excellence`：它以国家的学术教育水平为对象，不能用方向相近的“支持博雅教育”概念抹掉与公众兴趣的差别。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 C选项","focus":[85,913,941,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q37-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p> y to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>国会把目标定为维持学术与教育卓越，报告据此列出研究投入、课程能力和师资等方面的建议。<\/p>\n<\/blockquote>\n<p>实际展开关注教育研究怎样得到支持，未把吸引和留住公众兴趣作为国会任务的主线。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The letters asked the AAAS to identify ways to keep people interested in liberal education.<\/p>\n<p>来信要求AAAS找出让人们继续对博雅教育感兴趣的办法。<\/p>\n<\/blockquote>\n<p>C成立需要在国会目标中明确出现公众兴趣。原文相应位置给的是国家卓越；后文对教育能力和资源的讨论也没有把这个目标改成兴趣维持。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>主旨只能确认这是一份应当面对博雅教育危机的报告，不能判断国会要求保持的是公众兴趣还是教育卓越。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>retain people’s interest in liberal education<br>保持人们对博雅教育的兴趣<\/p>\n<\/blockquote>\n<p>C中的公众兴趣不是标题可以推出的具体任务。本项仍要比较<code>maintain national excellence<\/code>：它以国家的学术教育水平为对象，不能用方向相近的“支持博雅教育”概念抹掉与公众兴趣的差别。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. keep a leading position in liberal education","raw":"### D. keep a leading position in liberal education\n\n> 保持博雅教育的领先地位\n\n**做题模式中的状态：** 当时D完整可读，原文中`maintain national excellence`和人文社科教育的范围也可读。虽然委员会名称、部分成员描述和捐助者处显示为`[xxx]`，不影响核对任务目标；第一轮保留D，其他三项排除后确定D，后续未变。\n\n**选项类型：正确同义改写。**\n\n`keep`对应`maintain`，`a leading position`概括`national excellence`所表达的卓越地位。`liberal education`结合全文语境概括这里的人文与社会科学教育，保留了国会希望维持教育卓越的目标。\n\n**出处：**\n\n> In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"","se nities and social scientific scholarship and education.\"\n>\n> In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission's 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.\n>\n> The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.\n>\n> 国会提出维持人文社科卓越的任务，AAAS成立委员会回应，结尾作者又追问报告是否看清了国会要求揭示的挑战。\n\n文章从任务走向报告，再回到报告是否完成任务。作者批评报告表现，并没有更换国会最初提出的目标。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The AAAS was asked to propose actions that would help the country maintain excellence in liberal education.\n>\n> AAAS被要求提出行动，帮助国家维持博雅教育的卓越水平。\n\nD所需的写法能够在国会来信中找到：提出行动服务于维持卓越。报告后来是否真正做到，是作者另一个层面的评价，不影响国会任务本身。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 D选项","focus":[85,995,956,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q37-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>保持博雅教育的领先地位<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文中<code>maintain national excellence<\/code>和人文社科教育的范围也可读。虽然委员会名称、部分成员描述和捐助者处显示为<code>[xxx]<\/code>，不影响核对任务目标；第一轮保留D，其他三项排除后确定D，后续未变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>keep<\/code>对应<code>maintain<\/code>，<code>a leading position<\/code>概括<code>national excellence<\/code>所表达的卓越地位。<code>liberal education<\/code>结合全文语境概括这里的人文与社会科学教育，保留了国会希望维持教育卓越的目标。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保持博雅教育的领先地位。<\/p>\n<\/blockquote>\n<p>定位依靠国会来信中的<code>asking<\/code>与目的从句<code>to maintain national excellence<\/code>。D中的<code>keep a leading position<\/code>正要对应这个目的，而不是报告组建委员会的过程。<\/p>\n<p>原文先说AAAS要找出各方可以采取的行动，随后说明行动目标是维持国家在人文和社会科学学术与教育方面的卓越。选项保留“维持”与“卓越地位”这两个核心部分。<\/p>\n<p>这里的“领先”是对<code>excellence<\/code>所指卓越水平的概括，不需要另外推成某个具体国际排名。范围仍是全文讨论的博雅教育，不是所有学科或所有教育事务。<\/p>\n<p>D准确改写了国会交给AAAS的目标，没有把行动主体、报告任务和教育目标混为一谈。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>国会提出维持人文社科卓越的任务，AAAS成立委员会回应，结尾作者又追问报告是否看清了国会要求揭示的挑战。<\/p>\n<\/blockquote>\n<p>文章从任务走向报告，再回到报告是否完成任务。作者批评报告表现，并没有更换国会最初提出的目标。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The AAAS was asked to propose actions that would help the country maintain excellence in liberal education.<\/p>\n<p>AAAS被要求提出行动，帮助国家维持博雅教育的卓越水平。<\/p>\n<\/blockquote>\n<p>D所需的写法能够在国会来信中找到：提出行动服务于维持卓越。报告后来是否真正做到，是作者另一个层面的评价，不影响国会任务本身。<\/p>\n<\/section>"},{"title":"D. keep a leading position in liberal education","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入37题题干：\n\n> 全文主旨只能确认国会的委托涉及博雅教育的真实挑战，不能单凭标题推出“保持领先地位”这一具体措辞。\n\nD实际说的是：\n\n> keep a leading position in liberal education  \n> 保持博雅教育的领先地位\n\nD最终由局部原文`maintain national excellence`支持。主旨解释了作者为什么要追问报告能否服务于这项任务，但“维持卓越”的目标必须从来信取得，不能靠主题相符替代。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题 D选项","focus":[85,995,956,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":37,"option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q37-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>保持博雅教育的领先地位<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文中<code>maintain national excellence<\/code>和人文社科教育的范围也可读。虽然委员会名称、部分成员描述和捐助者处显示为<code>[xxx]<\/code>，不影响核对任务目标；第一轮保留D，其他三项排除后确定D，后续未变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>keep<\/code>对应<code>maintain<\/code>，<code>a leading position<\/code>概括<code>national excellence<\/code>所表达的卓越地位。<code>liberal education<\/code>结合全文语境概括这里的人文与社会科学教育，保留了国会希望维持教育卓越的目标。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保持博雅教育的领先地位。<\/p>\n<\/blockquote>\n<p>定位依靠国会来信中的<code>asking<\/code>与目的从句<code>to maintain national excellence<\/code>。D中的<code>keep a leading position<\/code>正要对应这个目的，而不是报告组建委员会的过程。<\/p>\n<p>原文先说AAAS要找出各方可以采取的行动，随后说明行动目标是维持国家在人文和社会科学学术与教育方面的卓越。选项保留“维持”与“卓越地位”这两个核心部分。<\/p>\n<p>这里的“领先”是对<code>excellence<\/code>所指卓越水平的概括，不需要另外推成某个具体国际排名。范围仍是全文讨论的博雅教育，不是所有学科或所有教育事务。<\/p>\n<p>D准确改写了国会交给AAAS的目标，没有把行动主体、报告任务和教育目标混为一谈。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>国会提出维持人文社科卓越的任务，AAAS成立委员会回应，结尾作者又追问报告是否看清了国会要求揭示的挑战。<\/p>\n<\/blockquote>\n<p>文章从任务走向报告，再回到报告是否完成任务。作者批评报告表现，并没有更换国会最初提出的目标。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The AAAS was asked to propose actions that would help the country maintain excellence in liberal education.<\/p>\n<p>AAAS被要求提出行动，帮助国家维持博雅教育的卓越水平。<\/p>\n<\/blockquote>\n<p>D所需的写法能够在国会来信中找到：提出行动服务于维持卓越。报告后来是否真正做到，是作者另一个层面的评价，不影响国会任务本身。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q37-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认国会的委托涉及博雅教育的真实挑战，不能单凭标题推出“保持领先地位”这一具体措辞。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>keep a leading position in liberal education<br>保持博雅教育的领先地位<\/p>\n<\/blockquote>\n<p>D最终由局部原文<code>maintain national excellence<\/code>支持。主旨解释了作者为什么要追问报告能否服务于这项任务，但“维持卓越”的目标必须从来信取得，不能靠主题相符替代。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. D. keep a leading position in liberal education**\n\nA把维持国家学术教育卓越的任务改成保障个人受教育权。\n\nB把多方行动方案改成了政府角色和职责的界定。\n\nC借用“保持”这个动作，却把国家卓越换成公众兴趣。\n\nD用“保持领先地位”概括国会要求维持学术与教育卓越的目标。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[6,580,1675,480],"sourceW":1686,"sourceH":2543},"meta":{"kind":"conclusion","question":37},"level":3,"html":"<blockquote>\n<p><strong>37. D. keep a leading position in liberal education<\/strong><\/p>\n<\/blockquote>\n<p>A把维持国家学术教育卓越的任务改成保障个人受教育权。<\/p>\n<p>B把多方行动方案改成了政府角色和职责的界定。<\/p>\n<p>C借用“保持”这个动作，却把国家卓越换成公众兴趣。<\/p>\n<p>D用“保持领先地位”概括国会要求维持学术与教育卓越的目标。<\/p>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> According to Paragraph 3, the report suggests ______.  \n> 根据第三段，这份报告建议______。\n\n### 题型\n\n这是一道段落细节题。对象是报告，范围限定第3段，要求识别报告实际提出的一项建议。段内并列建议很多，要核对每个动作与它自己的对象，不能把相邻建议拼成新主张。\n\n### 核心出处\n\n> Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.\n>\n> To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.\n>\n> The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.\n\n题干中的`suggests`可对应`supports`、`stresses`、`encourages`、`calls for`和`advocates`。这些动词各自连接不同建议：全面识字、历史政府研究、新技术使用、课程和师资投入、外语与国际学习。某个名词确实出现，不代表选项给它配的限定和动作也成立。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[6,1155,1210,398],"sourceW":1686,"sourceH":2543},"meta":{"kind":"question","question":38},"level":2,"html":"<blockquote>\n<p>According to Paragraph 3, the report suggests <strong><strong><strong>.<br>根据第三段，这份报告建议<\/strong><\/strong><\/strong>。<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道段落细节题。对象是报告，范围限定第3段，要求识别报告实际提出的一项建议。段内并列建议很多，要核对每个动作与它自己的对象，不能把相邻建议拼成新主张。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<p>题干中的<code>suggests<\/code>可对应<code>supports<\/code>、<code>stresses<\/code>、<code>encourages<\/code>、<code>calls for<\/code>和<code>advocates<\/code>。这些动词各自连接不同建议：全面识字、历史政府研究、新技术使用、课程和师资投入、外语与国际学习。某个名词确实出现，不代表选项给它配的限定和动作也成立。<\/p>\n"},{"title":"A. an exclusive study of American history","raw":"### A. an exclusive study of American history\n\n> 只研究美国历史\n\n**做题模式中的状态：** 当时A没有遮挡，原文中`literacy`显示为`[xxx]`，但`particularly American history`以及历史、政府、数字技术的并列建议可读。做题时区分了“尤其强调”与“只研究”，第一轮排除A，后续未变。\n\n**错误类型：第一类——歪曲原意。**\n\nA直接借用报告对美国历史的强调，却把`particularly`改成`exclusive`。原文是在较广的历史与政府研究中突出美国内容，选项却变成只研究美国历史，排除了其他内容。\n\n**出处：**\n\n> Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.\n>\n> The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 A选项","focus":[85,1241,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":38,"option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q38-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>只研究美国历史<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，原文中<code>literacy<\/code>显示为<code>[xxx]<\/code>，但<code>particularly American history<\/code>以及历史、政府、数字技术的并列建议可读。做题时区分了“尤其强调”与“只研究”，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A直接借用报告对美国历史的强调，却把<code>particularly<\/code>改成<code>exclusive<\/code>。原文是在较广的历史与政府研究中突出美国内容，选项却变成只研究美国历史，排除了其他内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. an exclusive study of American history","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第三段，AAAS报告建议只研究美国历史。\n\n`American history`把选项带回`stresses the study of history and government`这一建议，限定词`particularly`要与A的`exclusive`逐一比较。\n\n原文先给出历史与政府这两个研究对象，再说尤其是美国历史和美国政府；同句还鼓励新数字技术，后句又建议加强外语和国际事务学习。美国历史是重点之一，并非唯一范围。\n\n`particularly`是在已有范围里加重某一部分，`exclusive`则会把其他部分排除。二者不能因为都突出美国历史而视为同义。\n\nA把优先强调改成排他限制，收窄了原文允许并鼓励的学习内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 A选项","focus":[85,1241,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q38-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>只研究美国历史<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，原文中<code>literacy<\/code>显示为<code>[xxx]<\/code>，但<code>particularly American history<\/code>以及历史、政府、数字技术的并列建议可读。做题时区分了“尤其强调”与“只研究”，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A直接借用报告对美国历史的强调，却把<code>particularly<\/code>改成<code>exclusive<\/code>。原文是在较广的历史与政府研究中突出美国内容，选项却变成只研究美国历史，排除了其他内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议只研究美国历史。<\/p>\n<\/blockquote>\n<p><code>American history<\/code>把选项带回<code>stresses the study of history and government<\/code>这一建议，限定词<code>particularly<\/code>要与A的<code>exclusive<\/code>逐一比较。<\/p>\n<p>原文先给出历史与政府这两个研究对象，再说尤其是美国历史和美国政府；同句还鼓励新数字技术，后句又建议加强外语和国际事务学习。美国历史是重点之一，并非唯一范围。<\/p>\n<p><code>particularly<\/code>是在已有范围里加重某一部分，<code>exclusive<\/code>则会把其他部分排除。二者不能因为都突出美国历史而视为同义。<\/p>\n<p>A把优先强调改成排他限制，收窄了原文允许并鼓励的学习内容。<\/p>\n<\/section>"},{"title":"A. an exclusive study of American history","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.\n>\n> The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.\n>\n> 报告强调美国历史与政府，同时保留技术、外语、国际事务和海外学习等并列建议。\n\n实际段落一路增加学习和支持的项目，没有在强调美国历史后排除其他领域。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The report recommends studying American history to the exclusion of other historical and international subjects.\n>\n> 报告建议只研究美国历史，排除其他历史与国际领域的内容。\n\nA成立要出现这种排他关系。实际后文继续倡导外语和国际事务学习，范围持续展开，与“只研究美国历史”的限制不能对上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 A选项","focus":[85,1241,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q38-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>只研究美国历史<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，原文中<code>literacy<\/code>显示为<code>[xxx]<\/code>，但<code>particularly American history<\/code>以及历史、政府、数字技术的并列建议可读。做题时区分了“尤其强调”与“只研究”，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A直接借用报告对美国历史的强调，却把<code>particularly<\/code>改成<code>exclusive<\/code>。原文是在较广的历史与政府研究中突出美国内容，选项却变成只研究美国历史，排除了其他内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议只研究美国历史。<\/p>\n<\/blockquote>\n<p><code>American history<\/code>把选项带回<code>stresses the study of history and government<\/code>这一建议，限定词<code>particularly<\/code>要与A的<code>exclusive<\/code>逐一比较。<\/p>\n<p>原文先给出历史与政府这两个研究对象，再说尤其是美国历史和美国政府；同句还鼓励新数字技术，后句又建议加强外语和国际事务学习。美国历史是重点之一，并非唯一范围。<\/p>\n<p><code>particularly<\/code>是在已有范围里加重某一部分，<code>exclusive<\/code>则会把其他部分排除。二者不能因为都突出美国历史而视为同义。<\/p>\n<p>A把优先强调改成排他限制，收窄了原文允许并鼓励的学习内容。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<p>报告强调美国历史与政府，同时保留技术、外语、国际事务和海外学习等并列建议。<\/p>\n<\/blockquote>\n<p>实际段落一路增加学习和支持的项目，没有在强调美国历史后排除其他领域。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report recommends studying American history to the exclusion of other historical and international subjects.<\/p>\n<p>报告建议只研究美国历史，排除其他历史与国际领域的内容。<\/p>\n<\/blockquote>\n<p>A成立要出现这种排他关系。实际后文继续倡导外语和国际事务学习，范围持续展开，与“只研究美国历史”的限制不能对上。<\/p>\n<\/section>"},{"title":"A. an exclusive study of American history","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入38题题干：\n\n> 全文主旨不能判断报告第3段是否要求只研究美国历史；它只能提醒我们区分报告列出的目标与报告遗漏的思想开放问题。\n\n但A实际说的是：\n\n> an exclusive study of American history  \n> 只研究美国历史\n\nA的排他限制必须由建议原句支持。这里的`particularly`只表示特别强调，而`greater study of foreign languages, international affairs`仍保留其他领域；不能因全文批评不自由教育，就反过来把报告的全部建议都解释成排他的。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 A选项","focus":[85,1241,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q38-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>只研究美国历史<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，原文中<code>literacy<\/code>显示为<code>[xxx]<\/code>，但<code>particularly American history<\/code>以及历史、政府、数字技术的并列建议可读。做题时区分了“尤其强调”与“只研究”，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A直接借用报告对美国历史的强调，却把<code>particularly<\/code>改成<code>exclusive<\/code>。原文是在较广的历史与政府研究中突出美国内容，选项却变成只研究美国历史，排除了其他内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议只研究美国历史。<\/p>\n<\/blockquote>\n<p><code>American history<\/code>把选项带回<code>stresses the study of history and government<\/code>这一建议，限定词<code>particularly<\/code>要与A的<code>exclusive<\/code>逐一比较。<\/p>\n<p>原文先给出历史与政府这两个研究对象，再说尤其是美国历史和美国政府；同句还鼓励新数字技术，后句又建议加强外语和国际事务学习。美国历史是重点之一，并非唯一范围。<\/p>\n<p><code>particularly<\/code>是在已有范围里加重某一部分，<code>exclusive<\/code>则会把其他部分排除。二者不能因为都突出美国历史而视为同义。<\/p>\n<p>A把优先强调改成排他限制，收窄了原文允许并鼓励的学习内容。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<p>报告强调美国历史与政府，同时保留技术、外语、国际事务和海外学习等并列建议。<\/p>\n<\/blockquote>\n<p>实际段落一路增加学习和支持的项目，没有在强调美国历史后排除其他领域。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report recommends studying American history to the exclusion of other historical and international subjects.<\/p>\n<p>报告建议只研究美国历史，排除其他历史与国际领域的内容。<\/p>\n<\/blockquote>\n<p>A成立要出现这种排他关系。实际后文继续倡导外语和国际事务学习，范围持续展开，与“只研究美国历史”的限制不能对上。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能判断报告第3段是否要求只研究美国历史；它只能提醒我们区分报告列出的目标与报告遗漏的思想开放问题。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>an exclusive study of American history<br>只研究美国历史<\/p>\n<\/blockquote>\n<p>A的排他限制必须由建议原句支持。这里的<code>particularly<\/code>只表示特别强调，而<code>greater study of foreign languages, international affairs<\/code>仍保留其他领域；不能因全文批评不自由教育，就反过来把报告的全部建议都解释成排他的。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. a greater emphasis on theoretical subjects","raw":"### B. a greater emphasis on theoretical subjects\n\n> 更加重视理论学科\n\n**做题模式中的状态：** 当时B中的`greater`显示为`[xxx]`，`emphasis on theoretical subjects`可读；原文关于全面识字和课程设计的部分词语也被遮挡，但新数字技术、解决问题及沟通能力可读。做题时认为这些建议不能被概括成以理论学科为重点，第一轮排除B，后续未变。\n\n**错误类型：第三类——无中生有。**\n\nB借用了报告重视人文社科、历史研究等信息，又补出“更加重视理论学科”这一比较性主张。原文列出了知识、技术、课程和实际能力方面的建议，并未把它们划成理论与实践两类，也没有说要提高理论学科的相对地位。\n\n**命题人借用的原文材料：**\n\n> Because representative government presupposes an informed citizen  its educational proposals.<\/p>\n<p>报告把应用新数字技术列为教育建议的一部分。<\/p>\n<\/blockquote>\n<p>C所需要的写法就是原文的<code>encourages the use of new digital technologies<\/code>。后面增加其他措施不会改变这一项建议的动作和对象。<\/p>\n<\/section>"},{"title":"C. the application of emerging technologies","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入38题题干：\n\n> 全文主旨不能单独推出报告建议应用新兴技术；要回答第3段的一项具体建议，仍需核对该段列举。\n\nC实际说的是：\n\n> the application of emerging technologies  \n> 应用新兴技术\n\nC由`encourages the use of new digital technologies`支持。主旨批评的是报告没有面对教育中的不自由，并不是说报告所有建议都不可取，因此这项技术建议与全文的让步后批评结构可以同时成立。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 C选项","focus":[85,1405,897,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q38-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>应用新兴技术<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>use of new digital technologies<\/code>也可读。做题时已将<code>application<\/code>与<code>use<\/code>、<code>emerging<\/code>与<code>new<\/code>对应起来，第一轮保留C，其他三项排除后确定C，后续未变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>原文鼓励使用新的数字技术，C把<code>use<\/code>换成<code>application<\/code>，并用新兴技术概括这里的新数字技术。报告的动作仍是鼓励应用，对象仍是新技术，没有变成单纯研究技术或已经完成技术应用。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q38-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议应用新兴技术。<\/p>\n<\/blockquote>\n<p><code>technologies<\/code>对应报告并列建议中的<code>new digital technologies<\/code>。动词<code>encourages<\/code>表明这是建议，后面的<code>use<\/code>说明所建议的具体动作。<\/p>\n<p>原句明确说报告鼓励使用新数字技术。选项的<code>application<\/code>表示应用，保留<code>use<\/code>的动作；<code>emerging technologies<\/code>在这里概括新出现的数字技术。<\/p>\n<p>这种概括省略了数字技术的具体类别，但没有额外限定“所有新兴技术都要使用”，也没有把建议说成应用已经完成。题干问报告建议什么，一项明确建议即可回答。<\/p>\n<p>C保留了报告的建议性质、应用动作和新技术对象，能够准确接回题干。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>报告把新数字技术使用列入建议，随后继续提出研究投入与提升学生能力的课程措施。<\/p>\n<\/blockquote>\n<p>实际文章在介绍报告的可取目标，这些具体措施允许技术应用与课程能力建设并列；作者之后批评报告的核心遗漏，并不抹掉这项建议确实存在的事实。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report recommends applying new digital technologies as part of its educational proposals.<\/p>\n<p>报告把应用新数字技术列为教育建议的一部分。<\/p>\n<\/blockquote>\n<p>C所需要的写法就是原文的<code>encourages the use of new digital technologies<\/code>。后面增加其他措施不会改变这一项建议的动作和对象。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能单独推出报告建议应用新兴技术；要回答第3段的一项具体建议，仍需核对该段列举。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>the application of emerging technologies<br>应用新兴技术<\/p>\n<\/blockquote>\n<p>C由<code>encourages the use of new digital technologies<\/code>支持。主旨批评的是报告没有面对教育中的不自由，并不是说报告所有建议都不可取，因此这项技术建议与全文的让步后批评结构可以同时成立。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<\/section>"},{"title":"D. funding for the study of foreign languages","raw":"### D. funding for the study of foreign languages\n\n> 为外语学习提供资金\n\n**做题模式中的状态：** 当时D中的`study`显示为`[xxx]`，但`funding`和`foreign languages`可读；原文的`increased funding for teachers`与`greater study of foreign languages`也可读。做题时已分清教师经费与外语学习是两项建议，第一轮排除D，后续未变。\n\n**错误类型：第三类——无中生有。**\n\nD把报告中的教师经费和外语学习拼接起来，形成外语学习经费这一新关系。两个词组都来自第3段，但原文没有说增加的经费是为外语学习而设。\n\n**命题人借用的原文材料：**\n\n> To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.\n>\n> The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 D选项","focus":[85,1488,935,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":38,"option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q38-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>为外语学习提供资金<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D中的<code>study<\/code>显示为<code>[xxx]<\/code>，但<code>funding<\/code>和<code>foreign languages<\/code>可读；原文的<code>increased funding for teachers<\/code>与<code>greater study of foreign languages<\/code>也可读。做题时已分清教师经费与外语学习是两项建议，第一轮排除D，后续未变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D把报告中的教师经费和外语学习拼接起来，形成外语学习经费这一新关系。两个词组都来自第3段，但原文没有说增加的经费是为外语学习而设。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. funding for the study of foreign languages","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第三段，AAAS报告建议为外语学习提供资金。\n\n定位时需要同时找到`funding`与`foreign languages`，再看两者是否属于同一建议。原文前一处是`funding for teachers`，后一处是`greater study of foreign languages`。\n\n经费的对象由`for teachers`明示为教师；另起一句的`also advocates`再提出加强外语和国际事务学习等建议。前句资金关系没有延伸到后句所有项目。\n\n外语学习在现实中当然可能需要资金，但选项问的是报告有没有提出这项资助。仅凭资助教师和鼓励外语学习同时出现，无法补出经费专门投向外语学习的关系。\n\nD把不同建议中的动作与对象重新配对，写出原文没有提出的资金用途。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 D选项","focus":[85,1488,935,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q38-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>为外语学习提供资金<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D中的<code>study<\/code>显示为<code>[xxx]<\/code>，但<code>funding<\/code>和<code>foreign languages<\/code>可读；原文的<code>increased funding for teachers<\/code>与<code>greater study of foreign languages<\/code>也可读。做题时已分清教师经费与外语学习是两项建议，第一轮排除D，后续未变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D把报告中的教师经费和外语学习拼接起来，形成外语学习经费这一新关系。两个词组都来自第3段，但原文没有说增加的经费是为外语学习而设。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议为外语学习提供资金。<\/p>\n<\/blockquote>\n<p>定位时需要同时找到<code>funding<\/code>与<code>foreign languages<\/code>，再看两者是否属于同一建议。原文前一处是<code>funding for teachers<\/code>，后一处是<code>greater study of foreign languages<\/code>。<\/p>\n<p>经费的对象由<code>for teachers<\/code>明示为教师；另起一句的<code>also advocates<\/code>再提出加强外语和国际事务学习等建议。前句资金关系没有延伸到后句所有项目。<\/p>\n<p>外语学习在现实中当然可能需要资金，但选项问的是报告有没有提出这项资助。仅凭资助教师和鼓励外语学习同时出现，无法补出经费专门投向外语学习的关系。<\/p>\n<p>D把不同建议中的动作与对象重新配对，写出原文没有提出的资金用途。<\/p>\n<\/section>"},{"title":"D. funding for the study of foreign languages","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.\n>\n> The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.\n>\n> 报告先说增加教师经费，随后另说加强外语、国际事务学习与海外项目。\n\n两个句子各自给出不同建议；第二句的`also`表示新增建议，并不是补充前句经费的用途。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The report also advocates increased funding for the study of foreign languages.\n>\n> 报告还主张增加用于外语学习的资金。\n\nD成立需要把资金与外语学习明确连在一起。实际这一句只有加强学习的建议，资金对象仍留在前句的教师，关系不能跨句自行补齐。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 D选项","focus":[85,1488,935,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q38-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>为外语学习提供资金<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D中的<code>study<\/code>显示为<code>[xxx]<\/code>，但<code>funding<\/code>和<code>foreign languages<\/code>可读；原文的<code>increased funding for teachers<\/code>与<code>greater study of foreign languages<\/code>也可读。做题时已分清教师经费与外语学习是两项建议，第一轮排除D，后续未变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D把报告中的教师经费和外语学习拼接起来，形成外语学习经费这一新关系。两个词组都来自第3段，但原文没有说增加的经费是为外语学习而设。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议为外语学习提供资金。<\/p>\n<\/blockquote>\n<p>定位时需要同时找到<code>funding<\/code>与<code>foreign languages<\/code>，再看两者是否属于同一建议。原文前一处是<code>funding for teachers<\/code>，后一处是<code>greater study of foreign languages<\/code>。<\/p>\n<p>经费的对象由<code>for teachers<\/code>明示为教师；另起一句的<code>also advocates<\/code>再提出加强外语和国际事务学习等建议。前句资金关系没有延伸到后句所有项目。<\/p>\n<p>外语学习在现实中当然可能需要资金，但选项问的是报告有没有提出这项资助。仅凭资助教师和鼓励外语学习同时出现，无法补出经费专门投向外语学习的关系。<\/p>\n<p>D把不同建议中的动作与对象重新配对，写出原文没有提出的资金用途。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<p>报告先说增加教师经费，随后另说加强外语、国际事务学习与海外项目。<\/p>\n<\/blockquote>\n<p>两个句子各自给出不同建议；第二句的<code>also<\/code>表示新增建议，并不是补充前句经费的用途。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report also advocates increased funding for the study of foreign languages.<\/p>\n<p>报告还主张增加用于外语学习的资金。<\/p>\n<\/blockquote>\n<p>D成立需要把资金与外语学习明确连在一起。实际这一句只有加强学习的建议，资金对象仍留在前句的教师，关系不能跨句自行补齐。<\/p>\n<\/section>"},{"title":"D. funding for the study of foreign languages","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入38题题干：\n\n> 全文主旨不能判断报告某项资金具体给了谁，也不能把支持外语学习自动解释成资助外语学习。\n\n但D实际说的是：\n\n> funding for the study of foreign languages  \n> 为外语学习提供资金\n\nD所需的是资金用途这一局部关系，标题不提供这个信息。本项最终仍要根据`increased funding for teachers`及`greater study of foreign languages`判断：一个给经费对象，一个给学习内容，原文未将二者相连。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题 D选项","focus":[85,1488,935,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":38,"option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q38-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>为外语学习提供资金<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D中的<code>study<\/code>显示为<code>[xxx]<\/code>，但<code>funding<\/code>和<code>foreign languages<\/code>可读；原文的<code>increased funding for teachers<\/code>与<code>greater study of foreign languages<\/code>也可读。做题时已分清教师经费与外语学习是两项建议，第一轮排除D，后续未变。 code>also<\/code>表示新增建议，并不是补充前句经费的用途。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report also advocates increased funding for the study of foreign languages.<\/p>\n<p>报告还主张增加用于外语学习的资金。<\/p>\n<\/blockquote>\n<p>D成立需要把资金与外语学习明确连在一起。实际这一句只有加强学习的建议，资金对象仍留在前句的教师，关系不能跨句自行补齐。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q38-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能判断报告某项资金具体给了谁，也不能把支持外语学习自动解释成资助外语学习。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>funding for the study of foreign languages<br>为外语学习提供资金<\/p>\n<\/blockquote>\n<p>D所需的是资金用途这一局部关系，标题不提供这个信息。本项最终仍要根据<code>increased funding for teachers<\/code>及<code>greater study of foreign languages<\/code>判断：一个给经费对象，一个给学习内容，原文未将二者相连。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. C. the application of emerging technologies**\n\nA把“尤其强调美国历史”改成了“只研究美国历史”。\n\nB从学科名称和重视学习补出了提高理论学科权重的主张。\n\nC准确改写了报告鼓励使用新数字技术的建议。\n\nD把教师经费与外语学习两项建议拼成了外语学习资助。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[6,1155,1210,398],"sourceW":1686,"sourceH":2543},"meta":{"kind":"conclusion","question":38},"level":3,"html":"<blockquote>\n<p><strong>38. C. the application of emerging technologies<\/strong><\/p>\n<\/blockquote>\n<p>A把“尤其强调美国历史”改成了“只研究美国历史”。<\/p>\n<p>B从学科名称和重视学习补出了提高理论学科权重的主张。<\/p>\n<p>C准确改写了报告鼓励使用新数字技术的建议。<\/p>\n<p>D把教师经费与外语学习两项建议拼成了外语学习资助。<\/p>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> The author implies in Paragraph 5 that professors are ______.  \n> 作者在第五段暗示，教授们______。\n\n### 题型\n\n这是一道局部推断题。题干限定第5段，对象是作者所批评的教授，要求从他们如何划分研究对象推断其思想倾向。明示事实是一边被看作正当研究，另一边却被排除；推断不能超出这种不对等的学术标准。\n\n### 核心出处\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n\n`treat ... as the proper subject of study`写教授怎样对待进步主义；`while portraying ... as falling outside`写他们怎样对待保守主义和古典自由主义。两边对象不同，评价标准也不同。作者据此批评学术排斥，而不是讨论所有研究都要谨慎，或直接给教授的每项政策立场定性。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[6,1648,1352,398],"sourceW":1686,"sourceH":2543},"meta":{"kind":"question","question":39},"level":2,"html":"<blockquote>\n<p>The author implies in Paragraph 5 that professors are <strong><strong><strong>.<br>作者在第五段暗示，教授们<\/strong><\/strong><\/strong>。<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部推断题。题干限定第5段，对象是作者所批评的教授，要求从他们如何划分研究对象推断其思想倾向。明示事实是一边被看作正当研究，另一边却被排除；推断不能超出这种不对等的学术标准。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<p><code>treat ... as the proper subject of study<\/code>写教授怎样对待进步主义；<code>while portraying ... as falling outside<\/code>写他们怎样对待保守主义和古典自由主义。两边对象不同，评价标准也不同。作者据此批评学术排斥，而不是讨论所有研究都要谨慎，或直接给教授的每项政策立场定性。<\/p>\n"},{"title":"A. supportive of free markets","raw":"### A. supportive of free markets\n\n> 支持自由市场\n\n**做题模式中的状态：** 当时A中的`free`显示为`[xxx]`，原文中的`routinely`和`portraying`也被遮挡，但`markets`、`classical liberal ideas`与`outside the boundaries`可读。做题时据此认为教授把这一类思想排除在研究范围外，不能概括为支持，所以第一轮排除A，后续未变。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用了原文的自由市场，却把教授对它所属思想类别的排斥改成支持。自由市场是保守主义或古典自由主义思想的例子；作者说教授将这类思想放在常规、有时甚至正当研究的边界之外。\n\n**出处：**\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative ely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n>\n> 前文说思想宣传取代开放探究，第5段接着展示进步主义被认可而古典自由主义被排斥。\n\n自由市场这个例子用来说明后者怎样被排除，不是用来展示教授支持何种市场制度。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Professors welcome free-market ideas and speak in support of them.\n>\n> 教授欢迎自由市场思想，并表达对它们的支持。\n\nA成立至少需要这种正面支持的描述。实际文章把自由市场列在被视为研究边界之外的思想中，承担的是说明排斥的作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 A选项","focus":[85,1735,609,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q39-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>支持自由市场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A中的<code>free<\/code>显示为<code>[xxx]<\/code>，原文中的<code>routinely<\/code>和<code>portraying<\/code>也被遮挡，但<code>markets<\/code>、<code>classical liberal ideas<\/code>与<code>outside the boundaries<\/code>可读。做题时据此认为教授把这一类思想排除在研究范围外，不能概括为支持，所以第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的自由市场，却把教授对它所属思想类别的排斥改成支持。自由市场是保守主义或古典自由主义思想的例子；作者说教授将这类思想放在常规、有时甚至正当研究的边界之外。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们支持自由市场。<\/p>\n<\/blockquo terpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>前文说思想宣传取代开放探究，第5段接着展示进步主义被认可而古典自由主义被排斥。<\/p>\n<\/blockquote>\n<p>自由市场这个例子用来说明后者怎样被排除，不是用来展示教授支持何种市场制度。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors welcome free-market ideas and speak in support of them.<\/p>\n<p>教授欢迎自由市场思想，并表达对它们的支持。<\/p>\n<\/blockquote>\n<p>A成立至少需要这种正面支持的描述。实际文章把自由市场列在被视为研究边界之外的思想中，承担的是说明排斥的作用。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>在教育不自由的主线下，本段应指出教授怎样限制思想探究；是否支持自由市场，还要看自由市场在第5段被放在哪一边。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>supportive of free markets<br>支持自由市场<\/p>\n<\/blockquote>\n<p>A说支持自由市场，但它在局部原文中是被排除的古典自由主义思想的例子。主旨要求解释思想封闭，而这项正面支持既不是本段给出的方向，也无法代替对双重标准的批评。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. biased against classical liberal ideas","raw":"### B. biased against classical liberal ideas\n\n> 对古典自由主义思想有偏见\n\n**做题模式中的状态：** 当时B完整可读。虽然原文的`routinely`和`portraying`显示为`[xxx]`，但一边是`proper subject of study`、另一边在研究`boundaries`之外的对照可读。做题时用这种不对等标准概括`biased against`，第一轮保留B并确定答案，后续未变。\n\n**选项类型：正确局部推断。**\n\nB没有照抄原文，而是将两类思想受到不同待遇这一事实概括为偏见。教授承认进步主义是正当研究对象，却排除古典自由主义；偏见体现在对研究对象的选择性认可与排斥上。\n\n**出处：**\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"q lling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n>\n> The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.\n>\n> 文章先批评宣传取代探究，再写教授对两类思想的不对等处理，最后指出报告掩盖了这种挑战。\n\n第5段是第4段“不自由”的具体表现；结尾的报告批评也以这种真实教育问题未被正视为依据。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Professors accept progressive ideas as legitimate subjects but unfairly exclude classical liberal ideas from intellectual inquiry.\n>\n> 教授认可进步主义思想为正当研究对象，却不公正地把古典自由主义思想排除在学术探究之外。\n\nB所需要的就是这种选择性排斥。它对应原文`proper subject`与`outside the boundaries`的对照，也能承接前文对思想宣传的批评。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 B选项","focus":[85,1817,803,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q39-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>对古典自由主义思想有偏见<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整可读。虽然原文的<code>routinely<\/code>和<code>portraying<\/code>显示为<code>[xxx]<\/code>，但一边是<code>proper subject of study<\/code>、另一边在研究<code>boundaries<\/code>之外的对照可读。做题时用这种不对等标准概括<code>biased against<\/code>，第一轮保留B并确定答案，后续未变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>B没有照抄原文，而是将两类思想受到不同待遇这一事实概括为偏见。教授承认进步主义是正当研究对象，却排除古典自由主义；偏见体现在对研究对象的选择性认可与排斥上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，
