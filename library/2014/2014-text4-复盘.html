译","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- “不知道……内容和特征”整理成“不了解……内容和特征”，搭配更自然。\n- 省去“这样一种情况”，让“忽视了”直接接完整事实。\n- 末尾用“他们”承接毕业生，并明确“自由教育的好处”，避免“它”回指不清。\n\n参考译文：\n\n> 委员会忽视了几十年来美国的学院和大学已经培养出不了解自由教育内容和特征的毕业生，他们因此被剥夺了自由教育的好处。","context":{"focus":[104,2759,850,452],"mode":"image","asset":"articleAnnotated","label":"第4段第2句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-5"},"meta":{"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":true},"focusId":"focus-long-5-5","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文<\/h3>\n<blockquote>\n<p>The commission ignores that for several decades America&#39;s colleges and universities have produced graduates who don&#39;t know the content and character of liberal education and are thus deprived of its benefits.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>The commission ignores / that for several decades / America&#39;s colleges and universities / have produced graduates / who don&#39;t know / the content and character / of liberal education / and are thus deprived / of its benefits.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>委员会忽视了 / 几十年来 / 美国的学院和大学 / 已经培养出毕业生 / 他们不知道 / 内容和特征 / 自由教育的 / 因此被剥夺了 / 它的好处。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-5-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把时间、学校和培养行为接起来：<\/p>\n<blockquote>\n<p>几十年来，美国的学院和大学已经培养出毕业生<\/p>\n<\/blockquote>\n<p>把毕业生缺少的认识合并成一块：<\/p>\n<blockquote>\n<p>不了解自由教育的内容和特征<\/p>\n<\/blockquote>\n<p>后半句是在说这种不了解的结果：<\/p>\n<blockquote>\n<p>他们因此被剥夺了自由教育的好处<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>委员会忽视了这样一种情况<br>几十年来，美国的学院和大学培养出的毕业生不了解自由教育的内容和特征<br>他们因此被剥夺了自由教育的好处<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-5-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>委员会忽视了毕业生不了解自由教育、因而失去其好处的情况。<\/p>\n<\/blockquote>\n<p>先交代委员会忽视了什么，再把几十年来的学校培养情况展开。把不了解的内容放到毕业生旁，最后用“因此”明确它与失去好处之间的联系。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>委员会忽视了这样一种情况：几十年来，美国的学院和大学已经培养出不知道自由教育的内容和特征的毕业生，这些毕业生因此被剥夺了这种教育的好处。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-5-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“不知道……内容和特征”整理成“不了解……内容和特征”，搭配更自然。<\/li>\n<li>省去“这样一种情况”，让“忽视了”直接接完整事实。<\/li>\n<li>末尾用“他们”承接毕业生，并明确“自由教育的好处”，避免“它”回指不清。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>委员会忽视了几十年来美国的学院和大学已经培养出不了解自由教育内容和特征的毕业生，他们因此被剥夺了自由教育的好处。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 原文\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.","context":{"focus":[104,3568,850,331],"mode":"image","asset":"articleAnnotated","label":"第5段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-0","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第一步：划分意群\n\n> Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.","context":{"focus":[104,3568,850,331],"mode":"image","asset":"articleAnnotated","label":"第5段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-1","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第二步：逐个意群直译\n\n> 今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。","context":{"focus":[104,3568,850,331],"mode":"image","asset":"articleAnnotated","label":"第5段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-2","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第三步：按照中文语感合并意群\n\n先把受到认可的两类内容放在一起：\n\n> 教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题\n\n把另一组思想与举例合并：\n\n> 保守或古典自由主义思想，如自由市场和自力更生\n\n最后说这组思想被划到哪里，保留“有时”的程度限制：\n\n> 被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外\n\n先得到：\n\n> 今天，教授们经常将两类进步主义内容作为适当的研究主题  \n> 与此同时，保守或古典自由主义思想，如自由市场和自力更生  \n> 被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外","context":{"focus":[104,3568,850,331],"mode":"image","asset":"articleAnnotated","label":"第5段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-3","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把受到认可的两类内容放在一起：<\/p>\n<blockquote>\n<p>教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题<\/p>\n<\/blockquote>\n<p>把另一组思想与举例合并：<\/p>\n<blockquote>\n<p>保守或古典自由主义思想，如自由市场和自力更生<\/p>\n<\/blockquote>\n<p>最后说这组思想被划到哪里，保留“有时”的程度限制：<\/p>\n<blockquote>\n<p>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>今天，教授们经常将两类进步主义内容作为适当的研究主题<br>与此同时，保守或古典自由主义思想，如自由市场和自力更生<br>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 教授们将一类思想列为适当研究对象，却将另一类思想排除在研究边界之外。\n\n先说哪些思想被接纳，再用“同时”接哪些思想被排斥，形成同一主体的两种处理方式。举例紧贴保守或古典自由主义思想；“有时”只限定进一步被排除在正当研究之外的情况。这里讨论的是学术研究的正当性，须保留这种程度限制。\n\n按照中文语序调整后是：\n\n> 今天，教授们经常把历史的进步主义解释和进步主义公共政策看作适当的研究主题，同时把保守或古典自由主义思想，例如自由市场和自力更生，描绘成处在常规研究的边界之外，有时还进一步被排除在正当的学术研究之外。","context":{"focus":[104,3568,850,331],"mode":"image","asset":"articleAnnotated","label":"第5段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":false},"focusId":"focus-long-6-4","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把受到认可的两类内容放在一起：<\/p>\n<blockquote>\n<p>教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题<\/p>\n<\/blockquote>\n<p>把另一组思想与举例合并：<\/p>\n<blockquote>\n<p>保守或古典自由主义思想，如自由市场和自力更生<\/p>\n<\/blockquote>\n<p>最后说这组思想被划到哪里，保留“有时”的程度限制：<\/p>\n<blockquote>\n<p>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>今天，教授们经常将两类进步主义内容作为适当的研究主题<br>与此同时，保守或古典自由主义思想，如自由市场和自力更生<br>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>教授们将一类思想列为适当研究对象，却将另一类思想排除在研究边界之外。<\/p>\n<\/blockquote>\n<p>先说哪些思想被接纳，再用“同时”接哪些思想被排斥，形成同一主体的两种处理方式。举例紧贴保守或古典自由主义思想；“有时”只限定进一步被排除在正当研究之外的情况。这里讨论的是学术研究的正当性，须保留这种程度限制。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>今天，教授们经常把历史的进步主义解释和进步主义公共政策看作适当的研究主题，同时把保守或古典自由主义思想，例如自由市场和自力更生，描绘成处在常规研究的边界之外，有时还进一步被排除在正当的学术研究之外。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"第5段第1句","level":2,"section":"第二鸟 · 精读与翻译","raw":"### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- 两边统一使用“将……作为”和“将……描绘为”，使对照更整齐。\n- 自由市场和自力更生用破折号作为插入举例，主线读起来更连贯。\n- 保留“有时甚至是”呈现程度递进，不能把作者指出的不同排斥程度压成一个笼统判断。\n\n参考译文：\n\n> 今天，教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题，同时将保守或古典自由主义思想——如自由市场和自力更生——描绘为落在常规的、有时甚至是合法的智力研究边界之外。","context":{"focus":[104,3568,850,331],"mode":"image","asset":"articleAnnotated","label":"第5段第1句","sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center","focusId":"long-6"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":true},"focusId":"focus-long-6-5","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把受到认可的两类内容放在一起：<\/p>\n<blockquote>\n<p>教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题<\/p>\n<\/blockquote>\n<p>把另一组思想与举例合并：<\/p>\n<blockquote>\n<p>保守或古典自由主义思想，如自由市场和自力更生<\/p>\n<\/blockquote>\n<p>最后说这组思想被划到哪里，保留“有时”的程度限制：<\/p>\n<blockquote>\n<p>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>今天，教授们经常将两类进步主义内容作为适当的研究主题<br>与此同时，保守或古典自由主义思想，如自由市场和自力更生<br>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>教授们将一类思想列为适当研究对象，却将另一类思想排除在研究边界之外。<\/p>\n<\/blockquote>\n<p>先说哪些思想被接纳，再用“同时”接哪些思想被排斥，形成同一主体的两种处理方式。举例紧贴保守或古典自由主义思想；“有时”只限定进一步被排除在正当研究之外的情况。这里讨论的是学术研究的正当性，须保留这种程度限制。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>今天，教授们经常把历史的进步主义解释和进步主义公共政策看作适当的研究主题，同时把保守或古典自由主义思想，例如自由市场和自力更生，描绘成处在常规研究的边界之外，有时还进一步被排除在正当的学术研究之外。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>两边统一使用“将……作为”和“将……描绘为”，使对照更整齐。<\/li>\n<li>自由市场和自力更生用破折号作为插入举例，主线读起来更连贯。<\/li>\n<li>保留“有时甚至是”呈现程度递进，不能把作者指出的不同排斥程度压成一个笼统判断。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>今天，教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题，同时将保守或古典自由主义思想——如自由市场和自力更生——描绘为落在常规的、有时甚至是合法的智力研究边界之外。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1686,"sourceH":2543},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n**Which of the following would be the best title for the text?**\n\n以下哪一项最适合作为本文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Illiberal Education and “The Heart of the Matter”**\n\n不自由的教育与《问题的核心》\n\nB. **The AAAS’s Contribution to Liberal Education**\n\nAAAS对博雅教育的贡献\n\nC. **Ways to Grasp “The Heart of the Matter”**\n\n把握《问题的核心》的方法\n\nD. **Progressive Policy vs. Liberal Education**\n\n进步主义政策与博雅教育的对立\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先肯定AAAS报告重视人文社科，随即批评它没有处理博雅教育危机的真实性质，可能弊大于利 | 先承认一部分价值再指出缺口 |\n| 2 | 交代国会要求AAAS提出维持国家领先的行动以及委员会成员构成 | 再说任务来源和参与者 |\n| 3 | 列出报告支持识字、历史政府、数字技术、研究投入、教师经费、外语与海外学习等目标 | 接着列出材料提出的目标 |\n| 4 | 指出报告没有触及顶尖高校博雅教育中“不自由”的核心，毕业生不了解博雅教育，校园探究被宣传取代 | 然后指出它回避了核心问题 |\n| 5 | 说明教授把进步主义视为正当研究，却把保守主义和古典自由主义排除在正常研究边界外 | 再说问题在现实中的表现 |\n| 6 | 总结AAAS虽热情高涨，其报告却可能掩盖挑战并阻碍改革 | 最后下结论：前面缺口会带来后果 |","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[4,2141,1311,398],"sourceW":1686,"sourceH":2543},"meta":{"kind":"question","question":40},"level":2,"html":"<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>以下哪一项最适合作为本文标题？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Illiberal Education and “The Heart of the Matter”<\/strong><\/p>\n<p>不自由的教育与《问题的核心》<\/p>\n<p>B. <strong>The AAAS’s Contribution to Liberal Education<\/strong><\/p>\n<p>AAAS对博雅教育的贡献<\/p>\n<p>C. <strong>Ways to Grasp “The Heart of the Matter”<\/strong><\/p>\n<p>把握《问题的核心》的方法<\/p>\n<p>D. <strong>Progressive Policy vs. Liberal Education<\/strong><\/p>\n<p>进步主义政策与博雅教育的对立<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先肯定AAAS报告重视人文社科，随即批评它没有处理博雅教育危机的真实性质，可能弊大于利<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会要求AAAS提出维持国家领先的行动以及委员会成员构成<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告支持识字、历史政府、数字技术、研究投入、教师经费、外语与海外学习等目标<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告没有触及顶尖高校博雅教育中“不自由”的核心，毕业生不了解博雅教育，校园探究被宣传取代<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>说明教授把进步主义视为正当研究，却把保守主义和古典自由主义排除在正常研究边界外<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>总结AAAS虽热情高涨，其报告却可能掩盖挑战并阻碍改革<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n"},{"title":"A. Illiberal Education and “The Heart of the Matter”","raw":"**Which of the following would be the best title for the text?**\n\n### A. Illiberal Education and “The Heart of the Matter”\n\n不自由的教育与《问题的核心》","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 A选项","focus":[85,2225,1096,53],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":40,"option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q40-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-A-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>不自由的教育与《问题的核心》<\/p>\n<\/section>"},{"title":"A. Illiberal Education and “The Heart of the Matter”","raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n不自由的教育与《问题的核心》\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先肯定《问题的核心》重视人文社科，再指出它没有识别博雅教育中压制开放探究的问题。 | 先承认一部分价值再指出缺口 |\n| 2 | 交代国会委托AAAS研究如何维持人文社科教育的卓越，以及由高校负责人和各界人士组成的委员会为何承担审视教育危机的任务。 | 再说任务来源和参与者 |\n| 3 | 列出这份报告在人文素养、课程、技术、师资和国际学习方面的目标，说明这些目标涵盖资源与能力建设。 | 接着列出材料提出的目标 |\n| 4 | 指出报告回避的核心是博雅教育自身的不自由：课程没有使学生理解博雅教育，思想宣传挤掉了开放探究。 | 然后指出它回避了核心问题 |\n| 5 | 具体展示这种不自由：教授把进步主义列入正当研究，却把保守主义和古典自由主义思想排除在外。 | 再说问题在现实中的表现 |\n| 6 | 得出结论：报告不正视思想封闭，就会掩盖真正的教育危机，使改革偏离需要解决的问题。 | 最后下结论：前面缺口会带来后果 |\n\n实际文章第1段用赞扬作让步，随后批评报告没有处理危机的真实性质；第2、3段交代报告来历和目标，并没有改变批评对象。第4段揭开报告遗漏的内容——博雅教育中的不自由，第5段用教授对不同思想的双重标准把它说具体，第6段又回到报告可能妨碍改革。标题中的两个部分正好对应“真正的问题”和“没有正视问题的报告”，能够把前后连起来。\n\n判断：\n\n**A 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 A选项","focus":[85,2225,1096,53],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":40,"option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q40-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-A-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>不自由的教育与《问题的核心》<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q40-A-1\"><h3>如果 A 是主旨，文章6段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>不自由的教育与《问题的核心》<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先肯定《问题的核心》重视人文社科，再指出它没有识别博雅教育中压制开放探究的问题。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会委托AAAS研究如何维持人文社科教育的卓越，以及由高校负责人和各界人士组成的委员会为何承担审视教育危机的任务。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出这份报告在人文素养、课程、技术、师资和国际学习方面的目标，说明这些目标涵盖资源与能力建设。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避的核心是博雅教育自身的不自由：课程没有使学生理解博雅教育，思想宣传挤掉了开放探究。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>具体展示这种不自由：教授把进步主义列入正当研究，却把保守主义和古典自由主义思想排除在外。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：报告不正视思想封闭，就会掩盖真正的教育危机，使改革偏离需要解决的问题。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>实际文章第1段用赞扬作让步，随后批评报告没有处理危机的真实性质；第2、3段交代报告来历和目标，并没有改变批评对象。第4段揭开报告遗漏的内容——博雅教育中的不自由，第5段用教授对不同思想的双重标准把它说具体，第6段又回到报告可能妨碍改革。标题中的两个部分正好对应“真正的问题”和“没有正视问题的报告”，能够把前后连起来。<\/p>\n<p>判断：<\/p>\n<p><strong>A 保留。<\/strong><\/p>\n<\/section>"},{"title":"B. The AAAS’s Contribution to Liberal Education","raw":"**Which of the following would be the best title for the text?**\n\n### B. The AAAS’s Contribution to Liberal Education\n\nAAAS对博雅教育的贡献","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 B选项","focus":[85,2310,1036,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":40,"option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q40-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-B-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>AAAS对博雅教育的贡献<\/p>\n<\/section>"},{"title":"B. The AAAS’s Contribution to Liberal Education","raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\nAAAS对博雅教育的贡献\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先肯定AAAS扩大公众对博雅教育的关注这一贡献，再指出它尚未把社会关注转化为课堂教学的实际改善。 | 先承认一部分价值再指出缺口 |\n| 2 | 交代国会要求AAAS促进博雅教育发展的委托，以及教育界和公共领域成员如何共同承担把倡议转为教育成效的任务。 | 再说任务来源和参与者 |\n| 3 | 列出报告在课程、教师、技术和国际学习方面的目标，作为衡量AAAS能为博雅教育带来哪些具体贡献的项目清单。 | 接着列出材料提出的目标 |\n| 4 | 指出报告回避了贡献能否落地的核心问题：它没有说明这些倡议如何进入课堂并产生可核查的教学改善。 | 然后指出它回避了核心问题 |\n| 5 | 展示贡献尚未落地的表现：高校虽接受AAAS的倡议，课程实施和教师支持却没有随之改变，学生仍未得到预期帮助。 | 再说问题在现实中的表现 |\n| 6 | 得出结论：从倡议到落实的缺口会限制AAAS的实际贡献；社会影响若被当成教育成效，就会遮住贡献尚未实现的部分。 | 最后下结论：前面缺口会带来后果 |\n\nB把评价中心放在AAAS给博雅教育带来了什么。即便这种评价可以同时谈贡献与不足，也需要围绕贡献的项目、实现方式和实际成效展开。第1、3段确实承认报告有值得肯定的目标，但第4、5段集中展开的是高校中的思想封闭，第6段批评的是报告掩盖这种危机并可能阻碍改革。全文没有评估AAAS各项贡献的落实与效果；仅用“贡献”作标题，会淡化作者反复指出的诊断缺口。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 B选项","focus":[85,2310,1036,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":40,"option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q40-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-B-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>AAAS对博雅教育的贡献<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q40-B-1\"><h3>如果 B 是主旨，文章6段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>AAAS对博雅教育的贡献<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先肯定AAAS扩大公众对博雅教育的关注这一贡献，再指出它尚未把社会关注转化为课堂教学的实际改善。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会要求AAAS促进博雅教育发展的委托，以及教育界和公共领域成员如何共同承担把倡议转为教育成效的任务。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告在课程、教师、技术和国际学习方面的目标，作为衡量AAAS能为博雅教育带来哪些具体贡献的项目清单。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避了贡献能否落地的核心问题：它没有说明这些倡议如何进入课堂并产生可核查的教学改善。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>展示贡献尚未落地的表现：高校虽接受AAAS的倡议，课程实施和教师支持却没有随之改变，学生仍未得到预期帮助。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：从倡议到落实的缺口会限制AAAS的实际贡献；社会影响若被当成教育成效，就会遮住贡献尚未实现的部分。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>B把评价中心放在AAAS给博雅教育带来了什么。即便这种评价可以同时谈贡献与不足，也需要围绕贡献的项目、实现方式和实际成效展开。第1、3段确实承认报告有值得肯定的目标，但第4、5段集中展开的是高校中的思想封闭，第6段批评的是报告掩盖这种危机并可能阻碍改革。全文没有评估AAAS各项贡献的落实与效果；仅用“贡献”作标题，会淡化作者反复指出的诊断缺口。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<\/section>"},{"title":"C. Ways to Grasp “The Heart of the Matter”","raw":"**Which of the following would be the best title for the text?**\n\n### C. Ways to Grasp “The Heart of the Matter”\n\n把握《问题的核心》的方法","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 C选项","focus":[85,2390,934,63],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":40,"option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q40-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-C-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>把握《问题的核心》的方法<\/p>\n<\/section>"},{"title":"C. Ways to Grasp “The Heart of the Matter”","raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n把握《问题的核心》的方法\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先承认通读《问题的核心》能掌握报告建议，再指出只看建议清单仍不足以理解它怎样判断教育危机。 | 先承认一部分价值再指出缺口 |\n| 2 | 交代国会给AAAS的任务及委员会成员背景，说明理解报告时要先查清谁提出问题、谁负责作答。 | 再说任务来源和参与者 |\n| 3 | 列出报告的各项目标，并把辨认“目的、措施、预期效果”作为理解这些目标之间关系的方法。 | 接着列出材料提出的目标 |\n| 4 | 指出报告回避了检验其建议能否解决核心危机的问题，因此理解报告还要拿它的判断与校园实际情况核对。 | 然后指出它回避了核心问题 |\n| 5 | 以课堂中的思想排斥展示这种核对法：逐项比较报告怎样描述教育与教授实际怎样组织研究，找出被省略的问题。 | 再说问题在现实中的表现 |\n| 6 | 得出结论：缺少来源核查、目标梳理和现实比照，会把报告的愿望误读成完整诊断，进而误判改革所需的行动。 | 最后下结论：前面缺口会带来后果 |\n\nC要求文章教读者怎样理解报告，因此假想文章要把查来源、理目标、对照实际等做法串成可操作的方法。实际第2段的国会任务是介绍被评论报告的背景，第3段列目标是为承认其可取之处，第4至6段是在指出遗漏并追究后果。作者在评价报告，没有把这些材料组织成读者应当遵循的理解步骤；“heart of the matter”的文字呼应也不能把评论文章变成方法指南。\n\n判断：\n\n**C 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 C选项","focus":[85,2390,934,63],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":40,"option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q40-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-C-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>把握《问题的核心》的方法<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q40-C-1\"><h3>如果 C 是主旨，文章6段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>把握《问题的核心》的方法<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先承认通读《问题的核心》能掌握报告建议，再指出只看建议清单仍不足以理解它怎样判断教育危机。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会给AAAS的任务及委员会成员背景，说明理解报告时要先查清谁提出问题、谁负责作答。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告的各项目标，并把辨认“目的、措施、预期效果”作为理解这些目标之间关系的方法。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避了检验其建议能否解决核心危机的问题，因此理解报告还要拿它的判断与校园实际情况核对。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>以课堂中的思想排斥展示这种核对法：逐项比较报告怎样描述教育与教授实际怎样组织研究，找出被省略的问题。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：缺少来源核查、目标梳理和现实比照，会把报告的愿望误读成完整诊断，进而误判改革所需的行动。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>C要求文章教读者怎样理解报告，因此假想文章要把查来源、理目标、对照实际等做法串成可操作的方法。实际第2段的国会任务是介绍被评论报告的背景，第3段列目标是为承认其可取之处，第4至6段是在指出遗漏并追究后果。作者在评价报告，没有把这些材料组织成读者应当遵循的理解步骤；“heart of the matter”的文字呼应也不能把评论文章变成方法指南。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<\/section>"},{"title":"D. Progressive Policy vs. Liberal Education","raw":"**Which of the following would be the best title for the text?**\n\n### D. Progressive Policy vs. Liberal Education\n\n进步主义政策与博雅教育的对立","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 D选项","focus":[85,2474,910,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":40,"option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q40-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-D-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>进步主义政策与博雅教育的对立<\/p>\n<\/section>"},{"title":"D. Progressive Policy vs. Liberal Education","raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n进步主义政策与博雅教育的对立\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先承认进步主义政策推动公民教育的部分价值，再指出用特定政治目标支配课程会压缩博雅教育所需的开放空间。 | 先承认一部分价值再指出缺口 |\n| 2 | 交代国会委托AAAS研究公共政策目标与博雅教育之间的关系，以及政策界和高校成员共同审视两者冲突的任务。 | 再说任务来源和参与者 |\n| 3 | 列出报告中以公民参与、社会改革和公共政策能力为导向的教育目标，说明政策要求怎样进入课程安排。 | 接着列出材料提出的目标 |\n| 4 | 指出报告回避的核心是政策取向与自由探究的边界：把进步主义政策目标作为课程标准，会挤压不服务于该目标的思想。 | 然后指出它回避了核心问题 |\n| 5 | 展示两者冲突的现实表现：教授只把有利于进步主义政策的思想列入正当研究，而把质疑这些政策的思想排除。 | 再说问题在现实中的表现 |\n| 6 | 得出结论：政策目标与学术探究之间的边界未得到处理，进步主义政策对课堂的支配便会继续损害博雅教育。 | 最后下结论：前面缺口会带来后果 |\n\n第5段的进步主义公共政策与这个标题有关，但作者指责的是教授把一种思想当成正当研究、把其他思想排除在外，并没有比较进步主义政策本身的内容与博雅教育的原则。第1至3段始终围绕AAAS报告，第4段指出它忽视了思想封闭，第6段仍追究报告遮蔽危机的后果。D把用来说明不自由教育的一种表现扩大成全文对立面，也漏掉了贯穿首尾的报告批评。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题 D选项","focus":[85,2474,910,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":40,"option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q40-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-D-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>进步主义政策与博雅教育的对立<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q40-D-1\"><h3>如果 D 是主旨，文章6段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>进步主义政策与博雅教育的对立<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先承认进步主义政策推动公民教育的部分价值，再指出用特定政治目标支配课程会压缩博雅教育所需的开放空间。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会委托AAAS研究公共政策目标与博雅教育之间的关系，以及政策界和高校成员共同审视两者冲突的任务。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告中以公民参与、社会改革和公共政策能力为导向的教育目标，说明政策要求怎样进入课程安排。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避的核心是政策取向与自由探究的边界：把进步主义政策目标作为课程标准，会挤压不服务于该目标的思想。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>展示两者冲突的现实表现：教授只把有利于进步主义政策的思想列入正当研究，而把质疑这些政策的思想排除。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：政策目标与学术探究之间的边界未得到处理，进步主义政策对课堂的支配便会继续损害博雅教育。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>第5段的进步主义公共政策与这个标题有关，但作者指责的是教授把一种思想当成正当研究、把其他思想排除在外，并没有比较进步主义政策本身的内容与博雅教育的原则。第1至3段始终围绕AAAS报告，第4段指出它忽视了思想封闭，第6段仍追究报告遮蔽危机的后果。D把用来说明不自由教育的一种表现扩大成全文对立面，也漏掉了贯穿首尾的报告批评。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<\/section>"},{"title":"40题结论","raw":"### 40题结论\n\n**40. A. Illiberal Education and “The Heart of the Matter”**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Illiberal Education and “The Heart of the Matter” / 不自由的教育与《问题的核心》**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[4,2141,1311,398],"sourceW":1686,"sourceH":2543},"meta":{"kind":"conclusion","question":40},"level":3,"html":"<p><strong>40. A. Illiberal Education and “The Heart of the Matter”<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Illiberal Education and “The Heart of the Matter” / 不自由的教育与《问题的核心》<\/strong><\/p>\n"},{"title":"36题 · 题干、题型与核心出处","raw":"## 36题\n\n> According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?  \n> 根据第一段，作者对AAAS报告持什么态度？\n\n### 题型\n\n这是一道作者态度题。范围是第1段，对象是AAAS的整份报告。要把首句有限度的赞扬与第二句对核心缺陷的评价接起来，判断作者评价报告的主导方向。\n\n### 核心出处\n\n> \"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.\n>\n> Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.\n\n第一句的`deserves praise for`说明作者为何赞扬：报告肯定了人文社科的重要性。第二句由`Regrettably, however`转折，指出报告未处理真正的危机，并用`may cause more harm than good`评价可能的后果。题干问整份报告的态度，不能只截取其中一个赞扬词。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[6,4,1676,470],"sourceW":1686,"sourceH":2543},"meta":{"kind":"question","question":36},"level":2,"html":"<blockquote>\n<p>According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?<br>根据第一段，作者对AAAS报告持什么态度？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道作者态度题。范围是第1段，对象是AAAS的整份报告。要把首句有限度的赞扬与第二句对核心缺陷的评价接起来，判断作者评价报告的主导方向。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<p>第一句的<code>deserves praise for<\/code>说明作者为何赞扬：报告肯定了人文社科的重要性。第二句由<code>Regrettably, however<\/code>转折，指出报告未处理真正的危机，并用<code>may cause more harm than good<\/code>评价可能的后果。题干问整份报告的态度，不能只截取其中一个赞扬词。<\/p>\n"},{"title":"A. Critical.","raw":"### A. Critical.\n\n> 批评的\n\n**做题模式中的状态：** 当时选项完整可读，原文的`failure`和`crisis`等位置显示为`[xxx]`，但已读到`Regrettably, however`与`more harm than good`。因为首句同时有`deserves praise`，第一轮把A与B一起保留；40题主旨确定后，回看首段转折、后文的思想排斥和末段改革风险，才确定A。\n\n**选项类型：正确跨句概括。**\n\n命题人没有复现某一个负面形容词，而是用`Critical`概括整段的评价重心。作者承认报告肯定人文社科有价值，但随即指出它没有处理危机的真实性质，甚至可能弊大于利。承认可取之处使批评有分寸，并没有取消批评。\n\n**出处：**\n\n> \"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.\n>\n> Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 A选项","focus":[85,173,239,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":36,"option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q36-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>批评的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文的<code>failure<\/code>和<code>crisis<\/code>等位置显示为<code>[xxx]<\/code>，但已读到<code>Regrettably, however<\/code>与<code>more harm than good<\/code>。因为首句同时有<code>deserves praise<\/code>，第一轮把A与B一起保留；40题主旨确定后，回看首段转折、后文的思想排斥和末段改革风险，才确定A。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>命题人没有复现某一个负面形容词，而是用<code>Critical<\/code>概括整段的评价重心。作者承认报告肯定人文社科有价值，但随即指出它没有处理危机的真实性质，甚至可能弊大于利。承认可取之处使批评有分寸，并没有取消批评。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. Critical.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第一段，作者对AAAS报告持批评态度。\n\n题干限定第1段，态度要落在评价报告的两处谓语上：`deserves praise`与`may cause more harm than good`。连接两句的`Regrettably, however`决定前后怎样接起来。\n\n首句肯定的对象有限：报告强调了人文社科的重要性。后句批评的则是报告没有触及博雅教育危机的本质，并进一步指出这种缺失可能造成反效果。\n\n`Critical`不要求作者否认报告的每一点价值。它保留了“承认一部分，但对核心判断和后果提出批评”的关系，也没有把`may`改成报告已经造成了损害。\n\nA把两句的转折关系概括为有依据的批评，覆盖了作者的主导态度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 A选项","focus":[85,173,239,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q36-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>批评的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文的<code>failure<\/code>和<code>crisis<\/code>等位置显示为<code>[xxx]<\/code>，但已读到<code>Regrettably, however<\/code>与<code>more harm than good<\/code>。因为首句同时有<code>deserves praise<\/code>，第一轮把A与B一起保留；40题主旨确定后，回看首段转折、后文的思想排斥和末段改革风险，才确定A。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>命题人没有复现某一个负面形容词，而是用<code>Critical<\/code>概括整段的评价重心。作者承认报告肯定人文社科有价值，但随即指出它没有处理危机的真实性质，甚至可能弊大于利。承认可取之处使批评有分寸，并没有取消批评。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持批评态度。<\/p>\n<\/blockquote>\n<p>题干限定第1段，态度要落在评价报告的两处谓语上：<code>deserves praise<\/code>与<code>may cause more harm than good<\/code>。连接两句的<code>Regrettably, however<\/code>决定前后怎样接起来。<\/p>\n<p>首句肯定的对象有限：报告强调了人文社科的重要性。后句批评的则是报告没有触及博雅教育危机的本质，并进一步指出这种缺失可能造成反效果。<\/p>\n<p><code>Critical<\/code>不要求作者否认报告的每一点价值。它保留了“承认一部分，但对核心判断和后果提出批评”的关系，也没有把<code>may<\/code>改成报告已经造成了损害。<\/p>\n<p>A把两句的转折关系概括为有依据的批评，覆盖了作者的主导态度。<\/p>\n<\/section>"},{"title":"A. Critical.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Unfortunately, despite 2½ years in the making, \"The Heart of the Matter\" never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.\n>\n> The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.\n>\n> 第4段指出报告没碰到真正的问题，结尾继续担心它掩盖挑战并妨碍改革。\n\n后文把首段“未处理真正危机”的批评展开成具体内容，又回到改革风险；并未把赞扬报告的目标作为结论。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The report deserves credit for its aims, but its failure to confront illiberal education may hinder reform.\n>\n> 这份报告的目标值得肯定，但它未能正视教育中的不自由，可能妨碍改革。\n\nA所需的推进正是原文已有的关系：先给目标以肯定，再指出诊断缺口，最后评估这个缺口的后果。批评落在报告的实质不足上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 A选项","focus":[85,173,239,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q36-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>批评的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文的<code>failure<\/code>和<code>crisis<\ ucation may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持批评态度。<\/p>\n<\/blockquote>\n<p>题干限定第1段，态度要落在评价报告的两处谓语上：<code>deserves praise<\/code>与<code>may cause more harm than good<\/code>。连接两句的<code>Regrettably, however<\/code>决定前后怎样接起来。<\/p>\n<p>首句肯定的对象有限：报告强调了人文社科的重要性。后句批评的则是报告没有触及博雅教育危机的本质，并进一步指出这种缺失可能造成反效果。<\/p>\n<p><code>Critical<\/code>不要求作者否认报告的每一点价值。它保留了“承认一部分，但对核心判断和后果提出批评”的关系，也没有把<code>may<\/code>改成报告已经造成了损害。<\/p>\n<p>A把两句的转折关系概括为有依据的批评，覆盖了作者的主导态度。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>第4段指出报告没碰到真正的问题，结尾继续担心它掩盖挑战并妨碍改革。<\/p>\n<\/blockquote>\n<p>后文把首段“未处理真正危机”的批评展开成具体内容，又回到改革风险；并未把赞扬报告的目标作为结论。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report deserves credit for its aims, but its failure to confront illiberal education may hinder reform.<\/p>\n<p>这份报告的目标值得肯定，但它未能正视教育中的不自由，可能妨碍改革。<\/p>\n<\/blockquote>\n<p>A所需的推进正是原文已有的关系：先给目标以肯定，再指出诊断缺口，最后评估这个缺口的后果。批评落在报告的实质不足上。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>作者主要应批评这份报告没有正视博雅教育中的不自由，并担心这种遗漏妨碍改革；对个别目标的认可可以作为让步保留。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>Critical.<br>批评的<\/p>\n<\/blockquote>\n<p>A的批评对象是报告遗漏真正危机，主旨也把报告与不自由的教育联系起来。二者指向同一评价任务；局部的<code>Regrettably, however<\/code>和<code>more harm than good<\/code>进一步把这个方向落实。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<\/section>"},{"title":"B. Appreciative.","raw":"### B. Appreciative.\n\n> 赞赏的\n\n**做题模式中的状态：** 当时选项没有遮挡，原文中`affirming`显示为`[xxx]`，但`deserves praise`清楚可见，因此B第一轮保留。后来40题确定了报告回避不自由教育这一主线，再看第4至6段持续批评报告遗漏核心并可能妨碍改革，才排除B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nB借用首句真实存在的赞扬，却把对报告某一点价值的认可拿来回答整份报告的主导态度。问题不在于作者从未赞扬，而在于赞扬后紧接的转折与后果判断被省略了。\n\n**出处：**\n\n> \"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.\n>\n> Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 B选项","focus":[85,255,341,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":36,"option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q36-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>赞赏的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项没有遮挡，原文中<code>affirming<\/code>显示为<code>[xxx]<\/code>，但<code>deserves praise<\/code>清楚可见，因此B第一轮保留。后来40题确定了报告回避不自由教育这一主线，再看第4至6段持续批评报告遗漏核心并可能妨碍改革，才排除B。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>B借用首句真实存在的赞扬，却把对报告某一点价值的认可拿来回答整份报告的主导态度。问题不在于作者从未赞扬，而在于赞扬后紧接的转折与后果判断被省略了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure 须继续读同一段中的<code>Regrettably, however<\/code>，不能在第一句末尾结束定位。<\/p>\n<p>首句的<code>for affirming the importance<\/code>限定了赞扬理由：报告承认人文社科的重要性。这一局部肯定是真的。第二句则说报告没有处理危机本质，可能弊大于利。<\/p>\n<p>如果用“赞赏”统领全段，就把一个受理由限定的正面评价扩大成了总体判断，也让后面的明确转折失去了作用。<\/p>\n<p>B保留了局部赞扬这一事实，却没有回答题干要求的整体评价层面。<\/p>\n<\/section>"},{"title":"B. Appreciative.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> The goals identified in the report are generally admirable.\n>\n> Unfortunately, despite 2½ years in the making, \"The Heart of the Matter\" never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.\n>\n> The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.\n>\n> 作者先承认报告目标总体可取，随后指出它没有触及教育中的不自由，最后仍担心它妨碍改革。\n\n第3段的正面内容没有一路展开到肯定报告的结尾；第4段又用`Unfortunately`把读者带回报告的缺陷。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The report has limitations, yet its treatment of the central crisis gives liberal education a valuable basis for reform.\n>\n> 这份报告虽有局限，但它对核心危机的处理为博雅教育改革提供了有价值的基础。\n\n若总体赞赏，承认不足后应当回到报告对核心改革的价值。实际结尾却是它可能掩盖挑战、使改革倒退，评价的终点相反。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 B选项","focus":[85,255,341,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q36-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>赞赏的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项没有遮挡，原文中<code>affirming<\/code>显示为<code>[xxx]<\/code>，但<code>deserves praise<\/code>清楚可见，因此B第一轮保留。后来40题确定了报告回避不自由教育这一主线，再看第4至6段持续批评报告遗漏核心并可能妨碍改革，才排除B。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>B借用首句真实存在的赞扬，却把对报告某一点价值的认可拿来回答整份报告的主导态度。问题不在于作者从未赞扬，而在于赞扬后紧接的转折与后果判断被省略了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q36-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持赞赏态度。<\/p>\n<\/blockquote>\n<p><code>Appreciative<\/code>最直接对应<code>deserves praise<\/code>，但题干问的是对报告的态度，必须继续读同一段中的<code>Regrettably, however<\/code>，不能在第一句末尾结束定位。<\/p>\n<p>首句的<code>for affirming the importance<\/code>限定了赞扬理由：报告承认人文社科的重要性。这一局部肯定是真的。第二句则说报告没有处理危机本质，可能弊大于利。<\/p>\n<p>如果用“赞赏”统领全段，就把一个受理由限定的正面评价扩大成了总体判断，也让后面的明确转折失去了作用。<\/p>\n<p>B保留了局部赞扬这一事实，却没有回答题干要求的整体评价层面。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The goals identified in the report are generally admirable.<\/p>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者先承认报告目标总体可取，随后指出它没有触及教育中的不自由，最后仍担心它妨碍改革。<\/p>\n<\/blockquote>\n<p>第3段的正面内容没有一路展开到肯定报告的结尾；第4段又用<code>Unfortunately<\/code>把读者带回报告的缺陷。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report has limitations, yet its treatment of the central crisis gives liberal education a valuable basis for reform.<\/p>\n<p>这份报告虽有局限，但它对核心危机的处理为博雅教育改革提供了有价值的基础。<\/p>\n<\/blockquote>\n<p>若总体赞赏，承认不足后应当回到报告对核心改革的价值。实际结尾却是它可能掩盖挑战、使改革倒退，评价的终点相反。<\/p>\n<\/section>"},{"title": \n<p>如果用“赞赏”统领全段，就把一个受理由限定的正面评价扩大成了总体判断，也让后面的明确转折失去了作用。<\/p>\n<p>B保留了局部赞扬这一事实，却没有回答题干要求的整体评价层面。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The goals identified in the report are generally admirable.<\/p>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者先承认报告目标总体可取，随后指出它没有触及教育中的不自由，最后仍担心它妨碍改革。<\/p>\n<\/blockquote>\n<p>第3段的正面内容没有一路展开到肯定报告的结尾；第4段又用<code>Unfortunately<\/code>把读者带回报告的缺陷。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report has limitations, yet its treatment of the central crisis gives liberal education a valuable basis for reform.<\/p>\n<p>这份报告虽有局限，但它对核心危机的处理为博雅教育改革提供了有价值的基础。<\/p>\n<\/blockquote>\n<p>若总体赞赏，承认不足后应当回到报告对核心改革的价值。实际结尾却是它可能掩盖挑战、使改革倒退，评价的终点相反。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>作者主要应批评报告没有正视博雅教育中的不自由；赞扬报告重视人文社科，只能构成这场批评中的有限认可。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>Appreciative.<br>赞赏的<\/p>\n<\/blockquote>\n<p>B抓住“值得赞扬”的局部内容，但主旨要求追问报告与不自由教育之间的缺口。把局部赞赏提升为全段重心，就解释不了作者为何接着讨论报告可能妨碍改革。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. Contemptuous.","raw":"### C. Contemptuous.\n\n> 轻蔑的\n\n**做题模式中的状态：** 当时选项完整可读，虽然`affirming`等词显示为`[xxx]`，仍读到了`deserves praise`。当时认为C把有保留的批评推成轻蔑，第一轮排除，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用了报告可能弊大于利的负面评价，却进一步加入鄙视、不屑的意味。作者确实批评报告，但批评有明确理由，也认真承认报告值得肯定的部分；原文没有把这种批评写成轻蔑姿态。\n\n**出处：**\n\n> \"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.\n>\n> Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 C选项","focus":[85,338,373,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":36,"option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q36-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>轻蔑的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，虽然<code>affirming<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>deserves praise<\/code>。当时认为C把有保留的批评推成轻蔑，第一轮排除，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了报告可能弊大于利的负面评价，却进一步加入鄙视、不屑的意味。作者确实批评报告，但批评有明确理由，也认真承认报告值得肯定的部分；原文没有把这种批评写成轻蔑姿态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. Contemptuous.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据第一段，作者对AAAS报告持轻蔑态度。\n\n用`Contemptuous`判断态度，不能只找到`harm`这个负面词。还要核对评价理由和语气：作者先说`deserves praise`，再用`Regrettably`表达遗憾，指出报告未触及真正的危机。\n\n原文的负面判断围绕“没有处理危机本质”和“可能产生坏影响”展开，针对报告的内容与作用。`may`仍保留对后果的可能性判断。\n\n轻蔑意味着带着鄙视或不屑看待对象，比有理由的批评多出一种贬抑姿态。不能见到负面结论，就把所有负面态度词互换。\n\nC把具体、有限度的批评改成轻蔑，加入了原文并未呈现的态度强度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 C选项","focus":[85,338,373,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q36-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>轻蔑的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，虽然<code>affirming<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>deserves praise<\/code>。当时认为C把有保留的批评推成轻蔑，第一轮排除，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了报告可能弊大于利的负面评价，却进一步加入鄙视、不屑的意味。作者确实批评报告，但批评有明确理由，也认真承认报告值得肯定的部分；原文没有把这种批评写成轻蔑姿态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持轻蔑态度。<\/p>\n<\/blockquote>\n<p>用<code>Contemptuous<\/code>判断态度，不能只找到<code>harm<\/code>这个负面词。还要核对评价理由和语气：作者先说<code>deserves praise<\/code>，再用<code>Regrettably<\/code>表达遗憾，指出报告未触及真正的危机。<\/p>\n<p>原文的负面判断围绕“没有处理危机本质”和“可能产生坏影响”展开，针对报告的内容与作用。<code>may<\/code>仍保留对后果的可能性判断。<\/p>\n<p>轻蔑意味着带着鄙视或不屑看待对象，比有理由的批评多出一种贬抑姿态。不能见到负面结论，就把所有负面态度词互换。<\/p>\n<p>C把具体、有限度的批评改成轻蔑，加入了原文并未呈现的态度强度。<\/p>\n<\/section>"},{"title":"C. Contemptuous.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> The goals identified in the report are generally admirable.\n>\n> The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.\n>\n> 作者承认目标总体值得肯定，也承认AAAS热情很高，但继续指出报告可能产生的不良后果。\n\n实际写法不断分开“目标和热情可取”与“诊断不足”，批评的是报告的问题，不是用不屑的口气否定报告的价值。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The report’s failure to address the crisis is contemptible.\n>\n> 这份报告未处理危机的做法令人鄙视。\n\n这种写法才会直接体现C所说的轻蔑。实际文章认真讨论报告的任务、建议与遗漏，并未用鄙视的语气替代对报告缺陷的分析。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 C选项","focus":[85,338,373,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q36-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>轻蔑的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，虽然<code>affirming<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>deserves praise<\/code>。当时认为C把有保留的批评推成轻蔑，第一轮排除，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了报告可能弊大于利的负面评价，却进一步加入鄙视、不屑的意味。作者确实批评报告，但批评有明确理由，也认真承认报告值得肯定的部分；原文没有把这种批评写成轻蔑姿态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持轻蔑态度。<\/p>\n<\/blockquote>\n<p>用<code>Contemptuous<\/code>判断态度，不能只找到<code>harm<\/code>这个负面词。还要核对评价理由和语气：作者先说<code>deserves praise<\/code>，再用<code>Regrettably<\/code>表达遗憾，指出报告未触及真正的危机。<\/p>\n<p>原文的负面判断围绕“没有处理危机本质”和“可能产生坏影响”展开，针对报告的内容与作用。<code>may<\/code>仍保留对后果的可能性判断。<\/p>\n<p>轻蔑意味着带着鄙视或不屑看待对象，比有理由的批评多出一种贬抑姿态。不能见到负面结论，就把所有负面态度词互换。<\/p>\n<p>C把具体、有限度的批评改成轻蔑，加入了原文并未呈现的态度强度。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q36-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The goals identified in the report are generally admirable.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者承认目标总体值得肯定，也承认AAAS热情很高，但继续指出报告可能产生的不良后果。<\/p>\n<\/blockquote>\n<p>实际写法不断分开“目标和热情可取”与“诊断不足”，批评的是报告的问题，不是用不屑的口气否定报告的价值。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report’s failure to address the crisis is contemptible.<\/p>\n<p>这份报告未处理危机的做法令人鄙视。<\/p>\n<\/blockquote>\n<p>这种写法才会直接体现C所说的轻蔑。实际文章认真讨论报告的任务、建议与遗漏，并未用鄙视的语气替代对报告缺陷的分析。<\/p>\n<\/section>"},{"title":"C. Contemptuous.","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入36题题干：\n\n> 主旨要求作者批评报告回避不自由教育，并不能进一步推出作者鄙视报告；批评的具体语气还要回到第1段。\n\n但C实际说的是：\n\n> Contemptuous.  \n> 轻蔑的\n\nC在主旨所需的批评之外增加了轻蔑意味。首段的`deserves praise`与有理由的缺陷分析，加上后文承认目标可取，都不能支持这一额外态度。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 C选项","focus":[85,338,373,60],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q36-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>轻蔑的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，虽然<code>affirming<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>deserves praise<\/code>。当时认为C把有保留的批评推成轻蔑，第一轮排除，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了报告可能弊大于利的负面评价，却进一步加入鄙视、不屑的意味。作者确实批评报告，但批评有明确理由，也认真承认报告值得肯定的部分；原文没有把这种批评写成轻蔑姿态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for af 有理由的缺陷分析，加上后文承认目标可取，都不能支持这一额外态度。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. Tolerant.","raw":"### D. Tolerant.\n\n> 宽容的\n\n**做题模式中的状态：** 当时选项完整可读，原文中`failure`、`crisis`显示为`[xxx]`，但`more harm than good`可读。做题时据此认为作者在警告缺陷的后果，没有表示接受这些不足，所以D第一轮排除，后续未变。\n\n**错误类型：第一类——歪曲原意。**\n\nD把作者承认报告的一部分优点理解成对其核心缺陷的包容。可是作者随即表达遗憾，指出报告遗漏危机本质且可能弊大于利；肯定目标不等于接受这项缺失。\n\n**出处：**\n\n> \"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.\n>\n> Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 D选项","focus":[85,419,257,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":36,"option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q36-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>宽容的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文中<code>failure<\/code>、<code>crisis<\/code>显示为<code>[xxx]<\/code>，但<code>more harm than good<\/code>可读。做题时据此认为作者在警告缺陷的后果，没有表示接受这些不足，所以D第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D把作者承认报告的一部分优点理解成对其核心缺陷的包容。可是作者随即表达遗憾，指出报告遗漏危机本质且可能弊大于利；肯定目标不等于接受这项缺失。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. Tolerant.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第一段，作者对AAAS报告持宽容态度。\n\n`Tolerant`需要对应作者怎样看待报告的不足。首句虽有赞扬，第二句的`failure to address`与`may cause more harm than good`却正面追究不足及其可能后果。\n\n作者没有因为报告出发点良好就搁置问题，而是把“未处理真正危机”放在转折后的核心位置。`Regrettably`也表明他并不把这一缺失当作可以轻轻带过的小问题。\n\n宽容与批评在现实中未必互斥，但本题要选原文着重表达的态度；文中没有“这些不足可以接受”的说明，只有对它们可能带来危害的警告。\n\nD把承认可取之处误当成接受关键不足，弱化了原文的评价重点。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题 D选项","focus":[85,419,257,51],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":36,"option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q36-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>宽容的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文中<code>failure<\/code>、<code>crisis<\/code>显示为<code>[xxx]<\/code>，但<code>more harm than good<\/code>可读。做题时据此认为作者在警告缺陷的后果，没有表示接受这些不足，所以D第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D把作者承认报告的一部分优点理解成对其核心缺陷的包容。可是作者随即表达遗憾，指出报告遗漏危机本质且可能弊大于利；肯定目标不等于接受这项缺失。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q36-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持宽容态度。<\/p>\n<\/blockquote>\n<p><code>Tolerant<\/code>需要对应作者怎样看待报告的不足。首句虽有赞扬，第二句的<code>failure to address<\/code>与<code>may cause more harm than good<\/code>却正面追究不足及其可能后果。<\/p>\n<p>作者没有因为报告出发点良好就搁置问题，而是把“未处理真正危机”放在转折后的核心位置。<co
