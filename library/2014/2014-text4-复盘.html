”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入39题题干：\n\n> 作者应通过教授对不同思想的不平等取舍，说明博雅教育怎样失去开放探究精神；古典自由主义是被排斥的一方，由第5段具体确认。\n\nB实际说的是：\n\n> biased against classical liberal ideas  \n> 对古典自由主义思想有偏见\n\nB把不自由的教育落实为对古典自由主义思想的偏见。这个对象和方向既接得上主旨中的思想封闭，也有局部两边不同待遇的直接依据。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 B选项","focus":[85,1817,803,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q39-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>对古典自由主义思想有偏见<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整可读。虽然原文的<code>routinely<\/code>和<code>portraying<\/code>显示为<code>[xxx]<\/code>，但一边是<code>proper subject of study<\/code>、另一边在研究<code>boundaries<\/code>之外的对照可读。做题时用这种不对等标准概括<code>biased against<\/code>，第一轮保留B并确定答案，后续未变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>B没有照抄原文，而是将两类思想受到不同待遇这一事实概括为偏见。教授承认进步主义是正当研究对象，却排除古典自由主义；偏见体现在对研究对象的选择性认可与排斥上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们对古典自由主义思想有偏见。<\/p>\n<\/blockquote>\n<p><code>classical liberal ideas<\/code>给出相同对象，<code>biased against<\/code>则要从<code>while<\/code>两边的待遇比较中判断：一边是合适的研究对象，另一边被放到研究边界之外。<\/p>\n<p>原文没有只说教授研究进步主义，而是紧接着写他们如何对待其他思想。<code>proper subject<\/code>与<code>outside the boundaries<\/code>一起构成不同标准。<\/p>\n<p>如果只是专业分工，未研究另一领域未必叫偏见；但作者进一步说另一类思想有时连正当研究都不被承认，并在前段把这种做法放在宣传取代探究的批评中。推断因此落在学术上的不公正排斥。<\/p>\n<p>B用“对古典自由主义思想有偏见”概括这组对照，既保留被排斥的对象，也没有扩大成教授在所有生活问题上都有偏见。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>文章先批评宣传取代探究，再写教授对两类思想的不对等处理，最后指出报告掩盖了这种挑战。<\/p>\n<\/blockquote>\n<p>第5段是第4段“不自由”的具体表现；结尾的报告批评也以这种真实教育问题未被正视为依据。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors accept progressive ideas as legitimate subjects but unfairly exclude classical liberal ideas from intellectual inquiry.<\/p>\n<p>教授认可进步主义思想为正当研究对象，却不公正地把古典自由主义思想排除在学术探究之外。<\/p>\n<\/blockquote>\n<p>B所需要的就是这种选择性排斥。它对应原文<code>proper subject<\/code>与<code>outside the boundaries<\/code>的对照，也能承接前文对思想宣传的批评。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>作者应通过教授对不同思想的不平等取舍，说明博雅教育怎样失去开放探究精神；古典自由主义是被排斥的一方，由第5段具体确认。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>biased against classical liberal ideas<br>对古典自由主义思想有偏见<\/p>\n<\/blockquote>\n<p>B把不自由的教育落实为对古典自由主义思想的偏见。这个对象和方向既接得上主旨中的思想封闭，也有局部两边不同待遇的直接依据。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<\/section>"},{"title":"C. cautious about intellectual investigation","raw":"### C. cautious about intellectual investigation\n\n> 对学术研究持谨慎态度\n\n**做题模式中的状态：** 当时C完整可读，原文中的`intellectual investigation`及`outside the boundaries`也可读。做题时判断原文是在说选择性排除某类思想，不是一般谨慎，因此第一轮排除C，后续未变。\n\n**错误类型：第一类——歪曲原意。**\n\nC沿用学术研究这一表述，却把某类思想被排除在研究范围之外，改写为教授对研究持谨慎态度。原文是在批评取舍标准有偏向，选项把这个关系改成了不带特定对象的审慎。\n\n**出处：**\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 C选项","focus":[85,1899,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":39,"option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q39-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>对学术研究持谨慎态度<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>intellectual investigation<\/code>及<code>outside the boundaries<\/code>也可读。做题时判断原文是在说选择性排除某类思想，不是一般谨慎，因此第一轮排除C，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C沿用学术研究这一表述，却把某类思想被排除在研究范围之外，改写为教授对研究持谨慎态度。原文是在批评取舍标准有偏向，选项把这个关系改成了不带特定对象的审慎。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. cautious about intellectual investigation","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者在第五段暗示，教授们对学术研究持谨慎态度。\n\n`intellectual investigation`在原句末尾，但它受`outside the boundaries of routine, and sometimes legitimate`限制。必须读清是谁被放在这些边界之外，而不能只取“学术研究”四个字。\n\n被排除的是保守主义或古典自由主义思想；与之对照，进步主义被当作适当的研究内容。作者比较的是思想类别受到的待遇，不是教授调查证据时有多小心。\n\n谨慎研究通常要有慎下结论、核实证据等行为作支持。第5段没有给出这些行为；它给出的是一类可研究、另一类被排除在常规研究之外，有时甚至不被视为正当研究的差别。\n\nC把针对特定思想的选择性排斥，改成对学术研究的一般审慎，丢失了作者着重批评的对象和标准。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 C选项","focus":[85,1899,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q39-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>对学术研究持谨慎态度<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>intellectual investigation<\/code>及<code>outside the boundaries<\/code>也可读。做题时判断原文是在说选择性排除某类思想，不是一般谨慎，因此第一轮排除C，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C沿用学术研究这一表述，却把某类思想被排除在研究范围之外，改写为教授对研究持谨慎态度。原文是在批评取舍标准有偏向，选项把这个关系改成了不带特定对象的审慎。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们对学术研究持谨慎态度。<\/p>\n<\/blockquote>\n<p><code>intellectual investigation<\/code>在原句末尾，但它受<code>outside the boundaries of routine, and sometimes legitimate<\/code>限制。必须读清是谁被放在这些边界之外，而不能只取“学术研究”四个字。<\/p>\n<p>被排除的是保守主义或古典自由主义思想；与之对照，进步主义被当作适当的研究内容。作者比较的是思想类别受到的待遇，不是教授调查证据时有多小心。<\/p>\n<p>谨慎研究通常要有慎下结论、核实证据等行为作支持。第5段没有给出这些行为；它给出的是一类可研究、另一类被排除在常规研究之外，有时甚至不被视为正当研究的差别。<\/p>\n<p>C把针对特定思想的选择性排斥，改成对学术研究的一般审慎，丢失了作者着重批评的对象和标准。<\/p>\n<\/section>"},{"title":"C. cautious about intellectual investigation","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing \"progressive,\" or left-liberal propaganda.\n>\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n>\n> 前段说探究被宣传取代，第5段用教授认可一类思想、排斥另一类思想来说明这种变化。\n\n实际文章沿着学术开放性受损往下写，没有转而赞扬教授在证据不足时保持谨慎。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Professors approach intellectual investigation cautiously and avoid conclusions until they have sufficient evidence.\n>\n> 教授谨慎进行学术研究，在证据充分以前避免作出结论。\n\nC所需的是研究过程中的审慎表现。实际原文并未说明这类行为，而是在比较思想的准入标准；不能把“划出研究边界”自动美化为谨慎。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 C选项","focus":[85,1899,873,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q39-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>对学术研究持谨慎态度<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>intellectual investigation<\/code>及<code>outside the boundaries<\/code>也可读。做题时判断原文是在说选择性排除某类思想，不是一般谨慎，因此第一轮排除C，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C沿用学术研究这一表述，却把某类思想被排除在研究范围之外，改写为教授对研究持谨慎态度。原文是在批评取舍标准有偏向，选项把这个关系改成了不带特定对象的审慎。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们对学术研究持谨慎态度。<\/p>\n<\/blockquote>\n<p><code>intellectual investigation<\/code>在原句末尾，但它受<code>outside the boundaries of routine, and sometimes legitimate<\/code>限制。必须读清是谁被放在这些边界之外，而不能只取“学术研究”四个字。<\/p>\n<p>被排除的是保守主义或古典自由主义思想；与之对照，进步主义被当作适当的研究内容。作者比较的是思想类别受到的待遇，不是教授调查证据时有多小心。<\/p>\n<p>谨慎研究通常要有慎下结论、核实证据等行为作支持。第5段没有给出这些行为；它给出的是一类可研究、另一类被排除在常规研究之外，有时甚至不被视为正当研究的差别。<\/p>\n<p>C把针对特定思想的选择性排斥，改成对学术研究的一般审慎，丢失了作者着重批评的对象和标准。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>前段说探究被宣传取代，第5段用教授认可一类思想、排斥另一类思想来说明这种变化。<\/p>\n<\/blockquote>\n<p>实际文章沿着学术开放性受损往下写，没有转而赞扬教授在证据不足时保持谨慎。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors approach intellectual investigation cautiously and avoid conclusions until they have sufficient evidence.<\/p>\n<p>教授谨慎进行学术研究，在证据充分以前避免作出结论。<\/p>\n<\/blockquote>\n<p>C所需的是研究过程中的审慎表现。实际原文并未说明这类行为，而是在比较思想的准入标准；不能把“划出研究边界”自动美化为谨慎。<\/p>\n<\/section>"},{"title":"C. cautious about intellectual investigation","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入39题题干：\n\n> 作者应说明教授怎样使博雅教育失去开放性，而非仅仅描述研究过程中的审慎；第 进步主义公共政策。\n\n**出处：**\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 D选项","focus":[85,1981,733,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"option","question":39,"option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q39-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文的<code>progressive public policy<\/code>和<code>conservative or classical liberal ideas<\/code>也可读。做题时看到教授将前者视为适当研究对象、把后者排除，认为D写错了方向，所以第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了<code>public policy<\/code>和<code>conservative<\/code>，却改变两者在句中的归属。原文的保守主义修饰被排除的思想，不是在给教授本人下政策立场的定义；被教授视为适当研究对象的政策则是进步主义公共政策。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. conservative about public policy","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者在第五段暗示，教授们在公共政策上持保守立场。\n\n`public policy`在原文由`progressive`修饰；`conservative`出现在`while`后面，修饰被描绘为研究边界之外的思想。要把两个词各自接回所属部分。\n\n教授作为主语，对进步主义政策和保守主义思想分别作出不同的学术评价。原句的`conservative`不是教授的表语，不能直接搬过去说教授在政策上保守。\n\n把某一政策当作研究对象也不等于赞成那一政策的全部主张，所以不能据此替教授补一套完整政治立场。这里可以判断的是研究标准偏向进步主义、排斥保守主义和古典自由主义。\n\nD把被排斥思想的性质改成教授本人的政策立场，原文并不支持这个移接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 D选项","focus":[85,1981,733,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q39-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文的<code>progressive public policy<\/code>和<code>conservative or classical liberal ideas<\/code>也可读。做题时看到教授将前者视为适当研究对象、把后者排除，认为D写错了方向，所以第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了<code>public policy<\/code>和<code>conservative<\/code>，却改变两者在句中的归属。原文的保守主义修饰被排除的思想，不是在给教授本人下政策立场的定义；被教授视为适当研究对象的政策则是进步主义公共政策。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们在公共政策上持保守立场。<\/p>\n<\/blockquote>\n<p><code>public policy<\/code>在原文由<code>progressive<\/code>修饰；<code>conservative<\/code>出现在<code>while<\/code>后面，修饰被描绘为研究边界之外的思想。要把两个词各自接回所属部分。<\/p>\n<p>教授作为主语，对进步主义政策和保守主义思想分别作出不同的学术评价。原句的<code>conservative<\/code>不是教授的表语，不能直接搬过去说教授在政策上保守。<\/p>\n<p>把某一政策当作研究对象也不等于赞成那一政策的全部主张，所以不能据此替教授补一套完整政治立场。这里可以判断的是研究标准偏向进步主义、排斥保守主义和古典自由主义。<\/p>\n<p>D把被排斥思想的性质改成教授本人的政策立场，原文并不支持这个移接。<\/p>\n<\/section>"},{"title":"D. conservative about public policy","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n>\n> 教授把进步主义公共政策视作适当研究对象，却将保守主义或古典自由主义思想排除在研究边界外。\n\n实际段落在展示学术取舍的偏向，并未从研究范围转到教授本人如何制定或支持具体公共政策。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Professors take a conservative stance on public policy.\n>\n> 教授在公共政策上采取保守立场。\n\nD成立至少需要这个关于教授立场的明确描述。原文相应位置只写保守主义思想如何被他们排斥；研究对象的思想标签不能直接成为研究者的立场标签。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 D选项","focus":[85,1981,733,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q39-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文的<code>progressive public policy<\/code>和<code>conservative or classical liberal ideas<\/code>也可读。做题时看到教授将前者视为适当研究对象、把后者排除，认为D写错了方向，所以第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了<code>public policy<\/code>和<code>conservative<\/code>，却改变两者在句中的归属。原文的保守主义修饰被排除的思想，不是在给教授本人下政策立场的定义；被教授视为适当研究对象的政策则是进步主义公共政策。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们在公共政策上持保守立场。<\/p>\n<\/blockquote>\n<p><code>public policy<\/code>在原文由<code>progressive<\/code>修饰；<code>conservative<\/code>出现在<code>while<\/code>后面，修饰被描绘为研究边界之外的思想。要把两个词各自接回所属部分。<\/p>\n<p>教授作为主语，对进步主义政策和保守主义思想分别作出不同的学术评价。原句的<code>conservative<\/code>不是教授的表语，不能直接搬过去说教授在政策上保守。<\/p>\n<p>把某一政策当作研究对象也不等于赞成那一政策的全部主张，所以不能据此替教授补一套完整政治立场。这里可以判断的是研究标准偏向进步主义、排斥保守主义和古典自由主义。<\/p>\n<p>D把被排斥思想的性质改成教授本人的政策立场，原文并不支持这个移接。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>教授把进步主义公共政策视作适当研究对象，却将保守主义或古典自由主义思想排除在研究边界外。<\/p>\n<\/blockquote>\n<p>实际段落在展示学术取舍的偏向，并未从研究范围转到教授本人如何制定或支持具体公共政策。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors take a conservative stance on public policy.<\/p>\n<p>教授在公共政策上采取保守立场。<\/p>\n<\/blockquote>\n<p>D成立至少需要这个关于教授立场的明确描述。原文相应位置只写保守主义思想如何被他们排斥；研究对象的思想标签不能直接成为研究者的立场标签。<\/p>\n<\/section>"},{"title":"D. conservative about public policy","raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Illiberal Education and “The Heart of the Matter”  \n> 不自由的教育与《问题的核心》\n\n把这个主旨直接代入39题题干：\n\n> 全文主旨要求指出教育中不自由的表现，不能单凭“不自由”就给教授贴上公共政策保守派的标签。\n\n但D实际说的是：\n\n> conservative about public policy  \n> 在公共政策上持保守立场\n\nD把教育中的不开放与政治上的保守混在一起。本项仍须看第5段：`conservative`修饰被排斥的思想，而不是教授的政策立场；标题中的`illiberal`也不能替代这个具体关系。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题 D选项","focus":[85,1981,733,61],"sourceW":1686,"sourceH":2543},"meta":{"kind":"method","question":39,"option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q39-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文的<code>progressive public policy<\/code>和<code>conservative or classical liberal ideas<\/code>也可读。做题时看到教授将前者视为适当研究对象、把后者排除，认为D写错了方向，所以第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了<code>public policy<\/code>和<code>conservative<\/code>，却改变两者在句中的归属。原文的保守主义修饰被排除的思想，不是在给教授本人下政策立场的定义；被教授视为适当研究对象的政策则是进步主义公共政策。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们在公共政策上持保守立场。<\/p>\n<\/blockquote>\n<p><code>public policy<\/code>在原文由<code>progressive<\/code>修饰；<code>conservative<\/code>出现在<code>while<\/code>后面，修饰被描绘为研究边界之外的思想。要把两个词各自接回所属部分。<\/p>\n<p>教授作为主语，对进步主义政策和保守主义思想分别作出不同的学术评价。原句的<code>conservative<\/code>不是教授的表语，不能直接搬过去说教授在政策上保守。<\/p>\n<p>把某一政策当作研究对象也不等于赞成那一政策的全部主张，所以不能据此替教授补一套完整政治立场。这里可以判断的是研究标准偏向进步主义、排斥保守主义和古典自由主义。<\/p>\n<p>D把被排斥思想的性质改成教授本人的政策立场，原文并不支持这个移接。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>教授把进步主义公共政策视作适当研究对象，却将保守主义或古典自由主义思想排除在研究边界外。<\/p>\n<\/blockquote>\n<p>实际段落在展示学术取舍的偏向，并未从研究范围转到教授本人如何制定或支持具体公共政策。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors take a conservative stance on public policy.<\/p>\n<p>教授在公共政策上采取保守立场。<\/p>\n<\/blockquote>\n<p>D成立至少需要这个关于教授立场的明确描述。原文相应位置只写保守主义思想如何被他们排斥；研究对象的思想标签不能直接成为研究者的立场标签。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q39-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>全文主旨要求指出教育中不自由的表现，不能单凭“不自由”就给教授贴上公共政策保守派的标签。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>conservative about public policy<br>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p>D把教育中的不开放与政治上的保守混在一起。本项仍须看第5段：<code>conservative<\/code>修饰被排斥的思想，而不是教授的政策立场；标题中的<code>illiberal<\/code>也不能替代这个具体关系。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. B. biased against classical liberal ideas**\n\nA把被排除的自由市场思想改成教授支持的对象。\n\nB从两类思想受到不平等待遇的事实，推断出对古典自由主义的偏见。\n\nC把选择性排斥思想改成了对学术研究的一般谨慎。\n\nD把被排斥思想的保守主义标签移到了教授本人的政策立场上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[6,1648,1352,398],"sourceW":1686,"sourceH":2543},"meta":{"kind":"conclusion","question":39},"level":3,"html":"<blockquote>\n<p><strong>39. B. biased against classical liberal ideas<\/strong><\/p>\n<\/blockquote>\n<p>A把被排除的自由市场思想改成教授支持的对象。<\/p>\n<p>B从两类思想受到不平等待遇的事实，推断出对古典自由主义的偏见。<\/p>\n<p>C把选择性排斥思想改成了对学术研究的一般谨慎。<\/p>\n<p>D把被排斥思想的保守主义标签移到了教授本人的政策立场上。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n# 段落与全文逻辑框架\n**逻辑层次1：对AAAS报告的初步评价**（段落1核心观点） 表面肯定：报告肯定了人文和社会科学对美国自由民主的重要性（值得赞扬）// 深层批评：未能解决自由教育危机的真正本质（可能造成更多害处）\n\n↓（背景介绍）\n\n**逻辑层次2：报告的起源与构成**（段落2历史背景） 2010年：国会两党要求AAAS确定行动方案 → 目标：维持人文社科的国家卓越水平 → AAAS成立委员会：51名成员（大学校长、学者、各界精英）\n\n↓（报告内容）\n\n**逻辑层次3：报告的具体建议**（段落3正面内容） 基础目标：【支持全面识字 + 强调美国历史和政府学习 + 鼓励使用数字技术】→ 创新目标：【增加研究投资 + 制定连贯课程 + 增加教师资助 + 学者参与重大挑战】→ 国际化：【学习外语 + 国际事务 + 海外学习】\n\n//（转折批判）\n\n**逻辑层次4：报告的根本缺陷**（段落4核心批判） 未触及核心问题：顶尖大学自由教育的非自由本质 → 现实问题：【几十年来的毕业生不懂自由教育 → 被剥夺其好处】→ 本质变化：探究精神被进步主义宣传取代\n\n↓（具体表现）\n\n**逻辑层次5：当前教育的偏见现状**（段落5现状描述） 教授的双重标准：【进步主义解释 = 适当研究主题 // 保守/古典自由主义思想（自由市场、自力更生）= 超出合法研究边界】\n\n↓（总体评价）\n\n**逻辑层次6：报告的负面影响**（段落6最终判断） AAAS虽热情支持自由教育 // 但报告掩盖了问题的深度和广度 → 可能阻碍真正的改革\n\n↑（全文主旨）\n\n全文核心观点：AAAS的报告虽然在表面上支持自由教育，但由于未能认识到当前高等教育中自由教育已被进步主义意识形态劫持的本质问题，反而可能通过掩盖真相而阻碍必要的改革。\n\n## 小标题题\n\nRead the following five sections and choose the most suitable heading for each section from the list A–G. There are two extra headings which you do not need to use.\n\nA. Recognizing an old ideological problem\n\nB. Welcoming a report, but questioning its diagnosis\n\nC. Passing expertise from one generation to the next\n\nD. Praiseworthy goals and practical proposals\n\nE. A recent report that caused the campus crisis\n\nF. Creating a commission to sustain national excellence\n\nG. Campus practices that expose the report’s blind spot\n\n### 41. ______\n\n\"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences, deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America. Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.\n\n### 42. ______\n\nIn 2010, leading congressional Democrats and Republicans sent letters to the American Academy of Arts and Sciences asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"\n\nIn response, the American Academy formed the Commission on the Humanities and Social Sciences, with Duke University President Richard Brodhead and retired Exelon CEO John Rowe as co-chairmen. Among the commission's 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.\n\n### 43. ______\n\nThe goals identified in the report are generally admirable. Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.\n\nTo encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.\n\nOne of the more novel ideas in the report is the creation of a \"Culture Corps\" in cities and town across America to \"transmit humanistic and social scientific expertise from one generation to the next.\"\n\n### 44. ______\n\nUnfortunately, despite 2½ years in the making, \"The Heart of the Matter\" never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.\n\nThe commission ignores that for several decades America's colleges and universities have produced graduates who don't know the content and character of liberal education and are thus deprived of its benefits. Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for disseminating \"progressive,\" or left-liberal propaganda.\n\nWe know from the extensive documentation that William F. Buckley Jr. provided in his stellar critique of American academia, \"God and Man at Yale,\" first published in 1951, that this propagandizing extends back at least to the middle of the 20th century.\n\n### 45. ______\n\nToday, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas--such as free markets, self-reliance and a distrust of central planning--as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n\nMeanwhile, courses proliferate on highly specialized topics--Muslims in movies, gay and lesbian gardeners, the mathematical formalization of political decision making, for example--that closely correspond to professors' niche research interests but contribute little to students' grasp of the broad sweep of Western civilization and its literary, philosophical and religious masterpieces.\n\nThrough speech codes, endless seminars and workshops designed to teach students how to avoid \"offensive\" speech--and by handling sexual harassment and sexual-assault allegations with procedures that undermine the presumption of innocence--universities teach students to discount free speech and due process.\n\nThe American Academy of Arts and Sciences displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.","level":1,"context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h1>段落与全文逻辑框架<\/h1>\n<p><strong>逻辑层次1：对AAAS报告的初步评价<\/strong>（段落1核心观点） 表面肯定：报告肯定了人文和社会科学对美国自由民主的重要性（值得赞扬）// 深层批评：未能解决自由教育危机的真正本质（可能造成更多害处）<\/p>\n<p>↓（背景介绍）<\/p>\n<p><strong>逻辑层次2：报告的起源与构成<\/strong>（段落2历史背景） 2010年：国会两党要求AAAS确定行动方案 → 目标：维持人文社科的国家卓越水平 → AAAS成立委员会：51名成员（大学校长、学者、各界精英）<\/p>\n<p>↓（报告内容）<\/p>\n<p><strong>逻辑层次3：报告的具体建议<\/strong>（段落3正面内容） 基础目标：【支持全面识字 + 强调美国历史和政府学习 + 鼓励使用数字技术】→ 创新目标：【增加研究投资 + 制定连贯课程 + 增加教师资助 + 学者参与重大挑战】→ 国际化：【学习外语 + 国际事务 + 海外学习】<\/p>\n<p>//（转折批判）<\/p>\n<p><strong>逻辑层次4：报告的根本缺陷<\/strong>（段落4核心批判） 未触及核心问题：顶尖大学自由教育的非自由本质 → 现实问题：【几十年来的毕业生不懂自由教育 → 被剥夺其好处】→ 本质变化：探究精神被进步主义宣传取代<\/p>\n<p>↓（具体表现）<\/p>\n<p><strong>逻辑层次5：当前教育的偏见现状<\/strong>（段落5现状描述） 教授的双重标准：【进步主义解释 = 适当研究主题 // 保守/古典自由主义思想（自由市场、自力更生）= 超出合法研究边界】<\/p>\n<p>↓（总体评价）<\/p>\n<p><strong>逻辑层次6：报告的负面影响<\/strong>（段落6最终判断） AAAS虽热情支持自由教育 // 但报告掩盖了问题的深度和广度 → 可能阻碍真正的改革<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：AAAS的报告虽然在表面上支持自由教育，但由于未能认识到当前高等教育中自由教育已被进步主义意识形态劫持的本质问题，反而可能通过掩盖真相而阻碍必要的改革。<\/p>\n"},{"title":"小标题41题","raw":"## 小标题41题\n\n**答案：B. Welcoming a report, but questioning its diagnosis**  \n中文：肯定一份报告，却质疑它对问题的判断。\n\n这一部分在开篇划定作者的立场：报告支持人文与社会科学，这一点值得肯定；但它没有找准自由教育危机的根源，可能带来负面结果。\n\n关键转折是“Regrettably, however”。前面“deserves praise”说明赞许的具体理由，后面“failure to address the true nature of the crisis”才是作者对报告的主要保留。\n\n段内顺序是：报告肯定人文社科的重要性 → 承认这一点有价值 → 转向报告对危机的误判 → 预告可能造成的伤害。\n\nB的“Welcoming a report”对应开头的有限肯定，“questioning its diagnosis”对应没有触及危机真正本质。两个部分合起来才能保留这一段的先扬后抑。\n\nE也有“report”和“crisis”，但把关系改成“这份新报告造成了校园危机”。原文说报告没有处理已经存在的危机，可能造成更多害处；未能诊断问题不等于创造了问题。\n\n**41题选B。**","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p><strong>答案：B. Welcoming a report, but questioning its diagnosis<\/strong><br>中文：肯定一份报告，却质疑它对问题的判断。<\/p>\n<p>这一部分在开篇划定作者的立场：报告支持人文与社会科学，这一点值得肯定；但它没有找准自由教育危机的根源，可能带来负面结果。<\/p>\n<p>关键转折是“Regrettably, however”。前面“deserves praise”说明赞许的具体理由，后面“failure to address the true nature of the crisis”才是作者对报告的主要保留。<\/p>\n<p>段内顺序是：报告肯定人文社科的重要性 → 承认这一点有价值 → 转向报告对危机的误判 → 预告可能造成的伤害。<\/p>\n<p>B的“Welcoming a report”对应开头的有限肯定，“questioning its diagnosis”对应没有触及危机真正本质。两个部分合起来才能保留这一段的先扬后抑。<\/p>\n<p>E也有“report”和“crisis”，但把关系改成“这份新报告造成了校园危机”。原文说报告没有处理已经存在的危机，可能造成更多害处；未能诊断问题不等于创造了问题。<\/p>\n<p><strong>41题选B。<\/strong><\/p>\n"},{"title":"小标题42题","raw":"## 小标题42题\n\n**答案：F. Creating a commission to sustain national excellence**  \n中文：成立委员会以维持国家的卓越水平。\n\n这部分交代报告的来历：先有国会两党的委托，再有学术机构组建委员会。人员名单服务于这项背景说明。\n\n开头“In 2010”给出时间，“maintain national excellence”说明委托目的；下一段的“In response”把成立委员会接到这项要求上。\n\n推进过程是：国会要求找出可采取的行动 → 目标是维持人文社科研究和教育的卓越水平 → 学术机构作出回应 → 列出委员会的负责人和成员构成。\n\nF中的“Creating a commission”概括组织层面的回应，“to sustain national excellence”保留它承担的任务。题目不能只抓51人这个数字或某一位负责人。\n\nD说的是目标与具体建议，容易被这里的“national excellence”吸引。但本部分还没有展开识字、课程、研究投资等建议，主要回答的是谁发出委托、谁组织研究。\n\n**42题选F。**","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p><strong>答案：F. Creating a commission to sustain national excellence<\/strong><br>中文：成立委员会以维持国家的卓越水平。<\/p>\n<p>这部分交代报告的来历：先有国会两党的委托，再有学术机构组建委员会。人员名单服务于这项背景说明。<\/p>\n<p>开头“In 2010”给出时间，“maintain national excellence”说明委托目的；下一段的“In response”把成立委员会接到这项要求上。<\/p>\n<p>推进过程是：国会要求找出可采取的行动 → 目标是维持人文社科研究和教育的卓越水平 → 学术机构作出回应 → 列出委员会的负责人和成员构成。<\/p>\n<p>F中的“Creating a commission”概括组织层面的回应，“to sustain national excellence”保留它承担的任务。题目不能只抓51人这个数字或某一位负责人。<\/p>\n<p>D说的是目标与具体建议，容易被这里的“national excellence”吸引。但本部分还没有展开识字、课程、研究投资等建议，主要回答的是谁发出委托、谁组织研究。<\/p>\n<p><strong>42题选F。<\/strong><\/p>\n"},{"title":"小标题43题","raw":"## 小标题43题\n\n**答案：D. Praiseworthy goals and practical proposals**  \n中文：值得赞许的目标与具体建议。\n\n这部分集中介绍报告提出了哪些教育目标，以及为实现目标建议采取哪些行动。\n\n“The goals identified in the report are generally admirable”先作总体评价；“Because representative government presupposes an informed citizenry”引出公民教育，“To encourage innovation and competition”引出研究与课程投入，最后再补充Culture Corps。\n\n段内从识字、历史和政府知识出发，接着谈数字技术、研究资助、解决问题和沟通能力，再扩展到外语、国际事务、海外学习与代际知识传递。\n\nD的“Praiseworthy goals”对应“generally admirable”，而“practical proposals”覆盖报告提出的多组行动。它能统摄三个自然段，并保留作者在这里的正面评价。\n\nC的“Passing expertise from one generation to the next”几乎接上最后一句，却只对应Culture Corps这一项。把它当作整个部分的标题，会漏掉前面的公民素养、创新能力、教师资助与国际化建议。\n\n**43题选D。**","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p><strong>答案：D. Praiseworthy goals and practical proposals<\/strong><br>中文：值得赞许的目标与具体建议。<\/p>\n<p>这部分集中介绍报告提出了哪些教育目标，以及为实现目标建议采取哪些行动。<\/p>\n<p>“The goals identified in the report are generally admirable”先作总体评价；“Because representative government presupposes an informed citizenry”引出公民教育，“To encourage innovation and competition”引出研究与课程投入，最后再补充Culture Corps。<\/p>\n<p>段内从识字、历史和政府知识出发，接着谈数字技术、研究资助、解决问题和沟通能力，再扩展到外语、国际事务、海外学习与代际知识传递。<\/p>\n<p>D的“Praiseworthy goals”对应“generally admirable”，而“practical proposals”覆盖报告提出的多组行动。它能统摄三个自然段，并保留作者在这里的正面评价。<\/p>\n<p>C的“Passing expertise from one generation to the next”几乎接上最后一句，却只对应Culture Corps这一项。把它当作整个部分的标题，会漏掉前面的公民素养、创新能力、教师资助与国际化建议。<\/p>\n<p><strong>43题选D。<\/strong><\/p>\n"},{"title":"小标题44题","raw":"## 小标题44题\n\n**答案：A. Recognizing an old ideological problem**  \n中文：认识长期存在的意识形态问题。\n\n这部分从报告的建议转向它没有处理的根本问题：自由教育中的探究精神被意识形态宣传替代，而且这种现象已有长期历史。\n\n“Unfortunately”启动转折，“the illiberal nature of liberal education”点明问题；随后“for several decades”与“first published in 1951”把它放进几十年的时间范围。\n\n推进过程是：报告没有触及核心 → 毕业生不懂自由教育的内容与性质 → 学科被用作宣传工具 → 引入1951年出版的批评著作，说明问题并非刚刚出现。\n\nA的“ideological problem”对应进步主义或左翼自由主义宣传取代探究，“old”对应几十年与20世纪中叶的历史证据。标题的两部分都得到这一组段落支持。\n\nE也提到了校园危机，但它把新近报告写成危机的原因。1951年的证据正好排除了这一时间关系：报告面对的是旧问题，受到的批评是忽视它。\n\n**44题选A。**","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p><strong>答案：A. Recognizing an old ideological problem<\/strong><br>中文：认识长期存在的意识形态问题。<\/p>\n<p>这部分从报告的建议转向它没有处理的根本问题：自由教育中的探究精神被意识形态宣传替代，而且这种现象已有长期历史。<\/p>\n<p>“Unfortunately”启动转折，“the illiberal nature of liberal education”点明问题；随后“for several decades”与“first published in 1951”把它放进几十年的时间范围。<\/p>\n<p>推进过程是：报告没有触及核心 → 毕业生不懂自由教育的内容与性质 → 学科被用作宣传工具 → 引入1951年出版的批评著作，说明问题并非刚刚出现。<\/p>\n<p>A的“ideological problem”对应进步主义或左翼自由主义宣传取代探究，“old”对应几十年与20世纪中叶的历史证据。标题的两部分都得到这一组段落支持。<\/p>\n<p>E也提到了校园危机，但它把新近报告写成危机的原因。1951年的证据正好排除了这一时间关系：报告面对的是旧问题，受到的批评是忽视它。<\/p>\n<p><strong>44题选A。<\/strong><\/p>\n"},{"title":"小标题45题","raw":"## 小标题45题\n\n**答案：G. Campus practices that expose the report’s blind spot**  \n中文：揭示报告盲点的校园做法。\n\n这一部分列出当下校园中的具体做法，再收束到作者对报告的判断。它把此前抽象的“非自由”问题展开给读者看。\n\n“Today”引出教授对不同思想的双重标准；“Meanwhile”补充过度专门化的课程；“Through speech codes”转向言论与程序保障；末段的“Yet”回到报告可能妨碍改革。\n\n推进链是：思想受到区别对待 → 课程更多围绕教授的狭窄研究兴趣 → 学校做法削弱自由言论和正当程序 → 报告没有照亮这组问题的深度与广度。\n\nG的“Campus practices”覆盖前三个自然段的具体表现，“expose the report’s blind spot”接住最后一段的判断：报告热情支持自由教育，却掩盖了真正需要改革的地方。\n\nA也与思想偏见有关，但重心是问题长期存在的历史，不能统摄这里的课程、言论规则和程序保障。此处的时间入口是“Today”，重点是当下怎样做及报告漏看了什么。\n\n**45题选G。**","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p><strong>答案：G. Campus practices that expose the report’s blind spot<\/strong><br>中文：揭示报告盲点的校园做法。<\/p>\n<p>这一部分列出当下校园中的具体做法，再收束到作者对报告的判断。它把此前抽象的“非自由”问题展开给读者看。<\/p>\n<p>“Today”引出教授对不同思想的双重标准；“Meanwhile”补充过度专门化的课程；“Through speech codes”转向言论与程序保障；末段的“Yet”回到报告可能妨碍改革。<\/p>\n<p>推进链是：思想受到区别对待 → 课程更多围绕教授的狭窄研究兴趣 → 学校做法削弱自由言论和正当程序 → 报告没有照亮这组问题的深度与广度。<\/p>\n<p>G的“Campus practices”覆盖前三个自然段的具体表现，“expose the report’s blind spot”接住最后一段的判断：报告热情支持自由教育，却掩盖了真正需要改革的地方。<\/p>\n<p>A也与思想偏见有关，但重心是问题长期存在的历史，不能统摄这里的课程、言论规则和程序保障。此处的时间入口是“Today”，重点是当下怎样做及报告漏看了什么。<\/p>\n<p><strong>45题选G。<\/strong><\/p>\n"},{"title":"排序题 · 全局解析","raw":"## 排序题\n\nThe following paragraphs are given in a random order. Put them in the correct order. Paragraphs A, E and H have been placed for you.\n\n**A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H**\n\n### A\n\n“The Heart of the Matter,” a report by the American Academy of Arts and Sciences, deserves praise for affirming the importance of the humanities and social sciences to American democracy. Its failure to address the true nature of the crisis facing liberal education, however, may cause more harm than good.\n\n### B\n\nThat illiberal character has deprived generations of graduates of the benefits of liberal education. The spirit of inquiry has been replaced by the use of the humanities and social sciences as vehicles for progressive or left-liberal propaganda. Documentation in William F. Buckley Jr.’s “God and Man at Yale,” first published in 1951, traces this propagandizing back at least to the middle of the twentieth century.\n\n### C\n\nThe commission’s recommendations are generally admirable. They support literacy, the study of history and government, digital technologies, greater investment in research and better curricula. They also encourage foreign-language study and propose a Culture Corps to pass humanistic and social scientific expertise from one generation to the next.\n\n### D\n\nBeyond this exclusion of conservative and classical liberal ideas, highly specialized courses reflect professors’ narrow research interests but contribute little to students’ understanding of Western civilization and its major works. Speech codes and procedures that undermine the presumption of innocence also teach students to discount free speech and due process.\n\n### E\n\nUnfortunately, despite 2½ years in the making, the report never gets to the heart of the matter: the illiberal nature of liberal education at leading colleges and universities.\n\n### F\n\nThe report originated in a request made in 2010 by leading congressional Democrats and Republicans. They asked the academy to identify actions that would maintain national excellence in humanities and social science education. In response, the academy formed a commission of 51 members, including university presidents, scholars and other prominent figures.\n\n### G\n\nThat older pattern persists today: professors treat progressive interpretations of history and public policy as proper subjects of study while presenting conservative or classical liberal ideas, such as free markets and self-reliance, as outside the boundaries of routine, and sometimes legitimate, intellectual investigation.\n\n### H\n\nThese problems make the academy’s enthusiasm for liberal education insufficient. By obscuring the depth and breadth of the challenge Congress asked it to illuminate, the report may set back the very reform that is needed.\n\n## 排序题全局解析\n\n先把A—H各段的功能放在一起：\n\n| 段落 | 主要功能 |\n| --- | --- |\n| A | 开篇先肯定报告支持人文社科，再指出其诊断可能失准。 |\n| B | 解释“非自由”的含义，并用1951年的著作说明问题由来已久。 |\n| C | 接过委员会这一主体，介绍报告中的具体建议。 |\n| D | 承接保守和古典自由主义思想受到排斥，补充课程安排以及言论和程序保障的问题。 |\n| E | 从值得肯定的建议转入报告没有触及的核心缺陷。 |\n| F | 回溯国会委托和委员会成立，说明报告怎样产生。 |\n| G | 把历史中的宣传模式接到今天教授对不同思想的区别对待。 |\n| H | 汇总这组校园问题，回到报告可能阻碍改革的判断。 |\n\n全文推进链：开篇评价报告 → 交代国会委托与委员会成立 → 展开委员会建议 → 转折指出根本缺陷 → 解释缺陷并追溯历史 → 查看今天的思想偏见 → 补充课程和制度表现 → 回到对报告的总体判断。\n\nA、E、H分别固定在第1、4、8个位置。A后的背景段必须先介绍委员会，具体建议才能接着出现；E之后先解释问题的历史，再接今天的表现，最后由H收束这些问题。\n\n**完整顺序：A → F → C → E → B → G → D → H。**\n\n**41—45：F、C、B、G、D。**","level":2,"context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<h2>排序题全局解析<\/h2>\n<p>先把A—H各段的功能放在一起：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>主要功能<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>开篇先肯定报告支持人文社科，再指出其诊断可能失准。<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>解释“非自由”的含义，并用1951年的著作说明问题由来已久。<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>接过委员会这一主体，介绍报告中的具体建议。<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>承接保守和古典自由主义思想受到排斥，补充课程安排以及言论和程序保障的问题。<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>从值得肯定的建议转入报告没有触及的核心缺陷。<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>回溯国会委托和委员会成立，说明报告怎样产生。<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>把历史中的宣传模式接到今天教授对不同思想的区别对待。<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>汇总这组校园问题，回到报告可能阻碍改革的判断。<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：开篇评价报告 → 交代国会委托与委员会成立 → 展开委员会建议 → 转折指出根本缺陷 → 解释缺陷并追溯历史 → 查看今天的思想偏见 → 补充课程和制度表现 → 回到对报告的总体判断。<\/p>\n<p>A、E、H分别固定在第1、4、8个位置。A后的背景段必须先介绍委员会，具体建议才能接着出现；E之后先解释问题的历史，再接今天的表现，最后由H收束这些问题。<\/p>\n<p><strong>完整顺序：A → F → C → E → B → G → D → H。<\/strong><\/p>\n<p><strong>41—45：F、C、B、G、D。<\/strong><\/p>\n"},{"title":"排序41题","raw":"## 排序41题\n\n当前空位在A之后、42题之前；前半部分以固定段E的“Unfortunately”收束为转折。\n\nA末尾说报告没有处理危机本质。F开头“The report originated in a request”继续同一份报告，同时切换到它的产生背景；F末尾第一次介绍“a commission of 51 members”。后面的C开头则是“The commission’s recommendations”。\n\n这形成双向承接：A先让读者认识报告，F解释报告源于什么委托并引入委员会，C才有明确的主体可以介绍其建议。“The commission”不能在尚未介绍委员会时直接出现。\n\n局部推进链是：A评价报告 → F回溯国会委托、委员会成立 → C介绍该委员会的建议。\n\nC是较强候选，因为它也谈报告的正面内容；但把它放在41题，会让委员会无来源地先出现，随后再用F倒退补背景，还会打断C与E之间的肯定—转折关系。\n\n**41题选F。**","level":2,"context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p>当前空位在A之后、42题之前；前半部分以固定段E的“Unfortunately”收束为转折。<\/p>\n<p>A末尾说报告没有处理危机本质。F开头“The report originated in a request”继续同一份报告，同时切换到它的产生背景；F末尾第一次介绍“a commission of 51 members”。后面的C开头则是“The commission’s recommendations”。<\/p>\n<p>这形成双向承接：A先让读者认识报告，F解释报告源于什么委托并引入委员会，C才有明确的主体可以介绍其建议。“The commission”不能在尚未介绍委员会时直接出现。<\/p>\n<p>局部推进链是：A评价报告 → F回溯国会委托、委员会成立 → C介绍该委员会的建议。<\/p>\n<p>C是较强候选，因为它也谈报告的正面内容；但把它放在41题，会让委员会无来源地先出现，随后再用F倒退补背景，还会打断C与E之间的肯定—转折关系。<\/p>\n<p><strong>41题选F。<\/strong><\/p>\n"},{"title":"排序42题","raw":"## 排序42题\n\n当前空位位于41题确定的F之后、固定段E之前。\n\nF末尾成立委员会；C首句“The commission’s recommendations are generally admirable”立刻接过同一个组织。C末尾仍在列举Culture Corps等建议，E首词“Unfortunately”随即转向报告没有触及的核心问题。\n\n前端靠主体复现衔接，后端靠评价转折衔接：先有负责研究的委员会，再看其建议为什么值得肯定，接着才谈这些建议为什么仍未解决根本缺陷。\n\n局部推进链是：F说明谁提出报告 → C展开可取建议 → E指出报告遗漏的实质问题。\n\nB同样解释教育问题，但它以“That illiberal character”开头，必须先让E提出“the illiberal nature”。此处如果填B，既找不到这个指代的近处来源，也会让E再重复开启一次本应已经展开的批评。\n\n**42题选C。**","level":2,"context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p>当前空位位于41题确定的F之后、固定段E之前。<\/p>\n<p>F末尾成立委员会；C首句“The commission’s recommendations are generally admirable”立刻接过同一个组织。C末尾仍在列举Culture Corps等建议，E首词“Unfortunately”随即转向报告没有触及的核心问题。<\/p>\n<p>前端靠主体复现衔接，后端靠评价转折衔接：先有负责研究的委员会，再看其建议为什么值得肯定，接着才谈这些建议为什么仍未解决根本缺陷。<\/p>\n<p>局部推进链是：F说明谁提出报告 → C展开可取建议 → E指出报告遗漏的实质问题。<\/p>\n<p>B同样解释教育问题，但它以“That illiberal character”开头，必须先让E提出“the illiberal nature”。此处如果填B，既找不到这个指代的近处来源，也会让E再重复开启一次本应已经展开的批评。<\/p>\n<p><strong>42题选C。<\/strong><\/p>\n"},{"title":"排序43题","raw":"## 排序43题\n\n当前空位紧跟固定段E，后面还有44、45题，最终进入固定结尾H。\n\nE末尾点出“the illiberal nature of liberal education”。B首句“That illiberal character”接着解释这种性质怎样剥夺学生的教育收益，并进一步指出宣传替代探究。B末尾把问题追溯到1951年的著作和20世纪中叶；G开头“That older pattern persists today”正好承接这条历史线。\n\nB的开头需要E提供指代对象，结尾又为G提供“older pattern”的时间依据，所以它连接的是“核心缺陷”与“当下表现”两个层次。D开头回指的是对保守和古典自由主义思想的排斥，这个具体对象尚未在B里展开，需要先由G说清。\n\n局部推进链是：E命名问题 → B解释问题并确认其历史 → G说明同一模式延续到今天。\n\nG看起来也能举出“非自由”的例子，但若直接接E，开头的“older pattern”缺少已经展开的旧模式；更重要的是，B的1951年证据会被放到“今天”之后，割断这里明确的历史—现在承接。\n\n**43题选B。**","level":2,"context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p>当前空位紧跟固定段E，后面还有44、45题，最终进入固定结尾H。<\/p>\n<p>E末尾点出“the illiberal nature of liberal education”。B首句“That illiberal character”接着解释这种性质怎样剥夺学生的教育收益，并进一步指出宣传替代探究。B末尾把问题追溯到1951年的著作和20世纪中叶；G开头“That older pattern persists today”正好承接这条历史线。<\/p>\n<p>B的开头需要E提供指代对象，结尾又为G提供“older pattern”的时间依据，所以它连接的是“核心缺陷”与“当下表现”两个层次。D开头回指的是对保守和古典自由主义思想的排斥，这个具体对象尚未在B里展开，需要先由G说清。<\/p>\n<p>局部推进链是：E命名问题 → B解释问题并确认其历史 → G说明同一模式延续到今天。<\/p>\n<p>G看起来也能举出“非自由”的例子，但若直接接E，开头的“older pattern”缺少已经展开的旧模式；更重要的是，B的1951年证据会被放到“今天”之后，割断这里明确的历史—现在承接。<\/p>\n<p><strong>43题选B。<\/strong><\/p>\n"},{"title":"排序44题","raw":"## 排序44题\n\n当前空位位于43题确定的B之后，45题之前，随后由H作总评。\n\nB末尾写到“first published in 1951”和“the middle of the twentieth century”。G以“That older pattern persists today”接住过去，再具体说明教授如何优待进步主义解释、排斥保守或古典自由主义思想。D开头“Beyond this exclusion of conservative and classical liberal ideas”则回指G刚刚指出的具体排斥对象。\n\n前端是“旧模式仍延续到今天”的时间承接，后端是“除了对这些思想的排斥，还有其他校园问题”的扩展。G既接住B的历史，又先把D中“this exclusion”的对象说明白。\n\n局部推进链是：B确认旧模式 → G呈现今天的思想偏见 → D补充课程和校园制度的问题。\n\nD也是当下校园问题，B中“宣传取代探究”也能概括为思想偏见；但D回指的是具体的“this exclusion of conservative and classical liberal ideas”。B还没有指出这两类思想受到排斥，G才把这件事写出来。因此这里先放G，D的“this exclusion”才有具体来源，再由“Beyond”扩展到课程和制度。\n\n**44题选G。**","level":2,"context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p>当前空位位于43题确定的B之后，45题之前，随后由H作总评。<\/p>\n<p>B末尾写到“first published in 1951”和“the middle of the twentieth century”。G以“That older pattern persists today”接住过去，再具体说明教授如何优待进步主义解释、排斥保守或古典自由主义思想。D开头“Beyond this exclusion of conservative and classical liberal ideas”则回指G刚刚指出的具体排斥对象。<\/p>\n<p>前端是“旧模式仍延续到今天”的时间承接，后端是“除了对这些思想的排斥，还有其他校园问题”的扩展。G既接住B的历史，又先把D中“this exclusion”的对象说明白。<\/p>\n<p>局部推进链是：B确认旧模式 → G呈现今天的思想偏见 → D补充课程和校园制度的问题。<\/p>\n<p>D也是当下校园问题，B中“宣传取代探究”也能概括为思想偏见；但D回指的是具体的“this exclusion of conservative and classical liberal ideas”。B还没有指出这两类思想受到排斥，G才把这件事写出来。因此这里先放G，D的“this exclusion”才有具体来源，再由“Beyond”扩展到课程和制度。<\/p>\n<p><strong>44题选G。<\/strong><\/p>\n"},{"title":"排序45题","raw":"## 排序45题\n\n当前空位在44题确定的G之后、固定结尾H之前，是论证收束前最后一组具体表现。\n\nG末尾说，保守或古典自由主义思想被描绘成不属于常规的、有时甚至不属于正当的智力探究范围。D以“Beyond this exclusion of conservative and classical liberal ideas”接住这项具体排斥，再补充课程围绕狭窄研究兴趣、言论规范及某些程序削弱自由言论和正当程序的问题。H以“These problems”概括的正是这一整组校园问题。\n\n前端是同一组思想及其受排斥状态的复现，后端是多个具体问题被复数指代概括。D把批评从研究哪些思想扩展到课程怎样安排、校园怎样运作，使H的“depth and breadth”有具体内容。G中的“sometimes”限定了程度：作者说有时连正当性都被否认，并非每一次排斥都达到这个程度。\n\n局部推进链是：G说明思想的区别对待 → D补全课程与制度表现 → H评价报告遗漏这些问题的后果。\n\nC也有课程建议，但它在介绍报告希望怎样改善教育，方向是肯定建议；H的“These problems”需要已经呈现的现实弊端，不能把C中的积极建议直接当成那些弊端。\n\n**45题选D。**","level":2,"context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{"kind":"standard"},"section":"第四鸟 · 新题型","html":"<p>当前空位在44题确定的G之后、固定结尾H之前，是论证收束前最后一组具体表现。<\/p>\n<p>G末尾说，保守或古典自由主义思想被描绘成不属于常规的、有时甚至不属于正当的智力探究范围。D以“Beyond this exclusion of conservative and classical liberal ideas”接住这项具体排斥，再补充课程围绕狭窄研究兴趣、言论规范及某些程序削弱自由言论和正当程序的问题。H以“These problems”概括的正是这一整组校园问题。<\/p>\n<p>前端是同一组思想及其受排斥状态的复现，后端是多个具体问题被复数指代概括。D把批评从研究哪些思想扩展到课程怎样安排、校园怎样运作，使H的“depth and breadth”有具体内容。G中的“sometimes”限定了程度：作者说有时连正当性都被否认，并非每一次排斥都达到这个程度。<\/p>\n<p>局部推进链是：G说明思想的区别对待 → D补全课程与制度表现 → H评价报告遗漏这些问题的后果。<\/p>\n<p>C也有课程建议，但它在介绍报告希望怎样改善教育，方向是肯定建议；H的“These problems”需要已经呈现的现实弊端，不能把C中的积极建议直接当成那些弊端。<\/p>\n<p><strong>45题选D。<\/strong><\/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"section":"第五鸟 · 写作积累","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **well-rounded education** | **全面发展的教育** | **文明｜教育发展** | **宏观主题** |\n| a spirit of inquiry | 探究精神 | 文明｜文化素养 | 个人主题 |\n| **critical thinking** | **批判性思维** | **文明｜文化素养** | **个人主题** |\n| openness to different ideas | 对不同观点的开放态度 | 友善｜尊重他人 | 个人主题 |\n| humanistic literacy | 人文素养 | 文明｜文化素养 | 个人主题 |\n| innovation | 创新 | 富强｜创新发展 | 宏观主题 |\n| problem-solving ability | 解决问题的能力 | 敬业｜能力提升 | 个人主题 |\n| effective communication | 有效沟通 | 和谐｜人际沟通 | 个人主题 |\n| **international understanding** | **国际理解** | **和谐｜交流合作** | **宏观主题** |\n| lifelong learning | 终身学习 | 文明｜教育发展 | 个人主题 |\n| the practical application of knowledge | 知识的实践应用 | 敬业｜知行合一 | 个人主题 |\n| educational reform | 教育改革 | 文明｜教育发展 | 宏观主题 |","context":{"focus":[0,0,1080,6116],"mode":"image","asset":"articleAnnotated","sourceW":1080,"sourceH":6116,"label":"从阅读中积累写作表达","includeTitle":true},"meta":{"bird":5,"part":1},"html":"<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>well-rounded education<\/strong><\/td>\n<td><strong>全面发展的教育<\/strong><\/td>\n<td><strong>文明｜教育发展<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>a spirit of inquiry<\/td>\n<td>探究精神<\/td>\n<td>文明｜文化素养<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>critical thinking<\/strong><\/td>\n<td><strong>批判性思维<\/strong><\/td>\n<td><strong>文明｜文化素养<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>openness to different ideas<\/td>\n<td>对不同观点的开放态度<\/td>\n<td>友善｜尊重他人<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>humanistic literacy<\/td>\n<td>人文素养<\/td>\n<td>文明｜文化素养<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>innovation<\/td>\n<td>创新<\/td>\n<td>富强｜创新发展<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>problem-solving ability<\/td>\n<td>解决问题的能力<\/td>\n<td>敬业｜能力提升<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>effective communication<\/td>\n<td>有效沟通<\/td>\n<td>和谐｜人际沟通<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>international understanding<\/strong><\/td>\n<td><strong>国际理解<\/strong><\/td>\n<td><strong>和谐｜交流合作<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>lifelong learning<\/td>\n<td>终身学习<\/td>\n<td>文明｜教育发展<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>the practical application of knowledge<\/td>\n<td>知识的实践应用<\/td>\n<td>敬业｜知行合一<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>educational reform<\/td>\n<td>教育改革<\/td>\n<td>文明｜教育发展<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"section":"第五鸟 · 写作积累","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture highlights the importance of A to B.** | **图画突出了A对B的重要性。** |\n| 图画题 | A is using X to improve the ability to solve problems. | A正在利用X提高解决问题的能力。 |\n| 图画题 | A displays great enthusiasm for X. | A对X表现出极大的热情。 |\n| 图画题 | The scene shows A and B communicating effectively despite their differences. | 画面展示了A和B尽管存在差异，仍在有效沟通。 |\n| **图表题** | **The chart shows increased investment in A over the period.** | **图表显示，在这段时间内对A的投资有所增加。** |\n| 图表题 | Funding for A increased from X to Y. | 用于A的资金从X增加到Y。 |\n| 图表题 | The figures reveal an expansion in the number of A. | 这些数据表明，A的数量有所增长。 |\n| 图表题 | The chart shows growing use of A among B. | 图表显示，在B群体中A的使用日益增多。 |\n| **文本评论题** | **The report affirms the importance of A and calls for greater support for it.** | **报告肯定了A的重要性，并呼吁给予更多支持。** |\n| 文本评论题 | The passage stresses the need to bring knowledge to bear on practical challenges. | 短文强调，需要运用知识应对现实挑战。 |\n| 文本评论题 | The author argues that A fails to address the true nature of B. | 作者认为，A未能触及B的真正本质。 |\n| 文本评论题 | The passage warns that ignoring A may set back progress in B. | 短文提醒，忽视A可能阻碍B方面的进展。 |","context":{"focus":[0,0,1080,6116],"mode":"image","asset":"articleAnnotated","sourceW":1080,"sourceH":6116,"label":"从阅读中积累写作表达","includeTitle":true},"meta":{"bird":5,"part":2},"html":"<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>The picture highlights the importance of A to B.<\/strong><\/td>\n<td><strong>图画突出了A对B的重要性。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A is using X to improve the ability to solve problems.<\/td>\n<td>A正在利用X提高解决问题的能力。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A displays great enthusiasm for X.<\/td>\n<td>A对X表现出极大的热情。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The scene shows A and B communicating effectively despite their differences.<\/td>\n<td>画面展示了A和B尽管存在差异，仍在有效沟通。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart shows increased investment in A over the period.<\/strong><\/td>\n<td><strong>图表显示，在这段时间内对A的投资有所增加。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>Funding for A increased from X to Y.<\/td>\n<td>用于A的资金从X增加到Y。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The figures reveal an expansion in the number of A.<\/td>\n<td>这些数据表明，A的数量有所增长。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart shows growing use of A among B.<\/td>\n<td>图表显示，在B群体中A的使用日益增多。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The report affirms the importance of A and calls for greater support for it.<\/strong><\/td>\n<td><strong>报告肯定了A的重要性，并呼吁给予更多支持。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage stresses the need to bring knowledge to bear on practical challenges.<\/td>\n<td>短文强调，需要运用知识应对现实挑战。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The author argues that A fails to address the true nature of B.<\/td>\n<td>作者认为，A未能触及B的真正本质。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage warns that ignoring A may set back progress in B.<\/td>\n<td>短文提醒，忽视A可能阻 const NEWTYPE={"smallTitle":"<div class=\"newtypePaper\"><h2>小标题题<\/h2><p>Read the following five sections and choose the most suitable heading for each section from A–G. There are two extra headings.<\/p><div class=\"newtype-options\"><p><b>A.<\/b> Recognizing an old ideological problem<\/p><p><b>B.<\/b> Welcoming a report, but questioning its diagnosis<\/p><p><b>C.<\/b> Passing expertise from one generation to the next<\/p><p><b>D.<\/b> Praiseworthy goals and practical proposals<\/p><p><b>E.<\/b> A recent report that caused the campus crisis<\/p><p><b>F.<\/b> Creating a commission to sustain national excellence<\/p><p><b>G.<\/b> Campus practices that expose the report’s blind spot<\/p><\/div><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. ______<\/h3><p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences, deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America. Regrettably, however, the report&#x27;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. ______<\/h3><p>In 2010, leading congressional Democrats and Republicans sent letters to the American Academy of Arts and Sciences asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p><p>In response, the American Academy formed the Commission on the Humanities and Social Sciences, with Duke University President Richard Brodhead and retired Exelon CEO John Rowe as co-chairmen. Among the commission&#x27;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. ______<\/h3><p>The goals identified in the report are generally admirable. Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p><p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#x27; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p><p>One of the more novel ideas in the report is the creation of a &quot;Culture Corps&quot; in cities and town across America to &quot;transmit humanistic and social scientific expertise from one generation to the next.&quot;<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. ______<\/h3><p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p><p>The commission ignores that for several decades America&#x27;s colleges and universities have produced graduates who don&#x27;t know the content and character of liberal education and are thus deprived of its benefits. Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for disseminating &quot;progressive,&quot; or left-liberal propaganda.<\/p><p>We know from the extensive documentation that William F. Buckley Jr. provided in his stellar critique of American academia, &quot;God and Man at Yale,&quot; first published in 1951, that this propagandizing extends back at least to the middle of the 20th century.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. ______<\/h3><p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas--such as free markets, self-reliance and a distrust of central planning--as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p><p>Meanwhile, courses proliferate on highly specialized topics--Muslims in movies, gay and lesbian gardeners, the mathematical formalization of political decision making, for example--that closely correspond to professors&#x27; niche research interests but contribute little to students&#x27; grasp of the broad sweep of Western civilization and its literary, philosophical and religious masterpieces.<\/p><p>Through speech codes, endless seminars and workshops designed to teach students how to avoid &quot;offensive&quot; speech--and by handling sexual harassment and sexual-assault allegations with procedures that undermine the presumption of innocence--universities teach students to discount free speech and due process.<\/p><p>The American Academy of Arts and Sciences displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p><\/section><\/div>","sorting":"<div class=\"newtypePaper\"><h2>排序题<\/h2><p>Put the paragraphs in the correct order. Paragraphs A, E and H have been placed for you.<\/p><p><b>A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H<\/b><\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A<\/h3><p>“The Heart of the Matter,” a report by the American Academy of Arts and Sciences, deserves praise for affirming the importance of the humanities and social sciences to American democracy. Its failure to address the true nature of the crisis facing liberal education, however, may cause more harm than good.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B<\/h3><p>That illiberal character has deprived generations of graduates of the benefits of liberal education. The spirit of inquiry has been replaced by the use of the humanities and social sciences as vehicles for progressive or left-liberal propaganda. Documentation in William F. Buckley Jr.’s “God and Man at Yale,” first published in 1951, traces this propagandizing back at least to the middle of the twentieth century.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C<\/h3><p>The commission’s recommendations are generally admirable. They support literacy, the study of history and government, digital technologies, greater investment in research and better curricula. They also encourage foreign-language study and propose a Culture Corps to pass humanistic and social scientific expertise from one generation to the next.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D<\/h3><p>Beyond this exclusion of conservative and classical liberal ideas, highly specialized courses reflect professors’ narrow research interests but contribute little to students’ understanding of Western civilization and its major works. Speech codes and procedures that undermine the presumption of innocence also teach students to discount free speech and due process.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E<\/h3><p>Unfortunately, despite 2½ years in the making, the report never gets to the heart of the matter: the illiberal nature of liberal education at leading colleges and universities.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F<\/h3><p>The report originated in a request made in 2010 by leading congressional Democrats and Republicans. They asked the academy to identify actions that would maintain national excellence in humanities and social science education. In response, the academy formed a commission of 51 members, including university presidents, scholars and other prominent figures.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G<\/h3><p>That older pattern persists today: professors treat progressive interpretations of history and public policy as proper subjects of study while presenting conservative or classical liberal ideas, such as free markets and self-reliance, as outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H<\/h3><p>These problems make the academy’s enthusiasm for liberal education insufficient. By obscuring the depth and breadth of the challenge Congress asked it to illuminate, the report may set back the very reform that is needed.<\/p><\/section><\/div>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>matter<\/td>\n<td>n. 问题<\/td>\n<td>just-released report<\/td>\n<td>n. 刚发布的报告<\/td>\n<td>American Academy of Arts and Sciences<\/td>\n<td>n. 美国艺术与科学院<\/td>\n<\/tr>\n<tr>\n<td>deserve praise<\/td>\n<td>值得赞扬<\/td>\n<td>affirm<\/td>\n<td>v. 肯定<\/td>\n<td>importance<\/td>\n<td>n. 重要性<\/td>\n<\/tr>\n<tr>\n<td>humanities<\/td>\n<td>n. 人文学科<\/td>\n<td>social sciences<\/td>\n<td>n. 社会科学<\/td>\n<td>prosperity<\/td>\n<td>n. 繁荣<\/td>\n<\/tr>\n<tr>\n<td>security<\/td>\n<td>n. 安全<\/td>\n<td>liberal democracy<\/td>\n<td>n. 自由民主<\/td>\n<td>America<\/td>\n<td>n. 美国<\/td>\n<\/tr>\n<tr>\n<td>regrettably<\/td>\n<td>ad. 遗憾的是<\/td>\n<td>however<\/td>\n<td>ad. 然而<\/td>\n<td>report<\/td>\n<td>n. 报告<\/td>\n<\/tr>\n<tr>\n<td>failure<\/td>\n<td>n. 未能做到；失败<\/td>\n<td>address<\/ n<td>n. 自力更生<\/td>\n<td>fall outside<\/td>\n<td>落在……之外<\/td>\n<td>boundary<\/td>\n<td>n. 界限<\/td>\n<\/tr>\n<tr>\n<td>routine<\/td>\n<td>a. 常规的<\/td>\n<td>legitimate<\/td>\n<td>a. 正当的<\/td>\n<td>intellectual investigation<\/td>\n<td>n. 学术探究<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h1>第6段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>display<\/td>\n<td>v. 表现出<\/td>\n<td>enthusiasm<\/td>\n<td>n. 热情<\/td>\n<td>liberal education<\/td>\n<td>n. 自由教育；博雅教育<\/td>\n<\/tr>\n<tr>\n<td>set back<\/td>\n<td>阻碍<\/td>\n<td>reform<\/td>\n<td>n. 改革<\/td>\n<td>obscure<\/td>\n<td>v. 掩盖<\/td>\n<\/tr>\n<tr>\n<td>depth<\/td>\n<td>n. 深度<\/td>\n<td>breadth<\/td>\n<td>n. 广度<\/td>\n<td>challenge<\/td>\n<td>n. 挑战<\/td>\n<\/tr>\n<tr>\n<td>Congress<\/td>\n<td>n. 国会<\/td>\n<td>illuminate<\/td>\n<td>v. 阐明<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h1>\n<h2>逐句逐段分析<\/h2>\n<h2>第1段<\/h2>\n<h3>完整原文 · 第1段<\/h3>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America. Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<h3>意群划分 · 第1段<\/h3>\n<p>&quot;The Heart of the Matter,&quot; / the just-released report / by the American Academy of Arts and Sciences (AAAS), / deserves praise / for affirming the importance / of the humanities and social sciences / to the prosperity and security / of liberal democracy / in America.<\/p>\n<p>Regrettably, however, / the report&#39;s failure / to address the true nature / of the crisis / facing liberal education / may cause more harm than good.<\/p>\n<h3>意群翻译 · 第1段<\/h3>\n<p>&quot;问题的核心&quot;，/ 刚刚发布的报告 / 由美国艺术与科学院（AAAS），/ 值得赞扬 / 因为肯定了重要性 / 人文和社会科学的 / 对繁荣和安全 / 自由民主的 / 在美国。<\/p>\n<p>遗憾的是，然而，/ 该报告的失败 / 在解决真正本质方面 / 危机的 / 面临自由教育的 / 可能造成更多害处而非益处。<\/p>\n<h3>标准译文 · 第1段<\/h3>\n<p>美国艺术与科学院（AAAS）刚刚发布的报告《问题的核心》值得赞扬，因为它肯定了人文和社会科学对美国自由民主的繁荣和安全的重要性。然而遗憾的是，该报告未能解决自由教育所面临危机的真正本质，这可能造成更多害处而非益处。<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot; In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>In 2010, / leading congressional Democrats and Republicans / sent letters to the AAAS / asking that it identify actions / that could be taken / by &quot;federal, state and local governments, / universities, foundations, educators, / individual benefactors and others&quot; / to &quot;maintain national excellence / in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, / the American Academy / formed the Commission / on the Humanities and Social Sciences.<\/p>\n<p>Among the commission&#39;s 51 members / are top-tier-university presidents, / scholars, lawyers, judges, / and business executives, / as well as prominent figures / from diplomacy, filmmaking, / music and journalism.<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>在2010年，/ 主要的国会民主党人和共和党人 / 致信AAAS / 要求它确定行动 / 可以被采取的 / 由&quot;联邦、州和地方政府，/ 大学、基金会、教育工作者，/ 个人捐助者和其他人&quot; / 来&quot;维持国家卓越 / 在人文和社会科学学术和教育方面。&quot;<\/p>\n<p>作为回应，/ 美国学院 / 成立了委员会 / 关于人文和社会科学的。<\/p>\n<p>在委员会的51名成员中 / 有顶级大学校长，/ 学者、律师、法官，/ 和商业高管，/ 以及杰出人物 / 来自外交、电影制作，/ 音乐和新闻界。<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>2010年，主要的国会民主党人和共和党人致信AAAS，要求其确定联邦、州和地方政府、大学、基金会、教育工作者、个人捐助者和其他人可以采取的行动，以&quot;维持人文和社会科学学术和教育方面的国家卓越水平&quot;。作为回应，美国学院成立了人文和社会科学委员会。委员会的51名成员包括顶级大学校长、学者、律师、法官和商业高管，以及来自外交、电影制作、音乐和新闻界的杰出人物。<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>The goals identified in the report are generally admirable. Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies. To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>The goals identified in the report / are generally admirable.<\/p>\n<p>Because representative government / presupposes an informed citizenry, / the report supports full literacy; / stresses the study / of history and government, / particularly American history / and American government; / and encourages the use / of new digital technologies.<\/p>\n<p>To encourage innovation and competition, / the report calls for / increased investment in research, / the crafting of coherent curricula / that improve students&#39; ability / to solve problems / and communicate effectively / in the 21st century, / increased funding for teachers / and the encouragement of scholars / to bring their learning to bear / on the great challenges of the day.<\/p>\n<p>The report also advocates / greater study of foreign languages, / international affairs / and the expansion / o
