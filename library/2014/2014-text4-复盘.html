和标准。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>前段说探究被宣传取代，第5段用教授认可一类思想、排斥另一类思想来说明这种变化。<\/p>\n<\/blockquote>\n<p>实际文章沿着学术开放性受损往下写，没有转而赞扬教授在证据不足时保持谨慎。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors approach intellectual investigation cautiously and avoid conclusions until they have sufficient evidence.<\/p>\n<p>教授谨慎进行学术研究，在证据充分以前避免作出结论。<\/p>\n<\/blockquote>\n<p>C所需的是研究过程中的审慎表现。实际原文并未说明这类行为，而是在比较思想的准入标准；不能把“划出研究边界”自动美化为谨慎。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>作者应说明教授怎样使博雅教育失去开放性，而非仅仅描述研究过程中的审慎；第5段具体给出的表现是选择性排斥某类思想。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>cautious about intellectual investigation<br>对学术研究持谨慎态度<\/p>\n<\/blockquote>\n<p>C把一般谨慎作为教授的特点，不能解释主旨中的“不自由”如何在这一段体现。局部的<code>proper subject<\/code>与<code>outside the boundaries<\/code>对照指向偏向性的取舍，不是证据核实或慎下结论。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. conservative about public policy<\/h3>\n<blockquote>\n<p>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文的<code>progressive public policy<\/code>和<code>conservative or classical liberal ideas<\/code>也可读。做题时看到教授将前者视为适当研究对象、把后者排除，认为D写错了方向，所以第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了<code>public policy<\/code>和<code>conservative<\/code>，却改变两者在句中的归属。原文的保守主义修饰被排除的思想，不是在给教授本人下政策立场的定义；被教授视为适当研究对象的政策则是进步主义公共政策。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们在公共政策上持保守立场。<\/p>\n<\/blockquote>\n<p><code>public policy<\/code>在原文由<code>progressive<\/code>修饰；<code>conservative<\/code>出现在<code>while<\/code>后面，修饰被描绘为研究边界之外的思想。要把两个词各自接回所属部分。<\/p>\n<p>教授作为主语，对进步主义政策和保守主义思想分别作出不同的学术评价。原句的<code>conservative<\/code>不是教授的表语，不能直接搬过去说教授在政策上保守。<\/p>\n<p>把某一政策当作研究对象也不等于赞成那一政策的全部主张，所以不能据此替教授补一套完整政治立场。这里可以判断的是研究标准偏向进步主义、排斥保守主义和古典自由主义。<\/p>\n<p>D把被排斥思想的性质改成教授本人的政策立场，原文并不支持这个移接。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>教授把进步主义公共政策视作适当研究对象，却将保守主义或古典自由主义思想排除在研究边界外。<\/p>\n<\/blockquote>\n<p>实际段落在展示学术取舍的偏向，并未从研究范围转到教授本人如何制定或支持具体公共政策。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors take a conservative stance on public policy.<\/p>\n<p>教授在公共政策上采取保守立场。<\/p>\n<\/blockquote>\n<p>D成立至少需要这个关于教授立场的明确描述。原文相应位置只写保守主义思想如何被他们排斥；研究对象的思想标签不能直接成为研究者的立场标签。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>全文主旨要求指出教育中不自由的表现，不能单凭“不自由”就给教授贴上公共政策保守派的标签。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>conservative about public policy<br>在公共政策上持保守立场<\/p>\n<\/blockquote>\n<p>D把教育中的不开放与政治上的保守混在一起。本项仍须看第5段：<code>conservative<\/code>修饰被排斥的思想，而不是教授的政策立场；标题中的<code>illiberal<\/code>也不能替代这个具体关系。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>39题结论<\/h3>\n<blockquote>\n<p><strong>39. B. biased against classical liberal ideas<\/strong><\/p>\n<\/blockquote>\n<p>A把被排除的自由市场思想改成教授支持的对象。<\/p>\n<p>B从两类思想受到不平等待遇的事实，推断出对古典自由主义的偏见。<\/p>\n<p>C把选择性排斥思想改成了对学术研究的一般谨慎。<\/p>\n<p>D把被排斥思想的保守主义标签移到了教授本人的政策立场上。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h1>段落与全文逻辑框架<\/h1>\n<p><strong>逻辑层次1：对AAAS报告的初步评价<\/strong>（段落1核心观点） 表面肯定：报告肯定了人文和社会科学对美国自由民主的重要性（值得赞扬）// 深层批评：未能解决自由教育危机的真正本质（可能造成更多害处）<\/p>\n<p>↓（背景介绍）<\/p>\n<p><strong>逻辑层次2：报告的起源与构成<\/strong>（段落2历史背景） 2010年：国会两党要求AAAS确定行动方案 → 目标：维持人文社科的国家卓越水平 → AAAS成立委员会：51名成员（大学校长、学者、各界精英）<\/p>\n<p>↓（报告内容）<\/p>\n<p><strong>逻辑层次3：报告的具体建议<\/strong>（段落3正面内容） 基础目标：【支持全面识字 + 强调美国历史和政府学习 + 鼓励使用数字技术】→ 创新目标：【增加研究投资 + 制定连贯课程 + 增加教师资助 + 学者参与重大挑战】→ 国际化：【学习外语 + 国际事务 + 海外学习】<\/p>\n<p>//（转折批判）<\/p>\n<p><strong>逻辑层次4：报告的根本缺陷<\/strong>（段落4核心批判） 未触及核心问题：顶尖大学自由教育的非自由本质 → 现实问题：【几十年来的毕业生不懂自由教育 → 被剥夺其好处】→ 本质变化：探究精神被进步主义宣传取代<\/p>\n<p>↓（具体表现）<\/p>\n<p><strong>逻辑层次5：当前教育的偏见现状<\/strong>（段落5现状描述） 教授的双重标准：【进步主义解释 = 适当研究主题 // 保守/古典自由主义思想（自由市场、自力更生）= 超出合法研究边界】<\/p>\n<p>↓（总体评价）<\/p>\n<p><strong>逻辑层次6：报告的负面影响<\/strong>（段落6最终判断） AAAS虽热情支持自由教育 // 但报告掩盖了问题的深度和广度 → 可能阻碍真正的改革<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：AAAS的报告虽然在表面上支持自由教育，但由于未能认识到当前高等教育中自由教育已被进步主义意识形态劫持的本质问题，反而可能通过掩盖真相而阻碍必要的改革。<\/p>\n<h2>小标题题<\/h2>\n<p>Read the following five sections and choose the most suitable heading for each section from the list A–G. There are two extra headings which you do not need to use.<\/p>\n<p>A. Recognizing an old ideological problem<\/p>\n<p>B. Welcoming a report, but questioning its diagnosis<\/p>\n<p>C. Passing expertise from one generation to the next<\/p>\n<p>D. Praiseworthy goals and practical proposals<\/p>\n<p>E. A recent report that caused the campus crisis<\/p>\n<p>F. Creating a commission to sustain national excellence<\/p>\n<p>G. Campus practices that expose the report’s blind spot<\/p>\n<h3>41. ______<\/h3>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences, deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America. Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<h3>42. ______<\/h3>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the American Academy of Arts and Sciences asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences, with Duke University President Richard Brodhead and retired Exelon CEO John Rowe as co-chairmen. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<h3>43. ______<\/h3>\n<p>The goals identified in the report are generally admirable. Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day. The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<p>One of the more novel ideas in the report is the creation of a &quot;Culture Corps&quot; in cities and town across America to &quot;transmit humanistic and social scientific expertise from one generation to the next.&quot;<\/p>\n<h3>44. ______<\/h3>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The commission ignores that for several decades America&#39;s colleges and universities have produced graduates who don&#39;t know the content and character of liberal education and are thus deprived of its benefits. Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for disseminating &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<p>We know from the extensive documentation that William F. Buckley Jr. provided in his stellar critique of American academia, &quot;God and Man at Yale,&quot; first published in 1951, that this propagandizing extends back at least to the middle of the 20th century.<\/p>\n<h3>45. ______<\/h3>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas--such as free markets, self-reliance and a distrust of central planning--as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>Meanwhile, courses proliferate on highly specialized topics--Muslims in movies, gay and lesbian gardeners, the mathematical formalization of political decision making, for example--that closely correspond to professors&#39; niche research interests but contribute little to students&#39; grasp of the broad sweep of Western civilization and its literary, philosophical and religious masterpieces.<\/p>\n<p>Through speech codes, endless seminars and workshops designed to teach students how to avoid &quot;offensive&quot; speech--and by handling sexual harassment and sexual-assault allegations with procedures that undermine the presumption of innocence--universities teach students to discount free speech and due process.<\/p>\n<p>The American Academy of Arts and Sciences displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<h2>小标题41题<\/h2>\n<p><strong>答案：B. Welcoming a report, but questioning its diagnosis<\/strong><br>中文：肯定一份报告，却质疑它对问题的判断。<\/p>\n<p>这一部分在开篇划定作者的立场：报告支持人文与社会科学，这一点值得肯定；但它没有找准自由教育危机的根源，可能带来负面结果。<\/p>\n<p>关键转折是“Regrettably, however”。前面“deserves praise”说明赞许的具体理由，后面“failure to address the true nature of the crisis”才是作者对报告的主要保留。<\/p>\n<p>段内顺序是：报告肯定人文社科的重要性 → 承认这一点有价值 → 转向报告对危机的误判 → 预告可能造成的伤害。<\/p>\n<p>B的“Welcoming a report”对应开头的有限肯定，“questioning its diagnosis”对应没有触及危机真正本质。两个部分合起来才能保留这一段的先扬后抑。<\/p>\n<p>E也有“report”和“crisis”，但把关系改成“这份新报告造成了校园危机”。原文说报告没有处理已经存在的危机，可能造成更多害处；未能诊断问题不等于创造了问题。<\/p>\n<p><strong>41题选B。<\/strong><\/p>\n<h2>小标题42题<\/h2>\n<p><strong>答案：F. Creating a commission to sustain national excellence<\/strong><br>中文：成立委员会以维持国家的卓越水平。<\/p>\n<p>这部分交代报告的来历：先有国会两党的委托，再有学术机构组建委员会。人员名单服务于这项背景说明。<\/p>\n<p>开头“In 2010”给出时间，“maintain national excellence”说明委托目的；下一段的“In response”把成立委员会接到这项要求上。<\/p>\n<p>推进过程是：国会要求找出可采取的行动 → 目标是维持人文社科研究和教育的卓越水平 → 学术机构作出回应 → 列出委员会的负责人和成员构成。<\/p>\n<p>F中的“Creating a commission”概括组织层面的回应，“to sustain national excellence”保留它承担的任务。题目不能只抓51人这个数字或某一位负责人。<\/p>\n<p>D说的是目标与具体建议，容易被这里的“national excellence”吸引。但本部分还没有展开识字、课程、研究投资等建议，主要回答的是谁发出委托、谁组织研究。<\/p>\n<p><strong>42题选F。<\/strong><\/p>\n<h2>小标题43题<\/h2>\n<p><strong>答案：D. Praiseworthy goals and practical proposals<\/strong><br>中文：值得赞许的目标与具体建议。<\/p>\n<p>这部分集中介绍报告提出了哪些教育目标，以及为实现目标建议采取哪些行动。<\/p>\n<p>“The goals identified in the report are generally admirable”先作总体评价；“Because representative government presupposes an informed citizenry”引出公民教育，“To encourage innovation and competition”引出研究与课程投入，最后再补充Culture Corps。<\/p>\n<p>段内从识字、历史和政府知识出发，接着谈数字技术、研究资助、解决问题和沟通能力，再扩展到外语、国际事务、海外学习与代际知识传递。<\/p>\n<p>D的“Praiseworthy goals”对应“generally admirable”，而“practical proposals”覆盖报告提出的多组行动。它能统摄三个自然段，并保留作者在这里的正面评价。<\/p>\n<p>C的“Passing expertise from one generation to the next”几乎接上最后一句，却只对应Culture Corps这一项。把它当作整个部分的标题，会漏掉前面的公民素养、创新能力、教师资助与国际化建议。<\/p>\n<p><strong>43题选D。<\/strong><\/p>\n<h2>小标题44题<\/h2>\n<p><strong>答案：A. Recognizing an old ideological problem<\/strong><br>中文：认识长期存在的意识形态问题。<\/p>\n<p>这部分从报告的建议转向它没有处理的根本问题：自由教育中的探究精神被意识形态宣传替代，而且这种现象已有长期历史。<\/p>\n<p>“Unfortunately”启动转折，“the illiberal nature of liberal education”点明问题；随后“for several decades”与“first published in 1951”把它放进几十年的时间范围。<\/p>\n<p>推进过程是：报告没有触及核心 → 毕业生不懂自由教育的内容与性质 → 学科被用作宣传工具 → 引入1951年出版的批评著作，说明问题并非刚刚出现。<\/p>\n<p>A的“ideological problem”对应进步主义或左翼自由主义宣传取代探究，“old”对应几十年与20世纪中叶的历史证据。标题的两部分都得到这一组段落支持。<\/p>\n<p>E也提到了校园危机，但它把新近报告写成危机的原因。1951年的证据正好排除了这一时间关系：报告面对的是旧问题，受到的批评是忽视它。<\/p>\n<p><strong>44题选A。<\/strong><\/p>\n<h2>小标题45题<\/h2>\n<p><strong>答案：G. Campus practices that expose the report’s blind spot<\/strong><br>中文：揭示报告盲点的校园做法。<\/p>\n<p>这一部分列出当下校园中的具体做法，再收束到作者对报告的判断。它把此前抽象的“非自由”问题展开给读者看。<\/p>\n<p>“Today”引出教授对不同思想的双重标准；“Meanwhile”补充过度专门化的课程；“Through speech codes”转向言论与程序保障；末段的“Yet”回到报告可能妨碍改革。<\/p>\n<p>推进链是：思想受到区别对待 → 课程更多围绕教授的狭窄研究兴趣 → 学校做法削弱自由言论和正当程序 → 报告没有照亮这组问题的深度与广度。<\/p>\n<p>G的“Campus practices”覆盖前三个自然段的具体表现，“expose the report’s blind spot”接住最后一段的判断：报告热情支持自由教育，却掩盖了真正需要改革的地方。<\/p>\n<p>A也与思想偏见有关，但重心是问题长期存在的历史，不能统摄这里的课程、言论规则和程序保障。此处的时间入口是“Today”，重点是当下怎样做及报告漏看了什么。<\/p>\n<p><strong>45题选G。<\/strong><\/p>\n<h2>排序题<\/h2>\n<p>The following paragraphs are given in a random order. Put them in the correct order. Paragraphs A, E and H have been placed for you.<\/p>\n<p><strong>A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H<\/strong><\/p>\n<h3>A<\/h3>\n<p>“The Heart of the Matter,” a report by the American Academy of Arts and Sciences, deserves praise for affirming the importance of the humanities and social sciences to American democracy. Its failure to address the true nature of the crisis facing liberal education, however, may cause more harm than good.<\/p>\n<h3>B<\/h3>\n<p>That illiberal character has deprived generations of graduates of the benefits of liberal education. The spirit of inquiry has been replaced by the use of the humanities and social sciences as vehicles for progressive or left-liberal propaganda. Documentation in William F. Buckley Jr.’s “God and Man at Yale,” first published in 1951, traces this propagandizing back at least to the middle of the twentieth century.<\/p>\n<h3>C<\/h3>\n<p>The commission’s recommendations are generally admirable. They support literacy, the study of history and government, digital technologies, greater investment in research and better curricula. They also encourage foreign-language study and propose a Culture Corps to pass humanistic and social scientific expertise from one generation to the next.<\/p>\n<h3>D<\/h3>\n<p>Beyond this exclusion of conservative and classical liberal ideas, highly specialized courses reflect professors’ narrow research interests but contribute little to students’ understanding of Western civilization and its major works. Speech codes and procedures that undermine the presumption of innocence also teach students to discount free speech and due process.<\/p>\n<h3>E<\/h3>\n<p>Unfortunately, despite 2½ years in the making, the report never gets to the heart of the matter: the illiberal nature of liberal education at leading colleges and universities.<\/p>\n<h3>F<\/h3>\n<p>The report originated in a request made in 2010 by leading congressional Democrats and Republicans. They asked the academy to identify actions that would maintain national excellence in humanities and social science education. In response, the academy formed a commission of 51 members, including university presidents, scholars and other prominent figures.<\/p>\n<h3>G<\/h3>\n<p>That older pattern persists today: professors treat progressive interpretations of history and public policy as proper subjects of study while presenting conservative or classical liberal ideas, such as free markets and self-reliance, as outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<h3>H<\/h3>\n<p>These problems make the academy’s enthusiasm for liberal education insufficient. By obscuring the depth and breadth of the challenge Congress asked it to illuminate, the report may set back the very reform that is needed.<\/p>\n<h2>排序题全局解析<\/h2>\n<p>先把A—H各段的功能放在一起：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>主要功能<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>开篇先肯定报告支持人文社科，再指出其诊断可能失准。<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>解释“非自由”的含义，并用1951年的著作说明问题由来已久。<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>接过委员会这一主体，介绍报告中的具体建议。<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>承接保守和古典自由主义思想受到排斥，补充课程安排以及言论和程序保障的问题。<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>从值得肯定的建议转入报告没有触及的核心缺陷。<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>回溯国会委托和委员会成立，说明报告怎样产生。<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>把历史中的宣传模式接到今天教授对不同思想的区别对待。<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>汇总这组校园问题，回到报告可能阻碍改革的判断。<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：开篇评价报告 → 交代国会委托与委员会成立 → 展开委员会建议 → 转折指出根本缺陷 → 解释缺陷并追溯历史 → 查看今天的思想偏见 → 补充课程和制度表现 → 回到对报告的总体判断。<\/p>\n<p>A、E、H分别固定在第1、4、8个位置。A后的背景段必须先介绍委员会，具体建议才能接着出现；E之后先解释问题的历史，再接今天的表现，最后由H收束这些问题。<\/p>\n<p><strong>完整顺序：A → F → C → E → B → G → D → H。<\/strong><\/p>\n<p><strong>41—45：F、C、B、G、D。<\/strong><\/p>\n<h2>排序41题<\/h2>\n<p>当前空位在A之后、42题之前；前半部分以固定段E的“Unfortunately”收束为转折。<\/p>\n<p>A末尾说报告没有处理危机本质。F开头“The report originated in a request”继续同一份报告，同时切换到它的产生背景；F末尾第一次介绍“a commission of 51 members”。后面的C开头则是“The commission’s recommendations”。<\/p>\n<p>这形成双向承接：A先让读者认识报告，F解释报告源于什么委托并引入委员会，C才有明确的主体可以介绍其建议。“The commission”不能在尚未介绍委员会时直接出现。<\/p>\n<p>局部推进链是：A评价报告 → F回溯国会委托、委员会成立 → C介绍该委员会的建议。<\/p>\n<p>C是较强候选，因为它也谈报告的正面内容；但把它放在41题，会让委员会无来源地先出现，随后再用F倒退补背景，还会打断C与E之间的肯定—转折关系。<\/p>\n<p><strong>41题选F。<\/strong><\/p>\n<h2>排序42题<\/h2>\n<p>当前空位位于41题确定的F之后、固定段E之前。<\/p>\n<p>F末尾成立委员会；C首句“The commission’s recommendations are generally admirable”立刻接过同一个组织。C末尾仍在列举Culture Corps等建议，E首词“Unfortunately”随即转向报告没有触及的核心问题。<\/p>\n<p>前端靠主体复现衔接，后端靠评价转折衔接：先有负责研究的委员会，再看其建议为什么值得肯定，接着才谈这些建议为什么仍未解决根本缺陷。<\/p>\n<p>局部推进链是：F说明谁提出报告 → C展开可取建议 → E指出报告遗漏的实质问题。<\/p>\n<p>B同样解释教育问题，但它以“That illiberal character”开头，必须先让E提出“the illiberal nature”。此处如果填B，既找不到这个指代的近处来源，也会让E再重复开启一次本应已经展开的批评。<\/p>\n<p><strong>42题选C。<\/strong><\/p>\n<h2>排序43题<\/h2>\n<p>当前空位紧跟固定段E，后面还有44、45题，最终进入固定结尾H。<\/p>\n<p>E末尾点出“the illiberal nature of liberal education”。B首句“That illiberal character”接着解释这种性质怎样剥夺学生的教育收益，并进一步指出宣传替代探究。B末尾把问题追溯到1951年的著作和20世纪中叶；G开头“That older pattern persists today”正好承接这条历史线。<\/p>\n<p>B的开头需要E提供指代对象，结尾又为G提供“older pattern”的时间依据，所以它连接的是“核心缺陷”与“当下表现”两个层次。D开头回指的是对保守和古典自由主义思想的排斥，这个具体对象尚未在B里展开，需要先由G说清。<\/p>\n<p>局部推进链是：E命名问题 → B解释问题并确认其历史 → G说明同一模式延续到今天。<\/p>\n<p>G看起来也能举出“非自由”的例子，但若直接接E，开头的“older pattern”缺少已经展开的旧模式；更重要的是，B的1951年证据会被放到“今天”之后，割断这里明确的历史—现在承接。<\/p>\n<p><strong>43题选B。<\/strong><\/p>\n<h2>排序44题<\/h2>\n<p>当前空位位于43题确定的B之后，45题之前，随后由H作总评。<\/p>\n<p>B末尾写到“first published in 1951”和“the middle of the twentieth century”。G以“That older pattern persists today”接住过去，再具体说明教授如何优待进步主义解释、排斥保守或古典自由主义思想。D开头“Beyond this exclusion of conservative and classical liberal ideas”则回指G刚刚指出的具体排斥对象。<\/p>\n<p>前端是“旧模式仍延续到今天”的时间承接，后端是“除了对这些思想的排斥，还有其他校园问题”的扩展。G既接住B的历史，又先把D中“this exclusion”的对象说明白。<\/p>\n<p>局部推进链是：B确认旧模式 → G呈现今天的思想偏见 → D补充课程和校园制度的问题。<\/p>\n<p>D也是当下校园问题，B中“宣传取代探究”也能概括为思想偏见；但D回指的是具体的“this exclusion of conservative and classical liberal ideas”。B还没有指出这两类思想受到排斥，G才把这件事写出来。因此这里先放G，D的“this exclusion”才有具体来源，再由“Beyond”扩展到课程和制度。<\/p>\n<p><strong>44题选G。<\/strong><\/p>\n<h2>排序45题<\/h2>\n<p>当前空位在44题确定的G之后、固定结尾H之前，是论证收束前最后一组具体表现。<\/p>\n<p>G末尾说，保守或古典自由主义思想被描绘成不属于常规的、有时甚至不属于正当的智力探究范围。D以“Beyond this exclusion of conservative and classical liberal ideas”接住这项具体排斥，再补充课程围绕狭窄研究兴趣、言论规范及某些程序削弱自由言论和正当程序的问题。H以“These problems”概括的正是这一整组校园问题。<\/p>\n<p>前端是同一组思想及其受排斥状态的复现，后端是多个具体问题被复数指代概括。D把批评从研究哪些思想扩展到课程怎样安排、校园怎样运作，使H的“depth and breadth”有具体内容。G中的“sometimes”限定了程度：作者说有时连正当性都被否认，并非每一次排斥都达到这个程度。<\/p>\n<p>局部推进链是：G说明思想的区别对待 → D补全课程与制度表现 → H评价报告遗漏这些问题的后果。<\/p>\n<p>C也有课程建议，但它在介绍报告希望怎样改善教育，方向是肯定建议；H的“These problems”需要已经呈现的现实弊端，不能把C中的积极建议直接当成那些弊端。<\/p>\n<p><strong>45题选D。<\/strong><\/p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>well-rounded education<\/strong><\/td>\n<td><strong>全面发展的教育<\/strong><\/td>\n<td><strong>文明｜教育发展<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>a spirit of inquiry<\/td>\n<td>探究精神<\/td>\n<td>文明｜文化素养<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>critical thinking<\/strong><\/td>\n<td><strong>批判性思维<\/strong><\/td>\n<td><strong>文明｜文化素养<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>openness to different ideas<\/td>\n<td>对不同观点的开放态度<\/td>\n<td>友善｜尊重他人<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>humanistic literacy<\/td>\n<td>人文素养<\/td>\n<td>文明｜文化素养<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>innovation<\/td>\n<td>创新<\/td>\n<td>富强｜创新发展<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>problem-solving ability<\/td>\n<td>解决问题的能力<\/td>\n<td>敬业｜能力提升<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>effective communication<\/td>\n<td>有效沟通<\/td>\n<td>和谐｜人际沟通<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>international understanding<\/strong><\/td>\n<td><strong>国际理解<\/strong><\/td>\n<td><strong>和谐｜交流合作<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>lifelong learning<\/td>\n<td>终身学习<\/td>\n<td>文明｜教育发展<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>the practical application of knowledge<\/td>\n<td>知识的实践应用<\/td>\n<td>敬业｜知行合一<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>educational reform<\/td>\n<td>教育改革<\/td>\n<td>文明｜教育发展<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>2. 大作文第一段描述题目信息时可积累的表达<\/h2>\n<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>The picture highlights the importance of A to B.<\/strong><\/td>\n<td><strong>图画突出了A对B的重要性。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A is using X to improve the ability to solve problems.<\/td>\n<td>A正在利用X提高解决问题的能力。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>A displays great enthusiasm for X.<\/td>\n<td>A对X表现出极大的热情。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The scene shows A and B communicating effectively despite their differences.<\/td>\n<td>画面展示了A和B尽管存在差异，仍在有效沟通。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart shows increased investment in A over the period.<\/strong><\/td>\n<td><strong>图表显示，在这段时间内对A的投资有所增加。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>Funding for A increased from X to Y.<\/td>\n<td>用于A的资金从X增加到Y。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The figures reveal an expansion in the number of A.<\/td>\n<td>这些数据表明，A的数量有所增长。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart shows growing use of A among B.<\/td>\n<td>图表显示，在B群体中A的使用日益增多。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The report affirms the importance of A and calls for greater support for it.<\/strong><\/td>\n<td><strong>报告肯定了A的重要性，并呼吁给予更多支持。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage stresses the need to bring knowledge to bear on practical challenges.<\/td>\n<td>短文强调，需要运用知识应对现实挑战。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The author argues that A fails to address the true nature of B.<\/td>\n<td>作者认为，A未能触及B的真正本质。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage warns that ignoring A may set back progress in B.<\/td>\n<td>短文提醒，忽视A可能阻碍B方面的进展。<\/td>\n<\/tr>\n<\/tbody><\/table>\n";
