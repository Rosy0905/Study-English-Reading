f study abroad programs.<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>报告中确定的目标 / 总体上令人钦佩。<\/p>\n<p>因为代议制政府 / 预设了知情的公民，/ 报告支持全面识字；/ 强调学习 / 历史和政府，/ 特别是美国历史 / 和美国政府；/ 并鼓励使用 / 新的数字技术。<\/p>\n<p>为了鼓励创新和竞争，/ 报告呼吁 / 增加研究投资，/ 制定连贯的课程 / 提高学生能力的 / 解决问题 / 并有效沟通 / 在21世纪，/ 增加对教师的资助 / 并鼓励学者 / 将他们的学识运用 / 在当今的重大挑战上。<\/p>\n<p>报告还倡导 / 更多学习外语，/ 国际事务 / 以及扩展 / 海外学习项目。<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>报告中确定的目标总体上令人钦佩。因为代议制政府预设了知情的公民，报告支持全面识字；强调学习历史和政府，特别是美国历史和美国政府；并鼓励使用新的数字技术。为了鼓励创新和竞争，报告呼吁增加研究投资，制定连贯的课程以提高学生在21世纪解决问题和有效沟通的能力，增加对教师的资助，并鼓励学者将他们的学识运用于当今的重大挑战。报告还倡导更多学习外语、国际事务以及扩展海外学习项目。<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities. The commission ignores that for several decades America&#39;s colleges and universities have produced graduates who don&#39;t know the content and character of liberal education and are thus deprived of its benefits. Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>Unfortunately, / despite 2½ years in the making, / &quot;The Heart of the Matter&quot; / never gets to the heart of the matter: / the illiberal nature / of liberal education / at our leading colleges and universities.<\/p>\n<p>The commission ignores / that for several decades / America&#39;s colleges and universities / have produced graduates / who don&#39;t know / the content and character / of liberal education / and are thus deprived / of its benefits.<\/p>\n<p>Sadly, / the spirit of inquiry / once at home on campus / has been replaced / by the use of the humanities and social sciences / as vehicles / for publicizing &quot;progressive,&quot; / or left-liberal propaganda.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>不幸的是，/ 尽管花了2年半制作，/ &quot;问题的核心&quot; / 从未触及问题的核心：/ 非自由的本质 / 自由教育的 / 在我们顶尖的学院和大学。<\/p>\n<p>委员会忽视了 / 几十年来 / 美国的学院和大学 / 已经培养出毕业生 / 他们不知道 / 内容和特征 / 自由教育的 / 因此被剥夺了 / 它的好处。<\/p>\n<p>可悲的是，/ 探究精神 / 曾经在校园里安家的 / 已经被取代 / 通过使用人文和社会科学 / 作为工具 / 来宣传&quot;进步主义&quot;，/ 或左翼自由主义宣传。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>不幸的是，尽管花了2年半制作，《问题的核心》从未触及问题的核心：我们顶尖学院和大学中自由教育的非自由本质。委员会忽视了几十年来美国的学院和大学已经培养出不了解自由教育内容和特征的毕业生，他们因此被剥夺了自由教育的好处。可悲的是，曾经在校园里安家的探究精神已经被取代，人文和社会科学被用作宣传&quot;进步主义&quot;或左翼自由主义宣传的工具。<\/p>\n<h2>第5段<\/h2>\n<h3>完整原文 · 第5段<\/h3>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<h3>意群划分 · 第5段<\/h3>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<h3>意群翻译 · 第5段<\/h3>\n<p>今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。<\/p>\n<h3>标准译文 · 第5段<\/h3>\n<p>今天，教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题，同时将保守或古典自由主义思想——如自由市场和自力更生——描绘为落在常规的、有时甚至是合法的智力研究边界之外。<\/p>\n<h2>第6段<\/h2>\n<h3>完整原文 · 第6段<\/h3>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<h3>意群划分 · 第6段<\/h3>\n<p>The AAAS / displays great enthusiasm / for liberal education.<\/p>\n<p>Yet its report / may well set back reform / by obscuring / the depth and breadth / of the challenge / that Congress asked it / to illuminate.<\/p>\n<h3>意群翻译 · 第6段<\/h3>\n<p>AAAS / 展现出极大的热情 / 对自由教育。<\/p>\n<p>然而它的报告 / 很可能阻碍改革 / 通过掩盖 / 深度和广度 / 挑战的 / 国会要求它 / 去阐明的。<\/p>\n<h3>标准译文 · 第6段<\/h3>\n<p>AAAS对自由教育展现出极大的热情。然而它的报告很可能通过掩盖国会要求它阐明的挑战的深度和广度而阻碍改革。<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>&quot;The Heart of the Matter&quot;：(the just-released report：(by the American Academy of Arts and Sciences (AAAS))) → deserves praise：(for affirming the importance：(of the humanities and social sciences)：(to the prosperity and security：(of liberal democracy：(in America)))).<\/p>\n<p>Regrettably, however // the report&#39;s failure：(to address the true nature：(of the crisis：(facing liberal education))) → may cause more harm than good.<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>In 2010 → leading congressional Democrats and Republicans → sent letters to the AAAS → asking that it identify actions：(that could be taken：(by &quot;federal, state and local governments + universities, foundations, educators + individual benefactors and others&quot;)：(to &quot;maintain national excellence：(in humanities and social scientific scholarship and education)&quot;)).<\/p>\n<p>In response → the American Academy → formed the Commission：(on the Humanities and Social Sciences).<\/p>\n<p>Among the commission&#39;s 51 members → are top-tier-university presidents + scholars, lawyers, judges + business executives + as well as prominent figures：(from diplomacy, filmmaking + music and journalism).<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>The goals identified in the report → are generally admirable.<\/p>\n<p>Because representative government → presupposes an informed citizenry → the report supports full literacy + stresses the study：(of history and government)：(particularly American history + American government) + encourages the use：(of new digital technologies).<\/p>\n<p>To encourage innovation and competition → the report calls for：(increased investment in research) + (the crafting of coherent curricula：(that improve students&#39; ability：(to solve problems + communicate effectively：(in the 21st century)))) + (increased funding for teachers) + (the encouragement of scholars：(to bring their learning to bear：(on the great challenges of the day))).<\/p>\n<p>The report also advocates → greater study of foreign languages + international affairs + the expansion：(of study abroad programs).<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>Unfortunately // despite 2½ years in the making → &quot;The Heart of the Matter&quot; → never gets to the heart of the matter：(the illiberal nature：(of liberal education)：(at our leading colleges and universities)).<\/p>\n<p>The commission ignores：(that for several decades → America&#39;s colleges and universities → have produced graduates：(who don&#39;t know → the content and character：(of liberal education)) + (are thus deprived：(of its benefits))).<\/p>\n<p>Sadly → the spirit of inquiry：(once at home on campus) → has been replaced：(by the use of the humanities and social sciences：(as vehicles：(for publicizing &quot;progressive,&quot; or left-liberal propaganda))).<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>Today → professors routinely treat：(the progressive interpretation of history + progressive public policy)：(as the proper subject of study) // while portraying：(conservative or classical liberal ideas：(such as free markets and self-reliance))：(as falling outside the boundaries：(of routine + sometimes legitimate + intellectual investigation)).<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>The AAAS → displays great enthusiasm：(for liberal education).<\/p>\n<p>Yet its report → may well set back reform：(by obscuring：(the depth and breadth：(of the challenge：(that Congress asked it → to illuminate)))).<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>&quot;问题的核心&quot;：(刚刚发布的报告：(由美国艺术与科学院（AAAS）)) → 值得赞扬：(因为肯定了重要性：(人文和社会科学的)：(对繁荣和安全：(自由民主的：(在美国))))。<\/p>\n<p>遗憾的是，然而 // 该报告的失败：(在解决真正本质方面：(危机的：(面临自由教育的))) → 可能造成更多害处而非益处。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>在2010年 → 主要的国会民主党人和共和党人 → 致信AAAS → 要求它确定行动：(可以被采取的：(由&quot;联邦、州和地方政府 + 大学、基金会、教育工作者 + 个人捐助者和其他人&quot;)：(来&quot;维持国家卓越：(在人文和社会科学学术和教育方面)&quot;))。<\/p>\n<p>作为回应 → 美国学院 → 成立了委员会：(关于人文和社会科学的)。<\/p>\n<p>在委员会的51名成员中 → 有顶级大学校长 + 学者、律师、法官 + 商业高管 + 以及杰出人物：(来自外交、电影制作 + 音乐和新闻界)。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>报告中确定的目标 → 总体上令人钦佩。<\/p>\n<p>因为代议制政府 → 预设了知情的公民 → 报告支持全面识字 + 强调学习：(历史和政府)：(特别是美国历史 + 美国政府) + 鼓励使用：(新的数字技术)。<\/p>\n<p>为了鼓励创新和竞争 → 报告呼吁：(增加研究投资) + (制定连贯的课程：(提高学生能力的：(解决问题 + 有效沟通：(在21世纪)))) + (增加对教师的资助) + (鼓励学者：(将他们的学识运用：(在当今的重大挑战上)))。<\/p>\n<p>报告还倡导 → 更多学习外语 + 国际事务 + 扩展：(海外学习项目)。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>不幸的是 // 尽管花了2年半制作 → &quot;问题的核心&quot; → 从未触及问题的核心：(非自由的本质：(自由教育的)：(在我们顶尖的学院和大学))。<\/p>\n<p>委员会忽视了：(几十年来 → 美国的学院和大学 → 已经培养出毕业生：(他们不知道 → 内容和特征：(自由教育的)) + (因此被剥夺了：(它的好处)))。<\/p>\n<p>可悲的是 → 探究精神：(曾经在校园里安家的) → 已经被取代：(通过使用人文和社会科学：(作为工具：(来宣传&quot;进步主义&quot;或左翼自由主义宣传)))。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>今天 → 教授们经常对待：(历史的进步主义解释 + 进步主义公共政策)：(作为适当的研究主题) // 同时描绘：(保守或古典自由主义思想：(如自由市场和自力更生))：(作为落在边界之外：(常规的 + 有时是合法的 + 智力研究))。<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>AAAS → 展现出极大的热情：(对自由教育)。<\/p>\n<p>然而它的报告 → 很可能阻碍改革：(通过掩盖：(深度和广度：(挑战的：(国会要求它 → 去阐明的))))。<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h2>长难句1 · 第1段第1句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; / the just-released report / by the American Academy of Arts and Sciences (AAAS), / deserves praise / for affirming the importance / of the humanities and social sciences / to the prosperity and security / of liberal democracy / in America.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>&quot;问题的核心&quot;，/ 刚刚发布的报告 / 由美国艺术与科学院（AAAS），/ 值得赞扬 / 因为肯定了重要性 / 人文和社会科学的 / 对繁荣和安全 / 自由民主的 / 在美国。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把谁发布、什么时候发布接到报告前：<\/p>\n<blockquote>\n<p>美国艺术与科学院（AAAS）刚刚发布的报告《问题的核心》<\/p>\n<\/blockquote>\n<p>把肯定的对象说清楚：<\/p>\n<blockquote>\n<p>值得赞扬，因为它肯定了人文和社会科学的重要性<\/p>\n<\/blockquote>\n<p>最后一组是在说明对什么重要，层层收拢：<\/p>\n<blockquote>\n<p>对美国自由民主的繁荣和安全的重要性<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>美国艺术与科学院（AAAS）刚刚发布的报告《问题的核心》<br>值得赞扬，因为它肯定了人文和社会科学<br>对美国自由民主的繁荣和安全的重要性<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>这份报告值得赞扬，因为它肯定了人文和社会科学的重要性。<\/p>\n<\/blockquote>\n<p>先说明报告的发布者与名称，再说评价，最后接赞扬的原因。将“美国”接到“自由民主”前，再把“繁荣和安全”接到它后面，避免把重要性只理解成某门学科自身的重要。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>美国艺术与科学院（AAAS）刚刚发布的报告《问题的核心》值得赞扬，原因是它肯定了人文和社会科学对于美国自由民主的繁荣和安全所具有的重要性。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“原因是”换成“因为”，直接连接评价和理由。<\/li>\n<li>“对于……所具有的重要性”压缩成“对……的重要性”，减少虚词。<\/li>\n<li>发布机构、报告名称及“繁荣和安全”都保留，不将多个修饰层缩成含糊的“有益”。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>美国艺术与科学院（AAAS）刚刚发布的报告《问题的核心》值得赞扬，因为它肯定了人文和社会科学对美国自由民主的繁荣和安全的重要性。<\/p>\n<\/blockquote>\n<h2>长难句2 · 第2段第1句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>In 2010, / leading congressional Democrats and Republicans / sent letters to the AAAS / asking that it identify actions / that could be taken / by &quot;federal, state and local governments, / universities, foundations, educators, / individual benefactors and others&quot; / to &quot;maintain national excellence / in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>在2010年，/ 主要的国会民主党人和共和党人 / 致信AAAS / 要求它确定行动 / 可以被采取的 / 由&quot;联邦、州和地方政府，/ 大学、基金会、教育工作者，/ 个人捐助者和其他人&quot; / 来&quot;维持国家卓越 / 在人文和社会科学学术和教育方面。&quot;<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把时间、写信人和收信人接好：<\/p>\n<blockquote>\n<p>2010年，主要的国会民主党人和共和党人致信AAAS<\/p>\n<\/blockquote>\n<p>把所有行动主体放在“可以采取的行动”之前：<\/p>\n<blockquote>\n<p>要求确定联邦、州和地方政府、大学、基金会、教育工作者、个人捐助者和其他人可以采取的行动<\/p>\n<\/blockquote>\n<p>末尾说行动希望达到的目标：<\/p>\n<blockquote>\n<p>维持人文和社会科学学术和教育方面的国家卓越水平<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>2010年，主要的国会民主党人和共和党人致信AAAS<br>要求确定各类政府、机构和个人可以采取的行动<br>目的是维持人文和社会科学学术和教育方面的国家卓越水平<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>国会两党人士致信AAAS，要求它确定行动来维持国家的卓越水平。<\/p>\n<\/blockquote>\n<p>按时间、人物、写信、要求、目标的顺序展开。将完整主体清单放在“可以采取的行动”前，明确不是只要求AAAS独自行动；最后用“以”接共同目的。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>2010年，主要的国会民主党人和共和党人给AAAS写信，要求它确定联邦、州和地方政府、大学、基金会、教育工作者、个人捐助者和其他人能够采取的行动，来维持国家在人文和社会科学学术和教育方面的卓越水平。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“给AAAS写信”整理为“致信AAAS”，“要求它”整理为“要求其”，使长句更紧凑。<\/li>\n<li>目标部分用“以”连接，避免把行动与目的写成两个不相干的要求。<\/li>\n<li>保留目标的引号和完整领域，不把“学术和教育”缩成笼统的文化实力。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>2010年，主要的国会民主党人和共和党人致信AAAS，要求其确定联邦、州和地方政府、大学、基金会、教育工作者、个人捐助者和其他人可以采取的行动，以&quot;维持人文和社会科学学术和教育方面的国家卓越水平&quot;。<\/p>\n<\/blockquote>\n<h2>长难句3 · 第3段第2句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Because representative government / presupposes an informed citizenry, / the report supports full literacy; / stresses the study / of history and government, / particularly American history / and American government; / and encourages the use / of new digital technologies.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>因为代议制政府 / 预设了知情的公民，/ 报告支持全面识字；/ 强调学习 / 历史和政府，/ 特别是美国历史 / 和美国政府；/ 并鼓励使用 / 新的数字技术。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把政策理由合为一块：<\/p>\n<blockquote>\n<p>因为代议制政府预设了知情的公民<\/p>\n<\/blockquote>\n<p>报告的前两项主张按并列关系连接，具体范围接在历史和政府后：<\/p>\n<blockquote>\n<p>支持全面识字；强调学习历史和政府，特别是美国历史和美国政府<\/p>\n<\/blockquote>\n<p>再把第三项主张接全：<\/p>\n<blockquote>\n<p>并鼓励使用新的数字技术<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>因为代议制政府预设了知情的公民<br>报告支持全面识字，并强调学习历史和政府，特别是美国历史和美国政府<br>报告还鼓励使用新的数字技术<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>因为政府需要知情公民，报告提出识字、学习和技术使用三方面的主张。<\/p>\n<\/blockquote>\n<p>理由先放句首，随后让“报告”统领三项并列主张。“特别是美国历史和美国政府”紧跟历史和政府，不能错误地修饰后面的数字技术。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>因为代议制政府预设了知情的公民，报告支持全面识字，强调对历史和政府的学习，特别是美国历史和美国政府，并鼓励人们使用新的数字技术。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“强调对……的学习”改为“强调学习……”，减少名词化结构。<\/li>\n<li>三项主张用分号分开，避免一串逗号使具体范围与并列项目混在一起。<\/li>\n<li>“并鼓励使用”已经交代行动，不必另加“人们”重复补出泛指对象。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>因为代议制政府预设了知情的公民，报告支持全面识字；强调学习历史和政府，特别是美国历史和美国政府；并鼓励使用新的数字技术。<\/p>\n<\/blockquote>\n<h2>长难句4 · 第3段第3句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>To encourage innovation and competition, / the report calls for / increased investment in research, / the crafting of coherent curricula / that improve students&#39; ability / to solve problems / and communicate effectively / in the 21st century, / increased funding for teachers / and the encouragement of scholars / to bring their learning to bear / on the great challenges of the day.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>为了鼓励创新和竞争，/ 报告呼吁 / 增加研究投资，/ 制定连贯的课程 / 提高学生能力的 / 解决问题 / 并有效沟通 / 在21世纪，/ 增加对教师的资助 / 并鼓励学者 / 将他们的学识运用 / 在当今的重大挑战上。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把目的接在前面，并列读出投资和课程两项主张：<\/p>\n<blockquote>\n<p>为了鼓励创新和竞争，报告呼吁增加研究投资、制定连贯的课程<\/p>\n<\/blockquote>\n<p>课程要提高哪两种能力，合并后接到课程后：<\/p>\n<blockquote>\n<p>提高学生在21世纪解决问题和有效沟通的能力<\/p>\n<\/blockquote>\n<p>再把后两项支持与应用主张合起来：<\/p>\n<blockquote>\n<p>增加对教师的资助，并鼓励学者将学识运用于当今的重大挑战<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>为了鼓励创新和竞争，报告呼吁增加研究投资、制定连贯的课程<br>课程要提高学生在21世纪解决问题和有效沟通的能力<br>增加对教师的资助，并鼓励学者将学识运用于当今的重大挑战<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>报告为了鼓励创新和竞争，呼吁增加投入、改进课程并促进学识应用。<\/p>\n<\/blockquote>\n<p>先放总目的，再让“呼吁”统领四项内容。把学生能力的说明留在课程后；教师资助和学者应用另列出来，不能都塞进课程目标之中。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>为了鼓励创新和竞争，报告呼吁增加研究投资，制定能够提高学生在21世纪解决问题和有效沟通能力的连贯课程，增加对教师的资助，并鼓励学者把他们的学识用于当今的重大挑战。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>较长的能力说明放到“制定连贯的课程”之后，用“以提高”说明课程的目的。<\/li>\n<li>“解决问题和有效沟通能力”补成“解决问题和有效沟通的能力”，并列关系更自然。<\/li>\n<li>“把……用于”整理为“将……运用于”，保留学识面对具体挑战的应用关系。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>为了鼓励创新和竞争，报告呼吁增加研究投资，制定连贯的课程以提高学生在21世纪解决问题和有效沟通的能力，增加对教师的资助，并鼓励学者将他们的学识运用于当今的重大挑战。<\/p>\n<\/blockquote>\n<h2>长难句5 · 第4段第2句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>The commission ignores that for several decades America&#39;s colleges and universities have produced graduates who don&#39;t know the content and character of liberal education and are thus deprived of its benefits.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>The commission ignores / that for several decades / America&#39;s colleges and universities / have produced graduates / who don&#39;t know / the content and character / of liberal education / and are thus deprived / of its benefits.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>委员会忽视了 / 几十年来 / 美国的学院和大学 / 已经培养出毕业生 / 他们不知道 / 内容和特征 / 自由教育的 / 因此被剥夺了 / 它的好处。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把时间、学校和培养行为接起来：<\/p>\n<blockquote>\n<p>几十年来，美国的学院和大学已经培养出毕业生<\/p>\n<\/blockquote>\n<p>把毕业生缺少的认识合并成一块：<\/p>\n<blockquote>\n<p>不了解自由教育的内容和特征<\/p>\n<\/blockquote>\n<p>后半句是在说这种不了解的结果：<\/p>\n<blockquote>\n<p>他们因此被剥夺了自由教育的好处<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>委员会忽视了这样一种情况<br>几十年来，美国的学院和大学培养出的毕业生不了解自由教育的内容和特征<br>他们因此被剥夺了自由教育的好处<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>委员会忽视了毕业生不了解自由教育、因而失去其好处的情况。<\/p>\n<\/blockquote>\n<p>先交代委员会忽视了什么，再把几十年来的学校培养情况展开。把不了解的内容放到毕业生旁，最后用“因此”明确它与失去好处之间的联系。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>委员会忽视了这样一种情况：几十年来，美国的学院和大学已经培养出不知道自由教育的内容和特征的毕业生，这些毕业生因此被剥夺了这种教育的好处。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“不知道……内容和特征”整理成“不了解……内容和特征”，搭配更自然。<\/li>\n<li>省去“这样一种情况”，让“忽视了”直接接完整事实。<\/li>\n<li>末尾用“他们”承接毕业生，并明确“自由教育的好处”，避免“它”回指不清。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>委员会忽视了几十年来美国的学院和大学已经培养出不了解自由教育内容和特征的毕业生，他们因此被剥夺了自由教育的好处。<\/p>\n<\/blockquote>\n<h2>长难句6 · 第5段第1句<\/h2>\n<h3>原文<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>Today, / professors routinely treat / the progressive interpretation of history / and progressive public policy / as the proper subject of study / while portraying / conservative or classical liberal ideas – / such as free markets and self-reliance – / as falling outside the boundaries / of routine, / and sometimes legitimate, / intellectual investigation.<\/p>\n<\/blockquote>\n<h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>今天，/ 教授们经常对待 / 历史的进步主义解释 / 和进步主义公共政策 / 作为适当的研究主题 / 同时描绘 / 保守或古典自由主义思想 – / 如自由市场和自力更生 – / 作为落在边界之外 / 常规的，/ 有时是合法的，/ 智力研究。<\/p>\n<\/blockquote>\n<h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把受到认可的两类内容放在一起：<\/p>\n<blockquote>\n<p>教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题<\/p>\n<\/blockquote>\n<p>把另一组思想与举例合并：<\/p>\n<blockquote>\n<p>保守或古典自由主义思想，如自由市场和自力更生<\/p>\n<\/blockquote>\n<p>最后说这组思想被划到哪里，保留“有时”的程度限制：<\/p>\n<blockquote>\n<p>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>今天，教授们经常将两类进步主义内容作为适当的研究主题<br>与此同时，保守或古典自由主义思想，如自由市场和自力更生<br>被描绘为落在常规研究之外，有时还进一步被排除在正当研究之外<\/p>\n<\/blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>教授们将一类思想列为适当研究对象，却将另一类思想排除在研究边界之外。<\/p>\n<\/blockquote>\n<p>先说哪些思想被接纳，再用“同时”接哪些思想被排斥，形成同一主体的两种处理方式。举例紧贴保守或古典自由主义思想；“有时”只限定进一步被排除在正当研究之外的情况。这里讨论的是学术研究的正当性，须保留这种程度限制。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>今天，教授们经常把历史的进步主义解释和进步主义公共政策看作适当的研究主题，同时把保守或古典自由主义思想，例如自由市场和自力更生，描绘成处在常规研究的边界之外，有时还进一步被排除在正当的学术研究之外。<\/p>\n<\/blockquote>\n<h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>两边统一使用“将……作为”和“将……描绘为”，使对照更整齐。<\/li>\n<li>自由市场和自力更生用破折号作为插入举例，主线读起来更连贯。<\/li>\n<li>保留“有时甚至是”呈现程度递进，不能把作者指出的不同排斥程度压成一个笼统判断。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>今天，教授们经常将历史的进步主义解释和进步主义公共政策作为适当的研究主题，同时将保守或古典自由主义思想——如自由市场和自力更生——描绘为落在常规的、有时甚至是合法的智力研究边界之外。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>40题<\/h2>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>以下哪一项最适合作为本文标题？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Illiberal Education and “The Heart of the Matter”<\/strong><\/p>\n<p>不自由的教育与《问题的核心》<\/p>\n<p>B. <strong>The AAAS’s Contribution to Liberal Education<\/strong><\/p>\n<p>AAAS对博雅教育的贡献<\/p>\n<p>C. <strong>Ways to Grasp “The Heart of the Matter”<\/strong><\/p>\n<p>把握《问题的核心》的方法<\/p>\n<p>D. <strong>Progressive Policy vs. Liberal Education<\/strong><\/p>\n<p>进步主义政策与博雅教育的对立<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先肯定AAAS报告重视人文社科，随即批评它没有处理博雅教育危机的真实性质，可能弊大于利<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会要求AAAS提出维持国家领先的行动以及委员会成员构成<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告支持识字、历史政府、数字技术、研究投入、教师经费、外语与海外学习等目标<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告没有触及顶尖高校博雅教育中“不自由”的核心，毕业生不了解博雅教育，校园探究被宣传取代<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>说明教授把进步主义视为正当研究，却把保守主义和古典自由主义排除在正常研究边界外<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>总结AAAS虽热情高涨，其报告却可能掩盖挑战并阻碍改革<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>A. Illiberal Education and “The Heart of the Matter”<\/h3>\n<p>不自由的教育与《问题的核心》<\/p>\n<h4>如果 A 是主旨，文章6段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>不自由的教育与《问题的核心》<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先肯定《问题的核心》重视人文社科，再指出它没有识别博雅教育中压制开放探究的问题。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会委托AAAS研究如何维持人文社科教育的卓越，以及由高校负责人和各界人士组成的委员会为何承担审视教育危机的任务。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出这份报告在人文素养、课程、技术、师资和国际学习方面的目标，说明这些目标涵盖资源与能力建设。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避的核心是博雅教育自身的不自由：课程没有使学生理解博雅教育，思想宣传挤掉了开放探究。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>具体展示这种不自由：教授把进步主义列入正当研究，却把保守主义和古典自由主义思想排除在外。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：报告不正视思想封闭，就会掩盖真正的教育危机，使改革偏离需要解决的问题。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>实际文章第1段用赞扬作让步，随后批评报告没有处理危机的真实性质；第2、3段交代报告来历和目标，并没有改变批评对象。第4段揭开报告遗漏的内容——博雅教育中的不自由，第5段用教授对不同思想的双重标准把它说具体，第6段又回到报告可能妨碍改革。标题中的两个部分正好对应“真正的问题”和“没有正视问题的报告”，能够把前后连起来。<\/p>\n<p>判断：<\/p>\n<p><strong>A 保留。<\/strong><\/p>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>B. The AAAS’s Contribution to Liberal Education<\/h3>\n<p>AAAS对博雅教育的贡献<\/p>\n<h4>如果 B 是主旨，文章6段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>AAAS对博雅教育的贡献<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先肯定AAAS扩大公众对博雅教育的关注这一贡献，再指出它尚未把社会关注转化为课堂教学的实际改善。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会要求AAAS促进博雅教育发展的委托，以及教育界和公共领域成员如何共同承担把倡议转为教育成效的任务。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告在课程、教师、技术和国际学习方面的目标，作为衡量AAAS能为博雅教育带来哪些具体贡献的项目清单。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避了贡献能否落地的核心问题：它没有说明这些倡议如何进入课堂并产生可核查的教学改善。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>展示贡献尚未落地的表现：高校虽接受AAAS的倡议，课程实施和教师支持却没有随之改变，学生仍未得到预期帮助。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：从倡议到落实的缺口会限制AAAS的实际贡献；社会影响若被当成教育成效，就会遮住贡献尚未实现的部分。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>B把评价中心放在AAAS给博雅教育带来了什么。即便这种评价可以同时谈贡献与不足，也需要围绕贡献的项目、实现方式和实际成效展开。第1、3段确实承认报告有值得肯定的目标，但第4、5段集中展开的是高校中的思想封闭，第6段批评的是报告掩盖这种危机并可能阻碍改革。全文没有评估AAAS各项贡献的落实与效果；仅用“贡献”作标题，会淡化作者反复指出的诊断缺口。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>C. Ways to Grasp “The Heart of the Matter”<\/h3>\n<p>把握《问题的核心》的方法<\/p>\n<h4>如果 C 是主旨，文章6段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>把握《问题的核心》的方法<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先承认通读《问题的核心》能掌握报告建议，再指出只看建议清单仍不足以理解它怎样判断教育危机。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会给AAAS的任务及委员会成员背景，说明理解报告时要先查清谁提出问题、谁负责作答。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告的各项目标，并把辨认“目的、措施、预期效果”作为理解这些目标之间关系的方法。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避了检验其建议能否解决核心危机的问题，因此理解报告还要拿它的判断与校园实际情况核对。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>以课堂中的思想排斥展示这种核对法：逐项比较报告怎样描述教育与教授实际怎样组织研究，找出被省略的问题。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：缺少来源核查、目标梳理和现实比照，会把报告的愿望误读成完整诊断，进而误判改革所需的行动。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>C要求文章教读者怎样理解报告，因此假想文章要把查来源、理目标、对照实际等做法串成可操作的方法。实际第2段的国会任务是介绍被评论报告的背景，第3段列目标是为承认其可取之处，第4至6段是在指出遗漏并追究后果。作者在评价报告，没有把这些材料组织成读者应当遵循的理解步骤；“heart of the matter”的文字呼应也不能把评论文章变成方法指南。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>D. Progressive Policy vs. Liberal Education<\/h3>\n<p>进步主义政策与博雅教育的对立<\/p>\n<h4>如果 D 是主旨，文章6段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>进步主义政策与博雅教育的对立<\/p>\n<p>那文章6段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先承认进步主义政策推动公民教育的部分价值，再指出用特定政治目标支配课程会压缩博雅教育所需的开放空间。<\/td>\n<td>先承认一部分价值再指出缺口<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>交代国会委托AAAS研究公共政策目标与博雅教育之间的关系，以及政策界和高校成员共同审视两者冲突的任务。<\/td>\n<td>再说任务来源和参与者<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>列出报告中以公民参与、社会改革和公共政策能力为导向的教育目标，说明政策要求怎样进入课程安排。<\/td>\n<td>接着列出材料提出的目标<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>指出报告回避的核心是政策取向与自由探究的边界：把进步主义政策目标作为课程标准，会挤压不服务于该目标的思想。<\/td>\n<td>然后指出它回避了核心问题<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>展示两者冲突的现实表现：教授只把有利于进步主义政策的思想列入正当研究，而把质疑这些政策的思想排除。<\/td>\n<td>再说问题在现实中的表现<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>得出结论：政策目标与学术探究之间的边界未得到处理，进步主义政策对课堂的支配便会继续损害博雅教育。<\/td>\n<td>最后下结论：前面缺口会带来后果<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>第5段的进步主义公共政策与这个标题有关，但作者指责的是教授把一种思想当成正当研究、把其他思想排除在外，并没有比较进步主义政策本身的内容与博雅教育的原则。第1至3段始终围绕AAAS报告，第4段指出它忽视了思想封闭，第6段仍追究报告遮蔽危机的后果。D把用来说明不自由教育的一种表现扩大成全文对立面，也漏掉了贯穿首尾的报告批评。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<h3>40题结论<\/h3>\n<p><strong>40. A. Illiberal Education and “The Heart of the Matter”<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Illiberal Education and “The Heart of the Matter” / 不自由的教育与《问题的核心》<\/strong><\/p>\n<h2>36题<\/h2>\n<blockquote>\n<p>According to Paragraph 1, what is the author’s attitude toward the AAAS’s report?<br>根据第一段，作者对AAAS报告持什么态度？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道作者态度题。范围是第1段，对象是AAAS的整份报告。要把首句有限度的赞扬与第二句对核心缺陷的评价接起来，判断作者评价报告的主导方向。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<p>第一句的<code>deserves praise for<\/code>说明作者为何赞扬：报告肯定了人文社科的重要性。第二句由<code>Regrettably, however<\/code>转折，指出报告未处理真正的危机，并用<code>may cause more harm than good<\/code>评价可能的后果。题干问整份报告的态度，不能只截取其中一个赞扬词。<\/p>\n<h3>A. Critical.<\/h3>\n<blockquote>\n<p>批评的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文的<code>failure<\/code>和<code>crisis<\/code>等位置显示为<code>[xxx]<\/code>，但已读到<code>Regrettably, however<\/code>与<code>more harm than good<\/code>。因为首句同时有<code>deserves praise<\/code>，第一轮把A与B一起保留；40题主旨确定后，回看首段转折、后文的思想排斥和末段改革风险，才确定A。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>命题人没有复现某一个负面形容词，而是用<code>Critical<\/code>概括整段的评价重心。作者承认报告肯定人文社科有价值，但随即指出它没有处理危机的真实性质，甚至可能弊大于利。承认可取之处使批评有分寸，并没有取消批评。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持批评态度。<\/p>\n<\/blockquote>\n<p>题干限定第1段，态度要落在评价报告的两处谓语上：<code>deserves praise<\/code>与<code>may cause more harm than good<\/code>。连接两句的<code>Regrettably, however<\/code>决定前后怎样接起来。<\/p>\n<p>首句肯定的对象有限：报告强调了人文社科的重要性。后句批评的则是报告没有触及博雅教育危机的本质，并进一步指出这种缺失可能造成反效果。<\/p>\n<p><code>Critical<\/code>不要求作者否认报告的每一点价值。它保留了“承认一部分，但对核心判断和后果提出批评”的关系，也没有把<code>may<\/code>改成报告已经造成了损害。<\/p>\n<p>A把两句的转折关系概括为有依据的批评，覆盖了作者的主导态度。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>第4段指出报告没碰到真正的问题，结尾继续担心它掩盖挑战并妨碍改革。<\/p>\n<\/blockquote>\n<p>后文把首段“未处理真正危机”的批评展开成具体内容，又回到改革风险；并未把赞扬报告的目标作为结论。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report deserves credit for its aims, but its failure to confront illiberal education may hinder reform.<\/p>\n<p>这份报告的目标值得肯定，但它未能正视教育中的不自由，可能妨碍改革。<\/p>\n<\/blockquote>\n<p>A所需的推进正是原文已有的关系：先给目标以肯定，再指出诊断缺口，最后评估这个缺口的后果。批评落在报告的实质不足上。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>作者主要应批评这份报告没有正视博雅教育中的不自由，并担心这种遗漏妨碍改革；对个别目标的认可可以作为让步保留。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>Critical.<br>批评的<\/p>\n<\/blockquote>\n<p>A的批评对象是报告遗漏真正危机，主旨也把报告与不自由的教育联系起来。二者指向同一评价任务；局部的<code>Regrettably, however<\/code>和<code>more harm than good<\/code>进一步把这个方向落实。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<h3>B. Appreciative.<\/h3>\n<blockquote>\n<p>赞赏的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项没有遮挡，原文中<code>affirming<\/code>显示为<code>[xxx]<\/code>，但<code>deserves praise<\/code>清楚可见，因此B第一轮保留。后来40题确定了报告回避不自由教育这一主线，再看第4至6段持续批评报告遗漏核心并可能妨碍改革，才排除B。<\/p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。<\/strong><\/p>\n<p>B借用首句真实存在的赞扬，却把对报告某一点价值的认可拿来回答整份报告的主导态度。问题不在于作者从未赞扬，而在于赞扬后紧接的转折与后果判断被省略了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持赞赏态度。<\/p>\n<\/blockquote>\n<p><code>Appreciative<\/code>最直接对应<code>deserves praise<\/code>，但题干问的是对报告的态度，必须继续读同一段中的<code>Regrettably, however<\/code>，不能在第一句末尾结束定位。<\/p>\n<p>首句的<code>for affirming the importance<\/code>限定了赞扬理由：报告承认人文社科的重要性。这一局部肯定是真的。第二句则说报告没有处理危机本质，可能弊大于利。<\/p>\n<p>如果用“赞赏”统领全段，就把一个受理由限定的正面评价扩大成了总体判断，也让后面的明确转折失去了作用。<\/p>\n<p>B保留了局部赞扬这一事实，却没有回答题干要求的整体评价层面。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The goals identified in the report are generally admirable.<\/p>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者先承认报告目标总体可取，随后指出它没有触及教育中的不自由，最后仍担心它妨碍改革。<\/p>\n<\/blockquote>\n<p>第3段的正面内容没有一路展开到肯定报告的结尾；第4段又用<code>Unfortunately<\/code>把读者带回报告的缺陷。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report has limitations, yet its treatment of the central crisis gives liberal education a valuable basis for reform.<\/p>\n<p>这份报告虽有局限，但它对核心危机的处理为博雅教育改革提供了有价值的基础。<\/p>\n<\/blockquote>\n<p>若总体赞赏，承认不足后应当回到报告对核心改革的价值。实际结尾却是它可能掩盖挑战、使改革倒退，评价的终点相反。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>作者主要应批评报告没有正视博雅教育中的不自由；赞扬报告重视人文社科，只能构成这场批评中的有限认可。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>Appreciative.<br>赞赏的<\/p>\n<\/blockquote>\n<p>B抓住“值得赞扬”的局部内容，但主旨要求追问报告与不自由教育之间的缺口。把局部赞赏提升为全段重心，就解释不了作者为何接着讨论报告可能妨碍改革。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. Contemptuous.<\/h3>\n<blockquote>\n<p>轻蔑的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，虽然<code>affirming<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>deserves praise<\/code>。当时认为C把有保留的批评推成轻蔑，第一轮排除，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了报告可能弊大于利的负面评价，却进一步加入鄙视、不屑的意味。作者确实批评报告，但批评有明确理由，也认真承认报告值得肯定的部分；原文没有把这种批评写成轻蔑姿态。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持轻蔑态度。<\/p>\n<\/blockquote>\n<p>用<code>Contemptuous<\/code>判断态度，不能只找到<code>harm<\/code>这个负面词。还要核对评价理由和语气：作者先说<code>deserves praise<\/code>，再用<code>Regrettably<\/code>表达遗憾，指出报告未触及真正的危机。<\/p>\n<p>原文的负面判断围绕“没有处理危机本质”和“可能产生坏影响”展开，针对报告的内容与作用。<code>may<\/code>仍保留对后果的可能性判断。<\/p>\n<p>轻蔑意味着带着鄙视或不屑看待对象，比有理由的批评多出一种贬抑姿态。不能见到负面结论，就把所有负面态度词互换。<\/p>\n<p>C把具体、有限度的批评改成轻蔑，加入了原文并未呈现的态度强度。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The goals identified in the report are generally admirable.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者承认目标总体值得肯定，也承认AAAS热情很高，但继续指出报告可能产生的不良后果。<\/p>\n<\/blockquote>\n<p>实际写法不断分开“目标和热情可取”与“诊断不足”，批评的是报告的问题，不是用不屑的口气否定报告的价值。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report’s failure to address the crisis is contemptible.<\/p>\n<p>这份报告未处理危机的做法令人鄙视。<\/p>\n<\/blockquote>\n<p>这种写法才会直接体现C所说的轻蔑。实际文章认真讨论报告的任务、建议与遗漏，并未用鄙视的语气替代对报告缺陷的分析。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>主旨要求作者批评报告回避不自由教育，并不能进一步推出作者鄙视报告；批评的具体语气还要回到第1段。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>Contemptuous.<br>轻蔑的<\/p>\n<\/blockquote>\n<p>C在主旨所需的批评之外增加了轻蔑意味。首段的<code>deserves praise<\/code>与有理由的缺陷分析，加上后文承认目标可取，都不能支持这一额外态度。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. Tolerant.<\/h3>\n<blockquote>\n<p>宽容的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项完整可读，原文中<code>failure<\/code>、<code>crisis<\/code>显示为<code>[xxx]<\/code>，但<code>more harm than good<\/code>可读。做题时据此认为作者在警告缺陷的后果，没有表示接受这些不足，所以D第一轮排除，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D把作者承认报告的一部分优点理解成对其核心缺陷的包容。可是作者随即表达遗憾，指出报告遗漏危机本质且可能弊大于利；肯定目标不等于接受这项缺失。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.<\/p>\n<p>Regrettably, however, the report&#39;s failure to address the true nature of the crisis facing liberal education may cause more harm than good.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第一段，作者对AAAS报告持宽容态度。<\/p>\n<\/blockquote>\n<p><code>Tolerant<\/code>需要对应作者怎样看待报告的不足。首句虽有赞扬，第二句的<code>failure to address<\/code>与<code>may cause more harm than good<\/code>却正面追究不足及其可能后果。<\/p>\n<p>作者没有因为报告出发点良好就搁置问题，而是把“未处理真正危机”放在转折后的核心位置。<code>Regrettably<\/code>也表明他并不把这一缺失当作可以轻轻带过的小问题。<\/p>\n<p>宽容与批评在现实中未必互斥，但本题要选原文着重表达的态度；文中没有“这些不足可以接受”的说明，只有对它们可能带来危害的警告。<\/p>\n<p>D把承认可取之处误当成接受关键不足，弱化了原文的评价重点。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Unfortunately, despite 2½ years in the making, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>作者在后文继续追究报告不触及核心的问题，最后警告它可能使改革倒退。<\/p>\n<\/blockquote>\n<p>实际文章将首段提出的不足越说越具体，没有在指出问题后表示谅解或认为它无伤大雅。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report leaves the central crisis unaddressed, but this omission is understandable and should not count heavily against it.<\/p>\n<p>报告没有处理核心危机，但这一遗漏可以理解，不应因此过多责备它。<\/p>\n<\/blockquote>\n<p>D成立至少需要这种接受遗漏、减轻追责的推进。原文结尾反而解释遗漏怎样遮蔽挑战、妨碍改革，处理缺陷的方向不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入36题题干：<\/p>\n<blockquote>\n<p>作者应当把报告回避教育中的不自由当作需要批评的问题，而不是因目标良好就接受这一核心遗漏。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>Tolerant.<br>宽容的<\/p>\n<\/blockquote>\n<p>D把报告的不足放在可以包容的位置，主旨却围绕这个不足组织整篇评论。第1段的可能弊大于利和第6段的改革风险进一步说明，作者并未淡化其影响。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>36题结论<\/h3>\n<blockquote>\n<p><strong>36. A. Critical.<\/strong><\/p>\n<\/blockquote>\n<p>A把有限赞扬后的核心缺陷和后果评价概括为批评。<\/p>\n<p>B借用真实赞扬，却用局部认可替代整份报告的主导评价。<\/p>\n<p>C把针对内容和后果的批评加重成了轻蔑。<\/p>\n<p>D把承认报告有优点误成了对核心遗漏的宽容。<\/p>\n<h2>37题<\/h2>\n<blockquote>\n<p>Influential figures in the Congress required that the AAAS report on how to <strong><strong><strong>.<br>国会中的重要人物要求AAAS报告如何<\/strong><\/strong><\/strong>。<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道具体细节题。题干中的国会重要人物对应第2段的两党国会议员，问的是他们给AAAS的任务最终要达到什么目的。要区分提出要求的人、可以采取行动的人以及采取行动的目标。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<p><code>Influential figures in the Congress<\/code>对应<code>leading congressional Democrats and Republicans<\/code>，<code>required<\/code>对应来信中的<code>asking<\/code>。先由<code>identify actions<\/code>给出报告要研究的行动，再由<code>to maintain national excellence<\/code>给出这些行动服务的目标。空格要回答后者。<\/p>\n<h3>A. safeguard individuals’ rights to education<\/h3>\n<blockquote>\n<p>保障个人的受教育权<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，虽然原文的<code>benefactors<\/code>等词显示为<code>[xxx]<\/code>，仍读到了<code>maintain national excellence<\/code>。做题时把个人受教育权与国家层面的学术教育水平分开，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A沿用了教育这一话题，却把国会要求维持国家学术与教育卓越的任务，换成了保障个人受教育权。原句中的个人捐助者只是可采取行动的主体之一，也不是等待权利保障的对象。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保障个人的受教育权。<\/p>\n<\/blockquote>\n<p>题干的国会要求在第2段由<code>asking that it identify actions<\/code>引出。A中的<code>rights to education<\/code>要与目的从句<code>to maintain national excellence<\/code>比较，而不能仅凭双方都有<code>education<\/code>就接上。<\/p>\n<p>原句先列各方可以采取的行动，再说明行动服务于国家在人文和社会科学研究及教育领域的卓越水平。它没有把入学权、教育机会或权利保障作为这项任务的目标。<\/p>\n<p><code>individual benefactors<\/code>中的个人是捐助者，与政府、大学等并列，属于行动主体。把这一处的个人搬到“受教育权”前，会同时改换其身份和关系。<\/p>\n<p>A把国家层面的学术教育目标改成个人权利保障，回答的不是国会这次委托的目的。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<p>国会要求研究各方可以采取哪些行动来维持学术与教育卓越，AAAS随后成立相应的人文社科委员会。<\/p>\n<\/blockquote>\n<p>委员会的设立是回应这项教育研究任务；后面的成员名单介绍谁参与研究，没有把任务转向个人教育权保障。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The letters asked the AAAS to identify actions that would safeguard individuals’ rights to education.<\/p>\n<p>来信要求AAAS找出能够保障个人受教育权的行动。<\/p>\n<\/blockquote>\n<p>A成立只需把国会目标改成教育权保障，但原文同一位置写的是维持国家学术和教育卓越。两种写法的行动目的不同，参与主体中有个人也填补不了这个差别。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认国会委托与博雅教育面临的问题及改革有关，不能仅凭标题判断国会要求保障个人权利还是维持教育水平。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>safeguard individuals’ rights to education<br>保障个人的受教育权<\/p>\n<\/blockquote>\n<p>A需要“保障个人受教育权”这一具体任务，主旨没有给出它。本项最终仍要根据<code>maintain national excellence<\/code>这处局部原文判断：原文目标是维持国家学术和教育卓越，A改换了目标对象。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. define the government’s role in education<\/h3>\n<blockquote>\n<p>界定政府在教育中的角色<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B中的<code>government’s<\/code>显示为<code>[xxx]<\/code>，但<code>define<\/code>和<code>role in education<\/code>可读。原文里<code>identify actions<\/code>以及联邦、州和地方政府等行动主体也可读，因此已能分清“界定角色”与“找出各方可采取的行动”，第一轮排除B，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了原句列出的政府，却把政府与其他机构可以采取哪些行动，改成界定政府的职责角色。原文中的政府只是并列行动者之一，报告的最终目标也不是划定政府的权责边界。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何界定政府在教育中的角色。<\/p>\n<\/blockquote>\n<p><code>the government’s<\/code>对应原文的<code>federal, state and local governments<\/code>，而<code>define ... role<\/code>需要与<code>identify actions<\/code>核对。共同提到政府，不代表两处给政府安排的关系相同。<\/p>\n<p>原文的问题是“哪些行动可以由这些主体采取”，主体包括政府、大学、基金会、教育者和个人捐助者。来信希望这些行动维持人文社科的研究与教育卓越。<\/p>\n<p>选项的问题变成“政府在教育中是什么角色”，既把多个主体收窄成政府，又把寻找行动方案改成职责界定。行动研究涉及政府，并不自动等于重新划定政府角色。<\/p>\n<p>B同时改变了任务动词和主体范围，不能概括这次国会委托。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>国会要求寻找多方可采取的行动，报告继而提出研究投入、课程设计、教师经费和学者参与等措施。<\/p>\n<\/blockquote>\n<p>建议沿着如何改进学术与教育展开，没有把政府、大学和个人的权责边界作为讨论中心。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The AAAS was asked to define the government’s role in education and distinguish it from the roles of universities and private benefactors.<\/p>\n<p>AAAS被要求界定政府在教育中的角色，并将它与大学和私人捐助者的角色区分开。<\/p>\n<\/blockquote>\n<p>B所需的写法要讨论谁负责什么及角色边界。实际原文列各方能做的行动与共同目标，没有完成这一步职责界定。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>全文主旨说明报告应帮助认识博雅教育的真正挑战，不能据此确定国会是否要求界定政府角色；具体任务仍须看国会来信。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>define the government’s role in education<br>界定政府在教育中的角色<\/p>\n<\/blockquote>\n<p>B新增了政府角色界定这个任务。局部原文的<code>identify actions<\/code>要求提出行动，<code>maintain national excellence<\/code>说明行动目的；主旨对报告诊断不足的批评不能替B补出一项不同的委托。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. retain people’s interest in liberal education<\/h3>\n<blockquote>\n<p>保持人们对博雅教育的兴趣<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>maintain national excellence<\/code>也可读。做题时已比较出<code>retain<\/code>和<code>maintain<\/code>虽相近，后面的公众兴趣与国家卓越却不同，所以第一轮排除C，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C保留了“保持”这个动作，却把原文要保持的国家学术教育卓越替换成了人们的兴趣。两个命题同谈博雅教育，但一个关乎研究和教育水平，另一个关乎公众是否感兴趣。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保持人们对博雅教育的兴趣。<\/p>\n<\/blockquote>\n<p><code>retain<\/code>容易让人联想到目的从句里的<code>maintain<\/code>。真正需要继续核对的是两个动词后面的宾语：选项是<code>people’s interest<\/code>，原文是<code>national excellence<\/code>。<\/p>\n<p>原句用<code>in humanities and social scientific scholarship and education<\/code>限定国家卓越所属的领域；它没有把卓越解释为公众热情或关注度。<\/p>\n<p>即使社会兴趣有助于教育发展，这也是我们另加的一种可能联系。国会来信在此明说的目标仍是维持学术与教育水平，而非维持兴趣。<\/p>\n<p>C只对应了“保持”这个动作，替换了被保持的对象，完整命题因此改变。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>国会把目标定为维持学术与教育卓越，报告据此列出研究投入、课程能力和师资等方面的建议。<\/p>\n<\/blockquote>\n<p>实际展开关注教育研究怎样得到支持，未把吸引和留住公众兴趣作为国会任务的主线。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The letters asked the AAAS to identify ways to keep people interested in liberal education.<\/p>\n<p>来信要求AAAS找出让人们继续对博雅教育感兴趣的办法。<\/p>\n<\/blockquote>\n<p>C成立需要在国会目标中明确出现公众兴趣。原文相应位置给的是国家卓越；后文对教育能力和资源的讨论也没有把这个目标改成兴趣维持。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>主旨只能确认这是一份应当面对博雅教育危机的报告，不能判断国会要求保持的是公众兴趣还是教育卓越。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>retain people’s interest in liberal education<br>保持人们对博雅教育的兴趣<\/p>\n<\/blockquote>\n<p>C中的公众兴趣不是标题可以推出的具体任务。本项仍要比较<code>maintain national excellence<\/code>：它以国家的学术教育水平为对象，不能用方向相近的“支持博雅教育”概念抹掉与公众兴趣的差别。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. keep a leading position in liberal education<\/h3>\n<blockquote>\n<p>保持博雅教育的领先地位<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整可读，原文中<code>maintain national excellence<\/code>和人文社科教育的范围也可读。虽然委员会名称、部分成员描述和捐助者处显示为<code>[xxx]<\/code>，不影响核对任务目标；第一轮保留D，其他三项排除后确定D，后续未变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>keep<\/code>对应<code>maintain<\/code>，<code>a leading position<\/code>概括<code>national excellence<\/code>所表达的卓越地位。<code>liberal education<\/code>结合全文语境概括这里的人文与社会科学教育，保留了国会希望维持教育卓越的目标。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>国会中的重要人物要求AAAS报告如何保持博雅教育的领先地位。<\/p>\n<\/blockquote>\n<p>定位依靠国会来信中的<code>asking<\/code>与目的从句<code>to maintain national excellence<\/code>。D中的<code>keep a leading position<\/code>正要对应这个目的，而不是报告组建委员会的过程。<\/p>\n<p>原文先说AAAS要找出各方可以采取的行动，随后说明行动目标是维持国家在人文和社会科学学术与教育方面的卓越。选项保留“维持”与“卓越地位”这两个核心部分。<\/p>\n<p>这里的“领先”是对<code>excellence<\/code>所指卓越水平的概括，不需要另外推成某个具体国际排名。范围仍是全文讨论的博雅教育，不是所有学科或所有教育事务。<\/p>\n<p>D准确改写了国会交给AAAS的目标，没有把行动主体、报告任务和教育目标混为一谈。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by &quot;federal, state and local governments, universities, foundations, educators, individual benefactors and others&quot; to &quot;maintain national excellence in humanities and social scientific scholarship and education.&quot;<\/p>\n<p>In response, the American Academy formed the Commission on the Humanities and Social Sciences. Among the commission&#39;s 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>国会提出维持人文社科卓越的任务，AAAS成立委员会回应，结尾作者又追问报告是否看清了国会要求揭示的挑战。<\/p>\n<\/blockquote>\n<p>文章从任务走向报告，再回到报告是否完成任务。作者批评报告表现，并没有更换国会最初提出的目标。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The AAAS was asked to propose actions that would help the country maintain excellence in liberal education.<\/p>\n<p>AAAS被要求提出行动，帮助国家维持博雅教育的卓越水平。<\/p>\n<\/blockquote>\n<p>D所需的写法能够在国会来信中找到：提出行动服务于维持卓越。报告后来是否真正做到，是作者另一个层面的评价，不影响国会任务本身。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入37题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认国会的委托涉及博雅教育的真实挑战，不能单凭标题推出“保持领先地位”这一具体措辞。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>keep a leading position in liberal education<br>保持博雅教育的领先地位<\/p>\n<\/blockquote>\n<p>D最终由局部原文<code>maintain national excellence<\/code>支持。主旨解释了作者为什么要追问报告能否服务于这项任务，但“维持卓越”的目标必须从来信取得，不能靠主题相符替代。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>37题结论<\/h3>\n<blockquote>\n<p><strong>37. D. keep a leading position in liberal education<\/strong><\/p>\n<\/blockquote>\n<p>A把维持国家学术教育卓越的任务改成保障个人受教育权。<\/p>\n<p>B把多方行动方案改成了政府角色和职责的界定。<\/p>\n<p>C借用“保持”这个动作，却把国家卓越换成公众兴趣。<\/p>\n<p>D用“保持领先地位”概括国会要求维持学术与教育卓越的目标。<\/p>\n<h2>38题<\/h2>\n<blockquote>\n<p>According to Paragraph 3, the report suggests <strong><strong><strong>.<br>根据第三段，这份报告建议<\/strong><\/strong><\/strong>。<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道段落细节题。对象是报告，范围限定第3段，要求识别报告实际提出的一项建议。段内并列建议很多，要核对每个动作与它自己的对象，不能把相邻建议拼成新主张。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<p>题干中的<code>suggests<\/code>可对应<code>supports<\/code>、<code>stresses<\/code>、<code>encourages<\/code>、<code>calls for<\/code>和<code>advocates<\/code>。这些动词各自连接不同建议：全面识字、历史政府研究、新技术使用、课程和师资投入、外语与国际学习。某个名词确实出现，不代表选项给它配的限定和动作也成立。<\/p>\n<h3>A. an exclusive study of American history<\/h3>\n<blockquote>\n<p>只研究美国历史<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A没有遮挡，原文中<code>literacy<\/code>显示为<code>[xxx]<\/code>，但<code>particularly American history<\/code>以及历史、政府、数字技术的并列建议可读。做题时区分了“尤其强调”与“只研究”，第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A直接借用报告对美国历史的强调，却把<code>particularly<\/code>改成<code>exclusive<\/code>。原文是在较广的历史与政府研究中突出美国内容，选项却变成只研究美国历史，排除了其他内容。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议只研究美国历史。<\/p>\n<\/blockquote>\n<p><code>American history<\/code>把选项带回<code>stresses the study of history and government<\/code>这一建议，限定词<code>particularly<\/code>要与A的<code>exclusive<\/code>逐一比较。<\/p>\n<p>原文先给出历史与政府这两个研究对象，再说尤其是美国历史和美国政府；同句还鼓励新数字技术，后句又建议加强外语和国际事务学习。美国历史是重点之一，并非唯一范围。<\/p>\n<p><code>particularly<\/code>是在已有范围里加重某一部分，<code>exclusive<\/code>则会把其他部分排除。二者不能因为都突出美国历史而视为同义。<\/p>\n<p>A把优先强调改成排他限制，收窄了原文允许并鼓励的学习内容。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<p>报告强调美国历史与政府，同时保留技术、外语、国际事务和海外学习等并列建议。<\/p>\n<\/blockquote>\n<p>实际段落一路增加学习和支持的项目，没有在强调美国历史后排除其他领域。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report recommends studying American history to the exclusion of other historical and international subjects.<\/p>\n<p>报告建议只研究美国历史，排除其他历史与国际领域的内容。<\/p>\n<\/blockquote>\n<p>A成立要出现这种排他关系。实际后文继续倡导外语和国际事务学习，范围持续展开，与“只研究美国历史”的限制不能对上。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能判断报告第3段是否要求只研究美国历史；它只能提醒我们区分报告列出的目标与报告遗漏的思想开放问题。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>an exclusive study of American history<br>只研究美国历史<\/p>\n<\/blockquote>\n<p>A的排他限制必须由建议原句支持。这里的<code>particularly<\/code>只表示特别强调，而<code>greater study of foreign languages, international affairs<\/code>仍保留其他领域；不能因全文批评不自由教育，就反过来把报告的全部建议都解释成排他的。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. a greater emphasis on theoretical subjects<\/h3>\n<blockquote>\n<p>更加重视理论学科<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B中的<code>greater<\/code>显示为<code>[xxx]<\/code>，<code>emphasis on theoretical subjects<\/code>可读；原文关于全面识字和课程设计的部分词语也被遮挡，但新数字技术、解决问题及沟通能力可读。做题时认为这些建议不能被概括成以理论学科为重点，第一轮排除B，后续未变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B借用了报告重视人文社科、历史研究等信息，又补出“更加重视理论学科”这一比较性主张。原文列出了知识、技术、课程和实际能力方面的建议，并未把它们划成理论与实践两类，也没有说要提高理论学科的相对地位。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议更加重视理论学科。<\/p>\n<\/blockquote>\n<p><code>emphasis<\/code>可以使人想到原文的<code>stresses<\/code>，<code>theoretical subjects<\/code>又容易让人联想到历史和人文社科；但定位后还要找出原文是否真的作了理论学科的比较与加权。<\/p>\n<p>报告强调历史和政府研究，又鼓励新技术使用；随后要求课程提升解决问题和有效沟通的能力。原文没有把历史研究全部等同于理论学科。<\/p>\n<p>实践能力受到重视，本身并不能证明理论学科不受重视；真正缺少的是B所说的完整关系：相较于过去或其他内容，要把更多重点放在理论学科上。不能替作者补出这个比较。<\/p>\n<p>B把若干知识领域的名称合成为“理论学科”，再添加更大侧重，原文没有提出这一建议。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>后文从研究投资写到课程设计，明确要求提高学生解决问题和有效沟通的能力。<\/p>\n<\/blockquote>\n<p>实际展开把投入和课程联系到学生能力，没有随后区分理论与实践并决定把重点移向理论。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report calls for curricula that place greater emphasis on theoretical subjects than they currently do.<\/p>\n<p>报告要求课程比目前更加重视理论学科。<\/p>\n<\/blockquote>\n<p>B所需的最小改动是补出对理论学科权重的提高。实际课程建议说的是改善问题解决和沟通能力，两者可以在现实中共存，但后一主张并不自动包含前一主张。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能判定报告是否建议更加重视理论学科；关于报告遗漏教育危机的批评，不等于对每一项课程建议作出理论或实践的选择。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>a greater emphasis on theoretical subjects<br>更加重视理论学科<\/p>\n<\/blockquote>\n<p>B增加的是理论学科的比较地位，这不能从标题推出。局部原文的课程目标是<code>improve students’ ability to solve problems and communicate effectively<\/code>，并没有提供“更加重视理论学科”所需的比较。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. the application of emerging technologies<\/h3>\n<blockquote>\n<p>应用新兴技术<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>use of new digital technologies<\/code>也可读。做题时已将<code>application<\/code>与<code>use<\/code>、<code>emerging<\/code>与<code>new<\/code>对应起来，第一轮保留C，其他三项排除后确定C，后续未变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>原文鼓励使用新的数字技术，C把<code>use<\/code>换成<code>application<\/code>，并用新兴技术概括这里的新数字技术。报告的动作仍是鼓励应用，对象仍是新技术，没有变成单纯研究技术或已经完成技术应用。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议应用新兴技术。<\/p>\n<\/blockquote>\n<p><code>technologies<\/code>对应报告并列建议中的<code>new digital technologies<\/code>。动词<code>encourages<\/code>表明这是建议，后面的<code>use<\/code>说明所建议的具体动作。<\/p>\n<p>原句明确说报告鼓励使用新数字技术。选项的<code>application<\/code>表示应用，保留<code>use<\/code>的动作；<code>emerging technologies<\/code>在这里概括新出现的数字技术。<\/p>\n<p>这种概括省略了数字技术的具体类别，但没有额外限定“所有新兴技术都要使用”，也没有把建议说成应用已经完成。题干问报告建议什么，一项明确建议即可回答。<\/p>\n<p>C保留了报告的建议性质、应用动作和新技术对象，能够准确接回题干。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.<\/p>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>报告把新数字技术使用列入建议，随后继续提出研究投入与提升学生能力的课程措施。<\/p>\n<\/blockquote>\n<p>实际文章在介绍报告的可取目标，这些具体措施允许技术应用与课程能力建设并列；作者之后批评报告的核心遗漏，并不抹掉这项建议确实存在的事实。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report recommends applying new digital technologies as part of its educational proposals.<\/p>\n<p>报告把应用新数字技术列为教育建议的一部分。<\/p>\n<\/blockquote>\n<p>C所需要的写法就是原文的<code>encourages the use of new digital technologies<\/code>。后面增加其他措施不会改变这一项建议的动作和对象。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能单独推出报告建议应用新兴技术；要回答第3段的一项具体建议，仍需核对该段列举。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>the application of emerging technologies<br>应用新兴技术<\/p>\n<\/blockquote>\n<p>C由<code>encourages the use of new digital technologies<\/code>支持。主旨批评的是报告没有面对教育中的不自由，并不是说报告所有建议都不可取，因此这项技术建议与全文的让步后批评结构可以同时成立。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<h3>D. funding for the study of foreign languages<\/h3>\n<blockquote>\n<p>为外语学习提供资金<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D中的<code>study<\/code>显示为<code>[xxx]<\/code>，但<code>funding<\/code>和<code>foreign languages<\/code>可读；原文的<code>increased funding for teachers<\/code>与<code>greater study of foreign languages<\/code>也可读。做题时已分清教师经费与外语学习是两项建议，第一轮排除D，后续未变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D把报告中的教师经费和外语学习拼接起来，形成外语学习经费这一新关系。两个词组都来自第3段，但原文没有说增加的经费是为外语学习而设。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第三段，AAAS报告建议为外语学习提供资金。<\/p>\n<\/blockquote>\n<p>定位时需要同时找到<code>funding<\/code>与<code>foreign languages<\/code>，再看两者是否属于同一建议。原文前一处是<code>funding for teachers<\/code>，后一处是<code>greater study of foreign languages<\/code>。<\/p>\n<p>经费的对象由<code>for teachers<\/code>明示为教师；另起一句的<code>also advocates<\/code>再提出加强外语和国际事务学习等建议。前句资金关系没有延伸到后句所有项目。<\/p>\n<p>外语学习在现实中当然可能需要资金，但选项问的是报告有没有提出这项资助。仅凭资助教师和鼓励外语学习同时出现，无法补出经费专门投向外语学习的关系。<\/p>\n<p>D把不同建议中的动作与对象重新配对，写出原文没有提出的资金用途。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#39; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.<\/p>\n<p>The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.<\/p>\n<p>报告先说增加教师经费，随后另说加强外语、国际事务学习与海外项目。<\/p>\n<\/blockquote>\n<p>两个句子各自给出不同建议；第二句的<code>also<\/code>表示新增建议，并不是补充前句经费的用途。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The report also advocates increased funding for the study of foreign languages.<\/p>\n<p>报告还主张增加用于外语学习的资金。<\/p>\n<\/blockquote>\n<p>D成立需要把资金与外语学习明确连在一起。实际这一句只有加强学习的建议，资金对象仍留在前句的教师，关系不能跨句自行补齐。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入38题题干：<\/p>\n<blockquote>\n<p>全文主旨不能判断报告某项资金具体给了谁，也不能把支持外语学习自动解释成资助外语学习。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>funding for the study of foreign languages<br>为外语学习提供资金<\/p>\n<\/blockquote>\n<p>D所需的是资金用途这一局部关系，标题不提供这个信息。本项最终仍要根据<code>increased funding for teachers<\/code>及<code>greater study of foreign languages<\/code>判断：一个给经费对象，一个给学习内容，原文未将二者相连。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>38题结论<\/h3>\n<blockquote>\n<p><strong>38. C. the application of emerging technologies<\/strong><\/p>\n<\/blockquote>\n<p>A把“尤其强调美国历史”改成了“只研究美国历史”。<\/p>\n<p>B从学科名称和重视学习补出了提高理论学科权重的主张。<\/p>\n<p>C准确改写了报告鼓励使用新数字技术的建议。<\/p>\n<p>D把教师经费与外语学习两项建议拼成了外语学习资助。<\/p>\n<h2>39题<\/h2>\n<blockquote>\n<p>The author implies in Paragraph 5 that professors are <strong><strong><strong>.<br>作者在第五段暗示，教授们<\/strong><\/strong><\/strong>。<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部推断题。题干限定第5段，对象是作者所批评的教授，要求从他们如何划分研究对象推断其思想倾向。明示事实是一边被看作正当研究，另一边却被排除；推断不能超出这种不对等的学术标准。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<p><code>treat ... as the proper subject of study<\/code>写教授怎样对待进步主义；<code>while portraying ... as falling outside<\/code>写他们怎样对待保守主义和古典自由主义。两边对象不同，评价标准也不同。作者据此批评学术排斥，而不是讨论所有研究都要谨慎，或直接给教授的每项政策立场定性。<\/p>\n<h3>A. supportive of free markets<\/h3>\n<blockquote>\n<p>支持自由市场<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A中的<code>free<\/code>显示为<code>[xxx]<\/code>，原文中的<code>routinely<\/code>和<code>portraying<\/code>也被遮挡，但<code>markets<\/code>、<code>classical liberal ideas<\/code>与<code>outside the boundaries<\/code>可读。做题时据此认为教授把这一类思想排除在研究范围外，不能概括为支持，所以第一轮排除A，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了原文的自由市场，却把教授对它所属思想类别的排斥改成支持。自由市场是保守主义或古典自由主义思想的例子；作者说教授将这类思想放在常规、有时甚至正当研究的边界之外。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们支持自由市场。<\/p>\n<\/blockquote>\n<p><code>free markets<\/code>位于<code>such as<\/code>引出的例子中，它要接回前面的<code>conservative or classical liberal ideas<\/code>，再一起接受<code>portraying ... as falling outside<\/code>的说明。<\/p>\n<p>教授先把进步主义历史解释和公共政策当作合适的研究对象，再把保守主义或古典自由主义思想描述成研究边界之外的东西。自由市场属于被后一部分处理的例子。<\/p>\n<p>题干问的是这段能够暗示的教授倾向，原文提供的是把自由市场思想排除在常规、有时甚至正当探究之外的学术态度，并没有把他们写成自由市场的支持者。<\/p>\n<p>A把被排斥的研究对象改成得到支持的对象，改变了教授与自由市场之间的态度关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>前文说思想宣传取代开放探究，第5段接着展示进步主义被认可而古典自由主义被排斥。<\/p>\n<\/blockquote>\n<p>自由市场这个例子用来说明后者怎样被排除，不是用来展示教授支持何种市场制度。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors welcome free-market ideas and speak in support of them.<\/p>\n<p>教授欢迎自由市场思想，并表达对它们的支持。<\/p>\n<\/blockquote>\n<p>A成立至少需要这种正面支持的描述。实际文章把自由市场列在被视为研究边界之外的思想中，承担的是说明排斥的作用。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>在教育不自由的主线下，本段应指出教授怎样限制思想探究；是否支持自由市场，还要看自由市场在第5段被放在哪一边。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>supportive of free markets<br>支持自由市场<\/p>\n<\/blockquote>\n<p>A说支持自由市场，但它在局部原文中是被排除的古典自由主义思想的例子。主旨要求解释思想封闭，而这项正面支持既不是本段给出的方向，也无法代替对双重标准的批评。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. biased against classical liberal ideas<\/h3>\n<blockquote>\n<p>对古典自由主义思想有偏见<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整可读。虽然原文的<code>routinely<\/code>和<code>portraying<\/code>显示为<code>[xxx]<\/code>，但一边是<code>proper subject of study<\/code>、另一边在研究<code>boundaries<\/code>之外的对照可读。做题时用这种不对等标准概括<code>biased against<\/code>，第一轮保留B并确定答案，后续未变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>B没有照抄原文，而是将两类思想受到不同待遇这一事实概括为偏见。教授承认进步主义是正当研究对象，却排除古典自由主义；偏见体现在对研究对象的选择性认可与排斥上。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们对古典自由主义思想有偏见。<\/p>\n<\/blockquote>\n<p><code>classical liberal ideas<\/code>给出相同对象，<code>biased against<\/code>则要从<code>while<\/code>两边的待遇比较中判断：一边是合适的研究对象，另一边被放到研究边界之外。<\/p>\n<p>原文没有只说教授研究进步主义，而是紧接着写他们如何对待其他思想。<code>proper subject<\/code>与<code>outside the boundaries<\/code>一起构成不同标准。<\/p>\n<p>如果只是专业分工，未研究另一领域未必叫偏见；但作者进一步说另一类思想有时连正当研究都不被承认，并在前段把这种做法放在宣传取代探究的批评中。推断因此落在学术上的不公正排斥。<\/p>\n<p>B用“对古典自由主义思想有偏见”概括这组对照，既保留被排斥的对象，也没有扩大成教授在所有生活问题上都有偏见。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.<\/p>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<p>The AAAS displays great enthusiasm for liberal education. Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.<\/p>\n<p>文章先批评宣传取代探究，再写教授对两类思想的不对等处理，最后指出报告掩盖了这种挑战。<\/p>\n<\/blockquote>\n<p>第5段是第4段“不自由”的具体表现；结尾的报告批评也以这种真实教育问题未被正视为依据。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Professors accept progressive ideas as legitimate subjects but unfairly exclude classical liberal ideas from intellectual inquiry.<\/p>\n<p>教授认可进步主义思想为正当研究对象，却不公正地把古典自由主义思想排除在学术探究之外。<\/p>\n<\/blockquote>\n<p>B所需要的就是这种选择性排斥。它对应原文<code>proper subject<\/code>与<code>outside the boundaries<\/code>的对照，也能承接前文对思想宣传的批评。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>40题的正确答案是：<\/p>\n<blockquote>\n<p>Illiberal Education and “The Heart of the Matter”<br>不自由的教育与《问题的核心》<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入39题题干：<\/p>\n<blockquote>\n<p>作者应通过教授对不同思想的不平等取舍，说明博雅教育怎样失去开放探究精神；古典自由主义是被排斥的一方，由第5段具体确认。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>biased against classical liberal ideas<br>对古典自由主义思想有偏见<\/p>\n<\/blockquote>\n<p>B把不自由的教育落实为对古典自由主义思想的偏见。这个对象和方向既接得上主旨中的思想封闭，也有局部两边不同待遇的直接依据。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. cautious about intellectual investigation<\/h3>\n<blockquote>\n<p>对学术研究持谨慎态度<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整可读，原文中的<code>intellectual investigation<\/code>及<code>outside the boundaries<\/code>也可读。做题时判断原文是在说选择性排除某类思想，不是一般谨慎，因此第一轮排除C，后续未变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C沿用学术研究这一表述，却把某类思想被排除在研究范围之外，改写为教授对研究持谨慎态度。原文是在批评取舍标准有偏向，选项把这个关系改成了不带特定对象的审慎。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas – such as free markets and self-reliance – as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第五段暗示，教授们对学术研究持谨慎态度。<\/p>\n<\/blockquote>\n<p><code>intellectual investigation<\/code>在原句末尾，但它受<code>outside the boundaries of routine, and sometimes legitimate<\/code>限制。必须读清是谁被放在这些边界之外，而不能只取“学术研究”四个字。<\/p>\n<p>被排除的是保守主义或古典自由主义思想；与之对照，进步主义被当作适当的研究内容。作者比较的是思想类别受到的待遇，不是教授调查证据时有多小心。<\/p>\n<p>谨慎研究通常要有慎下结论、核实证据等行为作支持。第5段没有给出这些行为；它给出的是一类可研究、另一类被排除在常规研究之外，有时甚至不被视为正当研究的差别。<\/p>\n<p>C把针对特定思想的选择性排斥，改成对学术研究的一般审慎，丢失了作者着重批评的对象
