<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"### 36. The underlined sentence (Para. 1) most probably shows that the court ______.\n\n第一段画线句最可能说明法院持何种态度或采取什么做法？\n\n这一题问：句意题。","contextRaw":"","html":"<h3>36. The underlined sentence (Para. 1) most probably shows that the court ______.</h3>\n<p>第一段画线句最可能说明法院持何种态度或采取什么做法？</p>\n<p>这一题问：句意题。</p>\n","articleRects":[],"questionRects":[[188,158,990,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"### 37. According to Paragraph 4, an official act is deemed corruptive only if it involves ______.\n\n根据第四段，一项公务行为只有涉及什么才被认定具有腐败性质？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>37. According to Paragraph 4, an official act is deemed corruptive only if it involves ______.</h3>\n<p>根据第四段，一项公务行为只有涉及什么才被认定具有腐败性质？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,464,997,32],[235,522,210,27]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"### 38. The court’s ruling is based on the assumption that public officials are ______.\n\n法院裁决所依据的关于公职人员的假定是什么？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>38. The court’s ruling is based on the assumption that public officials are ______.</h3>\n<p>法院裁决所依据的关于公职人员的假定是什么？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,821,989,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"### 39. Well-enforced laws in government transparency are needed to ______.\n\n政府透明方面得到良好执行的法律，是为实现什么目的而需要的？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>39. Well-enforced laws in government transparency are needed to ______.</h3>\n<p>政府透明方面得到良好执行的法律，是为实现什么目的而需要的？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,1127,908,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"### 40. The author’s attitude toward the court’s ruling is ______.\n\n作者对法院这项裁决持什么态度？\n\n这一题问：全文作者观点 / 全文主旨题。","contextRaw":"","html":"<h3>40. The author’s attitude toward the court’s ruling is ______.</h3>\n<p>作者对法院这项裁决持什么态度？</p>\n<p>这一题问：全文作者观点 / 全文主旨题。</p>\n","articleRects":[],"questionRects":[[187,1434,748,33]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, while, unless, Rather |\n| 态度词 / 评价词 | 先抓个大概好坏 | nasty, legally sound, a step forward |\n| 动作词 | 先看谁做了什么 | overturned, accepting, help, ensure |\n| 结果词 | 看最后出了什么事 | conviction, benefits, equality, double standards |\n| 重复主题词 | 大概知道老在说什么 | court, ruling, official acts, access |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>But, while, unless, Rather</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>nasty, legally sound, a step forward</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>overturned, accepting, help, ensure</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>conviction, benefits, equality, double standards</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>court, ruling, official acts, access</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"In a rare **[xxx]** ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. But it did so while holding its nose at the **[xxx]** of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>In a rare <span class=\"mask\">[xxx]</span> ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. But it did so while holding its nose at the <span class=\"mask\">[xxx]</span> of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.</p>\n</div></div>","articleRects":[[168,240,996,196]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":0,"form":0}},{"section":"读文章","raw":"In a rare **[xxx]** ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. / But it did so while holding its nose at the **[xxx]** of his conduct, / which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>In a rare <span class=\"mask\">[xxx]</span> ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. / But it did so while holding its nose at the <span class=\"mask\">[xxx]</span> of his conduct, / which included accepting gifts such as a Rolex watch and a Ferrari automobile from a compa ts":[[168,1597,996,67]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":7,"form":3}},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现美国最高法院、腐败定罪、前州长、接受礼物；中间有法官、正式行为、接受好处、合同获批、帮助支持者；后面又出现接触机会平等、竞选捐款、执行有力的法律、双重标准、向前一步。\n\n到这里还不能自然地说清楚：推翻定罪与对收礼的态度怎样并存、什么算这里的公务行为、回应选民与特殊照顾有什么区别、最后肯定的究竟是哪一件事。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。","contextRaw":"","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现美国最高法院、腐败定罪、前州长、接受礼物；中间有法官、正式行为、接受好处、合同获批、帮助支持者；后面又出现接触机会平等、竞选捐款、执行有力的法律、双重标准、向前一步。</p>\n<p>到这里还不能自然地说清楚：推翻定罪与对收礼的态度怎样并存、什么算这里的公务行为、回应选民与特殊照顾有什么区别、最后肯定的究竟是哪一件事。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> The underlined sentence (Para. 1) most probably shows that the court ______.  \n> 第一段画线句最可能说明法院持何种态度或采取什么做法？\n\n题干用Para. 1指定第一段，并要求看画线句。先把整个第一段读下来，弄清did so所指的前一动作，再看while后面另写了什么，不能把两层混成一句。\n\n> 原文参考：\n>\n> In a rare **[xxx]** ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. But it did so while holding its nose at the **[xxx]** of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\n>\n> 开始精读：\n>\n> In a rare **[xxx]** ruling, / the US Supreme Court has overturned the corruption conviction / of a former Virginia governor, Robert McDonnell. / But it did so / while holding its nose at the **[xxx]** of his conduct, / which included accepting gifts such as a Rolex watch and a Ferrari automobile / from a company seeking access to government.\n>\n> 顺着英文顺序读：\n>\n> 在一项少见的 **[xxx]** 裁决中， / 美国最高法院已经推翻了腐败定罪， / 对前弗吉尼亚州州长罗伯特·麦克唐纳的定罪。 / 但它这样做时， / 同时对他行为的 **[xxx]** 捏着鼻子， / 这些行为包括收下劳力士手表和法拉利汽车这样的礼物， / 来自一家想接触政府的公司。","contextRaw":"","html":"<h2>36题</h2>\n<blockquote>\n<p>The underlined sentence (Para. 1) most probably shows that the court ______.<br />\n第一段画线句最可能说明法院持何种态度或采取什么做法？</p>\n</blockquote>\n<p>题干用Para. 1指定第一段，并要求看画线句。先把整个第一段读下来，弄清did so所指的前一动作，再看while后面另写了什么，不能把两层混成一句。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In a rare <span class=\"mask\">[xxx]</span> ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell. But it did so while holding its nose at the <span class=\"mask\">[xxx]</span> of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.</p>\n<p>开始精读：</p>\n<p>In a rare <span class=\"mask\">[xxx]</span> ruling, / the US Supreme Court has overturned the corruption conviction / of a former Virginia governor, Robert McDonnell. / But it did so / while holding its nose at the <span class=\"mask\">[xxx]</span> of his conduct, / which included accepting gifts such as a Rolex watch and a Ferrari automobile / from a company seeking access to government.</p>\n<p>顺着英文顺序读：</p>\n<p>在一项少见的 <span class=\"mask\">[xxx]</span> 裁决中， / 美国最高法院已经推翻了腐败定罪， / 对前弗吉尼亚州州长罗伯特·麦克唐纳的定罪。 / 但它这样做时， / 同时对他行为的 <span class=\"mask\">[xxx]</span> 捏着鼻子， / 这些行为包括收下劳力士手表和法拉利汽车这样的礼物， / 来自一家想接触政府的公司。</p>\n</blockquote>\n","articleRects":[[168,240,996,196]],"questionRects":[[188,158,990,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"36"}},{"section":"36题","raw":"### A. made no compromise in convicting McDonnell\n\n> 在给麦克唐纳定罪时没有作出妥协\n\n把A接回题干，它说的是：第一段画线句表明，法院在给麦克唐纳定罪时毫不妥协。\n\nA的 `convicting McDonnell` 指对麦克唐纳定罪，第一段的 `overturned the corruption conviction` 说的也是该项定罪，因此回到画线句前一句，再看did so所指的法院动作。\n\n> In a rare **[xxx]** ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.\n\n`overturned the corruption conviction` 是把原有腐败定罪推翻，A的 `convicting McDonnell` 却让法院继续承担“定罪”这个动作。画线句里的did so指回的是推翻定罪，不会因为后面出现捏鼻子的态度，就突然变成坚持给他定罪。\n\n这里有两层需要分开：法院对定罪作了什么处理，以及它对这个人的行为持什么态度。But正是把二者放在不完全一致的方向上。对收礼行为反感，仍可以不认可原来的法律定罪；A把行为评价直接换成了定罪结果，因而读反了前一句的动作。\n\n**法院推翻原来的腐败定罪，能不能改写成它在给麦克唐纳定罪时毫不妥协？**\n\n不能。overturned已经明确改变了定罪，A却把动作写成继续定罪。\n\nA的司法动作方向与原文相反，后面的态度描写不能将它变回定罪。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. made no compromise in convicting McDonnell</h3>\n<blockquote>\n<p>在给麦克唐纳定罪时没有作出妥协</p>\n</blockquote>\n<p>把A接回题干，它说的是：第一段画线句表明，法院在给麦克唐纳定罪时毫不妥协。</p>\n<p>A的 <code>convicting McDonnell</code> 指对麦克唐纳定罪，第一段的 <code>overturned the corruption conviction</code> 说的也是该项定罪，因此回到画线句前一句，再看did so所指的法院动作。</p>\n<blockquote>\n<p>In a rare <span class=\"mask\">[xxx]</span> ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.</p>\n</blockquote>\n<p><code>overturned the corruption conviction</code> 是把原有腐败定罪推翻，A的 <code>convicting McDonnell</code> 却让法院继续承担“定罪”这个动作。画线句里的did so指回的是推翻定罪，不会因为后面出现捏鼻子的态度，就突然变成坚持给他定罪。</p>\n<p>这里有两层需要分开：法院对定罪作了什么处理，以及它对这个人的行为持什么态度。But正是把二者放在不完全一致的方向上。对收礼行为反感，仍可以不认可原来的法律定罪；A把行为评价直接换成了定罪结果，因而读反了前一句的动作。</p>\n<p><strong>法院推翻原来的腐败定罪，能不能改写成它在给麦克唐纳定罪时毫不妥协？</strong></p>\n<p>不能。overturned已经明确改变了定罪，A却把动作写成继续定罪。</p>\n<p>A的司法动作方向与原文相反，后面的态度描写不能将它变回定罪。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,240,996,196]],"questionRects":[[188,158,990,34],[233,209,614,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `convicting McDonnell` 指对麦克唐纳定罪，第一段的 `overturned the corruption conviction` 说的也是该项定罪，因此回到画线句前一句，再看did so所指的法院动作。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","negation"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"overturned the corruption conviction","visibleOptionAnchor":"convicting McDonnell"}}}},{"section":"36题","raw":"### B. avoided defining the extent of McDonnell’s duties\n\n> 避免界定麦克唐纳职责的范围\n\n把B接回题干，它说的是：第一段画线句表明，法院回避界定麦克唐纳职责的范围。\n\nB的 `extent of McDonnell’s duties` 与第二段的 `his duties` 都涉及职责，因此把第二段完整读一遍，查看法院究竟回避了职责问题，还是正在说明应如何限定它。\n\n> 原文参考：\n>\n> The high court’s decision said the judge in Mr. McDonnell’s trial failed to tell a jury that it must look only at his “official acts,” or the former governor’s decisions on “specific” and “**[xxx]**” issues related to his duties.\n>\n> 开始精读：\n>\n> The high court’s decision said / the judge in Mr. McDonnell’s trial failed to tell a jury / that it must look only at his “official acts,” / or the former governor’s decisions / on “specific” and “**[xxx]**” issues related to his duties.\n>\n> 顺着英文顺序读：\n>\n> 最高法院的裁决说 / 麦克唐纳先生审判中的法官没有告诉陪审团， / 它必须只看他的“公务行为”， / 也就是这位前州长所作的决定， / 关于与其职责有关的“具体的”和“**[xxx]**”问题。\n\n现在回到B，核对法院对职责问题怎样说明：\n\n> it must look only at his “official acts,” or the former governor’s decisions on “specific” and “**[xxx]**” issues related to his duties.\n\n`related to his duties` 放在对official acts的解释里，法院要求陪审团只看这些公务行为，并进一步说是有关specific等问题的决定。B的 `extent of McDonnell’s duties` 因而不能说完全不相关，但avoided defining与这里正在作出的限定相反。\n\nfailed to tell的主语是此前审判中的judge，不是最高法院回避说明；最高法院恰恰指出那个法官未把限定讲清楚。再回到画线句，它描述对conduct的态度，也没有把话题变成不愿界定职责。B既调换了说话内容，也容易把被批评的原审法官与现在作裁决的法院混为一体。\n\n**最高法院说陪审团“必须只看”特定公务行为，是回避职责边界，还是在要求把边界说明白？**\n\n后者。must look only及其后面的解释都在作限定，不是在避而不谈。\n\nB把法院正在要求澄清的事情写成法院回避的事情。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. avoided defining the extent of McDonnell’s duties</h3>\n<blockquote>\n<p>避免界定麦克唐纳职责的范围</p>\n</blockquote>\n<p>把B接回题干，它说的是：第一段画线句表明，法院回避界定麦克唐纳职责的范围。</p>\n<p>B的 <code>extent of McDonnell’s duties</code> 与第二段的 <code>his duties</code> 都涉及职责，因此把第二段完整读一遍，查看法院究竟回避了职责问题，还是正在说明应如何限定它。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The high court’s decision said the judge in Mr. McDonnell’s trial failed to tell a jury that it must look only at his “official acts,” or the former governor’s decisions on “specific” and “<span class=\"mask\">[xxx]</span>” issues related to his duties.</p>\n<p>开始精读：</p>\n<p>The high court’s decision said / the judge in Mr. McDonnell’s trial failed to tell a jury / that it must look only at his “official acts,” / or the former governor’s decisions / on “specific” and “<span class=\"mask\">[xxx]</span>” issues related to his duties.</p>\n<p>顺着英文顺序读：</p>\n<p>最高法院的裁决说 / 麦克唐纳先生审判中的法官没有告诉陪审团， / 它必须只看他的“公务行为”， / 也就是这位前州长所作的决定， / 关于与其职责有关的“具体的”和“<span class=\"mask\">[xxx]</span>”问题。</p>\n</blockquote>\n<p>现在回到B，核对法院对职责问题怎样说明：</p>\n<blockquote>\n<p>it must look only at his “official acts,” or the former governor’s decisions on “specific” and “<span class=\"mask\">[xxx]</span>” issues related to his duties.</p>\n</blockquote>\n<p><code>related to his duties</code> 放在对official acts的解释里，法院要求陪审团只看这些公务行为，并进一步说是有关specific等问题的决定。B的 <code>extent of McDonnell’s duties</code> 因而不能说完全不相关，但avoided defining与这里正在作出的限定相反。</p>\n<p>failed to tell的主语是此前审判中的judge，不是最高法院回避说明；最高法院恰恰指出那个法官未把限定讲清楚。再回到画线句，它描述对conduct的态度，也没有把话题变成不愿界定职责。B既调换了说话内容，也容易把被批评的原审法官与现在作裁决的法院混为一体。</p>\n<p><strong>最高法院说陪审团“必须只看”特定公务行为，是回避职责边界，还是在要求把边界说明白？</strong></p>\n<p>后者。must look only及其后面的解释都在作限定，不是在避而不谈。</p>\n<p>B把法院正在要求澄清的事情写成法院回避的事情。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,240,996,196],[168,446,996,108]],"questionRects":[[188,158,990,34],[233,260,653,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `extent of McDonnell’s duties` 与第二段的 `his duties` 都涉及职责，因此把第二段完整读一遍，查看法院究竟回避了职责问题，还是正在说明应如何限定它。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[1],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"his duties","visibleOptionAnchor":"extent of McDonnell’s duties"}}}},{"section":"36题","raw":"### C. was **[xxx]** of McDonnell’s conduct\n\n> 对麦克唐纳的行为持 **[xxx]** 的态度\n\n把C接回题干，它说的是：第一段画线句表明，法院对麦克唐纳的行为持 **[xxx]** 的态度。\n\nC的 `McDonnell’s conduct` 与第一段的 `holding its nose` 所指向的行为评价相连，所以回看at后面的his conduct以及收礼例子，判断这里谈的是人的行为还是定罪是否有效。\n\n> But it did so while holding its nose at the **[xxx]** of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\n\n`McDonnell’s conduct` 正是his conduct，后面的which included又具体列收下手表和汽车等行为。`holding its nose` 用捏鼻子的姿态来描写法院面对这些行为的反应，这显然不是在欣赏礼物或认可行为；But也把这种反应与前一句推翻定罪区分开。\n\nC的核心形容词 **[xxx]** 还没有逐字读清，但它准确保留了“法院对麦克唐纳行为的态度”这个句子重点。A改变司法动作，B改谈职责界定，D说拒绝评论，都没有保留这层已发生的评价。C先留下，不把行为令人反感与依法应否定罪混成一件事。\n\n**画线句是否确实在描写法院对麦克唐纳收礼行为的态度，而不是重新宣布给他定罪？**\n\n能。conduct与其后例子界定了评价对象，捏鼻子的姿态则表达法院面对这类行为的反应。\n\nC保留了正确的评价对象和句子功能，形容词仍按 **[xxx]** 留着。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. was <span class=\"mask\">[xxx]</span> of McDonnell’s conduct</h3>\n<blockquote>\n<p>对麦克唐纳的行为持 <span class=\"mask\">[xxx]</span> 的态度</p>\n</blockquote>\n<p>把C接回题干，它说的是：第一段画线句表明，法院对麦克唐纳的行为持 <span class=\"mask\">[xxx]</span> 的态度。</p>\n<p>C的 <code>McDonnell’s conduct</code> 与第一段的 <code>holding its nose</code> 所指向的行为评价相连，所以回看at后面的his conduct以及收礼例子，判断这里谈的是人的行为还是定罪是否有效。</p>\n<blockquote>\n<p>But it did so while holding its nose at the <span class=\"mask\">[xxx]</span> of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.</p>\n</blockquote>\n<p><code>McDonnell’s conduct</code> 正是his conduct，后面的which included又具体列收下手表和汽车等行为。<code>holding its nose</code> 用捏鼻子的姿态来描写法院面对这些行为的反应，这显然不是在欣赏礼物或认可行为；But也把这种反应与前一句推翻定罪区分开。</p>\n<p>C的核心形容词 <span class=\"mask\">[xxx]</span> 还没有逐字读清，但它准确保留了“法院对麦克唐纳行为的态度”这个句子重点。A改变司法动作，B改谈职责界定，D说拒绝评论，都没有保留这层已发生的评价。C先留下，不把行为令人反感与依法应否定罪混成一件事。</p>\n<p><strong>画线句是否确实在描写法院对麦克唐纳收礼行为的态度，而不是重新宣布给他定罪？</strong></p>\n<p>能。conduct与其后例子界定了评价对象，捏鼻子的姿态则表达法院面对这类行为的反应。</p>\n<p>C保留了正确的评价对象和句子功能，形容词仍按 <span class=\"mask\">[xxx]</span> 留着。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[168,240,996,196]],"questionRects":[[188,158,990,34],[233,311,566,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `McDonnell’s conduct` 与第一段的 `holding its nose` 所指向的行为评价相连，所以回看at后面的his conduct以及收礼例子，判断这里谈的是人的行为还是定罪是否有效。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"holding its nose","visibleOptionAnchor":"McDonnell’s conduct"}}}},{"section":"36题","raw":"### D. refused to comment on McDonnell’s ethics\n\n> 拒绝评论麦克唐纳的道德\n\n把D接回题干，它说的是：第一段画线句表明，法院拒绝评论麦克唐纳的道德问题。\n\nD的 `refused to comment` 指拒绝作评价，而画线句的 `holding its nose` 恰恰是在呈现反应，因此回看这个姿态与his conduct之间的连接，确认是否真的没有评论。\n\n> But it did so while holding its nose at the **[xxx]** of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.\n\n`holding its nose` 不是沉默，也不是不知道怎样评价，而是对行为作出一个有明显感情色彩的姿态。D的 `refused to comment` 却说法院没有评论，直接取消了画线句正在描述的评价。这里使用形象表达，不意味着评价不存在。\n\n前一句推翻定罪，也不能被解释成法院回避道德问题。But it did so while说明“做了法律上的这个处理，同时仍有对行为的另一反应”。原文恰恰要让两层并存；D把司法处理没有维持定罪误认为对行为不置一词，漏掉了while之后整层内容。\n\n**对某人的行为捏着鼻子，能不能视为法院拒绝作任何评论？**\n\n不能。这个姿态本身就在表达态度，并不是取消评价。\n\nD的refused否定了原句实际已经呈现的行为评价。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. refused to comment on McDonnell’s ethics</h3>\n<blockquote>\n<p>拒绝评论麦克唐纳的道德</p>\n</blockquote>\n<p>把D接回题干，它说的是：第一段画线句表明，法院拒绝评论麦克唐纳的道德问题。</p>\n<p>D的 <code>refused to comment</code> 指拒绝作评价，而画线句的 <code>holding its nose</code> 恰恰是在呈现反应，因此回看这个姿态与his conduct之间的连接，确认是否真的没有评论。</p>\n<blockquote>\n<p>But it did so while holding its nose at the <span class=\"mask\">[xxx]</span> of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.</p>\n</blockquote>\n<p><code>holding its nose</code> 不是沉默，也不是不知道怎样评价，而是对行为作出一个有明显感情色彩的姿态。D的 <code>refused to comment</code> 却说法院没有评论，直接取消了画线句正在描述的评价。这里使用形象表达，不意味着评价不存在。</p>\n<p>前一句推翻定罪，也不能被解释成法院回避道德问题。But it did so while说明“做了法律上的这个处理，同时仍有对行为的另一反应”。原文恰恰要让两层并存；D把司法处理没有维持定罪误认为对行为不置一词，漏掉了while之后整层内容。</p>\n<p><strong>对某人的行为捏着鼻子，能不能视为法院拒绝作任何评论？</strong></p>\n<p>不能。这个姿态本身就在表达态度，并不是取消评价。</p>\n<p>D的refused否定了原句实际已经呈现的行为评价。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,240,996,196]],"questionRects":[[188,158,990,34],[234,362,566,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `refused to comment` 指拒绝作评价，而画线句的 `holding its nose` 恰恰是在呈现反应，因此回看这个姿态与his conduct之间的连接，确认是否真的没有评论。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"holding its nose","visibleOptionAnchor":"refused to comment"}}}},{"section":"36题","raw":"### 36题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n> **36题选C。**","contextRaw":"","html":"<h3>36题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>36题选C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,158,990,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"36"}},{"section":"37题","raw":"## 37题\n\n> According to Paragraph 4, an official act is deemed corruptive only if it involves ______.  \n> 根据第四段，一项公务行为只有涉及什么才被认定具有腐败性质？\n\n题干的Paragraph 4已经圈定第四段，only if问的是认定条件。先完整读这一段，把前面对行为的评价、But后面的法律要求和最后的排除情形分别接清楚。\n\n> 原文参考：\n>\n> The court did suggest that accepting favors in return for opening doors is “**[xxx]**” and “nasty”. But under anti-bribery laws, proof must be made of **[xxx]** benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an “official act”.\n>\n> 开始精读：\n>\n> The court did suggest / that accepting favors in return for opening doors / is “**[xxx]**” and “nasty”. / But under anti-bribery laws, / proof must be made of **[xxx]** benefits, / such as approval of a contract or regulation. / Simply arranging a meeting, making a phone call, or hosting an event / is not an “official act”.\n>\n> 顺着英文顺序读：\n>\n> 法院确实表示 / 接受好处来换取为人开门 / 是“**[xxx]**”且“令人厌恶的”。 / 但是根据反贿赂法律， / 必须有 **[xxx]** 利益的证据， / 比如一份合同或一项规定的批准。 / 仅仅安排会面、打电话或者举办活动 / 并不是一种“公务行为”。","contextRaw":"","html":"<h2>37题</h2>\n<blockquote>\n<p>According to Paragraph 4, an official act is deemed corruptive only if it involves ______.<br />\n根据第四段，一项公务行为只有涉及什么才被认定具有腐败性质？</p>\n</blockquote>\n<p>题干的Paragraph 4已经圈定第四段，only if问的是认定条件。先完整读这一段，把前面对行为的评价、But后面的法律要求和最后的排除情形分别接清楚。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The court did suggest that accepting favors in return for opening doors is “<span class=\"mask\">[xxx]</span>” and “nasty”. But under anti-bribery laws, proof must be made of <span class=\"mask\">[xxx]</span> benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an “official act”.</p>\n<p>开始精读：</p>\n<p>The court did suggest / that accepting favors in return for opening doors / is “<span class=\"mask\">[xxx]</span>” and “nasty”. / But under anti-bribery laws, / proof must be made of <span class=\"mask\">[xxx]</span> benefits, / such as approval of a contract or regulation. / Simply arranging a meeting, making a phone call, or hosting an event / is not an “official act”.</p>\n<p>顺着英文顺序读：</p>\n<p>法院确实表示 / 接受好处来换取为人开门 / 是“<span class=\"mask\">[xxx]</span>”且“令人厌恶的”。 / 但是根据反贿赂法律， / 必须有 <span class=\"mask\">[xxx]</span> 利益的证据， / 比如一份合同或一项规定的批准。 / 仅仅安排会面、打电话或者举办活动 / 并不是一种“公务行为”。</p>\n</blockquote>\n","articleRects":[[168,651,998,156]],"questionRects":[[188,464,997,32],[235,522,210,27]],"scrollTarget":"auto","meta":{"kind":"question","qid":"37"}},{"section":"37题","raw":"### A. **[xxx]** returns for gift-givers\n\n> 给送礼者的 **[xxx]** 回报\n\n把A接回题干，它说的是：依照第四段，公务行为被认定具有腐败性质，需要涉及给送礼者的 **[xxx]** 回报。\n\nA的 `returns for gift-givers` 谈送礼人取得的回报，第四段的 `benefits` 后面列合同或规定的批准，因此回看这些利益与前面收好处、为人开门之间是什么关系。\n\n> But under anti-bribery laws, proof must be made of **[xxx]** benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an “official act”.\n\n`returns for gift-givers` 中for限定了回报流向送礼一方。原文的 `benefits` 通过approval of a contract or regulation举例，不再只是收了什么礼物，而是公务处理能让请托一方取得什么结果。A保留了这一利益流向。\n\n两边都有 **[xxx]**，不能把它们当作已认识的同一个词。但后面的例子与not an official act的对照已经说明：仅安排会面、打电话还不等于文中要求的那类利益。A不像B把礼物本身当回报，也不像C、D另换成泄密或毁约，可以留下来。\n\n**合同或规定获批这一类利益，是送礼人可能换来的回报，还是官员收下的礼物本身？**\n\n前者。这里在说明公务处理给请托者带来的结果，而不是数官员收了多大一份礼。\n\nA保留了受益者与回报方向，未改变原文反贿赂判断所关注的事情。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. <span class=\"mask\">[xxx]</span> returns for gift-givers</h3>\n<blockquote>\n<p>给送礼者的 <span class=\"mask\">[xxx]</span> 回报</p>\n</blockquote>\n<p>把A接回题干，它说的是：依照第四段，公务行为被认定具有腐败性质，需要涉及给送礼者的 <span class=\"mask\">[xxx]</span> 回报。</p>\n<p>A的 <code>returns for gift-givers</code> 谈送礼人取得的回报，第四段的 <code>benefits</code> 后面列合同或规定的批准，因此回看这些利益与前面收好处、为人开门之间是什么关系。</p>\n<blockquote>\n<p>But under anti-bribery laws, proof must be made of <span class=\"mask\">[xxx]</span> benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an “official act”.</p>\n</blockquote>\n<p><code>returns for gift-givers</code> 中for限定了回报流向送礼一方。原文的 <code>benefits</code> 通过approval of a contract or regulation举例，不再只是收了什么礼物，而是公务处理能让请托一方取得什么结果。A保留了这一利益流向。</p>\n<p>两边都有 <span class=\"mask\">[xxx]</span>，不能把它们当作已认识的同一个词。但后面的例子与not an official act的对照已经说明：仅安排会面、打电话还不等于文中要求的那类利益。A不像B把礼物本身当回报，也不像C、D另换成泄密或毁约，可以留下来。</p>\n<p><strong>合同或规定获批这一类利益，是送礼人可能换来的回报，还是官员收下的礼物本身？</strong></p>\n<p>前者。这里在说明公务处理给请托者带来的结果，而不是数官员收了多大一份礼。</p>\n<p>A保留了受益者与回报方向，未改变原文反贿赂判断所关注的事情。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[168,651,998,156]],"questionRects":[[188,464,997,32],[235,522,210,27],[235,566,413,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `returns for gift-givers` 谈送礼人取得的回报，第四段的 `benefits` 后面列合同或规定的批准，因此回看这些利益与前面收好处、为人开门之间是什么关系。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"benefits","visibleOptionAnchor":"returns for gift-givers"}}}},{"section":"37题","raw":"### B. sizable gains in the form of gifts\n\n> 以礼物形式获得的可观利益\n\n把B接回题干，它说的是：依照第四段，公务行为构成腐败的必要内容，是以礼物形式取得可观利益。\n\nB的 `in the form of gifts` 指礼物这种收受形式，第四段的 `approval of a contract or regulation` 则是所举的利益例子，因此将二者对照，看看法律判断讨论的是礼物多大，还是公务决定带来什么结果。\n\n> But under anti-bribery laws, proof must be made of **[xxx]** benefits, such as approval of a contract or regulation.\n\n`in the form of gifts` 把利益放在收礼这一端，原文的 `approval of a contract or regulation` 却是在说合同或规定得到批准，这不是官员收到手表、汽车那类礼物。B抓住前文谈收好处，便忽略But后面法律要求另有相应利益的证据。\n\nsizable还增加数量或价值很大的要求。第四段所作的区分不是礼物大就构成、小就不构成，而是要看所要求证明的公务利益与单纯安排接触之间的差别。只讨论收到的礼物及其规模，会漏掉真正要核对的交换另一端。\n\n**原文举合同获批为例，是否是在说官员收到的礼物必须价值可观？**\n\n不是。它举的是公务处理产生的利益，不是礼物价值的门槛。\n\nB把回报的流向与形式都换成收礼一端，又多加了sizable。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. sizable gains in the form of gifts</h3>\n<blockquote>\n<p>以礼物形式获得的可观利益</p>\n</blockquote>\n<p>把B接回题干，它说的是：依照第四段，公务行为构成腐败的必要内容，是以礼物形式取得可观利益。</p>\n<p>B的 <code>in the form of gifts</code> 指礼物这种收受形式，第四段的 <code>approval of a contract or regulation</code> 则是所举的利益例子，因此将二者对照，看看法律判断讨论的是礼物多大，还是公务决定带来什么结果。</p>\n<blockquote>\n<p>But under anti-bribery laws, proof must be made of <span class=\"mask\">[xxx]</span> benefits, such as approval of a contract or regulation.</p>\n</blockquote>\n<p><code>in the form of gifts</code> 把利益放在收礼这一端，原文的 <code>approval of a contract or regulation</code> 却是在说合同或规定得到批准，这不是官员收到手表、汽车那类礼物。B抓住前文谈收好处，便忽略But后面法律要求另有相应利益的证据。</p>\n<p>sizable还增加数量或价值很大的要求。第四段所作的区分不是礼物大就构成、小就不构成，而是要看所要求证明的公务利益与单纯安排接触之间的差别。只讨论收到的礼物及其规模，会漏掉真正要核对的交换另一端。</p>\n<p><strong>原文举合同获批为例，是否是在说官员收到的礼物必须价值可观？</strong></p>\n<p>不是。它举的是公务处理产生的利益，不是礼物价值的门槛。</p>\n<p>B把回报的流向与形式都换成收礼一端，又多加了sizable。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,651,998,156]],"questionRects":[[188,464,997,32],[235,522,210,27],[235,617,441,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `in the form of gifts` 指礼物这种收受形式，第四段的 `approval of a contract or regulation` 则是所举的利益例子，因此将二者对照，看看法律判断讨论的是礼物多大，还是公务决定带来什么结果。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"approval of a contract or regulation","visibleOptionAnchor":"in the form of gifts"}}}},{"section":"37题","raw":"### C. leaking secrets intentionally\n\n> 故意泄露秘密\n\n把C接回题干，它说的是：依照第四段，公务行为被认定腐败，必须涉及故意泄密。\n\nC的 `leaking secrets intentionally` 描述泄密行为，第四段的 `approval of a contract or regulation` 描述法律所关注的利益例子；因此回看such as后面，比较被举出来的行为是哪一种。\n\n> But under anti-bribery laws, proof must be made of **[xxx]** benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an “official act”.\n\n`approval of a contract or regulation` 是批准合同或规定，C的 `leaking secrets intentionally` 则是故意把秘密泄露出去，动作与对象都不相同。段末的making a phone call也不能给泄密补依据：打电话只是一种联系行为，并不说明谈话内容是秘密，更不说明发生了泄露。\n\n题干还问only if，C等于把故意泄密写成必要条件。原段明明用合同、规定的批准说明所需利益，C却将这些实例排除在必要条件之外。不能拿一个通常听起来负面的行为，替换文章此处实际界定的条件。\n\n**作者举合同或规定获批的例子，是否把“故意泄密”规定成腐败认定的必要条件？**\n\n不能。该段没有建立泄密条件，举出的行为也不是泄密。\n\nC把法律判断涉及的公务利益改成另一种不当行为。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. leaking secrets intentionally</h3>\n<blockquote>\n<p>故意泄露秘密</p>\n</blockquote>\n<p>把C接回题干，它说的是：依照第四段，公务行为被认定腐败，必须涉及故意泄密。</p>\n<p>C的 <code>leaking secrets intentionally</code> 描述泄密行为，第四段的 <code>approval of a contract or regulation</code> 描述法律所关注的利益例子；因此回看such as后面，比较被举出来的行为是哪一种。</p>\n<blockquote>\n<p>But under anti-bribery laws, proof must be made of <span class=\"mask\">[xxx]</span> benefits, such as approval of a contract or regulation. Simply arranging a meeting, making a phone call, or hosting an event is not an “official act”.</p>\n</blockquote>\n<p><code>approval of a contract or regulation</code> 是批准合同或规定，C的 <code>leaking secrets intentionally</code> 则是故意把秘密泄露出去，动作与对象都不相同。段末的making a phone call也不能给泄密补依据：打电话只是一种联系行为，并不说明谈话内容是秘密，更不说明发生了泄露。</p>\n<p>题干还问only if，C等于把故意泄密写成必要条件。原段明明用合同、规定的批准说明所需利益，C却将这些实例排除在必要条件之外。不能拿一个通常听起来负面的行为，替换文章此处实际界定的条件。</p>\n<p><strong>作者举合同或规定获批的例子，是否把“故意泄密”规定成腐败认定的必要条件？</strong></p>\n<p>不能。该段没有建立泄密条件，举出的行为也不是泄密。</p>\n<p>C把法律判断涉及的公务利益改成另一种不当行为。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,651,998,156]],"questionRects":[[188,464,997,32],[235,522,210,27],[235,668,378,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `leaking secrets intentionally` 描述泄密行为，第四段的 `approval of a contract or regulation` 描述法律所关注的利益例子；因此回看such as后面，比较被举出来的行为是哪一种。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"approval of a contract or regulation","visibleOptionAnchor":"leaking secrets intentionally"}}}},{"section":"37题","raw":"### D. breaking contracts officially\n\n> 以公务方式破坏合同\n\n把D接回题干，它说的是：依照第四段，公务行为被认定腐败，必须涉及正式破坏合同。\n\nD的 `breaking contracts` 与第四段的 `approval of a contract` 都出现合同，但一个是破坏、一个是批准，因此直接回到这个例子核对动作。\n\n> But under anti-bribery laws, proof must be made of **[xxx]** benefits, such as approval of a contract or regulation.\n\n`approval of a contract` 是让合同获得批准，D的 `breaking contracts` 是破坏或违背合同，两者不能因为contracts相同就互换。原文用批准举例，是说明公务决定能够给送礼者带来怎样的利益，而不是说一切合同必须遭到破坏才涉及腐败。\n\nofficially也不能把breaking修正回来。即使都发生在公务场景中，动作仍然相反。后面还并列regulation，说明作者不是在专讲毁约行为，而是在列可能带来利益的公务决定类别。D既改了动作，又把必要条件收缩到合同破坏这一个行为。\n\n**合同得到批准，能不能因为都涉及合同就换成合同被破坏？**\n\n不能。approval与breaking的动作方向不同，officially不会消除这处差别。\n\nD保留合同名词却改变了真正决定句意的行为。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. breaking contracts officially</h3>\n<blockquote>\n<p>以公务方式破坏合同</p>\n</blockquote>\n<p>把D接回题干，它说的是：依照第四段，公务行为被认定腐败，必须涉及正式破坏合同。</p>\n<p>D的 <code>breaking contracts</code> 与第四段的 <code>approval of a contract</code> 都出现合同，但一个是破坏、一个是批准，因此直接回到这个例子核对动作。</p>\n<blockquote>\n<p>But under anti-bribery laws, proof must be made of <span class=\"mask\">[xxx]</span> benefits, such as approval of a contract or regulation.</p>\n</blockquote>\n<p><code>approval of a contract</code> 是让合同获得批准，D的 <code>breaking contracts</code> 是破坏或违背合同，两者不能因为contracts相同就互换。原文用批准举例，是说明公务决定能够给送礼者带来怎样的利益，而不是说一切合同必须遭到破坏才涉及腐败。</p>\n<p>officially也不能把breaking修正回来。即使都发生在公务场景中，动作仍然相反。后面还并列regulation，说明作者不是在专讲毁约行为，而是在列可能带来利益的公务决定类别。D既改了动作，又把必要条件收缩到合同破坏这一个行为。</p>\n<p><strong>合同得到批准，能不能因为都涉及合同就换成合同被破坏？</strong></p>\n<p>不能。approval与breaking的动作方向不同，officially不会消除这处差别。</p>\n<p>D保留合同名词却改变了真正决定句意的行为。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,651,998,156]],"questionRects":[[188,464,997,32],[235,522,210,27],[235,719,381,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `breaking contracts` 与第四段的 `approval of a contract` 都出现合同，但一个是破坏、一个是批准，因此直接回到这个例子核对动作。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"approval of a contract","visibleOptionAnchor":"breaking contracts"}}}},{"section":"37题","raw":"### 37题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n> **37题选A。**","contextRaw":"","html":"<h3>37题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>37题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,464,997,32],[235,522,210,27]],"scrollTarget":"auto","meta":{"kind":"result","qid":"37"}},{"section":"38题","raw":"## 38题\n\n> The court’s ruling is based on the assumption that public officials are ______.  \n> 法院裁决所依据的关于公职人员的假定是什么？\n\n题干问court’s ruling所依据的assumption。粗读时我隐约记得第五段留下过“法院裁决”和“公职人员”，先回到这一段完整读，找到作者具体怎样说明那个假定。\n\n> 原文参考：\n>\n> The court’s ruling is legally sound in defining a kind of **[xxx]** that is not criminal. Elected leaders must be allowed to help supporters deal with **[xxx]** problems without fear of prosecution for bribery. “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”\n>\n> 开始精读：\n>\n> The court’s ruling is legally sound / in defining a kind of **[xxx]** that is not criminal. / Elected leaders must be allowed to help supporters / deal with **[xxx]** problems / without fear of prosecution for bribery. / “The basic compact underlying representative government,” / wrote Chief Justice John Roberts for the court, / “assumes that public officials will hear from their constituents / and act on their concerns.”\n>\n> 顺着英文顺序读：\n>\n> 法院的裁决在法律上是合理的， / 在界定一种不构成犯罪的 **[xxx]** 这件事上。 / 民选领导人必须被允许帮助支持者 / 处理 **[xxx]** 问题 / 而不用担心被以贿赂起诉。 / “代议制政府所依据的基本约定”， / 首席大法官约翰·罗伯茨代表法院写道， / “假定公职人员会听取他们选民的意见 / 并针对他们关心的问题采取行动。”","contextRaw":"","html":"<h2>38题</h2>\n<blockquote>\n<p>The court’s ruling is based on the assumption that public officials are ______.<br />\n法院裁决所依据的关于公职人员的假定是什么？</p>\n</blockquote>\n<p>题干问court’s ruling所依据的assumption。粗读时我隐约记得第五段留下过“法院裁决”和“公职人员”，先回到这一段完整读，找到作者具体怎样说明那个假定。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The court’s ruling is legally sound in defining a kind of <span class=\"mask\">[xxx]</span> that is not criminal. Elected leaders must be allowed to help supporters deal with <span class=\"mask\">[xxx]</span> problems without fear of prosecution for bribery. “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”</p>\n<p>开始精读：</p>\n<p>The court’s ruling is legally sound / in defining a kind of <span class=\"mask\">[xxx]</span> that is not criminal. / Elected leaders must be allowed to help supporters / deal with <span class=\"mask\">[xxx]</span> problems / without fear of prosecution for bribery. / “The basic compact underlying representative government,” / wrote Chief Justice John Roberts for the court, / “assumes that public officials will hear from their constituents / and act on their concerns.”</p>\n<p>顺着英文顺序读：</p>\n<p>法院的裁决在法律上是合理的， / 在界定一种不构成犯罪的 <span class=\"mask\">[xxx]</span> 这件事上。 / 民选领导人必须被允许帮助支持者 / 处理 <span class=\"mask\">[xxx]</span> 问题 / 而不用担心被以贿赂起诉。 / “代议制政府所依据的基本约定”， / 首席大法官约翰·罗伯茨代表法院写道， / “假定公职人员会听取他们选民的意见 / 并针对他们关心的问题采取行动。”</p>\n</blockquote>\n","articleRects":[[168,816,996,231]],"questionRects":[[188,821,989,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"38"}},{"section":"38题","raw":"### A. allowed to focus on the concerns of their supporters\n\n> 被允许重点关注其支持者关心的问题\n\n把A接回题干，它说的是：法院裁决的前提是，公职人员被允许把重点放在支持者关心的问题上。\n\nA的 `focus on the concerns of their supporters` 与第五段的 `help supporters` 都涉及支持者，所以先回到这句与后面的代议制假定；接着完整读相邻的下一段，查看它怎样限定这种帮助，分清回应选民与偏向特定人群。\n\n> 原文参考：\n>\n> But the ruling **[xxx]** the need for citizens and their elected representatives, not the courts, to ensure equality of access to government. Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift. This type of **[xxx]** requires well-enforced laws in government **[xxx]**, such as records of official meetings, rules on lobbying, and information about each elected leader’s source of wealth.\n>\n> 开始精读：\n>\n> But the ruling **[xxx]** the need / for citizens and their elected representatives, not the courts, / to ensure equality of access to government. / Officials must not be allowed to play favorites / in providing information or in arranging meetings / simply because an individual or group provides a campaign donation or a personal gift. / This type of **[xxx]** requires well-enforced laws in government **[xxx]**, / such as records of official meetings, rules on lobbying, / and information about each elected leader’s source of wealth.\n>\n> 顺着英文顺序读：\n>\n> 但是这项裁决 **[xxx]** 这种需要， / 需要公民和他们选出的代表，而不是法院， / 确保接触政府的平等性。 / 绝不能允许官员偏袒某些人， / 在提供信息或者安排会面时， / 仅仅因为某个人或团体提供了一笔竞选捐款或者一份私人礼物。 / 这种 **[xxx]** 要求在政府 **[xxx]** 方面有得到良好执行的法律， / 比如公务会议记录、游说规则， / 以及每一位民选领导人的财富来源信息。\n\n现在把正常帮助与下一段的禁止偏袒放在一起：\n\n> Elected leaders must be allowed to help supporters deal with **[xxx]** problems without fear of prosecution for bribery.\n>\n> Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.\n\n`help supporters` 单独看确实与A的 `focus on the concerns of their supporters` 有联系，这正是A容易被留下的地方。但第五段在解释基本前提时用的是their constituents，即他们代表的选民，范围不限于支持者；第六段随即禁止因为捐款或礼物而play favorites。\n\n所以这里允许正常回应，不是允许把支持自己的一批人作为特殊重点。focus on配合their supporters，会把公共回应义务缩成对支持者的偏重。原文一面允许帮助，另一面限定不能给予特殊通道，两句话必须同时保留，不能只截第一句的supporters。\n\n**允许正常帮助支持者，是否就允许公职人员把支持自己的人置于回应工作的特殊重点？**\n\n不能。后文明确禁止因捐款或礼物而偏袒，基本假定的范围也是所代表的选民而非特选的支持群体。\n\nA缩窄了代表对象，并把正常回应写成重点倾向。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. allowed to focus on the concerns of their supporters</h3>\n<blockquote>\n<p>被允许重点关注其支持者关心的问题</p>\n</blockquote>\n<p>把A接回题干，它说的是：法院裁决的前提是，公职人员被允许把重点放在支持者关心的问题上。</p>\n<p>A的 <code>focus on the concerns of their supporters</code> 与第五段的 <code>help supporters</code> 都涉及支持者，所以先回到这句与后面的代议制假定；接着完整读相邻的下一段，查看它怎样限定这种帮助，分清回应选民与偏向特定人群。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But the ruling <span class=\"mask\">[xxx]</span> the need for citizens and their elected representatives, not the courts, to ensure equality of access to government. Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift. This type of <span class=\"mask\">[xxx]</span> requires well-enforced laws in government <span class=\"mask\">[xxx]</span>, such as records of official meetings, rules on lobbying, and information about each elected leader’s source of wealth.</p>\n<p>开始精读：</p>\n<p>But the ruling <span class=\"mask\">[xxx]</span> the need / for citizens and their elected representatives, not the courts, / to ensure equality of access to government. / Officials must not be allowed to play favorites / in providing information or in arranging meetings / simply because an individual or group provides a campaign donation or a personal gift. / This type of <span class=\"mask\">[xxx]</span> requires well-enforced laws in government <span class=\"mask\">[xxx]</span>, / such as records of official meetings, rules on lobbying, / and information about each elected leader’s source of wealth.</p>\n<p>顺着英文顺序读：</p>\n<p>但是这项裁决 <span class=\"mask\">[xxx]</span> 这种需要， / 需要公民和他们选出的代表，而不是法院， / 确保接触政府的平等性。 / 绝不能允许官员偏袒某些人， / 在提供信息或者安排会面时， / 仅仅因为某个人或团体提供了一笔竞选捐款或者一份私人礼物。 / 这种 <span class=\"mask\">[xxx]</span> 要求在政府 <span class=\"mask\">[xxx]</span> 方面有得到良好执行的法律， / 比如公务会议记录、游说规则， / 以及每一位民选领导人的财富来源信息。</p>\n</blockquote>\n<p>现在把正常帮助与下一段的禁止偏袒放在一起：</p>\n<blockquote>\n<p>Elected leaders must be allowed to help supporters deal with <span class=\"mask\">[xxx]</span> problems without fear of prosecution for bribery.</p>\n<p>Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.</p>\n</blockquote>\n<p><code>help supporters</code> 单独看确实与A的 <code>focus on the concerns of their supporters</code> 有联系，这正是A容易被留下的地方。但第五段在解释基本前提时用的是their constituents，即他们代表的选民，范围不限于支持者；第六段随即禁止因为捐款或礼物而play favorites。</p>\n<p>所以这里允许正常回应，不是允许把支持自己的一批人作为特殊重点。focus on配合their supporters，会把公共回应义务缩成对支持者的偏重。原文一面允许帮助，另一面限定不能给予特殊通道，两句话必须同时保留，不能只截第一句的supporters。</p>\n<p><strong>允许正常帮助支持者，是否就允许公职人员把支持自己的人置于回应工作的特殊重点？</strong></p>\n<p>不能。后文明确禁止因捐款或礼物而偏袒，基本假定的范围也是所代表的选民而非特选的支持群体。</p>\n<p>A缩窄了代表对象，并把正常回应写成重点倾向。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,816,996,231],[168,1062,996,273]],"questionRects":[[188,821,989,34],[234,872,675,33]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `focus on the concerns of their supporters` 与第五段的 `help supporters` 都涉及支持者，所以先回到这句与后面的代议制假定；接着完整读相邻的下一段，查看它怎样限定这种帮助，分清回应选民与偏向特定人群。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[5],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"help supporters","visibleOptionAnchor":"focus on the concerns of their supporters"}}}},{"section":"38题","raw":"### B. qualified to deal independently with bureaucratic issues\n\n> 有资格独立处理官僚事务\n\n把B接回题干，它说的是：法院裁决的前提是，公职人员具有独立处理官僚事务的资格。\n\nB的 `qualified to deal independently` 强调资格与独立能力，第五段的 `must be allowed to help supporters` 则强调应当允许帮助，因此回看must be allowed与随后assumes的表述，判断是在讨论能力还是职责。\n\n> Elected leaders must be allowed to help supporters deal with **[xxx]** problems without fear of prosecution for bribery. “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”\n\n`must be allowed to help supporters` 是正常帮助行为应受到允许，不等于 `qualified to deal independently` 所说的专业资格或独立处置能力。随后assumes把前提讲得更清楚：听取选民意见，并对他们关心的问题采取行动。这是一种代表关系中的回应义务。\n\nB的independently还要求独自处理，而原句help supporters反而是公职人员帮助别人的关系，并没有把是否独立列为前提。即使公职人员现实中需要能力，这段也不是在评价任职资格，更没有提供能力测试。不能用同样出现deal就忽略其前后的义务、对象与方式。\n\n**法院说公职人员应当能够帮助选民，是否等于它在确认公职人员独立处理事务的资格？**\n\n不等于。前者是回应选民的正当职责，后者是能力和处置方式判断。\n\nB把代表关系中的应当允许换成了独立处理的资格条件。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. qualified to deal independently with bureaucratic issues</h3>\n<blockquote>\n<p>有资格独立处理官僚事务</p>\n</blockquote>\n<p>把B接回题干，它说的是：法院裁决的前提是，公职人员具有独立处理官僚事务的资格。</p>\n<p>B的 <code>qualified to deal independently</code> 强调资格与独立能力，第五段的 <code>must be allowed to help supporters</code> 则强调应当允许帮助，因此回看must be allowed与随后assumes的表述，判断是在讨论能力还是职责。</p>\n<blockquote>\n<p>Elected leaders must be allowed to help supporters deal with <span class=\"mask\">[xxx]</span> problems without fear of prosecution for bribery. “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”</p>\n</blockquote>\n<p><code>must be allowed to help supporters</code> 是正常帮助行为应受到允许，不等于 <code>qualified to deal independently</code> 所说的专业资格或独立处置能力。随后assumes把前提讲得更清楚：听取选民意见，并对他们关心的问题采取行动。这是一种代表关系中的回应义务。</p>\n<p>B的independently还要求独自处理，而原句help supporters反而是公职人员帮助别人的关系，并没有把是否独立列为前提。即使公职人员现实中需要能力，这段也不是在评价任职资格，更没有提供能力测试。不能用同样出现deal就忽略其前后的义务、对象与方式。</p>\n<p><strong>法院说公职人员应当能够帮助选民，是否等于它在确认公职人员独立处理事务的资格？</strong></p>\n<p>不等于。前者是回应选民的正当职责，后者是能力和处置方式判断。</p>\n<p>B把代表关系中的应当允许换成了独立处理的资格条件。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,816,996,231]],"questionRects":[[188,821,989,34],[234,923,714,33]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `qualified to deal independently` 强调资格与独立能力，第五段的 `must be allowed to help supporters` 则强调应当允许帮助，因此回看must be allowed与随后assumes的表述，判断是在讨论能力还是职责。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"must be allowed to help supporters","visibleOptionAnchor":"qualified to deal independently"}}}},{"section":"38题","raw":"### C. justified in addressing the needs of their constituents\n\n> 回应其选民的需要具有正当性\n\n把C接回题干，它说的是：法院裁决的前提是，公职人员回应其选民的需要是正当的。\n\nC的 `addressing the needs of their constituents` 与第五段的 `act on their concerns` 都说回应选民的问题，所以回到带assumes的引语，直接核对裁决所依据的假定。\n\n> “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”\n\n`addressing the needs of their constituents` 保留了原文的选民对象，`act on their concerns` 则说明不仅听取，还要针对关切行动。前面的hear from与后面的act on连起来，就是公共代表应当回应其选民的需要，而不是对少数送礼者承诺特别利益。\n\nC的justified强调这种回应具有正当性，可以与本段must be allowed和legally sound相接。第六段又禁止偏袒，说明正当的是一般回应职责，不是任何以回应为名的特殊照顾。这样读C，既不取消代表应有的工作，也不把其工作都当成贿赂。\n\n**引语里的“听取选民意见并对其关切行动”，能不能概括成正当地回应选民需要？**\n\n能。人物、对象与行动都对应，且没有增加对特定支持者的优待。\n\nC直接保留了assumes所引出的基本代表关系。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. justified in addressing the needs of their constituents</h3>\n<blockquote>\n<p>回应其选民的需要具有正当性</p>\n</blockquote>\n<p>把C接回题干，它说的是：法院裁决的前提是，公职人员回应其选民的需要是正当的。</p>\n<p>C的 <code>addressing the needs of their constituents</code> 与第五段的 <code>act on their concerns</code> 都说回应选民的问题，所以回到带assumes的引语，直接核对裁决所依据的假定。</p>\n<blockquote>\n<p>“The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”</p>\n</blockquote>\n<p><code>addressing the needs of their constituents</code> 保留了原文的选民对象，<code>act on their concerns</code> 则说明不仅听取，还要针对关切行动。前面的hear from与后面的act on连起来，就是公共代表应当回应其选民的需要，而不是对少数送礼者承诺特别利益。</p>\n<p>C的justified强调这种回应具有正当性，可以与本段must be allowed和legally sound相接。第六段又禁止偏袒，说明正当的是一般回应职责，不是任何以回应为名的特殊照顾。这样读C，既不取消代表应有的工作，也不把其工作都当成贿赂。</p>\n<p><strong>引语里的“听取选民意见并对其关切行动”，能不能概括成正当地回应选民需要？</strong></p>\n<p>能。人物、对象与行动都对应，且没有增加对特定支持者的优待。</p>\n<p>C直接保留了assumes所引出的基本代表关系。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[168,816,996,231],[168,1062,996,273]],"questionRects":[[188,821,989,34],[234,974,680,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `addressing the needs of their constituents` 与第五段的 `act on their concerns` 都说回应选民的问题，所以回到带assumes的引语，直接核对裁决所依据的假定。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"act on their concerns","visibleOptionAnchor":"addressing the needs of their constituents"}}}},{"section":"38题","raw":"### D. **[xxx]** from conviction on the charge of favoritism\n\n> 因偏袒指控而被定罪时获得 **[xxx]**\n\n把D接回题干，它说的是：法院裁决的前提是，公职人员在因偏袒而被定罪这件事上 **[xxx]**。\n\nD的 `conviction on the charge of favoritism` 谈定罪问题，第五段的 `without fear of prosecution for bribery` 也涉及法律追责，因此回看这一限制附着在哪一种行为上，再与assumes的内容区别开。\n\n> Elected leaders must be allowed to help supporters deal with **[xxx]** problems without fear of prosecution for bribery. “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”\n\n`without fear of prosecution for bribery` 附在正常帮助支持者处理问题的行为之后，不是一个脱离行为条件、适用于所有偏袒指控的法律待遇。D的 `conviction on the charge of favoritism` 却把话题换成公职人员面对某项指控时如何定罪。\n\n题干问based on the assumption，本段assumes后面明写的前提是听取并回应选民。哪些行为不构成犯罪，是在这个前提之下解释出的法律边界，不是前提本身。D即使留着 **[xxx]**，后面明确谈的仍是定罪结果；不能把裁决产生的某种法律待遇倒过来当成裁决的代表制度依据。\n\n**这里assumes后面写的是公职人员如何回应选民，还是他们面对偏袒指控时怎样被定罪？**\n\n前者。回应义务是论证前提，正常履职与追责的边界是在它之后说明的。\n\nD把法律追责层面的结果换到了题干所问的基本假定位置。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. <span class=\"mask\">[xxx]</span> from conviction on the charge of favoritism</h3>\n<blockquote>\n<p>因偏袒指控而被定罪时获得 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：法院裁决的前提是，公职人员在因偏袒而被定罪这件事上 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的 <code>conviction on the charge of favoritism</code> 谈定罪问题，第五段的 <code>without fear of prosecution for bribery</code> 也涉及法律追责，因此回看这一限制附着在哪一种行为上，再与assumes的内容区别开。</p>\n<blockquote>\n<p>Elected leaders must be allowed to help supporters deal with <span class=\"mask\">[xxx]</span> problems without fear of prosecution for bribery. “The basic compact underlying representative government,” wrote Chief Justice John Roberts for the court, “assumes that public officials will hear from their constituents and act on their concerns.”</p>\n</blockquote>\n<p><code>without fear of prosecution for bribery</code> 附在正常帮助支持者处理问题的行为之后，不是一个脱离行为条件、适用于所有偏袒指控的法律待遇。D的 <code>conviction on the charge of favoritism</code> 却把话题换成公职人员面对某项指控时如何定罪。</p>\n<p>题干问based on the assumption，本段assumes后面明写的前提是听取并回应选民。哪些行为不构成犯罪，是在这个前提之下解释出的法律边界，不是前提本身。D即使留着 <span class=\"mask\">[xxx]</span>，后面明确谈的仍是定罪结果；不能把裁决产生的某种法律待遇倒过来当成裁决的代表制度依据。</p>\n<p><strong>这里assumes后面写的是公职人员如何回应选民，还是他们面对偏袒指控时怎样被定罪？</strong></p>\n<p>前者。回应义务是论证前提，正常履职与追责的边界是在它之后说明的。</p>\n<p>D把法律追责层面的结果换到了题干所问的基本假定位置。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,816,996,231],[168,1062,996,273]],"questionRects":[[188,821,989,34],[234,1025,672,33]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `conviction on the charge of favoritism` 谈定罪问题，第五段的 `without fear of prosecution for bribery` 也涉及法律追责，因此回看这一限制附着在哪一种行为上，再与assumes的内容区别开。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","object","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"without fear of prosecution for bribery","visibleOptionAnchor":"conviction on the charge of favoritism"}}}},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n> **38题选C。**","contextRaw":"","html":"<h3>38题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>38题选C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,821,989,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"38"}},{"section":"39题","raw":"## 39题\n\n> Well-enforced laws in government transparency are needed to ______.  \n> 政府透明方面得到良好执行的法律，是为实现什么目的而需要的？\n\n题干的Well-enforced laws在第六段有相同表达，这一段刚在38题A项中完整读过。现在直接复用该段，核对are needed to所问的目的，不再重复贴整段精读。","contextRaw":"","html":"<h2>39题</h2>\n<blockquote>\n<p>Well-enforced laws in government transparency are needed to ______.<br />\n政府透明方面得到良好执行的法律，是为实现什么目的而需要的？</p>\n</blockquote>\n<p>题干的Well-enforced laws在第六段有相同表达，这一段刚在38题A项中完整读过。现在直接复用该段，核对are needed to所问的目的，不再重复贴整段精读。</p>\n","articleRects":[[168,1062,996,273]],"questionRects":[[188,1127,908,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. awaken the conscience of officials\n\n> 唤醒官员的良知\n\n把A接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了唤醒官员的良知。\n\nA的 `awaken the conscience of officials` 说官员内心发生变化，第六段的 `ensure equality of access to government` 则给出外在公共目标，因此回看这种需要接到哪一层，再看具体法律例子。\n\n> But the ruling **[xxx]** the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\n>\n> This type of **[xxx]** requires well-enforced laws in government **[xxx]**, such as records of official meetings, rules on lobbying, and information about each elected leader’s source of wealth.\n\n`ensure equality of access to government` 说的是公众接触政府时应当受到平等对待，接着通过会议记录、游说规则、财富来源信息来落实。A的 `awaken the conscience of officials` 把目标改成官员内在良知被唤醒，原文却没有描述官员悔悟或思想转变。\n\n外部记录与规则的作用，是让公务行为有可查的信息和限制，而不是先证明官员在内心变好。即使有人因此更自觉，也不是本段已经说出的法律需要。A把制度对行为的约束换成了道德心理教育，不能解释作者为什么接连列这些公开信息。\n\n**会议记录和财富来源信息的要求，是否被作者说明为唤醒官员内心良知的手段？**\n\n不能。段落明说的是平等接触和防止偏袒，不是官员心理上受到感化。\n\nA把外部可落实的制度目标改成内部道德变化。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. awaken the conscience of officials</h3>\n<blockquote>\n<p>唤醒官员的良知</p>\n</blockquote>\n<p>把A接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了唤醒官员的良知。</p>\n<p>A的 <code>awaken the conscience of officials</code> 说官员内心发生变化，第六段的 <code>ensure equality of access to government</code> 则给出外在公共目标，因此回看这种需要接到哪一层，再看具体法律例子。</p>\n<blockquote>\n<p>But the ruling <span class=\"mask\">[xxx]</span> the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.</p>\n<p>This type of <span class=\"mask\">[xxx]</span> requires well-enforced laws in government <span class=\"mask\">[xxx]</span>, such as records of official meetings, rules on lobbying, and information about each elected leader’s source of wealth.</p>\n</blockquote>\n<p><code>ensure equality of access to government</code> 说的是公众接触政府时应当受到平等对待，接着通过会议记录、游说规则、财富来源信息来落实。A的 <code>awaken the conscience of officials</code> 把目标改成官员内在良知被唤醒，原文却没有描述官员悔悟或思想转变。</p>\n<p>外部记录与规则的作用，是让公务行为有可查的信息和限制，而不是先证明官员在内心变好。即使有人因此更自觉，也不是本段已经说出的法律需要。A把制度对行为的约束换成了道德心理教育，不能解释作者为什么接连列这些公开信息。</p>\n<p><strong>会议记录和财富来源信息的要求，是否被作者说明为唤醒官员内心良知的手段？</strong></p>\n<p>不能。段落明说的是平等接触和防止偏袒，不是官员心理上受到感化。</p>\n<p>A把外部可落实的制度目标改成内部道德变化。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,1062,996,273]],"questionRects":[[188,1127,908,34],[234,1178,460,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `awaken the conscience of officials` 说官员内心发生变化，第六段的 `ensure equality of access to government` 则给出外在公共目标，因此回看这种需要接到哪一层，再看具体法律例子。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"ensure equality of access to government","visibleOptionAnchor":"awaken the conscience of officials"}}}},{"section":"39题","raw":"### B. allow for certain kinds of **[xxx]**\n\n> 允许某些种类的 **[xxx]**\n\n把B接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了允许某些种类的 **[xxx]**。\n\nB的 `certain kinds of` 像是在区分哪些活动可以进行，第六段的 `rules on lobbying` 则是作者举出的一类行为规则，所以回看such as这组例子与前面的禁止偏袒之间怎么相接。\n\n> Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift. This type of **[xxx]** requires well-enforced laws in government **[xxx]**, such as records of official meetings, rules on lobbying, and information about each elected leader’s source of wealth.\n\n`rules on lobbying` 说明作者确实想对不同的接触政府活动立规则，B的 `certain kinds of` 又留下了“有些可以、有些不可以”这一可能的区别。第六段禁止因捐款礼物给予特殊照顾，并不表示一切会面和联系都不允许，前面的正常回应职责仍在。\n\n但B被允许的活动是 **[xxx]**，没有读清。它究竟是在概括合法活动的界线，还是把一个规则例子当成整段目的，目前还没有完全拉开。B至少能接到行为规则这一层，先不把其未知活动名词补成某个已知词再删掉。\n\n**这段既禁止偏袒又提出行为规则，能否立刻排除B所说的某些活动可能被允许？**\n\n还不能。规则确实涉及行为界线，但B究竟允许什么尚未读清，它与整段目的的关系仍需判断。\n\nB暂时保留，疑点在于它是在说规则服务的目标，还是只说规则中的一类活动。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. allow for certain kinds of <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>允许某些种类的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把B接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了允许某些种类的 <span class=\"mask\">[xxx]</span>。</p>\n<p>B的 <code>certain kinds of</code> 像是在区分哪些活动可以进行，第六段的 <code>rules on lobbying</code> 则是作者举出的一类行为规则，所以回看such as这组例子与前面的禁止偏袒之间怎么相接。</p>\n<blockquote>\n<p>Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift. This type of <span class=\"mask\">[xxx]</span> requires well-enforced laws in government <span class=\"mask\">[xxx]</span>, such as records of official meetings, rules on lobbying, and information about each elected leader’s source of wealth.</p>\n</blockquote>\n<p><code>rules on lobbying</code> 说明作者确实想对不同的接触政府活动立规则，B的 <code>certain kinds of</code> 又留下了“有些可以、有些不可以”这一可能的区别。第六段禁止因捐款礼物给予特殊照顾，并不表示一切会面和联系都不允许，前面的正常回应职责仍在。</p>\n<p>但B被允许的活动是 <span class=\"mask\">[xxx]</span>，没有读清。它究竟是在概括合法活动的界线，还是把一个规则例子当成整段目的，目前还没有完全拉开。B至少能接到行为规则这一层，先不把其未知活动名词补成某个已知词再删掉。</p>\n<p><strong>这段既禁止偏袒又提出行为规则，能否立刻排除B所说的某些活动可能被允许？</strong></p>\n<p>还不能。规则确实涉及行为界线，但B究竟允许什么尚未读清，它与整段目的的关系仍需判断。</p>\n<p>B暂时保留，疑点在于它是在说规则服务的目标，还是只说规则中的一类活动。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[168,1062,996,273]],"questionRects":[[188,1127,908,34],[233,1229,466,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `certain kinds of` 像是在区分哪些活动可以进行，第六段的 `rules on lobbying` 则是作者举出的一类行为规则，所以回看such as这组例子与前面的禁止偏袒之间怎么相接。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"rules on lobbying","visibleOptionAnchor":"certain kinds of"}}}},{"section":"39题","raw":"### C. guarantee **[xxx]** play in official access\n\n> 保障接触政府过程中的 **[xxx]** 对待\n\n把C接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了保障接触政府时的 **[xxx]** 对待。\n\nC的 `official access` 与第六段的 `equality of access to government` 都说接触政府的机会，因此回看段首的目标，再看为什么捐款礼物不能成为特殊照顾的理由。\n\n> But the ruling **[xxx]** the need for citizens and their elected representatives, not the courts, to ensure equality of access to government. Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.\n\n`official access` 对应的是向政府获取信息、安排会面这一类接触。`equality of access to government` 又明确指出这些接触应具备什么性质，后一句用must not be allowed to play favorites说明不能因为收钱收礼而改变对待。C的guarantee也与这里的ensure相接。\n\n但是C在play前面的 **[xxx]** 还没有读清，不能直接把整个短语翻成原文的equality。它的对象与保障动作都很接近段首，B则保留了规则可能区分合法活动的一层。先让两项各自站在它能接到的位置，再用全文看法律安排到底要维护什么。\n\n**C的保障动作和接触政府这一对象，是否能与段首ensure及access接起来？**\n\n能。但 **[xxx]** 所限定的对待性质还不清楚，因此先保留，不把未读清的修饰部分补掉。\n\nC与B构成这一轮的两项：一项说某些活动是否允许，一项说接触政府时的对待。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. guarantee <span class=\"mask\">[xxx]</span> play in official access</h3>\n<blockquote>\n<p>保障接触政府过程中的 <span class=\"mask\">[xxx]</span> 对待</p>\n</blockquote>\n<p>把C接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了保障接触政府时的 <span class=\"mask\">[xxx]</span> 对待。</p>\n<p>C的 <code>official access</code> 与第六段的 <code>equality of access to government</code> 都说接触政府的机会，因此回看段首的目标，再看为什么捐款礼物不能成为特殊照顾的理由。</p>\n<blockquote>\n<p>But the ruling <span class=\"mask\">[xxx]</span> the need for citizens and their elected representatives, not the courts, to ensure equality of access to government. Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.</p>\n</blockquote>\n<p><code>official access</code> 对应的是向政府获取信息、安排会面这一类接触。<code>equality of access to government</code> 又明确指出这些接触应具备什么性质，后一句用must not be allowed to play favorites说明不能因为收钱收礼而改变对待。C的guarantee也与这里的ensure相接。</p>\n<p>但是C在play前面的 <span class=\"mask\">[xxx]</span> 还没有读清，不能直接把整个短语翻成原文的equality。它的对象与保障动作都很接近段首，B则保留了规则可能区分合法活动的一层。先让两项各自站在它能接到的位置，再用全文看法律安排到底要维护什么。</p>\n<p><strong>C的保障动作和接触政府这一对象，是否能与段首ensure及access接起来？</strong></p>\n<p>能。但 <span class=\"mask\">[xxx]</span> 所限定的对待性质还不清楚，因此先保留，不把未读清的修饰部分补掉。</p>\n<p>C与B构成这一轮的两项：一项说某些活动是否允许，一项说接触政府时的对待。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[168,1062,996,273]],"questionRects":[[188,1127,908,34],[233,1280,483,33]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `official access` 与第六段的 `equality of access to government` 都说接触政府的机会，因此回看段首的目标，再看为什么捐款礼物不能成为特殊照顾的理由。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"equality of access to government","visibleOptionAnchor":"official access"}}}},{"section":"39题","raw":"### D. inspire hopes in average people\n\n> 让普通人产生希望\n\n把D接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了让普通人产生希望。\n\nD的 `inspire hopes` 说激发心理上的希望，第六段的 `ensure equality` 则说确保一种公共关系，因此回看ensure后面的具体内容，比较承诺的到底是感受还是待遇。\n\n> But the ruling **[xxx]** the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.\n\n`ensure equality` 要落实的是接触政府的平等性，而D的 `inspire hopes` 只要求普通人受到鼓舞、产生期待。一个人心里有希望，并不等于真的可以与送礼捐款的人平等获得信息或会面机会；原段明确要求的比心理感受具体得多。\n\n后面的公务会议记录、财富来源等例子，也都是让行为可以记录、监督和规范，不是在安排面向公众的鼓舞宣传。普通人可能因此更有信心，但那是可能伴随的感受，不能替代作者明写的制度目标。D把实际待遇换成了情绪结果。\n\n**确保公众有平等接触政府的机会，是否只等于让普通人对未来产生希望？**\n\n不等于。前者要求改变或保障实际对待，后者只是心理状态，两者不能互相替代。\n\nD把原文的公共权利目标降成了对公众情绪的影响。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. inspire hopes in average people</h3>\n<blockquote>\n<p>让普通人产生希望</p>\n</blockquote>\n<p>把D接回题干，它说的是：需要得到良好执行的政府透明方面法律，是为了让普通人产生希望。</p>\n<p>D的 <code>inspire hopes</code> 说激发心理上的希望，第六段的 <code>ensure equality</code> 则说确保一种公共关系，因此回看ensure后面的具体内容，比较承诺的到底是感受还是待遇。</p>\n<blockquote>\n<p>But the ruling <span class=\"mask\">[xxx]</span> the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.</p>\n</blockquote>\n<p><code>ensure equality</code> 要落实的是接触政府的平等性，而D的 <code>inspire hopes</code> 只要求普通人受到鼓舞、产生期待。一个人心里有希望，并不等于真的可以与送礼捐款的人平等获得信息或会面机会；原段明确要求的比心理感受具体得多。</p>\n<p>后面的公务会议记录、财富来源等例子，也都是让行为可以记录、监督和规范，不是在安排面向公众的鼓舞宣传。普通人可能因此更有信心，但那是可能伴随的感受，不能替代作者明写的制度目标。D把实际待遇换成了情绪结果。</p>\n<p><strong>确保公众有平等接触政府的机会，是否只等于让普通人对未来产生希望？</strong></p>\n<p>不等于。前者要求改变或保障实际对待，后者只是心理状态，两者不能互相替代。</p>\n<p>D把原文的公共权利目标降成了对公众情绪的影响。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,1062,996,273]],"questionRects":[[188,1127,908,34],[233,1332,426,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `inspire hopes` 说激发心理上的希望，第六段的 `ensure equality` 则说确保一种公共关系，因此回看ensure后面的具体内容，比较承诺的到底是感受还是待遇。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"ensure equality","visibleOptionAnchor":"inspire hopes"}}}},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n这一轮留下B和C，先继续做后面的题。","contextRaw":"","html":"<h3>39题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下B和C，先继续做后面的题。</p>\n","articleRects":[],"questionRects":[[188,1127,908,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n**The author’s attitude toward the court’s ruling is ______.**\n\n作者对法院这项裁决持什么态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **sarcastic**\n\n讽刺的\n\nB. **tolerant**\n\n容忍的\n\nC. **skeptical**\n\n怀疑的\n\nD. **supportive**\n\n支持的","contextRaw":"","html":"<h2>40题</h2>\n<p><strong>The author’s attitude toward the court’s ruling is ______.</strong></p>\n<p>作者对法院这项裁决持什么态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>sarcastic</strong></p>\n<p>讽刺的</p>\n<p>B. <strong>tolerant</strong></p>\n<p>容忍的</p>\n<p>C. <strong>skeptical</strong></p>\n<p>怀疑的</p>\n<p>D. <strong>supportive</strong></p>\n<p>支持的</p>\n","articleRects":[],"questionRects":[[187,1434,748,33]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。 | 先说处理结果与行为评价的不同 |\n| 2 | 说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。 | 再说作出处理依据的边界 |\n| 3 | 说明帮助送礼者接触其他官员并非一概属于腐败，另有意图方面的限定。 | 接着举出不能一概算在内的情形 |\n| 4 | 区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。 | 然后把不喜欢与应怎样处理分开 |\n| 5 | 作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。 | 再说为什么这样的区分有道理 |\n| 6 | 转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。 | 接着提醒还有另一件事需要做好 |\n| 7 | 强调接触偏袒不总是腐败，但双重标准与买关系会影响平等对待，良政应重视每个人。 | 然后说清这件事为什么重要 |\n| 8 | 以a step forward明确评价裁决在反腐败与反官方偏袒两方面的意义。 | 最后说整个处理值不值得肯定 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>报道法院推翻腐败定罪，但同时用捏鼻子的姿态表达对收礼行为的反应。</td>\n  <td>先说处理结果与行为评价的不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明原审未告知陪审团须限于公务行为，并界定与职责有关的具体问题决定。</td>\n  <td>再说作出处理依据的边界</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>说明帮助送礼者接触其他官员并非一概属于腐败，另有意图方面的限定。</td>\n  <td>接着举出不能一概算在内的情形</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>区分收好处令人厌恶与法律上需要的利益证据，列合同批准及不属公务行为的普通联络。</td>\n  <td>然后把不喜欢与应怎样处理分开</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>作者明确称裁决legally sound，并以民选代表应听取选民、回应关切解释这一法律区分。</td>\n  <td>再说为什么这样的区分有道理</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>转向公民和代表维护平等接触政府的责任，要求禁止因礼物捐款而偏袒，并列记录、规则等安排。</td>\n  <td>接着提醒还有另一件事需要做好</td>\n</tr>\n<tr>\n  <td>7</td>\
