lockquote>\n\u003cp>可能揭示夏威夷文化的起源\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“may [xxx] the origin of Hawaiian culture”，保留了相应遮挡。当时的定位线索是：C的 origin of Hawaiian culture 谈文化的来处，第五段的 where we come from 也在追问来处，因此回看谁在问这个问题，以及这里的we具体指向什么。读完全文后，做题模式再经交叉验证排除C，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第5段把科学与文化并置，说二者都寻求回答who we are、where we come from、where we are going等大问题。这里强调探索的共同追问，而不是天文学正在考证一种特定文化怎样产生。\u003c/p>\n\u003cp>A所说实现古代夏威夷人的梦想，与同一种好奇心曾带来古代远航、如今激励天文学探索天际的古今接续相符。C虽重复origin话题，却把共同探索改成了特定文化溯源。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>由第五段可推知，现代天文学的发展可能揭示夏威夷文化的起源。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 origin of Hawaiian culture 谈文化的来处，第五段的 where we come from 也在追问来处，因此回看谁在问这个问题，以及这里的we具体指向什么。\u003c/p>\n\u003cp>第5段把科学与文化并置，说二者都寻求回答who we are、where we come from、where we are going等大问题。这里强调探索的共同追问，而不是天文学正在考证一种特定文化怎样产生。\u003c/p>\n\u003cp>C中的the origin of Hawaiian culture把“我们从何处来”的宽泛追问缩成夏威夷文化的历史起源，又把天文学写成可能揭开这一文化起源的工具。原文没有建立这种研究对象和成果关系。\u003c/p>\n\u003cp>A所说实现古代夏威夷人的梦想，与同一种好奇心曾带来古代远航、如今激励天文学探索天际的古今接续相符。C虽重复origin话题，却把共同探索改成了特定文化溯源。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003cp>同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Modern astronomy may reveal how Hawaiian culture originated.\u003c/p>\n\u003cp>现代天文学可能揭示夏威夷文化如何起源。\u003c/p>\n\u003c/blockquote>\n\u003cp>where we come from是人类与祖先家园的宽泛追问，选项缩成夏威夷文化的形成史；may减弱确定性，却不能补出不同的研究对象。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持共处，因而本段应寻找科学与本地文化的共同追求。能推出探索愿望的延续，但不能据此保证文化起源被揭开或反对者必然转变态度。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>may uncover the origin of Hawaiian culture\u003cbr>可能揭示夏威夷文化的起源\u003c/p>\n\u003c/blockquote>\n\u003cp>A所说实现古代夏威夷人的梦想，与同一种好奇心曾带来古代远航、如今激励天文学探索天际的古今接续相符。C虽重复origin话题，却把共同探索改成了特定文化溯源。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. will eventually soften Hawaiians’ hostility\u003c/h3>\n\u003cblockquote>\n\u003cp>最终将缓和夏威夷人的敌意\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 soften Hawaiians’ hostility 说当地人的态度会改变，第五段的 Calls to 指前面反对发展的呼声，因此回看作者回应这些呼声时，是给出共同点，还是预测反对者未来的心理变化。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文从 Calls to 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。D的 soften Hawaiians’ hostility 则要求再走一步：当地人将接受这一说理，敌意也会减轻。作者说明某种反对忽略了事实，并不等于反对者已经或必将改变看法。\u003c/p>\n\u003cp>说理的内容与受众将怎样反应之间还隔着一步，原文没有作出这种未来保证。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>由第五段可推知，现代天文学的发展最终将缓和夏威夷人的敌意。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 soften Hawaiians’ hostility 说当地人的态度会改变，第五段的 Calls to 指前面反对发展的呼声，因此回看作者回应这些呼声时，是给出共同点，还是预测反对者未来的心理变化。\u003c/p>\n\u003cp>原文从 Calls to 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。D的 soften Hawaiians’ hostility 则要求再走一步：当地人将接受这一说理，敌意也会减轻。作者说明某种反对忽略了事实，并不等于反对者已经或必将改变看法。\u003c/p>\n\u003cp>will eventually还把这种态度转变说成最终会出现的结果。该段没有提供反对者如何回应，也没有给出天文学进展导致敌意变化的时间过程。能用来回应反对的理由，不必然产生D所说的心理效果。\u003c/p>\n\u003cp>说理的内容与受众将怎样反应之间还隔着一步，原文没有作出这种未来保证。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003cp>同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Progress in astronomy will eventually make hostile Hawaiians change their attitude.\u003c/p>\n\u003cp>天文学进步最终会让怀有敌意的夏威夷人改变态度。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者给出和解理由，不代表反对者必将接受。若保证敌意缓和，就要写当地人的反应及转变过程，原段没有。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持共处，因而本段应寻找科学与本地文化的共同追求。能推出探索愿望的延续，但不能据此保证文化起源被揭开或反对者必然转变态度。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>will eventually soften Hawaiians’ hostility\u003cbr>最终将缓和夏威夷人的敌意\u003c/p>\n\u003c/blockquote>\n\u003cp>说理的内容与受众将怎样反应之间还隔着一步，原文没有作出这种未来保证。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. A. is fulfilling the dreams of ancient Hawaiians\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：The same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。\u003c/p>\n\u003cp>B：astronomy and Hawaiian culture both seek to answer 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。\u003c/p>\n\u003cp>C：第5段把科学与文化并置，说二者都寻求回答who we are、where we come from、where we are going等大问题。\u003c/p>\n\u003cp>D：原文从 Calls to 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：历史与现实的对比\u003c/strong>（段落1引入主题） 历史荣耀：（古代夏威夷人是天文学家 + 观星者是社会最受尊敬的成员）// 现实困境：（TMT建设引发抗议）\u003c/p>\n\u003cp>↓（争议焦点）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：莫纳克亚山的双重身份\u003c/strong>（段落2-3冲突根源） 神圣意义：（被崇拜为piko，连接夏威夷群岛与天堂）// 科学价值：（世界最强大望远镜所在地 + 地理条件得天独厚）→ 反对声音：【小而直言的群体长期反对：（视为对神圣土地的不敬 + 占领历史的痛苦提醒）】\u003c/p>\n\u003cp>↓（责任归属）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：天文学家的失误与文化复兴\u003c/strong>（段落4反思批判） 天文学家的错误：【急于建造更大望远镜 → 忘记科学不是理解世界的唯一方式 + 未优先保护生态系统和神圣性】→ 文化现实：夏威夷文化不是遗物而是正在复兴的活文化\u003c/p>\n\u003cp>↓（更深层的共通性）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：科学与文化的共同追求\u003c/strong>（段落5哲学思考） 共同根源：（科学也有文化历史，根源可追溯到文明黎明）→ 相同动力：（探索未知的好奇心：既带来波利尼西亚人到夏威夷，也激励天文学家探索天空）→ 共同目标：【天文学和夏威夷文化都寻求回答：我们是谁、从哪里来、要去哪里】→ 探索星空是回应了解自己和祖先家园的原始召唤\u003c/p>\n\u003cp>↓（解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：妥协与共存\u003c/strong>（段落6和解展望） 天文学界的妥协：【选址考虑：（最小化可见度 + 避免考古和环境影响）+ 数量控制：（移除旧望远镜 + 恢复自然状态）】→ 共存愿景：每个人都可以在莫纳克亚山拥抱文化遗产并研究星星\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：虽然TMT建设在莫纳克亚山引发了科学与文化的冲突，但通过认识到两者共同的探索精神和相互妥协，可以实现科学研究与文化传承的和谐共存。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. A Shared Search Behind the Dispute\u003c/p>\n\u003cp>B. Coexistence Requires Practical Commitments\u003c/p>\n\u003cp>C. Treating Culture as a Finished Chapter\u003c/p>\n\u003cp>D. An Unexpected Conflict with an Old Tradition\u003c/p>\n\u003cp>E. A Case for Removing Every Telescope\u003c/p>\n\u003cp>F. Why Opposition Cannot Be Dismissed\u003c/p>\n\u003cp>G. One Mountain with Two Kinds of Value\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A culture with a long history of studying the stars might appear an obvious partner for modern astronomy. That expectation makes conflict over a new telescope particularly striking. The contrast does not prove that either side is irrational. It introduces the problem the debate must address: activities with a shared interest in the heavens can still collide when they attach different meanings to the place from which observation occurs.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>A mountain can offer exceptionally clear views of the sky while also holding sacred significance for local people. Neither value automatically erases the other. For astronomers, height and atmospheric conditions shape what a telescope can detect. For a community, the same landscape may connect people to origins, identity and inherited responsibilities. A serious discussion of development must therefore recognise why the site matters in two different ways before judging the claims made about it.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Opposition to telescopes may carry memories of political loss as well as concern for a particular patch of ground. Scientists who see only an equipment dispute can miss that history. Their own behaviour may also deepen mistrust when they give too little attention to ecosystems or local understandings of the mountain. Listening to these objections is not a rejection of science. It is necessary for recognising a living community rather than treating its culture as a museum object.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>A demand to remove every telescope can overlook another connection. Astronomy and cultural traditions both ask questions about origins, human identity and our place in a larger world. They use different approaches, but the curiosity behind them need not be mutually hostile. Recognising that common search does not settle every planning dispute. It does challenge the claim that respect for one must require the complete disappearance of the other.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>Shared curiosity becomes useful only when it is accompanied by practical changes. A project can reduce its visual impact, protect sensitive areas and provide for the retirement of older equipment. Such commitments make compromise something more than a welcoming phrase. They also allow cooperation to be judged against observable actions. The aim is a future in which people can honour cultural inheritance and study the stars without assuming that only one activity may belong on the mountain.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. An Unexpected Conflict with an Old Tradition / 与古老传统形成反差的冲突\u003c/strong>\u003c/p>\n\u003cp>以古代观星传统和现代反对的反差引出问题。\u003c/p>\n\u003cblockquote>\n\u003cp>A culture with a long history of studying the stars might appear an obvious partner for modern astronomy.\u003c/p>\n\u003cp>It introduces the problem the debate must address: activities with a shared interest in the heavens can still collide when they attach different meanings to the place from which observation occurs.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以古代观星传统和现代反对的反差引出问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>Old Tradition对应文化中长期的观星兴趣，Unexpected Conflict对应如今围绕新望远镜发生争议；标题用反差提出问题，不替任一方先作非理性定性。\u003c/p>\n\u003cp>最强干扰项C（Treating Culture as a Finished Chapter）容易因相同话题进入考虑。但传统仍影响当下对地点的理解，不能把它当作已经过去的历史。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. One Mountain with Two Kinds of Value / 一座山的两种价值\u003c/strong>\u003c/p>\n\u003cp>并列说明观测条件与文化圣地意义。\u003c/p>\n\u003cblockquote>\n\u003cp>A mountain can offer exceptionally clear views of the sky while also holding sacred significance for local people.\u003c/p>\n\u003cp>A serious discussion of development must therefore recognise why the site matters in two different ways before judging the claims made about it.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>并列说明观测条件与文化圣地意义。\u003c/p>\n\u003c/blockquote>\n\u003cp>One Mountain对应同一观测地点，Two Kinds of Value分别对应清晰成像的自然条件与当地社会的圣地意义。\u003c/p>\n\u003cp>最强干扰项E（A Case for Removing Every Telescope）容易因相同话题进入考虑。但呈现双重价值是讨论的基础，并未据此直接推出全部拆除。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Why Opposition Cannot Be Dismissed / 反对声音为何不能被轻视\u003c/strong>\u003c/p>\n\u003cp>解释历史伤痛与科学界疏忽，要求理解活着的文化。\u003c/p>\n\u003cblockquote>\n\u003cp>Opposition to telescopes may carry memories of political loss as well as concern for a particular patch of ground.\u003c/p>\n\u003cp>It is necessary for recognising a living community rather than treating its culture as a museum object.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释历史伤痛与科学界疏忽 → 要求理解活着的文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>Opposition对应居民对设备存在的异议，Cannot Be Dismissed对应政治失落记忆、生态忽略和活文化诉求构成的真实理由。\u003c/p>\n\u003cp>最强干扰项C（Treating Culture as a Finished Chapter）容易因相同话题进入考虑。但结尾明确反对把文化当博物馆对象，传统并未失去现实生命。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. A Shared Search Behind the Dispute / 争议背后共同的追问\u003c/strong>\u003c/p>\n\u003cp>以共同追问反对科学与文化必然互斥的判断。\u003c/p>\n\u003cblockquote>\n\u003cp>A demand to remove every telescope can overlook another connection.\u003c/p>\n\u003cp>It does challenge the claim that respect for one must require the complete disappearance of the other.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以共同追问反对科学与文化必然互斥的判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>Shared Search对应天文学与文化传统共同追问起源、身份和世界位置，Behind the Dispute对应这些共同点仍藏在表面冲突之下。\u003c/p>\n\u003cp>最强干扰项E（A Case for Removing Every Telescope）容易因相同话题进入考虑。但本段正批评全面拆除，没有为一刀切排斥天文学提供理由。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. Coexistence Requires Practical Commitments / 共存需要具体承诺\u003c/strong>\u003c/p>\n\u003cp>用减小影响、保护地点与退役旧设备落实共存。\u003c/p>\n\u003cblockquote>\n\u003cp>Shared curiosity becomes useful only when it is accompanied by practical changes.\u003c/p>\n\u003cp>The aim is a future in which people can honour cultural inheritance and study the stars without assuming that only one activity may belong on the mountain.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>用减小影响、保护地点与退役旧设备落实共存。\u003c/p>\n\u003c/blockquote>\n\u003cp>Coexistence对应同时传承文化和探索星空，Practical Commitments对应降低可见度、保护敏感区域及退役旧设备；标题把共同兴趣推进成行动。\u003c/p>\n\u003cp>最强干扰项G（One Mountain with Two Kinds of Value）容易因相同话题进入考虑。但双重价值在此已转化为行动安排，标题需覆盖妥协如何执行。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>An ancient interest in the stars does not prevent a modern community from opposing a telescope. The apparent contradiction becomes easier to understand when the proposed site is considered. A mountain is more than a convenient platform for scientific equipment to the people whose history is attached to it.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere. Yet its importance to local people is not measured by image clarity. Sacred associations connect the landscape with identity and origins, giving the same place a second kind of value.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Treating culture as a participant opens the possibility of discovering shared questions. Astronomy and Hawaiian traditions both explore where people come from and how they understand their place in the world. The methods differ, but the search for meaning provides a reason to discuss coexistence rather than assume permanent hostility.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Coexistence requires more than agreement that curiosity is valuable. It must affect project design and the treatment of the site. Reducing visibility, protecting sensitive places and retiring older instruments are examples of commitments that can translate a general willingness to cooperate into practical choices.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>The historical burden does not remove scientists’ present responsibilities. Neglect of environmental protection or local concerns can make mistrust worse. Recognising those mistakes is necessary, particularly when a living culture has been treated as a relic rather than as a participant in decisions about its own landscape.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>That second kind of value can be especially sensitive when the community remembers a loss of political independence. Development may then resemble another assertion of outside power. Objections cannot be understood solely as preferences about the appearance of buildings; they also carry a historical burden.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Those practical choices give both sides something concrete to evaluate. A promise can be checked against what is built, protected or removed. This does not make every disagreement disappear, but it avoids asking a community to accept development solely on the strength of scientists’ assurances about good intentions.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Good intentions become credible through these shared responsibilities. Science need not deny the mountain’s cultural meaning, and cultural respect need not forbid every attempt to study the sky. The stronger position is to make room for both pursuits while requiring those who use the place to care for it.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>由观星传统反差转向地点意义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>说明山峰的两种价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>从平等参与转向共同追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>将共存变为选址与设计承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>要求科学界承认现时疏忽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由文化价值追到政治历史伤痛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明可观察行动如何建立信任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以有责任的科学文化共存收束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由观星传统反差转向地点意义 → 说明山峰的两种价值 → 由文化价值追到政治历史伤痛 → 要求科学界承认现时疏忽 → 从平等参与转向共同追问 → 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任 → 以有责任的科学文化共存收束\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → F → E → C → D → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、F、C、D、G。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → B → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A mountain is more than a convenient platform for scientific equipment to the people whose history is attached to it.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That second kind of value can be especially sensitive when the community remembers a loss of political independence.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a mountain\u003c/code>，B继续处理这一对象，完成“说明山峰的两种价值”。到本段末尾，讨论又落到\u003ccode>a second kind of value\u003c/code>，这正好为下一段“由文化价值追到政治历史伤痛”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由观星传统反差转向地点意义 → 说明山峰的两种价值 → 由文化价值追到政治历史伤痛\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“由文化价值追到政治历史伤痛”。它也属于同一论题，但若直接放在这里，就会跳过“说明山峰的两种价值”这一必要环节；其段首“That second kind of value can be especially sensitive when the community remembers a loss of political independence.”需要的前提与A当前收束的对象不一致，后续也接不出F所需的\u003ccode>a second kind of value\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是B → F → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Sacred associations connect the landscape with identity and origins, giving the same place a second kind of value.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That second kind of value can be especially sensitive when the community remembers a loss of political independence.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The historical burden does not remove scientists’ present responsibilities.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a second kind of value\u003c/code>，F继续处理这一对象，完成“由文化价值追到政治历史伤痛”。到本段末尾，讨论又落到\u003ccode>historical burden\u003c/code>，这正好为下一段“要求科学界承认现时疏忽”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明山峰的两种价值 → 由文化价值追到政治历史伤痛 → 要求科学界承认现时疏忽\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“说明山峰的两种价值”。它也属于同一论题，但若直接放在这里，就会跳过“由文化价值追到政治历史伤痛”这一必要环节；其段首“The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere.”需要的前提与B当前收束的对象不一致，后续也接不出E所需的\u003ccode>historical burden\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → C → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Recognising those mistakes is necessary, particularly when a living culture has been treated as a relic rather than as a participant in decisions about its own landscape.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Treating culture as a participant opens the possibility of discovering shared questions.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Coexistence requires more than agreement that curiosity is valuable.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a participant\u003c/code>，C继续处理这一对象，完成“从平等参与转向共同追问”。到本段末尾，讨论又落到\u003ccode>coexistence\u003c/code>，这正好为下一段“将共存变为选址与设计承诺”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>要求科学界承认现时疏忽 → 从平等参与转向共同追问 → 将共存变为选址与设计承诺\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“将共存变为选址与设计承诺”。它也属于同一论题，但若直接放在这里，就会跳过“从平等参与转向共同追问”这一必要环节；其段首“Coexistence requires more than agreement that curiosity is valuable.”需要的前提与E当前收束的对象不一致，后续也接不出D所需的\u003ccode>coexistence\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是C → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The methods differ, but the search for meaning provides a reason to discuss coexistence rather than assume permanent hostility.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Coexistence requires more than agreement that curiosity is valuable.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those practical choices give both sides something concrete to evaluate.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>coexistence\u003c/code>，D继续处理这一对象，完成“将共存变为选址与设计承诺”。到本段末尾，讨论又落到\u003ccode>practical choices\u003c/code>，这正好为下一段“说明可观察行动如何建立信任”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从平等参与转向共同追问 → 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“从平等参与转向共同追问”。它也属于同一论题，但若直接放在这里，就会跳过“将共存变为选址与设计承诺”这一必要环节；其段首“Treating culture as a participant opens the possibility of discovering shared questions.”需要的前提与C当前收束的对象不一致，后续也接不出G所需的\u003ccode>practical choices\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是D → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing visibility, protecting sensitive places and retiring older instruments are examples of commitments that can translate a general willingness to cooperate into practical choices.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those practical choices give both sides something concrete to evaluate.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Good intentions become credible through these shared responsibilities.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>practical choices\u003c/code>，G继续处理这一对象，完成“说明可观察行动如何建立信任”。到本段末尾，讨论又落到\u003ccode>good intentions\u003c/code>，这正好为下一段“以有责任的科学文化共存收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将共存变为选址与设计承诺 → 说明可观察行动如何建立信任 → 以有责任的科学文化共存收束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“将共存变为选址与设计承诺”。它也属于同一论题，但若直接放在这里，就会跳过“说明可观察行动如何建立信任”这一必要环节；其段首“Coexistence requires more than agreement that curiosity is valuable.”需要的前提与D当前收束的对象不一致，后续也接不出H所需的\u003ccode>good intentions\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>cultural heritage preservation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文化遗产保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：传统文化保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scientific curiosity\u003c/td>\n\u003ctd>科学好奇心\u003c/td>\n\u003ctd>社会现象类：科技发展\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mutual understanding\u003c/td>\n\u003ctd>相互理解\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation across communities\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>跨群体合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>environmental responsibility\u003c/td>\n\u003ctd>环境责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>respect for cultural diversity\u003c/td>\n\u003ctd>尊重文化多样性\u003c/td>\n\u003ctd>社会现象类：文化交流\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>a willingness to listen\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>倾听的意愿\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>creative compromise\u003c/td>\n\u003ctd>创造性的妥协\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a long-term perspective\u003c/td>\n\u003ctd>长远眼光\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture presents a tension between scientific development and cultural heritage.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画呈现科学发展与文化遗产之间的张力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A and B are seeking a way to share the same place responsibly.\u003c/td>\n\u003ctd>A与B正寻求负责任地共享同一地点的方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene invites a comparison between different approaches to a shared question.\u003c/td>\n\u003ctd>画面引导人们比较针对共同问题的不同探索方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The proportion of resources devoted to A rose from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>投入A的资源比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show growing attention to both A and B.\u003c/td>\n\u003ctd>这些数字显示对A与B的关注都在增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Investment in A increased while its impact on B was reduced.\u003c/td>\n\u003ctd>对A的投入增加，而它对B的影响减小。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage begins with a contrast between an old tradition and a present dispute.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文以古老传统与当前争议之间的反差开篇。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author recognises the concerns of both sides before proposing practical compromises.\u003c/td>\n\u003ctd>作者先承认双方关切，再提出具体妥协办法。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion suggests that A and B can pursue shared questions without losing their distinct identities.\u003c/td>\n\u003ctd>讨论表明A与B可在保留各自特性的同时探寻共同问题。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";

function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);

function guardedSchedule(token,fn){

 });
