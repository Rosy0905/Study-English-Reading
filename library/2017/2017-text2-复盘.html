 home\u003c/td>\n\u003ctd>祖先家园\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第6段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>astronomy community\u003c/td>\n\u003ctd>天文学界\u003c/td>\n\u003ctd>make compromises\u003c/td>\n\u003ctd>作出妥协\u003c/td>\n\u003ctd>site\u003c/td>\n\u003ctd>n.选址\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>minimize\u003c/td>\n\u003ctd>v.尽量减少\u003c/td>\n\u003ctd>visibility\u003c/td>\n\u003ctd>n.可见程度\u003c/td>\n\u003ctd>avoid\u003c/td>\n\u003ctd>v.避免\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>archaeological\u003c/td>\n\u003ctd>a.考古的\u003c/td>\n\u003ctd>environmental impact\u003c/td>\n\u003ctd>环境影响\u003c/td>\n\u003ctd>limit\u003c/td>\n\u003ctd>v.限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>remove\u003c/td>\n\u003ctd>v.移除\u003c/td>\n\u003ctd>lifetime\u003c/td>\n\u003ctd>n.使用寿命\u003c/td>\n\u003ctd>return to a natural state\u003c/td>\n\u003ctd>恢复自然状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reason\u003c/td>\n\u003ctd>n.理由\u003c/td>\n\u003ctd>welcome\u003c/td>\n\u003ctd>v.欢迎\u003c/td>\n\u003ctd>embrace cultural heritage\u003c/td>\n\u003ctd>接纳文化遗产\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897. Star watchers were among the most esteemed members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#39;s view of the cosmos.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; / wrote Queen Liliuokalani, / Hawaii&#39;s last reigning monarch, / in 1897.\u003c/p>\n\u003cp>Star watchers / were among the most esteemed members / of Hawaiian society.\u003c/p>\n\u003cp>Sadly, / all is not well / with astronomy in Hawaii today.\u003c/p>\n\u003cp>Protests have erupted / over construction of the Thirty Meter Telescope (TMT), / a giant observatory / that promises to revolutionize / humanity&#39;s view of the cosmos.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>&quot;古代夏威夷人是天文学家，&quot; / 莉莉乌奥卡拉尼女王写道，/ 夏威夷最后一位在位君主，/ 在1897年。\u003c/p>\n\u003cp>观星者 / 是最受尊敬的成员之一 / 在夏威夷社会中。\u003c/p>\n\u003cp>遗憾的是，/ 一切都不太好 / 关于天文学在今天的夏威夷。\u003c/p>\n\u003cp>抗议已经爆发 / 关于三十米望远镜（TMT）的建设，/ 一个巨型天文台 / 它承诺要彻底改变 / 人类对宇宙的看法。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>1897年，夏威夷最后一位在位君主莉莉乌奥卡拉尼女王写道：&quot;古代夏威夷人是天文学家。&quot;观星者在夏威夷社会中是最受尊敬的成员之一。遗憾的是，天文学在今天的夏威夷并不太平。关于建设三十米望远镜（TMT）的抗议已经爆发，这是一个承诺将彻底改变人类宇宙观的巨型天文台。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world&#39;s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>At issue is / the TMT&#39;s planned location / on Mauna Kea, / a dormant volcano / worshiped by some Hawaiians / as the piko, / that connects the Hawaiian Islands / to the heavens.\u003c/p>\n\u003cp>But Mauna Kea / is also home to / some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>Rested in the Pacific Ocean, / Mauna Kea&#39;s peak / rises above the bulk / of our planet&#39;s dense atmosphere, / where conditions allow telescopes / to obtain images / of unsurpassed clarity.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>争议的焦点是 / TMT计划的位置 / 在莫纳克亚山上，/ 一座休眠火山 / 被一些夏威夷人崇拜 / 作为piko，/ 它连接夏威夷群岛 / 与天堂。\u003c/p>\n\u003cp>但莫纳克亚山 / 也是所在地 / 世界上一些最强大的望远镜。\u003c/p>\n\u003cp>坐落在太平洋中，/ 莫纳克亚山的山峰 / 高出大部分 / 我们星球稠密的大气层，/ 那里的条件允许望远镜 / 获得图像 / 具有无与伦比的清晰度。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>争议的焦点是TMT计划建在莫纳克亚山上，这是一座休眠火山，被一些夏威夷人崇拜为&quot;piko&quot;——连接夏威夷群岛与天堂的纽带。但莫纳克亚山也是世界上一些最强大望远镜的所在地。坐落在太平洋中的莫纳克亚山山峰高出地球大部分稠密大气层，那里的条件使望远镜能够获得无与伦比的清晰图像。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Opposition to telescopes on Mauna Kea is nothing new. A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Opposition to telescopes / on Mauna Kea / is nothing new.\u003c/p>\n\u003cp>A small but vocal group / of Hawaiians and environmentalists / have long viewed their presence / as disrespect for sacred land / and a painful reminder / of the occupation / of what was once a sovereign nation.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>反对望远镜 / 在莫纳克亚山上 / 并不是新鲜事。\u003c/p>\n\u003cp>一个小但直言不讳的群体 / 夏威夷人和环保主义者的 / 长期以来一直视它们的存在 / 为对神圣土地的不敬 / 以及一个痛苦的提醒 / 关于占领 / 曾经是主权国家的地方。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>反对在莫纳克亚山上建望远镜并不是新鲜事。一小群但直言不讳的夏威夷人和环保主义者长期以来一直认为望远镜的存在是对神圣土地的不敬，也是对曾经主权国家被占领的痛苦提醒。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Some blame for the current controversy belongs to astronomers. In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always prioritize the protection of Mauna Kea&#39;s fragile ecosystems or its holiness to the island&#39;s inhabitants. Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Some blame / for the current controversy / belongs to astronomers.\u003c/p>\n\u003cp>In their eagerness / to build bigger telescopes, / they forgot / that science is not the only way / of understanding the world.\u003c/p>\n\u003cp>They did not always prioritize / the protection / of Mauna Kea&#39;s fragile ecosystems / or its holiness / to the island&#39;s inhabitants.\u003c/p>\n\u003cp>Hawaiian culture / is not a relic of the past; / it is a living culture / undergoing a renaissance today.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>一些责任 / 对于当前的争议 / 属于天文学家。\u003c/p>\n\u003cp>在他们的急切中 / 建造更大的望远镜，/ 他们忘记了 / 科学不是唯一的方式 / 理解世界的。\u003c/p>\n\u003cp>他们并不总是优先考虑 / 保护 / 莫纳克亚山脆弱的生态系统 / 或它的神圣性 / 对岛上居民来说。\u003c/p>\n\u003cp>夏威夷文化 / 不是过去的遗物；/ 它是一种活的文化 / 今天正在经历复兴。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>当前争议的一些责任在于天文学家。在急于建造更大望远镜的过程中，他们忘记了科学并不是理解世界的唯一方式。他们并不总是优先考虑保护莫纳克亚山脆弱的生态系统或其对岛上居民的神圣意义。夏威夷文化不是过去的遗物；它是一种活的文化，今天正在经历复兴。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too, with roots going back to the dawn of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens. Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too, / with roots going back / to the dawn of civilization.\u003c/p>\n\u003cp>The same curiosity / to find what lies beyond the horizon / that first brought early Polynesians / to Hawaii&#39;s shores / inspires astronomers today / to explore the heavens.\u003c/p>\n\u003cp>Calls to disassemble all telescopes / on Mauna Kea / or to ban future development there / ignore the reality / that astronomy and Hawaiian culture / both seek to answer big questions / about who we are, / where we come from / and where we are going.\u003c/p>\n\u003cp>Perhaps that is why / we explore the starry skies, / as if answering a primal calling / to know ourselves / and our true ancestral homes.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>然而科学也有文化历史，/ 其根源可以追溯到 / 文明的黎明。\u003c/p>\n\u003cp>同样的好奇心 / 去发现地平线之外的东西 / 最初带来早期波利尼西亚人 / 到夏威夷海岸 / 今天激励着天文学家 / 探索天空。\u003c/p>\n\u003cp>呼吁拆除所有望远镜 / 在莫纳克亚山上 / 或禁止未来在那里的开发 / 忽视了现实 / 天文学和夏威夷文化 / 都寻求回答重大问题 / 关于我们是谁，/ 我们从哪里来 / 以及我们要去哪里。\u003c/p>\n\u003cp>也许这就是为什么 / 我们探索星空，/ 仿佛在回应一种原始的召唤 / 去了解我们自己 / 和我们真正的祖先家园。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>然而，科学也有其文化历史，根源可以追溯到文明的黎明。同样的好奇心——探索地平线之外的东西——最初将早期波利尼西亚人带到夏威夷海岸，今天也激励着天文学家探索天空。呼吁拆除莫纳克亚山上所有望远镜或禁止未来开发的声音忽视了一个现实：天文学和夏威夷文化都在寻求回答关于我们是谁、从哪里来、要去哪里的重大问题。也许这就是我们探索星空的原因，仿佛在回应一种原始的召唤，去了解我们自己和我们真正的祖先家园。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>The astronomy community is making compromises to change its use of Mauna Kea. The TMT site was chosen to minimize the telescope&#39;s visibility around the island and to avoid archaeological and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>The astronomy community / is making compromises / to change its use / of Mauna Kea.\u003c/p>\n\u003cp>The TMT site / was chosen to minimize / the telescope&#39;s visibility / around the island / and to avoid / archaeological and environmental impact.\u003c/p>\n\u003cp>To limit the number of telescopes / on Mauna Kea, / old ones will be removed / at the end of their lifetimes / and their sites returned / to a natural state.\u003c/p>\n\u003cp>There is no reason / why everyone cannot be welcomed / on Mauna Kea / to embrace their cultural heritage / and to study the stars.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>天文学界 / 正在做出妥协 / 改变其使用 / 莫纳克亚山的方式。\u003c/p>\n\u003cp>TMT地点 / 被选择来最小化 / 望远镜的可见度 / 在岛屿周围 / 并避免 / 考古和环境影响。\u003c/p>\n\u003cp>为了限制望远镜的数量 / 在莫纳克亚山上，/ 旧的将被移除 / 在它们的使用寿命结束时 / 它们的地点将恢复 / 到自然状态。\u003c/p>\n\u003cp>没有理由 / 为什么每个人不能被欢迎 / 在莫纳克亚山上 / 拥抱他们的文化遗产 / 并研究星星。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>天文学界正在做出妥协，改变其使用莫纳克亚山的方式。TMT地点的选择是为了最小化望远镜在岛屿周围的可见度，并避免考古和环境影响。为了限制莫纳克亚山上望远镜的数量，旧望远镜将在使用寿命结束时被移除，其地点将恢复到自然状态。没有理由不欢迎每个人到莫纳克亚山来拥抱他们的文化遗产并研究星星。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; → wrote Queen Liliuokalani：(Hawaii&#39;s last reigning monarch)：(in 1897).\u003c/p>\n\u003cp>Star watchers → were among the most esteemed members：(of Hawaiian society).\u003c/p>\n\u003cp>Sadly → all is not well：(with astronomy in Hawaii today).\u003c/p>\n\u003cp>Protests have erupted：(over construction of the Thirty Meter Telescope (TMT))：(a giant observatory：(that promises to revolutionize → humanity&#39;s view of the cosmos)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>At issue is → the TMT&#39;s planned location：(on Mauna Kea)：(a dormant volcano：(worshiped by some Hawaiians：(as the piko：(that connects the Hawaiian Islands → to the heavens)))).\u003c/p>\n\u003cp>But Mauna Kea → is also home to：(some of the world&#39;s most powerful telescopes).\u003c/p>\n\u003cp>Rested in the Pacific Ocean → Mauna Kea&#39;s peak → rises above the bulk：(of our planet&#39;s dense atmosphere)：(where conditions allow telescopes → to obtain images：(of unsurpassed clarity)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Opposition to telescopes：(on Mauna Kea) → is nothing new.\u003c/p>\n\u003cp>A small but vocal group：(of Hawaiians and environmentalists) → have long viewed their presence：(as disrespect for sacred land + a painful reminder：(of the occupation：(of what was once a sovereign nation))).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Some blame：(for the current controversy) → belongs to astronomers.\u003c/p>\n\u003cp>In their eagerness：(to build bigger telescopes) → they forgot：(that science is not the only way：(of understanding the world)).\u003c/p>\n\u003cp>They did not always prioritize → the protection：(of Mauna Kea&#39;s fragile ecosystems) + its holiness：(to the island&#39;s inhabitants).\u003c/p>\n\u003cp>Hawaiian culture → is not a relic of the past; // it is a living culture：(undergoing a renaissance today).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too → with roots going back：(to the dawn of civilization).\u003c/p>\n\u003cp>The same curiosity：(to find what lies beyond the horizon)：(that first brought early Polynesians → to Hawaii&#39;s shores) → inspires astronomers today：(to explore the heavens).\u003c/p>\n\u003cp>Calls：(to disassemble all telescopes：(on Mauna Kea) + to ban future development there) → ignore the reality：(that astronomy and Hawaiian culture → both seek to answer big questions：(about who we are + where we come from + where we are going)).\u003c/p>\n\u003cp>Perhaps that is why → we explore the starry skies → as if answering a primal calling：(to know ourselves + our true ancestral homes).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>The astronomy community → is making compromises：(to change its use：(of Mauna Kea)).\u003c/p>\n\u003cp>The TMT site → was chosen：(to minimize → the telescope&#39;s visibility：(around the island) + to avoid → archaeological and environmental impact).\u003c/p>\n\u003cp>To limit the number of telescopes：(on Mauna Kea) → old ones will be removed：(at the end of their lifetimes) + their sites returned：(to a natural state).\u003c/p>\n\u003cp>There is no reason：(why everyone cannot be welcomed：(on Mauna Kea)：(to embrace their cultural heritage + to study the stars)).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>&quot;古代夏威夷人是天文学家，&quot; → 莉莉乌奥卡拉尼女王写道：(夏威夷最后一位在位君主)：(在1897年)。\u003c/p>\n\u003cp>观星者 → 是最受尊敬的成员之一：(在夏威夷社会中)。\u003c/p>\n\u003cp>遗憾的是 → 一切都不太好：(关于天文学在今天的夏威夷)。\u003c/p>\n\u003cp>抗议已经爆发：(关于三十米望远镜（TMT）的建设)：(一个巨型天文台：(它承诺要彻底改变 → 人类对宇宙的看法))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>争议的焦点是 → TMT计划的位置：(在莫纳克亚山上)：(一座休眠火山：(被一些夏威夷人崇拜：(作为piko：(它连接夏威夷群岛 → 与天堂))))。\u003c/p>\n\u003cp>但莫纳克亚山 → 也是所在地：(世界上一些最强大的望远镜)。\u003c/p>\n\u003cp>坐落在太平洋中 → 莫纳克亚山的山峰 → 高出大部分：(我们星球稠密的大气层)：(那里的条件允许望远镜 → 获得图像：(具有无与伦比的清晰度))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>反对望远镜：(在莫纳克亚山上) → 并不是新鲜事。\u003c/p>\n\u003cp>一个小但直言不讳的群体：(夏威夷人和环保主义者的) → 长期以来一直视它们的存在：(为对神圣土地的不敬 + 一个痛苦的提醒：(关于占领：(曾经是主权国家的地方)))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>一些责任：(对于当前的争议) → 属于天文学家。\u003c/p>\n\u003cp>在他们的急切中：(建造更大的望远镜) → 他们忘记了：(科学不是唯一的方式：(理解世界的))。\u003c/p>\n\u003cp>他们并不总是优先考虑 → 保护：(莫纳克亚山脆弱的生态系统) + 它的神圣性：(对岛上居民来说)。\u003c/p>\n\u003cp>夏威夷文化 → 不是过去的遗物；// 它是一种活的文化：(今天正在经历复兴)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>然而科学也有文化历史 → 其根源可以追溯到：(文明的黎明)。\u003c/p>\n\u003cp>同样的好奇心：(去发现地平线之外的东西)：(最初带来早期波利尼西亚人 → 到夏威夷海岸) → 今天激励着天文学家：(探索天空)。\u003c/p>\n\u003cp>呼吁：(拆除所有望远镜：(在莫纳克亚山上) + 禁止未来在那里的开发) → 忽视了现实：(天文学和夏威夷文化 → 都寻求回答重大问题：(关于我们是谁 + 我们从哪里来 + 我们要去哪里))。\u003c/p>\n\u003cp>也许这就是为什么 → 我们探索星空 → 仿佛在回应一种原始的召唤：(去了解我们自己 + 我们真正的祖先家园)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>天文学界 → 正在做出妥协：(改变其使用：(莫纳克亚山的方式))。\u003c/p>\n\u003cp>TMT地点 → 被选择：(来最小化 → 望远镜的可见度：(在岛屿周围) + 避免 → 考古和环境影响)。\u003c/p>\n\u003cp>为了限制望远镜的数量：(在莫纳克亚山上) → 旧的将被移除：(在它们的使用寿命结束时) + 它们的地点将恢复：(到自然状态)。\u003c/p>\n\u003cp>没有理由：(为什么每个人不能被欢迎：(在莫纳克亚山上)：(拥抱他们的文化遗产 + 研究星星))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Rested in the Pacific Ocean, / Mauna Kea&#39;s peak / rises above the bulk / of our planet&#39;s dense atmosphere, / where conditions allow telescopes / to obtain images / of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>坐落在太平洋中，/ 莫纳克亚山的山峰 / 高出大部分 / 我们星球稠密的大气层，/ 那里的条件允许望远镜 / 获得图像 / 具有无与伦比的清晰度。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并山峰的地理位置和高度条件。：\u003c/p>\n\u003cblockquote>\n\u003cp>位于太平洋的莫纳克亚山峰高出地球大部分稠密大气层\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并where从句说明的观测效果。：\u003c/p>\n\u003cblockquote>\n\u003cp>那里的条件使望远镜能够获得无与伦比的清晰图像\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>位于太平洋的莫纳克亚山峰高出地球大部分稠密大气层；那里的条件使望远镜能够获得无与伦比的清晰图像。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>莫纳克亚山峰位置高，那里的条件有利于获得清晰图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>位置放在山峰前，高出大气层之后接“那里的条件”；where回指这一处观测环境。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>莫纳克亚山位于太平洋，山峰高出地球大部分稠密大气层；那里的条件允许望远镜取得清晰程度无与伦比的图像。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>bulk是大部分，并非说山峰已经到达完全没有大气的地方。\u003c/p>\n\u003cp>allow表达环境使观测成为可能，不夸成望远镜自动消除所有误差。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>坐落在太平洋中的莫纳克亚山山峰高出地球大部分稠密大气层，那里的条件使望远镜能够获得无与伦比的清晰图像。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>A small but vocal group / of Hawaiians and environmentalists / have long viewed their presence / as disrespect for sacred land / and a painful reminder / of the occupation / of what was once a sovereign nation.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>一个小但直言不讳的群体 / 夏威夷人和环保主义者的 / 长期以来一直视它们的存在 / 为对神圣土地的不敬 / 以及一个痛苦的提醒 / 关于占领 / 曾经是主权国家的地方。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把人数与表达态度的限制同时归给反对者。：\u003c/p>\n\u003cblockquote>\n\u003cp>一小群声音鲜明的夏威夷人和环保主义者\u003c/p>\n\u003c/blockquote>\n\u003cp>再把他们对望远镜存在的两项理解并列。：\u003c/p>\n\u003cblockquote>\n\u003cp>认为这是对圣地的不敬，也是对曾经主权国家遭占领的痛苦提醒\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>一小群声音鲜明的夏威夷人和环保主义者；认为这是对圣地的不敬，也是对曾经主权国家遭占领的痛苦提醒。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>这些人长期把望远镜视为不敬和痛苦的提醒。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写人，再写have long viewed；as后两项评价同层并列，把曾为主权国家的限定放进占领的对象中。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>人数不多却公开表达意见的一群夏威夷人和环保主义者，长期把这些望远镜的存在看成对圣地的不敬，也看成曾经的主权国家被占领的痛苦提醒。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>small but vocal同时交代群体规模小和主张公开鲜明，不能把人数少译成诉求不重要。\u003c/p>\n\u003cp>their presence指望远镜的存在，不能错接成夏威夷人的出现。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>一小群但直言不讳的夏威夷人和环保主义者长期以来一直认为望远镜的存在是对神圣土地的不敬，也是对曾经主权国家被占领的痛苦提醒。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes / on Mauna Kea / or to ban future development there / ignore the reality / that astronomy and Hawaiian culture / both seek to answer big questions / about who we are, / where we come from / and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>呼吁拆除所有望远镜 / 在莫纳克亚山上 / 或禁止未来在那里的开发 / 忽视了现实 / 天文学和夏威夷文化 / 都寻求回答重大问题 / 关于我们是谁，/ 我们从哪里来 / 以及我们要去哪里。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把calls的两个要求合并成主语。：\u003c/p>\n\u003cblockquote>\n\u003cp>呼吁拆除所有望远镜或禁止未来开发的声音\u003c/p>\n\u003c/blockquote>\n\u003cp>再把被忽略的共同点合并起来。：\u003c/p>\n\u003cblockquote>\n\u003cp>天文学与夏威夷文化都追问我们是谁、从哪里来、要去哪里\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>呼吁拆除所有望远镜或禁止未来开发的声音；天文学与夏威夷文化都追问我们是谁、从哪里来、要去哪里。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>全面拆除或禁建的呼声忽略了两者共同的追问。\u003c/p>\n\u003c/blockquote>\n\u003cp>两个不定式都修饰呼声；that引出的现实放在“忽视”之后，三个疑问并列作answer的对象。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>要求拆除莫纳克亚山上所有望远镜或禁止那里未来开发的呼声，忽视了一个现实：天文学和夏威夷文化都在追问我们是谁、来自哪里、要往哪里去。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>all和ban future development表明作者针对的是全面否定，不是所有具体环保意见。\u003c/p>\n\u003cp>both seek保留科学与文化的共同性，不能译成天文学取代夏威夷文化。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>呼吁拆除莫纳克亚山上所有望远镜或禁止未来开发的声音忽视了一个现实：天文学和夏威夷文化都在寻求回答关于我们是谁、从哪里来、要去哪里的重大问题。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>30题\u003c/h2>\n\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>作者对于选择莫纳克亚山作为TMT台址，持何种态度？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>severe criticism\u003c/strong>\u003c/p>\n\u003cp>严厉批评\u003c/p>\n\u003cp>B. \u003cstrong>full approval\u003c/strong>\u003c/p>\n\u003cp>完全赞同\u003c/p>\n\u003cp>C. \u003cstrong>passive acceptance\u003c/strong>\u003c/p>\n\u003cp>被动接受\u003c/p>\n\u003cp>D. \u003cstrong>slight hesitancy\u003c/strong>\u003c/p>\n\u003cp>略有犹豫\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>列出改变使用方式、避免影响、退役旧设备与恢复自然状态等安排，最后明确欢迎文化传承与研究星空共存。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003ch3>A. severe criticism\u003c/h3>\n\u003cp>严厉批评\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>严厉批评\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借古代重视观星与当下争议的反差，提出严厉批评现有TMT选址的立场。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认同一山峰兼具科研和文化价值，但强调选址未妥善处理两种诉求。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>详述居民拒绝选址的历史与圣地理由，作为批评工程决定的依据。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学界忽视生态与文化的过失，进一步追究选址责任。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>承认文化诉求也不能任意否定科学价值，但说明这不等于现址合理。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出改换地点或严格纠偏后再合作的办法，保持对当前选址的批评。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A要求全文最后落在严厉否定这项选址上。第三段的痛苦回忆与第四段的Some blame，确实能够让人感到作者批评了科学一方；但批评的对象是忽略当地价值的做法，不等于拒绝在这个地点建设望远镜。\u003c/p>\n\u003cp>第五段以Yet转向：科学本身也有文化历史，同样的探索好奇心跨越古今，禁止未来发展会忽略共同问题。第六段继续列如何调整，最后用There is no reason why everyone cannot be welcomed明确欢迎双方。若是A，这两段应该继续反对或要求放弃台址，实际方向却相反。\u003c/p>\n\u003cp>承认天文学家负有部分责任，是否就足以把作者对选址的整体态度判成严厉批评？\u003c/p>\n\u003cp>不能。承认问题服务于后面的共存办法，结尾没有否定选址。A排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003ch3>B. full approval\u003c/h3>\n\u003cp>完全赞同\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>完全赞同\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以古代天文传统与当下反对形成反差，为支持科学和文化共处提出问题。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>介绍神山意义与优良观测条件，说明在此共存有双方都看重的基础。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释历史伤痛和圣地观念造成的反对，使支持立场正面回应阻力。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学家忽视环境与文化的错误，要求在支持建设时修正这些做法。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>指出全面拆除或禁建也忽略科学与文化的共同追问，反对全盘否定。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>展示减小影响与退役旧镜的妥协安排，明确支持人们共同传承文化、研究星空。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B中的full approval针对题干限定的choosing Mauna Kea as the TMT site，并不是说作者赞同天文学家以前的每一种做法。因此第四段承认失误，与\u003c/p>\n\u003cp>从六行看，第二段给出观测优势，第三、四段认真处理反对理由，第五段找科学与文化的共同追问，第六段提出减轻影响和恢复场地的安排。最后的There is no reason why everyone cannot be welcomed不是被动让步，而是明确反对把两类活动排斥在同一地方之外。\u003c/p>\n\u003cp>作者是否在处理反对理由之后，仍主动肯定文化传承与研究星空可以在莫纳克亚山共存？\u003c/p>\n\u003cp>能。结尾态度明确，前面的承认失误并未变成否决台址。B保留。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003ch3>C. passive acceptance\u003c/h3>\n\u003cp>被动接受\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>被动接受\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从古代传统与今日争议的反差写起，表示虽不热衷但不得不接受现址。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认场地有科学与文化双重价值，说明被动接受是两种现实压力的结果。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍当地拒绝的理由，说明作者仍感无奈和不情愿。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学家做法欠妥，进一步解释为什么不能积极赞成。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>又指出全面否定科学也不可取，从而把接受现址解释为别无选择。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出最低限度缓和冲突的安排，以勉强妥协而非主动欢迎收束。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的passive acceptance意味着作者并不真正积极支持，只是勉强或无奈地接受。若照这个态度写，第五段就不必主动为科学的文化历史辩护，第六段也应落到“既然无法改变，只好如此”。实际作者不是只描述建设已经发生，而是认真论证两者有共同的探索根源。\u003c/p>\n\u003cp>末段列改变使用方式、限制设备数量、退役后恢复自然等安排，说明作者在建设性地寻找共同使用的方式；最后明确说没有理由不欢迎所有人。这里的肯定来自论证与可行安排，不是来自无计可施。\u003c/p>\n\u003cp>列出共存理由并主动欢迎双方，是被迫接受无法改变的现实吗？\u003c/p>\n\u003cp>不是。C所需的无奈或消极态度没有形成，反而与作者主动说明共存可能的写法不合，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003ch3>D. slight hesitancy\u003c/h3>\n\u003cp>略有犹豫\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>略有犹豫\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用古今反差提出选址争议，表达整体接近支持但仍有少量疑虑。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认两种价值都重要，指出其兼容程度还存在一个未决问题。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释部分居民不接受的原因，把它作为尚待考虑的理由。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学家过去有过失，因此对当前承诺留下一点审慎保留。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>说明全面否定科学同样失当，减少疑虑但不完全消除。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>展示合作途径后仍留下一个具体未解决条件，使略有犹豫延续到结尾。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D比严厉反对轻一些，容易让人把第四段承认问题看成作者还有犹豫。但文章中间出现两面材料，并不能把结尾的态度也留在两面之间。先交代反对者、再承认科学一方有责任，是作者把问题讲完整的步骤，不必等于尚未表态。\u003c/p>\n\u003cp>第五段已经明确批评全面禁止发展的主张，第六段继续说应怎样减少冲突，并用There is no reason why everyone cannot be welcomed收束。若仍略有犹豫，应留下“是否能够”“仍待观察”一类未定判断；实际末句没有要求等待裁决，也没有保留否决台址的姿态。\u003c/p>\n\u003cp>中间承认矛盾，能不能覆盖结尾已经明确给出的欢迎与共存判断？\u003c/p>\n\u003cp>不能。D停在论证中途，忽略结尾的肯定，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>30题结论\u003c/h3>\n\u003cp>\u003cstrong>30. B. full approval\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>full approval / 完全赞同\u003c/strong>\u003c/p>\n\u003ch2>26题\u003c/h2>\n\u003cblockquote>\n\u003cp>Queen Liliuokalani’s remark in Paragraph 1 indicates ______.\u003cbr>女王在第一段的话表明了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引语作用题。题干要求判断“女王在第一段的话表明了什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897. Star watchers were among the most esteemed members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#39;s view of the cosmos.\u003c/p>\n\u003c/blockquote>\n\u003cp>女王追溯古代夏威夷人的天文学传统，下一句说观星者地位崇高，然后以Sadly转到今天的建镜争议。\u003c/p>\n\u003ch3>A. the importance of astronomy in ancient Hawaiian society\u003c/h3>\n\u003cblockquote>\n\u003cp>天文学在古代夏威夷社会中的重要性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 ancient Hawaiian society 与女王说的 The ancient Hawaiians were astronomers 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>The ancient Hawaiians were astronomers 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。A的 ancient Hawaiian society 保留了这个时间和社会范围。\u003c/p>\n\u003cp>引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897.\u003c/p>\n\u003cp>Star watchers were among the most esteemed members of Hawaiian society.\u003c/p>\n\u003cp>Sadly, all is not well with astronomy in Hawaii today.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>女王在第一段的引语表明了天文学在古代夏威夷社会中的重要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 ancient Hawaiian society 与女王说的 The ancient Hawaiians were astronomers 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。\u003c/p>\n\u003cp>The ancient Hawaiians were astronomers 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。A的 ancient Hawaiian society 保留了这个时间和社会范围。\u003c/p>\n\u003cp>再看Sadly和today：作者转到今天的天文学不顺利时表示遗憾，是拿现在与前面那段传统作对照。A没有把女王的1897年写作日期当成引语谈论的年代，也没有凭一个人物的话增加具体观测成就。它概括的是原段确实建立的社会地位。\u003c/p>\n\u003cp>引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897.\u003c/p>\n\u003cp>Star watchers were among the most esteemed members of Hawaiian society.\u003c/p>\n\u003cp>Sadly, all is not well with astronomy in Hawaii today.\u003c/p>\n\u003cp>女王追溯古代夏威夷人的天文学传统，下一句说观星者地位崇高，然后以Sadly转到今天的建镜争议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Astronomy occupied an important place in ancient Hawaiian society.\u003c/p>\n\u003cp>天文学在古代夏威夷社会占据重要地位。\u003c/p>\n\u003c/blockquote>\n\u003cp>古人是天文学家与观星者备受尊重共同说明社会地位，随后古今反差才有依据。选项没有把女王写作年代移给所述历史。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持科学与文化共处的全文立场需要先唤回本地天文传统；引语的时间和社会地位仍由ancient与most esteemed决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the importance of astronomy in ancient Hawaiian society\u003cbr>天文学在古代夏威夷社会中的重要性\u003c/p>\n\u003c/blockquote>\n\u003cp>引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. her conservative view on the historical role of astronomy\u003c/h3>\n\u003cblockquote>\n\u003cp>她对天文学历史作用的保守看法\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 her conservative view 是对女王立场的评价，原文的 The ancient Hawaiians were astronomers 则是她被引用的具体话，所以回看这句，比较她是在描述过去，还是评价应该怎样对待天文学。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>The ancient Hawaiians were astronomers 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。B的 her conservative view 却先给女王扣上保守立场，再把天文学的历史作用装进这一立场。提到古代不等于保守，描述传统也不等于拒绝发展。\u003c/p>\n\u003cp>B把引语的历史内容改成了女王的个人态度，而该态度没有在话中表达。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>女王在第一段的引语表明了她对天文学历史作用的保守看法。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 her conservative view 是对女王立场的评价，原文的 The ancient Hawaiians were astronomers 则是她被引用的具体话，所以回看这句，比较她是在描述过去，还是评价应该怎样对待天文学。\u003c/p>\n\u003cp>The ancient Hawaiians were astronomers 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。B的 her conservative view 却先给女王扣上保守立场，再把天文学的历史作用装进这一立场。提到古代不等于保守，描述传统也不等于拒绝发展。\u003c/p>\n\u003cp>Hawaii’s last reigning monarch介绍的是她的身份，1897介绍写作时间；这两处都不能代替她话里的态度。后面的Sadly属于作者从过去转向今天时的表述，也不能拿来当女王在引语中的保守判断。这里把谁说的话、话在讲什么和谁的态度分开，B就接不上了。\u003c/p>\n\u003cp>引语给出历史描述，conservative需要的是额外的立场判断，两者不是一回事。\u003c/p>\n\u003cp>B把引语的历史内容改成了女王的个人态度，而该态度没有在话中表达。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897.\u003c/p>\n\u003cp>女王追溯古代夏威夷人的天文学传统，下一句说观星者地位崇高，然后以Sadly转到今天的建镜争议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The queen argued that astronomy should preserve its old forms and resist change.\u003c/p>\n\u003cp>女王主张天文学应保留旧形式、抵制变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>保守立场需要反对改变的判断。引语是描述古代传统，未给女王添入对现代发展的态度。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持科学与文化共处的全文立场需要先唤回本地天文传统；引语的时间和社会地位仍由ancient与most esteemed决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>her conservative view on the historical role of astronomy\u003cbr>她对天文学历史作用的保守看法\u003c/p>\n\u003c/blockquote>\n\u003cp>B把引语的历史内容改成了女王的个人态度，而该态度没有在话中表达。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the regrettable decline of astronomy in ancient times\u003c/h3>\n\u003cblockquote>\n\u003cp>古代天文学令人遗憾的衰落\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 in ancient times 把不好的变化放在古代，而第一段的 in Hawaii today 明确标出作者谈到不顺利时的时间；因此回看Sadly开头的这一句，再与女王引语比较。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 in Hawaii today 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。C用 in ancient times 把它挪到了古代，还写成天文学的decline。女王讲古代人是天文学家，并没有给出古代由盛转衰的过程。\u003c/p>\n\u003cp>today已经把时间说清楚，抗议建设的事情也发生在这个当下语境中。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Sadly, all is not well with astronomy in Hawaii today.\u003c/p>\n\u003cp>Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#39;s view of the cosmos.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>女王在第一段的引语表明了古代天文学令人遗憾的衰落。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 in ancient times 把不好的变化放在古代，而第一段的 in Hawaii today 明确标出作者谈到不顺利时的时间；因此回看Sadly开头的这一句，再与女王引语比较。\u003c/p>\n\u003cp>原文的 in Hawaii today 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。C用 in ancient times 把它挪到了古代，还写成天文学的decline。女王讲古代人是天文学家，并没有给出古代由盛转衰的过程。\u003c/p>\n\u003cp>Sadly也不能单独搬走。它评价的是后面这整句当下情况，不是离它更远的所有历史内容。作者是先说过去的天文学传统，再说今天的争议；C把“过去”和“今天”两块材料拼反，得到了一段原文没有说的古代衰落史。\u003c/p>\n\u003cp>today已经把时间说清楚，抗议建设的事情也发生在这个当下语境中。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Sadly, all is not well with astronomy in Hawaii today.\u003c/p>\n\u003cp>Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#39;s view of the cosmos.\u003c/p>\n\u003cp>女王追溯古代夏威夷人的天文学传统，下一句说观星者地位崇高，然后以Sadly转到今天的建镜争议。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The queen lamented the decline of astronomy in ancient Hawaii.\u003c/p>\n\u003cp>女王哀叹古代夏威夷天文学的衰落。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际遗憾的是today的建镜困境，古代部分强调受尊重。假设将当下困境挪成古代衰落。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持科学与文化共处的全文立场需要先唤回本地天文传统；引语的时间和社会地位仍由ancient与most esteemed决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the regrettable decline of astronomy in ancient times\u003cbr>古代天文学令人遗憾的衰落\u003c/p>\n\u003c/blockquote>\n\u003cp>today已经把时间说清楚，抗议建设的事情也发生在这个当下语境中。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. her appreciation of star watchers’ feats in her time\u003c/h3>\n\u003cblockquote>\n\u003cp>她对自己时代观星者成就的欣赏\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“her appreciation of star watchers’ [xxx] in her time”，保留了相应遮挡。当时的定位线索是：D的 in her time 指女王所处的时代，原文的 The ancient Hawaiians 却是引语明说的对象；因此回看引语与1897的摆放位置，区分写下话的时间和话里谈论的时间。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>in her time 与 The ancient Hawaiians 不是同一个时间范围。1897放在wrote后面，说明女王何时写下这句话；ancient放在Hawaiians前面，限定她谈到的是古代夏威夷人。一个人在1897年写古人，并不会让古人变成 u003c/p>\n\u003c/blockquote>\n\u003cp>写作日期与叙述对象的年代是两回事，原文还特意用ancient限定了对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>26题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>26. A. the importance of astronomy in ancient Hawaiian society\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：The ancient Hawaiians were astronomers 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。\u003c/p>\n\u003cp>B：The ancient Hawaiians were astronomers 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。\u003c/p>\n\u003cp>C：原文的 in Hawaii today 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。\u003c/p>\n\u003cp>D：in her time 与 The ancient Hawaiians 不是同一个时间范围。\u003c/p>\n\u003ch2>27题\u003c/h2>\n\u003cblockquote>\n\u003cp>Mauna Kea is deemed as an ideal astronomical site due to ______.\u003cbr>莫纳克亚山被认为是理想的天文观测地点，原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“莫纳克亚山被认为是理想的天文观测地点，原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world&#39;s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003cp>先介绍山的宗教意义，再以But转入观测条件：太平洋上的高峰越过浓密大气，因而能取得格外清晰的图像。\u003c/p>\n\u003ch3>A. its religious implications\u003c/h3>\n\u003cblockquote>\n\u003cp>它的宗教意义\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 religious implications 与第二段的 connects the Hawaiian Islands to the heavens 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>connects the Hawaiian Islands to the heavens 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。A的 religious implications 可以联系这部分，但题干问的是为什么它是ideal astronomical site，不是为什么这块地方对当地人特殊。\u003c/p>\n\u003cp>观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.\u003c/p>\n\u003cp>But Mauna Kea is also home to some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>莫纳克亚山适合天文观测，是由于它的宗教意义。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 religious implications 与第二段的 connects the Hawaiian Islands to the heavens 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。\u003c/p>\n\u003cp>connects the Hawaiian Islands to the heavens 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。A的 religious implications 可以联系这部分，但题干问的是为什么它是ideal astronomical site，不是为什么这块地方对当地人特殊。\u003c/p>\n\u003cp>But后面另转到天文观测：先说已经有强大望远镜，再说山峰高出浓密大气的一部分，能够获得清晰图像。原文将文化意义与观测条件并列在同一地点上，A却把前一种意义改成后一种用途的原因。词都在同一段，不等于它们承担同一种解释任务。\u003c/p>\n\u003cp>观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.\u003c/p>\n\u003cp>But Mauna Kea is also home to some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>先介绍山的宗教意义，再以But转入观测条件：太平洋上的高峰越过浓密大气，因而能取得格外清晰的图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Its sacred connection with heaven makes astronomical images exceptionally clear.\u003c/p>\n\u003cp>它与上天的神圣联系使天文图像格外清晰。\u003c/p>\n\u003c/blockquote>\n\u003cp>宗教意义属于当地人如何理解神山，清晰图像则由后一句地理与大气条件解释，不能把不同层面的意义接成因果。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持选址的态度承认场地有科学价值，但主旨不能单独决定具体原因；这里必须保留山峰位置、大气与成像质量的联系。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its religious implications\u003cbr>它的宗教意义\u003c/p>\n\u003c/blockquote>\n\u003cp>观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. its protective surroundings\u003c/h3>\n\u003cblockquote>\n\u003cp>它周边环境的保护作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 protective surroundings 讲周边保护，原文的 peak rises above 讲山峰与大气的高低关系；两者都可能让人想到自然环境，所以回看这个位置关系怎样接出图像清晰度。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>peak rises above 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。\u003c/p>\n\u003cp>B把自然位置换成环境保护功能，不能准确接上清晰成像的解释。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>莫纳克亚山适合天文观测，是由于它周边环境的保护作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 protective surroundings 讲周边保护，原文的 peak rises above 讲山峰与大气的高低关系；两者都可能让人想到自然环境，所以回看这个位置关系怎样接出图像清晰度。\u003c/p>\n\u003cp>peak rises above 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。\u003c/p>\n\u003cp>太 03c/strong>\u003c/p>\n\u003cp>C中 its 所指的对象与 Mauna Kea’s peak 一致，随后features让我们去看这座山具有怎样的特点。原文给出所在海域、山峰高于浓密大气中某部分的关系，又由where conditions直接接到清晰图像，确实是在以场地自身的条件解释观测优势。\u003c/p>\n\u003cp>它概括场地特征这一对象，没有像另外几项那样换掉原文的原因。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>莫纳克亚山适合天文观测，是由于它的地理特征。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 its 指莫纳克亚山本身，第二段的 Mauna Kea’s peak 同样在介绍这座山；因此回看山峰、大气与成像效果所在的一句，确认它的特征是否被拿来解释观测优势。\u003c/p>\n\u003cp>C中 its 所指的对象与 Mauna Kea’s peak 一致，随后features让我们去看这座山具有怎样的特点。原文给出所在海域、山峰高于浓密大气中某部分的关系，又由where conditions直接接到清晰图像，确实是在以场地自身的条件解释观测优势。\u003c/p>\n\u003cp>对照已经读到的原因，山峰自身的这一组特征是本段实际展开的说明。不能为了译出一个完整中文词组，就把形容词补出来；保留C依据的是这段明确给出的对象与解释。\u003c/p>\n\u003cp>where conditions所接的正是前面山峰与大气的位置描述，后面给出成像结果。\u003c/p>\n\u003cp>它概括场地特征这一对象，没有像另外几项那样换掉原文的原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003cp>先介绍山的宗教意义，再以But转入观测条件：太平洋上的高峰越过浓密大气，因而能取得格外清晰的图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Its geographical position and height provide unusually clear observing conditions.\u003c/p>\n\u003cp>其地理位置和高度提供了异常清晰的观测条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>地点、高度和稀薄大气是对geographical features的具体展开，where conditions把它们接到清晰图像。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全 n\u003cp>已有设备可以表明人们已选择这个地方，但题干due to要的是适合的缘由。原文给的缘由是山峰、大气和由此获得的清晰图像，并没有说依靠现成的道路、建筑或仪器配套使地点变得理想。不能用“有人已经在那里建了”替代“为什么适合在那里建”。\u003c/p>\n\u003cp>已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But Mauna Kea is also home to some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003cp>先介绍山的宗教意义，再以But转入观测条件：太平洋上的高峰越过浓密大气，因而能取得格外清晰的图像。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The existing infrastructure is what makes Mauna Kea suitable for astronomy.\u003c/p>\n\u003cp>现有基础设施使莫纳克亚山适合天文观测。\u003c/p>\n\u003c/blockquote>\n\u003cp>已有望远镜说明该地已被使用，接下来的高度条件才解释为何理想。把已建的事实直接当成适合的原因，错过了作者的解释层。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持选址的态度承认场地有科学价值，但主旨不能单独决定具体原因；这里必须保留山峰位置、大气与成像质量的联系。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its existing infrastructure\u003cbr>它现有的基础设施\u003c/p>\n\u003c/blockquote>\n\u003cp>已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>27题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>27. C. its geographical features\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：connects the Hawaiian Islands to the heavens 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。\u003c/p>\n\u003cp>B：peak rises above 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。\u003c/p>\n\u003cp>C：C中 its 所指的对象与 Mauna Kea’s peak 一致，随后features让我们去看这座山具有怎样的特点。\u003c/p>\n\u003cp>D：home to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。\u003c/p>\n\u003ch2>28题\u003c/h2>\n\u003cblockquote>\n\u003cp>The construction of the TMT is opposed by some locals partly because ______.\u003cbr>一些当地人反对TMT建设，部分原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“一些当地人反对TMT建设，部分原因是什么？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Opposition to telescopes on Mauna Kea is nothing new. A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003cp>Some blame for the current controversy belongs to astronomers. In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always prioritize the protection of Mauna Kea&#39;s fragile ecosystems or its holiness to the island&#39;s inhabitants. Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.\u003c/p>\n\u003c/blockquote>\n\u003cp>当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。\u003c/p>\n\u003ch3>A. it may risk ruining their intellectual life\u003c/h3>\n\u003cblockquote>\n\u003cp>它可能破坏他们的精神生活\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“it may risk ruining their [xxx] life”，保留了相应遮挡。当时的定位线索是：A的 ruining their 说对当地人的某方面造成毁坏，第三段的 a painful reminder 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>a painful reminder 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。A的 ruining their 却说建设可能毁坏当地人的某种生活，是从现实项目向未来生活损害作预测。\u003c/p>\n\u003cp>A可读出的ruining已经把原句的提醒作用扩大成破坏结果。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>一些当地人反对TMT，部分因为它可能破坏他们的精神生活。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 ruining their 说对当地人的某方面造成毁坏，第三段的 a painful reminder 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。\u003c/p>\n\u003cp>a painful reminder 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。A的 ruining their 却说建设可能毁坏当地人的某种生活，是从现实项目向未来生活损害作预测。\u003c/p>\n\u003cp>当地人觉得这块土地神圣、会想到痛苦历史，并不等于这句已经说他们的生活将被毁掉。sacred land的评价与历史回忆是原文列出的反对理由，不能用一个更重的破坏结果来替代。A把感受与记忆扩成了另一种损害。\u003c/p>\n\u003cp>提醒既有历史和造成生活毁坏，不是同一个动作，也不是同一种因果。\u003c/p>\n\u003cp>A可读出的ruining已经把原句的提醒作用扩大成破坏结果。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003cp>当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The telescope will damage the intellectual life of local inhabitants.\u003c/p>\n\u003cp>望远镜将损害当地居民的精神生活。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际给出的关联是圣地与历史记忆，没有推演其思考、精神生活将如何被破坏。负面感受不能替代另一条未来损害链。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持共处不等于否认当地人的历史伤痛。题干要求部分反对理由，应回到已经列出的记忆和圣地意义，不预测未交代的未来损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it may risk ruining their intellectual life\u003cbr>它可能破坏他们的精神生活\u003c/p>\n\u003c/blockquote>\n\u003cp>A可读出的ruining已经把原句的提醒作用扩大成破坏结果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. they fear losing control of Mauna Kea\u003c/h3>\n\u003cblockquote>\n\u003cp>他们害怕失去对莫纳克亚山的控制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 losing control of Mauna Kea 容易与第三段的 occupation of what was once a sovereign nation 联系，因为两处都涉及控制问题，所以回看occupation前后的时间表达与提醒关系。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>occupation of what was once a sovereign nation 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。B的 losing control of Mauna Kea 则是担心即将失去对这座山的控制，时间变成未来，范围也从过去的国家变成今天的山。\u003c/p>\n\u003cp>reminder接过去的occupation，并没有交代新的控制权转移。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>一些当地人反对TMT，部分因为他们害怕失去对莫纳克亚山的控制。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 losing control of Mauna Kea 容易与第三段的 occupation of what was once a sovereign nation 联系，因为两处都涉及控制问题，所以回看occupation前后的时间表达与提醒关系。\u003c/p>\n\u003cp>occupation of what was once a sovereign nation 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。B的 losing control of Mauna Kea 则是担心即将失去对这座山的控制，时间变成未来，范围也从过去的国家变成今天的山。\u003c/p>\n\u003cp>这里没有说当地人目前持有何种控制权，也没有说建设会怎样转交这项权力。历史上失去主权可以令人痛苦，但“被提醒过去”不等于“害怕接下来发生同样的事”。B把原文的历史关联改成了新的权力变化预测。\u003c/p>\n\u003cp>reminder接过去的occupation，并没有交代新的控制权转移。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003cp>当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Local residents fear that building the telescope will make them lose present control of the mountain.\u003c/p>\n\u003cp>当地居民担心建造望远镜会使他们失去当前对山峰的控制。\u003c/p>\n\u003c/blockquote>\n\u003cp>失去当前控制权需要现有权利和转交机制；实际once sovereign指过去的国家占领，望远镜是提醒物，不是新夺权的报告。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持共处不等于否认当地人的历史伤痛。题干要求部分反对理由，应回到已经列出的记忆和圣地意义，不预测未交代的未来损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>they fear losing control of Mauna Kea\u003cbr>他们害怕失去对莫纳克亚山的控制\u003c/p>\n\u003c/blockquote>\n\u003cp>reminder接过去的occupation，并没有交代新的控制权转移。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. their culture will lose a chance of revival\u003c/h3>\n\u003cblockquote>\n\u003cp>他们的文化将失去复兴机会\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 a chance of revival 谈文化复兴，第四段的 renaissance 也谈复兴，所以回到第四段完整读，确认作者说的是复兴正在发生，还是建设会取消它的机会。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>a renaissance today 前面接undergoing，是这种活着的文化今天正在经历复兴。C的 a chance of revival 前面接will lose，把它写成一个将被建设项目夺走的未来机会。正在发生的复兴与未来会不会受阻并非逻辑上永远不能并存，但原文这句只说明文化的现状，并没有给出C所加的未来损害链。\u003c/p>\n\u003cp>C增加了will lose这一未来结果，不能从正在复兴的表述中推出。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Some blame for the current controversy belongs to astronomers.\u003c/p>\n\u003cp>In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world.\u003c/p>\n\u003cp>Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>一些当地人反对TMT，部分因为他们的文化将失去复兴机会。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 a chance of revival 谈文化复兴，第四段的 renaissance 也谈复兴，所以回到第四段完整读，确认作者说的是复兴正在发生，还是建设会取消它的机会。\u003c/p>\n\u003cp>a renaissance today 前面接undergoing，是这种活着的文化今天正在经历复兴。C的 a chance of revival 前面接will lose，把它写成一个将被建设项目夺走的未来机会。正在发生的复兴与未来会不会受阻并非逻辑上永远不能并存，但原文这句只说明文化的现状，并没有给出C所加的未来损害链。\u003c/p>\n\u003cp>第四段责备天文学家忘记理解世界不只有科学，还要求重视生态和神圣意义。它是在说明为什么不能把夏威夷文化当成过去的死东西，不是在预言一旦建望远镜就会使文化失去复兴可能。C把文化值得尊重这一理由换成了文化未来被阻断的预测。\u003c/p>\n\u003cp>一个是当前文化状态，另一个还需要“建设导致机会消失”的因果，原段没有作出这个预测。\u003c/p>\n\u003cp>C增加了will lose这一未来结果，不能从正在复兴的表述中推出。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Some blame for the current controversy belongs to astronomers.\u003c/p>\n\u003cp>In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world.\u003c/p>\n\u003cp>Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.\u003c/p>\n\u003cp>当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The construction will prevent Hawaiian culture from experiencing a revival.\u003c/p>\n\u003cp>这项建设会阻止夏威夷文化经历复兴。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说文化正在复兴以要求尊重，没有断言工程会剥夺复兴机会。承认活文化的地位与预测它会被阻断是不同写法。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持共处不等于否认当地人的历史伤痛。题干要求部分反对理由，应回到已经列出的记忆和圣地意义，不预测未交代的未来损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>their culture will lose a chance of revival\u003cbr>他们的文化将失去复兴机会\u003c/p>\n\u003c/blockquote>\n\u003cp>C增加了will lose这一未来结果，不能从正在复兴的表述中推出。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. it reminds them of a humiliating history\u003c/h3>\n\u003cblockquote>\n\u003cp>它使他们想起一段屈辱历史\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 a humiliating history 可以接到第三段的 occupation of what was once a sovereign nation，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。occupation of what was once a sovereign nation 是主权国家遭占领的历史，且作者明写painful，D的 a humiliating history 正是对这种受占领的屈辱经历作概括。\u003c/p>\n\u003cp>D能够独立回答partly because所要求的一部分原因。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>一些当地人反对TMT，部分因为它使他们想起一段屈辱历史。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 a humiliating history 可以接到第三段的 occupation of what was once a sovereign nation，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\u003c/p>\n\u003cp>原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。occupation of what was once a sovereign nation 是主权国家遭占领的历史，且作者明写painful，D的 a humiliating history 正是对这种受占领的屈辱经历作概括。\u003c/p>\n\u003cp>这里既没有把过去换成未来，也没有把提醒改成正在夺权。题干还用partly because，允许只选出部分原因，D不必把前面sacred land那一层也全装进去。它保留的是原文and后面已经写完整的一条理由。\u003c/p>\n\u003cp>现在的提醒、过去的历史和当地人的负面感受都对应，没有另造未来损害。\u003c/p>\n\u003cp>D能够独立回答partly because所要求的一部分原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003cp>当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The telescopes remind some residents of the occupation of their once-sovereign nation.\u003c/p>\n\u003cp>望远镜使一些居民想起他们曾为主权国家的故土遭到占领。\u003c/p>\n\u003c/blockquote>\n\u003cp>remind准确保留心理触发关系，humiliating概括painful occupation。partly because允许选出这一条理由，不要求把圣地因素也装进选项。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持共处不等于否认当地人的历史伤痛。题干要求部分反对理由，应回到已经列出的记忆和圣地意义，不预测未交代的未来损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it reminds them of a humiliating history\u003cbr>它使他们想起一段屈辱历史\u003c/p>\n\u003c/blockquote>\n\u003cp>D能够独立回答partly because所要求的一部分原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>28题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>28. D. it reminds them of a humiliating history\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：a painful reminder 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。\u003c/p>\n\u003cp>B：occupation of what was once a sovereign nation 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。\u003c/p>\n\u003cp>C：a renaissance today 前面接undergoing，是这种活着的文化今天正在经历复兴。\u003c/p>\n\u003cp>D：原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。\u003c/p>\n\u003ch2>29题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be inferred from Paragraph 5 that progress in today’s astronomy ______.\u003cbr>从第五段可以推知，今天的天文学进展怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“从第五段可以推知，今天的天文学进展怎样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Yet science has a cultural history, too, with roots going back to the dawn of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens. Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.\u003c/p>\n\u003c/blockquote>\n\u003cp>同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。\u003c/p>\n\u003ch3>A. is fulfilling the dreams of ancient Hawaiians\u003c/h3>\n\u003cblockquote>\n\u003cp>正在实现古代夏威夷人的梦想\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“is [xxx] the dreams of ancient Hawaiians”，保留了相应遮挡。当时的定位线索是：A的 dreams of ancient Hawaiians 涉及古人的探索愿望，第五段的 The same curiosity 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>The same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 dreams of ancient Hawaiians 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。\u003c/p>\n\u003cp>古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>由第五段可推知，现代天文学的发展正在实现古代夏威夷人的梦想。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 dreams of ancient Hawaiians 涉及古人的探索愿望，第五段的 The same curiosity 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\u003c/p>\n\u003cp>The same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 dreams of ancient Hawaiians 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。\u003c/p>\n\u003cp>古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens.\u003c/p>\n\u003cp>同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Modern astronomy carries forward and fulfills the ancient Hawaiians’ dream of exploring beyond familiar horizons.\u003c/p>\n\u003cp>现代天文学继承并实现了古代夏威夷人探索熟悉视野以外世界的梦想。\u003c/p>\n\u003c/blockquote>\n\u003cp>古人跨越海域、今人探索天空，对象变化而求知愿望相通。fulfilling在此概括这种继续实现探索梦想，不表示已回答所有宇宙问题。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者支持共处，因而本段应寻找科学与本地文化的共同追求。能推出探索愿望的延续，但不能据此保证文化起源被揭开或反对者必然转变态度。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is fulfilling the dreams of ancient Hawaiians\u003cbr>正在实现古代夏威夷人的梦想\u003c/p>\n\u003c/blockquote>\n\u003cp>古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. helps spread Hawaiian culture across the world\u003c/h3>\n\u003cblockquote>\n\u003cp>有助于在全世界传播夏威夷文化\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 spread Hawaiian culture 说传播文化，第五段的 astronomy and Hawaiian culture both seek to answer 则把天文学与文化并列，因此回看这个both后面到底是共同做什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>astronomy and Hawaiian culture both seek to answer 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。B的 spread Hawaiian culture 却把天文学设为传播者，把夏威夷文化变成被传播的对象。这不是并列关系，而是一方把另一方向外输送的关系。\u003c/p>\n\u003cp>B加进传播动作和全球范围，原句的both关系不能支持这两步。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>由第五段可推知，现代天文学的发展有助于在全世界传播夏威夷文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 spread Hawaiian culture 说传播文化，第五段的 astronomy and Hawaiian
