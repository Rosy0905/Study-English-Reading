：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"26题结论","level":2,"raw":"### 26题结论\n\n> **26. A. the importance of astronomy in ancient Hawaiian society**\n\nA：The ancient Hawaiians were astronomers 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。\n\nB：The ancient Hawaiians were astronomers 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。\n\nC：原文的 in Hawaii today 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。\n\nD：in her time 与 The ancient Hawaiians 不是同一个时间范围。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"26","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>26. A. the importance of astronomy in ancient Hawaiian society\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：The ancient Hawaiians were astronomers 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。\u003c/p>\n\u003cp>B：The ancient Hawaiians were astronomers 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。\u003c/p>\n\u003cp>C：原文的 in Hawaii today 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。\u003c/p>\n\u003cp>D：in her time 与 The ancient Hawaiians 不是同一个时间范围。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"27题 · 题干、题型与核心出处","level":2,"raw":"## 27题\n\n> Mauna Kea is deemed as an ideal astronomical site due to ______.  \n> 莫纳克亚山被认为是理想的天文观测地点，原因是什么？\n\n### 题型\n\n原因细节题。题干要求判断“莫纳克亚山被认为是理想的天文观测地点，原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world's most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea's peak rises above the bulk of our planet's dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\n\n先介绍山的宗教意义，再以But转入观测条件：太平洋上的高峰越过浓密大气，因而能取得格外清晰的图像。","context":{"mode":"image","asset":"questions","focus":[250,754,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"27","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Mauna Kea is deemed as an ideal astronomical site due to ______.\u003cbr>莫纳克亚山被认为是理想的天文观测地点，原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“莫纳克亚山被认为是理想的天文观测地点，原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world&#39;s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003cp>先介绍山的宗教意义，再以But转入观测条件：太平洋上的高峰越过浓密大气，因而能取得格外清晰的图像。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. its religious implications","level":3,"raw":"### A. its religious implications\n\n> 它的宗教意义\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 religious implications 与第二段的 connects the Hawaiian Islands to the heavens 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nconnects the Hawaiian Islands to the heavens 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。A的 religious implications 可以联系这部分，但题干问的是为什么它是ideal astronomical site，不是为什么这块地方对当地人特殊。\n\n观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。\n\n**命题人借用的原文材料：**\n\n> At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.\n>\n> But Mauna Kea is also home to some of the world's most powerful telescopes.","context":{"mode":"image","asset":"questions","focus":[250,848,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-A","cumu 理特征\u003c/p>\n\u003c/blockquote>\n\u003cp>它概括场地特征这一对象，没有像另外几项那样换掉原文的原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. its existing infrastructure","level":3,"raw":"### D. its existing infrastructure\n\n> 它现有的基础设施\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的 existing infrastructure 容易让人想到第二段的 home to some of the world’s most powerful telescopes，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nhome to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 existing infrastructure 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。\n\n已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\n\n**命题人借用的原文材料：**\n\n> But Mauna Kea is also home to some of the world's most powerful telescopes.\n>\n> Rested in the Pacific Ocean, Mauna Kea's peak rises above the bulk of our planet's dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.","context":{"mode":"image","asset":"questions","focus":[250,1104,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"27","option":"D"},"focusId":"focus-q27-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-D-0\">\u003cblockquote>\n\u003cp>它现有的基础设施\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 existing infrastructure 容易让人想到第二段的 home to some of the world’s most powerful telescopes，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>home to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 existing infrastructure 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。\u003c/p>\n\u003cp>已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But Mauna Kea is also home to some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. its existing infrastructure","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 莫纳克亚山适合天文观测，是由于它现有的基础设施。\n\nD的 existing infrastructure 容易让人想到第二段的 home to some of the world’s most powerful telescopes，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。\n\nhome to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 existing infrastructure 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。\n\n已有设备可以表明人们已选择这个地方，但题干due to要的是适合的缘由。原文给的缘由是山峰、大气和由此获得的清晰图像，并没有说依靠现成的道路、建筑或仪器配套使地点变得理想。不能用“有人已经在那里建了”替代“为什么适合在那里建”。\n\n已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。","context":{"mode":"image","asset":"questions","focus":[250,1104,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"27","option":"D"},"focusId":"focus-q27-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-D-0\">\u003cblockquote>\n\u003cp>它现有的基础设施\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 existing infrastructure 容易让人想到第二段的 home to some of the world’s most powerful telescopes，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>home to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 existing infrastructure 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。\u003c/p>\n\u003cp>已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文 ting infrastructure is what makes Mauna Kea suitable for astronomy.\u003c/p>\n\u003cp>现有基础设施使莫纳克亚山适合天文观测。\u003c/p>\n\u003c/blockquote>\n\u003cp>已有望远镜说明该地已被使用，接下来的高度条件才解释为何理想。把已建的事实直接当成适合的原因，错过了作者的解释层。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q27-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>full approval\u003cbr>完全赞同\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>支持选址的态度承认场地有科学价值，但主旨不能单独决定具体原因；这里必须保留山峰位置、大气与成像质量的联系。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its existing infrastructure\u003cbr>它现有的基础设施\u003c/p>\n\u003c/blockquote>\n\u003cp>已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"27题结论","level":2,"raw":"### 27题结论\n\n> **27. C. its geographical features**\n\nA：connects the Hawaiian Islands to the heavens 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。\n\nB：peak rises above 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。\n\nC：C中 its 所指的对象与 Mauna Kea’s peak 一致，随后features让我们去看这座山具有怎样的特点。\n\nD：home to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。","context":{"mode":"image","asset":"questions","focus":[250,754,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"27","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>27. C. its geographical features\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：connects the Hawaiian Islands to the heavens 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。\u003c/p>\n\u003cp>B：peak rises above 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。\u003c/p>\n\u003cp>C：C中 its 所指的对象与 Mauna Kea’s peak 一致，随后features让我们去看这座山具有怎样的特点。\u003c/p>\n\u003cp>D：home to some of the world’s most powerful telescopes 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"28题 · 题干、题型与核心出处","level":2,"raw":"## 28题\n\n> The construction of the TMT is opposed by some locals partly because ______.  \n> 一些当地人反对TMT建设，部分原因是什么？\n\n### 题型\n\n原因细节题。题干要求判断“一些当地人反对TMT建设，部分原因是什么？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Opposition to telescopes on Mauna Kea is nothing new. A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\n>\n> Some blame for the current controversy belongs to astronomers. In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always prioritize the protection of Mauna Kea's fragile ecosystems or its holiness to the island's inhabitants. Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.\n\n当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。","context":{"mode":"image","asset":"questions","focus":[250,1264,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"28","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The construction of the TMT is opposed by some locals partly because ______.\u003cbr>一些当地人反对TMT建设，部分原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“一些当地人反对TMT建设，部分原因是什么？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Opposition to telescopes on Mauna Kea is nothing new. A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003cp>Some blame for the current controversy belongs to astronomers. In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always prioritize the protection of Mauna Kea&#39;s fragile ecosystems or its holiness to the island&#39;s inhabitants. Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.\u003c/p>\n\u003c/blockquote>\n\u003cp>当地反对者把望远镜视为对圣地的不敬和被占领历史的痛苦提醒，作者也承认天文学家曾忽视生态与文化。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. it may risk ruining their intellectual life","level":3,"raw":"### A. it may risk ruining their intellectual life\n\n> 它可能破坏他们的精神生活\n\n**做题模式中的状态：** 第一轮A排除。当时选项呈现为“it may risk ruining their [xxx] life”，保留了相应遮挡。当时的定位线索是：A的 ruining their 说对当地人的某方面造成毁坏，第三段的 a painful reminder 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。\n\n**错误类型：第三类——无中生有。**\n\na painful reminder 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。A的 ruining their 却说建设可能毁坏当地人的某种生活，是从现实项目向未来生活损害作预测。\n\nA可读出的ruining已经把原句的提醒作用扩大成破坏结果。\n\n**命题人借用的原文材料：**\n\n> A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.","context":{"mode":"image","asset":"questions","focus":[250,1358,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"28","option":"A"},"focusId":"focus-q28-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-A-0\">\u003cblockquote>\n\u003cp>它可能破坏他们的精神生活\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“it may risk ruining their [xxx] life”，保留了相应遮挡。当时的定位线索是：A的 ruining their 说对当地人的某方面造成毁坏，第三段的 a painful reminder 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>a painful reminder 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容 会\u003c/p>\n\u003c/blockquote>\n\u003cp>C增加了will lose这一未来结果，不能从正在复兴的表述中推出。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. it reminds them of a humiliating history","level":3,"raw":"### D. it reminds them of a humiliating history\n\n> 它使他们想起一段屈辱历史\n\n**做题模式中的状态：** 第一轮D保留。当时的定位线索是：D的 a humiliating history 可以接到第三段的 occupation of what was once a sovereign nation，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\n\n**选项类型：正确同义改写。**\n\n原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。occupation of what was once a sovereign nation 是主权国家遭占领的历史，且作者明写painful，D的 a humiliating history 正是对这种受占领的屈辱经历作概括。\n\nD能够独立回答partly because所要求的一部分原因。\n\n**正确选项的原文依据：**\n\n> A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.","context":{"mode":"image","asset":"questions","focus":[250,1614,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"28","option":"D"},"focusId":"focus-q28-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-D-0\">\u003cblockquote>\n\u003cp>它使他们想起一段屈辱历史\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 a humiliating history 可以接到第三段的 occupation of what was once a sovereign nation，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。occupation of what was once a sovereign nation 是主权国家遭占领的历史，且作者明写painful，D的 a humiliating history 正是对这种受占领的屈辱经历作概括。\u003c/p>\n\u003cp>D能够独立回答partly because所要求的一部分原因。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. it reminds them of a humiliating history","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 一些当地人反对TMT，部分因为它使他们想起一段屈辱历史。\n\nD的 a humiliating history 可以接到第三段的 occupation of what was once a sovereign nation，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\n\n原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。occupation of what was once a sovereign nation 是主权国家遭占领的历史，且作者明写painful，D的 a humiliating history 正是对这种受占领的屈辱经历作概括。\n\n这里既没有把过去换成未来，也没有把提醒改成正在夺权。题干还用partly because，允许只选出部分原因，D不必把前面sacred land那一层也全装进去。它保留的是原文and后面已经写完整的一条理由。\n\n现在的提醒、过去的历史和当地人的负面感受都对应，没有另造未来损害。\n\nD能够独立回答partly because所要求的一部分原因。","context":{"mode":"image","asset":"questions","focus":[250,1614,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"28","option":"D"},"focusId":"focus-q28-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-D-0\">\u003cblockquote>\n\u003cp>它使他们想起一段屈辱历史\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 a humiliating history 可以接到第三段的 occupation of what was once a sovereign nation，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。occupation of what was once a sovereign nation 是主权国家遭占领的历史，且作者明写painful，D的 a humiliating history 正是对这种受占领的屈辱经历作 003c/p>\n\u003c/blockquote>\n\u003cp>A：a painful reminder 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。\u003c/p>\n\u003cp>B：occupation of what was once a sovereign nation 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。\u003c/p>\n\u003cp>C：a renaissance today 前面接undergoing，是这种活着的文化今天正在经历复兴。\u003c/p>\n\u003cp>D：原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"29题 · 题干、题型与核心出处","level":2,"raw":"## 29题\n\n> It can be inferred from Paragraph 5 that progress in today’s astronomy ______.  \n> 从第五段可以推知，今天的天文学进展怎样？\n\n### 题型\n\n局部推断题。题干要求判断“从第五段可以推知，今天的天文学进展怎样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Yet science has a cultural history, too, with roots going back to the dawn of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii's shores inspires astronomers today to explore the heavens. Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.\n\n同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。","context":{"mode":"image","asset":"questions","focus":[250,1774,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"29","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be inferred from Paragraph 5 that progress in today’s astronomy ______.\u003cbr>从第五段可以推知，今天的天文学进展怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“从第五段可以推知，今天的天文学进展怎样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Yet science has a cultural history, too, with roots going back to the dawn of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens. Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.\u003c/p>\n\u003c/blockquote>\n\u003cp>同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. is fulfilling the dreams of ancient Hawaiians","level":3,"raw":"### A. is fulfilling the dreams of ancient Hawaiians\n\n> 正在实现古代夏威夷人的梦想\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“is [xxx] the dreams of ancient Hawaiians”，保留了相应遮挡。当时的定位线索是：A的 dreams of ancient Hawaiians 涉及古人的探索愿望，第五段的 The same curiosity 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\n\n**选项类型：正确同义改写。**\n\nThe same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 dreams of ancient Hawaiians 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。\n\n古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。\n\n**正确选项的原文依据：**\n\n> The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii's shores inspires astronomers today to explore the heavens.","context":{"mode":"image","asset":"questions","focus":[250,1868,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"29","option":"A"},"focusId":"focus-q29-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>正在实现古代夏威夷人的梦想\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“is [xxx] the dreams of ancient Hawaiians”，保留了相应遮挡。当时的定位线索是：A的 dreams of ancient Hawaiians 涉及古人的探索愿望，第五段的 The same curiosity 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>The same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 dreams of ancient Hawaiians 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。\u003c/p>\n\u003cp>古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. is fulfilling the dreams of ancient Hawaiians","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 由第五段可推知，现代天文学的发展正在实现古代夏威夷人的梦想。\n\nA的 dreams of ancient Hawaiians 涉及古人的探索愿望，第五段的 The same curiosity 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\n\nThe same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 dreams of ancient Hawaiians 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。\n\n古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。","context":{"mode":"image","asset":"questions","focus":[250,1868,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"29","option":"A"},"focusId":"focus-q29-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>正在实现古代夏威夷人的梦想\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“is [xxx] the dreams of ancient Hawaiians”，保留了相应遮挡。当时的定位线索是：A的 dreams of ancient Hawaiians 涉及古人的探索愿望，第五段的 The same curiosity 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>The same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文  culture both seek to answer 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。B的 spread Hawaiian culture 却把天文学设为传播者，把夏威夷文化变成被传播的对象。这不是并列关系，而是一方把另一方向外输送的关系。\u003c/p>\n\u003cp>B加进传播动作和全球范围，原句的both关系不能支持这两步。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>由第五段可推知，现代天文学的发展有助于在全世界传播夏威夷文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 spread Hawaiian culture 说传播文化，第五段的 astronomy and Hawaiian culture both seek to answer 则把天文学与文化并列，因此回看这个both后面到底是共同做什么。\u003c/p>\n\u003cp>astronomy and Hawaiian culture both seek to answer 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。B的 spread Hawaiian culture 却把天文学设为传播者，把夏威夷文化变成被传播的对象。这不是并列关系，而是一方把另一方向外输送的关系。\u003c/p>\n\u003cp>across the world又增加了传播范围。原文的重大问题可以对人类很重要，但问题广泛不等于某一文化已经借天文学走向全世界。这句是在寻找两者可以对话的共同点，不能从“都在追问”推出“一个在推广另一个”。\u003c/p>\n\u003cp>B加进传播动作和全球范围，原句的both关系不能支持这两步。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. helps spread Hawaiian culture across the world","level":4,"raw":"#### 写作视角法\n\n原文第5段是这样写的：\n\n> Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\n>\n> 同一探索好奇心连接早期波利尼西亚航海者与今日天文学家，两种传统共同追问身份、来处与归宿。\n\n把这一处放回全文，它承担的写作任务是：转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Modern astronomy spreads Hawaiian culture throughout the world.\n>\n> 现代天文学把夏威夷文化传播到全世界。\n\n共同追问把科学和文化并列，文化传播却要求一方把另一方传向各地，文章没有接出这个传播过程。","context":{"mode":"image","asset":"que 人的身份、来处和去向，是两个主体具有共同追问。\n\nC：第5段把科学与文化并置，说二者都寻求回答who we are、where we come from、where we are going等大问题。\n\nD：原文从 Calls to 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。","context":{"mode":"image","asset":"questions","focus":[250,1774,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"29","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>29. A. is fulfilling the dreams of ancient Hawaiians\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：The same curiosity 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。\u003c/p>\n\u003cp>B：astronomy and Hawaiian culture both seek to answer 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。\u003c/p>\n\u003cp>C：第5段把科学与文化并置，说二者都寻求回答who we are、where we come from、where we are going等大问题。\u003c/p>\n\u003cp>D：原文从 Calls to 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：历史与现实的对比**（段落1引入主题） 历史荣耀：（古代夏威夷人是天文学家 + 观星者是社会最受尊敬的成员）// 现实困境：（TMT建设引发抗议）\n\n↓（争议焦点）\n\n**逻辑层次2：莫纳克亚山的双重身份**（段落2-3冲突根源） 神圣意义：（被崇拜为piko，连接夏威夷群岛与天堂）// 科学价值：（世界最强大望远镜所在地 + 地理条件得天独厚）→ 反对声音：【小而直言的群体长期反对：（视为对神圣土地的不敬 + 占领历史的痛苦提醒）】\n\n↓（责任归属）\n\n**逻辑层次3：天文学家的失误与文化复兴**（段落4反思批判） 天文学家的错误：【急于建造更大望远镜 → 忘记科学不是理解世界的唯一方式 + 未优先保护生态系统和神圣性】→ 文化现实：夏威夷文化不是遗物而是正在复兴的活文化\n\n↓（更深层的共通性）\n\n**逻辑层次4：科学与文化的共同追求**（段落5哲学思考） 共同根源：（科学也有文化历史，根源可追溯到文明黎明）→ 相同动力：（探索未知的好奇心：既带来波利尼西亚人到夏威夷，也激励天文学家探索天空）→ 共同目标：【天文学和夏威夷文化都寻求回答：我们是谁、从哪里来、要去哪里】→ 探索星空是回应了解自己和祖先家园的原始召唤\n\n↓（解决方案）\n\n**逻辑层次5：妥协与共存**（段落6和解展望） 天文学界的妥协：【选址考虑：（最小化可见度 + 避免考古和环境影响）+ 数量控制：（移除旧望远镜 + 恢复自然状态）】→ 共存愿景：每个人都可以在莫纳克亚山拥抱文化遗产并研究星星\n\n↑（全文主旨）\n\n全文核心观点：虽然TMT建设在莫纳克亚山引发了科学与文化的冲突，但通过认识到两者共同的探索精神和相互妥协，可以实现科学研究与文化传承的和谐共存。","context":{"mode":"newtype","k lict对应如今围绕新望远镜发生争议；标题用反差提出问题，不替任一方先作非理性定性。\n\n最强干扰项C（Treating Culture as a Finished Chapter）容易因相同话题进入考虑。但传统仍影响当下对地点的理解，不能把它当作已经过去的历史。\n\n**41题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. An Unexpected Conflict with an Old Tradition / 与古老传统形成反差的冲突\u003c/strong>\u003c/p>\n\u003cp>以古代观星传统和现代反对的反差引出问题。\u003c/p>\n\u003cblockquote>\n\u003cp>A culture with a long history of studying the stars might appear an obvious partner for modern astronomy.\u003c/p>\n\u003cp>It introduces the problem the debate must address: activities with a shared interest in the heavens can still collide when they attach different meanings to the place from which observation occurs.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以古代观星传统和现代反对的反差引出问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>Old Tradition对应文化中长期的观星兴趣，Unexpected Conflict对应如今围绕新望远镜发生争议；标题用反差提出问题，不替任一方先作非理性定性。\u003c/p>\n\u003cp>最强干扰项C（Treating Culture as a Finished Chapter）容易因相同话题进入考虑。但传统仍影响当下对地点的理解，不能把它当作已经过去的历史。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：G. One Mountain with Two Kinds of Value / 一座山的两种价值**\n\n并列说明观测条件与文化圣地意义。\n\n> A mountain can offer exceptionally clear views of the sky while also holding sacred significance for local people.\n>\n> A serious discussion of development must therefore recognise why the site matters in two different ways before judging the claims made about it.\n\n段内推进：\n\n> 并列说明观测条件与文化圣地意义。\n\nOne Mountain对应同一观测地点，Two Kinds of Value分别对应清晰成像的自然条件与当地社会的圣地意义。\n\n最强干扰项E（A Case for Removing Every Telescope）容易因相同话题进入考虑。但呈现双重价值是讨论的基础，并未据此直接推出全部拆除。\n\n**42题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：G. One Mountain with Two Kinds of Value / 一座山的两种价值\u003c/strong>\u003c/p>\n\u003cp>并列说明观测条件与文化圣地意义。\u003c/p>\n\u003cblockquote>\n\u003cp>A mountain can offer exceptionally clear views of the sky while also holding sacred significance for local people.\u003c/p>\n\u003cp>A serious discussion of development must therefore recognise why the site matters in two different ways before judging the claims made about it.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>并列说明观测条件与文化圣地意义。\u003c/p>\n\u003c/blockquote>\n\u003cp>One Mountain对应同一观测地点，Two Kinds of Value分别对应清晰成像的自然条件与当地社会的圣地意义。\u003c/p>\n\u003cp>最强干扰项E（A Case for Removing Every Telescope）容易因相同话题进入考虑。但呈现双重价值是讨论的基础，并未据此直接推出全部拆除。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：F. Why Opposition Cannot Be Dismissed / 反对声音为何不能被轻视**\n\n解释历史伤痛与科学界疏忽，要求理解活着的文化。\n\n> Opposition to telescopes may carry memories of political loss as well as concern for a particular patch of ground.\n>\n> It is necessary for recognising a living community rather than treating its culture as a museum object.\n\n段内推进：\n\n> 解释历史伤痛与科学界疏忽 → 要求理解活着的文化。\n\nOpposition对应居民对设备存在的异议，Cannot Be Dismissed对应政治失落记忆、生态忽略和活文化诉求构成的真实理由。\n\n最强干扰项C（Treating Culture as a Finished Chapter）容易因相同话题进入考虑。但结尾明确反对把文化当博物馆对象，传统并未失去现实生命。\n\n**43题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Why Opposition Cannot Be Dismissed / 反对声音为何不能被轻视\u003c/strong>\u003c/p>\n\u003cp>解释历史伤痛与科学界疏忽，要求理解活着的文化。\u003c/p>\n\u003cblockquote>\n\u003cp>Opposition to telescopes may carry memories of political loss as well as concern for a particular patch of ground.\u003c/p>\n\u003cp>It is necessary for recognising a living community rather than treating its culture as a museum object.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释历史伤痛与科学界疏忽 → 要求理解活着的文化。\u003c/p>\n\u003c/blockquote>\n\u003cp>Opposition对应居民对设备存在的异议，Cannot Be Dismissed对应政治失落记忆、生态忽略和活文化诉求构成的真实理由。\u003c/p>\n\u003cp>最强干扰项C（Treating Culture as a Finished Chapter）容易因相同话题进入考虑。但结尾明确反对把文化当博物馆对象，传统并未失去现实生命。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：A. A Shared Search Behind the Dispute / 争议背后共同的追问**\n\n以共同追问反对科学与文化必然互斥的判断。\n\n> A demand to remove every telescope can overlook another connection.\n>\n> It does challenge the claim that respect for one must require the complete disappearance of the other.\n\n段内推进：\n\n> 以共同追问反对科学与文化必然互斥的判断。\n\nShared Search对应天文学与文化传统共同追问起源、身份和世界位置，Behind the Dispute对应这些共同点仍藏在表面冲突之下。\n\n最强干扰项E（A Case for Removing Every Telescope）容易因相同话题进入考虑。但本段正批评全面拆除，没有为一刀切排斥天文学提供理由。\n\n**44题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. A Shared Search Behind the Dispute / 争议背后共同的追问\u003c/strong>\u003c/p>\n\u003cp>以共同追问反对科学与文化必然互斥的判断。\u003c/p>\n\u003cblockquote>\n\u003cp>A demand to remove every telescope can overlook another connection.\u003c/p>\n\u003cp>It does challenge the claim that respect for one must require the complete disappearance of the other.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以共同追问反对科学与文化必然互斥的判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>Shared Search对应天文学与文化传统共同追问起源、身份和世界位置，Behind the Dispute对应这些共同点仍藏在表面冲突之下。\u003c/p>\n\u003cp>最强干扰项E（A Case for Removing Every Telescope）容易因相同话题进入考虑。但本段正批评全面拆除，没有为一刀切排斥天文学提供理由。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：B. Coexistence Requires Practical Commitments / 共存需要具体承诺**\n\n用减小影响、保护地点与退役旧设备落实共存。\n\n> Shared curiosity becomes useful only when it is accompanied by practical changes.\n>\n> The aim is a future in which people can honour cultural inheritance and study the stars without assuming that only one activity may belong on the mountain.\n\n段内推进：\n\n> 用减小影响、保护地点与退役旧设备落实共存。\n\nCoexistence对应同时传承文化和探索星空，Practical Commitments对应降低可见度、保护敏感区域及退役旧设备；标题把共同兴趣推进成行动。\n\n最强干扰项G（One Mountain with Two Kinds of Value）容易因相同话题进入考虑。但双重价值在此已转化为行动安排，标题需覆盖妥协如何执行。\n\n**45题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：B. Coexistence Requires Practical Commitments / 共存需要具体承诺\u003c/strong>\u003c/p>\n\u003cp>用减小影响、保护地点与退役旧设备落实共存。\u003c/p>\n\u003cblockquote>\n\u003cp>Shared curiosity becomes useful only when it is accompanied by practical changes.\u003c/p>\n\u003cp>The aim is a future in which people can honour cultural inheritance and study the stars without assuming that only one activity may belong on the mountain.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>用减小影响、保护地点与退役旧设备落实共存。\u003c/p>\n\u003c/blockquote>\n\u003cp>Coexistence对应同时传承文化和探索星空，Practical Commitments对应降低可见度、保护敏感区域及退役旧设备；标题把共同兴趣推进成行动。\u003c/p>\n\u003cp>最强干扰项G（One Mountain with Two Kinds of Value）容易因相同话题进入考虑。但双重价值在此已转化为行动安排，标题需覆盖妥协如何执行。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 由观星传统反差转向地点意义 |\n| B | 说明山峰的两种价值 |\n| C | 从平等参与转向共同追问 |\n| D | 将共存变为选址与设计承诺 |\n| E | 要求科学界承认现时疏忽 |\n| F | 由文化价值追到政治历史伤痛 |\n| G | 说明可观察行动如何建立信任 |\n| H | 以有责任的科学文化共存收束 |\n\n全文推进：\n\n> 由观星传统反差转向地点意义 → 说明山峰的两种价值 → 由文化价值追到政治历史伤痛 → 要求科学界承认现时疏忽 → 从平等参与转向共同追问 → 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任 → 以有责任的科学文化共存收束\n\n完整顺序：\n\n**A → B → F → E → C → D → G → H**\n\n41—45：B、F、C、D、G。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>由观星传统反差转向地点意义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>说明山峰的两种价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>从平等参与转向共同追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>将共存变为选址与设计承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>要求科学界承认现时疏忽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由文化价值追到政治历史伤痛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明可观察行动如何建立信任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以有责任的科学文化共存收束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由观星传统反差转向地点意义 → 说明山峰的两种价值 → 由文化价值追到政治历史伤痛 → 要求科学界承认现时疏忽 → 从平等参与转向共同追问 → 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任 → 以有责任的科学文化共存收束\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → F → E → C → D → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、F、C、D、G。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → B → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> A mountain is more than a convenient platform for scientific equipment to the people whose history is attached to it.\n\n候选B的开头：\n\n> The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere.\n\n后段F的开头：\n\n> That second kind of value can be especially sensitive when the community remembers a loss of political independence.\n\n前文已经落到`a mountain`，B继续处理这一对象，完成“说明山峰的两种价值”。到本段末尾，讨论又落到`a second kind of value`，这正好为下一段“由文化价值追到政治历史伤痛”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 由观星传统反差转向地点意义 → 说明山峰的两种价值 → 由文化价值追到政治历史伤痛\n\n最强候选F的功能是“由文化价值追到政治历史伤痛”。它也属于同一论题，但若直接放在这里，就会跳过“说明山峰的两种价值”这一必要环节；其段首“That second kind of value can be especially sensitive when the community remembers a loss of political independence.”需要的前提与A当前收束的对象不一致，后续也接不出F所需的`a second kind of value`。\n\n**41题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → B → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A mountain is more than a convenient platform for scientific equipment to the people whose history is attached to it.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That second kind of value can be especially sensitive when the community remembers a loss of political independence.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a mountain\u003c/code>，B继续处理这一对象，完成“说明山峰的两种价值”。到本段末尾，讨论又落到\u003ccode>a second kind of value\u003c/code>，这正好为下一段“由文化价值追到政治历史伤痛”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由观星传统反差转向地点意义 → 说明山峰的两种价值 → 由文化价值追到政治历史伤痛\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“由文化价值追到政治历史伤痛”。它也属于同一论题，但若直接放在这里，就会跳过“说明山峰的两种价值”这一必要环节；其段首“That second kind of value can be especially sensitive when the community remembers a loss of political independence.”需要的前提与A当前收束的对象不一致，后续也接不出F所需的\u003ccode>a second kind of value\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是B → F → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段B的结尾：\n\n> Sacred associations connect the landscape with identity and origins, giving the same place a second kind of value.\n\n候选F的开头：\n\n> That second kind of value can be especially sensitive when the community remembers a loss of political independence.\n\n后段E的开头：\n\n> The historical burden does not remove scientists’ present responsibilities.\n\n前文已经落到`a second kind of value`，F继续处理这一对象，完成“由文化价值追到政治历史伤痛”。到本段末尾，讨论又落到`historical burden`，这正好为下一段“要求科学界承认现时疏忽”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 说明山峰的两种价值 → 由文化价值追到政治历史伤痛 → 要求科学界承认现时疏忽\n\n最强候选B的功能是“说明山峰的两种价值”。它也属于同一论题，但若直接放在这里，就会跳过“由文化价值追到政治历史伤痛”这一必要环节；其段首“The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere.”需要的前提与B当前收束的对象不一致，后续也接不出E所需的`historical burden`。\n\n**42题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42位于全文第3个位置，完整衔接是B → F → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Sacred associations connect the landscape with identity and origins, giving the same place a second kind of value.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That second kind of value can be especially sensitive when the community remembers a loss of political independence.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The historical burden does not remove scientists’ present responsibilities.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a second kind of value\u003c/code>，F继续处理这一对象，完成“由文化价值追到政治历史伤痛”。到本段末尾，讨论又落到\u003ccode>historical burden\u003c/code>，这正好为下一段“要求科学界承认现时疏忽”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明山峰的两种价值 → 由文化价值追到政治历史伤痛 → 要求科学界承认现时疏忽\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“说明山峰的两种价值”。它也属于同一论题，但若直接放在这里，就会跳过“由文化价值追到政治历史伤痛”这一必要环节；其段首“The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere.”需要的前提与B当前收束的对象不一致，后续也接不出E所需的\u003ccode>historical burden\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43位于全文第5个位置，完整衔接是E → C → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段E的结尾：\n\n> Recognising those mistakes is necessary, particularly when a living culture has been treated as a relic rather than as a ,"title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44位于全文第6个位置，完整衔接是C → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段C的结尾：\n\n> The methods differ, but the search for meaning provides a reason to discuss coexistence rather than assume permanent hostility.\n\n候选D的开头：\n\n> Coexistence requires more than agreement that curiosity is valuable.\n\n后段G的开头：\n\n> Those practical choices give both sides something concrete to evaluate.\n\n前文已经落到`coexistence`，D继续处理这一对象，完成“将共存变为选址与设计承诺”。到本段末尾，讨论又落到`practical choices`，这正好为下一段“说明可观察行动如何建立信任”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 从平等参与转向共同追问 → 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任\n\n最强候选C的功能是“从平等参与转向共同追问”。它也属于同一论题，但若直接放在这里，就会跳过“将共存变为选址与设计承诺”这一必要环节；其段首“Treating culture as a participant opens the possibility of discovering shared questions.”需要的前提与C当前收束的对象不一致，后续也接不出G所需的`practical choices`。\n\n**44题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44位于全文第6个位置，完整衔接是C → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The methods differ, but the search for meaning provides a reason to discuss coexistence rather than assume permanent hostility.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Coexistence requires more than agreement that curiosity is valuable.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those practical choices give both sides something concrete to evaluate.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>coexistence\u003c/code>，D继续处理这一对象，完成“将共存变为选址与设计承诺”。到本段末尾，讨论又落到\u003ccode>practical choices\u003c/code>，这正好为下一段“说明可观察行动如何建立信任”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从平等参与转向共同追问 → 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“从平等参与转向共同追问”。它也属于同一论题，但若直接放在这里，就会跳过“将共存变为选址与设计承诺”这一必要环节；其段首“Treating culture as a participant opens the possibility of discovering shared questions.”需要的前提与C当前收束的对象不一致，后续也接不出G所需的\u003ccode>practical choices\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45位于全文第7个位置，完整衔接是D → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段D的结尾：\n\n> Reducing visibility, protecting sensitive places and retiring older instruments are examples of commitments that can translate a general willingness to cooperate into practical choices.\n\n候选G的开头：\n\n> Those practical choices give both sides something concrete to evaluate.\n\n后段H的开头：\n\n> Good intentions become credible through these shared responsibilities.\n\n前文已经落到`practical choices`，G继续处理这一对象，完成“说明可观察行动如何建立信任”。到本段末尾，讨论又落到`good intentions`，这正好为下一段“以有责任的科学文化共存收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 将共存变为选址与设计承诺 → 说明可观察行动如何建立信任 → 以有责任的科学文化共存收束\n\n最强候选D的功能是“将共存变为选址与设计承诺”。它也属于同一论题，但若直接放在这里，就会跳过“说明可观察行动如何建立信任”这一必要环节；其段首“Coexistence requires more than agreement that curiosity is valuable.”需要的前提与D当前收束的对象不一致，后续也接不出H所需的`good intentions`。\n\n**45题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45位于全文第7个位置，完整衔接是D → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing visibility, protecting sensitive places and retiring older instruments are examples of commitments that can translate a general willingness to cooperate into practical choices.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those practical choices give both sides something concrete to evaluate.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Good intentions become credible through these shared responsibilities.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>practical choices\u003c/code>，G继续处理这一对象，完成“说明可观察行动如何建立信任”。到本段末尾，讨论又落到\u003ccode>good intentions\u003c/code>，这正好为下一段“以有责任的科学文化共存收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将共存变为选址与设计承诺 → 说明可观察行动如何建立信任 → 以有责任的科学文化共存收束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“将共存变为选址与设计承诺”。它也属于同一论题，但若直接放在这里，就会跳过“说明可观察行动如何建立信任”这一必要环节；其段首“Coexistence requires more than agreement that curiosity is valuable.”需要的前提与D当前收束的对象不一致，后续也接不出H所需的\u003ccode>good intentions\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **cultural heritage preservation** | **文化遗产保护** | **社会现象类：传统文化保护** | **宏观主题** |\n| scientific curiosity | 科学好奇心 | 社会现象类：科技发展 | 个人主题 |\n| mutual understanding | 相互理解 | 人生哲理类：理解、信任、宽容 | 宏观主题 |\n| **cooperation across communities** | **跨群体合作** | **人生哲理类：团结合作** | **宏观主题** |\n| environmental responsibility | 环境责任 | 人生哲理类：责任感、奉献精神 | 个人主题 |\n| respect for cultural diversity | 尊重文化多样性 | 社会现象类：文化交流 | 宏观主题 |\n| **a willingness to listen** | **倾听的意愿** | **人生哲理类：理解、信任、宽容** | **个人主题** |\n| creative compromise | 创造性的妥协 | 人生哲理类：团结合作 | 个人主题 |\n| a long-term perspective | 长远眼光 | 人生哲理类：批判、独立、全局思维 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>cultural heritage preservation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文化遗产保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：传统文化保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scientific curiosity\u003c/td>\n\u003ctd>科学好奇心\u003c/td>\n\u003ctd>社会现象类：科技发展\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mutual understanding\u003c/td>\n\u003ctd>相互理解\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation across communities\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>跨群体合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>environmental responsibility\u003c/td>\n\u003ctd>环境责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>respect for cultural diversity\u003c/td>\n\u003ctd>尊重文化多样性\u003c/td>\n\u003ctd>社会现象类：文化交流\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>a willingness to listen\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>倾听的意愿\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>creative compromise\u003c/td>\n\u003ctd>创造性的妥协\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a long-term perspective\u003c/td>\n\u003ctd>长远眼光\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第五鸟 · 写作积累","title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture presents a tension between scientific development and cultural heritage.** | **图画呈现科学发展与文化遗产之间的张力。** |\n| 图画题 | A and B are seeking a way to share the same place responsibly. | A与B正寻求负责任地共享同一地点的方式。 |\n| 图画题 | The scene invites a comparison between different approaches to a shared question. | 画面引导人们比较针对共同问题的不同探索方式。 |\n| **图表题** | **The proportion of resources devoted to A rose from X to Y.** | **投入A的资源比例由X升至Y。** |\n| 图表题 | The figures show growing attention to both A and B. | 这些数字显示对A与B的关注都在增加。 |\n| 图表题 | Investment in A increased while its impact on B was reduced. | 对A的投入增加，而它对B的影响减小。 |\n| **文本评论题** | **The passage begins with a contrast between an old tradition and a present dispute.** | **短文以古老传统与当前争议之间的反差开篇。** |\n| 文本评论题 | The author recognises the concerns of both sides before proposing practical compromises. | 作者先承认双方关切，再提出具体妥协办法。 |\n| 文本评论题 | The discussion suggests that A and B can pursue shared questions without losing their distinct identities. | 讨论表明A与B可在保留各自特性的同时探寻共同问题。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture presents a tension between scientific development and cultural heritage.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画呈现科学发展与文化遗产之间的张力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A and B are seeking a way to share the same place responsibly.\u003c/td>\n\u003ctd>A与B正寻求负责任地共享同一地点的方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene invites a comparison between different approaches to a shared question.\u003c/td>\n\u003ctd>画面引导人们比较针对共同问题的不同探索方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The proportion of resources devoted to A rose from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>投入A的资源比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show growing attention to both A and B.\u003c/td>\n\u003ctd>这些数字显示对A与B的关注都在增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Investment in A increased while its impact on B was reduced.\u003c/td>\n\u003ctd>对A的投入增加，而它对B的影响减小。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage begins with a contrast between an old tradition and a present dispute.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文以古老传统与当前争议之间的反差开篇。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author recognises the concerns of both sides before proposing practical compromises.\u003c/td>\n\u003ctd>作者先承认双方关切，再提出具体妥协办法。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion suggests that A and B can pursue shared questions without losing their distinct identities.\u003c/td>\n\u003ctd>讨论表明A与B可在保留各自特性的同时探寻共同问题。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. A Shared Search Behind the Dispute\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Coexistence Requires Practical Commitments\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Treating Culture as a Finished Chapter\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. An Unexpected Conflict with an Old Tradition\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. A Case for Removing Every Telescope\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Why Opposition Cannot Be Dismissed\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. One Mountain with Two Kinds of Value\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A culture with a long history of studying the stars might appear an obvious partner for modern astronomy. That expectation makes conflict over a new telescope particularly striking. The contrast does not prove that either side is irrational. It introduces the problem the debate must address: activities with a shared interest in the heavens can still collide when they attach different meanings to the place from which observation occurs.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>A mountain can offer exceptionally clear views of the sky while also holding sacred significance for local people. Neither value automatically erases the other. For astronomers, height and atmospheric conditions shape what a telescope can detect. For a community, the same landscape may connect people to origins, identity and inherited responsibilities. A serious discussion of development must therefore recognise why the site matters in two different ways before judging the claims made about it.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>Opposition to telescopes may carry memories of political loss as well as concern for a particular patch of ground. Scientists who see only an equipment dispute can miss that history. Their own behaviour may also deepen mistrust when they give too little attention to ecosystems or local understandings of the mountain. Listening to these objections is not a rejection of science. It is necessary for recognising a living community rather than treating its culture as a museum object.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>A demand to remove every telescope can overlook another connection. Astronomy and cultural traditions both ask questions about origins, human identity and our place in a larger world. They use different approaches, but the curiosity behind them need not be mutually hostile. Recognising that common search does not settle every planning dispute. It does challenge the claim that respect for one must require the complete disappearance of the other.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Shared curiosity becomes useful only when it is accompanied by practical changes. A project can reduce its visual impact, protect sensitive areas and provide for the retirement of older equipment. Such commitments make compromise something more than a welcoming phrase. They also allow cooperation to be judged against observable actions. The aim is a future in which people can honour cultural inheritance and study the stars without assuming that only one activity may belong on the mountain.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>An ancient interest in the stars does not prevent a modern community from opposing a telescope. The apparent contradiction becomes easier to understand when the proposed site is considered. A mountain is more than a convenient platform for scientific equipment to the people whose history is attached to it.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>The mountain has qualities that attract astronomers: its height places instruments above much of the dense atmosphere. Yet its importance to local people is not measured by image clarity. Sacred associations connect the landscape with identity and origins, giving the same place a second kind of value.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Treating culture as a participant opens the possibility of discovering shared questions. Astronomy and Hawaiian traditions both explore where people come from and how they understand their place in the world. The methods differ, but the search for meaning provides a reason to discuss coexistence rather than assume permanent hostility.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Coexistence requires more than agreement that curiosity is valuable. It must affect project design and the treatment of the site. Reducing visibility, protecting sensitive places and retiring older instruments are examples of commitments that can translate a general willingness to cooperate into practical choices.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>The historical burden does not remove scientists’ present responsibilities. Neglect of environmental protection or local concerns can make mistrust worse. Recognising those mistakes is necessary, particularly when a living culture has been treated as a relic rather than as a participant in decisions about its own landscape.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>That second kind of value can be especially sensitive when the community remembers a loss of political independence. Development may then resemble another assertion of outside power. Objections cannot be understood solely as preferences about the appearance of buildings; they also carry a historical burden.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Those practical choices give both sides something concrete to evaluate. A promise can be checked against what is built, protected or removed. This does not make every disagreement disappear, but it avoids asking a community to accept development solely on the strength of scientists’ assurances about good intentions.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>Good intentions become credible through these shared responsibilities. Science need not deny the mountain’s cultural meaning, and cultural respect need not forbid every attempt to study the sky. The stronger position is to make room for both pursuits while requiring those who use the place to care for it.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2017英语一Text 2重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ancient\u003c/td>\n\u003ctd>a.古代的\u003c/td>\n\u003ctd>Hawaiian\u003c/td>\n\u003ctd>n.夏威夷人\u003c/td>\n\u003ctd>as
