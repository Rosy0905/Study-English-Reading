const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| ancient | a.古代的 | Hawaiian | n.夏威夷人 | astronomer | n.天文学家 |\n| reigning monarch | 在位君主 | star watcher | 观星者 | esteemed | a.受尊敬的 |\n| sadly | ad.遗憾地 | astronomy | n.天文学 | protest | n.抗议 |\n| erupt | v.爆发 | construction | n.建造 | giant observatory | 巨型天文台 |\n| promise | v.有望 | revolutionize | v.彻底改变 | view | n.认识 |\n| cosmos | n.宇宙 |  |  |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 2重点词与语境","focus":[85,113,925,581],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ancient\u003c/td>\n\u003ctd>a.古代的\u003c/td>\n\u003ctd>Hawaiian\u003c/td>\n\u003ctd>n.夏威夷 文 · 第1段\n\n1897年，夏威夷最后一位在位君主莉莉乌奥卡拉尼女王写道：\"古代夏威夷人是天文学家。\"观星者在夏威夷社会中是最受尊敬的成员之一。遗憾的是，天文学在今天的夏威夷并不太平。关于建设三十米望远镜（TMT）的抗议已经爆发，这是一个承诺将彻底改变人类宇宙观的巨型天文台。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,113,925,581],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897. Star watchers were among the most esteemed members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#39;s view of the cosmos.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; / wrote Queen Liliuokalani, / Hawaii&#39;s last reigning monarch, / in 1897.\u003c/p>\n\u003cp>Star watchers / were among the most esteemed members / of Hawaiian society.\u003c/p>\n\u003cp>Sadly, / all is not well / with astronomy in Hawaii today.\u003c/p>\n\u003cp>Protests have erupted / over construction of the Thirty Meter Telescope (TMT), / a giant observatory / that promises to revolutionize / humanity&#39;s view of the cosmos.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>&quot;古代夏威夷人是天文学家，&quot; / 莉莉乌奥卡拉尼女王写道，/ 夏威夷最后一位在位君主，/ 在1897年。\u003c/p>\n\u003cp>观星者 / 是最受尊敬的成员之一 / 在夏威夷社会中。\u003c/p>\n\u003cp>遗憾的是，/ 一切都不太好 / 关于天文学在今天的夏威夷。\u003c/p>\n\u003cp>抗议已经爆发 / 关于三十米望远镜（TMT）的建设，/ 一个巨型天文台 / 它承诺要彻底改变 / 人类对宇宙的看法。\u003c/p>\n\u003c/section>\u003csectio an, / Mauna Kea's peak / rises above the bulk / of our planet's dense atmosphere, / where conditions allow telescopes / to obtain images / of unsurpassed clarity.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,703,925,619],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-2-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world&#39;s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>At issue is / the TMT&#39;s planned location / on Mauna Kea, / a dormant volcano / worshiped by some Hawaiians / as the piko, / that connects the Hawaiian Islands / to the heavens.\u003c/p>\n\u003cp>But Mauna Kea / is also home to / some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>Rested in the Pacific Ocean, / Mauna Kea&#39;s peak / rises above the bulk / of our planet&#39;s dense atmosphere, / where conditions allow telescopes / to obtain images / of unsurpassed clarity.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群翻译 · 第2段\n\n争议的焦点是 / TMT计划的位置 / 在莫纳克亚山上，/ 一座休眠火山 / 被一些夏威夷人崇拜 / 作为piko，/ 它连接夏威夷群岛 / 与天堂。\n\n但莫纳克亚山 / 也是所在地 / 世界上一些最强大的望远镜。\n\n坐落在太平洋中，/ 莫纳克亚山的山峰 / 高出大部分 / 我们星球稠密的大气层，/ 那里的条件允许望远镜 / 获得图像 / 具有无与伦比的清晰度。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,703,925,619],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-2-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world&#39;s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>At issue is / the TMT&#39;s planned location / on Mauna Kea, / a dormant volcano / worshiped by some Hawaiians / as the piko, / that connects the Hawaiian Islands / to the heavens.\u003c/p>\n\u003cp>But Mauna Kea / is also home to / some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>Rested in the Pacific Ocean, / Mauna Kea&#39;s peak / rises above the bulk / of our planet&#39;s dense atmosphere, / where conditions allow telescopes / to obtain images / of unsurpassed clarity.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>争议的焦点是 / TMT计划的位置 / 在莫纳克亚山上，/ 一座休眠火山 / 被一些夏威夷人崇拜 / 作为piko，/ 它连接夏威夷群岛 / 与天堂。\u003c/p>\n\u003cp>但莫纳克亚山 / 也是所在地 / 世界上一些最强大的望远镜。\u003c/p>\n\u003cp>坐落在太平洋中，/ 莫纳克亚山的山峰 / 高出大部分 / 我们星球稠密的大气层，/ 那里的条件允许望远镜 / 获得图像 / 具有无与伦比的清晰度。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 标准译文 · 第2段\n\n争议的焦点是TMT计划建在莫纳克亚山上，这是一座休眠火山，被一些夏威夷人崇拜为\"piko\"——连接夏威夷群岛与天堂的纽带。但莫纳克亚山也是世界上一些最强大望远镜的所在地。坐落在太平洋中的莫纳克亚山山峰高出地球大部分稠密大气层，那里的条件使望远镜能够获得无与伦比的清晰图像。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,703,925,619],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-2-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>At issue is the TMT&#39;s planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world&#39;s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea&#39;s peak rises above the bulk of our planet&#39;s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>At issue is / the TMT&#39;s planned location / on Mauna Kea, / a dormant volcano / worshiped by some Hawaiians / as the piko, / that connects the Hawaiian Islands / to the heavens.\u003c/p>\n\u003cp>But Mauna Kea / is also home to / some of the world&#39;s most powerful telescopes.\u003c/p>\n\u003cp>Rested in the Pacific Ocean, / Mauna Kea&#39;s peak / rises above the bulk / of our planet&#39;s dense atmosphere, / where conditions allow telescopes / to obtain images / of unsurpassed clarity.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>争议的焦点是 / TMT计划的位置 / 在莫纳克亚山上，/ 一座休眠火山 / 被一些夏威夷人崇拜 / 作为piko，/ 它连接夏威夷群岛 / 与天堂。\u003c/p>\n\u003cp>但莫纳克亚山 / 也是所在地 / 世界上一些最强大的望远镜。\u003c/p>\n\u003cp>坐落在太平洋中，/ 莫纳克亚山的山峰 / 高出大部分 / 我们星球稠密的大气层，/ 那里的条件允许望远镜 / 获得图像 / 具有无与伦比的清晰度。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-3\">\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>争议的焦点是TMT计划建在莫纳克亚山上，这是一座休眠火山，被一些夏威夷人崇拜 t is why / we explore the starry skies, / as if answering a primal calling / to know ourselves / and our true ancestral homes.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 意群翻译 · 第5段\n\n然而科学也有文化历史，/ 其根源可以追溯到 / 文明的黎明。\n\n同样的好奇心 / 去发现地平线之外的东西 / 最初带来早期波利尼西亚人 / 到夏威夷海岸 / 今天激励着天文学家 / 探索天空。\n\n呼吁拆除所有望远镜 / 在莫纳克亚山上 / 或禁止未来在那里的开发 / 忽视了现实 / 天文学和夏威夷文化 / 都寻求回答重大问题 / 关于我们是谁，/ 我们从哪里来 / 以及我们要去哪里。\n\n也许这就是为什么 / 我们探索星空，/ 仿佛在回应一种原始的召唤 / 去了解我们自己 / 和我们真正的祖先家园。","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2626,925,930],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-5-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too, with roots going back to the dawn of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens. Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-1\">\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too, / with roots going back / to the dawn of civilization.\u003c/p>\n\u003cp>The same curiosity / to find what lies beyond the horizon / that first brought early Polynesians / to Hawaii&#39;s shores / inspires astronomers today / to explore the heavens.\u003c/p>\n\u003cp>Calls to disassemble all telescopes / on Mauna Kea / or to ban future development there / ignore the reality / that astronomy and Hawaiian culture / both seek to answer big questions / about who we are, / where we come from / and where we are going.\u003c/p>\n\u003cp>Perhaps that is why / we explore the starry skies, / as if answering a primal calling / to know ourselves / and our true ancestral homes.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-2\">\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>然而科学也有文化历史，/ 其根源可以追溯到 / 文明的黎明。\u003c/p>\n\u003cp>同样的好奇心 / 去发现地平线之外的东西 / 最初带来早期波利尼西亚人 / 到夏威夷海岸 / 今天激励着天文学家 / 探索天空。\u003c/p>\n\u003cp>呼吁拆除所有望远镜 / 在莫纳克亚山上 / 或禁止未来在那里的开发 / 忽视了现实 / 天文学和夏威夷文化 / 都寻求回答重大问题 / 关于我们是谁，/ 我们从哪里来 / 以及我们要去哪里。\u003c/p>\n\u003cp>也许这就是为什么 / 我们探索星空，/ 仿佛在回应一种原始的召唤 / 去了解我们自己 / 和我们真正的祖先家园。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 标准译文 · 第5段\n\n然而，科学也有其文化历史，根源可以追溯到文明的黎明。同样的好奇心——探索地平线之外的东西——最初将早期波利尼西亚人带到夏威夷海岸，今天也激励着天文学家探索天空。呼吁拆除莫纳克亚山上所有望远镜或禁止未来开发的声音忽视了一个现实：天文学和夏威夷文化都在寻求回答关于我们是谁、从哪里来、要去哪里的重大问题。也许这就是我们探索星空的原因，仿佛在回应一种原始的召唤，去了解我们自己和我们真正的祖先家园。","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2626,925,930],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-5-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too, with roots going back to the dawn of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#39;s shores inspires astronomers today to explore the heavens. Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where ty around the island and to avoid archaeological and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3565,925,651],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-6-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>The astronomy community is making compromises to change its use of Mauna Kea. The TMT site was chosen to minimize the telescope&#39;s visibility around the island and to avoid archaeological and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 意群划分 · 第6段\n\nThe astronomy community / is making compromises / to change its use / of Mauna Kea.\n\nThe TMT site / was chosen to minimize / the telescope's visibility / around the island / and to avoid / archaeological and environmental impact.\n\nTo limit the number of telescopes / on Mauna Kea, / old ones will be removed / at the end of their lifetimes / and their sites returned / to a natural state.\n\nThere is no reason / why everyone cannot be welcomed / on Mauna Kea / to embrace their cultural heritage / and to study the stars.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3565,925,651],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-6-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>The astronomy community is making compromises to change its use of Mauna Kea. The TMT site was chosen to minimize the telescope&#39;s visibility around the island and to avoid archaeological and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>The astronomy community / is making compromises / to change its use / of Mauna Kea.\u003c/p>\n\u003cp>The TMT site / was chosen to minimize / the telescope&#39;s visibility / around the island / and to avoid / archaeological and environmental impact.\u003c/p>\n\u003cp>To limit the number of telescopes / on Mauna Kea, / old ones will be removed / at the end of their lifetimes / and their sites returned / to a natural state.\u003c/p>\n\u003cp>There is no reason / why everyone cannot be welcomed / on Mauna Kea / to embrace their cultural heritage / and to study the stars.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 意群翻译 · 第6段\n\n天文学界 / 正在做出妥协 / 改变其使用 / 莫纳克亚山的方式。\n\nTMT地点 / 被选择来最小化 / 望远镜的可见度 / 在岛屿周围 / 并避免 / 考古和环境影响。\n\n为了限制望远镜的数量 / 在莫纳克亚山上，/ 旧的将被移除 / 在它们的使用寿命结束时 / 它们的地点将恢复 / 到自然状态。\n\n没有理由 / 为什么每个人不能被欢迎 / 在莫纳克亚山上 / 拥抱他们的文化遗产 / 并研究星星。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3565,925,651],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-6-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>The astronomy community is making compromises to change its use of Mauna Kea. The TMT site was chosen to minimize the telescope&#39;s visibility around the island and to avoid archaeological and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>The astronomy community / is making compromises / to change its use / of Mauna Kea.\u003c/p>\n\u003cp>The TMT site / was chosen to minimize / the telescope&#39;s visibility / around the island / and to avoid / archaeological and environmental impact.\u003c/p>\n\u003cp>To limit the number of telescopes / on Mauna Kea, / old ones will be removed / at the end of their lifetimes / and their sites returned / to a natural state.\u003c/p>\n\u003cp>There is no reason / why everyone cannot be welcomed / on Mauna Kea / to embrace their cultural heritage / and to study the stars.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-2\">\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>天文学界 / 正在做出妥协 / 改变其使用 / 莫纳克亚山的方式。\u003c/p>\n\u003cp>TMT地点 / 被选择来最小化 / 望远镜的可见度 / 在岛屿周围 / 并避免 / 考古和环境影响。\u003c/p>\n\u003cp>为了限制望远镜的数量 / 在莫纳克亚山上，/ 旧的将被移除 / 在它们的使用寿命结束时 / 它们的地点将恢复 / 到自然状态。\u003c/p>\n\u003cp>没有理由 / 为什么每个人不能被欢迎 / 在莫纳克亚山上 / 拥抱他们的文化遗产 / 并研究星星。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 标准译文 · 第6段\n\n天文学界正在做出妥协，改变其使用莫纳克亚山的方式。TMT地点的选择是为了最小化望远镜在岛屿周围的可见度，并避免考古和环境影响。为了限制莫纳克亚山上望远镜的数量，旧望远镜将在使用寿命结束时被移除，其地点将恢复到自然状态。没有理由不欢迎每个人到莫纳克亚山来拥抱他们的文化遗产并研究星星。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3565,925,651],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-6-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>The astronomy community is making compromises to change its use of Mauna Kea. The TMT site was chosen to minimize the telescope&#39;s visibility around the island and to avoid archaeological and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>The astronomy community / is making compromises / to change its use / of Mauna Kea.\u003c/p>\n\u003cp>The TMT site / was chosen to minimize / the telescope&#39;s visibility / around the island / and to avoid / archaeological and environmental impact.\u003c/p>\n\u003cp>To limit the number of telescopes / on Mauna Kea, / old ones will be removed / at the end of their lifetimes / and their sites returned / to a natural state.\u003c/p>\n\u003cp>There is no reason / why everyone cannot be welcomed / on Mauna Kea / to embrace their cultural heritage / and to study the stars.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-2\">\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>天文学界 / 正在做出妥协 / 改变其使用 / 莫纳克亚山的方式。\u003c/p>\n\u003cp>TMT地点 / 被选择来最小化 / 望远镜的可见度 / 在岛屿周围 / 并避免 / 考古和环境影响。\u003c/p>\n\u003cp>为了限制望远镜的数量 / 在莫纳克亚山上，/ 旧的将被移除 / 在它们的使用寿命结束时 / 它们的地点将恢复 / 到自然状态。\u003c/p>\n\u003cp>没有理由 / 为什么每个人不能被欢迎 / 在莫纳克亚山上 / 拥抱他们的文化遗产 / 并研究星星。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-3\">\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>天文学界正在做出妥协，改变其使用莫纳克亚山的方式。TMT地点的选择是为了最小化望远镜在岛屿周围的可见度，并避免考古和环境影响。为了限制莫纳克亚山上望远镜的数量，旧望远镜将在使用寿命结束时被移除，其地点将恢复到自然状态。没有理由不欢迎每个人到莫纳克亚山来拥抱他们的文化遗产并研究星星。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"文章的句内逻辑（大家自行根据需求阅读)","level":2,"raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\n\n符号的作用：\n\n- `→`：主要叙述继续向下推进；\n- `+`：并列；\n- `：`：解释、修饰或补充；\n- `//`：转折或对比；\n- 括号：把同一层的信息捆成一个整体。","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\n\"The ancient Hawaiians were astronomers,\" → wrote Queen Liliuokalani：(Hawaii's last reigning monarch)：(in 1897).\n\nStar watchers → were among the most esteemed members：(of Hawaiian society).\n\nSadly → all is not well：(with astronomy in Hawaii today).\n\nProtests have erupted：(over construction of the Thirty Meter Telescope (TMT))：(a giant observatory：(that promises to revolutionize → humanity's view of the cosmos)).\n\n### 第2段\n\nAt issue is → the TMT's planned location：(on Mauna Kea)：(a dormant volcano：(worshiped by some Hawaiians：(as the piko：(that connects the Hawaiian Islands → to the heavens)))).\n\nBut Mauna Kea → is also home to：(some of the world's most powerful telescopes).\n\nRested in the Pacific Ocean → Mauna Kea's peak → rises above the bulk：(of our planet's dense atmosphere)：(where conditions allow telescopes → to obtain images：(of unsurpassed clarity)).\n\n### 第3段\n\nOpposition to telescopes：(on Mauna Kea) → is nothing new.\n\nA small but vocal group：(of Hawaiians and environmentalists) → have long viewed their presence：(as disrespect for sacred land + a painful reminder：(of the occupation：(of what was once a sovereign nation))).\n\n### 第4段\n\nSome blame：(for the current controversy) → belongs to astronomers.\n\nIn their eagerness：(to build bigger telescopes) → they forgot：(that science is not the only way：(of understanding the world)).\n\nThey did not always prioritize → the protection：(of Mauna Kea's fragile ecosystems) + its holiness：(to the island's inhabitants).\n\nHawaiian culture → is not a relic of the past; // it is a living culture：(undergoing a renaissance today).\n\n### 第5段\n\nYet science has a cultural history, too → with roots going back：(to the dawn of civilization).\n\nThe same curiosity：(to find what lies beyond the horizon)：(that first brought early Polynesians → to Hawaii's shores) → inspires astronomers today：(to explore the heavens).\n\nCalls：(to disassemble all telescopes：(on Mauna Kea) + to ban future development there) → ignore the reality：(that astronomy and Hawaiian culture → both seek to answer big questions：(about who we are + where we come from + where we are going)).\n\nPerhaps that is why → we explore the starry skies → as if answering a primal calling：(to know ourselves + our true ancestral homes).\n\n### 第6段\n\nThe astronomy community → is making compromises：(to change its use：(of Mauna Kea)).\n\nThe TMT site → was chosen：(to minimize → the telescope's visibility：(around the island) + to avoid → archaeological and environmental impact).\n\nTo limit the number of telescopes：(on Mauna Kea) → old ones will be removed：(at the end of their lifetimes) + their sites returned：(to a natural state).\n\nThere is no reason：(why everyone cannot be welcomed：(on Mauna Kea)：(to embrace their cultural heritage + to study the stars)).","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>&quot;The ancient Hawaiians were astronomers,&quot; → wrote Queen Liliuokalani：(Hawaii&#39;s last reigning monarch)：(in 1897).\u003c/p>\n\u003cp>Star watchers → were among the most esteemed members：(of Hawaiian society).\u003c/p>\n\u003cp>Sadly → all is not well：(with astronomy in Hawaii today).\u003c/p>\n\u003cp>Protests have erupted：(over construction of the Thirty Meter Telescope (TMT))：(a giant observatory：(that promises to revolutionize → humanity&#39;s view of the cosmos)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>At issue is → the TMT&#39;s planned location：(on Mauna Kea)：(a dormant volcano：(worshiped by some Hawaiians：(as the piko：(that connects the Hawaiian Islands → to the heavens)))).\u003c/p>\n\u003cp>But Mauna Kea → is also home to：(some of the world&#39;s most powerful telescopes).\u003c/p>\n\u003cp>Rested in the Pacific Ocean → Mauna Kea&#39;s peak → rises above the bulk：(of our planet&#39;s dense atmosphere)：(where conditions allow telescopes → to obtain images：(of unsurpassed clarity)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Opposition to telescopes：(on Mauna Kea) → is nothing new.\u003c/p>\n\u003cp>A small but vocal group：(of Hawaiians and environmentalists) → have long viewed their presence：(as disrespect for sacred land + a painful reminder：(of the occupation：(of what was once a sovereign nation))).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Some blame：(for the current controversy) → belongs to astronomers.\u003c/p>\n\u003cp>In their eagerness：(to build bigger telescopes) → they forgot：(that science is not the only way：(of understanding the world)).\u003c/p>\n\u003cp>They did not always prioritize → the protection：(of Mauna Kea&#39;s fragile ecosystems) + its holiness：(to the island&#39;s inhabitants).\u003c/p>\n\u003cp>Hawaiian culture → is not a relic of the past; // it is a living culture：(undergoing a renaissance today).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Yet science has a cultural history, too → with roots going back：(to the dawn of civilization).\u003c/p>\n\u003cp>The same curiosity：(to find what lies beyond the horizon)：(that first brought early Polynesians → to Hawaii&#39;s shores) → inspires astronomers today：(to explore the heavens).\u003c/p>\n\u003cp>Calls：(to disassemble all telescopes：(on Mauna Kea) + to ban future development there) → ignore the reality：(that astronomy and Hawaiian culture → both seek to answer big questions：(about who we are + where we come from + where we are going)).\u003c/p>\n\u003cp>Perhaps that is why → we explore the starry skies → as if answering a primal calling：(to know ourselves + our true ancestral homes).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>The astronomy community → is making compromises：(to change its use：(of Mauna Kea)).\u003c/p>\n\u003cp>The TMT site → was chosen：(to minimize → the telescope&#39;s visibility：(around the island) + to avoid → archaeological and environmental impact).\u003c/p>\n\u003cp>To limit the number of telescopes：(on Mauna Kea) → old ones will be removed：(at the end of their lifetimes) + their sites returned：(to a natural state).\u003c/p>\n\u003cp>There is no reason：(why everyone cannot be welcomed：(on Mauna Kea)：(to embrace their cultural heritage + to study the stars)).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n\"古代夏威夷人是天文学家，\" → 莉莉乌奥卡拉尼女王写道：(夏威夷最后一位在位君主)：(在1897年)。\n\n观星者 → 是最受尊敬的成员之一：(在夏威夷社会中)。\n\n遗憾的是 → 一切都不太好：(关于天文学在今天的夏威夷)。\n\n抗议已经爆发：(关于三十米望远镜（TMT）的建设)：(一个巨型天文台：(它承诺要彻底改变 → 人类对宇宙的看法))。\n\n### 第2段\n\n争议的焦点是 → TMT计划的位置：(在莫纳克亚山上)：(一座休眠火山：(被一些夏威夷人崇拜：(作为piko：(它连接夏威夷群岛 → 与天堂))))。\n\n但莫纳克亚山 → 也是所在地：(世界上一些最强大的望远镜)。\n\n坐落在太平洋中 → 莫纳克亚山的山峰 → 高出大部分：(我们星球稠密的大气层)：(那里的条件允许望远镜 → 获得图像：(具有无与伦比的清晰度))。\n\n### 第3段\n\n反对望远镜：(在莫纳克亚山上) → 并不是新鲜事。\n\n一个小但直言不讳的群体：(夏威夷人和环保主义者的) → 长期以来一直视它们的存在：(为对神圣土地的不敬 + 一个痛苦的提醒：(关于占领：(曾经是主权国家的地方)))。\n\n### 第4段\n\n一些责任：(对于当前的争议) → 属于天文学家。\n\n在他们的急切中：(建造更大的望远镜) → 他们忘记了：(科学不是唯一的方式：(理解世界的))。\n\n他们并不总是优先考虑 → 保护：(莫纳克亚山脆弱的生态系统) + 它的神圣性：(对岛上居民来说)。\n\n夏威夷文化 → 不是过去的遗物；// 它是一种活的文化：(今天正在经历复兴)。\n\n### 第5段\n\n然而科学也有文化历史 → 其根源可以追溯到：(文明的黎明)。\n\n同样的好奇心：(去发现地平线之外的东西)：(最初带来早期波利尼西亚人 → 到夏威夷海岸) → 今天激励着天文学家：(探索天空)。\n\n呼吁：(拆除所有望远镜：(在莫纳克亚山上) + 禁止未来在那里的开发) → 忽视了现实：(天文学和夏威夷文化 → 都寻求回答重大问题：(关于我们是谁 + 我们从哪里来 + 我们要去哪里))。\n\n也许这就是为什么 → 我们探索星空 → 仿佛在回应一种原始的召唤：(去了解我们自己 + 我们真正的祖先家园)。\n\n### 第6段\n\n天文学界 → 正在做出妥协：(改变其使用：(莫纳克亚山的方式))。\n\nTMT地点 → 被选择：(来最小化 → 望远镜的可见度：(在岛屿周围) + 避免 → 考古和环境影响)。\n\n为了限制望远镜的数量：(在莫纳克亚山上) → 旧的将被移除：(在它们的使用寿命结束时) + 它们的地点将恢复：(到自然状态)。\n\n没有理由：(为什么每个人不能被欢迎：(在莫纳克亚山上)：(拥抱他们的文化遗产 + 研究星星))。","context":{"mode":"image","asset":"articleAnnotated","label":"2017英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>&quot;古代夏威夷人是天文学家，&quot; → 莉莉乌奥卡拉尼女王写道：(夏威夷最后一位在位君主)：(在1897年)。\u003c/p>\n\u003cp>观星者 → 是最受尊敬的成员之一：(在夏威夷社会中)。\u003c/p>\n\u003cp>遗憾的是 → 一切都不太好：(关于天文学在今天的夏威夷)。\u003c/p>\n\u003cp>抗议已经爆发：(关于三十米望远镜（TMT）的建设)：(一个巨型天文台：(它承诺要彻底改变 → 人类对宇宙的看法))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>争议的焦点是 → TMT计划的位置：(在莫纳克亚山上)：(一座休眠火山：(被一些夏威夷人崇拜：(作为piko：(它连接夏威夷群岛 → 与天堂))))。\u003c/p>\n\u003cp>但莫纳克亚山 → 也是所在地：(世界上一些最强大的望远镜)。\u003c/p>\n\u003cp>坐落在太平洋中 → 莫纳克亚山的山峰 → 高出大部分：(我们星球稠密的大气层)：(那里的条件允许望远镜 → 获得图像：(具有无与伦比的清晰度))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>反对望远镜：(在莫纳克亚山上) → 并不是新鲜事。\u003c/p>\n\u003cp>一个小但直言不讳的群体：(夏威夷人和环保主义者的) → 长期以来一直视它们的存在：(为对神圣土地的不敬 + 一个痛苦的提醒：(关于占领：(曾经是主权国家的地方)))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>一些责任：(对于当前的争议) → 属于天文学家。\u003c/p>\n\u003cp>在他们的急切中：(建造更大的望远镜) → 他们忘记了：(科学不是唯一的方式：(理解世界的))。\u003c/p>\n\u003cp>他们并不总是优先考虑 → 保护：(莫纳克亚山脆弱的生态系统) + 它的神圣性：(对岛上居民来说)。\u003c/p>\n\u003cp>夏威夷 和夏威夷文化都在寻求回答关于我们是谁、从哪里来、要去哪里的重大问题。","context":{"mode":"image","asset":"articleAnnotated","label":"第5段第3句","focus":[85,2831,925,418],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":true,"partIndex":5,"kind":"standard"},"focusId":"focus-long-3-5","html":"\u003csection class=\"revealPart\" id=\"focus-long-3-0\">\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-1\">\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Calls to disassemble all telescopes / on Mauna Kea / or to ban future development there / ignore the reality / that astronomy and Hawaiian culture / both seek to answer big questions / about who we are, / where we come from / and where we are going.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>呼吁拆除所有望远镜 / 在莫纳克亚山上 / 或禁止未来在那里的开发 / 忽视了现实 / 天文学和夏威夷文化 / 都寻求回答重大问题 / 关于我们是谁，/ 我们从哪里来 / 以及我们要去哪里。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把calls的两个要求合并成主语。：\u003c/p>\n\u003cblockquote>\n\u003cp>呼吁拆除所有望远镜或禁止未来开发的声音\u003c/p>\n\u003c/blockquote>\n\u003cp>再把被忽略的共同点合并起来。：\u003c/p>\n\u003cblockquote>\n\u003cp>天文学与夏威夷文化都追问我们是谁、从哪里来、要去哪里\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>呼吁拆除所有望远镜或禁止未来开发的声音；天文学与夏威夷文化都追问我们是谁、从哪里来、要去哪里。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>全面拆除或禁建的呼声忽略了两者共同的追问。\u003c/p>\n\u003c/blockquote>\n\u003cp>两个不定式都修饰呼声；that引出的现实放在“忽视”之后，三个疑问并列作answer的对象。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>要求拆除莫纳克亚山上所有望远镜或禁止那里未来开发的呼声，忽视了一个现实：天文学和夏威夷文化都在追问我们是谁、来自哪里、要往哪里去。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>all和ban future development表明作者针对的是全面否定，不是所有具体环保意见。\u003c/p>\n\u003cp>both seek保留科学与文化的共同性，不能译成天文学取代夏威夷文化。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>呼吁拆除莫纳克亚山上所有望远镜或禁止未来开发的声音忽视了一个现实：天文学和夏威夷文化都在寻求回答关于我们是谁、从哪里来、要去哪里的重大问题。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"30题 · 题干、题型与核心出处","level":2,"raw":"## 30题\n\n**The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.**\n\n作者对于选择莫纳克亚山作为TMT台址，持何种态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **severe criticism**\n\n严厉批评\n\nB. **full approval**\n\n完全赞同\n\nC. **passive acceptance**\n\n被动接受\n\nD. **slight hesitancy**\n\n略有犹豫\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。 | 先说过去与眼前有什么不同 |\n| 2 | 说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。 | 再说同一个地方为何被两边看重 |\n| 3 | 说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。 | 接着说明为什么有人不接受 |\n| 4 | 承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。 | 然后承认这一边有做得不好的地方 |\n| 5 | 转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。 | 再说另一边也不能这样否定 |\n| 6 | 列出改变使用方式、避免影响、退役旧设备与恢复自然状态等安排，最后明确欢迎文化传承与研究星空共存。 | 最后说怎样才能一起做下去 |","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"question":"30","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>作者对于选择莫纳克亚山作为TMT台址，持何种态度？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>severe criticism\u003c/strong>\u003c/p>\n\u003cp>严厉批评\u003c/p>\n\u003cp>B. \u003cstrong>full approval\u003c/strong>\u003c/p>\n\u003cp>完全赞同\u003c/p>\n\u003cp>C. \u003cstrong>passive acceptance\u003c/strong>\u003c/p>\n\u003cp>被动接受\u003c/p>\n\u003cp>D. \u003cstrong>slight hesitancy\u003c/strong>\u003c/p>\n\u003cp>略有犹豫\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>列出改变使用方式、避免影响、退役旧设备与恢复自然状态等安排，最后明确欢迎文化传承与研究星空共存。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. severe criticism","level":3,"raw":"**The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.**\n\n### A. severe criticism\n\n严厉批评","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>严厉批评\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. severe criticism","level":3,"raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n严厉批评\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 借古代重视观星与当下争议的反差，提出严厉批评现有TMT选址的立场。 | 先说过去与眼前有什么不同 |\n| 2 | 承认同一山峰兼具科研和文化价值，但强调选址未妥善处理两种诉求。 | 再说同一个地方为何被两边看重 |\n| 3 | 详述居民拒绝选址的历史与圣地理由，作为批评工程决定的依据。 | 接着说明为什么有人不接受 |\n| 4 | 承认科学界忽视生态与文化的过失，进一步追究选址责任。 | 然后承认这一边有做得不好的地方 |\n| 5 | 承认文化诉求也不能任意否定科学价值，但说明这不等于现址合理。 | 再说另一边也不能这样否定 |\n| 6 | 提出改换地点或严格纠偏后再合作的办法，保持对当前选址的批评。 | 最后说怎样才能一起做下去 |\n\nA要求全文最后落在严厉否定这项选址上。第三段的痛苦回忆与第四段的Some blame，确实能够让人感到作者批评了科学一方；但批评的对象是忽略当地价值的做法，不等于拒绝在这个地点建设望远镜。\n\n第五段以Yet转向：科学本身也有文化历史，同样的探索好奇心跨越古今，禁止未来发展会忽略共同问题。第六段继续列如何调整，最后用There is no reason why everyone cannot be welcomed明确欢迎双方。若是A，这两段应该继续反对或要求放弃台址，实际方向却相反。\n\n承认天文学家负有部分责任，是否就足以把作者对选址的整体态度判成严厉批评？\n\n不能。承认问题服务于后面的共存办法，结尾没有否定选址。A排除。\n\n---\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>严厉批评\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>严厉批评\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借古代重视观星与当下争议的反差，提出严厉批评现有TMT选址的立场。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认同一山峰兼具科研和文化价值，但强调选址未妥善处理两种诉求。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>详述居民拒绝选址的历史与圣地理由，作为批评工程决定的依据。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学界忽视生态与文化的过失，进一步追究选址责任。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>承认文化诉求也不能任意否定科学价值，但说明这不等于现址合理。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出改换地点或严格纠偏后再合作的办法，保持对当前选址的批评。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A要求全文最后落在严厉否定这项选址上。第三段的痛苦回忆与第四段的Some blame，确实能够让人感到作者批评了科学一方；但批评的对象是忽略当地价值的做法，不等于拒绝在这个地点建设望远镜。\u003c/p>\n\u003cp>第五段以Yet转向：科学本身也有文化历史，同样的探索好奇心跨越古今，禁止未来发展会忽略共同问题。第六段继续列如何调整，最后用There is no reason why everyone cannot be welcomed明确欢迎双方。若是A，这两段应该继续反对或要求放弃台址，实际方向却相反。\u003c/p>\n\u003cp>承认天文学家负有部分责任，是否就足以把作者对选址的整体态度判成严厉批评？\u003c/p>\n\u003cp>不能。承认问题服务于后面的共存办法，结尾没有否定选址。A排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. full approval","level":3,"raw":"**The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.**\n\n### B. full approval\n\n完全赞同","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>完全赞同\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. full approval","level":3,"raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n完全赞同\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以古代天文传统与当下反对形成反差，为支持科学和文化共处提出问题。 | 先说过去与眼前有什么不同 |\n| 2 | 介绍神山意义与优良观测条件，说明在此共存有双方都看重的基础。 | 再说同一个地方为何被两边看重 |\n| 3 | 解释历史伤痛和圣地观念造成的反对，使支持立场正面回应阻力。 | 接着说明为什么有人不接受 |\n| 4 | 承认科学家忽视环境与文化的错误，要求在支持建设时修正这些做法。 | 然后承认这一边有做得不好的地方 |\n| 5 | 指出全面拆除或禁建也忽略科学与文化的共同追问，反对全盘否定。 | 再说另一边也不能这样否定 |\n| 6 | 展示减小影响与退役旧镜的妥协安排，明确支持人们共同传承文化、研究星空。 | 最后说怎样才能一起做下去 |\n\nB中的full approval针对题干限定的choosing Mauna Kea as the TMT site，并不是说作者赞同天文学家以前的每一种做法。因此第四段承认失误，与\n\n从六行看，第二段给出观测优势，第三、四段认真处理反对理由，第五段找科学与文化的共同追问，第六段提出减轻影响和恢复场地的安排。最后的There is no reason why everyone cannot be welcomed不是被动让步，而是明确反对把两类活动排斥在同一地方之外。\n\n作者是否在处理反对理由之后，仍主动肯定文化传承与研究星空可以在莫纳克亚山共存？\n\n能。结尾态度明确，前面的承认失误并未变成否决台址。B保留。\n\n---\n\n判断：\n\n**B 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>完全赞同\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>完全赞同\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以古代天文传统与当下反对形成反差，为支持科学和文化共处提出问题。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>介绍神山意义与优良观测条件，说明在此共存有双方都看重的基础。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释历史伤痛和圣地观念造成的反对，使支持立场正面回应阻力。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学家忽视环境与文化的错误，要求在支持建设时修正这些做法。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>指出全面拆除或禁建也忽略科学与文化的共同追问，反对全盘否定。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>展示减小影响与退役旧镜的妥协安排，明确支持人们共同传承文化、研究星空。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B中的full approval针对题干限定的choosing Mauna Kea as the TMT site，并不是说作者赞同天文学家以前的每一种做法。因此第四段承认失误，与\u003c/p>\n\u003cp>从六行看，第二段给出观测优势，第三、四段认真处理反对理由，第五段找科学与文化的共同追问，第六段提出减轻影响和恢复场地的安排。最后的There is no reason why everyone cannot be welcomed不是被动让步，而是明确反对把两类活动排斥在同一地方之外。\u003c/p>\n\u003cp>作者是否在处理反对理由之后，仍主动肯定文化传承与研究星空可以在莫纳克亚山共存？\u003c/p>\n\u003cp>能。结尾态度明确，前面的承认失误并未变成否决台址。B保留。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. passive acceptance","level":3,"raw":"**The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.**\n\n### C. passive acceptance\n\n被动接受","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"C"},"focusId":"focus-q30-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>被动接受\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. passive acceptance","level":3,"raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n被动接受\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从古代传统与今日争议的反差写起，表示虽不热衷但不得不接受现址。 | 先说过去与眼前有什么不同 |\n| 2 | 承认场地有科学与文化双重价值，说明被动接受是两种现实压力的结果。 | 再说同一个地方为何被两边看重 |\n| 3 | 介绍当地拒绝的理由，说明作者仍感无奈和不情愿。 | 接着说明为什么有人不接受 |\n| 4 | 承认科学家做法欠妥，进一步解释为什么不能积极赞成。 | 然后承认这一边有做得不好的地方 |\n| 5 | 又指出全面否定科学也不可取，从而把接受现址解释为别无选择。 | 再说另一边也不能这样否定 |\n| 6 | 提出最低限度缓和冲突的安排，以勉强妥协而非主动欢迎收束。 | 最后说怎样才能一起做下去 |\n\nC的passive acceptance意味着作者并不真正积极支持，只是勉强或无奈地接受。若照这个态度写，第五段就不必主动为科学的文化历史辩护，第六段也应落到“既然无法改变，只好如此”。实际作者不是只描述建设已经发生，而是认真论证两者有共同的探索根源。\n\n末段列改变使用方式、限制设备数量、退役后恢复自然等安排，说明作者在建设性地寻找共同使用的方式；最后明确说没有理由不欢迎所有人。这里的肯定来自论证与可行安排，不是来自无计可施。\n\n列出共存理由并主动欢迎双方，是被迫接受无法改变的现实吗？\n\n不是。C所需的无奈或消极态度没有形成，反而与作者主动说明共存可能的写法不合，排除。\n\n---\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"C"},"focusId":"focus-q30-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>被动接受\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>被动接受\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从古代传统与今日争议的反差写起，表示虽不热衷但不得不接受现址。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认场地有科学与文化双重价值，说明被动接受是两种现实压力的结果。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍当地拒绝的理由，说明作者仍感无奈和不情愿。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学家做法欠妥，进一步解释为什么不能积极赞成。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>又指出全面否定科学也不可取，从而把接受现址解释为别无选择。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>提出最低限度缓和冲突的安排，以勉强妥协而非主动欢迎收束。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的passive acceptance意味着作者并不真正积极支持，只是勉强或无奈地接受。若照这个态度写，第五段就不必主动为科学的文化历史辩护，第六段也应落到“既然无法改变，只好如此”。实际作者不是只描述建设已经发生，而是认真论证两者有共同的探索根源。\u003c/p>\n\u003cp>末段列改变使用方式、限制设备数量、退役后恢复自然等安排，说明作者在建设性地寻找共同使用的方式；最后明确说没有理由不欢迎所有人。这里的肯定来自论证与可行安排，不是来自无计可施。\u003c/p>\n\u003cp>列出共存理由并主动欢迎双方，是被迫接受无法改变的现实吗？\u003c/p>\n\u003cp>不是。C所需的无奈或消极态度没有形成，反而与作者主动说明共存可能的写法不合，排除。\u003c/p>\n\u003chr>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. slight hesitancy","level":3,"raw":"**The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.**\n\n### D. slight hesitancy\n\n略有犹豫","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>略有犹豫\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. slight hesitancy","level":3,"raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n略有犹豫\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用古今反差提出选址争议，表达整体接近支持但仍有少量疑虑。 | 先说过去与眼前有什么不同 |\n| 2 | 承认两种价值都重要，指出其兼容程度还存在一个未决问题。 | 再说同一个地方为何被两边看重 |\n| 3 | 解释部分居民不接受的原因，把它作为尚待考虑的理由。 | 接着说明为什么有人不接受 |\n| 4 | 承认科学家过去有过失，因此对当前承诺留下一点审慎保留。 | 然后承认这一边有做得不好的地方 |\n| 5 | 说明全面否定科学同样失当，减少疑虑但不完全消除。 | 再说另一边也不能这样否定 |\n| 6 | 展示合作途径后仍留下一个具体未解决条件，使略有犹豫延续到结尾。 | 最后说怎样才能一起做下去 |\n\nD比严厉反对轻一些，容易让人把第四段承认问题看成作者还有犹豫。但文章中间出现两面材料，并不能把结尾的态度也留在两面之间。先交代反对者、再承认科学一方有责任，是作者把问题讲完整的步骤，不必等于尚未表态。\n\n第五段已经明确批评全面禁止发展的主张，第六段继续说应怎样减少冲突，并用There is no reason why everyone cannot be welcomed收束。若仍略有犹豫，应留下“是否能够”“仍待观察”一类未定判断；实际末句没有要求等待裁决，也没有保留否决台址的姿态。\n\n中间承认矛盾，能不能覆盖结尾已经明确给出的欢迎与共存判断？\n\n不能。D停在论证中途，忽略结尾的肯定，排除。\n\n---\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2284,1800,470],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\u003c/strong>\u003c/p>\n\u003cp>略有犹豫\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>略有犹豫\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用古今反差提出选址争议，表达整体接近支持但仍有少量疑虑。\u003c/td>\n\u003ctd>先说过去与眼前有什么不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认两种价值都重要，指出其兼容程度还存在一个未决问题。\u003c/td>\n\u003ctd>再说同一个地方为何被两边看重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>解释部分居民不接受的原因，把它作为尚待考虑的理由。\u003c/td>\n\u003ctd>接着说明为什么有人不接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认科学家过去有过失，因此对当前承诺留下一点审慎保留。\u003c/td>\n\u003ctd>然后承认这一边有做得不好的地方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>说明全面否定科学同样失当，减少疑虑但不完全消除。\u003c/td>\n\u003ctd>再说另一边也不能这样否定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>展示合作途径后仍留下一个具体未解决条件，使略有犹豫延续到结尾。\u003c/td>\n\u003ctd>最后说怎样才能一起做下去\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D比严厉反对轻一些，容易让人把第四段承认问题看成作者还有犹豫。但文章中间出现两面材料，并不能把结尾的态度也留在两面之间。先交代反对者、再承认科学一方有责任，是作者把问题讲完整的步骤，不必等于尚未表态。\u003c/p>\n\u003cp>第五段已经明确批评全面禁止发展的主张，第六段继续说应怎样减少冲突，并用There is no reason why everyone cannot be welcomed收束。若仍略有犹豫，应留下“是否能够”“仍待 \u003cp>&quot;The ancient Hawaiians were astronomers,&quot; wrote Queen Liliuokalani, Hawaii&#39;s last reigning monarch, in 1897. Star watchers were among the most esteemed members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#39;s view of the cosmos.\u003c/p>\n\u003c/blockquote>\n\u003cp>女王追溯古代夏威夷人的天文学传统，下一句说观星者地位崇高，然后以Sadly转到今天的建镜争议。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the importance of astronomy in ancient Hawaiian society","level":3,"raw":"### A. the importance of astronomy in ancient Hawaiian society\n\n> 天文学在古代夏威夷社会中的重要性\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 ancient Hawaiian society 与女王说的 The ancient Hawaiians were astronomers 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。\n\n**选项类型：正确同义改写。**\n\nThe ancient Hawaiians were astronomers 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。A的 ancient Hawaiian society 保留了这个时间和社会范围。\n\n引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。\n\n**正确选项的原文依据：**\n\n> \"The ancient Hawaiians were astronomers,\" wrote Queen Liliuokalani, Hawaii's last reigning monarch, in 1897.\n>\n> Star watchers were among the most esteemed members of Hawaiian society.\n>\n> Sadly, all is not well with astronomy in Hawaii today.","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2017英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"A"},"focusId":"focus-q26-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>天文学在古代夏威夷社会中的重要性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 ancient Hawaiian society 与女王说的 The ancient Hawaiians were astronomers 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong
