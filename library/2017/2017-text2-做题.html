enaissance","visibleOptionAnchor":"a chance of revival"}}}},{"section":"28题","raw":"### D. it reminds them of a humiliating history\n\n> 它让他们想起一段屈辱历史\n\n把D接回题干，它说的是：一些当地人反对TMT建设，部分原因是这让他们想起一段屈辱历史。\n\nD的 `a humiliating history` 可以接到第三段的 `occupation of what was once a sovereign nation`，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。\n\n> A small but **[xxx]** group of Hawaiians and environmentalists have long viewed their presence as **[xxx]** for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\n\n原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。`occupation of what was once a sovereign nation` 是主权国家遭占领的历史，且作者明写painful，D的 `a humiliating history` 正是对这种受占领的屈辱经历作概括。\n\n这里既没有把过去换成未来，也没有把提醒改成正在夺权。题干还用partly because，允许只选出部分原因，D不必把前面sacred land那一层也全装进去。它保留的是原文and后面已经写完整的一条理由。\n\n**D是否保留了“望远镜的存在提醒他们想起过去被占领的痛苦经历”这一关系？**\n\n能。现在的提醒、过去的历史和当地人的负面感受都对应，没有另造未来损害。\n\nD能够独立回答partly because所要求的一部分原因。\n\n**第一轮判断：D保留。**","contextRaw":"","html":"<h3>D. it reminds them of a humiliating history</h3>\n<blockquote>\n<p>它让他们想起一段屈辱历史</p>\n</blockquote>\n<p>把D接回题干，它说的是：一些当地人反对TMT建设，部分原因是这让他们想起一段屈辱历史。</p>\n<p>D的 <code>a humiliating history</code> 可以接到第三段的 <code>occupation of what was once a sovereign nation</code>，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。</p>\n<blockquote>\n<p>A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n</blockquote>\n<p>原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。<code>occupation of what was once a sovereign nation</code> 是主权国家遭占领的历史，且作者明写painful，D的 <code>a humiliating history</code> 正是对这种受占领的屈辱经历作概括。</p>\n<p>这里既没有把过去换成未来，也没有把提醒改成正在夺权。题干还用partly because，允许只选出部分原因，D不必把前面sacred land那一层也全装进去。它保留的是原文and后面已经写完整的一条理由。</p>\n<p><strong>D是否保留了“望远镜的存在提醒他们想起过去被占领的痛苦经历”这一关系？</strong></p>\n<p>能。现在的提醒、过去的历史和当地人的负面感受都对应，没有另造未来损害。</p>\n<p>D能够独立回答partly because所要求的一部分原因。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[168,718,995,152]],"questionRects":[[188,770,990,34],[234,974,531,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `a humiliating history` 可以接到第三段的 `occupation of what was once a sovereign nation`，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"occupation of what was once a sovereign nation","visibleOptionAnchor":"a humiliating history"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n> **28题选D。**","contextRaw":"","html":"<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<blockquote>\n<p><strong>28题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,770,990,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> It can be inferred from Paragraph 5 that progress in today’s astronomy ______.  \n> 从第五段可以推知，今天的天文学进展怎样？\n\n题干用Paragraph 5指定第五段，问今天的天文学进展。先把第五段完整读下来，尤其把过去的人与今天的人分别放在句中的位置上，不先替任何一个动作补意思。\n\n> 原文参考：\n>\n> Yet science has a cultural history, too, with roots going back to the **[xxx]** of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens. Calls to **[xxx]** all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a **[xxx]** calling to know ourselves and our true **[xxx]** homes.\n>\n> 开始精读：\n>\n> Yet science has a cultural history, too, / with roots going back to the **[xxx]** of civilization. / The same curiosity to find what lies beyond the horizon / that first brought early Polynesians to Hawaii’s shores / inspires astronomers today to explore the heavens. / Calls to **[xxx]** all telescopes on Mauna Kea / or to ban future development there / ignore the reality that astronomy and Hawaiian culture both seek to answer big questions / about who we are, where we come from and where we are going. / Perhaps that is why we explore the starry skies, / as if answering a **[xxx]** calling / to know ourselves and our true **[xxx]** homes.\n>\n> 顺着英文顺序读：\n>\n> 然而科学也有文化历史， / 根源可以追溯到文明的 **[xxx]**。 / 那种同样的好奇心，想知道地平线之外有什么， / 它最初把早期波利尼西亚人带到夏威夷海岸， / 又激励今天的天文学家探索天空。 / 要求 **[xxx]** 莫纳克亚山上所有望远镜的呼声， / 或者要求禁止那里的未来发展， / 忽略了这个事实：天文学和夏威夷文化都试图回答重大问题， / 关于我们是谁、我们从哪里来、我们要到哪里去。 / 也许那就是我们探索星空的原因， / 仿佛在回应一个 **[xxx]** 的召唤， / 去认识我们自己和我们真正的 **[xxx]** 家园。","contextRaw":"","html":"<h2>29题</h2>\n<blockquote>\n<p>It can be inferred from Paragraph 5 that progress in today’s astronomy ______.<br />\n从第五段可以推知，今天的天文学进展怎样？</p>\n</blockquote>\n<p>题干用Paragraph 5指定第五段，问今天的天文学进展。先把第五段完整读下来，尤其把过去的人与今天的人分别放在句中的位置上，不先替任何一个动作补意思。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Yet science has a cultural history, too, with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens. Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a <span class=\"mask\">[xxx]</span> calling to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<p>开始精读：</p>\n<p>Yet science has a cultural history, too, / with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. / The same curiosity to find what lies beyond the horizon / that first brought early Polynesians to Hawaii’s shores / inspires astronomers today to explore the heavens. / Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea / or to ban future development there / ignore the reality that astronomy and Hawaiian culture both seek to answer big questions / about who we are, where we come from and where we are going. / Perhaps that is why we explore the starry skies, / as if answering a <span class=\"mask\">[xxx]</span> calling / to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<p>顺着英文顺序读：</p>\n<p>然而科学也有文化历史， / 根源可以追溯到文明的 <span class=\"mask\">[xxx]</span>。 / 那种同样的好奇心，想知道地平线之外有什么， / 它最初把早期波利尼西亚人带到夏威夷海岸， / 又激励今天的天文学家探索天空。 / 要求 <span class=\"mask\">[xxx]</span> 莫纳克亚山上所有望远镜的呼声， / 或者要求禁止那里的未来发展， / 忽略了这个事实：天文学和夏威夷文化都试图回答重大问题， / 关于我们是谁、我们从哪里来、我们要到哪里去。 / 也许那就是我们探索星空的原因， / 仿佛在回应一个 <span class=\"mask\">[xxx]</span> 的召唤， / 去认识我们自己和我们真正的 <span class=\"mask\">[xxx]</span> 家园。</p>\n</blockquote>\n","articleRects":[[168,1078,998,312]],"questionRects":[[188,1076,990,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. is **[xxx]** the dreams of ancient Hawaiians\n\n> 正在 **[xxx]** 古代夏威夷人的梦想\n\n把A接回题干，它说的是：今天的天文学进展，正在 **[xxx]** 古代夏威夷人的梦想。\n\nA的 `dreams of ancient Hawaiians` 涉及古人的探索愿望，第五段的 `The same curiosity` 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。\n\n> The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens.\n\n`The same curiosity` 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 `dreams of ancient Hawaiians` 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。\n\n真正没读清的是is后面的 **[xxx]**，它控制现代进展与古人梦想是什么关系。原文同一个curiosity贯穿古今，说明二者不是毫不相关，却还不能据此把A的动作词直接译出来。A先保留，因为它抓住了古今探索愿望这一连接，而不是额外谈文化传播或人的态度变化。\n\n**同一种好奇心连接古人与今天的天文学家，是否足以把A完全定下来？**\n\n还不能。古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。\n\nA有本段的古今连接作依据，暂时保留。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. is <span class=\"mask\">[xxx]</span> the dreams of ancient Hawaiians</h3>\n<blockquote>\n<p>正在 <span class=\"mask\">[xxx]</span> 古代夏威夷人的梦想</p>\n</blockquote>\n<p>把A接回题干，它说的是：今天的天文学进展，正在 <span class=\"mask\">[xxx]</span> 古代夏威夷人的梦想。</p>\n<p>A的 <code>dreams of ancient Hawaiians</code> 涉及古人的探索愿望，第五段的 <code>The same curiosity</code> 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。</p>\n<blockquote>\n<p>The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens.</p>\n</blockquote>\n<p><code>The same curiosity</code> 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 <code>dreams of ancient Hawaiians</code> 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。</p>\n<p>真正没读清的是is后面的 <span class=\"mask\">[xxx]</span>，它控制现代进展与古人梦想是什么关系。原文同一个curiosity贯穿古今，说明二者不是毫不相关，却还不能据此把A的动作词直接译出来。A先保留，因为它抓住了古今探索愿望这一连接，而不是额外谈文化传播或人的态度变化。</p>\n<p><strong>同一种好奇心连接古人与今天的天文学家，是否足以把A完全定下来？</strong></p>\n<p>还不能。古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。</p>\n<p>A有本段的古今连接作依据，暂时保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[168,1078,998,312]],"questionRects":[[188,1076,990,34],[234,1127,584,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `dreams of ancient Hawaiians` 涉及古人的探索愿望，第五段的 `The same curiosity` 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"The same curiosity","visibleOptionAnchor":"dreams of ancient Hawaiians"}}}},{"section":"29题","raw":"### B. helps spread Hawaiian culture across the world\n\n> 帮助把夏威夷文化传播到全世界\n\n把B接回题干，它说的是：今天的天文学进展，帮助把夏威夷文化传播到全世界。\n\nB的 `spread Hawaiian culture` 说传播文化，第五段的 `astronomy and Hawaiian culture both seek to answer` 则把天文学与文化并列，因此回看这个both后面到底是共同做什么。\n\n> Calls to **[xxx]** all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\n\n`astronomy and Hawaiian culture both seek to answer` 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。B的 `spread Hawaiian culture` 却把天文学设为传播者，把夏威夷文化变成被传播的对象。这不是并列关系，而是一方把另一方向外输送的关系。\n\nacross the world又增加了传播范围。原文的重大问题可以对人类很重要，但问题广泛不等于某一文化已经借天文学走向全世界。这句是在寻找两者可以对话的共同点，不能从“都在追问”推出“一个在推广另一个”。\n\n**两者都追问“我们从哪里来”，是否等于天文学把夏威夷文化传播到了世界各地？**\n\n不等于。共同追问不等于传播活动，主体与对象的关系已经不同。\n\nB加进传播动作和全球范围，原句的both关系不能支持这两步。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. helps spread Hawaiian culture across the world</h3>\n<blockquote>\n<p>帮助把夏威夷文化传播到全世界</p>\n</blockquote>\n<p>把B接回题干，它说的是：今天的天文学进展，帮助把夏威夷文化传播到全世界。</p>\n<p>B的 <code>spread Hawaiian culture</code> 说传播文化，第五段的 <code>astronomy and Hawaiian culture both seek to answer</code> 则把天文学与文化并列，因此回看这个both后面到底是共同做什么。</p>\n<blockquote>\n<p>Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.</p>\n</blockquote>\n<p><code>astronomy and Hawaiian culture both seek to answer</code> 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。B的 <code>spread Hawaiian culture</code> 却把天文学设为传播者，把夏威夷文化变成被传播的对象。这不是并列关系，而是一方把另一方向外输送的关系。</p>\n<p>across the world又增加了传播范围。原文的重大问题可以对人类很重要，但问题广泛不等于某一文化已经借天文学走向全世界。这句是在寻找两者可以对话的共同点，不能从“都在追问”推出“一个在推广另一个”。</p>\n<p><strong>两者都追问“我们从哪里来”，是否等于天文学把夏威夷文化传播到了世界各地？</strong></p>\n<p>不等于。共同追问不等于传播活动，主体与对象的关系已经不同。</p>\n<p>B加进传播动作和全球范围，原句的both关系不能支持这两步。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,1078,998,312]],"questionRects":[[188,1076,990,34],[233,1179,615,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `spread Hawaiian culture` 说传播文化，第五段的 `astronomy and Hawaiian culture both seek to answer` 则把天文学与文化并列，因此回看这个both后面到底是共同做什么。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"astronomy and Hawaiian culture both seek to answer","visibleOptionAnchor":"spread Hawaiian culture"}}}},{"section":"29题","raw":"### C. may **[xxx]** the origin of Hawaiian culture\n\n> 可能 **[xxx]** 夏威夷文化的起源\n\n把C接回题干，它说的是：今天的天文学进展，可能 **[xxx]** 夏威夷文化的起源。\n\nC的 `origin of Hawaiian culture` 谈文化的来处，第五段的 `where we come from` 也在追问来处，因此回看谁在问这个问题，以及这里的we具体指向什么。\n\n> Calls to **[xxx]** all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\n\n`where we come from` 与 `origin of Hawaiian culture` 都会让人想到起源，所以C并非看到就可以扔掉。但原文的主语是astronomy and Hawaiian culture，两者共同问“我们从哪里来”；C的对象却直接收缩到夏威夷文化本身的起源。共同追问人的来处，和研究一种文化怎样产生，并不完全相同。\n\n现在C前面是may，后面动作又是 **[xxx]**。这个动作是否能把较宽的“人的来处”与较窄的“文化起源”接上，单看本段还没有彻底说清。不能先把C补成某一种研究成果，再据此选它或删它。先留下这处具体的起源联系，与A的古今愿望联系作区分。\n\n**本段共同追问来处，能否已经排定C对“夏威夷文化起源”所作的那种动作判断？**\n\n还不能。来处的话题有联系，但C收窄了对象，关键动作也未读清，仍需判断它是否抓住本段真正推进的重点。\n\nC暂时保留，与A形成二选一；两项的疑点并不相同。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. may <span class=\"mask\">[xxx]</span> the origin of Hawaiian culture</h3>\n<blockquote>\n<p>可能 <span class=\"mask\">[xxx]</span> 夏威夷文化的起源</p>\n</blockquote>\n<p>把C接回题干，它说的是：今天的天文学进展，可能 <span class=\"mask\">[xxx]</span> 夏威夷文化的起源。</p>\n<p>C的 <code>origin of Hawaiian culture</code> 谈文化的来处，第五段的 <code>where we come from</code> 也在追问来处，因此回看谁在问这个问题，以及这里的we具体指向什么。</p>\n<blockquote>\n<p>Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.</p>\n</blockquote>\n<p><code>where we come from</code> 与 <code>origin of Hawaiian culture</code> 都会让人想到起源，所以C并非看到就可以扔掉。但原文的主语是astronomy and Hawaiian culture，两者共同问“我们从哪里来”；C的对象却直接收缩到夏威夷文化本身的起源。共同追问人的来处，和研究一种文化怎样产生，并不完全相同。</p>\n<p>现在C前面是may，后面动作又是 <span class=\"mask\">[xxx]</span>。这个动作是否能把较宽的“人的来处”与较窄的“文化起源”接上，单看本段还没有彻底说清。不能先把C补成某一种研究成果，再据此选它或删它。先留下这处具体的起源联系，与A的古今愿望联系作区分。</p>\n<p><strong>本段共同追问来处，能否已经排定C对“夏威夷文化起源”所作的那种动作判断？</strong></p>\n<p>还不能。来处的话题有联系，但C收窄了对象，关键动作也未读清，仍需判断它是否抓住本段真正推进的重点。</p>\n<p>C暂时保留，与A形成二选一；两项的疑点并不相同。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[168,1078,998,312]],"questionRects":[[188,1076,990,34],[233,1229,575,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `origin of Hawaiian culture` 谈文化的来处，第五段的 `where we come from` 也在追问来处，因此回看谁在问这个问题，以及这里的we具体指向什么。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"where we come from","visibleOptionAnchor":"origin of Hawaiian culture"}}}},{"section":"29题","raw":"### D. will eventually soften Hawaiians’ hostility\n\n> 最终将缓和夏威夷人的敌意\n\n把D接回题干，它说的是：今天的天文学进展，最终将缓和夏威夷人的敌意。\n\nD的 `soften Hawaiians’ hostility` 说当地人的态度会改变，第五段的 `Calls to` 指前面反对发展的呼声，因此回看作者回应这些呼声时，是给出共同点，还是预测反对者未来的心理变化。\n\n> Calls to **[xxx]** all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.\n\n原文从 `Calls to` 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。D的 `soften Hawaiians’ hostility` 则要求再走一步：当地人将接受这一说理，敌意也会减轻。作者说明某种反对忽略了事实，并不等于反对者已经或必将改变看法。\n\nwill eventually还把这种态度转变说成最终会出现的结果。该段没有提供反对者如何回应，也没有给出天文学进展导致敌意变化的时间过程。能用来回应反对的理由，不必然产生D所说的心理效果。\n\n**作者指出反对呼声忽略共同追问，是否就能保证当地人的敌意最终会减轻？**\n\n不能。说理的内容与受众将怎样反应之间还隔着一步，原文没有作出这种未来保证。\n\nD把作者的反驳改成对当地人未来态度的确定预测。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. will eventually soften Hawaiians’ hostility</h3>\n<blockquote>\n<p>最终将缓和夏威夷人的敌意</p>\n</blockquote>\n<p>把D接回题干，它说的是：今天的天文学进展，最终将缓和夏威夷人的敌意。</p>\n<p>D的 <code>soften Hawaiians’ hostility</code> 说当地人的态度会改变，第五段的 <code>Calls to</code> 指前面反对发展的呼声，因此回看作者回应这些呼声时，是给出共同点，还是预测反对者未来的心理变化。</p>\n<blockquote>\n<p>Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.</p>\n</blockquote>\n<p>原文从 <code>Calls to</code> 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。D的 <code>soften Hawaiians’ hostility</code> 则要求再走一步：当地人将接受这一说理，敌意也会减轻。作者说明某种反对忽略了事实，并不等于反对者已经或必将改变看法。</p>\n<p>will eventually还把这种态度转变说成最终会出现的结果。该段没有提供反对者如何回应，也没有给出天文学进展导致敌意变化的时间过程。能用来回应反对的理由，不必然产生D所说的心理效果。</p>\n<p><strong>作者指出反对呼声忽略共同追问，是否就能保证当地人的敌意最终会减轻？</strong></p>\n<p>不能。说理的内容与受众将怎样反应之间还隔着一步，原文没有作出这种未来保证。</p>\n<p>D把作者的反驳改成对当地人未来态度的确定预测。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,1078,998,312]],"questionRects":[[188,1076,990,34],[233,1280,555,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `soften Hawaiians’ hostility` 说当地人的态度会改变，第五段的 `Calls to` 指前面反对发展的呼声，因此回看作者回应这些呼声时，是给出共同点，还是预测反对者未来的心理变化。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","time","degree","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Calls to","visibleOptionAnchor":"soften Hawaiians’ hostility"}}}},{"section":"29题","raw":"### 29题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\n这一轮留下A和C，先继续做后面的题。","contextRaw":"","html":"<h3>29题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下A和C，先继续做后面的题。</p>\n","articleRects":[],"questionRects":[[188,1076,990,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.**\n\n作者对于选择莫纳克亚山作为TMT台址，持何种态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **severe criticism**\n\n严厉批评\n\nB. **full approval**\n\n完全赞同\n\nC. **passive acceptance**\n\n被动接受\n\nD. **slight hesitancy**\n\n略有犹豫","contextRaw":"","html":"<h2>30题</h2>\n<p><strong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.</strong></p>\n<p>作者对于选择莫纳克亚山作为TMT台址，持何种态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>severe criticism</strong></p>\n<p>严厉批评</p>\n<p>B. <strong>full approval</strong></p>\n<p>完全赞同</p>\n<p>C. <strong>passive acceptance</strong></p>\n<p>被动接受</p>\n<p>D. <strong>slight hesitancy</strong></p>\n<p>略有犹豫</p>\n","articleRects":[],"questionRects":[[188,1383,997,31],[234,1440,135,27]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。 | 先说过去与眼前有什么不同 |\n| 2 | 说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。 | 再说同一个地方为何被两边看重 |\n| 3 | 说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。 | 接着说明为什么有人不接受 |\n| 4 | 承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。 | 然后承认这一边有做得不好的地方 |\n| 5 | 转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。 | 再说另一边也不能这样否定 |\n| 6 | 列出改变使用方式、避免影响、退役旧设备与恢复自然状态等安排，最后明确欢迎文化传承与研究星空共存。 | 最后说怎样才能一起做下去 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>列出改变使用方式、避免影响、退役旧设备与恢复自然状态等安排，最后明确欢迎文化传承与研究星空共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[168,239,997,226],[168,478,996,233],[168,718,995,152],[168,878,997,192],[168,1078,998,312],[168,1398,998,266]],"questionRects":[[188,1383,997,31],[234,1440,135,27]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. severe criticism\n\n> 严厉批评\n\n如果A是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先以古代传统说明今天建设TMT是一种不应有的破坏。 | 先说过去与眼前有什么不同 |\n| 2 | 再强调台址的文化意义足以否定其观测价值。 | 再说同一个地方为何被两边看重 |\n| 3 | 接着支持反对者，把反对理由当作不能建设的依据。 | 接着说明为什么有人不接受 |\n| 4 | 然后集中批评天文学家，使其过错成为否定选址的理由。 | 然后承认这一边有做得不好的地方 |\n| 5 | 再说明所谓科学与文化共同点也无法为建设辩护。 | 再说另一边也不能这样否定 |\n| 6 | 最后要求放弃台址，而不再寻求同地共存。 | 最后说怎样才能一起做下去 |\n\nA要求全文最后落在严厉否定这项选址上。第三段的痛苦回忆与第四段的Some blame，确实能够让人感到作者批评了科学一方；但批评的对象是忽略当地价值的做法，不等于拒绝在这个地点建设望远镜。\n\n第五段以Yet转向：科学本身也有文化历史，同样的探索好奇心跨越古今，禁止未来发展会忽略共同问题。第六段继续列如何调整，最后用There is no reason why everyone cannot be welcomed明确欢迎双方。若是A，这两段应该继续反对或要求放弃台址，实际方向却相反。\n\n**承认天文学家负有部分责任，是否就足以把作者对选址的整体态度判成严厉批评？**\n\n不能。承认问题服务于后面的共存办法，结尾没有否定选址。A排除。","contextRaw":"","html":"<h3>A. severe criticism</h3>\n<blockquote>\n<p>严厉批评</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先以古代传统说明今天建设TMT是一种不应有的破坏。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再强调台址的文化意义足以否定其观测价值。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着支持反对者，把反对理由当作不能建设的依据。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后集中批评天文学家，使其过错成为否定选址的理由。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说明所谓科学与文化共同点也无法为建设辩护。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后要求放弃台址，而不再寻求同地共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>A要求全文最后落在严厉否定这项选址上。第三段的痛苦回忆与第四段的Some blame，确实能够让人感到作者批评了科学一方；但批评的对象是忽略当地价值的做法，不等于拒绝在这个地点建设望远镜。</p>\n<p>第五段以Yet转向：科学本身也有文化历史，同样的探索好奇心跨越古今，禁止未来发展会忽略共同问题。第六段继续列如何调整，最后用There is no reason why everyone cannot be welcomed明确欢迎双方。若是A，这两段应该继续反对或要求放弃台址，实际方向却相反。</p>\n<p><strong>承认天文学家负有部分责任，是否就足以把作者对选址的整体态度判成严厉批评？</strong></p>\n<p>不能。承认问题服务于后面的共存办法，结尾没有否定选址。A排除。</p>\n","articleRects":[[168,239,997,226],[168,478,996,233],[168,718,995,152],[168,878,997,192],[168,1078,998,312],[168,1398,998,266]],"questionRects":[[188,1383,997,31],[234,1440,135,27],[234,1485,232,26]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"### B. full approval\n\n> 完全赞同\n\n如果B是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先承认历史传统与当前冲突确实存在，引出选址争议。 | 先说过去与眼前有什么不同 |\n| 2 | 再同时说明地点的文化价值与天文优势。 | 再说同一个地方为何被两边看重 |\n| 3 | 接着认真交代反对者为何感到受伤，而非无视他们。 | 接着说明为什么有人不接受 |\n| 4 | 然后承认科学一方此前做得不好，需要尊重当地文化。 | 然后承认这一边有做得不好的地方 |\n| 5 | 再说明科学探索并不与文化根本对立，反对全面禁止。 | 再说另一边也不能这样否定 |\n| 6 | 最后列可执行的调整，明确支持两种活动在当地共存。 | 最后说怎样才能一起做下去 |\n\nB中的full approval针对题干限定的choosing Mauna Kea as the TMT site，并不是说作者赞同天文学家以前的每一种做法。因此第四段承认失误，与最终赞同选址并不矛盾。作者可以要求尊重生态与文化，同时认为这一地点仍能够承载天文研究。\n\n从六行看，第二段给出观测优势，第三、四段认真处理反对理由，第五段找科学与文化的共同追问，第六段提出减轻影响和恢复场地的安排。最后的There is no reason why everyone cannot be welcomed不是被动让步，而是明确反对把两类活动排斥在同一地方之外。\n\n**作者是否在处理反对理由之后，仍主动肯定文化传承与研究星空可以在莫纳克亚山共存？**\n\n能。结尾态度明确，前面的承认失误并未变成否决台址。B保留。","contextRaw":"","html":"<h3>B. full approval</h3>\n<blockquote>\n<p>完全赞同</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先承认历史传统与当前冲突确实存在，引出选址争议。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再同时说明地点的文化价值与天文优势。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着认真交代反对者为何感到受伤，而非无视他们。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后承认科学一方此前做得不好，需要尊重当地文化。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说明科学探索并不与文化根本对立，反对全面禁止。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后列可执行的调整，明确支持两种活动在当地共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>B中的full approval针对题干限定的choosing Mauna Kea as the TMT site，并不是说作者赞同天文学家以前的每一种做法。因此第四段承认失误，与最终赞同选址并不矛盾。作者可以要求尊重生态与文化，同时认为这一地点仍能够承载天文研究。</p>\n<p>从六行看，第二段给出观测优势，第三、四段认真处理反对理由，第五段找科学与文化的共同追问，第六段提出减轻影响和恢复场地的安排。最后的There is no reason why everyone cannot be welcomed不是被动让步，而是明确反对把两类活动排斥在同一地方之外。</p>\n<p><strong>作者是否在处理反对理由之后，仍主动肯定文化传承与研究星空可以在莫纳克亚山共存？</strong></p>\n<p>能。结尾态度明确，前面的承认失误并未变成否决台址。B保留。</p>\n","articleRects":[[168,239,997,226],[168,478,996,233],[168,718,995,152],[168,878,997,192],[168,1078,998,312],[168,1398,998,266]],"questionRects":[[188,1383,997,31],[234,1440,135,27],[234,1536,196,32]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. passive acceptance\n\n> 被动接受\n\n如果C是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先展示争议，让作者以无可奈何的口气接受现状。 | 先说过去与眼前有什么不同 |\n| 2 | 再承认地点虽有价值，但似乎只能被迫接受台址。 | 再说同一个地方为何被两边看重 |\n| 3 | 接着突出反对理由，使接受显得勉强。 | 接着说明为什么有人不接受 |\n| 4 | 然后承认科学一方问题很多，却找不到别的办法。 | 然后承认这一边有做得不好的地方 |\n| 5 | 再说明接受建设只是没有选择，而不是主动肯定科学与文化的联系。 | 再说另一边也不能这样否定 |\n| 6 | 最后消极承认建设无法改变，不积极提出共同使用的前景。 | 最后说怎样才能一起做下去 |\n\nC的passive acceptance意味着作者并不真正积极支持，只是勉强或无奈地接受。若照这个态度写，第五段就不必主动为科学的文化历史辩护，第六段也应落到“既然无法改变，只好如此”。实际作者不是只描述建设已经发生，而是认真论证两者有共同的探索根源。\n\n末段列改变使用方式、限制设备数量、退役后恢复自然等安排，说明作者在建设性地寻找共同使用的方式；最后明确说没有理由不欢迎所有人。这里的肯定来自论证与可行安排，不是来自无计可施。\n\n**列出共存理由并主动欢迎双方，是被迫接受无法改变的现实吗？**\n\n不是。C所需的无奈或消极态度没有形成，反而与作者主动说明共存可能的写法不合，排除。","contextRaw":"","html":"<h3>C. passive acceptance</h3>\n<blockquote>\n<p>被动接受</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先展示争议，让作者以无可奈何的口气接受现状。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再承认地点虽有价值，但似乎只能被迫接受台址。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着突出反对理由，使接受显得勉强。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后承认科学一方问题很多，却找不到别的办法。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说明接受建设只是没有选择，而不是主动肯定科学与文化的联系。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后消极承认建设无法改变，不积极提出共同使用的前景。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>C的passive acceptance意味着作者并不真正积极支持，只是勉强或无奈地接受。若照这个态度写，第五段就不必主动为科学的文化历史辩护，第六段也应落到“既然无法改变，只好如此”。实际作者不是只描述建设已经发生，而是认真论证两者有共同的探索根源。</p>\n<p>末段列改变使用方式、限制设备数量、退役后恢复自然等安排，说明作者在建设性地寻找共同使用的方式；最后明确说没有理由不欢迎所有人。这里的肯定来自论证与可行安排，不是来自无计可施。</p>\n<p><strong>列出共存理由并主动欢迎双方，是被迫接受无法改变的现实吗？</strong></p>\n<p>不是。C所需的无奈或消极态度没有形成，反而与作者主动说明共存可能的写法不合，排除。</p>\n","articleRects":[[168,239,997,226],[168,478,996,233],[168,718,995,152],[168,878,997,192],[168,1078,998,312],[168,1398,998,266]],"questionRects":[[188,1383,997,31],[234,1440,135,27],[234,1587,268,32]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. slight hesitancy\n\n> 略有犹豫\n\n如果D是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先摆出传统与冲突，表明作者暂时难作决定。 | 先说过去与眼前有什么不同 |\n| 2 | 再列两种价值，使赞成和反对保持未定。 | 再说同一个地方为何被两边看重 |\n| 3 | 接着交代反对理由，加深是否建设的犹豫。 | 接着说明为什么有人不接受 |\n| 4 | 然后指出科学一方的问题，但仍不确定能否弥补。 | 然后承认这一边有做得不好的地方 |\n| 5 | 再谈共同点，却继续保留是否应选此地的疑问。 | 再说另一边也不能这样否定 |\n| 6 | 最后要求再等等或再评估，不明确欢迎建设与文化共存。 | 最后说怎样才能一起做下去 |\n\nD比严厉反对轻一些，容易让人把第四段承认问题看成作者还有犹豫。但文章中间出现两面材料，并不能把结尾的态度也留在两面之间。先交代反对者、再承认科学一方有责任，是作者把问题讲完整的步骤，不必等于尚未表态。\n\n第五段已经明确批评全面禁止发展的主张，第六段继续说应怎样减少冲突，并用There is no reason why everyone cannot be welcomed收束。若仍略有犹豫，应留下“是否能够”“仍待观察”一类未定判断；实际末句没有要求等待裁决，也没有保留否决台址的姿态。\n\n**中间承认矛盾，能不能覆盖结尾已经明确给出的欢迎与共存判断？**\n\n不能。D停在论证中途，忽略结尾的肯定，排除。","contextRaw":"","html":"<h3>D. slight hesitancy</h3>\n<blockquote>\n<p>略有犹豫</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先摆出传统与冲突，表明作者暂时难作决定。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再列两种价值，使赞成和反对保持未定。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着交代反对理由，加深是否建设的犹豫。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后指出科学一方的问题，但仍不确定能否弥补。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再谈共同点，却继续保留是否应选此地的疑问。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后要求再等等或再评估，不明确欢迎建设与文化共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>D比严厉反对轻一些，容易让人把第四段承认问题看成作者还有犹豫。但文章中间出现两面材料，并不能把结尾的态度也留在两面之间。先交代反对者、再承认科学一方有责任，是作者把问题讲完整的步骤，不必等于尚未表态。</p>\n<p>第五段已经明确批评全面禁止发展的主张，第六段继续说应怎样减少冲突，并用There is no reason why everyone cannot be welcomed收束。若仍略有犹豫，应留下“是否能够”“仍待观察”一类未定判断；实际末句没有要求等待裁决，也没有保留否决台址的姿态。</p>\n<p><strong>中间承认矛盾，能不能覆盖结尾已经明确给出的欢迎与共存判断？</strong></p>\n<p>不能。D停在论证中途，忽略结尾的肯定，排除。</p>\n","articleRects":[[168,239,997,226],[168,478,996,233],[168,718,995,152],[168,878,997,192],[168,1078,998,312],[168,1398,998,266]],"questionRects":[[188,1383,997,31],[234,1440,135,27],[234,1638,230,31]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题主旨结果\n\n四项与全文的展开逐段比较后，B能够保留文章最后落实的判断。\n\n> **30题选B。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**full approval / 完全赞同**","contextRaw":"","html":"<h3>30题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，B能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>30题选B。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>full approval / 完全赞同</strong></p>\n","articleRects":[],"questionRects":[[188,1383,997,31],[234,1440,135,27],[234,1536,196,32]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","contextRaw":"","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查29题：A还是C？\n\n第一遍留下：\n\n- A. is **[xxx]** the dreams of ancient Hawaiians\n- C. may **[xxx]** the origin of Hawaiian culture\n\n主旨底牌是：\n\n> **full approval / 完全赞同**\n\n也就是：作者支持这一台址，不是因为文化必须给科学让路，而是认为两者有共同的探索根源，也可以在尊重与调整之下共存。\n\n第一遍读第五段时，A把今天的天文学与古代夏威夷人的梦想相接，C把今天的天文学与夏威夷文化起源相接。The same curiosity和where we come from分别给两项提供了联系，但两项的核心动作都没有读清，不能先把它们翻成确定说法。\n\n我们先把题干和两个选项接起来。\n\nA说现代天文进展正在 **[xxx]** 古人的梦想；C说现代天文进展可能 **[xxx]** 夏威夷文化的起源。前者问现代探索与古代愿望的关系，后者把一种文化的起源设为现代天文学的对象。这两种连接并不相同。\n\n现在拿主旨来检查。\n\n先看A。全文需要回应的是：科学研究能否与当地文化在同一地点共存。原文第五段用同一个curiosity作主语，先接古人远行，再接今天的天文学家探索天空，正是要说明两边并非根本对立。A把现代天文与古人愿望联系起来，可以顺着这个共同追问的方向读；它没有要求全文改成对夏威夷文化起源的专题研究。\n\n再看C。where we come from的主语是天文学和夏威夷文化共同面对的“我们”，不是只有“夏威夷文化从哪里产生”。将一种文化本身的起源当成天文学进展的对象，会把全文的共存论证缩成一个具体研究成果。实际末段继续讨论如何同地使用、保护环境与传承文化，也没有接着说明天文学怎样研究该文化的产生。\n\n主旨加入后，A所保留的古今探索联系能够贯通这一段的作用，C的起源联系则把共同追问的主体与对象错置了。我们据此选择A，仍不把A与C各自的 **[xxx]** 擅自写成具体英文或中文动词。\n\n> **29题选A。**","contextRaw":"","html":"<h2>回查29题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. is <span class=\"mask\">[xxx]</span> the dreams of ancient Hawaiians</li>\n<li>C. may <span class=\"mask\">[xxx]</span> the origin of Hawaiian culture</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>full approval / 完全赞同</strong></p>\n</blockquote>\n<p>也就是：作者支持这一台址，不是因为文化必须给科学让路，而是认为两者有共同的探索根源，也可以在尊重与调整之下共存。</p>\n<p>第一遍读第五段时，A把今天的天文学与古代夏威夷人的梦想相接，C把今天的天文学与夏威夷文化起源相接。The same curiosity和where we come from分别给两项提供了联系，但两项的核心动作都没有读清，不能先把它们翻成确定说法。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A说现代天文进展正在 <span class=\"mask\">[xxx]</span> 古人的梦想；C说现代天文进展可能 <span class=\"mask\">[xxx]</span> 夏威夷文化的起源。前者问现代探索与古代愿望的关系，后者把一种文化的起源设为现代天文学的对象。这两种连接并不相同。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。全文需要回应的是：科学研究能否与当地文化在同一地点共存。原文第五段用同一个curiosity作主语，先接古人远行，再接今天的天文学家探索天空，正是要说明两边并非根本对立。A把现代天文与古人愿望联系起来，可以顺着这个共同追问的方向读；它没有要求全文改成对夏威夷文化起源的专题研究。</p>\n<p>再看C。where we come from的主语是天文学和夏威夷文化共同面对的“我们”，不是只有“夏威夷文化从哪里产生”。将一种文化本身的起源当成天文学进展的对象，会把全文的共存论证缩成一个具体研究成果。实际末段继续讨论如何同
