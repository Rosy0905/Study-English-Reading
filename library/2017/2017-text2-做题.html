<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"### 26. Queen Liliuokalani’s remark in Paragraph 1 indicates ______.\n\n女王在第一段的话表明了什么？\n\n这一题问：例子作用题。","contextRaw":"","html":"<h3>26. Queen Liliuokalani’s remark in Paragraph 1 indicates ______.</h3>\n<p>女王在第一段的话表明了什么？</p>\n<p>这一题问：例子作用题。</p>\n","articleRects":[],"questionRects":[[188,158,803,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"### 27. Mauna Kea is deemed as an ideal astronomical site due to ______.\n\n莫纳克亚山被认为是理想的天文观测地点，原因是什么？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>27. Mauna Kea is deemed as an ideal astronomical site due to ______.</h3>\n<p>莫纳克亚山被认为是理想的天文观测地点，原因是什么？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,464,868,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"### 28. The construction of the TMT is opposed by some locals partly because ______.\n\n一些当地人反对TMT建设，部分原因是什么？\n\n这一题问：细节题。","contextRaw":"","html":"<h3>28. The construction of the TMT is opposed by some locals partly because ______.</h3>\n<p>一些当地人反对TMT建设，部分原因是什么？</p>\n<p>这一题问：细节题。</p>\n","articleRects":[],"questionRects":[[188,770,990,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"### 29. It can be inferred from Paragraph 5 that progress in today’s astronomy ______.\n\n从第五段可以推知，今天的天文学进展怎样？\n\n这一题问：推断题。","contextRaw":"","html":"<h3>29. It can be inferred from Paragraph 5 that progress in today’s astronomy ______.</h3>\n<p>从第五段可以推知，今天的天文学进展怎样？</p>\n<p>这一题问：推断题。</p>\n","articleRects":[],"questionRects":[[188,1076,990,34]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"### 30. The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.\n\n作者对于选择莫纳克亚山作为TMT台址，持何种态度？\n\n这一题问：全文作者观点 / 全文主旨题。","contextRaw":"","html":"<h3>30. The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.</h3>\n<p>作者对于选择莫纳克亚山作为TMT台址，持何种态度？</p>\n<p>这一题问：全文作者观点 / 全文主旨题。</p>\n","articleRects":[],"questionRects":[[188,1383,997,31],[234,1440,135,27]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Sadly, But, Yet, too |\n| 态度词 / 评价词 | 先抓个大概好坏 | not well, painful, fragile, no reason |\n| 动作词 | 先看谁做了什么 | connects, inspires, seek, avoid |\n| 结果词 | 看最后出了什么事 | protests, clarity, renaissance, natural state |\n| 重复主题词 | 大概知道老在说什么 | astronomy, Hawaiian culture, Mauna Kea, TMT |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>Sadly, But, Yet, too</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>not well, painful, fragile, no reason</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>connects, inspires, seek, avoid</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>protests, clarity, renaissance, natural state</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>astronomy, Hawaiian culture, Mauna Kea, TMT</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most **[xxx]** members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have **[xxx]** over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n</div></div>","articleRects":[[168,239,997,226]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":0,"form":0}},{"section":"读文章","raw":"“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. / Star watchers were among the most **[xxx]** members of Hawaiian society. / Sadly, all is not well with astronomy in Hawaii today. / Protests have **[xxx]** over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. / Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. ；后面又有科学也有文化历史、星空、自然状态、文化遗产、研究星辰。</p>\n<p>到这里还不能自然地说清楚：古代观星与今天建设是什么关系、为什么有人反对、科学和当地文化怎样联系、结尾的调整究竟回应了什么。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> Queen Liliuokalani’s remark in Paragraph 1 indicates ______.  \n> 女王在第一段的话表明了什么？\n\n题干的Paragraph 1直接指定第一段，并问女王那句话indicates什么。完整读这一段，把引语谈论的时间、女王写话的时间和作者接下来的today区分开。\n\n> 原文参考：\n>\n> “The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most **[xxx]** members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have **[xxx]** over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.\n>\n> 开始精读：\n>\n> “The ancient Hawaiians were astronomers,” / wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. / Star watchers were among the most **[xxx]** members of Hawaiian society. / Sadly, all is not well with astronomy in Hawaii today. / Protests have **[xxx]** over construction of the Thirty Meter Telescope (TMT), / a giant observatory that promises to revolutionize humanity’s view of the cosmos.\n>\n> 顺着英文顺序读：\n>\n> “古代夏威夷人是天文学家”， / 利留卡拉尼女王，夏威夷最后一位在位君主，在1897年这样写道。 / 观星者是夏威夷社会中最 **[xxx]** 的成员之一。 / 遗憾的是，今天夏威夷的天文学并非一切顺利。 / 抗议已经因为三十米望远镜（TMT）的建设而 **[xxx]**， / 一座巨型天文台，有望彻底改变人类对宇宙的认识。","contextRaw":"","html":"<h2>26题</h2>\n<blockquote>\n<p>Queen Liliuokalani’s remark in Paragraph 1 indicates ______.<br />\n女王在第一段的话表明了什么？</p>\n</blockquote>\n<p>题干的Paragraph 1直接指定第一段，并问女王那句话indicates什么。完整读这一段，把引语谈论的时间、女王写话的时间和作者接下来的today区分开。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n<p>开始精读：</p>\n<p>“The ancient Hawaiians were astronomers,” / wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. / Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. / Sadly, all is not well with astronomy in Hawaii today. / Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), / a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n<p>顺着英文顺序读：</p>\n<p>“古代夏威夷人是天文学家”， / 利留卡拉尼女王，夏威夷最后一位在位君主，在1897年这样写道。 / 观星者是夏威夷社会中最 <span class=\"mask\">[xxx]</span> 的成员之一。 / 遗憾的是，今天夏威夷的天文学并非一切顺利。 / 抗议已经因为三十米望远镜（TMT）的建设而 <span class=\"mask\">[xxx]</span>， / 一座巨型天文台，有望彻底改变人类对宇宙的认识。</p>\n</blockquote>\n","articleRects":[[168,239,997,226]],"questionRects":[[188,158,803,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. the importance of astronomy in ancient Hawaiian society\n\n> 天文学在古代夏威夷社会中的重要性\n\n把A接回题干，它说的是：女王在第一段的话表明，天文学在古代夏威夷社会中有重要地位。\n\nA的 `ancient Hawaiian society` 与女王说的 `The ancient Hawaiians were astronomers` 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。\n\n> “The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most **[xxx]** members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today.\n\n`The ancient Hawaiians were astronomers` 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。A的 `ancient Hawaiian society` 保留了这个时间和社会范围。第二句接着专门写观星者在社会成员中的位置，虽然评价词 **[xxx]** 没读清，但话题仍是观星与当时社会的关系。\n\n再看Sadly和today：作者转到今天的天文学不顺利时表示遗憾，是拿现在与前面那段传统作对照。A没有把女王的1897年写作日期当成引语谈论的年代，也没有凭一个人物的话增加具体观测成就。它概括的是原段确实建立的社会地位。\n\n**引语把古代夏威夷人直接称为天文学家，随后又拿今天的不顺与过去对照，能否支持A所说的历史重要性？**\n\n能。引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。\n\nA既保留古代这一时间限定，也保留天文学与当地社会的联系。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. the importance of astronomy in ancient Hawaiian society</h3>\n<blockquote>\n<p>天文学在古代夏威夷社会中的重要性</p>\n</blockquote>\n<p>把A接回题干，它说的是：女王在第一段的话表明，天文学在古代夏威夷社会中有重要地位。</p>\n<p>A的 <code>ancient Hawaiian society</code> 与女王说的 <code>The ancient Hawaiians were astronomers</code> 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。</p>\n<blockquote>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today.</p>\n</blockquote>\n<p><code>The ancient Hawaiians were astronomers</code> 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。A的 <code>ancient Hawaiian society</code> 保留了这个时间和社会范围。第二句接着专门写观星者在社会成员中的位置，虽然评价词 <span class=\"mask\">[xxx]</span> 没读清，但话题仍是观星与当时社会的关系。</p>\n<p>再看Sadly和today：作者转到今天的天文学不顺利时表示遗憾，是拿现在与前面那段传统作对照。A没有把女王的1897年写作日期当成引语谈论的年代，也没有凭一个人物的话增加具体观测成就。它概括的是原段确实建立的社会地位。</p>\n<p><strong>引语把古代夏威夷人直接称为天文学家，随后又拿今天的不顺与过去对照，能否支持A所说的历史重要性？</strong></p>\n<p>能。引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。</p>\n<p>A既保留古代这一时间限定，也保留天文学与当地社会的联系。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[168,239,997,226]],"questionRects":[[188,158,803,34],[233,209,737,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `ancient Hawaiian society` 与女王说的 `The ancient Hawaiians were astronomers` 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"The ancient Hawaiians were astronomers","visibleOptionAnchor":"ancient Hawaiian society"}}}},{"section":"26题","raw":"### B. her conservative view on the historical role of astronomy\n\n> 她对天文学历史作用的保守看法\n\n把B接回题干，它说的是：女王在第一段的话表明，她对于天文学的历史作用持保守看法。\n\nB的 `her conservative view` 是对女王立场的评价，原文的 `The ancient Hawaiians were astronomers` 则是她被引用的具体话，所以回看这句，比较她是在描述过去，还是评价应该怎样对待天文学。\n\n> “The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897.\n\n`The ancient Hawaiians were astronomers` 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。B的 `her conservative view` 却先给女王扣上保守立场，再把天文学的历史作用装进这一立场。提到古代不等于保守，描述传统也不等于拒绝发展。\n\nHawaii’s last reigning monarch介绍的是她的身份，1897介绍写作时间；这两处都不能代替她话里的态度。后面的Sadly属于作者从过去转向今天时的表述，也不能拿来当女王在引语中的保守判断。这里把谁说的话、话在讲什么和谁的态度分开，B就接不上了。\n\n**一个人说“古代夏威夷人是天文学家”，是否已经表明她对天文学持保守立场？**\n\n不能。引语给出历史描述，conservative需要的是额外的立场判断，两者不是一回事。\n\nB把引语的历史内容改成了女王的个人态度，而该态度没有在话中表达。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. her conservative view on the historical role of astronomy</h3>\n<blockquote>\n<p>她对天文学历史作用的保守看法</p>\n</blockquote>\n<p>把B接回题干，它说的是：女王在第一段的话表明，她对于天文学的历史作用持保守看法。</p>\n<p>B的 <code>her conservative view</code> 是对女王立场的评价，原文的 <code>The ancient Hawaiians were astronomers</code> 则是她被引用的具体话，所以回看这句，比较她是在描述过去，还是评价应该怎样对待天文学。</p>\n<blockquote>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897.</p>\n</blockquote>\n<p><code>The ancient Hawaiians were astronomers</code> 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。B的 <code>her conservative view</code> 却先给女王扣上保守立场，再把天文学的历史作用装进这一立场。提到古代不等于保守，描述传统也不等于拒绝发展。</p>\n<p>Hawaii’s last reigning monarch介绍的是她的身份，1897介绍写作时间；这两处都不能代替她话里的态度。后面的Sadly属于作者从过去转向今天时的表述，也不能拿来当女王在引语中的保守判断。这里把谁说的话、话在讲什么和谁的态度分开，B就接不上了。</p>\n<p><strong>一个人说“古代夏威夷人是天文学家”，是否已经表明她对天文学持保守立场？</strong></p>\n<p>不能。引语给出历史描述，conservative需要的是额外的立场判断，两者不是一回事。</p>\n<p>B把引语的历史内容改成了女王的个人态度，而该态度没有在话中表达。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,239,997,226]],"questionRects":[[188,158,803,34],[233,260,737,26]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `her conservative view` 是对女王立场的评价，原文的 `The ancient Hawaiians were astronomers` 则是她被引用的具体话，所以回看这句，比较她是在描述过去，还是评价应该怎样对待天文学。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"The ancient Hawaiians were astronomers","visibleOptionAnchor":"her conservative view"}}}},{"section":"26题","raw":"### C. the regrettable decline of astronomy in ancient times\n\n> 天文学在古代令人遗憾的衰落\n\n把C接回题干，它说的是：女王在第一段的话表明，天文学在古代经历了令人遗憾的衰落。\n\nC的 `in ancient times` 把不好的变化放在古代，而第一段的 `in Hawaii today` 明确标出作者谈到不顺利时的时间；因此回看Sadly开头的这一句，再与女王引语比较。\n\n> Sadly, all is not well with astronomy in Hawaii today. Protests have **[xxx]** over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.\n\n原文的 `in Hawaii today` 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。C用 `in ancient times` 把它挪到了古代，还写成天文学的decline。女王讲古代人是天文学家，并没有给出古代由盛转衰的过程。\n\nSadly也不能单独搬走。它评价的是后面这整句当下情况，不是离它更远的所有历史内容。作者是先说过去的天文学传统，再说今天的争议；C把“过去”和“今天”两块材料拼反，得到了一段原文没有说的古代衰落史。\n\n**原文的Sadly所评价的是古代衰落，还是今天夏威夷天文学遇到的不顺？**\n\n后者。today已经把时间说清楚，抗议建设的事情也发生在这个当下语境中。\n\nC把今天的困难移到古代，时间与事件内容都发生了变化。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. the regrettable decline of astronomy in ancient times</h3>\n<blockquote>\n<p>天文学在古代令人遗憾的衰落</p>\n</blockquote>\n<p>把C接回题干，它说的是：女王在第一段的话表明，天文学在古代经历了令人遗憾的衰落。</p>\n<p>C的 <code>in ancient times</code> 把不好的变化放在古代，而第一段的 <code>in Hawaii today</code> 明确标出作者谈到不顺利时的时间；因此回看Sadly开头的这一句，再与女王引语比较。</p>\n<blockquote>\n<p>Sadly, all is not well with astronomy in Hawaii today. Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n</blockquote>\n<p>原文的 <code>in Hawaii today</code> 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。C用 <code>in ancient times</code> 把它挪到了古代，还写成天文学的decline。女王讲古代人是天文学家，并没有给出古代由盛转衰的过程。</p>\n<p>Sadly也不能单独搬走。它评价的是后面这整句当下情况，不是离它更远的所有历史内容。作者是先说过去的天文学传统，再说今天的争议；C把“过去”和“今天”两块材料拼反，得到了一段原文没有说的古代衰落史。</p>\n<p><strong>原文的Sadly所评价的是古代衰落，还是今天夏威夷天文学遇到的不顺？</strong></p>\n<p>后者。today已经把时间说清楚，抗议建设的事情也发生在这个当下语境中。</p>\n<p>C把今天的困难移到古代，时间与事件内容都发生了变化。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[168,239,997,226]],"questionRects":[[188,158,803,34],[233,311,682,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `in ancient times` 把不好的变化放在古代，而第一段的 `in Hawaii today` 明确标出作者谈到不顺利时的时间；因此回看Sadly开头的这一句，再与女王引语比较。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"in Hawaii today","visibleOptionAnchor":"in ancient times"}}}},{"section":"26题","raw":"### D. her appreciation of star watchers’ **[xxx]** in her time\n\n> 她对自己所处时代观星者的 **[xxx]** 的欣赏\n\n把D接回题干，它说的是：女王在第一段的话表明，她欣赏自己所处时代观星者的 **[xxx]**。\n\nD的 `in her time` 指女王所处的时代，原文的 `The ancient Hawaiians` 却是引语明说的对象；因此回看引语与1897的摆放位置，区分写下话的时间和话里谈论的时间。\n\n> “The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897.\n\n`in her time` 与 `The ancient Hawaiians` 不是同一个时间范围。1897放在wrote后面，说明女王何时写下这句话；ancient放在Hawaiians前面，限定她谈到的是古代夏威夷人。一个人在1897年写古人，并不会让古人变成她同时代的人。\n\nD中间的 **[xxx]** 不清楚，但这不妨碍先判断清楚时间限定。即使它涉及观星者的某种表现，D仍要求这些观星者属于her time，而引语实际指向ancient。不能因为引语作者是一位女王，就把她所说的一切都缩到她在位时期。\n\n**1897是女王写下这句话的时间，能不能据此把ancient Hawaiians改成她同时代的观星者？**\n\n不能。写作日期与叙述对象的年代是两回事，原文还特意用ancient限定了对象。\n\nD已有的时间限定不合，不必给 **[xxx]** 补入具体意思才能发现这处差别。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. her appreciation of star watchers’ <span class=\"mask\">[xxx]</span> in her time</h3>\n<blockquote>\n<p>她对自己所处时代观星者的 <span class=\"mask\">[xxx]</span> 的欣赏</p>\n</blockquote>\n<p>把D接回题干，它说的是：女王在第一段的话表明，她欣赏自己所处时代观星者的 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的 <code>in her time</code> 指女王所处的时代，原文的 <code>The ancient Hawaiians</code> 却是引语明说的对象；因此回看引语与1897的摆放位置，区分写下话的时间和话里谈论的时间。</p>\n<blockquote>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897.</p>\n</blockquote>\n<p><code>in her time</code> 与 <code>The ancient Hawaiians</code> 不是同一个时间范围。1897放在wrote后面，说明女王何时写下这句话；ancient放在Hawaiians前面，限定她谈到的是古代夏威夷人。一个人在1897年写古人，并不会让古人变成她同时代的人。</p>\n<p>D中间的 <span class=\"mask\">[xxx]</span> 不清楚，但这不妨碍先判断清楚时间限定。即使它涉及观星者的某种表现，D仍要求这些观星者属于her time，而引语实际指向ancient。不能因为引语作者是一位女王，就把她所说的一切都缩到她在位时期。</p>\n<p><strong>1897是女王写下这句话的时间，能不能据此把ancient Hawaiians改成她同时代的观星者？</strong></p>\n<p>不能。写作日期与叙述对象的年代是两回事，原文还特意用ancient限定了对象。</p>\n<p>D已有的时间限定不合，不必给 <span class=\"mask\">[xxx]</span> 补入具体意思才能发现这处差别。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,239,997,226]],"questionRects":[[188,158,803,34],[233,362,659,33]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `in her time` 指女王所处的时代，原文的 `The ancient Hawaiians` 却是引语明说的对象；因此回看引语与1897的摆放位置，区分写下话的时间和话里谈论的时间。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"The ancient Hawaiians","visibleOptionAnchor":"in her time"}}}},{"section":"26题","raw":"### 26题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n> **26题选A。**","contextRaw":"","html":"<h3>26题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>26题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,158,803,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> Mauna Kea is deemed as an ideal astronomical site due to ______.  \n> 莫纳克亚山被认为是理想的天文观测地点，原因是什么？\n\n题干直接给出Mauna Kea，第二段集中出现这个地名。due to问它适合天文观测的原因，先完整读第二段，看看同一个地点被介绍了哪些方面。\n\n> 原文参考：\n>\n> At issue is the TMT’s planned location on Mauna Kea, a **[xxx]** volcano **[xxx]** by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the **[xxx]** of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\n>\n> 开始精读：\n>\n> At issue is the TMT’s planned location on Mauna Kea, / a **[xxx]** volcano **[xxx]** by some Hawaiians as the piko, / that connects the Hawaiian Islands to the heavens. / But Mauna Kea is also home to some of the world’s most powerful telescopes. / Rested in the Pacific Ocean, / Mauna Kea’s peak rises above the **[xxx]** of our planet’s dense atmosphere, / where conditions allow telescopes to obtain images of unsurpassed clarity.\n>\n> 顺着英文顺序读：\n>\n> 有争议的是三十米望远镜计划在莫纳克亚山上的位置， / 一座 **[xxx]** 火山，被一些夏威夷人作为piko来 **[xxx]**， / 它把夏威夷群岛与天空联系起来。 / 但莫纳克亚山也是世界上一些最强大的望远镜的所在地。 / 坐落在太平洋中， / 莫纳克亚山的山峰高出我们星球浓密大气的 **[xxx]**， / 那里的条件让望远镜能够获得清晰度无与伦比的图像。","contextRaw":"","html":"<h2>27题</h2>\n<blockquote>\n<p>Mauna Kea is deemed as an ideal astronomical site due to ______.<br />\n莫纳克亚山被认为是理想的天文观测地点，原因是什么？</p>\n</blockquote>\n<p>题干直接给出Mauna Kea，第二段集中出现这个地名。due to问它适合天文观测的原因，先完整读第二段，看看同一个地点被介绍了哪些方面。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>At issue is the TMT’s planned location on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n<p>开始精读：</p>\n<p>At issue is the TMT’s planned location on Mauna Kea, / a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, / that connects the Hawaiian Islands to the heavens. / But Mauna Kea is also home to some of the world’s most powerful telescopes. / Rested in the Pacific Ocean, / Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, / where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n<p>顺着英文顺序读：</p>\n<p>有争议的是三十米望远镜计划在莫纳克亚山上的位置， / 一座 <span class=\"mask\">[xxx]</span> 火山，被一些夏威夷人作为piko来 <span class=\"mask\">[xxx]</span>， / 它把夏威夷群岛与天空联系起来。 / 但莫纳克亚山也是世界上一些最强大的望远镜的所在地。 / 坐落在太平洋中， / 莫纳克亚山的山峰高出我们星球浓密大气的 <span class=\"mask\">[xxx]</span>， / 那里的条件让望远镜能够获得清晰度无与伦比的图像。</p>\n</blockquote>\n","articleRects":[[168,478,996,233]],"questionRects":[[188,464,868,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. its religious implications\n\n> 它的宗教意味\n\n把A接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它的宗教意味。\n\nA的 `religious implications` 与第二段的 `connects the Hawaiian Islands to the heavens` 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。\n\n> At issue is the TMT’s planned location on Mauna Kea, a **[xxx]** volcano **[xxx]** by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes.\n\n`connects the Hawaiian Islands to the heavens` 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。A的 `religious implications` 可以联系这部分，但题干问的是为什么它是ideal astronomical site，不是为什么这块地方对当地人特殊。\n\nBut后面另转到天文观测：先说已经有强大望远镜，再说山峰高出浓密大气的一部分，能够获得清晰图像。原文将文化意义与观测条件并列在同一地点上，A却把前一种意义改成后一种用途的原因。词都在同一段，不等于它们承担同一种解释任务。\n\n**当地人赋予这座山的特殊意义，是否就是作者解释望远镜为什么能看得清楚的原因？**\n\n不是。观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。\n\nA拿文化意义回答观测条件，因果所接的对象不对。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. its religious implications</h3>\n<blockquote>\n<p>它的宗教意味</p>\n</blockquote>\n<p>把A接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它的宗教意味。</p>\n<p>A的 <code>religious implications</code> 与第二段的 <code>connects the Hawaiian Islands to the heavens</code> 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。</p>\n<blockquote>\n<p>At issue is the TMT’s planned location on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes.</p>\n</blockquote>\n<p><code>connects the Hawaiian Islands to the heavens</code> 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。A的 <code>religious implications</code> 可以联系这部分，但题干问的是为什么它是ideal astronomical site，不是为什么这块地方对当地人特殊。</p>\n<p>But后面另转到天文观测：先说已经有强大望远镜，再说山峰高出浓密大气的一部分，能够获得清晰图像。原文将文化意义与观测条件并列在同一地点上，A却把前一种意义改成后一种用途的原因。词都在同一段，不等于它们承担同一种解释任务。</p>\n<p><strong>当地人赋予这座山的特殊意义，是否就是作者解释望远镜为什么能看得清楚的原因？</strong></p>\n<p>不是。观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。</p>\n<p>A拿文化意义回答观测条件，因果所接的对象不对。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,478,996,233]],"questionRects":[[188,464,868,34],[233,515,340,33]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `religious implications` 与第二段的 `connects the Hawaiian Islands to the heavens` 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"connects the Hawaiian Islands to the heavens","visibleOptionAnchor":"religious implications"}}}},{"section":"27题","raw":"### B. its protective surroundings\n\n> 它具有保护作用的周边环境\n\n把B接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为周边环境对它有保护作用。\n\nB的 `protective surroundings` 讲周边保护，原文的 `peak rises above` 讲山峰与大气的高低关系；两者都可能让人想到自然环境，所以回看这个位置关系怎样接出图像清晰度。\n\n> Rested in the Pacific Ocean, Mauna Kea’s peak rises above the **[xxx]** of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\n\n`peak rises above` 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。B的 `protective surroundings` 却要求周边事物起遮挡、护卫或保护作用，原文没有建立“周围保护它，所以观测好”的关系。\n\n太平洋只是所处地点，不能单凭位于海中就推出周围环境正在保护望远镜。这里的关键动作是rises above，讨论的是高低位置；protective讨论的却是环境对对象施加的保护功能。把同样属于“环境”的两个意思混在一起，会丢掉原文明确写出的原因。\n\n**山峰高出浓密大气中的某部分，是否等于周围环境在为望远镜提供保护？**\n\n不等于。一个是观测点的位置条件，一个是保护作用，原文实际说明的是前者。\n\nB把自然位置换成环境保护功能，不能准确接上清晰成像的解释。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. its protective surroundings</h3>\n<blockquote>\n<p>它具有保护作用的周边环境</p>\n</blockquote>\n<p>把B接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为周边环境对它有保护作用。</p>\n<p>B的 <code>protective surroundings</code> 讲周边保护，原文的 <code>peak rises above</code> 讲山峰与大气的高低关系；两者都可能让人想到自然环境，所以回看这个位置关系怎样接出图像清晰度。</p>\n<blockquote>\n<p>Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n</blockquote>\n<p><code>peak rises above</code> 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。B的 <code>protective surroundings</code> 却要求周边事物起遮挡、护卫或保护作用，原文没有建立“周围保护它，所以观测好”的关系。</p>\n<p>太平洋只是所处地点，不能单凭位于海中就推出周围环境正在保护望远镜。这里的关键动作是rises above，讨论的是高低位置；protective讨论的却是环境对对象施加的保护功能。把同样属于“环境”的两个意思混在一起，会丢掉原文明确写出的原因。</p>\n<p><strong>山峰高出浓密大气中的某部分，是否等于周围环境在为望远镜提供保护？</strong></p>\n<p>不等于。一个是观测点的位置条件，一个是保护作用，原文实际说明的是前者。</p>\n<p>B把自然位置换成环境保护功能，不能准确接上清晰成像的解释。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,478,996,233]],"questionRects":[[188,464,868,34],[233,567,361,31]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `protective surroundings` 讲周边保护，原文的 `peak rises above` 讲山峰与大气的高低关系；两者都可能让人想到自然环境，所以回看这个位置关系怎样接出图像清晰度。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"peak rises above","visibleOptionAnchor":"protective surroundings"}}}},{"section":"27题","raw":"### C. its **[xxx]** features\n\n> 它的 **[xxx]** 特征\n\n把C接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它的 **[xxx]** 特征。\n\nC的 `its` 指莫纳克亚山本身，第二段的 `Mauna Kea’s peak` 同样在介绍这座山；因此回看山峰、大气与成像效果所在的一句，确认它的特征是否被拿来解释观测优势。\n\n> Rested in the Pacific Ocean, Mauna Kea’s peak rises above the **[xxx]** of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\n\nC中 `its` 所指的对象与 `Mauna Kea’s peak` 一致，随后features让我们去看这座山具有怎样的特点。原文给出所在海域、山峰高于浓密大气中某部分的关系，又由where conditions直接接到清晰图像，确实是在以场地自身的条件解释观测优势。\n\nC的形容词 **[xxx]** 还不能逐字读出，但其余部分没有另换成宗教价值、周围保护或已有设备。对照已经读到的原因，山峰自身的这一组特征是本段实际展开的说明。不能为了译出一个完整中文词组，就把形容词补出来；保留C依据的是这段明确给出的对象与解释。\n\n**本段是否把这座山自身的条件，与望远镜获得清晰图像直接接在一起？**\n\n能。where conditions所接的正是前面山峰与大气的位置描述，后面给出成像结果。\n\nC保留；它概括场地特征这一对象，没有像另外几项那样换掉原文的原因。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. its <span class=\"mask\">[xxx]</span> features</h3>\n<blockquote>\n<p>它的 <span class=\"mask\">[xxx]</span> 特征</p>\n</blockquote>\n<p>把C接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它的 <span class=\"mask\">[xxx]</span> 特征。</p>\n<p>C的 <code>its</code> 指莫纳克亚山本身，第二段的 <code>Mauna Kea’s peak</code> 同样在介绍这座山；因此回看山峰、大气与成像效果所在的一句，确认它的特征是否被拿来解释观测优势。</p>\n<blockquote>\n<p>Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n</blockquote>\n<p>C中 <code>its</code> 所指的对象与 <code>Mauna Kea’s peak</code> 一致，随后features让我们去看这座山具有怎样的特点。原文给出所在海域、山峰高于浓密大气中某部分的关系，又由where conditions直接接到清晰图像，确实是在以场地自身的条件解释观测优势。</p>\n<p>C的形容词 <span class=\"mask\">[xxx]</span> 还不能逐字读出，但其余部分没有另换成宗教价值、周围保护或已有设备。对照已经读到的原因，山峰自身的这一组特征是本段实际展开的说明。不能为了译出一个完整中文词组，就把形容词补出来；保留C依据的是这段明确给出的对象与解释。</p>\n<p><strong>本段是否把这座山自身的条件，与望远镜获得清晰图像直接接在一起？</strong></p>\n<p>能。where conditions所接的正是前面山峰与大气的位置描述，后面给出成像结果。</p>\n<p>C保留；它概括场地特征这一对象，没有像另外几项那样换掉原文的原因。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[168,478,996,233]],"questionRects":[[188,464,868,34],[233,617,335,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 `its` 指莫纳克亚山本身，第二段的 `Mauna Kea’s peak` 同样在介绍这座山；因此回看山峰、大气与成像效果所在的一句，确认它的特征是否被拿来解释观测优势。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"Mauna Kea’s peak","visibleOptionAnchor":"its"}}}},{"section":"27题","raw":"### D. its existing infrastructure\n\n> 它现有的基础设施\n\n把D接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它已有的基础设施。\n\nD的 `existing infrastructure` 容易让人想到第二段的 `home to some of the world’s most powerful telescopes`，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。\n\n> But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the **[xxx]** of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.\n\n`home to some of the world’s most powerful telescopes` 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 `existing infrastructure` 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。\n\n已有设备可以表明人们已选择这个地方，但题干due to要的是适合的缘由。原文给的缘由是山峰、大气和由此获得的清晰图像，并没有说依靠现成的道路、建筑或仪器配套使地点变得理想。不能用“有人已经在那里建了”替代“为什么适合在那里建”。\n\n**一处地方已经有强大望远镜，能不能替代下一句给出的山峰和大气条件，成为题干要的原因？**\n\n不能。已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。\n\nD把设备存在这一现状改成选址优势的原因。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. its existing infrastructure</h3>\n<blockquote>\n<p>它现有的基础设施</p>\n</blockquote>\n<p>把D接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它已有的基础设施。</p>\n<p>D的 <code>existing infrastructure</code> 容易让人想到第二段的 <code>home to some of the world’s most powerful telescopes</code>，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。</p>\n<blockquote>\n<p>But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n</blockquote>\n<p><code>home to some of the world’s most powerful telescopes</code> 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 <code>existing infrastructure</code> 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。</p>\n<p>已有设备可以表明人们已选择这个地方，但题干due to要的是适合的缘由。原文给的缘由是山峰、大气和由此获得的清晰图像，并没有说依靠现成的道路、建筑或仪器配套使地点变得理想。不能用“有人已经在那里建了”替代“为什么适合在那里建”。</p>\n<p><strong>一处地方已经有强大望远镜，能不能替代下一句给出的山峰和大气条件，成为题干要的原因？</strong></p>\n<p>不能。已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。</p>\n<p>D把设备存在这一现状改成选址优势的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[168,478,996,233]],"questionRects":[[188,464,868,34],[233,668,343,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 `existing infrastructure` 容易让人想到第二段的 `home to some of the world’s most powerful telescopes`，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"home to some of the world’s most powerful telescopes","visibleOptionAnchor":"existing infrastructure"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n> **27题选C。**","contextRaw":"","html":"<h3>27题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>27题选C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[188,464,868,34]],"scrollTarget":"auto","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> The construction of the TMT is opposed by some locals partly because ______.  \n> 一些当地人反对TMT建设，部分原因是什么？\n\n题干直接给出TMT，并问当地人反对的原因。第二段开头有TMT的台址，刚才已经整段读过；相邻第三段接着出现Opposition和当地人，因此还需要把第三段完整读下来，才能查看反对者自己的理由。\n\n> 原文参考：\n>\n> Opposition to telescopes on Mauna Kea is nothing new. A small but **[xxx]** group of Hawaiians and environmentalists have long viewed their presence as **[xxx]** for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\n>\n> 开始精读：\n>\n> Opposition to telescopes on Mauna Kea is nothing new. / A small but **[xxx]** group of Hawaiians and environmentalists / have long viewed their presence as **[xxx]** for sacred land / and a painful reminder of the occupation / of what was once a sovereign nation.\n>\n> 顺着英文顺序读：\n>\n> 反对莫纳克亚山上的望远镜并不是什么新事。 / 一小群但 **[xxx]** 的夏威夷人和环保人士 / 长期以来把它们的存在看作对神圣土地的 **[xxx]** / 和一个令人痛苦的提醒，提醒那次占领， / 对一个曾经是主权国家的地方的占领。","contextRaw":"","html":"<h2>28题</h2>\n<blockquote>\n<p>The construction of the TMT is opposed by some locals partly because ______.<br />\n一些当地人反对TMT建设，部分原因是什么？</p>\n</blockquote>\n<p>题干直接给出TMT，并问当地人反对的原因。第二段开头有TMT的台址，刚才已经整段读过；相邻第三段接着出现Opposition和当地人，因此还需要把第三段完整读下来，才能查看反对者自己的理由。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Opposition to telescopes on Mauna Kea is nothing new. A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n<p>开始精读：</p>\n<p>Opposition to telescopes on Mauna Kea is nothing new. / A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists / have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land / and a painful reminder of the occupation / of what was once a sovereign nation.</p>\n<p>顺着英文顺序读：</p>\n<p>反对莫纳克亚山上的望远镜并不是什么新事。 / 一小群但 <span class=\"mask\">[xxx]</span> 的夏威夷人和环保人士 / 长期以来把它们的存在看作对神圣土地的 <span class=\"mask\">[xxx]</span> / 和一个令人痛苦的提醒，提醒那次占领， / 对一个曾经是主权国家的地方的占领。</p>\n</blockquote>\n","articleRects":[[168,718,995,152]],"questionRects":[[188,770,990,34]],"scrollTarget":"auto","meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. it may risk ruining their **[xxx]** life\n\n> 它可能有毁坏他们 **[xxx]** 生活的风险\n\n把A接回题干，它说的是：一些当地人反对TMT建设，部分原因是它可能毁坏他们的 **[xxx]** 生活。\n\nA的 `ruining their` 说对当地人的某方面造成毁坏，第三段的 `a painful reminder` 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。\n\n> A small but **[xxx]** group of Hawaiians and environmentalists have long viewed their presence as **[xxx]** for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\n\n`a painful reminder` 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。A的 `ruining their` 却说建设可能毁坏当地人的某种生活，是从现实项目向未来生活损害作预测。这里被遮住的是life的修饰部分，但“毁坏生活”这一动作仍然清楚。\n\n当地人觉得这块土地神圣、会想到痛苦历史，并不等于这句已经说他们的生活将被毁掉。sacred land的评价与历史回忆是原文列出的反对理由，不能用一个更重的破坏结果来替代。A把感受与记忆扩成了另一种损害。\n\n**“让人想起被占领的痛苦历史”是否已经说明建设会毁坏当地人的某一种生活？**\n\n不能。提醒既有历史和造成生活毁坏，不是同一个动作，也不是同一种因果。\n\nA可读出的ruining已经把原句的提醒作用扩大成破坏结果。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. it may risk ruining their <span class=\"mask\">[xxx]</span> life</h3>\n<blockquote>\n<p>它可能有毁坏他们 <span class=\"mask\">[xxx]</span> 生活的风险</p>\n</blockquote>\n<p>把A接回题干，它说的是：一些当地人反对TMT建设，部分原因是它可能毁坏他们的 <span class=\"mask\">[xxx]</span> 生活。</p>\n<p>A的 <code>ruining their</code> 说对当地人的某方面造成毁坏，第三段的 <code>a painful reminder</code> 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。</p>\n<blockquote>\n<p>A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n</blockquote>\n<p><code>a painful reminder</code> 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。A的 <code>ruining their</code> 却说建设可能毁坏当地人的某种生活，是从现实项目向未来生活损害作预测。这里被遮住的是life的修饰部分，但“毁坏生活”这一动作仍然清楚。</p>\n<p>当地人觉得这块土地神圣、会想到痛苦历史，并不等于这句已经说他们的生活将被毁掉。sacred land的评价与历史回忆是原文列出的反对理由，不能用一个更重的破坏结果来替代。A把感受与记忆扩成了另一种损害。</p>\n<p><strong>“让人想起被占领的痛苦历史”是否已经说明建设会毁坏当地人的某一种生活？</strong></p>\n<p>不能。提醒既有历史和造成生活毁坏，不是同一个动作，也不是同一种因果。</p>\n<p>A可读出的ruining已经把原句的提醒作用扩大成破坏结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[168,718,995,152]],"questionRects":[[188,770,990,34],[235,821,526,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 `ruining their` 说对当地人的某方面造成毁坏，第三段的 `a painful reminder` 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"a painful reminder","visibleOptionAnchor":"ruining their"}}}},{"section":"28题","raw":"### B. they fear losing control of Mauna Kea\n\n> 他们害怕失去对莫纳克亚山的控制\n\n把B接回题干，它说的是：一些当地人反对TMT建设，部分原因是害怕失去对莫纳克亚山的控制。\n\nB的 `losing control of Mauna Kea` 容易与第三段的 `occupation of what was once a sovereign nation` 联系，因为两处都涉及控制问题，所以回看occupation前后的时间表达与提醒关系。\n\n> A small but **[xxx]** group of Hawaiians and environmentalists have long viewed their presence as **[xxx]** for sacred land and a painful reminder of the occupation of what was once a sovereign nation.\n\n`occupation of what was once a sovereign nation` 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。B的 `losing control of Mauna Kea` 则是担心即将失去对这座山的控制，时间变成未来，范围也从过去的国家变成今天的山。\n\n这里没有说当地人目前持有何种控制权，也没有说建设会怎样转交这项权力。历史上失去主权可以令人痛苦，但“被提醒过去”不等于“害怕接下来发生同样的事”。B把原文的历史关联改成了新的权力变化预测。\n\n**原文在说明一段过去的占领历史被唤起，还是在预测当地人将失去这座山的控制权？**\n\n前者。reminder接过去的occupation，并没有交代新的控制权转移。\n\nB的时间方向和控制对象都变了，不能直接替代这条反对理由。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. they fear losing control of Mauna Kea</h3>\n<blockquote>\n<p>他们害怕失去对莫纳克亚山的控制</p>\n</blockquote>\n<p>把B接回题干，它说的是：一些当地人反对TMT建设，部分原因是害怕失去对莫纳克亚山的控制。</p>\n<p>B的 <code>losing control of Mauna Kea</code> 容易与第三段的 <code>occupation of what was once a sovereign nation</code> 联系，因为两处都涉及控制问题，所以回看occupation前后的时间表达与提醒关系。</p>\n<blockquote>\n<p>A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n</blockquote>\n<p><code>occupation of what was once a sovereign nation</code> 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。B的 <code>losing control of Mauna Kea</code> 则是担心即将失去对这座山的控制，时间变成未来，范围也从过去的国家变成今天的山。</p>\n<p>这里没有说当地人目前持有何种控制权，也没有说建设会怎样转交这项权力。历史上失去主权可以令人痛苦，但“被提醒过去”不等于“害怕接下来发生同样的事”。B把原文的历史关联改成了新的权力变化预测。</p>\n<p><strong>原文在说明一段过去的占领历史被唤起，还是在预测当地人将失去这座山的控制权？</strong></p>\n<p>前者。reminder接过去的occupation，并没有交代新的控制权转移。</p>\n<p>B的时间方向和控制对象都变了，不能直接替代这条反对理由。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[168,718,995,152]],"questionRects":[[188,770,990,34],[234,872,510,32]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 `losing control of Mauna Kea` 容易与第三段的 `occupation of what was once a sovereign nation` 联系，因为两处都涉及控制问题，所以回看occupation前后的时间表达与提醒关系。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"occupation of what was once a sovereign nation","visibleOptionAnchor":"losing control of Mauna Kea"}}}},{"section":"28题","raw":"### C. their culture will lose a chance of revival\n\n> 他们的文化将失去复兴机会\n\n把C接回题干，它说的是：一些当地人反对TMT建设，部分原因是他们的文化将失去复兴机会。\n\nC的 `a chance of revival` 谈文化复兴，第四段的 `renaissance` 也谈复兴，所以回到第四段完整读，确认作者说的是复兴正在发生，还是建设会取消它的机会。\n\n> 原文参考：\n>\n> Some blame for the current controversy belongs to astronomers. In their **[xxx]** to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always **[xxx]** the protection of Mauna Kea’s fragile ecosystems or its holiness to the islands’ inhabitants. Hawaiian culture is not a **[xxx]** of the past; it is a living culture undergoing a renaissance today.\n>\n> 开始精读：\n>\n> Some blame for the current controversy belongs to astronomers. / In their **[xxx]** to build bigger telescopes, / they forgot that science is not the only way of understanding the world. / They did not always **[xxx]** the protection of Mauna Kea’s fragile ecosystems / or its holiness to the islands’ inhabitants. / Hawaiian culture is not a **[xxx]** of the past; / it is a living culture undergoing a renaissance today.\n>\n> 顺着英文顺序读：\n>\n> 当前争议的一部分责任属于天文学家。 / 在他们想建造更大望远镜的 **[xxx]** 中， / 他们忘了科学并
