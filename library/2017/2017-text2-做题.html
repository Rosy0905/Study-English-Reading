在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<hr />\n<h3>26. Queen Liliuokalani’s remark in Paragraph 1 indicates ______.</h3>\n<p>女王在第一段的话表明了什么？</p>\n<p>这一题问：例子作用题。</p>\n<hr />\n<h3>27. Mauna Kea is deemed as an ideal astronomical site due to ______.</h3>\n<p>莫纳克亚山被认为是理想的天文观测地点，原因是什么？</p>\n<p>这一题问：细节题。</p>\n<hr />\n<h3>28. The construction of the TMT is opposed by some locals partly because ______.</h3>\n<p>一些当地人反对TMT建设，部分原因是什么？</p>\n<p>这一题问：细节题。</p>\n<hr />\n<h3>29. It can be inferred from Paragraph 5 that progress in today’s astronomy ______.</h3>\n<p>从第五段可以推知，今天的天文学进展怎样？</p>\n<p>这一题问：推断题。</p>\n<hr />\n<h3>30. The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.</h3>\n<p>作者对于选择莫纳克亚山作为TMT台址，持何种态度？</p>\n<p>这一题问：全文作者观点 / 全文主旨题。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>Sadly, But, Yet, too</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>not well, painful, fragile, no reason</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>connects, inspires, seek, avoid</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>protests, clarity, renaissance, natural state</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>astronomy, Hawaiian culture, Mauna Kea, TMT</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n<hr />\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. / Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. / Sadly, all is not well with astronomy in Hawaii today. / Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n<hr />\n<p>“The 古代夏威夷人 是天文学家,” wrote Queen Liliuokalani, 夏威夷末代君主, in 1897. / 观星者 were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. / Sadly, 并非一切顺利 with astronomy in Hawaii today. / Protests have <span class=\"mask\">[xxx]</span> over construction of the 三十米望远镜 (TMT), a giant observatory that promises to revolutionize 人类宇宙视野.</p>\n<hr />\n<p>1、古代夏威夷人、是天文学家、夏威夷末代君主、观星者、并非一切顺利、三十米望远镜、人类宇宙视野。</p>\n<hr />\n<p>At issue is the TMT’s planned location on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n<hr />\n<p>At issue is the TMT’s planned location on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. / But Mauna Kea is also home to some of the world’s most powerful telescopes. / Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n<hr />\n<p>At issue is the TMT’s 计划地点 on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that 连接夏威夷群岛 to the heavens. / But Mauna Kea is also home to some of the world’s most 强大望远镜. / Rested in the 太平洋, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s 稠密大气层, where conditions allow telescopes to obtain images of 无与伦比清晰.</p>\n<hr />\n<p>2、计划地点、连接夏威夷群岛、强大望远镜、太平洋、稠密大气层、无与伦比清晰。</p>\n<hr />\n<p>Opposition to telescopes on Mauna Kea is nothing new. A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n<hr />\n<p>Opposition to telescopes on Mauna Kea is nothing new. / A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land / and a painful reminder of the occupation of what was once a sovereign nation.</p>\n<hr />\n<p>反对望远镜 on Mauna Kea is 并不新鲜. / A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for 圣地 / and a 痛苦提醒 of the occupation of what was once a sovereign nation.</p>\n<hr />\n<p>3、反对望远镜、并不新鲜、圣地、痛苦提醒。</p>\n<hr />\n<p>Some blame for the current controversy belongs to astronomers. In their <span class=\"mask\">[xxx]</span> to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always <span class=\"mask\">[xxx]</span> the protection of Mauna Kea’s fragile ecosystems or its holiness to the islands’ inhabitants. Hawaiian culture is not a <span class=\"mask\">[xxx]</span> of the past; it is a living culture undergoing a renaissance today.</p>\n<hr />\n<p>Some blame for the current controversy belongs to astronomers. / In their <span class=\"mask\">[xxx]</span> to build bigger telescopes, they forgot that science is not the only way of understanding the world. / They did not always <span class=\"mask\">[xxx]</span> the protection of Mauna Kea’s fragile ecosystems or its holiness to the islands’ inhabitants. / Hawaiian culture is not a <span class=\"mask\">[xxx]</span> of the past; it is a living culture undergoing a renaissance today.</p>\n<hr />\n<p>一些责任 for the 当前争议 belongs to astronomers. / In their <span class=\"mask\">[xxx]</span> to 建更大望远镜, they forgot that science is not the only way of understanding the world. / They did not always <span class=\"mask\">[xxx]</span> the protection of Mauna Kea’s 脆弱生态系统 or its holiness to the islands’ inhabitants. / 夏威夷文化 is not a <span class=\"mask\">[xxx]</span> of the past; it is a 活文化 undergoing 复兴 today.</p>\n<hr />\n<p>4、一些责任、当前争议、建更大望远镜、脆弱生态系统、夏威夷文化、活文化、复兴。</p>\n<hr />\n<p>Yet science has a cultural history, too, with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens. Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a <span class=\"mask\">[xxx]</span> calling to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<hr />\n<p>Yet science has a cultural history, too, with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. / The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens. / Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. / Perhaps that is why we explore the starry skies, as if answering a <span class=\"mask\">[xxx]</span> calling to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<hr />\n<p>Yet 科学也有文化历史, too, with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. / The same curiosity to find what lies beyond the horizon that first brought 早期波利尼西亚人 to Hawaii’s shores inspires astronomers today to 探索天界. / Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and 夏威夷文化 both seek to 回答大问题 about who we are, where we come from and where we are going. / Perhaps that is why we explore the 星空, as if answering a <span class=\"mask\">[xxx]</span> calling to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<hr />\n<p>5、科学也有文化历史、早期波利尼西亚人、探索天界、夏威夷文化、回答大问题、星空。</p>\n<hr />\n<p>The astronomy community is making <span class=\"mask\">[xxx]</span> to change its use of Mauna Kea. The TMT site was chosen to <span class=\"mask\">[xxx]</span> the telescope’s visibility around the island and to avoid <span class=\"mask\">[xxx]</span> and environmental impact. To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.</p>\n<hr />\n<p>The astronomy community is making <span class=\"mask\">[xxx]</span> to change its use of Mauna Kea. / The TMT site was chosen to <span class=\"mask\">[xxx]</span> the telescope’s visibility around the island and to avoid <span class=\"mask\">[xxx]</span> and environmental impact. / To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state. / There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.</p>\n<hr />\n<p>The 天文学界 正在 <span class=\"mask\">[xxx]</span> to 改变使用方式 of Mauna Kea. / The 三十米望远镜台址 was chosen to <span class=\"mask\">[xxx]</span> the telescope’s visibility 环绕全岛 and 并避免 <span class=\"mask\">[xxx]</span> and environmental impact. / 为了限制望远镜数量 on Mauna Kea, old ones will be removed 在寿命结束时 and their sites returned to a 自然状态. / There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their 文化遗产 and to 研究星辰.</p>\n<hr />\n<p>6、天文学界、正在、改变使用方式、三十米望远镜台址、环绕全岛、并避免、为了限制望远镜数量、在寿命结束时、自然状态、文化遗产、研究星辰。</p>\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头有古代夏威夷人、天文学家、观星者、三十米望远镜；中间出现计划地点、太平洋、反对望远镜、痛苦提醒、夏威夷文化；后面又有科学也有文化历史、星空、自然状态、文化遗产、研究星辰。</p>\n<p>到这里还不能自然地说清楚：古代观星与今天建设是什么关系、为什么有人反对、科学和当地文化怎样联系、结尾的调整究竟回应了什么。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n<hr />\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<hr />\n<h2>26题</h2>\n<blockquote>\n<p>Queen Liliuokalani’s remark in Paragraph 1 indicates ______.<br />\n女王在第一段的话表明了什么？</p>\n</blockquote>\n<p>题干的Paragraph 1直接指定第一段，并问女王那句话indicates什么。完整读这一段，把引语谈论的时间、女王写话的时间和作者接下来的today区分开。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today. Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n<p>开始精读：</p>\n<p>“The ancient Hawaiians were astronomers,” / wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. / Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. / Sadly, all is not well with astronomy in Hawaii today. / Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), / a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n<p>顺着英文顺序读：</p>\n<p>“古代夏威夷人是天文学家”， / 利留卡拉尼女王，夏威夷最后一位在位君主，在1897年这样写道。 / 观星者是夏威夷社会中最 <span class=\"mask\">[xxx]</span> 的成员之一。 / 遗憾的是，今天夏威夷的天文学并非一切顺利。 / 抗议已经因为三十米望远镜（TMT）的建设而 <span class=\"mask\">[xxx]</span>， / 一座巨型天文台，有望彻底改变人类对宇宙的认识。</p>\n</blockquote>\n<hr />\n<h3>A. the importance of astronomy in ancient Hawaiian society</h3>\n<blockquote>\n<p>天文学在古代夏威夷社会中的重要性</p>\n</blockquote>\n<p>把A接回题干，它说的是：女王在第一段的话表明，天文学在古代夏威夷社会中有重要地位。</p>\n<p>A的 <code>ancient Hawaiian society</code> 与女王说的 <code>The ancient Hawaiians were astronomers</code> 指向同一时期和同一群人，因此先回看引语本身，再看作者怎样从过去接到today。</p>\n<blockquote>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897. Star watchers were among the most <span class=\"mask\">[xxx]</span> members of Hawaiian society. Sadly, all is not well with astronomy in Hawaii today.</p>\n</blockquote>\n<p><code>The ancient Hawaiians were astronomers</code> 直接把古代夏威夷人与天文学联系起来，不是说某个偶然出现的个人。A的 <code>ancient Hawaiian society</code> 保留了这个时间和社会范围。第二句接着专门写观星者在社会成员中的位置，虽然评价词 <span class=\"mask\">[xxx]</span> 没读清，但话题仍是观星与当时社会的关系。</p>\n<p>再看Sadly和today：作者转到今天的天文学不顺利时表示遗憾，是拿现在与前面那段传统作对照。A没有把女王的1897年写作日期当成引语谈论的年代，也没有凭一个人物的话增加具体观测成就。它概括的是原段确实建立的社会地位。</p>\n<p><strong>引语把古代夏威夷人直接称为天文学家，随后又拿今天的不顺与过去对照，能否支持A所说的历史重要性？</strong></p>\n<p>能。引语的主体、过去时和紧接的社会位置说明，都把天文学放在古代夏威夷社会的重要背景中。</p>\n<p>A既保留古代这一时间限定，也保留天文学与当地社会的联系。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<hr />\n<h3>B. her conservative view on the historical role of astronomy</h3>\n<blockquote>\n<p>她对天文学历史作用的保守看法</p>\n</blockquote>\n<p>把B接回题干，它说的是：女王在第一段的话表明，她对于天文学的历史作用持保守看法。</p>\n<p>B的 <code>her conservative view</code> 是对女王立场的评价，原文的 <code>The ancient Hawaiians were astronomers</code> 则是她被引用的具体话，所以回看这句，比较她是在描述过去，还是评价应该怎样对待天文学。</p>\n<blockquote>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897.</p>\n</blockquote>\n<p><code>The ancient Hawaiians were astronomers</code> 的形式是“过去的人是什么”，没有“应当保持什么”“反对什么改变”这样的态度动作。B的 <code>her conservative view</code> 却先给女王扣上保守立场，再把天文学的历史作用装进这一立场。提到古代不等于保守，描述传统也不等于拒绝发展。</p>\n<p>Hawaii’s last reigning monarch介绍的是她的身份，1897介绍写作时间；这两处都不能代替她话里的态度。后面的Sadly属于作者从过去转向今天时的表述，也不能拿来当女王在引语中的保守判断。这里把谁说的话、话在讲什么和谁的态度分开，B就接不上了。</p>\n<p><strong>一个人说“古代夏威夷人是天文学家”，是否已经表明她对天文学持保守立场？</strong></p>\n<p>不能。引语给出历史描述，conservative需要的是额外的立场判断，两者不是一回事。</p>\n<p>B把引语的历史内容改成了女王的个人态度，而该态度没有在话中表达。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<hr />\n<h3>C. the regrettable decline of astronomy in ancient times</h3>\n<blockquote>\n<p>天文学在古代令人遗憾的衰落</p>\n</blockquote>\n<p>把C接回题干，它说的是：女王在第一段的话表明，天文学在古代经历了令人遗憾的衰落。</p>\n<p>C的 <code>in ancient times</code> 把不好的变化放在古代，而第一段的 <code>in Hawaii today</code> 明确标出作者谈到不顺利时的时间；因此回看Sadly开头的这一句，再与女王引语比较。</p>\n<blockquote>\n<p>Sadly, all is not well with astronomy in Hawaii today. Protests have <span class=\"mask\">[xxx]</span> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity’s view of the cosmos.</p>\n</blockquote>\n<p>原文的 <code>in Hawaii today</code> 紧跟天文学不顺利这件事，是今天建设望远镜遭遇抗议。C用 <code>in ancient times</code> 把它挪到了古代，还写成天文学的decline。女王讲古代人是天文学家，并没有给出古代由盛转衰的过程。</p>\n<p>Sadly也不能单独搬走。它评价的是后面这整句当下情况，不是离它更远的所有历史内容。作者是先说过去的天文学传统，再说今天的争议；C把“过去”和“今天”两块材料拼反，得到了一段原文没有说的古代衰落史。</p>\n<p><strong>原文的Sadly所评价的是古代衰落，还是今天夏威夷天文学遇到的不顺？</strong></p>\n<p>后者。today已经把时间说清楚，抗议建设的事情也发生在这个当下语境中。</p>\n<p>C把今天的困难移到古代，时间与事件内容都发生了变化。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<hr />\n<h3>D. her appreciation of star watchers’ <span class=\"mask\">[xxx]</span> in her time</h3>\n<blockquote>\n<p>她对自己所处时代观星者的 <span class=\"mask\">[xxx]</span> 的欣赏</p>\n</blockquote>\n<p>把D接回题干，它说的是：女王在第一段的话表明，她欣赏自己所处时代观星者的 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的 <code>in her time</code> 指女王所处的时代，原文的 <code>The ancient Hawaiians</code> 却是引语明说的对象；因此回看引语与1897的摆放位置，区分写下话的时间和话里谈论的时间。</p>\n<blockquote>\n<p>“The ancient Hawaiians were astronomers,” wrote Queen Liliuokalani, Hawaii’s last reigning monarch, in 1897.</p>\n</blockquote>\n<p><code>in her time</code> 与 <code>The ancient Hawaiians</code> 不是同一个时间范围。1897放在wrote后面，说明女王何时写下这句话；ancient放在Hawaiians前面，限定她谈到的是古代夏威夷人。一个人在1897年写古人，并不会让古人变成她同时代的人。</p>\n<p>D中间的 <span class=\"mask\">[xxx]</span> 不清楚，但这不妨碍先判断清楚时间限定。即使它涉及观星者的某种表现，D仍要求这些观星者属于her time，而引语实际指向ancient。不能因为引语作者是一位女王，就把她所说的一切都缩到她在位时期。</p>\n<p><strong>1897是女王写下这句话的时间，能不能据此把ancient Hawaiians改成她同时代的观星者？</strong></p>\n<p>不能。写作日期与叙述对象的年代是两回事，原文还特意用ancient限定了对象。</p>\n<p>D已有的时间限定不合，不必给 <span class=\"mask\">[xxx]</span> 补入具体意思才能发现这处差别。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<hr />\n<h3>26题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>26题选A。</strong></p>\n</blockquote>\n<hr />\n<h2>27题</h2>\n<blockquote>\n<p>Mauna Kea is deemed as an ideal astronomical site due to ______.<br />\n莫纳克亚山被认为是理想的天文观测地点，原因是什么？</p>\n</blockquote>\n<p>题干直接给出Mauna Kea，第二段集中出现这个地名。due to问它适合天文观测的原因，先完整读第二段，看看同一个地点被介绍了哪些方面。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>At issue is the TMT’s planned location on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n<p>开始精读：</p>\n<p>At issue is the TMT’s planned location on Mauna Kea, / a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, / that connects the Hawaiian Islands to the heavens. / But Mauna Kea is also home to some of the world’s most powerful telescopes. / Rested in the Pacific Ocean, / Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, / where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n<p>顺着英文顺序读：</p>\n<p>有争议的是三十米望远镜计划在莫纳克亚山上的位置， / 一座 <span class=\"mask\">[xxx]</span> 火山，被一些夏威夷人作为piko来 <span class=\"mask\">[xxx]</span>， / 它把夏威夷群岛与天空联系起来。 / 但莫纳克亚山也是世界上一些最强大的望远镜的所在地。 / 坐落在太平洋中， / 莫纳克亚山的山峰高出我们星球浓密大气的 <span class=\"mask\">[xxx]</span>， / 那里的条件让望远镜能够获得清晰度无与伦比的图像。</p>\n</blockquote>\n<hr />\n<h3>A. its religious implications</h3>\n<blockquote>\n<p>它的宗教意味</p>\n</blockquote>\n<p>把A接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它的宗教意味。</p>\n<p>A的 <code>religious implications</code> 与第二段的 <code>connects the Hawaiian Islands to the heavens</code> 都涉及当地人赋予这座山的意义，因此回看这里，再看But后面另列的观测条件。</p>\n<blockquote>\n<p>At issue is the TMT’s planned location on Mauna Kea, a <span class=\"mask\">[xxx]</span> volcano <span class=\"mask\">[xxx]</span> by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens. But Mauna Kea is also home to some of the world’s most powerful telescopes.</p>\n</blockquote>\n<p><code>connects the Hawaiian Islands to the heavens</code> 写在some Hawaiians把这座山视作piko的语境里，说明当地人如何理解这处地方。A的 <code>religious implications</code> 可以联系这部分，但题干问的是为什么它是ideal astronomical site，不是为什么这块地方对当地人特殊。</p>\n<p>But后面另转到天文观测：先说已经有强大望远镜，再说山峰高出浓密大气的一部分，能够获得清晰图像。原文将文化意义与观测条件并列在同一地点上，A却把前一种意义改成后一种用途的原因。词都在同一段，不等于它们承担同一种解释任务。</p>\n<p><strong>当地人赋予这座山的特殊意义，是否就是作者解释望远镜为什么能看得清楚的原因？</strong></p>\n<p>不是。观测清晰度的说明在后面的山峰和大气条件，前面的特殊意义说明的是选址争议中的另一层关系。</p>\n<p>A拿文化意义回答观测条件，因果所接的对象不对。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<hr />\n<h3>B. its protective surroundings</h3>\n<blockquote>\n<p>它具有保护作用的周边环境</p>\n</blockquote>\n<p>把B接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为周边环境对它有保护作用。</p>\n<p>B的 <code>protective surroundings</code> 讲周边保护，原文的 <code>peak rises above</code> 讲山峰与大气的高低关系；两者都可能让人想到自然环境，所以回看这个位置关系怎样接出图像清晰度。</p>\n<blockquote>\n<p>Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n</blockquote>\n<p><code>peak rises above</code> 说明山峰处在浓密大气之上的某个位置，where把这一位置的条件接到成像效果上。B的 <code>protective surroundings</code> 却要求周边事物起遮挡、护卫或保护作用，原文没有建立“周围保护它，所以观测好”的关系。</p>\n<p>太平洋只是所处地点，不能单凭位于海中就推出周围环境正在保护望远镜。这里的关键动作是rises above，讨论的是高低位置；protective讨论的却是环境对对象施加的保护功能。把同样属于“环境”的两个意思混在一起，会丢掉原文明确写出的原因。</p>\n<p><strong>山峰高出浓密大气中的某部分，是否等于周围环境在为望远镜提供保护？</strong></p>\n<p>不等于。一个是观测点的位置条件，一个是保护作用，原文实际说明的是前者。</p>\n<p>B把自然位置换成环境保护功能，不能准确接上清晰成像的解释。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<hr />\n<h3>C. its <span class=\"mask\">[xxx]</span> features</h3>\n<blockquote>\n<p>它的 <span class=\"mask\">[xxx]</span> 特征</p>\n</blockquote>\n<p>把C接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它的 <span class=\"mask\">[xxx]</span> 特征。</p>\n<p>C的 <code>its</code> 指莫纳克亚山本身，第二段的 <code>Mauna Kea’s peak</code> 同样在介绍这座山；因此回看山峰、大气与成像效果所在的一句，确认它的特征是否被拿来解释观测优势。</p>\n<blockquote>\n<p>Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n</blockquote>\n<p>C中 <code>its</code> 所指的对象与 <code>Mauna Kea’s peak</code> 一致，随后features让我们去看这座山具有怎样的特点。原文给出所在海域、山峰高于浓密大气中某部分的关系，又由where conditions直接接到清晰图像，确实是在以场地自身的条件解释观测优势。</p>\n<p>C的形容词 <span class=\"mask\">[xxx]</span> 还不能逐字读出，但其余部分没有另换成宗教价值、周围保护或已有设备。对照已经读到的原因，山峰自身的这一组特征是本段实际展开的说明。不能为了译出一个完整中文词组，就把形容词补出来；保留C依据的是这段明确给出的对象与解释。</p>\n<p><strong>本段是否把这座山自身的条件，与望远镜获得清晰图像直接接在一起？</strong></p>\n<p>能。where conditions所接的正是前面山峰与大气的位置描述，后面给出成像结果。</p>\n<p>C保留；它概括场地特征这一对象，没有像另外几项那样换掉原文的原因。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<hr />\n<h3>D. its existing infrastructure</h3>\n<blockquote>\n<p>它现有的基础设施</p>\n</blockquote>\n<p>把D接回题干，它说的是：莫纳克亚山被认为适合天文观测，是因为它已有的基础设施。</p>\n<p>D的 <code>existing infrastructure</code> 容易让人想到第二段的 <code>home to some of the world’s most powerful telescopes</code>，因为这里提到已有设备，所以把这句与随后解释成像条件的句子一起看。</p>\n<blockquote>\n<p>But Mauna Kea is also home to some of the world’s most powerful telescopes. Rested in the Pacific Ocean, Mauna Kea’s peak rises above the <span class=\"mask\">[xxx]</span> of our planet’s dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.</p>\n</blockquote>\n<p><code>home to some of the world’s most powerful telescopes</code> 先说明这里已经有望远镜；后句再解释这座山能提供怎样的成像条件。D的 <code>existing infrastructure</code> 则把“已经设有观测设备”当成“这里适合观测”的原因，颠倒了这两层说明的重点。</p>\n<p>已有设备可以表明人们已选择这个地方，但题干due to要的是适合的缘由。原文给的缘由是山峰、大气和由此获得的清晰图像，并没有说依靠现成的道路、建筑或仪器配套使地点变得理想。不能用“有人已经在那里建了”替代“为什么适合在那里建”。</p>\n<p><strong>一处地方已经有强大望远镜，能不能替代下一句给出的山峰和大气条件，成为题干要的原因？</strong></p>\n<p>不能。已有望远镜是使用现状，后一句的自然条件才解释为什么适合观测。</p>\n<p>D把设备存在这一现状改成选址优势的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<hr />\n<h3>27题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>27题选C。</strong></p>\n</blockquote>\n<hr />\n<h2>28题</h2>\n<blockquote>\n<p>The construction of the TMT is opposed by some locals partly because ______.<br />\n一些当地人反对TMT建设，部分原因是什么？</p>\n</blockquote>\n<p>题干直接给出TMT，并问当地人反对的原因。第二段开头有TMT的台址，刚才已经整段读过；相邻第三段接着出现Opposition和当地人，因此还需要把第三段完整读下来，才能查看反对者自己的理由。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Opposition to telescopes on Mauna Kea is nothing new. A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n<p>开始精读：</p>\n<p>Opposition to telescopes on Mauna Kea is nothing new. / A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists / have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land / and a painful reminder of the occupation / of what was once a sovereign nation.</p>\n<p>顺着英文顺序读：</p>\n<p>反对莫纳克亚山上的望远镜并不是什么新事。 / 一小群但 <span class=\"mask\">[xxx]</span> 的夏威夷人和环保人士 / 长期以来把它们的存在看作对神圣土地的 <span class=\"mask\">[xxx]</span> / 和一个令人痛苦的提醒，提醒那次占领， / 对一个曾经是主权国家的地方的占领。</p>\n</blockquote>\n<hr />\n<h3>A. it may risk ruining their <span class=\"mask\">[xxx]</span> life</h3>\n<blockquote>\n<p>它可能有毁坏他们 <span class=\"mask\">[xxx]</span> 生活的风险</p>\n</blockquote>\n<p>把A接回题干，它说的是：一些当地人反对TMT建设，部分原因是它可能毁坏他们的 <span class=\"mask\">[xxx]</span> 生活。</p>\n<p>A的 <code>ruining their</code> 说对当地人的某方面造成毁坏，第三段的 <code>a painful reminder</code> 也讲当地人的负面感受，因此回看这个reminder具体提醒什么，区分伤痛回忆与生活将被毁坏。</p>\n<blockquote>\n<p>A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n</blockquote>\n<p><code>a painful reminder</code> 是看到望远镜就想起曾经遭受占领的历史，原文用of把回忆内容说得很具体。A的 <code>ruining their</code> 却说建设可能毁坏当地人的某种生活，是从现实项目向未来生活损害作预测。这里被遮住的是life的修饰部分，但“毁坏生活”这一动作仍然清楚。</p>\n<p>当地人觉得这块土地神圣、会想到痛苦历史，并不等于这句已经说他们的生活将被毁掉。sacred land的评价与历史回忆是原文列出的反对理由，不能用一个更重的破坏结果来替代。A把感受与记忆扩成了另一种损害。</p>\n<p><strong>“让人想起被占领的痛苦历史”是否已经说明建设会毁坏当地人的某一种生活？</strong></p>\n<p>不能。提醒既有历史和造成生活毁坏，不是同一个动作，也不是同一种因果。</p>\n<p>A可读出的ruining已经把原句的提醒作用扩大成破坏结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<hr />\n<h3>B. they fear losing control of Mauna Kea</h3>\n<blockquote>\n<p>他们害怕失去对莫纳克亚山的控制</p>\n</blockquote>\n<p>把B接回题干，它说的是：一些当地人反对TMT建设，部分原因是害怕失去对莫纳克亚山的控制。</p>\n<p>B的 <code>losing control of Mauna Kea</code> 容易与第三段的 <code>occupation of what was once a sovereign nation</code> 联系，因为两处都涉及控制问题，所以回看occupation前后的时间表达与提醒关系。</p>\n<blockquote>\n<p>A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n</blockquote>\n<p><code>occupation of what was once a sovereign nation</code> 说的是曾经作为主权国家的地方遭到占领，once与was把事情放在过去；现在的望远镜让人想起那段历史。B的 <code>losing control of Mauna Kea</code> 则是担心即将失去对这座山的控制，时间变成未来，范围也从过去的国家变成今天的山。</p>\n<p>这里没有说当地人目前持有何种控制权，也没有说建设会怎样转交这项权力。历史上失去主权可以令人痛苦，但“被提醒过去”不等于“害怕接下来发生同样的事”。B把原文的历史关联改成了新的权力变化预测。</p>\n<p><strong>原文在说明一段过去的占领历史被唤起，还是在预测当地人将失去这座山的控制权？</strong></p>\n<p>前者。reminder接过去的occupation，并没有交代新的控制权转移。</p>\n<p>B的时间方向和控制对象都变了，不能直接替代这条反对理由。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<hr />\n<h3>C. their culture will lose a chance of revival</h3>\n<blockquote>\n<p>他们的文化将失去复兴机会</p>\n</blockquote>\n<p>把C接回题干，它说的是：一些当地人反对TMT建设，部分原因是他们的文化将失去复兴机会。</p>\n<p>C的 <code>a chance of revival</code> 谈文化复兴，第四段的 <code>renaissance</code> 也谈复兴，所以回到第四段完整读，确认作者说的是复兴正在发生，还是建设会取消它的机会。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Some blame for the current controversy belongs to astronomers. In their <span class=\"mask\">[xxx]</span> to build bigger telescopes, they forgot that science is not the only way of understanding the world. They did not always <span class=\"mask\">[xxx]</span> the protection of Mauna Kea’s fragile ecosystems or its holiness to the islands’ inhabitants. Hawaiian culture is not a <span class=\"mask\">[xxx]</span> of the past; it is a living culture undergoing a renaissance today.</p>\n<p>开始精读：</p>\n<p>Some blame for the current controversy belongs to astronomers. / In their <span class=\"mask\">[xxx]</span> to build bigger telescopes, / they forgot that science is not the only way of understanding the world. / They did not always <span class=\"mask\">[xxx]</span> the protection of Mauna Kea’s fragile ecosystems / or its holiness to the islands’ inhabitants. / Hawaiian culture is not a <span class=\"mask\">[xxx]</span> of the past; / it is a living culture undergoing a renaissance today.</p>\n<p>顺着英文顺序读：</p>\n<p>当前争议的一部分责任属于天文学家。 / 在他们想建造更大望远镜的 <span class=\"mask\">[xxx]</span> 中， / 他们忘了科学并不是理解世界的唯一方式。 / 他们并不总是 <span class=\"mask\">[xxx]</span> 对莫纳克亚山脆弱生态系统的保护 / 或它对于岛上居民的神圣性。 / 夏威夷文化不是过去的一个 <span class=\"mask\">[xxx]</span>； / 它是一种活着的文化，今天正在经历复兴。</p>\n</blockquote>\n<p>现在把文化今天的状态接回C的未来判断：</p>\n<blockquote>\n<p>Hawaiian culture is not a <span class=\"mask\">[xxx]</span> of the past; it is a living culture undergoing a renaissance today.</p>\n</blockquote>\n<p><code>a renaissance today</code> 前面接undergoing，是这种活着的文化今天正在经历复兴。C的 <code>a chance of revival</code> 前面接will lose，把它写成一个将被建设项目夺走的未来机会。正在发生的复兴与未来会不会受阻并非逻辑上永远不能并存，但原文这句只说明文化的现状，并没有给出C所加的未来损害链。</p>\n<p>第四段责备天文学家忘记理解世界不只有科学，还要求重视生态和神圣意义。它是在说明为什么不能把夏威夷文化当成过去的死东西，不是在预言一旦建望远镜就会使文化失去复兴可能。C把文化值得尊重这一理由换成了文化未来被阻断的预测。</p>\n<p><strong>作者说文化正在复兴，是否已经说TMT建设将使它失去复兴机会？</strong></p>\n<p>不能。一个是当前文化状态，另一个还需要“建设导致机会消失”的因果，原段没有作出这个预测。</p>\n<p>C增加了will lose这一未来结果，不能从正在复兴的表述中推出。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<hr />\n<h3>D. it reminds them of a humiliating history</h3>\n<blockquote>\n<p>它让他们想起一段屈辱历史</p>\n</blockquote>\n<p>把D接回题干，它说的是：一些当地人反对TMT建设，部分原因是这让他们想起一段屈辱历史。</p>\n<p>D的 <code>a humiliating history</code> 可以接到第三段的 <code>occupation of what was once a sovereign nation</code>，因为被占领的过去就是这里痛苦回忆的内容，所以回看reminder与occupation连在一起的部分。</p>\n<blockquote>\n<p>A small but <span class=\"mask\">[xxx]</span> group of Hawaiians and environmentalists have long viewed their presence as <span class=\"mask\">[xxx]</span> for sacred land and a painful reminder of the occupation of what was once a sovereign nation.</p>\n</blockquote>\n<p>原文把望远镜的presence看成a painful reminder，D用reminds them保留了“现在看到它，想到过去”这一作用。<code>occupation of what was once a sovereign nation</code> 是主权国家遭占领的历史，且作者明写painful，D的 <code>a humiliating history</code> 正是对这种受占领的屈辱经历作概括。</p>\n<p>这里既没有把过去换成未来，也没有把提醒改成正在夺权。题干还用partly because，允许只选出部分原因，D不必把前面sacred land那一层也全装进去。它保留的是原文and后面已经写完整的一条理由。</p>\n<p><strong>D是否保留了“望远镜的存在提醒他们想起过去被占领的痛苦经历”这一关系？</strong></p>\n<p>能。现在的提醒、过去的历史和当地人的负面感受都对应，没有另造未来损害。</p>\n<p>D能够独立回答partly because所要求的一部分原因。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<hr />\n<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<blockquote>\n<p><strong>28题选D。</strong></p>\n</blockquote>\n<hr />\n<h2>29题</h2>\n<blockquote>\n<p>It can be inferred from Paragraph 5 that progress in today’s astronomy ______.<br />\n从第五段可以推知，今天的天文学进展怎样？</p>\n</blockquote>\n<p>题干用Paragraph 5指定第五段，问今天的天文学进展。先把第五段完整读下来，尤其把过去的人与今天的人分别放在句中的位置上，不先替任何一个动作补意思。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Yet science has a cultural history, too, with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens. Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going. Perhaps that is why we explore the starry skies, as if answering a <span class=\"mask\">[xxx]</span> calling to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<p>开始精读：</p>\n<p>Yet science has a cultural history, too, / with roots going back to the <span class=\"mask\">[xxx]</span> of civilization. / The same curiosity to find what lies beyond the horizon / that first brought early Polynesians to Hawaii’s shores / inspires astronomers today to explore the heavens. / Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea / or to ban future development there / ignore the reality that astronomy and Hawaiian culture both seek to answer big questions / about who we are, where we come from and where we are going. / Perhaps that is why we explore the starry skies, / as if answering a <span class=\"mask\">[xxx]</span> calling / to know ourselves and our true <span class=\"mask\">[xxx]</span> homes.</p>\n<p>顺着英文顺序读：</p>\n<p>然而科学也有文化历史， / 根源可以追溯到文明的 <span class=\"mask\">[xxx]</span>。 / 那种同样的好奇心，想知道地平线之外有什么， / 它最初把早期波利尼西亚人带到夏威夷海岸， / 又激励今天的天文学家探索天空。 / 要求 <span class=\"mask\">[xxx]</span> 莫纳克亚山上所有望远镜的呼声， / 或者要求禁止那里的未来发展， / 忽略了这个事实：天文学和夏威夷文化都试图回答重大问题， / 关于我们是谁、我们从哪里来、我们要到哪里去。 / 也许那就是我们探索星空的原因， / 仿佛在回应一个 <span class=\"mask\">[xxx]</span> 的召唤， / 去认识我们自己和我们真正的 <span class=\"mask\">[xxx]</span> 家园。</p>\n</blockquote>\n<hr />\n<h3>A. is <span class=\"mask\">[xxx]</span> the dreams of ancient Hawaiians</h3>\n<blockquote>\n<p>正在 <span class=\"mask\">[xxx]</span> 古代夏威夷人的梦想</p>\n</blockquote>\n<p>把A接回题干，它说的是：今天的天文学进展，正在 <span class=\"mask\">[xxx]</span> 古代夏威夷人的梦想。</p>\n<p>A的 <code>dreams of ancient Hawaiians</code> 涉及古人的探索愿望，第五段的 <code>The same curiosity</code> 把早期到达夏威夷的人与今天的天文学家接在一起，因此回看这一个主语怎样统领两个时代的动作。</p>\n<blockquote>\n<p>The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii’s shores inspires astronomers today to explore the heavens.</p>\n</blockquote>\n<p><code>The same curiosity</code> 是整句主语：它过去带人来到夏威夷海岸，如今又激励天文学家探索天空。A的 <code>dreams of ancient Hawaiians</code> 能够接到古人想知道远方是什么的愿望，而题干的today’s astronomy能接到astronomers today。对象和两个时代之间的联系都存在。</p>\n<p>真正没读清的是is后面的 <span class=\"mask\">[xxx]</span>，它控制现代进展与古人梦想是什么关系。原文同一个curiosity贯穿古今，说明二者不是毫不相关，却还不能据此把A的动作词直接译出来。A先保留，因为它抓住了古今探索愿望这一连接，而不是额外谈文化传播或人的态度变化。</p>\n<p><strong>同一种好奇心连接古人与今天的天文学家，是否足以把A完全定下来？</strong></p>\n<p>还不能。古今愿望的联系已经读到，但A怎样表述现代进展与古人梦想的关系，仍卡在那个动作词上。</p>\n<p>A有本段的古今连接作依据，暂时保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<hr />\n<h3>B. helps spread Hawaiian culture across the world</h3>\n<blockquote>\n<p>帮助把夏威夷文化传播到全世界</p>\n</blockquote>\n<p>把B接回题干，它说的是：今天的天文学进展，帮助把夏威夷文化传播到全世界。</p>\n<p>B的 <code>spread Hawaiian culture</code> 说传播文化，第五段的 <code>astronomy and Hawaiian culture both seek to answer</code> 则把天文学与文化并列，因此回看这个both后面到底是共同做什么。</p>\n<blockquote>\n<p>Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.</p>\n</blockquote>\n<p><code>astronomy and Hawaiian culture both seek to answer</code> 表示两者都追问人的身份、来处和去向，是两个主体具有共同追问。B的 <code>spread Hawaiian culture</code> 却把天文学设为传播者，把夏威夷文化变成被传播的对象。这不是并列关系，而是一方把另一方向外输送的关系。</p>\n<p>across the world又增加了传播范围。原文的重大问题可以对人类很重要，但问题广泛不等于某一文化已经借天文学走向全世界。这句是在寻找两者可以对话的共同点，不能从“都在追问”推出“一个在推广另一个”。</p>\n<p><strong>两者都追问“我们从哪里来”，是否等于天文学把夏威夷文化传播到了世界各地？</strong></p>\n<p>不等于。共同追问不等于传播活动，主体与对象的关系已经不同。</p>\n<p>B加进传播动作和全球范围，原句的both关系不能支持这两步。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<hr />\n<h3>C. may <span class=\"mask\">[xxx]</span> the origin of Hawaiian culture</h3>\n<blockquote>\n<p>可能 <span class=\"mask\">[xxx]</span> 夏威夷文化的起源</p>\n</blockquote>\n<p>把C接回题干，它说的是：今天的天文学进展，可能 <span class=\"mask\">[xxx]</span> 夏威夷文化的起源。</p>\n<p>C的 <code>origin of Hawaiian culture</code> 谈文化的来处，第五段的 <code>where we come from</code> 也在追问来处，因此回看谁在问这个问题，以及这里的we具体指向什么。</p>\n<blockquote>\n<p>Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.</p>\n</blockquote>\n<p><code>where we come from</code> 与 <code>origin of Hawaiian culture</code> 都会让人想到起源，所以C并非看到就可以扔掉。但原文的主语是astronomy and Hawaiian culture，两者共同问“我们从哪里来”；C的对象却直接收缩到夏威夷文化本身的起源。共同追问人的来处，和研究一种文化怎样产生，并不完全相同。</p>\n<p>现在C前面是may，后面动作又是 <span class=\"mask\">[xxx]</span>。这个动作是否能把较宽的“人的来处”与较窄的“文化起源”接上，单看本段还没有彻底说清。不能先把C补成某一种研究成果，再据此选它或删它。先留下这处具体的起源联系，与A的古今愿望联系作区分。</p>\n<p><strong>本段共同追问来处，能否已经排定C对“夏威夷文化起源”所作的那种动作判断？</strong></p>\n<p>还不能。来处的话题有联系，但C收窄了对象，关键动作也未读清，仍需判断它是否抓住本段真正推进的重点。</p>\n<p>C暂时保留，与A形成二选一；两项的疑点并不相同。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<hr />\n<h3>D. will eventually soften Hawaiians’ hostility</h3>\n<blockquote>\n<p>最终将缓和夏威夷人的敌意</p>\n</blockquote>\n<p>把D接回题干，它说的是：今天的天文学进展，最终将缓和夏威夷人的敌意。</p>\n<p>D的 <code>soften Hawaiians’ hostility</code> 说当地人的态度会改变，第五段的 <code>Calls to</code> 指前面反对发展的呼声，因此回看作者回应这些呼声时，是给出共同点，还是预测反对者未来的心理变化。</p>\n<blockquote>\n<p>Calls to <span class=\"mask\">[xxx]</span> all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.</p>\n</blockquote>\n<p>原文从 <code>Calls to</code> 反对发展，转到指出这些呼声忽略了科学与文化的共同追问。D的 <code>soften Hawaiians’ hostility</code> 则要求再走一步：当地人将接受这一说理，敌意也会减轻。作者说明某种反对忽略了事实，并不等于反对者已经或必将改变看法。</p>\n<p>will eventually还把这种态度转变说成最终会出现的结果。该段没有提供反对者如何回应，也没有给出天文学进展导致敌意变化的时间过程。能用来回应反对的理由，不必然产生D所说的心理效果。</p>\n<p><strong>作者指出反对呼声忽略共同追问，是否就能保证当地人的敌意最终会减轻？</strong></p>\n<p>不能。说理的内容与受众将怎样反应之间还隔着一步，原文没有作出这种未来保证。</p>\n<p>D把作者的反驳改成对当地人未来态度的确定预测。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<hr />\n<h3>29题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下A和C，先继续做后面的题。</p>\n<hr />\n<h2>30题</h2>\n<p><strong>The author’s attitude toward choosing Mauna Kea as the TMT site is one of ______.</strong></p>\n<p>作者对于选择莫纳克亚山作为TMT台址，持何种态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>severe criticism</strong></p>\n<p>严厉批评</p>\n<p>B. <strong>full approval</strong></p>\n<p>完全赞同</p>\n<p>C. <strong>passive acceptance</strong></p>\n<p>被动接受</p>\n<p>D. <strong>slight hesitancy</strong></p>\n<p>略有犹豫</p>\n<hr />\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>从古代天文传统写到今天TMT建设遭抗议，将传统与当下不顺放在一起。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明争议地点具有当地人的特殊意义，同时又有能获得清晰图像的观测条件。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>说明一些人把望远镜与神圣土地及过去被占领的痛苦记忆联系起来。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>承认天文学家承担部分责任，曾忘记科学不是唯一理解世界的方式，并强调文化仍在复兴。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>转而说明科学也有文化历史，古今探索由相同好奇心联系，天文学与文化有共同追问，不能因此禁止发展。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>列出改变使用方式、避免影响、退役旧设备与恢复自然状态等安排，最后明确欢迎文化传承与研究星空共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>A. severe criticism</h3>\n<blockquote>\n<p>严厉批评</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先以古代传统说明今天建设TMT是一种不应有的破坏。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再强调台址的文化意义足以否定其观测价值。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着支持反对者，把反对理由当作不能建设的依据。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后集中批评天文学家，使其过错成为否定选址的理由。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说明所谓科学与文化共同点也无法为建设辩护。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后要求放弃台址，而不再寻求同地共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>A要求全文最后落在严厉否定这项选址上。第三段的痛苦回忆与第四段的Some blame，确实能够让人感到作者批评了科学一方；但批评的对象是忽略当地价值的做法，不等于拒绝在这个地点建设望远镜。</p>\n<p>第五段以Yet转向：科学本身也有文化历史，同样的探索好奇心跨越古今，禁止未来发展会忽略共同问题。第六段继续列如何调整，最后用There is no reason why everyone cannot be welcomed明确欢迎双方。若是A，这两段应该继续反对或要求放弃台址，实际方向却相反。</p>\n<p><strong>承认天文学家负有部分责任，是否就足以把作者对选址的整体态度判成严厉批评？</strong></p>\n<p>不能。承认问题服务于后面的共存办法，结尾没有否定选址。A排除。</p>\n<hr />\n<h3>B. full approval</h3>\n<blockquote>\n<p>完全赞同</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先承认历史传统与当前冲突确实存在，引出选址争议。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再同时说明地点的文化价值与天文优势。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着认真交代反对者为何感到受伤，而非无视他们。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后承认科学一方此前做得不好，需要尊重当地文化。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说明科学探索并不与文化根本对立，反对全面禁止。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后列可执行的调整，明确支持两种活动在当地共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>B中的full approval针对题干限定的choosing Mauna Kea as the TMT site，并不是说作者赞同天文学家以前的每一种做法。因此第四段承认失误，与最终赞同选址并不矛盾。作者可以要求尊重生态与文化，同时认为这一地点仍能够承载天文研究。</p>\n<p>从六行看，第二段给出观测优势，第三、四段认真处理反对理由，第五段找科学与文化的共同追问，第六段提出减轻影响和恢复场地的安排。最后的There is no reason why everyone cannot be welcomed不是被动让步，而是明确反对把两类活动排斥在同一地方之外。</p>\n<p><strong>作者是否在处理反对理由之后，仍主动肯定文化传承与研究星空可以在莫纳克亚山共存？</strong></p>\n<p>能。结尾态度明确，前面的承认失误并未变成否决台址。B保留。</p>\n<hr />\n<h3>C. passive acceptance</h3>\n<blockquote>\n<p>被动接受</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先展示争议，让作者以无可奈何的口气接受现状。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再承认地点虽有价值，但似乎只能被迫接受台址。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着突出反对理由，使接受显得勉强。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后承认科学一方问题很多，却找不到别的办法。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说明接受建设只是没有选择，而不是主动肯定科学与文化的联系。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后消极承认建设无法改变，不积极提出共同使用的前景。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>C的passive acceptance意味着作者并不真正积极支持，只是勉强或无奈地接受。若照这个态度写，第五段就不必主动为科学的文化历史辩护，第六段也应落到“既然无法改变，只好如此”。实际作者不是只描述建设已经发生，而是认真论证两者有共同的探索根源。</p>\n<p>末段列改变使用方式、限制设备数量、退役后恢复自然等安排，说明作者在建设性地寻找共同使用的方式；最后明确说没有理由不欢迎所有人。这里的肯定来自论证与可行安排，不是来自无计可施。</p>\n<p><strong>列出共存理由并主动欢迎双方，是被迫接受无法改变的现实吗？</strong></p>\n<p>不是。C所需的无奈或消极态度没有形成，反而与作者主动说明共存可能的写法不合，排除。</p>\n<hr />\n<h3>D. slight hesitancy</h3>\n<blockquote>\n<p>略有犹豫</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先摆出传统与冲突，表明作者暂时难作决定。</td>\n  <td>先说过去与眼前有什么不同</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再列两种价值，使赞成和反对保持未定。</td>\n  <td>再说同一个地方为何被两边看重</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着交代反对理由，加深是否建设的犹豫。</td>\n  <td>接着说明为什么有人不接受</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后指出科学一方的问题，但仍不确定能否弥补。</td>\n  <td>然后承认这一边有做得不好的地方</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再谈共同点，却继续保留是否应选此地的疑问。</td>\n  <td>再说另一边也不能这样否定</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后要求再等等或再评估，不明确欢迎建设与文化共存。</td>\n  <td>最后说怎样才能一起做下去</td>\n</tr>\n</tbody>\n</table>\n<p>D比严厉反对轻一些，容易让人把第四段承认问题看成作者还有犹豫。但文章中间出现两面材料，并不能把结尾的态度也留在两面之间。先交代反对者、再承认科学一方有责任，是作者把问题讲完整的步骤，不必等于尚未表态。</p>\n<p>第五段已经明确批评全面禁止发展的主张，第六段继续说应怎样减少冲突，并用There is no reason why everyone cannot be welcomed收束。若仍略有犹豫，应留下“是否能够”“仍待观察”一类未定判断；实际末句没有要求等待裁决，也没有保留否决台址的姿态。</p>\n<p><strong>中间承认矛盾，能不能覆盖结尾已经明确给出的欢迎与共存判断？</strong></p>\n<p>不能。D停在论证中途，忽略结尾的肯定，排除。</p>\n<hr />\n<h3>30题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，B能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>30题选B。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>full approval / 完全赞同</strong></p>\n<hr />\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<hr />\n<h2>回查29题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. is <span class=\"mask\">[xxx]</span> the dreams of ancient Hawaiians</li>\n<li>C. may <span class=\"mask\">[xxx]</span> the origin of Hawaiian culture</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>full approval / 完全赞同</strong></p>\n</blockquote>\n<p>也就是：作者支持这一台址，不是因为文化必须给科学让路，而是认为两者有共同的探索根源，也可以在尊重与调整之下共存。</p>\n<p>第一遍读第五段时，A把今天的天文学与古代夏威夷人的梦想相接，C把今天的天文学与夏威夷文化起源相接。The same curiosity和where we come from分别给两项提供了联系，但两项的核心动作都没有读清，不能先把它们翻成确定说法。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A说现代天文进展正在 <span class=\"mask\">[xxx]</span> 古人的梦想；C说现代天文进展可能 <span class=\"mask\">[xxx]</span> 夏威夷文化的起源。前者问现代探索与古代愿望的关系，后者把一种文化的起源设为现代天文学的对象。这两种连接并不相同。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。全文需要回应的是：科学研究能否与当地文化在同一地点共存。原文第五段用同一个curiosity作主语，先接古人远行，再接今天的天文学家探索天空，正是要说明两边并非根本对立。A把现代天文与古人愿望联系起来，可以顺着这个共同追问的方向读；它没有要求全文改成对夏威夷文化起源的专题研究。</p>\n<p>再看C。where we come from的主语是天文学和夏威夷文化共同面对的“我们”，不是只有“夏威夷文化从哪里产生”。将一种文化本身的起源当成天文学进展的对象，会把全文的共存论证缩成一个具体研究成果。实际末段继续讨论如何同地使用、保护环境与传承文化，也没有接着说明天文学怎样研究该文化的产生。</p>\n<p>主旨加入后，A所保留的古今探索联系能够贯通这一段的作用，C的起源联系则把共同追问的主体与对象错置了。我们据此选择A，仍不把A与C各自的 <span class=\"mask\">[xxx]</span> 擅自写成具体英文或中文动词。</p>\n<blockquote>\n<p><strong>29题选A。</strong></p>\n</blockquote>\n<hr />\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>26题：A</strong> — the importance of astronomy in ancient Hawaiian society（天文学在古代夏威夷社会中的重要性）</li>\n<li><strong>27题：C</strong> — its <span class=\"mask\">[xxx]</span> features（它的 <span class=\"mask\">[xxx]</span> 特征）</li>\n<li><strong>28题：D</strong> — it reminds them of a humiliating history（它让他们想起一段屈辱历史）</li>\n<li><strong>29题：A</strong> — is <span class=\"mask\">[xxx]</span> the dreams of ancient Hawaiians（正在 <span class=\"mask\">[xxx]</span> 古代夏威夷人的梦想）</li>\n<li><strong>30题：B</strong> — full approval（完全赞同）</li>\n</ul>\n<p>本篇答案：<strong>ACDAB</strong>。</p>\n","analysisStartIndex":34,"maskInventory":{"token":"[xxx]","count":140},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"30","ordinaryFirstRoundCandidates":{"26":["A"],"27":["C"],"28":["D"],"29":["A","C"]}},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlowPlan":[{"schema":"question-flow-plan-v3","qid":"26","questionType":"ordinary","paragraphPids":[0],"locator":{"basis":"stem_scope","anchors":["Paragraph 1"],"paragraphPids":[0]},"initialReadingMode":"new","initialParagraphPids":[0],"initialContextParagraphPids":[],"questionEntryStepIndexes":[34],"initialPrecisionStepIndexes":[34],"optionStepIndexes":{"A":35,"B":36,"C":37,"D":38},"extraPrecisionReads":[]},{"schema":"question-flow-plan-v3","qid":"27","questionType":"ordinary","paragraphPids":[1],"locator":{"basis":"stem_entity","anchors":["Mauna Kea"],"paragraphPids":[1]},"initialReadingMode":"new","initialParagraphPids":[1],"initialContextParagraphPids":[],"questionEntryStepIndexes":[40],"initialPrecisionStepIndexes":[40],"optionStepIndexes":{"A":41,"B":42,"C":43,"D":44},"extraPrecisionReads":[]},{"schema":"question-flow-plan-v3","qid":"28","q
