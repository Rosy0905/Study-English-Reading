Xa8rOW191Jh1RnzWN5mL0NCXCO6p1+zFruBJ9GR8trYcH2QA2hWu38vIa+DMVHx6gnmpF8829kmRvsgu2KbJl6miePj+EPPWFk15lKqQt/ztpdaPBkm+E9LYIANv66s+n+LabHHto7jXmsih3sDlL5EJOGy3fDau/NYASA44mpuY1LAXWyL0uNVm6eer2WfN73GvUC1md3QXRMuuTp0LacopSWS7+GBj8MyUW0D64PzaPy0Vfmzc3v45qCiYyMDCCUnn6UEZaiD+mpfiDn0L0Kkva96XvK/6c/kZInzt8Noe3wyL+Lbf7dfz8W+Tubd+wvxWOqh+zPN4p/N+0EH+P0dNKf5Gm//znv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vu//BoB","articleSize":{"w":1354,"h":1885},"questionSize":{"w":1354,"h":1885},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<hr />\n<h3>21. The crash of EgyptAir Flight 804 is mentioned to ______.</h3>\n<p>提到埃及航空804航班坠毁，是为了说明什么？</p>\n<p>这一题问：例子作用题。</p>\n<hr />\n<h3>22. Which of the following contributes to long waits at major airports?</h3>\n<p>以下哪一项会造成主要机场的长时间等待？</p>\n<p>这一题问：细节题。</p>\n<hr />\n<h3>23. The word “expedited” (Para. 5) is closest in meaning to ______.</h3>\n<p>第五段中的expedited，意思最接近哪个词？</p>\n<p>这一题问：词义题。</p>\n<hr />\n<h3>24. One problem with the PreCheck program is ______.</h3>\n<p>PreCheck计划存在的一个问题是什么？</p>\n<p>这一题问：细节题。</p>\n<hr />\n<h3>25. Which of the following would be the best title for the text?</h3>\n<p>下列哪一项最适合作为本文的标题？</p>\n<p>这一题问：全文作者观点 / 全文主旨题。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>But, since then, combined with, while</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>willing, tragic, fatal flaw, reasonable</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>tolerate, enroll, pay, cut</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>long waits, saving time, not gotten anywhere close</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>security, travelers, TSA, PreCheck</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p>First two hours, now three hours—this is how far in advance <span class=\"mask\">[xxx]</span> are recommending people show up to catch a <span class=\"mask\">[xxx]</span> flight, at least at some major U.S. airports with increasingly <span class=\"mask\">[xxx]</span> security lines.</p>\n<hr />\n<p>First two hours, now three hours— / this is how far in advance <span class=\"mask\">[xxx]</span> are recommending people show up to catch a <span class=\"mask\">[xxx]</span> flight, / at least at some major U.S. airports with increasingly <span class=\"mask\">[xxx]</span> security lines.</p>\n<hr />\n<p>提前两小时, 现在三小时— / this is how far in advance <span class=\"mask\">[xxx]</span> are recommending 人们到场 to catch a <span class=\"mask\">[xxx]</span> flight, / at least at some 美国主要机场 with increasingly <span class=\"mask\">[xxx]</span> 安检队伍.</p>\n<hr />\n<p>1、提前两小时、现在三小时、人们到场、美国主要机场、安检队伍。</p>\n<hr />\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return <span class=\"mask\">[xxx]</span> public support for the process. And it should: Wasted time is a drag on Americans’ economic and private lives, not to mention <span class=\"mask\">[xxx]</span>.</p>\n<hr />\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. / The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why. / But demanding too much of air travelers or providing too little security in return <span class=\"mask\">[xxx]</span> public support for the process. / And it should: Wasted time is a drag on Americans’ economic and private lives, not to mention <span class=\"mask\">[xxx]</span>.</p>\n<hr />\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> 安检程序 in return for 更高安全. / The crash of 埃及航空八〇四航班, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why. / But demanding too much of 航空旅客 or providing too little security in return <span class=\"mask\">[xxx]</span> 公众支持 for the process. / And it should: 浪费时间 is a drag on Americans’ 经济与私人生活, not to mention <span class=\"mask\">[xxx]</span>.</p>\n<hr />\n<p>2、安检程序、更高安全、埃及航空八〇四航班、航空旅客、公众支持、浪费时间、经济与私人生活。</p>\n<hr />\n<p>Last year, the Transportation Security Administration (TSA) found in a secret check that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past airport security nearly every time they tried. <span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. It is not yet clear how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n<hr />\n<p>Last year, the Transportation Security Administration (TSA) found in a secret check that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past airport security nearly every time they tried. / <span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. / It is not yet clear how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n<hr />\n<p>去年, the 运输安全管理局 (TSA) found in 一次秘密检查 that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past 机场安检 nearly every time they tried. / <span class=\"mask\">[xxx]</span> security measures since then, combined with 航空出行增长 due to the improving economy and low oil prices, have resulted in 长时间等待 at 主要机场 such as Chicago’s O’Hare International. / It is not yet clear how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n<hr />\n<p>3、去年、运输安全管理局、一次秘密检查、机场安检、航空出行增长、长时间等待、主要机场。</p>\n<hr />\n<p>Part of the issue is that the government did not <span class=\"mask\">[xxx]</span> the steep increase in airline travel, so the TSA is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.</p>\n<hr />\n<p>Part of the issue is that the government did not <span class=\"mask\">[xxx]</span> the steep increase in airline travel, so the TSA is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. / Part of the issue is that airports have only so much room for screening lanes. / Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.</p>\n<hr />\n<p>Part of the issue is that 政府 did not <span class=\"mask\">[xxx]</span> the steep increase in 航空出行, so 运输安全管理局 is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. / Part of the issue is that airports have only so much room for 安检通道. / Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their 随身行李 to avoid 托运行李费, though the airlines strongly dispute this.</p>\n<hr />\n<p>4、政府、航空出行、运输安全管理局、安检通道、随身行李、托运行李费。</p>\n<hr />\n<p>There is one step the TSA could take that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.</p>\n<hr />\n<p>There is one step the TSA could take that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: Enroll more people in the PreCheck program. / PreCheck is supposed to be a win-win for travelers and the TSA. / Passengers who pass a background check are eligible to use expedited screening lanes. / This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. / The TSA wants to enroll 25 million people in PreCheck.</p>\n<hr />\n<p>There is 一个办法 the TSA could take that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: Enroll 更多人 in 预检计划. / PreCheck is supposed to be a win-win for travelers and the TSA. / Passengers who pass 背景审查 are eligible to use expedited 安检通道. / This allows the TSA to focus on travelers who are 更高风险, 节省时间 for everyone involved. / The TSA wants to enroll 25 million people in PreCheck.</p>\n<hr />\n<p>5、一个办法、更多人、预检计划、背景审查、安检通道、更高风险、节省时间。</p>\n<hr />\n<p>It has not gotten anywhere close to that, and one big reason is <span class=\"mask\">[xxx]</span> shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.</p>\n<hr />\n<p>It has not gotten anywhere close to that, and one big reason is <span class=\"mask\">[xxx]</span> shock: Passengers must pay $85 every five years to process their background checks. / Since the beginning, this price tag has been PreCheck’s fatal flaw. / Upcoming reforms might bring the price to a more reasonable level. / But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.</p>\n<hr />\n<p>It has not gotten anywhere close to that, and 一个重要原因 is <span class=\"mask\">[xxx]</span> shock: 旅客必须支付 $85 每五年 to process their 背景审查. / Since the beginning, this price tag has been PreCheck’s 致命缺陷. / Upcoming reforms might bring the price to a more reasonable level. / But 国会 should look into doing so directly, by helping to finance PreCheck enrollment or to 降低成本 in other ways.</p>\n<hr />\n<p>6、一个重要原因、旅客必须支付、每五年、背景审查、致命缺陷、国会、降低成本。</p>\n<hr />\n<p>The TSA cannot continue diverting resources into <span class=\"mask\">[xxx]</span> PreCheck lanes while most of the traveling public suffers in unnecessary lines. It is long past time to make the program work.</p>\n<hr />\n<p>The TSA cannot continue diverting resources into <span class=\"mask\">[xxx]</span> PreCheck lanes / while most of the traveling public suffers in unnecessary lines. / It is long past time to make the program work.</p>\n<hr />\n<p>运输安全管理局 不能继续 转移资源 into <span class=\"mask\">[xxx]</span> PreCheck lanes / while most of the 出行公众 suffers in unnecessary lines. / It is long past time to 让计划运转.</p>\n<hr />\n<p>7、运输安全管理局、不能继续、转移资源、出行公众、让计划运转。</p>\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到某个对象时能较快回到它所在的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现提前两小时、现在三小时、美国主要机场、安检队伍；中间有安检程序、更高安全、航空出行增长、长时间等待、背景审查；后面又出现旅客必须支付、致命缺陷、国会、让计划运转。</p>\n<p>到这里还不能自然地说清楚：坠机为什么被提起、航空出行与排队怎样相接、预检安排如何省时、报名费用为什么被反复写到。这些碎片暂时只帮助认出谈到了哪些事情；它们之间的关系，等题目问到时再回去读。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先把刚才看见的对象和位置留下；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n<hr />\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<hr />\n<h2>21题</h2>\n<blockquote>\n<p>The crash of EgyptAir Flight 804 is mentioned to ______.<br />\n提到埃及航空804航班坠毁，是为了说明什么？</p>\n</blockquote>\n<p>题干直接给出EgyptAir Flight 804这一事件，第二段出现同一个航班名称。问的是提到这件事的作用，不只是事故发生了什么，因此先把第二段完整读下来，看例子前后各接着什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why. But demanding too much of air travelers or providing too little security in return <span class=\"mask\">[xxx]</span> public support for the process. And it should: Wasted time is a drag on Americans’ economic and private lives, not to mention <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures / in return for increased safety. / The crash of EgyptAir Flight 804, / which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, / provides another tragic reminder of why. / But demanding too much of air travelers / or providing too little security in return / <span class=\"mask\">[xxx]</span> public support for the process. / And it should: / Wasted time is a drag on Americans’ economic and private lives, / not to mention <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>美国人愿意忍受 <span class=\"mask\">[xxx]</span> 安检程序 / 来换取更高的安全。 / 埃及航空804航班的坠毁， / 恐怖分子可能在地中海上空对它做了 <span class=\"mask\">[xxx]</span>， / 又提供了一次悲剧性的提醒，提醒这是为什么。 / 但是，向航空旅客要求太多 / 或者作为回报提供太少的安全 / 会 <span class=\"mask\">[xxx]</span> 公众对这套程序的支持。 / 而且它就应该如此： / 被浪费的时间是美国人经济生活和私人生活的拖累， / 更不用说 <span class=\"mask\">[xxx]</span> 了。</p>\n</blockquote>\n<hr />\n<h3>A. stress the <span class=\"mask\">[xxx]</span> to strengthen security worldwide</h3>\n<blockquote>\n<p>强调在全球加强安保的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把A接回题干，它说的是：提到埃及航空804航班坠毁，是为了强调在全球加强安保的 <span class=\"mask\">[xxx]</span>。</p>\n<p>A的 <code>strengthen security worldwide</code> 谈加强安保，第二段的 <code>increased safety</code> 也谈安全增加；因此回看这句以及紧接着的坠机例子，看看例子是在解释前一句，还是另起一个全球性的倡议。</p>\n<blockquote>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why.</p>\n</blockquote>\n<p>先看前一句的主语Americans和动作are willing to tolerate：这里写的是美国人为什么愿意接受安检。<code>increased safety</code> 是他们想换来的东西，不是作者正在向全世界发布的要求。下一句末尾的why接着问“为什么愿意”，于是坠机事件就是对这个理由的提醒。</p>\n<p>A把这一步写成 <code>strengthen security worldwide</code>，不仅多出worldwide的范围，还把“解释已有的容忍”改成“强调加强安保”。坠机发生在地中海上空，并不使它在这段中的作用变成全球倡议；发生地点和用例目的要分开。</p>\n<p><strong>这里的why是在追问美国人为什么容忍安检，还是要求全世界怎样加强安保？</strong></p>\n<p>前者。它接的是前一句的愿意忍受安检，而不是一个尚未提出的全球行动要求。</p>\n<p>A即使保留中间的 <span class=\"mask\">[xxx]</span>，后面的全球范围和行动方向也已经换掉了这一例子的说明对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<hr />\n<h3>B. explain American’s tolerance of current security checks</h3>\n<blockquote>\n<p>解释美国人对当前安检的容忍</p>\n</blockquote>\n<p>把B接回题干，它说的是：提到埃及航空804航班坠毁，是为了解释美国人为什么容忍当前安检。</p>\n<p>B的 <code>tolerance of current security checks</code> 与第二段的 <code>are willing to tolerate</code> 都在说接受安检，所以回到这一句，再看下一句末尾的why究竟接着解释什么。</p>\n<blockquote>\n<p>Americans are willing to tolerate <span class=\"mask\">[xxx]</span> security procedures in return for increased safety. The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why.</p>\n</blockquote>\n<p>B里的tolerance是名词，原文 <code>are willing to tolerate</code> 是“愿意忍受”这一动作，讲的是同一种态度。security checks和security procedures也指向同一套安检事情。这里还要把in return for接上：美国人接受安检，不是喜欢排队，而是为了换取更多安全。</p>\n<p>后一句先提坠机，再说它提供了一个tragic reminder of why。why没有另立对象，而是回扣刚说完的容忍理由。B的 <code>tolerance of current security checks</code> 正好把前一句的态度和后一句的例子合起来了，不需要确定飞机被怎样 <span class=\"mask\">[xxx]</span>，也没有把例子写成机场建设问题。</p>\n<p><strong>B能不能同时接住“愿意忍受安检”和“坠机提醒为什么”这两层内容？</strong></p>\n<p>能。前一句给出美国人的态度与交换条件，后一例子提醒人们安全风险，使这种容忍有了具体理由。</p>\n<p>所以B不是只碰到security一个词，而是保留了“例子解释容忍原因”这整个关系。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<hr />\n<h3>C. highlight the necessity of upgrading major U.S. airports</h3>\n<blockquote>\n<p>突出升级美国主要机场的必要性</p>\n</blockquote>\n<p>把C接回题干，它说的是：提到埃及航空804航班坠毁，是为了突出升级美国主要机场的必要性。</p>\n<p>C的 <code>upgrading major U.S. airports</code> 指机场升级；要判断这个升级要求是否由坠机例子带出，仍要看第二段的 <code>reminder of why</code>，因为它直接写明了例子在这里起提醒作用。</p>\n<blockquote>\n<p>The crash of EgyptAir Flight 804, which terrorists may have <span class=\"mask\">[xxx]</span> over the Mediterranean Sea, provides another tragic reminder of why.</p>\n</blockquote>\n<p><code>reminder of why</code> 往前接到美国人愿意忍受安检，提醒的是为什么需要付出一定时间换取安全。C的 <code>upgrading major U.S. airports</code> 却把承担动作的对象换成机场设施，还加进“升级”这一工程性的做法。</p>\n<p>不能因为安检在机场发生，就把所有涉及安检的例子都理解成呼吁升级机场。这里没有说这次坠机由哪座美国机场的设施造成，也没有以此提出改建要求。第二段后面的时间浪费和生活拖累，仍在衡量旅客承受的代价，不是在列机场应当更换的设备。</p>\n<p><strong>坠机提醒旅客为什么重视安全，能不能直接改写成美国主要机场必须升级？</strong></p>\n<p>不能。前者解释一种态度，后者要求对另一对象采取具体措施，二者之间缺了原文没有建立的联系。</p>\n<p>C把安检所在的地点当成了例子要论证的对象，机场升级不是这句why所接的内容。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<hr />\n<h3>D. emphasize the importance of privacy protection</h3>\n<blockquote>\n<p>强调隐私保护的重要性</p>\n</blockquote>\n<p>把D接回题干，它说的是：提到埃及航空804航班坠毁，是为了强调隐私保护的重要性。</p>\n<p>D的 <code>privacy protection</code> 要找的是隐私方面的保护；第二段出现了 <code>private lives</code>，两处都带有“私人”的意思，因此回看private lives所在的完整句，确认它说的究竟是哪一种影响。</p>\n<blockquote>\n<p>And it should: Wasted time is a drag on Americans’ economic and private lives, not to mention <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>这里 <code>private lives</code> 和economic lives并列，是“经济生活与私人生活”这两个受影响的方面。真正产生影响的主语是Wasted time，后面用is a drag说明浪费时间带来的拖累。D的 <code>privacy protection</code> 则是防止个人信息或私人领域被侵犯，已经把“生活被耽误”换成“隐私需要保护”。</p>\n<p>再把它接回题干，题干问的是坠机例子为什么被提到，而不是安检可能引出的任何社会议题。前面的why仍然回扣安全与容忍，后面的private lives也没有把它转向隐私。只抓private这个相近词，会漏掉time才是这句话正在批评的东西。</p>\n<p><strong>浪费时间拖累私人生活，等不等于作者在用坠机事件讨论隐私保护？</strong></p>\n<p>不等于。时间代价与隐私保护是不同问题，原文句子的主语、影响和所接例子都没有变成隐私。</p>\n<p>D把private lives的生活范围换成privacy protection的保护议题，不能解释该例子的作用。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<hr />\n<h3>21题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>21题选B。</strong></p>\n</blockquote>\n<hr />\n<h2>22题</h2>\n<blockquote>\n<p>Which of the following contributes to long waits at major airports?<br />\n以下哪一项会造成主要机场的长时间等待？</p>\n</blockquote>\n<p>题干问long waits的原因。粗读时我依稀记得第三段留下过“长时间等待”这个碎片，先回到第三段完整读；如果某个选项另提一个尚未读过的具体对象，再顺着它找。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Last year, the Transportation Security Administration (TSA) found in a secret check that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past airport security nearly every time they tried. <span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. It is not yet clear how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n<p>开始精读：</p>\n<p>Last year, / the Transportation Security Administration (TSA) found in a secret check / that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past airport security / nearly every time they tried. / <span class=\"mask\">[xxx]</span> security measures since then, / combined with a rise in airline travel / due to the improving economy and low oil prices, / have resulted in long waits at major airports / such as Chicago’s O’Hare International. / It is not yet clear / how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n<p>顺着英文顺序读：</p>\n<p>去年， / 运输安全管理局（TSA）在一次秘密检查中发现 / <span class=\"mask\">[xxx]</span> 调查人员能够把武器——假的和真的都有——<span class=\"mask\">[xxx]</span> 过机场安检 / 几乎每次尝试都是如此。 / 那以后 <span class=\"mask\">[xxx]</span> 的安保措施， / 加上航空出行的增加 / 由于经济改善和低油价， / 已经造成主要机场的长时间等待 / 比如芝加哥的奥黑尔国际机场。 / 现在还不清楚 / 航空安保变得多么更 <span class=\"mask\">[xxx]</span> 了——但是队伍是显而易见的。</p>\n</blockquote>\n<hr />\n<h3>A. New restrictions on carry-on bags.</h3>\n<blockquote>\n<p>对随身行李的新限制</p>\n</blockquote>\n<p>把A接回题干，它说的是：美国主要机场等待时间长，是因为对随身行李出台了新限制。</p>\n<p>A的 <code>restrictions on carry-on bags</code> 与第四段的 <code>carry-on bags</code> 指同一类行李，因此要把这一段完整读一遍，查看行李相关的事情到底由谁发起，不能把行李两个字直接当成原因。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Part of the issue is that the government did not <span class=\"mask\">[xxx]</span> the steep increase in airline travel, so the TSA is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. Part of the issue is that airports have only so much room for screening lanes. Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.</p>\n<p>开始精读：</p>\n<p>Part of the issue is that the government did not <span class=\"mask\">[xxx]</span> the steep increase in airline travel, / so the TSA is now rushing to get new <span class=\"mask\">[xxx]</span> on the line. / Part of the issue is that airports have only so much room for screening lanes. / Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags / to avoid checked-baggage fees, / though the airlines strongly dispute this.</p>\n<p>顺着英文顺序读：</p>\n<p>问题的一部分是政府没有 <span class=\"mask\">[xxx]</span> 航空出行的急剧增加， / 所以TSA现在正赶着把新的 <span class=\"mask\">[xxx]</span> 安排上线。 / 问题的一部分是机场只有那么多空间供安检通道使用。 / 另一个因素可能是更多人正试图 <span class=\"mask\">[xxx]</span> 他们的随身行李 / 来避免托运行李费用， / 尽管航空公司强烈反驳这一点。</p>\n</blockquote>\n<p>现在回到A，把旅客处理行李的做法与限制要求分开看：</p>\n<blockquote>\n<p>Another factor may be that more people are trying to <span class=\"mask\">[xxx]</span> their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.</p>\n</blockquote>\n<p>A的 <code>restrictions on carry-on bags</code> 是有关部门或航空公司施加的限制；原文围绕 <code>their carry-on bags</code> 写的主语却是more people，动作是are trying to，目的则是to avoid checked-baggage fees。也就是说，这里提出的是旅客为了避开托运费用而采取某种做法，不是机场公布了一项新规定。</p>\n<p>另外，原文用may be，结尾又写航空公司强烈争辩这一解释。A既换掉了行为主体，也把一个尚有争议的可能因素写成了明确的新限制。不能把“旅客怎样处理行李”和“机场怎样限制行李”混成同一件事。</p>\n<p><strong>第四段写的是机场对行李施加新限制，还是旅客为了避开费用在处理自己的行李？</strong></p>\n<p>后者。more people是主语，to avoid checked-baggage fees是目的，原文没有把这件事写成新的限制政策。</p>\n<p>因此A所说的限制方向与这里的旅客行为不同，不能作为本题的原因。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<hr />\n<h3>B. The <span class=\"mask\">[xxx]</span> efficiency of the TSA.</h3>\n<blockquote>\n<p>TSA的 <span class=\"mask\">[xxx]</span> 效率</p>\n</blockquote>\n<p>把B接回题干，它说的是：美国主要机场等待时间长，是由于TSA的效率 <span class=\"mask\">[xxx]</span>。</p>\n<p>B的 <code>efficiency of the TSA</code> 谈TSA办事效率；第三段的 <code>have resulted in long waits</code> 直接接出长时间等待的原因，所以回看这个谓语前面的主语，比较原文归因是不是效率。</p>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International. It is not yet clear how much more <span class=\"mask\">[xxx]</span> airline security has become—but the lines are obvious.</p>\n</blockquote>\n<p><code>have resulted in long waits</code> 前面并列的是安保措施与航空出行增加，不是TSA每单位时间能处理多少人的效率指标。B的 <code>efficiency of the TSA</code> 把“工作内容和需求发生变化”改成了“机构效率如何”。长队本身不能证明机构效率变化：接受检查的人增加，即使单人的处理速度不变，也可能排得更久。</p>\n<p>段末尤其要分清：作者说安保在某方面改善了多少还不清楚，但队伍看得见。这不是一份已经确定TSA效率变化的结论。第四段又分别列旅客增加、通道空间和行李做法，不能把这些不同原因压成B那一个机构效率判断。</p>\n<p><strong>原文把长队归因于措施与出行增加，能不能仅凭队伍很长就确定TSA效率发生了某种变化？</strong></p>\n<p>不能。排队结果不等于效率测量，原文列出的原因也不是效率变化这件事。</p>\n<p>B把等待这个结果重新命名成机构效率问题，再拿它充当原因，超过了这两段真正给出的归因。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<hr />\n<h3>C. An increase in the number of travelers.</h3>\n<blockquote>\n<p>旅客数量的增加</p>\n</blockquote>\n<p>把C接回题干，它说的是：美国主要机场等待时间长，其中一个原因是旅客数量增加。</p>\n<p>C的 <code>number of travelers</code> 与第三段的 <code>a rise in airline travel</code> 都涉及航空出行的人数增加，所以回看这部分和后面的have resulted in，看增加与等待是否被原文明说成因果。</p>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago’s O’Hare International.</p>\n</blockquote>\n<p><code>a rise in airline travel</code> 是航空出行增加，C用 <code>number of travelers</code> 把它落到旅客数量上，所说的变化方向都是增加。due to the improving economy and low oil prices先交代出行为什么增加；后面的have resulted in则进一步说明这些因素怎样造成long waits。两层因果不要倒着读。</p>\n<p>原文没有说“旅客增加是唯一原因”，C也没有加only，只是在Which contributes to的问题下提供一个促成因素。combined with说明还有安保措施这个因素一同起作用，不会因此否定旅客增加本身的贡献。第四段的steep increase in airline travel也继续提到同一个增长。</p>\n<p><strong>原文把航空出行增加与安保措施一起接到long waits，能不能支持“旅客增加是一个原因”？</strong></p>\n<p>能。它在have resulted in前面直接参与构成原因，且C没有把“一个因素”夸大成“唯一因素”。</p>\n<p>人数增加、等待增加的方向和因果都接得上，因此保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<hr />\n<h3>D. Frequent unexpected secret checks.</h3>\n<blockquote>\n<p>频繁而出乎意料的秘密检查</p>\n</blockquote>\n<p>把D接回题干，它说的是：美国主要机场等待时间长，是因为频繁而出乎意料的秘密检查。</p>\n<p>D的 <code>Frequent unexpected secret checks</code> 与第三段的 <code>a secret check</code> 都提到秘密检查，因此回到该段第一句，再把它与后一句写长队的内容区分开。</p>\n<blockquote>\n<p>Last year, the Transportation Security Administration (TSA) found in a secret check that <span class=\"mask\">[xxx]</span> investigators were able to <span class=\"mask\">[xxx]</span> weapons—both fake and real—past airport security nearly every time they tried.</p>\n</blockquote>\n<p>原文的 <code>a secret check</code> 是去年一次调查检查，句子在报告调查人员在机场安检中做了什么。D却写 <code>Frequent unexpected secret checks</code>，把单次调查说成反复进行的、出乎意料的秘密检查，并让它直接承担排长队的原因。</p>\n<p>nearly every time they tried也不能给Frequent补依据。every time修饰的是调查人员尝试带武器通过的情况，不等于航空旅客不断受到秘密抽查。后一句用since then转到之后的安保措施，再接航空出行增加与长时间等待；调查的发现和其后的安检安排，在时间顺序与行为内容上都不同。</p>\n<p><strong>“调查人员几乎每次尝试”能不能推出旅客因为频繁秘密检查而排长队？</strong></p>\n<p>不能。尝试的主体是调查人员，而原文的秘密检查是发现情况的调查，不是反复拖慢旅客的日常程序。</p>\n<p>D把调查中的多次尝试换成检查频率，又把先前调查换成长队的直接原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<hr />\n<h3>22题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>22题选C。</strong></p>\n</blockquote>\n<hr />\n<h2>23题</h2>\n<blockquote>\n<p>The word “expedited” (Para. 5) is closest in meaning to ______.<br />\n第五段中的expedited，意思最接近哪个词？</p>\n</blockquote>\n<p>题干的Para. 5已经指定第五段，被考的词是expedited。先完整读第五段，保留这个词本身，看它修饰什么，以及后一句怎样解释相关安排的效果。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>There is one step the TSA could take that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: Enroll more people in the PreCheck program. PreCheck is supposed to be a win-win for travelers and the TSA. Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved. The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>开始精读：</p>\n<p>There is one step the TSA could take / that would not require <span class=\"mask\">[xxx]</span> airports or rushing to hire: / Enroll more people in the PreCheck program. / PreCheck is supposed to be a win-win for travelers and the TSA. / Passengers who pass a background check / are eligible to use expedited screening lanes. / This allows the TSA to focus on travelers who are higher risk, / saving time for everyone involved. / The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>顺着英文顺序读：</p>\n<p>有一个步骤TSA可以采取 / 它不要求 <span class=\"mask\">[xxx]</span> 机场或者匆忙招聘： / 让更多人加入PreCheck预检计划。 / PreCheck按设想应该让旅客和TSA双赢。 / 通过背景审查的旅客 / 有资格使用expedited安检通道。 / 这让TSA能够重点关注风险更高的旅客， / 为所有参与者节省时间。 / TSA想让两千五百万人加入PreCheck。</p>\n</blockquote>\n<hr />\n<h3>A. quieter</h3>\n<blockquote>\n<p>更安静的</p>\n</blockquote>\n<p>把A接回题干，它说的是：第五段的expedited意思最接近“更安静的”。</p>\n<p>A的 <code>quieter</code> 说声音更小，而第五段的 <code>saving time</code> 说节省时间；两者都可以形容通道带来的体验，所以回看expedited之后的结果句，判断作者具体解释的是哪种改善。</p>\n<blockquote>\n<p>Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p><code>quieter</code> 比较的是声音大小；<code>saving time</code> 比较的是耗时多少，两个维度不同。这里先让通过背景审查的人使用expedited通道，再说TSA因此能关注风险更高的旅客，结果是为大家省时间。全句没有从噪声、说话或环境声的角度解释通道。</p>\n<p>一个安静的通道并不自然导致所有人省时间。即使现实里安静与快速可以同时存在，这道词义题也只能用作者已经给出的解释来判断，不能自行给这个通道添加另一个优点。</p>\n<p><strong>作者用“给所有人省时间”解释通道效果，能不能把expedited理解为声音更安静？</strong></p>\n<p>不能。上下文的结果落在时间上，而quieter把比较的尺度换成了声音。</p>\n<p>A没有接上后一句给出的解释方向。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<hr />\n<h3>B. faster</h3>\n<blockquote>\n<p>更快的</p>\n</blockquote>\n<p>把B接回题干，它说的是：第五段的expedited意思最接近“更快的”。</p>\n<p>B的 <code>faster</code> 表示速度更快，后文的 <code>saving time for everyone involved</code> 表示给所有参与者省时间；两者能形成结果关系，所以回看背景审查、通道使用和时间节省这连续两句。</p>\n<blockquote>\n<p>Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p>原文先按是否通过背景审查分出一部分旅客，让他们有资格使用某类通道，再把检查注意力放在风险更高的人身上。这种安排带来的结果明写为 <code>saving time for everyone involved</code>。B的 <code>faster</code> 正好解释了通道怎样在时间上产生改善。</p>\n<p>这里不是见到time就机械选快，而是先检查它修饰的screening lanes，再看This指回的安排怎样省时。通道、分流、时间结果都接在一起，“更快的安检通道”能够顺着读下去，也没有额外引入价格或通道宽度。</p>\n<p><strong>把expedited换成faster，能不能让通道安排与后面的节省时间顺着接起来？</strong></p>\n<p>能。更快的安检通道与节省时间相对应，也能放回原来的名词短语中。</p>\n<p>B既符合被修饰的通道，又符合作者随后解释的效果。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<hr />\n<h3>C. wider</h3>\n<blockquote>\n<p>更宽的</p>\n</blockquote>\n<p>把C接回题干，它说的是：第五段的expedited意思最接近“更宽的”。</p>\n<p>C的 <code>wider</code> 说空间宽度；第五段的 <code>saving time</code> 说时间结果，因此回到描述通道使用条件的句子，看看通道的区别是空间变化还是检查安排。</p>\n<blockquote>\n<p>Passengers who pass a background check are eligible to use expedited screening lanes. This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p><code>wider</code> 需要的是更大的横向空间，而这两句给出的区别是“通过背景审查的人可以使用”。之后的This接着说把注意力放到高风险旅客上，最后落在 <code>saving time</code>，没有说通道被拓宽。</p>\n<p>第四段确实提过机场只有有限空间，但那是解释为什么普通安检能力受到限制，不能拿来给第五段这个形容词改意思。第五段恰恰提出一个不必匆忙招聘的做法；这里的通行差异来自预先审查和分流，而不是展示新旧两条通道有多宽。</p>\n<p><strong>有资格使用某类通道并让所有人省时，是否已经说明那条通道在空间上更宽？</strong></p>\n<p>不能。准入条件和时间结果都不等于宽度比较，原文也没有进行空间尺寸的对照。</p>\n<p>C把前文的空间话题搬来解释这里的通道性质，读错了当前句子的解释关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<hr />\n<h3>D. cheaper</h3>\n<blockquote>\n<p>更便宜的</p>\n</blockquote>\n<p>把D接回题干，它说的是：第五段的expedited意思最接近“更便宜的”。</p>\n<p>D的 <code>cheaper</code> 说花钱较少，而第五段的 <code>saving time</code> 明写节省的对象是时间，所以回看这句结果，不把“省”一概理解成省钱。</p>\n<blockquote>\n<p>This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.</p>\n</blockquote>\n<p><code>saving time</code> 中time是明确的宾语；D的 <code>cheaper</code> 却要把它解释成价格降低。原文介绍的是旅客通过背景审查后有资格走某类通道，以及这样怎样改变TSA分配检查注意力的方式，并没有拿两个收费水平来比较。</p>\n<p>时间节省当然可能给人带来实际好处，但好处不等于选项中的价钱便宜。这里问一个具体单词在第五段的意思，不能把通道使用的全部可能收益都装进这个形容词，更不能从“为所有人节省”里漏掉time。</p>\n<p><strong>saving后面明写time，能不能据此把expedited解释为价格更便宜？</strong></p>\n<p>不能。原文限定了节省时间，cheaper描述的则是货币成本，比较对象已经不同。</p>\n<p>D把省时换成省钱，不能完成这个词在句中的解释。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<hr />\n<h3>23题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<blockquote>\n<p><strong>23题选B。</strong></p>\n</blockquote>\n<hr />\n<h2>24题</h2>\n<blockquote>\n<p>One problem with the PreCheck program is ______.<br />\nPreCheck计划存在的一个问题是什么？</p>\n</blockquote>\n<p>题干给出PreCheck这个计划名称。第五段已经完整读过，往下第六段仍然反复出现PreCheck，并接着谈该计划的情况。现在把第六段完整读下来，再判断one problem所问的问题。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It has not gotten anywhere close to that, and one big reason is <span class=\"mask\">[xxx]</span> shock: Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level. But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.</p>\n<p>开始精读：</p>\n<p>It has not gotten anywhere close to that, / and one big reason is <span class=\"mask\">[xxx]</span> shock: / Passengers must pay $85 every five years / to process their background checks. / Since the beginning, this price tag has been PreCheck’s fatal flaw. / Upcoming reforms might bring the price to a more reasonable level. / But Congress should look into doing so directly, / by helping to finance PreCheck enrollment / or to cut costs in other ways.</p>\n<p>顺着英文顺序读：</p>\n<p>它还远没有接近那个数目， / 而一个很大的原因是 <span class=\"mask\">[xxx]</span> 冲击： / 旅客每五年必须支付85美元 / 来办理他们的背景审查。 / 从一开始，这个标价就是PreCheck的致命缺陷。 / 即将到来的改革可能把价格带到更合理的水平。 / 但是国会应该研究直接这样做， / 通过帮助资助PreCheck报名 / 或者用别的方式削减费用。</p>\n</blockquote>\n<hr />\n<h3>A. a dramatic <span class=\"mask\">[xxx]</span> of its scale</h3>\n<blockquote>\n<p>它的规模发生显著的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把A接回题干，它说的是：PreCheck计划的一个问题，是其规模出现显著的 <span class=\"mask\">[xxx]</span>。</p>\n<p>A的 <code>its scale</code> 指计划规模，第六段的 <code>not gotten anywhere close to that</code> 回接第五段的目标人数；两处都涉及参加计划的人数，因此把这句与25 million的目标放在一起看。</p>\n<blockquote>\n<p>The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>It has not gotten anywhere close to that, and one big reason is <span class=\"mask\">[xxx]</span> shock: Passengers must pay $85 every five years to process their background checks.</p>\n</blockquote>\n<p>第五段给的是TSA想达到的人数，第六段用 <code>not gotten anywhere close to that</code> 说实际情况还远没接近。A的 <code>its scale</code> 因而确实有一个人数层面的联系：报名计划涉及多少人，这在文中不是凭空出现的。</p>\n<p>但a dramatic后面是 <span class=\"mask\">[xxx]</span>，它是说规模发生何种情况的核心。不能把它当成自己熟悉的某个变化词，然后自行加上“以前如何、后来如何”。目前读清的是实际人数与目标有距离，不是A所含那个名词的具体意思。既不能因为scale眼熟就确认，也不能直接把这个未知名词规定成与原文相反。</p>\n<p><strong>知道参加人数远未接近目标，是否已经足够看清A对规模作出的完整判断？</strong></p>\n<p>还不能。scale与人数能接上，但dramatic后面的名词没有读清，无法确定A究竟怎样描述这一规模。</p>\n<p>A先留下，人数与目标之间的距离已经读清，但规模描述的核心名词还没有读清。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<hr />\n<h3>B. its wrongly-directed implementation</h3>\n<blockquote>\n<p>它方向错误的实施</p>\n</blockquote>\n<p>把B接回题干，它说的是：PreCheck计划的一个问题，是实施方向错误。</p>\n<p>B的 <code>wrongly-directed implementation</code> 批评实施方向，第五段的 <code>a win-win for travelers and the TSA</code> 评价计划安排的用途；因此先回看这个评价，再接第六段指出的具体障碍，比较到底错在方向还是卡在推行条件。</p>\n<blockquote>\n<p>PreCheck is supposed to be a win-win for travelers and the TSA.</p>\n<p>Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level.</p>\n</blockquote>\n<p>第五段说 <code>a win-win for travelers and the TSA</code>，随后解释通过背景审查的人走相应通道，TSA能关注高风险旅客，大家都省时间。这一安排的目标和基本方向得到了正面说明。B的 <code>wrongly-directed implementation</code> 则把问题说成实施朝错方向走。</p>\n<p>第六段并没有要求把目标或分流方向改掉，而是连续指向this price tag和更合理的价格。计划还没有达到目标人数，说明实施有障碍，不等于实施方向错误；同一计划可以方向可取，却因收费条件而推不动。B把“未充分实现”与“方向选错”混成了一个判断。</p>\n<p><strong>作者称计划按设想能双赢，却指出收费是缺陷，这是否等于否定其实施方向？</strong></p>\n<p>不等于。被要求调整的是报名费用，作者并未否定预检分流本身的作用。</p>\n<p>B把具体的价格障碍扩大为实施方向错误，与这两段对安排本身的评价不一致。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<hr />\n<h3>C. the government’s reluctance to back it</h3>\n<blockquote>\n<p>政府不愿支持它</p>\n</blockquote>\n<p>把C接回题干，它说的是：PreCheck计划的一个问题，是政府不愿意支持这个计划。</p>\n<p>C的 <code>government’s reluctance</code> 是政府的不愿意；第五段的 <code>The TSA wants to enroll</code> 写政府机构的意愿，因此回看这句，再接第六段给国会的建议，看建议是否等于已经存在的拒绝。</p>\n<blockquote>\n<p>The TSA wants to enroll 25 million people in PreCheck.</p>\n<p>But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.</p>\n</blockquote>\n<p><code>The TSA wants to enroll</code> 明说TSA想扩大报名人数。C却用 <code>government’s reluctance</code> 把政府态度在整体范围上概括成不愿支持，至少不能把这一机构主动扩大计划的意愿也算作不愿意。第六段则是Congress should，是作者要求国会研究怎样资助或降费，不是国会已经表态拒绝。</p>\n<p>应当做某事与不愿做某事之间不能直接画等号。前者可能是在建议提高力度、改变方式或加快行动；只有原文出现明确拒绝或消极意愿，才有理由写reluctance。这里实际写了TSA的目标以及国会可采取的具体方式，不能把未做到位一律转译成主观上不愿支持。</p>\n<p><strong>“国会应该直接帮助”能不能反推出“政府不愿支持”，并覆盖TSA已经表明的扩大意愿？</strong></p>\n<p>不能。should是建议，wants是已有意愿，两者都没有给出政府不愿支持这一事实。</p>\n<p>C把改进建议改成了政府态度，且将特定国会建议扩大到整个政府。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<hr />\n<h3>D. an <span class=\"mask\">[xxx]</span> price for enrollment</h3>\n<blockquote>\n<p>一个 <span class=\"mask\">[xxx]</span> 的报名价格</p>\n</blockquote>\n<p>把D接回题干，它说的是：PreCheck计划的一个问题，是报名价格 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的 <code>price for enrollment</code> 与第六段的 <code>this price tag</code> 都说参加预检的价格，所以回到每五年支付85美元这句，再看this price tag后面的评价和改价建议。</p>\n<blockquote>\n<p>Passengers must pay $85 every five years to process their background checks. Since the beginning, this price tag has been PreCheck’s fatal flaw. Upcoming reforms might bring the price to a more reasonable level.</p>\n</blockquote>\n<p><code>price for enrollment</code> 的对象能和 <code>this price tag</code> 接上。先有具体金额85美元，再由this指回这个金额，接着写它是fatal flaw，下一句又提出more reasonable level。这不是路过提了一笔钱，而是把费用放在计划缺陷和改革的连续说明中。</p>\n<p>不过D的形容词仍是 <span class=\"mask\">[xxx]</span>。本段已经能够确认作者认为收费需要改进，但不能把D那个未读清的词直接译成自己希望的意思。D有很强的价格联系；A也保留了人数规模方面的联系。先把两项各自说清的部分留住，尚未读清的判断不往里面填。</p>\n<p><strong>原文连续谈金额、价格缺陷和改价建议，能否让D进入候选，而不先补出其形容词？</strong></p>\n<p>能。报名价格正是本段明说的障碍所在，但D的具体评价词仍需结合后续整篇理解来判断。</p>\n<p>因此D保留，与A形成这一题暂时没有完全拉开的两项。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<hr />\n<h3>24题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D，先继续做后面的题。</p>\n<hr />\n<h2>25题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下列哪一项最适合作为本文的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Getting Stuck in Security Lines</strong></p>\n<p>困在安检长队中</p>\n<p>B. <strong>PreCheck—a Belated Solution</strong></p>\n<p>PreCheck——一个迟来的解决办法</p>\n<p>C. <strong>Less Screening for More Safety</strong></p>\n<p>更少的安检换来更高的安全</p>\n<p>D. <strong>Underused PreCheck Lanes</strong></p>\n<p>使用不足的PreCheck通道</p>\n<hr />\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>从提前两小时变成三小时写起，展示一些美国主要机场的安检队伍和旅客耗时。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>先承认旅客为安全愿意忍受安检，再写要求太多、回报太少以及浪费时间对生活的拖累。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>把一次秘密检查、其后的措施与航空出行增加接到长时间等待，并区分安保效果与眼前队伍。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>分别列出出行急增、安检通道空间有限和旅客为避托运费而采取的行李做法，后者仍有争议。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>提出让更多人加入PreCheck；预先通过背景审查后使用相应通道，让TSA关注高风险旅客并省时。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>说明人数远未接近目标，紧接85美元费用、fatal flaw和更合理价格，建议国会帮助降低费用。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>把资源配置与大多数旅客仍受不必要排队之苦放在一起，催促让计划真正起作用。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>A. Getting Stuck in Security Lines</h3>\n<blockquote>\n<p>困在安检长队中</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先让读者看到旅客被安检长队耽误，必须更早到机场。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明安全固然重要，但不能无视排队给旅客带来的代价。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着解释长队怎样在安保安排和出行增加中形成。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后拆开造成排队的几项现实原因。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着提出能够分流旅客、节省等待时间的预检办法。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再解释为什么这个缓解长队的办法还没有充分起作用。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求改善资源使用，让多数旅客不再继续承受不必要的等待。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>A的Getting Stuck先对应开头旅客需要提前两三小时，再对应后文long waits和结尾unnecessary lines。它并不是只概括“排队”一个名词：第二段讨论为什么不能让旅客承担无限时间代价，第三、四段说明长队成因，第五、六段找办法并解释办法受阻，都是在处理同一个等待问题。</p>\n<p>后半篇的PreCheck不必被标题逐字点名，因为它是作者为长队问题提出的解决工具。把A代入七行，前面的现象、原因和后面的方案、障碍、催促能够按顺序相接，没有哪一大块需要另找文章中心。</p>\n<p><strong>标题说“困在长队中”，能否同时容纳作者后来寻找减少等待的办法？</strong></p>\n<p>能。解决办法始终在回应这个被困的问题，而不是另换成一个与长队无关的新话题。A保留。</p>\n<hr />\n<h3>B. PreCheck—a Belated Solution</h3>\n<blockquote>\n<p>PreCheck——一个迟来的解决办法</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先以排队为背景，引出一个本来早该出现却迟迟没有出现的解决办法。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明旅客为什么迫切需要这个办法，突出迟到所带来的代价。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着交代为什么发现安保问题后仍没有及时拿出预检方案。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后分析提出预检方案被拖延的几个原因。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着宣布PreCheck终于作为新方案出现。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再说明这个刚出现的方案还需要完善哪些配套条件。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后肯定迟来的办法，并要求把它推行起来。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>B最吸引人的地方是PreCheck确实占了后三段。但a Belated Solution不仅点名方案，还把“迟来”作为对方案的关键判断。若按B写，第三、四段理应解释为什么这个办法迟迟未出现，第五段理应突出它终于被提出；实际第三、四段主要解释机场长队，第五段介绍的是一个已经有名称、通道和报名目标的现成计划。</p>\n<p>第六段说没接近报名目标，并批评费用，不等于说方案本身刚刚出现。结尾long past time催促它真正发挥作用，也不能自动倒回成“提出方案太迟”。方案出现得迟，与已有方案迟迟没有做好，是不同时间关系。</p>\n<p><strong>已有计划应当早日运转好，是否等于作者在介绍一个刚刚迟到的方案？</strong></p>\n<p>不等于。B把改善迫切性改成方案出现的时间判断，并缩掉前半篇大量独立的长队分析，排除。</p>\n<hr />\n<h3>C. Less Screening for More Safety</h3>\n<blockquote>\n<p>更少的安检换来更高的安全</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先展示检查过多怎样导致问题，为减少安检作铺垫。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再比较检查数量与安全，说明检查并非越多越安全。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着给出减少检查反而提高安全的事实对照。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后解释为什么更少检查会带来更安全的结果。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着提出减少检查次数或项目的具体办法。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再指出落实少检查方案遇到的障碍。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后明确倡议通过减少安检来提高安全。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>C同时出现Screening与Safety，看上去贴近第二段的安全交换，也容易让人联想到第五段的分流。然而Less Screening for More Safety要求全文建立一个很具体的方向：检查更少，所以安全更高。实际第五段明写的是让TSA关注风险更高的人、给所有人省时间，没有比较减少检查前后安全提高多少。</p>\n<p>第三段还特意说安保变得怎样的效果尚不清楚，眼前能看到的是队伍。若选择C，就要把未确定的安全结果改成标题里的肯定收益。七行对照下来，成因、收费、报名规模的说明也并不是围绕“减少检查次数”安排的。</p>\n<p><strong>更有针对性地分配检查注意力，能否直接概括为少做安检便得到更多安全？</strong></p>\n<p>不能。C增加了原文没有建立的检查数量与安全提升关系，排除。</p>\n<hr />\n<h3>D. Underused PreCheck Lanes</h3>\n<blockquote>\n<p>使用不足的PreCheck通道</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先直接展示PreCheck通道空闲或利用不足这一现象。</td>\n  <td>先摆出眼前的问题</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明这些通道利用不足对安全与旅客的影响。</td>\n  <td>再说为什么不能只看一头</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着交代预检通道为何逐渐变得利用不足。</td>\n  <td>接着交代事情怎么变成这样</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后列出影响这些通道利用率的几项原因。</td>\n  <td>然后把几个原因分开说</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>接着提出增加预检通道利用率的办法。</td>\n  <td>接着提出一个可行的办法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>再解释参与费用如何限制利用率。</td>\n  <td>再说这个办法卡在哪里</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求把这些具体通道充分用起来。</td>\n  <td>最后说该让办法真正起作用了</td>\n</tr>\n</tbody>\n</table>\n<p>D在结尾能找到接近的画面：预检通道与大多数旅客排队形成对照，第六段也说报名人数不足。但把D代入全文，第一至四段就都应当围绕预检通道利用率展开；实际这些段先讨论美国机场普遍的安检队伍、旅客时间代价和多种原因，PreCheck到第五段才作为办法进入。</p>\n<p>这并不是“标题出现得晚就一定错”。真正的问题是D把解决办法中一个局部的使用状态，抬成覆盖全部段落的中心。前面的空间限制、航空出行增加和安检代价，不能都改写成预检通道利用不足的成因，否则就改变了作者本来的展开对象。</p>\n<p><strong>后三段涉及的预检利用问题，能否替代前四段已经建立的整个安检长队问题？</strong></p>\n<p>不能。D覆盖一个具体障碍，却装不下全文为何讨论它，排除。</p>\n<hr />\n<h3>25题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，A能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>25题选A。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Getting Stuck in Security Lines / 困在安检长队中</strong></p>\n<hr />\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<hr />\n<h2>回查24题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. a dramatic <span class=\"mask\">[xxx]</span> of its scale</li>\n<li>D. an <span class=\"mask\">[xxx]</span> price for enrollment</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Getting Stuck in Security Lines / 困在安检长队中</strong></p>\n</blockquote>\n<p>也就是：文章始终在追问多数旅客为什么还困在安检长队中，后面的PreCheck是为了让这些等待得到缓解。</p>\n<p>第一遍读第六段时，A的scale可以联系到实际人数远未接近两千五百万的目标；D的price for enrollment可以联系到每五年85美元的费用。A对规模究竟说了什么，D对价格用了什么评价，都有一处没有读清，所以两项都留下来。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A说PreCheck的问题是规模发生显著的 <span class=\"mask\">[xxx]</span>；D说问题是报名价格 <span class=\"mask\">[xxx]</span>。两项不能擅自补译。现在能够比较的是：A把判断落在人数规模，D把判断落在报名条件。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。为了缓解长队，第五段提出让更多人加入PreCheck；第六段说没接近目标，是先摆出办法尚未达到的结果。只停在“参加的人不够多”，还没有回答这个办法为何没有发挥应有作用。A可以贴住这个结果，但其未知名词不能凭空变成一条说明规模如何变化的事实。</p>\n<p>再看D。文章在人数不足之后立刻用one big reason接85美元费用，又把this price tag称为fatal flaw，并要求更合理的价格及cut costs。收费这件事不仅在本段被连续展开，也能接回全文的问题：原本用于省时的预检计划需要更多人参加，而报名条件正是作者要求着手处理的地方。D抓住的是这项办法推不动时被明确解释、被要求修改的环节。</p>\n<p>因此，与A停在规模状态相比，D在“长队—提出分流办法—报名条件需要改进”这个推进里获得了更充分的支持。主旨帮助确定作者此处着力说明的层次，并没有替我们揭开两个 <span class=\"mask\">[xxx]</span>。这一轮按原文对价格的集中评价与改进要求选择D。</p>\n<blockquote>\n<p><strong>24题选D。</strong></p>\n</blockquote>\n<hr />\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>21题：B</strong> — explain American’s tolerance of current security checks（解释美国人对当前安检的容忍）</li>\n<li><strong>22题：C</strong> — An increase in the number of travelers.（旅客数量的增加）</li>\n<li><strong>23题：B</strong> — faster（更快的）</li>\n<li><strong>24题：D</strong> — an <span class=\"mask\">[xxx]</span> price for enrollment（一个 <span class=\"mask\">[xxx]</span> 的报名价格）</li>\n<li><strong>25题：A</strong> — Getting Stuck in Security Lines（困在安检长队中）</li>\n</ul>\n<p>本篇答案：<strong>BCBDA</strong>。</p>\n","analysisStartIndex":38,"maskInventory":{"token":"[xxx]","count":126},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdj
